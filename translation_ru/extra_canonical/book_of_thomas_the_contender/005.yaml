  text: 'Thomas replied, “What can we say after these things? What can we say to the blind? What teaching should we communicate to these pitiable mortals who say, ‘We came here to [do] good and not to curse,’ and yet [say], ‘If we had not been begotten in the flesh, we would never have known [sin]’?”


    The Savior said, “Truly, regarding [those], do not consider them human, but consider them [as] animals, because just as animals eat each other, so these people also eat each other. It is exactly the opposite: they have forfeited [the kingdom] through their love, the sweet fire, becoming servants of death and rushing to perform deeds of decay. They practice the lust of their ancestors. They will be cast down into the abyss to suffer the torment of the bitter evil of their nature, because they will be whipped, making them run backward to where they cannot see, and they [will be separated] from their limbs, not enduring it bravely, but [in] despair. And they are glad because [. . .] insanity and irrationality [. . .] [They] pursue this irrationality without recognizing [their insanity, believing] that they [are] wise. [They . . .] their body [. . .] [] Their mind is selfishly directed, because their thinking is preoccupied with their actions, but the fire will scorch them.”


    Thomas replied, “Lord, what will the person cast down to them do? I am deeply concerned for them, since many attack them.”


    The Savior answered, “What do you yourself think?”


    Judas, called Thomas, said, “Lord, it is right for you to speak and for me to listen.”


    The Savior replied, “Pay attention to what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. After much time has passed, they will reveal the fruit of evil trees, being reproved and killed in the mouths of animals and humans, driven on by the rains, winds, air, and the light shining from above.”


    Thomas replied, “Without a doubt, you have convinced us, Lord. We know in our hearts, and it is clear that this [is the case] and that your word is sufficient. Yet these words you speak to us are laughable and detestable to the world because they are misinterpreted. So how can we go and preach them, since we are [not] respected [in] the world?”


    The Savior replied, “Truly I tell you, whoever hears [your] word and rejects it, mocks it, or laughs at these matters—truly I tell you, he will be handed over to the ruler on high, who rules as king over every power. He will spin that person around in circles and cast him out of heaven and down into the abyss, and he will be confined in a narrow, gloomy place. Furthermore, he will be unable to turn or move because of the tremendous depth of Tartaros and the [ponderous bitterness] of unwavering Hades. [. . .] them to it [. . .] they will not forgive [. . .] chase you. They will hand [. . .] over to [. . .] angel Tartarouchos [. . .] fire chasing them. [] [. . .] fiery whips that spew a shower of sparks into the face of the one being chased.


    If he runs to the west, he will encounter the fire.


    If he runs to the south, he will encounter it there too.


    If he turns to the north, the danger of boiling fire will meet him again.


    Nor will he find a way to the east to flee there and be rescued.


    Because he did not find it in the day when he lived in the body, he will not find it on the day of judgment.”'
translation:
  language: ru
  text: 'Фома ответил: «Что мы можем сказать после всего этого? Что мы можем сказать слепым? Какое учение нам передать этим жалким смертным, которые говорят: „Мы пришли сюда, чтобы [делать] добро, а не проклинать“, — и всё же [говорят]: „Если бы мы не были рождены во плоти, то никогда не познали бы [греха]“?»


    Спаситель сказал: «Истинно говорю: [этих] не считайте людьми, но считайте [их] животными, потому что, как животные пожирают друг друга, так и подобные люди пожирают друг друга. Всё как раз наоборот: из-за своей любви — сладостного огня — они лишились [Царства], стали рабами смерти и устремились совершать дела тления. Они предаются похоти своих предков. Их низвергнут в бездну, где они претерпят мучение от горького зла собственной природы. Их будут бичевать, заставляя пятиться туда, куда они не могут видеть, и они [будут отделены] от своих членов, перенося это не мужественно, но [в] отчаянии. И они радуются, потому что […] безумие и неразумие […] [Они] гонятся за этим неразумием, не осознавая [своего безумия и полагая], что они мудры. [Они…] своё тело […] [][a] Их ум направлен на самих себя, потому что их мысли заняты их делами, но огонь опалит их».


    Фома ответил: «Господи, что будет делать человек, низвергнутый к ним? Я очень тревожусь за них, ведь многие нападают на них».


    Спаситель ответил: «А ты сам как думаешь?»


    Иуда, называемый Фомой, сказал: «Господи, правильно, чтобы Ты говорил, а я слушал».


    Спаситель ответил: «Внимай тому, что Я скажу тебе, и верь тому, что истинно. Сеющее и посеянное исчезнут в огне — в огне и воде, — и укроются в тёмных могилах. Когда же пройдёт много времени, они явят плод злых деревьев: их обличат и умертвят в пастях животных и людей, гонимых дождями, ветрами, воздухом и светом, сияющим свыше».


    Фома ответил: «Несомненно, Ты убедил нас, Господи. Мы знаем это в своём сердце; ясно, что это [так] и что Твоего слова достаточно. Однако слова, которые Ты говоришь нам, миру кажутся смешными и отвратительными, потому что их толкуют превратно. Как же нам идти и проповедовать их, если нас [не] уважают [в] мире?»


    Спаситель ответил: «Истинно говорю вам: всякий, кто услышит [ваше] слово и отвергнет его, или станет глумиться над ним, или смеяться над этим, — истинно говорю вам, — будет предан вышнему правителю, который царствует над всякой властью. Тот закружит его и низвергнет с неба в бездну, и он будет заключён в тесном, мрачном месте. Он не сможет ни повернуться, ни пошевелиться из-за неизмеримой глубины Тартара[b] и [тяжкой горечи] непреклонного Аида[c]. […] их к нему […] они не простят […] преследовать вас. Они предадут […] ангелу Тартаруху[d] […] огонь, преследующий их. [][a] […] огненные бичи, извергающие ливень искр в лицо преследуемого.


    Если он побежит на запад, то встретит огонь.


    Если побежит на юг, то встретит его и там.


    Если повернёт на север, его снова встретит угроза кипящего огня.


    И на востоке он не найдёт пути, чтобы бежать туда и спастись.


    Поскольку он не нашёл этого в тот день, когда жил в теле, то не найдёт и в День суда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пустые квадратные скобки и многоточия отмечают лакуны — утраченные или неразборчивые места рукописи; слова в квадратных скобках представляют редакторское восстановление.
    reason: Необходимо различить повреждение рукописи и предположительно восстановленный текст.
  - marker: b
    text: Тартар — древнее название глубочайшего места заключения и наказания.
    reason: Редкий древний термин может быть непонятен современному читателю.
  - marker: c
    text: Аид — древнее название мира мёртвых; здесь оно сохранено отдельно от Тартара.
    reason: Позволяет не смешивать два разных термина исходного свидетельства.
  - marker: d
    text: Тартарух — передача редкого имени или титула ангела, связанного с Тартаром; точное значение не вполне ясно.
    reason: Транслитерированный термин требует краткого пояснения без спекулятивного толкования.
lexical_decisions:
- source_word: Savior
  choice: Спаситель
  rationale: Сохраняет титул исходного свидетельства и естественно звучит в русском религиозном повествовании.
- source_word: sweet fire
  choice: сладостный огонь
  rationale: Сохранён необычный и неоднозначный образ без попытки истолковать его как конкретную страсть или наказание.
- source_word: deeds of decay
  choice: дела тления
  rationale: Передаёт телесно-эсхатологическую окраску выражения и не сводит его просто к «злым делам».
- source_word: Tartaros
  choice: Тартар
  rationale: Использована принятая русская форма древнего названия места наказания; термин не отождествлён без пояснений с иными понятиями.
- source_word: Hades
  choice: Аид
  rationale: Сохраняется отдельный древний термин, а не конфессионально нагруженное «ад».
- source_word: Tartarouchos
  choice: Тартарух
  rationale: Редкое имя/титул передано транслитерацией ввиду отсутствия надёжного русского функционального эквивалента.
- source_word: what sows and what is sown
  choice: сеющее и посеянное
  rationale: Сохранена грамматическая и смысловая загадочность свидетельства, без замены на предположительное «сеятель и семя».
theological_decisions:
- issue: Объект утраты в выражении «forfeited [the kingdom]»
  choice: лишились [Царства]
  alternative: лишились царства / утратили [Царство]
  rationale: Редакторское восстановление сохранено в квадратных скобках; прописная буква указывает на эсхатологический смысл, но не устраняет текстовую неопределённость.
- issue: Связь выражения «сладостный огонь» с любовью
  choice: из-за своей любви — сладостного огня — они лишились [Царства]
  alternative: они лишились [Царства] своей любовью к сладостному огню
  rationale: Пунктуация сохраняет возможность того, что «сладостный огонь» является приложением к любви; не навязывается иное богословское толкование.
- issue: Тартар и Аид
  choice: сохранены как два отдельных термина
  alternative: оба перевести словом «ад»
  rationale: Так не стирается различие образов в свидетельстве и не импортируется позднейшая систематизация загробного наказания.
- issue: Природа суда и наказания
  choice: образы переданы буквально и без смягчения
  alternative: обобщить как духовное осуждение
  rationale: Текст использует телесные и космологические образы; перевод не должен заранее решать, буквальны они или метафоричны.
- issue: Местоименная неоднозначность во фрагменте о человеке, низвергнутом «к ним»
  choice: сохранены «человек», «к ним», «за них»
  alternative: уточнить, что речь идёт о грешнике либо праведнике среди нападающих
  rationale: Контекст повреждён или неясен, поэтому референты не конкретизированы.
translation_notes:
  register: 'Современный литературный русский с достоинством религиозного диалога; синтаксис по возможности упрощён для ясности, но резкие образы, повторы, подлинная неоднозначность, лакуны и редакторские восстановления сохранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,7 ещё требуется.'
