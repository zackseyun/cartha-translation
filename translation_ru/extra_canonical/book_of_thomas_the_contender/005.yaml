    Фома ответил: «Господи, что будет делать человек, низвергнутый к ним? Я очень тревожусь за них, ведь многие нападают на них».


    Спаситель ответил: «А ты сам как думаешь?»


    Иуда, называемый Фомой, сказал: «Господи, правильно, чтобы Ты говорил, а я слушал».


    Спаситель ответил: «Внимай тому, что Я скажу тебе, и верь тому, что истинно. Сеющее и посеянное исчезнут в огне — в огне и воде, — и укроются в тёмных могилах. Когда же пройдёт много времени, они явят плод злых деревьев, будучи обличаемы и умерщвляемы в пастях животных и людей, гонимые дождями, ветрами, воздухом и светом, сияющим свыше».


    Фома ответил: «Несомненно, Ты убедил нас, Господи. Мы знаем это в своём сердце; ясно, что это [так] и что Твоего слова достаточно. Однако слова, которые Ты говоришь нам, миру кажутся смешными и отвратительными, потому что их толкуют превратно. Как же нам идти и проповедовать их, если нас [не] уважают [в] мире?»


    Спаситель ответил: «Истинно говорю вам: всякий, кто услышит [ваше] слово и отвергнет его, или станет глумиться над ним, или смеяться над этим, — истинно говорю вам, — будет предан вышнему правителю, который царствует над всякой властью. Тот закружит его и низвергнет с неба в бездну, и он будет заключён в тесном, мрачном месте. Он не сможет ни повернуться, ни пошевелиться из-за неизмеримой глубины Тартара[b] и [тяжкой горечи] непреклонного Аида[c]. […] их к нему […] они не простят […] преследовать вас. Они предадут […] ангелу Тартаруху[d] […] огонь, преследующий их. [][a] […] огненные бичи, извергающие ливень искр в лицо преследуемого.


    Если он побежит на запад, то встретит огонь.


    Если побежит на юг, то встретит его и там.


    Если повернёт на север, его снова встретит угроза кипящего огня.


    И на востоке он не найдёт пути, чтобы бежать туда и спастись.


    Поскольку он не нашёл этого в тот день, когда жил в теле, то не найдёт и в День суда».'
