review_pass:
  verdict: revise
  source_fidelity: Перевод в целом точно следует предоставленному английскому свидетельству и бережно сохраняет его неоднозначности. Однако «Наблюдайте за собой» сужает значение Watch до самонаблюдения; более нейтральное «Будьте бдительны» точнее. В заключительном колофоне заголовочные строки следует соединить как единое название произведения, не меняя их содержания.
  naturalness: Русский текст в основном литературен и выдержан в умеренно торжественном регистре. «Любовь, которую являет им их Господь» допускает более естественный порядок слов. «Книга Фомы / Состязателя» при разбиении на две строки читается не вполне гладко; «Книга Фомы Состязателя» естественнее как заглавие.
  terminology: Ключевые обозначения «плоть», «плен», «покой», «Благой» и «Царь» сохранены. «Телесные влечения» передаёт appetites шире и нейтральнее, чем «вожделения», не сводя их к сексуальному желанию. Примечание к «заранее знающие» необходимо сохранить ввиду отсутствия прямой сверки с коптским текстом.
  issues:
  - severity: medium
    issue: «Наблюдайте за собой» вместо Watch
    rationale: Формулировка добавляет рефлексивный объект («за собой»), которого в свидетельстве нет, и тем самым интерпретирует общий призыв к бодрствованию как призыв именно к самоконтролю.
  - severity: low
    issue: Не вполне естественный порядок слов в выражении о любви Господа
    rationale: «За любовь, которую являет им их Господь» грамматически возможно, но тяжеловесно. Перестановка «которую их Господь являет им» сохраняет референцию местоимений и улучшает читаемость.
  - severity: low
    issue: Разделённое заглавие «Книга Фомы / Состязателя»
    rationale: Слова составляют единое наименование и в русском лучше читаются как «Книга Фомы Состязателя»; отдельная строка «Состязателя» выглядит как неполная синтаксическая группа.
