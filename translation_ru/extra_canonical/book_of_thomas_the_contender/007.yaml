  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: ru
  text: '«Блаженны вы, заранее знающие[a], что может заставить вас споткнуться, и избегающие чуждого.


    Блаженны вы, кого оскорбляют и не уважают за любовь, которую являет им их Господь.


    Блаженны вы, кто плачет и терпит гонения от лишённых надежды, ибо вы будете освобождены от всякого плена.


    Наблюдайте за собой и молитесь, чтобы вам не пребывать во плоти, но покинуть горький плен этой жизни. И когда вы молитесь, то обретёте покой, потому что оставили страдание и позор. Ибо, когда вы оставите телесные страдания и вожделения, вы обретёте покой от Благого и будете царствовать с Царём — вы и Он, соединённые друг с другом, — отныне и во веки веков. Аминь».


    Книга Фомы


    Состязателя


    Послание зрелым


    Вспоминайте и меня, братья мои,


    в своих молитвах.


    Мир святым


    и принадлежащим духу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предварительный перевод по доступному английскому свидетельству; прямая сверка с коптским текстом Наг-Хаммади II,7 ещё не проведена. Свидетельство отмечает, что употреблённый здесь глагол, который нередко переводят как «сопровождать», в данном контексте, вероятно, имеет познавательный смысл.
    reason: Отмечает ограниченность источниковой базы и существенную лексическую неоднозначность, влияющую на перевод первой заповеди блаженства.
lexical_decisions:
- source_word: have knowledge beforehand
  choice: заранее знающие
  rationale: Передаёт когнитивный смысл, отмеченный в свидетельстве, и не сводит выражение к физическому сопровождению; ввиду отсутствия прямой коптологической сверки снабжено примечанием.
- source_word: what can trip you up
  choice: что может заставить вас споткнуться
  rationale: Сохраняет образ преткновения и одновременно остаётся понятным современному читателю.
- source_word: strange things
  choice: чуждого
  rationale: «Чуждое» естественнее буквального «странные вещи» и сохраняет широкий, неуточнённый смысл того, чего следует избегать.
- source_word: existing in the flesh
  choice: пребывать во плоти
  rationale: Сохраняет термин «плоть» и его аскетико-антропологическую напряжённость, не подменяя его толкованием вроде «жить греховно».
- source_word: repose / rest
  choice: покой
  rationale: Последовательно передаёт повторяющееся ключевое понятие и подходит как для освобождения от страдания, так и для эсхатологического покоя.
- source_word: the Good One
  choice: Благой
  rationale: Сохраняет субстантивированное именование с определённым артиклем и возможную отсылку к Богу, не заменяя её более конкретным титулом.
- source_word: the Mature
  choice: зрелым
  rationale: Передаёт духовную или интеллектуальную зрелость адресатов без внесения специального конфессионального термина.
- source_word: those of the spirit
  choice: принадлежащим духу
  rationale: Сохраняет родительный оборот и его неоднозначность; не отождествляет адресатов безоговорочно с «духовными людьми» как установленной группой.
theological_decisions:
- issue: Смысл призыва не пребывать во плоти
  choice: не пребывать во плоти
  alternative: не жить по плоти / избегать телесной жизни
  rationale: Выбранная формулировка сохраняет радикальный язык текста и не решает заранее, идёт ли речь о нравственном образе жизни, телесном существовании или аскетическом отрешении.
- issue: Источник покоя
  choice: обретёте покой от Благого
  alternative: Благой дарует вам покой
  rationale: Сохранена грамматическая неоднозначность отношения между покоем и Благим; добавление явного действия «дарует» было бы интерпретацией.
- issue: Единение с Царём
  choice: вы и Он, соединённые друг с другом
  alternative: соединившись с Ним / став с Ним одним
  rationale: Передана взаимность единения без утверждения онтологического тождества человека и Царя.
- issue: «Лишённые надежды» как гонители
  choice: терпит гонения от лишённых надежды
  alternative: гонимы безнадёжными людьми
  rationale: Формулировка сохраняет характеристику гонителей, не уточняя, означает ли она отсутствие земной, духовной или эсхатологической надежды.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Сохранены повтор «Блаженны вы», ключевые образы плоти, плена, покоя, Благого и Царя, а также композиция колофона. Архаизмы ограничены устойчивыми сакральными формулами «во плоти», «отныне» и «во веки веков».
