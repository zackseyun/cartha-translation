  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: ru
  text: '[] Тайные изречения, которые Спаситель произнёс Иуде Фоме и которые я — да, я, Матфий — записал, идя рядом и слушая, как они беседовали друг с другом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству; прямая сверка с коптским текстом ещё не проведена. Имя, переданное здесь как «Матфий», в англоязычном свидетельстве написано Mathaias.'
    reason: Необходимо прозрачно обозначить косвенную основу перевода и связанную с ней неопределённость передачи имени.
lexical_decisions:
- source_word: secret sayings
  choice: тайные изречения
  rationale: 'Сохраняет жанровую и смысловую окраску свидетельства: речь идёт о сокровенных речениях, а не просто о скрытой беседе.'
- source_word: Savior
  choice: Спаситель
  rationale: Устоявшийся и понятный русский религиозный эквивалент титула.
- source_word: Judas Thomas
  choice: Иуда Фома
  rationale: Сохраняет оба имени в принятой русской библейской форме, не устраняя возможную значимость двойного именования.
- source_word: Mathaias
  choice: Матфий
  rationale: Передаёт имя традиционной русской формой; из-за возможной неопределённости написания это решение пояснено в сноске.
- source_word: while I was walking
  choice: идя рядом
  rationale: Естественно связывает действие рассказчика с последующим слушанием беседы, не уточняя направления или места, которых свидетельство не называет.
- source_word: speak with one another
  choice: беседовали друг с другом
  rationale: Передаёт взаимный разговор двух лиц естественным современным русским языком.
theological_decisions:
- issue: Характер «тайных изречений»
  choice: тайные изречения
  alternative: сокровенные слова
  rationale: Формулировка не определяет ни эзотерический статус текста, ни причину его тайности, сохраняя напряжение исходного свидетельства.
- issue: Соотношение имён «Иуда» и «Фома»
  choice: Иуда Фома
  alternative: Иуда, называемый Фомой
  rationale: Свидетельство даёт двойное именование без пояснения; перевод не добавляет интерпретации их соотношения.
- issue: Усиленное самообозначение автора
  choice: я — да, я, Матфий —
  alternative: я, Матфий
  rationale: Сохранён эмфатический повтор «I, yes I», подчёркивающий заявление рассказчика об авторстве записи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сделан ясным для широкого читателя; усиленное авторское «я» и неоднозначность двойного имени сохранены. Начальный знак лакуны [] оставлен в соответствии с предоставленным свидетельством.
