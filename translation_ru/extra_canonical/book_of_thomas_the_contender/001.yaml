  source_fidelity: 'Перевод в целом точно передаёт предоставленное англоязычное свидетельство: сохранены лакуна, «тайные изречения», титул «Спаситель», двойное имя «Иуда Фома», усиленное «я — да, я» и взаимность разговора. Однако «идя рядом» добавляет пространственное значение («рядом»), отсутствующее в свидетельстве, где сказано лишь, что рассказчик шёл.'
  naturalness: Синтаксис в целом литературный и ясный. Замена «идя рядом» на «когда шёл» устраняет добавленную деталь и сохраняет естественное русское выражение временного обстоятельства.
  terminology: «Тайные изречения», «Спаситель», «Иуда Фома» и «Матфий» приемлемы для данного предварительного перевода. Имя Mathaias обоснованно оговорено в сноске, поскольку прямое сравнение с коптским текстом ещё не проводилось.
  issues:
  - severity: medium
    issue: Добавлено значение «рядом» в обороте «идя рядом».
    rationale: Английское witness reading «while I was walking» сообщает только о том, что повествователь шёл; оно не указывает, что он шёл рядом с собеседниками. Добавление меняет пространственные отношения в сцене.
  revised_text: '[] Тайные изречения, которые Спаситель произнёс Иуде Фоме и которые я — да, я, Матфий — записал, когда шёл, слушая, как они беседовали друг с другом.[a]'
