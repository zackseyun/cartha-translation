base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: ru
  text: '**Фрагмент XI**


    Но вот что говорит Папий — цитирую его слово в слово:


    «Некоторым из них — очевидно, ангелам, которые первоначально были святы, — Он дал власть и над устроением мироздания и поручил им хорошо осуществлять эту власть».


    А затем он говорит:


    «Но случилось так, что их строй распался: ведь великий дракон, древний змей, называемый также сатаной и дьяволом, был низвержен — низвержен на землю вместе со своими ангелами».[a]


    Андрей Кесарийский, *Толкование на Апокалипсис*, гл. 34, беседа 12.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: данный фрагмент подготовлен по опубликованному английскому свидетельству Дж. Б. Лайтфута; прямая сверка с греческим текстом позднего источника ещё требуется. Повреждения распознанного текста в словах «great», «devil» и «his» восстановлены по очевидному смыслу и параллельной формулировке Откр. 12:9.'
    reason: Предоставленный источник обозначен как англоязычное публичнодоменное свидетельство, а проверка древнегреческого текста пока не выполнена; читателю необходимо сообщить о временном ограничении текстовой основы и о восстановлении OCR-пропусков.
lexical_decisions:
- source_word: some of them
  choice: некоторым из них
  rationale: Сохранена неопределённость местоименной отсылки; последующее пояснение отождествляет их с ангелами.
- source_word: the arrangement of the universe
  choice: устроение мироздания
  rationale: «Устроение» передаёт идею упорядочения или управления космосом, а «мироздание» звучит естественно и достойно в современном русском.
- source_word: exercise their dominion well
  choice: хорошо осуществлять эту власть
  rationale: Передаёт как поручение властвовать, так и требование исполнять его надлежащим образом, не добавляя нравственных или конфессиональных уточнений.
- source_word: their array came to nought
  choice: их строй распался
  rationale: «Строй» сохраняет образ упорядоченного чина или порядка, а «распался» естественно выражает его крушение без чрезмерного истолкования.
- source_word: was cast down, yea, and was cast down to the earth
  choice: был низвержен — низвержен на землю
  rationale: Сохранены повтор и усиление исходного свидетельства, но фраза оформлена естественно по-русски.
theological_decisions:
- issue: Личность того, кто дал ангелам власть
  choice: местоимение «Он» сохранено без поясняющего имени
  alternative: «Бог дал»
  rationale: Свидетельство использует местоимение, а ближайший контекст не приведён; подстановка имени молча сняла бы возможную текстовую неоднозначность.
- issue: Характер первоначальной святости ангелов
  choice: «которые первоначально были святы»
  alternative: «прежде святые ангелы»
  rationale: Формулировка сохраняет временное противопоставление их первоначального состояния последующему падению, не развивая особого учения о природе ангелов.
- issue: Связь распада строя ангелов с низвержением дракона
  choice: сохранена причинная связка «ведь»
  alternative: разделить утверждения без причинной связи
  rationale: Так передана логика доступного свидетельства, не уточняя сверх текста, каким именно образом падение дракона привело к распаду их строя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным патристическим звучанием. Синтаксис упрощён лишь настолько, чтобы цитата оставалась ясной обычному читателю; повтор при описании низвержения и неоднозначность местоимения сохранены. Латинское название источника передано по-русски.
