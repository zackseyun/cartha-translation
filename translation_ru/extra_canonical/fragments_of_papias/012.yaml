base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: ru
  text: 'Тех, кто был чистосердечен перед Богом, они обычно называли детьми, как свидетельствует и Папий в первой книге «Толкований изречений Господа», а также Климент Александрийский в «Педагоге».


    — Максим Исповедник, «Схолии к сочинениям Дионисия Ареопагита», «О церковной иерархии», глава 2.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: practised guilelessness towards God
  choice: был чистосердечен перед Богом
  rationale: «Чистосердечен» естественно передаёт отсутствие лукавства и притворства, сохраняя нравственно-религиозный смысл выражения; формулировка остаётся предварительной, поскольку древний оригинал не предоставлен.
- source_word: children
  choice: детьми
  rationale: Прямое и контекстуально ясное соответствие; не уточняется, идёт ли речь о духовном статусе, поскольку свидетель сохраняет это без пояснения.
- source_word: Expositions of the Lord
  choice: «Толкований изречений Господа»
  rationale: Устоявшаяся и смыслово точная передача названия труда Папия, традиционно связываемого с толкованием Господних изречений.
- source_word: Paedagogue
  choice: «Педагоге»
  rationale: Сохранено принятое русское название сочинения Климента Александрийского.
theological_decisions:
- issue: Смысл наименования «детьми»
  choice: Сохранить слово без богословского пояснения
  alternative: Передать как «чадами Божьими» или «духовными детьми»
  rationale: Исходное свидетель не содержит уточнений; расширенный вариант привнёс бы отсутствующее в тексте толкование.
- issue: Оттенок guilelessness
  choice: «чистосердечен»
  alternative: «чужд лукавства» / «простодушен»
  rationale: Выбранный вариант передаёт искренность и отсутствие коварства, не создавая у современного читателя нежелательного оттенка наивности, возможного у слова «простодушен».
translation_notes:
  register: 'Современный литературный русский язык с достоинством патристической цитаты. Синтаксис слегка упрощён ради ясности. Атрибуция оформлена отдельно. Перевод предварительный: в предоставленных данных имеется лишь английское свидетельство, а проверка по греческому или латинскому тексту ещё не проведена.'
