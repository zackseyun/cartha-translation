lexical_decisions:
- source_word: taken in adultery
  choice: уличённую в прелюбодеянии / застали при совершении прелюбодеяния
  rationale: Первое выражение естественно вводит женщину в повествование, а второе передаёт усиление «in the very act», не добавляя отсутствующих подробностей.
- source_word: Master
  choice: Учитель
  rationale: Современное и контекстуально точное обращение к Иисусу как наставнику.
- source_word: tempting Him
  choice: испытывая Его
  rationale: Сохраняет смысл враждебной проверки, не сужая его до современного значения «искушать ко греху».
- source_word: is without sin
  choice: без греха
  rationale: Сохраняет широкую формулировку свидетеля и не уточняет, идёт ли речь именно об этом грехе.
- source_word: condemn
  choice: осудил / осуждаю
  rationale: Сохраняет юридико-нравственную многозначность реплики.
- source_word: Woman
  choice: Женщина
  rationale: Прямое, нейтральное и достойное обращение; не заменено более эмоциональным или родственным обращением.
theological_decisions:
- issue: Смысл слов «кто из вас без греха»
  choice: Сохранена общая формулировка «без греха»
  alternative: «кто не виновен в таком грехе»
  rationale: Источник не ограничивает высказывание конкретным видом греха; такое уточнение было бы толкованием.
- issue: Соотношение прощения и призыва прекратить грешить
  choice: Обе части переданы рядом без догматического пояснения
  alternative: Добавить, что Иисус простил женщину или оправдал её
  rationale: Фраза «И Я тебя не осуждаю» и повеление «больше не греши» должны сохранять собственное напряжение текста.
- issue: Текстуальная неопределённость вставок
  choice: Квадратные скобки источника сохранены
  alternative: Включить слова без обозначения либо вынести все варианты в примечания
  rationale: Предоставленный свидетель явно отмечает восстановленный или неуверенно засвидетельствованный текст; это нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис упрощён там, где буквальное воспроизведение английского свидетеля было бы тяжеловесным, но повествовательные повторы сохранены. Редакторская библиографическая приписка оставлена отдельно от собственно фрагмента.
