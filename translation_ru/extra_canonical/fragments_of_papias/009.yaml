base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: ru
  text: 'Отталкиваясь от Папия Великого из Иераполя, ученика апостола, возлежавшего у груди Христа, а также от Климента, Пантена, пресвитера александрийцев, и Аммония, великого учёного, эти древние и первые толкователи, согласные друг с другом, понимают всё дело шести дней как относящееся ко Христу и Его Церкви.[a]


    АНАСТАСИЙ СИНАИТ. «Анагогические созерцания на Шестоднев», I.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен по опубликованному английскому свидетельству Дж. Б. Лайтфута; сверка с греческим или латинским текстом ещё требуется. Синтаксис отрывка допускает некоторую неясность относительно того, кто именно назван «древними и первыми толкователями».'
    reason: Источник на древнем языке не предоставлен, а английская фраза синтаксически неоднозначна; это ограничение нельзя скрывать в публикационном переводе.
  - marker: b
    text: 'Атрибуция: Анастасий Синаит, «Анагогические созерцания на Шестоднев», книга I; русское заглавие передано описательно по сокращённой латинской ссылке Contempl. Anagog. in Hexaém. i.'
    reason: Сохраняет атрибуцию и поясняет развёртывание сокращённого названия без претензии на установленное критическое заглавие.
lexical_decisions:
- source_word: Taking their start from
  choice: Отталкиваясь от
  rationale: Передаёт зависимость последующих толкователей от названных предшественников, не уточняя сверх свидетельства характер этой зависимости.
- source_word: Papias the great, of Hierapolis
  choice: Папия Великого из Иераполя
  rationale: Сохраняет почётный эпитет и географическое определение в естественной русской форме.
- source_word: the Apostle who leaned on Christ’s bosom
  choice: апостола, возлежавшего у груди Христа
  rationale: Сохраняет традиционный образ трапезы и не отождествляет апостола по имени, поскольку свидетель его не называет.
- source_word: Pantanus the priest of the Alexandrians
  choice: Пантена, пресвитера александрийцев
  rationale: Имя передано в принятой русской форме; priest в раннехристианском контексте передано как «пресвитер», без позднейшего конфессионального уточнения.
- source_word: all the work of the six days
  choice: всё дело шести дней
  rationale: Сохраняет отсылку к совокупному делу творения в Шестодневе, не сужая её до одного текста или отдельных дней.
- source_word: as referring to Christ and His Church
  choice: как относящееся ко Христу и Его Церкви
  rationale: Передаёт христологическое и экклезиологическое прочтение, не конкретизируя способ соотнесения.
theological_decisions:
- issue: Личность апостола, у груди которого возлежал Папий
  choice: Не называть апостола по имени
  alternative: Назвать его апостолом Иоанном
  rationale: Свидетель говорит лишь об «апостоле, возлежавшем у груди Христа»; именование Иоанна сняло бы сохранённую источником неоднозначность.
- issue: Характер толкования шести дней
  choice: «как относящееся ко Христу и Его Церкви»
  alternative: «как аллегорию Христа и Церкви»
  rationale: Исходное английское свидетельство выражает отношение широко; термин «аллегория» был бы более узким и мог бы навязать конкретный герменевтический метод.
translation_notes:
  register: Современный литературный русский с умеренно церковно-исторической лексикой. Сохранены достоинство патристического свидетельства, длинная синтаксическая конструкция и исходная неоднозначность; архаизмы сведены к необходимым терминам «апостол», «пресвитер», «Шестоднев».
