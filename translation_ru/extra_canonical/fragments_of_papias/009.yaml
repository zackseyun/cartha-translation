  revision_rationale: 'Исправлены два содержательно значимых места: priest передано без дополнительного сужения как «священник», а all the work of the six days — ясным русским выражением «всё шестидневное творение». Синтаксис сглажен минимально; не назван апостол по имени и не навязан конкретный метод толкования. Латинская ссылочная формула сохранена вместо неуверенного развёрнутого названия.'
