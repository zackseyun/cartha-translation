base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: ru
  text: 'Несомненно, предсказанное таким образом благословение относится ко временам Царства, когда праведные воскреснут из мёртвых и будут царствовать, а творение, обновлённое и освобождённое от рабства, даст в изобилии всякую пищу — от небесной росы и плодородия земли. Так передают старцы, видевшие Иоанна, ученика Господа: они слышали от него, как Господь учил о тех временах и говорил:


    «Настанут дни, когда будут расти виноградные лозы, и на каждой будет по десять тысяч побегов, на каждом побеге — по десять тысяч ветвей, на каждой ветви — ещё по десять тысяч отростков, на каждом отростке — по десять тысяч гроздей, а в каждой грозди — по десять тысяч ягод; и каждая ягода при выжимании даст двадцать пять мер вина.[a] Когда кто-нибудь из святых возьмётся за одну из этих гроздей, другая воскликнет: „Я лучшая гроздь! Возьми меня и через меня благослови Господа“. Подобным образом одно пшеничное зерно даст десять тысяч колосьев, каждый колос — десять тысяч зёрен, а каждое зерно — десять фунтов тонкой, светлой и чистой муки.[b] Другие плоды, семена и трава будут приносить урожай в таких же количествах. И все животные, питаясь этими плодами земли, станут мирными и будут жить в согласии, во всём покоряясь человеку».


    Об этом Папий — слушатель Иоанна, спутник Поликарпа и муж древних времён — письменно свидетельствует в четвёртой из своих пяти книг.[c] И он добавляет:


    «Но это достоверно для верующих».


    Когда же предатель Иуда не поверил и спросил: «Как Господь произведёт такое изобилие?», Папий передаёт, что Господь сказал: «Увидят те, кто доживёт до тех времён».[d]


    Ириней, «Против ересей», 5.33.3–4.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный объём древней «меры» здесь не уточняется; важно прежде всего гиперболическое изображение изобилия.
    reason: Не допустить ложной метрической точности при неустановленном исходном обозначении меры.
  - marker: b
    text: «Фунт» обозначает древнюю единицу веса, а не современный стандартный фунт; её точная величина зависела от системы мер.
    reason: Предупредить ошибочное современное метрическое прочтение.
  - marker: c
    text: Отрывок сохранился у Иринея, «Против ересей» 5.33.3–4. Здесь Ириней цитирует или пересказывает четвёртую книгу Папия; всего Папию приписываются пять книг.
    reason: Прояснить рамку свидетельства и его непрямую сохранность.
  - marker: d
    text: 'Буквально смысл ответа близок к: «Увидят те, кто достигнет тех времён». Формулировка не уточняет, каким образом они до них достигнут.'
    reason: Сохранить эсхатологическую неоднозначность и не вводить конкретную схему исполнения.
lexical_decisions:
- source_word: times of the Kingdom
  choice: времена Царства
  rationale: Сохранена эсхатологическая формулировка и прописная буква, не уточняющая сверх свидетельства характер Царства.
- source_word: fatness of the earth
  choice: плодородие земли
  rationale: Естественная современная передача образа богатой, тучной почвы без архаической неясности.
- source_word: saints
  choice: святые
  rationale: Стандартное раннехристианское обозначение принадлежащих Богу людей; контекст не требует конфессионального уточнения.
- source_word: fine flour, bright and clean
  choice: тонкая, светлая и чистая мука
  rationale: Сохранены все три характеристики; «тонкая» передаёт качество мелкого помола.
- source_word: credible to them that believe
  choice: достоверно для верующих
  rationale: Сохранена связь между принятием сообщения и верой без добавления оценки от переводчика.
- source_word: shall come to these (times)
  choice: доживёт до тех времён
  rationale: Идиоматичная передача смысла прибытия/достижения этих времён; неопределённость самого обещания сохранена.
theological_decisions:
- issue: Характер будущего Царства
  choice: Сохранено буквальное описание воскресения, царствования и обновлённого творения.
  alternative: Истолковать описание как чистую аллегорию или прямо назвать его тысячелетним царством.
  rationale: Свидетель говорит о «временах Царства», но перевод не должен заранее разрешать спор о буквальном или символическом характере текста.
- issue: Отнесение слов к Господу
  choice: 'Сохранена цепочка передачи: старцы слышали от Иоанна, как Господь учил.'
  alternative: Представить изречение как непосредственно засвидетельствованные слова исторического Иисуса.
  rationale: Текст является многоступенчатым преданием, и эту дистанцию необходимо ясно сохранить.
- issue: Личность Иоанна
  choice: «Иоанн, ученик Господа» без уточнения.
  alternative: Отождествить его прямо с апостолом Иоанном или Иоанном-пресвитером.
  rationale: Данное свидетельство не разрешает историческую дискуссию однозначно.
- issue: Слова Иуды
  choice: Сохранено указание на Иуду-предателя и его неверие.
  alternative: Смягчить вопрос как нейтральное недоумение.
  rationale: Свидетель прямо характеризует его как не поверившего; богословское напряжение не следует устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского свидетельства. Архаические формы английского свидетеля заменены естественными русскими, но риторическая гипербола, цепочка предания и богословская неопределённость сохранены. Поскольку прямая сверка с греческим/латинским текстом отмечена как ожидающая выполнения, проект осторожно следует предоставленному публичному английскому свидетелю и не заявляет большей текстологической точности, чем позволяют данные.
