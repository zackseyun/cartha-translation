    rationale: 'Сочетание стилистически и семантически неудачно: «вещественный» чаще относится к физической природе или доказательствам, тогда как witness говорит о материальной пище. «Материальные яства» точнее передаёт противопоставление и остаётся литературным.'
  - severity: low
    issue: Порядок слов в начальной фразе
    rationale: «И Стефан также не следует» допустимо, но менее естественно. «Равным образом Стефан не следует» ясно передаёт nor again, не раскрывая точнее характер его несогласия.
  revised_text: 'Равным образом Стефан не следует ни Папию, епископу и мученику Иераполя, ни Иринею, святому епископу Лиона, когда они говорят, что Царство Небесное будет состоять в наслаждении некоторыми материальными яствами.[a]


