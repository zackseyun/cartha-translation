base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: ru
  text: 'И Стефан также не следует ни Папию, епископу и мученику Иераполя, ни Иринею, святому епископу Лиона, когда они говорят, что Царство Небесное будет состоять в наслаждении некоторыми вещественными яствами.[a]


    ФОТИЙ, «Библиотека», 232, о Стефане Гобаре.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен по опубликованному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка с древнегреческим текстом пока не проведена.'
    reason: Источник задания прямо указывает, что проверка по исходному языку ещё предстоит; это существенно для оценки точности формулировок.
  - marker: b
    text: В английском печатном свидетельстве опечатка «Aibliotheca» исправлена на «Bibliotheca» («Библиотека»). Имя «Irenzeus» также нормализовано как Ириней.
    reason: Фиксирует редакционную нормализацию очевидных типографских форм.
lexical_decisions:
- source_word: material foods
  choice: вещественные яства
  rationale: Сохраняет противопоставление материального и духовного, а слово «яства» придаёт фрагменту уместный древнецерковный оттенок, оставаясь понятным современному читателю.
- source_word: will consist in enjoyment
  choice: будет состоять в наслаждении
  rationale: Близко передаёт доступное английское свидетельство, не уточняя, идёт ли речь о сущности царства или о характерной для него деятельности.
- source_word: bishop and martyr
  choice: епископу и мученику
  rationale: Передаёт оба титула без конфессионального расширения.
theological_decisions:
- issue: Материальный характер благ Царства Небесного
  choice: Сохранено прямое утверждение о «наслаждении некоторыми вещественными яствами»
  alternative: Смягчить до «телесных благ» или истолковать слова метафорически
  rationale: Фрагмент сообщает конкретное спорное представление Папия и Иринея; перевод не должен заранее разрешать его в пользу буквального или символического прочтения.
- issue: Отношение Стефана Гобара к Папию и Иринею
  choice: «не следует»
  alternative: «не соглашается»
  rationale: «Не следует» точнее сохраняет форму доступного свидетельства и не уточняет, означает ли это прямое несогласие, отказ принять учение или отсутствие принадлежности к их позиции.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким церковно-историческим регистром. Синтаксис сохраняет лаконичность фрагмента; имена и название сочинения даны в принятых русских формах. Из-за отсутствия прямой сверки с древнегреческим/латинским источником перевод сознательно не выходит за пределы доступного английского свидетельства.
