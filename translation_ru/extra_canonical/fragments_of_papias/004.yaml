review_pass:
  verdict: revise
  source_fidelity: 'Перевод в целом точно следует предоставленному английскому свидетелю и его POB-аудитной реконструкции: сохранены два разных Иоанна, атрибуции как мнения некоторых, полемическая оценка Папия и несогласованность между сообщениями о мученичестве и смерти в Эфесе. Непосредственная сверка с греческими/латинскими свидетелями в данных отсутствует, поэтому уверенность ограничена английским публичнодоступным свидетелем. Нужна малое исправление: вопросительность/неуверенность в повреждённой концовке цитаты Евсевия должна быть видна и в основном тексте, а не только оговариваться в сноске.'
  naturalness: Русский текст современный, литературный и в целом хорошо выдержан в историко-церковном регистре. Несколько уточнены формулировки «изданных под именем» и «признание и обязательство» для более естественного и точного изложения.
  terminology: «Иоанн Богослов», «соборные послания», «Апокалипсис», «Тысячелетнее царство», «мученическая смерть» и географическое «Азия» употреблены уместно. «Изречения Господа» — приемлемая передача названия Oracles of the Lord. Обозначение «старец» сохраняет титул без навязывания идентификации.
  issues:
  - severity: medium
    issue: Не сохранен знак текстовой неуверенности в последнем слове цитаты Евсевия.
    rationale: Английский POB-текст передаёт концовку как «[E]phesus[?]», а исходный OCR-свидетель также имеет сомнительный знак после Ephesus. В русском основном тексте утверждение «умер в Эфесе» дано без маркера сомнения, хотя сноска говорит о повреждении. Следует сохранить «Эфесе(?)».
  - severity: low
    issue: «Изданных под именем Иоанна» звучит не вполне точно в данном контексте.
    rationale: Witness говорит, что послания «published in the name of John»; для русской характеристики текстов естественнее «носящих имя Иоанна» или «известных под именем Иоанна», без современного оттенка издательской публикации.
  - severity: low
    issue: Формула «данное ими признание и обязательство ради Него» тяжеловесна.
    rationale: Здесь речь о согласии/обещании учеников в ответ на слова Иисуса. «Их собственное исповедание и обещание, данное Ему» ближе к смыслу и естественнее, не добавляя толкования.
  revised_text: 'Папий, епископ Иераполя, ученик Иоанна Богослова и спутник Поликарпа, написал пять книг «Изречений Господа». Перечисляя апостолов, он после Петра и Иоанна, Филиппа, Фомы и Матфея упомянул среди учеников Господа Аристиона и другого Иоанна, которого также называл «старцем». [Он говорит], что, по мнению некоторых, этот Иоанн был автором двух кратких соборных посланий[a], носящих имя Иоанна; основанием для этого служит то, что древние отцы признавали только первое послание. Некоторые также ошибочно считали Апокалипсис произведением этого Иоанна, то есть Иоанна-старца. Папий заблуждается и относительно Тысячелетнего царства, а вслед за ним — также Ириней.


    В своей второй книге Папий говорит, что Иоанн Богослов и его брат Иаков были убиты иудеями. Упомянутый Папий, ссылаясь на дочерей Филиппа, сообщал, что Варсава, называемый также Иустом, по вызову неверующих выпил во имя Господа змеиный яд и не потерпел никакого вреда. Он сообщает и о других чудесных событиях, особенно о воскрешении из мёртвых матери Манаима. Что же до воскрешённых Христом, то, по его словам, они дожили до времени Адриана.


    ФИЛИПП СИДСКИЙ (?) «Христианская история»[b]


    VI


    После Домициана один год царствовал Нерва. Он возвратил Иоанна с острова, то есть с Патмоса, и позволил ему жить в Эфесе. В то время Иоанн оставался единственным из двенадцати апостолов, кто был ещё жив, а написав своё Евангелие, удостоился мученической смерти. Ведь Папий, епископ Иераполя, лично видевший Иоанна, во второй книге «Изречений Господа» говорит, что тот был убит иудеями. Тем самым Иоанн вместе со своим братом, несомненно, исполнил пророчество Христа о них, а также их собственное исповедание и обещание, данное Ему. Когда Господь спросил их: «Можете ли пить чашу, которую Я пью?» — они без колебаний ответили согласием. Тогда Он сказал: «Чашу Мою будете пить и крещением, которым Я крещусь, будете креститься».[c] И это справедливо, ведь Бог не может лгать.


    Также и учёный Ориген в своём толковании Евангелия от Матфея утверждает, что Иоанн претерпел мученическую смерть, и говорит, что узнал об этом от преемников апостолов. Да и хорошо осведомлённый Евсевий в своей «Церковной истории» пишет: «Фоме по жребию досталась Парфия, а Иоанну — Азия, где он и поселился и умер в Эфесе(?)».[d]


    ГЕОРГИЙ АМАРТОЛ. «Хроника»'
