base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: ru
  text: 'Папий, епископ Иераполя, ученик Иоанна Богослова и спутник Поликарпа, написал пять книг «Изречений Господа». Перечисляя апостолов, он после Петра и Иоанна, Филиппа, Фомы и Матфея упомянул среди учеников Господа Аристиона и другого Иоанна, которого также называл «старцем». [Он говорит], что, по мнению некоторых, этот Иоанн был автором двух кратких соборных посланий[a], изданных под именем Иоанна; основанием для этого служит то, что древние отцы признавали только первое послание. Некоторые также ошибочно считали Апокалипсис произведением этого Иоанна, то есть Иоанна-старца. Папий заблуждается и относительно Тысячелетнего царства, а вслед за ним — также Ириней.


    В своей второй книге Папий говорит, что Иоанн Богослов и его брат Иаков были убиты иудеями. Упомянутый Папий, ссылаясь на дочерей Филиппа, сообщал, что Варсава, называемый также Иустом, по вызову неверующих выпил во имя Господа змеиный яд и не потерпел никакого вреда. Он сообщает и о других чудесных событиях, особенно о воскрешении из мёртвых матери Манаима. Что же до воскрешённых Христом, то, по его словам, они дожили до времени Адриана.


    ФИЛИПП СИДСКИЙ (?) «Христианская история»[b]


    VI


    После Домициана один год царствовал Нерва. Он возвратил Иоанна с острова, то есть с Патмоса, и позволил ему жить в Эфесе. В то время Иоанн оставался единственным из двенадцати апостолов, кто был ещё жив, а написав своё Евангелие, удостоился мученической смерти. Ведь Папий, епископ Иераполя, лично видевший Иоанна, во второй книге «Изречений Господа» говорит, что тот был убит иудеями. Тем самым Иоанн вместе со своим братом, несомненно, исполнил пророчество Христа о них, а также данное ими признание и обязательство ради Него. Когда Господь спросил их: «Можете ли пить чашу, которую Я пью?» — они без колебаний ответили согласием. Тогда Он сказал: «Чашу Мою будете пить и крещением, которым Я крещусь, будете креститься».[c] И это естественно, ведь Бог не может лгать.


    Также и учёный Ориген в своём толковании Евангелия от Матфея утверждает, что Иоанн претерпел мученическую смерть, и говорит, что узнал об этом от преемников апостолов. Да и хорошо осведомлённый Евсевий в своей «Церковной истории» пишет: «Фоме по жребию досталась Парфия, а Иоанну — Азия, где он и поселился и умер в Эфесе».[d]


    ГЕОРГИЙ АМАРТОЛ. «Хроника»


    [a] То есть посланий, известных как Второе и Третье послания Иоанна. Слово «соборные» передаёт традиционное обозначение общецерковных, или всеобщих, посланий.


    [b] Имя автора и сокращённое название произведения в представленном английском свидетеле повреждены; атрибуция Филиппу Сидскому дана там со знаком вопроса.


    [c] Ср. Мк. 10:38–39; Мф. 20:22–23. Формулировка здесь соответствует цитате в данном фрагменте и соединяет выражения, известные по евангельским параллелям.


    [d] Концовка цитаты в представленном свидетеле повреждена распознаванием текста; смысл восстановлен по контексту. Утверждение о смерти в Эфесе оставлено рядом с предшествующим утверждением о мученичестве, без попытки устранить напряжение между ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть посланий, известных как Второе и Третье послания Иоанна. Слово «соборные» передаёт традиционное обозначение общецерковных, или всеобщих, посланий.
    reason: Поясняет историческое обозначение и референт двух кратких посланий.
  - marker: b
    text: Имя автора и сокращённое название произведения в представленном английском свидетеле повреждены; атрибуция Филиппу Сидскому дана там со знаком вопроса.
    reason: Честно отмечает повреждение и неуверенную атрибуцию свидетеля.
  - marker: c
    text: Ср. Мк. 10:38–39; Мф. 20:22–23. Формулировка здесь соответствует цитате в данном фрагменте и соединяет выражения, известные по евангельским параллелям.
    reason: Указывает библейские параллели и сохраняет особую форму цитаты.
  - marker: d
    text: Концовка цитаты в представленном свидетеле повреждена распознаванием текста; смысл восстановлен по контексту. Утверждение о смерти в Эфесе оставлено рядом с предшествующим утверждением о мученичестве, без попытки устранить напряжение между ними.
    reason: Документирует текстовое восстановление и принцип сохранения расхождения.
lexical_decisions:
- source_word: John the Divine
  choice: Иоанн Богослов
  rationale: Устойчивое русское историко-церковное именование; сохраняет эпитет без буквального и неестественного «Божественный».
- source_word: Oracles of the Lord
  choice: «Изречения Господа»
  rationale: Передаёт смысл названия как собрания господних речений и не вводит узкое значение «пророчества».
- source_word: the Elder
  choice: «старец» / Иоанн-старец
  rationale: Сохраняет титул и различение между двумя Иоаннами; строчная буква соответствует современному русскому оформлению нарицательного титула.
- source_word: catholic Epistles
  choice: соборные послания
  rationale: Традиционный и понятный в русской библейской терминологии эквивалент, пояснённый в сноске.
- source_word: Millennium
  choice: Тысячелетнее царство
  rationale: Передаёт предмет утверждения конкретнее, чем отвлечённое «милленниум», не уточняя спорную схему его толкования.
- source_word: received the honour of martyrdom
  choice: удостоился мученической смерти
  rationale: Сохраняет положительную оценочную окраску древнего свидетельства и звучит естественно по-русски.
- source_word: Asia
  choice: Азия
  rationale: Сохранено древнее географическое название римской провинции; контекст Эфеса препятствует смешению с современным континентом.
theological_decisions:
- issue: Авторство двух кратких посланий и Апокалипсиса
  choice: Передано как мнение некоторых, а не как утверждённый факт.
  alternative: Отождествить Иоанна-старца с апостолом или категорически приписать ему книги.
  rationale: Свидетельство сохраняет различение двух Иоаннов и доксографическую неопределённость.
- issue: Оценка учения Папия о Тысячелетнем царстве
  choice: 'Сохранено прямое суждение позднего автора: «заблуждается».'
  alternative: Смягчить до нейтрального «учил» или принять оценку как редакционную позицию перевода.
  rationale: Это оценка автора свидетельства, которую следует передать исторически, не делая её позицией проекта.
- issue: Мученичество Иоанна и смерть в Эфесе
  choice: Оба утверждения сохранены без согласования.
  alternative: Истолковать смерть в Эфесе как мученичество либо исправить одно из сообщений.
  rationale: Источник содержит историко-богословское напряжение; перевод не должен молча устранять его.
- issue: «Бог не может лгать»
  choice: Сохранено как аргумент автора без смягчения.
  alternative: Перефразировать как «Божье слово непременно исполняется».
  rationale: Прямая формулировка важна для логики свидетеля и имеет библейский характер.
translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким историко-церковным регистром. Синтаксис упрощён там, где английский свидетель повреждён или перегружен, но последовательность утверждений сохранена. Квадратное восстановление «[Он говорит]» оставлено в основном тексте как редакционное дополнение свидетеля. Проект предварительный: предоставлен публичнодоступный английский перевод-свидетель с OCR-повреждениями, тогда как непосредственная сверка с греческими/латинскими поздними свидетелями ещё не выполнена.'
