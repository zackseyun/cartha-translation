review_pass:
  verdict: revise
  source_fidelity: 'Требуется исправление одного существенного места в цитате: «in (the persons of) authors» в дефектном английском OCR-свидетеле не даёт основания переводить «в устах их передатчиков». Латинская формула, стоящая за этим местом у Иеронима, передаётся как «живой и пребывающий доныне голос». Также следует сохранить различие времён: об апостолах — «что говорили», об Аристионе и пресвитере Иоанне — «что говорят». «Millennium» безопаснее передать как «тысячелетие», не добавляя слово «царство», которого в данном свидетельстве нет.'
  naturalness: После правки текст остаётся современным литературным русским, сохраняя сдержанный историко-церковный регистр. «Апостолов считал своими авторитетами» естественно и точнее, чем единственное число «свидетельству апостолов».
  terminology: «Пресвитер Иоанн», «во плоти», «слушатель Иоанна» и «Изъяснение изречений Господа» уместны. «Два последних послания Иоанна» точнее передаёт «the two later epistles» в контексте трёх посланий. Утверждение об авторстве должно быть оставлено как сообщаемое мнение, а не как факт перевода.
  issues:
  - severity: high
    issue: Необоснованное добавление «в устах их передатчиков»
    rationale: Эта фраза не следует надёжно из предоставленного английского свидетеля и подменяет формулу о «живом и пребывающем доныне голосе» конкретной интерпретацией канала передачи.
  - severity: medium
    issue: «Тысячелетнее царство» добавляет понятие «царство»
    rationale: Английский свидетель говорит о Jewish tradition of a Millennium; добавление «царство» — богословская конкретизация, которой в данном тексте нет.
  - severity: medium
    issue: Слишком категоричное изложение авторства посланий
    rationale: Иероним сообщает утверждение, записанное «на основании свидетельства очень многих»; русская формулировка должна сохранять эту историографическую дистанцию.
  revised_text: 'Папий, слушатель Иоанна и епископ Иераполя в Азии, написал лишь пять книг, озаглавив их «Изъяснение изречений Господа». В предисловии к этому труду он утверждает, что следует не случайным сообщениям, но апостолов считает своими авторитетами, и говорит:


    «Я обыкновенно расспрашивал, что говорили Андрей, или Пётр, или Филипп, или Фома, или Иаков, или Иоанн, или Матфей, или кто-либо другой из учеников Господа, а также что говорят Аристион и пресвитер Иоанн, ученики Господа. Ибо книги не приносят мне столько пользы, сколько живой и пребывающий доныне голос».


    Из самого перечня имён ясно, что один Иоанн причислен к апостолам, а другой — пресвитер Иоанн — назван после Аристиона. Мы упомянули об этом ввиду приведённого выше утверждения, которое записали на основании свидетельства очень многих, согласно которому два последних послания Иоанна принадлежат не апостолу, а пресвитеру. Говорят также, что этот Папий распространял иудейское предание о тысячелетии; ему следуют Ириней, Аполлинарий и другие, утверждающие, что после воскресения Господь будет царствовать во плоти вместе со святыми.


    Иероним. «О знаменитых мужах», 18.


    VIII


    Кроме того, до меня дошёл ложный слух, будто я перевёл книги Иосифа и сочинения Папия и Поликарпа. Но у меня нет ни времени, ни сил, чтобы переложить подобные труды на другой язык с соответствующим изяществом.


    Иероним. «К Луцинию», письмо 71 (28), глава 5.'
  revised_footnotes: []
  revision_rationale: Удалена спекулятивная реконструкция «в устах их передатчиков» и связанная с нею сноска. Формулировка о живом голосе приведена к нейтральному и близкому к латинскому свидетельству виду. Устранено добавление «царство» к «тысячелетию»; сохранены различие двух Иоаннов, модальность сообщения об авторстве посланий и богословски нагруженное «во плоти».
