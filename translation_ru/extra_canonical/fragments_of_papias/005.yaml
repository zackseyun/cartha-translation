base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: ru
  text: 'Папий, слушатель Иоанна и епископ Иераполя в Азии, написал всего пять книг, озаглавив их «Изъяснение изречений Господа». В предисловии к этому труду он утверждает, что следует не случайным сообщениям, а свидетельству апостолов, и говорит:


    «Я обыкновенно расспрашивал, что говорил Андрей, или Пётр, или Филипп, или Фома, или Иаков, или Иоанн, или Матфей, или кто-либо другой из учеников Господа, а также что говорят Аристион и пресвитер Иоанн, ученики Господа. Ибо чтение книг приносит мне не столько пользы, сколько живой голос, ясно звучащий доныне в устах их передатчиков».[a]


    Из самого перечня имён ясно, что один Иоанн причислен к апостолам, а другой — пресвитер Иоанн — назван после Аристиона. Мы упомянули об этом ввиду приведённого выше утверждения, которое мы записали, опираясь на свидетельство весьма многих: два позднейших послания Иоанна принадлежат не апостолу, а пресвитеру. Говорят также, что этот Папий распространял иудейское предание о тысячелетнем царстве; за ним последовали Ириней, Аполлинарий и другие, утверждающие, что после воскресения Господь будет царствовать во плоти вместе со святыми.


    Иероним. «О знаменитых мужах», 18.


    VIII


    Кроме того, до меня дошёл ложный слух, будто я перевёл книги Иосифа и сочинения Папия и Поликарпа. Но у меня нет ни времени, ни сил, чтобы переложить подобные труды на другой язык с подобающим изяществом.


    Иероним. «К Луцинию», письмо 71 (28), глава 5.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата Папия дошла здесь в латинском пересказе Иеронима; её формулировка местами отличается от более полного греческого фрагмента, сохранённого Евсевием. Последние слова буквально могут пониматься как «живой и доныне пребывающий голос»; выражение «в устах их передатчиков» поясняет смысл повреждённого английского свидетеля.
    reason: Предоставленный материал является старым английским переводом латинского свидетельства с явными дефектами сканирования, а непосредственная сверка с древним текстом в исходных данных отмечена как ожидающая выполнения.
lexical_decisions:
- source_word: hearer of John
  choice: слушатель Иоанна
  rationale: Сохраняет буквальный характер свидетельства и не усиливает его до формального ученичества.
- source_word: Exposition of Discourses of the Lord
  choice: Изъяснение изречений Господа
  rationale: «Изъяснение» естественно передаёт название толковательного труда, а «изречения» — словесные высказывания Господа без неоправданного сужения до речей.
- source_word: promiscuous statements
  choice: случайным сообщениям
  rationale: Передаёт смысл неразборчиво собранных или исходящих от любых встречных сведений без современного нежелательного оттенка слова «беспорядочный».
- source_word: the Elder John
  choice: пресвитер Иоанн
  rationale: В раннехристианском контексте передаёт титул и одновременно сохраняет отличие от ранее названного Иоанна.
- source_word: living voice
  choice: живой голос
  rationale: Сохраняет образ устной, продолжающей звучать передачи.
- source_word: Millennium
  choice: тысячелетнее царство
  rationale: Ясно выражает предмет предания для современного читателя и избегает менее прозрачного отвлечённого «миллениума».
- source_word: in the flesh
  choice: во плоти
  rationale: Сохраняет богословски нагруженную телесную формулировку свидетеля, не истолковывая её.
- source_word: corresponding elegance
  choice: с подобающим изяществом
  rationale: Естественно передаёт требование стилистического соответствия при переводе на иной язык.
theological_decisions:
- issue: Различение двух лиц по имени Иоанн
  choice: Сохранено прямое различение апостола Иоанна и пресвитера Иоанна как довод цитирующего автора.
  alternative: Отождествить обоих Иоаннов или представить различение как установленный исторический факт.
  rationale: Текст излагает аргумент Иеронима; перевод не должен ни отменять его, ни придавать ему больше определённости, чем имеет свидетельство.
- issue: Авторство двух позднейших посланий Иоанна
  choice: Утверждение передано как мнение, опирающееся, по словам автора, на свидетельство многих.
  alternative: Безоговорочно приписать послания пресвитеру либо апостолу.
  rationale: Сохранена историографическая дистанция и спорность атрибуции.
- issue: Тысячелетнее царство и телесное царствование
  choice: Сохранены формулировки «тысячелетнее царство» и «во плоти» без конфессионального пояснения.
  alternative: Истолковать царство как буквальное, символическое, земное или небесное.
  rationale: Источник сообщает конкретную традицию, но перевод не должен разрешать последующие богословские споры.
- issue: Статус Папия как слушателя Иоанна
  choice: Передано «слушатель Иоанна», без уточнения, какого именно Иоанна.
  alternative: Назвать его учеником апостола Иоанна.
  rationale: Так сохраняется неопределённость исходного свидетельства.
translation_notes:
  register: Современный литературный русский язык с умеренно историческим достоинством. Синтаксис выправлен после дефектного OCR-свидетеля; библиографические заголовки приведены в принятой русской форме. Скобочные редакторские оговорки английского слоя не воспроизводились там, где они не принадлежат самому древнему свидетельству. Проект остаётся предварительным ввиду отсутствия в пакете прямой греко-латинской сверки.
