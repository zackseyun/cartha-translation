lexical_decisions:
- source_word: Irenzeus
  choice: Ириней
  rationale: Имя нормализовано в соответствии с общепринятой русской формой имени Irenaeus; написание английского свидетеля, по-видимому, представляет типографический или OCR-вариант.
- source_word: a disciple of Papias
  choice: ученик Папия
  rationale: Прямо передаёт отношение ученичества, выраженное в доступном английском свидетеле.
- source_word: who was a hearer of John
  choice: который был слушателем Иоанна
  rationale: Сохранено указание на Папия как слушателя Иоанна без усиления смысла до формального ученичества.
- source_word: relates
  choice: сообщает
  rationale: Нейтральный глагол передачи свидетельства; не добавляет оценки достоверности или жанра сообщения.
theological_decisions:
- issue: Незавершённое обозначение Иоанна
  choice: Иоанна Ева[…]
  alternative: Иоанна Евангелиста
  rationale: Доступный свидетель обрывается на “John the Eva”; завершение титула до «Евангелиста» было бы правдоподобной, но пока не подтверждённой конъектурой.
- issue: К кому относится придаточное «который был слушателем Иоанна»
  choice: к Папию
  alternative: к Иринею
  rationale: Синтаксис английского свидетеля непосредственно связывает относительное придаточное с Papias; такая связь сохранена, хотя вся формулировка остаётся зависимой от ожидающей проверки по греческому/латинскому источнику.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. Перевод носит предварительный характер, поскольку выполнен по общественно-доступному английскому свидетелю Дж. Б. Лайтфута; прямая проверка греческого/латинского текста ожидается. Неясное окончание не реконструировано.
