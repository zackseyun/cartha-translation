base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: ru
  text: 'Аполлинарий: «Иуда не умер через повешение, но остался жив, потому что его сняли прежде, чем он задохнулся. И Деяния апостолов показывают это: упав вниз головой, он расселся посередине, и все внутренности его выпали. Об этом яснее рассказывает Папий, ученик Иоанна, в четвёртой книге „Толкования изречений Господа“:


    „Иуда ходил по этому миру как страшный пример нечестия; плоть его распухла до такой степени, что там, где повозка [a] могла проехать без труда, он пройти не мог — не могла пройти даже одна его голова. Говорят, веки его распухли до такой [b] степени, что он совсем не видел света, а глаз его не мог разглядеть даже врач, смотревший через инструмент: настолько глубоко они запали…“


    Составлено по изданию Крамера, Catena ad Acta SS. Apost. (1838), с. 12 и след., а также по другим источникам.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся английском свидетеле эта часть предложения повреждена; по смыслу: «где повозка могла проехать без труда».'
    reason: Честно обозначает текстуальную неопределённость и объясняет восстановление синтаксиса.
  - marker: b
    text: В источнике здесь лакуна; слово «степени» восстановлено по контексту.
    reason: Маркирует восполнение утраченного текста, не выдавая его за несомненное чтение.
  - marker: c
    text: 'Перевод предварительный: выполнен по указанному общедоступному английскому свидетелю; сверка с греческими и латинскими источниками ещё требуется.'
    reason: Фиксирует ограничение предоставленной текстовой основы и не создаёт ложного впечатления перевода непосредственно с древнего языка.
lexical_decisions:
- source_word: did not die by hanging
  choice: не умер через повешение
  rationale: Передаёт утверждение свидетеля буквально, не сглаживая напряжение с последующим описанием смерти Иуды.
- source_word: lived on
  choice: остался жив
  rationale: Естественная современная формулировка, означающая, что после снятия Иуда некоторое время продолжал жить.
- source_word: falling headlong
  choice: упав вниз головой
  rationale: Сохраняет пространственный образ текста и допускаемую им связь с Деян 1:18.
- source_word: burst asunder in the midst
  choice: расселся посередине
  rationale: Передаёт телесный и резкий характер выражения без неоправданного уточнения механизма.
- source_word: terrible example of impiety
  choice: страшный пример нечестия
  rationale: Сохраняет нравственно-религиозную оценку, не усиливая её конфессиональной терминологией.
- source_word: mass of his head merely
  choice: даже одна его голова
  rationale: 'Идиоматично передаёт смысл повреждённого английского свидетеля: пройти не могла бы даже голова отдельно от тела.'
- source_word: physician looking through an instrument
  choice: врач, смотревший через инструмент
  rationale: Не конкретизирует не названный в свидетеле прибор и сохраняет древнее описание наблюдения.
- source_word: Exposition of the Oracles of the Lord
  choice: Толкование изречений Господа
  rationale: «Изречения» естественно передаёт oracles в названии труда Папия, а «Толкование» — Exposition.
theological_decisions:
- issue: Соотношение рассказа о повешении Иуды и Деян 1:18
  choice: 'Сохранено объяснение Аполлинария: Иуду сняли до удушения, после чего он погиб описанным в Деяниях образом.'
  alternative: Сгладить рассказ или представить его как прямое библейское утверждение.
  rationale: Фрагмент предлагает собственную гармонизацию свидетельств; перевод должен точно приписывать её Аполлинарию, не подтверждая и не опровергая.
- issue: Статус Папия как «ученика Иоанна»
  choice: Формулировка сохранена без уточнения, какого именно Иоанна имеет в виду свидетель.
  alternative: Уточнить «апостола Иоанна» или «пресвитера Иоанна».
  rationale: Источник сохраняет неоднозначность, которую нельзя разрешать переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством патристического свидетельства. Синтаксис умеренно формальный, но понятный широкому читателю. Повреждения и лакуны не замалчиваются; заключительное многоточие сохранено. Библиографическая приписка отделена от цитаты.
