    rationale: «Врач, смотревший через инструмент» неестественно. «Врач, осматривавший его с помощью прибора» сохраняет неопределённость прибора и смысл наблюдения.
  revised_text: 'Аполлинарий: «Иуда не умер в результате повешения, но остался жив, потому что его сняли прежде, чем он задохнулся. И Деяния апостолов показывают это: упав вниз головой, он разорвался посередине, и все его внутренности выпали. Об этом яснее рассказывает Папий, ученик Иоанна, в четвёртой книге „Толкования изречений Господа“:


    „Иуда ходил по этому миру как страшный пример нечестия; плоть его распухла до такой степени, что там, где повозка[a] могла проехать без труда, он не мог протиснуться даже одной головой. Говорят, веки его распухли до такой[b] степени, что он совсем не видел света, а его глаз не мог разглядеть даже врач, осматривавший его с помощью прибора: настолько глубоко они запали…“


