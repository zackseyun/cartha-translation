  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: ru
  text: '**Фрагмент X**


    Что же касается богодухновенности этой книги (то есть Апокалипсиса), мы считаем излишним говорить об этом пространно, поскольку блаженный Григорий (я имею в виду Богослова), Кирилл, а также мужи более древнего поколения — Папий[a], Ириней, Мефодий и Ипполит — свидетельствуют о её подлинности.[b]


    *Андрей Кесарийский, предисловие к «Апокалипсису».*'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Папий» восстановлено по контексту и принятому чтению этого фрагмента; предоставленный английский свидетель в этом месте повреждён типографически.
    reason: Исходный материал содержит обрыв и искажённое имя («Pz»), тогда как фрагмент включён в собрание свидетельств о Папии и принятое чтение называет его среди древних авторов.
  - marker: b
    text: 'Предоставленный английский печатный свидетель повреждён: текст между словами «Apocal—» и «mean» утрачен или искажён. Слова «мы считаем излишним говорить об этом пространно, поскольку блаженный Григорий (я имею в виду Богослова)» восстановлены по известному связному чтению данного места; прямая сверка с греческим текстом ещё требуется.'
    reason: Необходимо явно обозначить, что связный русский текст частично опирается на реконструкцию повреждённого публичного английского свидетеля, а проверка по исходному древнему языку пока не завершена.
lexical_decisions:
- source_word: inspiration
  choice: богодухновенность
  rationale: В данном контексте речь идёт не просто о вдохновении автора, а о божественном происхождении и авторитете книги; «богодухновенность» точно и привычно передаёт этот смысл.
- source_word: Apocalypse
  choice: Апокалипсис
  rationale: Сохранено историческое название книги, употреблённое в заголовке источника и естественное для цитаты из древнего церковного автора.
- source_word: the Divine
  choice: Богослов
  rationale: Это традиционный эпитет Григория Назианзина — Григорий Богослов; буквальное «Божественный» по-русски могло бы ошибочно восприниматься как утверждение о природе самого Григория.
- source_word: genuineness
  choice: подлинность
  rationale: Передаёт заявленное свидетельство о признании книги подлинной, не подменяя его более широкими понятиями каноничности или богодухновенности.
- source_word: men of an older generation
  choice: мужи более древнего поколения
  rationale: Сохраняет историко-церковный регистр, оставаясь понятным современному читателю.
theological_decisions:
- issue: Различие между богодухновенностью и подлинностью книги
  choice: 'Сохранить два разных термина: «богодухновенность» и «подлинность»'
  alternative: Передать оба понятия через «авторитетность» или «каноничность»
  rationale: Свидетель различает предмет начального рассуждения и характер свидетельства названных авторов; объединение терминов устранило бы смысловое напряжение текста.
- issue: Эпитет Григория
  choice: «Богослов»
  alternative: «Божественный»
  rationale: Исторически и контекстуально речь, вероятнее всего, о Григории Богослове; русский традиционный эпитет точнее обозначает лицо и не создаёт нежелательного богословского смысла.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным церковно-историческим регистром. Синтаксис упрощён ровно настолько, чтобы длинное свидетельство читалось естественно; имена нормализованы как Андрей Кесарийский, Папий, Ириней, Мефодий и Ипполит. Реконструированный участок не выдан за бесспорно сохранившийся текст: его статус отмечен сносками.'
