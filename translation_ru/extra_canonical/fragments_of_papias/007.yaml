  terminology: «Богодухновенность», «Апокалипсис», «Григорий Богослов» и «подлинность» передают ключевые понятия без конфессионально обусловленного расширения смысла. «Более ранние авторы» естественнее, чем «мужи более древнего поколения», и сохраняет смысл группы предшествующих свидетелей.
