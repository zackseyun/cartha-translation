base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: ru
  text: 'Этим он, как я полагаю, неясно указывает на Папия Иерапольского из Асии[a], который в то время был епископом и жил в дни святого евангелиста Иоанна. Ведь этот Папий в четвёртой книге своих «Толкований изречений Господних» упоминал яства среди источников радости при воскресении…[b] И Ириней Лионский говорит то же самое в пятой книге «Против ересей» и в подтверждение своих слов ссылается на упомянутого Папия.


    МАКСИМ ИСПОВЕДНИК, «Схолии к “О церковной иерархии” Дионисия Ареопагита», глава 7.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Асия — римская провинция в западной части Малой Азии.
    reason: Предотвращает смешение древней провинции с современной Азией как частью света.
  - marker: b
    text: Многоточие сохранено по представленному печатному свидетельству и обозначает пропуск текста.
    reason: Показывает, что переход между фразами не следует воспринимать как непрерывный полный текст.
lexical_decisions:
- source_word: darkly indicating
  choice: неясно указывает
  rationale: Передаёт косвенный и не вполне прозрачный характер указания, не усиливая его до намеренной таинственности.
- source_word: Asia
  choice: Асия
  rationale: Имеется в виду римская провинция Асия, а не современная часть света Азия; это уточнено сноской.
- source_word: Dominical Expositions
  choice: «Толкования изречений Господних»
  rationale: Выбрано принятое смысловое название труда Папия; оно отражает связь с Господними речениями, хотя проверка древнего текста ещё требуется.
- source_word: viands
  choice: яства
  rationale: Сохраняет несколько возвышенный регистр свидетельства и обозначает пищу как предмет наслаждения.
- source_word: delights in the resurrection
  choice: радости при воскресении
  rationale: Формулировка сохраняет эсхатологический смысл, не уточняя без основания, идёт ли речь о состоянии после воскресения или о самом событии.
- source_word: produces in support of his statements
  choice: в подтверждение своих слов ссылается
  rationale: Естественно по-русски передаёт привлечение Папия как авторитетного свидетельства.
theological_decisions:
- issue: Материальные блага при воскресении
  choice: яства среди источников радости при воскресении
  alternative: пища как одно из наслаждений воскресения
  rationale: Сохранено прямое свидетельство о пище без истолкования его как буквального хилиазма либо как символа.
- issue: Связь Папия с евангелистом Иоанном
  choice: жил в дни святого евангелиста Иоанна
  alternative: достиг расцвета во времена святого евангелиста Иоанна
  rationale: Фраза передаёт хронологическое совпадение, не утверждая личного ученичества или знакомства, которых данный фрагмент прямо не заявляет.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным патристическим регистром. Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству XIX века, поскольку прямая сверка с греческим или латинским текстом ещё не проведена. Заглавие труда Папия передано в принятой русской смысловой форме; атрибуция и библиографическая строка оформлены как подпись источника.'
