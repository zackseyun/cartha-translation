review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетельству, однако «жил в дни» передаёт лишь одновременность и утрачивает значение flourished («достиг расцвета», «был в расцвете деятельности»). Поскольку прямой греческий/латинский текст не предоставлен, спорные нюансы свидетельства, включая формулу о яствах и радостях воскресения, не следует уточнять интерпретационно.
  naturalness: Русский текст в целом литературный. «Этим он ... указывает» допустимо, но «Так он говорит, неясно указывая» яснее воспроизводит построение свидетельства. «При воскресении» звучит как момент события; «в воскресении» естественнее и сохраняет формулировку без догматического уточнения. Библиографическую строку следует оформить с корректным русским вложением названий.
  terminology: «Папий Иерапольский», «Асия», «Ириней Лионский», «Против ересей» и «Толкования изречений Господних» приемлемы. «Яства» соответствует возвышенному регистру viands. Название труда Папия остаётся смысловой передачей по английскому свидетельству и не должно выдаваться за окончательно установленное без сверки с оригиналом.
  issues:
  - severity: medium
    issue: Ослаблено значение «flourished».
    rationale: '«Жил в дни святого евангелиста Иоанна» не передаёт утверждение, что Папий был в расцвете/активно действовал в это время. Безопасная корректировка: «достиг расцвета во дни...».'
  - severity: low
    issue: Не вполне естественна временная формула «при воскресении».
    rationale: Она может звучать как указание на момент события, тогда как свидетельство связывает яства с радостями воскресения. «Среди радостей воскресения» естественнее и не добавляет толкования.
  - severity: low
    issue: Оформление библиографической подписи нуждается в стилистическом уточнении.
    rationale: Формула «Схолии к сочинению ... „О церковной иерархии“» устраняет тяжёлое сочетание кавычек и точнее передаёт характер ссылки.
  revised_text: 'Так он говорит, как я полагаю, неясно указывая на Папия Иерапольского, из Асии[a], который в то время был епископом и достиг расцвета во дни святого евангелиста Иоанна. Ведь этот Папий в четвёртой книге своих «Толкований изречений Господних» упоминал яства среди радостей воскресения…[b] И Ириней Лионский говорит то же самое в пятой книге «Против ересей» и в подтверждение своих слов ссылается на упомянутого Папия.



    МАКСИМ ИСПОВЕДНИК, «Схолии к сочинению Дионисия Ареопагита „О церковной иерархии“», глава 7.'
  revised_footnotes:
