base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: ru
  text: 'Здесь начинается изложение к Евангелию от Иоанна.[a]


    Евангелие Иоанна было обнародовано и передано церквам самим Иоанном, пока он ещё пребывал в теле, как рассказал некий Папий из Иераполя, возлюбленный ученик Иоанна, в своих пяти книгах — «общедоступных» (читай: «толковательных»).[b] Он же верно записал Евангелие под диктовку Иоанна.


    Ватиканская рукопись IX века.


    XX[c]


    Ибо последним из них Иоанн, прозванный Сыном грома, когда был уже глубоким старцем, — как передали нам Ириней, Евсевий и череда заслуживающих доверия историков, — примерно в то время, когда возникли ужасные ереси, продиктовал Евангелие своему ученику, добродетельному Папию Иерапольскому, чтобы восполнить то, чего недоставало у тех, кто прежде него возвещал слово народам по всей земле.


    «Цепь греческих отцов на Евангелие от святого Иоанна», изданная Б. Кордером.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переданное как «изложение», может обозначать предисловие, краткое содержание или вводный очерк к Евангелию.
    reason: Техническое значение заголовочного термина нельзя установить уверенно по предоставленному английскому свидетельству.
  - marker: b
    text: В свидетельстве стоит «общедоступных» (exoteric), однако издатель предлагает читать «толковательных» (exegetical).
    reason: Необходимо сохранить и засвидетельствованное чтение, и указанное в источнике исправление.
  - marker: c
    text: В предоставленном свидетельстве вслед за фрагментом XIX помещён также текст под номером XX.
    reason: Пользовательский источник объединяет два фрагмента; маркер поясняет границу материала.
  - marker: d
    text: 'Перевод выполнен по предоставленному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка с греческим или латинским текстом ещё не проведена. Название источника в оригинале приведено по-латыни: Catena Patrum Graecorum in S. Joannem.'
    reason: Требуется прозрачно обозначить промежуточную языковую основу и предварительный характер атрибуции названия.
lexical_decisions:
- source_word: argument
  choice: изложение
  rationale: В заголовке это, вероятно, техническое обозначение вводного очерка или краткого содержания; «изложение» сохраняет широту значения и звучит естественнее буквального «аргумент».
- source_word: made known and given
  choice: обнародовано и передано
  rationale: 'Сохранены два координированных действия: Евангелие стало известным и было вручено/передано церковным общинам.'
- source_word: while he yet remained in the body
  choice: пока он ещё пребывал в теле
  rationale: Сохранён древний телесно-жизненный оборот без истолковывающей замены на простое «при жизни».
- source_word: exoteric (read exegetical)
  choice: '«общедоступных» (читай: «толковательных»)'
  rationale: Передана засвидетельствованная форма и редакторское исправление; первая понимается в обычном значении exoteric, вторая — как exegetical.
- source_word: Son of Thunder
  choice: Сыном грома
  rationale: Сохранено традиционное библейское прозвание в единственном числе, как в данном свидетельстве.
- source_word: the word
  choice: слово
  rationale: Сохранена возможная богословская и семантическая широта выражения без уточнения «Евангелие» или «проповедь».
theological_decisions:
- issue: Авторство и передача Евангелия от Иоанна
  choice: Утверждения позднего свидетеля переданы прямо, как утверждения самого фрагмента.
  alternative: Ослабить формулировки или согласовать их с определённой современной теорией происхождения Евангелия.
  rationale: Перевод не должен ни подтверждать историческую достоверность свидетельства от себя, ни исправлять его в пользу конфессиональной или критической позиции.
- issue: Выражение «пребывал в теле»
  choice: Сохранён буквальный древний оборот.
  alternative: 'Перевести истолковательно: «пока был жив».'
  rationale: Фраза может отражать представление о телесной жизни в противопоставлении смерти; буквальная передача сохраняет богословский оттенок.
- issue: «Восполнить то, чего недоставало» у прежних проповедников
  choice: Сохранена формулировка без уточнения, относилось ли недостающее к письменным Евангелиям, содержанию проповеди или её охвату.
  alternative: 'Уточнить: «дополнить прежние Евангелия».'
  rationale: Английское свидетельство допускает более широкое прочтение, поэтому богословски значимая неоднозначность не устранена.
translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким, историко-церковным регистром. Архаизмы сведены к минимуму, но образные и телесные формулы древнего свидетельства сохранены. Имена переданы в общепринятых русских формах: Иоанн, Папий, Ириней, Евсевий, Иераполь.'
