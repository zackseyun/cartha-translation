  source_fidelity: 'Прямая сверка с греческим/латинским текстом в предоставленных материалах невозможна: дано лишь английское публично-доменное свидетельство, причём оно само отмечает предполагаемую конъектуру exoteric → exegetical. В рамках этого свидетельства перевод в целом точен. Однако оборот «Ибо последним из них Иоанн» синтаксически неполон и не передаёт естественно смысл английского «For, last of these, John»; требуется «Ибо Иоанн, последний из них, ...». Неоднозначность выражений «пребывал в теле», «слово» и исправления названия книг должна быть сохранена.'
  naturalness: Текст в целом выдержан в современном литературном и умеренно высоком историко-церковном регистре. Заголовок «изложение к Евангелию» звучит по-русски менее естественно, чем «Предисловие к Евангелию», при этом примечание сохраняет неопределённость технического термина argumentum. «Глубоким старцем» несколько усиливает простое «very old man»; «весьма преклонного возраста» точнее и естественнее. Библиографическую формулу лучше не переводить как обычное название, а передать как «Катена греческих отцов...», сохранив её характер названия источника.
  terminology: Имена Иоанн, Папий, Иераполь, Ириней и Евсевий переданы нормально. «Сын грома» сохраняет форму данного английского свидетеля. «Церквам», «слово» и «ереси» уместны. «Общедоступных» и «толковательных» адекватно отражают засвидетельствованное чтение и предложенную поправку, если явно оставить последнюю в скобках как редакторское чтение.
