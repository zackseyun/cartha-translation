  - severity: low
    issue: «Глубоким старцем» сильнее, чем «a very old man»
    rationale: Выражение добавляет оттенок крайней дряхлости, отсутствующий в свидетельстве. «Весьма преклонного возраста» передаёт смысл без усиления.
