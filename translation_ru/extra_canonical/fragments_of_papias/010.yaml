  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: ru
  text: '**Фрагмент XIII**


    Итак, более древние толкователи церквей — я имею в виду Филона, философа и современника апостолов, и знаменитого Папия Иерапольского, ученика Иоанна Евангелиста...[a] а также их сподвижников — духовно истолковывали высказывания о рае и относили их к Церкви Христовой.[b]


    — Анастасий Синаит, *Созерцательные анагогические толкования на Шестоднев*, VII


    [a] Многоточие присутствует в доступном английском свидетельстве; возможно, на этом месте опущена часть текста.


    [b] Перевод предварительный: он выполнен по опубликованному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка с греческим или латинским текстом ещё не проведена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Многоточие присутствует в доступном английском свидетельстве; возможно, на этом месте опущена часть текста.
    reason: Необходимо показать, что разрыв принадлежит переданному свидетельству, а не русскому переводчику.
  - marker: b
    text: 'Перевод предварительный: он выполнен по опубликованному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка с греческим или латинским текстом ещё не проведена.'
    reason: Источник прямо указывает, что проверка по древнему языку ожидается; читатель должен видеть ограничение текстовой основы.
lexical_decisions:
- source_word: the more ancient expositors of the churches
  choice: более древние толкователи церквей
  rationale: Сохранены сравнительная форма «более древние» и множественное число «церквей», не сводя выражение к позднейшему техническому понятию церковного Предания.
- source_word: associates
  choice: сподвижники
  rationale: Естественное русское обозначение близких соработников или единомышленников без утверждения об их формальном статусе.
- source_word: the sayings about Paradise
  choice: высказывания о рае
  rationale: Нейтральная передача sayings, не уточняющая без основания, идёт ли речь только о библейских стихах, речениях или более широком круге текстов.
- source_word: interpreted ... spiritually
  choice: духовно истолковывали
  rationale: Передаёт способ толкования и сохраняет отличие между духовным прочтением и последующим отнесением сказанного к Церкви.
- source_word: referred them to the Church of Christ
  choice: относили их к Церкви Христовой
  rationale: Сохраняет несколько открытую формулировку свидетеля и не заменяет её более определёнными словами «отождествляли» или «понимали как».
theological_decisions:
- issue: Соотношение рая и Церкви Христовой
  choice: «духовно истолковывали ... и относили их к Церкви Христовой»
  alternative: «считали рай образом Церкви Христовой»
  rationale: Выбранная формулировка сохраняет две части исходного утверждения и не усиливает его до прямого отождествления рая с Церковью.
- issue: Статус Филона и Папия среди толкователей
  choice: Сохранён перечень без конфессиональных или догматических пояснений
  alternative: Добавить характеристику их авторитета или принадлежности к определённой традиции
  rationale: Свидетель сообщает историко-интерпретационное утверждение, но не требует позднейшей оценки авторитета названных лиц.
translation_notes:
  register: Современный литературный русский язык с умеренно академическим и церковно-историческим достоинством. Синтаксис упрощён лишь настолько, чтобы длинный перечень оставался понятным. Архаизмы и конфессионально маркированные термины не добавлялись; многоточие свидетеля сохранено.
