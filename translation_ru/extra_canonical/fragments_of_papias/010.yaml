  naturalness: 'Текст в целом литературен и понятен. «Духовно истолковывали» и «относили их к Церкви Христовой» удачно сохраняют различие двух действий. «Их сподвижников» естественно, хотя круг этих лиц не конкретизируется свидетельством. Требуется лишь исправить библиографическую строку: развёрнутый русский заголовок в черновике не подтверждён предоставленным witness и к тому же меняет грамматическое число заглавия.'
  terminology: «Рай», «Церковь Христова», «Иоанн Евангелист» и «Папий Иерапольский» уместны и не несут ненужной конфессиональной интерпретации. Латинское сокращённое название произведения следует оставить в форме, данной свидетельством, поскольку надёжный русский библиографический заголовок не предоставлен.
