  language: ru
  text: 'Сохранилось пять книг Папия под заглавием «Истолкование изречений Господа». Ириней также упоминает их как единственные написанные им сочинения и говорит: «Об этом письменно свидетельствует в четвёртой из своих книг Папий — слушатель Иоанна, спутник Поликарпа, муж древности. Всего им составлено пять книг». Таковы слова Иринея.


    Однако сам Папий в предисловии к своим рассуждениям вовсе не утверждает, что был слушателем и очевидцем святых апостолов. Напротив, по его собственным словам видно, что он получил учение веры от тех, кто был близок к ним:


    «Не поколеблюсь я включить для тебя в свои истолкования и всё то, что некогда тщательно узнал от пресвитеров и хорошо запомнил, ручаясь за истинность этого. Ведь я, в отличие от многих, находил удовольствие не в тех, кто много говорит, а в тех, кто учит истине; не в тех, кто передаёт чуждые заповеди, а в тех, кто передаёт заповеди, данные Господом для веры и исходящие от самой Истины. И всякий раз, когда мне встречался кто-либо из последователей пресвитеров, я расспрашивал о словах пресвитеров: что говорил Андрей, что — Пётр, Филипп, Фома, Иаков, Иоанн, Матфей или кто-либо другой из учеников Господа, а также что говорят Аристион и пресвитер Иоанн, ученики Господа. Ибо я полагал, что содержание книг принесёт мне не столько пользы, сколько слова живого и пребывающего голоса».[a]


    Здесь следует заметить, что он дважды называет Иоанна. Первого он упоминает вместе с Петром, Иаковом, Матфеем и прочими апостолами, очевидно имея в виду евангелиста. Другого же Иоанна он называет позднее и ставит в один ряд с теми, кто не входит в число апостолов; при этом Аристиона он помещает перед ним, а самого Иоанна прямо называет пресвитером. Тем самым он ясно подтверждает слова тех, кто говорит, что в Азии жили два человека с этим именем и что в Эфесе находятся две гробницы, каждая из которых и поныне называется гробницей Иоанна. Обратить на это внимание важно: вероятно, именно второй Иоанн — если не признать, что это был первый, — видел Откровение, носящее имя Иоанна. Папий, о котором теперь идёт речь, признаёт, что получил слова апостолов от их последователей, но говорит, что сам был слушателем Аристиона и пресвитера Иоанна. Во всяком случае, он часто упоминает их по имени и записывает в своих сочинениях их предания. Полагаю, что эти замечания были приведены не напрасно.


    Однако к приведённым выше словам Папия стоит добавить и другие места из его сочинений, где он записывает ещё несколько удивительных событий, также дошедших до него в предании. Выше уже говорилось, что апостол Филипп жил в Иераполе со своими дочерьми; здесь же следует отметить рассказ Папия, их современника, о том, что он услышал от дочерей Филиппа удивительную историю. Он сообщает, что в его время один человек воскрес из мёртвых. Кроме того, он приводит и другой удивительный рассказ — об Иусте, прозванном Варсавой: тот выпил смертельный яд, но по благодати Господа ничуть не пострадал. Об этом Иусте книга Деяний сообщает, что после вознесения Спасителя святые апостолы выдвинули его вместе с Матфием и помолились о правильном избрании вместо предателя Иуды, чтобы восполнить их число. Это место звучит приблизительно так: «И поставили двоих: Иосифа, называемого Варсавой, который был прозван Иустом, и Матфия; и помолились, говоря…»


    Тот же автор записал и другие сведения, дошедшие до него в устном предании: некоторые необычные притчи Спасителя и Его поучения, а также некоторые другие рассказы, имеющие скорее баснословный характер. В их числе его утверждение, что после воскресения наступит период в тысячу лет и что Царство Христа будет установлено на этой земле в телесном виде.[b] Я полагаю, он пришёл к этим представлениям, неверно поняв апостольские повествования и не уразумев, что записанное там в образах было высказано ими таинственно.


    Судя по его собственным словам, он, очевидно, был человеком весьма ограниченного ума. И всё же именно из-за него многие последующие церковные писатели приняли такое же мнение, ссылаясь в его поддержку на древность этого мужа; среди них был, например, Ириней, а также другие, заявлявшие, что придерживаются подобных взглядов. В своём сочинении Папий приводит и другие сообщения о словах Господа, полученные от упомянутого выше Аристиона, а также предания пресвитера Иоанна. Желающих узнать о них подробнее мы отсылаем к самому сочинению; здесь же, в дополнение к уже приведённым словам Папия, изложим лишь предание об авторе Евангелия Марке, которое дошло через этих людей:


    «И пресвитер говорил также следующее: Марк, став толкователем Петра,[c] точно записал всё, что помнил, хотя и не по порядку излагал то, что было сказано или совершено Христом. Ведь он не слышал Господа и не следовал за Ним, но позднее, как я уже сказал, сопровождал Петра. Пётр строил свои наставления сообразно нуждам слушателей, не намереваясь составить связное изложение изречений Господа. Поэтому Марк не допустил ошибки, записав кое-что так, как помнил: он заботился лишь о том, чтобы ничего не упустить из услышанного и ничего не передать ложно».[d]


    Так сообщает Папий о Марке. О Матфее же он говорит следующее:


    «Итак, Матфей составил изречения на еврейском наречии,[e] а каждый истолковывал их как мог».


    Тот же автор приводил свидетельства из Первого послания Иоанна, а также из Первого послания Петра. Он рассказал и другую историю — о женщине, которую перед Господом обвиняли во многих грехах и о которой повествует Евангелие согласно…[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В цитате Папия глаголы при первых учениках переданы как «что говорил», а при Аристионе и пресвитере Иоанне — как «что говорят»; это различие может указывать на прошлых и ещё живых свидетелей.
    reason: Сохраняет значимую временную асимметрию греческого текста.
  - marker: b
    text: В греческом тексте Евсевия стоит «тысяча лет». Чтение «десять тысяч лет» в предоставленном английском свидетеле является очевидным OCR или печатным искажением.
    reason: Документирует исправление, внесённое по исходному греческому тексту.
  - marker: c
    text: Слово, переведённое как «толкователь», может также означать «переводчик».
    reason: Сохраняет лексическую неоднозначность ἑρμηνευτής.
