base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: ru
  text: 'Ириней и другие сообщают, что Иоанн Богослов и апостол дожил до времён Траяна. После этого стали известны его слушатели — Папий Иерапольский и Поликарп, епископ Смирны.


    — Евсевий, «Хроника» (Синкелл, 655, 14), к 220-й олимпиаде.


    II


    В это время в Асии[a] прославился Поликарп, ученик апостолов, который [повреждённый и неразборчивый текст о церкви в Смирне и «…служителях Господа»].[b] В то же время стал известен Папий, также бывший епископом Иерапольской епархии.


    — Евсевий, «Церковная история», 3.36.1–2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Асия — римская провинция в западной части Малой Азии, а не современная Азия как часть света.
    reason: Предотвращает географическое недоразумение.
  - marker: b
    text: В предоставленном печатном свидетеле эта часть предложения сильно повреждена и не поддаётся надёжному восстановлению. Перевод с греческого оригинала требует отдельной сверки источника.
    reason: Прозрачно обозначает пределы исходных данных и не маскирует лакуну.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: Иоанн Богослов и апостол
  rationale: Традиционное и понятное русское соответствие титулу Divine; сохраняется отдельное обозначение Иоанна как апостола.
- source_word: his hearers
  choice: его слушатели
  rationale: Сохранена связь с предшествующим Иоанном без усиления до более определённого «ученики».
- source_word: flourished / became distinguished
  choice: прославился / стал известен
  rationale: Естественно передаёт историографическую формулу о времени заметной деятельности, не приписывая духовного процветания.
- source_word: Asia
  choice: Асия
  rationale: Указывает на римскую провинцию, а не на современную часть света.
- source_word: diocese of Hierapolis
  choice: Иерапольская епархия
  rationale: Употреблён естественный русский церковно-исторический термин при сохранении содержания английского свидетеля.
theological_decisions:
- issue: Характер связи Папия и Поликарпа с Иоанном
  choice: «его слушатели»
  alternative: «его ученики»
  rationale: Свидетель называет их hearers; более сильное обозначение ученичества могло бы необоснованно разрешить историческую неоднозначность.
- issue: Ученичество Поликарпа
  choice: «ученик апостолов»
  alternative: «ученик апостольский»
  rationale: Сохранено множественное число и прямое утверждение данного свидетеля без конфессионального расширения.
- issue: Повреждённая середина второго фрагмента
  choice: Явно обозначен текстуальный пробел
  alternative: Реконструировать предполагаемое содержание
  rationale: Предоставленный английский свидетель испорчен; домысливание могло бы создать неподтверждённое историко-богословское утверждение.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным церковно-историческим регистром. Имена и названия приведены в устоявшейся русской форме. Черновик является предварительным: предоставлена испорченная английская публикация, а прямая сверка греческого/латинского источника ещё не выполнена.'
