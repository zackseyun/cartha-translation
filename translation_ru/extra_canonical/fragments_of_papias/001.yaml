    reason: Прозрачно обозначает лакуну и не маскирует текстуальную неопределённость.
  revision_rationale: 'Исправлены два безопасных пункта: историографическое «flourished» передано нейтральным «был известен», а «епархия» заменена на «общину в Иераполе», чтобы не вносить позднейшую административную конкретизацию. Лакуна сохранена явно, но помещена после завершённого русского предложения, чтобы устранить синтаксический обрыв. Содержание повреждённого места не реконструируется.'
