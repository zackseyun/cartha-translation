review_pass:
  verdict: revise
  source_fidelity: 'Первая часть передана близко к предоставленному английскому свидетелю: «его слушатели» корректно сохраняет связь с Иоанном и не превращает её в более сильное «ученики». Во второй части необходимо не подменять церковно-административное значение исходной формулы позднейшим и более определённым термином «епархия». При отсутствии прямой сверки греческого текста безопаснее передать её как «община в Иераполе» и отметить ограниченность свидетеля в примечании. Повреждённый фрагмент обоснованно оставлен без реконструкции.'
  naturalness: В целом русский текст литературный и ясный. «Прославился» несколько смещает значение chronographic «flourished» к однократному обретению славы; «был известен» нейтральнее и точнее в данном контексте. Отдельное оформление лакуны после законченного предложения делает синтаксис естественным.
  terminology: «Иоанн Богослов и апостол», «Поликарп», «Смирна», «Асия» и «апостолы» употреблены уместно. «Иерапольская епархия» может анахронистически обозначать оформленную позднейшую административную единицу; «община в Иераполе» не навязывает такого устройства и лучше соответствует традиционной формуле о местной церкви/общине.
  issues:
  - severity: medium
    issue: «Иерапольская епархия» как перевод «diocese of Hierapolis»
    rationale: Термин «епархия» в современном русском обычно вызывает представление о позднейшей территориальной церковной структуре. В контексте раннецерковного свидетельства безопаснее говорить об общине в Иераполе, не усиливая административный смысл.
  - severity: low
    issue: «Поликарп ... прославился» для «flourished»
    rationale: «Прославился» акцентирует момент достижения славы, тогда как историографическая формула обозначает заметную деятельность или известность в данное время.
  revised_text: 'Ириней и другие сообщают, что Иоанн Богослов и апостол дожил до времён Траяна. После этого получили известность его слушатели — Папий Иерапольский и Поликарп, епископ Смирны.


    — Евсевий, «Хроника» (Синкелл, 655, 14), к 220-й олимпиаде.


    II


    В это время в Асии[a] был известен Поликарп, ученик апостолов. [Далее следует повреждённый и неразборчивый текст о церкви в Смирне и «…служителях Господа».][b] В то же время стал известен Папий, также бывший епископом общины в Иераполе.


    — Евсевий, «Церковная история», 3.36.1–2.'
  revised_footnotes:
  - marker: a
    text: Асия — римская провинция в западной части Малой Азии, а не современная Азия как часть света.
    reason: Предотвращает географическое недоразумение.
  - marker: b
