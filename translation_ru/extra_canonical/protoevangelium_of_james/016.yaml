translation:
  language: ru
  text: '(1) Священник сказал: «Верни деву, которую ты взял из Храма Господня».


    Иосиф заплакал.


    Тогда первосвященник сказал: «Я дам тебе выпить воды обличения Господня, и она явит твой грех перед твоими глазами».[a]


    (2) Священник взял воду, дал её Иосифу и послал его в пустыню. Иосиф вернулся невредимым.


    Затем он дал её Марии и послал её в пустыню. И она вернулась невредимой.


    Весь народ удивился тому, что их грех не обнаружился.[b]


    (3) Священник сказал: «Если Господь Бог не явил вашего греха, то и я вас не осуждаю». И отпустил их.


    Иосиф взял Марию и пошёл к себе домой, радуясь и прославляя Бога Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вода обличения Господня» обозначает воду для испытания, которое должно было обнаружить вину. Точная греческая формулировка нуждается в проверке по рукописной традиции.
    reason: Перевод пока основан на публичном английском свидетельстве, а выражение допускает несколько оттенков.
  - marker: b
    text: То есть испытание не выявило приписываемого Иосифу и Марии греха.
    reason: Поясняет референт местоимения и судебный смысл фразы, не превращая её в более широкое утверждение о безгрешности.
lexical_decisions:
- source_word: virgin
  choice: дева
  rationale: Сохраняет возвышенный повествовательный регистр и обозначение Марии как посвящённой Храму девушки; слово «девственница» здесь звучало бы излишне клинически.
- source_word: Temple of the Lord
  choice: Храм Господень
  rationale: Естественная для русского библейского регистра формулировка, сохраняющая сакральную определённость выражения.
- source_word: water of the Lord’s rebuke
  choice: вода обличения Господня
  rationale: Передаёт судебно-испытательный смысл «rebuke», не конкретизируя сверх свидетельства характер ритуала.
- source_word: wilderness
  choice: пустыня
  rationale: Традиционное и понятное библейское соответствие, хотя контекст не уточняет ландшафт или длительность испытания.
- source_word: unharmed
  choice: невредимым / невредимой
  rationale: Сохраняет наблюдаемый результат испытания без добавления толкования о юридическом оправдании.
- source_word: set them free
  choice: отпустил их
  rationale: В контексте решения священника это естественнее буквального «освободил» и не предполагает тюремного заключения.
theological_decisions:
- issue: Характер испытания водой
  choice: Сохранено как действие «воды обличения Господня» без пояснения механизма.
  alternative: Отождествить испытание с конкретным предписанием из Чисел 5 и назвать воду «горькой водой, наводящей проклятие».
  rationale: Предоставленный текст таких подробностей не содержит; прямое отождествление преждевременно до проверки греческой традиции.
- issue: Фраза «их грех не обнаружился»
  choice: Сохранена повествовательная формулировка о невыявленном грехе.
  alternative: Перевести как окончательное утверждение их безгрешности или невиновности.
  rationale: Текст описывает результат испытания и последующее отсутствие осуждения, но не требует расширять это до общего богословского заявления о безгрешности.
- issue: Единственное и множественное число в словах священника
  choice: «вашего греха» и «вас не осуждаю».
  alternative: 'Обращение только к Иосифу: «твоего греха», «тебя не осуждаю».'
  rationale: После испытания обоих участников смысл реплики относится к Иосифу и Марии; множественное число естественно в русском, но требует проверки по греческому тексту.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён там, где многократное английское «And» звучало бы тяжеловесно, но последовательность действий сохранена. Проект предварительный: предоставлена английская версия-свидетель; непосредственная сверка с греческой рукописной традицией ещё необходима.'
