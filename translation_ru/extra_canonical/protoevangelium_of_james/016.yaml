  naturalness: 'Регистр выдержан: современный литературный русский с уместной библейской окраской. «Дева», «Храм Господень», «пустыня» и «Бог Израиля» звучат естественно. Исправлен один калькированный оборот; «Иосиф заплакал» хорошо передаёт, что он был в слезах.'
