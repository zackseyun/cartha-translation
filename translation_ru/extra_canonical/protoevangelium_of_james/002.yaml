  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: ru
  text: '(1) Жена его, Анна, горько оплакивала две свои беды. Она говорила: «Оплакиваю и своё вдовство, и свою бездетность».


    (2) Приближался великий день Господень, и служанка Анны, Юфина, сказала ей: «Долго ли ты будешь унижать свою душу? Вот, приблизился великий день Господень, и тебе не подобает скорбеть. Возьми эту повязку на голову, которую дала мне женщина, у которой я работаю. Мне не подобает носить её, потому что я твоя служанка, а на ней царский знак».


    (3) Анна сказала: «Отойди от меня! Я этого не сделаю. Господь Бог тяжко унизил меня. Быть может, эту повязку дал тебе обманщик, а ты пришла, чтобы и меня сделать соучастницей твоего греха».


    Служанка Юфина ответила: «Зачем мне проклинать тебя, если ты не послушала моего голоса? Господь Бог заключил твоё чрево, чтобы ты не принесла плода в Израиле».


    (4) Анна глубоко опечалилась. Она сняла траурную одежду, омыла голову и надела свадебные одежды. Около девятого часа[a] она спустилась в свой сад, чтобы пройтись. Увидев лавровое дерево, она села под ним и, отдохнув, обратилась с мольбой к Господу: «Боже моих предков, благослови меня и услышь мою молитву, как Ты благословил нашу праматерь Сарру и даровал ей сына Исаака».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть примерно в три часа пополудни.
    reason: Пояснение древнего способа счёта дневных часов для современного читателя.
lexical_decisions:
- source_word: two reasons / two laments (Greek review pending)
  choice: две свои беды
  rationale: Передаёт два предмета плача — вдовство и бездетность — естественно по-русски, не превращая их в отвлечённые «причины».
- source_word: humiliate your soul
  choice: унижать свою душу
  rationale: Сохранён необычный семитизированный оборот и связь с последующим «Господь Бог тяжко унизил меня»; более свободное «изнурять себя» сняло бы эту словесную перекличку.
- source_word: headband
  choice: повязка на голову
  rationale: Нейтральное обозначение предмета одежды без преждевременного уточнения его формы по греческому тексту, проверка которого ещё требуется.
- source_word: leader of the workplace
  choice: начальница мастерской
  rationale: Контекст предполагает руководительницу места женского труда; формулировка остаётся предварительной ввиду отсутствия прямой сверки с греческим.
- source_word: made your womb infertile
  choice: заключил твоё чрево
  rationale: Сохраняет библейский образ закрытого чрева и достоинство регистра; буквальное «сделал бесплодной твою утробу» менее естественно.
- source_word: fruit in Israel
  choice: плода в Израиле
  rationale: Сохранена метафора плода и её возможный широкий богословский оттенок, а не сведено просто к «ребёнку».
- source_word: wedding garment
  choice: брачные одежды
  rationale: Сохраняет возможную отсылку к праздничному или свадебному наряду, не заменяя её общим «лучшим платьем».
- source_word: God of my ancestors
  choice: Боже моих предков
  rationale: Современное и инклюзивное по смыслу выражение родовой преемственности; не ограничено только мужской линией словом «отцов».
theological_decisions:
- issue: Высказывание служанки о причине бесплодия Анны
  choice: «Господь Бог заключил твоё чрево» оставлено как прямая речь персонажа
  alternative: Смягчить до «Господь допустил твоё бесплодие»
  rationale: Текст приписывает действие Богу в реплике служанки. Перевод не должен ни превращать её слова в авторское утверждение, ни устранять напряжение, вводя отсутствующее «допустил».
- issue: «Великий день Господень»
  choice: сохранена формула без определения конкретного праздника
  alternative: Назвать праздник, например Пасхой или Днём очищения
  rationale: Предоставленный источник праздника не идентифицирует; конкретизация импортировала бы спорное толкование.
- issue: Образ «плода в Израиле»
  choice: сохранён буквально
  alternative: «не дать тебе ребёнка среди Израиля»
  rationale: Буквальный образ может обозначать как потомство, так и место ребёнка в народе; перевод сохраняет эту многозначность.
- issue: Анна называет себя вдовой при отсутствии мужа
  choice: сохранено «вдовство» без объяснения фактической смерти Иоакима
  alternative: Передать как «я осталась одна»
  rationale: В контексте это плач покинутой супруги, однако слово свидетеля звучит как «вдова». Напряжение не следует молча устранять.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён там, где это не стирает повторов и образных связей. Формулы «день Господень», «заключил чрево», «плод в Израиле» и обращение к Сарре сохранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетеле; необходима прямая сверка с греческой рукописной традицией.'
