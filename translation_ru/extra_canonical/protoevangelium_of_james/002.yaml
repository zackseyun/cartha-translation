    issue: «Начальница мастерской» добавляет не засвидетельствованную конкретизацию.
    rationale: Греч. ἐργοδότις обозначает работодательницу/хозяйку; ни тип рабочего места, ни ткацкое производство в этом слове не содержатся.
  - severity: low
    issue: Примечания a–c формулируют неопределённости шире, чем это требуется текстом.
    rationale: Имя можно передать как «Юфина»; «мастерская» и тем более «ткацкая мастерская» не должны быть предложены как альтернатива; νυμφικά прямо относится к свадебному наряду.
  - severity: low
    issue: «Брачные одежды» менее обычно, чем «свадебные одежды».
    rationale: «Свадебные одежды» сохраняет значение νυμφικά и звучит естественнее по-русски.
