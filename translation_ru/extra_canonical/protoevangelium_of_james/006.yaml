  yaml_path: translation/extra_canonical/protoevangelium_of_james/006.yaml
  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: ru
  text: '**Протоевангелие Иакова — Глава 6. Первый год жизни Марии**


    **(1)** День ото дня девочка крепла. Когда ей исполнилось шесть месяцев, мать поставила её на землю, чтобы проверить, сможет ли она стоять. Девочка прошла семь шагов и подошла к материнской груди. Мать подхватила её и сказала:


    — Жив Господь, Бог мой! Ты больше не будешь ходить по этой земле, пока я не введу тебя в Храм Господень.


    И она устроила святилище в своей спальне и не позволяла, чтобы туда вносили что-либо осквернённое или нечистое. Она позвала непорочных дочерей евреев, и они играли с девочкой.


    **(2)** Когда девочке исполнился год, Иоаким устроил большой пир и пригласил первосвященников, священников, книжников, старейшин и весь народ Израиля. Иоаким принёс девочку к священникам, и они благословили её, говоря:


    — Бог наших предков, благослови это дитя и даруй ему имя, которое будут произносить вовеки, из поколения в поколение.


    И весь народ сказал:


    — Да будет так! Аминь!


    Затем девочку принесли к первосвященникам, и те благословили её, говоря:


    — Всевышний Бог, призри на это дитя и благослови его окончательным благословением, которое невозможно превзойти.


    **(3)** Мать отнесла девочку наверх, в святилище своей спальни, и накормила её грудью. И Анна сложила песнь Господу Богу:


    «Воспою святую песнь Господу, Богу моему,

    потому что Бог посетил меня

    и избавил меня от упрёков врагов моих.


    Господь Бог дал мне плод Своей праведности —

    единственный, но многократный пред Ним.[a]


    Кто возвестит народу Рувила,[b]

    что Анна кормит дитя грудью?

    Слушайте, слушайте, двенадцать племён Израиля:

    Анна кормит дитя грудью!»


    И Анна дала девочке отдохнуть в святилище своей спальни, а сама пошла прислуживать гостям. Когда трапеза окончилась, они ушли, радуясь и прославляя Бога Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «единственный, но многократный» в дошедшей формулировке не вполне ясно; оно может описывать один плод, приносящий множество плодов. Перевод сохраняет парадокс исходного свидетельства.
    reason: Предупреждает читателя о подлинной лексической неоднозначности и не подменяет её догматическим толкованием.
  - marker: b
    text: «Рувил» передаёт форму имени в использованном свидетельстве; вероятно, имеется в виду Рувим или его потомки, однако прямую сверку с греческой рукописной традицией ещё предстоит провести.
    reason: Форма имени в английском публичном свидетельстве необычна, а проверка греческого текста обозначена как ожидающая выполнения.
lexical_decisions:
- source_word: sanctuary
  choice: святилище
  rationale: Сохраняет намеренно сакральное обозначение выделенного пространства в спальне, не сводя его просто к «чистой комнате».
- source_word: sacrilegious or impure
  choice: осквернённое или нечистое
  rationale: 'Передаёт две связанные, но не полностью совпадающие категории: профанацию священного и ритуальную либо нравственную нечистоту.'
- source_word: pure daughters of the Hebrews
  choice: непорочные дочери евреев
  rationale: «Непорочные» естественнее обозначает личную чистоту приглашённых девушек; этническое наименование передано современным русским словом.
- source_word: visited me
  choice: посетил меня
  rationale: Сохранён библейский оборот о Божьем благосклонном вмешательстве без поясняющего истолкования.
- source_word: criticism of my enemies
  choice: упрёков врагов моих
  rationale: В контексте речь идёт о поношении Анны из-за бездетности; «упрёки» звучит естественно и не добавляет более узкого толкования.
- source_word: final blessing
  choice: окончательным благословением
  rationale: Сохраняет необычную формулировку свидетеля и не заменяет её безоговорочно на истолковывающее «высшее».
- source_word: ministered to them
  choice: прислуживать гостям
  rationale: Контекст пира указывает на обслуживание собравшихся; современная формулировка устраняет возможное ошибочное понимание как религиозного служения.
theological_decisions:
- issue: Сакральный статус комнаты Марии
  choice: Сохранено слово «святилище» и запрет на внесение осквернённого или нечистого
  alternative: «Устроила чистое место»
  rationale: Текст намеренно изображает пространство как освящённое; ослабление этого образа скрывало бы богословский акцент повествования.
- issue: Необычный образ плода Божьей праведности
  choice: «плод Своей праведности — единственный, но многократный пред Ним» с примечанием
  alternative: Истолковать как единственного ребёнка, который принесёт многие плоды
  rationale: Смысл выражения неясен, а источник допускает парадокс; перевод сохраняет напряжение, не закрепляя частное мариологическое толкование.
- issue: Благословение первосвященников
  choice: «окончательное благословение, которое невозможно превзойти»
  alternative: «высшее благословение»
  rationale: Сохранены обе части свидетельства — завершённость и непревзойдённость, — без привнесения конфессиональной формулы.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя, при этом сохранены повторения, молитвенная поэтика и необычные образы. Проект основан на предоставленном публичном английском свидетельстве и консультационном POB; прямая проверка греческой рукописной традиции остаётся необходимой. Реплика матери оформлена естественно по-русски, а песнь — свободными строками без искусственной рифмы.
