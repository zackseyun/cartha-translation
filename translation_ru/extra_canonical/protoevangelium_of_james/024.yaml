  text: '(1) But at the hour of greeting, the priests came, and Zechariah did not meet them to bless them as was customary. And the priests stood around for Zechariah, waiting to greet him with a blessing and to glorify the Most High God.


    (2) But when he delayed, they were all afraid. But one of them gathered the courage to go into the sanctuary and saw blood clotted beside the altar of the Lord. And a voice was saying, “Zechariah has been murdered, and his blood will not be wiped away until his avenger comes!”


    When he heard this saying, he was afraid, and he went and reported to the priests what he had seen and heard. (3) And they gathered their courage and went and saw what had taken place. And the panels of the Temple cried out, and they—the priests—ripped their clothes from top to bottom. And they did not find his corpse, but they found his blood had turned to stone. And they were afraid, and they went out and reported to all the people that Zechariah had been murdered. And when all the tribes of the people heard, they mourned him and wept three days and three nights.


    (4) And after three days, the priests held a council about who should replace Zechariah. And the lot fell to Simeon, for he was told by the Holy Spirit that he would not see death until he saw the Christ in the flesh.'
translation:
  language: ru
  text: '(1) В час приветствия пришли священники, но Захария не вышел им навстречу, чтобы, по обычаю, благословить их. Священники стояли и ждали Захарию, чтобы принять его благословение и прославить Всевышнего Бога.


    (2) Он всё не выходил, и всех охватил страх. Тогда один из них набрался смелости, вошёл в святилище и увидел у жертвенника Господня запёкшуюся кровь. И голос говорил: «Захария убит, и кровь его не будет стёрта, пока не придёт его мститель!»


    Услышав эти слова, он испугался, вышел и рассказал священникам о том, что видел и слышал.


    (3) Тогда они набрались смелости, вошли и увидели случившееся. Панели Храма возопили[a], и священники разорвали свои одежды сверху донизу. Тела Захарии они не нашли, но увидели, что кровь его обратилась в камень. Их охватил страх; они вышли и возвестили всему народу, что Захария убит. Услышав об этом, все племена народа оплакивали его и рыдали три дня и три ночи.


    (4) По прошествии трёх дней священники собрались на совет, чтобы решить, кто займёт место Захарии. Жребий выпал Симеону, ибо Святой Дух открыл ему, что он не увидит смерти, пока не увидит Христа во плоти[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «части (доски) Храма возопили». Точное обозначение архитектурного элемента следует проверить по греческим рукописям.'
    reason: Предоставленный материал основан на английском свидетельстве, а выражение «panels of the Temple» лексически неоднозначно.
  - marker: b
    text: 'Буквально: «пока не увидит Христа в плоти».'
    reason: Отмечает телесную формулировку текста и сохраняет возможность более буквального прочтения.
lexical_decisions:
- source_word: hour of greeting
  choice: час приветствия
  rationale: Сохранено необычное обозначение установленного времени служения или приветствия без догадочной конкретизации.
- source_word: sanctuary
  choice: святилище
  rationale: Передаёт внутреннее священное пространство, не отождествляя его без необходимости со всем Храмом.
- source_word: blood clotted
  choice: запёкшаяся кровь
  rationale: Естественное современное выражение, сохраняющее физический образ свернувшейся крови.
- source_word: avenger
  choice: мститель
  rationale: Сохраняет мотив воздаяния и намеренно не уточняет, идёт ли речь о родственнике-мстителе или о божественном возмездии.
- source_word: panels of the Temple
  choice: панели Храма
  rationale: Буквальная предварительная передача не вполне ясной архитектурной детали; требуется сверка с греческим текстом.
- source_word: all the tribes of the people
  choice: все племена народа
  rationale: Сохранён коллективный библейский образ, а не сглажено до «весь народ».
- source_word: the Christ
  choice: Христос
  rationale: Передаёт титул Мессии в привычной русской форме без пояснительной вставки.
- source_word: in the flesh
  choice: во плоти
  rationale: Сохранена телесная конкретность выражения и его богословское напряжение.
theological_decisions:
- issue: Неисчезающая кровь Захарии
  choice: «кровь его не будет стёрта, пока не придёт его мститель»
  alternative: «кровь его не исчезнет, пока не придёт Отмститель»
  rationale: Сохранены и физический образ стирания крови, и неопределённость личности мстителя; прописная буква не вводится без достаточного основания.
- issue: Откровение Симеону Святым Духом
  choice: «Святой Дух открыл ему»
  alternative: «ему было сказано Святым Духом»
  rationale: Естественная русская пассивно-смысловая передача сохраняет Святого Духа как источник сообщения, не уточняя способ откровения.
- issue: Увидеть смерть
  choice: «не увидит смерти»
  alternative: «не умрёт»
  rationale: Сохранён семитизированный библейский оборот и его связь с традиционной формулировкой о Симеоне.
- issue: Христос во плоти
  choice: «Христа во плоти»
  alternative: «воплощённого Христа»
  rationale: Более буквальная формулировка не навязывает позднейшую терминологическую интерпретацию и сохраняет исходный образ.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Повторы и нарастание страха в повествовании в основном сохранены, но синтаксис слегка сглажен для ясности. Проект предварительный: предоставленное исходное свидетельство является английским переводом, а прямая сверка с греческой рукописной традицией ещё не выполнена.'
