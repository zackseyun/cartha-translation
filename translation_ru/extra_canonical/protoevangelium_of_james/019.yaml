translation:
  language: ru
  text: '(1) И вот, с горы спускалась женщина. Она спросила меня:


    — Человек, куда ты идёшь?


    Я ответил:


    — Ищу повитуху из евреев.


    Она спросила меня:


    — Ты из Израиля?


    Я ответил ей:


    — Да.


    Тогда она спросила:


    — А кто рожает в пещере?


    Я ответил:


    — Моя обручённая.


    Она спросила меня:


    — Разве она не твоя жена?


    Я ответил ей:


    — Мария воспитывалась в Храме Господнем, и по жребию было решено, что она станет моей женой. Но она мне не жена; зачала же она от Святого Духа.


    Повитуха спросила:


    — Неужели?


    Иосиф сказал ей:


    — Пойдём, увидишь.


    И повитуха пошла с ним.


    (2) Они остановились перед пещерой, и светлое облако осенило пещеру. Повитуха сказала:


    — Сегодня возвеличилась душа моя, потому что глаза мои увидели дивное: Израилю родилось спасение!


    И тотчас облако отошло от пещеры, а в пещере явился великий свет, так что глаза их не могли его вынести. Немного спустя свет стал угасать, пока не показался младенец. Он приблизился и взял грудь своей матери Марии.


    Повитуха воскликнула:


    — Как велик для меня этот день, ведь я увидела это новое чудо!


    (3) Повитуха вышла из пещеры, и её встретила Саломея.


    Повитуха сказала ей:


    — Саломея, Саломея, я должна рассказать тебе о невиданном зрелище: дева родила вопреки естеству![a]


    Саломея ответила:


    — Жив Господь, Бог мой! Пока я не исследую её состояние,[b] не поверю, что дева родила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по предоставленному английскому свидетельству: «дева родила, что против её природы». Греческий текст требует прямой сверки.'
    reason: Фраза допускает более одного понимания; примечание сохраняет неоднозначность и отмечает ограниченность основы перевода.
  - marker: b
    text: Слово «состояние» передаёт эвфемистическое выражение предоставленного свидетельства; далее по повествованию подразумевается телесная проверка девства Марии.
    reason: Основной текст не должен добавлять анатомическую конкретику, отсутствующую в данном английском свидетельстве, но читателю полезно обозначить смысл в контексте.
lexical_decisions:
- source_word: Hebrew midwife
  choice: повитуху из евреев
  rationale: Передаёт этническое определение естественнее, чем потенциально двусмысленное «еврейскую повитуху», и сохраняет указание свидетельства.
- source_word: overshadowed
  choice: осенило
  rationale: Сохраняет библейскую образность облака без излишне буквального и тяжёлого «покрыло своей тенью».
- source_word: my soul is magnified
  choice: возвеличилась душа моя
  rationale: Сохранён заметный библейский оборот и возможная отсылка; не заменён пояснительным пересказом.
- source_word: Salvation has been born to Israel
  choice: Израилю родилось спасение
  rationale: Сохранена необычная персонифицированная формулировка и её богословская напряжённость.
- source_word: infant
  choice: младенец
  rationale: Обычное dignified соответствие, подходящее повествовательному регистру.
- source_word: condition
  choice: состояние
  rationale: Нейтральная формулировка сохраняет эвфемистическую неопределённость свидетельства и не вводит отсутствующих анатомических подробностей.
theological_decisions:
- issue: Статус Марии по отношению к Иосифу
  choice: «станет моей женой. Но она мне не жена»
  alternative: «была дана мне в жёны, однако она не моя жена»
  rationale: Сохранено явное напряжение текста между решением по жребию и отрицанием состоявшегося супружества; оно не согласовывается искусственно.
- issue: Зачатие от Святого Духа
  choice: «зачала же она от Святого Духа»
  alternative: «она беременна от Святого Духа»
  rationale: Выбрана традиционно понятная, но современно читаемая формулировка, точно передающая утверждение о происхождении зачатия.
- issue: Рождение спасения Израилю
  choice: «Израилю родилось спасение»
  alternative: «для Израиля родился Спаситель»
  rationale: Не введён титул «Спаситель», которого нет в предоставленном свидетельстве; абстрактное «спасение» сохранено.
- issue: Девственное рождение и «естество»
  choice: «дева родила вопреки естеству»
  alternative: «девственница родила, хотя это противоречит природе»
  rationale: Сохранена сжатая древняя формулировка, не уточняющая, идёт ли речь о природе девы, обычном ходе рождения или физиологическом ожидании.
translation_notes:
  register: 'Современный литературный русский язык с достоинством древнего религиозного повествования. Повторы и диалогическая простота в основном сохранены; избыточные начальные союзы частично сняты ради естественного русского синтаксиса. «Храм Господень», «осенило», «возвеличилась душа моя» и «жив Господь» поддерживают библейский регистр без архаизации всего текста. Проект остаётся предварительным: предоставлена английская версия-свидетельство, тогда как прямая сверка с греческой рукописной традицией ещё не проведена.'
