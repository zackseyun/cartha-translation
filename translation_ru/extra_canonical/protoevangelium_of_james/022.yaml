base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: ru
  text: '(1) Когда Ирод понял, что волхвы обманули его, он разгневался. Он послал убийц и велел им убить всех младенцев двух лет и младше.


    (2) Услышав, что младенцев убивают, Мария испугалась. Она взяла своего ребёнка, запеленала его и положила в кормушку для скота.


    (3) Услышав, что Иоанна разыскивают, Елизавета взяла его и ушла в горы. Она искала, где бы спрятать его, но укрытия не было. Тогда Елизавета со стоном сказала: «Гора Божья, прими мать с ребёнком», — потому что выше подняться она не могла. И тотчас гора расступилась и приняла их, а свет светил ей сквозь гору. Ведь с ними был ангел Господень и охранял их.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magi
  choice: волхвы
  rationale: Традиционный и понятный русский эквивалент, сохраняющий древний культурный колорит без уточнения, которого нет в свидетельстве.
- source_word: killers
  choice: убийцы
  rationale: Сохраняет резкость исходного обозначения исполнителей, не заменяя его более официальным «воины» или «палачи».
- source_word: infants
  choice: младенцы
  rationale: Естественный русский эквивалент, соответствующий контексту детей в возрасте до двух лет.
- source_word: wrapped him in cloths
  choice: запеленала его
  rationale: Естественно передаёт оборачивание младенца тканями в русском языке.
- source_word: manger for cows / feeding trough for cows
  choice: кормушка для коров
  rationale: Передаёт конкретный предмет понятным современным языком и не вводит традиционное «ясли» там, где свидетельство прямо уточняет назначение кормушки.
- source_word: Mountain of God
  choice: Гора Божья
  rationale: Сохраняет прямое обращение и сакральное определение; прописная буква отмечает персонифицированное обращение.
- source_word: split and took her
  choice: расступилась и приняла её
  rationale: Передаёт чудесное раскрытие горы и её принятие Елизаветы, не объясняя сверх сказанного способ укрытия.
theological_decisions:
- issue: Чудесное укрытие Елизаветы и Иоанна в горе
  choice: Сохранено как прямое повествовательное утверждение
  alternative: Смягчить как видение, легендарный мотив или метафору
  rationale: Источник излагает событие буквально; перевод не должен переосмысливать жанр или оценивать историчность.
- issue: Действие ангела Господня
  choice: «с ними был ангел Господень и охранял их»
  alternative: Уточнить, что ангел создавал свет или раскрыл гору
  rationale: Свидетельство связывает ангела с защитой, но прямо не приписывает ему каждое предшествующее чудесное действие.
- issue: Множественное местоимение в заключении
  choice: «с ними… охранял их»
  alternative: «с ней… охранял её»
  rationale: Сохранено множественное число свидетельства, естественно относящееся к Елизавете и Иоанну.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествовательным ритмом. Черновик подготовлен по предоставленному англоязычному свидетельству; необходима последующая прямая сверка с греческой рукописной традицией. Библейски узнаваемые слова сохранены там, где они понятны современному читателю, но архаический синтаксис не воспроизводился.
