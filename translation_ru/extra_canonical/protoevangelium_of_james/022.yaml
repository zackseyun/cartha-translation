    (3) Услышав, что Иоанна разыскивают, Елизавета взяла его и ушла в горы. Она искала, где бы спрятать его, но укрытия не было. Тогда Елизавета со стоном сказала: «Гора Божья, прими мать с ребёнком», — потому что выше подняться она не могла. И тотчас гора расступилась и приняла их, а свет светил ей сквозь гору. Ведь с ними был ангел Господень и охранял их.'
  rationale: Правка устраняет сужение референта в рассказе о чудесном укрытии, делает передачу света прямой и убирает сноску, основанную на не требующейся интерпретационной неопределённости. Также уточнён предмет «кормушки» без изменения смысла. Повествовательный регистр, терминология и чудесный характер рассказа сохранены без конфессионального истолкования.
