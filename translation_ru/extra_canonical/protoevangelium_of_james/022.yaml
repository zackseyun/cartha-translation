revisions:
- from: '(1) Когда Ирод понял, что волхвы обманули его, он разгневался. Он послал своих убийц и велел им убить всех младенцев двух лет и младше.


    (2) Услышав, что младенцев убивают, Мария испугалась. Она взяла своего ребёнка, запеленала его и положила в кормушку для коров.


    (3) Услышав, что Иоанна разыскивают, Елизавета взяла его и поднялась с ним в горы. Она искала, где бы спрятать его, но укрытия не было. Тогда Елизавета со стоном сказала: «Гора Божья, прими мать с ребёнком», — потому что выше подняться она не могла. И тотчас гора расступилась и приняла её, а внутри горы для неё сиял свет.[a] Ведь с ними был ангел Господень и охранял их.'
  to: '(1) Когда Ирод понял, что волхвы обманули его, он разгневался. Он послал убийц и велел им убить всех младенцев двух лет и младше.


