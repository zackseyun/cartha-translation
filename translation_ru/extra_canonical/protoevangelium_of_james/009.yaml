  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: ru
  text: '**Протоевангелие Иакова — глава 9. Иосиф принимает Марию под свою защиту**


    **(1)** Иосиф отложил топор и пошёл на собрание. Когда все собрались, они со своими посохами пришли к священнику. Тот взял у них посохи, вошёл в Храм и помолился. Окончив молитву, он вынес посохи и вернул их владельцам, но ни на одном из них не оказалось знака. Последним свой посох получил Иосиф — и вот, из посоха вылетела голубка и опустилась ему на голову. Тогда священник сказал Иосифу:


    — Ты избран принять деву Господню под свою опеку.[a]


    **(2)** Но Иосиф стал возражать:


    — У меня есть сыновья, и я уже стар, а она молода. Не хочу стать посмешищем среди народа Израиля.


    Священник сказал ему:


    — Иосиф, бойся Господа, Бога твоего, и вспомни, что Бог сделал с Дафаном, Авироном и Кореем:[b] земля разверзлась и поглотила их всех за непокорность. Так бойся же, Иосиф, чтобы подобное не случилось и в твоём доме.


    **(3)** Испугавшись, Иосиф принял Марию под свою опеку и сказал ей:


    — Мария, я взял тебя из Храма Господня и теперь привожу в свой дом. Мне нужно уйти строить дома, но я вернусь к тебе. Господь сохранит тебя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть принять Марию в свой дом, заботиться о ней и оберегать её. Здесь прямо не сказано, что речь идёт о заключении брака.
    reason: Предотвращает богословски нагруженное прочтение опеки как уже прямо названного брака и сохраняет формулировку источника.
  - marker: b
    text: 'Дафан, Авирон и Корей — участники мятежа против Моисея и Аарона; см. Числа 16. В иных русских передачах имён: Датан, Авирам и Корах.'
    reason: Даёт читателю библейский контекст и фиксирует распространённые варианты передачи имён.
lexical_decisions:
- source_word: staffs
  choice: посохи
  rationale: «Посох» естественно обозначает принесённый каждым мужчиной жезл или палку и сохраняет повествовательную связь с чудесным знамением.
- source_word: welcome ... into your own care
  choice: принять ... под свою опеку
  rationale: Передаёт поручение заботиться и охранять Марию, не превращая его без достаточного основания в прямое указание на брак.
- source_word: look!
  choice: и вот
  rationale: Традиционная, но живая повествовательная формула, отмечающая внезапное чудесное событие.
- source_word: flew upon Joseph’s head
  choice: опустилась ему на голову
  rationale: По-русски естественно описывает завершение полёта; не уточняет продолжительность пребывания голубки.
- source_word: build houses
  choice: строить дома
  rationale: Сохраняет множественное число и прямой смысл строительной работы Иосифа, не вводя предположения о конкретном ремесле или месте.
- source_word: protect you
  choice: сохранит тебя
  rationale: «Сохранит» соответствует возвышенному религиозному регистру и включает защиту и попечение без лишней конкретизации.
theological_decisions:
- issue: Характер отношений Иосифа и Марии
  choice: «принять деву Господню под свою опеку»
  alternative: «взять деву Господню в жёны» / «обручиться с ней»
  rationale: Данный свидетель говорит о принятии на попечение и охранении; брачная формулировка внесла бы отсутствующее здесь уточнение и преждевременно сняла бы напряжение рассказа.
- issue: Чудесный знак с голубкой
  choice: Передать буквально как выход голубки из посоха и её опускание на голову Иосифа
  alternative: Истолковать голубку как символ Святого Духа или как небесное подтверждение
  rationale: Текст сообщает событие, но не даёт его богословского истолкования; перевод не должен добавлять такое истолкование.
- issue: Причина наказания Дафана, Авирона и Корея
  choice: «за непокорность»
  alternative: «за мятеж» / «за восстание»
  rationale: «Непокорность» сохраняет религиозно-нравственный аспект отказа повиноваться, не ограничивая смысл только политическим мятежом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Диалог оформлен естественно и ясно; сохранены повторы, значимые для сюжета, но устранена тяжеловесность цепочек с «и». Слова «Храм» и «Господь» поддерживают сакральный контекст. Проект остаётся предварительным, поскольку предоставленная основа — публичный английский свидетель, а прямая сверка с греческой рукописной традицией ещё не завершена.
