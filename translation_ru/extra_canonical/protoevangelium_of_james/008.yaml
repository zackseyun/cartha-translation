base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: ru
  text: '(1) Её родители спустились, дивясь, восхваляя и прославляя Господа Бога за то, что девочка не повернула назад. А Мария оставалась в Храме Господнем. Её растили, словно голубку, и она получала пищу из руки ангела.


    (2) Когда ей исполнилось двенадцать лет, священники собрались на совет и говорили: «Вот, Мария уже двенадцать лет находится в Храме Господнем. Что нам с ней делать, чтобы она не осквернила святилище Господа, Бога нашего?» И они сказали первосвященнику: «Ты стоишь у жертвенника Господнего. Войди и помолись о ней. И если Господь Бог что-нибудь откроет тебе, мы так и поступим».


    (3) Первосвященник вошёл, взяв облачение с двенадцатью колокольчиками, во Святое святых и помолился о ней. И вот, рядом предстал ангел Господень и сказал: «Захария! Захария! Выйди и собери вдовцов из народа, и пусть каждый принесёт посох. На кого Господь Бог укажет знамением, тому она станет женой».


    Вестники прошли по всей окрестной области Иудеи и протрубили в трубу Господню. И вот, все мужчины поспешили туда.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Temple of the Lord
  choice: Храм Господень
  rationale: Достоинный и естественный русский эквивалент, сохраняющий сакральную определённость выражения.
- source_word: nurtured like a dove
  choice: Её растили, словно голубку
  rationale: Сохранено образное сравнение без попытки объяснить его возможный символический смысл.
- source_word: pollute / defile
  choice: осквернила
  rationale: В контексте святилища речь идёт о культовой нечистоте; «осквернить» передаёт это точнее, чем бытовое «загрязнить».
- source_word: chief priest
  choice: первосвященник
  rationale: Устоявшийся русский термин для главного священника при Храме.
- source_word: robe with twelve bells
  choice: облачение с двенадцатью колокольчиками
  rationale: «Облачение» естественно для священной одежды; конкретное число и предметы сохранены без гармонизации с библейскими описаниями.
- source_word: Holy of Holies
  choice: Святое святых
  rationale: Традиционный и широко понятный русский эквивалент.
- source_word: widowers of the people
  choice: вдовцов из народа
  rationale: Сохранено прямое указание именно на вдовцов, без расширения до неженатых мужчин вообще.
- source_word: staff
  choice: посох
  rationale: Передаёт личный жезл или дорожный посох каждого мужчины, сохраняя повествовательную символику.
- source_word: trumpet of the Lord
  choice: трубу Господню
  rationale: Сохранена необычная формулировка свидетеля без сведения её к обычному сигналу.
theological_decisions:
- issue: Причина возможного осквернения святилища
  choice: Не пояснять, почему двенадцатилетняя Мария могла осквернить святилище
  alternative: Добавить пояснение о наступлении половой зрелости или менструальной нечистоте
  rationale: Источник оставляет причину подразумеваемой; добавление объяснения внесло бы интерпретацию в основной текст.
- issue: Статус Марии по отношению к избранному мужчине
  choice: «тому она станет женой»
  alternative: «тот станет её хранителем» или «она будет поручена ему»
  rationale: Предоставленный свидетель прямо говорит о жене; более поздние богословские согласования не должны подменять данное чтение.
- issue: Ангельское питание
  choice: Сохранить буквальное «получала пищу из руки ангела»
  alternative: Истолковать как духовное попечение или небесное обеспечение
  rationale: Повествование представляет это как событие, а не объяснённую метафору.
- issue: Знамение при выборе мужа
  choice: 'Сохранить неопределённость: «укажет знамением»'
  alternative: Уточнить вид знамения по последующему рассказу
  rationale: В пределах этой главы вид знамения здесь ещё не назван.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным повествовательным регистром. Сохранены повторения «И вот» и сакральные наименования, но синтаксис сделан естественным для современного читателя. Проект остаётся предварительным: предоставленная основа — англоязычный публичный свидетель, а непосредственная сверка с греческой рукописной традицией ещё требуется.'
