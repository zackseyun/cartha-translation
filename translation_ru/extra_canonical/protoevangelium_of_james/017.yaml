    text: 'Буквально по доступному английскому свидетельству: «зарегистрировать, сколько людей было в Вифлееме Иудейском». Перевод передаёт это как распоряжение провести перепись всех жителей; непосредственная сверка с греческим текстом ещё требуется.'
