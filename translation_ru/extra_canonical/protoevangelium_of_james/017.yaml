translation:
  language: ru
  text: '**Первоевангелие Иакова, глава 17. Перепись**


    **(1)** Вышел указ царя Августа переписать всех жителей Вифлеема Иудейского.[a]


    Иосиф сказал: «Сыновей своих я запишу. Но что мне делать с этой девочкой? Кем записать её? Женой? Мне стыдно. Дочерью? Но народ Израиля знает, что она не моя дочь. Ныне день Господень; поступлю, как угодно Господу».


    **(2)** Он оседлал осла, посадил на него Марию; сын его повёл осла, а Самуил шёл следом.


    Когда они приблизились к третьей миле,[b] Иосиф обернулся и увидел, что Мария печальна. Он подумал: «Наверное, тот, кто у неё внутри, тревожит её».


    Потом Иосиф снова обернулся и увидел, что она смеётся. Он спросил её: «Мария, что с тобой? Я вижу, что ты то смеёшься, то печалишься».


    Она ответила ему: «Перед глазами моими два народа:[c] один плачет и скорбит, а другой радуется и ликует».


    **(3)** Когда они были уже на полпути, Мария сказала ему: «Иосиф, сними меня с осла: тот, кто у меня внутри, рвётся наружу».


    Он снял её с осла и сказал: «Куда мне отвести тебя и где укрыть в таком положении?[d] Ведь здесь пустынное место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетельству: «переписать, сколько людей было в Вифлееме Иудейском». Здесь выражение передано как распоряжение о переписи всех жителей. Точная сверка с греческим текстом ещё требуется.'
    reason: Отмечает основание перевода и не скрывает возможное различие между подсчётом и регистрацией.
  - marker: b
    text: Неясно, от какой точки отсчитывается «третья миля»; древняя миля составляла примерно полтора километра.
    reason: Сохраняет неопределённость маршрута и поясняет незнакомую меру расстояния.
  - marker: c
    text: 'В доступном английском свидетельстве необычная фраза передана буквально: «я вижу два народа у себя в глазах». Возможен смысл: «я вижу перед глазами два народа». Сам текст не называет эти народы.'
    reason: Сохраняет необычность видения, но делает основной русский текст понятным и не навязывает богословского толкования.
  - marker: d
    text: Доступное английское свидетельство буквально говорит о её «неловком» или «затруднительном положении»; вероятно, имеется в виду необходимость укрыть Марию во время родов. Точный оттенок требует сверки с греческим текстом.
    reason: Поясняет эвфемистическое и текстуально неустойчивое выражение, не превращая предположение в основной текст.
lexical_decisions:
- source_word: order / decree (Greek source review pending)
  choice: указ
  rationale: Естественное для русского языка обозначение официального распоряжения Августа; не уточняет административную форму сверх доступного свидетельства.
- source_word: Augustus the king
  choice: царь Август
  rationale: Сохранён необычный титул древнего повествования, а не исторически более привычное «император», чтобы не исправлять текст молча.
- source_word: register
  choice: переписать / записать
  rationale: В первом случае передаёт проведение переписи населения, во внутреннем монологе Иосифа — внесение членов семьи в запись.
- source_word: this child
  choice: эта девочка
  rationale: Передаёт отношение Иосифа к юной Марии и сохраняет отличие от категорий «жена» и «дочь»; слово не означает его биологического ребёнка.
- source_word: the third mile
  choice: третья миля
  rationale: Сохранена древняя путевая мера и неопределённость исходной точки отсчёта.
- source_word: two people / peoples
  choice: два народа
  rationale: Форма соответствует вероятному греческому смыслу «два народа» и последующему единственному числу собирательных действий; образ не истолкован как указание на конкретные группы.
- source_word: pushing to come out
  choice: рвётся наружу
  rationale: Живо и понятно передаёт начало родов без добавления медицинской терминологии.
- source_word: wilderness
  choice: пустынное место
  rationale: По-русски естественно обозначает безлюдную местность и не обязательно песчаную пустыню.
theological_decisions:
- issue: Значение двух народов в видении Марии
  choice: Сохранить образ без определения народов
  alternative: Назвать их Израилем и язычниками либо иными конкретными группами
  rationale: Сам отрывок не раскрывает символ прямо; конкретизация устранила бы подлинную смысловую открытость.
- issue: «День Господень» и решение Иосифа
  choice: Сохранить выражение «день Господень» и зависимость решения от воли Господа
  alternative: Истолковать как особый праздник, судный день или прямое откровение
  rationale: Доступное свидетельство не объясняет выражение и не сообщает, каким образом Иосиф узнает волю Господа.
- issue: Титул Августа
  choice: Сохранить «царь»
  alternative: Заменить на исторически нормативное «император»
  rationale: Перевод следует повествовательной формулировке памятника, не гармонизируя её с римской титулатурой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном древнего повествования. Повторительные связки сокращены там, где они звучали бы механически, но последовательность сцен и ключевые повторы сохранены. Прямая речь сделана естественной для современного читателя. Поскольку предоставленная основа — англоязычное свидетельство, а непосредственная сверка с греческой рукописной традицией ещё не выполнена, спорные места отмечены сносками и не представлены как окончательно установленные.
