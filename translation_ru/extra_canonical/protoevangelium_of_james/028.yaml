translation:
  language: ru
  text: '(1) Он нашёл повитуху, когда она спускалась с горы, и привёл её. Иосиф сказал повитухе: «Мария — моя невеста. Она зачала от Святого Духа, а выросла при храме Господнем».


    И повитуха пошла с ним. (2) Они остановились перед пещерой, и тёмное облако осенило её. Повитуха сказала: «Сегодня возвеличилась душа моя, потому что глаза мои увидели дивное: Израилю родилось спасение!»


    И тотчас облако отступило от пещеры, а в пещере воссиял великий свет, так что глаза их не могли его вынести. Немного спустя свет стал угасать, пока не показался младенец. Он приблизился и взял грудь своей матери Марии.


    Повитуха воскликнула: «Как велик для меня сегодняшний день: я увидела это новое чудо!»


    (3) Повитуха вышла из пещеры, и ей навстречу попалась Саломея.


    Она сказала ей: «Саломея, Саломея, я должна рассказать тебе о невиданном зрелище: дева родила вопреки естеству!»[a]


    Саломея сказала: «Жив Господь, Бог мой! Пока я не вложу палец и не исследую её состояние,[b] не поверю, что дева родила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по представленному английскому свидетельству: «дева родила, что против её природы». Прямое сопоставление с греческими рукописями ещё требуется.'
    reason: 'Фраза допускает различия в понимании: речь может идти о природе девы либо о естественном порядке рождения вообще.'
  - marker: b
    text: «Исследую её состояние» — эвфемистическое указание на физическую проверку того, сохранила ли Мария девственность после родов.
    reason: Основной текст сохраняет сдержанность свидетельства, а сноска делает подразумеваемое действие понятным современному читателю.
lexical_decisions:
- source_word: midwife
  choice: повитуха
  rationale: Общеупотребительное в библейском и древнем повествовательном контексте русское обозначение женщины, помогающей при родах; сохраняет исторический колорит без излишней специальности.
- source_word: betrothed
  choice: невеста
  rationale: Естественно передаёт состояние обручения в данном контексте; «обручённая» возможно, но звучит менее естественно в прямой речи.
- source_word: overshadowed
  choice: осенило
  rationale: Сохраняет библейскую образность покрытия облаком и не сводит выражение просто к затемнению.
- source_word: salvation
  choice: спасение
  rationale: Сохраняет абстрактную и одновременно персонифицируемую формулировку свидетеля, не заменяя её толкованием «Спаситель».
- source_word: against her nature
  choice: вопреки естеству
  rationale: Передаёт физиологическую необычность утверждения и сохраняет архаизирующую торжественность без догматического расширения.
- source_word: condition
  choice: состояние
  rationale: Намеренно сдержанная формулировка, сохраняющая эвфемизм исходного свидетельства; смысл уточнён в сноске.
theological_decisions:
- issue: Зачатие Марии от Святого Духа
  choice: «Она зачала от Святого Духа»
  alternative: «Она беременна от Святого Духа»
  rationale: Сохраняется утверждение текста о происхождении зачатия без дополнительных богословских пояснений.
- issue: «Израилю родилось спасение»
  choice: Сохранить слово «спасение»
  alternative: «У Израиля родился Спаситель»
  rationale: Альтернатива конкретизирует и интерпретирует грамматический образ; выбранный вариант сохраняет напряжение между событием спасения и родившимся младенцем.
- issue: Описание девственного рождения
  choice: «дева родила вопреки естеству»
  alternative: «девственница родила сверхъестественным образом»
  rationale: Не вводится современная богословская формула «сверхъестественным образом»; сохраняется резкость древнего утверждения о противоречии обычному естественному порядку.
- issue: Появление младенца после отступления света
  choice: «пока не показался младенец»
  alternative: «и тогда появился младенец»
  rationale: Сохраняется последовательность и необычная образность рассказа без попытки объяснить механизм рождения.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён там, где английское свидетельство отражает неясные или громоздкие связки, но необычная последовательность света, появления младенца и кормления сохранена. Проект предварительный: доступен только публичный английский свидетель, а прямая проверка греческой рукописной традиции ожидается.'
