translation:
  language: ru
  text: '**Протоевангелие Иакова — глава 20. Испытание Саломеи**


    **(1)** Повитуха вошла, расположила её[a], и Саломея проверила её состояние. Тогда Саломея вскрикнула: «Я испытала живого Бога — и вот, моя рука горит и отпадает от меня!»


    **(2)** Она помолилась Господу, и в тот же час повитуха была исцелена.[b]


    **(3)** И вот, перед Саломеей предстал ангел Господень и сказал: «Твоя молитва услышана Господом Богом. Подойди, прикоснись к Младенцу — и получишь спасение».


    **(4)** Она так и сделала, и Саломея исцелилась. Поклонившись, она вышла из пещеры. И вот, голос ангела Господнего произнёс: «Саломея, Саломея! Рассказывай о чудесном, что ты видела, пока Младенец не войдёт в Иерусалим».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «её» в предоставленном свидетеле не имеет явно названного здесь референта; по контексту, вероятно, имеется в виду мать Младенца. Само действие также описано неопределённо.
    reason: Сохранить местоименную и предметную неоднозначность исходного свидетеля.
  - marker: b
    text: Предоставленный свидетель говорит здесь о «повитухе», а в стихе 4 — об исцелении Саломеи. Неясно, отождествляются ли они в этом месте или текст сохраняет различие между ними.
    reason: Не сглаживать внутреннее напряжение между обозначениями действующего лица.
  - marker: c
    text: Предоставленный английский свидетель содержит утвердительное повеление «рассказывай… пока». Возможное чтение «не рассказывай… пока» требует непосредственной сверки с греческими рукописями.
    reason: Зафиксировать необычную синтаксическую форму и необходимость проверки по исходному языку.
lexical_decisions:
- source_word: positioned her
  choice: расположила её
  rationale: 'Сохранён общий и несколько неясный характер действия: свидетель не уточняет ни позу, ни прямо названное лицо; более конкретное «уложила» могло бы необоснованно сузить смысл.'
- source_word: examined her condition
  choice: проверила её состояние
  rationale: Передаёт деликатный эвфемизм свидетеля, не добавляя анатомических подробностей, которых в предоставленном тексте нет.
- source_word: tested the living God
  choice: испытала живого Бога
  rationale: Формально сохраняет библейски окрашенный глагол «испытать» и серьёзность признания Саломеи.
- source_word: on fire and falling away from me
  choice: горит и отпадает от меня
  rationale: Сохранены яркий телесный образ и одновременность двух действий без рационализации того, что именно происходит с рукой.
- source_word: receive salvation
  choice: получишь спасение
  rationale: Сохраняется широкое богословское слово «спасение»; оно не сведено лишь к физическому исцелению, хотя ближайший контекст допускает и этот оттенок.
- source_word: worshipped
  choice: поклонившись
  rationale: Естественное русское соответствие, не уточняющее без достаточного основания, кому именно было обращено поклонение.
- source_word: wonderful things
  choice: о чудесном
  rationale: Передаёт необычайный, вызывающий изумление характер увиденного и звучит естественно в прямой речи.
theological_decisions:
- issue: Смысл «спасения» в обещании ангела
  choice: Сохранено слово «спасение» без поясняющего ограничения
  alternative: «получишь исцеление»
  rationale: Хотя далее Саломея исцеляется, свидетель употребляет более широкое понятие; замена на «исцеление» сняла бы возможное богословское напряжение.
- issue: Личность исцелённой в стихе 2
  choice: Сохранено обозначение «повитуха», отдельно от имени Саломеи
  alternative: «Саломея была исцелена»
  rationale: Предоставленный свидетель различает формулировки «она» и «повитуха», а затем прямо называет Саломею в стихе 4. Это текстовое напряжение не устранено молча.
- issue: Объект поклонения в стихе 4
  choice: Объект не назван
  alternative: «поклонившись Младенцу» или «поклонившись Богу»
  rationale: Свидетель не указывает объект явно; его уточнение внесло бы интерпретацию в основной текст.
- issue: Повеление о возвещении увиденного
  choice: 'Передано утвердительно: «Рассказывай… пока…»'
  alternative: «Не рассказывай… пока Младенец не войдёт в Иерусалим»
  rationale: Основной текст следует предоставленному английскому свидетелю, в котором отсутствует отрицание. Однако формула необычна и нуждается в сверке с греческой рукописной традицией, поэтому альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан ясным для обычного читателя, но сохранены повтор «И вот», резкие переходы, неоднозначные местоимения и богословски насыщенное слово «спасение». Проект остаётся предварительным, поскольку непосредственная сверка с греческой рукописной традицией ещё не выполнена.
