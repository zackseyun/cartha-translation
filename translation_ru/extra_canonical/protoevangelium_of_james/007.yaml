translation:
  language: ru
  text: '(1) Анна заботилась о своём ребёнке месяц за месяцем. Когда девочке исполнилось два года, Иоаким сказал:


    — Отведём её в храм Господа, чтобы исполнить данное нами обещание, иначе Господь разгневается на нас и не примет нашего дара.


    Но Анна сказала:


    — Подождём, пока ей не исполнится три года, чтобы она не искала отца или мать.


    Иоаким ответил:


    — Подождём.


    (2) Когда девочке исполнилось три года, Иоаким сказал:


    — Позовём непорочных дочерей еврейского народа. Пусть они возьмут зажжённые светильники, чтобы девочка не повернула назад и сердце её не отвратилось от храма Господа.


    Так они и сделали и взошли к храму Господа.


    Священник принял девочку, поцеловал её и сказал:


    — Господь Бог возвеличил твоё имя во всех поколениях. Через тебя в последние дни Господь явит Своё избавление народу Израиля.


    (3) Он посадил её на третью ступень жертвенника, и Господь Бог излил на неё благодать. Она стала плясать, и весь дом Израиля полюбил её.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Temple of the Lord
  choice: храм Господа
  rationale: Естественное и традиционно понятное русское обозначение Иерусалимского храма; строчная буква соответствует современным нормам при родовом наименовании.
- source_word: pure daughters of the Hebrews
  choice: непорочные дочери еврейского народа
  rationale: «Непорочные» передаёт ритуально-нравственный оттенок pure, не сводя выражение лишь к физической чистоте; «еврейского народа» звучит естественнее буквального «евреев».
- source_word: lamps
  choice: светильники
  rationale: Исторически и стилистически уместнее современного бытового «лампы».
- source_word: redemption
  choice: избавление
  rationale: Сохраняет широкий смысл спасительного освобождения и не навязывает более узкое догматическое толкование слова «искупление».
- source_word: house of Israel
  choice: дом Израиля
  rationale: Сохранён традиционный библейский коллективный образ, а не заменён толкованием «народ Израиля».
- source_word: grace
  choice: благодать
  rationale: Устоявшийся библейский эквивалент, сохраняющий богословскую насыщенность исходного выражения.
theological_decisions:
- issue: Характер обещания родителей
  choice: данное нами обещание
  alternative: наш обет
  rationale: Свидетель использует общее promise; «обещание» не усиливает формально-культовый оттенок без проверки греческого текста.
- issue: Отношение сердца девочки к храму
  choice: сердце её не отвратилось от храма Господа
  alternative: сердце её не было увлечено прочь от храма Господа
  rationale: Формулировка передаёт удаление или отчуждение сердца, не объясняя его психологическую либо богословскую природу.
- issue: Будущее избавление Израиля
  choice: Господь явит Своё избавление народу Израиля
  alternative: Господь явит через тебя искупление сынов Израиля
  rationale: Сохранена направленность действия на Израиль и посредствующая роль Марии, но не уточняется механизм избавления.
- issue: Излияние благодати
  choice: Господь Бог излил на неё благодать
  alternative: Господь Бог ниспослал ей благодать
  rationale: Сохранён образ излияния из свидетельства без дополнительного определения природы или следствий благодати.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Повторительные связки английского свидетельства сокращены там, где они утяжеляют русскую речь, но композиция и последовательность событий сохранены. Прямая сверка с греческой рукописной традицией ещё не проведена; поэтому спорные места переведены осторожно, без конфессионального уточнения.
