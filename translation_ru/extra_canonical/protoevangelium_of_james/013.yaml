review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод близко передаёт предоставленное английское свидетельство. Однако «сняв вретище» добавляет действие, которого в свидетельстве нет: «stood from the sackcloth» не говорит о снятии вретища. Его следует устранить. «Со стройки» допустимо как контекстуальное понимание «from his building», но несколько конкретизирует исходное выражение; более нейтральное «со своих строительных работ» лучше сохраняет его смысл.'
  naturalness: Русский текст литературный и выдержан в умеренно библейском регистре. «Поднялся с земли, где лежал во вретище» естественно связывает фразу со сценой плача и не создаёт ложного впечатления, будто Иосиф снял траурную одежду.
  terminology: «Иосиф», «Господь Бог», «дева», «вретище», «Святое святых» и «чрево» уместны. Эвфемизм «не знала мужчины» верно сохраняет исходную формулу. «Получала пищу из руки ангела» точнее соответствует received food than «принимала пищу».
  issues:
  - severity: medium
    issue: Добавлено снятие вретища в 13:2.
    rationale: В доступном свидетельстве Иосиф лишь «встал/поднялся от вретища»; снятие вретища не засвидетельствовано. Примечание не устраняет добавления в основном тексте.
  - severity: low
    issue: «Со стройки» чрезмерно разговорно-конкретно для «from his building».
    rationale: Исходное выражение допускает строительные работы, но не требует современного разговорного обозначения строительной площадки; нейтральная формулировка сохраняет смысл без лишней конкретизации.
  revised_text: '(1) Она была на шестом месяце. И вот Иосиф пришёл со своих строительных работ, вошёл в дом и увидел, что она беременна. Он ударил себя по лицу, повергся на землю во вретище и горько заплакал, говоря: «Как я предстану перед Господом Богом? Какую молитву вознесу об этой юной деве? Ведь я принял её девой из храма Господа Бога и не уберёг её. Кто расставил мне эту западню? Кто совершил это зло в моём доме? Кто осквернил деву? Не повторилась ли со мной история Адама? Ведь когда Адам воздавал славу в час молитвы, пришёл змей, застал Еву одну и обманул её. И вот то же случилось со мной!»


    (2) Иосиф поднялся с земли, где лежал во вретище, позвал её и сказал: «Бог заботился о тебе. Зачем ты это сделала? Ты забыла Господа, Бога твоего. Зачем ты унизила свою душу? Ты была вскормлена в Святом святых и получала пищу из руки ангела!»


    (3) Она горько заплакала и сказала: «Я чиста и не знала мужчины!»


    Иосиф спросил её: «Откуда же тогда то, что у тебя во чреве?»


    Она ответила: «Жив Господь, Бог мой: я не знаю, откуда это у меня!»'
  revised_footnotes: []
  revision_rationale: Исправление удаляет не подтверждённое свидетельством действие «сняв вретище» и связанную с ним пояснительную сноску. Контекстуальное «с земли, где лежал во вретище» передаёт последовательность сцены без утверждения, что вретище было снято. Также «со своих строительных работ» менее разговорно и менее узко, чем «со стройки», а «получала пищу» ближе к формулировке свидетельства. Прямая сверка с греческой рукописной традицией по-прежнему желательна, особенно для выражений о строительных работах и «поднялся от вретища».
