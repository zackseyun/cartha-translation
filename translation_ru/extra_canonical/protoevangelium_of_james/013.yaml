base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: ru
  text: '(1) Она была на шестом месяце. И вот, Иосиф вернулся со стройки, вошёл в дом и увидел, что она беременна. Он ударил себя по лицу, повергся на землю во вретище и горько заплакал, говоря: «Как я предстану перед Господом Богом? Какую молитву вознесу об этой юной деве? Ведь я принял её девой из храма Господа Бога и не уберёг её. Кто расставил мне эту западню? Кто совершил это зло в моём доме? Кто осквернил деву? Не повторилась ли со мной история Адама? Ведь когда Адам воздавал славу в час молитвы, пришёл змей, застал Еву одну и обманул её. И вот то же случилось со мной!»


    (2) Иосиф поднялся с земли, сняв вретище,[a] позвал её и сказал: «Бог заботился о тебе. Зачем ты это сделала? Ты забыла Господа, Бога твоего. Зачем ты унизила свою душу? Ты была вскормлена в Святом святых и принимала пищу из руки ангела!»


    (3) Она горько заплакала и сказала: «Я чиста и не знала мужчины!»


    Иосиф спросил её: «Откуда же тогда то, что у тебя во чреве?»


    Она ответила: «Жив Господь, Бог мой: я не знаю, откуда это у меня!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетельству: «Иосиф поднялся от вретища». Смысл выражения не вполне ясен; перевод передаёт вероятное действие — он встал с земли и снял вретище.'
    reason: Доступная основа содержит неясную конструкцию, а прямая сверка с греческим текстом ещё предстоит.
lexical_decisions:
- source_word: from his building
  choice: вернулся со стройки
  rationale: Сохраняет значение возвращения Иосифа с места строительных работ и звучит естественно по-русски; греческая сверка пока не выполнена.
- source_word: struck his face
  choice: ударил себя по лицу
  rationale: Передаёт буквальный жест скорби и потрясения, не заменяя его общим описанием эмоций.
- source_word: in sackcloth
  choice: во вретище
  rationale: Традиционный и понятный в библейском регистре термин для грубой одежды или ткани, связанной с плачем и покаянием.
- source_word: face the Lord God
  choice: предстану перед Господом Богом
  rationale: Естественно передаёт образ явления перед Богом с чувством вины и ответственности.
- source_word: young girl / virgin
  choice: юная дева / дева
  rationale: «Дева» сохраняет акцент повествования на девственности Марии; «юная» передаёт её возрастной статус без разговорного оттенка.
- source_word: humiliated your soul
  choice: унизила свою душу
  rationale: Сохранена необычная метафора источника без истолкования как конкретного греха или осквернения.
- source_word: Holy of Holies
  choice: Святое святых
  rationale: Устоявшееся русское наименование внутреннего святилища храма.
- source_word: known a man
  choice: не знала мужчины
  rationale: Сохранён библейский эвфемизм половой близости.
- source_word: this thing in your womb
  choice: то, что у тебя во чреве
  rationale: Передаёт намеренно неопределённую и резкую формулировку Иосифа, не подменяя её словом «ребёнок».
theological_decisions:
- issue: Неведение Марии о происхождении беременности
  choice: «я не знаю, откуда это у меня»
  alternative: «я не знаю, как это произошло»
  rationale: Сохранено прямое заявление персонажа и напряжение повествования; не добавлено объяснение через Благовещение, отсутствующее в данном отрывке.
- issue: Сопоставление Иосифа с Адамом
  choice: «Не повторилась ли со мной история Адама?»
  alternative: «Не стал ли я подобен Адаму?»
  rationale: Формулировка сохраняет идею повторения прежнего события, включая молитву, одиночество Евы и обман змея, без догматического расширения аналогии.
- issue: Чистота Марии
  choice: «Я чиста и не знала мужчины»
  alternative: «Я невинна и не имела близости с мужчиной»
  rationale: Сохранены два самостоятельных утверждения источника и его библейский эвфемизм.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством речи. Архаизмы сведены к укоренившимся словам «дева», «вретище», «чрево» и «Святое святых». Проект предварительный: предоставлена английская публикационная свидетельская версия, тогда как непосредственная проверка греческой рукописной традиции ещё не выполнена.'
