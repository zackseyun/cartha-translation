translation:
  language: ru
  text: '(1) И вот, рядом с ней предстал ангел Господень и сказал ей: «Анна, Анна! Господь услышал твою молитву. Ты зачнёшь и родишь, и о твоём потомстве будут говорить по всему миру».


    Анна сказала: «Жив Господь Бог! Кого бы я ни родила — мальчика или девочку, — я принесу дитя в дар Господу, моему Богу, и оно будет служить Ему во все дни своей жизни».


    (2) И вот, к ней пришли два ангела и сказали: «Смотри, твой муж Иоаким идёт со своими стадами». Ведь ангел Господень сошёл к Иоакиму и сказал: «Иоаким, Иоаким! Господь Бог услышал твою молитву. Спускайся отсюда. Вот, твоя жена Анна зачала во чреве».[a]


    (3) Иоаким тотчас спустился и позвал пастухов. Он сказал им: «Приведите мне десять ягнят без пятна и порока — они будут для Господа Бога. Приведите также двенадцать нежных телят для священников и старейшин и сто козлов для всего народа».


    (4) И вот, Иоаким пришёл со своими стадами, а Анна стояла у ворот. Увидев Иоакима, идущего со стадами, она тотчас подбежала, обвила руками его шею и сказала: «Теперь я знаю, что Господь Бог щедро благословил меня. Ибо вот, вдова уже не вдова, и вот, та, у которой не было ребёнка во чреве, зачала».[b]


    В первый день Иоаким отдыхал у себя дома.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Формулировка «зачала во чреве» следует представленному английскому свидетелю. Прямую сверку с греческой рукописной традицией ещё предстоит провести.
    reason: Источник прямо помечен как предварительный, а форма глагола важна для хронологии повествования.
  - marker: b
    text: 'Слова Анны о «вдове» сохранены как образное и парадоксальное выражение самого повествования: Иоаким жив и возвращается домой.'
    reason: Предотвращает молчаливое устранение подлинного повествовательного напряжения.
  - marker: c
    text: Смысл заключительной временной формулы не вполне ясен по английскому свидетелю; возможное понимание следует проверить по греческому тексту.
    reason: Выражение «for the first day» допускает неоднозначность, которую нельзя надёжно разрешить без исходного греческого текста.
lexical_decisions:
- source_word: angel of the Lord
  choice: ангел Господень
  rationale: Сохраняет устойчивую библейскую формулу и достойный литературный регистр.
- source_word: offspring
  choice: потомство
  rationale: Передаёт широкий смысл слова и не сводит обещание только к одному ребёнку, хотя ближайший контекст говорит о предстоящем рождении.
- source_word: minister
  choice: служить
  rationale: Естественный русский глагол, сохраняющий религиозный смысл посвящённого служения без добавления конкретной храмовой должности.
- source_word: without spot or blemish
  choice: без пятна и порока
  rationale: Сохраняет жертвенную библейскую формулу и её парную структуру.
- source_word: tender calves
  choice: нежные телята
  rationale: Формально сохраняет необычную характеристику английского свидетеля; возможные значения вроде «молодые» требуют проверки греческого текста.
- source_word: rested
  choice: отдыхал
  rationale: Передаёт прямое значение без предположения о ночлеге или праздничном пребывании.
theological_decisions:
- issue: Пол ребёнка и его посвящение
  choice: «Кого бы я ни родила — мальчика или девочку… дитя… оно»
  alternative: «Рожу ли я мальчика или девочку, принесу его/её…»
  rationale: Выбранная формулировка естественно передаёт обет независимо от пола ребёнка и не вносит дополнительных богословских уточнений.
- issue: Сообщение о зачатии Анны
  choice: «зачала во чреве»
  alternative: «зачнёт» или «беременна»
  rationale: Сохранено совершившееся действие в представленном свидетеле, несмотря на возможное хронологическое напряжение с обещанием в первом разделе.
- issue: Самоназвание Анны «вдова»
  choice: «вдова уже не вдова»
  alternative: «оставленная жена уже не оставлена»
  rationale: Сохранён буквальный парадокс рассказа; он не истолкован как юридическое вдовство или окончательный разрыв брака.
- issue: «Та, у которой не было ребёнка во чреве»
  choice: описательная формулировка
  alternative: «бездетная» или «неплодная»
  rationale: Описание сохраняет образ и не усиливает текст медицинской либо социальной характеристикой.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор «И вот» сохранён как повествовательный приём, но синтаксис местами разгружен для ясности. Черновик остаётся предварительным, поскольку предоставлен англоязычный публичнодоступный свидетель, а непосредственная проверка греческой рукописной традиции ещё не выполнена.
