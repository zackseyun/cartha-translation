    issue: «нежные телята»
    rationale: В современном русском это описание звучит как эмоциональная характеристика, тогда как в контексте жертвенных животных речь естественно передать как «молодые телята». Прямую лексическую сверку с греческим всё же следует выполнить.
  - severity: low
    issue: «та, у которой не было ребёнка во чреве»
    rationale: Формула буквальна по английскому мостовому свидетелю, но неестественна по-русски. «Бездетная зачала» сохраняет контраст с зачатием и не разрешает парадокс «вдовы».
  - severity: low
    issue: Заключительная временная формула
    rationale: «В первый день ... отдыхал» сохраняет неопределённость английского witness; примечание необходимо, пока не сверена греческая традиция.
