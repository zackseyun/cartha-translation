  text: '(1) She took the pitcher and went to fill it with water, and look! A voice said to her, “Rejoice, blessed one! The Lord is with you. Blessed are you among women.”


    Mary looked around to the right and the left to see where the voice might be coming from. She became terrified and went into her house. After setting down the pitcher, she took up the purple, sat upon her throne, and spun the purple.


    (2) And look! An angel of the Lord stood before her and said, “Do not be afraid, Mary, because you have found grace before the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she questioned herself, saying, “Will I conceive from the Lord, the living God, and give birth as all women give birth?”


    (3) The angel of the Lord said to her, “Not like that, Mary, because the power of God will overshadow you. Therefore, the holy one who will be born from you will be called the Son of the Most High. You will call his name Jesus, because he will save his people from their sins.”


    Mary said, “Look, I am the servant of the Lord. May it happen to me according to your word.”'
translation:
  language: ru
  text: '(1) Она взяла кувшин и пошла набрать воды. И вот, раздался голос, обращённый к ней: «Радуйся, облагодатствованная! Господь с тобой. Благословенна ты среди женщин».


    Мария оглянулась направо и налево, пытаясь понять, откуда раздаётся голос. Охваченная страхом, она вошла в дом. Поставив кувшин, она взяла пурпурную пряжу, села на своё место и стала прясть.


    (2) И вот, перед ней предстал ангел Господень и сказал: «Не бойся, Мария, потому что ты обрела благодать перед Господом всего сущего. Ты зачнёшь от Божьего слова».[a]


    Услышав это, Мария стала размышлять и говорила сама себе: «Неужели я зачну от Господа, живого Бога, и рожу так же, как рожают все женщины?»


    (3) Ангел Господень сказал ей: «Не так, Мария. Сила Божья осенит тебя, поэтому Святое, которое родится от тебя, будет названо Сыном Всевышнего. Ты назовёшь Его Иисусом, потому что Он спасёт Свой народ от его грехов».


    И Мария сказала: «Вот, я служительница Господа. Пусть будет со мной по твоему слову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зачнёшь от слова Божьего». Формулировка может указывать на Божье слово как источник или средство зачатия; перевод сохраняет эту смысловую открытость.'
    reason: Необычная конструкция богословски значима и легко может быть чрезмерно истолкована при сглаживании.
lexical_decisions:
- source_word: κεχαριτωμένη (as reflected in the Greek-tradition wording behind “blessed one”)
  choice: облагодатствованная
  rationale: Передаёт значение наделённости благодатью, не сводя обращение лишь к общему «благословенная»; последующая отдельная фраза уже содержит «благословенна».
- source_word: πορφύρα / “the purple”
  choice: пурпурная пряжа
  rationale: В контексте прядения речь идёт не об абстрактном цвете, а о пурпурном материале; добавление «пряжа» делает действие естественным по-русски.
- source_word: καθέδρα / “throne”
  choice: своё место
  rationale: Нейтральное обозначение сиденья избегает чрезмерно царственного оттенка слова «престол», который здесь контекстуально не обязателен.
- source_word: κύριος τῶν ὅλων / “Lord of All”
  choice: Господь всего сущего
  rationale: Естественно передаёт всеохватное владычество и сохраняет торжественный регистр.
- source_word: ἐκ λόγου θεοῦ / “from God’s word”
  choice: от Божьего слова
  rationale: Сохраняет необычную и богословски значимую формулировку источника, не заменяя её толкованием «по слову» или «силой слова».
- source_word: ἐπισκιάσει
  choice: осенит
  rationale: Сохраняет библейскую образность покрывающего присутствия силы Божьей без её рационализирующего разъяснения.
- source_word: δούλη
  choice: служительница
  rationale: Современное и достойное русское соответствие женской форме «рабыня/слуга», выражающее принадлежность и готовность служить без ненужного бытового оттенка.
theological_decisions:
- issue: Необычная формула зачатия «от Божьего слова»
  choice: 'Сохранить буквально: «Ты зачнёшь от Божьего слова»'
  alternative: «Ты зачнёшь по слову Божьему» или «через слово Божье»
  rationale: Формулировка допускает более одного смыслового оттенка; перевод не должен заранее решать, обозначает ли «слово» средство, основание или личностно понимаемый Логос.
- issue: Реплика Марии о зачатии «от Господа, живого Бога»
  choice: Сохранить вопрос без поясняющей гармонизации
  alternative: Переформулировать как вопрос о девственном зачатии
  rationale: Текст сам выражает недоумение Марии необычным образом; явное толкование сузило бы его смысл и приблизило бы к иной форме рассказа о Благовещении.
- issue: «Святое» как субстантивированное определение рождаемого
  choice: «Святое, которое родится от тебя»
  alternative: «Святой Младенец, который родится от тебя»
  rationale: Средний род и неконкретизированная форма сохраняют напряжение исходной конструкции до последующего титула «Сын Всевышнего».
- issue: Местоимение в выражении «спасёт Свой народ»
  choice: «Свой народ»
  alternative: «его народ»
  rationale: В русском языке возвратное притяжательное местоимение однозначно относится к подлежащему «Он» и естественно передаёт принадлежность народа Иисусу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, повествовательно-библейским звучанием. Сохранены повтор «И вот» и ключевые формулы речи, но устранены неестественные английские кальки. Поскольку в задании указано, что непосредственная сверка с греческой рукописной традицией ещё не завершена, решения опираются на предоставленное свидетельство с осторожным учётом общеизвестной греческой лексики данного эпизода.
