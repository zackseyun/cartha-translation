base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/005.yaml
  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: ru
  text: '(1) На следующий день Иоаким приносил свои дары, говоря про себя: «Если Господь Бог примирился со мной, это покажет мне пластина, которую носит священник».[a] Иоаким принёс свои дары и внимательно смотрел на пластину священника, когда тот поднимался к жертвеннику Господа. И он не увидел на ней греха.[b] Тогда Иоаким сказал: «Теперь я знаю, что Господь Бог примирился со мной и удалил от меня все мои грехи». И он сошёл из Храма Господа оправданным и вернулся в свой дом.


    (2) Прошло около шести месяцев, и на седьмом месяце Анна родила.[c] Она спросила повитуху:


    — Кто родился?


    Повитуха ответила:


    — Девочка!


    Анна сказала:


    — Величается душа моя в этот день![d]


    И она положила ребёнка.


    Когда исполнились дни её очищения, Анна очистилась от истечения крови.[e] Она дала ребёнку грудь и назвала её Марией.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный вид и назначение упомянутой священнической пластины здесь не поясняются. Перевод предварительный до прямой сверки с греческим текстом.
    reason: Предотвращает необоснованное отождествление предмета с конкретной частью первосвященнического облачения.
  - marker: b
    text: 'Буквально по представленному английскому свидетельству: «не увидел на ней греха». Смысл знака остаётся неясным.'
    reason: Сохраняет подлинную неясность текста вместо скрытого толкования.
  - marker: c
    text: Некоторые формы греческой рукописной традиции этого произведения могут различаться в указании месяца рождения; требуется прямая текстологическая сверка.
    reason: Предупреждает о предварительном характере чтения, поскольку предоставлена лишь английская форма свидетельства.
  - marker: d
    text: 'Выражение перекликается с библейской песнью Марии: «Величит душа Моя Господа» (Лк. 1:46), хотя здесь построено иначе.'
    reason: Отмечает литературный отзвук, не объявляя его тождественной цитатой.
  - marker: e
    text: Речь идёт о завершении послеродового периода и очищении от кровотечения; синтаксис исходного свидетельства необычен.
    reason: Поясняет древний контекст без устранения физиологической и ритуальной стороны выражения.
lexical_decisions:
- source_word: plate worn by the priest
  choice: пластина, которую носит священник
  rationale: Сохранён конкретный, но не вполне ясный предмет исходного свидетельства; более толковательные варианты вроде «нагрудник» не введены без прямой сверки с греческим текстом.
- source_word: reconciled
  choice: примирился со мной
  rationale: Передаёт восстановление благоволения и отношений, не сужая смысл до одного лишь «простил».
- source_word: justified
  choice: оправданным
  rationale: Сохранён судебно-религиозный оттенок выражения и возможная связь с библейской лексикой.
- source_word: What is it?
  choice: Кто родился?
  rationale: Естественный русский вопрос о поле новорождённого; буквальное «Что это?» в данном контексте звучало бы неестественно и могло бы восприниматься как уничижительное.
- source_word: My soul is magnified
  choice: Величается душа моя
  rationale: Сохранены необычная форма высказывания и явный библейский отзвук, без замены на толкование вроде «я сегодня возвеличена».
- source_word: gave her breast to the child
  choice: дала ребёнку грудь
  rationale: Естественно и близко передаёт начало грудного кормления.
theological_decisions:
- issue: Знак на священнической пластине и отсутствие греха
  choice: Сохранить формулировку «не увидел на ней греха» без объяснения механизма знамения
  alternative: Истолковать пластину как священнический нагрудник или видимый знак принятия жертвы
  rationale: Исходное свидетельство оставляет образ неясным; конфессиональное или реконструктивное уточнение преждевременно до проверки греческой традиции.
- issue: Состояние Иоакима после посещения Храма
  choice: «сошёл ... оправданным»
  alternative: «сошёл ... получив прощение»
  rationale: «Оправданным» сохраняет напряжение между примирением, удалением грехов и оправданием, не сводя все понятия к одному.
- issue: Послеродовое очищение Анны
  choice: Сохранить ритуально-физиологическую формулировку и отметить её неясность
  alternative: Сгладить до «по окончании срока очищения»
  rationale: Текст связывает завершение дней с очищением от истечения крови; это важная часть древнего повествования, которую не следует устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повествование сделано естественным для чтения вслух, при этом сохранены ключевые повторения, юридико-религиозное «оправданным» и необычное «Величается душа моя». Из-за отсутствия предоставленного греческого текста проект остаётся предварительным и основан на публичном английском свидетельстве; спорные места явно отмечены, а не реконструированы.
