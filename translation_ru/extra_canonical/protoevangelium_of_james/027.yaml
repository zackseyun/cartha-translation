  terminology: «Пещера», «еврейская повитуха» и «Вифлеем» выбраны удачно. «Повитуха» несколько исторически окрашено, но остаётся понятным и соответствует древнему родовспомогательному контексту. Этническое обозначение «еврейская» сохраняет смысл свидетельства и не подменяет его конфессиональным термином.
