  source_fidelity: 'Русский текст точно передаёт последовательность действий и ключевые элементы свидетельства: нахождение пещеры, приведение туда женщины, оставление с нею сыновей Иосифа и поиск еврейской повитухи в местности Вифлеема. Формулировки также согласуются с доступной греческой конструкцией: σπήλαιον («пещера»), παρέστησεν ... μετ᾽ αὐτῆς («оставил/поставил ... при ней») и ἐν τῇ χώρᾳ Βηθλεέμ («в местности/окрестностях Вифлеема»).'
