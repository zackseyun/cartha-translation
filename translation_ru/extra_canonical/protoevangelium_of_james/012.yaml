review_pass:
  verdict: revise
  source_fidelity: 'Нужны небольшие правки для более точного следования свидетельству: «made» не означает непременно «закончила», «went to her house» не содержит значения возвращения, а μυστήρια/«mysteries» в заключении следует передать тем же ключевым словом, а не интерпретирующим «таинственные события». Необычное «тот, кто во мне» и неопределённое родство сохранены верно.'
  naturalness: Текст в целом естественен для современного литературного русского. «Изготовила» точнее в контексте рукоделия; «ушла к себе домой» не добавляет отсутствующее в исходнике «вернулась». Формула «с ней произошли эти тайны» понятна в данном повествовательном и умеренно библейском регистре.
  terminology: «Пурпурная и багряная пряжа», «родственница», «возвеличил твоё имя» и «тот, кто во мне» удачны. «Тайны» следует последовательно сохранить в обоих вхождениях; это не навязывает сакраментального смысла «таинств» и поддерживает словесную связь исходного текста.
  issues:
  - severity: medium
    issue: 'В первом предложении добавлено значение завершённости: «Она закончила ... пряжу».'
    rationale: Свидетельство сообщает, что Мария «сделала/изготовила» пурпурное и багряное; завершение процесса отдельно не выражено.
  - severity: medium
    issue: В заключительной фразе «mysteries» передано как «таинственные события».
    rationale: Замена разрушает повтор ключевого слова «тайны» и несколько интерпретирует его. Следует сохранить «эти тайны» в основном тексте.
  - severity: low
    issue: «Она вернулась в свой дом» добавляет, что Мария возвращалась.
    rationale: Исходник говорит лишь, что она пошла в свой дом; «ушла к себе домой» передаёт это без дополнительного оттенка.
  - severity: low
