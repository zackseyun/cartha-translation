base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: ru
  text: '(1) Она закончила пурпурную и багряную пряжу и отнесла её священнику. Приняв пряжу, священник благословил Марию и сказал: «Мария, Господь Бог возвеличил твоё имя, и тебя будут благословлять во всех поколениях земли».


    (2) Мария возрадовалась и пошла к своей родственнице Елизавете.[a] Она постучала в дверь. Елизавета услышала стук, бросила багряную пряжу и поспешила к двери. Открыв дверь, она благословила Марию и сказала: «Как случилось, что ко мне пришла мать моего Господа? Ведь посмотри: тот, кто во мне, взыграл и благословил тебя!»


    Но Мария забыла тайны, о которых возвестил ей ангел Гавриил. Она пристально посмотрела на небо и сказала: «Господи, кто я такая, что все женщины земли будут благословлять меня?»


    (3) Мария пробыла у Елизаветы три месяца. День ото дня её живот становился всё больше, и Мария испугалась. Она вернулась в свой дом и скрывалась от народа Израиля. Ей было шестнадцать лет, когда с ней произошли эти таинственные события.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к Елизавете, состоявшей с ней в родстве; степень родства в выражении не уточняется.
    reason: Предотвращает необоснованное понимание Елизаветы именно как двоюродной сестры.
  - marker: b
    text: 'Буквально: «когда с ней произошли эти тайны».'
    reason: Показывает повтор ключевого слова и сохраняет доступ к более формальной формулировке исходного свидетельства.
lexical_decisions:
- source_word: purple and scarlet
  choice: пурпурная и багряная пряжа
  rationale: Контекст предшествующего рукоделия и повторное упоминание брошенного материала указывают на пряжу; названия двух цветов сохранены раздельно.
- source_word: cousin
  choice: родственница
  rationale: 'Более осторожная передача родства: она не уточняет его степень и не утверждает непременно двоюродное родство.'
- source_word: magnified your name
  choice: возвеличил твоё имя
  rationale: Сохранён образ возвеличивания имени, а не заменён пояснением о славе или известности.
- source_word: the one in me
  choice: тот, кто во мне
  rationale: Сохранена необычная неопределённость выражения; имя или обозначение ещё не рождённого ребёнка не добавляется.
- source_word: mysteries
  choice: тайны / таинственные события
  rationale: В первом случае сохранено предметное значение сообщённого Гавриилом; в заключении выбрана естественная русская формулировка, не превращающая слово в специальный термин о церковных таинствах.
- source_word: womb grew larger
  choice: живот становился всё больше
  rationale: Естественная современная русская передача заметного телесного изменения без архаического «чрево».
theological_decisions:
- issue: Степень родства Марии и Елизаветы
  choice: родственница
  alternative: двоюродная сестра
  rationale: Точная степень родства не должна утверждаться без достаточного основания; нейтральная формулировка сохраняет неопределённость.
- issue: Смысл слова «mysteries»
  choice: тайны; в последней фразе — таинственные события
  alternative: таинства
  rationale: «Таинства» в современном русском легко воспринимается как технический сакраментальный термин, которого здесь не следует навязывать.
- issue: Кто «взыграл и благословил» Марию
  choice: тот, кто во мне
  alternative: младенец во мне
  rationale: Неявное обозначение сохранено, чтобы перевод не устранял риторическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью в прямой речи. Цепочки предложений сглажены лишь там, где это необходимо для естественного русского синтаксиса. Поскольку древнегреческий текст в задании не приведён и его прямая сверка отмечена как предстоящая, решения остаются осторожными и опираются на предоставленное публичное английское свидетельство; перед публикацией желательна проверка по греческой рукописной традиции.
