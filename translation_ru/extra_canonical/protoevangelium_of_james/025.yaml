base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: ru
  text: '(1) Я, Иаков, записал это повествование в Иерусалиме, когда из-за смерти Ирода начались волнения. Я ушёл в пустыню и оставался там, пока волнения в Иерусалиме не утихли. Я прославлял Господа Бога, давшего мне мудрость записать это повествование.


    (2) И благодать пребудет со всеми, кто боится Господа. Аминь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account (Greek review pending)
  choice: повествование
  rationale: Нейтрально обозначает письменный рассказ и не навязывает современного смысла научной «истории» или официального «отчёта».
- source_word: commotion / unrest (Greek review pending)
  choice: волнения
  rationale: Естественно передаёт общественную смуту, не уточняя её характер сверх доступного свидетельства.
- source_word: wilderness (Greek review pending)
  choice: пустыня
  rationale: Традиционный и понятный библейский эквивалент, который может означать безлюдную местность, а не только песчаную пустыню.
- source_word: fear the Lord (Greek review pending)
  choice: боится Господа
  rationale: 'Сохраняет устойчивый библейский оборот и его смысловую широту: страх, благоговение и почитание.'
theological_decisions:
- issue: Форма заключительного обещания о благодати
  choice: «благодать пребудет»
  alternative: «благодать будет»
  rationale: «Пребудет» естественно для торжественного заключения и передаёт продолжительное присутствие благодати, не добавляя конфессионального толкования.
- issue: Авторское самообозначение Иакова
  choice: Сохранено прямое «Я, Иаков»
  alternative: Переформулировать как безличную авторскую приписку
  rationale: Прямое авторское заявление присутствует в предоставленном свидетельстве; вопрос исторического авторства переводом не разрешается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Поскольку непосредственная сверка с греческой рукописной традицией ещё не проведена, формулировки осторожно следуют предоставленному общедоступному английскому свидетельству и не устраняют возможную исходную неоднозначность.
