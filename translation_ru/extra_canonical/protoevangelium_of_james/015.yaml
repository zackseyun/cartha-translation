translation:
  language: ru
  text: '(1) К нему пришёл книжник Анна и спросил:


    — Иосиф, почему тебя не было среди вернувшихся вместе с нами?


    Он ответил:


    — Я устал с дороги и в первый день после возвращения отдыхал.


    Анна обернулся и увидел, что Мария беременна.


    (2) Он поспешил к священнику и сказал:


    — Иосиф, за которого ты поручился, совершил великое беззаконие.


    Священник спросил:


    — Что случилось?


    Анна ответил:


    — Деву, которую Иосиф взял из Храма Господня, он осквернил: тайно присвоил себе право на брак с ней и не объявил об этом народу Израиля.[a]


    Священник спросил:


    — Неужели Иосиф это сделал?


    Книжник Анна сказал ему:


    — Пошли служителей, и они найдут деву беременной.


    Служители пошли и нашли всё так, как он сказал. Они привели Марию вместе с Иосифом на суд.


    (3) Первосвященник сказал ей:


    — Мария, зачем ты это сделала? Зачем унизила свою душу и забыла Господа, Бога твоего? Ты была воспитана в Святом святых, принимала пищу из руки ангела, слышала его песнопения и танцевала перед ним.[b] Что же ты сделала?


    Горько плача, она сказала:


    — Жив Господь Бог! Я чиста перед Богом и не знала мужчины!


    (4) Священник сказал:


    — Иосиф, что ты сделал?


    Иосиф ответил:


    — Жив Господь, Бог мой, и свидетель мне Божья истина: я чист перед ней.[c]


    Священник сказал:


    — Не лжесвидетельствуй, а скажи правду. Ты тайно присвоил себе право на брак с ней и не объявил об этом народу Израиля. Ты не склонил головы под могучую руку, которая должна была благословить твоё потомство.[d]


    Иосиф молчал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в предоставленном английском свидетельстве: «украл её свадьбу». Вероятно, речь об обвинении в тайном и незаконном присвоении брачных прав; точный оттенок требует сверки с греческим текстом.'
    reason: Необычная брачная идиома не имеет ясного буквального соответствия в современном русском.
  - marker: b
    text: 'В предоставленном свидетельстве местоимения относятся к ангелу: Мария слышала его песнопения и танцевала перед ним. Формулировка подлежит проверке по греческой рукописной традиции.'
    reason: Русский перевод вынужден явно определить референт местоимений там, где исходные данные пока косвенны.
  - marker: c
    text: Выражение «чист перед ней» необычно и может означать, что Иосиф не осквернил Марию и не вступал с ней в недозволенную связь. Неоднозначность сохранена.
    reason: Нельзя без прямой проверки греческого сужать смысл до одного конкретного утверждения.
  - marker: d
    text: Неясно, чья именно «могучая рука» имеется в виду и каким образом она должна была благословить потомство; возможно, подразумевается установленное благословение брака.
    reason: Сохранение неясного ритуального или богословского образа без необоснованной конкретизации.
lexical_decisions:
- source_word: traveling group
  choice: вернувшихся вместе с нами
  rationale: По контексту речь идёт о группе, возвратившейся из пути; такой перевод естественнее буквального «наша путевая группа», при этом причина отсутствия Иосифа сохраняется.
- source_word: acted very lawlessly
  choice: совершил великое беззаконие
  rationale: Сохраняет сильную нравственно-правовую оценку обвинителя и соответствует возвышенному судебно-религиозному контексту.
- source_word: stolen her wedding
  choice: тайно присвоил себе право на брак с ней
  rationale: Буквальное «украл её свадьбу» в современном русском непонятно. Выбранный вариант передаёт обвинение в незаконно и тайно заключённом брачном союзе, не утверждая больше, чем позволяет свидетель.
- source_word: officers
  choice: служителей
  rationale: Нейтральное обозначение посланных храмовой властью исполнителей; «стражники» или «чиновники» были бы излишне конкретны.
- source_word: court
  choice: суд
  rationale: Передаёт место и процесс разбирательства без анахроничного уточнения учреждения.
- source_word: humiliated your soul
  choice: унизила свою душу
  rationale: Сохранён необычный семитизирующий оборот и его нравственно-религиозная тяжесть.
- source_word: known a man
  choice: не знала мужчины
  rationale: Сохранён традиционный библейский эвфемизм половой связи.
- source_word: pure toward her
  choice: чист перед ней
  rationale: Необычное отношение чистоты к Марии сохранено, но выражено естественным русским оборотом; смысл намеренно не сводится однозначно к отсутствию половой связи.
theological_decisions:
- issue: Ангел и местоимения в рассказе первосвященника
  choice: «из руки ангела, слышала его песнопения и танцевала перед ним»
  alternative: «слышала песнопения и танцевала» без явного отнесения местоимений
  rationale: Русский род требует выбора; ближайший грамматический референт — ангел. Сноска отмечает зависимость от предварительного английского свидетельства и необходимость сверки с греческим.
- issue: Характер предполагаемого брачного проступка Иосифа
  choice: обвинение в тайном присвоении права на брак
  alternative: буквальное «украл её свадьбу» либо определённое утверждение о тайном браке
  rationale: Формулировка сохраняет обвинение в нарушении брачного порядка, не превращая неясную идиому в конкретную конфессиональную или юридическую схему.
- issue: Клятва Иосифа
  choice: «Жив Господь, Бог мой, и свидетель мне Божья истина»
  alternative: «Жив Господь, Бог мой, и живо свидетельство Его истины»
  rationale: Передаёт две части трудного выражения как клятву и призывание Божьей истины в свидетели, не создавая дополнительного догматического смысла.
- issue: Могучая рука и благословение потомства
  choice: сохранить неопределённое «могучую руку, которая должна была благословить твоё потомство»
  alternative: прямо назвать руку первосвященника или Бога
  rationale: Референт в предоставленном свидетельстве неясен; перевод не разрешает эту богословско-ритуальную неоднозначность.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего религиозно-судебного повествования. Диалог оформлен естественно, повторяющиеся союзы частично сохранены ради повествовательного ритма. Проект предварительный: предоставлен английский публично-доменный свидетель, тогда как непосредственная сверка с греческой рукописной традицией ещё не выполнена.'
