  revision_rationale: Исправления устраняют добавленную всеобщность, сохраняют неопределённость angelic, нормализуют современный литературный синтаксис и снимают не обусловленную исходным свидетельством конфессиональную капитализацию. Смысл, повтор имени Иосифа, выражение «невинная кровь», неопределённое «отпущу её от себя» и повествовательное напряжение между двумя высказываниями о происхождении ребёнка сохранены.
