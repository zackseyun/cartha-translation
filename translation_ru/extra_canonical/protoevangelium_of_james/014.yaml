base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: ru
  text: '(1) Иосиф сильно испугался и никому о ней не говорил, размышляя, как с ней поступить. Иосиф сказал: «Если я скрою её грех, то окажусь противником закона Господнего. Но если объявлю о ней народу Израиля, то боюсь, как бы находящееся в ней не было от ангела и как бы я не предал невинную кровь смертному суду. Так что же мне с ней делать? Тайно отпущу её от себя».


    И застала его ночь. (2) И вот, ангел Господень явился ему во сне и сказал: «Не бойся за это дитя, ведь Тот, Кто в ней, — от Святого Духа. Она родит Сына, и ты назовёшь Его Иисусом, потому что Он спасёт Свой народ от его грехов».


    Иосиф пробудился ото сна и прославил Бога Израиля, даровавшего ему благодать. И он оберегал её.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: kept quiet about her
  choice: никому о ней не говорил
  rationale: Естественно передаёт сохранение дела в тайне, не добавляя предположения о формальном обвинении.
- source_word: what’s inside her might be angelic
  choice: находящееся в ней не было от ангела
  rationale: Сохраняет необычную и богословски напряжённую формулировку свидетельства, не отождествляя её заранее с последующим указанием на Святого Духа.
- source_word: set her free / release her from me
  choice: отпущу её от себя
  rationale: Передаёт прекращение отношений без внесения более узкого юридического термина «разведусь», которого данное английское свидетельство прямо не требует.
- source_word: this child
  choice: это дитя
  rationale: Сохраняет указание на зачатого ребёнка; оборот «не бойся за» звучит естественно по-русски и не превращает ребёнка в предмет страха.
- source_word: protected her
  choice: оберегал её
  rationale: Передаёт длительную заботу и защиту без лишнего уточнения её формы.
theological_decisions:
- issue: Происхождение находящегося в Марии
  choice: сначала сохранено предположение Иосифа «от ангела», затем утверждение ангела «от Святого Духа»
  alternative: согласовать обе фразы, заменив первую на «от Святого Духа» или «небесного происхождения»
  rationale: Текст намеренно развивает понимание Иосифа; сглаживание устранило бы подлинное повествовательное и богословское напряжение.
- issue: Именование и спасительная роль Иисуса
  choice: «ты назовёшь Его Иисусом, потому что Он спасёт Свой народ от его грехов»
  alternative: пояснить значение имени внутри основного текста
  rationale: Сохранена формулировка свидетельства без добавочного этимологического комментария.
- issue: Дарованная Иосифу благодать
  choice: «даровавшего ему благодать»
  alternative: «оказавшего ему милость»
  rationale: «Благодать» сохраняет традиционную богословскую ёмкость выражения, оставаясь понятной в современном литературном русском.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского повествования. Сохранены повтор имени Иосифа, восклицательное «И вот» и краткие сочинительные переходы. Черновик неизбежно предварительный: предоставлена лишь английская форма публичного свидетельства, а прямая сверка с греческой рукописной традицией ещё не выполнена.'
