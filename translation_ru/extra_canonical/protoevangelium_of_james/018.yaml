base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/018.yaml
  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: ru
  text: '(1) Там он нашёл пещеру, привёл её туда, оставил с ней своих сыновей, а сам пошёл искать еврейскую повитуху в окрестностях Вифлеема.


    (2) Я же, Иосиф, шёл — и не шёл.[a] Я поднял глаза к небесному своду и увидел, что он замер. Я взглянул в небо и с изумлением увидел, что даже птицы небесные неподвижны. Я посмотрел на землю и увидел стоявшую там чашу и возлежавших работников. Руки их были в чаше; они жевали — и не жевали, брали пищу — и не брали, подносили её ко рту — и не подносили. Все они смотрели вверх.


    Я увидел овец, которых гнали, но овцы замерли. Пастух поднял руку, чтобы ударить их, но рука его так и осталась поднятой. Я посмотрел на бурный речной поток[b] и увидел козлят: морды их были у воды, но они не пили.


    И вдруг всё снова пришло в движение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Парадоксальная формулировка передаёт состояние Иосифа в миг, когда всё вокруг словно остановилось.
    reason: Сохраняет необычную конструкцию свидетеля и помогает читателю не принять её за ошибку перевода.
  - marker: b
    text: 'Буквально по доступному английскому свидетелю: «поток реки». Прямая сверка с греческой рукописной традицией ещё требуется.'
    reason: Отмечает необычное выражение и ограниченность предоставленной источниковой базы.
lexical_decisions:
- source_word: cave
  choice: пещера
  rationale: Прямой и естественный эквивалент, сохраняющий конкретный образ места.
- source_word: Hebrew midwife
  choice: еврейская повитуха
  rationale: «Повитуха» соответствует древнему бытовому контексту и остаётся понятной в современном литературном русском; «еврейская» сохраняет этническое определение свидетеля.
- source_word: dome of heaven
  choice: небесный свод
  rationale: Естественное русское выражение, передающее образ небесного купола без навязывания космологической интерпретации.
- source_word: wandering but not wandering
  choice: шёл — и не шёл
  rationale: Сохраняет намеренный парадокс остановившегося времени и не пытается рационализировать его.
- source_word: workers reclining
  choice: возлежавших работников
  rationale: Сохраняет позу участников трапезы и древний колорит; более нейтральное «лежавших» могло бы звучать случайно или небрежно.
- source_word: torrent of the river
  choice: бурный речной поток
  rationale: Передаёт сочетание стремительного потока и реки естественным русским оборотом.
- source_word: resumed its course
  choice: всё снова пришло в движение
  rationale: Ясно противопоставляет внезапное возобновление движения предшествующей всеобщей неподвижности.
theological_decisions:
- issue: Природа остановки мира
  choice: Описать видение буквально в рамках повествования, не объясняя его механизм и длительность
  alternative: Истолковать сцену как субъективное переживание Иосифа или как буквальную остановку космического времени
  rationale: Текст изображает всеобщую неподвижность, но не даёт её догматического или физического объяснения; перевод сохраняет эту открытость.
- issue: Этническое определение повитухи
  choice: Сохранить «еврейская»
  alternative: Опустить определение как подразумеваемое
  rationale: Определение присутствует в свидетеле и может иметь повествовательное значение; его устранение было бы необоснованным.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксические повторы сохранены как важный художественный приём сцены. Проект основан на предоставленном общественном английском свидетеле; прямой анализ греческой рукописной традиции пока не выполнен.
