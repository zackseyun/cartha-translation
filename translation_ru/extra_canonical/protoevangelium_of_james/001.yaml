translation:
  language: ru
  text: '**Протоевангелие Иакова — Глава 1. Беда Иоакима**


    (1) В записях о двенадцати коленах Израиля говорится, что Иоаким был очень богат. Он приносил Господу дары вдвойне, говоря про себя: «Один дар — от моего избытка — пусть будет для всего народа, а другой — Господу Богу, чтобы Он простил меня и совершилось моё искупление».[a]


    (2) Приближался великий день Господень, и сыны Израиля приносили свои дары. Но Рувим встал перед Иоакимом и сказал: «Тебе не подобает первым приносить свои дары, потому что ты не произвёл потомства в Израиле».


    (3) Иоаким глубоко опечалился и обратился к записям о двенадцати коленах народа, говоря про себя: «Посмотрю в записях о двенадцати коленах Израиля, действительно ли я один не произвёл потомства в Израиле». Он исследовал их и обнаружил, что все праведники в Израиле оставили потомство. Вспомнил он и о том, что под конец дней патриарха Авраама Господь Бог даровал ему сына Исаака.


    (4) Иоаким глубоко опечалился и не пошёл к своей жене, а удалился в пустыню и раскинул там шатёр. Он постился сорок дней и сорок ночей, говоря про себя: «Не сойду ни за пищей, ни за питьём, пока Господь, мой Бог, не призрит на меня.[b] Молитва будет мне пищей и питьём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а другой — Господу Богу для прощения, чтобы умилостивить Его за меня». Формулировка предварительна до прямой сверки с греческой рукописной традицией.'
    reason: Свидетель допускает разные способы передать отношение между прощением и искупительным или умилостивительным действием.
  - marker: b
    text: 'То есть пока Господь не обратит на него благосклонного внимания; возможна также передача: «пока Господь, мой Бог, не рассудит обо мне».'
    reason: Английское свидетельство «considers me» неоднозначно, а прямая проверка греческого чтения пока не выполнена.
lexical_decisions:
- source_word: histories / (history)
  choice: записи о двенадцати коленах
  rationale: Передаёт предполагаемый смысл письменных родословных или хроник, не превращая их в современное историческое сочинение; ввиду отсутствия прямой сверки с греческим отмечается предварительный характер решения.
- source_word: doubled the gifts
  choice: приносил Господу дары вдвойне
  rationale: Сохраняет идею двух приношений и звучит естественно по-русски.
- source_word: for forgiveness, to atone for me
  choice: чтобы Он простил меня и совершилось моё искупление
  rationale: Сохраняет рядом прощение и искупительно-очистительный смысл, не сводя выражение к поздней конфессиональной формуле.
- source_word: had a child / raised children
  choice: произвёл потомство / оставили потомство
  rationale: В контексте речь идёт не о воспитании, а о наличии детей и продолжении рода; выбранная формулировка сохраняет общественно-родовой оттенок.
- source_word: considers me
  choice: призрит на меня
  rationale: Передаёт не простое размышление Бога об Иоакиме, а благосклонное внимание к его беде; архаизирующий глагол уместен в молитвенной речи, но пояснён сноской.
- source_word: gave himself to the wilderness
  choice: удалился в пустыню
  rationale: Естественная русская передача добровольного уединения без буквального и неясного оборота.
theological_decisions:
- issue: Связь второго дара с прощением и искуплением
  choice: 'Сохранены оба понятия: прощение и искупление'
  alternative: «в умилостивление за меня» или только «для очищения от грехов»
  rationale: Свидетель содержит два близких выражения; перевод не отождествляет их полностью и не вводит конкретную конфессиональную теорию искупления.
- issue: Бездетность как основание для недопущения к первому приношению
  choice: Высказывание Рувима передано как его утверждение без авторского одобрения
  alternative: Объяснить это как установленный закон или как несправедливое обвинение
  rationale: Текст не сообщает прямо, было ли такое ограничение законным, поэтому богословская и нравственная оценка не добавляется.
- issue: Божье внимание к Иоакиму
  choice: «пока Господь, мой Бог, не призрит на меня»
  alternative: «пока Господь не рассудит обо мне»
  rationale: Сохраняется молитвенное ожидание благосклонного Божьего отклика, но в сноске отмечена широта возможного смысла.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён там, где буквальное следование английскому было бы тяжеловесным. Имена переданы в привычной русской библейской форме: Иоаким, Рувим, Авраам, Исаак. Заголовок «Беда Иоакима» естественно передаёт plight. Проект остаётся предварительным: предоставлена английская публично-доменная версия, тогда как непосредственная сверка с греческим источником ожидается.'
