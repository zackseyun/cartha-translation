base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: ru
  text: '(1) И вот, Иосиф собирался отправиться в Иудею, как вдруг в Вифлееме Иудейском поднялось сильное волнение. Пришли маги[a] и спрашивали: «Где Царь Иудейский? Мы увидели Его звезду на востоке[b] и пришли поклониться Ему[c]».


    (2) Услышав об этом, Ирод встревожился. Он послал к магам своих служителей, созвал первосвященников и расспросил их у себя во дворце: «Что написано о Христе[d]? Где Он должен родиться?»


    Они ответили ему: «В Вифлееме Иудейском, ибо так написано». И он отпустил их — первосвященников.


    Затем он расспросил магов: «Какое знамение вы увидели о Том, Кто родился Царём?»


    Маги ответили: «Мы увидели огромную звезду: она сияла среди других звёзд и настолько затмевала их, что они стали совсем невидимы. Тогда мы поняли, что у Израиля родился Царь, и пришли поклониться Ему».


    Ирод сказал им: «Идите и разыщите Его. Если найдёте, сообщите мне, чтобы и я пришёл поклониться Ему».


    (3) Маги отправились в путь, и вот, звезда, которую они видели на востоке[b], вела их, пока они не пришли к пещере, и остановилась над входом в пещеру[e]. Увидев Младенца с Его матерью Марией, маги достали из своих сумок дары: золото, ладан и смирну.


    Получив от ангела предупреждение не возвращаться в Иудею[f], они иным путём возвратились в свою страну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волхвы», «мудрецы». Слово обозначало людей, связанных с восточной учёностью, толкованием звёзд и жреческой традицией.'
    reason: Сохраняет исторический диапазон неоднозначного термина.
  - marker: b
    text: 'Возможно также: «при её восходе».'
    reason: Фраза может указывать как на восточное направление, так и на восход звезды.
  - marker: c
    text: Глагол может означать как почтительное поклонение царю, так и религиозное поклонение.
    reason: Необходимо сохранить богословскую неоднозначность действия магов.
  - marker: d
    text: То есть о Мессии, Помазаннике.
    reason: Проясняет титул для современного читателя без изменения основного текста.
  - marker: e
    text: 'Буквально по представленному свидетельству: «над головой пещеры», то есть над её верхней частью или входом.'
    reason: Основной текст передаёт естественный пространственный смысл, а сноска сохраняет необычный образ свидетельства.
  - marker: f
    text: Так в представленном свидетельстве. Указание необычно, поскольку Вифлеем уже находится в Иудее; возможно, имеется в виду не возвращаться к Ироду или не идти через ту часть Иудеи, где он находился.
    reason: Сохраняет трудность текста и не исправляет её молча по параллельному рассказу.
lexical_decisions:
- source_word: magi
  choice: маги
  rationale: Сохраняет исторически и религиозно неоднозначное обозначение восточных мудрецов/жрецов, не подменяя его традиционным, но более узким словом «волхвы».
- source_word: worship
  choice: поклониться
  rationale: Передаёт действие почтительного поклонения, сохраняя возможный диапазон от царского почитания до религиозного поклонения.
- source_word: Christ
  choice: Христос
  rationale: Устоявшаяся русская передача титула «Помазанник»; в вопросе Ирода сохранена титульная форма.
- source_word: immense star
  choice: огромная звезда
  rationale: Прямо передаёт необычайный размер звезды без добавочного толкования её природы.
- source_word: frankincense
  choice: ладан
  rationale: Нормальный современный русский термин для благовонной смолы.
- source_word: myrrh
  choice: смирна
  rationale: Традиционный и точный библейский термин; более уместен в торжественном повествовательном регистре, чем «мирра».
theological_decisions:
- issue: Характер поклонения магов
  choice: поклониться Ему
  alternative: почтить Его / поклониться Ему как Богу
  rationale: Формулировка сохраняет смысловую широту источника и не определяет заранее, является ли поклонение только царским почтением или прямым богопочитанием.
- issue: Обозначение пришедших с востока
  choice: маги
  alternative: волхвы / мудрецы
  rationale: «Маги» ближе к исходному историческому термину и не сводит персонажей ни к колдунам, ни просто к учёным мудрецам.
- issue: «Царь для Израиля»
  choice: у Израиля родился Царь
  alternative: родился Царь Израиля
  rationale: Сохраняет отличие данной формулировки от обычного титула «Царь Израиля» и не устраняет возможный оттенок царя, данного Израилю.
- issue: Предупреждение не идти в Иудею
  choice: не возвращаться в Иудею
  alternative: не идти в Иудею
  rationale: «Возвращаться» естественно в контексте намерения снова явиться к Ироду, однако необычное географическое указание сохранено и отмечено сноской, а не исправлено по канонической параллели.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Повторяющееся «и вот» сохранено в ключевых местах как повествовательный сигнал, но избыточная цепочка союзов сглажена. Прописные буквы в местоимениях о Младенце использованы в соответствии с распространённой русской религиозной издательской практикой. Поскольку непосредственная сверка с греческой рукописной традицией ещё не выполнена, спорные места отмечены сносками и не гармонизированы с Евангелием от Матфея.
