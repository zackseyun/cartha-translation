review_pass:
  verdict: revise
  source_fidelity: Нужна правка нескольких мест. «Осмотрела» сглаживает значение проверки прикосновением; «возврати меня бедным» добавляет не выраженное источником значение повторного возвращения; «назидательным» вносит толкование в формулу о публичном примере. Кроме того, «о чудесном, которое» меняет множественное число исходного выражения. Образ руки следует передать как отпадение, а не как утрату чувствительности или силы.
  naturalness: После правок текст остаётся современным литературным русским с уместной сдержанно-библейской интонацией. «Отдай меня бедным» намеренно оставлено трудным, но грамматически естественным; примечание предупреждает читателя, что это не следует незаметно заменять предполагаемым истолкованием.
  terminology: «Беззаконие», «живой Бог», «Владыка всего», «спасение», «оправданной» сохранены. Строчные местоимения при младенце не навязывают конфессиональное решение там, где исходная графика его не маркирует; титулы Бога сохранены с прописной буквы.
  issues:
  - severity: medium
    issue: «Саломея осмотрела её»
    rationale: Греческий глагол в данном эпизоде обозначает обследование посредством ощупывания; простое «осмотрела» существенно ослабляет действие, от которого затем зависит рассказ.
  - severity: medium
    issue: «Возврати меня бедным»
    rationale: В предоставленном свидетельстве нет явного указания на возвращение к прежнему состоянию; приставка «воз-» добавляет смысл. Трудную формулу следует передать без этого добавления и пояснить примечанием.
  - severity: low
    issue: «Назидательным примером»
    rationale: «Назидательный» конкретизирует предполагаемую воспитательную цель, тогда как источник говорит лишь о том, чтобы не сделать Саломею примером/зрелищем для Израиля.
  - severity: low
    issue: «о чудесном, которое ты видела»
    rationale: Исходник говорит о чудесных вещах во множественном числе; русский текст должен сохранить это число.
  - severity: low
    issue: «рука ... отнимается от меня»
    rationale: Это может означать паралич, тогда как образ источника — горящая рука, отпадающая от неё. «Отпадает» точнее и не подменяет телесный образ.
