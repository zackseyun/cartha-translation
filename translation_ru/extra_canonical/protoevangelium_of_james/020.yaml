translation:
  language: ru
  text: '**Протоевангелие Иакова, глава 20 — Испытание Саломеи**


    (1) Повитуха вошла и сказала:


    — Мария, приготовься, потому что тебе предстоит немалое испытание.


    Саломея осмотрела её. Затем Саломея вскрикнула:


    — Горе мне за моё беззаконие и неверие! Я испытала живого Бога — и вот, моя рука горит и отнимается от меня![a]


    (2) Она преклонила колени перед Господом и сказала:


    — Боже моих предков, вспомни обо мне, ведь я потомок Авраама, Исаака и Иакова. Не делай меня назидательным примером для народа Израиля, но возврати меня бедным,[b] потому что Ты знаешь, Господи: Твоим именем я исцеляла людей и от Тебя получала свою плату.[c]


    (3) И вот, ей явился ангел Господа и сказал:


    — Саломея, Саломея! Владыка всего услышал твою молитву. Протяни руку к Младенцу и возьми Его на руки — и обретёшь спасение и радость.


    (4) И вот, Саломея с радостью подошла к Младенцу, взяла Его на руки и сказала:


    — Я поклоняюсь Ему, потому что у Израиля родился великий Царь.


    И тотчас Саломея исцелилась и вышла из пещеры оправданной.[d]


    И вот, раздался голос:


    — Саломея, Саломея! Не рассказывай о чудесном, которое ты видела, пока Младенец не войдёт в Иерусалим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально переданный образ допускает разные оттенки: рука может пониматься как отпадающая, разрушающаяся или отнимающаяся. Нужна сверка с греческими свидетелями.'
    reason: Предоставлена английская версия при отложенной проверке греческого текста; нельзя уверенно устранить образную неоднозначность.
  - marker: b
    text: «Возврати меня бедным» — трудное и неясное место, сохранённое без истолковывающего дополнения. Возможно, речь связана с прежним служением Саломеи бедным, но греческий текст и варианты рукописей требуют отдельной проверки.
    reason: Свидетель прямо отмечает трудность выражения; перевод не должен молча исправлять его предполагаемый смысл.
  - marker: c
    text: 'Или: «получала от Тебя вознаграждение».'
    reason: Слово «плата» может обозначать как буквальное вознаграждение, так и награду от Бога; сохранена неоднозначность.
  - marker: d
    text: То есть признанной правой или получившей оправдание; это сказано отдельно от её телесного исцеления.
    reason: Необходимо сохранить юридический и богословский оттенок, не подменяя его понятием исцеления.
lexical_decisions:
- source_word: position yourself
  choice: приготовься
  rationale: Передаёт обращённое к Марии требование подготовиться к предстоящему осмотру; буквальное «расположись» в современном русском звучало бы неестественно. Прямую проверку греческой формы ещё необходимо провести.
- source_word: examined her
  choice: осмотрела её
  rationale: Нейтрально передаёт медицинское обследование, не добавляя отсутствующих в предоставленном свидетельстве анатомических подробностей.
- source_word: lawlessness
  choice: беззаконие
  rationale: Сохраняет библейскую и нравственно-религиозную окраску исходного понятия.
- source_word: falling away from me
  choice: отнимается от меня
  rationale: Сохраняет образ утраты или разрушения руки, не уточняя без греческой сверки, отпадает ли она буквально или теряет силу.
- source_word: Lord of All
  choice: Владыка всего
  rationale: Передаёт универсальное владычество и отличает этот титул от обычного «Господь» в соседнем контексте.
- source_word: lift him up
  choice: возьми Его на руки
  rationale: Естественное русское выражение для поднятия младенца; не предполагает дополнительного ритуального действия.
- source_word: justified
  choice: оправданной
  rationale: Сохраняет судебно-религиозную многозначность формулировки, не сводя её лишь к исцелению или прощению.
theological_decisions:
- issue: Объект поклонения Саломеи
  choice: «Я поклоняюсь Ему» с прописной буквы в местоимении
  alternative: «Я поклоняюсь ему» со строчной буквы
  rationale: Речь непосредственно относится к Младенцу, которого повествование связывает с действием Бога; прописная буква соответствует достоинству русского религиозного текста, но формула не расширена до более позднего догматического определения.
- issue: Смысл обещания ангела
  choice: «обретёшь спасение и радость»
  alternative: «получишь исцеление и радость»
  rationale: Сохранено более широкое «спасение», чтобы не устранять богословскую многозначность ради одного телесного исцеления.
- issue: Состояние Саломеи при выходе из пещеры
  choice: «вышла ... оправданной»
  alternative: «вышла ... исцелённой» или «прощённой»
  rationale: Буквально сохраняется отдельное утверждение об оправдании после уже упомянутого исцеления; эти понятия не отождествляются.
- issue: Испытание живого Бога
  choice: «Я испытала живого Бога»
  alternative: «Я искушала живого Бога»
  rationale: «Испытала» сохраняет связь с проверкой знамения и не вводит более узкое значение намеренного искушения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Паратактическое «И вот» сохранено в ключевых местах как повествовательный и эпифанический сигнал, но повторения сглажены там, где они утяжеляли бы русский текст. Перевод остаётся предварительным: он основан на предоставленном публичном английском свидетельстве, поскольку прямая сверка с греческой рукописной традицией ещё не проведена. Неясные места не исправлены догадочно; они обозначены примечаниями.'
