  naturalness: Текст в целом литературен и сохраняет скорбно-молитвенную интонацию. «Какая утроба носила меня?» звучит естественнее и образно точнее, чем «произвела меня на свет».
  terminology: «Горе мне», «плодовиты», «пред Тобою», «храм Господа, Бога моего» и «благословляют Тебя» уместно сохраняют возвышенный регистр. Заглавное написание местоимений при обращении к Богу допустимо как редакционная конвенция.
  issues:
