translation:
  language: ru
  text: '(1) Анна пристально посмотрела на небо и увидела в лавровом дереве воробьиное гнездо. И Анна стала сетовать, говоря про себя:


    «Горе мне! Кто родил меня? Какая утроба произвела меня на свет? Я родилась проклятием перед народом Израиля и стала предметом презрения. Надо мной насмехались и изгнали меня из храма Господа, Бога моего.


    (2) Горе мне! С чем мне себя сравнить? Я не подобна птицам небесным, ведь даже птицы небесные плодовиты пред Тобою, Господи.


    Горе мне! С чем мне себя сравнить? Я не подобна животным, ведь даже животные плодовиты пред Тобою, Господи.


    Горе мне! С чем мне себя сравнить? Я не подобна диким зверям земным, ведь даже дикие звери земные плодовиты пред Тобою, Господи.


    (3) Горе мне! С чем мне себя сравнить? Я не подобна этим водам, ведь даже эти воды спокойны, но волнуются, и рыбы их благословляют Тебя, Господи.


    Горе мне! С чем мне себя сравнить? Я не подобна этой земле, ведь земля приносит свои плоды в своё время и благословляет Тебя, Господи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: looked intently toward heaven
  choice: пристально посмотрела на небо
  rationale: Передаёт направленный и напряжённый взгляд естественным современным русским выражением.
- source_word: lamented
  choice: стала сетовать
  rationale: Сохраняет характер скорбной жалобы, не придавая речи излишне обрядового оттенка.
- source_word: What am I like?
  choice: С чем мне себя сравнить?
  rationale: Естественно выражает повторяющийся вопрос о подобии, на котором строится последующее сопоставление.
- source_word: fruitful
  choice: плодовиты
  rationale: В отношении живых существ прямо передаёт способность приносить потомство и сохраняет связь с бесплодием Анны.
- source_word: before you
  choice: пред Тобою
  rationale: Сохраняет молитвенную направленность и умеренно возвышенный регистр.
- source_word: serene yet churn
  choice: спокойны, но волнуются
  rationale: Сохраняет парадоксальное сочетание покоя и движения вод, не устраняя трудность исходного свидетельства.
- source_word: produces her fruits when it’s time
  choice: приносит свои плоды в своё время
  rationale: Передаёт образ плодоношения земли и временную уместность без лишнего истолкования.
theological_decisions:
- issue: Самоопределение Анны как проклятия перед Израилем
  choice: Я родилась проклятием перед народом Израиля
  alternative: Я стала проклятой в глазах народа Израиля
  rationale: Сохранена резкая формулировка свидетельства и её богословское напряжение; не добавлено объяснение, будто речь лишь о человеческом восприятии.
- issue: Благословение Бога рыбами и землёй
  choice: рыбы их благословляют Тебя; земля ... благословляет Тебя
  alternative: рыбы их славят Тебя; земля ... славит Тебя
  rationale: Сохранён мотив благословения Бога творением, несмотря на необычность такого словоупотребления по-русски.
- issue: Изгнание из храма
  choice: изгнали меня из храма Господа, Бога моего
  alternative: отлучили меня от храма Господа, Бога моего
  rationale: Не уточняется правовой или культовый характер действия, которого предоставленное свидетельство не раскрывает.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной молитвенной интонацией. Анафорическое «Горе мне!» и параллелизм сохранены. Заглавные местоимения при обращении к Богу использованы как русская издательская конвенция, не меняющая смысла. Перевод остаётся предварительным: в предоставленных данных указано, что непосредственная сверка с греческой рукописной традицией ещё не выполнена.'
