    issue: «белую нить» вместо отдельного греческого термина ἀμίαντον
    rationale: Такое решение добавляет «нить» и сводит ἀμίαντον только к цвету, хотя греческое слово буквально означает «чистое/неосквернённое» и в данном текстильном перечне может обозначать материал или его качество.
  - severity: medium
    issue: «фиолетовую пряжу» вместо «гиацинтовое»
    rationale: Греческое ὑακίνθινον — технический цветовой термин, традиционно передаваемый как «гиацинтовый». «Фиолетовый» допустим как приблизительное толкование, но снимает терминологическую неопределённость исходника.
  - severity: low
    issue: Добавление слова «пряжа» к выборочным цветовым позициям
    rationale: Исходный текст даёт однородный перечень; выборочное добавление рода материала создаёт неравномерность и может приписывать исходнику невыраженное различение.
