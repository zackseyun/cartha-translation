base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: ru
  text: '(1) Священники собрались на совет и сказали: «Сделаем завесу для Храма Господня».


    Священник сказал: «Позовите ко мне чистых дев из рода Давида». Служители пошли искать и нашли семерых. Тогда священник вспомнил, что отроковица Мария тоже была из рода Давида и чиста перед Богом. Служители пошли и привели её.


    (2) Их ввели в Храм Господень, и священник сказал: «Бросьте жребий, чтобы определить, кто будет прясть золото, чистое, виссон, шёлк, гиацинтовое, багряное и настоящий пурпур».[a]


    Марии выпал жребий прясть настоящий пурпур и багряное, и она взяла их к себе домой. Это было в то время, когда Захария лишился дара речи, и Самуил занял его место, пока Захария снова не смог говорить. Мария взяла багряное и стала прясть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перечень передаёт отдельные греческие названия материалов и цветов. «Чистое» буквально передаёт термин, который, вероятно, относится к чистой ткани или нити; «виссон» — тонкая льняная ткань. «Гиацинтовое», «багряное» и «настоящий пурпур» обозначают специальные цвета или окрашенные материалы; их точные современные цветовые соответствия не вполне определённы.
    reason: Сноска сохраняет неоднозначность специализированных греческих текстильных терминов, не подменяя её одним современным толкованием.
lexical_decisions:
- source_word: veil
  choice: завеса
  rationale: Традиционный и понятный русский термин для храмовой завесы; сохраняет сакральный контекст, не уточняя её точное расположение.
- source_word: tribe of David
  choice: род Давида
  rationale: В данном повествовательном контексте естественнее русского «колено Давида», поскольку Давид не является эпонимом одного из двенадцати колен; при этом сохраняется смысл происхождения.
- source_word: officers
  choice: служители
  rationale: Нейтральное обозначение храмовых исполнителей поручения; английское свидетельство не позволяет надёжно установить более точную должность.
- source_word: the child Mary
  choice: отроковица Мария
  rationale: Передаёт юный возраст Марии в достойном литературном регистре без неестественного сочетания «ребёнок Мария».
- source_word: spin
  choice: прясть
  rationale: Прямой термин для изготовления нити; по-русски требует обозначить подразумеваемый материал там, где названия цветов сами по себе были бы неясны.
- source_word: true purple
  choice: настоящий пурпур
  rationale: Сохраняет необычное и, возможно, техническое различение английского свидетельства, не отождествляя его молча с фиолетовым или багряным.
- source_word: fell silent
  choice: лишился дара речи
  rationale: Естественно передаёт наступившую немоту Захарии, не добавляя причины или богословской оценки.
theological_decisions:
- issue: Чистота Марии перед Богом
  choice: «чиста перед Богом»
  alternative: «непорочна перед Богом»
  rationale: Сохранена формулировка свидетельства без привнесения позднейшего догматического содержания, которое может ассоциироваться со словом «непорочна».
- issue: Немота Захарии
  choice: «лишился дара речи»
  alternative: «умолк»
  rationale: Выражено физическое состояние, подразумеваемое контекстом, но не указана его причина и не дано конфессиональное толкование.
- issue: Самуил как заместитель Захарии
  choice: «Самуил занял его место»
  alternative: «Самуил замещал его»
  rationale: 'Сохранено неопределённое указание источника: не уточняется должность, характер служения или тождество Самуила.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Формы «Храм Господень», «завеса» и «отроковица» поддерживают древний сакральный контекст, но синтаксис остаётся доступным. Проект предварительный: он основан на публичном английском свидетельстве, поскольку прямой обзор греческого текста ожидается.'
