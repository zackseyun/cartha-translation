base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: ru
  text: '(1) И вот, Иосиф собирался отправиться в Иудею, как вдруг в Вифлееме Иудейском поднялось великое смятение. Пришли волхвы и спрашивали: «Где Царь Иудейский? Мы увидели Его звезду на востоке и пришли поклониться Ему».


    (2) Услышав об этом, Ирод встревожился. Он послал служителей за волхвами, и те рассказали ему о звезде.


    (3) И вот, они увидели на востоке звёзды[a]. Звёзды вели волхвов, пока те не пришли к пещере; и звезда остановилась над головой Младенца. Увидев Его с матерью Его Марией, волхвы достали из своих сумок дары: золото, ладан и смирну.


    Получив от ангела предостережение, они вернулись в свою страну другим путём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Так в предоставленном свидетельстве: сначала «звёзды» во множественном числе, далее — «звезда» в единственном.'
    reason: Отмечает заметный переход числа, сохраняя текстовую неоднозначность и не создавая впечатления случайной редакционной ошибки.
lexical_decisions:
- source_word: magi
  choice: волхвы
  rationale: Традиционный и понятный русский эквивалент для древних восточных мудрецов/астрологов; не уточняет их как царей, чего источник не утверждает.
- source_word: worship
  choice: поклониться
  rationale: Сохраняет диапазон значения почтительного поклонения, не снимая возможного богословского смысла.
- source_word: officers
  choice: служители
  rationale: Нейтральная передача людей, посланных Иродом; «чиновники» или «воины» дали бы неоправданно узкое толкование.
- source_word: cave
  choice: пещера
  rationale: Прямая передача места, названного в повествовании.
- source_word: frankincense
  choice: ладан
  rationale: Устоявшееся русское название благовония.
- source_word: myrrh
  choice: смирна
  rationale: Устоявшийся библейский эквивалент названия ароматической смолы.
theological_decisions:
- issue: Смысл поклонения волхвов
  choice: «поклониться Ему»
  alternative: «почтить Его»
  rationale: «Поклониться» формально и традиционно передаёт действие, сохраняя напряжение между царским почтением и религиозным поклонением.
- issue: Титул младенца
  choice: «Царь Иудейский» с прописной буквы в прямой речи
  alternative: «царь иудейский»
  rationale: Прописная буква соответствует русской традиции мессианского титула, не добавляя к тексту нового титулования.
- issue: Множественное и единственное число слова «звезда»
  choice: Сохранён переход от «звёзд» к «звезде»
  alternative: Унифицировать как единственное число
  rationale: Переход присутствует в предоставленном свидетельстве и может отражать реальную текстовую особенность; его не следует молча исправлять.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис упрощён там, где буквальное повторение союзов звучало бы тяжеловесно, но последовательность событий и ключевые повторы сохранены. Поскольку прямая сверка с греческим источником ещё не проведена, проект следует считать предварительным и основанным на указанном англоязычном публичном свидетельстве.
