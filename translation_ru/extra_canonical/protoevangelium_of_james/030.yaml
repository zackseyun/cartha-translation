review_pass:
  verdict: revise
  source_fidelity: 'В целом порядок повествования, «волхвы», пещера, дары и намеренно сохранённый переход «звёзды» → «звезда» переданы верно по предоставленному английскому свидетельству. Однако в ст. 2 следует явнее сохранить два действия: Ирод послал служителей и затем велел привести волхвов. Прописные буквы в «Царь», «Его», «Младенец» не обусловлены источником и придают повествованию интерпретационно-благочестивую окраску.'
  naturalness: Русский текст в целом естественен и литературен. «Велел привести волхвов» ясно и естественно передаёт «sent for them», а «предупреждение от ангела» несколько прямее соответствует исходной конструкции, чем «получив ... предостережение».
  terminology: «Волхвы», «поклониться», «служители», «пещера», «ладан» и «смирна» уместны. Строчные буквы в титулах и местоимениях сохраняют нейтральный современный литературный регистр и не добавляют богословского истолкования.
  issues:
  - severity: medium
    issue: В ст. 2 сокращена двухчастная формулировка об отправке служителей и вызове волхвов.
    rationale: Свидетель содержит «he sent officers and sent for them». «Он послал служителей за волхвами» может покрывать оба действия одним оборотом, но не сохраняет явно их последовательность и наличие посланных лиц.
  - severity: low
    issue: Необусловленные прописные буквы в словах «Царь», «Его», «Младенец».
    rationale: Исходное свидетельство не маркирует эти слова как особые богословские титулы. Строчное написание нейтральнее и избегает добавочной конфессиональной окраски.
  revised_text: '(1) И вот, Иосиф собирался отправиться в Иудею, когда в Вифлееме Иудейском поднялось великое смятение. Пришли волхвы и спрашивали: «Где царь иудейский? Мы увидели его звезду на востоке и пришли поклониться ему».


    (2) Услышав об этом, Ирод встревожился. Он послал служителей и велел привести волхвов; те рассказали ему о звезде.


    (3) И вот, они увидели на востоке звёзды[a]. Звёзды вели волхвов, пока те не пришли к пещере, и звезда остановилась над головой младенца. Увидев его с матерью его Марией, волхвы достали из своих сумок дары: золото, ладан и смирну.


    Получив предупреждение от ангела, они вернулись в свою страну другим путём.'
  revised_footnotes:
