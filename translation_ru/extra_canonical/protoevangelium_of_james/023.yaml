review_pass:
  verdict: revise
  source_fidelity: 'По предоставленному английскому свидетелю (прямая сверка с греческой традицией в материалах отсутствует) содержание в целом передано точно: два посольства Ирода, угроза Захарии, его слова о невинной крови и убийство на рассвете сохранены. Однако «разыскивал Иоанна» сильнее, чем asked for John («спрашивал об Иоанне»), а «слуги» для officers ослабляет официальный характер посланцев. В реплике Ирода «His son» относится к Захарии; русское «Его сыну» в прямой речи может быть понято, но лучше повторить имя. Формула martyr of God в данном контексте естественнее и точнее передаётся как «мученик Божий»; примечание о варианте «свидетель» может сохранить лексическую историю, не меняя основной смысл.'
  naturalness: Русский текст в целом литературен и хорошо организован. Замена «Откуда мне знать» на «Как мне знать» чуть ближе к исходной риторике и естественна. «При входе в храм Господа» точнее для entrance и не создаёт образа пребывания внутри храма. «Около рассвета» сохраняет приблизительность around daybreak.
  terminology: «Служитель Бога» уместно и не уточняет должность. «Посланцы» — нейтральное современное обозначение людей, отправленных Иродом, без добавления военной функции. «Храм Божий» и «храм Господа» сохраняют различение формулировок английского свидетеля. «Мученик Божий» в контексте пролития крови является прямой и естественной передачей martyr; в сноске отмечено буквальное значение слова «свидетель».
  issues:
  - severity: medium
    issue: «разыскивал Иоанна»
    rationale: Asked for John означает, что Ирод спрашивал об Иоанне/требовал привести его; «разыскивал» добавляет собственно поисковое действие, которого в предоставленном свидетеле нет.
  - severity: medium
    issue: «слуги» для officers
    rationale: Слуги могут обозначать домашнюю прислугу; officers здесь — официально направленные Иродом люди. «Посланцы» передаёт функцию без модернизации и без добавления военного значения.
  - severity: low
    issue: Не вполне сохранена приблизительность «around daybreak»
    rationale: «На рассвете» возможно, но «около рассвета» точнее отражает around.
  - severity: medium
    issue: Основное «свидетелем Божьим» для martyr of God
    rationale: Хотя μαρτυς исторически связано со свидетельством, в контексте ожидаемого убийства и пролития крови основной современный смысл «мученик» наиболее прозрачно передаёт высказывание. Альтернативное буквальное значение следует оставить в сноске.
  revised_text: '**Протоевангелие Иакова — Глава 23. Убийство Захарии**


    (1) Ирод же спрашивал об Иоанне и послал к Захарии посланцев сказать ему:


    — Где ты прячешь своего сына?


    Он ответил им:


    — Я служитель Бога и пребываю в Божьем храме. Как мне знать, где мой сын?


    (2) Посланцы ушли и обо всём доложили Ироду. Ирод разгневался и сказал:


    — Сын Захарии собирается стать царём Израиля!


    И он снова послал к Захарии посланцев сказать ему:


    — Скажи мне правду: где твой сын? Ты знаешь, что твоя жизнь в моей руке.


    Посланцы ушли и передали ему эти слова.


    (3) Захария сказал:


    — Если ты прольёшь мою кровь, я буду мучеником Божьим[a], потому что Господь примет мой дух: ведь ты прольёшь невинную кровь при входе в храм Господа.


    Около рассвета Захария был убит, а народ Израиля не знал, что он убит.[b]'
  revised_footnotes:
