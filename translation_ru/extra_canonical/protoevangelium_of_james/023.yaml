translation:
  language: ru
  text: '**Протоевангелие Иакова — Глава 23. Убийство Захарии**


    (1) Ирод же разыскивал Иоанна и послал слуг к Захарии сказать ему:


    — Где ты прячешь своего сына?


    Он ответил им:


    — Я служитель Бога и нахожусь в Божьем храме. Откуда мне знать, где мой сын?


    (2) Слуги вернулись и обо всём доложили Ироду. Ирод разгневался и сказал:


    — Его сыну предстоит стать царём над Израилем!


    Он снова послал слуг сказать Захарии:


    — Скажи мне правду: где твой сын? Ты ведь знаешь, что твоя жизнь в моей руке.


    Слуги вернулись и передали ему эти слова.


    (3) Тогда Захария сказал:


    — Если ты прольёшь мою кровь, я стану свидетелем Божьим[a], потому что Господь примет мой дух: ведь ты прольёшь невинную кровь у входа в храм Господень.


    На рассвете Захария был убит, а народ Израиля не знал о его убийстве.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучеником Божьим». Слово «свидетель» здесь, в контексте предстоящей насильственной смерти, может включать смысл мученичества.'
    reason: Сохраняет значимую лексическую и богословскую неоднозначность выражения.
  - marker: b
    text: 'Перевод этой главы предварительный: он выполнен по предоставленному общедоступному английскому свидетельству; необходима прямая сверка с греческой рукописной традицией.'
    reason: Пользовательские данные прямо указывают, что проверка по исходному греческому тексту ещё не проведена.
lexical_decisions:
- source_word: minister of God
  choice: служитель Бога
  rationale: Передаёт культовое служение Захарии без уточнения должности, которого предоставленное свидетельство прямо не даёт.
- source_word: officers
  choice: слуги
  rationale: Нейтральное обозначение посланных Иродом людей; слово «чиновники» звучало бы чрезмерно современно, а «воины» добавляло бы не указанную в свидетельстве военную функцию.
- source_word: I sit in God’s Temple
  choice: нахожусь в Божьем храме
  rationale: Естественная русская передача присутствия и служения в храме; буквальное «сижу» в данном контексте могло бы создать ложный бытовой акцент. Решение остаётся предварительным до сверки с греческим текстом.
- source_word: martyr of God
  choice: свидетелем Божьим
  rationale: Сохраняет смысл свидетельства перед Богом и не навязывает позднейшее узкое употребление слова «мученик»; возможный мученический оттенок указан в примечании.
- source_word: around daybreak
  choice: на рассвете
  rationale: Краткая и естественная передача приблизительного времени наступления дня.
theological_decisions:
- issue: Смысл выражения «martyr of God»
  choice: «свидетелем Божьим» с примечанием о возможном значении мученичества
  alternative: «мучеником Божьим»
  rationale: Контекст убийства допускает мученический смысл, однако «свидетель» лучше сохраняет лексическую неоднозначность и не превращает её безоговорочно в поздний церковный титул.
- issue: Предсказание Ирода о сыне Захарии
  choice: «Его сыну предстоит стать царём над Израилем»
  alternative: «Его сын собирается стать царём Израиля»
  rationale: Формулировка сохраняет взгляд и опасение Ирода, не утверждая от лица повествователя, что Иоанну действительно предназначено царствовать.
- issue: Принятие духа Захарии Господом
  choice: сохранено как прямое утверждение Захарии
  alternative: смягчить до выражения надежды
  rationale: Исходное свидетельство формулирует это как уверенное причинное утверждение; богословское смягчение было бы интерпретационным добавлением.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён там, где буквальное повторение английских связок звучало бы тяжеловесно, но последовательность событий и повторные посольства Ирода сохранены. Формы «Божий» и «Господень» поддерживают умеренно возвышенный регистр без архаизации.
