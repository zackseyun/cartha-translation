  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: ru
  text: Ведь вы знаете — и хорошо знаете — священные Писания, возлюбленные, и внимательно изучили изречения Божьи.[a] Поэтому мы пишем это вам в напоминание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «склонились над изречениями Божьими»; то есть внимательно их изучили.'
    reason: Сохраняет конкретный образ глагола ἐγκύπτω, тогда как основной текст передаёт его естественный переносный смысл.
lexical_decisions:
- source_word: Ἐπίστασθε ... καὶ καλῶς ἐπίστασθε
  choice: вы знаете — и хорошо знаете
  rationale: Сохраняет эмфатический повтор греческого глагола и звучит естественно по-русски.
- source_word: τὰς ἱερὰς γραφάς
  choice: священные Писания
  rationale: Передаёт определённый корпус почитаемых священных текстов; множественное число отражает греческую форму.
- source_word: ἐγκεκύφατε εἰς
  choice: глубоко вникли в
  rationale: Перфект указывает на состоявшееся внимательное изучение с сохраняющимся результатом; выражение естественно передаёт переносное употребление ἐγκύπτω применительно к тексту.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: изречения Божьи
  rationale: «Изречения» сохраняет смысл авторитетных речений Бога и не сужает λόγια до простой разговорной речи.
- source_word: πρὸς ἀνάμνησιν
  choice: чтобы напомнить вам
  rationale: Естественно передаёт цель письма и подразумеваемую направленность напоминания к адресатам.
theological_decisions:
- issue: Соотношение «священных Писаний» и «изречений Божьих»
  choice: Сохранены оба разных выражения без отождествляющего пояснения.
  alternative: Передать оба выражения одним словом «Писание».
  rationale: Греческий текст использует γραφαί и λόγια; сохранение различия не снимает возможного смыслового оттенка авторитетной Божьей речи.
translation_notes:
  register: Современный литературный русский язык с достойным эпистолярным тоном. Обращение «возлюбленные» сохранено как традиционное, но понятное современному читателю; синтаксис слегка упрощён ради ясности без утраты греческого акцента и повтора.
