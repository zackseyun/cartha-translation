  text: And Moses said, "If you will forgive their sin, forgive; but if not, blot me also out of the book of the living."
translation:
  language: ru
  text: 'И сказал Моисей: «Ни в коем случае, Господи! Прости грех этому народу — или же изгладь и меня из книги живых».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς, κύριε
  choice: «Ни в коем случае, Господи!»
  rationale: Передаёт явное решительное возражение Моисея в греческом тексте; эту фразу нельзя опускать вслед за английским консультационным слоем.
- source_word: ἄφες τὴν ἁμαρτίαν τῷ λαῷ τούτῳ
  choice: «Прости грех этому народу»
  rationale: Сохраняет единственное число ἁμαρτίαν и естественно передаёт конструкцию с дательным падежом лица.
- source_word: ἢ κἂν ἐξάλειψόν με
  choice: «или же изгладь и меня»
  rationale: ἤ обозначает альтернативу, а καί в составе κἄν подчёркивает включение самого Моисея; «и меня» естественно выражает этот смысл по-русски без добавления отсутствующего в данном греческом тексте развёрнутого условия.
- source_word: ἐκ βίβλου ζώντων
  choice: «из книги живых»
  rationale: Формально и идиоматично передаёт ἐκ и родительный множественного числа ζώντων, сохраняя традиционный библейский образ.
theological_decisions:
- issue: Ходатайство Моисея перед угрозой уничтожения народа
  choice: Сохранено прямое возражение «Ни в коем случае, Господи!» и готовность Моисея разделить участь народа.
  alternative: Условная формулировка «Если Ты простишь их грех… а если нет…» по английскому POB.
  rationale: Греческий текст 1 Климента прямо содержит Μηδαμῶς, κύριε и не имеет в этом стихе полной условной конструкции из текста Исх 32:32; перевод следует предоставленному оригиналу и не сглаживает его редакционную форму.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Изгладь» сохранено как понятный высокий глагол, соответствующий образу удаления имени из книги; синтаксис остаётся кратким и торжественным.
