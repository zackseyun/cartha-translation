  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: ru
  text: 'И сказал ему Господь: «Я говорил тебе не раз: „Я увидел этот народ — и вот, он жестоковыйный. Оставь Меня, чтобы Я истребил их и изгладил их имя из-под неба; а от тебя Я произведу народ великий, дивный и гораздо больший, чем этот“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅπαξ καὶ δὶς
  choice: и раз, и два
  rationale: Сохранён необычный греческий оборот с его риторической выразительностью, без сведения к менее точному «не раз».
- source_word: σκληροτράχηλος
  choice: жестоковыйный
  rationale: Устоявшийся библейский эквивалент образного выражения «с жёсткой шеей»; он уместен в dignified literary register и сохраняет связь с ветхозаветной речью.
- source_word: ἔασόν με
  choice: оставь Меня
  rationale: Передаёт прямой императив и сохраняет богословское напряжение реплики, не заменяя его толкованием «не удерживай Меня».
- source_word: ἐξολεθρεῦσαι
  choice: истребил
  rationale: Точно выражает уничтожение без добавочного усилителя «совершенно».
- source_word: ἐξαλείψω
  choice: изгладил
  rationale: Сохраняет библейскую метафору стирания имени, а не обобщает её как «уничтожу память».
- source_word: θαυμαστὸν
  choice: дивный
  rationale: Передаёт значение «удивительный, достойный изумления» в возвышенном, но понятном регистре.
- source_word: πολὺ μᾶλλον ἢ τοῦτο
  choice: более многочисленный, чем этот
  rationale: В контексте народа сравнительный оборот естественно относится к многочисленности; «πολύ» также поддерживает количественный оттенок.
theological_decisions:
- issue: Божье повеление Моисею не вмешиваться
  choice: «Оставь Меня, чтобы Я истребил их»
  alternative: «Не удерживай Меня, и Я истреблю их»
  rationale: Выбран более формально близкий вариант, сохраняющий условно-целевую связь и не уточняющий сверх текста, каким образом Моисей мог удерживать Бога.
- issue: Смысл сравнительной фразы о новом народе
  choice: «более многочисленный, чем этот»
  alternative: «гораздо больше этого» / «величественнее этого»
  rationale: Количественное понимание наиболее естественно рядом с ἔθνος и πολύ, однако перевод не добавляет обещаний о духовном или политическом превосходстве.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис прямой речи и повтор «и раз, и два» намеренно сохранены. Архаизирующее «жестоковыйный» оставлено как широко узнаваемый библейский термин; остальная лексика современна и ясна.
