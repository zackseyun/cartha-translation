base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: ru
  text: 'Ибо, когда Моисей взошёл на гору и провёл сорок дней и сорок ночей в посте и смирении, Бог сказал ему: «Моисей, Моисей, сойди скорее отсюда, потому что народ твой, который ты вывел из земли Египетской, поступил беззаконно. Они быстро уклонились с пути, который Я заповедал им, и сделали себе литые изображения».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделали себе литые [предметы]»; греческий текст не называет здесь конкретный вид этих предметов.'
    reason: Уточняет, что χωνευτά — субстантивированное прилагательное и что существительное «изображения» добавлено для естественности русского выражения, не определяя вид предметов точнее, чем исходный текст.
lexical_decisions:
- source_word: ποιήσαντος τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας
  choice: провёл сорок дней и сорок ночей
  rationale: Греческое ποιεῖν с обозначением времени идиоматически означает «проводить» определённый срок; буквальное «сделал» по-русски неестественно.
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: в посте и смирении
  rationale: «Пост» точно передаёт νηστεία, а «смирение» сохраняет широкий смысл ταπείνωσις — состояние или действие самоумаления — без чрезмерного психологического уточнения.
- source_word: ἠνόμησεν
  choice: поступил беззаконно
  rationale: Передаёт значение нарушения Божьего закона и сохраняет форму единственного числа, согласованную с собирательным существительным «народ».
- source_word: παρεβήσαν ταχὺ ἐκ τῆς ὁδοῦ
  choice: быстро уклонились с пути
  rationale: Естественная русская формулировка, сохраняющая образ отхода от предписанного пути.
- source_word: χωνευτά
  choice: литых идолов
  rationale: Субстантивированное прилагательное обозначает предметы, изготовленные литьём; контекст Исхода указывает на культовые изображения. В примечании сохранён более буквальный вариант.
theological_decisions:
- issue: Число при собирательном «народ» и последующий переход к множественному числу
  choice: «народ ... поступил»; затем «они ... уклонились ... сделали»
  alternative: 'Последовательно единственное число: «народ ... уклонился ... сделал»'
  rationale: В греческом сначала стоит единственное число ἠνόμησεν при ὁ λαός, а затем множественное παρεβήσαν и ἐποίησαν; перевод сохраняет этот значимый грамматический переход от народа как целого к его членам.
- issue: Определённость χωνευτά
  choice: «литых идолов»
  alternative: «литые изображения» или буквально «литые изделия»
  rationale: Контекст явно культовый, но род предметов во множественном числе не уточнён; поэтому не введено конкретное «тельцы», а более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены повтор имени «Моисей», формула «земля Египетская», образ пути и смена единственного числа на множественное в описании народа.
