base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/005.yaml
  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: ru
  text: О великая любовь! О непревзойдённое совершенство! Слуга дерзновенно обращается к своему Господу, просит прощения за множество или даже просит изгладить и себя вместе с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπης
  choice: любовь
  rationale: Прямой и естественный эквивалент, сохраняющий нравственно-богословскую силу восклицания.
- source_word: τελειότητος ἀνυπερβλήτου
  choice: непревзойдённое совершенство
  rationale: Передаёт значение высшей, никем не превзойдённой полноты добродетели без добавочного толкования.
- source_word: παρρησιάζεται
  choice: смело говорит
  rationale: Передаёт свободную, дерзновенную речь перед вышестоящим; современнее и понятнее, чем «дерзновенно обращается».
- source_word: θεράπων
  choice: слуга
  rationale: В данном противопоставлении Господину обозначает служителя; «слуга» ясно сохраняет асимметрию отношений.
- source_word: κύριον
  choice: Господином
  rationale: Сохраняет соотнесённость «слуга — господин»; прописная буква указывает на Бога в контексте.
- source_word: τῷ πλήθει
  choice: для всего народа
  rationale: Буквально «для множества»; по ближайшему контексту речь идёт о народе Израиля, поэтому естественный русский эквивалент — «весь народ».
- source_word: ἐξαλειφθῆναι
  choice: изгладить
  rationale: Сохраняет образ стирания имени из книги живых, заданный непосредственно предшествующей цитатой.
theological_decisions:
- issue: Характер ходатайства Моисея
  choice: «или даже просит изгладить и его вместе с ними»
  alternative: «и просит изгладить себя вместе с ними»
  rationale: 'Союз ἢ καί сохраняет риторическое усиление и альтернативную формулировку: Моисей просит простить народ, иначе — разделить его участь.'
- issue: Объект прощения
  choice: «для всего народа»
  alternative: «для множества»
  rationale: Контекст однозначно связывает τὸ πλῆθος с согрешившим народом, но перевод не уточняет природу или механизм прощения.
translation_notes:
  register: Современный литературный русский язык с торжественным риторическим строем. Сохранены два начальных восклицания и контраст между слугой и Господином; архаизмы сведены к уместному библейскому глаголу «изгладить».
