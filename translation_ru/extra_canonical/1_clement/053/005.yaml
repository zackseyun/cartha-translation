revisions:
- from: О великая любовь! О непревзойдённое совершенство! Слуга смело говорит со своим Господином, просит прощения для всего народа или даже просит изгладить и его вместе с ними.
  to: О великая любовь! О непревзойдённое совершенство! Слуга дерзновенно обращается к своему Господу, просит прощения за множество или даже просит изгладить и себя вместе с ними.
  rationale: 'Уточнены два места для более точной передачи греческого текста без изменения смысла: τῷ πλήθει передано без добавления «всего народа», а παρρησιάζεται — как дерзновенное обращение. Риторическая структура и намеренная альтернатива ἢ καί («или даже») сохранены.'
