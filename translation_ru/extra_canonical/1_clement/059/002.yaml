id: 1CLEM.59.2
reference: 1 Clement 59:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: ru
  text: Мы же будем невиновны в этом грехе и станем усердно просить, вознося молитву и моление, чтобы Создатель всего сохранил нерушимым исчисленное число Своих избранных во всём мире через Своего возлюбленного Служителя[a] Иисуса Христа, через Которого Он призвал нас из тьмы в свет, из неведения к познанию славы Своего имени,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возлюбленное Дитя Своё, Иисуса Христа».'
    reason: Греческое παῖς может означать как слугу или служителя, так и дитя; основной перевод отражает вероятный здесь язык пророчеств о Служителе Господа.
lexical_decisions:
- source_word: ἀθῷοι
  choice: невиновны
  rationale: Передаёт юридико-нравственный смысл отсутствия вины в названном грехе без архаического оттенка.
- source_word: ἐκτενῆ
  choice: усердно
  rationale: В сочетании с прошением выражает напряжённость и постоянство молитвы естественным современным русским языком.
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: установленное число
  rationale: Сохраняет мысль об определённом, уже исчисленном числе, избегая тяжеловесной тавтологии «исчисленное число».
- source_word: διαφυλάξῃ ἄθραυστον
  choice: сохранил нерушимым
  rationale: Передаёт усиленное значение охраны и буквальный образ целостности, не повреждённости.
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: Создатель всего
  rationale: Естественный и точный эквивалент обозначения Бога как Творца всей совокупности сущего.
- source_word: παῖς
  choice: Служитель
  rationale: В молитвенном, насыщенном языком Септуагинты контексте вероятна аллюзия на Служителя Господа; неоднозначность «слуга/служитель — дитя» отмечена в сноске.
- source_word: ἐπίγνωσις
  choice: познание
  rationale: Передаёт значение знания/познания без неоправданного усиления до «полного познания».
theological_decisions:
- issue: Значение παιδός применительно к Иисусу
  choice: Служителя
  alternative: Дитя / Сына
  rationale: Контекст раннехристианской литургической молитвы и ветхозаветный язык поддерживают смысл «Служитель», однако греческое слово действительно допускает значение «дитя», поэтому вариант сохранён в сноске.
- issue: Образ числа избранных
  choice: установленное число Своих избранных
  alternative: исчисленное число Своих избранных
  rationale: Формулировка сохраняет представление текста об определённом числе, не уточняя богословски, кем или каким образом оно было установлено.
- issue: Слава имени Бога
  choice: познанию славы Своего имени
  alternative: познанию Своего славного имени
  rationale: Сохранена греческая конструкция δόξης ὀνόματος, чтобы не устранять возможное различие между славой и именем.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-литургического регистра. Синтаксис слегка упрощён ради ясности, но сохранены длинное движение фразы, параллелизм «из тьмы в свет, из неведения к познанию» и завершающая запятая, поскольку предложение продолжается в следующем стихе.
