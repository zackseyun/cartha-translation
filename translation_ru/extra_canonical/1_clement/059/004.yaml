source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: ru
  text: Просим Тебя, Владыка, стать нашим помощником и защитником. Избавь тех из нас, кто в скорби; смилуйся над униженными; подними павших; явись нуждающимся; исцели слабых; верни заблудившихся из Твоего народа. Насыть голодных; освободи наших узников; подними больных; ободри павших духом. Пусть все народы познают, что Ты один — Бог, Иисус Мессия — Твой служитель[a], а мы — Твой народ и овцы Твоего пастбища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также означать «дитя».
    reason: Слово παῖς обозначает как слугу или служителя, так и ребёнка; контекст поддерживает значение «служитель», но не устраняет лексическую многозначность полностью.
lexical_decisions:
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт уважительное обращение к верховному Господину и сохраняет возвышенный молитвенный регистр.
- source_word: ἀντιλήμπτορα
  choice: защитником
  rationale: Обозначает того, кто вступается и оказывает поддержку; естественно сочетается с «помощником».
- source_word: τοὺς ταπεινούς
  choice: униженными
  rationale: Передаёт людей низкого, угнетённого положения, не сводя выражение к нравственной добродетели смирения.
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου
  choice: заблудившихся из Твоего народа
  rationale: Причастие обозначает людей, которые заблуждаются или сбились с пути; родительный оборот указывает на их принадлежность к Божьему народу.
- source_word: λύτρωσαι
  choice: освободи
  rationale: В контексте узников глагол означает избавление или выкуп с результатом освобождения; русский вариант звучит естественно и не требует уточнять способ.
- source_word: τοὺς ὀλιγοψυχούντας
  choice: павших духом
  rationale: Передаёт малодушие, уныние и утрату мужества современным понятным выражением.
- source_word: νομῆς
  choice: пастбища
  rationale: Сохраняет пастырский образ стада, находящего пропитание на Божьем пастбище.
theological_decisions:
- issue: Значение παῖς в выражении Ἰησοῦς Χριστὸς ὁ παῖς σου
  choice: Твой Служитель с примечанием
  alternative: Твоё Дитя / Твой Сын
  rationale: В молитвенном и библейском контексте слово естественно продолжает образ Божьего Служителя, но греческое παῖς допускает также родственное значение «дитя»; примечание сохраняет эту подлинную неоднозначность.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Передаёт титульное значение греческого Χριστός («Помазанник») и не превращает его без пояснения в привычную часть имени.
- issue: Формула о едином Боге и Иисусе Мессии
  choice: сохранена без гармонизирующих добавлений
  alternative: добавить поясняющие формулы о взаимоотношении Бога и Иисуса
  rationale: Исходный текст следует передать в его собственной формулировке, не разрешая богословское напряжение за автора.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным ритмом. Параллельные повелительные конструкции сохранены; архаизмы вроде «отрок», «болящие» и «малодушествующие» не использованы. Заглавные буквы в обращениях и мессианском титуле поддерживают традиционный русский религиозный регистр.
