  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: ru
  text: уповать на Твоё имя — Первоисточник всякого творения[a] — и, благодаря тому что Ты открыл очи сердца нашего, познать Тебя, единственного Всевышнего среди вышних, Святого, покоящегося среди святых; смиряющего надменность гордых, расстраивающего замыслы народов, возвышающего смиренных и смиряющего возвышенных, обогащающего и делающего бедными, умерщвляющего, животворящего и дающего жить; единственного Благодетеля духов и Бога всякой плоти; взирающего в бездны, наблюдателя за человеческими делами, помощника находящихся в опасности, Спасителя отчаявшихся, Создателя и Попечителя всякого духа; умножающего народы на земле и из всех их избирающего любящих Тебя через Иисуса Мессию, Твоего возлюбленного Слугу[b], через Которого Ты наставил, освятил и почтил нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Твоё имя, изначальное для всего творения». Греческое выражение может характеризовать имя как источник творения или как изначальное по отношению ко всему творению.'
    reason: lexical_ambiguity
  - marker: b
    text: Греческое слово может также означать «отрок» или «дитя».
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἀρχέγονον πάσης κτίσεως
  choice: начало всего творения
  rationale: Передаёт имя как первоисток или исходное начало творения, не вводя более узкого догматического толкования; синтаксическая неоднозначность отмечена в сноске.
- source_word: ὕψιστον ἐν ὑψίστοις
  choice: Всевышнего среди вышних
  rationale: Сохраняет превосходную степень и намеренно не уточняет, обозначает ли множественное ὑψίστοις вышние существа, области или высоты.
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  choice: Святого, покоящегося среди святых
  rationale: Субстантивирует единственное ἅγιον и сохраняет множественное ἁγίοις, как требует греческая грамматика.
- source_word: ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: умерщвляющего, животворящего и дающего жить
  rationale: Сохраняет все три параллельных греческих выражения, включая смысловое сближение двух последних, вместо устранения одного как якобы избыточного.
- source_word: ἐπίσκοπον
  choice: Блюстителя
  rationale: Передаёт значение надзора и попечения, избегая здесь более позднего институционального смысла слова «епископ».
- source_word: ἐκλεγόμενον
  choice: избирающего Себе
  rationale: Возвратное «Себе» естественно передаёт средний залог и смысл выбора людей для Бога.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  rationale: Передаёт Χριστός как титул «Мессия», а не как утратившее прозрачность имя.
- source_word: ἐπαίδευσας
  choice: наставил
  rationale: В молитвенном контексте выражает воспитание и обучение без излишне узкого оттенка наказания.
theological_decisions:
- issue: Отношение ἀρχέγονον к имени и творению
  choice: «имя Твоё — начало всего творения»
  alternative: «изначальное имя Твоё, принадлежащее всему творению»
  rationale: Основной текст следует наиболее вероятному пониманию имени как первоистока, а сноска сохраняет грамматически возможное качественное прочтение.
- issue: Значение παῖς применительно к Иисусу
  choice: «Слуга»
  alternative: «Сын» или «Отрок»
  rationale: В раннехристианской молитвенной речи и на фоне библейского языка παῖς часто обозначает Божьего служителя; при этом лексическая неоднозначность сохранена в сноске.
- issue: Тройная формула власти над жизнью и смертью
  choice: Сохранены три отдельных причастных выражения
  alternative: Объединить два последних как «дающего жизнь»
  rationale: Греческий текст явно содержит три координированных определения; их сближение не даёт оснований удалять одно из них.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного текста. Длинная цепь определений сохранена как риторическая особенность оригинала, но расчленена пунктуацией. Прописные буквы в титульных обозначениях Бога и Иисуса поддерживают ясность без внесения конфессионально специфической терминологии.
