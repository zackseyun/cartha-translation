    issue: «Не послушаются» и «вину» неточно передают ключевые слова.
    rationale: ἀπειθέω выражает неповиновение сказанному, а παράπτωμα — проступок или прегрешение. Формулировка «не послушаются ... навлекут на себя вину» ослабляет первое значение и заменяет второе близким, но не тождественным понятием.
