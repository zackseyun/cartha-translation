  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: ru
  text: Но если некоторые не подчинятся тому, что Он сказал через нас, пусть знают, что сами вовлекут себя в проступок и немалую опасность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: не послушаются
  rationale: Передаёт неповиновение сказанному и естественно сочетается в русском с родительным падежом.
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: того, что Он сказал через нас
  rationale: 'Сохраняет посредническую конструкцию: источник слов — Он, а говорящие служат проводниками.'
- source_word: παραπτώσει
  choice: вину
  rationale: В данном контексте обозначает проступок и виновность, в которую непослушные сами себя вовлекают.
- source_word: κινδύνῳ οὐ μικρῷ
  choice: немалую опасность
  rationale: Сохраняет греческий литотес и серьёзность предупреждения.
- source_word: ἑαυτοὺς ἐνδήσουσιν
  choice: сами навлекут на себя
  rationale: Естественно по-русски выражает добровольное вовлечение себя в тяжёлые последствия, не устраняя личной ответственности.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: «Он» с прописной буквы, то есть Бог
  alternative: «он» без уточнения референта
  rationale: Контекст 1 Климента 59 связывает произнесённое через авторов послания с Божьей волей; прописная буква ясно передаёт этот референт, не добавляя имени.
- issue: Характер предупреждения
  choice: «навлекут на себя вину и немалую опасность»
  alternative: «свяжут себя преступлением и немалой опасностью»
  rationale: Выбор сохраняет личную ответственность и серьёзность последствий, избегая неестественной буквальности русского выражения.
translation_notes:
  register: Современный литературный русский язык; тон торжественный и предостерегающий, но понятный широкому читателю. Синтаксис слегка упрощён ради ясности без устранения богословского утверждения о словах Бога, переданных через авторов.
