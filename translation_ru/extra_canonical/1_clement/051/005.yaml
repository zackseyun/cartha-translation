revisions:
- from: Фараон, его войско и все предводители Египта, колесницы и ехавшие на них, были погребены в Красном море и погибли не по какой иной причине, а потому, что их неразумные сердца ожесточились после того, как в земле Египетской через Моисея, служителя Божьего, совершились знамения и чудеса.
  to: Фараон, его войско и все предводители Египта — как колесницы, так и ехавшие на них — были потоплены в Красном море и погибли ни по какой иной причине, а потому, что их неразумные сердца ожесточились после того, как в земле Египта через Моисея, служителя Бога, совершились знамения и чудеса.
  rationale: Исправлены неточное «погребены» и нормативная форма отрицательного местоимения; перечисление сделано синтаксически прозрачным. Пассив «ожесточились» сохранён, чтобы не устранять неоднозначность греческого σκληρυνθῆναι.
  reviewer_model: gpt-5.6-terra
