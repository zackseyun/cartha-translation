source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: ru
  text: Фараон, его войско и все предводители Египта — как колесницы, так и ехавшие на них — были потоплены в Красном море и погибли ни по какой иной причине, а потому, что их неразумные сердца ожесточились после того, как в земле Египта через Моисея, служителя Бога, совершились знамения и чудеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἡγούμενοι Αἰγύπτου
  choice: предводители Египта
  rationale: Передаёт руководящее положение названных лиц, не сужая значение до конкретной государственной должности.
- source_word: οἱ ἀναβάται αὐτῶν
  choice: ехавшие на них
  rationale: Местоимение соотнесено с колесницами; естественная русская формулировка сохраняет смысл греческого выражения.
- source_word: ἐβυθίσθησαν εἰς θάλασσαν ἐρυθράν
  choice: были погребены в Красном море
  rationale: Передаёт пассивное «были погружены/затоплены» в естественной и контекстуально точной русской форме без излишне буквального «потоплены в море».
- source_word: ἀσυνέτους καρδίας
  choice: неразумные сердца
  rationale: Сохраняет библейскую антропологическую формулировку и значение отсутствия разумения, не усиливая его до нравственного осуждения словом «глупые».
- source_word: τοῦ θεράποντος τοῦ θεοῦ
  choice: служителя Божьего
  rationale: В данном почётном библейском обозначении Моисея «служитель» естественнее и стилистически достойнее, чем «слуга», при сохранении отношения служения Богу.
theological_decisions:
- issue: Субъект и характер ожесточения сердец
  choice: их неразумные сердца ожесточились
  alternative: Бог ожесточил их неразумные сердца
  rationale: Греческий пассив σκληρυνθῆναι не называет действующего лица. Перевод сохраняет эту неоднозначность и не вводит прямо божественное действие.
- issue: Причинная связь гибели с ожесточением
  choice: не по какой иной причине, а потому, что
  alternative: только потому, что
  rationale: Сохраняется подчёркнутая исключительность причины в конструкции οὐ διʼ ἄλλην... ἀλλὰ διά, без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис слегка упрощён для ясности, но последовательность перечисления и причинно-временная связь греческого текста сохранены.
