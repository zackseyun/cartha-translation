  yaml_path: translation/extra_canonical/1_clement/051/004.yaml
  text: For they went down alive into Hades, and death will shepherd them.
translation:
  language: ru
  text: Ибо они сошли живыми в ад, и смерть будет пасти их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: ад
  rationale: Передаёт греческое обозначение мира мёртвых в его традиционной библейской форме, не уточняя здесь окончательную участь умерших.
- source_word: ποιμανεῖ
  choice: будет пасти
  rationale: Сохраняет намеренно резкий пастырский образ греческого глагола, а не сводит его к более общему «будет править».
theological_decisions:
- issue: Значение ᾅδης
  choice: ад
  alternative: мир мёртвых / преисподняя
  rationale: Выбрана узнаваемая библейская лексема; при этом контекст не требует догматически отождествлять ᾅδης с местом окончательного наказания.
- issue: Образ смерти как пастуха
  choice: 'сохранить буквально: «смерть будет пасти их»'
  alternative: «смерть будет властвовать над ними»
  rationale: Буквальная метафора соответствует источнику и сохраняет его богословское и поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Синтаксис краткий и близкий к греческому; необычная метафора сохранена.
