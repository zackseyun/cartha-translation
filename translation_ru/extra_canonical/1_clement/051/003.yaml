source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: ru
  text: Ведь человеку лучше признаться в своих проступках, чем ожесточить своё сердце, как ожесточилось сердце восставших против Моисея, служителя Божьего; суд над ними стал явным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: признаться в своих проступках
  rationale: Естественно передаёт греческое сочетание с περὶ, сохраняя смысл открытого признания совершённых проступков.
- source_word: παραπτωμάτων
  choice: проступках
  rationale: Передаёт нарушения и провинности без неоправданного усиления до более узкого богословского термина.
- source_word: σκληρῦναι τὴν καρδίαν
  choice: ожесточить своё сердце
  rationale: Сохраняет библейскую метафору и возвратную соотнесённость притяжательного местоимения.
- source_word: στασιασάντων
  choice: восставших
  rationale: Передаёт активный мятеж или бунт против Моисея, а не просто несогласие.
- source_word: θεράποντα τοῦ θεοῦ
  choice: служителя Божьего
  rationale: Достоинственно и естественно обозначает Моисея как преданного служителя Бога; слово не сводится здесь к бытовому «слуге».
- source_word: κρίμα
  choice: осуждение
  rationale: В контексте мятежников обозначает вынесенный им неблагоприятный суд; формулировка сохраняет судебно-богословский оттенок.
- source_word: πρόδηλον ἐγενήθη
  choice: стало явным
  rationale: Прямо передаёт переход к очевидному, открыто обнаружившемуся результату.
theological_decisions:
- issue: 'Значение κρίμα: судебное решение, осуждение или наказание'
  choice: осуждение
  alternative: суд / приговор
  rationale: Контекст восстания против Моисея и явного последствия указывает на неблагоприятное Божье решение, однако перевод не уточняет конкретный вид кары.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, библейски узнаваемым регистром. Синтаксис сохраняет причинное начало, противопоставление и сопоставление оригинала; точка с запятой устраняет двусмысленную привязку заключительного относительного оборота.
