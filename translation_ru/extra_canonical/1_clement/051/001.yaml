source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: ru
  text: Итак, попросим, чтобы нам было прощено всё, в чём мы оступились и что совершили из-за каких-либо козней противника. А те, кто стали зачинщиками мятежа и раскола, тоже должны иметь в виду общую надежду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «общее надежды»; греческий оборот обычно понимается в значении «общая надежда».'
    reason: Сохраняет отмеченную неоднозначность субстантивированного τὸ κοινόν с родительным τῆς ἐλπίδος, но указывает наиболее вероятное идиоматическое значение.
lexical_decisions:
- source_word: παρεπέσαμεν
  choice: оступились
  rationale: Передаёт образ уклонения или впадения в проступок, сохраняя отличие от более общего ἐποιήσαμεν («совершили»).
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: из-за каких-либо козней противника
  rationale: 'Греческое выражение эллиптично: буквально речь идёт о чём-то принадлежащем противнику. «Козни» естественно восполняет подразумеваемое средство или действие, не уточняя его сверх контекста.'
- source_word: ἀρχηγοὶ
  choice: зачинщики
  rationale: В контексте мятежа и раскола слово означает тех, кто положил им начало и возглавил их; «зачинщики» естественно передаёт обе стороны значения.
- source_word: στάσεως καὶ διχοστασίας
  choice: мятежа и раскола
  rationale: Сохраняется различие между открытым возмущением или распрей (στάσις) и разделением общины (διχοστασία).
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  choice: о надежде, общей для всех нас
  rationale: Передаёт наиболее вероятное идиоматическое значение «общая надежда» ясным современным русским языком.
- source_word: σκοπεῖν
  choice: помнить о
  rationale: В данном увещевании означает принимать во внимание, держать перед глазами; русское «помнить о» звучит естественно и сохраняет практическую направленность.
theological_decisions:
- issue: К кому относится «общая надежда»
  choice: Надежда представлена как общая для всей общины, включая виновников разделения.
  alternative: «Общее благо нашей надежды» или «то общее, что заключено в надежде».
  rationale: Субстантивированное τὸ κοινόν с родительным τῆς ἐλπίδος естественнее понимать идиоматически как «общая надежда»; добавление «для всех нас» лишь раскрывает смысл κοινόν и не определяет содержание надежды.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещевания. Синтаксис сделан ясным для обычного читателя; эллиптичность греческого выражения о действиях противника и неоднозначность фразы об общей надежде отмечены без конфессионального истолкования.
