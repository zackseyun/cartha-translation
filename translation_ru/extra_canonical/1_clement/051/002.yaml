id: 1CLEM.51.2
reference: 1 Clement 51:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: ru
  text: Ибо те, кто ведёт себя со страхом и любовью, предпочитают сами подвергнуться жестокому обращению, нежели чтобы ему подверглись их ближние; более того, они скорее примут осуждение в свой адрес, чем в адрес единодушия, переданного нам должным и справедливым образом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιτευόμενοι
  choice: кто живёт
  rationale: Здесь глагол описывает образ жизни и поведение; буквальное «живёт как гражданин» в современном русском создало бы неуместный политический оттенок.
- source_word: αἰκίαις περιπίπτειν
  choice: подвергнуться жестокому обращению
  rationale: Передаёт попадание под оскорбительное, унизительное или жестокое обращение, не добавляя отсутствующей в греческом мысли, будто они сами причиняют его ближним.
- source_word: τοὺς πλησίον
  choice: их ближних
  rationale: 'В эллиптической сравнительной конструкции это винительный субъект подразумеваемого περιπίπτειν: они предпочитают, чтобы пострадали сами, а не ближние.'
- source_word: ὁμοφωνίας
  choice: единодушие
  rationale: Сохраняет идею общего согласия и согласованности, значимую в контексте призыва Климента к церковному миру.
- source_word: καλῶς καὶ δικαίως
  choice: должным и справедливым образом
  rationale: Наречия отнесены к παραδεδομένης и переданы как характеристика того, каким образом единодушие было вручено общине.
theological_decisions:
- issue: Смысл κατάγνωσιν φέρουσιν с родительным падежом
  choice: они скорее навлекут осуждение на самих себя, чем на единодушие
  alternative: они скорее осудят самих себя, чем единодушие
  rationale: Основной текст передаёт идиому как обращение осуждения против себя, сохраняя параллелизм родительных ἑαυτῶν и τῆς… ὁμοφωνίας. В сноске отмечена допустимая более активная передача «осудят».
translation_notes:
  register: Современный литературный русский с достойным увещательным тоном. Синтаксический эллипсис первой сравнительной конструкции раскрыт естественным оборотом «лишь бы… не выпало на долю», без приписывания действующим лицам насилия над ближними.
