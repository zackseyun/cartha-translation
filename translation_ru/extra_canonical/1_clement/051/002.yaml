revisions:
- from: Ведь те, кто живёт в страхе и любви, предпочитают сами подвергнуться жестокому обращению, лишь бы оно не выпало на долю их ближних; более того, они скорее навлекут осуждение на самих себя, чем на единодушие, которое было передано нам должным и справедливым образом.[a]
  to: Ибо те, кто ведёт себя со страхом и любовью, предпочитают сами подвергнуться жестокому обращению, нежели чтобы ему подверглись их ближние; более того, они скорее примут осуждение в свой адрес, чем в адрес единодушия, переданного нам должным и справедливым образом.
  rationale: Исправлен смысловой охват πολιτευόμενοι, упрощена первая сравнительная конструкция без добавления активного причинения вреда ближним и нейтрально передана направленность κατάγνωσιν φέρειν. Сноска удалена, поскольку предлагаемая ею активная альтернатива не требуется текстом и способна сузить смысл.
