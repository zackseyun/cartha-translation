review_pass:
  verdict: revise
  source_fidelity: 'Первая сравнительная конструкция в целом передана верно: речь о предпочтении самим претерпеть жестокое обращение, а не о причинении его ближним. Однако «живёт в страхе и любви» чрезмерно сужает πολιτευόμενοι до факта жизни; глагол относится к образу поведения. Во второй конструкции «навлекут осуждение на самих себя» приемлемо по смыслу, но сноска без достаточного основания представляет активное «осудят» как равнозначный вариант. Лучше передать направленность κατάγνωσις посредством нейтрального «осуждение в свой адрес / в адрес единодушия».'
  naturalness: «Лишь бы оно не выпало на долю их ближних» понятно, но анафорическое «оно» несколько тяжеловесно. Прямая сравнительная формула с повтором «подвергнуться» естественнее и точнее. «Единодушие» допустимо и сохраняет терминологическую связь с ὁμοφωνία.
  terminology: πολιτευόμενοι следует передать как «ведут себя» или «живут, руководствуясь», не внося политического значения. αἰκίαις — «жестокому обращению». Для κατάγνωσιν φέρειν выбран нейтральный оборот, не навязывающий, является ли акцент перенесением осуждения на себя или вынесением его против кого-либо.
  issues:
  - severity: medium
    issue: «кто живёт в страхе и любви» ослабляет значение πολιτευόμενοι
    rationale: Причастие описывает образ поведения, а не просто существование; «ведут себя» точнее и современно.
  - severity: medium
    issue: Сноска называет «осудят» допустимым равнозначным вариантом
    rationale: Такое прочтение делает действие явно активным, тогда как основной смысл идиомы и синтаксическая направленность допускают более нейтральную передачу. Сноска не нужна для сохранения смысла.
  - severity: low
    issue: Оборот «лишь бы оно не выпало на долю» тяжеловесен
    rationale: Повтор подразумеваемого действия яснее отражает эллиптическое περιπίπτειν.
