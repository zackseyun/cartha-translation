id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: ru
  text: Итак, и мы, призванные по Его воле во Христе Иисусе, оправдываемся не сами по себе и не благодаря собственной мудрости, разумению, благочестию или делам, которые мы совершили в святости сердца, но через веру, через которую Всемогущий Бог оправдал всех, кто был от века. Ему да будет слава во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ θελήματος αὐτοῦ
  choice: по Его воле
  rationale: Естественная русская передача основания и средства призвания без утяжелённого буквального «через Его волю».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: во Христе Иисусе
  rationale: Сохраняет устойчивую раннехристианскую формулу и принятое титульное значение Χριστός.
- source_word: δικαιούμεθα
  choice: оправдываемся
  rationale: Настоящее время и богословски значимая судебная лексика греческого глагола сохранены.
- source_word: δι’ ἑαυτῶν
  choice: сами по себе
  rationale: Передаёт отрицание человеческого самооснования естественным современным русским выражением.
- source_word: συνέσεως
  choice: разумению
  rationale: Отличает практическое понимание или рассудительность от σοφία, переданного как «мудрость».
- source_word: εὐσεβείας
  choice: благочестию
  rationale: Прямой и уместный для достоинства текста эквивалент религиозной преданности и благочестивой жизни.
- source_word: ἔργων ὧν κατειργασάμεθα
  choice: делам, которые мы совершили
  rationale: Сохраняет усиленное значение κατεργάζομαι и авторское указание на реально совершённые дела.
- source_word: ἐν ὁσιότητι καρδίας
  choice: в святости сердца
  rationale: Формально сохраняет образ и не подменяет ὁσιότης более узким понятием искренности.
- source_word: ἀπ’ αἰῶνος
  choice: от века
  rationale: Сохраняет широкую временную формулу оригинала и её некоторую неопределённость.
theological_decisions:
- issue: Основание оправдания
  choice: не сами по себе… но через веру
  alternative: не своими силами… но по вере
  rationale: Сохранена резкая антитеза оригинала и повтор предлога διά; перевод не уточняет сверх текста, является ли вера средством, основанием или иной категорией.
- issue: Временная характеристика Божьего оправдания
  choice: оправдывал всех от века
  alternative: оправдал всех, бывших от века
  rationale: Русское несовершенное прошедшее естественно выражает распространённое на всех прежних людей действие, не превращая аорист в утверждение об одном разовом событии; «от века» оставлено при группе «всех», как допускает греческий порядок.
- issue: Объём слова πάντας
  choice: всех
  alternative: всех верующих
  rationale: Не добавлено отсутствующее в греческом определение; связь с верой уже прямо выражена относительным оборотом.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Синтаксическая протяжённость и перечисление сохранены, но фраза остаётся доступной обычному читателю. Местоимение «Его» написано с прописной буквы по русской религиозно-издательской традиции.
