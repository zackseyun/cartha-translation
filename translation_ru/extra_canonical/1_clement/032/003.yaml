id: 1CLEM.32.3
reference: 1 Clement 32:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: ru
  text: Итак, все они были прославлены и возвеличены не благодаря самим себе, не благодаря своим делам или праведным поступкам, которые они совершили, но по Его воле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: были прославлены
  rationale: Передаёт пассивную форму и основное значение глагола δοξάζω без уточнения действующего лица.
- source_word: ἐμεγαλύνθησαν
  choice: были возвеличены
  rationale: «Возвеличены» естественно и достаточно близко передаёт пассивное значение μεγαλύνω в возвышенном, но современном регистре.
- source_word: δικαιοπραγίας
  choice: праведным поступкам
  rationale: Передаёт значение праведного поведения, проявленного в конкретных делах, и избегает тяжеловесного «праведноделания».
- source_word: διὰ τοῦ θελήματος αὐτοῦ
  choice: по Его воле
  rationale: В данном противопоставлении выражение указывает на волю Бога как основание их прославления; «по Его воле» звучит естественно по-русски.
theological_decisions:
- issue: 'Основание прославления: человеческие заслуги или Божья воля'
  choice: 'Сохранено прямое противопоставление: «не благодаря… но по Его воле»'
  alternative: «не через… но через Его волю»
  rationale: Выбранная формулировка ясно передаёт смысл διά в контексте, не добавляя объяснения о механизме спасения и не вводя конфессиональной терминологии.
- issue: К кому относится αὐτοῦ
  choice: Местоимение передано как «Его» с прописной буквы, то есть со ссылкой на Бога
  alternative: «его» со строчной буквы
  rationale: Контекст отрывка указывает на Божью волю; прописная буква соответствует принятому русскому религиозному оформлению, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «не благодаря» сохраняет риторическую структуру греческого текста, а формулировки остаются понятными широкому читателю.
