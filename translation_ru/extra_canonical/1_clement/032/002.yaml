id: 1CLEM.32.2
reference: 1 Clement 32:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: ru
  text: 'Ведь от него происходят священники и левиты — все служащие у Божьего жертвенника; от него происходит Господь Иисус по плоти; от него, по линии Иуды, происходят цари, правители и вожди. И остальные его колена[a] пользуются немалой славой, как и обещал Бог: «Потомство твоё будет подобно звёздам небесным».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «остальные его скипетры»; здесь «скипетры», вероятно, обозначают колена или родовые ветви.'
    reason: Греческое σκῆπτρα сохраняет образ жезлов власти; контекст позволяет понимать его как обозначение остальных колен, но метафорический смысл не вполне прозрачен.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: от него происходят
  rationale: Передаёт происхождение и сохраняет местоименную отсылку исходного текста, не подставляя имя подразумеваемого праотца.
- source_word: λειτουργοῦντες
  choice: служащие
  rationale: Естественно обозначает совершающих священное служение у жертвенника без избыточно специальной терминологии.
- source_word: θυσιαστηρίῳ
  choice: жертвенника
  rationale: Точно передаёт культовый алтарь, предназначенный для жертвоприношений.
- source_word: τὸ κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет традиционную и богословски значимую формулу о человеческом происхождении Иисуса, не разъясняя её сверх текста.
- source_word: κατὰ τὸν Ἰούδαν
  choice: через Иуду
  rationale: В данном перечислении выражает линию происхождения через Иуду яснее, чем буквальное и неестественное «согласно Иуде».
- source_word: σκῆπτρα
  choice: колена
  rationale: Во множественном числе здесь слово метонимически обозначает племенные подразделения Израиля; буквальное «скипетры» в современном русском затемнило бы смысл. Буквальный образ отмечен в сноске.
- source_word: οὐκ ἐν μικρᾷ δόξῃ
  choice: пользуются немалой славой
  rationale: Передаёт греческую литоту естественным русским выражением и сохраняет положительную оценку.
- source_word: σπέρμα
  choice: потомство
  rationale: В контексте обещания Аврааму означает совокупность его потомков; «семя» было бы более формальным, но менее естественным для обычного современного читателя.
theological_decisions:
- issue: Отсылка местоимения αὐτοῦ
  choice: Сохранено «от него»
  alternative: «от Авраама»
  rationale: Хотя контекст указывает на Авраама, сам стих использует местоимение; перевод не устраняет эту текстовую связность и не добавляет имени.
- issue: Значение формулы κατὰ σάρκα
  choice: «по плоти»
  alternative: «по человеческому происхождению»
  rationale: Более буквальная формула сохраняет богословское напряжение между человеческим происхождением Иисуса и иными возможными аспектами его личности, не истолковывая их.
- issue: Смысл σκῆπτρα
  choice: «колена» с пояснением буквального образа
  alternative: «скипетры»
  rationale: Контекст противопоставляет колено Иуды остальным родовым ветвям; смысловой перевод делает это понятным, а сноска сохраняет заметную метафору оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, церковно-историческим звучанием. Синтаксический параллелизм повторов «от него» сохранён; архаизмы сведены к понятным библейским терминам «левиты», «жертвенник» и «по плоти».
