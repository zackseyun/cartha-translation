lexical_decisions:
- source_word: καθ’ ἓν ἕκαστον
  choice: во всех подробностях
  rationale: Оборот означает последовательное, поэлементное рассмотрение; выбран естественный русский эквивалент, передающий тщательность рассмотрения без тяжеловесного «каждое по отдельности».
- source_word: ἐπιγνώσεται
  choice: осознает
  rationale: Глагол обозначает ясное распознавание или постижение; «осознает» естественно сочетается с последующим «величие».
- source_word: μεγαλεῖα
  choice: величие
  rationale: Форма множественного числа может обозначать величественные свойства или величие даров в совокупности; русское отвлечённое существительное звучит естественно и соответствует смыслу.
- source_word: δωρεῶν
  choice: даров
  rationale: Прямой и стилистически уместный эквивалент для безвозмездно данных благ.
- source_word: ὑπ’ αὐτοῦ δεδομένων
  choice: данных Им
  rationale: Сохранена пассивная конструкция и отсылка местоимения к Богу из контекста; прописная буква служит ясности русского текста, не добавляя имени, отсутствующего в греческом.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: «Им» — отсылка к Богу по контексту
  alternative: «им» без уточнения референта
  rationale: Ближайший контекст говорит о Божьих дарах; при этом перевод не подставляет прямо слово «Бог», сохраняя местоименную форму оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Условная конструкция ἐὰν τις передана прямо; относительное местоимение сохранено как «это», а καθ’ ἓν ἕκαστον — естественным русским оборотом.
