source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: ru
  text: 'Примите наш совет — и вам не придётся об этом сожалеть. Ибо жив Бог, жив Господь Иисус Мессия, жив Дух Святой, живы вера и надежда избранных[a]: тот, кто в смирении, с усердной кротостью, без сожаления исполняет данные Богом праведные установления и заповеди, будет внесён и причислен к числу спасаемых через Иисуса Мессию. Через Него Ему слава во веки веков. Аминь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте необычная клятвенная формула включает в число «живых» также «веру и надежду избранных»; подразумеваемый глагол — «живы».
    reason: Поясняет риторически необычное распространение глагола ζῇ («живёт») на «веру и надежду», не превращая их в относительное пояснение.
lexical_decisions:
- source_word: συμβουλή
  choice: совет
  rationale: Прямое и естественное соответствие в контексте пастырского увещания.
- source_word: ἀμεταμέλητα ὑμῖν
  choice: вам не придётся об этом сожалеть
  rationale: Передаёт безличную конструкцию естественным современным русским языком.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: с неизменным усердием и кротостью
  rationale: ἐκτενής указывает на напряжённость, постоянство или усердие, а ἐπιείκεια — на мягкость, снисходительность и кротость; формулировка сохраняет оба смысловых компонента без неестественного буквального сочетания.
- source_word: ἀμεταμελήτως
  choice: не отступая
  rationale: В контексте исполнения заповедей наречие обозначает действие без раскаяния или перемены решения; «не отступая» естественно выражает твёрдость, не смешивая его с обещанием отсутствия сожаления в первой фразе.
- source_word: δικαιώματα
  choice: праведные установления
  rationale: Сохраняет как нормативный смысл «установлений», так и связь слова с праведностью.
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: будет внесён и причислен
  rationale: Передаёт два близких образа — включение в ряд и зачисление/учёт — без их полного сведения к одному глаголу.
- source_word: τῶν σῳζομένων
  choice: спасаемых
  rationale: Причастие настоящего времени сохранено и не заменено завершённым «спасённых».
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт греческий титул его смысловым русским соответствием, сохраняя мессианское содержание.
theological_decisions:
- issue: Структура клятвенного заверения с «верой и надеждой избранных»
  choice: Сохранить «и вера и надежда избранных» как ещё один элемент формулы после упоминания Святого Духа
  alternative: 'Понимать как относительное пояснение: «которые суть вера и надежда избранных»'
  rationale: ἥ — артикль ἡ с частицей τε, а не относительное местоимение. Греческий текст риторически присоединяет веру и надежду избранных к перечислению живых свидетелей; необычность конструкции не следует устранять.
- issue: Кому относится слава в заключительной доксологии
  choice: «Через Него Богу слава»
  alternative: «Через Него Ему слава», с формально неоднозначным местоимением
  rationale: αὐτῷ естественно относится к Богу, а δι᾽ οὗ — к Иисусу Мессии; явное «Богу» делает русскую связь читаемой, не меняя богословской структуры доксологии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, раннехристианским регистром. Синтаксис клятвенной формулы сохранён настолько, насколько это возможно без неясности; архаизмы и конфессионально маркированная терминология избегаются.
