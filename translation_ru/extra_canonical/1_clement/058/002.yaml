    issue: «с неизменным усердием и кротостью»
    rationale: ἐκτενοῦς определяет ἐπιεικείας; исходник говорит не о двух качествах — усердии и кротости, — а о кротости, охарактеризованной как усердная/ревностная.
  - severity: medium
    issue: «не отступая» для ἀμεταμελήτως
    rationale: Это выражает стойкость, тогда как греческое слово прямо относится к отсутствию сожаления или раскаяния. Следует сохранить данный смысл.
  - severity: medium
    issue: «Через Него Богу слава»
    rationale: Явное «Богу» разрешает неоднозначность местоимения αὐτῷ, которой греческий текст формально не разрешает. В переводе безопаснее оставить «Ему».
