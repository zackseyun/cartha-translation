id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: ru
  text: Итак, покоримся Его всесвятому и славному имени, избегая прежде изречённых Премудростью угроз непокорным, чтобы нам обитать, уповая на святейшее имя Его величия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы нам поселиться, уповая на святейшее имя Его величия».'
    reason: κατασκηνόω может обозначать поселение или постоянное пребывание; πεποιθότες ἐπί передано без добавления невыраженного усиления как «уповая на».
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: покоримся
  rationale: Аористный конъюнктив в увещевательном значении передан естественным русским призывом; глагол сохраняет смысл добровольного подчинения.
- source_word: τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι
  choice: Его всесвятому и славному имени
  rationale: Сохранена метонимия «имя» как обозначение Божьей власти и личности; усилительное παν- передано словом «всесвятому».
- source_word: φυγόντες
  choice: избегая
  rationale: Причастие выражает сопутствующее действие и призыв удалиться от грозящей участи; деепричастная конструкция естественна по-русски.
- source_word: τὰς προειρημένας ... ἀπειλάς
  choice: прежде изречённых ... угроз
  rationale: Передаёт отсылку к уже приведённым выше предостережениям.
- source_word: διὰ τῆς σοφίας
  choice: Премудростью
  rationale: Контекст предшествующей цитаты предполагает персонифицированную Премудрость; творительный падеж естественно передаёт посредство διά.
- source_word: τοῖς ἀπειθοῦσιν
  choice: непокорным
  rationale: Слово ἀπειθέω сочетает непослушание и отказ повиноваться; «непокорным» сохраняет связь с призывом покориться.
- source_word: κατασκηνώσωμεν
  choice: нам обитать
  rationale: Сохранён образ поселения или пребывания; не добавлено отсутствующее в глаголе понятие безопасности.
- source_word: πεποιθότες ἐπὶ
  choice: уповая на
  rationale: Перфектное причастие с ἐπί выражает установившееся доверие, направленное на Божье имя.
- source_word: τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα
  choice: святейшее имя Его величия
  rationale: Сохранена необычная и богословски насыщенная генитивная конструкция без сведения её к более привычной формуле.
theological_decisions:
- issue: Персонификация σοφία
  choice: «Премудростью» с прописной буквы
  alternative: «мудростью»
  rationale: Автор отсылает к ранее говорящей Премудрости; прописная буква показывает персонификацию, не отождествляя её прямо с какой-либо ипостасью.
- issue: Выражение «имя Его величия»
  choice: сохранить буквально
  alternative: «Его величественное имя»
  rationale: Атрибутивный перевод был бы плавнее, но устранил бы возможное различие между «величием» и принадлежащим ему «именем».
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным церковно-библейским оттенком. Синтаксис источника умеренно разгружен; ключевые образы «имени», «Премудрости» и «обитания» сохранены.
