revisions:
- from: Милосердный и во всём благодетельный Отец исполнен нежной любви к боящимся Его и кротко, с благосклонностью, дарует Свои благодатные дары тем, кто приходит к Нему с искренними помыслами.
  to: Милосердный и во всём благодетельный Отец питает нежные чувства к боящимся Его и мягко и приветливо дарует Свои милости тем, кто приходит к Нему с простодушием.
  rationale: Уточнены выражения, в которых русский черновик либо добавлял специальный богословский оттенок, либо ослаблял образ простого, нераздвоенного расположения ума. «Нежные чувства» передаёт образ σπλάγχνα без неестественного буквального образа и без усиления до романтической «любви».
