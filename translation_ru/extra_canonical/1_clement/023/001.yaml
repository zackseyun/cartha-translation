source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: ru
  text: Милосердный и во всём благодетельный Отец питает нежные чувства к боящимся Его и мягко и приветливо дарует Свои милости тем, кто приходит к Нему с простодушием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων
  choice: Милосердный
  rationale: Передаёт сострадание и милость естественным и достойным русским словом.
- source_word: κατὰ πάντα καὶ εὐεργετικός
  choice: и во всём благодетельный
  rationale: Сохраняет всеохватность κατὰ πάντα и активное благотворение, выраженное εὐεργετικός.
- source_word: ἔχει σπλάγχνα ἐπί
  choice: исполнен нежной любви к
  rationale: Буквальный образ внутренностей в современном русском неестественен; выражение передаёт глубокую сердечную привязанность и сострадание.
- source_word: φοβουμένους αὐτόν
  choice: боящимся Его
  rationale: Сохраняет традиционную библейскую формулу и её смысловую ёмкость, не сводя φόβος только к почтению либо к страху.
- source_word: ἠπίως τε καὶ προσηνῶς
  choice: кротко, с благосклонностью
  rationale: Передаёт мягкость, доброжелательность и приветливость двух греческих наречий без тяжеловесного удвоения.
- source_word: τὰς χάριτας αὐτοῦ ἀποδίδοι
  choice: дарует Свои благодатные дары
  rationale: χάριτες здесь обозначает благодеяния или дары благодати; «дарует» естественно передаёт действие по контексту, хотя форма ἀποδίδοι текстуально необычна.
- source_word: ἁπλῇ διανοίᾳ
  choice: с искренними помыслами
  rationale: Передаёт цельность, простоту и отсутствие двойственности в расположении ума; множественное «помыслами» звучит по-русски естественно.
theological_decisions:
- issue: Смысл выражения «боящиеся Его»
  choice: Сохранена формула «боящимся Его».
  alternative: «почитающим Его» или «благоговеющим перед Ним»
  rationale: Греческое φοβέομαι допускает оттенки страха и благоговения; замена одним толкованием сузила бы исходную смысловую напряжённость.
- issue: Характер χάριτες
  choice: «благодатные дары»
  alternative: «милости», «благодеяния» или «дары»
  rationale: Выбор сохраняет связь χάρις с благодатью, но множественное число и слово «дары» указывают на конкретные благодеяния, не превращая выражение в строго систематический термин.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис сделан плавным и понятным; библейская формула «боящимся Его» сохранена. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозно-издательской практике.
