id: 1CLEM.23.5
reference: 1 Clement 23:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: ru
  text: 'Воистину, Его воля исполнится скоро и внезапно, о чём свидетельствует и Писание: «Скоро придёт и не замедлит» и «Внезапно придёт Господь в Свой храм, и Святой, Которого вы ожидаете».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: Воистину
  rationale: Передаёт усилительное значение выражения в dignified, но понятном современном русском регистре.
- source_word: τελειωθήσεται τὸ θέλημα αὐτοῦ
  choice: Его воля исполнится
  rationale: Естественно передаёт пассивную конструкцию со значением полного осуществления воли.
- source_word: ταχὺ καὶ ἐξαίφνης
  choice: скоро и внезапно
  rationale: 'Сохраняет оба наречия и их различие: близость по времени и неожиданность.'
- source_word: συνεπιμαρτυρούσης καὶ τῆς γραφῆς
  choice: о чём свидетельствует и Писание
  rationale: Передаёт сопутствующее подтверждающее свидетельство Писания без утяжеления русской фразы.
- source_word: ὁ ἅγιος
  choice: Святой
  rationale: Сохраняет субстантивированное наименование лица и его приложение к Господу.
- source_word: προσδοκᾶτε
  choice: ожидаете
  rationale: Нейтрально передаёт активное ожидание без добавления оттенка надежды, которого глагол сам по себе не требует.
theological_decisions:
- issue: Соотношение обозначений «Господь» и «Святой»
  choice: «Господь… — Святой, Которого вы ожидаете»
  alternative: «Господь… и Святой, Которого вы ожидаете»
  rationale: Греческое καί допускает присоединительное или пояснительное прочтение. Тире естественно передаёт вероятное приложение, не вводя отдельного второго приходящего лица; при этом титул «Святой» сохранён явно.
- issue: Референт местоимения в первой цитате
  choice: «Он придёт»
  alternative: «оно придёт» (о Божьем изволении или обещанном событии)
  rationale: Греческая форма ἥξει не выражает рода, поэтому референт формально неоднозначен. Контекст следующей цитаты естественно направляет к личному референту, но русский перевод неизбежно делает его явнее.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаизированной интонацией. Прописные буквы в местоимениях, относящихся к Богу, использованы как русская издательская конвенция благоговейного регистра; смысловых добавлений нет.
