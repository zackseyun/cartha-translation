  source_fidelity: 'Первая часть передана точно: ἐπ’ ἀληθείας, ταχὺ καὶ ἐξαίφνης и τελειωθήσεται τὸ θέλημα αὐτοῦ отражены без существенных потерь. Однако в двух цитатах проект чрезмерно конкретизирует синтаксически неоднозначные места: «Он придёт» вводит эксплицитного личного референта, отсутствующего в греческом, а тире перед «Святой» превращает καὶ ὁ ἅγιος в пояснительное приложение.'
