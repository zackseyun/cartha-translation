reference: 1 Clement 23:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: ru
  text: 'Да будет далеко от нас это место Писания[a], где сказано: «Несчастны двоедушные, сомневающиеся в душе и говорящие: „Мы слышали это ещё во времена наших отцов, и вот, мы стареем, а ничего из этого с нами не произошло“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это Писание».'
    reason: Указывает более формальное соответствие ἡ γραφὴ αὕτη и объясняет контекстуальный перевод «это место Писания».
lexical_decisions:
- source_word: πόρρω γενέσθω ἀφ’ ἡμῶν
  choice: Да будет далеко от нас
  rationale: Передаёт повелительно-пожелательную форму γενέσθω и сохраняет торжественную силу греческого выражения без неестественной русской инверсии.
- source_word: ἡ γραφὴ αὕτη
  choice: это место Писания
  rationale: По контексту речь идёт о приводимом далее изречении; «место Писания» естественно по-русски, тогда как буквальное «это Писание» может быть ошибочно понято как обозначение целой книги.
- source_word: Ταλαίπωροί
  choice: Несчастны
  rationale: Прямо передаёт состояние жалкости и бедственности, выраженное прилагательным ταλαίπωροι, не превращая фразу в формулу «горе».
- source_word: δίψυχοι
  choice: двоедушные
  rationale: Сохраняет образную структуру слова («с двумя душами») и его значение внутренней раздвоенности.
- source_word: οἱ διατάζοντες τῇ ψυχῇ
  choice: сомневающиеся в душе
  rationale: В данном изречении смысл требует внутреннего колебания; форма διατάζοντες в предоставленном OCR-тексте, вероятно, отражает искажение ожидаемого διστάζοντες. Перевод следует контекстуально ясному чтению, также засвидетельствованному консультационным английским слоем.
- source_word: καὶ ἰδοὺ, γηράσκομεν
  choice: но вот, мы стареем
  rationale: ἰδού передано как «вот», а настоящее γηράσκομεν — как продолжающийся процесс «мы стареем»; союз καί в контексте получает естественное противительное значение.
- source_word: οὐδὲν ἡμῖν τούτων συνέβηκεν
  choice: ничего из этого с нами не произошло
  rationale: Сохраняет отрицание, отнесение к перечисленным обещанным событиям и результативный оттенок перфекта συνέβηκεν.
theological_decisions:
- issue: Статус цитируемого изречения как «Писания»
  choice: Сохранено обозначение «место Писания» без попытки установить канонический источник.
  alternative: Назвать источник или заменить «Писание» на «изречение».
  rationale: Греческий текст прямо употребляет γραφή, но не идентифицирует цитату; перевод не должен разрешать эту историко-каноническую неопределённость.
- issue: Характер порицаемого состояния δίψυχοι
  choice: Сохранена внутренняя раздвоенность и сомнение.
  alternative: Истолковать как неверие, лицемерие или отступничество.
  rationale: Такие варианты добавили бы более узкое богословское толкование, отсутствующее в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием цитаты. Архаизмы сведены к прозрачной формуле «Да будет», уместной для пожелательно-повелительной конструкции; синтаксис остаётся понятным обычному читателю.
