source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: ru
  text: '«О неразумные, сравните себя с деревом. Возьмите виноградную лозу: сначала она сбрасывает листья, затем появляется побег, затем лист, затем цветок, а после этого появляются незрелая ягода и затем гроздь. Вы видите, что за короткое время плод дерева достигает зрелости».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἀνόητοι
  choice: О неразумные
  rationale: Сохраняет прямое обращение и укоризненный смысл без излишне резкого современного «глупцы».
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  choice: сравните себя с деревом
  rationale: Передаёт рефлексивную конструкцию и значение сопоставления; ξύλον здесь обозначает древесное растение, далее конкретизированное виноградной лозой.
- source_word: ἄμπελον
  choice: виноградную лозу
  rationale: Естественное и точное русское обозначение растения.
- source_word: φυλλορροεῖ
  choice: сбрасывает листья
  rationale: Передаёт опадание листвы идиоматичным русским выражением.
- source_word: ὄμφαξ
  choice: незрелая ягода
  rationale: Обозначает незрелый виноградный плод; «ягода» естественно сочетается с последующей «гроздью» и сохраняет различие стадий.
- source_word: σταφυλή
  choice: гроздь
  rationale: В данном описании развития лозы наиболее естественно означает сформировавшуюся виноградную гроздь.
- source_word: εἰς πέπειρον καταντᾷ
  choice: достигает зрелости
  rationale: Точно и естественно передаёт достижение плодом зрелого состояния.
theological_decisions: []
