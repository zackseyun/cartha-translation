  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: ru
  text: Поэтому не будем колебаться[a], и пусть наша душа не сомневается в Его превосходящих всё и славных дарах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будем двоедушными» или «не будем раздваиваться душой».'
    reason: Греческое διψυχῶμεν образно обозначает внутреннюю раздвоенность, нерешительность или сомнение; буквальная передача в основном тексте звучала бы менее естественно.
lexical_decisions:
- source_word: διψυχῶμεν
  choice: не будем колебаться в вере
  rationale: Буквально слово передаёт состояние «двоящейся души», то есть внутреннюю раздвоенность и неуверенность. Русское выражение сохраняет смысл сомнения, но не смешивает его полностью со следующим глаголом.
- source_word: ἐνδυλλιεσθω
  choice: не сомневается
  rationale: Форма, по-видимому, отражает текстуально или орфографически нестабильное ἰνδαλλέσθω/ἐνδαλλέσθω; в данном контексте речь идёт о сомнении относительно Божьих даров.
- source_word: ὑπερβαλλούσαις
  choice: превосходящих всё
  rationale: Передаёт усилительный смысл причастия — дары, превосходящие обычную меру, — естественным современным русским выражением.
- source_word: ἐνδόξοις δωρεαῖς
  choice: славных дарах
  rationale: «Славных» прямо передаёт ἐνδόξοις, а «дары» является ясным и традиционно уместным соответствием δωρεαῖς.
theological_decisions:
- issue: Отнесение местоимения αὐτοῦ
  choice: Его
  alternative: его
  rationale: По контексту речь идёт о Божьих дарах; прописная буква соответствует принятому русскому религиозному регистру, не добавляя нового богословского содержания.
- issue: Соотношение двух призывов против сомнения
  choice: 'Сохранены два близких, но не тождественных выражения: «колебаться в вере» и «душа не сомневается»'
  alternative: Передать оба выражения как внутреннюю раздвоенность
  rationale: Так сохраняется риторический параллелизм и вместе с тем специфический оттенок второго глагола — сомнение относительно Божьих даров.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным церковно-нравственным регистром. Единственное число «наша душа» сохранено вслед за греческим собирательным выражением.
