  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: ru
  text: 'Но он сам обвиняет себя[a], говоря: «Никто не чист от скверны, даже если жизнь его длится всего один день».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдвигает обвинение против самого себя».'
    reason: Сохраняет более формальную судебную окраску κατηγορεῖ как возможный вариант передачи.
lexical_decisions:
- source_word: ἑαυτοῦ κατηγορεῖ
  choice: обвиняет себя
  rationale: Прямо передаёт глагол κατηγορέω с возвратным местоимением в родительном падеже и естественно звучит по-русски.
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: чист от скверны
  rationale: Сохраняет образ чистоты и осквернения; «скверна» соответствует возвышенному, но понятному регистру текста.
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: даже если жизнь его длится всего один день
  rationale: Передаёт уступительное значение οὐδ’ ἄν и явно выражает подразумеваемую продолжительность жизни; «всего» естественно подчёркивает предельно малый срок.
theological_decisions:
- issue: Всеобщность человеческой нечистоты
  choice: «Никто не чист от скверны»
  alternative: «Нет никого чистого от скверны»
  rationale: Сохранено безусловное всеобщее утверждение исходного текста без богословского уточнения природы или происхождения этой нечистоты.
