source:
  edition: Funk 1901 (normalized OCR)
  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: ru
  text: 'Об Аврааме было дано великое свидетельство, и он был назван другом Бога. Пристально взирая на славу Бога, он смиренно говорит: «Я же — прах и пепел».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: получил великое свидетельство
  rationale: Сохраняет пассивно-свидетельственную семантику глагола и усиление наречием, не подменяя их более узким «был прославлен» или «получил одобрение».
- source_word: φίλος ... τοῦ θεοῦ
  choice: другом Бога
  rationale: Прямой и естественный эквивалент греческого выражения.
- source_word: ἀτενίζων
  choice: пристально взирая
  rationale: Передаёт сосредоточенность и направленность взгляда; «взирать» соответствует возвышенному, но понятному регистру контекста.
- source_word: ταπεινοφρονῶν
  choice: смиренно
  rationale: Естественно выражает образ действия и внутреннее смирение без тяжеловесного буквального оборота «мысля смиренно».
- source_word: γῆ καὶ σποδός
  choice: прах и пепел
  rationale: Устойчивое русское библейское выражение; «прах» контекстуально передаёт γῆ в цитате из Быт 18:27 лучше буквального «земля».
theological_decisions:
- issue: Значение ἐμαρτυρήθη μεγάλως
  choice: получил великое свидетельство
  alternative: был весьма одобрен / о нём было дано великое свидетельство
  rationale: Выбранная формулировка сохраняет неоднозначность относительно того, кем именно дано свидетельство, и не вводит лишнего толкования.
- issue: Временная форма λέγει
  choice: он ... говорит
  alternative: он ... сказал
  rationale: Сохранено историческое настоящее греческого текста, которое представляет цитируемые слова как непосредственно звучащие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксис разделён на два предложения для ясности; смысловая связь оригинала сохранена.
