source:
  edition: Funk 1901 (normalized OCR)
  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: ru
  text: Будем же подражать и тем, кто ходил в козьих и овечьих шкурах, возвещая пришествие Христа[b]. Мы говорим об Илии, Елисее и Иезекииле — пророках, а кроме них и о тех, кто получил одобрение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто получил доброе свидетельство».'
    reason: Сохраняет более буквальный вариант передачи μεμαρτυρημένους и его связь с лексикой свидетельства.
  - marker: b
    text: 'Или: «Мессии».'
    reason: Χριστός буквально означает «Помазанник» и соответствует титулу «Мессия», хотя в основном тексте сохранена обычная передача «Христос».
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: Будем же подражать
  rationale: Естественная для современного русского передача увещательного аориста со значением призыва; смысл «станем подражателями» сохранён без тяжеловесной кальки.
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν
  choice: ходил в козьих и овечьих шкурах
  rationale: Сохраняет конкретные образы греческого текста и вероятную перекличку с Евр 11:37; «ходил» здесь означает образ жизни и странствование.
- source_word: κηρύσσοντες
  choice: возвещая
  rationale: Передаёт публичное провозглашение и соответствует возвышенному, но понятному регистру.
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: пришествие Христа
  rationale: «Пришествие» точно передаёт ἔλευσις в религиозном контексте, а «Христос» непосредственно соответствует Χριστός и учитывает его закрепившееся титульно-именное употребление.
- source_word: τοὺς μεμαρτυρημένους
  choice: тех, кто удостоился одобрения
  rationale: 'Перфектное пассивное причастие в перекличке с Евр 11 имеет положительный смысл: эти люди получили доброе свидетельство, то есть были одобрены. Формулировка сохраняет пассивный оттенок, не уточняя прямо, кто именно дал одобрение.'
theological_decisions:
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: Греческий текст прямо употребляет Χριστός; перевод «Христос» не навязывает дополнительного истолкования ветхозаветного контекста, тогда как «Мессия» допустим как смысловой вариант.
- issue: Кем одобрены μεμαρτυρημένοι
  choice: Не называть прямо Бога субъектом одобрения
  alternative: те, кого одобрил Бог
  rationale: Контекст Евр 11 допускает понимание Божьего одобрения, однако в данной фразе деятель не назван; перевод сохраняет эту формальную неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис слегка упрощён ради ясности, но перечисление пророков, конкретность одежды и неоднозначность пассивного «удостоился одобрения» сохранены.
