  to: Будем же подражать и тем, кто ходил в козьих и овечьих шкурах, возвещая пришествие Христа[b]. Мы говорим об Илии, Елисее и Иезекииле — пророках, а кроме них и о тех, кто получил одобрение[a].
  rationale: Заменено только «удостоился одобрения» на «получил одобрение», чтобы не вносить оттенок заслуженности и при этом сохранить положительный смысл μεμαρτυρημένους, установленный контекстом и английской аудиторской формулировкой «have been commended». Сноски и их якоря сохранены.
