  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: ru
  text: 'Об Иове также написано следующее: «Иов же был праведен и непорочен, правдив, богобоязнен и воздерживался от всякого зла».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀληθινός
  choice: правдив
  rationale: В характеристике человека передаёт нравственную истинность и честность естественнее для современного русского языка, чем буквальное, но здесь неясное «истинен».
- source_word: θεοσεβής
  choice: богобоязнен
  rationale: Точно передаёт благоговейное почитание Бога и сохраняет привычный возвышенный библейский регистр.
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: воздерживался от всякого зла
  rationale: ἀπέχομαι с ἀπό означает держаться вдали, воздерживаться; перевод сохраняет значение длительной нравственной практики и не подменяет его глаголом «отвращаться».
- source_word: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται
  choice: И об Иове также написано
  rationale: Естественная русская передача вводной формулы, сохраняющая добавочный смысл καί и формулу цитирования οὕτως γέγραπται без тяжеловесной кальки.
