source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: ru
  text: 'Моисей был назван верным во всём Его доме, и через его служение Бог судил Египет, поражая египтян бедствиями и мучениями. Но даже он, хотя и был столь прославлен, не возгордился[a], а когда у куста ему была дана божественная весть, сказал: «Кто я такой, что Ты посылаешь меня? Ведь я слаб голосом и медлителен языком».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не стал превозноситься».'
    reason: Греческий глагол может обозначать как внутреннюю надменность, так и высокомерное превозношение себя.
lexical_decisions:
- source_word: πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: верным во всём Его доме
  rationale: Сохраняет библейскую формулу и связь с образом Божьего дома; прописная буква указывает на наиболее вероятного референта местоимения в цитатном контексте.
- source_word: διὰ τῆς ὑπηρεσίας αὐτοῦ
  choice: через его служение
  rationale: Передаёт посредническую роль Моисея и повторяемую в греческом конструкцию διά без излишнего уточнения характера служения.
- source_word: διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν
  choice: поражая египтян бедствиями и мучениями
  rationale: Естественно выражает орудийное значение διά и относит αὐτῶν к египтянам; μαστίγες здесь означает кары или бедствия, а αἰκίσματα — мучительные наказания.
- source_word: οὐκ ἐμεγαλοφρόνησεν
  choice: не возгордился
  rationale: Передаёт отрицательный смысл μεγαλοφρονέω — стать надменным, возомнить о себе; современное и ясное выражение.
- source_word: χρηματισμοῦ αὐτῷ δεδομένου
  choice: ему было дано Божье повеление
  rationale: В данном контексте χρηματισμός обозначает обращённое к Моисею божественное сообщение или повеление; вариант передаёт источник и побудительный характер речи.
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: слаб голосом и медлителен языком
  rationale: Сохраняет два отдельных греческих определения и их образность, не сводя оба к общему слову «косноязычен».
theological_decisions:
- issue: Референт местоимения αὐτοῦ в выражении «во всём Его доме»
  choice: Божий дом, обозначенный местоимением «Его»
  alternative: «во всём своём доме», то есть доме Моисея
  rationale: Фраза восходит к библейскому свидетельству о верности Моисея в Божьем доме; перевод «своём» в современном русском почти неизбежно отнёс бы дом к Моисею.
- issue: Характер χρηματισμός у куста
  choice: Божье повеление
  alternative: «откровение» или «божественная весть»
  rationale: Контекст последующего вопроса о послании Моисея поддерживает повелительный оттенок, однако перевод не уточняет форму явления сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Синтаксис слегка упрощён ради ясности, но сохранены противопоставление прославления и смирения Моисея, повторная инструментальная роль его служения и образные характеристики речи.
