  text: Noah proclaimed repentance, and those who obeyed were saved.
translation:
  language: ru
  text: Ной проповедовал покаяние, и те, кто послушался, были спасены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυξεν
  choice: проповедовал
  rationale: Глагол передаёт публичное провозглашение вести; «проповедовал» естественно звучит в данном религиозно-нравственном контексте.
- source_word: μετάνοιαν
  choice: покаяние
  rationale: Передаёт призыв к перемене ума и жизни, сохраняя устойчивое и понятное богословское значение слова.
- source_word: οἱ ὑπακούσαντες
  choice: те, кто послушался
  rationale: Причастие выражает отклик послушания на провозглашённую весть; форма единственного числа после «кто» соответствует современной русской норме.
- source_word: ἐσώθησαν
  choice: были спасены
  rationale: Сохраняет пассивную форму греческого текста и не уточняет прямо, кем было совершено спасение.
theological_decisions:
- issue: Связь послушания и спасения
  choice: «те, кто послушался, были спасены»
  alternative: «те, кто поверил ему, спаслись»
  rationale: Выбранный вариант точно сохраняет значение ὑπακούω как послушания и пассив ἐσώθησαν, не сводя отклик только к вере и не превращая пассив в возвратную форму.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически ясная фраза с достоинством раннехристианского наставления.
