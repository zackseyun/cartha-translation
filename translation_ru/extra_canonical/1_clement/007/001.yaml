  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: ru
  text: Это, возлюбленные, мы написали не только увещевая вас, но и напоминая самим себе, ведь мы находимся на одном и том же поприще, и нам предстоит одна и та же борьба.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νουθετοῦντες
  choice: наставить
  rationale: Передаёт увещательный и исправляющий смысл глагола без излишне резкого оттенка слова «вразумить».
- source_word: σκάμματι
  choice: поприще
  rationale: Слово буквально связано с выкопанной площадкой для состязаний; «поприще» естественно сохраняет образ арены и жизненного испытания.
- source_word: ἀγὼν
  choice: борьба
  rationale: Сохраняет широкий смысл состязания, усилия и противостояния, не сужая образ до спортивного соревнования.
- source_word: ἐπίκειται
  choice: предстоит
  rationale: Естественно выражает лежащую впереди и возложенную на участников борьбу.
theological_decisions:
- issue: Общность положения автора и адресатов
  choice: мы находимся на одном и том же поприще, и нам предстоит одна и та же борьба
  alternative: мы на одной арене, и над нами тяготеет одна и та же борьба
  rationale: Формулировка сохраняет взаимную солидарность автора и читателей, не вводя дополнительных представлений о характере испытания.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Обращение «возлюбленные» сохранено как естественный церковно-эпистолярный термин; синтаксис слегка упрощён ради ясности без утраты параллелизма оригинала.
