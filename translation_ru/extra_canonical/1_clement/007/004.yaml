source:
  edition: Funk 1901 (normalized OCR)
  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: ru
  text: Устремим взгляд на кровь Мессии и поймём, как драгоценна она для Его Бога и Отца[a], ведь, пролитая ради нашего спасения, она принесла всему миру благодать покаяния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Бога, Его Отца».'
    reason: Отмечает возможный способ по-русски связать θεῷ, πατρὶ и αὐτοῦ, не заменяя более точного основного прочтения.
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Устремим взгляд
  rationale: Передаёт настойчивое, сосредоточенное созерцание, выраженное глаголом ἀτενίζω, и естественно звучит по-русски.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Передаёт титул Χριστός как «Помазанник / Мессия» и соответствует принятой политике данного издания.
- source_word: τίμιον
  choice: драгоценна
  rationale: В контексте крови выражает высокую ценность и почёт перед Богом; «драгоценна» естественно сохраняет оба оттенка.
- source_word: μετανοίας χάριν
  choice: благодать покаяния
  rationale: Сохраняет явное χάρις («благодать») и зависимый родительный μετανοίας, не уточняя сверх текста, означает ли это благодать, ведущую к покаянию, или дарованную в связи с ним.
- source_word: διήνεγκεν
  choice: принесла
  rationale: Контекстуально передаёт результативное «доставила / принесла» для всего мира.
theological_decisions:
- issue: Отношение выражения τῷ θεῷ καὶ πατρὶ αὐτοῦ к Мессии
  choice: для Его Бога и Отца
  alternative: для Бога, Его Отца
  rationale: Единый артикль при согласованных существительных и αὐτοῦ естественно дают «Его Богу и Отцу». Основной текст сохраняет прямое утверждение греческого, а сноска отмечает возможную русскую формулировку.
- issue: Значение «благодати покаяния»
  choice: сохранить формулу без поясняющего расширения
  alternative: благодать, ведущую к покаянию
  rationale: Греческий родительный допускает смысловую широту; перевод не должен без необходимости разрешать её в пользу одной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Местоимение «Его» написано с прописной буквы для ясности отсылки к Мессии; синтаксис сохраняет образ крови как грамматического субъекта последующего действия.
