base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: ru
  text: Пройдём через все поколения и тщательно рассмотрим, что из поколения в поколение Владыка давал возможность покаяться тем, кто желал обратиться к Нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  choice: Пройдём через все поколения
  rationale: Сохраняет образ последовательного мысленного обзора поколений и побудительную форму первого лица множественного числа.
- source_word: καταμάθωμεν
  choice: внимательно увидим
  rationale: Передаёт усиленное значение глагола — тщательно рассмотреть и уяснить; по-русски в данном призыве звучит естественнее буквального «тщательно изучим».
- source_word: ἐν γενεᾷ καὶ γενεᾷ
  choice: из поколения в поколение
  rationale: Естественная русская формула, точно выражающая повторяемость во всяком поколении.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт титул δεσπότης с его оттенком верховной власти и сохраняет возвышенный религиозный регистр.
- source_word: μετανοίας τόπον ἔδωκεν
  choice: давал возможность покаяться
  rationale: Русская идиома передаёт смысл буквального «давал место покаянию» без неестественной кальки; несовершенный вид согласуется с повторением «из поколения в поколение».
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: тем, кто желал обратиться к Нему
  rationale: Сохраняет добровольность, выраженную βουλομένοις, и направление обращения к Богу; не добавляет отсутствующего в греческом явного значения «обратно».
theological_decisions:
- issue: Смысл ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: обратиться к Нему
  alternative: вернуться к Нему
  rationale: Греческий текст обозначает направленность обращения к Владыке, но сам по себе не требует добавлять идею возвращения в прежнее состояние.
- issue: Передача μετανοίας τόπον
  choice: возможность покаяться
  alternative: место для покаяния
  rationale: Выбрана смысловая русская формулировка, не уточняющая механизм или богословские условия покаяния сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Прописные буквы в «Владыка» и «Нему» используются как традиционное почтительное оформление божественного референта, не изменяя смысла оригинала.
