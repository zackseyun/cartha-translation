  text: καὶ ἴδωμεν, τί καλὸν καὶ τί τερπνὸν καὶ τί προσδεκτὸν τῷ ποιήσαντι ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/003.yaml
  text: And let us see what is good, and what is delightful, and what is acceptable to the one who made us.
translation:
  language: ru
  text: И посмотрим, что хорошо, что отрадно и что угодно Тому, Кто сотворил нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: посмотрим
  rationale: 'Передаёт побудительный конъюнктив первого лица множественного числа: приглашение вместе рассмотреть или увидеть.'
- source_word: καλόν
  choice: хорошо
  rationale: Нейтрально и естественно передаёт субстантивированное прилагательное среднего рода «то, что хорошо».
- source_word: τερπνόν
  choice: отрадно
  rationale: Сохраняет отдельное значение приятного, радующего и услаждающего, не смешивая его с προσδεκτόν.
- source_word: προσδεκτόν
  choice: угодно
  rationale: Естественно передаёт значение «приемлемо, благоприятно принято» применительно к Богу.
- source_word: τῷ ποιήσαντι ἡμᾶς
  choice: Тому, Кто сотворил нас
  rationale: Причастная конструкция передана естественным русским определительным оборотом; прописные буквы ясно отражают отнесённость к Богу, очевидную из контекста.
theological_decisions:
- issue: Отношение трёх характеристик к Творцу
  choice: Дательный τῷ ποιήσαντι ἡμᾶς непосредственно связан с «угодно», без распространения этой связи на все три характеристики.
  alternative: «что хорошо, отрадно и угодно в глазах Того, Кто сотворил нас»
  rationale: Греческий порядок наиболее непосредственно связывает дательный с προσδεκτόν; русский текст сохраняет эту синтаксическую возможность и не добавляет отсутствующее «в глазах».
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «что» сохраняет трёхчастную риторическую структуру греческого текста. Маркеры сносок не требуются.
