  source_fidelity: 'Основной смысл передан точно: καταστροφή — «гибель», μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν — «раскаявшись в своих грехах», ἐξιλάσαντο τὸν θεόν сохраняет Бога как прямой объект («умилостивили Бога»), а ἀλλότριοι τοῦ θεοῦ — «чужды Богу».'
