  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: ru
  text: Иона возвестил ниневитянам гибель; но они, раскаявшись в своих грехах, умилостивили Бога, обратившись к Нему с мольбами, и обрели спасение, хотя и были чужды Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστροφὴν
  choice: гибель
  rationale: В данном контексте означает предстоящее уничтожение Ниневии; «гибель» звучит естественно и сохраняет силу пророческой угрозы.
- source_word: μετανοήσαντες
  choice: раскаявшись
  rationale: Передаёт покаянную перемену в отношении к совершённым грехам и сохраняет обстоятельственное значение греческого причастия.
- source_word: ἐξιλάσαντο τὸν θεὸν
  choice: умилостивили Бога
  rationale: Глагол имеет Бога прямым дополнением и здесь означает, что ниневитяне своими мольбами отвратили Его гнев; такая передача точнее синтаксически, чем «совершили искупление перед Богом».
- source_word: ἱκετεύσαντες
  choice: мольбами
  rationale: Передаёт настойчивое просительное обращение к Богу и естественно выражает средство, посредством которого они умилостивили Его.
- source_word: ἔλαβον σωτηρίαν
  choice: обрели спасение
  rationale: Сохраняет религиозно значимое слово «спасение», не сужая его до одного лишь физического избавления.
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: чужды Богу
  rationale: Передаёт отчуждённость от Бога без добавления более конкретной конфессиональной или заветной интерпретации.
theological_decisions:
- issue: Значение ἐξιλάσαντο применительно к Богу
  choice: умилостивили Бога
  alternative: обрели примирение с Богом / совершили искупление перед Богом
  rationale: Прямое дополнение τὸν θεόν поддерживает значение «умилостивили Бога». Формулировка сохраняет богословское напряжение текста и не превращает действие ниневитян в техническое учение об искуплении.
- issue: Объём значения σωτηρία
  choice: спасение
  alternative: избавление
  rationale: '«Спасение» сохраняет широту исходного слова: непосредственное избавление от гибели присутствует в контексте, но авторская религиозная формулировка может иметь и более широкий оттенок.'
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис близок к греческому, но не тяжеловесен; стандартная русская форма имени — «Иона».
