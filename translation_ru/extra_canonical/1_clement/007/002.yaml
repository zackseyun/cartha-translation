source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: ru
  text: Итак, оставим пустые и тщетные заботы и обратимся к славному и досточтимому[a] правилу нашего предания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торжественному».'
    reason: 'Передаёт альтернативный оттенок греческого σεμνόν и сохраняет английский аудиторский след: “Or ‘solemn’”.'
lexical_decisions:
- source_word: διό
  choice: Итак
  rationale: Передаёт выводное значение союза естественно для современного русского литературного текста.
- source_word: κενὰς καὶ ματαίας φροντίδας
  choice: пустые и тщетные заботы
  rationale: Сохраняет оба близких определения и значение φροντίδες как забот, попечений или занимающих ум предметов.
- source_word: ἔλθωμεν ἐπί
  choice: обратимся к
  rationale: Буквальное «придём к» по-русски звучит неестественно; в контексте призыва обратиться к нормативному образцу эта формулировка передаёт смысл без лишнего истолкования.
- source_word: εὐκλεῆ καὶ σεμνόν
  choice: славному и досточтимому
  rationale: «Славный» передаёт εὐκλεής, а «досточтимый» — достоинство и почтение, выраженные σεμνός, не сводя его к одной лишь серьёзности или торжественности.
- source_word: κανόνα
  choice: правилу
  rationale: В данном контексте означает признанную норму или мерило; «правило» сохраняет образ нормативного ориентира и соответствует традиционному русскому употреблению.
- source_word: τῆς παραδόσεως ἡμῶν
  choice: нашего предания
  rationale: Прямо передаёт принадлежность παράδοσις общине автора и не уточняет без основания, идёт ли речь об устном учении, обычае или более широкой традиции.
theological_decisions:
- issue: Смысл «предания»
  choice: нашего предания
  alternative: переданного нам учения
  rationale: Греческое παράδοσις допускает более широкий смысл, чем сформулированное учение; буквальная формулировка сохраняет эту открытость и не вводит позднейших конфессиональных разграничений.
- issue: Нормативный оттенок κανών
  choice: правило
  alternative: канон
  rationale: «Канон» в современном русском может восприниматься как технический термин о составе Писания или церковном постановлении; «правило» яснее передаёт общий нормативный смысл данного места.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, достойным раннехристианского увещания тоном. Синтаксис сделан естественным для широкого читателя; ключевые парные определения и богословски значимая неопределённость слова «предание» сохранены.
