id: 1CLEM.10.3
reference: 1 Clement 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: ru
  text: «Уйди[a] из своей земли, от своих родных и из дома своего отца в землю, которую Я покажу тебе. Я сделаю тебя великим народом, благословлю тебя и возвеличу твоё имя, и ты будешь благословен. Я благословлю благословляющих тебя и прокляну проклинающих тебя, и в тебе благословятся все племена земли».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Оставь». Греческий глагол означает «уйти, удалиться».'
    reason: Уточняет лексический диапазон ἄπελθε и отмечает, что здесь не употреблён глагол с буквальным значением «выйти».
lexical_decisions:
- source_word: Ἄπελθε
  choice: Уйди
  rationale: Передаёт повелительную форму ἀπέρχομαι — «уйти, удалиться» — и сохраняет лексическое отличие текста Климента от традиционного греческого текста Быт. 12:1 с глаголом «выйти».
- source_word: συγγενείας
  choice: родных
  rationale: Естественное современное обозначение круга родственников; здесь речь не только о происхождении как абстрактном понятии.
- source_word: ποιήσω σε εἰς ἔθνος μέγα
  choice: сделаю тебя великим народом
  rationale: Близко передаёт образ исходного текста, не заменяя его поясняющим «произведу от тебя».
- source_word: μεγαλυνῶ τὸ ὄνομά σου
  choice: возвеличу твоё имя
  rationale: Сохраняет торжественный библейский образ и значение увеличения славы и известности имени.
- source_word: φυλαὶ τῆς γῆς
  choice: племена земли
  rationale: Формально и естественно передаёт φυλαί, не подменяя его более широким словом «народы».
theological_decisions:
- issue: Смысл выражения ἐν σοὶ в обещании благословения
  choice: в тебе
  alternative: через тебя
  rationale: 'Буквальный оборот сохраняет возможную смысловую широту: Авраам может пониматься и как носитель, и как посредник благословения; перевод не устраняет эту напряжённость.'
- issue: Образ превращения Авраама в народ
  choice: сделаю тебя великим народом
  alternative: произведу от тебя великий народ
  rationale: Исходный текст прямо говорит «сделаю тебя в/великим народом»; более разъясняющий вариант был бы естественнее, но сужал бы образ.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Местоимение «Я» написано с прописной буквы как прямая речь Бога; устаревшие формы и излишняя церковнославянская лексика не используются.
