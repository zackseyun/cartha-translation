  source_fidelity: 'Перевод точно передаёт последовательность и смысл греческого текста: Ἄπελθε передано как «Уйди», три исходных пункта сохранены, εἰς τὴν γῆν — «в землю», обещание о великом народе, благословении и возвеличивании имени передано без добавлений. «В тебе» корректно сохраняет широту ἐν σοὶ, а «все племена земли» соответствует πᾶσαι αἱ φυλαὶ τῆς γῆς. Английский audit trail также поддерживает выбор «Уйди» как передачу Ἄπελθε, а не более буквального для другого глагола «выйди».'
  naturalness: Текст звучит как современный литературный русский с уместной торжественностью прямой божественной речи. Синтаксическая параллельность фразы сохранена и читается естественно. «Благословен» и «возвеличу твоё имя» несколько возвышенны, но оправданны жанром и не являются архаизацией.
  terminology: «Родные» адекватно передаёт συγγένεια как круг родственников; «великий народ» — ἔθνος μέγα; «племена земли» сохраняет различие φυλαί и не подменяет его «народами». Прописное «Я» последовательно оформляет прямую речь Бога и не меняет смысла.
