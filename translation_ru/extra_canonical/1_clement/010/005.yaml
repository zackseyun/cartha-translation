  text: καὶ ποιήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς γῆς· εἰ δύναταί τις ἐξαριθμῆσαι τὴν ἄμμον τῆς γῆς, καὶ τὸ σπέρμα σου ἐξαριθμηθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: ru
  text: «И сделаю потомство твоё как песок земной; если кто сможет сосчитать песок земной, то и потомство твоё будет сосчитано»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Быт. 13:16.
    reason: Фраза представляет собой цитату из обетования Аврааму; ссылка помогает распознать источник.
lexical_decisions:
- source_word: σπέρμα
  choice: потомство
  rationale: В контексте обетования Аврааму слово означает его потомков; «потомство» естественно в современном русском и сохраняет собирательное значение греческого единственного числа.
- source_word: ἄμμον τῆς γῆς
  choice: песок земной
  rationale: Близко передаёт образ и повтор исходного текста, сохраняя возвышенное звучание цитаты.
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: сосчитать / будет сосчитано
  rationale: Сохранены общий корень, условная конструкция и переход от действительного залога к страдательному.
theological_decisions:
- issue: Собирательное значение σπέρμα
  choice: потомство в единственном числе
  alternative: потомки
  rationale: Так сохраняются грамматическая форма и возможная смысловая напряжённость слова σπέρμα без навязывания индивидуального или исключительно множественного толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Местоимение «твоё» поставлено после существительного, чтобы сохранить торжественный ритм цитаты без чрезмерной архаизации.
