  source_fidelity: Перевод точно передаёт греческий текст. «Когда он отделился от Лота» уместно отражает непереходное/среднее употребление пассивной формы διαχωρισθῆναι, не приписывая разделение внешнему действователю. Повеление ἴδε естественно передано как «посмотри», а σπέρματί — собирательным «потомству». Формула «навеки» адекватно передаёт ἕως αἰῶνος.
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя сдержанно библейский регистр. Конструкция «на север, юг, восток и к морю» понятна и воспроизводит намеренное различие исходного обозначения моря от трёх сторон света.
  terminology: Имя Лот, обозначение Бога и ключевые выражения переданы последовательно. «Потомству» не навязывает богословского истолкования буквального «семени».
