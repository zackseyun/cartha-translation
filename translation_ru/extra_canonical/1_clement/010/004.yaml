id: 1CLEM.10.4
reference: 1 Clement 10:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: ru
  text: 'И снова, когда он отделился от Лота, Бог сказал ему: «Подними глаза и посмотри с того места, где ты сейчас находишься, на север, юг, восток и к морю[a], потому что всю землю, которую ты видишь, Я отдам тебе и твоему потомству навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть на запад; буквально: «к морю».'
    reason: В библейской географической системе Средиземное море обозначает запад, однако основной текст сохраняет буквальный образ греческого оригинала.
lexical_decisions:
- source_word: διαχωρισθῆναι
  choice: отделился
  rationale: 'Пассивная форма здесь имеет непереходное, близкое к среднему значение: Авраам и Лот разошлись; перевод не подразумевает, что некая внешняя сила разделила их.'
- source_word: ἴδε
  choice: посмотри
  rationale: В сочетании с перечислением направлений это повеление обратить взгляд, а не просто констатация зрительного восприятия.
- source_word: θάλασσαν
  choice: к морю
  rationale: Сохранён буквальный образ греческого текста; в географическом контексте море обозначает запад.
- source_word: σπέρματί
  choice: потомству
  rationale: Естественно передаёт собирательное значение «семя, потомки» в современном русском языке, сохраняя грамматическое единственное число как коллективное понятие.
- source_word: ἕως αἰῶνος
  choice: навеки
  rationale: Кратко и точно передаёт формулу неограниченной длительности.
theological_decisions:
- issue: Значение σπέρμα в обещании
  choice: потомству
  alternative: семени
  rationale: «Потомству» понятно современному читателю и не ограничивает обещание одним непосредственным потомком; буквальная форма «семени» в данном месте звучит архаично и может быть понята неверно.
- issue: Формула ἕως αἰῶνος
  choice: навеки
  alternative: до века
  rationale: «Навеки» естественно передаёт продолжительность обещания, не вводя специального толкования природы или условий его исполнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис цитаты сохранён близким к греческому, но без неестественной кальки; обращение Бога передано с прописной буквы в местоимении «Я» согласно распространённой русской издательской традиции.
