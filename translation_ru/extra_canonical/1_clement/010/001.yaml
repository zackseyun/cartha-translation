  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: ru
  text: Авраам, названный другом, оказался верным, став послушным словам Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в том, что стал послушным словам Бога»; греческий оборот может также подчёркивать, что именно этим проявилась его верность.'
    reason: Сохраняет обстоятельственно-инструментальный диапазон конструкции ἐν τῷ ... γενέσθαι, не навязывая исключительно причинное толкование.
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  choice: названный другом
  rationale: Сохраняет определённое обозначение φίλος и значение προσαγορεύω — «называть, именовать» — без добавления отсутствующего в тексте уточнения «другом Бога».
- source_word: πιστὸς εὑρέθη
  choice: был признан верным
  rationale: Передаёт идиому «был найден верным» естественным современным русским языком, сохраняя смысл засвидетельствованной верности.
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: словам Бога
  rationale: Множественное ῥήματα обозначает Божьи слова или изречения; буквальное множественное число сохранено.
theological_decisions:
- issue: Связь послушания Авраама с признанием его верным
  choice: потому что стал послушен
  alternative: став послушным / в том, что стал послушен
  rationale: Конструкция ἐν τῷ с инфинитивом допускает причинно-обстоятельственный или инструментальный оттенок. Основной текст выражает естественную причинную связь, а сноска сохраняет близкую к форме оригинала альтернативу, не превращая фразу в утверждение о заслуге.
- issue: К кому относится обозначение «друг»
  choice: не добавлять «Бога»
  alternative: названный другом Бога
  rationale: В данном предложении дополнение при φίλος отсутствует; хотя библейская аллюзия ясна, перевод не должен восполнять её ценой устранения формальной недосказанности.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической формой. «Был признан верным» предпочтено буквальному и неестественному «был найден верным».
