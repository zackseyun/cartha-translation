source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: ru
  text: 'И снова он говорит: «Бог вывел Авраама и сказал ему: „Посмотри на небо и сосчитай звёзды, если сможешь их сосчитать. Столько будет у тебя потомков“. Авраам поверил Богу, и это было вменено ему в праведность».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вся речь после слов «он говорит» представляет собой единую цитату из Быт. 15:5–6.
    reason: Уточняет границы цитаты, которые могут быть неочевидны из-за вложенной прямой речи Бога.
lexical_decisions:
- source_word: Ἀνάβλεψον
  choice: Посмотри
  rationale: В контексте взгляда на небо естественно передаёт призыв поднять глаза и посмотреть, без ненужной буквальности.
- source_word: τὸ σπέρμα σου
  choice: у тебя потомков
  rationale: σπέρμα здесь имеет собирательное значение — потомство Авраама; такая формулировка естественна по-русски и сохраняет сравнение с множеством звёзд.
- source_word: ἐπίστευσεν ... τῷ θεῷ
  choice: поверил Богу
  rationale: Русское управление с дательным падежом точно и естественно передаёт греческую конструкцию.
- source_word: ἐλογίσθη αὐτῷ εἰς δικαιοσύνην
  choice: это было вменено ему в праведность
  rationale: Сохраняет безличную форму, местоименную отсылку и традиционно понятую юридико-оценочную силу λογίζομαι, не уточняя сверх текста действующее лицо.
theological_decisions:
- issue: Что именно было вменено Аврааму
  choice: Сохранено местоименное «это»
  alternative: «вера была вменена ему»
  rationale: Греческий текст использует безличное ἐλογίσθη без явного существительного «вера»; местоименная передача сохраняет эту формальную неопределённость.
- issue: Значение εἰς δικαιοσύνην
  choice: «в праведность»
  alternative: «как праведность»
  rationale: Формулировка сохраняет богословски значимую конструкцию исходного текста и не сводит её к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Вложенная речь оформлена русскими кавычками; «звёзды» дано с буквой ё для ясности.
