revisions:
- from: За веру и гостеприимство ему в старости был дарован сын, и, повинуясь, он принёс его в жертву Богу на одной из гор, которую Бог указал ему.[a]
  to: За веру и гостеприимство ему в старости был дарован сын, а благодаря послушанию он принёс его в жертву Богу на одной из гор, которые были ему указаны.[a]
  rationale: 'Исправлен относительный оборот и связанное с ним примечание: греческое ὧν относится к множественному «гор». Страдательная конструкция «были ему указаны» сохраняет подразумеваемого в оригинале деятеля, избегая неестественной или двусмысленной цепочки русских местоимений. Смысл, регистр и терминология сохранены.'
