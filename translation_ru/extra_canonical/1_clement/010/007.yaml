source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ πίστιν καὶ φιλοξενίαν ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ, καὶ διʼ ὑπακοῆς προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ πρὸς ἓν τῶν ὀρέων ὧν ἔδειξεν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: ru
  text: За веру и гостеприимство ему в старости был дарован сын, а благодаря послушанию он принёс его в жертву Богу на одной из гор, которые были ему указаны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на одной из гор, которые он указал ему»; в греческом тексте подлежащее глагола «указал» не названо.'
    reason: Примечание исправляет число относительного местоимения и отмечает невыраженное подлежащее, не навязывая его идентификацию в переводе.
lexical_decisions:
- source_word: διὰ πίστιν καὶ φιλοξενίαν
  choice: за веру и гостеприимство
  rationale: Предлог διά с винительным здесь выражает основание или причину дарования сына; формулировка сохраняет тесную связь обоих качеств с результатом.
- source_word: ἐν γήρᾳ
  choice: в старости
  rationale: Естественная и точная передача обстоятельства времени.
- source_word: διʼ ὑπακοῆς
  choice: повинуясь
  rationale: Деепричастная конструкция естественно передаёт образ действия и сохраняет смысл послушания, побудившего Авраама принести сына.
- source_word: προσήνεγκεν αὐτὸν θυσίαν
  choice: он принёс его в жертву
  rationale: Устойчивое русское выражение точно передаёт жертвенное приношение, не утверждая сверх текста, что жертвоприношение было завершено.
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: на одной из гор
  rationale: В контексте движения к месту жертвоприношения русское «на одной из гор» звучит естественно и передаёт предполагаемое место действия.
theological_decisions:
- issue: Кто указал Аврааму гору
  choice: 'явно назвать Бога субъектом: «которую Бог указал ему»'
  alternative: «которую он указал ему»
  rationale: В греческом подлежащее ἔδειξεν формально не выражено, но повествовательный контекст Бытия указывает на Бога. Явное существительное устраняет непреднамеренную русскую двусмысленность; примечание сохраняет формальную особенность оригинала.
- issue: Характер принесения Исаака в жертву
  choice: «принёс его в жертву»
  alternative: «вознамерился принести его в жертву»
  rationale: Текст прямо употребляет προσήνεγκεν и представляет действие как принесение; смягчение до намерения внесло бы толкование, отсутствующее в формулировке автора.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис сделан плавным для обычного читателя; терминология не привязана к конфессиональной традиции.
