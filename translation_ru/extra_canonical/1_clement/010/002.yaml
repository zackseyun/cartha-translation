  verdict: revise
  source_fidelity: Синтаксис, тройной параллелизм и целевая связь ὅπως ... κληρονομήσῃ переданы точно. Однако ἀσθενῆ означает прежде всего «слабый, немощный», а не прямо «немногочисленный»; количественное истолкование вносит сужение смысла.
  naturalness: Текст в целом естественен для современного литературного русского. «Ибо» в формуле введения прямой речи сохраняет более ровный книжно-повествовательный регистр, чем разговорное «Ведь».
  terminology: «Унаследовать» точно передаёт κληρονομήσῃ, а «обещания Бога» сохраняет множественное число ἐπαγγελίας и божественный генитив. «Незначительный род» естественно передаёт оценочную слабость ἀσθενῆ без неоправданного сведения её к численности.
  issues:
  - severity: medium
    issue: «немногочисленную родню» сужает значение ἀσθενῆ
    rationale: Греческое прилагательное означает «слабый/немощный» и не кодирует непосредственно малочисленность. В данном контексте оно может подразумевать незначительность, но перевод не должен превращать это в однозначное количественное утверждение.
  - severity: low
    issue: «Ведь» несколько снижает регистр вводной формулы
    rationale: γὰρ выражает объяснительное «ибо/ведь»; перед цитатой литературное «Ибо» лучше соответствует торжественному повествовательному тону.
