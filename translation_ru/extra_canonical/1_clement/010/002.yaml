source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος δὲ ὑπακοῇ ἐξῆλθεν ἐκ τῆς γῆς αὐτοῦ καὶ ἐκ τῆς συγγενείας αὐτοῦ καὶ ἐκ τοῦ οἴκου τοῦ πατρὸς αὐτοῦ, ὅπως γῆν ὀλίγην καὶ συγγένειαν ἀσθενῆ καὶ οἶκον μικρὸν καταλιπὼν κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ. λέγει γὰρ αὐτῷ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: ru
  text: 'И он, повинуясь, вышел из своей земли, от своих родных и из дома своего отца, чтобы, оставив малую землю, незначительный род и небольшой дом, унаследовать обещания Бога. Ибо Бог говорит ему:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: повинуясь
  rationale: Передаёт послушание как основание и образ действия; естественнее по-русски, чем буквальное «в послушании».
- source_word: συγγένεια / συγγένειαν
  choice: родные / родня
  rationale: В первом случае речь об оставленном круге родственников, во втором — о его немногочисленности; вариативность делает фразу естественной, сохраняя смысловой повтор.
- source_word: ἀσθενῆ
  choice: немногочисленную
  rationale: В данном противопоставлении малому началу и будущим обещаниям обозначает слабость рода из-за его незначительности; буквальное «слабую родню» по-русски двусмысленно и неестественно.
- source_word: κληρονομήσῃ
  choice: унаследовать
  rationale: Сохраняет наследственную образность греческого глагола.
- source_word: ἐπαγγελίας
  choice: обещания
  rationale: Современное и понятное соответствие множественному числу; не сужает выражение до одного конкретного обетования.
theological_decisions:
- issue: Подлежащее при λέγει
  choice: «Бог говорит ему»
  alternative: «говорит ему»
  rationale: Ближайшее упоминание τοῦ θεοῦ и вводимая далее божественная речь делают подразумеваемое подлежащее ясным; его экспликация устраняет неестественную для русского языка неопределённость, не добавляя конфессионального толкования.
- issue: Связь послушания и наследования обещаний
  choice: Сохранена целевая конструкция «чтобы… унаследовать»
  alternative: Причинная или результативная переформулировка
  rationale: ὅπως с сослагательным наклонением выражает цель; текстовую богословскую связь между уходом в послушании и наследованием обещаний не следует ни ослаблять, ни догматически уточнять.
translation_notes:
  register: Современный литературный русский с dignified narrative cadence. Тройной параллелизм исходного текста сохранён; архаизмы и тяжёлые кальки избегаются.
