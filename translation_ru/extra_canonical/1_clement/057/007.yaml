revisions:
- from: Ведь за то, что они поступали несправедливо с простодушными[a], они будут убиты, и испытание погубит нечестивых. Но тот, кто слушает меня, будет жить, с уверенностью надеясь, и пребывать в покое, не страшась никакого зла.
  to: Ибо за то, что они обижали простодушных[a], они будут убиты, и расследование погубит нечестивых. А тот, кто слушает меня, будет обитать, уверенно уповая, и спокойно пребывать, не боясь никакого зла.
  rationale: Исправлено «испытание» на «расследование» для передачи ἐξέτασμος как проверки или разбирательства. Слегка сглажен синтаксис и уточнён образ κατασκηνώσει («будет обитать»), без изменения смысла, регистра или богословских выводов. Сноска к νηπίους сохранена.
