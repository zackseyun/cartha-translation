source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: ru
  text: Ибо за то, что они обижали простодушных[a], они будут убиты, и расследование погубит нечестивых. А тот, кто слушает меня, будет обитать, уверенно уповая, и спокойно пребывать, не боясь никакого зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с невинными»; греческое слово может обозначать также неопытных, наивных или беззащитных людей.'
    reason: Сохраняется смысловая неоднозначность νηπίους между категорией простых/неопытных в литературе мудрости и контекстуальным оттенком невинности или уязвимости.
lexical_decisions:
- source_word: νηπίους
  choice: простодушными
  rationale: В контексте литературы мудрости слово обозначает неопытных, наивных или простых людей, а не обязательно нравственно безупречных «невинных». «Простодушные» сохраняет эту смысловую категорию и допускает оттенок уязвимости.
- source_word: ἐξέτασμος
  choice: испытание
  rationale: Слово может обозначать проверку, исследование или испытание. «Испытание» естественно звучит по-русски и сохраняет судебно-проверочный оттенок без чрезмерной конкретизации.
- source_word: κατασκηνώσει
  choice: будет жить
  rationale: Буквально глагол связан с размещением или обитанием; в данном контексте «будет жить» естественно передаёт устойчивое, безопасное пребывание.
- source_word: ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ
  choice: пребывать в покое, не страшась никакого зла
  rationale: Передаёт покой и отсутствие страха перед всяким злом, не утверждая однозначно полное отсутствие любых бедствий.
theological_decisions:
- issue: Значение νηπίους как нравственной или интеллектуальной характеристики
  choice: простодушными
  alternative: невинными / беззащитными
  rationale: В греческой традиции литературы мудрости νηπίοι часто представляют неопытных и неразумных. Перевод «невинными» мог бы необоснованно превратить эту характеристику в утверждение о нравственной безупречности; возможный оттенок уязвимости отмечен в сноске.
- issue: Характер обещанной безопасности
  choice: не страшась никакого зла
  alternative: будучи избавлен от всякого зла
  rationale: Греческий текст прямо говорит о бесстрашном покое; он не требует истолковывать обещание как абсолютное отсутствие всякого страдания.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет причинно-следственную структуру греческого текста, но избегает неестественных буквальных оборотов. Богословская неоднозначность не снимается молча.
