source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: ru
  text: Итак, вы, положившие начало мятежу[a], подчинитесь пресвитерам и примите вразумление, ведущее к покаянию, преклонив колени ваших сердец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распре».'
    reason: στάσις может обозначать как мятежное выступление, так и фракционную распрю или смуту внутри сообщества.
lexical_decisions:
- source_word: καταβολὴν
  choice: начало
  rationale: В сочетании ποιεῖν καταβολήν выражение означает заложить основание, положить начало; по-русски «положившие начало» естественно передаёт образ без тяжеловесности.
- source_word: στάσεως
  choice: мятежу
  rationale: В контексте 1 Климента слово обозначает виновное фракционное выступление и нарушение установленного порядка; «мятеж» сохраняет отрицательную и антиавторитетную окраску. Возможное значение «распря» отмечено в сноске.
- source_word: πρεσβυτέροις
  choice: пресвитерам
  rationale: Контекст послания указывает на общинных служителей, а не просто пожилых людей; традиционный термин понятен в церковном тексте и не уточняет сверх источника форму их служения.
- source_word: παιδεύθητε
  choice: примите вразумление
  rationale: Форма допускает дисциплинирование, наставление и исправительное воспитание; «примите вразумление» естественно выражает добровольное подчинение исправлению, не сводя смысл к наказанию.
- source_word: εἰς μετάνοιαν
  choice: ведущее к покаянию
  rationale: εἰς здесь выражает направленность или результат вразумления; формулировка сохраняет связь исправления с покаянием.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  choice: преклонив колени своих сердец
  rationale: Сохранена намеренная метафора внутреннего смирения; множественное «сердец» соответствует обращению ко многим адресатам.
theological_decisions:
- issue: Характер στάσις
  choice: мятеж
  alternative: распря / восстание
  rationale: «Мятеж» передаёт осуждаемое выступление против общинного порядка, но сноска сохраняет более широкий оттенок внутренней распри.
- issue: Смысл παιδεύθητε
  choice: примите вразумление
  alternative: подвергнитесь наказанию / будьте наставлены
  rationale: Греческое слово сочетает наставление, исправление и дисциплину; выбранный вариант не ограничивает его ни карательным, ни чисто учебным значением.
- issue: Образ колен сердца
  choice: сохранить буквально
  alternative: смиритесь всем сердцем
  rationale: Необычная метафора богословски и риторически значима, поэтому её не следует заменять истолкованием.
translation_notes:
  register: Современный литературный русский с достойным раннехристианского увещания звучанием. Синтаксис слегка возвышенный, но понятный; сохранены императивная сила обращения и образность оригинала.
