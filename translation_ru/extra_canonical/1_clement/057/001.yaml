  source_fidelity: В целом перевод точно передаёт синтаксис и увещевательный характер греческого текста. «Положившие начало» хорошо соответствует ποιήσαντες τὴν καταβολήν; «подчинитесь пресвитерам» точно передаёт ὑποτάγητε τοῖς πρεσβυτέροις; «примите вразумление, ведущее к покаянию» адекватно выражает παιδεύθητε εἰς μετάνοιαν. «Мятеж» допустим для στάσις в данном полемическом контексте, а сноска надлежащим образом сохраняет значение внутренней распри.
  naturalness: Требуется небольшая стилистико-грамматическая правка последнего образа. При обращении ко множеству «колени своих сердец» звучит неестественно; «колени ваших сердец» сохраняет намеренную метафору оригинала и естественнее по-русски.
