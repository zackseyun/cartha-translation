lexical_decisions:
- source_word: τοιγαροῦν
  choice: Поэтому
  rationale: Передаёт усиленное заключительное следствие естественным современным русским союзом.
- source_word: ἔδονται ... τοὺς καρπούς
  choice: будут есть плоды
  rationale: Сохраняет конкретную метафору греческого текста и её библейское звучание.
- source_word: τῆς ἑαυτῶν ὁδοῦ
  choice: собственного пути
  rationale: Сохраняет образ пути как образа избранного поведения; возвратное значение ἑαυτῶν передано словом «собственного».
- source_word: ἀσεβείας
  choice: нечестием
  rationale: Передаёт религиозно-нравственное значение ἀσέβεια без сужения до простого беззакония или неверия.
- source_word: πλησθήσονται
  choice: насытятся
  rationale: Сохраняет пищевую образность и параллелизм с «будут есть».
theological_decisions:
- issue: Образ воздаяния последствиями собственного пути и нечестия
  choice: Сохранена буквальная метафора еды и насыщения
  alternative: «Пожнут последствия своего пути и сполна испытают своё нечестие»
  rationale: Греческий текст изображает не просто абстрактные последствия, а насыщение плодами собственного поведения; перевод не уточняет сверх текста, является ли это прямым наказанием или внутренним следствием поступков.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной библейской образностью. Синтаксический параллелизм оригинала сохранён; примечания не требуются.
