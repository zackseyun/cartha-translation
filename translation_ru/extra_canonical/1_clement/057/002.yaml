  naturalness: Русский текст в целом литературный и ясный. Сочетание «надменное и гордое своеволие вашего языка» несколько тяжеловесно, но допустимо как сохранение намеренно резкого образа. «Считаться выдающимися» естественнее, чем «казаться возвышающимися над другими».
  terminology: «Христос» корректно передаёт Χριστός. Для ἐλλογίμους предпочтительно «причисленными к стаду» в контексте антитезы с изгнанием; примечание должно отметить возможное значение «признанными/почитаемыми».
