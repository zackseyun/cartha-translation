reference: 1 Clement 57:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: ru
  text: Научитесь подчиняться, отбросив надменное и гордое своеволие вашего языка. Ведь лучше вам оказаться малыми и причисленными к стаду Христа[a], чем, считаясь выдающимися, быть изгнанными из Его надежды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признанными» или «почитаемыми». Греческое слово может означать как «причисленные, принятые в число», так и «признанные, почитаемые».'
    reason: Лексическая неоднозначность ἐλλογίμους существенно влияет на смысл противопоставления.
  - marker: b
    text: 'Буквально: «быть изгнанными из Его надежды». Необычная конструкция допускает также понимание: «лишиться надежды на Него».'
    reason: Конструкция ἐκ τῆς ἐλπίδος αὐτοῦ неоднозначна; примечание сохраняет буквальный образ и отмечает возможное альтернативное понимание, не навязывая его основному тексту.
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: подчиняться
  rationale: Передаёт медиально-пассивный инфинитив как добровольное принятие подчинённого положения; в контексте церковного увещания естественнее и точнее, чем более узкое «повиноваться».
- source_word: τὴν ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν
  choice: надменное и гордое своеволие
  rationale: Сохраняет оба усилительных определения и основной оттенок αὐθάδεια — самовольную, дерзкую неуступчивость.
- source_word: τῆς γλώσσης ὑμῶν
  choice: вашего языка
  rationale: Сохраняет конкретный образ речи как средства проявления своеволия, не заменяя его общим понятием поведения.
- source_word: μικροὺς καὶ ἐλλογίμους
  choice: малыми, но принятыми
  rationale: μικρούς передано буквально, а ἐλλογίμους понято в контекстуальном смысле «причисленными, принятыми в число». Русское противительное «но» естественно выражает заложенный в сопоставлении парадокс, не меняя его содержания.
- source_word: καθ' ὑπεροχὴν δοκοῦντας
  choice: казаться возвышающимися над другими
  rationale: Передаёт как δοκεῖν — видимость, а не действительное превосходство, так и сравнительно-превосходный оттенок ὑπεροχή.
- source_word: ἐκβληθῆναι
  choice: быть изгнанными
  rationale: Сохраняет сильный образ удаления наружу, контрастирующий с пребыванием внутри стада.
theological_decisions:
- issue: Значение ἐλλογίμους и принадлежность к стаду
  choice: «принятыми в стадо» с примечанием об альтернативе
  alternative: «почитаемыми / признанными»
  rationale: Антитеза между нахождением внутри стада и изгнанием поддерживает значение причисленности, однако лексема допускает смысл уважения или признания, поэтому неоднозначность отмечена.
- issue: Передача Χριστός
  choice: «Христос»
  alternative: «Мессия»
  rationale: В данном позднеапостольском церковном контексте Χριστός выступает как закрепившееся именование/титул; «Мессия» неоправданно меняло бы социолингвистический регистр.
- issue: Значение ἐκ τῆς ἐλπίδος αὐτοῦ
  choice: «из надежды, которую Он даёт»
  alternative: буквально «из Его надежды»; также возможно «из надежды на Него»
  rationale: Греческая конструкция с родительным допускает разные отношения. Основной текст избегает неестественного русского «из Его надежды» и понимает надежду как даруемую Христом, а примечание сохраняет буквальную форму и альтернативное объектное прочтение.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис сделан ясным для обычного читателя; резкие образы «своеволия языка», стада и изгнания сохранены. Местоимение «Он» написано с прописной буквы согласно распространённой русской религиозной издательской норме.
