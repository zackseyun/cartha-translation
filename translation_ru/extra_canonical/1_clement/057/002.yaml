  to: Научитесь подчиняться, отбросив надменное и гордое своеволие вашего языка. Ведь лучше вам оказаться малыми и причисленными к стаду Христа[a], чем, считаясь выдающимися, быть изгнанными из Его надежды[b].
  rationale: Перевод исправлен только там, где основная строка вносила в текст интерпретацию «которую Он даёт». Буквальная формулировка «из Его надежды» намеренно сохраняет необычность и неоднозначность греческого выражения, а примечание даёт читателю необходимое пояснение. «Причисленными к стаду» точнее выражает контекстуальный смысл ἐλλογίμους и контраст с изгнанием; альтернативное значение отмечено в сноске.
