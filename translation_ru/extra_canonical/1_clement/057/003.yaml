revisions:
- from: 'Ибо так говорит Премудрость, исполненная всех добродетелей: «Вот, я изолью[a] для вас изречение из моего дыхания и научу вас моему слову».'
  to: 'Ибо так говорит Премудрость, исполненная всех добродетелей: «Вот, я изолью вам изречение, исходящее из моего дыхания, и научу вас моему слову».'
  rationale: Исправление касается только русской сочетаемости и синтаксической ясности. Оно сохраняет прямое обращение к адресатам, образ излияния, связь «изречения» с «дыханием» и лексическое различие между ῥῆσις и λόγος.
