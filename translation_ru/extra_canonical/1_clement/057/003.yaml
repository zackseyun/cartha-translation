  text: οὕτω γὰρ λέγει ἡ πανάρετος σοφία· Ἰδοὺ, προΐομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν, διδάξω δὲ ὑμᾶς τὸν ἐμὸν λόγον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: ru
  text: 'Ибо так говорит Премудрость, исполненная всех добродетелей: «Вот, я изолью вам изречение, исходящее из моего дыхания, и научу вас моему слову».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανάρετος
  choice: исполненная всех добродетелей
  rationale: Передаёт значение «обладающая всякой добродетелью» естественнее, чем искусственное «вседобродетельная», и сохраняет хвалебный характер определения.
- source_word: σοφία
  choice: Премудрость
  rationale: Заглавная буква и традиционное «Премудрость» уместно передают персонифицированную Мудрость в цитате из Притч 1:23.
- source_word: προΐομαι
  choice: изолью
  rationale: Глагол здесь описывает изведение или излияние речи; «изолью» сохраняет образ исходящего дыхания и соответствует контексту цитаты.
- source_word: ῥῆσιν
  choice: изречение
  rationale: Отличает ῥῆσις как произнесённое высказывание от следующего λόγος и сохраняет параллелизм.
- source_word: πνοῆς
  choice: дыхания
  rationale: Сохраняет буквальный образ дыхания и не заменяет его интерпретирующим «духом».
- source_word: λόγον
  choice: слову
  rationale: Прямо передаёт λόγος и сохраняет его отличие от ῥῆσις.
theological_decisions:
- issue: Персонификация Премудрости
  choice: Сохранить Премудрость как говорящий персонифицированный образ без дальнейшего отождествления
  alternative: Явно отождествить Премудрость с божественной Личностью
  rationale: Греческий текст персонифицирует σοφία, но сам стих не определяет это богословское отождествление; перевод не должен разрешать эту напряжённость за автора.
- issue: Значение πνοή
  choice: дыхание
  alternative: дух
  rationale: «Дыхание» непосредственно соответствует πνοή и сохраняет телесно-поэтический образ, не внося дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, афористическим строем. Формулировка сохраняет поэтическую образность греческой цитаты и различие между «изречением» (ῥῆσις) и «словом» (λόγος), не делая фразу чрезмерно архаичной.
