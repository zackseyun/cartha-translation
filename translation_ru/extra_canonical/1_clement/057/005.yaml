id: 1CLEM.57.5
reference: 1 Clement 57:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: ru
  text: 'И будет так: когда вы воззовёте ко мне, я не услышу вас; злые будут искать меня и не найдут. Ведь они возненавидели мудрость и не избрали страха Господня, не желали внимать моим советам, но насмехались над моими обличениями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ με
  choice: воззовёте ко мне
  rationale: Передаёт обращение с призывом о помощи; естественно звучит в современном литературном русском и сохраняет возвышенный регистр.
- source_word: οὐκ εἰσακούσομαι ὑμῶν
  choice: не услышу вас
  rationale: В контексте означает отказ внять призыву, а не физическую неспособность слышать; краткая формулировка сохраняет строгость оригинала.
- source_word: κακοὶ
  choice: злые
  rationale: Субстантивированное прилагательное обозначает нравственно злых людей; добавление слова «люди» возможно, но не требуется по-русски.
- source_word: τὸν ... φόβον τοῦ κυρίου
  choice: страха Господня
  rationale: Традиционное и понятное выражение для благоговейного страха перед Господом, без устранения смыслового напряжения слова φόβος.
- source_word: βουλαῖς
  choice: советам
  rationale: Передаёт наставления и решения персонифицированной Мудрости без более узкого значения «замыслы».
- source_word: ἐμυκτήριζον
  choice: насмехались над
  rationale: Глагол выражает презрительное осмеяние; эта формулировка естественна и точна в данном контексте.
- source_word: ἐλέγχους
  choice: обличениями
  rationale: Сохраняет значение исправляющих укоров, вскрывающих неправоту, и соответствует достоинству регистра.
theological_decisions:
- issue: Говорящий от первого лица
  choice: Сохранено первое лицо без поясняющей идентификации
  alternative: Явно назвать говорящего Мудростью или Богом
  rationale: Сам стих не называет говорящего; контекст источника связан с персонифицированной Мудростью, поэтому добавленная идентификация разрешила бы сохраняемую текстом неоднозначность.
- issue: Значение «страха Господня»
  choice: Сохранено буквальное богословское выражение
  alternative: Передать как «благоговение перед Господом»
  rationale: Вариант «благоговение» разъясняет лишь один аспект φόβος и ослабляет напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, библейски узнаваемым звучанием. Синтаксический параллелизм и резкие причинно-следственные переходы оригинала сохранены; архаизмы сведены к минимуму.
