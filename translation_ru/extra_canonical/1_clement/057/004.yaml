source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: ru
  text: Поскольку я звала, а вы не послушались, простирала к вам речь, а вы не внимали, но отвергали мои советы и не повиновались моим обличениям, то и я посмеюсь над вашей погибелью, возрадуюсь, когда придёт на вас гибель, когда внезапно постигнет вас смятение и крушение, подобное буре, обрушится на вас, или когда придут на вас скорбь и осада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλουν
  choice: я звала
  rationale: Говорит олицетворённая Премудрость; женский род естественно сохраняет контекст источника, хотя в данном отрывке подлежащее явно не названо.
- source_word: ἐξέτεινον λόγους
  choice: простирала к вам слова
  rationale: Сохранён необычный образ греческого текста и направленность обращения; более идиоматическое «обращалась к вам» скрыло бы его форму.
- source_word: ἀκύρους ἐποιεῖτε
  choice: отвергали
  rationale: В контексте это означает считать советы недействительными, сводить их на нет; «отвергали» передаёт смысл естественным современным русским языком.
- source_word: ἐλέγχοις
  choice: обличениям
  rationale: Слово обозначает исправляющее порицание или доказательное обличение, а не просто наказание.
- source_word: ἀπωλείᾳ / ὄλεθρος
  choice: погибелью / гибель
  rationale: Различены близкие греческие существительные без искусственного введения существенно разных значений.
- source_word: θόρυβος
  choice: смятение
  rationale: Передаёт внезапный тревожный переполох и беспорядок; «шум» здесь было бы слишком узко.
- source_word: καταστροφή
  choice: катастрофа
  rationale: Сохраняет значение полного ниспровержения и бедствия; современное русское слово уместно в образе внезапного крушения.
- source_word: πολιορκία
  choice: осада
  rationale: Прямое значение военной осады сохранено, а не обобщено до «бедствия».
theological_decisions:
- issue: Говорящий субъект и грамматический род
  choice: 'Женский род: «я звала», «простирала»'
  alternative: Мужской или безличный род по предполагаемому божественному говорящему
  rationale: Цитата восходит к речи олицетворённой Премудрости в Притчах; русский женский род сохраняет литературный образ и не подменяет его прямой речью Бога Отца.
- issue: Антропопатический образ смеха над погибелью
  choice: Сохранено прямое «посмеюсь» и «возрадуюсь»
  alternative: Смягчить как «не окажу помощи» или «торжествовать будет справедливость»
  rationale: Источник намеренно выражает суровый судебный образ; его нельзя богословски сглаживать.
- issue: Вариантная связь последней части
  choice: Сохранено «или когда»
  alternative: Согласовать как ещё одно однородное «и когда»
  rationale: Греческое ἢ ὅταν буквально вводит альтернативную либо вариантную формулировку; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством и ритмом пророческой речи. Синтаксис оставлен протяжённым, чтобы сохранить нарастание исходного периода, но разбит запятыми на ясно воспринимаемые смысловые звенья. Архаизмы сведены к умеренно возвышенным «внимать», «обличение», «возрадоваться».
