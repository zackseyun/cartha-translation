id: 1CLEM.36.3
reference: 1 Clement 36:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: ru
  text: 'Ибо написано так:


    «Он делает Своих ангелов ветрами,

    а Своих служителей — пламенем огня».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он делает Своих ангелов духами» (Пс 103:4 по нумерации Септуагинты; Пс 104:4 в ряде современных изданий).'
    reason: Сохраняет лексическую неоднозначность греческого πνεύματα и помогает распознать источник цитаты.
lexical_decisions:
- source_word: ἀγγέλους
  choice: ангелов
  rationale: Сохраняет обычное в данном контексте значение «ангелы», хотя греческое слово также может означать «вестники».
- source_word: πνεύματα
  choice: ветрами
  rationale: В цитируемом псалме слово обозначает ветры; при этом греческое πνεύματα допускает также перевод «духами», что отражено в сноске.
- source_word: λειτουργούς
  choice: служителей
  rationale: Передаёт тех, кто исполняет служение, без привнесения более узкого позднейшего литургического смысла.
- source_word: πυρὸς φλόγα
  choice: пламенем огня
  rationale: Формально и естественно воспроизводит образ и синтаксическую параллель греческого текста.
theological_decisions:
- issue: Значение πνεύματα в высказывании об ангелах
  choice: ветрами
  alternative: духами
  rationale: У слова есть реальная двусмысленность, однако контекст Пс 103:4 и параллель с природным образом «пламя огня» поддерживают перевод «ветрами»; альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Местоимение «Своих» написано с прописной буквы как традиционное уважительное обозначение Бога; поэтическая разбивка сохраняет параллелизм цитаты.
