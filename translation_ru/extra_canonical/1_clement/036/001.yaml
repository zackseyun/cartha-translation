source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: ru
  text: Вот путь, возлюбленные, на котором мы обрели наше спасение — Иисуса Христа,[a] Первосвященника наших приношений, Заступника и Помощника в нашей немощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Мессию».'
    reason: Сохраняет возможное титульное значение греческого Χριστόν, не делая его основным прочтением.
lexical_decisions:
- source_word: Αὕτη ἡ ὁδός
  choice: Вот тот путь
  rationale: Указательная конструкция передана естественно и торжественно; «тот» указывает на путь, названный в предшествующем контексте.
- source_word: ἐν ᾗ εὕρομεν
  choice: на котором мы обрели
  rationale: Для образа пути русское «на котором» естественнее буквального «в котором»; «обрели» сохраняет смысл обнаружения и приобретения спасения.
- source_word: τὸ σωτήριον ἡμῶν
  choice: наше спасение
  rationale: Субстантивированное σωτήριον обозначает спасение или средство спасения; приложение далее отождествляет его с Иисусом Христом.
- source_word: ἀρχιερέα τῶν προσφορῶν ἡμῶν
  choice: Первосвященника наших приношений
  rationale: 'Сохранены культовый образ и неоднозначная родительная связь: Христос представлен Первосвященником, относящимся к нашим приношениям.'
- source_word: προστάτην
  choice: Заступника
  rationale: Передаёт роль покровителя, защитника и представителя, не сужая её до физической защиты.
- source_word: βοηθὸν τῆς ἀσθενείας ἡμῶν
  choice: Помощника в нашей немощи
  rationale: Русская предложная конструкция естественно выражает помощь применительно к человеческой слабости; «немощь» сохраняет dignified biblical register.
theological_decisions:
- issue: Значение Χριστόν
  choice: Иисуса Христа
  alternative: Иисуса Мессию
  rationale: В сочетании Ἰησοῦν Χριστόν без артикля у Климента Χριστός естественно функционирует как устойчивый титул или часть имени; основной текст не усиливает явно мессианское пояснение.
- issue: Отождествление спасения со Христом
  choice: 'Сохранено приложение после тире: «наше спасение — Иисуса Христа»'
  alternative: «путь к спасению через Иисуса Христа»
  rationale: Греческий текст грамматически ставит Ἰησοῦν Χριστόν в приложение к τὸ σωτήριον ἡμῶν; альтернативная формулировка ослабила бы прямое отождествление.
- issue: Роль Христа по отношению к приношениям
  choice: «Первосвященника наших приношений»
  alternative: «Первосвященника, приносящего наши дары»
  rationale: Исходный родительный оборот не уточняет конкретное действие; перевод сохраняет его богословскую и синтаксическую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской лексикой. Прописные буквы в обозначениях служения Христа поддерживают привычный русский религиозный регистр, не добавляя нового содержания.
