  source_fidelity: «Порочные» передаёт отрицательную нравственную оценку, но для φαῦλοι несколько сужает значение до порочности/развращённости. В данном контексте более нейтральное и широкое «злые» точнее сохраняет характеристику морально дурных людей. «Противящиеся его воле» верно передаёт ἀντιτασσόμενοι τῷ θελήματι αὐτοῦ и связь двух характеристик, объединённых одним артиклем.
