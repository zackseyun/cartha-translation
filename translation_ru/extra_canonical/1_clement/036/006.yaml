  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: ru
  text: Кто же враги? Злые и противящиеся его воле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: порочные
  rationale: В данном нравственном контексте слово обозначает морально дурных людей; «порочные» естественно и достойно передаёт смысл, не усиливая его до «гнусные».
- source_word: ἀντιτασσόμενοι
  choice: противящиеся
  rationale: Причастие передаёт активное сопротивление или противостояние; «противящиеся» сохраняет эту силу и хорошо сочетается с дательным «его воле».
- source_word: τῷ θελήματι αὐτοῦ
  choice: его воле
  rationale: Прямое и естественное соответствие греческому обороту; местоименная отсылка сохранена без уточнения, отсутствующего в данном стихе.
theological_decisions:
- issue: Соотношение двух характеристик врагов
  choice: «Порочные и противящиеся его воле» как две связанные характеристики одной группы
  alternative: «Порочные, а также те, кто противится его воле» как две отдельные группы
  rationale: Один артикль οἱ охватывает оба определения, поэтому естественнее представить их как связанные обозначения врагов, не утверждая при этом жёстко, что второе является исчерпывающим пояснением первого.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, риторическая и достойная. Заглавная буква в местоимении не используется, поскольку она отсутствует как различение в греческом тексте и не нужна для ясности.
