- from: Через Него мы устремляем взор к небесным высотам; через Него мы, словно в зеркале, созерцаем Его непорочный и превознесённый лик[a]; через Него открылись очи нашего сердца; через Него наш неразумный и помрачённый ум расцветает навстречу свету; через Него Владыка пожелал дать нам вкусить бессмертного знания. Он, будучи сиянием Его величия, настолько превосходит ангелов, насколько превосходней имя, которое Он унаследовал.
