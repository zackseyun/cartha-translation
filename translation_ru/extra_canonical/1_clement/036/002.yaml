source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: ru
  text: Через Него мы устремляем взор к небесным высотам; через Него мы, словно в зеркале, созерцаем Его непорочный и высочайший лик[a]; через Него открылись очи нашего сердца; через Него наш неразумный и помрачённый ум распускается к свету; через Него Владыка пожелал, чтобы мы вкусили бессмертного знания. Он, будучи сиянием Его величия, тем более превосходит ангелов, чем более славное имя унаследовал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как созерцание в зеркале, так и отражение, подобное зеркальному.
    reason: Сохраняет реальную лексическую неоднозначность ἐνοπτριζόμεθα, которую невозможно полностью воспроизвести одной естественной русской формулировкой.
lexical_decisions:
- source_word: διὰ τούτου
  choice: через Него
  rationale: Сохраняет повтор и христологическую направленность греческого текста; прописная буква помогает естественно обозначить личный референт в русском религиозном регистре.
- source_word: ἀτενίζομεν
  choice: устремляем взор
  rationale: Передаёт напряжённое, пристальное смотрение, а не просто нейтральное «смотрим».
- source_word: ἐνοπτριζόμεθα
  choice: словно в зеркале, созерцаем
  rationale: Сохраняет зеркальный образ и медиальное значение глагола, не сводя его безоговорочно ни к простому видению, ни к отражению.
- source_word: ὄψιν
  choice: лик
  rationale: В данном возвышенном контексте естественно передаёт видимое явление или лицо Бога, сохраняя достоинство стиля.
- source_word: ἀναθάλλει εἰς τὸ φῶς
  choice: расцветает навстречу свету
  rationale: Сохраняет растительную метафору ἀναθάλλει и направленность εἰς τὸ φῶς, оставаясь понятным по-русски.
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт верховную власть и торжественный регистр слова точнее, чем бытовое «господин».
- source_word: γεύσασθαι ... γνώσεως
  choice: вкусить бессмертного знания
  rationale: Сохраняет метафору вкушения и родительный падеж объекта в греческом.
- source_word: ἀπαύγασμα
  choice: сияние
  rationale: Естественный и традиционно узнаваемый эквивалент образа исходящего блеска или сияния.
- source_word: διαφορώτερον
  choice: превосходней
  rationale: Передаёт сравнительную степень качественного превосходства имени.
theological_decisions:
- issue: Референт повторяющегося διὰ τούτου
  choice: Личный референт обозначен как «Него», без добавления имени или титула
  alternative: Явно вставить «через Христа» или «через Сына»
  rationale: Контекст указывает на Христа, однако стих сохраняет местоименную форму; добавление титула сняло бы формальную связь с источником.
- issue: Соотношение Христа и Бога в фразе ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ
  choice: «Он, будучи сиянием Его величия»
  alternative: «будучи сиянием Божьего величия»
  rationale: Местоимение оригинала сохранено, чтобы не заменять его толкующим существительным, хотя его референт в контексте понимается как Бог.
- issue: Значение ἐνοπτριζόμεθα
  choice: Созерцание словно в зеркале
  alternative: «отражаем» или «видим отражённым»
  rationale: Глагол допускает зеркальную семантику с оттенками созерцания или отражения; основной текст выбирает подходящее контексту созерцание, а примечание сохраняет неоднозначность.
- issue: «Бессмертное знание»
  choice: Сохранено определение знания как бессмертного
  alternative: «знание о бессмертии»
  rationale: Греческое ἀθανάτου непосредственно определяет γνώσεως; превращение его в объект знания было бы богословским уточнением сверх текста.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным церковно-библейским оттенком. Сохранён риторический повтор «через Него», образность оригинала и отзвук Евр 1:3–4 без искусственного выравнивания под конкретный русский библейский перевод.
