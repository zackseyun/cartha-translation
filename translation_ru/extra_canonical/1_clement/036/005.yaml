translation:
  language: ru
  text: 'И снова он говорит ему:


    «Сядь по правую руку от меня,


    пока я не сделаю твоих врагов


    подножием для твоих ног».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κάϑου
  choice: Сядь
  rationale: Прямой и естественный русский эквивалент повелительной формы со значением пребывания на почётном месте.
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Устойчивое, понятное и возвышенное выражение, передающее положение справа, а не направление движения.
- source_word: ἕως ἂν ϑῶ
  choice: пока Я не положу
  rationale: Сохраняет временную конструкцию и образное действие греческого текста, не разъясняя его богословски.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: подножием для ног Твоих
  rationale: Точно воспроизводит образ подножия и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Неуказанные лица в выражении λέγει πρὸς αὐτόν
  choice: Он говорит Ему
  alternative: он говорит ему
  rationale: Заглавные местоимения отражают очевидную в контексте христологическую отсылку, но перевод не добавляет отсутствующих в стихе имён и не устраняет формальную местоименную структуру.
