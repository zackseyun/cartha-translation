source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ οὕτως· εἶπεν ὁ δεσπότης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· αἴτησαι παρ’ ἐμοῦ, καὶ δώσω σοι ἔϑνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: ru
  text: 'А о Сыне Своём Владыка сказал так:


    «Ты — Мой Сын;

    сегодня Я родил Тебя.

    Проси у Меня, и Я дам Тебе народы в наследие

    и пределы земли во владение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт титул полновластного Господина и сохраняет его отличие от обычного κύριος; здесь это подлежащее при εἶπεν.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой современный эквивалент временного наречия; не заменяет его более архаичным «ныне».
- source_word: γεγέννηκά
  choice: родил
  rationale: Сохраняет прямой смысл совершенного глагола γεννάω и богословское напряжение цитаты, не поясняя природу рождения.
- source_word: ἔθνη
  choice: народы
  rationale: В контексте Псалма обозначает народы мира; нейтральнее и естественнее, чем «язычники».
- source_word: κατάσχεσις
  choice: владение
  rationale: Передаёт получаемое и удерживаемое владение, сохраняя параллелизм с «наследием».
- source_word: τὰ πέρατα τῆς γῆς
  choice: пределы земли
  rationale: Точно передаёт крайние пределы земного пространства и сохраняет возвышенный поэтический регистр.
theological_decisions:
- issue: Значение «сегодня Я родил Тебя»
  choice: Оставить формулировку без христологического пояснения
  alternative: Уточнить как вечное рождение, воскресение, воцарение или усыновление
  rationale: Греческий текст сам не разрешает богословскую многозначность цитаты; перевод не должен навязывать одну интерпретацию.
- issue: Принадлежность земли во второй строке дара
  choice: «пределы земли во владение» без добавленного притяжательного местоимения
  alternative: «пределы земли как Твоё владение»
  rationale: В греческом κατάσχεσίν σου содержит притяжательное местоимение, но естественная русская конструкция после «дам Тебе» уже ясно выражает принадлежность и избегает тяжеловесности.
translation_notes:
  register: Современный литературный русский с достоинством поэтической цитаты. Сохранены параллельные строки и обращение на «Ты»; местоимения, относящиеся к Сыну и Владыке, даны с прописной буквы как элемент принятого русского религиозного регистра, без добавления конфессионального толкования.
