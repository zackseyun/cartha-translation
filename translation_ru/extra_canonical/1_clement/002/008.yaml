source:
  edition: Funk 1901 (normalized OCR)
  text: σεβασμίῳ πολιτείᾳ κεκοσμημένοι πάντες ἐν φόβῳ αὐτοῦ ἐτελελεῖτε· τὰ προστάγματα καὶ τὰ δικαιώματα τοῦ κυρίου ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν ἐγέγραπτο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: ru
  text: Украшенные достойным почтения образом жизни, вы всё совершали в страхе перед Ним; повеления и праведные установления Господа были начертаны на скрижалях ваших сердец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «на широких поверхностях ваших сердец».'
    reason: Сноска сохраняет конкретный греческий образ πλάτη, тогда как основной текст использует естественную для русского библейскую метафору.
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  choice: достойным почтения образом жизни
  rationale: πολιτεία здесь обозначает образ жизни и поведение, а σεβάσμιος — то, что заслуживает почтения; формулировка сохраняет торжественный тон и остаётся понятной современному читателю.
- source_word: πάντα ἐτελεῖτε
  choice: вы всё совершали
  rationale: Перевод следует нормативному чтению текста, стоящему за очевидно искажённой OCR-формой πάντες ἐτελελεῖτε. τελέω передаёт исполнение или совершение всего должного.
- source_word: ἐν φόβῳ αὐτοῦ
  choice: в страхе перед Ним
  rationale: Сохраняется библейское понятие благоговейного страха без его сужения только до уважения или только до боязни.
- source_word: τὰ προστάγματα καὶ τὰ δικαιώματα
  choice: повеления и праведные установления
  rationale: Различие между предписаниями и нормативными требованиями сохранено; «праведные» передаёт смысл δικαιώματα, не превращая его просто в синоним «законов».
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν
  choice: на скрижалях ваших сердец
  rationale: Буквальный образ «широких поверхностей сердца» в русском неестественен. «Скрижали сердца» передают образ поверхности для письма и узнаваемую библейскую метафору; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Значение страха Божьего
  choice: страх перед Ним
  alternative: благоговение перед Ним
  rationale: Прямой перевод сохраняет смысловую широту φόβος и не устраняет напряжение между трепетом, почтением и страхом.
- issue: Характер δικαιώματα Господа
  choice: праведные установления
  alternative: требования Господа
  rationale: Выбранная формулировка сохраняет как нормативный, так и праведный характер слова, не сводя его к абстрактным требованиям.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным церковно-библейским звучанием. Синтаксис сохраняет параллельность и риторическую плотность оригинала без архаизмов.
