lexical_decisions:
- source_word: εἰλικρινεῖς
  choice: искренни
  rationale: Передаёт прямоту и неподдельность без излишне книжного оттенка.
- source_word: ἀκέραιοι
  choice: чистосердечны
  rationale: В данном ряду обозначает внутреннюю цельность, простоту и отсутствие лукавства; естественнее для современного русского, чем буквальное «неповреждённы».
- source_word: ἀμνησίκακοι
  choice: не держали зла
  rationale: Греческое слово означает незлопамятность, отказ помнить причинённое зло; глагольное выражение ясно и естественно по-русски.
- source_word: εἰς ἀλλήλους
  choice: друг на друга
  rationale: Естественное русское дополнение при выражении «держать зло», сохраняющее взаимный характер отношения.
