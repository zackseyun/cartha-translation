  footnotes:
  - marker: a
    text: Греческая форма указывает, что этот мир уже был дарован прежде и сохранялся как установившееся состояние.
    reason: Передать значение плюсквамперфекта ἐδέδοτο, не перегружая основной русский текст.
lexical_decisions:
- source_word: λιπαρά
  choice: изобильный
  rationale: В сочетании с «миром» слово обозначает полноту, богатство и благоденствие; буквальное «тучный» по-русски здесь неестественно.
- source_word: ἀκόρεστος πόθος εἰς ἀγαθοποιΐαν
  choice: неутолимое стремление делать добро
  rationale: Передаёт силу πόθος и направленность εἰς, сохраняя ясный деятельный смысл ἀγαθοποιΐα.
- source_word: πλήρης πνεύματος ἁγίου ἐπέχυσις
  choice: во всей полноте изливался Святой Дух
  rationale: Естественная русская формулировка сохраняет образ полного излияния и прямо называет Святого Духа.
theological_decisions:
- issue: Значение πνεύματος ἁγίου
  choice: Святой Дух
  alternative: святой дух
  rationale: В контексте «излияния» выражение естественно обозначает Святого Духа; при этом перевод не добавляет каких-либо конфессиональных уточнений.
- issue: Видо-временное значение ἐδέδοτο
  choice: был дарован
  alternative: даровался / был дан
  rationale: Греческий плюсквамперфект описывает мир как уже дарованный и установившийся к повествуемому моменту; русский литературный язык обычно передаёт это контекстом и формой прошедшего времени.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Однородные конструкции слегка перестроены ради естественности; конечная точка с запятой сохранена как знак продолжения мысли.
