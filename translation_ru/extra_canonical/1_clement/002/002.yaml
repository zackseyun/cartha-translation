revisions:
- from: Так всем был дарован глубокий и изобильный мир[a], возникло неутолимое стремление делать добро, и на всех во всей полноте изливался Святой Дух;
  to: Так всем был дарован глубокий и обильный мир[a] и неутолимое стремление к добрым делам, а на всех совершалось полное излияние Святого Духа;
  rationale: Устранено не имеющее опоры в оригинале «возникло»; желание делать добро вновь связано с уже дарованным состоянием. Образ полного излияния сохранён с тем же синтаксическим центром, что и в греческом. Сноска и её привязка остаются корректными, поскольку плюсквамперфектная форма грамматически относится к «миру».
