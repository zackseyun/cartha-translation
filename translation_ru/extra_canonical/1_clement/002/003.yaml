  terminology: «Вседержитель» — устойчивый и точный эквивалент παντοκράτωρ; «согрешили» и «смилостивиться» соответствуют религиозному регистру оригинала без конфессионально-специфических добавлений. Сноска об альтернативе «невольно» корректно отмечает возможный буквальный вариант, тогда как основной перевод предпочтительнее по контексту.
