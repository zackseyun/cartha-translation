id: 1CLEM.2.3
reference: 1 Clement 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: ru
  text: И, исполненные святого намерения, с добрым усердием и благоговейной уверенностью вы простирали руки к Богу Вседержителю, умоляя Его смилостивиться, если вы в чём-либо согрешили неумышленно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невольно».'
    reason: Отмечает допустимый более буквальный эквивалент ἄκοντες, тогда как основной текст яснее выражает отсутствие умысла.
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: святого намерения
  rationale: βουλή здесь обозначает внутреннее намерение или устремление; «намерение» естественно по-русски и сохраняет нравственный смысл, а ὁσίας передано как «святого».
- source_word: ἐν ἀγαθῇ προθυμίᾳ
  choice: с добрым усердием
  rationale: προθυμία выражает рвение, готовность и охотное усердие; данная формулировка сохраняет положительную характеристику ἀγαθῇ и звучит естественно.
- source_word: μετ’ εὐσεβοῦς πεποιθήσεως
  choice: с благоговейной уверенностью
  rationale: εὐσεβής указывает на почтительное благочестие перед Богом, а πεποίθησις — на уверенность или доверие; перевод сохраняет оба оттенка.
- source_word: ἐξετείνατε τὰς χεῖρας ὑμῶν
  choice: вы простирали руки
  rationale: Сохранён конкретный молитвенный жест исходного текста; несовершенный вид по-русски уместно описывает привычное или продолженное действие.
- source_word: πρὸς τὸν παντοκράτορα θεόν
  choice: к Богу Вседержителю
  rationale: «Вседержитель» — точный и укоренённый русский эквивалент παντοκράτωρ, обозначающего Бога как владыку всего.
- source_word: ἱκετεύοντες αὐτὸν ἵλεων γενέσθαι
  choice: умоляя Его смилостивиться
  rationale: ἱκετεύω передаёт настойчивую мольбу, а ἵλεων γενέσθαι — просьбу проявить милость; «смилостивиться» естественно передаёт событийный оттенок γενέσθαι.
- source_word: εἴ τι ἀκόντες ἡμάρτετε
  choice: если вы в чём-либо согрешили неумышленно
  rationale: ἄκοντες в контексте греха означает действие без умысла, по неведению или неосторожности, а не обязательно под принуждением.
theological_decisions:
- issue: Характер греха, обозначенный ἄκοντες
  choice: неумышленно
  alternative: невольно
  rationale: «Неумышленно» яснее обозначает грех без намерения и не создаёт впечатления, будто речь обязательно идёт о внешнем принуждении; возможный более буквальный вариант отмечен в сноске.
- issue: Значение ἵλεων γενέσθαι
  choice: смилостивиться
  alternative: быть милостивым
  rationale: Перевод не уточняет механизм прощения и сохраняет общую просьбу о Божьей милости, одновременно естественно передавая конструкцию с γενέσθαι.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис остаётся близким к греческому, но избегает неестественных калек; прописное «Его» соответствует принятому благоговейному издательскому регистру.
