  source_fidelity: 'Перевод точно передаёт синтаксическое движение и основные смысловые элементы греческого текста: μεστοί — «исполненные», ὁσίας βουλῆς — «святого намерения», προθυμία — «усердие», πεποίθησις — «уверенность», молитвенный жест ἐξετείνατε τὰς χεῖρας, обращение к παντοκράτωρ и просьбу ἵλεων γενέσθαι. «Неумышленно» верно отражает ἀκόντες в контексте согрешения, не сужая его до принуждения.'
