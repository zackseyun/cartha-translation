  verdict: approve
  source_fidelity: Текст точно передаёт греческий оригинал. «Скорбели о проступках ближних» соответствует ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενθεῖτε; «считали их недостатки своими» естественно передаёт τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε, не устраняя заложенный в выражении оттенок солидарного присвоения. «Вы делали добро и были готовы ко всякому доброму делу» адекватно восполняет в русском языке безглагольные именные характеристики ἀγαθοποιοί, ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν. Английская audit trail подтверждает такое понимание ἀγαθοποιοί как характеристики людей, делающих добро, а не требует иной догматической конкретизации.
  naturalness: Русская формулировка современна, литературна и хорошо читается. Прошедшее время последовательно выдержано в перечислении похвальных качеств. Повтор «добро / доброму» оправдан прямым повтором греческого ἀγαθο- и не выглядит стилистически тяжёлым.
  terminology: «Проступки», «ближние», «недостатки» и «доброе дело» уместны по регистру и не вносят конфессиональной интерпретации. Сноска корректно фиксирует альтернативное синтаксико-лексическое представление ἀγαθοποιοί; её формулировка не влияет на основной перевод.
