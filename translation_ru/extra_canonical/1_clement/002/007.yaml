  text: ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενϑεῖτε· τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε. ἀγαθοποιοί, ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: ru
  text: Вы скорбели о проступках ближних и считали их недостатки своими. Вы делали добро[a] и были готовы ко всякому доброму делу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы были благотворительны и готовы ко всякому доброму делу».'
    reason: Отмечает возможность понимать ἀγαθοποιοί как предикативное прилагательное или обозначение благотворителей, а не как отдельное глагольное действие.
lexical_decisions:
- source_word: παραπτώμασιν
  choice: проступках
  rationale: Передаёт нравственные прегрешения или отступления без чрезмерно узкого догматического оттенка.
- source_word: τῶν πλησίον
  choice: ближних
  rationale: Естественный и традиционно понятный русский эквивалент для субстантивированного πλησίον во множественном числе.
- source_word: τὰ ὑστερήματα
  choice: недостатки
  rationale: Сохраняет широкое значение нехваток, слабостей или несовершенств; контекст не требует конкретизации.
- source_word: ἴδια ἐκρίνετε
  choice: считали ... своими
  rationale: Естественно передаёт здесь значение ἐκρίνετε как оценки или признания, а ἴδια — как принадлежащих самим адресатам.
- source_word: ἀγαθοποιοί
  choice: делали добро
  rationale: Передаёт именительный предикативный компонент как характеристику поведения адресатов; в русском для законченного предложения восполнена связка в прошедшем времени.
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: были готовы ко всякому доброму делу
  rationale: Прямое и естественное соответствие греческому обороту, согласованное с прошедшим временем контекста.
theological_decisions:
- issue: Характер присвоения недостатков ближних
  choice: считали их недостатки своими
  alternative: судили об их недостатках как о собственных
  rationale: Выбранный вариант сохраняет этическую солидарность текста, не уточняя, идёт ли речь о сочувствии, ответственности или самоотождествлении.
- issue: Синтаксический статус ἀγαθοποιοί
  choice: Вы делали добро
  alternative: Благотворители / творящие добро
  rationale: Греческая фраза без связки допускает предикативное или описательное понимание. Русское законченное предложение требует естественного восполнения, но лексическое содержание не усиливается.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены параллелизм и повтор слова «добро/добрый» исходного текста; синтаксис слегка эксплицирован ради естественности русского предложения.
