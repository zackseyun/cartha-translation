  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: ru
  text: День и ночь вы вели борьбу за всё братство, чтобы число Его избранных было спасено с милостью и добросовестностью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «с милостью и совестью»; точная связь этих слов с глаголом «быть спасённым» не вполне ясна.'
    reason: Сочетание μετ’ ἐλέους καὶ συνειδήσεως необычно; «добросовестностью» передаёт его в естественном русском, а сноска сохраняет буквальную лексику и синтаксическую неопределённость.
lexical_decisions:
- source_word: ἀγών (восстанавливается по тексту издания; пропущено в приведённом нормализованном OCR)
  choice: вели борьбу
  rationale: Передаёт напряжённое старание и самоотдачу, выраженные словом ἀγών, не сводя их к простой «заботе».
- source_word: ὑπὲρ πάσης τῆς ἀδελφότητος
  choice: за всё братство
  rationale: Сохраняет собирательное значение ἀδελφότης и направленность усилий, выраженную ὑπέρ.
- source_word: τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ
  choice: число Его избранных
  rationale: Формально передаёт как собирательное «число», так и богословски значимое ἐκλεκτοί, не уточняя, кого именно обозначает местоимение.
- source_word: μετ’ ἐλέους καὶ συνειδήσεως
  choice: с милостью и чистой совестью
  rationale: «Милость» прямо передаёт ἔλεος; «чистая совесть» — естественное русское выражение для положительно понимаемой συνείδησις в данном контексте, при этом буквальная форма отмечена в сноске.
theological_decisions:
- issue: К кому относится αὐτοῦ («Его»)
  choice: Сохранено местоимение «Его» без явного названия референта
  alternative: «Божьих избранных» или «избранных Христа»
  rationale: Греческий текст не называет референта непосредственно; перевод не должен устранять эту неоднозначность.
- issue: Смысл сочетания μετ’ ἐλέους καὶ συνειδήσεως при пассиве σώζεσθαι
  choice: Сохранена связь «быть спасённым с милостью и чистой совестью»
  alternative: «чтобы вы милосердно и добросовестно содействовали спасению…»
  rationale: Альтернатива делает коринфян явными действующими лицами спасения и тем самым истолковывает синтаксис сильнее, чем позволяет греческий текст.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианского послания звучанием. «Вели борьбу» сохраняет интенсивность утраченного в OCR слова ἀγών; «братство» и «избранные» удерживают ключевую лексику оригинала.
