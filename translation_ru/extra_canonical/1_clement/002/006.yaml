lexical_decisions:
- source_word: πᾶσα στάσις
  choice: всякая распря
  rationale: στάσις здесь обозначает внутреннюю вражду, междоусобие или партийное противостояние; «распря» естественно передаёт этот смысл, не сужая его до открытого мятежа.
- source_word: πᾶν σχίσμα
  choice: всякий раскол
  rationale: σχίσμα прямо обозначает разделение или раскол; выбран привычный и точный русский эквивалент.
- source_word: βδέλυκτον
  choice: отвратительны
  rationale: 'Сохраняет сильную нравственную оценку греческого прилагательного: то, что вызывает отвращение и считается мерзким.'
- source_word: ἦν ὑμῖν
  choice: были вам
  rationale: 'Передаёт конструкцию с дательным лицом: распря и раскол воспринимались адресатами как отвратительные.'
