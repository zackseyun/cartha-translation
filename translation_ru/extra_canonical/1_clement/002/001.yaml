source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: ru
  text: И все вы были смиренны, ничем не хвалились, скорее подчинялись, чем подчиняли других, и находили больше радости в том, чтобы давать, чем получать. Довольствуясь тем, чем снабжал вас Христос, и внимая Его словам, вы бережно хранили их в сердце[a], а Его страдания были у вас перед глазами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во внутренностях»; в греческом это образ глубочайшего внутреннего чувства и усвоения.'
    reason: Сохраняет доступ к буквальной телесной метафоре σπλάγχνα, которая в основном тексте естественно передана словом «сердце».
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: были смиренны
  rationale: Передаёт длительное состояние, выраженное имперфектом, естественным современным русским языком.
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: охотнее подчинялись, чем подчиняли других
  rationale: Сохраняет прямое противопоставление среднего/страдательного и действительного значения однокоренных форм, не усиливая вторую до значения «требовать подчинения».
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: тем, чем снабжал вас Христос
  rationale: ἐφόδια обозначает припасы или всё необходимое; формулировка сохраняет образ обеспечения Христом и звучит естественно по-русски.
- source_word: ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  choice: бережно хранили их в сердце
  rationale: Греческая телесная метафора означает глубокое внутреннее усвоение и привязанность; «в сердце» является естественным русским соответствием, а наречие передаёт ἐπιμελῶς.
- source_word: τὰ παθήματα
  choice: страдания
  rationale: В данном христологическом контексте слово обозначает пережитые Христом страдания.
theological_decisions:
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В русском раннехристианском тексте «Христос» — естественное и исторически уместное именование; оно сохраняет титульное значение без внесения конфессионального толкования.
- issue: Обладатель или источник припасов в τοῦ Χριστοῦ
  choice: тем, чем снабжал вас Христос
  alternative: припасами Христа
  rationale: Родительный допускает краткую формулу принадлежности/источника; русский перевод раскрывает наиболее естественный контекстуальный смысл, не уточняя природу этих благ.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены параллелизм и нравственные противопоставления оригинала; тяжеловесные буквальные конструкции сглажены без устранения образности.
