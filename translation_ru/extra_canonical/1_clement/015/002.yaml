  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: ru
  text: 'Ведь где-то сказано: «Этот народ чтит Меня устами, но сердце их далеко от Меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Ведь где-то сказано
  rationale: Безличная русская формула естественно передаёт неопределённую ссылку на Писание; γάρ передано словом «ведь».
- source_word: τοῖς χείλεσιν με τιμᾷ
  choice: чтит Меня устами
  rationale: Сохранены образность и прямой объект исходного текста; настоящее время передано настоящим.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: но сердце его
  rationale: Греческое число буквально меняется с единственного «народ» на множественное местоимение «их»; по-русски согласование с собирательным «народ» естественнее выразить единственным числом, не меняя смысла.
- source_word: πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: далеко от Меня
  rationale: Кратко и естественно передаёт пространственную метафору духовного отчуждения без дополнительного истолкования.
theological_decisions:
- issue: Метафора удалённости сердца от Бога
  choice: 'сохранена буквально: «сердце его далеко от Меня»'
  alternative: «сердце его чуждо Мне»
  rationale: Буквальная пространственная метафора исходного текста сохраняет его образность и богословское напряжение, не сводя смысл к одному толкованию.
translation_notes:
  register: Современный литературный русский язык; стиль краткий, торжественный и понятный. Заглавная буква в местоимении «Меня» отражает традиционное русское оформление речи Бога.
