  text: λέγει γάρ που· Οὗτος ὁ λαὸς τοῖς χείλεσιν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ.
