  text: I will speak boldly in him.’”[a]
translation:
  language: ru
  text: «В нём я буду говорить дерзновенно».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В нём я буду говорить открыто».'
    reason: Глагол παρρησιάζομαι может обозначать как смелую, дерзновенную, так и открытую, свободную речь.
lexical_decisions:
- source_word: παρρησιάσομαι
  choice: я буду говорить дерзновенно
  rationale: Будущее время и значение свободной, смелой речи переданы прямо; «дерзновенно» сохраняет возвышенный библейский регистр, оставаясь понятным в современном русском языке.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Буквально сохраняет предложную конструкцию и неоднозначность местоименной отсылки, не подменяя её толкованием «за него» или «о нём».
theological_decisions:
- issue: К кому или к чему относится αὐτῷ и как понимать ἐν
  choice: «в нём»
  alternative: «за него» / «о нём»
  rationale: Краткий греческий фрагмент допускает неоднозначность отсылки; контекстуально-пояснительные варианты могли бы преждевременно закрепить одно толкование.
translation_notes:
  register: Современный литературный русский с кратким возвышенным оборотом, соответствующим цитатному характеру фразы. Необычное «в нём» сохранено ради точности и исходной неоднозначности.
