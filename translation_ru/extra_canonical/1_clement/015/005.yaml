source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: ru
  text: 'Поэтому да онемеют лживые уста, говорящие беззаконие против праведника. И снова: «Да истребит Господь все лживые уста, хвастливый язык и тех, кто говорит: „Возвеличим наш язык; наши уста — при нас. Кто нам господин?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: да онемеют
  rationale: Передаёт пожелание или призыв, выраженный формой γενηθήτω, и значение ἄλαλα — неспособные говорить.
- source_word: ἀνομίαν
  choice: беззаконие
  rationale: Сохраняет прямое этико-религиозное значение греческого слова и связь с языком цитируемого псалма.
- source_word: τοῦ δικαίου
  choice: праведника
  rationale: Субстантивированное единственное число передано без обобщения во множественное число.
- source_word: μεγαλοῤῥήμονα
  choice: хвастливый
  rationale: Естественно передаёт речь надменную, исполненную великих притязаний; буквальное «велеглаголивый» архаично.
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  choice: Возвеличим наш язык
  rationale: Сохраняет образ и лексическую связь μεγαλυνοῦμεν с идеей возвеличивания, не заменяя его пояснительным толкованием.
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: наши уста — при нас
  rationale: Сохраняет необычную и допускающую оттенки смысла формулировку оригинала, не сводя её однозначно к «принадлежат нам».
theological_decisions:
- issue: Смысл выражения παρ᾽ ἡμῖν
  choice: наши уста — при нас
  alternative: наши уста принадлежат нам / наши уста с нами
  rationale: Греческая фраза может выражать обладание, доступность или самостоятельное распоряжение. Основной текст сохраняет её напряжённую буквальность вместо выбора одного толкования.
- issue: Число в τοῦ δικαίου
  choice: против праведника
  alternative: против праведных
  rationale: Сохранено единственное число греческого текста без богословского уточнения личности праведника.
translation_notes:
  register: Современный литературный русский с торжественным псалмодическим звучанием. Формы «да онемеют» и «да истребит» уместно сохраняют характер цитаты-пожелания; избегнуты как чрезмерные архаизмы, так и разговорные перефразы.
