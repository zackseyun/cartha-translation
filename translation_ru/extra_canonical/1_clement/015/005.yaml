  timestamp: '2026-07-18T10:06:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Первая фраза точно передаёт пожелательную форму γενηθήτω, единственное число τοῦ δικαίου и смысл ἀνομίαν. Во второй цитате сохранены все три объекта глагола Ἐξολεθρευθῆσαν: лживые уста, хвастливый/надменный язык и сами говорящие. Формулировка «наши уста — при нас» намеренно оставлена как близкая к παρ᾽ ἡμῖν и не навязывает толкования о полном владении или независимости.'
  naturalness: 'Нужна небольшая синтаксическая правка: в исходном варианте тире перед «тех, кто говорит» неудачно связывает однородные дополнения. Перечисление с союзом «и» ясно и естественно по-русски. «И снова» несколько точнее и нейтральнее передаёт καὶ πάλιν, чем «И ещё». Вложенная прямая речь оформлена русскими кавычками.'
  terminology: «Беззаконие», «праведник», «Господь» и «уста» уместны для псалмодического регистра. «Хвастливый язык» естественно передаёт μεγαλoρρήμονα без архаизации. Имя и богословские термины не требуют изменений.
  issues:
  - severity: low
    issue: Неясное оформление однородных дополнений во второй цитате.
    rationale: Греческое τοὺς εἰπόντας является ещё одним дополнением при «да истребит». Русское «— тех, кто говорит» после «язык хвастливый» выглядит как присоединительное пояснение, а не как третий объект действия.
  - severity: low
    issue: Типографика вложенной цитаты не соответствует обычному русскому оформлению.
    rationale: Для внутренней прямой речи после внешних кавычек «...» нормативно употребить „...“.
  revised_text: 'Поэтому да онемеют лживые уста, говорящие беззаконие против праведника. И снова: «Да истребит Господь все лживые уста, хвастливый язык и тех, кто говорит: „Возвеличим наш язык; наши уста — при нас. Кто нам господин?“»'
