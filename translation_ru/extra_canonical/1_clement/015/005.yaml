revisions:
- from: 'Поэтому да онемеют лживые уста, говорящие беззаконие против праведника. И ещё: «Да истребит Господь все лживые уста и язык хвастливый — тех, кто говорит: “Возвеличим наш язык; наши уста — при нас. Кто нам господин?”»'
  to: 'Поэтому да онемеют лживые уста, говорящие беззаконие против праведника. И снова: «Да истребит Господь все лживые уста, хвастливый язык и тех, кто говорит: „Возвеличим наш язык; наши уста — при нас. Кто нам господин?“»'
  rationale: Исправлены только синтаксис перечисления и русское оформление вложенной цитаты; «И ещё» заменено на более прямое соответствие καὶ πάλιν. Смысл, число и намеренная неоднозначность выражения παρ᾽ ἡμῖν сохранены.
