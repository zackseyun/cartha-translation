  source_fidelity: Перевод точно передаёт увещательный смысл τοίνυν и κολληθῶμεν («Итак, будем держаться»), а также противопоставление людей, мирно живущих в благочестии, тем, чьё стремление к миру отмечено лицемерием. Обороты «в мире и благочестии» и «лицемерно желает мира» естественно передают модально-сопутствующую функцию μετ᾽ εὐσεβείας и μεθ᾽ ὑποκρίσεως, не превращая благочестие или лицемерие в объект мира.
