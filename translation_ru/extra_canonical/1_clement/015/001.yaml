  text: Therefore let us join ourselves to those who Therefore let us join ourselves to those who live in peace with godliness, and not to those who desire peace with hypocrisy..
translation:
  language: ru
  text: Итак, будем держаться тех, кто живёт в мире и благочестии, а не тех, кто лицемерно желает мира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: будем держаться
  rationale: Передаёт призыв тесно присоединиться к таким людям естественным современным русским выражением.
- source_word: εἰρηνεύουσιν
  choice: живёт в мире
  rationale: Глагол означает пребывать или жить в мире; это не делает благочестие объектом примирения.
- source_word: μετ᾽ εὐσεβείας
  choice: и благочестии
  rationale: 'Передаёт сопутствующее качество мирной жизни: мир соединён с благочестием.'
- source_word: μεθ᾽ ὑποκρίσεως βουλομένοις εἰρήνην
  choice: лицемерно желает мира
  rationale: Наречная передача ясно показывает, что лицемерие характеризует желание мира, а не является его объектом.
theological_decisions:
- issue: Связь благочестия и лицемерия с миром
  choice: Оба выражения переданы как характеристика образа действий или внутренней установки.
  alternative: «творит мир с благочестием… желает мира с лицемерием»
  rationale: Предложные обороты с μετά здесь естественнее понимать модально или как указание на сопутствующее качество; буквальное «с» по-русски создаёт ложное впечатление, будто благочестие и лицемерие — стороны примирения.
translation_notes:
  register: Современный литературный русский язык, краткий увещательный стиль. Единственное число в относительных придаточных обусловлено собирательной конструкцией «тех, кто».
