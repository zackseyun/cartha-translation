base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: ru
  text: 'И ещё сказано: «Они любили Его устами своими и языком своим лгали Ему; сердце же их не было искренним с Ним, и не были они верны завету Его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  choice: Они любили Его устами своими
  rationale: Сохранён буквальный и намеренно резкий образ внешней, лишь словесной любви; глагол ἠγάπησαν передан как «любили», без истолковывающего ослабления.
- source_word: τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν
  choice: языком своим лгали Ему
  rationale: Естественно передаёт орудийный дательный и направленность лжи по отношению к Богу.
- source_word: οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  choice: не было право пред Ним
  rationale: «Право» сохраняет нравственно-пространственный образ εὐθεῖα; «пред Ним» представляет идиоматичный русский библейский эквивалент μετ᾽ αὐτοῦ в данном контексте.
- source_word: οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  choice: и не были они верны завету Его
  rationale: Передаёт ἐπιστώθησαν без добавления значения «были найдены/оказались»; ἐν с διαθήκη естественно выражено русским дательным отношения.
theological_decisions:
- issue: Значение διαθήκη
  choice: завет
  alternative: договор
  rationale: В цитатном библейском контексте «завет» является точным и общепонятным соответствием, не внося конфессионально специфического толкования.
- issue: Отношение сердца к Богу в выражении μετ᾽ αὐτοῦ
  choice: пред Ним
  alternative: с Ним
  rationale: «Пред Ним» по-русски яснее выражает нравственную правоту сердца в отношении Бога, тогда как буквальное «с Ним» звучало бы неестественно; богословское напряжение между внешней речью и внутренним состоянием сохранено.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «устами своими», «завету Его» поддерживает цитатный характер речи, оставаясь понятной современному читателю.
