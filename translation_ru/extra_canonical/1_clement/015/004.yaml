  source_fidelity: В выражении οὐκ εὐθεῖα μετ᾽ αὐτοῦ черновое «не было право пред Ним» передаёт общий нравственный смысл, но заменяет μετ᾽ αὐτοῦ («с Ним») на «пред Ним». Безопаснее сохранить отношение сердца к Богу как неискреннее, ненадлежащее «с Ним». Остальные члены точно отражают греческий текст и английскую контрольную версию.
  naturalness: «Сердце их не было искренним с Ним» — современное литературное и ясное выражение; оно сохраняет возвышенный библейский регистр без неестественного буквального «не было право с Ним». Остальная фраза звучит естественно в цитатной речи.
  terminology: «Завет» — точная и устойчивая передача διαθήκη в данном библейском цитатном контексте. Местоимение «Его/Ему/Ним» уместно, поскольку речь относится к Богу в цитируемом тексте.
  issues:
