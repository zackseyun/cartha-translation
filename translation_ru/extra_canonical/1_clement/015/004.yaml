    issue: «пред Ним» вместо μετ᾽ αὐτοῦ
    rationale: Греческое μετ᾽ αὐτοῦ обозначает отношение «с Ним», а не положение «пред Ним». Хотя «пред Ним» традиционно и понятно, оно несколько меняет образ и не следует исходному предлогу. «Искренним с Ним» естественно выражает смысл εὐθεῖα в отношении к Богу.
