lexical_decisions:
- source_word: Τῷ στόματι αὐτῶν
  choice: Устами они
  rationale: Естественная русская передача инструментального значения греческого дательного при сохранении образа уст.
- source_word: εὐλογοῦσαν
  choice: благословляли
  rationale: Имперфект передан глаголом несовершенного вида; сохраняется прямой контраст с «проклинали».
- source_word: τῇ δὲ καρδίᾳ αὐτῶν
  choice: а сердцем
  rationale: Частица δέ выражает противопоставление; повтор местоимения по-русски избыточен, тогда как принадлежность ясно определяется подлежащим.
- source_word: κατηρῶντο
  choice: проклинали
  rationale: Передаёт значение среднего депонентного глагола καταράομαι и сохраняет параллелизм с формой несовершенного вида.
