source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: ru
  text: «Из-за страдания бедных и стенания нуждающихся ныне восстану, — говорит Господь. — Дарую ему спасение».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально заключительные слова можно передать: «помещу [его] в спасение (или: в безопасность)»; в греческом тексте дополнение «его» не выражено явно.'
    reason: Отмечает подлинную неоднозначность идиомы θήσομαι ἐν σωτηρίῳ и подразумеваемого объекта.
lexical_decisions:
- source_word: ταλαιπωρία
  choice: страдание
  rationale: Передаёт тяжёлое бедственное состояние без неестественного для современного русского оборота «бедствие бедных».
- source_word: πτωχῶν
  choice: бедных
  rationale: Прямое и естественное соответствие обозначению людей, находящихся в нищете или бедственном положении.
- source_word: στεναγμός
  choice: стенание
  rationale: Сохраняет образ слышимого выражения боли и угнетения.
- source_word: πενήτων
  choice: нуждающихся
  rationale: Отличает πενήτων от πτωχῶν и передаёт людей, испытывающих материальную нужду.
- source_word: ἀναστήσομαι
  choice: восстану
  rationale: Сохраняет библейский образ решительного действия Господа и соответствует будущему времени греческого глагола.
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: дарую ему спасение
  rationale: Естественно передаёт идиому помещения неназванного лица в состояние безопасности или спасения, сохраняя единственное число подразумеваемого объекта.
theological_decisions:
- issue: 'Значение σωτήριον: безопасность или спасение'
  choice: спасение
  alternative: безопасность; безопасное место
  rationale: Греческое выражение допускает оттенки избавления и безопасности. «Спасение» сохраняет библейскую широту смысла, не уточняя способ избавления.
- issue: Неназванное дополнение при θήσομαι
  choice: ему
  alternative: их; оставление дополнения невыраженным
  rationale: Форма и контекст цитаты традиционно предполагают объект в единственном числе; местоимение «ему» сохраняет эту особенность, хотя в данной греческой формулировке дополнение явно не выражено.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. «Ныне восстану» сохраняет возвышенный регистр оригинала, тогда как остальная лексика остаётся понятной обычному читателю.
