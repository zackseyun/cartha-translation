source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: ru
  text: 'Верни мне радость[a] твоего спасения

    и укрепи меня направляющим духом.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ликование».'
    reason: ἀγαλλίασις может обозначать не просто радость, а её сильное, ликующее выражение.
  - marker: b
    text: 'Или: «духом готовности»; букв. «руководящим (ведущим) духом».'
    reason: ἡγεμονικός прежде всего означает «ведущий, руководящий, управляющий»; в контексте псаломской молитвы возможно также понимание как охотно расположенного, готового духа. Греческий текст не уточняет, чей это дух.
lexical_decisions:
- source_word: ἀπόδος
  choice: Верни
  rationale: Императив ἀπόδος буквально выражает просьбу «отдать обратно, возвратить»; «верни» естественно передаёт восстановление утраченной радости.
- source_word: ἀγαλλίασιν
  choice: радость
  rationale: Существительное обозначает сильную радость, ликование. «Радость» звучит естественно в современном русском и сохраняет смысл; более интенсивный оттенок отмечен в сноске.
- source_word: τοῦ σωτηρίου σου
  choice: твоего спасения
  rationale: Субстантивированное σωτήριον означает спасение или избавление; родительный падеж сохранён без уточнения, является ли это радостью, которую даёт спасение, или радостью о спасении.
- source_word: στήριξόν με
  choice: поддержи меня
  rationale: Глагол στηρίζω здесь означает укрепить, утвердить, сделать стойким. «Поддержи» хорошо сочетается с творительным оборотом и передаёт продолжающуюся опору.
- source_word: πνεύματι ἡγεμονικῷ
  choice: духом готовности
  rationale: ἡγεμονικός может описывать ведущий, управляющий, властный либо охотно и твёрдо расположенный дух. В контексте молитвы «духом готовности» естественно передаёт внутреннюю добровольную стойкость, не исключая иной трактовки, указанной в сноске.
theological_decisions:
- issue: Чей дух подразумевается в πνεύματι ἡγεμονικῷ
  choice: Не уточнять в основном тексте
  alternative: «Твоим направляющим Духом» или «мой дух сделай готовым»
  rationale: В греческом нет притяжательного местоимения и слово πνεῦμα само по себе не решает, идёт ли речь о Божьем Духе или о внутреннем состоянии молящегося. Добавление такого уточнения сняло бы подлинную неоднозначность.
- issue: Значение ἡγεμονικός
  choice: «духом готовности» с вариантом в сноске
  alternative: «руководящим духом» или «владычественным духом»
  rationale: Основной вариант естественен по-русски и соответствует молитве о стойком, охотном духе; сноска сохраняет возможное значение руководства или управления, не навязывая конфессионального прочтения.
translation_notes:
  register: Современный литературный русский язык с кратким молитвенно-поэтическим параллелизмом. Избегнуты архаизмы вроде «возврати» и «духом владычественным», при этом сохранены достоинство речи и неоднозначность греческого выражения.
