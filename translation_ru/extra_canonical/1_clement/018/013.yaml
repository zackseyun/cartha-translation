  text: διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπιστρέψουσιν ἐπὶ σέ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: ru
  text: 'Я научу беззаконных путям Твоим,

    и нечестивые обратятся к Тебе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάξω
  choice: Я научу
  rationale: Будущее время и активное значение греческого глагола переданы прямо и естественно.
- source_word: ἀνόμους
  choice: беззаконных
  rationale: Субстантивированное прилагательное обозначает людей, не соблюдающих Божий закон; «беззаконных» сохраняет связь с понятием закона.
- source_word: τὰς ὁδούς σου
  choice: путям Твоим
  rationale: После «научу» современный русский требует дательного падежа для предмета обучения; образ Божьих «путей» сохранён.
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Передаёт религиозно-нравственное значение людей, лишённых благоговения перед Богом.
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: обратятся к Тебе
  rationale: Передаёт направленное обращение к Богу, не добавляя прямо не выраженного в греческом значения «снова» или «назад».
theological_decisions:
- issue: Содержит ли ἐπιστρέψουσιν значение возвращения к прежнему состоянию
  choice: обратятся к Тебе
  alternative: возвратятся к Тебе
  rationale: Греческая конструкция обозначает поворот или обращение к адресату, но сама по себе не требует идеи возвращения; нейтральный вариант сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский с достоинством и поэтическим параллелизмом исходной строки. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской традиции.
