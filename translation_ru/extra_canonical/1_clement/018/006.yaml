  source_fidelity: 'Греческое ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας точно передано как «Ибо вот, Ты возлюбил истину». Финальное ἐδήλωσάς μοι («сделал явным / сообщил мне») естественно передаётся словами «Ты открыл мне». Однако «сокровенное и тайное» почти сливает два исходных слова: ἄδηλα прежде всего обозначает неведомое, неявное, тогда как κρύφια — скрытое, тайное.'
  naturalness: Текст краток, благозвучен и сохраняет умеренно возвышенный библейский регистр. «Ибо вот» допустимо в этом регистре и передаёт эмфазу ἰδού; прописное написание местоимений уместно для русского религиозного изложения.
  terminology: «Истина», «мудрость» и «открыл» употреблены точно и без доктринальных добавлений. Замена первого члена пары на «неведомое» лучше сохраняет лексическое различие исходника, не вводя толкования.
