  text: ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας· τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: ru
  text: 'Ибо вот, Ты возлюбил истину;


    неведомое и сокрытое Твоей мудрости Ты открыл мне.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Ибо вот
  rationale: Сохраняет и пояснительную связь γάρ, и указательно-эмфатическую силу ἰδού; оборот звучит возвышенно, но понятен современному читателю.
- source_word: ἀλήθειαν ἠγάπησας
  choice: Ты возлюбил истину
  rationale: Прямо передаёт аорист ἠγάπησας и объект ἀλήθειαν, сохраняя библейский регистр.
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  choice: сокровенное и тайное
  rationale: 'Два субстантивированных прилагательных переданы двумя близкими, но не полностью совпадающими понятиями: ἄδηλα — то, что неявно или сокрыто от знания, κρύφια — то, что скрыто.'
- source_word: τῆς σοφίας σου
  choice: Твоей мудрости
  rationale: Родительный сохранён без уточнения его отношения к двум существительным, чтобы не устранять присущую греческому тексту смысловую ёмкость.
- source_word: ἐδήλωσάς μοι
  choice: Ты открыл мне
  rationale: Естественно передаёт значение «сделал явным, сообщил»; «открыл» соответствует контрасту с сокровенным и тайным.
theological_decisions:
- issue: Отношение выражения «Твоей мудрости» к «сокровенному и тайному»
  choice: Сохранена компактная конструкция «сокровенное и тайное Твоей мудрости»
  alternative: «сокровенные и тайные глубины Твоей мудрости»
  rationale: Добавление «глубины» конкретизировало бы образ, отсутствующий в греческом тексте, и могло бы сузить смысл.
- issue: Референт местоимения второго лица
  choice: Местоимения написаны с прописной буквы как обращение к Богу в русской религиозной письменной традиции
  alternative: «ты… твоей… ты» со строчной буквы
  rationale: Контекст цитаты обращён к Богу; прописная буква поддерживает достоинство русского регистра, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и краткость греческого текста сохранены; архаизмы и добавочные толкования исключены.
