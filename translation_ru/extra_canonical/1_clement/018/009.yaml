  yaml_path: translation/extra_canonical/1_clement/018/009.yaml
  text: 'Turn your face away from my sins,

    and blot out all my lawless deeds.'
translation:
  language: ru
  text: 'Отврати лицо Твоё от моих грехов

    и изгладь все мои беззакония.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου
  choice: Отврати лицо Твоё
  rationale: Сохраняет образ и повелительную форму греческого текста; «отврати» уместно в молитвенно-библейском регистре и понятно современному читателю.
- source_word: ἁμαρτιῶν
  choice: грехов
  rationale: Прямое и естественное соответствие греческому термину ἁμαρτία.
- source_word: ἐξάλειψον
  choice: изгладь
  rationale: Передаёт образ стирания или удаления записи, заложенный в глаголе ἐξαλείφω, и сохраняет связь с традиционной библейской речью.
- source_word: ἀνομίας
  choice: беззакония
  rationale: Точно передаёт ἀνομία как нарушение закона или беззаконие, не сужая значение до отдельных поступков.
theological_decisions:
- issue: Различение ἁμαρτίαι и ἀνομίαι
  choice: «грехи» и «беззакония»
  alternative: «грехи» и «беззаконные дела»
  rationale: Сохранены два разных существительных исходного текста без добавления слова «дела», которого в греческом нет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Порядок строк и параллелизм оригинала сохранены; прописная буква в «Твоё» маркирует обращение к Богу согласно принятой русской религиозной письменной норме.
