source:
  edition: Funk 1901 (normalized OCR)
  text: καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: ru
  text: 'Сердце чистое сотвори во мне, Боже,

    и дух правый обнови внутри меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν
  choice: сердце чистое
  rationale: Сохраняет образ и несколько возвышенный порядок слов исходного текста, естественный для поэтической молитвы.
- source_word: κτίσον
  choice: сотвори
  rationale: Передаёт сильный созидательный смысл глагола κτίζω и соответствует торжественному молитвенному регистру.
- source_word: πνεῦμα εὐθὲς
  choice: дух правый
  rationale: 'Сохраняет многозначность εὐθύς: прямой, правильный, стойкий; традиционное «правый» не сужает выражение до одной психологической характеристики.'
- source_word: ἐγκαίνισον
  choice: обнови
  rationale: Точно передаёт призыв сделать новым, восстановить.
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: внутри меня
  rationale: Естественно по-русски выражает внутреннюю глубину человека без анатомически окрашенного буквализма «в моих внутренностях».
theological_decisions:
- issue: Значение πνεῦμα в выражении πνεῦμα εὐθὲς
  choice: дух правый
  alternative: стойкий дух / правильный дух
  rationale: Формулировка сохраняет возможность понимать речь о внутреннем духе и настрое молящегося, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский с торжественным, молитвенно-поэтическим звучанием. Синтаксический параллелизм греческого оригинала сохранён; архаичные формы второго лица не требуются, поскольку оба сказуемых стоят в повелительном наклонении.
