  source_fidelity: 'Текст точно передаёт греческий оригинал: «сотвори» соответствует κτίσον и сохраняет созидательную силу глагола; «сердце чистое» передаёт καρδίαν καθαράν; «дух правый» адекватно сохраняет широту πνεῦμα εὐθές; «обнови» соответствует ἐγκαίνισον. «Внутри меня» естественно передаёт идиоматическое ἐν τοῖς ἐγκάτοις μου, не внося ненужного анатомического оттенка.'
  naturalness: Фраза звучит естественно в современном литературном русском при уместно возвышенном, молитвенно-поэтическом регистре. Параллельная структура строк сохранена. Инверсия «Сердце чистое сотвори» оправдана жанром и не воспринимается как неестественная.
  terminology: «Боже», «сотвори» и «дух правый» образуют последовательный библейско-поэтический регистр. «Дух правый» не навязывает конфессионального толкования и сохраняет смысловую неоднозначность греческого выражения. Сверка с английской редакционной формой подтверждает удачную передачу заключительного оборота как «внутри меня».
