source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: ru
  text: 'Не отвергни меня от лица Твоего,

    и Духа Твоего Святого не отними у меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς
  choice: Не отвергни
  rationale: Передаёт сильное значение удаления и отвержения, сохраняя молитвенный библейский регистр.
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: от лица Твоего
  rationale: Формально сохраняет образ греческого выражения, означающего удаление из Божьего присутствия; оборот понятен в русском библейском стиле.
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: Духа Твоего Святого
  rationale: Сохраняет принадлежность, выраженную σου, и естественный для русского торжественного регистра порядок слов.
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: не отними у меня
  rationale: Передаёт удаление или отнятие без добавления значения «взять обратно», которого греческий текст не выражает явно.
theological_decisions:
- issue: Значение выражения о Святом Духе
  choice: не отними у меня
  alternative: не забери обратно у меня
  rationale: Выбранный вариант не привносит богословского предположения о предварительном даровании с последующим возвращением дара, а сохраняет просьбу исходного текста.
translation_notes:
  register: Современный литературный русский с dignified библейско-молитвенным звучанием. Сохранён параллелизм двух отрицательных прошений; архаические формы глаголов не использованы.
