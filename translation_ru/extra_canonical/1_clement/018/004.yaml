  source_fidelity: 'Русский текст точно передаёт греческую цитату: σοὶ μόνῳ — «Тебе одному», ἥμαρτον — «согрешил», τὸ πονηρόν — «зло», δικαιωθῇς — «был признан правым», νικήσῃς — «одержал победу». Основное чтение «когда Тебя судят» является возможным пассивным пониманием ἐν τῷ κρίνεσθαί σε. Сноска корректно сохраняет также среднее прочтение («когда Ты судишь / вступаешь в суд»), не выдавая один спорный разбор за несомненный.'
