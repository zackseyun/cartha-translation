  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: ru
  text: '«Тебе одному я согрешил

    и сделал зло пред Тобой,

    чтобы Ты был признан правым в Своих словах

    и одержал победу, когда Тебя судят[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Ты судишь»; возможно также: «когда Ты вступаешь в суд». Греческая форма может пониматься как пассивная или средняя.'
    reason: Сохраняет грамматическую и интерпретационную неоднозначность κρίνεσθαι и учитывает связь цитаты с формулировкой Псалма 50:6 по Септуагинте.
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: Тебе одному
  rationale: Прямо передаёт исключительное обращение к Богу и сохраняет узнаваемую псалмовую формулировку.
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: сделал зло пред Тобой
  rationale: Сохраняет предметное значение τὸ πονηρόν и библейски достойное, но понятное современному читателю выражение ἐνώπιόν σου.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: Ты был признан правым в Своих словах
  rationale: Передаёт пассивную форму δικαιωθῇς без двусмысленного русского «оправдан», которое может подразумевать снятие вины.
- source_word: νικήσῃς
  choice: одержал победу
  rationale: Естественно передаёт значение «победить, возобладать» в контексте судебного спора.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: когда Тебя судят
  rationale: Отражает наиболее прямое пассивное прочтение греческого инфинитива и сохраняет судебный образ; возможное среднее прочтение отмечено в сноске.
theological_decisions:
- issue: Залог и субъект действия в κρίνεσθαί σε
  choice: когда Тебя судят
  alternative: когда Ты судишь; когда Ты вступаешь в суд
  rationale: Греческая форма допускает пассивное понимание, известное также по древней рецепции цитаты, тогда как среднее понимание и еврейский текст Псалма указывают на Божье действие в суде. Основной текст следует непосредственно возможному греческому пассиву, а сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, псалмовым ритмом. Формы «пред Тобой» и прописные местоимения поддерживают достоинство цитаты, не затрудняя понимания.
