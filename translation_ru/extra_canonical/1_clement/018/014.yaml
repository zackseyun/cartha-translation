lexical_decisions:
- source_word: ῥῦσαί με
  choice: Избавь меня
  rationale: Точно передаёт просьбу об избавлении и естественно звучит в современном литературном русском языке.
- source_word: ἐξ αἱμάτων
  choice: от вины за пролитую кровь
  rationale: Буквально множественное «от кровей» — устойчивый библейский оборот, обозначающий виновность в кровопролитии; буквальная калька в современном русском неясна.
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: Бог моего спасения
  rationale: 'Сохраняет генитивную конструкцию оригинала и её возможную смысловую широту: Бог как источник и совершитель спасения.'
theological_decisions:
- issue: Значение αἱμάτων во множественном числе
  choice: вина за пролитую кровь
  alternative: кровопролитие / кровь
  rationale: Контекст цитируемого псалма и греческий идиоматический оборот указывают на виновность в кровопролитии; формулировка не уточняет обстоятельств и не снимает нравственного напряжения.
