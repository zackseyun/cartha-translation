  text: ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. κύριε, τὸ στόμα μου ἀνοίξεις, καὶ τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: ru
  text: 'Мой язык возрадуется Твоей праведности.


    Господи, Ты откроешь мои уста,


    и мои губы возвестят Тебе хвалу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: возрадуется
  rationale: Передаёт сильную, торжественную радость и сохраняет будущее время греческой формы.
- source_word: τὴν δικαιοσύνην σου
  choice: Твоей праведности
  rationale: Родительный падеж естественно передаёт предмет радости после русского глагола «возрадоваться»; «праведность» сохраняет богословскую ёмкость δικαιοσύνη.
- source_word: ἀναγγελεῖ
  choice: возвестят
  rationale: Передаёт открытое провозглашение хвалы и сохраняет возвышенный, но понятный регистр.
- source_word: τὴν αἴνεσίν σου
  choice: хвалу Тебе
  rationale: В данном контексте естественная русская формулировка; принадлежность хвалы Богу передана как её направленность Ему.
