base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: ru
  text: 'Омой меня ещё более от моего беззакония

    и очисти меня от моего греха.

    Ибо я знаю своё беззаконие,

    и грех мой всегда предо мною.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον πλῦνόν με
  choice: Снова и снова омывай меня
  rationale: Передаёт усилительное значение ἐπὶ πλεῖον естественным русским выражением и сохраняет образ многократного, всё более полного омовения.
- source_word: ἀνομία
  choice: беззаконие
  rationale: Сохраняет связь с нарушением Божьего закона и отличает этот термин от более общего ἁμαρτία — «грех».
- source_word: καθάρισόν με
  choice: очисти меня
  rationale: Прямо передаёт просьбу об очищении и сохраняет параллелизм с «омывай».
- source_word: διαπαντός
  choice: всегда
  rationale: Естественный современный эквивалент со значением непрерывного присутствия.
theological_decisions:
- issue: Соотношение ἀνομία и ἁμαρτία
  choice: 'Сохранены разные слова: «беззаконие» и «грех»'
  alternative: Передать оба слова как «грех» или близкими синонимами
  rationale: Лексическое различие присутствует в греческом тексте и значимо для поэтического параллелизма; его не следует сглаживать.
- issue: Значение ἐπὶ πλεῖον
  choice: «Снова и снова»
  alternative: «Ещё более» / «многократно»
  rationale: Греческое выражение допускает усилительный оттенок; выбранный вариант сохраняет напряжённую просьбу о дальнейшем и полном очищении, не вводя отдельного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Сохранена четырёхстрочная структура и синтаксический параллелизм; форма «предо мною» выбрана как уместная возвышенная, но понятная современному читателю.
