id: 1CLEM.18.2
reference: 1 Clement 18:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: ru
  text: 'Но и он сам[a] говорит Богу:


    Помилуй меня, Боже, по великой милости Твоей,


    и по множеству щедрот Твоих изгладь беззаконие моё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но и он говорит Богу».'
    reason: В сочетании καὶ αὐτός можно сильнее выделить либо присоединительное «и он», либо возвратное усиление «он сам»; основной текст передаёт оба оттенка.
lexical_decisions:
- source_word: ἀλλὰ καὶ αὐτὸς
  choice: Но и он сам
  rationale: Передаёт как присоединительно-противительный смысл ἀλλά καί, так и выразительное αὐτός; в контексте подчёркивается, что после Божьих слов к Давиду сам Давид обращается к Богу.
- source_word: ἔλεος
  choice: милость
  rationale: Естественный и точный русский эквивалент в обращённой к Богу молитве.
- source_word: οἰκτιρμῶν
  choice: щедрот
  rationale: Сохраняет множественное число и отличает это слово от ранее употреблённого ἔλεος; «щедроты» — понятное слово возвышенного библейского регистра, выражающее многократные проявления сострадания.
- source_word: ἐξάλειψον
  choice: изгладь
  rationale: Передаёт образ полного стирания или удаления вины, сохраняя метафору исходного глагола.
- source_word: ἀνόμημά μου
  choice: беззаконие моё
  rationale: Сохраняет единственное число и отвлечённо-результативный смысл существительного, не сужая его до одного конкретного поступка.
theological_decisions:
- issue: Соотношение Божьей милости и человеческого беззакония
  choice: Сохранена прямая просьба об изглаживании беззакония по Божьей милости
  alternative: Уточнить механизм прощения или характер проступка
  rationale: Исходный текст не даёт такого уточнения; перевод сохраняет его богословскую краткость и напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Формы «щедрот» и «изгладь» сохраняют достоинство псалмового языка, оставаясь понятными современному читателю. Местоимения, обращённые к Богу, даны с прописной буквы в соответствии с принятой русской благоговейной письменной традицией.
