  text: ῥαντιεῖς με ὑσσώπῳ, καὶ καθαρισθήσομαι· πλυνεῖς με, καὶ ὑπὲρ χιόνα λευκανθήσομαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: ru
  text: 'Ты окропишь меня иссопом, и я очищусь;

    омоешь меня, и стану белее снега.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: окропишь
  rationale: Будущее время и прямое значение глагола «кропить, окроплять» сохранены.
- source_word: ὑσσώπῳ
  choice: иссопом
  rationale: Традиционное и точное название растения, связанного с обрядовым очищением.
- source_word: καθαρισθήσομαι
  choice: я очищусь
  rationale: Передаёт пассивно-результативный смысл формы без избыточного уточнения деятеля.
- source_word: πλυνεῖς
  choice: омоешь
  rationale: Естественное для возвышенного библейского контекста обозначение полного обмывания.
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: стану белее снега
  rationale: Сохраняет сравнительную конструкцию и результирующее значение будущего пассива в естественной русской форме.
