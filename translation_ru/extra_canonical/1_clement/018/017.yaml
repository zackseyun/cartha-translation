base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: ru
  text: '«Жертва Богу — сокрушённый дух;


    сокрушённое и смиренное сердце Бог не презрит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: жертва
  rationale: Прямой и естественный эквивалент, сохраняющий культовую метафору исходного текста.
- source_word: πνεῦμα συντετριμμένον
  choice: сокрушённый дух
  rationale: Передаёт образ внутренней сломленности и раскаяния, не сводя πνεῦμα к настроению или эмоции.
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  choice: сердца сокрушённого и смиренного
  rationale: Сохраняет оба причастных определения и возвышенный поэтический параллелизм; родительный падеж естественно обусловлен русской конструкцией с глаголом «отвергнет».
- source_word: οὐκ ἐξουδενώσει
  choice: не отвергнет
  rationale: В контексте означает, что Бог не сочтёт такое сердце ничтожным и не пренебрежёт им; «не отвергнет» ясно и идиоматично выражает этот смысл.
theological_decisions:
- issue: Характер жертвы, угодной Богу
  choice: Сохранена метафорическая формула «жертва Богу — сокрушённый дух» без поясняющего добавления.
  alternative: «Жертва, угодная Богу, — дух сокрушённый».
  rationale: В греческом тексте нет слова «угодная»; буквальная именная конструкция сохраняет сжатость и богословское напряжение цитаты.
translation_notes:
  register: Современный литературный русский с сохранением библейской торжественности и поэтического параллелизма. Кавычки оставлены, поскольку стих завершает прямую цитату в контексте 1 Климента.
