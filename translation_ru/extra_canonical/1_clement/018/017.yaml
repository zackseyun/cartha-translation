    issue: Глагол «не отвергнет»
    rationale: ἐξουδενώσει означает «не презрит, не пренебрежёт», а не собственно «не отвергнет». «Отвергнет» может обозначать отказ принять, тогда как греческий глагол выражает презрение или умаление.
