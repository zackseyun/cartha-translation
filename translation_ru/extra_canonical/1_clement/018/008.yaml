  text: ἀκουτιεῖς με ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστᾶ τεταπεινωμένα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/008.yaml
  text: 'You will make me hear gladness and joy;

    the bones that have been humbled will rejoice.'
translation:
  language: ru
  text: 'Ты дашь мне услышать ликование и радость —

    возликуют кости сокрушённые.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  choice: Ты дашь мне услышать
  rationale: Каузативная форма передана естественной русской конструкцией, сохраняющей значение «сделаешь так, что я услышу».
- source_word: ἀγαλλίασιν καὶ εὐφροσύνην
  choice: ликование и радость
  rationale: Два близких существительных сохранены как отдельная пара; «ликование» передаёт бурную радость, а «радость» служит естественным современным соответствием εὐφροσύνη.
- source_word: ἀγαλλιάσονται
  choice: возликуют
  rationale: Глагол передаёт выраженную, торжествующую радость и лексически перекликается с «ликованием» в первой строке.
- source_word: ὀστᾶ τεταπεινωμένα
  choice: кости сокрушённые
  rationale: В данном псаломском образе причастие от ταπεινόω означает не просто смирённое состояние, а причинённое поражение или сокрушение; формулировка сохраняет образ повреждённых костей и его переносный смысл.
theological_decisions:
- issue: Образ «сокрушённых костей»
  choice: Сохранён буквально-метафорический образ без поясняющего истолкования
  alternative: «униженные кости» или разъясняющая передача душевного состояния
  rationale: Греческий текст допускает буквальный оттенок унижения/принижения, однако контекст цитируемого псалма поддерживает традиционный образ сокрушения; перевод не сводит его к одной богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским ритмом. Местоимение «Ты» использовано по русской издательской норме обращения к Богу; тире связывает параллельные строки.
