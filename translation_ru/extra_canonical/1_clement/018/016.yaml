  text: ὅτι εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν· ὁλοκαυτώματα οὐκ εὐδοκήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: ru
  text: Ведь если бы Ты пожелал жертвы, я принёс бы её; всесожжения не будут Тебе угодны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  choice: жертвы
  rationale: Общее обозначение жертвоприношения; форма единственного числа естественно передаётся русским родительным после «пожелал».
- source_word: ἔδωκα ἄν
  choice: я принёс бы её
  rationale: В контексте жертвоприношения русское «принёс бы» естественнее буквального «дал бы» и сохраняет значение нереализованного условия.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Точный традиционный термин для жертв, полностью сжигаемых на жертвеннике.
- source_word: οὐκ εὐδοκήσεις
  choice: не будут Тебе угодны
  rationale: Сохраняет будущее время греческого текста и передаёт значение благоволения без излишне психологизированного «не порадуют».
theological_decisions:
- issue: Божье отношение к жертвоприношениям
  choice: не будут Тебе угодны
  alternative: Ты не благоволишь ко всесожжениям
  rationale: Выбранная формулировка сохраняет грамматическое будущее οὐκ εὐδοκήσεις и не превращает высказывание в более широкое вневременное отрицание жертвенного культа.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-псалмового контекста; обращение к Богу отмечено прописными местоимениями. Структура условного периода сохранена без архаизации.
