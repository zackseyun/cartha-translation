source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: ru
  text: 'Ибо вот, в беззакониях я был зачат,

    и во грехах зачала меня мать моя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «понесла меня во чреве». Греческий глагол связан с беременностью.'
    reason: Редкое ἐκίσσησέν имеет необычную образность и может быть передано как зачатие или наступление беременности, но не как кормление грудью.
lexical_decisions:
- source_word: ἀνομίαις
  choice: в беззакониях
  rationale: Множественное число и правовой оттенок ἀνομία переданы словом «беззакония», естественным для библейского регистра.
- source_word: συνελήμφθην
  choice: я был зачат
  rationale: Страдательная форма от συλλαμβάνω в данном контексте означает зачатие.
- source_word: ἐκίσσησέν
  choice: зачала меня
  rationale: Редкий глагол связан с беременностью и в цитируемом месте означает зачатие или наступление беременности; «зачала» точнее, чем «родила» или «вскормила».
theological_decisions:
- issue: Связь греха с зачатием
  choice: Сохранена формулировка «в беззакониях… во грехах» без пояснения ее богословского смысла.
  alternative: Истолковать строку как утверждение о конкретном учении о первородном грехе или о грехе родителей.
  rationale: Греческий текст допускает богословское напряжение, но сам стих не разъясняет его; перевод не должен привносить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом; порядок «мать моя» сохранен ради достоинства и параллелизма.
