  text: Τί δὲ εἴπωμεν ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ; πρὸς ὃν εἶπεν ὁ θεός· Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου, Δαυὶδ τὸν τοῦ Ἰεσσαί, ἐν ἐλέει αἰωνίῳ ἔχρισα αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: ru
  text: 'Что же скажем о Давиде, о котором было дано свидетельство? Ему Бог сказал: «Я нашёл мужа по сердцу Моему — Давида, сына Иессея; вечной милостью Я помазал его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  choice: о котором было дано свидетельство
  rationale: Перфектное страдательное причастие от μαρτυρέω указывает на полученное и сохраняющее силу свидетельство; оборот передаёт это естественно по-русски, не сводя значение без достаточных оснований к одной лишь похвале или одобрению.
- source_word: κατὰ τὴν καρδίαν μου
  choice: по сердцу Моему
  rationale: Сохраняет образ и намеренную библейскую формулировку исходного текста.
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: вечной милостью
  rationale: Творительный оборот естественно передаёт ἐν как обстоятельство/средство, сохраняя смысл неизменной, вечной милости.
- source_word: ἔχρισα
  choice: помазал
  rationale: Точный библейский и богословски значимый эквивалент глагола χρίω без добавочного истолкования.
theological_decisions:
- issue: Характер свидетельства о Давиде
  choice: о котором было дано свидетельство
  alternative: засвидетельствованном / получившем одобрение
  rationale: Выбранная формулировка сохраняет неоднозначность μαρτυρέω между свидетельством о человеке и положительным удостоверением его качеств; последующая прямая речь раскрывает содержание свидетельства.
- issue: Связь вечной милости с помазанием
  choice: вечной милостью Я помазал его
  alternative: в вечной милости Я помазал его
  rationale: Русский творительный передаёт вероятное инструментально-обстоятельственное значение ἐν, не уточняя сверх текста, является ли милость средством, основанием или сферой действия.
translation_notes:
  register: Современный литературный русский с сохранением достоинства раннехристианской цитатной речи. Повтор «And what shall we say» в предоставленном английском слое признан технической ошибкой и не воспроизведён, поскольку в греческом тексте фраза дана один раз. Местоимение «Моему» написано с прописной буквы в прямой речи Бога согласно традиционному русскому библейскому регистру.
