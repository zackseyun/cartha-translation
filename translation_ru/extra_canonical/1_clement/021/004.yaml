lexical_decisions:
- source_word: δίκαιον
  choice: надлежит
  rationale: Передаёт нравственную должность и уместность выражения «это правильно», естественно звуча в русском контексте увещания.
- source_word: λειποτακτεῖν
  choice: покидать своё место в строю
  rationale: 'Глагол имеет военную окраску: оставить строй или пост, дезертировать. Описательный перевод сохраняет этот образ и звучит естественнее, чем «дезертировать от воли».'
- source_word: ἀπὸ τοῦ θελήματος αὐτοῦ
  choice: отступая от Его воли
  rationale: Сохраняет значение удаления «от» Божьей воли и связывает его с военным образом исходного глагола.
theological_decisions:
- issue: Отношение к Божьей воле
  choice: Его воля представлена как строй, из которого нельзя уходить
  alternative: не противиться Его воле / не оставлять Его волю
  rationale: Выбранная формулировка не сводит фразу лишь к непослушанию, а сохраняет важный для контекста Климента образ порядка и верности своему месту.
