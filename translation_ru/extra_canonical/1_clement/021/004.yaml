  source_fidelity: Греч. δίκαιον οὖν ἐστίν передаёт «итак, справедливо/правильно», а μὴ λειποτακτεῖν ἡμᾶς ἀπὸ τοῦ θελήματος αὐτοῦ — «чтобы мы не дезертировали/не были дезертирами по отношению к Его воле». λειποτακτεῖν сохраняет военную окраску, а ἀπό обозначает удаление от воли. В черновике добавлено отсутствующее в оригинале «своего места»; кроме того, «покидать ... отступая» чрезмерно разворачивает один глагол в два действия.
  naturalness: «Не дезертировать от Его воли» — намеренно образное, но понятное и более краткое решение; оно естественнее, чем конструкция с «местом в строю» и не вводит дополнительного образного элемента. «Справедливо, чтобы» соответствует литературному увещательному регистру.
  terminology: «Дезертировать» обоснованно сохраняет военную метафору λειποτακτεῖν. «Его воля» точно передаёт τὸ θέλημα αὐτοῦ. Сноска должна объяснять оттенок, не называя расширенную парафразу «буквальным» переводом.
