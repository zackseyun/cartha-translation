id: 1CLEM.21.6
reference: 1 Clement 21:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: ru
  text: Будем благоговеть перед Господом Иисусом Христом[a], Кровь Которого была отдана за нас; будем с почтением относиться к тем, кто идёт впереди нас[b]; будем чтить старейшин[c]; будем воспитывать молодых в наставлении страха Божьего[d]; будем направлять наших жён[e] к добру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господом Иисусом Мессией».'
    reason: Χριστός — греческий титул со значением «Помазанник», то есть «Мессия».
  - marker: b
    text: 'Или: «к тем, кто руководит нами».'
    reason: οἱ προηγούμενοι может обозначать идущих впереди, предводителей или руководителей.
  - marker: c
    text: 'Или: «старших».'
    reason: πρεσβύτεροι может означать как общинных старейшин, так и старших по возрасту.
  - marker: d
    text: 'Возможно также: «в наставлении, исходящем из страха Божьего».'
    reason: Родительный τοῦ φόβου τοῦ θεοῦ допускает несколько смысловых связей с παιδεία.
  - marker: e
    text: Буквально то же слово может означать «наших женщин», однако здесь, вероятнее всего, имеются в виду жёны.
    reason: γυναῖκας допускает значения «женщины» и «жёны»; притяжательная конструкция и контекст поддерживают второе.
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: будем благоговеть перед
  rationale: Глагол выражает почтительный страх, стыдливое уважение или благоговение; в отношении Господа естественное русское «благоговеть перед» передаёт его направленность, не сводя значение к простому страху.
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: тех, кто идёт впереди нас
  rationale: Сохраняет буквальный образ тех, кто предшествует или стоит впереди, не решая без необходимости, идёт ли речь только об официальных руководителях.
- source_word: τοὺς πρεσβυτέρους
  choice: старейшин
  rationale: Передаёт обычное общинное значение слова; сноска сохраняет возможность понимать его шире как старших по возрасту.
- source_word: τοὺς νέους
  choice: молодых
  rationale: Это положительная степень «молодые», а не сравнительная «младшие».
- source_word: παιδεύσωμεν τὴν παιδείαν
  choice: будем воспитывать … в наставлении
  rationale: Естественно передаёт однокоренную греческую конструкцию, объединяющую воспитание, обучение и дисциплину.
- source_word: τὰς γυναῖκας ἡμῶν
  choice: наших жён
  rationale: Хотя γυνή может означать и женщину, и жену, притяжательное ἡμῶν в данном семейно-общинном контексте лучше всего указывает на жён.
- source_word: διορθωσώμεθα
  choice: будем направлять
  rationale: Передаёт побуждение исправлять, наставлять или направлять к добру, избегая излишне жёсткого русского «исправлять жён».
theological_decisions:
- issue: Значение Χριστός
  choice: Христос
  alternative: Мессия
  rationale: «Иисус Христос» — естественное и традиционное русское именование; сноска показывает, что Χριστός является титулом «Мессия».
- issue: Статус προηγούμενοι
  choice: те, кто идёт впереди нас
  alternative: наши руководители
  rationale: Греческое выражение допускает руководство, но формально не уточняет должность; основной текст сохраняет эту открытость.
- issue: Значение πρεσβύτεροι
  choice: старейшины
  alternative: старшие
  rationale: Общинный смысл вероятен, однако слово может обозначать и старших по возрасту; неоднозначность отмечена в сноске.
- issue: Связь παιδεία и φόβος θεοῦ
  choice: наставление страха Божьего
  alternative: наставление, происходящее из страха Божьего
  rationale: Родительный падеж может характеризовать содержание или источник наставления; компактная формулировка основного текста не ограничивает его только значением источника.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «будем» сохраняет риторический параллелизм греческих увещательных форм. «Кровь Которого» оформлено с традиционным почтительным прописным местоимением; лексика остаётся понятной широкому читателю.
