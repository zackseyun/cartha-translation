  source_fidelity: 'Текст точно передаёт ряд увещательных аористных конъюнктивов: благоговение перед Господом Иисусом Христом, почтение к προηγούμενοι, честь πρεσβύτεροι, воспитание νέοι и направление жён к благу. «Те, кто идёт впереди нас» удачно сохраняет образ и не предрешает, что речь идёт исключительно о должностных руководителях. «Наших жён» в данном контексте обоснованно передаёт γυναῖκας ἡμῶν. Формула «в наставлении страха Божьего» компактно отражает повтор παιδεύσωμεν / παιδεία и не устраняет возможную связь родительного падежа.'
