  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: ru
  text: Пусть они явят достойный любви нрав чистоты, покажут искренность своего кроткого настроя, а сдержанность своей речи сделают очевидной посредством молчания. Пусть они оказывают свою любовь не проявляя пристрастия, но свято и в равной мере ко всем боящимся Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιαγάπητον
  choice: достойный любви
  rationale: Сохраняет буквальный смысл редкого прилагательного и возвышенный тон, не сводя его просто к «прекрасный».
- source_word: ἁγνείας
  choice: чистоты
  rationale: Передаёт нравственную чистоту без необоснованного сужения значения до целомудрия.
- source_word: ἀκέραιον
  choice: непорочность
  rationale: В данном нравственном контексте обозначает цельность и безупречность; существительное естественно согласуется с конструкцией τὸ ... βούλημα.
- source_word: βούλημα
  choice: расположение
  rationale: Здесь речь вероятнее о внутренней направленности или складе воли, а не об отдельном намерении.
- source_word: ἐπιεικὲς
  choice: сдержанность
  rationale: В сочетании с языком и молчанием слово указывает на умеренность, мягкость и самообладание в речи.
- source_word: γλώσσης
  choice: речи
  rationale: Естественная русская передача метонимического «языка» как речевого поведения.
- source_word: προσκλίσεις
  choice: пристрастию
  rationale: Передаёт склонение в чью-либо пользу, то есть лицеприятную предпочтительность; единственное число по-русски идиоматичнее.
- source_word: ὁσίως
  choice: свято
  rationale: Сохраняет самостоятельное наречное указание на благочестивый, угодный Богу образ проявления любви.
theological_decisions:
- issue: Объём значения ἁγνεία
  choice: чистота
  alternative: целомудрие
  rationale: Греческое слово допускает связь с целомудрием, но в данном контексте прямо не ограничено половой нравственностью; более широкая передача сохраняет неоднозначность.
- issue: Связь наречия ὁσίως
  choice: отнесено к проявлению любви
  alternative: «ко всем, кто свято боится Бога»
  rationale: По расположению слов ὁσίως естественнее характеризует παρεχέτωσαν — то, как они оказывают любовь; такая пунктуационно-синтаксическая связь также соответствует параллельному английскому консультационному тексту.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранена четырёхчастная риторическая последовательность греческого текста; первые три повеления объединены в одно плавное предложение, последнее выделено. Формы «пусть они» не уточняют пол референта, как и греческие глагольные формы.
