id: 1CLEM.21.3
reference: 1 Clement 21:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: ru
  text: Посмотрим же, насколько Он близок и что ничто из наших мыслей и рассуждений, которые мы строим, не ускользнуло от Него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассуждений, которые мы составляем».'
    reason: Оборот διαλογισμῶν ὧν ποιούμεθα буквально связывает рассуждения с глаголом «делать, составлять»; возможен более формальный вариант, тогда как основной текст передаёт естественный смысл мыслительной деятельности.
lexical_decisions:
- source_word: ἴδωμεν
  choice: Посмотрим же
  rationale: Увещательное сослагательное первого лица множественного числа естественно передаётся призывом «посмотрим»; частица «же» поддерживает связность и достойный эпистолярный тон.
- source_word: πῶς ἐγγύς ἐστιν
  choice: как близок Он
  rationale: Сохраняется прямое пространственно-реляционное значение ἐγγύς без уточнения того, в каком именно смысле Он близок.
- source_word: οὐδὲν λέληθεν αὐτόν
  choice: от Него не скрыта ни одна
  rationale: 'Русская конструкция «от Него не скрыта» естественно передаёт результативный смысл перфекта λέληθεν: ничто не осталось незамеченным или сокрытым от Него.'
- source_word: ἐννοιῶν
  choice: мыслей
  rationale: В данном контексте ἔννοιαι обозначают внутренние мысли или замыслы; нейтральное «мысли» не сужает значение до намерений.
- source_word: διαλογισμῶν ὧν ποιούμεθα
  choice: рассуждений, которым мы предаёмся
  rationale: Передаёт внутреннюю мыслительную деятельность и медиальное ποιούμεθα естественным современным русским оборотом, не смешивая διαλογισμοί с более общим ἐννοίαι.
theological_decisions:
- issue: Неуказанный субъект местоимения αὐτόν
  choice: Сохранить местоименное обозначение «Он/Него» без добавления имени Бога
  alternative: Явно написать «Бог»
  rationale: Греческий текст предполагает субъект из контекста, но в самом стихе его не называет; перевод не должен устранять эту контекстуальную зависимость.
- issue: Характер божественной близости
  choice: Оставить выражение «как близок Он» без пояснения
  alternative: Уточнить как близость присутствия, суда или знания
  rationale: πῶς ἐγγύς ἐστιν допускает контекстуально насыщенное понимание; конкретизация внесла бы отсутствующее в стихе богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Синтаксический параллелизм «ни одна… ни одно…» сохраняет двойную греческую конструкцию и ясно различает мысли и рассуждения. Прописная буква в «Он/Него» уместна для референта в религиозном тексте, не добавляя его имени.
