  source_fidelity: Текст точно передаёт греческое высказывание. «Исследует мысли и намерения» естественно выражает ἐρευνητὴς ἐννοιῶν καὶ ἐνθυμήσεων; «дыхание» соответствует πνοή, а «отнимет его» адекватно передаёт ἀνελεῖ αὐτήν без излишнего пояснения. «Когда пожелает» сохраняет зависимость момента от воли Бога, выраженную ὅταν с сослагательным наклонением.
