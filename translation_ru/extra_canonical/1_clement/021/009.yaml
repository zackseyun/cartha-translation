id: 1CLEM.21.9
reference: 1 Clement 21:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: ru
  text: Ведь Он исследует мысли и намерения; Его дыхание — в нас, и когда пожелает, Он отнимет его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: исследует
  rationale: Передаёт значение того, кто тщательно испытывает или исследует сокровенное, естественной для современного русского языка глагольной конструкцией.
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  choice: мысли и намерения
  rationale: Сохраняет различие между внутренними мыслями и обдуманными побуждениями или замыслами, не делая его чрезмерно узким.
- source_word: πνοή
  choice: дыхание
  rationale: Прямое значение слова в данном контексте — дыхание как дар жизни; выбор также сохраняет образ исходящего от Бога жизненного дыхания.
- source_word: ἀνελεῖ
  choice: отнимет
  rationale: Передаёт устранение или взятие дыхания жизни без добавления отсутствующего в тексте пояснения о смерти.
theological_decisions:
- issue: Референт местоимений οὗ и αὐτοῦ
  choice: «Его» с прописной буквы, относящееся к Богу
  alternative: «того, чьё дыхание» или строчные местоимения
  rationale: Контекст прямо описывает Бога как исследующего внутреннее человека и распоряжающегося жизненным дыханием; прописная буква соответствует норме благоговейного русского религиозного текста, не добавляя нового содержания.
- issue: Значение πνοή как дыхания или духа
  choice: «дыхание»
  alternative: «дух» или «жизнь»
  rationale: «Дыхание» ближе к греческому слову и сохраняет образную и богословскую многозначность, тогда как «дух» либо «жизнь» преждевременно уточнили бы смысл.
- issue: Модальность ὅταν θέλῃ
  choice: «когда пожелает»
  alternative: «если пожелает» или «всякий раз, когда пожелает»
  rationale: Союз с сослагательным наклонением выражает неопределённый момент, зависящий от Божьей воли; «когда пожелает» естественно сохраняет это значение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Точка с запятой сохраняет тесную связь двух частей греческого предложения. Местоимение «его» после «отнимет» написано со строчной буквы, поскольку относится к дыханию.
