  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
translation:
  language: ru
  text: 'Ведь где-то сказано: «Дух Господа — светильник, исследующий внутренние покои чрева[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутренние помещения»; также возможно: «кладовые».'
    reason: Передаёт лексическую вариативность ταμιεῖα, сохраняя в основном тексте пространственную метафору греческого выражения.
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Ведь где-то сказано
  rationale: Передаёт вводную формулу неопределённого цитирования; безличная форма естественна по-русски.
- source_word: Πνεῦμα κυρίου
  choice: Дух Господа
  rationale: Прямое и богословски нейтральное соответствие греческому выражению.
- source_word: λύχνος
  choice: светильник
  rationale: Точнее передаёт древний переносной источник света, чем современное «лампа».
- source_word: ἐρευνῶν
  choice: исследующий
  rationale: Сохраняет активный образ тщательного проникновения и поиска.
- source_word: τὰ ταμιεῖα τῆς γαστρός
  choice: сокровенные глубины человеческого нутра
  rationale: ταμιεῖα здесь обозначает внутренние, скрытые помещения, а γαστήρ метафорически — внутреннее существо человека; перевод сохраняет телесную образность, избегая неуместно пищеварительного оттенка.
theological_decisions:
- issue: Референт выражения «Дух Господа» в цитате
  choice: Сохранено буквальное «Дух Господа» без пояснения
  alternative: Истолковать как человеческий дух, данный Господом, в соответствии с некоторыми формами текста Притч 20:27
  rationale: Греческий текст Климента прямо говорит Πνεῦμα κυρίου; перевод не должен молча устранять возможную текстовую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. «Нутро» сохраняет телесную метафору γαστήρ, а добавление «человеческого» делает её референт ясным без догматического истолкования.
