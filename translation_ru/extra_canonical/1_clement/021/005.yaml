source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: ru
  text: Лучше нам оскорбить людей глупых и неразумных, которые превозносятся и хвастаются своей надменной речью, чем Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκόψωμεν
  choice: вызвать недовольство
  rationale: В данном сопоставлении людей с Богом глагол передаёт смысл «дать повод к преткновению, задеть, вызвать неудовольствие». Буквальное «преткнуться» по-русски здесь было бы неясным и неестественным.
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: глупых и неразумных
  rationale: Сохранены два близких, но не полностью тождественных определения исходного текста.
- source_word: ἐπαιρομένοις
  choice: превозносятся
  rationale: Передаёт образ самовозвышения и надменности без излишне разговорного оттенка.
- source_word: ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: кичатся надменностью своих речей
  rationale: Сохраняет сочетание хвастовства с высокомерным характером их речи; множественное «речей» естественно по-русски выражает их высказывания.
theological_decisions:
- issue: Сопоставление недовольства людей и Бога
  choice: Повторить «вызвать недовольство» перед словом «Бога»
  alternative: «…чем Бога» или «…нежели преткнуться о Бога»
  rationale: Повтор устраняет возможную грамматическую двусмысленность и сохраняет нравственное напряжение исходного сравнения, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; тон увещевательный и достойный. Частица «уж» естественно усиливает предпочтение, выраженное μᾶλλον, а синтаксис остаётся понятным обычному читателю.
