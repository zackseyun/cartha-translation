id: 1CLEM.21.1
reference: 1 Clement 21:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: ru
  text: Смотрите, возлюбленные, как бы Его многочисленные благодеяния не обернулись судом для всех нас[a], если мы не будем жить достойно Его и в согласии делать то, что хорошо и угодно пред Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обернулись осуждением для всех нас».'
    reason: Указывает допустимое более узкое значение κρίμα, не устраняя смысловую неоднозначность основного текста.
lexical_decisions:
- source_word: εὐεργεσίαι
  choice: благодеяния
  rationale: Передаёт не просто «дары», а оказанные благодеяния и благосклонность благодетеля, сохраняя общественно-патрональный оттенок греческого слова.
- source_word: κρίμα
  choice: суд
  rationale: «Суд» сохраняет более широкий смысл греческого слова и не сужает его без необходимости до окончательного осуждения.
- source_word: πολιτευόμενοι
  choice: жить
  rationale: В контексте означает вести себя, строить свою жизнь определённым образом; «жить достойно Его» естественно звучит по-русски, хотя гражданский оттенок глагола неизбежно ослабляется.
- source_word: ὁμόνοια
  choice: согласие
  rationale: Сохраняет ключевую для послания тему общественного согласия как противоположности раздору и мятежу; точнее тематически, чем просто «единодушно».
- source_word: τὰ καλὰ καὶ εὐάρεστα
  choice: то, что хорошо и угодно
  rationale: Передаёт субстантивированные прилагательные естественной русской конструкцией, причём «угодно пред Ним» сохраняет явную ориентацию на Божью оценку.
theological_decisions:
- issue: Значение κρίμα
  choice: суд
  alternative: осуждение
  rationale: Греческое κρίμα может обозначать как судебный приговор, так и осуждение. Основной текст сохраняет эту широту, а примечание указывает более строгое возможное понимание.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. «Смотрите, возлюбленные» сохраняет прямое обращение; «благодеяния», «суд» и «в согласии» поддерживают общественно-нравственную лексику оригинала без искусственной архаизации.
