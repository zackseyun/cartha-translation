revisions:
- from: Пусть наши дети приобщаются к наставлению в Мессии. Пусть они узнают, чего достигает смирение перед Богом[a], на что способна чистая любовь перед Богом, как благ и велик страх перед Ним и как он спасает всех, кто благочестиво живёт в нём[b] с чистотой помыслов.
  to: Пусть наши дети приобщаются к воспитанию в Мессии. Пусть они узнают, что может смирение перед Богом[a], на что способна чистая любовь перед Богом, как благ и велик страх перед Ним и как он спасает всех, кто благочестиво живёт в нём[b] в чистоте помыслов.
  rationale: Внесены только безопасные языковые и семантические уточнения. «Воспитание» точнее охватывает παιδεία, чем «наставление», а «что может смирение» точнее передаёт τί … ἰσχύει. Сохранены «Мессия», повтор «перед Богом», спасительное значение σῴζων и подлинная неоднозначность ἐν αὐτῷ.
