id: 1CLEM.21.8
reference: 1 Clement 21:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: ru
  text: Пусть наши дети приобщаются к воспитанию в Мессии. Пусть они узнают, что может смирение перед Богом[a], на что способна чистая любовь перед Богом, как благ и велик страх перед Ним и как он спасает всех, кто благочестиво живёт в нём[b] в чистоте помыслов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какую силу имеет смирение перед Богом».'
    reason: Греческое τί … ἰσχύει буквально выражает силу или действенность смирения.
  - marker: b
    text: Выражение «в нём» может относиться либо к Богу, либо к страху перед Ним.
    reason: Местоимение ἐν αὐτῷ грамматически может соотноситься как с Богом, подразумеваемым в αὐτοῦ, так и с ближайшим существительным ὁ φόβος («страх»); контекст не устраняет неоднозначность полностью.
lexical_decisions:
- source_word: παιδείας
  choice: наставлению
  rationale: Здесь слово обозначает формирующее обучение и воспитание; «наставление» естественно по-русски и не сужает смысл до наказания или строгой дисциплины.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Передаёт мессианский титул Χριστός и сохраняет конструкцию с ἐν, не превращая её в простое указание на источник наставления.
- source_word: ἰσχύει
  choice: достигает
  rationale: В сочетании с τί выражает действенность или силу смирения перед Богом; оборот «чего достигает» естественен и соответствует синтаксису.
- source_word: ἀγάπη ἁγνή
  choice: чистая любовь
  rationale: Прямо передаёт нравственную чистоту любви без добавочного конфессионального смысла.
- source_word: ὁσίως ἀναστρεφομένους
  choice: благочестиво живёт
  rationale: ἀναστρέφομαι обозначает образ жизни и поведения, а ὁσίως — благочестивый, святой характер этой жизни.
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: с чистотой помыслов
  rationale: Естественная русская передача чистоты внутреннего мышления и намерений; избегает неестественного буквального оборота «в чистом уме».
theological_decisions:
- issue: Референт местоимения ἐν αὐτῷ
  choice: сохранено неоднозначное «в нём»
  alternative: «в Боге» или «в страхе перед Ним»
  rationale: Грамматически местоимение мужского рода может соотноситься с ближайшим ὁ φόβος («страх») либо с Богом, обозначенным в αὐτοῦ. Основной текст не устраняет эту подлинную неоднозначность.
- issue: Значение σῴζων
  choice: «спасает»
  alternative: «сохраняет» или «оберегает»
  rationale: Основное значение в данном религиозно-нравственном контексте — «спасает»; более общее значение возможно, но контекст не требует ослаблять формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещательным тоном. Повтор «перед Богом» сохранён как элемент риторического параллелизма оригинала; местоимения при упоминании Бога оформлены по русской религиозной издательской традиции, тогда как неоднозначное «в нём» оставлено со строчной буквы, чтобы не предрешать референт.
