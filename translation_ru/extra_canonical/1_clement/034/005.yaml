source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: ru
  text: 'Пусть наша похвальба и наша смелость будут в Нём. Покоримся Его воле. Вдумаемся во всё множество Его ангелов: как они, стоя перед Ним, служат Его воле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καύχημα
  choice: хвала
  rationale: В данном увещевательном контексте слово обозначает то, чем хвалятся или гордятся; «хвала» естественно передаёт положительный смысл без оттенка тщеславия.
- source_word: ἡ παρρησία
  choice: смелость
  rationale: Передаёт открытую уверенность и дерзновение; современному читателю понятнее, чем церковнославянизм «дерзновение».
- source_word: ὑποτασσώμεθα
  choice: покоримся
  rationale: Сохраняет побудительный оттенок аористного конъюнктива и идею добровольного подчинения.
- source_word: κατανοήσωμεν
  choice: вдумаемся
  rationale: Глагол призывает не просто посмотреть, а внимательно осмыслить.
- source_word: λειτουργοῦσιν
  choice: служат
  rationale: В отношении ангелов означает исполнение служения; более узкое «совершают богослужение» здесь не требуется.
- source_word: παρεστῶτες
  choice: предстоя Ему
  rationale: Причастие означает стояние рядом или перед кем-либо в готовности служить; дополнение «Ему» ясно из контекста и делает русскую фразу естественной.
theological_decisions:
- issue: Направленность ангельского служения в выражении τῷ θελήματι αὐτοῦ λειτουργοῦσιν
  choice: служат Его воле
  alternative: служат Ему по Его воле
  rationale: Сохранён необычный греческий дательный «Его воле», не заменённый более привычной богословски сглаженной формулой.
- issue: Отнесение местоимения αὐτῷ
  choice: Им будет наша хвала и в Нём — наша смелость
  alternative: в Нём да будут наша хвала и наша смелость
  rationale: Сохранено отнесение к Богу из контекста и общий локативный смысл ἐν αὐτῷ, при этом для «хвалы» использована естественная русская конструкция.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещевательным звучанием. Заглавные местоимения обозначают Бога по принятой русской издательской традиции; архаизмы сведены к понятному и уместному «предстоя».
