source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἀγαθὸς ἐργάτης μετὰ παρρησίας λαμβάνει τὸν ἄρτον τοῦ ἔργου αὐτοῦ, ὁ νωθρὸς καὶ παρειμένος οὐκ ἀντοφθαλμεῖ τῷ ἐργοδότῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: ru
  text: Добрый работник смело получает хлеб за свой труд, а ленивый и нерадивый не может взглянуть в глаза своему нанимателю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἐργάτης
  choice: добрый работник
  rationale: Сохраняет нравственную оценку ἀγαθός и обычное значение ἐργάτης; «добрый» здесь означает хорошего, исправного работника.
- source_word: μετὰ παρρησίας
  choice: смело
  rationale: Передаёт уверенность и открытость, с которой исправный работник вправе получить положенное.
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: хлеб за свой труд
  rationale: Сохраняет образ хлеба как заработанного пропитания, избегая неестественного буквального оборота «хлеб своего труда».
- source_word: ὁ νωθρὸς καὶ παρειμένος
  choice: ленивый и нерадивый
  rationale: νωθρός обозначает вялость или леность, а παρειμένος — расслабленность, запущенность и отсутствие усердия.
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: не смеет взглянуть в глаза
  rationale: Глагол буквально выражает способность смотреть прямо в лицо; в контексте подразумевает отсутствие уверенности перед нанимателем.
- source_word: τῷ ἐργοδότῃ αὐτοῦ
  choice: своему нанимателю
  rationale: Точно передаёт лицо, которое предоставляет работу; современнее и яснее, чем «работодатель» в данном нравоучительном контексте.
