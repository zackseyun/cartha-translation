review_pass:
  verdict: revise
  source_fidelity: 'Греческое μὴ ... μηδέ соединяет два качества в кумулятивном отрицании: не быть ни ленивыми, ни небрежными. Формулировка «праздными или нерадивыми» ослабляет это соединение. Кроме того, ἐπὶ πᾶν ἔργον ἀγαθόν лучше передавать как направленность на/в отношении всякого доброго дела, а не как «ни в одном добром деле», что несколько меняет построение и охват выражения.'
  naturalness: «Ленивыми и небрежными во всяком добром деле» — естественная современная литературная русская формулировка, сохраняющая нравственно-увещевательный регистр. «Праздными» возможно, но в данном сочетании менее прямо передаёт ἀργούς.
  terminology: «Верующих в него всем сердцем» адекватно передаёт πιστεύοντας ... ἐπ᾽ αὐτῷ и не вносит конфессиональных уточнений. Строчная буква в местоимении воспроизводит неназванность подлежащего в самом греческом предложении и соответствует английской контрольной версии; референт определяется контекстом.
  issues:
  - severity: medium
    issue: Союз «или» вместо кумулятивного отрицания μὴ ... μηδέ
    rationale: Греческий текст запрещает оба состояния, а не представляет их как альтернативы; по-русски это точнее передаётся «не быть ленивыми и небрежными».
  - severity: medium
    issue: «Ни в одном добром деле» вместо передачи ἐπὶ πᾶν ἔργον ἀγαθόν
    rationale: Такое отрицательное переразложение допустимо по смыслу, но менее близко к греческой направленности на всякое доброе дело и может звучать как утверждение о каждом отдельном случае. «Во всяком добром деле» сохраняет πᾶν непосредственнее.
  - severity: low
    issue: Прописная буква в «Он/Него»
    rationale: В исходном предложении подлежащее не названо. Строчная буква не предрешает референта вне контекста и согласуется с английским audit trail, не меняя смысла.
  revised_text: Итак, он призывает нас, верующих в него всем сердцем, не быть ленивыми и небрежными во всяком добром деле.
