  text: προτρέπεται οὖν ἡμᾶς πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ, μὴ ἀργοὺς μηδὲ παρειμένους εἶναι ἐπὶ πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/004.yaml
  text: Therefore he urges us, who believe in him with our whole heart, not to be idle or negligent in every good work.
translation:
  language: ru
  text: Итак, он призывает нас, верующих в него всем сердцем, не быть ленивыми и небрежными во всяком добром деле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  choice: призывает
  rationale: Передаёт побуждение и увещание естественным для современного литературного русского языка глаголом.
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: верующих в Него всем сердцем
  rationale: Сохраняет значение упования или веры, направленной на Него, и естественно передаёт греческое выражение ἐξ ὅλης τῆς καρδίας.
- source_word: ἀργοὺς μηδὲ παρειμένους
  choice: праздными или нерадивыми
  rationale: «Праздными» передаёт бездеятельность, а «нерадивыми» — ослабленность усердия и небрежение; союз «или» естественно выражает парное отрицание μὴ ... μηδέ.
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: ни в одном добром деле
  rationale: 'При отрицательной конструкции русское «ни в одном» идиоматично передаёт охват πᾶν: призыв не допускать праздности или нерадения в каком-либо добром деле.'
theological_decisions:
- issue: Референт подразумеваемого подлежащего в προτρέπεται
  choice: Он
  alternative: он
  rationale: Греческая форма не называет подлежащее внутри данного стиха; местоимение сохранено без поясняющей вставки. Прописная буква уместна при подразумеваемом божественном референте в контексте, но не добавляет имени или титула.
translation_notes:
  register: Современный литературный русский язык с dignified церковно-нравственным тоном без архаизмов; синтаксис близок к греческому, но естественен по-русски.
