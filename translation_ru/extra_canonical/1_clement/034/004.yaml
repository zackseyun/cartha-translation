  rationale: Исправлены союзное соотношение μὴ ... μηδέ и передача ἐπὶ πᾶν ἔργον ἀγαθόν; сохранены порядок мысли, неназванный референт местоимения и значение веры, направленной на него.
  reviewer_model: gpt-5.6-terra
