source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: ru
  text: Итак, и мы, собравшись вместе в единодушии и осознанно, будем усердно взывать к Нему словно из одних уст, чтобы стать причастниками Его великих и славных обещаний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁμονοίᾳ
  choice: в единодушии
  rationale: Передаёт согласие и единство собравшихся естественным и достойным русским выражением.
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: собравшись вместе
  rationale: Оборот ἐπὶ τὸ αὐτό здесь естественно выражает совместность собрания; буквальное указание на одно место избыточно и не обязательно.
- source_word: τῇ συνειδήσει
  choice: с единым сознанием
  rationale: Сохраняет отдельный от ὁμόνοια смысл συνείδησις и допускает оттенки общего внутреннего настроя и сознательной устремлённости.
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: словно едиными устами
  rationale: Сохраняет яркий образ согласного общего возгласа и естественно звучит по-русски.
- source_word: ἐκτενῶς
  choice: усердно
  rationale: Передаёт напряжённость, горячность и настойчивость обращения без неестественного буквализма.
- source_word: μετόχους
  choice: причастниками
  rationale: Точно выражает участие и получение доли в обещанном, сохраняя возвышенный регистр.
- source_word: ἐπαγγελιῶν
  choice: обещаний
  rationale: Прямой современный эквивалент, не сужающий значение до какого-либо конфессионально закреплённого термина.
theological_decisions:
- issue: Связь единодушия и συνείδησις
  choice: 'Сохранены оба понятия: «в единодушии и с единым сознанием».'
  alternative: 'Слить их в одно выражение: «в полном единомыслии».'
  rationale: Греческий текст называет ὁμόνοια и συνείδησις раздельно; перевод не должен устранять возможное различие между общим согласием и внутренним сознанием или настроем.
- issue: Целевая конструкция εἰς τὸ μετόχους ἡμᾶς γενέσθαι
  choice: «чтобы стать причастниками»
  alternative: «и тогда мы станем причастниками».
  rationale: Сохранена целевая направленность общего взывания, не утверждая механической причинности или гарантированного результата.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным церковно-нравственным регистром. Синтаксис слегка упрощён ради ясности, при этом сохранены параллельные образы единодушного собрания и взывания едиными устами.
