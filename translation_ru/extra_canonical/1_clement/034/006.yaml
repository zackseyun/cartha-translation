source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: ru
  text: 'Ведь Писание говорит: «Мириады мириад стояли перед Ним, и тысячи тысяч служили Ему», — и они восклицали: «Свят, свят, свят Господь Саваоф[a]; всё творение полно Его славы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Саваоф — передача еврейского слова, означающего «Воинства»; титул можно понять как «Господь Воинств».
    reason: Поясняет непрозрачный для многих современных читателей божественный титул, не заменяя его в основном тексте интерпретирующим переводом.
lexical_decisions:
- source_word: μύριαι μυριάδες
  choice: мириады мириад
  rationale: Прямая и выразительная передача неопределённо огромного множества без сведения образа к точному числу.
- source_word: παρειστήκεισαν αὐτῷ
  choice: стояли перед Ним
  rationale: Естественная русская передача пребывания в присутствии Бога; не добавляет отсутствующего в греческом уточнения о поклонении.
- source_word: ἐλειτούργουν αὐτῷ
  choice: служили Ему
  rationale: Передаёт служение небесных существ без неоправданного сужения значения до храмового обряда.
- source_word: ἐκέκραγον
  choice: восклицали
  rationale: Сохраняет значение громкого, торжественного возглашения и звучит естественно в данном контексте.
- source_word: κύριος σαβαώθ
  choice: Господь Саваоф
  rationale: Сохраняет традиционную библейскую форму титула и его узнаваемость в русском языке.
- source_word: πᾶσα ἡ κτίσις
  choice: всё творение
  rationale: Следует тексту Климента, где стоит κτίσις («творение»), а не подменяет его формулировкой «вся земля» из Ис 6:3.
theological_decisions:
- issue: Объём πᾶσα ἡ κτίσις
  choice: всё творение
  alternative: вся земля
  rationale: Перевод сохраняет именно формулировку греческого текста 1 Климента и не гармонизирует её с известной ветхозаветной формой цитаты.
- issue: Передача титула σαβαώθ
  choice: Саваоф с пояснением в сноске
  alternative: Господь Воинств
  rationale: Транслитерация сохраняет форму исходного текста и русскую библейскую традицию, а сноска делает значение доступным современному читателю.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прописные местоимения «Ним», «Ему», «Его» использованы последовательно как редакционная норма почтительного обозначения Бога; в греческом тексте регистр букв этого различия не выражает.
