  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: ru
  text: 'Ведь Он говорит: «Не видел глаз, не слышало ухо, и не приходило человеку на сердце то, что Он приготовил для тех, кто терпеливо ожидает Его».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и не взошло на сердце человеку»; это библейский оборот со значением «не приходило человеку на сердце (на ум)».'
    reason: Сохраняет доступ к буквальной форме греческого ἀνέβη ἐπὶ καρδίαν и поясняет идиоматический смысл без неясной кальки в основном тексте.
lexical_decisions:
- source_word: λέγει γάρ
  choice: Ведь Он говорит
  rationale: γάρ передано причинно-пояснительным «ведь»; подразумеваемый говорящий в формуле цитирования — Бог, поэтому местоимение дано с прописной буквы.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: не приходило на сердце человеку
  rationale: Сохранён библейский образ сердца и естественно передан семитский оборот со значением «не приходило на ум / сердце», без неясной буквальной кальки «не восходило на сердце».
- source_word: ὅσα
  choice: то, что
  rationale: В контексте вводит совокупность приготовленного; русский оборот естественнее буквального «сколько всего».
- source_word: ἡτοίμασεν
  choice: Он приготовил
  rationale: Аорист передан завершённым действием; подразумеваемый субъект — Бог.
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: для тех, кто терпеливо ожидает Его
  rationale: ὑπομένω обычно означает стойко переносить или оставаться, но с личным объектом здесь естественно выражает терпеливое, стойкое ожидание; компонент выдержки сохранён наречием «терпеливо».
theological_decisions:
- issue: Значение ὑπομένουσιν αὐτόν
  choice: тех, кто терпеливо ожидает Его
  alternative: тех, кто стойко держится Его / претерпевает ради Него
  rationale: Личный объект допускает контекстуальный смысл ожидания, засвидетельствованный консультационным английским текстом, однако глагол несёт оттенок стойкости; перевод не сводит его к нейтральному «ждёт».
- issue: Референт подразумеваемого субъекта λέγει и ἡτοίμασεν
  choice: Он / Его с прописной буквы
  alternative: он / его со строчной буквы
  rationale: Формула «Он говорит» вводит речь Писания как Божью, а приготовивший блага и ожидаемый — Бог; прописная буква соответствует достоинству русского религиозного регистра, не добавляя отдельного догматического определения.
translation_notes:
  register: Современный литературный русский с сохранением торжественного библейского ритма и трёхчастного параллелизма. Инверсия «не видел глаз, не слышало ухо» намеренно сохранена как узнаваемая и естественная для цитаты; архаизмы вне этой поэтической формулы избегаются.
