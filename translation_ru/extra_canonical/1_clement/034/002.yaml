  yaml_path: translation/extra_canonical/1_clement/034/002.yaml
  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: ru
  text: Поэтому нам следует с готовностью делать добро, ведь всё — от Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖν ... ἐστὶ
  choice: нам следует
  rationale: Передаёт безличную необходимость естественным современным русским оборотом, не усиливая её до категорического «мы обязаны».
- source_word: προθύμους ... εἶναι
  choice: ревностно
  rationale: Выражает готовность, усердие и горячее стремление к действию; вместе с инфинитивом «творить» образует естественную русскую фразу.
- source_word: εἰς ἀγαθοποιΐαν
  choice: творить добро
  rationale: Передаёт направленность к активному доброделанию, сохраняя возвышенный, но понятный регистр.
- source_word: ἐξ αὐτοῦ
  choice: от Него
  rationale: Сохраняет исходное значение происхождения или источника. Местоимение написано с прописной буквы как отсылка к Богу в непосредственном контексте.
- source_word: τὰ πάντα
  choice: всё
  rationale: Естественный русский эквивалент обобщающего выражения «все вещи / всё сущее».
theological_decisions:
- issue: Смысл выражения ἐξ αὐτοῦ γάρ ἐστιν τὰ πάντα
  choice: ведь всё — от Него
  alternative: ведь всё исходит от Него
  rationale: Формулировка сохраняет широкое утверждение об источнике всего и не уточняет без основания, идёт ли речь о творении, дарах, способности делать добро или обо всём этом вместе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным церковно-нравственным оборотом «творить добро». Синтаксис краткий и ясный; причинная связь γάρ передана словом «ведь».
