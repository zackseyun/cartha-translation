  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: ru
  text: 'Ведь Он заранее говорит нам: «Вот Господь, и награда Его перед Ним, чтобы воздать каждому по делам его»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. «согласно его делу» (ἔργον — единственное число); по-русски естественнее: «по делам его».'
    reason: Уточняет, что русское множественное число в устойчивом выражении передаёт греческое единственное число, не меняя смысла.
lexical_decisions:
- source_word: προλέγει
  choice: заранее говорит
  rationale: Передаёт основное значение «говорить заранее», не добавляя более узкого оттенка предостережения.
- source_word: ὁ μισθὸς αὐτοῦ
  choice: награда Его
  rationale: В данном контексте μισθός означает воздаяние или награду; выбран привычный и ясный русский эквивалент.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: перед Ним
  rationale: Естественно по-русски передаёт пространственный образ греческого выражения «перед лицом Его» без излишней буквальности.
- source_word: ἀποδοῦναι
  choice: чтобы воздать
  rationale: Инфинитив цели передан конструкцией «чтобы»; «воздать» сохраняет смысл ответного вознаграждения или суда.
- source_word: κατὰ τὸ ἔργον αὐτοῦ
  choice: по делам его
  rationale: Русская идиоматическая формула сохраняет распределительное воздаяние в соответствии с поступками каждого; единственное число собирательно передано множественным.
theological_decisions:
- issue: Характер воздаяния
  choice: воздать каждому по делам его
  alternative: вознаградить каждого за его дело
  rationale: «Воздать» сохраняет открытость контекста как для награды, так и для суда и не сужает богословский смысл до положительного вознаграждения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Господу, написаны с прописной буквы; местоимение, относящееся к каждому человеку, — со строчной.
