  source_fidelity: 'Перевод точно передаёт последовательность и образы греческого текста: два вопроса, затем три условных высказывания. «Куда я пойду» адекватно передаёт Ποῦ ἀφίξω в естественном русском; «скроюсь от лица Твоего», «самые края земли», «десница Твоя», «в безднах» и «Дух Твой» сохраняют лексику и образность источника. «Если лягу» — допустимая, не перегруженная передача καταστρωθῶ; она не вводит отсутствующее в греческом слово «постель».'
