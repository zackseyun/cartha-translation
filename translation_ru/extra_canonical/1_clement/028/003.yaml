base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: ru
  text: «Куда я пойду и где скроюсь от лица Твоего? Если взойду на небо — Ты там; если уйду на самые края земли — там десница Твоя; если лягу в безднах — там Дух Твой».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποῦ ἀφίξω
  choice: Куда я пойду
  rationale: Глагол ἀφικνέομαι здесь передаёт прибытие или уход в какое-либо место; естественное русское «куда я пойду» сохраняет направительный смысл вопроса.
- source_word: κρυβήσομαι ἀπὸ τοῦ προσώπου σου
  choice: скроюсь от лица Твоего
  rationale: Сохранён библейский образ «лица», обозначающий непосредственное присутствие Бога.
- source_word: τὰ ἔσχατα τῆς γῆς
  choice: самые края земли
  rationale: Передаёт пространственный образ пределов земли, не уточняя его сверх греческого текста.
- source_word: ἡ δεξιά σου
  choice: десница Твоя
  rationale: Традиционное и понятное в возвышенном библейском регистре обозначение правой руки, сохраняющее образ силы и присутствия.
- source_word: καταστρωθῶ
  choice: лягу
  rationale: Форма допускает смысл «лечь, улечься»; краткое «лягу» не добавляет отсутствующего в тексте объекта вроде постели.
- source_word: τὰς ἀβύσσους
  choice: безднах
  rationale: Множественное число греческого текста сохранено; слово передаёт глубочайшие, недоступные области.
- source_word: τὸ πνεῦμά σου
  choice: Дух Твой
  rationale: Сохранено прямое соответствие πνεῦμα и открытая богословская связь Духа с Божьим присутствием.
theological_decisions:
- issue: Божье присутствие в небесах, на краях земли и в безднах
  choice: Сохранить параллельные утверждения «Ты там», «там десница Твоя», «там Дух Твой»
  alternative: Унифицировать все три выражения как общее «Ты там»
  rationale: Разнообразие исходных образов богословски значимо и не должно сглаживаться.
- issue: Значение «Дух Твой»
  choice: Оставить без поясняющего истолкования
  alternative: Передать как «Твоё присутствие» или «Твоё дыхание»
  rationale: Греческое πνεῦμα сохраняет смысловую и богословскую многозначность, которую перевод не должен разрешать.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма; «десница» сохранена ради узнаваемого поэтического параллелизма.
