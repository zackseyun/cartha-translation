base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: ru
  text: 'Ибо куда кто-нибудь из нас может убежать от Его могучей руки? И какой мир примет кого-нибудь из тех, кто отступает от Него? Ведь Писание говорит в одном месте:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιᾶς χειρός
  choice: могучей руки
  rationale: Передаёт образ непреодолимой силы Божьей руки естественным и возвышенным современным русским языком.
- source_word: κόσμος
  choice: мир
  rationale: 'Сохраняет широкое и намеренно риторическое значение греческого слова: никакая область мироздания не сможет укрыть беглеца.'
- source_word: τῶν αὐτομολούντων
  choice: того, кто перебежал
  rationale: Военный по оттенку глагол означает самовольный переход на другую сторону, дезертирство; «перебежал» сохраняет этот образ без чрезмерно специальной формулировки.
- source_word: τὸ γραφεῖον
  choice: Писание
  rationale: В данном контексте слово обозначает авторитетный письменный текст, из которого далее приводится цитата.
- source_word: λέγει γάρ που
  choice: Ведь Писание говорит в одном месте
  rationale: που здесь указывает на неопределённое место цитирования; «в одном месте» естественно передаёт эту формулу по-русски.
theological_decisions:
- issue: Образ ухода от Бога в αὐτομολούντων
  choice: кто перебежал от Него
  alternative: кто бежит от Него / кто отступил от Него
  rationale: Выбранный вариант не сводит выражение к простому бегству и сохраняет содержащийся в оригинале образ дезертирства или перехода на другую сторону, не превращая его в конфессионально нагруженный термин.
- issue: Риторическая возможность укрыться от Бога
  choice: Сохранены два открытых риторических вопроса
  alternative: Передать как категорическое утверждение о невозможности бегства
  rationale: Греческий текст выражает богословскую мысль вопросами; прямое утверждение устранило бы литературную форму и часть напряжения оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сохранён ясным и риторическим; двоеточие вводит следующую за данным стихом цитату.
