    issue: Оборот «того, кто перебежал от Него»
    rationale: '«Перебежать от кого-либо» по-русски требует указания стороны, к которой переходят, и потому звучит шероховато. Кроме того, форма «перебежал» представляет уход как завершённый поступок, тогда как τῶν αὐτομολούντων — обобщающее настоящее причастие: «из тех, кто отступает/дезертирует».'
