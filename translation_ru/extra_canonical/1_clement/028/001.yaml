source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: ru
  text: Итак, поскольку всё видят и слышат, будем бояться Его и оставим нечистые желания совершать злые дела, чтобы по Его милости мы были укрыты от грядущих судов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων οὖν βλεπομένων καὶ ἀκουομένων
  choice: Итак, поскольку всё видимо и слышимо
  rationale: Абсолютный генитив передан причинно-обстоятельственным оборотом; пассивная формулировка оригинала сохранена и не дополнена прямо названным наблюдателем.
- source_word: φοβηθῶμεν αὐτόν
  choice: будем бояться Его
  rationale: Увещательный аористный конъюнктив передан естественной русской формой совместного призыва; местоимение сохраняет отсылку к Богу.
- source_word: ἀπολίπωμεν
  choice: оставим
  rationale: Передаёт призыв отказаться и отойти от названных желаний без избыточного толкования.
- source_word: φαύλων ἔργων μιαρὰς ἐπιθυμίας
  choice: нечистые желания совершать злые дела
  rationale: 'Родительный φαύλων ἔργων понят как объективный: желания направлены на злые дела. Инфинитивальная конструкция звучит по-русски естественно.'
- source_word: τῷ ἐλέει αὐτοῦ σκεπασθῶμεν
  choice: по Его милости укрыться нам
  rationale: Дательный передан как основание или средство спасительного укрытия; σκεπασθῶμεν сохраняет образ защиты.
- source_word: ἀπὸ τῶν μελλόντων κριμάτων
  choice: от грядущих судов
  rationale: Сохранены множественное число и эсхатологическая направленность μέλλοντα без уточнения характера отдельных судов.
theological_decisions:
- issue: Кто видит и слышит всё
  choice: 'Сохранена безличная пассивная формулировка: «всё видимо и слышимо»'
  alternative: «Бог всё видит и слышит»
  rationale: Контекст явно подразумевает Бога, однако греческий текст в этой фразе прямо Его не называет; перевод не устраняет формальную неоднозначность.
- issue: Связь милости, нравственного отказа и избавления от суда
  choice: Сохранена последовательность призыва и цели без догматического пояснения
  alternative: Уточнить, является ли отказ от желаний условием, доказательством или следствием милости
  rationale: ἵνα выражает цель, а текст не формулирует более подробной сотериологической схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сделан ясным для широкого читателя, при этом сохранены пассивность начального оборота, образ укрытия милостью и множественное число «судов».
