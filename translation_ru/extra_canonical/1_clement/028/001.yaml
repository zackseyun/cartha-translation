revisions:
- from: Итак, поскольку всё видимо и слышимо, будем бояться Его и оставим нечистые желания совершать злые дела, чтобы по Его милости укрыться нам от грядущих судов.
  to: Итак, поскольку всё видят и слышат, будем бояться Его и оставим нечистые желания совершать злые дела, чтобы по Его милости мы были укрыты от грядущих судов.
  rationale: Исправлены только начальный пассивный оборот, чтобы передать совершение действия, а не возможность восприятия, и заключительная конструкция, чтобы сделать русский синтаксис естественнее при сохранении пассивного образа защиты. Формальная неназванность того, кто видит и слышит, сохранена неопределённо-личной конструкцией.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:07:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальное «всё видимо и слышимо» в современном русском обычно описывает доступность для зрения и слуха, а не то, что всё действительно видят и слышат. Это ослабляет смысл греческого абсолютного генитива Πάντων ... βλεπομένων καὶ ἀκουομένων. Остальные основные связи переданы верно: совместный призыв, желания, направленные на злые дела, милость как основание/средство защиты и множественное число грядущих судов.'
  naturalness: «Поскольку всё видят и слышат» — естественная русская неопределённо-личная передача без прямого называния наблюдателя. «Чтобы по Его милости мы были укрыты» сохраняет пассивный образ σκεπασθῶμεν и звучит яснее, чем инвертированное «укрыться нам».
  terminology: «Нечистые желания совершать злые дела» адекватно передаёт μιαρὰς ἐπιθυμίας φαύλων ἔργων как желания, направленные на злые дела. «Грядущие суды» сохраняет число и эсхатологическую перспективу κριμάτων. Местоимение «Его» уместно по контексту и соответствует αὐτόν/αὐτοῦ.
  issues:
  - severity: medium
    issue: «Всё видимо и слышимо»
    rationale: В русском «видимо и слышимо» обычно означает «может быть увидено и услышано», тогда как βλεπομένων καὶ ἀκουομένων означает, что всё видят и слышат. Следует передать фактическое наблюдение, не называя субъекта прямо.
  - severity: low
    issue: «чтобы по Его милости укрыться нам»
    rationale: Порядок слов тяжеловесен для современного литературного русского; кроме того, личная форма «мы были укрыты» точнее сохраняет пассив σκεπασθῶμεν.
  revised_text: Итак, поскольку всё видят и слышат, будем бояться Его и оставим нечистые желания совершать злые дела, чтобы по Его милости мы были укрыты от грядущих судов.
  revised_footnotes: []
  revision_rationale: Исправлены только начальный пассивный оборот, чтобы передать совершение действия, а не возможность восприятия, и заключительная конструкция, чтобы сделать русский синтаксис естественнее при сохранении пассивного образа защиты. Формальная неназванность того, кто видит и слышит, сохранена неопределённо-личной конструкцией.
