  yaml_path: translation/extra_canonical/1_clement/028/004.yaml
  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: ru
  text: Куда же тогда можно уйти или где укрыться от Того, Кто объемлет всё?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ οὖν τις ἀπέλθῃ
  choice: Куда же тогда можно уйти
  rationale: Передаёт риторический вопрос и неопределённое τις естественной безличной конструкцией; οὖν выражено сочетанием «же тогда».
- source_word: ποῦ ἀποδράσῃ
  choice: где укрыться
  rationale: В данном контексте ἀποδράσῃ означает ускользнуть или спастись бегством; «укрыться» естественно продолжает тему невозможности скрыться от Бога.
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: от Того, Кто объемлет всё
  rationale: Сохраняет субстантивированное причастие и смысл всеохватности; «объемлет» соответствует возвышенному, но понятному регистру.
theological_decisions:
- issue: Указание на Бога без явного существительного в греческом тексте
  choice: Того, Кто
  alternative: того, кто
  rationale: Контекст однозначно указывает на Бога; прописные буквы служат уважительным русским оформлением, не добавляя отдельного титула или конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, раннехристианскому тексту подходящим звучанием. Риторическая форма и образ всеохватности сохранены.
