id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: ru
  text: Не все — военачальники[a], тысяченачальники, сотники, пятидесятники и так далее по порядку; но каждый в своём чине исполняет повеления, данные царём и начальниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правители»; греческое слово может обозначать высших начальников или наместников.'
    reason: Точное административно-военное значение ἔπαρχοι зависит от контекста и не исчерпывается одним русским титулом.
lexical_decisions:
- source_word: ἔπαρχοι
  choice: военачальники
  rationale: В контексте упорядоченной военной иерархии слово обозначает высших начальников; «военачальники» понятно современному читателю и не требует переноса конкретного римского титула.
- source_word: χιλίαρχοι
  choice: тысяченачальники
  rationale: Сохраняет буквальное обозначение начальников над тысячей и параллелизм с последующими чинами.
- source_word: ἑκατόνταρχοι
  choice: сотники
  rationale: Устоявшийся и понятный русский эквивалент начальника над сотней.
- source_word: πεντηκόνταρχοι
  choice: пятидесятники
  rationale: Передаёт чин начальника над пятьюдесятью и сохраняет нисходящую последовательность.
- source_word: τὸ καθεξῆς
  choice: и так далее по порядку
  rationale: Передаёт не только продолжение перечня, но и упорядоченную последовательность чинов.
- source_word: τάγματι
  choice: чине
  rationale: Здесь речь идёт о месте каждого в военной иерархии; «в своём чине» естественно выражает эту мысль по-русски.
- source_word: ἐπιτελεῖ
  choice: исполняет
  rationale: Точно передаёт доведение предписанного до исполнения.
- source_word: τῶν ἡγουμένων
  choice: начальствующих
  rationale: Сохраняет широкое значение руководящих лиц, не сводя их исключительно к военным командирам.
theological_decisions:
- issue: Характер образа и иерархии
  choice: Сохранить военную терминологию и распределение обязанностей по чинам
  alternative: Обобщить как различие служений или должностей
  rationale: Греческий текст прямо использует последовательность военных чинов; обобщение внесло бы в стих церковное толкование, которого здесь явно не выражено.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью; повтор «не все» делает длинное греческое перечисление естественным по-русски, а традиционные наименования численных чинов сохраняют риторическую ступенчатость оригинала.
