revisions:
- from: Не все — военачальники[a], не все — тысяченачальники, сотники или пятидесятники и так далее по порядку; но каждый в своём чине исполняет повеления царя и начальствующих.
  to: Не все — военачальники[a], тысяченачальники, сотники, пятидесятники и так далее по порядку; но каждый в своём чине исполняет повеления, данные царём и начальниками.
  rationale: Перечень приведён к единой отрицательной конструкции, соответствующей греческому οὐ πάντες ... οὐδὲ, а «или» устранено, чтобы не превращать последовательные чины в альтернативы. «Начальников» заменяет менее естественное «начальствующих», сохраняя широту τῶν ἡγουμένων. Сноска к ἔπαρχοι сохранена.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:15Z'
