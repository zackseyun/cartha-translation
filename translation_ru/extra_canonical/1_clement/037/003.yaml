  source_fidelity: В целом переданы военная иерархия, нисходящий перечень чинов, личное место каждого в строю и исполнение распоряжений царя и руководителей. Однако повтор «не все» меняет строй греческого единого отрицательного перечисления и в сочетании «сотники или пятидесятники» создаёт нежелательную альтернативу между двумя последовательными категориями.
  naturalness: Текст понятен и в целом литературен, но повтор «не все» и союз «или» внутри перечня утяжеляют и размывают его. «Начальствующих» возможно, но как субстантивированное слово менее естественно, чем «начальников».
  terminology: «Военачальники» для ἔπαρχοι допустимо в данном военном образе при сохранении поясняющей сноски. «Тысяченачальники», «сотники», «пятидесятники» и «чин» удачно сохраняют терминологический параллелизм. τὸ καθεξῆς лучше передать как продолжение перечня в последовательном порядке, без присоединения его к последнему чину союзом «или».
