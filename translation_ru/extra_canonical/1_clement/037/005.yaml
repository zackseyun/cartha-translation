source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: ru
  text: 'Возьмём в пример наше тело: голова — ничто без ног, как и ноги — ничто без головы. Даже самые малые части нашего тела необходимы и полезны всему телу. Но все они дышат сообща и пребывают в едином подчинении, чтобы всё тело сохранялось.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: Возьмём в пример наше тело
  rationale: Добавление «в пример» естественно передаёт риторическую функцию призыва рассмотреть тело как наглядный образ, не меняя смысла греческого текста.
- source_word: τὰ ἐλάχιστα μέλη
  choice: даже самые малые части
  rationale: μέλη в данном контексте означает части или члены тела; современное «части» ясно и естественно, а «даже» передаёт усилительный ход высказывания.
- source_word: συνεπνεῖ
  choice: дышат сообща
  rationale: Сохранён буквальный образ совместного дыхания; глагол подчёркивает согласованную жизнь всех частей тела.
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: пребывают в едином подчинении
  rationale: Передаёт греческую идиому с χράομαι и абстрактным существительным естественно по-русски, сохраняя идею общего подчинения без уточнения его объекта.
- source_word: σώζεσϑαι
  choice: сохранялось
  rationale: В образе физического тела речь идёт о сохранности и целостности; «сохранялось» передаёт это без внесения лишнего сотериологического смысла.
theological_decisions:
- issue: Объект и характер единого подчинения
  choice: «пребывают в едином подчинении» без указания, кому или чему подчинены части
  alternative: «подчиняются единому порядку»
  rationale: В греческом тексте объект подчинения не назван. Введение «порядка» сделало бы скрытое толкование явным и сузило бы намеренную общность формулировки.
- issue: Значение σώζεσθαι
  choice: «сохранялось»
  alternative: «спасалось»
  rationale: Хотя глагол может означать «спасаться», телесная аналогия здесь непосредственно говорит о сохранении всего тела; русский глагол «спасалось» мог бы необоснованно придать фразе специальный богословский оттенок.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified увещательным тоном. Сохранены телесная метафора совместного дыхания и синтаксический параллелизм головы и ног; избегнуты архаизмы и конфессионально окрашенные уточнения.
