  text: οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: ru
  text: Великие не могут существовать без малых, и малые — без великих. Во всём есть некое сочетание, и во всём этом есть польза.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в них»; это может относиться ко всему перечисленному или к великим и малым.'
    reason: Греческое ἐν τούτοις стоит во множественном числе; «во всём этом» — естественная русская передача, сохраняющая отсылку к предшествующему множеству.
lexical_decisions:
- source_word: οἱ μεγάλοι / οἱ μικροί
  choice: великие / малые
  rationale: Сохраняет симметрию и обобщённый характер греческих субстантивированных прилагательных; контекст допускает отнесение как к людям, так и к членам единого целого.
- source_word: σύγκρασίς
  choice: сочетание
  rationale: Передаёт идею соединения и взаимного согласования частей без чрезмерно физического оттенка слова «смешение».
- source_word: χρῆσις
  choice: польза
  rationale: В данном контексте слово обозначает полезность или практическую ценность взаимного сочетания.
