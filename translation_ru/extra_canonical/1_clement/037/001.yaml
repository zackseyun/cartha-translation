  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: ru
  text: Итак, братья, будем нести воинскую службу со всем усердием, в соответствии с Его безупречными повелениями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεϑα
  choice: будем служить как воины
  rationale: Средний конъюнктив передаёт совместный призыв участвовать в воинской службе; формулировка сохраняет военный образ и звучит естественно по-русски.
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Устойчивое обращение к членам общины; буквальное «мужи-братья» в современном русском здесь избыточно и архаично.
- source_word: μετὰ πάσης ἐκτενείας
  choice: со всем усердием
  rationale: ἐκτένεια обозначает напряжённое, неослабное старание; «усердие» ясно и достойно передаёт смысл.
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: исполняя Его безупречные повеления
  rationale: Предлог ἐν при военном глаголе может обозначать сферу или порядок, в рамках которого совершается служба. Деепричастная конструкция естественно выражает служение в соответствии с повелениями, не превращая их в место действия.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: Его
  alternative: его
  rationale: Контекст подразумевает божественного Владыку; прописная буква следует русской религиозно-литературной норме, не добавляя имени и не устраняя контекстуальную соотнесённость.
- issue: Характеристика повелений как ἀμώμοις
  choice: безупречные
  alternative: непорочные
  rationale: «Безупречные» естественно характеризует повеления и сохраняет смысл отсутствия изъяна; «непорочные» в современном русском чаще относится к нравственному состоянию лица.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Военная метафора сохранена, а синтаксис адаптирован для ясности без конфессиональных уточнений.
