  source_fidelity: 'Στρατευώμεθα — совместный увещевательный конъюнктив: «будем нести воинскую службу / сражаться». Военный образ в черновике сохранён. Однако ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ характеризует сферу или нормативные рамки этой службы («в соответствии с / под его безупречными повелениями»), а не прямо действие исполнения повелений.'
  naturalness: «Будем нести воинскую службу» — естественное современное литературное выражение и более прямо передаёт στρατεύομαι, чем «служить как воины». Конструкция «в соответствии с ... повелениями» ясно связывает заключительный оборот с образом службы.
  terminology: «Братья», «со всем усердием» и «безупречные повеления» уместны. Прописное «Его» возможно в русском религиозно-литературном оформлении; оно не меняет референт, заданный контекстом.
