  rationale: 'Исправлены идиоматичность и две небольшие смысловые конкретизации, при этом сохранены увещевательная форма, военная образность, трёхчастная анафора наречий и различение послушания и подчинённости. Сноска не требуется: в русском тексте не возникает отдельной текстологической или лексической неоднозначности, которую необходимо специально отмечать.'
