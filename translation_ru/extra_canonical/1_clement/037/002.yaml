  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: ru
  text: 'Посмотрим на тех, кто несёт военную службу под началом наших командиров: как организованно, как послушно, как покорно исполняют они то, что им приказано.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: Посмотрим
  rationale: Естественный русский призыв внимательно рассмотреть пример; сохраняет увещевательное первое лицо множественного числа.
- source_word: τοὺς στρατευομένους
  choice: тех, кто служит воинами
  rationale: Передаёт причастие настоящего времени и военный контекст без искусственного субстантивированного оборота.
- source_word: τοῖς ἡγουμένοις ἡμῶν
  choice: под началом наших военачальников
  rationale: В данном военном контексте ἡγούμενοι — командующие; оборот «под началом» ясно выражает подчинённость.
- source_word: εὐτάκτως
  choice: стройно
  rationale: Передаёт действие в установленном порядке и поддерживает тройную последовательность наречий.
- source_word: εἰκτικῶς
  choice: послушно
  rationale: Выражает уступчивость и готовность повиноваться, а не просто быстроту исполнения.
- source_word: ὑποτεταγμένως
  choice: покорно
  rationale: Сохраняет усиленную идею подчинённости и наречную форму греческого текста.
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: исполняют они приказанное
  rationale: Точно и естественно передаёт доведение до исполнения того, что предписано командованием.
