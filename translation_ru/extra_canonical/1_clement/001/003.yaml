    issue: «Во всём проявлять благоразумие» для πάνυ σωφρονούσας
    rationale: πάνυ выражает усиление («весьма», «полностью»), а не охват всех сфер («во всём»). σωφροσύνη здесь включает прежде всего самообладание, сдержанность и рассудительность; «проявляя полное самообладание» передаёт сочетание точнее.
  - severity: low
    issue: «В установленных рамках повиновения»
    rationale: «Установленных» добавлено переводчиком. κανών означает правило или норму; «придерживаясь правила подчинения» сохраняет этот образ без добавления.
