  source_fidelity: В целом передача следует греческому тексту и сохраняет последовательность наставлений. Однако πάνυ («весьма, полностью») в заключительном причастии относится к степени самообладания, а не означает «во всём». В выражении ἐν τῷ κανόνι τῆς ὑποταγῆς добавление «установленных» не имеет опоры в оригинале и несколько меняет образ κανών («правило, норма»).
  naturalness: Текст в основном современный и литературный. «Придерживаясь правила подчинения» естественнее и точнее, чем «оставаясь в установленных рамках повиновения». «Вести домашнее хозяйство» чуть яснее передаёт οἰκουρεῖν, чем общее «вести домашние дела».
  terminology: «Без лицеприятия», «установления Бога», «руководители» и «старшие» приемлемы. Сноска о πρεσβύτεροι уместно сохраняет возможное значение общинных служителей, не навязывая его основному тексту. Текстологическая сноска к μέτρα необходима, поскольку данная форма в предоставленном тексте отличается от обычного контекстуально ожидаемого μέτρια.
  issues:
