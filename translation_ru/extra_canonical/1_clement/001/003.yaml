source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: ru
  text: Ведь вы всё делали без лицеприятия и жили по установлениям Бога, подчиняясь своим руководителям и воздавая подобающую честь старшим среди вас[a]. Молодых вы наставляли мыслить умеренно[b] и достойно. Женщинам вы заповедовали всё делать с совестью непорочной, достойной и чистой, как подобает, любя своих мужей; и учили их, придерживаясь правила подчинения[c], достойно вести домашнее хозяйство, проявляя полное самообладание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пресвитерам среди вас». Греческое слово может обозначать как старших по возрасту, так и служителей общины.'
    reason: lexical_ambiguity
  - marker: b
    text: В предоставленном греческом тексте стоит μέτρα — буквально «меры»; по контексту обычно понимается или читается μέτρια — «умеренное, сдержанное».
    reason: textual_issue
  - marker: c
    text: 'Или: «находясь в порядке подчинения».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: без лицеприятия
  rationale: Передаёт отсутствие пристрастия к людям и сохраняет узнаваемую библейскую лексику.
- source_word: τοῖς νομίμοις τοῦ θεοῦ
  choice: по установлениям Бога
  rationale: Νόμιμα означает предписания или установления; оборот «жили по» естественно передаёт ἐπορεύεσθε без избыточного добавления «законным».
- source_word: τοῖς ἡγουμένοις ὑμῶν
  choice: своим руководителям
  rationale: Нейтрально передаёт тех, кто возглавляет общину, не навязывая позднейшего названия церковной должности.
- source_word: τοῖς παρ’ ὑμῖν πρεσβυτέροις
  choice: старшим среди вас
  rationale: Сохраняет возможное возрастное и общинное значение πρεσβύτεροι; должностное прочтение отмечено в сноске.
- source_word: μέτρα
  choice: умеренно
  rationale: Контекст и принятое чтение μέτρια указывают на умеренность; необычная форма в предоставленном тексте отмечена в сноске.
- source_word: ἐν τῷ κανόνι τῆς ὑποταγῆς
  choice: в установленных рамках повиновения
  rationale: Κανών здесь обозначает правило, норму или установленный порядок, а не обязательно формальный канон.
- source_word: οἰκουρεῖν
  choice: вести домашние дела
  rationale: Передаёт заботу о доме и управление домашним хозяйством без архаичного или уничижительного оттенка.
- source_word: πάνυ σωφρονούσας
  choice: во всём проявлять благоразумие
  rationale: Σωφρονεῖν включает самообладание, рассудительность и нравственную сдержанность; «благоразумие» сохраняет широту значения.
theological_decisions:
- issue: Статус πρεσβύτεροι
  choice: старшим среди вас
  alternative: пресвитерам среди вас
  rationale: Сам текст допускает как возрастное, так и служебное понимание; основной перевод не закрепляет позднейшую должностную терминологию, а альтернатива вынесена в сноску.
- issue: Характер «правила повиновения»
  choice: установленные рамки повиновения
  alternative: правило повиновения
  rationale: Формулировка сохраняет образ κανών и идею упорядоченности, не превращая выражение в название конкретного церковного канона.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранена последовательность обращений к руководителям, старшим, молодым и женщинам, а также отдельный глагол ἐδιδάσκετε («учили»). Избегаются конфессионально нагруженные должностные термины там, где греческий допускает более широкое значение.
