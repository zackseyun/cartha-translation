  terminology: «Мятеж» допустимо передаёт στάσις, не сводя его к обычному спору. «Божьи избранники» сохраняет исходную формулу без конфессионального уточнения. «Скверный и нечестивый» воспроизводит двойную отрицательную характеристику μίαράς καὶ ἀνοσίου.
