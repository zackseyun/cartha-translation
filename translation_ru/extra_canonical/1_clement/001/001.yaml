  source_fidelity: 'В целом смысл передан верно: речь идёт о задержке ответа из-за внезапных, следующих одно за другим бедствий и о пагубном мятеже в коринфской общине. Однако «как нам кажется» неточно передаёт νομίζομεν в данном контексте: авторы констатируют, что сочли себя запоздавшими. «Непрестанно» излишне усиливает ἐπαλλήλους, а «всеми людьми любимое» превращает обозначение достоинства имени в утверждение о его фактической всеобщей любви.'
