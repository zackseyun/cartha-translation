source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
translation:
  language: ru
  text: Из-за внезапных бедствий и тяжёлых обстоятельств, постигших нас одно за другим, мы сочли, братья, что несколько запоздали обратиться к спорным у вас вопросам[a], возлюбленные, — к чуждому и несвойственному Божьим избранникам, скверному и нечестивому мятежу. Несколько дерзких и своевольных людей разожгли его до такого безумия, что ваше почтенное, широко известное и достойное любви у всех людей имя подверглось великому поношению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к вопросам, вызывающим у вас обсуждение (разбирательство)». Греческое выражение допускает более широкое значение, но не содержит слов «от нас».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: αἰφνιδίους καὶ ἐπαλλήλους
  choice: внезапных и непрестанно следовавших одно за другим
  rationale: Передаёт как внезапность бедствий, так и их последовательное, повторяющееся наступление.
- source_word: συμφορὰς καὶ περιστάσεις
  choice: бедствий и испытаний
  rationale: «Бедствия» передаёт συμφοραί, а «испытания» естественно выражает тяжёлые обстоятельства, обозначенные περιστάσεις.
- source_word: ἐπιστροφὴν πεποιῆσθαι
  choice: с обращением к
  rationale: В контексте означает обратить внимание и заняться вопросом; буквальное «совершить обращение» по-русски неестественно.
- source_word: τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων
  choice: к спорным у вас вопросам
  rationale: Контекстуально ἐπιζητουμένων обозначает обсуждаемые или оспариваемые вопросы, а παρʼ ὑμῖν — «у вас», без добавления отсутствующего в греческом «от нас».
- source_word: στάσεως
  choice: мятежу
  rationale: Передаёт серьёзный внутренний раскол и выступление против порядка, а не просто разногласие.
- source_word: μιαρᾶς καὶ ἀνοσίου
  choice: мерзкому и нечестивому
  rationale: Сохраняет сочетание нравственной осквернённости и нарушения священного порядка.
- source_word: βλασφημηθῆναι
  choice: подверглось тяжкому поношению
  rationale: В отношении человеческой общины глагол означает злословие и поругание; «богохульству» здесь было бы по-русски неуместно.
theological_decisions:
- issue: К кому относятся «избранные Божьи»
  choice: Сохранена общая формулировка «избранным Божьим» без конфессионального пояснения.
  alternative: Уточнить как обозначение всех христиан или только коринфской общины.
  rationale: Греческий текст не разъясняет объём выражения; перевод сохраняет эту богословскую открытость.
- issue: Характер στάσις
  choice: Передано как «мятеж».
  alternative: «раскол», «смуты» или «раздор».
  rationale: Слово подразумевает не только разногласие, но активное и беспорядочное противостояние; перевод не определяет его точную церковно-правовую форму.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Длинное греческое предложение разделено на два для ясности; обращения «братья» и «возлюбленные» сохранены. Повтор близких определений намеренно удержан там, где он усиливает авторскую оценку.
