revisions:
- from: Из-за внезапных и непрестанно следовавших одно за другим бедствий и испытаний, постигших нас, братья, мы, как нам кажется, несколько запоздали с обращением к спорным у вас вопросам[a], возлюбленные, а именно — к этому чуждому и несвойственному избранным Божьим, мерзкому и нечестивому мятежу. Несколько дерзких и своевольных людей разожгли его до такого безумия, что ваше почтенное, прославленное и всеми людьми любимое имя подверглось тяжкому поношению.
  to: Из-за внезапных бедствий и тяжёлых обстоятельств, постигших нас одно за другим, мы сочли, братья, что несколько запоздали обратиться к спорным у вас вопросам[a], возлюбленные, — к чуждому и несвойственному Божьим избранникам, скверному и нечестивому мятежу. Несколько дерзких и своевольных людей разожгли его до такого безумия, что ваше почтенное, широко известное и достойное любви у всех людей имя подверглось великому поношению.
