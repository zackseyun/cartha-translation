id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: ru
  text: Ибо кто, побывав у вас, не одобрил вашу исполненную всякой добродетели и твёрдую веру? Кто не восхищался вашим сдержанным и кротким благочестием в Мессии[a]? Кто не возвещал о великолепном характере вашего гостеприимства? И кто не называл блаженным[b] ваше совершенное и надёжное знание?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Помазаннике»; греческое Χριστός соответствует титулу «Мессия».'
    reason: Поясняет передачу христологического титула и сохраняет связь с греческой формой.
  - marker: b
    text: 'Или: «не считал достойным восхищения»; греческий глагол обычно означает провозглашать кого-либо блаженным или счастливым.'
    reason: Отмечает необычное употребление μακαρίζω по отношению к знанию и сохраняет возможный хвалебный оттенок.
lexical_decisions:
- source_word: παρεπιδημήσας
  choice: пожив среди вас
  rationale: Передаёт временное пребывание среди общины естественным современным русским выражением.
- source_word: πανάρετον
  choice: исполненную всякой добродетели
  rationale: 'Сохраняет усиленное значение редкого прилагательного: вера характеризуется всей полнотой добродетели.'
- source_word: ἐδοκίμασεν
  choice: одобрил
  rationale: В данном риторическом контексте глагол означает признать испытанным и достойным одобрения, а не просто подвергнуть проверке.
- source_word: σώφρονα καὶ ἐπιεικῆ
  choice: благоразумным и кротким
  rationale: Передаёт соответственно здравую сдержанность и мягкую, снисходительную кротость.
- source_word: μεγαλοπρεπὲς ... ἦθος
  choice: величии ... гостеприимства
  rationale: Естественно передаёт возвышенный, впечатляющий характер гостеприимного образа жизни без тяжеловесной кальки «величественный нрав».
- source_word: ἀσφαλῆ
  choice: надёжное
  rationale: Сохраняет смысл достоверности и устойчивости знания, не усиливая его до абсолютной непогрешимости.
- source_word: ἐμακάρισεν
  choice: называл блаженным
  rationale: Сохраняет необычную прямую связь глагола μακαρίζω со «знанием», не сводя её просто к похвале.
theological_decisions:
- issue: Передача ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Χριστός является греческим титулом «Помазанник»; «Мессия» сохраняет титульное значение и соответствует консультационному слою, не превращая его здесь в имя собственное.
- issue: Характер знания общины
  choice: совершенное и надёжное знание
  alternative: полное и непогрешимое знание
  rationale: Перевод сохраняет высокую похвалу τελείαν καὶ ἀσφαλῆ, но не вносит более сильного догматического утверждения о непогрешимости.
translation_notes:
  register: Современный литературный русский язык с торжественной риторической интонацией. Четыре параллельных вопроса сохранены; синтаксис сделан плавным и понятным без устранения необычных образов оригинала.
