  to: Ибо кто, побывав у вас, не одобрил вашу исполненную всякой добродетели и твёрдую веру? Кто не восхищался вашим сдержанным и кротким благочестием в Мессии[a]? Кто не возвещал о великолепном характере вашего гостеприимства? И кто не называл блаженным[b] ваше совершенное и надёжное знание?
