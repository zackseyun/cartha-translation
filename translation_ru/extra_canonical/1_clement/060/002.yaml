source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: ru
  text: Не вмени никакого греха рабам и рабыням Твоим, но очисти нас очищением Твоей истины и направь наши стопы, чтобы мы ходили в святости сердца и делали доброе и угодное пред Тобой и пред нашими правителями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: Не вмени никакого греха
  rationale: В молитвенном, библейски окрашенном контексте сочетание отрицания с πᾶσαν естественно передаёт просьбу не вменять никакого греха; «не всякий грех» могло бы ошибочно означать, что некоторые грехи следует вменить.
- source_word: δούλων σου καὶ παιδισκῶν
  choice: рабам и рабыням Твоим
  rationale: Сохраняет различение мужского и женского рода и библейско-молитвенный регистр греческих слов, не прибегая к громоздкому буквальному выражению.
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: очисти нас очищением Твоей истины
  rationale: Сохранена намеренная фигура однокоренных слов καθάρισον/καθαρισμόν и не устранена смысловая напряжённость родительного τῆς σῆς ἀληθείας.
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: направь наши стопы
  rationale: Естественная для русского библейского стиля передача образа направляемых шагов.
- source_word: ἐν ὁσιότητι καρδίας
  choice: в святости сердца
  rationale: Передаёт внутреннее благочестие и посвящённость Богу, выраженные ὁσιότης, без сведения смысла только к нравственной чистоте.
- source_word: τὰ καλὰ καὶ εὐάρεστα
  choice: доброе и угодное
  rationale: Субстантивированная форма по-русски естественно передаёт «то, что хорошо и угодно».
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: нашими правителями
  rationale: Нейтрально передаёт гражданских носителей власти без уточнения конкретного политического устройства.
theological_decisions:
- issue: Объём отрицания в μὴ ... πᾶσαν ἁμαρτίαν
  choice: никакого греха
  alternative: не всякого греха / не каждого греха
  rationale: 'В контексте молитвы о прощении отрицание понимается как распространяющееся на всю совокупность: «не вмени ни одного греха». Альтернатива создала бы нежелательный смысл частичного вменения.'
- issue: Характер «очищения истины»
  choice: сохранена конструкция «очищением Твоей истины»
  alternative: очисти нас посредством Твоей истины
  rationale: Греческий текст допускает инструментальное понимание, однако буквальная именная конструкция сохраняет его необычную формулировку и не решает однозначно отношение между очищением и истиной.
- issue: Угодность перед Богом и правителями
  choice: пред Тобой и пред нашими правителями
  alternative: угодное Тебе и нашим правителям
  rationale: Сохранён повтор ἐνώπιον и различие между качествами «доброе и угодное» и сферами, перед которыми это совершается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным и библейским звучанием. Формы «вмени», «стопы» и «пред» уместны для торжественной молитвы, но текст остаётся понятным современному читателю. Местоимения, обращённые к Богу, написаны с прописной буквы как издательская норма русского религиозного текста.
