  - severity: low
    issue: Передача образа сияющего лица
    rationale: «Яви нам свет лица Твоего» интерпретирует образ как отдельный «свет». Формула «да воссияет над нами лицо Твоё» ближе к ἐπίφανον τὸ πρόσωπόν σου ἐφ’ ἡμᾶς и остаётся естественной по-русски.
