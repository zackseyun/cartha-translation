  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: ru
  text: Да, Владыка, да воссияет над нами лицо Твоё во благо, в мире, чтобы мы были укрыты Твоею могучей рукой и избавлены от всякого греха Твоею высокой мышцей; избавь нас и от тех, кто несправедливо ненавидит нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт прямое обращение к верховному Господину с достоинством и без разговорного оттенка.
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  choice: яви нам свет лица Твоего
  rationale: Естественно по-русски воспроизводит библейский образ сияющего Божьего лица, не сводя его к буквальному физическому действию.
- source_word: εἰς ἀγαθὰ ἐν εἰρήνῃ
  choice: ко благу в мире
  rationale: Сохраняет как направленность к благу, так и обстоятельство мира, не уточняя неоднозначную синтаксическую связь.
- source_word: τῇ χειρί σου τῇ κραταιᾷ
  choice: могучая рука Твоя
  rationale: Точно и естественно передаёт образ сильной Божьей руки.
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: высокая мышца Твоя
  rationale: Сохраняет различие между χείρ и βραχίων и возвышенную библейскую образность; «высокая» формально передаёт ὑψηλός без догматического истолкования.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: от всякого греха
  rationale: Прямо сохраняет широкий объём греческого выражения.
- source_word: τῶν μισούντων ἡμᾶς ἀδίκως
  choice: тех, кто несправедливо ненавидит нас
  rationale: Передаёт причастную конструкцию современным и ясным русским оборотом.
theological_decisions:
- issue: Значение ἁμαρτία в прошении об избавлении
  choice: грех
  alternative: зло / бедствие
  rationale: Основное лексическое значение — «грех»; контекст не требует ослаблять нравственно-богословский смысл.
- issue: Образ лица Бога
  choice: сохранён как библейская метафора Божьего благоволения
  alternative: даруй нам Своё благоволение
  rationale: Конкретный образ оригинала важен и не должен заменяться его толкованием.
translation_notes:
  register: Современный литературный русский с молитвенно-библейской торжественностью. Синтаксис слегка упрощён ради ясности, при этом сохранены параллельные образы руки и мышцы. Местоимения, относящиеся к Богу, оформлены с прописной буквы по принятой русской религиозно-издательской норме.
