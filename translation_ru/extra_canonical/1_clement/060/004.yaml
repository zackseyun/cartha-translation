source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: ru
  text: Даруй согласие и мир нам и всем живущим на земле — как Ты даровал их нашим отцам, когда они благочестиво призывали Тебя в вере и истине, — и дай нам быть послушными Твоему всемогущему и всесовершенному имени, а также нашим земным правителям и начальникам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «становясь послушными». Причастие относится к молящимся («нам»), а не к «нашим отцам».'
    reason: Греческая фраза имеет протяжённую причастную конструкцию, которую для ясности по-русски передано словами «дай нам быть послушными».
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: согласие
  rationale: В контексте 1 Климента это общественное единодушие и отсутствие раздора; «согласие» естественно по-русски и сохраняет гражданский оттенок.
- source_word: ὁσίως
  choice: благочестиво
  rationale: Наречие описывает достойное Бога, святое отношение при молитвенном призывании; «благочестиво» передаёт это без конфессионального уточнения.
- source_word: παντοκράτορι
  choice: всемогущему
  rationale: Обычный и понятный русский эквивалент, выражающий всеобъемлющее могущество.
- source_word: παναρέτῳ
  choice: всесовершенному
  rationale: Редкое сложное прилагательное означает обладание всей добродетелью или всяким совершенством; применительно к Божьему имени «всесовершенному» звучит естественнее, чем буквальное «вседобродетельному».
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: правителям и начальникам
  rationale: Сохраняются два обозначения земной власти без сведения их к конкретным государственным должностям.
theological_decisions:
- issue: К кому относится ὑπηκόους γινομένους
  choice: 'К молящимся («нам»): «дай нам быть послушными»'
  alternative: 'К «нашим отцам»: «они становились послушными»'
  rationale: Причастие стоит в винительном падеже множественного числа и не может согласовываться с αὐτῶν, относящимся к отцам и стоящим в родительном падеже. Кроме того, упоминание «наших» нынешних правителей подтверждает отнесение причастия к молящимся.
- issue: Отношение послушания к Божьему имени и земным властям
  choice: 'Сохранены оба однородных дополнения: послушание имени Бога и земным правителям'
  alternative: Истолковать упоминание властей как отдельную молитвенную просьбу
  rationale: Дательные τῷ… ὀνόματί и τοῖς… ἄρχουσιν καὶ ἡγουμένοις синтаксически зависят от ὑπηκόους и соединены τε.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Заглавные формы «Ты», «Тебя», «Твоему» поддерживают традиционный русский регистр обращения к Богу, не добавляя богословских уточнений. Парные тире ясно отделяют сравнение с отцами и предотвращают ошибочное присоединение причастия к ним.
