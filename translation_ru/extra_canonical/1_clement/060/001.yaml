id: 1CLEM.60.1
reference: 1 Clement 60:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: ru
  text: Ведь Ты явил вечное устройство мира через Свои деяния. Ты, Господи, сотворил обитаемую землю; Ты верен во всех поколениях, праведен в Своих судах, дивен могуществом и величием, мудр в сотворении и разумен в утверждении всего возникшего, благ во всём видимом и верен тем, кто уповает на Тебя. Милостивый и сострадательный[a], прости нам наши беззакония, неправедные дела, проступки и прегрешения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно и другое членение: «…верен тем, кто уповает на Тебя, милостив и сострадателен. Прости нам…»'
    reason: В рукописном тексте без современной пунктуации прилагательные ἐλεῆμον καὶ οἰκτίρμον можно связать либо с последующей просьбой как обращение, либо с предшествующим рядом характеристик Бога; грамматически предпочтительно обращение.
lexical_decisions:
- source_word: ἀέναον τοῦ κόσμου σύστασιν
  choice: вечное устройство мира
  rationale: «Устройство» передаёт σύστασις как установленный и сохраняющийся порядок мироздания, а «вечное» — ἀέναος, не перегружая фразу философской терминологией.
- source_word: διὰ τῶν ἐνεργουμένων
  choice: через Свои деяния
  rationale: Субстантивированное причастие обозначает совершаемое Богом; «деяния» естественно передаёт смысл проявляющейся деятельности.
- source_word: τὴν οἰκουμένην
  choice: обитаемую землю
  rationale: Сохранено обычное значение οἰκουμένη как населённого мира или обитаемой земли, а не всей вселенной.
- source_word: ἐν τῷ τὰ γενόμενα ἑδράσαι
  choice: в утверждении всего возникшего
  rationale: Передаёт как уже приведённое в бытие (τὰ γενόμενα), так и его закрепление или упрочение (ἑδράσαι).
- source_word: πλημμελείας
  choice: прегрешения
  rationale: Слово обозначает провинности и нравственные ошибки; «прегрешения» отличает его от более общих «проступков» для παραπτώματα.
theological_decisions:
- issue: Синтаксическая связь ἐλεῆμον καὶ οἰκτίρμον
  choice: 'Обращение к Богу перед просьбой: «Милостивый и сострадательный, прости»'
  alternative: 'Завершение предыдущего ряда характеристик: «…верен тем, кто уповает на Тебя, милостив и сострадателен. Прости…»'
  rationale: Формы естественно читаются как звательные и непосредственно вводят императив ἄφες; альтернативное членение возможно из-за непрерывного ряда Божьих свойств и отсутствия древней пунктуации, поэтому оно отмечено в сноске.
- issue: Четыре обозначения греха в заключительной просьбе
  choice: «беззакония, неправедные дела, проступки и прегрешения»
  alternative: Свести ряд к двум или трём общим словам о грехах
  rationale: Сохранён риторический и смысловой ряд ἀνομίας, ἀδικίας, παραπτώματα, πλημμελείας без искусственного отождествления терминов.
translation_notes:
  register: Современный литературный русский с молитвенно-возвышенным, но понятным строем. Местоимения, обращённые к Богу, даны с прописной буквы по принятой русской религиозно-литературной норме. Длинный греческий ряд качеств сохранён, но расчленён точкой с запятой и запятыми для ясности.
