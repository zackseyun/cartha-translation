  text: ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: ru
  text: 'День и ночь показывают нам воскресение: ночь засыпает, день встаёт; день уходит, ночь наступает.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δηλοῦσιν
  choice: являют
  rationale: Передаёт значение «показывают, делают явным» и сохраняет возвышенный, но понятный литературный регистр.
- source_word: ἀνάστασιν
  choice: воскресение
  rationale: Основное значение слова в данном контексте; формулировка сохраняет связь с темой воскресения, развиваемой в отрывке.
- source_word: κοιμᾶται
  choice: засыпает
  rationale: Сохраняет олицетворение ночи и прямой образ сна.
- source_word: ἀνίσταται
  choice: встаёт
  rationale: Передаёт буквальный образ вставания и поддерживает словесную связь с «воскресением», насколько это естественно по-русски.
- source_word: ἄπεισιν
  choice: уходит
  rationale: Прямой и естественный эквивалент ухода дня.
- source_word: ἐπέρχεται
  choice: наступает
  rationale: Для ночи по-русски естественно «наступает»; значение приближения или прихода передано без лишнего уточнения.
theological_decisions:
- issue: Связь суточной смены дня и ночи с воскресением
  choice: «являют нам воскресение»
  alternative: «указывают нам на воскресение»
  rationale: Выбранная формулировка ближе к прямому δηλοῦσιν и не сводит образ лишь к косвенному указанию; при этом не уточняется, о каком именно аспекте воскресения идёт речь.
- issue: Риторический параллелизм без союзов
  choice: 'Сохранить бессоюзные пары: «ночь засыпает, день встаёт; день уходит, ночь наступает»'
  alternative: Добавить союзы «и»
  rationale: Греческий текст сополагает краткие фразы без союзов, создавая быстрый ритм и резкий контраст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Сохранены олицетворение, краткость и бессоюзный ритм греческого текста.
