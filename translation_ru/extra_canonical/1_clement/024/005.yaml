source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: ru
  text: Сеятель вышел и бросил в землю каждое семя. Эти семена, упав в землю сухими и голыми, разлагаются. Затем величие промысла Владыки поднимает их из этого разложения; из одного семени вырастает множество[a] и приносит плод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из одного семени [величие промысла] взращивает многое и приносит плод».'
    reason: Греческое πλείονα и глаголы в единственном числе допускают как чтение, в котором «многое» является нейтральным множественным подлежащим, так и чтение с продолжающимся субъектом «величие промысла».
lexical_decisions:
- source_word: ἔβαλεν
  choice: бросил
  rationale: Прямо передаёт действие сеятеля и сохраняет простой образ исходного текста.
- source_word: ξηρὰ καὶ γυμνὰ
  choice: сухими и голыми
  rationale: Сохранены оба конкретных определения семян без поясняющего расширения.
- source_word: διαλύεται / διαλύσεως
  choice: разлагаются / из разложения
  rationale: Передаёт распад семени в земле и сохраняет лексический повтор греческого корня.
- source_word: ἡ μεγαλειότης τῆς προνοίας
  choice: величие промысла
  rationale: Сохраняет возвышенное олицетворённое выражение; «промысел» естественен для речи о деятельной заботе Владыки.
- source_word: τοῦ δεσπότου
  choice: Владыки
  rationale: Передаёт δεσπότης как титул верховного господства; прописная буква указывает на Бога в данном контексте.
- source_word: ἀνίστησιν
  choice: восставляет
  rationale: Сохраняет связь с темой воскресения в контексте главы и образ поднятия семени к новой жизни.
- source_word: ἐκ τοῦ ἑνὸς πλείονα αὔξει
  choice: из одного вырастает множество
  rationale: Нейтрально передаёт конструкцию, где πλείονα может пониматься как субъект при глаголе в единственном числе; не вводится неподтверждённый субъект «он».
- source_word: ἐκφέρει καρπόν
  choice: приносит плод
  rationale: Обычный и точный русский эквивалент образа плодоношения.
theological_decisions:
- issue: Субъект глаголов αὔξει и ἐκφέρει в заключительной фразе
  choice: «из одного вырастает множество и приносит плод»
  alternative: «[промысел Владыки] умножает одно во множество и приносит плод»
  rationale: Средний род множественного числа πλείονα может быть субъектом глагола в единственном числе по нормам греческого согласования. Выбранный вариант следует этой грамматике и не приписывает действия промыслу без необходимости, сохраняя образ множества растений, выросших из одного семени.
- issue: Воскресительный оттенок ἀνίστησιν
  choice: «восставляет»
  alternative: «поднимает» или «воздвигает»
  rationale: Контекст 1 Климента 24 посвящён воскресению; «восставляет» сохраняет этот смысловой отклик, не превращая метафору в прямое догматическое утверждение.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис разделён на три ясных предложения; сохранены конкретность земледельческого образа, лексический повтор «разлагаются / разложения» и богословски значимое «восставляет».
