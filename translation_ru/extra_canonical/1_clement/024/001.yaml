source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: ru
  text: Задумаемся, возлюбленные, как Владыка непрестанно показывает нам, что грядущее воскресение наступит. Его начатком Он сделал Господа Иисуса Христа, воскресив Его из мёртвых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: Задумаемся
  rationale: Передаёт призыв внимательно рассмотреть и осмыслить сказанное естественным современным русским языком.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Сохраняет смысл верховного господства и отличает δεσπότης от последующего κύριος.
- source_word: διηνεκῶς
  choice: непрестанно
  rationale: Точно передаёт идею постоянного, непрерывного свидетельства.
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  choice: что грядущее воскресение непременно совершится
  rationale: Естественно передаёт греческую конструкцию будущего бытия/наступления воскресения; «непременно» отражает утвердительную силу ἔσεσθαι без тяжеловесного повтора.
- source_word: ἀπαρχήν
  choice: начатком
  rationale: Сохраняет библейский образ первого плода, служащего залогом последующего целого; традиционное слово понятно в возвышенном религиозном контексте.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: Господа Иисуса Христа
  rationale: Χριστός здесь естественно передаётся закрепившимся именованием «Христос», при сохранении полного титула.
- source_word: ἐκ νεκρῶν ἀναστήσας
  choice: воскресив Его из мёртвых
  rationale: Сохраняет активное действие Бога и обычную библейскую русскую формулу.
theological_decisions:
- issue: Кто сделал Иисуса Христа начатком воскресения
  choice: 'Субъектом оставлен Владыка: «Он сделал… воскресив»'
  alternative: Безличное или пассивное «Иисус Христос стал начатком»
  rationale: Греческие ἐποιήσατο и ἀναστήσας прямо приписывают действие Владыке; пассивная передача ослабила бы авторское богословское утверждение.
- issue: Связь воскресения Иисуса с будущим воскресением
  choice: Иисус Христос назван «начатком» грядущего воскресения
  alternative: «первым воскресшим» или «залогом»
  rationale: '«Начаток» сохраняет метафору ἀπαρχή и её напряжение: первое осуществление одновременно указывает на последующее целое, не сводясь лишь к хронологии или абстрактной гарантии.'
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис сделан ясным для широкого читателя; различие между δεσπότης («Владыка») и κύριος («Господь») сохранено. Маркеры сносок не добавлены, поскольку в русском тексте нет необходимой текстовой или смысловой альтернативы.
