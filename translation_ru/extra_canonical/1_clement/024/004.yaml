lexical_decisions:
- source_word: λάβωμεν
  choice: возьмём в пример
  rationale: Увещевательный аорист передаёт приглашение рассмотреть наглядный пример; добавление «в пример» естественно выражает функцию оборота по-русски.
- source_word: τοὺς καρπούς
  choice: плоды
  rationale: Прямое и естественное соответствие καρποί; контекст допускает как плоды растений, так и урожай, но более широкое «плоды» сохраняет лексику источника.
- source_word: ὁ σπόρος
  choice: посев
  rationale: 'Здесь σπόρος вероятнее обозначает действие сеяния: в следующем стихе для семени употреблено σπέρμα. Поэтому событийное существительное «посев» лучше сочетается с γίνεται.'
- source_word: πῶς καὶ τίνα τρόπον γίνεται
  choice: как и каким образом происходит
  rationale: Сохранена риторическая избыточность греческого выражения; при событийном значении σπόρος глагол γίνεται естественно передаётся как «происходит».
