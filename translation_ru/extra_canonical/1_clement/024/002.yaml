  text: Let us observe, beloved, the resurrection that takes place in due season.
translation:
  language: ru
  text: Посмотрим, возлюбленные, на воскресение, совершающееся в своё время.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Посмотрим
  rationale: Увещательное сослагательное передано естественной русской формой совместного призыва; глагол сохраняет смысл внимательного наблюдения.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Традиционное и dignified обращение, точно передающее значение греческого слова.
- source_word: τὴν ... ἀνάστασιν
  choice: на воскресение
  rationale: Сохраняется ключевой богословский термин «воскресение»; управление «посмотрим на» естественно для современного русского языка.
- source_word: κατὰ καιρόν
  choice: в своё время
  rationale: Передаёт наступление события в надлежащую пору без излишне сильного добавления идеи заранее назначенного срока.
- source_word: γινομένην
  choice: совершающееся
  rationale: Причастие настоящего времени передано причастием, обозначающим происходящее явление и согласованным с «воскресение».
theological_decisions:
- issue: Значение ἀνάστασις в контексте наблюдаемого природного порядка
  choice: воскресение
  alternative: возрождение / восстановление
  rationale: Сохранён прямой и богословски значимый эквивалент греческого термина, не сводящий образ заранее к природному обновлению.
- issue: Оттенок κατὰ καιρόν
  choice: в своё время
  alternative: в назначенное время
  rationale: Выбран нейтральный временной смысл, который не вводит в текст явно выраженную идею божественного назначения, хотя контекст её может допускать.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис краткий и ясный; сохранены обращение и богословская напряжённость слова «воскресение».
