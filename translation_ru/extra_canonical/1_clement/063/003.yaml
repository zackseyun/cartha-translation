id: 1CLEM.63.3
reference: 1 Clement 63:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: ru
  text: Мы же послали верных и благоразумных мужей, которые с юности до старости жили среди нас безупречно; они также будут свидетелями между вами и нами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: верных
  rationale: Передаёт качество надёжности и верности без неоправданного сужения до значения «верующих».
- source_word: σώφρονας
  choice: благоразумных
  rationale: Естественно выражает рассудительность, здравомыслие и самообладание, заключённые в греческом слове.
- source_word: ἀναστραφέντας
  choice: жили
  rationale: В данном контексте глагол обозначает образ жизни и поведение; «жили» звучит по-русски естественно, а нравственная оценка выражена словом «безупречно».
- source_word: ἀμέμπτως
  choice: безупречно
  rationale: Точно передаёт отсутствие оснований для порицания, не утверждая абсолютной безгрешности.
- source_word: μάρτυρες
  choice: свидетелями
  rationale: Сохраняет прямое значение лиц, способных удостоверить происходящее между двумя сторонами.
theological_decisions:
- issue: Смысл πιστούς
  choice: верных
  alternative: верующих
  rationale: Контекст описывает качества посланников и их многолетнюю безупречную жизнь; перевод сохраняет возможный оттенок веры, но не сводит слово только к конфессиональной принадлежности.
- issue: Степень нравственного утверждения в ἀμέμπτως
  choice: безупречно
  alternative: безгрешно
  rationale: Греческое слово говорит о неподсудности порицанию, а не обязательно об абсолютной безгрешности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис близок к греческому, но естественен для обычного читателя; подлежащее οἵτινες передано местоимением «они».
