base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: ru
  text: Итак, нам, приблизившимся к столь многим примерам такого рода, подобает склонить шею и, исполнив долг послушания, успокоиться, чтобы, прекратив тщетную смуту, безупречно достичь цели, поставленной перед нами в истине.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный греческий текст в этом месте повреждён пропуском. Перевод следует восстановленному чтению: «…исполнив долг послушания, успокоиться, чтобы, прекратив тщетную смуту, достичь…».'
    reason: textual_source_correction
lexical_decisions:
- source_word: τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας
  choice: имеющим перед собой столь великие и многочисленные примеры
  rationale: Передаёт приближение к множеству значительных примеров естественным русским оборотом, не сводя τοιούτοις только к количеству.
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: склонить шею
  rationale: Сохраняет конкретный образ добровольного смирения и подчинения.
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: занять место послушания
  rationale: Сохраняет метафору «места» и смысл принятия подобающей роли; не усиливает её до безусловного повиновения определённой церковной стороне.
- source_word: ἡσυχάσαι
  choice: успокоиться
  rationale: В контексте прекращения смуты означает перестать возмущаться и пребывать в покое; «умолкнуть» было бы уже по смыслу.
- source_word: κοπάσαντες τῆς ματαίας στάσεως
  choice: прекратив бессмысленный мятеж
  rationale: στάσις обозначает мятеж или внутреннюю смуту, а ματαία — её пустой, неразумный характер.
- source_word: σκοπὸν
  choice: цели
  rationale: Передаёт образ намеченной впереди цели пути или стремления.
- source_word: δίχα παντὸς μώμου
  choice: без всякого нарекания
  rationale: Естественно выражает отсутствие вины, порицания или нравственного изъяна.
theological_decisions:
- issue: Характер послушания
  choice: занять место послушания
  alternative: исполнить свой долг повиновения
  rationale: Выбранная формулировка сохраняет образ греческого текста и не уточняет без прямого основания, кому именно адресовано послушание.
- issue: ἐν ἀληθείᾳ при описании поставленной цели
  choice: цели, которая воистину поставлена перед нами
  alternative: поставленной перед нами цели истины
  rationale: ἐν ἀληθείᾳ естественнее понимать наречно («действительно, воистину»), однако формулировка не превращает цель в отдельно определённую доктрину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Сохранены образы склонённой шеи, места послушания и поставленной впереди цели; архаизмы вроде «выя» и конфессионально нагруженные уточнения устранены.
