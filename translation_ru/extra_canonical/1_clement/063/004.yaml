  source_fidelity: 'В целом смысл передан верно: φροντίς — «забота», γέγονεν καὶ ἔστιν — «была и остаётся», а εἰρηνεῦσαι передано активным выражением «жили в мире». Однако «как можно скорее» обычно означает максимальную срочность или приложение всех усилий («as soon as possible»), тогда как ἐν τάχει означает «вскоре», «скоро».'
