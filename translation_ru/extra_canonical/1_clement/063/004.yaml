  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: ru
  text: 'Мы сделали это, чтобы вы знали: вся наша забота была и остаётся направлена на то, чтобы вы вскоре жили в мире.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίς
  choice: забота
  rationale: Передаёт деятельную озабоченность и попечение, сохраняя естественность современного русского языка.
- source_word: ἐν τάχει
  choice: как можно скорее
  rationale: Естественно выражает значение скорого наступления желаемого состояния, заключённое в греческом обороте.
- source_word: εἰρηνεῦσαι
  choice: жили в мире
  rationale: Активная форма означает «быть/жить в мире»; этот вариант не вносит пассивного значения «быть возвращёнными к миру» и в контексте церковного раздора звучит ясно.
theological_decisions:
- issue: 'Направленность εἰρηνεῦσαι: мирное состояние или восстановление мира'
  choice: жили в мире
  alternative: примирились
  rationale: Выбран активный и достаточно широкий вариант, соответствующий форме греческого глагола и не уточняющий сверх текста, идёт ли речь прежде всего о внутреннем согласии, прекращении раздора или восстановлении прежнего порядка.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Конструкция упрощена до естественного русского синтаксиса без утраты временного противопоставления «была и остаётся».
