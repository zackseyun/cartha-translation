source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: ru
  text: Ибо вы доставите нам радость и ликование, если, став послушны тому, что мы написали через Святого Духа, отсечёте беззаконный гнев вашей ревности согласно нашей просьбе о мире и единодушии, высказанной в этом послании.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν … καὶ ἀγαλλίασιν
  choice: радость и ликование
  rationale: Сохраняет парное усиление греческого текста и его возвышенный, но понятный регистр.
- source_word: ὑπήκοοι γενήμενοι
  choice: повинуясь
  rationale: Естественно передаёт становление послушными сказанному, не утяжеляя русскую фразу буквальным оборотом «став послушными».
- source_word: τοῖς ὑφʼ ἡμῶν γεγραμμένοις
  choice: тому, что мы написали
  rationale: Прямая и естественная передача субстантивированного причастия во множественном числе.
- source_word: ἐκκόψητε
  choice: отсечёте
  rationale: Сохраняет резкую метафору решительного устранения, присутствующую в исходном глаголе.
- source_word: ἄθεμον
  choice: беззаконный
  rationale: Передаёт смысл чего-либо противного установленному порядку или закону без более узкого конфессионального оттенка.
- source_word: ζήλους
  choice: ревностью
  rationale: Сохраняет возможный диапазон ζῆλος — ревность, завистливое соперничество — и не сводит его однозначно к «зависти».
- source_word: ἔντευξιν
  choice: обращённым к вам призывом
  rationale: В данном контексте обозначает настойчивое обращение или увещание; добавление «к вам» делает синтаксическую связь ясной по-русски.
- source_word: εἰρήνης καὶ ὁμονοίας
  choice: миру и единодушию
  rationale: Различает мир как отсутствие раздора и ὁμόνοια как согласие умов и воли.
theological_decisions:
- issue: Посредничество Святого Духа в написании послания
  choice: «что мы написали через Святого Духа»
  alternative: «что было написано нами по внушению Святого Духа»
  rationale: Буквально сохраняет διὰ τοῦ ἁγίου πνεύματος и не уточняет сверх текста ни механизм вдохновения, ни канонический статус послания.
- issue: Значение ζῆλος
  choice: «ревность» с поясняющей причинной связью гнева
  alternative: «зависть» или «соперничество»
  rationale: Греческое слово допускает несколько оттенков; «ревность» сохраняет неоднозначность, тогда как «зависть» чрезмерно сужает смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис слегка разгружен по сравнению с греческим периодом, но последовательность мысли и ключевые метафоры сохранены. Формула «через Святого Духа» оставлена без богословской конкретизации.
