revisions:
- from: Ведь вы доставите нам радость и ликование, если, повинуясь тому, что мы написали через Святого Духа, отсечёте беззаконный гнев, порождённый вашей ревностью, в согласии с обращённым к вам призывом к миру и единодушию, который мы изложили в этом послании.
  to: Ибо вы доставите нам радость и ликование, если, став послушны тому, что мы написали через Святого Духа, отсечёте беззаконный гнев вашей ревности согласно нашей просьбе о мире и единодушии, высказанной в этом послании.
  rationale: Исправление устраняет добавленную причинную интерпретацию генитивной конструкции и точнее передаёт ἔντευξις, сохраняя современный литературный русский, возвышенный регистр и все ключевые термины исходного текста.
