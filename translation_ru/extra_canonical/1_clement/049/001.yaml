  text: Ὁ ἔχων ἀγάπην ἐν Χριστῷ ποιησάτω τὰ τοῦ Χριστοῦ παραγγέλματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/001.yaml
  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: ru
  text: Кто имеет любовь во Христе, пусть исполняет заповеди Христа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπην
  choice: любовь
  rationale: Прямое и естественное соответствие греческому слову, сохраняющее его широкий нравственный и богословский смысл.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: Сохраняет форму и смысловую открытость греческого выражения, не сводя его ни к любви ко Христу, ни к любви, дарованной Христом.
- source_word: ποιησάτω
  choice: пусть исполняет
  rationale: В сочетании с заповедями по-русски естественнее «исполняет», чем буквальное «делает»; побудительное значение аориста передано конструкцией «пусть».
- source_word: παραγγέλματα
  choice: заповеди
  rationale: В данном контексте передаёт обязательные наставления Христа и соответствует устойчивой русской религиозной лексике.
theological_decisions:
- issue: Значение выражения «любовь во Христе»
  choice: Сохранено «любовь во Христе» без поясняющего дополнения.
  alternative: «любовь ко Христу» или «Христову любовь»
  rationale: Греческое ἐν Χριστῷ допускает более широкую связь любви со Христом; конкретизация устранила бы подлинную смысловую открытость текста.
