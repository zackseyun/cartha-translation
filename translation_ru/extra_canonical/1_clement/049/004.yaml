  text: The height to which love leads is beyond telling.
translation:
  language: ru
  text: Высота, к которой ведёт любовь, неописуема.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: та высота
  rationale: Сохраняет образ высоты; указательное «та» естественно вводит определённый образ в конструкции с придаточным.
- source_word: εἰς ὃ ἀνάγει
  choice: к которой ведёт
  rationale: Передаёт направление εἰς и значение ἀνάγει без добавления отсутствующего в греческом дополнения «нас».
- source_word: ἡ ἀγάπη
  choice: любовь
  rationale: Прямой и естественный эквивалент ἀγάπη в данном контексте.
- source_word: ἀνεκδιήγητόν ἐστιν
  choice: неописуема
  rationale: Ёмко передаёт невозможность исчерпывающе рассказать или выразить словами; согласование с «высота» сохраняет структуру высказывания.
