source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: ru
  text: В любви Владыка принял нас; ради любви, которую Он питал к нам, Иисус Мессия, Господь наш, по воле Бога отдал за нас Свою кровь, Свою плоть — за нашу плоть и Свою душу — за наши души.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свою жизнь — за наши жизни».'
    reason: Греческое ψυχή может означать как «душа», так и «жизнь»; основной текст сохраняет формальную симметрию с «плотью».
lexical_decisions:
- source_word: ἐν ἀγάπῃ
  choice: В любви
  rationale: Сохраняет повтор ключевого слова ἀγάπη и возвышенный, но понятный строй исходной фразы.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт значение верховного господства δεσπότης и отличает его от последующего κύριος — «Господь».
- source_word: προσελάβετο
  choice: принял нас
  rationale: Естественно передаёт принятие к себе без неоправданного уточнения его характера.
- source_word: ἣν ἔσχεν πρὸς ἡμᾶς
  choice: которую Он питал к нам
  rationale: Современное русское выражение для «любви, которую Он имел к нам»; сохраняет направленность πρὸς ἡμᾶς.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Мессия
  rationale: Передаёт Χριστός как титул «Мессия», не превращая его в неразличимое продолжение имени.
- source_word: ἐν θελήματι θεοῦ
  choice: по воле Бога
  rationale: Идиоматично выражает действие в согласии с Божьей волей.
- source_word: ψυχή
  choice: душа
  rationale: 'Сохраняет намеренную антропологическую и риторическую параллель: «плоть за плоть, душу за души».'
theological_decisions:
- issue: Значение ψυχή в заключительном параллелизме
  choice: душу — за наши души
  alternative: жизнь — за наши жизни
  rationale: ψυχή допускает оба значения, однако непосредственная симметрия с σάρξ и повтор одного существительного в единственном и множественном числе поддерживают буквальное «душа/души». Альтернатива отмечена в сноске.
- issue: Значение ὑπέρ в жертвенном контексте
  choice: за
  alternative: вместо
  rationale: «За» сохраняет возможный диапазон значения — ради, в пользу или от имени — и не навязывает исключительно заместительное толкование.
translation_notes:
  register: Современный литературный русский с торжественным раннехристианским звучанием. Повтор «любовь» и параллель «плоть — за плоть / душу — за души» сохранены как важные элементы риторики оригинала; тире проясняют структуру без изменения смысла.
