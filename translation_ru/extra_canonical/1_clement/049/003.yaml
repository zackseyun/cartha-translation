  text: τὸ μεγαλεῖον τῆς καλλονῆς αὐτοῦ τίς ἀρκετὸς ἐξειπεῖν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/003.yaml
  text: Who is sufficient to declare the majesty of his beauty?[a]
translation:
  language: ru
  text: Кто способен выразить величие его красоты?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто в силах поведать о великолепии его красоты?»'
    reason: Отражает допустимые оттенки μεγαλεῖον («великолепие, величие») и ἐξειπεῖν («поведать, высказать в полной мере»).
lexical_decisions:
- source_word: μεγαλεῖον
  choice: величие
  rationale: Передаёт не просто большой размер, а величественность и великолепие; сохраняет возвышенный риторический строй фразы.
- source_word: καλλονῆς
  choice: красоты
  rationale: Прямой и естественный эквивалент слова, обозначающего красоту или прекрасный облик.
- source_word: ἀρκετὸς
  choice: способен
  rationale: В данном обороте означает «достаточно способен, в силах»; по-русски естественно выражается краткой формой «способен».
- source_word: ἐξειπεῖν
  choice: выразить
  rationale: Глагол означает высказать или поведать в полной мере; «выразить» естественно передаёт мысль о словесном описании того, что почти не поддаётся словам.
- source_word: αὐτοῦ
  choice: его
  rationale: Сохраняет мужской род местоимения и не устраняет возможную неоднозначность его отнесения в контексте.
theological_decisions:
- issue: К кому или к чему относится αὐτοῦ
  choice: его
  alternative: этой красоты / её
  rationale: Греческое местоимение имеет форму мужского рода, а его конкретный антецедент определяется более широким контекстом. Русское «его» формально и семантически сохраняет эту открытость, не навязывая толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но не архаичной риторикой. Сочетание «величие его красоты» намеренно сохраняет плотную образность греческого оригинала.
