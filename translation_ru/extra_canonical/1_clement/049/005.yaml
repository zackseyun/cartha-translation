  revision_rationale: 'Исправлены три смысловые точки: сохранён пассивный залог ἐτελειώθησαν, βάναυσον передано более точным «грубого», а οὐ στασιάζει — контекстуально уместным «не разжигает распрей». «В единодушии» точнее передаёт ὁμονοίᾳ. Смысл, ритм и повторяющаяся анафора оригинала сохранены; сносок не требуется.'
