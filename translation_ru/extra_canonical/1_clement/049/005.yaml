source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: ru
  text: Любовь соединяет нас с Богом; любовь покрывает множество грехов; любовь всё переносит, во всём терпелива. В любви нет ничего грубого, ничего надменного. Любовь не допускает раскола, любовь не разжигает распрей, любовь всё совершает в единодушии. В любви все избранные Божьи были приведены к совершенству; без любви ничто не угодно Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾷ
  choice: соединяет
  rationale: Передаёт тесное присоединение или привязанность к Богу естественным современным русским языком, не сужая образ до физического «приклеивает».
- source_word: πάντα ἀνέχεται
  choice: всё переносит
  rationale: Сохраняет широкий смысл стойкого перенесения всего, а также узнаваемую связь с языком 1 Кор 13:7.
- source_word: πάντα μακροθυμεῖ
  choice: во всём проявляет долготерпение
  rationale: Передаёт необычное сочетание πάντα с μακροθυμεῖ, сохраняя повтор «всё/во всём» и значение терпеливой выдержки.
- source_word: βάναυσον
  choice: низкого
  rationale: В данном нравственном контексте слово обозначает неблагородное, грубое или недостойное; «низкого» естественно и достаточно широко.
- source_word: σχίσμα
  choice: раскола
  rationale: Прямо передаёт разделение внутри общины и сохраняет раннехристианскую терминологическую окраску.
- source_word: οὐ στασιάζει
  choice: не поднимает мятежа
  rationale: Передаёт активное участие в распре, бунте или фракционной борьбе, не сводя смысл к простому несогласию.
- source_word: ὁμονοίᾳ
  choice: в согласии
  rationale: Обозначает единомыслие и общественное согласие; выбранное выражение естественно по-русски и соответствует контексту раскола и мятежа.
- source_word: ἐτελειώθησαν
  choice: достигли совершенства
  rationale: Сохраняет богословски насыщенную идею доведения до полноты или совершенства, не уточняя способ и момент этого действия.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: избранные Божьи
  rationale: Точно передаёт принадлежность и избрание Богом в современном литературном регистре.
theological_decisions:
- issue: Смысл ἐτελειώθησαν в отношении избранных
  choice: достигли совершенства
  alternative: были приведены к полноте
  rationale: Греческая пассивная форма допускает оттенок действия над ними, но русское «достигли совершенства» лучше читается и сохраняет идею осуществившейся полноты без привнесения конкретной сотериологической схемы.
- issue: Отношение любви к угождению Богу
  choice: без любви ничто не угодно Богу
  alternative: помимо любви нет ничего благоугодного Богу
  rationale: Сохранено абсолютное утверждение текста без догматического смягчения или объяснения того, как оно соотносится с верой, делами и благодатью.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмическим повтором «любовь», соответствующим греческому оригиналу. Синтаксис умеренно возвышенный, но доступный; архаизмы и конфессионально маркированные формулы избегаются.
