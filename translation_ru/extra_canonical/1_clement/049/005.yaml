revisions:
- from: Любовь соединяет нас с Богом; любовь покрывает множество грехов; любовь всё переносит, во всём проявляет долготерпение. В любви нет ничего низкого, ничего надменного. Любовь не допускает раскола, любовь не поднимает мятежа, любовь всё совершает в согласии. В любви достигли совершенства все избранные Божьи; без любви ничто не угодно Богу.
  to: Любовь соединяет нас с Богом; любовь покрывает множество грехов; любовь всё переносит, во всём терпелива. В любви нет ничего грубого, ничего надменного. Любовь не допускает раскола, любовь не разжигает распрей, любовь всё совершает в единодушии. В любви все избранные Божьи были приведены к совершенству; без любви ничто не угодно Богу.
  rationale: 'Исправлены три смысловые точки: сохранён пассивный залог ἐτελειώθησαν, βάναυσον передано более точным «грубого», а οὐ στασιάζει — контекстуально уместным «не разжигает распрей». «В единодушии» точнее передаёт ὁμονοίᾳ. Смысл, ритм и повторяющаяся анафора оригинала сохранены; сносок не требуется.'
