  text: Who is able to describe the bond of God's love?[a]
translation:
  language: ru
  text: Кто способен описать узы Божьей любви?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «объяснить».'
    reason: Отмечает допустимое значение многозначного ἐξηγήσασθαι, тогда как основной вариант лучше передаёт риторический контекст.
lexical_decisions:
- source_word: δεσμὸν
  choice: узы
  rationale: Передаёт образ связывающей силы любви; в данном возвышенном риторическом контексте естественнее и выразительнее буквального «связь».
- source_word: ἀγάπης τοῦ θεοῦ
  choice: Божьей любви
  rationale: 'Сохраняет неоднозначность греческого родительного: речь может идти о любви, исходящей от Бога, или о любви, направленной к Богу.'
- source_word: ἐξηγήσασθαι
  choice: описать
  rationale: Глагол может означать «изложить, поведать, описать» и здесь участвует в риторическом развитии мысли о невыразимости любви; «описать» лучше соответствует контексту, чем более аналитическое «объяснить».
theological_decisions:
- issue: Значение родительного τοῦ θεοῦ при ἀγάπης
  choice: Божьей любви
  alternative: любви к Богу / любви Бога
  rationale: Краткая русская конструкция сохраняет присущую греческому тексту возможность как субъектного, так и объектного понимания, не навязывая богословского разрешения.
translation_notes:
  register: Современный литературный русский язык с краткой возвышенной риторической формой. «Узы» сохраняют образность оригинала и уместны в раннехристианском увещательном тексте.
