source:
  edition: Funk 1901 (normalized OCR)
  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: ru
  text: Итак, хотя открыто много дверей, эта дверь в праведности — та, что во Христе; в ней[a] блаженны все, кто вошёл и направляет свой путь в святости и праведности, исполняя всё без смятения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через неё».'
    reason: Греческое ἐν ᾗ буквально означает «в которой»; при «вошёл» по смыслу возможно «через которую».
  - marker: b
    text: 'Или: «невозмутимо» или «без тревоги».'
    reason: Наречие ἀταράχως характеризует спокойный, невстревоженный способ действия; не выражает причинения или непри-чинения смуты другим.
lexical_decisions:
- source_word: πυλῶν / ἡ
  choice: дверей / эта дверь
  rationale: Греческое πύλη обозначает ворота или дверь. «Дверь» позволяет естественно сохранить единственное число подразумеваемого существительного при повторённых артиклях.
- source_word: ἡ ἐν δικαιοσύνῃ
  choice: дверь праведности
  rationale: Буквальное «дверь в праведности» по-русски неестественно. Родительная конструкция кратко передаёт связь двери с праведностью, не уточняя сверх текста, ведёт ли она к праведности или характеризуется ею.
- source_word: ἡ ἐν Χριστῷ
  choice: та, что во Христе
  rationale: Сохраняет повторную характеристику подразумеваемой двери и устойчивое раннехристианское выражение ἐν Χριστῷ без замены имени-титула на этимологизированное «Мессия».
- source_word: κατευθύνοντες τὴν πορείαν αὐτῶν
  choice: направляет свой путь
  rationale: Передаёт продолжающееся действие настоящего причастия и образ осознанно направляемого жизненного пути.
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  choice: в святости и праведности
  rationale: Различает ὁσιότης как благочестную святость и δικαιοσύνη как праведность, сохраняя традиционную и понятную религиозную лексику.
- source_word: ἀταράχως
  choice: без смятения
  rationale: Передаёт отсутствие возмущения, беспорядка или тревоги, не сводя значение только к внутреннему спокойствию либо только к общественному миру.
theological_decisions:
- issue: Связь праведности и Христа в описании двери
  choice: эта дверь праведности — та, что во Христе
  alternative: эта дверь, ведущая к праведности, — во Христе
  rationale: Греческий текст отождествляет две характеристики подразумеваемой двери, но не выражает явно идею направления «к» праведности; поэтому она не внесена в основной текст.
- issue: Значение ἐν ᾗ
  choice: в ней
  alternative: через неё
  rationale: Формально местоимение означает «в которой». Вариант «через неё» лучше согласуется с глаголом входа, но добавляет инструментально-пространственный оттенок; он отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным раннехристианским звучанием. Сохранена длинная логическая структура оригинала, но точка с запятой делает её ясной для современного читателя. Формы «во Христе», «святость», «праведность» оставлены как общеупотребительная библейская лексика.
