  source_fidelity: 'Основная структура передана верно: πολλῶν ... πυλῶν ἀνεῳγυιῶν — «открыто много дверей», ἐν Χριστῷ — «во Христе», аорист εἰσελθόντες и настоящее причастие κατευθύνοντες отражены как предшествующее вхождение и продолжающееся направление пути. Однако «дверь праведности» заменяет греческое пространственно-характеризующее ἡ ἐν δικαιοσύνῃ («эта [дверь], в праведности») родительной конструкцией с более определённой смысловой связью. Безопаснее сохранить «в праведности».'
