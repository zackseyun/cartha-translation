id: 1CLEM.48.5
reference: 1 Clement 48:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἤτω τις πιστός, ἤτω δυνατὸς γνῶσιν ἐξεπεῖν, ἤτω σοφὸς ἐν διακρίσει λόγων, ἤτω ἁγνὸς ἐν ἔργοις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: ru
  text: Пусть кто-либо будет верен, пусть будет способен излагать знание, пусть будет мудр в различении слов, пусть будет чист в делах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤτω τις
  choice: пусть кто-либо будет
  rationale: Передаёт неопределённое τις и побудительную форму ἤτω, не ограничивая высказывание мужским полом.
- source_word: πιστός
  choice: верен
  rationale: 'Сохраняет широкий смысл греческого слова: верный, надёжный, исполненный веры; контекст не требует сужать его до одного оттенка.'
- source_word: δυνατὸς γνῶσιν ἐξεπεῖν
  choice: способен излагать знание
  rationale: ἐξεπεῖν означает высказать или подробно изложить; формулировка сохраняет объект γνῶσιν без добавления отсутствующего в тексте содержания.
- source_word: σοφὸς ἐν διακρίσει λόγων
  choice: мудр в различении слов
  rationale: Близко передаёт конструкцию с διάκρισις и сохраняет возможный диапазон λόγοι — слова, высказывания или речи.
- source_word: ἁγνὸς ἐν ἔργοις
  choice: чист в делах
  rationale: Сохраняет нравственно-религиозный оттенок ἁγνός и конкретное множественное ἔργοις.
theological_decisions:
- issue: Значение πιστός
  choice: верен
  alternative: верующий
  rationale: «Верен» сохраняет подлинную неоднозначность между верностью, надёжностью и верой, тогда как «верующий» преждевременно сужает смысл.
- issue: Значение λόγων
  choice: слов
  alternative: учений / речей
  rationale: Буквальное «слов» не навязывает специального доктринального значения и оставляет контекстуальный диапазон греческого λόγοι открытым.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмическим повтором «пусть», соответствующим четырёхчастной греческой конструкции. Начальное «кто-либо» выражено только один раз; далее оно естественно подразумевается.
