lexical_decisions:
- source_word: αὕτη
  choice: вот
  rationale: В контексте указательной формулы естественно передаёт греческое «эта» и сохраняет торжественное библейское звучание.
- source_word: ἡ πύλη τοῦ κυρίου
  choice: врата Господни
  rationale: Форма «врата» уместна для величественного входа и естественна в этой узнаваемой цитатной формуле; родительный τοῦ κυρίου передан относительным прилагательным без изменения смысла.
- source_word: δίκαιοι
  choice: праведные
  rationale: Точно передаёт субстантивированное прилагательное во множественном числе и сохраняет нравственно-богословский смысл.
- source_word: εἰσελεύσονται ἐν αὐτῇ
  choice: войдут в них
  rationale: Греческое ἐν с глаголом движения здесь обозначает прохождение через врата; русское «войдут в них» естественно и учитывает грамматическое число слова «врата».
