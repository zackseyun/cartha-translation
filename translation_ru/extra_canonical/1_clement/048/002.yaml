  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: ru
  text: 'Ведь врата праведности открыты в саму жизнь, как написано: «Откройте мне врата праведности; войдя в них, я возблагодарю Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύλη δικαιοσύνης
  choice: врата праведности
  rationale: Сохраняет библейскую лексику и связь с последующей цитатой, где стоит множественное число πύλας.
- source_word: ἀνεῳγυῖα εἰς ζωὴν αὐτή
  choice: открытые к самой жизни
  rationale: Передаёт перфектное причастие как достигнутое состояние и сохраняет направительное εἰς, а также эмфатическое αὐτή согласно представленному тексту.
- source_word: ἐξομολογήσομαι
  choice: я возблагодарю
  rationale: В контексте псалма глагол означает благодарственное прославление Господа, а не исповедание грехов.
theological_decisions:
- issue: Связь врат праведности с жизнью
  choice: «это врата праведности, открытые к самой жизни»
  alternative: «врата праведности открыты — это сами врата в жизнь»
  rationale: Основной текст следует чтению αὕτη/указательному пониманию, отражённому в проверенном английском слое, но не превращает образ в богословски более определённое утверждение о личности или средстве спасения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Врата» выбраны вместо нейтрального «ворота» ради устойчивого сочетания в цитате; синтаксис остаётся ясным для современного читателя.
