  revision_rationale: Исправленное основное чтение последовательно следует представленному греческому αὐτή и не смешивает его с вариантом αὕτη. Формулировка «открыты в саму жизнь» точнее передаёт образ πύλη ... ἀνεῳγυῖα εἰς ζωήν и звучит естественнее по-русски. Вариантное чтение сохранено в сноске без догматической интерпретации.
