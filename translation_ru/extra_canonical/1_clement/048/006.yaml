review_pass:
  verdict: revise
  source_fidelity: Греческая пропорциональная конструкция τοσούτῳ μᾶλλον … ὅσῳ … μᾶλλον точно передаётся оборотом «чем … тем …». «Ибо» верно отражает пояснительное γάρ. В пересмотренном тексте ταπεινοφρονεῖν передано как устойчивое состояние/настрой «быть смиренным», а τὸ κοινωφελὲς πᾶσιν и τὸ ἑαυτοῦ — как противопоставление того, что полезно всем, и того, что полезно самому человеку.
  naturalness: Исходное «смиряться» в современном русском часто означает покорно принимать тяжёлые обстоятельства или примиряться с ними; здесь оно может исказить смысл. «Быть смиренным» естественно, ясно и соответствует увещевательному регистру. Явное повторение «того, что полезно» делает эллиптическое «а не своей собственной» синтаксически прозрачным.
  terminology: «Смиренный» — точная и традиционно понятная передача ταπεινόφρων без навязывания специальной конфессиональной интерпретации. «Великим» сохраняет сравнительное μείζων и модальность δοκεῖ («кажется»).
  issues:
  - severity: medium
    issue: «Смиряться» двусмысленно в современном русском
    rationale: Обычно это слово обозначает покорное принятие судьбы, лишений или нежелательного положения, тогда как ταπεινοφρονεῖν говорит о смиренном образе мыслей/отношении. Безопаснее передать его как «быть смиренным».
  - severity: low
    issue: Эллипсис «а не своей собственной» недостаточно ясен
    rationale: Хотя подразумевается «пользы», конструкция звучит обрывочно. Повторение «того, что полезно» передаёт противопоставление оригинала естественно и однозначно.
  revised_text: Ибо чем более великим он кажется, тем больше ему следует быть смиренным и искать того, что полезно всем, а не того, что полезно ему самому.
