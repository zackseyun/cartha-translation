source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: ru
  text: Ибо чем более великим он кажется, тем больше ему следует быть смиренным и искать того, что полезно всем, а не того, что полезно ему самому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: смиряться
  rationale: Глагол передаёт деятельное проявление смирения; современное «смиряться» естественно в данном увещевательном контексте.
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: пользы для всех
  rationale: Передаёт субстантивированное прилагательное со значением того, что служит общему благу, и сохраняет прямое отношение πᾶσιν — «для всех».
- source_word: τὸ ἑαυτοῦ
  choice: своей собственной [пользы]
  rationale: В греческом пропущенное существительное восстанавливается из противопоставления τὸ κοινωφελές; русский текст естественно сохраняет эллипсис.
- source_word: δοκεῖ ... μείζων εἶναι
  choice: кажется ... великим
  rationale: 'Сохраняет эпистемическую неоднозначность δοκεῖ: речь о том, каким человек кажется, без утверждения, что он действительно выше других.'
theological_decisions:
- issue: Статус кажущегося величия
  choice: «великим он кажется»
  alternative: «он считается более великим»
  rationale: Выбранный вариант не превращает общественную оценку или видимость в утверждение о действительном духовном превосходстве.
- issue: Связь стиха с предыдущим рассуждением
  choice: «Ведь»
  alternative: «Но»
  rationale: γὰρ имеет пояснительно-причинную, а не противительную функцию.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещевания. Пропорциональная конструкция τοσούτῳ μᾶλλον… ὅσῳ… передана естественным оборотом «чем… тем…»; повтор μᾶλλον отражён словами «более» и «больше».
