  to: Итак, скорее избавимся от этого, припадём к Владыке и будем плакать, умоляя Его, чтобы Он смилостивился, примирился с нами и возвратил нас к благородному и чистому образу жизни, свойственному нашей братской любви.[a]
  rationale: Редакция прямо передаёт κλαύσωμεν как «будем плакать», уточняет оттенок σεμνήν посредством «благородному» и заменяет чрезмерно заявленную «буквальную» сноску на прозрачную альтернативу, не меняя смысла и не разрешая спорную генитивную связь сверх текста.
