source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: ru
  text: Итак, скорее избавимся от этого, припадём к Владыке и будем плакать, умоляя Его, чтобы Он смилостивился, примирился с нами и возвратил нас к благородному и чистому образу жизни, свойственному нашей братской любви.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к благородному и чистому образу жизни нашей братской любви». Оба определения — «благородному» и «чистому» — относятся к «образу жизни».'
    reason: Греческий генитив «нашей братской любви» сжат и допускает несколько близких способов передачи по-русски; сноска сохраняет более формальную альтернативу и уточняет синтаксическую связь определений.
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: покончим
  rationale: В данном контексте глагол означает устранить, удалить существующее зло; «покончим с этим» естественно передаёт призыв решительно от него избавиться.
- source_word: δεσπότῃ
  choice: Владыкой
  rationale: Передаёт обращение к Богу как к полновластному Господину, сохраняя возвышенный регистр.
- source_word: ἵλεως γενόμενος
  choice: смилостивился
  rationale: Идиоматически передаёт просьбу о благосклонности и милости, не вводя более узкого догматического смысла.
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: примирился с нами
  rationale: Сохраняет значение восстановления нарушенных отношений; пассивная по форме конструкция имеет здесь смысл вступления в примирение.
- source_word: ἀγωγὴν
  choice: жизни
  rationale: Здесь речь об образе жизни или поведении; русское «жизнь в братской любви» звучит естественнее, сохраняя нравственный смысл.
- source_word: φιλαδελφίας
  choice: братской любви
  rationale: Передаёт любовь между членами общины, а не только кровное родство.
theological_decisions:
- issue: Отношение Божьей милости к примирению
  choice: «чтобы Он смилостивился, примирился с нами»
  alternative: «чтобы, став милостивым, Он вновь примирил нас с Собой»
  rationale: Выбранный вариант сохраняет последовательность греческого текста и не уточняет сверх источника, является ли Бог субъектом взаимного примирения или тем, кто примиряет людей с Собой.
- issue: Синтаксическая связь σεμνὴν и ἁγνὴν
  choice: 'оба определения отнесены к образу жизни: «к достойной и чистой жизни»'
  alternative: «к чистой жизни, подобающей нашей достойной братской любви»
  rationale: Оба прилагательных стоят в винительном падеже и грамматически определяют ἀγωγήν; вариант не переносит σεμνήν на φιλαδελφίαν.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Формы «падём», «Владыкой» и прописные местоимения поддерживают возвышенный молитвенный регистр; синтаксис остаётся понятным широкому читателю.
