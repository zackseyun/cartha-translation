id: 1CLEM.20.6
reference: 1 Clement 20:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: ru
  text: Масса безбрежного моря, по Его творческому устроению собранная в водоёмы, не выходит за установленные для моря берега, но делает так, как Он ему повелел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χύτος
  choice: масса
  rationale: Слово обозначает массу или объём воды, а не вместилище; это согласуется с причастием «собранная».
- source_word: ἀπείρου θαλάσσης
  choice: безбрежного моря
  rationale: Передаёт идею необъятности моря естественным и возвышенным русским выражением.
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: по Его устроению
  rationale: «Устроение» сохраняет связь δημιουργία с творческой деятельностью Бога и естественно сочетается с последующим описанием порядка.
- source_word: εἰς τὰς συναγωγάς
  choice: в водоёмы
  rationale: В контексте собранных вод συναγωγαί означает места их скопления, водные вместилища.
- source_word: τὰ περιτεθειμένα αὐτῇ χείλη
  choice: положенных ему берегов
  rationale: Буквально χείλη — «края, кромки»; применительно к морю естественный образ — установленные Богом берега, служащие его пределами.
- source_word: διετάξεν
  choice: повелел
  rationale: Передаёт властное установление порядка, которому море подчиняется.
theological_decisions:
- issue: Божье творение и продолжающийся порядок природы
  choice: Сохранить личное Божье действие и повеление морю
  alternative: Передать происходящее безлично как действие законов природы
  rationale: Греческий текст прямо приписывает Богу устроение и повеление, а морю — послушное исполнение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным стилем. Образ берегов сохраняет поэтичность греческого χείλη и одновременно ясно выражает установленные морю границы.
