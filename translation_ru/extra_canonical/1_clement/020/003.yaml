source:
  edition: Funk 1901 (normalized OCR)
  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: ru
  text: Солнце, луна и хоры звёзд, согласно его установлению, в согласии и без всякого отклонения проходят назначенные им пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выходят за назначенные им пределы».'
    reason: ὁρισμοί может обозначать как установленные пути движения, так и назначенные границы; сочетание с ἐξελίσσουσιν допускает обе передачи.
lexical_decisions:
- source_word: ἀστέρων χοροί
  choice: хоры звёзд
  rationale: Сохранён поэтический образ согласованного множества звёзд; «хоры» ближе к χοροί, чем нейтральные «сонмы», и понятно в современном литературном русском.
- source_word: κατὰ τὴν διαταγὴν αὐτοῦ
  choice: согласно его установлению
  rationale: διαταγή обозначает установленный порядок или предписание; «установление» естественно передаёт здесь мысль о заданном Богом миропорядке.
- source_word: ἐν ὁμονοίᾳ
  choice: в полном согласии
  rationale: «Согласие» сохраняет важный для 1 Климента мотив ὁμόνοια и не сводит его лишь к эстетической «гармонии».
- source_word: δίχα πάσης παρεκβάσεως
  choice: без малейшего отклонения
  rationale: Передаёт буквальную всеохватность πάσης и идею отсутствия какого-либо отступления от установленного порядка.
- source_word: ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς
  choice: проходят назначенные им пути
  rationale: В космологическом контексте ἐξελίσσω описывает последовательное движение, а ὁρισμοί — назначенные пределы или траектории. Основной текст использует естественную русскую формулировку, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: «его» со строчной буквы
  alternative: «Его» с прописной буквы
  rationale: По контексту местоимение относится к Богу, однако греческий текст не кодирует почтительную прописную букву; строчное написание сохраняет современную нейтральную издательскую норму без добавления отсутствующего в источнике акцента.
- issue: Значение ὁμόνοια в космическом порядке
  choice: «в полном согласии»
  alternative: «в гармонии»
  rationale: «Согласие» сохраняет риторическую связь с центральной для послания темой единодушия и противопоставлением раздору, не превращая выражение только в эстетическую характеристику.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной образностью. Сохранён метафорический «хор звёзд», а синтаксис сделан плавным и понятным без архаизации.
