source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ οὐρανοὶ τῇ διοικήσει αὐτοῦ σαλευόμενοι ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/001.yaml
  text: The heavens, revolving by his governance, submit to him in peace.
translation:
  language: ru
  text: Небеса, движимые Его управлением, в мире подчиняются Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колеблемые».'
    reason: Сохраняет лексическую неоднозначность σαλευόμενοι, которое обычно может означать колебание или потрясение, хотя здесь контекст поддерживает упорядоченное движение.
lexical_decisions:
- source_word: τῇ διοικήσει αὐτοῦ
  choice: Его управлением
  rationale: Передаёт инструментально-причинный смысл дательного падежа и значение διοίκησις как устрояющего управления.
- source_word: σαλευόμενοι
  choice: движимые
  rationale: В космологическом контексте причастие указывает на движение небес под Божьим управлением; «колеблемые» могло бы ошибочно подразумевать беспорядок. Пассивная форма сохраняется.
- source_word: ἐν εἰρήνῃ
  choice: в мире
  rationale: Естественно и кратко передаёт состояние мира и согласия, в котором небеса подчиняются Богу.
- source_word: ὑποτάσσονται αὐτῷ
  choice: подчиняются Ему
  rationale: Прямо передаёт настоящее время и значение добровольной или установленной упорядоченности без лишнего толкования.
theological_decisions:
- issue: Характер движения небес при σαλευόμενοι
  choice: движимые
  alternative: колеблемые / потрясаемые
  rationale: Выбор согласуется с контекстом космического порядка и словами «в мире», не устраняя при этом словарную возможность значения «колебаться», указанную в примечании.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но ясный синтаксис. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской религиозной издательской практикой.
