  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: ru
  text: Непостижимые глубины бездн и неописуемые области нижнего мира удерживаются одними и теми же повелениями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сдерживаются».'
    reason: Греческое συνέχεται допускает оттенок удержания в границах, подчинения или ограничения установленными повелениями.
lexical_decisions:
- source_word: ἀβύσσων … ἀνεξιχνίαστα
  choice: непостижимые глубины бездн
  rationale: Передаёт родительный ἀβύσσων и значение ἀνεξιχνίαστα — то, что невозможно исследовать или постичь; слово «глубины» естественно выражает подразумеваемые глубинные области.
- source_word: νερτέρων ἀνεκδιήγητα κρίματα
  choice: неописуемые пределы преисподней
  rationale: νερτέρων указывает на нижний, подземный мир; κρίματα здесь по космологическому контексту обозначает разграниченные области или пределы, а не судебные приговоры.
- source_word: τὰς αὐτὰς … προστάξεσιν
  choice: одними и теми же повелениями
  rationale: προστάξεις — властные предписания или повеления; выражение «одними и теми же» ясно передаёт повторяющееся τὰς αὐτάς.
- source_word: συνέχεται
  choice: удерживаются
  rationale: Глагол может обозначать как поддержание целостности, так и удержание в установленных границах; «удерживаются» сохраняет обе стороны значения и соответствует космическому контексту.
theological_decisions:
- issue: Характер действия Божьих повелений в отношении бездн и преисподней
  choice: удерживаются
  alternative: сдерживаются
  rationale: Основной вариант не сводит мысль исключительно к ограничению или принуждению, сохраняя возможный смысл поддержания установленного порядка; более узкое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным космологическим словарём. «Преисподняя» употреблена как обозначение нижнего мира без внесения дополнительных конфессиональных представлений.
