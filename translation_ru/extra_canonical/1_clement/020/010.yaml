revisions:
- from: Пути ветров — каждый в своё время — беспрепятственно совершают своё служение; и неиссякающие источники, созданные для наслаждения и здоровья, не оскудевая, дают людям для жизни свои груди. И самые малые из живых существ собираются вместе в согласии и мире.
  to: Пути ветров в свои сроки беспрепятственно совершают своё служение; и неиссякающие источники, созданные для наслаждения и здоровья, не оскудевая, дают людям для жизни свои груди. И самые малые из живых существ устраивают свои собрания в согласии и мире.
  rationale: 'Внесены лишь две безопасные стилистико-семантические правки: распределительное временное выражение сделано более естественным по-русски, а «собрания» восстановлены как прямой объект, соответствующий συνελεύσεις. Остальная лексика, включая намеренно необычный образ грудей источников, сохранена.'
