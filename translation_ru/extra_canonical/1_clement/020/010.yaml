source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: ru
  text: Пути ветров в свои сроки беспрепятственно совершают своё служение; и неиссякающие источники, созданные для наслаждения и здоровья, не оскудевая, дают людям для жизни свои груди. И самые малые из живых существ устраивают свои собрания в согласии и мире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέμων σταθμοὶ
  choice: пути ветров
  rationale: В данном космологическом контексте σταθμοί обозначает установленные пути или чередование ветров; буквальное «стоянки» по-русски звучало бы неясно и не передавало бы движения.
- source_word: κατὰ τὸν ἴδιον καιρόν
  choice: каждый в своё время
  rationale: Передаёт распределение ветров по свойственным им временам или сезонам, не сужая καιρός до строго календарного значения.
- source_word: τὴν λειτουργίαν αὐτῶν
  choice: совершают своё служение
  rationale: Сохраняет образ назначенной службы в миропорядке; «функция» было бы стилистически сухим и современно-техническим.
- source_word: ἀπροσκόπως
  choice: беспрепятственно
  rationale: В контексте движения ветров означает «без помех, беспрепятственно»; этимологически возможный образ спотыкания по-русски здесь был бы неестественным.
- source_word: ἀέναοί τε πηγαί
  choice: и неиссякающие источники
  rationale: Передаёт непрерывность и неоскудевающий характер источников естественным литературным выражением.
- source_word: δίχα ἐλλείψεως
  choice: не оскудевая
  rationale: Естественно выражает отсутствие недостатка или иссякания и согласуется с образом постоянно дающих источников.
- source_word: παρέχονται ... μαζούς
  choice: дают ... свои груди
  rationale: Сохранена яркая материнская метафора источников из греческого текста, хотя в современном русском она необычна.
- source_word: τὰ ἐλάχιστα τῶν ζῴων
  choice: самые малые из живых существ
  rationale: ζῷον здесь имеет широкое значение живого существа; формулировка не ограничивает смысл только современным биологическим классом животных.
- source_word: τὰς συνελεύσεις αὐτῶν ... ποιοῦνται
  choice: собираются вместе
  rationale: Передаёт смысл совместных собраний естественным русским глагольным оборотом, не добавляя отсутствующего в тексте усиления «даже».
theological_decisions: []
translation_notes:
  register: Современный литературный и достоинственный регистр. Синтаксический параллелизм перечисления сохранён, как и персонификация природных сил и телесная метафора источников. Частица τε перед последним примером передана простым соединительным «и», без добавочного усиления «даже».
