  text: ὠκεανὸς ἀπέραντος ἀνθρώποις καὶ οἱ μετ᾽ αὐτὸν κόσμοι ταγαῖς τοῦ δεσπότου διευθύνονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/008.yaml
  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: ru
  text: Океан, непроходимый для людей,[a] и миры за ним направляются повелениями Владыки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «необъятный для людей»; греческое слово может указывать как на непроходимость, так и на беспредельность.'
    reason: Сохраняет лексическую неоднозначность ἀπέραντος, не перегружая основной текст.
lexical_decisions:
- source_word: ὠκεανὸς
  choice: океан
  rationale: Прямое и естественное соответствие греческому слову в космографическом контексте.
- source_word: ἀπέραντος ἀνθρώποις
  choice: непроходимый для людей
  rationale: Передаёт недоступность океана для человеческого перехода; прилагательное допускает также пространственный оттенок «необъятный, беспредельный», что отмечено в сноске.
- source_word: οἱ μετ᾽ αὐτὸν κόσμοι
  choice: миры за ним
  rationale: Сохраняет древнюю космографическую формулировку и не уточняет природу этих «миров» сверх того, что сказано в греческом тексте.
- source_word: ταγαῖς
  choice: установлениями
  rationale: В данном контексте форма отражает идею предписанного порядка; «установления» естественно выражает нормы или распоряжения, направляющие мироздание.
- source_word: τοῦ δεσπότου
  choice: Владыки
  rationale: Передаёт значение верховного господина и сохраняет возвышенный богословский регистр.
- source_word: διευθύνονται
  choice: управляются
  rationale: Точно передаёт пассивное значение направления и упорядочивания без излишнего уточнения способа действия.
theological_decisions:
- issue: Обозначение Бога словом δεσπότης
  choice: Владыка
  alternative: Господин
  rationale: «Владыка» в русском религиозно-литературном употреблении выражает верховную власть, но не вносит дополнительных конфессиональных смыслов.
- issue: Природа миров за океаном
  choice: сохранено буквальное «миры за ним»
  alternative: земли за океаном
  rationale: κόσμοι буквально означает «миры»; перевод не сводит неоднозначный древний образ к географическим землям.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом. Сохранены древний космографический образ и титул «Владыка»; синтаксис остаётся ясным для широкого читателя.
