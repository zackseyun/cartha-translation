lexical_decisions:
- source_word: δόξα
  choice: слава
  rationale: Прямой и естественный русский эквивалент, сохраняющий торжественный библейский регистр.
- source_word: μεγαλωσύνη
  choice: величие
  rationale: Передаёт значение величия и верховного достоинства без добавления значения силы или власти.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся и понятная формула, точно отражающая усиленное греческое выражение бесконечной длительности.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная транслитерация литургического утверждения.
theological_decisions:
- issue: Отнесение относительного местоимения ᾧ
  choice: Ему
  alternative: Которому
  rationale: В данном самостоятельном стихе «Ему» естественно продолжает славословие и сохраняет мужской род референта, не добавляя его имени; «Которому» в русском требует явного предшествующего синтаксического опорного слова.
- issue: Глагольность формулы славословия
  choice: Сохранена безглагольная формула «Ему слава и величие»
  alternative: «Да будут Ему слава и величие»
  rationale: В греческом глагол отсутствует; безглагольная русская формула сохраняет возможную смысловую напряжённость между утверждением и пожеланием, не разрешая её искусственно.
translation_notes:
  register: Современный литературный русский язык с dignified библейско-литургическим звучанием; архаическая, но общеупотребительная формула «во веки веков» сохранена как точная и естественная в славословии.
