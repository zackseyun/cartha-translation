  yaml_path: translation/extra_canonical/1_clement/020/002.yaml
  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: ru
  text: День и ночь проходят установленный Им путь, ни в чём не мешая друг другу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον
  choice: назначенный Им путь
  rationale: «Путь» естественно передаёт образ δρόμος как установленного движения или хода; страдательная конструкция сохраняет указание на Того, кто его назначил.
- source_word: ἀνύουσιν
  choice: завершают
  rationale: Глагол означает доводить до конца, совершать; «завершают ... путь» сохраняет смысл исполнения установленного хода.
- source_word: μηδὲν ἀλλήλαις ἐμποδίζοντα
  choice: ни в чём не мешая друг другу
  rationale: Естественная современная передача абсолютного отрицания μηδέν и взаимного отношения ἀλλήλαις.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: «Им» с прописной буквы
  alternative: «им» со строчной буквы
  rationale: В контексте главы речь идёт о Божьем установлении космического порядка; прописная буква ясно обозначает этот референт, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и dignified формулировка, близкая к структуре греческого оригинала.
