source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: ru
  text: Всё это великий Творец и Владыка всего повелел быть в мире и согласии, делая добро всему, а нам, прибегшим к Его милосердию через нашего Господа Иисуса Мессию, — неизмеримо более.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διμιουργὸς
  choice: Творец
  rationale: Передаёт обозначение Создателя естественным и возвышенным русским словом; орфография источника представляет вариант обычного δημιουργός.
- source_word: δεσπότης τῶν ἁπάντων
  choice: Владыка всего
  rationale: Сохраняет смысл верховного господства и всеохватность τῶν ἁπάντων без тяжеловесного «всех вещей».
- source_word: ἐν εἰρήνῃ καὶ ὁμονοίᾳ
  choice: в мире и согласии
  rationale: Различает εἰρήνη как мир и ὁμόνοια как единодушное согласие, оставаясь естественным по-русски.
- source_word: εὐεργετῶν
  choice: благотворя
  rationale: Сохраняет обстоятельное причастие и значение деятельного благодеяния.
- source_word: ὑπερεκπερισσῶς δὲ
  choice: а особенно щедро
  rationale: Передаёт усиленное наречие как чрезвычайную меру благодеяния; по-русски это естественнее буквального «сверх меры».
- source_word: τοὺς προσπεφευγότας
  choice: прибегшим
  rationale: Сохраняет образ обращения за защитой и помощи, заложенный в перфектном причастии προσφεύγω.
- source_word: τοῖς οἰκτιρμοῖς αὐτοῦ
  choice: к Его милосердию
  rationale: Русское собирательное единственное естественно передаёт множественное οἰκτιρμοί — проявления сострадания и милости.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  rationale: Передаёт Χριστός как титул «Мессия», а не как непрозрачную транслитерацию.
theological_decisions:
- issue: Объект и мера Божьего благодеяния
  choice: «благотворя всему, а особенно щедро — нам»
  alternative: «благотворя всему, но несравненно более — нам»
  rationale: Сохраняется контраст между благодеянием всему творению и его исключительной мерой по отношению к общине без введения отсутствующего в тексте противопоставления благодати и природы.
- issue: Образ обращения к милосердию Бога
  choice: «нам, прибегшим к Его милосердию»
  alternative: «нам, нашедшим убежище в Его милосердии»
  rationale: «Прибегшим» точнее удерживает направленность греческого προσφεύγω и не утверждает сверх текста, что убежище уже окончательно обретено.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис сохранён как одно протяжённое предложение; «устроить» добавлено при передаче προσέταξεν εἶναι, чтобы по-русски ясно выразить установленный Творцом порядок, не превращая εἶναι в отвлечённое «существовать».
