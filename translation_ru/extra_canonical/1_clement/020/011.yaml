- from: Всё это великий Творец и Владыка всего повелел устроить в мире и согласии, благотворя всему, а особенно щедро — нам, прибегшим к Его милосердию через нашего Господа Иисуса Мессию.
  to: Всё это великий Творец и Владыка всего повелел быть в мире и согласии, делая добро всему, а нам, прибегшим к Его милосердию через нашего Господа Иисуса Мессию, — неизмеримо более.
