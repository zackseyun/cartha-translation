source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: ru
  text: Земля по Его воле вынашивает и в надлежащие сроки производит обильную пищу для людей, зверей и всех живых существ на ней, не колеблясь и не изменяя ничего из того, что Им установлено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: вынашивая
  rationale: Сохраняет образ земли, носящей плод во чреве, не добавляя отсутствующего в греческом тексте слова «плод».
- source_word: τοῖς ἰδίοις καιροῖς
  choice: в надлежащие сроки
  rationale: Передаёт мысль о свойственных, должных временах появления пищи естественным современным русским выражением.
- source_word: τὴν πανπληθῆ ... τροφήν
  choice: обильную пищу
  rationale: Передаёт исключительное изобилие пищи без тяжеловесного буквального соответствия вроде «всеполнейшую».
- source_word: ἀνατέλλει
  choice: даёт ей произрасти
  rationale: Сохраняет образ появления растительности из земли и переходное употребление греческого глагола с объектом «пищу».
- source_word: μήτε διστατάσουσα
  choice: не колеблясь
  rationale: Сохраняет олицетворение земли и значение отсутствия нерешительности или уклонения.
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: из установленного Им
  rationale: Передаёт совершённое властное установление, не сужая его до отдельной заповеди или закона.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: Его / Им с прописной буквы
  alternative: его / им со строчной буквы
  rationale: Контекст главы относит волю и установления к Богу; прописная буква делает этот референт ясным в русском тексте, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, поэтическим олицетворением земли. Сохранены образы вынашивания и произрастания, а также риторическая симметрия отрицаний; архаизмы и искусственно буквальный порядок слов устранены.
