  text: For he said, “Thus far you shall come, and your waves shall be broken within you.”
translation:
  language: ru
  text: 'Ибо Он сказал: «До сих пор дойдёшь, и волны твои сокрушатся в тебе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Иов 38:11. Буквально: «и волны твои сокрушатся в тебе»; древние формы этой цитаты различаются.'
    reason: Примечание указывает источник цитаты и сохраняет заметную текстовую необычность ἐν σοὶ, не исправляя основной текст по иной традиции.
lexical_decisions:
- source_word: εἶπεν γάρ
  choice: Ибо Он сказал
  rationale: Передаёт причинное γάρ и подразумеваемого божественного говорящего; прописная буква уместна в контексте цитаты о Божьем повелении морю.
- source_word: Ἕως ὧδε ἥξεις
  choice: До сих пор дойдёшь
  rationale: 'Естественно и достаточно буквально передаёт установленный предел движения: «дойдёшь лишь до этого места».'
- source_word: τὰ κύματά σου
  choice: волны твои
  rationale: Сохраняет прямое обращение к морю и притяжательное местоимение исходного текста.
- source_word: ἐν σοὶ συντριβήσεται
  choice: сокрушатся в тебе
  rationale: Сохраняет необычный образ и формальную неоднозначность выражения ἐν σοὶ, не подменяя его более привычным «здесь» или «о берег».
theological_decisions:
- issue: Личность подразумеваемого говорящего
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы
  rationale: В контексте автор цитирует Божье повеление морю; прописная буква ясно передаёт референта, не добавляя к содержанию стиха нового богословского утверждения.
- issue: Форма цитаты и её ветхозаветная параллель
  choice: Перевести именно сохранившийся греческий текст 1 Климента
  alternative: Согласовать формулировку с одним из известных вариантов Иов 38:11
  rationale: Текст следует непосредственному источнику и сохраняет выражение «в тебе», хотя параллельные традиции могут формулировать конец строки иначе.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем. Инверсия «волны твои» поддерживает поэтический характер прямой речи; архаизмы и конфессионально окрашенная лексика не используются.
