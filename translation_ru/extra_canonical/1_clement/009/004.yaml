base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: ru
  text: Ной, оказавшийся верным, своим служением возвестил миру возрождение, и через него Владыка сохранил животных, вошедших в ковчег в согласии друг с другом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В критическом чтении: «в согласии». В предоставленном нормализованном OCR-тексте, по-видимому ошибочно, стоит ἐν ὁμοίᾳ; выражения «по двое» в греческом тексте нет.'
    reason: 'Текстологическая прозрачность: засвидетельствованное чтение ἐν ὁμονοίᾳ означает «в согласии» и не поддерживает добавление «по двое».'
lexical_decisions:
- source_word: πιστὸς εὑρεθείς
  choice: признанный верным
  rationale: Передаёт буквальное «найденный верным» естественным современным русским оборотом, сохраняя смысл удостоверенной верности.
- source_word: διὰ τῆς λειτουργίας αὐτοῦ
  choice: своим служением
  rationale: λειτουργία здесь означает исполненное Ноем служение, а не позднейшее узкое значение богослужебной литургии.
- source_word: παλιγγενεσίαν
  choice: возрождение
  rationale: Сохраняет сильное значение нового начала для мира после потопа и не сужает его до простого восстановления.
- source_word: διέσωσεν
  choice: сохранил
  rationale: Глагол выражает спасение и сохранение живыми через опасность; в контексте животных в ковчеге «сохранил» звучит точно и естественно.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт титул верховного Господина, отличая δεσπότης от более обычного κύριος.
- source_word: ἐν ὁμονοίᾳ
  choice: в согласии друг с другом
  rationale: Следует известному чтению текста 1 Климента и передаёт взаимное согласие; не добавляет отсутствующее в греческом «по двое».
theological_decisions:
- issue: Смысл παλιγγενεσία применительно к миру
  choice: возрождение
  alternative: обновление
  rationale: «Возрождение» ближе к лексической силе παλιγγενεσία и сохраняет возможный богословский оттенок нового начала, не объясняя его сверх текста.
- issue: Посредничество Ноя в сохранении животных
  choice: через него Владыка сохранил
  alternative: благодаря ему Владыка сохранил
  rationale: «Через него» формально сохраняет δι’ αὐτοῦ и не превращает Ноя в самостоятельную причину спасения.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Сохранены богословски значимые «возрождение» и титул «Владыка»; устранено не подтверждаемое греческим текстом уточнение «по двое».
