  to: Возьмём Еноха, который в послушании оказался праведным, был перенесён, и смерти его не нашли.
  rationale: Убрано контекстуально вероятное, но текстуально не выраженное уточнение «на небо». Сохранены увещевательный характер начала, связь праведности с послушанием без навязывания значения причины или сферы и необычный образ «смерти его не нашли».
