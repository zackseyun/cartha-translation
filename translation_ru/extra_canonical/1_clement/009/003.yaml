  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: ru
  text: Возьмём Еноха, который в послушании оказался праведным, был перенесён, и смерти его не нашли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν Ἐνώχ
  choice: Возьмём в пример Еноха
  rationale: Передаёт увещевательное «возьмём, рассмотрим» естественным современным русским языком.
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθείς
  choice: оказался праведным в послушании
  rationale: Сохраняет конструкцию с «быть найденным/оказаться» и связь праведности с послушанием, не уточняя её сверх сказанного в греческом тексте.
- source_word: μετετέθη
  choice: был взят на небо
  rationale: В предании о Енохе глагол обозначает его сверхъестественное взятие; такой перевод понятен по-русски и избегает современного канцелярского оттенка слова «переведён».
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: смерти его не нашли
  rationale: Сохраняет необычную формулировку и библейскую аллюзию, не заменяя её пояснением вроде «он не умер».
theological_decisions:
- issue: Куда был взят Енох
  choice: был взят на небо
  alternative: был перенесён
  rationale: Контекст традиции об Енохе подразумевает взятие Богом, однако буквальное значение глагола отмечено в сноске, чтобы не скрывать форму исходного текста.
- issue: Связь праведности и послушания
  choice: праведным в послушании
  alternative: праведным благодаря послушанию
  rationale: Предлог ἐν допускает оттенки сферы и средства; более формальная передача сохраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Заключительная фраза намеренно сохраняет необычный порядок и образность исходного текста.
