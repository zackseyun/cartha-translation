id: 1CLEM.9.1
reference: 1 Clement 9:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: ru
  text: Поэтому будем послушны Его величественной и славной воле и, став просителями Его милости и благости,[a] падём перед Ним и обратимся к Его состраданию, оставив тщетный труд, распри и ревность, ведущую к смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «став просителями, молящими о Его милости и благости».'
    reason: Родительный падеж в греческом допускает буквальную связь «просители милости и благости», но по смыслу, вероятно, обозначает то, о чём просят.
lexical_decisions:
- source_word: βουλήσει
  choice: воле
  rationale: В данном призыве слово обозначает Божье намерение или волю; «воля» естественно сочетается с призывом к послушанию и не устраняет оттенок замысла.
- source_word: ἱκέται γενόμενοι
  choice: став просителями
  rationale: Передаёт положение смиренно молящих и ищущих милости, сохраняя связь с последующим «падём перед Ним».
- source_word: χρηστότητος
  choice: благости
  rationale: Сохраняет нравственный оттенок доброты и милостивого отношения; стилистически соответствует торжественному контексту.
- source_word: προσπέσωμεν
  choice: падём перед Ним
  rationale: Передаёт телесный и образный жест мольбы; местоимение «Ним» ясно восстанавливает подразумеваемый объект.
- source_word: οἰκτιρμοὺς
  choice: состраданию
  rationale: Русское собирательное единственное звучит естественнее буквального множественного числа «сострадания», сохраняя смысл милосердного участия.
- source_word: ματαιοπονίαν
  choice: тщетные труды
  rationale: Передаёт сложное слово как бесплодные, напрасные усилия, а не просто общую «суету».
- source_word: ζῆλος
  choice: ревность
  rationale: Сохраняет возможный диапазон между ревностным соперничеством и завистью; отрицательный смысл уточняется оборотом «ведущую к смерти».
theological_decisions:
- issue: Значение βούλησις применительно к Богу
  choice: воля
  alternative: замысел
  rationale: «Воля» наиболее естественно связана с ὑπακούσωμεν («будем послушны»), но не исключает смысла Божьего намерения.
- issue: Функция родительных τοῦ ἐλέους καὶ τῆς χρηστότητος
  choice: просителями Его милости и благости
  alternative: просящими о Его милости и благости
  rationale: Русская конструкция сохраняет формальную близость и допускает понимание милости и благости как того, чего ищут; примечание делает объективный смысл явным.
- issue: Отрицательный смысл ζῆλος
  choice: ревность
  alternative: зависть
  rationale: Греческое слово неоднозначно и может означать ревность, рвение, соперничество или зависть. Контекст отрицателен, однако перевод «зависть» чрезмерно сужал бы значение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены коллективные формы призыва, параллелизм и богословски значимая неоднозначность; избегнуты архаизмы вроде «внемлем» и «припадём».
