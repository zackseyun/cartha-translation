lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Обратим взор
  rationale: Передаёт призыв пристально направить внимание на кого-либо; звучит естественно и достойно в современном литературном русском.
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: тех, кто безупречно служил
  rationale: λειτουργέω обозначает исполнение служения, а τελείως — его полную, безупречную меру; причастная конструкция естественно раскрыта придаточным предложением.
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: Его величественной славе
  rationale: Дательный падеж естественнее всего понимать как объект служения. «Величественной» сохраняет смысл μεγαλοπρεπής и торжественный регистр.
theological_decisions:
- issue: Связь дательного τῇ μεγαλοπρεπεῖ δόξῃ с λειτουργήσαντας
  choice: служил Его величественной славе
  alternative: служил в Его величественной славе
  rationale: Греческий дательный допускает оттеночную неоднозначность, однако при λειτουργέω наиболее прямым является значение того, кому или чему совершается служение. Русское «служить славе» грамматически естественно и не вносит дополнительного предлога.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным увещательным тоном; местоимение «Его» написано с прописной буквы как традиционное почтительное указание на Бога.
