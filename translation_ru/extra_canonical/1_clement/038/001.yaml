  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: ru
  text: Итак, пусть всё наше тело сохраняется во Христе Иисусе, и пусть каждый подчиняется своему ближнему, как он поставлен в своём даре.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как он был поставлен (или: помещён) в своём даре».'
    reason: Греческий оборот καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ краток и допускает разные истолкования связи назначения с даром; основной текст сохраняет его без добавления понятия «место».
lexical_decisions:
- source_word: Σωζέσθω (исправление очевидной OCR-ошибки Συνξέσϑω)
  choice: пусть … сохраняется
  rationale: Глагол σώζω допускает значения «спасать» и «сохранять». В образе единого тела и в данном контексте «сохраняется» естественно передаёт продолжительное состояние, не исключая спасительного оттенка.
- source_word: ὅλον τὸ σῶμα ἡμῶν
  choice: всё наше тело
  rationale: Сохранён коллективный образ общины как единого тела без замены его поясняющим словом «община».
- source_word: ὑποτασσέσθω
  choice: пусть … подчиняется
  rationale: Передаёт повелительное значение и идею добровольного признания установленного порядка.
- source_word: τῷ πλησίον αὐτοῦ
  choice: своему ближнему
  rationale: Естественный современный русский эквивалент, сохраняющий единственное число и взаимную направленность наставления.
- source_word: ἐν τῷ χαρίσματι αὐτοῦ
  choice: в его даре
  rationale: Буквально сохраняет связь с χάρισμα — даром, данным по благодати, — и не уточняет без достаточных оснований, идёт ли речь о служении, способности или положении.
theological_decisions:
- issue: Значение σωζέσθω применительно ко всему телу
  choice: сохраняется
  alternative: спасается
  rationale: Оба оттенка лексически возможны; «сохраняется» лучше соответствует образу целостности тела, не устраняя возможной сотериологической окраски.
- issue: Связь назначенного места и дара в καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ
  choice: сообразно тому месту, которое определено ему в его даре
  alternative: как он был поставлен согласно своему дару
  rationale: Выбранная формулировка сохраняет пассивное «определено» и неоднозначность оборота ἐν τῷ χαρίσματι, не превращая дар однозначно в основание назначения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксический параллелизм двух повелительных форм сохранён; конфессионально специфические толкования «дара» и устройства общины не внесены.
