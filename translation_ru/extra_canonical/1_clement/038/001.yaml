    rationale: В ἐτέθη нет существительного «место», а καθὼς означает «как/согласно тому, как», не «сообразно тому месту». Такая переработка чрезмерно истолковывает спорно-сжатый оборот ἐν τῷ χαρίσματι αὐτοῦ.
