id: 1CLEM.38.3
reference: 1 Clement 38:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: ru
  text: Итак, задумаемся, братья, из какой материи мы возникли, каковыми и кем мы явились в мир; из какой могилы и тьмы Тот, кто образовал и сотворил нас, ввёл нас в Свой мир, заранее приготовив Свои благодеяния ещё до нашего рождения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: задумаемся
  rationale: Передаёт призыв внимательно обдумать и осмыслить, оставаясь естественным для современного русского языка.
- source_word: ὕλης
  choice: вещества
  rationale: Сохраняет материальный оттенок ὕλη и вопрос о том, из чего произошёл человек.
- source_word: ποῖοι καὶ τίνες
  choice: какими и кем мы были
  rationale: 'Сохраняет двойное выражение: ποῖοι указывает на качество или состояние, а τίνες — на то, кем были люди; добавленное «были» естественно восполняет подразумеваемую связку.'
- source_word: τάφου καὶ σκότους
  choice: могилы и тьмы
  rationale: Буквально сохраняет сильную образность текста и не сводит её без достаточных оснований только к утробе или смерти.
- source_word: ὁ πλάσας ἡμᾶς καὶ δημιουργήσας
  choice: Тот, Кто образовал и сотворил нас
  rationale: 'Передаёт два близких, но различимых глагола: πλάσσω — придавать форму, δημιουργέω — создавать.'
- source_word: εὐεργεσίας
  choice: благодеяния
  rationale: «Благодеяния» точнее обычного «дары» передаёт значение оказанных благ и сохраняет оттенок лексики благотворения.
theological_decisions:
- issue: Образ «могилы и тьмы»
  choice: Сохранён буквально без поясняющего отождествления
  alternative: Передать как указание на материнскую утробу или на духовную смерть
  rationale: Сам стих не раскрывает образ однозначно; перевод не должен устранять его богословскую и риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис слегка упорядочен точкой с запятой, чтобы длинное греческое предложение было ясно обычному читателю; повтор и образность оригинала сохранены.
