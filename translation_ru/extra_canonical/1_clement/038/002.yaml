source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: ru
  text: Пусть сильный заботится о слабом, а слабый уважает сильного. Пусть богатый помогает бедному, а бедный благодарит Бога за то, что Он дал ему того, через кого может быть восполнена его нужда. Пусть мудрый являет свою мудрость не словами, а добрыми делами. Пусть смиренный не свидетельствует о себе сам, но позволяет другому свидетельствовать о нём. Пусть тот, кто чист телом, не хвалится, зная, что другой дарует ему воздержание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зная, что другой даёт ему силу владеть собой».'
    reason: Слово ἐγκράτεια может обозначать как воздержание, так и более широкое самообладание; примечание сохраняет этот смысловой диапазон.
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: пусть заботится
  rationale: Передаёт постоянную деятельную заботу сильного о слабом естественным современным русским выражением.
- source_word: ἐντρεπέσϑω
  choice: пусть уважает
  rationale: В данном контексте глагол означает почтительное отношение; «уважает» сохраняет взаимность наставления без чрезмерно сильного оттенка страха.
- source_word: ἐπιχορηγείτω
  choice: пусть помогает
  rationale: По отношению богатого к бедному обозначает материальное обеспечение или снабжение; более широкое «помогает» естественно по-русски и согласуется с последующим восполнением нужды.
- source_word: ὑστέρημα
  choice: нужда
  rationale: Здесь речь о том, чего бедному недостаёт; «нужда» лучше передаёт контекст, чем буквальное «недостаток».
- source_word: ταπεινοφρονῶν
  choice: смиренный
  rationale: Кратко и естественно передаёт человека со смиренным образом мыслей.
- source_word: ἁγνὸς ἐν τῇ σαρκὶ
  choice: тот, кто чист телом
  rationale: Сохраняет телесный аспект чистоты, не сужая его без необходимости до одной конкретной сферы.
- source_word: ἐγκράτεια
  choice: воздержание
  rationale: Сохраняет значение самообладания, особенно уместное в контексте телесной чистоты.
theological_decisions:
- issue: Кто подразумевается словом ἕτερος («другой») как податель воздержания
  choice: не он сам, а другой
  alternative: Бог дарует ему воздержание
  rationale: Греческий текст прямо говорит «другой», хотя по контексту, вероятно, подразумевает Бога. Перевод не делает подразумеваемое имя явным и сохраняет формулировку источника.
- issue: Кого или что Бог дал бедному
  choice: дал ему того, через кого восполняется его нужда
  alternative: дал ему средство, которым восполняется его нужда
  rationale: Относительное местоимение ᾧ допускает подразумеваемого благодетеля; личная формулировка естественно связывает предложение с богатым, но не отождествляет его с ним прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «пусть» сохраняет риторический параллелизм греческого текста; синтаксис слегка упрощён ради ясности, без устранения исходной богословской недосказанности.
