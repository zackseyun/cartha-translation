  text: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες, ὀφείλομεν κατὰ πάντα εὐχαριστεῖν αὐτῷ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: Итак, поскольку всё это мы имеем от Него, мы должны во всём благодарить Его. Ему слава во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες
  choice: Итак, поскольку всё это мы имеем от Него
  rationale: Причастный оборот передан естественным русским придаточным причины; ἐξ αὐτοῦ сохраняет значение источника — «от Него».
- source_word: κατὰ πάντα εὐχαριστεῖν αὐτῷ
  choice: во всём благодарить Его
  rationale: κατὰ πάντα допускает оттенок «во всех отношениях / за всё»; формулировка «во всём» сохраняет широту выражения без излишнего уточнения.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое, понятное и возвышенное русское соответствие греческой формуле, обозначающей вечность.
theological_decisions:
- issue: Отнесение местоимения ᾧ
  choice: Ему слава
  alternative: которому слава
  rationale: Местоимение относится к Богу, упомянутому как источник всех даров; отдельное предложение естественно по-русски и не добавляет догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным церковно-библейским завершением. Заглавная буква в местоимениях «Него», «Его», «Ему» служит традиционным русским обозначением обращения к Богу; смысловая неоднозначность оригинала не устраняется.
