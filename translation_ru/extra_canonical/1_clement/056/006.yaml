reference: 1 Clement 56:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: ru
  text: 'И снова сказано:


    «Блажен человек, которого обличает Господь[a];

    не отвергай вразумления Вседержителя,

    ведь Он причиняет боль и вновь восстанавливает;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого Господь обличил».'
    reason: Греческий аорист допускает формальную передачу прошедшим временем, хотя в контексте вероятнее выражает общую истину.
lexical_decisions:
- source_word: ἤλεγξεν
  choice: обличает
  rationale: Греческий аорист в формуле блаженства выражает общую истину; настоящее время естественно передаёт это по-русски и согласуется с последующими глаголами настоящего времени.
- source_word: νουθέτημα
  choice: вразумление
  rationale: Передаёт исправляющее наставление или предостережение, сохраняя возвышенный, но понятный современному читателю регистр.
- source_word: παντοκράτορος
  choice: Вседержителя
  rationale: Устоявшийся и точный русский эквивалент титула παντοκράτωρ.
- source_word: ἀλγεῖν ποιεῖ
  choice: причиняет боль
  rationale: Близко передаёт каузативную конструкцию «делает так, что [кто-либо] испытывает боль», не уточняя вид страдания сверх текста.
- source_word: πάλιν ἀποκαθίστησιν
  choice: вновь восстанавливает
  rationale: Сохраняет как значение возвращения к прежнему состоянию в ἀποκαθίστησιν, так и повторность или обратный поворот, выраженный πάλιν.
theological_decisions:
- issue: Временное значение ἤλεγξεν
  choice: обличает
  alternative: обличил
  rationale: Хотя форма является аористом, в данном изречении она естественно понимается гномически, как общее утверждение. Альтернативное буквальное временное прочтение сохранено в примечании.
- issue: Субъект λέγει
  choice: сказано
  alternative: он говорит / Писание говорит
  rationale: Безличная формулировка естественна по-русски и не вводит прямо названного субъекта, которого в данном стихе по-гречески нет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксический параллелизм цитаты сохранён; заключительная точка с запятой и незакрытая кавычка показывают, что цитата продолжается в следующем стихе.
