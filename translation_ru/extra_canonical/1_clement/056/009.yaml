  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: ru
  text: 'Во время голода он спасёт тебя от смерти,

    а во время войны избавит тебя из железной руки[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «из руки железа». Образ «руки» может означать силу или власть; «железо» может обозначать железное оружие, в частности меч.
    reason: Сохраняет буквальный образ и его неоднозначность, не сужая значение греческого σιδήρου в основном тексте.
lexical_decisions:
- source_word: ἐν λιμῷ
  choice: во время голода
  rationale: Естественно передаёт обстоятельственное значение греческого оборота, не утрачивая образ голода.
- source_word: ῥύσεταί σε ἐκ θανάτου
  choice: спасёт тебя от смерти
  rationale: ῥύομαι означает спасать или вырывать из опасности; русский оборот точно и естественно передаёт смысл.
- source_word: ἐν πολέμῳ
  choice: на войне
  rationale: Обычный современный русский эквивалент обстоятельственного оборота.
- source_word: ἐκ χειρὸς σιδήρου
  choice: от власти меча
  rationale: χειρός в семитизированном обороте обозначает власть или силу, а σιδήρου («железа») метонимически указывает на железное оружие, прежде всего меч. Основной текст передаёт смысл идиомы, а буквальный образ сохраняется в примечании.
- source_word: λύσει σε
  choice: избавит тебя
  rationale: Передаёт значение освобождения из угрожающей власти и сохраняет отличие от глагола «спасёт» в первой строке.
theological_decisions:
- issue: Неявно названный субъект глаголов
  choice: он
  alternative: Он
  rationale: В греческом тексте субъект выражен только формой глагола и в данном фрагменте прямо не назван. Строчная буква не вносит в перевод дополнительного конфессионального оформления, хотя контекст указывает на Бога.
- issue: Образ «руки железа»
  choice: смысловой оборот «власть меча» с буквальным вариантом в сноске
  alternative: «из руки железа»
  rationale: Так сохраняется богословски значимый образ избавления от смертоносной силы войны, но исключается неестественная для русского языка смешанная метафора; буквальная неоднозначность отмечена явно.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным параллелизмом исходного изречения. Две строки сохраняют синтаксическое равновесие греческого текста; лексика понятна широкому читателю и не привносит конфессиональных особенностей.
