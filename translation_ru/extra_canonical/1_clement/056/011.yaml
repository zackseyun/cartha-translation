  text: 'Ты будешь смеяться над неправедными и беззаконными

    и совсем не будешь бояться диких зверей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδίκων καὶ ἀνόμων
  choice: неправедными и беззаконными
  rationale: 'Сохраняются два однородных определения: ἄδικος указывает на неправедность, а ἄνομος — на беззаконие.'
- source_word: καταγελάσῃ
  choice: будешь смеяться
  rationale: Передаёт значение насмешки или смеха над кем-либо; управление с родительным выражено русским «над».
- source_word: θηρίων ἀγρίων
  choice: диких зверей
  rationale: Естественное современное соответствие сочетанию «звери дикие».
- source_word: οὐ μὴ φοβηθῇς
  choice: вовсе не убоишься
  rationale: Усиленное греческое отрицание οὐ μή передано словом «вовсе»; форма будущего времени соответствует контексту.
