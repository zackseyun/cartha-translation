  source_fidelity: 'Греческий текст содержит два аориста: ἔπαισεν («поразил») и ἰάσαντο («исцелили»). Настоящее время в черновике возможно как интерпретация афористического смысла, но при заявленном optimal-equivalence и при отсутствии явного контекстуального основания для такой нормализации предпочтительно передать аористы прошедшим временем. Объект при ἰάσαντο в греческом не выражен; добавлять «его» не следует.'
  naturalness: «Он поразил, и руки Его исцелили» — намеренно краткая, афористическая формула; в данном параллелизме отсутствие дополнения допустимо и сохраняет лаконичность оригинала. Порядок «руки Его» естественнее для современного литературного русского, чем «Его руки» в этом ритмическом контексте.
  terminology: «Поразил» точно передаёт ἔπαισεν в контексте Божьего наказания/поражения; «исцелили» передаёт ἰάσαντο без внесения невыраженного объекта. Написание «Его» с прописной буквы согласовано с принятой в черновике отсылкой к Богу.
