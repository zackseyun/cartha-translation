  text: Он поразил, и руки Его исцелили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν
  choice: поражает
  rationale: Глагол означает «ударить, поразить». Настоящее время естественно передаёт обобщающий, изреченческий смысл аориста в данном контексте.
- source_word: αἱ χεῖρες αὐτοῦ ἰάσαντο
  choice: Его руки исцеляют
  rationale: Сохранён образ рук как действующего субъекта и не добавлен отсутствующий в греческом тексте объект исцеления. Русское «исцеляют» допускает абсолютное употребление и передаёт переходный смысл без искусственного уточнения.
theological_decisions:
- issue: Не назван объект исцеления
  choice: Не добавлять «его» или иной объект
  alternative: «Его руки исцеляют его»
  rationale: Греческий текст не выражает объекта; его добавление устранило бы сохранённую автором недосказанность.
- issue: Время глаголов
  choice: Передать аористы настоящим временем как обобщающее высказывание
  alternative: «Он поразил, и Его руки исцелили»
  rationale: Форма аориста сохранена в примечании, однако в русском настоящее время яснее передаёт изреченческий смысл и делает фразу естественной, не меняя её богословского содержания.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка с достоинством афористического изречения. Местоимение «Его» написано с прописной буквы как указание на Бога в непосредственном контексте.
