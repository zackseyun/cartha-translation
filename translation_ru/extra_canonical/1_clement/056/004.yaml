  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: ru
  text: '«Ибо кого Господь любит, того воспитывает,

    и бичует каждого сына, которого принимает».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Притч. 3:12 (LXX); ср. Евр. 12:6.
    reason: Фраза является цитатой Притч. 3:12 в греческой версии Септуагинты; тот же текст приводится в Евр. 12:6.
lexical_decisions:
- source_word: παιδεύει
  choice: наставляет
  rationale: Глагол обозначает воспитание и исправительное наставление; «наставляет» сохраняет педагогический смысл и не сужает его до одного лишь наказания.
- source_word: μαστιγοῖ
  choice: наказывает бичом
  rationale: Передаёт буквальный и суровый образ бичевания, сохраняя отличие от более широкого παιδεύει.
- source_word: παραδέχεται
  choice: принимает
  rationale: Прямой современный эквивалент со значением признания и принятия сына.
theological_decisions:
- issue: Характер Господнего воздействия
  choice: Сохранены одновременно воспитательное наставление и суровый образ наказания бичом.
  alternative: Передать оба глагола общим словом «наказывает».
  rationale: Греческий текст различает παιδεύει и μαστιγοῖ; унификация устранила бы значимое напряжение между воспитанием и болезненным исправлением.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и сурового телесного образа оригинала.
