  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: ru
  text: 'Ибо так говорит святое слово:


    «Господь строго наказал меня


    и смерти не предал».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь сурово вразумил меня».'
    reason: «Вразумил» отражает воспитательно-исправительный аспект παιδεύω, тогда как основной текст передаёт его значение строгого дисциплинирующего наказания в цитате из Пс 117(118):18.
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: святое слово
  rationale: Формально и естественно передаёт обозначение цитируемого Писания как святого слова.
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: Сурово вразумил меня
  rationale: Сочетание причастия и личной формы одного глагола воспроизводит семитскую усилительную конструкцию; «сурово» передаёт интенсивность, а «вразумил» сохраняет воспитательно-исправительный смысл παιδεύω.
- source_word: τῷ θανάτῳ οὐ παρέδωκέν με
  choice: смерти меня не предал
  rationale: Сохраняет персонифицирующую конструкцию с дательным падежом и прямой смысл глагола παραδίδωμι.
theological_decisions:
- issue: Характер Господнего воздействия в παιδεύω
  choice: вразумил
  alternative: наказал / подверг наказанию
  rationale: «Вразумил» удерживает воспитательно-исправительную сторону слова и не сводит его значение только к возмездию; наречие «сурово» сохраняет силу воздействия.
- issue: Сила повторной глагольной конструкции Παιδεύων ἐπαίδευσεν
  choice: 'интенсивность: «сурово»'
  alternative: 'уверенность: «несомненно» / «верно»'
  rationale: В цитате из Пс 117(118):18 конструкция отражает семитский усилительный оборот и в данном контексте естественнее обозначает степень наказующего вразумления, а не эпистемическую уверенность.
