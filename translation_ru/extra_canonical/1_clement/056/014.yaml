  yaml_path: translation/extra_canonical/1_clement/056/014.yaml
  text: 'And you will know that your offspring will be many,

    and your children like the abundant grass of the field[a].'
translation:
  language: ru
  text: 'И узнаешь, что потомство твоё многочисленно,

    а дети твои — как пышная трава в поле[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «как вся растительность поля».'
    reason: Редкое слово παμβότανον может иметь более широкое собирательное значение, помимо образа пышной травы.
lexical_decisions:
- source_word: γνώσῃ
  choice: узнаешь
  rationale: Будущая форма передана естественным русским глаголом, сохраняющим значение приобретённого знания или удостоверения.
- source_word: πολὺ τὸ σπέρμα σου
  choice: потомство твоё многочисленно
  rationale: В данном контексте σπέρμα обозначает совокупность потомков; «потомство» естественно сочетается с «многочисленно» и не вносит неуместного буквального образа семени.
- source_word: τὰ τέκνα σου
  choice: дети твои
  rationale: Прямой и стилистически нейтральный эквивалент τέκνα.
- source_word: τὸ παμβότανον τοῦ ἀγροῦ
  choice: обильная трава в поле
  rationale: Редкое παμβότανον указывает на обильную растительность; выражение передано понятным собирательным образом без чрезмерной конкретизации.
