source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: ru
  text: И ты сойдёшь в могилу, как зрелое зерно, пожинаемое в свой срок, или как ворох на гумне, собранный в должное время.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ ἐν τάφῳ
  choice: сойдёшь в могилу
  rationale: Передаёт направленность движения к могиле естественным для русской библейской поэзии выражением, не добавляя идеи насильственной смерти.
- source_word: σῖτος ὥριμος
  choice: зрелое зерно
  rationale: σῖτος может обозначать хлебное зерно или пшеницу; более широкое «зерно» сохраняет объём значения исходного слова.
- source_word: κατὰ καιρὸν
  choice: в свой срок
  rationale: Передаёт идею надлежащего, установленного времени, а не просто календарного момента.
- source_word: θημωνιὰ ἅλωνος
  choice: ворох на гумне
  rationale: θημωνιά обозначает собранную кучу или ворох, а ἅλων — место молотьбы; формулировка сохраняет земледельческий образ без неоправданного уточнения содержимого вороха.
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: собранный в должное время
  rationale: Сохраняет пассивное значение причастия и смысл своевременного сбора.
