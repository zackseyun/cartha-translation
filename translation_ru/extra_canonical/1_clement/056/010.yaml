review_pass:
  verdict: revise
  source_fidelity: Начальное καὶ передано верно. «Укроет» хорошо соответствует κρύψει, а образ «бич языка» сохраняет метафору μάστιγος γλώσσης. Однако «когда они придут» несколько ослабляет и переформулирует определение ἐπερχομένων («надвигающихся/наступающих»); усиленное οὐ μὴ лучше явно передать словом «вовсе».
  naturalness: «Не убоишься» понятно, но для современного литературного русского несколько архаично. «Вовсе не испугаешься надвигающихся бедствий» естественно, сохраняет возвышенно-поэтический тон и прямо передаёт динамику греческого причастия.
  terminology: «Бич языка» уместен как традиционный библейско-поэтический образ. Написание «Он» с прописной буквы не следует из изолированного греческого предложения и в данном фрагменте излишне закрепляет референта; строчная буква сохраняет обычную русскую графику без богословской интерпретации.
  issues:
  - severity: medium
    issue: Причастие ἐπερχομένων передано временным придаточным «когда они придут».
    rationale: Греческое причастие характеризует бедствия как наступающие или надвигающиеся. Придаточное возможно по смыслу, но менее непосредственно передаёт исходную конструкцию.
  - severity: low
    issue: Усиление οὐ μὴ не выражено явно.
    rationale: Сочетание οὐ μὴ с аористным конъюнктивом является усиленным отрицанием; «вовсе не» естественно отражает эту настойчивость.
  - severity: low
    issue: Прописная буква в «Он» интерпретирует невыраженный в данном предложении референт.
    rationale: Греческий текст даёт лишь подразумеваемое подлежащее. Строчная буква не меняет смысла и не навязывает конфессиональную издательскую конвенцию.
  revised_text: И он укроет тебя от бича языка, и ты вовсе не испугаешься надвигающихся бедствий.
  revised_footnotes: []
  revision_rationale: Правка сохраняет порядок и поэтическую связность исходного текста, точнее передаёт ἐπερχομένων как характеристику наступающих бедствий и отмечает усиление οὐ μὴ естественным русским наречием. «Бич языка» оставлен как точный и понятный образ. Прописная буква устранена, поскольку сама фраза не называет субъекта.
