revisions:
- from: И Он укроет тебя от бича языка, и ты не убоишься бедствий, когда они придут.
  to: И он укроет тебя от бича языка, и ты вовсе не испугаешься надвигающихся бедствий.
  rationale: Правка сохраняет порядок и поэтическую связность исходного текста, точнее передаёт ἐπερχομένων как характеристику наступающих бедствий и отмечает усиление οὐ μὴ естественным русским наречием. «Бич языка» оставлен как точный и понятный образ. Прописная буква устранена, поскольку сама фраза не называет субъекта.
