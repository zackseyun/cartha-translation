  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: ru
  text: И он укроет тебя от бича языка, и ты вовсе не испугаешься надвигающихся бедствий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάστιγος γλώσσης
  choice: бича языка
  rationale: 'Сохраняет выразительную метафору греческого текста: губительная или карающая речь уподобляется бичу.'
- source_word: κρύψει
  choice: укроет
  rationale: Естественно передаёт защиту и сокрытие от опасности, выраженные глаголом κρύπτω.
- source_word: οὐ μὴ φοβηθήσῃ
  choice: не убоишься
  rationale: Передаёт усиленное греческое отрицание как твёрдое заверение; слегка возвышенная форма уместна в поэтической цитате и остаётся понятной современному читателю.
- source_word: κακῶν ἐπερχομένων
  choice: бедствий, когда они придут
  rationale: Κακά в данном контексте естественно означает бедствия или несчастья, а причастие ἐπερχομένων передано временной конструкцией без сужения смысла до одного лишь «приближения».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, поэтическим звучанием. Начальное καὶ сохранено как «И», чтобы передать связность и многосоюзие цитируемого текста. Местоимение «Он» написано с прописной буквы согласно русской религиозной издательской традиции, поскольку подразумевается Бог; это не устраняет референтную связь с контекстом.
