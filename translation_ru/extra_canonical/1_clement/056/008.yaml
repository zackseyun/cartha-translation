  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: ru
  text: 'Шесть раз избавит тебя от бед,


    и в седьмой раз зло не коснётся тебя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἀναγκῶν
  choice: от бед
  rationale: Множественное ἀνάγκαι здесь означает тяжёлые обстоятельства, бедствия или невзгоды; «от бед» естественно по-русски и сохраняет широкий смысл.
- source_word: ἐξελεῖταί σε
  choice: Он избавит тебя
  rationale: Будущая форма ἐξαιρέω передаёт спасение или избавление из бедственного положения; подлежащее подразумевается контекстом и передано местоимением «Он».
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: и в седьмой раз
  rationale: Субстантивированное порядковое числительное продолжает счёт случаев; добавление «раз» необходимо для естественного русского выражения.
- source_word: οὐχ ἅψεταί σου κακόν
  choice: зло не коснётся тебя
  rationale: Сохранены буквальный образ глагола ἅπτομαι и широкое значение κακόν — зло, беда или вред.
theological_decisions:
- issue: Подразумеваемое подлежащее глагола ἐξελεῖται
  choice: «Он» с прописной буквы
  alternative: Не называть подлежащее явно или написать «он» со строчной буквы
  rationale: В цитируемом изречении избавляющим является Бог; русская грамматика требует явного подлежащего, а прописная буква ясно передаёт референт без добавления имени.
translation_notes:
  register: Современный литературный русский; лаконичный, ритмичный и достойный стиль, соответствующий поэтическому характеру цитаты. Синтаксический параллелизм оригинала сохранён.
