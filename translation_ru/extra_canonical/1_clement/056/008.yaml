    issue: Прописное «Он» вводит и графически маркирует подразумеваемого божественного субъекта.
    rationale: Хотя более широкий контекст цитаты допускает Бога как референта, в представленном греческом тексте субъект не назван. Перевод должен сохранять эту невыраженность, а не объяснять её посредством прописной буквы.
