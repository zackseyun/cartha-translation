source:
  edition: Funk 1901 (normalized OCR)
  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: ru
  text: '«Ведь сказано: “Праведный человек[a] милостиво вразумит меня и обличит меня, но пусть масло грешников не умащает моей головы”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведник».'
    reason: Субстантивированное δίκαιος можно естественно передать существительным «праведник», сохраняя общий, а не обязательно определённый смысл.
lexical_decisions:
- source_word: παιδεύσει
  choice: наставит
  rationale: Глагол παιδεύω здесь означает исправляющее наставление или воспитательное взыскание; «наставит» естественно передаёт эту мысль по-русски, не сводя её к наказанию.
- source_word: δίκαιος
  choice: праведный человек
  rationale: Прилагательное употреблено без артикля и субстантивировано; неопределённо-родовое «праведный человек» не создаёт необоснованного указания на Бога или конкретную личность.
- source_word: ἐν ἐλέει
  choice: с милостью
  rationale: 'Передаёт обстоятельственный смысл греческого оборота: исправление совершается милостиво, а не жестоко.'
- source_word: ἐλέγξει
  choice: обличит
  rationale: Сохраняет смысл выявления проступка и исправительного порицания.
- source_word: μὴ λιπανάτω
  choice: пусть не умащает
  rationale: Греческий глагол буквально связан с деланием жирным или маслянистым; в сочетании с маслом и головой русское «умащать» точно и естественно передаёт образ.
theological_decisions:
- issue: Определённость и возможный референт δίκαιος
  choice: праведный человек
  alternative: праведник; Праведник
  rationale: Греческое слово не имеет артикля и в контексте наставления допускает обобщённое прочтение. Перевод не должен без текстового основания превращать его в титул Бога или Мессии.
- issue: Характер действия παιδεύσει
  choice: наставит
  alternative: накажет; вразумит
  rationale: Выбрано слово, охватывающее воспитательное исправление и не усиливающее карательный оттенок сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис цитаты сохранён ясным и ритмичным; архаическое «умащает» оставлено как точный и понятный в данном образе глагол.
