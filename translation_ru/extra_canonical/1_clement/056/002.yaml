source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: ru
  text: Примем же вразумление, к которому, возлюбленные, никто не должен относиться с негодованием. Увещание, с которым мы обращаемся друг к другу, хорошо и чрезвычайно полезно, ведь оно привязывает нас к воле Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάβωμεν παιδείαν
  choice: примем же вразумление
  rationale: Глагол ἀναλαμβάνω передаёт добровольное принятие, а παιδεία в данном контексте означает исправляющее наставление или воспитательное вразумление; «вразумление» естественно сочетается с последующим упоминанием недовольства.
- source_word: ἀγανακτεῖν
  choice: негодовать
  rationale: Слово обозначает сильное недовольство или возмущение; «негодовать» сохраняет силу греческого выражения без излишней разговорности.
- source_word: νουθέτησις
  choice: наставление
  rationale: Термин означает увещание, предостережение или наставление, обращённое к разуму; нейтральное «наставление» сохраняет широкий смысл.
- source_word: κολλᾷ
  choice: соединяет
  rationale: Буквально глагол означает «приклеивает, тесно связывает». «Соединяет» звучит естественно и сохраняет идею тесной привязанности, не усиливая образ сверх необходимого.
- source_word: τῷ θελήματι τοῦ θεοῦ
  choice: с волей Бога
  rationale: Прямо передаёт дательный падеж связи при κολλᾷ и сохраняет богословски значимое понятие Божьей воли.
theological_decisions:
- issue: Характер παιδεία как исправляющего воздействия
  choice: вразумление
  alternative: наказание; воспитание; наставление
  rationale: Контекст взаимного наставления указывает не обязательно на карательное наказание, а на принимаемое исправление. «Вразумление» сохраняет дисциплинарный оттенок без сужения смысла до кары.
- issue: Степень единения с Божьей волей в κολλᾷ
  choice: соединяет нас с волей Бога
  alternative: привязывает нас к воле Бога
  rationale: Греческий глагол выражает тесное соединение. Выбранная формулировка сохраняет эту мысль, не утверждая сверх текста ни безусловного послушания, ни мистического слияния.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранено обращение «возлюбленные» и взаимный характер наставления; синтаксис сделан ясным для обычного читателя без устранения смысловой связи между вразумлением и Божьей волей.
