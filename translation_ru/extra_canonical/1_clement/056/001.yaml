id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: ru
  text: Итак, будем и мы ходатайствовать о тех, кто пребывает в каком-либо прегрешении[a], чтобы им были даны кротость и смирение и чтобы они уступили не нам, а воле Божьей. Ведь тогда исполненное сострадания поминание о них пред Богом и святыми будет для них плодотворным и совершенным.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о находящихся в каком-либо прегрешении»; греческий текст не содержит оттенка «застигнутых» или «пойманных» на проступке.'
    reason: Сохраняется значение ὑπαρχόντων как пребывания в определённом состоянии без привнесения идеи обнаружения или пленения.
  - marker: b
    text: 'Греческое αὐτοῖς имеет форму дательного падежа: «для них» или «им». Возможен и более буквальный порядок слов: «ибо так будет для них плодотворным и совершенным исполненное сострадания поминание о них пред Богом и святыми».'
    reason: Сноска поясняет дательное значение αὐτοῖς и сохраняет связь «исполненное сострадания» с «поминанием», а не со сказуемым.
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: будем… ходатайствовать
  rationale: Глагол в данном контексте означает обращение с просьбой за других; «ходатайствовать» естественно передаёт молитвенно-заступнический оттенок.
- source_word: παραπτώματι
  choice: прегрешении
  rationale: Слово обозначает проступок или нарушение; «прегрешение» сохраняет нравственно-религиозный оттенок, не усиливая его до сознательного мятежа.
- source_word: ἐπιείκεια
  choice: кротость
  rationale: В сочетании с ταπεινοφροσύνη речь идёт о мягком, уступчивом расположении; «кротость» звучит естественно и достойно в увещательном контексте.
- source_word: ταπεινοφροσύνη
  choice: смирение
  rationale: Передаёт установку непритязательного, неупорствующего ума и образует естественную пару с «кротостью».
- source_word: εἶξαι
  choice: уступили
  rationale: Сохраняет образ прекращения сопротивления воле Бога, не заменяя его более сильным и богословски нагруженным «покорились».
- source_word: μνεία
  choice: поминание
  rationale: В контексте ходатайства слово указывает не просто на память, а на молитвенное упоминание перед Богом и святыми.
- source_word: ἔγκαρπος καὶ τελεία
  choice: плодотворным и совершенным
  rationale: Сохраняет метафору плода и значение полноты или завершённости.
theological_decisions:
- issue: Кому должны уступить согрешившие
  choice: «не нам, а воле Бога»
  alternative: «покориться не нам, а Божьей воле»
  rationale: Буквально сохранён контраст между человеческими требованиями и Божьей волей; «уступить» не усиливает значение εἶξαι.
- issue: Кого обозначают «святые»
  choice: оставлено «святыми» без уточнения
  alternative: «святыми людьми» или «ангелами»
  rationale: Греческий текст не уточняет референта οἱ ἅγιοι, поэтому перевод не разрешает эту богословскую неоднозначность.
- issue: Связь μετ’ οἰκτιρμῶν с μνεία
  choice: «исполненное сострадания поминание»
  alternative: «поминание… будет плодотворным и совершенным, со состраданием»
  rationale: Расположение слов и рамочная конструкция существительной группы поддерживают отнесение «со состраданием» к самому поминанию, а не к сказуемому.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным церковно-нравственным регистром. Синтаксис сделан ясным для обычного читателя; сохранены повтор цели («чтобы… и чтобы…») и противопоставление «не нам, а воле Бога». Формула «пред Богом» выбрана как уместная для молитвенного контекста, без избыточной архаизации.
