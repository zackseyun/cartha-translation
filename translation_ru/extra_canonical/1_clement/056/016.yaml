  text: βλέπετε, ἀγαπητοί, πόσος ὑπερασπισμός ἐστιν τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου· πατὴρ γὰρ ἀγαθὸς ὢν παιδεύει εἰς τὸ ἐλεηθῆναι ἡμᾶς διὰ τῆς ὁσίας παιδείας αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: ru
  text: Посмотрите, возлюбленные, сколь велика защита для тех, кого воспитывает Владыка. Ведь Он, как благой Отец, воспитывает нас, чтобы через Его святое воспитание мы были помилованы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε
  choice: Посмотрите
  rationale: Прямой призыв обратить внимание; естественная форма обращения к нескольким людям.
- source_word: ὑπερασπισμός
  choice: защита
  rationale: Передаёт значение заступничества или защиты, не сужая его до одной конкретной формы помощи.
- source_word: παιδευομένοις / παιδεύει / παιδείας
  choice: кого наставляет / наставляет / наставление
  rationale: Сохраняет повтор одного греческого корня и охватывает воспитание, исправление и дисциплинирование без излишне карательного оттенка.
- source_word: δεσπότου
  choice: Владыка
  rationale: Достоинственно передаёт титул верховного господина; прописная буква указывает на Бога в данном контексте.
- source_word: ἐλεηθῆναι
  choice: были помилованы
  rationale: Сохраняет пассивную форму и богословски значимое понятие милости.
- source_word: ὁσίας
  choice: святое
  rationale: Передаёт священный, благочестивый характер Божьего наставления.
theological_decisions:
- issue: Связь Божьего наставления с милостью
  choice: «чтобы через Его святое наставление мы были помилованы»
  alternative: «чтобы посредством Его благочестивого исправления нам была оказана милость»
  rationale: Сохранены целевая конструкция εἰς τό и посредствующая роль διὰ τῆς παιδείας без пояснения механизма этой связи.
- issue: Образ Бога как Отца и Владыки
  choice: 'Сохранены оба обозначения: «Владыка» и «благой Отец»'
  alternative: Унифицировать обращения как «Господь» и «Отец»
  rationale: Оба греческих наименования несут разные смысловые оттенки — власть и отеческую благость — и потому не должны сливаться.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «наставляет / наставление» намеренно отражает корневой повтор παιδεύω / παιδεία; формулировка остаётся понятной обычному читателю.
