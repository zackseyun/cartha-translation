source:
  edition: Funk 1901 (normalized OCR)
  text: εἶτα γνώσῃ, ὅτι εἰρηνεύσει σου ὁ οἶκος, ἡ δὲ δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: ru
  text: 'Тогда ты узнаешь, что твой дом будет в мире,

    и, осмотрев своё жилище, ничего не упустишь.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и с твоим жилищем ничего дурного не случится».'
    reason: 'Греческая фраза формально допускает разбор, при котором δίαιτα («жилище, обиталище») является подлежащим, а οὐ μὴ ἁμάρτῃ выражает, что оно не потерпит неудачи или ущерба. Основной вариант передаёт контекстуальное понимание, отражённое в Иов 5:24: осмотреть жилище и ничего не упустить.'
lexical_decisions:
- source_word: εἰρηνεύσει
  choice: будет пребывать в мире
  rationale: Передаёт будущее значение глагола «быть в мире, благоденствовать», сохраняя связь с существительным «мир».
- source_word: δίαιτα τῆς σκηνῆς σου
  choice: своё жилище
  rationale: В контексте цитаты выражение обозначает место обитания; по-русски буквальное «обиталище твоего шатра» избыточно и неестественно.
- source_word: οὐ μὴ ἁμάρτῃ
  choice: ничего не упустишь
  rationale: Усиленное отрицание передаёт уверенность, а ἁμαρτάνω здесь допускает смысл «промахнуться, не обнаружить, упустить» при осмотре жилища.
theological_decisions:
- issue: Неоднозначный синтаксис второй части стиха
  choice: «осмотрев своё жилище, ничего не упустишь»
  alternative: «и жилище твоего шатра непременно не потерпит ущерба»
  rationale: Основной текст следует контекстуальному пониманию ἁμαρτάνω как «упустить при осмотре», но альтернативное прочтение сохраняется в сноске, поскольку греческая формулировка допускает иной синтаксический разбор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным библейским звучанием. Обращение во втором лице единственного числа сохранено.
