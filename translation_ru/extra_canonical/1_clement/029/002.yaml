    issue: Видовая форма «рассеивал»
    rationale: 'διέσπειρεν имеет форму аориста и в данном повествовательном контексте означает завершённое действие: «рассеял».'
  - severity: medium
    issue: Передача σχοίνισμα κληρονομίας αὐτοῦ
    rationale: Фраза «отмеренным Ему наследием» делает Израиль просто наследием и не вполне ясно выражает, что он является уделом, отмеренным Господу как наследие. Формулировка «удел, отмеренный Ему в наследие» передаёт образ распределённого измерением удела без искусственного буквального «мерная вервь».
