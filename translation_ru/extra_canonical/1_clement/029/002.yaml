base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: ru
  text: 'Ведь так написано:


    «Когда Всевышний разделял народы,

    когда рассеял сынов Адама,

    Он установил границы народов

    по числу ангелов Божьих.

    И народ Его — Иаков — стал долей Господа,

    Израиль — уделом, отмеренным Ему в наследие».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Второзакония 32:8–9 по греческому тексту, где сказано «по числу ангелов Божьих»; в других текстовых традициях встречаются варианты «сынов Божьих» и «сынов Израиля».
    reason: Необходимо обозначить значимое текстовое различие, не подменяя чтение, реально цитируемое в 1 Клименте.
lexical_decisions:
- source_word: διεμέριζεν
  choice: разделял
  rationale: Передаёт незавершённый вид греческого имперфекта и соответствует контексту распределения народов.
- source_word: διέσπειρεν
  choice: рассеивал
  rationale: Сохраняет параллелизм с «разделял» и образ расселения потомков Адама.
- source_word: ἔστησεν ὅρια
  choice: установил границы
  rationale: Естественное современное выражение, точно передающее назначение пределов народам.
- source_word: ἀγγέλων θεοῦ
  choice: ангелов Божьих
  rationale: Переведено непосредственно по цитируемому Климентом греческому тексту, без замены вариантом «сынов Божьих» из иных текстовых традиций Втор 32:8.
- source_word: μερὶς κυρίου
  choice: долей Господа
  rationale: Сохраняет библейский образ удела или доли, принадлежащей Господу.
- source_word: σχοίνισμα κληρονομίας αὐτοῦ
  choice: отмеренным Ему наследием
  rationale: Передаёт буквальный образ мерной верёвки через понятный русский результат измерения, не превращая Израиль в сам инструмент измерения.
theological_decisions:
- issue: Текстовый вариант Второзакония 32:8
  choice: «по числу ангелов Божьих»
  alternative: «по числу сынов Израиля» или «сынов Божьих»
  rationale: 1 Климент прямо цитирует греческий вариант ἀγγέλων θεοῦ; перевод должен отражать текст источника Климента, а не гармонизировать его с другими традициями.
- issue: Соотношение Иакова и Израиля с Господним уделом
  choice: сохранён поэтический параллелизм без пояснительного толкования
  alternative: развернуть смысл как «Господь избрал Иакова Себе в удел»
  rationale: Греческий текст утверждает принадлежность народа Господу образным языком; пояснительная формулировка чрезмерно разрешила бы синтаксическую и образную напряжённость цитаты.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Сохранены стихотворные строки и синтаксический параллелизм; архаизмы сведены к минимуму. Прописные местоимения, относящиеся к Богу, использованы умеренно в соответствии с русской издательской традицией.
