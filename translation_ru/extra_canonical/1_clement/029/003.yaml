base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: ru
  text: 'И в другом месте Он говорит:


    «Вот, Господь берёт Себе народ из среды народов,

    как человек берёт начаток со своего гумна;

    и из того народа выйдет Святое святых».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Источник этой цитаты точно не установлен; её формулировка не совпадает дословно с известным текстом Ветхого Завета. Выражение «Святое святых» может обозначать высшую святыню, но здесь возможна и личностная отсылка.
    reason: Помечает неустановленный источник и сохраняет смысловую неоднозначность выражения ἅγια ἁγίων.
lexical_decisions:
- source_word: ἔθνος ἐκ μέσου ἐθνῶν
  choice: народ из среды народов
  rationale: Сохраняет повтор одного греческого существительного и естественно передаёт избрание одного народа из множества народов.
- source_word: ἀπαρχὴν
  choice: начаток
  rationale: Традиционный и ёмкий русский термин для первой, посвящаемой Богу доли урожая; здесь он сохраняет культово-аграрный оттенок.
- source_word: ἅλω
  choice: гумна
  rationale: Передаёт место обмолота зерна, а не сам процесс молотьбы; родительный оборот естественен в возвышенной цитатной речи.
- source_word: ἅγια ἁγίων
  choice: Святое святых
  rationale: Формально сохраняет устойчивое библейское выражение и не устраняет возможную культовую либо личностно-мессианскую отсылку.
- source_word: ἐξελεύσεται
  choice: выйдет
  rationale: Прямо передаёт будущее среднее значение глагола и сохраняет лаконичность пророческой формулы.
theological_decisions:
- issue: Значение выражения ἅγια ἁγίων
  choice: Святое святых
  alternative: святыня святынь / самое святое
  rationale: Устойчивое выражение оставлено без уточняющего толкования, поскольку греческий текст допускает культовое обозначение высшей святыни и возможное применение к личности; перевод не должен разрешать эту напряжённость.
- issue: Референт подлежащего λέγει
  choice: Он говорит
  alternative: говорится
  rationale: Сохранён личный субъект греческого λέγει; прописная буква указывает на Бога как говорящего в контексте, не добавляя имени в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской цитатной речи. Синтаксический параллелизм оригинала сохранён; архаизмы сведены к укоренённым библейским словам «начаток», «гумно» и «Святое святых».
