source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: ru
  text: Итак, приблизимся к Нему в святости души, воздевая к Нему чистые и незапятнанные руки и любя нашего снисходительного и сострадательного Отца, Который сделал нас Своей избранной долей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέλθωμεν
  choice: приблизимся
  rationale: Передаёт увещевательный аорист конъюнктива и движение к Богу без добавления отсутствующего в тексте культового оттенка.
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: со святостью в душе
  rationale: Естественно по-русски передаёт внутреннее благочестие и святость; слово ψυχή сохраняется как «душа».
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: чистые и незапятнанные руки
  rationale: 'Сохраняет два прямых определения и различие оттенков: нравственную чистоту и отсутствие осквернения.'
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: кроткого и сострадательного
  rationale: «Кроткий» здесь естественно выражает мягкость и снисходительность ἐπιεικής, а «сострадательный» — сильную милость εὔσπλαγχνος.
- source_word: ἐκλογῆς μέρος
  choice: избранной долей
  rationale: Сохраняет необычную и богословски значимую конструкцию «доля избрания», передавая её ясным русским сочетанием без сведения к более общему «избранному народу».
theological_decisions:
- issue: Смысл выражения ἐκλογῆς μέρος
  choice: сделал нас Своей избранной долей
  alternative: дал нам долю в избрании
  rationale: Греческая конструкция допускает некоторую смысловую напряжённость, однако контекст и ἑαυτῷ поддерживают представление о людях как доле, избранной Богом для Себя. Формулировка не уточняет механизм или доктрину избрания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещевания. Синтаксис плавный, без архаизмов, кроме уместного библейского «воздевая»; местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской издательской традиции.
