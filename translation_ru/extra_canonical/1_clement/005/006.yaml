  verdict: revise
  source_fidelity: Причастные формы и порядок испытаний в целом переданы точно; сохранены числительное «семь раз» и географическая пара «восток — запад». Однако «побывав в изгнании» ослабляет страдательное φυγαδευθείς («будучи изгнанным / отправленным в изгнание»), а «за свою веру» однозначно истолковывает генитив τῆς πίστεως αὐτοῦ как причинный.
  naturalness: Фраза в целом литературна и хорошо сохраняет цепочку причастий. «Быть изгнанным» точнее и естественнее здесь, чем «побывать в изгнании».
  terminology: «Оковы» и «побитый камнями» уместны. «Глашатай» точнее передаёт κῆρυξ как публичного провозвестника, чем несколько общее «вестник». Заключительное «славу своей веры» сохраняет компактную генитивную связь оригинала, не уточняя её односторонне.
  issues:
  - severity: medium
    issue: Ослаблено страдательное значение φυγαδευθείς.
    rationale: «Побывав в изгнании» может описывать просто пребывание в изгнании, тогда как греческий аористный страдательный причастный оборот обозначает, что он был изгнан или принудительно удалён.
  - severity: medium
    issue: 'Генитив τῆς πίστεως αὐτοῦ передан как однозначно причинный: «за свою веру».'
    rationale: Оригинальная формула «κλέος веры» допускает более широкую связь славы с верой. Ввиду этой семантической неопределённости причинное «за» лучше не навязывать.
  - severity: low
    issue: «Вестник» несколько слабее передаёт публично-провозгласительный оттенок κῆρυξ.
    rationale: «Глашатай» сохраняет этот оттенок и остаётся понятным в современном литературном русском.
