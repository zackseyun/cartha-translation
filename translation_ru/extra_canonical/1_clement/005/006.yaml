  text: ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: ru
  text: семь раз носив оковы, будучи изгнанным, побитым камнями и став глашатаем как на востоке, так и на западе, он стяжал благородную славу своей веры,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: семь раз носив оковы
  rationale: Сохраняет точное числительное и образ буквального ношения уз; «оковы» естественно и достойно звучит в данном контексте.
- source_word: φυγαδευθείς
  choice: побывав в изгнании
  rationale: Передаёт принудительное удаление или изгнание, не уточняя без достаточных оснований, кем и куда он был изгнан.
- source_word: λιθασθείς
  choice: претерпев побиение камнями
  rationale: Передаёт страдательный смысл и сам способ насилия; формулировка не предполагает, что побиение непременно завершилось смертью.
- source_word: κῆρυξ γενόμενος
  choice: став вестником
  rationale: «Вестник» передаёт роль публичного провозвестника и остаётся понятным современному читателю; буквальная связь с κῆρυξ сохранена.
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: как на востоке, так и на западе
  rationale: Сохраняет симметричную географическую формулу оригинала без добавочного толкования.
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν
  choice: он стяжал благородную славу за свою веру
  rationale: «Стяжал» естественно сочетается со «славой» в возвышенном повествовании; «за свою веру» передаёт смысл родительного τῆς πίστεως αὐτοῦ, не перегружая фразу неестественной буквальностью.
theological_decisions:
- issue: Смысл родительного τῆς πίστεως αὐτοῦ при κλέος
  choice: славу за свою веру
  alternative: славу своей веры
  rationale: Греческий родительный допускает связь славы с верой без однозначного уточнения типа отношения. Основной вариант по-русски яснее выражает, что вера стала основанием славы, но не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, раннехристианской повествовательной тональностью. Причастная цепочка оригинала сохранена, но сделана естественной для русского синтаксиса. Запятая в конце оставлена, поскольку данный стих синтаксически продолжается в следующем контексте.
