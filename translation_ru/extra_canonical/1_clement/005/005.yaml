  text: Because of jealousy and strife[a], Paul showed the prize of endurance,
translation:
  language: ru
  text: Из-за зависти и раздоров Павел показал награду за стойкость[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «указал на награду за стойкость».'
    reason: Глагол ἔδειξεν может означать как «показал, продемонстрировал», так и «указал на».
lexical_decisions:
- source_word: ζῆλον
  choice: зависти
  rationale: В данном контексте слово обозначает враждебную ревность, направленную против Павла; «зависть» ясно и естественно передаёт этот смысл.
- source_word: ἔριν
  choice: раздоров
  rationale: Передаёт распри и вражду, сохраняя связь с гонениями, о которых говорится в контексте.
- source_word: ὑπομονῆς
  choice: за стойкость
  rationale: Ὑπομονή — терпеливая стойкость и выдержка в испытаниях; «стойкость» здесь естественнее и точнее, чем одно лишь «терпение».
- source_word: βραβεῖον
  choice: награду
  rationale: Слово обозначает приз или награду победителю; «награда» звучит естественно и сохраняет образ воздаяния.
- source_word: ἔδειξεν
  choice: явил
  rationale: Глагол означает «показал, продемонстрировал». «Явил» передаёт мысль о том, что Павел на собственном примере сделал эту награду зримой, не добавляя идеи подробного объяснения.
theological_decisions:
- issue: Связь между стойкостью Павла и наградой
  choice: явил награду за стойкость
  alternative: указал на награду за стойкость
  rationale: Греческое ἔδειξεν допускает как демонстрацию собственным примером, так и указание на нечто. Основной текст сохраняет более живой смысл демонстрации, а примечание отмечает возможное прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Конечная запятая сохранена, поскольку фраза синтаксически продолжается в следующем стихе.
