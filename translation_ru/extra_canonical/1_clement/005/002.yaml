source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλον καὶ φθόνον οἱ μέγιστοι καὶ δικαιότατοι στῦλοι ἐδιώχθησαν καὶ ἕως θανάτου ἤθλησαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/002.yaml
  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: ru
  text: Из-за ревности и зависти величайшие и праведнейшие столпы подверглись гонениям и боролись до самой смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: ревности и зависти
  rationale: 'Сохраняются два близких, но не тождественных понятия греческого текста: ζῆλος здесь имеет отрицательный смысл сопернической ревности, а φθόνος прямо обозначает зависть.'
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  choice: величайшие и праведнейшие столпы
  rationale: Переданы превосходные степени μέγιστοι и δικαιότατοι и сохранён образ «столпов», обозначающий выдающихся и стойких людей общины.
- source_word: ἐδιώχθησαν
  choice: подверглись гонениям
  rationale: Естественная для современного литературного русского передача пассивной формы со значением преследования за веру или убеждения.
- source_word: ἤθλησαν
  choice: боролись
  rationale: Глагол сохраняет смысл напряжённой борьбы и отдалённый атлетический оттенок, не вводя в русский текст неестественный образ спортивного состязания.
- source_word: ἕως θανάτου
  choice: до самой смерти
  rationale: 'Передаёт предельный характер выражения: борьба продолжалась вплоть до смерти.'
theological_decisions:
- issue: Значение ἕως θανάτου
  choice: до самой смерти
  alternative: до смерти
  rationale: Формулировка не уточняет, погибли ли все названные лица непосредственно от гонений, но сохраняет напряжённость греческого «вплоть до смерти».
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания; сохранены параллелизм, превосходные степени и метафора столпов.
