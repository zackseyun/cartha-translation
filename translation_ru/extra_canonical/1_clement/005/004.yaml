source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: ru
  text: Пётр из-за неправедной зависти перенёс не одно и не два, а многие страдания и так, принеся свидетельство[a], отошёл в положенное ему место славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приняв мученическую смерть». Греческое причастие означает «засвидетельствовав» или «принеся свидетельство», но в этом контексте может подразумевать свидетельство ценой жизни.'
    reason: Сохраняет основное, более широкое значение μαρτυρήσας и отмечает возможный мученический смысл, не навязывая его в основном тексте.
lexical_decisions:
- source_word: διὰ ζῆλον ἄδικον
  choice: из-за неправедной зависти
  rationale: Передаёт причинное значение διά и отрицательную нравственную оценку ἄδικον, не смягчая ζῆλος до нейтрального «рвения».
- source_word: πλείονας ὑπήνεγκεν πόνους
  choice: перенёс … множество страданий
  rationale: Естественно по-русски выражает стойкое перенесение многочисленных тяжёлых испытаний; πόνους в данном контексте обозначает тяготы и страдания, а не просто работу.
- source_word: μαρτυρήσας
  choice: засвидетельствовав
  rationale: Сохраняет основное значение свидетельства и не устраняет контекстуально возможный намёк на мученическую смерть.
- source_word: ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: отошёл в положенное ему место славы
  rationale: «Отошёл» уместно и достойно передаёт эвфемистическое описание смерти; «положенное ему» отражает ὀφειλόμενον, а «место славы» сохраняет греческую конструкцию τῆς δόξης.
theological_decisions:
- issue: Означает ли μαρτυρήσας прямо мученическую смерть Петра
  choice: В основном тексте оставлено «засвидетельствовав» с пояснительной сноской
  alternative: «Приняв мученическую смерть»
  rationale: Глагол связан со свидетельством и в раннехристианском контексте может подразумевать мученичество, однако более узкий перевод сделал бы подразумеваемое значение однозначным.
- issue: Характер «места славы»
  choice: «положенное ему место славы»
  alternative: «уготованное ему славное место»
  rationale: Выбранный вариант ближе к ὀφειλόμενον и сохраняет генитив «славы», не уточняя, кем или каким образом это место было назначено.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианского текста звучанием. Синтаксис упрощён для ясности, но риторическое противопоставление «не одно и не два, а множество» и образ «места славы» сохранены.
