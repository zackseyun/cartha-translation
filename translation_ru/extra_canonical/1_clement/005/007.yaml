source:
  edition: Funk 1901 (normalized OCR)
  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: ru
  text: Научив весь мир праведности, достигнув крайнего предела запада и засвидетельствовав перед правителями, так он оставил мир и отправился в святое место, став величайшим примером стойкости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  choice: праведности
  rationale: Сохраняет нравственно-богословский смысл греческого существительного и естественно сочетается с глаголом «научив».
- source_word: τὸ τέρμα τῆς δύσεως
  choice: крайнего предела запада
  rationale: Близко передаёт пространственный образ оригинала, не уточняя географическое место, которого греческий текст не называет.
- source_word: μαρτυρήσας
  choice: засвидетельствовав
  rationale: Сохраняет возможную смысловую широту глагола — свидетельство исповеданием и жизнью — без обязательного сведения его к техническому значению мученичества.
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: ушёл из мира
  rationale: Передаёт идиоматическое обозначение смерти или ухода из земной жизни, избегая неуместного оттенка «был освобождён».
- source_word: ὑπομονῆς
  choice: стойкости
  rationale: В контексте испытаний обозначает твёрдое терпеливое постоянство; «стойкость» звучит естественно и ёмко по-русски.
- source_word: ὑπογραμμός
  choice: примером
  rationale: Передаёт образ образца для подражания современным и понятным словом без излишне технического оттенка.
theological_decisions:
- issue: Значение μαρτυρήσας
  choice: засвидетельствовав
  alternative: приняв мученичество
  rationale: Глагол допускает связь с мученической смертью, но здесь конструкция «перед правителями» прежде всего выражает свидетельство; перевод не должен устранять эту смысловую напряжённость в пользу более узкого толкования.
- issue: Значение ὁ ἅγιος τόπος
  choice: святое место
  alternative: небеса / место святых
  rationale: Буквальное выражение сохраняет эсхатологическую недосказанность автора и не уточняет природу или местонахождение этого места сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Цепочка деепричастий сохраняет последовательность трёх греческих аористных причастий, ведущих к основным глаголам; формулировки остаются ясными для обычного читателя и не вносят конфессиональных уточнений.
