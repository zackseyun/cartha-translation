  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: ru
  text: Но, оставив древние примеры, обратимся к борцам, жившим ближе всего к нашему времени. Возьмём благородные примеры из нашего поколения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παυσώμεθα
  choice: оставив
  rationale: Передаёт прекращение обращения к древним примерам и естественно вводит переход к недавним; не создаёт двусмысленного русского оборота «остановимся на».
- source_word: ἀθλητάς
  choice: борцам
  rationale: Сохраняет образ участников состязания и не сужает смысл до мучеников или аскетов.
- source_word: τοὺς ἔγγιστα γενομένους
  choice: жившим совсем недавно
  rationale: Контекстуально передаёт временную близость этих людей к автору и читателям.
- source_word: τὰ γενναῖα ὑποδείγματα
  choice: благородные примеры
  rationale: Сохраняет положительную оценку γενναῖα без чрезмерного усиления значения; повтор слова «примеры» отражает повтор ὑποδείγματα в греческом.
- source_word: τῆς γενεᾶς ἡμῶν
  choice: из нашего поколения
  rationale: Прямо и естественно передаёт принадлежность примеров поколению автора и адресатов.
