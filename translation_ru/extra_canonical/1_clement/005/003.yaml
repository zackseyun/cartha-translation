lexical_decisions:
- source_word: λάβωμεν πρὸ ὀφθαλμῶν ἡμῶν
  choice: Поставим же перед глазами
  rationale: Греческий призыв буквально означает «возьмём/поставим перед нашими глазами», то есть обратимся к ним как к наглядному примеру. Русская формулировка сохраняет образ и звучит естественно; «же» передаёт связующий, побудительный характер аористного конъюнктива в контексте.
- source_word: τοὺς ἀγαθοὺς ἀποστόλους
  choice: добрых апостолов
  rationale: ἀγαθός здесь характеризует апостолов как добрых, благих и достойных; «добрых» прямо передаёт оценочное значение, не добавляя отсутствующего в тексте уточнения вроде «славных» или «святых».
