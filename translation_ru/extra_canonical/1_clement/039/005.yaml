  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: ru
  text: Даже небеса не чисты перед Ним — тем более те, кто живёт в глиняных домах[a], ведь и мы сами из той же глины. Он поразил их, словно моль, и от утра до вечера их уже нет; не способные помочь самим себе, они погибли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из которых и мы сами из той же глины». Греческая относительная конструкция синтаксически шероховата.'
    reason: Сноска отмечает необычную форму греческой конструкции, не вводя дополнительного толкования.
lexical_decisions:
- source_word: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ
  choice: Даже небеса нечисты пред Ним
  rationale: Передаёт усилительный смысл частицы и библейский образ нечистоты перед Богом; грамматическая несогласованность OCR-текста не воспроизводится.
- source_word: οἱ κατοικοῦντες οἰκίας πηλίνας
  choice: живущие в глиняных домах
  rationale: Прямой и естественный перевод образа хрупкого человеческого тела.
- source_word: ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν
  choice: ведь и сами мы созданы из той же глины
  rationale: Сглаживает избыточную конструкцию греческого текста, сохраняя её очевидный смысл и переход к первому лицу множественного числа.
- source_word: ἔπαισεν αὐτοὺς σητὸς τρόπον
  choice: Он раздавил их, словно моль
  rationale: Сохраняет Бога как подразумеваемого субъекта глагола и сравнение с молью; «раздавил» естественно выражает внезапное уничтожение хрупкого существа.
- source_word: παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι
  choice: не имея сил помочь самим себе
  rationale: Естественно передаёт причинный оттенок конструкции и человеческую беспомощность.
theological_decisions:
- issue: Референт местоимения при ἔπαισεν
  choice: «Он», то есть Бог
  alternative: Безличное «их раздавило»
  rationale: Предшествующее «пред Ним» делает Бога наиболее естественным подразумеваемым субъектом; при этом перевод не добавляет богословских уточнений.
- issue: Сравнение σητὸς τρόπον
  choice: «словно моль» — люди уподоблены легко раздавливаемой моли
  alternative: «как моль разъедает» — моль как деятель разрушения
  rationale: Грамматическая форма и английский консультационный слой поддерживают сравнение поражённых с молью, однако образ допускает иную синтаксическую трактовку, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Пред Ним» сохраняет возвышенный регистр, а остальная фраза избегает архаизмов. Пунктуация удерживает единый нарастающий ход греческого предложения.
