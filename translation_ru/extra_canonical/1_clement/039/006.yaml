  language: ru
  text: Он дохнул на них, и они умерли, потому что не имели мудрости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφύσησεν
  choice: дохнул
  rationale: Аорист глагола ἐμφυσάω передаёт однократное действие — «дунул/дохнул». «Дохнул» сохраняет прямой образ и уместно для возвышенного повествования.
- source_word: ἐτελεύτησαν
  choice: умерли
  rationale: В данном контексте глагол τελευτάω естественно означает «умереть».
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  choice: потому что не имели мудрости
  rationale: Оборот с παρά и субстантивированным инфинитивом здесь выражает причину. Формулировка близка греческой конструкции и сохраняет смысл отсутствия мудрости.
theological_decisions:
- issue: Причинная связь между отсутствием мудрости и смертью
  choice: потому что не имели мудрости
  alternative: из-за недостатка мудрости
  rationale: Выбрана прозрачная причинная формулировка без дополнительного истолкования природы мудрости или механизма смерти.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем; образ дыхания сохранён буквально.
