review_pass:
  verdict: revise
  source_fidelity: 'Первая часть точно передаёт оптативы и повтор ἐξαιρέω. Однако ἐπὶ θύραις ἡσσόνων не требует прямо вводить деятеля в форме «людьми ничтожными»: греческая конструкция остаётся неясной и, вероятнее всего, связана с «воротами» и людьми низшего положения. Последнее предложение в данном предоставленном греческом тексте имеет смысл «что Ты приготовил для них»; расходящийся текст Иов 5:5 следует оставить в сноске, а не молча подменять перевод.'
  naturalness: «Людьми ничтожными» звучит оценочно и несколько искусственно в современном литературном русском. Формула «у ворот теми, кто стоит ниже их» сохраняет возможный смысл, не приписывая социальную или нравственную характеристику как установленную. «Никто не избавит их» естественнее, чем «никто их не избавит».
  terminology: '«Спасение» допустимо для σωτηρία, хотя в данном контексте также возможно «безопасность». «Беды» удачно передаёт τὰ κακά без неоправданной догматизации. Местоимение «Ты» не следует писать с прописной буквы: сама по себе грамматическая форма не называет адресата, а прописная буква добавляет интерпретацию.'
  issues:
  - severity: medium
    issue: Неясная конструкция ἐπὶ θύραις ἡσσόνων передана как однозначное действие «людьми ничтожными».
    rationale: Такой перевод добавляет деятеля и уничижительную оценку. Сноска признаёт неясность, но основной текст должен сохранять её в большей мере.
  - severity: low
    issue: Прописное «Ты» в последнем предложении.
    rationale: В предоставленном фрагменте адресат второго лица не назван; строчная буква нейтральнее и сохраняет текстовую неопределённость.
  - severity: low
    issue: Порядок слов в «никто их не избавит».
    rationale: «Никто не избавит их» более естественно в нейтральном современном русском и яснее сохраняет параллель с заключительным «не избавятся».
  revised_text: Да будут их сыновья далеки от спасения; да будут они сокрушены у ворот теми, кто стоит ниже их,[a] и никто не избавит их. Ибо то, что ты приготовил для них,[b] съедят праведники, а сами они не избавятся от бед.
  revised_footnotes:
  - marker: a
    text: 'Или: «у ворот людей низшего положения»; греческое выражение не вполне ясно.'
    reason: Ἐπὶ θύραις ἡσσόνων допускает разные синтаксические и смысловые истолкования; сноска отмечает эту неясность, не делая одно из них несомненным.
  - marker: b
    text: 'В греческом тексте: «что ты приготовил для них». В Иов 5:5, который здесь, вероятно, цитируется, читается: «что они собрали (приготовили)».'
    reason: Предоставленный текст 1 Климента имеет второе лицо единственного числа и дательный «для них», но отличается от вероятного текста источника цитаты.
  revision_rationale: Исправлена передача спорного выражения о «воротах» и «низших», чтобы не превращать неясную греческую конструкцию в однозначное уничижительное утверждение. Прописная буква во втором лице снята как не обусловленная самим фрагментом. Сохранён перевод предоставленного греческого текста в последней фразе, а вероятное расхождение с Иов 5:5 отмечено сноской.
