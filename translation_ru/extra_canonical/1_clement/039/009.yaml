source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: ru
  text: Да будут их сыновья далеки от спасения; да будут они сокрушены у ворот людьми ничтожными,[a] и никто их не избавит. Ибо то, что Ты приготовил для них,[b] съедят праведники, а сами они не избавятся от бед.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теми, кто ниже их»; греческое выражение не вполне ясно.'
    reason: Лексическая и, возможно, текстологическая неясность ἡσόνων.
  - marker: b
    text: 'В греческом тексте: «что Ты приготовил для них». В тексте Иов 5:5, который здесь цитируется, — «что они собрали (приготовили)».'
    reason: Представленный текст расходится с вероятным источником цитаты и допускает подозрение на ошибку передачи текста.
lexical_decisions:
- source_word: πρόγένοιντο ... ἀπὸ σωτηρίας
  choice: да будут ... далеки от спасения
  rationale: Передаёт пожелательно-заклинательную форму оптатива и пространственный образ удаления от спасения.
- source_word: κολαβρισθείησαν
  choice: да будут они сокрушены
  rationale: Сохраняет пассивную форму и значение насильственного подавления; исходная форма, вероятно, текстуально испорчена или редка.
- source_word: ἐπὶ θύραις
  choice: у ворот
  rationale: В контексте цитаты из Иов 5:4 речь идёт о публичном месте суда; «ворота» естественнее русского «двери».
- source_word: ἡσόνων
  choice: людьми ничтожными
  rationale: Буквально связано с «меньшими, низшими»; личное творительное передаёт вероятного деятеля при пассиве, не уточняя социальный статус.
- source_word: ἐξαιρούμενος / ἐξαίρετοι
  choice: избавит / избавятся
  rationale: Повтор одного русского корня сохраняет лексическую связь двух форм ἐξαιρέω.
- source_word: κακῶν
  choice: бед
  rationale: Множественное τὰ κακά допускает «зло, бедствия, несчастья»; здесь контекст наказания благоприятствует «бедам».
theological_decisions:
- issue: Кто приготовил то, что съедят праведники
  choice: «то, что Ты приготовил для них» по представленному тексту ἃ ... ἐκείνοις ἡτοίμασας
  alternative: '«то, что они приготовили» по тексту Иов 5:5 LXX: ἃ γὰρ ἐκεῖνοι συνήγαγον'
  rationale: Предоставленный греческий источник однозначно имеет второе лицо единственного числа и дательный «для них». Однако вероятна порча текста/OCR в цитате из Иова, поэтому вариант источника отмечен сноской, а цитатный вариант — как текстологическая альтернатива.
- issue: Значение σωτηρία
  choice: «спасение»
  alternative: «безопасность»
  rationale: Слово может обозначать как избавление/безопасность, так и спасение; сохранён более широкий и традиционный эквивалент без догматического уточнения.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Оптативы переданы повтором «да будут»; сохранены суровость и параллелизм высказывания. Местоимение «Ты» написано с прописной буквы, поскольку по данной форме оно, вероятнее всего, обращено к Богу, но текстологическая проблема явно отмечена.
