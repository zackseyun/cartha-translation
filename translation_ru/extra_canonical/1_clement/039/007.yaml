  text: ἐπικάλεσαι δέ, εἴ τις σοι ὑπακούσεται, ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ· καὶ γὰρ ἄφρονα ἀναιρεῖ ὀργή, πεπλανημένον δὲ θανατοῖ ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: ru
  text: Но позови — ответит ли тебе кто-нибудь? И кого из святых ангелов ты увидишь?[a] Ведь гнев губит неразумного, а зависть умерщвляет заблудшего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «или увидишь ли ты кого-нибудь из святых ангелов?»'
    reason: Греческое ἢ εἴ τινα … ὄψῃ формально допускает условное прочтение («или если увидишь»), однако в цитируемом контексте Иов 5:1 естественно продолжение риторического вопроса.
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: позови
  rationale: Императив передаёт призыв обратиться или воззвать к кому-либо; «позови» естественно сочетается с последующим вопросом об ответе.
- source_word: ὑπακούσεται
  choice: ответит тебе
  rationale: В данном контексте обозначает отклик на зов, а не просто послушание.
- source_word: ἁγίων ἀγγέλων
  choice: святых ангелов
  rationale: Прямое и естественное соответствие греческому словосочетанию.
- source_word: ἄφρονα
  choice: безумного
  rationale: Передаёт человека, лишённого здравого рассудка; сохраняет нравственно-сапиенциальную окраску.
- source_word: ζῆλος
  choice: ревность
  rationale: Сохраняет широкий диапазон слова — ревностное, завистливое или яростное чувство — без преждевременного сужения до «зависти».
- source_word: πεπλανημένον
  choice: заблудшего
  rationale: Причастие указывает на того, кто сбился с пути или пребывает в заблуждении.
- source_word: θανατοῖ
  choice: умерщвляет
  rationale: Передаёт каузативный смысл «предаёт смерти, убивает» и сохраняет параллелизм с предыдущей строкой.
theological_decisions:
- issue: Характер обращения к ангелам
  choice: Сохранить риторический вопрос без пояснения, что это предписание обращаться к ангелам.
  alternative: Передать фразу как прямой призыв искать ответа у святых ангелов.
  rationale: 'Контекст восходит к Иов 5:1 и носит характер вызова: говорящему предлагается проверить, найдётся ли отвечающий и к кому из святых он сможет обратиться. Перевод не должен превращать риторическую формулу в конфессиональное учение.'
- issue: Значение ζῆλος
  choice: ревность
  alternative: зависть
  rationale: Греческое слово допускает оба оттенка; «ревность» сохраняет исходную неоднозначность и напряжение параллели с гневом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Вопросительная форма делает синтаксис естественным и отражает риторический характер греческого текста; лексика сохраняет параллелизм двух заключительных утверждений.
