    issue: «Тупые» для μωροί
    rationale: Слово передаёт резкость, но в русском имеет преимущественно разговорно-бранную окраску; «глупые» сохраняет осуждающий смысл в литературном регистре.
  - severity: medium
    issue: «Неучёные» для ἀπαίδευτοι
    rationale: Это русское слово обычно относится к отсутствию специальной учёности; греческое шире и включает необразованность либо отсутствие воспитания.
