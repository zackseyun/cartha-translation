  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: ru
  text: Безрассудные, неразумные, глупые и необразованные насмехаются над нами и глумятся, желая возвысить себя в своих помыслах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: глупые
  rationale: Передаёт отсутствие здравого рассудка и сохраняет первый элемент нарастающего ряда порицаний.
- source_word: ἀσύνετοι
  choice: неразумные
  rationale: Отражает недостаток понимания и различает это слово с более общим ἄφρονες.
- source_word: μωροί
  choice: тупые
  rationale: Сохраняет резкость греческого слова и не сливает его по значению с «глупые».
- source_word: ἀπαίδευτοι
  choice: неучёные
  rationale: Указывает на отсутствие обучения или воспитания; в данном перечислении естественно читается как отсутствие образованности.
- source_word: χλευάζουσιν
  choice: насмехаются над нами
  rationale: Естественно передаёт открытое высмеивание.
- source_word: μυκτηρίζουσιν
  choice: глумятся
  rationale: Передаёт презрительную насмешку и сохраняет усиление по отношению к χλευάζουσιν.
- source_word: ἐπαίρεσθαι
  choice: возвысить себя
  rationale: Сохраняет образ самовозвышения, а не только эмоциональной гордости.
- source_word: ταῖς διανοίαις αὐτῶν
  choice: в собственных помыслах
  rationale: Передаёт внутреннюю область мыслей и намерений; «помыслы» соответствует dignified literary register without archaic syntax.
