  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: ru
  text: 'Написано: «Не было никакого образа перед моими глазами, но я слышал лишь дуновение[a] и голос».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лёгкий ветер».'
    reason: Греческое αὔρα обозначает дуновение или лёгкий ветер; контекст не требует более узкого толкования.
lexical_decisions:
- source_word: μορφή
  choice: образ
  rationale: Передаёт видимую форму или очертание, не уточняя, о каком именно облике идёт речь.
- source_word: πρὸ ὀφθαλμῶν μου
  choice: перед моими глазами
  rationale: Естественный современный русский эквивалент пространственного выражения с сохранением первого лица.
- source_word: ἀλλʼ ἢ
  choice: лишь
  rationale: После отрицания сочетание имеет ограничительное значение «кроме / но только»; «лишь» естественно связывает обе части фразы.
- source_word: αὔραν
  choice: дуновение
  rationale: Сохраняет значение лёгкого движения воздуха и допускает образное восприятие, не сводя слово однозначно к дыханию.
- source_word: ἤκουον
  choice: я слышал
  rationale: Русское прошедшее несовершенного вида естественно передаёт греческий имперфект без громоздкой конструкции.
