base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: ru
  text: Что же? Разве смертный будет чист перед Господом? Или будет человек безупречен благодаря своим делам, если Он не доверяет Своим детям и замыслил нечто кривое против Своих ангелов?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если Он не доверяет Своим детям и замыслил нечто кривое против Своих ангелов». В контексте отголоска Иов 4:17–18 παῖδες может означать Божьих слуг, а заключительную фразу также понимают как: «усмотрел нечто неправильное в Своих ангелах».'
    reason: Сноска отмечает контекстуально вероятное толкование, не заменяя буквальные значения παίδες, ἐπενόησεν и κατά в основном тексте.
lexical_decisions:
- source_word: βροτός
  choice: смертный
  rationale: Передаёт акцент на человеческой смертности и ограниченности, сохраняя существительное греческого текста.
- source_word: ἐναντί κυρίου
  choice: перед Господом
  rationale: Естественный русский эквивалент со значением нахождения пред лицом и судом Господа.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: благодаря своим делам
  rationale: Сохраняет значение основания или исходной точки, не превращая выражение в более узкое конфессиональное утверждение.
- source_word: παίδων αὐτοῦ
  choice: Своим слугам
  rationale: В данном цитатном контексте παῖδες обозначает служителей Бога; вариант «детям» возможен лексически, но нарушает параллель с ангелами и смысл аргумента.
- source_word: οὐ πιστεύει
  choice: не доверяет
  rationale: Передаёт здесь значение признания кого-либо вполне надёжным, а не религиозной веры.
- source_word: σκολιόν τι ἐπενόησεν
  choice: усмотрел нечто порочное
  rationale: σκολιός метафорически означает кривое, неправильное или порочное; ἐπενόησεν в контексте допускает смысл обнаружения или усмотрения недостатка, хотя буквально может означать «замыслил».
theological_decisions:
- issue: Субъект глаголов πιστεύει и ἐπενόησεν
  choice: Господь; это обозначено прописными местоимениями «Он», «Своим»
  alternative: Предшествующий «человек» как субъект обоих глаголов
  rationale: 'Цитата воспроизводит ход мысли Иов 4:17–18: если Бог не вполне доверяет Своим небесным служителям и усматривает недостаток в ангелах, тем более человек не может быть безупречен перед Ним.'
- issue: Характер недостатка ангелов
  choice: «нечто порочное» без уточнения природы вины
  alternative: «заблуждение», «безумие» или «кривизна»
  rationale: Так сохраняется образная и смысловая широта σκολιόν τι без догматического уточнения того, в чём именно состоит недостаток ангелов.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной риторикой. Вопросительная форма оригинала сохранена; местоимения с прописной буквы помогают ясно обозначить смену подразумеваемого субъекта на Господа. Маркер сноски помещён в основном тексте.
