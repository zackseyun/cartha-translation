source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: ru
  text: Наконец, пусть всевидящий Бог, Владыка духов и Господь всякой плоти, избравший Господа Иисуса Христа и через Него — нас, чтобы мы стали Его особым народом, дарует каждой душе, призывающей Его величественное и святое имя, веру, страх, мир, стойкость и долготерпение, самообладание, чистоту и благоразумие для благоугождения Его имени через нашего Первосвященника и Заступника Иисуса Христа. Через Него Богу слава и величие, могущество и честь — и ныне, и во все веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λοιπόν
  choice: Наконец
  rationale: Передаёт заключительный переход к молитвенному благословению; естественно звучит в русском контексте завершения послания.
- source_word: παντεπόπτης
  choice: всевидящий
  rationale: 'Сохраняет составное значение слова: Бог видит всё.'
- source_word: δεσπότης τῶν πνευμάτων
  choice: Владыка духов
  rationale: Формально и ясно передаёт δεσπότης и сохраняет библейское выражение без уточнения, какие именно духи имеются в виду.
- source_word: κύριος πάσης σαρκός
  choice: Господь всякой плоти
  rationale: Сохраняет устойчивый библейский образ и универсальный охват πάσης.
- source_word: λαὸν περιούσιον
  choice: народом, принадлежащим Ему
  rationale: Передаёт смысл особой Божьей собственности естественным современным русским языком, не сводя выражение лишь к качеству избранности.
- source_word: ἐπικεκλημένῃ ... ὄνομα
  choice: призванной Его ... именем
  rationale: Сохраняет естественную для греческого текста связь с призванием; возможный оттенок «над которой наречено имя» не вынесен в основной текст из-за громоздкости.
- source_word: ὑπομονήν καὶ μακροθυμίαν
  choice: стойкость и долготерпение
  rationale: Различает терпеливую выдержку в испытаниях и продолжительное терпение по отношению к людям или обстоятельствам.
- source_word: ἐγκράτειαν
  choice: самообладание
  rationale: Современный и понятный эквивалент владения собой и своими желаниями.
- source_word: ἁγνείαν
  choice: чистоту
  rationale: Сохраняет широкий нравственный смысл, не ограничивая его только половой чистотой.
- source_word: σωφροσύνην
  choice: благоразумие
  rationale: Передаёт здравость и нравственную рассудительность; более естественно в данном перечне добродетелей, чем буквальное «здравомыслие».
- source_word: ἀρχιερέως καὶ προστάτου
  choice: Первосвященника и Заступника
  rationale: Сохраняет культовый титул и передаёт προστάτης как того, кто защищает и ходатайствует, не сужая его до одного административного значения.
- source_word: εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων
  choice: во все веки веков
  rationale: Устоявшаяся возвышенная русская формула, точно отражающая усиленную греческую идиому вечности.
theological_decisions:
- issue: Смысл ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστόν
  choice: избравший Господа Иисуса Христа
  alternative: избравший [для служения] Господа Иисуса Христа
  rationale: Глагол переведён прямо, без догматического пояснения природы или цели избрания; напряжение формулировки сохранено.
- issue: Связь διʼ αὐτοῦ с избранием общины
  choice: а через Него — и нас, чтобы мы стали народом, принадлежащим Ему
  alternative: и через Него избравший нас в Свой особый народ
  rationale: Сохранено посредничество Христа и грамматическая связь обоих дополнений с ἐκλεξάμενος, без чрезмерного повторения глагола.
- issue: Референт местоимений в славословии
  choice: Через Него Богу слава ...
  alternative: через Него Ему слава ...
  rationale: «Богу» естественно проясняет, что слава воздаётся Богу через Иисуса Христа, согласно ближайшей синтаксической структуре, не приписывая славословие исключительно Христу.
- issue: εὐαρέστησιν τῷ ὀνόματι αὐτοῦ
  choice: чтобы быть угодной Его имени
  alternative: для благоугождения Его имени
  rationale: Сохранён необычный адресат благоугождения — Божье имя, а не молча исправлено на «Богу».
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской молитвы. Сохранены библейские формулы «Владыка духов», «Господь всякой плоти», «веки веков» и титул «Первосвященник»; синтаксис умеренно упрощён для ясности. Маркеры сносок не требуются, поскольку сносок нет.
