source:
  edition: Funk 1901 (normalized OCR)
  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: ru
  text: Итак, проповедуя по областям и городам, они назначали своих первых обращённых[a], испытав их Духом, епископами и диаконами[b] для тех, кому предстояло уверовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их начатки» (ἀπαρχάς), то есть первые плоды их проповеди.'
    reason: Сохраняет образ исходного текста, разъясняя естественное по-русски «первые обращённые».
  - marker: b
    text: 'Греч. ἐπίσκοποι и διάκονοι. В данном раннем контексте эти наименования не обязательно подразумевают позднейшее церковное устройство. Буквально τῷ πνεύματι: «Духом»; возможны менее определённые передачи «духовно» или «в духе».'
    reason: Сохраняет исходные наименования и отмечает как историческую осторожность в их понимании, так и интерпретационный вопрос при πνεύματι.
lexical_decisions:
- source_word: κατὰ χώρας οὖν καὶ πόλεις
  choice: итак, проповедуя в разных областях и городах
  rationale: Передаёт распределительное значение κατά с естественным русским «в разных»; οὖν сохранено как «итак».
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: первых обращённых
  rationale: Буквально «их начатки»; в контексте миссии речь идёт о первых плодах проповеди, то есть первых уверовавших. Образ отмечен в сноске.
- source_word: δοκιμάσαντες τῷ πνεύματι
  choice: испытывали Духом
  rationale: Сохраняет инструментальный дательный и неоднозначность πνεῦμα; прописная буква отражает наиболее вероятное указание на Святого Духа, при этом альтернативное понимание дано в сноске.
- source_word: καθίστανον
  choice: поставляли
  rationale: Имперфект передаёт повторявшееся действие апостолов в ходе проповеди; «поставляли» естественно для назначения на служение.
- source_word: ἐπισκόπους καὶ διακόνους
  choice: блюстителями и служителями
  rationale: Передаёт функциональный смысл раннехристианских наименований, не навязывая более позднюю форму церковных должностей; традиционные соответствия указаны в сноске.
- source_word: τῶν μελλόντων πιστεύειν
  choice: для тех, кому предстояло уверовать
  rationale: Сохраняет будущую направленность конструкции μέλλω с инфинитивом и связь служения с будущими верующими.
theological_decisions:
- issue: Кого испытывали и поставляли
  choice: первых обращённых
  alternative: первые плоды их труда / начатки
  rationale: Винительный τὰς ἀπαρχὰς αὐτῶν является объектом обоих действий; контекст указывает на людей, однако метафора «начатков» сохраняется в сноске.
- issue: Значение τῷ πνεύματι
  choice: Духом
  alternative: духовно / в духе
  rationale: Дательный может обозначать средство испытания; наиболее вероятен Святой Дух, но греческая форма сама по себе допускает менее определённое прочтение, поэтому оно отмечено.
- issue: Статус ἐπίσκοποι и διάκονοι
  choice: функциональные «блюстители и служители»
  alternative: церковные титулы «епископы и диаконы»
  rationale: Функциональный перевод сохраняет раннюю историческую открытость терминов и не переносит без оговорки позднейшие институциональные значения.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского текста. Синтаксис упрощён лишь настолько, чтобы фраза звучала естественно; повторный характер καθίστανον передан несовершенным видом. Термины служения переведены функционально, а традиционная церковная лексика сохранена в примечании.
