  to: Итак, получив поручения и обретя полную уверенность благодаря воскресению нашего Господа Иисуса Мессии, а также будучи утверждены в слове Божьем, они вышли с полной уверенностью, которую даёт Святой Дух, возвещая благую весть о том, что Царство Божье вот-вот придёт[a].
