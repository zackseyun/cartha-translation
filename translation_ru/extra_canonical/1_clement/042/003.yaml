source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: ru
  text: Итак, получив поручения и обретя полную уверенность благодаря воскресению нашего Господа Иисуса Мессии, а также будучи утверждены в слове Божьем, они вышли с полной уверенностью, которую даёт Святой Дух, возвещая благую весть о том, что Царство Божье вот-вот придёт[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «должно прийти».'
    reason: Греческое μέλλειν ἔρχεσθαι может указывать как на близость предстоящего пришествия, так и на то, что оно должно совершиться.
lexical_decisions:
- source_word: παραγγελίας
  choice: поручения
  rationale: Передаёт полученные наставления или повеления, не сужая значение исключительно до формального приказа.
- source_word: πληροφορηθέντες
  choice: обретя полную уверенность
  rationale: Сохраняет усиленное значение полной убеждённости и естественно сочетается с указанием на воскресение как её основание.
- source_word: πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ
  choice: утвердившись в слове Божьем
  rationale: Передаёт укрепление и подтверждение веры посредством Божьего слова, не перегружая русский текст пассивной конструкцией.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт титульное значение греческого Χριστός и согласуется с контекстом раннехристианского исповедания.
- source_word: εὐαγγελιζόμενοι
  choice: возвещали благую весть
  rationale: Передаёт глагольное значение провозглашения радостной вести, а не использует конфессионально маркированную транслитерацию.
- source_word: μέλλειν ἔρχεσθαι
  choice: вот-вот придёт
  rationale: Выражает ожидаемое близкое наступление Царства; альтернативное модальное понимание отмечено в сноске.
theological_decisions:
- issue: Характер уверенности в выражении μετὰ πληροφορίας πνεύματος ἁγίου
  choice: исполненные уверенности от Святого Духа
  alternative: с полной уверенностью Святого Духа
  rationale: Русская формулировка естественно указывает на Святого Духа как источник уверенности, не вводя дополнительных учений о способе Его действия.
- issue: Временное или модальное значение μέλλειν
  choice: Царство Божье вот-вот придёт
  alternative: Царство Божье должно прийти
  rationale: Контекст благовестия допускает оттенок близкого ожидания, но греческая конструкция может также обозначать предстоящее или должное событие; альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианского текста звучанием. Синтаксис сделан плавным и общедоступным; богословские термины не перегружены конфессиональной лексикой.
