  verdict: revise
  source_fidelity: 'Основной смысл передан верно: полученные поручения, уверенность через воскресение Иисуса Мессии, связь со словом Божьим, благовестие и грядущее Царство Божье сохранены. Однако πιστωθέντες — страдательное причастие; «утвердившись» неоправданно переводит его активным залогом. Выражение «уверенности от Святого Духа» также менее точно и менее естественно, чем указание на уверенность, даруемую Святым Духом. «Вот-вот придёт» допустимо для μέλλειν ἔρχεσθαι; сноска надлежащим образом сохраняет возможный модальный оттенок.'
  naturalness: Текст в целом литературен, но «исполненные уверенности от Святого Духа» звучит по-русски тяжеловесно и не вполне идиоматично. Перестройка на «с полной уверенностью, которую даёт Святой Дух» делает фразу естественной, не меняя смысла.
  terminology: «Иисус Мессия», «слово Божье», «Святой Дух», «Царство Божье» уместны и последовательны. «Благая весть» — нейтральная современная передача εὐαγγελιζόμενοι.
