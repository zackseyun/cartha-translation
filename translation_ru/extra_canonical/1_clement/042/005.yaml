id: 1CLEM.42.5
reference: 1 Clement 42:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ τοῦτο οὐ καινῶς· ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο περὶ ἐπισκόπων καὶ διακόνων. οὕτως γάρ που λέγει ἡ γραφή· Καταστήσω τοὺς ἐπισκόπους αὐτῶν ἐν δικαιοσύνῃ καὶ τοὺς διακόνους αὐτῶν ἐν πίστει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: ru
  text: 'И это не было чем-то новым: ведь о епископах[a] и диаконах[b] было написано уже много веков назад. Ибо Писание где-то говорит так: «Я поставлю их епископов в праведности и их диаконов в вере».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ἐπίσκοπος — «надзиратель, блюститель»; здесь также обозначение церковного служения, традиционно передаваемое словом «епископ».
    reason: Сохраняет как обычное значение греческого слова, так и его раннехристианское терминологическое употребление.
  - marker: b
    text: Греч. διάκονος — «служитель»; здесь также обозначение церковного служения, традиционно передаваемое словом «диакон».
    reason: Поясняет исходное значение термина, не сводя его безоговорочно к позднейшему устройству церковной должности.
lexical_decisions:
- source_word: ἐπισκόπων / ἐπισκόπους
  choice: епископах / епископов
  rationale: В раннехристианском контексте это естественное и исторически закрепившееся русское соответствие; при этом сноска сохраняет исходное значение слова «надзиратель, блюститель» и не навязывает позднейшую модель церковного устройства.
- source_word: διακόνων / διακόνους
  choice: диаконах / диаконов
  rationale: Передаёт устойчивый раннехристианский термин и сохраняет параллель с ἐπίσκοποι; сноска отмечает более широкое исходное значение «служитель».
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων
  choice: ведь … уже много веков назад
  rationale: Естественно выражает усиленную мысль о большой временной давности, не сводя πολλῶν χρόνων к неопределённому «издавна».
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: Ибо Писание где-то говорит так
  rationale: Сохраняет и οὕτως («так»), и осторожное указание που («где-то»), характерное для формулы цитирования.
- source_word: ἐν δικαιοσύνῃ / ἐν πίστει
  choice: в праведности / в вере
  rationale: Формально сохраняет параллелизм и смысловую открытость греческих предложных оборотов, не уточняя без основания, означают ли они качество служения, способ назначения или сферу действия.
theological_decisions:
- issue: Статус терминов ἐπίσκοποι и διάκονοι
  choice: епископы и диаконы, с пояснением исходной семантики в сносках
  alternative: надзиратели и служители
  rationale: Транслитерированные церковные термины естественны для данного раннехристианского текста, но сноски препятствуют автоматическому переносу на I век более поздних конфессиональных представлений о должностях.
- issue: Значение оборотов «в праведности» и «в вере»
  choice: сохранить буквальную и неоднозначную конструкцию
  alternative: «праведных епископов и верных диаконов» или «назначу по праведности и вере»
  rationale: Греческий текст допускает более одного смыслового отношения; конкретизация сняла бы подлинную неоднозначность цитаты.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской прозы. Двоеточие естественно вводит объяснение, а формула «Писание где-то говорит так» намеренно сохраняет несколько необычный порядок и оба элемента греческой формулы цитирования.
