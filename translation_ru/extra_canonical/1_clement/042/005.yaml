  source_fidelity: 'Перевод точно передаёт οὐ καινῶς («не было чем-то новым»), усиленное указание на давность ἐκ γὰρ δὴ πολλῶν χρόνων («ведь… уже много веков назад»), а также оба элемента формулы οὕτως γὰρ που λέγει ἡ γραφή: «так» и осторожное «где-то». Цитата сохраняет исходный параллелизм и неоднозначность оборотов «в праведности» и «в вере».'
