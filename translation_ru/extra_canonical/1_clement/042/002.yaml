source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: ru
  text: Итак, Мессия — от Бога, а апостолы — от Мессии; и то и другое совершилось в должном порядке по воле Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из воли Бога».'
    reason: Указывает буквальную конструкцию ἐκ θελήματος θεοῦ; в основном тексте она естественно передана выражением «по воле Бога».
lexical_decisions:
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Передаёт греческий титул Χριστός через его смысл («Помазанник») в принятой и понятной русской форме, не превращая титул в имя.
- source_word: ἀπὸ
  choice: от
  rationale: 'Сохраняет выраженное в обеих параллельных фразах происхождение или посланничество: Мессия — от Бога, апостолы — от Мессии.'
- source_word: ἀμφότερα
  choice: и то и другое
  rationale: Средний род множественного числа указывает на оба только что названных установления или события, а не непосредственно на лиц.
- source_word: εὐτάκτως
  choice: в должном порядке
  rationale: Естественно передаёт значение упорядоченности и надлежащей последовательности.
- source_word: ἐκ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Это естественный современный русский способ выразить основание и источник происходящего в Божьей воле.
theological_decisions:
- issue: Характер связи в выражениях «от Бога» и «от Мессии»
  choice: Сохранить краткое «от», не уточняя вид происхождения или посланничества
  alternative: «послан Богом» / «посланы Мессией»
  rationale: Греческое ἀπό допускает более широкую связь источника; явное добавление идеи посланничества устранило бы лаконичность и возможную смысловую широту текста.
- issue: Значение ἀμφότερα
  choice: Отнести «и то и другое» к двум названным звеньям установленного порядка
  alternative: «оба были поставлены» или «все они пришли»
  rationale: Форма среднего рода ἀμφότερα грамматически не обозначает непосредственно Мессию и апостолов как лиц; нейтральная формулировка сохраняет структуру оригинала.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и ритмически параллельная формулировка. Тире подчёркивают соответствие двух звеньев, не добавляя отсутствующего в греческом глагола.
