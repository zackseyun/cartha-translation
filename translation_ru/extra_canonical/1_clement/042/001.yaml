source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: ru
  text: Апостолы получили для нас Благую Весть от Господа Иисуса Христа, а Иисус Христос был послан Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἀπόστολοι
  choice: Апостолы
  rationale: Прямой и общепринятый эквивалент, сохраняющий церковно-исторический смысл.
- source_word: ἡμῖν
  choice: для нас
  rationale: Дательный падеж допускает значение адресата или пользы; «для нас» естественно передаёт связь апостольского благовестия с общиной, не превращая её в прямую речь к ней.
- source_word: εὐηγγελίσθησαν
  choice: получили Благую Весть
  rationale: Пассивная форма передаёт получение благовестия; такая формулировка сохраняет направление передачи, хотя глагол допускает также перевод «им была возвещена Благая Весть».
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: от Господа Иисуса Христа
  rationale: Сохраняется источник благовестия и традиционное русское написание титулов и имени.
- source_word: ἐξεπέμφθη
  choice: был послан
  rationale: Естественный русский эквивалент пассивного аориста; приставочное значение отправления не требует тяжеловесного «был выслан».
- source_word: ἀπὸ τοῦ θεοῦ
  choice: Богом
  rationale: Греческое ἀπό указывает на источник или отправителя; русский творительный естественно выражает деятеля при пассивной конструкции.
theological_decisions:
- issue: Χριστός как титул или часть традиционного имени
  choice: Христос
  alternative: Мессия / Помазанник
  rationale: В раннехристианском контексте титульный смысл сохраняется, но в современном русском тексте «Иисус Христос» является ясной и естественной формой без навязывания разграничения между именем и титулом.
- issue: Параллелизм двух посланничеств
  choice: 'Сохранена последовательность: апостолы получают Благую Весть от Иисуса Христа, Иисус Христос послан Богом'
  alternative: Уточнить подразумеваемое последующее послание апостолов Христом
  rationale: Греческий текст формулирует первую часть через εὐαγγελίζομαι, а вторую через ἐκπέμπω; перевод не уравнивает эти глаголы и сохраняет богословский порядок источника миссии.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского текста. Синтаксический параллелизм оригинала сохранён; громоздкое буквальное «были благовествованы» заменено естественным «получили Благую Весть».
