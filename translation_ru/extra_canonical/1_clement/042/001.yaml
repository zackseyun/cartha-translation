  source_fidelity: 'Перевод верно передаёт структуру и смысл греческого текста: апостолы получают благую весть от Господа Иисуса Христа, а Иисус Христос послан Богом. «Для нас» допустимо передаёт дательный ἡμῖν как указание на получателей либо на благо которых совершается возвещение; спорная нюансировка не устранена чрезмерным уточнением.'
