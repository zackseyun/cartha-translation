  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: ru
  text: Дерзость[a], своеволие и безрассудная смелость свойственны проклятым Богом; снисходительность, смиренномудрие и кротость — благословлённым Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наглость», «наглая смелость».'
    reason: θράσος в этом перечне пороков обозначает не похвальную смелость, а вызывающую, бесстыдную дерзость.
lexical_decisions:
- source_word: θράσος
  choice: дерзость
  rationale: В перечне пороков слово обозначает не добродетельную смелость, а вызывающую, бесстыдную дерзость; примечание сохраняет возможный оттенок чрезмерной смелости.
- source_word: αὐθάδεια
  choice: самонадеянность
  rationale: Передаёт своеволие и высокомерную уверенность в себе, не дублируя полностью θράσος.
- source_word: τόλμα
  choice: безрассудная смелость
  rationale: Само слово может означать смелость или отвагу, но окружение из пороков требует отрицательного оттенка — опрометчивой, безрассудной смелости.
- source_word: ἐπιείκεια
  choice: кроткая снисходительность
  rationale: Сочетание передаёт мягкость, уступчивость и великодушную умеренность, заложенные в ἐπιείκεια.
- source_word: ταπεινοφροσύνη
  choice: смиренномудрие
  rationale: Традиционное и точное обозначение смиренного образа мыслей, уместное в раннехристианском тексте и понятное в литературном русском.
- source_word: πραΰτης
  choice: мягкость
  rationale: Позволяет отличить πραΰτης от близкого ἐπιείκεια и выражает незлобивую мягкость нрава.
- source_word: παρὰ τοῖς
  choice: свойственны …; … — благословлённым
  rationale: Естественно передаёт эллиптическую конструкцию принадлежности/нахождения у двух противопоставленных групп без добавления лишнего глагола.
theological_decisions:
- issue: ὑπὸ τοῦ θεοῦ при κατηραμένοις и ηὐλογημένοις
  choice: проклятым Богом / благословлённым Богом
  alternative: находящимся под Божьим проклятием / получившим Божье благословение
  rationale: Сохранены прямые пассивные причастия и симметрия оригинала; формулировка не смягчает и не объясняет богословское напряжение между Божьим проклятием и благословением.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского нравственного наставления. Трёхчленные перечни и резкое противопоставление сохранены; близкие греческие добродетели разведены как «кроткая снисходительность», «смиренномудрие» и «мягкость».
