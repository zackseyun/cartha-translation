  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: ru
  text: Итак, прилепимся к тем, кому дана благодать от Бога. Облечёмся в единодушие, пребывая в смиренномудрии и воздержании, держа себя вдали от всяких тайных пересудов и всякого злословия, получая оправдание делами, а не словами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи оправданы делами, а не словами». Греческое δικαιούμενοι — страдательная форма; в контексте она также может подразумевать, что праведность человека подтверждается его делами.'
    reason: Сохраняет страдательное значение греческой формы и осторожно отмечает возможный контекстуальный оттенок без подмены его активной конструкцией.
lexical_decisions:
- source_word: κολληθῶμεν
  choice: прилепимся
  rationale: Передаёт образ тесной и стойкой привязанности, сохраняя выразительность греческого глагола.
- source_word: ὁμόνοιαν
  choice: единодушие
  rationale: Естественно обозначает согласие и общность устремлений, не сводя смысл лишь к отсутствию конфликтов.
- source_word: ταπεινοφρονοῦντες
  choice: пребывая в смиренномудрии
  rationale: Сохраняет положительный нравственный смысл смиренного образа мыслей, а не униженности.
- source_word: ἐγκρατευόμενοι
  choice: в воздержании
  rationale: Передаёт самообладание и сдержанность без неоправданного сужения до одной конкретной аскетической практики.
- source_word: ψιθυρισμοῦ
  choice: тайных пересудов
  rationale: Передаёт скрытую, произносимую вполголоса порочащую речь; по-русски яснее буквального «шёпота».
- source_word: καταλαλιᾶς
  choice: злословия
  rationale: Точно и естественно обозначает порочащую речь против другого человека.
- source_word: δικαιούμενοι
  choice: оправдываясь
  rationale: Сохраняет судебно-нравственную многозначность греческого слова и напряжение между делами и словами.
theological_decisions:
- issue: Смысл выражения ἔργοις δικαιούμενοι
  choice: «оправдываясь делами» с пояснительной сноской
  alternative: «доказывая свою праведность делами» или «оказываясь праведными по делам»
  rationale: Греческая форма допускает оттенки оправдания, признания праведным и подтверждения правоты. Основной текст сохраняет сильную формулировку оригинала, а сноска не позволяет безоговорочно закрепить только одно богословское прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной раннехристианской интонацией. «Прилепимся», «облечёмся» и «смиренномудрие» сохраняют образность и достоинство оригинала, оставаясь понятными в контексте.
