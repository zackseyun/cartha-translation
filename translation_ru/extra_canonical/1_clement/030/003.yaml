review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт последовательность увещаний и ключевые образы оригинала. Однако «оправдываясь делами» в современном русском обычно означает «защищаясь, находя себе оправдание» и тем самым смещает значение страдательной формы δικαιούμενοι. Нужна формулировка, яснее передающая «быть оправдываемыми/получать оправдание».
  naturalness: Текст литературен и выдержан по регистру. «Прилепимся», «облечёмся» и «смиренномудрие» уместны в умеренно возвышенной раннехристианской прозе. «Тайные пересуды» удачно конкретизирует ψιθυρισμός, но «всяких» естественнее согласовать с обоими однородными существительными.
  terminology: «Благодать», «единодушие», «смиренномудрие» и «воздержание» хорошо соответствуют оригиналу и традиционному русскому христианскому словоупотреблению. Для δικαιούμενοι предпочтительно сохранить страдательную направленность без значения самооправдания.
  issues:
  - severity: medium
    issue: «Оправдываясь делами» меняет залог и обычный русский смысл δικαιούμενοι.
    rationale: Греческое δικαιούμενοι — причастие настоящего времени средне-страдательного залога; в данном контексте естественно передать его как «получая оправдание» или «будучи оправданы». Русское «оправдываясь» преимущественно обозначает попытку оправдать себя.
  - severity: low
    issue: Сноска предлагает активное «подтверждая ... что мы правы», хотя это не прямое значение данной формы.
    rationale: Пояснение может отметить контекстуальный оттенок подтверждения праведности делами, но не должно представлять активное значение как равнозначное буквальному переводу страдательной формы.
  - severity: low
    issue: «От всяких тайных пересудов и злословия» имеет не вполне ровное согласование.
    rationale: Форма «от всяких тайных пересудов и всякого злословия» делает охват ἀπὸ παντὸς ясным и синтаксически плавным.
