id: 1CLEM.30.1
reference: 1 Clement 30:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: ru
  text: Итак, будучи святым уделом, будем делать всё, что относится к освящению, избегая злословия, скверных и нечистых связей, пьянства и мятежей, мерзких желаний, отвратительного прелюбодеяния, мерзкой гордости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅγια ... μερὶς
  choice: святая часть
  rationale: Сохраняет образ и грамматическое число греческого выражения; «часть» здесь означает общину как удел, принадлежащий святому.
- source_word: τὰ τοῦ ἁγιασμοῦ πάντα
  choice: всё, что относится к освящению
  rationale: Естественно передаёт субстантивированную конструкцию, сохраняя широкий смысл практик и поступков, соответствующих святости.
- source_word: καταλαλιάς
  choice: злословия
  rationale: Передаёт множественное число и значение порочащей, недоброжелательной речи без чрезмерного сужения до юридической клеветы.
- source_word: συμπλοκὰς
  choice: связей
  rationale: Слово допускает значения сцеплений, связей или столкновений; в сочетании с «скверных и нечистых» вероятен нравственно/сексуально предосудительный смысл, но перевод не делает его излишне конкретным.
- source_word: νεωτεροποιΐας
  choice: мятежей
  rationale: В данном перечне обозначает подрывные новшества, смуты или бунтарские действия; «мятежи» ясно и сжато передаёт общественный оттенок.
- source_word: βδελυκτὰς ... βδελυκτὴν
  choice: мерзких ... мерзкой
  rationale: Сохраняет намеренное повторение одного греческого прилагательного при желаниях и гордости.
- source_word: μυσερὰν
  choice: отвратительного
  rationale: Отличает это прилагательное от повторённого βδελυκτός, одновременно сохраняя сильную негативную оценку.
theological_decisions:
- issue: Соотношение святого статуса и нравственного призыва
  choice: «поскольку мы — святая часть, будем делать всё, что относится к освящению»
  alternative: «как святой удел, совершим все дела святости»
  rationale: 'Перевод сохраняет исходную напряжённость: община уже названа святой частью, но одновременно призвана к освящению; ни статус, ни нравственный процесс не поглощает другой.'
- issue: Смысл συμπλοκάς
  choice: нейтрально-широкое «связей» с отрицательными определениями
  alternative: «соитий» или «схваток»
  rationale: Контекст допускает сексуальный оттенок, однако само слово неоднозначно; более широкий вариант не навязывает единственного толкования.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Сохранены перечислительная структура, союз между «пьянством и мятежами», а также бессоюзное присоединение последних пороков и риторическое повторение βδελυκτός.
