  text: ὁ ἔπαινος ἡμῶν ἔστω ἐν θεῷ καὶ μὴ ἐξ αὐτῶν· αὐτεπανέτους γὰρ μισεῖ ὁ θεός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: ru
  text: Пусть наша похвала будет в Боге и не исходит от нас самих, потому что Бог ненавидит тех, кто восхваляет себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: наша похвала
  rationale: Сохраняет прямое значение ἔπαινος и допускает смысл похвалы или основания для похвалы, не заменяя его более узким понятием «хвастовство».
- source_word: ἐν θεῷ
  choice: в Боге
  rationale: 'Формально сохраняет греческую конструкцию и её богословскую ёмкость: похвала связана с Богом и имеет в Нём своё основание.'
- source_word: μὴ ἐξ αὐτῶν
  choice: не исходит от нас самих
  rationale: Передаёт различие между ἐν («в») и ἐξ («из, от»); αὐτῶν по смыслу относится к говорящим и естественно выражается по-русски как «нас самих».
- source_word: αὐτεπανέτους
  choice: тех, кто хвалит сам себя
  rationale: Развёрнутая передача редкого сложного прилагательного со значением «сам себя восхваляющий» звучит ясно и естественно в современном русском языке.
- source_word: μισεῖ
  choice: ненавидит
  rationale: Прямой эквивалент сильного глагола μισέω без ослабления выражения.
theological_decisions:
- issue: Источник и направленность похвалы
  choice: «похвала будет в Боге, а не исходит от нас самих»
  alternative: «будем хвалиться Богом, а не собой»
  rationale: Выбранная формулировка сохраняет существительное ἔπαινος и противопоставление предлогов ἐν и ἐξ, не сводя возможный смысл только к человеческому хвастовству.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и доступная. Синтаксическое противопоставление греческого текста сохранено без искусственной архаизации.
