  source_fidelity: 'Основной смысл передан верно: цитата включает обе части, ὁ πολλὰ λέγων передан без лишней оценки, а δίκαιος — уместным «праведный». Однако «услышит и ответ» грамматически и стилистически неудачно: καὶ ἀντακούσεται выражает получение/слышание ответной реплики, но по-русски требуется «услышит ответ» либо «получит ответ». Кроме того, явное «Он» с прописной буквы не имеет выраженного соответствия в греческом λέγει и излишне конкретизирует не названного субъекта.'
