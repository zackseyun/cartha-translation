  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
translation:
  language: ru
  text: 'Ибо сказано: «Кто много говорит, тот услышит ответ; или красноречивый человек считает себя праведным?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ
  choice: Ведь Он говорит
  rationale: γάρ передано причинно-пояснительным «ведь»; подразумеваемый субъект в формуле введения Писания естественно выражен местоимением «Он».
- source_word: ὁ πολλὰ λέγων
  choice: кто много говорит
  rationale: Передаёт субстантивированное причастие естественной русской конструкцией без добавления оценки многословия.
- source_word: καὶ ἀντακούσεται
  choice: тот услышит и ответ
  rationale: ἀντακούω означает услышать ответ или возражение; формулировка сохраняет образ ответной речи и значение будущего времени.
- source_word: ὁ εὔλαλος
  choice: красноречивый человек
  rationale: εὔλαλος обозначает человека, хорошо или легко говорящего; «красноречивый» кратко и естественно передаёт это значение.
- source_word: οἴεται εἶναι δίκαιος
  choice: считает себя праведным
  rationale: Конструкция οἴεται εἶναι передана возвратным оборотом, а δίκαιος — традиционным и контекстуально уместным «праведным».
theological_decisions:
- issue: Границы цитаты из Писания
  choice: Весь вопрос, включая вторую часть после точки с запятой, оставлен внутри кавычек.
  alternative: Закрыть цитату после слов «услышит и ответ» и считать следующий вопрос словами Климента.
  rationale: После λέγει γάρ греческий текст непрерывно приводит обе части изречения; грамматических признаков возвращения к голосу Климента нет.
- issue: Субъект λέγει
  choice: «Он» с прописной буквы
  alternative: Безличное «сказано» или «Писание говорит».
  rationale: Так естественно передаётся подразумеваемый божественный субъект формулы цитирования, хотя в греческом существительное не названо; это не меняет содержания цитаты.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского текста. Синтаксис сделан ясным для обычного читателя; сохранены риторический вопрос, связь двух частей цитаты и термин «праведный».
