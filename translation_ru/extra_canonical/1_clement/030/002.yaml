  text: θεὸς γάρ, φησίν, ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: ru
  text: 'Ведь сказано[a]: «Бог гордым противится, а смиренным даёт благодать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь Бог, говорит он, гордым противится, а смиренным даёт благодать».'
    reason: Греческое φησίν формально допускает вводное личное прочтение «говорит он», хотя в контексте естественнее понимать его как формулу цитирования Писания.
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: гордым
  rationale: Естественный и точный русский эквивалент, сохраняющий нравственный смысл надменности и гордости.
- source_word: ἀντιτάσσεται
  choice: противится
  rationale: Передаёт активное противостояние Бога и сохраняет традиционно узнаваемую формулировку цитаты.
- source_word: ταπεινοῖς
  choice: смиренным
  rationale: В данном противопоставлении гордым обозначает людей смиренных, а не просто занимающих низкое положение.
- source_word: χάριν
  choice: благодать
  rationale: Сохраняет богословскую ёмкость χάρις как Божьего благоволения и дара.
theological_decisions:
- issue: Кто является подразумеваемым субъектом φησίν
  choice: Безличная формула цитирования «сказано»
  alternative: Вводное «говорит он»
  rationale: Здесь φησίν вводит цитату из Писания; безличное русское «сказано» ясно обозначает цитирование и не создаёт впечатления, будто «он» относится к Богу внутри цитаты.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; формулировка сохраняет узнаваемость библейской цитаты без архаического синтаксиса.
