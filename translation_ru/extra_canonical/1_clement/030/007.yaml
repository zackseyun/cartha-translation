  source_fidelity: 'Текст точно передаёт побудительную пассивную конструкцию διδόσθω ὑπ’ ἄλλων естественным русским оборотом «Пусть ... свидетельствуют другие». «О наших добрых делах» правомерно передаёт τῆς ἀγαθῆς πράξεως ἡμῶν: единственное число πράξις допускает как отдельный поступок, так и общую нравственную практику. Во второй части «как свидетельствовали о наших праведных отцах» естественно разворачивает эллиптическую мысль греческого «как [свидетельство] было дано нашим праведным отцам»; не утверждается, что сами отцы свидетельствовали.'
