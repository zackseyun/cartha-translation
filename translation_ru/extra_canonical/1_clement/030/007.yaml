id: 1CLEM.30.7
reference: 1 Clement 30:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: ru
  text: Пусть о наших добрых делах[a] свидетельствуют другие, как свидетельствовали о наших праведных отцах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашем добром поведении»; возможно также: «нашем добром поступке».'
    reason: Греческое πρᾶξις может обозначать поступок, действие или образ поведения.
lexical_decisions:
- source_word: ἡ μαρτυρία ... διδόσθω ὑπ’ ἄλλων
  choice: пусть ... свидетельствуют другие
  rationale: Естественная русская передача греческой пассивной конструкции «пусть свидетельство даётся другими», сохраняющая призыв не свидетельствовать о себе.
- source_word: τῆς ἀγαθῆς πράξεως ἡμῶν
  choice: о наших добрых делах
  rationale: Единственное число πρᾶξις может обозначать поступок либо образ действий; русское множественное «добрые дела» естественно выражает совокупную нравственную практику, не сводя смысл к одному поступку.
- source_word: τοῖς πατράσιν ἡμῶν τοῖς δικαίοις
  choice: о наших праведных отцах
  rationale: 'В перестроенной русской конструкции дательный при пассивном «было дано отцам» естественно передан как объект свидетельства: свидетельствовали «о ... отцах».'
theological_decisions:
- issue: 'Характер доброй πρᾶξις: отдельный поступок или нравственное поведение'
  choice: добрые дела с примечанием
  alternative: доброе поведение; добрый поступок
  rationale: Контекст допускает собирательный смысл жизненной практики, тогда как форма единственного числа не исключает значения отдельного поступка. Основной текст звучит естественно по-русски, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; наставительный, но не архаичный тон. Синтаксис слегка перестроен ради ясности и естественности, при этом параллель между адресатами и праведными предками сохранён.
