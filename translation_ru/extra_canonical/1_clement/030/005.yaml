  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
translation:
  language: ru
  text: Благословен рождённый женщиной, чья жизнь коротка. Не будь многословен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: Благословен
  rationale: Передаёт причастие в его прямом значении без добавления субъекта, которого нет в греческом тексте.
- source_word: γεννητὸς γυναικός
  choice: рождённый женщиной
  rationale: Близко воспроизводит греческое выражение и сохраняет его библейскую образность.
- source_word: ὀλιγόβιος
  choice: чья жизнь коротка
  rationale: Естественно по-русски передаёт значение «недолговечный» и ясно соотносит определение с рождённым женщиной.
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  choice: Не будь многословен
  rationale: Кратко и идиоматично передаёт запрет быть «обильным в словах»; γίνου здесь допускает русское «будь», а не требует буквального «становись».
theological_decisions:
- issue: Связь ὀλιγόβιος с предшествующим выражением
  choice: Отнести характеристику краткой жизни к рождённому женщиной
  alternative: Оставить приложение «рождённый женщиной, недолговечный»
  rationale: Смысловая связь ясна из согласования, а придаточная конструкция устраняет неестественную для современного русского цепочку определений, не разрешая текст в пользу какой-либо богословской традиции.
translation_notes:
  register: Современный литературный русский язык; тон краткий, назидательный и достойный. Библейская формула «рождённый женщиной» сохранена, а заключительное наставление передано общеупотребительным словом «многословен».
