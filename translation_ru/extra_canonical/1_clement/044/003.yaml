revisions:
- from: Итак[a], тех, кого поставили они или позднее — другие уважаемые мужи с согласия всей церкви, кто безупречно служил стаду Христа, смиренно, спокойно и без притязаний, и о ком на протяжении многих лет все хорошо отзывались, — тех, полагаем мы, несправедливо отстранять от служения.
  to: Итак[a], тех, кого поставили они или позднее другие уважаемые мужи с согласия всей церкви, кто безупречно служил стаду Христа — смиренно, спокойно и непритязательно — и о ком на протяжении многих лет все хорошо отзывались, тех, полагаем мы, несправедливо отстранять от служения.
  rationale: Исправлено только безопасное синтаксическое членение альтернативы «ими или позднее другими…» и уточнена передача ἀβαναύσως. Сохранены порядок риторического выделения, неопределённость административного механизма назначения и отстранения, а также нормативная оценка, выраженная в оригинале.
