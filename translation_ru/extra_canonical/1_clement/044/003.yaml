id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: ru
  text: Итак[a], тех, кого поставили они или позднее другие уважаемые мужи с согласия всей церкви, кто безупречно служил стаду Христа — смиренно, спокойно и непритязательно — и о ком на протяжении многих лет все хорошо отзывались, тех, полагаем мы, несправедливо отстранять от служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Итак, мы считаем несправедливым отстранять от служения тех, кого поставили они или позднее другие уважаемые мужи с согласия всей церкви…»'
    reason: Греческое предложение сначала пространно описывает служителей, а затем возвращается к ним указательным местоимением; по-русски мысль можно передать и придаточной конструкцией без изменения основного смысла.
lexical_decisions:
- source_word: κατασταθέντας
  choice: кого поставили
  rationale: Передаёт официальное назначение, не уточняя должность сверх сказанного в греческом тексте.
- source_word: ἐλλογίμων ἀνδρῶν
  choice: уважаемые мужи
  rationale: Сохраняет значение признанной достойности и несколько возвышенный регистр раннехристианского послания.
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: с согласия всей церкви
  rationale: Естественно выражает одобрение или совместное согласие всей общины, не превращая его в формализованную процедуру.
- source_word: λειτουργήσαντας
  choice: служил
  rationale: В данном контексте обозначает исполнение церковного служения; русский глагол не навязывает более позднего узкотехнического значения слова «литургия».
- source_word: ποιμνίῳ τοῦ Χριστοῦ
  choice: стаду Христа
  rationale: Сохраняет пастырскую метафору оригинала.
- source_word: ἡσύχως
  choice: спокойно
  rationale: Передаёт тихий, мирный и не вызывающий раздоров образ служения.
- source_word: ἀβαναύσως
  choice: без притязаний
  rationale: Передаёт отсутствие низкой самонадеянности и показности; соответствует контексту смиренного, достойного служения и не сводит редкое слово к одной спорной этимологической трактовке.
- source_word: μεμαρτυρημένους ... ὑπὸ πάντων
  choice: о ком ... все хорошо отзывались
  rationale: Естественно по-русски выражает длительное и всеобщее доброе свидетельство об этих служителях.
- source_word: ἀποβάλλεσθαι τῆς λειτουργίας
  choice: отстранять от служения
  rationale: Передаёт удаление из исполняемого служения, не уточняя неизвестный тексту административный механизм.
theological_decisions:
- issue: Наименование Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В русском раннехристианском церковном тексте «Христос» является естественным и общеупотребительным титулом, сохраняя связь с греческим Χριστός без конфессионального уточнения.
- issue: Характер церковного назначения и служения
  choice: поставили; служение
  alternative: рукоположили; священство
  rationale: Оригинал не требует понимать назначение как конкретный позднейший чин рукоположения, а λειτουργία здесь не обязательно означает институционально определённое священство.
- issue: Оценка отстранения
  choice: несправедливо отстранять
  alternative: несправедливо, что их отстраняют
  rationale: Инфинитив сохраняет общую нормативную оценку греческого οὐ δικαίως ... ἀποβάλλεσθαι и не утверждает сверх текста, что отстранение уже завершилось.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эпистолярным тоном. Сохранены длинное риторическое построение оригинала и возобновление объекта словами «тех … тех», но причастные цепочки заменены более ясными придаточными конструкциями.
