revisions:
- from: Именно поэтому, получив полное предвидение, они поставили упомянутых выше мужей, а затем установили порядок, чтобы, когда те уснут, их служение приняли другие, испытанные мужи.
  to: По этой причине, получив полное предвидение, они назначили упомянутых ранее мужей, а затем предусмотрели дальнейший порядок, чтобы, если те уснут, другие испытанные мужи приняли их служение.
  rationale: Исправлено условное значение ἐάν, уточнён дополнительный и последующий характер ἐπινομή, а также заменено зависящее от вёрстки «выше» на «ранее». Остальные ключевые формулировки сохранены; образ сна не развёрнут в прямое обозначение смерти.
