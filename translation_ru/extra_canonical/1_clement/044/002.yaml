id: 1CLEM.44.2
reference: 1 Clement 44:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: ru
  text: По этой причине, получив полное предвидение, они назначили упомянутых ранее мужей, а затем предусмотрели дальнейший порядок, чтобы, если те уснут, другие испытанные мужи приняли их служение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόγνωσιν τελείαν
  choice: полное предвидение
  rationale: Сохраняет прямое значение выражения и не уточняет без основания ни источник, ни содержание предвидения.
- source_word: κατέστησαν
  choice: поставили
  rationale: Естественный для контекста назначения на служение глагол, не вводящий позднейшей конфессиональной терминологии.
- source_word: ἐπινομὴν δεδώκασιν
  choice: установили порядок
  rationale: Передаёт мысль о дополнительном распоряжении или предусмотренном порядке преемства; буквальное «дали дополнительное предписание» по-русски звучит тяжеловесно.
- source_word: κοιμηθῶσιν
  choice: уснут
  rationale: Сохраняет греческий эвфемистический образ смерти, не разворачивая его в толкование.
- source_word: δεδοκιμασμένοι ἄνδρες
  choice: испытанные мужи
  rationale: Передаёт значение людей, чья пригодность подтверждена испытанием; «мужи» соответствует достоинству и историческому регистру текста.
- source_word: λειτουργίαν
  choice: служение
  rationale: Контекстуально точное и конфессионально нейтральное обозначение порученного служения.
theological_decisions:
- issue: Характер установленного преемства
  choice: «установили порядок» без уточнения формы или должности
  alternative: «установили закон преемства» / «назначили преемников»
  rationale: Греческий текст говорит о дополнительном предусмотренном порядке, но не определяет здесь его позднейшую институциональную или конфессиональную форму.
- issue: Значение образа сна
  choice: сохранить «уснут»
  alternative: передать прямо как «умрут»
  rationale: Образ смерти как сна присутствует в оригинале и несёт богословский оттенок, который не следует устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным раннехристианским регистром. Синтаксис упрощён ровно настолько, чтобы длинная греческая фраза оставалась ясной, при сохранении последовательности действий и образной речи оригинала.
