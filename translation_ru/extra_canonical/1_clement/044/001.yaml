  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: ru
  text: И наши апостолы узнали через Господа нашего Иисуса Христа, что возникнет распря из-за названия служения надзора.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что возникнет распря по поводу названия служения надзора». Греческое выражение буквально: «о (или: из-за) имени служения надзора»; оно может подразумевать спор о названии, звании или самом служении, традиционно называемом епископским.'
    reason: Сноска сохраняет неоднозначность ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς, не превращая традиционное понимание в единственно возможное и не вводя стилистически неуместное «надзиратель».
lexical_decisions:
- source_word: ἔγνωσαν
  choice: узнали
  rationale: Передаёт аорист глагола γινώσκω естественным русским глаголом, не уточняя способ знания сверх выраженного далее διὰ τοῦ κυρίου.
- source_word: ἔρις
  choice: спор
  rationale: Сохраняет значение распри или разногласия; в данном контексте «спор» звучит естественно и не усиливает текст до открытого мятежа.
- source_word: ἐπὶ τοῦ ὀνόματος
  choice: о наименовании
  rationale: Формально сохраняет упоминание «имени/названия», не подменяя его непосредственно борьбой за должность.
- source_word: τῆς ἐπισκοπῆς
  choice: надзорного служения
  rationale: Передаёт абстрактное существительное ἐπισκοπή как служение надзора, избегая анахроничного сведения к позднейшему титулу или устройству церковной должности.
theological_decisions:
- issue: Значение выражения ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς
  choice: о наименовании надзорного служения
  alternative: из-за звания епископа / по поводу должности надзирателя
  rationale: Греческий текст буквально связывает предстоящую распрю с «именем» ἐπισκοπή. Основной перевод сохраняет эту необычную формулировку и её неоднозначность, а сноска поясняет возможный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Порядок «Господа нашего» сохранён как естественная для религиозного текста формула; терминология не привязана к позднейшей конфессиональной модели церковного управления.
