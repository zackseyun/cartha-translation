source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: ru
  text: 'Блаженны пресвитеры, ушедшие раньше: их уход был своевременным и завершённым, ибо они не боятся, что кто-нибудь сместит их с данного им места.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: ушедшие прежде
  rationale: Причастие буквально обозначает тех, кто отправился в путь раньше; в контексте это деликатное указание на умерших пресвитеров. Формулировка сохраняет образ движения и не добавляет отсутствующего в греческом «нас».
- source_word: πρεσβύτεροι
  choice: пресвитеры
  rationale: В контексте церковного служения термин обозначает признанных служителей общины; «пресвитеры» сохраняет его историко-церковное значение.
- source_word: ἔγκαιρον
  choice: своевременным
  rationale: Передаёт смысл произошедшего в надлежащее, подходящее время.
- source_word: τελείαν
  choice: окончательным
  rationale: В сочетании с эвфемистическим «уходом» выражает завершённость смерти естественнее для современного русского языка, чем буквальное «совершенным».
- source_word: ἀνάλυσιν
  choice: уход
  rationale: Слово означает отбытие или освобождение и здесь эвфемистически указывает на смерть; «уход» сохраняет эту образность.
- source_word: μεταστήσῃ
  choice: сместит
  rationale: Глагол означает удалить или переместить с занимаемого места; «сместит» естественно передаёт контекст лишения служения.
- source_word: δεδομένου αὐτοῖς τόπου
  choice: данного им места
  rationale: δεδομένου — причастие от δίδωμι, «давать», а не термин назначения на должность. Перевод сохраняет лексический сдвиг и неоднозначность слова «место».
theological_decisions:
- issue: Значение «места», данного пресвитерам
  choice: данного им места
  alternative: назначенного им места / должности
  rationale: Греческий текст говорит именно о данном месте и допускает связь как со служением, так и с окончательным уделом умерших; перевод не сводит выражение к одной интерпретации.
- issue: Эвфемистическое описание смерти
  choice: ушедшие прежде; уход
  alternative: умершие прежде; смерть
  rationale: Образ отбытия присутствует и в προοδοιπορήσαντες, и в ἀνάλυσιν; его сохранение передаёт риторику автора без устранения смысловой прозрачности.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Синтаксис сделан ясным, но образ ухода и неоднозначность «данного места» сохранены.
