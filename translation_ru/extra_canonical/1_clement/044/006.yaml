  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: ru
  text: Ибо мы видим, что вы отстранили некоторых, живших достойно, от служения, которое они безупречно чтили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «от служения, безупречно чтимого ими».'
    reason: Сохраняет для читателя пассивную конструкцию ἀμέμπτως αὐτοῖς τετιμημένης и дательный деятеля («ими»).
lexical_decisions:
- source_word: μετηγάγετε
  choice: отстранили
  rationale: Передаёт удаление людей от занимаемого ими служения; в данном контексте естественнее и точнее общего «переместили».
- source_word: καλῶς πολιτευομένους
  choice: живших достойно
  rationale: πολιτεύομαι обозначает образ жизни и поведения; «живших достойно» сохраняет нравственную оценку и звучит естественно по-русски.
- source_word: λειτουργίας
  choice: служения
  rationale: В церковном контексте речь идёт о порученном общественном служении, без неоправданного сужения до позднейшего значения «литургия».
- source_word: ἀμέμπτως αὐτοῖς τετιμημένης
  choice: которое они исполняли безупречно и с честью
  rationale: Фраза буквально допускает понимание «безупречно почитавшегося ими»; по-русски выбранная формулировка естественно выражает, что они достойно относились к своему служению и безупречно его несли, не превращая τετιμημένης в «назначенное».
theological_decisions:
- issue: Характер служения и основание отстранения
  choice: Сохранена общая формулировка «служение», а прежние служители описаны как жившие достойно и исполнявшие его безупречно.
  alternative: Передать λειτουργία как специальный церковный чин или литургическую должность.
  rationale: Греческий текст не уточняет конкретного чина; более узкий термин внёс бы позднейшую конфессиональную специфику.
translation_notes:
  register: Современный литературный русский язык с dignified церковно-историческим тоном; синтаксис упрощён ради ясности, при этом причинная связка γάρ и упрёк адресатам сохранены.
