source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: ru
  text: Ибо немалый грех будет для нас, если мы отстраним тех, кто безупречно и благочестиво приносил дары епископского служения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если мы отстраним от епископского служения тех, кто безупречно и благочестиво приносил дары». Греческое выражение допускает оба понимания.'
    reason: 'Синтаксическая связь родительного τῆς ἐπισκοπῆς неоднозначна: он может относиться к «дарам» либо обозначать служение, от которого отстраняют названных людей.'
lexical_decisions:
- source_word: ἁμαρτία … οὐ μικρά
  choice: немалый грех
  rationale: Сохраняет греческое литотическое выражение и его нравственную серьёзность.
- source_word: ἀποβάλωμεν
  choice: отстраним
  rationale: В данном контексте речь идёт об удалении людей от служения; «отстраним» естественно по-русски и не усиливает значение до изгнания из общины.
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: безупречно и благоговейно
  rationale: Передаёт как отсутствие нареканий, так и религиозно почтительный характер исполнения служения.
- source_word: τὰ δῶρα
  choice: дары
  rationale: Сохраняет буквальный и, возможно, культовый смысл «даров/приношений», не сводя выражение только к обязанностям должности.
- source_word: τῆς ἐπισκοπῆς
  choice: епископского служения
  rationale: Передаёт институциональный оттенок ἐπισκοπή в контексте поставленных служителей, избегая неестественного русского сочетания «дары надзора».
theological_decisions:
- issue: Связь выражения τῆς ἐπισκοπῆς с τὰ δῶρα и смысл служения
  choice: дары епископского служения
  alternative: дары, исполняя служение надзора / дары этого служения
  rationale: 'Греческий родительный допускает неоднозначность: он может характеризовать дары как относящиеся к служению надзора или указывать на дары, приносимые в рамках этого служения. Основной текст сохраняет формальную связь слов, а примечание обозначает альтернативное понимание.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным церковно-историческим звучанием. «Епископское служение» употреблено как понятный эквивалент ἐπισκοπή, без привнесения позднейшей конфессиональной структуры.
