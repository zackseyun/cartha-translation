  text: Many women[a], strengthened through the grace of God, accomplished many courageous deeds.
translation:
  language: ru
  text: Многие женщины, укреплённые Божьей благодатью, совершили много смелых деяний.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужественных поступков». Греческое слово этимологически связано со словом «мужчина», но в данном контексте означает «смелые», «доблестные».'
    reason: Сохраняет возможный риторический оттенок греческого ἀνδρεῖα, не подменяя его основное контекстуальное значение.
lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: укреплённые
  rationale: Страдательное причастие передаёт обретение силы, причём источником этой силы названа Божья благодать.
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  choice: благодатью Бога
  rationale: Творительный падеж естественно передаёт посредство или средство, выраженное διά с родительным.
- source_word: ἐπετέλεσαν πολλὰ ἀνδρεῖα
  choice: совершили немало мужественных поступков
  rationale: ἀνδρεῖα здесь субстантивировано и означает смелые, доблестные деяния; «мужественные поступки» сохраняет основное значение и отчасти этимологическую связь с ἀνήρ, не превращая её в буквальное «мужские».
theological_decisions:
- issue: Источник способности женщин совершать доблестные деяния
  choice: «укреплённые благодатью Бога»
  alternative: «ставшие сильными благодаря Божьей благодати»
  rationale: Выбранная формулировка точно сохраняет страдательную форму и прямо приписывает укрепление Божьей благодати, не уточняя механизм действия.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. «Мужественных» в применении к женщинам воспринимается естественно и одновременно сохраняет лёгкую риторическую игру греческого текста.
