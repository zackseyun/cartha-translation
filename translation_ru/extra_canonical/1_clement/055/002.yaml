  terminology: «Оковы» — естественная современная литературная передача δεσμά в данном контексте и сохраняет конкретный образ цепей/заключения. «Узы» также возможно, но может восприниматься более отвлечённо. Богословски нагруженных добавлений нет; неоднозначность «цены/платы» не снимается сверх текста.
