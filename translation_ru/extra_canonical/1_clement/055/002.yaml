  source_fidelity: 'Смысл передан точно: речь идёт о людях из христианской среды, которые отдали себя в оковы, чтобы выкупить других, либо в рабство и употребили полученную за себя плату на пропитание других. «Выкупить», «рабство», «плата за себя» и «накормили» адекватно отражают λυτρώσωνται, δουλείαν, τὰς τιμὰς αὐτῶν и ἐψώμισαν. Исправление касается только более естественного и согласованного русского оформления первой фразы.'
