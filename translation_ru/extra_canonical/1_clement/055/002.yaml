base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: ru
  text: Мы знаем многих в нашей среде, отдавших себя в оковы, чтобы выкупить других. Многие отдали себя в рабство и, получив плату за себя, накормили других.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: отдал себя в узы
  rationale: Сохраняет образ добровольной отдачи себя в заключение; «узы» передаёт δεσμά буквально и в достойном литературном регистре.
- source_word: λυτρώσωνται
  choice: выкупить
  rationale: Передаёт конкретный смысл освобождения посредством выкупа, не добавляя богословской интерпретации.
- source_word: παρέδωκαν εἰς δουλείαν
  choice: отдали себя в рабство
  rationale: Прямо и естественно передаёт добровольную продажу или передачу себя в состояние рабства.
- source_word: λαβόντες τὰς τιμὰς αὐτῶν
  choice: получив плату за себя
  rationale: Сохраняет конструкцию и возможную широту τιμή как цены или денежной платы, не вводя отсутствующего в греческом указания на того, кто платил.
- source_word: ἐψώμισαν
  choice: накормили
  rationale: Передаёт значение снабжения пищей; контекст указывает, что полученные средства были употреблены для пропитания других.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «узы». Синтаксический параллелизм двух предложений сохранён; неоднозначность выражения τὰς τιμὰς αὐτῶν не разрешена добавлением отсутствующих деталей.
