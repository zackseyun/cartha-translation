source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: ru
  text: Не меньше и Есфирь, совершенная в вере[a], подвергла себя опасности, чтобы спасти от грозившей гибели двенадцать колен Израиля[b]. Постом и смирением[c] она умолила всевидящего Владыку, Бога веков; и Он, увидев смирение её души, спас народ, ради которого она рисковала собой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «совершенная по вере».'
    reason: Сохраняет более формальное соответствие обороту κατὰ πίστιν.
  - marker: b
    text: 'Или: «весь двенадцатиколенный Израиль»; греческое слово представляет двенадцать колен как единое целое.'
    reason: Поясняет коллективное значение субстантивированного δωδεκάφυλον.
  - marker: c
    text: 'Также возможно: «самоумалением» — то есть добровольным смирением себя перед Богом.'
    reason: Уточняет контекстуальный оттенок ταπείνωσις и исключает современное понимание как невольного унижения.
lexical_decisions:
- source_word: τελεία κατὰ πίστιν
  choice: совершенная в вере
  rationale: Передаёт достигнутую духовную зрелость Есфири и звучит естественно по-русски; более буквальное «совершенная по вере» сохранено в примечании.
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  choice: двенадцать колен Израиля
  rationale: Это понятное и принятое русское обозначение совокупного Израиля; коллективный характер греческого существительного пояснён в примечании.
- source_word: τῆς νηστείας καὶ τῆς ταπεινώσεως
  choice: постом и смирением
  rationale: Творительный падеж естественно передаёт средство; «смирение» сохраняет связь с последующим τὸ ταπεινὸν и в данном контексте означает добровольное смирение себя перед Богом.
- source_word: ἠξίωσεν
  choice: умолила
  rationale: В контексте молитвенного поста глагол означает настойчивое прошение, обращённое к Владыке, а не признание Его достойным.
- source_word: παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων
  choice: всевидящего Владыку, Бога веков
  rationale: Сохраняет оба титула и их возвышенный, но понятный современному читателю регистр.
- source_word: κινδύνῳ ἑαυτὴν παρέβαλεν / ἐκινδύνευσεν
  choice: подвергла себя опасности / рисковала собой
  rationale: Передаёт повторяющийся мотив добровольного риска без неестественного лексического повтора в русском тексте.
theological_decisions:
- issue: Характер совершенства Есфири
  choice: совершенная в вере
  alternative: совершенная по вере
  rationale: Фраза оставлена как характеристика Есфири, без уточнения природы или основания её совершенства сверх того, что выражает κατὰ πίστιν.
- issue: Значение ταπείνωσις при посте
  choice: смирение
  alternative: самоумаление
  rationale: Выбор не сводит действие ни к невольному унижению, ни к отдельной аскетической доктрине; контекст указывает на добровольное смирение перед Богом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской интонацией. Синтаксис упрощён лишь настолько, чтобы текст оставался ясным; титулы Бога и смысловые повторы исходника сохранены.
