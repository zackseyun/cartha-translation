source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: ru
  text: Итак, предав себя опасности, она вышла из любви к родине и к народу, находившемуся в осаде, и Господь предал Олоферна в руки женщины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: предав … предал
  rationale: Повтор одного и того же греческого глагола παραδίδωμι сохранён, чтобы передать риторическую связь между самоотдачей женщины и тем, что Господь отдал Олоферна в её власть.
- source_word: ἐν συγκλεισμῷ
  choice: находившемуся в осаде
  rationale: В данном повествовательном контексте выражение обозначает народ, окружённый и стеснённый неприятелем; «в осаде» ясно и естественно передаёт смысл.
- source_word: ἐν χειρὶ θηλείας
  choice: в руки женщины
  rationale: Греческое выражение буквально означает «в руку женщины/лица женского пола». Русское «в руки женщины» сохраняет смысл передачи во власть и звучит естественно.
- source_word: δι’ ἀγάπην
  choice: из любви
  rationale: 'Передаёт причинное значение διά с винительным: её поступок был вызван любовью к родине и народу.'
theological_decisions:
- issue: Божественное действие в передаче Олоферна
  choice: Господь предал Олоферна
  alternative: Господь отдал Олоферна
  rationale: «Предал» сохраняет повтор παραδίδωμι и прямо приписывает исход Господу, не ослабляя богословского утверждения текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Синтаксическая последовательность оригинала и значимый глагольный повтор сохранены без буквального и неестественного выражения «в руку лица женского пола».
