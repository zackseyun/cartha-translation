revisions:
- from: Приведём также примеры из языческих народов. Многие цари и правители, когда наступало какое-либо губительное бедствие, получив указание от оракулов, отдавали себя на смерть, чтобы собственной кровью спасти сограждан. Многие покидали родные города, чтобы распри не продолжались.
  to: Приведём также примеры из языческих народов. Многие цари и правители, когда наступало какое-либо моровое бедствие, получив указание от оракулов, отдавали себя на смерть, чтобы собственной кровью спасти сограждан. Многие покидали свои города, чтобы и дальше не участвовать в распрях.
  rationale: Правка восстанавливает эпидемический оттенок λοιμικός, сохраняет нейтральное сообщение о полученном через оракулы указании и передаёт активный смысл στασιάζωσιν без доктринальных либо исторических добавлений.
