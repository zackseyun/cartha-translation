  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: ru
  text: Приведём также примеры из языческих народов. Многие цари и правители, когда наступало какое-либо моровое бедствие, получив указание от оракулов, отдавали себя на смерть, чтобы собственной кровью спасти сограждан. Многие покидали свои города, чтобы и дальше не участвовать в распрях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείγματα ἐθνῶν
  choice: примеры из языческих народов
  rationale: ἐθνῶν здесь обозначает неиудейские народы; выражение передано ясно и естественно для современного русского читателя.
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: когда наступало какое-либо губительное бедствие
  rationale: λοιμικός может указывать на мор или иное пагубное общественное бедствие; широкая передача сохраняет неопределённость греческого выражения.
- source_word: χρησμοδοτηθέντες
  choice: получив указание от оракулов
  rationale: Причастие означает получение ответа или предписания через оракул; формулировка не уточняет содержания сверх источника.
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: отдавали себя на смерть
  rationale: Сохраняет добровольный характер действия и формальную образность оригинала.
- source_word: ῥύσωνται
  choice: спасти
  rationale: Передаёт избавление граждан от угрожавшего им бедствия без ненужного стилистического усложнения.
- source_word: τοὺς πολίτας
  choice: сограждан
  rationale: Естественный русский эквивалент, подчёркивающий общность города и гражданства.
- source_word: ἐξεχώρησαν ἰδίων πόλεων
  choice: покидали родные города
  rationale: Передаёт удаление из собственных городов; «родные» в данном контексте звучит естественнее буквального «свои».
- source_word: ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον
  choice: чтобы распри не продолжались
  rationale: Форма στασιάζωσιν допускает понимание через продолжение междоусобного конфликта; без явно выраженного подлежащего по-русски естественно использовать безличную конструкцию, не снимая исходной неоднозначности.
theological_decisions:
- issue: Оценка языческих оракулов и добровольной смерти
  choice: Передать сообщение нейтрально как исторические примеры
  alternative: Добавить отрицательную оценку оракулов или представить смерти как религиозно одобряемые жертвы
  rationale: Автор использует эти случаи как нравственные примеры, но данный стих сам по себе не выносит явного богословского суждения об истинности оракулов или спасительной ценности такой смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис слегка упрощён ради ясности, при этом сохранены параллелизм двух примеров и причинно-целевая структура оригинала.
