review_pass:
  verdict: revise
  source_fidelity: Черновик в целом верно передаёт ход мысли и целевую структуру. Однако λοιμικός имеет специальную связь с мором/эпидемией, которую нейтральное «губительное бедствие» утрачивает. В заключении активное στασιάζωσιν означает, что ушедшие не должны были и далее участвовать в распрях (или разжигать их), а не просто то, что распри сами собой не продолжались.
  naturalness: Текст звучит как современный литературный русский. «Моровое бедствие» несколько книжно, но уместно в историческом и раннехристианском контексте и ясно передаёт смысл.
  terminology: «Языческие народы», «оракулы», «сограждане» и «распри» приемлемы. «Свои города» точнее, чем «родные города», поскольку ἴδιος обозначает принадлежность, а не эмоциональную привязанность.
  issues:
  - severity: medium
    issue: Утрачена связь бедствия с мором.
    rationale: λοιμικοῦ ... καιροῦ описывает моровое, эпидемическое бедствие; широкое «губительное бедствие» снимает этот существенный оттенок без текстологической необходимости.
  - severity: medium
    issue: Заключительная цель передана безлично.
    rationale: 'στασιάζωσιν — активная форма: речь о том, чтобы эти люди не продолжали участвовать в распрях/разжигать их. Формула «чтобы распри не продолжались» меняет субъект действия.'
  - severity: low
    issue: «Родные города» добавляет оттенок, отсутствующий в ἰδίων πόλεων.
    rationale: «Свои города» передаёт исходное значение точнее и остаётся естественным по-русски.
  revised_text: Приведём также примеры из языческих народов. Многие цари и правители, когда наступало какое-либо моровое бедствие, получив указание от оракулов, отдавали себя на смерть, чтобы собственной кровью спасти сограждан. Многие покидали свои города, чтобы и дальше не участвовать в распрях.
