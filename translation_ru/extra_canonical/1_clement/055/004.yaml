  text: Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: ru
  text: Блаженная Иудифь, когда город был в осаде, попросила старейшин позволить ей выйти в стан иноплеменников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μακαρία
  choice: Блаженная
  rationale: Передаёт почётную характеристику Иудифи естественным и традиционно понятным русским словом без усиления смысла.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: когда город был в осаде
  rationale: Контекстуально передаёт состояние окружённого и блокированного города; буквальное «в заключении» по-русски было бы неестественно.
- source_word: ᾐτήσατο παρὰ τῶν πρεσβυτέρων
  choice: попросила старейшин
  rationale: Естественная русская передача просьбы, обращённой к старейшинам.
- source_word: ἐαθῆναι αὐτὴν ἐξελθεῖν
  choice: позволить ей выйти
  rationale: Сохраняет значение разрешения и субъект действия, избегая тяжеловесного пассивного оборота.
- source_word: παρεμβολὴν τῶν ἀλλοφύλων
  choice: стан иноплеменников
  rationale: «Стан» уместно передаёт военный лагерь, а «иноплеменники» — людей иного народа в данном повествовательном контексте.
