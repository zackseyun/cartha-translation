source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: ru
  text: Итак, братья, нам правильно и свято стать послушными Богу, а не следовать тем, кто в своей надменности и смуте выступает зачинщиками гнусной зависти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводителями в гнусной зависти».'
    reason: Сохраняет менее вероятное, но возможное понимание ἀρχηγός как предводителя, а не зачинщика того, что выражено родительным падежом.
lexical_decisions:
- source_word: Δίκαιον οὖν καὶ ὅσιον
  choice: Итак, справедливо и свято
  rationale: Сохраняет оба нравственно-религиозных определения и выводный характер οὖν.
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Естественное современное русское обращение; буквальное «мужи-братья» здесь звучало бы архаично и неестественно.
- source_word: ὑπηκόους ... γενέσθαι τῷ θεῷ
  choice: стать послушными Богу
  rationale: Прямо передаёт предикативное ὑπηκόους, инфинитив γενέσθαι и дательный объект повиновения.
- source_word: ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: в своей надменности и стремлении к беспорядку
  rationale: ἀλαζονεία обозначает надменность, а ἀκαταστασία — беспорядок, смуту или мятежность; добавленное «стремлении» делает по-русски ясной характеристику действующих лиц без устранения отрицательной силы выражения.
- source_word: μυσεροῦ ζήλους ἀρχηγοῖς
  choice: зачинщиком гнусной зависти
  rationale: ἀρχηγός с родительным может означать виновника, начинателя или зачинщика явления; ζῆλος в данном конфликтном контексте естественно передаётся как «зависть», а μυσερός — как «гнусная».
theological_decisions:
- issue: Соотношение послушания Богу и следования за возмутителями
  choice: 'Сохранено прямое противопоставление: «стать послушными Богу, а не следовать...»'
  alternative: Ослабить до общего призыва предпочитать Божью волю человеческой
  rationale: Греческое μᾶλλον ... ἢ задаёт явное противопоставление и не уточняет его конфессионально или доктринально.
- issue: Значение ἀρχηγοῖς при родительном μυσεροῦ ζήλους
  choice: «зачинщиком гнусной зависти»
  alternative: «предводителем в гнусной зависти»
  rationale: Основной перевод отражает наиболее вероятное значение автора или инициатора, но в сноске сохранена реальная возможность понять ἀρχηγός как предводителя.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания; синтаксис сделан понятным обычному читателю без церковнославянизмов. Единственное число «зачинщиком» согласуется с конструкцией «за теми, кто ... становится», где относительное «кто» нормативно требует сказуемого в единственном числе.
