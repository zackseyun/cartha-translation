  source_fidelity: 'Основной смысл передан верно: χρηστευσώμεθα — увещевательное «будем добры», а ἑαυτοῖς в данном общинном контексте обоснованно понято взаимно — «друг к другу». Сноска корректно сохраняет формально возможное возвратное понимание. Однако γλυκύτης буквально обозначает «мягкость, приветливость, сердечность»; «кротость» несколько сужает значение и тяготеет к обычному эквиваленту πραΰτης.'
  naturalness: «Будем добры друг к другу» естественно и соответствует современному литературному регистру. Оборот «сообразуясь с состраданием и кротостью» понятен, но менее плавен и не столь ясно выражает, что качества Творца служат образцом. «Следуя примеру» делает эту связь ясной и естественной.
  terminology: '«Сострадание» удачно передаёт εὐσπλαγχνία. Для γλυκύτης предпочтительнее «мягкость», чем «кротость»: этот выбор не приписывает греческому слову более специальное нравственно-религиозное значение. «Тот, Кто сотворил нас» уместно передаёт τοῦ ποιήσαντος ἡμᾶς.'
  issues:
