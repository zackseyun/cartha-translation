  text: χρηστευσώμεθα ἑαυτοῖς κατὰ τὴν εὐσπλαγχνίαν καὶ γλυκύτητα τοῦ ποιήσαντος ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/003.yaml
  text: Let us be kind to one another according to the compassion and gentleness of the One who made us[a].
translation:
  language: ru
  text: Будем добры друг к другу[a], следуя примеру сострадания и мягкости Того, Кто сотворил нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к самим себе».'
    reason: Сохраняет грамматически возможное возвратное прочтение ἑαυτοῖς, хотя взаимное значение лучше соответствует контексту.
lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: будем добры
  rationale: Передаёт увещевательный аорист конъюнктива и значение «проявлять доброту» естественным современным русским языком.
- source_word: ἑαυτοῖς
  choice: друг к другу
  rationale: Множественное возвратное местоимение здесь естественно имеет взаимное значение, соответствующее контексту общинного согласия; буквальная возвратность сохранена в примечании как грамматически возможная.
- source_word: κατὰ
  choice: сообразуясь с
  rationale: Передаёт норму или образец поведения, заданный качествами Творца, без чрезмерно буквального «согласно».
- source_word: εὐσπλαγχνίαν
  choice: состраданием
  rationale: Передаёт сердечное милосердие и глубокое сочувствие, выраженные греческим существительным.
- source_word: γλυκύτητα
  choice: кротостью
  rationale: В данном нравственном контексте обозначает мягкость и незлобивость; «сладость» по-русски звучала бы неестественно и могла бы исказить смысл.
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: Того, Кто сотворил нас
  rationale: Причастная конструкция передана ясным определительным оборотом; прописная буква указывает на Бога-Творца, подразумеваемого контекстом.
theological_decisions:
- issue: Возвратное или взаимное значение ἑαυτοῖς
  choice: друг к другу
  alternative: к самим себе
  rationale: В эллинистическом греческом множественное ἑαυτοῖς нередко имеет взаимное значение. Контекст призыва к общинному согласию поддерживает именно взаимную доброту, однако формальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Увещевательная форма «будем» сохраняет общинный характер призыва; формулировка избегает как архаизмов, так и современной лексики психологической «заботы о себе».
