source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: ru
  text: 'И ещё сказано: «Я видел нечестивца, высоко вознёсшегося и возвышавшегося, словно кедры Ливана. Я прошёл мимо — и вот, его уже не было; я искал его место, но не нашёл. Храни незлобие и держись прямоты, потому что для мирного человека есть остаток».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что у мирного человека есть потомство» или, в контексте псаломного выражения, «есть будущее / последующий удел»; греч. ἐγκατάλειμμα буквально означает «остаток», «то, что остаётся».'
    reason: Сохраняет многозначность ἐγκατάλειμμα и поясняет, почему буквальный «остаток» не следует безоговорочно отождествлять с одним толкованием.
lexical_decisions:
- source_word: ἀσεβῆ
  choice: нечестивого
  rationale: Передаёт религиозно-нравственный смысл слова без сужения до простого «злого».
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: который высоко вознёсся и возвышался
  rationale: Сохраняет усиление и параллелизм двух греческих причастий, оставаясь естественным по-русски.
- source_word: φύλασσε ἀκακίαν
  choice: храни незлобие
  rationale: ἀκακία обозначает отсутствие злобы и нравственную непорочность; «незлобие» сохраняет эту ёмкость и соответствует возвышенному регистру.
- source_word: ἴδε εὐθύτητα
  choice: держись прямоты
  rationale: Буквальное «смотри на прямоту» здесь идиоматически означает внимать ей и следовать ей; выбранная формулировка естественна в русском наставлении.
- source_word: ἐγκατάλειμμα
  choice: будущее
  rationale: В контексте псалма слово указывает на то, что остаётся впереди, на конечный удел; русское «будущее» ясно передаёт смысл, а неоднозначность отмечена в сноске.
- source_word: ἀνθρώπῳ εἰρηνικῷ
  choice: у мирного человека
  rationale: Сохраняет широкий смысл человека, отличающегося миролюбием, без конфессионального уточнения.
theological_decisions:
- issue: Смысл ἐγκατάλειμμα в заключительной строке цитаты
  choice: «есть будущее» с текстологико-смысловой сноской
  alternative: «останется потомство», «есть остаток» или «есть конечный удел»
  rationale: Греческое слово допускает значения оставшегося, потомства или последующего удела. Контекст Пс 36:37 в традиции перевода поддерживает смысл будущности/конечного исхода; сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской цитаты. Синтаксис слегка приподнят, но понятен обычному читателю; сохранены повтор, образ ливанских кедров и резкий переход «и вот».
