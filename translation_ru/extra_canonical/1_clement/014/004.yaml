  source_fidelity: 'Основной смысл передан верно: γῆ — «земля», будущее время сохранено, а ἀπ’ αὐτῆς отражено как удаление «с неё». Однако ἄκακοι точнее обозначает невинных, беззлобных или бесхитростных, чем «непорочных», которое может вызывать оттенок ритуальной либо моральной безупречности.'
  naturalness: Текст в целом звучит естественно и сохраняет краткий афористический строй. «Будут истреблены с неё» допустимо в возвышенно-библейском регистре и верно передаёт сочетание ἐξολεθρευθήσονται ἀπ’ αὐτῆς.
  terminology: «Добрые» является допустимой современной передачей χρηστοί и не навязывает более узкое значение «праведные». «Поступающие беззаконно» удачно сохраняет процессуальный характер παρανομοῦντες. «Невинные» точнее для ἄκακοι.
