source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: ru
  text: 'Ибо написано: «Добрые будут жить на земле[a], и невинные останутся на ней, а поступающие беззаконно будут истреблены с неё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране».'
    reason: Греческое γῆ может обозначать как землю вообще, так и определённую землю или страну.
lexical_decisions:
- source_word: χρηστοί
  choice: добрые
  rationale: Передаёт обычное значение «добрые, достойные» без более узкой богословской конкретизации; в данном изречении слово характеризует нравственно правых людей.
- source_word: οἰκήτορες γῆς
  choice: будут жить на земле
  rationale: Естественно передаёт смысл «будут обитателями земли» и сохраняет будущее время.
- source_word: ἄκακοι
  choice: непорочные
  rationale: Отражает значение невинности и отсутствия зла, сохраняя возвышенный афористический стиль.
- source_word: οἱ παρανομοῦντες
  choice: поступающие беззаконно
  rationale: Передаёт значение действительного причастия — людей, нарушающих закон или поступающих вопреки ему, — не сводя выражение к одному юридическому термину.
- source_word: ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς
  choice: будут истреблены с неё
  rationale: Сохраняет сильное значение полного уничтожения и направление удаления, выраженное предлогом ἀπό.
theological_decisions:
- issue: Объём значения γῆ
  choice: земля
  alternative: страна
  rationale: Греческое γῆ допускает оба прочтения. В основном тексте выбрано более широкое и привычное для изречения «земля», а реальная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и афористическим строем цитаты. Синтаксический параллелизм и противопоставление греческого текста сохранены.
