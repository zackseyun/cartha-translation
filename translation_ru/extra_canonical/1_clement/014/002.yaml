  verdict: revise
  source_fidelity: Перевод в целом точно передаёт противопоставление «необычного вреда» и «великой опасности», безрассудность действия, желания людей, их впадение в распри и раздоры и последующее отдаление адресатов от добра. Проблемное ἔχουσιν перед πίπτουσιν не образует связной конструкции; примечание обоснованно фиксирует это и перевод следует осмысленному πίπτουσιν. Однако «отдадим себя во власть желаний» несколько усиливает образ подчинения и звучит менее естественно, чем прямое «отдадимся желаниям».
