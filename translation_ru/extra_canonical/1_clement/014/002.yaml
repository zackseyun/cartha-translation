source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: ru
  text: Ведь мы навлечём на себя немалый вред — более того, подвергнемся великой опасности, — если безрассудно отдадимся желаниям людей, которые впадают[a] в распри и раздоры, чтобы отдалить нас от добра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном греческом тексте перед πίπτουσιν («впадают») стоит, по-видимому, ошибочно попавшее туда ἔχουσιν («имеют»); перевод следует связному чтению с πίπτουσιν.
    reason: textual_issue
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: немалый вред
  rationale: Идиома οὐ τὴν τυχοῦσαν означает вред не заурядный и не незначительный; «немалый» естественно и точно передаёт смысл.
- source_word: ῥιψοκινδύνως
  choice: безрассудно
  rationale: Наречие обозначает опрометчивое, рискованное действие; здесь речь не просто о смелости, а о безрассудной готовности подвергнуть себя опасности.
- source_word: ἐπιδῶμεν ἑαυτοὺς
  choice: отдадим себя во власть
  rationale: Передаёт добровольное предоставление себя чужому влиянию; оборот естественен по-русски и сохраняет возвратный смысл.
- source_word: θελήμασιν
  choice: желаний
  rationale: Сохраняет прямое значение «желания, волеизъявления», не сужая его до планов или намерений.
- source_word: ἔριν καὶ στάσεις
  choice: распри и раздоры
  rationale: Передаёт сочетание личной вражды и групповых конфликтов без внесения узкого политического или конфессионального оттенка.
- source_word: τοῦ καλοῦ ἔχοντος
  choice: от добра
  rationale: Следует смыслу текста и сохраняет обобщённость субстантивированного выражения, не уточняя его как конкретное учение или нравственный закон.
theological_decisions:
- issue: Цель или результат отдаления от добра
  choice: чтобы отдалить нас от добра
  alternative: так что они отдаляют нас от добра
  rationale: Конструкция εἰς τὸ с инфинитивом допускает оттенок цели или результата. Формулировка с «чтобы» сохраняет целевое звучание исходного текста и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис слегка торжественный, но понятный; сохранены нарастание «вред — более того, опасность» и неоднозначность обобщённого «добра».
