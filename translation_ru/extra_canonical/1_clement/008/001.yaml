  text: The ministers of the grace of God spoke through the Holy Spirit concerning repentance,
translation:
  language: ru
  text: Служители Божьей благодати говорили о покаянии через Святого Духа,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ λειτουργοὶ
  choice: Служители
  rationale: Передаёт лиц, исполняющих священное или общественное служение, без излишне узкого позднейшего значения «литургические служители».
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: Божьей благодати
  rationale: Естественная русская конструкция, сохраняющая зависимость служителей от благодати Бога.
- source_word: διὰ πνεύματος ἁγίου
  choice: через Святого Духа
  rationale: Сохраняет инструментально-посредническое значение διά с родительным падежом.
- source_word: περὶ μετανοίας
  choice: о покаянии
  rationale: Μετάνοια здесь означает покаяние — внутреннее обращение и перемену, а не просто сожаление.
- source_word: ἐλάλησαν
  choice: говорили
  rationale: Точно передаёт аорист глагола λαλέω в данном контексте без необоснованного уточнения способа речи.
theological_decisions:
- issue: Связь выражения «через Святого Духа»
  choice: Отнесено к глаголу «говорили»
  alternative: Отнести к служению благодати или перевести как «в Святом Духе»
  rationale: Порядок и синтаксис греческого текста естественно указывают на Святого Духа как посредника или действующую силу речи.
- issue: Значение «служителей Божьей благодати»
  choice: Сохранён буквальный образ без уточнения конкретной группы
  alternative: «Пророки» или «вестники Божьей благодати»
  rationale: Сам стих не называет этих лиц пророками; конкретизация могла бы преждевременно снять референциальную открытость выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского текста. Синтаксис близок к греческому, но естественен по-русски; терминология не привязана к конфессионально узкому толкованию.
