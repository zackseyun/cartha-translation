source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: ru
  text: '«Покайтесь, дом Израилев, в своих беззакониях. Я сказал сынам Моего народа: „Если грехи ваши будут от земли до неба и если они будут краснее багряницы и чернее вретища, и вы обратитесь ко Мне всем сердцем и скажете: „Отец!“ — Я внемлю вам как святому народу“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε ... ἀπὸ τῆς ἀνομίας ὑμῶν
  choice: Покайся ... в своих беззакониях
  rationale: Передаёт призыв к покаянию и отвращению от беззаконий естественным русским оборотом; множественное «беззакониях» соответствует коллективному обращению и русской норме.
- source_word: οἶκος Ἰσραήλ
  choice: дом Израилев
  rationale: Устоявшееся и понятное библейское обозначение народа Израиля, сохраняющее торжественный регистр.
- source_word: εἶπον
  choice: Я сказал
  rationale: Сохранена прямо выраженная форма прошедшего времени, а не повелительное «скажите».
- source_word: ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ
  choice: будут простираться от земли до неба
  rationale: Глагол «простираться» естественно выражает подразумеваемый пространственный размах, не меняя образа исходного текста.
- source_word: πυρρότεραι κόκκου
  choice: краснее багряницы
  rationale: κόκκος обозначает ярко-красный краситель или окрашенную им ткань; «багряница» сохраняет цветовой образ и библейский регистр.
- source_word: μελανώτεραι σάκκου
  choice: чернее вретища
  rationale: «Вретище» точно передаёт грубую тёмную ткань σάκκος и уместно в торжественной библейской речи.
- source_word: ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας
  choice: обратитесь ко Мне всем сердцем
  rationale: Сохраняет образ обращения к Богу и цельность внутренней преданности.
- source_word: ἐπακούσομαι ὑμῶν
  choice: Я услышу вас
  rationale: Передаёт не простое физическое слышание, а благосклонный ответ на обращение, сохраняя традиционную библейскую формулу.
- source_word: ὡς λαοῦ ἁγίου
  choice: как святой народ
  rationale: Сохраняет сравнительную конструкцию ὡς и не превращает её в более определённое утверждение о статусе адресатов.
theological_decisions:
- issue: Условная связь между тяжестью грехов, обращением и Божьим ответом
  choice: 'Сохранена единая условная конструкция: «Если… если… но… — Я услышу»'
  alternative: Разделить высказывание или усилить уступительность оборотом «даже если»
  rationale: Греческий текст использует повторное ἐὰν и затем καὶ перед обращением; перевод сохраняет условность и риторический контраст, не формулируя дополнительного учения о покаянии.
- issue: Значение ὡς в выражении «как святой народ»
  choice: Сохранено сравнение «как»
  alternative: «Я услышу вас, потому что вы святой народ» или «и вы будете святым народом»
  rationale: Исходный текст не объясняет причинную или временную связь, поэтому неоднозначность не разрешается догматически.
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским звучанием. Формы «дом Израилев», «багряница» и «вретище» сохранены ради узнаваемости образов и достоинства пророческой речи; синтаксис при этом сделан прозрачным для современного читателя.
