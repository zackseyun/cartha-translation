reference: 1 Clement 8:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: ru
  text: 'И Сам Владыка всего также сказал о покаянии с клятвой: «Живу Я, — говорит Господь, — не смерти грешника желаю, а его покаяния», — добавив также благое наставление:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добавив также благое суждение»; «добавив также доброе изречение».'
    reason: Слово γνώμη может означать суждение, мнение, намерение или высказывание. Здесь, поскольку далее следует увещание, основной перевод «наставление» передаёт его контекстуальный смысл, сохраняя альтернативы.
lexical_decisions:
- source_word: δεσπότης τῶν ἁπάντων
  choice: Владыка всего
  rationale: Передаёт верховное владычество и всеохватность выражения естественным, возвышенным русским языком.
- source_word: μετάνοια
  choice: покаяние
  rationale: Стандартный и контекстуально точный термин, включающий перемену образа мыслей и обращение от греха.
- source_word: μετὰ ὅρκου
  choice: подкрепляя Свои слова клятвой
  rationale: Естественно передаёт то, что речь о покаянии была произнесена с клятвенным заверением.
- source_word: οὐ βούλομαι ... ὡς
  choice: не ... желаю, а
  rationale: В данном сопоставлении передаёт предпочтение покаяния смерти, не внося мысли о количественной степени желания.
- source_word: γνώμην ἀγαθήν
  choice: благое изречение
  rationale: В контексте выражение вводит последующее словесное высказывание; «изречение» сохраняет этот смысл лучше, чем «намерение», а «благое» передаёт ἀγαθήν.
theological_decisions:
- issue: Смысл противопоставления смерти грешника и покаяния
  choice: «не смерти грешника желаю, а его покаяния»
  alternative: «не столько смерти грешника желаю, сколько его покаяния»
  rationale: Русская конструкция с «а» естественно выражает предпочтение, соответствующее οὐ ... ὡς, и не создаёт впечатления, будто Господь в некоторой мере желает смерти грешника.
- issue: Референт титула δεσπότης и местоименные прописные буквы
  choice: «Сам Владыка ... Свои»
  alternative: «сам владыка ... свои»
  rationale: Контекст прямо связывает титул с Господом в цитате; традиционная русская прописная буква поддерживает достойный регистр, не добавляя отдельного догматического утверждения.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис слегка сглажен для ясности, при этом сохранены клятвенная формула, прямая речь и двоеточие, указывающее на продолжение в следующем стихе.
