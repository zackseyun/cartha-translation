source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: ru
  text: Итак, желая, чтобы все Его возлюбленные приобщились к покаянию, Он утвердил это[a] Своей всевластной волей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте дополнение к слову «утвердил» не названо; речь может идти о покаянии или о предшествующем обещании о нём.
    reason: Сохраняет неоднозначность подразумеваемого объекта глагола ἐστήριξεν.
lexical_decisions:
- source_word: μετανοίας μετασχεῖν
  choice: приобщились к покаянию
  rationale: Передаёт значение «стать причастными покаянию, получить в нём долю» естественным современным русским языком, не сводя выражение лишь к однократному действию «покаяться».
- source_word: ἐστήριξεν
  choice: утвердил
  rationale: Глагол означает «сделать твёрдым, утвердить, подтвердить»; в данном контексте «утвердил» сохраняет как установительный, так и подтверждающий оттенок.
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: Своей всевластной волей
  rationale: «Всевластной» передаёт редкое прилагательное παντοκρατορικός, связанное с неограниченной властью, а «волей» естественно выражает βούλημα.
theological_decisions:
- issue: Не названное в греческом тексте дополнение при ἐστήριξεν
  choice: «это» с пояснительной сноской
  alternative: Явно назвать «покаяние» либо «обещание покаяния»
  rationale: В оригинале объект глагола подразумевается и может относиться к покаянию или к предшествующему Божьему возвещению о нём; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозной издательской нормой.
