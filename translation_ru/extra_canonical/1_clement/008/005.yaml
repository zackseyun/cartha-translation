  source_fidelity: Перевод точно передаёт причастную конструкцию βουλόμενος («желая»), всеобщность πάντας, субстантивированное τοὺς ἀγαπητούς («Его возлюбленные») и значение μετανοίας μετασχεῖν как участия/приобщения к покаянию. «Утвердил это» — допустимая передача ἐστήριξεν; эксплицитное русское «это» не снимает подразумеваемой в оригинале отсылки благодаря сноске. «Своей всевластной волей» адекватно передаёт τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
