  terminology: «Покаяние» последовательно передаёт μετάνοια. «Всевластной» удачно выражает оттенок παντοκρατορικός, не подменяя βούλημα более узким «решением». Написание местоимений с прописной буквы соответствует заявленной религиозно-издательской норме.
