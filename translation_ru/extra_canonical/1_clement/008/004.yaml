source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
translation:
  language: ru
  text: 'И в другом месте Он говорит так: «Омойтесь и станьте чисты; удалите от Моих глаз злые дела из ваших душ. Перестаньте творить зло, научитесь делать добро, ищите правосудия, спасайте того, с кем поступают несправедливо, вершите суд в пользу сироты и оправдайте вдову. Придите же, и рассудим вместе, — говорит Господь. — Хотя бы ваши грехи были багряны, Я сделаю их белыми, как снег; хотя бы они были алы, Я сделаю их белыми, как шерсть. Если захотите и послушаетесь Меня, будете есть блага земли; если же не захотите и не послушаетесь Меня, меч пожрёт вас, ибо уста Господа изрекли это».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν
  choice: удалите зло из ваших душ
  rationale: Передаёт как объект «зло/злые дела», так и прямо выраженное в греческом тексте «из ваших душ», не опуская эту фразу.
- source_word: ἐκζητήσατε κρίσιν
  choice: ищите справедливости
  rationale: В данном ряду общественно-нравственных повелений κρίσις означает правосудие и справедливое решение, а не просто отвлечённое «суждение».
- source_word: ῥύσασθε ἀδικούμενον
  choice: избавляйте угнетённого
  rationale: Причастие обозначает человека, с которым поступают несправедливо; «угнетённого» естественно передаёт это в контексте защиты слабых.
- source_word: κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν
  choice: защищайте права сироты и вступайтесь за вдову
  rationale: 'Функционально передаёт судебно-правовой смысл: вынести справедливое решение в пользу сироты и добиться оправдания или защиты вдовы.'
- source_word: διελεγχθῶμεν
  choice: рассудим вместе
  rationale: Сохраняет взаимную форму и допускает оттенок совместного разбора дела, не сводя выражение ни к спору, ни к примирению.
- source_word: φοινικοῦν … κόκκινον
  choice: багряны … алы
  rationale: Сохраняет два близких, но различимых красных оттенка исходного текста и поэтический параллелизм.
- source_word: μάχαιρα ὑμᾶς κατέδεται
  choice: меч пожрёт вас
  rationale: Сохраняет сильную персонифицированную метафору греческого текста.
theological_decisions:
- issue: Соотношение человеческого послушания, очищения и Божьего действия
  choice: Сохранены повеления о покаянии и условные обещание и угроза без богословского пояснения причинной связи.
  alternative: Истолковать очищение как исключительно человеческое нравственное исправление либо как исключительно Божье действие.
  rationale: Цитата намеренно удерживает рядом призыв к действию, Божье обещание убелить грехи и условие послушания; перевод не должен устранять это напряжение.
- issue: Кто говорит в вводной формуле
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы или явное «Бог»
  rationale: Дальнейшая формула «говорит Господь» ясно указывает на Бога; местоимение сохраняет форму исходного текста, а прописная буква соответствует русской религиозной издательской норме без добавления имени в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксис сделан ясным для чтения вслух; сохранены параллелизм, императивы, образное «убеление» грехов и резкая метафора меча. Архаизмы ограничены устойчивыми возвышенными формулами «уста Господа изрекли».
