review_pass:
  verdict: revise
  source_fidelity: 'Требуется поправить начальное повеление: в греческом «пред Моими глазами» относится к удалению злых дел, а не к обстоятельствам удаления «из душ». Также καὶ δεῦτε означает «придите же», а не «тогда придите». В судебных повелениях желательно яснее сохранить юридические глаголы κρίνατε и δικαιώσατε.'
  naturalness: Текст в целом литературен и хорошо передаёт пророческий регистр. Уточнённая формулировка делает первый образ понятнее по-русски без утраты обоих исходных дополнений.
  terminology: «Правосудие» точнее передаёт κρίσις в данном ряду. «Вершите суд в пользу сироты» и «оправдайте вдову» сохраняют судебно-правовую лексику греческого текста, не внося конкретной конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Синтаксическая связь «пред Моими глазами»
    rationale: Фраза «удалите зло из ваших душ пред Моими глазами» по-русски прежде всего означает, что удаление совершается на глазах у Бога. В греческом ἀπέναντι τῶν ὀφθαλμῶν μου естественно характеризует устранение зла «от Моих глаз»; при этом ἀπὸ τῶν ψυχῶν ὑμῶν также должно быть сохранено.
  - severity: medium
    issue: Добавлено временное значение «Тогда»
    rationale: καὶ δεῦτε — призыв «и/итак, придите же»; временной вывод «тогда» в исходном тексте не выражен.
  - severity: low
    issue: Судебные повеления переданы несколько расширительно
    rationale: «Защищайте права сироты и вступайтесь за вдову» передаёт общий смысл, но κρίνετε и δικαιώσατε непосредственно имеют судебную окраску; её можно сохранить яснее.
