id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: ru
  text: 'Поэтому праведность и мир далеко отступили: каждый оставил страх Божий и стал близорук в вере в Него[a], не следовал установлениям Его заповедей и не вёл себя так, как подобает Христу, но шёл за желаниями своего злого сердца, восприняв неправедную и нечестивую ревность[b], через которую и вошла смерть в мир.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал близорук в Его вере (верности)».'
    reason: Греческое ἐν τῇ πίστει αὐτοῦ допускает понимание αὐτοῦ как указания либо на объект веры, либо на её обладателя.
  - marker: b
    text: 'Или: «неправедной и нечестивой зависти».'
    reason: Греческое ζῆλος может обозначать как ревность, так и зависть; отрицательные определения указывают здесь на пагубное чувство.
lexical_decisions:
- source_word: πόρρω ἀπέστη
  choice: далеко отступили
  rationale: Сохраняет пространственный образ удаления и естественно согласуется в русском с двумя подлежащими — «праведность и мир».
- source_word: ἀμβλυωπῆσαι
  choice: стал близорук
  rationale: Глагол буквально обозначает ослабление зрения, близорукость; образ сохранён, а не заменён общим «ослабел».
- source_word: τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ
  choice: согласно установлениям Его заповедей
  rationale: Субстантивированное νόμιμα передаёт установленные нормы или предписания; «установления» сохраняет формально-нормативный оттенок.
- source_word: πολιτεύεσθαι
  choice: жил
  rationale: В данном этическом контексте означает вести себя, жить определённым образом; буквальное политическое значение здесь вводило бы в заблуждение.
- source_word: κατὰ τὸ καλῆκον τῷ Χριστῷ
  choice: так, как подобает Христу
  rationale: Текст, по-видимому, отражает καθῆκον («подобающее»); перевод сохраняет направленность нормы на Христа без конфессионального расширения.
- source_word: ζῆλον ἄδικον καὶ ἀσεβῆ
  choice: неправедной и нечестивой зависти
  rationale: В отрицательном контексте ζῆλος означает ревнивую зависть или пагубную ревность; «зависть» естественно связывает фразу с мотивом вхождения смерти в мир.
- source_word: ἀνειληφότας
  choice: предавшись
  rationale: Передаёт принятие и усвоение пагубной зависти естественным русским оборотом, не ослабляя волевой оттенок.
theological_decisions:
- issue: Значение ἐν τῇ πίστει αὐτοῦ
  choice: в вере в Него
  alternative: в Его вере / верности
  rationale: Единственное αὐτοῦ допускает объективное понимание — вера, направленная к Богу, — и такое прочтение естественно продолжает «страх Божий». Возможная притяжательная трактовка сохранена в примечании.
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В контексте Первого послания Климента Χριστός выступает как устоявшееся обозначение Иисуса; «Христос» сохраняет регистр и не добавляет пояснительной интерпретации.
- issue: Отсылка δι’ οὗ
  choice: через которую
  alternative: из-за неё
  rationale: Относительное местоимение мужского рода в греческом непосредственно относится к ζῆλος; русское согласование с выбранным словом «зависть» требует женского рода. Формула сохраняет причинно-инструментальную неоднозначность предлога διά.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены библейские образы «страха Божия», хождения, злого сердца и вхождения смерти в мир; громоздкая греческая конструкция разделена двоеточием и однородными сказуемыми ради ясности.
