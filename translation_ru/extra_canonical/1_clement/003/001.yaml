revisions:
- from: 'Всякая слава и изобилие были даны вам, и исполнилось написанное: «Он ел и пил, раздался и растолстел, и возлюбленный стал брыкаться».[a]'
  to: 'Вся слава и изобилие были даны вам, и исполнилось написанное: «Он ел и пил, раздался и растолстел, и возлюбленный взбрыкнул».[a]'
  rationale: Изменены только два места, где русская формулировка неточно передавала соответственно значение Πᾶσα и видовую силу ἀπελάκτισεν. Остальная образность, параллелизм и неуточнённость обозначения «возлюбленный» сохранены.
