source:
  edition: Funk 1901 (normalized OCR)
  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: ru
  text: 'Вся слава и изобилие были даны вам, и исполнилось написанное: «Он ел и пил, раздался и растолстел, и возлюбленный взбрыкнул».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возлюбленный лягнул».'
    reason: Глагол может обозначать удар ногой; в данном образном контексте он также вызывает представление о строптивом, своевольном животном.
lexical_decisions:
- source_word: πλατυσμός
  choice: изобилие
  rationale: В данном контексте слово обозначает простор, довольство и благополучие; «изобилие» естественно передаёт смысл по-русски, не сужая его до телесной полноты.
- source_word: ἐπλατύνθη
  choice: раздался
  rationale: Глагол буквально указывает на расширение; разговорно понятное, но литературно допустимое «раздался» сохраняет телесный образ откормленного существа и отличается от следующего «растолстел».
- source_word: ἐπαχύνθη
  choice: растолстел
  rationale: Передаёт увеличение тучности и последовательное развитие образа пресыщения.
- source_word: ἀπελάκτισεν
  choice: стал брыкаться
  rationale: Сохраняет образ строптивого откормленного животного и подразумеваемого мятежа, избегая неясного буквального «лягнул» без объекта.
- source_word: ὁ ἠγαπημένος
  choice: возлюбленный
  rationale: 'Формально сохраняет субстантивированное определение и его богословски значимое напряжение: тот, кто был любим, восстал.'
theological_decisions:
- issue: Образ отпадения после благополучия
  choice: сохранить метафору брыкающегося животного
  alternative: 'передать истолковательно: «возлюбленный взбунтовался»'
  rationale: Греческий текст цитирует Писание через конкретный телесный образ; прямое объяснение устранило бы образность и часть смыслового напряжения.
translation_notes:
  register: Современный литературный русский с сохранением ритма и параллелизма древней цитаты. «Раздался» и «стал брыкаться» делают животный образ ясным обычному читателю, не заменяя его отвлечённым толкованием.
