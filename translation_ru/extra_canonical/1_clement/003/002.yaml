base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/002.yaml
  text: From this came jealousy and envy, strife and faction, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became shortsighted in faith in him, neither walking in the lawful ways of his commandments nor conducting himself in a manner fitting for the Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy, through which death also entered into the world.
translation:
  language: ru
  text: Отсюда возникли ревность и зависть, раздор и раскол, гонение и беспорядок, война и плен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος καὶ φθόνος
  choice: ревность и зависть
  rationale: Сохранено различие между ревностным соперничеством и завистью; в данном отрицательном контексте «ревность» означает недоброжелательное соперничество.
- source_word: ἔρις καὶ στάσις
  choice: раздор и мятеж
  rationale: «Раздор» естественно передаёт межличностную и общинную распрю, а «мятеж» — организованное противостояние или восстание.
- source_word: διωγμὸς καὶ ἀκαταστασία
  choice: гонение и смута
  rationale: «Гонение» точно передаёт преследование, а «смута» — состояние беспорядка и нестабильности.
- source_word: πόλεμος καὶ αἰχμαλωσία
  choice: война и плен
  rationale: Сохранена краткая и нарастающая последовательность бедствий исходного текста.
- source_word: Ἐκ τούτου
  choice: Отсюда возникли
  rationale: Глагол добавлен по-русски для естественности эллиптической греческой конструкции и для ясной причинной связи с предыдущим стихом.
