  text: οὕτως ἐπηγέρθησαν οἱ ἄτιμοι ἐπὶ τοὺς ἐντίμους, οἱ ἄδοξοι ἐπὶ τοὺς ἐνδόξους, οἱ ἄφρονες ἐπὶ τοὺς φρονίμους, οἱ νέοι ἐπὶ τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: ru
  text: Так лишённые почёта восстали против почтенных, бесславные — против славных, неразумные — против благоразумных, молодые — против старших.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτιμοι / ἐντίμους
  choice: бесчестные / почтенных
  rationale: Передаёт прямое противопоставление людей, лишённых чести, тем, кто пользуется почётом; сохраняет повтор корня, насколько это естественно по-русски.
- source_word: ἄδοξοι / ἐνδόξους
  choice: бесславные / славных
  rationale: Сохраняет симметричную антитезу греческих однокоренных слов и их отличие от пары, связанной с честью и почётом.
- source_word: ἄφρονες / φρονίμους
  choice: неразумные / благоразумных
  rationale: Передаёт противопоставление недостатка здравого разумения рассудительности без излишне конфессиональной окраски.
- source_word: νέοι / πρεσβυτέρους
  choice: молодые / старших
  rationale: В данном ряду речь естественно понимается как возрастное и общественное противопоставление; «старших» сохраняет возможный оттенок старшинства, не сводя слово непременно к церковной должности.
- source_word: ἐπηγέρθησαν ἐπί
  choice: восстали против
  rationale: Точно и естественно передаёт враждебное выступление одной группы против другой.
theological_decisions:
- issue: Значение πρεσβυτέρους
  choice: старших
  alternative: пресвитеров; старейшин
  rationale: Греческое слово допускает должностной оттенок, но непосредственная пара с νέοι прежде всего указывает на возраст и старшинство. Перевод «старших» сохраняет эту широту и не навязывает экклезиологическое прочтение.
translation_notes:
  register: Современный литературный русский язык с торжественной ритмикой. Параллелизм и четыре последовательные антитезы оригинала сохранены; тире во второй–четвёртой парах устраняет тяжеловесное повторение сказуемого.
