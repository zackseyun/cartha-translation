  source_fidelity: 'Перевод точно передаёт ключевые элементы греческого текста: ἱκανός как «способен», условно-исключительную конструкцию с καταξιώσῃ как «кого Бог сочтёт достойными», увещательные формы δεηθῶμεν καὶ αἰτώμεθα, а также итоговую цель — быть найденными/оказаться «в любви», без человеческого пристрастия и безупречными. Повтор «оказаться» удачно сохраняет связь с двумя формами εὑρίσκω, не внося в текст лишнего толкования.'
