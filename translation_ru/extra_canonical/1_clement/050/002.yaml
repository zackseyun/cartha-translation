id: 1CLEM.50.2
reference: 1 Clement 50:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: ru
  text: Кто способен оказаться в ней, кроме тех, кого Бог сочтёт достойными? Поэтому будем молиться и просить у Него милости, чтобы нам оказаться в любви, без человеческого пристрастия, безупречными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: способен
  rationale: Передаёт способность или достаточность человека соответствовать любви, не усиливая смысл до нравственного достоинства.
- source_word: καταξιώσῃ
  choice: сочтёт достойными
  rationale: Сохраняет значение признания или удостоения Богом; сослагательный оттенок ἄν естественно выражен русским будущим в конструкции исключения.
- source_word: δεηθῶμεν καὶ αἰτώμεθα
  choice: будем молиться и просить
  rationale: Различает молитвенное обращение и просьбу, сохраняя увещательное значение форм первого лица множественного числа.
- source_word: ἀπὸ τοῦ ἐλέους αὐτοῦ
  choice: просить у Него милости
  rationale: Естественная русская конструкция передаёт обращение к Божьему милосердию как источнику просимого, без буквальной тяжеловесности «просить от Его милости».
- source_word: δίχα προσκλίσεως ἀνθρωπίνης
  choice: без человеческого пристрастия
  rationale: πρόσκλισις обозначает склонение в чью-либо сторону, предпочтение или пристрастность; выбранный вариант понятен современному читателю и сохраняет отрицательную нравственную окраску.
- source_word: ἄμωμοι
  choice: безупречными
  rationale: Передаёт предикативное множественное число и смысл отсутствия порока или основания для упрёка.
theological_decisions:
- issue: Соотношение человеческой способности и Божьего удостоения
  choice: 'Сохранён вопрос: «Кто способен… кроме тех, кого Бог сочтёт достойными?»'
  alternative: «Кто достоин… кроме тех, кого Бог удостоит?»
  rationale: 'Не следует сливать ἱκανός и καταξιόω в одно понятие достоинства: текст одновременно говорит о человеческой достаточности и Божьем признании достойными, сохраняя богословское напряжение.'
- issue: Значение «оказаться в любви»
  choice: Сохранена формулировка «оказаться в любви»
  alternative: «пребывать в любви»
  rationale: εὑρεθῶμεν буквально означает «быть найденными / оказаться»; перевод «пребывать» сделал бы состояние более статичным и устранил бы перекличку с εὑρεθῆναι в первом предложении.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «оказаться» намеренно сохраняет лексическую связь двух форм εὑρίσκω; местоимение «Него» делает конструкцию с ἔλεος естественной по-русски.
