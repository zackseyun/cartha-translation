source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: ru
  text: 'Ибо написано: «Войдите в свои комнаты совсем ненадолго, пока не пройдут Мой гнев и Моя ярость; и Я вспомню добрый день и подниму вас из ваших гробниц».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: комнаты
  rationale: Обозначает закрытые внутренние помещения; нейтральное «комнаты» прямо передаёт смысл, не добавляя отсутствующего в тексте уточнения «внутренние».
- source_word: μικρὸν ὅσον ὅσον
  choice: совсем ненадолго
  rationale: Усиленное выражение передаёт очень краткий промежуток времени; выбран естественный современный русский оборот.
- source_word: ὀργὴ καὶ ὁ θυμός
  choice: гнев и негодование
  rationale: Сохраняются два близких, но отдельных обозначения сильного гнева без искусственного сведения их к одному понятию.
- source_word: ἀναστήσω
  choice: подниму
  rationale: Глагол означает «поднять, поставить» и в связи с гробницами несёт смысл воскрешения; буквальное «подниму» сохраняет эту образность.
- source_word: θηκῶν
  choice: гробниц
  rationale: В данном контексте слово обозначает места погребения; «гробницы» ясно передаёт смысл и соответствует образу выхода умерших.
theological_decisions:
- issue: Значение ἀναστήσω в контексте гробниц
  choice: подниму вас из ваших гробниц
  alternative: воскрешу вас из ваших гробниц
  rationale: «Подниму» сохраняет буквальный образ исходного глагола и одновременно допускает очевидный контекстуальный смысл воскресения, не заменяя образ богословским термином.
- issue: Необычное выражение «вспомню благой день»
  choice: сохранить буквально
  alternative: вспомню о благоприятном дне / назначу благой день
  rationale: Греческий текст имеет μνησθήσομαι ἡμέρας ἀγαθῆς; буквальная передача сохраняет его неоднозначность и не уточняет, что именно означает этот день.
translation_notes:
  register: Современный литературный русский язык с достоинством письменной цитаты; синтаксический параллелизм оригинала сохранён, архаизмы и конфессионально маркированные формулы не вводятся.
