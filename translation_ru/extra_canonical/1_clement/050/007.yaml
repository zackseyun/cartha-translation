id: 1CLEM.50.7
reference: 1 Clement 50:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: Это блаженство[a] пришло к тем, кого Бог избрал через Иисуса Мессию, нашего Господа, Которому слава во веки веков. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это благословение».'
    reason: μακαρισμός может обозначать как блаженство или счастливый удел, так и благословение либо провозглашение кого-либо блаженным.
lexical_decisions:
- source_word: μακαρισμός
  choice: блаженство
  rationale: Существительное обозначает состояние или удел того, кто назван блаженным; «блаженство» точнее сохраняет его значение, чем более широкое «благословение».
- source_word: ἐκλελεγμένους
  choice: тех, кого Бог избрал
  rationale: Описательная конструкция естественно передаёт субстантивированное причастие совершенного вида и сохраняет Бога как действующее лицо.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: «Через» передаёт διά с родительным падежом как посредство; Χριστός передано смысловым титулом «Мессия», а не транслитерацией «Христос».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшееся и понятное русское соответствие торжественной греческой формуле вечности.
theological_decisions:
- issue: К кому относится местоимение ᾧ в славословии
  choice: «Которому» отнесено к Иисусу Мессии, нашему Господу
  alternative: Отнести славу к Богу
  rationale: Ближайший грамматический антецедент в дательном значении — Иисус Мессия, тогда как «Бог» стоит в родительном падеже; перевод следует наиболее прямой синтаксической связи, не перестраивая славословие.
translation_notes:
  register: Современный литературный русский с сохранением торжественного характера заключительного славословия. Формулировка остаётся ясной для широкого читателя и близкой к греческому синтаксису.
