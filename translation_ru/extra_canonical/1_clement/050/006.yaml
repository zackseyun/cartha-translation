reference: 1 Clement 50:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: ru
  text: 'Ведь написано[a]: «Блаженны те, чьи беззакония прощены и чьи грехи покрыты; блажен человек, которому Господь ни в коем случае не вменит греха и в чьих устах нет лукавства».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чьи беззакония были прощены и чьи грехи были покрыты».'
    reason: Греческие аористы допускают передачу формами прошедшего времени, хотя в изречении-блаженстве они, вероятно, описывают общее состояние.
lexical_decisions:
- source_word: ἀνομίαι
  choice: беззакония
  rationale: Передаёт множественное число и смысл поступков, нарушающих Божий закон, без ослабления до общего понятия проступков.
- source_word: ἀφέθησαν
  choice: прощены
  rationale: Краткая страдательная форма естественно выражает по-русски достигнутое и сохраняющееся состояние, подходящее для изречения-блаженства.
- source_word: ἐπεκαλύφθησαν
  choice: покрыты
  rationale: Сохраняет образ исходного текста и параллелизм с «прощены».
- source_word: λογίσηται
  choice: вменит
  rationale: Точно передаёт идею занесения греха на счёт человека; глагол понятен в данном библейском контексте.
- source_word: δόλος
  choice: лукавство
  rationale: Передаёт обман, коварство и неискренность, сохраняя нравственную ёмкость греческого слова.
theological_decisions:
- issue: Временной и видовой смысл аористов ἀφέθησαν и ἐπεκαλύφθησαν
  choice: «прощены… покрыты» как описание наличного состояния
  alternative: «были прощены… были покрыты» как указание на прошлое событие
  rationale: В контексте блаженства аористы характеризуют общий класс людей и результат прощения, а не обязательно одно ограниченное прошлое событие; краткие причастия сохраняют эту широту.
- issue: Усиленное отрицание οὐ μή при λογίσηται
  choice: «ни в коем случае не вменит»
  alternative: «не вменит»
  rationale: Перевод явно сохраняет эмфатическую силу греческого двойного отрицания, не превращая утверждение в конфессионально обусловленное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм, образ «покрытых» грехов и формула «в чьих устах»; архаические синтаксические обороты по возможности устранены.
