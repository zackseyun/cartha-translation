  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: ru
  text: Все поколения от Адама до нынешнего дня миновали, но достигшие совершенства в любви по благодати Бога имеют своё место среди благочестивых, которые будут явлены при посещении[a] царства Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время посещения»; греческое слово может обозначать посещение или надзор. Смысл связи этого «посещения» с царством Мессии в оригинале выражен кратко и допускает разные понимания.'
    reason: Уточняет действительный смысловой диапазон ἐπισκοπή и сохраняет неясность генитивной связи τῆς βασιλείας, не подменяя её толковательным вариантом «явление».
lexical_decisions:
- source_word: παρῆλθον
  choice: минули
  rationale: Передаёт завершённое прохождение прежних поколений естественным и достойным современным русским языком.
- source_word: οἱ ἐν ἀγάπῃ τελειωθέντες
  choice: достигшие совершенства в любви
  rationale: Сохраняет идею доведения до полноты или совершенства, выраженную пассивным причастием τελειωθέντες, без неестественной русской конструкции «усовершенные».
- source_word: χῶρον εὐσεβῶν
  choice: место среди благочестивых
  rationale: Передаёт принадлежность к уделу или сообществу благочестивых; «имеют своё место» звучит по-русски естественнее буквального «имеют место», которое может означать просто существование.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт титул Χριστός его смысловым русским соответствием и не превращает его здесь в личное имя.
- source_word: ἐπισκοπῇ
  choice: посещении
  rationale: Сохраняет традиционный библейский смысл Божьего посещения, не сводя многозначное слово только к пришествию, надзору или суду.
theological_decisions:
- issue: К кому относится относительное местоимение οἳ («которые»)?
  choice: 'Сохранена относительная конструкция: «среди благочестивых, которые будут явлены»'
  alternative: «и они будут явлены», с однозначным отнесением к достигшим совершенства в любви
  rationale: Греческое οἳ грамматически следует за εὐσεβῶν, но по смыслу может охватывать ранее названных достигших совершенства. Русская относительная конструкция сохраняет эту связь и не устраняет возможную смысловую широту.
- issue: Значение выражения ἐν τῇ ἐπισκοπῇ τῆς βασιλείας
  choice: «при посещении царства Мессии»
  alternative: «когда явится царство Мессии» или «при пришествии царства Мессии»
  rationale: Более толковательные варианты сделали бы выражение яснее, но сузили бы многозначность ἐπισκοπή и разрешили бы необычную генитивную связь без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, раннехристианскому тексту соответствующим звучанием. Избегаются как архаизмы («доныне», «уготован»), так и разговорные обороты. Синтаксическая и богословская неоднозначность относительного местоимения сохранена.
