id: 1CLEM.50.5
reference: 1 Clement 50:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: ru
  text: Блаженны мы, возлюбленные, если исполняем Божьи повеления в единодушии любви, чтобы через любовь нам были прощены грехи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: блаженны
  rationale: Сохраняет форму и религиозно-нравственный оттенок греческого слова, оставаясь понятным в современном русском.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Традиционное и достойное обращение, точно передающее общинный оттенок слова.
- source_word: τὰ προστάγματα
  choice: повеления
  rationale: Передаёт обязательный характер установлений Бога естественнее, чем узко юридические варианты.
- source_word: ἐποιούμεν
  choice: исполняем
  rationale: Для повелений по-русски естественно «исполнять»; несовершенный вид соответствует форме греческого имперфекта и не утверждает завершённости действия.
- source_word: ἐν ὁμονοίᾳ ἀγάπης
  choice: в единодушии любви
  rationale: ὁμόνοια обозначает согласие и единство мыслей, особенно важные в контексте 1 Климента; «единодушие» сохраняет этот смысл и звучит естественно, не смешивая слово с ἁρμονία.
- source_word: δι’ ἀγάπης
  choice: через любовь
  rationale: Сохраняет инструментально-посредническую формулировку оригинала, не уточняя её богословский механизм.
- source_word: τὰς ἁμαρτίας
  choice: грехи
  rationale: Прямой и общепринятый эквивалент; определённость по-русски выражается контекстом.
theological_decisions:
- issue: Связь исполнения повелений, любви и прощения грехов
  choice: 'Сохранена конструкция цели/результата: «чтобы через любовь нам были прощены грехи»'
  alternative: Переформулировать как прямое условие или основание прощения
  rationale: Греческое εἰς τὸ с инфинитивом допускает целевой или результативный оттенок. Перевод не превращает любовь в однозначно определённую юридическую заслугу и сохраняет напряжение исходной формулировки.
- issue: Условность высказывания
  choice: «если исполняем»
  alternative: «если будем исполнять» или «если бы исполняли»
  rationale: Греческое εἰ с имперфектом здесь не требует непременно контрфактического русского сослагательного наклонения; нейтральное настоящее сохраняет условность без лишнего толкования.
translation_notes:
  register: Современный литературный русский с умеренно церковным достоинством. «Единодушие» выбрано вместо менее естественных «согласия любви» и «гармонии любви», чтобы передать характерное для 1 Климента понятие ὁμόνοια и отличить его от ἁρμονία.
