  text: Ὁρᾶτε, ἀγαπητοί, πῶς μέγα καὶ θαυμαστόν ἐστιν ἡ ἀγάπη, καὶ τῆς τελειότητος αὐτῆς οὐκ ἔστιν ἐξήγησις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/001.yaml
  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: ru
  text: Посмотрите, возлюбленные, как велика и удивительна любовь, а совершенство её не поддаётся описанию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и нет описания её совершенства».'
    reason: Указывает на более буквальное построение греческой фразы и сохраняет оттенок существительного ἐξήγησις — «изложение, описание».
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Посмотрите
  rationale: Повелительная форма передана естественным русским призывом обратить внимание; это сохраняет прямое обращение к читателям.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Традиционное, но понятное обращение точно передаёт значение «любимые, дорогие» и соответствует возвышенному регистру раннехристианского текста.
- source_word: μέγα καὶ θαυμαστόν
  choice: велика и удивительна
  rationale: Сохраняются оба определения любви без усиления или ослабления исходного выражения.
- source_word: ἐξήγησις
  choice: описание
  rationale: Здесь слово обозначает словесное изложение или описание, а не объяснение причин; оборот «не поддаётся описанию» естественно выражает невозможность адекватно передать совершенство любви словами.
theological_decisions:
- issue: Характер совершенства любви
  choice: «совершенство её не поддаётся описанию»
  alternative: «нет описания её совершенства»
  rationale: Перевод сохраняет мысль о невыразимости совершенства любви и не добавляет утверждения о её непостижимости или отсутствии логического объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Слово «возлюбленные» сохранено как уместное традиционное обращение; остальная фраза построена естественно и доступно.
