  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: ru
  text: Небеса возвещают славу Божью[a], и небосвод провозглашает дело Его рук; день дню изливает речь, и ночь ночи возвещает знание. Нет ни слов, ни речей, голоса которых не слышны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленном OCR-тексте в начале стоит εἰ — «если» или «поскольку», однако это, по всей видимости, ошибочное распознавание Οἱ — «небеса» с определённым артиклем. Ср. Пс 18:2–4 по Септуагинте. При буквальном чтении OCR: «Если (или: поскольку) небеса возвещают славу Божью…».'
    reason: Фиксирует текстологическую неоднозначность исходных данных и объясняет, почему основной текст не передаёт начальное εἰ как союз.
lexical_decisions:
- source_word: διηγοῦνται
  choice: возвещают
  rationale: Передаёт публичное провозглашение и сохраняет возвышенный поэтический регистр псаломской цитаты.
- source_word: τὸ στερέωμα
  choice: небосвод
  rationale: Современное и понятное обозначение небесного свода; точнее для обычного читателя, чем архаичное «твердь».
- source_word: ποίησιν
  choice: дело
  rationale: В данном контексте означает созданное, произведение рук Бога; «дело Его рук» естественно по-русски и сохраняет образ оригинала.
- source_word: ἐρεύγεται ῥῆμα
  choice: изливает речь
  rationale: Сохраняет энергичный образ непрерывно льющейся речи и поэтический параллелизм.
- source_word: γνῶσιν
  choice: знание
  rationale: Прямой эквивалент, не уточняющий содержание знания сверх сказанного в источнике.
- source_word: λαλιαί
  choice: речи
  rationale: Передаёт высказывания или формы речи и естественно сочетается с «словами», не сужая значение до конкретных языков.
theological_decisions:
- issue: Начальное εἰ в предоставленном нормализованном OCR-тексте
  choice: Переведено как определённый артикль во фразе «Небеса возвещают», с текстологическим пояснением в сноске
  alternative: '«Если (или: поскольку) небеса возвещают…»'
  rationale: 'εἰ здесь является OCR-ошибкой вместо Οἱ: контекст представляет прямую цитату Пс 18:2–4 по LXX, а условное или причинное прочтение нарушает синтаксис и превращает последующую строку в ложное следствие.'
- issue: Отрицательная конструкция οὐκ… ὧν οὐχὶ
  choice: «Нет ни слов, ни речей, голоса которых не слышны»
  alternative: «Нет слов или речей, чьи голоса не слышны»
  rationale: Сохранена формальная двойная отрицательная структура и универсальный смысл без попытки согласовать строку с иной традиционной формой псалма.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псаломским звучанием. Сохранены параллелизм, образность и синтаксическая напряжённость греческого текста; архаизм «твердь» заменён понятным словом «небосвод».
