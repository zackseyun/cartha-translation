  source_fidelity: Текст точно передаёт оба параллельных оборота ἐν λόγῳ, генитив τῆς μεγαλωσύνης αὐτοῦ («Своего величия»), всеохватное τὰ πάντα и местоименное αὐτά («всё это»). «Утвердил» является допустимой широкой передачей συνεστήσατο — установил/привёл в устойчивое устройство; «ниспровергнуть» адекватно передаёт καταστρέψαι, не ослабляя его разрушительного значения.
