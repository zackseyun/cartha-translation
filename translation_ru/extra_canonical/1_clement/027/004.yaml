  text: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ συνεστήσατο τὰ πάντα καὶ ἐν λόγῳ δύναται αὐτὰ καταστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/004.yaml
  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: ru
  text: Словом Своего величия Он утвердил всё и словом может всё это ниспровергнуть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: словом
  rationale: Творительный падеж естественно передаёт греческое ἐν с дательным в инструментальном значении; повтор сохранён в обеих частях фразы.
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: Своего величия
  rationale: «Величие» соответствует μεγαλωσύνη и сохраняет возвышенный регистр; возвратное «Своего» ясно относит величие к подлежащему.
- source_word: συνεστήσατο
  choice: утвердил
  rationale: Передаёт значение установления и приведения всего в устойчивый порядок, не сужая его до одного лишь сотворения.
- source_word: τὰ πάντα
  choice: всё
  rationale: Естественный русский эквивалент собирательного «всё сущее / всё».
- source_word: καταστρέψαι
  choice: ниспровергнуть
  rationale: Передаёт сильное значение καταστρέφω — опрокинуть, разрушить, ниспровергнуть — и соответствует торжественному контексту.
theological_decisions:
- issue: Связь «слова» с божественным действием
  choice: Сохранено нарицательное «словом» без персонализации
  alternative: «Словом» как титул личного Логоса
  rationale: В данном контексте λόγος обозначает действенное слово; текст сам по себе не требует христологической персонализации.
- issue: Объём глагола συνεστήσατο
  choice: «утвердил»
  alternative: «создал» или «сотворил»
  rationale: «Утвердил» сохраняет семантическую широту греческого глагола и не разрешает однозначно вопрос, идёт ли речь о первоначальном сотворении или установлении порядка.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Параллелизм и повтор «словом» сохранены; прописные местоимения использованы как принятая в русском религиозном письме форма почтительности.
