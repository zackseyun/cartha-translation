  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: ru
  text: Итак, пусть вновь разгорится в нас вера в Него, и уразумеем, что всё близко к Нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: пусть вновь разгорится
  rationale: Глагол буквально передаёт образ повторного раздувания огня; выбран естественный русский оборот, сохраняющий эту метафору.
- source_word: ἡ πίστις αὐτοῦ
  choice: вера в Него
  rationale: Родительный αὐτοῦ допускает разные смысловые отношения, но в данном увещевательном контексте наиболее естественно обозначает веру, направленную на Бога.
- source_word: νοήσωμεν
  choice: уразумеем
  rationale: Передаёт призыв не просто узнать, а постичь и осознать; форма совместного побуждения сохранена.
- source_word: πάντα ἐγγὺς αὐτῷ ἐστιν
  choice: всё близко к Нему
  rationale: Сохранена лаконичная пространственная метафора греческого текста без поясняющего сужения её смысла.
theological_decisions:
- issue: Значение выражения ἡ πίστις αὐτοῦ
  choice: вера в Него
  alternative: Его верность / Его вера
  rationale: 'Хотя форма родительного сама по себе неоднозначна, сочетание с «в нас» и призывом вновь разжечь веру лучше всего поддерживает объективное понимание: наша вера в Бога.'
- issue: Смысл близости всего к Богу
  choice: сохранена формулировка «всё близко к Нему»
  alternative: всё находится перед Ним / всё доступно Ему
  rationale: Перевод не устраняет возможное напряжение между пространственной близостью, Божьим знанием и Его властью, поскольку исходный текст прямо этого не уточняет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, увещевательным звучанием. Метафора огня сохранена; синтаксис остаётся ясным для широкого читателя.
