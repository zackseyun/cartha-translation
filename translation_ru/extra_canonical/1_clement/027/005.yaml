source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: ru
  text: 'Кто скажет Ему: «Что Ты сделал?» Или кто воспротивится могуществу Его силы? Когда Он пожелает и как пожелает, Он совершит всё, и ничто из постановленного Им никогда не пройдёт.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничто из постановленного Им никоим образом не минует». В контексте это может означать, что Божье постановление не утратит силы и не останется неисполненным.'
    reason: Сохраняет образность παρελθῇ и эмфатическое отрицание οὐδὲν μή, не превращая контекстуальное толкование в единственный смысл основного текста.
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: воспротивится
  rationale: Передаёт прямое значение противостояния или сопротивления власти и силе Бога, сохраняя риторический характер вопроса.
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: могуществу Его силы
  rationale: Сохраняет усилительное сочетание двух близких понятий κράτος и ἰσχύς, не сводя его к одному слову.
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: из установленного Им
  rationale: Причастие от δογματίζω обозначает то, что было определено, постановлено или установлено Его решением.
- source_word: παρελθῇ
  choice: останется неисполненным
  rationale: В данном контексте глагол означает, что Божье постановление не минует и не утратит действенности; естественная русская формулировка выражает его неизбежное осуществление.
theological_decisions:
- issue: Смысл отрицания οὐδὲν μὴ παρελθῇ применительно к Божьим постановлениям
  choice: ничто ... никогда не останется неисполненным
  alternative: ничто ... не пройдёт
  rationale: Выбранный вариант ясно передаёт эмфатическое греческое отрицание и контекст исполнения Божьей воли, тогда как буквальное «не пройдёт» по-русски двусмысленно. В сноске сохранён диапазон образа.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с традиционным русским религиозным регистром; риторический параллелизм греческого текста сохранён.
