source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: ru
  text: Тот, кто заповедал не лгать, тем более Сам не солжёт, ибо для Бога нет ничего невозможного, кроме одного — солгать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγείλας
  choice: заповедал
  rationale: Передаёт авторитетное повеление; русская формулировка сохраняет отсутствие явно названного адресата.
- source_word: πολλῷ μᾶλλον
  choice: тем более
  rationale: Естественный современный русский эквивалент усиленного сравнительного оборота.
- source_word: αὐτὸς οὐ ψεύσεται
  choice: Сам не солжёт
  rationale: «Сам» сохраняет эмфатическое αὐτός, а будущее «не солжёт» точно передаёт ψεύσεται.
- source_word: οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ
  choice: ибо для Бога нет ничего невозможного
  rationale: Естественная русская передача конструкции παρὰ τῷ θεῷ без изменения её смысла.
- source_word: εἰ μὴ τὸ ψεύσασθαι
  choice: кроме одного — солгать
  rationale: Сохраняет выразительное исключение и инфинитивную форму исходного текста, не сглаживая богословское напряжение.
theological_decisions:
- issue: Утверждение о невозможности лжи для Бога
  choice: для Бога нет ничего невозможного, кроме одного — солгать
  alternative: Бог может всё, но не может лгать
  rationale: Выбранная формулировка ближе к парадоксальной структуре греческого текста и не превращает её в пояснительный пересказ.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; синтаксис сохраняет афористичность и риторическое усиление оригинала.
