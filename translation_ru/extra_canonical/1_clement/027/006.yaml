  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: ru
  text: Всё перед Ним, и ничто не укрылось от Его совета.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Его решения» или «от Его замысла».'
    reason: «Совет» передаёт βουλή, которое в данном контексте может обозначать обдуманное решение или замысел; варианты поясняют диапазон без подмены смысла λέληθεν.
lexical_decisions:
- source_word: πάντα
  choice: Всё
  rationale: Передаёт собирательное «всё существующее / все вещи» без ненужного уточнения.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед Ним
  rationale: Сохраняет пространственно-образную формулировку греческого текста и подразумеваемую открытость всего Богу.
- source_word: λέληθεν
  choice: не укрылось
  rationale: Перфект λανθάνω означает «остаться незамеченным, ускользнуть от внимания, быть скрытым»; русская форма естественно передаёт итоговое состояние.
- source_word: βουλή
  choice: замысла
  rationale: «Замысел» естественно передаёт здесь многозначное βουλή — обдуманное намерение, решение или совет — и не сводит его лишь к знанию.
theological_decisions:
- issue: Соотношение Божьего знания и замысла
  choice: Сохранена формулировка «ничто не укрылось от Его замысла»
  alternative: «ничто не скрыто от Его ведения»
  rationale: Альтернатива звучит естественно, но заменяет βουλή понятием знания и тем самым устраняет напряжение и олицетворение исходного выражения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Прописное «Ним/Его» употреблено как традиционное уважительное обозначение Бога; тире подчёркивает всеохватность первого утверждения.
