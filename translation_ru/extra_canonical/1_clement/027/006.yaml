  - severity: low
    issue: Сноска включает «волю» как равнозначный вариант
    rationale: «Воля» может быть контекстуально связана с βουλή, но не передаёт непосредственно его основной смысловой диапазон «совет; решение; замысел» и создаёт ненужное богословское расширение.
