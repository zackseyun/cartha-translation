  source_fidelity: 'Первая часть передана точно: πάντα ἐνώπιον αὐτοῦ — «Всё перед Ним». Во второй части «не укрылось» хорошо отражает перфект λέληθεν («не осталось скрытым / не ускользнуло»), однако «от Его замысла» способно означать, что нечто не избежало осуществления плана, а не что оно не было скрыто от Божьего совета или решения. Это воспроизводит смысловое смещение, отмеченное в английской истории правок.'
  naturalness: «Всё перед Ним, и ничто не укрылось от Его совета» — краткая, естественная для современного литературного русского фраза с уместно возвышенным регистром. Слово «совет» здесь употреблено в значении обдуманного решения или замысла, а не собрания людей.
  terminology: βoυλή лучше передавать словом «совет» в основном тексте, поскольку оно сохраняет как совещательно-решительный, так и целевой оттенок греческого слова, не сводя его к осуществляемому «замыслу». Сноска может кратко указать альтернативы «решение» и «замысел», но «воля» не является столь же прямым эквивалентом и без необходимости расширяет диапазон.
  issues:
