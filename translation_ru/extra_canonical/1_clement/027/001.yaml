  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: ru
  text: Итак, в этой надежде пусть наши души будут привязаны к Тому, кто верен в Своих обещаниях и праведен в Своих судах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Итак, пусть наши души будут привязаны к этой надежде — к Тому, кто верен в Своих обещаниях».'
    reason: Сохраняет менее вероятное альтернативное прочтение связи дательных оборотов, представленное в прежнем переводе.
lexical_decisions:
- source_word: προσδεδέσθωσαν
  choice: пусть… прилепятся
  rationale: Перфектный императив передаёт призыв к прочной, сохраняющейся привязанности; «прилепятся» естественно и достойно выражает образ тесной связи с дательным τῷ πιστῷ.
- source_word: τῷ πιστῷ
  choice: к Тому, кто верен
  rationale: Субстантивированное прилагательное указывает на личность; дательный падеж обозначает того, к кому должны прилепиться души.
- source_word: ἐπαγγελίαις
  choice: обещаниях
  rationale: Современный и понятный эквивалент для обещаний, данных Богом; множественное число сохранено.
- source_word: κρίμασιν
  choice: решениях
  rationale: Передаёт судебно-оценочный смысл κρίματα, не сужая его непременно до актов осуждения.
theological_decisions:
- issue: Личность, названная τῷ πιστῷ и τῷ δικαίῳ
  choice: Тому, кто верен… и праведен
  alternative: Верному… и Праведному
  rationale: Развёрнутая конструкция ясна современному читателю и сохраняет подразумеваемую личность, не добавляя отсутствующего в стихе имени Бога.
- issue: Синтаксическая роль Ταύτῃ… τῇ ἐλπίδι
  choice: в этой надежде
  alternative: к этой надежде
  rationale: Основным объектом присоединения при προσδέω является τῷ πιστῷ; начальный дательный естественно понимать как сферу или основание действия, сохраняя при этом отмеченную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, церковно уместным тоном. «Прилепятся» сохраняет библейскую образность без тяжеловесного буквализма; местоимения при подразумеваемом Боге написаны с прописной буквы.
