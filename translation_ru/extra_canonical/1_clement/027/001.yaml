review_pass:
  verdict: revise
  source_fidelity: 'Основная синтаксическая связь передана верно: начальный оборот Ταύτῃ ... τῇ ἐλπίδι выражает сферу/основание, а τῷ πιστῷ ... καὶ τῷ δικαίῳ — Того, к кому должны быть привязаны души. Однако κρίμασιν имеет судебно-оценочный смысл «суды/судные решения»; «решения» слишком обобщает его.'
  naturalness: Фраза литературна и понятна. «Пусть наши души будут привязаны» несколько ближе к перфектному страдательному императиву προσδεδέσθωσαν, чем возвратное «прилепятся», при этом остаётся естественной в умеренно возвышенном регистре.
  terminology: «Обещания» точно передаёт ἐπαγγελίαις. «Суды» точнее передаёт κρίμασιν, чем «решения». Личные обозначения «Тому, кто верен ... и праведен ...» сохраняют субстантивированные прилагательные и не навязывают имя, отсутствующее в самом предложении.
  issues:
  - severity: medium
    issue: κρίμασιν переведено как «решениях».
    rationale: Кρίματα в данном контексте относятся к Божьим судам/судебным решениям; нейтральные «решения» стирают этот существенный смысловой компонент.
  - severity: low
    issue: «Прилепятся» не вполне отражает форму προσδεδέσθωσαν.
    rationale: 'Греческая форма — перфектный страдательный императив со значением устойчивой привязанности: «пусть будут привязаны» точнее передаёт и образ, и залог, не делая русский текст тяжеловесным.'
