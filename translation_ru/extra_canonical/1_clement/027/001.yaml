revisions:
- from: Итак, в этой надежде пусть наши души прилепятся к Тому, кто верен в Своих обещаниях и праведен в Своих решениях.[a]
  to: Итак, в этой надежде пусть наши души будут привязаны к Тому, кто верен в Своих обещаниях и праведен в Своих судах.[a]
  rationale: Исправлены «решениях» на «судах» для передачи судебного значения κρίμασιν и «прилепятся» на «будут привязаны» для более точного отражения προσδεδέσθωσαν. Основное синтаксическое решение и осторожная альтернативная сноска сохранены.
