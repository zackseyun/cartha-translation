id: 1CLEM.43.5
reference: 1 Clement 43:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: ru
  text: Когда же настало утро, он созвал весь Израиль — шестьсот тысяч мужчин — и показал печати вождям колен; затем открыл шатёр свидетельства и вынес жезлы. И оказалось, что жезл Аарона не только дал ростки, но и принёс плод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: Когда же настало утро
  rationale: Естественно передаёт временную конструкцию родительного абсолютного при сохранении связки δέ.
- source_word: τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν
  choice: шестьсот тысяч мужчин
  rationale: Сохраняет прямое числовое уточнение к «всему Израилю» без добавления отсутствующих в тексте пояснений.
- source_word: τοῖς φυλάρχοις
  choice: вождям колен
  rationale: Передаёт значение руководителей израильских колен понятным современным выражением.
- source_word: τὰς σφραγῖδας
  choice: печати
  rationale: Формально сохраняет множественное число и предметное значение σφραγίς; контекст предполагает средства удостоверения, но не требует разворачивать это в основном тексте.
- source_word: τὴν σκηνὴν τοῦ μαρτυρίου
  choice: шатёр свидетельства
  rationale: Близко передаёт устойчивое библейское выражение, сохраняя связь с ветхозаветной терминологией и оставаясь понятным современному читателю.
- source_word: προεῖλεν τὰς ῥάβδους
  choice: вынес жезлы
  rationale: Передаёт движение наружу из шатра; «жезлы» соответствует контексту знаков власти глав колен.
- source_word: βεβλαστηκυῖα
  choice: дала ростки
  rationale: Естественно выражает результат прорастания, заложенный в перфектном причастии.
- source_word: καρπὸν ἔχουσα
  choice: принёс плод
  rationale: Передаёт наличие плода как последующую и более сильную ступень знамения; мужской род согласован с русским «жезл».
theological_decisions:
- issue: Характер знамения жезла Аарона
  choice: не только дал ростки, но и принёс плод
  alternative: не только расцвёл, но и имел плод
  rationale: Греческий текст различает прорастание и наличие плода; перевод не добавляет цветение, прямо не названное в данной формулировке, и сохраняет усиление οὐ μόνον… ἀλλὰ καί.
- issue: Название святилища
  choice: шатёр свидетельства
  alternative: скиния собрания
  rationale: Перевод следует именно греческому τοῦ μαρτυρίου («свидетельства»), не подменяя его другой традиционной ветхозаветной формулой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет последовательность повествования оригинала, но избегает тяжеловесной буквальности. Тире выделяет пояснение о числе мужчин.
