source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: ru
  text: Там также блаженный Моисей, верный служитель во всём доме, записал в священных книгах всё, что было ему предписано. За ним последовали и остальные пророки, вместе свидетельствуя об установлениях, введённых им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: Там же и
  rationale: Передаёт отсылку к упомянутой в контексте ситуации или области рассуждения, сохраняя связующую функцию выражения.
- source_word: μακάριος
  choice: блаженный
  rationale: Традиционное и понятное в религиозном контексте обозначение человека, удостоенного Божьего благоволения; сохраняет возвышенный регистр.
- source_word: πιστὸς θεράπων
  choice: верный служитель
  rationale: «Служитель» естественно передаёт почётное служение Моисея Богу и избегает излишне бытового оттенка слова «слуга».
- source_word: ἐσημειώσατο
  choice: записал
  rationale: В данном контексте речь идёт о письменной фиксации в священных книгах; «записал» ясно и естественно передаёт смысл.
- source_word: τὰ διατεταγμένα αὐτῷ
  choice: всё, что было ему предписано
  rationale: Сохраняет значение полученных Моисеем распоряжений, не добавляя явно не выраженного субъекта повеления.
- source_word: ἐπηκολούθησαν
  choice: последовали за ним
  rationale: Передаёт как преемственность пророков по отношению к Моисею, так и следование установленному им направлению.
- source_word: συνεπιμαρτυροῦντες
  choice: вместе свидетельствуя об
  rationale: Приставка συν- передана словом «вместе», а дательный падеж следующего оборота понят как объект подтверждающего свидетельства.
- source_word: τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  choice: об установлениях, данных через него
  rationale: Субстантивированное причастие обозначает введённые в силу предписания. «Через него» сохраняет посредническую роль Моисея и не утверждает, будто он был окончательным источником закона.
theological_decisions:
- issue: Роль Моисея в установлении предписаний
  choice: «установлениях, данных через него»
  alternative: «установлениях, введённых им»
  rationale: Греческое ὑπ’ αὐτοῦ грамматически допускает прямое указание на деятельность Моисея, однако формулировка «через него» естественно согласуется с непосредственно предшествующим утверждением, что предписания были даны ему, и не снимает напряжение между его посредничеством и участием в законодательстве.
- issue: Связь дательного оборота с συνεπιμαρτυροῦντες
  choice: пророки свидетельствуют об установлениях
  alternative: пророки свидетельствуют вместе с установлениями
  rationale: Синтаксис и употребление глагола лучше поддерживают понимание установлений как предмета подтверждающего свидетельства; менее вероятная конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным церковно-библейским звучанием. Сохранена аллюзия на Моисея как верного служителя «во всём доме»; синтаксис разделён на два предложения ради ясности без утраты логической связи.
