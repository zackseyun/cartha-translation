revisions:
- from: Там же и блаженный Моисей, верный служитель во всём доме, записал в священных книгах всё, что было ему предписано. За ним последовали и остальные пророки, вместе свидетельствуя об установлениях, данных через него.[a]
  to: Там также блаженный Моисей, верный служитель во всём доме, записал в священных книгах всё, что было ему предписано. За ним последовали и остальные пророки, вместе свидетельствуя об установлениях, введённых им.
  rationale: 'Исправлена роль Моисея в заключительном обороте: предписания не просто даны через него, но установлены им. Удалена необоснованная альтернативная сноска. Остальная формулировка сохранена, поскольку точно и естественно передаёт греческий текст.'
