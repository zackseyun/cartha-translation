  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: ru
  text: 'И, закрыв шатёр, он запечатал ключи, равно как и посохи, и сказал им: «Братья, посох какого племени даст росток — то племя Бог избрал, чтобы оно несло священническое служение и служило Ему».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνή
  choice: шатёр
  rationale: В данном повествовании речь идёт о священном шатре; «шатёр» естественно передаёт образ, не добавляя отсутствующего в греческом тексте уточнения «скиния».
- source_word: κλεῖδας
  choice: ключи
  rationale: Это прямое значение греческой формы. Хотя упоминание ключей в данном контексте неожиданно и английский консультационный слой их опускает, исходный текст явно содержит «ключи», поэтому они сохранены.
- source_word: ῥάβδους / ῥάβδος
  choice: посохи / посох
  rationale: «Посох» естественно обозначает племенной жезл в этом повествовании и сохраняет конкретный образ предмета, давшего росток.
- source_word: βλαστήσῃ
  choice: даст росток
  rationale: Передаёт конкретное чудесное прорастание посоха ясным современным выражением.
- source_word: εἰς τὸ ἱερατεύειν καὶ λειτουργεῖν αὐτῷ
  choice: чтобы оно совершало перед Ним священническое служение
  rationale: Два близких греческих глагола объединены в естественную русскую формулу, сохраняющую и священнический характер, и направленность служения Богу.
theological_decisions:
- issue: 'Кого именно избрал Бог: посох или племя'
  choice: «то племя Бог избрал»
  alternative: «тот посох Бог избрал»
  rationale: Указательное местоимение ταύτην женского рода согласуется с φυλή («племя», в греческом женского рода), а не с ῥάβδος в смысловом отношении; избрание относится к племени, представленному посохом.
- issue: Соотношение ἱερατεύειν и λειτουργεῖν
  choice: единая формула «совершало перед Ним священническое служение»
  alternative: «священнодействовало и служило Ему»
  rationale: Раздельный буквальный перевод в русском звучит избыточно и может искусственно создать два разных вида служения. Выбранная формула сохраняет священнический смысл обоих выражений без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Обращение Ἄνδρες ἀδελφοί передано естественно как «Братья», без неуклюжего буквального «мужи-братья». Неожиданное «ключи» сохранено по греческому источнику вопреки английскому консультационному слою.
