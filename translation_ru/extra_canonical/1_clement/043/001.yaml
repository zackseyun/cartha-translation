source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: ru
  text: И что удивительного, если те, кому Бог во Христе доверил такое дело[a], поставили тех, о ком говорилось прежде?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «если те, кому Бог во Христе доверил [это], поставили тех, о ком говорилось прежде, на такое дело?»'
    reason: Отмечает альтернативное синтаксическое присоединение «такое дело» к «поставили», не искажая значения πιστευθέντες и сохраняя предпочтительность основного чтения.
lexical_decisions:
- source_word: θαυμαστόν
  choice: удивительного
  rationale: Передаёт смысл «удивительное, достойное удивления» естественным современным русским оборотом «что удивительного».
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: Сохраняет буквальную и богословски значимую формулировку греческого текста, не уточняя без достаточных оснований характер связи со Христом.
- source_word: πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο
  choice: кому Бог ... доверил такое дело
  rationale: Пассивная конструкция с указанием действующего лица передана естественным русским активным оборотом; винительный ἔργον τοιοῦτο понимается как предмет доверения.
- source_word: κατέστησαν
  choice: поставили
  rationale: В данном контексте означает назначение или поставление людей на служение; «поставили» сохраняет церковно-организационный оттенок без излишней конфессиональной конкретизации.
- source_word: τοὺς προειρημένους
  choice: упомянутых прежде людей
  rationale: Ясно передаёт субстантивированное причастие и отсылку к ранее названным лицам.
theological_decisions:
- issue: Связь выражения ἐν Χριστῷ с доверением поручения
  choice: «кому Бог во Христе доверил»
  alternative: «те, кому во Христе было доверено Богом»
  rationale: Выбран естественный русский порядок слов, сохраняющий формулу «во Христе» и не вводящий дополнительного толкования о посредничестве или сфере действия.
- issue: К чему относится ἔργον τοιοῦτο
  choice: 'к πιστευθέντες: Бог доверил им такое дело'
  alternative: 'к κατέστησαν: они поставили прежде упомянутых на такое дело'
  rationale: Греческая конструкция допускает у πιστεύω в пассиве винительный предмета доверения; это синтаксически предпочтительное чтение и не требует добавлять отсутствующий в тексте предлог назначения.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, достойным раннехристианского текста регистром. Формулировка остаётся понятной без специальной церковной терминологии; «поставили» уместно передаёт назначение на служение.
