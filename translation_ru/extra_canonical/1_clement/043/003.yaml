source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: ru
  text: Ведь когда из-за священства возникла зависть и колена враждовали о том, какое из них украшено славным именем, он велел двенадцати вождям колен принести ему жезлы, каждый с надписью имени своего колена. Взяв их, он связал их вместе, запечатал перстнями вождей колен и положил в скинии свидетельства на стол Божий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήλου
  choice: зависть
  rationale: Основное значение в данном контексте — ревнивая зависть и соперничество из-за священства; это также сохраняет связь с темой зависти в послании.
- source_word: στασιαζουσῶν
  choice: вступили в распрю
  rationale: Передаёт активный характер глагола στασιάζω — участие в междоусобном, групповом противостоянии, а не просто наличие разногласий.
- source_word: φυλάρχους
  choice: вождям колен
  rationale: Точно обозначает глав, представляющих двенадцать колен, и естественно звучит по-русски.
- source_word: ῥάβδους
  choice: жезлы
  rationale: В повествовании о жезлах колен слово обозначает не обычные посохи, а знаковые жезлы их представителей.
- source_word: ἐσφράγισεν τοῖς δακτυλίοις
  choice: запечатал перстнями
  rationale: Речь идёт о перстнях-печатях вождей; традиционное «перстнями» сохраняет предметный образ и функцию удостоверения.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: скинии свидетельства
  rationale: Формально передаёт устойчивое библейское наименование святилища и соответствует возвышенному регистру текста.
theological_decisions:
- issue: Смысл выражения τῷ ἐνδόξῳ ὀνόματι
  choice: «украшено славным именем» без уточнения, что именно это за имя
  alternative: «удостоено славного звания священства»
  rationale: Греческий текст говорит буквально о «славном имени» и не называет его прямо; уточнение до звания священства сняло бы намеренно сохранённую смысловую недосказанность.
- issue: Референт местоимения ἐκεῖνος
  choice: «он»
  alternative: «Моисей»
  rationale: В стихе сохранена местоименная отсылка оригинала; явное имя следует брать из предшествующего контекста, а не добавлять здесь.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён ровно настолько, чтобы длинный греческий период был понятен обычному читателю; термины «колена», «жезлы», «скиния свидетельства» сохранены как узнаваемая библейская лексика.
