revisions:
- from: Ведь когда из-за священства возникла зависть и колена вступили в распрю о том, какое из них украшено славным именем, он велел двенадцати вождям колен принести ему жезлы, надписав на каждом имя соответствующего колена. Взяв их, он связал их вместе, запечатал перстнями вождей колен и положил в скинии свидетельства на столе Божьем.
  to: Ведь когда из-за священства возникла зависть и колена враждовали о том, какое из них украшено славным именем, он велел двенадцати вождям колен принести ему жезлы, каждый с надписью имени своего колена. Взяв их, он связал их вместе, запечатал перстнями вождей колен и положил в скинии свидетельства на стол Божий.
  rationale: Правка устраняет необоснованное указание на то, кто именно надписал жезлы, и точнее передаёт направление действия при их помещении на стол. Неоднозначное «славное имя» и местоименная отсылка «он» сохранены, как в греческом тексте.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт ход греческого текста, включая неуточнённое «славное имя», а также образ жезлов, их связывания и запечатывания. Однако деепричастие «надписав» грамматически приписывает нанесение надписей двенадцати вождям, тогда как греческое ῥάβδους ἐπιγεγραμμένας характеризует сами жезлы как уже надписанные. Также «на столе Божьем» может звучать как указание места, тогда как при глаголе помещения естественнее передать направление: «на стол Божий».'
  naturalness: Текст литературен и выдержан в умеренно библейском регистре. «Колена вступили в распрю» возможно, но «колена враждовали» или «колена были охвачены распрей» было бы несколько плавнее; в предлагаемой правке сохранён активный характер στασιαζουσῶν посредством «враждовали».
  terminology: «Священство», «колена», «жезлы», «скиния свидетельства» и «перстни» уместны и согласованы с библейским регистром. «Славное имя» сохраняет намеренно нераскрытое выражение τῷ ἐνδόξῳ ὀνόματι, не добавляя конфессионального истолкования.
