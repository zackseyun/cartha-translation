    rationale: 'Греческое ἐπιγεγραμμένας — страдательное причастие, относящееся к жезлам: они были надписаны. Русское деепричастие делает вождей исполнителями надписывания, чего источник не утверждает.'
  - severity: low
    issue: «положил в скинии свидетельства на столе Божьем»
    rationale: 'Сочетание εἰς ... ἐπὶ τὴν τράπεζαν при глаголе ἀπέθετο описывает помещение жезлов на стол; по-русски это точнее и естественнее передать винительным направительным: «на стол Божий».'
