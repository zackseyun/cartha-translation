revisions:
- from: Как вы думаете, возлюбленные? Разве Моисей не знал заранее, что это должно произойти? Конечно, знал. Но он поступил так, чтобы в Израиле не возникло смуты и чтобы было прославлено имя истинного и единственного Бога, Которому слава во веки веков. Аминь.
  to: Как вы думаете, возлюбленные? Разве Моисей не знал заранее, что это произойдёт? Конечно, знал. Но он поступил так, чтобы в Израиле не возникло беспорядка и чтобы было прославлено имя истинного и единственного Бога, Которому слава во веки веков. Аминь.
  rationale: 'Исправлены только два места: ожидаемое будущее μέλλειν ἔσεσθαι передано естественным «произойдёт», а ἀκαταστασία — нейтральным «беспорядок». Синтаксическая связь целей ἵνα и εἰς τὸ, а также формула доксологии сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:32Z'
review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт ход мысли, два целевых оборота и доксологию. Однако «что это должно произойти» в русском звучит как выражение необходимости и не вполне естественно после прошедшего «знал». Греческое μέλλειν ἔσεσθαι обозначает ожидаемое будущее событие; «что это произойдёт» передаёт это без лишнего модального оттенка.
  naturalness: Регистр ровный, современный и уместно торжественный. «Смута» возможно по смыслу, но имеет выраженную русскую историко-политическую окраску; нейтральное «беспорядок» точнее и прозрачнее передаёт ἀκαταστασία в данном контексте.
  terminology: «Возлюбленные», «истинного и единственного Бога» и «во веки веков» удачны. Прописное «Которому» допустимо в принятой религиозной издательской норме. «Беспорядок» лучше сохраняет общий, неуточнённый характер греческого слова, не навязывая конкретную интерпретацию разлада.
  issues:
  - severity: medium
    issue: Модально-временной оттенок «должно произойти»
    rationale: μέλλειν ἔσεσθαι означает «предстояло/должно было случиться» в смысле ожидаемого будущего, но русское «должно произойти» здесь воспринимается прежде всего как необходимость и синтаксически менее естественно. «Произойдёт» сохраняет будущность относительно знания Моисея без дополнительного оттенка необходимости.
  - severity: low
    issue: «Смута» для ἀκαταστασία
    rationale: 'Слово допустимо, однако в современном русском ассоциируется с конкретной общественно-политической смутой. ἀκαταστασία шире: беспорядок, неустройство, разлад. Нейтральное «беспорядок» точнее сохраняет исходную широту.'
  revised_text: Как вы думаете, возлюбленные? Разве Моисей не знал заранее, что это произойдёт? Конечно, знал. Но он поступил так, чтобы в Израиле не возникло беспорядка и чтобы было прославлено имя истинного и единственного Бога, Которому слава во веки веков. Аминь.
