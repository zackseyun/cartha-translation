source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: Как вы думаете, возлюбленные? Разве Моисей не знал заранее, что это произойдёт? Конечно, знал. Но он поступил так, чтобы в Израиле не возникло беспорядка и чтобы было прославлено имя истинного и единственного Бога, Которому слава во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Традиционное и вместе с тем понятное обращение, передающее теплоту общинной речи.
- source_word: ἀκαταστασία
  choice: смута
  rationale: В данном контексте обозначает беспорядок и разлад внутри Израиля; «смута» естественно передаёт обе стороны значения.
- source_word: τοῦ ἀληθινοῦ καὶ μόνου θεοῦ
  choice: истинного и единственного Бога
  rationale: Сохраняет оба греческих определения без ослабления их богословского напряжения.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся русская формула, точно отражающая усиленную греческую идиому вечности.
theological_decisions:
- issue: Связь двух целевых оборотов ἵνα и εἰς τὸ
  choice: «чтобы… и чтобы…»
  alternative: «чтобы…; тем самым имя… было прославлено»
  rationale: Сохраняется целевая направленность обоих оборотов, не вводится дополнительное причинное или инструментальное толкование.
- issue: Доксология ᾧ ἡ δόξα
  choice: «Которому слава»
  alternative: «Ему да будет слава»
  rationale: Краткая именная формула ближе к греческому тексту и естественна для русского торжественного регистра.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания; синтаксис упрощён лишь настолько, чтобы текст свободно читался вслух. Местоимение «Которому» написано с прописной буквы по принятой русской религиозной издательской норме.
