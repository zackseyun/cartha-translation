  text: αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: ru
  text: Ведь сам Творец и Владыка всего радуется Своим делам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργός
  choice: Творец
  rationale: В контексте речь идёт о Боге как создателе всего; «Творец» естественно и точно передаёт значение слова.
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт верховную власть и господство без неуместного для современного русского языка оттенка слова «деспот».
- source_word: τῶν ἁπάντων
  choice: всего
  rationale: Кратко сохраняет всеохватное значение греческого выражения «всех вещей / всего сущего».
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  choice: Своим делам
  rationale: С глаголом «радоваться» дательный падеж звучит естественно по-русски и передаёт основание радости; «дела» сохраняет широкий смысл ἔργα.
- source_word: ἀγάλλεται
  choice: радуется
  rationale: Передаёт деятельную радость без стилистического утяжеления; настоящее время греческого текста сохранено.
theological_decisions:
- issue: Усилительное αὐτός при именовании Бога
  choice: сам Творец и Владыка
  alternative: Творец и Владыка всего Сам
  rationale: Позиция «сам» перед составным именованием естественна по-русски и сохраняет греческое логическое ударение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Заглавные буквы в «Творец», «Владыка» и «Своим» отражают традиционное русское оформление прямого обозначения Бога; смысл оригинала от этого не меняется.
