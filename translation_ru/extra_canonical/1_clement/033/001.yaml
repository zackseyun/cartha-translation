id: 1CLEM.33.1
reference: 1 Clement 33:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: ru
  text: Что же нам делать, братья? Перестанем делать добро и оставим любовь? Да не допустит Владыка, чтобы такое произошло среди нас! Напротив, поспешим с усердием и рвением совершать всякое доброе дело.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: перестанем делать добро
  rationale: Сочетание ἀργέω с ἀπό означает прекращение деятельности, а не просто нерадивость при её исполнении; выражение передано естественно по-русски.
- source_word: τὴν ἀγάπην
  choice: любовь
  rationale: Прямое и контекстуально ясное соответствие, без добавления конфессионального толкования.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Сохраняет значение верховного господина и традиционно возвышенный регистр обращения к Богу.
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: со всем усердием и рвением
  rationale: Передаёт сочетание напряжённой ревности и готовности действовать; πᾶν в русском естественно связано с полнотой усердия через «со всем» без ослабления второй характеристики.
- source_word: πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν
  choice: совершать всякое доброе дело
  rationale: Сохраняет универсальность πᾶν и значение доведения дела до исполнения у ἐπιτελεῖν.
theological_decisions:
- issue: Референт титула ὁ δεσπότης
  choice: Владыка
  alternative: Господь
  rationale: Греческий текст использует δεσπότης, а не κύριος; «Владыка» сохраняет различие титулов, не уточняя сверх текста, относится ли он здесь к Богу Отцу или ко Христу.
- issue: Сила пожелания μηδαμῶς ... ἐάσει
  choice: Да не допустит Владыка
  alternative: Владыка никогда не допустит
  rationale: Побудительно-пожелательная русская конструкция сохраняет риторическую силу и не превращает фразу в более категоричное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещательным регистром. Риторические вопросы и противопоставление сохранены; формулировки рассчитаны на ясное чтение вслух.
