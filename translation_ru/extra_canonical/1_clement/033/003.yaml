source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: ru
  text: Ибо Своей величайшей силой Он утвердил небеса и Своей непостижимой мудростью устроил их. Он отделил землю от окружающей её воды и утвердил её на прочном основании Своего замысла. Живым существам, движущимся по ней, Он повелел быть по Своему установлению. Приготовив море и живых существ в нём, Он Своей силой заключил море в пределы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παμμεγεθεστάτῳ ... κράτει
  choice: величайшей силой
  rationale: Передаёт превосходную степень усиленного прилагательного и значение κράτος как могущественной силы без тяжеловесного буквального «всевеличайшей мощью».
- source_word: ἐστήριξεν
  choice: утвердил
  rationale: Сохраняет образ установления и придания устойчивости небесам.
- source_word: ἀκαταλήπτῳ ... συνέσει
  choice: непостижимой мудростью
  rationale: σύνεσις обозначает разумение и мудрое понимание; «мудростью» естественно в данном возвышенном контексте.
- source_word: διεκύβευσεν
  choice: устроил
  rationale: Редкий глагол содержит образ умелого управления или направления; нейтральное «устроил» передаёт результат, не навязывая буквальный образ кормчего.
- source_word: περιέχοντος αὐτὴν ὕδατος
  choice: окружающей её воды
  rationale: Прямо передаёт представление текста о воде, окружающей землю.
- source_word: ἔδρασεν
  choice: утвердил
  rationale: Передаёт закрепление земли на прочном основании; повтор с «утвердил небеса» соответствует параллелизму оригинала.
- source_word: βουλήματος
  choice: замысла
  rationale: Передаёт Божье намерение или волевое решение, сохраняя образ основания.
- source_word: φοιτώντα
  choice: обитающим
  rationale: В контексте животных глагол описывает их движение и пребывание на земле; «обитающим» звучит естественно и не сужает значение до определённого способа передвижения.
- source_word: διατάξει
  choice: установлению
  rationale: Сохраняет смысл установленного Богом порядка или распоряжения.
- source_word: ἐνέκλεισεν
  choice: заключил море в пределы
  rationale: Глагол означает заключить или ограничить. Явное повторение «море» устраняет неестественную местоименную двусмысленность; форма единственного числа указывает на θάλασσαν, а не на ζῷα.
theological_decisions:
- issue: «Основание» земли как космологический образ
  choice: Сохранён образ прочного основания Божьего замысла
  alternative: Переформулировать как абстрактную устойчивость земли
  rationale: Текст использует θεμέλιον метафорически и связывает устойчивость творения с Божьим решением; перевод не должен ни материализовать, ни устранять этот образ.
- issue: Соотношение Божьего повеления и существования животных
  choice: «повелел быть по Своему установлению»
  alternative: «создал по Своему установлению»
  rationale: ἐκέλευσεν εἶναι буквально выражает повеление существовать; перевод сохраняет эту необычную формулировку и не заменяет её более общим глаголом творения.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской прозы. Синтаксический параллелизм оригинала в основном сохранён, но громоздкие причастные конструкции слегка расправлены ради ясности. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с распространённой русской издательской практикой.
