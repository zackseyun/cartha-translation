  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: ru
  text: 'Ибо так говорит Бог: «Сотворим человека по образу Нашему и по подобию Нашему». И сотворил Бог человека; мужчиной и женщиной сотворил их.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσωμεν
  choice: Сотворим
  rationale: Передаёт греческий аористный конъюнктив первого лица множественного числа как побуждение к совместному действию и сохраняет библейски узнаваемую, но понятную современному читателю формулировку.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Здесь слово обозначает человека как родовое понятие; «человека» сохраняет связь с единственным числом исходного текста и последующим упоминанием мужчины и женщины.
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν
  choice: по образу Нашему и по подобию Нашему
  rationale: Сохраняет два параллельных греческих выражения и не сводит «образ» и «подобие» к одному понятию.
- source_word: ἄρσεν καὶ θῆλυ
  choice: мужчину и женщину
  rationale: Естественная современная русская передача обозначений мужского и женского пола применительно к людям; избегает менее личностного «мужчину и женщину»? Выбор соответствует контексту сотворения людей и сохраняет парность выражения.
- source_word: αὐτούς
  choice: их
  rationale: Сохраняет множественное число греческого местоимения, соотнося его с мужчиной и женщиной.
theological_decisions:
- issue: Множественное число в Божьих словах Ποιήσωμεν / ἡμετέραν
  choice: «Сотворим… Нашему… Нашему»
  alternative: Переформулировать в единственном числе или пояснить, к кому обращается Бог
  rationale: Исходный текст оставляет адресата и богословское значение множественного числа неуточнёнными; перевод сохраняет эту подлинную неоднозначность без конфессионального истолкования.
- issue: Соотношение единственного «человека» и множественного «их»
  choice: 'Сохранить грамматический переход: «человека… мужчину и женщину… их»'
  alternative: Сгладить как «людей» во всём предложении
  rationale: Так воспроизводится напряжение исходной формулировки между человечеством как единством и мужчиной и женщиной как множественностью.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор исходного текста сохранены; кавычками выделена прямая речь Бога.
