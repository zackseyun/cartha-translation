  source_fidelity: 'Основной смысл передан верно: человек назван высшим творением, созданным Божьими святыми руками и представленным как отпечаток Божьего образа. Однако «соответствующее Его замыслу» несколько свободно преобразует κατὰ διάνοιαν в относительную характеристику и ослабляет возможность альтернативного отнесения оборота к человеку. «Непорочными руками» также менее точно для ἀμιάντοις, означающего «неосквернёнными, незапятнанными».'
