base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: ru
  text: Превыше всего[a] Он Своими святыми и неосквернёнными руками сотворил человека — самое выдающееся и необычайно великое творение по Своему замыслу — как отпечаток Своего образа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…сотворил человека — самое выдающееся и необычайно великое по разумению творение — как отпечаток Своего образа». Греческий оборот «по разумению» может относиться к человеку; в основном тексте он понят как указание на Божий замысел.'
    reason: Сохраняет синтаксическую неоднозначность κατὰ διάνοιαν, отмеченную в английском аудиторском следе, не навязывая один спорный разбор.
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: Превыше всего
  rationale: Передаёт значение первенства человека среди перечисленных Божьих творений и сохраняет возможный оттенок «над всем».
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: превосходнейшее и величайшее творение
  rationale: Субстантивированные формы среднего рода характеризуют человека как выдающееся творение; «величайшее» естественно передаёт усиление в παμμέγεθες.
- source_word: κατὰ διάνοιαν
  choice: соответствующее Его замыслу
  rationale: Оборот отнесён к Божьему замыслу или разумению, а не к способности человека понимать; «замыслу» естественно вписывается в контекст творения, не исключая смысла Божьей мысли.
- source_word: ἔπλασεν
  choice: сотворил
  rationale: В данном контексте обозначает создание, буквально формирование; «сотворил» звучит естественно и достойно, тогда как образ рук сохраняет оттенок личного формирования.
- source_word: χαρακτῆρα
  choice: отпечаток
  rationale: Передаёт образ оттиска или точного запечатлённого подобия, не отождествляя человека с самим Божьим образом.
theological_decisions:
- issue: Отнесение κατὰ διάνοιαν
  choice: 'К Божьему замыслу: «соответствующее Его замыслу»'
  alternative: 'К человеческому разумению: «величайшего по разумению»'
  rationale: Контекст прославляет Божьи разум, волю и силу в творении, а грамматическая конструкция допускает описание человека как высшего творения Божьего замысла. Альтернативное прочтение сохранено в примечании.
- issue: Связь человека с образом Бога
  choice: «как отпечаток Своего образа»
  alternative: «с чертами Своего образа» или «по подобию Своего образа»
  rationale: χαρακτήρ буквально указывает на отпечаток; формулировка сохраняет различие между Божьим образом и человеком как его отпечатком.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным звучанием. Заглавные местоимения, относящиеся к Богу, выбраны как уместная русская издательская норма. Тире помогают сделать длинную греческую конструкцию понятной без устранения её смыслового напряжения.
