revisions:
- from: Превыше всего[a] Он Своими святыми и непорочными руками сотворил человека — превосходнейшее и величайшее творение, соответствующее Его замыслу, — как отпечаток Своего образа.
  to: Превыше всего[a] Он Своими святыми и неосквернёнными руками сотворил человека — самое выдающееся и необычайно великое творение по Своему замыслу — как отпечаток Своего образа.
  rationale: 'Перевод уточнён по греческому тексту: ἀμιάντοις передано как «неосквернёнными», а усиленная характеристика τὸ ἐξοχώτατον καὶ παμμέγεθες — как «самое выдающееся и необычайно великое». Оборот κατὰ διάνοιαν в основном тексте передан близко и литературно («по Своему замыслу»), а его возможное отнесение к человеку сохранено в сноске. Смысл английского POB audit trail — высшее творение, связанное с Божьим замыслом, — сохранён.'
