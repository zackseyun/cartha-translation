  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: ru
  text: 'Итак, завершив всё это, Он похвалил их, благословил и сказал: «Плодитесь и размножайтесь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: завершив
  rationale: Передаёт значение доведения всего творения до завершения и сохраняет обстоятельственную форму греческого причастия.
- source_word: ἐπῄνεσεν
  choice: одобрил
  rationale: В данном контексте Божьей оценки сотворённого «одобрил» звучит естественнее, чем буквальное «похвалил», не ослабляя положительного значения глагола.
- source_word: ηὐλόγησεν
  choice: благословил
  rationale: Прямое и традиционное соответствие глаголу εὐλογέω в контексте благословения творения.
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: Плодитесь и размножайтесь
  rationale: Устоявшаяся русская библейская формула, точно соответствующая контексту Бытия и смыслу повеления о плодовитости и умножении.
theological_decisions:
- issue: Неявное подлежащее глаголов, относящихся к Богу
  choice: Он
  alternative: он
  rationale: Прописная буква следует принятой русской издательской практике для личного местоимения, относящегося к Богу, не добавляя к тексту отдельного богословского утверждения.
- issue: Объект местоимения αὐτά
  choice: их
  alternative: всё это
  rationale: 'Сохранено грамматическое различие оригинала: сначала говорится обо «всём этом» как совокупности, затем местоимение указывает на сотворённые вещи во множественном числе.'
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис близок к греческому, но естественен по-русски; цитата передана узнаваемой формулой из повествования о творении.
