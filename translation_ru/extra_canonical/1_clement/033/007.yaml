  text: ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: ru
  text: 'Посмотрим: все праведники были украшены добрыми делами, и Сам Господь, украсив Себя добрыми делами, возрадовался.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Посмотрим
  rationale: Увещательное сослагательное первого лица передано естественной русской формой совместного побуждения; она выражает призыв обратить внимание, а не требование позаботиться о чём-либо.
- source_word: ἐκοσμήθησαν
  choice: были украшены
  rationale: Сохранены страдательный залог аориста и образ украшения; перевод «украсились» необоснованно придал бы форме возвратное значение.
- source_word: ἔργοις ἀγαθοῖς
  choice: добрыми делами
  rationale: Устойчивое и точное соответствие, сохраняющее нравственно-деятельный смысл выражения.
- source_word: καὶ αὐτὸς δὲ ὁ κύριος
  choice: и что Сам Господь, также
  rationale: «Сам» передаёт усилительное αὐτός, а «также» — добавочную силу сочетания καί…δέ без чрезмерно сильного русского «даже».
- source_word: κοσμήσας
  choice: украсив Себя
  rationale: Деепричастие сохраняет действительный залог, возвратный объект и предшествование действия личной форме «возрадовался».
- source_word: ἐχάρη
  choice: возрадовался
  rationale: Передаёт аорист χαίρω в достойном литературном регистре и соответствует возвышенному контексту.
theological_decisions:
- issue: Связь праведности и добрых дел
  choice: Сохранено утверждение, что праведники были украшены добрыми делами, без указания причинной связи.
  alternative: Истолковать добрые дела как основание праведности либо только как её следствие.
  rationale: Греческий текст говорит об украшении праведников добрыми делами, но сам по себе не определяет, как именно дела соотносятся с их праведностью.
- issue: Добрые дела Господа
  choice: Сохранён буквальный образ того, что Господь украсил Себя добрыми делами.
  alternative: Ослабить выражение до «совершал добрые дела» или истолковать его христологически.
  rationale: Так сохраняются риторическая параллель с праведниками и богословское напряжение исходного текста без привнесённого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Повтор «добрыми делами» сохранён ради риторического параллелизма оригинала; «Сам» и «Себя» написаны с прописной буквы по принятой русской традиции почтительного обозначения Господа.
