  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: сохранены побудительное ἴδωμεν, страдательная форма «были украшены», повтор «добрыми делами», усилительное αὐτός и предшествующее действие аористного причастия κοσμήσας. Однако «также», поставленное перед «украсив», по-русски может относиться именно к способу действия, тогда как добавочность καὶ αὐτὸς δέ относится к Господу как второму примеру.'
  naturalness: «Посмотрим, что…» допустимо, но в современном русском после призыва обратить внимание двоеточие естественнее и яснее вводит содержание наблюдения. Порядок «и Сам Господь» естественно передаёт добавочно-усилительный оборот без тяжеловесного «также».
  terminology: «Праведники», «Господь», «добрые дела» и образ «украсить» точны и соответствуют умеренно возвышенному литературному регистру. Почтительное написание «Сам» и «Себя» последовательно сохранено.
