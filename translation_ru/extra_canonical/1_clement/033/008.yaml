  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: ru
  text: Итак, имея перед собой этот образец, без колебаний приступим к исполнению Его воли[a]. Всеми своими силами будем совершать дело праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без колебаний приблизимся к Его воле».'
    reason: Сохраняет необычную греческую конструкцию προσέλθωμεν τῷ θελήματι и её метафору приближения, тогда как основной текст передаёт её естественным русским выражением.
lexical_decisions:
- source_word: ὑπογραμμός
  choice: образец
  rationale: Слово обозначает пример или образец, которому надлежит следовать; это естественный и точный современный русский эквивалент.
- source_word: ἀόκνως
  choice: без колебаний
  rationale: Наречие выражает отсутствие нерешительности, боязни или промедления, а не просто рвение.
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: приступим к исполнению Его воли
  rationale: Буквально говорится о приближении к Его воле; в современном русском смысл естественно передаётся как решительное обращение к её исполнению, при этом буквальная метафора сохранена в сноске.
- source_word: ἐξ ὅλης τῆς ἰσχύος ἡμῶν
  choice: всеми своими силами
  rationale: Передаёт полноту усилия и звучит естественно в современном литературном русском.
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: будем творить дела праведности
  rationale: Сохраняет деятельный характер выражения и семантическую связь глагола ἐργάζομαι с существительным ἔργον, избегая неестественного повтора «делать дело».
theological_decisions:
- issue: Соотношение человеческого усилия и праведности
  choice: «всеми своими силами будем творить дела праведности»
  alternative: «всеми своими силами совершим дело праведности»
  rationale: Перевод сохраняет прямой призыв к деятельной праведности, не добавляя утверждений о заслуге, оправдании или механизме спасения.
- issue: Образ приближения к Божьей воле
  choice: В основном тексте передать как начало исполнения воли, а буквальный образ отметить в сноске
  alternative: «без колебаний приблизимся к Его воле»
  rationale: Буквальный вариант сохраняет метафору, но по-русски звучит неясно; основной вариант передаёт практическую направленность увещания, не устраняя исходный образ полностью благодаря сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Имея перед собой» делает связь с образцом естественной; «творить дела праведности» сохраняет возвышенный увещательный регистр без архаической тяжеловесности.
