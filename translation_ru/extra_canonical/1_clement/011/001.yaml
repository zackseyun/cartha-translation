id: 1CLEM.11.1
reference: 1 Clement 11:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: ru
  text: За гостеприимство и благочестие Лот был спасён из Содома, когда вся окрестная земля подверглась суду огнём и серой. Так Владыка ясно показал, что Он не оставляет надеющихся на Него, а уклоняющихся предаёт наказанию и мучению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: гостеприимство
  rationale: Прямо передаёт добродетель радушного приёма странников и гостей.
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: Сохраняет религиозно-нравственный смысл почтения к Богу и соответствующего образа жизни.
- source_word: τῆς περιχώρου πάσης
  choice: вся окрестная земля
  rationale: Естественно по-русски передаёт всю область вокруг Содома, не ограничивая её одним городом.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт δεσπότης как титул верховной власти; прописная буква указывает на Бога в данном контексте.
- source_word: τοὺς ἐλπίζοντας ἐπʼ αὐτὸν
  choice: надеющихся на Него
  rationale: Сохраняет направленность упования на Бога.
- source_word: τοὺς ἑτεροκλινεῖς
  choice: уклоняющихся
  rationale: Передаёт образ людей, отклоняющихся от верного пути, не уточняя сверх текста направление или предмет уклонения.
- source_word: κόλασιν καὶ αἰκισμὸν
  choice: наказанию и мучению
  rationale: 'Сохраняет два взаимосвязанных, но различимых понятия: кару и причиняемое страдание.'
theological_decisions:
- issue: Соотношение человеческих добродетелей и спасения Лота
  choice: «За гостеприимство и благочестие Лот был спасён»
  alternative: «Благодаря гостеприимству и благочестию Лот спасся»
  rationale: Пассив «был спасён» сохраняет греческое ἐσώθη и не превращает добродетели в самоспасение, одновременно не устраняя выраженную текстом причинную связь.
- issue: Значение τίθησιν применительно к уклоняющимся
  choice: «предаёт наказанию и мучению»
  alternative: «назначает на наказание и мучение»
  rationale: «Предаёт» естественно выражает помещение под наказание и не вводит более сильного учения о предопределении, чем допускает греческий глагол.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, церковно уместным регистром. Синтаксис разделён на два предложения для ясности; причинная и богословская логика оригинала сохранена. Местоимения, относящиеся к Богу, даны с прописной буквы согласно распространённой русской издательской практике.
