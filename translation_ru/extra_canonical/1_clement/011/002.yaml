source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: ru
  text: 'Ибо когда вместе с ним вышла его жена, мыслившая иначе и не пребывавшая в единомыслии, она была поставлена в знамение, так что стала соляным столпом до сего дня, чтобы всем было известно: двоедушные[a] и сомневающиеся в силе Божьей становятся судом[b] и предостережением для всех поколений.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть люди с раздвоенной душой, непостоянные в своих убеждениях.
    reason: Поясняет буквальный и несколько непривычный для современного читателя термин «двоедушные».
  - marker: b
    text: 'Или: «осуждением».'
    reason: Греческое κρίμα может обозначать как суд или судебное решение, так и осуждение.
lexical_decisions:
- source_word: ὁμόνοια
  choice: единомыслие
  rationale: Передаёт не просто согласие по отдельному вопросу, а единство мыслей и воли; это также значимое для 1 Климента понятие общественного и церковного согласия.
- source_word: δίψυχοι
  choice: двоедушные
  rationale: Сохраняет яркую метафору греческого слова — внутреннюю раздвоенность человека — и его раннехристианский нравственный оттенок.
- source_word: σημείωσις
  choice: предостережение
  rationale: В данном контексте речь идёт о наглядном знаке, предупреждающем последующие поколения; «предостережение» естественно выражает эту функцию.
- source_word: στήλη ἁλός
  choice: соляной столп
  rationale: Точное и узнаваемое соответствие образу из повествования о жене Лота.
theological_decisions:
- issue: Значение κρίμα в заключительной формуле
  choice: суд
  alternative: осуждение; пример суда
  rationale: «Суд» сохраняет широкое значение κρίμα и намеренно резкую конструкцию, в которой сами сомневающиеся становятся и судом, и предостережением; «осуждение» сузило бы смысл, а «пример суда» добавило бы отсутствующее в тексте слово.
- issue: Характер сомнения в силе Бога
  choice: сомневающиеся в силе Божьей
  alternative: колеблющиеся относительно силы Божьей
  rationale: Оба значения возможны для διστάζοντες; выбран естественный русский оборот без ослабления нравственного предупреждения автора.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён настолько, чтобы длинная греческая фраза оставалась понятной, но сохранены её причинно-следственная связь, параллелизм «судом и предостережением» и богословски значимая метафора двоедушия.
