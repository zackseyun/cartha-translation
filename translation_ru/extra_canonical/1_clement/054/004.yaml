  source_fidelity: Основной текст верно понимает πολιτείαν как образ жизни, а не политическое гражданство, и избегает ложного смысла «нераскаянный». Однако «безупречную» заметно сильнее ἀμεταμέλητον («не вызывающую сожаления; такую, о которой не приходится сожалеть»), а «перед Богом» интерпретирует неоднозначный генитив τοῦ θεοῦ без достаточного основания в основном тексте. Кроме того, ταῦτα лучше передать как «это», а не обобщающим «так».
  naturalness: Предлагаемая правка сохраняет современный литературный и естественный русский синтаксис. Сочетание «вести образ жизни» идиоматично; определение «не вызывающий сожаления» несколько книжное, но точно и уместно для памятника.
  terminology: «Образ жизни» передаёт πολιτείαν в данном контексте. Формулу «образ жизни перед Богом» следует оставить как возможное толкование в сноске, а не выдавать за единственное значение τοῦ θεοῦ. Однокоренную игру πολιτευόμενοι / πολιτείαν полностью воспроизвести по-русски нельзя; это надлежащим образом отмечается в сноске.
