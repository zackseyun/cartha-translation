  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: ru
  text: Это делали и будут делать те, кто ведёт образ жизни, не вызывающий сожаления перед Богом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…не вызывающий сожаления Божий образ жизни». Греч. πολιτευόμενοι и πολιτείαν — однокоренные слова, обозначающие жизнь и поведение; в иных контекстах они могут относиться и к гражданству.'
    reason: Сноска отмечает однокоренную конструкцию и сохраняет неоднозначность генитива τοῦ θεοῦ, не навязывая одному из возможных прочтений статус единственно верного.
lexical_decisions:
- source_word: ταῦτα
  choice: так
  rationale: В данном контексте указательное местоимение относится к описанным выше действиям; русское «так поступали» естественно передаёт сочетание ταῦτα ... ἐποίησαν без тяжеловесного «это сделали».
- source_word: οἱ πολιτευόμενοι ... πολιτείαν
  choice: те, кто ведёт ... жизнь
  rationale: Однокоренная конструкция обозначает образ жизни и поведение, а не гражданство в узкополитическом смысле. По-русски смысл естественно передаётся сочетанием «вести жизнь».
- source_word: ἀμεταμέλητον
  choice: безупречную
  rationale: Буквально — «не вызывающую сожаления, такую, о которой не приходится раскаиваться». «Безупречную» ясно передаёт положительную нравственную оценку и не создаёт ложного смысла «нераскаянную».
- source_word: τοῦ θεοῦ
  choice: перед Богом
  rationale: Генитив допускает связь этой жизни с Богом. «Перед Богом» в данном контексте естественно выражает жизнь, получающую одобрение Бога, при этом буквальная конструкция отмечена в сноске.
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: поступали и будут поступать
  rationale: Сохраняются аорист и будущее время; глагол «поступать» идиоматично сочетается с предшествующим «так».
theological_decisions:
- issue: Связь генитива τοῦ θεοῦ с πολιτείαν
  choice: «жизнь перед Богом»
  alternative: «Божий образ жизни» / «образ жизни Бога»
  rationale: Греческий генитив формально неоднозначен. В контексте речь, вероятнее всего, о человеческом образе жизни, одобряемом Богом или проживаемом перед Ним, а не о собственном образе жизни Бога. Сноска сохраняет более буквальную связь.
- issue: Значение ἀμεταμέλητον
  choice: «безупречную»
  alternative: «не вызывающую сожаления»
  rationale: Слово означает нечто, о чём не приходится сожалеть или раскаиваться. Выбор избегает ошибочного «нераскаянную», которое по-русски означало бы отсутствие покаяния в грехе.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Основной текст избегает неестественных выражений «нераскаянный образ жизни» и узкополитического «гражданство», сохраняя языковые оттенки в сноске.
