  text: Τίς οὖν ἐν ὑμῖν γενναῖος, τίς εὔσπλαγχνος, τίς πεπληροφορημένος ἀγάπης;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/001.yaml
  text: Who then among you is noble? Who is compassionate? Who is filled with love?
translation:
  language: ru
  text: Итак, кто среди вас благороден? Кто сострадателен? Кто исполнен любви?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  choice: благороден
  rationale: Передаёт нравственную доблесть и благородство человека без неоправданного сужения до храбрости.
- source_word: εὔσπλαγχνος
  choice: сострадателен
  rationale: Естественный современный эквивалент со значением сердечного милосердия и сочувствия.
- source_word: πεπληροφορημένος ἀγάπης
  choice: исполнен любви
  rationale: Пассивное причастие с родительным содержания здесь означает полноту любви; это лучше соответствует конструкции, чем значение «твёрдо уверен в любви».
theological_decisions:
- issue: Значение πεπληροφορημένος ἀγάπης
  choice: исполнен любви
  alternative: твёрдо уверен в любви
  rationale: Родительный ἀγάπης естественно понимается как родительный содержания; перевод сохраняет акцент на полноте любви и не привносит идею субъективной уверенности.
translation_notes:
  register: Современный литературный русский язык; три параллельных риторических вопроса сохранены. Тон краткий, возвышенный и понятный широкому читателю.
