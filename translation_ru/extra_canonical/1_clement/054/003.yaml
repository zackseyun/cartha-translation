id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: ru
  text: Тот, кто сделает это[a], приобретёт себе великую славу в Мессии, и всякое место примет его. Ибо Господня — земля и всё, что наполняет её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, кто совершил это».'
    reason: Аористное причастие ὁ ποιήσας можно передать как предшествующее завершённое действие, хотя в данном контексте естественно и перспективное «кто сделает».
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: тот, кто сделает
  rationale: Субстантивированное причастие аориста обозначает человека, который совершит названный поступок; в связи с будущим περιποιήσεται по-русски естественно передать его будущим временем. Сноска сохраняет возможность более аспектуально-буквального прочтения.
- source_word: μέγα κλέος
  choice: великую славу
  rationale: κλέος означает славу, известность или доброе имя; «великая слава» сохраняет возвышенный регистр и естественно звучит по-русски.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός передаёт мессианский титул; формулировка сохраняет конструкцию ἐν и не уточняет характер связи вопреки исходному тексту.
- source_word: περιποιήσεται
  choice: приобретёт себе
  rationale: Средний залог выражает приобретение или обретение для себя; эта формулировка передаёт и значение глагола, и его рефлексивный оттенок.
- source_word: τὸ πλήρωμα αὐτῆς
  choice: всё, что наполняет её
  rationale: Идиоматическая русская передача буквального «её полнота», сохраняющая смысл ветхозаветной цитаты.
theological_decisions:
- issue: Значение выражения ἐν Χριστῷ
  choice: в Мессии
  alternative: через Мессию / благодаря Мессии
  rationale: Предлог ἐν не следует без необходимости превращать в указание на средство или причину; буквальная конструкция сохраняет богословскую открытость выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещевания. В заключительной цитате сохранён библейский параллелизм без архаического оборота «полнота её».
