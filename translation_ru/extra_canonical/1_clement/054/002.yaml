- from: 'Пусть он скажет: «Если из-за меня возникли раздор, распря и расколы, я отступлю и уйду, куда вы пожелаете, и исполню всё, что велит большинство. Только пусть стадо Мессии живёт в мире с поставленными пресвитерами[a]».'
  to: 'Пусть он скажет: «Если из-за меня есть раздор, распря и расколы, я отступлю и уйду, куда вы пожелаете, и исполню всё, что велит большинство. Только пусть стадо Мессии живёт в мире с поставленными пресвитерами[a]».'
