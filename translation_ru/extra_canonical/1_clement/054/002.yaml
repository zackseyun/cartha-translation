source:
  edition: Funk 1901 (normalized OCR)
  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: ru
  text: 'Пусть он скажет: «Если из-за меня есть раздор, распря и расколы, я отступлю и уйду, куда вы пожелаете, и исполню всё, что велит большинство. Только пусть стадо Мессии живёт в мире с поставленными пресвитерами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с пресвитерами, которые были поставлены».'
    reason: Отражает более развёрнутый способ передачи греческого атрибутивного причастия καθεσταμένων.
lexical_decisions:
- source_word: στάσις
  choice: раздор
  rationale: Передаёт общественный конфликт и противостояние, сохраняя отличие от следующего ἔρις («распря») и σχίσματα («расколы»).
- source_word: ἐκχωρῶ, ἄπειμι
  choice: я отступлю и уйду
  rationale: 'Сохраняет два последовательных глагола: готовность устраниться и покинуть место, при этом по-русски звучит естественно.'
- source_word: τὸ πλήθος
  choice: большинство
  rationale: Передаёт собирательную группу, чьё решение должно быть исполнено, не сужая значение до духовенства или иного конкретного органа.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Передаёт титульное значение Χριστός и соответствует принятому в POB различению титула и имени.
- source_word: πρεσβυτέρων
  choice: пресвитерами
  rationale: Сохраняет раннехристианский термин без преждевременного отождествления с позднейшей конкретной церковной должностью.
theological_decisions:
- issue: Статус καθεσταμένων πρεσβυτέρων
  choice: поставленные пресвитеры
  alternative: пресвитеры, которые были поставлены
  rationale: Краткая атрибутивная конструкция сохраняет указание на их установленное положение, не уточняя, кем и каким способом они были поставлены.
- issue: Χριστός как титул
  choice: Мессия
  alternative: Христос
  rationale: Выбран прозрачный перевод греческого титула без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксический параллелизм и трёхчленное перечисление сохранены; формулировки остаются понятными широкому читателю.
