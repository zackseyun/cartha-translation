source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: ru
  text: 'И сказала она тем мужчинам: «Я точно знаю, что Господь Бог отдаёт вам эту землю, потому что страх и ужас перед вами объяли её жителей. Поэтому, когда вы овладеете ею, спасите меня и дом моего отца».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω ἐγώ
  choice: Я точно знаю
  rationale: Сочетание причастия с личной формой того же глагола выражает усиленную уверенность; естественный русский эквивалент передаёт эмфазу без буквального повтора.
- source_word: παραδίδωσιν
  choice: отдаёт
  rationale: Настоящее время сохранено; глагол обозначает передачу земли во власть адресатов.
- source_word: ὁ φόβος καὶ ὁ τρόμος ὑμῶν
  choice: страх и ужас перед вами
  rationale: Родительный ὑμῶν здесь указывает на объект страха; формулировка сохраняет два близких по смыслу существительных исходного текста.
- source_word: ἐπέπεσεν
  choice: объяли
  rationale: Передаёт образ страха и ужаса, внезапно охвативших жителей, при согласовании с однородным составным подлежащим в русском.
- source_word: διασώσατέ
  choice: сохраните жизнь
  rationale: Глагол означает безопасно спасти или сохранить; добавление «жизнь» естественно выражает подразумеваемый объект просьбы в русском.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: дому моего отца
  rationale: '«Дом» сохраняет возможную широту значения: семья или домочадцы, а не только строение.'
theological_decisions:
- issue: Божественное имя и титул в выражении κύριος ὁ θεός
  choice: Господь Бог
  alternative: Господь, Бог
  rationale: Традиционное и естественное русское сочетание точно передаёт два греческих обозначения без внесения дополнительного толкования.
- issue: Вид и время передачи земли
  choice: отдаёт вам эту землю
  alternative: отдаст вам эту землю
  rationale: Сохранено настоящее время греческого παραδίδωσιν, которое представляет действие Бога как уже совершающееся, хотя овладение землёй ещё впереди.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; усиление греческой конструкции передано наречием «точно», а образ «дома отца» сохранён без сужения до здания или только кровных родственников.
