source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ προσέθεντο αὐτῇ δοῦναι σημεῖον, ὅπως ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς κόκκινον, πρόδηλον ποιοῦντες, ὅτι διὰ τοῦ αἵματος τοῦ κυρίου λύτρωσις ἔσται πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: ru
  text: И они дали ей знак[a], чтобы она свесила из своего дома нечто алое. Тем самым они ясно показали, что через кровь Господа будет избавление для всех, кто верит и уповает на Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И они добавили дать ей знак»; это оборот со значением «и они затем дали ей знак» или «и они также дали ей знак».'
    reason: Греческая семитизированная конструкция προσέθεντο ... δοῦναι допускает оттенок продолжения либо добавочности действия, который невозможно полностью отразить кратким естественным переводом.
lexical_decisions:
- source_word: προσέθεντο ... δοῦναι
  choice: дали
  rationale: Семитизированная конструкция, обычная для языка Септуагинты, здесь означает продолжение или дополнительное действие, а не обещание дать знак в будущем. Простое «дали» естественно передаёт состоявшееся действие.
- source_word: σημεῖον
  choice: знак
  rationale: 'Сохраняет основной смысл греческого слова: условленный опознавательный знак, одновременно получающий символическое значение.'
- source_word: ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς
  choice: свесить со своего дома
  rationale: Передаёт действие вывешивания наружу из дома без добавления отсутствующего в тексте предмета.
- source_word: κόκκινον
  choice: нечто алое
  rationale: Субстантивированное прилагательное обозначает алый предмет или материал, но сам предмет в греческом не назван; вариант не добавляет «шнур» или «верёвку».
- source_word: πρόδηλον ποιοῦντες
  choice: Тем самым они ясно показали
  rationale: Причастие относится к тем, кто дал знак; отдельное предложение делает эту связь ясной и естественной по-русски.
- source_word: λύτρωσις
  choice: избавление
  rationale: Передаёт освобождение или искупительное избавление и не сужает значение до одной поздней богословской формулы.
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: верит и уповает на Бога
  rationale: Сохраняет два координированных отношения к Богу — веру и надежду; «уповает» уместно в современном возвышенном религиозном регистре.
theological_decisions:
- issue: Типологическая связь алого знака с кровью Господа
  choice: Сохранить прямое авторское истолкование без поясняющих добавлений
  alternative: Назвать этот знак прообразом или символом крови Христа
  rationale: Греческий текст говорит, что данным знаком они ясно показали избавление через кровь Господа, но не употребляет технических терминов «прообраз» или «символ».
- issue: Будущее значение ἔσται
  choice: «придёт избавление»
  alternative: «будет избавление»
  rationale: Оба варианта возможны; «придёт избавление» естественно выражает будущую направленность и не решает дополнительно вопрос о времени или способе исполнения.
- issue: Объём πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν
  choice: «ко всем, кто верит и уповает»
  alternative: «для всех верующих и уповающих»
  rationale: Сохраняется всеобщность внутри обозначенной группы и обе характеристики без деноминационного уточнения природы веры.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского текста. Синтаксис упрощён для ясности, но сохранены богословская напряжённость, будущее время и неопределённость предмета, обозначенного словом κόκκινον.
