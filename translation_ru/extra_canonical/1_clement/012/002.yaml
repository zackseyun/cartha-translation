base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: ru
  text: Ибо когда Иисусом, сыном Навина, были посланы в Иерихон соглядатаи, царь той земли узнал, что они пришли разведать его землю, и послал людей, чтобы схватить их, дабы их предали смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπεμφθέντων ... κατασκόπων
  choice: когда ... послал разведчиков
  rationale: Греческий абсолютный генитив естественно передан придаточным времени; «разведчики» точно и современно передаёт κατάσκοποι.
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: Иисус, сын Навина
  rationale: Устойчивое русское библейское именование Иисуса Навина с явным воспроизведением родственной связи исходного текста.
- source_word: ὁ βασιλεὺς τῆς γῆς
  choice: царь той земли
  rationale: Указательное «той» естественно обозначает упомянутую область и не добавляет имени царя, отсутствующего в греческом тексте.
- source_word: κατασκοπεῦσαι τὴν χώραν αὐτῶν
  choice: разведать их землю
  rationale: Сохраняется местоимение αὐτῶν и близкая лексическая связь с γῆς, без более политически окрашенного «страну».
- source_word: τοὺς συλλημψομένους αὐτούς
  choice: людей схватить их
  rationale: Естественно по-русски выражает целевое значение причастия будущего времени.
- source_word: ὅπως συλληφθέντες θανατωθῶσιν
  choice: чтобы после захвата предать смерти
  rationale: Передаёт последовательность захвата и казни, а также пассивный смысл θανατωθῶσιν, в достойном литературном регистре.
