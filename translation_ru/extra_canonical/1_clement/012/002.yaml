revisions:
- from: Ибо когда Иисус, сын Навина, послал разведчиков в Иерихон, царь той земли узнал, что они пришли разведать их землю, и послал людей схватить их, чтобы после захвата предать смерти.
  to: Ибо когда Иисусом, сыном Навина, были посланы в Иерихон соглядатаи, царь той земли узнал, что они пришли разведать его землю, и послал людей, чтобы схватить их, дабы их предали смерти.
  rationale: 'Устранена двусмысленность местоимения: «его землю» соотнесено с «царём той земли», что передаёт αὐτῶν как землю подвластного ему народа/области, не приписывая её соглядатаям. Концовка передана ясной русской целевой конструкцией с сохранением пассивности «были схвачены/преданы смерти» по смыслу греческого. Порядок первой части приближен к пассивной форме оригинала.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: посылка соглядатаев, осведомлённость царя, приказ схватить их и цель предать смерти. Однако в исходнике субъект посылки выражен пассивно («когда соглядатаи были посланы Иисусом, сыном Навина»); активная перестройка допустима, но здесь менее близка к оригиналу. Кроме того, αὐτῶν в «τὴν χώραν αὐτῶν» относится к жителям/властям той земли, а не к соглядатаям; русское «их землю» после «они» создаёт нежелательную двусмысленность.'
  naturalness: Фраза в целом литературна, но «после захвата предать смерти» без дополнения звучит канцелярски и оставляет невыраженным, кого именно предают смерти. «Схватить их, чтобы, схватив, предать смерти» также повторяло бы глагол; естественнее «чтобы тех схватили и предали смерти».
  terminology: «Иисус, сын Навина» корректно воспроизводит Ἰησοῦ τοῦ τοῦ Ναυὴ и соответствует русской библейской традиции. «Соглядатаи» — точный литературно-библейский эквивалент κατάσκοποι; «разведчики» также возможно, но менее согласуется с повествовательным библейским регистром. «Земля» уместна для γῆ/χώρα без излишней политической конкретизации.
  issues:
  - severity: medium
    issue: Двусмысленная отсылка местоимения в «разведать их землю».
    rationale: Ближайший грамматический референт «они» — разведчики, поэтому «их землю» может быть прочитано как земля разведчиков, хотя αὐτῶν обозначает людей той земли.
  - severity: medium
    issue: Не вполне естественная и неполная конструкция «чтобы после захвата предать смерти».
    rationale: Оригинал прямо сообщает, что соглядатаев должны были схватить и предать смерти; в русском лучше назвать их в пассивной целевой конструкции.
  - severity: low
    issue: Активная передача «Иисус ... послал» сглаживает пассивную форму генитива абсолютного.
    rationale: Смысл не меняется, но пассивная конструкция ближе к греческому построению и естественна в русском.
  revised_text: Ибо когда Иисусом, сыном Навина, были посланы в Иерихон соглядатаи, царь той земли узнал, что они пришли разведать его землю, и послал людей, чтобы схватить их, дабы их предали смерти.
