- source_word: φιλόξενος
  choice: гостеприимная
  rationale: Передаёт атрибутивное прилагательное как эпитет при имени Раав, сохраняя риторический акцент греческого текста.
- source_word: εἰσδεξαμένη
  choice: приняла
  rationale: Естественно передаёт радушный приём людей в дом; последовательность действий выражена русскими однородными сказуемыми.
- source_word: ὑπερῷον
  choice: верхняя комната
  rationale: Обозначает помещение на верхнем этаже; формулировка понятна современному читателю и не уточняет устройство дома сверх текста.
- source_word: λινοκαλάμην
  choice: стеблями льна
  rationale: Передаёт льняные стебли, под которыми были спрятаны люди; собирательное единственное греческого текста естественно выражено множественным числом.
