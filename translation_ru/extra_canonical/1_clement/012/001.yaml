  text: Раав, проститутка, была спасена благодаря вере и гостеприимству.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πίστιν καὶ φιλοξενίαν
  choice: Благодаря вере и гостеприимству
  rationale: Предлог διά с винительным указывает здесь на основание или средство спасения; «благодаря» естественно передаёт положительную причинно-средственную связь. Оба существительных сохранены без уточнений.
- source_word: ἐσώθη
  choice: была спасена
  rationale: Аорист пассивного залога передан завершённым действием в страдательной конструкции, без добавления явно не названного деятеля.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: блудница Раав
  rationale: Определение ἡ πόρνη сохранено прямо; традиционная русская форма имени — «Раав». Такой порядок слов звучит естественно и сохраняет смысл греческого приложения.
theological_decisions:
- issue: Связь веры и гостеприимства со спасением Раав
  choice: Оба качества названы совместно как основание или средство её спасения.
  alternative: Истолковать гостеприимство лишь как следствие веры либо уточнить, что речь идёт исключительно о физическом избавлении.
  rationale: Греческий текст соединяет πίστιν и φιλοξενίαν одним διά и не устанавливает между ними иерархии, а также не уточняет природу спасения; эта смысловая напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Лексема «блудница» выбрана как dignified библейски узнаваемое, но понятное современному читателю обозначение; синтаксис остаётся естественным и близким к греческому.
