  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: ru
  text: Видите, возлюбленные, что в этой женщине были не только вера, но и пророчество.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Видите
  rationale: Настоящее время повелительного или изъявительного наклонения формально совпадает; русский оборот «Видите… что» естественно сохраняет это побуждение обратить внимание на вывод.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Традиционное, dignified и понятное обращение, точно передающее значение «любимые, дорогие».
- source_word: ἐν τῇ γυναικί
  choice: в этой женщине
  rationale: Предлог ἐν передан прямо; определённый артикль указывает на уже упомянутую женщину, что по-русски естественно выражается указательным местоимением «этой».
- source_word: γέγονεν
  choice: были
  rationale: Перфект γίνομαι здесь указывает на наличие или проявление веры и пророчества в женщине. Русское «были» звучит естественно и не привносит оттенка обнаружения, которого в тексте нет.
theological_decisions:
- issue: Значение «пророчество» применительно к женщине
  choice: пророчество
  alternative: дар пророчества; способность пророчествовать
  rationale: Сохранено отвлечённое существительное προφητεία без уточнения, означает ли оно дар, произнесённое предсказание или пророческое действие; тем самым не снимается смысловая широта оригинала.
- issue: Соотношение веры и пророчества
  choice: не только вера, но и пророчество
  alternative: как вера, так и пророчество
  rationale: Сохранена усилительная конструкция οὐ μόνον… ἀλλὰ καί и авторский акцент на добавлении пророчества к вере.
translation_notes:
  register: Современный литературный русский с умеренно торжественным раннехристианским звучанием. Синтаксис прост и понятен; «возлюбленные» сохраняет эпистолярный регистр.
