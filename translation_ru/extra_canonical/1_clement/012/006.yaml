source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: ru
  text: 'И они сказали ей: «Пусть будет так, как ты сказала нам. Когда же узнаешь, что мы приближаемся, собери всех своих под свою крышу, и они спасутся; ведь все, кто окажется вне дома, погибнут».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται οὕτως
  choice: Пусть будет так
  rationale: Естественно передаёт согласие с условием; буквальное «будет так» по-русски здесь звучало бы менее идиоматично.
- source_word: ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς
  choice: Когда же узнаешь, что мы приближаемся
  rationale: Сохраняет временно-условный оттенок конструкции и значение прибытия/приближения у παραγίνομαι.
- source_word: πάντας τοὺς σοὺς
  choice: всех своих
  rationale: Греческое выражение не уточняет степень родства или состав группы; русский вариант сохраняет эту обобщённость.
- source_word: ὑπὸ τὸ στέγος σου
  choice: под своей крышей
  rationale: Передаёт образ источника буквально и естественно для русского языка.
- source_word: διασωθήσονται
  choice: спасутся
  rationale: Глагол обозначает сохранение от грозящей гибели; «спасутся» уместно в данном повествовательном контексте.
- source_word: ὅσοι γὰρ ἐὰν εὑρεθῶσιν
  choice: ведь все, кто окажется
  rationale: Передаёт обобщающее значение ὅσοι ἐὰν и пассивную идею обнаружения без тяжеловесного «будут найдены».
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Прямое и контекстуально точное обозначение гибели.
theological_decisions: []
