  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: ru
  text: 'Когда же люди царя явились и сказали: «К тебе вошли разведчики нашей земли; выведи их, ибо так повелевает царь», — она ответила: «Люди, которых вы ищете, действительно вошли ко мне, но сразу ушли и идут по дороге», — указывая им другой путь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: подступили к ней
  rationale: Передаёт приближение и появление рядом, сохраняя оттенок греческого ἐφίστημι точнее, чем простое «пришли», и звучит естественно по-русски.
- source_word: τῶν περὶ τοῦ βασιλέως
  choice: люди царя
  rationale: Естественное обозначение царских служителей или посланников без излишнего уточнения их должности.
- source_word: οἱ κατάσκοποι τῆς γῆς ἡμῶν
  choice: разведчики нашей земли
  rationale: 'Сохраняет формальную неоднозначность родительного оборота: это могут быть разведчики, связанные с землёй, либо разведывающие её; контекст не внесён прямо в перевод.'
- source_word: εὐθέως ἀπῆλθον
  choice: тут же ушли
  rationale: Кратко и естественно передаёт немедленность действия.
- source_word: πορεύονται τῇ ὁδῷ
  choice: теперь идут своей дорогой
  rationale: Передаёт продолжающееся движение по пути без неестественного буквального оборота «идут по дороге».
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  choice: а сама указала им в другую сторону
  rationale: Следует очевидному смыслу заключительной фразы и консультационному тексту; противопоставление «а сама» ясно показывает расхождение между её словами и указанным направлением.
