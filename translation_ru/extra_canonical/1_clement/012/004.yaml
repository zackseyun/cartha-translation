revisions:
- from: 'Когда же люди царя подступили к ней и сказали: «К тебе вошли разведчики нашей земли; выведи их, ибо так повелевает царь», — она ответила: «Люди, которых вы ищете, действительно вошли ко мне, но тут же ушли и теперь идут своей дорогой», — а сама указала им в другую сторону.'
  to: 'Когда же люди царя явились и сказали: «К тебе вошли разведчики нашей земли; выведи их, ибо так повелевает царь», — она ответила: «Люди, которых вы ищете, действительно вошли ко мне, но сразу ушли и идут по дороге», — указывая им другой путь.'
  rationale: 'Перевод уточнён по греческому тексту и английской контрольной версии: ἐπισταθέντων передано без избыточного оттенка «подступить», а заключительное причастие сохранено как одновременное действие Раав. Смысл намеренного направления царских людей по иному пути передан без догматических или оценочных добавлений.'
