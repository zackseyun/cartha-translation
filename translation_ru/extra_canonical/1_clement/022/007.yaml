source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκέκραξεν ὁ δίκαιος, καὶ ὁ κύριος εἰσήκουσεν αὐτοῦ καὶ ἐκ πασῶν τῶν θλίψεων αὐτοῦ ἐῤῥύσατο αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/007.yaml
  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: ru
  text: Праведник воззвал, и Господь услышал его и избавил его от всех скорбей его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέκραξεν
  choice: воззвал
  rationale: Передаёт интенсивное обращение к Богу и сохраняет возвышенный, псалмический регистр греческой цитаты.
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Естественный и точный русский эквивалент субстантивированного прилагательного в единственном числе.
- source_word: εἰσήκουσεν
  choice: услышал
  rationale: В контексте подразумевает благосклонное принятие мольбы, однако перевод не добавляет отсутствующее в форме глагола пояснение.
- source_word: θλίψεων
  choice: скорбей
  rationale: Сохраняет широкий смысл бедствий, тягот и притеснений, а также узнаваемый псалмический язык.
- source_word: ἐῤῥύσατο
  choice: избавил
  rationale: Точно выражает спасительное освобождение из бедствий без ненужного уточнения способа избавления.
theological_decisions:
- issue: Характер Господнего слышания
  choice: «Господь услышал его»
  alternative: «Господь внял ему»
  rationale: Выбрана более понятная современному читателю формулировка; богословский смысл действенного ответа раскрывается следующим глаголом «избавил».
- issue: Объём избавления
  choice: «от всех скорбей его»
  alternative: «от всех его бедствий»
  rationale: «Скорбей» сохраняет традиционный библейский регистр и широкий смысл θλίψεις, не сужая его до внутренней печали.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и повтор местоимения сохранены ради близости к греческому тексту.
