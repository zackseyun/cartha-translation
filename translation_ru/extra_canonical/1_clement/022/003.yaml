source:
  edition: Funk 1901 (normalized OCR)
  text: παῦσον τὴν γλῶσσάν σου ἀπὸ κακοῦ, καὶ χείλη σου τοῦ μὴ λαλῆσαι δόλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/003.yaml
  text: Keep your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: ru
  text: Удерживай язык свой от зла[a], и уста свои — от коварных слов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Останови язык свой».'
    reason: παῦσον буквально может обозначать прекращение действия; основной текст естественно передаёт смысл как удержание языка от зла.
lexical_decisions:
- source_word: παῦσον
  choice: Удерживай
  rationale: В сочетании «язык от зла» передаёт прекращение и дальнейшее воздержание естественнее для современного русского, чем буквальное «останови».
- source_word: γλῶσσάν
  choice: язык
  rationale: Сохраняет образ и форму исходного текста.
- source_word: κακοῦ
  choice: зла
  rationale: 'Прямое и контекстуально открытое соответствие: речь может идти как о злой речи, так и о зле шире.'
- source_word: χείλη
  choice: уста
  rationale: Сохраняет поэтический параллелизм и достойный библейский регистр; «губы» здесь звучало бы менее естественно.
- source_word: λαλῆσαι δόλον
  choice: коварных слов
  rationale: Передаёт речевой смысл λαλῆσαι и δόλος как обман, хитрость или коварство; по-русски естественнее, чем «говорить коварство».
theological_decisions:
- issue: Объём значения κακοῦ
  choice: зла
  alternative: злых слов
  rationale: Не сужает общее «зло» до одной лишь злой речи и сохраняет напряжение оригинала.
- issue: Значение δόλος
  choice: коварных слов
  alternative: лжи
  rationale: «Коварство» шире прямой лжи и лучше сохраняет оттенок обманного умысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим параллелизмом. Формы «язык свой» и «уста свои» сохраняют ритм и образность без архаической грамматики.
