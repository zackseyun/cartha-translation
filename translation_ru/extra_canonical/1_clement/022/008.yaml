source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: ru
  text: 'Много скорбей у праведника, и от всех них избавит его Господь. Затем: «Много ударов постигнет грешника, а тех, кто уповает на Господа, окружит милость».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: скорбей
  rationale: Передаёт страдания, бедствия и притеснения естественным и традиционно понятным русским словом.
- source_word: ῥύσεται
  choice: избавит
  rationale: Точно выражает спасение от бедствий; будущее время греческого глагола сохранено.
- source_word: μάστιγες
  choice: ударов
  rationale: Буквально слово означает удары бича; «удары» сохраняет образ наказания и звучит естественнее, чем буквальное «бичи».
- source_word: ἐλπίζοντας ἐπὶ κύριον
  choice: кто уповает на Господа
  rationale: «Уповать на» естественно передаёт направленное к Господу доверие и надежду.
- source_word: ἔλεος
  choice: милость
  rationale: Основное значение в данном богословском и псалмическом контексте.
theological_decisions:
- issue: Связь Господа с избавлением праведника
  choice: «избавит его Господь»
  alternative: «Господь спасёт его»
  rationale: «Избавит» точнее сохраняет смысл освобождения от перечисленных скорбей, не расширяя его до более общего понятия спасения.
- issue: Объект окружающей милости выражен множественным числом
  choice: «тех, кто уповает на Господа, окружит милость»
  alternative: «уповающего на Господа окружит милость»
  rationale: Сохранено множественное число греческого τοὺς ... ἐλπίζοντας и не сведено к обобщённому единственному числу.
translation_notes:
  register: Современный литературный русский с достоинством псалмической цитаты. Синтаксис сделан естественным для обычного читателя; союз «но» передаёт подразумеваемое противопоставление двух частей первой строки. Кавычки открываются только после вводного «Затем:», в соответствии с предоставленной сегментацией и контекстом продолжающейся ранее цитаты.
