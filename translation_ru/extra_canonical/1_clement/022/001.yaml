  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: ru
  text: 'И всё это подтверждает вера во Христа[a]. Ведь Он Сам через Святого Духа так призывает нас: «Придите, дети, послушайте меня; я научу вас страху Господню».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вера, которая во Христе».'
    reason: Сохраняет более буквальную возможность передачи греческого выражения ἡ ἐν Χριστῷ πίστις.
lexical_decisions:
- source_word: βεβαιοῖ
  choice: подтверждает
  rationale: Передаёт значение «удостоверяет, подкрепляет, подтверждает» и естественно сочетается с утверждениями, изложенными выше.
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: вера во Христа
  rationale: Наиболее естественная русская передача выражения в данном контексте; при этом буквальная конструкция «вера, которая во Христе» сохранена в сноске как возможное прочтение.
- source_word: προσκαλεῖται ἡμᾶς
  choice: призывает нас к Себе
  rationale: Средний залог глагола προσκαλέομαι допускает оттенок призыва к себе; такая передача сохраняет его, не сводя выражение к простому «обращается к нам».
- source_word: φόβον κυρίου
  choice: страху Господню
  rationale: Устойчивое и понятное библейское выражение, точно передающее родительный оборот и религиозный смысл φόβος.
theological_decisions:
- issue: К кому относится αὐτός («Он Сам»)?
  choice: Сохранено местоимение «Он Сам» без замены на имя
  alternative: «Сам Христос»
  rationale: Ближайший контекст указывает на Христа, однако греческий текст использует местоимение; его сохранение не устраняет формальную неоднозначность.
- issue: Значение выражения ἡ ἐν Χριστῷ πίστις
  choice: «вера во Христа»
  alternative: «вера, которая во Христе»
  rationale: Основной вариант идиоматичен и контекстуально вероятен, а альтернативный сохраняет возможное более буквальное понимание ἐν Χριστῷ.
- issue: Оттенок среднего залога προσκαλεῖται
  choice: «призывает нас к Себе»
  alternative: «призывает нас»
  rationale: Основной вариант явно передаёт рефлексивный оттенок среднего залога, тогда как более нейтральная передача тоже возможна и приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Цитата оформлена естественно и без архаизмов; «страх Господень» сохранён как узнаваемое богословское выражение. Прописные буквы в «Он Сам» и «Себе» отражают почтительное русское употребление, не заменяя местоимение толковательным уточнением.
