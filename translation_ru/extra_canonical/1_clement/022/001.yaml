    rationale: Средний залог προσκαλεῖται может нести оттенок призыва к себе, но прямое дополнение ἡμᾶς выражает прежде всего «призывает/созывает нас». Добавление «к Себе» делает невыраженное направление частью основного текста. Английский аудит также предпочитает «calls us», а не более развёрнутую передачу.
