source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: ru
  text: Очи Господа обращены к праведным, и уши Его — к их мольбе; но лицо Господа — против делающих зло, чтобы истребить с земли память о них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: Очи Господа обращены к праведным
  rationale: «Очи» сохраняет достоинство и библейскую образность, а «обращены к» естественно передаёт направленность ἐπί без излишне буквального «на».
- source_word: ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν
  choice: уши Его — к их мольбе
  rationale: Сохранён параллелизм оригинала; δέησις означает настоятельную молитву или просьбу, поэтому выбрано ёмкое «мольба».
- source_word: πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά
  choice: но лицо Господа — против делающих зло
  rationale: Здесь ἐπί в контексте Божьего противостояния естественно передано словом «против»; причастная конструкция сохранена без сужения значения κακά до конкретного вида зла.
- source_word: ἐξολεθρεῦσαι
  choice: истребить
  rationale: Глагол выражает полное уничтожение или устранение; «истребить» передаёт его силу и соответствует возвышенному регистру.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: память о них
  rationale: В данном контексте речь идёт о сохраняющемся воспоминании или упоминании о злодеях, а не о памятнике либо поминальном даре.
theological_decisions:
- issue: Антропоморфные образы глаз, ушей и лица Господа
  choice: Сохранить образы буквально
  alternative: 'Передать толковательно: «Господь видит», «слышит» и «противится»'
  rationale: Оригинал намеренно использует телесную образность и поэтический параллелизм; толковательная замена обеднила бы форму и могла бы преждевременно разрешить её богословское напряжение.
- issue: Цель или результат в τοῦ ἐξολεθρεῦσαι
  choice: «чтобы истребить»
  alternative: «так что будет истреблена»
  rationale: Артиклированный инфинитив с τοῦ естественно выражает цель; формулировка сохраняет направленность действия Господа, не добавляя пояснений о способе исполнения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и псалмоподобного параллелизма. Архаизирующее «очи» использовано как узнаваемый высокий библейский образ; остальная лексика остаётся понятной современному читателю. Пунктуационные тире воспроизводят эллиптическую структуру греческого текста.
