source:
  edition: Funk 1901 (normalized OCR)
  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: ru
  text: Он повелел, чтобы и приношения, и служения совершались не произвольно и не беспорядочно, а в установленные времена и часы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφοράς
  choice: приношения
  rationale: Передаёт культовые приношения в контексте установленного порядка богослужения, не сужая значение до одного вида жертв.
- source_word: λειτουργίας
  choice: служения
  rationale: В данном культовом контексте обозначает предписанные священные служения; «служения» сохраняет широту греческого слова.
- source_word: ἐπιτελεῖσθαι
  choice: совершались
  rationale: Естественно передаёт исполнение обрядовых действий и согласуется с обоими существительными.
- source_word: εἰκῇ
  choice: как попало
  rationale: Выражает действие наугад, без установленного замысла или порядка; по-русски звучит ясно и естественно.
- source_word: ἀτάκτως
  choice: без порядка
  rationale: Сохраняет прямой смысл наречия и его отличие от εἰκῇ, не усиливая его до открытого беспорядка.
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: в установленные времена и часы
  rationale: Точно сохраняет оба временных обозначения и противопоставление случайному, неупорядоченному совершению.
theological_decisions:
- issue: Референт подразумеваемого подлежащего ἐκέλευσεν
  choice: Он
  alternative: Бог / Господь
  rationale: Греческий текст имеет подразумеваемое подлежащее, определяемое контекстом; местоимение сохраняет связь с предшествующим текстом и не добавляет отсутствующего здесь имени.
- issue: Характер λειτουργίαι
  choice: служения
  alternative: богослужения / священнослужения
  rationale: Более узкие варианты могли бы заранее определить институциональный или литургический смысл; «служения» сохраняет смысловую широту оригинала.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Парные конструкции греческого текста сохранены; разговорное «как попало» выбрано как наиболее естественный и точный эквивалент εἰκῇ, тогда как «без порядка» отдельно передаёт ἀτάκτως.
