base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: ru
  text: Он Сам Своей высочайшей волей определил, где и через кого желает, чтобы это совершалось[a], чтобы всё, совершаемое свято и по Его благоволению, было угодно Его воле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «…чтобы всё, совершаемое свято, по Его благоволению было угодно Его воле».'
    reason: 'Сохраняет неоднозначность синтаксической связи ἐν εὐδοκήσει: с «совершаемое» либо с «было угодно».'
lexical_decisions:
- source_word: ἐπιτελεῖσθαι
  choice: совершалось
  rationale: Передаёт совершение предписанных ранее служений или действий без излишнего уточнения отсутствующего в данном стихе объекта.
- source_word: διὰ τίνων
  choice: через кого
  rationale: Сохраняет посредническое значение διά с родительным падежом и личный характер местоимения.
- source_word: τῇ ὑπερτάτῃ αὐτοῦ βουλήσει
  choice: Своей высочайшей волей
  rationale: Естественно передаёт превосходную степень ὑπερτάτῃ и инструментальный оттенок дательного падежа.
- source_word: ὁσίως
  choice: свято
  rationale: Наречие передаёт совершение всего благочестивым, соответствующим святыне образом.
- source_word: ἐν εὐδοκήσει
  choice: по Его благоволению
  rationale: Сохраняет смысл благоволения и наиболее естественно связывается с γινόμενα, хотя синтаксическая связь допускает и отнесение к приемлемости.
- source_word: εὐπρόσδεκτα
  choice: угодно
  rationale: Передаёт значение приемлемости и благосклонного принятия естественным русским выражением с дательным «Его воле».
theological_decisions:
- issue: Связь оборота ἐν εὐδοκήσει
  choice: «совершаемое свято и по Его благоволению»
  alternative: «было по благоволению угодно Его воле»
  rationale: Оборот может быть отнесён либо к γινόμενα, параллельно ὁσίως, либо к εὐπρόσδεκτα. Основной текст выбирает первую, грамматически связную трактовку, а примечание сохраняет вторую.
- issue: Референт подразумеваемого объекта при ἐπιτελεῖσθαι
  choice: нейтральное «это»
  alternative: «они» или конкретизация «приношения и служения»
  rationale: Контекст указывает на ранее названные установленные действия, но сам стих не повторяет существительного; «это» сохраняет контекстуальную связь без внесения лишней конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, церковно-историческим тоном. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис упрощён лишь настолько, чтобы длинный греческий период оставался ясным обычному читателю.
