source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: ru
  text: Итак, поскольку всё это нам ясно и мы всмотрелись в глубины божественного знания, мы должны всё совершать по порядку, как Владыка повелел совершать в установленные времена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: нам ясно
  rationale: Передаёт значение «явное, очевидное» естественным современным русским выражением.
- source_word: ἐγκεχυφότες
  choice: проникли взором
  rationale: Сохраняет образ внимательного всматривания или склонения над чем-либо, не сводя его лишь к отвлечённому «поняли».
- source_word: τὰ βάθη τῆς θείας γνώσεως
  choice: глубины божественного знания
  rationale: Близко следует греческому тексту и не уточняет без достаточных оснований, идёт ли речь о знании Бога, знании о Боге или знании, даруемом Богом.
- source_word: τάξει
  choice: в должном порядке
  rationale: 'Дательный образа действия: всё следует делать упорядоченно; это не союз цели «чтобы».'
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт сильное значение господства и власти δεσπότης и сохраняет высокий, но понятный регистр.
- source_word: κατὰ καιροὺς τεταγμένους
  choice: в установленные времена
  rationale: Передаёт как назначенность сроков, так и повторяемую или распределённую во времени упорядоченность действий.
theological_decisions:
- issue: Значение выражения «божественное знание»
  choice: Сохранено широкое выражение «божественное знание».
  alternative: «знание о Боге» или «Божье знание»
  rationale: Родительный оборот θείας γνώσεως допускает смысловую широту; конкретизация могла бы без основания разрешить богословскую неоднозначность.
- issue: Титул δεσπότης
  choice: «Владыка»
  alternative: «Господь» или «Хозяин»
  rationale: «Владыка» точнее сохраняет оттенок верховной власти, тогда как «Господь» могло бы нивелировать различие между δεσπότης и κύριος, а «Хозяин» снизило бы регистр.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис сделан плавным, но последовательность мысли и образ всматривания в глубины сохранены.
