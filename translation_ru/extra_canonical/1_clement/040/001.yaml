  terminology: '«Божественное знание» оправданно сохраняет широту θείας γνώσεως. «Владыка» удачно передаёт высокий регистр и властный оттенок δεσπότης. Специальные сноски не требуются: существенной текстологической или богословской неоднозначности, нуждающейся в маркировке, здесь нет.'
