revisions:
- from: Итак, поскольку всё это нам ясно и мы проникли взором в глубины божественного знания, мы должны в должном порядке исполнять всё, что Владыка повелел совершать в установленные времена.
  to: Итак, поскольку всё это нам ясно и мы всмотрелись в глубины божественного знания, мы должны всё совершать по порядку, как Владыка повелел совершать в установленные времена.
  rationale: 'Исправлены только два стилистико-семантических момента: образ пристального взгляда передан естественным русским «всмотрелись», а τάξει — нейтральным «по порядку». Порядок слов также делает яснее, что «всё» относится к «совершать», а придаточное ὅσα сохраняет широкий смысл: всё то, что Владыка повелел совершать в установленные времена.'
