source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: ru
  text: Итак, те, кто приносит свои приношения в назначенные сроки, угодны и блаженны, потому что, следуя законным предписаниям Владыки, они не ошибаются.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προστεταγμένοις καιροῖς
  choice: в назначенные сроки
  rationale: Передаёт совершенное страдательное причастие προστεταγμένοις без избыточности и естественно сочетается с καιροῖς.
- source_word: τὰς προσφορὰς αὐτῶν
  choice: свои приношения
  rationale: «Приношения» сохраняет культовый контекст προσφοράς, а возвратное «свои» естественно передаёт αὐτῶν при совпадении субъекта и обладателя.
- source_word: εὐπρόσδεκτοι
  choice: угодны
  rationale: В данном религиозном контексте слово означает благосклонно принимаемых Богом; «угодны» звучит естественно и достойно.
- source_word: τοῖς νομίμοις τοῦ δεσπότου
  choice: установлениям Владыки
  rationale: Субстантивированное νομίμοις обозначает предписанные нормы или установления. «Владыка» сохраняет значение δεσπότης и его высокий регистр.
- source_word: οὐ διαμαρτάνουσιν
  choice: не уклоняются от верного пути
  rationale: Глагол выражает промах, ошибку или уклонение. Контекстуальное дополнение «от верного пути» делает русскую фразу ясной, не сводя её исключительно к нравственному греху.
theological_decisions:
- issue: Кто признаёт приносящих угодными
  choice: Сохранена безличная формулировка «угодны»
  alternative: «угодны Богу» или «принимаются Богом»
  rationale: Греческий текст прямо не называет действующее лицо; контекст подразумевает Бога, но перевод не должен добавлять его эксплицитно.
- issue: Значение διαμαρτάνουσιν
  choice: «не уклоняются от верного пути»
  alternative: «не согрешают» / «не ошибаются»
  rationale: Выбранная формулировка сохраняет образ отклонения или промаха и не усиливает утверждение до абсолютной безгрешности.
translation_notes:
  register: Современный литературный русский язык с dignified церковно-религиозным оттенком. Синтаксис сделан плавным и доступным; терминология не привязана к конкретной конфессиональной традиции.
