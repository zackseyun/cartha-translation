    issue: Непоследовательная передача λαϊκὸς ἄνθρωπος и λαϊκοῖς.
    rationale: 'В оригинале два однокоренных слова образуют намеренный повтор: «мирянин» и «для мирян» воспроизводят его яснее, чем сочетание «человек из народа» и «миряне».'
  - severity: low
    issue: Согласование притяжательного местоимения со словом «место».
    rationale: В русском «своё особое место» согласуется со средним родом существительного и лучше передаёт ἴδιος.
