id: 1CLEM.40.5
reference: 1 Clement 40:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: ru
  text: Ибо первосвященнику поручены его особые служения, священникам назначено своё особое место, а на левитов возложены их особые обязанности; мирянин связан предписаниями для мирян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργίαι
  choice: служения
  rationale: Передаёт культовые обязанности первосвященника, сохраняя связь с богослужебной сферой без излишне узкого позднейшего значения слова «литургия».
- source_word: τόπος
  choice: место
  rationale: Сохраняет конкретность и возможную функционально-иерархическую широту греческого слова, не уточняя сверх текста «должность» или «положение».
- source_word: διακονίαι
  choice: обязанности
  rationale: В данном параллельном перечислении речь о служебных функциях левитов; «обязанности» естественно передаёт возложенный на них круг служения и отличает διακονίαι от λειτουργίαι.
- source_word: λαϊκὸς ἄνθρωπος
  choice: человек из народа
  rationale: Передаёт буквальный смысл выражения и одновременно избегает сведения его только к позднейшему техническому церковному термину.
- source_word: λαϊκοῖς προστάγμασιν
  choice: предписаниями для мирян
  rationale: Передаёт предписания, относящиеся к рядовым членам народа, на естественном современном русском языке.
- source_word: δέδεται
  choice: связан
  rationale: Сохраняет образ обязательной связанности установленными предписаниями.
theological_decisions:
- issue: Соотношение ветхозаветных культовых разрядов и церковного различения клира и мирян
  choice: Сохранена последовательность «первосвященник — священники — левиты — человек из народа» без прямого отождествления с позднейшими церковными должностями.
  alternative: Передать λαϊκὸς ἄνθρωπος только как техническое «мирянин» и тем самым сильнее прочитать весь ряд как устройство христианской церкви.
  rationale: Контекст использует культовую терминологию и проводит нормативную аналогию, однако сам стих не формулирует полного тождества между ветхозаветными и позднейшими церковными чинами.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксический параллелизм оригинала сохранён; повтор «особые» отражает ἴδιαι/ἴδιος/ἴδιαι. Формулировки понятны широкому читателю и не вносят конфессионально специфической терминологии.
