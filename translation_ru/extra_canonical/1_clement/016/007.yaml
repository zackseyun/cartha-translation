source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: ru
  text: 'И Господь предал Его за наши грехи,


    и Он, потому что с Ним жестоко поступили,


    не открывает уст Своих.


    Как овца, Он был ведён на заклание,


    и как ягнёнок безмолвный перед тем, кто стрижёт его,


    так Он не открывает уст Своих.


    В Его унижении суд Его был отнят.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В Его унижении у Него отняли правосудие». Греческое κρίσις может означать «суд», «судебное решение» или «правосудие», а ἤρθη — «был отнят» либо «был устранён».'
    reason: Сохраняет семантическую неоднозначность сочетания ἡ κρίσις αὐτοῦ ἤρθη, не сводя его к отмене судебного решения или исключительно к суду над Ним.
lexical_decisions:
- source_word: παρέδωκεν
  choice: предал
  rationale: Передаёт смысл отдачи во власть страдания и смерти, не уточняя способ сверх сказанного в источнике.
- source_word: διὰ τὸ κεκακῶσθαι
  choice: терпя страдания
  rationale: Естественно выражает причинно-обстоятельственный смысл и состояние претерпевшего зло или страдание, не сужая его до одного вида мучений.
- source_word: ἐπὶ σφαγήν
  choice: на заклание
  rationale: Традиционное и понятное в библейском регистре обозначение ведения на убой.
- source_word: ἄφωνος
  choice: безгласен
  rationale: Сохраняет образ полного молчания и возвышенный поэтический регистр цитаты.
- source_word: ἤρθη
  choice: был отменён
  rationale: Передаёт буквальный образ устранения или снятия суда, сохраняя неоднозначность самой формулы.
theological_decisions:
- issue: Смысл выражения ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη
  choice: В унижении Его суд над Ним был отменён
  alternative: В унижении Его правосудие было отнято
  rationale: Греческое κρίσις может обозначать суд, судебное решение или правосудие, а ἤρθη — снятие, устранение либо отнятие. Основной текст выбран как естественный русский вариант, но неоднозначность отмечена в сноске.
