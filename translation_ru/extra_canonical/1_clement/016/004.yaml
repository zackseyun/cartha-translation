  text: οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται, καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: ru
  text: Он несёт наши грехи и терпит страдания за нас,[a] а мы считали, что Он в муках, под ударом и в бедствии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он несёт наши грехи и мучится за нас, а мы считали, что Он в страдании, под ударом и в бедствии».'
    reason: Сохраняет более буквальную структуру греческого текста и возможные оттенки слов ὀδυνᾶται, πόνος, πληγή и κάκωσις.
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение относится к ранее названному лицу; в современном русском простое «Он» естественнее буквального «Этот».
- source_word: φέρει
  choice: несёт
  rationale: Сохраняет конкретную и богословски значимую метафору несения грехов.
- source_word: ὀδυνᾶται
  choice: терпит страдания
  rationale: Передаёт страдание или мучительную боль естественным современным русским выражением.
- source_word: περὶ ἡμῶν
  choice: за нас
  rationale: В контексте означает страдание ради нас или от нашего имени; краткое «за нас» сохраняет эту широту.
- source_word: ἐν πόνῳ
  choice: в муках
  rationale: Передаёт πόνος как боль и страдание, а не как труд.
- source_word: ἐν πληγῇ
  choice: поражён
  rationale: Показывает состояние подвергшегося удару или поражению, не создавая современного значения эпидемии.
- source_word: ἐν κακώσει
  choice: унижен
  rationale: В данном ряду обозначает бедствие, притеснение и унижение; контекстуально «унижен» звучит естественно и достойно.
theological_decisions:
- issue: Значение περὶ ἡμῶν
  choice: за нас
  alternative: из-за нас / ради нас
  rationale: «За нас» сохраняет возможность заместительного оттенка, но не навязывает его как единственно возможное толкование.
- issue: Синтаксис трёх предложных оборотов
  choice: в муках, поражён и унижен
  alternative: в страдании, под ударом и в бедствии
  rationale: 'Русская формулировка делает перечисление естественным, сохраняя три аспекта: боль, поражение и бедствие или унижение.'
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской цитаты; синтаксис сглажен умеренно, без устранения образов несения грехов, боли, удара и унижения.
