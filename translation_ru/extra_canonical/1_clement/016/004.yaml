  source_fidelity: 'Начало передано точно: «несёт наши грехи» соответствует φέρει τὰς ἁμαρτίας ἡμῶν, а «страдает за нас» естественно передаёт ὀδυνᾶται περὶ ἡμῶν, не снимая возможной широты этого оборота. В заключительном перечислении исходный текст трижды употребляет ἐν; «поражён и унижен» заменяет предложные обороты причастно-прилагательными формами и несколько сужает κάκωσις до унижения. Нужно сохранить образы боли, удара и бедствия/угнетения.'
