source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: ru
  text: 'Скипетр величия Божьего — Господь Иисус Мессия — пришёл не в надменной пышности и гордости, хотя и мог, но в смирении, как и говорил о Нём Святой Дух. Ибо сказано:


    «Господи, кто поверил нашей вести?


    И кому открылась рука Господня?


    Мы возвестили пред Ним[a],


    как дитя,


    как корень в иссохшей земле.


    Нет у Него ни облика, ни славы;


    и мы увидели Его —


    не было у Него ни облика, ни красоты.


    Но вид Его был презрен,


    уступал облику людей[b];


    Он — человек в страдании и боли,


    умеющий переносить немощь,


    ибо лицо Его отвращено[c].


    Он был унижен, и Его ни во что не ставили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте после «возвестили» нет прямого дополнения; поэтому необычная формулировка сохранена.
    reason: Сохранение синтаксической неоднозначности цитаты из греческого текста Ис 53:2.
  - marker: b
    text: 'Или: «был невзрачнее других людей».'
    reason: Оборот ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων допускает сравнительное и более буквально-недостаточное понимание.
  - marker: c
    text: 'Возможно также: «от Него отворачивали лицо».'
    reason: Греческая пассивная форма допускает различное понимание отвращения лица и не называет действующее лицо.
lexical_decisions:
- source_word: σκῆπτρον
  choice: скипетр
  rationale: Сохраняет царский образ оригинала и остаётся понятным в возвышенном литературном регистре.
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт значение греческого титула «Помазанник», а не трактует его как часть имени.
- source_word: κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  choice: в надменной пышности и гордости
  rationale: «Пышность» передаёт показной, самодовольный характер κόμπος, а «надменной» отражает ἀλαζονεία; «гордость» естественно передаёт ὑπερηφανία.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: нашей вести
  rationale: В данном контексте ἀκοή означает услышанное сообщение или возвещение, а не сам физический акт слуха.
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: мы возвестили пред Ним
  rationale: Сохраняет отсутствие прямого дополнения при ἀνηγγείλαμεν и необычность текста греческой цитаты.
- source_word: πληγῇ καὶ πόνῳ
  choice: в страдании и тяжком труде
  rationale: В контексте Ис 53 πληγή обозначает поражение или страдание, а не инфекционную «чуму»; πόνος охватывает мучительный труд, тяготу и боль.
- source_word: μαλακίαν
  choice: немощь
  rationale: Слово может обозначать слабость или болезнь; «немощь» сохраняет эту широту и соответствует возвышенному контексту.
theological_decisions:
- issue: Титул Χριστός
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» явно передаёт функцию титула «Помазанник» и не превращает его в непереведённое собственное имя.
- issue: Субъект и объект в строке ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: Не добавлять «Его» после «возвестили»
  alternative: «Мы возвестили Его пред Ним» или «Мы возвестили о Нём пред Ним»
  rationale: В греческом прямое дополнение отсутствует; его добавление устранило бы подлинную текстовую странность и навязало бы одно истолкование.
- issue: ἀπέστραπται τὸ πρόσωπον αὐτοῦ
  choice: «лицо Его отвращено»
  alternative: «от Него отворачивали лицо»
  rationale: Формулировка сохраняет пассивно-результативный характер греческого текста и не уточняет без достаточного основания, кто именно отворачивает лицо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, подходящим для раннехристианского наставления и поэтической пророческой цитаты. Архаизмы сведены к понятным словам библейского регистра («скипетр», «немощь», «пред Ним»); необычность греческой цитаты сохранена там, где её сглаживание потребовало бы добавления отсутствующих слов.
