  text: πάντες ὡς πρόβατα ἐπλανήθημεν, ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
translation:
  language: ru
  text: 'Все мы заблудились, как овцы;

    каждый заблудился, идя своим путём.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: все мы
  rationale: Форма глагола ἐπλανήθημεν указывает на первое лицо множественного числа; «все мы» естественно и точно передаёт всеобщность.
- source_word: ὡς πρόβατα
  choice: как овцы
  rationale: Сохранено прямое сравнение и образ исходного текста.
- source_word: ἐπλανήθημεν / ἐπλανήθη
  choice: заблудились / заблудился
  rationale: «Заблудиться» передаёт как уход с верного пути, так и состояние потерянности, сохраняя повтор одного греческого глагола.
- source_word: ἄνθρωπος
  choice: каждый человек
  rationale: 'Хотя буквально стоит «человек», в параллельной конструкции после πάντες слово имеет естественный распределительный смысл: каждый из людей.'
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: на своём пути
  rationale: Передаёт дательный оборот с образом собственного пути без добавочного толкования о направлении движения.
theological_decisions:
- issue: Всеобщность заблуждения и личная ответственность
  choice: 'Сохранены обе стороны параллелизма: «все мы» и «каждый человек».'
  alternative: 'Передать только коллективное утверждение: «Все мы, как овцы, заблудились».'
  rationale: Греческий текст содержит и общее утверждение, и отдельную строку о человеке на его собственном пути; сокращение устранило бы заложенное в тексте напряжение между общим и личным.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и библейского образа; формулировка ясная, dignified и без архаической инверсии.
