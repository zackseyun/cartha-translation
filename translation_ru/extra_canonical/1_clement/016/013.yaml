source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: ru
  text: 'Поэтому он получит в наследие многих

    и разделит добычу сильных,

    за то, что душа его была предана смерти

    и он был причислен к беззаконникам;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλούς
  choice: получит в наследие многих
  rationale: Сохраняет прямое значение глагола κληρονομέω и необычное сочетание с личным объектом, не подменяя его более привычным «получит долю среди многих».
- source_word: τῶν ἰσχυρῶν μεριεῖ σκῦλα
  choice: разделит добычу сильных
  rationale: Передаёт μερίζω как «разделит», σκῦλα как военную «добычу», а родительный τῶν ἰσχυρῶν оставляет с присущей ему возможностью понимать сильных как обладателей либо как тех, у кого добыча отнята.
- source_word: ἀνθ’ ὧν
  choice: за то, что
  rationale: 'Естественно выражает причинно-воздающий оттенок оборота: последующее возвышение даётся в ответ на добровольно понесённую участь.'
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: душа его
  rationale: Формально сохраняет ψυχή и библейскую образность; контекст допускает смысл «его жизнь», но не требует устранять образ в основном тексте.
- source_word: ἐν τοῖς ἀνόμοις ἐλογίσθη
  choice: был причислен к беззаконникам
  rationale: Точно и естественно передаёт λογίζομαι в пассиве и ἄνομοι как людей, преступающих закон.
theological_decisions:
- issue: Смысл κληρονομήσει πολλούς
  choice: «получит в наследие многих»
  alternative: «получит долю среди многих»
  rationale: Греческая конструкция прямо делает «многих» объектом наследования. Избранный вариант не гармонизирует её с иной текстовой формой Ис 53:12 и сохраняет христологически значимую неоднозначность.
- issue: Передача предания души смерти
  choice: «душа его была предана смерти»
  alternative: «он отдал свою жизнь на смерть»
  rationale: Пассив παρεδόθη сохранён без уточнения действующего лица и без превращения конструкции в возвратное или активное добровольное действие.
translation_notes:
  register: Современный литературный русский язык с возвышенным библейским ритмом. Сохранены четыре параллельные строки и финальная точка с запятой, отражающая продолжение цитаты. Архаизмы и конфессионально окрашенные формулы не использованы.
