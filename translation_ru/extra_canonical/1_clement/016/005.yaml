source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: ru
  text: 'Но он был изранен за наши грехи

    и был изнурён за наши беззакония.

    На нём было наказание, принёсшее нам мир;

    его ранами мы исцелились.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Ис. 53:5. Буквально: «его рубцом (следом от удара) мы были исцелены».'
    reason: Указывает на источник цитаты и отмечает, что греческое μώλωψ стоит в единственном числе, тогда как в основном русском тексте употреблено естественное собирательное «ранами».
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: был изранен
  rationale: Передаёт страдательный аорист и образ нанесённых ран; естественнее в данном поэтическом контексте, чем буквальное «был ранен» в единственном числе.
- source_word: μεμαλάκισται
  choice: страдал
  rationale: Форма буквально связана с ослаблением или изнурением; в контексте страданий передана широким и естественным «страдал», без чрезмерно узкого толкования.
- source_word: ἀνομίας
  choice: беззакония
  rationale: Сохраняет связь с нарушением Божьего закона и возвышенный библейский регистр.
- source_word: παιδεία
  choice: наказание
  rationale: В данном контексте означает карающее воздействие, которое терпит страдающий; «наказание» понятно современному читателю и не сужает смысл до обучения.
- source_word: εἰρήνης ἡμῶν
  choice: принёсшее нам мир
  rationale: Разворачивает сжатую греческую конструкцию «наказание нашего мира», ясно выражая результирующую связь, не уточняя сверх текста природу мира.
- source_word: τῷ μώλωπι αὐτοῦ
  choice: Его ранами
  rationale: Греческое единственное число может иметь собирательный смысл; русское множественное естественно передаёт образ телесных повреждений и узнаваемую библейскую формулу.
theological_decisions:
- issue: Связь наказания и мира
  choice: «наказание, принёсшее нам мир»
  alternative: «наказание нашего мира»
  rationale: Буквальная русская калька неясна. Выбранная формулировка сохраняет мысль, что понесённое Им наказание связано с обретённым нами миром, не вводя конфессионального объяснения механизма искупления.
- issue: Причинно-заместительный оттенок διά
  choice: «за наши грехи / за наши беззакония»
  alternative: «из-за наших грехов / из-за наших беззаконий»
  rationale: Русское «за» в контексте страдания сохраняет как причинный, так и заместительный оттенок греческого выражения, не разрешая богословское напряжение однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтическим параллелизмом. Местоимение «Он» написано с прописной буквы как уважительное обозначение подразумеваемой мессианской фигуры; синтаксис слегка разглажен ради ясности, при этом структура четырёх строк сохранена.
