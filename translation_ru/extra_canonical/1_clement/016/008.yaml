  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: ru
  text: 'Кто расскажет о его роде?


    Ибо жизнь его отнимается от земли.


    Из-за беззаконий народа моего он пришёл на смерть.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В распространённой форме греческого текста Ис 53:8 последнее предложение передано иначе: «Из-за беззаконий народа моего он был ведён на смерть». В тексте 1 Климента стоит активная форма: «он пришёл на смерть».'
    reason: Сноска точно отмечает значимое различие между активной формой цитаты у 1 Климента и пассивной формой распространённого текста Септуагинты, не подменяя основной текст.
lexical_decisions:
- source_word: γενεὰν
  choice: роде
  rationale: Греческое γενεά здесь допускает значения «род», «поколение» и «происхождение». «Род» сохраняет смысловую широту и соответствует возвышенному цитатному контексту.
- source_word: διηγήσεται
  choice: расскажет
  rationale: Передаёт значение подробного изложения или повествования естественным современным русским словом.
- source_word: αἴρεται
  choice: забирается
  rationale: Настоящее страдательное время сохранено; глагол может означать «уносится», «изымается», «забирается».
- source_word: ἀπὸ τῶν ἀνομιῶν
  choice: за беззакония
  rationale: Предлог ἀπό выражает причинную связь; «за» естественно передаёт причину смерти, не уточняя сверх текста характер заместительности.
- source_word: ἤκει εἰς θάνατον
  choice: пришёл на смерть
  rationale: Формулировка близко сохраняет необычное греческое выражение направления к смерти и не заменяет его более толковательным оборотом.
theological_decisions:
- issue: Связь смерти с беззакониями народа
  choice: «За беззакония народа Моего»
  alternative: «Из-за беззаконий народа Моего»
  rationale: «За» сохраняет возможный оттенок несения последствий за чужие грехи, но не делает заместительное толкование более определённым, чем сам греческий текст.
- issue: Значение γενεά
  choice: «род»
  alternative: «поколение» или «происхождение»
  rationale: Выбран вариант, позволяющий сохранить традиционную многозначность цитаты без однозначного отнесения к современникам, потомству или происхождению.
