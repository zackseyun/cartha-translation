  to: 'Кто расскажет о его роде?


    Ибо жизнь его отнимается от земли.


    Из-за беззаконий народа моего он пришёл на смерть.[a]'
  rationale: Исправлены естественность и точность передачи αἴρεται и причинного ἀπό, убраны не заданные источником прописные местоимения и заменена неточная сноска. Сохранены «род» для намеренной многозначности γενεά и близкая оригиналу необычная конструкция «пришёл на смерть».
  reviewer_model: gpt-5.6-terra
