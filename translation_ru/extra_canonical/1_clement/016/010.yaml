  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: ru
  text: '«И отдам нечестивых вместо его погребения

    и богатых — вместо его смерти,

    потому что он не совершил беззакония

    и не нашлось обмана в его устах.

    И Господь желает очистить его от страдания».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Ис 53:9–10. Здесь цитата следует греческой форме текста, которая в нескольких местах отличается от привычных переводов еврейского текста Исайи.
    reason: Читателю важно знать, почему формулировка заметно отличается от знакомого ветхозаветного места; примечание объясняет источник различия, не исправляя основной текст.
lexical_decisions:
- source_word: πονηρούς
  choice: нечестивых
  rationale: Передаёт нравственно-религиозный оттенок слова в данном пророческом контексте; «злые» было бы менее естественно как обозначение людей.
- source_word: ἀντὶ
  choice: вместо
  rationale: Сохраняет прямое значение греческого предлога и трудность исходной формулировки, не подменяя её более привычным текстом Ис 53:9.
- source_word: ἀνομίαν οὐκ ἐποίησεν
  choice: не совершил беззакония
  rationale: Близко передаёт сочетание существительного ἀνομία с ποιέω и звучит естественно по-русски.
- source_word: δόλος
  choice: обман
  rationale: Ёмкий современный эквивалент со значением лжи и коварства; формула «не нашлось обмана в его устах» сохраняет образ оригинала.
- source_word: βούλεται
  choice: желает
  rationale: Передаёт волю или намерение Господа без усиления до значения предопределения.
- source_word: καθαρίσαι
  choice: очистить
  rationale: Сохраняет обычное значение инфинитива и необычную формулировку цитируемого текста.
- source_word: πληγῆς
  choice: страдания
  rationale: В контексте передаёт причинённое поражение или мучение естественным русским словом, не сужая смысл до единичного удара.
theological_decisions:
- issue: Необычное чтение цитаты Ис 53:9–10
  choice: Сохранить формулировки «вместо его погребения», «вместо его смерти» и «очистить его от страдания».
  alternative: 'Гармонизировать перевод с привычным русским текстом Ис 53:9–10: «назначили ему гроб со злодеями… Господу угодно было поразить его».'
  rationale: Перевод следует приведённому греческому тексту 1 Климента, а не исправляет его по иной текстовой традиции; тем самым сохраняются реальная текстовая неоднозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Сохранён параллелизм строк и необычная логика исходного греческого текста; архаизмы и конфессионально окрашенные пояснения не добавлялись.
