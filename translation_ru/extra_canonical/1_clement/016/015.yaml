  source_fidelity: В целом цитата верно передаёт греческий текст и сохраняет параллелизм двух именных характеристик. Однако «презрение в народе» несколько размывает генитив λαοῦ («народа») и не столь ясно выражает, что говорящий является объектом презрения. «Поношение у людей» также можно сделать более прозрачным в современном русском без потери поэтической сжатости.
  naturalness: Фраза понятна, но «предмет поношения у людей и презрения у народа» естественнее для современного литературного русского и точнее обозначает синтаксическую функцию обоих существительных. Сохраняются возвышенный регистр и параллельная структура цитаты.
  terminology: «Червь», «человек», «поношение» и «презрение» уместны. Не следует вводить имя Христа, поскольку в данном греческом предложении оно не названо. Ссылка на Пс. 21:7 (LXX) / 22:6 (еврейская нумерация) корректна.
