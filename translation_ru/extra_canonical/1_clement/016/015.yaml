  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: ru
  text: 'И ещё он сам говорит:


    «Я же — червь, а не человек,


    предмет поношения у людей и презрения у народа»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пс. 21:7 по нумерации Септуагинты; Пс. 22:6 по еврейской нумерации.
    reason: Указывает источник цитаты и объясняет различие принятой нумерации псалмов.
lexical_decisions:
- source_word: καὶ πάλιν αὐτὸς φησίν
  choice: И ещё он сам говорит
  rationale: Передаёт повторность πάλιν и эмфатическое αὐτός, сохраняя естественный русский порядок слов.
- source_word: Ἐγὼ δὲ
  choice: Я же
  rationale: Частица δέ обозначает здесь противопоставление; конструкция «я же» сохраняет его без излишне резкого «но».
- source_word: σκώληξ
  choice: червь
  rationale: Прямое и общепонятное соответствие образу исходного текста.
- source_word: ὄνειδος ἀνθρώπων
  choice: поношение у людей
  rationale: Сохраняет именную конструкцию и смысл человека как предмета поношения.
- source_word: ἐξουθένημα λαοῦ
  choice: презрение в народе
  rationale: Именная формулировка сохраняет параллелизм с ὄνειδος; по смыслу речь идёт о том, кто стал предметом презрения народа.
theological_decisions:
- issue: Отнесение местоимения αὐτός
  choice: Сохранить «он сам», не называя говорящего прямо
  alternative: 'Уточнить: «сам Христос говорит»'
  rationale: В данном стихе референт определяется предшествующим контекстом; исходный текст здесь не повторяет имени, поэтому перевод не добавляет толкование.
- issue: Смысл двух заключительных именных выражений
  choice: 'Сохранить параллельные существительные: «поношение… и презрение…»'
  alternative: 'Передать второе выражение глагольно: «презираемый народом»'
  rationale: Оба греческих слова, ὄνειδος и ἐξουθένημα, являются параллельными именными характеристиками; именная передача сохраняет риторику и не меняет структуру.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтическим параллелизмом цитаты. Формулировки понятны широкому читателю; сохранены краткость, образность и именная структура греческого текста.
