source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: ru
  text: Посмотрите, возлюбленные, какой образец дан нам. Ведь если Господь проявил такое смирение, то что же делать нам, через Него пришедшим под иго Его благодати?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Посмотрите
  rationale: Передаёт форму повелительного наклонения и риторический призыв обратить внимание на приведённый выше пример.
- source_word: ἄνδρες ἀγαπητοί
  choice: возлюбленные
  rationale: Естественное и достойное обращение по-русски; слово ἄνδρες не требует буквального «мужи» в обращении к общине.
- source_word: ὑπογραμμός
  choice: образец
  rationale: Здесь слово обозначает пример или модель для подражания; «образец» сохраняет эту направленность.
- source_word: ἐταπεινοφρόνησεν
  choice: смирил Себя
  rationale: Передаёт проявленное Господом смирение в данном контексте; возвратная конструкция естественна по-русски и соответствует смыслу.
- source_word: τί ποιήσωμεν
  choice: как должны поступать мы
  rationale: Делиберативный конъюнктив выражает вопрос о должном ответе и образе действий, а не просто о единичном действии.
- source_word: ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ
  choice: под игом Его благодати
  rationale: Сохраняет яркую и богословски напряжённую метафору оригинала, не смягчая сочетание «иго благодати».
- source_word: δι’ αὐτοῦ ἐλθόντες
  choice: через Него оказавшиеся
  rationale: Сохраняет посредническое «через Него» и естественно передаёт вхождение в обозначенное состояние.
theological_decisions:
- issue: Сочетание «иго благодати»
  choice: Сохранено буквально как «под игом Его благодати»
  alternative: «принявшие на себя Его благодатное иго»
  rationale: Оригинал прямо связывает ζυγός с χάρις; более гладкая альтернатива могла бы ослабить намеренный парадокс и изменить синтаксическую связь.
- issue: Смирение Господа
  choice: «Господь так смирил Себя»
  alternative: «Господь проявил такое смирение»
  rationale: Выбранная формулировка лучше сохраняет личное самоумаление, подразумеваемое контекстом, не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повелительное «Посмотрите» сохраняет риторическую силу; устаревшее «мужи» опущено как неестественное для современного обращения. Метафора «иго благодати» намеренно сохранена.
