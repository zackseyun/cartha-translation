translation:
  language: ru
  text: 'Если вы принесёте жертву за грех,

    ваша душа увидит долгоживущее потомство[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя, живущее долго».'
    reason: Уточняет образное σπέρμα («семя», то есть потомство) и прямое значение μακρόβιον («живущее долго»).
lexical_decisions:
- source_word: ἐὰν δῶτε περὶ ἁμαρτίας
  choice: Если вы принесёте жертву за грех
  rationale: Оборот περὶ ἁμαρτίας в языке Септуагинты имеет жертвенный смысл («за грех», «жертва за грех»). Слово «жертву» восполняется по устойчивому значению выражения и устраняет двусмысленное русское «дадите за грех».
- source_word: ἡ ψυχὴ ὑμῶν
  choice: ваша душа
  rationale: Формальное соответствие греческому единственному числу с собирательным обращением во множественном числе; сохраняет язык цитируемого пророческого текста.
- source_word: ὄψεται
  choice: увидит
  rationale: Прямое соответствие будущему времени глагола ὁράω без истолковывающего расширения («доживёт и увидит»).
- source_word: σπέρμα μακρόβιον
  choice: долговечное потомство
  rationale: σπέρμα здесь означает потомство, а μακρόβιον — живущее долго; формулировка сохраняет смысл и естественно звучит по-русски.
theological_decisions:
- issue: Жертвенный или буквальный смысл περὶ ἁμαρτίας
  choice: жертву за грех
  alternative: за грех
  rationale: Хотя существительное «жертва» в данной строке не выражено, сочетание διδόναι περὶ ἁμαρτίας опирается на жертвенную лексику греческого библейского текста. Альтернатива формально буквальнее, но по-русски неясна и может быть понята превратно.
- issue: Связь жертвы с обещанием потомства
  choice: сохранить условную конструкцию без пояснения её богословского смысла
  alternative: истолковать жертву христологически или как возмещение за грех
  rationale: Строка воспроизводит Ис 53:10 и сохраняет присущую исходному тексту напряжённость; перевод не должен добавлять названного субъекта или конфессиональное толкование.
translation_notes:
  register: Современный литературный русский с достоинством пророческой цитаты. Синтаксический параллелизм двух строк сохранён; архаизмы и конфессионально маркированная терминология не добавлены.
