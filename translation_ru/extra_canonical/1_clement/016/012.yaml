source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: ru
  text: 'И Господь желает избавить его от муки его души,


    показать ему свет и сформировать его разумением[a],


    оправдать праведника, который хорошо служит многим;


    и он сам понесёт их грехи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «вылепить» или «образовать» разумением. Смысл необычного греческого выражения не вполне ясен.'
    reason: Фраза πλάσαι τῇ συνέσει необычна по форме; сноска отмечает её трудность, не навязывая определённого толкования.
lexical_decisions:
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  choice: избавить его от муки его души
  rationale: Передаёт устранение из состояния страдания; «мука» естественно выражает здесь πόνος как глубокое душевное страдание.
- source_word: δεῖξαι αὐτῷ φῶς
  choice: показать ему свет
  rationale: Сохраняет конкретный образ света и синтаксис греческого текста.
- source_word: πλάσαι τῇ συνέσει
  choice: сформировать его разумением
  rationale: Сохраняет необычный образ πλάσσω («формировать, создавать») и инструментальный оттенок дательного τῇ συνέσει, не подменяя не вполне ясную фразу более определённым толкованием.
- source_word: δικαιῶσαι δίκαιον
  choice: оправдать праведника
  rationale: Сохраняет словесное сочетание δικαιόω / δίκαιος и допускает как оправдательный, так и удостоверяющий праведность оттенок.
- source_word: εὖ δουλεύοντα πολλοῖς
  choice: который хорошо служит многим
  rationale: Передаёт причастие δουλεύοντα с дательным πολλοῖς и наречием εὖ без конфессионального уточнения характера служения.
- source_word: ἀνοίσει
  choice: понесёт
  rationale: Обычное значение глагола в контексте несения грехов или бремени; будущее время сохранено.
theological_decisions:
- issue: Референт выражения «праведник»
  choice: Сохранено нарицательно-титульное «праведника» без добавления имени или мессианского титула.
  alternative: Явно назвать этого праведника Мессией или Христом.
  rationale: Греческий текст допускает христологическое прочтение в контексте цитаты, но сам в этой строке не называет референта прямо.
- issue: Значение δικαιῶσαι
  choice: Передано как «оправдать».
  alternative: «Признать праведным» или «сделать праведным».
  rationale: «Оправдать» сохраняет богословскую и смысловую ёмкость глагола, не разрешая спор между декларативным и преобразующим оттенками.
- issue: Субъект последнего предложения
  choice: «Он Сам» с прописной буквы соотнесено с ранее названным праведником согласно ближайшему мужскому референту и традиционному прочтению контекста.
  alternative: Соотнести местоимение с Господом.
  rationale: Греческое αὐτός грамматически может требовать контекстуального определения; ближайший действующий референт — праведник, несущий грехи многих, однако формальная двусмысленность не устраняется дополнительным существительным.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но понятным ритмом. Поэтическое членение исходной цитаты сохранено. Необычная формулировка о «формировании разумением» намеренно не сглажена до однозначного толкования; её трудность отмечена сноской.
