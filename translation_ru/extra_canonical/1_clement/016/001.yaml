lexical_decisions:
- source_word: Ταπεινοφρονῶν
  choice: смиренным
  rationale: Передаёт значение людей, мыслящих и ведущих себя смиренно; по-русски естественнее краткого буквального «смиренномыслящим».
- source_word: ὁ Χριστός
  choice: Христос
  rationale: В раннехристианском контексте это обычное обозначение Иисуса Христа; сохраняется традиционная и понятная русская форма.
- source_word: ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ
  choice: тех, кто превозносится над Его паствой
  rationale: Следует восстановленному греческому чтению, засвидетельствованному текстом 1 Кл. 16:1, а не явно повреждённому OCR «ἐπιρριπμένων ἐπὶ τὸν φόβον αὐτοῦ».
theological_decisions:
- issue: Смысл принадлежности Христа смиренным
  choice: «Христос принадлежит смиренным»
  alternative: «Христос — со смиренными»
  rationale: Сохранена сильная и несколько напряжённая конструкция греческого родительного принадлежности, без ослабления до простого присутствия или поддержки.
- issue: Повреждённое исходное чтение
  choice: Перевести восстановленное «не тем, кто превозносится над Его паствой»
  alternative: 'Буквально перевести OCR-текст: «не тем, кто бросается на Его страх»'
  rationale: Нормализованный OCR здесь даёт синтаксически и контекстуально испорченный текст; принято известное чтение места, согласующееся с рукописной традицией и контекстом послания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. «Паства» естественно передаёт образ ποίμνιον и сохраняет церковный контекст; прописная буква в «Его» соответствует русской религиозной издательской традиции.
