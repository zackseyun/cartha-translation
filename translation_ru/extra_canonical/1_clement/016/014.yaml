  yaml_path: translation/extra_canonical/1_clement/016/014.yaml
  text: 'And he bore the sins of many,

    and was given over because of their sins.'
translation:
  language: ru
  text: 'И Он Сам понёс грехи многих

    и был предан из-за их грехов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνήνεγκε
  choice: понёс
  rationale: Передаёт аорист ἀναφέρω в жертвенно-заместительном контексте и естественно сочетается с «грехи»; сохраняет связь с цитируемой традицией Ис 53.
- source_word: παρεδόθη
  choice: был предан
  rationale: 'Сохраняет страдательный залог и допускаемую греческим глаголом смысловую широту: от передачи в чужую власть до предания на смерть.'
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: за их грехи
  rationale: В данном контексте διά с винительным выражает основание или причину предания; русское «за» естественно сохраняет как причинный, так и заместительно-искупительный оттенок.
theological_decisions:
- issue: Смысл предания Мессии в связи с грехами других
  choice: был предан за их грехи
  alternative: был предан из-за их грехов
  rationale: «За их грехи» не сводит фразу только к причинности и сохраняет богословское напряжение текста Ис 53, не уточняя прямо, кем именно Он был предан и как действует искупление.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Прописное «Он» уместно как ясная отсылка к ранее названному Христу; субъект деятеля при пассиве намеренно не добавлен.
