source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: ru
  text: 'Все, кто видел меня, насмехались надо мной;

    они говорили с насмешкой,

    качали головой:

    «Он уповал на Господа —

    пусть Он избавит его,

    пусть спасёт его, ведь Он благоволит к нему».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Он хочет (желает) его». Греческое θέλει обычно означает «хочет, желает»; в этом контексте возможно значение «благоволит к нему».'
    reason: Сохраняет буквальное значение θέλει и отмечает контекстуально естественный смысл без подмены его утверждением о «угодности» человека.
lexical_decisions:
- source_word: θεωροῦντές
  choice: смотрел на меня
  rationale: Причастие настоящего времени передано естественно по-русски в прошедшем времени в согласовании с аористом главного глагола; значение — наблюдать, смотреть.
- source_word: ἐξεμυκτήρισάν
  choice: насмехались надо мной
  rationale: Передаёт презрительное осмеяние без архаической окраски.
- source_word: ἐλάλησαν ἐν χείλεσιν
  choice: кривили губы
  rationale: Семитизированное выражение в цитируемом псалме обозначает насмешливое движение губ; буквальное «говорили губами» в современном русском неясно.
- source_word: ἐκίνησαν κεφαλήν
  choice: качали головой
  rationale: Единственное число κεφαλήν является распределительным при множественном субъекте; русская идиома допускает «головой».
- source_word: Ἤλπισεν ἐπὶ κύριον
  choice: Он уповал на Господа
  rationale: «Уповал» сохраняет религиозный регистр и значение доверия, возложенного на Господа.
- source_word: ὅτι θέλει αὐτόν
  choice: ведь он угоден Ему
  rationale: θέλει может выражать благоволение или желание; в контексте насмешки над уповающим смысл естественно передаётся как Божье благоволение к нему.
theological_decisions:
- issue: Субъект глаголов ῥυσάσθω и σωσάτω
  choice: пусть Тот избавит его, пусть спасёт его
  alternative: пусть он избавит его, пусть он спасёт его
  rationale: Указательное «Тот» ясно отсылает к Господу и устраняет неестественную для русского цепочку местоимений, не добавляя нового богословского содержания.
- issue: Значение ὅτι θέλει αὐτόν
  choice: ведь он угоден Ему
  alternative: потому что Он желает его / благоволит к нему
  rationale: Фраза допускает оттенки желания и благоволения. Выбранная формулировка сохраняет традиционный смысл псалма и естественна по-русски; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической цитаты. Строки оформлены как стихотворная речь; сохранён насмешливый тон говорящих. Архаизмы сведены к понятному религиозному слову «уповал».
