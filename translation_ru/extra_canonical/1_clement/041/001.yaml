source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: ru
  text: Пусть каждый из нас, братья, угождает Богу в своём чине, имея добрую совесть, не преступая установленного правила своего служения, с достоинством.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάγματι
  choice: месте
  rationale: В контексте слово обозначает определённое положение или порядок; «на своём месте» естественно передаёт эту мысль по-русски, не привнося явно военного оттенка слова «строй».
- source_word: εὐαρεστείτω
  choice: пусть … угождает Богу
  rationale: Активный императив естественно передан русской побудительной конструкцией.
- source_word: ἐν ἀγαθῇ συνειδήσει ὑπάρχων
  choice: с чистой совестью
  rationale: Идиоматичная русская передача состояния человека, сохраняющая нравственный смысл ἀγαθῇ без тяжеловесного буквального оборота.
- source_word: τὸν ὡρισμένον … κανόνα
  choice: установленные пределы
  rationale: κανών здесь указывает на заданную норму или границу служения; сочетание с μὴ παρεκβαίνων естественно выражается как «не выходя за … пределы».
- source_word: λειτουργίας
  choice: служения
  rationale: Сохраняет широкий смысл порученного служения и не сужает его до позднейшего значения богослужебной литургии.
- source_word: ἐν σεμνότητι
  choice: сохраняя достоинство
  rationale: Передаёт образ действий и нравственную серьёзность выражения естественным современным русским языком.
theological_decisions:
- issue: Характер «своего места» и служения
  choice: Не уточнять, идёт ли речь исключительно о церковном чине, литургической должности или более общем установленном порядке.
  alternative: Перевести τάγμα как «чин», а λειτουργία как «литургическое служение».
  rationale: Греческие слова допускают связь с упорядоченным и культовым служением, но сам стих не требует узкой конфессиональной или технической трактовки.
translation_notes:
  register: Современный литературный русский язык; наставительный, достойный регистр. Синтаксис сделан плавным, при этом сохранены императив и последовательность сопутствующих обстоятельств греческого текста.
