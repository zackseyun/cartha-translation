review_pass:
  verdict: revise
  source_fidelity: Черновик в целом верно передаёт побуждение и основные смысловые элементы. Однако «оставаясь на своём месте» несколько переформулирует ἐν τῷ ἰδίῳ τάγματι («в своём чине/разряде») как призыв не покидать место. «Установленные пределы» во множественном числе ослабляет буквальную форму единственного κανόνα — «установленное правило».
  naturalness: Текст звучит естественно и соответствует современному литературному наставительному регистру. Предлагаемая правка сохраняет плавность, но точнее отражает синтаксис и лексику оригинала.
  terminology: «Чин» уместно передаёт τάγματι как установленный разряд или порядок, не требуя узкого догматического прочтения. «Служение» корректно для λειτουργία. «Добрая совесть» ближе к ἀγαθὴ συνείδησις, чем «чистая совесть», которая может обозначать прежде всего отсутствие вины.
  issues:
  - severity: medium
    issue: «оставаясь на своём месте» для ἐν τῷ ἰδίῳ τάγματι
    rationale: Оригинал описывает служение Богу в собственном чине или разряде; глагольное «оставаясь» добавляет оттенок физического либо статусного непокидания места.
  - severity: low
    issue: «с чистой совестью» для ἐν ἀγαθῇ συνειδήσει
    rationale: Это идиоматично, но «чистая» чаще акцентирует невиновность; «добрая совесть» точнее сохраняет значение ἀγαθή.
  - severity: medium
    issue: «установленные пределы» для τὸν ὡρισμένον ... κανόνα
    rationale: κανόνα стоит в единственном числе и означает установленное правило или норму; «пределы» во множественном числе несколько меняют образ.
  revised_text: Пусть каждый из нас, братья, угождает Богу в своём чине, имея добрую совесть, не преступая установленного правила своего служения, с достоинством.
