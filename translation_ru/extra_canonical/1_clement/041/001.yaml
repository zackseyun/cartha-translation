  rationale: Перевод уточнён в соответствии с греческими τάγματι, ἀγαθῇ συνειδήσει и τὸν ὡρισμένον ... κανόνα. Сохранены побудительная форма, широкий смысл «служения» и неуточнённый характер чина; «с достоинством» передаёт ἐν σεμνότητι без излишней интерпретации.
