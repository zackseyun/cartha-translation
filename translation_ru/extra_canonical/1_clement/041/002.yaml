base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: ru
  text: Не повсюду, братья, приносятся жертвы постоянного приношения, жертвы по обету[a], жертвы за грех и за проступок, но только в Иерусалиме. И даже там их приносят не на всяком месте, а перед святилищем, у жертвенника, после того как первосвященник и упомянутые выше служители осмотрят приношение, проверяя, нет ли в нём изъянов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы молитв». Греческое слово может означать как молитву, так и обет; в данном перечне храмовых приношений вероятнее значение «обет».'
    reason: Сохраняет реальную лексическую неоднозначность εὐχῶν.
  - marker: b
    text: 'Буквально: «после того как приносимое было осмотрено на предмет изъянов».'
    reason: Поясняет редкое греческое слово μωροσκοπηθέν и культовый характер проверки.
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: жертвы постоянного приношения
  rationale: Передаёт культовое обозначение регулярного, непрерывно совершаемого приношения, не сводя его к общему слову «жертвы».
- source_word: εὐχῶν
  choice: жертвы по обету
  rationale: Хотя εὐχή может означать «молитва», в перечне храмовых жертв наиболее естественно культовое значение «обет»; неоднозначность отмечена в сноске.
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: за грех и за проступок
  rationale: Сохраняет различие двух культовых категорий; «проступок» передаёт πλημμέλεια без преждевременного отождествления с конкретной позднейшей терминологией.
- source_word: ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον
  choice: перед святилищем, у жертвенника
  rationale: Естественно передаёт пространственные отношения; ναός здесь обозначает храмовое святилище, а θυσιαστήριον — жертвенник.
- source_word: μωροσκοπηθὲν
  choice: осмотрят приношение, проверяя, нет ли в нём изъянов
  rationale: Редкое культовое слово обозначает проверку жертвенного дара на пороки или дефекты; развёрнутая формулировка понятна современному читателю.
- source_word: λειτουργῶν
  choice: служители
  rationale: В данном храмовом контексте речь о лицах, исполняющих установленное служение; нейтральное «служители» не вносит позднейшей конфессиональной терминологии.
theological_decisions:
- issue: Значение εὐχῶν в перечне жертв
  choice: жертвы по обету
  alternative: жертвы молитв / молитвы
  rationale: Синтаксис объединяет термин с конкретными видами приношений в Иерусалиме и у жертвенника, поэтому значение «обетные жертвы» контекстуально сильнее; иная возможность сохранена в примечании.
- issue: Различение ἁμαρτία и πλημμέλεια
  choice: грех и проступок
  alternative: грех и вина / жертва за грех и жертва повинности
  rationale: Перевод сохраняет два отдельных греческих понятия, но не навязывает читателю строгое отождествление с одной системой русской библейской терминологии.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Повтор «жертвы» делает перечень культовых категорий прозрачным. Обращение «братья» сохранено на месте, близком к греческому оригиналу. Финальная часть восстановлена в соответствии с засвидетельствованным продолжением текста и аудированным английским консультационным слоем, поскольку предоставленный греческий фрагмент обрывается на ὑπὸ.
