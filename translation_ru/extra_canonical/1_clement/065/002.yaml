    rationale: «Установившемуся ... порядку» предполагает наступление состояния; греческое εὐστάθεια говорит о его устойчивости/благоустроенности, не о моменте установления.
  - severity: low
    issue: Неточная альтернативная сноска
    rationale: «Усердно» не выражено в исходном тексте, а сноска излишне перераспределяет значения двух определений. Для данного перевода значимой текстовой неопределённости, требующей сноски, нет.
