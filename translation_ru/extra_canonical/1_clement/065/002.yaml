  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: ru
  text: чтобы они как можно скорее сообщили нам о мире и согласии, о которых мы молились и которых желали, и чтобы мы тоже скорее порадовались вашему устойчивому благому порядку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκταίαν
  choice: о которых мы молились
  rationale: Передаёт смысл «вымоленный, желанный в молитве» естественной современной русской конструкцией и сохраняет связь мира и согласия с молитвой.
- source_word: ἐπιπόθητον
  choice: которых желали
  rationale: Сохраняет отдельный компонент сильного желания, не сливая его с молитвой.
- source_word: εἰρήνην καὶ ὁμόνοιαν
  choice: о мире и согласии
  rationale: Устоявшаяся и точная пара для мира и единомыслия/согласия в общине.
- source_word: εὐστάθεια
  choice: установившемуся у вас доброму порядку
  rationale: В контексте общины выражает устойчивое, благополучное и упорядоченное состояние; буквальная «устойчивость» по-русски здесь звучала бы неестественно.
theological_decisions:
- issue: Характер мира и согласия как предмета молитвы и желания
  choice: «о которых мы молились и которых желали»
  alternative: «о желанном мире и согласии, о которых мы усердно молились»
  rationale: Основной текст явно сохраняет оба смысловых компонента — молитву и желание — не усиливая наречием степень молитвы без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания; синтаксис сделан плавным, а «добрый порядок» уточнён как установившийся, чтобы передать εὐστάθεια без канцелярской буквальности.
