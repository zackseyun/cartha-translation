base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: ru
  text: А посланных нами — Клавдия Эфеба и Валерия Битона, а с ними и Фортуната — как можно скорее отправьте обратно к нам с миром и радостью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: А посланных нами
  rationale: Причастная конструкция передана естественно для русского языка; δέ сохранено как лёгкий переход «А», без добавления временного «теперь».
- source_word: ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς
  choice: как можно скорее отправьте обратно к нам
  rationale: Повелительное ἀναπέμψατε означает отправить назад к говорящим; ἐν τάχει выражает требование скорого исполнения.
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: с миром и радостью
  rationale: Сохраняется сочетание обстоятельств образа действия без уточнения, чьи именно мир и радость имеются в виду.
- source_word: Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα σὺν καὶ Φορτουνάτῳ
  choice: Клавдия Эфеба и Валерия Битона, а с ними и Фортуната
  rationale: Имена транслитерированы и склоняются по нормам русского языка; σὺν καί передано с оттенком добавления.
