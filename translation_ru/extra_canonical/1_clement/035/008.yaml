source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: ru
  text: Ты же возненавидел наставление[a] и отбросил Мои слова. Если ты видел вора, то присоединялся к нему и делил участь с прелюбодеем. Твои уста изливали зло, и твой язык сплетал обман. Сидя, ты злословил своего брата и ставил преткновение перед сыном своей матери[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вразумление»; слово может также обозначать воспитание или исправление.'
    reason: Передаёт широкий смысл παιδεία, который невозможно полностью выразить одним русским словом.
  - marker: b
    text: 'Букв.: «сыном своей матери»; это выражение параллельно слову «брат».'
    reason: Поясняет буквальную форму и поэтический параллелизм, не сужая значение выражения.
lexical_decisions:
- source_word: παιδείαν
  choice: наставление
  rationale: Слово охватывает наставление, воспитание и исправляющее вразумление; «наставление» естественно в данном контексте и не сужает смысл до наказания.
- source_word: συνέτρεχες αὐτῷ
  choice: присоединялся к нему
  rationale: Буквально выражение означает «бежал вместе с ним», но в контексте передаёт сознательное соучастие или примыкание к вору.
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: делил участь с прелюбодеем
  rationale: Сохранено единственное число μοιχοῦ; идиоматическая русская формулировка передаёт буквальное «полагал свою долю с».
- source_word: περιέπλεκεν δολιότητα
  choice: сплетал обман
  rationale: Сохраняется образ языка, который сплетает или выстраивает коварный обман.
- source_word: κατελάλεις
  choice: злословил
  rationale: Глагол означает говорить против кого-либо, порочить или клеветать; «злословил» сохраняет обвинительный характер без обязательного уточнения, была ли речь ложной.
- source_word: σκάνδαλον
  choice: преткновение
  rationale: Передаёт образ препятствия или западни, из-за которой другой оступается, и сохраняет традиционную библейскую образность.
theological_decisions:
- issue: Значение παιδεία как исправляющего воздействия
  choice: наставление
  alternative: вразумление; воспитание; наказание
  rationale: Греческое слово не требует понимать здесь исключительно карательное наказание; выбран широкий вариант, сохраняющий воспитательно-исправительный смысл.
- issue: Образ σκάνδαλον
  choice: ставил преткновение
  alternative: ставил западню; возводил напраслину
  rationale: Текст допускает образ препятствия или ловушки; перевод не превращает его без достаточного основания в более узкое обвинение в клевете.
translation_notes:
  register: Современный литературный русский с сохранением торжественной библейской образности. Местоимение «Мои» написано с прописной буквы как речь Бога. Несовершенный вид передаёт продолжающееся или привычное действие греческих форм там, где это уместно.
