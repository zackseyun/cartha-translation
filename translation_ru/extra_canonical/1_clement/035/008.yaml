review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт греческий текст, включая единственное число μετὰ μοιχοῦ («с прелюбодеем») и образный σκάνδαλον. Однако «Увидев» заменяет условное εἰ ἐθεώρεις («если ты видел») временно-причинным оборотом, а «уста умножали зло» неестественно по-русски и менее точно передаёт τὸ στόμα σου ἐπλεόνασεν κακίαν — изобилие злого в речах.
  naturalness: Регистр в целом удачен. «Если ты видел» сохраняет условную конструкцию оригинала; «изливали зло» — естественная современная передача образа переполненности злом. Формулировка «ставил преткновение» намеренно сохраняет библейский образ, но для ясности добавлено «перед», соответствующее направленности действия против адресата.
  terminology: «Наставление» с примечанием к παιδεία допустимо. «Прелюбодей», «злословил» и «преткновение» хорошо сохраняют высокий библейский регистр и не навязывают конфессионального толкования. Примечание b следует сделать нейтральным буквальным пояснением, а не отождествлять выражение безоговорочно с «родным братом».
  issues:
  - severity: medium
    issue: Условное εἰ передано деепричастием «Увидев».
    rationale: Греческое «если ты видел вора» выражает условие; деепричастие делает увиденное предполагаемым фактом и несколько меняет синтаксический смысл.
  - severity: medium
    issue: «Твои уста умножали зло» неестественно и неточно по-русски.
    rationale: ἐπλεόνασεν κακίαν говорит о преизобилии/переполненности злом, исходящим из уст, а не о количественном умножении зла.
  - severity: low
    issue: Примечание b чрезмерно отождествляет «сына своей матери» с «родным братом».
    rationale: Выражение действительно параллельно «брату», но буквальное пояснение лучше сохраняет поэтический параллелизм и не сужает формулировку.
