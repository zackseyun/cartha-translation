    rationale: Формулировка способна обозначать доступность или достижимость предметов. Греческое ὑπέπεπτεν с дательным τῇ διανοίᾳ описывает их явление или попадание в поле ума. «Представало нашему разуму» сохраняет несовершенный аспект и направление образа.
