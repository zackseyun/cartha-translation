source:
  edition: Funk 1901 (normalized OCR)
  text: ζωὴ ἐν ἀθανασίᾳ, λαμπρότης ἐν δικαιοσύνῃ, ἀλήθεια ἐν παρρησίᾳ, πίστις ἐν πεποιθήσει, ἐγκράτεια ἐν ἁγιασμῷ· καὶ ταῦτα ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: ru
  text: жизнь в бессмертии, сияние в праведности, истина в дерзновении, вера в уверенности, самообладание в святости — и всё это представало нашему разуму.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴ ἐν ἀθανασίᾳ
  choice: жизнь в бессмертии
  rationale: Сохранена краткая параллельная конструкция оригинала; «бессмертие» прямо передаёт ἀθανασία.
- source_word: λαμπρότης ἐν δικαιοσύνῃ
  choice: сияние в праведности
  rationale: «Сияние» естественно и достаточно точно передаёт λαμπρότης, не сужая его до славы или великолепия.
- source_word: ἀλήθεια ἐν παρρησίᾳ
  choice: истина в дерзновении
  rationale: «Дерзновение» передаёт положительный смысл παρρησία — свободу и смелость открытой речи — и сохраняет возвышенный регистр.
- source_word: πίστις ἐν πεποιθήσει
  choice: вера в уверенности
  rationale: Различены πίστις («вера») и πεποίθησις («уверенность»), при этом сохранён намеренный параллелизм.
- source_word: ἐγκράτεια ἐν ἁγιασμῷ
  choice: самообладание в святости
  rationale: «Самообладание» ясно передаёт ἐγκράτεια современному читателю; «святость» здесь естественно выражает ἁγιασμός без навязывания специального догматического оттенка.
- source_word: ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν
  choice: всё это было доступно нашему разумению
  rationale: Идиоматично передан смысл того, что перечисленное находилось в пределах мысленного восприятия; прошедшее время отражает форму ὑπέπεπτεν, а «разумение» — направленность διάνοια.
theological_decisions:
- issue: Значение ἁγιασμός
  choice: святость
  alternative: освящение
  rationale: В данной цепочке качеств абстрактное состояние «святость» звучит естественнее; вариант «освящение» мог бы необоснованно выдвинуть на первый план процесс или специальную доктринальную категорию.
- issue: Соотношение πίστις и πεποίθησις
  choice: вера в уверенности
  alternative: верность в убеждённости
  rationale: Обычное значение πίστις «вера» уместно в контексте даров Божьих, а πεποίθησις обозначает уверенность; перевод сохраняет различие и не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмическим параллелизмом исходного перечня. Архаизирующие формы сведены к минимуму; «дерзновение» сохранено как устоявшееся возвышенное слово с положительным смыслом смелой открытости.
