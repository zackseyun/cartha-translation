  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: ru
  text: Ведь поступающие так ненавистны Богу; и не только те, кто так поступает, но и те, кто одобряет их поступки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πράσσοντες
  choice: поступающие
  rationale: Передаёт продолжаемую или характерную практику, выраженную причастием настоящего времени.
- source_word: στυγητοὶ τῷ θεῷ
  choice: ненавистны Богу
  rationale: Сохраняет сильное значение στυγητός и дательный падеж лица, испытывающего отвращение или ненависть.
- source_word: οἱ συνευδοκοῦντες αὐτοῖς
  choice: те, кто одобряет их поступки
  rationale: συνευδοκέω означает соглашаться с кем-либо или одобрять совершаемое им; добавление «поступки» естественно проясняет объект одобрения, заданный контекстом, не меняя смысла.
theological_decisions:
- issue: Степень осуждения в выражении στυγητοὶ τῷ θεῷ
  choice: ненавистны Богу
  alternative: мерзки перед Богом
  rationale: Выбрана прямая и сильная передача греческого прилагательного без смягчения богословского напряжения; альтернатива может привнести более узкую культовую окраску, которой здесь нет.
