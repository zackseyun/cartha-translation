source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: ru
  text: Итак, будем стремиться оказаться в числе тех, кто ожидает Его[a], чтобы нам приобщиться к обещанным дарам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпеливо ожидает Его».'
    reason: Сохраняет оттенок терпеливой стойкости в ὑπομένω, не вводя неуместного смысла «терпеть Его».
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: будем стремиться
  rationale: Передаёт призыв к настойчивому усилию без излишне спортивного или военного оттенка русского «сражаться».
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: оказаться в числе
  rationale: Естественно передаёт греческую конструкцию со значением принадлежности к определённой группе.
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: тех, кто ожидает Его
  rationale: При личном объекте αὐτόν глагол ὑπομένω здесь уместно понимать как стойкое ожидание или упование, а не как перенесение Бога в качестве тяготы.
- source_word: μεταλάβωμεν
  choice: чтобы и нам получить
  rationale: В контексте даров выражает причастность к ним; частица «и» естественно подчёркивает включение говорящих в число получателей.
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: обещанные дары
  rationale: Кратко и точно передаёт причастие и существительное, сохраняя богословски значимое понятие дара.
theological_decisions:
- issue: Значение ὑπομένω с местоимением αὐτόν
  choice: ожидает Его
  alternative: стойко ожидает Его / претерпевает Его
  rationale: «Ожидать Его» соответствует употреблению глагола с личным объектом в библейской греческой традиции и не создаёт ошибочного впечатления, будто Сам Бог является бедствием, которое нужно терпеть. Оттенок стойкости отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и торжественная без архаизмов. Местоимение «Его» написано с прописной буквы, поскольку относится к Богу.
