    issue: Временная форма «некому было избавить»
    rationale: При μήποτε с аористным сослагательным и последующим μὴ ᾖ речь идёт о предупреждении о возможном последствии, а не о прошлом событии. «Не оказалось никого, кто мог бы избавить» естественно передаёт отсутствие избавителя.
  - severity: low
    issue: Неточная формулировка сноски
    rationale: Объект ἁρπάσῃ в греческом действительно не выражен, но сноска о невыраженных субъекте и объекте чрезмерно расширяет неоднозначность. В данном контексте подразумеваемый субъект традиционно и контекстуально понимается как Бог.
  revised_text: Поймите же это, вы, забывающие Бога, чтобы Он не схватил вас, словно лев[a], и не оказалось никого, кто мог бы избавить.
  revised_footnotes:
