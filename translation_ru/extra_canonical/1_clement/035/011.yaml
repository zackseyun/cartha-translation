id: 1CLEM.35.11
reference: 1 Clement 35:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ, μήποτε ἁρπάσῃ ὡς λέων, καὶ μὴ ᾖ ὁ ῥυόμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: ru
  text: Поймите же это, вы, забывающие Бога, чтобы Он не схватил вас, словно лев[a], и не оказалось никого, кто мог бы избавить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы Он схватил, словно лев»; в греческом тексте дополнение при глаголе не выражено.'
    reason: Сохраняет отмеченную в английской редакционной истории возможность не восполнять подразумеваемый объект, не преувеличивая неоднозначность субъекта.
lexical_decisions:
- source_word: σύνετε
  choice: уразумейте
  rationale: Повелительная форма призывает не просто услышать, а понять и принять к сведению; «уразумейте» сохраняет торжественный, но понятный современному читателю регистр.
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: забывающие Бога
  rationale: Причастный оборот передан прямо, без добавления конфессионального толкования.
- source_word: ἁρπάσῃ
  choice: схватил вас
  rationale: Глагол означает резкое захватывание или похищение. По-русски переходный глагол естественно требует дополнения; «вас» восстанавливается из обращения к забывающим Бога.
- source_word: ὁ ῥυόμενος
  choice: некому было избавить
  rationale: Субстантивированное причастие обозначает того, кто избавляет или спасает; безличная русская конструкция естественно передаёт отсутствие избавителя.
theological_decisions:
- issue: Не названные прямо субъект и объект глагола ἁρπάσῃ
  choice: «Он не схватил вас» с прописной буквой, относя местоимение к Богу, а объект — к адресатам
  alternative: «не схватил, как лев» без выраженных субъекта и объекта
  rationale: Контекст обращения к забывающим Бога делает Бога наиболее вероятным субъектом, а адресатов — объектом. Поскольку греческая форма сама по себе этого не выражает, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис близок к греческому, но остаётся естественным и ясным.
