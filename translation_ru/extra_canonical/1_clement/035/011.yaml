  source_fidelity: 'В целом смысл передан верно: σύνετε — призыв понять, ἐπιλανθανόμενοι τοῦ θεοῦ — «забывающие Бога», а ἁρπάσῃ — внезапное насильственное «схватить». Однако «некому было избавить» неудачно согласует время с предостережением и звучит как констатация прошлого. Лучше передать вторую часть как отсутствие возможного избавителя.'
  naturalness: '«Уразумейте» допустимо, но для современного литературного русского несколько архаично. «Поймите же» сохраняет побудительность и звучит естественнее. Оборот «как лев» следует отнести к подразумеваемому субъекту яснее: «словно лев».'
  terminology: «Бог» и «избавить» уместны. Прописное «Он» является допустимым контекстуальным восполнением подразумеваемого субъекта, но сноска должна точно описывать именно невыраженное дополнение, а не создавать впечатление, что в греческом одинаково неопределённы оба участника действия.
  issues:
