revisions:
- from: Итак, уразумейте это, забывающие Бога, чтобы Он не схватил вас, как лев[a], и некому было избавить.
  to: Поймите же это, вы, забывающие Бога, чтобы Он не схватил вас, словно лев[a], и не оказалось никого, кто мог бы избавить.
  rationale: Исправлены временно-смысловое несоответствие во второй части и неточность сноски; «Поймите же» и «словно лев» дают естественный современный литературный русский при сохранении торжественного регистра и структуры оригинала.
