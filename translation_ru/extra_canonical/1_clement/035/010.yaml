  yaml_path: translation/extra_canonical/1_clement/035/010.yaml
  text: I will rebuke you and set it before your face.
translation:
  language: ru
  text: Я обличу тебя и представлю это перед твоим лицом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте объект глагола «представлю» не назван; буквально: «представлю перед твоим лицом».'
    reason: Отмечает добавленное для русской грамматики «это» и сохраняет буквальный образ исходного текста.
lexical_decisions:
- source_word: ἐλέγξω
  choice: обличу
  rationale: Передаёт не просто порицание, а выявление и изобличение вины; соответствует торжественному судебно-пророческому тону.
- source_word: παραστήσω
  choice: представлю
  rationale: Сохраняет образ постановки или предъявления чего-либо перед человеком; в данном контексте естественно понимается как предъявление его поступков.
- source_word: κατὰ πρόσωπόν σου
  choice: перед твоими глазами
  rationale: Естественное русское выражение для буквального «перед твоим лицом», подчёркивающее открытое предъявление человеку его дел.
theological_decisions:
- issue: Не выраженный в греческом тексте объект при παραστήσω
  choice: всё это
  alternative: тебя
  rationale: Форма σε непосредственно после ἐλέγξω естественно служит объектом «обличу», тогда как у παραστήσω объект подразумевается из контекста цитируемого изречения — поступки или обвинения. «Всё это» делает русский текст грамматически полным, не сужая подразумеваемый объект до одного конкретного понятия.
translation_notes:
  register: Современный литературный русский язык с достоинством и пророческо-судебной интонацией; без архаизма «пред лицо твоё».
