  to: 'Ибо Писание говорит: «Нечестивому же Бог сказал: “Зачем ты возвещаешь Мои постановления и берёшь Мой завет на свои уста?”»'
  rationale: Исправлена только передача заключительной части цитаты, чтобы сохранить образ и лексику греческого текста. Также «установления» заменено на близкое по смыслу «постановления» для более прямой передачи δικαιώματα. Ввиду явной OCR-порчи начальной части предоставленного греческого текста чтение цитаты сверено с её известной формой в Пс 49:16 LXX и с английским аудиторским слоем.
