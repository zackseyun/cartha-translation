  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: ru
  text: 'Ибо Писание говорит: «Нечестивому же Бог сказал: “Зачем ты возвещаешь Мои постановления и берёшь Мой завет на свои уста?”»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Ибо Писание говорит
  rationale: Сохранена обычная формула введения цитаты в настоящем времени.
- source_word: τῷ δὲ ἁμαρτωλῷ
  choice: Нечестивому же
  rationale: Начало цитаты в предоставленном OCR-тексте искажено; чтение восстановлено по известному тексту Пс 49:16 LXX и подтверждается консультационным английским слоем. «Нечестивому» естественно передаёт здесь существительное ἁμαρτωλῷ в контексте обличения.
- source_word: τὰ δικαιώματά μου
  choice: Мои установления
  rationale: δικαιώματα здесь обозначает установленные Богом постановления; «установления» сохраняет юридико-заветный оттенок, не сводя выражение к абстрактной праведности.
- source_word: ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου
  choice: произносишь слова Моего завета
  rationale: 'Буквально: «берёшь Мой завет на свои уста». Русская формулировка естественно выражает публичное произнесение заветных слов и сохраняет связь с устами/речью без неидиоматичного буквализма.'
theological_decisions:
- issue: Обозначение адресата как ἁμαρτωλός
  choice: нечестивый
  alternative: грешник
  rationale: В контексте псалма речь идёт не просто о человеке, совершившем грех, а о том, кто лицемерно повторяет Божьи постановления, отвергая их на деле; «нечестивый» передаёт эту нравственную характеристику, не вводя конфессионального толкования.
- issue: Временная форма εἶπεν ὁ θεός
  choice: сказал Бог
  alternative: говорит Бог
  rationale: Сохранён аорист самой цитаты, тогда как вводная формула λέγει передана настоящим временем. Это не устраняет различие временных форм исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Вложенные кавычки разграничивают слова автора и прямую речь Бога. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют распространённой русской издательской традиции, не добавляя смыслового содержания.
