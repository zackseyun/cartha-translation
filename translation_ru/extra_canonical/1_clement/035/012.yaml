  terminology: '«Жертва хвалы», «прославит Меня» и «спасение Божье» точны и уместны. Не следует заменять «спасение Божье» на «Моё спасение»: исходный текст сохраняет τρίтьелицевое τοῦ θεοῦ при речи от первого лица.'
