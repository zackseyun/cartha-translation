  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: ru
  text: «Жертва хвалы прославит Меня, и там — путь, которым Я покажу ему спасение Божье»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое «и там — путь, которым…» синтаксически необычно. В данном тексте относительное местоимение имеет форму ἣν; в более привычной форме этой библейской цитаты ожидается ᾗ. Поэтому связь «пути» с тем, что Бог покажет спасение, передана как связь средства, но остаётся текстуально не вполне ясной.
    reason: Отмечает трудность формы исходного текста и сохраняет неоднозначность, не исправляя текст перевода по иной форме цитаты.
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: жертва хвалы
  rationale: Сохраняет образ и устойчивое библейское словосочетание исходного текста.
- source_word: δοξάσει με
  choice: прославит Меня
  rationale: Прямо передаёт будущее время и объект местоимения.
- source_word: καὶ ἐκεῖ ὁδός
  choice: и там — путь
  rationale: Сохраняет необычную, сжатую конструкцию греческого текста, не подменяя её более гладким вариантом иной текстовой традиции.
- source_word: ἣν δείξω αὐτῷ
  choice: на котором Я покажу ему
  rationale: Относительное местоимение женского рода соотнесено с ὁδός; по-русски естественно обозначить путь как пространство или направление действия.
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: спасение Божье
  rationale: Передаёт субстантивированное σωτήριον как «спасение», сохраняя родительный оборот τοῦ θεοῦ.
theological_decisions:
- issue: Соотношение пути и явления спасения
  choice: на котором Я покажу ему спасение Божье
  alternative: которым Я покажу ему спасение Божье
  rationale: Греческое ἣν допускает тесную связь с «путём», однако синтаксис необычен. Выбранный вариант сохраняет образ пути и не утверждает однозначно, что сам путь является средством спасения.
- issue: Лицо говорящего и выражение «спасение Божье»
  choice: Меня / Я с прописной буквы; «спасение Божье» сохранено в третьем лице
  alternative: меня / я; «Моё спасение»
  rationale: Цитата представляет Бога говорящим, но исходный текст буквально говорит «спасение Бога». Эта напряжённость сохранена, а не устранена заменой на «Моё спасение».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Тире помогает передать эллиптическую греческую конструкцию. Кавычки показывают, что это продолжение цитаты; прописные буквы в местоимениях относятся к Богу и соответствуют принятой русской религиозной письменной норме.
