revisions:
- from: Что же уготовано тем, кто терпеливо переносит испытания? Сам всесвятой Творец и Отец веков знает меру и красоту уготованного.
  to: Что же уготовано для тех, кто стойко терпит? Сам всесвятой Творец и Отец веков знает величину и красоту того, что уготовано.
  rationale: Устранено смысловое добавление «испытания», сохранены абсолютный характер ὑπομένουσιν и множественная референция τὰ ἑτοιμασμένα посредством выражения «того, что уготовано». Формулировка «величину и красоту» ближе к ποσότητα καὶ καλλονήν, не вводя богословских интерпретаций.
