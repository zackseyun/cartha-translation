source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: ru
  text: Что же уготовано для тех, кто стойко терпит? Сам всесвятой Творец и Отец веков знает величину и красоту того, что уготовано.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: тем, кто терпеливо переносит испытания
  rationale: Причастие обозначает стойкое, терпеливое перенесение трудностей; слово «испытания» естественно передаёт подразумеваемый объект, не добавляя отсутствующего в греческом «ради Него».
- source_word: δημιουργὸς
  choice: Творец
  rationale: В данном контексте слово обозначает Бога как Создателя; «Творец» — ясный и традиционный русский эквивалент.
- source_word: πατὴρ τῶν αἰώνων
  choice: Отец веков
  rationale: Формальная передача сохраняет широту и возможную богословскую многозначность αἰώνων, не сводя выражение только к «вечности» или «мирам».
- source_word: ποσότητα
  choice: меру
  rationale: Здесь речь идёт о величии или объёме уготованных благ; «мера» сохраняет образность исходного слова и хорошо сочетается с «красотой».
- source_word: καλλονὴν
  choice: красоту
  rationale: Прямой и естественный эквивалент, передающий привлекательность и великолепие уготованного.
theological_decisions:
- issue: Объект терпеливого перенесения в τοῖς ὑπομένουσιν
  choice: Не добавлять «ради Него»; передать как перенесение испытаний
  alternative: «тем, кто терпеливо ждёт» или «тем, кто терпеливо переносит ради Него»
  rationale: В данном стихе отсутствует местоимение «Его/ради Него». При этом контекстуальный смысл ὑπομένω лучше передаётся стойким перенесением испытаний, а не простым ожиданием.
- issue: Значение τῶν αἰώνων
  choice: «веков»
  alternative: «вечности» или «миров»
  rationale: «Веков» сохраняет семантическую широту греческого выражения и не разрешает его богословскую многозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным церковно-нравственным звучанием. Эмфатическое αὐτός передано начальным «Сам». Повтор существительного устранён естественной субстантивацией «уготованного».
