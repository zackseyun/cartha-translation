  - severity: low
    issue: «Угодного и приятного Ему»
    rationale: εὐπρόσδεκτα означает «приемлемое, благоприятно принимаемое»; «приемлемого для Него» точнее и сохраняет различение с εὐάρεστα.
  - severity: low
