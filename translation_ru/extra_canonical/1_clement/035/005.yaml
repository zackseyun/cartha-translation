source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: ru
  text: Но как же это осуществится, возлюбленные? Если мы будем умом твёрдо и верно устремлены к Богу[a], если будем искать угодного и приемлемого для Него, если будем делать то, что соответствует Его безупречной воле[b], и следовать путём истины, отвергнув от себя всякую неправедность и зло, алчность, распри, злобу и обман, тайные пересуды и клевету, ненависть к Богу[c], гордость и надменность, тщеславие и негостеприимство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая форма описывает ум как уже твёрдо утверждённый или пребывающий в твёрдой направленности к Богу; представленный текст, по-видимому, содержит ошибку распознавания вместо ἐστηριγμένη ᾖ.
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: 'Или: «то, что подобает Его безупречному замыслу».'
    reason: lexical_ambiguity
  - marker: c
    text: 'Возможно также: «то, что ненавистно Богу».'
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: 'ἐστηριγμένη ᾖ (в представленном OCR: ἐστηργιμένῃ ἢ)'
  choice: будет с верой твёрдо обращён
  rationale: Передаёт состояние твёрдой направленности ума к Богу и наречие πιστῶς; формулировка естественна по-русски и не превращает πιστῶς однозначно в конфессионально нагруженное понятие.
- source_word: τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ
  choice: угодного и приятного Ему
  rationale: 'Сохраняет два близких определения: то, что угодно Богу и благоприятно принимается Им.'
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  choice: то, что соответствует Его безупречной воле
  rationale: ἀνήκοντα означает подобающее или соответствующее, а βούλησις в данном нравственном контексте естественно передаётся словом «воля».
- source_word: κακοηθείας τε καὶ δόλους
  choice: злобу и обман
  rationale: Передаёт дурной, злонамеренный характер κακοήθεια без чрезмерно конкретного толкования; множественное δόλους естественно обобщается русским собирательным «обман».
- source_word: ψιθυρισμούς τε καὶ καταλαλιάς
  choice: тайные пересуды и клевету
  rationale: Различает скрытые злонамеренные разговоры и открытое порочащее злословие.
- source_word: κενοδοξίαν τε καὶ ἀφιλοξενίαν
  choice: тщеславие и негостеприимство
  rationale: Это точные и понятные современные русские соответствия отвлечённым существительным.
theological_decisions:
- issue: Значение θεοστυγία
  choice: ненависть к Богу
  alternative: то, что ненавистно Богу
  rationale: Словообразование и контекст перечня человеческих пороков поддерживают активный смысл «ненависть к Богу», однако родственная лексема допускает и пассивно-оценочный оттенок, поэтому альтернатива отмечена в сноске.
- issue: Значение βούλησις
  choice: воля
  alternative: замысел
  rationale: В призыве исполнять угодное Богу речь естественно воспринимается как о Божьей воле; при этом слово может обозначать решение или замысел, что сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного увещевания. Риторический вопрос и последовательность условных придаточных сохранены; перечень пороков передан ясными общеупотребительными отвлечёнными существительными без архаизации.
