  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: ru
  text: Ты совершил это, а Я молчал; ты полагал, беззаконник, что Я буду подобен тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἐποίήσας
  choice: Ты делал это
  rationale: Передаёт указательное ταῦτα и аорист ἐποίησας естественной русской формой, описывающей совершавшиеся поступки.
- source_word: ἐσίγησα
  choice: Я молчал
  rationale: Прямо сохраняет значение глагола σιγάω и контраст между действиями человека и Божьим молчанием.
- source_word: ὑπέλαβες
  choice: ты подумал
  rationale: В данном контексте ὑπολαμβάνω означает ошибочно предположить или счесть; «подумал» звучит естественно и не добавляет отсутствующей в тексте оценки.
- source_word: ἄνομε
  choice: беззаконник
  rationale: Звательный падеж ἄνομε передан прямым обращением; существительное сохраняет нравственно-правовой смысл слова.
- source_word: ὅτι ἔσομαι ὅμοιος σοι
  choice: что Я буду подобен тебе
  rationale: Сохраняет будущее время и сравнительную конструкцию оригинала без истолковывающего расширения.
theological_decisions:
- issue: Кто говорит в цитате
  choice: Местоимение «Я» написано с прописной буквы как указание на Бога.
  alternative: Писать «я» со строчной буквы, следуя отсутствию регистра в древнегреческой рукописной традиции.
  rationale: Контекст цитаты подразумевает Божью речь; прописная буква соответствует современной русской библейской издательской норме, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и обличительной интонацией. Порядок частей и резкий переход к обращению сохранены близко к греческому оригиналу.
