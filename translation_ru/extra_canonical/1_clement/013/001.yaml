source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: ru
  text: 'Итак, братья, будем смиренны, отбросив всякое высокомерие, самомнение, безрассудство и вспышки гнева, и исполним написанное. Ведь Святой Дух говорит: «Пусть мудрый не хвалится своей мудростью, сильный — своей силой, а богатый — своим богатством; но тот, кто хвалится, пусть хвалится Господом, чтобы искать Его и творить суд и праведность». Особенно же будем помнить слова Господа Иисуса, которые Он произнёс, уча кротости и долготерпению.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: будем смиренны
  rationale: Передаёт увещевательное сослагательное наклонение и смысл смиренного образа мыслей естественным современным русским выражением.
- source_word: ἀλαζονείαν καὶ τύφος
  choice: высокомерие, самомнение
  rationale: Различает хвастливую заносчивость и надменную самоуверенность, не перегружая фразу архаизмами.
- source_word: ὀργάς
  choice: вспышки гнева
  rationale: Множественное число указывает на отдельные проявления или приступы гнева, а не только на гнев как общее состояние.
- source_word: ποιήσωμεν τὸ γεγραμμένον
  choice: исполним написанное
  rationale: В контексте призыв означает поступить согласно Писанию; «исполним» звучит естественно и сохраняет деятельный смысл ποιεῖν.
- source_word: ποιεῖν κρίμα καὶ δικαιοσύνην
  choice: творить суд и праведность
  rationale: Сохраняет библейскую парную формулу и различие между справедливым судом и праведным действием.
- source_word: ἐπιείκειαν καὶ μακροθυμίαν
  choice: кротости и долготерпению
  rationale: «Кротость» передаёт мягкость и незлобивость ἐπιείκεια, а «долготерпение» — длительное терпение μακροθυμία; оба слова понятны в dignified biblical register.
theological_decisions:
- issue: Границы речи Святого Духа и цитаты Писания
  choice: Фраза «чтобы искать Его и творить суд и праведность» оставлена внутри кавычек
  alternative: Закрыть кавычки после слов «пусть хвалится Господом» и отнести последующую фразу к авторскому предложению
  rationale: Греческий текст грамматически включает τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην в содержание, вводимое словами «Святой Дух говорит»; такая пунктуация также соответствует последней текстовой ревизии.
- issue: Значение ἐν κυρίῳ при глаголе «хвалиться»
  choice: хвалится Господом
  alternative: хвалится в Господе
  rationale: Творительный падеж естественно передаёт основание и предмет похвалы в современном русском, не исключая смысла нахождения похвалы «в Господе».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейским звучанием. Синтаксис упрощён ровно настолько, чтобы длинное греческое предложение оставалось ясным; традиционные слова «праведность» и «долготерпение» сохранены ради точности и жанровой уместности.
