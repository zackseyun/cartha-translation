  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: ru
  text: «На кого Я призрю, если не на того, кто кроток и тих и трепещет перед Моими словами?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: призрю
  rationale: Передаёт направленный благосклонный взгляд в торжественной речи; слово понятно в библейском контексте и сохраняет достоинство цитаты.
- source_word: πρᾶον
  choice: кроток
  rationale: Обычный и точный русский эквивалент для нравственной кротости, не сводящий значение к слабости.
- source_word: ἡσύχιον
  choice: тих
  rationale: Сохраняет значение спокойного, мирного нрава и естественно сочетается с «кроток».
- source_word: τρέμοντά μου τὰ λόγια
  choice: трепещет перед Моими словами
  rationale: Естественно передаёт благоговейный страх и серьёзное отношение к Божьим словам, не устраняя присущую образу напряжённость.
theological_decisions:
- issue: Единство лица, описанного тремя признаками
  choice: «того, кто кроток и тих и трепещет» — одно лицо
  alternative: «кроткого и тихого и того, кто трепещет» — два лица или две группы
  rationale: 'Единственный артикль τὸν управляет всеми тремя согласованными определениями: πρᾶον, ἡσύχιον и τρέμοντα.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Прописные «Я» и «Моими» обозначают речь Бога. Структура риторического вопроса и единый ряд трёх качеств сохранены.
