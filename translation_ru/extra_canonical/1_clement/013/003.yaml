base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: ru
  text: 'Этой заповедью и этими наставлениями будем укреплять себя, чтобы идти в послушании его святым словам и со смирением. Ибо святое слово говорит:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλμασι
  choice: наставлениями
  rationale: Передаёт обязательный характер предписаний, сохраняя естественность современного русского языка и не дублируя «заповедью».
- source_word: στηρίξωμεν ἑαυτούς
  choice: укрепим себя
  rationale: Сохраняет возвратную конструкцию и увещательный характер аористного конъюнктива.
- source_word: εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας
  choice: чтобы идти, повинуясь
  rationale: Естественно выражает цель и сопутствующее состояние послушания, не превращая «идти» в абстрактное «жить».
- source_word: ἁγιοπρεπέσι λόγοις
  choice: словам, достойным святости
  rationale: Передаёт значение сложного прилагательного ἁγιοπρεπής — «подобающий святости, достойный святости», не расщепляя его на два независимых признака.
- source_word: ταπεινοφρονοῦντες
  choice: пребывая в смиренномудрии
  rationale: Сохраняет длительный оттенок причастия и традиционно понятное нравственное понятие, избегая неестественного «мысля смиренно».
- source_word: ὁ ἅγιος λόγος
  choice: святое слово
  rationale: Формально передаёт выражение автора и его вводную формулу перед цитатой.
theological_decisions:
- issue: Отнесение местоимения αὐτοῦ
  choice: его
  alternative: Его
  rationale: Греческий текст не различает прописные и строчные формы местоимения в современном конфессиональном смысле; строчная буква сохраняет нейтральность издания, при ясной отсылке к Христу/Господу из контекста.
- issue: Смысл ἁγιοπρεπέσι
  choice: достойным святости
  alternative: святым
  rationale: Более полно сохраняется смысл «подобающим святости»; краткое «святым» естественно, но сглаживает семантику сложного прилагательного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещательным тоном. Сохранены риторическая структура оригинала и двоеточие перед следующей цитатой; архаические формы и узкоконфессиональная терминология не используются.
