  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: ru
  text: 'Ибо так Он сказал: «Будьте милосердны, чтобы и вы были помилованы; прощайте, чтобы и вам было прощено. Как вы поступаете, так поступят и с вами; как даёте, так и вам будет дано; как судите, так и сами будете судимы; как оказываете доброту, так и к вам проявят доброту. Какой мерой вы мерите, той же мерой будет отмерено и вам».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε
  choice: Будьте милосердны
  rationale: Передаёт повеление проявлять милость естественным и возвышенным современным русским языком.
- source_word: ἀφίετε
  choice: прощайте
  rationale: В данном контексте глагол означает прощение проступков или долгов; несовершенный вид хорошо передаёт общее наставление.
- source_word: ὡς ποιεῖτε
  choice: как вы поступаете
  rationale: «Поступаете» естественнее буквального «делаете» и сохраняет широкое нравственное значение ποιεῖτε.
- source_word: χρηστεύεσθε
  choice: оказываете доброту
  rationale: Редкий глагол обозначает доброжелательное, доброе отношение; эта формулировка сохраняет деятельный оттенок.
- source_word: ᾧ μέτρῳ μετρεῖτε
  choice: какой мерой мерите
  rationale: Сохраняет образ меры и привычную для русского языка афористическую форму.
theological_decisions:
- issue: Неуказанный субъект пассивных форм ἐλεηθῆτε, ἀφεθῇ, δοθήσεται и других
  choice: Сохранены пассивные и неопределённо-личные конструкции без прямого называния Бога
  alternative: 'Явно назвать Бога действующим лицом: «Бог помилует вас», «Бог простит вас»'
  rationale: Греческий текст не называет действующее лицо; перевод не должен устранять возможный божественный пассив или сужать смысл.
- issue: Связь ἵνα между повелением и последствием
  choice: Передана союзом «чтобы»
  alternative: 'Передать как гарантированную причинную формулу: «и тогда»'
  rationale: «Чтобы» сохраняет формальную целевую или результативную связь и не усиливает её богословски.
- issue: Местоимение при вводной формуле εἶπεν
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы либо явное «Господь»
  rationale: Контекст цитаты указывает на слова Иисуса; прописная буква соответствует русской издательской традиции, тогда как добавление имени или титула отсутствовало бы в исходной строке.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены ритмические параллели и повтор «как… так…», но синтаксис сделан естественным для обычного читателя. Маркеры сносок не требуются, поскольку сносок нет.
