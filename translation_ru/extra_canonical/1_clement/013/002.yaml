revisions:
- from: 'Ибо так Он сказал: «Будьте милосердны, чтобы и вы были помилованы; прощайте, чтобы и вам было прощено. Как вы поступаете, так поступят и с вами; как даёте, так и вам будет дано; как судите, так и сами будете судимы; как оказываете доброту, так и к вам проявят доброту. Какой мерой мерите, такой будет отмерено и вам».'
  to: 'Ибо так Он сказал: «Будьте милосердны, чтобы и вы были помилованы; прощайте, чтобы и вам было прощено. Как вы поступаете, так поступят и с вами; как даёте, так и вам будет дано; как судите, так и сами будете судимы; как оказываете доброту, так и к вам проявят доброту. Какой мерой вы мерите, той же мерой будет отмерено и вам».'
  rationale: 'Исправлена только заключительная формула о мере: восстановлено естественное русское соотнесение «какой мерой — той же мерой». Добавленное «вы» делает первую часть фразы гладкой, а «будет отмерено» сохраняет неназванного деятеля страдательной формы греческого текста.'
