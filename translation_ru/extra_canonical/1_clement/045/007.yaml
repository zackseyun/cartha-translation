    issue: «всеблагому имени» для παναρέτῳ
    rationale: «Всеблагой» акцентирует благость, тогда как παναρέτος относится ко всякой добродетели или полноте совершенств. Более нейтрально «всесовершенному» с поясняющей сноской.
