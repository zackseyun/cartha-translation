source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: Или Анания, Азария и Мисаил были заключены в огненную печь теми, кто придерживался величественного и славного богопочитания Всевышнего? Да не будет этого! Кто же тогда это сделал? Отвратительные люди, исполненные всякого зла, распалились до такой ярости, что подвергли жестокому обращению тех, кто служил Богу со святым и непорочным намерением, не зная, что Всевышний — поборник и защитник тех, кто с чистой совестью поклоняется Его всесовершенному имени.[a] Ему слава во веки веков. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вседобродетельному имени»; греч. слово означает обладающее всякой добродетелью или всяким совершенством.'
    reason: Передаёт смысловую широту παναρέτῳ, не сводя его только к благости.
lexical_decisions:
- source_word: κατείρχθησαν
  choice: были заключены
  rationale: Форма от κατείργω означает «запирать, заключать, удерживать взаперти»; это точнее, чем «были низвергнуты».
- source_word: θρησκευόντων ... θρησκείαν
  choice: кто чтил ... богопочитание
  rationale: Передаёт словесную фигуру с однокоренными формами, не сводя θρησκεία только к абстрактной «религии».
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: подвергли мучениям
  rationale: αἰκία обозначает жестокое обращение, истязание или мучение; русский оборот естественно выражает причинённое страдание.
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  choice: поборник и защитник
  rationale: 'Сохраняет два близких, но различимых образа: того, кто сражается за других, и того, кто их защищает.'
- source_word: παναρέτῳ ὀνόματι
  choice: всеблагому имени
  rationale: παναρέτος буквально связано со всякой добродетелью или совершенством; «всеблагое» звучит достойно и применимо к Божьему имени, при этом неоднозначность отмечена в сноске.
theological_decisions:
- issue: Риторическое отрицание причастности истинных почитателей Всевышнего к преследованию праведников
  choice: «Да не будет этого!»
  alternative: «Ни в коем случае!»
  rationale: Формула сохраняет торжественный характер μηδὲ ταῦτα τοῦτο γένοιτο и ясное категорическое отрицание.
- issue: Отнесение славословия в ᾧ
  choice: «Ему слава» — ко Всевышнему
  alternative: Грамматически ближайшим antecedent могло бы показаться «имени»
  rationale: Смысл и обычная доксологическая формула указывают на Бога; русский перевод естественно выражает это местоимением мужского рода.
- issue: λατρευόντων с дательным «имени»
  choice: «поклоняется Его ... имени»
  alternative: «служит Его ... имени»
  rationale: «Поклоняться имени» естественнее по-русски и сохраняет культово-религиозный оттенок λατρεύω.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической организацией. Имена переданы в привычной библейской форме. Сохранены риторические вопросы, напряжение между истинным богопочитанием и злодейством гонителей, а также заключительное славословие.
