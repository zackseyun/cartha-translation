    issue: «подвергли мучениям» для εἰς αἰκίαν περιβαλεῖν
    rationale: αἰκία обозначает жестокое обращение, насилие, оскорбительное истязание и не требует значения именно мучений. «Подвергли жестокому обращению» передаёт смысл без излишнего сужения.
  - severity: medium
    issue: «чтил ... богопочитание»
    rationale: 'Такое сочетание неестественно по-русски и размывает смысл θρησκευόντων τὴν ... θρησκείαν: речь о людях, практиковавших/придерживавшихся почитания Всевышнего.'
