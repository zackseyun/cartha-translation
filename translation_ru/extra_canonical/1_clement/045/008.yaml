source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: ru
  text: А те, кто стойко терпели с упованием, унаследовали славу и честь, были возвышены и вписаны Богом в памятную запись о них[a] во веки веков. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в запись для вечной памяти о них».'
    reason: Греческое выражение ἐν τῷ μνημοσύνῳ αὐτῶν допускает оттенки памятования, памятной записи или свидетельства о них.
lexical_decisions:
- source_word: ὑπομένοντες
  choice: те, кто терпел стойко
  rationale: Субстантивированное причастие настоящего времени обозначает стойкое перенесение испытаний; прошедшее время определяется аористами главных глаголов и повествовательным контекстом.
- source_word: ἐν πεποιθήσει
  choice: с упованием
  rationale: πεποίθησις выражает уверенное доверие; «с упованием» естественно передаёт религиозный оттенок, не уточняя без основания объект доверия.
- source_word: ἐκληρονόμησαν
  choice: унаследовали
  rationale: Сохраняет метафору получения удела или наследства.
- source_word: ἐπήρθησαν
  choice: были возвышены
  rationale: Передаёт пассивную форму и допускает как возвышение положения, так и прославление.
- source_word: ἔγγραφοι ἐγένοντο
  choice: были вписаны
  rationale: Естественная русская передача перифрастической конструкции со значением внесения в запись или список.
- source_word: μνημοσύνῳ
  choice: памятную запись
  rationale: В контексте сочетает идеи памятования и письменного внесения, связанные с ἔγγραφοι, не сводя выражение лишь к субъективной памяти.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся и понятная русская формула, точно передающая усиленное обозначение вечности.
theological_decisions:
- issue: Кто является подразумеваемым деятелем возвышения
  choice: сохранён пассив «были возвышены»
  alternative: «Бог возвысил их»
  rationale: Хотя ближайший контекст позволяет подразумевать Бога, греческий текст прямо называет Бога только при следующей конструкции; пассив сохраняет формальную неопределённость.
- issue: Значение ἐν τῷ μνημοσύνῳ αὐτῶν
  choice: «в памятную запись о них»
  alternative: «в Своей памяти о них» или «в их памятнике»
  rationale: Родительный αὐτῶν естественно понимать объективно — памятование о них. Формулировка «памятная запись» учитывает связь с «были вписаны», одновременно сохраняя образ памятования и избегая представления о принадлежащем им памятнике.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис сохранён как единая цепь однородных сказуемых; архаическая формула «во веки веков» оставлена как общеупотребительная библейская идиома.
