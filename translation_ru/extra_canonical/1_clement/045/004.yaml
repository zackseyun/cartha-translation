revisions:
- from: Праведников преследовали — но беззаконники; заключали в темницу — но нечестивцы; побивали камнями — нарушители закона; убивали — гнусные и неправедные, движимые нестерпимой завистью.
  to: Праведников преследовали, но преследовали их беззаконники; заключали в темницу, но заключали их нечестивцы; нарушители закона побивали их камнями; гнусные и несправедливые убивали их, движимые нестерпимой завистью.
  rationale: Уточнена русская синтаксическая связь между страданиями праведников и их гонителями. Повторение «их» и сказуемых лишь раскрывает подразумеваемые в греческом элементы и сохраняет исходный параллелизм. В финале «несправедливые» точнее и современнее передаёт ἄδικοι; причинный оттенок ζήλῳ ἀνεκτρίστῳ сохранён.
