    rationale: 'Греческий текст допускает пропуск повторяющегося сказуемого, тогда как в русском для ясной связи действия с его исполнителями предпочтительно повторить сказуемое: «но преследовали их беззаконники».'
  - severity: low
    issue: «Неправедные» несколько менее точно и менее современно передаёт ἄδικοι.
    rationale: «Несправедливые» естественнее в современном литературном русском и передаёт смысл моральной неправедности/несправедливости, не смешивая термин с δίκαιοι в начале фразы.
