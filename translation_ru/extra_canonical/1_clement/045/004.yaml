  text: ἐδιώχθησαν δίκαιοι, ἀλλ᾽ ὑπὸ ἀνόμων, ἐφυλακίσθησαν, ἀλλ᾽ ὑπὸ ἀνοσίων· ἐλιθοβόλησαν ὑπὸ παρανόμων· ἀπεκτείνθησαν ὑπὸ τῶν μιαρῶν καὶ ἀδίκων ζήλῳ ἀνεκτρίστῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: ru
  text: Праведников преследовали, но преследовали их беззаконники; заключали в темницу, но заключали их нечестивцы; нарушители закона побивали их камнями; гнусные и несправедливые убивали их, движимые нестерпимой завистью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: праведников
  rationale: Передаёт нравственно-религиозный смысл «праведные» и сохраняет противопоставление их гонителям.
- source_word: ἀνόμων
  choice: беззаконники
  rationale: Точно передаёт людей, не признающих или нарушающих закон; форма существительного естественно звучит в параллельной конструкции.
- source_word: ἀνοσίων
  choice: нечестивцы
  rationale: Передаёт отсутствие святости и благочестия, отличая слово от более общего «беззаконники».
- source_word: παρανόμων
  choice: нарушители закона
  rationale: Подчёркивает активное преступление закона, не создавая ошибочного значения «объявленные вне закона».
- source_word: μιαρῶν
  choice: гнусные
  rationale: В контексте характеризует гонителей как нравственно осквернённых и отвратительных; «гнусные» естественнее буквального «осквернённые».
- source_word: ζήλῳ ἀνεκτρίστῳ
  choice: движимые нестерпимой завистью
  rationale: Творительный падеж ζήλῳ выражает причину или побуждение; здесь ζῆλος по контексту имеет отрицательный смысл «зависть», а ἀνεκτρίστῳ — «нестерпимая, невыносимая».
theological_decisions:
- issue: Характер причинной связи в ζήλῳ ἀνεκτρίστῳ
  choice: движимые нестерпимой завистью
  alternative: из-за нестерпимой зависти
  rationale: Выбранная формулировка сохраняет значение побуждающей причины и ясно связывает зависть с убийцами, не добавляя особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повторяющиеся страдательные формы и контрастные наименования гонителей сохранены посредством параллельных конструкций с тире; архаизмы и конфессионально окрашенные добавления исключены.
