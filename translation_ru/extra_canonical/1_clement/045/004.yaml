  source_fidelity: 'Передача последовательности страданий и указанных гонителей в целом точна: δίκαιοι — «праведники», ἄνομοι — «беззаконники», ἀνόσιοι — «нечестивцы», παράνομοι — «нарушители закона». В последней части верно передана причинно-побудительная сила ζήλῳ ἀνεκτρίστῳ как «нестерпимая зависть».'
  naturalness: 'Эллиптические тире сохраняют риторический параллелизм, но в современном русском оборот «Праведников преследовали — но беззаконники» звучит обрывочно: после «но» ожидается сказуемое. Повтор глагола в противопоставленной части делает фразу ясной и литературно естественной, не меняя смысла.'
  terminology: «Неправедные» для ἄδικοι возможно, но «несправедливые» точнее сохраняет обычное значение «неправедные/несправедливые, творящие неправду» без создания чрезмерно специального конфессионального оттенка. «Гнусные» приемлемо для μιαροί в данном оценочном контексте.
  issues:
