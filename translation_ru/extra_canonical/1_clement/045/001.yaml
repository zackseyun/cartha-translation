  text: Φιλόνεικοί ἐστε, ἀδελφοί, καὶ ζηλωταὶ περὶ τῶν ἀνηκόντων εἰς σωτηρίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/001.yaml
  text: You are contentious, brothers, and zealous about the things that pertain to salvation.
translation:
  language: ru
  text: Вы любите спорить, братья, и ревностно занимаетесь тем, что относится к спасению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί
  choice: любите спорить
  rationale: Передаёт отрицательный оттенок склонности к спорам и соперничеству естественным современным русским выражением.
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое и традиционное обращение к членам общины; грамматически мужская форма может охватывать всю общину.
- source_word: ζηλωταὶ
  choice: ревностно занимаетесь
  rationale: Сохраняет значение усердной, горячей вовлечённости и естественно сочетается с последующим оборотом.
- source_word: περὶ τῶν ἀνηκόντων εἰς σωτηρίαν
  choice: тем, что относится к спасению
  rationale: Близко передаёт широкий и намеренно неуточнённый смысл греческого оборота, не сводя его к отдельным средствам или учениям о спасении.
theological_decisions:
- issue: Характер связи упомянутых вещей со спасением
  choice: относится к спасению
  alternative: ведёт ко спасению
  rationale: Греческое ἀνήκω обозначает принадлежность или уместность по отношению к чему-либо и не требует более сильного причинного смысла «ведёт».
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания; сохранено напряжение между порицаемой спорливостью и похвальной либо иронически отмеченной ревностью.
