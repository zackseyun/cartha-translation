  text: ἐνεκύψατε εἰς τὰς ἱερὰς γραφάς, τὰς ἀληθεῖς, τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/002.yaml
  text: You have looked closely into the holy Scriptures[a], the true ones, those given through the Holy Spirit.
translation:
  language: ru
  text: Вы внимательно исследовали священные Писания[a] — истинные, данные через Святого Духа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы склонились, чтобы вникнуть в священные Писания».'
    reason: Сохраняет буквальный пространственный образ глагола ἐγκύπτω, который в данном контексте означает внимательное исследование.
lexical_decisions:
- source_word: ἐνεκύψατε
  choice: вы внимательно исследовали
  rationale: В сочетании с γραφάς глагол передаёт тщательное вникание и изучение; буквальный образ «наклониться, чтобы заглянуть» сохранён в примечании.
- source_word: ἱερὰς γραφάς
  choice: священные Писания
  rationale: Естественное и устойчивое русское соответствие, сохраняющее сакральный характер текстов.
- source_word: τὰς ἀληθεῖς
  choice: истинные
  rationale: Сохраняет самостоятельное приложение греческого текста и его акцент, не повторяя слово «Писания».
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: данные через Святого Духа
  rationale: «Через» прямо передаёт διά с родительным и не уточняет способ действия сверх исходного текста; «данные» естественно восполняет подразумеваемую связь.
theological_decisions:
- issue: Характер связи Писаний со Святым Духом
  choice: данные через Святого Духа
  alternative: возвещённые / написанные Святым Духом
  rationale: Перевод сохраняет посредническую формулировку διά и не вводит более узкого учения о конкретном способе происхождения текста.
translation_notes:
  register: Современный литературный русский язык с достойным церковно-литературным звучанием. Тире ясно оформляет два приложения к «Писаниям», не устраняя их риторического акцента.
