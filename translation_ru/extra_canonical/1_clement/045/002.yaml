  source_fidelity: '«Вы внимательно исследовали» точно передаёт ἐνεκύψατε в контексте обращения к Писаниям: речь о тщательном изучении, а не о буквальном наклоне. «Священные Писания», «истинные» и «данные через Святого Духа» сохраняют синтаксическую связь и акцент греческих определений; формулировка «через» корректно отражает διά с родительным.'
