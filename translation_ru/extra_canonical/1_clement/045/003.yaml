revisions:
- from: Вы знаете, что в них не написано ничего несправедливого или подложного; вы не найдёте, чтобы праведники были отвергнуты святыми мужами.
  to: Вы знаете, что в них не написано ничего несправедливого или искажённого; вы не найдёте праведников, отвергнутых благочестивыми мужами.
  rationale: Исправлена характеристика ὅσιοι, чтобы избежать смысла канонизированных «святых» и сохранить значение благочестия. Синтаксис второй части приближен к греческому прямому утверждению. «Искажённого» точнее выражает παρεπεποιημένον как нечто фальсифицированное или подвергшееся искажению.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Первая часть в целом верно передаёт οὐδὲν ἄδικον οὐδὲ παρεπεποιημένον: «подложного» допустимо, хотя «искажённого» точнее отражает смысл фальсификации/искажения. Во второй части греческое οὐχ εὑρήσετε δικαίους ἀποβεβλημένους дано как прямое утверждение о том, что таких праведников не найдётся; русское придаточное с «чтобы ... были» несколько ослабляет эту форму.'
  naturalness: «Святыми мужами» звучит по-русски архаично и может вызывать ненужную ассоциацию с канонизированными святыми. «Благочестивыми мужами» сохраняет религиозно-нравственный смысл ὅσιοι и остаётся литературным. Конструкция «не найдёте праведников, отвергнутых...» естественнее и ближе к греческому.
  terminology: δικαίους уместно передано как «праведников». Для ὁσίων предпочтительно «благочестивых», а не «святых», поскольку речь не обязательно о титуле или особом статусе «святых».
  issues:
  - severity: medium
    issue: Передача ὁσίων ἀνδρῶν как «святыми мужами»
    rationale: «Святыми» в современном русском обычно обозначает святых в специальном религиозном смысле; ὅσιος здесь характеризует людей как благочестивых/набожных. «Благочестивыми мужами» точнее и не добавляет такого оттенка.
  - severity: low
    issue: Придаточная конструкция «не найдёте, чтобы...»
    rationale: Она допустима, но менее непосредственно соответствует будущему «не найдёте [праведников, отвергнутых...]» и делает фразу тяжеловеснее.
  - severity: low
    issue: «Подложного» для παρεπεποιημένον
    rationale: Слово возможно, но «искажённого» яснее передаёт фальсификацию или изменение текста, не ограничивая смысл подлогом документа.
  revised_text: Вы знаете, что в них не написано ничего несправедливого или искажённого; вы не найдёте праведников, отвергнутых благочестивыми мужами.
  revised_footnotes: []
