  yaml_path: translation/extra_canonical/1_clement/045/003.yaml
  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: ru
  text: Вы знаете, что в них не написано ничего несправедливого или искажённого; вы не найдёте праведников, отвергнутых благочестивыми мужами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: Вы знаете
  rationale: Передаёт уверенное знание адресатов естественным современным выражением.
- source_word: παρεπεποιημένον
  choice: подложного
  rationale: Слово указывает на нечто фальсифицированное или искажённое; «подложного» сохраняет связь с недостоверностью написанного.
- source_word: ἀποβεβλημένους
  choice: были отвергнуты
  rationale: Передаёт совершившееся удаление или отвержение без добавления причины или конкретного способа.
- source_word: ὁσίων ἀνδρῶν
  choice: святыми мужами
  rationale: Сохраняет религиозно-нравственный оттенок ὅσιος и явное обозначение мужчин в ἀνδρῶν.
theological_decisions:
- issue: Референт местоимения αὐταῖς
  choice: в них
  alternative: в Писаниях
  rationale: Греческий текст использует местоимение с референтом из контекста; перевод сохраняет эту анафорическую форму и не делает подразумеваемое существительное явным.
- issue: Связь δικαίους с конструкцией ἀποβεβλημένους
  choice: чтобы праведники были отвергнуты
  alternative: праведников, отвергнутых
  rationale: Придаточная конструкция звучит естественно по-русски и сохраняет утверждение автора, не уточняя обстоятельств отвержения.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским регистром; синтаксис слегка выровнен ради ясности, при этом сохранены категоричность двух отрицательных утверждений и смысловая напряжённость между праведниками и святыми мужами.
