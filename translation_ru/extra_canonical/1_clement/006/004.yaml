  text: Because of jealousy and strife, great cities have been overthrown and great nations uprooted.
translation:
  language: ru
  text: Ревность и распря разрушили великие города и искоренили великие народы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ревность
  rationale: В контексте главы слово обозначает пагубную завистливую ревность; «ревность» сохраняет повторяющийся ключевой термин и его смысловую широту.
- source_word: ἔρις
  choice: распря
  rationale: Передаёт разрушительный раздор естественным и достойным современным русским языком.
- source_word: κατέστρεψεν
  choice: разрушили
  rationale: Греческая форма активна и означает уничтожение или ниспровержение; применительно к городам «разрушили» звучит естественно.
- source_word: ἐξερίζωσεν
  choice: искоренили
  rationale: Сохраняет сильный образ вырывания с корнем и применимо к уничтожению целых народов.
theological_decisions: []
translation_notes:
  register: 'Краткая афористичная фраза сохранена. В греческом тексте нет предлога διὰ в этом стихе: ζῆλος καὶ ἔρις являются подлежащими, поэтому выбран активный строй без добавления «из-за».'
