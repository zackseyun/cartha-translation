source:
  edition: Funk 1901 (normalized OCR)
  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: ru
  text: К этим мужам, жившим свято, присоединилось великое множество избранных, которые из-за зависти претерпели многие надругательства и мучения и стали среди нас прекраснейшим примером.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «претерпев из-за зависти многие надругательства и мучения».'
    reason: Греческий порядок слов допускает более непосредственное присоединение причинного оборота к причастию; примечание сохраняет формально более близкий вариант.
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  choice: жившим свято
  rationale: Причастие от πολιτεύομαι здесь описывает образ жизни и поведения; естественное русское выражение сохраняет наречное ὁσίως и не сужает смысл до гражданской деятельности.
- source_word: συνηθροίσθη
  choice: присоединилось
  rationale: Форма означает, что множество было собрано вместе с ранее названными мужами; «присоединилось» ясно передаёт эту связь в русском контексте.
- source_word: ἐκλεκτῶν
  choice: избранных
  rationale: Сохраняется традиционный и богословски ненагруженный сверх контекста эквивалент для ἐκλεκτοί.
- source_word: αἰκίαις
  choice: издевательства
  rationale: Слово обозначает жестокое, унизительное обращение, насилие или надругательства; «издевательства» естественно сочетается с «мучениями» и не дублирует его.
- source_word: βασάνοις
  choice: мучения
  rationale: Передаёт физические истязания и страдания, обозначаемые βάσανοι.
- source_word: διὰ ζῆλος
  choice: из-за зависти
  rationale: Несогласованная по норме классического греческого форма ζῆλος в этом контексте продолжает тему зависти; причинное значение διά передано прямо.
- source_word: ὑπόδειγμα κάλλιστον
  choice: прекраснейшим примером
  rationale: Сохраняется превосходная степень κάλλιστον и значение ὑπόδειγμα как образца или примера для подражания.
- source_word: ἐν ἡμῖν
  choice: для нас
  rationale: В данном обороте естественно выражает, что они стали примером в среде общины и для неё; буквальное «среди нас» возможно, но по-русски менее ясно раскрывает функцию примера.
theological_decisions:
- issue: Кого обозначает «великое множество избранных»
  choice: Сохранить общее обозначение без уточнения пола, статуса или принадлежности к конкретной группе.
  alternative: Уточнить как «верующих», «христиан» или связать только с последующими женскими примерами.
  rationale: Греческое ἐκλεκτῶν само по себе таких уточнений не содержит; перевод сохраняет широту исходного выражения.
- issue: Причина страданий διὰ ζῆλος
  choice: Передать как «из-за зависти».
  alternative: «Из-за ревности» или «из-за соперничества».
  rationale: Контекст 1 Климента последовательно представляет зависть как причину гонений и гибели праведных; при этом русский вариант не уточняет, чья именно это была зависть.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис упрощён до естественного русского порядка слов, но превосходная степень и ключевые богословские термины сохранены. Маркер сноски помещён в основном тексте.
