revisions:
- from: К этим мужам, жившим свято, присоединилось великое множество избранных, которые из-за зависти претерпели многие издевательства и мучения и стали для нас прекраснейшим примером.[a]
  to: К этим мужам, жившим свято, присоединилось великое множество избранных, которые из-за зависти претерпели многие надругательства и мучения и стали среди нас прекраснейшим примером.[a]
  rationale: 'Исправлено значение ἐν ἡμῖν: «среди нас» сохраняет общинно-пространственный смысл оригинала без добавления целевой направленности. «Надругательства» уточняет значение αἰκίαις как жестокого унизительного обращения. Структура, смысл, степень сравнения и сноска сохранены.'
