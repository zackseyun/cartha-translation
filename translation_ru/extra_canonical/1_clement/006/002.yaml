base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: ru
  text: Из-за зависти женщины — Данаиды и Дирки[a] — подверглись гонениям. Претерпев ужасные и нечестивые истязания, они вступили на надёжный путь веры и получили благородную награду, хотя телом были слабы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Данаиды и Дирки» — мифологические имена. Вероятно, они связаны с образами, с которыми сопоставляются преследуемые женщины; точные исторические обстоятельства этого выражения неясны.
    reason: Имена нуждаются в кратком пояснении, но сноска не должна выдавать спорную реконструкцию публичных представлений или конкретного способа казни за установленный факт.
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: из-за зависти
  rationale: ζῆλος в контексте 1 Кл 4–6 обозначает губительную зависть или ревность; «зависть» естественно продолжает ход мысли главы.
- source_word: Δαναΐδες καὶ Δίρκαι
  choice: Данаиды и Дирки
  rationale: Сохранены греческие мифологические наименования во множественном числе; вероятно, речь идёт об образах или видах казни в публичных представлениях, но синтаксис не позволяет утверждать это безоговорочно.
- source_word: αἰκίσματα δεινὰ καὶ ἀνόσια
  choice: страшные и нечестивые надругательства
  rationale: Перевод следует общепринятому чтению ἀνόσια, которое, по-видимому, искажено в предоставленном OCR как ἀνδρία. «Надругательства» передаёт жестокое, унизительное обращение, выраженное αἰκίσματα.
- source_word: ἐπὶ τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: достигли твёрдого поприща веры
  rationale: Сохранён образ δρόμος — пути, бега или поприща; βέβαιος передано как «твёрдый», без добавления отсутствующего в греческом наречия «безопасно» и без превращения самого поприща в явно названную конечную цель.
- source_word: γέρας γενναῖον
  choice: благородную награду
  rationale: γέρας означает почётный дар или награду, а γενναῖον — благородную, славную; сочетание передано естественно и возвышенно.
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: хотя телом были слабы
  rationale: Артикль с причастно-предикативным определением имеет уступительный смысл в контексте; русский оборот ясно передаёт контраст телесной слабости и стойкости.
theological_decisions:
- issue: Смысл «поприща веры»
  choice: Сохранить метафору пути/бега и не уточнять, означает ли она мученическую смерть, завершение земного пути или верность до конца.
  alternative: «Благополучно достигли цели веры».
  rationale: Греческое выражение допускает образ достижения или завершения пути, однако слово «цель» и особенно «благополучно» делают толкование более определённым, чем источник.
- issue: Характер награды
  choice: Оставить «награду» без уточнения, от Бога ли она, небесная ли она и в чём состоит.
  alternative: «Получили от Бога небесную награду».
  rationale: Контекст предполагает религиозное воздаяние, но эти уточнения прямо не выражены в стихе.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Сохранены риторическая связь с темой зависти, образ «поприща» и контраст между телесной слабостью и духовной стойкостью. В предоставленном OCR стоит ἀνδρία, однако контекст и стандартный текст 1 Кл 6:2 поддерживают чтение ἀνόσια; перевод отражает последнее.
