base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: ru
  text: 'Зависть отдалила жён от мужей и изменила сказанное нашим отцом Адамом: «Вот, это кость от костей моих и плоть от плоти моей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ревность
  rationale: В контексте главы слово обозначает разрушительную ревность или зависть; «ревность» сохраняет повторяющийся ключевой термин и естественно объясняет отчуждение супругов.
- source_word: ἀπηλλοτρίωσεν
  choice: отдалила
  rationale: Передаёт причинённое отчуждение между жёнами и мужьями без излишне юридического оттенка.
- source_word: γυναῖκας ἀνδρῶν
  choice: жён от мужей
  rationale: Хотя существительные могут означать также «женщин» и «мужчин», конструкция и последующая цитата о супружеском единстве поддерживают брачное значение.
- source_word: ἠλλοίωσεν
  choice: исказила
  rationale: Здесь речь не просто об изменении формулировки, а о разрушительном обращении вспять смысла слов Адама о единстве.
- source_word: πατρὸς ἡμῶν Ἀδάμ
  choice: нашим праотцом Адамом
  rationale: «Праотец» в современном русском естественно передаёт Адама как общего родоначальника и сохраняет торжественный регистр.
- source_word: Τοῦτο νῦν
  choice: Вот, это
  rationale: Передаёт указательно-эмфатическую силу греческого выражения, восходящего к Быт 2:23, естественной русской формулой.
theological_decisions:
- issue: Характер изменения слов Адама
  choice: «исказила сказанное»
  alternative: «изменила сказанное»
  rationale: Глагол ἠλλοίωσεν буквально допускает «изменила», однако контекст противопоставляет супружеское отчуждение первоначальному единству; «исказила» передаёт эту отрицательную направленность, не уточняя её сверх текста.
- issue: Статус Адама
  choice: «наш праотец Адам»
  alternative: «наш отец Адам»
  rationale: Выбор сохраняет мысль об общем происхождении человечества, избегая в современном русском возможного впечатления о непосредственном отцовстве.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием в цитате. Синтаксис краток и следует греческой причинно-следственной структуре; архаизмы сведены к минимуму.
