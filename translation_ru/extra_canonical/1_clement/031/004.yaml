  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: ru
  text: Иаков со смирением покинул свою землю из-за брата, отправился к Лавану и служил ему; и ему были даны двенадцать колен Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двенадцатискипетровый Израиль»; необычное греческое выражение обозначает двенадцать колен.'
    reason: Сохраняет образ δωδεκάσκηπτρον, не вводя слово «народ» как будто оно прямо стоит в греческом тексте, и объясняет его библейский смысл.
lexical_decisions:
- source_word: μετὰ ταπεινοφροσύνης
  choice: со смирением
  rationale: Естественно и точно передаёт образ действия, выраженный греческой предложной конструкцией.
- source_word: δι’ ἀδελφόν
  choice: из-за брата
  rationale: Сохраняет краткость и причинную неоднозначность греческого выражения, не добавляя отсутствующего в тексте уточнения о конфликте с Исавом.
- source_word: ἐδούλευσεν
  choice: служил ему
  rationale: В данном повествовательном контексте обозначает службу Иакова у Лавана; местоимение проясняет естественно подразумеваемый объект без изменения смысла.
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: двенадцать колен Израиля
  rationale: Редкое составное δωδεκάσκηπτρον буквально связано с «двенадцатью скипетрами», однако опирается на библейскую семантическую связь «скипетра/жезла» и «колена» и обозначает совокупность двенадцати колен; основной текст передаёт понятный русскому читателю библейский смысл, а буквальный образ сохранён в примечании.
theological_decisions:
- issue: Смысл дара Иакову в заключительной фразе
  choice: «ему были дарованы двенадцать колен Израиля»
  alternative: «ему был дарован двенадцатискипетровый народ Израиля»
  rationale: Форма множественного числа по-русски естественно выражает подразумеваемые двенадцать колен, тогда как искусственный неологизм затемняет библейскую аллюзию. Пассив «были дарованы» сохраняет отсутствие названного деятеля и возможный богословский оттенок божественного дара.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным ритмом. Точка с запятой отделяет итоговое дарование от последовательности действий. Не добавлены имена Исава или Бога, отсутствующие в исходной формулировке.
