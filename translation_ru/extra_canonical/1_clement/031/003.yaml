  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: ru
  text: Исаак, с уверенностью зная, что предстоит, охотно принёс себя в жертву.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: с уверенностью
  rationale: Передаёт уверенность и твёрдую убеждённость; расположение рядом с «зная» ясно показывает, что оборот относится к знанию.
- source_word: γινώσκων τὸ μέλλον
  choice: зная, что должно произойти
  rationale: Естественно передаёт субстантивированное «будущее, грядущее», сохраняя открытым конкретное содержание предстоящего.
- source_word: ἡδέως
  choice: охотно
  rationale: Точно и естественно выражает добровольную готовность.
- source_word: προσήγετο θυσία
  choice: принёс себя в жертву
  rationale: Передаёт средне-пассивную форму как добровольное представление самого себя в качестве жертвы; это соответствует контексту и не вводит внешнего действующего лица.
theological_decisions:
- issue: Степень добровольности Исаака в выражении προσήγετο θυσία
  choice: охотно принёс себя в жертву
  alternative: охотно был приведён для жертвоприношения
  rationale: Средне-пассивная форма допускает оттенок представления или приведения, но сочетание с ἡδέως и контекстом примера веры поддерживает добровольное участие. Формулировка не уточняет способ жертвоприношения и не утверждает, что оно было завершено.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Фраза понятна широкому читателю и сохраняет богословское напряжение между знанием грядущего и добровольным принесением себя.
