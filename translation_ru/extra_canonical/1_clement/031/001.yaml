  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: ru
  text: Итак, будем держаться его благословения и посмотрим, каковы пути благословения. Рассмотрим то, что произошло от начала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: будем держаться
  rationale: Передаёт призыв тесно прилепиться и не отступать, оставаясь естественным для современного русского языка.
- source_word: τῇ εὐλογίᾳ αὐτοῦ
  choice: Его благословения
  rationale: Сохраняет значение Божьего благословения как того, к чему призывают прилепиться; местоимение написано с прописной буквы по русской благочестивой издательской традиции.
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  choice: пути к благословению
  rationale: Родительный падеж допускает оттенок путей, связанных с обретением благословения; русский оборот ясно выражает движение к нему без добавления конфессиональной трактовки.
- source_word: ἀνατυλίξωμεν
  choice: развернём повествование
  rationale: Глагол буквально вызывает образ разворачивания свитка; добавление «повествование» делает метафору понятной и естественной по-русски.
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: о том, что произошло от начала
  rationale: Близко передаёт субстантивированное выражение о событиях древнейшего времени, сохраняя библейски окрашенное «от начала».
theological_decisions:
- issue: Значение «путей благословения»
  choice: пути к благословению
  alternative: пути благословения
  rationale: Выбранный вариант естественнее по-русски и передаёт способы достижения или получения благословения, не уточняя заранее их богословский характер.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, церковно-историческим звучанием. Синтаксис краткий и призывный; образ разворачивания древнего повествования сохранён в понятной форме.
