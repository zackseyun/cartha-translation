  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: ru
  text: За что был благословлён наш отец Авраам? Не потому ли, что он через веру совершил праведность и истину?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: За что
  rationale: Кратко и естественно передаёт вопрос о причине благословения.
- source_word: ηὐλογήθη
  choice: был благословлён
  rationale: Сохраняет пассивную форму и религиозно-нравственный смысл греческого глагола.
- source_word: δικαιοσύνην καὶ ἀλήθειαν ... ποιήσας
  choice: творил праведность и истину
  rationale: Сохраняет существительные «праведность» и «истина» и близко передаёт ποιέω, не сводя выражение лишь к отвлечённым качествам.
- source_word: διὰ πίστεως
  choice: через веру
  rationale: Передаёт инструментальное или посредствующее значение διά с родительным падежом, не уточняя сверх текста характер действия веры.
theological_decisions:
- issue: Связь веры с праведностью и истиной
  choice: через веру творил праведность и истину
  alternative: поступал праведно и истинно благодаря вере
  rationale: Выбранная формулировка сохраняет богословское напряжение между верой и деланием, а также именную форму греческих понятий, не превращая стих в систематическое утверждение об оправдании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «отец наш Авраам» сохраняет достоинство раннехристианского текста и остаётся понятной современному читателю.
