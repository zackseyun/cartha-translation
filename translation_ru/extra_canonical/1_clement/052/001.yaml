source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀπροσδεής, ἀδελφοί, ὁ δεσπότης ὑπάρχει τῶν ἁπάντων· οὐδενὸς οὐδὲν χρῄζει εἰ μὴ τὸ ἐξομολογεῖσθαι αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: ru
  text: Владыка всего ни в чём не нуждается, братья; Ему ничего не нужно ни от кого, кроме одного — чтобы перед Ним исповедовались.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы Ему воздавали благодарение» или «хвалу». Греческое слово может обозначать исповедание или признание перед Богом, а также благодарение и хвалу; здесь оно не обязательно означает исповедь грехов.'
    reason: Сохраняет смысловой диапазон ἐξομολογεῖσθαι, не сводя его ни к исповеди грехов, ни исключительно к хвале.
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: ни в чём не нуждается
  rationale: Передаёт отсутствие всякой нужды естественным современным русским оборотом.
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: Владыка всего
  rationale: «Владыка» сохраняет значение верховной власти δεσπότης и соответствует возвышенному, но понятному регистру; τῶν ἁπάντων передано без неоправданного ограничения лицами или вещами.
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: Ему ничего не нужно ни от кого
  rationale: 'Сохраняет оба отрицательных местоимения и реляционный оттенок греческого выражения: ничто не требуется ни от кого.'
- source_word: τὸ ἐξομολογεῖσθαι αὐτῷ
  choice: чтобы Ему воздавали хвалу
  rationale: В данном богослужебно-псалмическом контексте ἐξομολογεῖσθαι означает благодарно прославлять Бога; личная форма по-русски звучит естественнее отвлечённого «исповедание».
theological_decisions:
- issue: Значение ἐξομολογεῖσθαι
  choice: воздавали хвалу
  alternative: исповедовались перед Ним; благодарили Его
  rationale: Глагол допускает значения исповедания, благодарения и хвалы. Контекст следующей псалмовой цитаты поддерживает хвалу/благодарение, однако многозначность отмечена в сноске и не сведена исключительно к исповеданию грехов.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Обращение «братья» сохранено; повтор утверждения об отсутствии нужды отражает риторическую структуру греческого текста.
