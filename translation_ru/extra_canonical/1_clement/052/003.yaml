source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: ru
  text: 'И снова Он говорит: «Принеси Богу жертву хвалы и исполни свои обеты Всевышнему; призови Меня в день своей скорби, и Я избавлю тебя, и ты прославишь Меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον ... θυσίαν αἰνέσεως
  choice: Принеси ... жертву хвалы
  rationale: Сохраняет жертвенную лексику и естественно передаёт сочетание, восходящее к Пс 49:14 LXX.
- source_word: ἀπόδος ... τὰς εὐχάς σου
  choice: исполни свои обеты
  rationale: В данном контексте εὐχαί означает данные Богу обеты, а ἀπόδος — их исполнение, а не просто произнесение молитв.
- source_word: τῷ ὑψίστῳ
  choice: Всевышнему
  rationale: Устоявшийся и точный русский эквивалент божественного титула.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: в день своей скорби
  rationale: Передаёт θλῖψις как тяжёлое бедствие или стеснённое положение, сохраняя возвышенный библейский регистр.
- source_word: ἐξελοῦμαί σε
  choice: Я избавлю тебя
  rationale: Точно выражает обещание спасительного избавления из беды.
- source_word: δοξάσεις με
  choice: ты прославишь Меня
  rationale: Прямо сохраняет значение δοξάζω и ответ человека на Божье избавление.
theological_decisions:
- issue: Субъект вводной формулы λέγει
  choice: Он говорит
  alternative: говорится
  rationale: Греческий текст содержит подразумеваемое личное подлежащее; прописная буква естественно указывает на Бога как говорящего в цитируемом Писании, не добавляя нового титула.
- issue: Связь последнего предложения с обещанием избавления
  choice: а ты прославишь Меня
  alternative: и ты прославишь Меня
  rationale: Союз «а» естественно обозначает ответное действие человека, не превращая прославление ни в условие избавления, ни в механически гарантированное следствие.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты; синтаксис ясен обычному читателю, архаизмы исключены. Местоимения в прямой речи оформлены с прописной буквы как уважительное обозначение Бога.
