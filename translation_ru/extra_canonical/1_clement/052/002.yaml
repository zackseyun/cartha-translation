source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: ru
  text: 'Ведь избранный Давид говорит: «Я возблагодарю Господа, и это будет угодно Ему больше, чем молодой телец с рогами и копытами[a]. Пусть бедные увидят и возрадуются».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «молодой телец, отращивающий рога и копыта».'
    reason: Греческое причастие ἐκφέροντα буквально описывает появление или рост рогов и копыт; в основном тексте использована более естественная русская формулировка.
lexical_decisions:
- source_word: ἐκλεκτός
  choice: избранный
  rationale: Прямо передаёт характеристику Давида как избранного, не вводя дополнительного толкования.
- source_word: Ἐξομολογήσομαι
  choice: возблагодарю
  rationale: В данном псалмовом контексте глагол означает благодарственное прославление Господа; «исповедуюсь» по-русски создало бы неуместную двусмысленность.
- source_word: ἀρέσει αὐτῷ ὑπέρ
  choice: будет угодно Ему больше, чем
  rationale: Естественно передаёт сравнение и сохраняет превосходство благодарения над жертвой.
- source_word: μόσχον νέον
  choice: молодой телец
  rationale: Точное и понятное соответствие греческому словосочетанию.
- source_word: πτωχοί
  choice: бедные
  rationale: Современное нейтральное обозначение нуждающихся; не сужает смысл до нищенства как занятия.
theological_decisions:
- issue: Значение Ἐξομολογήσομαι
  choice: возблагодарю
  alternative: исповедую / прославлю
  rationale: Контекст сопоставляет благодарение Богу с жертвоприношением; выбранный вариант передаёт этот смысл без навязывания идеи исповедания грехов.
- issue: Сравнение благодарения с жертвенным животным
  choice: сохранено прямое «больше, чем»
  alternative: перефразировать как общее превосходство духовной жертвы
  rationale: Текст сам формулирует сравнение, поэтому богословское обобщение не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис цитаты сохранён близко к греческому, но без неестественных для русского оборотов.
