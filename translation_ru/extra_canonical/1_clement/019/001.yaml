id: 1CLEM.19.1
reference: 1 Clement 19:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: ru
  text: Итак, смиренномудрие и покорность столь многих и столь выдающихся людей, засвидетельствованных таким образом, через послушание сделали лучше не только нас, но и предшествовавшие нам поколения — тех, кто принял Его изречения в святости и истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων
  choice: смиренномудрие
  rationale: Передаёт не только внешнюю скромность, но внутренний образ мыслей, отмеченный смирением; существительное согласовано с субстантивированным смыслом греческого выражения.
- source_word: τὸ ὑποδεὲς
  choice: покорность
  rationale: Сохраняет значение добровольного подчинения и уступчивости без уничижительного оттенка современного слова «подобострастие».
- source_word: διὰ τῆς ὑπακοῆς
  choice: через послушание
  rationale: Формально сохраняет предложную конструкцию и допускает связь послушания как с названными качествами, так и с произведённым ими благотворным действием.
- source_word: τὰ λόγια αὐτοῦ
  choice: Его изречения
  rationale: λόγια обозначает авторитетные, обычно божественные речения; прописная буква указывает на Бога как наиболее вероятный референт αὐτοῦ, не добавляя имени в текст.
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: в святости и истине
  rationale: Сохраняет два абстрактных понятия и торжественный библейский регистр исходного текста.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: «Его» с прописной буквы, подразумевая Бога
  alternative: «его» с возможной отсылкой к ранее названному лицу
  rationale: Сочетание τὰ λόγια αὐτοῦ в раннехристианской речи естественно относится к Божьим изречениям; имя Бога не вставлено, поэтому формальная недосказанность оригинала отчасти сохраняется.
- issue: Синтаксическая роль «предшествовавших нам поколений» и следующего причастного оборота
  choice: тире перед «тех, кто…» передаёт пояснительное отождествление
  alternative: понимать «принявших» как отдельную третью группу
  rationale: Винительный τούς τε καταδεξαμένους наиболее естественно поясняет поколения, жившие прежде; перевод не превращает их в самостоятельный новый объект.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены длинный период, причинно-инструментальная неоднозначность выражения «через послушание» и возвышенная лексика без архаизмов вроде «глаголы» или «паче».
