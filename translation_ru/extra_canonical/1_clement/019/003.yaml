  terminology: «Замысел» для βούλημα не навязывает специального богословского толкования и в сочетании с «терпеливый» звучит по-русски естественнее, чем «долготерпеливая воля». «Чужд гнева» точно передаёт качественный смысл ἀόργητος, не превращая его в утверждение о разовом действии.
