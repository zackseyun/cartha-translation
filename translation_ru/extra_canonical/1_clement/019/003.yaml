base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: ru
  text: Будем созерцать Его мысленным взором и всматриваться очами души в Его терпеливый замысел. Постигнем, как Он чужд гнева по отношению ко всему Своему творению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν αὐτὸν κατὰ διάνοιαν
  choice: Будем созерцать Его разумом
  rationale: Передаёт мысленное, внутреннее созерцание; «разумом» естественно выражает διάνοιαν в данном контексте.
- source_word: ἐμβλέψωμεν τοῖς ὄμμασιν τῆς ψυχῆς
  choice: всматриваться очами души
  rationale: Сохраняет выразительную метафору оригинала и возвышенный, но понятный регистр.
- source_word: τὸ μακρόθυμον αὐτοῦ βούλημα
  choice: Его долготерпеливую волю
  rationale: μακρόθυμον обозначает терпеливость и выдержку, а βούλημα — волю или замысел; буквальная напряжённость выражения сохранена.
- source_word: νοήσωμεν
  choice: Постигнем
  rationale: Передаёт призыв к осмысленному пониманию и соответствует торжественному регистру.
- source_word: ἀόργητος
  choice: безгневен
  rationale: 'Редкое, но прозрачное русское прилагательное близко сохраняет отрицательную форму и смысл греческого слова: отсутствие гнева.'
- source_word: πρὸς πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: ко всему Своему творению
  rationale: κτίσις может обозначать творение как совокупность созданного; мужской род «всему» сохраняет это собирательное значение.
theological_decisions:
- issue: Характер Божьего отношения к творению в ἀόργητος
  choice: Он безгневен ко всему Своему творению
  alternative: Он не гневается ни на одно Своё создание
  rationale: Выбранная формулировка не превращает качественное утверждение оригинала в более конкретное временное или абсолютное суждение о каждом отдельном создании и сохраняет богословское напряжение текста.
- issue: Значение βούλημα
  choice: воля
  alternative: замысел
  rationale: «Воля» формально ближе и не уточняет, идёт ли речь о намерении, решении или плане.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Сохранены параллельные увещевательные формы и метафора «очами души»; архаизация ограничена словом «очи», оправданным устойчивостью образа.
