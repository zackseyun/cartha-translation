base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: ru
  text: Итак, приняв участие во многих великих и славных делах,[a] устремимся к цели мира, переданной нам от начала; обратим взор к Отцу и Создателю всего мира и прилепимся к Его величественным и превосходящим всё дарам мира и благодеяниям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «став причастниками многих великих и славных деяний».'
    reason: 'Передаёт диапазон μετασχόντες πράξεων: участие в делах или причастность к ним, не определяя, чьи именно это дела.'
lexical_decisions:
- source_word: μετασχόντες
  choice: став причастниками
  rationale: Причастие от μετέχω означает участие или приобщение; такой перевод сохраняет смысл причастности и не подменяет его идеей «удостоиться», которой нет в данном греческом тексте.
- source_word: πράξεων
  choice: деяний
  rationale: Слово обозначает дела, действия или события; «деяний» соответствует возвышенному контексту и не утверждает, что речь непременно о собственных заслугах адресатов.
- source_word: ἐκτελέσωμεν ἐπὶ ... σκοπόν
  choice: устремимся к цели
  rationale: Оборот выражает направленное движение к цели; естественный русский перевод передаёт побуждение, не перегружая фразу буквальным «доведём до конца».
- source_word: ἀτενίσωμεν
  choice: обратим взор
  rationale: Передаёт напряжённое, сосредоточенное всматривание и согласуется с последующим созерцательным призывом.
- source_word: κολληθῶμεν
  choice: прилепимся
  rationale: Сохраняет сильный образ тесной привязанности, выраженный глаголом κολλάω, и его библейскую стилистическую окраску.
- source_word: κτίστην
  choice: Создателю
  rationale: Современное и понятное соответствие слову «творец, создатель»; прописная буква указывает на титульное употребление по отношению к Богу.
theological_decisions:
- issue: Кому принадлежат «великие и славные деяния»
  choice: Не уточнять, что это собственные дела адресатов
  alternative: «совершив многие великие и славные дела»
  rationale: μετασχόντες означает участие или причастность, а не совершение; перевод сохраняет открытым вопрос о том, являются ли эти деяния Божьими, общинными или пережитыми адресатами событиями.
- issue: Связь мира с дарами и благодеяниями Бога
  choice: «дарам мира и благодеяниям»
  alternative: «дарам и благодеяниям Его мира»
  rationale: Греческий синтаксис допускает тесную связь τῆς εἰρήνης с δωρεαῖς, тогда как εὐεργεσίαις присоединено через τε; выбранный вариант сохраняет мир как характеристику даров, не делая всю конструкцию искусственной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, раннехристианской интонацией. Синтаксис сделан ясным для чтения вслух; сохранены библейские образы «цели мира», обращённого взора и «прилепления».
