  terminology: «Отец», «Создатель», «цель мира» и «прилепимся» уместны. «Дарам мира и благодеяниям» сохраняет возможную, хотя синтаксически не бесспорную, более тесную связь «мира» с «дарами»; это допустимо без догматического уточнения.
