  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
translation:
  language: ru
  text: Но теперь задумайтесь, какие люди совратили вас и умалили достоинство вашей прославленной братской любви.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашей широко известной братской любви».'
    reason: Сохраняет буквальный оттенок περιβοήτου — того, о чём повсюду говорят, — тогда как основной текст передаёт контекстуально положительное значение.
lexical_decisions:
- source_word: κατανοήσατε
  choice: задумайтесь
  rationale: Передаёт призыв внимательно осмыслить случившееся; звучит естественно и серьёзно в современном русском.
- source_word: τίνες
  choice: кто
  rationale: Русское «кто» не маркирует число, однако последующее сказуемое «совратил» по нормам русского обычно стоит в единственном числе; значение вопроса о виновных лицах сохраняется.
- source_word: διέστρεψαν
  choice: совратил
  rationale: Передаёт идею отклонения от правильного пути без более резкого современного оттенка слова «извратил».
- source_word: τὸ σεμνὸν
  choice: достоинство
  rationale: Субстантивированное прилагательное обозначает почтенность, благородство и достойный характер братской любви.
- source_word: περιβοήτου
  choice: прославленной
  rationale: Передаёт положительное контекстуальное значение «знаменитой, широко известной» и соответствует возвышенному тону.
- source_word: φιλαδελφίας
  choice: братской любви
  rationale: Точно и понятно передаёт христианскую взаимную любовь членов общины.
- source_word: ἐμείωσαν
  choice: умалил
  rationale: Сохраняет образ уменьшения или нанесения ущерба достоинству ранее прославленной любви.
theological_decisions:
- issue: Характер воздействия διέστρεψαν
  choice: совратил вас
  alternative: ввёл вас в заблуждение / извратил вас
  rationale: «Совратил» сохраняет нравственно-направленческий оттенок греческого глагола, не сводя его лишь к интеллектуальной ошибке и не усиливая до грубого «извратил».
translation_notes:
  register: Современный литературный русский с достойным увещевательным тоном. Синтаксис близок к греческому, но не калькирован; риторическая напряжённость между прежней славой общины и её нынешним упадком сохранена.
