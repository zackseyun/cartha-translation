    rationale: Фраза «вы стали примыкать» акцентирует начало действия. Греческий перфектный инфинитив обозначает уже сложившееся к тому времени положение, поэтому лучше «вы проявляли пристрастия».
  - severity: low
    issue: Добавление «к разным сторонам» в основном тексте
    rationale: Контекст действительно связан с приверженностью разным учителям, но такое уточнение эксплицирует то, что в самом слове προσκλίσεις прямо не названо. Его уместнее оставить в сноске.
  - severity: low
    issue: Неестественная буквальная формулировка сноски
    rationale: «Устроили склонения» не является нормальным русским выражением и не проясняет читателю значение. Сноску следует сформулировать через «склонности/пристрастия».
