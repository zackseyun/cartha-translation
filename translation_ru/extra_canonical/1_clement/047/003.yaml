review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Павел писал коринфянам о себе, Кифе и Аполлосе, а причиной были уже существовавшие у адресатов пристрастия. Однако «вы стали примыкать» передаёт возникновение процесса, тогда как πεποιῆσθαι — перфект («вы уже сделали/проявили»); кроме того, «к разным сторонам» является поясняющим добавлением, не выраженным прямо в греческом тексте.'
  naturalness: «Написал вам духовно» грамматически возможно, но для современного литературного русского звучит не вполне ясно. «В духовном смысле» естественнее и сохраняет отсутствие прямого отождествления с действием Святого Духа. «Проявляли пристрастия» естественно передаёт множественное προσκλίσεις без неудачного буквального оборота «устроили склонения».
  terminology: «Кифе» и «Аполлосе» употреблены правильно. «Пристрастия» — нейтральное, не конфессионально нагруженное соответствие редкому προσκλίσεις; сноска указывает на образ склонения/приверженности, не превращая его однозначно в формальные «партии».
  issues:
