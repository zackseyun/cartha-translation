  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: ru
  text: Поистине, он написал вам в духовном смысле о себе, Кифе и Аполлосе, потому что уже тогда вы проявляли пристрастия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что уже тогда вы создали склонности (пристрастия)». Редкое слово προσκλίσεις может обозначать склонность или пристрастную приверженность; в данном контексте оно относится к приверженности различным учителям или группам.'
    reason: Сноска передаёт образный смысл редкого греческого слова и контекстуальную связь с разделениями, не добавляя это уточнение в основной текст.
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: поистине
  rationale: Краткое и естественное вводное выражение, сохраняющее усилительное значение греческого оборота.
- source_word: πνευματικῶς
  choice: духовно
  rationale: Наречие передано наречием без уточнения «в Духе», которого форма сама по себе не требует.
- source_word: Κηφᾶ
  choice: Кифе
  rationale: Сохранена традиционная русская передача имени Кифа; падеж определяется управлением предлога «о».
- source_word: προσκλίσεις
  choice: примыкать к разным сторонам
  rationale: Передаёт буквальную идею склонения или пристрастного присоединения к одной из сторон и в данном контексте — разделения по приверженности различным учителям.
- source_word: πεποιῆσθαι
  choice: стали
  rationale: Естественная русская конструкция выражает уже возникшее к тому времени состояние, обозначенное греческим перфектным инфинитивом.
theological_decisions:
- issue: Значение πνευματικῶς
  choice: духовно
  alternative: в Духе
  rationale: Греческое наречие допускает связь с духовным характером письма, но не называет Святого Духа прямо; перевод сохраняет эту неопределённость.
- issue: Характер προσκλίσεις
  choice: примыкать к разным сторонам
  alternative: образовать партии / проявлять пристрастия
  rationale: Выбрана формулировка, не сводящая выражение ни исключительно к формальным фракциям, ни только к внутренней предвзятости.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис сделан естественным, при этом сохранены последовательность имён и неоднозначность наречия πνευματικῶς.
