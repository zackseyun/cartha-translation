  to: Поистине, он написал вам в духовном смысле о себе, Кифе и Аполлосе, потому что уже тогда вы проявляли пристрастия.[a]
  rationale: Исправление делает русский текст естественнее и точнее передаёт перфект πεποιῆσθαι. Формулировка «в духовном смысле» сохраняет смысловую неопределённость πνευματικῶς, не подменяя её утверждением «в Святом Духе».
