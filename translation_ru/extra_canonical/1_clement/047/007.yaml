id: 1CLEM.47.7
reference: 1 Clement 47:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: ru
  text: И слух об этом дошёл не только до нас, но и до тех, кто чужд нам,[a] так что из-за вашего безрассудства даже имя Господа подвергается хуле, а вы сами навлекаете на себя опасность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до тех, кто отдалился от нас»; возможен также смысл: «до тех, кто настроен против нас».'
    reason: Редкое слово ἑτεροκλινής допускает оттенки отчуждённости, уклонения в сторону и враждебной настроенности.
lexical_decisions:
- source_word: ἡ ἀκοή
  choice: слух об этом
  rationale: В контексте означает дошедшее известие или молву; «слух об этом» естественно по-русски и не добавляет лишней конкретики.
- source_word: τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: тех, кто чужд нам
  rationale: Редкое ἑτεροκλινής с ἀπό обозначает людей, стоящих в стороне от общины или враждебных ей; формулировка сохраняет дистанцированность, не сводя её просто к разногласию внутри церкви.
- source_word: ἀφροσύνην
  choice: безрассудства
  rationale: Передаёт отсутствие здравого рассудка и порицаемую неразумность поведения.
- source_word: κίνδυνον ἐξεργάζεσθαι
  choice: навлекаете на себя опасность
  rationale: Идиоматично выражает результат, который адресаты сами создают для себя.
theological_decisions:
- issue: Направленность хулы в выражении βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου
  choice: имя Господа подвергается хуле
  alternative: хулу возводят на имя Господа
  rationale: Пассивная формулировка сохраняет смысл греческого оборота и не уточняет сверх текста, кто именно произносит хулу.
- issue: Значение καί перед βλασφημίας
  choice: даже
  alternative: также
  rationale: 'В конструкции οὐ μόνον... ἀλλὰ καί... ὥστε καί это καί естественно имеет усилительное значение: дело доходит даже до хулы.'
translation_notes:
  register: Современный литературный русский, с достоинством раннехристианского увещания. Синтаксис сделан естественным для русского языка, при этом сохранены причинная связь, усилительное «даже» и напряжение между общественным бесчестием имени Господа и опасностью для самих адресатов.
