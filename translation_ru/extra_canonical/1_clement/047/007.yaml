  source_fidelity: 'Русский текст точно передаёт основные элементы греческого: распространение известия не только до автора и его круга, но и до отчуждённых от них людей; усилительное καί («даже») перед хулой; причинную связь διὰ τὴν ὑμετέραν ἀφροσύνην; и то, что адресаты сами навлекают опасность на себя. «Слух об этом» естественно выражает ἡ ἀκοή в данном контексте и не вносит существенного дополнительного содержания.'
  naturalness: Фраза звучит как современный литературный русский, сохраняя серьёзный увещевательный регистр. Синтаксис ясен, а «имя Господа подвергается хуле» — естественная и стилистически уместная передача пассивного греческого оборота.
  terminology: «Господь», «хула», «безрассудство» и «навлекаете на себя опасность» выбраны точно и без конфессионально обусловленного толкования. «Те, кто чужд нам» удачно передаёт дистанцированность ἑτεροκλινεῖς ... ἀφ’ ἡμῶν, не сводя её к внутригрупповому разногласию. Сноска корректно отмечает возможные оттенки редкого слова.
