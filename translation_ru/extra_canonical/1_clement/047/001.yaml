lexical_decisions:
- source_word: Ἀναλάβετε
  choice: Возьмите
  rationale: Императив допускает значения «возьмите», «поднимите», а в данном контексте — обращение к известному письменному тексту; простое «возьмите» сохраняет образ и естественно звучит по-русски.
- source_word: ἐπιστολήν
  choice: послание
  rationale: Для раннехристианского письма Павла традиционное и общепонятное русское соответствие — «послание».
- source_word: μακαρίου
  choice: блаженного
  rationale: Передаёт почётную характеристику μακάριος без уточнения её основания и сохраняет раннехристианский возвышенный регистр.
- source_word: Παύλου τοῦ ἀποστόλου
  choice: апостола Павла
  rationale: Естественный русский порядок слов точно передаёт приложение «Павла, апостола».
