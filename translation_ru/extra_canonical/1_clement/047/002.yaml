  text: Что он написал вам сначала, в начале благовествования?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Что
  rationale: Прямое вопросительное местоимение, соответствующее предмету написанного.
- source_word: πρῶτον
  choice: прежде всего
  rationale: Передаёт значение «сначала / первым делом» и естественно относится к тому, что он написал адресатам.
- source_word: ὑμῖν
  choice: вам
  rationale: Сохраняет форму множественного числа и функцию косвенного дополнения.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: в начале благовествования
  rationale: Сохраняет временной смысл выражения и передаёт εὐαγγέλιον как провозглашение Благой вести, не добавляя отсутствующего в греческом слова «проповедь».
- source_word: ἔγραψεν
  choice: написал
  rationale: Простая форма прошедшего времени точно передаёт аорист и не уточняет названного в контексте субъекта.
theological_decisions:
- issue: Значение τοῦ εὐαγγελίου
  choice: благовествования
  alternative: Евангелия
  rationale: В данном временном выражении речь может идти о начале распространения Благой вести, а не о начале письменной книги; «благовествование» сохраняет этот смысл, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос. Формулировка сохраняет различие между πρῶτον («прежде всего») и ἐν ἀρχῇ («в начале»), а также не называет подразумеваемого из контекста автора письма.
