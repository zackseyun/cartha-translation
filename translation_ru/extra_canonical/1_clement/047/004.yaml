  text: ἀλλ’ ἡ πρόσκλισις ἐκείνη ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν· προσεκλίθητε γὰρ ἀποστόλοις μεμαρτυρημένοις καὶ ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: ru
  text: 'Но та приверженность навлекла на вас меньший грех: ведь вы примкнули к апостолам, о которых было доброе свидетельство[a], и к человеку, одобренному ими.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к засвидетельствованным апостолам»; то есть к апостолам, чья добрая репутация была подтверждена. В греческом не сказано, кем именно.'
    reason: Сжатая форма μεμαρτυρημένοις допускает варианты передачи и не называет источник свидетельства.
lexical_decisions:
- source_word: πρόσκλισις
  choice: приверженность
  rationale: Передаёт склонение на чью-либо сторону и сохраняет смысловую связь с однокоренным προσεκλίθητε, не усиливая значение до явно организованной партийности.
- source_word: ἧσσον ἁμαρτίαν
  choice: меньший грех
  rationale: Сохраняет прямое и несколько напряжённое выражение оригинала, не заменяя «грех» более толковательным словом «вина».
- source_word: προσεκλίθητε
  choice: вы примкнули
  rationale: Аорист передан завершённым действием в прошлом; «примкнули» естественно выражает склонение к определённым авторитетам.
- source_word: μεμαρτυρημένοις
  choice: о которых было доброе свидетельство
  rationale: Сохраняет значение засвидетельствованной доброй репутации или признанности, не уточняя отсутствующего в тексте субъекта свидетельства.
- source_word: δεδοκιμασμένῳ παρ’ αὐτοῖς
  choice: ими испытанному и одобренному
  rationale: Передаёт как идею проверки, так и её положительный результат; παρ’ αὐτοῖς ясно отнесено к апостолам.
theological_decisions:
- issue: Кем были засвидетельствованы апостолы
  choice: Не называть субъекта свидетельства
  alternative: «апостолам, одобренным Богом» или «признанным людьми»
  rationale: Греческий текст не указывает, кто именно дал свидетельство; уточнение сняло бы подлинную неоднозначность.
- issue: Степень прежнего греха коринфян
  choice: «меньший грех»
  alternative: «меньшую вину»
  rationale: Автор сопоставляет прежнее пристрастие с нынешним и прямо употребляет ἁμαρτία; перевод не должен смягчать богословскую оценку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор корней со значением склонения/примыкания, прямое слово «грех» и неоднозначность причастия μεμαρτυρημένοις.
