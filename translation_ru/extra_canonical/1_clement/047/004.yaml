  rationale: Убрано «испытанному и», чтобы не развернуть одно греческое причастие в два самостоятельных утверждения. Остальная формулировка сохраняет исходную неоднозначность относительно субъекта свидетельства об апостолах, смысловое сопоставление с прежним грехом и естественный литературный русский регистр.
