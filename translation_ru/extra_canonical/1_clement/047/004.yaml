    issue: Избыточное развёртывание δεδοκιμασμένῳ
    rationale: Форма δεδοκιμασμένῳ означает «испытанный/проверенный и признанный годным, одобренный» в зависимости от контекста. Сочетание «испытанному и одобренному» добавляет два координированных признака там, где в оригинале одно причастие; «одобренному ими» точнее отражает его контекстуальный результат.
