  source_fidelity: Черновик точно передаёт повтор αἰσχρά, усиление λίαν, выражение «во Христе», причину δι’ ἓν ἢ δύο πρόσωπα и термин «пресвитеры». Однако «восстала» — совершенный вид и естественно отсылает к уже завершившемуся действию, тогда как настоящее infinitivus στασιάζειν описывает продолжающееся противостояние или мятеж. «Слышать, что» ближе к ἀκούεσθαι, чем «стало известно», которое делает акцент на полученном известии.
