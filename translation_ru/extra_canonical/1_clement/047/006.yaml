    rationale: Формулировка допустима по смыслу, но несколько эксплицирует результат полученной вести. «Слышать, что» ближе к пассивному инфинитиву и к риторической конструкции оригинала.
  revised_text: Постыдно, возлюбленные, крайне постыдно и недостойно жизни во Христе слышать, что столь стойкая и древняя церковь коринфян из-за одного или двух человек восстаёт против пресвитеров.
