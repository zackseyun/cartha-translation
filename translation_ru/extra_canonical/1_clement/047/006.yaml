source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: ru
  text: Постыдно, возлюбленные, крайне постыдно и недостойно жизни во Христе слышать, что столь стойкая и древняя церковь коринфян из-за одного или двух человек восстаёт против пресвитеров.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρά ... λίαν αἰσχρά
  choice: постыдно ... крайне постыдно
  rationale: Сохраняет настойчивый повтор и усиление λίαν, естественно звуча по-русски.
- source_word: ἀγωγῆς
  choice: жизни
  rationale: В данном нравственно-религиозном контексте означает образ жизни или поведение; «жизни во Христе» передаёт смысл естественнее, чем буквальное «поведения».
- source_word: ἀκούεσθαι
  choice: стало известно
  rationale: Безличный инфинитив означает, что о происходящем слышат, то есть оно стало известным; формулировка сохраняет оттенок дошедшей вести.
- source_word: βεβαιοτάτην
  choice: столь твёрдая
  rationale: Передаёт превосходную степень и характеристику общины как особенно устойчивой; «столь» естественно подчёркивает контраст с мятежом.
- source_word: στασιάζειν πρὸς
  choice: восстала против
  rationale: Передаёт сильное значение внутреннего мятежа или выступления против руководителей, не ослабляя его до простого разногласия.
- source_word: πρεσβυτέρους
  choice: пресвитеров
  rationale: Устоявшийся раннехристианский термин; не предрешает точную структуру церковного служения.
theological_decisions:
- issue: Передача ἐν Χριστῷ
  choice: во Христе
  alternative: в Мессии
  rationale: В раннехристианском и павловском словоупотреблении это устоявшееся выражение, где Χριστός функционирует как титул-имя; «во Христе» естественно сохраняет эту связь.
- issue: Церковный статус πρεσβύτεροι
  choice: пресвитеры
  alternative: старейшины
  rationale: Транслитерация сохраняет раннехристианский институциональный оттенок и не навязывает современную конфессиональную модель.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным тоном. Сохранены повтор, резкое нравственное осуждение и контраст между прежней устойчивостью древней общины и нынешним мятежом.
