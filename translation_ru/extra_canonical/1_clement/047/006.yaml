  terminology: «Жизнь во Христе» — уместная смысловая передача τῆς ἐν Χριστῷ ἀγωγῆς; «пресвитеры» оправданно сохраняет раннехристианский термин без конфессионального переопределения. «Стойкая» передаёт βεβαιοτάτην как характеристику устойчивости общины.
