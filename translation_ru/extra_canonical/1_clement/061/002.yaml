reference: 1 Clement 61:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: ru
  text: Ведь Ты, Владыка, небесный Царь веков, даёшь сынам человеческим славу, честь и власть над живущими на земле. Ты же, Господи, направь их замыслы к тому, что хорошо и угодно пред Тобой, чтобы они, благочестиво распоряжаясь в мире и кротости властью, данной им Тобой, обрели Твоё благоволение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт обращение к полновластному Господу и сохраняет отличие от следующего κύριε.
- source_word: βασιλεῦ τῶν αἰώνων
  choice: Царь веков
  rationale: Формально сохраняет образ αἰώνων и торжественный молитвенный регистр без сведения смысла только к «вечному Царю».
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: сынам человеческим
  rationale: Сохраняет библейский идиом и обобщённое обозначение людей.
- source_word: τῶν ἐπὶ τῆς γῆς ὑπαρχόντων
  choice: над живущими на земле
  rationale: Родительный после ἐξουσία передаёт область власти; контекст правителей указывает на людей, а не на неодушевлённые земные вещи.
- source_word: διεύθυνον τὴν βουλὴν αὐτῶν
  choice: направь их замыслы
  rationale: Императив передан однозначной русской формой прошения; βουλή здесь означает совет, намерение или замысел правителей.
- source_word: διέποντες
  choice: распоряжаясь
  rationale: Передаёт осуществление и управление вверенной властью, избегая тяжёлого сочетания «управляя властью».
- source_word: εὐσεβῶς
  choice: благочестиво
  rationale: Наречие сохранено как характеристика того, каким образом правители должны осуществлять власть.
- source_word: θεοῦ σου τυγχάνωσιν
  choice: обрели Твоё благоволение
  rationale: Передаёт смысл достижения Божьего благоволения; «милость» могла бы неоправданно сузить значение.
theological_decisions:
- issue: Божественное дарование политической власти
  choice: «даёшь ... власть»
  alternative: «позволяешь иметь власть»
  rationale: Греческое δίδως прямо утверждает, что власть дана Богом; перевод не добавляет оценки того, как конкретные правители ею пользуются.
- issue: Характер молитвы о правителях
  choice: «направь их замыслы»
  alternative: «Ты направляешь их замыслы»
  rationale: διεύθυνον — повелительная форма и выражает прошение, а не констатацию постоянного действия.
- issue: θεοῦ как Божье благоволение
  choice: «Твоё благоволение»
  alternative: «милость от Тебя»
  rationale: Сохраняется направленность к Божьему одобрению без внесения конфессионально нагруженного понимания заслуги или спасения.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской общественной молитвы. Местоимения при обращении к Богу написаны с прописной буквы по принятой русской благоговейной норме. Синтаксис сделан ясным, но сохранены библейские выражения «Царь веков» и «сыны человеческие».
