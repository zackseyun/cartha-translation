revisions:
- from: Ты, Владыка, дал им власть правления через Твоё величественное и неизреченное могущество, чтобы мы, зная о славе и чести, дарованных им Тобой, подчинялись им, ни в чём не противясь Твоей воле. Даруй им, Господи, здоровье, мир, согласие и устойчивость, чтобы они без преткновения осуществляли руководство, данное им Тобой.
  to: Ты, Владыка, даровал им власть управлять через Твоё величественное и неизреченное могущество, чтобы мы, зная о славе и чести, дарованных им Тобой, подчинялись им, ни в чём не противясь Твоей воле. Даруй им, Господи, здоровье, мир, согласие и устойчивость, чтобы они безупречно управляли властью, данной им Тобой.
  rationale: 'Исправлены два неестественных русских сочетания. Перевод сохраняет синтаксическую и смысловую связь: подчинение правителям мотивировано признанием данных им Богом чести и славы, тогда как «ни в чём не противясь» относится к Божьей воле, а не утверждает тождество любого распоряжения правителей Божьей воле. Неоднозначность ἀπροσκόπως не устранена доктринальным истолкованием.'
