    issue: «власть правления»
    rationale: Сочетание грамматически возможно, но в современном литературном русском воспринимается как тавтологичное и неуклюжее. «Власть управлять» сохраняет различение между дарованным полномочием и действием правления.
  - severity: medium
    issue: «без преткновения осуществляли руководство»
    rationale: «Без преткновения» не является естественным русским способом описать надлежащее управление. Наречие ἀπροσκόπως в этом контексте допускает смысл безупречности, отсутствия повода к преткновению или нареканию; «безупречно управляли» передаёт это ясно и литературно.
