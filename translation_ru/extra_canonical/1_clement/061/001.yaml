  source_fidelity: 'Смысл греческого текста передан в целом точно: Бог дарует правителям власть; община, признавая данную им славу и честь, призвана подчиняться им, не противясь Божьей воле; затем следует молитва о благе правителей. Однако «власть правления» неестественно и тавтологично для современного русского, а «без преткновения» в данном контексте звучит не по-русски и недостаточно ясно передаёт ἀπροσκόπως.'
  naturalness: Регистр выдержан, обращение и молитвенная интонация естественны. Небольшая редактура делает ключевые выражения современными литературными без смыслового упрощения.
  terminology: «Владыка» удачно передаёт δέσποτα; «могущество», «согласие» и «устойчивость» приемлемы. «Власть управлять» естественно передаёт ἐξουσίαν τῆς βασιλείας без привязки к монархии. «Безупречно» в управленческом контексте передаёт ἀπροσκόπως как отсутствие проступка, повода к нареканию или преткновения; оно не навязывает конфессионального толкования.
  issues:
