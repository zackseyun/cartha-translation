  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: ru
  text: Ты, Владыка, даровал им власть управлять через Твоё величественное и неизреченное могущество, чтобы мы, зная о славе и чести, дарованных им Тобой, подчинялись им, ни в чём не противясь Твоей воле. Даруй им, Господи, здоровье, мир, согласие и устойчивость, чтобы они безупречно управляли властью, данной им Тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт обращение к Богу как к верховному Повелителю, сохраняя возвышенный молитвенный регистр.
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: власть правления
  rationale: Сохраняет сочетание полномочия (ἐξουσία) и правления/царствования (βασιλεία), не сужая смысл до конкретной формы государственного устройства.
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: величественное и неизреченное могущество
  rationale: «Могущество» естественно передаёт κράτος, а «неизреченное» сохраняет смысл того, что невозможно вполне выразить словами.
- source_word: ὁμόνοιαν
  choice: согласие
  rationale: Обозначает единомыслие и общественное согласие без излишне узкого политического оттенка.
- source_word: εὐστάθειαν
  choice: устойчивость
  rationale: Передаёт состояние прочности, стабильности и надлежащего порядка; не ограничивает просьбу только государственным строем.
- source_word: διέπειν
  choice: осуществляли руководство
  rationale: Передаёт управление и ведение дел в современном литературном русском языке.
- source_word: ἀπροσκόπως
  choice: без преткновения
  rationale: Сохраняет образ отсутствия препятствия, повода к падению или соблазну и не устраняет присущую наречию смысловую широту.
theological_decisions:
- issue: Связь подчинения властям с волей Бога
  choice: «подчинялись им, ни в чём не противясь Твоей воле»
  alternative: «подчинялись им и нисколько не противились Твоей воле»
  rationale: Сохранена грамматическая связь неповиновения именно с Божьей волей без добавления утверждения, будто любое действие правителей само по себе является Божьей волей.
- issue: Характер данной правителям власти
  choice: «руководство, данное им Тобой»
  alternative: «начальствование, данное им Тобой»
  rationale: Сохранено утверждение о божественном даровании власти, но без конфессионального или монархического уточнения, отсутствующего в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством древней общинной молитвы. Местоимения в обращении к Богу написаны с прописной буквы как издательский знак почтительности; синтаксис слегка упрощён относительно греческого периода ради ясности, при сохранении его логики и богословского напряжения.
