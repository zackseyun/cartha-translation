source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: ru
  text: Тебя, единственного, кто может совершить всё это и ещё большие добрые дела среди нас, мы благодарим через первосвященника и защитника наших душ Иисуса Христа. Через Него Тебе — слава и величие и ныне, и из поколения в поколение, и во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμῶν
  choice: среди нас
  rationale: Основное значение оборота в данном контексте — действие Бога в среде общины; формулировка сохраняет редакционное уточнение английского консультационного текста и не сводит смысл к благодеяниям лишь «для нас».
- source_word: ἐξομολογούμεθα
  choice: мы благодарим
  rationale: В молитвенном контексте глагол может выражать благодарение, хвалу или признательное исповедание. «Благодарим» естественно по-русски и соответствует доксологическому характеру фразы.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Прямой и традиционно понятный эквивалент титула ἀρχιερεύς.
- source_word: προστάτου
  choice: защитника
  rationale: Передаёт значение покровителя и заступника; по отношению к душам современное русское «защитник» звучит яснее, чем буквальное и менее естественное «предстоятель».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В формальной доксологической формуле Χριστός функционирует как закрепившийся титул/имя; перевод «Христос» сохраняет регистр и не превращает его в пояснение «Мессия».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивый русский доксологический оборот, точно соответствующий усиленной греческой формуле вечности.
theological_decisions:
- issue: Посредническая роль Иисуса Христа в благодарении и славословии
  choice: 'Сохранено двукратное «через»: благодарение совершается через Иисуса Христа, и через Него Богу воздаётся слава.'
  alternative: Перестроить фразу так, будто слава непосредственно относится к Иисусу Христу.
  rationale: Относительное δι’ οὗ грамматически относится к Иисусу Христу, тогда как σοι («Тебе») указывает адресатом славы на Бога, к которому обращена молитва.
- issue: Эллиптическая доксология без выраженного глагола
  choice: «Тебе — слава и величие»
  alternative: «Да будут Тебе слава и величие»
  rationale: Тире естественно передаёт русским языком отсутствие связки в греческом и не добавляет явно оптативного оттенка, которого исходная формулировка не выражает однозначно.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-доксологического регистра. Длинное греческое предложение разделено после имени Иисуса Христа ради ясности, при сохранении смысловой и риторической связи. Заглавные формы «Тебя», «Него», «Тебе» используются как уважительное обращение к Богу, без конфессионально специфической терминологии.
