review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка одного ключевого глагола. ἐξομολογήσομαί σοι означает открыто исповедовать/воздавать благодарение Богу; в данном цитатном контексте английское audit trail обоснованно передаёт его как «I will give thanks to you». «Прославлю Тебя» сужает и несколько смещает значение к δοξάζω. Остальные соответствия сохраняют форму и образность греческого текста: «поднимешь» не навязывает термин «воскресишь», а «лёг и уснул; пробудился» естественно передаёт два глагола сна и пробуждения.'
  naturalness: Текст в целом звучит естественно на современном литературном русском. «Ведь где-то сказано» — обычная русская формула для введения цитаты; «и ещё» уместно связывает вторую цитату. «Буду благодарить Тебя» естественно в молитвенном регистре и сохраняет будущее время оригинала.
  terminology: 'Следует заменить «прославлю Тебя» на «буду благодарить Тебя», чтобы передать ἐξομολογήσομαί без терминологического смещения. «Поднимешь», «пробудился» и «со мной» оставлены: они не снимают возможной воскресной образности, но и не делают её прямым утверждением там, где греческий текст выражен образно.'
  issues:
