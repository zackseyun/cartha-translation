  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: ru
  text: 'Ведь где-то сказано: «И Ты поднимешь меня, и я буду благодарить Тебя»; и ещё: «Я лёг и уснул; я пробудился, потому что Ты со мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: поднимешь
  rationale: Передаёт будущее время и образ восстановления/восстания, не устраняя возможного в контексте намёка на воскресение.
- source_word: ἐξομολογήσομαί
  choice: прославлю
  rationale: В обращении к Богу глагол означает открытое признание и хвалу; «прославлю» естественно звучит по-русски и соответствует контексту благодарного исповедания.
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: Я лёг и уснул
  rationale: Сохраняет два однокоренных по смыслу греческих глагола в естественной русской формулировке.
- source_word: ἐξηγέρθην
  choice: я пробудился
  rationale: В непосредственном образе сна это наиболее естественный эквивалент, при этом контекст главы допускает воскресную образность.
- source_word: μετ᾿ ἐμοῦ
  choice: со мной
  rationale: Прямой и современный эквивалент выражения присутствия.
theological_decisions:
- issue: Воскресная образность глаголов ἐξαναστήσεις и ἐξηγέρθην
  choice: Сохранить обычные значения «поднимешь» и «пробудился», позволяющие услышать намёк на воскресение из контекста
  alternative: Перевести прямо как «воскресишь» и «воскрес»
  rationale: Греческие цитаты используют язык поднятия и пробуждения; прямое введение слова «воскресить» сняло бы образную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык; торжественный, но доступный регистр. Заглавное «Ты» в цитате обозначает обращение к Богу. Союз καί перед второй цитатой передан как «и ещё» для естественной связи цитат.
