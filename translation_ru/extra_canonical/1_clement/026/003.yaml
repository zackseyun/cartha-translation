  text: καὶ πάλιν Ἰὼβ λέγει· Καὶ ἀναστήσεις τὴν σάρκα μου ταύτην τὴν ἀναντλήσασαν ταῦτα πάντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/003.yaml
  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
translation:
  language: ru
  text: 'И снова Иов говорит: «И Ты воскресишь эту мою плоть, перенёсшую всё это».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεις
  choice: воскресишь
  rationale: Будущее время второго лица передано прямо; в контексте плоти глагол означает возвращение к жизни, а не просто поднятие.
- source_word: σάρκα μου ταύτην
  choice: эту мою плоть
  rationale: Сохранены указательное местоимение и притяжательное отношение; «плоть» соответствует богословски значимому σάρξ.
- source_word: ἀναντλήσασαν
  choice: перенёсшую
  rationale: Причастие описывает плоть, вынесшую на себе все названные испытания; «перенёсшую» естественно по-русски и не ослабляет смысл до простого переживания.
theological_decisions:
- issue: Воскресение той же самой плоти
  choice: «воскресишь эту мою плоть»
  alternative: «поднимешь это моё тело»
  rationale: Формулировка сохраняет и значение воскресения, и подчёркнутую тождественность плоти посредством ταύτην, не добавляя дальнейшего догматического объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пригодным для церковного чтения регистром. Имя Ἰώβ передано в общепринятой русской форме «Иов». Обращение к Богу обозначено прописным «Ты» по русской религиозно-издательской традиции; в греческом тексте местоимение прямо не названо, но лицо выражено формой глагола.
