  terminology: «Творец всего», «воскресение», «благочестиво служили Ему» и «обещание» уместны для современного литературного русского и соответствуют греческим терминам. В сноске следует избегать характеристики феникса как «образа возрождения», поскольку ближайший контекст использует птицу как свидетельство/знак воскресения; также лучше сказать «в предшествующей главе», а не утверждать, что она именно там «описана как образ».
