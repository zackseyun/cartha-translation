source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: ru
  text: Итак, неужели мы считаем чем-то великим и удивительным то, что Творец всего совершит воскресение для тех, кто благочестиво служил Ему в твёрдой уверенности, свойственной доброй вере, если Он даже через птицу[a] показывает нам величие Своего обещания?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть через феникса, упомянутого в предшествующей главе как свидетельство воскресения.
    reason: Греческий текст сохраняет общее слово «птица»; сноска даёт необходимую ближайшую контекстуальную отсылку, не подменяя основной текст.
lexical_decisions:
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: Творец всего
  rationale: Передаёт значение Создателя всего сущего естественным и традиционно возвышенным русским выражением.
- source_word: ἀνάστασιν ποιήσεται
  choice: совершит воскресение
  rationale: Сохраняет конструкцию «осуществит/совершит воскресение», не сводя её лишь к переходному глаголу «воскресит».
- source_word: ὁσίως αὐτῷ δουλευσάντων
  choice: кто свято служил Ему
  rationale: Наречие ὁσίως передано как образ служения — благочестиво и в согласии со святостью; «служил» естественно передаёт δουλεύω в данном религиозном контексте.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: с уверенностью доброй веры
  rationale: Сохраняет связь между уверенностью (πεποίθησις) и доброй верой (πίστις ἀγαθή), не уточняя сверх текста, является ли родительный падеж источником, качеством или содержанием уверенности.
- source_word: δι᾿ ὀρνέου
  choice: через птицу
  rationale: Сохраняет намеренно общее обозначение птицы в самом стихе; её отождествление поясняется в сноске на основании ближайшего контекста.
- source_word: τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ
  choice: величие Своего обещания
  rationale: «Обещание» понятно современному читателю и точно передаёт ἐπαγγελία, а «величие» сохраняет усиленный характер μεγαλεῖον.
theological_decisions:
- issue: Характер будущего воскресения
  choice: «совершит воскресение тех, кто свято служил Ему»
  alternative: «воскресит тех, кто свято служил Ему»
  rationale: Выбранная формулировка ближе к греческому ἀνάστασιν ποιήσεται и подчёркивает действие Творца, не добавляя учения о способе или порядке воскресения.
- issue: Риторический смысл вопроса
  choice: «неужели мы считаем великим и удивительным… если…»
  alternative: «разве следует считать невероятным… раз…»
  rationale: Сохранены вопросительная форма и напряжение оригинала; слово «невероятным» не введено, поскольку его нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, раннехристианским звучанием. Синтаксис риторического вопроса сохранён, но выстроен естественно для русского чтения; прописные местоимения, относящиеся к Богу, использованы как принятая издательская норма.
