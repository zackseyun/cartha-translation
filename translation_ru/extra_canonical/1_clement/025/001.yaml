lexical_decisions:
- source_word: Ἴδωμεν
  choice: Рассмотрим
  rationale: Побудительный аорист передаёт приглашение обратить внимание и вдумчиво рассмотреть описываемое явление.
- source_word: παράδοξον σημεῖον
  choice: необычайное знамение
  rationale: «Необычайное» передаёт смысл чего-то поразительного и выходящего за рамки ожиданий; «знамение» сохраняет возвышенный и потенциально религиозный оттенок σημεῖον.
- source_word: τὸ γινόμενον
  choice: которое совершается
  rationale: Причастие настоящего времени описывает происходящее или повторяющееся явление; «совершается» естественно сочетается со словом «знамение».
- source_word: ἐν τοῖς ἀνατολικοῖς τόποις
  choice: в восточных землях
  rationale: Передаёт географический смысл выражения естественным современным русским языком.
- source_word: τοῖς περὶ τὴν Ἀραβίαν
  choice: в областях близ Аравии
  rationale: Оборот περὶ с винительным здесь обозначает местность вокруг или в окрестностях Аравии; «близ» сохраняет некоторую географическую неопределённость.
