source:
  edition: Funk 1901 (normalized OCR)
  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: ru
  text: Когда же плоть его разлагается, зарождается некий червь, который, питаясь влагой умершего существа, обрастает крыльями. Затем, набравшись сил, он поднимает то гнездо, где находятся кости его предшественника, и, неся их, проделывает путь из Аравийской земли в Египет, в город, называемый Гелиополем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σηπομένης
  choice: разлагается
  rationale: Естественно и точно передаёт процесс тления плоти без излишней архаичности.
- source_word: σκώληξ τις γεννᾶται
  choice: зарождается некий червь
  rationale: Сохраняет неопределённость τις и представление о возникновении червя в разлагающейся плоти.
- source_word: ἰκμάδος
  choice: влагой
  rationale: Передаёт основное значение «влага, сок» в данном описании.
- source_word: πτεροφυεῖ
  choice: обрастает крыльями
  rationale: Передаёт буквальный образ появления и роста крыльев; по-русски звучит естественнее буквального «выращивает крылья».
- source_word: γενναῖος γενόμενος
  choice: набравшись сил
  rationale: В контексте речь идёт о достижении силы или зрелости, позволяющей поднять гнездо.
- source_word: σηκόν
  choice: гнездо
  rationale: Контекст требует вместилища с останками птицы; «гнездо» соответствует повествованию и консультационному английскому тексту.
- source_word: τοῦ προγεγονότος
  choice: его предшественника
  rationale: Сжато сохраняет смысл «того, кто был прежде», не добавляя прямо отсутствующее в этой фразе слово «птица».
- source_word: διανύει
  choice: проделывает путь
  rationale: Передаёт завершённое преодоление расстояния, а не просто движение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Греческое относительное предложение ὃς ... πτεροφυεῖ сохранено как придаточное, относящееся к червю. Консультационная английская сноска не перенесена, поскольку указанное в ней альтернативное сочинительное прочтение не отражает ясную греческую конструкцию с относительным местоимением ὃς.
