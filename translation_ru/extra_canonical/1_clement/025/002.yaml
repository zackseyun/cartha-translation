  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: ru
  text: Есть птица, называемая фениксом. Она — единственная в своём роде и живёт пятьсот лет. Когда она уже приближается ко времени своей смерти[a], она устраивает себе гнездо из ладана, смирны и прочих благовоний. Когда назначенный срок истекает, она входит в него и умирает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение содержит слово с оттенком ухода или освобождения, но прямо упоминает смерть.
    reason: Поясняет необычное сочетание ἀπόλυσις с прямым указанием на смерть, не нарушая естественности основного текста.
lexical_decisions:
- source_word: ὄρνεον
  choice: птица
  rationale: Обычное и естественное соответствие греческому обозначению птицы.
- source_word: μονογενές
  choice: единственная в своём роде
  rationale: В данном контексте слово указывает на уникальность феникса как единственного представителя своего рода, а не на происхождение или рождение.
- source_word: ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  choice: пора уйти из жизни — умереть
  rationale: Сохраняет одновременно оттенок ухода/освобождения в ἀπόλυσις и явное упоминание смерти в ἀποθανεῖν, не делая русскую фразу неестественной.
- source_word: σηκόν
  choice: гнездо
  rationale: Хотя слово может обозначать огороженное или устроенное место, в рассказе о птице естественным контекстуальным соответствием является «гнездо».
- source_word: λίβανος ... σμύρνα ... ἀρώματα
  choice: ладан, смирна и прочие благовония
  rationale: Передаёт перечисление ароматических веществ привычными литературными русскими терминами.
- source_word: πληρωθέντος τοῦ χρόνου
  choice: когда срок исполняется
  rationale: Сохраняет образ исполнения назначенного времени и звучит естественно по-русски.
theological_decisions:
- issue: Описание смерти феникса как ἀπόλυσις
  choice: уйти из жизни — умереть
  alternative: приближается время её смерти
  rationale: Выбранный вариант не устраняет напряжение между значением «уход/освобождение» и прямым глаголом «умереть»; при этом он не приписывает выражению специального конфессионального смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным звучанием. Синтаксис разделён на ясные предложения; сохранены повествовательная последовательность и образ исполнения назначенного срока.
