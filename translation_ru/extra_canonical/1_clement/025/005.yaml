  text: So then the priests inspect the records of the times[a], and they find that it came when the five-hundredth year was completed.
translation:
  language: ru
  text: Итак, жрецы изучают хронологические записи и обнаруживают, что он явился по завершении пятисотого года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερεῖς
  choice: жрецы
  rationale: В контексте рассказа о египетской птице фениксе речь идёт о служителях языческого культа; «жрецы» по-русски передаёт это точнее, чем «священники».
- source_word: ἐπισκέπτονται
  choice: сверяются с
  rationale: Глагол обозначает внимательное рассмотрение или проверку; применительно к записям естественно русское «сверяются с».
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  choice: летописными записями
  rationale: Выражение относится к письменным хронологическим свидетельствам; такой перевод передаёт смысл без тяжеловесного буквального «записи времён».
- source_word: ἐληλυθέναι
  choice: явился
  rationale: Перфектный инфинитив в косвенной речи сообщает об установленном по записям прибытии феникса; прошедшее время естественно для русского повествования.
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: по завершении пятисотого года
  rationale: Передаёт генитив абсолютный и мысль о том, что пятисотый год полностью истёк.
