revisions:
- from: А днём[a], на глазах у всех, она прилетает к алтарю солнца, кладёт их туда и затем отправляется в обратный путь.
  to: А днём[a], на глазах у всех, она, прилетев к алтарю солнца, кладёт их и затем отправляется обратно.
  rationale: Небольшая правка восстанавливает роль греческого причастия ἐπιπτὰς и избегает не выраженной в оригинале конкретизации «в обратный путь». Смысл, референция местоимений и нейтральный регистр сохранены. Сноска к ἡμέρας остаётся корректной и её якорь сохранён.
  reviewer_model: gpt-5.6-terra
