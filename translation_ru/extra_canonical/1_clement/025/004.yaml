base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: ru
  text: А днём[a], на глазах у всех, она, прилетев к алтарю солнца, кладёт их и затем отправляется обратно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А в дневное время».'
    reason: Сохраняется возможная более развёрнутая передача родительного времени ἡμέρας.
lexical_decisions:
- source_word: ἡμέρας
  choice: днём
  rationale: Родительный времени естественно передаётся наречием «днём», то есть в дневное время.
- source_word: ἐπιπτὰς
  choice: прилетает
  rationale: Форма обозначает прибытие полётом к указанному месту; настоящее время по-русски естественно в повествовании о повторяющемся действии птицы.
- source_word: βωμὸν τοῦ ἡλίου
  choice: алтарю солнца
  rationale: Сохраняется прямое значение выражения без уточнения характера культа.
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: отправляется в обратный путь
  rationale: Идиоматично передаёт начало движения назад, не добавляя в текст прямо не названного места назначения.
