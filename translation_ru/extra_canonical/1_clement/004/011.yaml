  language: ru
  text: Из-за зависти Аарон и Мариам расположились вне стана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: из-за зависти
  rationale: Передаёт причинное значение διά и обычный в контексте 1 Климента отрицательный смысл ζῆλος; грамматическая форма ζῆλος, вероятно, отражает вариант или особенность передачи текста.
- source_word: παρεμβολῆς
  choice: стана
  rationale: В повествовательном библейском контексте означает лагерь/стан; «стан» сохраняет достоинство стиля и остаётся понятным.
- source_word: ηὐλίσθησαν
  choice: расположились
  rationale: Глагол означает провести время или разместиться на ночлег; нейтральное «расположились» сохраняет фактическое утверждение, не добавляя прямо идеи изгнания.
theological_decisions:
- issue: Связь зависти с пребыванием Аарона и Мариам вне стана
  choice: 'Сохранена прямая причинная формулировка автора: «из-за зависти».'
  alternative: «Из-за ревности» или уточнение, кто именно завидовал и кому.
  rationale: Греческий текст не называет субъекта или объекта зависти, поэтому перевод не разрешает эту неоднозначность и не согласовывает её искусственно с ветхозаветным повествованием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «стан»; синтаксис краткий и близкий к греческому.
