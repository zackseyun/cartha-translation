  language: ru
  text: Зависть привела к тому, что Иосифа преследовали до грани смерти и он попал в рабство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «был преследуем до смерти и вошёл в рабство».'
    reason: Сохраняет для читателя более буквальную форму двух оборотов с μέχρι и исходную напряжённость выражения «до смерти».
lexical_decisions:
- source_word: ζῆλος
  choice: зависть
  rationale: В повествовании об Иосифе речь идёт о зависти братьев; в современном русском «ревность» могла бы ошибочно восприниматься как любовная ревность или усердие.
- source_word: ἐποίησεν
  choice: привела к тому, что
  rationale: Передаёт каузативную конструкцию естественным современным русским языком.
- source_word: μέχρι θανάτου
  choice: до грани смерти
  rationale: Передаёт предел и крайнюю степень преследования, не утверждая, что Иосиф действительно умер.
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: попал в рабство
  rationale: Естественно выражает вхождение в состояние рабства; повторное μέχρι обозначает достигнутый предел.
theological_decisions:
- issue: Означает ли μέχρι θανάτου фактическую смерть Иосифа
  choice: «до грани смерти»
  alternative: «до смерти» / «вплоть до смерти»
  rationale: Иосиф не погиб; формулировка сохраняет силу греческого выражения как указание на крайнюю опасность, не создавая ложного утверждения о результате преследования.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Синтаксический параллелизм двух инфинитивных конструкций частично сохранён повтором «что».
