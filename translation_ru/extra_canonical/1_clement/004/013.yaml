  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: ru
  text: Из-за ревности Давид не только стал предметом зависти иноплеменников, но и подвергся преследованиям со стороны Саула, царя Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: из-за ревности
  rationale: Передаёт причинное значение διὰ и сохраняет отличие ζῆλος от последующего φθόνος; «ревность» здесь понимается в отрицательном смысле — как завистливая ревность.
- source_word: φθόνον ἔσχεν ὑπὸ
  choice: стал предметом зависти
  rationale: Греческое сочетание означает, что Давид испытывал направленную на него зависть; русская формулировка естественно передаёт пассивный смысл при сохранении существительного «зависть».
- source_word: τῶν ἀλλοφύλων
  choice: иноплеменников
  rationale: Традиционное и уместное в библейском контексте обозначение людей из других народов, в данном случае прежде всего филистимлян, без внесения более узкой идентификации в основной текст.
- source_word: ἐδιώχθη
  choice: подвергся преследованиям
  rationale: Точно передаёт пассивную форму и продолжительное либо неоднократное преследование Давида Саулом.
