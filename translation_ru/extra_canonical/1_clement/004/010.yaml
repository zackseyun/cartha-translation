source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: ru
  text: 'Зависть вынудила Моисея бежать от фараона, царя Египта, когда он услышал от своего соплеменника: «Кто поставил тебя судьёй или арбитром над нами?[a] Не хочешь ли ты убить меня, как вчера убил египтянина?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоят два близких юридических обозначения: «судья» и «арбитр»; второе слово также может означать судебного должностного лица.'
    reason: Поясняет сохранённую в переводе пару κριτής и δικαστής и отличие формулировки Климента от привычного текста Исх. 2:14.
lexical_decisions:
- source_word: ζῆλος
  choice: зависть
  rationale: В контексте рассуждения 1 Климента о пагубных последствиях зависти слово обозначает именно зависть, хотя в иных контекстах может означать ревность или рвение.
- source_word: φυγεῖν ... ἀπὸ προσώπου Φαραώ
  choice: бежать от фараона
  rationale: Естественно передаёт смысл греческого оборота «бежать от лица/присутствия фараона», не воспроизводя в современном русском неестественную буквальную конструкцию.
- source_word: ὁμοφύλου
  choice: соплеменника
  rationale: Передаёт человека одного народа или племени с Моисеем; это точнее, чем общее «ближнего».
- source_word: κριτὴν ἢ δικαστὴν
  choice: судьёй или вершителем правосудия
  rationale: Сохраняет два близких по значению юридических термина в тексте Климента и не заменяет первый из них привычным по Септуагинте словом «правитель».
- source_word: μὴ ἀνελεῖν με σὺ θέλεις
  choice: Не хочешь ли ты убить меня
  rationale: Передаёт вопрос с μή, ожидающий отрицательного ответа, естественной русской вопросительной формой без чрезмерного усиления.
theological_decisions:
- issue: Причина бегства Моисея
  choice: 'Сохранить прямое утверждение Климента: «Зависть вынудила Моисея»'
  alternative: Объяснить зависть как страх Моисея или прямо назвать завистником фараона
  rationale: Греческий текст не называет носителя зависти и формулирует причинную связь сжато; перевод не должен устранять эту смысловую напряжённость пояснением.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Библейская цитата звучит естественно, но отражает именно греческий текст Климента, включая два юридических наименования.
