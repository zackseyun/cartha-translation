base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: ru
  text: 'И сказал Бог Каину: «Почему ты опечалился и почему поникло твоё лицо? Если ты приносишь правильно, но не разделяешь правильно, разве ты не согрешил?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος ἐγένου
  choice: ты опечалился
  rationale: Передаёт наступившее состояние печали естественным современным русским языком, не усиливая значение наречиями вроде «глубоко».
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: поникло твоё лицо
  rationale: Сохраняет телесный образ греческого текста и звучит понятно и достойно по-русски.
- source_word: ὀρθῶς προσενέγκῃς
  choice: приносишь правильно
  rationale: Сохраняет жертвенный контекст глагола προσφέρω и повтор ὀρθῶς, не уточняя то, чего нет в данной формулировке.
- source_word: ὀρθῶς δὲ μὴ διέλῃς
  choice: но не разделяешь правильно
  rationale: Буквально сохраняет спорный глагол διαιρέω и его связь со вторым ὀρθῶς; более конкретное «распределяешь» или «делишь жертву» устранило бы подлинную неоднозначность.
- source_word: ἥμαρτες
  choice: ты не согрешил
  rationale: В риторическом вопросе с οὐκ русский оборот «разве ты не…» естественно передаёт ожидаемый утвердительный ответ.
theological_decisions:
- issue: Смысл выражения ὀρθῶς δὲ μὴ διέλῃς
  choice: не разделяешь правильно
  alternative: неправильно распределяешь / неправильно разделяешь жертву
  rationale: Греческая формулировка, восходящая к Септуагинте Быт 4:7, допускает разные толкования. Перевод не конкретизирует объект и не связывает фразу с отдельной богословской трактовкой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксический параллелизм и повтор слова «правильно» сохранены; архаизмы и конфессионально окрашенные уточнения не использованы.
