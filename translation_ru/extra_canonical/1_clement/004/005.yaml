lexical_decisions:
- source_word: ἡσύχασον
  choice: Успокойся
  rationale: Повелительная форма передаёт призыв уняться или успокоиться; это естественнее в данном контексте, чем буквальное «будь тих».
- source_word: ἀποστροφή
  choice: обращение
  rationale: Сохраняет образ поворота или направленности к кому-либо, не сводя смысл однозначно к «желанию».
- source_word: ἄρξεις
  choice: будешь властвовать
  rationale: Передаёт значение ἄρχω — править, господствовать, властвовать.
theological_decisions:
- issue: Референт мужских местоимений αὐτοῦ
  choice: Сохранены формы «его» и «над ним» без поясняющей подстановки существительного.
  alternative: Назвать референт прямо, например «грех».
  rationale: Греческий фрагмент грамматически сохраняет местоименную отсылку; явная подстановка устранила бы присущую цитате контекстуальную неоднозначность.
