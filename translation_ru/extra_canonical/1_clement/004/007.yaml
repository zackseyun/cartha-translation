lexical_decisions:
- source_word: ὁρᾶτε
  choice: Посмотрите
  rationale: Передаёт форму повелительного наклонения настоящего времени как прямой призыв обратить внимание; естественно звучит по-русски.
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое и уместное в обращении соответствие греческому слову.
- source_word: ζῆλος καὶ φθόνος
  choice: ревность и зависть
  rationale: Сохраняет два близких, но не полностью тождественных понятия исходного текста и их порядок.
- source_word: ἀδελφοκτονίαν
  choice: братоубийству
  rationale: Точное естественное русское соответствие греческому составному существительному, сохраняющее повтор корня «брат» после обращения «братья».
- source_word: κατειργάσατο
  choice: привели к
  rationale: Естественно передаёт результативное значение «совершило, вызвало, стало причиной»; согласование во множественном числе соответствует русским однородным подлежащим.
