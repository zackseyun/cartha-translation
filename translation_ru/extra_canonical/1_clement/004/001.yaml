  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: ru
  text: 'Ибо написано так: «По прошествии некоторого времени Каин принёс из плодов земли приношение Богу, и Авель также принёс от первенцев овец и от их жирных частей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ' ἡμέρας
  choice: спустя несколько дней
  rationale: Естественно передаёт неопределённый промежуток времени, выраженный греческим оборотом.
- source_word: θυσίαν
  choice: жертву
  rationale: В данном контексте слово обозначает приношение Богу; «жертва» сохраняет культовый оттенок оригинала.
- source_word: τῶν πρωτοτόκων τῶν προβάτων
  choice: от первенцев овец
  rationale: Сохраняет значение первых родившихся животных стада и конструкцию с ἀπό.
- source_word: τῶν στεάτων αὐτῶν
  choice: их тука
  rationale: «Тук» — точное и узнаваемое в библейском регистре обозначение жировых частей жертвенных животных.
theological_decisions:
- issue: Характер приношений Каина и Авеля
  choice: Оба приношения названы жертвой без пояснения причин их различной оценки
  alternative: Уточнить, что одно было бескровным даром, а другое кровной жертвой
  rationale: Сам стих такого богословского противопоставления не формулирует; перевод не должен привносить его.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, dignified регистром. Цитатная формула и последовательность повествования сохранены; архаическое «тук» оставлено ради точности культового термина.
