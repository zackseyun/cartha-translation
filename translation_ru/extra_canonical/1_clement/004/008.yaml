  text: διὰ ζῆλος ὁ πατὴρ ἡμῶν Ἰακὼβ ἀπέδρα ἀπὸ προσώπου Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/008.yaml
  text: Because of jealousy our father Jacob fled from the face of Esau his brother.
translation:
  language: ru
  text: Из-за зависти отец наш Иаков бежал от лица Исава, брата своего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: из-за зависти
  rationale: Передаёт причинное значение διά; ζῆλος в контексте ряда примеров пагубной зависти означает именно «зависть», хотя греческая форма ζῆλος выглядит морфологически неровной после διά.
- source_word: ἀπέδρα
  choice: бежал
  rationale: Глагол ἀποδιδράσκω обозначает бегство, спасение бегством; простой русский глагол точно и естественно передаёт действие.
- source_word: ἀπὸ προσώπου
  choice: от лица
  rationale: Сохранён библейский оборот, буквально соответствующий греческому выражению и понятный в значении бегства от чьего-либо присутствия.
- source_word: Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ
  choice: Исава, брата своего
  rationale: Сохранена пояснительная конструкция оригинала; возвратное «своего» естественно связывает родство с Иаковом.
theological_decisions:
- issue: Кому принадлежит зависть
  choice: Не уточнять субъекта зависти
  alternative: «Из-за зависти Исава»
  rationale: Греческий текст называет причиной зависть, но в самом предложении прямо не указывает её носителя; добавление имени Исава устранило бы подлинную формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «отец наш» и оборот «от лица» сохраняют достоинство и близость к исходной формулировке, не затрудняя понимания.
