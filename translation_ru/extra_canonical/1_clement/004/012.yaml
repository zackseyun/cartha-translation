  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: ru
  text: Зависть низвела Дафана и Авирона живыми в царство мёртвых[a] за то, что они восстали против Моисея, служителя Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Аид»; то есть в область, или царство, мёртвых. Традиционный перевод: «в ад».'
    reason: Сохраняет греческий образ ᾅδης и предупреждает современное узкое понимание слова «ад» исключительно как места окончательного наказания.
lexical_decisions:
- source_word: ζῆλος
  choice: зависть
  rationale: В перечне губительных примеров слово обозначает порочную зависть или ревность; «зависть» здесь естественно и ясно передаёт отрицательный смысл.
- source_word: ζῶντας κατήγαγεν
  choice: низвела ... живыми
  rationale: Сохранены каузативный образ нисхождения и существенное указание на то, что Дафан и Авирон сошли туда живыми.
- source_word: εἰς ᾅδου
  choice: в царство мёртвых
  rationale: Родительный ᾅδου при подразумеваемом обозначении места передаёт область умерших; перевод не отождествляет её без пояснений с местом окончательного наказания.
- source_word: στασιάσαι
  choice: восстали
  rationale: Глагол означает мятежное выступление или бунт; «восстали против» точно и естественно передаёт контекст Кореевой смуты.
- source_word: θεράποντα τοῦ θεοῦ
  choice: служителя Божьего
  rationale: θεράπων — почётное обозначение Моисея как преданного служителя Бога; «служитель» сохраняет библейское и богословское звучание лучше, чем бытовое «прислужник» или ослабленное «помощник».
theological_decisions:
- issue: Значение ᾅδης
  choice: царство мёртвых
  alternative: ад
  rationale: В данном контексте речь прежде всего о нисхождении живыми в область умерших (ср. Чис 16), а не о явно сформулированном учении об окончательном наказании; основной текст сохраняет эту смысловую широту, а традиционный термин дан в примечании.
- issue: Статус Моисея в выражении θεράπων τοῦ θεοῦ
  choice: служитель Божий
  alternative: слуга Божий
  rationale: «Служитель» передаёт почётный титул и связь с библейской характеристикой Моисея, не привнося конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Имена переданы в привычной русской библейской форме. Порядок заключительной фразы сделан естественным для русского языка, при этом титул Моисея сохранён.
