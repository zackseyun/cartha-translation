  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: ru
  text: И взглянул Бог на Авеля и на его дары, а на Каина и на его жертвы не обратил внимания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а на Каина и на его жертвы не взглянул благосклонно».'
    reason: Греческие выражения εἶδεν ἐπί и οὐ προσέσχεν в этом противопоставлении могут обозначать соответственно благосклонное принятие и отказ принять, а не только зрительное восприятие или внимание.
lexical_decisions:
- source_word: εἶδεν ... ἐπὶ
  choice: взглянул ... на
  rationale: Сохраняет образ исходного выражения и параллелизм фразы; в данном контексте взгляд подразумевает благосклонное принятие, но перевод не делает этот оттенок более явным, чем греческий текст.
- source_word: δῶρα
  choice: дары
  rationale: Обычное и точное соответствие для приношений Авеля; оно также сохраняет лексическое отличие от θυσίαις.
- source_word: θυσίαις
  choice: жертвы
  rationale: Передаёт культовый смысл слова и сохраняет его отличие от «даров» Авеля.
- source_word: οὐ προσέσχεν
  choice: не обратил внимания
  rationale: Естественная современная русская передача значения «не внял, не удостоил внимания, не принял во внимание»; она сохраняет противопоставление Божьему взгляду на Авеля.
theological_decisions:
- issue: Передаёт ли Божий взгляд явное принятие жертвы
  choice: Оставить в основном тексте нейтральное «взглянул», а возможный оттенок благосклонности указать в сноске
  alternative: «благосклонно взглянул» / «призрел»
  rationale: Контекст предполагает принятие Авеля и его даров, однако греческое εἶδεν буквально означает «взглянул/увидел». Такой перевод сохраняет смысловое напряжение и не усиливает формулировку без необходимости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «на Авеля и на его дары» сохраняет риторический параллелизм греческого текста; притяжательное местоимение передано в естественной для современного русского позиции.
