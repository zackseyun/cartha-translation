  text: καὶ εἶπεν Κάϊν πρὸς Ἄβελ τὸν ἀδελφὸν αὐτοῦ· Διέλθωμεν εἰς τὸ πεδίον. καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς ἐν τῷ πεδίῳ, ἀνέστη Κάϊν ἐπʼ Ἄβελ τὸν ἀδελφὸν αὐτοῦ καὶ ἀπέκτεινεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: ru
  text: 'И сказал Каин Авелю, брату своему: «Пойдём в поле».[a] И когда они были в поле, Каин восстал против Авеля, брата своего, и убил его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Выйдем в поле».'
    reason: Глагол Διέλθωμεν допускает здесь передачу движения наружу как «выйдем», хотя «пойдём» естественнее и не уточняет исходную точку.
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: Пойдём в поле
  rationale: В данном контексте διέρχομαι с εἰς обозначает переход из одного места в другое, а не прохождение поля насквозь; естественное русское выражение сохраняет направление движения.
- source_word: ἀνέστη ... ἐπʼ
  choice: восстал против
  rationale: Передаёт образное «поднялся против» и враждебное действие, не сводя выражение сразу к более узкому «напал».
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Прямой и точный современный эквивалент глагола со значением лишения жизни.
theological_decisions: []
