  text: γέγραπται γάρ· Κολλᾶσθε τοῖς ἁγίοις, ὅτι οἱ κολλώμενοι αὐτοῖς ἁγιασθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: ru
  text: 'Ибо написано: «Держитесь святых, ибо те, кто держится их, будут освящены».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾶσθε / κολλώμενοι
  choice: держитесь / держащиеся
  rationale: Глагол κολλάω здесь выражает тесную, устойчивую привязанность или единение. «Держаться кого-либо» естественно звучит по-русски, передаёт настойчивость призыва и сохраняет повтор греческого корня.
- source_word: τοῖς ἁγίοις
  choice: святых
  rationale: Субстантивированное прилагательное во множественном числе обозначает святых людей; перевод сохраняет эту открытость и не уточняет сверх текста, о какой именно группе идёт речь.
- source_word: ἁγιασθήσονται
  choice: будут освящены
  rationale: Будущее страдательного залога передано формально близко; «освящены» сохраняет богословскую связь со словом «святых» и не называет подразумеваемого деятеля.
theological_decisions:
- issue: Связь со святыми и последующее освящение
  choice: «держащиеся их будут освящены»
  alternative: «те, кто держится их, станут святыми»
  rationale: Страдательная форма «будут освящены» точнее сохраняет ἁγιασθήσονται, не превращает высказывание в утверждение о самопроизвольном нравственном уподоблении и оставляет деятеля невыраженным, как в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Синтаксический параллелизм и повтор глагола оригинала сохранены; архаизмы и конфессионально окрашенные уточнения не добавлены.
