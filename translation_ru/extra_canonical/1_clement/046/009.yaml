source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σχίσμα ὑμῶν πολλοὺς διέστρεψεν, πολλοὺς εἰς ἀθυμίαν ἔβαλεν, πολλοὺς εἰς δισταγμόν, τοὺς πάντας ἡμᾶς εἰς λύπην· καὶ ἐπίμονος ὑμῶν ἐστὶν ἡ στάσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: ru
  text: Ваш раскол многих сбил с пути, многих поверг в уныние, многих — в сомнение, а всех нас — в скорбь; и ваша распря упорно продолжается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: раскол
  rationale: Прямо передаёт разделение внутри общины и сохраняет сильную отрицательную окраску греческого слова.
- source_word: διέστρεψεν
  choice: совратил с пути
  rationale: Передаёт значение отклонения от правильного пути; дополнение «с пути» естественно по-русски и не уточняет сверх текста, в чём именно состояло заблуждение.
- source_word: ἀθυμίαν
  choice: уныние
  rationale: Отражает утрату духа, мужества и надежды в данном увещевательном контексте.
- source_word: δισταγμόν
  choice: сомнение
  rationale: Сохраняет значение колебания и неуверенности без излишнего догматического уточнения.
- source_word: στάσις
  choice: распря
  rationale: Здесь обозначает внутренний мятежный раздор или партийную борьбу; «распря» звучит естественно и отличает это слово от ранее употреблённого σχίσμα.
- source_word: ἐπίμονος
  choice: упорно продолжается
  rationale: Передаёт не просто длительность, но стойкий, неуступчивый характер продолжающейся распри.
theological_decisions:
- issue: Характер последствий раскола
  choice: «совратил с пути» без уточнения духовного или доктринального характера отклонения
  alternative: «ввёл в заблуждение»
  rationale: Греческое διέστρεψεν допускает оттенки извращения, сбивания и отклонения; выбранная формулировка сохраняет образ направления и не разрешает неоднозначность в пользу исключительно вероучительного заблуждения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены анафорический повтор «многих» и нарастание к «всех нас». Точка с запятой перед заключительной частью воспроизводит смысловой перелом оригинала.
