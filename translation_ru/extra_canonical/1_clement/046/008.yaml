base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: ru
  text: 'Ведь он сказал[a]: «Горе тому человеку! Лучше было бы ему не родиться, чем соблазнить одного из моих избранных. Лучше было бы ему, если бы ему повесили на шею жернов и потопили в море, чем совратить одного из моих избранных».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ведь сказал»; подлежащее в греческом тексте подразумевается и определяется контекстом.'
    reason: Греческое εἶπεν не содержит выраженного подлежащего; строчное «он» передаёт контекстуально подразумеваемого говорящего, не уточняя его личность.
lexical_decisions:
- source_word: σκανδαλίσαι
  choice: соблазнить
  rationale: Передаёт образ преткновения и причинения духовного падения; это естественный и узнаваемый библейский глагол в современном литературном русском.
- source_word: τῶν ἐκλεκτῶν μου
  choice: Моих избранных
  rationale: Сохраняет притяжательное местоимение и богословски значимое, но не уточнённое автором обозначение избранных.
- source_word: περιτεθῆναι μύλον
  choice: ему повесили жернов
  rationale: Естественно передаёт страдательный инфинитив и образ жернова, возложенного на человека; не добавляет отсутствующее в данном тексте уточнение «на шею».
- source_word: καταποντισθῆναι
  choice: потопили в море
  rationale: Передаёт принудительное погружение с гибелью, сохраняя страдательную конструкцию.
- source_word: διαστρέψαι
  choice: совратить
  rationale: Передаёт более активное отклонение от правильного пути; сохраняет отличие от предшествующего σκανδαλίσαι.
theological_decisions:
- issue: Референт подразумеваемого подлежащего εἶπεν
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы или явное «Господь»
  rationale: Контекст цитаты предполагает слова Иисуса, но греческий текст здесь не называет говорящего; местоимение сохраняет эту невыраженность, а прописная буква соответствует русской библейской практике.
- issue: Соотношение двух сравнительных оборотов с ἢ
  choice: «чем соблазнить… / чем совратить…»
  alternative: «нежели ему соблазнить… / нежели ему совратить…»
  rationale: Сохраняет синтаксическую напряжённость греческих инфинитивов и естественно звучит по-русски, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя, при этом сохранены параллелизм, суровость предостережения и различие между σκανδαλίσαι и διαστρέψαι.
