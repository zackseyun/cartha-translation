  terminology: «Избранные» уместно для ἐκλεκτοί. «Соблазнить» и «совратить» допустимы в библейском регистре и удачно сохраняют различие греческих глаголов. Строчная буква в «он сказал» не навязывает богословскую интерпретацию референта.
