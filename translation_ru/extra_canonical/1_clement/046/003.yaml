  source_fidelity: Первые две пары переданы точно и сохраняют намеренный повтор ἀθῷος — ἀθῷος и ἐκλεκτός — ἐκλεκτός. В последней паре греч. στρεβλός — διαστρέψεις образует однокоренную игру со значением «кривой/извращённый — поступишь криво/извратишь». Черновое «лукавый — поступишь лукаво» передаёт общий нравственный смысл, но несколько сдвигает образ и не вполне обоснованно толкует глагол. Предлагаемая формула сохраняет образ, повтор и активное значение глагола в естественном русском виде.
  naturalness: «С кривым поступишь криво» — понятная современная литературная формула в пословичном, цитатном регистре. Она избегает неестественного буквального «искривишь», которое в русском обычно требует дополнения. «С избранным будешь избран» сохраняет обобщённость греческого выражения и не превращает его в титул.
  terminology: «Невинный», «избранный» и «кривой» соответствуют лексике оригинала; «кривой» здесь метафоричен и поддержан параллельной игрой слов. Не следует заменять его на «лукавый» в основном тексте, поскольку это уже интерпретирующий нравственный эквивалент, а не исходный образ.
