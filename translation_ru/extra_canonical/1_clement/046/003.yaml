  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: ru
  text: 'И ещё в другом месте сказано: «С невинным человеком ты будешь невинен, с избранным будешь избран, а с кривым поступишь криво[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с лукавым поступишь лукаво». В греческом тексте здесь игра однокоренных слов со значением «кривой/извращённый — поступишь криво/извратишь».'
    reason: Передаёт возможный нравственный оттенок без объявления неестественной русской конструкции буквальным переводом и поясняет однокоренную игру слов оригинала.
lexical_decisions:
- source_word: ἀθῷος
  choice: невинный / невинен
  rationale: Сохраняет повтор одного и того же греческого прилагательного и передаёт значение невиновности, чистоты от вины.
- source_word: ἐκλεκτός
  choice: избранный / избран
  rationale: Передаёт обычное значение слова и сохраняет параллельный лексический повтор без превращения выражения в особый титул.
- source_word: στρεβλός / διαστρέψεις
  choice: лукавый / поступишь лукаво
  rationale: Передаёт связь между прилагательным и глаголом естественным русским оборотом; буквальное «с кривым искривишься» здесь менее ясно и может ошибочно восприниматься как указание на телесный недостаток.
theological_decisions:
- issue: Определённость ἐκλεκτοῦ и στρεβλοῦ
  choice: «с избранным» и «с лукавым» как обобщённые обозначения человека
  alternative: «с Избранным» и «с лукавым человеком»
  rationale: Оба слова употреблены без артикля и входят в параллельный ряд с «невинным человеком»; перевод не делает «избранного» особым мессианским титулом.
- issue: Смысл διαστρέψεις
  choice: «поступишь лукаво»
  alternative: «станешь извращённым» или «искривишься»
  rationale: Греческая форма допускает буквальное «ты искривишь», тогда как цитируемая традиция Пс 17:27 передаёт проявление соответствующего отношения. Формулировка сохраняет активную форму и нравственный смысл, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской цитаты. Сохранены трёхчастный параллелизм и повтор ключевых слов; союз в последней части передан как «а» для естественного противопоставления.
