source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: ru
  text: Или разве у нас не один Бог, не один Мессия и не один Дух благодати, излитый на нас, и не одно призвание в Мессии?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте «одно призвание» стоит в именительном падеже, тогда как три предшествующих члена перечисления стоят в винительном падеже при глаголе «имеем». Вероятно, это риторический синтаксический сдвиг; возможен перевод: «И не одно ли призвание в Мессии?»'
    reason: Передаёт и поясняет заметный синтаксический сдвиг оригинала, который невозможно непосредственно сохранить в русском без неестественной конструкции.
lexical_decisions:
- source_word: ἕνα θεόν
  choice: один у нас Бог
  rationale: Оборот с «у нас» естественно передаёт ἔχομεν («мы имеем») и сохраняет акцент на единстве Бога.
- source_word: ἕνα Χριστόν / ἐν Χριστῷ
  choice: один Мессия / в Мессии
  rationale: Χριστός передан как титул «Мессия», а не как имя; одинаковый выбор сохранён в обоих случаях.
- source_word: ἓν πνεῦμα τῆς χάριτος
  choice: один Дух благодати
  rationale: Родительный τῆς χάριτος естественно и без лишнего истолкования передаётся сочетанием «Дух благодати».
- source_word: τὸ ἐκχυθὲν ἐφ’ ἡμᾶς
  choice: излитый на нас
  rationale: Причастный оборот относится к πνεῦμα и сохраняет традиционную, понятную метафору излияния.
- source_word: μία κλῆσις
  choice: одно призвание
  rationale: «Призвание» точно передаёт κλῆσις в контексте общего Божьего зова и единства общины.
theological_decisions:
- issue: Личностное или неличностное понимание πνεῦμα
  choice: Дух с прописной буквы
  alternative: дух с строчной буквы
  rationale: Сочетание «один Дух благодати, излитый на нас» в раннехристианском перечислении рядом с Богом и Мессией наиболее естественно указывает на Божьего Духа; формулировка при этом не добавляет позднейших догматических определений.
- issue: Синтаксический статус последнего члена перечисления
  choice: Сохранить его как продолжение единого риторического вопроса
  alternative: 'Выделить в отдельный вопрос: «И не одно ли призвание в Мессии?»'
  rationale: μία κλῆσις стоит в именительном падеже после ряда винительных при ἔχομεν, что создаёт синтаксический сдвиг, но не требует вводить отсутствующий в греческом новый глагол.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Повтор «не один… не один… не один… и не одно» делает риторическую структуру ясной и естественной по-русски; термин «Мессия» последовательно сохраняет титульный смысл Χριστός.
