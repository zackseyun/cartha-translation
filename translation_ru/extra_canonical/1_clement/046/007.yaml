id: 1CLEM.46.7
reference: 1 Clement 46:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: ru
  text: 'Зачем мы растаскиваем и разрываем на части члены Мессии, восстаём против собственного тела и доходим до такого безумия, что забываем: мы — члены друг другу?


    Помните слова Иисуса, нашего Господа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλκωμεν
  choice: растаскиваем
  rationale: Передаёт действие разъединения и сохраняет телесную образность; в паре со следующим глаголом создаёт нарастание силы.
- source_word: διασπῶμεν
  choice: разрываем на части
  rationale: Сохраняет сильное, насильственное значение глагола и выразительность метафоры тела.
- source_word: τὰ μέλη
  choice: члены
  rationale: Русское «члены» естественно обозначает части тела и одновременно сохраняет церковную метафору взаимной принадлежности.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Передаёт титульное значение Χριστός и следует принятой для проекта терминологии.
- source_word: στασιάζομεν
  choice: восстаём
  rationale: Передаёт идею мятежа и внутреннего раздора, а не просто разногласия.
- source_word: ἀπόνοιαν
  choice: безумия
  rationale: Естественно выражает крайнюю утрату здравого смысла, подразумеваемую контекстом.
- source_word: μέλη ἐσμὲν ἀλλήλων
  choice: мы — члены друг другу
  rationale: Сохраняет взаимность ἀλλήλων и узнаваемую апостольскую формулу, не сводя её лишь к принадлежности одному коллективу.
theological_decisions:
- issue: Образ тела Мессии и взаимного членства
  choice: 'Сохранена буквальная телесная метафора: «члены Мессии», «собственное тело», «члены друг другу».'
  alternative: 'Передать толковательно: «части общины Мессии» или «принадлежим друг другу».'
  rationale: Греческий текст намеренно соединяет физическую образность тела с общинным единством; разъясняющий перевод ослабил бы риторическую силу и богословское напряжение.
- issue: Титул Χριστός
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» прозрачно передаёт титульное содержание греческого слова и соответствует терминологической политике предоставленного консультационного слоя.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной риторикой. Длинный вопрос сохранён как единое нарастающее обличение; заключительный призыв отделён абзацем. Архаизмы и конфессионально окрашенные разъяснения не вводились.
