  text: Why are there quarrels and anger and divisions and schisms and even war among you?
translation:
  language: ru
  text: Почему среди вас распри, гнев, разделения, расколы и даже война?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρεις
  choice: распри
  rationale: Передаёт множественные столкновения и ссоры, сохраняя серьёзный тон греческого слова.
- source_word: θυμοὶ
  choice: гнев
  rationale: Прямой и естественный русский эквивалент; собирательное единственное число здесь звучит лучше буквального «гневы» и не добавляет значения «вспышки».
- source_word: διχοστασίαι
  choice: разделения
  rationale: Сохраняет значение внутреннего разобщения и позволяет отличить это слово от следующего σχίσματα.
- source_word: σχίσματα
  choice: расколы
  rationale: Точно передаёт более резкое нарушение единства и сохраняет нарастание перечисления.
- source_word: πόλεμός τε
  choice: и даже война
  rationale: «Война» прямо передаёт πόλεμος, а «даже» естественно подчёркивает кульминацию ряда, выраженную заключительным τε и порядком слов.
theological_decisions:
- issue: Различение διχοστασίαι и σχίσματα
  choice: «разделения» и «расколы» сохранены как два отдельных понятия
  alternative: Объединить их или передать близкими словами «раздоры» и «расколы»
  rationale: Греческий текст намеренно перечисляет оба термина; перевод не должен сглаживать возможное различие между разобщением и более глубоким расколом.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос сохраняет торжественную строгость оригинала и последовательное нарастание от распрей к войне.
