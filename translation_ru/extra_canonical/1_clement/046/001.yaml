lexical_decisions:
- source_word: Τοιούτοις ... ὑποδείγμασιν
  choice: таких примеров
  rationale: Передаёт указание на ранее приведённые образцы для подражания; «примеры» естественно и ясно звучит по-русски.
- source_word: κολληθῆναι
  choice: держаться
  rationale: Глагол буквально выражает тесное присоединение, «прилепиться»; в данном контексте «держаться» сохраняет смысл стойкой приверженности без неестественной буквальности.
- source_word: καὶ ἡμᾶς δεῖ
  choice: и нам следует
  rationale: Сохраняет включение автора и адресатов, а также значение необходимости, выраженное δεῖ.
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое и традиционное обращение, соответствующее греческому мужскому множественному числу и принятому раннехристианскому употреблению.
