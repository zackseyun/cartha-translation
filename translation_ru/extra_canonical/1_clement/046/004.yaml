lexical_decisions:
- source_word: κολληθῶμεν
  choice: будем держаться
  rationale: Передаёт призыв тесно примкнуть к людям и сохранять с ними единство, оставаясь естественным для современного русского языка.
- source_word: ἀθῴοις
  choice: неповинных
  rationale: Сохраняет значение невиновности, непричастности к злу и хорошо сочетается с «праведных».
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: избранники Бога
  rationale: Точно передаёт обозначение людей, избранных Богом, без добавления конфессионально обусловленных оттенков.
theological_decisions:
- issue: Связь второй части высказывания через δέ
  choice: 'Пояснительное двоеточие: «они — избранники Бога»'
  alternative: «а они — избранники Бога» или «ведь они — избранники Бога»
  rationale: В данном контексте δέ вводит поясняющее отождествление неповинных и праведных с Божьими избранниками; двоеточие сохраняет эту связь, не усиливая её до явного противопоставления или причинного утверждения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, возвышенная, но понятная. Повелительное увещевание и отождествляющая структура греческого текста сохранены.
