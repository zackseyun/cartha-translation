source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: ru
  text: Ведь мы подробно рассмотрели всё, что касается веры, покаяния, искренней любви, самообладания, здравомыслия и стойкости. Мы напоминали вам, что вы должны благочестиво угождать всемогущему Богу, живя в праведности, истине и долготерпении, пребывая в единомыслии, не помня зла, в любви и мире, с усердной мягкостью. Так и наши отцы, о которых говорилось прежде, были угодны Ему, проявляя смирение в отношениях с Отцом, Богом и Создателем, а также со всеми людьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνησίας ἀγάπης
  choice: искренней любви
  rationale: Передаёт идею подлинной, нелицемерной любви естественным современным русским выражением.
- source_word: ἐγκρατείας
  choice: самообладания
  rationale: Обозначает владение собой; в данном перечне это яснее и шире, чем более узкое «воздержание».
- source_word: σωφροσύνης
  choice: здравомыслия
  rationale: Сохраняет смысл рассудительности и внутренней уравновешенности, не сводя слово только к целомудрию.
- source_word: ὑπομονῆς
  choice: стойкости
  rationale: Подчёркивает терпеливую выдержку в испытаниях.
- source_word: πάντα τόπον ἐψηλαφήσαμεν
  choice: мы подробно рассмотрели всё, что касается
  rationale: Греческая идиома буквально говорит о том, что авторы «коснулись каждого места/вопроса»; выбран естественный русский эквивалент без утверждения об исчерпывающем трактате.
- source_word: ὁσίως εὐαρεστεῖν
  choice: благочестиво угождать
  rationale: Наречие ὁσίως отнесено к εὐαρεστεῖν и сохранено отдельно от последующего ряда с ἐν.
- source_word: ἀμνησικάκως
  choice: не помня зла
  rationale: Точно и идиоматично выражает отсутствие злопамятства и обиды.
- source_word: μετὰ ἐκτενοῦς ἐπιεικείας
  choice: с искренней кротостью
  rationale: ἐπιείκεια здесь передаёт мягкость и незлобивость, а ἐκτενής — их искренний, усердный характер.
theological_decisions:
- issue: Соотношение титулов πατέρα καὶ θεὸν καὶ κτίστην
  choice: Отцом, Богом и Создателем
  alternative: Отцом и Богом, и Создателем
  rationale: Три наименования естественно относятся к одному Лицу; перевод не добавляет конфессионального уточнения сверх греческого текста.
- issue: Смысл ταπεινοφρονοῦντες τὰ πρὸς
  choice: проявляя смирение перед
  alternative: смиренно исполняя обязанности по отношению к
  rationale: Конструкция с субстантивированным τὰ πρὸς допускает более буквальное «в том, что касается отношений с», но выбранная формулировка ясно передаёт смиренное отношение как к Богу, так и ко всем людям, не перегружая русский текст.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Длинное греческое предложение разделено на три русских для ясности; повтор союзов в перечнях частично сохранён. Прописное «Ему» употреблено по принятой русской благоговейной норме, без внесения дополнительного толкования.
