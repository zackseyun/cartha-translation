revisions:
- from: О том, что относится к нашей религии и что особенно полезно для добродетельной жизни тем, кто желает устроять её благочестиво и праведно, мы написали вам достаточно, братья.
  to: О том, что относится к нашей религии и что наиболее полезно для добродетельной жизни тем, кто желает жить благочестиво и праведно, мы написали вам достаточно, братья.
  rationale: Исправлена только неудачная русская передача διευθύνειν. «Желает жить благочестиво и праведно» естественно выражает подразумеваемое устроение своего жизненного пути, не добавляя нового объекта или богословского толкования. «Наиболее» точнее отражает греческий превосходный степень, чем «особенно».
