  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: ru
  text: О том, что относится к нашей религии и что наиболее полезно для добродетельной жизни тем, кто желает жить благочестиво и праведно, мы написали вам достаточно, братья.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκείᾳ
  choice: религии
  rationale: Передаёт широкий смысл религиозной веры и практики, не сужая его до одного лишь богослужения или благочестия.
- source_word: ὠφελιμωτάτων
  choice: особенно полезно
  rationale: Естественно передаёт превосходную степень и практическую пользу для добродетельной жизни.
- source_word: ἐνάρετον βίον
  choice: добродетельной жизни
  rationale: Сохраняет этический смысл ἐνάρετος и обычное значение βίος как образа и течения жизни.
- source_word: διευθύνειν
  choice: устроять её
  rationale: Передаёт идею направлять и упорядочивать жизнь; местоимение «её» восполняет подразумеваемый объект из ближайшего выражения «жизнь».
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Естественное русское обращение; буквальное «мужи братья» в современном русском звучало бы архаично и неестественно.
