    rationale: Инфинитив διευθύνειν означает направлять, управлять, устраивать; его объект в греческом подразумевается. Русское «устроять» архаично, а местоимение «её» создаёт ненужную формальную отсылку к «жизни». Более естественная передача сохраняет смысл благочестивого и праведного устроения жизни.
  revised_text: О том, что относится к нашей религии и что наиболее полезно для добродетельной жизни тем, кто желает жить благочестиво и праведно, мы написали вам достаточно, братья.
