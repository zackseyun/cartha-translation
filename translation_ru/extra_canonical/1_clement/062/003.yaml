source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: ru
  text: И тем более мы напомнили вам об этом, поскольку ясно знали, что пишем верным и весьма почтенным мужам, глубоко сведущим в изречениях Божьего наставления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ὑπενήγκαμεν (OCR; по исправлению: ὑπεμνήσαμεν)'
  choice: мы напомнили вам
  rationale: Учитывается засвидетельствованное исправление OCR к ὑπεμνήσαμεν («напомнили»), которое также сохраняет смысловую связь с «напоминая» в предыдущем стихе.
- source_word: ἐλλογιμωτάτοις
  choice: весьма почтенным
  rationale: Передаёт превосходную степень и значение высокой общественной оценки без архаического оттенка.
- source_word: ἐγκεχυφόσιν εἰς
  choice: глубоко усвоившим
  rationale: Контекстуально выражает глубокое проникновение в содержание наставления; формальный образ греческого выражения по-русски был бы неестественен.
- source_word: τὰ λόγια
  choice: слова
  rationale: Сохраняет множественное число и религиозный вес выражения, не сужая его до отдельных заповедей или изречений.
- source_word: τῆς παιδείας τοῦ θεοῦ
  choice: Божьего наставления
  rationale: παιδεία здесь обозначает формирующее обучение и воспитательное наставление; «наставление» естественно и не сводит смысл к наказанию.
theological_decisions:
- issue: Характер Божьей παιδεία
  choice: Божье наставление
  alternative: Божье воспитание / вразумление
  rationale: Выбрана формулировка, сохраняющая широкий обучающий и формирующий смысл без одностороннего акцента на наказании.
translation_notes:
  register: Современный литературный русский язык с уважительным, церковно-достоинным тоном; синтаксис сделан естественным для обычного читателя без устранения образной насыщенности оригинала.
