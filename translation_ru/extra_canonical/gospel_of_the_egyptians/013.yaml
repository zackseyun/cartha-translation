translation:
  language: ru
  text: 'ИĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    о Йессеус Мазареус Йесседекеус,


    о живая вода,


    о дитя дитяти,


    о славное имя,


    ALĒTHŌS ALĒTHŌS,


    вечносущий,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    о Сущий, созерцающий эоны,


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    вечно вечный,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ внутри сердца, Сущий,


    UAEI EISAEI EIOEI EIOSEI!


    Это великое имя Твоё обитает во мне,


    о саморождённый Совершенный.


    Ты, пребывающий не вне меня,


    я созерцаю Тебя,


    о Ты, невидимый для всех,


    ибо кто способен постичь Тебя на ином языке?


    […][a] Поскольку я познал Тебя,


    теперь я слился с неизменным.


    Я облёкся в доспехи света.


    Я стал Светом,


    потому что Мать пребывала в Месте ради превосходной красоты благодати.


    И потому я простёр свои сложенные руки.


    Я был сформирован внутри круга богатства света,


    в моём лоне,


    которое порождает образ множества рождённых от света


    там, куда не достигает никакое обвинение.


    ALĒTHŌS,


    я возвещу славу Твою,


    потому что постиг Тебя,


    SOU IĒS IDE AEIŌ AEIE OIS,


    о Эон, Эон, о Бог Безмолвия!


    Я воздаю Тебе всю полноту чести.


    Ты — место моего покоя, о Сын,


    ĒS ĒS O E,


    безóбразный среди безóбразных,


    воздвигающий Человека, внутри которого Ты очистишь меня,


    чтобы я вошёл в Твою жизнь,


    согласно Твоему нерушимому имени.


    Поэтому благоухание жизни обитает во мне.


    Я смешал его с водой по образцу всех архонтов,


    чтобы жить с Тобой в благополучии святых,


    Ты, существующий вовеки, […]


    ALĒTHŌS ALĒTHŌS.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Многоточие в квадратных скобках передаёт лакуну или иной сигнал повреждения текста в используемом свидетельстве. Аналогичный сигнал находится ближе к концу гимна.
    reason: Сохраняет рукописную неопределённость, не выдавая отсутствующие слова за восстановленный текст.
lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: Формулы оставлены без перевода и с сохранением различия форм, поскольку в гимне они функционируют как сакральные возгласы, а проверка коптского текста ещё не проведена.
- source_word: the eternal Being / Being
  choice: вечносущий / Сущий
  rationale: Передаёт онтологическое значение и молитвенное обращение, не сводя выражение к отвлечённому «существу».
- source_word: aeons / Aeon
  choice: эоны / Эон
  rationale: Сохранён технический космологический термин, необходимый для понятийного мира текста.
- source_word: self-generated Perfect One
  choice: саморождённый Совершенный
  rationale: Сохранены и идея происхождения из самого себя, и титульный характер определения.
- source_word: merged with the unchangeable one
  choice: слился с неизменным
  rationale: Близко передаёт сильное утверждение об объединении, не ослабляя его до общения или согласия.
- source_word: armor of light
  choice: доспехи света
  rationale: Естественное современное выражение, сохраняющее образ защитного вооружения.
- source_word: formless one among formless ones
  choice: безóбразный среди безóбразных
  rationale: Слово означает лишённого формы или образа; ударение графически отмечено, чтобы исключить чтение «безобразный» в современном оценочном смысле.
- source_word: archons
  choice: архонты
  rationale: Сохранён традиционный технический термин, а не заменён толкованием вроде «властители».
- source_word: incense of life
  choice: благоухание жизни
  rationale: Русское «фимиам жизни» могло бы неоправданно сузить образ до конкретного культового вещества; «благоухание» сохраняет ритуальную образность и допускает смешение с водой.
theological_decisions:
- issue: Отношение говорящего к неизменному
  choice: «слился с неизменным»
  alternative: «соединился с неизменным»
  rationale: Выбран более сильный эквивалент supplied witness «merged», чтобы не ослаблять мистическое тождество, хотя формула остаётся богословски напряжённой.
- issue: Титул «Бог Безмолвия»
  choice: с прописных букв как обращение-титул
  alternative: «бог безмолвия»
  rationale: Контекст прямого гимнического обращения поддерживает титульное оформление, не требуя отождествления с каким-либо позднейшим доктринальным понятием.
- issue: «Мать», «Место», «Свет», «Сын», «Человек»
  choice: прописные буквы для явно персонифицированных или титульных обозначений
  alternative: строчные буквы
  rationale: Гимнический контекст указывает на космологические фигуры и реалии; прописные буквы показывают титульность, не разъясняя её конфессионально.
- issue: Неясная связь в строках о воздвижении Человека и очищении
  choice: 'сохранена синтаксическая связь: «воздвигающий Человека, внутри которого Ты очистишь меня»'
  alternative: перестроить фразу и истолковать Человека как внутреннего человека говорящего
  rationale: Свидетельство двусмысленно и грамматически трудно; перевод не навязывает частное антропологическое толкование.
- issue: Формула смешения благоухания с водой по образцу архонтов
  choice: передана буквально без догматического пояснения
  alternative: истолковать как конкретный этап крещения или помазания
  rationale: Заглавие и контекст допускают ритуальное прочтение, но само свидетельство не позволяет уверенно определить обрядовую последовательность.
translation_notes:
  register: 'Современный литературный русский язык с торжественным гимническим ритмом. Вокалические последовательности, латинская транслитерация сакральных формул, фигурные скобки и различие ALĒTHES/ALĒTHŌS сохранены. Номер страницы [15] исключён как редакционный артефакт. Черновик предварительный: предоставленный материал является англоязычным публичным свидетельством, а прямая сверка с коптским текстом Nag Hammadi Codices III,2 и IV,2 ещё ожидается.'
