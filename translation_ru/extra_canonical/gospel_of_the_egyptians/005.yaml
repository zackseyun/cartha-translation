translation:
  language: ru
  text: '[…] […явилось из] того [места] облако великого Света — живая сила, мать святых, нерушимых, великая сила Миротоэ. И она родила того, чьё имя я называю, произнося трижды:[a]


    ИЕН

    ИЕН

    ЕА

    ЕА

    ЕА,[b]


    ибо он и есть Адамас, сияющий свет, происходящий от Человека, Первоначального Человека, через которого и ради которого всё возникло и без которого ничто не возникло. Непознаваемый, непостижимый Отец вышел и сошёл свыше, чтобы упразднить недостаток.


    Тогда великий Логос, саморождённый Бог, и нерушимый Человек, Адамас, соединились друг с другом. Возник Логос Человека, сам же Человек возник через изречённое слово.[c] Он вознёс хвалу:


    великому незримому, непостижимому девственному Духу,


    и мужской деве,


    и трижды-мужскому дитяти,


    […] и мужской [деве] Юэль,


    и Эсефеху, хранителю сияния,


    дитяти дитяти,


    и венцу его славы,


    великому эону Доксомедону,


    и престолам внутри него,


    и силам вокруг него,


    славам,


    и нерушимостям,


    и всей их Полноте, о которой я упоминал прежде,


    и земле воздуха, приемлющей Бога,[d]


    где святые люди великого Света обретают образ,


    люди Отца безмолвного живого Безмолвия,


    Отцу и всей их Полноте, как я упоминал прежде.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В свидетельстве сказано «произнося трижды», однако далее записаны пять строк: «ИЕН» два раза и «ЕА» три раза. Несогласованность не устранена.'
    reason: Сохраняет числовую трудность текста и предупреждает читателя о невозможности уверенной гармонизации.
  - marker: b
    text: «ИЕН» и «ЕА» — передача священных звуковых формул; их значение неясно, поэтому они не переводятся.
    reason: Объясняет сохранение вокабул без спекулятивного истолкования.
  - marker: c
    text: 'Фраза связывает «Логос» со словом или речением. Возможен и более буквальный перевод: «Человек возник посредством акта речи».'
    reason: Отмечает игру терминов и сохраняет неоднозначность формулировки.
  - marker: d
    text: 'Буквально по имеющемуся английскому свидетельству: «земля воздуха». Точный смысл выражения требует проверки по коптскому тексту.'
    reason: Указывает на трудное чтение и ограниченность предоставленной источниковой базы.
lexical_decisions:
- source_word: Logos
  choice: Логос
  rationale: Сохранён технический богословско-космологический термин и его связь со словом/речением в следующей фразе.
- source_word: self-generated
  choice: саморождённый
  rationale: Передаёт самостоятельное происхождение существа, не уточняя механизм и не вводя конфессиональной терминологии.
- source_word: indestructible / indestructibilities
  choice: нерушимый / нерушимости
  rationale: Сохраняет повторяющийся термин и необычное абстрактное множественное число, вероятно обозначающее космологические сущности или свойства.
- source_word: Fullness
  choice: Полнота
  rationale: Передаёт техническое понятие полноты божественного мира; прописная буква указывает на терминологическое употребление.
- source_word: deficiency
  choice: недостаток
  rationale: Сохраняет абстрактность и возможный космологический смысл, не подменяя его более интерпретирующими словами вроде «зло» или «падение».
- source_word: male virgin
  choice: мужская дева
  rationale: Намеренно сохранено парадоксальное сочетание исходного свидетельства без гармонизации.
- source_word: triple-male child
  choice: трижды-мужское дитя
  rationale: Сохранена необычная составная характеристика; более свободная интерпретация могла бы устранить заложенную в ней неясность.
- source_word: earth of the air
  choice: земля воздуха
  rationale: Буквально сохранено трудное космологическое выражение; его смысл нельзя надёжно уточнить без проверки коптского текста.
theological_decisions:
- issue: Связь Адамаса с Первоначальным Человеком
  choice: «происходящий от Человека, Первоначального Человека»
  alternative: «явившийся из Человека — Прародителя человечества»
  rationale: Выбранный вариант не отождествляет космологического Человека с человечеством и сохраняет повтор титула.
- issue: Формула «через которого и ради которого всё возникло»
  choice: Сохранить оба отношения — посредничество и целевую направленность
  alternative: 'Свести формулу к одному отношению: «которым всё сотворено»'
  rationale: Так сохраняется богословское напряжение исходного свидетельства и не вводится отсутствующий глагол «сотворить».
- issue: Соединение Логоса и Адамаса
  choice: «соединились друг с другом»
  alternative: «слились воедино»
  rationale: «Соединились» сохраняет возможность тесного единения, но не навязывает полного исчезновения различия между фигурами.
- issue: Отец «вышел и сошёл свыше»
  choice: Сохранить оба глагола движения
  alternative: «Отец явился свыше»
  rationale: Не сглаживается последовательность эманации/нисхождения и не решается её точный метафизический смысл.
- issue: Безмолвие как персонифицированная реальность
  choice: «Отец безмолвного живого Безмолвия»
  alternative: «Отец живой тишины, пребывающей в молчании»
  rationale: Повтор и прописная буква сохраняют вероятный титульный или ипостасный характер выражения.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным ритмом. Космологические титулы и парадоксальные сочетания сохранены без конфессионального истолкования. Повреждения рукописи обозначены квадратными скобками и многоточием. Проект предварительный: предоставленный материал основан на англоязычном публичном свидетельстве, а непосредственная сверка с коптским оригиналом ещё не выполнена.'
