lexical_decisions:
- source_word: Silence
  choice: Безмолвие
  rationale: Сохраняет персонифицированный метафизический термин и звучит достоиннее и точнее, чем бытовое «молчание».
- source_word: indestructible / indestructibilities
  choice: нерушимый / нерушимости
  rationale: Передаёт невозможность разрушения и сохраняет необычное абстрактное множественное число текста.
- source_word: Ogdoad
  choice: Огдоада
  rationale: Устоявшийся русскоязычный термин для восьмерицы в гностических текстах; не заменён толкованием.
- source_word: Logos
  choice: Логос
  rationale: Транслитерация сохраняет широкий смысловой диапазон термина и не сводит его только к «слову» или «разуму».
- source_word: Precognition
  choice: Предведение
  rationale: Книжный, но понятный богословско-философский эквивалент знания наперёд.
- source_word: lap
  choice: лоно
  rationale: Сохраняет образ источника или внутреннего порождения, не уточняя анатомию и не снимая символическую напряжённость.
- source_word: speech
  choice: речь
  rationale: Отличает завершённое речевое выражение от перечисленных «голосов».
theological_decisions:
- issue: Соотношение Отца, Матери и Сына с тремя силами
  choice: Сохранена формула «то есть от Отца, Матери и Сына» без догматического пояснения.
  alternative: Истолковать три силы как тождественные Отцу, Матери и Сыну либо как исходящие от них отдельные сущности.
  rationale: Синтаксис свидетельства допускает напряжение между тождеством и происхождением; перевод не должен разрешать его конфессионально.
- issue: Порядок четвёртого, пятой и шестого
  choice: Последовательность сохранена буквально, несмотря на неясность предшествующего счёта.
  alternative: Перестроить или пояснить космологическую нумерацию.
  rationale: Текст фрагментарен, а редакционное исправление создало бы неподтверждённую систему.
- issue: «Андрогинный Отец» и «трижды-мужское дитя»
  choice: Образы переданы прямо и без смягчения.
  alternative: Заменить истолковательными формулами о духовной полноте или сверхполовой природе.
  rationale: Необычные гендерные обозначения принадлежат собственной теологии памятника и должны сохраняться.
- issue: Providence
  choice: Провидение с прописной буквы.
  alternative: «предвидение» или «промысл».
  rationale: Контекст допускает персонифицированную силу; «Промысл» мог бы привнести позднейшую конфессиональную окраску.
- issue: Неясный субъект в заключительных действиях
  choice: Мужской субъект «Он» сохранён.
  alternative: Определить его как Сына, Отца или третью Огдоаду.
  rationale: Предоставленное свидетельство не позволяет надёжно разрешить референцию.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным философско-религиозным регистром. Персонифицированные космологические наименования даны с прописной буквы. Списочная композиция и сигналы реконструкции сохранены; голые номера страниц рукописи опущены.
