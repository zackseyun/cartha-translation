translation:
  language: ru
  text: 'От Него, то есть от Отца, Матери и Сына, произошли три силы — от живого Безмолвия, которое произошло от нерушимого Отца. Они произошли [из] Безмолвия неведомого Отца, [и] оттуда [про]изошёл Домедон Доксомедон, [эон] эонов, и [Свет] их отдельных сил; [и] таким образом Сын [про]изошёл четвёртым, Мать — [пятой, Отец] — шестым.


    Он был [незамечен] и ещё не возвещён. [Он — тот], кто не обозначен среди всех [сил], слав и [нерушимостей].


    Оттуда [про]изошли три силы, […] три Огдоады, которые [Отец про]изводит в Безмолвии вместе с Провидением из Своего лона, а именно: Отец, Мать и Сын.


    <Первая> Огдоада, ради которой произошло трижды-мужское дитя:


    Мысль,


    и Логос,


    и Нерушимость,


    и Вечная [Жизнь],


    Воля,


    Ум,


    Предведение,


    андрогинный Отец.


    Вторая сила-Огдоада:


    Мать,


    дева Барбелон,


    Эпититиох[… ]аи,


    Меменеаимен, [которая] надзирает за небом,


    Карб[…],


    сила, не поддающаяся истолкованию,


    неизречённая Мать.


    [Она] самопроисшедшая […]. Она выступила вперёд. [Она] согласилась с Отцом [безмолвного] Безмолвия.


    Третья сила-Огдоада:


    Сын [безмолвного Безмолвия],


    и венец безмолвного Безмолвия,


    [и] слава Отца,


    и сила […] [Матери].


    [Он] производит из лона семь сил великого Света — семь голосов, а их завершение есть речь.


    Таковы три [силы], три Огдоады, которые Отец [про]извёл из Своего лона [посредством] Своего Провидения. Он произвёл их там.[a]'
