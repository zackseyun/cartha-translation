translation:
  language: ru
  text: 'Домедон Доксомедон выступил в шествии — эон эонов; и престол внутри него, и силы, [окружающие] его, славы и [нетленности. Отец] великого Света, [про]исшедший из Безмолвия, — он и есть [великий] эон Доксомедон, в котором покоится [трижды-]мужское дитя. И престол его [славы] был воздвигнут [внутри него — тот], на котором, на скрижали, [начертано] его неоткрываемое имя: […] единый, сущий Речью, [Отец Света] Всего, [про]исшедший из Безмолвия и покоящийся внутри Безмолвия; его […] имя — в [невидимом] знаке.


    [Сокрытая], [невидимая] тайна выступила в шествии:


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    — так три силы вознесли хвалу [великому], невидимому, неименуемому, девственному, неизреченному Духу и [его] мужской деве.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному англоязычному свидетелю; непосредственная сверка с коптским текстом ещё требуется. Квадратные скобки внутри отрывка обозначают повреждения и редакционные восстановления в свидетеле. Ряды гласных сохранены в переданной форме, включая различие E/Ē и O/Ō.'
    reason: Источник прямо отмечен как ожидающий проверки по коптскому оригиналу; читателю также необходимо отличать текстологические скобки от обычного текста и видеть сохранённые графические различия в вокализации.
lexical_decisions:
- source_word: aeon
  choice: эон
  rationale: Сохранён технический космологический термин, не сведённый ни к «веку», ни к «вечности», поскольку в отрывке он обозначает также персонифицированную или пространственную реальность.
- source_word: came in procession
  choice: выступил в шествии
  rationale: Передаёт повторяющийся образ упорядоченного торжественного выхода, не подменяя его более истолковательным «явился» или «произошёл».
- source_word: Silence
  choice: Безмолвие
  rationale: Заглавная буква сохраняет возможность понимать Безмолвие как именованную сверхмирную реальность, а не только как состояние тишины.
- source_word: indestructibilities
  choice: нетленности
  rationale: Сохранена необычная множественная абстрактная форма, которая в данном перечне может обозначать силы или сущности.
- source_word: triple-male child
  choice: '[трижды-]мужское дитя'
  rationale: Буквально сохранено необычное определение и скобки реконструкции; формулировка не нормализована в более привычный богословский титул.
- source_word: undisclosable name
  choice: неоткрываемое имя
  rationale: Передана мысль об имени, которое нельзя раскрыть или обнародовать, без смешения с последующим определением Духа как неименуемого.
- source_word: male virgin
  choice: мужская дева
  rationale: Сохранён намеренный парадокс сочетания мужского и девственного, без сглаживания в «мужественную деву».
theological_decisions:
- issue: Соотношение Отца великого Света и эона Доксомедона
  choice: Сохранено отождествляющее «он и есть», соответствующее синтаксису свидетеля.
  alternative: Понять Отца и эон как две отдельные фигуры или сделать эон местом пребывания Отца.
  rationale: Текст допускает сложное наложение лица и эона; перевод не перестраивает его в систематическую иерархию.
- issue: «Единый, сущий Речью» в повреждённой фразе
  choice: Фрагментарный синтаксис сохранён рядом с лакуной.
  alternative: Восстановить связное утверждение вроде «одно изречение» или отождествить фигуру с Логосом.
  rationale: Предоставленный свидетель не даёт достаточных оснований для уверенного восстановления или христологического отождествления.
- issue: Пол Духа в заключительной формуле
  choice: Русская грамматика передаёт Spirit как «Духу» в мужском роде, но местоимение при «мужской деве» заключено в восстановительные скобки.
  alternative: Эксплицировать отдельную мужскую ипостась или изменить связь местоимения.
  rationale: Не следует выводить развитую гендерную или ипостасную схему из повреждённого текста.
translation_notes:
  register: Современный литературный русский с приподнятым, но понятным сакрально-космологическим регистром. Технические гностические обозначения и намеренно парадоксальные выражения сохранены. Голые номера страниц рукописи удалены; лакуны, восстановления и многоточие оставлены видимыми.
