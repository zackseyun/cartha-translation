  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/009.yaml
  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: ru
  text: 'Тогда великий Сиф, сын нерушимого Человека Адамаса, вознёс хвалу:


    великому невидимому, безымянному, неизреченному, девственному Духу,

    то есть <мужественной деве>[a],

    <и трижды мужественному младенцу>[b],

    <и мужественной> деве Иуэль,

    и Эсефеху, хранителю сияния,

    и венцу его славы, младенцу младенца,

    [лакуна][c] и великим зонам Доксомедона,

    и Полноте, как я упоминал прежде.


    И он просил за своё семя.


    Тогда оттуда явилась великая сила великого света — Плесифея:


    мать ангелов,

    мать светов,

    славная мать,

    четырёхгрудая дева,

    несущая плод из Гоморры как источник — и из Содома,

    сама являющаяся плодом источника Гоморры, пребывающим внутри неё.[d]


    Она явилась через великого Сифа.


    Тогда великий Сиф возрадовался дару, данному ему нерушимым младенцем. Он извлёк своё семя из четырёхгрудой девы и поместил его вместе с ним[e] в четвёртом зоне, в третьем великом свете — Давифе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Угловые скобки передают восстановленный или текстуально неуверенный фрагмент в используемом свидетельстве. Выражение можно также передать буквально как «мужская дева».
    reason: Сохранить текстологическую отметку и гендерный парадокс без чрезмерного истолкования.
  - marker: b
    text: 'Буквально: «тройной мужчина-младенец» или «трижды мужской младенец»; точный смысл титула неясен.'
    reason: Русская формулировка требует выбора, тогда как источник сохраняет необычный составной титул.
  - marker: c
    text: В этом месте рукописный текст имеет пропуск или неразборчивый участок.
    reason: Передать явную лакуну, обозначенную в исходном свидетельстве пустыми квадратными скобками.
  - marker: d
    text: Синтаксис описания плода, источника, Гоморры и Содома неясен; перевод следует порядку доступного свидетельства и не устраняет трудность.
    reason: Предупредить о неустойчивом смысле без спекулятивного исправления.
  - marker: e
    text: 'Неясно, к кому относится «с ним»: к нерушимому младенцу, к Сифу или к иному названному участнику.'
    reason: Сохранить местоименную неоднозначность доступного свидетельства.
lexical_decisions:
- source_word: indestructible
  choice: нерушимый
  rationale: Передаёт неуничтожимость и сохраняет возвышенный мифологический регистр; «неразрушимый» звучит более предметно.
- source_word: Man, Adamas
  choice: Человек Адамас
  rationale: Заглавная буква указывает на именованный небесный образ, а форма «Адамас» сохраняет особое имя без отождествления с библейским Адамом.
- source_word: Fullness
  choice: Полнота
  rationale: Буквальная и традиционно понятная передача технического космологического понятия без подмены его словом «плерома».
- source_word: aeon
  choice: зон
  rationale: Выбрана форма «зон» для обозначения сверхмирной области/вечности в гностическом тексте; она не смешивает понятие с русским «эон» как длительным периодом времени.
- source_word: seed
  choice: семя
  rationale: 'Сохраняет намеренную многозначность: потомство, духовный род и порождающее семя.'
- source_word: came/proceeded forth
  choice: явилась
  rationale: Естественно передаёт выход и проявление Плесифеи, не вводя более специальной доктрины эманации.
- source_word: light(s)
  choice: свет / светы
  rationale: Во множественном числе сохранено субстантивированное «светы», поскольку это, вероятно, именованные небесные сущности или области.
- source_word: Davithe
  choice: Давифа
  rationale: Транслитерация имени; падежная форма после приложения согласована с русским синтаксисом.
theological_decisions:
- issue: Гендерно-парадоксальные титулы
  choice: Сохранить выражения «мужественная дева» и «трижды мужественный младенец» в угловых скобках
  alternative: Сгладить как «мужедева» или истолковать как андрогинные существа
  rationale: Свидетель содержит текстуально отмеченные реконструкции и намеренное сочетание мужского и девственного; перевод не должен устранять напряжение или навязывать учение об андрогинности.
- issue: Значение «семени» Сифа
  choice: Оставить «семя» без поясняющего определения
  alternative: Перевести как «потомство», «род» либо «духовное семя»
  rationale: Контекст допускает одновременно коллективное и порождающее значение; конкретизация сняла бы подлинную неоднозначность.
- issue: Образ Содома и Гоморры
  choice: Передать буквально и не морализировать
  alternative: Объяснить символически или исправить предполагаемую порчу текста
  rationale: Необычная положительная образность принадлежит данному космологическому тексту и не должна согласовываться с иной библейской традицией.
- issue: Местоимение в «deposited it with him»
  choice: Сохранить двусмысленность выражением «вместе с ним»
  alternative: Уточнить референта как нерушимого младенца или самого Сифа
  rationale: Английский свидетель не позволяет надёжно определить референта; прямой коптский разбор пока отсутствует.
translation_notes:
  register: Современный литературный русский язык с торжественным, литанийным ритмом и сохранением параллельных строк. Имена транслитерированы как Адамас, Иуэль, Эсефех, Доксомедон, Плесифея и Давифа. Черновик основан на предоставленном общедоступном английском свидетельстве; прямая сверка с коптским текстом ещё требуется.
