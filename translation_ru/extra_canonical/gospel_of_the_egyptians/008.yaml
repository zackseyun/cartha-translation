    Он воздвиг бесчисленные мириады славных престолов внутри четырёх эонов, окружавших их, бесчисленные мириады сил и слав [a], и нетленностей. И они выступили таким образом, а нетленная духовная церковь возрастала внутри четырёх светил великого живого Саморождённого, Бога истины, который восхвалял, воспевал и превозносил в согласии, единым голосом, неумолкающими устами:



