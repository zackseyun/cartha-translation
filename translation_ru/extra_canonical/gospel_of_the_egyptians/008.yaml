review_pass:
  verdict: revise
  source_fidelity: В черновике в целом сохранены ключевые космологические термины и лакуна. Однако относительное «who» в предоставленном английском свидетельстве непосредственно относится к «the God of truth»; замена этого субъекта на «нетленную духовную церковь» не оправдана свидетельством и снимает существенную синтаксическую связь. Перевод также должен передать множественное «glories» и явление адресатам повеления.
  naturalness: Регистр в основном современный литературный и уместно возвышенный. «Славы» как техническое множественное число необычно, но естественно в данном гностическом контексте и точнее, чем единственное «славы». Формула «явиться достойным» заменена на более ясное «явиться достойным».
  terminology: «Нетленные/нетленности», «эоны», «Полнота», «Саморождённый» и «правители» сохранены. Прописная буква в «Саморождённый» допустима как у титула, поскольку далее он отождествлён с Богом истины. «Мириады» и «пять печатей» переданы без конфессионального переосмысления.
  issues:
