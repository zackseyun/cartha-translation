    issue: Неверно изменён субъект хвалы.
    rationale: 'В английском свидетельстве: «the great living self-generated one, the God of truth, who praised, sang, (and) extolled». Относительное местоимение отсылает к «Богу истины», а не к «церкви». Черновое «Она восхваляла» изменяет прямую синтаксическую связь источника.'
  - severity: medium
    issue: «Glories» передано единственным числом.
    rationale: 'Источник содержит «powers and glories ... and indestructibilities». Следует сохранить перечисление во множественном числе: «сил, слав ... и нетленностей».'
  - severity: low
    issue: Передача явления достойным нуждается в минимальном уточнении.
    rationale: «Явиться достойным» в данном контексте сохраняет значение «manifest themselves to the deserving» и яснее обозначает адресатов явления.
