translation:
  language: ru
  text: 'Тогда всё содрогнулось, и трепет охватил нетленных. Затем три сына сошли свыше к нерождённым и саморождённым и к рождённым в том, что рождено. Величие выступило — всё Величие великого Христа.


    Он воздвиг бесчисленные мириады славных престолов внутри четырёх эонов, окружавших их, бесчисленные мириады сил, славы, [a] и нетленностей. И они выступили таким образом, а нетленная духовная церковь возрастала внутри четырёх светил великого живого Саморождённого, Бога истины. Она восхваляла, воспевала и превозносила в согласии, единым голосом, неумолкающими устами:


    Отца,


    и Мать,


    и Сына,


    и всю их Полноту, как я упоминал прежде.


    Пяти печатям, обладающим мириадами,


    и правителям над эонами,


    и носителям славы предводителей


    было велено явиться достойным.


    Аминь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи в этом месте имеется лакуна; утраченный текст не восстанавливается.
    reason: Предоставленный источник обозначает здесь пробел квадратными скобками.
lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: нетленные / нетленности
  rationale: Сохраняет различие между личными существами и абстрактными сущностями, а также сакральный регистр текста.
- source_word: self-begotten / self-generated one
  choice: саморождённые / Саморождённый
  rationale: Передаёт идею происхождения от самого себя и сохраняет терминологическую связь между формами.
- source_word: aeons
  choice: эоны
  rationale: Устоявшийся русский термин для космологических сущностей или областей в гностических текстах; перевод как «века» исказил бы смысл.
- source_word: Fullness
  choice: Полнота
  rationale: Сохраняет техническое космологическое значение и персонифицированный оттенок исходного выражения.
- source_word: archons
  choice: правители
  rationale: Понятный современному читателю смысловой эквивалент; контекст «над эонами» сохраняет космологический статус.
- source_word: myriads
  choice: мириады
  rationale: Сохраняет возвышенную формулу неисчислимого множества и повтор исходного текста.
- source_word: church
  choice: церковь
  rationale: Передаёт общину духовных существ, не устраняя возможной экклезиологической окраски термина.
theological_decisions:
- issue: Род и референт восхваляющего субъекта после «Бога истины»
  choice: 'Отнести последующие глаголы к «нетленной духовной церкви»: «Она восхваляла…»'
  alternative: 'Отнести их к «Богу истины»: «который восхвалял…»'
  rationale: Перечень адресатов включает Отца, Мать и Сына, поэтому церковь является более связным субъектом хвалы. Английская форма «who» формально двусмысленна; русская синтаксическая перестройка необходима для читаемости.
- issue: Триада «Отец, Мать и Сын»
  choice: Сохранить буквально без догматического переосмысления
  alternative: Согласовать с позднейшей тринитарной терминологией
  rationale: Это собственная богословская формула памятника; её нельзя подменять конфессионально привычной формулой.
- issue: Статус «Саморождённого»
  choice: Оформить с прописной буквы как титул личного космологического существа
  alternative: Передать со строчной буквы как обычное определение
  rationale: Контекст представляет его как определённое живое существо, названное Богом истины.
- issue: «Пять печатей» как получатели повеления
  choice: Сохранить синтаксис, при котором печати, правители и носители славы совместно получают повеление
  alternative: Понимать «пять печатей» как отдельную вставку или объект обладания
  rationale: Такова наиболее прямая структура данного английского свидетеля, хотя повреждение и сложность текста допускают иную пунктуацию.
translation_notes:
  register: 'Современный литературный русский с возвышенным, но понятным ритмом. Технические термины гностической космологии («эоны», «Полнота», «Саморождённый») сохранены. Перевод предварительный: он основан на предоставленном англоязычном публичном свидетельстве; непосредственная сверка с коптским текстом ещё не выполнена.'
