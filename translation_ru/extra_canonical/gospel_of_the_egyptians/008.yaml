source:
  text: 'Then everything shook, and shaking seized the indestructible ones. Then the three male children descended from above to the unborn and self-begotten ones, and to those begotten in that which is begotten. The Greatness proceeded forth, the entire Greatness of the great Christ.


    He erected countless myriads of glorious thrones inside the four aeons surrounding them, countless myriads (of) powers and glories [] and indestructibilities, and they proceeded in this manner, and the indestructible, spiritual church grew inside the four lights of the great living self-generated one, the God of truth, who praised, sang, (and) extolled with one voice in unified agreement, with an unceasing mouth:


    to the Father,

    and the Mother,

    and the Son,

    and their entire Fullness, as I mentioned <previously>.

    The five seals possessing the myriads,

    and the archons over the aeons,

    and the bearers of the glory of the leaders

    were commanded to manifest themselves to the deserving.

    Amen.'
