review_pass:
  verdict: revise
  source_fidelity: Перевод в целом тщательно сохраняет терминологию английского свидетельства, лакуны и редакционные восстановления. Однако «всесожжение» не передаёт нейтральное conflagration («пожар/всеобщее сожжение») и вносит культовый смысл. Кроме того, sessions следует передать как «собрания», а не как «пребывание». Прямая сверка с коптским текстом в представленных материалах недоступна; вывод предварительно основан на данном английском свидетельстве.
  naturalness: Русский текст литературен и в целом хорошо выдерживает возвышенный, перечислительный строй. Исправленная формулировка «всеобщее сожжение» естественнее и точнее в данном контексте, чем «всесожжение».
  terminology: Технические термины «эон», «архонты», «Полнота», «Логос», «Саморождённый» и «нерушимый» сохранены последовательно. Имена и видимые текстологические обозначения переданы бережно. «Собрания» точнее отражает sessions без конфессионального или пространственного переосмысления.
  issues:
  - severity: medium
    issue: «всесожжение» для conflagration
    rationale: «Всесожжение» в современном русском прежде всего означает жертвоприношение/holocaust и потому неоправданно придаёт описываемому событию культовый характер. Здесь безопаснее «всеобщее сожжение».
  - severity: medium
    issue: «пребывание святых…» для sessions of the holy… ones
    rationale: Sessions обозначает собрания или заседания; «пребывание» меняет значение на состояние или местонахождение. «Собрания» сохраняет исходную неопределённость природы этих собраний.
