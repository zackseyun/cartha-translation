translation:
  language: ru
  text: 'Тогда из великих эонов вышли четыреста эфирных ангелов, среди которых были великий Аэросиил и великий Селмехел, чтобы блюсти великий нерушимый род, его плод и великих мужей великого Сифа — от времени и мгновения Истины и Праведности до завершения эона и его архонтов, которых великие судьи приговорили к смерти.


    Тогда великий Сиф был послан четырьмя светами, по воле Саморождённого, […] и всей Полноты, через <дар> и благоволение великого незримого Духа, и пять печатей, и всю Полноту.


    Он прошёл через три пришествия, о которых я упоминал прежде: потоп, всесожжение и осуждение архонтов, сил и властей, — чтобы заблудшая была спасена посредством примирения мира и крещения телом, рождённым Логосом. Это тело великий Сиф тайно приготовил себе через деву, чтобы святые были рождены святым Духом через незримые тайные знаки, через примирение мира с миром, через отречение от мира и от бога тринадцати эонов и через пребывание святых, неизреченных, нерушимых — в лоне и великом свете Отца. Этот свет предсуществовал вместе с его Промыслом и через неё установил священное крещение, превосходящее небо, посредством Нерушимого […], рождённого Логосом, — Живого, Иисуса, того, в кого облёкся великий Сиф. Через него он пригвоздил силы тринадцати эонов и утвердил тех, кого производят и удаляют.[a]


    Он облачил их в доспех познания этой истины, дав им непобедимую силу нерушимости. Им явились:


    великий служитель Иессеус Мазареус Иесседекеус — живая вода;


    и великие предводители: Иаков Великий,


    Феопемпт и Исавел;


    и блюстители источника истины: Михеус, Михар и Мнесиноус;


    и блюститель крещения для живых;


    и очищающие;


    и Сесенгенфарангес;


    и блюстители врат, ведущих к водам: Михеус и Михар;


    и блюстители высокой горы: Селдао и Элаинос;


    и принимающие великий род;


    нерушимые могучие мужи <великого> Сифа;


    служители четырёх светов: великий Гамалиил, великий Гавриил, великий Самбло и великий […] Абрасакс;


    и блюстители восхода солнца: Олсес, Хупнеус и Хеурумаиос;


    и поставленные над входом в покой вечной жизни правители Миксантер и Миханор;


    и стражи избранных душ: Акрамас и Стремпухос;


    и великая сила — Хели Хели Махар Махар Сиф;


    и великий незримый, безымянный, неизреченный девственный Дух, и Молчание;


    и великий свет Армозел —


    место живого Саморождённого, Бога истины, и <того>, кто ему сопутствует, —


    нерушимого Человека Адамаса;


    второй — Оройаил, место великого Сифа;


    и Иисус, обладающий жизнью, который пришёл и распял то, что в Законе;


    третий — Давифе, место сыновей великого Сифа;


    четвёртый — Элелеф, место душ почивших сыновей;


    пятый — Иоил, поставленный над именем того, кому предстоит крестить священным крещением, превосходящим нерушимое небо.


    Отныне же […] через нерушимого Человека Поймаила, и достойных моления, и отречения пяти печатей у источника крещения они узнают принимающих их, когда будут наставлены о них; и те узнают их, а они нисколько не вкусят смерти.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом длинном и местами повреждённом предложении связи между «светом», «Промыслом», «нею» и «Нерушимым» не вполне ясны. Перевод сохраняет эту синтаксическую неоднозначность; […] обозначает лакуну, а угловые скобки — редакционное восстановление.
    reason: Необходимо предупредить читателя о повреждённости и неясных местоименных связях, не исправляя их догадкой.
  - marker: b
    text: Заключительное предложение повреждено и грамматически неустойчиво. Неясно, как именно связаны «достойные моления», «отречения пяти печатей» и «источник крещения».
    reason: Русская версия не должна создавать ложную синтаксическую определённость там, где свидетельство её не даёт.
lexical_decisions:
- source_word: aeon
  choice: эон
  rationale: Сохранён технический космологический термин, а не обобщающее «век» или «мир», чтобы не стирать специфику текста.
- source_word: archons
  choice: архонты
  rationale: Транслитерация сохраняет специальное значение сверхъестественных правителей в данном сочинении.
- source_word: Fullness
  choice: Полнота
  rationale: Передаёт техническое понятие Плеромы понятным русским словом; прописная буква отмечает его персонифицированно-космологическое употребление.
- source_word: self-generated one
  choice: Саморождённый
  rationale: Передаёт идею самостоятельного происхождения и сохраняет титульный характер выражения.
- source_word: parousias
  choice: пришествия
  rationale: Сохраняет событийно-эсхатологический смысл; греческая транслитерация «парусии» была бы менее понятна обычному читателю.
- source_word: Logos
  choice: Логос
  rationale: Технический титул оставлен без сведения к одному толкованию вроде «слово» или «разум».
- source_word: indestructible
  choice: нерушимый
  rationale: Последовательно передаёт ключевую характеристику рода, существ и неба естественным, но возвышенным русским словом.
- source_word: receivers
  choice: принимающие
  rationale: 'Сохранена функциональная неопределённость: контекст не позволяет уверенно заменить термин на «хранители», «сборщики» или иной конкретный чин.'
- source_word: repose
  choice: покой
  rationale: Передаёт состояние эсхатологического упокоения без привнесения поздней конфессиональной терминологии.
theological_decisions:
- issue: Личность «заблудшей»
  choice: заблудшая
  alternative: заблудшая душа / заблудшая Премудрость
  rationale: В свидетельстве референт не назван; добавление «душа» или «Премудрость» разрешило бы подлинную неоднозначность.
- issue: Фраза о крещении и теле
  choice: «крещения телом, рождённым Логосом»
  alternative: «крещения посредством тела» или «крещения тела»
  rationale: Сохранена инструментальная связь, представленная в свидетельстве, без догматического уточнения природы тела.
- issue: Сиф «облёкся» в Иисуса
  choice: «Иисуса, того, в кого облёкся великий Сиф»
  alternative: «Иисуса, которого великий Сиф носил»
  rationale: Образ облачения передан буквально и без отождествления либо жёсткого разделения персонажей.
- issue: «распял то, что в Законе»
  choice: сохранена предметная неопределённость
  alternative: «распял Закон» / «распял проклятие Закона»
  rationale: Источник не уточняет, что именно находится «в Законе»; богословское дополнение было бы необоснованным.
- issue: Род святого Духа
  choice: «святым Духом»
  alternative: «Святым Духом»
  rationale: Строчная форма сохраняет формальную неопределённость этого космологического текста и не навязывает позднейшее тринитарное прочтение; в титуле «великий незримый… Дух» прописная сохранена по синтаксису имени.
- issue: Лакуны и восстановления
  choice: лакуны отмечены […] и восстановления угловыми скобками
  alternative: сгладить или молча восполнить текст
  rationale: Видимая повреждённость рукописного свидетельства сохранена, чтобы не выдавать реконструкцию за несомненный текст.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным ритмом, соответствующим откровенно-гимническому характеру текста. Технические космологические термины и сакральные имена сохранены; списки оформлены как ритмические строки. Перевод предварительный: предоставлено английское публично-доменное свидетельство, тогда как непосредственная сверка с коптским текстом ещё ожидается. Голый номер рукописной страницы [14] в основной текст не включён.'
