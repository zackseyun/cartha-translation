translation:
  language: ru
  text: 'Они просили [силы]. Из живого Безмолвия изошло безмолвие, а именно — [славы] и нерушимости в эонах, [… эоны], мириады, прибавленные [к …], трое мужей, [три] мужских порождения. [Мужские] роды наполнили великий эон Доксомедона силой речи [всей Полноты].


    Затем тройственный мужской [Сын великого] Христа, которого помазал [великий] невидимый Дух и чья сила [называлась] Айнон, вознёс [хвалу] великому невидимому Духу, [его] мужественной деве Иоиль, Безмолвию безмолвного Безмолвия и величию […].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Кодексе III отсутствуют страницы 45–48; этому месту соответствуют страницы 55–60 Кодекса IV. Квадратные скобки обозначают восстановленный или неуверенно читаемый текст, а многоточия в скобках — утраты рукописи.
    reason: Сообщает существенное состояние рукописного свидетельства и объясняет редакционные обозначения.
lexical_decisions:
- source_word: power
  choice: сила
  rationale: Передаёт способность или могущество без преждевременного отождествления с властью либо отдельной ипостасью; восстановленное слово оставлено в квадратных скобках.
- source_word: Silence
  choice: Безмолвие
  rationale: Сохраняет возвышенный и, вероятно, персонифицированный характер термина; прописная буква отличает имя или сущность от обычного «безмолвия».
- source_word: indestructibilities
  choice: нерушимости
  rationale: Сохраняет необычную абстрактную форму множественного числа и не превращает её без основания в «нетленных существ».
- source_word: aeon
  choice: эон
  rationale: Транслитерация сохраняет специальный космологический термин и его намеренную неоднозначность между областью, веком и сущностью.
- source_word: Fullness
  choice: Полнота
  rationale: Устоявшаяся и прозрачная передача специального понятия; прописная буква отражает его космологическое употребление.
- source_word: triple-male
  choice: тройственный мужской
  rationale: Передаёт составной эпитет максимально близко, не истолковывая его как «трижды мужественный» или как троих отдельных лиц.
- source_word: male virgin
  choice: мужественная дева
  rationale: Сохраняет напряжённое сочетание мужского и девственного признаков, но избегает грамматически тяжёлого «мужская дева»; возможна более буквальная передача в примечании при сверке с коптским.
- source_word: Doxomedon
  choice: Доксомедон
  rationale: Имя транслитерировано и не переводится предположительно.
- source_word: Ainon
  choice: Айнон
  rationale: Имя транслитерировано по английскому свидетельству; окончательное написание требует проверки коптской формы.
- source_word: Yoel
  choice: Иоиль
  rationale: Передача имени в форме, естественной для русской религиозной письменности; точная вокализация подлежит проверке по коптскому тексту.
theological_decisions:
- issue: Отношение «тройственного мужского Сына» ко Христу
  choice: '[Сын великого] Христа'
  alternative: '[дитя великого] Христа'
  rationale: Слово «Сын» согласуется с мужским эпитетом и русским возвышенным регистром, но заключено в скобки как восстановление; генитивная связь сохранена без догматического пояснения.
- issue: Кто является обладателем «мужской девы» Иоиль
  choice: '[его] мужественной деве Иоиль'
  alternative: мужской деве Иоиль без указания принадлежности
  rationale: Следует структуре английского свидетеля, одновременно отмечая восстановленный элемент скобками; не уточняется природа связи между Духом и Иоиль.
- issue: Персонификация Безмолвия и Полноты
  choice: Прописные буквы
  alternative: строчные буквы
  rationale: Контекст представляет эти понятия как элементы именованной космологии, однако перевод не добавляет им титулов и не определяет их онтологический статус.
- issue: «Anointed» и Христос
  choice: помазал
  alternative: освятил
  rationale: Сохранена лексическая связь с понятием помазания и именем Христос без попытки согласовать её с позднейшими конфессиональными формулами.
translation_notes:
  register: Современный литературный русский с возвышенным космологическим регистром. Необычные повторы («Безмолвие безмолвного Безмолвия») и множественные абстрактные формы сохранены как особенности исходного свидетельства. Поскольку непосредственная сверка с коптским текстом ещё не выполнена, имена, синтаксические связи и восстановления считаются предварительными.
