    Затем тройственно-мужское [дитя великого] Христа, которого помазал [великий] невидимый Дух и чья сила [называлась] Айнон, вознесло [хвалу] великому невидимому Духу, [его] мужской деве Иоиль, Безмолвию безмолвного Безмолвия и величию […].[a]'
