review_pass:
  verdict: revise
  source_fidelity: Черновик в целом бережно следует предоставленному английскому свидетельству и сохраняет лакуны, угловые скобки и пояснительные скобки. Однако «Он возжелал ... рода» меняет более сдержанное «he was pleased with»; «непоколебимый» не вполне передаёт буквальное «unmoving»; а «прошёл через три ... мира» подменяет «came forth ... to the world». Эти места безопасно исправить без устранения текстовой неясности. Непосредственная проверка по коптскому тексту остаётся невозможной на основании предоставленных данных.
  naturalness: Русский текст литературен и в основном естественен. Исправленная формулировка первого предложения избегает неуместного смыслового усиления, а синтаксис фразы о благодати несколько прояснён без снятия отмеченной в сноске неоднозначности.
  terminology: Термины «эон», «архонт», «Логос», «Полнота», «стражи» и «род» уместны. «Неуничтожимый, неподвижный» точнее передаёт indestructible, unmoving, чем «нерушимый, непоколебимый». Имена и парадоксальные титулы сохранены. Обозначение лакун приведено к виду «[]», как в данном свидетельстве.
  issues:
  - severity: medium
    issue: «Он возжелал ... рода» вместо «he was pleased with ... race».
    rationale: «Возжелал» выражает желание/намерение и тем самым добавляет смысл, которого в свидетельстве нет; требуется передать благоволение или довольство.
  - severity: medium
    issue: «Непоколебимый» вместо «unmoving».
    rationale: Русское слово означает стойкость или несгибаемость, тогда как свидетельство говорит о неподвижности; это важный повторяющийся эпитет рода.
  - severity: medium
    issue: «Род, который прошёл через три ... мира».
    rationale: Глагол «прошёл» описывает перемещение через миры, тогда как witness имеет «came forth ... to the world»; «вышел ... в мир» ближе к исходной формулировке.
  - severity: low
    issue: Лакуны переданы как «[...]», тогда как свидетельство использует «[]».
    rationale: Следует сохранить форму редакционного обозначения, указанную в источнике, и соответственно уточнить сноску.
  revised_text: "Она получила свою полноту и силу по воле и благоволению Отца. По этому благоволению Он благоволил к великому, неуничтожимому, неподвижному роду великих и могучих людей великого Сифа, чтобы посеять его среди возникших эонов и через неё восполнить недостаток. Ведь она сошла свыше в мир, будучи образом ночи. Выйдя, она стала ходатайствовать за семя архонта этого эона и <тех> властей, которые произошли от него, — за осквернённое (семя) бога, порождающего демонов и обречённого на уничтожение, — а также за семя [] Адама и великого Сифа, подобное солнцу.[a]\n\n\n      Тогда пришёл великий ангел Хормос, чтобы приготовить семя великого Сифа посредством дев осквернённого посева (семенем) этого эона — в священном сосуде, рождённом Логосом через Святой Дух.\n\n\n      Затем пришёл великий Сиф со своим семенем, и оно было посеяно среди возникших эонов, число которых соответствовало числовому значению слова «Содом».[b] Одни говорят, что Содом — это место, где великий Сиф пасёт стадо,\
    \ то есть Гоморра. Другие же говорят, что великий Сиф перенёс свой посев из Гоморры и пересадил его в другое место, которое назвал Содомом.\n\n\n      Это тот род, который произошёл через Эдоклу, ибо своим словом она породила Истину и Праведность, став началом семени вечной жизни, предназначенной тем, кто устоит благодаря знанию о своём происхождении.[c] Это великий, неуничтожимый род, который вышел через три [] мира в мир. Потоп же произошёл как прообраз завершения эона, но он будет послан в мир из-за этого рода.[d]\n\n\n      Огонь охватит землю, а благодать будет для тех из рода, который возник через пророков и стражей, охраняющих жизнь рода.[e] Из-за этого рода придут голод и моровые поветрия; всё это случится из-за великого, неуничтожимого рода. Из-за этого рода придут и испытания, вплоть до обмана лжепророков.\n\n\n      Тогда великий Сиф увидел дела дьявола: его многочисленные обличья, его козни против неуничтожимого, неподвижного рода, преследования со стороны его сил и ангелов\
