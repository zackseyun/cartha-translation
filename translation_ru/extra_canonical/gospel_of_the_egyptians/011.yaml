base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/011.yaml
  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: ru
  text: 'Она обрела свою полноту и силу по воле и благоволению Отца. В этом благоволении Он возжелал великого, нерушимого и непоколебимого рода великих и могучих людей великого Сифа, чтобы посеять его среди возникших эонов и через неё восполнить недостаток. Ведь она сошла свыше в мир, будучи образом ночи. Выйдя, она стала ходатайствовать за семя архонта этого эона и <тех> властей, которые произошли от него, — за осквернённое (семя) бога, порождающего демонов и обречённого на уничтожение, — а также за семя [...] Адама и великого Сифа, подобное солнцу.[a]


    Тогда пришёл великий ангел Хормос, чтобы приготовить семя великого Сифа посредством дев осквернённого посева (семенем) этого эона — в священном сосуде, рождённом Логосом через Святой Дух.


    Затем пришёл великий Сиф со своим семенем, и оно было посеяно среди возникших эонов, число которых соответствовало числовому значению слова «Содом».[b] Одни говорят, что Содом — это место, где великий Сиф пасёт стадо, то есть Гоморра. Другие же говорят, что великий Сиф перенёс свой посев из Гоморры и пересадил его в другое место, которое назвал Содомом.


    Это тот род, который произошёл через Эдоклу, ибо своим словом она породила Истину и Праведность, став началом семени вечной жизни, предназначенной тем, кто устоит благодаря знанию о своём происхождении.[c] Это великий, нерушимый род, который прошёл через три [...] мира в этот мир. Потоп же произошёл как прообраз завершения эона, но он будет послан в мир из-за этого рода.[d]


    Огонь охватит землю, а благодать будет дарована тем из этого рода, кто произошёл через пророков и стражей, охраняющих жизнь рода.[e] Из-за этого рода придут голод и моровые поветрия; всё это случится из-за великого, нерушимого рода. Из-за этого рода придут и испытания, вплоть до обмана лжепророков.


    Тогда великий Сиф увидел дела дьявола: его многочисленные обличья, его козни против нерушимого, непоколебимого рода, преследования со стороны его сил и ангелов и то заблуждение, из-за которого они действовали против самих себя.


    Тогда великий Сиф вознёс хвалу:


    великому, неизречённому, девственному Духу;


    и мужской [...] деве Барбелон;


    и трижды-мужскому дитяти — Телмаэль, Телмаэль, Эли, Эли, Махар, Махар, Сиф;


    живой силе — АЛЕТЕС АЛЕТОС;


    и мужской деве Иуэль;


    и Эсефеху, хранителю сияния, венцу его славы;


    и великому эону Доксомедону;


    и престолам в нём;


    и окружающим их силам;


    и всей Полноте, как я уже говорил.


    И он просил, чтобы его семени были даны стражи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки с многоточием обозначают утрату или неразборчивое место рукописи; угловые скобки — слово, восстановленное издателями; круглые скобки сохраняют пояснение переводчика исходного свидетельства.
    reason: Текст содержит три разных вида редакционных обозначений, которые читателю необходимо различать.
  - marker: b
    text: Речь идёт о числовом значении букв названия «Содом»; конкретный способ счёта в данном месте не разъясняется.
    reason: Поясняет древнюю практику буквенно-числового соответствия без спекулятивного вычисления.
  - marker: c
    text: Слово, переданное как «происхождение», может в этом космологическом контексте также означать исхождение или эманацию.
    reason: Сохраняет метафизическую многозначность исходного понятия.
  - marker: d
    text: Местоимение «он» грамматически может относиться к потопу; смысл предсказания остаётся трудным и, возможно, текстуально повреждённым.
    reason: Предупреждает читателя о подлинной неясности фразы вместо молчаливого исправления.
  - marker: e
    text: 'Фраза допускает более одного членения: «те из рода, кто произошёл через пророков и стражей» либо «род, возникший через пророков, и стражи». Перевод следует первому прочтению, не считая его несомненным.'
    reason: Отмечает синтаксическую неоднозначность, влияющую на состав получателей благодати.
lexical_decisions:
- source_word: completion
  choice: полнота
  rationale: В гностическом контексте обозначает достижение полноты, а не просто окончание; сохраняет связь с последующей «Полнотой».
- source_word: pleasure
  choice: благоволение
  rationale: Передаёт волевое расположение Отца естественным сакрально-литературным русским языком.
- source_word: race
  choice: род
  rationale: Нейтрально передаёт общность происхождения и избегает современных биологических и политических коннотаций слова «раса».
- source_word: aeon
  choice: эон
  rationale: Сохраняет специальный космологический термин, не сводя его однозначно ни к веку, ни к миру, ни к личностной сущности.
- source_word: deficiency
  choice: недостаток
  rationale: Сохраняет техническую гностическую идею ущербности или неполноты без её богословского истолкования.
- source_word: archon
  choice: архонт
  rationale: Устоявшаяся передача специального термина для космического правителя или власти.
- source_word: emanation
  choice: происхождение
  rationale: В данном контексте естественно обозначает исход или происхождение рода; буквальное «эманация» было бы менее понятно, хотя метафизический оттенок отмечен в сноске.
- source_word: watchers
  choice: стражи
  rationale: Сохраняет образ бодрствующих хранителей и позволяет одинаково перевести оба появления термина.
- source_word: Fullness
  choice: Полнота
  rationale: Заглавная буква отмечает технический космологический смысл, соответствующий Плероме, без подстановки позднейшего греческого термина.
- source_word: Logos
  choice: Логос
  rationale: Транслитерация сохраняет специализированный титул и не разрешает неоднозначность в пользу только «Слова» или отдельной ипостасной трактовки.
theological_decisions:
- issue: Отношение Отца к нерушимому роду
  choice: «Он возжелал ... рода ... чтобы посеять его»
  alternative: «Он был доволен родом»
  rationale: Сохраняет целевую направленность благоволения и местоименную связь, не добавляя учения об избрании сверх текста.
- issue: «Осквернённое семя» и объекты ходатайства
  choice: Сохранены тире, скобки и синтаксическая неоднозначность перечня
  alternative: Однозначно отнести «осквернённое семя» только к архонту либо только к властям
  rationale: Свидетель не позволяет уверенно разрешить приложение; перевод не должен снимать напряжение.
- issue: Потоп как «type» завершения эона
  choice: «прообраз завершения эона»
  alternative: «символ конца века»
  rationale: «Прообраз» сохраняет типологический характер утверждения и не отождествляет событие с самим завершением.
- issue: Причинная связь бедствий с родом
  choice: «из-за этого рода»
  alternative: «ради этого рода» или «против этого рода»
  rationale: Исходный свидетель выражает причинность, но не уточняет, служат ли бедствия спасению рода или направлены против него; более определённые варианты добавили бы толкование.
- issue: Парадокс «мужская дева»
  choice: Сохранено буквально
  alternative: «муже-дева» или согласование в мужском роде
  rationale: Парадоксальный андрогинный титул является частью богословского языка текста и не должен нормализоваться.
- issue: Святой Дух
  choice: «через Святой Дух»
  alternative: «через святой дух»
  rationale: Заглавные буквы передают титульное употребление в русском религиозном регистре, не уточняя позднейшую тринитарную доктрину.
translation_notes:
  register: 'Современный литературный русский с достоинством позднеантичного откровенного текста. Специальные космологические термины («эон», «архонт», «Логос», «Полнота») сохранены; имена транслитерированы последовательно. Архаизмы сведены к минимуму, но молитвенно-гимнический перечень оформлен возвышенно. Проект предварительный: предоставленный материал основан на англоязычном публичном свидетельстве, а непосредственная сверка с коптским текстом ещё требуется.'
