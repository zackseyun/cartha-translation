  - severity: low
    issue: «Явленность» — неудачная передача Manifestation.
    rationale: Слово выглядит как искусственный неологизм и снижает естественность русского текста. «Манифестация» сохраняет технический характер и женский грамматический род персонифицированной фигуры, не добавляя отождествления.
  - severity: low
