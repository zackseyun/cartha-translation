translation:
  language: ru
  text: 'Великий Логос, саморождённый Бог и нетленный Человек Адамас вознесли хвалу. Они просили для Саморождённого силы и вечного могущества ради завершения четырёх эонов, чтобы через них явились [лакуна] […] [a] слава и сила незримого Отца святых людей великого Света, которые войдут в мир — образ ночи.


    Нетленный Человек Адамас просил их, чтобы от него самого произошёл сын и стал отцом непоколебимого нетленного рода, чтобы через этот род явились Безмолвие и Голос и чтобы через него мёртвый эон восстал, дабы распасться. И тогда свыше изошла сила великого Света — Явленность.[b] Она породила четыре великих света:


    Хармозеля,


    Оройяэля,


    Давифе,


    Элелета,


    а также великого нетленного Сифа, сына нетленного Человека Адамаса. Так завершилась совершенная Гебдомада, пребывающая в сокрытых тайнах. [Лакуна] Когда она [обретает] [славу],[c] она становится одиннадцатью Огдоадами, и Отец в знак одобрения кивнул. Вся Полнота светов возрадовалась.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки и многоточие отмечают повреждение или утрату текста в рукописном свидетельстве.
    reason: Читателю необходимо отличать лакуну от авторской паузы.
  - marker: b
    text: «Явленность» передаёт персонифицированное Manifestation; точное коптское наименование требует проверки по оригиналу.
    reason: Перевод основан на публичном английском свидетельстве, а непосредственная сверка с коптским источником ещё не проведена.
  - marker: c
    text: Слова в квадратных скобках восстановлены или предположительно восполнены переводчиками свидетельства; само место повреждено и его смысл не вполне ясен.
    reason: Сохраняется различие между читаемым текстом и редакционной реконструкцией.
lexical_decisions:
- source_word: Logos
  choice: Логос
  rationale: Сохранён традиционный богословско-философский термин без сведения его значения только к «слову» или «разуму».
- source_word: self-generated
  choice: саморождённый
  rationale: Передаёт идею происхождения из самого себя и сохраняет технический характер эпитета.
- source_word: aeon
  choice: эон
  rationale: Сохранён технический космологический термин, поскольку «век» или «вечность» здесь могли бы сузить смысл.
- source_word: unmoving
  choice: непоколебимый
  rationale: В сочетании с «родом» это естественная русская передача устойчивости и неизменности, без буквального, но неясного «неподвижный».
- source_word: Manifestation
  choice: Явленность
  rationale: Прописная буква и отвлечённое существительное сохраняют персонифицированную ипостась; женский род согласуется с последующим «она».
- source_word: Hebdomad
  choice: Гебдомада
  rationale: Сохранён технический термин со значением семеричной совокупности без поясняющего истолкования в основном тексте.
- source_word: Ogdoads
  choice: Огдоады
  rationale: Сохранён технический термин со значением восьмеричных совокупностей, хотя выражение «одиннадцать Огдоад» остаётся текстуально и концептуально трудным.
- source_word: Fullness
  choice: Полнота
  rationale: Передан буквальный и технический смысл понятия, с прописной буквы как обозначение космологической целокупности.
- source_word: Adamas / Seth / Harmozel / Oroiael / Davithe / Eleleth
  choice: Адамас / Сиф / Хармозель / Оройяэль / Давифе / Элелет
  rationale: Адамас и имена четырёх светов транслитерированы по доступному свидетельству; для Seth выбрана укоренившаяся русская библейская форма «Сиф».
theological_decisions:
- issue: Отношение «мира» к «образу ночи»
  choice: «войдут в мир — образ ночи»
  alternative: «войдут в мир, [будучи] образом ночи»
  rationale: Тире сохраняет наиболее вероятное приложение к «миру», не превращая его в отдельное догматическое утверждение.
- issue: Странное действие мёртвого эона
  choice: «мёртвый эон восстал, дабы распасться»
  alternative: «мёртвый эон поднялся, чтобы раствориться»
  rationale: Сохранено внутреннее напряжение исходной формулировки; перевод не объясняет, как восстание соотносится с распадом.
- issue: Местоимение «их» в просьбе Адамаса
  choice: Сохранено без уточнения референта
  alternative: Назвать предполагаемых адресатов просьбы
  rationale: В предоставленном свидетельстве адресат неясен; конкретизация внесла бы отсутствующее толкование.
- issue: Персонификация Явленности
  choice: 'Женский род: «Явленность. Она породила»'
  alternative: 'Средний род: «Явление. Оно породило»'
  rationale: Передаёт явное женское местоимение английского свидетельства, не отождествляя фигуру с иной названной ипостасью.
- issue: Числовая структура Гебдомады и Огдоад
  choice: Формулировки сохранены без арифметического согласования или пояснения
  alternative: Эксплицировать состав семерицы и восьмериц
  rationale: Текст фрагментарен и технически труден; редакционное исправление могло бы устранить подлинную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но доступным синтаксисом. Технические гностические термины сохранены транслитерацией или устойчивыми кальками. Лакуны и реконструкции обозначены явно. Проект предварительный: предоставленное основание является англоязычным публичным свидетельством, а непосредственная проверка коптского текста Наг-Хаммади III,2 и IV,2 ожидается.'
