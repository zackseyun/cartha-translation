  verdict: revise
  source_fidelity: Прямое сопоставление с коптским текстом пока невозможно, поскольку предоставлен лишь английский публично-доменный свидетель. По этому свидетелю сохранены лакуны, восстановленные слова, последовательность формульных эпитетов и намеренно неразрешённая космологическая терминология. Однако в нескольких местах квадратные скобки были перенесены на русские знаменательные слова, хотя в английском они относятся только к восстановленному артиклю; это создаёт ложное впечатление текстовой реконструкции.
  naturalness: Гимническая, фрагментарная синтаксическая форма звучит уместно для данного текста. Родительные цепочки и повтор «Света» сохранены без искусственного разъяснения. Исправленный порядок «бесконечного Света» естественнее по-русски и точнее передаёт английскую конструкцию.
  terminology: '«Полнота», «эон», «нетленности», «Промысл» и «чуждый» допустимо сохраняют терминологическую и синтаксическую неопределённость. Греческое ALĒTHŌS следует передавать как «АЛЕТОС», не «АЛИТОС»: написание с «и» не соответствует греческой форме и вводит неверную транслитерацию.'
