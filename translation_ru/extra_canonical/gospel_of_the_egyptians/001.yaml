translation:
  language: ru
  text: '[…] [Священная] книга [···] великого незримого [Духа],


    Отца, чьё имя неизреченно,

    [возникшего] с высот [Полноты],

    [Света] от Света из эонов Света,

    Света [Безмолвия] Промысла

    и Отца Безмолвия,

    [Света] Слова и Истины,

    Света […] [нетленностей],

    [Света] бесконечного,

    [Сияния] из эонов Света

    нераскрываемого, неозначенного,

    нестареющего, неизъяснимого Отца,

    эона эонов,[a]

    саморождённого, рождающего самого себя, производящего самого себя,

    чуждого,

    эона,


    ИСТИНЫ, АЛИТОС.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эон» может означать век или вечность, а в космологической терминологии этого произведения — также сверхмирную сущность либо область. Формула «эон эонов» оставлена без уточняющего толкования.
    reason: Термин многозначен и богословски нагружен; перевод одним общеупотребительным словом сузил бы смысл.
  - marker: b
    text: «Алитос» — передача греческого alēthōs, обычно означающего «истинно», «воистину». Рядом уже стоит слово «Истина», поэтому греческая форма сохранена отдельно, как в свидетеле.
    reason: Сохраняет словесное соположение TRUTH и ALĒTHŌS и не устраняет возможную формульную или именословную функцию второй формы.
lexical_decisions:
- source_word: sacred book
  choice: Священная книга
  rationale: Естественное и dignified русское соответствие; квадратные скобки сохраняют указание свидетеля на восстановленный текст.
- source_word: great unseen Spirit
  choice: великий незримый Дух
  rationale: «Незримый» сохраняет возвышенный регистр и значение невидимости, не добавляя толкования.
- source_word: Fullness
  choice: Полнота
  rationale: Передаёт техническое понятие буквально и не заменяет его заимствованием «Плерома», которое было бы менее понятно обычному читателю.
- source_word: aeon
  choice: эон
  rationale: 'Транслитерация сохраняет специальный космологический термин и его неоднозначность: в контексте он может обозначать и вечность/век, и сверхмирную сущность или область.'
- source_word: Providence
  choice: Промысл
  rationale: Краткое традиционное русское соответствие для персонифицированного провидения; заглавная буква сохраняет вероятный статус имени или ипостасного обозначения.
- source_word: Speech
  choice: Слово
  rationale: В возвышенном богословско-космологическом перечне «Слово» естественнее, чем «Речь», при этом не уточняет, имеется ли в виду самостоятельная сущность.
- source_word: indestructibilities
  choice: нетленности
  rationale: Субстантивированное множественное число намеренно сохраняет необычную абстрактную форму свидетеля, не превращая её без основания в «нетленных» существ.
- source_word: alien
  choice: чуждый
  rationale: Сохраняет резкую характеристику инаковости, не конкретизируя, чему именно Отец чужд.
- source_word: self-generated, self-generating, self-producing
  choice: саморождённого, рождающего самого себя, производящего самого себя
  rationale: Сохраняет различие между тремя близкими формулами и их последовательность, не сливая их в один эпитет.
- source_word: TRUTH, ALĒTHŌS
  choice: ИСТИНЫ, АЛИТОС
  rationale: Первое слово переведено, второе передано транслитерацией как отдельная греческая форма, поскольку их соположение, вероятно, значимо и не должно сглаживаться.
theological_decisions:
- issue: Статус ряда космологических понятий
  choice: Заглавные буквы в словах «Дух», «Полнота», «Свет», «Безмолвие», «Промысл», «Слово», «Истина»
  alternative: Писать эти слова со строчной буквы как обычные нарицательные понятия
  rationale: Свидетель представляет их в формульном, вероятно персонифицированном или титульном употреблении. Заглавные буквы сохраняют эту возможность, не утверждая разработанную догматическую систему.
- issue: Значение «эона»
  choice: Сохранить термин «эон» без истолкования
  alternative: Перевести как «вечность», «век», «мир» или «небесная сущность»
  rationale: В данном тексте термин многозначен; единичный русский эквивалент преждевременно разрешил бы богословское и космологическое напряжение.
- issue: Синтаксическая связь эпитетов после «Сияния»
  choice: Сохранить длинную цепь родительных определений, относящую эпитеты к Отцу
  alternative: Разбить цепь и представить «нераскрываемый» и последующие эпитеты как характеристики Света или Сияния
  rationale: Английский свидетель допускает некоторую синтаксическую напряжённость, но прямо завершает ряд словом «Father». Русский текст сохраняет эту связь без дополнительных поясняющих глаголов.
- issue: Божественная самопорождаемость
  choice: Передать три самостоятельных эпитета буквально и параллельно
  alternative: Свести их к формуле «самосущий»
  rationale: «Самосущий» внёс бы более позднюю систематическую категорию и устранил бы различия исходной тройной формулы.
translation_notes:
  register: Современный литературный русский с возвышенным, гимническим ритмом. Строковая структура, повторы и цепочки эпитетов сохранены. Квадратные скобки и многоточия передают повреждения и редакционные восстановления английского публично-доменного свидетеля; прямое сопоставление с коптским текстом ещё требуется. Там, где английский свидетель имеет неполные или асимметричные скобки, оформление слегка нормализовано для читаемости, но лакуны не заполнены догадками.
