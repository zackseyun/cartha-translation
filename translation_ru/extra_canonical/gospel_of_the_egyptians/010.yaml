  text: 'Five thousand years later, the great light Eleleth said, “Let there be a ruler over Chaos and Hades,” and a cloud appeared [] [named] the hylic Sophia [. . .].


    [She] looked out over the regions [of Chaos]. Her face resembled [. . .] in her form [. . .] blood, and [the great] angel Gamaliel said [to the great Gabriel], the minister of [the great light] Oroiael. He [said, “Let an] angel come forth [to] rule over Chaos [and Hades].”


    Then the cloud [complied and produced] two monads, each [possessing] light. [. . . the throne] she had established in the cloud [above].


    Then Sakla, the great [angel, saw] the great demon [who accompanied him, Nebr]uel, and [together] they became a procreating spirit of the earth. [They begot] ministering angels.


    Sakla [said] to the great [demon] Nebruel, “Let [the] twelve aeons come into being in [the . . .] aeon, worlds [. . .].”


    [. . .] the great angel [Sakla] said, by the will of the self-generated one, [] “There shall [be] the [. . .] numbering seven [. . .],” and he said to the [great angels], “Go, and [let each] of you rule over his (own) [world].”


    Each [of these] twelve [angels] came [forth]:


    [The first] angel is Ath[oth]. [He is the one] whom [the great] generations of humans call [. . .].

    [The] second is Harmas, [who] is [fire-eye].

    The third [is Galila].

    [The] fourth is Yobel.

    [The fifth is] Adonaios, who is [called] Sabaoth.


    The sixth [is Cain, whom] the [great generations of] humans call the sun.

    The [seventh is Abel].

    The eighth is Akiressina.

    The [ninth is Yubel].

    The tenth is Harm[oupiael].

    [The] eleventh is Arch[ir-Adonin].

    The twelfth [is Belias].


    [These are] the ones stationed over Hades [and Chaos], and after the foundation [of the world], Sakla said to his [angels], “I, even I, am a [jealous] God, and apart from me nothing has [come into being,” because he] [] relied on his (own) substance. [13]


    Then a voice came from on high, saying, “The Man exists, and the Son of the Man.”


    The first mold was formed because of the descent of the image above, which reflects its voice on high—the image that peered out through the peering out of the image above. Repentance came into being because of this.'
translation:
  language: ru
  text: 'Пять тысяч лет спустя великий свет Элелет сказал: «Да будет правитель над Хаосом и Аидом», — и появилось облако [] [по имени] вещественная София[a] […].


    [Она] взглянула на области [Хаоса]. Её лицо походило на […] в её облике […] кровь, и [великий] ангел Гамалиил сказал [великому Гавриилу], служителю [великого света] Оройаила. Он [сказал: «Пусть] явится ангел, [чтобы] править Хаосом [и Аидом]».


    Тогда облако [повиновалось и породило] две монады[b], каждая из которых [обладала] светом. [… престол] она воздвигла в облаке [наверху].


    Тогда Сакла, великий [ангел, увидел] великого демона [Небр]уэла, [сопровождавшего его], и [вместе] они стали порождающим духом земли. [Они породили] служебных ангелов.


    Сакла [сказал] великому [демону] Небруэлу: «Пусть [двенадцать] эонов возникнут в [… таком-то] эоне, миры […]».


    […] великий ангел [Сакла] по воле Саморождённого[c] сказал: [] «Да [будет] […] числом семь […]», — и сказал [великим ангелам]: «Идите, и [пусть каждый] из вас правит своим [миром]».


    Каждый [из этих] двенадцати [ангелов] явился:


    [Первый] ангел — Ат[от]. [Это тот], кого [великие] поколения людей называют […].


    [Второй] — Хармас, [который есть] [Огненный Глаз].


    Третий — [Галила].


    [Четвёртый] — Йобел.


    [Пятый] — Адонайос, которого [называют] Саваофом.


    Шестой — [Каин, которого великие поколения] людей называют солнцем.


    [Седьмой — Авель].


    Восьмой — Акирессина.


    [Девятый — Йубел].


    Десятый — Харм[упиаил].


    [Одиннадцатый] — Арх[ир-Адонин].


    Двенадцатый — [Белиас].


    [Это те], кто поставлен над Аидом [и Хаосом]. После основания [мира] Сакла сказал своим [ангелам]: «Я, именно я, — [ревнивый] Бог, и кроме меня ничто не [возникло», — потому что он] [] полагался на собственную сущность.


    Тогда свыше раздался голос: «Человек существует, и Сын Человека»[d].


    Первый слепок[e] был создан вследствие нисхождения образа свыше, который отражает там, наверху, свой голос, — образа, выглянувшего благодаря тому, что выглянул образ свыше. Вследствие этого возникло Покаяние[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вещественная» передаёт термин со значением «материальная, относящаяся к материи»; София означает «Мудрость».
    reason: Поясняет техническое выражение без его догматического истолкования.
  - marker: b
    text: Монада — буквально «единица»; здесь это особая единичная космологическая сущность.
    reason: Технический термин может быть непонятен обычному читателю.
  - marker: c
    text: То есть тот, кто возник из самого себя; в тексте это титул.
    reason: Проясняет непривычное титульное образование.
  - marker: d
    text: Выражения «Человек» и «Сын Человека» здесь, по-видимому, имеют титульный или небесно-архетипический смысл; повреждённый контекст не позволяет определить его точнее.
    reason: Предохраняет от автоматического отождествления с более привычной формулой «Сын Человеческий».
  - marker: e
    text: 'Или: «первая форма», «первый отпечаток».'
    reason: Исходное понятие допускает несколько близких образных передач.
  - marker: f
    text: Прописная буква сохраняет возможность того, что Покаяние мыслится здесь как персонифицированная или космологическая реальность.
    reason: Отмечает подлинную смысловую неоднозначность.
lexical_decisions:
- source_word: hylic Sophia
  choice: вещественная София
  rationale: Передаёт философско-космологический смысл «относящаяся к материи» без отождествления Софии с обычной человеческой мудростью; термин пояснён в сноске.
- source_word: monads
  choice: монады
  rationale: Сохранён технический космологический термин, поскольку более общее «единства» стёрло бы специфику текста.
- source_word: self-generated one
  choice: Саморождённый
  rationale: Передано как титул с прописной буквы; формулировка сохраняет идею происхождения из самого себя и не заменяет её более конфессиональным термином.
- source_word: first mold
  choice: первый слепок
  rationale: «Слепок» естественно передаёт форму, полученную по образу, и поддерживает связь с последующим упоминанием образа; «форма» была бы более двусмысленной.
- source_word: Repentance
  choice: Покаяние
  rationale: Прописная буква сохраняет возможность персонифицированного или космологического значения, не исключая обычного смысла раскаяния.
- source_word: Hades
  choice: Аид
  rationale: Транслитерация сохраняет космологическое имя области мёртвых и не вводит более узкое толкование «ад».
theological_decisions:
- issue: Заявление Саклы о своей исключительной божественности
  choice: Сохранено буквально и приписано Сакле в рамках повествования
  alternative: Согласовать формулировку с позднейшим ортодоксальным учением о Боге
  rationale: Текст намеренно создаёт напряжение между притязанием Саклы и голосом свыше; перевод не должен его сглаживать.
- issue: «The Man» и «the Son of the Man»
  choice: «Человек» и «Сын Человека» с прописных букв
  alternative: «человек» и «сын человека» либо «Сын Человеческий»
  rationale: Прописные буквы отражают титульный или небесно-архетипический характер выражений; «Сын Человека» сохраняет необычную конструкцию данного свидетельства и не подменяет её привычной библейской формулой.
- issue: Статус Покаяния
  choice: «Покаяние» с прописной буквы
  alternative: «раскаяние» со строчной буквы
  rationale: Контекст перечисляет возникающие космологические реальности, поэтому возможная персонификация сохранена, но не разъяснена догматически.
- issue: Повреждённый синтаксис заключительного абзаца
  choice: Сохранено повторение «образа» и неоднозначная причинная связь
  alternative: Перестроить как однозначную последовательность действий
  rationale: Свидетельство не позволяет уверенно устранить синтаксическую и образную сложность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего космологического повествования. Квадратные скобки и многоточия сохранены как сигналы редакционного восстановления и утрат рукописи; пустые [] также оставлены там, где они присутствуют в предоставленном свидетельстве. Имена переданы последовательно в русской транслитерации, а укоренённые формы «Гавриил», «Каин», «Авель», «Саваоф» сохранены. Поскольку прямое коптологическое изучение ещё не выполнено, draft осторожно следует предоставленному публичному английскому свидетельству и не скрывает его неуверенности.
