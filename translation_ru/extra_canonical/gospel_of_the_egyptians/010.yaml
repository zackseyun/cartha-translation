review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод бережно сохраняет повреждения рукописи, порядок космологических имён, технические термины и намеренно не сглаживает трудный финальный синтаксис. Однако «[... таком-то] эоне» вводит отсутствующее в свидетельстве содержание, а несколько решений нуждаются в более точной и естественной передаче: hylic следует передать как «материальная», ministering angels — как «ангелы-служители», а fire-eye не следует без основания превращать в титул прописными буквами.'
  naturalness: 'Регистр в основном современный литературный и соответствует возвышенному космогоническому повествованию. Уточнены несколько тяжеловесных или неудачных сочетаний: «стали духом земли, порождающим» и «ангелы-служители».'
  terminology: Сохранены «Аид», «эоны», «монады», «Саморождённый», а также имена в принятой русской транслитерации. «Материальная София» прямо передаёт значение hylic и менее двусмысленна, чем «вещественная». «Сын Человека» и «Покаяние» оставлены с прописных букв как возможные титульные/персонифицированные обозначения без конфессионального истолкования.
  issues:
  - severity: medium
    issue: Добавлено слово «таком-то» в повреждённом месте.
    rationale: В английском свидетельстве имеется лишь «[the . . .] aeon»; «таком-то» не отражает ни сохранённого текста, ни нейтральной редакторской реставрации и создаёт лишний смысл.
  - severity: low
    issue: «Вещественная София» недостаточно прозрачно передаёт hylic.
    rationale: В данном философско-космологическом контексте «материальная» — прямое современное соответствие; смысл поясняется сноской без догматизации.
  - severity: low
    issue: «Служебные ангелы» звучит по-русски как административная характеристика.
    rationale: «Ангелы-служители» естественнее передаёт ministering angels и сохраняет их функцию.
  - severity: low
    issue: Прописные буквы в «Огненный Глаз» не поддержаны свидетельством.
    rationale: Английское восстановление дано со строчной буквы; русское «огненное око» сохраняет фрагментарный предикативный характер текста без придания ему статуса собственного имени.
