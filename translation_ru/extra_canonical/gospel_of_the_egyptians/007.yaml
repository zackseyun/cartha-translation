    reason: Сохранены как лакуна, так и степень уверенности в восстановленном чтении.
lexical_decisions:
- source_word: Ogdoad
  choice: Огдоада
  rationale: Сохранён традиционный термин для восьмерицы божественных сущностей; простое «восьмерица» могло бы затушевать специальный космологический смысл.
- source_word: self-generated
  choice: саморождённый
  rationale: Передаёт идею происхождения из самого себя без внесения более конфессионально нагруженного термина «самосущий».
- source_word: Fullness
  choice: Полнота
  rationale: Калька сохраняет техническое космологическое значение, соответствующее понятию плеромы, и связь с Полнотой Светов.
- source_word: proceeded
  choice: произошли
  rationale: В контексте развёртывания небесных порядков обозначает исхождение/возникновение; выбор сохраняет космогонический оттенок без чрезмерно специального «эманировали».
- source_word: Discretion
  choice: Рассудительность
  rationale: Передаёт способность к здравому различению, не сужая значение до осторожности или благоразумия.
- source_word: male virgin
  choice: мужественная Дева
  rationale: Сохраняет парадоксальное сочетание мужского и девственного начал; буквальное «мужская дева» по-русски звучит как указание только на биологический пол и хуже передаёт титул.
- source_word: triple-male child
  choice: трижды мужественный Ребёнок
  rationale: Сохранён необычный титул и его тройной мужской аспект без попытки богословски его объяснить.
- source_word: Logos / Speech
  choice: Логос / Речь
  rationale: 'Различены два стоящих рядом наименования: технический титул «Логос» и обычное существительное «Речь».'
theological_decisions:
- issue: Отношение спутников к четырём светам
  choice: Передать перечисления через «спутница … света»
  alternative: 'Оставить разрозненное родительное перечисление: «Благодать, первого света…»'
  rationale: Русская связка делает отношения читаемыми, но не определяет их как творение, ипостась или свойство света.
- issue: Формула «the Father, the fourth»
  choice: «именовали Отца четвёртым»
  alternative: «именовали Отца, четвёртого»
  rationale: Сохраняется утверждение о «четвёртом», не уточняя, в какой именно последовательности или богословской системе Отец назван четвёртым.
- issue: Парадоксальный титул male virgin
  choice: «мужественная Дева»
  alternative: «мужская Дева» или устранение гендерного парадокса
  rationale: Не устранено напряжение между мужским и девственным обозначениями, однако выбран естественнее звучащий титульный оборот.
- issue: Референт местоимений в «thrones inside them»
  choice: «престолам внутри них»
  alternative: Уточнить предполагаемый референт по имени
  rationale: Множественное местоимение исходного свидетельства двусмысленно; перевод не навязывает конкретного референта.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Имена транслитерированы последовательно по предоставленному свидетельству; технические космологические термины «Огдоада», «Полнота», «эон» и «Логос» сохранены. Черновик основан на предоставленном общедоступном английском свидетельстве; прямая сверка с коптским текстом ещё требуется. Голые номера рукописных страниц [11] и [12], разрывавшие предложения в английском свидетельстве, в основной текст не включены.
