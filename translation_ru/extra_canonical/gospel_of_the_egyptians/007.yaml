review_pass:
  verdict: revise
  source_fidelity: Прямая сверка с коптским текстом пока невозможна, поэтому оценка ограничена предоставленным английским свидетельством. Черновик в целом сохраняет последовательность космологических фигур, технические термины, лакуны и редакторские дополнения. Однако «мужественная Дева» передаёт не мужской признак, а доблесть/отвагу, а добавленные слова «спутница» и «служитель» местами чрезмерно конкретизируют эллиптические генитивные связи свидетельства.
  naturalness: «И произошли их спутники» по-русски неестественно. «Явились» сохраняет космогонический оттенок появления и читается естественно. Перечни намеренно оставлены несколько эллиптическими там, где таково свидетельство; это предпочтительнее искусственного уточнения отношений между фигурами.
  terminology: «Огдоада», «Полнота», «Логос» и «эон» сохранены. Для male virgin требуется буквальное парадоксальное «мужская Дева», а не «мужественная Дева». Triple-male передано как «трижды-мужской», без доктринального истолкования. Различие Самло/Самбло и все сигналы лакун/реставраций сохранены.
  issues:
  - severity: medium
    issue: «Мужественная Дева»
    rationale: Русское «мужественная» обычно означает храбрая, стойкая, а не «мужская». Тем самым исчезает намеренно парадоксальный мужской признак титула male virgin.
  - severity: medium
    issue: Добавление «спутница» и «служитель» в перечислениях
    rationale: Английское свидетельство в этих местах даёт краткие генитивные связи; добавленные обозначения делают отношение фигур к светам или великим сущностям более определённым, чем в тексте.
  - severity: low
    issue: «И произошли их спутники»
    rationale: Оборот грамматически возможен лишь в специальном космогоническом стиле, но в современном литературном русском звучит неестественно. «Явились» передаёт появление без технической перегрузки.
  - severity: low
    issue: Падеж в «[Ребёнку] Ребёнка»
    rationale: В ряду адресатов хвалы требуются согласованные дательные формы; «[Дитяти] Дитяти» сохраняет восстановление и буквальную конструкцию child of the child.
