translation:
  language: ru
  text: 'И произошли их спутники, чтобы завершить Огдоаду саморождённого Бога:


    Благодать — спутница первого света, Хармозела;

    Восприятие — второго света, Ороиаэла;

    Понимание — третьего света, Давите;

    Рассудительность — четвёртого света, Элелета.


    Такова первая Огдоада саморождённого Бога, и Отец кивком выразил одобрение. Вся Полнота Светов возрадовалась.


    И произошли служители:


    первый — великий Гамалиил, служитель первого великого света, Хармозела;

    великий Гавриил — второго великого света, Ороиаэла;

    великий Самло[a] — великого света, Давите;

    великий Абрасакс — […] [великого света], Элелета[b].


    И по воле благоволения Отца произошли их спутники:


    Память — спутница великого Гамалиила, первого;

    Любовь — великого Гавриила, второго;

    Мир — великого Самбло[a], третьего;

    Вечная Жизнь — великого Абрасакса, четвёртого.


    Так завершились пять Огдоад, всего сорок, — как сила, не поддающаяся истолкованию.


    Тогда великий саморождённый Логос и Речь Полноты четырёх светов воздали хвалу:


    великому невидимому, неименуемому девственному Духу,

    то есть мужественной Деве,

    и великому эону Доксомедону,

    и престолам внутри них,

    и силам вокруг них,

    славам, властям и силам,

    〈и〉 трижды мужественному Ребёнку[c],

    и мужественной Деве Юэль,

    и Эсефеху, […] хранителю великолепия, [Ребёнку] Ребёнка[d],

    и венцу [его] славы,

    всей Полноте

    и всем обитающим там славам,

    бесконечным Полнотам

    и неименуемым эонам,


    чтобы они вместе с нетленным родом именовали Отца четвёртым и называли семя Отца семенем великого Сифа.'
