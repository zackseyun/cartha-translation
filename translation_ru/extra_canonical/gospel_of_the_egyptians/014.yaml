    you have [cleansed me inside him]

    with your life,

    [in accord with your] indestructible [name].

    [Therefore], with him [is incense of life]

    that has mingled with baptismal [water] of [every] archon,

    [so that I might] live together with you in the [well-being of the holy ones],

    O eternal one [who exists],

    TRUTH TRULY.


    [The great Seth] wrote [this book], and deposited it on [a] high [mountain] where [the sun rises] not, nor [. . .], and [since the days of the] prophets [and . . . and the] apostles, [. . .] come forth [. . . and their] ear [has not heard] it.


    The great Seth wrote [this] [] [book] with letters [. . .]. He deposited [it . . .].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/014.yaml
  text: 'This is the book that the great Seth wrote and deposited high in the mountains, where the sun has not risen, nor is that (even) possible. Since the days of the prophets, apostles, and preachers, its name has not arisen in their hearts in the least, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the intention that, at the end of the times and eras, in agreement with the desire of the self-generated God and the complete Fullness, and by the gift of the inscrutable, ungraspable, fatherly will, it might come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and eternal light, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    Also restore the omitted witness markers in their respective locations: “the mystery] of [mysteries]. [7] They [appeared . . . who oversees . . .] and the aeons, TRUTH TRULY [8] [. . .], and TRUTH TRULY, [eternal] aeons”; “[. . .] AIA[. . .]THAŌTHŌSTH[. . .], [9]”; and “[. . .] TRUTH, [16]”.'
translation:
  language: ru
  text: 'Это книга, которую написал великий Сиф и спрятал высоко в горах, где солнце не восходило, да это и невозможно. Со времён пророков, апостолов и проповедников её имя нисколько не приходило им на сердце, да это и невозможно, и ухо их не слышало о ней.


    Великий Сиф записывал эту книгу письменами сто тридцать лет.[a] Он спрятал её на горе, называемой Хараксио, с тем чтобы в конце времён и эпох, согласно желанию Саморождённого Бога и всей Полноты и по дару неисследимой, непостижимой отеческой воли, она вышла на свет и явилась этому святому, нерушимому роду великого Спасителя и тем, кто пребывает с ними в любви, а также великому, невидимому, вечному Духу, Его Единородному Сыну и вечному Свету, […] и его великой, нерушимой спутнице, нерушимой Софии, Барбелон и всей Полноте — в вечности. Аминь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетелю: «написал эту книгу письменами в сто тридцать лет». Неясно, говорится ли о продолжительности работы, возрасте Сифа или иной хронологической формуле; требуется сверка с коптским текстом.'
    reason: Сохранить подлинную неясность необычной временной формулы и обозначить зависимость черновика от промежуточного свидетеля.
lexical_decisions:
- source_word: deposited
  choice: спрятал
  rationale: В контексте тайной книги, оставленной на горе до конца времён, естественное русское «спрятал» передаёт намеренное сокрытие; более буквальное «поместил» не выражает этого контекста.
- source_word: self-generated God
  choice: Саморождённый Бог
  rationale: Сохранён характерный для трактата технический термин без сведения его к более привычным богословским формулам.
- source_word: Fullness
  choice: Полнота
  rationale: Передано как термин и написано с прописной буквы, поскольку обозначает персонифицированную или космологическую полноту в понятийном мире текста.
- source_word: generation
  choice: род
  rationale: «Род» естественнее по-русски и сохраняет смысл общности происхождения, не уточняя его как историческое поколение.
- source_word: indestructible
  choice: нерушимый
  rationale: Слово передаёт неподверженность разрушению и звучит достоинственно; оно не подменено конфессионально нагруженным «нетленный».
- source_word: Sophia
  choice: София
  rationale: Имя/техническое обозначение сохранено транслитерацией, а не переведено как «Премудрость», чтобы не устранять возможную персонификацию.
- source_word: Barbelon
  choice: Барбелон
  rationale: Форма свидетеля сохранена транслитерацией; не нормализована к более распространённому «Барбело» без прямой коптской сверки.
theological_decisions:
- issue: Отношение перечисленных небесных лиц и сущностей в последнем предложении
  choice: Сохранена синтаксическая напряжённость перечисления без попытки выстроить однозначную иерархию или определить адресата явления книги.
  alternative: Перестроить фразу так, чтобы книга явно являлась либо только святому роду, либо всем последующим названным сущностям.
  rationale: Текст свидетеля грамматически труден и допускает более одного понимания; перевод не должен молча разрешать эту неоднозначность.
- issue: Род местоимения при «вечном Свете» и его спутнице
  choice: Использовано «его … спутнице», соотнося местоимение со Светом.
  alternative: «Её … спутнице», соотнося местоимение с книгой или иной сущностью.
  rationale: Такое согласование наиболее естественно в ближайшем контексте, но разрыв рукописи оставлен видимым, поскольку конструкция повреждена.
- issue: Титул «Единородный Сын»
  choice: Сохранён буквально как титул внутри собственной богословской системы произведения.
  alternative: Перефразировать как «единственный Сын».
  rationale: «Единородный» точнее сохраняет специфическую формулу свидетеля и не требует отождествления с её употреблением в канонических текстах.
