  register: Современный литературный русский с торжественным, но понятным колофонным звучанием. Квадратные скобки и многоточие сохранены как знак лакуны. Это предварительный перевод по предоставленному англоязычному свидетелю; прямая проверка коптского текста пока не выполнена.
