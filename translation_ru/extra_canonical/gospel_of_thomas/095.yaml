base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: ru
  text: 'Иисус сказал[a]: «Если у вас есть деньги, не давайте их в рост[b], а дайте тому, от кого вы не станете брать их обратно».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Иисус сказал» восстановлены там, где рукопись в начале изречения слегка повреждена.
    reason: lacuna_or_restoration
  - marker: b
    text: Буквально — «не давайте под процент». В древности соответствующее слово могло обозначать любой процент по займу, а не только чрезмерный.
    reason: cultural_note
  - marker: c
    text: 'Последнюю часть можно понять и так: «дайте тому, кто не вернёт их вам». Кроме того, повреждённое место перед словами об адресате допускает чтение с прямым дополнением «его/это» («дайте это»), тогда как нормализованный текст читается как «дайте ему».'
    reason: textual_variant
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: если
  rationale: Условный показатель вводит общее, а не определённо-временное условие.
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  choice: у вас есть деньги
  rationale: Естественная русская передача коптской экзистенциально-посессивной конструкции.
- source_word: ϩⲟⲙⲧ
  choice: деньги
  rationale: Слово может обозначать медь, монету или деньги; общий финансовый контекст требует собирательного «деньги».
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  choice: не давайте их в рост
  rationale: Идиома означает предоставление денег под проценты. Выражение «давать в рост» точно и понятно передаёт древний финансовый смысл без сужения до чрезмерного процента.
- source_word: ϯ ⲛⲛⲧⲟϥ
  choice: отдайте тому
  rationale: Передаёт дательный смысл нормализованного чтения «дайте ему/тому»; глагол «отдайте» естественно подразумевает ранее названные деньги и подчёркивает безвозвратность.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  choice: тому, от кого не станете брать их обратно
  rationale: 'Сохраняет наиболее естественное направление действия: адресат является тем, у кого говорящие впоследствии не заберут деньги. Местоимение «их» грамматически согласуется с русским множественным «деньги» и одновременно отражает коптский объект во множественном числе.'
theological_decisions:
- issue: 'Характер наставления: беспроцентный заём или безвозвратный дар'
  choice: а отдайте тому, от кого не станете брать их обратно
  alternative: а дайте тому, кто не вернёт их вам
  rationale: Выбранный вариант следует наиболее естественному синтаксическому разбору с субъектом второго лица множественного числа при ⲛⲁϫⲓ («вы возьмёте») и не превращает высказывание в утверждение о нежелании или неспособности получателя вернуть деньги.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным ритмом афористического наставления. Множественное обращение сохранено. Выражение «давать в рост» общеупотребительно в историко-нравственном контексте и разъяснено сноской.
