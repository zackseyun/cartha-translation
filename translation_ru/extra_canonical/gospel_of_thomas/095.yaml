    rationale: Коптское ϯ означает «дать». Русское «отдать» допустимо контекстуально, но вносит дополнительный оттенок передачи или возврата; простой глагол «дайте» ближе к источнику.
  - severity: medium
    issue: Неточная формулировка текстологической сноски о прямом дополнении
    rationale: Возможное рукописное чтение ⲙ[ⲙⲟϥ] содержит единственное местоимение («его/это»), тогда как сноска представляет его как русское множественное «их». Следует описать грамматический факт источника без искусственной подстановки русского числа.
