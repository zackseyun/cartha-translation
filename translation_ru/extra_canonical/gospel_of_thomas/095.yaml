revisions:
- from: 'Иисус сказал[a]: «Если у вас есть деньги, не давайте их в рост[b], а отдайте тому, от кого не станете брать их обратно».[c]'
  to: 'Иисус сказал[a]: «Если у вас есть деньги, не давайте их в рост[b], а дайте тому, от кого вы не станете брать их обратно».[c]'
  rationale: Замена «отдайте» на «дайте» устраняет добавленный смысловой оттенок и точнее воспроизводит ϯ. Сноска c исправлена так, чтобы возможное чтение ⲙ[ⲙⲟϥ] характеризовалось как единственное местоимение, при сохранении переводческой естественности «деньги — их» в основном тексте. Альтернативный разбор направления действия сохранён как именно возможный, а не навязанный.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: условие, наличие денег, запрет давать под проценты и противопоставленное этому предоставление денег без последующего взыскания. Однако «отдайте» несколько смещает значение простого коптского ϯ («дайте»), способно намекать на возврат чего-то уже принадлежащего адресату и не нужно для передачи оригинала. В сноске c реконструированное/вариантное прямое дополнение следует описывать как «его/это», а не как исходное «их»: в рукописи возможно ⲙ[ⲙⲟϥ], то есть единственное местоимение.'
  naturalness: «Не давать в рост» — естественное литературное выражение в нравственно-экономическом наставлении. «А дайте тому, от кого вы не станете брать их обратно» звучит по-русски ясно и сохраняет субъект действия («вы»); «деньги» нормативно допускает местоимение множественного числа «их».
  terminology: «Деньги» для ϩⲟⲙⲧ и «в рост» для предоставления под процент удачны. Имя Иисус и регистр соответствуют современному литературному русскому. Сноска о процентах корректно предотвращает сужение древнего значения до исключительно чрезмерного процента.
  issues:
