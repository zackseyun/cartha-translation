base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: ru
  text: 'Иисус сказал: «Двое будут покоиться на ложе: один умрёт, другой будет жить».


    Саломея сказала: «Кто ты, человек? Словно от одного[a], ты взошёл на моё ложе и ел с моего стола».


    Иисус сказал ей: «Я — тот, кто происходит от Равного[b]. Мне было дано из того, что принадлежит Моему Отцу».


    [Саломея сказала:][c] «Я твоя ученица».


    [Иисус сказал:][c] «Потому Я говорю: когда человек станет пустым[d], он наполнится светом; но когда станет разделённым, он наполнится тьмой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно (или: как) от одного». Возможно также понимание «словно от Единого»; коптский текст не устраняет эту неоднозначность.'
    reason: lexical_alternative
  - marker: b
    text: Коптское выражение может означать «Равный» или «то, что равно».
    reason: theological_note
  - marker: c
    text: В коптском тексте перед двумя последними репликами говорящие не названы. Обозначения «Саломея сказала» и «Иисус сказал» восстановлены по контексту.
    reason: textual_variant
  - marker: d
    text: В рукописи стоит «пустым, опустошённым», что создаёт игру смысла с «наполнится». Нередко предлагается исправление «равным», созвучное слову «Равный» выше и противопоставленное слову «разделённым».
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: ложе
  rationale: Передаёт кровать или возлежательное место и подходит как к отдыху, так и к трапезе; слово современно понятно и сохраняет достоинство стиля.
- source_word: ⲧⲉⲗⲟ
  choice: взошёл
  rationale: Отражает значение «подняться, взойти, занять место наверху/на ложе», не сводя действие к простому сидению.
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛⲟⲩⲁ
  choice: словно от одного
  rationale: Сохраняет необычную и неоднозначную конструкцию источника, не решая, означает ли «один» неопределённого человека или богословское Единство.
- source_word: ⲡⲉⲧϣⲏϣ
  choice: Равный
  rationale: Субстантивированное «то, что равно» передано как титульное «Равный»; примечание сохраняет возможное безличное понимание.
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: то, что принадлежит Моему Отцу
  rationale: Передаёт множественно-собирательную притяжательную конструкцию — «вещи/принадлежащее Моему Отцу» — без неестественного русского оборота.
- source_word: ϣⲏϥ
  choice: пустой
  rationale: Сохранено рукописное чтение от ϣⲱϥ «быть пустым, опустошённым», включая парадокс с последующим «наполнится».
- source_word: ⲡⲏϣ
  choice: разделённый
  rationale: Качественная форма глагола «делить»; точно противопоставляет внутреннюю разделённость предшествующему состоянию.
theological_decisions:
- issue: Значение ⲡⲉⲧϣⲏϣ
  choice: Равный
  alternative: то, что равно; Неразделённый
  rationale: Перевод сохраняет субстантивированное и потенциально титульное употребление, но не вводит в основной текст интерпретацию о конкретной метафизической системе.
- issue: Рукописное ϣⲏϥ и предполагаемая конъектура ϣⲏϣ
  choice: пустой
  alternative: равный; единый
  rationale: Сохранено засвидетельствованное рукописью чтение. Конъектура дала бы более явное противопоставление «равный/единый — разделённый», однако не должна молча заменять текст рукописи.
- issue: Необозначенные говорящие в двух последних репликах
  choice: предполагаемые обозначения говорящих даны в квадратных скобках
  alternative: оставить реплики без обозначения говорящих
  rationale: Контекст естественно указывает сначала на Саломею, затем на Иисуса, но квадратные скобки честно показывают, что этих обозначений нет в коптском тексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным синтаксисом. Архаизмы сведены к минимуму; «ложе» сохранено как точное и общеупотребительное в данном повествовательном контексте слово. Заглавные буквы в местоимениях «Я», «Моему» следуют русской библейской издательской традиции, не добавляя отдельного догматического толкования.
