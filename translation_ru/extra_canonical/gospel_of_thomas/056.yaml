base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: ru
  text: 'Иисус сказал: «Кто познал[b] мир, тот нашёл труп; а кто нашёл труп[a], того мир недостоин[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В первой части стоит неопределённая форма «труп», а во второй — определённая, вероятно отсылающая к тому же найденному трупу. В русском эта отсылка передана повтором слова «труп» без добавления указательного местоимения.
    reason: dialect_note
  - marker: b
    text: «Познал» передаёт завершённый, результативный оттенок ⲥⲟⲟⲩⲛ; более нейтральный вариант — «узнал».
    reason: lexical_alternative
  - marker: c
    text: 'Ср. Евр. 11:38: «те, которых весь мир не был достоин». Это не синоптическая параллель, а лишь тематически близкое выражение.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Стандартная коптская формула введения изречения передана русским прошедшим временем.
- source_word: ⲥⲟⲟⲩⲛ
  choice: познал
  rationale: Совершенный вид передаёт достигнутое состояние знания; «знает» ослабило бы результативный оттенок, а «пришёл к познанию» звучало бы тяжеловесно.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: мир
  rationale: Греческое заимствование kosmos в данном контексте означает «мир»; «космос» в современном русском вызвал бы неуместную ассоциацию с вселенной или космическим пространством.
- source_word: ϩⲉ
  choice: нашёл
  rationale: Прямой и естественный эквивалент со значением обнаружения; сохраняет краткость оригинала.
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: труп / этот труп
  rationale: «Труп» сохраняет резкость исходного образа. В первой части стоит неопределённая форма, во второй — определённая; русское «этот» естественно выражает обратную отсылку к уже названному трупу.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: того мир недостоин
  rationale: Передаёт устойчивое выражение «не быть достойным кого-либо» и сохраняет парадоксальную оценку человека по отношению к миру.
- source_word: ⲁⲩⲱ
  choice: а
  rationale: В данном параллельном построении русское «а» естественно связывает две части и яснее оттеняет переход ко второму условию, не добавляя смыслового противопоставления.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: кто …, тот … / кто …, того …
  rationale: Русская соотносительная конструкция естественно передаёт неопределённо-обобщающий смысл коптского относительного оборота.
theological_decisions:
- issue: Образ мира как трупа
  choice: Сохранить буквальный и резкий образ без истолковывающей добавки.
  alternative: Передать метафору пояснительно, например как духовную мёртвость мира.
  rationale: Текст не разъясняет природу метафоры; её истолкование в самом переводе устранило бы намеренную смысловую напряжённость.
- issue: Утверждение «мир недостоин» человека
  choice: Сохранить буквальную оценочную формулу.
  alternative: Перефразировать как превосходство над миром или освобождение от него.
  rationale: Такие перефразы вводили бы богословское объяснение, которого нет в исходном тексте.
translation_notes:
  register: Современный литературный русский язык; лаконичная, афористичная и достойная манера. Резкость слова «труп» и парадокс исходного изречения сохранены. Кавычки оформляют прямую речь; архаизмы и конфессионально окрашенные пояснения не добавлены.
