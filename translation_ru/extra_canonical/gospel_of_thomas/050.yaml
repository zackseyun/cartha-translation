    issue: «Утвердился» для ⲟⲩⲱϩⲉ ⲉⲣⲁⲧϥ
    rationale: Коптский глагол означает «стоять, встать». Русское «утвердился» вводит дополнительный смысл устойчивого учреждения или закрепления, которого текст не выражает. Безопаснее передать его как «встал», снабдив примечанием о частично восстановленном месте.
  - severity: low
    issue: Неполная лексическая пара для ϣⲱⲡⲉ
    rationale: «Произошли / возник» передаёт общий смысл, но не вполне сохраняет повтор одного и того же коптского глагола в вопросе и в описании света. «Возникли / возник» делает повтор явным без смешения с ⲉⲓ ⲉⲃⲟⲗ — «пришли».
