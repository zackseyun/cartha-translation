base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: ru
  text: 'Иисус сказал: «Если вам скажут: “Откуда вы возникли?”, ответьте им: “Мы пришли из света — из того места, где свет возник сам по себе, встал[a] и явился в их образе[b]”. Если вам скажут: “Вы — это?”, ответьте: “Мы — его дети и избранные живого Отца”. Если вас спросят: “Каков знак вашего Отца, пребывающего в вас?”, ответьте им: “Движение и покой”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи форма глагола «встал» частично восстановлена. Коптский глагол также можно передать как «стал» или «занял своё место».
    reason: lacuna_or_restoration
  - marker: b
    text: 'Буквально: «в их образе». К кому относится «их», из контекста неясно; поэтому множественное число сохранено.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: произошли / возник
  rationale: Передаёт возникновение или обретение бытия и сохраняет лексическую связь между происхождением учеников и возникновением света, отличая этот глагол от следующего ⲉⲓ ⲉⲃⲟⲗ — «пришли из».
- source_word: ⲉⲓ ⲉⲃⲟⲗ ϩⲛ
  choice: пришли из
  rationale: Естественно передаёт движение от источника и не смешивает этот оборот с ϣⲱⲡⲉ ⲉⲃⲟⲗ.
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: свет
  rationale: Прямое и стилистически уместное соответствие коптскому существительному.
- source_word: ⲟⲩⲱϩⲉ ⲉⲣⲁⲧϥ
  choice: утвердился
  rationale: Сохраняет значение «встал, стал, утвердился» и лучше вписывается в космогонический контекст, чем буквально-физическое «встал».
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: явился
  rationale: Передаёт проявление или становление явным без добавления внешнего деятеля, подразумеваемого формой «был явлен».
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: в их образе
  rationale: Сохраняет множественное притяжательное местоимение исходного текста и не устраняет неясность его антецедента.
- source_word: ⲡⲉϥϣⲏⲣⲉ
  choice: его дети
  rationale: В контексте множественного подлежащего передаёт родство естественным современным русским выражением; «сыновья» возможно, но звучит более гендерно маркированно.
- source_word: ⲛ̄ⲥⲱⲧⲡ
  choice: избранные
  rationale: Сохраняет субстантивированное значение «избранные» без введения специальной конфессиональной терминологии.
- source_word: ⲕⲓⲙ ... ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: движение и покой
  rationale: Передаёт два абстрактных понятия кратко и афористично; коптские неопределённые артикли здесь не требуют русских форм «одно движение» и «один покой».
theological_decisions:
- issue: Эллиптическое ⲛⲧⲱⲧⲛ ⲡⲉ
  choice: «Вы — это?»
  alternative: «Это вы?» / «Вы — оно?»
  rationale: Сохранена резкость и неопределённость именного сказуемого; местоимение «это» не навязывает ни личного, ни безличного референта.
- issue: Отец внутри адресатов
  choice: «вашего Отца, пребывающего в вас»
  alternative: «знак вашего Отца в вас»
  rationale: Относительная конструкция ⲉⲧϩⲛ̄ⲧⲏⲩⲧⲛ̄ определяет Отца, а не местонахождение знака; перевод сохраняет это синтаксическое и богословское утверждение.
- issue: Референт множественного местоимения в ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: «в их образе»
  alternative: «в своём образе» / «в его образе»
  rationale: Исходный текст имеет форму множественного числа, чей антецедент неясен; двусмысленность не устранена гармонизацией.
translation_notes:
  register: Современный литературный русский, сдержанный и афористичный. Синтаксис прямой речи сохранён ясным для обычного читателя; архаизмы и конфессионально нагруженные формулы избегаются. Прописная буква в слове «Отец» отражает личное обозначение в русской религиозной прозе, не добавляя отдельного догматического толкования.
