  source_fidelity: Перевод в целом точно передаёт структуру трёх вопросов и ответов, различает ϣⲱⲡⲉ («возникать, обретать бытие») и ⲉⲓ («приходить»), сохраняет эллиптичность вопроса «Вы — это?» и не разрешает неясный антецедент множественного «их». Однако «утвердился» заметно усиливает простой глагол «стоять / встать» (ⲟⲩⲱϩⲉ), придавая ему дополнительный смысл закрепления или утверждения.
  naturalness: Текст звучит как современный литературный русский и сохраняет афористическую краткость. «Откуда вы возникли?» несколько возвышенно, но в данном космогоническом контексте естественно и позволяет повторить «возник» о свете. «Встал» намеренно необычен применительно к свету, но точнее исходного глагола и уместно отмечен примечанием.
  terminology: «Свет», «образ», «дети», «избранные», «живой Отец», «движение и покой» переданы нейтрально и без конфессионально обусловленных добавлений. «Избранные» корректно отражает субстантивированное значение ⲡⲥⲱⲧⲡ.
  issues:
