  rationale: 'Исправлены два безопасных пункта: повтор ϣⲱⲡⲉ передан повтором «возникли / возник», а «утвердился» заменено на более буквальное «встал». Примечание a уточнено: частично восстановлена именно форма глагола, а не неопределённое выражение после слов «сам по себе». Остальные решения сохранены, поскольку они точно передают исходную неоднозначность и хорошо согласуются с английским аудиторским следом.'
