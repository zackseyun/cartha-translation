base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: ru
  text: 'Иисус сказал: «Покажите мне этот камень, который строители выбросили: он и есть краеугольный камень».[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дайте мне увидеть».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выбросили его»; это выражение часто переводят как «отвергли».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «камень угла».'
    reason: lexical_alternative
  - marker: d
    text: Ср. Пс. 117:22 по Септуагинте (Пс. 118:22 в иной нумерации); Мк. 12:10; Мф. 21:42; Лк. 20:17; Деян. 4:11; 1 Пет. 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: Покажите мне
  rationale: Коптская перифраза буквально означает «дайте мне увидеть»; естественный русский императив «покажите мне» сохраняет характер вызова, обращённого к неопределённому множеству слушателей.
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: этот камень
  rationale: Указательное местоимение ⲡⲁⲓ при слове «камень» передано прямо и сохраняет дейктическую выразительность изречения.
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: выбросили
  rationale: Глагольное сочетание буквально выражает действие «бросить наружу, выбросить»; этот образнее и ближе к коптскому тексту, чем традиционное «отвергли».
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: строители
  rationale: Субстантивированное «те, кто строит» естественно передаётся русским существительным «строители».
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: краеугольный камень
  rationale: Буквально «камень угла»; устойчивое русское библейское выражение «краеугольный камень» понятно читателю и сохраняет интертекстуальную связь.
theological_decisions:
- issue: Роль отвергнутого камня
  choice: он и есть краеугольный камень
  alternative: он стал краеугольным камнем
  rationale: Коптский текст содержит именную конструкцию тождества «он — камень угла», а не глагол становления. Перевод не добавляет временного перехода или явного указания на Божье действие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. «Выбросили» сохраняет яркость коптского глагола, а «краеугольный камень» — узнаваемую библейскую формулу. Местоимение «он» относится к камню; частица «и» подчёркивает парадокс тождества, не вводя дополнительного богословского толкования.
