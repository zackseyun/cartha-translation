  verdict: revise
  source_fidelity: 'Основной смысл передан точно: «царство Отца», женщина, малое количество закваски, сокрытие в тесте и итог в виде больших хлебов. Однако русское «сделала из него большие хлебы» создаёт ненужную двусмысленность: «него» может относиться к тесту, но конструкция звучит так, будто женщина непосредственно изготовила хлебы из теста, тогда как коптское «сделала это [так, что стало] большими хлебами» выражает результат действия закваски в тесте. Более нейтральная результативная формулировка лучше сохраняет исходную конструкцию без добавления «испекла».'
  naturalness: '«Большие хлебы» возможно, но в современном русском несколько шероховато; это допустимо ради буквальности и отражено в примечании. Формулировка «так что получилось много больших хлебов» была бы более плавной, но добавляла бы количественный оттенок к спорному ⲛⲟϭ. Поэтому предпочтительно сохранить «большие хлебы», слегка перестроив фразу: «и тесто превратилось в большие хлебы».'
  terminology: «Царство Отца», «женщина», «закваска», «тесто» и формула «У кого есть уши, пусть услышит» удачны. «Закваска» корректно передаёт ⲥⲓⲣ; культурное примечание уместно. Заглавная буква в «Отца» соответствует религиозному регистру, не меняя смысла.
