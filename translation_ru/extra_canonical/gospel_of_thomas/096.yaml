base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: ru
  text: 'Иисус сказал: «Царство Отца подобно женщине. Она взяла немного закваски[a], спрятала её в тесте, и тесто превратилось в большие хлебы[b].[c] У кого есть уши, пусть услышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Закваска» (ⲥⲓⲣ) — традиционная хлебная закваска, а не современные промышленные дрожжи.
    reason: cultural_note
  - marker: b
    text: Сочетание ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ можно также понять как «много хлеба» или «множество хлебов». Перевод «большие хлебы» сохраняет конкретный образ величины.
    reason: lexical_alternative
  - marker: c
    text: 'Некоторые буквы в рукописи на странице NHAM02.49 повреждены или восстановлены издателями; редакция читает: женщина спрятала закваску в тесте, и оно стало большими хлебами.'
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: царство
  rationale: Передаёт обычное в Евангелии от Фомы обозначение божественного царства или владычества, не устраняя заложенного в слове оттенка царствования.
- source_word: ⲡⲉⲓⲱⲧ
  choice: Отец
  rationale: Текст прямо употребляет мужское именование Бога; заглавная буква естественна для русского религиозного текста.
- source_word: ⲥϩⲓⲙⲉ
  choice: женщина
  rationale: Основное значение слова; контекст не требует перевода «жена».
- source_word: ⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: немного закваски
  rationale: Сочетание указывает на малое количество закваски.
- source_word: ⲥⲓⲣ
  choice: закваска
  rationale: Речь идёт о традиционной хлебной закваске, а не о современных промышленных дрожжах.
- source_word: ϩⲱⲡ
  choice: спрятала
  rationale: Сохраняет прямое значение «скрыть, спрятать» и краткость повествования.
- source_word: ϣⲱⲧⲉ
  choice: тесто
  rationale: В контексте приготовления хлеба это наиболее естественное обозначение замешанной массы.
- source_word: ⲉⲓⲣⲉ … ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: сделала из него большие хлебы
  rationale: Передаёт конструкцию результата без добавления отсутствующего в источнике глагола «испекла»; местоимение «него» естественно соотносится с тестом.
- source_word: ⲛⲟϭ
  choice: большие
  rationale: Сохраняет основной образ величины, хотя сочетание может также указывать на большое количество хлеба.
- source_word: ⲛⲟⲉⲓⲕ
  choice: хлебы
  rationale: Сохраняет выраженную в коптском множественность и не привносит более конкретную современную форму вроде «буханок».
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: У кого есть уши, пусть услышит
  rationale: Естественная и узнаваемая по-русски формула призыва не просто обладать слухом, но воспринять сказанное.
theological_decisions:
- issue: Смысл образа закваски и Царства
  choice: Не пояснять образ внутри перевода
  alternative: Явно истолковать его как незаметный рост или преображающее действие Царства
  rationale: Само изречение не раскрывает соответствие между деталями притчи; перевод сохраняет его открытость и богословское напряжение.
- issue: ⲙⲛⲧⲣⲣⲟ как царство или царствование
  choice: царство
  alternative: царствование / владычество
  rationale: «Царство» остаётся естественным и традиционным соответствием, не исключая динамического смысла царской власти.
translation_notes:
  register: Современный литературный русский язык с кратким, притчевым строем. Формулировки просты и торжественны без архаизмов; «большие хлебы» намеренно сохраняет необычную конкретность коптского выражения.
