revisions:
- from: 'Иисус сказал: «Царство Отца подобно женщине. Она взяла немного закваски[a], спрятала её в тесте и сделала из него большие хлебы[b].[c] У кого есть уши, пусть услышит».'
  to: 'Иисус сказал: «Царство Отца подобно женщине. Она взяла немного закваски[a], спрятала её в тесте, и тесто превратилось в большие хлебы[b].[c] У кого есть уши, пусть услышит».'
