base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: ru
  text: 'Иисус сказал: «Блаженны вы, когда они возненавидят вас и станут преследовать[a]; и они не найдут места в том месте[b], где преследовали вас[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Во всей последовательности коптский текст употребляет формы третьего лица множественного числа: «они возненавидят… будут преследовать… не найдут… преследовали». Такие формы могут также выражать неопределённое или пассивное действие; поэтому возможен перевод: «когда вас возненавидят и будут преследовать; и не найдётся места там, где вас преследовали».'
    reason: Грамматическая неоднозначность
  - marker: b
    text: 'В выражении «места в том месте» употреблены два разных слова: греческое заимствование ⲧⲟⲡⲟⲥ (топос) и исконное коптское ⲙⲁ. Первое в Евангелии от Фомы иногда может иметь более широкий, в том числе духовный, оттенок, но здесь точный смысл различия остаётся неясным.'
    reason: Лексическая неоднозначность
  - marker: c
    text: В отличие от близких изречений в Мф. 5:11 и Лк. 6:22, здесь не сказано, что преследование происходит «из-за Меня» или «ради Сына Человеческого».
    reason: Сопоставление с параллелями
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: блаженны
  rationale: Греческое заимствование μακάριος вводит формулу блаженства; «блаженны» сохраняет её узнаваемый, возвышенный характер.
- source_word: ⲙⲉⲥⲧⲉ-
  choice: возненавидят
  rationale: Обычное значение — «ненавидеть»; будущее совершенного вида естественно передаёт событие в придаточном с «когда».
- source_word: ⲇⲓⲱⲕⲉ
  choice: станут преследовать / преследовали
  rationale: Греческое заимствование от διώκω означает «преследовать»; одинаковый русский корень сохраняет повтор глагола в двух частях изречения.
- source_word: ϩⲉ ⲉ-
  choice: найдут
  rationale: Сочетание означает «найти, наткнуться на»; здесь нейтральное «найдут» точно соответствует контексту.
- source_word: ⲧⲟⲡⲟⲥ
  choice: места
  rationale: Греческое заимствование τόπος передано обычным русским словом «место», без навязывания конкретного пространственного или духовного смысла.
- source_word: ⲙⲁ
  choice: в том месте
  rationale: Исконное коптское слово также означает «место, местность»; повтор «места в том месте» сохраняет заметную игру двух исходных слов, хотя по-русски звучит намеренно необычно.
theological_decisions:
- issue: Активное или безлично-пассивное понимание форм третьего лица множественного числа
  choice: 'Активное: «они возненавидят… станут преследовать… они не найдут»'
  alternative: «Когда вас возненавидят и будут преследовать; и не найдётся места там, где вас преследовали»
  rationale: 'Формы третьего лица множественного числа могут служить коптским способом выражения неопределённого или пассивного действия. Активный перевод сохраняет одного грамматического деятеля во всей последовательности и не устраняет возможную иронию: преследователи сами не находят места. Альтернативное пассивное прочтение отмечено в сноске.'
- issue: Возможный богословский оттенок слова ⲧⲟⲡⲟⲥ
  choice: Оставить нейтральное «место» и отметить различие слов в сноске
  alternative: Истолковать как «духовное пристанище» или «положение»
  rationale: В Евангелии от Фомы слово может получать более широкий оттенок, однако данный контекст сам по себе не требует конкретного духовного толкования; перевод сохраняет неоднозначность.
- issue: Основание преследования
  choice: Не добавлять «из-за Меня» или иную причину
  alternative: Согласовать с синоптическими формулами блаженства о преследовании ради Иисуса или Сына Человеческого
  rationale: В коптском тексте такого уточнения нет; его добавление устранило бы значимое отличие этого изречения от синоптических параллелей.
translation_notes:
  register: Современный литературный русский язык с традиционной формулой блаженства «Блаженны вы». Синтаксический повтор «места в том месте» сохранён ради различия двух исходных лексем и напряжённой, загадочной формы изречения. Неясное «они» оставлено без добавленного референта, поскольку источник его не называет.
