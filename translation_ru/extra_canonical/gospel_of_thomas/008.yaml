base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: ru
  text: 'И он сказал: «Человек подобен мудрому рыбаку, который забросил свою сеть в море. Он вытащил её из моря, полную мелкой рыбы. Среди них мудрый рыбак нашёл одну большую, хорошую рыбу. Он сбросил всю мелкую рыбу вниз, в море[a], и без труда выбрал большую рыбу. У кого есть уши, чтобы слышать, пусть слышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вниз, в море». В рукописи слово «вниз» частично утрачено (ⲉ[ⲡⲉ]ⲥⲏⲧ), однако его восстановление считается надёжным.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: человек
  rationale: Определённая форма употреблена обобщённо. Русское «человек» естественно передаёт родовое значение без ненужного уточнения пола.
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: мудрый рыбак
  rationale: ⲟⲩⲱϩⲉ означает рыбака, а ⲣⲙⲛϩⲏⲧ — буквально «человек сердца/ума», то есть мудрый или разумный.
- source_word: ⲡⲉϥⲁⲃⲱ
  choice: свою сеть
  rationale: Притяжательная форма указывает на сеть самого рыбака; русское возвратное «свою» точно и естественно передаёт это отношение.
- source_word: ϩⲉ ⲉ-
  choice: нашёл
  rationale: Идиома буквально означает «наткнулся на», но в данном контексте естественное значение — «нашёл».
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: хорошую
  rationale: Форма описывает рыбу как хорошую, отменную; «хорошую» сохраняет простоту исходного повествования и не вводит явно не названную денежную ценность.
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: без труда
  rationale: Сочетание греческого χωρὶς «без» и коптского ϩⲓⲥⲉ «труд, тягота» прямо означает «без труда/затруднения».
theological_decisions:
- issue: Соотношение с притчей о неводе в Мф 13:47–48
  choice: Сохранён рассказ Фомы об одном мудром рыбаке и одной большой хорошей рыбе.
  alternative: Согласовать текст с Матфеем, введя разделение хорошей и плохой рыбы или мотив последнего суда.
  rationale: Коптский текст говорит не о хорошей и плохой рыбе и не объясняет притчу как образ суда. Гармонизация устранила бы самостоятельное напряжение и смысловую открытость этого изречения.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной интонацией. Синтаксис намеренно остаётся близким к краткой форме притчи; заключительная формула передана в привычном библейском звучании без архаизации.
