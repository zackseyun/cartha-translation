base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: ru
  text: 'Иисус сказал: «Тот, кто близок ко мне[a], близок к огню[b], а тот, кто далёк от меня, далёк от царства[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи употреблены формы «ко мне» (ⲉⲣⲟⲓ) и «от меня» (ⲙ̄ⲙⲟⲓ); в нормализованном тексте они представлены конструкциями с самостоятельными местоимениями. Смысл противопоставления от этого не меняется.
    reason: textual_variant
  - marker: b
    text: Ср. образ огня в Лк 12:49; это лишь тематическая параллель, а данное изречение самостоятельно.
    reason: cross_reference
  - marker: c
    text: Коптское ⲙⲛⲧⲣⲣⲟ может также означать «царствование» или «царская власть». В рукописи и нормализованном тексте различается форма определённого артикля при этом слове (ⲧ-/ⲡ-).
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲏⲛ
  choice: близок
  rationale: Стативная форма обозначает близость, а не движение или приближение; краткое «близок» сохраняет параллелизм изречения.
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: ко мне / от меня
  rationale: Предложно-местоименные формы передают направленное соотношение — к говорящему и от него; такая передача сохраняет противопоставление оригинала.
- source_word: ⲥⲁⲧⲉ
  choice: огонь
  rationale: Основное значение слова — «огонь»; вариант «пламя» был бы неоправданным уточнением образа.
- source_word: ⲟⲩⲏⲩ
  choice: далёк
  rationale: Краткая форма естественно противопоставлена слову «близок» и сохраняет афористический ритм.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: царство
  rationale: Слово может обозначать царство, царствование или царскую власть. «Царство» естественно в данном контексте, а более широкая смысловая возможность отмечена в сноске.
- source_word: ⲡⲉⲧ-
  choice: тот, кто
  rationale: Эта конструкция передаёт единично-обобщённое относительное выражение и сохраняет размеренную форму параллельных частей.
theological_decisions:
- issue: Значение образа огня
  choice: Образ сохранён без истолкования.
  alternative: Уточнить огонь как суд, очищение или божественное присутствие.
  rationale: Само изречение не определяет значение огня; конкретизация устранила бы подлинную богословскую многозначность.
- issue: Смысл слова «царство»
  choice: Употреблено строчное «царство» без добавления «Божье».
  alternative: «Царство Божье» или «Царствие».
  rationale: В коптском тексте стоит только определённое «царство»; добавление определения внесло бы отсутствующую в источнике конкретизацию, а форма «царствие» менее современна.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и афористичный. Местоимение «мне» написано со строчной буквы по обычной современной норме. Повтор слов «близок» и «далёк» намеренно сохраняет строгий параллелизм коптского текста.
