base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: ru
  text: 'Иисус сказал: «Город, построенный на высокой горе[a] и укреплённый, не может пасть[b] и не сможет быть скрыт[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом фрагменте этого изречения (P.Oxy. 1) сказано: «на вершине высокой горы»; в коптском тексте слова «на вершине» отсутствуют.'
    reason: textual_variant
  - marker: b
    text: Ср. Мф. 5:14 и Мф. 7:24–25. У Фомы образ города, который нельзя скрыть, соединён с образом укреплённого сооружения, которое не может пасть.
    reason: cross_reference
  - marker: c
    text: 'В коптском тексте заключительная часть стоит в будущем времени («не сможет быть скрыт»), тогда как греческий фрагмент употребляет настоящее время для обоих глаголов: «не может ни пасть, ни быть скрытым».'
    reason: textual_variant
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: построенный
  rationale: Оборот ⲉⲩⲕⲱⲧ ⲙ̄ⲙⲟⲥ буквально описывает город как тот, который строят; русское страдательное причастие естественно передаёт определительное значение.
- source_word: ⲧⲟⲟⲩ
  choice: гора
  rationale: Обычное значение слова — «гора» или «холм»; определение ⲉϥϫⲟⲥⲉ прямо обозначает её как высокую, поэтому выбрано «высокая гора».
- source_word: ϫⲓⲥⲉ
  choice: высокая
  rationale: Качественная форма мужского рода согласуется с ⲧⲟⲟⲩ («гора») и означает «быть высоким».
- source_word: ⲧⲁϫⲣⲟ
  choice: укреплённый
  rationale: Качественная форма женского рода относится к городу и означает «сделанный прочным, укреплённый»; выбор сохраняет как строительный, так и оборонительный оттенок.
- source_word: ϩⲉ
  choice: пасть
  rationale: 'В конструкции ⲙⲛ̄ ϭⲟⲙ ⲛ̄ⲥϩⲉ выражена невозможность падения: «он не может пасть».'
- source_word: ϩⲱⲡ
  choice: быть скрыт
  rationale: Страдательная формулировка сохраняет значение «скрывать» и не приписывает городу намерения скрыться; будущее время передаёт коптское ⲥⲛⲁϣϩⲱⲡ⳿ ⲁⲛ.
theological_decisions:
- issue: Согласование с Матфея 5:14
  choice: не может пасть и не сможет быть скрыт
  alternative: не может укрыться
  rationale: Перевод сохраняет отличительные элементы Фомы — укреплённость города и невозможность его падения — и не сводит изречение к формулировке Матфея.
- issue: Образ укреплённого города
  choice: укреплённый
  alternative: прочный
  rationale: Коптское слово допускает значение твёрдости и упроченности; «укреплённый» естественно сочетается с городом и сохраняет образ защищённого сооружения, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Сохранено различие времён между «не может пасть» и «не сможет быть скрыт», а также отличительная для Фомы характеристика города как укреплённого.
