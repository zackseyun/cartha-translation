base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: ru
  text: 'Иисус сказал: «Пусть ищущий не перестаёт искать, пока не найдёт. И когда найдёт, придёт в смятение[b]; и когда придёт в смятение, изумится; и будет царствовать над всем[c]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом фрагменте POxy 654 сказано: «он будет поражён … и, воцарившись, обретёт покой», тогда как коптский текст говорит о смятении и изумлении и завершается без упоминания покоя.'
    reason: textual_variant
  - marker: b
    text: 'Или: «будет потрясён», «будет встревожен». Здесь этот глагол передан отлично от следующего — «изумится».'
    reason: lexical_alternative
  - marker: c
    text: Буквально — «над всем» или «над целым»; возможно, имеется в виду совокупность всего сущего, мироздание.
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉⲛⲧⲟϥⲗⲟ
  choice: пусть … не перестаёт
  rationale: Отрицательная юссивная конструкция третьего лица выражает пожелание-повеление «пусть не прекращает», не вводя подразумеваемого адресата, которому велено кого-либо удерживать.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  choice: ищущий
  rationale: Субстантивированное причастное выражение передано кратко и естественно, с сохранением обобщённого характера изречения.
- source_word: ⲉⲣⲉⲛⲧⲟϥϣⲓⲛⲉ ϣⲁⲛⲧⲉⲛⲧⲟϥϭⲓⲛⲉ
  choice: искать, пока не найдёт
  rationale: Передаёт продолжающееся действие и временной предел, выраженный ϣⲁⲛⲧⲉ, без лишнего пояснения предмета поиска.
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: прийти в смятение
  rationale: Выражение передаёт внутреннюю потрясённость или тревогу и ясно отличается от следующего глагола изумления.
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: изумиться
  rationale: Сохраняет значение удивления и ступенчатое развитие парадоксального изречения после смятения.
- source_word: ⲣ̄ⲣⲣⲟ
  choice: царствовать
  rationale: Передаёт именно образ царского владычества, а не более общее «управлять».
- source_word: ⲉϫⲛⲡⲧⲏⲣϥ
  choice: над Всем
  rationale: Субстантивированное «Всё» сохраняет возможный смысл совокупности всего сущего и характерный для текста лаконичный космологический оборот.
theological_decisions:
- issue: Смысл выражения ⲡⲧⲏⲣϥ
  choice: Всё как совокупность всего сущего, без дальнейшего определения
  alternative: мир; вселенная; всё сущее
  rationale: Источник не уточняет, идёт ли речь строго о космосе, миропорядке или всеобщей совокупности; форма «Всё» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный и торжественный синтаксис. Повтор «когда придёт в смятение» сохранён ради параллелизма исходного текста. Местоимение мужского рода не повторяется там, где русская глагольная форма однозначно указывает на того же ищущего.
