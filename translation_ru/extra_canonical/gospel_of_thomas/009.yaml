  verdict: revise
  source_fidelity: 'В целом перевод бережно передаёт особые черты коптского текста: наполнение руки, птиц, которые собирают семена, вертикальные образы корня и колосьев, червя и числа урожая. Однако в заключении придаточное «поднявшийся к небу» грамматически относится к «плоду», тогда как коптское «дала плод … к небу» сохраняет образ действия земли/произрастания, не уточняя, что именно плод физически поднялся.'
  naturalness: Современный литературный русский в основном естественен. «Наполнил руку» намеренно необычно, но оправдано буквальной телесной деталью источника. В заключении лучше избежать тяжёлой и чрезмерно конкретизирующей конструкции «плод, поднявшийся к небу».
  terminology: «Сеятель», «колосья», «колючки», «червь» и «меры» уместны. «Добрая земля» соответствует исходному определению хорошей земли. Числа не следует гармонизировать с синоптическими вариантами.
  issues:
  - severity: medium
    issue: Синтаксическое переосмысление образа в заключении
    rationale: Фраза «добрый плод, поднявшийся к небу» приписывает подъём самому плоду. Исходник говорит, что хорошая земля дала плод «вверх, к небу», сохраняя необычный вертикальный образ, но не требует такого уточнения референта. Более нейтральное «дала добрый плод — к небу» сохраняет исходную необычность без добавленного образа.
  revised_text: 'Иисус сказал: «Вот, вышел сеятель. Он наполнил руку[a] и бросил семена. Одни упали на дорогу; прилетели птицы и собрали их[b]. Другие упали на камень: они не пустили корень вниз, в землю, и не подняли колосьев вверх, к небу[c]. Другие упали на колючки; те заглушили семя, и червь съел их[d]. А другие упали на добрую землю, и она дала добрый плод — к небу: урожай составил шестьдесят мер и сто двадцать мер[e]».'
