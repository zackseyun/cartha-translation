base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: ru
  text: 'Иисус сказал: «Вот, вышел сеятель. Он наполнил руку[a] и бросил семена. Одни упали на дорогу; прилетели птицы и собрали их[b]. Другие упали на камень: они не пустили корень вниз, в землю, и не подняли колосьев вверх, к небу[c]. Другие упали на колючки; те заглушили семя, и червь съел их[d]. А другие упали на добрую землю, и она дала добрый плод — к небу: урожай составил шестьдесят мер и сто двадцать мер[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Деталь о том, что сеятель наполнил руку, присутствует в версии Фомы и отсутствует в синоптических параллелях.
    reason: textual_variant
  - marker: b
    text: В коптском тексте птицы «собрали» или «подобрали» семена, а не съели их.
    reason: textual_variant
  - marker: c
    text: Буквально изображено движение корня вниз, в землю, и колосьев вверх, к небу — характерная особенность этой версии притчи.
    reason: textual_variant
  - marker: d
    text: Упоминание червя, съевшего семена среди колючек, — особая деталь версии Фомы.
    reason: textual_variant
  - marker: e
    text: Коптский текст говорит о шестидесяти и ста двадцати мерах; перевод не заменяет эти числа синоптическими вариантами урожайности.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲥⲓⲧⲉ
  choice: сеятель
  rationale: Передаёт лицо, совершающее посев, естественным и устойчивым русским словом.
- source_word: ⲙⲉϩⲧⲟⲟⲧϥ
  choice: наполнил руку
  rationale: Сохраняет конкретную телесную деталь коптского текста, не добавляя предполагаемого сосуда или пригоршни.
- source_word: ⲕⲁⲧϥⲟⲩ
  choice: собрали их
  rationale: Передаёт значение «собирать, подбирать» и не заменяет его знакомым по синоптическим параллелям «склевали/съели».
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  choice: подняли колосьев
  rationale: Естественно передаёт буквальный образ выпускания колосьев вверх и сохраняет противопоставление корня внизу и колосьев наверху.
- source_word: ⲱϭⲧ
  choice: заглушили
  rationale: В контексте растений естественно выражает удушение семени колючками; возможное более буквальное «задушили» звучало бы менее естественно.
- source_word: ϥⲛⲧ
  choice: червь
  rationale: Прямое соответствие коптскому существительному в единственном числе.
- source_word: ⲉⲥⲟⲧⲉ
  choice: мер
  rationale: Сохраняет выражение урожайности через меру и не гармонизирует его с синоптическим «во столько-то крат».
theological_decisions:
- issue: Согласование с синоптической притчей о сеятеле
  choice: 'Сохранены отличительные детали версии Фомы: птицы собирают семена, корни направлены вниз, колосья и плод — к небу, семена съедает червь, урожай выражен шестьюдесятью и ста двадцатью мерами.'
  alternative: 'Гармонизировать с Матфеем, Марком или Лукой: птицы склёвывают семена, урожай даётся во столько-то крат.'
  rationale: Коптское свидетельство имеет собственные формулировки и образы; их нельзя молча заменять каноническими параллелями.
- issue: Референт местоимения после упоминания червя
  choice: «червь съел их», то есть упавшие семена.
  alternative: «червь съел его», согласуя с собирательным «семя».
  rationale: Во всём рассказе отдельные посеянные зёрна обозначаются множественным числом; русский перевод сохраняет эту связь, хотя рядом стоит собирательное «семя».
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя, при этом сохранены необычные пространственные образы и расхождения версии Фомы. «К небу» выбрано вместо более архаичного «к небесам»; «колючки» — вместо книжного «терние».
