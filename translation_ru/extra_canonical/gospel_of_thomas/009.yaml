revisions:
- from: 'Иисус сказал: «Вот, вышел сеятель. Он наполнил руку[a] и бросил семена. Одни упали на дорогу; прилетели птицы и собрали их[b]. Другие упали на камень: они не пустили корень вниз, в землю, и не подняли колосьев вверх, к небу[c]. Другие упали на колючки; те заглушили семя, и червь съел их[d]. А другие упали на добрую землю, и она принесла добрый плод, поднявшийся к небу: урожай составил шестьдесят мер и сто двадцать мер[e]».'
  to: 'Иисус сказал: «Вот, вышел сеятель. Он наполнил руку[a] и бросил семена. Одни упали на дорогу; прилетели птицы и собрали их[b]. Другие упали на камень: они не пустили корень вниз, в землю, и не подняли колосьев вверх, к небу[c]. Другие упали на колючки; те заглушили семя, и червь съел их[d]. А другие упали на добрую землю, и она дала добрый плод — к небу: урожай составил шестьдесят мер и сто двадцать мер[e]».'
  rationale: Исправлена только заключительная формулировка, чтобы не приписывать подъём к небу самому плоду. Сохранены все смысловые элементы коптского текста и все имеющиеся корректно привязанные сноски.
