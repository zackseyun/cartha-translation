  yaml_path: translation/extra_canonical/gospel_of_thomas/022.yaml
  text: Jesus saw some little ones being suckled[a]. He said to his disciples, “These little ones who are being suckled are like those who are to enter the Kingdom.” They said to him, “Shall we, being little ones, enter the Kingdom?” Jesus said to them, “When you make the two one; and when you make the inner like the outer and the outer like the inner, and the upper like the lower; and when you make the male and the female into a single one, so that the male is not male and the female not female; and when you make eyes in the place of an eye, and a hand in the place of a hand, and a foot in the place of a foot[h][g][f][e][d][c][b], and an image in the place of an image—then you will enter the Kingdom.”
translation:
  language: ru
  text: 'Иисус увидел малышей, которых кормят грудью[a], и сказал своим ученикам: «Эти малыши, которых кормят грудью, подобны тем, кто входит в Царство[b]».


    Они спросили его: «Мы, будучи малыми, войдём в Царство?»


    Иисус сказал им: «Когда вы сделаете двоих одним; когда сделаете внутреннее подобным внешнему, а внешнее — внутреннему, и верхнее — нижнему[c]; когда сделаете мужское и женское одним-единственным, так чтобы мужское не было мужским, а женское — женским; когда сделаете глаза вместо глаза, руку вместо руки, ступню вместо ступни и образ вместо образа[d] — тогда вы войдёте в Царство[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение обозначает грудное кормление; возможный более буквальный перевод: «малышей, которых сосут у груди».'
    reason: lexical_alternative
  - marker: b
    text: Коптское ⲙⲛⲧⲣⲣⲟ может означать также «царствование» или «царскую власть», хотя здесь говорится о вхождении в него.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сторону верха (или неба) — как сторону низа». Возможен перевод: «небесное — земному». В тексте нет отдельной пары «переднее — заднему».'
    reason: textual_clarification
  - marker: d
    text: «Образ» передаёт ⲟⲩϩⲓⲕⲱⲛ — греческое заимствование, которое можно перевести также как «изображение» или «икона».
    reason: lexical_alternative
  - marker: e
    text: Последнее слово «Царство» частично повреждено в рукописи и восстановлено по сохранившимся буквам и контексту.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲕⲟⲩⲓ
  choice: малыши / малые
  rationale: Основное значение — «малый, маленький». В сцене кормления речь идёт о младенцах, поэтому в повествовании естественно «малыши»; в вопросе учеников сохранено более широкое и необычное «будучи малыми».
- source_word: ϫⲓⲉⲣⲱⲧⲉ
  choice: сосущие грудь
  rationale: Выражение конкретно обозначает грудное кормление. Русская формулировка передаёт наблюдаемое действие яснее, чем общее «вскармливаемые».
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Существительное буквально обозначает царствование или царскую власть, но в данном изречении представлено как то, куда входят. «Царство» сохраняет обе ассоциации и естественно звучит по-русски.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: сделаете двоих одним
  rationale: Сохранена краткая парадоксальная формула источника без поясняющего истолкования. Мужской род «двоих» отражает субстантивированное «два», тогда как последующие пары переданы средним родом.
- source_word: ⲛϩⲟⲩⲛ / ⲛⲃⲟⲗ
  choice: внутреннее / внешнее
  rationale: Передаёт пространственную и символическую противоположность, не сводя её к конкретному толкованию.
- source_word: ⲡⲥⲁ ⲛⲧⲡⲉ / ⲡⲥⲁ ⲙⲡⲓⲧⲛ
  choice: верхнее / нижнее
  rationale: Источник содержит одну противопоставленную пару, буквально связанную с верхом и низом; отдельная пара «переднее/заднее» текстом не поддерживается.
- source_word: ⲡϩⲟⲟⲩⲧ / ⲥϩⲓⲙⲉ
  choice: мужское / женское
  rationale: Субстантивированные прилагательные сохраняют параллелизм и не добавляют социально-ролевого смысла слов «мужчина» и «женщина».
- source_word: ϩⲓⲕⲱⲛ
  choice: образ
  rationale: Греческое заимствование означает образ или изображение. «Образ» достаточно широко и сохраняет потенциальный антропологический или изобразительный смысл.
theological_decisions:
- issue: Смысл превращения «двоих в одно» и последующих пар
  choice: Сохранить образный и парадоксальный язык без пояснения
  alternative: Истолковать как духовное единство, устранение пола или восстановление первозданного состояния
  rationale: Само изречение не раскрывает, к какой именно антропологической или богословской схеме относятся эти противопоставления.
- issue: Отрицание в формуле о мужском и женском
  choice: 'Передать отрицание для обоих членов: «мужское не было мужским, а женское — женским»'
  alternative: 'Понять второй член положительно: «а женское было женским»'
  rationale: Синтаксис второй части допускает формальную напряжённость, однако параллельная структура и цель превращения в «одно-единственное» поддерживают распространение отрицания на оба члена. Русский эллипсис сохраняет компактность источника.
- issue: Царство как место или царствование
  choice: Царство
  alternative: царствование / царская власть
  rationale: Глагол «входить» придаёт понятию пространственный оттенок, хотя исходное абстрактное существительное может обозначать власть или царствование; примечание сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. Повторы сохранены как часть ритма изречения; необычные телесные соответствия не сглажены и не истолкованы. Прописная буква в слове «Царство» служит устойчивому русскому религиозному употреблению, не уточняя конфессиональное понимание.
