base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: ru
  text: 'Ученики сказали Иисусу: «Скажи нам, каким будет наш конец». Он сказал: «Разве вы нашли начало, что ищете конца? Ведь в том месте, где находится начало, там будет и конец. Блажен тот, кто встанет перед ним в начале:[a] он познает конец и не вкусит смерти».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто встанет перед ним в начале». Местоимение «ним» может относиться к «началу» либо к подразумеваемому Первому или Истоку.'
    reason: Важная грамматическая и смысловая неоднозначность не должна быть скрыта или разрешена переводчиком.
  - marker: b
    text: «Вкусить смерть» — образное выражение со значением «испытать смерть».
    reason: Пояснение сохраняет исходную метафору и одновременно делает её смысл доступным современному читателю.
lexical_decisions:
- source_word: ⲡϩⲁⲏ
  choice: конец
  rationale: Сохраняет прямое противопоставление слову ⲡⲁⲣⲭⲏ «начало» и не вводит более истолковывающих вариантов «цель» или «завершение».
- source_word: ⲡⲁⲣⲭⲏ
  choice: начало
  rationale: Естественно передаёт греческое заимствование ἀρχή и сохраняет повтор и смысловую перекличку с «концом».
- source_word: ϭⲱⲗⲡ
  choice: нашли
  rationale: Основное значение — «найти, обнаружить»; «нашли» поддерживает краткость и риторическую остроту вопроса.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: ищете конец
  rationale: Естественная русская передача конструкции «искать за/после», без ненужного добавления «отыскиваете».
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  choice: там, где …
  rationale: Передаёт явную локативную конструкцию исходного текста современным и ясным русским оборотом.
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Блажен
  rationale: Сохраняет достоинство макаризма и привычный библейский регистр, не сводя смысл к эмоциональному «счастлив».
- source_word: ⲁⲱϩⲉ / ϩⲱϩⲉ
  choice: встанет
  rationale: Прямо передаёт значение «стоять, занять положение» и сохраняет образ исходного текста.
- source_word: ⲉⲣⲁⲧϥ ϩⲛ ⲡⲁⲣⲭⲏ
  choice: встанет пред ним в начале
  rationale: В отличие от сглаженного «встанет в начале», сохраняет местоименный суффикс мужского рода и тем самым подлинную неоднозначность его референта.
- source_word: ⲥⲟⲟⲩⲛ
  choice: познает
  rationale: Передаёт «знать» в возвышенном, но понятном регистре и уместно сочетается с загадочным характером изречения.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: не вкусит смерти
  rationale: Сохраняет устойчивый образный оборот исходного текста, означающий переживание смерти.
- source_word: ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ
  choice: Так вы уже … что …?
  rationale: Русская конструкция передаёт риторический нажим и логическую связь вопроса, не перегружая его отдельными частицами «итак» и «ведь».
theological_decisions:
- issue: Соотношение начала и конца
  choice: Сохранить пространственно-временную формулу «там, где начало, будет и конец» без объяснения.
  alternative: Истолковать начало как божественный Исток, а конец — как эсхатологическое завершение.
  rationale: Исходный текст допускает метафизическое и эсхатологическое прочтения, но не выбирает между ними явно.
- issue: Референт местоимения в ⲉⲣⲁⲧϥ
  choice: Сохранить «пред ним», оставив референт неопределённым.
  alternative: Опустить местоимение («кто встанет в начале») либо уточнить «пред Началом/пред Первым».
  rationale: Суффикс 3-го лица мужского рода может отсылать к грамматически мужскому «началу» или подразумеваемому Первому/Истоку; явное уточнение разрешило бы напряжение, которого источник не разрешает.
- issue: «Не вкусит смерти»
  choice: Сохранить традиционный образ без уточнения природы смерти.
  alternative: Передать как «не испытает смерти» или истолковать как обещание физического либо духовного бессмертия.
  rationale: Фраза утверждает непричастность смерти, но не определяет здесь её точный богословский смысл.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным и устным, как подобает диалогу, но ключевые повторы «начало — конец» и образ «вкусить смерть» сохранены. Архаизмы ограничены формулой «Блажен» и идиомой «не вкусит смерти», которые остаются понятными и стилистически уместными.
