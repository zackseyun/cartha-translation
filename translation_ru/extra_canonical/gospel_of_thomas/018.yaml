revisions:
- from: 'Ученики сказали Иисусу: «Скажи нам, каким будет наш конец». Он сказал: «Так вы уже нашли начало, что ищете конец? Ведь там, где начало, будет и конец.[a] Блажен тот, кто встанет пред ним в начале:[b] он познает конец и не вкусит смерти».[c]'
  to: 'Ученики сказали Иисусу: «Скажи нам, каким будет наш конец». Он сказал: «Разве вы нашли начало, что ищете конца? Ведь в том месте, где находится начало, там будет и конец. Блажен тот, кто встанет перед ним в начале:[a] он познает конец и не вкусит смерти».[b]'
  rationale: Восстановлена явная пространственная формула оригинала в основном тексте; поэтому прежняя сноска a стала излишней и удалена. Риторический вопрос переформулирован для современного литературного русского без невыраженного в источнике «уже». Сноски переякорены последовательно; неоднозначность местоимения и образ «вкусить смерть» сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены противопоставление «начала» и «конца», риторический вопрос, макаризм, неоднозначное местоимение при «стоять» и идиома «вкусить смерть». Однако в основном тексте опущена явная локативная формула ϩⲛ ⲡⲙⲁ … ⲙⲙⲁⲩ («в том месте, где …, там …»), хотя она отмечена в сноске. Её следует передать в самом переводе, а не компенсировать примечанием.'
  naturalness: '«Так вы уже нашли начало, что ищете конец?» звучит в современном русском несколько сбивчиво: сочетание «так … что» может читаться как следствие, а добавленное «уже» не выражено прямо. Риторическое «Разве вы нашли начало, что ищете конца?» естественнее и точнее. «Перед ним» — современнее, чем «пред ним», при сохранении той же неоднозначности.'
  terminology: «Блажен», «начало», «конец» и «не вкусит смерти» уместны и хорошо сохраняют регистр и ключевые повторы оригинала. «Познает» допустимо в литературно-библейском регистре и не требует замены.
  issues:
  - severity: medium
    issue: Локативная структура исходного текста вынесена из перевода в сноску.
    rationale: 'Коптский текст прямо говорит: «в том месте, где находится начало, там будет конец». Сокращение до «там, где начало, будет и конец» ослабляет повтор «там» и явное «место»; это существенная формальная особенность изречения.'
  - severity: low
    issue: Риторический вопрос передан не вполне естественной конструкцией и содержит добавление «уже».
    rationale: В исходнике нет отдельного лексического эквивалента «уже»; частицы создают риторический нажим. «Разве вы нашли начало, что ищете конца?» передаёт этот нажим без добавочного временного оттенка.
  revised_text: 'Ученики сказали Иисусу: «Скажи нам, каким будет наш конец». Он сказал: «Разве вы нашли начало, что ищете конца? Ведь в том месте, где находится начало, там будет и конец. Блажен тот, кто встанет перед ним в начале:[a] он познает конец и не вкусит смерти».[b]'
  revised_footnotes:
