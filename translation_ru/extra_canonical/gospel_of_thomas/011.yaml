base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: ru
  text: 'Иисус сказал: «Это небо[a] минует, и небо над ним минует. Мёртвые не живы, а живые не умрут. В тот день, когда вы ели мёртвое, вы оживляли его[b]. Когда вы окажетесь в свете, что вы сделаете?[c] В тот день, когда вы были одним, вы стали двумя[d]. Но когда вы станете двумя, что вы сделаете?»[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Это небо» можно также перевести как «этот небосвод». Следующие слова — «небо над ним» — предполагают представление о нескольких небесных уровнях, поэтому в тексте выбрано слово «небо».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делали его живым». Местоимение «его», вероятнее всего, относится к «мёртвому», которое ели.'
    reason: lexical_alternative
  - marker: c
    text: 'В коптском тексте при глаголе имеется объектное местоимение: возможно, оно избыточно либо отсылает к свету или к ранее упомянутому живому. Поэтому возможны также переводы: «что вы с ним сделаете?» или «что вы сделаете с этим?»'
    reason: lexical_alternative
  - marker: d
    text: 'Выражение, буквально означающее «делать одного», может значить «быть одним» или «стать одним». Некоторые понимают всю фразу как относящуюся к будущему: «когда вы станете одним, вы станете двумя», однако форма второго глагола лучше согласуется с отнесением к прошлому.'
    reason: alternative_reading
  - marker: e
    text: В последнем вопросе рукопись употребляет форму другого глагола, который может означать «брать» или «поступать с чем-либо», тогда как в предыдущем вопросе стоит обычный глагол «делать». По контексту вопрос, вероятно, повторяется; возможно, перед нами орфографический вариант или особенность переписчика.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: это небо
  rationale: ⲡⲉ означает «небо/небосвод»; указание на находящееся над ним поддерживает космологический смысл «небо», тогда как указательное значение передано словом «это».
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: минует
  rationale: Будущая форма греческого заимствования передаёт исчезновение или прохождение; «минует» сохраняет торжественный эсхатологический оттенок, не уточняя механизм исчезновения.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ … ⲥⲉⲟⲛϩ ⲁⲛ / ⲛⲉⲧⲟⲛϩ ⲥⲉⲛⲁⲙⲟⲩ ⲁⲛ
  choice: мёртвые не живы, а живые не умрут
  rationale: Сохранён лаконичный параллелизм рукописи и различие между настоящим отрицанием в первой части и будущим во второй.
- source_word: ⲟⲩⲱⲙ
  choice: ели
  rationale: Прямой и стилистически нейтральный эквивалент, сохраняющий резкость образа.
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: оживляли его
  rationale: Каузативная конструкция буквально означает «делали его живым»; русский глагол «оживляли» естественно передаёт тот же смысл и сохраняет объектное местоимение.
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁⲛϣⲱⲡⲉ ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: когда вы окажетесь в свете
  rationale: Проспективно-ингрессивная конструкция передана будущим «окажетесь», а ⲡⲟⲩⲟⲉⲓⲛ — обычным и символически ёмким словом «свет».
- source_word: ⲉⲓⲣⲉ ⲛ̄ⲟⲩⲁ … ⲉⲓⲣⲉ ⲙ̄ⲡⲥⲛⲁⲩ
  choice: были одним … стали двумя
  rationale: Числительные сохранены как предикативные существительные, чтобы не заменять загадочную формулировку толкованием вроде «были едины» или «разделились».
theological_decisions:
- issue: Смысл противопоставления мёртвого и живого
  choice: Оставить парадокс без поясняющей конкретизации
  alternative: Понимать «мёртвое» исключительно как пищу, а «живых» — исключительно как духовно живых людей
  rationale: Текст намеренно сближает телесное поедание, жизнь и смерть; уточнение разных референтов сняло бы присущую изречению напряжённость.
- issue: Смысл становления одним и двумя
  choice: Сохранить числовые образы буквально
  alternative: Передать как единство и разделение тела, души, пола или иных начал
  rationale: Само изречение не называет, что именно обозначают «один» и «два»; конкретная антропологическая или конфессиональная интерпретация была бы привнесена в перевод.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Сохранены повторения, параллелизм и загадочная числовая образность; архаизмы и поясняющие богословские термины не вводились.
