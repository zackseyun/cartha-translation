base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: ru
  text: 'Иисус сказал: «Я бросил огонь на мир[a], и вот[b], я стерегу его[c], пока он не разгорится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Лк. 12:49: «Огонь пришёл Я низвести на землю…» Здесь, однако, сказано «на мир», а далее говорится: «я стерегу его, пока он не разгорится».'
    reason: cross_reference
  - marker: b
    text: Коптское указательное выражение можно также передать словами «смотрите», «взгляните» или более торжественным «се».
    reason: lexical_alternative
  - marker: c
    text: Глагол ϩⲁⲣⲉϩ может означать также «охраняю», «берегу» или «наблюдаю за ним».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: Я бросил
  rationale: Глагол означает «бросать, метать»; прошедший вид «бросил» передаёт завершённое действие, а отдельное «я» сохраняет эмфатическое местоимение.
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: огонь
  rationale: Основное значение — «огонь»; в русском неопределённость не требует отдельного артикля.
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: на мир
  rationale: Предлог передаёт направленность «на», а греческое заимствование ⲕⲟⲥⲙⲟⲥ здесь естественно переводится как «мир».
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: вот
  rationale: Указательное междометие привлекает внимание; «вот» звучит естественно и сохраняет краткость исходного выражения.
- source_word: ϩⲁⲣⲉϩ
  choice: стерегу
  rationale: Слово охватывает значения «стеречь, охранять, наблюдать»; «стерегу» сохраняет и длительность, и возможный защитный оттенок.
- source_word: ⲉⲛⲧⲟϥ
  choice: его
  rationale: Местоимение третьего лица относится к огню; русский мужской род требует формы «его».
- source_word: ϣⲁⲛⲧⲉ
  choice: пока … не
  rationale: Оборот обозначает временной предел и естественно передаётся русской конструкцией «пока не».
- source_word: ϫⲉⲣⲟ
  choice: разгорится
  rationale: Глагол обозначает воспламенение или разгорание; «разгорится» передаёт достижение яркого горения лучше, чем нейтральное «загорится».
theological_decisions:
- issue: Символическое значение огня
  choice: Не истолковывать образ в самом переводе
  alternative: Уточнить огонь как суд, очищение, разделение или духовное просвещение
  rationale: Исходный текст не объясняет образ; конкретизация сняла бы намеренную богословскую многозначность.
- issue: Отношение Иисуса к огню
  choice: Сохранить буквальное и несколько напряжённое «стерегу его»
  alternative: Сгладить как «поддерживаю его» или «слежу, чтобы он горел»
  rationale: Такие варианты заранее объясняют цель действия, тогда как исходный глагол допускает значения охраны, хранения и наблюдения.
translation_notes:
  register: Современный литературный русский с кратким, афористичным синтаксисом. «Стерегу» намеренно сохраняет образную напряжённость и не объясняет символ огня. Все примечания отмечены в основном тексте.
