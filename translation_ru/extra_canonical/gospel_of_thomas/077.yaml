  to: 'Иисус сказал: «Я — свет, который над всеми. Я — Всё[a]. Из Меня вышло Всё, и ко Мне пришло Всё[b]. Расколи кусок дерева — Я там. Подними камень — и найдёшь Меня там[c]».'
