base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: ru
  text: 'Иисус сказал: «Я — свет, который над всеми. Я — Всё[a]. Из Меня вышло Всё, и ко Мне пришло Всё[b]. Расколи кусок дерева — Я там. Подними камень — и найдёшь Меня там[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Всё» — обозначение всей полноты сущего.'
    reason: Уточняет необычное субстантивированное употребление без навязывания метафизического толкования.
  - marker: b
    text: В коптском один и тот же по форме глагол употреблён сначала в значении «достичь, прийти», а затем — в значении «расколоть»; эту игру слов по-русски сохранить невозможно.
    reason: Поясняет значимую игру слов исходного текста.
  - marker: c
    text: В греческом фрагменте P.Oxy. 1 повеления поднять камень и расколоть дерево стоят в обратном порядке и присоединены к концу изречения 30.
    reason: Отмечает существенное различие между коптским текстом и греческим параллельным свидетельством.
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ ⲡⲁⲓ ⲉⲧϩⲓϫⲱⲟⲩ ⲧⲏⲣⲟⲩ
  choice: свет, который над всеми
  rationale: Передаёт пространственное «над» и множественное «всеми», не подменяя образ более отвлечённым толкованием.
- source_word: ⲡⲧⲏⲣϥ
  choice: Всё
  rationale: Субстантивированное обозначение всей полноты сущего; прописная буква сохраняет его особое, абсолютное употребление, не превращая его в технический термин иной традиции.
- source_word: ⲡⲱϩ (ϣⲁⲣⲟⲉⲓ)
  choice: пришло
  rationale: В первом употреблении глагол означает достижение или прибытие к кому-либо. «Пришло ко Мне» естественно по-русски и сохраняет направленность.
- source_word: ⲡⲱϩ (ⲛ̄ⲛⲟⲩϣⲉ)
  choice: расколи
  rationale: Во втором употреблении омонимичная форма означает расколоть или расщепить. Русский не позволяет сохранить коптскую игру одинаковых форм без искусственности.
- source_word: ϣⲉ
  choice: дерево
  rationale: Слово может обозначать дерево или древесину; в сочетании с повелением «расколи» русское «дерево» сохраняет конкретность и образную открытость.
- source_word: ϥⲓ ... ⲉϩⲣⲁⲓ
  choice: подними
  rationale: Глагол с направительным наречием выражает поднятие вверх; «подними» точно и естественно передаёт сочетание.
- source_word: ϩⲉ ⲉ-
  choice: найдёшь
  rationale: Конструкция означает найти, наткнуться на; это не глагол зрения.
theological_decisions:
- issue: Отождествление говорящего с ⲡⲧⲏⲣϥ
  choice: «Я — Всё»
  alternative: «Я — всё сущее» / «Я — целое»
  rationale: Краткая абсолютная формула сохраняет напряжённость и широту исходного утверждения, не снабжая его конфессиональным или метафизическим разъяснением.
- issue: Отношение «Всего» к Иисусу
  choice: «Из Меня вышло Всё, и ко Мне пришло Всё»
  alternative: «Всё произошло из Меня и достигло Меня»
  rationale: Сохраняются оба направления — происхождение из говорящего и движение к нему, — без попытки согласовать их с определённой богословской системой. Порядок слов отражает эмфазу коптского второго перфекта.
- issue: Присутствие Иисуса в дереве и у камня
  choice: буквальная передача «Я там» и «найдёшь Меня там»
  alternative: истолковать как символическое либо онтологическое присутствие
  rationale: Источник не поясняет характер присутствия; перевод оставляет эту двусмысленность читателю.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и достоинственным синтаксисом. Местоимения, относящиеся к Иисусу в прямой речи, написаны с прописной буквы как умеренная русская религиозно-литературная норма; архаизмы и конфессионально маркированная терминология исключены.
