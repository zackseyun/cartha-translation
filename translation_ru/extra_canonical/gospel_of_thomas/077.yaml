review_pass:
  verdict: revise
  source_fidelity: 'Содержание передано точно: «свет ... над всеми», отождествление с «Всем», исхождение всего из говорящего и достижение его, а также повеления расколоть дерево и поднять камень сохранены. «Подними» и «найдёшь» верно передают ϥⲓ ... ⲉϩⲣⲁⲓ и ϩⲉ ⲉ-. Однако «дерево» в русском прежде всего обозначает растущее дерево, тогда как ⲛⲟⲩϣⲉ здесь означает древесину/кусок дерева; безопаснее уточнить «кусок дерева».'
  naturalness: Текст звучит современно, кратко и афористично. Замена «Расколи дерево» на «Расколи кусок дерева» одновременно естественнее в данном контексте и точнее. Сноску об игре слов следует привязать к первому из двух омонимичных употреблений, а не к «Всё».
  terminology: «Всё» удачно сохраняет субстантивированную абсолютную форму ⲡⲧⲏⲣϥ без навязывания богословской интерпретации. «Свет», «расколи», «подними» и «найдёшь» терминологически и стилистически уместны.
