base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: ru
  text: 'Иисус сказал: «Тому, кто хулит Отца, будет прощено[a], и тому, кто хулит Сына, будет прощено. Но тому, кто хулит Святого Духа, не будет прощено ни на земле, ни на небе[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в коптском: «они простят ему». Неопределённое «они» здесь служит обычным способом выразить пассивное значение: «ему будет прощено».'
    reason: register_note
  - marker: b
    text: 'В коптском тексте стоит именно пространственная формулировка «ни на земле, ни на небе»; ср. отличающуюся временную формулировку в Мф. 12:32: «ни в этом веке, ни в будущем».'
    reason: textual_note
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  choice: хулит
  rationale: Коптский глагол означает «хулить, богохульствовать, проклинать». Русское «хулит» точно передаёт религиозный смысл и естественно сочетается с дополнениями «Отца», «Сына» и «Святого Духа».
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: будет прощено
  rationale: Идиома означает «простить». Активная форма третьего лица множественного числа служит в коптском языке способом выражения пассивного значения, поэтому по-русски естественно передана безлично-пассивной конструкцией.
- source_word: ⲡⲕⲁϩ
  choice: земля
  rationale: В космической паре с небом слово обозначает землю как противоположность небу.
- source_word: ⲧⲡⲉ / ⲡⲡⲉ
  choice: небо
  rationale: Обычное значение коптского слова; здесь оно образует пространственную пару с землёй.
theological_decisions:
- issue: Пространственная или временная формулировка заключения
  choice: ни на земле, ни на небе
  alternative: ни в этом веке, ни в будущем
  rationale: Перевод сохраняет засвидетельствованную коптским текстом пространственную пару и не заменяет её временной формулировкой синоптической параллели.
- issue: Объект хулы
  choice: хулит Отца / Сына / Святого Духа
  alternative: говорит против Отца / Сына / Святого Духа
  rationale: Глагольное выражение ϫⲓⲟⲩⲁ имеет специальное значение хулы; более общее «говорит против» ослабило бы его смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор синтаксической конструкции сохранён ради ритма и смыслового противопоставления; архаические формы и конфессионально окрашенные уточнения не вводились.
