base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: ru
  text: 'Один человек сказал ему[a]: «Скажи моим братьям[b], чтобы они разделили со мной имущество[c] моего отца». Он сказал ему: «Человек, кто поставил меня делить?» Затем он повернулся[d] к своим ученикам и сказал им: «Ведь я не тот, кто делит, не так ли?»[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова «один человек сказал» в рукописи частично восстановлены из-за небольшого повреждения текста.
    reason: lacuna_or_restoration
  - marker: b
    text: В рукописном тексте — «моим братьям» во множественном числе; в нормализованной версии строки стоит «моему брату» в единственном числе.
    reason: textual_variant
  - marker: c
    text: Коптское слово может также означать «владения» или, в данном семейном контексте, «наследство».
    reason: lexical_alternative
  - marker: d
    text: Различие между формами глагола в рукописном и нормализованном текстах отражает диалектное или орфографическое варьирование и не меняет смысла «повернулся».
    reason: dialect_note
  - marker: e
    text: 'Частица ⲙⲏ вводит риторический вопрос, предполагающий отрицательный ответ: «Я ведь не тот, кто делит, не так ли?»'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁϥ
  choice: Один человек сказал ему
  rationale: Стандартная коптская формула речи; «один человек» естественно передаёт неопределённость ⲟⲩⲣⲱⲙⲉ.
- source_word: ⲛ̄ⲛⲁⲥⲛⲏⲩ / ⲛⲡⲁⲥⲟⲛ
  choice: моим братьям
  rationale: В рукописном печатном тексте стоит множественное число; расхождение с нормализованной формой отмечено в сноске.
- source_word: ⲡⲱϣⲉ ⲛ̄ⲛ̄ϩⲛⲁⲁⲩ
  choice: разделили … имущество
  rationale: ⲡⲱϣⲉ означает «делить, распределять», а ϩⲛⲁⲁⲩ — имущество или владения; нейтральное «имущество» не добавляет отсутствующей юридической конкретики.
- source_word: ⲛ̄ⲣⲉϥⲡⲱϣⲉ
  choice: тот, кто делит / делить
  rationale: Агентивная конструкция буквально обозначает человека, который делит. Русское «разделитель» здесь неестественно, а «судья» недопустимо гармонизировало бы изречение с Лк 12:14.
- source_word: ⲁϥⲕⲟⲧϥ̅
  choice: он повернулся
  rationale: Идиоматичная передача возвратного глагола движения без утраты его направленного значения.
- source_word: ⲙⲏ
  choice: Ведь … не так ли?
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; русская конструкция сохраняет это ожидание.
theological_decisions:
- issue: Роль Иисуса в споре о разделе имущества
  choice: «кто поставил меня делить?»
  alternative: «кто поставил меня судьёй или посредником?»
  rationale: Источник называет только совершающего раздел и не содержит слова «судья»; перевод не гармонизирует Фому с параллелью у Луки.
- issue: Заключительный вопрос ученикам
  choice: «Ведь я не тот, кто делит, не так ли?»
  alternative: «Вот, я не разделитель»
  rationale: ⲙⲏ здесь лучше понимать как показатель риторического вопроса с ожидаемым отрицательным ответом, а не как указательное «вот».
translation_notes:
  register: Современный литературный русский язык с краткой, слегка резкой интонацией диалога. Неестественное существительное «разделитель» заменено агентивным оборотом «тот, кто делит», который сохраняет повтор ключевого корня и не привносит судебной терминологии.
