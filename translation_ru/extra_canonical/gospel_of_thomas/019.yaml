- from: 'Иисус сказал: «Блажен тот, кто возник прежде, чем возник.[a] Если вы станете Моими учениками и будете слушать Мои слова, эти камни послужат вам.[b] Ведь у вас есть в раю пять деревьев: они не движутся ни летом, ни зимой, и листья их не опадают. Кто познает их, тот не вкусит смерти».[c]'
