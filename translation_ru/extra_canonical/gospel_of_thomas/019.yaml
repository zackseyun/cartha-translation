base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: ru
  text: 'Иисус сказал: «Блажен тот, кто возник прежде, чем возник.[a] Если вы станете моими учениками и будете слушать моё слово, этот камень послужит вам.[b] Ведь у вас есть в раю пять деревьев: они не движутся ни летом, ни зимой, и листья их не опадают. Кто познает их, тот не вкусит смерти».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Блажен тот, кто возник прежде, чем он возник». В основе парадокса — двукратное употребление глагола ϣⲱⲡⲉ («стать, возникнуть, прийти в бытие»).'
    reason: lexical_alternative
  - marker: b
    text: 'Нормализованный текст читает единственное число: «моё слово, этот камень». Рукописная графия в этом месте может быть разделена иначе и допускает множественное чтение: «мои слова, эти камни».'
    reason: textual_variant
  - marker: c
    text: «Вкусит смерти» — буквальное сохранение коптского образного оборота; ср. Мф. 16:28; Мк. 9:1.
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: блажен
  rationale: Греческое заимствование имеет характерную для изречений о блаженстве окраску; «блажен» сохраняет торжественный афористический тон.
- source_word: ϣⲱⲡⲉ
  choice: возник
  rationale: Глагол означает «стать, возникнуть, прийти в бытие». Повтор одного и того же русского глагола сохраняет намеренный парадокс и не сужает смысл до рождения.
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: если вы станете
  rationale: Условно-временная конструкция допускает оттенок «если/когда»; «если» отчетливо передает условность контекста.
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: учениками
  rationale: Обычный русский эквивалент греческого заимствования, уместный в речении Иисуса.
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: слушать
  rationale: Передает внимательное восприятие речи, не добавляя прямо значения «повиноваться».
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: Мои слова / эти камни
  rationale: Перевод следует чтению сохранившейся рукописной строки во множественном числе; редакционное нормализованное чтение в единственном числе отмечено в сноске.
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: послужат
  rationale: Естественно передает заимствованный глагол со значением служения, сохраняя необычный образ камней.
- source_word: ⲕⲓⲙ
  choice: движутся
  rationale: Сохраняет прямое значение «двигаться, колебаться» и не подменяет его более толковательным «изменяться».
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: вкусит смерти
  rationale: Сохраняет устойчивый образный оборот исходного текста, знакомый также по синоптической традиции.
theological_decisions:
- issue: Парадокс о существовании прежде возникновения
  choice: Сохранить буквальное повторение «возник прежде, чем возник»
  alternative: Истолковать как предсуществование или как рождение
  rationale: Исходный текст не объясняет, идет ли речь о предсуществовании, самопознании или иной антропологии; перевод не должен устранять эту богословскую неопределенность.
- issue: Пять деревьев в раю
  choice: Сохранить образ без идентификации
  alternative: Отождествить деревья с чувствами, добродетелями или духовными сущностями
  rationale: В самом речении отсутствует объяснение символа, поэтому конфессиональное или эзотерическое толкование не вводится.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического речения. Намеренная странность образов и синтаксический парадокс сохранены, но фразы сделаны понятными для обычного читателя. Прописная буква в «Моими» соответствует принятому русскому библейскому регистру и не добавляет отдельного догматического утверждения.
