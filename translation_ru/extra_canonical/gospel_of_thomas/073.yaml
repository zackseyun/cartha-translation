base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: ru
  text: 'Иисус сказал: «Жатва обильна, а работников мало. Просите же господина[a], чтобы он послал работников на жатву»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское слово можно перевести и как «Господа». Здесь выбрано «господина» в соответствии с образом хозяина, посылающего работников.
    reason: lexical_alternative
  - marker: b
    text: В отличие от параллельных изречений в Мф. 9:38 и Лк. 10:2, здесь после слова «господина» нет слов «жатвы», а перед последним словом «жатву» — местоимения «его».
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: жатва
  rationale: Обычное значение — «жатва, сбор урожая»; слово сохраняет земледельческий образ и естественно звучит по-русски.
- source_word: ⲛⲁϣⲱϥ / ⲛⲁϣⲉⲛⲧⲟϥ
  choice: обильна
  rationale: Форма означает, что жатвы много; «обильна» передаёт количество и соответствует земледельческому контексту.
- source_word: ⲉⲣⲅⲁⲧⲏⲥ
  choice: работники
  rationale: Заимствованное из греческого слово обозначает работников или тружеников; современное «работники» ясно и нейтрально.
- source_word: ⲥⲟⲃⲕ
  choice: мало
  rationale: Передаёт малочисленность работников; русская предикативная конструкция «работников мало» естественнее буквального «работники немногочисленны».
- source_word: ⲥⲟⲡⲥ
  choice: просите
  rationale: Глагол означает настойчиво просить, умолять; «просите» сохраняет прямое повеление без излишне архаичного оттенка, а контекст выражает настойчивость.
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: господина
  rationale: Слово допускает значения «господин, хозяин» и титульное «Господь». Строчная форма «господина» соответствует образу земледельческого хозяйства, а альтернативное прочтение отмечено в сноске.
- source_word: ⲛⲟⲩϫⲉ ... ⲉⲃⲟⲗ
  choice: послал
  rationale: Буквально сочетание может означать «выбросить наружу», но в отношении направления работников к жатве идиоматически значит «послать, выслать».
theological_decisions:
- issue: 'Значение ⲡϫⲟⲉⲓⲥ: хозяин или Господь'
  choice: господина
  alternative: Господа
  rationale: Контекст допускает хозяина, распоряжающегося работниками, но слово также является обычным коптским обозначением Господа. Основной текст не навязывает титульное толкование, а сноска сохраняет богословскую неоднозначность.
- issue: Принадлежность жатвы господину
  choice: не добавлять «его» или «свою»
  alternative: «на его жатву» / «на свою жатву» по синоптическим параллелям
  rationale: В коптском тексте перед последним словом «жатва» нет притяжательного элемента; добавление разрешило бы связь, которую данный свидетель прямо не выражает.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Сохранён земледельческий образ; избегаются как церковнославянизмы («делатели», «умоляйте»), так и разговорная стилистика. Строчная форма «господина» не устраняет возможного титульного прочтения, которое явно отмечено в сноске.
