base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: ru
  text: 'Иисус сказал: «Несчастно тело, которое зависит от тела,[a] и несчастна душа, которая зависит от этих двух[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Зависит от»: коптское ⲉⲓϣⲉ (ⲁϣⲉ) с ⲛ перед объектом также можно перевести как «опирается на» или «покоится на».'
    reason: lexical_alternative
  - marker: b
    text: «Этих двух» указывает, по-видимому, на два тела из первой части — тело, которое зависит, и тело, от которого оно зависит, — а не на тело и душу.
    reason: cultural_note
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: несчастно / несчастна
  rationale: Греческое заимствование ταλαίπωρος означает «несчастный, жалкий, бедственный». «Несчастно» сохраняет резкую отрицательную оценку и естественно звучит по-русски в форме краткого сказуемого.
- source_word: ⲥⲱⲙⲁ
  choice: тело
  rationale: Обычное соответствие греческому заимствованию σῶμα.
- source_word: ⲉⲓϣⲉ (ⲁϣⲉ) + ⲛ
  choice: зависит от
  rationale: Конструкция может обозначать опору на что-либо или зависимость от него. Этот перевод передаёт продолжающееся отношение, не навязывая значения происхождения.
- source_word: ⲯⲩⲭⲏ
  choice: душа
  rationale: Греческое заимствование ψυχή здесь естественно передать словом «душа», сохраняя противопоставление телу.
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: этих двух
  rationale: Указательное выражение с числительным «два» буквально отсылает к двум участникам отношения в первой части изречения.
theological_decisions:
- issue: К чему относится выражение «этих двух»
  choice: 'Сохранена грамматическая отсылка к двум телам: зависимому телу и телу, от которого оно зависит.'
  alternative: Понять выражение как отсылку к телу и душе.
  rationale: 'Ближайшая предшествующая пара заключена в первой части: одно тело зависит от другого. Перевод не перестраивает эту намеренно трудную формулировку.'
translation_notes:
  register: Современный литературный русский язык с краткими именными сказуемыми, сохраняющими афористичность и параллелизм оригинала. Слово «другого» добавлено для естественного русского выражения двух раздельных участников при сохранении смысла неопределённого ⲟⲩⲥⲱⲙⲁ («некое/другое тело»).
