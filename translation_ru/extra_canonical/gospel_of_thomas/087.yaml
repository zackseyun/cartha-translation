    rationale: Сноска поясняет именно выражение «этих двух», поэтому якорь следует поместить сразу после этих слов.
  - severity: low
    issue: Формулировка сноски a неточно описывает управление.
    rationale: Лучше прямо назвать коптский показатель/предлог ⲛ, а не неопределённо говорить «с дополнением».
