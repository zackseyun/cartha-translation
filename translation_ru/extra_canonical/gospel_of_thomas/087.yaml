  source_fidelity: В первой клаузе ⲛⲟⲩⲥⲱⲙⲁ означает «на/от тела, некоего тела»; слово «другого» прямо не выражено и вносит уточнение, которого коптский текст не требует. Остальная передача сохраняет параллелизм, значение ⲯⲩⲭⲏ («душа») и намеренно трудную отсылку «этих двух».
  naturalness: Краткие сказуемые «несчастно/несчастна» уместны в современном литературном русском для афористического изречения. Сноску об «этих двух» лучше поставить непосредственно после соответствующего выражения, а не после всего предложения.
  terminology: «Тело», «душа» и «зависит от» адекватны. «Зависит от» допустимо передаёт ⲉⲓϣⲉ + ⲛ, при этом сноска корректно отмечает варианты со значением опоры или покоя.
