revisions:
- from: 'Иисус сказал: «Несчастно тело, которое зависит от другого тела,[a] и несчастна душа, которая зависит от этих двух».[b]'
  to: 'Иисус сказал: «Несчастно тело, которое зависит от тела,[a] и несчастна душа, которая зависит от этих двух[b]».'
  rationale: Убрано невыраженное в коптском определение «другого», чтобы сохранить неопределённость исходного «тела». Якорь пояснительной сноски перенесён к поясняемому выражению; формулировка лексической сноски уточнена без изменения смысла.
