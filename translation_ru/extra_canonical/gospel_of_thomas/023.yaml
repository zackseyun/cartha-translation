revisions:
- from: 'Иисус сказал: «Я изберу вас — одного из тысячи и двоих из десяти тысяч. И они[a] встанут как одно целое[b]».'
  to: 'Иисус сказал: «Я изберу вас — одного из тысячи и двоих из десяти тысяч; и они[a] встанут как один[b]».'
  rationale: Заменено интерпретирующее «как одно целое» на более близкое и естественное «как один». Пунктуация приведена в соответствие с единым синтаксическим ходом коптского изречения; смена лица и её сноска сохранены.
