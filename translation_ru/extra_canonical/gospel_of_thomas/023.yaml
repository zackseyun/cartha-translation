base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: ru
  text: 'Иисус сказал: «Я изберу вас — одного из тысячи и двоих из десяти тысяч; и они[a] встанут как один[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В коптском тексте здесь происходит резкий переход от второго лица («вас») к третьему («они»).
    reason: Сохранение грамматической особенности источника.
  - marker: b
    text: 'Буквально: «будучи одним-единственным». Выражение указывает на единство, не разъясняя его природу.'
    reason: Пояснение буквальной формы богословски значимого выражения без навязывания толкования.
lexical_decisions:
- source_word: ⲥⲱⲧⲡ / ⲥⲉⲧⲡ-
  choice: изберу
  rationale: Глагол означает «выбирать, избирать». «Изберу» сохраняет возвышенный регистр изречения, не добавляя к нему конфессионально обусловленного толкования.
- source_word: ϣⲟ
  choice: тысячи
  rationale: Обычное коптское обозначение числа 1000.
- source_word: ⲧⲃⲁ
  choice: десяти тысяч
  rationale: Коптское обозначение числа 10 000; яснее для современного читателя, чем книжное «мириады».
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: встанут
  rationale: Устойчивое коптское сочетание со значением «стоять, встать на ноги»; местоименный элемент относится к их ногам, а не означает «перед вами».
- source_word: ⲉⲩⲟ ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: как одно целое
  rationale: Передаёт состояние единства естественным современным русским языком. Буквальный образ «одного-единственного» пояснён в сноске, чтобы не утратить значимую для текста формулировку.
theological_decisions:
- issue: Смысл выражения ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: как одно целое
  alternative: как один; будучи одним-единственным
  rationale: Фраза описывает единство, но источник не объясняет его природу. Перевод сохраняет образ цельности, не уточняя, идёт ли речь о духовном соединении, согласии или иной форме единства.
- issue: Переход от второго лица к третьему
  choice: 'сохранён: «вас» — «они»'
  alternative: согласовать как «вы встанете»
  rationale: Резкая смена лица присутствует в коптском тексте. Её исправление устранило бы подлинную грамматическую и смысловую напряжённость изречения.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным изречения ритмом. Двоеточие после «вас» раскрывает количественную формулу выбора; отдельное предложение подчёркивает сохранённую смену грамматического лица. Региональная форма местоимения во втором лице множественного числа не отражена отдельной сноской, поскольку не меняет смысла русского перевода.
