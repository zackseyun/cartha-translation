    rationale: Формула придаёт выражению значение групповой цельности. Коптское ⲟⲩⲁ ⲟⲩⲱⲧ буквально «один-единственный»; его смысловая сфера не ограничена таким пониманием.
  - severity: low
    issue: Разделение на два предложения
    rationale: В источнике это единое высказывание, соединённое «и». Точка с запятой сохраняет его связь и всё же делает резкую смену лица заметной.
