  verdict: revise
  source_fidelity: Количественная формула и намеренный переход от «вас» ко множественному третьему лицу переданы верно. Однако «как одно целое» несколько истолковывает ⲟⲩⲁ ⲟⲩⲱⲧ как коллективную целостность; исходное выражение буквально говорит об «одном-единственном» и не уточняет характер этого единства.
  naturalness: «Как один» — естественная для современного литературного русского формула, особенно при множественном субъекте, и сохраняет лаконичность изречения. Точка после количественной формулы чрезмерно разрывает связанное коптское высказывание; точка с запятой лучше отмечает смену лица, не отделяя заключительную характеристику.
  terminology: «Изберу» уместно для ⲥⲱⲧⲡ. «Один из тысячи» и «двое из десяти тысяч» точно передают числительные. «Как один» ближе к устойчивому выражению ⲟⲩⲁ ⲟⲩⲱⲧ, чем «как одно целое», не навязывая объяснения.
