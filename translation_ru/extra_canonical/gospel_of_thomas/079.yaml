base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: ru
  text: 'Женщина в толпе сказала ему: «Блаженна утроба, носившая тебя, и груди, кормившие тебя». Он сказал ей: «Блаженны те, кто услышали слово Отца и сохранили его в истине.[a] Ибо настанут дни, когда вы скажете: „Блаженна утроба, которая не зачала,[b] и груди, которые не давали молока“».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Сохранили его в истине» можно также передать: «уберегли его», «соблюли его» или «поистине сохранили его».'
    reason: lexical_alternative
  - marker: b
    text: То есть «не забеременела»; коптский глагол здесь обозначает зачатие, а не рождение.
    reason: lexical_clarification
  - marker: c
    text: Ср. Лк. 11:27–28 — слова женщины и ответ Иисуса; Лк. 23:29 — о блаженстве нерождавших и не кормивших грудью.
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ … ϩⲛⲡⲙⲏⲏϣⲉ
  choice: одна женщина из толпы
  rationale: Неопределённый артикль указывает на не названную женщину; оборот «из толпы» естественно передаёт её нахождение среди множества людей.
- source_word: ⲉⲓⲁⲧ
  choice: блаженна / блаженны
  rationale: Традиционная и понятная форма макаризма, сохраняющая торжественный тон и грамматически согласованная с единственным или множественным числом.
- source_word: ⲡϩⲏ
  choice: утроба
  rationale: В контексте рождения и кормления слово обозначает материнскую утробу, а не живот вообще; «утроба» сохраняет достоинство и библейский резонанс.
- source_word: ϥⲓ ϩⲁ
  choice: носившая тебя
  rationale: В данном контексте выражение относится к материнскому вынашиванию и рождению; «носившая тебя» естественно сочетается с «утробой» и не смешивает этот глагол с последующим ⲱ «зачать».
- source_word: ⲓⲃⲉ … ⲥⲁⲛⲟⲩϣ
  choice: груди, кормившие тебя
  rationale: Передаёт телесный образ грудного вскармливания без архаического или излишне технического оттенка.
- source_word: ⲡⲗⲟⲅⲟⲥ ⲛⲡⲉⲓⲱⲧ
  choice: слово Отца
  rationale: Сохраняет прямое значение заимствованного λόγος и титул «Отец», не добавляя отсутствующего в тексте пояснения «Бог».
- source_word: ϩⲁⲣⲉϩ … ϩⲛⲟⲩⲙⲉ
  choice: сохранил его в истине
  rationale: Формально удерживает как значение «хранить/соблюдать», так и отдельную предложную фразу «в истине», не сводя её без необходимости к наречию.
- source_word: ⲙⲡⲥⲱ
  choice: не зачала
  rationale: Глагол ⲱ здесь означает забеременеть или зачать; перевод сохраняет его отличие от более раннего выражения о носившей Иисуса утробе.
- source_word: ⲙⲡⲟⲩϯⲉⲣⲱⲧⲉ
  choice: не давали молока
  rationale: Буквально и ясно передаёт отрицание кормления молоком, сохраняя параллелизм с утробой, которая не зачала.
theological_decisions:
- issue: Соотношение телесного материнства и слышания слова Отца
  choice: Сохранён прямой контраст между первым благословением и ответом Иисуса
  alternative: Добавить пояснение, что духовное послушание выше телесного родства
  rationale: Источник сам выражает напряжение через два макаризма и не формулирует отвлечённого богословского вывода; поясняющее расширение было бы интерпретацией.
- issue: Будущие дни и благословение бездетности
  choice: Сохранена неопределённая формула «настанут дни»
  alternative: Назвать эти дни судом, бедствием или концом мира
  rationale: Коптский текст не уточняет природу грядущих дней, поэтому их эсхатологический или исторический смысл не следует разрешать в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Утроба» и формула «блаженна/блаженны» сохраняют жанр макаризма; синтаксис остаётся ясным для обычного читателя. Неопределённость выражений «в истине» и «настанут дни» намеренно не устранена.
