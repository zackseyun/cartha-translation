  terminology: «Блаженна/блаженны», «утроба», «слово Отца» и «в истине» уместны и последовательно передают регистр и ключевые термины. «Не зачала» корректно сохраняет значение коптского глагола «забеременеть/зачать», не смешивая его с предшествующим образом ношения.
