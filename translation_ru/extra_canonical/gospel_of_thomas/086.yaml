base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: ru
  text: 'Иисус сказал: «У лис есть норы[a], и у птиц есть гнездо[b], а сыну человеческому[c] негде склонить голову и отдохнуть[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рукопись в повреждённом месте, по-видимому, читается как «одна нора» (ⲛⲟⲩ[ⲃⲏ]ⲃ), однако текст обычно восстанавливают как «их норы» (ⲛⲉⲩⲃⲏⲃ) — параллельно следующему выражению «их гнездо».
    reason: Текстуальная неопределённость в повреждённом месте рукописи.
  - marker: b
    text: 'Буквально: «их гнездо» — в единственном числе. В отличие от Матфея 8:20 и Луки 9:58, здесь нет слов «небесные» или «воздушные».'
    reason: Сохранение грамматического числа и отличие от синоптических параллелей.
  - marker: c
    text: Выражение «сын человеческий» может пониматься как титул, но буквально означает «сын человека»; коптская форма не различает прописных и строчных букв. Строчное написание в переводе сохраняет эту неоднозначность.
    reason: Сохранение возможной смысловой и богословской неоднозначности.
  - marker: d
    text: Слова «и отдохнуть» присутствуют в коптском тексте Евангелия от Фомы, но отсутствуют в параллельных изречениях Матфея 8:20 и Луки 9:58.
    reason: Значимое отличие версии Фомы от синоптических параллелей.
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: лисы
  rationale: Существительное стоит во множественном числе; перевод сохраняет число исходного текста.
- source_word: ⲃⲏⲃ
  choice: норы
  rationale: Слово может обозначать нору, логово или пещеру. «Норы» естественно сочетается с лисами и сохраняет образ изречения; местоименная принадлежность передана русской конструкцией «у лис есть».
- source_word: ϩⲁⲗⲏⲧ
  choice: птицы
  rationale: Исходный текст говорит просто о птицах, без определения «небесные» или «воздушные».
- source_word: ⲙⲁϩ
  choice: гнездо
  rationale: В коптском существительное употреблено в единственном числе при множественном обладателе; единственное число сохранено.
- source_word: ⲣⲓⲕⲉ
  choice: склонить
  rationale: Глагол буквально означает «наклонить, склонить»; выражение «склонить голову» естественно и близко к форме оригинала.
- source_word: ⲙⲧⲟⲛ ⲙⲙⲟϥ
  choice: отдохнуть
  rationale: Возвратная конструкция означает «дать себе отдых, отдохнуть». Перевод сохраняет добавочный глагол, отсутствующий в синоптических параллелях.
theological_decisions:
- issue: Передача выражения ⲡϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: Сын Человеческий
  alternative: сын человеческий; сын человека
  rationale: Выбрана узнаваемая русская передача устойчивого выражения, соответствующая близким синоптическим изречениям. Прописные буквы не устраняют возможной смысловой широты выражения; она отмечена в сноске.
- issue: Отношение изречения к синоптическим параллелям
  choice: 'Сохранить особенности коптской версии: единственное число «гнездо» и «отдохнуть»'
  alternative: Согласовать с Матфея 8:20 и Луки 9:58
  rationale: Текст переводится по коптскому свидетельству Евангелия от Фомы, а не исправляется по каноническим параллелям.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Конструкция «негде склонить голову» звучит естественнее буквального «не имеет места, чтобы склонить свою голову», не меняя смысла. Особенности коптского текста не сглажены по синоптическим версиям.
