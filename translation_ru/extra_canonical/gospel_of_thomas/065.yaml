- source_word: ⲭⲣⲏⲥⲧⲟⲥ
  choice: добрый
  rationale: Передаёт наиболее прямое значение восстановленного греческого заимствования χρηστός — «добрый, хороший»; текстуальная неопределённость отмечена в сноске.
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: виноградари
  rationale: Естественное русское обозначение работников или держателей виноградника; не уточняет без необходимости, были ли они наёмными работниками или арендаторами.
- source_word: ϩⲙϩⲁⲗ
  choice: раб
  rationale: Сохраняет социальное значение коптского слова и не смягчает его до «слуги».
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: плоды
  rationale: Сохраняет образный и собирательный смысл «плода» виноградника; во множественном числе звучит естественно по-русски.
- source_word: ⲛⲉⲕⲉⲕⲟⲩⲉⲓ ⲡⲉ ⲛⲥⲉⲙⲟⲟⲩⲧϥ
  choice: они едва не убили его
  rationale: Передаёт коптский идиоматический оборот со значением близости к совершению действия.
- source_word: ⲥⲟⲩⲱⲛ
  choice: знал
  rationale: 'Буквально сохраняет местоименную структуру рукописи: «он не знал их», не исправляя её по ожидаемой логике притчи.'
- source_word: ϣⲓⲡⲉ ϩⲏⲧ-
  choice: постыдятся
  rationale: Сохраняет буквальный образ чувства стыда перед кем-либо; в данном контексте подразумевается почтительное отношение, но оно не подставляется вместо исходного выражения.
- source_word: ⲙⲁⲁϫⲉ
  choice: ухо
  rationale: Сохраняет грамматическое единственное число коптского текста, хотя привычная русская библейская формула употребляет множественное число.
theological_decisions:
- issue: Согласование с синоптическими параллелями
  choice: Следовать особой форме притчи в коптском тексте Евангелия от Фомы
  alternative: Дополнить или сгладить повествование по синоптическим версиям притчи о злых виноградарях
  rationale: В перевод не внесены отсутствующие здесь башня, точило и иные детали; сохранена собственная последовательность и логика данного свидетельства.
- issue: Необычная реплика господина
  choice: «Может быть, он не знал их»
  alternative: «Может быть, они не знали его»
  rationale: Выбран засвидетельствованный рукописью порядок местоимений, несмотря на необычность смысла; возможная конъектура вынесена в сноску.
- issue: Отношение виноградарей к сыну
  choice: «они постыдятся моего сына»
  alternative: «они почтут / будут уважать моего сына»
  rationale: Более буквально сохранена нравственно-эмоциональная напряжённость исходного выражения без сведения его только к уважению.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной интонацией. Синтаксис сохраняет устный ритм притчи. Термин «раб» передаёт социальную реальность источника; «виноградари» оставляет открытым их точный хозяйственный статус. Необычные места рукописи не гармонизированы и пояснены сносками.
