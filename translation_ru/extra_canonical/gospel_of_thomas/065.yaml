base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his servant so that the farmers would give him the fruit of the vineyard. They seized his servant and beat him; they almost killed him. The servant went and told his master. His master said, 'Perhaps he did not know them.' He sent another servant[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
translation:
  language: ru
  text: 'Он сказал: «У одного доброго человека[a] был виноградник. Он отдал его виноградарям, чтобы они возделывали его, а он получал от них его плоды. Он послал своего раба, чтобы виноградари отдали ему плоды виноградника. Они схватили его раба и избили; они едва не убили его. Раб пошёл и рассказал своему господину. Его господин сказал: „Может быть, он не знал их“[b]. Он послал другого раба. Виноградари избили и того. Тогда господин послал своего сына. Он сказал: „Может быть, они постыдятся перед моим сыном“. Но те виноградари, зная, что он наследник виноградника, схватили его и убили. У кого есть ухо[c], пусть слышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово в рукописи частично восстановлено как ⲭⲣⲏⲥⲧⲟⲥ — греческое χρηστός, «добрый, хороший». Некоторые исследователи допускают чтение χρήστης — «заимодавец» или «ростовщик».
    reason: Текстуальная и лексическая неопределённость в повреждённом месте рукописи.
  - marker: b
    text: 'Буквальное чтение рукописи: «он не знал их». Иногда текст исправляют на «они не знали его», однако рукописное чтение может означать, что господин решил: раб не знал нужных виноградарей.'
    reason: Сохранение необычного, но осмысляемого рукописного чтения вместо конъектуры.
  - marker: c
    text: 'Буквально в коптском тексте стоит единственное число: «у кого есть ухо». Привычная формула в других евангельских текстах часто имеет множественное число: «у кого есть уши».'
    reason: Сохранение грамматического числа исходного свидетельства и указание более привычного варианта.
