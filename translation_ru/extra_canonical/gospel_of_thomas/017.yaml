revisions:
- from: 'Иисус сказал: «Я дам вам[a] то, что не видел глаз, не слышало ухо и чего не касалась рука[b][c], — и что не восходило на сердце человека[d]».'
  to: 'Иисус сказал: «Я дам вам[a] то, что не видел глаз, что не слышало ухо и чего не касалась рука[b][c], — и что не восходило на сердце человека[d]».'
  rationale: 'Безопасная минимальная правка восстанавливает параллельную относительную конструкцию: «то, что не видел глаз, что не слышало ухо и чего не касалась рука». Родительный «чего» после «касалась» грамматически необходим в русском и по-прежнему отсылает к «то». Рукописное ϯⲛⲁϯ поддерживает «Я дам», без добавления усилительного «я сам».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:49Z'
