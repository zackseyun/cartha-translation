  verdict: revise
  source_fidelity: 'Основной смысл передан верно: будущее «Я дам вам», триада «глаз—ухо—рука» и необычное «восходить на сердце» сохранены. Однако в третьем члене ряда русское «чего не касалась рука» меняет синтаксическую соотнесённость: объект, выраженный/подразумеваемый в коптском, должен быть тем же «то», что и после «дам вам».'
  naturalness: Текст в целом литературен и соответствует возвышенному лаконичному регистру. Конструкция «и чего не касалась рука» вносит неуместный родительный относительный оборот после уже заданного «то, что»; повтор «что» даёт ясный параллелизм и естественнее читается.
  terminology: «Иисус», «сердце человека» и передача ϩⲓ как «на» уместны. «Восходило на сердце» оправданно сохраняет образ ⲉϩⲣⲁⲓ ϩⲓ ⲡϩⲏⲧ и не подменяет его традиционным «приходило на сердце». Сноски по множественному числу, объектному показателю, параллелям и предлогу корректны; якоря после правки сохраняются.
