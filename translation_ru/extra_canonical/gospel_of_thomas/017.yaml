base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: ru
  text: 'Иисус сказал: «Я дам вам[a] то, что не видел глаз, что не слышало ухо и чего не касалась рука[b][c], — и что не восходило на сердце человека[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоименная форма «вам» в коптском тексте стоит во множественном числе.
    reason: grammar_note
  - marker: b
    text: 'В рукописи после первого глагола восприятия имеется объектный показатель ⲉⲣⲟϥ («его»); в нормализованном тексте соответствующий объект подразумевается во всех трёх звеньях: увидеть, услышать, коснуться этого.'
    reason: textual_variant
  - marker: c
    text: Ср. Ис 64:4 и 1 Кор 2:9, где встречается родственная последовательность образов; здесь перевод следует непосредственно коптскому тексту Евангелия от Фомы.
    reason: cross_reference
  - marker: d
    text: 'Буквально: «на сердце» (ϩⲓ ⲡϩⲏⲧ), а не более привычное по-русски «в сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϯⲛⲁϯ ⲛⲏⲧⲛ̄ (норм. ⲁⲛⲟⲕⲛⲁϯ ⲛⲁⲛⲧⲱⲧⲛ)
  choice: Я дам вам
  rationale: Рукопись содержит обычную форму будущего времени первого лица ϯⲛⲁϯ — «я дам»; добавочное усиление «я сам» не вводится. ⲛⲏⲧⲛ̄ обозначает адресатов во множественном числе.
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ
  choice: не видел глаз
  rationale: Отрицательный перфект и обобщённое единственное число переданы естественной русской конструкцией; порядок слов поддерживает параллелизм изречения.
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙ
  choice: не слышало ухо
  rationale: Сохранены обобщённое единственное число и синтаксический параллелизм с первым звеном.
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙ
  choice: не касалась рука
  rationale: ϭⲙϭⲱⲙ в данном ряду обозначает осязательный контакт; «касалась» точнее и естественнее здесь, чем «схватывала» или «ощупывала».
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈
  choice: не восходило
  rationale: Сохранён образ движения вверх в ⲉϩⲣⲁⲓ, не сглаженный до привычного «не приходило» или «не входило».
- source_word: ϩⲓ ⲫⲏⲧ ⲣ̄ⲣⲱⲙⲉ
  choice: на сердце человека
  rationale: Предлог ϩⲓ буквально указывает на положение «на», а ⲣⲱⲙⲉ имеет обобщённое значение «человек»; формулировка сохраняет необычный образ источника.
theological_decisions:
- issue: Связь с Ис 64:4 и 1 Кор 2:9
  choice: Переводить непосредственно с коптского, а параллели указать только в примечании
  alternative: Подогнать формулировку под известную русскую редакцию 1 Кор 2:9
  rationale: Изречение имеет родственный ряд образов, но его формулировка, включая руку и «восходило на сердце», самостоятельна; превращать его в точную цитату не следует.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Необычное выражение «восходило на сердце» сохранено намеренно как образная особенность источника; библейская созвучность не превращена в дословную цитату из канонического текста.
