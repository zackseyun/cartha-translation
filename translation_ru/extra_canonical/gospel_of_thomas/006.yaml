  source_fidelity: 'Перевод точно передаёт сахидский коптский текст. Вопросы учеников сохранены в исходной последовательности: пост, молитва, милостыня и соблюдение в отношении пищи. «Не лгите» верно передаёт запрет «говорить ложь», а «не делайте того, что ненавидите» сохраняет прямую структуру второго запрета. Настоящее значение «всё открыто перед небом» и будущие относительные конструкции о тайном и покрытом различены корректно. «Покрытое» и «нераскрытым» следуют коптскому чтению, не подменяя его греческим вариантом о погребённом и воскрешённом.'
  naturalness: Текст написан естественным современным литературным русским и сохраняет краткий афористический регистр. «Относительно пищи» несколько формальнее разговорной речи, но в данном контексте уместно и хорошо передаёт предмет соблюдения, не превращая его в обстоятельство времени («когда едим»).
  terminology: «Поститься», «молиться», «подавать милостыню» и «соблюдать» терминологически уместны. Необычное, но намеренно буквальное «перед небом» оправдано коптским текстом и надлежащим образом снабжено вариантом греческого свидетеля.
