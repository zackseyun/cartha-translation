base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: ru
  text: 'Ученики спросили Его: «Хочешь ли Ты, чтобы мы постились? Как нам молиться? Следует ли нам подавать милостыню? И что нам соблюдать относительно пищи?»


    Иисус сказал: «Не лгите и не делайте того, что ненавидите, ведь всё открыто перед небом.[a] Ибо нет ничего тайного, что не станет явным, и ничто покрытое не останется нераскрытым».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий фрагмент P.Oxy. 654 вместо «перед небом» читает: «перед истиной» (ἐνώπιον τῆς ἀληθείας).'
    reason: textual_variant
  - marker: b
    text: 'Греческий фрагмент P.Oxy. 654 вместо «и ничто покрытое не останется нераскрытым» читает: «и нет ничего погребённого, что не будет воскрешено» (καὶ τεθαμμένον ὃ οὐκ ἐγερθήσεται).'
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: постились
  rationale: Греческое заимствование со значением «поститься»; форма передаёт вопрос о желании Иисуса относительно поведения учеников.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: как
  rationale: Коптская идиома буквально означает «каков способ» и естественно передаётся русским «как».
- source_word: ϯⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: подавать милостыню
  rationale: Сохраняет конкретный смысл благотворительного подаяния, а не обобщённой помощи нуждающимся.
- source_word: ⲣⲡⲁⲣⲁⲧⲏⲣⲉⲓ ⲉⲟⲩ ⲛϭⲓⲛⲟⲩⲱⲙ
  choice: соблюдать относительно пищи
  rationale: Номинальное выражение обозначает правила или предписания, касающиеся еды; перевод не превращает его во временное «когда едим».
- source_word: ϫⲉϭⲟⲗ
  choice: лгать
  rationale: Буквально «говорить ложь»; краткое «лгать» сохраняет афористическую силу запрета.
- source_word: ϭⲱⲗⲡ ... ⲉⲃⲟⲗ
  choice: открыто / станет явным / нераскрытым
  rationale: В зависимости от синтаксиса один смысловой ряд передан естественными русскими соответствиями, сохраняющими тему обнаружения сокрытого.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ ⲛⲧⲡⲉ
  choice: перед небом
  rationale: Это устойчивое предложное выражение «перед, в присутствии» с существительным «небо»; необычный образ исходного текста сохранён.
- source_word: ϩⲱⲃⲥ
  choice: покрытое
  rationale: Коптское слово означает покрытое или укрытое; оно не заменено чтением греческого свидетеля «погребённое».
theological_decisions:
- issue: Коптское «перед небом» и греческое «перед истиной»
  choice: перед небом
  alternative: перед истиной
  rationale: Основной текст переводится по коптской рукописи; содержательно значимый вариант греческого фрагмента приведён в примечании без гармонизации.
- issue: Коптское «покрытое — раскрыто» и греческое «погребённое — воскрешено»
  choice: ничто покрытое не останется нераскрытым
  alternative: ничто погребённое не останется невоскрешённым
  rationale: Коптское чтение ясно выражает обнаружение сокрытого, тогда как греческий фрагмент содержит образ погребения и восстания. Перевод не переносит возможный воскресительный оттенок греческого варианта в основной коптский текст.
- issue: Временная форма утверждения о явленности всего
  choice: всё открыто
  alternative: всё будет открыто
  rationale: Коптская первая клауза имеет настоящее значение; последующие относительные конструкции обращены к будущему. Это напряжение сохранено.
translation_notes:
  register: Современный литературный русский с кратким, достойным афористическим строем. Местоимения, относящиеся к Иисусу в повествовании и прямом обращении, написаны с прописной буквы по принятой русской библейской издательской традиции. Необычное «перед небом» сохранено ради точности к коптскому тексту и пояснено вариантом греческого свидетеля.
