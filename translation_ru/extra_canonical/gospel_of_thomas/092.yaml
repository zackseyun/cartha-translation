base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: ru
  text: 'Иисус сказал: «Ищите — и найдёте.[d] Но то, о чём[a] вы спрашивали меня[b] в те дни и чего я не сказал вам в тот день, — теперь я готов рассказать[c], а вы этого не ищете».[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Относительную конструкцию можно понять как единственное число («то, о чём») или как множественное («вещи, о которых»). Последующие местоименные формы множественного числа поддерживают второе понимание.
    reason: textual_variant
  - marker: b
    text: В печатном морфологическом членении возможно чтение «вы спрашивали о них», тогда как нормализованный текст поддерживает чтение «вы спрашивали меня о них». В переводе принято второе.
    reason: textual_variant
  - marker: c
    text: 'Коптская конструкция выражает готовность или намерение. Возможен перевод: «теперь я намерен рассказать» или «теперь я собираюсь рассказать».'
    reason: lexical_alternative
  - marker: d
    text: Сочетание «ищите — и найдёте» известно также по Мф 7:7 и Лк 11:9, однако здесь изречение продолжается иначе, противопоставляя прежнее время настоящему.
    reason: cross_reference
  - marker: e
    text: 'Возможное членение: «Но то, о чём вы спрашивали меня в те дни, я не сказал вам тогда; теперь я готов рассказать, а вы этого не ищете».'
    reason: previous_rendering
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: ищите
  rationale: Передаёт активный поиск и сохраняет краткую повелительную форму, образующую устойчивую пару с «найдёте».
- source_word: ϭⲓⲛⲉ
  choice: найдёте
  rationale: Прямой смысловой эквивалент и естественная пара к «ищите».
- source_word: ⲁⲗⲗⲁ
  choice: но
  rationale: Простой противительный союз сохраняет резкий переход от общего призыва к упрёку слушателям.
- source_word: ⲡⲉⲧⲉⲣⲉ… / ⲛⲉⲧⲁ…
  choice: то, о чём
  rationale: Русская субстантивированная конструкция звучит естественно и позволяет не устранять полностью колебание между формально единственным и контекстуально множественным пониманием.
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: спрашивали меня о том
  rationale: Глагол означает «спрашивать», а предложное дополнение обозначает предмет вопроса; русская конструкция «то, о чём вы спрашивали меня» передаёт оба элемента.
- source_word: ⲛⲛⲓϩⲟⲟⲩ
  choice: в те дни
  rationale: Естественно передаёт временное указание и сохраняет его отличие от последующего единственного числа «в тот день».
- source_word: ⲙⲫⲟⲟⲩ ⲉⲧⲙⲙⲁⲩ
  choice: в тот день
  rationale: Сохраняет буквальное упоминание «дня» и риторическое повторение после «в те дни», не сводя выражение к одному наречию «тогда».
- source_word: ϫⲱ (ⲟⲩ)
  choice: сказать / рассказать
  rationale: В отрицательной части «сказать вам» близко следует исходной конструкции; при последующем сообщении содержания русское «рассказать» избегает тяжёлого повтора и остаётся в пределах значения глагола.
- source_word: ⲧⲉⲛⲟⲩ
  choice: теперь
  rationale: Прямо передаёт временной дейксис и контраст с прежним временем.
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: готов рассказать
  rationale: Передаёт готовность или волю говорящего; не превращает неоднозначную перифразу в категорическое указание на немедленность.
- source_word: ⲛⲥⲱⲟⲩ
  choice: этого
  rationale: Предлог отмечает предмет поиска; русское местоимение естественно отсылает ко всему ранее названному содержанию.
