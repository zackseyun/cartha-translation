translation_notes:
  register: Современный литературный русский язык с кратким, афористичным началом и ясным временным контрастом. Местоимения, относящиеся к Иисусу, даны со строчной буквы по нейтральной современной орфографической норме; перевод не вводит конфессионально обусловленной капитализации. Формула «то, о чём» выбрана ради естественности и сохранения исходной числовой неоднозначности.
