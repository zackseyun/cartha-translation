base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: ru
  text: 'Иисус сказал: «Кто не возненавидит своего отца и свою мать, тот не может стать моим учеником; и кто не возненавидит своих братьев и сестёр[a] и не понесёт свой крест так, как я[b], тот не будет достоин меня».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рукописи: «своих братьев … и сестёр» (ⲥⲛⲏⲩ … ⲥⲱⲛⲉ). В нормализованной лемматизации Дилли указано: «своего сына … свою дочь». Перевод следует чтению рукописи.'
    reason: textual_variant
  - marker: b
    text: Буквально коптское ⲛⲡⲁϩⲉ означает «моим путём» или «по моему образу». Явного глагола «следовать» в изречении нет.
    reason: dialect_note
  - marker: c
    text: 'Ср. Лк. 14:26–27; Мф. 10:37–38: там встречаются сходные мотивы, но формулировка Евангелия от Фомы отличается.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: возненавидит
  rationale: Коптский глагол имеет сильное значение «ненавидеть». Перевод сохраняет резкость изречения и не смягчает её до «любить меньше».
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: может стать моим учеником
  rationale: Потенциальная конструкция с ϣ передаёт возможность или способность, а ⲛⲁⲛⲟⲕ — отношение к говорящему; поэтому выбрано естественное русское «может стать моим учеником».
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: отец / мать
  rationale: Обычные термины родства переданы прямо и буквально.
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: братья / сёстры
  rationale: Перевод следует чтению рукописи, где стоят формы множественного числа, образующие параллельную пару.
- source_word: ϥⲓ
  choice: понесёт
  rationale: Глагол означает «нести, носить». В сочетании с крестом «понесёт» звучит естественно и не вносит отсутствующего в тексте глагола «следовать».
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: крест
  rationale: Это греческое заимствование со стандартным значением «крест».
- source_word: ⲛⲡⲁϩⲉ
  choice: так, как я
  rationale: Выражение буквально указывает на путь или образ действия говорящего. Русское «так, как я» передаёт уподобление без двусмысленного «на моём пути» и без гармонизации с синоптическим «следовать за мной».
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: будет достоин
  rationale: Коптская конструкция с прилагательным ⲁⲝⲓⲟⲥ обозначает состояние или качество — «быть достойным».
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: кто
  rationale: Неопределённо-относительная конструкция вводит общее условие; русское «кто … тот» сохраняет афористическую форму.
theological_decisions:
- issue: Резкое требование ненависти к ближайшим родственникам
  choice: возненавидит
  alternative: будет любить меньше; откажется от
  rationale: Источник употребляет сильный глагол «ненавидеть». Смягчение разрешило бы богословское напряжение, которое сам текст оставляет открытым.
- issue: Образ несения креста по образу Иисуса
  choice: понесёт свой крест так, как я
  alternative: возьмёт свой крест и последует за мной
  rationale: В изречении нет явного глагола «следовать». Выбранный вариант сохраняет собственную формулировку Фомы и не подменяет её синоптической.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и афористичным строем. Конструкция «кто … тот» делает длинное условие ясным. Сильное «возненавидит» намеренно сохранено, а формула «так, как я» передаёт образ действия без неестественного для современного русского выражения «на моём пути».
