  source_fidelity: 'Русский текст точно передаёт два параллельных условия коптского изречения: сильный глагол ⲙⲟⲥⲧⲉ передан без смягчения («возненавидит»); потенциальная конструкция первого условия отражена как «не может стать моим учеником»; во втором условии сохранено «нести крест», а не внесён отсутствующий глагол «следовать». Формула «так, как я» адекватно передаёт ⲛⲡⲁϩⲉ в принятом английском аудите как уподобление способу действия Иисуса. Заключительное «не будет достоин меня» соответствует простой будущей конструкции и ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ.'
