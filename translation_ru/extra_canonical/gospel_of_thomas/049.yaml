base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: ru
  text: 'Иисус сказал: «Блаженны уединённые[a] и избранные: вы найдёте царство[b]. Ведь вы — из него[c], и снова пойдёте туда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово ⲙⲟⲛⲁⲭⲟⲥ, заимствованное из греческого μοναχός, может означать «одинокий», «отдельный» или «единый, неделимый». Здесь оно не обязательно имеет более поздний институциональный смысл «монах».
    reason: lexical_alternative
  - marker: b
    text: После глагола «найти» рукопись употребляет предлог ⲁ вместо обычного сахидского ⲉ — диалектную особенность, встречающуюся в этом кодексе.
    reason: dialect_note
  - marker: c
    text: 'Буквально: «вы — те, кто из него».'
    reason: register_note
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: уединённые
  rationale: Греческое заимствование μοναχός здесь обозначает одиноких, отдельных или внутренне единых людей; перевод «монахи» внёс бы более поздний институциональный смысл. «Уединённые» сохраняет идею отдельности, а сноска отмечает более широкий смысловой диапазон.
- source_word: ⲥⲱⲧⲡ
  choice: избранные
  rationale: Качественная, пассивно-стативная форма в относительной конструкции означает тех, кто избран, а не тех, кто сам избрал.
- source_word: ϩⲉ
  choice: найдёте
  rationale: Обычное значение глагола в данной конструкции; будущее время передано прямо.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: Царство
  rationale: Традиционный и ясный эквивалент, сохраняющий многозначность между царством, царствованием и владычеством; прописная буква указывает на особое богословское употребление без его дальнейшего истолкования.
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧⲛⲧⲟⲥ
  choice: вы — из него
  rationale: Передаёт происхождение «из него» без уточнения природы этого происхождения; местоимение согласовано с русским словом «Царство».
- source_word: ⲡⲁⲗⲓⲛ ... ⲃⲱⲕ ⲙⲙⲁⲩ
  choice: снова пойдёте туда
  rationale: Формально сохраняет наречие «снова» и общий глагол движения, не заменяя их более истолковывающим «вернётесь».
theological_decisions:
- issue: Смысл ⲙⲟⲛⲁⲭⲟⲥ
  choice: уединённые
  alternative: одинокие; единые; монахи
  rationale: «Монахи» анахронично связывает выражение с позднейшим институтом, «одинокие» в современном русском часто означает эмоциональное одиночество, а «единые» теряет значение отделённости. Выбранный вариант вместе со сноской сохраняет напряжение между внешней отдельностью и внутренней цельностью.
- issue: Характер Царства
  choice: Не уточнять, является ли Царство местом, состоянием или владычеством
  alternative: Истолковать его как исключительно внутреннее состояние либо как будущую область
  rationale: Источник говорит о происхождении из Царства, его обретении и последующем движении туда, но не разрешает возникающее богословское напряжение.
- issue: Последнее движение к Царству
  choice: снова пойдёте туда
  alternative: вернётесь туда
  rationale: «Вернётесь» логично выводится из происхождения «из него», однако источник буквально использует общий глагол «идти» с наречием «снова»; формулировка не должна молча усиливать идею возвращения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Обращение во множественном числе сохранено по рукописи. «Блаженны» поддерживает возвышенный жанр изречения; двоеточие естественно связывает провозглашение с последующим обоснованием. Терминологически нагруженные места не сглажены толкованием.
