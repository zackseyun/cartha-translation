base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: ru
  text: 'Иисус сказал: «Царство подобно человеку, у которого в поле было спрятано сокровище, а он о нём не знал. После смерти он оставил его своему сыну. Сын тоже ничего не знал. Он получил это поле и продал его, а купивший его пришёл и, когда пахал, нашёл сокровище.[a] Тогда он стал давать деньги в рост кому хотел».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В отличие от притчи в Матфея 13:44, здесь первоначальный владелец не знает о сокровище; его находит тот, кто позднее покупает поле.
    reason: cross_reference
  - marker: b
    text: Несколько слов этого изречения восстановлены в повреждённых местах рукописи; восстановления надёжно опираются на сохранившиеся буквы и контекст.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Передаёт абстрактное существительное «царство, царская власть», не добавляя отсутствующего в данном изречении уточнения «Божье» или «Небесное».
- source_word: ⲁϩⲟ … ϩⲱⲡ
  choice: спрятанное сокровище
  rationale: ⲁϩⲟ означает сокровище или клад, а причастное описание прямо указывает, что оно было скрыто. В связном русском предложении естественно «было спрятано сокровище».
- source_word: ⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟϥ
  choice: он о нём не знал
  rationale: Точно передаёт состояние неведения владельца и сохраняет повествовательную ясность.
- source_word: ϥⲓ ⲧⲥⲱϣⲉ
  choice: продал это поле
  rationale: В рукописном тексте глагольная последовательность включает принятие/взятие поля и его продажу; в естественном русском повествовании обладание после наследования подразумевается, а выраженное действие — продажа.
- source_word: ⲥⲕⲁⲉⲓ
  choice: пахал
  rationale: В контексте купленного поля глагол обозначает обработку земли, пахоту; обстоятельственная форма передана как «когда пахал», чтобы находка оставалась непреднамеренной.
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: давать деньги в рост
  rationale: Буквально «давать деньги под процент». Традиционное, но понятное русское выражение сохраняет прямой смысл и не смягчает его до «вкладывать деньги».
theological_decisions:
- issue: Неуточнённое Царство
  choice: «Царство» без дополнения
  alternative: «Царство Божье» или «Царство Небесное»
  rationale: В коптском тексте стоит только «Царство»; богословское уточнение не следует вносить из канонических параллелей.
- issue: Давание денег под процент
  choice: «давать деньги в рост»
  alternative: «вкладывать деньги»
  rationale: Источник недвусмысленно говорит о выдаче денег под процент. Возможное этическое или символическое напряжение нельзя устранять более нейтральным переводом.
- issue: Отличие от Матфея 13:44
  choice: Сохранить самостоятельный ход притчи
  alternative: Согласовать рассказ с канонической притчей о сокровище
  rationale: Здесь первый владелец и его сын не знают о сокровище, а находит его последующий покупатель; эти особенности принадлежат тексту Фомы.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Синтаксис сделан плавным и общедоступным; архаизмы сведены к устойчивому и понятному выражению «давать деньги в рост». Все примечания отмечены в основном тексте буквенными маркерами.
