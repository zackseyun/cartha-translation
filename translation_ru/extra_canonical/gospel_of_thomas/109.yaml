revisions:
- from: 'Иисус сказал: «Царство подобно человеку, у которого в поле было спрятано сокровище, а он о нём не знал. После смерти он оставил его своему сыну. Сын тоже ничего не знал. Он продал это поле, а купивший его пришёл и, когда пахал, нашёл сокровище.[a] Тогда он стал давать деньги в рост кому хотел».[b]'
  to: 'Иисус сказал: «Царство подобно человеку, у которого в поле было спрятано сокровище, а он о нём не знал. После смерти он оставил его своему сыну. Сын тоже ничего не знал. Он получил это поле и продал его, а купивший его пришёл и, когда пахал, нашёл сокровище.[a] Тогда он стал давать деньги в рост кому хотел».[b]'
  rationale: 'Внесено только необходимое исправление: восстановлено выраженное в источнике действие сына — получение (или взятие) поля — перед его продажей. Выбранное «получил это поле» естественно по-русски, согласуется с предшествующим «оставил его своему сыну» и не утверждает больше, чем позволяет коптский глагол. Сноски и их якоря сохранены; они соответствуют тексту и рукописным лакунам.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:45Z'
review_pass:
  verdict: revise
  source_fidelity: В основной последовательности точно переданы скрытое сокровище, неведение первого владельца и сына, продажа поля покупателю, находка во время пахоты и последующая выдача денег под процент. Однако опущено самостоятельное действие сына ⲁϥϥⲓ ⲧⲥⲱϣⲉ («он получил/взял то поле») перед продажей; его не следует растворять в одном факте наследования.
  naturalness: Текст в целом звучит как современный литературный русский и сохраняет притчевую простоту. «Давать деньги в рост» понятно, но несколько книжно; оно допустимо и точно. Добавление «получил это поле» делает переход от отца к сыну ясным и естественным.
  terminology: «Царство» корректно сохраняет отсутствие в коптском уточнений «Божье» или «Небесное». «Сокровище» и «спрятано» адекватно передают ⲁϩⲟ и ⲉϥϩⲏⲡ. «Давать деньги в рост» верно передаёт «давать деньги/медь под процент» и не подменяет кредитование инвестированием.
  issues:
  - severity: medium
    issue: Пропущено действие сына перед продажей поля.
    rationale: Коптское ⲁϥϥⲓ ⲧⲥⲱϣⲉ прямо сообщает, что сын получил/взял поле, а затем продал его. В черновике сказано только «Он продал это поле», что устраняет отдельный повествовательный шаг. Нейтральное «получил это поле» сохраняет смысл без излишней интерпретации способа получения.
