base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: ru
  text: 'Иисус сказал: «Когда вы сделаете два одним, вы станете сынами Человека[a]. И когда скажете: „Гора, сдвинься отсюда“, — она сдвинется».[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детьми Человека». Коптское слово «сыновья» может употребляться собирательно.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Фома 22 и 48, где также встречается мотив превращения двух в одно.
    reason: cross_reference
  - marker: c
    text: Ср. Мк 11:23; Мф 17:20; 21:21 — о горе, которая сдвигается по слову.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ … ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲉⲓⲣⲉ
  choice: Когда вы сделаете
  rationale: Сочетание вводит условно-временную конструкцию с будущей направленностью; русское «когда вы сделаете» передаёт её прямо и естественно.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: двоих одним
  rationale: Сохраняет краткое и намеренно загадочное противопоставление определённого «двух» и «одного», не уточняя, что именно должно стать единым.
- source_word: ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: сынами Человека
  rationale: «Сынами» сохраняет буквальную мужскую форму, а «Человека» передаёт определённое ⲡⲣⲱⲙⲉ и необычность выражения, не превращая его автоматически в синоптический титул «Сын Человеческий».
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁⲛ⳿ϫⲟⲟⲥ / ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛϫⲱⲛⲧⲟⲥ
  choice: когда скажете
  rationale: Рукописное ϫⲟⲟⲥ — глагол «сказать» с местоименным суффиксом «это», предвосхищающим прямую речь. Нормализованное ϫⲱⲛⲧⲟⲥ здесь не является отдельным наречием «вслух».
- source_word: ⲡⲧⲟⲟⲩ
  choice: Гора
  rationale: Определённый артикль при обращении не требуется воспроизводить отдельным русским словом; форма обращения сохраняется прямой речью.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: сдвинься отсюда
  rationale: Передаёт глагол движения с направительным значением «прочь, наружу» и звучит естественно как приказ горе.
- source_word: ⲛⲧⲟϥⲛⲁⲡⲱⲱⲛⲉ
  choice: она сдвинется
  rationale: Будущая форма передана простым русским будущим; местоимение согласовано с существительным «гора».
theological_decisions:
- issue: Значение выражения ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: «сынами Человека» с пояснением варианта в сноске
  alternative: «детьми Человека»; «сынами человека»
  rationale: Основной текст сохраняет буквальную остроту и определённость коптского выражения, но сноска отмечает возможное собирательное, гендерно-нейтральное понимание. Заглавная буква обозначает необычное определённое выражение, не отождествляя его безоговорочно с каким-либо догматическим титулом.
translation_notes:
  register: Современный литературный русский с кратким, афористичным синтаксисом. Намеренная загадочность «сделаете двоих одним» и необычность «сыновья Человека» сохранены; устаревшая библейская лексика и конфессионально нагруженные пояснения не добавлены.
