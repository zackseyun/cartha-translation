base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: ru
  text: 'Его ученики сказали: «В какой день[a] Ты явишься[f] нам и в какой день мы увидим Тебя?» Иисус сказал: «Когда вы обнажитесь, не испытывая стыда[b], возьмёте свои одежды, положите их под ноги, как маленькие дети[c][e], и растопчете их, тогда[d] вы увидите Сына Живого[g] и не испугаетесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в какой день»; здесь выражение может означать просто «когда».'
    reason: Поясняет временную формулу, сохранённую в тексте.
  - marker: b
    text: Буквально речь идёт о том, чтобы снять одежду, не испытывая стыда. Символический смысл образа в самом изречении не объясняется.
    reason: Сохраняет образ и предупреждает против навязывания одного толкования.
  - marker: c
    text: Сравнение с маленькими детьми не поясняется; его точный объём — относится ли оно только к действиям с одеждами или также к предшествующему обнажению — не вполне ясен.
    reason: Отмечает синтаксическую и смысловую неопределённость, не предлагая частного истолкования.
  - marker: d
    text: Слово «тогда» связывает обещанное видение с предшествующими действиями.
    reason: Отмечает логико-временную структуру высказывания.
  - marker: e
    text: Греческий фрагмент этого изречения сохранился в POxy 655; формулировка соответствующего места фрагментарна и не устраняет всех вопросов чтения.
    reason: Указывает на древнее параллельное свидетельство без придания ему ложной определённости.
  - marker: f
    text: 'Или: «откроешься», «станешь явным».'
    reason: Сохраняет диапазон значений коптского ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ.
  - marker: g
    text: 'Буквально: «Сына того, кто жив», или «Сына Живого». Слово «Бог» в коптском тексте здесь не выражено.'
    reason: Поясняет необычную титулатуру и не дополняет источник теологически.
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: в какой день
  rationale: Буквально сохраняет образ дня и повтор вопросительной конструкции, не сглаживая её до простого «когда».
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: явишься
  rationale: Передаёт раскрытие или явление того, кто прежде был сокрыт; русский возвратный глагол естественно соответствует контексту.
- source_word: ⲕⲉⲕⲧⲏⲩⲧⲛ ⲉϩⲏⲩ ⲙⲡⲉⲧⲛϣⲓⲡⲉ
  choice: обнажитесь и не устыдитесь
  rationale: Идиоматически передаёт снятие одежды без стыда, сохраняя телесный и символический образ.
- source_word: ϥⲓ ⲛⲛⲉⲧⲛϣⲧⲏⲛ
  choice: возьмёте свои одежды
  rationale: Сохраняет явно выраженное действие «взять», не сводя последовательность к одному «положить».
- source_word: ⲛⲑⲉ ⲛⲛⲓⲕⲟⲩⲉⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ
  choice: как малые дети
  rationale: Естественная современная формулировка, сохраняющая сравнение и указание на маленьких детей.
- source_word: ϫⲟⲡϫⲡ ⲙⲙⲟⲟⲩ
  choice: растопчете их
  rationale: Передаёт интенсивное попирание одежд ногами, а не нейтральное наступание.
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: Сына Живого
  rationale: Формально сохраняет субстантивированное «Живой» и не добавляет референта «Бог», которого в коптском тексте нет.
theological_decisions:
- issue: Смысл обнажения и попрания одежд
  choice: Оставить образ без истолкования в основном тексте
  alternative: Передать как отказ от стыда, тела, мира или прежней личности
  rationale: Источник допускает символические прочтения, но сам не разъясняет образ; перевод не должен закреплять частную доктрину.
- issue: Референт выражения «Сын Живого»
  choice: Сын Живого
  alternative: Сын Живого Бога
  rationale: Добавление «Бога» теологически возможно, однако отсутствует в данной коптской формулировке и устранило бы её лаконичную неоднозначность.
- issue: Временная или условная сила ϩⲟⲧⲁⲛ
  choice: когда
  alternative: если
  rationale: Конструкция вводит момент исполнения названных действий; «когда» сохраняет временную форму и не превращает изречение в явно условное.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической формой. Местоимения, обращённые к Иисусу, написаны с прописной буквы по издательской норме уважительного религиозного регистра. Повтор «в какой день» сохранён ради риторической структуры источника; образный ряд намеренно не рационализирован.
