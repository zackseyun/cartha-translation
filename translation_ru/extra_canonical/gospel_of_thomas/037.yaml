revisions:
- from: 'Его ученики сказали: «В какой день[a] Ты явишься[f] нам и в какой день мы увидим Тебя?» Иисус сказал: «Когда вы обнажитесь и не устыдитесь[b], возьмёте свои одежды, положите их под ноги, как малые дети[c][e], и растопчете их, тогда[d] вы увидите Сына Живого[g] и не испугаетесь».'
  to: 'Его ученики сказали: «В какой день[a] Ты явишься[f] нам и в какой день мы увидим Тебя?» Иисус сказал: «Когда вы обнажитесь, не испытывая стыда[b], возьмёте свои одежды, положите их под ноги, как маленькие дети[c][e], и растопчете их, тогда[d] вы увидите Сына Живого[g] и не испугаетесь».'
  rationale: Нужна безопасная правка сноски c, поскольку прежняя формулировка привязывает образ детей к отсутствию стыда, чего текст прямо не говорит. Одновременно слегка уточнена русская передача обстоятельства «без стыда» и выбран более естественный вариант «маленькие дети». Смысл, структура, все маркеры сносок и осторожность в отношении спорного образа сохранены.
  reviewer_model: gpt-5.6-terra
