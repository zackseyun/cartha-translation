review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом точно передаёт коптскую последовательность: вопрос о явлении, обнажение без стыда, взятие одежд, помещение их под ноги, попрание и последующее видение «Сына Живого». «Возьмёте» обоснованно сохраняет отдельный глагол «взять». Уточнена передача оборота «без стыда»: «не испытывая стыда» ближе к его обстоятельственной функции, чем последовательное «и не устыдитесь».'
  naturalness: Текст выдержан в современном литературном русском. «Маленькие дети» несколько естественнее, чем «малые дети», без потери смысла. Перестройка первого условия делает фразу более плавной и ясно передаёт отсутствие стыда как характеристику обнажения.
