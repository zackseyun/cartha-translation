revisions:
- from: 'Иисус сказал: «Не собирают виноград с терновника и не срывают смоквы с чертополоха,[a] ведь они не приносят плода. Добрый человек выносит доброе из своей сокровищницы, а злой человек выносит злое из своей злой сокровищницы, которая находится в его сердце,[b] и говорит злое. Ведь от избытка сердца он выносит злое».[c]'
  to: 'Иисус сказал: «Не собирают виноград с терновника и не срывают смоквы с чертополоха[a], ведь они не приносят плода. Добрый человек выносит доброе из своей сокровищницы, а злой человек выносит злое из своей злой сокровищницы, находящейся в его сердце[b], и говорит злое. Ведь от избытка сердца он выносит злое».'
  rationale: Сохранены образность, повтор «выносит злое» и отнесение злой сокровищницы к сердцу. Удалено неинформативное примечание, уточнена осторожность ботанической справки и слегка улучшен русский синтаксис без изменения смысла.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:11Z'
review_pass:
  verdict: revise
  source_fidelity: Первая образная пара и заключительная формула переданы в целом точно. Однако коптский текст характеризует хранилище злого человека как «злое» и помещает его в сердце; относительное определение следует оформить так, чтобы не создавать ненужной синтаксической двусмысленности. «Сокровищница» удачно сохраняет метафору внутреннего запаса.
  naturalness: Текст литературный и понятный. Формулировка «которая находится в его сердце» тяжеловесна для афористического изречения; причастный оборот «находящейся в его сердце» естественнее. Примечание c не добавляет переводческой информации, поскольку буквально повторяет основной текст.
  terminology: '«Терновник», «смоквы», «чертополох», «сокровищница», «сердце» и субстантивированное «злое» соответствуют образному и возвышенно-нейтральному регистру. Ботаническое отождествление с «верблюжьей колючкой» следует подавать осторожнее: точная идентификация названия растения не вполне определённа.'
  issues:
  - severity: medium
    issue: Примечание c избыточно и его якорь поставлен после закрывающей точки.
    rationale: Оно сообщает почти дословно то, что уже сказано в основном тексте, не фиксируя вариант чтения или переводческую неопределённость. Его удаление делает аппарат содержательным и устраняет неудачное расположение маркера.
  - severity: low
    issue: Примечание a слишком категорично связывает коптское название с «верблюжьей колючкой».
    rationale: Ботаническая идентификация данного названия не вполне бесспорна; лучше обозначить это как возможную передачу, а не как буквальное значение.
  - severity: low
    issue: Оборот «которая находится в его сердце» можно сделать более компактным.
    rationale: «Находящейся в его сердце» сохраняет отнесение определения к сокровищнице и лучше соответствует ритму современного литературного русского.
