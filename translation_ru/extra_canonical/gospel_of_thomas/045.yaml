base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: ru
  text: 'Иисус сказал: «Не собирают виноград с терновника и не срывают смоквы с чертополоха[a], ведь они не приносят плода. Добрый человек выносит доброе из своей сокровищницы, а злой человек выносит злое из своей злой сокровищницы, находящейся в его сердце[b], и говорит злое. Ведь от избытка сердца он выносит злое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название растения допускает и передачу «верблюжья колючка»; точная ботаническая идентификация не вполне определённа.
    reason: Уточняет лексическую неопределённость без утверждения спорного ботанического соответствия.
  - marker: b
    text: 'Или: «из своей сокровищницы — из зла, находящегося в его сердце».'
    reason: Отмечает возможное иное синтаксическое членение фразы при сохранении её общего смысла.
lexical_decisions:
- source_word: ϣⲟⲛⲧⲉ
  choice: терновник
  rationale: Передаёт колючее растение и естественно сочетается с образом винограда; сохраняет общеизвестную евангельскую образность без излишней ботанической конкретизации.
- source_word: ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: чертополох
  rationale: Коптское название буквально связано с «верблюжьей колючкой»; «чертополох» понятно современному читателю и сохраняет контраст между плодом и колючим растением.
- source_word: ⲁϩⲟ / ⲉϩⲟ
  choice: сокровищница
  rationale: Слово обозначает хранилище или запас; «сокровищница» сохраняет метафору внутреннего запаса, из которого человек выносит доброе либо злое.
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: избыток сердца
  rationale: Формально отражает значение «изобилие, переполнение сердца» и сохраняет намеренный повтор образа сердца.
- source_word: ⲡⲟⲛⲏⲣⲟⲛ
  choice: злое
  rationale: Субстантивированное среднее прилагательное естественно передаёт и злые слова, и злое содержимое внутренней сокровищницы, не сужая смысл до конкретных поступков.
theological_decisions:
- issue: Связь злой сокровищницы с сердцем
  choice: «из своей злой сокровищницы, которая находится в его сердце»
  alternative: «из своей сокровищницы — из зла, находящегося в его сердце»
  rationale: Ближайшая синтаксическая связь в коптском тексте относит выражение «которая находится в его сердце» к злой сокровищнице. Перевод не подменяет этот образ объяснительным истолкованием.
- issue: Источник злой речи
  choice: Сохранены отдельно «выносит злое» и «говорит злое»
  alternative: Объединить в формулировку «из сердца говорит злые слова»
  rationale: Коптский текст различает вынесение злого из внутреннего запаса и произнесение злого; повтор сохраняет нравственное напряжение изречения.
translation_notes:
  register: Современный литературный русский с достоинством афористического изречения. Повторы «злое», «сердце» и «выносит» сохранены как смыслообразующие. Синтаксис слегка разгружен делением заключительной части на два предложения.
