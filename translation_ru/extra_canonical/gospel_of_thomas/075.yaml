  verdict: approve
  source_fidelity: 'Перевод точно передаёт основное противопоставление: многие стоят у двери, тогда как войдут только μοναχοί. «У двери», «войдут» и сохранённое «место брачного чертога» соответствуют коптскому тексту. Основной текст обоснованно следует множественному числу рукописи (ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ ⲛⲉⲧⲛⲁⲃⲱⲕ), а сноска корректно отмечает сингуларизацию в нормализованном тексте издания.'
