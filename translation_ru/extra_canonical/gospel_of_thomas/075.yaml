  terminology: «Брачный чертог» — устоявшаяся и регистрово уместная передача ϣⲉⲗⲉⲉⲧ. «Одинокие» допустимо передаёт ⲙⲟⲛⲁⲭⲟⲥ, не навязывая поздний институциональный смысл «монахи»; сноска достаточно фиксирует релевантный семантический диапазон и не догматизирует его.
