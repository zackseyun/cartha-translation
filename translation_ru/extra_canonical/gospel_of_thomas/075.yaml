base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: ru
  text: 'Иисус сказал: «Многие стоят у двери, но в место брачного чертога войдут лишь одинокие[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово ⲙⲟⲛⲁⲭⲟⲥ может означать «одинокие», «отдельные» или «единые, неразделённые», а позднее также «монахи». Здесь оно не обязательно обозначает членов монашеской общины.
    reason: lexical_alternative
  - marker: b
    text: 'В рукописи сказано во множественном числе: «одинокие — те, кто войдёт». Нормализованный текст издания даёт единственное число: «одинокий — тот, кто войдёт».'
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: многие
  rationale: Экзистенциальная конструкция естественно передаётся по-русски словом «многие» в позиции подлежащего.
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: стоят
  rationale: Буквально коптский оборот означает «стоят на своих ногах», но это обычная идиома со значением «стоят»; буквальное воспроизведение по-русски было бы избыточным.
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: у двери
  rationale: Предлог выражает положение у или при двери; «у двери» естественно и точно передаёт пространственное значение.
- source_word: ⲁⲗⲗⲁ
  choice: но
  rationale: Сохраняет резкое противопоставление между многими у двери и теми, кто войдёт.
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: одинокие
  rationale: Греческое заимствование μονάχος может обозначать одинокого, отдельного или единого человека, а позднее — монаха. «Одинокие» не вносит в текст позднейший институциональный смысл, но неоднозначность поясняется в сноске.
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: войдут
  rationale: Рукописная форма множественного числа обозначает тех, кто войдёт; простой глагол будущего времени естественно передаёт относительную конструкцию.
- source_word: ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ
  choice: место брачного чертога
  rationale: Существительное ⲙⲁ «место» выражено явно и потому сохранено, несмотря на необычность сочетания; ϣⲉⲗⲉⲉⲧ означает брачный чертог.
theological_decisions:
- issue: Смысл ⲙⲟⲛⲁⲭⲟⲥ
  choice: одинокие
  alternative: единые; неразделённые; монахи
  rationale: Контекст допускает как буквальную обособленность, так и тематическую для Евангелия от Фомы цельность или единство. Основной текст не закрепляет позднейшее монашеское толкование, а сноска сохраняет смысловую напряжённость.
- issue: Число субъекта, который войдёт
  choice: 'множественное число по рукописи: «одинокие… войдут»'
  alternative: 'единственное число по нормализованному тексту: «одинокий… войдёт»'
  rationale: Дипломатическое чтение рукописи ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ ⲛⲉⲧⲛⲁⲃⲱⲕ содержит множественный артикль и множественную относительную форму. Нормализованная версия меняет их на единственное число; перевод следует более первичному рукописному свидетельству и отмечает расхождение.
translation_notes:
  register: Краткая афористическая фраза выдержана в современном литературном и возвышенном регистре. «Брачный чертог» сохраняет историко-религиозный образ, а усилительная частица «лишь» ясно выражает исключительное противопоставление, заложенное в коптской расщеплённой конструкции.
