base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: ru
  text: 'Иисус сказал: «Того, кто познает отца и мать, назовут сыном проститутки».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Тот, кто придёт к познанию отца и матери, — они назовут его сыном проститутки». Слово, переведённое как «назовут», может также означать «нарекут».'
    reason: Сноска сохраняет заметный оттенок будущего обретения знания и возможный лексический вариант, не перегружая основной текст.
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲟⲟⲩⲛ
  choice: того, кто познает
  rationale: Относительная конструкция с будущим временем передаёт предстоящее обретение знания; русское совершенное будущее «познает» сохраняет этот оттенок естественно и без громоздкости.
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ ⲡⲙⲁⲁⲩ
  choice: отца и мать
  rationale: Определённость выражена в коптском, но в русском при названиях родства артиклевая определённость отдельно не маркируется. Строчные буквы не навязывают богословского отождествления.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ
  choice: назовут
  rationale: Безлично-личная форма 3-го лица множественного числа естественно сохраняет неопределённое «они» исходного текста; «назовут» подходит для прозвища или наименования.
- source_word: ⲡϣⲏⲣⲉ
  choice: сыном
  rationale: Хотя слово может означать также «ребёнок», мужской артикль и устойчивый характер выражения поддерживают перевод «сын».
- source_word: ⲡⲟⲣⲛⲏ
  choice: проститутки
  rationale: Начальное ⲡ является частью заимствованного из греческого слова πόρνη, а не определённым артиклем; поэтому существительное здесь неопределённое. «Проститутка» точно передаёт значение без ненужного просторечного усиления.
theological_decisions:
- issue: Возможная символическая референция слов «отец» и «мать»
  choice: строчные буквы без поясняющего отождествления
  alternative: «Отца и Мать» или явное богословское толкование
  rationale: Исходный текст допускает разные уровни понимания и сам не уточняет референтов; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая форма изречения сохранена. Формулировка «сын проститутки» передана без эвфемизации и без более грубого просторечного эквивалента.
