revisions:
- from: 'Иисус сказал: «Если плоть возникла ради духа, это чудо; но если дух возник ради тела, это чудо из чудес.[a] И всё же я сам удивляюсь тому, как это великое богатство поселилось в этой нищете».[b]'
  to: 'Иисус сказал: «Если плоть возникла вследствие духа, это чудо; но если дух возник вследствие тела, это чудо из чудес. И всё же я сам удивляюсь тому, как[b] это великое богатство поселилось в этой нищете[c]».'
  rationale: Исправлена только смысловая неточность причинного предлога и приведены в соответствие с текстом примечания и их якоря. Причинная формулировка не навязывает ни физического происхождения, ни догматического истолкования отношения плоти, духа и тела.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:33:01Z'
review_pass:
  verdict: revise
  source_fidelity: Основная проблема — «ради» в обоих условных предложениях. ⲉⲧⲃⲉ здесь прежде всего обозначает основание/причину («по причине», «благодаря», «из-за»), а не цель; перевод «ради» вводит целевую связь, которой текст не выражает. Противопоставительное ⲇⲉ («но») и эмфатическое «я сам» переданы верно. Различение «плоть» (ⲥⲁⲣⲝ) и «тело» (ⲥⲱⲙⲁ) сохранено.
  naturalness: «Вследствие духа» — литературный и достаточно нейтральный способ передать причинное ⲉⲧⲃⲉ, не привнося отрицательной окраски «из-за» или телеологического оттенка «ради». «Поселилось в этой нищете» естественно и передаёт образ установленного пребывания.
  terminology: «Плоть», «дух», «тело», «чудо» и «чудо из чудес» точны и сохраняют лексические и риторические соответствия оригинала. «Я сам удивляюсь» корректно выражает вынесенное независимое местоимение ⲁⲛⲟⲕ перед глагольной формой первого лица.
  issues:
  - severity: medium
    issue: «Ради духа / ради тела» передаёт ⲉⲧⲃⲉ как целевой предлог.
    rationale: В данном параллелизме ⲉⲧⲃⲉ имеет причинное значение («because of» в английской аудиторской версии). Целевое «ради» меняет характер заявленной связи и излишне направляет интерпретацию.
  - severity: low
    issue: Примечание a утверждает целевую неоднозначность и поставлено после «чудо из чудес», а не у причинных оборотов.
    rationale: Такое примечание поддерживает неточный основной перевод и его якорь не соотнесён с поясняемыми словами. Его следует удалить; текстологические примечания лучше привязать непосредственно к «как» и «нищете».
