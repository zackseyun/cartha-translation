base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: ru
  text: 'Иисус сказал: «Если плоть возникла вследствие духа, это чудо; но если дух возник вследствие тела, это чудо из чудес. И всё же я сам удивляюсь тому, как[b] это великое богатство поселилось в этой нищете[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: В рукописи последнее ⲥ в слове ⲡⲱⲥ («как») восстановлено в лакуне.
    reason: Текстологическое пояснение восстановления.
  - marker: c
    text: Греческий свидетель POxy 1 также сохраняет заключительный образ «этой нищеты».
    reason: Указание на параллельное греческое свидетельство.
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: возникла / возник
  rationale: Передаёт появление или обретение бытия, не сужая смысл до физического рождения.
- source_word: ⲉⲧⲃⲉ
  choice: ради
  rationale: Коптский предлог допускает причинный и целевой оттенок; «ради» естественно сохраняет возможную направленность отношения, не делая происхождение механически причинным.
- source_word: ⲥⲁⲣⲝ / ⲥⲱⲙⲁ
  choice: плоть / тело
  rationale: Сохраняет намеренное различие двух греческих заимствований в коптском тексте.
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: дух
  rationale: Обычный и контекстуально точный эквивалент в антитезе плоти и тела.
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: чудо / чудо из чудес
  rationale: Контекст требует значения «чудо»; генитивная конструкция выражает превосходную степень.
- source_word: ⲇⲉ
  choice: но
  rationale: Явно передаёт противопоставление во втором условном предложении.
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: я сам удивляюсь
  rationale: Независимое местоимение перед формой первого лица подчёркивает субъект; это не повтор «я — я».
- source_word: ⲁⲛⲧⲟⲥⲟⲩⲱϩ
  choice: поселилось
  rationale: Передаёт совершившееся вселение или обретение места пребывания и естественно сочетается с «богатством».
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ / ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: это великое богатство / эта нищета
  rationale: Сохраняет резкую образную антитезу богатства и бедности; «нищета» сильнее и точнее нейтральной «бедности».
theological_decisions:
- issue: Характер связи между плотью/духом и духом/телом
  choice: «возникла ради… / возник ради…»
  alternative: «возникла из-за… / возник из-за…»
  rationale: ⲉⲧⲃⲉ может выражать основание, причину или направленность. Основной текст сохраняет целевой оттенок, а примечание отмечает причинное прочтение, не разрешая метафизическую неоднозначность.
- issue: Образ богатства, пребывающего в нищете
  choice: Оставлен без догматического истолкования
  alternative: Явно отождествить богатство с духом, а нищету с телом
  rationale: Контекст подсказывает такое сопоставление, но сам текст не формулирует его прямо; перевод не должен превращать образ в доктринальное пояснение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм условных фраз, контраст «плоть — дух — тело» и парадокс «великое богатство — нищета». Формулировки dignified, но понятны без специальной терминологии.
