base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: ru
  text: 'Его ученики сказали ему: «Двадцать четыре пророка говорили в Израиле, и все они говорили о тебе[a]». Он сказал им: «Вы оставили без внимания живого, который перед вами,[b] и говорили о мёртвых[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В нормализованном тексте стоит «о тебе». Написание рукописи можно также понять как «в твоём сердце» или «о твоём сердце».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «живого перед вами», то есть находящегося в вашем присутствии. «Оставили без внимания» можно также перевести как «упустили» или «пропустили».'
    reason: lexical_alternative
  - marker: c
    text: В рукописи здесь множественное число — «о мёртвых»; нормализованная лемматизация источника даёт единственное — «о мёртвом».
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: двадцать четыре
  rationale: Обычная передача составного числительного; сохраняет краткость коптского текста.
- source_word: ⲁⲩϣⲁϫⲉ
  choice: говорили
  rationale: Простое прошедшее время естественно передаёт повествовательную форму и сохраняет повтор глагола.
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ
  choice: о тебе
  rationale: Следует нормализованному чтению Дилли и естественно обозначает тему речи; рукописное чтение допускает иной разбор, отмеченный в сноске.
- source_word: ⲕⲱ
  choice: оставили без внимания
  rationale: Передаёт смысл «упустить, оставить, пренебречь» в данном противопоставлении, не сводя его лишь к редакционному «исключили».
- source_word: ⲡⲉⲧⲟⲛϩ
  choice: Живого
  rationale: Субстантивированная форма в единственном числе противопоставлена мёртвым; прописная буква отражает контекстуальное указание на присутствующего собеседника, не добавляя имени или титула.
- source_word: ⲙ̄ⲡⲉⲧⲛ̄ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: который перед вами
  rationale: Естественная русская передача идиомы «в вашем присутствии, перед вами».
- source_word: ϩⲁⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: о мёртвых
  rationale: Рукописный текст имеет множественную форму «мёртвые»; перевод следует ей, а не нормализованной сингулярной лемматизации.
theological_decisions:
- issue: Кого обозначает «Живой»
  choice: Сохранено обозначение «Живой» без поясняющего имени
  alternative: «живой человек» или «Иисус»
  rationale: Контекст позволяет соотнести выражение с говорящим, однако исходный текст прямо его не называет; перевод сохраняет эту недосказанность.
- issue: Единственное или множественное число в заключительной антитезе
  choice: «о мёртвых»
  alternative: «о мёртвом»
  rationale: Дипломатическая транскрипция рукописи читает ϩⲁⲛⲉⲧⲙⲟⲟⲩⲧ, множественное число; нормализованный источник сводит выражение к единственному числу. Основной текст следует рукописной форме.
translation_notes:
  register: Современный литературный русский с кратким, афористичным синтаксисом. Повтор «говорили» сохранён ради структуры изречения. «Живой» и «мёртвые» образуют намеренно резкую антитезу; архаизмы и конфессиональные уточнения не вводятся.
