revisions:
- from: 'Иисус сказал: «Блажен человек, который знает, с какой стороны[a] придут разбойники, чтобы заранее, прежде чем они войдут, встать, собрать своё царство[b] и препоясаться».'
  to: 'Иисус сказал: «Блажен человек, который знает, в каком месте[a] войдут разбойники, чтобы встать, собрать своё царство[b] и препоясаться заранее, прежде чем они войдут».'
  rationale: 'Исправлена единственная содержательно значимая конкретизация: «сторона» заменена на более широкое «место», соответствующее «части» в источнике. Сохранены множественное число «разбойники», субъект всех трёх действий, буквальное «царство» и идиома подготовки. Сноски приведены в соответствие с новой формулировкой и сохраняют спорную неоднозначность.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная смысловая линия передана верно: множественное «разбойники», цепочка действий самого человека («встать, собрать… и препоясаться») и необычное «своё царство» сохранены. Однако «с какой стороны» сужает ⲙⲉⲣⲟⲥ («часть, место») до направления, тогда как исходное выражение остаётся неопределённым. Порядок временных обстоятельств также лучше передать ближе к коптскому.'
  naturalness: Текст в целом литературен и понятен. Формулировка «в каком месте разбойники войдут» несколько необычна, но оправданна как точная передача намеренно необычного и эллиптического образа без добавления неупомянутого дома.
  terminology: «Блажен», «разбойники», «встать», «собрать своё царство» и «препоясаться» удачны. «Царство» следует сохранить в основном тексте, не заменяя его объяснительными «владениями» или «силами».
  issues:
  - severity: medium
    issue: «С какой стороны» вместо «в какой части/в каком месте».
    rationale: ⲙⲉⲣⲟⲥ буквально означает «часть» и в данном контексте может обозначать место или участок; перевод «сторона» выбирает одну пространственную интерпретацию и тем самым сужает исходную неоднозначность.
  - severity: low
    issue: Временной оборот вынесен перед всеми действиями.
    rationale: Смысл не меняется, но размещение «заранее, прежде чем они войдут» после цепочки глаголов ближе воспроизводит ход коптской фразы и яснее сохраняет её акцент на предварительной подготовке.
