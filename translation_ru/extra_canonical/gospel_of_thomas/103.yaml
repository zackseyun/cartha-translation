base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: ru
  text: 'Иисус сказал: «Блажен человек, который знает, в каком месте[a] войдут разбойники, чтобы встать, собрать своё царство[b] и препоясаться заранее, прежде чем они войдут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в какой части». Слово может обозначать место или участок; возможно также, что подразумевается часть ночи (ночная стража).'
    reason: Передаёт буквальное значение ⲙⲉⲣⲟⲥ и отмечает возможное, но не обязательное временно́е понимание, не навязывая его основному тексту.
  - marker: b
    text: 'Буквально: «собрать своё царство». Необычный образ принадлежит самому тексту; в данном контексте возможны и более бытовые оттенки, такие как «владения» или «силы».'
    reason: Сохраняет в тексте ключевое слово «царство», одновременно поясняя, почему образ звучит необычно в сцене с разбойниками.
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: блажен
  rationale: Греческое заимствование μακάριος вводит формулу блаженства; «блажен» сохраняет её достоинство и узнаваемую библейскую окраску.
- source_word: ⲙⲉⲣⲟⲥ
  choice: сторона
  rationale: Буквально это «часть»; в данном контексте речь о направлении или участке, через который входят разбойники. «С какой стороны» естественно по-русски, а возможный смысл ночной стражи отмечен в сноске.
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: разбойники
  rationale: Форма имеет множественное число, подтверждённое местоименным показателем множественного числа в заключительной фразе «прежде чем они войдут».
- source_word: ⲧⲱⲟⲩⲛ
  choice: встать
  rationale: Передаёт действие «подняться, встать», не подменяя его синоптическим «бодрствовать».
- source_word: ⲥⲱⲟⲩϩ
  choice: собрать
  rationale: Прямое значение — «собирать, объединять»; необычный образ сохранён без гармонизации с синоптическими параллелями.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: царство
  rationale: Основное значение — «царство, царская власть». Контекстуально возможны «владения» или «область», однако «царство» сохраняет характерное богословское напряжение текста.
- source_word: ⲙⲟⲩⲣ ... ⲉϫⲛ ⲡⲉϥϯⲡⲉ
  choice: препоясаться
  rationale: Русский глагол естественно и кратко передаёт идиому «опоясать свои чресла», то есть приготовиться к действию.
- source_word: ϩⲁⲡⲉϩⲏ
  choice: заранее
  rationale: Передаёт временное значение «заблаговременно, прежде»; положение наречия в русском предложении ясно связывает его со всеми действиями подготовки.
theological_decisions:
- issue: Значение ⲙⲛⲧⲣⲣⲟ в повествовании о разбойниках
  choice: царство
  alternative: владения; имение; область
  rationale: Бытовые варианты сделали бы образ привычнее, но сняли бы намеренно резкое сочетание притчи с ключевой для Евангелия от Фомы темой царства. Поэтому сохранено прямое «царство», а смысловая трудность отмечена.
- issue: Соотношение с Мф 24:43 и Лк 12:39
  choice: 'сохранить самостоятельную лексику Фомы: «встать, собрать своё царство, препоясаться»'
  alternative: гармонизировать как «бодрствовать и не дать подкопать дом»
  rationale: Коптский источник использует иные глаголы и существительное; синоптическая гармонизация исказила бы данное изречение.
translation_notes:
  register: 'Современный литературный русский с достоинством формулы блаженства. Порядок обстоятельств перестроен ради ясности: «заранее, прежде чем они войдут» поставлено перед цепью действий, но относится ко всей подготовке. Архаическое «препоясать чресла» заменено естественным «препоясаться».'
