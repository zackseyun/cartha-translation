  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: ru
  text: 'Иисус сказал: «Кто разбогател, пусть царствует[a]; и кто обладает силой[b], пусть отречётся от неё[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптский глагол ⲣⲣⲣⲟ можно также передать как «быть царём» или «править»; «царствовать» сохраняет его глагольный характер и связь со словом «царь».
    reason: lexical_alternative
  - marker: b
    text: ⲇⲩⲛⲁⲙⲓⲥ — греческое заимствование со значениями «сила», «могущество», «способность», а в некоторых контекстах — «чудотворная сила».
    reason: lexical_alternative
  - marker: c
    text: В коптском тексте дополнение при глаголе «отречься» не выражено. Местоимение «неё» добавлено по смыслу и относится к упомянутой перед этим силе.
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная передача коптской формулы введения прямой речи; прошедшее время естественно для русского повествования.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: Кто разбогател
  rationale: Относительная конструкция с перфективным значением указывает на того, кто стал богатым; глагол «разбогател» кратко и естественно сохраняет эту динамику.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: пусть станет царём
  rationale: Побудительная конструкция ⲙⲁⲣⲉ- передана через «пусть»; глагол, образованный от слова «царь», допускает значения «стать/быть царём» и «царствовать». Формулировка сохраняет резкость изречения и естественна по-русски.
- source_word: ⲁⲩⲱ
  choice: а
  rationale: Русское «а» ясно обозначает смысловое сопоставление двух параллельных частей, не усиливая его до прямого противопоставления.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: у кого есть сила
  rationale: Посессивная конструкция буквально выражает наличие; «сила» широко передаёт греческое заимствование ⲇⲩⲛⲁⲙⲓⲥ, не ограничивая его политической властью или чудотворной способностью.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: пусть отречётся от неё
  rationale: ⲁⲣⲛⲁ означает «отрицать, отвергать, отрекаться». Местоимение «неё» восполняет подразумеваемое дополнение и соотносится с непосредственно предшествующей «силой».
theological_decisions:
- issue: Парадоксальное соотношение богатства, царствования и отказа от силы
  choice: Сохранить обе части без поясняющего согласования
  alternative: Истолковать богатство или силу в духовном либо общественно-политическом смысле непосредственно в тексте
  rationale: Источник не уточняет, являются ли богатство, царствование и сила буквальными или метафорическими. Перевод сохраняет эту неоднозначность и напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и dignified формулировка. Синтаксический параллелизм и смысловой парадокс оригинала сохранены, а не истолкованы внутри основного текста.
