base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: ru
  text: 'И он сказал: «Кто найдёт истолкование[a] этих речений[b], тот не вкусит смерти[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «объяснение». Слово ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ, заимствованное из греческого ἑρμηνεία, может обозначать истолкование или объяснение.'
    reason: lexical_alternative
  - marker: b
    text: В рукописи стоит форма множественного числа — «этих речений»; нормализованный коптский текст допускает чтение в единственном числе — «этого речения». Множественное число поддерживается также греческим фрагментом POxy 654.
    reason: textual_and_dialect_note
  - marker: c
    text: «Вкусить смерти» — традиционный образный оборот со значением «испытать смерть». Образ сохранён в основном тексте.
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: И
  rationale: Простой соединительный элемент, сохраняющий краткую повествовательную связь с предшествующим текстом.
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: он сказал
  rationale: Обычная прошедшая форма глагола речи; нейтральная формулировка соответствует лаконичному стилю памятника.
- source_word: ϫⲉ
  choice: передано прямой речью и кавычками
  rationale: Коптский показатель цитирования естественно передаётся в русском оформлением прямой речи.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: Кто найдёт
  rationale: Относительная конструкция обозначает обобщённого субъекта; русское «кто» естественно сохраняет это значение.
- source_word: ⲛⲁϩⲉ
  choice: найдёт
  rationale: Основное значение глагола — «найти»; здесь оно допускает также оттенок интеллектуального открытия, не устраняя образ поиска.
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: истолкование
  rationale: Греческое заимствование ἑρμηνεία имеет герменевтическое значение; «истолкование» точно и естественно передаёт его в литературном русском.
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: этих речений
  rationale: Рукописное чтение указывает на множественное число, поддерживаемое греческим POxy 654; «речения» передаёт отдельные изречения данного собрания.
- source_word: ⲛⲧⲟϥ
  choice: тот
  rationale: Самостоятельное местоимение возобновляет обобщённый относительный субъект; русская корреляция «кто … тот» сохраняет структуру и акцент.
- source_word: ϥⲛⲁ
  choice: не вкусит
  rationale: Будущее время выражено синтетической русской формой глагола.
- source_word: ϫⲓϯ
  choice: вкусит
  rationale: Сохранена яркая метафора исходной идиомы, а не заменена толкованием «испытает».
- source_word: ⲁⲛ
  choice: не
  rationale: Передаёт стандартное коптское отрицание.
- source_word: ⲛⲡⲙⲟⲩ
  choice: смерти
  rationale: Родительный падеж требуется русским глаголом «вкусить»; определённый артикль отдельно не передаётся.
theological_decisions:
- issue: Характер обещания о смерти
  choice: Сохранена дословная формула «не вкусит смерти» без уточнения, идёт ли речь о физической, духовной или окончательной смерти.
  alternative: Передать как «не испытает смерти» либо истолковать вид смерти.
  rationale: Исходный текст оставляет смысл богословски напряжённым и неоднозначным; перевод не должен преждевременно разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский с лаконичным, достоинственным звучанием. Формула «кто … тот» слегка приподнята, но понятна современному читателю и точно передаёт возобновляющее местоимение оригинала. «Речения» выбрано вместо более разговорного «слова» для обозначения отдельных афористических изречений.
