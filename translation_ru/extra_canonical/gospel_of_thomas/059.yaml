base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: ru
  text: 'Иисус сказал: «Ищите Живого[a], пока вы живы, чтобы вы не умерли и затем не стали искать его, чтобы увидеть, когда уже не сможете увидеть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «того, кто жив». Возможно также: «живого». Заглавная буква передаёт возможное титульное употребление, но текст прямо не называет, кто имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: ищите
  rationale: Сочетание означает направленный поиск, стремление найти. Русское «ищите» естественно передаёт его без ненужной кальки предлога ⲛⲥⲁ.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: Живого
  rationale: Субстантивированное прилагательное естественно передаёт относительную конструкцию «того, кто живёт». Заглавная буква сохраняет возможную титульность выражения, не уточняя личность референта.
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: пока вы живы
  rationale: Передаёт временное значение обстоятельственной конструкции и естественно подчёркивает ограниченность возможности поиска временем жизни.
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉⲛⲧⲱⲧⲛⲙⲟⲩ
  choice: чтобы вам не умереть
  rationale: Сохраняет отрицательное целевое значение конструкции без архаического русского «дабы не».
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ ⲉⲣⲟϥ
  choice: искать возможности увидеть его
  rationale: Сохраняет тематически важный глагол «искать» и одновременно передаёт направленность действия на последующий инфинитив «увидеть»; оборот намеренно не сводится просто к «пытаться».
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: не суметь увидеть
  rationale: Идиоматическое значение выражения — отсутствие способности или возможности; «не суметь» естественно сочетается с итоговой конструкцией и сохраняет будущую перспективу.
theological_decisions:
- issue: Референт выражения ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: Живого
  alternative: того, кто жив
  rationale: Перевод сохраняет возможное титульное звучание, но не отождествляет Живого прямо с Иисусом, Богом или иной фигурой, поскольку источник этого не уточняет.
- issue: Характер смерти и видения
  choice: не уточнять, являются ли смерть и видение физическими или духовными
  alternative: истолковать как телесную смерть и посмертное видение Бога
  rationale: Изречение допускает богословское и экзистенциальное прочтение, но сам коптский текст не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский с лаконичным, афористичным ритмом. Синтаксис сохраняет последовательность исходного предостережения, но избегает тяжёлой буквальности и церковнославянизмов.
