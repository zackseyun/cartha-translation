revisions:
- from: 'Иисус сказал: «Ищите Живого[a], пока вы живы, чтобы вам не умереть, а потом искать возможности увидеть его — и уже не суметь увидеть».'
  to: 'Иисус сказал: «Ищите Живого[a], пока вы живы, чтобы вы не умерли и затем не стали искать его, чтобы увидеть, когда уже не сможете увидеть».'
  rationale: 'Перевод устранён не подтверждённый источником смысл «возможности», сохранён повтор глагола «искать» для двух разных коптских глаголов и нейтрально передана последовательность: смерть, последующий поиск ради видения и невозможность увидеть. Неоднозначность того, кто такой «Живой», а также характера смерти и видения не истолковывается.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальный призыв, временное ограничение и намеренная неопределённость референта переданы верно. Однако «искать возможности увидеть его» добавляет к ϣⲓⲛⲉ ⲉⲛⲁⲩ смысл «искать способ/возможность», которого в источнике нет: речь о том, чтобы искать увидеть его. Противительное «а потом» также менее точно, чем последовательное «и затем».'
  naturalness: Текст в целом литературен и афористичен. Оборот «искать возможности увидеть» несколько канцелярски тяжёл и меняет смысл. Перестройка с прямым обозначением последовательности делает фразу естественнее без потери краткости.
  terminology: «Живой» с заглавной буквы допустим как сохранение возможного титульного звучания без догматического отождествления. Сноска корректно оговаривает эту неоднозначность. «Ищите» удачно передаёт ϭⲱϣⲧ ⲛⲥⲁ; повтор «искать» во второй части важно сохранить для соответствия ϣⲓⲛⲉ и тематического мотива текста.
  issues:
  - severity: medium
    issue: Добавлен смысл «возможности» во фразе «искать возможности увидеть его».
    rationale: Коптское ϣⲓⲛⲉ ⲉⲛⲁⲩ ⲉⲛⲧⲟϥ/ⲉⲣⲟϥ означает «искать увидеть его» / «стремиться увидеть его», а не «искать возможность или способ увидеть его».
  - severity: low
    issue: «А потом» придаёт исходному ⲁⲩⲱ оттенок противопоставления.
    rationale: 'В источнике стоит обычное соединительное «и»; временная последовательность передаётся самим контекстом. Лучше выразить её нейтрально: «и затем».'
  - severity: low
    issue: «Вам не умереть» слегка книжно и менее прямо передаёт личную форму.
    rationale: «Чтобы вы не умерли» — современная естественная форма, ясно отражающая субъект отрицательной целевой конструкции.
  revised_text: 'Иисус сказал: «Ищите Живого[a], пока вы живы, чтобы вы не умерли и затем не стали искать его, чтобы увидеть, когда уже не сможете увидеть».'
