base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: ru
  text: 'Иисус сказал: «Виноградную лозу посадили вне Отца, и, поскольку она не укрепилась[a], её вырвут с корнем[b], и она погибнет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «не утвердилась», «не стала прочной»; по смыслу образа — «не укоренилась». Сам глагол обозначает прочность и устойчивость, не называя корни прямо.'
    reason: lexical_alternative
  - marker: b
    text: Более буквально этот оборот может указывать на вырывание у самого корня или отделение от корня. «С корнем» — естественная русская передача образа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: виноградная лоза
  rationale: Греческое заимствование ἄμπελος обозначает виноградную лозу; такой перевод сохраняет сельскохозяйственную конкретность образа.
- source_word: ⲁⲩⲧⲟϭⲥ
  choice: посадили
  rationale: Глагол ⲧⲱϭⲉ означает «сажать»; неопределённо-личная форма естественно передаёт коптское 3-е лицо множественного числа с обобщённым деятелем.
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: вне Отца
  rationale: Сохраняет пространственное выражение «снаружи/вне» и определённое обозначение «Отец», не подменяя его формой «Мой Отец» и не истолковывая метафору.
- source_word: ⲥⲧⲁϫⲣⲟ
  choice: не укрепилась
  rationale: Передаёт состояние отсутствия прочности или устойчивости и остаётся естественным применительно к растению, не добавляя прямо не выраженного в глаголе образа укоренения.
- source_word: ⲛⲧⲟⲟⲩ/ⲥⲉⲛⲁ- + ⲡⲱⲣⲕ
  choice: её вырвут
  rationale: Русская неопределённо-личная конструкция сохраняет обобщённого деятеля коптского 3-го лица множественного числа и значение удаления растения из земли.
- source_word: ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ
  choice: с корнем
  rationale: Естественный русский оборот передаёт отделение растения от его корня; возможный более буквальный вариант отмечен в сноске.
- source_word: ⲧⲁⲕⲟ
  choice: погибнет
  rationale: Передаёт значение гибели, уничтожения или прихода в негодность и сохраняет торжественную афористичность изречения.
theological_decisions:
- issue: Значение выражения «вне Отца»
  choice: 'Сохранено буквально: «вне Отца»'
  alternative: «за пределами Отца» или истолковывающая передача
  rationale: Источник оставляет образ богословски напряжённым и не разъясняет, что именно значит находиться «вне» Отца; перевод не должен разрешать эту неоднозначность.
- issue: Временная характеристика состояния лозы
  choice: 'Настоящее состояние: «она не укрепилась»'
  alternative: 'Прошедшее: «она не была укреплена»'
  rationale: Коптский обстоятельственный статив описывает состояние лозы, а не обязательно отдельное действие над ней в прошлом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и афористичным ритмом. Неопределённо-личные формы «посадили» и «вырвут» естественно воспроизводят обобщённое третье лицо множественного числа коптского текста. Необычное выражение «вне Отца» сохранено ради исходной образности и богословской неоднозначности.
