base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: ru
  text: 'Они сказали Иисусу: «Давайте сегодня помолимся и попостимся». Иисус сказал: «Какой же грех Я совершил? Или в чём Меня одолели?[a] Но когда жених выйдет из брачного чертога, тогда пусть они постятся и молятся».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Или в чём надо Мной взяли верх?» Коптский глагол может означать «одолеть, победить»; форма третьего лица множественного числа не конкретизирует действующее лицо.'
    reason: lexical_alternative
  - marker: b
    text: «Жених» и «брачный чертог» передают греческие заимствования в коптском тексте. Формы «пусть они постятся и молятся» имеют значение повеления или побуждения, а не простого будущего.
    reason: cultural_and_grammar_note
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: давай
  rationale: Императив вводит приглашение к совместному действию; разговорно-нейтральное «давай» естественно передаёт последующие формы первого лица множественного числа.
- source_word: ⲛⲡϩⲟⲟⲩ
  choice: сегодня
  rationale: Буквально «в этот/тот день»; в данном временном употреблении означает «сегодня».
- source_word: ϣⲗⲏⲗ
  choice: молиться
  rationale: Прямое и общепонятное соответствие обычному коптскому глаголу молитвы.
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: поститься
  rationale: Точно передаёт греческое заимствование со значением соблюдения поста.
- source_word: ⲡⲛⲟⲃⲉ
  choice: грех
  rationale: Основное нравственно-религиозное значение существительного; сохраняет остроту риторического вопроса.
- source_word: ⲟⲩ ⲅⲁⲣ ⲡⲉ
  choice: какой же
  rationale: Передаёт вопросительную конструкцию и оттенок γάρ; контекст требует вопроса, а не утверждения.
- source_word: ϫⲣⲟ ⲉⲣⲟⲓ
  choice: Меня одолели
  rationale: Без инфинитивного дополнения ϫⲣⲟ с ⲉ- естественнее означает «одолеть, победить», а неопределённое третье лицо множественного числа допускает безлично-пассивное прочтение.
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: жених
  rationale: Обычный русский эквивалент греческого заимствования νυμφίος.
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: брачный чертог
  rationale: Сохраняет свадебный образ греческого νυμφών и соответствует достоинству литературного регистра.
- source_word: ⲙⲁⲣⲟⲩ-
  choice: пусть они
  rationale: Передаёт юссив третьего лица множественного числа, а не простое будущее время.
theological_decisions:
- issue: Причина поста и молитвы после выхода жениха
  choice: Сохранена образная формулировка без пояснения личности жениха и смысла его выхода.
  alternative: Истолковать жениха как Иисуса, а выход — как его отнятие или смерть.
  rationale: Само изречение не раскрывает символику; перевод не должен вносить конфессиональное или гармонизирующее толкование.
- issue: Смысл ϫⲣⲟ в вопросе Иисуса
  choice: «в чём Меня одолели?»
  alternative: «в чём Меня принудили?»
  rationale: «Одолели» лучше передаёт засвидетельствованное значение победы или преодоления и сохраняет возможную нравственно-духовную напряжённость, не называя подразумеваемого противника.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. «Давай» естественно выражает приглашение к совместному действию; «брачный чертог» сохраняет торжественный образ, не делая весь текст архаичным. Заглавная буква в местоимении «Я/Меня» следует принятому русскому библейскому издательскому регистру.
