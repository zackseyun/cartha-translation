revisions:
- from: 'Они сказали Иисусу: «Давай сегодня помолимся и будем поститься». Иисус сказал: «Какой же грех Я совершил? Или в чём Меня одолели?[a] Но когда жених выйдет из брачного чертога, тогда пусть они постятся и молятся».[b]'
  to: 'Они сказали Иисусу: «Давайте сегодня помолимся и попостимся». Иисус сказал: «Какой же грех Я совершил? Или в чём Меня одолели?[a] Но когда жених выйдет из брачного чертога, тогда пусть они постятся и молятся».[b]'
  rationale: 'Исправлено только коллективное приглашение в первой фразе и уточнена грамматическая формулировка сноски. Остальные решения сохранены: они согласуются с коптским текстом и английской аудиторской фиксацией, в том числе предпочтением «одолели/были побеждены» вместо «были принуждены».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт ход изречения: приглашение к молитве и посту, риторические вопросы о грехе и поражении, а затем образ жениха, выходящего из брачного чертога. «Меня одолели» удачно отражает ϫⲣⲟ ⲉⲣⲟⲓ как «победили/одолели», не подменяя его значением «принудили». Однако «Давай» обращено к одному собеседнику и разговорно окрашено, тогда как реплика произносится группой и содержит призыв к совместному действию.'
  naturalness: «Давайте сегодня помолимся и попостимся» — естественная современная литературная передача коллективного приглашения. «Пусть они постятся и молятся» сохраняет намеренно неразъяснённое третье лицо и звучит по-русски ясно. «Брачный чертог» уместен в возвышенном образном регистре.
  terminology: «Грех», «поститься», «жених» и «брачный чертог» терминологически точны. Заглавные буквы в местоимениях Иисуса допустимы как редакционная библейская конвенция и не меняют смысла.
  issues:
  - severity: low
    issue: «Давай» в начальной реплике
    rationale: Форма единственного числа не вполне согласуется с коллективным говорящим «они» и имеет более разговорный оттенок, чем требуется. Множественное «давайте» естественно передаёт приглашение к совместному действию; самостоятельное «придите/идём» в коптском в русском идиоматически включается в такую пригласительную формулу.
  - severity: low
    issue: Формулировка сноски о действующем лице при «Меня одолели»
    rationale: В коптском стоит неопределённо употреблённая форма 3-го лица множественного числа; лучше не говорить, что действующее лицо вовсе «не названо», а уточнить, что оно не конкретизировано.
