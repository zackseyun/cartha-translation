base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: ru
  text: 'Иисус сказал: «Блажен[a] этот лев, которого съест человек, так что лев станет человеком; и мерзок[b] этот человек, которого съест лев, и лев станет человеком».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастлив», «благополучен». Слово сохраняет форму изречения-блаженства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отвратителен», «ненавистен»; возможный перевод по смыслу — «проклят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: блажен
  rationale: Греческое заимствование μακάριος имеет смысл «блаженный, счастливый»; «блажен» сохраняет форму изречения-блаженства и его возвышенную окраску, не устраняя возможного значения счастья или благополучия.
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: лев
  rationale: Прямое общеупотребительное соответствие; различие написаний в рукописи не меняет смысла.
- source_word: ⲡⲁⲓ
  choice: этот
  rationale: Сохраняет указательное усиление исходного текста, а не сглаживает его до простого определённого обозначения.
- source_word: ⲡⲣⲱⲙⲉ
  choice: человек
  rationale: Передаёт родовое обозначение человеческого существа без необоснованного ограничения мужским полом.
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: которого съест
  rationale: Будущее время с объектным местоимением передано естественной русской относительной конструкцией; одушевлённый лев требует формы «которого».
- source_word: ⲛⲧⲉⲡⲙⲟⲩⲓ ϣⲱⲡⲉ ⲛⲣⲱⲙⲉ
  choice: так что лев станет человеком
  rationale: «Так что» отражает тесную связь и следствие, выраженные конъюнктивной конструкцией, и отличает её от самостоятельного будущего в конце изречения.
- source_word: ⲃⲱⲧⲉ
  choice: мерзок
  rationale: Передаёт значение отвратительности и отверженности без внесения более узкого представления о формальном проклятии; сохраняет резкое противопоставление слову «блажен».
- source_word: ⲡⲙⲟⲩⲓ ⲛⲁϣⲱⲡⲉ ⲛⲣⲱⲙⲉ
  choice: лев станет человеком
  rationale: Самостоятельная конструкция будущего времени передана обычным русским будущим, в отличие от предшествующего следственного оборота.
theological_decisions:
- issue: Смысл превращения льва в человека
  choice: Оставить образ без толкования
  alternative: Разъяснить льва и поедание как символ духовных, телесных или нравственных сил
  rationale: Само изречение не раскрывает символику; перевод должен сохранять его загадочность и богословское напряжение, а не закреплять одну интерпретацию.
- issue: Характер отрицательной оценки человека
  choice: «мерзок»
  alternative: «проклят»
  rationale: Исходное ⲃⲱⲧⲉ прежде всего выражает отвратительность или отверженность; «проклят» могло бы необоснованно придать фразе более специальный богословско-юридический смысл.
translation_notes:
  register: Современный литературный русский язык с краткими предикативными формами «блажен» и «мерзок», сохраняющими афористичность, параллелизм и суровую образность оригинала. Повтор «лев станет человеком» намеренно не сглажен.
