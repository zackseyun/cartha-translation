base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: ru
  text: 'Иисус сказал: «Блажен[a] человек, претерпевший тяготы[b]: он обрёл жизнь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные оттенки: «счастлив» или «благополучен».'
    reason: lexical_alternative
  - marker: b
    text: Коптское слово может означать также «трудившийся», «изнурявшийся» или «страдавший».
    reason: lexical_alternative
  - marker: c
    text: В рукописи стоит ⲁⲡⲱⲛϩ; написание понимается как орфографический вариант ожидаемого сочетания со значением «нашёл (обрёл) жизнь».
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: блажен
  rationale: Греческое заимствование μακάριος выражает состояние того, кому выпало благо; «блажен» сохраняет торжественную форму изречения, не сводя смысл лишь к субъективному счастью.
- source_word: ⲡⲣⲱⲙⲉ
  choice: человек
  rationale: Слово обозначает человека вообще. Русское «человек» здесь естественно и не ограничивает высказывание лицами мужского пола.
- source_word: ⲛ̄ⲧⲁϩϩⲓⲥⲉ
  choice: претерпевший тяготы
  rationale: Рукописная форма разбирается как относительный перфект с субъектным показателем 3-го лица единственного числа; ϩⲓⲥⲉ охватывает труд, изнурение, бедствие и страдание. «Претерпевший тяготы» сохраняет широту значения лучше, чем исключительно «трудившийся» или «страдавший».
- source_word: ⲁϥϩⲉ
  choice: он обрёл
  rationale: Перфективная форма означает завершённое нахождение. «Обрёл» естественно сочетается с «жизнью» и сохраняет возвышенную краткость изречения; обычное местоимение «он» не вносит отсутствующего в рукописи особого логического ударения.
- source_word: ⲡⲱⲛϩ
  choice: жизнь
  rationale: Определённый артикль в коптском может иметь обобщающее значение; по-русски безартиклевое «жизнь» звучит естественно и не навязывает специального толкования выражения «эта/та самая жизнь».
- source_word: ⲡⲉϫⲉⲓ︤ⲥ︥
  choice: Иисус сказал
  rationale: Обычная повествовательная формула введения прямой речи; сокращённое священное имя раскрыто как «Иисус».
theological_decisions:
- issue: Характер тягот, предшествующих обретению жизни
  choice: Оставлено широкое выражение «претерпевший тяготы»
  alternative: «трудившийся» или «страдавший»
  rationale: Коптское ϩⲓⲥⲉ допускает труд, изнурение и страдание. Контекст изречения не позволяет уверенно ограничить смысл физическим трудом, гонениями, аскезой или душевным страданием.
- issue: Значение «жизни»
  choice: Передано просто как «жизнь»
  alternative: «истинная жизнь», «вечная жизнь» или «Жизнь»
  rationale: Исходный текст не содержит уточняющего определения; богословскую конкретизацию не следует добавлять в основной текст.
translation_notes:
  register: Краткое, афористичное и достойное современное литературное изложение. «Блажен» сохраняет форму макаризма, а «претерпевший тяготы» избегает как разговорной мягкости «потрудился», так и неоправданного сужения смысла до одного лишь страдания. Перевод следует рукописным формам ⲛ̄ⲧⲁϩϩⲓⲥⲉ и ⲁϥϩⲉ, в которых имеется обычный субъектный показатель 3-го лица, а не самостоятельное усилительное местоимение.
