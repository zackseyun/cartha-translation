base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: ru
  text: 'Иисус говорит: «Там, где есть три бога, они — боги.[a] Там, где есть двое или один, Я с ним».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи первая фраза передана трудной конструкцией, допускающей иное буквальное понимание; нормализованный текст также отличается от рукописного чтения. Перевод «они — боги» учитывает множественную связку рукописи и параллельный греческий свидетель POxy 1.
    reason: textual_variant
  - marker: b
    text: В греческом свидетельстве POxy 1 слово «двое» отсутствует; далее там следуют слова о камне и дереве, которые в коптской рукописи находятся отдельно, в изречении 77.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус говорит
  rationale: Настоящее время сохраняет характерную для сборника непосредственность вводной формулы.
- source_word: ⲡⲙⲁ ⲉⲣⲉⲟⲩⲛ- … ⲙⲙⲁⲩ
  choice: там, где есть
  rationale: Естественно передаёт буквальное «место, где … там», не воспроизводя тяжеловесную пространственную избыточность.
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: три бога
  rationale: Сохраняет вызывающий и богословски напряжённый буквальный множественный смысл ⲛⲟⲩⲧⲉ, не заменяя его более отвлечённым «божества».
- source_word: ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ / ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ
  choice: они — боги
  rationale: Следует наиболее связному прочтению предикации при предшествующем множественном подлежащем; тире ясно оформляет именную конструкцию, а примечание сохраняет текстовую трудность.
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: двое или один
  rationale: Передаёт числительные без добавления не названного в тексте существительного; личная форма «двое» уместна ввиду последующего «с ним».
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ / ⲁⲛⲟⲕϣⲱⲡⲉ
  choice: Я сам
  rationale: Самостоятельное местоимение перед формой первого лица выражает фокус или подчёркивание субъекта, а не буквальное удвоение «Я — Я».
- source_word: ⲙⲛⲛⲧⲟϥ
  choice: с ним
  rationale: Сохраняет мужское единственное число местоименного объекта исходного текста.
theological_decisions:
- issue: Множественное «боги» в первой части
  choice: Сохранено буквальное «три бога … боги»
  alternative: Сгладить как «трое … божественны» или «три божества»
  rationale: Исходная формулировка намеренно трудна и богословски напряжённа; перевод не должен заранее объяснять её в рамках какой-либо доктрины.
- issue: Подчёркнутое присутствие Иисуса
  choice: «Я сам с ним»
  alternative: «Я с ним» или «Я — Я с ним»
  rationale: «Я сам» естественно передаёт субъектный акцент коптского текста, не превращая грамматическое усиление в искусственное повторение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Заглавное «Я» в прямой речи подчёркивает отнесённость к Иисусу, не добавляя отдельного богословского толкования. Формула «Я сам» передаёт эмфатический субъект естественно для русского языка.
