base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: ru
  text: 'Ученик сказал Ему: «Твои братья и Твоя мать стоят снаружи[a]». Он ответил им: «Те, кто здесь[b] исполняет волю[c] Моего Отца, — Мои братья и Моя мать[f]. Именно они войдут[d] в Царство[e] Моего Отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально рукопись содержит: «стоят перед ними/перед вами, снаружи». Элемент «перед ними/перед вами» в контексте неоднозначен или избыточен и не передан в основном тексте.'
    reason: dialect_note
  - marker: b
    text: 'Буквально: «те, кто в этом месте».'
    reason: lexical_alternative
  - marker: c
    text: Коптское ⲟⲩⲱϣ может означать не только «волю», но также «желание» или «пожелание».
    reason: lexical_alternative
  - marker: d
    text: 'Буквально возможно также: «пойдут внутрь».'
    reason: lexical_alternative
  - marker: e
    text: Коптское слово «Царство» (ⲙⲛⲧⲣⲣⲟ) образовано от слова «царь» и может указывать как на царскую власть, так и на область царствования.
    reason: cultural_note
  - marker: f
    text: Ср. Мк. 3:31–35; Мф. 12:46–50; Лк. 8:19–21. В Евангелии от Фомы к семейному изречению добавлены слова о входе в Царство Отца.
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: братья
  rationale: Обычное значение в саидском коптском — братья мужского пола; более широкое «братья и сёстры» возможно в некоторых контекстах, но здесь прямая семейная формулировка поддерживает «братья».
- source_word: ⲙⲁⲁⲩ
  choice: мать
  rationale: Прямое и общеупотребительное соответствие коптскому обозначению матери.
- source_word: ⲥⲉⲁϩⲉⲣⲁⲧⲟⲩ ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: стоят снаружи
  rationale: Рукописная конструкция обозначает пребывание стоя, а устойчивое сочетание ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ — внешнее местонахождение; русский оборот естественно передаёт оба элемента.
- source_word: ⲡⲉⲓⲙⲁ
  choice: здесь
  rationale: Передаёт указание на непосредственное место — буквально «в этом месте» — без тяжеловесности.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  choice: исполняет волю
  rationale: Естественный русский эквивалент устойчивой конструкции «делать волю»; глагол «исполнять» здесь звучит ясно и литературно.
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: Моего Отца
  rationale: Сохранено личное отношение первого лица и титульное употребление слова «Отец»; прописная буква соответствует принятому русскому религиозно-литературному оформлению.
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: войдут
  rationale: Коптская конструкция буквально выражает движение внутрь; «войдут» точно и естественно передаёт её в данном контексте.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Традиционный и понятный эквивалент абстрактного существительного, образованного от слова «царь»; сохраняет как пространственный, так и властный оттенок.
theological_decisions:
- issue: Основание духовного родства
  choice: 'Сохранена прямая формула: исполняющие волю Отца названы братьями и матерью Иисуса.'
  alternative: Разъяснить её как превосходство духовной семьи над родственной.
  rationale: Источник оставляет высказывание напряжённым и не формулирует явного отрицания или отвержения кровной семьи; перевод не добавляет такого вывода.
- issue: Вход в Царство Отца
  choice: «Именно они войдут в Царство Моего Отца».
  alternative: «Именно они обретут участие в правлении Моего Отца».
  rationale: Форма будущего времени и образ движения внутрь сохранены; значение Царства не сведено исключительно ни к месту, ни к царствованию.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным синтаксисом. Сохранены семейная метафора, указательное «здесь» и повтор «Моего Отца». Местоимения, относящиеся к Иисусу, оформлены с прописной буквы в соответствии с русской религиозно-издательской традицией; архаизмы и конфессиональные пояснения не добавлены.
