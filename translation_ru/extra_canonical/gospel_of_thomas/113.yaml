base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: ru
  text: 'Его ученики сказали ему: «В какой день придёт Царство[a]?»


    [Он сказал]:[b] «Оно придёт не так, чтобы его можно было заметить. Не скажут: „Смотрите, вот здесь!“ — или: „Смотрите, вот там!“[c] Напротив, Царство Отца распростёрто по земле[d], а люди его не видят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское слово можно также перевести как «царствование» или «царская власть»; оно обозначает не только территориальное царство, но и само правление.
    reason: lexical_alternative
  - marker: b
    text: 'Слов «Он сказал» в рукописи нет: после вопроса учеников сразу следует ответ.'
    reason: source_ellipsis
  - marker: c
    text: В рукописной строке читается «там», что образует пару «здесь — там». В нормализованном тексте напечатана форма, которую можно понять как «небо».
    reason: textual_variant
  - marker: d
    text: Слово, переведённое как «земля», может также означать «суша» или «местность».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Коптское отвлечённое существительное обозначает царствование, власть или царство. В русском библейском и общехристианском употреблении «Царство» естественно передаёт эту многозначность, не сводя выражение ни к территории, ни только к акту правления.
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: в какой день
  rationale: Сохраняет буквальную временную формулировку «в какой день», не сглаживая её до общего «когда».
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ
  choice: так, чтобы его можно было заметить
  rationale: Передаёт идею наблюдения или высматривания внешне различимых признаков естественным современным русским оборотом.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Смотрите, вот
  rationale: Сохраняет энергичную указательную силу выражения; в первой реплике «Смотрите» выражено явно, а во второй подразумевается во избежание тяжеловесного повтора.
- source_word: ⲡⲓⲥⲁ
  choice: здесь
  rationale: Хотя буквально возможно «это место», в указательной паре выражение функционирует как «здесь».
- source_word: ⲧⲏ / ⲡⲏ
  choice: там
  rationale: Чтение рукописной строки ⲧⲏ образует естественную пару «здесь / там»; нормализованное ⲡⲏ могло бы означать «небо».
- source_word: ⲥⲡⲱⲣϣ ⲉⲃⲟⲗ
  choice: распростёрто
  rationale: Передаёт статическое состояние уже распространённой, повсюду наличной реальности и сохраняет пространственный образ исходного глагола.
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  choice: по земле
  rationale: Естественно передаёт пространственный образ; ⲡⲕⲁϩ может также обозначать землю как сушу или местность.
- source_word: ⲛⲣⲱⲙⲉ
  choice: люди
  rationale: Обобщающее множественное число без необоснованного гендерного сужения.
theological_decisions:
- issue: Царство как уже присутствующая, но невидимая реальность
  choice: Сохранена прямая формулировка «Царство Отца распростёрто по земле, а люди его не видят»
  alternative: Истолковать Царство как исключительно внутреннее, духовное либо будущее
  rationale: Источник утверждает его распространённость по земле и человеческую неспособность увидеть, но не объясняет природу этой невидимости; перевод не должен разрешать напряжение за текст.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Синтаксис вопроса сохраняет необычное «в какой день». Квадратные скобки отмечают отсутствующую в коптском связку речи. Заглавное «Царство» употреблено как традиционное наименование Царства Отца, без навязывания конфессионального толкования.
