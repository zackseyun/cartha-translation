base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: ru
  text: 'Иисус сказал: «Небеса и земля свернутся у вас на глазах, и тот, кто живёт от живого, не увидит смерти». Разве Иисус не говорит[a]: «Кто нашёл самого себя[b], того мир недостоин»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь текст внезапно переходит к речи об Иисусе в третьем лице и ссылается на его изречение как на внешнее свидетельство. Такой метакомментарий необычен для Евангелия от Фомы и может быть замечанием составителя или более поздним редакционным добавлением, вошедшим в текст.
    reason: textual_variant
  - marker: b
    text: Коптское выражение ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ грамматически может означать «нашёл самого себя», но слово ⲟⲩⲁⲁϥ также несёт оттенок значения «один, в одиночестве».
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: свернутся
  rationale: Глагол означает «сворачивать, складывать» и подходит к апокалиптическому образу сворачивающихся небес; один глагол в источнике относится к согласованным «небесам и земле».
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: у вас на глазах
  rationale: Оборот означает «перед вами, в вашем присутствии». Современное русское выражение естественно передаёт непосредственное присутствие адресатов.
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ ⲡⲉⲧⲟⲛϩ
  choice: тот, кто живёт от живого
  rationale: 'Сохранены повтор корня «жить» и неоднозначность «живого»: текст не уточняет, идёт ли речь об Отце, Иисусе или вообще о божественном источнике жизни.'
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: Разве … не …?
  rationale: Здесь сочетание вводит вопрос, предполагающий утвердительный ответ; русская конструкция «разве не» передаёт эту функцию.
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: нашёл самого себя
  rationale: ⲁϩⲉ ⲉⲣⲟ- означает «найти», а ⲟⲩⲁⲁϥ придаёт выражению возвратный смысл, одновременно допуская оттенок «один, в одиночестве».
- source_word: ⲙ̄ⲡϣⲁ
  choice: недостоин
  rationale: Предикативное «не достоин» передано кратким прилагательным; перестановка «того мир недостоин» сохраняет отношение между человеком и миром и звучит по-русски торжественно, но понятно.
theological_decisions:
- issue: Кого обозначает «живой»
  choice: живого, со строчной буквы
  alternative: Живого, с прописной буквы
  rationale: Строчная буква сохраняет неоднозначность источника и не навязывает отождествление с конкретным божественным лицом.
- issue: Смысл выражения о нахождении себя
  choice: нашёл самого себя
  alternative: нашёл себя в одиночестве
  rationale: Основной текст передаёт грамматически наиболее вероятное возвратное значение, а возможный мотив одиночества отмечен в сноске, без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и слегка возвышенным строем. Синтаксис сохраняет резкий переход от прямой речи Иисуса к внешнему вопросу об Иисусе; неоднозначные богословские обозначения не конкретизированы.
