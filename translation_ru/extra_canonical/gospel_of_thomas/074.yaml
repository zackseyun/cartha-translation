base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: ru
  text: 'Он сказал[a]: «Господи, вокруг цистерны много людей[b], но в колодце никого нет[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Он сказал: “Господи…”». Неясно, кто говорит и к кому обращается: это может быть ученик, обращающийся к Иисусу, или Иисус, обращающийся к Богу. Иногда эти слова считают продолжением изречения 73.'
    reason: Сохранение неопределённости говорящего и адресата.
  - marker: b
    text: Коптское ⲡϫⲱⲧⲉ означает «колодец» или «цистерна». «Цистерна» выбрана, чтобы отличить его от следующего ⲡϣⲱⲛⲉ, также обозначающего колодец, цистерну или яму; это различение не абсолютно.
    reason: Передача различия близких по значению слов без излишней конкретизации.
  - marker: c
    text: 'Коптское ⲗⲁⲁⲩ в отрицательной конструкции обычно означает «никого», но может пониматься и как «ничего». Возможен также перевод: «но в колодце ничего нет».'
    reason: Сохранение грамматической и образной неоднозначности.
lexical_decisions:
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ … ⲡϫⲟⲉⲓⲥ
  choice: 'Он сказал: «Господи…»'
  rationale: Форма речи буквально вводит слова «Он сказал», а ⲡϫⲟⲉⲓⲥ естественно понимается как обращение. Перевод сохраняет неопределённость личности говорящего и адресата.
- source_word: ⲡϫⲱⲧⲉ
  choice: водопой
  rationale: Слово может обозначать колодец или водосборник. «Водопой» передаёт место, вокруг которого собираются, и позволяет не смешивать его со следующим ⲡϣⲱⲛⲉ; менее интерпретирующие варианты указаны в сноске.
- source_word: ⲡϣⲱⲛⲉ
  choice: колодец
  rationale: Слово обозначает колодец, водосборник или яму. «Колодец» здесь естественен по-русски и сохраняет образ углублённого вместилища воды.
- source_word: ⲗⲁⲁⲩ
  choice: ничего
  rationale: При отрицательной конструкции слово допускает значения «ничего» и «никого». «Ничего» наиболее естественно в связи с колодцем, но грамматическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Кто говорит и к кому обращается
  choice: '«Он сказал: „Господи…“» без уточнения лиц'
  alternative: «Господь сказал…»; ученик обращается к Иисусу; Иисус обращается к Богу
  rationale: Коптский текст не называет говорящего, а форму ⲡϫⲟⲉⲓⲥ позволяет понять как обращение. Уточнение личности внесло бы отсутствующее в источнике толкование.
- issue: Смысл отсутствия в колодце
  choice: «ничего нет»
  alternative: «никого нет»
  rationale: Оба значения грамматически возможны. Основной текст следует наиболее естественному предметному образу пустого колодца, не исключая в сноске личного прочтения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. «Собрались у водопоя» звучит естественнее буквального «многие вокруг водопоя», при этом не развивает метафору сверх текста. Обращение «Господи» сохраняет достоинство и библейскую узнаваемость без конфессионального уточнения.
