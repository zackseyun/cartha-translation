base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: ru
  text: 'Иисус сказал: «Придите ко Мне, ибо иго Моё благо[a], и власть Моя мягка[c]; и вы найдёте покой[b] для себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В оригинале стоит ⲭⲣⲏⲥⲧⲟⲥ, от греческого χρηστός — «добрый, благой, приятный», а не ⲭⲣⲓⲥⲧⲟⲥ — «Христос». Поэтому это определение ига, а не титул.
    reason: lexical_alternative
  - marker: b
    text: «Покой» передаёт греческое заимствование ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις). В рукописи написание буквы ипсилон слегка неустойчиво, однако само чтение надёжно.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Ср. Матфея 11:28–30. Однако у Фомы формулировка иная: «власть Моя мягка» и «для себя», а в Матфея сказано о покое «душам вашим».'
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: Придите ко Мне
  rationale: Глагол стоит в повелительном наклонении второго лица множественного числа, а ϣⲁⲁⲛⲟⲕ обозначает направление к говорящему. Русская форма ясно передаёт множественное число.
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: благо
  rationale: Заимствованное греческое χρηστός означает «добрый, благой, приятный». «Благо» естественно сочетается с «иго», сохраняет основной смысл и не сводит выражение лишь к лёгкости.
- source_word: ⲛⲁϩⲃ
  choice: иго
  rationale: Точное традиционное обозначение ярма, сохраняющее как предметный, так и переносный смысл.
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: владычество
  rationale: Абстрактное существительное от «господин, владыка». «Владычество» точнее передаёт состояние или осуществление господства, чем более общее «власть».
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: кротко
  rationale: Слово выражает мягкость, незлобивость или отсутствие суровости. В сочетании с «владычество» русское краткое прилагательное «кротко» звучит достойно и сохраняет образную напряжённость текста.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: вы найдёте
  rationale: Будущая конструкция со вторым лицом множественного числа и глаголом «находить».
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: покой
  rationale: Греческое заимствование ἀνάπαυσις означает покой, отдых или облегчение; «покой» сохраняет широкий и потенциально духовный смысл без его искусственного уточнения.
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: для себя
  rationale: Дательная конструкция со значением пользы для самих адресатов; перевод сохраняет её возвратный оттенок.
theological_decisions:
- issue: Связь с Матфея 11:28–30
  choice: Сохранено самостоятельное выражение «владычество Моё кротко» и «для себя».
  alternative: 'Согласовать формулировку с каноническим параллельным местом: «бремя Моё легко» и «покой душам вашим».'
  rationale: Коптский текст Фомы отличается от Матфея и не даёт основания устранять это различие посредством гармонизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, афористическим звучанием. Формы «иго», «благо» и «владычество» сохраняют достоинство и образность исходного изречения, не прибегая к церковнославянскому синтаксису. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской библейской издательской практике.
