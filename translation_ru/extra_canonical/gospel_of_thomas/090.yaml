  rationale: 'Заменено стилистически менее естественное «владычество Моё кротко» на «власть Моя мягка»: это сохраняет абстрактное значение ⲙⲛⲧϫⲟⲉⲓⲥ и значение мягкости ⲟⲩⲣⲙⲣⲁϣ, но звучит современно и литературно. Сноска о Матфее исправлена так, чтобы не смешивать различающиеся элементы параллельного текста и не гармонизировать Фому с Матфеем.'
