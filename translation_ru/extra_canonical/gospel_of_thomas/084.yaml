review_pass:
  verdict: revise
  source_fidelity: Первая часть верно передаёт временно-обобщённую конструкцию и аористическое «вы радуетесь». Во второй части коптское условное ⲉⲣϣⲁⲛ- требует условного оттенка; русское «если вы увидите» передаёт его яснее, чем «когда вы увидите», которое может звучать как ожидание неизбежного события. Лексическое различие ⲉⲓⲛⲉ / ϩⲓⲕⲱⲛ, предшествование во времени, отрицательные формы и финальная идиома сохранены.
  naturalness: Текст в целом литературен и краток. Замена «Но когда вы увидите» на «Но если вы увидите» делает противопоставление более естественным и грамматически точным, не перегружая загадочное изречение.
  terminology: «Подобие» и «образы» удачно сохраняют различие исходных слов, не внося богословской интерпретации. «Возникшие прежде вас» допустимо и близко к ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ передаётся нейтрально как «становятся явными». Сноски корректно объясняют рукописные и диалектные особенности.
  issues:
  - severity: medium
    issue: Условная конструкция во второй части передана как обычное временное «когда».
    rationale: ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ имеет условную силу («если/когда бы ни увидели»). В русском «если вы увидите» точнее сохраняет эту модальность; «когда вы увидите» может подразумевать, что событие непременно наступит.
