revisions:
- from: 'Иисус сказал: «В день, когда вы видите своё подобие, вы радуетесь. Но когда вы увидите свои образы[a], возникшие прежде вас[b], которые не умирают и не становятся явными[c], — сколько же вы вынесете!»'
  to: 'Иисус сказал: «В день, когда вы видите своё подобие, вы радуетесь. Но если вы увидите свои образы[a], возникшие прежде вас[b], которые не умирают и не становятся явными[c], — сколько же вы вынесете!»'
  rationale: 'Безопасная точечная правка: «если вы увидите» восстанавливает условную силу коптского ⲉⲣϣⲁⲛ-. Остальной текст и комплект сносок сохраняются, поскольку они точно отражают источник и не навязывают интерпретацию.'
