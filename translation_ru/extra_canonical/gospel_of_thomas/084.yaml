base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: ru
  text: 'Иисус сказал: «В день, когда вы видите своё подобие, вы радуетесь. Но если вы увидите свои образы[a], возникшие прежде вас[b], которые не умирают и не становятся явными[c], — сколько же вы вынесете!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В коптском здесь употреблено заимствованное из греческого слово ϩⲓⲕⲱⲛ (εἰκών, «образ»), отличное от ⲉⲓⲛⲉ («подобие») в первой части изречения.
    reason: Лексическое различие существенно для смысла противопоставления.
  - marker: b
    text: 'В рукописной форме ⲛ̄ⲧⲁϩϣⲱⲡⲉ буква ϩ представляет региональный вариант местоименного показателя третьего лица множественного числа ⲩ: «которые возникли».'
    reason: Диалектная особенность рукописи объясняет грамматический разбор.
  - marker: c
    text: 'Формы ⲙⲁⲩⲙⲟⲩ и ⲙⲁⲩⲟⲩⲱⲛϩ содержат региональный вариант отрицательного показателя обычного действия ⲙⲉⲣⲉ-: «не умирают» и «не становятся явными».'
    reason: Диалектная особенность подтверждает отрицательное значение обеих форм.
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: подобие
  rationale: Передаёт сходство или видимый облик и сохраняет отличие от следующего ϩⲓⲕⲱⲛ.
- source_word: ϩⲓⲕⲱⲛ
  choice: образы
  rationale: Прямое и естественное соответствие греческому заимствованию εἰκών; позволяет сохранить лексический контраст с «подобием», не определяя природу этих образов.
- source_word: ϣⲱⲡⲉ
  choice: возникшие
  rationale: Передаёт значение появления или начала бытия; не уточняет, были ли образы сотворены или существовали иным образом.
- source_word: ϩⲓⲧⲉⲧⲛⲉϩⲏ
  choice: прежде вас
  rationale: Естественно выражает временное предшествование, наиболее уместное при «возникших».
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: становятся явными
  rationale: Сохраняет значение проявления или обнаружения, не сводя его только к физической видимости.
- source_word: ϥⲓ ϩⲁ
  choice: вынесете
  rationale: Передаёт идиому несения или претерпевания тяжести и сохраняет загадочную силу заключительного восклицания.
theological_decisions:
- issue: Соотношение ⲉⲓⲛⲉ и ϩⲓⲕⲱⲛ
  choice: «подобие» и «образы»
  alternative: «облик» и «формы»
  rationale: Сохранено различие двух исходных слов без утверждения, что вторые непременно являются «божественными двойниками» или принадлежат к конкретной богословской системе.
- issue: Смысл существования образов прежде адресатов
  choice: «возникшие прежде вас»
  alternative: «существовавшие прежде вас» / «созданные прежде вас»
  rationale: «Возникшие» передаёт ϣⲱⲡⲉ, не усиливая текст ни до вечного предсуществования, ни до явного акта сотворения.
- issue: Заключительное ⲧⲉⲧⲛⲁϥⲓ ϩⲁⲟⲩⲏⲣ
  choice: «сколько же вы вынесете!»
  alternative: «сколько же вам предстоит вынести?»
  rationale: Выбран более формально близкий вариант, сохраняющий будущее время, меру и напряжённую неопределённость фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью афористического изречения. Синтаксис сохраняет контраст двух частей и намеренно загадочное заключение; местоимение «свои» ясно связывает образы с адресатами, не истолковывая характер этой связи.
