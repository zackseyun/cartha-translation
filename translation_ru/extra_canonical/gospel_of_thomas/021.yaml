review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт последовательность образов и важные нестандартные чтения рукописи: наготу детей «перед ними», «дом его царства» и жатву созревшего плода. Однако оборот «бодрствуйте перед лицом мира» недостаточно передаёт предостерегающе-охранительное ⲣⲟⲉⲓⲥ … ⲙⲡⲕⲟⲥⲙⲟⲥ, а фраза о χρεία в виде «нужда будет найдена» по-русски не раскрывает синтаксической связи и создаёт ложное впечатление безличного утверждения. Смысл χρεία остаётся неуверенным, поэтому его следует сохранить без догматического или чрезмерно конкретного разрешения.'
  naturalness: «Разденутся донага» разговорно-экспрессивно и менее литературно, чем «разденутся догола». «Будьте настороже перед миром» естественно в современном литературном русском и сохраняет образ противостояния. Перестройка трудной фразы с χρεία делает текст читаемым, не устраняя её лексическую неопределённость.
  terminology: «Царство» правильно сохраняет ⲙⲛ̄ⲧⲉⲣⲟ; «серп», «сжал», «разумный» уместны. Формулу «дом его царства» необходимо оставить именно в таком намеренно необычном виде. Примечание о χρεία должно прямо сообщать, что перевод «нужда» условен и что синтаксис предложения спорен.
  issues:
  - severity: medium
    issue: «Бодрствуйте перед лицом мира»
    rationale: Оборот «перед лицом» обозначает нахождение в чьём-либо присутствии и ослабляет охранительно-предостерегающий смысл ⲣⲟⲉⲓⲥ … ⲙⲡⲕⲟⲥⲙⲟⲥ. «Будьте настороже перед миром» сохраняет образ «перед/против мира» без навязывания более сильного богословского истолкования.
  - severity: medium
    issue: «То, чего вы ожидаете, — нужда — будет найдено»
    rationale: 'Такая пунктуация неестественна и семантически неясна: не выражено, кем и как «нужда» будет найдена. У χρεία и у синтаксиса всего предложения нет бесспорного решения; перевод следует сделать связным, сохранив спорность в сноске.'
  - severity: low
    issue: «Разденутся донага»
    rationale: Смысл верен, но «догола» стилистически нейтральнее и естественнее для современного литературного русского.
