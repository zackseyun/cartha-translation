revisions:
- from: 'Мария сказала Иисусу: «На кого похожи твои ученики?»


    Он сказал: «Они похожи на малых детей, поселившихся на чужом поле. Когда придут хозяева поля, они скажут: “Оставьте нам наше поле”. Тогда дети разденутся донага перед ними, чтобы оставить им поле и отдать его им.


    Поэтому говорю: если хозяин дома знает, что идёт вор, он станет бодрствовать ещё до его прихода и не позволит ему прокопать ход в дом его царства[a] и унести его добро.


    Вы же бодрствуйте перед лицом мира. С великой силой препояшьте свои бёдра, чтобы разбойники не нашли пути прийти к вам, ибо то, чего вы ожидаете, — нужда[b] — будет найдено.


    Пусть среди вас будет человек разумный. Когда плод созрел, он быстро пришёл с серпом в руке и сжал его. У кого есть уши слышать, пусть слышит».'
