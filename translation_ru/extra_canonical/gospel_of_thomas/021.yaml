- source_word: ϭⲉⲗⲓⲧ / ϭⲟⲓⲗⲉ
  choice: поселившихся
  rationale: Передаёт состояние временного проживания или обоснования на поле без добавления идеи законного владения.
- source_word: ⲥⲉⲕⲁⲕⲁϩⲏⲩ
  choice: разденутся донага
  rationale: Глагол обозначает наготу или обнажение; выражение ⲙ̄ⲡⲟⲩⲙ̄ⲧⲟ ⲉⲃⲟⲗ означает «перед ними», а не предмет одежды.
- source_word: ϣⲟϫⲧ
  choice: прокопать ход
  rationale: Сохраняет буквальный образ подкопа в дом и одновременно ясно передаёт взлом.
- source_word: ⲭⲣⲉⲓⲁ
  choice: нужда
  rationale: Греческое заимствование χρεία прежде всего допускает значения «нужда», «необходимость», «потребность»; контекст остаётся трудным, поэтому неоднозначность отмечена.
- source_word: ⲡⲱϩ
  choice: созрел
  rationale: В отношении плода глагол означает достижение зрелости.
- source_word: ϩⲁⲥ-
  choice: сжал
  rationale: Форма глагола «жать, собирать жатву»; краткое «сжал» естественно сочетается с серпом и плодом.
- source_word: ⲣⲱⲙⲉ ⲛⲉⲡⲓⲥⲧⲏⲙⲱⲛ
  choice: человек разумный
  rationale: Греческое по происхождению определение передаёт знающего, понимающего, рассудительного человека.
theological_decisions:
- issue: Дом и царство в образе вора
  choice: дом его царства
  alternative: его дом
  rationale: Сохранено необычное сочетание рукописи ⲡⲉϥⲏⲉⲓ ⲛ̄ⲧⲉⲧⲉϥⲙⲛⲧⲉⲣⲟ без гармонизации с синоптической формой «его дом».
- issue: Обнажение детей
  choice: разденутся донага перед ними
  alternative: разденутся перед ними
  rationale: Явный образ наготы сохранён без истолкования как символа первозданности, плоти или стыда.
- issue: Отношение учеников к миру
  choice: бодрствуйте перед лицом мира
  alternative: берегитесь мира
  rationale: Более буквально сохраняет пространственно-конфронтационный оборот источника и не усиливает его до однозначного осуждения мира.
- issue: Трудная фраза с χρεία
  choice: то, чего вы ожидаете, — нужда — будет найдено
  alternative: преимущество, которого вы ожидаете, будет найдено
  rationale: Синтаксис и смысл фразы не вполне прозрачны. Перевод сохраняет «ожидать» и «будет найдено», а существительное передаёт базовое значение χρεία, не превращая его без достаточных оснований в обещанное преимущество.
