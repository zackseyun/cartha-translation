base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/021.yaml
  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: ru
  text: 'Мария сказала Иисусу: «На кого похожи твои ученики?»


    Он сказал: «Они похожи на малых детей, поселившихся на чужом поле. Когда придут хозяева поля, они скажут: “Оставьте поле нам”. Тогда дети разденутся догола перед ними, чтобы оставить поле им и отдать его им.


    Поэтому говорю: если хозяин дома знает, что идёт вор, он будет бодрствовать до его прихода и не позволит ему прокопать ход в дом его царства[a], чтобы унести его добро.


    Вы же будьте настороже перед миром. С великой силой препояшьте свои бёдра, чтобы разбойники не нашли пути прийти к вам; ибо нужда[b], которой вы ожидаете, будет найдена.


    Пусть среди вас будет человек разумный. Когда плод созрел, он быстро пришёл с серпом в руке и сжал его. У кого есть уши слышать, пусть слышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дом его царства». Это необычное выражение самой коптской рукописи; его не следует упрощать до «в его дом».'
    reason: textual_variant
  - marker: b
    text: Коптское ⲭⲣⲉⲓⲁ — заимствование из греческого χρεία; возможны значения «нужда», «необходимость», «потребность», иногда «польза». Синтаксис и точный смысл всей фразы остаются спорными; «нужда» выбрано как осторожная передача.
    reason: lexical_alternative
