base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: ru
  text: 'Иисус сказал: «У кого что-то есть в руке[a], тому дадут; а у кого нет, у того отнимут даже то малое, что у него есть».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у кого есть в его руке». Коптская конструкция обладания не называет предмет прямо; слово «что-то» добавлено для ясности.'
    reason: lexical_alternative
  - marker: b
    text: Глаголы «дадут» и «отнимут» стоят в 3-м лице множественного числа и употреблены без названного деятеля. Ср. Мк 4:25; Мф 13:12; Лк 8:18; 19:26. В дипломатической транскрипции заключительное выражение ⲛ̄ⲧⲟⲟⲧϥ̄ означает «от него»; нормализованная строка, приведённая в источнике, в этом месте имеет расходящееся написание.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная повествовательная формула с ⲡⲉϫⲉ «сказал»; прошедшее время естественно передаёт лаконичный стиль Фомы.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: тому, у кого что-то есть
  rationale: Относительная конструкция с ⲟⲩⲛⲧⲁ- выражает обладание; местоименный объект здесь может быть формальным, поэтому «что-то» добавлено для ясности.
- source_word: ϩⲛⲡⲉϥϭⲓϫ
  choice: в руке
  rationale: Буквальная пространственная фраза; ϭⲓϫ означает «рука».
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ
  choice: дадут ещё
  rationale: Форма 3-го лица множественного числа употреблена безлично. «Ещё» естественно обозначает подразумеваемое дальнейшее прибавление, не уточняя предмет дара.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: у того, у кого ничего нет
  rationale: Отрицательная относительная конструкция, отрицающая обладание; русское «ничего нет» идиоматично и сохраняет контраст.
- source_word: ⲡⲕⲉϣⲏⲙ
  choice: даже то малое
  rationale: ϣⲏⲙ — субстантивированное «малое», а ⲕⲉ- в данном контексте передаёт добавочное значение «даже»; сохраняется неопределённость между малой вещью и малым количеством.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: что у него есть
  rationale: Относительное придаточное определяет «то малое» как имеющееся у данного человека.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: отнимут … у него
  rationale: Безличное 3-е лицо множественного числа сохранено русской неопределённо-личной формой; ϥⲓ с фразой отделения естественно передаётся как «отнять у».
theological_decisions:
- issue: Что именно человек «имеет» и получает или теряет
  choice: Не конкретизировать предмет обладания
  alternative: Уточнить как знание, веру, духовное понимание или материальное имущество
  rationale: Коптский текст не называет предмет; конкретизация устранила бы намеренную афористическую и богословскую открытость изречения.
- issue: Субъект действия «дадут/отнимут»
  choice: Сохранить неопределённо-личную форму
  alternative: Передать пассивом «будет дано/будет отнято» либо назвать Бога действующим лицом
  rationale: Коптское 3-е лицо множественного числа функционирует безлично; текст не называет Бога или иного деятеля прямо.
translation_notes:
  register: Современный литературный русский язык с лаконичным афористическим ритмом. Параллелизм «у кого… / у кого…» сохранён; тяжеловесное буквальное повторение местоимений устранено. Неопределённый деятель передан естественными русскими формами «дадут» и «отнимут».
