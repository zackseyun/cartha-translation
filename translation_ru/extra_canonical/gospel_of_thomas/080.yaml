base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: ru
  text: 'Иисус сказал: «Кто познал мир, тот нашёл тело[a]; а кто нашёл тело, того мир недостоин».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲥⲱⲙⲁ означает «тело»; в некоторых контекстах оно может обозначать и мёртвое тело. Здесь сохранено «тело», в том числе потому, что в параллельном Речении 56 для «трупа» употреблено другое слово — ⲡⲧⲱⲙⲁ.
    reason: lexical_alternative
  - marker: b
    text: Ср. Речение 56, где передана близкая по строению мысль, но вместо слова «тело» стоит «труп». Обе формы сохранены без взаимного согласования.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная вводная формула речений; прошедшее время естественно передаёт коптскую повествовательную форму.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲥⲟⲟⲩⲛ
  choice: кто познал
  rationale: Относительная перфектная конструкция обозначает совершившееся познание; «познал» точно и естественно передаёт этот смысл, не уточняя его как интеллектуальное знание или духовное узнавание.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: мир
  rationale: Греческое заимствование сохраняет широкий смысл — мир, космос, устроенный порядок; русское «мир» оставляет эту широту открытой.
- source_word: ϩⲉ ⲉ
  choice: нашёл
  rationale: Основное значение глагола — «найти»; предлог перед дополнением отражает диалектное употребление и не требует отдельной передачи по-русски.
- source_word: ⲡⲥⲱⲙⲁ
  choice: тело
  rationale: Слово ⲥⲱⲙⲁ, восходящее к греческому σῶμα, прежде всего означает «тело». Такой перевод сохраняет лексическое отличие от ⲡⲧⲱⲙⲁ «труп» в параллельном Речении 56. Коптский определённый артикль в обоих случаях по-русски отдельно не выражается.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: того мир недостоин
  rationale: Естественная русская передача отрицательной конструкции со значением «быть достойным кого-либо»; вынесение местоимения перед подлежащим сохраняет афористическую силу заключения.
- source_word: ⲇⲉ
  choice: а
  rationale: Связка обозначает переход ко второй, соотнесённой части изречения. «А» естественно выражает сопоставление, не превращая его в резкое противопоставление.
theological_decisions:
- issue: Оценка мира и тела
  choice: Сохранена парадоксальная формулировка без пояснения отношений между «миром» и «телом».
  alternative: Истолковать тело как труп, материальный мир или духовный символ непосредственно в тексте.
  rationale: Источник не раскрывает смысл образа; перевод не должен навязывать определённую антропологию или космологию.
- issue: Родовое местоимение в заключении
  choice: «того мир недостоин»
  alternative: «этого человека мир недостоин» или гендерно нейтральная перестройка во множественном числе
  rationale: Единственное число и мужская местоименная форма соответствуют грамматике источника и традиционной форме русского афоризма; речь при этом имеет обобщающий смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, афористическим ритмом. Синтаксический параллелизм оригинала сохранён; лексика проста и dignified, без архаизации и конфессионально окрашенных пояснений.
