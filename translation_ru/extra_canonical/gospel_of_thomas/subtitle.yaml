translation:
  language: ru
  text: Евангелие от Фомы[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благая весть»; слово ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ, заимствованное из греческого εὐαγγέλιον, буквально означает «благая весть», но в названии произведения принято слово «Евангелие».'
    reason: lexical_alternative
  - marker: b
    text: 'Коптский текст буквально имеет «Евангелие, [то, что] согласно Фоме»: ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ — устойчивая формула заглавий в коптских рукописях.'
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Евангелие
  rationale: Коптское слово, заимствованное из греческого εὐαγγέλιον, буквально связано с «благой вестью», но в заглавии произведения естественно и традиционно передаётся как «Евангелие».
- source_word: ⲡⲕⲁⲧⲁ
  choice: от
  rationale: В устойчивой русской форме названий Евангелий греко-коптская формула κατά/ⲕⲁⲧⲁ («согласно») обычно передаётся предлогом «от»; это обозначает традиционную атрибуцию, не усиливая её до прямого утверждения об авторстве.
- source_word: ⲑⲱⲙⲁⲥ
  choice: Фомы
  rationale: Стандартная русская форма имени Фома в родительном падеже после заголовочной формулы «Евангелие от».
theological_decisions:
- issue: Характер связи текста с Фомой
  choice: Сохранена традиционная заголовочная формула «от Фомы» без отдельного утверждения, что Фома лично написал текст.
  alternative: «написанное Фомой»
  rationale: Коптская формула ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ выражает атрибуцию «согласно Фоме» и сама по себе не требует более узкого толкования как прямого авторства.
translation_notes:
  register: Краткое, достоинственное и привычное для современного русского читателя заглавие. Традиционная форма «Евангелие от Фомы» сохраняет жанровый термин и устойчивую русскую модель названия; сноски поясняют буквальный смысл и пределы атрибуции.
