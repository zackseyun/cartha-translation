  source_fidelity: 'Перевод точно передаёт основные элементы сахидского текста: обобщённую относительную конструкцию («Кто пьёт»), образ питья «из моих уст», идиому ⲛ̄ⲧⲁϩⲉ как «таким, как я», эмфатическое «я сам», намеренно необычную формулу «стану им» и явление сокрытого адресату. Существенно, что «таким, как я» верно отражает идиому «в моём образе/подобно мне» и не усиливает её до «равным мне».'
  naturalness: Текст звучит как современное литературное афористическое изречение. «Пьёт из моих уст» намеренно сохраняет необычный исходный образ, но остаётся понятным; «сокрытое откроется ему» естественно и соответствует возвратно-непереходному характеру выражения.
  terminology: «Иисус», «уста», «сокрытое» и «откроется» выбраны последовательно и без конфессионально обусловленного толкования. Сноски уместно поясняют буквальность образа, сжатость формулы тождества и соотношение рукописной и нормализованной форм, не подменяя перевод интерпретацией.
