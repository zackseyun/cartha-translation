base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: ru
  text: 'Иисус сказал: «Кто пьёт из моих уст[a], станет таким, как я. И я сам стану им[b], а сокрытое откроется ему[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ «пить из моих уст» буквально передаёт коптское выражение. Уста могут обозначать произносимое учение, однако текст прямо этого не поясняет.
    reason: cultural_note
  - marker: b
    text: 'Буквально и столь же необычно: «я сам стану им». Коптская фраза выражена сжато; перевод сохраняет взаимность высказывания, не истолковывая её.'
    reason: lexical_alternative
  - marker: c
    text: В рукописи стоит форма со значением «скрытое» во множественном или собирательном смысле; нормализованный текст передаёт её как «то, что скрыто».
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: кто пьёт
  rationale: Относительная конструкция с будущим имеет обобщающий смысл. Русское настоящее время естественно выражает изречение общего характера; буквальное «кто будет пить» возможно, но звучит тяжелее.
- source_word: ⲥⲱ ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: пьёт из моих уст
  rationale: Глагол означает «пить», а сочетание ⲉⲃⲟⲗ ϩⲛ указывает на источник. Образ уст сохранён и не истолкован в самом тексте как «слова» или «учение».
- source_word: ⲛ̄ⲧⲁϩⲉ / ⲛ ⲡⲁϩⲉ
  choice: таким, как я
  rationale: Рукописное ⲛ̄ⲧⲁϩⲉ — идиома «по-моему, таким же образом, как я». Поэтому выбран смысл подобия, а не более сильное и лексически необоснованное «равным мне».
- source_word: ϩⲱ(ⲱ)
  choice: сам
  rationale: Эмфатический элемент выделяет местоимение первого лица; «я сам» естественно передаёт это усиление.
- source_word: ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  choice: я сам стану им
  rationale: Сохранена необычная взаимная формула становления и тождества без поясняющего пересказа.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ / ⲛⲉⲑⲏⲡ
  choice: сокрытое
  rationale: Субстантивированное обозначение того, что скрыто, естественно передаётся русским собирательным единственным числом «сокрытое».
- source_word: ⲛⲁⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: откроется ему
  rationale: ⲟⲩⲱⲛϩ означает явиться, стать явным; возвратное «откроется» сохраняет непереходную форму и указывает на получателя откровения.
theological_decisions:
- issue: Взаимность между Иисусом и пьющим из его уст
  choice: «станет таким, как я. И я сам стану им»
  alternative: Истолковать выражение как мистическое слияние, ученическое уподобление или обретение равенства
  rationale: Источник соединяет подобие с поразительной формулой взаимного становления, но не объясняет её. Перевод сохраняет напряжение и не навязывает определённого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Необычный образ «пить из уст» и резкая взаимная формула намеренно сохранены; синтаксис при этом сделан понятным для обычного читателя.
