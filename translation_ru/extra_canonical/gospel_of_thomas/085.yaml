    issue: Предлог «от» в сочетании «возник от великой силы и великого богатства»
    rationale: Он возможен, но в современном русском менее естественен с абстрактными существительными и несколько конкретизирует неоднозначное коптское ϩⲛ. «Возник из» точнее и плавнее.
  - severity: low
    issue: Форма «не стал достойным вас»
    rationale: Смысл верен, однако краткая форма «не стал достоин вас» естественнее в литературном русском и лучше согласуется с последующим «был достоин».
  - severity: low
