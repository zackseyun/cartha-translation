base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: ru
  text: 'Иисус сказал: «Адам возник из великой силы и великого богатства, но не стал достоин вас[a]. Ведь если бы он был достоин, то не вкусил бы смерти[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи слово «достоин» частично утрачено и восстановлено по сохранившимся буквам, контексту и размеру лакуны.
    reason: textual_variant
  - marker: b
    text: В рукописи выражение «не вкусил бы смерти» частично утрачено; восстановление опирается на контекст и сохранившиеся следы текста. Коптская конструкция передаёт нереальное условие.
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: возник
  rationale: Сочетание означает возникновение или появление на свет; «возник» естественно передаёт происхождение, не уточняя его способ как рождение или сотворение.
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: великая сила
  rationale: Неопределённый артикль ⲟⲩ указывает на единственное число; ⲛ связывает прилагательное с существительным. В русском после предлога артикль отдельно не передаётся.
- source_word: ⲟⲩⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: великое богатство
  rationale: Абстрактное существительное обозначает богатство, достаток; единственное число и параллелизм с «великой силой» сохранены.
- source_word: ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ
  choice: достойным / достоин
  rationale: Оба выражения передают идею достоинства; повтор корня в русском сохраняет смысловую связь между утверждением и нереальным условием.
- source_word: ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ
  choice: вкусил бы смерти
  rationale: Коптское сочетание ϫⲓ ϯⲡⲉ является идиомой «вкусить»; родительный падеж после «вкусить» соответствует возвышенному, но понятному русскому употреблению.
theological_decisions:
- issue: Отношение Адама к «великой силе и великому богатству»
  choice: «возник от великой силы и великого богатства»
  alternative: «произошёл благодаря великой силе и великому богатству»
  rationale: Предлог ϩⲛ допускает оттенки источника или средства. «От» кратко сохраняет эту неоднозначность и не вводит конкретной космологии.
- issue: Смысл ⲙⲡⲉϥϣⲱⲡⲉ ⲉϥⲙⲡϣⲁ ⲙⲙⲱⲧⲛ
  choice: «не стал достойным вас»
  alternative: «не оказался достоин вас»
  rationale: Перевод сохраняет динамический оттенок ϣⲱⲡⲉ и объект «вас», не поясняя, в каком именно отношении Адам недостоин слушателей.
- issue: Нереальное условие о смерти
  choice: «если бы он был достоин, то не вкусил бы смерти»
  alternative: «будь он достоин, он не вкусил бы смерти»
  rationale: 'Форма передаёт контрфактическое условие: Адам не был достоин и вкусил смерть. Богословская связь между достоинством и бессмертием оставлена без дополнительного истолкования.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «вкусить смерти». Синтаксис прост и понятен; сохранены повтор «достойным / достоин», обращение во множественном числе «вас» и смысловая напряжённость изречения.
