revisions:
- from: 'Иисус сказал: «Адам возник от великой силы и великого богатства, но не стал достойным вас.[a] Ведь если бы он был достоин, то не вкусил бы смерти».[b]'
  to: 'Иисус сказал: «Адам возник из великой силы и великого богатства, но не стал достоин вас[a]. Ведь если бы он был достоин, то не вкусил бы смерти[b]».'
  rationale: Правка ограничена более естественным русским выражением происхождения, предикативной формой «достоин» и переносом маркера сноски к реконструируемому выражению. Значение текста, его условная конструкция и текстологическая осторожность сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: единственные «великая сила» и «великое богатство», отношение Адама к адресатам и контрфактическое условие о «вкушении смерти» соответствуют коптскому тексту. Однако «возник от ... богатства» в русском языке звучит менее естественно и несколько сильнее склоняет ϩⲛ к причинно-производительному значению; «из» лучше сохраняет неопределённое отношение источника/сферы, выраженное предлогом ϩⲛ.'
  naturalness: «Не стал достойным вас» грамматически допустимо, но «не стал достоин вас» — более естественная современная литературная предикативная конструкция. Сноску о восстановленном «вкусил бы» следует поставить непосредственно после соответствующего выражения, а не после закрывающей кавычки и конечной точки.
  terminology: «Вкусить смерти» удачно передаёт коптский идиоматический оборот ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ и сохраняет умеренно возвышенный регистр. «Достоин» последовательно отражает ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ. Имена и богословски значимые формулировки не требуют изменений.
  issues:
