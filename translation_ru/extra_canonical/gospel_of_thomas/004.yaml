base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: ru
  text: 'Иисус сказал: «Старик, проживший много дней, не станет колебаться, чтобы спросить[c] маленького ребёнка семи дней от роду о месте жизни — и он будет жить. Ведь многие из первых станут последними[a], и станут одним-единственным[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом фрагменте P.Oxy. 654 после слов «станут последними» добавлено: «а последние — первыми»; в коптском тексте этой части нет.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «одним, единственным». Выражение может обозначать единство или состояние единого, но текст не поясняет его точнее.'
    reason: translation_note
  - marker: c
    text: В коптском оригинале глаголы ϫⲛⲁⲩ («колебаться, медлить») и ϫⲛⲉ («спросить») созвучны; в русском это созвучие не воспроизводится.
    reason: register_note
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: не поколеблется
  rationale: Глагол означает «колебаться, медлить»; это подтверждает греческое ἀποκνήσει в P.Oxy. 654. Такой перевод не смешивает его с глаголом «стыдиться».
- source_word: ⲡⲣⲱⲙⲉ ⲛϩⲗⲗⲟ ϩⲛⲛⲉϥϩⲟⲟⲩ
  choice: человек, старый годами
  rationale: Передаёт и существительное «человек», и характеристику старости «в днях/годах», не создавая в русском ненужного повтора «в свои дни».
- source_word: ⲟⲩⲟⲩⲕⲟⲩⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ ⲉϥϩⲛⲥⲁϣϥ ⲛϩⲟⲟⲩ
  choice: семидневного младенца
  rationale: Естественно и точно передаёт маленького ребёнка, которому семь дней от роду.
- source_word: ⲡⲧⲟⲡⲟⲥ ⲙⲡⲱⲛϩ
  choice: месте жизни
  rationale: Сохраняет буквальный и намеренно загадочный образ «места жизни», не уточняя его богословский смысл.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: одним
  rationale: Сохраняет числовую образность и неоднозначность выражения «один, единый», не превращая её заранее ни в «единого человека», ни в отвлечённое «единство».
theological_decisions:
- issue: Смысл заключительного ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: они станут одним
  alternative: они станут единым целым / одним-единственным
  rationale: Формулировка сохраняет напряжённую и не вполне разъяснённую идею перехода к единству. «Единым целым» звучит естественнее, но сильнее истолковывает характер этого единства; «одним-единственным» буквальнее, однако по-русски может ошибочно восприниматься как указание на одного человека.
- issue: Связь местоимения «они»
  choice: сохранить местоимение без уточнения
  alternative: многие первые станут одним
  rationale: Коптский текст оставляет референт местоимения достаточно открытым; явное уточнение сузило бы смысл.
- issue: Отсутствующая в коптском тексте обратная формула
  choice: не включать «а последние — первыми» в основной текст
  alternative: включить по греческому свидетелю P.Oxy. 654
  rationale: Основной текст следует сохранившейся коптской форме данного изречения; более длинное чтение греческого свидетеля отмечено как текстовый вариант.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, афористичным звучанием. Синтаксис оставлен компактным; загадочные выражения «место жизни» и «станут одним» не разъясняются внутри перевода. Тире перед «и будет жить» передаёт итоговую силу высказывания, не вводя дополнительной причинной связи.
