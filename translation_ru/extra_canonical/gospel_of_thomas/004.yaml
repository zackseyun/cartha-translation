revisions:
- from: 'Иисус сказал: «Человек, старый годами, не поколеблется спросить семидневного младенца о месте жизни — и будет жить. Ведь многие первые станут последними[a], и они станут одним[b]».[c]'
  to: 'Иисус сказал: «Старик, проживший много дней, не станет колебаться, чтобы спросить[c] маленького ребёнка семи дней от роду о месте жизни — и он будет жить. Ведь многие из первых станут последними[a], и станут одним-единственным[b]».'
  rationale: Правка улучшает естественность современного литературного русского без изменения смысла. «Не станет колебаться, чтобы спросить» отражает исходное значение ϫⲛⲁⲩ, не смешивая его со «стыдиться». «Одним-единственным» передаёт удвоенную коптскую формулу ⲟⲩⲁ ⲟⲩⲱⲧ и сохраняет её неразъяснённость. Якорь фонетической сноски перенесён к глаголам, к которым она относится.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: ϫⲛⲁⲩ — «колебаться/медлить», ребёнок имеет семь дней от роду, «место жизни» сохранено без истолкования, а коптская краткая форма заключительной антитезы соблюдена. Однако «не поколеблется спросить» по-русски неестественно и несколько меняет управление глагола; заключительное ⲟⲩⲁ ⲟⲩⲱⲧ лучше передать с сохранением усилительного «единый».'
  naturalness: «Человек, старый годами» и «не поколеблется спросить» звучат искусственно для современного литературного русского. «Старик, проживший много дней, не станет колебаться, чтобы спросить…» сохраняет афористичность и естественную русскую фразу. Сноску о созвучии следует поставить у соответствующих глаголов, а не после всей цитаты.
  terminology: «Место жизни» удачно сохраняет намеренную неясность ⲡⲧⲟⲡⲟⲥ ⲙⲡⲱⲛϩ. «Одним-единственным» воспроизводит удвоенное ⲟⲩⲁ ⲟⲩⲱⲧ, не навязывая доктринального истолкования. Имя Иисус и регистр соответствуют задаче.
