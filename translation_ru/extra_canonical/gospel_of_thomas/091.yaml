base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: ru
  text: 'Они сказали ему: «Скажи нам[e], кто ты, чтобы мы поверили в тебя[a]». Он сказал им: «Вы исследуете облик неба и земли[b], но того, кто перед вами, не узнали[c]; и этот кайрос вы не умеете исследовать[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол «поверить» может также иметь смысл «довериться».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лицо неба и земли»; здесь «лицо» означает их видимый облик.'
    reason: cultural_note
  - marker: c
    text: 'Возможен перевод: «то, что перед вами»; однако последующее коптское местоимение «его» поддерживает личное понимание: «того, кто перед вами».'
    reason: textual_variant
  - marker: d
    text: Кайрос — греческое слово, означающее подходящее, решающее или назначенное время, момент либо срок.
    reason: cultural_note
  - marker: e
    text: 'В рукописном написании стоит форма «скажи нам», тогда как нормализованный текст передаёт ту же просьбу несколько иначе; смысл в обоих случаях один: «скажи (нам)».'
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Скажи нам
  rationale: Обе формы передают простую повелительную просьбу; естественная русская формула сохраняет прямоту реплики.
- source_word: ⲛ̄ⲧⲕ ⲛⲓⲙ
  choice: кто ты
  rationale: Вопрос о личной идентичности; «кто ты» естественно соответствует контексту диалога.
- source_word: ⲣ̄ⲡⲓⲥⲧⲉⲩⲉ
  choice: поверили в тебя
  rationale: Греческое заимствование πιστεύειν допускает оттенок доверия, но в данном обороте русское «поверить в тебя» наиболее естественно и не устраняет этот оттенок.
- source_word: ⲣ̄ⲡⲓⲣⲁⲍⲉ
  choice: испытывать
  rationale: Один и тот же глагол повторён в обеих частях ответа; «испытывать» сохраняет повтор и более сильный смысл проверки, чем «рассматривать».
- source_word: ⲡϩⲟ
  choice: облик
  rationale: Буквально «лицо», но применительно к небу и земле слово обозначает видимую внешность; «облик» сохраняет образность и звучит естественно по-русски.
- source_word: ⲧⲡⲉ / ⲡⲡⲉ
  choice: небо
  rationale: В паре с землёй обозначает наблюдаемый небосвод; русское «небо» не требует искусственного различения между sky и heaven.
- source_word: ⲡⲉⲧⲛ̄ⲙⲧⲟ ⲉⲃⲟⲗ
  choice: того, кто перед вами
  rationale: Конструкция может формально допускать неперсональное понимание, однако последующее местоимение мужского рода единственного числа поддерживает личную референцию.
- source_word: ⲥⲟⲩⲱⲛϥ
  choice: не узнали
  rationale: В контексте присутствующего перед ними лица глагол знания имеет смысл распознавания; «не узнали» передаёт это без поясняющего расширения.
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: кайрос
  rationale: 'Транслитерация сохраняет многозначность греческого заимствования: решающий, подходящий или назначенный срок/момент; значение пояснено в сноске.'
- source_word: ⲥⲟⲟⲩⲛ ⲁⲛ ⲛ̄ⲣ̄ⲡⲓⲣⲁⲍⲉ ⲙ̄ⲙⲟϥ
  choice: не умеете испытывать
  rationale: Сочетание глагола знания с инфинитивом выражает умение или знание того, как совершить действие; «не умеете» естественно передаёт конструкцию.
theological_decisions:
- issue: Личное или неперсональное понимание ⲡⲉⲧⲛ̄ⲙⲧⲟ ⲉⲃⲟⲗ
  choice: того, кто перед вами
  alternative: то, что перед вами
  rationale: Объектное местоимение -ϥ («его») в следующем глаголе склоняет к личному референту, хотя грамматическая неоднозначность отмечена в сноске.
- issue: Передача ⲕⲁⲓⲣⲟⲥ
  choice: кайрос
  alternative: решающий момент / назначенное время
  rationale: Перевод одним русским эквивалентом сузил бы смысл и мог бы заранее определить богословское понимание времени; транслитерация с пояснением сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис диалога простой и прямой. Повтор «испытывать» сохранён как важная внутренняя связь высказывания; необычное «кайрос» оставлено ради смысловой многозначности и снабжено сноской.
