  - severity: low
    issue: «Умеете» в первой части добавляет модальный оттенок
    rationale: Первый глагол в коптском имеет индикативное значение «вы испытываете/исследуете»; модальное значение умения явно развёрнуто лишь в заключительной конструкции «не знаете, как испытывать».
