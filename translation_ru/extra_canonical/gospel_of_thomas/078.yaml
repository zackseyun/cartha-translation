base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: ru
  text: 'Иисус сказал: «Что вы вышли в пустыню[a] увидеть? Тростник, колеблемый ветром? Человека в мягких одеждах[b]? Вот: те, кто носит мягкие одежды, — в доме вашего царя и вашего вельможи[c][d], и они не способны познать истину[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲥⲱϣⲉ можно также перевести как «пустынная местность» или «безлюдное место».
    reason: lexical_alternative
  - marker: b
    text: Буквально речь идёт об одеждах, описанных как мягкие; возможны также переводы «тонкие», «нежные» или «роскошные одежды».
    reason: lexical_alternative
  - marker: c
    text: Рукопись в этом месте повреждена. Нормализованный текст читает «в доме вашего царя и вашего вельможи» в единственном числе; перевод следует этому чтению. Восстановление повреждённого места иное в некоторых представлениях текста, поэтому множественное число нельзя считать несомненным.
    reason: lacuna_or_restoration
  - marker: d
    text: «Вельможа» передаёт греческое заимствование ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ; возможны варианты «сановник», «знатный человек» или «влиятельный человек».
    reason: lexical_alternative
  - marker: e
    text: «Познать истину» можно также передать как «узнать истину», «распознать истину» или «понять истину».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: что … увидеть
  rationale: В сочетании с инфинитивом восприятия вопрос относится к тому, что слушатели вышли увидеть, а не к причине их выхода.
- source_word: ⲡⲥⲱϣⲉ
  choice: пустыня
  rationale: Слово обозначает пустынную, безлюдную местность; «пустыня» естественно сохраняет библейскую образность, не обязательно подразумевая песчаную пустыню.
- source_word: ⲟⲩⲕⲁϣ
  choice: тростник
  rationale: В контексте ветра это обычное и образно точное соответствие; варианты «камыш» и «стебель» менее формально близки.
- source_word: ⲕⲓⲙ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: колеблемый ветром
  rationale: Передаёт движение тростника под действием ветра и сохраняет сжатую форму исходного образа.
- source_word: ϣⲧⲏⲛ … ϭⲏⲛ
  choice: мягкие одежды
  rationale: ϣⲧⲏⲛ означает одежду или одеяние, а ϭⲏⲛ характеризует её как мягкую или изнеженную; перевод не приписывает значение «мягкий» самому слову ϣⲧⲏⲛ.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: вельможи
  rationale: Греческое заимствование обозначает высокопоставленных и влиятельных людей; «вельможи» передаёт социальный ранг без тяжеловесной транслитерации.
- source_word: ϣⲥⲟⲟⲩⲛ ⲧⲙⲉ
  choice: познать истину
  rationale: Глагол допускает значения «узнать», «познать», «распознать» и «понять»; «познать истину» сохраняет широкий познавательный и духовный оттенок.
theological_decisions:
- issue: Связь царей и вельмож с неспособностью познать истину
  choice: Сохранено прямое утверждение текста без объяснения причины этой неспособности.
  alternative: Истолковать мягкие одежды как однозначный символ нравственной испорченности или объявить политическую власть самой по себе несовместимой с истиной.
  rationale: Исходный текст противопоставляет придворную роскошь познанию истины, но не раскрывает механизм и не формулирует систематического учения о власти или богатстве.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным и понятным синтаксисом. Риторическая последовательность вопросов и повтор «мягкие одежды» сохранены. Неестественное для русского буквальное нагромождение конструкций устранено, однако текстовая неопределённость повреждённого места не скрыта.
