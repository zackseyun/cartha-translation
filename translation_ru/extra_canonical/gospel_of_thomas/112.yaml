base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: ru
  text: 'Иисус сказал: «Горе плоти, которая зависит от души[a][b][c]; горе душе, которая зависит от плоти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол ⲉⲓϣⲉ можно также перевести более образно: «висит на» или «опирается на».'
    reason: lexical_alternative
  - marker: b
    text: Слово ⲯⲩⲭⲏ (психе) может также означать «жизнь» или «я», однако «душа» сохраняет резкое противопоставление плоти и души в коптском тексте.
    reason: lexical_alternative
  - marker: c
    text: В рукописи в обеих частях стоит форма ⲧⲁⲉⲓ — указательное местоимение женского рода; в нормализованном тексте Дилли употреблено ⲡⲁⲓ. Здесь местоимение почти утратило указательное значение и служит частью конструкции «та, которая», поэтому различие рода не меняет смысла.
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: горе
  rationale: Сохраняет силу пророческого возгласа и является естественным русским соответствием коптскому слову, заимствованному из греческого οὐαί.
- source_word: ⲥⲁⲣⲝ
  choice: плоть
  rationale: Передаёт греческое заимствование буквально и сохраняет намеренно резкое противопоставление плоти и души; «тело» могло бы его смягчить.
- source_word: ⲯⲩⲭⲏ
  choice: душа
  rationale: Соответствует основному значению ψυχή в данном противопоставлении и не устраняет возможную богословскую напряжённость; значения «жизнь» и «я» отмечены в сноске.
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: которая зависит от
  rationale: Естественно передаёт отношение опоры или зависимости, выраженное глаголом с предлогом ⲛ, не закрепляя исключительно конкретный образ «висеть на».
- source_word: ⲡⲁⲓ / рукописное ⲧⲁⲉⲓ
  choice: которая
  rationale: Русское относительное местоимение естественно вводит определительное придаточное и передаёт семантически ослабленную указательную конструкцию.
- source_word: ⲛ при ⲟⲩⲟⲓ и ⲉⲓϣⲉ
  choice: дательный падеж / от
  rationale: В сочетании «горе плоти» передаётся дательным падежом, а при «зависит» — нормативным русским управлением с предлогом «от».
theological_decisions:
- issue: Противопоставление плоти и души
  choice: Сохранено без поясняющего истолкования
  alternative: Передать ⲥⲁⲣⲝ как «тело» или ⲯⲩⲭⲏ как «жизнь»
  rationale: Изречение строится на симметричной и неоднозначной взаимозависимости двух понятий; перевод не должен заранее превращать её ни в осуждение телесности, ни в учение о превосходстве одного начала.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и афористичной формой. Симметрия обеих частей сохранена; архаизмы и конфессионально окрашенные толкования не добавлены.
