  text: Jesus said[a], Become passers-by.
translation:
  language: ru
  text: 'Иисус сказал: «Станьте прохожими».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Станьте теми, кто проходит мимо»; «Будьте странниками». В основе выражения — заимствованный из греческого глагол со значением «проходить мимо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: станьте
  rationale: Коптское ϣⲱⲡⲉ означает «стать, сделаться»; в данной конструкции имеет побудительную силу. «Станьте» сохраняет краткость и повелительный характер изречения.
- source_word: ⲡⲁⲣⲁⲅⲉ (с ⲣ‑ перед инфинитивом)
  choice: прохожими
  rationale: Греческое заимствование передаёт действие «проходить мимо». Существительное «прохожие» естественно по-русски выражает людей, которые проходят мимо, сохраняет множественное число адресатов и афористическую краткость.
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: 'Иисус сказал:'
  rationale: Обычная коптская формула введения прямой речи; передана простой и литературно естественной русской формой.
theological_decisions:
- issue: Возможный переносный смысл призыва
  choice: Не раскрывать метафору в основном тексте
  alternative: «Будьте странниками» или «не задерживайтесь в этом мире»
  rationale: Источник буквально говорит о прохождении мимо и не уточняет богословского смысла; толкование как призыв к странничеству или непривязанности не следует вносить непосредственно в перевод.
translation_notes:
  register: Предельно краткое, афористичное изречение. Современный литературный русский язык без архаизации; «прохожими» намеренно сохраняет образ и его смысловую открытость.
