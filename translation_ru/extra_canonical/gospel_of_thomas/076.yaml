base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: ru
  text: 'Иисус сказал: «Царство Отца подобно купцу, у которого был груз товаров и который нашёл жемчужину. Этот купец был мудр: он продал груз[a] и купил себе ту единственную жемчужину. Так и вы ищите его сокровище[b], которое не иссякает и пребывает, — место, куда не проникает моль и не пожирает его и где червь его не губит[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдал груз наружу». В торговом контексте оборот означает, что купец продал или иным образом реализовал товары.'
    reason: lexical_alternative
  - marker: b
    text: В рукописи в этом месте есть орфографическая правка; перевод «его сокровище» следует нормализованному чтению ⲡⲉϥⲁϩⲟ.
    reason: lacuna_or_restoration
  - marker: c
    text: Здесь в коптском тексте стоит «червь», а не «ржавчина», встречающаяся в некоторых близких евангельских выражениях.
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲙⲛⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ / ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: Царство Отца
  rationale: Коптское ⲙⲛⲧⲣⲣⲟ обозначает царствование, царскую власть или царство. Русское «Царство» сохраняет эту смысловую широту и естественно звучит в речении.
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: купец
  rationale: Буквально это «человек торговли»; «купец» кратко и точно передаёт занятие персонажа и коммерческий контекст.
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: груз товаров
  rationale: Греческое заимствование φορτίον означает груз или поклажу; добавление «товаров» ясно передаёт торговый контекст, не сводя выражение к современному юридическому понятию консигнации.
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: жемчужина
  rationale: Обычное значение греческого заимствования μαργαρίτης.
- source_word: ⲥⲁⲃⲉ
  choice: мудр
  rationale: Слово обозначает мудрого, разумного человека; здесь оно включает практическую рассудительность купца, но текст прямо называет его мудрым.
- source_word: ϯⲡⲉⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: продал груз
  rationale: Буквально оборот означает «отдал груз наружу»; в контексте последующей покупки естественный коммерческий смысл — продал или реализовал товар.
- source_word: ⲧⲟⲟⲩ
  choice: купил
  rationale: Стандартный коптский глагол покупки.
- source_word: ⲟⲩⲱⲧ
  choice: ту единственную
  rationale: Подчёркивает, что купец приобрёл одну-единственную жемчужину; указательное «ту» естественно отсылает к уже найденной жемчужине.
- source_word: ϩⲱⲧⲧⲏⲩⲧⲛ / ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: так и вы
  rationale: Это эмфатическая адвербиальная форма со значением «вы тоже», «и вы со своей стороны», а не возвратное местоимение; перевод не добавляет необоснованного «для себя».
- source_word: ⲡⲉϥⲁϩⲟ
  choice: его сокровище
  rationale: ⲁϩⲟ означает богатство или сокровище. Местоимение третьего лица сохранено, чтобы не устранять возможную неоднозначность его отнесения.
- source_word: ⲱϫⲛ
  choice: иссякает
  rationale: Глагол может означать кончаться, истощаться, иссякать; в отношении сокровища «не иссякает» передаёт образ неисчерпаемости.
- source_word: ⲙⲟⲩⲛ ⲉⲃⲟⲗ
  choice: пребывает
  rationale: Оборот выражает продолжение и постоянство; «пребывает» сохраняет торжественный, но понятный регистр.
- source_word: ⲡϥⲛⲧ
  choice: червь
  rationale: Рукопись говорит именно о черве, а не о ржавчине; перевод сохраняет образ органического разрушения.
theological_decisions:
- issue: Отнесение местоимения в выражении «его сокровище»
  choice: Сохранить «его сокровище» без пояснения владельца
  alternative: Заменить на «это сокровище» или «сокровище Отца»
  rationale: Коптский текст имеет местоимение третьего лица и не разъясняет его антецедент. Эксплицитное отнесение к Отцу либо к жемчужине разрешило бы неоднозначность, которой источник не разрешает.
- issue: Связь «места» с неиссякающим сокровищем
  choice: Передать «место» как приложение после тире
  alternative: Истолковать его как отдельное небесное место или полностью подчинить слову «сокровище»
  rationale: Синтаксис допускает образное пояснение сокровища через место, недоступное вредителям. Приложение сохраняет переход и не навязывает подробной космологии.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического религиозного речения. Синтаксис сделан ясным для обычного читателя, но сохранены повтор «купец», единственность жемчужины, неясное «его» и последовательность образов сокровища, моли и червя.
