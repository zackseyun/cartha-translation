revisions:
- from: 'Иисус сказал: «Царство Отца подобно купцу, у которого был груз товаров и который нашёл жемчужину. Этот купец был мудр: он продал груз[a] и купил себе ту единственную жемчужину. Так и вы ищите его сокровище[b], которое не иссякает, но пребывает, — место, куда не проникает моль, чтобы пожирать, и где червь не губит[c]».'
  to: 'Иисус сказал: «Царство Отца подобно купцу, у которого был груз товаров и который нашёл жемчужину. Этот купец был мудр: он продал груз[a] и купил себе ту единственную жемчужину. Так и вы ищите его сокровище[b], которое не иссякает и пребывает, — место, куда не проникает моль и не пожирает его и где червь его не губит[c]».'
  rationale: Изменён только заключительный синтаксис. Союз «и» точнее, чем противительное «но», передаёт последовательность двух положительных характеристик сокровища. Повтор местоимения «его» в образах моли и червя обусловлен нормами русского управления и контекстуально относится к сокровищу; он не вносит нового толкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:34Z'
review_pass:
