  source_fidelity: 'В целом перевод точно передаёт коптский текст: «Царство Отца», купец, груз товаров, найденная жемчужина, продажа груза, покупка одной жемчужины, а также неоднозначное «его сокровище» сохранены. «Так и вы» верно передаёт ϩⲱⲱⲛⲧⲱⲧⲛ без неосновательного добавления возвратного значения. Нужна лишь малая синтаксическая правка заключительного образа: в русском «чтобы пожирать» без выраженного дополнения звучит незавершённо, хотя в коптском объект понятен из контекста.'
