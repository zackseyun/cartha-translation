base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: ru
  text: 'Иисус сказал: «От Адама до Иоанна Крестителя среди рождённых женщинами нет никого выше Иоанна Крестителя, так что глаза его не будут опущены.[a] Но я сказал: кто из вас станет малым,[b] тот познает Царство[c] и станет выше Иоанна».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так что глаза его не будут сокрушены (опущены)». По ближайшему контексту «его» относится к Иоанну: ему не перед кем опускать глаза. В рукописи отрицательная глагольная форма дана в стяжённом диалектном написании.'
    reason: Языковая идиома, местоименная отсылка и диалектная форма могут быть неочевидны русскому читателю.
  - marker: b
    text: 'Или: «станет маленьким», «станет ребёнком». Исходное слово допускает все эти оттенки.'
    reason: Сохранение подлинной лексической и богословской неоднозначности.
  - marker: c
    text: Ср. Мф. 11:11; Лк. 7:28. Здесь изречение добавляет «от Адама» и слова об опущенных глазах, а во второй части говорит о том, кто станет малым, познает Царство и станет выше Иоанна.
    reason: Перекрёстная ссылка и указание на существенные особенности данной формы изречения.
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: рождённые
  rationale: Передаёт значение рождения или происхождения и естественно звучит в устойчивом русском выражении «рождённые женщинами».
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: выше
  rationale: Сохраняет пространственно-оценочную метафору исходного слова и единообразно передаёт оба сравнения с Иоанном.
- source_word: ⲟⲩⲱϭⲡ (с ⲃⲁⲗ, «глаза»)
  choice: глаза … не будут опущены
  rationale: В данном сочетании речь идёт об опущенных глазах; буквальное «сломаны» по-русски исказило бы смысл идиомы.
- source_word: ⲕⲟⲩⲓ / ⲕⲟⲩⲉⲓ
  choice: малым
  rationale: 'Сохраняет лексическую неоднозначность: слово может означать малого, маленького или ребёнка, не навязывая тематически обусловленное толкование «ребёнком».'
- source_word: ⲙⲛⲧⲣⲣⲟ / ⲙⲛⲧⲉⲣⲟ
  choice: Царство
  rationale: Обычный и контекстуально естественный русский эквивалент; заглавная буква обозначает эсхатологическое или божественное Царство, не добавляя отсутствующего в тексте определения.
theological_decisions:
- issue: Значение образа «стать малым»
  choice: стать малым
  alternative: стать ребёнком / стать как малое дитя
  rationale: Коптское слово допускает как качественное значение «малый», так и субстантивированное «малый, ребёнок». Выбранный вариант сохраняет эту напряжённую неоднозначность и не привязывает изречение исключительно к одной интерпретации.
- issue: Соотношение «выше» и «больше»
  choice: выше
  alternative: больше / величественнее
  rationale: «Выше» ближе к исходной лексеме и поддерживает связь с образом опущенных глаз; при этом не уточняется, идёт ли речь о статусе, духовном величии или иной форме превосходства.
- issue: Референт местоимения в выражении о глазах
  choice: глаза его
  alternative: глаза Иоанна
  rationale: Местоименная форма сохраняет устройство исходного текста. По ближайшему контексту она относится к Иоанну, но перевод не заменяет местоимение явным именем.
translation_notes:
  register: Современный литературный русский с достоинством афористической речи. Синтаксис сохраняет параллелизм двух частей и повтор имени Иоанна Крестителя. Формула «рождённые женщинами» сознательно оставлена в привычном библейском регистре; «станет малым» звучит несколько необычно, но точно удерживает неоднозначность оригинала.
