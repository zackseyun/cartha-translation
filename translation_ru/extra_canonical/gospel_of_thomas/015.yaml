revisions:
- from: 'Иисус сказал: «Когда вы увидите того, кто не был рождён женщиной, падите ниц[a] и поклонитесь ему. Он — ваш Отец».[b]'
  to: 'Иисус сказал: «Когда вы увидите того, кто не был рождён от женщины, падите ниц[a] и поклонитесь ему. Тот — ваш Отец».'
  rationale: В основном тексте восстановлена указательная сила «тот»; поэтому отдельная сноска о ней больше не нужна. Оборот «рождён от женщины» выбран как более естественный современный русский эквивалент, сохраняющий буквальный смысл происхождения. Сноска a остаётся привязанной к «падите ниц» и поясняет образный телесный жест без добавления толкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:50Z'
review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт временное условие, отрицание рождения «из/от женщины», повеления пасть и поклониться, а также именование «ваш Отец». Однако ⲡⲉⲧⲉ ⲣⲉⲙⲙⲁⲩ («тот/тот самый») имеет явную указательную силу, которую безопасно и естественно передать в основном тексте, а не компенсировать лишь сноской.
  naturalness: «Падите ниц» — естественная литературная, торжественная русская идиома. Оборот «не был рождён женщиной» понятен, но «не был рождён от женщины» более обычен в современном литературном русском и лучше передаёт происхождение, не создавая впечатления, что «женщина» — деятель при пассивном глаголе.
  terminology: «Поклонитесь» адекватно передаёт ⲟⲩⲱϣⲧ в контексте простирания. «Отец» с прописной буквы допустим ввиду прямого именования «ваш Отец»; перевод не добавляет отождествления с какой-либо конкретной богословской фигурой.
  issues:
