base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: ru
  text: 'Иисус сказал: «Когда вы увидите того, кто не был рождён от женщины, падите ниц[a] и поклонитесь ему. Тот — ваш Отец».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повергните себя на свои лица», то есть падите лицом вниз в знак поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная и точная передача формулы введения прямой речи ⲡⲉϫⲉ с сохранением краткого ритма изречения.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: Когда вы увидите
  rationale: ϩⲟⲧⲁⲛ вводит временное условие, а конструкция eršan имеет перспективное значение; русское будущее после «когда» естественно передаёт оба элемента.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: того, кто не был рождён женщиной
  rationale: Определённая относительная конструкция требует «того, кто»; в сочетании с «женщиной» глагол выражает именно рождение, а не отвлечённое возникновение.
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: падите ниц
  rationale: Русская идиома кратко и наглядно передаёт повеление пасть лицом вниз; возвратность и положение тела выражены самой конструкцией.
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: поклонитесь ему
  rationale: Глагол обозначает поклонение или почитание; в данном сочетании с падением ниц «поклонитесь» сохраняет как телесный, так и религиозный оттенок, не усиливая его до однозначного «боготворите».
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: Он
  rationale: Выражение имеет указательную силу («тот», «тот самый»), но в русском отдельное «Он» после явного антецедента звучит естественно; указательный оттенок отмечен в сноске.
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  choice: ваш Отец
  rationale: Прямая передача притяжательной формы; прописная буква уместна при идентификации с трансцендентным Отцом и соответствует русской религиозной издательской норме.
theological_decisions:
- issue: Смысл выражения «не был рождён женщиной»
  choice: Сохранить буквально, без отождествления названного лица с конкретной фигурой
  alternative: Пояснить в тексте как указание на Бога либо на небесное существо
  rationale: Само изречение называет этого субъекта «вашим Отцом», но не разъясняет его онтологию; перевод не должен снимать характерную для текста богословскую напряжённость.
- issue: Степень культового значения ⲟⲩⲱϣⲧ
  choice: поклонитесь
  alternative: поклоняйтесь / воздайте поклонение
  rationale: «Поклонитесь» сохраняет связь с предшествующим телесным жестом и допускает религиозное значение, не навязывая более узкой конфессиональной формулы.
translation_notes:
  register: Современный литературный русский, краткий и торжественный, без архаизмов. Формулировка сохраняет резкость исходного изречения. «Падите ниц» выбрано как понятная устойчивая идиома; «поклонитесь» оставляет открытой связь телесного почтения и культового поклонения.
