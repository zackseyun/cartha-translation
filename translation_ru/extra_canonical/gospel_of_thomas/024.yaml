base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: ru
  text: 'Его ученик сказал ему: «Покажи нам место, где ты находишься, ведь нам необходимо искать его». Он сказал им: «У кого есть уши, пусть слышит. Внутри человека света[a] есть свет[b], и он озаряет весь мир[c]. Когда он не светит[d] — тьма».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек света». Возможный более пояснительный перевод: «светоносный человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Коптский текст утверждает: «внутри человека света есть свет». В греческом фрагменте фраза имеет условную форму: «если свет есть в человеке света…».'
    reason: textual_variant
  - marker: c
    text: 'В коптском тексте субъект — человек: «он озаряет весь мир». В греческом фрагменте субъектом выступает свет: «он (свет) сияет».'
    reason: textual_variant
  - marker: d
    text: 'Коптский текст: «когда он не светит — тьма». Греческий фрагмент передаёт или реконструируется в смысле: «если его нет, мир во тьме».'
    reason: textual_variant
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: Покажи нам
  rationale: Каузативная форма означает «дай нам узнать, сделай известным»; в просьбе о месте естественный русский эквивалент — «покажи нам».
- source_word: ⲡⲧⲟⲡⲟⲥ
  choice: место
  rationale: Греческое заимствование τόπος употреблено в прямом пространственном смысле; «место» сохраняет краткость оригинала.
- source_word: ⲉⲧⲕⲙ̄ⲙⲁⲩ
  choice: где ты находишься
  rationale: Относительная конструкция указывает на местонахождение. «Находишься» звучит естественно и не привносит оттенка постоянного пребывания.
- source_word: ⲡⲉⲓⲧⲁⲛⲁⲅⲕⲏ ⲉⲣⲟⲛ ⲧⲉ
  choice: нам необходимо
  rationale: Безличная конструкция с заимствованным ἀνάγκη выражает необходимость; русский вариант передаёт её силу без тяжеловесной буквальности.
- source_word: ϣⲓⲛⲉ ⲛⲥⲱϥ
  choice: искать его
  rationale: Глагол означает «искать, разыскивать», а местоименный объект соотнесён с «местом».
- source_word: ⲡⲉⲧⲉⲩⲛ̄ⲙⲁⲁϫⲉ ⲙ̄ⲙⲟϥ ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ̄
  choice: У кого есть уши, пусть слышит
  rationale: Передана традиционная формула с юссивом; буквальное коптское «у кого уши с ним» является идиоматическим выражением обладания и по-русски неестественно.
- source_word: ⲟⲩⲛ̄ⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ ⲙ̄ⲫⲟⲩⲛ
  choice: внутри … есть свет
  rationale: Экзистенциальная конструкция выражает наличие света внутри, поэтому использовано естественное русское «есть свет», а не глагол возникновения.
- source_word: ⲟⲩⲣ̄ⲙ̄ⲟⲩⲟⲉⲓⲛ
  choice: человек света
  rationale: Составное обозначение буквально связывает человека со светом. Необычная генитивная формула сохранена вместо толкующего «светоносный человек».
- source_word: ϥⲣ̄ⲟⲩⲟⲉⲓⲛ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: он озаряет весь мир
  rationale: В коптском человек является грамматическим субъектом глагола «светить, озарять»; «озаряет» позволяет естественно присоединить прямой объект «весь мир».
- source_word: ⲉϥⲧⲙ̄ⲣ̄ⲟⲩⲟⲉⲓⲛ⳿ ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: Когда он не светит — тьма
  rationale: Условно-обстоятельственная форма допускает временное прочтение «когда»; именная фраза «тьма» передана сжатой русской конструкцией без добавленного объекта.
theological_decisions:
- issue: 'Кто озаряет мир: свет или человек света'
  choice: Сохранено местоимение «он», грамматически продолжающее «человека света»
  alternative: «Свет озаряет весь мир» или «он сияет всему миру»
  rationale: Коптский текст делает субъектом лицо мужского рода, тогда как греческий фрагмент, по-видимому, делает субъектом свет. Перевод следует коптскому основному свидетелю, а разночтение отмечает отдельно.
- issue: Условный или утвердительный характер наличия света
  choice: Утвердительное «есть свет»
  alternative: «Если внутри человека света есть свет»
  rationale: Коптский текст содержит декларативную экзистенциальную конструкцию, в отличие от условной формулировки греческого фрагмента.
- issue: Характер заключительной фразы
  choice: «Когда он не светит — тьма»
  alternative: «Если света нет, мир во тьме»
  rationale: Сохранены коптский личный субъект и лаконичное утверждение о тьме; греческая реконструкция предлагает иную условную связь и может относить тьму к миру.
translation_notes:
  register: Современный литературный русский с лаконичным, афористичным ритмом. Необычное выражение «человек света» намеренно сохранено как характерная образность текста. Тире в заключении передаёт сжатую именную конструкцию оригинала без искусственного добавления связки или объекта.
