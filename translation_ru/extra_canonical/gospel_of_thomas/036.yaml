translation_notes:
  register: Современный литературный русский язык с кратким, достойным и легко понятным синтаксисом. Повтор «с утра до вечера и с вечера до утра» сохранён ради ритма и смыслового параллелизма оригинала; богословских уточнений, отсутствующих в источнике, не добавлено.
