base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: ru
  text: 'Иисус сказал: «Не тревожьтесь[a] с утра до вечера и с вечера до утра о том, что вы наденете на себя[b][c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол ϥⲓⲣⲟⲟⲩϣ может означать «тревожиться» или «беспокоиться»; в более старой речи — «заботиться» в смысле мучительной озабоченности. Здесь выбрано ясное современное выражение «тревожиться».
    reason: lexical_alternative
  - marker: b
    text: В греческом свидетеле POxy 655 высказывание 36 содержит дополнительные элементы — о пище, лилиях и росте — и совпадает с коптским текстом лишь в части об одежде. Перевод следует коптскому тексту из Наг-Хаммади.
    reason: textual_variant
  - marker: c
    text: В рукописном чтении ⲡⲉ⟨ⲧ⟩ⲉ… буква ⟨ⲧ⟩ восполнена редакторами. Нормализованный текст Дилли понимает эту последовательность как безвершинную относительную конструкцию ⲟⲩ ⲡⲉⲧⲉ– с будущей формой ⲛⲁ ϯⲛⲧⲟϥ ϩⲓⲱⲧ ⲛⲧⲱⲧⲛ.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: не тревожьтесь
  rationale: Отрицательное повеление выражает запрет тревожиться или беспокоиться. «Не тревожьтесь» естественно для современного русского языка и сохраняет смысл без архаического оттенка.
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ … ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: с утра до вечера и с вечера до утра
  rationale: Сохраняет две симметричные временные конструкции и их простой параллелизм.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: о том, что вы…
  rationale: Безвершинная относительная конструкция передаёт значение «о том, что», а ⲛⲁ с инфинитивом имеет будущее значение.
- source_word: ϯⲛⲧⲟϥ ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: наденете на себя
  rationale: Глагол обозначает надевание одежды, а предложно-возвратная конструкция прямо соответствует «на себя». Такая формулировка конкретнее, чем обобщённое «будете носить».
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Обычный сочинительный союз; сохраняет простое соединение частей исходного высказывания.
