base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: ru
  text: 'Его ученики сказали ему: «Кто ты, что говоришь нам это?»


    «По тому, что я говорю вам, вы не узнаёте, кто я.[a] Но вы стали подобны иудеям: они любят дерево — ненавидят его плод; и любят плод — ненавидят дерево»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Отрицательную коптскую конструкцию можно понять и как риторический вопрос: «Разве вы не знаете, кто я?»'
    reason: Сохранение грамматической неоднозначности исходного текста.
  - marker: b
    text: В коптском тексте глаголы «любят» и «ненавидят» поставлены рядом без союза, что подчёркивает противоречие.
    reason: Пояснение сохранённой бессоюзной структуры и её выразительного эффекта.
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: знать
  rationale: В сочетании с вопросительной конструкцией «кто я» глагол означает знание или распознавание личности; «знать» естественно сохраняет этот смысл.
- source_word: ϣⲱⲡⲉ
  choice: стали
  rationale: 'Перфектная форма указывает на наступившее состояние или изменение: «вы стали».'
- source_word: ϣⲏⲛ
  choice: дерево
  rationale: Прямое и обычное соответствие коптскому обозначению дерева.
- source_word: ⲙⲉ
  choice: любят
  rationale: Передаёт прямой контраст с ⲙⲟⲥⲧⲉ — «ненавидят».
- source_word: ⲙⲟⲥⲧⲉ
  choice: ненавидят
  rationale: Сохраняет резкое противопоставление любви и ненависти в исходном тексте.
- source_word: ⲓⲟⲩⲇⲁⲓⲟⲥ
  choice: иудеям
  rationale: Исторически и стилистически уместная русская передача этно-религиозного обозначения в древнем тексте.
theological_decisions:
- issue: Утверждение или риторический вопрос в ответе Иисуса
  choice: 'Утверждение: «вы не знаете, кто я»'
  alternative: 'Риторический вопрос: «разве вы не знаете, кто я?»'
  rationale: Отрицательная форма допускает оба прочтения, но как утверждение она синтаксически прямее и естественно ведёт к последующему упрёку. Неоднозначность отмечена в сноске.
- issue: Противоречивое отношение к дереву и плоду
  choice: Сохранить обе параллельные антитезы без истолкования символов
  alternative: Пояснить, кого или что обозначают дерево и плод
  rationale: Источник не раскрывает символическое соответствие; уточнение навязало бы тексту частное богословское толкование.
translation_notes:
  register: Современный литературный русский с лаконичной, афористичной интонацией. Бессоюзие в заключительных параллельных фразах сохранено с помощью тире; добавочное «но» между «любят» и «ненавидят» не внесено. Реплика Иисуса в коптском тексте начинается без отдельной авторской формулы, поэтому она оформлена непосредственно как новая реплика.
