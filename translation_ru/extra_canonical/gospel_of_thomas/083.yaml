base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: ru
  text: 'Иисус сказал: «Образы явлены человеку[a], а свет, который в них, скрыт в образе света Отца. Он будет явлен[b], а его образ скрыт его светом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человеку» или «человеческому существу»; единственное число здесь может иметь собирательное значение — «людям», «человечеству».'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимения «он» и «его» могут относиться как к Отцу, так и к свету: оба соответствующих коптских существительных мужского рода. Поэтому возможно и понимание: «Свет будет явлен, а его образ скрыт его светом».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ / ⲛϩⲓⲕⲱⲛ
  choice: образы
  rationale: Заимствованное из греческого εἰκών слово обозначает образ или видимую форму; рукописное чтение и согласование с местоимением во множественном числе поддерживают перевод «образы».
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: явлены
  rationale: Статив передаёт состояние видимости или явленности; «явлены» сохраняет связь с последующим противопоставлением сокрытого и явленного.
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: человеку
  rationale: 'Существительное в единственном числе употреблено обобщённо: речь идёт о человеке как таковом, то есть о людях вообще.'
- source_word: ϩⲏⲡ / ϩⲱⲡ
  choice: скрыт
  rationale: Статив обозначает наличное состояние сокрытости, а не будущее действие.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: будет явлен
  rationale: Глагольное сочетание означает раскрытие или явление и образует смысловой контраст с «скрыт»; пассивная русская конструкция соответствует контексту.
- source_word: ϩⲓⲧⲛ̄ⲡⲉϥⲟⲩⲟⲉⲓⲛ
  choice: его светом
  rationale: 'Предлог ϩⲓⲧⲛ̄ здесь естественно передаётся творительным падежом со значением средства или посредства: «его светом».'
theological_decisions:
- issue: К кому относится местоимение мужского рода в заключительной фразе
  choice: «Он будет явлен, а его образ скрыт его светом» с пояснением в сноске
  alternative: «Свет будет явлен, а его образ скрыт его светом» либо понимание местоимений как относящихся к Отцу
  rationale: В коптском и «свет», и «Отец» — существительные мужского рода, поэтому формы ϥ-/ⲡⲉϥ- допускают оба референта. Русские местоимения мужского рода сохраняют эту подлинную неоднозначность без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с краткими, торжественными формулировками. Сохранены ключевой контраст «явлен — скрыт» и намеренная местоименная неоднозначность. Термин «образы» выбран как понятный и достаточно формальный эквивалент εἰκών.
