base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: ru
  text: 'Ученики сказали Иисусу: «Мы знаем, что ты уйдёшь от нас.[a] Кто станет великим над нами?[b]» Иисус сказал им: «Где бы вы ни были,[c] идите к Иакову Праведному — тому, ради кого возникли небо и земля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол ⲃⲱⲕ буквально может быть переведён «пойдёшь»; вместе со словами «от нас» он означает уход.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Кто будет великим над нами?» Возможен смысл «Кто будет властвовать над нами?», однако в тексте употреблено слово «великий», а не прямое обозначение правителя.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в том месте, куда вы пришли». Это выражение передаёт смысл «где бы вы ни находились». В рукописном тексте нет усиления «вы сами».'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲡⲙⲁⲑⲏⲧⲏⲥ
  choice: ученики
  rationale: Греческое заимствование со значением учеников или последователей; «ученики» — естественный и контекстуально нейтральный русский эквивалент.
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛⲧⲛⲁⲛⲟⲛ
  choice: ты уйдёшь от нас
  rationale: ⲃⲱⲕ буквально обозначает движение («идти»), но сочетание с «от нас» здесь естественно передаёт предстоящий уход Иисуса от группы.
- source_word: ⲉⲧⲉⲣⲉⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ
  choice: станет великим над нами
  rationale: Сохранён образ величия и предлог со значением положения «над»; перевод «будет править нами» сделал бы политический или институциональный смысл более определённым, чем в коптском тексте.
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: где бы вы ни были
  rationale: Рукописный текст буквально говорит о месте, куда слушатели пришли; в данном контексте это идиоматически означает их местонахождение. В рукописи нет самостоятельного усилительного местоимения «вы сами».
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁ
  choice: идите к
  rationale: Директивная конструкция передана ясным русским повелительным наклонением; ϣⲁ обозначает направление к лицу.
- source_word: ⲓⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: Иаков Праведный
  rationale: Традиционная и точная передача имени и эпитета; греческое заимствование ⲇⲓⲕⲁⲓⲟⲥ означает «праведный, справедливый».
- source_word: ⲡⲁⲉⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ̅
  choice: тому, ради кого возникли небо и земля
  rationale: Сохранено сильное причинно-целевое выражение ⲉⲧⲃⲏⲧϥ и космический масштаб высказывания без богословского смягчения.
theological_decisions:
- issue: Статус Иакова после ухода Иисуса
  choice: «станет великим над нами» и указание идти к Иакову
  alternative: «будет править нами» или «станет нашим вождём»
  rationale: Текст связывает Иакова с превосходством или авторитетом, но прямо не называет его правителем, главой церкви или преемником; перевод сохраняет эту недоопределённость.
- issue: Высказывание о небе и земле
  choice: «ради кого возникли небо и земля»
  alternative: «для которого были сотворены небо и земля»
  rationale: Глагол ϣⲱⲡⲉ означает «возникнуть, стать, прийти в бытие» и сам по себе не называет творящего субъекта. Поэтому не добавляется отсутствующий в тексте глагол «сотворены».
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Формулировка намеренно сохраняет необычное «великим над нами» и сильное утверждение об Иакове, не превращая его в позднейший церковный титул. Обращение ведётся во множественном числе, как в коптском тексте.
