  terminology: «Ученики», «Иисус», «Иаков Праведный», «небо и земля» употреблены точно и в нейтральном литературном регистре. «Ради кого возникли» верно избегает добавления творящего субъекта или догматического истолкования. Сноски a–c корректно привязаны к соответствующим местам текста; сноска c особенно важна, так как фиксирует отсутствие усилительного местоимения в рукописи.
