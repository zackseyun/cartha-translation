  verdict: approve
  source_fidelity: 'Русский текст верно передаёт рукописное чтение: ученики ожидают ухода Иисуса; вопрос сохраняет формулу «быть великим над нами», не подменяя её прямым «править»; далее следует указание идти к Иакову Праведному, «ради которого» возникли небо и земля. Передача «Где бы вы ни были» оправданно отражает идиоматический смысл рукописного ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ. Она не воспроизводит ошибочное нормализованное «вы сами» и согласуется с приведённым аудитом рукописной грамматики.'
