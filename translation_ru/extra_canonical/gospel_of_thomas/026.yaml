base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: ru
  text: 'Иисус сказал: «Щепку[a] в глазу твоего брата ты видишь, а балку[b] в собственном глазу не видишь. Когда вынешь балку из собственного глаза, тогда будешь ясно видеть[c] и сможешь вынуть щепку из глаза твоего брата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Щепку» можно также перевести как «соринку», однако исходное слово обозначает небольшой кусок дерева.
    reason: lexical_alternative
  - marker: b
    text: Исходное слово, переведённое как «балка», обозначает строительную балку; возможен также перевод «бревно».
    reason: lexical_alternative
  - marker: c
    text: «Будешь ясно видеть» передаёт коптское выражение, буквально означающее «увидишь наружу».
    reason: dialect_note
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: щепка
  rationale: Слово обозначает небольшой кусок дерева; «щепка» сохраняет древесный образ и резкий контраст с бревном.
- source_word: ⲡⲥⲟⲓ
  choice: бревно
  rationale: Слово обозначает строительную балку. В основном тексте выбрано естественное и узнаваемое русское «бревно», а более точный архитектурный оттенок отмечен в сноске.
- source_word: ⲛⲟⲩϫⲉ
  choice: вынуть
  rationale: Глагол может означать «бросить прочь, изгнать, удалить»; применительно к предмету в глазу естественно русское «вынуть».
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: ясно видеть
  rationale: Буквально сочетание близко к «видеть наружу», но здесь выражает восстановленную ясность зрения.
- source_word: ⲥⲟⲛ
  choice: брат
  rationale: Прямое лексическое соответствие; в данном контексте слово может также обозначать собрата или другого ученика.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: когда вынешь
  rationale: Будущее условно-временное построение естественно передаётся совершенным видом после «когда».
- source_word: ⲃⲁⲗ
  choice: глаз
  rationale: Обычное анатомическое значение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и афористической краткостью. Сохранена контрастная конструкция исходного текста; повтор «собственный глаз / глаз брата» не сглажен. Финальное целевое значение конструкции передано естественным русским «и сможешь», без богословского истолкования.
