  source_fidelity: 'Нужна правка. Коптское ⲥⲟⲓ обозначает строительную балку; перевод «бревно» допустим как традиционная адаптация, но в данном тексте сноска уже признаёт более точное значение, а «балка» лучше сохраняет исходный архитектурный образ. Кроме того, в первой фразе «бревна ... не видишь» грамматически ошибочно: требуется винительный падеж («бревно»/«балку»). Финальное «станешь ясно видеть и сможешь вынуть» в целом передаёт последовательность и целевой смысл ⲛⲁⲩ ⲉⲃⲟⲗ ⲉⲛⲟⲩϫⲉ.'
