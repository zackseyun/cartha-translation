base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: ru
  text: 'Иисус сказал: «То, что услышишь в своём ухе, возвести в другое ухо[a] с ваших крыш. Ведь никто не зажигает светильник и не ставит его под мерный сосуд[b] и не помещает в скрытое место, но ставит на подставку для светильника, чтобы все входящие и выходящие видели его свет».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что услышишь в своём ухе, в другом ухе возвести». Необычная фраза допускает разные способы синтаксического понимания.'
    reason: Передаёт повтор предлога «в» и сохраняет неясность коптской формулировки, не навязывая истолкования.
  - marker: b
    text: 'То есть под сосуд, служивший мерой объёма; традиционно: «под сосуд» или «под меру».'
    reason: Разъясняет древнюю бытовую реалию и основание выбранного перевода.
  - marker: c
    text: Коптский текст буквально говорит о тех, кто «входит и выходит»; это чтение сохранено, хотя близкие евангельские изречения обычно упоминают входящих.
    reason: Отмечает значимое отличие формы изречения у Фомы от известных параллелей.
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: возвести
  rationale: Глагол означает публично провозглашать или проповедовать; «возвести» естественно передаёт торжественное публичное объявление, не добавляя конфессиональной окраски.
- source_word: ϩⲓϫⲛ̄ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: с ваших крыш
  rationale: Форма множественного числа и притяжательное местоимение второго лица множественного числа требуют «с ваших крыш»; русский предлог «с» естественно выражает провозглашение с возвышенного места.
- source_word: ϩⲏⲃⲥ
  choice: светильник
  rationale: Обозначает лампу/светильник; «светильник» соответствует древнему предмету лучше современного «лампа».
- source_word: ϩⲁⲙⲁⲁϫⲉ
  choice: под мерный сосуд
  rationale: В данном образе слово обозначает сосуд установленной меры, которым накрывают светильник; функционально точный перевод избегает неоправданно конкретного «корзина».
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: подставка
  rationale: Заимствованное слово означает подставку для светильника; краткое «подставка» естественно в контексте и не предполагает современный подсвечник для свечей.
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: свет
  rationale: Прямое и контекстуально ясное соответствие.
theological_decisions:
- issue: Необычная формула «одним ухом… другим ухом»
  choice: Сохранена в основном тексте без истолкования
  alternative: «То, что услышишь на ухо, возвести с крыш»
  rationale: Коптский текст действительно повторяет «ухо» и уточняет «другое»; сглаживание устранило бы подлинную трудность текста и могло бы навязать толкование.
- issue: Адресаты повеления меняются с единственного числа на множественное
  choice: «услышишь… с ваших крыш»
  alternative: Согласовать всё в единственном или множественном числе
  rationale: Смена числа присутствует в источнике и сохранена, поскольку её выравнивание было бы редакционным исправлением.
- issue: «Входящие и выходящие»
  choice: Сохранены обе группы буквально
  alternative: «Все, кто входит»
  rationale: Необычное включение выходящих засвидетельствовано коптским текстом; его нельзя молча уподоблять каноническим параллелям.
translation_notes:
  register: Современный литературный русский с достоинством афористического изречения. Синтаксис сделан ясным, но необычные черты источника — повтор «уха», переход от единственного числа к множественному и «входящие и выходящие» — намеренно не сглажены. Использованы общеупотребительные библейские слова «светильник» и «возвести» без архаической грамматики.
