revisions:
- from: 'Иисус сказал: «То, что услышишь одним ухом, возвести другим ухом[a] с ваших крыш. Ведь никто, зажегши светильник, не ставит его под мерный сосуд[b] и не помещает в укромное место, но ставит на подставку, чтобы все входящие и выходящие видели его свет».[c]'
  to: 'Иисус сказал: «То, что услышишь в своём ухе, возвести в другое ухо[a] с ваших крыш. Ведь никто не зажигает светильник и не ставит его под мерный сосуд[b] и не помещает в скрытое место, но ставит на подставку для светильника, чтобы все входящие и выходящие видели его свет».[c]'
  rationale: 'Исправлена передача спорной, но ясно двукратно локативной формулы об ухе: добавленное «одним» устранено, а «другим ухом» заменено на «в другое ухо». Также устранены необязательная архаизация и два небольших лексических смещения. Смена единственного числа («услышишь») на множественное («с ваших крыш») и упоминание как входящих, так и выходящих сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Требуется небольшая, но существенная правка первой фразы: коптский текст говорит «в твоём ухе» и затем «в другом ухе», а не «одним ухом… другим ухом». Исходная конструкция намеренно необычна; её следует сохранить как локативную, не превращая вторую часть в инструментальное «другим ухом». Остальные ключевые элементы переданы верно: множественное «с ваших крыш», светильник, мерный сосуд, скрытое место, подставка и обе группы — входящие и выходящие.'
  naturalness: Текст в целом литературен и ясен, однако «одним ухом… другим ухом» по-русски меняет синтаксические отношения источника. «Зажегши» — ненужная архаизующая деепричастная форма; простое «не зажигает… и не ставит» современнее и естественнее. «Скрытое место» точнее нейтрального «укромное место», которое добавляет оттенок уюта, отсутствующий в тексте.
  terminology: '«Светильник», «мерный сосуд» и «свет» удачны. Для λυχνία желательно уточнить функцию: «подставка для светильника», а не просто «подставка». «Возвести» допустимо в высоком афористическом регистре и передаёт публичное провозглашение.'
  issues:
  - severity: medium
    issue: 'Первая фраза передаёт «ухо» как орудие действия: «одним ухом… другим ухом».'
    rationale: 'В коптском тексте повторены выражения с предлогом «в»: услышанное «в твоём ухе» надлежит возвестить «в другом ухе». Замена на творительный падеж и добавление «одним» изменяют формулировку и частично снимают её подлинную странность.'
  - severity: low
    issue: «Зажегши» архаизует синтаксис.
    rationale: Деепричастие не требуется источником и расходится с заявленным современным литературным регистром.
  - severity: low
    issue: «Укромное место» несколько интерпретирует «скрытое место».
    rationale: «Укромное» вносит коннотацию уединённости/уютности; нейтральное «скрытое» ближе к коптскому выражению.
  - severity: low
    issue: «Подставка» не вполне выражает значение λυχνία.
    rationale: Это именно подставка (стойка) для светильника; минимальное уточнение сохраняет предметную точность.
