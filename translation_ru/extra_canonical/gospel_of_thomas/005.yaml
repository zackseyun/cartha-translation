base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: ru
  text: 'Иисус сказал: «Познай то, что прямо перед тобой[a], и скрытое от тебя будет открыто тебе[c]. Ибо нет ничего сокрытого, что не станет явным[d]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Прямо перед тобой» передаёт смысл коптского оборота (ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ), буквально: «перед твоим лицом».'
    reason: cultural_note
  - marker: b
    text: 'Греческий свидетель POxy 654 добавляет: «и нет ничего погребённого, что не будет поднято». В коптской рукописи из Наг-Хаммади этой части нет; перевод следует коптскому тексту.'
    reason: textual_variant
  - marker: c
    text: Коптское ϭⲱⲗⲡ буквально означает «раскрыть, снять покров»; возможны также переводы «будет явлено» и «будет раскрыто».
    reason: lexical_alternative
  - marker: d
    text: Выражение ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ означает «проявиться, стать явным, обнаружиться», а не «жить».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: познай
  rationale: Императив передан кратко и прямо. «Познай» сохраняет значение знания и афористическую силу изречения, не сводя его лишь к зрительному распознаванию.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ ⲉⲃⲟⲗ
  choice: то, что перед твоим лицом
  rationale: Сохранён конкретный пространственный образ коптского выражения; его идиоматический смысл пояснён в сноске.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: скрытое от тебя
  rationale: Естественная русская передача со значением «то, что скрыто от тебя», без уточнения причины или субъекта сокрытия.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: будет открыто
  rationale: Передаёт буквальный образ снятия покрова и будущую направленность формы; «тебе» соответствует адресату в коптском тексте.
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: ибо нет ничего
  rationale: Нормальная русская передача коптского всеобщего отрицания; «ибо» сохраняет объяснительную связь и торжественную краткость.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: станет явным
  rationale: Выражение означает проявление или обнаружение, а не «жизнь»; выбран естественный русский оборот без гармонизации с каноническими параллелями.
theological_decisions:
- issue: Характер призыва к знанию
  choice: Сохранён общий глагол «познай» без указания на особый вид тайного или спасительного знания.
  alternative: Истолковать как «распознай», «пойми» либо явно связать с духовным откровением.
  rationale: Коптский глагол допускает широкий смысл «знать/познавать», а сам текст не определяет здесь ни способ познания, ни его доктринальный статус.
- issue: Кем или как открывается скрытое
  choice: Использована безличная пассивная конструкция «будет открыто тебе».
  alternative: 'Назвать Бога действующим лицом или перевести возвратно: «откроется тебе».'
  rationale: Источник не называет действующего лица; пассив сохраняет эту богословски значимую неопределённость.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным афористическим звучанием. Конкретный образ «перед твоим лицом» сохранён намеренно и разъяснён сноской; архаизирующие формы и конфессионально окрашенные толкования не вводились.
