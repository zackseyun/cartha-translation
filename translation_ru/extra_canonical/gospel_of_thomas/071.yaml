base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: ru
  text: 'Иисус сказал: «Я разрушу этот дом[a], и никто не сможет его построить[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «этот дом» частично восстановлены в повреждённом месте рукописи; нормализованный текст читает ⲛⲡⲉⲓⲏⲓ — «этот дом».
    reason: lacuna_or_restoration
  - marker: b
    text: 'Буквально: «никто не сможет [этого]». Действие «построить» подразумевается по слову «дом» и контексту. Иногда переводят «отстроить заново», однако значение «снова» в коптском тексте прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Сохранена формульная конструкция введения прямой речи; сокращённое имя в рукописи раскрыто согласно нормализованному тексту.
- source_word: ⲁⲛⲟⲕ
  choice: Я
  rationale: Самостоятельное местоимение подчёркивает субъект, однако русское «Я» перед глаголом уже передаёт достаточный акцент без утяжеления «Я сам».
- source_word: ϣⲟⲣϣⲣ
  choice: разрушу
  rationale: Глагол означает «разрушать, сносить, низвергать»; «разрушу» естественно сочетается с «домом» и сохраняет прямоту высказывания.
- source_word: ⲡⲉⲓⲏⲓ
  choice: этот дом
  rationale: ⲏⲓ означает дом или жилище, а указательный элемент ⲡⲉⲓ- — «этот»; дополнение частично восстановлено в повреждённом месте рукописи.
- source_word: ⲙⲛⲗⲁⲁⲩ
  choice: никто
  rationale: Отрицательная конструкция с неопределённым местоимением естественно передаётся русским отрицательным местоимением «никто».
- source_word: ϣⲕⲱⲧ
  choice: не сможет
  rationale: Основное значение — «быть в состоянии, мочь»; русская конструкция с будущим временем соответствует контексту.
- source_word: ⲛⲧⲟϥ
  choice: его построить
  rationale: Местоименный объект означает «его/это», тогда как действие достраивается по контексту дома. Выбрано нейтральное «построить», без добавления явно не выраженного значения «снова».
theological_decisions:
- issue: Что обозначает «этот дом»
  choice: Сохранён буквальный и неоднозначный образ «этого дома» без пояснения.
  alternative: Истолковать дом как храм, тело Иисуса, мир или определённое религиозное установление.
  rationale: Коптский текст не называет референт дома; конкретизация внесла бы в перевод недоказанное богословское толкование.
- issue: Подразумеваемое действие после «не сможет»
  choice: В основном тексте добавлено «построить».
  alternative: 'Оставить эллипсис: «никто не сможет этого».'
  rationale: Действие не выражено отдельным коптским глаголом, но естественно восстанавливается из объекта «дом». Сноска сохраняет прозрачность этого решения и не добавляет значения повторности.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественно-нейтральная прямая речь. Синтаксис оставлен простым и афористичным. Неопределённость образа дома сохранена, а текстологическое восстановление и контекстуально восполненный глагол отмечены сносками.
