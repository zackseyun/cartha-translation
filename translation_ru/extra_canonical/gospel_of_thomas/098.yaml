base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: ru
  text: 'Иисус сказал: «Царская власть Отца[a] подобна человеку, который хотел убить вельможу[b]. У себя дома он обнажил меч и вонзил его в стену, чтобы узнать, достаточно ли сильна его рука[c]. Затем он убил вельможу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально речь идёт об отвлечённом понятии царствования или владычества; возможный перевод: «Царство Отца».'
    reason: lexical_alternative
  - marker: b
    text: Греческое заимствование обозначает высокопоставленного «великого человека»; возможны также переводы «сановник», «знатный человек» или «влиятельный человек».
    reason: lexical_alternative
  - marker: c
    text: 'Коптское выражение допускает более буквальную передачу: «сможет ли его рука войти внутрь»; в данном контексте оно также указывает на силу, необходимую для проникновения клинка.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: царская власть
  rationale: Абстрактное образование с ⲙⲛⲧ- обозначает состояние или осуществление царствования, а не обязательно территориальное царство. «Царская власть» естественно передаёт эту отвлечённость по-русски.
- source_word: ⲡⲉⲓⲱⲧ
  choice: Отец
  rationale: Определённая форма означает «Отец», без притяжательного «мой»; это устойчивое обозначение в Евангелии от Фомы.
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: подобна
  rationale: Обычная коптская конструкция сравнения, вводящая притчу.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: вельможа
  rationale: Греческое заимствование обозначает высокопоставленного, влиятельного «великого человека». «Вельможа» сохраняет общественный ранг и подходит возвышенному повествовательному регистру.
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: обнажил меч
  rationale: Глагол означает извлечение меча; русское сочетание кратко и идиоматично.
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: вонзил его в стену
  rationale: Передаёт сильный направленный удар мечом в стену, подразумеваемый глаголом и дополнением.
- source_word: ⲉⲓⲙⲉ
  choice: узнать
  rationale: В целевой конструкции речь идёт о проверке, поэтому «узнать» естественнее общего «знать».
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: хватит ли силы его руке
  rationale: ⲧⲱⲕ выражает силу или способность, а ⲉϩⲟⲩⲛ добавляет направленность внутрь. Основной текст передаёт физическую достаточность силы, не превращая руку в буквальный субъект движения.
- source_word: ϩⲱⲧⲙ
  choice: убил
  rationale: Прямой общеупотребительный эквивалент сохраняет резкость заключительной фразы.
theological_decisions:
- issue: Образ Царства/царской власти Отца сопоставлен с подготовкой к убийству
  choice: Сохранить сравнение без нравственного пояснения и без смягчения насилия
  alternative: Истолковать поступок аллегорически или заменить прямое «убил» более мягким выражением
  rationale: Источник намеренно оставляет напряжённый и загадочный образ без истолкования; перевод не должен навязывать конфессиональное или нравоучительное разрешение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и намеренно резким притчевым изложением. Синтаксис упрощён ради ясности, но последовательность действий и неразрешённая загадочность источника сохранены.
