base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: ru
  text: 'Иисус сказал: «Никто не может сесть верхом на двух коней и натянуть два лука. И раб не может служить двум господам: иначе он будет почитать одного, а другого — оскорблять. Никто не пьёт старое вино и тут же не желает выпить молодого. Молодое вино не наливают в старые бурдюки, чтобы они не лопнули. И старое вино не наливают в новый бурдюк, чтобы оно его не испортило.[a] Старую заплату не пришивают к праздничной одежде,[b] потому что тогда появится разрыв».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В коптском тексте буквально: «чтобы оно его не погубило (не испортило)». Оба местоимения стоят в единственном числе, и не вполне ясно, что именно портит другое — вино бурдюк или бурдюк вино.'
    reason: linguistic_ambiguity
  - marker: b
    text: 'Буквально: «одежда праздника». В синоптических параллелях говорится о новой одежде, однако здесь употреблено именно это выражение.'
    reason: cultural_note
  - marker: c
    text: В отличие от синоптических параллелей (Мф. 9:16–17; Мк. 2:21–22; Лк. 5:36–39), в этом изречении упомянуты старое вино в новом бурдюке и старая заплата на праздничной одежде. Перевод следует коптскому тексту и не приводит его в соответствие с параллелями.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉ-
  choice: не может
  rationale: Оборот буквально выражает отсутствие силы или возможности. Русское «не может» естественно передаёт его в обеих параллельных фразах, не усиливая смысл до отвлечённого «невозможно».
- source_word: ϫⲱⲗⲕ ⲛⲡⲓⲧⲉ
  choice: натянуть лук
  rationale: В сочетании с «луком» глагол обозначает натягивание или взведение лука.
- source_word: ϩⲙϩⲁⲗ
  choice: раб
  rationale: Слово обозначает зависимого слугу или раба; в контексте служения господам «раб» точнее сохраняет социальную и риторическую силу изречения.
- source_word: ⲣⲧⲓⲙⲁ / ⲣϩⲩⲃⲣⲓⲍⲉ
  choice: почитать / оскорблять
  rationale: Греческие заимствования τιμάω и ὑβρίζω образуют контраст между оказанием чести и оскорбительным обращением.
- source_word: ⲏⲣⲡ ⲛⲃⲣⲣⲉ
  choice: молодое вино
  rationale: Буквально «новое вино»; в современном русском применительно к недавно изготовленному вину естественно «молодое вино».
- source_word: ⲁⲥⲕⲟⲥ
  choice: бурдюк
  rationale: Греческое заимствование ἀσκός обозначает кожаный мех для вина; традиционное и понятное русское соответствие — «бурдюк».
- source_word: ⲧⲁⲕⲟ
  choice: испортить
  rationale: Глагол может значить «губить, разрушать, портить»; применительно к вину и бурдюку «испортить» сохраняет широту возможной связи между участниками.
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: праздничная одежда
  rationale: Буквально «одежда праздника». Перевод сохраняет конкретное определение коптского текста, не заменяя его синоптическим «новая одежда».
theological_decisions:
- issue: Согласование с синоптическими вариантами притч
  choice: 'Сохранены собственные формулировки Фомы: старое вино наливают в новый бурдюк, а старую заплату пришивают к праздничной одежде.'
  alternative: Исправить по синоптическим параллелям на молодое вино в новые бурдюки и новую заплату на старую одежду.
  rationale: Коптский свидетель ясно содержит эти обратные сочетания. Гармонизация с Матфеем, Марком или Лукой устранила бы особенности данного текста и навязала бы ему определённое толкование.
- issue: Неясность местоимений в предостережении о старом вине и новом бурдюке
  choice: «чтобы оно его не испортило» с пояснением в сноске
  alternative: «чтобы старое вино не испортило новый бурдюк»
  rationale: В коптском стоят два местоимения мужского рода единственного числа, и их референция формально неоднозначна. Русская местоименная конструкция сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, с достоинством и без архаизации. Параллельные конструкции и афористический ритм сохранены; «раб», «господа» и «бурдюк» оставлены как исторически уместные и общеупотребительные слова. Неоднозначность местоимений не устранена, а необычные для синоптической традиции сочетания сохранены.
