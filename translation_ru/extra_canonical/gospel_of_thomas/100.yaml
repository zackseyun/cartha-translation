base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: ru
  text: 'Они показали Иисусу золотую монету[a] и сказали ему: «Те, кто служит кесарю, требуют с нас налог[b]». Он сказал им: «Отдайте кесарю то, что принадлежит кесарю; Богу — то, что принадлежит Богу[c]; а мне отдайте то, что принадлежит мне[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «золото» или «золотая вещь»; по контексту имеется в виду золотая монета.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен более буквальный перевод: «Те, кто принадлежит кесарю, просят у нас налог». В налоговом контексте глагол «просить, искать» естественно передать как «требовать» или «взыскивать».'
    reason: lexical_alternative
  - marker: c
    text: 'В оригинале в первых двух повелениях употреблены множественные формы: буквально «вещи кесаря — кесарю, вещи Бога — Богу». Русское «то, что принадлежит…» передаёт их собирательный смысл.'
    reason: grammar
  - marker: d
    text: 'В Евангелии от Фомы к словам о кесаре и Боге добавлено третье повеление: «а мне отдайте то, что принадлежит мне»; в синоптических параллелях его нет (Мф. 22:21; Мк. 12:17; Лк. 20:25).'
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲟⲩⲛⲟⲩⲃ
  choice: золотую монету
  rationale: Буквально выражение означает «золото» или «золотую вещь», но налоговый контекст указывает на золотую монету; её достоинство не уточняется.
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: те, кто служит кесарю
  rationale: Оборот обозначает людей, относящихся к кесарю или состоящих у него на службе. «Служит кесарю» естественно по-русски и не сужает их до конкретной должности сборщиков налогов.
- source_word: ⲥⲉϣⲓⲧⲉ
  choice: требуют
  rationale: Основное значение — «искать, просить»; применительно к обязательному налогу естественно передать как «требовать».
- source_word: ⲡϣⲱⲙ
  choice: налог
  rationale: Слово обозначает подать или налог. Современное «налог» понятно читателю и точно передаёт финансовый контекст.
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: принадлежащее кесарю / принадлежащее Богу
  rationale: Коптские формы имеют множественное значение «вещи кесаря / вещи Бога». Субстантивированное «принадлежащее» сохраняет смысл совокупности без неестественного русского оборота «вещи кесаря».
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ ⲡⲉ
  choice: то, что принадлежит мне
  rationale: В отличие от предшествующих множественных форм, здесь стоит единично оформленная относительная конструкция; перевод сохраняет заметный переход к личному «мне».
theological_decisions:
- issue: Кому относится «мне» в заключительном повелении
  choice: 'Сохранено прямое первое лицо: «то, что принадлежит мне, отдайте мне»'
  alternative: «Принадлежащее Иисусу отдайте Иисусу»
  rationale: Источник не разъясняет объём или богословский смысл притязания говорящего. Прямое первое лицо сохраняет эту напряжённость и не добавляет толкования.
- issue: Соотношение обязанностей перед кесарем, Богом и Иисусом
  choice: Три параллельных повеления переданы без поясняющей иерархии
  alternative: Истолковать третье повеление как уточнение или ограничение первых двух
  rationale: Текст соединяет три требования, но не объясняет их взаимосвязь; перевод не должен разрешать оставленную автором неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. «Кесарь» сохраняет историко-библейскую окраску, тогда как «налог» предпочтён более архаичной «подати» ради ясности. Формула «принадлежащее кесарю» избегает как неестественного буквализма, так и чрезмерной гармонизации с привычным синодальным оборотом.
