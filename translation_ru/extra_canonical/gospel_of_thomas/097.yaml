revisions:
- from: 'Иисус сказал: «Царство Отца подобно женщине, которая несла кувшин, полный муки. Когда она шла по дороге и была ещё далеко, ручка кувшина[a] сломалась, и мука высыпалась позади неё на дорогу. Она не знала об этом и не заметила беды[b]. Придя домой, она поставила кувшин на землю и обнаружила, что он пуст».'
  to: 'Иисус сказал: «Царство Отца подобно женщине, которая несла кувшин, полный муки. Когда она шла по дороге и была ещё далеко, ручка кувшина[a] сломалась, и мука высыпалась позади неё на дорогу. Она не знала об этом и не заметила беды[b]. Когда она вошла в свой дом, она поставила кувшин на землю и обнаружила, что он пуст».'
