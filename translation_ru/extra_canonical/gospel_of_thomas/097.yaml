base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: ru
  text: 'Иисус сказал: «Царство Отца подобно женщине, которая несла кувшин, полный муки. Когда она шла по дороге и была ещё далеко, ручка кувшина[a] сломалась, и мука высыпалась позади неё на дорогу. Она не знала об этом и не заметила беды[b]. Когда она вошла в свой дом, она поставила кувшин на землю и обнаружила, что он пуст».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ухо кувшина», то есть его ушко или ручка.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «неприятности», «тяготы» или «труда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: кувшин
  rationale: Слово обозначает сосуд типа кувшина или большого глиняного кувшина; «кувшин» естественно передаёт предмет, имеющий ручку и пригодный для переноски муки.
- source_word: ⲛⲟⲉⲓⲧ
  choice: мука
  rationale: В данном бытовом контексте слово означает муку или мучную крупу; русское «мука» наиболее естественно и конкретно.
- source_word: ⲙⲁⲁϫⲉ
  choice: ручка
  rationale: Буквальное значение — «ухо», но применительно к сосуду это его ушко или ручка. В основном тексте выбрано понятное современному читателю «ручка», а буквальный образ отмечен в сноске.
- source_word: ⲟⲩⲱϭⲡ
  choice: сломалась
  rationale: Передаёт значение «сломаться, быть сломанным» без добавления подробностей о характере повреждения.
- source_word: ϣⲟⲩⲟ
  choice: высыпалась
  rationale: Глагол допускает значения «опустошаться, выливаться, высыпаться»; для муки по-русски естественно «высыпалась».
- source_word: ϩⲓⲥⲉ
  choice: беда
  rationale: Слово охватывает труд, тяготу, беду или неприятность. Здесь оно указывает на случившуюся с сосудом беду, которую женщина не заметила.
- source_word: ⲟⲩⲉ
  choice: была ещё далеко
  rationale: Сохранено обстоятельство удалённости, явно присутствующее в коптском тексте, но без добавления отсутствующего в источнике указания, от чего именно женщина была далеко.
theological_decisions:
- issue: Передача ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: Царство Отца
  alternative: Царство Бога / Царство Небесное
  rationale: Формулировка источника сохранена без гармонизации с каноническими евангельскими выражениями.
- issue: Истолкование смысла притчи
  choice: Не добавлять объяснение или аллегорическое толкование
  alternative: Пояснить утрату царства как незаметный процесс
  rationale: Само изречение не содержит истолкования; перевод сохраняет его образность, неоднозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной интонацией. Неясное «была ещё далеко» сохранено без уточнения предполагаемой точки назначения. Повтор «кувшин» предпочтён местоимению там, где это облегчает понимание причинно-следственной связи.
