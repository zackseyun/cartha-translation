revisions:
- from: Кто не возненавидит своего отца и свою мать, как я[a], тот не может стать моим учеником; и кто не полюбит своего отца и свою мать, как я, тот не может стать моим учеником. Ведь моя мать […][b], а моя истинная[c] [мать] дала мне жизнь.
  to: Кто не ненавидит своего отца и свою мать так, как я[a], тот не может стать моим учеником; и кто не любит своего отца и свою мать так, как я, тот не может стать моим учеником. Ведь моя мать […][b], а моя истинная мать[c] дала мне жизнь.
  rationale: Удалены необоснованные квадратные скобки вокруг сохранившегося слова «мать» и исправлена сноска, ошибочно называвшая его восстановлением. Глагольные формы приведены к обобщённому настоящему времени; «так, как я» делает сравнение по ⲛ̄ⲧⲁϩⲉ более ясным, не устраняя его смысловую неоднозначность. Лакуна и отсутствие уверенного восстановления сохранены.
