base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: ru
  text: Кто не ненавидит своего отца и свою мать так, как я[a], тот не может стать моим учеником; и кто не любит своего отца и свою мать так, как я, тот не может стать моим учеником. Ведь моя мать […][b], а моя истинная мать[c] дала мне жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подобно мне» или «по-моему» (ⲛ̄ⲧⲁϩⲉ). То же выражение повторено далее после слов «свою мать».'
    reason: lexical_alternative
  - marker: b
    text: В этом месте рукопись повреждена (ⲛ̄ⲧⲁⲥ̣[.........] [..]ⲟ̣ⲗ̣), поэтому сказуемое первой части противопоставления надёжно не восстанавливается. Предлагались реконструкции со смыслом «родила меня для смерти» или «дала мне ложь», но ни одна из них не бесспорна.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «моя мать истины» (ⲧⲁⲙⲁⲁⲩ ⲇⲉ ⲙ̄ⲙⲉ); перевод «моя истинная мать» передаёт определительное значение этого выражения. Слово «мать» в рукописи сохранилось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: возненавидит
  rationale: Обычное значение коптского глагола — «ненавидеть». Совершенный вид естественно передаёт условие, не ослабляя резкости исходного высказывания.
- source_word: ⲙⲣ̄ⲣⲉ (ⲙⲉ)
  choice: полюбит
  rationale: Глагол означает «любить» и образует намеренный контраст с «возненавидит».
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: как я
  rationale: Фраза буквально означает «подобно мне / по-моему». Краткое «как я» сохраняет возможную соотнесённость как с действием, так и с примером говорящего.
- source_word: ϣ … ⲁⲛ
  choice: не может
  rationale: Отрицательная конструкция с глаголом способности передаёт невозможность стать учеником.
- source_word: ⲙ̄ⲙⲉ
  choice: истинная
  rationale: Буквально «[мать] истины / истинная [мать]»; в данном определительном употреблении естественно по-русски «истинная».
- source_word: ⲱⲛϩ
  choice: жизнь
  rationale: Прямое соответствие коптскому существительному «жизнь».
theological_decisions:
- issue: Противопоставление матери говорящего и «истинной матери»
  choice: Сохранить противопоставление без отождествления «истинной матери» с конкретной божественной фигурой.
  alternative: Истолковать «истинную мать» как Святого Духа, Премудрость или иную небесную фигуру.
  rationale: Сам сохранившийся коптский текст такого отождествления не даёт, а повреждение рукописи лишает нас части противопоставления.
- issue: Смысл выражения ⲛ̄ⲧⲁϩⲉ при глаголах «ненавидеть» и «любить»
  choice: Перевести «как я», сохранив неоднозначность.
  alternative: 'Уточнить: «как это делаю я» или «так, как [относятся] ко мне».'
  rationale: Исходная фраза допускает более одного способа соотнести сравнение с говорящим; уточняющий перевод преждевременно разрешил бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Резкие антонимы «возненавидит / полюбит» сохранены, а лакуна обозначена явно; квадратные скобки вокруг второго слова «мать» показывают контекстуальное восполнение.
