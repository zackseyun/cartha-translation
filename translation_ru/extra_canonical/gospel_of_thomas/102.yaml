base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: ru
  text: 'Иисус сказал: «Горе фарисеям! Они подобны собаке, лежащей на кормушке[a] для скота[b]: сама она не ест и скоту есть не даёт[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на яслях», «на кормовом корыте». Коптское ⲡⲟⲩⲟⲙϥ обозначает кормушку для животных.'
    reason: lexical_alternative
  - marker: b
    text: Коптское ⲉϩⲉ обозначает домашних животных или скот вообще. Традиционный перевод «волы» сужает значение исходного слова. В рукописи часть букв повреждена, однако такое прочтение подтверждается повторением того же слова далее.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Буквально по смыслу конструкции: «не позволяет скоту есть».'
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: Горе
  rationale: Устойчивая русская формула сурового предостережения или осуждения сохраняет резкость коптского междометия.
- source_word: ⲉⲓⲛⲉ
  choice: подобны
  rationale: Точно и естественно передаёт значение сходства, сохраняя сжатость изречения.
- source_word: ⲟⲩϩⲟⲣ
  choice: собака
  rationale: Прямое соответствие исходному слову без смягчения резкого образа.
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: лежащей
  rationale: В данном контексте обозначает положение тела; перевод «спящей» внёс бы не выраженную явно подробность.
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: кормушка
  rationale: Современное и понятное обозначение ёмкости, из которой кормят домашних животных; менее стилистически маркировано, чем «ясли».
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: скот
  rationale: Коптское слово имеет обобщённое значение домашних сельскохозяйственных животных; «волы» было бы неоправданным сужением.
- source_word: ⲟⲩⲱⲙ
  choice: есть
  rationale: Передаёт основное значение глагола прямо и без стилистического усложнения.
- source_word: ⲕⲱ … ⲉⲟⲩⲱⲙ
  choice: есть не даёт
  rationale: В сочетании с инфинитивом глагол означает «позволять, давать»; русская конструкция естественно сохраняет отрицание исходного текста.
theological_decisions:
- issue: Направленность слова «горе»
  choice: «Горе фарисеям»
  alternative: «Горе им, фарисеям»
  rationale: Нормализованный текст и непосредственный смысл ясно относят предостережение к фарисеям; выбранная форма естественнее по-русски и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены резкость обличения и наглядность сравнения; архаичное «ясли» оставлено как примечательный вариант, а в основном тексте употреблено общепонятное «кормушка».
