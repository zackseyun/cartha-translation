base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: ru
  text: 'Иисус сказал: «Если те, кто ведёт вас,[a] скажут вам: „Вот, царство на небе“, — тогда птицы небес опередят вас. Если они скажут вам: „Оно в море“, — тогда рыбы опередят вас. Но царство — внутри вас и снаружи вас.[b] Когда вы познаете самих себя, тогда вас познают,[c] и вы поймёте, что вы — дети живого Отца.[d] Но если вы не познаете самих себя, то окажетесь в нищете, и вы — нищета».[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Те, кто ведёт вас»: коптское ⲥⲱⲕ может означать «тянуть» или «вести». Слова «в заблуждение» в тексте нет.'
    reason: lexical_alternative
  - marker: b
    text: В коптском тексте сказано просто «царство»; слов «Божье» или «Бога» здесь нет.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «они познают вас». Неопределённое «они» может служить способом выразить страдательное значение, не называя действующего лица.'
    reason: dialect_note
  - marker: d
    text: В дипломатическом чтении рукописи стоит множественное «дети» (ⲛ̄ϣⲏⲣⲉ), тогда как предоставленный нормализованный текст даёт форму единственного числа.
    reason: textual_variant
  - marker: e
    text: Все формы «вы/вас» в этом изречении имеют множественное число.
    reason: dialect_note
lexical_decisions:
- source_word: ⲥⲱⲕ ϩⲏⲧⲧⲏⲩⲧⲛ̄
  choice: ведёт вас
  rationale: Глагол ⲥⲱⲕ означает «тянуть, вести»; в тексте прямо не сказано, что эти люди вводят слушателей в заблуждение.
- source_word: ⲙⲛ̄ⲧⲉⲣⲟ
  choice: царство
  rationale: Обычный и понятный эквивалент абстрактного существительного со значением царства или царствования; в данном месте определение «Божье» отсутствует.
- source_word: ⲧⲡⲉ
  choice: небо
  rationale: Русское «небо» сохраняет возможный диапазон между видимым небом и небесной сферой; образ птиц поддерживает конкретное пространственное прочтение.
- source_word: ⲙ̄ⲡⲉⲧⲛ̄ϩⲟⲩⲛ / ⲙ̄ⲡⲉⲧⲛ̄ⲃⲁⲗ
  choice: внутри вас / снаружи вас
  rationale: Сохранена пространственная симметрия коптской пары «внутри — снаружи» без её богословского истолкования.
- source_word: ⲥⲟⲩⲱⲛⲧⲏⲩⲧⲛ̄
  choice: познаете самих себя
  rationale: Возвратное дополнение и условно-будущая конструкция естественно передаются как достижение самопознания.
- source_word: ⲥⲉⲛⲁⲥⲟⲩⲱⲛⲧⲏⲛⲉ
  choice: вас познают
  rationale: Неопределённое третье лицо множественного числа передано русской неопределённо-личной конструкцией без добавления действующего лица.
- source_word: ⲛ̄ϣⲏⲣⲉ
  choice: дети
  rationale: Дипломатический текст рукописи имеет множественное число ⲛ̄ϣⲏⲣⲉ, согласующееся с обращением во множественном числе; «дети» не навязывает мужской род там, где русский язык позволяет его не выражать.
- source_word: ⲙⲛ̄ⲧϩⲏⲕⲉ
  choice: нищета
  rationale: Абстрактное существительное повторено в обеих частях заключения; буквальный повтор сохраняет резкий парадокс высказывания.
theological_decisions:
- issue: Местонахождение царства
  choice: «внутри вас и снаружи вас»
  alternative: истолковать как исключительно внутреннюю духовную реальность или как царство среди общины
  rationale: Исходный текст соединяет оба пространственных выражения и не объясняет их; перевод сохраняет это напряжение.
- issue: Кем будут познаны слушатели
  choice: «вас познают» без названного субъекта
  alternative: «Бог познает вас»
  rationale: Коптская неопределённо-личная форма не называет Бога или иного деятеля, поэтому субъект не добавлен.
- issue: Дети живого Отца
  choice: множественное «дети»
  alternative: единственное «дитя» по нормализованной форме ⲡϣⲏⲣⲉ
  rationale: Дипломатическое чтение рукописи ⲛ̄ϣⲏⲣⲉ является множественным; оно предпочтительнее ошибочно нормализованного единственного числа.
