base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: ru
  text: 'Иисус сказал: «Никто не может войти в дом сильного и силой захватить его[a], если не свяжет ему руки. Тогда он перевернёт его дом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение «его» в коптском тексте может относиться как к дому, так и к сильному: возможно также понимание «силой схватить сильного».'
    reason: Сохранение реальной грамматической неоднозначности источника.
  - marker: b
    text: Коптский глагол может означать «вылить», «опрокинуть» или «перевернуть». Возможный смысл — «опустошит его дом»; однако здесь не стоит обычный глагол со значением «ограбить», известный по синоптическим параллелям.
    reason: Пояснение необычного глагола и значимого расхождения с параллельными формулировками.
lexical_decisions:
- source_word: ⲙⲛ̄ϭⲟⲙ
  choice: никто не может
  rationale: Естественно передаёт отрицательную конструкцию со значением невозможности или отсутствия способности, не меняя общего утверждения.
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: сильный
  rationale: 'Субстантивированное прилагательное: «сильный [человек]». Краткая форма сохраняет образ и связь с синоптической традицией, не добавляя отсутствующего в тексте существительного.'
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: силой захватить его
  rationale: Оборот означает насильственное овладение или захват. Мужское местоимение в русском, как и в коптском, допускает соотнесение и с «домом», и с «сильным», поэтому неоднозначность сохранена.
- source_word: ⲙⲟⲩⲣ ⲛ̄ⲛⲉϥϭⲓϫ
  choice: свяжет ему руки
  rationale: Прямо передаёт связывание рук сильного; дательный «ему» звучит естественно по-русски.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: перевернёт
  rationale: Сохраняет конкретный образ коптского глагола («вылить, опрокинуть, перевернуть») и не подменяет его глаголом «ограбить», употреблённым в синоптических параллелях.
theological_decisions:
- issue: К кому относится местоимение в выражении «захватить его»
  choice: Сохранить грамматическую неоднозначность
  alternative: Однозначно перевести «захватить дом» или «схватить сильного»
  rationale: Коптское местоимение мужского рода может относиться как к дому, так и к сильному; контекст не требует молча устранять эту двусмысленность.
- issue: Описание действия над домом в заключении
  choice: 'Перевести буквально-образно: «перевернёт его дом»'
  alternative: «Ограбит» или «опустошит его дом»
  rationale: Так сохраняется отличие данного изречения от канонических параллелей и не вводится более определённое толкование действия.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Формула «дом сильного» сохраняет лаконичность исходного образа; необычное «перевернёт его дом» намеренно оставлено без конфессионального истолкования и пояснено в примечании.
