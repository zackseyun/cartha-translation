base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: ru
  text: 'Иисус сказал: «Царство Отца подобно человеку, у которого было хорошее семя. Ночью пришёл его враг и посеял сорняк[a] поверх хорошего семени. Человек не позволил им[b] вырвать сорняк. Он сказал им: „Чтобы вы не пошли со словами: «Мы вырвем сорняк», — и не вырвали вместе с ним пшеницу. Ведь в день жатвы сорняки станут видны; их вырвут и сожгут[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В коптском тексте сначала стоит единственное число: «сорняк», затем — «этот сорняк», а в заключении появляется множественное число: «сорняки». Слово заимствовано из греческого ζιζάνιον и может точнее обозначать плевел.'
    reason: Передать необычный переход от единственного числа к множественному и указать более узкое ботаническое значение.
  - marker: b
    text: В тексте сказано «не позволил им», но те, к кому относится местоимение «им», прежде прямо не названы.
    reason: Сохранить неуточнённость референта местоимения в источнике.
  - marker: c
    text: 'Буквально заключительная фраза имеет действительную форму с неопределённым субъектом: «их вырывают и сжигают»; по смыслу она передана по-русски как «их вырвут и сожгут».'
    reason: Пояснить грамматически обусловленную пассивную передачу заключения.
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: Царство Отца
  rationale: Сохраняет принадлежность царства Отцу и соответствует прямой синтаксической связи в коптском тексте.
- source_word: ⲟⲩϭⲣⲟϭ ⲉⲣⲉⲛⲁⲛⲟⲩⲛⲧⲟϥ
  choice: хорошее семя
  rationale: ⲛⲁⲛⲟⲩϥ означает «хороший, добрый»; «хорошее семя» естественно по-русски и не добавляет нравственного толкования.
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: сорняк / сорняки
  rationale: Греческое заимствование ζιζάνιον может обозначать плевел, однако общее «сорняк» понятно современному читателю. Перевод сохраняет переход от единственного числа к множественному в конце изречения.
- source_word: ⲕⲱ ... ⲉϩⲱⲱⲗⲉ
  choice: позволил ... вырвать
  rationale: В данной конструкции ⲕⲱ с инфинитивом передаёт разрешение или допущение действия.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: станут видны
  rationale: Передаёт значение «обнаружиться, стать явными» естественным современным русским выражением.
- source_word: ⲡⲱϩⲥ
  choice: жатва
  rationale: Слово обозначает жатву или сбор урожая; выражение ϩⲛⲡϩⲟⲟⲩ ⲛⲡⲱϩⲥ — «в день жатвы».
theological_decisions:
- issue: Точное обозначение ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: сорняк / сорняки
  alternative: плевел / плевелы
  rationale: «Плевел» ботанически и традиционно точнее, но для многих современных читателей менее прозрачен. «Сорняк» сохраняет смысл противопоставления пшенице, не навязывая аллегорического толкования.
- issue: Царство как принадлежащее Отцу
  choice: Царство Отца
  alternative: Отчее Царство
  rationale: Первый вариант ближе к явной родительной конструкции источника и звучит современно и достоинственно.
- issue: Появление сорняков в день жатвы
  choice: сорняки станут видны
  alternative: сорняки обнаружатся
  rationale: Сохраняется образ выявления скрытого различия без уточнения, каким образом или кем оно распознаётся.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого изречения. Синтаксис слегка сглажен для ясности, но сохранены повтор «хорошее семя», неуточнённое «им», переход от единственного «сорняк» к множественному «сорняки» и богословски значимая неопределённость образов.
