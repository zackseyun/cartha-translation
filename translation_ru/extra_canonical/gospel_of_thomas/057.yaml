  source_fidelity: 'В целом перевод точно передаёт коптский текст: «Царство Отца», хорошее семя, ночной приход врага, неуточнённое «им», переход от единственного «сорняк» к множественному «сорняки», день жатвы и заключительная неопределённо-личная конструкция сохранены. Однако «среди хорошего семени» ослабляет пространственное значение ⲉϫⲛ («на, поверх»), а синтаксис предупреждения в прямой речи требует исправления.'
  naturalness: Основной регистр удачен и современен. Оборот «Как бы вы, сказав..., не вырвали...» тяжеловесен и синтаксически неясен; более естественное «чтобы вы не пошли со словами... и не вырвали...» сохраняет смысл и форму предостережения. Исправлено также оформление вложенной прямой речи и положение сноски.
  terminology: «Царство Отца», «хорошее семя», «сорняк/сорняки», «пшеница» и «жатва» выбраны удачно. Примечание о возможном значении «плевел» уместно и не навязывает ботаническую идентификацию.
  issues:
  - severity: medium
    issue: Пространственное отношение при посеве передано как «среди хорошего семени».
    rationale: Коптское ⲉϫⲛ ⲡϭⲣⲟϭ ⲉⲧⲉⲣⲉⲛⲁⲛⲟⲩⲛⲧⲟϥ означает «на/поверх хорошего семени». «Среди» добавляет иной образ размещения; «поверх» ближе к источнику.
  - severity: medium
    issue: Фраза «Как бы вы, сказав..., не вырвали...» синтаксически неудачна.
    rationale: ⲙⲏⲡⲱⲥ вводит предостережение «чтобы не / как бы не», а ⲃⲱⲕ ϫⲉ передаёт «пойти, говоря». Исправленная русская конструкция яснее, не меняя смыслового соотношения действий.
  - severity: low
    issue: Оформление внутренней цитаты и конечного сносочного якоря нуждается в нормализации.
    rationale: Вложенная цитата должна быть оформлена русскими кавычками „...“, а сноска к заключительной фразе должна стоять непосредственно при этой фразе, внутри внешних кавычек.
  revised_text: 'Иисус сказал: «Царство Отца подобно человеку, у которого было хорошее семя. Ночью пришёл его враг и посеял сорняк[a] поверх хорошего семени. Человек не позволил им[b] вырвать сорняк. Он сказал им: „Чтобы вы не пошли со словами: «Мы вырвем сорняк», — и не вырвали вместе с ним пшеницу. Ведь в день жатвы сорняки станут видны; их вырвут и сожгут[c]“».'
  revised_footnotes:
  - marker: a
    text: 'В коптском тексте сначала стоит единственное число: «сорняк», затем — «этот сорняк», а в заключении появляется множественное число: «сорняки». Слово заимствовано из греческого ζιζάνιον и может точнее обозначать плевел.'
    reason: Передать необычный переход от единственного числа к множественному и указать более узкое ботаническое значение.
  - marker: b
    text: В тексте сказано «не позволил им», но те, к кому относится местоимение «им», прежде прямо не названы.
    reason: Сохранить неуточнённость референта местоимения в источнике.
  - marker: c
    text: 'Буквально заключительная фраза имеет действительную форму с неопределённым субъектом: «их вырывают и сжигают»; по смыслу она передана по-русски как «их вырвут и сожгут».'
    reason: Пояснить грамматически обусловленную пассивную передачу заключения.
