base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: ru
  text: 'Иисус сказал: «Если двое примирятся друг с другом[b] в этом одном доме[a], они скажут горе: „Сдвинься отсюда“[c], — и она сдвинется».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«В этом одном доме» можно также перевести: «в одном доме» или «в этом же доме». Слово ⲟⲩⲱⲧ может означать «один», «единый» или «тот же».'
    reason: lexical_alternative
  - marker: b
    text: «Друг с другом» передаёт коптское выражение, буквально связанное со значением «со своими товарищами (спутниками)», но употреблённое здесь для обозначения взаимности.
    reason: cultural_note
  - marker: c
    text: «Сдвинься отсюда» передаёт значение движения прочь или наружу; возможны переводы «отойди» и «сдвинься с места».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: если
  rationale: Проспективно-условный показатель вводит условие; «если» сохраняет его силу в афористическом высказывании.
- source_word: ⲥⲛⲁⲩ
  choice: двое
  rationale: Форма обозначает количественное числительное «два»; субстантивированное «двое» естественно по-русски для двух людей.
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: примирятся
  rationale: Конструкция с заимствованным существительным «мир» выражает установление взаимного мира; «примирятся» естественно передаёт взаимное действие, не сводя его лишь к спокойному состоянию.
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: друг с другом
  rationale: Буквально выражение связано со спутниками или товарищами, но здесь идиоматически передаёт взаимность.
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: в этом одном доме
  rationale: Сохранены указательное значение ⲡⲉⲓ- и отмеченное ⲟⲩⲱⲧ «один/единый/тот же», не устраняя возможный оттенок единства.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁϫⲱ ⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: они скажут горе
  rationale: Будущая конструкция и адресат речи переданы прямо и естественно; местоименное дополнение в коптском не требует отдельного воспроизведения по-русски.
- source_word: ϫⲉ ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: Сдвинься отсюда
  rationale: Императивное содержание сохранено; «отсюда» передаёт направительный оттенок ⲉⲃⲟⲗ — наружу, прочь, в сторону.
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: и она сдвинется
  rationale: Мужской род коптского местоимения согласован с родом коптского существительного; в русском местоимение закономерно согласуется с женским «гора».
theological_decisions:
- issue: Характер мира между двумя
  choice: «примирятся» — установят мир друг с другом
  alternative: «будут в мире» — станут пребывать в мирном состоянии
  rationale: Исходная конструкция допускает оттенок состояния и действия. «Примирятся» лучше выражает взаимность и результат, не уточняя причины прежнего разлада.
- issue: Значение «одного дома»
  choice: сохранить буквальное и неоднозначное «в этом одном доме»
  alternative: «в одном доме» или «в этом же доме»
  rationale: Так не устраняется возможная символика единства, но она и не утверждается как единственно верное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и достойным звучанием. Несколько необычная формула «в этом одном доме» намеренно сохранена ради смысловой неоднозначности оригинала; гендер местоимения естественно согласован с русским словом «гора».
