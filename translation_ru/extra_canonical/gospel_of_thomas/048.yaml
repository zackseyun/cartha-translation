  source_fidelity: Русский текст точно передаёт условную конструкцию, взаимное установление мира, указание на «этот один/единый дом», обращение к горе и будущее исполнение повеления. «Примирятся друг с другом» — уместная естественная передача ⲣⲉⲓⲣⲏⲛⲏ ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ; она не требует предполагать конкретную предысторию конфликта. «Сдвинься отсюда» адекватно выражает ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ («двинься/уйди прочь»).
