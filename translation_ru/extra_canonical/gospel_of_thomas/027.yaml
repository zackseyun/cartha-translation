base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: ru
  text: Если вы не будете поститься мир[a], то не найдёте царства[b]; и если не сделаете субботу субботой[c], то не увидите Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально и намеренно необычно: «поститься мир». Коптская конструкция вводит «мир» как объект глагола; так же построен сохранившийся греческий свидетель. Часто переводят более гладко: «поститься от мира».'
    reason: lexical_alternative
  - marker: b
    text: В греческом фрагменте POxy 1 сказано «Царства Божьего»; в коптском тексте Наг-Хаммади — просто «царства». Здесь принят коптский основной текст.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «сделать субботу субботой». Вероятный смысл — дать субботе действительно быть субботой, то есть соблюдать её как таковую; перевод сохраняет сжатую и допускающую разные оттенки формулировку источника.'
    reason: cultural_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ … ⲧⲙ-
  choice: если … не
  rationale: Условная конструкция выражает предполагаемое условие; «если» естественно передаёт форму изречения.
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: постить мир
  rationale: Глагол заимствован из греческого νηστεύειν, а ⲉ- вводит объект; греческий свидетель также имеет винительный τὸν κόσμον. Необычная переходная конструкция сохранена, а не сглажена до «поститься от мира».
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: мир
  rationale: Обычный и понятный русский эквивалент греческого заимствования κόσμος в данном контексте.
- source_word: ⲁϩⲉ
  choice: найдёте
  rationale: Передаёт прямое значение глагола и сохраняет краткость изречения.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: царство
  rationale: Традиционный и естественный эквивалент; определение «Божье» в коптском основном тексте отсутствует.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: сделаете субботу субботой
  rationale: Сохраняет предикативную конструкцию, повтор и намеренно сжатую форму источника.
- source_word: ⲛⲁⲩ
  choice: увидите
  rationale: Прямой современный эквивалент без усиления до «узрите».
- source_word: ⲡⲉⲓⲱⲧ
  choice: Отца
  rationale: Определённая форма употреблена как титул; прописная буква естественно передаёт это употребление по-русски.
theological_decisions:
- issue: Относится ли требование о субботе к буквальному соблюдению дня или имеет расширенный смысл
  choice: Сохранена буквальная формула «сделаете субботу субботой»
  alternative: «будете соблюдать субботу»
  rationale: Источник не разъясняет характер требования. Более свободный вариант заранее свёл бы напряжённую формулу к одному ритуальному толкованию.
- issue: Как понимать пост по отношению к миру
  choice: 'Сохранена необычная переходность: «постить мир»'
  alternative: «поститься от мира»
  rationale: Так передаётся грамматика коптского текста и греческого свидетеля без навязывания единственного толкования — полного отречения от мира.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Архаизмы вроде «узрите» устранены. Необычность выражения «постить мир» сохранена сознательно как особенность исходной конструкции и пояснена в примечании.
