base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: ru
  text: 'Иисус сказал: «Кто знает Всё, но кому недостаёт самого себя[a], тому недостаёт во всех отношениях[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но сам испытывает недостаток» либо «но испытывает недостаток в самом себе». Коптское сочетание «один» с местоимением допускает возвратное понимание, а также оттенок «сам по себе» или «один»; точная связь намеренно не уточняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в месте [его] всём»; это наречный оборот со значением «во всех отношениях» или «целиком». В рукописи перед вторым глаголом местоимение «он» пропущено и восстановлено издателями (⟨ϥ⟩); смысл фразы от этого не меняется.'
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (в ⲡⲉⲧⲥⲟⲟⲩⲛ)
  choice: знает
  rationale: Коптская форма представляет относительное настоящее и в афористическом контексте выражает постоянное состояние, а не завершённое приобретение знания.
- source_word: ⲡⲧⲏⲣϥ
  choice: Всё
  rationale: Субстантивированное «Всё» сохраняет возможный всеохватный, в том числе космический, смысл; нейтральное «всё» могло бы восприниматься лишь как совокупность сведений.
- source_word: ⲣϭⲣⲱϩ
  choice: не имеет / испытывает недостаток
  rationale: Один и тот же коптский глагол означает нехватку или недостаток. В первом случае естественное русское «не имеет самого себя» сохраняет парадокс, а во втором «во всём испытывает недостаток» ясно передаёт всеобъемлющий характер нехватки.
- source_word: ⲟⲩⲁⲁϥ
  choice: самого себя
  rationale: Сочетание «один» с местоименным суффиксом допускает возвратное понимание. Оно сохраняет внутреннюю напряжённость изречения, хотя возможно и значение «сам по себе».
- source_word: ⲙ̄ⲡⲙⲁ ⲧⲏⲣϥ
  choice: во всём
  rationale: 'Фраза функционирует как наречное обозначение полной меры: «всецело», «во всех отношениях».'
theological_decisions:
- issue: Значение субстантивированного ⲡⲧⲏⲣϥ
  choice: Всё
  alternative: всё / целое
  rationale: Заглавная буква позволяет сохранить вероятный всеохватный смысл термина, не утверждая определённой космологии.
- issue: Объект человеческой нехватки
  choice: не имеет самого себя
  alternative: сам в нужде / испытывает недостаток в самом себе
  rationale: Возвратное прочтение хорошо поддерживается конструкцией и сохраняет парадокс, однако не объясняется как конкретное учение о природе или спасении человека.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. «Всё» намеренно сохраняет необычность исходного выражения, а повтор идеи недостатка удерживает словесную связь двух частей изречения. Все примечания отмечены в основном тексте.
