  source_fidelity: 'Начальное «Кто знает Всё» точно передаёт относительное настоящее ⲡⲉⲧⲥⲟⲟⲩⲛ и сохраняет субстантивированную, всеохватную окраску ⲡⲧⲏⲣϥ. В первой части «не имеет самого себя» несколько ослабляет прямую лексическую связь с повторённым ⲣϭⲣⲱϩ («испытывать недостаток, нуждаться»). В финале «во всём» двусмысленно: по-русски оно может значить «во всём [нуждается]», тогда как коптский оборот обозначает полноту недостатка — «во всех отношениях».'
  naturalness: 'Предлагаемая правка сохраняет краткий афористический строй и делает параллелизм двух употреблений глагола заметнее: «кому недостаёт …, тому недостаёт …». «Во всех отношениях» естественно и недвусмысленно в современном литературном русском.'
