  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: ru
  text: 'Иисус сказал: «Блаженны[a] бедные[b], ибо царство небес[c] — ваше».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Блаженны» можно также передать как «счастливы» или «как счастливы»; выбранная форма сохраняет характер традиционного макаризма.
    reason: lexical_alternative
  - marker: b
    text: Коптское слово буквально имеет форму «бедняк» в единственном числе, но употреблено обобщённо. В тексте нет слов «духом».
    reason: source_form_and_ambiguity
  - marker: c
    text: 'Буквально — «царство небес»: слово «небеса» в коптском тексте стоит во множественном числе. ⲙⲛⲧⲣⲣⲟ может также означать «царствование» или «царскую власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная и естественная передача коптского ввода прямой речи; следующий ϫⲉ выражен двоеточием и кавычками.
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Блаженны
  rationale: Сохраняет форму макаризма и оценочный смысл греческого заимствования; варианты «счастливы» и «как счастливы» возможны, но менее точно передают торжественный характер изречения.
- source_word: ⲡϩⲏⲕⲉ
  choice: бедные
  rationale: Хотя коптская форма в нормализованном тексте имеет единственное число и может означать «бедняк», здесь она употреблена обобщённо; русское множественное число согласуется с «блаженны» и обращением «ваше».
- source_word: ϫⲉ
  choice: ибо
  rationale: Вторая частица ϫⲉ вводит основание макаризма; «ибо» кратко и ясно передаёт причинную связь в достойном литературном регистре.
- source_word: ⲧⲱⲧⲛ
  choice: ваше
  rationale: 'Независимое местоимение второго лица множественного числа образует именное высказывание о принадлежности: «Царство небес — ваше».'
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Слово допускает значения «царская власть», «царствование» и «царство». В контексте Евангелия от Фомы «Царство» естественно охватывает как власть, так и реальность, которой можно обладать или в которую можно войти.
- source_word: ⲛⲡⲡⲉ
  choice: небес
  rationale: Родительный падеж множественного числа сохраняет явное число коптского выражения и не заменяет его формой «небесное» или единственным числом «неба».
theological_decisions:
- issue: Характер бедности
  choice: бедные
  alternative: бедные духом
  rationale: В коптском тексте нет уточнения «духом»; его добавление гармонизировало бы изречение с Мф 5:3 и устранило бы значимое различие между свидетельствами.
- issue: Передача ⲙⲛⲧⲣⲣⲟ
  choice: Царство
  alternative: царствование / царская власть
  rationale: Выбрано более ёмкое русское соответствие, не сводящее выражение ни только к территории, ни только к абстрактному осуществлению власти.
- issue: Адресат обетования
  choice: Царство небес — ваше
  alternative: им принадлежит Царство небес
  rationale: Сохраняется прямое обращение во втором лице множественного числа, отличающее данную формулировку от перехода к третьему лицу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом изречения. Инверсия «Царство небес — ваше» сохраняет смысл коптской именной конструкции и остаётся естественной по-русски. Заглавная буква в слове «Царство» подчёркивает устойчивое обозначение эсхатологической и богословской реальности, не уточняя её конфессионально.
