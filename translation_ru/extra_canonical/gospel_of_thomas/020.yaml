base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: ru
  text: 'Ученик сказал Иисусу: «Скажи нам, чему подобно Царство Небес[a]». Он сказал ему: «Оно подобно горчичному зерну[b]. Оно меньше всех семян, но, упав на возделанную землю[c], выпускает большую ветвь и становится укрытием[d] для птиц неба».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «царство небес». Коптский текст здесь не говорит «Царство Божье».'
    reason: source_distinction
  - marker: b
    text: 'Буквально: «зерну горчицы».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на землю, которую возделывают», то есть на обработанную, возделанную почву.'
    reason: cultural_note
  - marker: d
    text: 'Или: «тенью», «покровом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Скажи нам
  rationale: Повелительная форма со значением «сказать кому-либо» естественно передаётся по-русски как «скажи нам».
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: Царство Небес
  rationale: ⲙⲛⲧⲣⲣⲟ допускает значения царства и царствования, а ⲡⲡⲉ — неба/небес; устойчивое «Царство Небес» сохраняет небесную формулу источника и не заменяет её «Царством Божьим».
- source_word: ⲉⲛⲓⲙ
  choice: чему подобно
  rationale: Вопросительное выражение обозначает «подобно чему?/каково?»; выбран естественный русский оборот, согласованный с последующей притчей.
- source_word: ⲁⲟⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  choice: горчичному зерну
  rationale: Буквально речь идёт о зерне горчицы; русский оборот «горчичное зерно» точен и идиоматичен.
- source_word: ⲛⲧⲟⲥ ⲥⲃⲟⲕ ⲡⲁⲣⲁⲡϭⲣⲟϭ ⲧⲏⲣⲛⲧⲟⲟⲩ
  choice: Оно меньше всех семян
  rationale: Сравнительная конструкция имеет превосходный смысл; формулировка сохраняет грамматическую форму сравнения источника.
- source_word: ⲉϫⲛⲡⲕⲁϩ ⲉⲧⲉⲣⲉⲛⲧⲟⲟⲩⲣϩⲱⲃ ⲉⲛⲧⲟϥ
  choice: на возделанную землю
  rationale: Буквально это земля, над которой трудятся; «возделанная земля» ясно передаёт сельскохозяйственную идиому.
- source_word: ϣⲁⲣⲉⲛⲧⲟϥⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛⲟⲩⲛⲟϭ ⲛⲧⲁⲣ
  choice: выпускает большую ветвь
  rationale: Глагольное выражение означает произведение или выпускание наружу, а ⲧⲁⲣ — «ветвь, побег», не «растение».
- source_word: ⲥⲕⲉⲡⲏ
  choice: укрытием
  rationale: Слово обозначает укрытие, покров или тень; «укрытие» лучше всего сочетается с образом птиц, не устраняя иных оттенков.
- source_word: ϩⲁⲗⲏⲧ ⲛⲡⲡⲉ
  choice: небесных птиц
  rationale: Буквально «птицы неба»; «небесные птицы» сохраняет компактность и возвышенный тон.
theological_decisions:
- issue: Наименование царства
  choice: Царство Небес
  alternative: Царство Божье
  rationale: Коптский текст прямо говорит о «царстве небес»; замена на синоптическую формулу «Царство Божье» была бы конфессионально и интертекстуально обусловленным уточнением, которого источник не делает.
translation_notes:
  register: Современный литературный русский с достоинством притчевой речи. Синтаксис сделан ясным для широкого читателя; сохранены конкретные образы зерна, возделанной земли, большой ветви и укрытия. «Небесных птиц» выбрано вместо более разговорного «птиц в небе» ради компактности и стилистического единства.
