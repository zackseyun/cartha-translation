- from: 'Ученики сказали Иисусу: «Скажи нам, чему подобно Царство Небес[a]». Он сказал им: «Оно подобно горчичному зерну[b]. Оно меньше всех семян, но, упав на возделанную землю[c], выпускает большую ветвь и становится укрытием[d] для небесных птиц».'
