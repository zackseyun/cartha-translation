base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: ru
  text: '⟨Они увидели⟩[a] самарянина, который нёс ягнёнка и шёл в Иудею. Он сказал своим ученикам:


    — А тот — возле ягнёнка?[b]


    Они ответили ему:


    — Чтобы убить его и съесть.


    Он сказал им:


    — Пока ягнёнок жив, тот не станет его есть. Но если убьёт его и тот станет трупом — тогда съест.


    Они сказали:


    — Иначе он не сможет этого сделать.


    Он сказал им:


    — И вы сами ищите себе место в покое, чтобы вам не стать трупом и чтобы они не съели вас.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рукописи здесь отсутствует главный глагол: буквально фраза начинается словами «к самарянину». Для связности издатели восстанавливают «они увидели» (ⲁⲩⲛⲁⲩ).'
    reason: textual_variant
  - marker: b
    text: 'Коптская реплика предельно эллиптична: буквально — «Тот возле ягнёнка?» Ответ учеников показывает, что они поняли её как вопрос о намерении человека.'
    reason: lexical_alternative
  - marker: c
    text: 'В коптском стоит активная форма третьего лица множественного числа: «и они съедят вас», а не безличное или страдательное выражение.'
    reason: register_note
lexical_decisions:
- source_word: ⟨ⲁⲩⲛⲁⲩ⟩
  choice: ⟨Они увидели⟩
  rationale: Главный глагол восстановлен издателями для завершения синтаксиса; угловые скобки сохраняют прозрачность текстологического решения.
- source_word: ⲟⲩϩⲓⲉⲓⲃ
  choice: ягнёнок
  rationale: Обычное современное обозначение молодого барашка; естественно в данном повествовательном контексте.
- source_word: ⲡⲏ ⲙⲡⲕⲱⲧⲉ ⲙⲡⲉϩⲓⲉⲓⲃ
  choice: А тот — возле ягнёнка?
  rationale: Сохранена эллиптичность коптской реплики и пространственное значение ⲕⲱⲧⲉ; смысл не развёрнут в более определённое «зачем он несёт ягнёнка?».
- source_word: ⲡⲧⲱⲙⲁ
  choice: труп
  rationale: Греческое заимствование πτῶμα обозначает мёртвое тело; «труп» сохраняет резкий образ и словесную связь между ягнёнком и учениками.
- source_word: ϣⲁ
  choice: сможет
  rationale: Передаёт значение способности; форма Future I отражена будущим временем «не сможет».
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: покой
  rationale: Сохраняет ёмкое значение отдыха, упокоения и конечного состояния, не навязывая одной богословской интерпретации.
theological_decisions:
- issue: Эллиптический вопрос о человеке и ягнёнке
  choice: А тот — возле ягнёнка?
  alternative: Зачем тот человек несёт ягнёнка?
  rationale: Выбранный вариант сохраняет загадочную неполноту исходной реплики; ответ учеников позволяет читателю вывести подразумеваемый вопрос о намерении человека.
- issue: Значение «покоя»
  choice: место в покое
  alternative: место упокоения
  rationale: «Покой» оставляет открытыми как экзистенциальное, так и эсхатологическое прочтение и не сужает выражение до смерти или загробного состояния.
- issue: Образ становления трупом
  choice: чтобы вам не стать трупом
  alternative: чтобы вы не стали мёртвыми телами
  rationale: Сохранены единственное число предикативного существительного и намеренно резкая параллель с убитым ягнёнком.
translation_notes:
  register: Современный литературный русский язык с краткими репликами, передающими устный и загадочный характер изречения. Архаизмы исключены; резкие повторяющиеся образы «есть — труп — съесть» сохранены. Для ясности в одной реплике повторено «ягнёнок», где коптский использует местоимение.
