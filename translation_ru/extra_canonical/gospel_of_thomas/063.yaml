base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: ru
  text: 'Иисус сказал: «Был один богатый человек, у которого было много денег[a]. Он сказал: „Я использую свои деньги, чтобы сеять, жать[b], сажать и наполнять свои хранилища[c] урожаем, чтобы ни в чём не нуждаться“. Такие мысли были у него в сердце. И в ту ночь он умер. У кого есть уши, пусть услышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲭⲣⲏⲙⲁ может означать деньги, имущество или богатство.
    reason: lexical_alternative
  - marker: b
    text: В рукописи слово «жать» частично повреждено; одна буква восстановлена издателями по контексту.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Или: «амбары», «житницы». Выбрано более общее «хранилища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: богатый
  rationale: Прямое соответствие греческому заимствованию πλούσιος; сохраняет социально-экономический смысл без дополнительного толкования.
- source_word: ⲭⲣⲏⲙⲁ
  choice: деньги
  rationale: В данном контексте конкретное «деньги» естественно сочетается с намерением употребить их для хозяйственной деятельности; более широкие значения отмечены в сноске.
- source_word: ⲣⲭⲣⲱ
  choice: пущу … в дело
  rationale: Естественная русская передача значения «использую» применительно к деньгам; не уточняет способ вложения.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: чтобы
  rationale: Союз вводит целевую конструкцию; передача «чтобы» сохраняет логику намерения богача.
- source_word: ϫⲟ / ⲱϩⲥ / ⲧⲱⲱϭⲉ
  choice: сеять / жать / сажать
  rationale: Сохранена необычная последовательность трёх сельскохозяйственных действий, включая «сажать», без гармонизации с Лк 12 и без замены на архитектурное «строить».
- source_word: ⲁϩⲟ
  choice: хранилища
  rationale: Общее слово охватывает амбары, житницы и склады, не сужая значение существительного.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: урожай
  rationale: В контексте земледелия и наполнения хранилищ «урожай» естественнее буквальных «плодов» и охватывает сельскохозяйственную продукцию.
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: ни в чём не буду нуждаться
  rationale: Точно передаёт отрицательную конструкцию «не испытывать нужды ни в чём» и звучит естественно по-русски.
- source_word: ⲛⲁⲉⲓ … ⲙⲉⲉⲩⲉ ⲉⲣⲟⲟⲩ
  choice: такие мысли
  rationale: Множественное число сохраняет грамматику рукописи и соотносит фразу с перечисленными замыслами.
- source_word: ⲡⲉⲧⲉⲩⲙⲙⲁϫⲉ ⲙⲙⲟϥ ⲙⲁⲣⲉϥⲥⲱⲧⲙ
  choice: У кого есть уши, пусть услышит
  rationale: Первая часть оставлена без добавления «чтобы слышать»; повелительное «пусть услышит» передаёт отдельную заключительную клаузу.
theological_decisions:
- issue: Связь с притчей о безумном богаче в Лк 12:16–21
  choice: Не гармонизировать текст с Лукой
  alternative: Передать сельскохозяйственное «сажать» как «строить» и ввести привычные синоптические формулы
  rationale: Коптский текст имеет собственную лексику и более краткую развязку; перевод сохраняет его отличия и не добавляет отсутствующую богословскую оценку персонажа.
- issue: Причина смерти богача
  choice: Сообщить только факт смерти в ту ночь
  alternative: Представить смерть как прямо названный Божий суд
  rationale: Источник не называет действующее лицо и не объясняет причину смерти, поэтому богословский вывод не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого изречения. Речь богача передана ясно и естественно, но намеренная цепочка сельскохозяйственных глаголов и резкий переход к его смерти сохранены. Архаизмы и конфессионально окрашенные добавления исключены.
