revisions:
- from: 'Иисус сказал: «Жил один богатый человек, у которого было много денег[a]. Он сказал: „Я пущу свои деньги в дело, чтобы сеять и жать[b], сажать и наполнять свои хранилища[c] урожаем, — тогда я ни в чём не буду нуждаться“. Такие мысли были у него в сердце. И в ту ночь он умер. У кого есть уши, пусть услышит».'
  to: 'Иисус сказал: «Был один богатый человек, у которого было много денег[a]. Он сказал: „Я использую свои деньги, чтобы сеять, жать[b], сажать и наполнять свои хранилища[c] урожаем, чтобы ни в чём не нуждаться“. Такие мысли были у него в сердце. И в ту ночь он умер. У кого есть уши, пусть услышит».'
  rationale: 'Исправлена передача второго целевого союза: «чтобы ни в чём не нуждаться» сохраняет финальное значение ϩⲓⲛⲁ, не превращая намерение персонажа в простое последствие. «Использую свои деньги» снимает необязательную конкретизацию. Остальная формулировка и набор сносок сохранены, поскольку они верны исходнику и структурно корректны.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно сохраняет последовательность сельскохозяйственных действий, множественное число в «Такие мысли», отсутствие объяснения смерти и краткую заключительную формулу. Однако «— тогда я ни в чём не буду нуждаться» передаёт второе ϩⲓⲛⲁ как простое следствие, тогда как оно, как и предыдущее ϫⲉⲕⲁⲁⲥ, вводит целевую конструкцию. Следует передать эту цель прямо: «чтобы ни в чём не нуждаться».'
  naturalness: Текст звучит современно и литературно. «Использую свои деньги» чуть нейтральнее и точнее, чем идиома «пущу свои деньги в дело», которая может подразумевать именно инвестирование, не выраженное прямо исходником. Цепочка инфинитивов после «чтобы» естественна в русском и сохраняет лаконизм оригинала.
  terminology: «Богатый», «деньги», «сеять», «жать», «сажать», «хранилища», «урожай» и «ни в чём не нуждаться» адекватны коптскому тексту. Сноски корректно отмечают полисемию ⲭⲣⲏⲙⲁ, реставрацию в ⲱϩⲥ и возможные значения ⲁϩⲟ.
  issues:
  - severity: medium
    issue: Второй целевой союз передан как следствие («тогда»).
    rationale: 'Коптское ϩⲓⲛⲁ перед ⲛ̄ⲛⲉ... вводит цель: богач намерен наполнить хранилища, чтобы ни в чём не нуждаться. «Тогда» ослабляет эту финальную связь.'
  - severity: low
    issue: «Пущу свои деньги в дело» несколько конкретизирует значение глагола «использовать».
    rationale: ⲣⲭⲣⲱ означает «употребить, использовать». Русская идиома допустима, но может вызвать более узкую ассоциацию с капиталовложением; нейтральное «использую» ближе к исходнику.
