    issue: Добавлено направление «наружу»
    rationale: Коптское выражение не требует указания на движение изнутри вовне; при этом прямо содержит локатив «в вас». Добавление «наружу» сужает и меняет образ оригинала.
  - severity: low
    issue: Первое примечание повторяет добавленный смысл
    rationale: Формулировки «дадите возникнуть тому, что внутри вас» и «произведёте» не вполне отражают синтаксис, где «в вас» относится к проявлению/порождению; примечание следует согласовать с исправленным переводом.
