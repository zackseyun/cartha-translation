revisions:
- from: 'Иисус сказал: «Когда вы изведёте наружу то, что внутри вас,[a] оно — то, что у вас есть, — спасёт вас.[b] Иначе внутри вас — нищета.[c][d] То, чего у вас нет внутри, в самой глубине, убьёт вас».[e][f]'
  to: 'Иисус сказал: «Когда вы дадите проявиться в себе тому, что у вас есть, оно спасёт вас.[a][b] Иначе в вас — нищета.[c][d] То, чего у вас нет внутри, в глубине, убьёт вас».[e][f]'
  rationale: Исправлено только небезопасное добавление пространственного движения «наружу». «Дадите проявиться в себе» передаёт причинение возникновения/проявления и коптскую внутреннюю локализацию. Неопределённость референта, резкая образность «нищеты» и повторный акцент на внутреннем сохранены; сноски приведены в соответствие с текстом.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальное «изведёте наружу» необоснованно вводит направление вовне: коптское ϩⲛⲛⲧⲱⲧⲛ относится к действию «дать возникнуть / вывести к проявлению» и прямо задаёт локализацию «в вас». Более точное «дадите проявиться в себе» сохраняет каузативно-проявительный смысл без добавления внешнего движения. Остальные ключевые противопоставления — «спасёт / убьёт» и буквальная «нищета» — переданы верно.'
  naturalness: «Изведёте наружу то, что внутри вас» звучит несколько архаично и одновременно создаёт смысловое напряжение с «внутри вас». Переработанная формулировка остаётся афористичной, литературной и понятной современному читателю. «В глубине» в последнем члене сохраняет повторный внутренний акцент, не перегружая фразу.
  terminology: Имя «Иисус», «спасёт», «нищета» и «убьёт» уместны. Референт «то» не следует уточнять богословски; в исправленном тексте он остаётся неопределённым.
