base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: ru
  text: 'Иисус сказал: «Когда вы дадите проявиться в себе тому, что у вас есть, оно спасёт вас.[a][b] Иначе в вас — нищета.[c][d] То, чего у вас нет внутри, в глубине, убьёт вас».[e][f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «дадите возникнуть / приведёте к бытию это в себе»; возможны также переводы «проявите в себе» или «произведёте в себе».'
    reason: lexical_alternative
  - marker: b
    text: Слово может также означать «избавит»; перевод «спасёт» поддерживается противопоставлением слову «убьёт».
    reason: lexical_alternative
  - marker: c
    text: Частица переведена как «иначе»; возможны также «или же» и, при иной трактовке связи, «напротив».
    reason: alternative_reading
  - marker: d
    text: В источнике буквально «нищета», а не более истолковывающее «недостаток» или «пустота».
    reason: cultural_note
  - marker: e
    text: 'В строке 33 рукопись повреждена: часть букв в форме «убьёт» восстановлена издателем, однако смысл чтения считается надёжным.'
    reason: lacuna_or_restoration
  - marker: f
    text: Слово «в глубине» передаёт отдельное выражение со значением «внутри, во внутренней части» и сохраняет двойной акцент коптского текста на внутреннем.
    reason: dialect_note
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ
  choice: когда
  rationale: Вводит общее условие с временным оттенком; «когда» сохраняет краткость и не превращает высказывание в однократное событие.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ
  choice: изведёте наружу
  rationale: Передаёт каузативный смысл «дать возникнуть / вывести к проявлению», сохраняя направленность из внутреннего вовне.
- source_word: ϩⲛⲛⲧⲱⲧⲛ
  choice: внутри вас
  rationale: Контекст и повторное обозначение внутренности указывают на внутреннюю, а не групповую локализацию.
- source_word: ⲡⲁⲓ
  choice: оно
  rationale: Местоименно указывает на уже названное «то, что внутри вас», не конкретизируя неоднозначный референт.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛⲛⲧⲟϥ
  choice: то, что у вас есть
  rationale: Экзистенциальная конструкция с дательным естественно выражает обладание.
- source_word: ⲧⲟⲩϫⲟⲛ
  choice: спасёт
  rationale: Антитеза с «убьёт» поддерживает сильное значение спасения, хотя возможен более общий смысл избавления.
- source_word: ⲡⲏ
  choice: иначе
  rationale: Передаёт разъединительный переход к противоположному исходу, не сглаживая трудную синтаксическую связь.
- source_word: ⲙⲛⲧⲁⲁⲛⲟⲛ
  choice: нищета
  rationale: Сохраняет резкий буквальный образ абстрактного существительного и не заменяет его толкующим «недостатком».
- source_word: ϩⲛⲧⲏⲛⲉ
  choice: в самой глубине
  rationale: Явно воспроизводит повторный акцент на внутренности, избегая ненормативного для русского нагромождения «внутри, внутри».
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: убьёт
  rationale: Прямо передаёт каузатив от «умирать» и сохраняет резкую антитезу со спасением.
theological_decisions:
- issue: Что именно находится внутри и спасает
  choice: 'Референт оставлен неопределённым: «то, что внутри вас» / «то, что у вас есть».'
  alternative: Уточнить как свет, знание, Царство или божественное начало.
  rationale: Коптский текст не называет референт; догматическая конкретизация устранила бы намеренную неоднозначность.
- issue: Смысл «нищеты»
  choice: Сохранён буквальный образ «нищета».
  alternative: Передать как внутренняя пустота, недостаток или духовная бедность.
  rationale: Источник не объясняет природу нищеты, поэтому истолковывающий перевод был бы конфессионально или философски нагружен.
translation_notes:
  register: Современный литературный русский, сжатый и афористичный. «Изведёте наружу» выбрано как несколько возвышенное, но понятное выражение, соответствующее достоинству и необычности речения. Тире проясняют приложение, не определяя, чем именно является внутреннее содержание.
