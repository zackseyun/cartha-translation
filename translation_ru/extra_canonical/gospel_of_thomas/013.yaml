base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: ru
  text: 'Иисус сказал Своим ученикам: «Сравните Меня с кем-нибудь и скажите Мне, на кого Я похож».


    Симон Пётр сказал Ему: «Ты подобен праведному ангелу».


    Матфей сказал Ему: «Ты подобен человеку — философу, человеку разумному»[a].


    Фома сказал Ему: «Учитель, мои уста никак не смогут сказать, на кого Ты похож».


    Иисус сказал: «Я не твой учитель, потому что ты выпил и опьянел от бурлящего источника[b], который Я Сам отмерил[c]».


    И Он взял его с Собой, отошёл и сказал ему три слова[d].


    Когда Фома пришёл к своим товарищам, они спросили его: «Что сказал тебе Иисус?»


    Фома ответил им: «Если я скажу вам хотя бы одно из слов, которые Он сказал мне, вы поднимете камни и бросите их в меня, а из камней выйдет огонь и сожжёт вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человеку — философу, человеку сердца (ума)»; последнее выражение означает человека разумного, понимающего.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «бурлящий», звукоподражательное; возможны также переводы «журчащий» или «клокочущий».
    reason: lexical_alternative
  - marker: c
    text: «Отмерил» можно также понять как «уделил» или, применительно к воде, «зачерпнул». Необычный образ исходного текста сохранён.
    reason: lexical_alternative
  - marker: d
    text: «Три слова» можно понимать и как «три изречения». Сам текст не сообщает, что именно было сказано.
    reason: ambiguity
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: Сравните Меня с кем-нибудь
  rationale: Глагол ⲧⲟⲛⲧ выражает сопоставление; добавление «с кем-нибудь» естественно связывает повеление с последующим вопросом «на кого Я похож».
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: праведному ангелу
  rationale: Сочетание греческих заимствований здесь обозначает небесное существо с нравственной характеристикой; «вестник» было бы неоправданно расплывчато.
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: человеку — философу, человеку разумному
  rationale: Сохранена аппозитивная структура и повтор слова «человек»; идиома «человек сердца/ума» передана понятным русским «человек разумный».
- source_word: ⲡⲥⲁϩ
  choice: Учитель
  rationale: Обычное обращение к наставнику; «господин» или «владыка» внесли бы отсутствующий в слове оттенок.
- source_word: ⲧⲁⲧⲁⲡⲣⲟ ⲛⲁϣϣⲁⲡϥ ⲁⲛ
  choice: мои уста никак не смогут
  rationale: Сохранён телесный образ «уста», усиленное отрицание и будущее значение формы с ⲛⲁ-.
- source_word: ⲡⲡⲏⲅⲏ ⲉⲧⲃⲣⲃⲣⲉ
  choice: бурлящего источника
  rationale: «Источник» соответствует πηγή, а «бурлящий» передаёт звукоподражательный характер ⲃⲣⲃⲣ без чрезмерного истолкования.
- source_word: ⲁⲛⲟⲕ ⲛⲧⲁⲉⲓϣⲓⲧⲥ
  choice: который Я Сам отмерил
  rationale: «Отмерил» сохраняет необычную метафору раздачи воды, а «Сам» передаёт подчёркнутое независимое местоимение ⲁⲛⲟⲕ.
- source_word: ⲛϣⲟⲙⲧ ⲛϣⲁϫⲉ
  choice: три слова
  rationale: Формально соответствует исходному выражению и не решает заранее, были ли это отдельные слова или три изречения; альтернатива дана в примечании.
- source_word: ⲧⲉⲧⲛⲁϥⲓⲱⲛⲉ ⲛⲧⲉⲧⲛⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: вы поднимете камни и бросите их в меня
  rationale: Переданы оба последовательных действия исходного текста — поднять камни и бросить их, — а не только общий образ побиения камнями.
