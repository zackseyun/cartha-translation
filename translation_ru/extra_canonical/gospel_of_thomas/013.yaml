  rationale: Текст оставляет природу и значение огня неразъяснёнными, поэтому перевод не должен устранять эту напряжённость.
- issue: Содержание трёх слов Иисуса
  choice: Оставлено нераскрытым
  alternative: Связать их с конкретной тайной доктриной
  rationale: Рукопись содержания не сообщает, и конфессиональная или эзотерическая конкретизация не имеет текстового основания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. В прямой речи сохранены краткость и загадочность коптского текста. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой; это графическое решение не добавляет к тексту титулов или догматических формул.
