base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: ru
  text: 'Ученики сказали ему: «В какой день наступит покой умерших и в какой день придёт новый мир?»


    Он сказал им: «Покой[a], которого вы ожидаете[b], пришёл, но вы сами[c] не знаете его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В коптском здесь стоит указательное местоимение женского рода, грамматически отсылающее к слову «покой».
    reason: Сохраняет точную связь ответа с первым вопросом учеников.
  - marker: b
    text: Коптское выражение буквально связано с тем, чтобы «смотреть вперёд»; по смыслу — «ожидать».
    reason: Отмечает образность исходной идиомы и её естественную передачу по-русски.
  - marker: c
    text: 'Независимое местоимение перед глагольной формой подчёркивает подлежащее: «вы сами».'
    reason: Передаёт эмфатическую конструкцию коптского текста.
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: в какой день
  rationale: Передаёт прямой вопрос о конкретном дне, не обобщая его до «когда».
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: покой
  rationale: Естественный и достаточно буквальный русский эквивалент греческого заимствования со значением покоя или отдохновения; не уточняет богословский смысл сверх текста.
- source_word: ϣⲱⲡⲉ
  choice: наступит
  rationale: При существительном «покой» естественно выражает наступление события или состояния, соответствуя значению «произойти, настать».
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: новый мир
  rationale: Прямо передаёт сочетание существительного ⲕⲟⲥⲙⲟⲥ «мир» с прилагательным ⲃⲣⲣⲉ «новый».
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: ожидаете
  rationale: Естественно передаёт коптскую идиому «смотреть вперёд», то есть ожидать или предвкушать.
- source_word: ⲧⲏ
  choice: покой
  rationale: Женское указательное местоимение в коптском грамматически отсылает к существительному ⲁⲛⲁⲡⲁⲩⲥⲓⲥ; повтор существительного по-русски ясно сохраняет эту связь.
- source_word: ⲁⲥⲉⲓ
  choice: пришёл
  rationale: Передаёт перфектную форму «пришёл / уже явился», не добавляя отсутствующего в тексте отдельного наречия «уже».
theological_decisions:
- issue: Будущее ожидание и уже наступившая реальность
  choice: «Покой, которого вы ожидаете, пришёл»
  alternative: «То, чего вы ожидаете, пришло»
  rationale: Перфект ⲁⲥⲉⲓ представляет ожидаемый покой как уже пришедшую реальность, однако перевод не объясняет, в каком именно богословском смысле это произошло. Явная отсылка к «покою» сохраняется по грамматике коптского текста.
- issue: Значение «покоя умерших»
  choice: оставить выражение без поясняющего толкования
  alternative: истолковать как воскресение, спасение или загробное блаженство
  rationale: Источник не определяет здесь природу этого покоя; конкретизация устранила бы подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным повествовательным строем. «Наступит покой» выбрано как естественная русская формула в вопросе, тогда как «покой… пришёл» в ответе сохраняет повтор исходного глагола движения и парадоксальность изречения. Наречие «уже» не добавлено, поскольку отдельного соответствующего слова в коптском нет.
