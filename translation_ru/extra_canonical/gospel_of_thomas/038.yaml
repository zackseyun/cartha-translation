  naturalness: Текст звучит естественно и литературно. «Много раз вы желали» и «настанут дни» уместны для сдержанного регистра изречения. Замена заключительного «но не найдёте» на «и не найдёте Меня» остаётся естественной по-русски и ближе к синтаксису оригинала.
