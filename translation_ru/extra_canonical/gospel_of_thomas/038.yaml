base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: ru
  text: 'Иисус сказал: «Много раз вы желали услышать эти слова[a], которые Я говорю вам, и нет у вас никого другого, от кого вы могли бы услышать их[b]. Настанут дни[c], когда вы будете искать Меня[d] и не найдёте Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально в коптском сначала стоит «это слово» (единственное число), после чего речь продолжается во множественном числе — «их». В тексте число согласовано ради естественного русского звучания.
    reason: lexical_alternative
  - marker: b
    text: Выражение «нет у вас никого другого, от кого…» передаёт коптскую конструкцию с ⲕⲉⲟⲩⲁ («другой») и ⲛ̄ⲧⲟϥ («от него»), которая здесь имеет относительный смысл «от кого».
    reason: dialect_note
  - marker: c
    text: 'Буквально: «есть дни, которые настанут» — коптский оборот, выражающий будущее существование или наступление.'
    reason: cultural_note
  - marker: d
    text: Ср. Ин. 7:34; 8:21; 13:33, где встречается сходный мотив. Формулировка Евангелия от Фомы сохранена самостоятельно и не приведена в соответствие с каноническими текстами.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: много раз
  rationale: Передаёт обычное значение коптского выражения и сохраняет прямой, несколько отрывистый ритм изречения.
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: желали
  rationale: Греческое заимствование со значением «желать, стремиться»; нейтральное «желали» не усиливает эмоциональный оттенок.
- source_word: ⲉⲥⲱⲧⲙ
  choice: услышать
  rationale: Сохраняет основное слуховое значение и не привносит толкований «внимать» или «повиноваться».
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ (с последующим ⲛⲛⲧⲟⲟⲩ)
  choice: эти слова
  rationale: В коптском сначала стоит единственное число «это слово/изречение», а затем множественное местоимение «их»; основной текст согласован по числу ради естественного русского звучания, а переход отмечен в сноске.
- source_word: ⲉⲧⲉⲣⲉ … ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: которые Я говорю вам
  rationale: Настоящее время передаёт длительный аспект и непосредственность речи.
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ
  choice: нет у вас никого другого
  rationale: Естественно передаёт отрицательную конструкцию обладания с выражением «другой человек».
- source_word: ⲛ̄ⲧⲟϥ
  choice: от кого
  rationale: После неопределённого обозначения другого лица местоименная конструкция имеет относительный смысл «от кого».
- source_word: ⲟⲩⲛ ϩⲉⲛϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: настанут дни
  rationale: Краткая и естественная передача коптской конструкции будущего существования, буквально говорящей о днях, которые возникнут или наступят.
- source_word: ⲛⲧⲉ … ϣⲓⲛⲉ ⲛⲥⲁⲁⲛⲟⲕ
  choice: когда вы будете искать Меня
  rationale: Временная конструкция передана придаточным с «когда», а продолженный поиск — формой «будете искать».
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ ⲁⲛ ⲉⲁⲛⲟⲕ
  choice: но не найдёте
  rationale: Прямо передаёт будущее отрицание глагола «найти»; союз «но» естественно выражает подразумеваемое противопоставление поиску.
theological_decisions:
- issue: Смысл будущего отсутствия Иисуса
  choice: 'Оставлен без уточнения: «будете искать Меня, но не найдёте»'
  alternative: Истолковать как смерть, вознесение, духовное сокрытие или эсхатологическое отсутствие
  rationale: Само изречение не объясняет причины или природы отсутствия; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и доступным синтаксисом. Сохранена прямая речь и лаконичная тональность изречения; архаизмы исключены. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятому русскому библейскому издательскому регистру и не меняют смысла исходного текста.
