base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: ru
  text: 'Иисус сказал: «Ангелы и пророки придут к вам и дадут вам то, что принадлежит вам[a]. А вы, в свою очередь, дайте им то, что у вас в руках[b], и скажите себе: „В какой день они придут и заберут то, что принадлежит им?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что у вас есть» (ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ).'
    reason: lexical_alternative
  - marker: b
    text: В коптском выражении «у вас в руках» употреблён региональный, ликопольский вариант суффикса второго лица множественного числа ⲧⲏⲛⲉ вместо стандартного саидского ⲧⲏⲩⲧⲛ.
    reason: dialect_note
lexical_decisions:
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: то, что принадлежит вам
  rationale: Оборот с ⲟⲩⲛⲧⲁ= буквально обозначает то, что адресаты имеют. Формулировка «принадлежит вам» естественно передаёт обладание и сохраняет смысловое соответствие заключительному «принадлежит им».
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: то, что у вас в руках
  rationale: Предложное выражение ⲛ̄ⲧⲟⲟⲧ= означает «в руке/руках, при ком-либо». Перевод сохраняет конкретный образ рук, не сводя его к общему «то, что у вас есть».
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: в свою очередь
  rationale: Эмфатическое местоименное выражение подчёркивает ответное, взаимное действие адресатов.
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: то, что принадлежит им
  rationale: Независимое притяжательное местоимение ⲡⲱⲟⲩ прямо означает «их, принадлежащее им».
- source_word: ⲛ̄ⲁⲅⲅⲉⲗⲟⲥ ⲙⲛ̄ⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: ангелы и пророки
  rationale: В рукописном чтении обе группы снабжены показателями множественного числа; поэтому сохранено множественное число вопреки ошибочному нормализованному чтению первого существительного как единственного.
theological_decisions:
- issue: Характер обмена между адресатами, ангелами и пророками
  choice: «то, что принадлежит вам» и «то, что принадлежит им»
  alternative: «то, что у вас есть» и «их»
  rationale: Перевод подчёркивает заложенную в тексте взаимность, но не уточняет, что именно передаётся, и тем самым не навязывает богословского толкования предмета обмена.
- issue: Значение «того, что у вас в руках»
  choice: Сохранён буквальный образ без поясняющей интерпретации
  alternative: Передать как духовные дары, учение или земное имущество
  rationale: Источник не называет предметы и допускает разные прочтения; конкретизация необоснованно сняла бы смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью прямой речи. «Отдадут» и «отдайте» выбраны вместо нейтрального «дадут», чтобы естественно выразить взаимное возвращение принадлежащего сторонам, не определяя природу передаваемого. Формула «в какой день» сохраняет необычную временную постановку вопроса оригинала.
