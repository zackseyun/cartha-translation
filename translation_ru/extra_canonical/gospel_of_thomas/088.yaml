- from: 'Иисус сказал: «Ангелы и пророки придут к вам и отдадут вам то, что принадлежит вам[a]. А вы, в свою очередь, отдайте им то, что у вас в руках[b], и скажите себе: „В какой день они придут и заберут то, что принадлежит им?“»'
  to: 'Иисус сказал: «Ангелы и пророки придут к вам и дадут вам то, что принадлежит вам[a]. А вы, в свою очередь, дайте им то, что у вас в руках[b], и скажите себе: „В какой день они придут и заберут то, что принадлежит им?“»'
  rationale: 'Заменены «отдадут / отдайте» на «дадут / дайте», чтобы не привносить представление о возврате собственности. Остальная формулировка и оба якоря сносок сохранены: они точны, естественны и соответствуют рукописному коптскому чтению.'
