base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: ru
  text: 'Иисус сказал: «Люби своего брата, как свою душу[a], и храни его[b], как зеницу своего ока[c]».[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Словом «душа» передано ⲯⲩⲭⲏ (греч. ψυχή), которое может также означать «жизнь» или «сам человек».
    reason: lexical_alternative
  - marker: b
    text: В рукописи стоит ⲙ̄ⲙⲟϥ — прямое дополнение «его», а в нормализованном тексте — ⲛⲛⲧⲟϥ, «для него». В обоих случаях общий смысл — беречь или защищать брата.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «как зрачок твоего глаза». «Зеница ока» — традиционное русское обозначение зрачка, сохраняющее тот же образ.'
    reason: lexical_alternative
  - marker: d
    text: Ср. Втор. 32:10; Пс. 16:8; Притч. 7:2.
    reason: cross_reference
  - marker: e
    text: Сравнительный оборот в рукописи записан как ⲛ̄ⲑⲉ, а в нормализованном тексте — как ⲛⲡϩⲉ; это диалектные формы со значением «как, подобно».
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Стандартная коптская формула введения прямой речи ⲡⲉϫⲉ с названным субъектом естественно передаётся русским повествовательным оборотом.
- source_word: ⲙⲉ
  choice: люби
  rationale: При личном дополнении глагол выражает любовь; повелительное «люби» естественно и точно передаёт этический призыв.
- source_word: ⲡⲉⲕⲥⲟⲛ
  choice: своего брата
  rationale: Основное значение ⲥⲟⲛ — «брат»; возвратное «своего» соответствует отношению к субъекту повеления и звучит естественно по-русски.
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: как
  rationale: Обе формы являются диалектными вариантами сравнительного оборота со значением «как, подобно».
- source_word: ⲯⲩⲭⲏ
  choice: душу
  rationale: Греческое заимствование ψυχή допускает значения «душа», «жизнь», «сам человек»; «душа» сохраняет формальную и богословскую многозначность источника.
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: храни
  rationale: Перифрастическая конструкция означает «беречь, охранять»; «храни» сохраняет краткость и возвышенную простоту изречения.
- source_word: ⲡⲉⲗⲟⲩ ⲛⲡⲉⲕⲃⲁⲗ
  choice: зеницу своего ока
  rationale: Буквальный смысл — «зрачок твоего глаза». Устойчивый русский библейский оборот «зеница ока» точно обозначает зрачок и сохраняет образ источника.
theological_decisions:
- issue: Объём значения ⲯⲩⲭⲏ
  choice: душа
  alternative: жизнь; самого себя
  rationale: Перевод «душа» не сводит ψυχή ни к нематериальной части человека, ни только к биологической жизни, а примечание сохраняет смысловой диапазон.
- issue: Значение братской лексики
  choice: брат
  alternative: ближний; единоверец; товарищ
  rationale: Источник говорит именно «брат» и не уточняет границы обозначаемой общности; перевод не вводит конфессионального или социального толкования.
translation_notes:
  register: Современный литературный русский с достоинством и лаконичностью афористической речи. «Зеница своего ока» сознательно сохраняет узнаваемый библейский регистр, оставаясь понятной благодаря примечанию. Местоимение «своего» употреблено вместо менее естественного в русском «твоего» при повелительном глаголе.
