revisions:
- from: 'Иисус сказал: «Фарисеи и книжники получили ключи знания и спрятали их. Сами они не вошли и тем, кто хотел войти, не позволили.[a] Вы же станьте благоразумны, как змеи, и бесхитростны, как голуби».[b]'
  to: 'Иисус сказал: «Фарисеи и книжники получили ключи знания и спрятали их. Они не вошли и тем, кто хотел войти, не позволили.[a] Вы же станьте благоразумными, как змеи, и бесхитростными, как голуби».[b]'
  rationale: Исправлено только управление глагола «стать» для нормативного современного русского; также снято необязательное усиление «сами» перед «они». Смысл, синтаксическое противопоставление и намеренно неуказанная цель «входа» сохранены. Сноски структурно корректны и привязаны к соответствующим местам текста.
