base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: ru
  text: 'Иисус сказал: «Фарисеи и книжники получили ключи знания и спрятали их. Они не вошли и тем, кто хотел войти, не позволили.[a] Вы же станьте благоразумными, как змеи, и бесхитростными, как голуби».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Лк 11:52, где говорится о «ключе знания», и Мф 23:13, где осуждается препятствование тем, кто хочет войти. Здесь, однако, не уточняется, куда именно они не вошли.
    reason: cross_reference
  - marker: b
    text: 'В рукописи названия обоих животных стоят во множественном числе: «змеи … голуби». Ср. близкую формулировку в Мф 10:16.'
    reason: textual_note
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ ⲙⲛ̄ⲛⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: фарисеи и книжники
  rationale: Коптские формы обозначают соответствующие группы; русское множественное число естественно передаёт собирательное значение. «Книжники» — узнаваемое и достаточно точное обозначение религиозно-правовых учителей.
- source_word: ⲁⲩϫⲓ ⲛ̄ϣⲁϣⲧ
  choice: получили ключи
  rationale: ϫⲓ допускает значения «взять» и «получить». «Получили» не приписывает действующим лицам захвата ключей и сохраняет завершённость действия; множественное «ключи» следует рукописному тексту.
- source_word: ⲧⲅⲛⲱⲥⲓⲥ
  choice: знания
  rationale: Греческое заимствование здесь передано обычным словом «знание», без внесения позднейшего специального смысла термина «гнозис».
- source_word: ⲁⲩϩⲟⲡⲟⲩ
  choice: спрятали их
  rationale: Передаёт прямое значение «скрыли/спрятали» и сохраняет местоименную отсылку к ключам.
- source_word: ⲙ̄ⲡⲟⲩⲃⲱⲕ⳿ ⲉϩⲟⲩⲛ
  choice: сами они не вошли
  rationale: Глагол движения с ⲉϩⲟⲩⲛ означает вход внутрь. «Сами» естественно подчёркивает противопоставление их собственного отказа препятствованию другим, не уточняя, куда именно входят.
- source_word: ⲛⲉⲧⲟⲩⲱϣ ⲉⲃⲱⲕ⳿ ⲉϩⲟⲩⲛ ⲙ̄ⲡⲟⲩⲕⲁⲁⲩ
  choice: тем, кто хотел войти, не позволили
  rationale: Сохраняет желание войти и запрет со стороны книжников и фарисеев, не добавляя отсутствующий в тексте объект входа.
- source_word: ϣⲱⲡⲉ ⲙ̄ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: станьте благоразумны
  rationale: ϣⲱⲡⲉ передаёт становление, а не только состояние; «благоразумны» выражает практическую рассудительность φρόνιμος без обязательного оттенка хитрости.
- source_word: ⲛ̄ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: бесхитростны
  rationale: Передаёт здесь значение «чисты от примеси, просты, незлобивы» в ясной этической оппозиции змеиной рассудительности, не утверждая абсолютную нравственную безгрешность.
- source_word: ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ⳿ … ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙ⳿ⲡⲉ
  choice: как змеи … как голуби
  rationale: Рукописные формы имеют множественное число для обоих животных; русское множественное число точно отражает свидетельство кодекса.
theological_decisions:
- issue: Смысл «знания»
  choice: Оставлено общее «знание»
  alternative: «гнозис» как специальный религиозный термин
  rationale: Сам текст не требует позднейшей гностической терминологии; обычный перевод сохраняет открытость смысла.
- issue: Куда именно не вошли фарисеи и книжники
  choice: Объект входа не назван
  alternative: Добавить «в Царство» или «в знание»
  rationale: Коптский текст оставляет направление метафоры невыраженным. Его уточнение сняло бы подлинную неоднозначность и сблизило бы перевод с одним из синоптических параллельных мест.
- issue: Этический смысл ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: «бесхитростны»
  alternative: «невинны» или «чисты»
  rationale: Выбор сохраняет напряжение между благоразумием змей и отсутствием коварства у голубей, не превращая образ в догматическое утверждение о безгрешности.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной синтаксической формой. Сохранены достоинство речи, прямота обвинения и образный контраст; избегаются как архаизмы, так и специальная конфессиональная терминология.
