  verdict: revise
  source_fidelity: 'Первое блаженство и намеренно неразрешённая двусмысленность «в их сердцах» переданы близко к коптскому тексту. Множественное число в переводе обоснованно следует рукописным формам. Однако рукописное ⲛⲉⲧϩⲕⲁⲉⲓⲧ — множественная относительная форма со стативом: «те, кто голодны / испытывают голод», а не прошедшее «голодал». Нормализованный текст действительно даёт сингуляризованную форму, что следует оговорить без изменения смысла.'
