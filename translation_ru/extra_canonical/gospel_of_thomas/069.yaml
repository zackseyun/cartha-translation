base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: ru
  text: 'Иисус сказал: «Блаженны те, кого преследовали в их сердцах[a]: они-то и познали Отца поистине. Блаженны те, кто голодны[b], чтобы наполнился живот того, кто желает[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их сердцах». Коптский текст не позволяет однозначно определить, идёт ли речь о сердцах преследуемых или преследователей.'
    reason: source_ambiguity
  - marker: b
    text: 'В рукописи здесь множественное число и стативная форма: «те, кто голодны» (возможен также перевод «те, кто испытывают голод»). Нормализованный текст передаёт эту часть в единственном числе.'
    reason: textual_variant
  - marker: c
    text: Коптское слово ⲡϩⲏ означает «живот, желудок», а ⲥⲓⲟ — «наполниться, насытиться». Перевод сохраняет конкретный телесный образ.
    reason: lexical_alternative
lexical_decisions:
- source_word: 'ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ (рукопись: ϩⲙ̄ⲙⲁⲕⲁⲣⲓⲟⲥ)'
  choice: Блаженны
  rationale: Сохраняет форму изречения-блаженства и его торжественный тон; «счастливы» здесь звучало бы слабее и бытовее.
- source_word: ⲇⲓⲱⲕⲉ
  choice: преследовали
  rationale: Передаёт враждебное гонение и не сводит значение к нейтральному «гнались за».
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  choice: в их сердцах
  rationale: Близко передаёт коптскую предложную конструкцию и намеренно не уточняет, чьи именно это сердца.
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛⲟⲩⲙⲉ
  choice: познали Отца поистине
  rationale: «Познали» передаёт содержательное знание, а «поистине» — наречное значение ϩⲛⲟⲩⲙⲉ, сохраняя возвышенный, но современно понятный строй.
- source_word: 'ⲛⲉⲧϩⲕⲁⲉⲓⲧ (нормализовано: ⲡⲉⲧⲉⲣⲉϩⲕⲟ)'
  choice: те, кто голодал
  rationale: Следует рукописному множественному числу и выражает пережитый голод, не добавляя духовного объекта голода.
- source_word: ϩⲓⲛⲁ
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное отношение, не решая окончательно, является ли наполнение целью или следствием.
- source_word: ⲡϩⲏ
  choice: живот
  rationale: Сохраняет конкретный, телесный и несколько земной образ; «желудок» звучит анатомически, а «чрево» — излишне архаично.
- source_word: ⲥⲓⲟ
  choice: наполнился
  rationale: Сочетается с конкретным образом живота и охватывает значения насыщения и наполнения.
- source_word: ⲟⲩⲱϣ
  choice: желает
  rationale: Сохраняет внутреннюю направленность воли и оставляет объект желания невыраженным, как в источнике.
theological_decisions:
- issue: Кого обозначает «их» во фразе о сердцах
  choice: 'Не уточнять: «в их сердцах»'
  alternative: «в собственных сердцах» или «в сердцах гонителей»
  rationale: Коптская форма допускает отнесение местоимения как к преследуемым, так и к преследователям; уточнение устранило бы подлинную неоднозначность.
- issue: Характер голода и наполнения
  choice: Сохранить буквальные телесные образы без пояснения
  alternative: Истолковать голод как духовную жажду, а наполнение как духовное насыщение
  rationale: Источник не называет объект голода или желания и не объясняет образ; перевод не должен вносить конфессиональное или аллегорическое толкование.
- issue: Обозначение Отца
  choice: «Отец» с прописной буквы
  alternative: «отец» со строчной буквы
  rationale: В контексте изречения это титульное обозначение Бога; прописная буква отмечает референцию, не добавляя доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой изречения. «Блаженны» и «познали Отца поистине» поддерживают жанр блаженства, тогда как «живот» намеренно сохраняет резкую телесность оригинала. Множественное число следует рукописи, а не сингуляризующей нормализации.
