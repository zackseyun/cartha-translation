base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: ru
  text: 'Иисус сказал: «Царство[a] подобно пастуху, у которого было сто овец. Одна из них — большая[b] — заблудилась. Он оставил девяносто девять и искал её, пока не нашёл. Потрудившись, он сказал овце[d]: „Я люблю[c] тебя больше, чем девяносто девять“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲡⲙⲛⲧⲣⲣⲟ может означать «царствование» или «царская власть»; перевод «Царство» способен также восприниматься как обозначение области или места.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «большая» или «великая»; в данном контексте возможно также «крупнейшая».'
    reason: lexical_alternative
  - marker: c
    text: Коптское слово может означать как «люблю», так и «предпочитаю».
    reason: lexical_alternative
  - marker: d
    text: В коптском слове «овце» (ⲡⲉⲥⲟⲟⲩ) одна буква восстановлена в рукописи.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Царство
  rationale: Абстрактное существительное обозначает царствование или царскую власть; традиционное русское «Царство» естественно вводит притчу, а сноска сохраняет более точный смысловой диапазон.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: пастух
  rationale: Сочетание буквально означает человека пастьбы, то есть пастуха; владение стадом далее выражено отдельной конструкцией ⲟⲩⲛⲧⲁϥ.
- source_word: ⲛϣⲉ ⲛⲉⲥⲟⲟⲩ
  choice: сто овец
  rationale: Контекст стада и последующее обращение к овце поддерживают конкретное русское «овец».
- source_word: ⲥⲱⲣⲙ
  choice: заблудилась
  rationale: Глагол означает сбиться с пути или заблудиться; выбранное слово естественно в пастушеском контексте.
- source_word: ⲡⲛⲟϭ
  choice: самая большая
  rationale: Субстантивированное прилагательное буквально означает «большая/великая»; сравнительно-превосходная русская форма ясно передаёт выделение одной овцы среди стада.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲡⲓⲟⲩⲁ
  choice: искал её
  rationale: Русское местоимение избегает тяжеловесного «искал ту одну», сохраняя определённую овцу как объект поисков.
- source_word: ϣⲁⲛⲧⲉϥϩⲉ ⲉⲣⲟϥ
  choice: пока не нашёл
  rationale: Темпоральная конструкция обозначает продолжение поиска до момента обнаружения.
- source_word: ϩⲓⲥⲉ
  choice: потрудившись
  rationale: Передаёт приложенное усилие и усталость без усиления до полного изнеможения.
- source_word: ⲟⲩⲟϣⲕ
  choice: люблю
  rationale: Глагольная форма допускает значения любви и предпочтения; «люблю ... больше» естественно сохраняет обе стороны смысла.
theological_decisions:
- issue: Природа ⲡⲙⲛⲧⲣⲣⲟ
  choice: Царство с пояснением о царствовании/власти
  alternative: царствование; царская власть
  rationale: Не следует сводить выражение только к территории или месту; сноска сохраняет динамический и абстрактный оттенок.
- issue: Причина особого отношения к заблудившейся овце
  choice: Сохранить прямое «люблю тебя больше» без объяснения
  alternative: предпочитаю тебя остальным
  rationale: Текст оставляет напряжение между любовью и предпочтением и не объясняет, почему большая овца ценится выше; перевод не должен добавлять богословское толкование.
translation_notes:
  register: Современный литературный русский с ясным притчевым ритмом. Сохранена прямая и несколько парадоксальная концовка. «Пастух» переведено непосредственно из ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ, а не добавлено по контексту.
