- from: 'Иисус сказал: «Царство[a] подобно пастуху, у которого было сто овец. Одна из них — самая большая[b] — заблудилась. Он оставил девяносто девять и искал её, пока не нашёл. Потрудившись, он сказал овце: „Я люблю[c] тебя больше, чем девяносто девять“».'
  to: 'Иисус сказал: «Царство[a] подобно пастуху, у которого было сто овец. Одна из них — большая[b] — заблудилась. Он оставил девяносто девять и искал её, пока не нашёл. Потрудившись, он сказал овце[d]: „Я люблю[c] тебя больше, чем девяносто девять“».'
