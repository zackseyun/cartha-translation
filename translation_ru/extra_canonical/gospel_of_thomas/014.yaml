base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: ru
  text: 'Иисус сказал им: «Если вы будете поститься, то приобретёте себе грех[a]; если будете молиться, вас осудят[b]; а если будете подавать милостыню, то причините зло своим духам. Если же вы войдёте в какую-либо землю и будете странствовать по разным областям, то, когда вас примут, ешьте то, что поставят перед вами, и исцеляйте больных среди них[c]. Ибо не то, что входит в ваши уста, осквернит вас, но то, что выходит из ваших уст, — вот что осквернит вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптский глагол ϫⲡⲟ может означать как «приобрести, обрести», так и «породить».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они осудят вас»; неопределённое «они» обычно передаёт здесь пассивный смысл.'
    reason: register_note
  - marker: c
    text: 'В коптском обе фразы выделены перестановкой: буквально «то, что поставят перед вами, — ешьте это; больных среди них — исцеляйте их».'
    reason: register_note
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: приобретёте
  rationale: Глагол может означать «породить» или «приобрести, обрести». Сочетание «приобретёте себе грех» сохраняет резкую формулировку источника и естественно звучит по-русски.
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: вас осудят
  rationale: Активная форма третьего лица множественного числа буквально означает «они осудят вас» и в коптском часто передаёт неопределённо-личное или пассивное значение.
- source_word: ⲕⲱ ϩⲁ-
  choice: поставят перед вами
  rationale: В контексте гостеприимства это устойчивое обозначение поданной гостю пищи.
- source_word: ϫⲱϩⲙ̄
  choice: осквернит
  rationale: Глагол обозначает осквернение или загрязнение, в том числе ритуальное и нравственное; «осквернит» сохраняет религиозно-нравственную силу высказывания.
- source_word: ⲙⲟⲟϣⲉ ϩⲛ̄ⲛ̄ⲭⲱⲣⲁ
  choice: будете странствовать по её областям
  rationale: Глагол выражает ходьбу или передвижение, а существительное стоит во множественном числе; перевод не вводит отсутствующего в источнике значения «останавливаться на ночлег».
theological_decisions:
- issue: Парадоксальное осуждение поста, молитвы и милостыни
  choice: 'Сохранена прямая формулировка: «приобретёте себе грех», «вас осудят», «причините зло своим духам».'
  alternative: Смягчить смысл оговорками о неправильном посте, молитве или милостыне.
  rationale: В источнике нет уточнений о мотивах или неправильном исполнении этих практик. Добавление таких условий устранило бы намеренную напряжённость изречения.
- issue: Осквернение входящим и исходящим из уст
  choice: Сохранено противопоставление без пояснения, что именно выходит из уст.
  alternative: 'Уточнить: «слова, выходящие из уст».'
  rationale: Хотя контекст может подразумевать речь, источник оставляет выражение более широким и образным; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Повтор условных конструкций и резкие богословские парадоксы сохранены; синтаксис слегка сглажен ради ясности. «Уста» выбрано вместо разговорного «рот», поскольку оно естественно поддерживает торжественный регистр и параллелизм заключительной сентенции.
