base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: ru
  text: 'Иисус сказал: «Я встал посреди мира и явился им во плоти.[a] Я нашёл их всех пьяными и не нашёл среди них ни одного жаждущего.[b] И душа моя скорбела о сынах человеческих,[c] потому что они слепы сердцем и не видят, что пришли в мир пустыми и стремятся также выйти из мира пустыми.[d] Но теперь они пьяны. Когда они стряхнут с себя своё вино,[e] тогда раскаются».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «явился», может также означать «стал явным», «был явлен» или «воссиял».
    reason: lexical_alternative
  - marker: b
    text: 'Коптская фраза сжата; греческий свидетель POxy 1 ясно читает: «не нашёл среди них ни одного жаждущего».'
    reason: textual_variant
  - marker: c
    text: 'Буквально: «о сынах людей»; здесь сохранён близкий русскому библейскому языку оборот «сыны человеческие».'
    reason: translation_clarity
  - marker: d
    text: 'Буквально: «выйти из мира». «Пустыми» повторяется и при выходе из мира. Оборот «стремятся также» передаёт сопутствующее действие; возможно и понимание «снова стремятся».'
    reason: lexical_alternative
  - marker: e
    text: 'Необычный образ можно понять также как «когда вино оставит их» или передать по смыслу: «когда они протрезвеют». Глагол «раскаются» может также означать «переменят образ мыслей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲡⲙⲏⲧⲉ
  choice: встал посреди
  rationale: Передаёт совершённое действие и устойчивый образ «встать/занять место посреди», сохраняя лаконичность источника.
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: мир
  rationale: Естественный русский эквивалент греческого заимствования со всем возможным объёмом значения.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: явился
  rationale: Сохраняет смысл проявления или явления, не усиливая его до однозначного «воссиял».
- source_word: ϩⲛⲥⲁⲣⲝ
  choice: во плоти
  rationale: Сохраняет резкую и богословски значимую буквальность слова «плоть».
- source_word: ⲧⲁϩⲟ / ⲧⲟϩⲉ
  choice: пьяными / пьяны
  rationale: Конкретный образ опьянения согласуется с последующим упоминанием вина.
- source_word: ⲟⲃⲉ
  choice: жаждущего
  rationale: Передаёт буквальный образ жажды без истолкования её предмета; отрицательная конструкция подтверждается греческим свидетелем POxy 1.
- source_word: ⲯⲩⲭⲏ ϯⲧⲕⲁⲥ
  choice: душа моя скорбела
  rationale: Естественное по-русски выражение внутренней боли, сохраняющее явное слово «душа».
- source_word: ⲛ̄ϣⲏⲣⲉ ⲛ̄ⲣ̄ⲣⲱⲙⲉ
  choice: о сынах человеческих
  rationale: Сохраняет традиционный антропологический оборот и множественное число исходного текста.
- source_word: ⲃⲗⲗⲉⲉⲩ ... ϩⲙ̄ⲡⲟⲩϩⲏⲧ
  choice: слепы сердцем
  rationale: Естественно передаёт внутреннюю слепоту, буквально связанную с сердцем.
- source_word: ⲉⲩϣⲓⲛⲉ ⲟⲛ
  choice: стремятся также
  rationale: Передаёт обстоятельную, а не дополнительную изъяснительную конструкцию; «также» сохраняет значение ⲟⲛ в данном контексте.
- source_word: ⲛⲟⲩϩⲉ ⲡⲉⲩⲏⲣⲡ
  choice: стряхнут с себя своё вино
  rationale: Сохраняет необычный телесный образ источника, не сводя его сразу к объяснительному «протрезвеют».
- source_word: ⲣ̄ⲙⲉⲧⲁⲛⲟⲉⲓ
  choice: раскаются
  rationale: Краткий и понятный русский эквивалент, включающий нравственный поворот; более буквальная смысловая альтернатива отмечена в примечании.
theological_decisions:
- issue: Характер явления Иисуса во плоти
  choice: явился им во плоти
  alternative: воссиял им во плоти / был явлен им во плоти
  rationale: Формулировка сохраняет телесность и одновременно не решает однозначно, подразумевает ли глагол простое появление, проявление или сияние.
- issue: Смысл жажды
  choice: ни одного жаждущего
  alternative: ни одного, кто жаждал бы истины или Бога
  rationale: Предмет жажды в тексте не назван, поэтому богословское толкование не внесено в основной текст.
- issue: Значение метанойи
  choice: раскаются
  alternative: переменят образ мыслей / изменятся
  rationale: «Раскаются» естественно в религиозно-нравственном контексте, но примечание сохраняет более широкий смысл перемены ума и внутреннего направления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, афористическим звучанием. Синтаксис сохраняет последовательность и повторы оригинала; архаизмы ограничены узнаваемыми оборотами «во плоти» и «сыны человеческие». Необычные метафоры опьянения, пустоты и внутренней слепоты сохранены без конфессионального истолкования.
