revisions:
- from: 'Ученики сказали ему: «Приносит ли обрезание пользу или нет?» Он сказал им: «Если бы оно приносило пользу, их отец рождал бы их от матери уже обрезанными.[a] Но обрезание истины[b] в духе[c] стало всецело полезным.[d]»'
  to: 'Ученики сказали ему: «Приносит ли обрезание пользу или нет?» Он сказал им: «Если бы оно приносило пользу, их отец производил бы их на свет из чрева их матери уже обрезанными.[a] Но обрезание истины[b] в духе[c] оказалось вполне полезным.[d]»'
  rationale: 'Изменён только русский способ передачи отцовского субъекта при «порождать»: он остаётся явным, как в коптском, но устраняется неестественное употребление «рождать» применительно к отцу. Заключительный предикат сделан более естественным для современного русского при сохранении контекстуальной эллиптичности исходника. Сноски сохранены, а сноска a приведена в соответствие с новой формулировкой.'
