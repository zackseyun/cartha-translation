base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: ru
  text: 'Ученики сказали ему: «Приносит ли обрезание пользу или нет?» Он сказал им: «Если бы оно приносило пользу, их отец производил бы их на свет из чрева их матери уже обрезанными.[a] Но обрезание истины[b] в духе[c] оказалось вполне полезным.[d]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В оригинале субъектом действия назван «их отец»: буквально он «производил бы их на свет из их матери» уже обрезанными. Нереальное условие означает: «если бы обрезание действительно приносило пользу».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «обрезание истины» можно также понять как «истинное обрезание».
    reason: lexical_alternative
  - marker: c
    text: Возможен перевод «в Духе»; исходный текст не уточняет, идёт ли речь о духе вообще или о Святом Духе.
    reason: theological_ambiguity
  - marker: d
    text: 'В выражении, буквально передающем полноту результата, слово «полезным» подразумевается из предшествующего контекста. Смысловые параллели: Рим. 2:29; Флп. 3:3.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲥⲃⲃⲉ
  choice: обрезание
  rationale: Обычное коптское обозначение ритуального обрезания; контекст не допускает более общего перевода «отрезание».
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: приносить пользу
  rationale: Греческое заимствование ὠφελεῖν обозначает пользу или выгоду; русское выражение естественно и позволяет сохранить связь с заключительной фразой.
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: если бы оно приносило пользу
  rationale: Конструкция выражает нереальное условие; сослагательное наклонение сохраняет контрфактический смысл.
- source_word: ϫⲡⲟⲛ
  choice: рождал бы
  rationale: Подлежащее — «их отец»; «рождал бы» сохраняет явно отцовское действие исходного текста, хотя по-русски оборот намеренно звучит необычно.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: от матери
  rationale: Предложное сочетание обозначает происхождение или выход из источника.
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: обрезание истины
  rationale: Сохранена генитивная форма коптского выражения и его необычность; возможное атрибутивное понимание отмечено в сноске.
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: в духе
  rationale: 'Строчная буква сохраняет неопределённость: текст сам по себе не требует понимать здесь именно Святого Духа как личное имя.'
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  choice: стало всецело полезным
  rationale: Передана полнота результата; слово «полезным» восстановлено из непосредственного контекста, где дважды употреблён глагол пользы.
theological_decisions:
- issue: Соотношение телесного обрезания и обрезания «в духе»
  choice: Сохранить прямое противопоставление без догматического пояснения.
  alternative: Истолковать выражение как однозначное отрицание иудейского обряда или как прямую отсылку к конкретному новозаветному учению.
  rationale: Само изречение противопоставляет физическое обрезание «обрезанию истины в духе», но не раскрывает его конфессиональное или систематическое значение.
- issue: Значение слова ⲡⲛⲉⲩⲙⲁ
  choice: «дух» со строчной буквы
  alternative: «Дух» как однозначное обозначение Святого Духа
  rationale: Грамматическая форма допускает оба прочтения, а контекст изречения не устраняет неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством и без архаизации. Синтаксически необычное «отец рождал бы их от матери» сохранено ради образа и грамматического акцента оригинала; пояснение вынесено в сноску. Формула «обрезание истины» намеренно не сглажена до единственного толкования.
