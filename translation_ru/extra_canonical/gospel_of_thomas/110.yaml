base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: ru
  text: 'Иисус сказал: «Кто нашёл мир[b] и разбогател[a], пусть отречётся от мира».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал великим / влиятельным»; глагол ⲣⲣⲙⲙⲁⲟ может означать как обретение богатства, так и обретение величия или высокого положения.'
    reason: lexical_alternative
  - marker: b
    text: Перед первым словом «мир» предлог восстановлен издателем в небольшой лакуне рукописи (NHAM02.51, строка 4).
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Обычная формула введения прямой речи; естественно и точно передаёт краткий коптский оборот.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: кто нашёл
  rationale: Неопределённо-относительная конструкция имеет обобщающий смысл, а перфектный показатель ⲁ- обозначает совершившееся действие.
- source_word: ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: мир
  rationale: Заимствованное из греческого ⲕⲟⲥⲙⲟⲥ здесь естественнее всего передать обычным русским словом «мир», не уточняя его смысл толкованием.
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  choice: и разбогател
  rationale: Глагол допускает значения обретения богатства и величия; «разбогател» кратко и естественно передаёт наиболее вероятный в данном контексте смысл, а альтернативу сохраняет сноска.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥ
  choice: пусть
  rationale: Юссивная конструкция выражает предписание; русское «пусть» сохраняет его силу без добавления рода.
- source_word: ⲁⲣⲛⲁ
  choice: отречётся
  rationale: Глагол означает «отрицать, отрекаться, отвергать»; «отречься от» естественно сочетается с объектом и сохраняет сильный призыв к отказу.
- source_word: ⲛⲡⲕⲟⲥⲙⲟⲥ (повтор)
  choice: от мира
  rationale: Повтор слова «мир» сохранён, как в источнике; русское управление глагола требует предлога «от».
theological_decisions:
- issue: Характер отречения от мира
  choice: Не уточнять, означает ли это отказ от имущества, статуса или от мира в более широком смысле.
  alternative: Разъяснить фразу как призыв к аскетическому отказу от материального мира.
  rationale: Источник оставляет объём понятия «мир» и характер отречения открытыми; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная форма. Повтор «мир… мира» сохранён. Формулировка «кто… пусть» передаёт обобщённость без гендерно маркированного местоимения.
