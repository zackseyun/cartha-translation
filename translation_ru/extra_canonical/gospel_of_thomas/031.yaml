base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: ru
  text: 'Иисус сказал: «Ни один пророк не принят в своём селении[a], и врач не исцеляет тех, кто его знает»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом фрагменте P.Oxy. 1 стоит «на своей родине» (πατρίδι), тогда как коптский текст буквально говорит «в своём селении». Ср. Лк 4:24.
    reason: Текстуальный вариант и каноническая параллель.
  - marker: b
    text: 'Коптская форма ⲙⲁⲣⲉ- в рукописи — региональный вариант отрицательного аориста ⲙⲉⲣⲉ-. Здесь она выражает обобщающее отрицание: «врач не исцеляет», а не является совпадающей по виду побудительной формой «пусть».'
    reason: Диалектная особенность, существенная для смысла.
lexical_decisions:
- source_word: ⲙⲛⲡⲣⲟⲫⲏⲧⲏⲥ ϣⲱⲡ
  choice: Ни один пророк не принят
  rationale: 'Отрицательная конструкция с качественной формой ϣⲱⲡ выражает общий тезис: пророка не принимают. Формулировка сохраняет связь с буквальным значением «принят», не добавляя оценки «угоден».'
- source_word: ϩⲛⲡⲉϥϯⲙⲉ
  choice: в своём селении
  rationale: ϯⲙⲉ означает селение, деревню или небольшой город. «Селение» естественно по-русски и не подменяет коптское слово чтением греческого свидетеля «родина/родной край».
- source_word: ⲙⲉⲣⲉⲥⲟⲓⲛ
  choice: врач не
  rationale: ⲥⲟⲓⲛ — вариант слова «врач», а ⲙⲉⲣⲉ- — отрицательный аорист, выражающий общее правило, а не побуждение.
- source_word: ⲣⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: исцеляет
  rationale: Греческое заимствование со значением «лечить, исцелять»; в афористическом и религиозном контексте «исцеляет» передаёт его кратко и достойно.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲥⲟⲟⲩⲛ ⲛⲛⲧⲟϥ
  choice: тех, кто его знает
  rationale: Передаёт объект во множественном числе и конструкцию «знать его» без поясняющего расширения до «лично знаком».
theological_decisions:
- issue: Согласование с каноническими параллелями
  choice: своём селении
  alternative: на своей родине / в родном городе
  rationale: Коптский текст прямо говорит о селении; перевод не гармонизирован с Лк 4:24 или с греческим фрагментом P.Oxy. 1.
- issue: Характер второй части изречения
  choice: врач не исцеляет тех, кто его знает
  alternative: врач не может исцелить знакомых ему людей
  rationale: Сохранено обобщающее настоящее время и не внесена отсутствующая в источнике идея неспособности.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. «Селение» выбрано как понятное и несколько возвышенное, но не архаичное соответствие; синтаксический параллелизм двух общих утверждений сохранён.
