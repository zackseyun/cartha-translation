translation:
  language: ru
  text: Вот сокрытые[a] изречения, которые сказал живой Иисус[b], и записал их Дидим Иуда Фома.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское слово можно также перевести как «тайные» или «скрытые». «Сокрытые» подчёркивает, что изречения не явны, но само по себе не предполагает учения только для посвящённых.
    reason: lexical_alternative
  - marker: b
    text: В рукописи употреблена орфографическая или диалектная форма слова со значением «живой». Выражение «живой Иисус» может звучать как титул, однако текст не поясняет его смысл.
    reason: textual_variant
  - marker: c
    text: «Дидим» — греческое слово со значением «близнец»; имя «Фома» восходит к семитскому слову с тем же значением. В переводе сохранены все три компонента имени и их порядок, как в рукописи. Частица перед именем в коптском тексте обозначает того, кто совершил действие «записал».
    reason: cultural_note
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  choice: изречения
  rationale: Передаёт множественное число и жанр кратких речений, не расширяя значение до «учений» или «проповедей».
- source_word: ϩⲏⲡ
  choice: сокрытые
  rationale: Сохраняет основное значение скрытости и не придаёт тексту более определённого оттенка эзотерической тайны.
- source_word: ⲱⲛϩ (в рукописи ⲧⲟⲛϩ)
  choice: живой
  rationale: Кратко передаёт определение при имени Иисуса и сохраняет возможное титульное звучание.
- source_word: ϫⲟⲟⲩ
  choice: сказал
  rationale: Естественно и прямо передаёт глагол речи с объектом, уже выраженным словом «изречения».
- source_word: ⲥϩⲁⲓ
  choice: записал
  rationale: В данном контексте естественно обозначает письменную фиксацию изречений, не добавляя представления о редакторской работе.
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  choice: Дидим Иуда Фома
  rationale: Сохраняет полную последовательность имён рукописи; «Дидим» передаётся как имя, а его значение поясняется в примечании.
theological_decisions:
- issue: Выражение «живой Иисус»
  choice: Сохранено буквально как «живой Иисус»
  alternative: «Иисус, Который жив»
  rationale: Краткая форма сохраняет возможное титульное звучание и не уточняет богословский смысл выражения.
- issue: Характер изречений
  choice: «сокрытые»
  alternative: «тайные»
  rationale: Так сохраняется неоднозначность между просто скрытым содержанием и тайной, доступной посвящённым, без навязывания последнего понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным звучанием. «Вот» естественно вводит собрание речений; «изречения» передаёт жанровую краткость. Порядок имён и неоднозначность слов «сокрытые» и «живой» сохранены без конфессионального истолкования.
