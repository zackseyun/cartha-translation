revisions:
- from: 'Иисус сказал: «Быть может, люди думают, что Я пришёл бросить мир в мир, но они не знают, что Я пришёл бросить на землю разделения: огонь, меч, войну. Ибо пятеро будут в одном доме: трое будут против двоих, а двое — против троих; отец — против сына, а сын — против отца. И они будут стоять поодиночке[a]».[b]'
  to: 'Иисус сказал: «Быть может, люди думают, что Я пришёл бросить мир этому миру, но они не знают, что Я пришёл бросить на землю разделения: огонь, меч, войну. Ибо пятеро будут в одном доме: трое будут против двоих, а двое — против троих; отец — против сына, а сын — против отца. И они останутся каждый сам по себе[a]».[b]'
  rationale: 'Исправлена неудачная русская передача пространственной конструкции при первом «бросить»: «этому миру» сохраняет адресата/направленность и намеренно парадоксальный повтор «мир», не подменяя образ глаголом «принести». Заключительная фраза передана как характеристика состояния («каждый сам по себе»), что ближе к «будучи monachos», чем обстоятельственное «поодиночке». Примечания сохранены с нейтральным, не конфессионально предрешающим пояснением.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:33:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основное содержание передано верно: ⲧⲁⲭⲁ — «быть может», повтор ⲛⲟⲩϫⲉ сохранён, «пятеро… трое против двоих» отражает коптский текст, а заключительное ⲙⲟⲛⲁⲭⲟⲥ не анахронистически переведено как отдельность. Однако «бросить мир в мир» меняет направленность ⲉϫⲛ («на, над») на «в» и в русском языке воспринимается как неудачная игра слов, а не как намеренно резкий образ исходника. Также «поодиночке» несколько сужает предикативное «будучи/как monachos» до обстоятельства способа действия.'
  naturalness: 'Текст в целом современный и ясный. Формулу «бросить мир на мир» лучше заменить на «бросить мир этому миру»: она сохраняет повтор существительного и образ броска, но не создаёт неестественной конструкции с «в мир». Заключение «останутся каждый сам по себе» естественно передаёт результативно-предикативный характер коптской фразы, не навязывая позднейшего значения «монахи».'
  terminology: «Разделения», «огонь, меч, война», «пятеро», «трое против двоих» и «отец… сын» адекватны. Примечание о monachos должно избегать положительной богословской экспликации «духовного единства»; имеющееся русское примечание в целом осторожно и может быть уточнено как указание на значение в данном контексте.
  issues:
  - severity: medium
    issue: «бросить мир в мир»
    rationale: Коптское ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ означает «на мир», а не «в мир». Русская конструкция с «в» одновременно меняет образ и звучит искусственно.
  - severity: low
    issue: «будут стоять поодиночке»
    rationale: Наречие описывает лишь то, как они стоят; ⲉⲩⲟ ⲙⲙⲟⲛⲁⲭⲟⲥ характеризует их как «одиноких/отдельных». Более точна предикативная передача без конфессионального оттенка.
