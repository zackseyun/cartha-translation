base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: ru
  text: 'Иисус сказал: «Быть может, люди думают, что Я пришёл бросить мир этому миру, но они не знают, что Я пришёл бросить на землю разделения: огонь, меч, войну. Ибо пятеро будут в одном доме: трое будут против двоих, а двое — против троих; отец — против сына, а сын — против отца. И они останутся каждый сам по себе[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В оригинале стоит греческое заимствование monachos — «один, отдельный, уединённый». В данном контексте оно не обязательно означает монаха в позднейшем церковном смысле.
    reason: lexical_and_historical_note
  - marker: b
    text: Ср. Лк. 12:51–53 и Мф. 10:34–35.
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: Быть может
  rationale: Передаёт контекстуальное значение греческого заимствования τάχα — «возможно, быть может» — и естественно вводит предположение людей.
- source_word: ⲛⲟⲩϫⲉ
  choice: бросить
  rationale: Сохраняет основной образ глагола «бросать, кидать» и его намеренно резкое повторение применительно как к миру, так и к разделениям.
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: в мир
  rationale: В сочетании с русским «бросить» конструкция «бросить мир в мир» звучит понятнее, чем буквальное, но неестественное «бросить мир на мир», сохраняя парадокс исходного образа.
- source_word: ⲡⲱⲣϫ
  choice: разделения
  rationale: Передаёт множественное значение «разделения, разобщения» без уточнения их природы.
- source_word: ⲟⲩⲛϯⲟⲩ ... ϩⲛⲟⲩⲏⲓ
  choice: пятеро будут в одном доме
  rationale: Явно сохраняет число пять и локативную конструкцию источника.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: будут стоять
  rationale: Передаёт коптский идиоматический оборот «стоять на ногах» обычным русским глаголом.
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: поодиночке
  rationale: Передаёт раннее значение греческого заимствования μοναχός — «один, отдельный, уединённый» — и не создаёт анахронической отсылки к позднейшему монашеству.
theological_decisions:
- issue: Значение ⲙⲟⲛⲁⲭⲟⲥ в заключительной фразе
  choice: будут стоять поодиночке
  alternative: станут монахами; встанут как единые
  rationale: Выбранный вариант сохраняет идею отдельности и не утверждает ни позднейшее институциональное монашество, ни конкретное учение о внутреннем духовном единстве, которого само слово в данном контексте однозначно не устанавливает.
- issue: Связь огня, меча и войны с разделениями
  choice: 'разделения: огонь, меч, войну'
  alternative: разделения, огонь, меч и войну
  rationale: Двоеточие отражает возможность понимать последующую тройку как пояснение или проявления разделений, но не вводит дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Прописное «Я» следует принятой русской издательской норме для речи Иисуса. Повтор глагола «бросить» намеренно сохранён; парадоксальное «бросить мир в мир» удерживает необычный образ источника. Конструкция с тире в семейных противопоставлениях делает перечисление ясным, не добавляя отсутствующих в коптском сказуемых.
