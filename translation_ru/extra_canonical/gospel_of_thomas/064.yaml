base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: ru
  text: 'Иисус сказал: «У одного человека были гости. Когда он приготовил ужин, то послал своего слугу позвать гостей. Слуга пошёл к первому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „У меня есть деньги у торговцев; вечером они придут ко мне. Я пойду и дам им распоряжения. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин пригласил тебя“[a]. Тот ответил: „Я купил дом, и я нужен им на целый день. У меня не будет времени“.


    Слуга пришёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Мой друг женится, и устраивать ужин буду я. Я не пойду[b]. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Я купил деревню и иду собирать арендную плату. Я не пойду. Прошу меня освободить“.


    Слуга вернулся и сказал своему господину: „Те, кого ты пригласил на ужин, отказались“. Господин сказал своему слуге: „Выйди на улицы и приведи всех, кого найдёшь, чтобы они поужинали. Покупатели и торговцы не войдут[c] в места моего Отца“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь, в отличие от остальных приглашений, коптский текст употребляет завершённую форму: «мой господин пригласил тебя».'
    reason: textual_variant
  - marker: b
    text: Коптское ϯⲛⲁϣⲓ ⲁⲛ означает «я не пойду». Форму иногда понимали как «я не смогу», однако здесь употреблён вариант глагола «идти», а после глагола «мочь» ожидался бы инфинитив.
    reason: lexical_alternative
  - marker: c
    text: В рукописи здесь есть небольшая лакуна. Восстановление «не войдут» соответствует видимым следам букв и доступному месту в строке.
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: гости
  rationale: Основное значение — «чужеземец, посторонний», но в контексте заранее устроенного ужина слово обозначает гостей; перевод не смешивает его с последующим ϩⲙϩⲁⲗ, «слуга».
- source_word: ϩⲙϩⲁⲗ
  choice: слуга
  rationale: Слово может обозначать раба или слугу. В повествовательной роли посланца естественное русское «слуга» сохраняет отношение подчинения, не усиливая социальную характеристику сверх контекста.
- source_word: ⲇⲓⲡⲛⲟⲛ
  choice: ужин
  rationale: Греческое заимствование обозначает главную, обычно вечернюю трапезу; «ужин» точно согласуется с упоминанием вечера и повторяется как ключевое слово.
- source_word: ϩⲟⲙⲧ
  choice: деньги
  rationale: Буквально «медь», также употребляется в значении денег. Конкретная экономическая деталь сохранена, а не заменена общим «деловые отношения».
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: дать распоряжения
  rationale: Составной глагол означает приказывать или отдавать распоряжения.
- source_word: ⲥⲣϥⲉ
  choice: иметь время
  rationale: Глагол означает располагать досугом или временем; отрицательная форма естественно передана «у меня не будет времени».
- source_word: ⲣϣⲉⲗⲉⲉⲧ
  choice: жениться
  rationale: Выражение буквально связано с взятием невесты и в данном контексте означает вступление мужчины в брак.
- source_word: ϣⲓ
  choice: пойти
  rationale: Это диалектный вариант ϣⲉ, «идти», а не глагол «мочь», для которого ожидался бы следующий инфинитив.
- source_word: ϫⲓ ⲛϣⲱⲙ
  choice: собирать арендную плату
  rationale: Устойчивое выражение о получении платы или дохода с приобретённого владения.
- source_word: ⲣⲉϥⲧⲟⲟⲩ ⲙⲛ ⲛⲉϣⲟⲧⲉ
  choice: покупатели и торговцы
  rationale: Сохранены две отдельные экономические категории исходного текста без гармонизации с синоптическими параллелями.
- source_word: ⲧⲟⲡⲟⲥ
  choice: места
  rationale: Греческое заимствование стоит с формой множественного числа; поэтому передано «места», а не обобщённое «царство».
theological_decisions:
- issue: Заключительное изречение о покупателях и торговцах
  choice: Покупатели и торговцы не войдут в места моего Отца
  alternative: Деловые люди не войдут в место моего Отца
  rationale: Перевод сохраняет резкое различение двух названных групп и множественное «места», не смягчая высказывание и не объясняя его через определённую аскетическую доктрину.
- issue: Соотношение с каноническими притчами о пире
  choice: Сохранены четыре конкретные причины отказа и самостоятельная концовка Фомы
  alternative: Гармонизировать формулировки с Лк 14:16–24 или Мф 22:1–10
  rationale: Коптский текст переведён как самостоятельное свидетельство; его экономическая лексика и особое заключение не заменены формулировками параллелей.
- issue: Образ «мест моего Отца»
  choice: Сохранена пространственная и богословская неопределённость выражения
  alternative: Перевести как «Царство моего Отца»
  rationale: Исходный текст говорит именно о «местах» и не называет царство; конкретизация устранила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным притчевым ритмом. Повторы приглашения и отказа намеренно сохранены. «Господин» передаёт ϫⲟⲉⲓⲥ в бытовом контексте притчи, тогда как «Отец» написан с прописной буквы как обозначение Бога. Формулировка «меня вызывают туда на целый день» естественно передаёт не вполне определённое «меня требуют на один день», не уточняя отсутствующий в тексте субъект.
