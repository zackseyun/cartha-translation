  source_fidelity: 'Перевод в целом точно передаёт сахидский текст: различены гости (ϣⲙⲙⲟ) и слуга (ϩⲙϩⲁⲗ), сохранены четыре отказа, экономическая лексика, «покупатели и торговцы» и множественное «места моего Отца». Завершённая форма второго приглашения адекватно отмечена и передана. Однако «меня вызывают туда» добавляет отсутствующее в источнике указание на место; коптское выражение означает, что говорящий нужен/требуется им на один день.'
  naturalness: Текст звучит как современный литературный русский и сохраняет притчевую ясность. Замена «меня вызывают туда на целый день» на «я нужен им на целый день» одновременно естественнее и точнее. «На улицы» точнее передаёт ϩⲓⲏ, чем более широкое «на дороги».
  terminology: 'Ключевые решения удачны: «гости», «слуга», «ужин», «деньги», «распоряжения», «арендная плата», «покупатели и торговцы», «места моего Отца». Не следует переводить последнее как «царство», поскольку исходник сохраняет пространственную формулировку и множественное число.'
  issues:
  - severity: low
    issue: Добавлено указание «туда» во втором отказе.
    rationale: В коптском «они требуют меня на один день» не названо место, куда вызывают говорящего. «Я нужен им на целый день» сохраняет неопределённость оригинала.
  - severity: low
    issue: «На дороги» менее точно для заключительного поручения слуге.
    rationale: ϩⲓⲏ означает улицы; «выйди на улицы» передаёт это конкретнее, не меняя смысла.
