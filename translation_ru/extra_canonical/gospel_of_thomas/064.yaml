- from: 'Иисус сказал: «У одного человека были гости. Когда он приготовил ужин, то послал своего слугу позвать гостей. Слуга пошёл к первому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „У меня есть деньги у торговцев; вечером они придут ко мне. Я пойду и дам им распоряжения. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин пригласил тебя“[a]. Тот ответил: „Я купил дом, и меня вызывают туда на целый день. У меня не будет времени“.


    Слуга пришёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Мой друг женится, и устраивать ужин буду я. Я не пойду[b]. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Я купил деревню и иду собирать арендную плату. Я не пойду. Прошу меня освободить“.


    Слуга вернулся и сказал своему господину: „Те, кого ты пригласил на ужин, отказались“. Господин сказал своему слуге: „Выйди на дороги и приведи всех, кого найдёшь, чтобы они поужинали. Покупатели и торговцы не войдут[c] в места моего Отца“».'
  to: 'Иисус сказал: «У одного человека были гости. Когда он приготовил ужин, то послал своего слугу позвать гостей. Слуга пошёл к первому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „У меня есть деньги у торговцев; вечером они придут ко мне. Я пойду и дам им распоряжения. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин пригласил тебя“[a]. Тот ответил: „Я купил дом, и я нужен им на целый день. У меня не будет времени“.


    Слуга пришёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Мой друг женится, и устраивать ужин буду я. Я не пойду[b]. Прошу освободить меня от ужина“.


    Слуга пошёл к другому и сказал ему: „Мой господин приглашает тебя“. Тот ответил: „Я купил деревню и иду собирать арендную плату. Я не пойду. Прошу меня освободить“.


    Слуга вернулся и сказал своему господину: „Те, кого ты пригласил на ужин, отказались“. Господин сказал своему слуге: „Выйди на улицы и приведи всех, кого найдёшь, чтобы они поужинали. Покупатели и торговцы не войдут[c] в места моего Отца“».'
