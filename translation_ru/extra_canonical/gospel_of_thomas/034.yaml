base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
translation:
  language: ru
  text: 'Иисус сказал: «Если слепой ведёт[a] слепого, оба падают[b] вниз — в яму».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тянет перед собой»; это коптское выражение означает «ведёт, направляет».'
    reason: lexical_alternative
  - marker: b
    text: 'Форма глагола передаёт общую закономерность: «обычно падают», а не однократное будущее событие.'
    reason: textual_nuance
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: слепой
  rationale: Существительное обозначает незрячего человека без обязательного указания на пол; субстантивированное «слепой» естественно и точно в данном афористическом контексте.
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲟϥ
  choice: ведёт
  rationale: Буквально сочетание выражает движение «тянуть перед собой», но функционирует как идиома со значением «вести, направлять».
- source_word: ϣⲁⲣⲉⲛⲧⲟⲟⲩϩⲉ
  choice: оба падают
  rationale: Аористическая конструкция передаёт обычную, общезначимую закономерность; настоящее время русского глагола сохраняет гномический смысл. ⲡⲥⲛⲁⲩ подчёркивает, что падают оба.
- source_word: ⲉⲡⲉⲥⲏⲧ
  choice: вниз
  rationale: Самостоятельное наречное выражение направления сохранено, а не слито со следующим словом «яма».
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: в яму
  rationale: 'ⲟⲩ маркирует неопределённость: речь идёт о яме, рве или углублении; нейтральное «яма» подходит образу и не делает объект определённым.'
theological_decisions:
- issue: Характер высказывания о падении
  choice: Настоящее время «падают» как общая закономерность
  alternative: Будущее время «упадут»
  rationale: Коптская аористическая форма выражает гномическую, регулярно осуществляющуюся реальность. Перевод не заменяет её будущим временем под влиянием синоптической параллели.
translation_notes:
  register: Современный литературный русский язык с кратким, афористическим строем. Повтор «слепой… слепого» сохранён ради образной силы оригинала. Тире перед «в яму» позволяет естественно сохранить отдельное коптское наречие «вниз» и затем назвать направление падения.
