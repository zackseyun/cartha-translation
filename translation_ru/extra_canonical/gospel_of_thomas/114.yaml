base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: ru
  text: 'Симон Пётр сказал им: «Пусть Мария уйдёт из нашей среды, потому что женщина[a] недостойна жизни». Иисус сказал: «Вот, я сам поведу её[b], чтобы сделать её мужчиной[c], чтобы и она стала живым духом, подобным вам, мужчинам. Ибо всякая женщина, которая сделает себя мужчиной, войдёт в Царство небес[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲥϩⲓⲙⲉ может означать «женщина» или «лицо женского пола». Здесь оно противопоставлено слову ϩⲟⲟⲩⲧ — «мужчина; лицо мужского пола».
    reason: lexical_alternative
  - marker: b
    text: В рукописи местоимение «её» записано как ⲙ̄ⲙⲟⲥ; в нормализованном тексте дан равнозначный вариант ⲛⲛⲧⲟⲥ. Оба обозначают прямое дополнение третьего лица женского рода.
    reason: textual_variant
  - marker: c
    text: В написании коптского слова «мужчина; лицо мужского пола» встречается диалектное орфографическое колебание между формами с ⲟⲟ и ⲟⲟⲩ; смысл от этого не меняется.
    reason: dialect_note
  - marker: d
    text: Буквально — «Царство небес», с формой множественного числа. Выражение указывает на сферу небесного царствования и не обязательно подчёркивает пространственную множественность небес.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ ϩⲛⲁⲛⲟⲛ
  choice: Пусть … уйдёт из нашей среды
  rationale: Побудительная конструкция ⲙⲁⲣⲉ- передана через «пусть»; сочетание ⲉⲓ ⲉⲃⲟⲗ с ϩⲛⲁⲛⲟⲛ означает уход из круга присутствующих.
- source_word: ⲥϩⲓⲙⲉ
  choice: женщина
  rationale: В современном русском это естественное обозначение лица женского пола; в сочетании с «мужчиной» сохраняется резкое противопоставление женского и мужского без неестественного субстантивированного «самка».
- source_word: ⲙⲡϣⲁ ⲁⲛ ⲛⲡⲱⲛϩ
  choice: недостойна жизни
  rationale: Формально сохраняет отрицание достоинства и не сужает многозначное «жизнь» до земного существования или спасения.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Вот
  rationale: Краткая современная указательная частица передаёт призыв обратить внимание без архаического «се».
- source_word: ⲥⲱⲕ
  choice: поведу
  rationale: Глагол допускает значения «вести, направлять, влечь»; «поведу» естественно сохраняет образ руководства и не уточняет способ преобразования.
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: сделаю … мужчиной
  rationale: Прямо сохраняет намеренно резкую и необычную формулировку источника, не заменяя её истолкованием.
- source_word: ⲟⲩⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: живым духом
  rationale: Передаёт неопределённое нарицательное существительное и причастное определение; прописная буква не употребляется, поскольку речь не представлена как титул.
- source_word: ⲧⲙⲛⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: Царство небес
  rationale: Сохраняется множественное число «небес» и традиционно понятное русское выражение; оно обозначает сферу божественного царствования без сведения к чисто пространственному смыслу.
theological_decisions:
- issue: Характер превращения женщины в мужчину
  choice: Сохранена буквальная формулировка «сделаю её мужчиной» без поясняющей интерпретации.
  alternative: Передать как духовное уподобление, обретение целостности или преодоление пола.
  rationale: Коптский текст выражается намеренно резко и не объясняет, является ли превращение телесным, символическим или духовным; перевод не должен устранять эту богословскую напряжённость.
- issue: Значение слова «жизнь»
  choice: Оставлено общее «жизнь».
  alternative: Уточнить как вечную жизнь, спасение или физическое существование.
  rationale: Источник не даёт определения; доктринальное уточнение сузило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и без искусственной архаизации. Синтаксис оставлен ясным, а повтор слов «женщина — мужчина» сохранён ради центрального противопоставления источника. Формула «подобным вам, мужчинам» уточняет грамматическую связь сравнения, не снимая смысловой напряжённости речения.
