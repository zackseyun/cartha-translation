revisions:
- from: 'Симон Пётр сказал им: «Пусть Мария уйдёт из нашей среды, потому что женщина[a] недостойна жизни». Иисус сказал: «Вот, я сам поведу её[b] и сделаю её мужчиной[c], чтобы и она стала живым духом, подобным вам, мужчинам. Ибо всякая женщина, которая сделает себя мужчиной, войдёт в Царство небес[d]».'
  to: 'Симон Пётр сказал им: «Пусть Мария уйдёт из нашей среды, потому что женщина[a] недостойна жизни». Иисус сказал: «Вот, я сам поведу её[b], чтобы сделать её мужчиной[c], чтобы и она стала живым духом, подобным вам, мужчинам. Ибо всякая женщина, которая сделает себя мужчиной, войдёт в Царство небес[d]».'
  rationale: 'Исправлена только синтаксическая связь: «чтобы сделать её мужчиной» воспроизводит первое целевое hina в источнике. Остальная формулировка и все сноски сохранены, поскольку они верно отражают текст, его терминологическую напряжённость и отмеченные варианты.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт лексику и намеренно резкую гендерную антитезу коптского текста, не навязывая толкования. Однако в реплике Иисуса два последовательных целевых союза hina: он «поведёт» Марию с тем, чтобы «сделать её мужчиной», и затем — чтобы она стала живым духом. В черновике первое целевое отношение заменено простым сочинением («поведу её и сделаю»), что слегка ослабляет синтаксическую структуру источника.'
  naturalness: Современный литературный русский в целом естественен. Замена сочинительной связи на «чтобы» одновременно точнее и вполне идиоматична. «Подобным вам, мужчинам» грамматически согласуется с «духом» и ясно передаёт сравнение.
  terminology: «Женщина» / «мужчина» — допустимый современный русский эквивалент в данном контексте; повтор сохраняет противопоставление источника. «Жизнь», «живой дух» и «Царство небес» переданы без конфессионального сужения. Сноски содержательно уместны и их якоря присутствуют.
  issues:
  - severity: medium
    issue: Утрачен первый целевой союз в словах Иисуса.
    rationale: 'Коптское «ϫⲉⲕⲁⲁⲥ» вводит цель: «я поведу её, чтобы/с тем чтобы сделать её мужчиной». Формула «поведу её и сделаю её мужчиной» передаёт оба действия, но не их выраженную в источнике целевую связь.'
  revised_text: 'Симон Пётр сказал им: «Пусть Мария уйдёт из нашей среды, потому что женщина[a] недостойна жизни». Иисус сказал: «Вот, я сам поведу её[b], чтобы сделать её мужчиной[c], чтобы и она стала живым духом, подобным вам, мужчинам. Ибо всякая женщина, которая сделает себя мужчиной, войдёт в Царство небес[d]».'
