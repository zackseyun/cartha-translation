base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: ru
  text: 'Иисус сказал[a]: «Кто ищет, тот найдёт; и кто стучит, чтобы войти[b], тому откроют[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова «Иисус сказал» в рукописи сохранились не полностью и частично восстановлены издателями; нормализованный текст читается как ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: 'Буквально: «стучит внутрь». Выражение указывает на движение внутрь, но слова «дверь» в тексте нет.'
    reason: cultural_note
  - marker: c
    text: 'Возможен также перевод: «для него будет открыто». В коптском стоит форма третьего лица множественного числа — буквально «они откроют ему», — употреблённая в безличном, близком к пассивному смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Иисус сказал
  rationale: Стандартная повествовательная формула ⲡⲉϫⲉ с именем Иисуса; в рукописи начало формулы частично восстановлено.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: Кто ищет, тот найдёт
  rationale: Относительная конструкция обозначает всякого ищущего, а форма с ⲛⲁ- передаёт будущее действие. Русская соотносительная конструкция сохраняет краткий афористический характер.
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: кто стучит, чтобы войти
  rationale: ⲧⲱϩⲙ означает «стучать», а ⲉϩⲟⲩⲛ выражает направленность внутрь. «Чтобы войти» естественно передаёт эту направленность, не добавляя отсутствующее в тексте слово «дверь».
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: тому откроют
  rationale: Форма третьего лица множественного числа допускает безличное, близкое к пассивному употребление. Русское неопределённо-личное «откроют» сохраняет грамматическую форму и не вводит неуказанный объект.
theological_decisions:
- issue: Кто именно открывает и что именно открывают
  choice: 'Субъект и объект не названы: «тому откроют»'
  alternative: «Для него будет открыто» или «ему откроется дверь»
  rationale: Коптский текст использует третье лицо множественного числа в безлично-пассивном значении и не называет ни действующего лица, ни двери. Перевод не конкретизирует богословски, кто открывает, и не добавляет предмет.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Конструкция «кто..., тот...» естественна и понятна широкому читателю; «тому откроют» избегает добавления двери и сохраняет неопределённость исходного текста.
