  source_fidelity: 'Перевод точно передаёт коптские относительные конструкции и будущее значение: «Кто ищет, тот найдёт»; «кто стучит, чтобы войти, тому откроют». Направительное ⲉϩⲟⲩⲛ корректно отражено как «чтобы войти», без добавления отсутствующей в источнике двери. Неопределённо-личное «откроют» удачно передаёт форму 3-го лица множественного числа и сохраняет неназванными как действующее лицо, так и открываемый предмет.'
