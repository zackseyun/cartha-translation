  terminology: Имя Иисус передано нормативно. Специальные богословские интерпретации не вводятся. Сноски адекватно поясняют реконструкцию начала, направительный оттенок ⲉϩⲟⲩⲛ и безлично-пассивную функцию формы 3-го лица множественного числа.
