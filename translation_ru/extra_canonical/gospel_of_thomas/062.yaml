base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: ru
  text: 'Иисус сказал: «Я открываю свои тайны тем, кто достоин[a] моих тайн. Что будет делать твоя правая рука, пусть твоя левая рука не знает, что делает правая».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом месте рукопись повреждена. Слова «кто достоин» и «моих» восстановлены по сохранившимся следам букв, контексту и древним параллелям.
    reason: textual_variant
  - marker: b
    text: Ср. Матфея 6:3. Там образ правой и левой руки относится к милостыне; здесь милостыня не названа, и эти слова стоят сразу после высказывания о тайнах.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: тайны
  rationale: Греческое заимствование μυστήριον; притяжательный артикль в коптском указывает на множественное число. «Тайны» естественно передаёт религиозно-сокровенный смысл без привнесения специальной конфессиональной терминологии.
- source_word: ϫⲱ
  choice: открываю
  rationale: Буквально глагол означает «говорить, сообщать». В сочетании с «тайнами» русское «открываю» естественно выражает сообщение сокровенного; форма ⲉⲓϫⲱ передана простым настоящим временем, без усилительной конструкции.
- source_word: ⲙⲡϣⲁ
  choice: достоин
  rationale: Передаёт значение «быть достойным, заслуживать»; слово восстановлено в повреждённом месте рукописи.
- source_word: ⲟⲩⲛⲁⲙ
  choice: правая рука
  rationale: Коптское слово обозначает правую сторону или правую руку; в паре с ϩⲃⲟⲩⲣ контекст требует «правая рука».
- source_word: ϩⲃⲟⲩⲣ
  choice: левая рука
  rationale: Стандартное обозначение левой стороны или левой руки; параллелизм с «правой рукой» сохранён.
theological_decisions:
- issue: Связь изречения о правой и левой руке с тайнами
  choice: Сохранить последовательность и формулировку Фомы без уточнения, к какому именно поступку относится образ рук.
  alternative: Истолковать слова как наставление о тайной милостыне по Матфею 6:3.
  rationale: В тексте Фомы милостыня не упоминается; образ рук следует непосредственно за речением о тайнах. Перевод не должен вносить отсутствующий канонический контекст или однозначно сводить образ к хранению эзотерического знания.
- issue: Временная форма в высказывании о правой руке
  choice: Передать первое действие будущим временем («будет делать»), а заключительное — настоящим («делает»).
  alternative: Сгладить обе формы до привычного «пусть левая рука не знает, что делает правая».
  rationale: Так сохраняется напряжение коптского текста между будущей формой ⲛⲁⲉⲓⲣⲉ и последующей конструкцией настоящего времени, не подменяя её знакомой формой канонического параллеля.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным звучанием. «Открываю свои тайны» выбрано вместо неестественного буквального «говорю свои тайны». Необычная смена будущего и настоящего времени сохранена ради близости к коптской формулировке; местоимение «она» намеренно сохраняет возможную отсылку к левой руке в последней части.
