base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: ru
  text: 'Иисус сказал: «Почему вы моете чашу снаружи?[a] Разве вы не знаете[b], что тот, кто сделал внутреннюю сторону, сделал и внешнюю?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внешнюю сторону чаши»; далее этому выражению соответствует «внутренняя сторона».'
    reason: literal_rendering
  - marker: b
    text: Коптское ⲛⲟⲉⲓ может также означать «понимать» или «осознавать».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲓⲱⲉ
  choice: моете
  rationale: В контексте чаши глагол естественно передаётся как «мыть»; это сохраняет конкретный бытовой образ и не смешивает его с последующим ⲧⲁⲙⲓⲟ «создавать».
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ ⲛⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: чашу снаружи
  rationale: Буквально речь идёт о «внешней стороне чаши», но по-русски «мыть чашу снаружи» звучит естественно и сохраняет пространственное противопоставление.
- source_word: ⲛⲧⲱⲧⲛ ⲣ̄ⲛⲟⲉⲓ ⲁⲛ
  choice: разве вы не знаете
  rationale: Отрицательный вопрос передан естественной русской конструкцией; «знаете» сохраняет нейтральное когнитивное значение, хотя возможны «понимаете» и «осознаёте».
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲧⲁⲙⲓⲟ
  choice: тот, кто создал
  rationale: ⲧⲁⲙⲓⲟ означает «делать, создавать, формировать». «Создал» ясно отличается от глагола «мыть» и подходит как к внутренней, так и к внешней стороне чаши.
- source_word: ⲡⲥⲁ ⲛϩⲟⲩⲛ … ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: внутреннюю сторону … внешнюю
  rationale: Парные выражения переведены симметрично, чтобы сохранить формальное противопоставление внутреннего и внешнего.
- source_word: ⲟⲛ
  choice: и
  rationale: В русской конструкции «создал и внешнюю» союз естественно передаёт добавочное значение «также».
theological_decisions:
- issue: Референт выражения «тот, кто создал»
  choice: Сохранено неопределённое «тот, кто создал»
  alternative: «Творец» или явное отнесение к Богу
  rationale: Коптский текст не называет деятеля и не уточняет богословский референт; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык; речь краткая и афористичная. «Чаша» выбрана вместо разговорного «чашка» ради нейтрального, достойного регистра и соответствия предметному образу древнего текста. Парность внутренней и внешней сторон сохранена без внесения дополнительного нравственного или культового толкования.
