base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: ru
  text: Не давайте святыни псам[a], чтобы они не бросили их на навозную кучу[b]. Не бросайте жемчуга свиньям, чтобы они не сделали с ним[…][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что свято»; в коптском это субстантивированное прилагательное.'
    reason: lexical_alternative
  - marker: b
    text: Коптское ⲕⲟⲡⲣⲓⲁ — греческое заимствование со значением навозной или мусорной кучи.
    reason: cultural_note
  - marker: c
    text: После сохранившихся слов «они не сделали с ним» текст обрывается; от следующего слова различимы лишь начальные буквы. Восстановление «не растоптали» под влиянием Мф 7:6 остаётся предположительным.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ϫⲉⲙⲡⲣϯ
  choice: не давайте
  rationale: Запретительная конструкция ⲙⲡⲣ с инфинитивом передана прямым отрицательным повелением; ϯ означает «давать».
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: святыни
  rationale: Субстантивированное прилагательное буквально означает «то, что свято». «Святыня» естественно и ёмко передаёт предметное значение, не уточняя природу святого.
- source_word: ⲛⲡⲟⲩϩⲟⲣ
  choice: псам
  rationale: Форма обозначает собак во множественном числе; «псам» сохраняет краткий, афористичный и достойный регистр.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: чтобы … не
  rationale: Предупредительно-целевое значение естественно передаётся современной русской конструкцией «чтобы не».
- source_word: ⲛⲟⲩⲛⲟⲩϫⲉⲛⲧⲟⲟⲩ
  choice: они не бросили их
  rationale: Глагол означает «бросать», а объектный суффикс имеет множественное число («их»). Грамматическое несогласование с единственным числом «святыни» сохранено как особенность рукописного текста.
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: навозную кучу
  rationale: Греческое заимствование обозначает навозную или мусорную кучу; выбран конкретный и понятный русский эквивалент.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: не бросайте
  rationale: Сохранён повтор того же глагола, что и в первой части изречения.
- source_word: ⲛⲡⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: жемчуга
  rationale: Заимствованное существительное означает жемчуг/жемчужины; форма «жемчуга» естественно сочетается с отрицательным повелением и допускает собирательное восприятие.
- source_word: ⲛⲡⲉϣⲁⲩ
  choice: свиньям
  rationale: Обычное современное обозначение свиней во множественном числе.
- source_word: ϩⲓⲛⲁ ϫⲉ
  choice: чтобы … не
  rationale: Сохраняет предупредительно-целевую связь и синтаксический параллелизм двух частей.
- source_word: ⲛⲧⲟⲟⲩⲉⲓⲣⲉⲛⲧⲟϥ
  choice: они не сделали с ним
  rationale: Сохраняются читаемые элементы «они делают» и местоимение единственного числа; содержание действия не восполняется по параллельным традициям.
theological_decisions:
- issue: Смысл «святыни»
  choice: Не уточнять, что именно является святыней
  alternative: Истолковать как священное учение, таинство или жертву
  rationale: Коптский текст оставляет обозначение общим; конфессиональное или предметное уточнение было бы толкованием.
- issue: Утраченное действие свиней
  choice: Оставить лакуну после сохранённого «сделали с ним»
  alternative: Восстановить «растоптали» по Мф 7:6
  rationale: Рукопись не сохраняет достаточного текста для уверенного восстановления; влияние канонической параллели не должно подменять свидетельство данного источника.
translation_notes:
  register: Современный литературный русский с кратким афористичным строем. Архаизирующее «псам» уместно как устойчивое и понятное слово, тогда как синтаксис остаётся современным. Необычные местоименные несогласования источника («святыня» — «их»; «жемчуга» — «с ним») намеренно сохранены и не гармонизированы.
