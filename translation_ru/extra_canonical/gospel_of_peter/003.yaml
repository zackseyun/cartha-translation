base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/003.yaml
  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: ru
  text: 'И он отдал Его народу перед первым днём их праздника Опресноков. (6) Те, кто взял Господа, бежали, толкая Его и говоря: «Потащим Сына Божьего, имея над Ним власть!»


    (7) Они облачили Его в пурпур и усадили на судейское место, говоря: «Суди справедливо, царь Израиля!» (8) Один из них принёс терновый венец и возложил его на голову Господа.


    (9) Одни из стоявших рядом плевали Ему в лицо, другие били Его по щекам. Иные кололи Его тростью, а некоторые бичевали Его, говоря: «Этой честью почтим Сына Божьего!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: handed him over
  choice: отдал Его
  rationale: Передаёт акт выдачи без уточнения юридического или военного характера, которого свидетель явно не выражает.
- source_word: festival of the Unleavened Bread
  choice: праздника Опресноков
  rationale: Устоявшееся и понятное русское обозначение иудейского праздника; притяжательное «их» сохранено.
- source_word: purple
  choice: пурпур
  rationale: Сохраняет царскую символику и не уточняет вид одежды, не названный в доступном свидетельстве.
- source_word: seat of judgment
  choice: судейское место
  rationale: Передаёт функцию места, не вводя более специальный термин вроде «судилище», который менее понятен современному читателю.
- source_word: thorn crown
  choice: терновый венец
  rationale: Традиционное литературное выражение, естественное в русском библейском контексте.
- source_word: piercing him with a reed
  choice: тыкали в Него тростью
  rationale: 'Не усиливает действие до буквального пронзания тела: английское свидетель допускает колющее, мучительное тыканье тростью.'
theological_decisions:
- issue: Насмешливое заявление о власти над Сыном Божьим
  choice: «теперь Он в нашей власти»
  alternative: «имея власть над Ним»
  rationale: Естественно передаёт притязание мучителей, сохраняя его ироническое богословское напряжение и не утверждая от лица рассказчика, что их власть абсолютна.
- issue: Обращение «царь Израиля»
  choice: сохранено буквально и со строчной буквы в прямой речи
  alternative: «Царь Израилев»
  rationale: Современная форма сохраняет мессианский титул и насмешливый контекст без архаизации.
- issue: Повтор титула «Сын Божий»
  choice: сохранён без ослабления
  alternative: «Божий Сын»
  rationale: Передаёт явную христологическую формулировку свидетельства и её намеренно издевательское употребление говорящими.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным повествовательным регистром. Сохранены номера стихов и резкие повторы исходного рассказа. Проект предварительный: предоставлена английская версия греческого свидетельства, тогда как прямая сверка с греческим текстом ещё ожидается.'
