review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт последовательность событий и ключевые образы. Однако в ст. 19 «она была вознесена» грамматически назначает «Силу» субъектом вознесения, хотя греческое ἀνελήφθη — пассивная форма без выраженного существительного и в повествовательном ходе естественно отсылает к Господу; английское «it was taken up» намеренно не разрешает этой трудности. Также «на своей голове» неудачно передаёт множественный референт αὐτῶν / «their own heads».
  naturalness: Регистр в основном современный литературный и уместно сдержанно возвышенный. «Они были встревожены и обеспокоены» несколько тавтологично, но допустимо как передача двух глаголов. Формула «умножили грехи на своей голове» звучит неестественно и допускает ошибочное единственное число.
  terminology: «Иудея», «желчь», «кислое вино», «светильники» и «завеса ... храма» удачны. «Сила Моя, Сила» обоснованно сохраняет отличительную лексику этого свидетельства и не должна гармонизироваться с каноническими евангелиями.
  issues:
  - severity: high
    issue: 'Ст. 19: «она была вознесена»'
    rationale: Женское местоимение в русском однозначно связывает вознесение с «Силой». В исходной пассивной форме субъект не назван; такая редакция вносит конкретное, спорное толкование. Следует не делать «Силу» субъектом и пояснить синтаксическую трудность в сноске.
  - severity: medium
    issue: 'Ст. 17: «умножили грехи на своей голове»'
    rationale: Единственное «своей голове» плохо соответствует группе «они» и русской норме. «Умножили грехи на своих головах» сохраняет намеренно резкий образ без добавления толкования.
  - severity: low
    issue: 'Ст. 15: «Ведь для них написано»'
    rationale: «Ведь» добавляет разговорно-объяснительный оттенок, а «для них написано» менее естественно для ссылки на предписание. «Ибо им написано» ближе к формуле γέγραπται γὰρ αὐτοῖς и сохраняет её несколько необычную адресность.
  revised_text: '(15) Был полдень, и тьма объяла всю Иудею. Они были встревожены и обеспокоены, как бы солнце не зашло, пока Он ещё жив. Ибо им написано: «Солнце да не зайдёт над убитым». (16) И один из них сказал: «Дайте Ему выпить желчи с кислым вином». Они смешали и дали Ему выпить. (17) Так они исполнили всё и умножили грехи на своих головах. (18) Многие ходили со светильниками, думая, что наступила ночь, и некоторые падали.


    (19) И Господь возгласил: «Сила Моя, Сила, Ты оставила Меня!» И, сказав это, Он был вознесён[a]. (20) И в тот самый час завеса Иерусалимского храма разорвалась надвое.'
  revised_footnotes:
  - marker: a
    text: 'Греч. буквально: «был взят вверх» / «был вознесён». Пассивная форма не называет субъекта. В повествовательном ходе она обычно относится к Господу; однако значение и богословский смысл этого краткого сообщения остаются предметом обсуждения.'
    reason: Исправляет ошибочное отнесение вознесения к «Силе», при этом отмечая невыраженный субъект и не навязывая богословского объяснения.
  revision_rationale: Нужна безопасная правка. Она устраняет в ст. 19 добавленное русским женским местоимением толкование, согласует образ ст. 17 с множественным субъектом и делает формулу ст. 15 естественнее, не меняя содержания свидетельства. Сноска сохранена у ст. 19 и уточнена в соответствии с греческой синтаксической неоднозначностью.
