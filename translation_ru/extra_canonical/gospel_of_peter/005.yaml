base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: ru
  text: '(15) Был полдень, и тьма объяла всю Иудею. Они были встревожены и обеспокоены, как бы солнце не зашло, пока Он ещё жив. Ведь для них написано: «Солнце да не зайдёт над убитым». (16) И один из них сказал: «Дайте Ему выпить желчи с кислым вином». Они смешали и дали Ему выпить. (17) Так они исполнили всё и умножили грехи на своей голове. (18) Многие ходили со светильниками, думая, что наступила ночь, и некоторые падали.


    (19) И Господь возгласил: «Сила Моя, Сила, Ты оставила Меня!» Когда Он сказал это, она была вознесена[a]. (20) И в тот самый час завеса Иерусалимского храма разорвалась надвое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «она была взята вверх» или «она была вознесена». Неясно, относится ли это к названной перед тем «Силе» или подразумевает нечто иное.'
    reason: Сохраняет грамматическую и богословскую неоднозначность выражения «it was taken up».
lexical_decisions:
- source_word: darkness held fast over all Judea
  choice: тьма объяла всю Иудею
  rationale: Передаёт охват и устойчивость тьмы естественным, литературным русским выражением без усиления до прямо не указанной сверхъестественной причины.
- source_word: bile with sour wine
  choice: желчи с кислым вином
  rationale: Сохраняет два компонента свидетельства и не подменяет «кислое вино» более конфессионально привычным словом «уксус».
- source_word: accumulated the sins on their head
  choice: умножили грехи на своей голове
  rationale: Сохраняет необычный образ исходного свидетельства и коллективное значение при грамматически естественном единственном числе в устойчивой конструкции.
- source_word: lanterns
  choice: светильниками
  rationale: Нейтральное древнее обозначение переносных источников света; «фонари» могло бы звучать излишне современно.
- source_word: My Power, the Power
  choice: Сила Моя, Сила
  rationale: Сохраняет повтор и грамматически женский род слова «Сила», важный для последующего неоднозначного местоимения.
- source_word: veil of the temple
  choice: завеса Иерусалимского храма
  rationale: Естественно обозначает храмовую завесу и ясно сохраняет указание на Иерусалим.
theological_decisions:
- issue: К чему относится фраза «она была вознесена»
  choice: Сохранить женское местоимение с примечанием о неоднозначности
  alternative: Истолковать как вознесение духа, души или Самого Господа
  rationale: Ближайший грамматический антецедент — «Сила», однако смысл фразы остаётся неясным. Перевод не должен разрешать богословское напряжение без достаточных оснований.
- issue: Форма обращения в словах Господа
  choice: «Сила Моя, Сила, Ты оставила Меня!»
  alternative: Гармонизировать с каноническим «Боже Мой, Боже Мой, почему Ты Меня оставил?»
  rationale: Данное свидетельство читает «Сила», а не «Бог», и его отличительную формулировку необходимо сохранить.
- issue: Кто обозначен местоимением «они»
  choice: Оставить субъект неуточнённым
  alternative: Назвать иудеев, воинов или распинателей
  rationale: В отрывке референт не назван однозначно; уточнение могло бы внести отсутствующее в свидетельстве обвинение.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным повествовательным регистром. Заглавные местоимения при обращении ко Христу использованы как русская издательская норма данного проекта, без добавления толкования. Проект предварительный: предоставлена английская переводная фиксация греческого свидетельства, тогда как непосредственная сверка с греческим источником ещё ожидается.'
