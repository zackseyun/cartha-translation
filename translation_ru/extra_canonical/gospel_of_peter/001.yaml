base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: ru
  text: '(1) Но никто из иудеев не омыл рук — ни Ирод, ни один из его судей. Когда они не захотели омыть руки, Пилат встал. (2) Тогда царь Ирод велел привести Господа и сказал им: «Сделайте с Ним всё, что я повелел вам сделать».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному общедоступному английскому свидетельству Ахмимского кодекса (P.Cair. 10759); сверка с греческим текстом ещё не проведена.'
    reason: Необходимо ясно обозначить ограничение источниковой базы и не создавать впечатления завершённого перевода непосредственно с греческого.
lexical_decisions:
- source_word: washed the hands
  choice: омыл рук / омыть руки
  rationale: Сохранён библейский образ омовения рук; в первом случае естественная русская конструкция с родительным падежом при отрицании, во втором — винительный падеж при инфинитиве.
- source_word: stood up
  choice: встал
  rationale: Передаёт прямое значение английского свидетельства, не истолковывая действие как уход или прекращение заседания.
- source_word: the Lord
  choice: Господа
  rationale: Сохранён христологически значимый титул исходного свидетельства без замены именем Иисус.
- source_word: judges
  choice: судей
  rationale: Выбрано прямое юридическое обозначение, без уточнения их должности или принадлежности к совету.
theological_decisions:
- issue: Ответственность Ирода и иудейских судей в сцене омовения рук
  choice: 'Сохранено прямое утверждение свидетельства: «никто из иудеев… ни Ирод, ни один из его судей»'
  alternative: Сгладить формулировку или согласовать её с каноническими рассказами о суде
  rationale: Перевод не должен гармонизировать самостоятельное свидетельство с другими повествованиями или усиливать его полемическую направленность.
- issue: К кому обращены слова Ирода
  choice: Сохранено местоимение «им» без уточнения адресатов
  alternative: Назвать адресатов судьями, иудеями или стражниками
  rationale: Английское свидетельство не устраняет неоднозначность, поэтому перевод её сохраняет.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён лишь настолько, чтобы текст был понятен обычному читателю; неоднозначность адресата во 2-м стихе и необычная связь Ирода с «иудеями» не устранены.
