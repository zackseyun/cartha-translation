base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: ru
  text: '(28) Книжники, фарисеи и старейшины собрались вместе, услышав, как весь народ ропщет, бьёт себя в грудь и говорит: «Если при его смерти произошли эти величайшие знамения, то посмотрите, каким праведником он был!»


    (29) Старейшины испугались и пошли к Пилату, умоляя его: (30) «Дай нам воинов, чтобы мы три дня охраняли его могилу. Иначе его ученики могут прийти и похитить его, а народ подумает, что он воскрес из мёртвых, и причинит нам зло».


    (31) Пилат дал им сотника Петрония с воинами охранять гробницу. Старейшины и книжники пошли вместе с ними к могиле. (32) Вместе с сотником и воинами они подкатили большой камень, и все находившиеся там поставили его у входа в гробницу. (33) Они наложили на него семь печатей, поставили там палатку и несли стражу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: grumbling
  choice: ропщет
  rationale: Передаёт недовольный, тревожный говор толпы в естественном и достойном русском регистре.
- source_word: just
  choice: праведником
  rationale: В данном религиозно-нравственном контексте «праведник» точнее простого «справедливый», не устраняя оценочного характера возгласа.
- source_word: grave / tomb
  choice: могила / гробница
  rationale: Сохранено наблюдаемое в свидетельстве чередование обозначений места погребения; «гробница» также естественно сочетается со входом и запечатыванием.
- source_word: centurion
  choice: сотник
  rationale: Устоявшееся русское обозначение римского воинского чина, понятное широкому читателю.
- source_word: kept watch
  choice: стали нести стражу
  rationale: Естественно передаёт организованную длительную охрану у гробницы.
theological_decisions:
- issue: Оценка умершего народом
  choice: «каким праведником он был»
  alternative: «каким справедливым он был»
  rationale: Сохраняет нравственно-религиозный смысл высказывания, не добавляя прямого титула и не отождествляя реплику с формулой вероучения.
- issue: Опасение, что народ поверит в воскресение
  choice: «народ подумает, что он воскрес из мёртвых»
  alternative: «народ поверит, что он воскрес из мёртвых»
  rationale: «Подумает» ближе к предоставленному свидетельству и сохраняет взгляд говорящих, не решая вопрос об истинности события от лица повествователя.
- issue: Неясная фраза о подкатывании камня
  choice: Необычная синтаксическая связь сохранена в тексте и отмечена сноской
  alternative: Исправить смысл на «вместе с сотником и воинами подкатили большой камень»
  rationale: Поскольку непосредственная сверка с греческим источником ещё не выполнена, нельзя молча устранять засвидетельствованную трудность.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством, без архаизмов. Перевод предварительный: он основан на предоставленном англоязычном свидетельстве, поскольку прямая проверка греческого текста Ахмимского кодекса ещё не проведена.'
