review_pass:
  verdict: revise
  source_fidelity: В ст. 32 греческое μετὰ τοῦ κεντυρίωνος καὶ τῶν στρατιωτῶν естественно означает «вместе с сотником и воинами», а не «подкатили камень к сотнику и воинам». Поэтому необычный английский порядок слов не следует сохранять в русском как текстуальную неясность. В остальном передача последовательности событий и опасения старейшин верна. «Праведником» уместно передаёт δίκαιος в данном контексте; «воскрес из мёртвых» точно передаёт ἐκ νεκρῶν ἀνέστη.
  naturalness: Текст в целом литературный и ясный. Исправление ст. 32 устраняет неестественную синтаксическую связь. «Поставили палатку» несколько нейтральнее и современнее, чем «разбили шатёр»; «несли стражу» передаёт продолженное наблюдение без добавочного начинательного оттенка «стали».
  terminology: «Книжники», «фарисеи», «старейшины», «сотник», «гробница», «печати» и «воскрес из мёртвых» выдержаны последовательно и соответствуют жанру. Чередование «могила» и «гробница» отражает различение τάφος/μνημεῖον в данном отрывке и допустимо.
  issues:
  - severity: high
    issue: 'Неверно передана связь в ст. 32: «Подкатив большой камень к сотнику и воинам».'
    rationale: Греческое μετὰ тоῦ κεντυρίωνος καὶ τῶν στρατιωτῶν имеет обычное значение «вместе с сотником и воинами». Сноска справедливо замечает трудность английского свидетельства, но прямая исходная формулировка позволяет безопасно устранить ошибочное прочтение.
  - severity: low
    issue: «Стали нести стражу» добавляет начинательный оттенок.
    rationale: Причастная конструкция с ἐφύλασσον сообщает, что они несли/держали стражу; простое прошедшее время точнее и естественнее.
