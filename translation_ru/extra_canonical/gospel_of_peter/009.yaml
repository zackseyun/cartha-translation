base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: ru
  text: (34) Когда наступило утро субботы, множество людей из Иерусалима и окрестностей отправилось посмотреть на запечатанную гробницу. (35) Но ночью, прежде чем рассвело утро Господнего дня, когда воины по двое несли стражу, на небе раздался громкий голос. (36) Они увидели, как небеса раскрылись и оттуда сошли два мужа, обладавшие великим сиянием, и приблизились к гробнице. (37) Камень же, положенный у входа, сам собой откатился и лишь отчасти отодвинулся в сторону. Гробница открылась, и оба юноши вошли внутрь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству; непосредственная сверка с греческим текстом Ахмимского кодекса ещё не проведена. Необычное указание в ст. 37 означает, что камень лишь отчасти отодвинулся в сторону.'
    reason: Открыто обозначает косвенную основу перевода и сохраняет необычную, не вполне ясную деталь о частичном смещении камня без её истолкования как полного освобождения прохода.
lexical_decisions:
- source_word: Sabbath
  choice: суббота
  rationale: Сохраняет временное обозначение свидетеля без замены на более интерпретирующее выражение.
- source_word: grave / tomb
  choice: гробница
  rationale: Единообразное современное обозначение погребального сооружения; избегает возможного понимания слова «могила» как земляной ямы.
- source_word: Lord's day
  choice: Господний день
  rationale: Формально сохраняет выражение свидетеля и его раннехристианскую терминологию, не подменяя его словом «воскресенье».
- source_word: two men / young men
  choice: два мужа / оба юноши
  rationale: 'Сохранена смена обозначений в тексте: сначала «мужи», затем «юноши», без искусственного выравнивания.'
- source_word: having much radiance
  choice: окружённые великим сиянием
  rationale: Передаёт зрительный образ естественным и возвышенным русским языком, не добавляя прямого отождествления с ангелами.
- source_word: made way in part
  choice: отчасти освободил проход
  rationale: Сохраняет необычную деталь о лишь частично открывшемся проходе, а не устраняет её как неясность.
theological_decisions:
- issue: Природа двух сошедших мужей
  choice: Не называть их ангелами
  alternative: Перевести или пояснить как «два ангела»
  rationale: Свидетель называет их мужами, а затем юношами; явное богословское отождествление отсутствует.
- issue: Значение выражения «Господний день»
  choice: Сохранить буквальное наименование
  alternative: Передать как «воскресенье»
  rationale: Так сохраняются древняя формулировка и возможная терминологическая значимость без скрытого истолкования.
- issue: Голос в небесной сфере
  choice: «на небе раздался громкий голос»
  alternative: «с неба раздался громкий голос»
  rationale: Исходный английский свидетель говорит о голосе «in heaven»; перевод не меняет местонахождение на направление происхождения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены повторения, смена «мужи/юноши» и необычная деталь о частично освобождённом проходе. Термин «воины» выбран как естественный для древнего повествования; «несли стражу» передаёт функцию охраны без канцелярской тяжеловесности.
