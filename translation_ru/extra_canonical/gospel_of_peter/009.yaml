revisions:
- from: (34) Когда наступило утро субботы, множество людей из Иерусалима и окрестностей отправилось посмотреть на запечатанную гробницу. (35) Но ночью, прежде чем рассвело утро Господнего дня, когда воины, сменяясь по двое, несли стражу, на небе раздался громкий голос. (36) Они увидели, как небеса раскрылись и оттуда сошли два мужа, окружённые великим сиянием, и приблизились к гробнице. (37) Камень же, положенный у входа, сам собой откатился и отчасти освободил проход. Гробница открылась, и оба юноши вошли внутрь.[a]
  to: (34) Когда наступило утро субботы, множество людей из Иерусалима и окрестностей отправилось посмотреть на запечатанную гробницу. (35) Но ночью, прежде чем рассвело утро Господнего дня, когда воины по двое несли стражу, на небе раздался громкий голос. (36) Они увидели, как небеса раскрылись и оттуда сошли два мужа, обладавшие великим сиянием, и приблизились к гробнице. (37) Камень же, положенный у входа, сам собой откатился и лишь отчасти отодвинулся в сторону. Гробница открылась, и оба юноши вошли внутрь.[a]
