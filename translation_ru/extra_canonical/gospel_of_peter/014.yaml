  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: ru
  text: (58) Настал последний день праздника Пресных хлебов. Праздник окончился, и многие уходили, возвращаясь по домам. (59) А мы, двенадцать учеников Господа, плакали и скорбели; и каждый из нас, скорбя о случившемся, вернулся домой. (60) Я же, Симон Пётр, и брат мой Андрей взяли сети и пошли к морю. С нами был и Левий, сын Алфея, которого Господь…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: На этих словах сохранившийся текст рукописи обрывается.
    reason: Поясняет, что многоточие обозначает утраченный конец рукописи, а не стилистическое умолчание переводчика.
lexical_decisions:
- source_word: Unleavened Bread
  choice: праздник Пресных хлебов
  rationale: Название иудейского праздника передано в общепринятой русской библейской форме; слово «праздник» добавлено для ясности естественного русского текста.
- source_word: the twelve disciples of the Lord
  choice: двенадцать учеников Господа
  rationale: Сохранено прямое обозначение группы и принадлежности Господу без попытки согласовать его с последующим перечислением персонажей.
- source_word: grieving
  choice: скорбели / скорбя
  rationale: Повтор исходного свидетельства сохранён, поскольку он подчёркивает продолжающееся переживание учеников.
- source_word: went off to the sea
  choice: пошли к морю
  rationale: Естественная русская формулировка, не уточняющая ни конкретное море, ни цель пути сверх имеющихся данных.
- source_word: Levi, the son of Alphaeus
  choice: Левий, сын Алфея
  rationale: Использованы традиционные русские формы библейских имён.
theological_decisions:
- issue: Упоминание «двенадцати учеников» после событий страстного повествования
  choice: 'Сохранить буквально: «двенадцать учеников Господа»'
  alternative: 'Передать менее определённо: «мы, ученики Господа»'
  rationale: Число прямо присутствует в доступном свидетельстве; возможное повествовательное или текстологическое напряжение не следует устранять переводом.
- issue: Незавершённое определительное предложение о Левии
  choice: Сохранить «которого Господь…» и обозначить обрыв многоточием
  alternative: Удалить незавершённую часть или предположительно дополнить её
  rationale: Рукопись обрывается, поэтому восстановление отсутствующего содержания было бы необоснованным.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Перевод предварительный: предоставлено английское публично-доменное свидетельство, а непосредственная сверка с греческим текстом ещё не выполнена. Синтаксис упрощён лишь там, где это необходимо для естественности русского повествования; повтор скорби и смысловая незавершённость сохранены.'
