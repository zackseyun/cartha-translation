base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: ru
  text: '(3) Там стоял Иосиф, друг Пилата и Господа. Увидев, что Его собираются распять, он пошёл к Пилату и попросил тело Господа для погребения. (4) Пилат послал к Ироду и попросил у него тело.


    (5) Ирод сказал: «Брат Пилат, даже если бы никто не попросил отдать Его, мы всё равно похоронили бы Его, потому что уже наступает суббота. Ведь в Законе написано: „Солнце не должно зайти над убитым“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: friend of Pilate and the Lord
  choice: друг Пилата и Господа
  rationale: 'Сохранена координация исходного свидетельства: Иосиф назван другом как Пилата, так и Господа; неоднозначность характера этих отношений не уточняется.'
- source_word: asked for the body ... for burial
  choice: попросил тело Господа для погребения
  rationale: Естественная русская формулировка, точно передающая просьбу выдать тело с целью погребения.
- source_word: having sent to Herod
  choice: послал к Ироду
  rationale: Передаёт эллиптическую идею отправки посланника или сообщения, не добавляя неуказанного субъекта.
- source_word: Sabbath is beginning
  choice: уже наступает суббота
  rationale: Выражает приближение начала субботнего дня естественным современным русским языком.
- source_word: one who has been killed
  choice: убитым
  rationale: Сохранено общее обозначение погибшего насильственной смертью без замены более конфессионально окрашенным выражением.
theological_decisions:
- issue: Связь Иосифа с Пилатом и Господом
  choice: «друг Пилата и Господа»
  alternative: «друг Пилата, преданный Господу»
  rationale: Выбран буквальный синтаксический параллелизм; альтернативный вариант истолковывает разные отношения и снимает неоднозначность.
- issue: Формулировка правового основания погребения
  choice: «Солнце не должно зайти над убитым»
  alternative: гармонизация с канонической формулировкой Второзакония 21:23
  rationale: Сохранена форма цитаты именно данного свидетельства без молчаливого приведения к тексту другой библейской традиции.
- issue: Местоимения о теле Иисуса
  choice: «попросил отдать Его… похоронили бы Его»
  alternative: «попросил тело… похоронили бы тело»
  rationale: Личное местоимение естественно по-русски и сохраняет отношение к умершему как к лицу; прописная буква следует принятому достоинственному регистру перевода.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Черновик основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с греческим текстом Ахмимского кодекса ещё требуется. Поэтому спорные тонкости греческой лексики и синтаксиса не заявляются как окончательно установленные.
