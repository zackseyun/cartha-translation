base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: ru
  text: '(55) Придя, они обнаружили, что гробница была открыта. Подойдя ближе, они наклонились и увидели там некоего юношу, сидевшего посреди гробницы. Он был прекрасен и облачён в ослепительно сияющее одеяние. Он сказал им: (56) «Зачем вы пришли? Кого ищете? Не того ли, кто был распят? Он воскрес и ушёл. Если же вы не верите, наклонитесь и посмотрите на место, где он лежал: его там нет, потому что он воскрес и ушёл туда, откуда был послан».


    (57) Тогда женщины испугались и убежали.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tomb
  choice: гробница
  rationale: Современное и понятное обозначение высеченного погребального помещения; «гроб» мог бы ошибочно восприниматься как переносной ящик.
- source_word: a certain young man
  choice: некий юноша
  rationale: Сохраняет неопределённость свидетеля и не отождествляет персонажа с ангелом.
- source_word: beautiful
  choice: прекрасен
  rationale: Передаёт прямую характеристику внешности без добавочного толкования.
- source_word: long, shining robe
  choice: длинное сияющее одеяние
  rationale: Сохраняет оба признака одежды и выдерживает dignified современный регистр.
- source_word: arose
  choice: воскрес
  rationale: В контексте распятия, пустой гробницы и отсутствия тела русское «воскрес» естественно передаёт значение вставания из мёртвых.
- source_word: went away
  choice: ушёл
  rationale: Сохраняет простое пространственное значение и последовательность повторяющейся формулы.
theological_decisions:
- issue: Личность юноши в гробнице
  choice: Не называть его ангелом
  alternative: «ангел»
  rationale: Свидетель прямо говорит о некоем юноше; явное отождествление с ангелом устранило бы сохранённую в тексте неопределённость.
- issue: Значение «he arose»
  choice: «Он воскрес»
  alternative: «Он поднялся» или «Он встал»
  rationale: Непосредственный контекст распятого, прежде лежавшего здесь, указывает на воскресение; при этом перевод не развивает способ или природу воскресения.
- issue: Фраза «туда, откуда пришёл»
  choice: Сохранить без пояснения
  alternative: Уточнить как возвращение на небо или к Отцу
  rationale: Исходная формулировка допускает богословскую глубину, но сама не называет место; пояснение искусственно разрешило бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Причастные нагромождения английского свидетеля упрощены ради естественности, но повторы «воскрес и ушёл» сохранены. Черновик остаётся предварительным, поскольку прямая сверка с греческим текстом Ахмимского кодекса ещё не выполнена.
