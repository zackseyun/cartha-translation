  to: '(55) Придя, они обнаружили, что гробница была открыта. Подойдя ближе, они наклонились и увидели там некоего юношу, сидевшего посреди гробницы. Он был прекрасен и облачён в ослепительно сияющее одеяние. Он сказал им: (56) «Зачем вы пришли? Кого ищете? Не того ли, кто был распят? Он воскрес и ушёл. Если же вы не верите, наклонитесь и посмотрите на место, где он лежал: его там нет, потому что он воскрес и ушёл туда, откуда был послан».


