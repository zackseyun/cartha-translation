revisions:
- from: '(10) Они привели двух преступников и распяли Господа между ними, но Он молчал, словно не испытывал боли. (11) Когда они подняли крест, то написали: «Это Царь Израиля». (12) Разложив перед Ним Его одежды, они разделили их и бросили о них жребий.


