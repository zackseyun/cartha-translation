base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: ru
  text: '(10) Они привели двух преступников и распяли Господа между ними, но Он молчал, словно не испытывал боли. (11) Когда они воздвигли крест, то написали: «Это Царь Израиля». (12) Положив перед Ним Его одежды, они разделили их и бросили о них жребий.


    (13) Но один из тех преступников упрекнул их, говоря: «Мы страдаем так за совершённое нами зло; но Он стал Спасителем человечества — какое зло Он причинил вам?»


    (14) Они разгневались на него и приказали не перебивать ему голеней, чтобы он умер в мучениях.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Не вполне ясно, к кому относится «ему»: оно может указывать на преступника, который укорил распинавших, либо на Господа.'
    reason: Сохраняет неоднозначность референта в свидетельстве и не закрепляет спорное толкование в основном тексте.
lexical_decisions:
- source_word: wrongdoers
  choice: преступники
  rationale: Современное и ясное обозначение людей, совершивших преступления; естественно звучит в повествовании о распятии.
- source_word: the Lord
  choice: Господь
  rationale: Сохраняет титул исходного свидетельства без добавочного толкования.
- source_word: king of Israel
  choice: Царь Израиля
  rationale: Устоявшаяся и точная передача царского титула; прописная буква уместна в надписи о конкретном лице.
- source_word: Savior of humanity
  choice: Спаситель человечества
  rationale: Передаёт универсальный охват выражения и сохраняет его богословскую силу.
- source_word: legs not be broken
  choice: не перебивать ему голеней
  rationale: «Перебить голени» точно и естественно обозначает ломание ног распятым; местоимение отражает непосредственный контекст, а референт поясняется с сохранением неопределённости в сноске.
theological_decisions:
- issue: Молчание Господа и отсутствие боли
  choice: «словно не испытывал боли»
  alternative: «как будто Ему не было больно»
  rationale: Сохраняет сравнительную, а не категорическую формулировку и не разрешает христологическое напряжение текста.
- issue: Фраза о том, что Иисус «стал Спасителем человечества»
  choice: «Он стал Спасителем человечества»
  alternative: «Он — Спаситель человечества»
  rationale: Сохранён глагольный элемент исходного свидетельства; статичная переформулировка устранила бы потенциально значимый оттенок.
- issue: Чьи голени приказано не перебивать
  choice: В тексте оставлено местоименное указание, а неоднозначность отмечена сноской
  alternative: Явно указать либо преступника, либо Иисуса
  rationale: Контекст допускает соотнесение с преступником, укорившим палачей, однако формулировка свидетельства не позволяет с полной уверенностью исключить иной референт; богословски значимую неоднозначность нельзя устранять молча.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён лишь там, где буквальное воспроизведение английского свидетельства звучало бы неестественно. Поскольку непосредственная сверка с греческим текстом ещё не проведена, решения остаются предварительными и основаны на предоставленном публичном английском свидетельстве.
