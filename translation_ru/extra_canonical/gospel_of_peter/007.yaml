  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: ru
  text: 'Тогда иудеи, старейшины и священники, осознав, сколько зла они причинили самим себе, стали скорбеть и говорить: «Горе нам из-за наших грехов! Близки суд и конец Иерусалима!»


    Я же и мои спутники были опечалены и глубоко уязвлены. Мы скрывались, потому что нас разыскивали как преступников, будто мы хотели сжечь храм.[a] Вдобавок ко всему мы постились, сидели, скорбели и плакали день и ночь — до субботы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как злодеев и людей, желавших сжечь храм». Перевод предварительный: сверка с греческим текстом Ахмимского кодекса ещё не проведена.'
    reason: Предоставленное основание — английское свидетельство, а сочетание двух характеристик разыскиваемых допускает несколько синтаксических оттенков; читателю также важно знать об отсутствии завершённой проверки по греческому источнику.
lexical_decisions:
- source_word: the Jews
  choice: иудеи
  rationale: Передаёт историко-религиозное обозначение нейтральнее и точнее, чем современное этническое «евреи»; перечисление «старейшины и священники» сохранено без попытки устранить возможное пересечение групп.
- source_word: how much wrong they had done to themselves
  choice: сколько зла они причинили самим себе
  rationale: Сохраняет рефлексивный смысл свидетельства и не заменяет его более привычным, но иным утверждением о зле, причинённом Иисусу.
- source_word: being wounded in mind
  choice: глубоко уязвлены
  rationale: Естественно передаёт сильную внутреннюю душевную боль, не вводя буквального представления о телесной ране.
- source_word: wrongdoers
  choice: преступников
  rationale: По контексту речь идёт о разыскиваемых виновниках предполагаемого поджога; «злодеи» было бы менее конкретно и более оценочно.
- source_word: until the Sabbath
  choice: до субботы
  rationale: Сохраняет временную границу без уточнения, включалась ли сама суббота в описанный период.
theological_decisions:
- issue: Коллективное обозначение «иудеи»
  choice: Сохранено как обозначение действующих лиц данного повествования, рядом с отдельно названными старейшинами и священниками
  alternative: Конкретизировать как «иудейские власти» или «народ»
  rationale: Имеющийся английский свидетель не позволяет с уверенностью сузить референт; конкретизация могла бы снять подлинную текстовую неоднозначность.
- issue: «Суд и конец Иерусалима»
  choice: Сохранены оба существительных без истолкования характера суда и конца
  alternative: Передать как «осуждение и гибель Иерусалима»
  rationale: Более истолковывающий вариант усилил бы эсхатологический или историко-политический смысл, который нельзя уверенно установить по предоставленному основанию.
- issue: Обвинение в намерении сжечь храм
  choice: Передано как предъявляемое разыскивающими обвинение
  alternative: Утвердительно сообщить, что спутники хотели сжечь храм
  rationale: Синтаксис контекста описывает, за кого их принимали или в чём обвиняли, а не подтверждает истинность обвинения.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис слегка упрощён ради ясности, но перечисления, эмоциональная напряжённость и неоднозначные места сохранены. Нумерация стихов опущена в соответствии с консультационным слоем POB.
