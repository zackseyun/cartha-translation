base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: ru
  text: '(21) Тогда они вынули гвозди из рук Господа и положили его на землю. Вся земля содрогнулась, и настал великий страх.


    (22) Затем засияло солнце, и оказалось, что был девятый час.[a] (23) Иудеи обрадовались и отдали Иосифу тело Господа для погребения, поскольку он видел всё доброе, что тот совершил.[b] (24) Иосиф взял Господа, омыл его, обернул льняным полотном и перенёс в свою гробницу, известную как «Сад Иосифа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Девятый час — примерно три часа дня при древнем счёте дневных часов.
    reason: Современному читателю древнее обозначение времени может быть непонятно.
  - marker: b
    text: 'В доступном английском свидетельстве местоимения допускают неоднозначность: не вполне ясно, к кому именно относится каждое «он». Прямое сопоставление с греческим текстом ещё требуется.'
    reason: Сохраняет отмеченную источником неоднозначность и честно указывает на предварительный характер перевода.
lexical_decisions:
- source_word: drew the nails from the Lord's hands
  choice: вынули гвозди из рук Господа
  rationale: Передаёт конкретное физическое действие естественным современным русским языком, не усиливая жестокость сцены.
- source_word: placed him on the earth
  choice: положили его на землю
  rationale: Сохраняет повтор слова «земля» перед последующим сообщением о потрясении всей земли.
- source_word: the ninth hour
  choice: девятый час
  rationale: Сохранён древний способ счёта времени; пояснение дано в сноске, а не внесено в основной текст.
- source_word: linen
  choice: льняным полотном
  rationale: Естественно передаёт погребальную ткань, не уточняя её форму сверх доступного свидетельства.
- source_word: Joseph's Garden
  choice: Сад Иосифа
  rationale: Название передано буквально и сохранено как именование места.
theological_decisions:
- issue: Неясные местоименные связи в стихе 23
  choice: «поскольку он видел всё доброе, что тот совершил» с поясняющей сноской
  alternative: «поскольку Иосиф видел всё доброе, что совершил Господь»
  rationale: Основной текст остаётся понятным, но не превращает вероятные референты в безусловно установленные; сноска прямо отмечает неоднозначность доступного английского свидетельства.
- issue: Обозначение тела в стихе 23
  choice: «тело Господа»
  alternative: «его тело»
  rationale: Явное существительное устраняет неестественную для русского языка местоименную цепочку, не меняя смысла эпизода и не добавляя доктринального толкования.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Перевод предварительный: в предоставленных материалах имеется публично-доменное английское свидетельство, тогда как прямая сверка с греческим текстом Ахмимского кодекса ещё не выполнена. Архаизмы сведены к минимуму; традиционные термины «Господь», «девятый час» и «гробница» сохранены там, где они точно соответствуют контексту.'
