base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: ru
  text: '(43) Тогда те люди сообща решили пойти и доложить обо всём этом Пилату. (44) Пока они ещё размышляли об этом, вновь увидели, как раскрылись небеса, и оттуда сошёл некий человек и вошёл в гробницу. (45) Увидев это, сотник и те, кто был с ним, оставили гробницу, которую охраняли, и ночью поспешили к Пилату. В сильном смятении они рассказали обо всём, что видели, и сказали: «Воистину Он был Сыном Божьим!»


    (46) Пилат ответил: «Я невиновен в крови Сына Божьего, и вам это известно».[a]


    (47) Тогда все пришедшие стали умолять его и убеждать приказать сотнику и воинам никому не рассказывать о том, что они видели. (48) Они говорили: «Лучше нам оказаться виновными в великом грехе перед Богом, чем попасть в руки иудейского народа и быть побитыми камнями».[b] (49) И Пилат приказал сотнику и воинам никому ничего не рассказывать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В доступном английском свидетельстве последняя фраза буквально передана как «и это ясно нам». Возможны также: «и это нам ясно» или, по смыслу обращения, «и вам это известно».'
    reason: Сохраняет неопределённость местоименной отсылки, пока не проведена непосредственная сверка с греческим текстом.
  - marker: b
    text: Выражение «иудейский народ» находится в прямой речи пришедших к Пилату и передаёт их страх; оно не является общим суждением текста обо всех иудеях.
    reason: Предотвращает анахроничное или враждебное обобщение, не изменяя исторически трудную формулировку свидетельства.
lexical_decisions:
- source_word: report these things
  choice: доложить обо всём этом
  rationale: «Доложить» естественно передаёт официальный характер сообщения правителю, не делая речь канцелярской.
- source_word: the heavens
  choice: небеса
  rationale: Сохранён традиционный религиозно-повествовательный образ во множественном числе.
- source_word: a certain man
  choice: некий человек
  rationale: Сохранена намеренная неопределённость личности сошедшего; она не отождествляется с каким-либо персонажем.
- source_word: grave / tomb
  choice: гробница
  rationale: В контексте охраняемого места погребения «гробница» яснее современному читателю, чем многозначное «гроб».
- source_word: centurion
  choice: сотник
  rationale: Устоявшееся и понятное русское обозначение римского военного начальника.
- source_word: greatly distressed
  choice: в сильном смятении
  rationale: Передаёт сильное душевное потрясение без неоправданного уточнения, было ли это страхом, скорбью или тревогой.
- source_word: the Jewish people
  choice: иудейский народ
  rationale: Исторически и стилистически уместная передача коллективного обозначения; она не расширяет обвинение за пределы речи персонажей.
theological_decisions:
- issue: Исповедание «the Son of God»
  choice: «Сыном Божьим»
  alternative: «Сын Божий»
  rationale: Творительный падеж требуется русской конструкцией «Он был…» и сохраняет прямое христологическое утверждение текста.
- issue: Заявление Пилата о невиновности
  choice: «Я невиновен в крови Сына Божьего»
  alternative: «Я чист от крови Сына Божьего»
  rationale: «Невиновен в крови» яснее выражает непричастность к смерти, при этом сохраняет библейскую юридико-нравственную образность крови.
- issue: Неопределённость сошедшего человека
  choice: «некий человек»
  alternative: указать, что это ангел или воскресший Иисус
  rationale: Исходное свидетельство не называет его; богословское отождествление было бы интерпретационной добавкой.
- issue: Ответственность коллективной группы в стихе 48
  choice: сохранить слова о «иудейском народе» как прямую речь персонажей
  alternative: смягчить или обобщить как «народ» либо «власти»
  rationale: Перевод сохраняет напряжённую формулировку свидетельства, но не представляет её как голос переводчика или универсальное суждение об иудеях.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сделан ясным для обычного читателя, но сохранены повторения, неопределённость «некого человека» и богословски напряжённые утверждения. Поскольку предоставлена лишь английская версия греческого свидетельства и прямая сверка с Akhmim Codex ещё не проведена, спорные места отмечены осторожно; проект следует считать предварительным.
