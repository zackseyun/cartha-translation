review_pass:
  verdict: revise
  source_fidelity: Требуется правка. В ст. 46 черновик переводит английское свидетельство «this is clear to us» как «вам это известно», меняя лицо и смысл. В ст. 45 оборот «сотник и те, кто был с ним» прямо включает сотника в число очевидцев и посланцев, тогда как предоставленное свидетельство говорит о «тех, кто был с сотником». В ст. 44 добавлено «оттуда», которого в свидетельстве нет; его можно не вводить.
  naturalness: После правок текст остаётся естественным современным литературным русским. «Те, кто был при сотнике» точно и плавно передаёт группу без необоснованного включения самого сотника. «Увидели, как вновь открываются небеса» сохраняет образ продолжающегося открытия.
  terminology: «Небеса», «гробница», «сотник», «Сын Божий» и «иудейский народ» уместны. Формулировка об иудейском народе должна остаться в прямой речи персонажей; пояснительная сноска b корректно обозначает её повествовательскую функцию, не ослабляя текст.
  issues:
  - severity: high
    issue: 'Ст. 46: «и вам это известно»'
    rationale: Предоставленные исходный английский свидетель и английский POB содержат «and this is clear to us». Замена «нам» на «вам» не поддержана аудит-трейлом и существенно меняет реплику Пилата. Сноска не может компенсировать изменение основного текста.
  - severity: medium
    issue: 'Ст. 45: «сотник и те, кто был с ним»'
    rationale: Свидетельство говорит «those with the centurion», а не «the centurion and those with him». Следует передать группу при сотнике, не утверждая, что сотник сам уходил и докладывал.
  - severity: low
    issue: 'Ст. 44: добавлено «оттуда»'
    rationale: Нисхождение следует за видением открывающихся небес, но наречие «оттуда» отсутствует в предоставленном тексте. Его удаление точнее сохраняет формулировку свидетельства.
  revised_text: '(43) Тогда те люди сообща решили пойти и доложить обо всём этом Пилату. (44) Пока они ещё размышляли об этом, снова увидели, как открываются небеса, и некий человек сошёл и вошёл в гробницу. (45) Увидев это, те, кто был при сотнике, оставили гробницу, которую охраняли, и ночью поспешили к Пилату. В сильном смятении они рассказали обо всём, что видели, и сказали: «Воистину Он был Сыном Божьим!»


    (46) Пилат ответил: «Я невиновен в крови Сына Божьего, и нам это ясно».


    (47) Тогда все пришедшие стали умолять его и убеждать приказать сотнику и воинам никому не рассказывать о том, что они видели. (48) Они говорили: «Лучше нам оказаться виновными в великом грехе перед Богом, чем попасть в руки иудейского народа и быть побитыми камнями».[b] (49) И Пилат приказал сотнику и воинам никому ничего не рассказывать.'
  revised_footnotes:
  - marker: b
    text: Выражение «иудейский народ» находится в прямой речи пришедших к Пилату и передаёт их страх; оно не является общим суждением текста обо всех иудеях.
    reason: Сохраняет исторически трудную формулировку свидетельства в её повествовательском и речевом контексте, не меняя её значения.
  revision_rationale: Правка устраняет неподдержанное изменение лица в ст. 46, не приписывает действия сотнику в ст. 45 и убирает минимальное добавление в ст. 44. Сноска a удалена, потому что её предложенные варианты, в особенности «вам это известно», не соответствуют предоставленному английскому аудит-трейлу; оснований сохранять такую неопределённость без прямой греческой сверки нет. Сноска b сохранена и её якорь остаётся непосредственно после исторически трудной прямой речи.
