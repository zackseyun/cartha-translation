base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: ru
  text: '(50) На рассвете дня Господня Мария Магдалина, ученица Господа, из страха перед иудеями, пылавшими гневом, ещё не совершила у гробницы Господа того, что женщины обычно делают для умерших близких.


    (51) Взяв с собой подруг, она пошла к гробнице, где он был положен. (52) Они боялись, как бы иудеи их не увидели, и говорили: «Если в день его распятия мы не смогли плакать и скорбеть, то хотя бы теперь сделаем это у его гробницы. (53) Но кто откатит для нас камень, положенный у входа в гробницу, чтобы мы могли войти, сесть рядом с ним и исполнить положенное? (54) Ведь камень велик, и мы боимся, как бы кто-нибудь нас не увидел. А если войти не удастся, то хотя бы положим у входа то, что несём в память о нём, и будем плакать и скорбеть, пока не вернёмся домой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Lord’s day
  choice: день Господень
  rationale: Сохраняет раннехристианское обозначение дня без его пояснительного отождествления с воскресеньем.
- source_word: grave
  choice: гробница
  rationale: По контексту речь идёт о погребальном помещении со входом и большим камнем; «гробница» естественнее и точнее русского «могила».
- source_word: friends
  choice: подруги
  rationale: Женский род следует из дальнейшего множественного высказывания женщин и делает сцену естественной по-русски.
- source_word: do our duties
  choice: исполнить положенное
  rationale: Передаёт погребальные действия, не конкретизируя обряд сверх доступного свидетельства.
- source_word: loved ones
  choice: близкие
  rationale: Современное и естественное обозначение дорогих умерших без излишне сентиментального оттенка.
theological_decisions:
- issue: Обозначение дня посещения гробницы
  choice: день Господень
  alternative: воскресенье
  rationale: Сохранена формулировка свидетельства и её раннехристианский оттенок; календарное толкование не внесено прямо в текст.
- issue: Обобщающее упоминание иудеев
  choice: перед иудеями
  alternative: перед иудейскими властями
  rationale: Сохранён широкий термин доступного свидетельства; сужение до властей не подтверждено предоставленным текстом.
- issue: Характер действий у тела
  choice: исполнить положенное
  alternative: совершить погребальные обряды
  rationale: Не уточняется, шла ли речь о помазании, приношении или ином обычае, поскольку свидетельство оставляет это неопределённым.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным повествовательным тоном. Нумерация фрагментов сохранена. Проект предварительный: предоставлен английский публичнодоступный текст-свидетель; непосредственная сверка с греческим текстом Ахмимского кодекса ещё требуется.'
