review_pass:
  verdict: revise
  source_fidelity: Проект в целом точно следует предоставленному английскому свидетельству. Однако в ст. 52 «то хотя бы теперь сделаем это» превращает осторожную возможность («perhaps/even now we might») в решительное намерение. В ст. 54 «если войти не удастся» сужает исходное «если мы не сможем», которое не называет прямо, что именно окажется невозможным.
  naturalness: Текст написан естественным современным литературным русским языком. «Дорогих им умерших» несколько яснее передаёт отношение, выраженное в «their loved ones», чем «умерших близких».
  terminology: «День Господень», «гробница» и «иудеи» сохранены последовательно и без интерпретационных добавлений. «Исполнить положенное» приемлемо передаёт неопределённые погребальные действия, не навязывая конкретный обряд.
  issues:
  - severity: medium
    issue: 'Ст. 52: утрачена модальность возможности.'
    rationale: 'Свидетельство говорит «perhaps even now we might do this», тогда как «хотя бы теперь сделаем это» звучит как решение непременно это сделать. Следует сохранить неуверенность: «может быть, и теперь мы сможем это сделать».'
  - severity: medium
    issue: 'Ст. 54: добавлена конкретизация «войти».'
    rationale: Фраза «если мы не сможем» в свидетельстве формально не уточняет предмет невозможности. Хотя контекст связан с доступом к гробнице, перевод не должен снимать эту неопределённость.
  revised_text: '(50) На рассвете дня Господня Мария Магдалина, ученица Господа, из страха перед иудеями, пылавшими гневом, ещё не совершила у гробницы Господа того, что женщины обычно делают для дорогих им умерших.


    (51) Взяв с собой подруг, она пошла к гробнице, где он был положен. (52) Они боялись, как бы иудеи их не увидели, и говорили: «Если в день его распятия мы не смогли плакать и скорбеть, то, может быть, и теперь мы сможем сделать это у его гробницы. (53) Но кто откатит для нас камень, положенный у входа в гробницу, чтобы мы могли войти, сесть рядом с ним и исполнить положенное? (54) Ведь камень велик, и мы боимся, как бы кто-нибудь нас не увидел. А если мы не сможем, то хотя бы положим у входа то, что несём в память о нём, и будем плакать и скорбеть, пока не вернёмся домой».'
  revised_footnotes: []
  revision_rationale: Исправления ограничены двумя местами, где русский текст либо усиливал модальность, либо уточнял оставленный неопределённым предмет невозможности. Остальные решения сохранены; сноски не требуются. Проверка основана на предоставленном английском публичнодоступном свидетельстве, поскольку прямой греческий текст для сверки в материалах не приведён.
