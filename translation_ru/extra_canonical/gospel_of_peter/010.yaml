review_pass:
  verdict: revise
  source_fidelity: 'Содержание в целом точно передаёт предоставленное свидетельство: стража, трое выходящих, двое поддерживающих одного, следующий крест, различие «небо/небеса», вопрос небесного голоса и ответ креста сохранены. В ст. 40 глагол «простиралась» несколько ослабляет пространственное значение «достигала ... за пределами»; безопаснее прямо выразить достижение.'
  naturalness: Текст в целом литературный и читаемый. «Три мужа» допустимо в намеренно возвышенном регистре, однако для современного литературного русского без смысловой потери естественнее «три человека». Формула «Возвестил ли ты спящим?» грамматически возможна, но звучит неполно, поскольку «возвестить» обычно предполагает содержание вести; «тем, кто спит» передаёт исходную конструкцию яснее.
  terminology: '«Воины», «сотник», «старейшины», «гробница» и «крест» уместны. Образ «спящих» следует сохранить, не заменяя его словом «умершие». Примечание можно сделать более нейтральным: оно должно объяснять образ, но не утверждать конкретное богословское истолкование.'
  issues:
  - severity: low
    issue: 'Ст. 40: «простиралась выше небес»'
    rationale: Исходный образ говорит о том, что голова достигает за пределы небес; «простиралась» описывает протяжённость и менее непосредственно передаёт этот глагольный образ.
  - severity: low
    issue: 'Ст. 41: управление при «возвестил»'
    rationale: Вариант «Возвестил ли ты спящим?» стилистически возможен, но в современном русском может восприниматься как пропуск объекта. «Тем, кто спит» сохраняет исходную метафору и делает адресата вопроса ясным.
  revised_text: '(38) Увидев это, воины разбудили сотника и старейшин, потому что и те были там, неся стражу. (39) Пока воины рассказывали им о том, что увидели, они снова увидели трёх человек, выходивших из гробницы. Двое поддерживали третьего, а вслед за ними шёл крест. (40) Головы двоих достигали неба, а голова того, кого они вели, достигала за пределы небес.


    (41) И услышали они голос с небес, говоривший: «Возвестил ли ты тем, кто спит?»[a]


    (42) И с креста послышался ответ: «Да!»'
  revised_footnotes:
  - marker: a
    text: 'Или: «Возвестил ли ты спящим?» Выражение «те, кто спит» сохраняет образ сна; в данном контексте оно может относиться к умершим.'
    reason: Сохраняет метафорическую формулировку основного текста и отмечает возможное, но не навязываемое контекстуальное понимание.
  revision_rationale: Правки ограничены естественностью современного литературного русского и более прямой передачей пространственного образа в ст. 40. Необычные элементы рассказа — следующий крест, небесный голос и ответ креста — оставлены без рационализации и идентификации. Проверка выполнена по предоставленному английскому свидетельству; окончательная сверка с греческим текстом остаётся желательной.
