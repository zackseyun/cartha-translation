base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: ru
  text: '(38) Увидев это, воины разбудили сотника и старейшин, потому что и те находились там на страже. (39) Пока воины рассказывали им о том, что увидели, они снова увидели трёх мужей, выходивших из гробницы. Двое поддерживали третьего, а вслед за ними шёл крест. (40) Головы двоих достигали неба, а голова того, кого они вели, простиралась выше небес.


    (41) И услышали они голос с небес, говоривший: «Возвестил ли ты спящим?»[a]


    (42) И с креста послышался ответ: «Да!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возвестил ли ты тем, кто спит?» Под «спящими» могут подразумеваться умершие; текст сохраняет образ сна и не уточняет адресатов вести.'
    reason: Помогает современному читателю распознать вероятный смысл, не подменяя метафору толкованием в основном тексте.
lexical_decisions:
- source_word: soldiers
  choice: воины
  rationale: Дигнифицированное и естественное обозначение воинов стражи в повествовательном тексте; контекст ясно указывает на несение караула.
- source_word: centurion
  choice: сотник
  rationale: Устоявшийся русский эквивалент римского военного звания в текстах античной и библейской тематики.
- source_word: elders
  choice: старейшины
  rationale: Сохраняет общественно-религиозный статус названных лиц, не уточняя его сверх свидетельства.
- source_word: tomb
  choice: гробница
  rationale: Современное и однозначное обозначение погребального сооружения; избегает возможного понимания слова «гроб» как переносного ящика.
- source_word: three men
  choice: три мужа
  rationale: Слово «мужи» поддерживает возвышенный регистр видения, оставаясь понятным современному читателю.
- source_word: supporting
  choice: поддерживали
  rationale: Сохраняет физический образ помощи и не уточняет, несли ли третьего полностью.
- source_word: heaven / the heavens
  choice: небо / небеса
  rationale: Сохранено формальное различие между единственным и множественным числом в предоставленном свидетельстве.
- source_word: proclaimed
  choice: возвестил
  rationale: Передаёт публичное и значимое провозглашение, не добавляя конкретного содержания вести.
- source_word: those who sleep
  choice: спящим
  rationale: 'Сохраняет метафорическую и богословскую неоднозначность: речь может идти об умерших, но текст не называет их прямо.'
theological_decisions:
- issue: Говорящий небесный голос и адресат вопроса
  choice: Сохранены без идентификации; мужской род глагола обусловлен русской грамматикой и ближайшим образом ведомого мужа.
  alternative: Назвать голос голосом Бога, а адресата — Иисусом или крестом.
  rationale: Свидетельство прямо не устанавливает личность говорящего и не называет адресата; уточнение разрешило бы намеренную повествовательную неоднозначность.
- issue: Значение выражения «спящим»
  choice: Сохранена метафора сна.
  alternative: Перевести «умершим» или «находящимся в мире мёртвых».
  rationale: Прямое истолкование как умерших вероятно, однако метафорическая форма текста несёт собственное богословское напряжение и не должна заменяться толкованием.
- issue: Оживлённый крест, следующий за мужами и отвечающий
  choice: Образ передан буквально без рационализации.
  alternative: Понять крест как символ, видение или голос, исходящий от несущего крест лица.
  rationale: Необычность принадлежит самому повествованию; перевод не должен устранять её.
- issue: Космический масштаб фигур
  choice: 'Размеры переданы буквально: головы достигают неба и выше небес.'
  alternative: Смягчить как образ величия или небесного статуса.
  rationale: Буквальная образность существенна для апокалиптической сцены и не требует поясняющего перефразирования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис сделан естественным для чтения вслух, но фантастическая и богословски неоднозначная образность сохранена. Проект остаётся предварительным, поскольку предоставленное основание — английское публично-доменное свидетельство, а прямая сверка с греческим текстом ещё не выполнена.
