review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетельству и добросовестно сохраняет лакуны. Однако деепричастная связь в «the one who searched, having [discovered the true life]» передана сочинением («искал и обрёл»), а финальная русская конструкция с «вам не ввести» грамматически неудачна и несколько затушёвывает субъект действия. Прямая сверка с коптским текстом в материалах отсутствует, поэтому оценка источника предварительна и ограничена свидетельством.
  naturalness: 'Регистр удачен: современный литературный русский с уместной сдержанно возвышенной интонацией. «Совлеките с себя» возможно, но архаизирующее; в данном жанре оно приемлемо. Следует исправить «чтобы вам не ввести» на личную конструкцию «чтобы вы не ввели».'
  terminology: «Гнев», «зависть», «дела», «истинная жизнь», «покой», «духи и души» переданы нейтрально и без конфессионального истолкования. «Этот» точнее передаёт указательное «This one», чем анафорическое «он».
  issues:
  - severity: medium
    issue: Финальная конструкция «чтобы вам не ввести [свои] духи и души в заблуждение» грамматически и стилистически неудачна.
    rationale: 'В русском при субъектном значении исходного «you do not lead» требуется личная форма: «чтобы вы не ввели». Это ясно сохраняет адресатов как тех, кто может ввести свои духи и души в заблуждение.'
  - severity: low
    issue: «Искал и [обрёл истинную жизнь]» не отражает деепричастно-результативную связь свидетельства «searched, having [discovered ...]».
    rationale: «Тот, кто искал, [обретя истинную жизнь]» ближе передаёт указанную последовательность, не создавая дополнительного равноправного действия.
  - severity: low
    issue: «Он» несколько ослабляет указательность выражения «This one».
    rationale: «Этот» сохраняет выделение искателя, обнаружившего истинную жизнь.
  revised_text: '«Что же до вас, усердно старайтесь освободиться от [гнева] и зависти. И совлеките с себя свои [дела] и не [...]. [...] [...] упрёк [...], ибо говорю [вам, ...]: вы получите [...] многое [...] тот, кто искал, [обретя истинную жизнь]. Этот [достигнет покоя и] будет жить вечно. Говорю [вам: берегитесь], чтобы вы не ввели [свои] духи и души в заблуждение».


    [Диалог] Спасителя'
  revised_footnotes: []
  revision_rationale: 'Исправлены только безопасные языковые и синтаксические места: субъект финального предостережения выражен по-русски ясно; результативный оборот при «искал» приближен к свидетельству; указательное «This one» передано словом «Этот». Лакуны, квадратные скобки, неясная связь фрагмента с «многое» и нейтральная терминология сохранены. Пунктуация вокруг лакуны минимально организует русскую речь и не претендует на восстановление утраченного текста.'
