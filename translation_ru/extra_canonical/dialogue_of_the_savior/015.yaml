base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: ru
  text: '«Что же до вас, усердно старайтесь освободиться от [гнева] и зависти. И совлеките с себя свои [дела], и не [...]. [...] [...] упрёк [...], ибо говорю [вам: ...] вы получите [...] многое [...] тот, кто искал и [обрёл истинную жизнь]. Он [достигнет покоя и] будет жить вечно. Говорю [вам: берегитесь], чтобы вам не ввести [свои] духи и души в заблуждение».


    [Диалог] Спасителя'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: strive diligently
  choice: усердно старайтесь
  rationale: Передаёт усиленный призыв к настойчивому усилию естественным современным русским языком.
- source_word: free yourselves
  choice: освободиться
  rationale: Сохраняет возвратность действия и идею избавления от гнева и зависти.
- source_word: strip from yourselves
  choice: совлеките с себя
  rationale: Сохраняет телесную метафору снятия с себя чего-либо; возвышенное «совлеките» уместно для древнего религиозного текста.
- source_word: works
  choice: дела
  rationale: Оставляет широкий смысл поступков или деяний и не сужает выражение до конкретной богословской категории.
- source_word: searched
  choice: искал
  rationale: Сохраняет активный и продолжительный характер поиска без добавления объекта, отсутствующего в повреждённом тексте.
- source_word: true life
  choice: истинную жизнь
  rationale: Прямо передаёт качественное определение жизни, не истолковывая его конфессионально.
- source_word: achieve rest
  choice: достигнет покоя
  rationale: Передаёт покой как достигаемое состояние и сохраняет эсхатологическую неоднозначность.
- source_word: lead ... into error
  choice: ввести ... в заблуждение
  rationale: Естественная русская конструкция, сохраняющая предостережение о причинении духовного заблуждения.
theological_decisions:
- issue: Значение «дел»
  choice: Сохранено общее слово «дела»
  alternative: «поступки» или «деяния»
  rationale: Источник не уточняет нравственный, ритуальный или иной характер дел; перевод не должен заранее разрешать эту богословскую неопределённость.
- issue: Соотношение «духов» и «душ»
  choice: 'Сохранены как два отдельных понятия: «духи и души»'
  alternative: Объединить в «дух и душу» или истолковать как синонимы
  rationale: Множественное число и различение понятий сохранены без навязывания антропологической схемы.
- issue: Характер «покоя»
  choice: «достигнет покоя» без пояснения
  alternative: «обретёт вечный покой»
  rationale: Источник связывает покой и вечную жизнь, но не отождествляет их прямо; добавление «вечный» сняло бы напряжение текста.
- issue: Повреждённая синтаксическая связь вокруг «тот, кто искал»
  choice: Фрагментарность сохранена без синтаксической реконструкции
  alternative: Связать искателя с получающими многое или оформить отдельное предложение
  rationale: Лакуны не позволяют уверенно определить грамматическую и смысловую связь.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Квадратные скобки и многоточия сохранены как обозначения редакторских восстановлений и повреждений рукописи. Основание черновика — опубликованное английское свидетельство; прямая сверка с коптским текстом ещё требуется. Неясный фрагмент «reproach» передан буквально как «упрёк» без искусственного восстановления синтаксиса.
