translation:
  language: ru
  text: 'Иуда [сказал]: «Я действительно хочу [познать всё]».


    [Господь] сказал ему: «Живой [Бог не] обитает [нигде во] всём [месте] этой ущербности».[a]


    Иуда [спросил]: «Кто [будет властвовать над нами]?»


    Господь ответил: «[Вот, здесь пребывает] всё существующее [среди] того, что останется. Вы будете [властвовать] над ними».[b]


    Иуда сказал: «Вот, архонты стоят над нами, чтобы властвовать над нами».[c]


    Господь ответил: «Это вы будете властвовать над ними. Когда вы избавитесь от зависти, то облечётесь в свет и войдёте в брачный чертог».[d]


    Иуда спросил: «Как [наши] одеяния будут даны нам?»


    Господь ответил: «Одни дадут их вам, а другие примут [их], […][e] и именно они [дадут] вам ваши одеяния. Ибо кто может достичь того места, столь оно [грозно]? Однако одеяния жизни будут даны людям, потому что они знают путь, которым пойдут. Поистине, даже мне трудно достичь его».[f]


    Мария сказала: «Так для каждого дня <довольно> своей заботы. Работники достойны своей пищи. Ученики будут равны своим учителям».[g]


    Она сказала это как женщина, понимавшая всё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки здесь и далее обозначают восстановленный или не вполне сохранившийся текст согласно использованному английскому свидетельству. «Ущербность» может также означать недостаточность или неполноту.
    reason: Нужно обозначить предварительный характер реконструкций и сохранить смысловую широту ключевого термина.
  - marker: b
    text: Синтаксис этой реплики фрагментарен и не вполне ясен; перевод сохраняет последовательность доступного свидетельства.
    reason: Не допустить ложной уверенности в связи между «всем существующим» и «тем, что останется».
  - marker: c
    text: Архонты — буквально «правители»; здесь, вероятно, имеются в виду надмирные властные силы.
    reason: Технический термин нуждается в кратком пояснении без закрепления одной полной космологической схемы.
  - marker: d
    text: «Брачный чертог» может быть символическим или ритуальным образом; отрывок не раскрывает его значение однозначно.
    reason: Сохранить богословскую неоднозначность образа.
  - marker: e
    text: Пустое место в квадратных скобках передано многоточием и указывает на утрату текста в используемом свидетельстве.
    reason: Явно отметить лакуну и не создавать впечатления связного исходного текста.
  - marker: f
    text: Связи между теми, кто даёт и принимает одеяния, не вполне ясны из-за повреждённости текста. Необычные слова «даже мне трудно достичь его» переведены без богословского сглаживания.
    reason: Сохранить текстовую и богословскую трудность.
  - marker: g
    text: Угловые скобки обозначают редакционное восполнение в используемом свидетельстве. Высказывания Марии перекликаются с известными евангельскими речениями, но здесь переданы в форме данного текста.
    reason: Различить виды редакционных сигналов и избежать молчаливой гармонизации.
lexical_decisions:
- source_word: deficiency
  choice: ущербность
  rationale: Передаёт состояние недостаточности или неполноты, не сводя его однозначно к нравственному пороку; перевод предварителен, поскольку прямой разбор коптского текста ещё не выполнен.
- source_word: archons
  choice: архонты
  rationale: Сохранён технический термин религиозно-космологического контекста; обычное «правители» могло бы скрыть его особое значение.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Достоинный и понятный русский эквивалент, сохраняющий вероятный ритуально-символический смысл выражения.
- source_word: garments of life
  choice: одеяния жизни
  rationale: Сохранена образность и генитивная неоднозначность исходного свидетельства без догматического истолкования.
- source_word: fearsome
  choice: грозно
  rationale: Передаёт внушающий страх и трепет характер места; квадратные скобки сохраняют реконструированный характер слова.
- source_word: trouble
  choice: забота
  rationale: Фраза, вероятно, перекликается с евангельским изречением; «забота» звучит естественно, не устраняя возможных оттенков бедствия или тяготы.
theological_decisions:
- issue: Власть учеников над архонтами
  choice: Сохранено буквальное «вы будете властвовать над ними»
  alternative: Истолковать как духовную победу или освобождение от космических сил
  rationale: Текст не поясняет природу этой власти, поэтому перевод не должен навязывать конкретную космологическую или сотериологическую систему.
- issue: Облечение светом и вход в брачный чертог
  choice: Образы сохранены без поясняющего перефразирования
  alternative: Передать как спасение, посвящение, единение или посмертное восхождение
  rationale: Подобные толкования возможны, но сам отрывок оставляет их соотношение открытым.
- issue: Слова Господа о трудности достижения места
  choice: Сохранено «даже мне трудно достичь его»
  alternative: Смягчить или переистолковать из-за христологических затруднений
  rationale: Необычное богословское напряжение принадлежит свидетельству и не должно устраняться редакционно.
- issue: Речение Марии об учениках и учителях
  choice: Сохранено множественное число и утверждение равенства
  alternative: Гармонизировать с одной из канонических формулировок
  rationale: Перевод следует данному свидетельству, а не подгоняет его под параллельный текст.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной, но доступной речью. Диалог передан прямо и естественно; термины «архонты», «облечётесь» и «брачный чертог» сохранены ради жанрового и религиозного колорита. Проект предварительный: он основан на предоставленном общественном английском свидетельстве, поскольку непосредственная сверка с коптским текстом ещё ожидается.'
