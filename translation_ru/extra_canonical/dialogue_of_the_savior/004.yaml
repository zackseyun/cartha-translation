translation:
  language: ru
  text: 'Матфей сказал: «Как [...]?»[a]


    [...] Спаситель сказал: «[Если вы не содержите в порядке] то, что внутри вас, [дело ваше] сохранится, но [не] вы».[b]


    Иуда [сказал]: «Господи, [я хотел бы узнать обо всех] деяниях душ, [принадлежащих] этим малым. Когда [...], где они будут обитать? [...] дух [...]?»


    Господь [сказал: «... примите] их. Они не умирают и не гибнут, потому что познали [своих] спутников и того, кто примет их, ибо истина ищет мудрых и праведных».


    Спаситель [сказал]: «Светильник тела — ум. Пока [то, что внутри] вас, то есть [душа], содержится в порядке, ваши тела будут [озарены]. Пока сердца ваши омрачены, свет, на который вы [...] надеетесь, [останется далеко от вас]. Я призвал [вас к себе], потому что вскоре уйду, чтобы [вы приняли] Моё слово среди [вас. Вот], Я посылаю его [вам]».'
  philosophy: optimal-equivalence
