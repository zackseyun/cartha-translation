    reason: Объясняет читателю редакционные знаки и не выдаёт реконструкции за полностью сохранившийся текст.
lexical_decisions:
- source_word: maintain in order
  choice: содержать в порядке
  rationale: Сохраняет образ внутренней упорядоченности и не уточняет его как нравственную чистоту, самоконтроль или аскетическую практику.
- source_word: work
  choice: дело
  rationale: Передаёт широкое значение результата или совершённого дела, не сужая его до труда, служения либо конкретных поступков.
- source_word: little ones
  choice: малые
  rationale: Сохраняет возможное обозначение особой группы и не подменяет его однозначно словами «дети», «ученики» или «простые люди».
- source_word: companions
  choice: спутники
  rationale: Нейтрально передаёт связь и совместность, не навязывая более специального смысла вроде «собратья», «ангелы» или «небесные двойники».
- source_word: mind
  choice: ум
  rationale: Прямой и естественный русский эквивалент; сохраняет отличие ума от названных далее души и сердца.
- source_word: illuminated
  choice: озарены
  rationale: Сохраняет метафору светильника и света в dignified modern Russian without adding interpretive notions of enlightenment or salvation.
- source_word: accept
  choice: принять
  rationale: 'Сохраняет повторяющийся глагол свидетеля и его смысловую широту: принять людей, слово или послание.'
theological_decisions:
- issue: Соотношение внутреннего порядка, дела и спасения человека
  choice: 'Сохранена резкая формулировка: «дело ваше сохранится, но не вы»'
  alternative: Истолковать её как утрату награды, духовную смерть или гибель личности
  rationale: Повреждённый контекст не позволяет надёжно определить вид сохранения или гибели; перевод не разрешает богословское напряжение.
- issue: Кто такие «эти малые»
  choice: Оставлено обозначение «малые»
  alternative: «дети», «ученики», «избранные» или «верующие»
  rationale: Свидетель не даёт достаточного основания отождествлять группу с конкретной богословской категорией.
- issue: Смысл «спутников» душ
  choice: Использовано общее слово «спутники»
  alternative: «небесные двойники», «ангелы», «собратья»
  rationale: Более специальные варианты привнесли бы определённую космологическую систему, не доказанную данным отрывком.
- issue: Ум как светильник тела и душа как внутреннее начало
  choice: Различие терминов сохранено без гармонизации
  alternative: Объединить ум, душу и сердце в одно понятие внутреннего человека
  rationale: Текст использует несколько образов и понятий; их богословское соотношение не следует молча упрощать.
- issue: «Истина ищет мудрых и праведных»
  choice: Сохранена персонификация истины
  alternative: «мудрые и праведные ищут истину»
  rationale: Инверсия изменила бы направление действия и богословский акцент исходного свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского диалога. Синтаксис сделан понятным обычному читателю, однако фрагментарность рукописи, повторения и смысловые напряжения сохранены. Формы обращения к Господу и местоимения в Его прямой речи оформлены с традиционной прописной буквы без внесения конфессиональных уточнений.
