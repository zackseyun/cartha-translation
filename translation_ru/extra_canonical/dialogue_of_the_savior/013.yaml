translation:
  language: ru
  text: 'Мария сказала: «Я хочу понять всё [именно таким], каково оно есть».


    Господь сказал: «Для того, кто ищет жизнь, она станет богатством, потому что [покой], который даёт мир, ложен, а его золото и серебро обманчивы».[a]


    Ученики спросили Его: «Что нам делать, чтобы наш труд был завершён?»


    Господь [сказал] им: «Будьте готовы при любых обстоятельствах. Блажен тот, кто познал […] [борьбу и своими глазами увидел] битву. Он не убил и не был [убит], но вышел победителем».


    Иуда спросил: «Господи, скажи мне, что является началом пути?»


    Он ответил: «Любовь и доброта. Если бы хотя бы одно из них было среди архонтов, зло никогда не возникло бы».[b]


    Матфей сказал: «Господи, Ты без затруднения рассказал о завершении всего».


    Господь сказал: «Вы поняли всё, что Я вам сказал, и с верой приняли это. Если вы знаете это, оно принадлежит вам; если же не знаете, оно вам не принадлежит».


    Они спросили Его: «К какому месту мы идём?»


    Господь сказал: «Займите то место, которого можете достичь».


    Мария спросила: «Видимо ли всё, устроенное таким образом?»


    Господь сказал: «Я говорил вам: тот, кто способен видеть, — тот и открывает».[c]


    Его ученики, двенадцать, спросили Его: «Учитель, [с] […] спокойствием […] научи нас […]».


    Господь сказал: «[Если вы поняли] всё, что Я [сказал вам], то [станете бессмертными, потому что] вы […] всё».


    Мария сказала: «Лишь одно я [скажу] Господу о тайне истины: в ней мы стоим и в ней прозрачны для того, что относится к миру».[d]


    Иуда сказал Матфею: «Мы хотим понять, в какие одежды нам надлежит облечься, когда мы покинем тленность [плоти]».


    Господь сказал: «Правители и распорядители владеют одеждами, которые даны лишь на время и не сохраняются. Но вы, как сыны истины, не должны облекаться в эти одежды, сохраняющиеся лишь на время. Напротив, говорю вам: вы будете блаженны, когда снимете свои одежды, потому что […] [отложить то, что] снаружи, — не великое дело».[e]


    […] сказал: «Я ли говорю и я ли принимаю […]?»


    Господь сказал: «Да, [тот, кто принимает] вашего Отца [разумным образом]».[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «покой» и «даёт» восстановлены или подразумеваются в повреждённом месте рукописи; перевод предварительный.
    reason: Отмечает редакторское восстановление и зависимость от английского свидетельства.
  - marker: b
    text: «Архонты» — транслитерация древнего термина со значением «правители»; здесь он, вероятно, обозначает космические силы, но точный смысл не установлен.
    reason: Предотвращает ложное отождествление с обычными земными должностными лицами.
  - marker: c
    text: Фраза допускает иное понимание; английское свидетельство поясняет, что видящий и открывающий — одно и то же лицо.
    reason: Сохраняет синтаксическую и смысловую неоднозначность.
  - marker: d
    text: Выражение «прозрачны для того, что относится к миру» неясно и переведено близко к представленному свидетельству.
    reason: Предупреждает о необычном образе и повреждённом контексте.
  - marker: e
    text: «Одежды» могут быть символическим образом, однако текст не определяет его однозначно. Пропуски и восстановления обозначены скобками и многоточием.
    reason: Не допускает навязывания телесной или космологической интерпретации.
  - marker: f
    text: Последняя реплика сильно повреждена; слова в квадратных скобках являются восстановлением, а выражение «разумным образом» особенно неуверенно.
    reason: Фиксирует крайне предварительный характер чтения.
lexical_decisions:
- source_word: life
  choice: жизнь
  rationale: Сохраняет ключевое понятие свидетельства без уточнения, идёт ли речь о земной или вечной жизни.
- source_word: rest
  choice: покой
  rationale: Редакторское восстановление передано в квадратных скобках; «покой» сохраняет возможный духовный и обычный смысл.
- source_word: archons
  choice: архонты
  rationale: Технический термин сохранён транслитерацией, чтобы не отождествлять этих существ только с земными властителями.
- source_word: governors and administrators
  choice: правители и распорядители
  rationale: Передаёт различие двух управленческих обозначений и избегает смешения с техническим термином «архонты».
- source_word: sons of truth
  choice: сыны истины
  rationale: Сохранена традиционная образная формула родства и принадлежности, а не заменена пояснительным пересказом.
- source_word: destructibility
  choice: тленность
  rationale: Естественный литературный эквивалент, сохраняющий представление о подверженности распаду.
- source_word: transparent
  choice: прозрачны
  rationale: Сохранён необычный образ исходного свидетельства, несмотря на его смысловую неясность.
- source_word: logical way
  choice: разумным образом
  rationale: Предварительная передача неясной реконструированной фразы; окончательное решение требует сверки с коптским текстом.
theological_decisions:
- issue: Связь жизни и богатства
  choice: «она станет богатством»
  alternative: «это станет его богатством»
  rationale: Местоимение соотнесено с «жизнью», но метафорическая связь сохранена без догматического истолкования.
- issue: Природа архонтов
  choice: термин оставлен без поясняющего отождествления
  alternative: «властители» или «небесные силы»
  rationale: Свидетельство допускает специальный космологический смысл; перевод не навязывает конкретную систему.
- issue: Победа без убийства и смерти
  choice: сохранено парадоксальное утверждение
  alternative: истолковать как духовную борьбу
  rationale: Текст сам не разрешает образ и не уточняет характер битвы.
- issue: Одежды и тленность плоти
  choice: образ одежды сохранён буквально
  alternative: раскрыть его как тело, духовное состояние или небесное облачение
  rationale: Буквальный образ удерживает богословскую многозначность отрывка.
- issue: «Тот, кто видит, открывает»
  choice: сохранено тождество видящего и открывающего
  alternative: «увиденное становится явным»
  rationale: Неясный субъект и характер откровения не были сглажены.
translation_notes:
  register: Современный литературный русский язык с достоинством диалогической речи. Обращение к Господу оформлено традиционным прописным «Ты», без конфессионально специфической лексики. Квадратные скобки сохраняют редакторские восстановления, многоточия в квадратных скобках — лакуны. Проект основан на предоставленном общедоступном английском свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex III,5 ещё требуется.
