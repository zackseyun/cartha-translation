review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод бережно следует предоставленному английскому свидетельству и сохраняет квадратные скобки, лакуны и ключевую образность. Однако в нескольких местах исходные синтаксические отношения переданы неточно или неестественно: прежде всего «this will be their wealth» не следует отождествлять с самой жизнью, а временный характер одежд лучше передать без значения их физической сохранности. Прямая сверка с коптским текстом по-прежнему требуется.'
  naturalness: Регистр в основном современный литературный и уместно сдержанный. Исправлены неудачные сочетания «место, которого можете достичь» и повтор «одежды, сохраняющиеся лишь на время». Намеренно странные и фрагментарные места сохранены, поскольку таково состояние свидетельства.
  terminology: «Архонты», «сыны истины», «тленность», «правители и распорядители» и «бессмертными» сохранены. Пояснение к архонтам сокращено, чтобы не навязывать космологическое толкование. Пустые квадратные скобки воспроизведены как отдельный знак лакуны, а не заменены многоточием.
  issues:
  - severity: medium
    issue: Смысловое смещение в реплике о жизни и богатстве
    rationale: В свидетельстве «this» относится к факту поиска жизни или к тому, что обретается при этом, а не утверждает прямо, что сама жизнь «станет богатством». Безопаснее сохранить указательное «это будет его богатством».
  - severity: low
    issue: Неточная передача временности одежд
    rationale: «Не сохраняются» и «сохраняющиеся лишь на время» звучат так, будто речь идёт о сохранении предметов; свидетельство говорит о том, что эти одежды даны/существуют лишь временно и не длятся.
  - severity: low
    issue: Непоследовательное обозначение пустых лакун
    rationale: В английском свидетельстве пустые квадратные скобки [] отдельно отмечают неразрешённый пробел. Замена их на […] стирает это различие; в исправленном тексте оно сохранено.
  - severity: low
    issue: Синтаксис повеления о достижимом месте
    rationale: По-русски естественно «место, до которого можете добраться», тогда как «место, которого можете достичь» менее удачно.
