  - severity: low
    issue: «Благодаря Твоей жертве» несколько усиливает благотворно-каузальный оттенок by.
    rationale: «Твоей жертвой» сохраняет инструментальную связь оригинального свидетельства, не добавляя оценочного оттенка «благодаря».
  - severity: low
    issue: Примечание предлагает богословски окрашенное объяснение «духовное единство».
    rationale: При отсутствии непосредственной сверки с коптским текстом примечание должно фиксировать лексическую неопределённость, а не предлагать конкретную духовную интерпретацию.
