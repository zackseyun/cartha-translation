translation:
  language: ru
  text: '«Когда возносите хвалу, делайте это так:


    Услышь нас, Отец,

    как Ты услышал Своего единственного Сына

    и даже принял его к Себе.

    [Ты] даровал ему покой от многих [трудов].

    Наша сила [неодолима],

    [потому что] Твои боевые силы [неодолимы].

    [... свет ...] живой [...] недоступный [... живой].

    [Истинное] слово [даровало] покаяние ради жизни,

    [и оно исшло] от Тебя.

    Ты — мысль и совершенный покой уединённого.[a]

    Услышь нас вновь,

    как Ты услышал Своих избранных.

    Благодаря Твоей жертве избранные войдут.

    Своими добрыми делами они освободили свои души

    от слепых телесных членов,

    чтобы существовать [] вечно.

    Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одинокого», «единого». Возможно, здесь употреблён особый термин для человека, пребывающего в духовном единстве или уединении; коптский оригинал требует дополнительной проверки.'
    reason: Фраза «the solitary» допускает несколько смыслов, а source-language review прямо обозначен как pending.
lexical_decisions:
- source_word: offer up praise
  choice: возносите хвалу
  rationale: Естественное и достойное русское выражение, сохраняющее культовый оттенок исходного свидетельства.
- source_word: only Son
  choice: единственного Сына
  rationale: Передаёт буквальный смысл supplied witness, не заменяя его более конфессионально маркированным термином «Единородный».
- source_word: rest
  choice: покой
  rationale: Сохраняет широкий смысл покоя или освобождения от труда без дополнительного толкования.
- source_word: battle forces
  choice: боевые силы
  rationale: Сохраняет военную образность и намеренно не уточняет, идёт ли речь о воинствах, силах или иной небесной реальности.
- source_word: repentance for life
  choice: покаяние ради жизни
  rationale: Передаёт направленность к жизни, не разрешая неоднозначность конструкции как «покаяние, ведущее к жизни» или «для обретения жизни».
- source_word: thought
  choice: мысль
  rationale: Буквально сохраняет абстрактное именование Бога в доступной современной форме.
- source_word: complete serenity
  choice: совершенный покой
  rationale: Естественнее по-русски в молитвенном регистре и сохраняет смысл полноты без психологизирующего сужения.
- source_word: solitary
  choice: уединённый
  rationale: 'Сохраняет неоднозначность: это может быть одинокий, единичный или аскетически уединённый человек.'
- source_word: blind bodily limbs
  choice: слепые телесные члены
  rationale: Сохраняет необычную антропологическую метафору исходного свидетельства, не сглаживая её до «слепого тела».
theological_decisions:
- issue: Кто принял Сына и даровал ему покой
  choice: Сохранены местоимения и прямое обращение к Отцу
  alternative: Перестроить фразу так, чтобы явно назвать Отца субъектом всех действий
  rationale: Свидетельство частично восстановлено и синтаксически фрагментарно; перевод не должен добавлять отсутствующую определённость.
- issue: Связь жертвы с вхождением избранных
  choice: «Благодаря Твоей жертве избранные войдут»
  alternative: «Через принесённую Тебе жертву» или «через жертву, которую Ты принёс»
  rationale: Притяжательная конструкция двусмысленна в отношении характера и направления жертвы; эта двусмысленность сохранена.
- issue: Освобождение душ добрыми делами
  choice: Сохранено прямое утверждение свидетельства
  alternative: 'Ослабить причинность: «посредством добрых дел» или истолковать дела как свидетельство уже совершённого освобождения'
  rationale: Не следует согласовывать текст с позднейшими сотериологическими системами или устранять его собственное богословское напряжение.
- issue: «Уединённый» как возможный технический термин
  choice: Основной текст оставляет «уединённого», а примечание фиксирует варианты
  alternative: «одинокого», «единого», «монаха»
  rationale: Без прямой проверки коптского текста выбор узкого технического значения был бы преждевременным.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Квадратные скобки, пустой лакунарный знак [] и многоточия сохранены как сигналы повреждения рукописи и редакторского восстановления. Перевод является предварительным, поскольку предоставлена английская публикационная версия, а непосредственная сверка с коптским текстом Nag Hammadi Codex III,5 ещё не выполнена.
