translation:
  language: ru
  text: '«Кто [не] знает дела полноты, тот не знает ничего.


    Кто не пребывает во тьме, тот не может увидеть [] свет.[a]


    Кто [не понимает], как возник огонь, тот сгорит в нём, не зная его происхождения.


    Если человек прежде не поймёт воду, то он ничего не знает, ибо что пользы ему креститься в ней?


    Кто не понимает, как возник дующий ветер, того унесёт вместе с ним.


    Кто не понимает, как возникло тело, которое он носит, тот погибнет вместе с ним.


    И как тот, кто не знает Сына, узнает [Отца]?


    От того, кто не знает корня всего, всё сокрыто.


    Кто не знает корня беззакония, тому оно не чуждо.[b]


    Те, кто не понимает, как пришли, не поймут, как уйдут.


    И не чужд этому миру тот, кто [возвысит себя] и потому будет унижен».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перед словом «свет» в рукописи имеется лакуна; её объём и содержание здесь не восстанавливаются. Парадоксальное отрицание «не пребывает во тьме» сохранено по доступному свидетельству.
    reason: Необходимо обозначить повреждение текста и не скрывать текстологическую трудность.
  - marker: b
    text: 'Буквально: «не будет чужим ему»; вероятный смысл — человек остаётся причастен беззаконию, однако образ намеренно сохранён.'
    reason: Русская формула может быть понята неоднозначно, как и свидетельство.
  - marker: c
    text: Слова «возвысит себя» восстановлены издателями; связка «и потому» передаёт причинное пояснение доступного английского свидетельства.
    reason: Отмечает редакционное восстановление и источник причинной связи.
lexical_decisions:
- source_word: deed of completeness
  choice: дело полноты
  rationale: Сохранён необычный и потенциально технический оборот свидетельства без догматического истолкования «полноты» как совершенства или завершения.
- source_word: stands not in the darkness
  choice: не пребывает во тьме
  rationale: «Пребывает» естественнее по-русски, чем буквальное «стоит», и сохраняет состояние нахождения во тьме.
- source_word: blowing wind
  choice: дующий ветер
  rationale: Передаёт явное указание на движение ветра и поддерживает последующий образ того, кого унесёт.
- source_word: the body he wears
  choice: тело, которое он носит
  rationale: Сохранена метафора тела как надеваемого или носимого, хотя по-русски она намеренно звучит необычно.
- source_word: root of iniquity
  choice: корень беззакония
  rationale: «Беззаконие» сохраняет нравственно-религиозную широту исходного свидетельства и не сужает смысл до отдельного проступка.
- source_word: be no stranger to
  choice: не чуждо / не чужд
  rationale: Сохранён повторяющийся идиоматический образ причастности, не заменённый более толковательными выражениями вроде «принадлежит» или «подвластен».
theological_decisions:
- issue: Смысл «дела полноты»
  choice: Сохранить формулу «дело полноты»
  alternative: «совершенное деяние» или «дело завершения»
  rationale: Свидетельство допускает технический или космологический смысл; более гладкие варианты преждевременно разрешили бы неоднозначность.
- issue: Парадокс тьмы и света
  choice: 'Передать отрицание буквально: «не пребывает во тьме»'
  alternative: Исправить на «пребывает во тьме» или «не выйдет из тьмы»
  rationale: Текстологически трудное утверждение не следует молча нормализовать; лакуна перед словом «свет» также сохранена.
- issue: Крещение в воде
  choice: «что пользы ему креститься в ней?»
  alternative: «какая ему польза от омовения в ней?»
  rationale: «Креститься» прямо передаёт религиозную силу английского свидетельства, не добавляя учения о действенности обряда.
- issue: Сын и Отец
  choice: Сохранить титулы с прописной буквы и восстановление [Отца]
  alternative: строчные «сын» и «отец»
  rationale: Контекст указывает на титульное употребление; квадратные скобки честно отмечают восстановленный текст.
- issue: Самовозвышение и унижение
  choice: «[возвысит себя] и потому будет унижен»
  alternative: «превознесётся и смирится»
  rationale: Сохранена причинно-следственная связь, указанная в свидетельстве, и различие между действием человека и последующим пассивным унижением.
translation_notes:
  register: Современный литературный русский язык с афористическим, торжественным ритмом. Короткие параллельные высказывания и повтор «кто не…» сохранены. Рукописный номер страницы [15] исключён как не принадлежащий тексту. Все остальные восстановительные скобки и пустая лакуна сохранены. Поскольку прямой разбор коптского оригинала ещё не выполнен, draft остаётся предварительным и основан на указанном публичном английском свидетельстве.
