    text: 'Местоимение «вас» может обозначать одного или нескольких адресатов: английский свидетель не позволяет различить число.'
    reason: Сохранение грамматической неопределённости исходной традиции, насколько это возможно в русском.
  - marker: c
    text: Фраза может подразумевать ожидаемый решающий или эсхатологический срок, но повреждённый контекст не позволяет уточнить.
    reason: Предотвращает необоснованное догматическое уточнение.
  - marker: d
    text: После слов об «одиноком посохе» рукопись повреждена; значение образа остаётся неясным.
    reason: Предупреждает читателя о фрагментарности и неясности образа.
  - marker: e
    text: 'Буквально по английскому свидетелю: «смотрите на [то, что] внутри (вас)»; скобки отражают редакционные сигналы свидетеля.'
    reason: Поясняет необычную конструкцию и степень восстановления текста.
  - marker: f
    text: Ср. сходное изречение о внутреннем и внешнем в других раннехристианских текстах; здесь оно приводится самостоятельно, без заполнения утраченного контекста.
    reason: Указывает на традиционный характер выражения, не используя параллели для реконструкции лакун.
lexical_decisions:
- source_word: destruction
  choice: погибель
  rationale: Передаёт разрушение или гибель без преждевременного уточнения, идёт ли речь о космическом уничтожении, смерти или суде.
- source_word: archons
  choice: архонты
  rationale: Сохранён технический термин позднеантичной религиозной лексики; перевод «властители» мог бы сгладить его специфическое значение.
- source_word: logic
  choice: разум
  rationale: В данном фрагментарном контексте русское «разум» естественнее, чем «логика», и сохраняет связь со следующим выражением «живой ум»; решение предварительное из-за отсутствия прямой проверки коптского текста.
- source_word: living mind
  choice: живой ум
  rationale: Буквальное и достаточно естественное соответствие, не отождествляющее выражение с конкретной богословской категорией.
- source_word: crossing place
  choice: место перехода
  rationale: Сохраняет пространственный образ и неопределённость характера перехода.
- source_word: Have a single mind
  choice: Будьте единодушны
  rationale: Передаёт призыв к единству мысли естественным современным русским языком, не усиливая возможный аскетический или мистический смысл.
theological_decisions:
- issue: «Страх — подлинная сила [тьмы]»
  choice: Сохранено прямое отождествление страха с силой тьмы, при этом восстановленное «тьмы» оставлено в квадратных скобках.
  alternative: «Именно страх даёт [тьме] силу».
  rationale: Альтернатива причинно истолковывает фразу, тогда как свидетель формулирует более напряжённое отождествление.
- issue: Внутреннее и внешнее
  choice: «Сделайте то, что [внутри] вас, и то, что [вне вас], одним и тем же».
  alternative: «Соедините внутреннее и внешнее».
  rationale: Выбранный вариант сохраняет конкретную и парадоксальную форму высказывания, не превращая её в общее наставление о гармонии.
- issue: Место без власти и тирана
  choice: «где [нет] ни власти, [ни] тирана»
  alternative: «неподвластное ни царю, ни тирану».
  rationale: Не введена личная фигура царя и не уточнена космология; сохранена неоднозначность слова reign как господства или власти.
translation_notes:
  register: Современный литературный русский с возвышенным, но доступным тоном. Повторы и резкие переходы сохранены там, где они обусловлены фрагментарностью рукописи. Квадратные скобки обозначают восстановления или сомнительно читаемые элементы английского свидетеля, многоточия в квадратных скобках — утраты текста. Перевод неизбежно предварительный, поскольку предоставлена английская публикационная версия, а прямая сверка с коптским источником ожидается.
