translation:
  language: ru
  text: '«Я научу вас, когда придёт время погибели.[a] Первая сила тьмы настигнет вас; не бойтесь[b] и не говорите: „Вот, время пришло“.[c] Когда же увидите одинокий посох […].[d] Знайте, что […] от дела […] и архонты […] настигнут вас […]. Страх — подлинная сила [тьмы]. Поэтому, если вы устрашитесь того, что вскоре настигнет вас, оно одолеет вас, и ни один из них не отпустит вас и не проявит к вам жалости. Но смотрите на [то, что] внутри вас,[e] потому что вы овладели всем земным. Это […] [вознесёт] вас ввысь, в [место], где [нет] ни власти, [ни] тирана. Когда вы […] вы увидите тех […], и вы также [услышите их. Я] говорю вам: разум […] Разум — это [… где] истина. Они же […] и вы […] истину. Это [… внутри] живого [ума]. Поэтому […] и ваша радость […], чтобы […] ваши души […], чтобы слово не […] что они воздвигли […] и не смогли [понять] этого […]. Сделайте то, что [внутри] вас, и то, что [вне вас], одним и тем же.[f]


    Место […] перехода, несомненно, страшно в [ваших] глазах, но не колеблясь пройдите через него. Велика его глубина, огромна [его] высота! [Будьте единодушны …], и огонь […] капли росы […] все силы […] вас. Они […] и [все] силы […] они […] прежде. Говорю [вам]: […] душа […] станет […] во всех них […] вы […] и что […] не спите […] сыновья […] и вы […] вы […].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разрушения». Перевод предварительный; прямое изучение коптского текста ещё не проведено.'
    reason: Смысл английского witness destruction допускает несколько русских соответствий.
