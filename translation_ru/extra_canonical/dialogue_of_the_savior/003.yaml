  naturalness: Тон современный литературный и в целом удачен. «Время разрушения» несколько прозрачнее, чем «время погибели», для destruction; «не освободит вас» естественнее и точнее по контексту, чем «не отпустит вас». Синтаксические шероховатости в повреждённых местах оправданно сохранены.
  terminology: «Архонты», «разум», «живой ум» и «место перехода» допустимы как предварительные решения. «Власть» для reign не должна сопровождаться добавленным восстановлением «[нет]»; нейтральное «без власти» сохраняет структуру английского свидетеля. В примечании f убрано неподтверждённое сопоставление с иными текстами.
