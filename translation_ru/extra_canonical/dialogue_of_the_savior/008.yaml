translation:
  language: ru
  text: 'Иуда спросил:


    — Скажи мне, Господь, как [землетрясение], сотрясаясь, сотрясает землю?


    Господь поднял камень и держал его в руке. [Он сказал ему: «Что] я держу в руке?»


    Тот ответил:


    — [Это] камень.


    Он сказал им:


    — То, что поддерживает [землю], поддерживает и небо. Когда слово исходит от Величия, оно встречает то, что поддерживает небо и землю. Земля не сдвинется. Если бы она сдвинулась, то упала бы; но этого не происходит, чтобы первое слово не оказалось тщетным. Слово устроило мир, жило в нём и вдыхало его благоухание. Всем вам, Сынам Человека[a], я возвещаю всё неподвижное, потому что вы — оттуда. Вы живёте в сердцах тех, кто говорит с радостью и истиной. Если слово исходит из тела Отца к людям, а они его не принимают, оно возвращается на своё место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сынам Человека». Необычное множественное число может быть групповым наименованием; чтение и смысл требуют проверки по коптскому тексту.'
    reason: Форма богословски значима и отличается от привычного титула «Сын Человеческий».
lexical_decisions:
- source_word: word
  choice: слово
  rationale: 'Сохранён широкий смысл свидетельства: это может быть как произнесённое слово, так и персонифицированное Слово; прописная буква не вводится без надёжного основания.'
- source_word: Majesty
  choice: Величие
  rationale: Передано как титульное обозначение высшей божественной реальности, с сохранением абстрактной формы.
- source_word: supports
  choice: поддерживает
  rationale: Сохраняет повтор и космологическую образность опоры, не уточняя её природу.
- source_word: set up the world
  choice: устроило мир
  rationale: «Устроило» естественно по-русски и допускает значения основания, установления порядка и созидания.
- source_word: smelled the fragrance thereof
  choice: вдыхало его благоухание
  rationale: Сохраняет чувственный и загадочный образ, избегая неестественного буквального «обоняло благоухание».
- source_word: Sons of Man
  choice: Сыны Человека
  rationale: Необычная форма сохранена как возможное групповое наименование; она не сведена к традиционному единственному титулу «Сын Человеческий».
- source_word: Father’s body
  choice: тело Отца
  rationale: Прямой телесный образ сохранён без богословского смягчения или истолкования.
theological_decisions:
- issue: Статус «слова»
  choice: «слово» со строчной буквы
  alternative: «Слово» как явный личный божественный титул
  rationale: Контекст допускает персонификацию, однако представленное свидетельство не позволяет однозначно отождествить слово с Логосом; двусмысленность сохранена.
- issue: Причина неподвижности земли
  choice: «чтобы первое слово не оказалось тщетным»
  alternative: «чтобы первое слово не потерпело неудачи / не нарушилось»
  rationale: Формулировка сохраняет трудную связь между устойчивостью мира и действенностью первоначального слова, не объясняя её сверх текста.
- issue: Происхождение адресатов
  choice: «вы — оттуда»
  alternative: «вы происходите из того места»
  rationale: Указательная неопределённость оригинального свидетельства сохранена; референт не назван.
- issue: Пребывание адресатов в сердцах говорящих
  choice: сохранено буквально по смыслу
  alternative: истолковать как духовное присутствие или память
  rationale: Загадочное антропологическое утверждение не разрешено конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. Сохранены квадратные скобки, обозначающие повреждения рукописи или редакторские восстановления; номера страниц кодекса, разрывавшие фразы, опущены. Из-за отсутствия завершённой сверки с коптским текстом перевод является предварительным и основан на предоставленном англоязычном публичном свидетельстве.
