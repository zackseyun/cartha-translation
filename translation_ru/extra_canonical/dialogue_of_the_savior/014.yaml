translation:
  language: ru
  text: 'Мария спросила: «[Какого] рода горчичное зерно? Оно с Неба[a] или с земли?»


    Господь сказал: «После того как Отец устроил мир для себя, он оставил многое из того, что осталось, у Матери Всего[b]. Поэтому он сеет и трудится».


    Иуда сказал: «Ты сказал нам это от истинного ума. Когда мы молимся, как нам следует молиться?»


    Господь сказал: «Молитесь там, где нет женщины».


    Матфей говорит: «Он велит нам: „Молитесь там, где нет женщины“. Это значит уничтожить дела женского начала[c]. Не потому, что существует иной род рождения, но чтобы они перестали [рождать]».


    Мария сказала: «Неужели они никогда не будут уничтожены?»


    Господь сказал: «[Вы] знаете, что они [снова] погибнут, […] и [дела женского начала, которые здесь], также будут [уничтожены]».


    Иуда сказал [Матфею]: «Дела [женского начала] и в самом деле погибнут. Тогда архонты[d] [призовут свои эоны], а мы будем готовы к встрече с ними».


    Господь сказал: «Увидят ли они [вас и увидят ли] тех, кто принимает вас? Вот, от Отца в безмолвии исходит к бездне истинное слово — со вспышкой молнии, — и оно рождает[e]. Видят ли они его или одолевают его? Поистине, вы лучше знаете [путь], которого не знает [ни ангел], ни власть. Это путь Отца и Сына, потому что двое — одно, и вы пойдёте по [пути], который познали. Даже если архонты станут огромными, они не смогут его достичь. Говорю вам [истину]: даже мне трудно его достичь».


    […] [Мария] спросила [Господа]: «Если дела [уничтожаются, то что же] уничтожает дело?»


    [Господь сказал]: «Вы знаете: [когда] я уничтожу [его, оно] уйдёт в своё место».


    Иуда сказал: «Как дух становится видимым?»


    Господь сказал: «Как [становится видимым] меч?»


    Иуда сказал: «Как свет становится видимым?»


    Господь сказал: «[Он] вечно [становится видимым] сам собой».


    Иуда спросил: «Кто упраздняет чьи дела? Дела [упраздняют] мир или мир упраздняет дела?»


    Господь [ответил]: «Тот, кто [понимает, и есть тот, кто упраздняет дела]. Ведь познавший дела должен исполнять [волю] Отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небо» здесь передано с прописной буквы вслед за космологическим противопоставлением в имеющемся свидетельстве; коптский оригинал ещё требует прямой сверки.
    reason: Обозначить переводческую и текстологическую предварительность выбора.
  - marker: b
    text: «Матерь Всего» — космологический титул; точный смысл образа в этом повреждённом и трудном месте остаётся неясным.
    reason: Не допустить отождествления с конкретным позднейшим учением без достаточных оснований.
  - marker: c
    text: 'Буквально в английском свидетельстве: «дела женского». Выражение может относиться к рождению или порождению, но текст не даёт вполне однозначного толкования.'
    reason: Сохранить семантическую и богословскую неоднозначность.
  - marker: d
    text: Архонты — «властители», космические силы в терминологии ряда наг-хаммадских текстов.
    reason: Пояснить специальный заимствованный термин обычному читателю.
  - marker: e
    text: 'Возможны передачи: «оно порождает», «оно плодотворно». Здесь сохранён глагольный образ рождения, связанный с ближайшим контекстом.'
    reason: Зафиксировать неоднозначность слова generative в промежуточном английском свидетельстве.
lexical_decisions:
- source_word: mustard seed
  choice: горчичное зерно
  rationale: Естественный русский библейский эквивалент, сохраняющий образ зерна, а не только растения.
- source_word: Mother of the All
  choice: Матерь Всего
  rationale: Сохранён титульный и космологический характер выражения без догматического истолкования.
- source_word: works of the female
  choice: дела женского начала
  rationale: Буквальное «дела женщины/женского» по-русски может ошибочно звучать как обозначение поступков конкретных женщин; «женское начало» передаёт абстрактную космологическую направленность, не снимая напряжённости текста.
- source_word: archons
  choice: архонты
  rationale: Устоявшийся термин для властителей в наг-хаммадской литературе; перевод «правители» мог бы скрыть специальный смысл.
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический термин древней космологии без конфессиональной конкретизации.
- source_word: dissolves
  choice: упраздняет
  rationale: Передаёт прекращение и разрушение действия «дел» и допускает более широкий смысл, чем физическое «растворяет».
- source_word: work the will of the Father
  choice: исполнять волю Отца
  rationale: Естественная русская передача идиомы, сохраняющая словесную связь с деланием по смыслу.
theological_decisions:
- issue: Высказывание «там, где нет женщины»
  choice: Сохранено прямо, без смягчения; последующее толкование Матфея переведено как «женское начало».
  alternative: Перетолковать как призыв к безбрачию, аскезе или внутреннему состоянию.
  rationale: Текст сам остаётся космологически и антропологически напряжённым; нельзя внедрять определённое конфессиональное объяснение.
- issue: Единство Отца и Сына
  choice: «двое — одно»
  alternative: «они единосущны» или «они составляют одно существо»
  rationale: Формулировка сохраняет лаконичность и подлинную неоднозначность, не импортируя позднейшую догматическую терминологию.
- issue: Слова Господа о трудности достижения пути
  choice: «даже мне трудно его достичь»
  alternative: Смягчить или истолковать как риторический вопрос.
  rationale: Сохранено богословское напряжение имеющегося свидетельства, хотя фраза необычна для канонической христологии.
- issue: Кто уничтожает дела
  choice: Восстановление сохранено в квадратных скобках.
  alternative: Подать восстановленный текст как несомненный.
  rationale: Рукописная повреждённость не позволяет скрывать редакционную реконструкцию.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но понятной диалогической интонацией. Квадратные скобки сохранены как знаки реконструкции утраченного или повреждённого текста; пустые скобки переданы многоточием в квадратных скобках. Номера рукописных страниц опущены. Перевод предварительный: выполнен по предоставленному общественнодоступному английскому свидетельству, поскольку прямая проверка коптского текста ещё не проведена.'
