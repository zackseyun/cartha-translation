  source_fidelity: Перевод в целом точно следует предоставленному английскому свидетельству и бережно сохраняет квадратные скобки как знаки реконструкции и лакуны. Однако «женское начало» добавляет метафизическое понятие, которого формулировка witness «the female» сама по себе не уточняет. Более нейтральное субстантивированное «женское» лучше сохраняет намеренную трудность и неоднозначность текста.
  naturalness: Торжественный диалогический регистр в целом удачен. Исправлено неестественное «от истинного ума» на «исходя из истинного разума»; «дела женского» намеренно необычно, но оправдано как буквальное сохранение специальной и нераскрытой формулы.
  terminology: «Архонты» и «эоны» сохранены как технические термины. «Матерь Всего» и «двое — одно» не получают конфессионального истолкования. «Дела женского» заменяет интерпретирующее «дела женского начала».
  issues:
  - severity: medium
    issue: «Дела женского начала»
    rationale: Добавление слова «начала» превращает неопределённое «the female» в более определённую космологическую абстракцию. Ни английское свидетельство, ни сохранённый контекст не требуют такого уточнения.
  - severity: low
    issue: «Ты сказал нам это от истинного ума»
    rationale: Фраза является буквальной калькой и звучит неестественно по-русски. «Ты сказал нам это, исходя из истинного разума» сохраняет связь с true mind, не меняя смысла.
