review_pass:
  verdict: revise
  source_fidelity: 'Перевод в целом бережно воспроизводит предоставленное английское свидетельство, включая квадратные скобки, лакуны, многоточия и угловую скобку. Однако несколько формулировок можно сделать точнее: «sign» лучше передать нейтральным «знак», а заключительное «hang from them» требует образа «висят на них», а не более слабого «держатся на них». Неясные референты местоимений и повреждённый синтаксис космогонического раздела сохранены без догматических подстановок.'
  naturalness: 'Русский текст в основном литературен и удобочитаем. Исправлены отдельные шероховатости: конструкция «как ... так и ...» точнее передаёт корреляцию оригинала; «от самих себя» естественнее в повелении об удалении внутреннего; заключительное описание сделано грамматически нейтральным, без неоправданной персонификации «те, кто».'
  terminology: '«Дух», «ум», «душа», «обрезание», «силы», «слово» и «эоны» переданы последовательно. Строчное «слово» оправдано: предоставленное свидетельство не требует идентифицировать его с личным Логосом. «Огненная бездна» удачно передаёт inferno, не навязывая значение ада.'
  issues:
  - severity: low
    issue: «Знамение над землёй» для sign
    rationale: «Знамение» добавляет оттенок предзнаменования или чуда, которого нейтральное английское sign само по себе не требует. «Знак» сохраняет образ без дополнительного истолкования.
  - severity: medium
    issue: «Всё держится на них» вместо образа подвешенности
    rationale: В свидетельстве дважды сказано hang from them. «Держится на них» ослабляет пространственный образ; «висят на них» передаёт его непосредственно.
  - severity: low
    issue: Персонификация в «те, кто над небом...»
    rationale: Those не обязательно обозначает лиц. Нейтральное «те, что находятся...» не сужает референт повреждённого космогонического текста.
  - severity: low
    issue: Корреляция в предложении об обрезании сердец
    rationale: Оригинальное because as ... so требует в русском явной парной конструкции «как ... так и», чтобы сохранить логическую связь без изменения смысла.
