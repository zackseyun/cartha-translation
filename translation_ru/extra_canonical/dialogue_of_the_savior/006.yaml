translation:
  language: ru
  text: '**Диалог Спасителя — Сотворение и обрезание**[a]


    Иуда спросил:


    — Скажи [нам], Господи, что [существовало] прежде, чем возникли [небо и] земля?


    Господь сказал:


    — Были тьма и вода, и [] дух пребывал над [водой]. И говорю вам [истину]: вот, то, чего вы ищете и о чём спрашиваете, [находится] внутри вас. Оно [обладает] силой и тайной духа, потому что [ведёт начало] от [духа]. Беззаконие вошло, [чтобы непрестанно разрушать] ум. Вот, […].[b]


    [Матфей] сказал:


    — Господи, скажи нам: где утверждена [душа] и где обитает истинный [ум]?


    Господь [сказал]:


    — Огонь духа возник [между] ними двумя; так возник [дух], а внутри них — истинный ум. [Если] кто утвердит душу в вышине, тогда [она будет] возвышена.


    Матфей спросил его: []


    — [Разве обрезание не необходимо], если понимать его [согласно истинному истолкованию]?


    Господь [сказал: «Обрезание] полезнее вашего [дела. Удалите] из себя [то, что может] преследовать вас, — всё, что [находится] в ваших сердцах. Ибо по мере того как ваши сердца [будут обрезаны], вы [найдёте] путь одолеть силы вверху и внизу. И говорю вам: пусть тот, [кто обладает] силой, откажется [от неё и] раскается, а тот, кто [понимает], пусть ищет, найдёт и возрадуется».


    Иуда сказал:


    — Вот, [я] вижу, что всё в точности подобно знамению над [землёй] и что именно поэтому всё возникло таким образом.


    Господь [сказал]:


    — Когда Отец устроил мир, Он [собрал вместе] часть его воды, и из неё вышло слово. [] Оно претерпело много [бед], но было выше пути [звёзд], окружающего всю землю.


    [Он продолжил]:


    — Вода, собранная [вверху], находится за пределами звёзд, а [за] водой <находится> великая огненная бездна, окружающая их словно стена. Как только некоторые из сущностей, находившихся внутри, отделились от остальных, [начали исчисляться] промежутки времени.


    Когда [всё целое] было устроено, он посмотрел [вниз] — Отец, сказавший ему: «Иди, [произведи нечто] из себя, чтобы [земля] ни в чём не имела недостатка из поколения в [поколение и] из века в век».


    И тогда [оно] произвело из себя источники молока, источники мёда, масла и вина, а также добрые плоды, приятные вкусы и целебные корни, [чтобы] земля ни в чём не имела недостатка из поколения [в] поколение и из века в век.


    Оно — над […]; [] стояло [и являло] свою красоту […]. А снаружи [был великий свет], ярче [того], который ему подобен, потому что тот властвует над [всеми] эонами вверху и внизу. [Свет был] извлечён из огня и рассеян по [небесному своду] вверху и внизу. Те, кто над небом вверху и над землёй внизу, держатся на них. Всё держится на них.[c]


    Услышав это, Иуда простёрся ниц, преклонил колени и прославил Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному общедоступному английскому свидетельству рукописи Nag Hammadi Codex III,5; непосредственная сверка с коптским текстом ещё требуется.'
    reason: Честно обозначает ограничение источниковой базы и не выдаёт посредствующее свидетельство за прямой перевод с коптского.
  - marker: b
    text: Квадратные скобки обозначают восстановленный или неуверенно читаемый текст; пустые скобки и многоточия — утраты в рукописи. Угловые скобки обозначают редакционное добавление.
    reason: Читателю необходимо отличать древний сохранившийся текст от современных восстановлений и лакун.
  - marker: c
    text: Последний космогонический отрывок сильно повреждён. Референты местоимений «оно», «ему», «них» и соотношение света, огня, небесного свода и иных сущностей остаются неясными.
    reason: Предупреждает против ложной определённости там, где свидетельство фрагментарно и синтаксис неоднозначен.
lexical_decisions:
- source_word: spirit
  choice: дух
  rationale: Сохранено строчное написание там, где контекст не позволяет уверенно определить, является ли это личным именованием или обозначением духовной сущности.
- source_word: mind
  choice: ум
  rationale: Передаёт мыслительную и духовную способность без внесения позднейшей специальной терминологии.
- source_word: secrecy
  choice: тайна
  rationale: Естественное русское соответствие, сохраняющее эзотерический оттенок, но не уточняющее его сверх свидетельства.
- source_word: circumcision
  choice: обрезание
  rationale: Прямой и общепонятный эквивалент; телесный и внутренний смыслы намеренно сохраняются в напряжении.
- source_word: powers
  choice: силы
  rationale: Сохраняет возможное космологическое значение и не заменяет его конфессионально окрашенным толкованием.
- source_word: word
  choice: слово
  rationale: 'Строчное написание сохраняет неопределённость: свидетельство не требует однозначно отождествлять это слово с личным Логосом.'
- source_word: inferno
  choice: огненная бездна
  rationale: Передаёт образ огромной окружающей огненной области естественнее, чем заимствование «инферно», не отождествляя её автоматически с адом.
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический космологический термин древнего текста, поскольку замена на «веки» могла бы устранить предметную неоднозначность.
- source_word: set up
  choice: устроил / утверждена
  rationale: 'Выбор зависит от контекста: для мира употреблено естественное «устроил», для души — «утверждена», чтобы сохранить пространственно-онтологический оттенок.'
theological_decisions:
- issue: Связь обрезания с сердцем
  choice: Сохранены и буквальное «обрезание», и последующее «обрезание сердец».
  alternative: Сразу истолковать вопрос как относящийся только к духовному очищению.
  rationale: Текст сам создаёт переход от обряда к внутреннему состоянию; перевод не должен заранее устранять это напряжение.
- issue: Отказ обладающего силой
  choice: «пусть тот, кто обладает силой, откажется [от неё]»
  alternative: Понимать это как отказ от власти, могущества или конкретных сверхъестественных способностей.
  rationale: Референт «силы» неясен, поэтому сохранена общая формулировка и восстановленное местоимение оставлено в скобках.
- issue: Слово, вышедшее из воды
  choice: «слово» со строчной буквы
  alternative: «Слово» как однозначное личное божественное именование.
  rationale: Контекст допускает богословское прочтение, но повреждённое свидетельство не позволяет навязать его как единственное.
- issue: Неустойчивые местоименные референты в космогоническом разделе
  choice: Сохранены формы «он», «ему», «оно», «них» без поясняющих подстановок.
  alternative: 'Заменить каждое местоимение предполагаемым существительным: Отец, мир, вода, свет или звёзды.'
  rationale: Такие подстановки скрыли бы реальную неясность повреждённого текста и могли бы создать отсутствующую в свидетельстве космологическую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством диалогической религиозной прозы. Реплики оформлены естественно для русского чтения, но квадратные скобки, лакуны, угловые скобки и резкие синтаксические переходы сохранены как признаки повреждённого свидетельства. Конфессиональные уточнения не добавлялись; космологическая и антропологическая неоднозначность намеренно не сглажена.
