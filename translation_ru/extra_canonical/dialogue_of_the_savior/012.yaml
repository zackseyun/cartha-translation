translation:
  language: ru
  text: 'Ученики спросили Его:


    — Что такое полнота и что такое недостаток?


    Он ответил им:


    — Вы пришли из полноты, а живёте в месте недостатка.


    И вот, его свет излился на меня.


    Матфей спросил:


    — Господи, скажи мне: как умирают мёртвые и как живут живые?


    Господь сказал:


    — [Вы] спросили Меня об [истинном] изречении, которого глаз не видел, и вы — единственные, от кого Я услышал его. Я же говорю вам: когда то, что одушевляет человека, удаляется, его назовут мёртвым; а когда живое <входит> в мёртвое, его назовут живым.[a]


    Иуда спросил:


    — Если говорить по правде, почему одни <умирают>, а другие живут?[b]


    Господь сказал:


    — Всё, что происходит от истины, не умрёт. Всё, что происходит от женщины, умрёт.


    Мария спросила:


    — Скажи мне, Господи, зачем я пришла в это место: чтобы обрести пользу или потерпеть ущерб?


    Господь ответил:


    — Ты являешь богатство того, кто открывает.[c]


    Мария спросила Его:


    — Господи, есть ли тогда место, оставленное истиной или лишённое истины?[d]


    Господь сказал:


    — То место, где Я не обитаю.


    Мария сказала:


    — Господи, Ты внушаешь страх и изумление — даже [словно огонь пожирающий] для тех, кто не знает [Тебя].[e]


    Матфей спросил:


    — Почему мы не обретаем покой сразу?


    Господь сказал:


    — Оставив позади то, чего вы не можете взять с собой, вы тогда обретёте покой.


    Матфей спросил:


    — Как малое согласуется с великим?


    Господь сказал:


    — Если оставить позади эти бремена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Квадратные скобки обозначают восстановленные или не вполне сохранные слова; угловые скобки — редакционное восполнение предполагаемо пропущенного слова. Перевод предварительный: непосредственная сверка с коптским текстом ещё требуется.'
    reason: Сохраняет текстологические сигналы предоставленного свидетельства и честно указывает ограничение источниковой базы.
  - marker: b
    text: Слово «умирают» восполнено издателями.
    reason: Отмечает редакционное восполнение в вопросе Иуды.
  - marker: c
    text: 'Возможен более титульный перевод: «Ты являешь богатство Открывателя»; смысл фразы остаётся неясным.'
    reason: Сохраняет лексическую и богословскую неоднозначность выражения revealer.
  - marker: d
    text: 'Фраза допускает по меньшей мере два понимания: место, оставленное истиной, или место, в котором истины недостаёт.'
    reason: Объясняет синтаксическую альтернативу, отмеченную в свидетельстве.
  - marker: e
    text: В этой реплике рукопись повреждена; слова в квадратных скобках восстановлены издателями.
    reason: Предупреждает читателя о лакуне и степени реконструкции.
lexical_decisions:
- source_word: fullness
  choice: полнота
  rationale: Сохраняет ключевой абстрактный и, возможно, технический смысл свидетельства, не сводя его к «совершенству» или «изобилию».
- source_word: deficiency
  choice: недостаток
  rationale: Передаёт противопоставление полноте и сохраняет онтологическую либо пространственную неоднозначность.
- source_word: what animates a person
  choice: то, что одушевляет человека
  rationale: Не отождествляет неопределённое выражение без достаточных оснований ни с душой, ни с духом, ни с жизненной силой.
- source_word: rest
  choice: обрести покой
  rationale: Естественная русская формулировка, сохраняющая возможность как буквального отдыха, так и духовно-эсхатологического покоя.
- source_word: wealth
  choice: богатство
  rationale: Сохраняет образ и потенциальный технический оттенок, не заменяя его интерпретирующими словами «слава» или «изобилие».
- source_word: revealer
  choice: тот, кто открывает
  rationale: Передаёт действующее лицо без введения не засвидетельствованного титула «Откровитель».
- source_word: burdens
  choice: бремена
  rationale: Дигнифицированное и понятное слово, способное обозначать как физическую ношу, так и духовные обременения.
theological_decisions:
- issue: Противопоставление происходящего от истины и происходящего от женщины
  choice: Сохранена буквальная напряжённость высказывания без поясняющей гармонизации.
  alternative: Истолковать «от женщины» как исключительно плотское или земное рождение.
  rationale: Предоставленное свидетельство не определяет смысл прямо; интерпретирующая подстановка сняла бы подлинную неоднозначность.
- issue: Свет в выражении «его свет»
  choice: Сохранено местоимение «его» со строчной буквы.
  alternative: Уточнить референт как Бога, Господа или полноту и написать «Его».
  rationale: Антецедент местоимения в отрывке неясен, поэтому уточнение было бы спекулятивным.
- issue: «Живое» и «мёртвое»
  choice: Сохранены субстантивированные определения без отождествления с душой и телом.
  alternative: Перевести как «душа входит в мёртвое тело».
  rationale: Такое отождествление богословски конкретизировало бы формулировку сверх данных свидетельства.
- issue: Место, оставленное или лишённое истины
  choice: Обе возможные смысловые связи представлены в основном тексте.
  alternative: Выбрать только «место, где нет истины».
  rationale: Свидетельство прямо отмечает синтаксическую неоднозначность, которую следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством диалогической религиозной прозы. В обращениях к Господу использованы прописные местоимения по русской издательской традиции; при неопределённом референте в выражении «его свет» оставлена строчная буква. Структура вопросов и ответов сохранена, тяжеловесные буквальные кальки умеренно сглажены. Голые номера рукописных страниц 19 и 20 не включены.
