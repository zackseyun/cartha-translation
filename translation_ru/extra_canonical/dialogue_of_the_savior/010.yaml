translation:
  language: ru
  text: '**Диалог Спасителя — Великая высота и бездна**


    Он [взял] Иуду, Матфея и Марию […] [чтобы показать им крайний] предел неба и земли. И когда он возложил на них [руку], они надеялись, что смогут [увидеть] его.


    Иуда посмотрел вверх и увидел место великой высоты, а внизу увидел место бездны.


    Иуда сказал Матфею:


    — Брат, кто способен подняться на такую высоту или спуститься в бездну внизу, если там великое пламя и великий ужас?


    В то же мгновение с высоты изошло слово.[a] Стоя там, Иуда увидел, как слово спус[тилось].


    Он спросил слово:


    — Почему ты спустилось?


    Сын Человеческий приветствовал их и сказал им:


    — Семя, происходившее от силы, было ущербным[b] и сошло в бездну земли. Величие вспомнило [о нём] и послало к нему [слово]. Слово вознесло семя пред [лицо] Величия, чтобы […] первое слово не погибло.


    [Его] ученики дивились всему, что он говорил им, и всё принимали с верой, хотя и знали, что размышлять о неправедности бесполезно.


    Затем он сказал своим ученикам:


    — Разве я не говорил вам, что добро будет вознесено к свету, словно зримый голос[c] и вспышка молнии?


    Все его ученики восхвалили его и сказали:


    — Господи, прежде чем ты явился здесь, кто восхвалял тебя, если все хвалы — тебе? Или кто благословлял [тебя], если все благословения — тебе?


    Пока они стояли там, он увидел двух духов, которые вели с собой одну душу. И сверкнула яркая молния. От Сына Человеческого изошло слово:


    — Дайте им их одежды!


    И малое стало таким же, как великое.[d] Они были [подобны] тем, кого приняли в вышину. […] [Между ними не было различия]. [Речения], которые он [произнёс, убедили] учеников.


    Мария [сказала ему]:


    — [Вот, я] вижу зло, [воздействующее на] людей с самого начала, когда они живут друг с другом.


    Господь сказал [ей]:


    — Когда ты видишь их, [ты знаешь] многое. Они [не останутся там вместе]. Но когда ты увидишь Вечно Сущего, это будет великим видением.


    Все они сказали ему:


    — Объясни нам это.


    Он сказал им:


    — Каким образом вы хотите увидеть это: [в] видении, которое проходит, или в видении, которое пребывает вечно?


    И он продолжил:


    — Изо всех сил старайтесь спасти то, что останется после [вас]; ищите это и говорите изнутри него,[e] чтобы всё, чего вы ищете, было в согласии с вами. Ибо истинно [говорю] вам: живой Бог [находится] внутри вас, […] [как и вы находитесь] внутри Бога.


    [a] «Слово» здесь представлено как действующее лицо; необычная образность исходного свидетельства сохранена без отождествления с какой-либо определённой богословской концепцией.


    [b] Выражение допускает значения «испытывало недостаток», «было неполным» или «было ущербным». Выбрано «было ущербным», чтобы сохранить смысл недостаточности, не уточняя её природу.


    [c] Буквально по доступному английскому свидетельству: «зримый голос». Трудное сочетание сохранено, поскольку его смысл неясен.


    [d] Буквально: «малое стало таким же, как великое». Неясно, говорится ли о размере, положении или ином качестве.


    [e] Местоимение, вероятно, относится к «тому, что останется», однако повреждённый контекст не позволяет установить смысл выражения с уверенностью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Слово» здесь представлено как действующее лицо; необычная образность исходного свидетельства сохранена без отождествления с какой-либо определённой богословской концепцией.
    reason: Предотвращает неоговорённое догматическое отождествление персонифицированного слова.
  - marker: b
    text: Выражение допускает значения «испытывало недостаток», «было неполным» или «было ущербным». Выбрано «было ущербным», чтобы сохранить смысл недостаточности, не уточняя её природу.
    reason: Фиксирует существенную лексическую неоднозначность.
  - marker: c
    text: 'Буквально по доступному английскому свидетельству: «зримый голос». Трудное сочетание сохранено, поскольку его смысл неясен.'
    reason: Не сглаживает необычный и, возможно, повреждённый образ.
  - marker: d
    text: 'Буквально: «малое стало таким же, как великое». Неясно, говорится ли о размере, положении или ином качестве.'
    reason: Сохраняет референциальную неопределённость фразы.
  - marker: e
    text: Местоимение, вероятно, относится к «тому, что останется», однако повреждённый контекст не позволяет установить смысл выражения с уверенностью.
    reason: Отмечает синтаксическую неясность повреждённого места.
lexical_decisions:
- source_word: word
  choice: слово
  rationale: Сохранён повторяющийся ключевой образ английского свидетельства и его персонификация; богословское отождествление не навязывается.
- source_word: power
  choice: сила
  rationale: Передаёт абстрактное либо персонифицированное значение, не решая, обозначает ли слово способность, сущность или небесную силу.
- source_word: Majesty
  choice: Величие
  rationale: Сохранено титульное абстрактное наименование с прописной буквы.
- source_word: inferno
  choice: пламя
  rationale: Естественное современное обозначение огромного губительного огня без добавления более определённого конфессионального образа ада.
- source_word: Eternally Existent One
  choice: Вечно Сущий
  rationale: Достоинственно и естественно передаёт вечное существование как титул, не устраняя его метафизической напряжённости.
- source_word: vision
  choice: видение
  rationale: Сохраняет противопоставление преходящего и вечно пребывающего способа видения.
theological_decisions:
- issue: Личностный статус «слова»
  choice: Сохранить средний род слова «слово» и его прямую речь
  alternative: Персонифицировать как «Слово» с прописной буквы или отождествить с Логосом
  rationale: Свидетельство изображает слово действующим и говорящим, но предоставленных данных недостаточно для однозначного догматического отождествления.
- issue: Природа «силы» и «Величия»
  choice: Передать буквально и не пояснять их место в космологии текста
  alternative: Истолковать как конкретные божественные ипостаси или чины
  rationale: Так сохраняется подлинная неоднозначность и не привносится частная доктрина.
- issue: Взаимное пребывание Бога и людей
  choice: Сохранить симметричную формулу «Бог внутри вас… вы внутри Бога»
  alternative: Ослабить её до нравственного присутствия или усилить до онтологического тождества
  rationale: Перевод не должен разрешать богословское напряжение, отсутствующее в самом доступном свидетельстве.
translation_notes:
  register: 'Современный литературный русский язык с достоинством древнего диалога и умеренно возвышенной лексикой. Квадратные скобки сохраняют редакционные восстановления и лакуны; голые номера страниц рукописи удалены. Проект предварительный: он подготовлен по предоставленному публичному английскому свидетельству, поскольку прямая сверка с коптским текстом ещё ожидается.'
