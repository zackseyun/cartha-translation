review_pass:
  verdict: revise
  source_fidelity: 'По предоставленному английскому свидетельству передача в целом близка, однако «inferno» нельзя сужать до одного лишь «пламени»: требуется сохранить образ преисподней/ада. Также пустые квадратные скобки и угловые скобки следует воспроизводить как отдельные текстологические сигналы, а не заменять многоточием.'
  naturalness: Регистр в основном современный литературный и уместно возвышенный. Ряд формулировок уточнён для естественности без устранения намеренной странности образов («зримый голос», говорящее «слово»).
  terminology: Иуда, Матфей, Мария, Сын Человеческий, Величие и Вечно Сущий переданы последовательно. «Слово» сохранено со строчной буквы, поскольку свидетельство не требует догматического отождествления. «Преисподняя» точнее передаёт inferno, чем «пламя».
  issues:
  - severity: medium
    issue: «inferno» передано как «пламя».
    rationale: «Пламя» обозначает только огонь, тогда как исходное «great inferno» называет устрашающее подземное/адское место. «Великая преисподняя» сохраняет пространственный и образный смысл, не навязывая конфессионально точной картины.
  - severity: medium
    issue: Пустые редакторские скобки [] заменены на […].
    rationale: В исходном свидетельстве пустые скобки отмечают лакуну или неустановленное восстановление; многоточие добавляет иной редакторский знак. Их следует сохранить как [] согласно заявленному принципу.
  - severity: low
    issue: Угловые скобки в фразе о благословениях не сохранены.
    rationale: В английском свидетельстве <are for> является редакторским дополнением; в русском его следует обозначить угловыми скобками.
  - severity: low
    issue: «крайний предел» избыточен для «extreme edge».
    rationale: «Самый край» естественнее и передаёт усилительное значение без тавтологии.
