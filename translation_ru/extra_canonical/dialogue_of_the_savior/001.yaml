translation:
  language: ru
  text: 'Спаситель сказал своим ученикам: «Братья, теперь настало время оставить наш труд и обрести покой, потому что тот, кто пребывает в покое, будет покоиться вечно. Говорю вам: всегда поднимайтесь выше [. . .] временности [. . .]. [Говорю] вам: [. . .] не бойтесь [тех, кто . . .] вас. Я [говорю вам]: гнев страшен, [и тот, кто] вызывает гнев, — [страшный человек]. Но поскольку вы [смогли перенести страдания], это может выйти из [вас . . .].


    «Люди приняли эти слова о гневе со страхом и трепетом. Гнев поставил над ними архонтов[b], потому что никто не может избежать гнева. Но когда я пришёл, то открыл путь и наставил людей, как совершить переход, — избранных и пребывающих в уединении[c], [d] тех, кто познал Отца, сохранил верность истине и вознёс хвалу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству; непосредственная сверка с коптским текстом Наг-Хаммади III,5 ещё не проведена.'
    reason: Честно обозначает ограниченную источниковую основу и статус текста.
  - marker: b
    text: Архонты — буквально «правители» или «властители»; здесь сохранён традиционный термин, поскольку точный смысл в данном контексте неясен.
    reason: Термин может иметь как общее, так и специальное космологическое значение.
  - marker: c
    text: 'Или: «уединённых», «одиноких». Слово может обозначать отделённых от других людей, но не обязательно монахов в позднейшем смысле.'
    reason: Сохраняет лексическую и историческую неоднозначность.
  - marker: d
    text: Пустые квадратные скобки воспроизводят обозначение лакуны в используемом свидетельстве; утраченный текст не восстановлен.
    reason: Объясняет необычный знак повреждения рукописи.
lexical_decisions:
- source_word: stand at rest / rest
  choice: обрести покой / пребывать в покое / покоиться
  rationale: Передаёт повтор ключевого образа покоя естественным русским языком, не сводя его однозначно ни к бездействию, ни к смерти.
- source_word: transcend
  choice: поднимайтесь выше
  rationale: Сохраняет идею преодоления или выхода за пределы и звучит понятнее современному читателю, чем калька «трансцендируйте».
- source_word: temporality
  choice: временность
  rationale: Сохраняет абстрактное значение ограниченности временем; из-за лакуны контекст не позволяет уверенно заменить его более конкретным выражением.
- source_word: archons
  choice: архонты
  rationale: Сохраняет характерный древний термин и не отождествляет его без достаточных оснований с земными правителями, властями или бесами.
- source_word: crossing over
  choice: совершить переход
  rationale: 'Сохраняет метафорическую открытость: речь может идти о духовном переходе, избавлении или прохождении пути.'
- source_word: solitary
  choice: пребывающие в уединении
  rationale: Передаёт возможное значение отделённости или уединённости, не навязывая более позднюю категорию монашества.
theological_decisions:
- issue: Связь вечного покоя с прекращением труда
  choice: Сохранён образ покоя без догматического истолкования
  alternative: Передать как спасение, смерть, субботний покой или прекращение земных дел
  rationale: Повреждённый контекст не позволяет надёжно выбрать одно богословское толкование.
- issue: Персонификация гнева
  choice: «Гнев поставил над ними архонтов»
  alternative: 'Ослабить субъектность: «из-за гнева над ними были поставлены власти»'
  rationale: Исходное свидетельство прямо представляет гнев действующим субъектом; необычность и напряжение сохранены.
- issue: Кому относится заключительная похвала
  choice: Сохранена последовательность однородных описаний без добавочного толкования
  alternative: Явно отнести «вознёс хвалу» только к ученикам или только к избранным
  rationale: Синтаксис английского свидетельства допускает неясность, а коптская проверка ещё не проведена.
