  source_fidelity: 'В целом переданы ключевые образы и намеренно сохранены лакуны. Однако в черновике нарушено оформление единой прямой речи: перед вторым абзацем повторно открыты кавычки, хотя в свидетельстве слова Спасителя продолжаются. Кроме того, «наставил людей, как совершить переход, — избранных...» создаёт в русском грамматически неясную конструкцию и размывает связь «пути перехода» с избранными и уединёнными. Перевод «вознесли хвалу» передаёт второе лицо множественного числа, не разрешая его спорную референцию.'
  naturalness: После исправления кавычек и синтаксиса текст звучит как современный литературный русский при сохранении намеренной фрагментарности. «Прекратить наш труд и пребывать в покое» точнее поддерживает повтор образа stand at rest / rest, чем сочетание «обрести покой» и «пребывает в покое».
  terminology: «Архонты», «временность», «избранные» и «уединённые» сохранены. Примечания к «архонтам», «уединённым», лакуне и предварительному характеру перевода уместны и не навязывают конфессионального толкования.
