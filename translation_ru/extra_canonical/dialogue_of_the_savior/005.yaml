translation:
  language: ru
  text: 'Ученики [сказали: «Господи], кто ищет и [кто] открывает?»


    [Господь] сказал [им]: «Тот, кто ищет, — [тот же], кто открывает».


    Матфей [снова сказал Ему: «Господи], когда я [слушаю Тебя] и когда говорю, кто [говорит и] кто слушает?»


    [Господь] сказал: «Тот, кто говорит, — тот же, кто [слушает], и тот, кто способен видеть, — тот же, кто открывает».


    Мария сказала: «Господи, вот, [пока я] облечена в тело, откуда текут мои слёзы и откуда берётся мой смех?»


    Господь сказал: «[Это тело] плачет из-за своих дел [и из-за] дел, которые ещё предстоит совершить. А ум смеётся [из-за […] плодов] духа. Кто пребывает не во тьме, тот [не] сможет увидеть [свет].[a]


    Говорю вам: [всё, что лишено] света, есть тьма, и [кто] пребывает [не] во [тьме, тот не] сможет увидеть свет.[b] Однако [сыны] обмана были выведены […]. Вы облечётесь в свет и [так будете жить] вечно […]. [Если…], тогда [всякая] сила вверху и внизу будет жестоко терзать вас. Там [будут] плач и [скрежет] зубов из-за конца [всего]».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза восстановлена по повреждённому месту рукописи и звучит парадоксально: буквально в данном свидетельстве — «кто пребывает не во тьме, тот не сможет увидеть свет».'
    reason: Предупреждает читателя о текстовой неустойчивости и не исправляет трудное чтение молча.
  - marker: b
    text: Повтор о тьме и свете также дошёл с утратами; слова в квадратных скобках представляют восстановление переводчиков свидетельства.
    reason: Значительная реконструкция влияет на смысл всего высказывания.
  - marker: c
    text: Конец отрывка сильно повреждён. «Сила» может подразумевать космическую или духовную власть; точное значение и синтаксис требуют сверки с коптским текстом.
    reason: Фиксирует ограничения исходного английского свидетельства и необходимость проверки по языку рукописи.
lexical_decisions:
- source_word: seeks
  choice: ищет
  rationale: Сохраняет повтор и смысловую связь между исканием и откровением.
- source_word: reveals
  choice: открывает
  rationale: Передаёт действие раскрытия или обнаружения, не уточняя без достаточных оснований ни предмет откровения, ни его адресата.
- source_word: mind
  choice: ум
  rationale: Нейтральное соответствие, сохраняющее отличие от тела и духа; «разум» мог бы звучать более отвлечённо.
- source_word: wearing / put on
  choice: облечена / облечётесь
  rationale: Единый образ облачения передаёт параллель между телом и светом и сохраняет возвышенный регистр.
- source_word: powers
  choice: сила
  rationale: Сохранён широкий смысл сверхчеловеческих или космических сил без догматического уточнения как «властей».
- source_word: handle you cruelly
  choice: будет жестоко терзать вас
  rationale: Естественно по-русски выражает враждебное и мучительное воздействие, хотя точный коптский оборот ещё требует проверки.
theological_decisions:
- issue: Тождество ищущего, открывающего, говорящего и слушающего
  choice: Сохранены буквальные формулы тождества без пояснения их метафизического смысла.
  alternative: Истолковать их как единство ученика и внутреннего откровения.
  rationale: Текст допускает несколько антропологических и мистических прочтений; перевод не должен выбирать одно из них.
- issue: Противопоставление тела, ума и духа
  choice: 'Термины переданы раздельно: «тело», «ум», «дух».'
  alternative: Сблизить «ум» с «душой» или понимать «дух» как Святого Духа.
  rationale: Так сохраняется структура свидетельства без импорта позднейшей конфессиональной антропологии или пневматологии.
- issue: Парадокс о тьме и свете
  choice: 'Сохранено восстановленное отрицание: пребывающий не во тьме не сможет увидеть свет.'
  alternative: 'Исправить фразу по ожидаемому смыслу: пребывающий во тьме не сможет увидеть свет.'
  rationale: Необычная формулировка может быть сознательным парадоксом или следствием повреждения; молчаливое исправление сняло бы подлинную неопределённость.
- issue: «Сыны обмана»
  choice: Сохранён семитизирующий образ «сыны обмана».
  alternative: Передать как «лживые люди» или «порождения обмана».
  rationale: Образ может обозначать принадлежность или происхождение и не должен быть сведён к одной интерпретации.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным, диалогическим звучанием. Квадратные скобки и многоточия сохранены как сигналы повреждения и редакционного восстановления. Проект предварительный: он основан на предоставленном англоязычном общедоступном свидетельстве, поскольку непосредственная сверка с коптским источником ещё не выполнена.'
