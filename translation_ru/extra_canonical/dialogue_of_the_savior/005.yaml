  verdict: revise
  source_fidelity: 'Перевод в целом бережно следует предоставленному английскому свидетельству и сохраняет его квадратные скобки, лакуны и намеренно трудное отрицание в образе тьмы и света. Непосредственная сверка с коптским текстом в данных материалах ещё не выполнена, поэтому спорные реконструкции нельзя уверенно уточнять. Безопасна, однако, правка «будет жестоко обращаться с вами»: она ближе к широкому значению английского handle ... cruelly, чем чрезмерно конкретное «терзать».'
  naturalness: 'Современный литературный русский в целом удачен. В конструкции «Кто пребывает не во тьме» отрицание естественнее и яснее поставить перед глаголом: «Кто не пребывает во тьме». Это не устраняет парадокс исходного чтения, а лишь устраняет неестественный русский порядок слов. Формулу «из-за […] плодов духа» лучше оформить как «из-за [плодов] духа», поскольку в свидетельстве реконструируется именно связь плодов с духом; не следует создавать дополнительную неопределённость многоточием внутри синтаксической группы, если повреждение уже обозначено скобками.'
  terminology: «Господь», «ум», «дух», «сыны обмана» и образ «облечься в свет» последовательно передают терминологию свидетельства, не навязывая конфессионального толкования. «Открывает» сохраняет широкую, хотя и несколько эллиптическую, формулу witness «reveals» и может быть оставлено до коптской сверки.
  issues:
  - severity: low
    issue: Неестественное положение отрицания в формуле о тьме
    rationale: '«Кто пребывает не во тьме» звучит по-русски шероховато и может восприниматься как контрастивное «не во тьме, а где-то ещё». «Кто не пребывает во тьме» передаёт то же отрицание и сохраняет парадокс: такой человек всё равно «не сможет увидеть свет».'
  - severity: medium
    issue: «Будет жестоко терзать вас» чрезмерно сужает handle you cruelly
    rationale: Английское свидетельство говорит широко о жестоком обращении; «терзать» добавляет телесно-мучительный оттенок, которого в предоставленной опоре нет. «Будет жестоко обращаться с вами» точнее сохраняет неопределённость способа воздействия.
  - severity: low
    issue: Оформление повреждённого места о плодах духа
    rationale: «[…] плодов» создаёт неясность относительно того, пропущено ли слово перед «плодов» или реконструируется сама фраза. «[Плодов] духа» яснее соотносится с английским восстановлением и по-прежнему отмечает реконструкцию.
