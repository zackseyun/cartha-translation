translation:
  language: ru
  text: '**Место жизни**


    Мария спросила своих братьев: «Где вы сохраните [эти] вопросы, которые задаёте Сыну [Человеческому]?»[a]


    Господь [сказал] ей: «Сестра, [никто] не может спрашивать об этом, [кроме] того, у кого есть место в сердце [], чтобы хранить их. Такой человек может уйти из [мира] и войти в место [жизни], и его не удержат в этом мире нищеты».


    Матфей сказал: «Господи, я хочу [увидеть] то место жизни, [где] нет неправедности, но есть лишь чистый [свет]».


    Господь ответил: «Брат Матфей, ты не можешь увидеть его, пока [носишь] плоть».


    Матфей сказал: «Господи, [если я] не могу увидеть его, то хотя бы дай мне познать его».


    Господь сказал: «Всякий, кто познал самого себя, увидел его. Он исполняет всё, что ему дано делать. Такой человек тем самым уподобился тому месту в благости».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки обозначают утраченные или повреждённые места рукописи и предложенные издателями восстановления; пустые скобки [] отмечают лакуну без восстановленного текста.
    reason: Читателю необходимо отличать сохранившийся текст от редакторских восстановлений.
  - marker: b
    text: 'Заключительное выражение допускает разные синтаксические связи: «в благости» может характеризовать человека, место или его уподобление этому месту.'
    reason: Свидетель допускает неоднозначность, которую перевод не должен скрыто разрешать.
lexical_decisions:
- source_word: place of life
  choice: место жизни
  rationale: Сохраняет повторяющийся пространственный образ и не заменяет его истолковывающими выражениями вроде «обитель жизни».
- source_word: possesses a place in the heart
  choice: у кого есть место в сердце
  rationale: Передаёт образ буквально, но естественно для современного русского языка; неопределённость значения «места» сохранена.
- source_word: world of poverty
  choice: мир нищеты
  rationale: Сохраняет сильную и, возможно, техническую характеристику мира, не сужая её до материальной бедности или духовной скудости.
- source_word: wear the flesh
  choice: носишь плоть
  rationale: Сохраняет метафору плоти как носимого облачения и характерную лексику древнего текста.
- source_word: known himself
  choice: познал самого себя
  rationale: Передаёт рефлексивный смысл и возможный сотериологический оттенок, не объясняя его доктринально.
- source_word: iniquity
  choice: неправедность
  rationale: Выбрано широкое нравственно-религиозное слово, не ограничивающее смысл беззаконием как нарушением установленного закона.
theological_decisions:
- issue: Связь самопознания с видением места жизни
  choice: «Всякий, кто познал самого себя, увидел его»
  alternative: «Кто познал себя, тот уже видел место жизни»
  rationale: Сохранено прямое утверждение свидетеля без добавления временного «уже» и без богословского объяснения природы самопознания.
- issue: Образ ношения плоти
  choice: «пока носишь плоть»
  alternative: «пока пребываешь во плоти»
  rationale: Более буквальный вариант сохраняет напряжение между человеком и плотью как чем-то носимым, не превращая образ в привычную конфессиональную формулу.
- issue: Неясная связь выражения «в благости» в заключении
  choice: «Такой человек тем самым уподобился тому месту в благости»
  alternative: «Благодаря своей доброте такой человек стал подобен тому месту»
  rationale: Выбранная формулировка не решает без достаточных оснований, относится ли благость к человеку, к месту или к самому уподоблению.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского диалога. Обращения и повторяющиеся ключевые образы переданы последовательно. Перевод остаётся предварительным, поскольку составлен по предоставленному англоязычному свидетелю; прямая сверка с коптским текстом Nag Hammadi Codex III,5 ещё требуется.
