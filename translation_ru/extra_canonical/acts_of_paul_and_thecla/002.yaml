translation:
  language: ru
  text: '2:1 Пока Павел произносил эту проповедь в церкви, собиравшейся в доме Онисифора, одна дева по имени Фёкла — её мать звали Феоклией, и она была обручена с человеком по имени Фамирис — сидела у окна в своём доме.


    2:2 Оттуда, благодаря окну, выходившему к дому, где находился Павел, она и днём и ночью слушала его проповеди о Боге, о любви, о вере во Христа и о молитве.


    2:3 Она не отходила от окна и, исполненная великой радости, покорилась учению веры.


    2:4 Наконец, увидев, как многие женщины и девы входят к Павлу, она горячо пожелала удостоиться встречи с ним и услышать слово Христа. Ведь самого Павла она ещё не видела, а только слушала его проповеди.


    2:5 Когда же её никак не могли убедить отойти от окна, мать послала за Фамирисом. Тот пришёл с великой радостью, надеясь, что теперь женится на ней, и спросил Феоклию:


    — Где моя Фёкла?


    2:6 Феоклия ответила:


    — Фамирис, я расскажу тебе нечто весьма странное. Вот уже три дня Фёкла не отходит от окна, даже чтобы поесть или попить. Она так поглощена хитрыми и обманчивыми речами какого-то чужеземца, что я не перестаю удивляться, Фамирис: как молодая женщина, известная своей скромностью, могла настолько поддаться его влиянию?


    2:7 Этот человек взбудоражил весь город Иконию, а вместе со всеми — и твою Фёклу. Все женщины и юноши стекаются к нему, чтобы принять его учение. Помимо прочего он говорит им, что есть только один Бог, Которому одному следует поклоняться, и что нам надлежит жить в целомудрии.


    2:8 И вот моя дочь Фёкла, словно паутина, прикреплённая к окну,[a] пленена речами Павла и слушает их с необычайным рвением и великой радостью. Так, внимая его словам, молодая женщина даёт себя обольстить. Иди же, поговори с ней, ведь она обручена с тобой.


    2:9 Фамирис подошёл к ней, поздоровался и, стараясь не испугать её, сказал:


    — Фёкла, невеста моя, почему ты сидишь в такой печали? Что за странное чувство овладело тобой? Повернись к Фамирису и устыдись.[b]


    2:10 Так же заговорила с ней и мать:


    — Дитя, почему ты сидишь такая печальная и, словно оцепенев, ничего не отвечаешь?


    2:11 Тогда все горько заплакали: Фамирис — потому что потерял невесту, Феоклия — потому что потеряла дочь, а служанки — потому что потеряли госпожу. Весь дом наполнился плачем.


    2:12 Но всё это нисколько не подействовало на Фёклу: она даже не повернулась к ним и не обратила на них внимания, продолжая слушать речи Павла.


    2:13 Тогда Фамирис выбежал на улицу, чтобы посмотреть, кто входит к Павлу и выходит от него. Увидев двух мужчин, горячо споривших между собой, он спросил их:


    2:14 — Господа, что вы здесь делаете? И кто этот человек, который находится там, у вас, и обманывает умы людей — юношей и дев, — убеждая их не вступать в брак, а оставаться как есть?


    2:15 Я обещаю вам немалую сумму, если вы правдиво расскажете мне о нём, ведь я один из первых людей этого города.[c]


    2:16 Димас и Ермоген ответили:


    — Мы и сами не можем точно сказать, кто он. Но знаем, что он отнимает у юношей их будущих жён, а у дев — будущих мужей, уча: «Для вас не будет воскресения в будущем, если вы не останетесь целомудренными и не сохраните свою плоть неосквернённой».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сравнение с паутиной передано по имеющемуся английскому свидетельству; точный образ и синтаксис требуют проверки по греческой и версионной рукописной традиции.
    reason: Необычная метафора может зависеть от текста или понимания промежуточного свидетельства.
  - marker: b
    text: 'Буквально по английскому свидетельству: «повернись к Фамирису и покрасней». Смысл последнего повеления не вполне ясен: оно может выражать стыд, скромность или приличествующую невесте реакцию.'
    reason: Сохранена семантическая неоднозначность необычной реплики.
  - marker: c
    text: 'Или: «я главный человек в этом городе». Без проверки греческого текста неясно, идёт ли речь об официальной должности или о высоком общественном положении.'
    reason: Предотвращает необоснованное уточнение социального статуса.
  - marker: d
    text: 'Фразу можно понять и так: «не будет будущего воскресения, если вы…». Местоимение «для вас» добавлено для естественности условной связи, но требует проверки по исходному греческому тексту.'
    reason: Отмечает богословски значимую синтаксическую неоднозначность и пределы английского свидетельства.
lexical_decisions:
- source_word: church
  choice: церковь, собиравшаяся в доме Онисифора
  rationale: Уточняющая формулировка естественно передаёт домашнее собрание и не создаёт обязательного образа отдельного церковного здания.
- source_word: charity
  choice: любовь
  rationale: В данном религиозном перечне современное «любовь» яснее архаичного или узкого «благотворительность».
- source_word: subdued to the doctrines of faith
  choice: покорилась учению веры
  rationale: Сохранена сильная метафора подчинения учению без психологического смягчения.
- source_word: chastity
  choice: целомудрие / целомудренными
  rationale: Слово сохраняет аскетический и нравственный диапазон свидетельства, не сводя его автоматически только к безбрачию.
- source_word: chief person
  choice: один из первых людей этого города
  rationale: Передаёт заявление о высоком общественном положении, не превращая его без достаточного основания в официальную должность.
- source_word: future resurrection
  choice: воскресение в будущем
  rationale: Сохранено временное указание свидетельства и его эсхатологический смысл.
theological_decisions:
- issue: Связь воскресения с целомудрием в речи Димаса и Ермогена
  choice: Сохранить условную формулировку как их сообщение об учении Павла
  alternative: Смягчить до общего призыва к нравственной чистоте
  rationale: Текст намеренно выражает резкое богословское утверждение устами персонажей; перевод не должен ни одобрять его, ни устранять напряжение.
- issue: Единобожие и поклонение
  choice: «есть только один Бог, Которому одному следует поклоняться»
  alternative: «существует единый Бог» без упоминания исключительности поклонения
  rationale: 'Сохранены обе части свидетельства: единственность Бога и исключительное поклонение Ему.'
- issue: Целомудрие как образ жизни
  choice: Не отождествлять термин во всех случаях исключительно с пожизненным безбрачием
  alternative: Везде переводить как «оставаться безбрачными»
  rationale: Контекст тесно связывает целомудрие с отказом от брака, однако формулировка свидетельства также говорит о неосквернении плоти; более широкий термин сохраняет напряжение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского повествования; архаические формы устранены, диалоги оформлены естественно. Имена переданы в традиционных русских формах: Павел, Онисифор, Фёкла, Феоклия, Фамирис, Димас, Ермоген, Икония. Черновик основан на предоставленном общественном достоянии английском свидетельстве; прямая сверка с греческой и версионной рукописной традицией ещё необходима.'
