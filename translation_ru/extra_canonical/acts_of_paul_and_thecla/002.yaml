  revised_text: '2:1 Пока Павел произносил эту проповедь в церкви, собиравшейся в доме Онисифора, одна дева по имени Фёкла — её мать звали Феоклией, и она была обручена с человеком по имени Фамирис — сидела у окна в своём доме.


