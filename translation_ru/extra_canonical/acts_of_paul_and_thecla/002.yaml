review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетельству, однако в 2:2 добавлено невыраженное направление окна («выходившему к дому»), в 2:4 «удостоиться встречи» сужает «appear in his presence», а в 2:16 добавлено местоимение «для вас», отсутствующее в свидетельстве. В 2:3 желательно сохранить временную связь «не отходила, пока…». Прямая сверка с греческим и версионным текстом по-прежнему недоступна; спорные особенности свидетельства не следует устранять.
  naturalness: 'После исправлений текст звучит как современный литературный русский, не утрачивая повествовательной торжественности. Уточнены тяжеловесные и не вполне естественные места: «могла настолько поддаться» заменено на форму настоящего времени в пересказе Феоклии, а «даёт себя обольстить» — на естественное страдательное выражение.'
  terminology: Традиционные формы имён и ключевые термины («целомудрие», «воскресение», «плоть») сохранены. «Церковь в доме Онисифора» не навязывает представление об отдельном культовом здании. В 2:16 сохранено, что речь идёт о сообщаемом Димасом и Ермогеном учении, без богословского сглаживания.
  issues:
  - severity: medium
    issue: '2:2: добавлено направление окна'
    rationale: Фраза «окну, выходившему к дому» сообщает пространственную деталь, которой в английском свидетельстве нет; «by the advantage of a window» достаточно передать без такого уточнения.
  - severity: medium
    issue: '2:4: «удостоиться встречи с ним» сужает смысл'
    rationale: Свидетельство говорит о желании явиться в присутствие Павла, а не обязательно о личной встрече; нужна более нейтральная формулировка.
  - severity: medium
    issue: '2:16: добавлено «для вас»'
    rationale: Это интерпретирующее добавление меняет формулировку условного высказывания. Следует передать «не будет будущего воскресения» и сохранить примечание об ограниченности промежуточного свидетельства.
  - severity: low
    issue: '2:3: ослаблена временная связь'
    rationale: В исходном свидетельстве она не отходила от окна до тех пор, пока с радостью не покорилась учению веры; эту связь следует явно выразить.
