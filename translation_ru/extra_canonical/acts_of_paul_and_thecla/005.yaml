lexical_decisions:
- source_word: porter / gatekeeper (Greek review pending)
  choice: привратник
  rationale: Естественное и исторически уместное обозначение домашнего слуги, охранявшего вход.
- source_word: strange man / stranger (Greek review pending)
  choice: незнакомец
  rationale: Передаёт, что Павел был посторонним для семьи, не придавая выражению оттенка «странный человек».
- source_word: judgment seat
  choice: суд
  rationale: В данном повествовательном контексте обозначает явку на разбирательство перед правителем; буквальное «судейское кресло» звучало бы неестественно.
- source_word: magician
  choice: колдун
  rationale: Передаёт враждебное обвинение в магии ясным современным словом.
- source_word: law of the Iconians
  choice: закон жителей Иконии
  rationale: Сохраняет локальный характер нормы, не уточняя без достаточных оснований, была ли она писаным законом или обычаем.
- source_word: wallowing on the ground
  choice: лежала, припав к полу
  rationale: Сохраняет телесную позу глубокой привязанности и скорби, избегая уничижительного современного оттенка глагола «валяться».
- source_word: preserved
  choice: была спасена
  rationale: В контексте чудесного избавления от огня естественно передаёт сохранение жизни Фёклы.
theological_decisions:
- issue: Явление Иисуса в облике Павла
  choice: «увидела Господа Иисуса в облике Павла»
  alternative: «увидела Павла, который представлял Господа Иисуса»
  rationale: Сохранено прямое и напряжённое утверждение повествования без рационализирующего истолкования видения.
- issue: Причина чудесного избавления
  choice: «потому что Бог сжалился над ней»
  alternative: обезличенное описание природного явления
  rationale: 'Сохранена явная богословская причинность источника: дождь, град и развержение земли представлены как действие Божьего сострадания.'
- issue: Знак креста
  choice: «осенив себя крестным знамением» с примечанием
  alternative: «начертив знак креста»
  rationale: Выбрана понятная русская формула, но примечание предупреждает, что точный жест нельзя восстановить по английскому свидетельству.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис упрощён там, где английское свидетельство архаично, но последовательность событий, повторы и богословская напряжённость сохранены. Проект остаётся предварительным, поскольку предоставленное original_language_source фактически является английским публично-доменным свидетельством, а прямая сверка с греческим текстом и версиями ещё не выполнена.
