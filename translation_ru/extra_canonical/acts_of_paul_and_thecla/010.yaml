review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно следует предоставленному английскому свидетельству и сохраняет ключевые текстологические сигналы в 10:10 и 10:14. Однако в 10:13 «went to a place» не означает «поселилась»; это добавляет информацию о постоянном проживании. В 10:9 необходимо сохранить квадратные скобки английского свидетельства, обозначающие редакционно отмеченные элементы. Прямая сверка с греческой рукописной традицией в материалах не предоставлена, поэтому варианты и необычные формулировки не гармонизируются.
  naturalness: Русский текст в основном современный, ясный и выдержанный по регистру. Исправленная формулировка 10:13 естественна без смыслового добавления; в 10:9 скобки несколько утяжеляют фразу, но нужны для текстологической прозрачности.
  terminology: Имена, «слово Господа», «просветил», «изречения Божьи», «нечистые духи» и «служительница Христа» переданы последовательно. «Подвижническая жизнь» допустимо передаёт аскетический смысл, не навязывая позднейшую институциональную модель монашества; пояснение сохранено в примечании.
  issues:
  - severity: medium
    issue: '10:13: «она поселилась за городом»'
    rationale: Свидетель говорит лишь, что Фёкла пошла/отправилась в место вне города; утверждение о поселении добавляет продолжительное проживание, отсутствующее в тексте.
  - severity: medium
    issue: '10:9: утрачена маркировка квадратными скобками'
    rationale: В английском свидетельстве слова [endeavouring] и [to her opinion] заключены в квадратные скобки. Их следует отразить в русском тексте, поскольку проект заявляет сохранение таких текстологических сигналов.
  revised_text: '10:1 Павел немало удивился, увидев её и людей, бывших с ней, потому что подумал, что им предстоит новое испытание.


    10:2 Фёкла, заметив это, сказала ему: «Павел, я приняла крещение, потому что Тот, кто помогает тебе в проповеди, помог и мне креститься».


    10:3 Тогда Павел взял её с собой и привёл в дом Гермеса. Фёкла рассказала Павлу обо всём, что случилось с ней в Антиохии. Павел чрезвычайно изумился, а все слышавшие укрепились в вере и молились о благополучии Трифены.


    10:4 Затем Фёкла встала и сказала Павлу: «Я иду в Иконию». Павел ответил ей: «Иди и учи слову Господа».


    10:5 Трифена же послала Павлу через Фёклу много денег, а также одежду для помощи бедным.


    10:6 Итак, Фёкла пошла в Иконию. Придя в дом Онисифора, она пала на пол на том месте, где сидел и проповедовал Павел, и, соединяя слёзы с молитвами, восхваляла и прославляла Бога такими словами:


    10:7 «Господи, Боже этого дома, в котором Ты впервые просветил меня! Иисус, Сын живого Бога, Ты помог мне перед правителем, помог в огне и помог среди зверей. Ты один — Бог во веки веков. Аминь».


    10:8 Вернувшись, Фёкла узнала, что Фамирид умер, а её мать ещё жива. Позвав мать, она сказала ей: «Феоклия, мать моя, можешь ли ты поверить, что есть лишь один Господь Бог, обитающий на небесах? Если ты желаешь великого богатства, Бог даст его тебе через меня; если хочешь вновь обрести свою дочь — вот я».


    10:9 Это и многое другое она говорила матери, [стараясь] убедить её [в этом]. Но её мать Феоклия не поверила словам мученицы Фёклы.


    10:10 Увидев, что говорит напрасно, Фёкла осенила всё своё тело знамением [креста][a], покинула дом и отправилась в Дафну. Придя туда, она вошла в пещеру, где прежде нашла Павла с Онисифором, пала на землю и плакала перед Богом.


    10:11 Уйдя оттуда, она направилась в Селевкию и многих просветила познанием Христа.


    10:12 Светлое облако вело её в пути.


    10:13 Придя в Селевкию, она отправилась в место за городом, примерно в одном стадии от него[b], поскольку боялась жителей, поклонявшихся идолам.


    10:14 [Облако] привело её к горе, называемой Каламон, или Родеон[c]. Там она прожила много лет и претерпела множество тяжких искушений от дьявола, но с помощью Христа перенесла их достойно.


    10:15 Наконец некоторые знатные женщины, услышав о деве Фёкле, пришли к ней. Она наставляла их в изречениях Божьих, и многие из них оставили мир и стали жить вместе с ней подвижнической жизнью[d].


    10:16 Так добрая слава о Фёкле распространилась повсюду. Она совершала многие исцеления, и жители всего города и окрестностей приносили больных к этой горе. Ещё не дойдя до входа в пещеру, те тотчас исцелялись от всякой болезни.


    10:17 Нечистые духи с криком выходили из людей; все уносили своих больных исцелёнными и прославляли Бога, давшего деве Фёкле такую силу.


    10:18 Поэтому врачи Селевкии утратили прежнее уважение и лишились всех доходов от своего ремесла, поскольку никто больше к ним не обращался. Тогда они исполнились зависти и стали замышлять, что предпринять против этой служительницы Христа.'
