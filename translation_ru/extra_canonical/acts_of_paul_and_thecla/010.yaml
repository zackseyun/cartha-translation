  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: ru
  text: '10:1 Павел немало удивился, увидев её и людей, бывших с ней, потому что подумал, что им предстоит новое испытание.


    10:2 Фёкла, заметив это, сказала ему: «Павел, я приняла крещение, потому что Тот, кто помогает тебе в проповеди, помог и мне креститься».


    10:3 Тогда Павел взял её с собой и привёл в дом Гермеса. Фёкла рассказала Павлу обо всём, что случилось с ней в Антиохии. Павел чрезвычайно изумился, а все слышавшие укрепились в вере и молились о благополучии Трифены.


    10:4 Затем Фёкла встала и сказала Павлу: «Я иду в Иконию». Павел ответил ей: «Иди и учи слову Господа».


    10:5 Трифена же послала Павлу через Фёклу много денег, а также одежду для помощи бедным.


    10:6 Итак, Фёкла пошла в Иконию. Придя в дом Онисифора, она пала на пол на том месте, где сидел и проповедовал Павел, и, соединяя слёзы с молитвами, восхваляла и прославляла Бога такими словами:


    10:7 «Господи, Боже этого дома, в котором Ты впервые просветил меня! Иисус, Сын живого Бога, Ты помог мне перед правителем, помог в огне и помог среди зверей. Ты один — Бог во веки веков. Аминь».


    10:8 Вернувшись, Фёкла узнала, что Фамирид умер, а её мать ещё жива. Позвав мать, она сказала ей: «Феоклия, мать моя, можешь ли ты поверить, что есть лишь один Господь Бог, обитающий на небесах? Если ты желаешь великого богатства, Бог даст его тебе через меня; если хочешь вновь обрести свою дочь — вот я».


    10:9 Это и многое другое она говорила матери, стараясь убедить её. Но её мать Феоклия не поверила словам мученицы Фёклы.


    10:10 Увидев, что говорит напрасно, Фёкла осенила всё своё тело знамением [креста][a], покинула дом и отправилась в Дафну. Придя туда, она вошла в пещеру, где прежде нашла Павла с Онисифором, пала на землю и плакала перед Богом.


    10:11 Уйдя оттуда, она направилась в Селевкию и многих просветила познанием Христа.


    10:12 Светлое облако вело её в пути.


    10:13 Придя в Селевкию, она поселилась за городом, примерно в одном стадии от него[b], поскольку боялась жителей, поклонявшихся идолам.


    10:14 [Облако] привело её к горе, называемой Каламон, или Родеон[c]. Там она прожила много лет и претерпела множество тяжких искушений от дьявола, но с помощью Христа перенесла их достойно.


    10:15 Наконец некоторые знатные женщины, услышав о деве Фёкле, пришли к ней. Она наставляла их в изречениях Божьих, и многие из них оставили мир и стали жить вместе с ней подвижнической жизнью[d].


    10:16 Так добрая слава о Фёкле распространилась повсюду. Она совершала многие исцеления, и жители всего города и окрестностей приносили больных к этой горе. Ещё не дойдя до входа в пещеру, те тотчас исцелялись от всякой болезни.


    10:17 Нечистые духи с криком выходили из людей; все уносили своих больных исцелёнными и прославляли Бога, давшего деве Фёкле такую силу.


    10:18 Поэтому врачи Селевкии утратили прежнее уважение и лишились всех доходов от своего ремесла, поскольку никто больше к ним не обращался. Тогда они исполнились зависти и стали замышлять, что предпринять против этой служительницы Христа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «креста» в использованном английском свидетельстве дано в квадратных скобках как редакционное восполнение.
    reason: Сохранить текстологическую прозрачность предоставленного источника.
  - marker: b
    text: Стадий — античная мера расстояния, приблизительно 180–200 метров.
    reason: Пояснить современному читателю древнюю меру длины.
  - marker: c
    text: 'В переданном свидетельстве сохранены два названия горы: Каламон и Родеон.'
    reason: Не устранять вариант или альтернативное наименование без проверки греческой традиции.
  - marker: d
    text: 'Буквально в английском свидетельстве: «вели с ней монашескую жизнь»; выражение передано как «подвижническая жизнь», чтобы не приписывать повествованию более поздние институциональные формы монашества.'
    reason: Предотвратить анахроничное понимание при сохранении аскетического смысла.
lexical_decisions:
- source_word: trial
  choice: испытание
  rationale: Передаёт возможность нового преследования или судебного испытания, не сужая смысл до одного вида бедствия.
- source_word: assists
  choice: помогает / помог
  rationale: Сохраняет параллель между Божьей помощью Павлу в проповеди и Фёкле при крещении.
- source_word: enlightened
  choice: просветил / просветила познанием
  rationale: Сохраняет раннехристианскую метафору духовного просвещения, не отождествляя её автоматически с конкретным обрядом.
- source_word: oracles of God
  choice: изречения Божьи
  rationale: Передаёт авторитетные божественные речения без неоправданного сужения до одного корпуса Писания.
- source_word: monastic life
  choice: подвижническая жизнь
  rationale: Избегает анахроничного впечатления о поздней институциональной форме монашества, сохраняя аскетический смысл свидетельства.
- source_word: furlong
  choice: стадий
  rationale: Использована соответствующая античная мера расстояния вместо английской единицы перевода-свидетеля.
- source_word: servant of Christ
  choice: служительница Христа
  rationale: Естественное русское обозначение женщины, посвятившей себя служению Христу.
theological_decisions:
- issue: Слова Фёклы о своём крещении
  choice: «Тот, кто помогает тебе в проповеди, помог и мне креститься»
  alternative: «помог мне крестить себя» или «крестил меня»
  rationale: Сохранена напряжённость рассказа о необычном крещении Фёклы и не добавлен явно не названный человеческий совершитель обряда.
- issue: «Ты один — Бог» в обращении к Иисусу
  choice: Сохранено прямое обращение и утверждение без поясняющей гармонизации
  alternative: Отнести слова только к Господу Богу в начале молитвы
  rationale: Грамматика английского свидетельства допускает сильное христологическое прочтение; перевод не должен без основания устранять эту богословскую напряжённость.
- issue: Знамение креста
  choice: Слово «креста» сохранено в квадратных скобках с примечанием
  alternative: Включить его в текст без маркировки или опустить
  rationale: Так сохраняется редакционная сигнализация предоставленного свидетельства и одновременно получается понятный русский текст.
- issue: Вариант названия горы
  choice: «Каламон, или Родеон»
  alternative: Выбрать одно название
  rationale: Вариант не гармонизирован ввиду отсутствия прямой проверки греческой рукописной традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис умеренно упрощён для ясности; имена переданы в привычной русской библейско-церковной форме. Проект остаётся предварительным, поскольку предоставлен английский перевод-свидетель, а прямая сверка с греческим источником ещё не выполнена.
