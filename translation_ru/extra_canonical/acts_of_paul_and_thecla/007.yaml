base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: ru
  text: '7:1 Затем Павел отправил Онисифора и его семью к себе домой, а сам, взяв с собой Фёклу, отправился в Антиохию.


    7:2 Как только они вошли в город, Фёклу увидел некий сириец по имени Александр — городской сановник, оказавший городу за время своей службы немало важных услуг, — и влюбился в неё. Он пытался склонить Павла на свою сторону множеством дорогих подарков.


    7:3 Но Павел сказал ему: «Я не знаю женщины, о которой ты говоришь, и она мне не принадлежит».


    7:4 Однако Александр, пользовавшийся в Антиохии большим влиянием, схватил её на улице и поцеловал. Фёкла не стала этого терпеть. Озираясь в поисках Павла, она громко и отчаянно закричала: «Не принуждай меня — я здесь чужая! Не принуждай меня — я служительница Бога! Я из числа знатных жителей Иконии и была вынуждена покинуть этот город, потому что отказалась выйти замуж за Фамирида».


    7:5 Затем она схватила Александра, разорвала на нём одежду, сорвала с его головы корону[a] и выставила его на посмешище перед всем народом.


    7:6 Александр же — отчасти потому, что любил её, а отчасти потому, что стыдился случившегося, — отвёл её к правителю. После того как она призналась в содеянном, правитель приговорил её к растерзанию зверями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «венец». Точная форма и значение головного знака в данном свидетельстве не уточняются.'
    reason: Английский свидетель передаёт crown; без завершённой проверки греческой рукописной традиции не следует конкретизировать форму или назначение предмета.
lexical_decisions:
- source_word: magistrate
  choice: городской сановник
  rationale: Передаёт высокую гражданскую должность, не приписывая Александру более точный римский или греческий титул, которого свидетель не уточняет.
- source_word: engage Paul in his interest
  choice: склонить Павла на свою сторону
  rationale: Естественно выражает попытку добиться содействия Павла посредством подарков, не уточняя характер предполагаемой сделки.
- source_word: does she belong to me
  choice: она мне не принадлежит
  rationale: Сохраняет резкую и неоднозначную формулировку Павла, не смягчая её до указания лишь на родство или опеку.
- source_word: servant of God
  choice: служительница Бога
  rationale: Передаёт женский референт и религиозный смысл без конфессионально окрашенного специального титула.
- source_word: principal persons of Iconium
  choice: из знатных жителей Иконии
  rationale: Передаёт высокий общественный статус Фёклы; буквальное «одна из главных лиц» по-русски неестественно.
- source_word: crown
  choice: венок
  rationale: В греко-римском общественном контексте вероятен почётный или должностной венок; примечание сохраняет неопределённость формы и назначения.
- source_word: thrown among the beasts
  choice: к растерзанию зверями
  rationale: Естественная русская формула для публичной казни посредством диких зверей; не утверждает, что смерть непременно наступила.
theological_decisions:
- issue: Самоопределение Фёклы как Божьей служительницы
  choice: «я служительница Бога»
  alternative: «я раба Божья»
  rationale: Выбор сохраняет смысл принадлежности и служения Богу, избегая в современном русском ненужного акцента на социальном рабстве; возможная более буквальная формула отмечена как альтернатива.
- issue: Отречение Павла от связи с Фёклой
  choice: «она мне не принадлежит»
  alternative: «она не из моих»
  rationale: 'Сохранена смысловая напряжённость свидетельства: Павел не только отрицает знакомство, но и какую-либо власть или притязание на неё. Текст не объясняет его мотивов.'
translation_notes:
  register: 'Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён там, где английский свидетель перегружен, но последовательность событий, неоднозначность слов Павла и насильственный характер действий Александра сохранены. Проект предварительный: предоставлена английская версия публичного достояния, тогда как прямая сверка с греческим текстом ещё ожидается.'
