  naturalness: 'Русский текст в основном современный, литературный и выдержан в подходящем умеренно возвышенном регистре. Исправлены несколько мест, где буквальность или сглаживание делали фразу менее ясной: «в Котором Бог благоволит», «отдаю её вам», «верёвки, прикреплённые к телам быков».'
