  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетельству; прямую проверку по греческой и версионной традиции выполнить невозможно, поскольку она не предоставлена. Исправлены несколько мест, где русский текст либо сужал смысл («смиренная» вместо неопределённого mean), либо неточно передавал действие («вырвалась» вместо «бежала/скрылась»), либо менял предмет одежды («накидка» вместо hood).
  naturalness: Регистр выдержан как современный литературный русский с агиографической окраской. Уточнены естественные формулировки в 11:1, 11:10, 11:12–13 и синтаксис тринитарного обращения.
  terminology: Сохранены традиционные формы «Фёкла», «Фамирис», «Икония», а также титул «апостол Божий» без конфессионального переосмысления. «Диана» сохранена по английскому свидетельству с примечанием о возможном соответствии Артемиде. «Блаженное видение» воспроизводит формулу свидетельства без догматического истолкования.
  issues:
  - severity: medium
    issue: '11:7: «смиренная старица»'
    rationale: Английское mean old woman означает прежде всего «бедная/незнатная, простая старая женщина»; «смиренная» добавляет нравственную характеристику, отсутствующую в свидетельстве.
  - severity: low
    issue: '11:12: «мужественно вырвалась»'
    rationale: В свидетельстве сказано fled/«бежала», а не что она физически вырвалась из захвата. Нейтральное «смело скрылась» сохраняет действие без добавления деталей.
  - severity: medium
    issue: '11:13: «покрывало, или накидка»'
    rationale: Veil or hood — «покрывало или капюшон/головной покров»; «накидка» является иной деталью одежды.
  - severity: low
    issue: '11:10: синтаксис обращения «Отец, Сын и Святой Дух»'
    rationale: Следует ясно связать перечисление с местоимением «Тебе», сохранив тринитарную формулу свидетельства.
  - severity: low
    issue: '11:11: «блаженное созерцание»'
    rationale: Это допустимая интерпретация, но witness имеет именно beatific vision. «Блаженное видение» ближе к доступной базе и не требует смыслового сдвига.
  revised_text: 'ДЕЯНИЯ ПАВЛА И ФЁКЛЫ


    ГЛАВА XI


    11:1 Тогда дьявол внушил им злой совет. Однажды, собравшись посоветоваться, они стали рассуждать между собой: «Эта дева — жрица великой богини Дианы[a], и всё, чего она просит у неё, ей даётся, потому что она дева и потому любима всеми богами.


    11:2 Итак, найдём нескольких распутных молодчиков; напоим их допьяна, дадим им большую сумму денег и велим пойти и обесчестить эту деву, пообещав им ещё большую награду, если они это сделают».


    11:3 Ведь они решили между собой, что, если им удастся обесчестить её, боги больше не будут к ней благосклонны и Диана больше не станет ради неё исцелять больных.


    11:4 Они исполнили задуманное. Молодчики пошли к горе и, свирепые, как львы, подошли к пещере, стуча в дверь.


    11:5 Святая мученица Фёкла, уповая на Бога, в Которого верила, открыла дверь, хотя уже была предупреждена об их замысле, и сказала им:


    — Молодые люди, что вам нужно?


    11:6 Они ответили:


    — Есть ли здесь та, кого зовут Фёклой?


    Она спросила:


    — Что вам от неё нужно?


    Они сказали:


    — Мы хотим лечь с ней.


    11:7 Блаженная Фёкла ответила:


    — Хотя я бедная старая женщина, я служу моему Господу Иисусу Христу. И хотя вы задумали против меня гнусное дело, совершить его вам не удастся.


    Они возразили:


    — Не может быть, чтобы мы не сделали с тобой всего, чего захотим.


    11:8 С этими словами они силой схватили её и хотели изнасиловать. Тогда она с (величайшей) кротостью[b] сказала им:


    — Молодые люди, потерпите и увидите славу Господа.


    11:9 Пока они держали её, она подняла глаза к небу и сказала:


    — О Боже, достойный всякого почитания, с Которым никто не сравнится! Ты прославляешь Себя над врагами Своими; Ты избавил меня от огня и не отдал ни Фамирису, ни Александру; Ты спас меня от диких зверей и сохранил в глубоких водах; Ты повсюду был моим помощником и прославил во мне Своё имя.


    11:10 И теперь избавь меня от рук этих злых и неразумных людей. Не допусти, чтобы они осквернили моё целомудрие, которое я доныне хранила ради Твоей чести. Ведь я люблю Тебя, стремлюсь к Тебе и поклоняюсь Тебе — Отцу, Сыну и Святому Духу — во веки. Аминь.


    11:11 Тогда с неба раздался голос:


    — Не бойся, Фёкла, верная служительница Моя, ибо Я с тобой. Посмотри и увидь место, которое открылось для тебя. Там будет твоё вечное жилище; там ты получишь блаженное видение[c].


    11:12 Блаженная Фёкла посмотрела и увидела, что скала раскрылась настолько, что внутрь мог войти человек. Исполнив повеление, она смело скрылась от этой гнусной шайки и вошла в скалу. Та сразу же сомкнулась так плотно, что на месте отверстия не было видно ни единой трещины.


    11:13 Мужчины в полном изумлении застыли перед столь необычайным чудом и не смогли удержать служительницу Божью. Они успели лишь ухватиться за её покрывало или капюшон и оторвали от него кусок.


    11:14 Но и это произошло по Божьему допущению: чтобы утвердить веру тех, кто придёт увидеть это почитаемое место, и чтобы передать благословения людям последующих поколений, которые от чистого сердца уверуют в нашего Господа Иисуса Христа.


    11:15 Так пострадала Фёкла — первая мученица и апостол Божий, дева. Она пришла из Иконии восемнадцатилетней. После этого она прожила ещё семьдесят два года — частью в странствиях и путешествиях, частью ведя уединённую жизнь в пещере. Ей было девяносто лет, когда Господь переселил её[d].


    11:16 Так окончилась её жизнь.


    11:17 День, посвящённый её памяти, отмечается двадцать четвёртого сентября — во славу Отца, Сына и Святого Духа, ныне и во веки. Аминь.


    [a] Диана — римское имя богини, соответствующей греческой Артемиде. В предоставленном английском свидетельстве стоит Diana; сверка с греческой рукописной традицией ещё требуется.


    [b] Слово «величайшей» заключено в скобки вслед за предоставленным английским свидетельством; причина скобок без прямой сверки с источником неясна.


    [c] Буквально по английскому свидетельству: «блаженное видение» (beatific vision). Формула воспроизводится без уточнения её в категориях позднейшего догматического употребления.


    [d] «Переселил её» передаёт старинное translated в значении чудесного перенесения или преставления. Формулировка намеренно не уточняет способ окончания земной жизни Фёклы.'
