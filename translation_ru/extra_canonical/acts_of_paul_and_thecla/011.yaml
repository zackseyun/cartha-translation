  - marker: b
    text: Слово «величайшей» заключено в скобки вслед за предоставленным английским свидетельством; причина скобок без прямой сверки с источником неясна.
    reason: Сохраняет отмеченную в свидетельстве текстовую особенность, не выдавая её происхождение за установленное.
  - marker: c
    text: 'Буквально по английскому свидетельству: «блаженное видение» (beatific vision). Перевод «блаженное созерцание» сохраняет религиозный смысл, не уточняя его позднейшими догматическими категориями.'
    reason: Предупреждает о богословски нагруженной английской формуле и сохраняет интерпретационную открытость.
  - marker: d
    text: «Переселил её» передаёт старинное translated в значении чудесного перенесения или преставления. Формулировка намеренно не уточняет способ окончания земной жизни Фёклы.
    reason: Сохраняет неоднозначность агиографического повествования.
lexical_decisions:
- source_word: Diana
  choice: Диана
  rationale: Сохранено имя, данное в доступном английском свидетельстве; в сноске указано соответствие греческой Артемиде и необходимость проверки по греческому тексту.
- source_word: debauch / violate
  choice: обесчестить; осквернить целомудрие
  rationale: В речи заговорщиков передана цель сексуального насилия без эвфемизма, скрывающего угрозу, но с учётом возвышенного повествовательного регистра.
- source_word: lie with her
  choice: лечь с ней
  rationale: Сохранена прямая библейски узнаваемая формула речи нападавших, не превращённая в более грубое современное выражение.
- source_word: ravished / rape
  choice: изнасиловать
  rationale: Современное точное обозначение насильственного намерения устраняет возможную двусмысленность архаичного английского слова.
- source_word: monastic life
  choice: уединённая жизнь
  rationale: Не импортируется более поздняя институциональная модель монашества; передаётся образ жизни в пещере, пока греческий источник не проверен.
- source_word: translated her
  choice: переселил её
  rationale: Сохраняется агиографическая неоднозначность между преставлением, перенесением и окончанием земной жизни; она пояснена в сноске.
theological_decisions:
- issue: Обращение «Отец, Сын и Святой Дух»
  choice: Сохранена тринитарная формула свидетельства без догматического разъяснения.
  alternative: Перестроить как явно позднейшую литургическую вставку или сгладить в обращение только к Богу.
  rationale: Формула является частью предоставленного текста и должна оставаться видимой как его собственное богословское свидетельство.
- issue: Титулы Фёклы в 11:15
  choice: «первая мученица, апостол Божий и дева»
  alternative: Заменить «апостол» на «проповедница» или согласовать как «апостольница».
  rationale: Сохранён сильный и потенциально напряжённый титул английского свидетельства без конфессионального переосмысления.
- issue: Окончание жизни Фёклы
  choice: «Господь переселил её» с поясняющей сноской
  alternative: «Господь взял её к Себе» или «она умерла».
  rationale: Текст одновременно говорит о её страдании, чудесном вхождении в скалу и окончании жизни; перевод не устраняет эту агиографическую напряжённость.
- issue: beatific vision
  choice: «блаженное созерцание»
  alternative: «лицезрение Бога» или терминологическое «блаженное видение».
  rationale: Сохраняется возвышенный эсхатологический смысл, но не навязывается конкретная позднейшая доктринальная схема.
translation_notes:
  register: 'Современный литературный русский язык с dignified агиографическим тоном и ясной прямой речью. Архаизмы сведены к минимуму; сохранены традиционные формы «Фёкла», «Фамирис», «Икония». Черновик неизбежно предварительный: предоставленный материал является английским публичнодоменным свидетельством, а прямая сверка с греческой и версионной рукописной традицией ещё не выполнена.'
