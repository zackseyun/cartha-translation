  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/011.yaml
  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: ru
  text: 'ДЕЯНИЯ ПАВЛА И ФЁКЛЫ


    ГЛАВА XI


    11:1 Тогда дьявол вложил в их умы злой замысел. Однажды они собрались на совет и стали рассуждать между собой: «Эта дева — жрица великой богини Дианы[a], и всё, чего она у неё просит, ей даётся, потому что она дева и потому любима всеми богами.


    11:2 Итак, найдём нескольких распутных молодчиков, напоим их допьяна, дадим им много денег и велим пойти и обесчестить эту деву, пообещав им ещё большую награду, если они это сделают».


    11:3 Ведь они решили между собой, что, если им удастся обесчестить её, боги больше не будут к ней благосклонны и Диана больше не станет ради неё исцелять больных.


    11:4 Они исполнили задуманное. Молодчики поднялись на гору, словно свирепые львы подошли к пещере и постучали в дверь.


    11:5 Святая мученица Фёкла, уповая на Бога, в Которого верила, открыла дверь, хотя уже знала об их замысле, и спросила:


    — Молодые люди, что вам нужно?


    11:6 Они ответили:


    — Здесь ли та, которую зовут Фёклой?


    Она спросила:


    — Что вам от неё нужно?


    Они сказали:


    — Мы хотим лечь с ней.


    11:7 Блаженная Фёкла ответила:


    — Хотя я смиренная старица, я служу моему Господу Иисусу Христу. И хотя вы задумали против меня гнусное дело, совершить его вам не удастся.


    Они возразили:


    — Не может быть, чтобы мы не сделали с тобой всего, чего захотим.


    11:8 С этими словами они силой схватили её, намереваясь изнасиловать. Тогда она с (величайшей) кротостью[b] сказала им:


    — Молодые люди, подождите — и увидите славу Господа.


    11:9 Пока они держали её, она подняла глаза к небу и сказала:


    — О вседосточтимый Боже, с Которым никто не сравнится! Ты являешь Свою славу над врагами; Ты избавил меня от огня и не отдал ни Фамирису, ни Александру; Ты спас меня от диких зверей и сохранил в глубоких водах; Ты повсюду был моим помощником и прославил во мне Своё имя.


    11:10 И теперь избавь меня от рук этих злых и неразумных людей. Не допусти, чтобы они осквернили целомудрие, которое я доныне хранила ради Твоей чести. Ведь я люблю Тебя, стремлюсь к Тебе и поклоняюсь Тебе, Отец, Сын и Святой Дух, во веки. Аминь.


    11:11 Тогда с неба раздался голос:


    — Не бойся, Фёкла, верная служительница Моя, ибо Я с тобой. Посмотри на место, которое открылось для тебя. Там будет твоё вечное жилище; там ты удостоишься блаженного созерцания[c].


    11:12 Блаженная Фёкла посмотрела и увидела, что скала раскрылась настолько, что внутрь мог войти человек. Исполнив повеление, она мужественно вырвалась от гнусной шайки и вошла в скалу. Та сразу же сомкнулась так плотно, что на месте отверстия не осталось ни единой трещины.


    11:13 Мужчины в полном изумлении застыли перед столь необычайным чудом и не смогли удержать служительницу Божью. Они успели лишь ухватиться за её покрывало, или накидку, и оторвали от него кусок.


    11:14 Но и это произошло по Божьему допущению: чтобы укрепить веру тех, кто придёт увидеть это почитаемое место, и принести благословение людям последующих поколений, которые от чистого сердца уверуют в нашего Господа Иисуса Христа.


    11:15 Так пострадала Фёкла — первая мученица, апостол Божий и дева. Она пришла из Иконии восемнадцатилетней. После этого она прожила ещё семьдесят два года — частью в странствиях и путешествиях, частью ведя уединённую жизнь в пещере. Ей было девяносто лет, когда Господь переселил её[d].


    11:16 Так окончилась её жизнь.


    11:17 День её священной памяти отмечается двадцать четвёртого сентября — во славу Отца, Сына и Святого Духа, ныне и во веки. Аминь.


    [a] Диана — римское имя богини, соответствующей греческой Артемиде. В предоставленном английском свидетельстве стоит Diana; сверка с греческой рукописной традицией ещё требуется.


    [b] Слово «величайшей» заключено в скобки вслед за предоставленным английским свидетельством; причина скобок без прямой сверки с источником неясна.


    [c] Буквально по английскому свидетельству: «блаженное видение» (beatific vision). Перевод «блаженное созерцание» сохраняет религиозный смысл, не уточняя его позднейшими догматическими категориями.


    [d] «Переселил её» передаёт старинное translated в значении чудесного перенесения или преставления. Формулировка намеренно не уточняет способ окончания земной жизни Фёклы.

    '
