  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: ru
  text: 'ДЕЯНИЯ ПАВЛА И ФЕКЛЫ

    ГЛАВА VIII


    8:1 Увидев это, народ заговорил: «Несправедливы приговоры, которые выносят в этом городе!» Фекла же попросила правителя о милости: пусть никто не посягнёт на её целомудрие и она сохранит его до тех пор, пока её не бросят зверям.


    8:2 Тогда правитель спросил, кто примет её к себе. Одна очень богатая вдова по имени Трифена, у которой незадолго до этого умерла дочь, попросила отдать Феклу под её опеку и стала обращаться с ней в своём доме как с родной дочерью.


    8:3 Наконец настал день, когда зверей должны были вывести на всеобщее обозрение. Феклу привели в амфитеатр и на глазах у множества зрителей поместили в логово к чрезвычайно свирепой львице.


    8:4 Трифена без страха сопровождала Феклу, а львица лизала Фекле ноги. На табличке с указанием её вины было написано: «Святотатство». Тогда женщина воскликнула: «О Боже! Неправедны приговоры этого города!»


    8:5 После показа зверей Трифена отвела Феклу к себе домой, и они легли спать. И вот умершая дочь Трифены явилась матери и сказала: «Мать, пусть эта молодая женщина, Фекла, станет тебе дочерью вместо меня. Попроси её помолиться обо мне, чтобы я была перенесена в место праведных».[a]


    8:6 Тогда Трифена с печалью сказала: «Мне явилась моя дочь Фалконилла и велела принять тебя вместо неё. Поэтому прошу тебя, Фекла: помолись о моей дочери, чтобы она была перенесена в место праведных и обрела вечную жизнь».


    8:7 Услышав это, Фекла тотчас помолилась Господу: «Господи, Боже неба и земли, Иисус Христос, Сын Всевышнего! Даруй, чтобы её дочь Фалконилла жила вовеки». Услышав это, Трифена снова застонала и сказала: «О неправедные приговоры! О безумное злодеяние — такого человека снова бросают зверям!»[b]


    8:8 На следующий день, на рассвете, Александр пришёл в дом Трифены и сказал: «Правитель и народ ждут. Выведи осуждённую».


    8:9 Но Трифена с такой яростью бросилась на него, что он испугался и убежал. Трифена принадлежала к царскому роду. Изливая свою скорбь, она сказала: «Горе мне! Двойная беда в моём доме, и некому помочь мне: ни утешить после смерти дочери, ни спасти Феклу. Но теперь, Господи Боже, помоги Твоей служительнице Фекле!»


    8:10 Пока она так говорила, правитель послал за Феклой одного из своих служителей. Трифена взяла её за руку и пошла вместе с ней, говоря: «Я провожала Фалкониллу к могиле, а теперь должна проводить Феклу к зверям».


    8:11 Услышав это, Фекла со слезами помолилась: «Господи Боже, на Тебя я уповала, в Тебе искала прибежища! Вознагради Трифену за её сострадание ко мне и за то, что она сохранила моё целомудрие».


    8:12 В амфитеатре стоял великий шум: звери рычали, а народ кричал: «Выведите осуждённую!»


    8:13 Но женщина воскликнула: «Пусть весь город понесёт наказание за такое беззаконие! Правитель, вели и всех нас подвергнуть той же казни! О несправедливый приговор! О жестокое зрелище!»


    8:14 Другие говорили: «Пусть весь город погибнет за это гнусное дело! Правитель, убей всех нас! О жестокое зрелище! О неправедный приговор!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальный образ греческой традиции — «перенесена в место праведных»; в старом английском свидетельстве это передано более отвлечённо: «переведена в состояние счастья».'
    reason: Указывает на значимое различие между конкретным древним образом и формулировкой предоставленного английского свидетельства.
  - marker: b
    text: Слово «снова» сохранено по предоставленному английскому свидетельству, где оно отмечено скобками; его текстовая устойчивость требует дальнейшей сверки с греческими и переводными рукописями.
    reason: Необходимо явно обозначить неопределённость элемента, который сам английский свидетель считает сомнительным или пояснительным.
lexical_decisions:
- source_word: Trifina / Greek Τρύφαινα
  choice: Трифена
  rationale: Форма передаёт традиционное греческое имя ближе к его исходному звучанию и остаётся естественной по-русски.
- source_word: chastity
  choice: целомудрие
  rationale: Сохраняет нравственный и телесный смысл понятия, не сужая его исключительно до физиологической девственности.
- source_word: Sacrilege
  choice: Святотатство
  rationale: Естественное русское обозначение преступления против святыни; подходит для надписи с формулировкой обвинения.
- source_word: criminal
  choice: осуждённая
  rationale: В контексте речь идёт о женщине, уже приговорённой к зверям; выбор не утверждает справедливость обвинения, как могло бы слово «преступница».
- source_word: state of happiness / probable Greek place of the righteous
  choice: место праведных
  rationale: Передаёт конкретный образ, засвидетельствованный греческой традицией этого эпизода, и избегает расплывчатого позднего выражения «состояние счастья».
- source_word: royal family
  choice: царский род
  rationale: Достоинственно и понятно передаёт принадлежность Трифены к царской семье или династическому кругу, не уточняя не названный в тексте статус.
theological_decisions:
- issue: Посмертная молитва о Фалконилле
  choice: Сохранить просьбу и молитву без догматического пояснения результата
  alternative: Истолковать сцену в соответствии с определённым учением о состоянии умерших
  rationale: Повествование выражает собственную богословскую напряжённость апокрифического текста; перевод не должен ни подтверждать, ни опровергать позднейшие конфессиональные выводы.
- issue: «Место праведных» и «вечная жизнь»
  choice: Сохранить обе формулировки рядом
  alternative: Свести их к одному систематизированному понятию о загробной участи
  rationale: Смежные образы не обязательно полностью тождественны, поэтому их различие сохранено.
- issue: Обращение к Иисусу Христу как к Господу Богу
  choice: Сохранить синтаксическую форму молитвы и последовательность титулов
  alternative: Перестроить обращение так, чтобы заранее определить отношения между именованиями
  rationale: Так сохраняется возможная богословская многозначность исходной формулы.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Реплики эмоциональны, но без искусственной архаизации; употреблены «правитель», «служитель», «осуждённая», чтобы текст был понятен широкому читателю. Проект остаётся предварительным там, где предоставленные метаданные прямо указывают на необходимость полной сверки с греческой и переводной рукописной традицией.
