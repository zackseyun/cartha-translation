lexical_decisions:
- source_word: refresh yourselves
  choice: подкрепитесь
  rationale: Естественная современная передача гостеприимного приглашения поесть и восстановить силы.
- source_word: very rich provision
  choice: изысканных яств
  rationale: Передаёт богатство и качество угощения в достойном повествовательном регистре.
- source_word: doctrines / teachings
  choice: чему учит
  rationale: Ясная современная формулировка без излишне конфессионального оттенка слова «доктрины».
- source_word: governor
  choice: правитель
  rationale: Нейтральное обозначение властного лица; точный греческий административный титул требует проверки по источнику.
- source_word: perverted / led astray
  choice: совратил
  rationale: Сохраняет обвинительный смысл отклонения людей от принятого пути и подходит как городу, так и умам слушателей.
- source_word: imposter (magician)
  choice: обманщика — колдуна
  rationale: Основное обвинение и засвидетельствованная альтернативная характеристика сохранены в тексте с пояснением в сноске.
theological_decisions:
- issue: Смысл уже наступившего воскресения
  choice: Сохранено утверждение, что воскресение уже произошло, связано с рождением детей и познанием Бога.
  alternative: Истолковать речь как исключительно духовную или исключительно телесно-родовую концепцию воскресения.
  rationale: Текст намеренно соединяет две формулы; перевод не должен сглаживать их напряжение или приводить к определённой конфессиональной системе.
- issue: «Новая вера христиан»
  choice: новую веру христиан
  alternative: новую религию христиан
  rationale: «Вера» звучит естественнее по-русски, сохраняя внешний обвинительный взгляд говорящих; формулировка не подтверждает и не опровергает их оценку.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Архаические формы устранены, имена переданы в привычной русской библейско-церковной традиции. Поскольку предоставлен только старый английский перевод-свидетель, а прямая сверка с греческим источником ещё не выполнена, административная терминология и вариант в 3:9 остаются предварительными.
