    rationale: В свидетельстве стоит «new religion of the Christians». «Вера» возможна по смыслу, но «религия» точнее сохраняет внешнее, обвинительное обозначение учения Демасом и Ермогеном.
  - severity: medium
    issue: '3:9: «обманщика — колдуна» меняет функцию скобочной альтернативы.'
    rationale: Английское свидетельство даёт «imposter (magician)». Скобки следует сохранить в основном тексте; сноска должна пояснять, что это переданная свидетелем альтернатива, а не установленное чтение оригинала.
  - severity: low
    issue: '3:9: «Прочь этого обманщика» и «совратил умы» звучат менее естественно в современном русском.'
    rationale: «Долой этого обманщика...» и «сбил с пути наших жён» естественнее передают публичный обвинительный крик, не меняя его смысла.
