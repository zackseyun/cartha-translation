  terminology: 'Имена оставлены в принятой русской передаче: Фамирис, Фёкла, Димас, Ермоген, Онисифор, Кастиллий. «Правитель» остаётся нейтральным соответствием governor; «кесарь» уместен для Caesar. Формула о воскресении не догматически истолкована.'
  issues:
