    3:4 Димас и Ермоген в один голос ответили: «Пусть его приведут к правителю Кастиллию как человека, который убеждает народ принять новую религию христиан. Тогда правитель, согласно указу кесаря, предаст его смерти, и ты получишь свою жену.


