lexical_decisions:
- source_word: keeping a fast / fasted
  choice: постился / постились
  rationale: Передаёт религиозное воздержание естественным современным русским глаголом.
- source_word: coat
  choice: верхняя одежда
  rationale: Нейтральная передача предмета одежды, поскольку точный вид одежды нельзя надёжно установить по предоставленному английскому свидетельству.
- source_word: delivered from the flames
  choice: была избавлена от огня
  rationale: Сохраняет пассивную формулировку и не уточняет действующего избавителя сверх текста.
- source_word: searches the heart
  choice: исследующий сердца
  rationale: Сохраняет библейскую образность; множественное число естественно выражает способность Бога знать сердца людей.
- source_word: entire affection
  choice: глубокая любовь друг к другу
  rationale: Передаёт взаимную сердечную привязанность без архаической буквальности.
- source_word: solaced each other in reflections upon
  choice: ободряли друг друга, беседуя о
  rationale: Естественно передаёт взаимное утешение и назидательную беседу, не превращая её в формальный богословский трактат.
- source_word: fornication
  choice: разврат
  rationale: Передаёт сексуальную распущенность людей в данном контексте современным, но dignified выражением.
- source_word: seal of Christ
  choice: печать Христа
  rationale: Ключевой образ сохранён буквально и не истолкован как конкретный обряд.
- source_word: gift of Christ
  choice: дар Христа
  rationale: 'Сохраняет родительный оборот и его возможную неоднозначность: дар от Христа или дар, связанный с Христом.'
theological_decisions:
- issue: Адресат молитвы в 6:7
  choice: Сохранено последовательное обращение «святой Отец» и «Господь Иисус Христос» без гармонизации.
  alternative: Свести всю молитву к обращению только к Отцу или только ко Христу.
  rationale: Предоставленное свидетельство допускает напряжённую синтаксическую последовательность двух обращений; перевод не должен без основания разрешать её.
- issue: Значение «печати Христа»
  choice: Выражение сохранено как «печать Христа» с пояснением о нераскрытом смысле.
  alternative: Перевести прямо как «крещение» или иной определённый обряд.
  rationale: Сам текст не называет обряд прямо, а проверка греческой рукописной традиции ещё не проведена.
- issue: Значение «дара Христа»
  choice: Сохранено общее выражение «дар Христа».
  alternative: Отождествить дар с крещением, Святым Духом или защитой от искушения.
  rationale: Контекст может подсказывать связь с предыдущей просьбой, но не определяет дар однозначно.
- issue: Избавление Фёклы от огня
  choice: Пассивная формулировка «была избавлена» сохранена.
  alternative: Явно назвать Бога или Христа избавителем.
  rationale: Так сохраняется богословская импликация божественного избавления без добавления субъекта, отсутствующего в формулировке свидетельства.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным регистром в молитвах. Диалоги сделаны естественными и понятными; архаизмы английского свидетельства устранены. Имена переданы в традиционной русской форме: Павел, Онисифор, Фёкла, Икония, Дафна. Проект остаётся предварительным, поскольку составлен по предоставленному публичному английскому свидетельству, а непосредственная сверка с греческой и версионной рукописной традицией ожидается.'
