  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: ru
  text: '6:1 Тем временем Павел вместе с Онисифором, его женой и детьми постился в одной пещере у дороги из Иконии в Дафну.


    6:2 Когда они постились уже несколько дней, дети сказали Павлу: «Отец, мы голодны, а купить хлеба нам не на что». Ведь Онисифор оставил всё своё имущество, чтобы вместе с семьёй последовать за Павлом.


    6:3 Тогда Павел снял верхнюю одежду и сказал мальчику: «Пойди, дитя, купи хлеба и принеси сюда».


    6:4 Когда мальчик пошёл покупать хлеб, он увидел свою соседку Фёклу и удивлённо спросил её: «Фёкла, куда ты идёшь?»


    6:5 Она ответила: «Я ищу Павла, после того как была избавлена от огня».


    6:6 Тогда мальчик сказал: «Я отведу тебя к нему. Он очень тревожится о тебе и вот уже шесть дней молится и постится».


    6:7 Придя к пещере, Фёкла увидела Павла: стоя на коленях, он молился и говорил: «О святой Отец, о Господь Иисус Христос! Не дай огню коснуться Фёклы, но будь ей помощником, ведь она — Твоя служительница».


    6:8 Тогда Фёкла, стоявшая позади него, воскликнула: «О Владыка Господь, Творец неба и земли, Отец Твоего возлюбленного и святого Сына! Благодарю Тебя за то, что Ты сохранил меня от огня и дал мне вновь увидеть Павла».


    6:9 Павел встал и, увидев её, сказал: «О Боже, исследующий сердца, Отец моего Господа Иисуса Христа! Благодарю Тебя за то, что Ты услышал мою молитву».


    6:10 Всех находившихся в пещере охватила глубокая любовь друг к другу; Павел, Онисифор и все бывшие с ними исполнились радости.


    6:11 У них было пять хлебов, немного зелени и вода, и они ободряли друг друга, беседуя о святых делах Христа.


    6:12 Тогда Фёкла сказала Павлу: «Если ты согласен, я последую за тобой, куда бы ты ни пошёл».


    6:13 Он ответил ей: «Ныне люди весьма склонны к разврату, а ты красива. Я боюсь, как бы тебя не постигло искушение ещё больше прежнего и как бы ты не оказалась побеждена, не устояв перед ним».


    6:14 Фёкла ответила: «Дай мне только печать Христа[a], и никакое искушение меня не коснётся».


    6:15 Павел сказал: «Фёкла, терпеливо жди — и ты получишь дар Христа».


    [a] «Печать Христа» — образное выражение, смысл которого здесь не раскрывается; оно может обозначать обряд или знак принадлежности Христу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Печать Христа» — образное выражение, смысл которого здесь не раскрывается; оно может обозначать обряд или знак принадлежности Христу.
