  revised_text: 'ДЕЯНИЯ ПАВЛА И ФЕКЛЫ


    ГЛАВА I


    1:1 Когда Павел после бегства из Антиохии направился в Иконию, его спутниками стали Димас и Ермоген, которые в то время были исполнены лицемерия.


    1:2 Но Павел, взирая лишь на благость Бога, не причинял им зла и горячо их любил.


    1:3 Поэтому он старался сделать для них приемлемыми все изречения и учения Христа, а также замысел благой вести о возлюбленном Сыне Божьем, наставляя их в познании Христа, как оно было открыто ему.


    1:4 Некий человек по имени Онисифор, услышав, что Павел пришёл в Иконию, поспешил ему навстречу вместе со своей женой Лектрой и сыновьями Симмией и Зеноном, чтобы пригласить его в свой дом.


    1:5 Ведь Тит описал им внешность Павла. Лично они его ещё не знали, а знали лишь о его нраве.


    1:6 Они вышли на царскую дорогу, ведущую к Листре, и стали там ждать его, сопоставляя каждого проходившего с описанием, которое дал им Тит.


    1:7 Наконец они увидели идущего человека — это был Павел: невысокого роста, с лысой или обритой головой[a], кривыми бёдрами, красивыми ногами, впалыми глазами и крючковатым носом. Он был исполнен благодати: временами выглядел как человек, а временами лицо его было подобно лицу ангела. Павел увидел Онисифора и обрадовался.


    1:8 Онисифор сказал: «Приветствую тебя, служитель благословенного Бога!» Павел ответил: «Да будет благодать Божья с тобой и твоей семьёй».


    1:9 Но Димас и Ермоген исполнились зависти, и Димас, напуская на себя вид великого благочестия, сказал: «Разве и мы не служители благословенного Бога? Почему же ты не приветствовал нас?»


    1:10 Онисифор ответил: «Потому что я не увидел в вас плодов праведности. Но если вы таковы, то и вам будут рады в моём доме».


    1:11 Затем Павел вошёл в дом Онисифора, и вся семья исполнилась великой радости. Они предавались молитве и преломлению хлеба и слушали, как Павел проповедовал слово Божье о воздержании[b] и воскресении:


    1:12 «Блаженны чистые сердцем, потому что они увидят Бога.


    1:13 Блаженны те, кто хранит свою плоть неосквернённой, то есть чистой[c], потому что они будут храмом Божьим.


    1:14 Блаженны воздержанные, то есть целомудренные[d], потому что Бог откроет им Себя.


    1:15 Блаженны те, кто отказывается от мирских удовольствий, потому что Бог примет их.


    1:16 Блаженны те, кто, имея жён, живёт так, словно их не имеет, потому что они станут ангелами Божьими.


    1:17 Блаженны те, кто трепещет перед словом Божьим, потому что они будут утешены.


    1:18 Блаженны те, кто хранит своё крещение в чистоте[e], потому что они обретут мир с Отцом, Сыном и Святым Духом.


    1:19 Блаженны те, кто стремится к мудрости (или учению)[f] Иисуса Христа, потому что они будут названы сынами Всевышнего.


    1:20 Блаженны те, кто соблюдает наставления Иисуса Христа, потому что они будут обитать в вечном свете.


    1:21 Блаженны те, кто из любви ко Христу отказывается от славы этого мира, потому что они будут судить ангелов, займут место по правую руку от Христа и не испытают горечи последнего суда.


    1:22 Блаженны тела и души девственников[g], потому что они угодны Богу и не лишатся награды за своё девство. Ибо слово их Небесного Отца явит свою спасительную силу в день Его Сына, и они навеки обретут покой».'
