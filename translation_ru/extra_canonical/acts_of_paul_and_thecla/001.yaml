base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/001.yaml
  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: ru
  text: 'ДЕЯНИЯ ПАВЛА И ФЕКЛЫ


    ГЛАВА I


    1:1 Когда Павел после бегства из Антиохии пришёл в Иконию, его спутниками стали Димас и Ермоген, которые в то время были исполнены лицемерия.


    1:2 Но Павел, взирая лишь на благость Бога, не причинял им зла и горячо их любил.


    1:3 Поэтому он старался сделать для них близкими все изречения и учения Христа, а также замысел благой вести о возлюбленном Сыне Божьем, наставляя их в познании Христа так, как оно было открыто ему.


    1:4 Некий человек по имени Онисифор, услышав, что Павел пришёл в Иконию, поспешил ему навстречу вместе со своей женой Лектрой и сыновьями Симмией и Зеноном, чтобы пригласить его в свой дом.


    1:5 Ведь Тит описал им внешность Павла. Лично они его ещё не знали, а знали лишь о его нраве.


    1:6 Они вышли на царскую дорогу, ведущую к Листре, и стали там ждать его, сверяя каждого проходившего с описанием, которое дал им Тит.


    1:7 Наконец они увидели идущего им навстречу человека — это был Павел: невысокого роста, с лысой или обритой головой[a], кривыми бёдрами, красивыми ногами, глубоко посаженными глазами и крючковатым носом. Он был исполнен благодати: временами выглядел как человек, а временами лицо его было словно лицо ангела. Павел увидел Онисифора и обрадовался.


    1:8 Онисифор сказал: «Приветствую тебя, служитель благословенного Бога!» Павел ответил: «Да будет благодать Божья с тобой и твоей семьёй».


    1:9 Но Димас и Ермоген исполнились зависти, и Димас, напуская на себя вид великого благочестия, сказал: «Разве и мы не служители благословенного Бога? Почему же ты не приветствовал нас?»


    1:10 Онисифор ответил: «Потому что я не увидел в вас плодов праведности. Но если вы таковы, то и вам будут рады в моём доме».


    1:11 Затем Павел вошёл в дом Онисифора, и вся семья исполнилась великой радости. Они предавались молитве и преломлению хлеба и слушали, как Павел проповедовал слово Божье о воздержании[b] и воскресении:


    1:12 «Блаженны чистые сердцем, потому что они увидят Бога.


    1:13 Блаженны те, кто хранит свою плоть неосквернённой, то есть чистой[c], потому что они будут храмом Божьим.


    1:14 Блаженны воздержанные, то есть целомудренные[d], потому что Бог откроет им Себя.


    1:15 Блаженны те, кто отказывается от мирских удовольствий, потому что Бог примет их.


    1:16 Блаженны те, кто, имея жён, живёт так, словно их не имеет, потому что они станут ангелами Божьими.


    1:17 Блаженны те, кто трепещет перед словом Божьим, потому что они будут утешены.


    1:18 Блаженны те, кто хранит своё крещение в чистоте[e], потому что они обретут мир с Отцом, Сыном и Святым Духом.


    1:19 Блаженны те, кто стремится к мудрости, то есть учению[f], Иисуса Христа, потому что они будут названы сынами Всевышнего.


    1:20 Блаженны те, кто соблюдает наставления Иисуса Христа, потому что они будут обитать в вечном свете.


    1:21 Блаженны те, кто из любви ко Христу отказывается от славы этого мира, потому что они будут судить ангелов, займут место по правую руку от Христа и не испытают горечи последнего суда.


    1:22 Блаженны тела и души девственников[g], потому что они угодны Богу и не лишатся награды за своё девство. Ибо слово их Небесного Отца явит свою спасительную силу в день Его Сына, и они навеки обретут покой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В английском свидетельстве сохранены два варианта: «лысой» или «обритой». Прямое сопоставление с греческой и версионной традицией ещё требуется.'
    reason: Сохранение засвидетельствованной лексической альтернативы.
  - marker: b
    text: «Воздержание» здесь может включать самообладание вообще и половое воздержание в частности; дальнейшие изречения подчёркивают аскетический смысл.
    reason: Предотвращает неоправданное сужение многозначного аскетического термина.
  - marker: c
    text: «Неосквернённой» и «чистой» — варианты, приведённые в английском свидетельстве.
    reason: Сохранение альтернативы источника.
  - marker: d
    text: «Воздержанные» и «целомудренные» — смысловые варианты английского свидетельства; греческая проверка ожидается.
    reason: Термин допускает более широкий и более узкий аскетический смысл.
  - marker: e
    text: 'Буквально по свидетельству: «хранит своё крещение чистым». Формулировка может подразумевать сохранение крещальной чистоты, но текст не разъясняет её.'
    reason: Сохранение богословской неоднозначности без внесения частного толкования.
  - marker: f
    text: В английском свидетельстве даны варианты «мудрость» и «учение».
    reason: Сохранение лексической альтернативы.
  - marker: g
    text: Слово может обозначать девственных людей независимо от пола; контекст особо возвышает девство как телесное и душевное состояние.
    reason: Уточнение объёма русского грамматического мужского рода.
lexical_decisions:
- source_word: temperance / chaste (Greek review pending)
  choice: воздержание / воздержанные, то есть целомудренные
  rationale: Сохраняет аскетический контекст главы и засвидетельствованную в английском источнике смысловую альтернативу, не сводя понятие исключительно к сексуальному целомудрию.
- source_word: oracles
  choice: изречения
  rationale: Естественное русское обозначение авторитетных речений; «прорицания» внесло бы нежелательный языческий оттенок.
- source_word: design of the Gospel
  choice: замысел благой вести
  rationale: Передаёт целевую направленность вести без чрезмерно конфессионализированного толкования.
- source_word: king’s highway
  choice: царская дорога
  rationale: Сохраняет древний реалийный образ, не модернизируя его до нейтрального «главная дорога».
- source_word: hollow-eyed
  choice: с глубоко посаженными глазами
  rationale: Современная и естественная характеристика внешности, соответствующая смыслу английского свидетельства.
- source_word: keep their baptism pure
  choice: хранит своё крещение в чистоте
  rationale: Сохраняет необычную формулировку и её богословскую напряжённость, не подменяя её толкованием о крещальных обетах или послекрещальной безгрешности.
- source_word: virgins
  choice: девственников
  rationale: Русская форма грамматически может охватывать смешанную группу; пол участников в свидетельстве здесь прямо не ограничен.
theological_decisions:
- issue: Аскетическое содержание макаризмов
  choice: Передать высказывания прямо, включая отказ от мирских удовольствий и жизнь с жёнами «словно их не имеет»
  alternative: Смягчить их как общие призывы к умеренности или внутренней отрешённости
  rationale: Текст выражает собственную раннехристианскую аскетическую позицию; перевод не должен ни устранять её, ни превращать в нормативное учение иной традиции.
- issue: «Станут ангелами Божьими»
  choice: Сохранить буквальное утверждение
  alternative: «Будут подобны ангелам Божьим»
  rationale: Английское свидетельство утверждает именно превращение/становление; смягчение разрешило бы богословскую напряжённость без достаточного основания.
- issue: Мир «с Отцом, Сыном и Святым Духом»
  choice: Сохранить перечисление без догматического пояснения
  alternative: Истолковать как сформулированную тринитарную доктрину
  rationale: Перевод передаёт текстовую формулу, не приписывая ей более позднюю терминологическую точность.
- issue: Суд над ангелами и место по правую руку Христа
  choice: Сохранить эсхатологические обещания буквально
  alternative: Передать метафорически как особую честь
  rationale: Буквальная форма сохраняет связь с раннехристианской эсхатологической речью и не устраняет её напряжённость.
- issue: «Слово их Небесного Отца» в 1:22
  choice: Сохранить притяжательную связь и формулу о спасительной действенности слова
  alternative: Заменить на «обетование Небесного Отца спасёт их»
  rationale: Свидетельство допускает неоднозначность того, что именно означает «слово»; перевод не должен молча выбирать «обетование».
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского повествования. Архаические местоимения и тяжеловесные синтаксические кальки устранены; повторяющаяся формула «Блаженны…» сохранена. Имена переданы в привычных русских библейско-патристических формах. Проект остаётся предварительным: предоставленный «original_language_source» фактически является английским публичнодоменным свидетельством, а прямая сверка с греческой и версионной рукописной традицией ещё не выполнена.'
