base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/004.yaml
  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: ru
  text: '4:1 Тогда Фамирис предстал перед судейским креслом правителя и громко сказал:


    4:2 «Правитель! Я не знаю, откуда пришёл этот человек, но он учит, что вступать в брак непозволительно. Поэтому прикажи ему объяснить перед тобой, почему он проповедует такое учение».


    4:3 Пока он говорил, Димас и Ермоген, шепнув Фамирису, сказали: «Скажи, что он христианин, и его тотчас предадут смерти».


    4:4 Но правитель не стал спешить. Он подозвал Павла и спросил: «Кто ты и чему учишь? Тебя, по-видимому, обвиняют в тяжких преступлениях».


    4:5 Павел громко ответил: «Правитель! Раз теперь меня призвали дать отчёт в моём учении, прошу тебя выслушать меня.


    4:6 Бог — Бог воздаяния[a]; Он не ищет ничего, кроме спасения Своих творений. Он послал меня отвратить их от злых дел и пороков, от всяких греховных наслаждений и от смерти и убедить их больше не грешить.


    4:7 Ради этого Бог послал Своего Сына Иисуса Христа. Его я возвещаю и учу людей возлагать на Него надежду. Он один проявил такое сострадание к заблудшему миру, чтобы тот, правитель, не был осуждён, но обрёл веру, страх Божий, познание благочестия[b] и любовь к истине.


    4:8 Итак, если я учу лишь тому, что получил в откровении от Бога, в чём моя вина?»


    4:9 Выслушав его, правитель приказал связать Павла и заключить в темницу, пока у него не найдётся больше времени, чтобы подробнее его допросить.


    4:10 Ночью Фёкла сняла серьги и отдала их тюремному привратнику, а тот открыл ей двери и впустил её.


    4:11 Затем она подарила тюремщику серебряное зеркало, и он позволил ей войти туда, где находился Павел. Она села у его ног и слушала, как он говорил о великих делах Божьих.


    4:12 Видя, что Павел не боится страданий и с Божьей помощью держится мужественно, Фёкла настолько укрепилась в вере, что поцеловала его цепи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетельству: «Бог мщения». Прямое сопоставление с греческим текстом ещё требуется.'
    reason: Формулировка богословски значима, а исходные данные предупреждают, что проверка по греческому оригиналу пока не проведена.
  - marker: b
    text: 'В доступном английском свидетельстве: «познание религии»; греческое основание этого выражения нуждается в проверке.'
    reason: «Религия» и «благочестие» могут отражать разные греческие понятия, поэтому неопределённость нельзя скрывать.
lexical_decisions:
- source_word: governor
  choice: правитель
  rationale: Нейтральное обозначение должностного лица, соответствующее свидетельству и не вводящее более конкретный римский титул без проверки греческого текста.
- source_word: matrimony is unlawful
  choice: вступать в брак непозволительно
  rationale: Передаёт обвинение именно в запрете брака, не утверждая от лица повествователя, что таково полное учение Павла.
- source_word: God of vengeance
  choice: Бог воздаяния
  rationale: Сохраняет судебно-теологический смысл Божьего возмездия, избегая современного оттенка мелочной мстительности у слова «месть».
- source_word: knowledge of religion
  choice: познание благочестия
  rationale: Естественная для русского религиозного регистра формулировка; неопределённость английского свидетельства отмечена сноской.
- source_word: great things of God
  choice: великие дела Божьи
  rationale: Передаёт содержательный смысл рассказа о Божьих деяниях и сохраняет возвышенный регистр.
- source_word: turnkey / jailer
  choice: тюремный привратник / тюремщик
  rationale: Сохранено различие обозначений в английском свидетельстве, хотя они могут относиться к одному служителю.
theological_decisions:
- issue: Характер Бога в 4:6
  choice: Бог воздаяния
  alternative: Бог мщения
  rationale: Сохранена напряжённость между судом и спасением, но без усиления смысла до личной мстительности.
- issue: Условие спасения мира в 4:7
  choice: не был осуждён, но обрёл веру, страх Божий, познание благочестия и любовь к истине
  alternative: не был осуждён, но имел веру...
  rationale: Сохранён ряд благ, приведённый в свидетельстве, без систематизации их причинной или сотериологической последовательности.
- issue: Получение учения Павлом в 4:8
  choice: получил в откровении от Бога
  alternative: получил от Бога
  rationale: Сохраняется явное указание свидетельства на откровение без уточнения его формы.
- issue: Учение о браке
  choice: оформлено как обвинение Фамириса
  alternative: представить запрет брака как объективное резюме учения Павла
  rationale: Повествование сообщает это в речи обвинителя; перевод не подтверждает обвинение авторским голосом.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Архаизмы сведены к минимуму; сохранены судебный тон сцены, прямая речь и богословская напряжённость. Проект остаётся предварительным, поскольку предоставлено английское публично-доменное свидетельство, а прямая проверка греческой и версионной традиции ожидается.
