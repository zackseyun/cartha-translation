  naturalness: 'В целом регистр удачен: современный литературный русский с умеренно возвышенной интонацией. Уточнены несколько оборотов, чтобы избежать смыслового добавления и сделать синтаксис естественнее: «не исповедуют свою веру так, как иудеи», «воздерживаются от ... способа поклонения», «должны считать».'
  terminology: Сохранены «единый Бог вселенной», «Владыка», «всесожжения» и «глухие изображения». «Поклонение» последовательно передаёт worship; «дары» в контексте приношений не меняет смысла. Прописные местоимения о Боге сохранены как редакционная русская норма.
  issues:
