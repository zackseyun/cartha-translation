base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: ru
  text: 'Послание к Диогнету, 3


    Теперь, думаю, ты особенно хочешь услышать, почему они поклоняются Богу не так, как иудеи.


    Иудеи поступают хорошо, когда отвергают описанный выше образ поклонения и утверждают, что чтут единого Бога вселенной и признают Его Владыкой. Но когда они поклоняются Ему способами, подобными уже упомянутым, то совершенно заблуждаются.


    Ведь греки обнаруживают своё безрассудство, принося всё это бесчувственным и глухим изображениям. Иудеи же, полагая, что преподносят дары Богу, словно Он в них нуждается, по справедливости должны были бы считать это безумием, а не почитанием Бога.[a]


    Тот, Кто сотворил небо, землю и всё, что в них, и даёт всем нам всё необходимое, Сам не может нуждаться ни в чём из того, чем Он наделяет людей, воображающих, будто они дают это Ему.


    А те, кто думает приносить Ему в жертву кровь, жир и всесожжения и такими почестями чтить Его, на мой взгляд, ничем не отличаются от оказывающих такое же почтение глухим изображениям. Одни считают подобающим приносить дары тем, кто не способен принять эту честь, а другие — Тому, Кто ни в чём не нуждается.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь и далее автор полемически оценивает иудейские жертвоприношения. Перевод сохраняет его формулировку и не приписывает эту оценку иудеям как их собственное понимание поклонения.
    reason: Помогает современному читателю различить голос древнего автора и описываемую им традицию, не смягчая содержания текста.
lexical_decisions:
- source_word: practice their religion / worship
  choice: «поклоняются Богу» / «образ поклонения»
  rationale: Передаёт религиозное действие естественным современным русским языком, не сводя смысл только к обряду или к отвлечённой «религии».
- source_word: one God of the universe
  choice: «единый Бог вселенной»
  rationale: Сохраняет исповедальный акцент на единственности Бога и всеобщий масштаб выражения.
- source_word: Master
  choice: «Владыка»
  rationale: Достоинственное и понятное обозначение верховной власти Бога; ближе к древнему религиозному регистру, чем бытовое «хозяин».
- source_word: senseless and deaf images
  choice: «бесчувственные и глухие изображения»
  rationale: Сохраняет параллельные характеристики идолов, не добавляя отсутствующего в свидетельстве истолкования.
- source_word: folly
  choice: «безумие»
  rationale: В данном противопоставлении религиозному почитанию выражает сильную авторскую оценку; ранее употреблено «безрассудство», чтобы русский текст не звучал механически повторяющимся.
- source_word: whole burnt offerings
  choice: «всесожжения»
  rationale: Устоявшийся русский библейский термин для жертвы, сжигаемой целиком.
- source_word: unable to participate in the honor
  choice: «не способен принять эту честь»
  rationale: Сохраняет смысл неспособности неодушевлённых изображений быть действительными получателями оказываемого почтения.
theological_decisions:
- issue: Критика иудейского жертвоприношения
  choice: Сохранена как утверждение древнего автора без смягчения и без расширения.
  alternative: Истолковать её как критику только неправильно понятой жертвы либо добавить конфессиональное объяснение отмены жертв.
  rationale: Предоставленное свидетельство прямо сопоставляет кровавые жертвы, жир и всесожжения с дарами изображениям; перевод не должен разрешать богословское напряжение за автора.
- issue: Самодостаточность Бога
  choice: «Тому, Кто ни в чём не нуждается»
  alternative: «Самодостаточному Богу»
  rationale: Формулировка следует аргументу текста и не вводит более поздний систематико-богословский термин.
- issue: Референт местоимения «они» в первом абзаце
  choice: Сохранено местоимение «они».
  alternative: Явно заменить на «христиане».
  rationale: В пределах главы референт зависит от предыдущего контекста; явная подстановка устранила бы связность и небольшую степень контекстуальной неявности оригинального свидетельства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским регистром. Обращение передано на «ты», поскольку свидетельство использует единственное число. Прописные местоимения при указании на Бога выбраны как издательская норма данного русского текста, а не как отдельное богословское утверждение. Поскольку древнегреческий текст в задании не предоставлен и его прямая проверка отмечена как предстоящая, draft основан на указанном публичном английском свидетельстве с консультацией English POB; перед окончательной публикацией необходима сверка с греческим критическим текстом.
