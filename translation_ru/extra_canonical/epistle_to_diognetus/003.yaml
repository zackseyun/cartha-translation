    issue: 'В первом предложении добавлено «Богу»: «почему они поклоняются Богу не так, как иудеи».'
    rationale: Свидетельство говорит о том, что «они не исповедуют/не совершают свою религиозную практику так, как иудеи», не уточняя здесь объект поклонения. Добавление сужает и разъясняет исходную формулировку.
