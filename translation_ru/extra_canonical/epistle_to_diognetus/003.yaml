    rationale: «Воздерживаются от ... способа поклонения» ближе к свидетельству и не приписывает активного отрицания сверх текста.
  - severity: low
    issue: «Должны были бы считать» переводит актуальное нормативное суждение как гипотетическое/прошедшее.
    rationale: «Должны считать» точнее передаёт should ... count it folly.
