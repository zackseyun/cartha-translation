base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: ru
  text: 'Но их щепетильность в вопросах пищи, суеверное отношение к субботе, тщеславие по поводу обрезания, притворство в соблюдении постов и новомесячий — всё это, как я полагаю, [не][a] нуждается в моих объяснениях: это смешно и не заслуживает никакого внимания.


    Ведь принимать одни из вещей, сотворённых Богом для пользования людьми, как хорошо сотворённые, а другие отвергать как бесполезные и излишние — разве это не нечестиво?


    И вновь: клеветать на Бога, будто Он запрещает делать в субботу какое бы то ни было добро, — разве это не святотатство?


    И вновь: хвалиться увечьем плоти как знаком избрания, словно именно поэтому Бог особенно любит их, — разве это не смешно?


    А наблюдать за звёздами и луной, соблюдать месяцы и дни и по собственному произволу разделять установленные Богом порядки и смены времён, одни превращая в праздники, а другие — во времена скорби, — кто сочтёт это проявлением благочестия, а не, скорее, великого безумия?


    Итак, я полагаю, ты уже достаточно узнал о том, что христиане справедливо сторонятся распространённых среди иудеев нелепости и заблуждения, а также их чрезмерной мелочной щепетильности и гордости.[b] Но что касается тайны их собственного богопочитания, не ожидай, что человек сможет наставить тебя в ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «не» восстановлено издателями по смыслу; в переданном тексте имеется текстологическая неопределённость.
    reason: Сохраняет отмеченный английским свидетелем сигнал текстуального восстановления.
  - marker: b
    text: Здесь передана резкая полемическая оценка автора II века; её не следует принимать за нейтральное описание иудаизма или всех иудеев.
    reason: Даёт необходимый историко-рhetорический контекст, не устраняя трудную формулировку из основного текста.
lexical_decisions:
- source_word: scruples concerning meats
  choice: щепетильность в вопросах пищи
  rationale: Передаёт чрезмерную религиозную разборчивость в еде без архаичного «яства».
- source_word: superstition relating to the Sabbath
  choice: суеверное отношение к субботе
  rationale: Сохраняет резко полемическую оценку автора и конкретную отсылку к субботе.
- source_word: dissimulation
  choice: притворство
  rationale: Передаёт обвинение в неискренности, не усиливая его до прямого «лицемерия».
- source_word: new moons
  choice: новомесячия
  rationale: Устоявшийся русский религиозно-исторический термин для празднований нового месяца по луне.
- source_word: profane
  choice: святотатство
  rationale: По контексту речь о нечестивом приписывании Богу запрета добра; существительное сохраняет силу риторического вопроса.
- source_word: token of election
  choice: знак избрания
  rationale: Сохраняет богословскую категорию избрания без конфессионального истолкования.
- source_word: the mystery of their own religion
  choice: тайна их собственного богопочитания
  rationale: «Богопочитание» точнее обозначает религиозную жизнь и почитание Бога, не сводя выражение к институциональной «религии».
theological_decisions:
- issue: Субботний запрет на добро
  choice: «будто Он запрещает делать в субботу какое бы то ни было добро»
  alternative: «будто Он запретил делать в субботу что-либо хорошее»
  rationale: Сохранена полемическая формулировка свидетеля как характеристика позиции автора, без утверждения, что таково действительное содержание иудейского закона.
- issue: Обрезание и избрание
  choice: «увечьем плоти как знаком избрания»
  alternative: «обрезанием как свидетельством избранности»
  rationale: Сохранена намеренно резкая риторика текста и связь с избранием; эвфемизация устранила бы полемическую силу оригинала.
- issue: Источник наставления о христианской тайне
  choice: «не ожидай, что человек сможет наставить тебя в ней»
  alternative: «не надейся научиться этому от человека»
  rationale: Не уточняется, от кого именно приходит знание; сохраняется богословское напряжение заключительной фразы.
- issue: Антииудейская полемика
  choice: сохранена авторская критика с уточняющей сноской
  alternative: смягчить или обобщить до критики отдельных обычаев
  rationale: Исторический текст нельзя молча переписывать, однако следует обозначить, что это полемическая характеристика автора, а не нейтральное описание иудеев.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены повтор «И вновь», цепь риторических вопросов, прямое обращение на «ты» и резкая полемика. Поскольку прямое сопоставление с греческим источником ещё не выполнено, проект следует считать предварительным и основанным на указанном английском публично-доменном свидетеле.
