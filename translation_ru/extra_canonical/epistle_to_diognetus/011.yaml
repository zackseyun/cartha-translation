source:
  text: 'Mine are no strange discourses nor perverse questionings, but having been a disciple of Apostles I come forward as a teacher of the Gentiles, ministering worthily to them, as they present themselves disciples of the truth, the lessons which have been handed down.


    For who that has been rightly taught and has entered into friendship with the Word does not seek to learn distinctly the lessons revealed openly by the Word to the disciples; to whom the Word appeared and declared them, speaking plainly, not perceived by the unbelieving, but relating them to disciples who being reckoned faithful by Him were taught the mysteries of the Father?


    For which cause He sent forth the Word, that He might appear unto the world, Who being dishonored by the people, and preached by the Apostles, was believed in by the Gentiles.


    This Word, Who was from the beginning, Who appeared as new and yet was proved to be old, and is engendered always young in the hearts of saints,


    He, I say, Who is eternal, Who today was accounted a Son, through Whom the Church is enriched and grace is unfolded and multiplied among the saints, grace which confers understanding, which reveals mysteries, which announces seasons, which rejoices over the faithful, which is bestowed upon those who seek her, even those by whom the pledges of faith are not broken, nor the boundaries of the fathers overstepped.


    Whereupon the fear of the law is sung, and the grace of the prophets is recognized, and the faith of the gospels is established, and the tradition of the apostles is preserved, and the joy of the Church exults.


    If thou grieve not this grace, thou shalt understand the discourses which the Word holds by the mouth of those whom He desires when He wishes.


    For in all things, that by the will of the commanding Word we were moved to utter with much pains, we become sharers with you, through love of the things revealed unto us.'
