base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: ru
  text: 'Мои речи не чужды истине, и мои вопросы не извращены. Напротив, я был учеником апостолов и теперь выступаю как учитель язычников, достойно преподавая переданные нам наставления тем, кто сам становится учеником истины.


    Ведь кто, получив верное наставление и вступив в дружбу со Словом, не стремится ясно узнать то, что Слово открыто явило ученикам? Им явилось Слово и возвестило это, говоря прямо. Неверующие Его не постигли, но ученикам Он поведал это; признанные Им верными, они были научены тайнам Отца.


    Ради этого Он и послал Слово, чтобы Оно явилось миру. Народ обесчестил Его, апостолы проповедали о Нём, а язычники уверовали в Него.


    Это Слово было от начала; Оно явилось новым, но оказалось древним и всегда рождается юным в сердцах святых.


    Оно, говорю я, вечно; ныне Оно было признано Сыном.[a] Через Него обогащается Церковь, а благодать раскрывается и умножается среди святых — благодать, которая дарует понимание, открывает тайны, возвещает времена, радуется о верных и даётся ищущим её: тем, кто не нарушает залогов веры и не преступает пределов отцов.[b]


    Поэтому воспевается страх Закона, признаётся благодать пророков, утверждается вера Евангелий, сохраняется предание апостолов и ликует радость Церкви.


    Если ты не опечалишь эту благодать, то поймёшь наставления, которые Слово возвещает устами тех, кого пожелает, и тогда, когда пожелает.


    Ибо во всём, что по воле повелевающего Слова мы с великим трудом были побуждены высказать, мы через любовь к открытому нам становимся вашими соучастниками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по имеющемуся английскому свидетельству: «ныне был сочтён (или признан) Сыном». Формулировка и её временной оттенок сохранены без богословского уточнения; требуется сверка с греческим текстом.'
    reason: Необычная христологическая формула допускает несколько прочтений и не должна быть молча истолкована.
  - marker: b
    text: «Пределы отцов» — образ унаследованных границ или установлений; точный круг названных здесь «отцов» в данном свидетельстве не уточняется.
    reason: Предотвращает необоснованное отождествление с конкретной позднейшей церковной или конфессиональной категорией.
lexical_decisions:
- source_word: Word (Greek source review pending)
  choice: Слово
  rationale: Сохраняет личностное и богословское значение титула, а также последовательные местоименные отсылки.
- source_word: Gentiles
  choice: язычники
  rationale: Обычный и понятный русский эквивалент для нееврейских народов в раннехристианском контексте.
- source_word: friendship with the Word
  choice: дружба со Словом
  rationale: Сохранён необычный образ исходного свидетельства без замены на более конфессионально нагруженное выражение.
- source_word: mysteries
  choice: тайны
  rationale: Передаёт смысл сокрытого и открываемого знания, не вводя специального сакраментального толкования.
- source_word: pledges of faith
  choice: залоги веры
  rationale: Сохраняет предметную метафору и её возможную многозначность.
- source_word: boundaries of the fathers
  choice: пределы отцов
  rationale: Формальная передача образа установленных предшественниками границ без уточнения, кого именно обозначают «отцы».
- source_word: seasons
  choice: времена
  rationale: Сохраняет широкое значение назначенных периодов или сроков, не сводя его к календарю либо эсхатологии.
theological_decisions:
- issue: Кто посылает Слово в выражении «Он послал Слово»
  choice: Сохранено местоимение «Он» без поясняющей подстановки «Отец»
  alternative: «Отец послал Слово»
  rationale: Английское свидетельство оставляет субъект местоименным; явное уточнение преждевременно разрешило бы синтаксическую и богословскую неоднозначность до проверки греческого текста.
- issue: Фраза «today was accounted a Son»
  choice: «ныне Оно было признано Сыном» с примечанием
  alternative: «ныне Оно явлено как Сын» или «ныне почитается Сыном»
  rationale: Сохранены временной парадокс и пассивная формулировка свидетельства; не внесено объяснение о вечном рождении или усыновлении.
- issue: Персонификация благодати
  choice: 'Сохранена как действующая и даруемая реальность: «благодать, которая…»'
  alternative: Перестроить перечисление как безличное описание Божьих действий
  rationale: Исходное свидетельство последовательно приписывает благодати действия; это не следует сглаживать.
- issue: «faith of the gospels»
  choice: «вера Евангелий»
  alternative: «вера в Евангелия» или «достоверность Евангелий»
  rationale: 'Сохранён родительный оборот и его смысловая напряжённость: речь может идти о вере, засвидетельствованной Евангелиями, либо об их вероучительном содержании.'
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского увещания. Архаические формы второго лица устранены, но сохранено обращение на «ты», соответствующее единственному числу английского свидетельства. Синтаксис умеренно упрощён для ясности, при этом параллелизмы и богословски значимые повторы сохранены. Черновик неизбежно предварительный: предоставлен английский публично-доменный свидетельский перевод, тогда как прямая сверка с древнегреческим источником ещё не выполнена; утраченный Codex Argentoratensis известен по копиям.'
