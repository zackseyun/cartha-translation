review_pass:
  verdict: revise
  source_fidelity: Нужна правка по прямой сверке с греческим текстом. В частности, φρουρεῖται означает «охраняется / содержится под стражей», а θεοσέβεια — «богопочитание», не общее «благочестие». В заключении τάξις — назначенное положение, порядок или предназначение; «служение» возможно как толкование, но менее точно. Остальная структура аналогии и ключевые образы в целом переданы верно.
  naturalness: Текст в целом литературен и хорошо сохраняет параллельные построения. Однако «душу стесняют в пище и питье» звучит неестественно и неясно; лучше прямо сказать о лишениях в пище и питье. «Содержатся в мире» также слабее образа охраны/стражи.
  terminology: «Плоть», «не от мира», «нетление» и «странствуют» уместны. «Богопочитание» точно передаёт θεοσέβεια и остаётся понятным в современном литературном регистре. «Предназначение» в финале сохраняет широту τάξις без внесения специального церковного смысла.
  issues:
  - severity: medium
    issue: «Невидимая душа заключена в видимом теле»
    rationale: Греческое φρουρεῖται означает, что душа охраняется, содержится под стражей; простое «заключена» не передаёт пассивного образа охраны и ослабляет соответствующую аналогию с христианами, которые «охраняются/содержатся под стражей» в мире как в темнице.
  - severity: medium
    issue: «Их благочестие остаётся невидимым»
    rationale: В греческом стоит θεοσέβεια — богопочитание, почитание Бога. «Благочестие» близко, но менее определённо и не передаёт прямо теоцентрический компонент слова.
  - severity: medium
    issue: «Когда душу стесняют в пище и питье»
    rationale: Оборот неестественен по-русски. κακῶς πάσχουσα περὶ βρωμάτων καὶ πομάτων говорит о тяжёлом обращении/лишениях в отношении пищи и питья.
  - severity: low
    issue: «Столь велико служение»
    rationale: τάξις буквально обозначает установленное положение, порядок, назначение. «Служение» допустимо как интерпретация, но «предназначение» точнее сохраняет широту оригинала.
  - severity: low
    issue: Примечания основаны на заявленной непроверенности греческого текста
    rationale: 'При прямой сверке эти примечания более не нужны: они фиксируют неопределённости английского свидетеля, которые разрешаются греческими θεοσέβεια, ἐν οὐρανοῖς и πλείους γίνονται.'
