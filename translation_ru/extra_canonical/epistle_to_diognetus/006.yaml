revisions:
- from: 'Одним словом, что душа в теле, то христиане в мире.


    Душа рассеяна по всем членам тела, а христиане — по разным городам мира.


    Душа обитает в теле, но происходит не от тела. Так и христиане обитают в мире, но они не от мира.


    Невидимая душа заключена в видимом теле. Так и христиан узнают как живущих в мире, однако их благочестие остаётся невидимым.[a]


    Плоть ненавидит душу и воюет против неё, хотя душа не причинила ей никакого зла: ведь она не позволяет плоти предаваться удовольствиям. Так и мир ненавидит христиан, хотя не претерпел от них никакого зла, потому что они противятся его удовольствиям.


    Душа любит ненавидящую её плоть и её члены. Так и христиане любят тех, кто их ненавидит.


    Душа заключена в теле, но сама поддерживает тело. Так и христиане содержатся в мире словно в темнице, но сами поддерживают мир.


    Душа, хотя и бессмертна, обитает в смертном жилище. Так и христиане странствуют среди тленного, ожидая нетления на небесах.[b]


    Когда душу стесняют в пище и питье, она становится лучше. Так и христиане, подвергаясь наказаниям, день ото дня всё более умножаются.[c]


    Столь велико служение, на которое поставил их Бог, и отказаться от него им не позволено.'
