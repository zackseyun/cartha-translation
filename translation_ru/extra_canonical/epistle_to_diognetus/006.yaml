  rationale: Перевод исправлен по греческим формулировкам при сохранении композиции, образности и без конфессионального истолкования. Уточнены «под охраной» для φρουρεῖται, «богопочитание» для θεοσέβεια, лишения в пище и питье для κακῶς πάσχουσα περὶ βρωμάτων καὶ πομάτων и «предназначение» для τάξις. Сноски удалены, поскольку они отражали лишь предварительный характер английского свидетельства и не требуются после сверки с греческим текстом.
