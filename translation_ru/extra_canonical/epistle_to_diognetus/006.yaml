base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: ru
  text: 'Одним словом: что душа в теле, то христиане в мире.


    Душа рассеяна по всем членам тела, а христиане — по разным городам мира.


    Душа обитает в теле, но не от тела. Так и христиане обитают в мире, но они не от мира.


    Невидимая душа пребывает под охраной в видимом теле. Так и христиан знают как пребывающих в мире, однако их богопочитание остаётся невидимым.


    Плоть ненавидит душу и воюет против неё, хотя душа не причинила ей никакого зла, потому что не позволяет плоти предаваться удовольствиям. Так и мир ненавидит христиан, хотя не претерпел от них никакого зла, потому что они противятся его удовольствиям.


    Душа любит ненавидящую её плоть и её члены. Так и христиане любят тех, кто их ненавидит.


    Душа заключена в теле, но сама поддерживает тело. Так и христиане содержатся в мире, словно в темнице, но сами поддерживают мир.


    Душа, хотя и бессмертна, обитает в смертном жилище. Так и христиане странствуют среди тленного, ожидая нетления, которое на небесах.


    Душа становится лучше, терпя лишения в пище и питье. Так и христиане, подвергаясь наказаниям, день ото дня всё более умножаются.


    Столь велико предназначение, которое Бог определил для них, и оставить его им не дозволено.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: religion (Greek source review pending; witness rendering)
  choice: благочестие
  rationale: В контексте невидимой внутренней жизни «благочестие» звучит естественнее и исторически уместнее, чем современное институциональное «религия», не сводя мысль к обрядам.
- source_word: mortal tabernacle
  choice: смертное жилище
  rationale: Сохраняет образ временного обитания, но избегает архаичного и потенциально узкого слова «скиния» при отсутствии прямой проверки греческого текста.
- source_word: sojourn
  choice: странствуют
  rationale: Передаёт временность пребывания и положение пришельцев, сохраняя возвышенный, но понятный регистр.
- source_word: imperishability
  choice: нетление
  rationale: Устоявшийся богословский эквивалент, сохраняющий противопоставление тленному без излишнего истолкования.
- source_word: office / role
  choice: служение
  rationale: Передаёт назначенную Богом обязанность и функцию естественнее, чем «должность» или абстрактная «роль».
- source_word: increase
  choice: умножаются
  rationale: Сохраняет вероятный смысл численного роста христиан под гонениями, при этом формулировка не добавляет причинного объяснения.
theological_decisions:
- issue: «Не от мира»
  choice: Сохранена формула «они не от мира»
  alternative: «не принадлежат миру»
  rationale: Более формальная формулировка сохраняет возможную библейскую аллюзию и онтологически-нравственную напряжённость, не сводя её только к принадлежности.
- issue: Христиане «поддерживают мир»
  choice: Образ оставлен без поясняющего смягчения
  alternative: «содействуют сохранению мира»
  rationale: Авторская аналогия намеренно сильна; пояснение внесло бы дополнительную доктрину о способе такого поддержания.
- issue: Бессмертие души
  choice: Сохранено как часть авторской аналогии
  alternative: Перефразировать как надежду на бессмертие
  rationale: Текст прямо строит довод на бессмертии души; перевод не должен исправлять или согласовывать это утверждение с позднейшими конфессиональными системами.
- issue: Невидимость благочестия
  choice: «благочестие остаётся невидимым»
  alternative: «вера остаётся невидимой»
  rationale: «Вера» сузила бы значение до внутреннего убеждения, тогда как свидетель подразумевает более широкую религиозную жизнь.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены параллельная композиция и повтор «Так и», связывающий каждую черту души с положением христиан. Архаизмы сведены к минимуму; термины «плоть», «нетление» и формула «не от мира» сохранены ради смысловых и библейских связей. Поскольку предоставленная база является английским публично-доменным свидетельством, а прямая сверка с древнегреческим текстом ещё не выполнена, спорные места отмечены осторожно и без ложной уверенности.
