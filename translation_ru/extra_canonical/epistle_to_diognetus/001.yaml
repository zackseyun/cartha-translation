source:
  text: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
  text_scope: public_domain_english_witness
  manuscript: Codex Argentoratensis (lost; known through copies)
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xv.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: ru
  text: 'Досточтимый Диогнет! Я вижу, как сильно ты желаешь понять веру христиан и как ясно и тщательно ставишь вопросы о них: на какого Бога они уповают и как Ему поклоняются; почему все они не дорожат миром и презирают смерть; почему не признают тех, кого греки считают богами, и не соблюдают иудейских суеверий; какова та любовь, которую они питают друг к другу; и почему это новое явление, или стремление, вошло в жизнь людей именно теперь, а не прежде.[a] Я с радостью приветствую твоё усердие и прошу Бога, дающего нам и способность говорить, и способность слышать, даровать мне говорить так, чтобы услышанное сделало тебя лучше, а тебе — слушать так, чтобы я, говорящий, не оказался разочарован.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод выполнен по представленному английскому свидетельству; непосредственная сверка с древнегреческим текстом ещё требуется. Выражение, переданное как «новое явление, или стремление», в данном свидетельстве допускает более одного понимания.
    reason: Исходные данные прямо указывают, что проверка по древнегреческому источнику ещё не проведена; особенно неустойчиво выражение «new development or interest».
lexical_decisions:
- source_word: most excellent
  choice: досточтимый
  rationale: Передаёт почтительное обращение естественным и достойным современным русским языком, без излишне административного оттенка слова «превосходнейший».
- source_word: religion of the Christians
  choice: вера христиан
  rationale: В данном контексте речь идёт о том, на какого Бога христиане уповают и как поклоняются; «вера» звучит естественно, сохраняя религиозный смысл.
- source_word: trust
  choice: уповают
  rationale: Сохраняет личностный смысл доверия Богу, а не только признания Его существования.
- source_word: disregard the world
  choice: не дорожат миром
  rationale: Передаёт непривязанность к миру, не утверждая полного безразличия ко всему творению или людям.
- source_word: take no account of
  choice: не признают
  rationale: В контексте мнимых богов означает отказ признавать их божественный статус.
- source_word: affection
  choice: любовь
  rationale: Естественное русское обозначение взаимного отношения христиан; более уместно, чем ослабленные «привязанность» или «расположение».
- source_word: new development or interest
  choice: новое явление, или стремление
  rationale: Сохраняет неуверенность английского свидетеля относительно точного смысла, не сводя выражение лишь к учению, обычаю или движению.
- source_word: supplieth both the speaking and the hearing
  choice: дающего нам и способность говорить, и способность слышать
  rationale: Ясно выражает, что Бог наделяет обе стороны необходимой способностью, избегая неестественного буквального оборота.
theological_decisions:
- issue: Отношение христиан к миру
  choice: не дорожат миром
  alternative: презирают мир
  rationale: Выбранный вариант сохраняет идею непривязанности и не усиливает её до богословского утверждения о презрении к Божьему творению.
- issue: Оценка иудейских практик
  choice: не соблюдают иудейских суеверий
  alternative: не соблюдают суеверия иудеев
  rationale: Следует данному древнему христианскому свидетельству, но не расширяет полемику до осуждения иудеев как народа или всей иудейской веры.
- issue: Действие услышанного на Диогнета
  choice: чтобы услышанное сделало тебя лучше
  alternative: чтобы ты стал лучше благодаря слушанию
  rationale: Сохраняет нравственно-преобразующий смысл, не уточняя его конфессионально или доктринально.
- issue: Происхождение речи и слышания
  choice: Бог даёт способность говорить и слышать
  alternative: Бог даёт само говорение и слышание
  rationale: Передаёт зависимость автора и слушателя от Бога, не вводя более специального учения о вдохновении.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Сохранено обращение на «ты», соответствующее единственному адресату и стилю древнего письма. Длинный перечень упорядочен пунктуационно, но риторическое течение исходного абзаца сохранено. Полемические формулировки не смягчены до исчезновения, однако и не усилены сверх представленного свидетельства.
