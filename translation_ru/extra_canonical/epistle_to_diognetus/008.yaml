base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: ru
  text: '**Послание к Диогнету, 8**


    Ибо кто из людей вообще знал, каков Бог, прежде чем Он пришёл?


    Или ты принимаешь пустые и бессмысленные рассуждения этих мнящих о себе философов? Одни из них утверждали, что Бог — огонь (они называют Богом то, куда им самим предстоит отправиться), другие — что Он вода, а третьи — что Он какая-либо иная из стихий, сотворённых Богом.


    Но если хоть одно из этих рассуждений заслуживает признания, тогда с таким же основанием можно объявить богом и любое другое творение.


    Нет, всё это — шарлатанство и обман чародеев.


    Никто из людей не видел и не познал Его, но Он Сам явил Себя.


    А явил Он Себя через веру, ибо лишь через неё дано увидеть Бога.


    Ведь Бог, Владыка и Создатель всего, сотворивший всё и приведший всё в порядок, оказался не только человеколюбивым, но и долготерпеливым.


    Таким Он был всегда, есть и будет: милостивым, благим, не гневливым[a] и истинным. Он один благ.


    Замыслив великий и неизреченный замысел, Он доверил его одному лишь Своему Сыну[b].


    Пока Он хранил Своё мудрое решение в тайне и оберегал его, казалось, будто Он пренебрегает нами и не заботится о нас.


    Но когда Он открыл его через Своего возлюбленного Сына[b] и явил то, что приготовил от начала, Он даровал нам всё сразу: и участие в Его благодеяниях, и способность видеть и понимать то, чего никто из нас никогда не мог ожидать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подверженным гневу». Здесь говорится не об эмоциональной холодности Бога, а об отсутствии гневливости.'
    reason: Предотвращает ложное понимание традиционного перевода «бесстрастный».
  - marker: b
    text: Слово, переданное как «Сын», может также означать «Дитя», «Отрок» или «Слуга»; в данном контексте оно относится к возлюбленному Посланнику Бога.
    reason: Сохраняет лексическую и христологическую неоднозначность исходного обозначения, не навязывая единственного оттенка.
lexical_decisions:
- source_word: ἀόργητος (reflected in the witness as “dispassionate”)
  choice: не гневливый
  rationale: Передаёт отсутствие гневливости точнее и естественнее, чем двусмысленное «бесстрастный», которое в современном русском может означать эмоциональную холодность.
- source_word: φιλάνθρωπος / “friendly to men”
  choice: человеколюбивый
  rationale: Традиционное и ясное русское слово, выражающее благосклонность Бога к людям, а не просто дружелюбие.
- source_word: μακρόθυμος / “long-suffering”
  choice: долготерпеливый
  rationale: Сохраняет раннехристианский нравственно-богословский оттенок терпеливого снисхождения.
- source_word: στοιχεῖα / “elements”
  choice: стихии
  rationale: В контексте античной философии речь идёт о первоэлементах мира; «стихии» естественно передаёт этот смысл.
- source_word: γοήτων / “magicians”
  choice: чародеев
  rationale: Сохраняет отрицательный оттенок обманного магического искусства и сочетается с «шарлатанством и обманом».
- source_word: βουλή / “design”
  choice: решение
  rationale: В данном предложении обозначает мудрое намерение или совет Божий; «решение» позволяет избежать неестественного повтора слова «замысел».
- source_word: εὐεργεσίαι / “benefits”
  choice: благодеяния
  rationale: Передаёт конкретные благие дары и действия, не подменяя их более узким термином «благодать».
theological_decisions:
- issue: Посредство веры в явлении и видении Бога
  choice: «явил Он Себя через веру, ибо лишь через неё дано увидеть Бога»
  alternative: «явил Себя в вере»
  rationale: «Через веру» сохраняет инструментальное значение свидетельства, не объясняя сверх текста природу этого видения.
- issue: Обозначение Божьего Посланника
  choice: Сын
  alternative: Отрок / Слуга / Дитя
  rationale: Контекст и консультационный английский свидетель понимают обозначение как «Son». При этом исходное греческое наименование, обычно передаваемое словом παῖς, допускает более одного родственного и служебного оттенка; неоднозначность отмечена в сноске.
- issue: Кажущееся Божье пренебрежение
  choice: «казалось, будто Он пренебрегает нами и не заботится о нас»
  alternative: «Он пренебрегал нами и не заботился о нас»
  rationale: Сохраняется явное различие между человеческим впечатлением и утверждением о действительном характере Бога.
- issue: Добавленное в английском свидетеле слово “mysteries”
  choice: Не добавлять «тайны» в последней фразе
  alternative: «видеть и понимать тайны»
  rationale: В английском свидетеле слово стоит в редакционных скобках и не требуется синтаксисом; русский текст сохраняет открытый объект «то, чего…».
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианской апологетики. Риторические вопросы и резкие полемические формулировки сохранены, но синтаксис сделан понятным современному читателю. Д draft является предварительным: предоставленное основание — публичный английский свидетель, а прямая сверка с греческим источником в метаданных ещё не завершена.'
