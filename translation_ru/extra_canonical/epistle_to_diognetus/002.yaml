  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are servants; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: ru
  text: 'Итак, очисти свой ум от всех укоренившихся в нём предубеждений, отбрось привычку, которая вводит тебя в заблуждение, и стань как бы новым человеком, готовым с самого начала выслушать новое повествование, как ты и сам признался. Посмотри не только глазами, но и разумом: из какого вещества и какого вида те, кого вы называете и почитаете богами?


    Разве один из них не камень, подобный тому, что мы попираем ногами; другой — бронза, ничем не лучше утвари, которую куют для наших нужд; третий — дерево, уже успевшее сгнить; иной — серебро, которое приходится стеречь, чтобы его не украли; иной — железо, разъедаемое ржавчиной; а иной — глина, ничуть не красивее посуды, предназначенной для самого постыдного употребления?[a]


    Разве всё это не из тленного материала? Разве не орудиями из железа и огнём придали им форму? Разве одного не сделал ваятель, другого — литейщик, третьего — серебряных дел мастер, четвёртого — гончар? Прежде чем ремесло этих мастеров придало им нынешний облик, разве нельзя было каждому из них придать иную форму и сделать похожим на разную утварь? И разве сосуды, ныне сделанные из того же материала, попав к тем же мастерам, не могли бы стать похожими на этих богов?


    Разве то, чему вы теперь поклоняетесь, человеческие руки не могли бы снова превратить в такую же утварь, как и вся прочая? Разве все они не глухи и не слепы, не бездушны, не бесчувственны и не неподвижны? Разве не гниют и не разрушаются?


    Вот что вы называете богами; им служите, им поклоняетесь — и в конце концов становитесь во всём подобны им.


    Потому вы и ненавидите христиан, что они не считают всё это богами.


    Но разве не вы сами, почитающие их и поклоняющиеся им, выказываете к ним ещё больше презрения? Разве не насмехаетесь над ними и не оскорбляете их, оставляя каменных и глиняных без охраны, а серебряных и золотых запирая на ночь и днём приставляя к ним стражу, чтобы их не украли?


    Что же до почестей, которые вы, как вам кажется, им оказываете: если они способны их ощущать, то этими почестями вы скорее причиняете им мучение; если же они ничего не ощущают, то вы изобличаете их бессилие, пытаясь умилостивить их кровью и жиром жертвенных животных.


    Пусть кто-нибудь из вас подвергнется такому обращению, пусть позволит делать с собой всё это. Но нет: ни один человек не согласится добровольно терпеть такую муку, потому что наделён чувствами и разумом. Камень же терпит, потому что ничего не чувствует. Тем самым вы доказываете, что он способен чувствовать.[b]


    Я мог бы сказать ещё многое о том, почему христиане не служат таким богам. Но если кому-то сказанного недостаточно, то продолжать я считаю излишним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть посуды для низкого, бесчестного употребления; вероятно, имеются в виду самые нечистые бытовые нужды.
    reason: Фраза намеренно эвфемистична и допускает более конкретное понимание, которое не следует безоговорочно вносить в основной текст.
  - marker: b
    text: 'Буквальный смысл доступного английского свидетельства здесь парадоксален: после утверждения, что камень бесчувствен, сказано: «тем самым вы доказываете его способность чувствовать». Возможно, текст испорчен либо передан неточно; до сверки с греческим чтение сохранено без молчаливого исправления.'
    reason: Необходимо явно сохранить текстологическую и смысловую трудность, отмеченную также консультационным слоем.
lexical_decisions:
- source_word: prepossessions
  choice: предубеждения
  rationale: Передаёт заранее сложившиеся установки ума естественным современным русским словом.
- source_word: habit
  choice: привычка
  rationale: Сохранён образ усвоенного образа мысли или поведения, ведущего в заблуждение.
- source_word: substance / form
  choice: вещество / вид
  rationale: Сохраняется предметный аргумент автора о материале и внешнем облике идолов.
- source_word: earthenware
  choice: глина / глиняные
  rationale: В данном перечислении речь идёт о материале идола; в сравнении с утварью употреблено слово «посуда».
- source_word: soul-less, senseless, motionless
  choice: бездушны, бесчувственны и неподвижны
  rationale: Сохранена трёхчастная риторическая последовательность без богословского расширения значения «бездушны».
- source_word: slaves / enslaved
  choice: служите / не служат
  rationale: В русском контексте поклонения это звучит естественно; мотив подчинённости сохраняется, но избегается неуместно буквальное социальное прочтение.
- source_word: propitiating
  choice: умилостивить
  rationale: Передаёт попытку расположить божество жертвоприношением, не вводя поздней конфессиональной терминологии.
- source_word: victims
  choice: жертвенные животные
  rationale: Устраняет возможное современное понимание «жертв» как пострадавших людей и точно обозначает культовый контекст.
theological_decisions:
- issue: Статус языческих изображений
  choice: Сохранена авторская полемическая формула «кого вы называете и почитаете богами»
  alternative: Называть их исключительно «идолами» во всём отрывке
  rationale: Авторский довод построен на сопоставлении заявленного божественного статуса с тленной материей; преждевременная замена на «идолы» сняла бы часть риторического напряжения.
- issue: Финальная парадоксальная фраза о чувствительности камня
  choice: «Тем самым вы доказываете, что он способен чувствовать» с примечанием
  alternative: Исправить по смыслу на «доказываете, что он бесчувствен» или «обличаете его бесчувствие»
  rationale: Предоставленный свидетель содержит внутренне напряжённое чтение. Поскольку прямой обзор греческого источника ещё не выполнен, оно сохранено, а трудность обозначена, а не устранена догадкой.
- issue: Кровь и жир жертв
  choice: Сохранена культовая конкретика без дополнительной интерпретации
  alternative: Обобщить как «жертвоприношениями»
  rationale: Предметность выражения важна для аргумента о том, что предполагаемые почести были бы мучением для чувствующего существа.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской апологетики. Единственное обращение к Диогнету передано формой единственного числа («очисти», «посмотри»), а обобщённое обращение к почитателям богов — множественным числом («вы»), в соответствии со свидетельством. Риторические вопросы, параллелизм и нарастающий перечень сохранены. Проект остаётся предварительным, поскольку предоставлена английская рукописная опосредованная передача, а прямая сверка с греческим источником ожидается.
