lexical_decisions:
- source_word: full knowledge / ἐπίγνωσις (вероятная греческая лексема; прямая сверка ожидается)
  choice: познай Отца во всей полноте / полное познание
  rationale: Передаёт усиленное значение познания естественным современным русским языком, не сводя его лишь к интеллектуальной осведомлённости.
- source_word: only begotten Son
  choice: единородного Сына
  rationale: Точно сохраняет традиционный богословский термин и его связь с уникальным сыновством.
- source_word: becomes a God to those who receive
  choice: становится богом для тех, кто принимает
  rationale: Сохраняет смелую метафору свидетеля, не ослабляя её вставками вроде «как бы»; строчная буква отличает человека-благодетеля от Бога.
- source_word: apparent death / real death
  choice: кажущаяся смерть / подлинная смерть
  rationale: Сохраняет намеренное противопоставление двух видов смерти.
- source_word: fire that is for a season
  choice: недолгий огонь
  rationale: Естественно передаёт временность земного мучения в противопоставлении вечному огню.
theological_decisions:
- issue: Подражание Богу
  choice: Сохранено прямое утверждение, что человек может подражать Богу, если Бог этого желает.
  alternative: Сузить смысл до подражания только отдельным нравственным качествам.
  rationale: Свидетель формулирует мысль широко, а затем сам поясняет её делами милосердия; перевод не должен заранее сужать это напряжение.
- issue: Человек «становится богом» для получающих помощь
  choice: Метафора сохранена буквально со строчной буквы.
  alternative: «Становится подобным Богу» или «становится орудием Бога».
  rationale: Альтернативы разрешили бы или заменили богословски напряжённую формулировку исходного свидетельства.
- issue: «Вечный огонь» и наказание «до конца»
  choice: Оба выражения сохранены рядом без гармонизации.
  alternative: Истолковать «до конца» как «бесконечно» либо как указание на завершение наказания.
  rationale: Перевод сохраняет внутреннее смысловое напряжение и не навязывает конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Обращение на «ты» сохранено как личное и прямое, без архаических форм. Синтаксис длинных перечислений частично упорядочен ради ясности, но риторические повторы «тогда» сохранены. Проект основан на предоставленном публично-доступном английском свидетеле и консультационном слое POB; поскольку греческий текст не предоставлен и его прямая сверка обозначена как предстоящая, спорные места отмечены, а уверенность в деталях должна считаться предварительной.
