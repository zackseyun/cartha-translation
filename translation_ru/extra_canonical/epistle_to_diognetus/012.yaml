lexical_decisions:
- source_word: knowledge (Greek source review pending)
  choice: познание / знание
  rationale: В авторском рассуждении о дереве и жизненном познании употреблено более содержательное «познание»; в узнаваемой цитате 1 Кор 8:1 сохранено привычное «знание».
- source_word: charity
  choice: любовь
  rationale: 'Современное и точное обозначение ἀγάπη в цитате: не благотворительность, а любовь, которая созидает.'
- source_word: Paradise
  choice: рай
  rationale: Естественная русская библейская лексема; строчная буква соответствует обозначению сада, а не имени собственному.
- source_word: true reason
  choice: истинный разум
  rationale: Сохранена смысловая напряжённость между разумом, словом и разумением; перевод не отождествляет выражение без достаточных оснований с личным Словом в следующем абзаце.
- source_word: the Word
  choice: Слово
  rationale: Прописная буква сохраняет вероятное личное, христологическое употребление и связь с последующим «через Него».
- source_word: congregations
  choice: собрания
  rationale: Не навязывает более узкое институциональное значение «церкви» и сохраняет буквальный образ собираемых общин.
- source_word: Passover of the Lord
  choice: Пасха Господня
  rationale: Сохранена раннехристианская пасхальная формула без уточнения, идёт ли речь о празднике, событии или таинственном образе.
theological_decisions:
- issue: Связь познания и жизни
  choice: 'Сохранено взаимное утверждение: нет жизни без познания и здравого познания без истинной жизни.'
  alternative: Истолковать «познание» исключительно как вероучительную осведомлённость или исключительно как опыт общения с Богом.
  rationale: Текст намеренно удерживает познание и прожитую жизнь вместе и сам не сводит первое к одному узкому смыслу.
- issue: Причина смерти в рассказе о рае
  choice: «Убивает не дерево познания — убивает непослушание».
  alternative: Представить само познание или плод дерева источником смерти.
  rationale: Это явное богословское противопоставление автора, которое необходимо сохранить.
- issue: Высказывание о Еве
  choice: Трудная формулировка сохранена буквально и снабжена примечанием.
  alternative: Без пояснения заменить Еву Марией или истолковать Еву как Церковь.
  rationale: Такая гармонизация не подтверждена предоставленным свидетельством и устранила бы подлинную текстовую трудность.
- issue: «Слово радуется» и местоимения
  choice: 'Сохранено: Слово радуется; через Него прославляется Отец.'
  alternative: Перестроить фразу так, чтобы радовался учитель или святой, либо изменить адресата заключительного славословия.
  rationale: Русский текст следует синтаксису свидетельства и не снимает возможную неоднозначность повреждённого или трудного места.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Во втором лице множественного числа в начале сохранено обращение к слушателям, а далее — переход к единственному числу, присутствующий в свидетельстве. Архаизмы сведены к минимуму; библейски узнаваемые формулы («знание надмевает, а любовь созидает», «во веки веков») сохранены. Проект остаётся предварительным, поскольку предоставлена английская передача утраченной рукописи, а прямой анализ греческих копий ещё не выполнен.
