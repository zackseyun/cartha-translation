base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: ru
  text: 'Христиане не отличаются от остальных людей ни местом жительства, ни языком, ни обычаями.


    Они не живут в каких-то собственных городах, не пользуются особым языком и не ведут необычного образа жизни.


    Их учение не является изобретением, возникшим благодаря уму или изысканиям изобретательных людей; они не возглавляют какого-либо человеческого учения, как некоторые.


    Но они живут в греческих и варварских городах — кому где выпало — и следуют местным обычаям в одежде, пище и прочем устройстве жизни. Однако гражданский строй, который они являют, удивителен и, по общему признанию, противоречит ожиданиям.


    Они живут в своих странах, но как пришельцы; во всём участвуют как граждане, но все тяготы переносят как чужеземцы. Для них всякая чужая страна — отечество, и всякое отечество — чужая страна.


    Они вступают в брак, как и все, и рождают детей, но не бросают своих младенцев.[a]


    У них общий стол, но не общее ложе.[b]


    Они пребывают во плоти, но живут не по плоти.


    Они живут на земле, но их гражданство — на небесах.


    Они повинуются установленным законам, но своей жизнью превосходят законы.


    Они любят всех, и все их преследуют.


    Их не знают, но осуждают. Их предают смерти, но они обретают жизнь.


    Они бедны, но многих обогащают. Они во всём нуждаются, но всем изобилуют.


    Их бесчестят, но в самом бесчестии они прославляются. О них злословят, но они оправдываются.


    Их бранят, а они благословляют; их оскорбляют, а они воздают почтение.


    За добро их наказывают как злодеев; терпя наказание, они радуются, словно благодаря ему обретают жизнь.


    Иудеи ведут с ними борьбу как с чужаками, а греки их преследуют; но ненавидящие их не могут назвать причины своей вражды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт об известной в античном мире практике оставления нежеланных новорождённых на произвол судьбы.
    reason: Поясняет исторически обусловленный смысл выражения «не бросают своих младенцев», не добавляя к основному тексту подробностей.
  - marker: b
    text: '«Общее ложе» — образная антитеза «общему столу»: речь о совместной трапезе, но не о сексуальной общности.'
    reason: Сохраняет буквальную метафору исходного текста и кратко предотвращает неверное понимание формулы.
lexical_decisions:
- source_word: constitution of their own citizenship
  choice: образ гражданской жизни
  rationale: Передаёт общественно-политическую метафору без тяжеловесного буквального «устройство гражданства»; последующее «гражданство — на небесах» сохраняет ключевую терминологическую связь.
- source_word: barbarians
  choice: варварских
  rationale: Сохранён античный этнокультурный термин, обозначающий негрекоязычные народы, а не современную нравственную характеристику.
- source_word: sojourners
  choice: временные поселенцы
  rationale: Передаёт положение живущих в стране без полного укоренения и гражданской принадлежности.
- source_word: cast away their offspring
  choice: не бросают своих младенцев
  rationale: Фраза относится к античной практике оставления новорождённых; современное «бросают» понятно, а сноска уточняет исторический смысл.
- source_word: in the flesh / after the flesh
  choice: во плоти / не по плоти
  rationale: Сохранена намеренная раннехристианская антитеза и её богословская многозначность.
- source_word: citizenship
  choice: гражданство
  rationale: Сохраняет небесно-политическую метафору и возможный отзвук раннехристианской лексики.
- source_word: endued with life / quickened by life
  choice: обретают жизнь
  rationale: Естественная русская формулировка сохраняет парадокс смерти и жизни, не уточняя механизм оживления.
theological_decisions:
- issue: «Жить не по плоти»
  choice: Сохранить формулу без толкования
  alternative: «Не следуют плотским желаниям»
  rationale: Более разъяснительный вариант сузил бы значение до нравственной борьбы с желаниями, тогда как исходная антитеза допускает более широкий богословский смысл.
- issue: Земное и небесное гражданство
  choice: «их гражданство — на небесах»
  alternative: «их родина — небо»
  rationale: «Гражданство» удерживает политико-общественную метафору текста и не подменяет её более привычным образом родины.
- issue: Жизнь через смерть и наказание
  choice: «обретают жизнь»
  alternative: «Бог возвращает их к жизни»
  rationale: Не добавлен явно не названный субъект действия; сохранена риторическая и богословская напряжённость исходного парадокса.
- issue: Всеобщность «любят всех / все преследуют»
  choice: Сохранить риторическое «всех / все»
  alternative: «любят людей / многие их преследуют»
  rationale: Гиперболическая симметрия является существенной частью авторского стиля и аргумента.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской апологии. Сохранены короткие параллельные фразы, антитезы и парадоксы главы. Архаизмы сведены к богословски значимому слову «плоть»; термин «варварские» сохранён как исторический. Поскольку прямой анализ греческого текста ещё не предоставлен, draft осторожно опирается на публичное английское свидетельство и отмечает места, особенно нуждающиеся в последующей сверке с древнегреческим текстом.
