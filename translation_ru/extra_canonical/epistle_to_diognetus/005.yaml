revisions:
- from: 'Христиане не отличаются от остальных людей ни местом жительства, ни языком, ни обычаями.


    Они не живут в каких-то собственных городах, не пользуются особым языком и не ведут необычного образа жизни.


    Их учение не является изобретением, возникшим благодаря уму или изысканиям изобретательных людей; они не придерживаются какого-либо человеческого учения, как некоторые.


    Но они живут в греческих и варварских городах — кому где выпало — и следуют местным обычаям в одежде, пище и прочем устройстве жизни. Однако являемый ими образ гражданской жизни удивителен и, по общему признанию, не соответствует ожиданиям.


    Они живут в своих странах, но как временные поселенцы; участвуют во всём как граждане, но все тяготы переносят как чужеземцы. Для них всякая чужая страна — отечество, и всякое отечество — чужая страна.


    Они вступают в брак, как и все, и рождают детей, но не бросают своих младенцев.[a]


    У них общий стол, но не общие жёны.[b]


    Они пребывают во плоти, но живут не по плоти.


    Они живут на земле, но их гражданство — на небесах.


    Они повинуются установленным законам, но своей жизнью превосходят требования законов.


    Они любят всех, и все их преследуют.


    Их не знают, но осуждают. Их предают смерти, но они обретают жизнь.


    Они бедны, но многих обогащают. Они во всём нуждаются, но всем изобилуют.


    Их бесчестят, но в самом бесчестии они прославляются. О них злословят, но они оказываются правы.


    Их бранят, а они благословляют; их оскорбляют, а они отвечают почтением.


    За добро их наказывают как злодеев; терпя наказание, они радуются, словно благодаря ему обретают жизнь.


    Иудеи ведут с ними борьбу как с чужаками, а греки их преследуют; но ненавидящие их не могут назвать причины своей вражды.'
