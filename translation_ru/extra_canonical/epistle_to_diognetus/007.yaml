- from: 'Ведь, как я уже говорил, им было вверено не земное открытие. Не о том они заботятся, чтобы столь бережно хранить какое-либо смертное изобретение, и не распоряжение человеческими таинствами им доверено.


    Но Сам Вседержитель, Творец всего, невидимый Бог, ниспослал с небес людям истину и святое учение, превосходящее человеческое разумение, и прочно утвердил их в сердцах. Он сделал это не так, как можно было бы подумать: послав людям кого-то из подчинённых, или ангела, или правителя, или кого-то из управляющих земными делами, или кого-то из тех, кому вверено управление на небесах. Нет, Он послал Самого Устроителя и Творца всего — Того, через Кого сотворил небеса, через Кого заключил море в назначенных ему пределах; Того, Чьи тайны верно хранят все стихии; от Кого «солнце»[a] получило меру дневного пути, чтобы её соблюдать; Кому повинуется луна, когда Он велит ей светить ночью; Кому повинуются звёзды, следуя за луной по её пути; Того, через Кого всё устроено, ограничено и подчинено: небеса и всё, что на небесах, земля и всё, что на земле, море и всё, что в море, огонь, воздух, бездна, всё, что в вышине, всё, что в глубине, и всё, что между ними. Его Он послал к ним.


    Неужели Он был послан, как кто-нибудь мог бы предположить, чтобы установить господство, внушить страх и ужас?


