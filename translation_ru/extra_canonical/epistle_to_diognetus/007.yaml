  rationale: 'Внесены только безопасные смысловые и стилистические правки: устранены неуместные русские коннотации «таинств» и «снисходительности», восстановлено прямое противопоставление убеждения и насилия, а также сглажены две синтаксически тяжёлые фразы. Скобочные реконструкции, лакуна, повтор «Он послал Его», двусмысленность παρουσία и богословская напряжённость между нынешним несудящим посланием и будущим судом сохранены.'
