base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: ru
  text: 'Ведь, как я уже говорил, им было вверено не земное открытие. Они не заботятся столь тщательно хранить какое бы то ни было изобретение смертных, и им не вверено управление человеческими тайнами.


    Но Сам Вседержитель, Творец всего, невидимый Бог, насадил с небес среди людей истину и святое учение, превосходящее человеческое разумение, и прочно утвердил их в их сердцах. И сделал Он это не так, как можно было бы подумать: послав людям кого-то из подчинённых, или ангела, или правителя, или кого-то из управляющих земными делами, или кого-то из тех, кому вверено управление на небесах. Нет, Он послал Самого Устроителя и Творца всего — Того, через Кого сотворил небеса, через Кого заключил море в назначенных ему пределах; Того, Чьи тайны верно хранят все стихии; от Кого «солнце»[a] получило меру дневного пути, чтобы её соблюдать; Кому повинуется луна, когда Он велит ей светить ночью; Кому повинуются звёзды, следуя за луной по её пути; Того, через Кого всё устроено, ограничено и подчинено: небеса и всё, что на небесах, земля и всё, что на земле, море и всё, что в море, огонь, воздух, бездна, всё, что в вышине, всё, что в глубине, и всё, что между ними. Его Он послал к ним.


    Неужели Он был послан, как кто-нибудь мог бы предположить, чтобы установить господство, внушить страх и ужас?


    Ничуть. Он послал Его в кротости «и»[b] мягкости — как царь посылает своего сына, который сам царь. Он послал Его как Бога; послал Его как «человека» к людям[c]; послал Его как Спасителя — убеждением, а не насилием, ибо насилие Богу не свойственно.


    Он послал Его призывать, а не преследовать; любя, а не судя.


    Но Он ещё пошлёт Его судить — и кто выдержит Его явление?[d]


    …[e] Разве ты не видишь, как их бросают зверям, чтобы они отреклись от Господа, — и всё же их не одолевают?


    Разве ты не видишь: чем больше их наказывают, тем больше становится других?


    Это не похоже на дела человеческие. Это сила Божья; это свидетельства Его присутствия.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «солнце» восполняется издателями по смыслу повреждённого места.
    reason: Сохраняет сигнал текстуальной реконструкции, отмеченный в свидетельстве квадратными скобками.
  - marker: b
    text: Союз «и» в выражении «в кротости и мягкости» является текстуальным восполнением в используемом свидетельстве.
    reason: Не скрывает редакционное восстановление связки.
  - marker: c
    text: 'Слово «человека» восполнено по смыслу: буквально конструкция допускает более краткое «послал к людям».'
    reason: Сохраняет текстуальную неопределённость и не превращает восстановление в бесспорное чтение.
  - marker: d
    text: В обоих местах употреблено одно греческое слово παρουσία, которое может означать «присутствие», «явление» или «пришествие».
    reason: Показывает намеренную лексическую связь между будущим судом и видимым в мучениках действием Бога, не навязывая одного значения обоим контекстам.
  - marker: e
    text: Перед этими словами в рукописной традиции имеется утрата текста; начало вопроса восстановлено по сохранившемуся продолжению.
    reason: Многоточие и пояснение обозначают лакуну, а не обычный авторский переход.
lexical_decisions:
- source_word: εὕρημα
  choice: открытие
  rationale: Передаёт не просто созданную вещь, а найденное или изобретённое учение; последующее «изобретение» сохраняет смысловой диапазон контекста.
- source_word: οἰκονομία
  choice: распоряжение / управление
  rationale: В первом случае относится к человеческим таинствам, во втором — к небесной сфере; русские соответствия выбраны по ближайшему контексту без поздней конфессиональной нагрузки.
- source_word: τεχνίτης καὶ δημιουργός
  choice: Устроитель и Творец
  rationale: 'Сохраняет два близких, но не тождественных наименования: искусного устроителя и создателя всего.'
- source_word: ἐπιείκεια
  choice: снисходительность
  rationale: Передаёт мягкость и незлобивую умеренность; не сводит слово только к современному юридическому значению «справедливость».
- source_word: βία
  choice: принуждение
  rationale: В данном противопоставлении убеждению естественнее русского «насилие» и охватывает применение силы для навязывания воли.
- source_word: παρουσία
  choice: явление / присутствие
  rationale: Греческое слово допускает оба оттенка. В эсхатологической фразе естественно «явление», а в заключении — «присутствие»; общая сноска сохраняет их лексическую связь.
theological_decisions:
- issue: Кого Бог послал
  choice: Сохранены различение Посылающего и Посланного и повторяющееся местоимение «Его» без добавления имени или поздней догматической формулы.
  alternative: Прямо назвать Посланного Сыном Божьим или Христом во всех предложениях.
  rationale: Сам отрывок называет Его царским Сыном и Богом, но в этой цепи использует местоимения; экспликация устранила бы риторическую и богословскую напряжённость текста.
- issue: «Послал как Бога»
  choice: Сохранена прямая формулировка «послал Его как Бога».
  alternative: Ослабить до «послал как божественного посланника» или усилить поясняющей догматической формулой.
  rationale: Обе альтернативы выходят за пределы исходной формулировки.
- issue: Суд сейчас и в будущем
  choice: 'Сохранено противопоставление: ныне послан «любя, а не судя», но впоследствии будет послан судить.'
  alternative: Истолковать «не судя» как «не осуждая» либо гармонизировать обе фразы пояснением.
  rationale: Авторская временная и богословская напряжённость должна оставаться явной.
- issue: Божественная сила и мученичество
  choice: Финальные утверждения переданы как авторский вывод, без уточнения механизма или конфессиональной трактовки.
  alternative: Объяснить умножение христиан как чудо обращения или действие благодати.
  rationale: Такие пояснения возможны, но отсутствуют в самом тексте.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным синтаксисом. Риторические повторы «Он послал Его» и вопросы сохранены как несущие структуру главы. Архаизмы избегались, кроме уместного традиционного наименования «Вседержитель». Проект сверен прежде всего с доступными формами греческого текста, однако предоставленные метаданные предупреждают, что полноценная прямая проверка по исходному языку ещё не завершена; поэтому сигналы реконструкций и лакуны сохранены явно.
