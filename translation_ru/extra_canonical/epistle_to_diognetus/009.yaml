  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: ru
  text: 'Заранее замыслив всё в Своём уме вместе со Своим Сыном, Бог в прежнее время позволил нам по собственной воле увлекаться беспорядочными порывами, сбиваясь с пути из-за наслаждений и страстей. И это вовсе не потому, что Он радовался нашим грехам, но потому, что терпел нас; не потому, что Он одобрял минувшее время беззакония, но потому, что готовил нынешнее время праведности. Так, чтобы мы, прежде собственными делами обличённые как недостойные жизни, теперь были удостоены её по благости Божьей; и чтобы, когда стала явной наша неспособность своими силами войти в Царство Божье, мы получили эту возможность силой Бога.


    Когда же наше беззаконие достигло полноты и стало совершенно ясно, что воздаянием за него должны стать наказание и смерть, настало определённое Богом время явить Его благость и силу. О безмерная доброта и любовь Бога! Он не возненавидел нас, не отверг и не затаил на нас зла, но долготерпел и сносил нас. Сжалившись над нами, Он принял на Себя наши грехи и Сам отдал Своего Сына как выкуп за нас: Святого — за беззаконных, Невинного — за злых, Праведного — за неправедных, Нетленного — за тленных, Бессмертного — за смертных.


    Ибо что иное, кроме Его праведности, могло покрыть наши грехи?


    В ком могли мы, беззаконные и нечестивые, получить оправдание, если не в одном лишь Сыне Божьем?


    О сладостный обмен! О непостижимое устроение![a] О неожиданные благодеяния! Беззаконие многих сокрыто в одном Праведнике, а праведность Одного оправдывает многих беззаконных!


    Итак, прежде показав неспособность нашей природы обрести жизнь, а теперь явив Спасителя, способного спасти даже бессильные создания, Бог пожелал, чтобы по обеим этим причинам мы верили в Его благость и считали Его нашим кормильцем,[b] Отцом, Учителем, Советником, Врачом, Умом, Светом, Честью, Славой, Силой и Жизнью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Непостижимое устроение» передаёт греч. δημιουργία — слово, которое может означать Божье деяние, творческое действие или устроение. Возможны также передачи: «непостижимое дело» и «непостижимое созидание».'
    reason: Сохраняет смысловую широту необычного выражения и не сводит его к одному богословскому толкованию.
  - marker: b
    text: «Кормилец» — Тот, кто питает, взращивает и заботится; это передаёт образ Бога как попечителя и воспитателя.
    reason: Поясняет менее частотное современное именование и сохраняет образ τροφεύς.
lexical_decisions:
- source_word: planned everything already in His mind with His Son
  choice: заранее замыслив всё в Своём уме вместе со Своим Сыном
  rationale: Сохраняет совместность замысла Отца и Сына и не превращает «ум» в более отвлечённый «совет».
- source_word: made deserving
  choice: были удостоены её
  rationale: Передаёт получение достоинства по Божьей благости, а местоимение «её» естественно связывает выражение с жизнью.
- source_word: took upon Himself our sins
  choice: принял на Себя наши грехи
  rationale: Сохраняет сильную и богословски напряжённую формулировку свидетельства, не подменяя её более узким толкованием вроде «понёс наказание».
- source_word: ransom
  choice: выкуп
  rationale: Современное и понятное соответствие образу освобождения за уплаченную цену.
- source_word: sweet exchange
  choice: сладостный обмен
  rationale: Сохраняет образ и риторическую выразительность раннехристианского текста; «сладостный» уместнее в возвышенном регистре, чем разговорное «приятный».
- source_word: inscrutable creation
  choice: непостижимое созидание
  rationale: Формально сохраняет засвидетельствованное значение «creation», не разрешая возможную смысловую широту в пользу определённой богословской схемы.
- source_word: nurse
  choice: кормилец
  rationale: Передаёт заботящегося и питающего; слово понятно современному читателю и лучше согласуется с последующим мужским рядом именований.
- source_word: mind
  choice: Ум
  rationale: Сохранён необычный метафорический титул без истолковывающего расширения.
theological_decisions:
- issue: Субъект действий «принял на Себя наши грехи» и «отдал Своего Сына»
  choice: Сохранить единый субъект — Бога, как в предоставленном свидетельстве
  alternative: Переформулировать первое действие как относящееся ко Христу
  rationale: Предоставленный текст грамматически приписывает оба действия одному субъекту. Перенос первого действия на Сына молча устранил бы подлинное богословское напряжение.
- issue: Оправдание и праведность Одного
  choice: «получить оправдание» и «праведность Одного оправдывает»
  alternative: «стать праведными» или «сделать праведными»
  rationale: Формулировка сохраняет судебно-декларативный оттенок свидетельства, не отрицая возможной преобразующей стороны и не навязывая конфессионального определения механизма оправдания.
- issue: Способность войти в Царство Божье
  choice: «получили эту возможность силой Бога»
  alternative: «стали способными благодаря Божьей силе»
  rationale: Сохранена антитеза человеческой неспособности и Божьей силы без утверждения частной доктрины о порядке или способе действия благодати.
- issue: «Беззаконие многих сокрыто в одном Праведнике»
  choice: Сохранить образ сокрытия
  alternative: «возложено на одного Праведника» или «искуплено одним Праведником»
  rationale: Замена истолковала бы образ и внесла бы отсутствующий в данном свидетельстве механизм искупления.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и риторической приподнятостью, соответствующей апологетическому тексту II века. Параллелизмы, антитезы и восклицания сохранены. Заглавные буквы в ряду «Святого… Бессмертного» и заключительных именованиях подчёркивают личное отнесение к Богу и Сыну. Проект предварительный: Codex Argentoratensis утрачен и известен по копиям; предоставленная база — публично-доменное английское свидетельство, поэтому необходима последующая прямая сверка с доступной реконструкцией греческого текста.'
