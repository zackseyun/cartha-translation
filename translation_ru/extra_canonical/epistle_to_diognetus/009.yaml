review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт аргументацию и риторический строй главы. Однако несколько мест требуют уточнения по греческому тексту: ἀνεξιχνίαστος δημιουργία естественнее передавать как «непостижимое устроение» (с примечанием о диапазоне значения), κτίσματα ἀδύνατα не следует сужать до просто «тех, кто сам бессилен», а сочетание μακροθυμήσας καὶ ἀνεξόμενος лучше передать без тавтологии «был долготерпелив и терпел».'
  naturalness: Русский текст в целом литературен и выдержан в возвышенном регистре. «Непостижимое созидание» звучит неестественно и недостаточно ясно в данном контексте; «непостижимое устроение» сохраняет высокий стиль и лучше соответствует смыслу. «Счита́ли Его» в завершающем перечне естественнее, чем «почитали Его своим», поскольку не вводит оттенок культового почитания, отсутствующий в глаголе ἡγέομαι.
  terminology: «Выкуп», «оправдание», «Праведник», «Царство Божье» и антитетический ряд «Святого — за беззаконных» сохранены удачно. «Кормилец» допустим для τροφεύς, но в современном употреблении может восприниматься слишком узко; примечание должно явно включать значение воспитания и попечения. «Устроение» для δημιουργία не навязывает частную теологическую модель и сохраняет образ Божьего деяния/устроения.
  issues:
  - severity: medium
    issue: «Непостижимое созидание»
    rationale: Греческое ἀνεξιχνίαστος δημιουργία имеет широкий смысл непостижимого Божьего деяния, устроения или действия. «Созидание» в русском звучит искусственно и может неоправданно ограничить выражение актом творения.
  - severity: medium
    issue: «даже тех, кто сам бессилен»
    rationale: В исходнике употреблено κτίσματα («создания», «творения»), а не нейтральное обозначение людей. Это слово следует сохранить, насколько позволяет русский язык.
  - severity: low
    issue: «был долготерпелив и терпел нас»
    rationale: Передача двух близких греческих глаголов допустима, но в русском создаёт неудачную лексическую тавтологию. «Долготерпел и сносил нас» различает оттенки.
  - severity: low
    issue: «почитали Его своим кормильцем»
    rationale: ἡγώμεθα означает прежде всего «считали, признавали». «Почитали» добавляет возможный культовый оттенок; «считали Его нашим кормильцем» точнее и естественнее.
  revised_text: 'Заранее замыслив всё в Своём уме вместе со Своим Сыном, Бог в прежнее время позволил нам по собственной воле увлекаться беспорядочными порывами, сбиваясь с пути из-за наслаждений и страстей. И это вовсе не потому, что Он радовался нашим грехам, но потому, что терпел нас; не потому, что Он одобрял минувшее время беззакония, но потому, что готовил нынешнее время праведности. Так, чтобы мы, прежде собственными делами обличённые как недостойные жизни, теперь были удостоены её по благости Божьей; и чтобы, когда стала явной наша неспособность своими силами войти в Царство Божье, мы получили эту возможность силой Бога.


    Когда же наше беззаконие достигло полноты и стало совершенно ясно, что воздаянием за него должны стать наказание и смерть, настало определённое Богом время явить Его благость и силу. О безмерная доброта и любовь Бога! Он не возненавидел нас, не отверг и не затаил на нас зла, но долготерпел и сносил нас. Сжалившись над нами, Он принял на Себя наши грехи и Сам отдал Своего Сына как выкуп за нас: Святого — за беззаконных, Невинного — за злых, Праведного — за неправедных, Нетленного — за тленных, Бессмертного — за смертных.


    Ибо что иное, кроме Его праведности, могло покрыть наши грехи?


    В ком могли мы, беззаконные и нечестивые, получить оправдание, если не в одном лишь Сыне Божьем?


    О сладостный обмен! О непостижимое устроение![a] О неожиданные благодеяния! Беззаконие многих сокрыто в одном Праведнике, а праведность Одного оправдывает многих беззаконных!


    Итак, прежде показав неспособность нашей природы обрести жизнь, а теперь явив Спасителя, способного спасти даже бессильные создания, Бог пожелал, чтобы по обеим этим причинам мы верили в Его благость и считали Его нашим кормильцем,[b] Отцом, Учителем, Советником, Врачом, Умом, Светом, Честью, Славой, Силой и Жизнью.'
