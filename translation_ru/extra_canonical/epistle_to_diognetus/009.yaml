revisions:
- from: 'Заранее замыслив всё в Своём уме вместе со Своим Сыном, Бог в прежнее время позволил нам по собственной воле увлекаться беспорядочными порывами, сбиваясь с пути из-за наслаждений и страстей. И это вовсе не потому, что Он радовался нашим грехам, но потому, что терпел нас; не потому, что Он одобрял минувшее время беззакония, но потому, что готовил нынешнее время праведности. Так, чтобы мы, прежде собственными делами обличённые как недостойные жизни, теперь были удостоены её по благости Божьей; и чтобы, когда стала явной наша неспособность своими силами войти в Царство Божье, мы получили эту возможность силой Бога.


