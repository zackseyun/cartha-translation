base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: ru
  text: 'Пётр [тогда] собрал [остальных] и сказал: «Господь наш Иисус Христос, дарующий нам покой, дай нам дух разумения, чтобы и мы могли совершать чудеса!»


    Затем Пётр и другие апостолы увидели [его]. Они исполнились святого Духа[a], и каждый из них совершал исцеления. Они отправились возвещать Господа Иисуса, а потом вновь собрались, приветствовали друг друга и сказали: «Аминь».


    Тогда явился Иисус и сказал им: «Мир [всем] вам и всем, кто верен моему имени. Когда пойдёте, с вами будут радость, благодать и сила.


    Не бойтесь. Вот, Я всегда буду с вами».


    Тогда апостолы разошлись, отправившись на четыре проповеди[b], и пошли с силой Иисуса, с миром.


    Послание Петра к Филиппу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в предоставленном английском свидетельстве: «святым духом»; написание оригинала само по себе не решает, имеется ли в виду Святой Дух как Личность или святой дух как дар.'
    reason: Сохранить возможную грамматическую и богословскую неоднозначность при отсутствии прямой проверки коптского текста.
  - marker: b
    text: 'Выражение «на четыре проповеди» неясно; возможно также понимание: «для четырёх проповеднических миссий».'
    reason: Свидетель содержит необычную формулировку «into four messages», поэтому её нельзя безоговорочно истолковывать как четыре стороны света.
lexical_decisions:
- source_word: author of our repose
  choice: дарующий нам покой
  rationale: Передаёт причинный смысл «источник/создатель нашего покоя» естественным и достойным современным русским языком, не уточняя богословски природу покоя.
- source_word: spirit of insight
  choice: дух разумения
  rationale: Сохраняет слово «дух» и выражает способность к духовному пониманию без сведения смысла лишь к интеллектуальному знанию.
- source_word: work miracles / perform healings
  choice: совершать чудеса / совершал исцеления
  rationale: Сохранено различие между общим прошением о чудесах и последующим конкретным действием исцеления.
- source_word: faithful in my name
  choice: верен моему имени
  rationale: Сохранена необычная конструкция свидетеля и её возможная смысловая широта вместо замены на конфессионально более привычную формулу.
- source_word: continually
  choice: всегда
  rationale: Естественный русский эквивалент обещания постоянного присутствия.
theological_decisions:
- issue: Капитализация выражения «holy Spirit»
  choice: святого Духа
  alternative: святого духа
  rationale: Контекст исполнения апостолов и чудесного служения допускает личностное прочтение; прописная буква соответствует норме русского религиозного регистра, а неопределённость исходной формы отмечена в сноске.
- issue: Обещание присутствия Иисуса
  choice: «Я всегда буду с вами»
  alternative: «Я буду с вами непрестанно»
  rationale: Смысл постоянного присутствия сохранён без добавления временного или церковного толкования.
- issue: Неясная формула о четырёх миссиях
  choice: «отправившись на четыре проповеди»
  alternative: «разошлись в четыре стороны проповедовать»
  rationale: Не вводится географическое толкование «четыре стороны», которого прямо нет в предоставленном свидетельстве; текстовая трудность обозначена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством религиозного повествования. Переведён краткий заключительный текст, соответствующий английскому POB; квадратные скобки сохранены там, где они обозначают восстановленный текст. Основание — предоставленное публичнодоменное английское свидетельство; прямая сверка с коптским источником ещё требуется.
