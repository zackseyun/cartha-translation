base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: ru
  text: '[…][a] Послание Петра, которое он отправил Филиппу.


    Пётр, апостол Иисуса Христа, — Филиппу, нашему возлюбленному брату и соапостолу, а также братьям, находящимся вместе с тобой. Приветствую вас!


    Хочу, брат наш, чтобы ты понял: мы получили от нашего Господа, Спасителя всего мира, повеление собраться вместе, чтобы учить и проповедовать о спасении, обещанном нам […] [b] нашим Господом Иисусом Христом.


    Ты же отделился от нас и не захотел собраться вместе с нами, чтобы узнать, как нам согласовать свои действия и возвестить эту весть.


    Поэтому, брат наш, не согласишься ли ты прийти, исполняя повеление нашего Бога, Иисуса?


    Получив и прочитав это послание, Филипп пошёл к Петру, ликуя от радости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В начале рукописного текста имеется утрата; сохранившийся фрагмент начинается с названия послания.
    reason: Обозначить повреждение или лакуну рукописи, отмеченную квадратными скобками в доступном свидетельстве.
  - marker: b
    text: В этом месте рукописный текст повреждён или восстановлен неуверенно; точное содержание утраченного фрагмента неизвестно.
    reason: Не скрывать текстологическую неопределённость между словами «нам» и «нашим Господом».
lexical_decisions:
- source_word: dispatched / sent
  choice: отправил
  rationale: Передаёт отправку письма естественным современным русским глаголом без излишней архаизации.
- source_word: co-apostle
  choice: соапостол
  rationale: Сохраняет редкое, но значимое обозначение равного участия Филиппа в апостольском служении, не заменяя его более общим словом «сотрудник».
- source_word: directives / instructions
  choice: повеление
  rationale: В данном контексте речь идёт не просто о совете, а об авторитетном указании Господа; единственное число по-русски естественно объединяет содержание полученных распоряжений.
- source_word: coordinate ourselves
  choice: согласовать свои действия
  rationale: Естественно передаёт идею совместной организации действий, не добавляя иерархической или церковно-институциональной окраски.
- source_word: message
  choice: весть
  rationale: Сохраняет общий смысл провозглашаемого сообщения, не уточняя его как отдельное учение или каноническое Евангелие.
- source_word: delighting with glee
  choice: ликуя от радости
  rationale: Передаёт усиленное выражение радости и сохраняет эмоциональную выразительность заключительной фразы.
theological_decisions:
- issue: Наименование Иисуса «наш Бог»
  choice: «нашего Бога, Иисуса»
  alternative: «нашего Бога Иисуса» или «Бога нашего Иисуса»
  rationale: Запятая сохраняет приложение, присутствующее в доступном свидетельстве, и не ослабляет прямое именование Иисуса Богом, но также не разворачивает его в дополнительную богословскую формулу.
- issue: Объём обещанного спасения
  choice: «о спасении, обещанном нам»
  alternative: «о нашем обещанном спасении»
  rationale: Сохраняет адресатов обещания и не вводит утверждения об исключительности этого спасения для одной группы.
- issue: Обозначение Господа как Спасителя мира
  choice: «Спасителя всего мира»
  alternative: «Спасителя целого мира»
  rationale: «Всего мира» — естественная русская формулировка, сохраняющая универсальный объём исходного выражения без дальнейшего истолкования.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным эпистолярным звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор обращения «брат наш», редкое слово «соапостол», эмоциональная избыточность заключения и богословски напряжённое выражение «нашего Бога, Иисуса». Проект предварительный: прямой анализ коптских рукописей Nag Hammadi Codex VIII,2 и Codex Tchacos ещё не проведён; перевод опирается на указанное англоязычное свидетельство общественного достояния, а лакуны отмечены явно.'
