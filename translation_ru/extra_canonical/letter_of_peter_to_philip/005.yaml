base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: ru
  text: «Что же касается полноты, то это Я, [да,] Я был послан вниз, в тело, ради этого семени, которое было потеряно, и сошёл в их смертный образ. Но они не распознали Меня, полагая, что Я — смертный человек. Я говорил с тем, кто принадлежит Мне, и он внял Мне, как и вы вняли сегодня. Я дал ему власть войти в наследие своего отцовства и взял [его] [a] [. . .] наполнен [. . .] посредством его спасения. Поскольку он был недостаточностью, он стал полнотой».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Далее рукопись повреждена; расположение лакун и связь сохранившихся слов неясны. Перевод сохраняет скобки и многоточия английского публичного свидетельства.
    reason: Необходимо явно обозначить, что синтаксическая разорванность вызвана повреждением рукописи, а прямое исследование коптского текста ещё предстоит.
lexical_decisions:
- source_word: fullness
  choice: полнота
  rationale: Сохраняет ключевой концептуальный термин свидетельства и его противопоставление «недостаточности».
- source_word: seed
  choice: семя
  rationale: Передаёт образ буквально, не уточняя без достаточных оснований, идёт ли речь о потомстве, духовном начале или избранной общности.
- source_word: mortal mold
  choice: смертный образ
  rationale: Естественнее по-русски, чем буквальное «смертная форма/слепок», но сохраняет представление о телесном облике смертных.
- source_word: the one who is mine
  choice: тот, кто принадлежит Мне
  rationale: Сохраняет отношение принадлежности, не отождествляя персонажа с конкретной фигурой.
- source_word: fatherhood
  choice: отцовство
  rationale: Формально сохраняет необычную абстрактную лексику и не подменяет её более определёнными «Отцом» или «отеческим достоянием».
- source_word: deficiency
  choice: недостаточность
  rationale: Поддерживает терминологическую антитезу «недостаточность — полнота» и не сводит её к нравственному недостатку.
- source_word: salvation
  choice: спасение
  rationale: Стандартный и достаточно широкий русский эквивалент, не уточняющий субъект или характер спасения.
theological_decisions:
- issue: Воплощение и нисхождение в тело
  choice: «был послан вниз, в тело… сошёл в их смертный образ»
  alternative: «был ниспослан в тело… снизошёл в их смертную форму»
  rationale: Сохранены два отдельных глагола нисхождения и телесный язык без догматического уточнения природы воплощения.
- issue: Антитеза полноты и недостаточности
  choice: «он был недостаточностью, он стал полнотой»
  alternative: «ему недоставало полноты, но он обрёл её»
  rationale: Не сглаживает онтологически звучащую формулировку свидетельства и сохраняет богословское напряжение.
- issue: Неясная референция местоимений в повреждённой строке
  choice: Сохранены местоимения мужского рода и лакуна
  alternative: Уточнить, кого взяли и чьё это спасение
  rationale: Свидетельство не позволяет надёжно разрешить референцию; уточнение внесло бы интерпретацию в повреждённый текст.
translation_notes:
  register: 'Современный литературный русский с достоинством и умеренной формальностью. Заглавные буквы в местоимениях «Я/Меня/Мне» отмечают речь центрального божественного персонажа, не устраняя неоднозначностей самого текста. Проект предварительный: выполнен по публичному английскому свидетельству; сверка с коптским оригиналом ожидается.'
