translation:
  language: ru
  text: '«Итак, что касается [ущербности] эонов[a], вот в чём эта ущербность. Когда проявились непокорность и неразумие Матери — вне порядка Величия Отца, — она пожелала создать эоны. Когда она заговорила, за ней последовал тиран; но когда она оставила часть, тиран захватил её, и та стала ущербностью. Такова ущербность эонов.


    Когда тиран захватил эту часть, он насадил её, поставив над ней силы и власти, и заключил её в пределах смертных эонов. Все космические силы ликовали оттого, что возникли. [][b] Однако они не знали предсуществующего [Отца], потому что были чужды Ему. [Вместо этого] (тирану) была дана власть[c], и они поклонялись ему и восхваляли его.


    И разум тирана возгордился из-за восхвалений сил. Он стал противником и пожелал заменить один образ [другим образом], а одну форму — другой формой. Затем он поручил подвластным ему силам придать облик смертным телам, и те возникли из несоответствия созданного подобия[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эоны» здесь — элементы или области сверхмирного порядка; значение не следует автоматически сводить к обычным временным «векам».
    reason: Ключевой специальный термин может быть непонятен современному читателю.
  - marker: b
    text: Пустые квадратные скобки воспроизводят обозначенный в используемом свидетеле пробел или повреждение текста.
    reason: Сохраняет сигнал о состоянии рукописного текста, не предлагая неподтверждённого восстановления.
  - marker: c
    text: Текст не говорит, кем была дана эта власть; квадратные и круглые скобки передают сигналы восстановления и пояснения в доступном свидетеле.
    reason: Необходимо сохранить неопределённость пассивной конструкции и редакционные признаки исходного свидетельства.
  - marker: d
    text: Фраза «из несоответствия созданного подобия» неясна и допускает разные толкования; перевод намеренно не уточняет, в чём именно состояло это несоответствие.
    reason: Предотвращает ложную определённость в трудном месте.
lexical_decisions:
- source_word: deficiency
  choice: ущербность
  rationale: Передаёт не просто нехватку, а онтологическую неполноту или изъян; сохраняет повтор ключевого термина.
- source_word: aeons
  choice: эоны
  rationale: Устоявшийся русский термин для сверхмирных сущностей или областей в наг-хаммадийских текстах; не сводит понятие лишь к временным векам.
- source_word: defiance
  choice: непокорность
  rationale: Сохраняет оттенок сопротивления установленному порядку без усиления до открытого мятежа.
- source_word: thoughtlessness
  choice: неразумие
  rationale: В данном космогоническом контексте естественнее, чем разговорная «необдуманность», и сохраняет связь с отсутствием разумного устроения.
- source_word: the tyrannical one
  choice: тиран
  rationale: Краткое и естественное субстантивное обозначение, сохраняющее отрицательную характеристику фигуры без догматической идентификации.
- source_word: powers and authorities
  choice: силы и власти
  rationale: Формально сохраняет два раздельных класса космических правителей.
- source_word: pre-existent
  choice: предсуществующий
  rationale: Передаёт существование Отца прежде описываемого космического порядка, не уточняя философский механизм предсуществования.
- source_word: disparity of the likeness
  choice: несоответствие созданного подобия
  rationale: 'Сохраняет трудную и неоднозначную формулировку свидетеля: смертные тела возникают вследствие некоторого несоответствия в произведённом подобии.'
theological_decisions:
- issue: Статус Матери и происхождение ущербности
  choice: Сохранить формулировку о непокорности и неразумии Матери вне порядка Величия Отца
  alternative: Истолковать Матерь как конкретную именованную фигуру или объяснить её поступок как грехопадение
  rationale: Источник не даёт здесь имени и оставляет космогоническую причинность в собственной мифологической форме; перевод не должен вносить позднейшую конфессиональную схему.
- issue: Личность тирана
  choice: Не отождествлять тирана с дьяволом, демиургом или иной именованной фигурой
  alternative: Добавить традиционное богословское имя
  rationale: В отрывке используется функциональное обозначение, и его неопределённость следует сохранить.
- issue: Получение тираном власти
  choice: 'Передать пассивно: «тирану была дана власть»'
  alternative: Указать, кем именно дана власть, либо перевести как самовольный захват власти
  rationale: Пассивная конструкция источника не называет дающего и создаёт богословское напряжение, которое нельзя устранять.
- issue: Возникновение смертных тел
  choice: Сохранить неясную причинную связь с «несоответствием созданного подобия»
  alternative: Объяснить тела как испорченные копии небесного образца
  rationale: Такое объяснение возможно, но выходит за пределы прямо засвидетельствованной формулировки.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего наставительного повествования. Повторы «ущербность», «тиран», «силы» сохранены как композиционно и концептуально значимые. Заглавные буквы в «Матерь», «Величие» и «Отец» отражают титульное употребление, но не вводят конфессионального отождествления. Проект предварительный: выполнен по предоставленному публичному английскому свидетелю; прямая сверка с коптским текстом ещё требуется. Квадратные скобки исходного свидетельства сохранены, а буквенные маркеры сносок добавлены отдельно.'
