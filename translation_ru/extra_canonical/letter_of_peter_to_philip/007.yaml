review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод бережно следует предоставленному английскому свидетельству и осторожно сохраняет его богословские неопределённости. Однако несколько редакторских решений сглаживают отмеченную в свидетельстве повреждённость или заменяют его формулировки толковательными соответствиями: пропущены скобки при «горе» и при неопределённом дополнении после «исцелили», а «author of our life» передано как «источник нашей жизни», что уже не вполне сохраняет значение деятеля/создателя.'
  naturalness: Русский текст в основном естественен и выдержан в умеренно возвышенном регистре. «Поднялись в Иерусалим» звучит несколько необычно, но оправдано буквальным свидетельством и последующим «в храм». «Внимать моим словам» естественно, хотя «голосу моему» ближе к исходной формуле.
  terminology: «Малость», «святой дух», «багряница», «древо», «Матерь/Мать» и «страдание» переданы осмотрительно. В финальной характеристике Иисуса следует предпочесть «создатель нашей жизни» (либо «творец нашей жизни») вместо «источник», чтобы не подменять author иной метафорой. Слово «создатель» сохраняет агентное значение без конфессионального истолкования.
  issues:
  - severity: medium
    issue: Не сохранена скобочная неопределённость в ремарке о горе.
    rationale: Английское свидетельство содержит «(the mountain, heading towards Jerusalem)». Перевод должен хотя бы в скобках сохранить, что «гора» является пояснением свидетельства, а не безусловной частью основного текста.
  - severity: medium
    issue: Не сохранены квадратные скобки при дополнении «they healed [a] multitude».
    rationale: Скобки в свидетельстве маркируют восстановленный или неопределённый элемент. «Исцелили множество людей» представляет дополнение как полностью сохранное и определённое.
  - severity: medium
    issue: «Источник нашей жизни» неточно передаёт «author of our life».
    rationale: '«Источник» обозначает происхождение, тогда как author имеет агентный смысл: тот, кто является создателем/устроителем жизни. Нужна более близкая передача.'
  - severity: low
    issue: «Внимать моим словам» несколько отходит от «pay attention to my voice».
    rationale: Это не смысловая ошибка, но «внимайте голосу моему» лучше сохраняет образ голоса и высокий регистр речи Петра.
  - severity: low
    issue: Форма лакуны в речи голоса недостаточно буквально отражает свидетельство.
    rationale: Следует сохранить именно данную последовательность скобок и лакун — «[не] [] [… Мой] Отец […]» — не придавая повреждённому месту связности.
  revised_text: 'Апостолы возблагодарили Господа, воздав Ему всякую хвалу, и возвратились в Иерусалим.[a]


    Когда они спускались (с горы, направляясь в Иерусалим) по дороге, то беседовали о явившемся свете. Между ними начался спор о Господе, и они говорили: «Если Он, наш Господь, пострадал, то насколько же больше предстоит пострадать нам?»


    Пётр ответил: «Он пострадал ради нас, и нам тоже предстоит страдать из-за нашей малости».[b]


    Тогда раздался голос: «Я много раз говорил вам, что вам предстоит страдать. Вас будут тащить в синагоги и к правителям, и от этого вы будете страдать. Но тот, кто не будет страдать, тот также [не] [] [… Мой] Отец […], чтобы он мог […]».[c]


    Апостолы же очень обрадовались и поднялись в Иерусалим; придя в храм, они учили о спасении во имя Господа Иисуса Христа и исцелили [многих].


    Пётр начал говорить и сказал своим ученикам: «Когда наш Господь Иисус пребывал в теле, Он рассказал нам всё, потому что Сам сошёл. Братья мои, внимайте голосу моему».


    Он исполнился святым духом[d] и сказал:


    «Наш свет, Иисус, [со]шёл,


    и был распят,


    и носил терновый венец,


    и облачился в багряницу,


    и был повешен на древе,


    и был положен в гробницу,


    и воскрес из мёртвых.


    Братья мои, Иисусу чуждо подобное страдание.[e] Но мы — те, кто пострадал из-за проступка Матери.[f] Поэтому, находясь среди нас, Он возвещал всё в символическом смысле. Господь Иисус, Сын неизмеримой славы Отца, — создатель нашей жизни.


    Братья мои, не станем внимать этим безбожникам и не будем ходить в […]».[g]'
