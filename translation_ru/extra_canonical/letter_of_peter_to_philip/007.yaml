translation:
  language: ru
  text: 'Апостолы возблагодарили Господа, воздав Ему всякую хвалу, и возвратились в Иерусалим.[a]


    Когда они спускались с горы по дороге в Иерусалим, то беседовали о явившемся свете. Между ними начался спор о Господе, и они говорили: «Если Он, наш Господь, пострадал, то насколько же больше предстоит пострадать нам?»


    Пётр ответил: «Он пострадал ради нас, и нам тоже предстоит страдать из-за нашей малости».[b]


    Тогда раздался голос: «Я много раз говорил вам, что вам предстоит страдать. Вас будут тащить в синагоги и приводить к правителям, и от этого вы будете страдать. Но тот, кто не будет страдать, тот также [не] […] [… Мой] Отец […], чтобы он мог […]».[c]


    Апостолы же очень обрадовались и поднялись в Иерусалим. Они пришли в храм, учили о спасении во имя Господа Иисуса Христа и исцелили множество людей.


    Пётр обратился к своим ученикам: «Когда наш Господь Иисус пребывал в теле, Он рассказал нам обо всём, потому что Сам сошёл к нам. Братья мои, внимайте моим словам».


    Он исполнился святым духом[d] и сказал:


    «Наш свет, Иисус, [со]шёл,

    и был распят,

    и носил терновый венец,

    и облачился в багряницу,

    и был повешен на древе,

    и был положен в гробницу,

    и воскрес из мёртвых.


    Братья мои, Иисусу чуждо подобное страдание.[e] Но мы — те, кто пострадал из-за проступка Матери.[f] Поэтому, находясь среди нас, Он возвещал обо всём посредством образов. Господь Иисус, Сын неизмеримой славы Отца, — источник нашей жизни.


    Братья мои, не станем внимать этим безбожникам и не будем ходить в […]».[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному английскому свидетельству; прямая сверка с коптским текстом ещё не проведена.'
    reason: Честно обозначает ограничение источниковой базы и не выдаёт опосредованный перевод за окончательный перевод с коптского.
  - marker: b
    text: 'Буквально: «из-за того, что мы малы»; смысл «малости» здесь неясен.'
    reason: Сохраняет подлинную лексическую и богословскую неоднозначность.
  - marker: c
    text: Конец высказывания сильно повреждён. Квадратные скобки обозначают частично восстановленный текст, многоточия — утраты рукописи.
    reason: Предупреждает читателя, что связный смысл лакуны восстановить невозможно.
  - marker: d
    text: 'В доступном английском свидетельстве: «a holy Spirit», буквально «святым духом»; написание и точный смысл требуют сверки с коптским текстом.'
    reason: Не позволяет орфографии преждевременно разрешить вопрос о референте выражения.
  - marker: e
    text: 'Возможен также перевод: «Иисус непричастен такому страданию». Фраза не поясняет, в каком именно смысле страдание Ему «чуждо».'
    reason: Сохраняет богословское напряжение и не навязывает докетическое либо ортодоксализирующее прочтение.
  - marker: f
    text: Кого именно текст называет «Матерью», в данном отрывке не объясняется.
    reason: Предотвращает необоснованное отождествление с конкретной фигурой.
  - marker: g
    text: Заключительная фраза обрывается из-за утраты текста.
    reason: Объясняет незавершённый синтаксис.
lexical_decisions:
- source_word: all praises
  choice: воздав Ему всякую хвалу
  rationale: Передаёт полноту хвалы естественным и достойным русским оборотом без буквального множественного числа.
- source_word: the light that had become visible
  choice: явившийся свет
  rationale: Сохраняет мотив света и факт его зримого явления, не уточняя природу видения.
- source_word: on account of our being small
  choice: из-за нашей малости
  rationale: Сохраняет необычную и богословски неоднозначную формулировку, не заменяя её толкованиями вроде «слабости» или «ничтожности».
- source_word: governors
  choice: правителям
  rationale: Широкое соответствие, не сужающее значение до конкретной римской должности.
- source_word: dwelt in the body
  choice: пребывал в теле
  rationale: Формально сохраняет телесную формулу свидетеля и не подменяет её конфессиональным толкованием.
- source_word: tree
  choice: древе
  rationale: Сохраняет традиционную библейскую отсылку и возвышенный поэтический регистр данного исповедального фрагмента.
- source_word: alien to such suffering
  choice: чуждо подобное страдание
  rationale: Сохраняет резкую концептуальную дистанцию между Иисусом и страданием, не объясняя её докетически или иначе.
- source_word: trespass of the Mother
  choice: проступка Матери
  rationale: Передаёт нарушение без усиления до конкретно догматического «грехопадения»; прописная буква сохраняет титульный характер обозначения.
- source_word: with a symbolic meaning
  choice: посредством образов
  rationale: Естественно передаёт непрямой, символический способ возвещения, не утверждая, что все события были лишь нереальны.
- source_word: author of our life
  choice: источник нашей жизни
  rationale: Передаёт происхождение жизни от Иисуса без современного литературного оттенка слова «автор» и без чрезмерного догматического уточнения.
theological_decisions:
- issue: Предстоящее страдание учеников
  choice: «предстоит страдать»
  alternative: «придётся страдать»
  rationale: Первый вариант сохраняет предсказательный и обязательный оттенок, но звучит менее разговорно и не превращает страдание в случайную неприятность.
- issue: Фраза о «малости» учеников
  choice: Сохранено «из-за нашей малости»
  alternative: Истолковать как слабость, низкое положение или духовное несовершенство
  rationale: Контекст не позволяет надёжно выбрать одно толкование; неоднозначность сохранена.
- issue: Написание «святой дух»
  choice: «святым духом» со строчной буквы
  alternative: «Святым Духом»
  rationale: Английский свидетель имеет неопределённую форму и строчное написание; до прямой проверки коптского текста не следует безоговорочно отождествлять выражение с позднейшей тринитарной орфографической нормой.
- issue: Отношение Иисуса к страданию
  choice: 'Буквально сохранено: «Иисусу чуждо подобное страдание»'
  alternative: «Иисус на самом деле не страдал» или «страдание не властно над Иисусом»
  rationale: Обе альтернативы разрешают богословское напряжение, которого сам доступный свидетель прямо не разрешает.
- issue: «Мать»
  choice: Сохранено титульное «Матерь»/«Матери» без идентификации
  alternative: Отождествить с Евой, Софией или иной фигурой
  rationale: Данный отрывок не называет эту фигуру; идентификация была бы внешним толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. В повествовании использован естественный синтаксис; в ритмическом исповедальном фрагменте сохранены параллельные строки и традиционные слова «багряница», «древо», «гробница». Лакунарный текст не реконструирован сверх доступного свидетельства; рукописные номера страниц удалены.
