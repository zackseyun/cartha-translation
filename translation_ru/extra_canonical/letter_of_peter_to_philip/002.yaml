translation:
  language: ru
  text: 'Тогда Пётр собрал остальных. Они пошли на гору, называемую Елеонской, где прежде собирались вместе с блаженным Христом, когда Он пребывал во плоти.


    Собравшись вместе, апостолы преклонили колени и стали молиться, говоря:


    «Отец, Отец, Отец света,

    Тот, Кому принадлежат нетленные,

    услышь нас,

    как Ты благоволил к святому Сыну Твоему, Иисусу Христу,

    ибо ради нас Он стал светом [a] во тьме.

    Истинно, услышь нас».


    И снова они стали молиться, говоря:


    «Сын жизни, Сын бессмертия,

    Ты, обитающий в свете,

    Сын, Христос бессмертия,

    Искупитель наш,

    дай нам силу,

    ибо нас преследуют, чтобы убить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном свидетельстве после слова «светом» отмечена лакуна; утраченный текст не восстановлен.
    reason: Сохраняет видимый разрыв источника и не предлагает предположительного дополнения.
lexical_decisions:
- source_word: Olivet
  choice: Елеонская гора
  rationale: Устоявшееся русское название Масличной горы; формула «гора, называемая Елеонской» сохраняет структуру свидетельства.
- source_word: indestructible ones
  choice: нетленные
  rationale: Передаёт идею неподверженности тлению, не уточняя без достаточных оснований, идёт ли речь о небесных существах, спасённых людях или иной группе.
- source_word: deathlessness
  choice: бессмертие
  rationale: Естественный русский эквивалент, сохраняющий повтор в выражениях «Сын бессмертия» и «Христос бессмертия».
- source_word: redeemer
  choice: Искупитель
  rationale: Достоинственный и понятный религиозный термин, не конкретизирующий здесь способ искупления.
- source_word: they are hunting for us
  choice: нас преследуют
  rationale: Естественно передаёт целенаправленную охоту на апостолов; следующая конструкция «чтобы убить» сохраняет прямоту угрозы.
- source_word: dwelt in the body
  choice: пребывал во плоти
  rationale: Сохраняет древнюю телесную формулировку и её возможный богословский оттенок, не перефразируя её как простое указание на земную жизнь.
theological_decisions:
- issue: Принадлежность «нетленных» Отцу света
  choice: «Тот, Кому принадлежат нетленные»
  alternative: «Отец нетленных» или «Ты, Чьи нетленные»
  rationale: Выбранная формулировка сохраняет отношение принадлежности в свидетельстве и не превращает его без основания в родительство.
- issue: Благоволение Отца к Сыну
  choice: «как Ты благоволил к святому Сыну Твоему»
  alternative: «как святой Сын Твой был угоден Тебе»
  rationale: Сохраняется активная конструкция свидетельства и несколько необычная связь прошения с благоволением, без богословского сглаживания.
- issue: Титул «Христос бессмертия»
  choice: сохранён буквально
  alternative: «бессмертный Христос»
  rationale: Родительная конструкция может обозначать не только качество Христа, но и Его отношение к бессмертию; буквальная форма сохраняет эту смысловую открытость.
translation_notes:
  register: 'Современный литературный русский с торжественным молитвенным ритмом. Повторы титулов и обращений сохранены. Местоимения, относящиеся к Отцу и Христу, написаны с прописной буквы как элемент русского религиозно-литературного регистра. Перевод предварительный: выполнен по предоставленному общедоступному английскому свидетельству; прямая сверка с коптским текстом ещё требуется. Изолированный знак [1] принят за посторонний номер страницы и в основной текст не включён.'
