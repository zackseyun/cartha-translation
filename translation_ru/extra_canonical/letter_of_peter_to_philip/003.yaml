translation:
  language: ru
  text: 'Тогда явился яркий свет, и гора засияла от явления Того, кто предстал перед ними. И воззвал к ним голос:


    «Внимайте моим словам, чтобы Я мог говорить с вами.

    Почему вы ищете Меня?

    Я — Иисус Христос, неизменно пребывающий с вами».


    Апостолы ответили:


    «Господи, мы хотели бы постичь недостаток эонов[b]

    и их полноту,

    а также то, как нас удерживают в этом обиталище.

    Как мы оказались здесь?

    Как мы уйдём отсюда?

    …[a] Как мы обретаем власть говорить открыто?[c]

    Почему силы сражаются против нас?»


    Тогда голос из света воззвал к ним: «Вы сами свидетельствуете, что Я говорил вам всё это, но из-за вашего неверия Я повторю сказанное».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном свидетельстве перед этим вопросом отмечена лакуна или место с неопределённым восстановлением.
    reason: Сохраняет переданный источником сигнал повреждения текста, не предлагая недоказанного восполнения.
  - marker: b
    text: Эоны — термин, который здесь может обозначать космические эпохи, миры или духовные сферы/сущности; точный смысл требует сверки с коптским текстом и контекстом произведения.
    reason: Техническое слово нельзя без потери неоднозначности заменить одним общеупотребительным русским эквивалентом.
  - marker: c
    text: 'Буквально: «иметь власть для смелой (или свободной) речи».'
    reason: Показывает сочетание предоставленной власти и открытого, бесстрашного говорения.
lexical_decisions:
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический космологический термин, поскольку замена на «века» или «миры» преждевременно устранила бы смысловую неоднозначность текста.
- source_word: fullness
  choice: полнота
  rationale: Передаёт терминологическую пару «недостаток — полнота» без догматического истолкования.
- source_word: dwelling-place
  choice: обиталище
  rationale: Достоинственное и понятное обозначение места пребывания; не уточняет, идёт ли речь о мире, теле или иной сфере.
- source_word: authority for boldness of speech
  choice: власть говорить открыто
  rationale: Сохраняет как идею предоставленной власти, так и смысл свободной, смелой речи, не сводя выражение лишь к психологической храбрости.
- source_word: unfaithfulness
  choice: неверие
  rationale: Естественная русская передача религиозно значимого отсутствия веры; возможный оттенок неверности отмечен среди богословских решений.
theological_decisions:
- issue: Космологическое значение «эонов» и «полноты»
  choice: Термины сохранены без пояснительного перефразирования в основном тексте.
  alternative: Перевести как «века/миры» и «совокупность» либо истолковать через конкретную гностическую систему.
  rationale: Имеющихся данных недостаточно, чтобы привязать формулировку к одной реконструированной системе; перевод сохраняет напряжение и техническую лексику свидетельства.
- issue: Характер пребывания Иисуса с апостолами
  choice: «неизменно пребывающий с вами»
  alternative: «всегда живущий среди вас»
  rationale: «Пребывать» сохраняет более широкий смысл присутствия и не решает вопрос о его телесном, духовном или мистическом характере.
- issue: unfaithfulness
  choice: «неверие»
  alternative: «неверность» или «маловерие»
  rationale: «Неверие» наиболее прямо выражает отсутствие доверия к уже сказанному; при этом исходное английское свидетельство допускает и нравственный оттенок неверности.
- issue: powers
  choice: «силы»
  alternative: «власти»
  rationale: Сохранено более широкое обозначение противоборствующих сверхчеловеческих сил без отождествления с конкретным ангельским чином.
translation_notes:
  register: 'Современный литературный русский с торжественной, но понятной повествовательной интонацией. Местоимения, относящиеся к Иисусу в прямой речи и повествовании, оформлены с прописной буквы по традиционной русской издательской норме. Перевод предварительный: представленное основание является англоязычным публичным свидетельством, а непосредственная сверка с коптскими рукописями Nag Hammadi Codex VIII,2 и Codex Tchacos ещё требуется.'
