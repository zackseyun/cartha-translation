translation:
  language: ru
  text: '«Что же касается вашего заключения, то оно постигло вас потому, что вы принадлежите Мне. Когда вы совлечёте с себя то, что подвержено тлению, тогда станете светилами среди смертных.


    Что же касается вашей борьбы с силами, то она происходит потому, что они, в отличие от вас, лишены покоя и не желают, чтобы вы спаслись».


    Тогда апостолы снова поклонились и сказали: «Господь, наставь нас: как нам сражаться с архонтами, если архонты сильнее нас?»


    И тогда из явившегося образа[a] воззвал к ним голос: «Вот как вы должны сражаться с ними, ибо архонты ведут войну против внутреннего человека. Вот как вы должны сражаться с ними:


    Соберитесь вместе и возвещайте миру спасение, сопровождая его обетованием; препояшьтесь силой Моего Отца и объявите Ему о своей просьбе. И Он, Отец, поможет вам, как помог вам, послав Меня. […] [Не бойтесь: Я буду с вами всегда][b], как говорил вам прежде, когда пребывал в теле».


    Тогда с неба сверкнула молния и раздался гром, а Тот, Кого они видели там в явившемся образе, был восхищен на небо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетельству: «из явления» или «из видения». Точное чтение следует проверить по коптскому тексту.'
    reason: Выражение неоднозначно, а непосредственная сверка с древним источником ещё не выполнена.
  - marker: b
    text: Квадратные скобки обозначают восстановленный или повреждённый текст рукописи. Предшествующий этому месту утраченный фрагмент передан как […].
    reason: Сохраняет отмеченные в исходном свидетельстве сигналы лакуны и редакционного восстановления.
lexical_decisions:
- source_word: detention
  choice: заключение
  rationale: Передаёт состояние удержания или заточения, не уточняя без достаточных оснований, идёт ли речь именно об аресте.
- source_word: what is destructible
  choice: то, что подвержено тлению
  rationale: Сохраняет смысл разрушимости и смертности, избегая искусственного буквального «разрушимое».
- source_word: lights
  choice: светила
  rationale: Естественное возвышенное обозначение тех, кто сияет среди людей; сохраняет образ света.
- source_word: powers
  choice: силы
  rationale: Передаёт наименование сверхчеловеческих противников без преждевременного отождествления с конкретным чином.
- source_word: rest
  choice: покой
  rationale: Сохраняет возможный духовно-эсхатологический оттенок слова и его противопоставление состоянию адресатов.
- source_word: archons
  choice: архонты
  rationale: Технический термин сохранён транслитерацией, поскольку нейтральное «правители» могло бы скрыть особое космологическое значение.
- source_word: Inner Man
  choice: внутренний человек
  rationale: Сохраняет антропологический термин и его намеренную смысловую напряжённость.
- source_word: apparition
  choice: явившийся образ
  rationale: Передаёт видимое сверхъестественное явление, не утверждая, что речь лишь о призраке или бесплотном видении.
- source_word: gird yourselves
  choice: препояшьтесь
  rationale: Сохраняет древний метафорический образ приготовления и облечения силой при понятном русском синтаксисе.
- source_word: make known your request
  choice: объявите Ему о своей просьбе
  rationale: Передаёт обращение с просьбой к Отцу; местоимение уточняет подразумеваемого адресата, не меняя содержания.
- source_word: snatched to heaven
  choice: был восхищен на небо
  rationale: Сохраняет пассивную форму и мотив внезапного взятия на небо.
theological_decisions:
- issue: Причина борьбы с силами
  choice: «она происходит потому, что они… лишены покоя»
  alternative: «она ведётся ради их покоя»
  rationale: Сохранена причинная связь английского свидетельства без попытки богословски упорядочить неясное утверждение.
- issue: Спасение с обетованием миру
  choice: «возвещайте миру спасение, сопровождая его обетованием»
  alternative: «учите мир спасению и обетованию»
  rationale: Сохранена грамматическая связь обетования со спасительной проповедью, хотя точное отношение понятий требует сверки с коптским текстом.
- issue: Помощь Отца и послание говорящего
  choice: «как помог вам, послав Меня»
  alternative: «как помог Мне, когда послал Меня»
  rationale: Сохранено чтение предоставленного свидетельства с адресатами «вам», несмотря на возможную смысловую трудность.
- issue: Пребывание в теле
  choice: «когда пребывал в теле»
  alternative: «когда был во плоти»
  rationale: Не добавлена оценка тела; формулировка остаётся близкой свидетельству и не навязывает конфессионального толкования.
- issue: Личность восхищенного
  choice: «Тот, Кого они видели…»
  alternative: «образ, который они видели…»
  rationale: Одушевлённая форма исходного свидетельства сохранена, но личность явившегося не названа сверх того, что дано в отрывке.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным повествовательным регистром. Технический термин «архонты» сохранён; архаизмы ограничены прозрачными библейскими формами «совлечёте», «препояшьтесь» и «восхищен». Проект предварительный: он основан на предоставленном публичном английском свидетельстве, поскольку проверка коптского оригинала ещё не проведена.'
