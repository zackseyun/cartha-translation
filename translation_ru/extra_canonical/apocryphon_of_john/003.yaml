translation:
  language: ru
  text: '**Апокриф Иоанна — Монада**


    1. [Я также] попросил, чтобы [понять это, и он сказал] мне: «Монада[a] — [это единство, выше которого нет] ничего.


    2. [Она есть то, что существует] как [Бог] и как Отец Всего, [Невидимый], который выше [Всего, который существует как] нетленность, [как] чистый свет, на который не может взирать ни одно [око].


    3. Он — [невидимый Дух], о котором непозволительно [думать] как о боге или о чём-либо подобном, потому что он больше, чем бог: ведь выше него ничего нет и никто не властвует над ним.


    4. [Ибо он] не [существует] внутри чего-либо подвластного [ему, поскольку всё] существует внутри него, потому что он сам себя [утвердил].


    5. [Он вечен], поскольку ни в чём [не нуждается], ибо [он] — совершенная полнота.


    6. [Ему ничего не недоставало], так что он не нуждался в том, чтобы [это] сделало его совершенным.


    7. [Напротив], он вечно и всецело совершенен в [свете].


    8. Он [безграничен], поскольку прежде него нет никого, кто мог бы положить ему предел.


    9. Он непостижим, [поскольку] прежде него нет никого, кто мог бы [постичь его].


    10. [Он] неизмерим, поскольку никто [не существовал прежде него, чтобы измерить] его.


    11. [Он невидим, поскольку] никто не видел [его].


    12. [Он вечен], поскольку [существует] вечно.


    13. Он [невыразим, поскольку] не существовало никого, кто мог бы постичь его мыслью, чтобы говорить [о нём].


    14. Его невозможно назвать, поскольку [никто не существовал прежде него], чтобы дать [ему] имя.


    15. Он — [безмерный свет], чистый, священный, [незапятнанный].


    16. Он невыразим, [существуя в совершенной] нетленности.


    17. (Он существует), [не] (будучи заключён) ни в совершенстве, ни в блаженстве, ни в божественности, но он превыше (всего этого).


    18. Он ни телесен, [ни] бестелесен.


    19. Он ни велик, [ни] мал.


    20. [Невозможно] сказать, что у него есть величина или [какое-либо качество], потому что никто не может [постичь его].


    21. Он не существо среди [существ, но он] превыше всего — [не] так, [будто он выше сравнительно с чем-либо], но (он возвышен) сам по себе.


    22. Он не [причастен] ни эонам[b], ни времени, потому что тот, кто причастен [эону], учреждённому прежде, [...].


    23. Ему [не] не была назначена мера времени[c], [поскольку] он ничего не получает от другого, [ведь тогда это было бы получено] взаймы; ибо тот, кто существует прежде кого-либо (другого), [не нуждается] в том, чтобы принимать (что-либо) от [другого].


    24. Ибо он — тот, кто созерцает самого себя, пребывая в ожидании, в [своём] свете, поскольку [...] славно[d].


    25. Ему принадлежит безмерная чистота.


    26. Он — эон, дарующий эоны.


    27. Он — [жизнь], дарующая жизнь.


    28. Он — блаженный, дарующий блаженство.


    29. Он — знание, дарующее знание.


    30. [Он] — благость, дарующая благость.


    31. [Он] — милость и искупление, [дарующие милость].


    32. Он — благодать, дарующая благодать,


    33. [не] потому, что она принадлежит ему, но потому, что он дарует [свет], безмерный и непостижимый.


    34. [Как могу я говорить] с тобой о нём, [если] его [эон] не подвержен разрушению, пребывает в покое и остаётся в [безмолвии, покоясь], существуя прежде [всего? Ведь он] — глава [всех] эонов, [и] именно он своей благостью даёт им силу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Монада — буквально «единое», «единство»; здесь это наименование высшей, ни от чего не зависящей реальности.
    reason: Технический термин нуждается в кратком пояснении для современного читателя.
  - marker: b
    text: 'Эон — многозначный термин: «век», «вечность», а в древних религиозно-философских текстах также вечностная область или духовная реальность.'
    reason: Русское заимствование сохраняет смысловую неоднозначность, но требует пояснения.
  - marker: c
    text: 'В доступном английском свидетеле здесь стоит трудное двойное отрицание: «[was not] not assigned». Оно сохранено до прямой сверки с коптскими рукописями.'
    reason: Обозначает существенную текстологическую неопределённость и не позволяет выдать предположительное исправление за установленный текст.
  - marker: d
    text: В тексте перед словом «славно» имеется лакуна, поэтому грамматическая связь и точный смысл фразы неясны.
    reason: Предупреждает читателя, что неясность обусловлена повреждением или неполнотой текста.
lexical_decisions:
- source_word: monad
  choice: Монада
  rationale: Сохранён традиционный философско-религиозный термин, поскольку ближайшее русское «единство» уже выступает его пояснением в самом тексте и не передаёт всех смысловых оттенков.
- source_word: the All
  choice: Всё / Всего
  rationale: Прописная буква сохраняет вероятный технический, космологический смысл выражения; падежная форма «Отец Всего» естественна по-русски.
- source_word: indestructibility
  choice: нетленность
  rationale: «Нетленность» естественнее для возвышенной религиозной прозы и охватывает неразрушимость и неподверженность порче.
- source_word: aeon
  choice: эон
  rationale: Технический термин сохранён без сведения исключительно к «веку» или периоду времени, поскольку в тексте он может обозначать как вечностную область, так и персонифицированную реальность.
- source_word: somatic / non-somatic
  choice: телесен / бестелесен
  rationale: Краткая симметричная пара передаёт апофатическое отрицание обеих категорий без поясняющего разрешения парадокса.
- source_word: self-established
  choice: сам себя утвердил
  rationale: Передаёт самобытность и независимость исходного образа, не вводя более специального догматического термина.
- source_word: unspeakable
  choice: невыразим
  rationale: В данном контексте речь идёт не о запрете произнесения, а о невозможности адекватно выразить словами.
- source_word: goodness
  choice: благость
  rationale: Сохраняет возвышенный регистр и значение внутренне присущего блага, отличаясь от обычной человеческой «доброты».
theological_decisions:
- issue: Формула «больше, чем бог»
  choice: «он больше, чем бог»
  alternative: «он превыше Бога»
  rationale: Сохранена провокационная апофатическая формулировка свидетеля без отождествления или противопоставления именованному Богу определённой конфессии.
- issue: Отрицание телесности и бестелесности
  choice: «ни телесен, ни бестелесен»
  alternative: «не имеет тела»
  rationale: Сохранено двойное отрицание категорий; упрощённый вариант устранил бы намеренное богословское напряжение.
- issue: Отношение Монады к совершенству, блаженству и божественности
  choice: «не будучи заключён… но он превыше»
  alternative: «не является совершенством…»
  rationale: Передано не отрицание этих свойств, а неподчинённость и несводимость к названным категориям, как указывает формулировка witness «confined within».
- issue: Эон как дарующий эоны
  choice: Термин «эон» сохранён в обоих случаях
  alternative: «вечность, дарующая века»
  rationale: Не устранена возможная разница между космологической сущностью, областью и временной длительностью.
- issue: Двойное отрицание в §23
  choice: «[не] не была назначена»
  alternative: Исправить на «не была назначена» или «была назначена»
  rationale: Трудное чтение английского свидетеля сохранено, поскольку прямое рассмотрение коптского источника ещё не выполнено и молчаливое исправление разрешило бы текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апофатического гимна. Повторы и параллельные конструкции сохранены как важная часть риторики. Квадратные скобки, круглые скобки и многоточия передают редакционные восстановления, уточнения и лакуны предоставленного свидетеля. Черновик основан на указанном общедоступном английском переводе; прямая сверка с коптскими кодексами ещё требуется. Голые номера рукописных страниц, разрывающие предложения, в основной текст не включены.
