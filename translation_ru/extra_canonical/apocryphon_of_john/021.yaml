review_pass:
  verdict: revise
  source_fidelity: Нужна правка нескольких смысловых деталей по предоставленному англоязычному свидетельству. «Ты слышал это» переставляет акцент выражения «in your hearing» и не передаёт «for your sake»; «непоколебимый» истолковывает более буквальное и технически значимое «unmoving»; «близким ... ученикам» не передаёт companion disciples. «Исчез перед ним» также менее точно, чем «исчез от него».
  naturalness: 'Текст в целом литературен и хорошо выдержан по регистру. Предлагаемые замены сохраняют современную естественность: «в твоём присутствии», «своим товарищам-ученикам», «исчез от него».'
  terminology: «Спаситель», «тайна», «род» и «духи» допустимы и не навязывают конфессионального толкования. «Неподвижный род» следует предпочесть «непоколебимому роду», поскольку последнее вносит значение стойкости, которого в свидетельстве нет. «Тайное писание согласно Иоанну» сохраняет жанровую и атрибутивную формулу источника.
  issues:
  - severity: medium
    issue: Начальная фраза передана с изменением акцента и пропуском цели.
    rationale: '«Я завершил всё для тебя, и ты слышал это» не вполне соответствует «I have finished everything ... in your hearing ... for your sake»: выражение о слышании характеризует совершение/изложение в присутствии адресата, а «ради тебя» должно быть выражено отдельно.'
  - severity: medium
    issue: «Непоколебимый род» интерпретирует «unmoving race».
    rationale: '«Непоколебимый» означает стойкий, неколебимый, тогда как supplied witness говорит именно «unmoving». При спорности технического выражения безопаснее сохранить буквальную странность: «неподвижный род».'
  - severity: low
    issue: «Близким ему ученикам» не передаёт companion disciples.
    rationale: Определение «близким» добавляет эмоциональную близость, а companion описывает соучастников/товарищей. «Своим товарищам-ученикам» точнее и естественно.
  - severity: low
    issue: «Исчез перед ним» неточно передаёт vanished from him.
    rationale: «Перед ним» описывает место явления; «от него» сохраняет направление исчезновения, выраженное в свидетельстве.
  revised_text: '«Я окончил всё в твоём присутствии ради тебя, но я сказал тебе всё, чтобы ты записал это и тайно передал своим духам-собратьям, ибо это тайна неподвижного рода».



    Спаситель также доверил ему эти слова, чтобы он записал их и хранил под замком. И сказал ему: «Да будет проклят всякий, кто променяет эти слова на какой-либо дар — будь то пища, питьё, одежда или что-либо подобное».



    Эти слова также были доверены ему в тайне. И вдруг он исчез от него, а тот пошёл к своим товарищам-ученикам и сообщил им то, что сказал ему Спаситель.



    Иисус Христос. Аминь.



    Тайное писание согласно Иоанну'
  revised_footnotes: []
  revision_rationale: 'Исправлены только места, где черновик либо менял смысл supplied witness, либо добавлял интерпретацию. «Духи-собратья» сохраняет необычную референцию spirits, не сводя её прямо к людям; дефисное сочетание делает русский текст понятнее, не устраняя неоднозначность. Номер рукописной страницы «32» не восстанавливается: в английской POB-основе он намеренно удалён, а отдельной сноски или якоря в черновике нет.'
