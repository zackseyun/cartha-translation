translation:
  language: ru
  text: '«Я завершил всё для тебя, и ты слышал это. Я же рассказал тебе всё, чтобы ты записал эти слова и тайно передал их близким тебе духам, ибо это тайна непоколебимого рода».


    Спаситель также доверил ему эти слова, чтобы он записал их и хранил под замком. Он сказал ему: «Проклят всякий, кто обменяет эти слова на какой-либо дар — на пищу, питьё, одежду или что-нибудь подобное».


    Эти слова были доверены ему в тайне. И внезапно Спаситель исчез перед ним. Тогда он пошёл к близким ему ученикам и рассказал им о том, что сказал ему Спаситель.


    Иисус Христос. Аминь.


    Тайное писание согласно Иоанну'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in your hearing
  choice: ты слышал это
  rationale: Передаёт смысл произнесённого в присутствии Иоанна естественным современным русским языком, не превращая слух в абстрактное понятие.
- source_word: companion spirits
  choice: близким тебе духам
  rationale: Сохраняет необычную духовную референцию и не подменяет её более привычным словом «единомышленники» или «ученики».
- source_word: unmoving race
  choice: непоколебимого рода
  rationale: «Род» передаёт особую общность, а «непоколебимый» звучит естественнее буквального «неподвижный», сохраняя идею устойчивости.
- source_word: keep them locked away
  choice: хранил под замком
  rationale: Сохраняет конкретный образ сокрытия и защиты записанного текста.
- source_word: in a mystery
  choice: в тайне
  rationale: Необычная формула передана без навязывания позднейшего сакраментального смысла слова «таинство».
- source_word: The Secret Writing According to John
  choice: Тайное писание согласно Иоанну
  rationale: Сохраняет жанровую неопределённость слова writing и традиционную формулу атрибуции «согласно Иоанну».
theological_decisions:
- issue: Значение выражения «непоколебимый род»
  choice: Сохранить как обозначение особой общности без поясняющего толкования
  alternative: «неподвижное поколение» или «непоколебимое племя»
  rationale: Свидетель допускает технический богословский смысл; перевод не должен сводить его к этнической, биологической или просто нравственной категории.
- issue: Кому следует тайно передать слова
  choice: «близким тебе духам»
  alternative: «твоим собратьям по духу»
  rationale: Альтернатива естественнее, но заранее истолковывает spirits как людей; основной текст сохраняет референциальную неоднозначность.
- issue: Характер передачи слов «в тайне»
  choice: Не использовать термин «таинство»
  alternative: «в таинстве»
  rationale: «Таинство» в современном русском несёт сильные конфессиональные ассоциации, не подтверждённые данным предварительным источником.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокрифического заключения. Перевод предварительный: предоставлен англоязычный публичнодоменный свидетель, а прямая сверка с коптским текстом ещё не выполнена. Голые номера рукописных страниц и HTML-разметка не воспроизводятся.'
