review_pass:
  verdict: revise
  source_fidelity: Прямая сверка с коптским текстом в предоставленных материалах ещё не проведена; сверка выполнена с английским свидетельством. В целом черновик близок к нему и сохраняет скобочные восстановления, технические термины и космологическую неоднозначность. Однако в §9 глагол «показал» не соответствует свидетельству, где стоит «taught» («учил/наставлял»).
  naturalness: Русский текст в целом литературен и понятен. Небольшие уточнения в §3, §5 и §7 делают передачу точнее и естественнее, не меняя регистра.
  terminology: «Полнота», «эон», «архонт», «Матерь-Отец», «Провидение» и «недостаток» сохранены. Имя «Иалдаваоф» допустимо как русская передача Yaltabaoth. «Девятое» оставлено без догматического уточнения и снабжено сноской.
  issues:
  - severity: high
    issue: '§9: «Он также показал им»'
    rationale: Английское свидетельство прямо имеет «He also taught them». «Показал» вводит иной тип действия и не может быть оправдан лишь синтаксической неясностью последующего перечисления.
  - severity: medium
    issue: '§7: «от всей их Полноты»'
    rationale: Формулировка может восприниматься как источник-агент в неестественном русском смысле. «Из всей их Полноты» точнее передаёт «from their entire Fullness».
  - severity: low
    issue: '§3 и §5: ослабление отдельных лексических оттенков'
    rationale: «Получил силу» возможно, но «обрёл некую силу» ближе к indefinite «a power»; «одеяние тьмы было ущербно» точнее передаёт «was flawed», чем общее «несовершенно».
  revised_text: '1. Я же спросил: «Господи, что значит: “она двигалась туда и обратно”?» Он улыбнулся и сказал: «Не думай, что это соответствует сказанному Моисеем: “над {водами:2}”. Нет!


    2. Напротив, когда она увидела совершившееся зло и похищение, совершённое её сыном, она раскаялась. Внутри тьмы неведения её охватило забвение, и ей стало стыдно. [И она не осмеливалась] вернуться, но [двигалась] туда и сюда.


    3. Это движение и есть хождение туда и обратно. А гордец обрёл некую силу от своей матери, потому что пребывал в неведении и полагал, что, кроме его матери, никого не существует.


    4. Увидев сонм созданных им ангелов, он превознёсся над ними.


    5. Когда же мать поняла, что одеяние тьмы было ущербно, она осознала, что её спутник не был с ней согласен.


    6. Она раскаялась, горько плача, и вся Полнота услышала её молитву покаяния. Ради неё они воздали хвалу незримому девственному Духу.


