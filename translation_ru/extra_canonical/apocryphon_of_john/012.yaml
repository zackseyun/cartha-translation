base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/012.yaml
  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: ru
  text: '1. Я же спросил: «Господи, что значит: “она двигалась туда и обратно”?» Он улыбнулся и сказал: «Не думай, что это соответствует сказанному Моисеем: “над {водами:2}”. Нет!


    2. Когда она увидела совершившееся зло и то, что похитил её сын, она раскаялась. Внутри тьмы неведения её охватило забвение, и ей стало стыдно. [Она не осмеливалась] вернуться, но [двигалась] туда и сюда.


    3. Это движение и есть хождение туда и обратно. А гордец получил силу от своей матери, потому что пребывал в неведении и полагал, что, кроме его матери, никого не существует.


    4. Увидев сонм созданных им ангелов, он превознёсся над ними.


    5. Когда же мать поняла, что одеяние тьмы несовершенно, она осознала, что её спутник не был с ней согласен.


    6. Она раскаялась и горько плакала. Вся Полнота услышала её молитву покаяния, и ради неё они воздали хвалу незримому девственному Духу.


    7. И [он] согласился. Когда же [незримый Дух] согласился, святой Дух излился на неё от всей их Полноты. Ведь её спутник пришёл к ней не один, но посредством Полноты, чтобы исправить её недостаток. И она была вознесена — однако не в свой эон, а выше своего сына, — чтобы пребывать в Девятом[a], пока не исправит свой недостаток.


    8. Из высокого небесного эона также раздался голос: «Человек существует, и Сын Человека». Главный архонт, Иалдаваоф, услышал его и решил, что голос исходил от его матери, но не знал, откуда тот исходил.


    9. Он также показал им[b] священного и совершенного Матерь-Отца, совершенное Провидение, образ Незримого — Отца Всего, через которого всё возникло, Изначального Человека, — ибо явил своё подобие в мужском облике.


    10. Тогда весь эон главного архонта содрогнулся и основания бездны поколебались. Дно вод над материей озарилось явлением этого открывшегося образа. Когда все власти и главный архонт взглянули, они увидели, что вся область под ними озарена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Девятое» — буквальное порядковое обозначение области; подразумеваемое существительное в данном свидетельстве не названо.
    reason: Сохраняет неоднозначность космологического обозначения, не добавляя «эон» или «небо».
  - marker: b
    text: 'Синтаксис этого места неясен: выражение может также пониматься как «Он также учил их»; связь последующих наименований с глаголом допускает разные прочтения.'
    reason: Предупреждает читателя о реальной неопределённости раздела 9 в доступном свидетельстве.
lexical_decisions:
- source_word: Fullness
  choice: Полнота
  rationale: Сохраняет технический космологический смысл термина и связь с совокупностью высшего божественного мира, не подменяя его конфессиональной интерпретацией.
- source_word: aeon
  choice: эон
  rationale: Транслитерация сохраняет специальное значение в контексте произведения; обычное «век» здесь было бы двусмысленным и неточным.
- source_word: chief archon
  choice: главный архонт
  rationale: «Архонт» сохраняет техническое наименование космического властителя, а «главный» естественно передаёт иерархический смысл.
- source_word: Mother-Father
  choice: Матерь-Отец
  rationale: Составное именование сохранено без разрешения заложенного в нём сочетания материнского и отцовского образов.
- source_word: deficiency
  choice: недостаток
  rationale: Передаёт как состояние неполноты, так и нужду в исправлении, не навязывая позднейшей догматической терминологии.
- source_word: grinned
  choice: улыбнулся
  rationale: Естественное русское соответствие в возвышенном повествовательном регистре; «ухмыльнулся» внесло бы неодобрительный оттенок, которого контекст не требует.
- source_word: theft
  choice: то, что похитил
  rationale: Глагольная конструкция по-русски яснее связывает похищение с сыном, сохраняя предмет похищения неопределённым.
- source_word: Providence
  choice: Провидение
  rationale: Сохраняет персонифицированное космологическое именование и высокий регистр.
theological_decisions:
- issue: Неясный субъект в начале раздела 7
  choice: Сохранено «[он] согласился», а далее — «[незримый Дух] согласился»
  alternative: Унифицировать оба упоминания как незримого Духа или спутника
  rationale: Свидетель прямо отмечает восстановление и допускает неясность референта; перевод не должен молча устранять её.
- issue: Кто приближается к матери в разделе 7
  choice: Сохранён «её спутник», приходящий посредством Полноты
  alternative: Отождествить спутника с конкретной фигурой высшего мира
  rationale: Исходное свидетельство не даёт достаточных оснований для однозначного именования.
- issue: Высказывание «Человек существует, и Сын Человека»
  choice: Передано буквально с заглавными буквами
  alternative: Перефразировать как утверждение о небесном Человеке и его Сыне
  rationale: Буквальная форма сохраняет богословское напряжение, параллелизм и возможную титульность обоих выражений.
- issue: Синтаксис раздела 9
  choice: «Он также показал им» с примечанием о возможной синтаксической неоднозначности
  alternative: «Он также научил их» либо считать Матерь-Отца субъектом обучения
  rationale: Английское свидетельство синтаксически затруднено; выбранное чтение согласуется с последующим явлением образа, но не представляется как бесспорное.
- issue: «Девятое» как место пребывания
  choice: Субстантивированное «Девятое» сохранено и пояснено сноской
  alternative: «девятый эон» или «девятое небо»
  rationale: Свидетель не уточняет подразумеваемое существительное; добавление «эон» или «небо» преждевременно разрешило бы неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством апокрифического откровения. Технические термины «эон», «архонт», «Полнота» сохранены. Квадратные скобки и маркер {водами:2} воспроизведены как сигналы состояния свидетельства; голый номер страницы «14» опущен. Поскольку непосредственная сверка с коптским источником ещё не выполнена, проект основан на предоставленном публичном английском свидетельстве и не претендует на устранение его текстовых неясностей.
