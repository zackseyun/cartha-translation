  source_fidelity: 'Черновик в целом точно следует предоставленному английскому свидетелю и осторожно сохраняет его текстологические сигналы. Однако несколько решений излишне истолковательны или ослабляют лексику свидетеля: «непоколебимый» вместо «неподвижный», «великие вопросы» вместо возникших в уме «великих [мыслей/вещей]», «дух обмана» вместо «ложный дух», а также женское «через неё» при мужском местоимении английского свидетеля в ст. 16. В ст. 11 «улыбнулся» также смягчает более специфическое grinned.'
  naturalness: 'Русский текст литературен, связен и выдержан в возвышенно-нейтральном регистре. Уточнены отдельные места ради естественности без разъясняющего расширения: «состояние плотского существования» не превращается в «тяготы», а непрояснённый референт местоимения в ст. 16 не согласуется искусственно с ближайшим русским существительным.'
  terminology: Сохранены технические термины «Величие», «Нетленный», «эоны» и «архонт»; их краткие пояснения уместны. «Неподвижный род» и «ложный дух» точнее передают лексику свидетельства. Формулировка о «вековом наказании» сохраняет неоднозначность age-long и не предрешает вопрос о бесконечности наказания.
  issues:
  - severity: medium
    issue: 'Ст. 16: «Через неё она будет спасена»'
    rationale: Английский свидетель имеет мужское местоимение «through him». Согласование с русским словом «душа» создаёт не засвидетельствованную женскую референцию. Следует сохранить мужскую форму и пояснить неясность её антецедента.
  - severity: low
    issue: 'Ст. 2: «непоколебимый род» и «великие вопросы»'
    rationale: Unmoving означает прежде всего «неподвижный», а arisen in your mind не называет мысли именно вопросами. Более близкое «неподвижный род» и «великие мысли возникли» сохраняет образ и не добавляет содержания.
  - severity: low
    issue: 'Ст. 9: «дух обмана»'
    rationale: False spirit — «ложный дух». «Дух обмана» является допустимой интерпретацией, но сдвигает характеристику от ложности к функции обольщения.
  - severity: low
    issue: 'Ст. 11: «Он улыбнулся»'
    rationale: Grinned точнее передать как «усмехнулся»; это не обязательно доброжелательная улыбка.
  - severity: low
    issue: 'Ст. 4: «тяготы плотского существования»'
    rationale: Свидетель говорит о condition of fleshly existence, а не прямо о тяготах. «Состояние плотского существования» сохраняет менее нагруженную формулировку.
  revised_text: '1. Я также спросил Спасителя: «Господь, значит ли это, что все души будут благополучно приведены в чистый свет?»


    2. Он ответил мне: «В твоём уме возникли великие мысли, ведь объяснить их другим трудно — кроме тех, кто принадлежит к неподвижному роду[a].


    3. Те, на кого снизойдёт Дух жизни и кого он наделит силой, будут спасены и достигнут совершенства. Они станут достойны Величия[b], и там очистятся от всякого зла и от всякой причастности ко злу.


    4. Отныне их будет занимать лишь нетленность, и они сосредоточатся только на ней, без гнева, зависти, ревности, вожделения или алчности. Ничто не будет тревожить их, кроме состояния плотского существования; с ним они справятся, с надеждой ожидая времени, когда их встретят принимающие[c].


    5. Такие люди достойны нетленной вечной жизни и избрания, потому что всё преодолевают и всё терпят, чтобы завершить состязание и унаследовать вечную жизнь».


    6. Я спросил его: «Господь, а души тех, кто не совершал этих дел, хотя на них сошли сила ‹и› Дух жизни, будут ли [отвергнуты][d]?»


    7. Он ответил мне: «Если Дух сошёл на них, они всё же будут спасены и исправятся. Ведь сила сойдёт на всех людей, потому что без неё никто не может устоять.


    8. После рождения, по мере того как Дух жизни возрастает, а сила приходит и укрепляет душу, уже никто не сможет увлечь её злыми делами.


    9. Но те, на кого сходит ложный дух[e], влекомы им и сбиваются с пути».


    10. Я спросил: «Господь, когда их души покинут плоть, куда они пойдут?»


    11. Он усмехнулся и сказал мне: «Душа, в которой сила одолеет низменного духа, — ибо она сильна и бежит от зла, — будет спасена благодаря заступничеству Нетленного[f] и вознесена к покою эонов[g]».


    12. Я спросил: «Господь, а где будут пребывать души тех, кто не знал, кому принадлежит?»


    13. Он сказал мне: «Когда низменный дух набирает в них силу, они сбиваются с пути. Он отягощает душу и влечёт её к злым делам, низвергает в забвение; а когда она покидает тело, её передают властям, возникшим через архонта[h]. Они сковывают её цепями, бросают в темницу и сопровождают, пока она не пробудится от забвения и не обретёт знания. Если так она достигнет совершенства, то будет спасена».


    14. Я спросил: «Господь, как душа может умалиться и возвратиться в естественное состояние своей матери или в человека?»[i]


    15. Услышав мой вопрос, он обрадовался и сказал мне: «Воистину, ты блажен, потому что понял: такая душа будет поставлена вслед за другой[j], в которой обитает Дух жизни.


    16. Через него[k] она будет спасена


    17. и уже не будет брошена в иную плоть».


    18. Я также спросил: «Господь, куда пойдут души тех, кто знал, но отвернулся?»


    19. Он сказал мне: «Их отведут туда, куда идут ангелы нищеты[l], — в место, где нет покаяния. Там их будут держать до того дня, когда хулящие Духа подвергнутся мучению; и они понесут наказание, длящееся целый век[m]».'
  revised_footnotes:
  - marker: a
    text: «Неподвижный род» — техническое обозначение духовного сообщества в этом произведении; буквальный образ связан с неподвижностью.
    reason: Термин может быть ошибочно понят как обычная этническая группа.
  - marker: b
    text: «Величие» здесь, вероятно, служит титулом высшей божественной реальности.
    reason: Прописная буква и титульное употребление требуют пояснения.
  - marker: c
    text: Кто именно назван «принимающими», в данном месте не уточняется.
    reason: Сохранена неопределённость технического обозначения.
  - marker: d
    text: Угловые скобки в ‹и› отмечают редакционное добавление, а квадратные скобки в [отвергнуты] — восстановление не вполне сохранившегося текста в используемом свидетеле.
    reason: Необходимо сохранить предоставленные сигналы текстологической неуверенности.
  - marker: e
    text: 'Возможна более свободная передача: «дух обмана».'
    reason: Основной текст ближе следует характеристике false («ложный»), не исключая оттенка обольщения.
  - marker: f
    text: «Нетленный» — титульное обозначение; кому именно оно относится, здесь прямо не сказано.
    reason: Следует избежать безосновательной идентификации фигуры.
  - marker: g
    text: Эоны — небесные или надмирные области либо порядки бытия в космологии произведения.
    reason: Технический термин малознаком обычному читателю.
  - marker: h
    text: Архонт — «правитель», название космической властной сущности в понятийном мире этого текста.
    reason: Транслитерированный термин нуждается в кратком пояснении.
  - marker: i
    text: 'Формулировка вопроса трудна и, возможно, отражает повреждение или неоднозначность текста: неясно, что именно означает возвращение «в естественное состояние своей матери» или «в человека».'
    reason: Прямой анализ коптских свидетелей ещё не выполнен, поэтому неясность нельзя сглаживать.
  - marker: j
    text: Выражение «будет поставлена вслед за другой» неясно; оно может подразумевать, что душа последует за другой душой или займёт её место.
    reason: Английский свидетель допускает несколько синтаксических и концептуальных прочтений.
  - marker: k
    text: В свидетеле стоит местоимение мужского рода со значением «через него»; оно может относиться к другой душе, человеку или носителю Духа жизни.
    reason: Сохранение подлинной референциальной неоднозначности без искусственного согласования с русским словом «душа».
  - marker: l
    text: Возможны также переводы «ангелы нужды» или «ангелы лишения».
    reason: Слово destitution имеет несколько близких значений, а терминологический контекст не позволяет уверенно выбрать одно.
  - marker: m
    text: 'Буквально: «наказанием века» или «вековым наказанием»; выражение само по себе не устраняет вопрос, имеется ли в виду один эон, неопределённо долгий срок или вечность.'
    reason: Необходимо сохранить богословскую и лексическую неоднозначность длительности наказания.
  revision_rationale: Внесены безопасные правки, приближающие русский текст к лексике предоставленного свидетеля и устраняющие ненадёжное разрешение местоименной неоднозначности в ст. 16. Все сохранённые редакционные сигналы, технические термины и существенные неясности переданы в тексте и сносках. Поскольку непосредственная коптская сверка в материалах отсутствует, трудные места не были догматически или концептуально гармонизированы.
