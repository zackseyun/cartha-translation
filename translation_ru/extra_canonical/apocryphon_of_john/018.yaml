translation:
  language: ru
  text: '1. Я также спросил Спасителя: «Господь, значит ли это, что все души будут благополучно приведены в чистый свет?»


    2. Он ответил мне: «В твоём уме возникли великие вопросы, ведь объяснить их другим трудно — кроме тех, кто принадлежит к непоколебимому роду[a].


    3. Те, на кого снизойдёт Дух жизни и кого он наделит силой, будут спасены и достигнут совершенства. Они станут достойны Величия[b], и там очистятся от всякого зла и от всякой причастности ко злу.


    4. Отныне их будет занимать лишь нетленность, и они сосредоточатся только на ней, без гнева, зависти, ревности, вожделения или алчности. Ничто не будет тревожить их, кроме тягот плотского существования; их они будут переносить, с надеждой ожидая времени, когда их встретят принимающие[c].


    5. Такие люди достойны нетленной вечной жизни и избрания, потому что всё преодолевают и всё терпят, чтобы завершить состязание и унаследовать вечную жизнь».


    6. Я спросил его: «Господь, а души тех, кто не совершал этих дел, хотя на них сошли сила ‹и› Дух жизни, будут ли [отвергнуты][d]?»


    7. Он ответил мне: «Если Дух сошёл на них, они всё же будут спасены и изменятся к лучшему. Ведь сила сойдёт на всех людей, потому что без неё никто не может устоять.


    8. После рождения, по мере того как Дух жизни возрастает, а сила приходит и укрепляет душу, уже никто не сможет увлечь её злыми делами.


    9. Но те, на кого сходит дух обмана[e], влекомы им и сбиваются с пути».


    10. Я спросил: «Господь, когда их души покинут плоть, куда они пойдут?»


    11. Он улыбнулся и сказал мне: «Душа, в которой сила одолеет низменного духа, — ибо она сильна и бежит от зла, — будет спасена благодаря заступничеству Нетленного[f] и вознесена к покою эонов[g]».


    12. Я спросил: «Господь, а где будут пребывать души тех, кто не знал, кому принадлежит?»


    13. Он сказал мне: «Когда низменный дух набирает в них силу, они сбиваются с пути. Он отягощает душу и влечёт её к злым делам, низвергает в забвение; а когда она покидает тело, её передают властям, возникшим через архонта[h]. Они сковывают её цепями, бросают в темницу и сопровождают, пока она не пробудится от забвения и не обретёт знания. Если так она достигнет совершенства, то будет спасена».


    14. Я спросил: «Господь, как душа может умалиться и возвратиться в естественное состояние своей матери или в человека?»[i]


    15. Услышав мой вопрос, он обрадовался и сказал мне: «Воистину, ты блажен, потому что понял: такая душа будет помещена вслед за другой[j], в которой обитает Дух жизни.


    16. Через неё[k] она будет спасена


    17. и уже не будет брошена в иную плоть».


    18. Я также спросил: «Господь, куда пойдут души тех, кто знал, но отвернулся?»


    19. Он сказал мне: «Их отведут туда, куда идут ангелы нищеты[l], — в место, где нет покаяния. Там их будут держать до того дня, когда хулящие Духа подвергнутся мучению; и они понесут наказание, длящееся целый век[m]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Непоколебимый род» — техническое обозначение духовного сообщества в этом произведении; буквальное значение выражения связано с неподвижностью или непоколебимостью.
    reason: Термин может быть ошибочно понят как обычная этническая группа.
  - marker: b
    text: «Величие» здесь, вероятно, служит титулом высшей божественной реальности.
    reason: Прописная буква и титульное употребление требуют пояснения.
  - marker: c
    text: Кто именно назван «принимающими», в данном месте не уточняется.
    reason: Сохранена неопределённость технического обозначения.
  - marker: d
    text: Угловые скобки в ‹и› отмечают редакционное добавление, а квадратные скобки в [отвергнуты] — восстановление не вполне сохранившегося текста в используемом свидетеле.
    reason: Необходимо сохранить предоставленные сигналы текстологической неуверенности.
  - marker: e
    text: 'Возможна более буквальная передача: «ложный дух».'
    reason: «Дух обмана» выбран ради естественности, но исходная характеристика допускает иной оттенок.
  - marker: f
    text: «Нетленный» — титульное обозначение; кому именно оно относится, здесь прямо не сказано.
    reason: Следует избежать безосновательной идентификации фигуры.
  - marker: g
    text: Эоны — небесные или надмирные области либо порядки бытия в космологии произведения.
    reason: Технический термин малознаком обычному читателю.
  - marker: h
    text: Архонт — «правитель», название космической властной сущности в понятийном мире этого текста.
    reason: Транслитерированный термин нуждается в кратком пояснении.
  - marker: i
    text: 'Формулировка вопроса трудна и, возможно, отражает повреждение или неоднозначность текста: неясно, что именно означает возвращение «в естественное состояние своей матери» или «в человека».'
    reason: Прямой анализ коптских свидетелей ещё не выполнен, поэтому неясность нельзя сглаживать.
  - marker: j
    text: Выражение «помещена вслед за другой» неясно; оно может подразумевать, что душа последует за другой душой или займёт её место.
    reason: Английский свидетель допускает несколько синтаксических и концептуальных прочтений.
  - marker: k
    text: В свидетеле стоит местоимение со значением «через него/неё»; оно может относиться к другой душе, человеку или носителю Духа жизни.
    reason: Сохранение подлинной референциальной неоднозначности.
  - marker: l
    text: Возможны также переводы «ангелы нужды» или «ангелы лишения».
    reason: Слово destitution имеет несколько близких значений, а терминологический контекст не позволяет уверенно выбрать одно.
  - marker: m
    text: 'Буквально: «наказанием века» или «вековым наказанием»; выражение само по себе не устраняет вопрос, имеется ли в виду один эон, неопределённо долгий срок или вечность.'
    reason: Необходимо сохранить богословскую и лексическую неоднозначность длительности наказания.
lexical_decisions:
- source_word: unmoving race
  choice: непоколебимый род
  rationale: Сохранён характерный для произведения технический образ; «непоколебимый» естественнее по-русски, чем буквальное «недвижимый», и не сводит выражение к этнической категории.
- source_word: Greatness
  choice: Величие
  rationale: Передано как титульное обозначение высшей божественной реальности с прописной буквы, без конфессионального истолкования.
- source_word: receivers
  choice: принимающие
  rationale: Сохранена функциональная и намеренно неопределённая формулировка свидетеля; не добавлено, кем именно являются эти существа.
- source_word: false spirit
  choice: дух обмана
  rationale: Естественная русская передача, сохраняющая противопоставление Духу жизни и не превращающая выражение в позднейший догматический термин.
- source_word: vile spirit
  choice: низменный дух
  rationale: Передаёт нравственно уничижительную окраску и отличает выражение от «духа обмана», поскольку английский свидетель использует разные определения.
- source_word: indestructible one
  choice: Нетленный
  rationale: Субстантивированное титульное обозначение сохранено без уточнения личности или ипостаси.
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический космологический термин текста, а не заменён более привычным, но толковательным словом «веки».
- source_word: archon
  choice: архонт
  rationale: Технический термин гностической космологии транслитерирован, чтобы не смешивать его с обычными земными правителями.
- source_word: age-long punishment
  choice: наказание, длящееся целый век
  rationale: Сохранена временная лексика «века» и не навязано толкование как безусловно бесконечного наказания.
theological_decisions:
- issue: Всеобщность действия силы и спасение
  choice: «сила сойдёт на всех людей» и условное описание последующего спасения сохранены
  alternative: Согласовать текст с системой всеобщего либо ограниченного спасения
  rationale: Свидетель содержит напряжение между всеобщим нисхождением силы, спасением получивших Духа и осуждением отвернувшихся; перевод не разрешает его догматически.
- issue: Посмертное исправление через пробуждение и знание
  choice: Сохранена последовательность темницы, пробуждения, знания, совершенства и спасения
  alternative: Истолковать её как чистилище, реинкарнацию либо символ земного обращения
  rationale: Сам отрывок не даёт основания однозначно отождествлять описанный процесс с более поздней конфессиональной схемой.
- issue: Возвращение души и «иная плоть»
  choice: Неясный язык сохранён с редакционной сноской
  alternative: Прямо перевести как переселение душ или новое рождение
  rationale: Формулировка свидетеля повреждена или трудна, а прямой коптский анализ пока не проведён; категоричное толкование было бы преждевременным.
- issue: Местоимение в стихе 16
  choice: «через неё» с указанием двусмысленности
  alternative: «через него» — через человека или носителя Духа
  rationale: В доступном английском свидетеле местоимение допускает несколько соотнесений; русский основной текст согласован с ближайшим словом «душа», но неопределённость отмечена.
- issue: Длительность последнего наказания
  choice: «длящееся целый век»
  alternative: «вечное наказание»
  rationale: Формулировка age-long допускает связь с эоном/веком; перевод не должен без основания решать спор о бесконечности наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством диалогического откровения. Синтаксис умеренно упрощён ради ясности, но технические термины и повторяющиеся противопоставления сохранены. Черновик основан на предоставленном публично-доступном английском свидетеле; прямая сверка с коптскими рукописями Nag Hammadi II,1; III,1; IV,1 и Berlin Codex 8502,2 остаётся необходимой.
