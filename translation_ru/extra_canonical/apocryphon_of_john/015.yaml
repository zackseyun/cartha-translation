translation:
  language: ru
  text: '1. Когда они посмотрели вниз, то поняли, что его разум превосходит их собственный, и собрались на совет вместе со всем сонмом архонтов и всеми ангелами.


    2. Они взяли огонь, землю и воду, соединили их друг с другом и с четырьмя огненными ветрами, смешали всё вместе с великим шумом и увлекли его в тень смерти, чтобы снова создать его из земли, воды, огня и ветра — того, чьё происхождение в материи, то есть в неведении тьмы, вожделении и их лживом духе.


    3. Это гробница телесного слепка, в которую разбойники облекли человека, — цепь забвения; и он стал смертным человеком.


    4. Он — первый сошедший и первое разделение. Но Мысль Света, обитавшая в нём, пробудила его разум.


    5. Затем архонты привели его и поместили в раю. Они сказали ему: «Ешь», подразумевая: «Пребывай в праздности». Ведь их наслаждение горько, их красота испорчена, их удовольствие — обман, их деревья — безбожие, их плод — неисцелимый яд, а их обещание — смерть.


    6. Своё же дерево жизни они поместили посреди рая. И я открою вам тайну их жизни: это замысел, который они составили сообща, подобие их духа.


    7. Корень его горек, ветви его — смерть, тень его — ненависть, в листьях его обитает обман, цвет его — злое помазание, плод его — смерть, семя его — вожделение, и распускается оно во тьме.


    8. Обитель вкусивших от него — ад, а место их покоя — тьма.


    9. Но перед тем, что они называют «деревом познания добра и зла», пребывала Мысль Света, чтобы он не мог воззреть к своему совершенству и осознать постыдность своей наготы.[a] Я же побудил их вкусить».


    10. Я спросил Спасителя: «Господи, разве не змей научил Адама вкусить?»


    11. Спаситель усмехнулся и сказал: «Змей научил их вкусить зло полового вожделения и погибели, чтобы воспользоваться им.


    12. Далее, он знал, что тот не повинуется ему из-за обитающей в нём Мысли Света, благодаря которой его разум стал проницательнее разума главного архонта. И он пожелал извлечь силу, которую сам дал ему, и навёл на Адама “исступление”».[b]


    13. Я снова спросил Спасителя: «Что такое “исступление”?»


    14. Он ответил: «Это не то, что написал Моисей, и не то, что вы слышали. Ведь в своей первой книге он сказал: “Он погрузил его в сон”. Но на самом деле он усыпил его восприятие. Ибо через пророка он сказал: “Я сделаю их сердца нечувствительными, чтобы они не внимали и не видели”».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Синтаксис этого места неясен: выражение о Мысли Света может относиться к тому, кто пребывал перед деревом; также не вполне ясно, с какой целью это делалось. Перевод сохраняет напряжение предоставленного свидетельства.'
    reason: Необходимо обозначить реальную синтаксическую и смысловую неоднозначность, не исправляя её догадкой.
  - marker: b
    text: Местоимения в этом предложении неоднозначны. Вероятно, речь идёт о главном архонте и Адаме, однако перевод не подставляет эти имена там, где свидетельство их прямо не называет.
    reason: Сохраняется неопределённость референтов, отмеченная в исходных данных.
  - marker: c
    text: Цитата передана по форме данного произведения; её словесный вид не полностью совпадает с привычными русскими переводами библейских пророков.
    reason: Предотвращает искусственную гармонизацию внутренней цитаты с каноническими редакциями.
lexical_decisions:
- source_word: intellect
  choice: разум
  rationale: Естественный современный эквивалент, сохраняющий акцент на способности понимания и различения; «интеллект» здесь звучал бы излишне технически.
- source_word: archons
  choice: архонты
  rationale: Сохранён традиционный термин космологии произведения, поскольку нейтральное «правители» могло бы стереть его специальный смысл.
- source_word: Reflection of Light
  choice: Мысль Света
  rationale: Передаёт персонифицированную внутреннюю просветляющую реальность; буквальное «Отражение Света» возможно, но в данном контексте менее ясно выражает деятельность пробуждающего помышления.
- source_word: mold of the body
  choice: телесный слепок
  rationale: Сохраняет образ сформированной материальной оболочки, не отождествляя её без оговорок с телом как таковым.
- source_word: trance
  choice: исступление
  rationale: Передаёт необычное изменённое состояние, отличаемое текстом от обычного сна; термин оставлен в кавычках из-за последующего авторского толкования.
- source_word: Hades
  choice: ад
  rationale: Понятное русскому читателю обозначение подземной обители умерших; выбор не должен пониматься как позднейшая систематическая доктрина о посмертном наказании.
- source_word: perception
  choice: восприятие
  rationale: Сохраняет противопоставление физического сна усыплению познавательной способности.
theological_decisions:
- issue: Природа телесного создания человека
  choice: Сохранена негативная образность гробницы, цепи забвения и материального происхождения.
  alternative: Смягчить формулировки в соответствии с каноническим повествованием о благом сотворении тела.
  rationale: Текст выражает собственную космологическую напряжённость; её нельзя гармонизировать с иной богословской системой.
- issue: Личность говорящего в стихе 9
  choice: Сохранено первое лицо «Я же побудил их вкусить» без идентификации.
  alternative: Явно назвать говорящего Христом, Спасителем или Мыслью Света.
  rationale: Предоставленное свидетельство оставляет переход и референт первого лица не вполне ясными.
- issue: Референты местоимений в стихе 12
  choice: Сохранены неоднозначные «он», «тот», «ему» с минимальным синтаксическим прояснением.
  alternative: Везде подставить «главный архонт» и «Адам».
  rationale: Исходное свидетельство специально отмечает неоднозначность местоимений; без коптского пересмотра нельзя уверенно устранить её.
- issue: Роль змея
  choice: Змей представлен как наставляющий к половому вожделению и погибели, тогда как вкушение от дерева связывается с говорящим.
  alternative: Свести оба действия к одному побуждению к вкушению запретного плода.
  rationale: Различение является существенной богословской особенностью данного текста и должно быть сохранено.
- issue: Пол Мысли Света
  choice: Название и согласование переданы в женском роде.
  alternative: Использовать мужской или грамматически нейтральный образ.
  rationale: Английское свидетельство прямо использует женское местоимение; русский эквивалент «Мысль» естественно сохраняет это согласование.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной архаической окраской только в устойчивых религиозных выражениях. Специальный термин «архонты» сохранён. Номера рукописных страниц и редакционные фигурные маркеры удалены. Поскольку прямой пересмотр коптского текста ещё не выполнен, спорные места не нормализованы сверх данных публичного английского свидетельства.
