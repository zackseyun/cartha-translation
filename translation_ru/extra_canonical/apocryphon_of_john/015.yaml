review_pass:
  verdict: revise
  source_fidelity: Перевод в целом точно передаёт предоставленное английское свидетельство и осторожно сохраняет его нестабильные референты. Однако «ад» в ст. 8 неоправданно конкретизирует Hades и вносит позднейшую богословскую окраску; следует сохранить «Аид». В ст. 3 синтаксическая связь образа телесного слепка с «гробницей» нуждается в более точном оформлении. «Исступление» для trance слишком сильно предполагает экстатическое или неистовое состояние; нейтральное «транс» лучше сохраняет терминологическую неопределённость.
  naturalness: 'Русский текст в основном литературен и связен. Уточнены несколько тяжеловесных или семантически чрезмерных формулировок: «увлекли» заменено нейтральным «ввели», «испорчена» — «вырождена», а формула о телесном слепке перестроена, чтобы не создавать впечатления, будто человека облекли в саму гробницу.'
  terminology: «Архонты», «Мысль Света», «помазание» и «восприятие» приемлемы в рамках данного свидетельства. Hades передан как «Аид», а trance — как взятое в кавычки «транс», без интерпретации как обычного сна либо религиозного экстаза. «Смертность» последовательно передаёт mortality.
  issues:
  - severity: medium
    issue: Hades передан как «ад» (ст. 8).
    rationale: «Ад» в современном русском обычно вызывает ассоциации с посмертным местом наказания. Свидетельство называет Hades; «Аид» точнее сохраняет античный термин и не добавляет доктринального смысла.
  - severity: medium
    issue: «Исступление» передаёт trance (ст. 12).
    rationale: «Исступление» предполагает неистовство или экстаз, чего английское свидетельство не уточняет. «Транс» нейтральнее и сохраняет необычность состояния, противопоставленного сну.
  - severity: low
    issue: Синтаксис ст. 3 делает гробницу местом, «в которую» облекли человека.
    rationale: В свидетельстве гробница характеризуется как относящаяся к телесному слепку, которым разбойники облекли человека. Перестройка фразы точнее сохраняет образ и естественнее звучит по-русски.
  - severity: low
    issue: «Смерть» используется там, где свидетельство повторяет mortality (ст. 5, 7).
    rationale: «Смертность» лучше передаёт состояние/удел смертного, не смешивая его с событием смерти.
  revised_text: '1. Когда они посмотрели вниз, то поняли, что его разум превосходит их собственный, и собрались на совет вместе со всем сонмом архонтов и всеми ангелами.


    2. Они взяли огонь, землю и воду, соединили их друг с другом и с четырьмя огненными ветрами, смешали всё это с великим шумом и ввели его в тень смерти, чтобы снова создать его из земли, воды, огня и ветра — того, чьё происхождение в материи, то есть в неведении тьмы, вожделении и их ложном духе.


    3. Это — гробница телесного слепка, которым разбойники облекли человека, цепь забвения; и он стал смертным человеком.


    4. Он — первый сошедший и первое разделение. Но Мысль Света, обитавшая в нём, пробудила его разум.


    5. Затем архонты привели его и поместили в раю. Они сказали ему: «Ешь», подразумевая: «Пребывай в праздности». Ведь их наслаждение горько, их красота вырождена, их удовольствие — обман, их деревья — безбожие, их плод — неисцелимый яд, а их обещание — смертность.


    6. Своё же дерево жизни они поместили посреди рая. И я открою вам тайну их жизни: это замысел, который они составили сообща, подобие их духа.


    7. Корень его горек, ветви его — смертность, тень его — ненависть, в листьях его обитает обман, цвет его — злое помазание, плод его — смертность, семя его — вожделение, и распускается оно во тьме.


    8. Обитель вкусивших от него — Аид, а место их покоя — тьма.


    9. Но перед тем, что они называют «деревом познания добра и зла», пребывала Мысль Света, чтобы он не мог воззреть к своему совершенству и осознать постыдность своей наготы.[a] Я же побудил их вкусить».


