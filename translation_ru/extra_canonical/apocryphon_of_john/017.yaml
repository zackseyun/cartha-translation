  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: ru
  text: '**Апокриф Иоанна — Верховный архонт оскверняет Еву**


    1. Я явился в образе орла на дереве познания, которое есть Помышление[a] Промысла Чистого Света, чтобы наставить их и пробудить от глубокого сна, потому что оба пребывали в падшем состоянии и осознавали свою наготу.


    2. Помышление явилось им как свет и пробудило их разум. Но когда Иалдаваоф[b] понял, что они отдалились от него, он проклял свою землю.


    3. Он встретил женщину, когда она готовилась к своему мужу.


    4. Он был её властелином, хотя и не знал тайны, совершившейся по священному установлению. Они боялись обвинить его. Он показал своим ангелам неведение, которое было в нём, изгнал их из рая и облёк в мрачную тьму.


    5. Верховный архонт увидел также деву, стоявшую рядом с Адамом, и увидел, что в ней явилось сияющее Помышление Жизни. Иалдаваоф исполнился неведения. Когда Промысл Всего увидела это, она послала вестников, и те поспешно извлекли Жизнь из Евы.


    6. Тогда верховный архонт осквернил её и породил от неё двух сыновей, первого и второго: Элоима и Яве.


    7. У Элоима лицо медведя, а у Яве — лицо кошки.


    8. Яве справедлив, а Элоим несправедлив.


    9. Яве был поставлен над огнём и ветром, а Элоим — над водой и землёй. Но, желая обмануть, он назвал их Каином и Авелем.


    10. По вине верховного архонта половое соитие продолжается доныне. Именно он вложил половую страсть в женщину, принадлежащую Адаму. Через соитие он создавал копии тел и вдыхал в них свой ложный дух.


    11. Этих двух архонтов он поставил над несколькими властями, чтобы они правили над гробницей[c].


    12. Но когда Адам осознал подобие собственного предведения, он породил подобие Сына Человеческого и назвал его Сифом — согласно тому, как этот род существует среди эонов.


    13. Подобным образом и Мать ниспослала свой дух, который является её собственным подобием, а также образ того, кто обитает в Полноте[d], потому что она приготовит жилище для эонов, которым предстоит сойти.


    14. Он также заставил их испить воду забвения, исходящую от верховного архонта, чтобы они не знали места своего происхождения.


    15. Так семя оставалось некоторое время ради помощи[e], чтобы, когда Дух изойдёт из священных эонов, он поднял семя и исцелил его ущербность, дабы вся Полнота стала святой и безупречной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Помышление» здесь — персонифицированная духовная реальность; возможны также переводы «Мысль» или «Размышление».
    reason: Техническое значение слова шире обычного русского «помышления» и допускает несколько эквивалентов.
  - marker: b
    text: Начальная буква имени Иалдаваоф восстановлена в используемом английском свидетельстве; прямая сверка с коптскими рукописями ещё предстоит.
    reason: Угловые скобки в предоставленном свидетельстве обозначают редакционное восстановление.
  - marker: c
    text: «Гробница» может быть образом телесного или космического узилища, однако перевод сохраняет буквальное выражение текста.
    reason: Важно не превращать возможную метафору в однозначное толкование.
  - marker: d
    text: «Полнота» — техническое обозначение высшей божественной реальности, часто передаваемое словом «Плерома».
    reason: Поясняет термин без внесения толкования в основной текст.
  - marker: e
    text: 'Фраза «ради помощи» в доступном свидетельстве синтаксически неясна; возможен смысл: семя пребывало некоторое время, пока ему не пришла помощь.'
    reason: Сохраняет реальную неоднозначность промежуточного английского свидетельства до прямой проверки коптского текста.
lexical_decisions:
- source_word: Reflection
  choice: Помышление
  rationale: Передаёт персонифицированную мыслительную реальность и сохраняет связь с пробуждением разума; слово оформлено с прописной буквы как техническое наименование.
- source_word: Providence
  choice: Промысл
  rationale: Достоинственный и понятный русский эквивалент персонифицированного провидения; грамматический женский род последующих местоимений сохранён по свидетельству текста через форму «Промысл ... она».
- source_word: chief archon
  choice: верховный архонт
  rationale: Сохраняет специальный термин «архонт», а chief передаёт как верховенство, не отождествляя персонажа с иными богословскими категориями.
- source_word: polluted
  choice: осквернил
  rationale: Сохраняет резкую культово-нравственную семантику исходного свидетельства и не уточняет насильственный или ритуальный характер действия сверх текста.
- source_word: Fullness
  choice: Полнота
  rationale: Буквальный и устоявшийся русский эквивалент гностического технического понятия; прописная буква показывает терминологическое употребление.
- source_word: simulacrum
  choice: образ
  rationale: Естественное русское слово, сохраняющее значение отображения или подобия без заведомо отрицательного оттенка слова «подделка».
- source_word: tomb
  choice: гробница
  rationale: Сохраняет конкретную погребальную метафору и её возможное символическое напряжение, не заменяя её толкованием «тело» или «мир».
- source_word: deficiency
  choice: ущербность
  rationale: Передаёт состояние недостаточности или изъяна, не сводя его к моральной вине.
theological_decisions:
- issue: Личность девы возле Адама
  choice: Сохранено обозначение «дева» без отождествления с Евой или отдельной ипостасью.
  alternative: Пояснить её как духовную Еву либо как Помышление Жизни.
  rationale: Свидетельство различает обозначения, но не разрешает их соотношение в данном отрывке.
- issue: Характер осквернения женщины
  choice: Передано нейтрально-резким глаголом «осквернил».
  alternative: Уточнить как изнасилование или совращение.
  rationale: Контекст имеет сексуальный характер, однако представленное исходное свидетельство не даёт основания вводить более узкую формулировку.
- issue: Соотношение Элоима, Яве, Каина и Авеля
  choice: Сохранено утверждение текста, что архонт обманно дал двум существам имена Каин и Авель.
  alternative: Согласовать имена с каноническим повествованием или пояснить их как символы.
  rationale: Необычное отождествление является существенной богословской особенностью самого апокрифа и не должно сглаживаться.
- issue: Референт местоимений в заключении
  choice: «Он поднял семя и исцелил его ущербность».
  alternative: Отнести местоимение к отдельному человеку или духовному потомству.
  rationale: Явное повторение «семя» делает русский текст понятнее, но сохраняет коллективно-единственное обозначение и не определяет его природу.
- issue: Грамматический род персонифицированного Промысла
  choice: Сохранено женское местоимение «она», несмотря на мужской род русского существительного «Промысл».
  alternative: Заменить на «Провидение» среднего рода или согласовать местоимение по-русски как «он».
  rationale: Женская персонификация существенна для повествования; намеренное рассогласование отмечает, что речь идёт о личностной фигуре, а не только об абстрактном понятии.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокрифического откровения. Специальные термины «архонт», «эон», «Помышление» и «Полнота» сохранены, но синтаксис сделан доступным обычному читателю. Нумерация соответствует предоставленным смысловым единицам; голые рукописные номера страниц 24 и 25 удалены как прерывающие предложения. Проект предварительный: предоставлена английская публично-доменная передача, а непосредственная сверка с коптскими свидетелями Nag Hammadi II,1; III,1; IV,1 и Berlin Codex 8502,2 ожидается.'
