review_pass:
  verdict: revise
  source_fidelity: 'Проект в целом точно следует предоставленному англоязычному свидетельству. Нужны точечные исправления: «исходящую от верховного архонта» в ст. 14 добавляет значение, которого в свидетельстве нет; «вдыхал» в ст. 10 излишне конкретизирует способ наделения ложным духом; терминологическая связка «Помышление Промысла» звучит неестественно и создаёт грамматическое напряжение с женской персонификацией.'
  naturalness: Русский текст в основном литературен и понятен, но «готовилась к своему мужу», «подобие собственного предведения» и «ради помощи» требуют более естественной формулировки без потери неопределённости. «Мысль Провидения» — современнее и прозрачнее, чем «Помышление Промысла», при сохранении технического характера термина.
  terminology: «Верховный архонт», «эоны», «Полнота», «гробница» и «ущербность» сохранены удачно. «Мысль» с примечанием является безопасным эквивалентом Reflection в рамках имеющегося английского свидетельства; прямая коптская сверка всё ещё необходима. Имя Иалдаваоф и необычное соотнесение Элоима и Яве с Каином и Авелем сохраняются без гармонизации.
  issues:
  - severity: medium
    issue: 'В ст. 14 добавлено значение происхождения воды: «исходящую от верховного архонта».'
    rationale: Свидетельство говорит «water of oblivion from the chief archon»; предлог «от» допускает несколько связей, но не утверждает, что вода именно исходит от него.
  - severity: low
    issue: В ст. 10 глагол «вдыхал» излишне конкретизирует «inspired them with his false spirit».
    rationale: Вдохновение/вселение не обязательно описано как буквальное вдыхание; «наделял их своим ложным духом» передаёт смысл без добавленной образности.
  - severity: low
    issue: «Помышление Промысла» и женское «она» при мужском «Промысл» создают стилистически тяжёлую конструкцию.
    rationale: «Мысль Провидения» сохраняет персонифицированную женскую фигуру и лучше соответствует нормам современного литературного русского.
  - severity: low
    issue: «Ради помощи» в ст. 15 неестественно по-русски.
    rationale: Фраза остаётся синтаксически неясной в английском свидетельстве, но «чтобы помочь» сохраняет её основное значение и не вводит нового толкования.
  revised_text: '**Апокриф Иоанна — Верховный архонт оскверняет Еву**


    1. Я явился в образе орла на дереве познания, которое есть Мысль[a] Провидения Чистого Света, чтобы наставить их и пробудить от глубокого сна, потому что оба пребывали в падшем состоянии и осознавали свою наготу.


    2. Мысль явилась им как свет и пробудила их разум. Но когда Иалдаваоф[b] понял, что они отдалились от него, он проклял свою землю.


    3. Он встретил женщину, когда она готовилась к встрече со своим мужем.


    4. Он был её властелином, хотя и не знал тайны, совершившейся по священному установлению. Они боялись обвинить его. Он показал своим ангелам неведение, которое было в нём, изгнал их из рая и облёк в мрачную тьму.


    5. Верховный архонт увидел также деву, стоявшую рядом с Адамом, и увидел, что в ней явилась сияющая Мысль Жизни. Иалдаваоф исполнился неведения. Когда Провидение Всего увидело это, оно послало вестников, и те поспешно извлекли Жизнь из Евы.


    6. Тогда верховный архонт осквернил её и стал отцом двух сыновей, первого и второго: Элоима и Яве.


    7. У Элоима лицо медведя, а у Яве — лицо кошки.


    8. Яве справедлив, а Элоим несправедлив.


    9. Яве был поставлен над огнём и ветром, а Элоим — над водой и землёй. Но, желая обмануть, он дал им имена Каин и Авель.


    10. По вине верховного архонта половое соитие продолжается доныне. Именно он вложил половую страсть в женщину, принадлежащую Адаму. Через соитие он создавал подобия тел и наделял их своим ложным духом.


    11. Этих двух архонтов он поставил над несколькими властями, чтобы они правили над гробницей[c].


    12. Но когда Адам осознал подобие своего предзнания, он породил подобие Сына Человеческого и назвал его Сифом — согласно тому, как этот род существует среди эонов.


    13. Подобным образом и Мать ниспослала свой дух, который является её собственным подобием, а также образ Того, кто обитает в Полноте[d], потому что она приготовит жилище для эонов, которым предстоит сойти.


    14. Он также заставил их испить воду забвения от верховного архонта, чтобы они не знали места своего происхождения.


    15. Так семя оставалось некоторое время, чтобы помочь[e], чтобы, когда Дух изойдёт из священных эонов, он поднял семя и исцелил его ущербность, дабы вся Полнота стала святой и безупречной».'
