review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетелю и сохраняет квадратные скобки как показатель восстановленного/неуверенно читаемого текста. Однако «[были не разные существа]» превращает отрицание «not a diverse entity» в утверждение о нескольких существах и потому требует исправления. «Родственным тебе духам» добавляет смысл родства, которого в companion нет; также «это» сужает множественное «things».
  naturalness: 'Регистр в целом естественный, современный и уместно возвышенный. Уточнены несколько оборотов: «в свете увидел ребёнка» сделано синтаксически прозрачнее, «не падай духом» заменено на более близкое к «do not be of a weak heart» «не малодушествуй», а описание взаимопроникновения подобий сформулировано без неестественной конструкции «одно через другое».'
  terminology: «Отец», «Мать», «Сын», «Совершенный Человек», «образ» и «облики» сохранены без доктринального истолкования. «Непоколебимый род» допустим как предварительная передача unmoving race, хотя сверка с коптским остаётся желательной. Примечание к «сыну» сохраняет нераскрытый характер знака в английском свидетеле.
  issues:
  - severity: medium
    issue: «Передо мной [были не разные существа]»
    rationale: Источник говорит об одном явлении, которое «was not a diverse entity», а не просто отрицает наличие разных существ во множественном числе. Формулировка «[не было нескольких различных существ]» лучше сохраняет противопоставление единого явления множеству форм.
  - severity: medium
    issue: «родственным тебе духам» для companion spirits
    rationale: «Родственным» в русском вводит семантику кровного или сущностного родства. «Собратьям-духам» передаёт спутников/товарищей без этого добавления.
  - severity: low
    issue: «передать это»
    rationale: Указательное «это» может относиться к единственному сообщению, тогда как источник говорит о «things»; «передать им это» возможно, но «передать им сказанное» сохраняет охват сообщаемого без лишней конкретизации.
  revised_text: 'Тотчас, [пока я размышлял об этом], вот, [небеса открылись, и] всё творение под небом озарилось, а [мир] содрогнулся.


    [Я испугался, и вот,] в [свете я увидел ребёнка, стоявшего] рядом со мной.


    Пока я смотрел [на него, он стал] подобен старцу, а затем [изменил свой] облик, став подобным сыну[a].


    Передо мной [не было нескольких различных существ], но в [свете] являлся [образ] во множестве обликов; [подобия] проявлялись друг через друга, и этот [образ] имел три облика.


    Он спросил меня: «Иоанн, Иоанн, чему ты удивляешься и почему [боишься]?


    Разве этот образ вам всем незнаком?


    Не [малодушествуй].


    Я — тот, кто [всегда пребывает со всеми вами].


    Я — [Отец], я — Мать, я — Сын.


    Я — незапятнанный и неосквернённый.


    [Теперь я пришёл поведать тебе о] том, что есть, [что было] и что [произойдёт], чтобы [ты постиг] ещё не явленное [и явленное, а также чтобы поведать тебе о] [непоколебимом роде] [Совершенного Человека].


    [Итак, подними] своё [лицо, чтобы] [принять] то, что я [скажу тебе] сегодня, [и] передать сказанное [своим собратьям-духам из] [непоколебимого] рода Совершенного [Человека]».'
  revised_footnotes:
