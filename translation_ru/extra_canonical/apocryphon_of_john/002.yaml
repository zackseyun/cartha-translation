translation:
  language: ru
  text: 'Тотчас, [пока я размышлял об этом], вот, [небеса открылись, и] всё творение под небом озарилось, а [мир] содрогнулся.


    [Я испугался, и вот,] в [свете я увидел ребёнка, стоявшего] рядом со мной.


    Пока я смотрел [на него, он стал] подобен старцу, а затем [изменил свой] облик, став подобным сыну[a].


    Передо мной [были не разные существа], но в [свете] являлся [образ] во множестве обликов; [подобия] проступали одно через другое, и этот [образ] имел три облика.


    Он спросил меня: «Иоанн, Иоанн, чему ты удивляешься и почему [боишься]?


    Разве этот образ вам всем незнаком?


    Не [падай] духом.


    Я — тот, кто [всегда пребывает со всеми вами].


    Я — [Отец], я — Мать, я — Сын.


    Я — незапятнанный и неосквернённый.


    [Теперь я пришёл поведать тебе о] том, что есть, [что было] и что [произойдёт], чтобы [ты постиг] ещё не явленное [и явленное, а также чтобы поведать тебе о] [непоколебимом роде] [Совершенного Человека].


    [Итак, подними] своё [лицо, чтобы] [принять] то, что я [скажу тебе] сегодня, [и] [передать это родственным тебе] духам из [непоколебимого] рода Совершенного [Человека]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В доступном английском свидетеле после слова «сын» стоит нераскрытый знак примечания; прямую проверку коптского текста ещё предстоит выполнить.
    reason: Отмечает текстологическую неопределённость, которую английский POB опустил, и не создаёт неподтверждённого варианта чтения.
lexical_decisions:
- source_word: glowed
  choice: озарилось
  rationale: Передаёт внезапное сияние всего творения естественным и возвышенным русским языком, не уточняя источник света.
- source_word: child
  choice: ребёнок
  rationale: Сохраняет возрастную неопределённость английского свидетеля; не вводит мужской пол раньше последующего местоимения и образа сына.
- source_word: old man
  choice: старец
  rationale: Естественное для визионерского повествования обозначение пожилого мужчины с достойным, но не архаичным звучанием.
- source_word: appearance / forms / resemblances
  choice: образ / облики / подобия
  rationale: Различает связанные термины и сохраняет напряжение между единством явления и множественностью воспринимаемых форм.
- source_word: unmoving race
  choice: непоколебимый род
  rationale: «Непоколебимый» идиоматичнее буквального «неподвижный» применительно к духовному роду и сохраняет смысл устойчивости; источник-язык требует последующей проверки.
- source_word: Perfect Man
  choice: Совершенный Человек
  rationale: Сохраняет титульный характер выражения и его антропологическую неоднозначность.
theological_decisions:
- issue: 'Три самообозначения явившегося: Отец, Мать и Сын'
  choice: Сохранить дословную тройную формулу без истолкования
  alternative: Согласовать формулу с позднейшими тринитарными категориями
  rationale: Свидетель прямо содержит эти наименования; перевод не должен устранять присущее тексту богословское напряжение.
- issue: Единство явившегося при трёх обликах
  choice: Передать как один «образ», имеющий три «облика»
  alternative: Говорить о трёх отдельных существах или лицах
  rationale: Текст явно отрицает множественность сущностей, но утверждает множественность форм; это различие сохранено.
- issue: «Род Совершенного Человека»
  choice: Сохранить формулу как технически значимое, но не разъяснённое выражение
  alternative: Истолковать как человечество, церковь или определённую конфессиональную группу
  rationale: Контекст данного отрывка не позволяет безоговорочно отождествить этот род с одной позднейшей категорией.
- issue: Companion spirits
  choice: «родственным тебе духам»
  alternative: «твоим товарищам-духам»
  rationale: Выбран естественный русский оборот, передающий близость или принадлежность к одной духовной общности без чрезмерной конкретизации.
translation_notes:
  register: Современный литературный русский с достоинством визионерского и откровенного повествования. Квадратные скобки сохранены как обозначение восстановленного или неуверенно читаемого текста свидетеля. Вставной номер страницы рукописи удалён. Из-за отсутствия завершённой сверки с коптским источником формулировки остаются предварительными и опираются на предоставленный публичный английский свидетель.
