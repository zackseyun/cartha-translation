    reason: Отмечает текстологическую неопределённость, сохранённую в исходном английском свидетеле, не создавая неподтверждённого варианта чтения.
  revision_rationale: Исправления устраняют сдвиг от единого явления к нескольким существам, не добавляют в companion смысл родства и точнее передают объём сообщаемого. Скобочная структура, терминологическая неоднозначность и визионерский регистр сохранены. Поскольку предоставлена английская публично-доменная редакция, а не коптский текст с аппаратом, выводы о лексике и текстологических деталях остаются предварительными.
