translation:
  language: ru
  text: '1. Итак, я, совершенный Промысл всего сущего, преобразила себя в собственное семя, ибо я существовала прежде всех. Я прошла всеми путями, ибо я — богатство света.


    2. Я — память Полноты. Я вошла в область тьмы и не отступала, пока не достигла середины темницы. Основания Хаоса содрогнулись, а я скрылась от них из-за их злобы, и они меня не узнали.


    3. Затем я вернулась во второй раз и обошла всё вокруг.


    4. Я вышла от тех, кто принадлежит свету, — свету, которым являюсь я, память Промысла.


    5. Я вошла в самую середину тьмы, во внутренние глубины Аида, исполняя своё поручение. Основания Хаоса содрогнулись и едва не обрушились на обитателей Хаоса, чтобы погубить их. Тогда я вновь поспешила ввысь, к своему корню света, чтобы они не погибли прежде времени.


    6. И в третий раз я вышла — я, свет внутри света, я, память Промысла, — чтобы войти в самую середину тьмы, во внутренние глубины Аида. Я озарила своё лицо светом завершения их эона[a] и вошла в середину их темницы — темницы тела[b]. Я сказала: «Кто слышит, пусть пробудится от глубокого сна!» И он заплакал, и потекли слёзы.


    7. Он отёр с себя горькие слёзы и сказал: «Кто зовёт меня по имени? Откуда пришла ко мне эта надежда, когда я скован узами темницы?»


    8. Я сказала ему: «Я — Промысл чистого света.


    9. Я — мысль девственного Духа, возносящая тебя в место, достойное хвалы.


    10. Встань и вспомни, что именно ты услышал призыв. Следуй за своим корнем — за мной, Милосердной. Берегись ангелов нищеты, демонов Хаоса и всех, кто расставляет тебе ловушки. Остерегайся глубокого сна и заточения во внутренних глубинах Аида».


    11. Я подняла его и запечатлела светом воды пяти печатей[c], чтобы отныне Смерть не одолела его. И вот, теперь я восхожу в совершенный эон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эон — век, миропорядок или космическая область; здесь точный оттенок термина остаётся неоднозначным.
    reason: Нужна краткая помощь современному читателю без устранения исходной многозначности.
  - marker: b
    text: Слова, связывающие «темницу» с телом, в рукописной передаче частично восстановлены.
    reason: Передаёт отмеченный в исходном свидетельстве редакционный знак восстановления ‹of›.
  - marker: c
    text: «Вода пяти печатей» — ритуально-символическое выражение этого сочинения; в данном отрывке его смысл не поясняется.
    reason: Предотвращает самовольное отождествление с какой-либо позднейшей конфессиональной практикой.
lexical_decisions:
- source_word: Providence
  choice: Промысл
  rationale: Передаёт персонифицированное божественное попечение в возвышенном, но понятном русском регистре; женский род согласуется с говорящей фигурой в данном повествовании.
- source_word: Fullness
  choice: Полнота
  rationale: Сохраняет техническое космологическое значение термина, не подменяя его интерпретацией.
- source_word: Chaos
  choice: Хаос
  rationale: Сохранено как наименование космической области или силы; прописная буква отражает персонифицированно-топонимическое употребление.
- source_word: Hades
  choice: Аид
  rationale: Сохраняет древний образ подземного мира и не отождествляет его безоговорочно с позднейшим понятием ада.
- source_word: aeon
  choice: эон
  rationale: Технический термин сохранён транслитерацией, поскольку «век» или «мир» могли бы преждевременно снять его смысловую неоднозначность.
- source_word: root
  choice: корень
  rationale: Буквальный образ происхождения и принадлежности сохранён без доктринального истолкования.
- source_word: angels of destitution
  choice: ангелы нищеты
  rationale: Сохраняет необычный и неоднозначный образ исходного свидетельства; «лишение» было бы более абстрактным.
- source_word: five seals
  choice: пять печатей
  rationale: Сохранён ритуально-символический термин без попытки объяснить не раскрытое в отрывке содержание.
theological_decisions:
- issue: Грамматический род персонифицированного Промысла
  choice: 'Женский род в автореференции: «преобразила», «существовала», «Милосердной»'
  alternative: Мужской или грамматически нейтрализованный род
  rationale: Русское «Промысл» грамматически мужского рода, однако повествовательная фигура в традиции текста связана с женской Пронойей; формы женского рода сохраняют эту содержательную черту, хотя создают намеренное грамматическое напряжение.
- issue: «the one who gave heed»
  choice: «именно ты услышал призыв»
  alternative: «ты — тот, кто внял»
  rationale: Выбрана естественная русская формулировка, сохраняющая акцент на распознавании и отклике; конкретизация как «послушание» не вносилась.
- issue: Свет завершения их эона
  choice: Сохранена конструкция «завершения их эона»
  alternative: «конца их века» или «совершенства их эона»
  rationale: Свидетельство допускает напряжение между завершением, исполнением и концом; формулировка не превращена однозначно ни в уничтожение, ни в совершенствование.
- issue: Темница тела
  choice: Сохранена как отождествляющее пояснение с текстологической оговоркой
  alternative: Снять восстановленное «тела» или включить без примечания
  rationale: Образ важен для антропологии отрывка, но восстановительный характер связки должен быть виден читателю.
- issue: Вода пяти печатей
  choice: Сохранён символический язык без сакраментальной идентификации
  alternative: Истолковать как конкретный обряд или таинство
  rationale: Отрывок сам не даёт достаточных оснований для конфессионально определённого толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, ритмичным регистром откровения. Повторы «я» и ключевых космологических терминов намеренно сохранены. Голая пагинация «31» исключена как внесмысловая разметка рукописи. Проект остаётся предварительным, поскольку предоставленная основа — английское публичнодоменное свидетельство, а непосредственная сверка с коптским текстом ещё не выполнена.
