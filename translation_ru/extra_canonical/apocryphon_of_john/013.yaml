translation:
  language: ru
  text: '**Апокриф Иоанна — Власти создают Адама**


    1. Затем благодаря свету они увидели в воде очертание образа, и он сказал властям, которые были при нём: «Давайте создадим человека по образу Бога и по нашему подобию, чтобы его образ стал для нас светом».


    2. И они стали создавать его — каждый своей силой, в соответствии с назначенным ему свойством. Каждая власть наделила его определённым свойством согласно очертанию образа, который она увидела в его психическом измерении.[a]


    3. Он создал существо по подобию совершенного Первочеловека, и они сказали: «Назовём его Адамом, чтобы его имя стало для нас силой света». И силы приступили к делу.


    4. Первая, Благость, создала живую кость, а вторая, Провидение, — живое сухожилие.


    5. Третья, Божественность, создала живую плоть, а четвёртая, Господство, — живой костный мозг.


    6. Пятая, Царство, создала живую кровь.


    7. Шестая, Ревность, создала живую кожу.


    8. Седьмая, Понимание, создала живые волосы.


    9. А множество ангелов находилось при нём. Они получили от властей семь сущностей жизненной души,[b] чтобы создать части тела и туловище нужной величины и устроить правильное взаимодействие всех частей.


    10. Первый начал создавать голову. Этерафаопе-Аброн создал ему голову; Мениггестроэт — мозг; Астерехмен — правый глаз; Таспомохам — левый глаз; Иерономос — правое ухо; Биссум — левое ухо; Акиорейм — нос; Банен-Эфрум — губы; Амен — зубы; Ибикан — коренные зубы; Басилиадеме — миндалины; Ахха — нёбный язычок;[c] Адабан — шею; Хааман — позвонки; Деархо — горло; Тебар — правое плечо; Н[… — левое] плечо; Мниархон — правый локоть; […е — левый] локоть; Абилрион — правую подмышку; Эвантен — левую подмышку; Крис — правую кисть; Белуай — левую кисть; Тренеу — пальцы правой руки; Балбел — пальцы левой руки; Криман — ногти на руках; Астропс — правую грудь; Барроф — левую грудь; Баум — правый плечевой сустав; Арарим — левый плечевой сустав; Арехе — живот; Фтаве — пупок; Сенафим — брюшную полость; Арахетопи — правые рёбра; Забедо — левые рёбра; Бариас — правое бедро; Фнут — левое бедро; Абенленархей — костный мозг; Хнуменинорин — кости; Гесоле — желудок; Агромаума — сердце; Бано — лёгкие; Сострапал
    — печень; Анесималар — селезёнку; Топитро — кишечник; Библо — почки; Роэрор — сухожилия; Тафрео — позвоночник; Ипуспобоба — вены; Бинеборин — артерии; Аатоименпсефей — им принадлежит дыхание в каждом члене; Энтоллея — всю плоть; Бедук — правую нижнюю часть; Арабей — левый половой член; Эйло — парный орган; Сорма — половые органы;[d] Горма-Кайохлабар — правое бедро; Небрит — левое бедро; Псерем — почки правой ноги; Асаклас — левую почку; Ормаот — правую ногу; Эменун — левую ногу; Кникс — правую берцовую кость; Тупелон — левую берцовую кость; Ахиел — правое колено; Фнеме — левое колено; Фиутром — правую стопу; Боабел — её пальцы; Трахун — левую стопу; Фикна — её пальцы; Миамай — ногти на ногах; Лаберниум — […].


    Над всеми ими поставлены семеро: Атота, Армас, Калила, Иабель, Саваоф, Каин и Авель. А особенно действуют в частях тела следующие: в голове — Диолимодраза; в шее — Иаммеакс; в правом плече — Иакубиб; в левом плече — Иертон; в правой руке — Удиди; в левой руке — Арбао; в пальцах правой руки — Лампно; в пальцах левой руки — Леекафар; в правой груди — Барбар; в левой груди — Имае; в грудной клетке — Писандраптес; в правом плечевом суставе — Коаде; в левом плечевом суставе — Одеор; в правых рёбрах — Асфиксикс; в левых рёбрах — Синогхута; в животе — Аруф; в утробе — Сабало; в правом бедре — Хархарб; в левом бедре — Хтаон; во всех половых органах — Батинор; в правой ноге — Хукс; в левой ноге — Харха; в правой берцовой кости — Ароэр; в левой берцовой кости — Тоэхта; в правом колене — Аол; в левом колене — Харанер; в правой стопе — Бастан; в её пальцах — Архентехта; в левой стопе — Марефнунт; в её пальцах — Абрана.


    11. Над всеми ими властвуют семеро: Михаил, Уриил, Асменедас, Сафасатоил, Аармуриам, Рихрам и Амиорпс.


    12. Чувствами управляет Архендекта; восприятием — Дейтарбатас; воображением — Уммаа; соразмерностью — Аахиарам; всеми побуждениями — Риарамнахо.


    13. Источников демонов, обитающих во всём теле, установлено четыре: жар, холод, влажность и сухость.


    14. Мать их всех — материя. Жаром правит Флоксофа; холодом — Ороорротос; сухостью — Эримахо; влажностью — Атуро.


    15. Мать же всех их, Онортохрас, пребывает среди них, потому что она беспредельна и соединяется со всеми ними. Она и есть материя, ибо питает их.


    16. Вот четыре главных демона: Эфемемфи, связанный с наслаждением; Иоко, связанный с вожделением; Ненентофни, связанный со скорбью; Блаомен, связанный со страхом.


    17. Мать же их всех — Эстенсис-Уч-Эпи-Птое.


    18. От четырёх демонов произошли страсти. От скорби — зависть, ревность, несчастье, беда, боль, жестокость, тревога, плач и тому подобное.


    19. От наслаждения происходят множество зол, пустое высокомерие и тому подобное.


    20. От вожделения — гнев, ярость, горечь, горькая страсть, ненасытность и тому подобное.


    21. От страха — ужас, раболепие, жалкое состояние и унижение.


    22. Всё это имеет сходство как с добродетелями, так и с пороками.


    23. Познание же их истинной природы исходит от Анаро, главы гилической души,[e] поскольку оно относится к семи чувствам, к Уч-Эпи-Птое.[f]


    24. Вот число ангелов: всего их 365.


    25. Все они трудились над ним, создавая одну часть тела за другой, пока не завершили и психическое, и гилическое тело.[g]


    26. Помимо них есть и другие, управляющие остальными страстями.


    27. Я не перечислил их тебе, но если ты хочешь узнать, кто они, всё это записано в «Книге Зороастра».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Психическое» здесь — специальный термин, обозначающий уровень души; это не обязательно означает «психологическое» в современном смысле.
    reason: Предотвращает современное психологическое прочтение технического термина.
  - marker: b
    text: 'Буквально в доступном свидетельстве: «семь сущностей (или веществ) жизненной души».'
    reason: Сохраняет необычную и неоднозначную антропологическую формулу.
  - marker: c
    text: В свидетельстве стоит греческий анатомический термин, который может означать нёбный язычок.
    reason: Поясняет лексически редкий термин.
  - marker: d
    text: Перечень в этом месте повреждён и анатомически непоследователен; спорные обозначения переданы без попытки восстановить первоначальный порядок или смысл.
    reason: Отмечает текстуальную порчу и не позволяет принять редакционную догадку за исходный текст.
  - marker: e
    text: «Гилический» означает относящийся к материи, вещественный; здесь это технический термин данной антропологии.
