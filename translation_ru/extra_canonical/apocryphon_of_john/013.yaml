    Над всеми ими поставлены семеро: Атота, Армас, Калила, Иабель, Саваоф, Каин и Авель. А особенно действуют в частях тела следующие: в голове — Диолимодраза; в шее — Иаммеакс; в правом плече — Иакубиб; в левом плече — Иертон; в правой руке — Удиди; в левой руке — Арбао; в пальцах правой руки — Лампно; в пальцах левой руки — Леекафар; в правой груди — Барбар; в левой груди — Имае; в грудной клетке — Писандраптес; в правом плечевом суставе — Коаде; в левом плечевом суставе — Одеор; в правых рёбрах — Асфиксикс; в левых рёбрах — Синогхута; в животе — Аруф; в утробе — Сабало; в правом бедре — Хархарб; в левом бедре — Хтаон; во всех половых органах — Батинот; в правой ноге — Хукс; в левой ноге — Харха; в правой берцовой кости — Ароэр; в левой берцовой кости — Тоэхта; в правом колене — Аол; в левом колене — Харанер; в правой стопе — Бастан; в её пальцах — Архентехта; в левой стопе — Марефнунт; в её пальцах — Абрана.


