translation:
  language: ru
  text: '1. Вечная Жизнь вместе с его Волей, а также Ум вместе с Предведением предстояли незримому Духу и Барбело и прославляли их, ибо они возникли благодаря ей.


    2. Святой Дух вместе с Барбело также довершил Саморождённого Бога, своего Сына, чтобы тот предстоял великому, незримому, девственному Духу, — Саморождённый Бог, Христос, которого он прославил громким голосом.[a]


    3. Он произошёл через Промысл, и незримый девственный Дух поставил истинно Саморождённого Бога над Всем.[b]


    4. Он подчинил ему всякую власть и вложил в него истину, чтобы тот познал Всё, — тот, кому было дано имя превыше всякого имени, ибо это имя будет возвещено достойным его.


    5. Ибо от Света, то есть Христа, и Нетленности, через дар Духа и четыре [великих] света от Саморождённого Бога […]. Он ожидал, чтобы они предстояли ему:[c]


    6. три — Воля, Замысел и Жизнь,


    7. и четыре силы — Разумение, Благодать, Восприятие и Рассудительность.


    8. Благодать же принадлежит свету-эону Армозелю — первому ангелу; вместе с этим эоном пребывают ещё три эона: Благодать, Истина и Образ.[d]


    9. Второй свет — Ориаил, поставленный над вторым эоном.


    10. Вместе с ним пребывают ещё три эона: Размышление, Восприятие и Память.


    11. Третий свет — Давейтай, поставленный над третьим эоном; вместе с ним пребывают ещё три эона: Разумение, Любовь и Совершенный Образ.


    12. А над четвёртым светом, Элелетом, был поставлен четвёртый эон.[e]


    13. Вместе с ним пребывают ещё три эона: Совершенство, Мир и София.[f]


    14. Это четыре света, предстоящие Саморождённому Богу.


    15. Это двенадцать эонов, предстоящих Сыну Могущественного — Саморождённому, Христу, — по воле и дару незримого Духа; и эти двенадцать эонов принадлежат Саморождённому Сыну.


    16. И всё было утверждено по воле святого Духа через Саморождённого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Синтаксис свидетеля допускает разные способы связать выражения «Саморождённый Бог», «Христос» и местоимение «которого». Перевод сохраняет эту неясность; сверка с коптским текстом ещё требуется.
    reason: Подлинная синтаксическая и богословская неоднозначность.
  - marker: b
    text: «Промысл» здесь, вероятно, обозначает персонифицированную небесную реальность, а не только отвлечённое попечение.
    reason: Разъяснение технического космогонического употребления.
  - marker: c
    text: В источнике перед этим местом имеется разрыв или утрата текста; поэтому фраза грамматически незавершённа. Квадратные скобки и многоточие сохранены как обозначение восстановления и лакуны.
    reason: Предупреждение о повреждении рукописной традиции.
  - marker: d
    text: «Эон» в этом отрывке может обозначать как вечную небесную сущность, так и связанную с ней область; перевод не выбирает между этими оттенками.
    reason: Сохранение семантической широты термина.
  - marker: e
    text: Формулировка отличается от параллельных описаний второго и третьего светов и может отражать повреждение или особенность свидетеля; порядок понятий не исправлялся.
    reason: Сохранение текстовой напряжённости без конъектурной нормализации.
  - marker: f
    text: «София» — греческое слово со значением «мудрость», употреблённое здесь как имя или титул.
    reason: Пояснение имени для современного читателя.
lexical_decisions:
- source_word: self-generated
  choice: Саморождённый
  rationale: Передаёт технический космогонический титул и сохраняет отличие от обычного «рождённый»; прописная буква отмечает употребление как имени-титула.
- source_word: attended
  choice: предстояли / предстоящие
  rationale: В данном культово-небесном контексте «предстоять» естественнее буквального «сопровождать» и не добавляет идеи служения, которой свидетель явно не выражает.
- source_word: the All
  choice: Всё
  rationale: Сохраняет субстантивированное космологическое обозначение совокупности сущего.
- source_word: aeon
  choice: эон
  rationale: Сохранён специальный термин текста, поскольку обычные «век» или «мир» здесь исказили бы смысл.
- source_word: Indestructibility
  choice: Нетленность
  rationale: Традиционное и понятное русское обозначение персонифицированного свойства, соответствующее контексту небесных сущностей.
- source_word: Providence
  choice: Промысл
  rationale: Передаёт персонифицированное провиденциальное начало в возвышенном, но понятном русском регистре.
- source_word: Idea
  choice: Замысел
  rationale: «Замысел» лучше передаёт деятельное умственное начало, чем современное абстрактное «идея», при неизбежной предварительности ввиду отсутствия проверки коптского термина.
- source_word: Form / Ideal Form
  choice: Образ / Совершенный Образ
  rationale: Разводит два близких наименования в перечнях и сохраняет предполагаемое усиление во втором; решение предварительное.
- source_word: Sophia
  choice: София
  rationale: Сохранено имя-технический термин, а не переведено как «Мудрость», чтобы не устранять возможную персонификацию.
theological_decisions:
- issue: Соотношение Саморождённого Бога, Сына и Христа в стихе 2
  choice: Сохранена грамматически напряжённая последовательность титулов без догматического упорядочивания.
  alternative: Перестроить фразу так, чтобы «Христос» однозначно являлся либо объектом предстояния, либо отдельным субъектом.
  rationale: Английский свидетель синтаксически неоднозначен, а проверка коптских рукописей ещё не проведена; экспликация могла бы навязать тексту определённую онтологию.
- issue: Референты местоимений мужского рода
  choice: Местоименная неоднозначность в основном сохранена.
  alternative: Повторять «Христос», «Дух» или «Саморождённый Бог» вместо каждого местоимения.
  rationale: Свидетель не всегда позволяет надёжно установить референт; именование внесло бы интерпретацию в основной текст.
- issue: Имя превыше всякого имени
  choice: Формула передана без отождествления с каким-либо именем или лицом вне данного отрывка.
  alternative: Пояснить формулу через новозаветную христологическую традицию.
  rationale: Такое пояснение импортировало бы внешнюю конфессиональную интерпретацию.
- issue: Святой Дух и незримый девственный Дух
  choice: Различие формулировок и регистр оригинального свидетеля сохранены.
  alternative: Унифицировать все упоминания как одно стандартное имя «Святой Дух».
  rationale: Унификация устранила бы возможные смысловые оттенки и космогоническую терминологию текста.
translation_notes:
  register: 'Современный литературный русский с возвышенным космогоническим регистром. Специальные термины «эон», «Саморождённый», «София» сохранены, но синтаксис по возможности упрощён для чтения. Перевод является предварительным: доступен английский публичный свидетель, тогда как непосредственная сверка с коптскими рукописями заявлена как ожидающая выполнения.'
