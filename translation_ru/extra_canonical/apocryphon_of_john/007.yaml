    3. He came forth by means of Providence, and the unseen, virginal Spirit appointed the truly self-generated God over the All.


    4. He also subjected every authority under him, as well as the truth to be inside him, so that he would know the All, he who had been named with a name exalted above every name, because that name will be spoken to those who deserve it,


    5. given that from Light, which is Christ, and Indestructibility, by means of the gift of the Spirit and the four [great] lights from the self-generated God [...]. He waited for them to attend «8» him,


    6. even the three: Will, Idea, and Life,


    7. even the four powers: Understanding, Grace, Perception, and Discretion.


    8. Further, Grace pertains to the light-aeon Armozel—who is the first angel—and there are three more aeons together with this aeon: Grace, Truth, and Form;


    9. also the second light, Oriael, who had been appointed over the second aeon.


    10. Further, there are three more aeons together with him: Reflection, Perception, and Memory.


    11. Further, the third light is Daveithai, who has been appointed over the third aeon, and there are three more aeons together with him: Understanding, Love, and Ideal Form.


    12. Further, the fourth aeon was appointed over the fourth light, Eleleth.


