review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод бережно следует предоставленному английскому свидетелю, сохраняет лакуну, квадратные скобки, технические титулы и не устраняет его синтаксические неясности. Однако в ст. 3 наречие «истинно» неверно модифицирует титул: witness имеет «the truly self-generated God», то есть «истинного Саморождённого Бога». В ст. 2 порядок приложений следует сделать ближе к свидетелю, не превращая «Саморождённого Бога, Христа» в отдельное пояснение после разрыва тире.'
  naturalness: 'Регистр удачно выдержан как возвышенный космогонический русский. Уточнены несколько мест: «ожидал, чтобы» в ст. 5 может выражать цель, которой в witness нет; «к свету-эону ... относится Благодать» естественнее, чем «Благодать принадлежит свету-эону».'
  terminology: «Саморождённый», «эон», «Нетленность», «Промысл», «София» и «Всё» сохранены последовательно. «Совершенный Образ» оставлен как осторожная передача Ideal Form, без доктринальной экспликации. Прямая проверка по коптскому тексту в материалах отсутствует, поэтому неоднозначности свидетеля сохранены.
  issues:
  - severity: medium
    issue: 'Ст. 3: «истинно Саморождённого Бога»'
    rationale: Наречие «истинно» по-русски относится к действию или утверждению, тогда как английское «truly self-generated God» характеризует самого Бога. Нужна форма «истинного Саморождённого Бога».
  - severity: low
    issue: 'Ст. 2: разрыв тире перед «Саморождённый Бог, Христос»'
    rationale: Тире делает титулы похожими на новую вставную номинативную конструкцию и несколько сильнее перестраивает неоднозначный синтаксис witness. Последовательность «Духу Саморождённого Бога, Христа» ближе к исходной связи и всё ещё не разрешает референты.
  - severity: low
    issue: 'Ст. 5: «ожидал, чтобы они предстояли»'
    rationale: Такая конструкция обычно выражает ожидание с оттенком цели/желания. «Ожидал, что они будут предстоять ему» точнее передаёт «waited for them to attend him».
  - severity: low
    issue: 'Ст. 8: «Благодать ... принадлежит свету-эону»'
    rationale: Формально возможно, но менее естественно для отношения «pertains to». Перестановка на «к ... относится» улучшает современную литературную русскую фразу без смыслового изменения.
  revised_text: '1. Вечная Жизнь вместе с его Волей, а также Ум вместе с Предведением предстояли незримому Духу и Барбело и прославляли их, ибо они возникли благодаря ей.


    2. Святой Дух вместе с Барбело также довершил Саморождённого Бога, своего Сына, чтобы тот предстоял великому, незримому, девственному Духу Саморождённого Бога, Христа, которого он прославил громким голосом.[a]


    3. Он произошёл через Промысл, и незримый девственный Дух поставил истинного Саморождённого Бога над Всем.[b]


    4. Он подчинил ему всякую власть и вложил в него истину, чтобы тот познал Всё, — тот, кому было дано имя превыше всякого имени, ибо это имя будет возвещено достойным его.


    5. Ибо от Света, то есть Христа, и Нетленности, через дар Духа и четыре [великих] света от Саморождённого Бога […]. Он ожидал, что они будут предстоять ему:[c]


    6. три — Воля, Замысел и Жизнь,


    7. и четыре силы — Разумение, Благодать, Восприятие и Рассудительность.


    8. К свету-эону Армозелю — первому ангелу — относится Благодать; вместе с этим эоном пребывают ещё три эона: Благодать, Истина и Образ.[d]


    9. Второй свет — Ориаил, поставленный над вторым эоном.


    10. Вместе с ним пребывают ещё три эона: Размышление, Восприятие и Память.


    11. Третий свет — Давейтай, поставленный над третьим эоном; вместе с ним пребывают ещё три эона: Разумение, Любовь и Совершенный Образ.


    12. А над четвёртым светом, Элелетом, был поставлен четвёртый эон.[e]


    13. Вместе с ним пребывают ещё три эона: Совершенство, Мир и София.[f]


    14. Это четыре света, предстоящие Саморождённому Богу.


    15. Это двенадцать эонов, предстоящих Сыну Могущественного — Саморождённому, Христу, — по воле и дару незримого Духа; и эти двенадцать эонов принадлежат Саморождённому Сыну.


    16. И всё было утверждено по воле святого Духа через Саморождённого.'
