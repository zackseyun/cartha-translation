  source_fidelity: 'Нужна правка нескольких мест, где черновик либо ослабляет лексику свидетельства, либо меняет образ: «наполняет каждый эон» не передаёт “supplies every aeon”; составные образы water-light / light-water переданы с перепутанным порядком компонентов; «вышла вперёд» для came forth добавляет пространственное значение. Восстановлена также более точная форма «мысль стала действительной» для перехода potential → actual.'
  naturalness: После правки текст остаётся современным литературным русским, при этом намеренно сохраняет повторения, необычные космологические образы и синтаксическую неясность свидетеля. «Водо-свет» и «свето-вода» оставлены как необычные, но читаемые гибридные образы, а не истолкованы.
  terminology: '«Эон», «Барбело», «Промысл Всего» и «девственный Дух» сохранены. «Промысл» не должен пониматься как привнесение конфессиональной доктрины: это переводческая передача Providence в рамках данного текста. Местоимения, относящиеся к персонифицированной первой мысли/силе, сохранены в женском роде.'
  issues:
  - severity: medium
    issue: «Он наполняет [каждый эон]»
    rationale: Английское supplies не означает «наполняет»; «поддерживает» точнее передаёт снабжение/обеспечение, не добавляя предмета снабжения.
  - severity: medium
    issue: «[свет-воды]» и «[чистой воды-света]»
    rationale: Эти формы одновременно нарушают естественное русское словообразование и не сохраняют порядок water-light / light-water. Исправлено на «[водо]-свет» и «[чистой свето]-воде».
  - severity: medium
    issue: «мысль ... осуществилась»
    rationale: Мысль в свидетельстве становится actual; «стала действительной» передаёт этот контраст точнее, чем «осуществилась», которое предполагает исполнение замысла.
  - severity: low
    issue: «вышла вперёд»
    rationale: Came forth означает «произошла/явилась, вышла», но не обязательно движение вперёд. Выбрано нейтральное «вышла».
