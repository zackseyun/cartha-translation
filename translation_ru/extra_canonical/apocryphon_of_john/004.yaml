translation:
  language: ru
  text: '1. Это потому, что [мы не] [постигаем неизречённого и] не постигаем того, [что невозможно измерить], кроме Того, кто произошёл [от] Него, то есть [Отца]: ведь Он [один] объяснил нам это. Ибо Он исследует [самого] Себя в окружающем [Его] свете — источнике [живой] воды; Он наполняет [каждый эон] и, одновременно обращаясь во все стороны, [созерцает] Свой образ, вглядываясь в источник [Духа].[a][b]


    2. Он помещает Своё желание в Свой [свет-воды], [пребывающий в] окружающем Его источнике [чистой воды-света]. Тогда [Его мысль, прежде лишь возможная,] осуществилась, и она приблизилась — [та], что [явилась] перед Ним [в сиянии] Его света.


    3. Она — первая [сила, существовавшая] прежде Всего и [вышедшая] из Его разума.


    4. Она — [Промысл Всего]; её свет [сияет подобно Его] свету. Она — [совершенная] сила, образ совершенного, невидимого, девственного Духа.


    5. [Первая сила] — слава Барбело,[c] совершенная слава среди эонов, слава откровения.


    6. Она превознесла девственного Духа и восхвалила Его, потому что благодаря Ему вышла вперёд.


    7. Она — первая мысль, Его образ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод этого фрагмента предварительный: он выполнен по предоставленному англоязычному свидетельству; прямая сверка с коптскими рукописями ещё требуется.'
    reason: Указывает фактическую основу и ограничение проекта, поскольку проверка по языку оригинала пока не проведена.
