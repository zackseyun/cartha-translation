    reason: Объясняет обязательные текстологические обозначения и предупреждает о неуверенности чтений.
  - marker: c
    text: Барбело — имя первой мысли или первой силы в космологии этого произведения; оно передано транслитерацией без попытки истолковать его происхождение.
    reason: Помогает современному читателю распознать редкое имя, не навязывая спорную этимологию или доктрину.
lexical_decisions:
- source_word: unspeakable things
  choice: неизречённое
  rationale: Сохраняет возвышенный регистр и идею того, что не может быть выражено словами, без тяжеловесного буквального множественного числа.
- source_word: aeon
  choice: эон
  rationale: Передаёт технический космологический термин текста транслитерацией, не сводя его только к «веку» или «миру».
- source_word: spring
  choice: источник
  rationale: Естественно передаёт образ истока живой воды и сохраняет повторяющийся символический мотив.
- source_word: water-light / light-water
  choice: свет-воды / вода-свет
  rationale: Необычные составные образы сохранены, а не нормализованы до одного элемента; различие порядка компонентов отражено по свидетельству.
- source_word: Providence of the All
  choice: Промысл Всего
  rationale: Сохраняет космологический масштаб и традиционный смысл providence; последующее местоимение женского рода относится к первой силе, а не к грамматическому роду слова «Промысл».
- source_word: virginal Spirit
  choice: девственный Дух
  rationale: Буквально сохраняет характеристику Духа, не заменяя её конфессионально нагруженным титулом.
- source_word: came forth
  choice: вышла вперёд
  rationale: Передаёт исхождение или выступление без уточнения его метафизического механизма.
theological_decisions:
- issue: Неясная цепочка местоимений и происхождение того, кто объясняет Отца
  choice: 'Сохранено: «Того, кто произошёл [от] Него, то есть [Отца]»'
  alternative: Отождествить произошедшего с Отцом либо явно назвать его Сыном
  rationale: Свидетельство синтаксически неоднозначно; добавление конкретной христологической идентификации разрешило бы напряжение без достаточного основания.
- issue: Персонификация первой мысли/силы
  choice: 'Сохранён женский род: «она»'
  alternative: Передать безлично или согласовать с мужским «Промысл»
  rationale: Женская персонификация явно поддерживается последовательностью местоимений и важна для образа Барбело.
- issue: Статус «Всего»
  choice: Написано с прописной буквы
  alternative: «всего» со строчной как обычное обобщение
  rationale: В данном космологическом контексте слово обозначает совокупную реальность как термин, но перевод не уточняет её устройство.
- issue: Потенциальная мысль, ставшая действительной
  choice: «Его мысль, прежде лишь возможная, осуществилась»
  alternative: «его мысль стала действием» или «возникла»
  rationale: Формулировка сохраняет различие между потенциальностью и актуальностью, не превращая мысль в отдельное действие и не решая точную онтологию её появления.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным регистром. Синтаксис местами намеренно сохраняет повторения и местоименную неоднозначность источника. Необычные космологические образы и квадратные скобки сохранены. Отдельный номер страницы «5», разрывавший предложение в свидетельстве, в основной текст не включён.
