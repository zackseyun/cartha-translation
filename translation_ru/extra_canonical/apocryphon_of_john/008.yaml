translation:
  language: ru
  text: '1. Далее, из Предведения Совершенного Ума, через откровение воли незримого Духа и воли Саморождённого, произошёл Совершенный Человек — первое откровение, сама истина.


    2. Это тот, кого девственный Дух назвал Пигера-Адамасом[a]. Он поставил его над первым эоном вместе с Могущественным — Саморождённым, Христом, — при первом свете, Армозеле, в сопровождении его сил.


    3. Далее, Незримый даровал ему духовную, неуязвимую силу.


    4. И он заговорил, возвеличивая и прославляя незримого Духа: «Благодаря Тебе Всё возникло, и к Тебе Всё возвратится.


    5. Я буду восхвалять и возвеличивать Тебя и Саморождённого, и три эона — Отца, Мать и Сына, совершенную силу».


    6. Он также поставил его сына Сифа над вторым эоном, перед вторым светом, Ороиэлем. В третьем эоне потомство Сифа было поставлено над третьим светом, Давейтаем, и в нём были помещены души святых.


    7. Далее, в четвёртом эоне были помещены души тех, кто не познал Полноты и не раскаялся сразу, но некоторое время оставался без покаяния и раскаялся лишь впоследствии.


    8. Они — четвёртый свет, Элелет[b].


    9. Это существа, восхваляющие незримого Духа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Пигера-Адамас» передано транслитерацией; рукописная форма и разделение компонентов имени в свидетельствах могут различаться.
    reason: Сохранить техническое имя и предупредить о текстовой неустойчивости формы.
  - marker: b
    text: Фраза «Они — четвёртый свет, Элелет» передаёт необычное число и построение предоставленного текстового свидетельства без исправления или согласования.
    reason: Зафиксировать подлинную синтаксическую трудность и не скрывать её гармонизирующим переводом.
lexical_decisions:
- source_word: Precognition
  choice: Предведение
  rationale: Сохраняет технический смысл предварительного знания и возвышенный регистр, не сводя понятие к обычному «предвидению».
- source_word: Perfect Mind
  choice: Совершенный Ум
  rationale: Передаёт термин буквально и сохраняет его персонифицированный характер посредством прописных букв.
- source_word: self-generated one
  choice: Саморождённый
  rationale: Краткий субстантивированный термин сохраняет идею происхождения из самого себя и не добавляет позднейшей догматической терминологии.
- source_word: the All
  choice: Всё
  rationale: Прописная буква отмечает техническое обозначение совокупности всего сущего.
- source_word: aeon
  choice: эон
  rationale: Сохранён специальный космологический термин; перевод «век» здесь сузил бы или исказил значение.
- source_word: Fullness
  choice: Полнота
  rationale: Сохраняет техническое понятие полноты божественной реальности без подстановки термина «плерома», отсутствующего в английском свидетельстве.
- source_word: seed of Seth
  choice: потомство Сифа
  rationale: Естественно по-русски обозначает род или духовное потомство, сохраняя коллективный смысл.
- source_word: lights
  choice: свет / светом
  rationale: Буквальная передача технического обозначения небесных сущностей; необычность исходного образа сохранена.
theological_decisions:
- issue: Соотношение Саморождённого, Могущественного и Христа
  choice: Сохранить их как возможные приложения к одному лицу
  alternative: Понять «Могущественного» и «Саморождённого» как отдельных сущностей
  rationale: Пунктуация свидетеля допускает аппозитивное чтение; перевод не вводит дополнительных связок, которые окончательно разрешили бы синтаксическую неоднозначность.
- issue: Три эона и формула «Отец, Мать, Сын, совершенная сила»
  choice: Сохранить исходное перечисление без догматической гармонизации
  alternative: Отнести «совершенную силу» только к Сыну либо считать её четвёртым членом
  rationale: Свидетель синтаксически неоднозначен; запятая оставляет открытым, является ли «совершенная сила» приложением или итоговым определением.
- issue: Необычное отождествление во множественном числе с четвёртым светом
  choice: «Они — четвёртый свет, Элелет»
  alternative: «Это — четвёртый свет, Элелет» или исправление числа
  rationale: Сохранено напряжение между множественным субъектом предыдущего абзаца и единственным «светом», как в предоставленном свидетельстве.
- issue: Покаяние душ в четвёртом эоне
  choice: 'Передать последовательность буквально: не раскаялись сразу, оставались без покаяния, затем раскаялись'
  alternative: Истолковать речь как земную историю определённой группы верующих
  rationale: Перевод не уточняет личность, эпоху или конфессиональный статус этих душ сверх исходного текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокрифического откровения. Технические космологические термины переданы последовательно и преимущественно формально. Проект предварительный: предоставленное основание является англоязычным публичным свидетельством, а прямая сверка с коптскими рукописями ещё не выполнена. Голое обозначение страницы «9», прерывающее фразу, в основной текст не включено.'
