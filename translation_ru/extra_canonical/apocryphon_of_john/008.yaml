  naturalness: Регистр современный литературный и в целом удачно выдержан. Формулировка «в этом эоне» в §6 устраняет ложную анафору, оставаясь естественной и не добавляя толкования сверх явно указанного «внутри третьего эона».
  terminology: «Предведение», «Совершенный Ум», «Саморождённый», «эон», «Полнота» и транслитерированные имена сохранены последовательно. Необычная формула §8 и её множественное число оставлены без гармонизации; сноски уместны.
  issues:
