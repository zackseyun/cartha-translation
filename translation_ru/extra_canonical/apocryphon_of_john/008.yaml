    issue: 'Ложная референция местоимения в §6: «и в нём были помещены души святых».'
    rationale: Ближайшим грамматическим антецедентом «нём» выступает «Давейтаем», но свидетельство предварительно помещает души «внутри третьего эона». Следует назвать эон повторно.
