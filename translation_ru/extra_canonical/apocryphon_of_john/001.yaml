translation:
  language: ru
  text: '1. Учение [Спасителя], и [откровение] тайн, и [изречения], сокрытые в молчании, — [те самые изречения, которым] он научил Иоанна, [своего] ученика.


    2. [Однажды] же случилось так: Иоанн, [брат] Иакова, — они были сыновьями Зеведея — поднялся в храм. Там фарисей по имени Ариманий [подошёл к] нему [и] спросил: «[Где] твой учитель, [за которым] ты следовал?»


    3. Он [ответил] ему: «Он возвратился туда, [откуда] пришёл».


    4. Фарисей [сказал ему: «Этот назарянин обманом] ввёл всех вас в заблуждение, наполнил [ваши уши ложью] и запечатал [ваши сердца, отвратив вас] от преданий [ваших отцов]».


    5. [Услышав] эти слова, я, [Иоанн, удалился] от храма [в пустынное горное место] и стал [горько] скорбеть в сердце, спрашивая:


    6. «Как [был] поставлен Спаситель? Почему [Отец] послал его [в мир]? И кто [его] Отец, пославший [его]? И каков тот эон[a], [в который мы войдём]?


    7. Ведь что он [имел в виду, когда говорил нам]: “Эон, [в который вы войдёте], — это [нерушимый] эон”?


    8. [Однако он не] объяснил нам, [каков этот эон]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эон — термин, который может обозначать век, непреходящий порядок бытия или сверхмирную область. Здесь он сохранён без сведения к одному из этих значений.
    reason: Нужно сохранить смысловую неоднозначность ключевого термина и сделать транслитерацию понятной современному читателю.
lexical_decisions:
- source_word: savior
  choice: Спаситель
  rationale: Устоявшееся и понятное русское обозначение; прописная буква отражает титульное употребление в данном контексте, не добавляя имени.
- source_word: sayings
  choice: изречения
  rationale: Передаёт смысл авторитетных речений и сохраняет возвышенный, но современный регистр.
- source_word: dispatched
  choice: послал
  rationale: Естественный русский эквивалент в отношениях Отца и Спасителя; более буквальное «направил» здесь звучало бы административно.
- source_word: aeon
  choice: эон
  rationale: Технический термин сохранён транслитерацией, поскольку «век», «мир» или «область бытия» преждевременно сузили бы его смысл.
- source_word: indestructible
  choice: нерушимый
  rationale: Сохраняет идею неподвластности разрушению и звучит естественно применительно к эону.
- source_word: traditions of your fathers
  choice: предания ваших отцов
  rationale: Формально и семантически близкая передача без конфессионального уточнения содержания этих преданий.
- source_word: appointed
  choice: поставлен
  rationale: Сохраняет неоднозначность назначения или установления Спасителя и не уточняет, кем именно он был поставлен.
theological_decisions:
- issue: Природа «эона»
  choice: Сохранён термин «эон» без истолкования как исключительно времени, мира или небесной области.
  alternative: «век», «мир» или «обитель»
  rationale: В отрывке понятие допускает временное и пространственно-онтологическое прочтение; перевод не должен устранять это напряжение.
- issue: Фраза о том, как Спаситель был «поставлен»
  choice: «Как был поставлен Спаситель?»
  alternative: «Как был назначен Спаситель?» или «Как появился Спаситель?»
  rationale: «Поставлен» ближе к формулировке свидетеля и не превращает вопрос ни в административное назначение, ни в вопрос происхождения.
- issue: Возвращение учителя
  choice: «Он возвратился туда, откуда пришёл».
  alternative: Уточнить это место как небеса, Отца или божественный мир.
  rationale: Сам отрывок не называет место; богословское уточнение было бы добавлением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Квадратные скобки сохранены как указание на повреждённый или редакционно восстановленный текст рукописных свидетелей. Черновик основан на предоставленном англоязычном публично-доступном свидетельстве; прямая сверка с коптским текстом ещё требуется.
