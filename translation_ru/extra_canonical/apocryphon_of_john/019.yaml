  yaml_path: translation/extra_canonical/apocryphon_of_john/019.yaml
  text: '1. I asked, however, “Lord, where did the vile spirit come from?”


    2. He said to me, “The Mother-Father, who abounds in mercy, the holy Spirit in every form, the one who is merciful and «28» who shows compassion for all of you—that is, the Reflection of Radiant Providence—raised up the seed of the perfect race, its intellect, and the eternal light of the Man.


    3. When the chief archon realized that they were higher than he was in the height and surpassed him in intellect, he wanted to grasp their objective. He did not know that they surpassed him in intellect and that he would be unable to grasp them.


    4. He devised a plot with his authorities, who are his powers, and together they committed adultery with Sophia. Bitter Destiny was begotten by them, the final, unstable fetter. It is of a wavering kind, yet it is more durable and stronger than she with whom the gods joined in adultery, and the angels, and the demons, and all the generations down to the present day. For from that Destiny came all transgression, injustice, blasphemy, the fetter of oblivion and ignorance, every harsh command with grievous transgressions, and overwhelming fears.


    5. In this way all creation was also blinded so that they would not know the God who is over them all. Because of the fetter of oblivion, their sins were hidden, for they are bound by measurements, times, and moments, since it is the universal overlord.


    6. Then he regretted everything that had happened because of him.


    7. This time he conspired to bring a flood «29» upon the products of humanity, but the greatness of radiant Providence informed Noah. Noah preached to all the seed of the children of humanity, but those who were strangers to him did not listen to him.


    8. It was not as Moses said, ‘They hid themselves in an ark.’ Instead, they hid themselves in a place—not only Noah, but also many other people from the unmoving race.


    9. They entered a place and hid themselves within a radiant cloud. He was aware of his authority, and she who belongs to the light accompanied him.


    10. She had shone upon them because he had caused darkness to cover the whole earth, and he devised a plot together with his powers.


    11. He sent his angels to the daughters of men to take some for themselves and to raise up offspring for their pleasure, but at first they were unsuccessful.


    12. When they did not succeed, they gathered again and devised a plot together.


    13. They created a vile spirit resembling the Spirit who had descended, so that through it they might defile souls. The angels transformed their appearance into the appearance of their mates, making them full of the spirit of darkness, which they had mixed together with evil for them.


    14. They presented gold and silver, and gifts of copper and iron, and objects made from every kind of metal. By leading the people who followed them «30» astray with a multitude of tricks, they brought them into great troubles.


    15. They grew old without enjoying any pleasures.


    16. Without discovering the truth and without knowledge of the true God, they died. In this way all creation fell into age-long slavery, lasting from the foundation of the world until now.


    17. They also selected women and fathered children from the darkness according to the likeness of their own spirit. They closed up their hearts and hardened themselves by means of the hardness of the vile spirit, even until now.”'
translation:
  language: ru
  text: '1. Я же спросил: «Господь, откуда произошёл мерзкий дух?»


    2. Он сказал мне: «Матерь-Отец, изобилующий милостью, святой Дух во всех своих проявлениях, милующий и сострадающий всем вам, — то есть Отражение светоносного Промысла — воздвиг семя совершенного рода, его разум и вечный свет Человека.


    3. Когда главный архонт понял, что они выше него в вышине и превосходят его разумом, он захотел постичь их замысел. Он не знал, что они превосходят его разумом и что постичь их ему не удастся.


    4. Он составил заговор со своими властями, то есть своими силами, и вместе они совершили прелюбодеяние с Софией. От них родилась горькая Судьба — последние, непостоянные узы. Она изменчива, но долговечнее и сильнее той, с которой соединились в прелюбодеянии боги, а также ангелы, демоны и все поколения вплоть до нынешнего дня. Ведь от этой Судьбы произошли всякое преступление, несправедливость и богохульство, узы забвения и неведения, всякое суровое повеление с тяжкими преступлениями и всепоглощающие страхи.


    5. Так было ослеплено и всё творение, чтобы люди не познали Бога, Который превыше их всех. Из-за уз забвения их грехи были сокрыты, ибо они связаны мерами, временами и мгновениями, поскольку Судьба властвует над всем.


    6. Тогда он пожалел обо всём, что произошло по его вине.


    7. На этот раз он замыслил навести потоп на человеческое потомство, но величие светоносного Промысла известило Ноя. Ной проповедовал всему семени сынов человеческих, однако чуждые ему не послушали его.


    8. Всё было не так, как сказал Моисей: «Они укрылись в ковчеге». Они укрылись в некоем месте — не только Ной, но и многие другие люди из непоколебимого рода.


    9. Они вошли в то место и скрылись в светоносном облаке. Ной осознавал данную ему власть, и та, что принадлежит свету, сопровождала его.


    10. Она сияла над ними, потому что он покрыл всю землю тьмой и составил заговор со своими силами.


    11. Он послал своих ангелов к дочерям человеческим, чтобы те взяли некоторых из них себе и произвели потомство ради собственного наслаждения, но сначала им это не удалось.


    12. Потерпев неудачу, они вновь собрались и вместе составили заговор.


    13. Они создали мерзкий дух, подобный сошедшему Духу, чтобы посредством него осквернить души. Ангелы приняли облик мужей этих женщин и наполнили женщин духом тьмы, который смешали для них со злом.[a]


    14. Они принесли золото и серебро, а также медь, железо и изделия из всевозможных металлов. Множеством уловок они вводили следовавших за ними людей в заблуждение и навлекали на них великие беды.


    15. Те состарились, не вкусив никаких удовольствий.


    16. Не открыв истины и не познав истинного Бога, они умерли. Так всё творение попало в вековое рабство, которое длится от основания мира доныне.


    17. Они также выбирали женщин и рождали от тьмы детей по подобию собственного духа. Они затворили их сердца и ожесточили их жестокостью мерзкого духа — и так доныне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальная структура этой фразы не вполне ясна: «ангелы изменили свой облик в облик их сожителей, наполняя их духом тьмы, который они смешали для них со злом».'
    reason: Сохраняет сведения о реальной синтаксической и референциальной неоднозначности доступного свидетельства.
lexical_decisions:
- source_word: vile spirit
  choice: мерзкий дух
  rationale: Передаёт резко отрицательную нравственную характеристику без добавления поздней конфессиональной терминологии.
- source_word: Mother-Father
  choice: Матерь-Отец
  rationale: Сохраняет намеренно парадоксальное составное именование и его богословское напряжение.
- source_word: Reflection of Radiant Providence
  choice: Отражение светоносного Промысла
  rationale: Сохраняет техническое именование и образ света; «Промысл» естественнее в русском богословско-литературном регистре.
- source_word: chief archon
  choice: главный архонт
  rationale: Термин «архонт» сохранён как специфическое обозначение правителя в данном космологическом контексте.
- source_word: Destiny
  choice: Судьба
  rationale: Персонифицированное космическое начало передано с прописной буквы.
- source_word: unmoving race
  choice: непоколебимый род
  rationale: Передаёт устойчивость и неизменность рода более естественно, чем буквальное «недвижимый род».
- source_word: age-long slavery
  choice: вековое рабство
  rationale: Сохраняет значение длительности эпохального масштаба, не утверждая однозначно бесконечность.
theological_decisions:
- issue: Род и референция обозначения Промысла
  choice: Сохранены смены грамматического рода там, где русский текст позволяет это сделать естественно
  alternative: Унифицировать все местоимения как относящиеся к одному мужскому или женскому лицу
  rationale: Исходное свидетельство сочетает Mother-Father, Spirit, Reflection/Providence и местоименные переходы; полная унификация искусственно разрешила бы неоднозначность.
- issue: Кто является всеобщим властителем в ст. 5
  choice: В основном тексте субъект уточнён как Судьба
  alternative: Оставить безличное «поскольку она — всеобщий властитель»
  rationale: Ближайший тематический референт — Судьба; уточнение необходимо для ясного русского синтаксиса, хотя источник допускает некоторую референциальную неясность.
- issue: Противоречие рассказу Моисея о ковчеге
  choice: Передано прямо, без гармонизации
  alternative: Смягчить до различия в деталях
  rationale: Текст явно полемизирует с Моисеевым рассказом; богословское напряжение следует сохранить.
- issue: Облик ангелов и их mates в ст. 13
  choice: «приняли облик мужей этих женщин»
  alternative: «изменили свой облик, уподобившись своим супругам»
  rationale: Контекст предполагает обман дочерей человеческих через подобие их партнёрам, но английское свидетельство синтаксически неоднозначно; это отмечено сноской.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокрифического откровения. Специальные космологические термины («архонт», «София», «Промысл») сохранены. Номера страниц рукописи удалены как не относящиеся к связному тексту. Проект предварительный: доступна лишь англоязычная публикация-свидетель; необходима последующая сверка с коптскими кодексами.'
