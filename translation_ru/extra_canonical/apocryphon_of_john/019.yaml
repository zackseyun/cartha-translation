    9. Они вошли в то место и скрылись в светоносном облаке. Он знал о своей власти, и та, что принадлежит свету, сопровождала его.


    10. Она сияла над ними, потому что он покрыл всю землю тьмой и составил заговор со своими силами.


    11. Он послал своих ангелов к дочерям человеческим, чтобы те взяли некоторых из них себе и произвели потомство ради собственного наслаждения, но сначала им это не удалось.


    12. Потерпев неудачу, они вновь собрались и вместе составили заговор.


    13. Они создали мерзкий дух, подобный сошедшему Духу, чтобы посредством него осквернить души. Ангелы изменили свой облик, уподобив его облику своих сожителей, и наполнили их духом тьмы, который смешали для них со злом.[b]


    14. Они принесли золото и серебро, а также медь, железо и изделия из всевозможных металлов. Множеством уловок они вводили следовавших за ними людей в заблуждение и навлекали на них великие беды.


    15. Те состарились, не вкусив никаких удовольствий.


    16. Не открыв истины и не познав истинного Бога, они умерли. Так всё творение попало в вековое рабство, которое длится от основания мира доныне.


    17. Они также выбирали женщин и рождали от тьмы детей по подобию собственного духа. Они затворили свои сердца и ожесточились жестокостью мерзкого духа — и так доныне».'
