review_pass:
  verdict: revise
  source_fidelity: 'Доступна только англоязычная публикация-свидетель, поэтому прямая сверка с коптским текстом невозможна. В целом перевод следует свидетельству, но в ст. 9 необоснованно назван Ной как субъект, а в ст. 13 основная строка чрезмерно разрешает референциальную неоднозначность. В ст. 17 изменён субъект действия: источник говорит об ожесточении самих деятелей, не «их» сердец.'
  naturalness: 'Регистр в целом удачен: современный литературный русский сохраняет возвышенно-апокрифический тон. Исправлены отдельные синтаксические шероховатости, в частности несогласование «Судьба — последние узы» и неясная причинная связь в ст. 10.'
  terminology: Термины «Матерь-Отец», «архонт», «София», «Судьба» и «светоносный Промысл» сохранены. «Цепь» в ст. 4 передаёт singular fetter без грамматического конфликта с персонифицированной Судьбой.
  issues:
  - severity: medium
    issue: 'Ст. 9: «Ной осознавал данную ему власть»'
    rationale: В свидетельстве стоит лишь «he was aware of his authority»; ближайший контекст делает отнесение вероятным, но не позволяет безопасно эксплицировать Ноя и «данную ему» власть.
  - severity: high
    issue: 'Ст. 13: «приняли облик мужей этих женщин и наполнили женщин»'
    rationale: Свидетельство говорит о преобразовании облика «into the likeness of their mates» и далее использует неоднозначные местоимения. Черновик принимает одну конкретную интерпретацию, хотя она не закреплена текстом.
  - severity: medium
    issue: 'Ст. 17: «затворили их сердца и ожесточили их»'
    rationale: 'В свидетельстве: «they shut up their hearts, and they hardened themselves»; заменять возвратные действия действием над другими нельзя.'
  - severity: low
    issue: 'Ст. 4: «Судьба — последние, непостоянные узы»'
    rationale: «Fetter» стоит в единственном числе; русское сказуемое во множественном числе создаёт несогласование и размывает образ.
  - severity: low
    issue: 'Ст. 5: «чтобы люди не познали» и явное именование Судьбы всеобщей властительницей'
    rationale: «People» отсутствует в свидетельстве, а местоименный референт в заключительном «it» не назван прямо. Нейтральная русская формулировка сохраняет эту неопределённость.
