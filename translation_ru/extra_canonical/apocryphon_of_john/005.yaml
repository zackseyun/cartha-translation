base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/005.yaml
  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  language: ru
  text: '1. Она стала всеобщим чревом, потому что существует прежде всех них: Мать-Отец, Изначальный Человек, святой Дух, трижды-мужская, трижды-могущественная, трижды-именуемая андрогинная сущность, вечный эон среди невидимых и первая изошедшая.


    2. ‹Она› попросила невидимого девственного Духа — то есть Барбело — даровать ей Предведение, и Дух согласился.


    3. Когда он [согласился], Предведение явилось и присоединилось к Промыслу, происходящему от Мысли невидимого девственного Духа.


    4. Она прославила его [и] его совершенную силу, Барбело, потому что они возникли благодаря ей.


    5. И вновь она попросила даровать ей [Нетленность], и он согласился.


    6. Когда он [согласился], Нетленность [явилась] и присоединилась к Мысли и Предведению.


    7. Она прославила Невидимого и Барбело, благодаря которой они возникли.


    8. Барбело также попросила даровать ей вечную жизнь, и невидимый Дух согласился. Когда он согласился, Вечная Жизнь явилась,


    9. и они [присоединились] и прославили невидимого [Духа] и Барбело, благодаря которой они возникли.


    10. И вновь она попросила даровать ей истину. И [он согласился], и, [когда он] согласился,


    11. Истина явилась, и они присоединились и прославили невидимого, дивного Духа и его Барбело, благодаря которой они возникли.


    12. Это эонная пятерица Отца — Изначальный Человек, образ невидимого Духа.


    13. Это Промысл — то есть Барбело — и Мысль, и Предведение, и Нетленность, и Вечная Жизнь, и Истина.[a]


    14. Это андрогинная эонная пятерица, являющаяся эонной десятирицей; она есть Отец.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Текст называет эту совокупность «пятерицей», хотя после Промысла (Барбело) перечисляет ещё пять имен. Возможно, Промысл/Барбело понимается как сама пятерица или тесно отождествляется с Мыслью; формулировка оставлена без исправления.
    reason: Сохраняет арифметическую и концептуальную неоднозначность источника.
  - marker: b
    text: Неясно, каким именно образом пятерица одновременно является десятирицей. Вероятно, это связано с её андрогинностью, однако текст здесь прямо этого не объясняет.
    reason: Отмечает богословски значимую, но не разрешённую самим фрагментом связь.
lexical_decisions:
- source_word: universal womb
  choice: всеобщее чрево
  rationale: Сохраняет телесно-космогонический образ «чрева» и универсальный охват без смягчения до абстрактного «источника».
- source_word: Mother-Father
  choice: Мать-Отец
  rationale: Дефисное сложение сохраняет намеренное соединение материнского и отцовского начал.
- source_word: Primal Man / Primal Human
  choice: Изначальный Человек
  rationale: Передаёт первичность архетипической человеческой фигуры; «Человек» в русском может иметь родовое значение и не устраняет напряжение с мужским образом.
- source_word: Precognition
  choice: Предведение
  rationale: Подходит для персонифицированного предварительного знания и звучит естественнее, чем современное парапсихологическое «предвидение».
- source_word: Providence
  choice: Промысл
  rationale: Передаёт идею провиденциального замысла как именованной эонной реальности; выбор не уточняет её конфессионально.
- source_word: Idea
  choice: Мысль
  rationale: В данном космогоническом контексте «Мысль» естественно обозначает персонифицированное умопостигаемое начало; буквальная «Идея» оставалась бы возможной.
- source_word: Indestructibility
  choice: Нетленность
  rationale: Сохраняет религиозно-философский смысл неподверженности разрушению и естественно функционирует как имя персонификации.
- source_word: aeon
  choice: эон
  rationale: Транслитерация сохраняет специальный космологический термин, не сводя его только к временному «веку».
- source_word: pentad / decad
  choice: пятерица / десятирица
  rationale: Передаёт структурированные группы из пяти и десяти; редковатая, но прозрачная терминология уместна в космологическом перечне.
- source_word: attended
  choice: присоединилось / присоединились
  rationale: Сохраняет смысл вступления в сопутствующее присутствие, не навязывая служебного или поклонного отношения.
theological_decisions:
- issue: Гендерная напряжённость в описании Барбело и Духа
  choice: Сохранены женские формы для Барбело и мужские для Духа там, где их задаёт свидетель; «Мать-Отец» и «андрогинная» оставлены без гармонизации.
  alternative: Унифицировать местоимения либо передать Дух в среднем роде.
  rationale: Текст намеренно сочетает мужские и женские обозначения; сглаживание изменило бы его богословскую и мифологическую структуру.
- issue: Фраза «his perfect power, Barbelo» в ст. 4
  choice: «его совершенную силу, Барбело»
  alternative: «его совершенную силу — Барбело» или «его и его совершенную силу, Барбело»
  rationale: Сохранена синтаксическая неоднозначность приложения и повреждённой связи, отмеченной скобками в свидетельстве.
- issue: Пятерица при шести перечисленных именах в ст. 13
  choice: Перечень сохранён буквально и снабжён примечанием.
  alternative: Объединить Промысл/Барбело с Мыслью либо исключить один элемент для получения пяти.
  rationale: Редакторское исправление молча разрешило бы реальную текстовую или концептуальную трудность.
- issue: Пятерица как десятирица в ст. 14
  choice: Формула сохранена без догматического объяснения.
  alternative: Пояснить десятирицу как удвоение из-за андрогинности.
  rationale: Такое объяснение правдоподобно, но источник в данном фрагменте не формулирует его явно.
- issue: «which is the Father» в ст. 14
  choice: «она есть Отец»
  alternative: «который есть Отец» или «то есть Отец»
  rationale: Женское местоимение соотнесено с «пятерицей»; тождественная формула сохранена, а не ослаблена до пояснения.
translation_notes:
  register: Современный литературный русский с достоинством религиозно-философского текста. Специальные космологические термины («эон», «пятерица», «десятирица») сохранены; персонифицированные начала обозначены прописной буквой. Угловые и квадратные скобки исходного свидетельства сохранены. Поскольку прямая сверка с коптским источником ещё не выполнена, draft остаётся предварительным и опирается на предоставленное публичное английское свидетельство.
