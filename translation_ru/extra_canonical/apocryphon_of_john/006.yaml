  register: Современный литературный русский с умеренно возвышенным, сакральным регистром. Синтаксис упрощён лишь там, где это необходимо для ясности; повторения «помазал/помазание» и ключевые космологические титулы намеренно сохранены. Нумерация восстановлена по предоставленному свидетелю; посторонний рукописный номер страницы «7» не включён. Проект предварительный, поскольку непосредственная проверка коптских рукописных свидетелей заявлена как ожидающая выполнения.
