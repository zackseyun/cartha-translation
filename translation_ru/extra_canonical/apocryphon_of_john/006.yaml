translation:
  language: ru
  text: '1. Он также воззрел на Барбело чистым светом, окружающим незримого Духа, и своим сиянием; и она зачала от него.[a]


    2. Он породил искру света посредством света, подобного блаженству, однако этот свет не равен его величию.[b]


    3. Таков был Единородный Матери-Отца, который произошёл от него: его единственное порождение, Единородный Отца, чистый свет.


    4. Незримый девственный Дух также возрадовался свету, который возник, произойдя от первой силы его Промысла — то есть Барбело.


    5. И он помазал его своим помазанием, пока тот не стал совершенным и ни в чём не испытывал недостатка в помазании, потому что он помазал его помазанием незримого Духа. Он пребывал при нём, изливая на него помазание; и, как только тот принял от Духа, он прославил святого Духа и совершенный Промысл, благодаря которому произошёл.


    6. Он также попросил дать ему соработника — Ум, — и Дух с радостью согласился.[c]


    7. Когда незримый Дух согласился, Ум явился и пребывал при Христе — Помазаннике, прославляя его и Барбело; и все они стали пребывать в Безмолвии.[d]


    8. Ум также пожелал сотворить нечто посредством Слова незримого Духа. Его воля осуществилась и явилась вместе с Умом и Светом, прославляя его.[e]


    9. И Слово последовало за Волей, ибо посредством Слова Христос, Саморождённый Бог, сотворил Всё.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквальная структура свидетеля допускает разные отнесения выражения «своим сиянием» и местоимения «от него»; перевод не устраняет эту неясность.
    reason: Сохранение местоименной неоднозначности при отсутствии завершённой сверки с коптским текстом.
  - marker: b
    text: 'В источнике не вполне ясно, к чему именно относится указание «этот»: к свету, искре света или ближайшему образу блаженства.'
    reason: Предупреждение о неустойчивом референте указательного элемента.
  - marker: c
    text: Слова «Дух» нет в этой фразе английского свидетеля, но незримый Дух прямо назван согласившимся в следующем предложении.
    reason: Обозначение контекстуального восполнения ради естественного русского синтаксиса.
  - marker: d
    text: «Безмолвие» здесь, вероятно, является не просто отсутствием звука, а особой космологической реальностью или областью.
    reason: Пояснение технического, персонифицированного употребления.
  - marker: e
    text: Связь местоимения в словах «прославляя его» неоднозначна; возможно отнесение к незримому Духу либо к иному ближайшему участнику.
    reason: Сохранение синтаксической неоднозначности свидетеля.
  - marker: f
    text: «Всё» передаёт техническое обозначение полноты или совокупности всего возникшего. «Саморождённый» переводит титул существа, возникшего не через обычное рождение.
    reason: Пояснение космологических терминов без конфессионального переистолкования.
lexical_decisions:
- source_word: Barbelo
  choice: Барбело
  rationale: Собственное имя передано принятой русской транслитерацией без попытки истолковать его этимологически.
- source_word: unseen Spirit
  choice: незримый Дух
  rationale: «Незримый» сохраняет возвышенный регистр и точно передаёт отсутствие видимости; написание с прописной отражает статус именованной божественной реальности в данном тексте.
- source_word: spark / light-spark
  choice: сияние / искра света
  rationale: В первом предложении местоименная конструкция источника допускает понимание как сияния; во втором образ составного выражения сохранён буквально как «искра света».
- source_word: Mother-Father
  choice: Матерь-Отец
  rationale: Составное обозначение сохранено без устранения намеренного соединения материнского и отцовского образов.
- source_word: Providence
  choice: Промысл
  rationale: Традиционное и понятное русское обозначение божественного предведения и устроения; персонифицированное употребление отмечено прописной буквой.
- source_word: Mind
  choice: Ум
  rationale: Передаёт космологическую ипостась Nous без замены более узким «разум»; прописная обозначает персонификацию.
- source_word: Logos
  choice: Слово
  rationale: Сохраняет широкий смысл Logos и привычную русскую библейскую терминологию, не сводя понятие к речи или рассуждению.
- source_word: Christ (the anointed)
  choice: Христос — Помазанник
  rationale: Одновременно сохраняет титул и раскрывает его значение по явной глоссе свидетеля.
- source_word: silence
  choice: Безмолвие
  rationale: Более естественно и достойно, чем «тишина», для персонифицированной области или состояния; прописная сохраняет космологический характер.
- source_word: self-generated God
  choice: Саморождённый Бог
  rationale: Передаёт идею самостоятельно возникшего/порождённого божества и отличает термин от «Единородного».
- source_word: the All
  choice: Всё
  rationale: С прописной буквы передано техническое космологическое обозначение совокупности сущего.
theological_decisions:
- issue: Неясные местоименные референты в сцене зачатия и помазания
  choice: Сохранена последовательность мужских и женских местоимений без догматического уточнения всех референтов
  alternative: Явно подставить «Дух», «Барбело» или «Христос» в каждом случае
  rationale: Английский свидетель отражает синтаксическую неоднозначность, а прямая сверка с коптским источником ещё не выполнена.
- issue: Статус рождённого света
  choice: Сохранены титулы «Единородный», «Христос» и «Саморождённый Бог» как различные обозначения текста
  alternative: Унифицировать их под одним христологическим титулом
  rationale: Унификация сняла бы внутреннее терминологическое напряжение и могла бы привнести позднейшую конфессиональную схему.
- issue: Равенство света величию источника
  choice: Переведено «этот свет не равен его величию»
  alternative: Истолковать сравнение как относящееся к блаженству либо к искре
  rationale: Местоименная отсылка не вполне прозрачна; перевод следует ближайшей вероятной связи и отмечает её в сноске.
- issue: Личность согласившегося в пункте 6
  choice: В основном тексте уточнено «Дух с радостью согласился»
  alternative: Оставить только «он согласился»
  rationale: Контекст следующего предложения прямо называет согласившимся незримого Духа; уточнение улучшает русскую связность, при этом отмечено как контекстуальное восполнение.
- issue: Персонификация Ума, Слова, Воли, Света, Промысла и Безмолвия
  choice: Использованы прописные буквы
  alternative: Писать все отвлечённые существительные со строчной
  rationale: В отрывке они действуют как космологические сущности; прописные помогают читателю видеть эту функцию, не определяя их метафизический статус сверх текста.
