  yaml_path: translation/extra_canonical/apocryphon_of_john/010.yaml
  text: '1. He grasped and created additional aeons for himself with a shining spark that exists (even) now. He was astounded in the pride within him, and he begot authorities for himself.


    4. The first is named Athoth, whom the generations call [the Reaper].


    5. The second is Harmas, [being the] evil [{eye:1}].


    6. The third is Kalila-Oumbri.


    7. The fourth is Yabel.


    8. The fifth is Adonaiou, who is called Sabaoth.


    9. The sixth is Cain, whom the generations of humanity call the Sun.


    10. The seventh is Abel.


    11. The eighth is Abrisene.


    12. The ninth is Yobel. «11»


    13. The tenth is Armoupieel.


    14. The eleventh is Melcheir-Adonein.


    15. The twelfth is Belias, who is over the depths of Hades.'
translation:
  language: ru
  text: '1. Он овладел сияющей искрой, которая существует и поныне, и с её помощью создал для себя другие эоны. Он изумился гордыне, бывшей в нём, и породил для себя власти.


    4. Первого зовут Атот; поколения называют его [Жнецом].[a]


    5. Второй — Хармас, [злой] [{глаз:1}].[b]


    6. Третий — Калила-Умбри.


    7. Четвёртый — Ябель.


    8. Пятый — Адонайу, которого называют Саваофом.


    9. Шестой — Каин, которого поколения людей называют Солнцем.


    10. Седьмой — Авель.


    11. Восьмой — Абрисене.


    12. Девятый — Йобель.


    13. Десятый — Армупиэль.


    14. Одиннадцатый — Мельхеир-Адонеин.


    15. Двенадцатый — Белиас, властвующий над безднами Аида.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Жнецом» в исходном свидетельстве заключены в квадратные скобки как восстановленный или неуверенно читаемый текст.
    reason: Сохранить текстологическую неопределённость английского публичного свидетельства при отсутствии завершённой сверки с коптским текстом.
  - marker: b
    text: 'Фрагмент передан по редакционной записи свидетельства: «[being the] evil [{eye:1}]». Обозначение «{глаз:1}» сохранено как служебная помета о знаке или чтении; его точный смысл требует сверки с коптскими рукописями.'
    reason: Не скрывать повреждение или редакционную неопределённость и не превращать неясную помету в уверенный перевод.
lexical_decisions:
- source_word: grasped
  choice: овладел
  rationale: Передаёт активное завладение искрой; связь глагола с «сияющей искрой» в английском свидетельстве синтаксически неоднозначна, но такое прочтение естественно по-русски и сохраняет предмет действия.
- source_word: aeons
  choice: эоны
  rationale: Сохранён специальный космологический термин, а не общеязыковое «века» или пояснительное «миры».
- source_word: authorities
  choice: власти
  rationale: Буквальная и терминологически уместная передача обозначения сверхъестественных правителей; вариант «силы» был бы менее точен.
- source_word: generations
  choice: поколения
  rationale: Сохранён широкий смысл последовательных поколений, без сужения до «народов» или «родов».
- source_word: deeps
  choice: бездны
  rationale: Передаёт множественное число и образ глубочайших областей Аида; «глубины» возможно, но менее выразительно в данном контексте.
theological_decisions:
- issue: Статус эонов и властей в космологии текста
  choice: Сохранены термины «эоны» и «власти» без истолкования.
  alternative: Передать как «миры» и «духовные силы».
  rationale: Пояснительный перевод навязал бы конкретную космологическую схему и устранил терминологическую напряжённость оригинальной традиции.
- issue: Связь Каина с Солнцем
  choice: 'Утверждение передано прямо: «называют Солнцем».'
  alternative: Добавить пояснение, что это имя или отождествление.
  rationale: Свидетельство не уточняет характер связи; перевод не должен решать, идёт ли речь об имени, титуле или отождествлении.
- issue: Власть Белиаса над Аидом
  choice: «властвующий над безднами Аида».
  alternative: «поставленный над глубинами преисподней».
  rationale: Выбранный вариант не добавляет идеи назначения кем-либо и сохраняет имя мифологической области как «Аид».
translation_notes:
  register: 'Современный литературный русский с достоинством апокрифического повествования. Имена транслитерированы последовательно; библейски укоренённые формы «Саваоф», «Каин», «Авель» сохранены в привычном русском виде. Проект предварительный: предоставленное основание является англоязычным публичным свидетельством, а прямая сверка с коптскими кодексами ещё не выполнена. Нумерация фрагментов 1, 4–15 сохранена; голый номер страницы «11» после Йобеля опущен как рукописная пагинация.'
