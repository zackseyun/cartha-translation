  - marker: b
    text: 'Фрагмент передан с сохранением редакционной разметки свидетельства: «[being the] evil [{eye:1}]». В переводе «[будучи]» соответствует заключённому в скобки «[being the]»; «{глаз:1}» сохраняет служебную помету о знаке или чтении. Точный смысл этой пометы требует сверки с коптскими рукописями.'
