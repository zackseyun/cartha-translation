lexical_decisions:
- source_word: psychic body
  choice: душевное тело
  rationale: «Душевное» сохраняет специальный антропологический смысл, связанный с душой, и не подменяет его современным значением слова «психический».
- source_word: chief archon
  choice: главный архонт
  rationale: Термин «архонт» сохранён как характерное наименование космического правителя; «главный» естественно передаёт иерархический статус.
- source_word: Mother-Father of the All
  choice: Матерь-Отец Всего
  rationale: Составное именование и парадоксальная двуединая образность сохранены без конфессионального истолкования.
- source_word: five lights
  choice: пять светил
  rationale: «Светила» естественнее обозначает персонифицированные небесные сущности, чем отвлечённое «пять светов».
- source_word: Radiant Reflection / Reflection of Light
  choice: Светозарное Помышление / Светлое Помышление
  rationale: «Помышление» передаёт интеллектуально-ипостасный оттенок Reflection и согласуется с женским родом персонажа; вариативность эпитетов исходного свидетельства сохранена.
- source_word: Life
  choice: Жизнь
  rationale: Имя переведено буквально и оформлено как титул или собственное именование.
- source_word: perfection
  choice: полнота
  rationale: В данном космологическом контексте речь вероятнее о восстановлении целостности и полноты, а не только нравственного совершенства.
- source_word: light-shadow
  choice: светотень
  rationale: Сохранён необычный составной образ без попытки снять его смысловую неясность.
theological_decisions:
- issue: Источник оживляющего духа
  choice: Сохранено различие между действием Иалдаваофа и силой его Матери, которая через него переходит в тело.
  alternative: Представить Иалдаваофа самостоятельным дарителем жизни.
  rationale: Исходный текст подчёркивает его неведение и фактическое возвращение материнской силы.
- issue: Род и статус помощника Адама
  choice: «Помощница» и последующие местоимения женского рода.
  alternative: Нейтральное или мужское обозначение помощника.
  rationale: Сущность названа Жизнью и в свидетельстве обозначена женским местоимением; это грамматическое и персонажное различие важно сохранить.
- issue: Цель милости Матери-Отца в пункте 7
  choice: 'Фраза понята как предотвращение власти архонтов: «чтобы те не обрели власти».'
  alternative: «Потому что они могли обрести власть» или отнести субъект власти к иной группе.
  rationale: Синтаксис английского свидетельства неоднозначен; контекст последующего сокрытия помощницы от архонтов поддерживает превентивное прочтение, но неоднозначность отмечена в сноске.
- issue: Образ Того, Кто существует от начала
  choice: Сохранена возвышенная и неопределённая формула без отождествления с конкретной фигурой.
  alternative: Назвать его Первочеловеком, Богом или иной определённой сущностью.
  rationale: Свидетельство не даёт основания устранять референтную неоднозначность.
- issue: «Исправление ущерба Матери»
  choice: Передано как восстановительная функция Помышления без дальнейшего догматического объяснения.
  alternative: Истолковать как искупление греха или восполнение божественной природы.
  rationale: Такие уточнения импортировали бы внешнюю богословскую систему.
translation_notes:
  register: 'Современный литературный русский с достоинством апокрифического повествования. Специальные термины «архонт» и «душевное тело» сохранены, но синтаксис упрощён для обычного читателя. Проект предварительный: выполнен по предоставленному общедоступному английскому свидетельству; прямая сверка с коптским текстом ещё требуется.'
