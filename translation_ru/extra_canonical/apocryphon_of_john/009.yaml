translation:
  language: ru
  text: 'Далее София Размышления, будучи эоном, самостоятельно замыслила помысел — вместе с замыслом незримого Духа и Предведением.


    Она пожелала произвести из самой себя подобие без согласия Духа, который этого не одобрил, без своего спутника и без его решения, хотя лик её мужского начала этого не одобрил.


    И хотя она не нашла своего спутника и решилась на это без согласия Духа и без ведома своего спутника, благодаря неодолимой силе, обитавшей в ней,


    её помысел не остался бесплодным. Она произвела из самой себя нечто несовершенное и отличавшееся от неё обликом, потому что создала его без своего спутника. Он отличался от облика своей матери, ибо имел иной вид.


    Увидев порождение собственной воли, она обнаружила, что оно приняло облик дракона с львиным лицом[a],


    а глаза его были подобны сверкающим огням молний.


    Она оттолкнула его от себя, за пределы тех мест, чтобы никто из бессмертных не увидел его, потому что создала его в неведении.


    Она окружила его сияющим облаком и поставила посреди облака престол, чтобы никто не мог его увидеть, кроме Святого Духа, чьё имя — Мать живых. И она нарекла ему имя Ялтаваоф.


    Он — первый архонт, получивший от своей матери великую силу.


    Он отделился от неё и удалился от тех мест, где был рождён.'
