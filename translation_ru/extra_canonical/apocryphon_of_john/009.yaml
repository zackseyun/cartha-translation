  register: 'Современный литературный русский язык с сохранением технических терминов гностической космологии. Перевод предварительный: он выполнен по предоставленному англоязычному публичному свидетельству, поскольку прямая сверка с коптскими кодексами ожидается. Рукописный номер страницы и голый редакционный маркер удалены; содержательная неопределённость отмечена сноской.'
