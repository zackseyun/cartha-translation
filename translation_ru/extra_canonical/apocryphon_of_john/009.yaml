lexical_decisions:
- source_word: Sophia of Reflection
  choice: София Размышления
  rationale: Сохранено имя «София» и передан уточняющий титул; конструкция намеренно остаётся необычной, отражая техническую эонологическую номенклатуру свидетеля.
- source_word: aeon
  choice: эон
  rationale: Технический термин данного космологического текста сохранён транслитерацией, а не сведён к обычному значению «век».
- source_word: Precognition
  choice: Предведение
  rationale: Передано как персонифицированное понятие с прописной буквы; «Предведение» естественнее в русском религиозно-философском регистре, чем «Предзнание».
- source_word: companion
  choice: спутник
  rationale: Нейтрально передаёт парного участника, не навязывая брачный или иной конфессионально окрашенный смысл.
- source_word: chief archon
  choice: первый архонт
  rationale: «Архонт» сохранён как специальный термин; «первый» выражает первенство и главенство без современного административного оттенка слова «главный».
- source_word: Yaltabaoth
  choice: Ялтаваоф
  rationale: Использована узнаваемая русская форма имени, близкая к традиционной передаче греческого написания.
theological_decisions:
- issue: Участие незримого Духа и Предведения в первом предложении
  choice: Сохранена синтаксическая связь «вместе с замыслом незримого Духа и Предведением»
  alternative: Истолковать Софию как действующую полностью отдельно от незримого Духа и Предведения
  rationale: Английский свидетель допускает напряжённое и не вполне ясное соотношение самостоятельного действия Софии с упоминанием замысла Духа и Предведения; перевод не устраняет эту неясность.
- issue: Мужское начало Софии
  choice: «лик её мужского начала»
  alternative: «её мужской двойник» или отождествление со спутником
  rationale: Сохранён образный и технически неясный язык свидетеля без догматического отождествления «мужского начала» со спутником.
- issue: Характер порождения Софии
  choice: «нечто несовершенное» с последующим мужским местоимением
  alternative: Сразу назвать порождение существом, сыном или божеством
  rationale: Первоначальная неопределённость сохраняется, а грамматический переход к мужскому роду следует развитию исходного повествования.
- issue: Создание «в неведении»
  choice: Сохранено без пояснения, чьё именно неведение и каков его метафизический смысл
  alternative: Передать как грех, заблуждение или бессознательное действие
  rationale: Текст говорит о неведении, но перевод не должен самостоятельно превращать его в конкретную богословскую категорию.
- issue: Личность Святого Духа и Матери живых
  choice: Формулировка «Святого Духа, чьё имя — Мать живых»
  alternative: Разделить их как две личности или отождествить с Софией
  rationale: Сохранено прямое отождествление в свидетельстве без дополнительной систематизации.
