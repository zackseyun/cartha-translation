  revised_text: 'Тогда Отражение Света скрылось внутри него. Главный архонт захотел извлечь её из его ребра, но Отражение Света невозможно схватить.


    Хотя тьма преследовала её, поймать её она не смогла. Тогда он извлёк из него часть его силы и создал другую форму — в образе женщины, по подобию Отражения, явившегося ему. Часть, которую он извлёк из силы человека, он поместил внутрь женской формы — не «его ребро», как сказал Моисей, — и увидел рядом с собой женщину.


