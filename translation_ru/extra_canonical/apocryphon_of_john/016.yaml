base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: ru
  text: 'Тогда Отражение Света скрылось внутри него. Главный архонт захотел извлечь её из его ребра, но Отражение Света неуловимо.


    Хотя тьма преследовала её, поймать её она не смогла. Тогда он извлёк из человека часть его силы и создал другую форму — в образе женщины, по подобию явившегося ему Отражения. Часть, которую он извлёк из силы мужчины, он поместил в женскую форму — а не «его ребро», как сказал Моисей, — и увидел рядом с собой женщину.


    В тот же миг явилось и Сияющее Отражение. Оно сняло покров, застилавший его разум, и после опьянения тьмой он вновь обрёл ясность. Он узнал соответствующий ему образ и сказал: «Вот, это кость от костей моих и плоть от плоти моей.


    Поэтому мужчина оставит отца и мать, прилепится к своей жене, и оба станут одной плотью», — потому что к нему будет послана его спутница. Он оставит отца и мать — и Софию, нашу сестру, которая в невинности сошла вниз, чтобы исправить свой недостаток, из-за которого была названа «Жизнью», то есть «матерью живых», — благодаря Промыслу небесного Владычества и [Отражению, явившемуся] ему. Через неё они вкусили совершенного знания.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен по опубликованному английскому свидетелю; непосредственная сверка с коптскими рукописями ещё не проведена. В выражении «матерью живых» английский свидетель допускает также буквальное чтение «матерью или живой». Квадратные скобки в словах «[Отражению, явившемуся]» обозначают редакционное восстановление текста.'
    reason: Необходимо явно отметить ограниченную источниковую базу, существенную лексическую неоднозначность и восстановленный фрагмент.
lexical_decisions:
- source_word: Reflection of Light / Radiant Reflection
  choice: Отражение Света / Сияющее Отражение
  rationale: Сохранены повтор и различие эпитетов английского свидетеля; «Отражение» передаёт самостоятельный персонифицированный образ без преждевременного отождествления с иным техническим термином.
- source_word: chief archon
  choice: главный архонт
  rationale: Термин «архонт» закреплён в русскоязычном описании гностических текстов и сохраняет специфическое космологическое значение.
- source_word: mold
  choice: форма
  rationale: «Форма» естественнее в современном русском и сохраняет смысл изготовленного вместилища или образца; более буквальное «слепок» могло бы неоправданно конкретизировать материал.
- source_word: counterpart of his own image
  choice: соответствующий ему образ
  rationale: Формулировка сохраняет неясную связь соответствия и образа, не сводя её однозначно к двойнику или супруге.
- source_word: cleave
  choice: прилепится
  rationale: Сохранена узнаваемая библейская лексика цитаты Бытия, остающаяся понятной современному читателю.
- source_word: Providence
  choice: Промысл
  rationale: Традиционный и понятный русский термин для персонифицированного или космического провидения.
- source_word: sovereignty of Heaven
  choice: небесное Владычество
  rationale: Сохранена возможная персонификация и космологическая окраска; вариант «власть Небес» сильнее сглаживал бы термин.
theological_decisions:
- issue: Полемика с рассказом Моисея о ребре
  choice: «а не „его ребро“, как сказал Моисей»
  alternative: '«не так, как сказал Моисей: „его ребро“»'
  rationale: Сохранено прямое противопоставление текста повествованию Бытия без попытки согласовать версии.
- issue: Род и референт персонифицированного Отражения
  choice: В первом абзаце употреблено «её» по отношению к Отражению, далее — грамматическое «оно»
  alternative: Повсеместно заменить местоимения существительным
  rationale: Женский референт английского свидетеля сохранён там, где он выражен явно, но русский грамматический строй требует среднего рода при непосредственном согласовании со словом «Отражение».
- issue: Сложный синтаксис о том, кого оставит мужчина
  choice: Сохранено включение Софии в оборот «оставит отца и мать — и Софию»
  alternative: Понимать Софию как пояснение только к «матери»
  rationale: Свидетель допускает синтаксическую неоднозначность; перевод не устраняет напряжение посредством конфессионального или интерпретаторского решения.
- issue: «mother or the living»
  choice: «матерью живых»
  alternative: «матерью или живой»
  rationale: Вероятна аллюзия на Быт 3:20, но английский свидетель текстуально неустойчив; выбран связный библейский смысл с обязательной сноской о варианте.
- issue: Число участников в финале
  choice: «они вкусили»
  alternative: «он вкусил»
  rationale: Сохранено множественное число источника, несмотря на не вполне ясный круг участников.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией. Узнаваемые цитаты из Бытия переданы в библейском регистре («кость от костей», «прилепится», «одной плотью»), тогда как повествовательные связки упрощены для ясности. Специальные космологические термины сохранены без деноминационного истолкования.
