  source_fidelity: В целом переданы порядок событий, полемическое противопоставление «ребру» Моисея, множественное число в заключении и восстановленный фрагмент. Однако перевод неоправданно разрешает текстуально отмеченную неоднозначность «mother or the living» как «матерью живых», а синтаксис фразы о Софии изменён добавлением союза «и», отчего София становится отдельным третьим объектом оставления, а не возможным пояснением к матери.
  naturalness: 'Русский текст в основном литературен и выдержан. Следует устранить неестественное «соответствующий ему образ», заменить его на более ясное, но не толкующее «соответствие его собственному образу», и сделать местоименную отсылку к персонифицированному Отражению последовательной: «она».'
  terminology: «Главный архонт», «Отражение Света», «Сияющее Отражение», «Промысл» и «небесное Владычество» сохранены удачно. «Женская форма» допустима для mold. Формула «матерь или живая» намеренно сохраняет неустойчивость английского свидетеля и потому требует поясняющей сноски.
