  yaml_path: translation/extra_canonical/apocryphon_of_john/011.yaml
  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: ru
  text: 'Он также поставил семь царей, каждый из которых соответствует небесным твердям над семью небесами, и ещё пятерых — над глубиной бездны, чтобы они правили.


    Он также поделился с ними своим огнём, но не передал им силы света, которую получил от своей матери, потому что он — невежественная тьма. Когда свет соединился с тьмой, он заставил тьму сиять; а когда тьма соединилась со светом, она помрачила свет. И он стал ни светом, ни тьмой, но сделался сумрачным.


    У немощного архонта три имени. Первое имя — Ялтаваоф, второе — Саклас, а третье — Самаэль. Он порочен из-за живущей в нём гордыни, ибо сказал: «Я — Бог, и нет другого бога, кроме меня». Ведь он не знает ни собственной силы, ни места, откуда произошёл.


    Архонты также создали себе семь сил, а каждая из сил создала себе по шесть ангелов, так что всего их стало 365. Вот тела, соответствующие этим именам:


    Первый ‹есть› Афоф — у него лицо овцы; второй — Элоайу, у него лицо осла; третий — Астафайос, у него лицо [гиены]; четвёртый — Яо, у него лицо семиглавого [дракона]; пятый — Саваоф, у него лицо дракона; шестой — Адонин, у него лицо обезьяны; седьмой — Савведе, у него лицо пылающего огня.


    Таково семеричное [устройство] недели.[a]


    У Ялтаваофа же было множество лиц — больше, чем у всех остальных, — так что, находясь среди серафимов, он мог по своему желанию принимать перед ними любое лицо.


    Поскольку он поделился с ними своим огнём, он стал их владыкой.


    Из-за славной силы, которой он обладал благодаря свету своей матери, он назвал себя Богом и не повиновался месту, откуда произошёл.


    Он также соединил в своей мысли семь сил с властями, которые были с ним. Когда он говорил, сказанное совершалось. И он дал имя каждой силе, начав с высшей:


    Первая — Благость, вместе с первой властью, Афофом; вторая — Провидение, вместе со второй властью, Элоайо; третья — Божественность, вместе с третьей властью, Астрафайо; четвёртая — Владычество, вместе с четвёртой властью, Яо; пятая — Царство, вместе с пятой властью, Саваофом; шестая — Ревность, вместе с шестой властью, Адонеином; седьмая — София, вместе с седьмой властью, Савватеоном.[b]


    У них также есть твердь, соответствующая каждому небесному эону.


    Им были даны имена, соответствующие славе небесных сущностей, чтобы привести к [уничтожению] сил. Однако сила пребывала в именах, данных [им] их создателем, тогда как имена, данные им в соответствии со славой небесных сущностей, будут означать для них уничтожение и немощь.[c]


    Таким образом, у них по два имени.


    [Затем,] создав [всё, он устроил] их по подобию первых возникших эонов, чтобы создать их по подобию нетленных.


    Не потому, что он видел нетленные сущности, но благодаря находившейся в нём силе, которую он получил от своей матери, он породил внутри себя подобие мира. Увидев вокруг себя творение и сонм ангелов, которые произошли от него, он объявил им: «Я — Бог ревнитель, и нет другого Бога, кроме меня».


    Однако этими словами он дал служившим ему ангелам понять, что существует другой Бог. Ведь если бы другого не было, то к кому он мог бы ревновать?


    Тогда мать начала «двигаться туда и обратно»,[d] осознав ущерб, поскольку сияние её света уменьшилось; и она помрачилась оттого, что её спутник не пришёл с ней к согласию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Это — семеричность недели». Формулировка указывает на соответствие семи властителей семи дням, но синтаксис неясен.'
    reason: Сохранить неясность краткой космологической формулы.
  - marker: b
    text: Написание имён передаёт формы данного свидетельства; в рукописных версиях встречаются варианты.
    reason: Собственные имена различаются между свидетелями и даже внутри перечней.
  - marker: c
    text: Этот отрывок о двух рядах имён текстуально и смыслово труден; слова в квадратных скобках являются восстановлением утраченного или неясного текста.
    reason: Предупредить читателя о повреждении и не скрывать редакционную реконструкцию.
  - marker: d
    text: В свидетельстве стоит неясное выражение со значением движения «туда и обратно»; его точный образный смысл не установлен.
    reason: Исходная редакционная помета {move:3} не предназначена для читательского текста, но обозначаемую ею неопределённость следует сохранить.
lexical_decisions:
- source_word: archon
  choice: архонт
  rationale: Сохранён традиционный специальный термин гностических текстов; перевод «правитель» стёр бы различие между архонтами, царями и властями.
- source_word: power
  choice: сила
  rationale: 'Сохраняет повторяющийся термин и его намеренную многозначность: личная космическая сила и могущество.'
- source_word: authority
  choice: власть
  rationale: Отличает эту категорию существ от «сил» и передаёт иерархическую терминологию текста.
- source_word: firmament
  choice: твердь
  rationale: Устоявшийся библейский эквивалент, уместный для космологии отрывка.
- source_word: aeon
  choice: эон
  rationale: Технический космологический термин сохранён транслитерацией, чтобы не сводить его лишь к периоду времени.
- source_word: Sophia
  choice: София
  rationale: Передано как имя/ипостасное наименование, а не переведено «Мудрость», в соответствии с контекстом перечня имён.
- source_word: jealous
  choice: ревнитель / ревновать
  rationale: Сохранена перекличка с библейской формулой и логикой последующего риторического вопроса.
- source_word: indestructible
  choice: нетленные
  rationale: Естественный литературный и богословски нейтральный эквивалент для существ, не подверженных разрушению.
theological_decisions:
- issue: Притязание Ялтаваофа на божественность
  choice: Сохранено как речь персонажа с различением прописного и строчного написания по синтаксическому контексту
  alternative: Унифицировать все упоминания слова «бог» по конфессиональному правилу
  rationale: Текст намеренно противопоставляет самопровозглашённого бога иному Богу; перевод не должен заранее разрешать это напряжение.
- issue: Связь света и тьмы
  choice: Сохранена парадоксальная последовательность взаимного соединения и итогового сумрака
  alternative: Разъяснить её как смешение двух субстанций
  rationale: Источник не даёт систематического объяснения, поэтому образ не истолкован сверх текста.
- issue: Два ряда имён сил
  choice: Сохранена трудная формулировка об именах, силе, уничтожении и немощи
  alternative: Перестроить фразу так, чтобы однозначно определить, какой ряд имён спасителен или губителен
  rationale: Свидетельство неоднозначно и, вероятно, текстуально повреждено; скрытое разрешение противоречия было бы интерпретацией.
- issue: Причина помрачения матери
  choice: «её спутник не пришёл с ней к согласию»
  alternative: «её супруг не соединился с ней»
  rationale: Выбран нейтральный вариант, сохраняющий как личностный, так и космологический смысл согласованного действия без внесения сексуализированного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего космологического повествования. Специальные термины «архонт», «эон» и «София» сохранены, тогда как синтаксис по возможности сделан понятным обычному читателю. Рукописные номера страниц удалены как внешняя пагинация; угловые и квадратные скобки сохранены там, где они отражают редакционное дополнение или реконструкцию.
