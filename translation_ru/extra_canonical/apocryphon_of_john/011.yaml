  revised_text: 'Он также поставил семь царей, каждый из которых соответствует небесным твердям над семью небесами, и ещё пятерых — над глубиной бездны, чтобы они правили.


    Он также поделился с ними своим огнём, но не передал им ничего от силы света, которую получил от своей матери, потому что он — невежественная тьма. Когда свет соединился с тьмой, он заставил тьму сиять; а когда тьма соединилась со светом, она помрачила свет. И это стало ни светом, ни тьмой, но сделалось сумрачным.


    У немощного архонта три имени. Первое имя — Ялтаваоф, второе — Саклас, а третье — Самаэль. Он порочен из-за живущей в нём гордыни, ибо сказал: «Я — Бог, и нет другого бога, кроме меня». Ведь он не знает ни собственной силы, ни места, откуда произошёл.


    Архонты также создали себе семь сил, а каждая из сил создала себе по шесть ангелов, так что всего их стало 365. Вот тела, соответствующие этим именам:


    Первый ‹есть› Афоф — у него лицо овцы; второй — Элоайу, у него лицо осла; третий — Астафайос, у него лицо [гиены]; четвёртый — Яо, у него лицо семиглавого [дракона]; пятый — Саваоф, у него лицо дракона; шестой — Адонин, у него лицо обезьяны; седьмой — Савведе, у него лицо сияющего огня.


    Таково семеричное [устройство] недели.[a]


    У Ялтаваофа же было множество лиц — больше, чем у всех остальных, — так что, находясь среди серафимов, он мог по своему желанию принимать перед ними любое лицо.


    Поскольку он поделился с ними своим огнём, он стал их владыкой.


    Из-за славной силы, которой он обладал благодаря свету своей матери, он назвал себя Богом и не повиновался месту, откуда произошёл.


    Он также соединил в своей мысли семь сил с властями, которые были с ним. Когда он говорил, сказанное совершалось. И он дал имя каждой силе, начав с высшей:


    Первая — Благость, вместе с первой властью, Афофом; вторая — Провидение, вместе со второй властью, Элоайо; третья — Божественность, вместе с третьей властью, Астрафайо; четвёртая — Владычество, вместе с четвёртой властью, Яо; пятая — Царство, вместе с пятой властью, Саваофом; шестая — Ревность, вместе с шестой властью, Адонеином; седьмая — София, вместе с седьмой властью, Савватеоном.[b]


    У них также есть твердь, соответствующая каждому небесному эону.


    Им были даны имена, соответствующие славе небесных сущностей, чтобы привести к [уничтожению] сил. Однако сила пребывала в именах, данных [им их] создателем, тогда как имена, данные им в соответствии со славой небесных сущностей, будут означать для них уничтожение и немощь.[c]


    Таким образом, у них по два имени.


    [Затем,] создав [всё, он устроил] их по подобию первых возникших эонов, чтобы создать их по подобию нетленных.


    Не потому, что он видел нетленные сущности, но благодаря находившейся в нём силе, которую он получил от своей матери, он породил внутри себя подобие мира. Увидев вокруг себя творение и сонм ангелов, которые произошли от него, он объявил им: «Я — Бог ревнитель, и нет другого Бога, кроме меня».


    Однако этими словами он дал служившим ему ангелам понять, что существует другой Бог. Ведь если бы другого не было, то к кому он мог бы ревновать?


    Тогда мать начала «двигаться туда и обратно»,[d] осознав ущерб, поскольку сияние её света уменьшилось; и она помрачилась оттого, что её спутник не пришёл с ней к согласию.'
