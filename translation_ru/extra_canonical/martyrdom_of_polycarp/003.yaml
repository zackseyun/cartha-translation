lexical_decisions:
- source_word: μαρτύρια (предполагаемый греческий термин, по свидетельству)
  choice: мученичества
  rationale: Сохранён раннехристианский смысл свидетельства, завершившегося страданием и смертью; «мученические смерти» было бы более пояснительно, но уже.
- source_word: δεσπότης / Master (по английскому свидетельству)
  choice: Владыка
  rationale: Передаёт отношение преданности и верховной власти, сохраняя возвышенный раннехристианский регистр.
- source_word: ἀνατομή / mechanism of their flesh (предполагаемая основа)
  choice: строение их плоти
  rationale: Естественно по-русски передаёт видимую внутреннюю структуру тела без механистического оттенка слова «механизм».
- source_word: ἀποδημεῖν ἐκ τῆς σαρκός / absent from the flesh (по свидетельству)
  choice: словно пребывали вне тела
  rationale: Сохраняет образ отстранённости от телесного страдания; «словно» не превращает риторическое наблюдение автора в точное учение о состоянии души.
- source_word: ἀντίρρησις / denial (предполагаемый термин)
  choice: отречение
  rationale: В контексте гонений речь идёт об отречении от Христа или исповедания, а не просто о словесном возражении.
theological_decisions:
- issue: Божья воля и власть в отношении мученичества
  choice: «совершившиеся по воле Божьей… признавать за Богом власть над всем»
  alternative: «допущенные Божьей волей»
  rationale: Не добавлено разграничение между волей и попущением, которого нет в предоставленном свидетельстве; сохранена богословская напряжённость текста.
- issue: Состояние мучеников во время пыток
  choice: «словно пребывали вне тела — или, вернее, что Господь стоял рядом»
  alternative: «не чувствовали тела»
  rationale: Сохранено авторское самоуточнение «или, вернее» и не введено физиологическое объяснение.
- issue: «Уже не люди, а ангелы»
  choice: Сохранено как сильное риторическое утверждение
  alternative: «уподобились ангелам»
  rationale: Смягчение разрешило бы образ за автора; буквальная напряжённость оригинального свидетельства сохранена.
- issue: «Покупая» освобождение от вечного наказания
  choice: «ценой одного часа приобретая избавление»
  alternative: «за один час получая избавление»
  rationale: Сохранена образная идея цены, но формулировка не превращена в систематическое учение о заслуге.
translation_notes:
  register: Современный литературный русский язык с dignified раннехристианским звучанием. Сохранены ключевые риторические усиления и богословские напряжения; архаизмы ограничены устойчивыми словами «Владыка», «уготованные», «очами сердца». Поскольку прямая сверка с греческим источником обозначена как ожидающая выполнения, решения осторожно основаны на предоставленном публичном английском свидетельстве и общедоступно известных формулировках греческой традиции.
