base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: ru
  text: 'Но ревнивый и завистливый Лукавый, враг рода праведных, увидел величие его мученичества, его безупречную жизнь от самого начала, то, как он был увенчан венцом бессмертия и получил награду, которую никто не мог оспорить. Поэтому он устроил так, чтобы нам не отдали даже его бедное тело, хотя многие желали забрать его и прикоснуться к его святой плоти.


    Тогда он побудил Никета, отца Ирода и брата Алки, просить правителя не отдавать его тело, «чтобы, — как говорили, — они не оставили Распятого и не начали поклоняться этому человеку». Это было сделано по наущению и настойчивой просьбе иудеев, которые также сторожили тело, когда мы собирались забрать его из огня. Они не знали, что мы никогда не сможем ни оставить Христа, пострадавшего ради спасения всего мира спасаемых[a] — Безвинного, пострадавшего за грешников, — ни поклоняться кому-либо другому.


    Ему мы поклоняемся, потому что Он — Сын Божий; мучеников же мы любим как учеников и подражателей Господа — как они того заслуживают своей несравненной преданностью собственному Царю и Учителю. Да будет дано и нам оказаться вместе с ними сопричастниками и соучениками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «всего мира спасаемых» передаёт трудную и допускающую разные синтаксические толкования формулировку свидетельства; возможный смысл: «ради спасения всех спасаемых в мире».'
    reason: Необходимо обозначить подлинную неоднозначность фразы и не разрешать молча вопрос об объёме выражения.
lexical_decisions:
- source_word: Evil One
  choice: Лукавый
  rationale: Традиционное и понятное русское обозначение личного противника; прописная буква сохраняет персонификацию.
- source_word: family of the righteous
  choice: род праведных
  rationale: Сохраняет семейно-родовую метафору без сужения до конкретной общины.
- source_word: martyrdom
  choice: мученичество
  rationale: Передаёт как страдание и смерть за веру, так и раннехристианский смысл свидетельства в привычном русском термине.
- source_word: poor body
  choice: бедное тело
  rationale: Сохраняет сочувственную, несколько уничижительную характеристику тела, не усиливая её до «жалкие останки».
- source_word: holy flesh
  choice: святая плоть
  rationale: Сохраняет телесность и почтительный язык источника; «останки» было бы истолковывающим обобщением.
- source_word: adore / worship
  choice: поклоняемся / поклоняться
  rationale: Один и тот же русский корень ясно передаёт исключительность поклонения Христу в противопоставлении любви к мученикам.
- source_word: cherish
  choice: любим
  rationale: Естественно передаёт почтительную привязанность, не приписывая мученикам богопоклонение.
- source_word: partakers and fellow-disciples
  choice: сопричастниками и соучениками
  rationale: 'Сохраняет два параллельных понятия: участие в их уделе и совместное ученичество.'
theological_decisions:
- issue: Различие между поклонением Христу и отношением к мученикам
  choice: «Ему мы поклоняемся… мучеников же мы любим»
  alternative: «Его мы почитаем… мучеников чтим»
  rationale: Выбранная формулировка сохраняет резкое противопоставление источника и не стирает исключительность поклонения Сыну Божьему.
- issue: Объём спасения в выражении «the whole world of those that are saved»
  choice: «всего мира спасаемых» с примечанием
  alternative: «всего мира» или «всех спасаемых в мире»
  rationale: Буквенно близкая формулировка сохраняет напряжение и возможную неоднозначность, не превращая её без пояснения ни в универсальное утверждение, ни в ограничительное.
- issue: Безвинность Христа и заместительный характер страдания
  choice: «Безвинного, пострадавшего за грешников»
  alternative: «хотя Он был без вины, Он пострадал ради грешников»
  rationale: Сохраняет обе исходные мысли без разработки конкретной теории искупления.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского повествования. Синтаксис упрощён там, где длинный период мешал бы пониманию, но риторическое противопоставление Христа и мучеников сохранено. Имена переданы в русской форме: Никет, Ирод, Алка. Драфт остаётся предварительным, поскольку предоставлено английское публично-доменное свидетельство, а прямая сверка с греческим источником ещё не выполнена.'
