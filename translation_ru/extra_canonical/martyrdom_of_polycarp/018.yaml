review_pass:
  verdict: revise
  source_fidelity: 'Передача в целом верна и сохраняет ключевое противопоставление: Христу, Сыну Божьему, воздаётся поклонение, тогда как мучеников любят как учеников и подражателей Господа. Однако «сторожили тело» добавляет объект, которого в свидетельстве нет: говорится, что иудеи «следили/стояли настороже», когда христиане намеревались взять тело из огня. Формулу о «мире спасаемых» следует сделать синтаксически понятнее, сохранив её трудность в примечании.'
  naturalness: Современный литературный регистр в основном выдержан. «Бедное тело» и «всего мира спасаемых» звучат по-русски неестественно; «беззащитное тело» и «всего мира тех, кто спасается» естественнее, не меняя содержания. «Следили» также точнее и плавнее, чем «сторожили тело».
  terminology: «Лукавый», «мученичество», «святая плоть», «Распятый», «Христос», «Сын Божий», «поклоняемся», «ученики» и «подражатели» уместны. Имена Никет, Ирод и Алка сохранены. «Любим» корректно передаёт cherish и не смешивает отношение к мученикам с поклонением Богу.
  issues:
  - severity: medium
    issue: Добавлен объект в «которые также сторожили тело».
    rationale: В исходной фразе иудеи «следили/были настороже», когда христиане собирались взять тело из огня; прямого утверждения, что они сторожили именно тело, нет.
  - severity: medium
    issue: «Всего мира спасаемых» синтаксически неестественно и затемняет смысл.
    rationale: Трудную конструкцию следует сохранить без конфессионального разрешения, но выразить по-русски как «всего мира тех, кто спасается» и пояснить её в сноске.
  - severity: low
    issue: «Бедное тело» в современном русском может ошибочно звучать как указание на материальную бедность.
    rationale: «Беззащитное тело» естественнее передаёт сочувственный оттенок выражения, не превращая тело в «останки» и не ослабляя телесность формулировки.
  revised_text: 'Но ревнивый и завистливый Лукавый, враг рода праведных, увидел величие его мученичества, его безупречную жизнь от самого начала, то, как он был увенчан венцом бессмертия и получил награду, которую никто не мог оспорить. Поэтому он устроил так, чтобы нам не отдали даже его беззащитное тело, хотя многие желали забрать его и прикоснуться к его святой плоти.


    Тогда он побудил Никета, отца Ирода и брата Алки, просить правителя не отдавать его тело, «чтобы, — как говорили, — они не оставили Распятого и не начали поклоняться этому человеку». Это было сделано по наущению и настойчивой просьбе иудеев, которые также следили, когда мы собирались забрать его из огня. Они не знали, что мы никогда не сможем ни оставить Христа, пострадавшего ради спасения всего мира тех, кто спасается[a], — Безвинного, пострадавшего за грешников, — ни поклоняться кому-либо другому.


    Ему мы поклоняемся, потому что Он — Сын Божий; мучеников же мы любим как учеников и подражателей Господа — как они того заслуживают своей несравненной преданностью собственному Царю и Учителю. Да будет дано и нам оказаться вместе с ними сопричастниками и соучениками.'
  revised_footnotes:
  - marker: a
    text: 'Формулировка «всего мира тех, кто спасается» передаёт трудную конструкцию свидетельства. Её можно понимать как относящую спасение ко «всему миру» спасаемых; возможна также передача: «ради спасения всех спасаемых в мире».'
    reason: Сноска отмечает синтаксическую трудность без молчаливого выбора между возможными пониманиями объёма выражения.
  revision_rationale: 'Исправлены три безопасные точки: устранено добавление «тело» при глаголе наблюдения, сглажена русская передача сочувственного определения тела и прояснён трудный оборот о «мире тех, кто спасается». Риторика и богословское различие между поклонением Христу и любовью к мученикам сохранены; спорная формула снабжена нейтральным пояснением.'
