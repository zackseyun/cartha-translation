base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: ru
  text: 'Когда он вознёс «Аминь» и окончил молитву, те, кто следил за огнём, разожгли костёр. И когда ярко вспыхнуло могучее пламя, мы, кому было дано это увидеть, увидели чудо; и мы были сохранены, чтобы рассказать остальным о том, что произошло.


    Огонь принял вид свода и, словно парус корабля, наполненный ветром, стеной окружил тело мученика. А оно находилось посреди — не как горящая плоть, но как [хлеб в печи или как] золото и серебро, очищаемые в горниле. И мы ощутили такое благоухание, словно до нас донёсся аромат ладана или какого-либо другого драгоценного благовония.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному английскому свидетельству; непосредственная сверка с греческой рукописной традицией ещё требуется. Квадратные скобки в выражении «[хлеб в печи или как]» сохранены как указание на текстуальную реконструкцию или повреждение рукописного текста.'
    reason: Исходные данные прямо указывают, что проверка по греческому тексту ещё не проведена, а скобки обозначают неуверенность текстуальной передачи.
lexical_decisions:
- source_word: offered up the Amen
  choice: вознёс «Аминь»
  rationale: Сохраняет образ молитвенного возношения и необычную субстантивацию заключительного «Аминь», не сводя выражение просто к «сказал аминь».
- source_word: firemen / those tending the fire
  choice: те, кто следил за огнём
  rationale: Избегает современного значения слова «пожарные» и передаёт людей, которым было поручено разжечь и поддерживать костёр.
- source_word: vault
  choice: свод
  rationale: Передаёт куполообразную форму пламени; последующее сравнение с наполненным ветром парусом делает образ понятным.
- source_word: martyr
  choice: мученик
  rationale: Устоявшееся и исторически уместное русское обозначение человека, принимающего смерть за веру.
- source_word: refined in a furnace
  choice: очищаемые в горниле
  rationale: Сохраняет металлургический образ очищения драгоценных металлов и возвышенный регистр.
- source_word: frankincense
  choice: ладан
  rationale: Обычное русское название благовонной смолы, уместное в раннехристианском контексте.
theological_decisions:
- issue: Характер описанного события
  choice: увидели чудо
  alternative: увидели дивное зрелище
  rationale: Слово «чудо» непосредственно соответствует свидетельскому утверждению текста и не объясняет ни природу, ни механизм события.
- issue: Смысл слов «мы были сохранены»
  choice: мы были сохранены
  alternative: мы остались в живых
  rationale: Пассивная формулировка сохраняет возможный богословский оттенок провиденциального сохранения, не называя действующего лица и не устраняя двусмысленность.
- issue: Образ тела среди огня
  choice: не как горящая плоть, но как… золото и серебро
  alternative: оно не горело, как плоть, но сияло, как…
  rationale: Не добавляется отсутствующее в свидетельстве слово «сияло» и не усиливается утверждение о физической неуязвимости тела.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис умеренно возвышенный, но понятный; архаизмы сведены к общеупотребительным словам историко-религиозного регистра («мученик», «горнило», «ладан»). Поскольку греческая сверка ожидается, перевод не претендует на разрешение текстологических и лексических вопросов сверх предоставленного свидетельства.
