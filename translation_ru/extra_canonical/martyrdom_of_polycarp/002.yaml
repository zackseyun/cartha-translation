    issue: «Он медлил» для описания поведения Поликарпа
    rationale: Греческое ὑπέμεινεν и английское witness «lingered» в контексте ожидания предания не требуют оттенка медлительности или уклончивого затягивания. «Он ждал» передаёт это безопаснее.
  - severity: medium
    issue: «Господь» вместо «Владыка»
    rationale: В греческой традиции этого места стоит δεσπότης («Владыка», «Господин»). «Господь» соответствует английскому аудиторскому свидетельству, но сглаживает исходную лексику.
  - severity: low
