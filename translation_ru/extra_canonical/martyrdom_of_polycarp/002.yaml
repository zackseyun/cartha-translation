base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: ru
  text: 'Братья, мы пишем вам о том, что случилось с принявшими мученическую смерть, и особенно — с блаженным Поликарпом, который положил конец гонению, словно запечатлев его своим мученичеством. Ведь почти всё, что произошло прежде, совершилось для того, чтобы Владыка вновь показал нам пример мученичества, соответствующего Евангелию.


    Он ждал, чтобы быть преданным, как и Владыка, дабы и мы стали его подражателями, заботясь не только о себе, но и о ближних. Ибо истинной и стойкой любви свойственно желать спасения не только для себя, но и для всех братьев.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: братья
  rationale: Естественное и достойное обращение в раннехристианском письме; передаёт общинное родство без ненужной архаизации.
- source_word: suffered martyrdom
  choice: принявшими мученическую смерть
  rationale: Передаёт технический раннехристианский смысл мученичества и остаётся понятным современному читателю.
- source_word: stayed the persecution
  choice: положил конец гонению
  rationale: 'Сохраняет причинно-завершающий смысл свидетельства: мученичество Поликарпа представлено как завершение гонения.'
- source_word: set his seal upon it
  choice: запечатлев его
  rationale: Сохраняет образ печати и смысл окончательного подтверждения или завершения.
- source_word: conformable to the Gospel
  choice: согласного с Евангелием
  rationale: Естественно выражает соответствие образцу Евангелия, не сводя фразу лишь к нравственному одобрению.
- source_word: linger(ed)
  choice: медлил
  rationale: Сохраняет указание на отсрочку добровольной сдачи, не усиливая его до бегства или уклонения.
- source_word: delivered up
  choice: быть преданным
  rationale: Сохраняет евангельскую перекличку с преданием Иисуса, важную для параллели в тексте.
- source_word: neighbors
  choice: ближних
  rationale: Устойчивое библейское и современное слово, обозначающее других людей, о благе которых следует заботиться.
theological_decisions:
- issue: К кому относится местоимение в выражении «подражателями его»
  choice: Сохранена формулировка «его подражателями» без явного разрешения референции.
  alternative: Явно передать «подражателями Поликарпа» или «подражателями Господа».
  rationale: По предоставленному английскому свидетельству местоимение допускает связь как с Поликарпом, так и через его поведение с Господом; до прямой сверки с греческим текстом неоднозначность не следует устранять.
- issue: Спасение самого человека и всех братьев
  choice: «желать спасения не только себе, но и всем братьям»
  alternative: «стремиться спасти не только себя, но и всех братьев».
  rationale: Выбранный вариант не приписывает человеку роль непосредственного совершителя спасения и точно сохраняет акцент на желании любви.
- issue: Мученичество, согласное с Евангелием
  choice: Сохранено как нормативный евангельский образец.
  alternative: Передать как «мученичество ради Евангелия».
  rationale: Исходное свидетельство говорит о соответствии мученичества Евангелию, а не только о причине мученической смерти.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, церковно-исторически уместным регистром. Архаизмы устранены, но ключевые раннехристианские термины и евангельские переклички сохранены. Поскольку предоставлен лишь английский публично-доменный свидетель и указано, что сверка с греческим оригиналом ещё предстоит, формулировки остаются предварительными; спорные места не уточнялись сверх имеющихся данных.
