revisions:
- from: 'Братья, мы пишем вам о том, что произошло с принявшими мученическую смерть, и особенно — с блаженным Поликарпом, который положил конец гонению, словно запечатлев его своим мученичеством. Ведь почти всё предшествовавшее произошло для того, чтобы Господь вновь показал нам пример мученичества, согласного с Евангелием.


