base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: ru
  text: Блаженный Поликарп принял мученическую смерть во второй день первой половины месяца Ксантика, за семь дней до мартовских календ[a], в Великую субботу[b], в восьмом часу[c]. Он был схвачен Иродом, когда Филипп из Тралл был первосвященником, при проконсуле Статии Квадрате, но в царствование вечного Царя Иисуса Христа. Ему слава, честь, величие и вечный престол из поколения в поколение. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за семь дней до мартовских календ — первого дня марта; это соответствует 23 февраля при римском включительном счёте в невисокосный год. Передача древней даты остаётся предметом текстологического и календарного обсуждения.
    reason: Древняя римская система датировки непонятна большинству современных читателей, а её соотношение с другими элементами даты не следует молча гармонизировать.
  - marker: b
    text: 'Буквально: «в великую субботу». Смысл этого древнего обозначения здесь не уточняется и не согласовывается с позднейшим литургическим употреблением.'
    reason: Сохраняет подлинную неоднозначность выражения «great Sabbath».
  - marker: c
    text: Восьмой час по древнему счёту дневных часов — приблизительно два часа дня.
    reason: Поясняет древний способ обозначения времени без ложной современной точности.
lexical_decisions:
- source_word: martyred
  choice: принял мученическую смерть
  rationale: Естественная для современного русского языка формулировка, точно передающая смерть за веру и не использующая менее прозрачное «был умучен».
- source_word: Xanthicus
  choice: Ксантика
  rationale: Сохранено древнее название месяца в принятой транслитерации, без неподтверждённой календарной гармонизации.
- source_word: calends
  choice: календ
  rationale: Сохранён римский календарный термин; пояснение вынесено в сноску.
- source_word: great Sabbath
  choice: Великую субботу
  rationale: Буквально передаёт календарно-литургическое выражение, не устраняя возможную неоднозначность.
- source_word: high priest
  choice: первосвященником
  rationale: Сохранён титул свидетельства, вероятно относящийся к провинциальному культовому должностному лицу; исторический контекст пояснён в примечании.
- source_word: in the proconsulship
  choice: при проконсуле
  rationale: Естественная русская формула датировки по сроку власти должностного лица.
- source_word: from generation to generation
  choice: из поколения в поколение
  rationale: Прямая и понятная передача устойчивой доксологической формулы.
theological_decisions:
- issue: Противопоставление земной датировки и царствования Христа
  choice: «при проконсуле Статии Квадрате, но в царствование вечного Царя Иисуса Христа»
  alternative: «в проконсульство Статия Квадрата, а царствовал вечный Царь Иисус Христос»
  rationale: Сохранено риторическое и богословское противопоставление временной римской власти вечному царствованию Христа без дополнительного истолкования.
- issue: Отнесение заключительной доксологии
  choice: «Ему слава…»
  alternative: «Которому слава…»
  rationale: Местоимение сохраняет отнесение к ближайшему названному лицу — Иисусу Христу — и естественно звучит по-русски.
- issue: «Вечный престол» в доксологии
  choice: «вечный престол»
  alternative: «царство вечное»
  rationale: Сохранён конкретный образ престола из свидетельства; он не заменён богословски близким, но иным понятием царства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского памятника. Древние имена, титулы и календарные обозначения сохранены; неясности пояснены, но не устранены. Поскольку предоставлен английский публичнодоступный свидетель, а прямая сверка с греческим источником ещё ожидается, текст имеет статус предварительного источниково ориентированного проекта.
