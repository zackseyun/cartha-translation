  terminology: «Ксантика», «календы», «первосвященник», «проконсул», «вечный Царь» и «вечный престол» сохранены. Имя передано традиционной русской формой «Ирод»; «Филипп из Тралл» точно передаёт этникон/происхождение без излишней реконструкции. Календарные и временные пояснения уместны; формулировку примечания о великой субботе следует согласовать со строчной буквой в основном тексте.
