base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: ru
  text: Но некто по имени Квинт, фригиец, недавно прибывший из Фригии, увидев диких зверей, оробел. Именно он убедил себя и некоторых других добровольно выйти вперёд. После долгих уговоров проконсул склонил его принести клятву и воскурить благовоние. Поэтому, братья, мы не одобряем тех, кто сам отдаёт себя властям, потому что Евангелие не учит нас поступать так.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turned coward
  choice: оробел
  rationale: Передаёт внезапную утрату мужества перед зверями без излишне резкого нравственного ярлыка.
- source_word: come forward of their own free will
  choice: добровольно выйти вперёд
  rationale: Сохраняет идею добровольной явки, не добавляя в основную формулировку не выраженное явно обозначение властей.
- source_word: swear the oath
  choice: принести клятву
  rationale: Естественное русское выражение для требуемой властями клятвы; конкретное содержание клятвы в данном отрывке не уточняется.
- source_word: offer incense
  choice: воскурить благовоние
  rationale: Передаёт культовое действие, не конкретизируя адресата жертвоприношения сверх доступного свидетельства.
- source_word: deliver themselves up
  choice: сам отдаёт себя властям
  rationale: Ясно передаёт добровольную сдачу для преследования; слово «властям» служит необходимым контекстуальным дополнением в современном русском.
theological_decisions:
- issue: Оценка добровольного поиска мученичества
  choice: «мы не одобряем тех, кто сам отдаёт себя властям»
  alternative: «мы не хвалим тех, кто сам себя выдаёт»
  rationale: Формулировка сохраняет прямое предостережение текста, не превращая его в общее осуждение мученичества и не вводя конфессионального толкования.
- issue: Нормативная ссылка на Евангелие
  choice: «Евангелие не учит нас поступать так»
  alternative: «не так учит Евангелие»
  rationale: Современная и ясная конструкция сохраняет Евангелие как основание практического вывода.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского повествования. Перевод предварительный: представленное исходное свидетельство является английским переводом, а непосредственная сверка с греческой рукописной традицией ещё не выполнена. Имена и административный титул переданы в общепринятой форме; архаизмы намеренно исключены.'
