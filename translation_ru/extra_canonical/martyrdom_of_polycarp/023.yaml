  text: 'We bid you God speed, brethren, while you walk by the word of Jesus Christ which is according to the Gospel; with whom be glory to God for the salvation of his holy elect; even as the blessed Polycarp suffered martyrdom, in whose footsteps may it be our lot to be found in the kingdom of Jesus Christ.


    This account Gaius copied from the papers of Irenaeus, a disciple of Polycarp. The same also lived with Irenaeus.


    And I, Socrates, wrote it down in Corinth from the copy of Gaius. Grace be with all men.


    And I, Pionius, again wrote it down from the aforementioned copy, having searched it out (for the blessed Polycarp showed me in a revelation, as I will declare in the sequel), gathering it together when it was now well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Holy Spirit for ever and ever. Amen.


    The three preceding paragraphs as read in the Moscow manuscript: This account Gaius copied from the papers of Irenaeus. The same lived with Irenaeus, who had been a disciple of the holy Polycarp. For this Irenaeus, being in Rome at the time of the martyrdom of the bishop Polycarp, instructed many; and many most excellent and orthodox treatises by him are in circulation. In these he makes mention of Polycarp, saying that he was taught by him. And he ably refuted every heresy, and handed down the catholic rule of the Church just as he had received it from the saint. He mentions this fact also, that when Marcion, after whom the Marcionites are called, met the holy Polycarp on one occasion, and said, “Recognize us, Polycarp,” he said in reply to Marcion, “Yes indeed, I recognize the firstborn of Satan.” The following statement also is made in the writings of Irenaeus, that on the very day and hour when Polycarp was martyred in Smyrna, Irenaeus, being in the city of the Romans, heard a voice
    as of a trumpet saying, “Polycarp is martyred.”


    From these papers of Irenaeus then, as has been stated already, Gaius made a copy, and from the copy of Gaius Isocrates made another in Corinth.


    And I, Pionius, again wrote it down from the copy of Isocrates, having searched for it in obedience to a revelation of the holy Polycarp, gathering it together when it was well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Son and the Holy Spirit for ever and ever. Amen.'
translation:
  language: ru
  text: 'Желаем вам благоденствия в Боге, братья, пока вы живёте по слову Иисуса Христа, согласному с Евангелием. Через Него да будет слава Богу за спасение Его святых избранных. Так блаженный Поликарп претерпел мученичество; да удостоимся и мы, следуя по его стопам, оказаться в Царстве Иисуса Христа.


    Этот рассказ Гай переписал из записей Иринея, ученика Поликарпа. Он также жил вместе с Иринеем.


    А я, Сократ, переписал его в Коринфе с копии Гая. Благодать да будет со всеми.


    А я, Пионий, вновь переписал его с упомянутой копии, разыскав её (ибо блаженный Поликарп явился мне в откровении, о чём я расскажу далее). Я собрал воедино текст, уже почти истлевший от времени, чтобы Господь Иисус Христос собрал и меня вместе со Своими избранными в Своём Небесном Царстве. Ему слава с Отцом и Святым Духом во веки веков. Аминь.


    Три предыдущих абзаца по чтению Московской рукописи:[a]


    Этот рассказ Гай переписал из записей Иринея. Он жил вместе с Иринеем, который был учеником святого Поликарпа. Этот Ириней во время мученичества епископа Поликарпа находился в Риме и наставлял многих; широко известны многие его превосходные и православные сочинения. В них он упоминает Поликарпа и говорит, что тот был его учителем. Он искусно опровергал всякую ересь и передал вселенское правило Церкви[b] таким, каким принял его от святого. Он сообщает и о том, как однажды Маркион, от имени которого получили название маркиониты, встретил святого Поликарпа и сказал: «Узнай нас, Поликарп». Тот ответил Маркиону: «Да, узнаю первенца сатаны». В сочинениях Иринея говорится также, что в тот самый день и час, когда Поликарп претерпел мученичество в Смирне, Ириней, находившийся в городе римлян, услышал голос, подобный звуку трубы: «Поликарп претерпел мученичество».


    Итак, как уже было сказано, Гай сделал копию с этих записей Иринея, а Исократ в Коринфе сделал другую копию с копии Гая.[c]


    А я, Пионий, вновь переписал его с копии Исократа, разыскав её, повинуясь откровению святого Поликарпа. Я собрал воедино текст, уже почти истлевший от времени, чтобы Господь Иисус Христос собрал и меня вместе со Своими избранными в Своём Небесном Царстве. Ему слава с Отцом, и Сыном, и Святым Духом во веки веков. Аминь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Далее приводится иной, расширенный вариант заключительных абзацев, засвидетельствованный Московской рукописью.
    reason: Разъясняет, что повторение представляет собой вариант рукописной традиции, а не продолжение повествования.
  - marker: b
    text: То есть всеобщее, общецерковное правило веры; слово «вселенское» здесь не обозначает позднейшую конфессиональную принадлежность.
    reason: Предотвращает анахроническое понимание слова catholic.
  - marker: c
    text: В первой форме текста переписчиком назван Сократ, а в Московской рукописи — Исократ.
    reason: Сохраняет и отмечает различие имён между двумя формами заключения.
lexical_decisions:
- source_word: God speed
  choice: Желаем вам благоденствия в Боге
  rationale: Передаёт благопожелание без архаичного русского оборота и сохраняет явную отнесённость к Богу.
- source_word: walk by the word
  choice: живёте по слову
  rationale: Библейскую метафору хождения передаёт естественным современным русским выражением о согласовании жизни со словом.
- source_word: catholic rule of the Church
  choice: вселенское правило Церкви
  rationale: «Вселенское» передаёт исходный смысл всеобщности и не вводит позднейшую конфессиональную маркировку слова «католический».
- source_word: papers
  choice: записи
  rationale: Нейтрально обозначает письменный источник, не предполагая современного вида документов.
- source_word: gathering it together
  choice: собрал воедино текст
  rationale: Сохраняет образ собирания повреждённого материала, уточняя подразумеваемый объект для ясности.
- source_word: city of the Romans
  choice: городе римлян
  rationale: Сохраняет необычную форму свидетельства, а не упрощает её до обычного «в Риме».
- source_word: is martyred
  choice: претерпел мученичество
  rationale: Передаёт событие мученической смерти dignified русским церковно-историческим языком без двусмысленного современного «замучен».
theological_decisions:
- issue: Отнесение выражения «с Ним/через Него» в начальном славословии
  choice: «Через Него да будет слава Богу»
  alternative: «с Ним да будет слава Богу»
  rationale: Английское свидетельство синтаксически неоднозначно. Выбрано естественное русское чтение с посредническим «через Него», но без расширения догматической формулы.
- issue: Передача catholic
  choice: «вселенское»
  alternative: «католическое» или «всеобщее»
  rationale: Сохраняет древний смысл общецерковной всеобщности и избегает анахронической деноминационной конкретизации.
- issue: Различие славословий в двух формах текста
  choice: Сохранено отсутствие слова «Сыном» в первой форме и его присутствие в Московском чтении
  alternative: Гармонизировать обе формулы
  rationale: Рукописное различие богословски значимо и не должно молча устраняться.
- issue: Избранные и собирание в Царство
  choice: Сохранены формулировки «избранные» и «собрал... в Царстве»
  alternative: Смягчить до «верующие» и «принял»
  rationale: Сохраняется исходная богословская лексика и образная связь двух употреблений глагола «собирать».
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского церковно-исторического текста. Архаизмы ограничены устойчивыми формулами («во веки веков», «Аминь»). Проект носит предварительный характер: предоставленное основание является английским публичнодоступным свидетельством, а прямое сопоставление с греческим источником ещё не выполнено.'
