base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: ru
  text: 'Но благодарение Богу: Он действительно одержал победу над всеми. Благороднейший Германик своей стойкостью ещё сильнее обнаружил их трусость и вступил в поразительную схватку с дикими зверями. Когда проконсул пытался его переубедить и велел ему пожалеть свою молодость, Германик силой притянул к себе дикого зверя, желая поскорее освободиться от их неправедной и беззаконной жизни.


    После этого вся толпа, поражённая мужеством боголюбивого и богобоязненного рода христиан, закричала: «Долой безбожников! Разыскать Поликарпа!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατίσχυσεν (reflected in the witness as “prevailed against”)
  choice: одолел
  rationale: Передаёт действенную победу, не уточняя способ и не снимая неоднозначность подразумеваемого субъекта.
- source_word: ὑπομονή (reflected as “constancy”)
  choice: стойкость
  rationale: Естественно и точно выражает твёрдое терпение перед страданием.
- source_word: ἐθηριομάχησεν (reflected as “fought with the wild beasts”)
  choice: вступил в … схватку с дикими зверями
  rationale: Сохраняет конкретный образ боя со зверями и звучит естественно по-русски.
- source_word: γένος τῶν Χριστιανῶν (reflected as “people of the Christians”)
  choice: род христиан
  rationale: Сохраняет коллективное обозначение христиан как рода или сообщества, не подменяя его конфессиональным термином.
- source_word: ἄθεοι (reflected as “atheists”)
  choice: безбожники
  rationale: Передаёт древнее обвинение в отрицании признанных богов; исторический смысл пояснён в сноске.
- source_word: ζητείσθω (reflected as “let search be made”)
  choice: разыскать
  rationale: Краткая повелительная формула естественно передаёт крик толпы и требование начать поиски.
theological_decisions:
- issue: Подразумеваемый субъект фразы «одолел всех»
  choice: Местоимение «он» оставлено со строчной буквы, а неоднозначность отмечена в сноске.
  alternative: «Бог действительно одолел всех» или «Германик действительно одолел всех».
  rationale: Греческая форма допускает подразумеваемый субъект, а доступное английское свидетельство связывает его с Богом посредством прописной буквы. Явное добавление имени сняло бы возможное напряжение текста.
- issue: Смысл обвинения «безбожники»
  choice: Сохранено прямое обвинение толпы без богословского исправления.
  alternative: 'Передать описательно: «те, кто отвергает наших богов».'
  rationale: 'Важно сохранить историческую иронию: языческая толпа называет безбожниками именно христиан.'
- issue: «их неправедная и беззаконная жизнь»
  choice: Сохранено местоимение «их» без уточнения референта.
  alternative: «эта неправедная и беззаконная жизнь» или «жизнь беззаконников».
  rationale: Референт местоимения не вполне прозрачен; уточнение могло бы искусственно разрешить подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис сделан ясным для обычного читателя; возглас толпы передан краткими повелительными формулами. Проект сверен с доступными данными греческой традиции, однако в предоставленном пакете прямой критический обзор греческого текста обозначен как ожидающий завершения.
