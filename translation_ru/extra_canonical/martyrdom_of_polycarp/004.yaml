revisions:
- from: 'Но благодарение Богу: он действительно одолел всех.[a] Благороднейший Германик своей стойкостью укрепил тех, кто боялся, и вступил в поразительную схватку с дикими зверями. Когда проконсул пытался его переубедить и велел ему пожалеть свою молодость, Германик силой потянул дикого зверя к себе, желая поскорее освободиться от их неправедной и беззаконной жизни.


    После этого вся толпа, поражённая мужеством боголюбивого и богобоязненного рода христиан, закричала: «Долой безбожников![b] Разыскать Поликарпа!»'
  to: 'Но благодарение Богу: Он действительно одержал победу над всеми. Благороднейший Германик своей стойкостью ещё сильнее обнаружил их трусость и вступил в поразительную схватку с дикими зверями. Когда проконсул пытался его переубедить и велел ему пожалеть свою молодость, Германик силой притянул к себе дикого зверя, желая поскорее освободиться от их неправедной и беззаконной жизни.


    После этого вся толпа, поражённая мужеством боголюбивого и богобоязненного рода христиан, закричала: «Долой безбожников! Разыскать Поликарпа!»'
  rationale: Убрана сноска, создававшая необоснованную неоднозначность в отнесении «Он». Исправлен перевод фразы о трусости, чтобы объектом оставалась именно «трусость», как в исходной конструкции. Формулировка о звере немного уточнена стилистически без изменения описываемого действия. Сноска к «безбожникам» сохранена; остальные неоднозначности, в частности референт «их» в «их неправедной и беззаконной жизни», не разрешаются искусственно.
