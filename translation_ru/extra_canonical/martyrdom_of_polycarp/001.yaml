base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: ru
  text: 'Церковь Божья, пребывающая как пришелица в Смирне, — Церкви Божьей, пребывающей как пришелица в Филомелии, и всем общинам святой и вселенской Церкви, пребывающим как пришельцы во всяком месте: да умножатся у вас милость, мир и любовь от Бога Отца и Господа нашего Иисуса Христа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παροικοῦσα / sojourneth
  choice: странствующая
  rationale: Передаёт временное пребывание не на своей родине и сохраняет раннехристианский образ Церкви как странницы, не сводя его просто к проживанию.
- source_word: ἀδελφότητες / brotherhoods
  choice: братские общины
  rationale: Естественно для современного русского языка и обозначает общины верующих, не ограничивая смысл только мужчинами.
- source_word: καθολικῆς / universal
  choice: вселенской
  rationale: В данном раннехристианском контексте означает всеобщую, повсеместную Церковь; написание со строчной буквы у прилагательного не превращает выражение в позднейшее конфессиональное наименование.
- source_word: πληθυνθείη / be multiplied
  choice: да умножатся
  rationale: Сохраняет форму благопожелания и образ умножения милости, мира и любви.
theological_decisions:
- issue: Смысл пребывания Церкви в мире
  choice: странствующая
  alternative: живущая как пришелица / временно пребывающая
  rationale: Выбрана краткая и dignified формулировка, сохраняющая богословский оттенок чужеземного, временного пребывания, хотя греческая сверка ещё предстоит.
- issue: Значение «universal church»
  choice: вселенская Церковь
  alternative: всеобщая Церковь
  rationale: «Вселенская» является укоренённым русским церковно-историческим эквивалентом и здесь передаёт универсальность Церкви без внесения поздней конфессиональной специфики.
- issue: Источник милости, мира и любви
  choice: от Бога Отца и Господа нашего Иисуса Христа
  alternative: от Бога Отца и от Господа нашего Иисуса Христа
  rationale: Сохранена синтаксическая компактность свидетельства и возможная смысловая связанность единого источника благословения; дополнительный предлог не добавлен.
translation_notes:
  register: 'Современный литературный русский с умеренно высоким, эпистолярным регистром. Перевод предварительный: предоставлен англоязычный свидетельский текст, а непосредственная сверка с греческой рукописной традицией ожидается. Маркеры сносок не использованы, поскольку сносок нет.'
