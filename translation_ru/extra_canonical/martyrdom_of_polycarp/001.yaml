revisions:
- from: Церковь Божья, странствующая в Смирне, — церкви Божьей, странствующей в Филомелии, и всем братским общинам святой и вселенской Церкви, странствующей повсюду. Да умножатся у вас милость, мир и любовь от Бога Отца и Господа нашего Иисуса Христа.
  to: 'Церковь Божья, пребывающая как пришелица в Смирне, — Церкви Божьей, пребывающей как пришелица в Филомелии, и всем общинам святой и вселенской Церкви, пребывающим как пришельцы во всяком месте: да умножатся у вас милость, мир и любовь от Бога Отца и Господа нашего Иисуса Христа.'
  rationale: 'Исправлено обозначение адресатов согласно греческому παροικίαις и восстановлен общий образ пребывания «как пришельцы» во всех трёх частях надписания. Сохранены эпистолярное благопожелание, традиционные имена и неконфессиональная передача καθολική как «вселенская». Сноски не нужны: текстовое решение прозрачно и не требует отдельного якоря.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:53:32Z'
review_pass:
  verdict: revise
  source_fidelity: Греческая формула надписания, насколько её позволяет проверить известная рукописная традиция, содержит παροικοῦσα/παροικούσῃ и далее παροικίαις, то есть «пребывающая как пришелица / общины-пришельцы», а не ἀδελφότητες («братства»). Английский свидетель передаёт последнее слово как «brotherhoods», но русское «братские общины» добавляет не подтверждённый исходным текстом элемент. Повтор образа παροικία в заключительной группе следует сохранить.
  naturalness: «Странствующая в Смирне» возможно, но в современном русском легко воспринимается как непрерывное путешествие. «Пребывающая как пришелица» точнее передаёт временное, чужеземное пребывание и остаётся понятным в высоком эпистолярном регистре. Для множественного числа естественно «общинам ..., пребывающим как пришельцы».
  terminology: «Церковь Божья», «Смирна», «Филомелий», «святая и вселенская Церковь», «Бог Отец» и «Господь наш Иисус Христос» приемлемы. «Вселенская» корректно передаёт καθολική в данном раннехристианском, до-конфессиональном употреблении. Заглавная буква в «Церкви» указывает на единую вселенскую Церковь и не требует конфессионального прочтения.
  issues:
  - severity: high
    issue: «братским общинам» не соответствует исходной греческой лексике
    rationale: В известной греческой форме надписания стоит παροικίαις («общинам/приходам, пребывающим как пришельцы»), а не ἀδελφότητες. Английское «brotherhoods» является особенностью свидетельского перевода, а не основанием для русского лексического решения.
  - severity: medium
    issue: Не сохранён повтор παροικ- в обозначении общин повсюду
    rationale: Проект передаёт «странствующая» в первых двух случаях, но заменяет родственное παροικίαις выражением «братские общины». Повтор следует передать в самом тексте.
  - severity: low
    issue: «странствующая» может смещать смысл к путешествию
    rationale: παροικέω прежде всего обозначает проживание в качестве чужеземца или временного жителя; предложенная формулировка точнее и естественнее для современного читателя.
  revised_text: 'Церковь Божья, пребывающая как пришелица в Смирне, — Церкви Божьей, пребывающей как пришелица в Филомелии, и всем общинам святой и вселенской Церкви, пребывающим как пришельцы во всяком месте: да умножатся у вас милость, мир и любовь от Бога Отца и Господа нашего Иисуса Христа.'
