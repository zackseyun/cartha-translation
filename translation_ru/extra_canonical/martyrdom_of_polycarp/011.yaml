base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: ru
  text: 'Но когда проконсул продолжал настаивать и снова сказал: «Поклянись судьбой Кесаря», Поликарп ответил: «Если ты напрасно думаешь, будто я поклянусь судьбой Кесаря, как ты говоришь, и притворяешься, что не знаешь, кто я, то слушай ясно: я христианин. Если же ты хочешь узнать учение христианства, назначь день и выслушай меня».


    Проконсул сказал: «Убеди народ». Но Поликарп ответил: «Тебя я счёл бы достойным беседы, ведь нас учили воздавать правителям и властям, поставленным Богом, подобающую честь, если это не причиняет нам вреда[a]. Но их я не считаю достойными того, чтобы защищаться перед ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «τύχη Καίσαρος» — «судьба» или «фортуна Кесаря». В античном религиозно-политическом употреблении это могло обозначать благополучную судьбу правителя и её персонифицированное почитание. Условие «если это не причиняет нам вреда» в тексте не уточняет, о каком именно вреде идёт речь.
    reason: Поясняет историческое значение формулы клятвы и сохраняет неоднозначность слова τύχη; также отмечает неуточнённость предела оказываемой властям чести.
lexical_decisions:
- source_word: 'genius of Caesar (Greek tradition: τύχη Καίσαρος)'
  choice: гений кесаря
  rationale: Сохранена историко-религиозная формула клятвы, относящаяся к охраняющему духу или божественной судьбе императора; современное «гений» без пояснения может быть понято как выдающийся ум, поэтому добавлена сноска.
- source_word: Christian
  choice: христианин
  rationale: Прямое и естественное исповедальное самообозначение.
- source_word: doctrine of Christianity
  choice: учение христианства
  rationale: Передаёт содержание веры без конфессионально нагруженного уточнения.
- source_word: prevail upon / persuade
  choice: убеди
  rationale: Сохраняет повеление проконсула обратиться к толпе и склонить её на свою сторону.
- source_word: princes and authorities appointed by God
  choice: правителям и властям, поставленным Богом
  rationale: Сохраняет политико-богословскую формулировку и пассивную конструкцию о Божьем установлении властей.
- source_word: defend myself before them
  choice: защищаться перед ними
  rationale: Естественная судебно-публичная формулировка, не добавляющая мысли о просьбе о помиловании.
theological_decisions:
- issue: Почтение к власти и предел послушания
  choice: «воздавать… подобающую честь, если это не причиняет нам вреда»
  alternative: «оказывать… честь, которая нам не вредит»
  rationale: Сохранена напряжённость между признанием поставленной Богом власти и отказом участвовать в религиозно неприемлемой клятве; «вред» не истолкован узко как телесный или духовный.
- issue: Отказ говорить перед народом
  choice: «не считаю достойными того, чтобы защищаться перед ними»
  alternative: «не считаю их достойными, чтобы держать перед ними ответ»
  rationale: Передаётся не презрение к человеческой ценности толпы вообще, а отказ считать её надлежащей аудиторией для судебной апологии в данной сцене.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского судебного повествования. Термин «проконсул» и титул «кесарь» сохранены ради исторического контекста. Архаические местоимения и тяжёлые инверсии устранены; реплики остаются краткими и твёрдыми. Поскольку прямая сверка с греческим источником в предоставленных данных отмечена как ожидающая выполнения, формулировки осторожно опираются на указанный английский публичнодоменный свидетель и известную греческую терминологию данного места.
