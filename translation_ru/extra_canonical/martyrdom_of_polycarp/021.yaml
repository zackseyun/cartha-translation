  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: ru
  text: 'Вы просили подробнее рассказать вам о том, что произошло. Но пока мы кратко известили вас об этом через нашего брата Маркиана. Узнав обо всём этом, перешлите это послание и братьям и сёстрам, живущим дальше, чтобы и они прославили Господа, избирающего из числа Своих слуг.


    А Тому, Кто по Своей благодати и щедрости силен привести всех нас в Своё вечное Царство через Своего единородного Сына Иисуса Христа, — слава, честь, сила и величие вовеки. Приветствуйте всех святых. Вас приветствуют те, кто находится с нами, а также Еварест, записавший это послание, и весь его дом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: certified you / informed you
  choice: известили вас
  rationale: Передаёт смысл сообщения достоверных сведений без неестественного канцелярского оттенка слова «удостоверили».
- source_word: send the letter about likewise
  choice: перешлите это послание
  rationale: Естественно выражает просьбу обеспечить дальнейшее распространение письма среди удалённых общин.
- source_word: brethren
  choice: братьям и сёстрам
  rationale: В данном общинном обращении слово обозначает всех верующих; инклюзивная формулировка делает подразумеваемый охват явным.
- source_word: maketh election from His own servants
  choice: избирающего из числа Своих слуг
  rationale: Сохраняет действие избрания и несколько необычную конструкцию «из числа Своих слуг», не уточняя её богословский смысл.
- source_word: bounty
  choice: щедрости
  rationale: Передаёт благотворную щедрость наряду с благодатью, не сливая два понятия.
- source_word: only-begotten Son
  choice: единородного Сына
  rationale: Традиционный и точный христианский термин, сохраняющий богословскую насыщенность выражения.
- source_word: saints
  choice: святых
  rationale: Сохранён раннехристианский общинный термин без замены на толковательное «верующих».
- source_word: house
  choice: дом
  rationale: 'Сохраняет возможную широту значения: семья, домочадцы или домашнее сообщество.'
theological_decisions:
- issue: Смысл избрания Господом «из Своих слуг»
  choice: избирающего из числа Своих слуг
  alternative: избирающего Своих слуг
  rationale: Выбранная формулировка сохраняет засвидетельствованное отношение «из числа» и не превращает его в общее утверждение о призвании всех слуг.
- issue: Способ вхождения в вечное Царство
  choice: по Своей благодати и щедрости силен привести всех нас
  alternative: может по благодати и милости ввести всех нас
  rationale: Сохранены как Божья способность, так и два основания — благодать и щедрость, — без добавления учения о механизме спасения.
- issue: Посредничество Сына
  choice: через Своего единородного Сына Иисуса Христа
  alternative: посредством Своего единственного Сына
  rationale: «Через» сохраняет открытую смысловую связь, а «единородный» не ослабляет традиционную христологическую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис упрощён там, где буквальное воспроизведение английского свидетеля звучало бы архаично, но доксология и ключевая богословская лексика сохранены. Поскольку прямая сверка с греческой рукописной традицией ещё не проведена, текст следует считать предварительным, основанным на предоставленном публичном английском свидетельстве и проверочном слое POB.
