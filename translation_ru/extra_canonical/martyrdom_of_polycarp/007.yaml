lexical_decisions:
- source_word: farm
  choice: поместье
  rationale: В данном повествовательном контексте речь идёт о загородном владении или усадьбе, а не о современной ферме.
- source_word: slave lads
  choice: юных рабов
  rationale: Сохраняет исторически существенный статус лиц и указание на их молодой возраст; «слуги» могло бы сгладить социально-правовой смысл.
- source_word: captain of the police
  choice: начальник стражи
  rationale: Естественная для древнего контекста передача должностного лица, руководившего вооружённым розыском; современное «начальник полиции» звучало бы анахронично.
- source_word: appointed lot
  choice: предназначенный ему жребий
  rationale: Сохраняет образ жребия, назначенной доли или участи, не сводя выражение только к судьбе либо к Божьему предопределению.
- source_word: partaker with Christ
  choice: соучастником Христа
  rationale: Передаёт идею участия вместе со Христом в страдании и верности, сохраняя богословскую насыщенность выражения.
theological_decisions:
- issue: Смысл участия Поликарпа со Христом
  choice: став соучастником Христа
  alternative: разделив участь Христа
  rationale: Выбрана более формальная передача, которая не ограничивает участие одним лишь сходством смертной участи и сохраняет богословскую широту выражения.
- issue: «Наказание самого Иуды»
  choice: понесли наказание самого Иуды
  alternative: подверглись участи Иуды
  rationale: Сохранён явный судебно-нравственный смысл свидетельства, не уточняя вид или время наказания сверх доступных данных.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис умеренно упрощён для ясности; исторические реалии не модернизированы. Повтор «тех, кто разыскивал» сокращён до «преследователи», а местоименные неоднозначности устранены именем Поликарпа там, где это необходимо для русского читателя.
