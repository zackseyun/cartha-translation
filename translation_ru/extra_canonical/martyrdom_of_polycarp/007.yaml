base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young servants, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: ru
  text: 'Те, кто разыскивал его, не прекращали поисков, поэтому он ушёл в другое поместье. Но преследователи тотчас явились и туда. Не найдя его, они схватили двух юных рабов, и один из них под пыткой выдал его.


    И действительно, Поликарпу невозможно было укрыться, поскольку предали его люди из его же дома. Начальник стражи, по случайному совпадению носивший имя Ирод, спешил доставить его на стадион, чтобы Поликарп исполнил предназначенный ему жребий, став соучастником Христа, а его предатели понесли наказание самого Иуды.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному древнему свидетельству в английском переводе; прямая сверка с греческим текстом ещё требуется.'
