review_pass:
  verdict: revise
  source_fidelity: Требуется несколько существенных уточнений по греческой традиции. «Один из них под пыткой выдал его» чрезмерно конкретизирует ὡμολόγησεν («признался», вероятно в ходе допроса), тогда как сам объект признания не назван. «Предназначенный ему жребий» добавляет оттенок предопределённости; τὸν ἴδιον κλῆρον — «свой жребий/свою долю». Заключительная формула говорит о том, что предатели претерпят то же наказание, что и Иуда, а не просто «наказание самого Иуды».
  naturalness: 'Текст в целом литературен, но «И действительно» не передаёт обычной причинно-пояснительной функции γάρ столь точно, как «Ведь». «Став соучастником Христа» двусмысленно: в современном русском «соучастник» часто предполагает совместное действие, в том числе преступное. «Став причастником Христу» — устойчивая возвышенная, но понятная передача церковно-литературного регистра.'
  terminology: «Усадьба» удачно передаёт ἄγρος в данном контексте. «Юные рабы» сохраняет социальный статус и возрастное указание παιδάρια. Для εἰρήναρχος предпочтительно сохранить исторический титул «иринарх» с пояснением в тексте, поскольку «начальник стражи» неточно сужает административно-полицейскую должность. Имя «Ирод» сохранено.
  issues:
  - severity: medium
    issue: Конкретизация содержания признания
    rationale: «Выдал его» утверждает, что раб сообщил местонахождение Поликарпа; греческое «признался» этого прямо не уточняет.
  - severity: medium
    issue: Передача «своего жребия»
    rationale: Слово «предназначенный» интерпретирует κλῆρος как заранее предопределённую участь; исходник сохраняет более широкое «свой жребий/доля».
  - severity: medium
    issue: Наказание предателей
    rationale: Исходная формула сопоставляет их наказание с наказанием Иуды («то же наказание»); русский черновик допускает иной смысл — наказание, принадлежащее Иуде.
  - severity: low
    issue: «Соучастник Христа»
    rationale: Выражение стилистически и семантически небезупречно в современном русском; «причастник Христу» точнее для κοινωνός τοῦ Χριστοῦ и избегает неблагоприятной современной коннотации.
  - severity: low
    issue: Должность εἰρήναρχος
    rationale: «Начальник стражи» возможно, но сужает значение титула; «иринарх» с кратким пояснением точнее отражает историческую реалию.
  revised_text: 'Те, кто разыскивал его, не прекращали поисков, и он перебрался в другую усадьбу. Но тотчас туда пришли разыскивавшие его; не найдя его, они схватили двух юных рабов, и один из них под пыткой признался.


    Ведь Поликарп не мог оставаться в укрытии, поскольку те, кто предал его, были из числа его домашних. Иринарх — начальник местной стражи, носивший имя Ирод, — спешил привести его на стадион, чтобы он исполнил свой жребий, став причастником Христу, тогда как его предатели претерпели бы то же наказание, что и сам Иуда.[a]'
