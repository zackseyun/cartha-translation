    Услышав, что они пришли, он спустился и беседовал с ними. Присутствовавшие дивились его возрасту и стойкости и недоумевали, почему с таким рвением стремятся схватить подобного ему старца. Тогда он тотчас велел накрыть для них стол, чтобы они ели и пили в этот час сколько пожелают. Затем он убедил их дать ему час, чтобы беспрепятственно помолиться.


