base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: ru
  text: 'Итак, взяв с собой юношу, в пятницу[a], около времени ужина, стражники и всадники выступили с обычным для них оружием, спеша так, словно шли на разбойника. Поздно вечером они прибыли все вместе и застали самого Поликарпа в постели, в верхней комнате одного небольшого дома. Хотя он мог уйти оттуда в другое место, он не захотел, сказав: «Да исполнится воля Божья».


    Услышав, что они пришли, он спустился и беседовал с ними. Присутствовавшие дивились его возрасту и стойкости и недоумевали, почему с таким рвением стремятся схватить подобного ему старца. Тогда он тотчас велел накрыть для них стол, чтобы они ели и пили в этот час сколько пожелают. Затем он убедил их дать ему час, чтобы беспрепятственно помолиться.


    Когда они согласились, он встал и молился, будучи так исполнен Божьей благодати, что два часа не мог умолкнуть. Слушавшие изумлялись, и многие раскаивались, что пришли против такого почтенного старца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте употреблено название дня «Приготовление» (Παρασκευή), обычное обозначение пятницы — дня приготовления к субботе.
    reason: Поясняет исходное греческое название дня и обосновывает понятный современный перевод «в пятницу».
lexical_decisions:
- source_word: τῇ παρασκευῇ / “on the Friday”
  choice: «в пятницу»
  rationale: В раннехристианской и иудейской речи Παρασκευή буквально означает день приготовления, то есть пятницу. Основной текст передаёт понятное современному читателю значение; буквальная форма сохранена в примечании.
- source_word: οἱ εἰρηνάρχαι / “the gendarmes”
  choice: «начальники стражи»
  rationale: Термин обозначает должностных лиц, отвечавших за общественный порядок. «Жандармы» создаёт неуместную ассоциацию с гораздо более поздним учреждением; «начальники стражи» естественно передаёт административно-полицейскую функцию без ложной точности.
- source_word: τὸν παῖδα / “the lad”
  choice: «юношу»
  rationale: παῖς допускает значения от мальчика или юноши до слуги. По контексту это молодой человек, выдавший местонахождение Поликарпа; «юноша» сохраняет возрастной смысл, не добавляя идеи служебного положения.
- source_word: τὸ εὐσταθές / “constancy”
  choice: «невозмутимую стойкость»
  rationale: Слово выражает устойчивость, самообладание и твёрдость. Сочетание передаёт оба оттенка и звучит естественно по-русски.
- source_word: ἐν ὑπερῴῳ / “in an upper chamber”
  choice: «в верхней комнате»
  rationale: Речь идёт о помещении на верхнем этаже. «Горница» стилистически архаична и в современном русском может вызвать несвойственные тексту ассоциации.
- source_word: πρεσβύτην / “old man”
  choice: «старца»
  rationale: В контексте подчёркнуты преклонный возраст и достоинство Поликарпа. «Старец» здесь употреблено в обычном уважительном значении, а не как специальный церковный титул.
theological_decisions:
- issue: Высказывание «Да исполнится воля Божья»
  choice: Сохранено как краткое прямое высказывание без пояснения, относится ли оно к аресту, мученичеству или Божьему замыслу в целом.
  alternative: «Пусть будет то, чего хочет Бог» или поясняющий перевод о принятии мученичества.
  rationale: Исходная формула намеренно ёмкая и перекликается с библейской молитвенной речью. Конкретизация сузила бы её смысл и сняла бы богословскую напряжённость.
- issue: «Исполнен Божьей благодати»
  choice: Сохранена причинно-описательная связь между благодатью Божьей и продолжительной молитвой.
  alternative: Психологизирующее «был так воодушевлён» или усиленное утверждение об особом сверхъестественном состоянии.
  rationale: Текст прямо говорит о благодати Бога; её нельзя ни устранять, ни разворачивать в доктрину, которой сам рассказ не формулирует.
- issue: Раскаяние пришедших за Поликарпом
  choice: Передано как «сожалели о том, что пришли схватить».
  alternative: «Покаялись» в полном религиозно-сотериологическом смысле.
  rationale: Контекст сообщает перемену отношения и сожаление из-за участия в аресте, но не утверждает их обращение к вере. Выбранная формулировка не преувеличивает богословский смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис умеренно торжественный, но без церковнославянизмов и избыточной архаики. Имя Поликарпа дважды восстановлено вместо местоименных обозначений ради ясности по-русски. Поскольку в предоставленных данных прямое сопоставление с греческой рукописной традицией отмечено как предстоящее, спорные административные и культурные термины переведены осторожно и снабжены примечаниями.
