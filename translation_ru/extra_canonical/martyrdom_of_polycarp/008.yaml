  source_fidelity: Нужна правка. В черновике «начальники стражи» неоправданно сужает обозначение участников задержания и вводит начальственный статус, которого свидетель не требует. «Невозмутимая стойкость» добавляет оттенок невозмутимости; достаточно «стойкость». Оборот «несмотря на поздний час» является добавочным авторским пояснением, тогда как текст говорит, что им было велено есть и пить «в этот час». В остальном последовательность событий, добровольный отказ Поликарпа бежать, час беспрепятственной молитвы, благодать Божья и последующее раскаяние переданы верно. Упоминание пятницы с примечанием о Παρασκευή допустимо.
  naturalness: Текст в целом литературный и ясный. «Стражники и всадники» естественнее и точнее, чем «начальники стражи и всадники». «Застали Поликарпа в постели» идиоматичнее, чем «нашли ... лежащим». «Почтенный старец» сохраняет уважительный тон без избыточной архаизации.
  terminology: 'Имя Поликарп, «воля Божья» и «Божья благодать» переданы удачно. Примечание о пятнице уместно, но формулировка должна не утверждать буквальность английского свидетельства, а пояснять греческое название дня. Примечание о «начальниках стражи» следует удалить вместе с его маркером: оно закрепляет неточное толкование административного термина.'
