revisions:
- from: 'Итак, они взяли юношу с собой и в пятницу[a], около времени ужина, начальники стражи[b] и всадники выступили с обычным своим оружием, спеша так, словно шли на разбойника. Поздно вечером они все вместе прибыли на место и нашли Поликарпа лежащим в верхней комнате небольшого дома. Он мог уйти оттуда в другое место, но не захотел и сказал: «Да исполнится воля Божья».


    Услышав, что они пришли, он спустился и заговорил с ними. Присутствовавшие дивились его преклонному возрасту и невозмутимой стойкости и недоумевали, зачем понадобилось с таким рвением схватывать подобного старца. Поликарп тотчас распорядился накрыть для них стол и предложил им есть и пить сколько угодно, несмотря на поздний час. Затем он убедил их дать ему один час, чтобы беспрепятственно помолиться.


    Получив согласие, он встал и начал молиться. Он был настолько исполнен Божьей благодати, что два часа не умолкал. Слушавшие его изумлялись, и многие сожалели о том, что пришли схватить столь почтенного старца.'
