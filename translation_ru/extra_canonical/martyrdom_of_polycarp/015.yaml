review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно сохраняет ход повествования, жертвенный образ и молитвенную лексику английского свидетельства. Однако «вместе с мучениками приобщился» сглаживает конкретные элементы «получить удел / среди числа мучеников», а «ради воскресения» неудачно переопределяет связь с «чашей Христа». Оборот «как Ты ... приготовил и явил, так и исполнил» создаёт русскую корреляцию, которой в свидетельстве нет. Прямая сверка с греческой рукописной традицией по-прежнему необходима, в особенности для скобочных чтений и синтаксиса фразы о чаше.
  naturalness: Торжественный современный русский регистр выдержан. В исправленном тексте устранены несколько мест, где естественность достигалась ценой излишней интерпретации; формула «удел среди числа мучеников» намеренно близка к культово-мученическому синтаксису свидетельства, но остаётся понятной.
  terminology: «Вседержитель», «всесожжение», «силы», «нетление» и «Первосвященник» уместны и согласованы с высоким молитвенным регистром. «Столб» не конкретизирует устройство казни сверх свидетельства. Квадратные скобки и сноски сохранены.
  issues:
  - severity: medium
    issue: Ослаблено «receive a portion amongst the number of martyrs».
    rationale: Фраза «вместе с мучениками приобщился» передаёт участие, но не сохраняет явно ни «удел», ни «число мучеников».
  - severity: medium
    issue: «Ради воскресения к вечной жизни» чрезмерно истолковывает синтаксис фразы о чаше.
    rationale: «Ради» может связать воскресение с целью или основанием чаши Христа. Более близкое «к воскресению вечной жизни» сохраняет направленность и не разрешает спорную связь.
  - severity: medium
    issue: Введена коррелятивная конструкция «как ..., так и ...».
    rationale: 'Свидетель перечисляет Божьи действия: «приготовил, явил заранее и исполнил»; русское «как ... так» меняет их синтаксическое соотношение.'
  revised_text: 'Итак, они не пригвоздили его, а привязали. Заведя руки за спину и будучи привязан к столбу, он, словно отборный баран из большого стада для приношения, — всесожжение, приготовленное и угодное Богу, — взглянув на небо, сказал:


    «Господи Боже Вседержитель, Отец Твоего возлюбленного и благословенного Сына Иисуса Христа, через Которого мы познали Тебя, Бога ангелов, сил и всего творения, а также всего рода праведных, живущих пред Тобой! Благословляю Тебя за то, что Ты удостоил меня этого дня и часа, чтобы мне получить удел среди числа мучеников, в чаше [Твоего][a] Христа, к воскресению вечной жизни — и души, и тела — в нетлении Святого Духа. Да буду я сегодня принят пред Тобой среди них как жертва обильная и угодная, согласно тому, что Ты заранее приготовил, явил и исполнил, — Ты, верный и истинный Бог. Поэтому и за всё я восхваляю Тебя, благословляю Тебя и прославляю Тебя через вечного и небесного Первосвященника Иисуса Христа, Твоего возлюбленного Сына, через Которого Тебе вместе с Ним и Святым Духом да будет слава ныне [и всегда][b] и в грядущие века. Аминь».

    '
