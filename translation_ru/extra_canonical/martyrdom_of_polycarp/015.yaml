    reason: Сохранение текстологического сигнала источника.
lexical_decisions:
- source_word: tied / being bound to the stake
  choice: привязали / привязанный к столбу
  rationale: Сохраняет противопоставление пригвождению и естественно описывает способ казни; «столб» не уточняет сверх свидетельства форму конструкции.
- source_word: noble ram
  choice: отборному барану
  rationale: Передаёт образ ценного, пригодного для жертвы животного без неестественного для современного русского «благородный баран».
- source_word: burnt sacrifice
  choice: всесожжению
  rationale: Устоявшийся русский термин для полностью сжигаемой жертвы, сохраняющий культовую образность.
- source_word: powers
  choice: сил
  rationale: Сохранён возможный ангелологический смысл наряду с «ангелами», без поясняющего сужения.
- source_word: receive a portion amongst the number of martyrs
  choice: вместе с мучениками приобщился
  rationale: Естественно передаёт участие в уделе и числе мучеников, не устраняя связь со следующей «чашей».
- source_word: incorruptibility
  choice: нетлении
  rationale: Сохраняет эсхатологический и телесный оттенок исходного выражения.
- source_word: High-priest
  choice: Первосвященника
  rationale: Устоявшееся христологическое обозначение, сохраняющее сакральный регистр.
theological_decisions:
- issue: Связь «чаши Христа» с воскресением
  choice: «приобщился к чаше ... Христа ради воскресения к вечной жизни»
  alternative: «в чаше ... Христа, к воскресению вечной жизни»
  rationale: Выбран более ясный русский синтаксис, при этом сохранены чаша, участие мучеников и направленность к воскресению; точная греческая синтаксическая связь требует проверки.
- issue: «Души и тела» и «нетление Святого Духа»
  choice: Сохранить оба элемента без догматического разъяснения их взаимосвязи
  alternative: Истолковать Святого Духа как подателя нетления
  rationale: Свидетель допускает синтаксическую и богословскую напряжённость; перевод не должен молча разрешать её.
- issue: Заключительная доксология
  choice: «Через Него Тебе с Ним и Святым Духом да будет слава»
  alternative: «через Которого Ему вместе с Ним и Святым Духом слава»
  rationale: Русский текст сохраняет различие Отца, Сына и Святого Духа и неоднозначно устроенную доксологическую формулу, не нормализуя её под позднейшую формулу.
- issue: Восстановленные местоимение и наречие времени
  choice: Сохранить квадратные скобки и снабдить сносками
  alternative: Включить слова без обозначения либо опустить
  rationale: Скобки в предоставленном свидетельстве отмечают текстологическую неуверенность или восстановление, которую следует сделать видимой.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным ритмом. Архаические местоименные и глагольные формы не используются, но сохранены традиционные богословские слова «Вседержитель», «всесожжение», «нетление» и «Первосвященник». Черновик основан на предоставленном публично доступном английском свидетельстве; прямая сверка с греческим текстом ещё необходима.
