base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: ru
  text: 'Итак, они не пригвоздили его, а привязали. Заведя руки за спину и привязанный к столбу, он был подобен отборному барану из большого стада, предназначенному в приношение, — всесожжению, приготовленному и угодному Богу. Подняв глаза к небу, он сказал:


    «Господи Боже Вседержитель, Отец Твоего возлюбленного и благословенного Сына Иисуса Христа, через Которого мы познали Тебя, Бога ангелов, сил и всего творения, а также всего рода праведных, живущих пред Тобой! Благословляю Тебя за то, что Ты удостоил меня этого дня и часа, чтобы я вместе с мучениками приобщился к чаше [Твоего][a] Христа ради воскресения к вечной жизни — души и тела — в нетлении Святого Духа. Да буду я сегодня принят пред Тобой в их число как жертва обильная и угодная — как Ты заранее её приготовил и явил, так и исполнил, верный и истинный Бог. Поэтому и за всё я восхваляю Тебя, благословляю Тебя и прославляю Тебя через вечного и небесного Первосвященника Иисуса Христа, Твоего возлюбленного Сына. Через Него Тебе с Ним и Святым Духом да будет слава ныне [и всегда][b] и в грядущие века. Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Твоего» перед «Христа» дано в квадратных скобках в используемом английском свидетельстве и, вероятно, представляет собой текстологическое восполнение; требуется сверка с греческой рукописной традицией.
    reason: Сохранение текстологического сигнала источника.
