base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: ru
  text: 'Такова была участь блаженного Поликарпа, принявшего мученическую смерть в Смирне вместе с христианами из Филадельфии — всего их было двенадцать. Но из всех них люди особенно помнят Поликарпа, так что о нём повсюду говорят даже язычники. Ведь он показал себя не только выдающимся учителем, но и славным мучеником. Все желают последовать его примеру в мученичестве, потому что оно совершилось по образцу Евангелия Христова.


    Своей стойкостью он одолел в борьбе неправедного правителя и так получил венец бессмертия. Теперь он радуется вместе с апостолами и всеми праведниками, прославляет всемогущего Бога и Отца и благословляет нашего Господа Иисуса Христа — Спасителя наших душ, Кормчего наших тел и Пастыря вселенской Церкви, пребывающей по всему миру.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод выполнен по предоставленному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка с греческой рукописной традицией ещё требуется.
