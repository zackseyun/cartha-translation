lexical_decisions:
- source_word: suffered martyrdom
  choice: принявшего мученическую смерть
  rationale: Естественная для современного литературного русского языка формулировка, сохраняющая прямой смысл свидетельства.
- source_word: heathen
  choice: язычники
  rationale: Исторически уместный и общепонятный эквивалент без излишне уничижительной окраски.
- source_word: after the pattern of the Gospel of Christ
  choice: по образцу Евангелия Христова
  rationale: 'Сохраняет возможную смысловую широту: мученичество соответствует как евангельскому повествованию о страданиях Христа, так и возвещённому Христом пути.'
- source_word: crown of immortality
  choice: венец бессмертия
  rationale: Сохраняет раннехристианский образ награды победителю и его библейские ассоциации.
- source_word: helmsman of our bodies
  choice: Кормчего наших тел
  rationale: Сохраняет необычную морскую метафору исходного свидетельства, не заменяя её толкованием.
- source_word: universal Church
  choice: вселенской Церкви
  rationale: Передаёт идею Церкви во всём мире в исторически укоренённой русской христианской лексике, не превращая выражение в конфессиональное название.
theological_decisions:
- issue: Настоящее время в описании посмертного состояния Поликарпа
  choice: Теперь он радуется... прославляет... и благословляет
  alternative: Он возрадовался... прославил... и благословил
  rationale: Сохранено настоящее время английского свидетельства, представляющее продолжающееся общение Поликарпа с апостолами и праведниками.
- issue: Связь мученичества Поликарпа с Евангелием Христа
  choice: оно совершилось по образцу Евангелия Христова
  alternative: оно последовало примеру Христа, изложенному в Евангелии
  rationale: Не уточняется сверх имеющихся данных, означает ли выражение сходство со страстями Христа, верность евангельскому учению или оба смысла.
- issue: Титулы Иисуса Христа
  choice: Спасителя наших душ, Кормчего наших тел и Пастыря вселенской Церкви
  alternative: Спасителя душ и тел, управляющего вселенской Церковью
  rationale: Все три параллельных титула сохранены отдельно, включая напряжённую и необычную формулу о Кормчем тел.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского мартирологического повествования. Архаические формы устранены, но традиционные и содержательно значимые образы «венца», «Кормчего» и «Пастыря» сохранены. «Церковь» написана с прописной буквы как обозначение вселенского сообщества верующих, а не современной деноминации.
