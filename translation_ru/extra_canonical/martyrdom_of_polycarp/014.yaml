    Когда костёр был готов, Поликарп снял все верхние одежды и развязал пояс. Он попытался снять и обувь, хотя прежде обычно этого не делал, потому что верующие всегда наперебой старались первыми прикоснуться к его телу. Ведь ещё до того, как он поседел, его всячески почитали за святую жизнь.


