review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт предоставленное английское свидетельство и сохраняет его полемически окрашенное упоминание иудеев с уместным пояснением. Однако «толпа» вместо множественного «толпы/народ» несколько сужает образ, «сам» добавляет отсутствующее уточнение, а «всё приготовленное» чрезмерно сглаживает упоминание предметов (орудий), разложенных вокруг Поликарпа. Прямая сверка с греческой традицией по-прежнему необходима; предложенные правки не зависят от спорного толкования.
  naturalness: Стиль современный и литературный. Уточнение «собирая по мастерским и баням» устраняет впечатление, будто древесину собирали внутри бань и мастерских. «Все верхние одежды» естественно и сохраняет полноту исходного выражения. В заключительной реплике «остаться неподвижным у костра» звучит по-русски яснее, чем «остаться на костре», которое может обозначать уже горение.
  terminology: «Поликарп», «костёр», «столб», «верующие» и косвенное именование Бога с прописной буквы употреблены последовательно. «Тело» является нейтральной современной передачей английского flesh в данном контексте. Сноска [a] корректно привязана к чувствительной авторской формулировке и не оправдывает её как характеристику еврейского народа в целом.
