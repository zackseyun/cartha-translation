base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/014.yaml
  text: 'These things then happened with so great speed, quicker than words could tell, the crowds forthwith collecting from the workshops and baths timber and faggots, and the Jews more especially assisting in this with zeal, as is their wont.


    But when the pile was made ready, divesting himself of all his upper garments and loosing his girdle, he endeavored also to take off his shoes, though not in the habit of doing this before, because all the faithful at all times vied eagerly who should soonest touch his flesh. For he had been treated with all honor for his holy life even before his gray hairs came.


    Forthwith then the instruments that were prepared for the pile were placed about him; and as they were going likewise to nail him to the stake, he said; ''Leave me as I am; for He that hath granted me to endure the fire will grant me also to remain at the pile unmoved, even without the security which ye seek from the nails.'''
translation:
  language: ru
  text: 'Всё это произошло с такой стремительностью — быстрее, чем можно рассказать. Толпа тотчас стала собирать в мастерских и банях брёвна и хворост; особенно усердно, по своему обыкновению, помогали в этом иудеи.[a]


    Когда костёр был готов, Поликарп снял верхние одежды и развязал пояс. Он попытался снять и обувь, хотя прежде обычно не делал этого сам, потому что верующие всегда наперебой старались первыми прикоснуться к его телу. Ведь ещё до того, как он поседел, его всячески почитали за святую жизнь.


    Затем вокруг него разложили всё приготовленное для костра. Когда же его хотели ещё и пригвоздить к столбу, он сказал: «Оставьте меня так. Тот, Кто дал мне силы выдержать огонь, даст и неподвижно остаться на костре без того, чтобы вы удерживали меня гвоздями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Замечание «по своему обыкновению» принадлежит древнему автору и отражает его полемическую характеристику участвовавших здесь иудеев; его не следует понимать как обобщение о еврейском народе.
    reason: Исторически и этически чувствительная фраза нуждается в пояснении, чтобы авторская полемика не воспринималась как утверждение переводчика или универсальная характеристика.
lexical_decisions:
- source_word: timber and faggots
  choice: брёвна и хворост
  rationale: Передаёт два вида горючего материала естественными современными словами без архаического «вязанки». С учётом отсутствия прямой сверки с греческим формулировка остаётся предварительной.
- source_word: all his upper garments
  choice: верхние одежды
  rationale: Естественное собирательное обозначение наружной одежды; «все» по-русски здесь избыточно.
- source_word: touch his flesh
  choice: прикоснуться к его телу
  rationale: Современное русское «тело» в данном повествовательном контексте звучит естественнее буквальной «плоти» и не вносит дополнительного богословского оттенка.
- source_word: instruments that were prepared for the pile
  choice: всё приготовленное для костра
  rationale: Английское свидетельство семантически не вполне определённо; нейтральная формулировка не уточняет предметы без проверки греческого текста.
- source_word: nail him to the stake
  choice: пригвоздить к столбу
  rationale: Сохраняет конкретный способ закрепления и различает столб и сложенный вокруг него костёр.
- source_word: He that hath granted me
  choice: Тот, Кто дал мне силы
  rationale: Передаёт подразумеваемого Бога без вставки отсутствующего имени; выражение «дал силы» естественно связывается с последующими инфинитивами.
theological_decisions:
- issue: Кто подразумевается под «Тот, Кто»
  choice: Сохранить косвенное обозначение с прописными буквами
  alternative: Явно написать «Бог» или «Господь»
  rationale: Свидетельство не называет субъекта прямо; перевод сохраняет риторическую и богословскую форму исходной реплики.
- issue: Почитание Поликарпа верующими
  choice: Передать как историческое уважение за святую жизнь
  alternative: Использовать культовую лексику о почитании святого или реликвий
  rationale: Текст сообщает о чести и желании прикоснуться к нему, но не требует конфессионального толкования этих действий.
- issue: Способность выдержать огонь и оставаться неподвижным
  choice: Представить как дарованную Богом силу
  alternative: Смягчить до личной решимости Поликарпа
  rationale: Речь самого Поликарпа прямо связывает стойкость с действием подразумеваемого Бога.
translation_notes:
  register: 'Современный литературный русский с торжественной, но не архаичной интонацией. Перевод предварительный: предоставлен английский публично-доменный свидетель, тогда как непосредственная сверка с греческой рукописной традицией ещё не выполнена. Имя «Поликарп» восстановлено в начале второго абзаца ради ясности русского повествования, где одно местоимение после смены абзаца звучало бы неясно.'
