base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: ru
  text: 'Тогда проконсул сказал:


    — У меня есть дикие звери, и я брошу тебя им, если не раскаешься.


    Но Поликарп ответил:


    — Зови их. Нам не позволено меняться от лучшего к худшему; но благородно обратиться от неправды к праведности.


    Тогда проконсул снова сказал ему:


    — Если ты пренебрегаешь дикими зверями, я предам тебя огню, если не раскаешься.


    Но Поликарп ответил:


    — Ты угрожаешь мне огнём, который горит лишь некоторое время и вскоре угасает, потому что не знаешь об огне грядущего суда и вечного наказания, уготованном нечестивым. Но почему ты медлишь? Давай, делай что хочешь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repent
  choice: раскаешься
  rationale: В угрозах проконсула естественное русское «раскаяться» сохраняет требование отказаться от прежней позиции, не добавляя конфессиональной терминологии.
- source_word: repentance / change
  choice: меняться
  rationale: В ответе Поликарпа английское свидетельство раскрывает игру между раскаянием и переменой; «меняться» естественно передаёт движение «от лучшего к худшему».
- source_word: untowardness / wrongdoing
  choice: неправда
  rationale: Слово передаёт нравственно дурное состояние или поведение и образует ясный контраст с «праведностью», не сужая смысл до отдельного проступка.
- source_word: righteousness
  choice: праведность
  rationale: Сохраняет нравственно-богословский вес противопоставления.
- source_word: ungodly
  choice: нечестивым
  rationale: Традиционное и понятное обозначение людей, живущих без благоговения перед Богом.
theological_decisions:
- issue: Соотношение раскаяния и перемены
  choice: 'Сохранить различие: проконсул требует «раскаяться», Поликарп говорит о недопустимой перемене от лучшего к худшему.'
  alternative: Во всех случаях употребить только «раскаяться/раскаяние».
  rationale: 'Различие удерживает риторический поворот: Поликарп отвергает требуемое отречение, но признаёт благородной нравственную перемену от неправды к праведности.'
- issue: Образ будущего наказания
  choice: «огонь грядущего суда и вечное наказание»
  alternative: Слить оба выражения в «вечный огонь суда».
  rationale: Раздельная передача сохраняет формулировку свидетельства и не решает молча, являются ли «огонь» и «наказание» полностью тождественными понятиями.
- issue: Для кого уготовано наказание
  choice: «уготованном нечестивым»
  alternative: «предназначенном безбожникам».
  rationale: «Нечестивые» шире, чем те, кто явно отрицает существование Бога, и лучше сохраняет нравственно-религиозный смысл.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского мученического повествования. Архаические местоимения и глагольные формы устранены; диалог оформлен естественно. Поскольку прямой анализ греческого текста обозначен как ожидающий проверки, проект осторожно следует предоставленному публичному английскому свидетельству и не вводит спорных уточнений.
