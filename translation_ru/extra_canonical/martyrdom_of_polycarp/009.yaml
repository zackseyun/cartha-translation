base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: ru
  text: 'Когда же он наконец завершил молитву, помянув всех, кто когда-либо встречался ему на пути, — малых и великих, знатных и незнатных, — а также всю вселенскую Церковь по всему миру, настал час отправляться. Его посадили на осла и повезли в город; это было в великую субботу.[a]


    Его встретили начальник полиции Ирод и его отец Никита. Они пересадили его в свою повозку, сели рядом и стали уговаривать: «Что плохого в том, чтобы сказать: „Кесарь — господин“, принести благовоние[b] и тем самым спасти себя?» — и говорили ещё в том же духе. Сначала он ничего им не отвечал. Но когда они продолжили настаивать, он сказал: «Я не стану делать того, что вы мне советуете».


    Не сумев его убедить, они заговорили с угрозами и заставили его поспешно выйти из повозки, так что, спускаясь, он ушиб голень. Даже не обернувшись, он сразу же быстро пошёл дальше, словно с ним ничего не случилось, и его повели на стадион. На стадионе стоял такой шум, что невозможно было расслышать ничьего голоса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в великую субботу». Точное календарное или местное значение выражения не уточняется; его не следует автоматически отождествлять с христианской Великой субботой перед Пасхой.'
    reason: Сохраняет отмеченную в свидетельстве неоднозначность «high Sabbath» и предотвращает непреднамеренную гармонизацию.
