    reason: Поясняет подразумеваемое ритуальное действие, не перегружая основной текст.
lexical_decisions:
- source_word: all who at any time had come in his way
  choice: всех, кто когда-либо встречался ему на пути
  rationale: Передаёт широкий круг людей, с которыми Поликарп соприкасался, не сужая выражение до друзей или знакомых.
- source_word: small and great, high and low
  choice: малых и великих, знатных и незнатных
  rationale: Сохраняет парный риторический охват всех слоёв общества; вторая пара естественно выражает общественное положение по-русски.
- source_word: universal Church
  choice: вселенскую Церковь
  rationale: Традиционное и исторически уместное обозначение Церкви во всей её полноте, без сведения выражения к позднейшему конфессиональному названию.
- source_word: captain of police
  choice: начальник полиции
  rationale: Понятный современному читателю функциональный эквивалент должностного обозначения в предоставленном свидетельстве.
- source_word: Caesar is Lord
  choice: Кесарь — господин
  rationale: «Кесарь» сохраняет древнеримский контекст, а строчная буква в слове «господин» не предрешает точный религиозно-политический оттенок формулы.
- source_word: offering incense
  choice: принести благовоние
  rationale: Сохраняет культовый смысл действия; буквальная русская формула остаётся понятной с пояснением в сноске.
- source_word: tumult
  choice: шум
  rationale: В контексте следующего уточнения естественно обозначает оглушительный гул толпы, не добавляя отсутствующих деталей о беспорядках.
theological_decisions:
- issue: Формула «Кесарь — господин»
  choice: Сохранена краткая и двусмысленная формула без поясняющей вставки о поклонении.
  alternative: «Кесарь — Господь» или «Кесарь — наш господин».
  rationale: Заглавная буква могла бы слишком прямо отождествить титул с божественным именованием, а притяжательное местоимение добавило бы отсутствующий смысл. Контекст каждения достаточно показывает культово-политическое требование.
- issue: «Вселенская Церковь»
  choice: Сохранено историческое выражение «вселенская Церковь».
  alternative: «вся Церковь во всём мире» или конфессионально маркированное название.
  rationale: Формулировка передаёт универсальность Церкви в раннехристианском тексте и не импортирует позднейшие конфессиональные различия.
- issue: «Великая суббота»
  choice: Выражение сохранено без отождествления с христианской Великой субботой.
  alternative: «большой субботний день» либо конкретная литургическая интерпретация.
  rationale: Источник допускает историко-календарную неоднозначность; сноска предупреждает современное автоматическое прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис упрощён там, где длинные периоды английского свидетельства звучали бы тяжеловесно, но последовательность событий и риторические пары сохранены. Поскольку прямое сопоставление с греческим источником обозначено как ещё не выполненное, спорные места переданы осторожно и без догматической конкретизации.
