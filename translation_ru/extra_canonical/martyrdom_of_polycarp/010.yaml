base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: ru
  text: 'Когда Поликарп вошёл на стадион, с неба раздался обращённый к нему голос: «Будь твёрд, Поликарп, и будь мужествен!» Говорившего никто не увидел, но те из наших, кто там находился, услышали голос. Когда же Поликарпа наконец вывели, поднялся сильный шум: люди услышали, что он схвачен.


    Когда его подвели к проконсулу, тот спросил, действительно ли перед ним Поликарп. Поликарп подтвердил это, и проконсул стал убеждать его отречься, говоря: «Уважь свой возраст», — и прочее, что они обычно говорят: «Поклянись фортуной[a] кесаря; одумайся и скажи: “Долой безбожников!”» Тогда Поликарп с серьёзным выражением лица посмотрел на всю толпу беззаконных язычников, находившихся на стадионе, махнул им рукой и, со стоном подняв глаза к небу, сказал: «Долой безбожников!»


    Но проконсул продолжал настойчиво требовать: «Поклянись — и я отпущу тебя. Поноси Христа!» Поликарп ответил: «Восемьдесят шесть лет я служу Ему, и Он не причинил мне никакого зла. Как же я могу хулить моего Царя, Который спас меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Фортуна кесаря»: греч. τύχη — «фортуна», «судьба», «благополучие». Клятва была религиозно-политической формулой, связанной с благополучием и властью императора.'
