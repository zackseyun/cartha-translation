    rationale: В греческой традиции данного текста стоит τύχη («фортуна», «судьба», «благополучие»), а не genius. Английское witness-слово genius и зависимая от него сноска не должны определять русский перевод против греческого текста.
  - severity: low
    issue: «С суровым выражением лица»
    rationale: σεμνός означает серьёзный, достойный, торжественный; «суровый» добавляет оттенок жёсткости, которого текст не требует.
  - severity: low
