  source_fidelity: 'Нужна существенная точечная правка культовой формулы: греческое τὴν Καίσαρος τύχην означает «фортуной/судьбой кесаря», а не «гением кесаря». Английское свидетельство и английская примечательная запись в этом месте передают или объясняют формулу неточно. Также «с суровым выражением» усиливает σεμνὸν τῷ προσώπῳ; нейтральнее и точнее «с серьёзным выражением». Во всём остальном перевод в целом верно сохраняет ход повествования, иронию реплики об «безбожниках» и неразрешённость значения восьмидесяти шести лет.'
  naturalness: Русский текст литературный и ясный. Для большей точности и естественности «пожалей свою старость» заменено на «уважь свой возраст», «указал на них рукой» — на «махнул им рукой», а наименование должностного лица унифицировано как «проконсул».
  terminology: '«Проконсул», «кесарь», «Христос» и «безбожники» уместны. Формула клятвы передана как «Поклянись фортуной кесаря» и снабжена сноской: это позволяет не подменять τύχη термином «гений» и не сводить религиозно-политическую формулу к современному бытовому значению слова «удача».'
