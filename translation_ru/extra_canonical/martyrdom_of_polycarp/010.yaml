lexical_decisions:
- source_word: ἀνδρίζου
  choice: будь мужествен
  rationale: Сохраняет призыв проявить мужество без устаревшего или гендерно заострённого оборота «будь мужчиной».
- source_word: Καίσαρος τύχην
  choice: гением кесаря
  rationale: Передаёт римскую культовую формулу о покровительствующем духе императора; термин пояснён в сноске, чтобы не подменять древнее понятие более привычным «счастьем» или «судьбой».
- source_word: ἄθεοι
  choice: безбожники
  rationale: 'Сохраняет намеренную иронию эпизода: обвинение обращается против языческой толпы.'
- source_word: λοιδόρησον τὸν Χριστόν
  choice: поноси Христа
  rationale: Передаёт требование оскорбительно отозваться о Христе, не усиливая его автоматически до более специального богословского термина.
- source_word: δεσπότης
  choice: Царь
  rationale: Следует смыслу приведённого свидетельства и контексту верности верховному Владыке; прописная буква указывает на Христа.
theological_decisions:
- issue: Что означают восемьдесят шесть лет служения
  choice: Сохранена буквальная формула без уточнения, отсчитываются ли годы от рождения, крещения или обращения.
  alternative: Передать как указание на возраст Поликарпа либо на длительность его христианской жизни.
  rationale: Текст сам не разрешает эту историко-богословскую неопределённость.
- issue: Объект слова «безбожники»
  choice: Фраза сохранена в её ироническом контексте после жеста в сторону языческой толпы.
  alternative: 'Пояснить в основном тексте: «Долой этих безбожников!»'
  rationale: Явное добавление «этих» сделало бы толкование более однозначным, чем сама реплика, хотя повествовательный контекст ясно направляет её на толпу.
- issue: Высказывание о спасении
  choice: «Который спас меня» без уточнения характера или времени спасения.
  alternative: «Мой Спаситель» или развёрнутое сотериологическое толкование.
  rationale: Так сохраняется лаконичная формулировка и не вносится конфессионально обусловленное объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Архаизмы сведены к минимуму; официальные реалии «проконсул» и «кесарь» сохранены. Поскольку предоставленный греческий текст отсутствует и исходные данные прямо отмечают, что проверка по древнегреческому ещё ожидается, проект осторожно следует публичному английскому свидетельству и не скрывает существенные неоднозначности.
