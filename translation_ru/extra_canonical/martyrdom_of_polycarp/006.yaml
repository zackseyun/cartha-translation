review_pass:
  verdict: revise
  source_fidelity: 'Основной ход повествования передан точно: Поликарп не устрашен, по убеждению большинства уходит из города, пребывает с немногими спутниками в загородном владении и непрестанно молится за всех и за церкви по всему миру. В заключительной реплике исходная модальность выражает необходимость (греч. δεῖ), а не безличную судьбу; поэтому «мне суждено» следует заменить. «Быть сожжённым заживо» передаёт ζῶντα καῆναι.'
  naturalness: '«День и ночь только и делая, что молясь» синтаксически тяжеловесно и ненормативно для современного литературного русского. Более естественно: «не занимаясь ничем иным, кроме молитвы». «Впал в исступление» сохраняет традиционное значение ἔκστασις и уместно в возвышенном повествовательном регистре.'
  terminology: «Славный Поликарп», «удалиться», «усадьба», «церкви» и «исступление» приемлемы. «Мне надлежит быть сожжённым заживо» точнее сохраняет безличную необходимость исходной фразы, не приписывая её источник Богу, судьбе или иной силе.
  issues:
  - severity: medium
    issue: «Мне суждено быть сожжённым заживо»
    rationale: «Суждено» в русском языке обычно вводит оттенок предопределённой судьбы. Исходное «it must needs be» (соответствующее греч. δεῖ) утверждает необходимость, не называя её основания.
  - severity: low
    issue: «день и ночь только и делая, что молясь»
    rationale: Деепричастное построение неудачно и затрудняет чтение; смысл непрестанной молитвы можно передать естественнее без изменения содержания.
