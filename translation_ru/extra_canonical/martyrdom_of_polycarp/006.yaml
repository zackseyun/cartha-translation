base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: ru
  text: 'Когда славный Поликарп впервые услышал об этом, он нисколько не испугался и хотел остаться в городе. Но большинство убедило его удалиться. Тогда он удалился в усадьбу неподалёку от города и оставался там с несколькими спутниками, день и ночь только и делая, что молясь за всех людей и за церкви по всему миру, ибо таков был его постоянный обычай.


    За три дня до того, как его схватили, во время молитвы он впал в исступление и увидел, что его подушка объята огнём. Повернувшись к тем, кто был с ним, он сказал: «Мне суждено быть сожжённым заживо».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному английскому свидетельству; сверка с греческим текстом ещё требуется. Выражение «мне суждено» передаёт смысл неизбежности; буквально по свидетельству: «необходимо, чтобы я был сожжён заживо».'
    reason: Источник прямо отмечает, что проверка по греческому оригиналу ещё не проведена; примечание также сохраняет прозрачность значимой модальной формулировки.
lexical_decisions:
- source_word: the glorious Polycarp
  choice: славный Поликарп
  rationale: Сохраняет почётный эпитет исходного свидетельства без добавления конфессионально окрашенного титула.
- source_word: withdraw
  choice: удалиться
  rationale: Передаёт добровольный уход из города, не усиливая смысл до бегства.
- source_word: farm
  choice: усадьба
  rationale: Естественное русское обозначение загородного владения или хозяйства; «ферма» звучало бы излишне современно и узко.
- source_word: for all men
  choice: за всех людей
  rationale: Передаёт универсальный охват и избегает современного возможного понимания слова «мужчины».
- source_word: falleth into a trance
  choice: впал в исступление
  rationale: Передаёт необычное экстатическое состояние, не уточняя его природу сверх доступного английского свидетельства.
- source_word: It must needs be
  choice: Мне суждено
  rationale: Естественно выражает заявленную неизбежность события, не вводя явно названного действующего лица.
theological_decisions:
- issue: Характер видения Поликарпа
  choice: описать как исступление и видение
  alternative: назвать это пророческим откровением или сном
  rationale: Текст сообщает переживание и его истолкование, но в представленном свидетельстве прямо не даёт ему более узкой богословской классификации.
- issue: Источник неизбежности мученической смерти
  choice: «Мне суждено» без указания действующего лица
  alternative: «Бог определил, что я буду сожжён»
  rationale: Сохраняется богословская открытость без добавления прямого упоминания Бога, отсутствующего в доступном свидетельстве.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис упрощён относительно архаичного английского свидетельства, но повтор молитвенного ритма и торжественный тон сохранены. Избегались церковнославянизмы, конфессиональные добавления и чрезмерно бытовая лексика.
