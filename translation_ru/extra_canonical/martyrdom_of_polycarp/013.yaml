- source_word: puller down of our gods
  choice: ниспровергатель наших богов
  rationale: Передаёт сильное обвинительное выражение и не уточняет, идёт ли речь о буквальном разрушении изображений или о подрыве культа.
- source_word: Asiarch
  choice: азиарх
  rationale: Сохранён специальный исторический титул областного сановника и устроителя общественных празднеств.
- source_word: the faithful
  choice: верные
  rationale: Естественное раннехристианское обозначение членов общины, без внесения более узкого смысла.
- source_word: must needs
  choice: надлежало / надлежит
  rationale: Сохраняет мотив необходимости и исполнения видения, не определяя сверх текста точную природу этой необходимости.
theological_decisions:
- issue: Значение благодати в описании лица Поликарпа
  choice: «лицо его было полно благодати»
  alternative: «лицо его сияло благодатным спокойствием»
  rationale: Выбрана более формальная передача, сохраняющая богословскую многозначность благодати и не добавляющая образ сияния или конкретное эмоциональное состояние.
- issue: Необходимость исполнения видения
  choice: «Так надлежало исполниться видению»
  alternative: «Это должно было произойти, чтобы исполнилось видение»
  rationale: Формулировка сохраняет провиденциальное напряжение повествования, не вводя явного объяснения причинности, которого свидетель не даёт.
- issue: Пророческий характер слов Поликарпа
  choice: «пророчески сказал»
  alternative: «предсказал»
  rationale: Сохранена авторская богословская оценка речи как пророческой, а не только как удачного предсказания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского мученического повествования. Исторические титулы «проконсул» и «азиарх» сохранены. Синтаксис умеренно упрощён для ясности, но риторическая сила обвинений толпы и повтор мотива сожжения заживо сохранены. Поскольку прямая сверка с греческим текстом обозначена как ожидающая выполнения, проект опирается на предоставленное публичное английское свидетельство и аудированный английский консультационный слой.
