base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: ru
  text: 'Итак, сотник, увидев противодействие со стороны иудеев, вывел Поликарпа на середину и сжёг его, как было у них принято.


    После этого мы собрали его кости, которые драгоценнее драгоценных камней и чище очищенного золота, и поместили их в подходящем месте.


    Там Господь, если позволит, даст нам собираться вместе, насколько это будет возможно, в ликовании и радости и праздновать день рождения его мученичества[a] — для памяти о тех, кто уже совершил подвиг, и для упражнения и приготовления тех, кому ещё предстоит подвизаться.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «День рождения его мученичества» — раннехристианское выражение о дне мученической смерти как о рождении для новой жизни; здесь имеется в виду также ежегодное памятное празднование.
    reason: Сохранён исторически значимый буквальный образ, который требует краткого пояснения для современного читателя.
lexical_decisions:
- source_word: centurion
  choice: сотник
  rationale: Традиционный и понятный русский эквивалент римского воинского звания; точнее исторически, чем описательное «центурион» для широкого читателя.
- source_word: opposition raised on the part of the Jews
  choice: противодействие со стороны иудеев
  rationale: Сохраняет коллективную формулировку свидетельства, не усиливая её до более резкого обвинения и не распространяя её за пределы участников описанного события.
- source_word: bones
  choice: кости
  rationale: Прямое обозначение останков в доступном свидетельстве; более конкретно и формально близко, чем обобщённое «останки».
- source_word: birth-day of his martyrdom
  choice: день рождения его мученичества
  rationale: Сохраняет раннехристианский парадоксальный образ дня мученической смерти как рождения; необычность пояснена в сноске, а не устранена в тексте.
- source_word: contest
  choice: борьба
  rationale: Передаёт состязательный образ естественным современным русским словом, сохраняя повтор и метафорическую связь между прежними и будущими мучениками.
- source_word: training and preparation
  choice: наставления и подготовки
  rationale: «Наставление» естественнее буквального спортивного «обучения» в данном памятно-назидательном контексте, тогда как «подготовка» сохраняет направленность на будущее испытание.
theological_decisions:
- issue: Смысл выражения «день рождения» применительно к мученичеству
  choice: Сохранить образ буквально и снабдить пояснением
  alternative: Передать как «годовщину его мученической смерти»
  rationale: Буквальный образ несёт богословскую и историческую значимость раннехристианского языка; замена на «годовщину» сделала бы текст яснее, но устранила бы эту смысловую напряжённость.
- issue: Отношение к костям мученика
  choice: Сохранить высокую сравнительную оценку и упоминание подобающего места без добавления культа или практики почитания
  alternative: Назвать кости «святыми мощами»
  rationale: «Мощи» внесло бы позднейшую специализированную терминологию и конфессиональные ассоциации, отсутствующие в предоставленном свидетельстве.
- issue: Роль Господа в будущих собраниях
  choice: Передать как условие Божьего позволения
  alternative: Сформулировать как уверенное обещание будущего собрания
  rationale: Так сохраняется зависимость собрания общины от Господней воли и не усиливается модальность текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Синтаксис умеренно формальный, соответствующий раннехристианскому повествованию. Проект основан на предоставленном общественном английском свидетельстве; прямая сверка с греческой рукописной традицией остаётся необходимой. Формулировки не претендуют на устранение неоднозначностей, которые невозможно надёжно решить без исходного греческого текста.
