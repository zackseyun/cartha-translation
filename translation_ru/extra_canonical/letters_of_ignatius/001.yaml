base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: ru
  text: 'Игнатий, называемый также Богоносцем, — церкви в Эфесе [Асийском][a], благословлённой величием через полноту Бога Отца, прежде веков предопределённой навеки пребывать в непреходящей и неизменной славе, соединённой и избранной в истинном страдании[b] по воле Отца и Иисуса Христа, Бога нашего, достойной всяческих поздравлений: обильный привет во Христе Иисусе и в безупречной радости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Асийском» в использованном свидетельстве заключено в квадратные скобки, что указывает на текстологическое восстановление или неуверенность.
    reason: Сохранить обозначенный в исходных данных текстологический сигнал.
  - marker: b
    text: 'Буквально по использованному английскому свидетельству: «в истинном страдании». Вероятно, имеется в виду подлинное страдание Христа; прямая сверка с греческим текстом ещё требуется.'
    reason: Предупредить читателя о необычном и богословски значимом выражении, не устраняя его неоднозначность.
lexical_decisions:
- source_word: Ignatius, who is also Theophorus
  choice: Игнатий, называемый также Богоносцем
  rationale: Традиционное и понятное русское воспроизведение имени/прозвания Θεοφόρος; формула «называемый также» не определяет, имя это или титул.
- source_word: through the plentitude of God the Father
  choice: через полноту Бога Отца
  rationale: Сохранены необычная образность и инструментальное значение английского свидетельства без поясняющего богословского перефразирования.
- source_word: foreordained before the ages
  choice: прежде веков предопределённой
  rationale: Передаёт временную и волевую составляющие выражения, сохраняя торжественный раннехристианский регистр.
- source_word: abiding and unchangeable glory
  choice: непреходящей и неизменной славе
  rationale: «Непреходящая» естественно выражает постоянство, а «неизменная» сохраняет второй, отдельный признак.
- source_word: worthy of all felicitation
  choice: достойной всяческих поздравлений
  rationale: Сохраняет эпистолярную похвалу; более буквальное «всякого блаженства» могло бы ошибочно обозначить состояние адресата, а не приветственную оценку.
- source_word: blameless joy
  choice: безупречной радости
  rationale: Передаёт нравственную чистоту радости современным литературным языком без чрезмерной церковнославянизации.
theological_decisions:
- issue: Определение Иисуса Христа как Бога
  choice: Отца и Иисуса Христа, Бога нашего
  alternative: Отца и нашего Бога Иисуса Христа
  rationale: Сохранено прямое отнесение «Бога нашего» к Иисусу Христу, как в представленном свидетельстве, при этом русский синтаксис остаётся ясным.
- issue: Значение выражения «in a true passion»
  choice: в истинном страдании
  alternative: истинными страданиями / в истинной любви
  rationale: Сохранена возможная отсылка к подлинности страданий Христа и не устранена смысловая напряжённость; перевод «любовь» был бы необоснованным разрешением неоднозначности без прямой проверки греческого текста.
- issue: Грамматическое отнесение длинного ряда определений
  choice: Все определения отнесены к церкви в Эфесе
  alternative: Часть определений понимать как относящиеся к славе или к Богу
  rationale: Такова структура предоставленного английского свидетеля и эпистолярного обращения; русский текст сохраняет женский род определений, делая связь прозрачной.
translation_notes:
  register: 'Современный литературный русский язык с торжественным эпистолярным ритмом. Длинная периодическая конструкция сохранена как особенность пролога, но упорядочена тире и двоеточием. Проект предварительный: предоставлена лишь английская передача греческой средней редакции, а прямая проверка исходного греческого текста обозначена как ожидающая выполнения.'
