base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: ru
  text: 'Но я узнал, что некоторые люди, пришедшие оттуда, несли дурное учение. Вы не позволили им посеять его в вас: вы заткнули уши, чтобы не принять того, что они сеяли. Ведь вы — камни храма Отца, заранее приготовленные для строения Бога Отца. Вас поднимают ввысь подъёмным устройством Иисуса Христа — крестом; канатом вам служит Святой Дух, воротом — ваша вера, а любовь — путём, ведущим к Богу.[a]


    Итак, все вы — спутники в пути, богоносцы и храмоносцы, христоносцы и носители святыни,[b] во всём украшенные заповедями Иисуса Христа. Я ликую вместе с вами, удостоившись через это письмо беседовать с вами и разделять вашу радость: ведь вы не любите ничего, принадлежащего иной жизни,[c] но только Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь развёрнут единый строительный образ: верующие — камни Божьего строения; крест — подъёмное устройство, Святой Дух — канат, а вера — ворот, которым поднимают груз.'
    reason: Поясняет связь непривычных технических образов, не заменяя их толкованием в основном тексте.
  - marker: b
    text: 'Буквально здесь следует ряд сложных именований: «богоносцы, храмоносцы, христоносцы, святоносцы». Они могут означать тех, кто несёт в себе Бога, храм, Христа и святыню или святыни.'
    reason: Сохраняет словесную игру оригинала и отмечает смысловой диапазон последнего сложного слова.
  - marker: c
    text: Выражение «принадлежащего иной жизни» не вполне ясно. Его также понимают как указание на обычный человеческий образ жизни или на жизнь, отличную от жизни с Богом.
    reason: Сохраняет реальную неоднозначность вместо молчаливого выбора одного толкования; прямую сверку всего места с греческой рукописной традицией следует завершить при редакционной проверке.
lexical_decisions:
- source_word: μηχανή
  choice: подъёмное устройство
  rationale: Сохраняет строительный образ механизма, посредством которого камни поднимают ввысь; последующее пояснение отождествляет его с крестом.
- source_word: ἀναγωγεύς
  choice: ворот
  rationale: Передаёт подъёмный механизм, приводимый в действие канатом, и поддерживает цельную строительную метафору.
- source_word: σύνοδοι
  choice: спутники в пути
  rationale: Передаёт образ совместного пути, не сводя слово к позднейшему церковно-административному значению «синод».
- source_word: θεοφόροι καὶ ναοφόροι, χριστοφόροι, ἁγιοφόροι
  choice: богоносцы и храмоносцы, христоносцы и носители святыни
  rationale: Сохраняет риторический ряд сложных слов с компонентом «носить»; последнее выражение сделано прозрачнее для современного читателя.
- source_word: κεκοσμημένοι
  choice: украшенные
  rationale: Сохраняет образ праздничного убранства, связанный с ликованием, а не заменяет его нейтральным «облечённые».
- source_word: κατὰ ἄλλον βίον
  choice: принадлежащего иной жизни
  rationale: Формулировка намеренно сохраняет неясность выражения и не подменяет его конфессионально заданным толкованием.
theological_decisions:
- issue: Образ креста как μηχανή Иисуса Христа
  choice: «подъёмное устройство Иисуса Христа — крест»
  alternative: «орудие Иисуса Христа, то есть крест»
  rationale: Выбранный вариант сохраняет конкретную строительную метафору и явное отождествление устройства с крестом.
- issue: Святой Дух как σχοινίον в строительной метафоре
  choice: «канатом вам служит Святой Дух»
  alternative: «пользуясь Святым Духом как канатом»
  rationale: Краткая предикативная конструкция естественна по-русски и сохраняет смелый образ без его догматического смягчения.
- issue: Ряд θεοφόροι / ναοφόροι / χριστοφόροι / ἁγιοφόροι
  choice: сохранить как метафорические именования носителей
  alternative: развернуть как «несущие Бога, храм, Христа и святыни»
  rationale: Сложные именования важны для ритма и богословской насыщенности текста; сноска предотвращает их прочтение как технических титулов.
- issue: Неясное выражение о βίος
  choice: сохранить «иная жизнь» и отметить неоднозначность
  alternative: толковательно перевести «обычная человеческая жизнь»
  rationale: Исходные данные не позволяют безоговорочно устранить смысловую и текстологическую напряжённость в пользу более гладкого толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Обращение во множественном числе передано без архаизмов. Сохранены резкие земледельческие и строительные метафоры, параллелизм и праздничная интонация. Черновик опирается прежде всего на доступные данные о греческой лексике средней редакции, при консультационном использовании предоставленных английских свидетельств; из-за заявленного статуса источника требуется окончательная построчная сверка с критическим греческим текстом.
