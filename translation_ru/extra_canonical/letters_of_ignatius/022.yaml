  rationale: 'Исправлены лексически значимые «слава Божия» (δόξα), целевая конструкция с ἵνα и заключительное ἔρρωσθε. Сохранены адресаты, географические названия, молитвенная просьба, самоуничижительное «последний» и пожелательный характер просьбы о памятовании Христа. Сноски не требуются: после правки спорная или неясная для русского читателя неоднозначность не остаётся.'
