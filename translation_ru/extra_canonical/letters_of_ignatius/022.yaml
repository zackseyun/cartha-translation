- from: 'Я предан вам и тем, кого вы ради чести Божьей послали в Смирну. Оттуда я и пишу вам, благодаря Господа и любя Поликарпа так же, как и вас. Помните обо мне, как и я желаю, чтобы Иисус Христос помнил о вас.


