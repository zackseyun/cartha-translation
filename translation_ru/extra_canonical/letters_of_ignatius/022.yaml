base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: ru
  text: 'Я люблю вас и тех, кого вы послали в Смирну во славу Божию. Оттуда я также пишу вам, благодаря Господа и любя Поликарпа, как люблю и вас. Помните обо мне, как и я желаю, чтобы Иисус Христос также помнил о вас.


    Молитесь о церкви в Сирии, откуда меня узником ведут в Рим, — обо мне, последнем из тамошних верующих, — чтобы я оказался во славу Божию. Будьте благополучны в Боге Отце и в Иисусе Христе, нашей общей надежде.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: I am devoted to you
  choice: Я предан вам
  rationale: Передаёт сильную личную привязанность естественно и достойно, не вводя более специфического образа, чем позволяет доступное английское свидетельство.
- source_word: for the honor of God
  choice: ради чести Божьей / послужить чести Божьей
  rationale: Сохраняет повтор и смысл направленности к Божьей чести; во втором случае добавлен глагол для естественности русского синтаксиса.
- source_word: Remember me
  choice: Помните обо мне
  rationale: Сохраняет прямую просьбу и её связь с последующим упоминанием того, что Христос помнит об адресатах.
- source_word: the very last of the faithful there
  choice: последнем из тамошних верующих
  rationale: Передаёт самоуничижительное высказывание без искусственно архаического оборота.
- source_word: Fare ye well
  choice: Пребывайте
  rationale: В контексте дополнения «в Боге Отце и в Иисусе Христе» это естественнее буквального «прощайте» и сохраняет духовное содержание заключительного пожелания.
theological_decisions:
- issue: Смысл выражения «counted worthy to be found unto the honor of God»
  choice: я был удостоен послужить чести Божьей
  alternative: я был удостоен оказаться к чести Божьей
  rationale: Выбран связный русский оборот, сохраняющий мысль о дарованной чести и направленности происходящего к Божьей славе; точная греческая конструкция требует последующей проверки.
- issue: «Jesus Christ may also remember you» как пожелание или уверенность
  choice: чтобы Иисус Христос помнил о вас
  alternative: что Иисус Христос также помнит о вас
  rationale: Сохраняется пожелательный оттенок английского свидетельства и не превращается в безусловное утверждение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского послания. Перевод остаётся предварительным: предоставлен английский свидетельский текст, а прямая сверка со среднерецензионной греческой традицией ещё не выполнена.'
