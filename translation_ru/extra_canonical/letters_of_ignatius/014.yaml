review_pass:
  verdict: revise
  source_fidelity: Первое предложение в целом передаёт призыв σπουδάζετε… πυκνότερον συνέρχεσθαι. Однако «во славу Его» добавляет притяжательное «Его», которого в греческом δόξαν нет; в контексте оно вероятно относится к Богу, но добавление не требуется. Для ὄλεθρος «пагубное дело» слишком конкретизирует существительное как «дело»; речь о губительном/разрушительном воздействии или гибели. Заключительное «война небесного и земного» воспроизводит эллипсис, но по-русски недостаточно прозрачно. Формулировка «война небесных и земных» ближе к субстантивированным прилагательным оригинала и сохраняет их неопределённую референцию, пояснённую сноской.
  naturalness: Тон современный, литературный и соответствует краткому увещательному жанру. «Чаще / часто» удачно сохраняет повтор πυκνότερον / πυκνῶς. «Собираться вместе» и затем «собираться воедино» создают ненужное лексическое расхождение; «собираться» во втором случае достаточно. «Благодаря единодушию» может звучать как причинное объяснение, тогда как ἐν τῇ ὁμονοίᾳ естественнее передать «в единодушии» или «через единодушие».
  terminology: «Благодарение» — безопасная основная передача εὐχαριστία при необходимой сноске о возможном евхаристическом смысле. «Единодушие» хорошо передаёт ὁμόνοια. «Упраздняется» точнее «прекращается» для καταργεῖται, поскольку выражает устранение действенности; оно уместно в данном высоком, но не архаическом регистре.
  issues:
  - severity: medium
    issue: Добавлено «Его» в «во славу Его».
    rationale: В греческом стоит εἰς δόξαν без притяжательного местоимения. Контекстная отсылка к Богу возможна, но не должна вводиться в основной текст без необходимости.
  - severity: medium
    issue: «Пагубное дело» сужает ὄλεθρος.
    rationale: Ὄλεθρος означает губительное разрушение, погибель или разрушительное воздействие, а не обязательно совершённое «дело». Нейтральнее передать его как «разрушительное действие».
  - severity: low
    issue: «Благодаря единодушию» излишне причинно окрашено.
    rationale: 'Предлог ἐν прежде всего обозначает сферу/условие: разрушительное действие сатаны прекращается «в единодушии» верующих.'
  - severity: medium
    issue: «Война небесного и земного» неестественна и затемняет субстантивированные прилагательные ἐπουρανίων καὶ ἐπιγείων.
    rationale: «Небесных и земных» сохраняет эллиптическую форму оригинала; сноска корректно удерживает открытым вопрос, о существах, силах или реальностях ли идёт речь.
  revised_text: 'Итак, старайтесь чаще собираться для благодарения Богу[a] и для славы. Ведь когда вы часто собираетесь, силы сатаны низвергаются, а его разрушительное действие прекращается в единодушии вашей веры.


    Нет ничего лучше мира: в нём упраздняется всякая война небесных и земных[b].'
  revised_footnotes:
  - marker: a
    text: Слово, переведённое как «благодарение», может также иметь оттенок совместного евхаристического собрания.
    reason: Сохраняет лексическую и богослужебную неоднозначность εὐχαριστία без навязывания одного смысла в основном тексте.
  - marker: b
    text: 'Буквально: «всякая война небесных и земных»; речь может идти о небесных и земных существах, силах или реальностях.'
    reason: Поясняет эллиптическое греческое выражение, не закрепляя единственное толкование.
