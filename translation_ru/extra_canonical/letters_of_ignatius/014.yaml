base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: ru
  text: 'Итак, старайтесь чаще собираться вместе для благодарения Богу[a] и во славу Его. Ведь когда вы часто собираетесь воедино, силы сатаны низвергаются, а его пагубное дело сходит на нет благодаря единодушию вашей веры.


    Нет ничего лучше мира: в нём прекращается всякая война небесного и земного[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «благодарение», может также иметь оттенок совместного евхаристического собрания.
    reason: Сохранить лексическую и богослужебную неоднозначность εὐχαριστία.
  - marker: b
    text: 'Буквально: «всякая война небесных и земных»; речь может идти о небесных и земных существах, силах или реальностях.'
    reason: Пояснить эллиптическое греческое выражение, не закрепляя единственное толкование.
lexical_decisions:
- source_word: εὐχαριστία
  choice: благодарение
  rationale: Передаёт основное значение слова и не вынуждает читателя заранее выбирать между общим благодарением Богу и евхаристическим собранием; возможный богослужебный оттенок отмечен в сноске.
- source_word: ὁμόνοια
  choice: единодушие
  rationale: Сохраняет идею согласия и общей устремлённости верующих, звуча естественно и достойно в современном русском языке.
- source_word: ὄλεθρος
  choice: пагубное дело
  rationale: Контекстуально передаёт разрушительное действие сатаны, не сужая значение до одного конкретного бедствия; сочетание с «сходит на нет» естественно выражает λύεται.
- source_word: καταργεῖται
  choice: прекращается
  rationale: Передаёт устранение или лишение силы без излишне технического оттенка слова «упраздняется».
theological_decisions:
- issue: Значение εὐχαριστία в контексте собрания
  choice: «благодарение Богу» с пояснительной сноской
  alternative: «Евхаристия»
  rationale: Греческое слово допускает как общее значение благодарения, так и раннехристианский евхаристический оттенок; основной текст не должен без необходимости устранять эту неоднозначность.
- issue: Объём выражения ἐπουρανίων καὶ ἐπιγείων
  choice: «небесного и земного» с пояснительной сноской
  alternative: «на небе и на земле» или «небесных и земных существ»
  rationale: Субстантивированные прилагательные не называют прямо ни место, ни существа; выбранная формулировка сохраняет широту и напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, увещательным и достоинственным звучанием. Повтор «чаще / часто» сохранён как риторическая особенность текста. Проект сверен с доступным чтением среднегреческой редакции, однако с учётом предоставленных метаданных его следует считать предварительным до формальной проверки по указанной греческой рукописной традиции.
