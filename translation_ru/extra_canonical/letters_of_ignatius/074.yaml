base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: ru
  text: 'Поскольку мне сообщили, что в ответ на вашу молитву и на то сердечное участие, которое вы проявляете во Христе Иисусе, в церкви Антиохии Сирийской царит мир, вам, как церкви Божьей, подобает назначить диакона и послать его туда как Божьего посланника, чтобы он поздравил их, когда они соберутся вместе, и прославил Имя.[a]



    Блажен во Христе Иисусе тот, кто удостоится такого служения; и вы сами будете прославлены. Если вы этого желаете, вам нетрудно совершить это ради имени Божьего, ибо ближайшие церкви послали епископов, а другие — пресвитеров и диаконов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Имя» передаёт выражение, в котором носитель Имени прямо не назван.
    reason: Сохраняет намеренно неуточнённый референт выражения χωρίς богословской экспликации.
lexical_decisions:
- source_word: tender sympathy
  choice: сердечное участие
  rationale: Передаёт тёплое, деятельное сочувствие современным и достойным русским языком, не сводя выражение лишь к эмоциональной жалости.
- source_word: hath peace
  choice: воцарился мир
  rationale: Естественно обозначает восстановление мирного положения в антиохийской церкви, хотя точный греческий оборот требует прямой проверки.
- source_word: God’s ambassador
  choice: Божий посланник
  rationale: «Посланник» звучит естественнее буквального «посол Бога» в данном церковном поручении и сохраняет идею официального представительства.
- source_word: ministration
  choice: служение
  rationale: Устоявшееся широкое соответствие, которое не ограничивает поручение позднейшим техническим значением церковной должности.
- source_word: bishops … presbyters and deacons
  choice: епископов … пресвитеров и диаконов
  rationale: Сохранены исторические наименования церковных служителей без переноса позднейших конфессиональных определений их полномочий.
theological_decisions:
- issue: Референт выражения «Имя»
  choice: Имя
  alternative: имя Божье / имя Господа
  rationale: Сохранена намеренная краткость и возвышенная неопределённость свидетельства; конкретный референт не добавлен в основной текст.
- issue: Прославление филадельфийской церкви
  choice: вы сами будете прославлены
  alternative: вам самим это принесёт честь
  rationale: Сохранена сильная богословская формулировка свидетельства, а не ослаблена до общественного признания.
- issue: Связь мира в Антиохии с молитвой и участием адресатов
  choice: по вашей молитве и благодаря … участию
  alternative: в ответ на вашу молитву и сердечное участие
  rationale: Передана заявленная причинная связь, но не уточнён способ действия молитвы сверх доступного свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Архаические формы устранены, но исторические термины «диакон», «епископ» и «пресвитер» сохранены. Проект основан на предоставленном общественном английском свидетельстве; греческая традиция средней редакции требует последующей прямой сверки.
