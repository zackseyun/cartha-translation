base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: ru
  text: 'Итак, если те, кто жил согласно древним установлениям, пришли к новой надежде, уже не соблюдая субботы, но живя по дню Господнему[a], в который и наша жизнь взошла через Него и через Его смерть — смерть, которую некоторые отрицают, — и через эту тайну мы обрели веру, чтобы оказаться учениками Иисуса Христа, нашего единственного Учителя, то как мы сможем жить без Него?


    Ведь и пророки, будучи Его учениками, Духом ожидали Его как своего Учителя. Поэтому Тот, Кого они по праву ожидали, явившись, воскресил их из мёртвых[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живя по Господнему». Слово «день» в греческом выражении подразумевается, но не названо; в контексте противопоставления соблюдению субботы наиболее естественно понимать: «по дню Господнему». Возможны и более широкие толкования эллиптического выражения.'
    reason: Сохраняет грамматическую неполноту κατὰ κυριακὴν ζῶντες, не выдавая одно толкование за бесспорное.
  - marker: b
    text: 'Предоставленный английский свидетель в этом месте содержит бессмысленное чтение «when he one». Греческий текст средней редакции имеет παρών: «явившись» или «будучи среди них»; далее буквально: «воскресил их из мёртвых».'
    reason: Объясняет расхождение с английским свидетелем и точно передаёт значение греческого причастия.
lexical_decisions:
- source_word: ἐν παλαιοῖς πράγμασιν ἀναστραφέντες
  choice: жил по древним установлениям
  rationale: Передаёт образ жизни, определяемый прежним религиозным порядком, не усиливая выражение до отрицательно окрашенных «устаревших обычаев».
- source_word: εἰς καινότητα ἐλπίδος
  choice: пришли к новой надежде
  rationale: Сохраняет движение к «новизне надежды» в естественной современной русской форме.
- source_word: μηκέτι σαββατίζοντες
  choice: уже не соблюдали субботу
  rationale: Глагол означает практиковать субботнее соблюдение; единственное число естественно для названия еженедельного дня.
- source_word: κατὰ κυριακὴν ζῶντες
  choice: жили по дню Господнему
  rationale: Сохраняет наиболее распространённое понимание эллиптического κυριακή как «день Господень» и одновременно необычную конструкцию «жить по»; неоднозначность отмечена в сноске.
- source_word: ἡ ζωὴ ἡμῶν ἀνέτειλεν
  choice: наша жизнь взошла
  rationale: Сохраняет метафору восхода или появления света, а не сводит её просто к «началась» или «воскресла».
- source_word: δι’ οὗ μυστηρίου ἐλάβομεν τὸ πιστεύειν
  choice: через эту тайну мы обрели веру
  rationale: Естественно передаёт буквальную мысль «получили возможность/дар верить», связывая веру с предшествующей тайной.
- source_word: τῷ πνεύματι
  choice: в Духе
  rationale: Сохраняет инструментально-сферическое значение выражения и не уточняет сверх текста, было ли ожидание произведено Духом или совершалось в духовном откровении.
- source_word: παρὼν ἤγειρεν αὐτοὺς ἐκ νεκρῶν
  choice: придя, воскресил их из мёртвых
  rationale: Передаёт греческое «явившись/придя, поднял их из мёртвых» и исправляет бессмысленное чтение английского свидетеля «when he one».
theological_decisions:
- issue: κυριακή как обозначение дня или образа жизни, принадлежащего Господу
  choice: «по дню Господнему» с примечанием
  alternative: «по Господней жизни» или «по Господу»
  rationale: В среднегреческой рукописной традиции прилагательное стоит без выраженного существительного; традиционное восполнение «день» хорошо согласуется с противопоставлением соблюдению субботы, но грамматическая эллиптичность требует сохранить сведения об альтернативе.
- issue: К чему относится «которую некоторые отрицают»
  choice: к смерти Христа
  alternative: к жизни/восхождению жизни
  rationale: Ближайший грамматический антецедент в греческом — «смерть»; перевод делает эту связь явной женским местоимением, не добавляя содержания.
- issue: Воскрешение пророков Христом
  choice: «воскресил их из мёртвых»
  alternative: метафорическое «пробудил их от смерти»
  rationale: Фраза прямо использует стандартную лексику воскрешения. Не следует ослаблять трудное богословское утверждение или подменять его объяснением.
- issue: Связь «нашей жизни» с воскресением
  choice: сохранена метафора «взошла»
  alternative: «воскресла»
  rationale: Глагол ἀνατέλλω обозначает восход/появление; перевод «воскресла» чрезмерно определил бы смысл и сгладил образ.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис длинного условного периода сохранён, но разделён абзацем для читаемости. «День Господень» не капитализирован целиком и не заменён конфессионально маркированным «воскресеньем». Термины «тайна», «вера», «ученики», «Учитель», «Дух» переданы в привычном христианском регистре без внесения позднейших догматических пояснений.
