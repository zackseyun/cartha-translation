base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: ru
  text: 'Но если кто-нибудь излагает вам учение иудаизма, не слушайте его. Ибо лучше слышать о христианстве от обрезанного, чем об иудаизме — от необрезанного. Но если ни тот ни другой не говорят об Иисусе Христе, то для меня они — надгробные плиты и могилы мёртвых, на которых начертаны лишь человеческие имена.


    Итак, сторонитесь злых ухищрений и козней князя этого мира, чтобы его происки не сокрушили вас и вы не ослабели в любви. Но собирайтесь все вместе с неразделённым сердцем.


    И я благодарю моего Бога за то, что у меня чистая совесть в том, как я обходился с вами. Никто не может сказать — ни тайно, ни открыто, — что я был кому-либо в тягость, будь то в малом или в великом. И обо всех, среди кого я говорил, молюсь, чтобы они не обратили сказанное в свидетельство против самих себя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propound Judaism
  choice: проповедовать вам иудаизм
  rationale: Передаёт не простое упоминание, а наставление и продвижение религиозного учения; «проповедовать» естественно в данном полемическом контексте.
- source_word: Christianity
  choice: о христианстве
  rationale: Сохранено прямое противопоставление иудаизму без внесения конфессиональных уточнений.
- source_word: tombstones and graves of the dead
  choice: надгробия и могилы мёртвых
  rationale: Сохранён резкий двойной погребальный образ исходного свидетельства.
- source_word: prince of this world
  choice: князя этого мира
  rationale: Традиционно узнаваемая, но современно понятная передача раннехристианского обозначения враждебной духовной силы.
- source_word: undivided heart
  choice: с неразделённым сердцем
  rationale: Сохраняет телесно-духовную метафору единства и цельности, не сводя её только к единомыслию.
- source_word: was burdensome
  choice: был кому-либо в тягость
  rationale: Естественная русская идиома, сохраняющая широкий смысл обременения без неоправданного сведения к материальной поддержке.
theological_decisions:
- issue: Отношение к обрезанному и необрезанному учителю
  choice: Сохранено парадоксальное сопоставление без поясняющей гармонизации
  alternative: Истолковать «обрезанного» как христианина еврейского происхождения, а «необрезанного» как язычника
  rationale: Текст намеренно противопоставляет содержание вести внешнему статусу говорящего; уточнение происхождения было бы толкованием сверх представленного свидетельства.
- issue: Кого обозначает «князь этого мира»
  choice: Оставлен титул «князь этого мира»
  alternative: Назвать его сатаной или дьяволом
  rationale: Прямое именование устранило бы формальную неоднозначность и заменило образ истолкованием.
- issue: «Свидетельство против самих себя»
  choice: Сохранена судебная метафора без определения того, что именно станет свидетельством
  alternative: Уточнить, что против них засвидетельствует проповедь Игнатия или их отказ послушаться
  rationale: Предоставленный источник допускает связь со сказанным Игнатием, но не выражает её настолько явно, чтобы разворачивать в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис умеренно торжественный, но без архаизмов вроде «дабы», «сей» и «внемлите». Проект основан на предоставленном общественном английском свидетельстве; прямая проверка по среднерецензионной греческой традиции пока не выполнена.
