base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: ru
  text: 'Вы хорошо сделали, что приняли Филона и Рея Агафопода, последовавших за мной ради Божьего дела, как служителей [Христа] Бога.[a] Они также благодарят за вас Господа, потому что вы всячески подкрепили их. Ничто из сделанного вами не пропадёт.


    Мой дух отдаёт себя за вас, как и мои узы, которыми вы не пренебрегли и которых не постыдились. Не постыдится и вас Тот, Кто есть совершенная верность, — Иисус Христос.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Христа» дано в квадратных скобках вслед за предоставленным английским свидетелем как текстологически восстанавливаемое; требуется прямая сверка с греческой рукописной традицией.
    reason: Сохранение отмеченной в исходных данных текстологической неуверенности.
  - marker: b
    text: 'Буквально по предоставленному свидетелю: «Тот, Кто есть совершенная верность»; необычная формула сохранена без богословского упрощения.'
    reason: Сохранение метафорической и богословской напряжённости текста.
lexical_decisions:
- source_word: Rhaius Agathopus
  choice: Рей Агафопод
  rationale: Имена переданы в форме, близкой к греческой традиции; Agathopous понимается как единое личное имя, а не как эпитет.
- source_word: in the cause of God
  choice: ради Божьего дела
  rationale: Передаёт служение Божьему делу естественным современным русским выражением, не сужая смысл до конкретной миссии.
- source_word: ministers
  choice: служителей
  rationale: Нейтрально сохраняет идею служения, не вводя позднейшего церковного сана.
- source_word: refreshed
  choice: подкрепили
  rationale: Охватывает заботу, ободрение и оказанную помощь, не ограничивая её только телесным отдыхом.
- source_word: My spirit is devoted for you
  choice: Мой дух отдаёт себя за вас
  rationale: Сохраняет сильную формулу самоотдачи и избегает неясного буквального «посвящён за вас».
- source_word: perfect faithfulness
  choice: совершенная верность
  rationale: Сохраняет абстрактно-предикативную и богословски напряжённую формулировку свидетеля, не заменяя её поясняющим титулом.
theological_decisions:
- issue: Чтение «[Christ] God»
  choice: '[Христа] Бога'
  alternative: Бога Христова / Христа Бога
  rationale: Квадратные скобки сохранены как сигнал текстологического восстановления в предоставленном свидетеле; синтаксическая неоднозначность не устраняется без прямой сверки с греческим текстом.
- issue: Отождествление «совершенной верности»
  choice: Тот, Кто есть совершенная верность, — Иисус Христос
  alternative: Тот, Кто совершенно верен, Иисус Христос
  rationale: Именная формула свидетеля сохранена, а приложение ясно связывает её с Иисусом Христом, не сводя образное выражение к обычному прилагательному.
- issue: Обещание «Nothing shall be lost to you»
  choice: Ничто из сделанного вами не пропадёт
  alternative: Ничто не будет для вас потеряно
  rationale: Передаёт обещание, что оказанное служение не останется без плода или воздаяния, но не уточняет природу награды.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского послания. Архаические формы устранены, но сохранены характерные образы «духа», «уз» и «не постыдиться». Проект предварительный: предоставлен англоязычный свидетель, тогда как прямая проверка греческого текста ещё ожидается.'
