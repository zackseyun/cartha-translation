base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: ru
  text: 'Пусть во всём вы будете мне на радость, если только я этого достоин. Ведь хотя я и в узах, мне не сравниться ни с одним из вас, находящихся на свободе. Я знаю, что вы не превозноситесь, потому что Иисус Христос — в вас. И когда я хвалю вас, я знаю, что вы смущаетесь ещё больше, ибо написано: «Праведный сам себя обвиняет».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Притч. 18:17 по греческому тексту Септуагинты: «Праведный сам себя обвиняет…» Формулировка и нумерация стиха в других библейских традициях могут отличаться.'
    reason: Указывает источник цитаты и объясняет её зависимость от греческой библейской традиции.
lexical_decisions:
- source_word: ὀναίμην ὑμῶν
  choice: Пусть … вы будете мне на радость
  rationale: Передаёт пожелание и идиоматический смысл греческого оборота без устаревшего русского выражения «да воспользуюсь вами».
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Сохраняет широкое, контекстуально не уточнённое значение выражения.
- source_word: δεδεμαι / λελυμένων
  choice: я … в узах / находящихся на свободе
  rationale: Воспроизводит противопоставление связанного узника и свободных людей естественным русским языком; возможный более широкий оттенок «освобождённых» не навязывается.
- source_word: οὐ φυσιοῦσθε
  choice: вы не превозноситесь
  rationale: Передаёт метафору надменной «надутости» современным и достойным русским выражением.
- source_word: ἐν ἑαυτοῖς
  choice: в вас
  rationale: Естественно передаёт присутствие Христа внутри адресатов как общины, не уточняя сверх текста характер этого присутствия.
- source_word: ἐντρέπεσθε
  choice: вы смущаетесь
  rationale: Сохраняет оттенки стыда, скромности и неловкости перед похвалой; «стыдитесь» по-русски могло бы ошибочно подразумевать вину.
- source_word: ὁ δίκαιος ἑαυτοῦ κατήγορος
  choice: Праведный сам себя обвиняет
  rationale: Формально и ясно передаёт афористическую цитату, сохраняя возвратность и юридический образ обвинителя.
theological_decisions:
- issue: Слова о присутствии Иисуса Христа в адресатах
  choice: «Иисус Христос — в вас»
  alternative: «вы имеете Иисуса Христа в себе»
  rationale: Выбранная формулировка естественнее по-русски и сохраняет утверждение о внутреннем присутствии Христа, не определяя его догматический механизм.
- issue: Смысл противопоставления уз и свободы
  choice: Сохранено буквальное положение Игнатия в узах и адресатов на свободе
  alternative: Истолковать «свободных» как духовно освобождённых
  rationale: Контекст допускает нравственный или духовный отзвук, но прямо его не устанавливает; перевод не должен устранять эту напряжённость толкованием.
- issue: Риторическое самоуничижение автора
  choice: «мне не сравниться ни с одним из вас»
  alternative: «я недостоин ни одного из вас»
  rationale: Первый вариант точнее сохраняет незавершённо-сравнительный характер свидетельства и не усиливает текст отдельным понятием недостоинства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Избегаются архаизмы вроде «да возрадуюсь о вас» и разговорные обороты. Поскольку предоставленное исходное свидетельство англоязычное, а прямая сверка с греческой рукописной традицией обозначена как ожидающая выполнения, решения сформулированы консервативно и сохраняют отмечаемые греческой традицией смысловые возможности.
