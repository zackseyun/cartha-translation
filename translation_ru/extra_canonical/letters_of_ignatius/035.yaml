- from: 'Пусть во всём вы будете мне на радость, если только я этого достоин. Ведь хотя я и в узах, мне не сравниться ни с одним из вас, находящихся на свободе. Я знаю, что вы не превозноситесь, потому что Иисус Христос — в вас. И чем больше я вас хвалю, тем больше, как я знаю, вы смущаетесь, ибо написано: «Праведный сам себя обвиняет».[a]'
