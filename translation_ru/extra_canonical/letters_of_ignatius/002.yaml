translation:
  language: ru
  text: 'Приветствуя в Боге ваше горячо любимое имя, которое вы по праву носите [с честным и добродетельным расположением], по вере и любви во Христе Иисусе, нашем Спасителе, — подражая Богу и воспламенившись сердцем в крови Бога,[a] вы в совершенстве исполнили дело, сродное вашей природе.


    Услышав, что я иду из Сирии в узах ради общего Имени и надежды и надеюсь благодаря вашим молитвам удостоиться сразиться с дикими зверями в Риме, чтобы через это стать учеником, вы поспешили увидеть меня.


    Итак, во имя Бога я принял всё ваше множество в лице Онисима, чья любовь невыразима и который к тому же является вашим епископом [по плоти].[b] Молюсь, чтобы вы любили его согласно Иисусу Христу и чтобы все вы были подобны ему. Ибо блажен Тот, кто удостоил вас иметь такого епископа, как вы того заслуживаете.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воспламенившись в крови Бога». Необычная формулировка сохранена; она связывает кровь Христа с Богом, не разъясняя способ этой связи.'
    reason: Требуется обозначить буквальность и сохранить христологическое напряжение без догматического расширения.
  - marker: b
    text: Слова «по плоти» в предоставленном английском свидетельстве заключены в квадратные скобки; до прямой сверки с греческой рукописной традицией их текстуальный статус следует считать предварительным.
    reason: Источник прямо сообщает, что проверка по греческому тексту ещё не проведена, а скобки сигнализируют редакционную или текстуальную неуверенность.
lexical_decisions:
- source_word: τὸ πολυαγάπητόν σου ὄνομα (reconstructed from the middle-recension Greek tradition)
  choice: ваше горячо любимое имя
  rationale: Сохраняет необычную метонимию «имя» и выраженную степень любви, не подменяя её более гладким «вашу общину».
- source_word: συγγενικὸν ἔργον
  choice: дело, сродное вашей природе
  rationale: Передаёт буквальный образ врождённого или свойственного адресатам дела; не сводит выражение просто к «доброму делу».
- source_word: τοῦ κοινοῦ ὀνόματος καὶ ἐλπίδος
  choice: ради общего Имени и надежды
  rationale: Сохраняет эллиптическое и богословски насыщенное «Имя», вероятно христианское имя или имя Христа, без преждевременного уточнения.
- source_word: θηριομαχῆσαι
  choice: сразиться с дикими зверями
  rationale: Естественно передаёт технический образ выступления против зверей на римской арене.
- source_word: δυνηθῶ μαθητὴς εἶναι
  choice: стать учеником
  rationale: 'Передаёт парадокс Игнатия: мученичество должно подтвердить или осуществить его ученичество; добавление «истинным» не вносится.'
- source_word: ἐν προσώπῳ Ὀνησίμου
  choice: в лице Онисима
  rationale: 'Сохраняет представительный смысл: в одном епископе Игнатий принимает всю общину.'
- source_word: ἐν σαρκί
  choice: по плоти
  rationale: Сохранена традиционная антропологическая формула и отмечена как текстуально оговорённая в предоставленном свидетельстве.
theological_decisions:
- issue: «в крови Бога» и утверждение о Боге, имеющем кровь
  choice: в крови Бога
  alternative: в крови Христа / кровью Бога
  rationale: Сохранена резкая раннехристианская формулировка и её христологическое напряжение; перевод не устраняет её поясняющей заменой.
- issue: Смысл «Имени»
  choice: общее Имя
  alternative: общее христианское имя / имя Христа
  rationale: Оригинальная эллиптичность оставлена открытой, поскольку уточнение могло бы сузить возможные значения.
- issue: Мученичество как условие ученичества
  choice: чтобы через это стать учеником
  alternative: чтобы оказаться истинным учеником
  rationale: Не добавлено оценочное «истинным»; сохранена провокационная авторская связь между мученичеством и ученичеством.
- issue: «согласно Иисусу Христу»
  choice: любили его согласно Иисусу Христу
  alternative: любили его так, как угодно Иисусу Христу
  rationale: Сохранена необычная и допускающая разные оттенки формула нормы или образца любви, а не дано одно толкование.
- issue: Достоинство общины и дар епископа
  choice: как вы того заслуживаете
  alternative: по Своей благодати
  rationale: Свидетельство прямо выражает соответствие заслугам адресатов; конфессионально мотивированное смягчение не внесено.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского послания. Синтаксис умеренно упрощён для ясности, но необычные метафоры, эллипсис «Имя» и богословские напряжения сохранены. Проект предварительный: предоставлена главным образом английская версия Лайтфута, тогда как прямая проверка по греческому тексту средней редакции ещё ожидается.'
