revisions:
- from: 'Узнав, что ваша любовь отличается превосходным порядком на путях Божьих, я обрадовался и решил обратиться к вам в вере Иисуса Христа.


    Ибо, удостоившись носить в этих узах, которые я ношу с собой, имя, достойное Бога[a], я воспеваю церкви и молюсь, чтобы в них было единство плоти и духа, принадлежащих Иисусу Христу — нашей неоскудевающей жизни; единство веры и любви, которая превыше всего; и, что важнее всего, единство с Иисусом и с Отцом. Если в Нём[b] мы терпеливо перенесём все притеснения князя этого мира и избежим их, то достигнем Бога.'
  to: 'Узнав о том, что ваша любовь отличается упорядоченностью, сообразной Богу, я обрадовался и решил обратиться к вам в вере Иисуса Христа.


    Ибо, удостоившись имени, в высшей степени подобающего Богу, я в узах, которые ношу, воспеваю церкви и молюсь о том, чтобы в них было единство плоти и духа Иисуса Христа — Того, Кто непрестанно есть наша жизнь; единство веры и любви, которой ничто не предпочитается; и, что превыше всего, единство с Иисусом и Отцом. Если в Нём[b], терпеливо перенося всё, мы избежим князя этого мира, то достигнем Бога.'
