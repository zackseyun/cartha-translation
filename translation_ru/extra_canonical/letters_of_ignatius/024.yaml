base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: ru
  text: 'Узнав о том, что ваша любовь отличается упорядоченностью, сообразной Богу, я обрадовался и решил обратиться к вам в вере Иисуса Христа.


    Ибо, удостоившись имени, в высшей степени подобающего Богу, я в узах, которые ношу, воспеваю церкви и молюсь о том, чтобы в них было единство плоти и духа Иисуса Христа — Того, Кто непрестанно есть наша жизнь; единство веры и любви, которой ничто не предпочитается; и, что превыше всего, единство с Иисусом и Отцом. Если в Нём[b], терпеливо перенося всё, мы избежим князя этого мира, то достигнем Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Греческое «в Котором» (ἐν ᾧ) имеет мужской род. Его точный антецедент в этой сжатой фразе о единстве Иисуса и Отца не вполне ясен; перевод сохраняет местоименную неопределённость.
    reason: Сохраняет синтаксическую неоднозначность оригинала, не предрешая богословское истолкование.
lexical_decisions:
- source_word: exceeding good order
  choice: превосходным порядком
  rationale: Сохраняет акцент на образцовом устроении любви, не сводя выражение только к нравственной добродетели.
- source_word: in the ways of God
  choice: на путях Божьих
  rationale: Передаёт традиционный библейский образ естественным и понятным русским выражением.
- source_word: bear ... name
  choice: носить ... имя
  rationale: Сохраняет вероятную игру между исповеданием имени и положением узника; конкретный референт имени в данном свидетельстве не уточняется.
- source_word: never-failing life
  choice: неоскудевающей жизни
  rationale: Передаёт смысл жизни, которая не иссякает и не оставляет, в возвышенном, но современно понятном регистре.
- source_word: despite
  choice: притеснения
  rationale: По контексту обозначает враждебное обращение и нападки; «притеснения» не вводит излишне узкую трактовку.
- source_word: attain unto God
  choice: достигнем Бога
  rationale: Сохраняет сильную направленность к Богу и лаконизм древнего выражения.
theological_decisions:
- issue: Единство плоти и духа, «которые принадлежат Иисусу Христу»
  choice: сохранена грамматическая связь обоих понятий с Иисусом Христом
  alternative: истолковать как единство человеческих тела и духа, совершаемое во Христе
  rationale: Свидетельство прямо относит и плоть, и дух к Иисусу Христу; перевод не разрешает возможную христологическую и церковную многозначность.
- issue: Антецедент выражения «in whom»
  choice: «в Нём» с примечанием о возможной отсылке
  alternative: «в них» либо явное «в Отце»
  rationale: Английское свидетельство допускает формальную отсылку к ближайшему «Отцу», но контекст также может охватывать единство с Иисусом и Отцом; двусмысленность отмечена.
- issue: «most godly name»
  choice: «имя, достойное Бога»
  alternative: «Божественное имя» или конкретизация как имени христианина/Богоносца
  rationale: Не конкретизирует имя без прямой проверки греческого текста и не приписывает самому имени божественную природу.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского послания. Синтаксис несколько упрощён ради ясности, но сохранены риторические повторы «единство» и богословское напряжение текста. Проект предварительный: предоставлен только английский публично-доступный свидетельский перевод; прямая сверка со среднерецензионной греческой традицией остаётся необходимой.'
