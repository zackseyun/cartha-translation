base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: ru
  text: 'Не дайте увлечь себя чуждыми учениями и древними, бесполезными баснями. Ведь если мы и поныне живём по законам иудейства, то тем самым признаём, что не приняли благодати.


    Ибо божественные пророки жили по Христу Иисусу.[a] Потому они и подвергались гонениям: Его благодать вдохновляла их, чтобы непокорные обрели полную уверенность в том, что есть один Бог, явивший Себя через Иисуса Христа, Своего Сына. Он — Его Слово, происшедшее из молчания, и во всём благоугодил Пославшему Его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жили согласно Христу Иисусу» или «жили по Христу Иисусу»; оборот указывает на жизнь, сообразную Христу и направленную к Нему, а не на то, что пророки жили позднее Него.'
    reason: Фраза особенно легко получает ошибочное хронологическое прочтение; примечание сохраняет смысловую напряжённость исходного оборота.
lexical_decisions:
- source_word: ἑτεροδοξίαις (reflected in the witness as “strange doctrines”)
  choice: чуждыми учениями
  rationale: Передаёт не просто необычность, а отклонение от принятого апостольского учения, не вводя поздней конфессиональной терминологии.
- source_word: κατὰ Ἰουδαϊσμόν (“after the manner of Judaism”)
  choice: по законам иудейства
  rationale: Естественная русская формулировка, обозначающая образ жизни, определяемый иудейской религиозной практикой; слово «иудейство» сохраняет исторический характер высказывания.
- source_word: ὁμολογοῦμεν (“we avow/admit”)
  choice: тем самым признаём
  rationale: 'Выражает логический вывод автора: такой образ жизни фактически равнозначен признанию, что благодать не была принята.'
- source_word: κατὰ Χριστὸν Ἰησοῦν (“after/according to Christ Jesus”)
  choice: жили по Христу Иисусу
  rationale: 'Сохраняет многозначность оборота: речь может идти о жизни в согласии со Христом, с ориентацией на Него, а не о позднейшем хронологическом существовании.'
- source_word: λόγος
  choice: Слово
  rationale: Сохраняет личностно-богословское наименование Сына и узнаваемую связь с раннехристианской традицией Логоса.
- source_word: ἀπὸ σιγῆς προελθών (“proceeded from silence”)
  choice: происшедшее из молчания
  rationale: Близко передаёт необычный и богословски напряжённый образ, не объясняя его через более поздние доктринальные системы.
- source_word: ἐπληροφορηθῆναι / πληροφορηθῆναι (“might be fully persuaded”)
  choice: обрели полную уверенность
  rationale: Передаёт достижение полноты убеждённости, а не принуждение к вере.
theological_decisions:
- issue: Отношение пророков ко Христу
  choice: «жили по Христу Иисусу»
  alternative: «жили после Христа Иисуса» или «жили согласно Христу Иисусу»
  rationale: В контексте допристианских пророков чисто хронологическое «после Христа» вводит ложный смысл. Буквально-сжатое «по Христу» сохраняет направленность их жизни на Христа и исходную необычность оборота.
- issue: Явление единого Бога через Сына
  choice: «один Бог, явивший Себя через Иисуса Христа, Своего Сына»
  alternative: «единый Бог, открывшийся в Иисусе Христе»
  rationale: Сохранены и единство Бога, и посредническое «через», и различение Бога и Его Сына; не подменяется «через» более сильным «в».
- issue: Слово, происшедшее из молчания
  choice: образ сохранён без толкования
  alternative: объяснить как вечное рождение, историческое воплощение или начало проповеди
  rationale: Текст допускает разные богословские прочтения; перевод не должен заранее выбирать одно из них.
- issue: Местоимение в выражении «Его благодать»
  choice: отнесено ко Христу Иисусу
  alternative: отнести к Богу
  rationale: Ближайший антецедент — Христос Иисус; при этом контекст тесно связывает действие Божьей благодати с Сыном.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис умеренно торжественный, но без архаизмов вроде «да не», «оный» и «благоизволивший». Заглавные буквы в местоимениях, относящихся к Богу и Христу, использованы последовательно в рамках принятой русской религиозной нормы. Поскольку предоставлен английский публичнодоступный свидетель и указано, что прямая сверка с греческой рукописной традицией ещё ожидается, решения сформулированы консервативно и особенно спорный оборот снабжён примечанием.
