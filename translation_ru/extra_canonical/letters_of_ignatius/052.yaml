base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: ru
  text: 'Любовь смирнян и эфесян приветствует вас. Помните в своих молитвах церковь в Сирии, членом которой [и] я недостоин называться, ведь я — последний из них.


    Будьте здравы в Иисусе Христе, повинуясь епископу, как заповеди, а также пресвитерам. И пусть каждый из вас любит других неразделённым сердцем.


    Мой дух отдаётся за вас в жертву — не только теперь, но и тогда, когда я достигну Бога. Ведь я всё ещё в опасности; но Отец верен в Иисусе Христе и исполнит моё прошение и ваше. Да окажемся мы непорочными в Нём.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: The love of the Smyrnaens and Ephesians
  choice: Любовь смирнян и эфесян
  rationale: Сохранена олицетворённая формула приветствия, характерная для раннехристианской эпистолярной речи.
- source_word: church which is in Syria
  choice: церковь в Сирии
  rationale: Естественная современная форма, сохраняющая указание на местную церковь.
- source_word: bishop
  choice: епископу
  rationale: Устоявшийся историко-церковный термин без дополнительного конфессионального толкования.
- source_word: presbytery
  choice: пресвитерам
  rationale: По контексту речь идёт о совете или совокупности пресвитеров; личная форма яснее по-русски, хотя структурный оттенок английского witness частично ослаблен.
- source_word: with undivided heart
  choice: неразделённым сердцем
  rationale: Сохранён образ цельной, не раздвоенной любви.
- source_word: My spirit is offered up for you
  choice: Мой дух отдаётся за вас в жертву
  rationale: Жертвенный оттенок выражения сохранён, без сведения его к простому пожеланию или эмоциональной привязанности.
- source_word: attain unto God
  choice: достигну Бога
  rationale: Сохранена необычная и богословски напряжённая формулировка о предстоящем мученичестве и единении с Богом.
- source_word: unblamable
  choice: непорочными
  rationale: Устоявшийся библейский эквивалент, передающий отсутствие вины или упрёка.
theological_decisions:
- issue: Повиновение епископу «как заповеди»
  choice: повинуясь епископу, как заповеди
  alternative: повинуясь епископу как Божьему повелению
  rationale: Не добавлено «Божьему», поскольку предоставленное свидетельство этого прямо не уточняет; сохранена исходная сжатость и возможная неоднозначность сравнения.
- issue: Жертвенный язык о духе автора
  choice: Мой дух отдаётся за вас в жертву
  alternative: Я отдаю за вас свою жизнь
  rationale: Сохранено слово «дух» и культово-жертвенный образ; текст не сведён к более однозначному утверждению о физической смерти.
- issue: Верность Отца «в Иисусе Христе»
  choice: Отец верен в Иисусе Христе
  alternative: Отец через Иисуса Христа верно исполнит
  rationale: Сохранена предложная связь, не заменённая инструментальным толкованием «через».
- issue: Местоимение в заключении
  choice: в Нём
  alternative: в Иисусе Христе
  rationale: Сохранён местоименный характер свидетельства и его потенциальная референциальная напряжённость; прописная буква отражает божественного референта, не уточняя его сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным раннехристианским эпистолярным регистром. Перевод предварительный: предоставлен английский публично-доменный свидетель, тогда как непосредственная сверка с греческой традицией средней редакции ещё не выполнена. Редакторские квадратные скобки вокруг «[и]» сохранены в основном тексте.'
