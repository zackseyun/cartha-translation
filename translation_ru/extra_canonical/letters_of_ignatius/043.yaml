base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: ru
  text: 'У меня много глубоких мыслей в Боге, но я знаю свою меру, чтобы не погибнуть из-за своей похвальбы. Теперь мне следует ещё больше остерегаться и не внимать тем, кто превозносит меня, потому что говорящие мне такое становятся для меня бичом.


    Хотя я и желаю пострадать, всё же не знаю, достоин ли этого. Зависть дьявола для многих остаётся невидимой, но против меня он ведёт ещё более жестокую борьбу. Поэтому я ищу кротости, посредством которой князь этого мира обращается в ничто.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deep thoughts in God
  choice: глубоких мыслей в Боге
  rationale: Сохранена необычная и богословски насыщенная формулировка свидетельства без сведения её к более узкому понятию откровений или тайн.
- source_word: take the measure of myself
  choice: знаю свою меру
  rationale: Естественная русская формулировка, передающая самоограничение и трезвую оценку себя.
- source_word: boasting
  choice: похвальбы
  rationale: Передаёт действие самого говорящего и сохраняет связь с опасностью духовного самопревозношения.
- source_word: puff me up
  choice: превозносит меня
  rationale: Передаёт смысл раздувания самомнения в современном литературном русском языке.
- source_word: scourge
  choice: бичом
  rationale: Сохранён сильный образ болезненного духовного вреда.
- source_word: desire to suffer
  choice: желаю пострадать
  rationale: Не уточняется вид страдания, поскольку свидетельство оставляет его широким, хотя контекст допускает мученичество.
- source_word: envy of the devil
  choice: зависть дьявола
  rationale: Сохранено буквальное обозначение враждебного побуждения без замены на искушение или козни.
- source_word: gentleness
  choice: кротости
  rationale: «Кротость» естественно передаёт добродетель мягкости и несамоуверенности в раннехристианском контексте.
- source_word: prince of this world
  choice: князь этого мира
  rationale: Сохранена традиционная библейская формула и её связь с евангельской речью.
- source_word: brought to nought
  choice: обращается в ничто
  rationale: Сохраняет сильную формулировку свидетельства, не подменяя её более интерпретирующими «побеждается» или «лишается силы».
theological_decisions:
- issue: Характер «глубоких мыслей в Боге»
  choice: Сохранить широкую формулировку
  alternative: «Мне открыто много тайн Божьих»
  rationale: Альтернатива необоснованно превращает мысли в особые откровения и устраняет смысловую открытость.
- issue: Желание страдать
  choice: Не уточнять, что речь именно о мученичестве
  alternative: «желаю принять мученичество»
  rationale: Контекст Игнатия делает мученичество вероятным, но предоставленное свидетельство говорит шире; перевод не должен снимать эту грань неоднозначности.
- issue: Действие кротости против князя мира
  choice: 'Сохранить орудийную связь: «посредством которой»'
  alternative: «благодаря которой я одолею князя этого мира»
  rationale: В тексте не выражено местоимение «я» и не требуется превращать общее богословское утверждение в личное обещание победы.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Архаизмы сведены к общеупотребительным библейским формулам «бич» и «князь этого мира». Поскольку прямое сопоставление с греческим источником ещё не проведено, проект следует считать предварительным и основанным на указанном англоязычном свидетельстве.
