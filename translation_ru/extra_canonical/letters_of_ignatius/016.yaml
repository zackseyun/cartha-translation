base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: ru
  text: 'Лучше молчать и быть, чем говорить и не быть. Учить — прекрасное дело, если говорящий сам исполняет то, чему учит. Есть один Учитель, который сказал — и совершилось. И даже то, что Он совершил в молчании, достойно Отца.


    Кто истинно обладает словом Иисуса, тот способен внимать и Его молчанию, чтобы быть совершенным: чтобы своими словами действовать, а своим молчанием быть узнаваемым.[a]


    Ничто не сокрыто от Господа; даже наши тайны близки Ему. Поэтому будем всё делать, зная, что Он живёт в нас, чтобы нам быть Его храмами, а Ему Самому быть в нас как нашему Богу. Это действительно так и станет явным благодаря любви, которую мы по праву питаем к Нему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вторая часть фразы допускает разные оттенки: молчание может раскрывать подлинный характер человека или делать его узнаваемым по его жизни. Кто именно узнаёт его, текст не уточняет.'
    reason: Сохранить неоднозначность пассивной конструкции и не подставлять не названного субъекта.
lexical_decisions:
- source_word: to keep silence / silence
  choice: молчать / молчание
  rationale: Сохраняет ключевой повтор и противопоставление речи, бытия и дела; звучит естественно и достойно по-русски.
- source_word: to be
  choice: быть
  rationale: Сохранена намеренно резкая и смыслово открытая формулировка, без уточнения «быть истинным» или «существовать», которого нет в предоставленном свидетельстве.
- source_word: possesseth the word of Jesus
  choice: обладает словом Иисуса
  rationale: Формальная образность сохранена, поскольку речь может идти не просто о знании учения, но о внутреннем обладании им.
- source_word: hearken unto His silence
  choice: внимать и Его молчанию
  rationale: «Внимать» передаёт парадокс осмысленного слушания молчания и соответствует возвышенному, но современно понятному регистру.
- source_word: temples
  choice: храмами
  rationale: Сохранено множественное число английского свидетельства и раннехристианская храмовая метафора.
- source_word: nigh unto Him
  choice: близки Ему
  rationale: Естественный современный эквивалент без архаического «близ Него».
theological_decisions:
- issue: Кто назван «одним Учителем»
  choice: Сохранена связь с Иисусом через контекст и прописные местоимения, без добавления имени в эту фразу.
  alternative: 'Прямо написать: «Есть один Учитель — Иисус».'
  rationale: Предоставленное свидетельство не называет Учителя в данной фразе; эксплицирование сняло бы возможную литературную и богословскую напряжённость.
- issue: Смысл выражения «сказал — и совершилось»
  choice: Передано как аллюзивная формула действенного слова.
  alternative: «Который говорил и поступал согласно сказанному».
  rationale: Форма свидетельства напоминает библейскую формулу творящего слова; альтернативное нравственное истолкование не следует навязывать без проверки греческого текста.
- issue: «Быть узнаваемым» через молчание
  choice: Сохранён пассив «быть узнаваемым».
  alternative: «Быть познанным Богом» или «обнаруживать себя».
  rationale: Свидетельство не уточняет, кем человек узнаётся; перевод сохраняет эту неоднозначность.
- issue: Пребывание Господа в верующих
  choice: «Он живёт в нас… быть в нас как нашему Богу».
  alternative: Уточнить лицо как Христа, Бога или Духа.
  rationale: Референт местоимения не был конфессионально конкретизирован сверх предоставленного текста.
- issue: Последняя фраза о любви
  choice: «благодаря любви, которую мы по праву питаем к Нему».
  alternative: «по мере того, как мы правильно любим Его».
  rationale: Сохранено направление любви от людей к Господу и оценочный смысл «rightly», не определяя, в чём именно состоит правильность любви.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Синтаксис упрощён по сравнению с архаическим английским свидетельством, но сохранены афористичность, параллелизм и богословская напряжённость. Прописные местоимения в отношении Учителя/Господа использованы последовательно в рамках данного фрагмента.
