base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: ru
  text: 'Итак, вам следует действовать в согласии с мыслью епископа, что вы и делаете. Ведь ваш почтенный совет пресвитеров[a], достойный Бога, так созвучен епископу, как струны — кифаре. Поэтому в вашем единодушии и созвучной любви воспевается Иисус Христос.


    И вы все, каждый в отдельности, составьте хор, чтобы, пребывая в единодушном согласии и получив Божий тон[b], вы едиными устами пели через Иисуса Христа Отцу, чтобы Он услышал вас и по вашим добрым делам узнал, что вы — члены Его Сына. Поэтому вам полезно пребывать в безупречном единстве, чтобы всегда быть причастными к Богу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пресвитерий» — собрание пресвитеров, то есть старейшин общины.'
    reason: Поясняет древний церковный термин и его коллегиальный смысл.
  - marker: b
    text: 'Выражение продолжает музыкальный образ: буквально речь идёт о «Божьем тоне»; возможны оттенки тона, звучания или музыкального лада, задаваемого Богом.'
    reason: Сохраняет необычность и смысловой диапазон греческого выражения χωρίς догматического уточнения.
  - marker: c
    text: 'Или: «участвовать в Боге».'
    reason: Показывает буквальный и богословски насыщенный оттенок выражения, не навязывая одного истолкования.
lexical_decisions:
- source_word: run in harmony with the mind of the bishop
  choice: идти в согласии с мыслью епископа
  rationale: Сохраняет образ совместного движения и не сужает «mind» до приказа или воли; «идти» естественнее по-русски, чем буквальное «бежать», в данном увещевательном контексте.
- source_word: presbytery
  choice: совет пресвитеров
  rationale: Передаёт коллегиальный орган старейшин/пресвитеров и избегает современного значения слова «пресвитерия» как помещения или территории.
- source_word: is attuned ... like strings to a lyre
  choice: созвучен ... как струны — кифаре
  rationale: Сохраняет развернутую музыкальную метафору; «кифара» точнее для античного инструмента, чем современная лира.
- source_word: taking the key note of God
  choice: приняв тон от Бога
  rationale: Передаёт идею заданного Богом тона в музыкальном образе и сохраняет возможную двусмысленность источника, не превращая её в отвлечённое «руководство».
- source_word: members of His Son
  choice: членов Своего Сына
  rationale: Сохраняет телесно-церковную метафору «членов», не добавляя отсутствующее в тексте слово «тело».
- source_word: partakers of God
  choice: причастными Богу
  rationale: Передаёт участие в Боге без сведения выражения к получению отдельных благ.
theological_decisions:
- issue: Характер согласия с епископом
  choice: в согласии с мыслью епископа
  alternative: подчиняться воле епископа
  rationale: Текст говорит о согласованности и созвучии, а не формулирует здесь абсолютное или юридическое подчинение.
- issue: Кто узнаёт общину
  choice: Отец услышит и узнает в них членов Своего Сына
  alternative: неопределённое «Он» без явного соотнесения
  rationale: Ближайший адресат пения — Отец; прописная форма местоимения в русском тексте делает отсылку ясной, не меняя содержания.
- issue: Участие в Боге
  choice: быть причастными Богу
  alternative: разделять Божью природу
  rationale: Сохраняет сильную формулировку об участии в Боге, но не вводит позднейшую техническую терминологию и не определяет механизм такого участия.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещевания. Музыкальная цепочка образов — созвучие, струны, кифара, хор, тон, единый голос — последовательно сохранена. Поскольку в карточке указано, что прямая сверка с греческим источником ещё ожидается, решения сформулированы консервативно и с примечаниями там, где английское свидетельство отражает необычное исходное выражение.
