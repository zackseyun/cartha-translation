base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: ru
  text: 'Итак, я сделал то, что от меня зависело, как человек, стремящийся к единству. Но где разделение и гнев, там Бог не пребывает. Господь прощает всех, когда они каются, если, каясь, они возвращаются к единству Божьему и к совету епископа.[a] Я верю в благодать Иисуса Христа, Который освободит вас от всяких уз. И прошу вас:


    ничего не делайте из духа распри, но поступайте согласно учению Христа. Я слышал, как некоторые говорили: «Если я не нахожу этого в документах,[b] то не верю этому в Евангелии». Когда же я сказал им: «Написано», они ответили мне: «В том-то и вопрос». Для меня же документы — Иисус Христос; неприкосновенные документы — Его крест, Его смерть, Его воскресение и вера через Него.[c] В них я желаю быть оправданным благодаря вашей молитве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Совет епископа» передаёт греческое слово, которое может обозначать совет или собрание, связанное с епископом.
    reason: Сохраняет общественный, а не исключительно личный смысл выражения без дополнительного истолкования.
  - marker: b
    text: Греческое слово буквально означает «архивы», «записи» или «документы»; по смыслу, вероятно, речь идёт об авторитетных древних писаниях. Образ «документов» намеренно повторяется далее.
    reason: Поясняет необычный, но важный повторяющийся образ оригинала.
  - marker: c
    text: «Вера через Него» сохраняет неоднозначность исходного выражения. «В них» относится к только что названным «документам», то есть к кресту, смерти, воскресению и вере через Христа.
    reason: Сохраняет грамматическую связь и не навязывает богословского объяснения предлога «через».
lexical_decisions:
- source_word: composed unto union
  choice: преданный единству
  rationale: Передаёт устойчивую направленность автора к единству естественным современным русским языком, не усиливая образ внутренней «собранности» сверх доступного английского свидетельства.
- source_word: council of the bishop
  choice: совет епископа
  rationale: Сохраняет возможные значения совета, суждения или установления епископа и не подменяет выражение более поздним специальным церковным термином.
- source_word: charter / charters
  choice: письменное свидетельство / письменные свидетельства
  rationale: Сохраняет повторяющийся образ авторитетного письменного основания, но избегает современного узкого смысла слова «хартия»; метафорическое развитие отмечено сноской.
- source_word: factiousness
  choice: дух распри
  rationale: Передаёт не просто разногласие, а партийность и склонность к расколу, сохраняя нравственный оттенок.
- source_word: faith through Him
  choice: вера через Него
  rationale: 'Формально сохраняет неоднозначную связь предлога: вера может пониматься как возникающая или осуществляемая через Христа; перевод не заменяет её более определённой формулой.'
- source_word: wherein
  choice: в этом
  rationale: Сохраняет возможную отсылку ко всему предшествующему комплексу — Христу, кресту, смерти, воскресению и вере — без искусственного сужения.
theological_decisions:
- issue: Возвращение кающихся к единству Бога и к совету епископа
  choice: сохранена условная конструкция без пояснения механизма прощения
  alternative: представить подчинение епископу самостоятельным условием Божьего прощения
  rationale: Текст грамматически связывает покаяние с возвращением к единству и епископскому совету, однако не определяет систематически их причинное отношение; перевод сохраняет напряжение.
- issue: «Моё письменное свидетельство — Иисус Христос»
  choice: сохранено личностное отождествление Христа с высшим свидетельством
  alternative: перевести как утверждение, что только Писание о Христе является основанием
  rationale: Автор противопоставляет спору о документах Самого Христа и события Его креста, смерти и воскресения; конфессиональное уточнение источника авторитета было бы привнесением.
- issue: Оправдание и молитвы адресатов
  choice: «желаю быть оправданным по вашим молитвам»
  alternative: «надеюсь получить оправдание благодаря вашим молитвам»
  rationale: Более сдержанная формулировка сохраняет связь оправдания с молитвами общины, не превращая её в детально разработанное учение о заслуге или причинности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис умеренно торжественный, но без архаизмов вроде «ибо», «дабы» и «оный». Кавычки и абзацное членение помогают ясно передать спорную реплику. Черновик основан на предоставленном публичнодоступном английском свидетельстве среднерецензионной греческой традиции; поэтому места, требующие прямой проверки греческой лексики, переведены осторожно и снабжены примечаниями.
