  terminology: «Единство Божье» и «совет епископа» сохранены без конфессионального истолкования. «Оправданным» корректно удерживает δικαιωθῆναι. Формула «вера через Него» воспроизводит выражение ἡ πίστις ἡ δι’ αὐτοῦ без догматического уточнения.
