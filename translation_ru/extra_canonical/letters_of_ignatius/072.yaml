  verdict: revise
  source_fidelity: Нужна правка. Черновик в целом точно передаёт ход мысли, однако греч. ἀρχεῖα («архивы», «документы», в данном контексте — авторитетные древние записи/писания) последовательно стоит во множественном числе и образует намеренно повторяемый образ. Замена на одиночное «письменное свидетельство» заметно сглаживает этот образ и меняет число. «Совет епископа» допустим для συνέδριον τοῦ ἐπισκόπου; это не следует сводить только к личному суждению епископа. «По вашим молитвам» лучше передать как «благодаря вашей молитве», поскольку в греческом стоит единственное число, вероятно собирательно об обращении общины.
