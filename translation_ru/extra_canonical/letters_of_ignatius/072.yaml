    rationale: Для данного текста συνέδριον прежде всего означает совет, собрание или коллегию; такое примечание не требуется и способно сузить либо исказить церковно-общественный смысл.
  - severity: low
    issue: «По вашим молитвам» не передаёт единственное число εὐχῆς.
    rationale: Собирательное «благодаря вашей молитве» точнее, сохраняя обращение ко всей общине.
