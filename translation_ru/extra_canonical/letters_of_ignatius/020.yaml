    rationale: Греческое ὁ τοκετὸς αὐτῆς обозначает деторождение Марии. Формулировка «рождение ею Ребёнка» вводит объект, которого в данном выражении нет, и меняет образный ряд трёх тайн.
  - severity: medium
    issue: «Ярче всех звёзд» преждевременно толкует ὑπέρ как сравнение света
    rationale: В первой фразе звезда сияет «выше всех звёзд»; затем текст отдельно говорит, что она превосходила их сиянием. Следует сохранить оба образа.
  - severity: medium
    issue: Не сохранен явный субъект заключительного деепричастного оборота
    rationale: В греческом сказано, что всё было приведено в движение, когда/поскольку Бог упразднял смерть. Без упоминания Бога фраза становится менее определённой, чем источник.
  - severity: low
