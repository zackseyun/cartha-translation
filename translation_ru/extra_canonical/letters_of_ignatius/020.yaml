  source_fidelity: Требуется несколько точечных исправлений по греческому тексту. τοκετός означает «деторождение/рождение», а не самого ребёнка; ὑπὲρ πάντας τοὺς ἀστέρας в первом описании звезды следует передать как «выше всех звёзд», не предвосхищая последующее сравнение сияния. В заключительном обороте прямо назван Бог как действующий субъект упразднения смерти (θεοῦ θάνατον καταργοῦντος), что необходимо сохранить.
  naturalness: В целом русский текст литературный и выразительный. «Рождение ею Ребёнка» звучит тяжеловесно и добавляет отсутствующий в оригинале предмет. «Необычное знамение» сужает нейтральное «явление/зрелище» до религиозного знака. Исправленный текст сохраняет возвышенный регистр, но читабелен по-современному.
  terminology: '«Князь этого мира», «девство», «Божье безмолвие», «хор», «древнее царство» и «упразднение смерти» приемлемы. Для δεσμός предпочтительнее «узы», а не «чары»: это позволяет не сливать «магию» и «узы/оковы» в два почти синонимичных обозначения колдовства.'
