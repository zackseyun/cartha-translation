base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: ru
  text: 'От князя этого мира были сокрыты девство Марии, её деторождение и также смерть Господа — три тайны, которые надлежит громко возгласить, совершившиеся в Божьем безмолвии. Как же они были явлены векам?


    На небе, выше всех звёзд, засияла звезда. Свет её был невыразим, и необычность её вызывала изумление. Все остальные созвездия вместе с солнцем и луной образовали вокруг звезды хор, но сама звезда намного превосходила сиянием их всех. Все недоумевали, откуда явилось это необычное явление, столь непохожее на них.


    С того времени всякое чародейство и всякие узы исчезали, неведение зла разрушалось, древнее царство гибло, когда Бог явился в человеческом облике — к обновлению вечной жизни.[a] И то, что было доведено до совершенства в Божьем замысле, начало осуществляться. Оттого всё пришло в движение, ибо Бог начал упразднять смерть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в новизну вечной жизни». Связь этого выражения с явлением Бога синтаксически допускает разные оттенки: цель, результат или вступление в новую действительность вечной жизни.'
    reason: Сохраняет отмеченную в греческой конструкции неоднозначность, не выдавая один синтаксический разбор за единственно возможный.
