  rationale: Передаёт сильное значение лишения смерти силы и действия, близко к формулировке источника.
theological_decisions:
- issue: Кто назван «князем этого мира»
  choice: Оставить титул без поясняющей идентификации
  alternative: Перевести или пояснить как «сатана»
  rationale: Источник использует титул и допускает читателю распознать его по контексту; явное именование сняло бы риторическую и традиционную форму.
- issue: Богоявление в человеческом облике
  choice: «Бог явился в человеческом облике»
  alternative: «Бог стал человеком»
  rationale: Сохраняется формулировка явления и подобия/облика без усиления или ослабления её христологического содержания.
- issue: Связь явления Бога с обновлением вечной жизни
  choice: «ради обновления вечной жизни» с примечанием
  alternative: «в новизну вечной жизни» или «к новой вечной жизни»
  rationale: Греческая конструкция допускает более одного синтаксического оттенка; основной текст сделан читаемым, а неоднозначность отмечена.
- issue: Начало упразднения смерти
  choice: «началось упразднение смерти»
  alternative: «было предпринято упразднение смерти»
  rationale: Передаёт начало действенного процесса и эсхатологическое напряжение, не утверждая, что он уже полностью завершён.
