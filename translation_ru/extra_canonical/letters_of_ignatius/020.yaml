- from: 'От князя этого мира были сокрыты девство Марии, рождение ею Ребёнка, а также смерть Господа — три тайны, о которых надлежит громко возвестить, совершённые в Божьем безмолвии. Как же они были явлены векам?


    На небе засияла звезда ярче всех звёзд. Свет её был невыразим, и необычность её вызывала изумление. Все остальные созвездия вместе с солнцем и луной образовали вокруг неё хор, но сама звезда намного превосходила сиянием их всех. Все недоумевали, откуда явилось это необычное знамение, столь непохожее на остальные.


