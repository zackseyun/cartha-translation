base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: ru
  text: 'Итак, как Господь ничего не делал без Отца, [будучи соединён с Ним][a], — ни Сам, ни через апостолов, — так и вы ничего не делайте без епископа и пресвитеров. Не пытайтесь также по отдельности считать что-либо правильным; напротив, пусть у вас будут одна общая молитва, одно моление, одна мысль, одна надежда — в любви и в безупречной радости, которая есть Иисус Христос: нет ничего лучше Него.


    Все спешите собираться вместе, словно в один храм — к Богу; словно к одному жертвеннику — к одному Иисусу Христу, Который вышел от Единого Отца, пребывал с Единым и возвратился к Единому.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «будучи соединён с Ним» в использованном английском свидетельстве заключены в квадратные скобки как восстановленный или текстуально неуверенный элемент; прямая сверка с греческой рукописной традицией ещё требуется.
    reason: Сохранить обозначенную свидетелем текстологическую неуверенность.
  - marker: b
    text: 'Буквальная трёхчастная формула свидетельства: «вышел от Единого Отца, был/пребывал с Единым и отошёл к Единому». Перевод «возвратился» передаёт предполагаемое направление мысли, но нуждается в проверке по греческому тексту.'
    reason: Отметить неоднозначность последней фразы при отсутствии завершённой прямой проверки исходного языка.
lexical_decisions:
- source_word: bishop (Greek ἐπίσκοπος in the underlying tradition)
  choice: епископ
  rationale: Устоявшийся и исторически точный русский эквивалент названия служения.
- source_word: presbyters (Greek πρεσβύτεροι)
  choice: пресвитеры
  rationale: Сохраняет термин раннехристианского текста, не подменяя его позднейшим конфессионально окрашенным обозначением.
- source_word: one mind
  choice: одна мысль
  rationale: Передаёт единство внутреннего устремления без более сильного толкования как полного единомыслия во всех вопросах.
- source_word: altar (Greek θυσιαστήριον)
  choice: жертвенник
  rationale: Отражает культовый образ исходного термина и параллель с храмом.
- source_word: came forth … is with … departed unto
  choice: вышел … пребывал с … возвратился к
  rationale: Сохраняет направленность трёхчастной формулы и делает её понятной по-русски; окончательное уточнение требует прямой сверки с греческим текстом.
theological_decisions:
- issue: Отношение Господа к Отцу
  choice: «без Отца, [будучи соединён с Ним]»
  alternative: «независимо от Отца, пребывая в единстве с Ним»
  rationale: Сохранена формулировка свидетельства и его редакционный сигнал, без догматического расширения значения единства.
- issue: Соотнесение «безупречной радости» с Иисусом Христом
  choice: «безупречной радости, которая есть Иисус Христос»
  alternative: «в безупречной радости — в Иисусе Христе»
  rationale: Сохранено прямое отождествление, присутствующее в свидетельстве, хотя синтаксическая связь допускает более интерпретирующую передачу.
- issue: Формула «от Единого … с Единым … к Единому»
  choice: сохранена повторяемость «Единого»
  alternative: во всех трёх случаях прямо повторить «Отца»
  rationale: Не устраняется риторическая и богословская напряжённость исходной формулы и не добавляется референт там, где свидетельство оставляет его подразумеваемым.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены повелительный тон, параллелизм «одна… одно… одна… одна…» и образность храма и жертвенника. Проект остаётся предварительным, поскольку предоставленная база — публичное английское свидетельство, а прямая проверка греческого текста обозначена как ожидающая выполнения.
