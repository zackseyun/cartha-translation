review_pass:
  verdict: revise
  source_fidelity: Нужны правки. В заключительной трёхчастной формуле черновик меняет настоящее «is with One» на прошедшее «пребывал» и добавляет невыраженный смысл возврата в «возвратился». Следует сохранить настоящее время и нейтральное «отошёл к Единому». Связь «который есть Иисус Христос» с ближайшим словом «радость» в русском создаёт ложное, чрезмерно узкое отождествление; в оригинальной формуле указательное среднее относительное выражение естественнее передать как отсылку ко всему предшествующему комплексу.
  naturalness: «По отдельности считать что-либо правильным» и «Все спешите собираться вместе» звучат тяжеловесно. Более естественны «сами, отдельно от других, считать что-либо правильным» и «Поспешите все собраться». «Единый образ мыслей» точнее и идиоматичнее, чем «одна мысль», для призыва к общности νοῦς.
  terminology: «Епископ», «пресвитеры» и «жертвенник» сохранены верно. «Моление» допустимо в возвышенном раннехристианском регистре и удачно отличает δέησις от «молитвы». Субстантивированное «Единый» оставлено без догматического раскрытия, как в свидетельстве.
  issues:
  - severity: high
    issue: «пребывал с Единым и возвратился к Единому»
    rationale: Свидетельство имеет настоящее «is with One» и «departed unto One». Прошедшее «пребывал» и особенно «возвратился» вносят изменения времени и смысла.
  - severity: medium
    issue: «радости, которая есть Иисус Христос»
    rationale: Русское относительное предложение грамматически отождествляет именно радость с Иисусом Христом. Формула источника допускает отсылку ко всему предшествующему выражению; это нужно сохранить.
  - severity: medium
    issue: «одна мысль»
    rationale: Для «one mind» это может означать одну отдельную мысль, а не единство настроя или образа мыслей.
  - severity: low
    issue: Неестественная формулировка призыва к собранию
    rationale: «Все спешите собираться вместе» менее гладко передаёт повелительный призыв, чем «Поспешите все собраться».
  revised_text: 'Итак, как Господь ничего не делал без Отца, [будучи соединён с Ним][a], — ни Сам, ни через апостолов, — так и вы ничего не делайте без епископа и пресвитеров. И не пытайтесь сами, отдельно от других, считать что-либо правильным; напротив, пусть у вас будет одна общая молитва, одно моление, единый образ мыслей, одна надежда — в любви, в непорочной радости; и это есть Иисус Христос, лучше Которого нет ничего.


    Поспешите все собраться, словно к единому храму — к Богу, словно к единому жертвеннику — к единому Иисусу Христу, Который вышел от Единого Отца, пребывает с Единым и отошёл к Единому.[b]'
  revised_footnotes:
  - marker: a
    text: Слова «будучи соединён с Ним» в использованном английском свидетельстве заключены в квадратные скобки как восстановленный или текстуально неуверенный элемент; прямая сверка с греческой рукописной традицией ещё требуется.
    reason: Сохранить обозначенный свидетельством редакционный сигнал.
  - marker: b
    text: 'Формула свидетельства буквально сохраняет триаду: «вышел от Единого Отца, пребывает с Единым и отошёл к Единому». Слово «Единый» во втором и третьем членах намеренно не раскрывается переводом, а «отошёл» не добавляет значения возвращения.'
    reason: Сохранить риторическую и референциальную неясность формулы, не внося невыраженный смысл.
  revision_rationale: Исправлены изменения времени и направления в заключительной формуле, устранено русское синтаксическое сужение отсылки «что есть Иисус Христос», а также сглажены две неестественные конструкции. Скобочный текстологический сигнал и его привязка сохранены; примечание b уточнено так, чтобы не добавлять «возвращение» и не назначать референт «Единого» там, где он не назван.
