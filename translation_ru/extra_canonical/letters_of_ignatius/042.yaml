  verdict: revise
  source_fidelity: Требуется существенная правка в двух местах по греческому тексту средней редакции. σύνδεσμος ἀποστόλων означает «союз/связь апостолов», а не «собрание апостолов». В заключении стоит κατάκριτος («осуждённый», буквально человек под приговором), не δεσμώτης («узник»). Формула χωρὶς τούτων ἐκκλησία οὐ καλεῖται точнее передаётся как «без них церковь даже не называется церковью».
  naturalness: Перевод в целом литературный и ясный. В исправленном тексте сохранён современный достойный регистр. «Отдавать вам распоряжения» естественно передаёт сильный глагол διατάσσω, не превращая его в позднейший технический термин.
  terminology: '«Диаконы», «епископ», «пресвитеры» и «образ Отца» сохранены. «Совет Божий и союз апостолов» воспроизводит два образа оригинала без конфессионального истолкования. «Осуждённый» не следует заменять на «узника»: это иное греческое слово и иной смысловой акцент.'
  issues:
  - severity: high
    issue: «Собрание апостолов» вместо «союза апостолов»
    rationale: В греческом тексте стоит σύνδεσμον ἀποστόλων — «союз», «связь», «узел единства» апостолов; «собрание» передаёт иной образ и, вероятно, следует неточности английского witness («college»).
  - severity: high
    issue: «Узнику» и примечание о δεσμώτης
    rationale: В данном месте греческая традиция читает κατάκριτος, то есть «осуждённый/приговорённый», а не δεσμώτης. Существующее примечание утверждает неверную греческую основу и должно быть заменено.
  - severity: medium
    issue: Перефразировка выражения о церкви
    rationale: '«Нет даже того, что можно было бы назвать церковью» передаёт общий эффект, но χωρὶς τούτων ἐκκλησία οὐ καλεῖται буквально и риторически говорит: «без них церковь даже не называется церковью».'
  - severity: low
    issue: «В его защиту»
    rationale: Оригинал позволяет сказать «об этом/об этом деле»; «в его защиту» добавляет судебно-апологетический оттенок, не выраженный прямо.
