revisions:
- from: 'Подобным образом пусть все почитают диаконов как Иисуса Христа, а епископа — как образ Отца, пресвитеров же — как совет Божий и собрание апостолов. Без них нет даже того, что можно было бы назвать церковью.[a]


    Я убеждён, что именно так вы об этом и думаете, ведь образец вашей любви я принял и имею при себе в лице вашего епископа. Само его поведение — великий урок, а его кротость — сила. Думаю, что даже безбожники относятся к нему с почтением.


    Из любви к вам я щажу вас и потому не пишу резче в его защиту, хотя мог бы. Но я не счёл себя вправе делать это: мне, узнику,[b] не подобает распоряжаться вами так, словно я апостол.'
