base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: ru
  text: 'Подобным образом пусть все почитают диаконов, как Иисуса Христа, а епископа — как образ Отца, пресвитеров же — как совет Божий и союз апостолов. Без них церковь даже не называется церковью.


    Я убеждён, что вы так и мыслите об этом, ведь я получил свидетельство вашей любви и имею его при себе — в лице вашего епископа. Сам его облик — великий урок, а его кротость — сила. Думаю, что даже безбожники относятся к нему с почтением.


    Поскольку я люблю вас, я щажу вас, хотя мог бы написать об этом более резко. Но я не счёл себя достойным этого: осуждённому,[a] отдавать вам распоряжения так, словно я апостол.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приговорённому». Греч. κατάκριτος обозначает человека, над которым вынесен приговор; слово не уточняет характер обвинения.'
    reason: Передаёт значение греческого слова и не подменяет его «узником» или современным юридическим обозначением преступника.
lexical_decisions:
- source_word: respect / τιμάτωσαν (вероятная греческая основа)
  choice: почитают
  rationale: Передаёт не просто вежливое уважение, а признание достоинства служения; при этом не предполагает поклонения.
- source_word: type / τύπον (вероятная греческая основа)
  choice: образ
  rationale: Сохраняет репрезентативный смысл и звучит естественно по-русски, не вводя специального типологического толкования.
- source_word: council of God
  choice: совет Божий
  rationale: Сохраняет образ совещательного собрания и параллелизм с собранием апостолов.
- source_word: college/assembly of Apostles
  choice: собрание апостолов
  rationale: Современное и понятное обозначение объединённого круга апостолов без позднейших институциональных ассоциаций слова «коллегия».
- source_word: demeanor
  choice: поведение
  rationale: Естественно передаёт наблюдаемый образ жизни и манеру держаться.
- source_word: convict / δεσμώτης (вероятная греческая основа)
  choice: узник
  rationale: В контексте Игнатия речь идёт о человеке в узах, а не обязательно об осуждённом преступнике в современном юридическом смысле.
theological_decisions:
- issue: Сопоставление диаконов с Иисусом Христом
  choice: «почитают диаконов как Иисуса Христа»
  alternative: «почитают диаконов, как почитают Иисуса Христа»
  rationale: Сохранена напряжённая и сильная формулировка свидетеля без поясняющего смягчения; «почитать» не тождественно «поклоняться».
- issue: Епископ как образ Отца
  choice: «как образ Отца»
  alternative: «как представляющего Отца»
  rationale: «Образ» сохраняет метафорическую открытость и не сводит выражение к административному представительству.
- issue: Утверждение о церкви без служителей
  choice: «Без них нет даже того, что можно было бы назвать церковью»
  alternative: «Без них нет даже имени церкви»
  rationale: Передаёт идиоматический смысл английского свидетеля понятным русским языком, сохраняя категоричность высказывания и не расширяя его до позднейшей экклезиологической формулы.
- issue: Апостольский авторитет Игнатия
  choice: «словно я апостол»
  alternative: «как апостол»
  rationale: 'Сохраняет авторское самоограничение: Игнатий явно не присваивает себе право распоряжаться адресатами с апостольской властью.'
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис умеренно торжественный, но без архаизмов «да почитают», «ибо», «сей». Проект основан на предоставленном публично-доступном английском свидетеле и консультационном английском POB; прямая сверка с греческим текстом средней редакции остаётся необходимой.
