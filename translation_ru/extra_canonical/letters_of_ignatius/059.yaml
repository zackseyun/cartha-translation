base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: ru
  text: 'Ни самые дальние пределы вселенной, ни царства этого мира не принесут мне никакой пользы. Для меня лучше умереть за Иисуса Христа, чем царствовать над краями земли. Я ищу Того, Кто умер за нас; желаю Того, Кто воскрес [ради нас].[a]


    Муки нового рождения уже охватили меня. Потерпите меня, братья. Не мешайте мне жить; не желайте мне смерти. Не отдавайте миру того, кто желает принадлежать Богу, и не прельщайте его вещественным. Позвольте мне принять чистый свет. Когда я достигну его, тогда стану человеком.


    Позвольте мне подражать страданиям моего Бога. Если кто носит Его в себе, пусть поймёт, чего я желаю, и сострадает мне, ведь он знает, что меня томит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «ради нас» переданы в квадратных скобках вслед за доступным английским свидетельством; прямая сверка со среднегреческой рукописной традицией ещё требуется.
    reason: Необходимо явно сохранить отмеченную в базе перевода текстовую неуверенность и честно указать на отсутствие завершённой проверки по греческому тексту.
lexical_decisions:
- source_word: The farthest bounds of the universe
  choice: самые дальние пределы вселенной
  rationale: Сохраняет космический масштаб и возвышенный тон свидетельства без архаической тяжеловесности.
- source_word: to die for Jesus Christ
  choice: умереть за Иисуса Христа
  rationale: Предлог «за» сохраняет возможные оттенки смерти ради Христа и вследствие верности Ему, не сужая выражение до одной интерпретации.
- source_word: the pangs of a new birth
  choice: муки нового рождения
  rationale: Сохраняет образ родовых мук и перехода к новой жизни, не заменяя его объяснительным пересказом.
- source_word: material things
  choice: вещественным
  rationale: Передаёт противопоставление Богу и чистому свету без современного узкоэкономического оттенка слова «материальное».
- source_word: the pure light
  choice: чистый свет
  rationale: Буквально сохраняет значимый образ, не отождествляя его в тексте с конкретным богословским понятием.
- source_word: the passion of my God
  choice: страданиям моего Бога
  rationale: В современном русском «страсти» двусмысленны; «страдания» ясно передаёт здесь претерпевание и смерть Христа.
- source_word: the things which straiten me
  choice: что меня томит
  rationale: Передаёт внутреннюю стеснённость и мучительное давление естественным литературным русским языком, сохраняя некоторую неопределённость образа.
theological_decisions:
- issue: Добавление «for our sake» после упоминания воскресения
  choice: 'сохранено в квадратных скобках: «[ради нас]»'
  alternative: опустить слова либо включить их без скобок
  rationale: Скобки в предоставленном свидетельстве указывают на текстологическую или редакционную неуверенность; её нельзя скрывать.
- issue: Парадокс «не мешайте мне жить; не желайте мне смерти» перед лицом мученичества
  choice: сохранён буквально
  alternative: объяснить «жизнь» как вечную жизнь, а «смерть» как духовную смерть
  rationale: Авторская богословская напряжённость намеренна; явное толкование неоправданно устранило бы многозначность.
- issue: «Тогда стану человеком»
  choice: сохранено без поясняющего дополнения
  alternative: «тогда достигну полноты человечности»
  rationale: Краткая парадоксальная формула допускает богословскую глубину и не должна сводиться к одному толкованию.
- issue: «страдания моего Бога»
  choice: сохранено прямое исповедальное выражение
  alternative: «страдания Христа»
  rationale: Замена устранила бы сильную христологическую формулировку исходного свидетельства.
- issue: «Если кто носит Его в себе»
  choice: местоимение «Его» сохранено без уточнения референта
  alternative: «если кто носит в себе Христа»
  rationale: Так сохраняется референциальная связность и некоторая неоднозначность свидетельства.
translation_notes:
  register: Современный литературный русский язык с dignified церковно-эпистолярным тоном; избегаются как славянизированная архаика, так и разговорная упрощённость. Поскольку предоставленный original_language_source фактически является английским публичнодоменным свидетельством и проверка по греческой традиции ожидается, формулировки остаются осторожными и не претендуют на окончательное восстановление греческих нюансов.
