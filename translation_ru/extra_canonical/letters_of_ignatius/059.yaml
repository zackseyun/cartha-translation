review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: отказ от земной власти ради Христа, образ нового рождения, просьба не препятствовать мученическому пути и парадокс «тогда стану человеком» сохранены. Однако в двух местах ослаблены значимые соответствия: «над краями земли» не передаёт «над самыми дальними пределами земли», а «достигну его» ошибочно связывает приход с «чистым светом», тогда как свидетельство говорит «приду туда». Сигнал текстовой неопределённости в «[ради нас]» следует сохранить.'
  naturalness: Тон в целом современный и достойный, но «Потерпите меня» и особенно «не прельщайте его вещественным» звучат неестественно либо семантически неполно. «Будьте терпеливы со мной» и «не соблазняйте его материальными вещами» яснее и литературнее. «Что меня томит» допустимо, но «что меня теснит» ближе к образу стеснения/давления и сохраняет его неопределённость.
  terminology: «быть Божьим» точнее отражает формулу «to be God’s», чем более объяснительное «принадлежать Богу». «Страданиям моего Бога» корректно передаёт исповедальную формулу и избегает современного двусмысленного значения слова «страсти».
  issues:
  - severity: medium
    issue: «царствовать над краями земли»
    rationale: В исходном свидетельстве повторяется мотив самых отдалённых пределов; «края земли» шире и не сохраняет усиление «farthest».
  - severity: medium
    issue: «Когда я достигну его»
    rationale: «Thither» относится к месту/состоянию, куда автор должен прийти, а не прямо к слову «свет»; русское местоимение создаёт неоправданную привязку к свету.
  - severity: medium
    issue: «не прельщайте его вещественным»
    rationale: Формулировка неестественна для современного литературного русского и не называет объект искушения — материальные вещи.
  - severity: low
    issue: «Потерпите меня»
    rationale: В современном русском это может звучать как просьба просто вытерпеть неприятного человека; исходная просьба означает проявить терпение и снисхождение.
  - severity: low
    issue: «желаeт принадлежать Богу»
    rationale: Смысл понятен, но «желает быть Божьим» ближе к краткой и сильной формуле свидетельства.
  revised_text: 'Ни самые дальние пределы вселенной, ни царства этого мира не принесут мне никакой пользы. Для меня лучше умереть за Иисуса Христа, чем царствовать над самыми дальними пределами земли. Я ищу Того, Кто умер за нас; желаю Того, Кто воскрес [ради нас].[a]



    Меня охватили муки нового рождения. Будьте терпеливы со мной, братья. Не мешайте мне жить; не желайте мне смерти. Не отдавайте миру того, кто желает быть Божьим, и не соблазняйте его материальными вещами. Позвольте мне принять чистый свет. Когда я приду туда, тогда стану человеком.



    Позвольте мне подражать страданиям моего Бога. Если кто носит Его в себе, пусть поймёт, чего я желаю, и сострадает мне, ведь он знает, что меня теснит.'
  revised_footnotes:
  - marker: a
    text: Слова «ради нас» переданы в квадратных скобках вслед за доступным английским свидетельством; прямая сверка со среднерецензионной греческой рукописной традицией ещё требуется.
    reason: Сохраняет отмеченную в предоставленном свидетельстве текстовую неуверенность и не представляет чтение как окончательно установленное до проверки по греческой традиции.
  revision_rationale: Правка устраняет неточные или неестественные русские соответствия, не меняя смысла и не истолковывая авторские парадоксы. Повтор «самые дальние пределы» восстановлен; «туда» сохраняет дейктическую неопределённость оригинала; выражения о принадлежности Богу, материальных вещах и внутреннем стеснении сделаны точнее. Скобочное «[ради нас]» и сноска сохранены.
