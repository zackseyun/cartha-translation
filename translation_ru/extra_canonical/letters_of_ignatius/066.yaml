base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: ru
  text: 'Итак, как дети [света][a] истины, избегайте разделений и ложных учений. Где пастырь, туда и вы следуйте, как овцы.


    Ведь многие волки, внушающие доверие, пагубными удовольствиями уводят в плен тех, кто бежит Божьим путём[b]. Но там, где вы едины, им не найдётся места.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «света» в предоставленном английском свидетельстве заключены в квадратные скобки; их текстологический статус требует прямой сверки с греческой рукописной традицией.
    reason: Сохранить отмеченную в исходных данных текстологическую неопределённость.
  - marker: b
    text: Буквально образ относится к «бегущим Божий бег» или «бегущим ради Бога»; речь идёт о продолжающемся пути верности Богу.
    reason: Пояснить необычную метафору состязательного бега, не закрепляя единственно возможный оттенок.
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: дети [света] истины
  rationale: Сохранена необычная цепочка определений и квадратные скобки, имеющиеся в предоставленном свидетельстве; возможная неоднозначность не сглажена.
- source_word: division
  choice: разделения
  rationale: Передаёт как раскол общины, так и более общее нарушение единства, не сужая смысл до специального церковного термина.
- source_word: wrong doctrines
  choice: ложные учения
  rationale: Естественное современное соответствие, сохраняющее нравственно-богословскую отрицательную оценку.
- source_word: specious wolves
  choice: волки, внушающие доверие
  rationale: Передаёт опасную внешнюю убедительность и обманчивую благонадёжность, а не физическую привлекательность.
- source_word: baneful delights
  choice: пагубными удовольствиями
  rationale: Сохраняет сочетание привлекательности удовольствия с его разрушительным действием.
- source_word: the runners in God's race
  choice: тех, кто бежит Божьим путём
  rationale: Сохраняет образ бега и направленность к Богу, избегая тяжеловесного буквального выражения «бегуны Божьего бега».
- source_word: where ye are at one
  choice: там, где вы едины
  rationale: Ясно выражает единство адресатов без уточнения его институциональной или конфессиональной формы.
theological_decisions:
- issue: Связь пастыря и овец
  choice: Где пастырь, туда и вы следуйте, как овцы
  alternative: Где пастырь, там следуйте за ним, как овцы
  rationale: Выбранный вариант сохраняет пространственную параллель «где… туда» и призыв держаться направления пастыря, не добавляя толкования его личности.
- issue: Характер единства как защиты
  choice: там, где вы едины, им не найдётся места
  alternative: в вашем единстве у них не будет места
  rationale: Сохранено утверждение о защитной силе единства, но не определено, является ли это единство прежде всего духовным, евхаристическим или организационным.
translation_notes:
  register: 'Современный литературный русский язык с кратким увещательным ритмом и сохранением образов пастыря, овец, волков, плена и бега. Перевод предварительный: он основан на предоставленном общедоступном английском свидетельстве; прямая проверка по греческому тексту средней редакции ещё требуется.'
