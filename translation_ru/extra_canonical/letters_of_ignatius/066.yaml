review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В греческом тексте употреблены единственные числа: «разделение» (τὸν μερισμόν) и «ложное учение» (κακοδιδασκαλίαν). Кроме того, θεοδρόμους сохраняет образ бега; «бежать Божьим путём» заменяет этот образ метафорой пути. Заключительная фраза точнее передаётся как «в вашем единстве», в соответствии с ἐν τῇ ἑνότητι ὑμῶν.'
  naturalness: 'Фраза «Где пастырь, туда и вы следуйте» синтаксически неудачна: при «где» требуется «там». Исправленный текст остаётся современным литературным русским, сохраняя краткий увещательный ритм. Необычное «бегут Божий бег» намеренно оставлено в тексте как близкое воспроизведение образа и пояснено сноской.'
  terminology: «Пастырь», «овцы», «волки», «плен» и «единство» переданы последовательно и без конфессионально-специфических уточнений. «Губительные удовольствия» передаёт κακαῖς ἡδοναῖς и английское baneful delights; «волки, внушающие доверие» удачно сохраняет обманчивую достоверность ἀξιόπιστοι.
  issues:
  - severity: medium
    issue: Утрачен образ бега в выражении «тех, кто бежит Божьим путём».
    rationale: Источник говорит о θεοδρόμους, а английское свидетельство — о «runners in God’s race». «Путь» заменяет состязательный бег иной метафорой.
  - severity: medium
    issue: Изменены числа у «разделения/ложного учения».
    rationale: Греческий текст имеет τὸν μερισμόν и κακοδιδασκαλίαν в единственном числе. Следует не расширять их до множественных «разделений и ложных учений».
  - severity: low
    issue: Синтаксически неудачно «Где пастырь, туда и вы следуйте».
    rationale: 'Нормативная русская корреляция: «где …, там …».'
  - severity: low
    issue: «Там, где вы едины» несколько ослабляет конкретное «в вашем единстве».
    rationale: ἐν τῇ ἑνότητι ὑμῶν прямо называет единство адресатов; более буквальная формулировка сохраняет это без богословской конкретизации.
  revised_text: 'Итак, как дети [света][a] истины, избегайте разделения и ложного учения. Где пастырь, там и следуйте за ним, как овцы.


    Ведь многие волки, внушающие доверие, губительными удовольствиями уводят в плен тех, кто бежит Божий бег[b]. Но в вашем единстве им не найдётся места.'
  revised_footnotes:
  - marker: a
    text: Слово «света» в предоставленном английском свидетельстве заключено в квадратные скобки; его текстологический статус требует прямой сверки с греческой рукописной традицией.
    reason: Сохранить отмеченную в исходных данных текстологическую неопределённость.
  - marker: b
    text: Греческое слово буквально обозначает «бегущих Бога» или «бегущих Божий бег»; это образ верных, устремлённых к Богу. Возможный точный оттенок составного слова требует сверки с греческим контекстом и критическим текстом.
    reason: Сохранить образ бега и не закреплять спорный оттенок составного греческого выражения.
  revision_rationale: Правка восстанавливает единственные числа исходного текста, образ бега в θεοδρόμους, конструкцию «где … там» и прямую связь заключительной фразы с «вашим единством». Сноска b переработана, чтобы объяснять необычное выражение, а не оправдывать замену образа бега «путём».
