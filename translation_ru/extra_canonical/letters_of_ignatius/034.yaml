base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: ru
  text: Говорю это, мои горячо любимые, не потому, что узнал, будто кто-то из вас так думает. Но, будучи меньше любого из вас, я хочу, чтобы вы заблаговременно были настороже и не попались в сети пустого учения. Напротив, будьте твёрдо убеждены в том, что касается рождения, страдания и воскресения, которые произошли во время правления Понтия Пилата. Ибо всё это истинно и несомненно совершил Иисус Христос, наша надежда. Да не случится никому из вас уклониться от этой надежды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: my dearly beloved
  choice: мои горячо любимые
  rationale: Передаёт сердечное обращение в естественном и достойном современном русском языке.
- source_word: being less than any of you
  choice: будучи меньше любого из вас
  rationale: Сохранена необычная сравнительная формулировка свидетеля без истолкования её как указания на возраст, положение или достоинство.
- source_word: betimes
  choice: заблаговременно
  rationale: Передаёт призыв принять меры заранее, пока опасность ещё можно предотвратить.
- source_word: vain doctrine
  choice: пустого учения
  rationale: «Пустое» передаёт бесплодность и несостоятельность учения, не добавляя более узкой богословской оценки.
- source_word: passion
  choice: страдания
  rationale: В данном христологическом ряду обозначает страдания Христа; современному читателю форма множественного числа яснее традиционного термина «страсть».
- source_word: our hope
  choice: наша надежда
  rationale: Сохранено прямое именование Иисуса Христа надеждой общины.
theological_decisions:
- issue: Историческая реальность рождения, страдания и воскресения
  choice: всё это истинно и несомненно совершил Иисус Христос
  alternative: всё это истинно и несомненно произошло с Иисусом Христом
  rationale: Выбранная формулировка следует представленному английскому свидетелю «were ... done by Jesus Christ», сохраняя деятельную роль Христа; при этом она не устраняет некоторую неловкость применительно к рождению.
- issue: Связь упомянутых событий со временем Понтия Пилата
  choice: которые произошли во время правления Понтия Пилата
  alternative: всё это произошло во время правления Понтия Пилата
  rationale: Сохранена грамматическая связь свидетеля со всем рядом событий, хотя исторически указание на Пилата естественнее всего относится к страданию и воскресению; неоднозначность не исправлена молча.
- issue: Отпадение от надежды
  choice: уклониться от этой надежды
  alternative: отвратиться от неё
  rationale: Формулировка передаёт удаление от исповедуемой надежды, не уточняя, идёт ли речь о вероучительном заблуждении, нравственном отпадении или обоих.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского увещания. Перевод сознательно предварительный: в предоставленных данных отсутствует греческий текст и указано, что его прямая проверка ещё не проведена; поэтому решения основаны на публичном английском свидетеле с консультацией English POB. Архаизмы сведены к минимуму, кроме уместной увещательной формулы «Да не случится».'
