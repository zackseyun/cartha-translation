source:
  text: Now these things I say, my dearly beloved, not because I have learned that any of you are so minded; but as being less than any of you, I would have you be on your guard betimes, that ye fall not into the snares of vain doctrine; but be ye fully persuaded concerning the birth and the passion and the resurrection, which took place in the time of the governorship of Pontius Pilate; for these things were truly and certainly done by Jesus Christ our hope; from which hope may it not befall any of you to be turned aside.
