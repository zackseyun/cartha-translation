  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: ru
  text: 'Итак, поскольку в упомянутых выше лицах я в вере увидел и полюбил всю вашу общину, прошу вас: ревностно старайтесь всё делать в Божьем согласии, когда епископ занимает место Бога, пресвитеры — место совета апостолов, а диаконам, особенно дорогим мне, вверено служение Иисуса Христа, Который был у Отца прежде веков и явился в конце времён.


    Поэтому все становитесь богоносцами и относитесь друг к другу с почтением. Пусть никто не смотрит на своего ближнего по плоти, но всегда любите друг друга в Иисусе Христе. Пусть не будет среди вас ничего, что могло бы вас разделить; напротив, будьте едины с епископом и с теми, кто стоит во главе вас, как образец и наставление к нетлению.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для образца и наставления к нетлению». Греческое выражение допускает отнесение этой цели как к единству с руководителями общины, так и к самим руководителям как образцу и наставлению; перевод сохраняет эту краткость без догматического уточнения.'
    reason: Заключительное εἰς τύπον καὶ διδαχὴν ἀφθαρσίας синтаксически сжато и может по-разному соотноситься с предшествующим призывом.
lexical_decisions:
- source_word: in godly concord
  choice: в согласии, угодном Богу
  rationale: Передаёт религиозную направленность согласия естественным современным русским языком, не сводя выражение лишь к организационному единству.
- source_word: presiding
  choice: председательствует
  rationale: Сохраняет образ руководящего положения, не усиливая его до абсолютной власти.
- source_word: presbyters
  choice: пресвитеры
  rationale: Исторически и церковно точный термин для раннехристианского текста; современному читателю он доступнее, чем неоднозначное «старейшины» в данном контексте.
- source_word: diaconate
  choice: служение
  rationale: В контексте речь идёт о вверенном диаконском служении; «служение» звучит естественно и избегает позднейшего институционального оттенка слова «диаконат».
- source_word: before the worlds
  choice: прежде веков
  rationale: Сохраняет возможный временно-космологический смысл традиционной формулы и её возвышенный регистр.
- source_word: conformity to God
  choice: уподобляться Богу
  rationale: Передаёт идею сообразности или подражания Богу как деятельное стремление, а не статическое сходство.
- source_word: after the flesh
  choice: по плоти
  rationale: Сохраняет раннехристианскую формулу и её намеренную смысловую напряжённость, не подменяя её пояснением.
- source_word: incorruptibility
  choice: нетления
  rationale: 'Сохраняет богословскую широту понятия: нравственную неподкупность, неразрушимость и причастность вечной жизни.'
theological_decisions:
- issue: Сопоставление епископа с Богом, а пресвитеров — с советом апостолов
  choice: Сохранено «по подобию» без поясняющего ослабления или усиления
  alternative: Перевести как «на месте Бога» либо «как представитель Бога»
  rationale: Источник выражает аналогию, но не определяет её точный характер; перевод не должен превращать её в доктрину тождества, замещения или особого сакраментального статуса.
- issue: Предвечное бытие Иисуса Христа
  choice: «Кто был с Отцом прежде веков»
  alternative: «Кто существовал у Отца до сотворения мира»
  rationale: Выбранная формулировка сохраняет утверждение о предсуществовании и близости к Отцу, не добавляя отсутствующего в свидетельстве прямого упоминания творения.
- issue: Нетление как цель церковного единства
  choice: Сохранён широкий термин «нетление»
  alternative: «нравственная чистота» или «бессмертие»
  rationale: 'Обе альтернативы сужают смысл: первая — до этики, вторая — до посмертного состояния.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, уместным для раннехристианского послания. Синтаксис упрощён по сравнению с английским свидетельством, но параллелизм и богословская напряжённость сохранены. Проект остаётся предварительным, поскольку предоставлено английское публичнодоменное свидетельство, а прямая проверка по среднерецензионному греческому тексту ожидается.
