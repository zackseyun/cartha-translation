review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка по греческому тексту среднерецензионной традиции. В первом предложении τὸ πλῆθος ὑμῶν означает «ваше множество/вашу общину», а ἠγάπησα — «полюбил», не «обнял». Главные расхождения: εἰς τόπον θεοῦ и εἰς τόπον συνεδρίου ἀποστόλων буквально говорят «на месте Бога» и «на месте совета апостолов», а не «по подобию»; πάντες ... θεοφόροι γίνεσθε значит «становитесь богоносцами», а не просто «стремитесь уподобляться Богу».'
  naturalness: Текст в целом литературен, но «с верой увидел» и «являя образец и урок нетления» звучат неестественно и затемняют синтаксис. «В вере увидел вашу общину» и «как образец и наставление к нетлению» точнее и яснее при сохранении умеренно возвышенного регистра.
  terminology: «Епископ», «пресвитеры», «диаконы», «по плоти», «нетление» уместны. Διακονία следует передать как «служение»; «совет апостолов» сохранён как буквальное обозначение συνέδριον. «Богоносцами» — исторически и лексически адекватное соответствие θεοφόροι, без доктринального разъяснения.
  issues:
  - severity: high
    issue: Сравнительные обороты вместо «на месте»
    rationale: Греческое εἰς τόπον в обоих случаях означает «на месте/в положении», тогда как «по подобию» существенно ослабляет и изменяет образ оригинала.
  - severity: high
    issue: «Уподобляться Богу» вместо «становиться богоносцами»
    rationale: θεοφόροι γίνεσθε — иной образ и иной лексический выбор, чем «сообразоваться Богу» в английском свидетельстве.
  - severity: medium
