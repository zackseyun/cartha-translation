revisions:
- from: 'Итак, поскольку в упомянутых выше лицах я с верой увидел и обнял весь ваш народ, призываю вас: ревностно стремитесь всё делать в согласии, угодном Богу. Пусть епископ председательствует по подобию Бога, пресвитеры — по подобию совета апостолов, а вместе с ними и диаконы, особенно дорогие мне, которым вверено служение Иисуса Христа — Того, Кто был с Отцом прежде веков и явился в конце времён.


    Итак, все вы стремитесь уподобляться Богу и почитайте друг друга. Пусть никто не смотрит на ближнего по плоти, но всегда любите друг друга в Иисусе Христе. Да не будет среди вас ничего, что могло бы вас разделить. Напротив, будьте едины с епископом и с теми, кто вами руководит, являя образец и урок нетления.[a]'
  to: 'Итак, поскольку в упомянутых выше лицах я в вере увидел и полюбил всю вашу общину, прошу вас: ревностно старайтесь всё делать в Божьем согласии, когда епископ занимает место Бога, пресвитеры — место совета апостолов, а диаконам, особенно дорогим мне, вверено служение Иисуса Христа, Который был у Отца прежде веков и явился в конце времён.


