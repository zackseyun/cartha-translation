    rationale: 'Такое построение относит «силой Иисуса Христа» к единодушию. В английском свидетельстве «the Apostles in the power of Jesus Christ» характеризует апостолов. Безопаснее: «которые всегда были единодушны с апостолами, пребывавшими в силе Иисуса Христа».'
  - severity: low
    issue: Неясная анафора «в ней»
    rationale: Хотя грамматически она отсылает к «молитве», прямое «в ваших молитвах» яснее и сохраняет смысл "a partaker".
