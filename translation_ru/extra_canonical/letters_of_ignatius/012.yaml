  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: ru
  text: 'Сейчас последние времена. Поэтому впредь будем благоговеть и страшиться долготерпения Божьего, чтобы оно не обернулось для нас осуждением. Одно из двух: либо будем страшиться грядущего гнева, либо любить благодать, которая дана сейчас; только бы нам обрестись во Христе Иисусе для истинной жизни.


    Пусть ничто не блистает в ваших глазах, кроме Него. В Нём я ношу свои оковы — мои духовные жемчужины; в них я желал бы воскреснуть по вашей молитве. Да будет дано мне всегда иметь в ней участие, чтобы оказаться среди христиан Эфеса, которые силой Иисуса Христа всегда были единодушны и с апостолами.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод этого места предварительный: он выполнен по опубликованному английскому свидетельству; прямая сверка со среднередакционной греческой рукописной традицией ещё требуется.'
