lexical_decisions:
- source_word: last times
  choice: последние времена
  rationale: Сохраняет эсхатологическую формулу свидетельства без её дополнительного истолкования.
- source_word: long-suffering of God
  choice: долготерпение Божье
  rationale: Передаёт традиционный богословский смысл терпеливой отсрочки суда и остаётся понятным в современном литературном русском.
- source_word: be found in Christ Jesus
  choice: обрестись во Христе Иисусе
  rationale: Сохраняет идею итогового обнаружения или признания человека пребывающим во Христе, не сводя выражение лишь к субъективному состоянию.
- source_word: spiritual pearls
  choice: духовные жемчужины
  rationale: Сохранена яркая метафора, относящаяся к оковам Игнатия.
- source_word: of one mind with the Apostles
  choice: были единодушны и с апостолами
  rationale: Передаёт согласие и общность устремления; частица «и» отражает усилительное moreover в английском свидетельстве.
theological_decisions:
- issue: Соотношение страха грядущего гнева и любви к нынешней благодати
  choice: Сохранено резкое «одно из двух» без попытки согласовать или ранжировать две возможности.
  alternative: Передать как одновременный призыв и бояться гнева, и любить благодать.
  rationale: Свидетельство формулирует альтернативу «either ... or»; её богословское напряжение не следует сглаживать.
- issue: Смысл воскресения «в оковах»
  choice: Сохранено буквальное образное выражение «в них ... воскреснуть».
  alternative: Истолковать как надежду получить награду за мученичество.
  rationale: Текст не раскрывает точный характер связи оков, молитвы и воскресения, поэтому толкование не внесено в основной текст.
- issue: Связь единодушия эфесских христиан с апостолами и силой Христа
  choice: 'Фраза оставлена синтаксически открытой: «которые силой Иисуса Христа всегда были единодушны и с апостолами».'
  alternative: Однозначно отнести «силой Иисуса Христа» либо только к единодушию, либо ко всему предшествующему желанию Игнатия.
  rationale: Без прямой сверки с греческим текстом не следует чрезмерно уточнять синтаксическую связь.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены эсхатологическая напряжённость, метафора оков-жемчужин и неоднозначные синтаксико-богословские связи. Архаизмы ограничены устойчивыми и понятными формами («долготерпение», «грядущий», «обрестись»).
