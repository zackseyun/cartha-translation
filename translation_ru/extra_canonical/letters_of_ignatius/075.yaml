base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: ru
  text: 'Что же касается Филона, диакона из Киликии, человека с добрым именем, который и теперь служит мне в слове Божьем, а также Рея Агафопода, избранного, следующего за мной из Сирии и простившегося с этой жизнью, — они также свидетельствуют о вас. И я благодарю Бога за вас, потому что вы приняли их, как, я надеюсь, и Господь примет вас. А те, кто обошёлся с ними бесчестно, да будут искуплены благодатью Иисуса Христа.


    Вас приветствует любовь братьев, находящихся в Троаде. Оттуда я и пишу вам рукой Бурра, которого эфесяне и смирняне отправили вместе со мной в знак почтения. Господь Иисус Христос почтит их — тех, кто уповает на Него плотью, душой и духом, в вере, любви и согласии. Будьте здравы в Иисусе Христе, нашей общей надежде.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ministereth to me in the word of God
  choice: служит мне в слове Божьем
  rationale: Сохраняет церковное понятие служения и связь служения со словом Божьим, не уточняя его форму сверх свидетельства.
- source_word: an elect one
  choice: избранного
  rationale: Передаёт богословски насыщенное определение буквально, не заменяя его менее определённым «достойного».
- source_word: having bidden farewell to this present life
  choice: простившегося с этой жизнью
  rationale: Сохранён образ добровольного отрешения от нынешней жизни; выражение не истолковано как буквальная смерть, поскольку человек сопровождает Игнатия.
- source_word: be redeemed
  choice: да будут искуплены
  rationale: Сохранена сильная сотериологическая лексика источника и форма благопожелания, без ослабления до «да будут прощены».
- source_word: by the hand of Burrhus
  choice: рукой Бурра
  rationale: Сохранена древняя эпистолярная формула, которая может указывать на писца или доставителя письма.
- source_word: concord
  choice: согласии
  rationale: Естественное современное обозначение единодушия и церковного единства без излишне конфессиональной окраски.
theological_decisions:
- issue: Кто является субъектом свидетельства о филадельфийцах
  choice: «они также свидетельствуют о вас» относится к Филону и Рею Агафоподу
  alternative: Связать свидетельство только с ближайшим названным лицом
  rationale: Множественное число в английском свидетельстве естественно охватывает обоих спутников.
- issue: Кто почтит эфесян и смирнян
  choice: «Господь Иисус Христос почтит их»
  alternative: «Господь почтит их, то есть Иисус Христос»
  rationale: Русская конструкция с единым именованием звучит естественно и сохраняет отнесение титула «Господь» к Иисусу Христу.
- issue: Объём человеческого упования
  choice: «плотью, душой и духом»
  alternative: Истолковать триаду как «всем своим существом»
  rationale: Сохранена антропологическая триада и её возможное богословское напряжение, не сводя её к пояснительной парафразе.
- issue: Судьба тех, кто обесчестил посланников
  choice: благопожелание об их искуплении
  alternative: Передать как уверенное предсказание или как просьбу лишь о прощении
  rationale: Форма «да будут» сохраняет молитвенно-желательный характер и сильное слово «искуплены».
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Архаизмы сведены к минимуму; сохранены ключевые церковные термины и риторические благопожелания. Поскольку предоставлен английский публично-доменный свидетель, а прямая сверка с греческой традицией средней редакции ещё не выполнена, формулировки следует считать предварительными.
