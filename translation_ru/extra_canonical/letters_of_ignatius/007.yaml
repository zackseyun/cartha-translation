    rationale: 'Греческое πλὴν вводит исключение из «никого не слушаете»: слушают лишь говорящего об Иисусе Христе в истине. Нынешнее «говорит о чём-либо ином, а не...» меняет синтаксис и ослабляет исключительный характер высказывания.'
