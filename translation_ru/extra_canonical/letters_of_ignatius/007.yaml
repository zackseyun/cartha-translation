review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В первом предложении σιγῶντα означает «молчащего» в наблюдаемой ситуации; «молчалив» необоснованно превращает это в постоянную черту. φοβείσθω следует оставить в основном тексте как «пусть боится», сохранив возможный оттенок почтительного страха в сноске, а не заменять его словом «чтит». ἀφ’ ἑαυτοῦ означает «по собственной инициативе», а не усилительное «сам». Заключительная конструкция πλὴν περὶ Ἰησοῦ Χριστοῦ λαλοῦντος ἐν ἀληθείᾳ точнее передана как исключение: «никого, кроме того, кто говорит об Иисусе Христе в истине».'
  naturalness: Исправленный текст сохраняет современный литературный строй. «Хозяин дома» естественнее и прозрачнее, чем редкое «Домовладыка»; «относиться к епископу как к Самому Господу» естественно передаёт προσβλέπειν без разговорного оттенка «смотреть на».
  terminology: '«Епископ», «ересь» и «Господь» уместны. «Порядок в Боге» непосредственно передаёт ἐν θεῷ εὐταξίαν и не приписывает термину специального конфессионального смысла. Примечание, объясняющее, что епископ не тождествен Господу, следует удалить: это внешнее богословское ограничение, которого формулировка источника не содержит.'
  issues:
  - severity: medium
    issue: «молчалив» и «пусть чтит его»
    rationale: Подмена ситуативного «видит епископа молчащим» характеристикой личности и замена «боится» на «чтит» ослабляют лексику источника. Возможный почтительный смысл следует пояснить, но не переносить в основной текст.
  - severity: high
    issue: «Сам Онисим»
    rationale: ἀφ’ ἑαυτοῦ означает, что Онисим хвалит по собственной инициативе; нынешний вариант не передаёт этот смысл и вносит иной акцент.
  - severity: medium
