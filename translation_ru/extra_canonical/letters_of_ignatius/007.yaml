base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: ru
  text: 'И чем больше кто видит, что его епископ молчит, тем больше пусть боится его.[a] Ведь всякого, кого Хозяин дома посылает управлять Своим домом, мы должны принимать как Самого Пославшего его. Поэтому ясно, что к епископу следует относиться как к Самому Господу.


    Онисим по собственной инициативе весьма хвалит ваш порядок в Боге, потому что все вы живёте согласно истине и никакая ересь среди вас не обитает. Более того, вы даже не слушаете никого, кроме того, кто говорит об Иисусе Христе в истине.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем больше пусть относится к нему с почтительным страхом». Глагол может выражать как страх, так и благоговейное почтение.'
    reason: Сохраняет в основном тексте прямое значение φοβείσθω и отмечает его возможный почтительный оттенок.
lexical_decisions:
- source_word: σιγῶντα
  choice: молчалив
  rationale: Передаёт характеристику сдержанного, немногословного епископа естественным современным русским языком, не превращая её в указание на разовое молчание.
- source_word: φοβείσθω
  choice: пусть чтит его
  rationale: В данном контексте греческий глагол может обозначать почтительный страх или благоговейное уважение; «чтит» естественно выражает требуемое уважение, а буквальная возможность отмечена в сноске.
- source_word: οἰκοδεσπότης
  choice: Домовладыка
  rationale: Сохраняет образ хозяина дома и его связь с последующим «Своим домом».
- source_word: οἰκονομίαν
  choice: устроение
  rationale: Сохраняет широкий смысл порядка, уклада и надлежащего управления в общине, не сводя выражение только к поведению.
- source_word: αἵρεσις
  choice: ересь
  rationale: Устоявшийся русский эквивалент для ложного или отклоняющегося учения в раннехристианском контексте.
- source_word: κατοικεῖ
  choice: не находит у вас пристанища
  rationale: 'Естественно передаёт образ постоянного обитания: ереси нет места в общине.'
theological_decisions:
- issue: Сопоставление епископа с Господом
  choice: «смотреть на епископа как на Самого Господа»
  alternative: «считать епископа Самим Господом»
  rationale: Сохраняет сильную риторическую формулировку о принятии посланника как Пославшего, но не утверждает онтологического тождества епископа и Христа.
- issue: Исключительность предмета учения
  choice: «говорит о чём-либо ином, а не об Иисусе Христе в истине»
  alternative: «говорит нечто помимо истинного учения об Иисусе Христе»
  rationale: 'Сохраняет синтаксическую и смысловую напряжённость выражения: речь может идти как об ином содержании, так и о речи о Христе не в истине.'
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским регистром. Сохранены образы дома, управляющего и обитания ереси; архаические формы и чрезмерно конфессиональная терминология избегаются. Проект требует последующей прямой сверки с греческим текстом средней редакции.
