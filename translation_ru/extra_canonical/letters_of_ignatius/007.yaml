- from: 'И чем больше кто видит, что его епископ молчалив, тем больше пусть чтит его.[a] Ведь всякого, кого Домовладыка посылает управлять Своим домом, мы должны принимать так же, как Пославшего его. Поэтому ясно, что нам следует смотреть на епископа как на Самого Господа.[b]


