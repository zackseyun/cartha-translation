    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: ru
  text: 'Поэтому отныне нам разумно пробудиться и обрести трезвость, пока у нас ещё[a] есть время покаяться и обратиться к Богу. Хорошо признавать Бога и епископа. Кто чтит епископа, тот почтён Богом; а кто делает что-либо тайком от епископа[b], тот служит дьяволу.


    Итак, пусть всё у вас изобилует благодатью, ведь вы достойны этого. Вы во всём дали мне отраду, и Иисус Христос даст отраду вам. И в моё отсутствие, и в моём присутствии вы относились ко мне с любовью. Да воздаст вам Бог; если ради Него вы всё претерпите, то достигнете Его[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «ещё» в предоставленном английском свидетельстве отмечено квадратными скобками как восстановленное или подразумеваемое; прямая сверка с греческим источником ещё требуется.
    reason: Сохранить редакционный сигнал исходного свидетельства и обозначить предварительный характер чтения.
  - marker: b
    text: 'Буквально по смыслу: «тайно от епископа», то есть скрывая своё действие от него; возможно также: «без ведома епископа».'
    reason: Показать оттенок скрытности и не превратить фразу в более широкое административное требование.
  - marker: c
    text: 'Или: «обретёте Его». Местоимение относится к Богу; выражение не уточняет, каким именно образом верующие Его достигнут.'
    reason: Сохранить образность и богословскую открытость заключительной фразы.
lexical_decisions:
- source_word: wake to soberness (ср. греч. ἀνανῆψαι)
  choice: пробудиться и обрести трезвость
  rationale: Передаёт одновременно образ пробуждения и возвращения к духовной трезвости, не сводя выражение лишь к физическому пробуждению.
- source_word: recognize/know (ср. греч. εἰδέναι)
  choice: признавать
  rationale: В данном увещевательном контексте речь идёт не просто об осведомлённости, а о должном признании Бога и епископа; более сильное «почитать» было бы смешением со следующим глаголом.
- source_word: without the knowledge of / secretly from (ср. греч. λάθρα)
  choice: тайком от
  rationale: Сохраняет идею скрытого действия за спиной епископа точнее, чем нейтральное «без ведома».
- source_word: refreshed (ср. греч. ἀναπαύω)
  choice: дали мне отраду
  rationale: Естественно передаёт смысл утешения, облегчения и подкрепления, не ограничивая его физическим отдыхом.
- source_word: cherished/loved (ср. греч. ἀγαπάω)
  choice: относились ко мне с любовью
  rationale: Современная и достойная формулировка, сохраняющая прямой смысл любви без излишне сентиментального оттенка слова «лелеяли».
- source_word: attain unto (ср. греч. τυγχάνω)
  choice: достигнете
  rationale: Сохраняет направленность к Богу и итог стойкого перенесения испытаний, не уточняя сверх текста характер этого достижения.
theological_decisions:
- issue: Соотношение признания Бога и епископа
  choice: «признавать Бога и епископа»
  alternative: «знать Бога и епископа» / «почитать Бога и епископа»
  rationale: «Признавать» сохраняет церковно-практический смысл фразы, но не уравнивает Бога и епископа по природе и не подменяет следующий тезис о почитании.
- issue: Действие без участия епископа
  choice: «делает что-либо тайком от епископа»
  alternative: «делает что-либо без ведома епископа»
  rationale: Формулировка сохраняет обвинение именно в скрытности; она не расширяет текст до утверждения, будто абсолютно любое действие требует предварительного разрешения епископа.
- issue: Фраза «достигнете Его»
  choice: сохранена без поясняющего богословского дополнения
  alternative: «обретёте спасение в Нём» / «соединитесь с Ним»
  rationale: Исходная формулировка допускает широкое эсхатологическое понимание; конкретизация внесла бы отсутствующее в тексте толкование.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского пастырского увещевания. Синтаксис умеренно формальный, но без архаизмов «ибо», «дабы», «оный». Перевод предварительный: предоставлен английский публичнодоменный свидетельский текст, а прямая сверка с греческой рукописной традицией обозначена как ожидающая выполнения.'
