  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены настойчивые повторы и космическая формула; архаизмы сведены к минимуму. Поскольку предоставленный пакет указывает, что непосредственная сверка с греческим ещё ожидается, решения осторожны и учитывают доступное свидетельство средней греческой редакции через аудированный английский слой.
