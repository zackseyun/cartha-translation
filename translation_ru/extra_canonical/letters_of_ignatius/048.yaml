base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: ru
  text: 'Поэтому будьте глухи ко всякому, кто говорит вам помимо Иисуса Христа. Он — из рода Давида, Сын Марии; Он действительно родился, ел и пил, действительно был гоним при Понтии Пилате, действительно был распят и умер на глазах у небесных, земных и подземных.


    Он также действительно был воскрешён из мёртвых, ибо Его воскресил Отец. Подобным образом и нас, верующих в Него, воскресит Его Отец — именно Его Отец воскресит нас — во Христе Иисусе, без Которого у нас нет истинной жизни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκωφώθητε οὖν
  choice: Поэтому будьте глухи
  rationale: Сохранён резкий образный призыв Игнатия не слушать учения, отделённого от Иисуса Христа.
- source_word: χωρὶς Ἰησοῦ Χριστοῦ
  choice: не о Христе Иисусе
  rationale: В данном контексте выражение относится к речи, содержание которой не связано с Христом; естественная русская формулировка передаёт это без излишнего толкования.
- source_word: ἐκ γένους Δαυίδ
  choice: из рода Давида
  rationale: Традиционная и ясная формулировка, точно передающая происхождение.
- source_word: ἀληθῶς
  choice: действительно
  rationale: Повтор сохранён как полемически значимое настойчивое утверждение реальности воплощения, страданий, смерти и воскресения.
- source_word: ἐδιώχθη ἀληθῶς ἐπὶ Ποντίου Πιλάτου
  choice: действительно был гоним при Понтии Пилате
  rationale: «При» естественно обозначает исторический период и власть Пилата, не сужая смысл до личного преследования исключительно им.
- source_word: βλεπόντων τῶν ἐπουρανίων καὶ ἐπιγείων καὶ ὑποχθονίων
  choice: на глазах у небесных, земных и подземных существ
  rationale: Передана трёхчастная космическая формула; слово «существ» делает субстантивированные прилагательные понятными по-русски, не уточняя их природу.
- source_word: ἤγειρεν αὐτὸν ὁ πατὴρ αὐτοῦ
  choice: Его воскресил Отец
  rationale: Сохранена явно выраженная деятельность Отца в воскресении Иисуса.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: во Христе Иисусе
  rationale: Формально сохранена богословски насыщенная предложная конструкция без попытки разъяснить точный характер связи.
- source_word: τὸ ἀληθινὸν ζῆν
  choice: истинной жизни
  rationale: Естественная русская номинальная передача выражения «истинно жить / истинная жизнь».
theological_decisions:
- issue: Реальность человеческой жизни, страданий, смерти и воскресения Иисуса
  choice: Повторить «действительно» в ключевых утверждениях
  alternative: Сгладить повтор ради стилистической краткости
  rationale: Повтор несёт богословскую нагрузку и направлен против отрицания реальности воплощения и страданий.
- issue: Действующее лицо воскресения Иисуса и верующих
  choice: Явно и повторно назвать Отца
  alternative: Использовать безличное «Он воскрес» и сократить повтор
  rationale: Текст подчёркивает, что Иисуса воскресил Отец и что Отец воскресит верующих; редакционная настойчивость автора сохранена.
- issue: Способ будущего воскресения верующих
  choice: Сохранить «во Христе Иисусе» без пояснения
  alternative: Перевести как «через Христа Иисуса»
  rationale: Предлог «в» допускает более широкую богословскую связь, чем инструментальное «через»; подлинная неоднозначность не разрешается переводчиком.
- issue: Космические свидетели распятия и смерти
  choice: «небесные, земные и подземные существа»
  alternative: «те, кто на небе, на земле и под землёй»
  rationale: Выбран компактный вариант, сохраняющий личностный или сущностный характер свидетелей, но не определяющий, кто именно имеется в виду.
