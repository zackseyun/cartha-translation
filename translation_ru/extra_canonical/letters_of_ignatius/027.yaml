review_pass:
  verdict: revise
  source_fidelity: Нужна правка двух мест. Оборот «говорят о епископе» не передаёт формулу «have the bishop's name on their lips» и, с учётом греческого καλοῦσιν, должен выражать именование/признание епископа. «Должным образом» также слишком сглаживает нормативно-устойчивый характер наречия; «как положено» естественнее и точнее для современного русского, не превращая выражение в гражданско-правовое «законно».
  naturalness: 'Текст в целом литературен и ясен. «Не хранят доброй совести» звучит по-русски менее естественно, чем «не могут похвалиться чистой совестью» или «не имеют чистой совести». В данном контексте предпочтено первое: оно сохраняет оценочную осторожность «appear to me / δοκοῦσί μοι».'
  terminology: «Епископ», «христиане» и «заповедь» сохранены. Формула «называют епископа епископом» намеренно передаёт признание титула, а не простое упоминание епископа в речи. «Чистая совесть» — нормальный современный эквивалент положительной характеристики совести, без конфессионального уточнения.
  issues:
  - severity: medium
    issue: «говорят о епископе»
    rationale: Это означает лишь, что о епископе ведут речь. Исходное выражение, а также греческое καλοῦσιν, указывает на именование/признание епископа.
  - severity: low
    issue: «не хранят доброй совести»
    rationale: Оборот калькирует английское «keep a good conscience» и звучит не вполне естественно в современном литературном русском; кроме того, «мне кажется» относится к оценке этих людей.
  - severity: low
    issue: «должным образом»
    rationale: Формулировка допустима, но слишком общая; «как положено, согласно заповеди» яснее передаёт установленный характер собрания, не снимая неопределённости относительно самой заповеди.
  revised_text: Поэтому нам следует не только называться христианами, но и быть ими. Ведь некоторые называют епископа епископом, но во всём поступают независимо от него. Мне кажется, такие люди не могут похвалиться чистой совестью, потому что не собираются вместе как положено, согласно заповеди.[a]
  revised_footnotes:
