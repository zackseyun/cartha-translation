base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: ru
  text: Поэтому нам следует не только называться христианами, но и быть ими. Ведь некоторые хотя и говорят о епископе, но во всём поступают независимо от него. Мне кажется, такие люди не хранят доброй совести, поскольку не собираются вместе должным образом, согласно заповеди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он основан на представленном английском свидетельстве Дж. Б. Лайтфута; непосредственная сверка со среднерецензионным греческим текстом ещё требуется.'
    reason: В данных прямо указано, что обзор греческого оригинала ожидается; это существенно для оценки слов «говорят о епископе», «должным образом» и «заповеди».
lexical_decisions:
- source_word: meet
  choice: следует
  rationale: Передаёт нравственную уместность и обязанность естественным современным русским языком, не усиливая её до безусловного приказа.
- source_word: be called Christians ... be such
  choice: называться христианами ... быть ими
  rationale: Сохраняет противопоставление имени и действительности, выраженное в свидетельстве.
- source_word: have the bishop's name on their lips
  choice: говорят о епископе
  rationale: Естественно передаёт смысл публичного упоминания или признания епископа, не создавая неясного русского оборота «иметь имя на устах».
- source_word: act apart from him
  choice: поступают независимо от него
  rationale: Сохраняет идею действий в отрыве от епископа, не уточняя, идёт ли речь о непослушании, расколе или отсутствии согласования.
- source_word: keep a good conscience
  choice: хранят доброй совести
  rationale: Сохраняет традиционную раннехристианскую нравственную формулу и её богословскую насыщенность.
- source_word: assemble themselves together lawfully
  choice: собираются вместе должным образом
  rationale: «Должным образом» передаёт нормативный характер наречия без неестественного или чрезмерно юридического «законно».
- source_word: according to commandment
  choice: согласно заповеди
  rationale: Сохраняет единственное число и нормативно-религиозное значение слова «commandment».
theological_decisions:
- issue: Христианское имя и соответствующая ему жизнь
  choice: Сохранено прямое противопоставление «называться» и «быть».
  alternative: Передать как противопоставление формальной и подлинной принадлежности к Церкви.
  rationale: Более буквальная формулировка сохраняет афористичность и не добавляет конфессионального определения подлинного христианства.
- issue: Отношение общины к епископу
  choice: «поступают независимо от него»
  alternative: «не повинуются ему» или «действуют без его ведома»
  rationale: Исходное английское свидетельство говорит об отделённости действий, но не определяет точный вид нарушения; перевод сохраняет эту широту.
- issue: Характер предписанного собрания
  choice: «должным образом, согласно заповеди»
  alternative: «законно, по повелению»
  rationale: Выбранная формулировка сохраняет церковно-нормативный смысл, не сводя его к гражданской законности и не устанавливая, о какой именно заповеди идёт речь.
translation_notes:
  register: Современный литературный русский язык с dignified раннехристианским тоном. Синтаксис сделан ясным для широкого читателя; сохранены нравственная категоричность, противопоставление исповедания и поступков и неопределённость относительно конкретной «заповеди».
