  revision_rationale: Правка устраняет смысловое ослабление во фразе об епископе, делает характеристику совести естественной по-русски и сохраняет осторожное «мне кажется». Не добавляются утверждения о конкретной форме церковного устройства, виде непослушания или содержании заповеди. Сноска сохранена и её привязка остаётся корректной.
