revisions:
- from: 'Братья мои, моё сердце безмерно переполнено любовью к вам. Необычайно радуясь, я забочусь о вашем спасении — впрочем, не я, а Иисус Христос. Нося Его оковы, я тем более испытываю страх, потому что ещё не достиг совершенства. Однако ваша молитва сделает меня совершенным [для Бога][a], чтобы я обрёл наследие, ради которого был помилован. Я прибегаю к Евангелию как к плоти Иисуса, а к апостолам — как к совету пресвитеров Церкви[b].


    Любим мы и пророков, потому что они также возвещали Евангелие, возлагали надежду на Христа и ожидали Его. Уверовав в Него, они были спасены в единстве Иисуса Христа. Это святые мужи, достойные всякой любви и восхищения, получившие одобрение Иисуса Христа и причисленные к Евангелию нашей общей надежды.'
