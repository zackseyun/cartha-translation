base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: ru
  text: 'Братья мои, душа моя преисполнена любви к вам; и, ликуя безмерно, я забочусь о вашей безопасности — впрочем, не я, а Иисус Христос. Будучи связан Его узами, я тем более страшусь, поскольку ещё несовершенен. Но ваша молитва [к Богу][a] довершит меня, чтобы я достиг удела, в котором обрёл милость, прибегая к Евангелию как к плоти Иисуса и к апостолам как к пресвитерию Церкви[b].


    Да, мы любим и пророков, потому что они также в своём возвещении указывали на Евангелие, возлагали надежду на Него и ожидали Его. Уверовав в Него, они были спасены в единстве Иисуса Христа — святые мужи, достойные всякой любви и восхищения, получившие одобрение Иисуса Христа и сопричисленные к Евангелию нашей общей надежды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «к Богу» переданы в квадратных скобках вслед за доступным английским свидетельством, где они отмечены как восстановленные. Греческое выражение εἰς θεόν означает направленность к Богу.
    reason: Сохраняет текстологический сигнал свидетельства и уточняет направление выражения без добавления богословского истолкования.
  - marker: b
    text: 'Буквально: «как к пресвитерию Церкви», то есть к собранию или совету пресвитеров.'
    reason: Поясняет собирательное значение термина, не отождествляя его с какой-либо поздней конфессиональной структурой.
lexical_decisions:
- source_word: safety (English witness; Greek review pending)
  choice: спасении
  rationale: В данном христианском контексте слово относится не только к физической безопасности, но и к окончательному благу и спасению; выбор сохраняет богословскую глубину контекста.
- source_word: bonds
  choice: оковы
  rationale: Достоинный и естественный русский эквивалент, ясно обозначающий заключение Игнатия и его связь со Христом.
- source_word: Gospel
  choice: Евангелие
  rationale: Сохранено широкое значение благой вести, не сведённое без достаточных оснований к письменной книге.
- source_word: presbytery
  choice: совет пресвитеров
  rationale: Передаёт собирательное значение группы старейшин, не подменяя его позднейшим конфессиональным устройством.
- source_word: numbered together in
  choice: причисленные к
  rationale: Сохраняет образ включения пророков в Евангелие общей надежды, хотя оборот остаётся намеренно необычным.
theological_decisions:
- issue: Соотношение действий Игнатия и Иисуса Христа
  choice: «впрочем, не я, а Иисус Христос»
  alternative: «но не я, а Иисус Христос заботится о вашем спасении»
  rationale: Краткая форма сохраняет риторическое самоисправление и не добавляет отсутствующего в свидетельстве повторного глагола.
- issue: Образ Евангелия как плоти Иисуса
  choice: сохранить образ буквально
  alternative: истолковать Евангелие как свидетельство о воплощении
  rationale: Необычная метафора богословски значима; её не следует молча разъяснять или ослаблять.
- issue: Спасение пророков во Христе
  choice: «Уверовав в Него, они были спасены в единстве Иисуса Христа»
  alternative: «верой в Него они достигли спасения через единство с Иисусом Христом»
  rationale: Сохранены и вера во Христа, и неоднозначная формула единства без уточнения механизма спасения.
- issue: Восстановленное выражение «для Бога»
  choice: сохранить в квадратных скобках
  alternative: включить в текст без обозначения или опустить
  rationale: Скобки честно передают реставрационный сигнал доступного английского свидетельства.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским регистром. Риторическая напряжённость, необычные метафоры и богословская неоднозначность сохранены. Поскольку прямая сверка с греческим текстом средней редакции ещё не выполнена, проект остаётся предварительным и опирается на указанное общедоступное английское свидетельство как на прозрачный консультационный слой.
