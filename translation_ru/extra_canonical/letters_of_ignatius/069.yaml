review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В греческом тексте стоят ψυχή («душа», не «сердце») и ἀσφαλίζομαι ὑμᾶς («забочусь о вашей безопасности / оберегаю вас»), а не термин «спасение». Выражение εἰς θεόν передаётся как «к Богу», а не «для Бога». Также «ради которого был помилован» меняет связь оригинала и английского свидетельства: милость относится к обретаемому уделу/наследию, а не является целью, ради которой оно даётся. Образы «Евангелие как плоть Иисуса» и «апостолы как пресвитерий Церкви» сохранены без доктринального истолкования.'
  naturalness: Исправленный вариант сохраняет возвышенный, но современный литературный регистр. «Душа моя преисполнена любви», «ликуя безмерно» и «будучи связан Его узами» естественны в раннехристианском эпистолярном контексте. Термин «пресвитерий» оставлен в самом тексте и кратко пояснён в сноске, чтобы не сужать его до конкретной поздней церковной структуры.
  terminology: «Безопасность» точно передаёт ἀσφάλεια в данном месте и не подменяет её сотериологическим «спасением». «Узы» передают δεδεμένος и избегают оттенка буквального ношения оков. «Удел» отражает κλῆρος; сноска к «пресвитерию» объясняет собирательный смысл. Скобки вокруг «к Богу» сохранены согласно критическому сигналу английского свидетельства.
  issues:
  - severity: high
    issue: «о вашем спасении» вместо «о вашей безопасности»
    rationale: Свидетельство читает «your safety», а греческое ἀσφαλίζομαι относится к обеспечению безопасности. Богословски нагруженное «спасение» добавляет смысл, которого данная формулировка не требует.
  - severity: medium
    issue: «сердце» вместо «душа»
    rationale: Греческое ψυχή означает «душа, жизнь, внутреннее существо»; «сердце» является свободной адаптацией и не нужно для естественности русского текста.
  - severity: high
    issue: «[для Бога]» вместо «[к Богу]»
    rationale: εἰς θεόν и английское restored «[unto God]» направлены к Богу; «для Бога» выражает иную целевую связь.
  - severity: high
    issue: «наследие, ради которого был помилован»
    rationale: 'Оборот превращает наследие в цель помилования. В источнике и английском свидетельстве милость связана с самим обретаемым уделом: «the inheritance wherein I have found mercy».'
  - severity: medium
    issue: «они также возвещали Евангелие»
    rationale: Формулировка «pointed to the Gospel in their preaching» и греческий оборот подчёркивают направленность пророческого возвещения к Евангелию, а не обязательно прямое возвещение Евангелия как уже наличного содержания.
