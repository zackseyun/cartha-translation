source:
  text: 'My brethren, my heart overfloweth altogether in love towards you; and rejoicing above measure I watch over your safety; yet not I, but Jesus Christ, wearing whose bonds I am the more afraid, because I am not yet perfected. But your prayer will make me perfect [unto God], that I may attain unto the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the Apostles as the presbytery of the Church.


    Yea, and we love the prophets also, because they too pointed to the Gospel in their preaching and set their hope on Him and awaited Him; in whom also having faith they were saved in the unity of Jesus Christ, being worthy of all love and admiration as holy men, approved of Jesus Christ and numbered together in the Gospel of our common hope.'
