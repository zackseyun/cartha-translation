    especially if the Lord should reveal aught to me. Assemble yourselves together in common, every one of you severally, man by man, in grace, in one faith and one Jesus Christ, who after the flesh was of David''s race, who is Son of Man and Son of God, to the end that ye may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live for ever in Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: ru
  text: 'Если Иисус Христос по вашей молитве удостоит меня и на то будет Божья воля, то во втором сочинении, которое я намерен вам написать, я подробнее изложу начатое мною учение о Божьем замысле, связанном с новым человеком — Иисусом Христом: о вере в Него и любви к Нему, о Его страдании и воскресении, — особенно если Господь откроет мне что-либо ещё.


    Собирайтесь все вместе, каждый без исключения, в благодати, в одной вере и в одном Иисусе Христе, Который по плоти — из рода Давида, Сын Человеческий и Сын Божий, чтобы вы неуклонно повиновались епископу и пресвитерам, преломляя один хлеб — лекарство бессмертия, противоядие от смерти, дабы нам не умереть, но вечно жить в Иисусе Христе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'dispensation (Greek: οἰκονομία, source review pending)'
  choice: Божий замысел
  rationale: Передаёт идею устроения или спасительного плана естественным современным русским языком, не сводя выражение к отдельной церковно-догматической системе.
- source_word: new man
  choice: новый человек
  rationale: Сохранён буквальный и богословски насыщенный образ исходного свидетельства.
- source_word: passion
  choice: страдание
  rationale: В данном христологическом контексте означает страдания Христа; современному читателю форма «страдание» яснее традиционного «страсти».
- source_word: presbytery
  choice: пресвитеры
  rationale: Здесь речь идёт о совокупности пресвитеров как людях, которым адресовано повиновение; русское множественное число звучит естественно.
- source_word: without distraction of mind
  choice: неуклонно
  rationale: Передаёт отсутствие разделённости и колебания в повиновении, избегая тяжеловесного буквального оборота.
- source_word: medicine of immortality
  choice: лекарство бессмертия
  rationale: Сохранена яркая евхаристическая метафора оригинального свидетельства.
- source_word: antidote
  choice: противоядие от смерти
  rationale: 'Эксплицирован подразумеваемый объект противоядия, непосредственно названный в следующей цели: «не умереть».'
theological_decisions:
- issue: Связь веры, любви, страдания и воскресения с «новым человеком — Иисусом Христом»
  choice: Сохранить перечисление как содержание обещанного дальнейшего изложения
  alternative: Понять веру и любовь как то, из чего «состоит» сам новый человек
  rationale: Пунктуация английского свидетельства допускает синтаксическую неясность; выбранная формулировка не утверждает, будто личность Христа состоит из веры и любви, и при этом сохраняет все элементы рассуждения.
- issue: Евхаристический смысл «одного хлеба»
  choice: Сохранить образ без догматического пояснения
  alternative: Явно назвать хлеб Евхаристией или телом Христа
  rationale: Контекст явно сакраментален, но добавление терминов, отсутствующих в представленном тексте, чрезмерно разрешило бы богословскую образность.
- issue: «Сын Человеческий и Сын Божий»
  choice: Сохранить оба титула параллельно и без пояснения
  alternative: Переформулировать как утверждение о двух природах
  rationale: Текст даёт христологические титулы, но не формулирует позднейшее догматическое определение; перевод не должен его импортировать.
- issue: Местоимение в заключении
  choice: «дабы нам не умереть»
  alternative: «дабы вы не умерли»
  rationale: Свидетельство передаёт первое лицо множественного числа «we»; оно сохранено как включение автора в общее упование.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Архаизмы вроде «трактат», «домостроительство», «дабы вы повиновались без рассеяния ума» избегаются там, где они мешают ясности; «дабы» сохранено один раз ради торжественного ритма. Поскольку прямая сверка с греческим источником ещё не выполнена, спорные синтаксические и лексические решения остаются предварительными.
