base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: ru
  text: 'Мой дух — словно отбросы ради Креста[a], который для неверующих — камень преткновения, а для нас — спасение и вечная жизнь. Где мудрец? Где спорщик? Где похвала тех, кого называют разумными?


    Ибо наш Бог, Иисус Христос, был выношен Марией по Божьему замыслу[b]: от семени Давида, но также от Святого Духа. Он родился и был крещён, чтобы Своим страданием очистить воду[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквальный образ исходного выражения связан с отбросами или тем, что счищают и выбрасывают; в древнем употреблении оно могло также служить сильной формулой самоуничижения или самоотдачи ради другого.
    reason: Выражение многозначно и звучит необычно; примечание сохраняет образ, не закрепляя спорное жертвенное толкование.
  - marker: b
    text: 'Также возможно: «по Божьему установлению» или «по Божьему домостроительству»; речь идёт о Божьем порядке осуществления замысла.'
    reason: Греческое κατ’ οἰκονομίαν θεοῦ имеет широкий богословский диапазон, который одно русское слово передаёт не полностью.
  - marker: c
    text: Фраза дословно говорит об очищении воды страданием Христа; вероятно, она связана с предшествующим упоминанием Его крещения, но автор не объясняет эту связь.
    reason: Необходимо сохранить загадочность и богословское напряжение формулировки, не подменяя её конфессиональным толкованием.
lexical_decisions:
- source_word: offscouring (Greek περίψημα, as reflected in the witness)
  choice: словно отбросы
  rationale: Сохраняет резкий образ самоуничижения, не превращая его без достаточных оснований в техническое обозначение искупительной жертвы; «словно» делает необычную русскую конструкцию понятной.
- source_word: Cross / cross
  choice: Крест
  rationale: В данном исповедальном контексте слово обозначает Крест Христов; прописная буква соответствует принятому русскому религиозно-литературному употреблению.
- source_word: dispensation
  choice: Божий замысел
  rationale: Передаёт идею установленного Богом порядка осуществления спасительного замысла естественным современным русским языком; буквальное «домостроительство» здесь менее понятно широкому читателю.
- source_word: seed of David
  choice: семя Давида
  rationale: Сохраняет библейскую родословную формулу и её связь с мессианским происхождением.
- source_word: passion
  choice: страдания
  rationale: Передаёт страдания и смерть Христа без узкого современного значения слова «страсть».
- source_word: cleanse water
  choice: очистить воду
  rationale: Сохранена необычная причинная формулировка свидетельства без поясняющего добавления о крещении или освящении вод.
theological_decisions:
- issue: Исповедальное именование Иисуса Христа Богом
  choice: наш Бог, Иисус Христос
  alternative: наш божественный Иисус Христос
  rationale: Свидетельство прямо ставит «Бог» в приложение к имени; перевод не ослабляет раннехристианское христологическое утверждение.
- issue: Соотношение происхождения от Давида и от Святого Духа
  choice: от семени Давида, но также от Святого Духа
  alternative: по плоти — от семени Давида, по Духу — от Святого Духа
  rationale: Сохранена краткая и напряжённая параллель исходного свидетельства без внесения отсутствующего разъяснения «по плоти».
- issue: Очистительное значение страданий Христа для воды
  choice: чтобы Своими страданиями очистить воду
  alternative: чтобы через Свои страдания освятить воды крещения
  rationale: Не уточняется механизм и не вводится слово «крещение», которого нет в заключительной цели фразы; сохраняется богословски необычное утверждение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского исповедального текста. Риторические вопросы и библейские отзвуки сохранены. Проект остаётся предварительным: предоставленный материал содержит английское публично-доменное свидетельство, а прямая сверка с греческой рукописной традицией обозначена как ожидающая выполнения. Формулировка «по Божьему замыслу» учитывает известное смысловое поле выражения, однако при окончательной публикации требуется проверка греческого чтения.'
