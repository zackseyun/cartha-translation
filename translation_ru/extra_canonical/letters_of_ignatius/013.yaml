    issue: «Широкая дорога»
    rationale: Ни английское high-road, ни греческое πάροδος не требуют признака ширины; это добавляет отсутствующую деталь и создаёт нежелательную ассоциацию с иным библейским образом.
  - severity: medium
    issue: «Достоин всякого почитания»
    rationale: ἀξιομακάριστος и английское worthy of every congratulation говорят о блаженном прославлении, а не о почитании как особом статусе.
