base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: ru
  text: 'Я знаю, кто я и кому пишу. Я — приговорённый; вы же помилованы. Я в опасности, вы утверждены.


    Вы — путь тех, кого ведут на смерть к Богу.[a] Вы вместе с Павлом посвящены в тайны[b] — с Павлом, который был освящён, о котором было доброе свидетельство и который достоин всякого прославления. Хотел бы я оказаться идущим по его следам, когда достигну Бога.[c] В каждом из своих посланий он упоминает вас во Христе Иисусе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально образ говорит о пути тех, кого ведут на смерть «к Богу». Направленность выражения сохранена; она не сводится однозначно ни к смерти «ради Бога», ни только к посмертному приходу к Богу.
    reason: Передаёт необычный образ и сохраняет его смысловую многозначность.
  - marker: b
    text: Греческое слово обозначает посвящённых в тайны. Контекст не уточняет, подразумеваются ли конкретные обряды, сокровенное знание или образ общего духовного посвящения вместе с Павлом.
    reason: Поясняет термин без конфессионального сужения его значения.
  - marker: c
    text: «Достигну Бога» — характерное для Игнатия выражение конечной цели его пути; в данном контексте оно связано с ожидаемым мученичеством, но не заменено развёрнутым толкованием.
    reason: Объясняет непривычный оборот, сохраняя формулировку автора.
lexical_decisions:
- source_word: convict / condemned prisoner (Greek review pending)
  choice: осуждённый узник
  rationale: Передаёт одновременно судебный статус и заключение Игнатия, не сводя выражение лишь к общему слову «заключённый».
- source_word: high-road (Greek review pending)
  choice: широкая дорога
  rationale: Сохраняет яркую метафору пути и усилительный оттенок английского свидетеля; значение будет нуждаться в сверке с греческой рукописной традицией.
- source_word: associates in the mysteries (Greek review pending)
  choice: вместе с Павлом причастны тайнам
  rationale: Передаёт идею совместного участия, избегая как малопонятного неологизма «сотаинники», так и чрезмерно конкретной терминологии обрядового посвящения.
- source_word: obtained a good report (Greek review pending)
  choice: получил доброе свидетельство
  rationale: Сохраняет библейски узнаваемую, но понятную формулу внешнего одобрительного свидетельства.
- source_word: attain unto God (Greek review pending)
  choice: достигну Бога
  rationale: Сохранена характерная для Игнатия направленность движения к Богу без замены её более истолковывающими выражениями о смерти или спасении.
theological_decisions:
- issue: Смысл выражения «die unto God»
  choice: идёт на смерть к Богу
  alternative: идёт умереть ради Бога
  rationale: Выбранная формулировка удерживает одновременно мученическую смерть и направленность к Богу, не сводя фразу исключительно к значению причины «ради Бога».
- issue: Характер «тайн», разделяемых с Павлом
  choice: причастны тайнам
  alternative: посвящены в таинства вместе с Павлом
  rationale: Не уточняется, идёт ли речь о церковных таинствах, сокровенном знании или образе совместного посвящения; неоднозначность исходного свидетельства сохранена.
- issue: Фраза о достижении Бога
  choice: когда достигну Бога
  alternative: когда приду к Богу после смерти
  rationale: Не добавлено прямое толкование через посмертное состояние, хотя в контексте мученичества оно подразумевается.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Сохранены параллельные противопоставления «я — вы» и метафоры пути. Архаизмы и конфессионально закреплённые уточнения избегались. Поскольку непосредственная проверка греческого текста ещё не выполнена, решения, зависящие от исходной лексики, отмечены как предварительные.
