  source_fidelity: 'Нужна правка. «Широкая дорога» неоправданно конкретизирует образ: πάροδος означает путь/проход, но не обязательно широкую дорогу. В обороте о Павле «достоин всякого почитания» смещает ἀξιομακάριστος к почестям; речь о том, что он достоин всякого прославления/ублажения. Пассивный оттенок «получил доброе свидетельство» лучше передать как свидетельство, данное о нём.'
  naturalness: После устранения «широкой дороги» и небольшого выравнивания синтаксиса текст остаётся современным литературным русским, сохраняя сжатый, торжественный строй послания. «Кого ведут на смерть к Богу» намеренно сохраняет необычную направленность образа, а не заменяет её доктринальным истолкованием.
  terminology: '«Посвящены в тайны» точнее передаёт μύσται, чем общее «причастны тайнам», но сноска необходима: слово не позволяет решить, идёт ли речь о конкретных обрядах или об образе посвящения. «Достигну Бога» следует сохранить как характерную для Игнатия формулу.'
  issues:
