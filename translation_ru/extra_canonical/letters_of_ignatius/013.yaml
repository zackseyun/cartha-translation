revisions:
- from: 'Я знаю, кто я и кому пишу. Я — осуждённый узник, а вы помилованы; я в опасности, а вы утверждены.


    Вы — широкая дорога для тех, кто идёт на смерть к Богу.[a] Вы вместе с Павлом причастны тайнам[b] — с Павлом, который был освящён, получил доброе свидетельство и достоин всякого почитания. Я хотел бы оказаться идущим по его стопам, когда достигну Бога.[c] В каждом послании он вспоминает о вас во Христе Иисусе.'
  to: 'Я знаю, кто я и кому пишу. Я — приговорённый; вы же помилованы. Я в опасности, вы утверждены.


    Вы — путь тех, кого ведут на смерть к Богу.[a] Вы вместе с Павлом посвящены в тайны[b] — с Павлом, который был освящён, о котором было доброе свидетельство и который достоин всякого прославления. Хотел бы я оказаться идущим по его следам, когда достигну Бога.[c] В каждом из своих посланий он упоминает вас во Христе Иисусе.'
