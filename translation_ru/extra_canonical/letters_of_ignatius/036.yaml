review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. Образ πλοκή передан неточно: в черновике венец оказывается «увенчанным», тогда как речь о духовном венце/сплетении, образуемом пресвитерием. Кроме того, в среднерецензионном греческом тексте во втором сравнении после «Христу и Отцу» имеется «и Духу»; английский контрольный текст в предоставленном аудиторском следе этого слова не отражает.'
  naturalness: В целом стиль достоин и понятен, но сочетание «достойно увенчанным духовным венцом» семантически неудачно. «Чтобы было единство и плоти, и духа» допускает менее точное прочтение, будто плоть и дух являются двумя объектами единства; лучше сохранить два качества единства.
  terminology: «Епископ», «пресвитерий» и «диаконы» переданы последовательно. «Установления» допустимо для δόγματα в данном контексте. «Дух» следует писать с прописной буквы в обоих триадических перечислениях. Скобки вокруг «по плоти» и пояснительная сноска должны быть сохранены как сигнал текстовой неопределённости.
  issues:
  - severity: medium
    issue: Неточная передача образа духовного венца пресвитерия
    rationale: «Достойно увенчанный ... венец» означает венец, на который возложен другой венец. Исходный образ говорит о подобающим образом сплетённом духовном венце, относимом к пресвитерию.
  - severity: high
    issue: Пропущено «и Духу» во втором сравнении
    rationale: 'Это чтение присутствует в среднерецензионном греческом тексте: апостолы сопоставляются с послушанием Христу, Отцу и Духу. Его отсутствие в английском witness является расхождением аудиторского следа с греческим источником.'
  - severity: low
    issue: Двусмысленное выражение о единстве плоти и духа
    rationale: Формула «единство и плоти, и духа» может описывать единство самих плоти и духа. Греческое выражение характеризует единство как телесное и духовное.
  revised_text: 'Итак, приложите все старания, чтобы утвердиться в установлениях Господа и апостолов, дабы преуспевать во всём, что вы делаете: во плоти и духе, в вере и любви, в Сыне, Отце и Духе, в начале и в конце, — вместе с вашим досточтимым епископом, с духовным венцом вашего пресвитерия, подобающим образом сплетённым, и с диаконами, живущими по Богу.


    Повинуйтесь епископу и друг другу, как Иисус Христос — Отцу [по плоти][a], а апостолы — Христу, Отцу и Духу, чтобы единство было и телесным, и духовным.'
  revised_footnotes:
  - marker: a
    text: Слова «по плоти» оставлены в квадратных скобках вслед за предоставленным текстовым свидетельством; их точный текстологический статус требует непосредственной сверки по греческой рукописной традиции.
    reason: Скобки сохранены как явный текстологический сигнал исходного свидетельства; они не должны быть устранены или истолкованы без специального исследования.
  revision_rationale: Исправлен образ духовного венца пресвитерия, уточнено выражение о телесном и духовном единстве и восстановлено «и Духу» согласно среднерецензионному греческому тексту, хотя предоставленный английский audit trail его пропускает. Не добавляются догматические пояснения; необычные параллельные перечисления и скобки сохранены.
