source:
  text: 'Do your diligence therefore that ye be confirmed in the ordinances of the Lord and of the Apostles, that ye may prosper in all things whatsoever ye do in flesh and spirit, by faith and by love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, and with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, as Jesus Christ was to the Father [according to the flesh], and as the Apostles were to Christ and to the Father, that there may be union both of flesh and of spirit.'
