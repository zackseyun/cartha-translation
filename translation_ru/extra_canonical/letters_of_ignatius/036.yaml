base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: ru
  text: 'Итак, приложите все старания, чтобы утвердиться в установлениях Господа и апостолов и преуспевать во всём, что вы делаете плотью и духом, верой и любовью, в Сыне, Отце и Духе, в начале и в конце, вместе с вашим почитаемым епископом, с достойно увенчанным духовным венцом вашего пресвитерия и с диаконами, живущими по Богу.


    Повинуйтесь епископу и друг другу, как Иисус Христос — Отцу [по плоти][a], а апостолы — Христу и Отцу, чтобы было единство и плоти, и духа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «по плоти» оставлены в квадратных скобках вслед за предоставленным текстовым свидетельством; их точный статус требует непосредственной сверки с греческой рукописной традицией.
    reason: Исходные данные прямо отмечают сохранение скобок как текстового сигнала и сообщают, что проверка по греческому источнику ещё не завершена.
lexical_decisions:
- source_word: ordinances
  choice: установлениях
  rationale: Передаёт обязательные наставления и предписания без излишне узкого юридического или обрядового оттенка.
- source_word: prosper
  choice: преуспевать
  rationale: Сохраняет широкий смысл благополучного успеха во всём совершаемом, не сводя его к материальному процветанию.
- source_word: fitly wreathed spiritual circlet
  choice: достойно увенчанным духовным венцом
  rationale: Сохраняет образ венка или венца как метафору коллегии пресвитеров, придающей окружению епископа стройность и честь.
- source_word: presbytery
  choice: пресвитерия
  rationale: Обозначает коллегию пресвитеров, а не здание или позднейшую конфессиональную структуру.
- source_word: walk after God
  choice: живущими по Богу
  rationale: Естественная русская передача семитизированной метафоры хождения, сохраняющая смысл богосообразной жизни.
- source_word: union
  choice: единство
  rationale: Естественно выражает соединённость общины как в телесной, так и в духовной стороне её жизни.
theological_decisions:
- issue: Соотношение Сына, Отца и Духа
  choice: «в Сыне, Отце и Духе» без добавочного пояснения
  alternative: Уточнить формулой, выражающей более позднюю систематическую терминологию
  rationale: Сохранена необычная последовательность и формулировка свидетельства без гармонизации с позднейшими догматическими формулами.
- issue: Послушание Иисуса Христа Отцу
  choice: сохранить «[по плоти]» в квадратных скобках
  alternative: Включить слова без скобок или удалить их
  rationale: Скобки передают текстовый сигнал английского свидетельства; прямое исследование греческой рукописной традиции пока не проведено.
- issue: Послушание епископу и взаимное послушание
  choice: «Повинуйтесь епископу и друг другу»
  alternative: Ослабить до «уважайте» или усилить административным толкованием
  rationale: Передан прямой призыв к послушанию без привнесения поздней модели церковного управления.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис слегка упрощён ради ясности, но сохранены параллелизм, церковно-общинная терминология и необычные богословские формулировки. Проект предварительный, поскольку доступная основа — англоязычное общественное достояние, а прямая проверка греческого текста ожидается.
