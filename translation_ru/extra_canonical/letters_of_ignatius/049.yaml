base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: ru
  text: Но если, как говорят некоторые безбожники, то есть неверующие, Он страдал лишь по видимости, сами будучи одной лишь видимостью, то почему я в узах? И почему я желаю сразиться с дикими зверями? Тогда я умираю напрасно. Значит, я и в самом деле лгу о Господе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless, that is unbelievers
  choice: безбожники, то есть неверующие
  rationale: Сохранено авторское пояснение и резкая полемическая характеристика; современная русская формулировка не добавляет конфессионального оттенка.
- source_word: suffered only in semblance
  choice: страдал лишь по видимости
  rationale: Передаёт утверждение о кажущемся, а не действительном страдании, не вводя позднейшего богословского термина.
- source_word: being themselves mere semblance
  choice: сами будучи одной лишь видимостью
  rationale: Сохранена намеренная словесная перекличка с «по видимости» и острота авторской иронии.
- source_word: in bonds
  choice: в узах
  rationale: Достоинственный и привычный для раннехристианского контекста эквивалент, ясно обозначающий заключение.
- source_word: fight with wild beasts
  choice: сразиться с дикими зверями
  rationale: Прямо передаёт образ предстоящего столкновения на арене, не конкретизируя то, чего свидетельство не уточняет.
- source_word: I lie against the Lord
  choice: я ... лгу о Господе
  rationale: Естественная русская передача смысла ложного свидетельства о Господе; буквальное «лгу против Господа» звучало бы неясно.
theological_decisions:
- issue: Реальность страданий Христа
  choice: «Он страдал лишь по видимости» представлено как отвергаемое мнение оппонентов
  alternative: Терминологически обозначить это мнение как докетизм
  rationale: Текст полемизирует с отрицанием реальности страдания, но сам не употребляет позднейшего названия учения.
- issue: Связь мученичества Игнатия с истинностью его свидетельства
  choice: 'Сохранена условная логика: если страдание Христа было кажущимся, смерть Игнатия напрасна и его свидетельство ложно'
  alternative: Разъяснить подразумеваемое богословское доказательство в основном тексте
  rationale: Перевод сохраняет напряжённую аргументацию автора без добавочного толкования.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Синтаксическая цепь и риторические вопросы сохранены; архаизмы сведены к прозрачному слову «узы». Прямой разбор греческого источника ещё не выполнен, поэтому проект опирается на заявленное англоязычное публично-доменное свидетельство и остаётся предварительным.
