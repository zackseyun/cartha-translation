base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: ru
  text: 'Приветствую вас из Смирны вместе с находящимися здесь со мной церквами Божьими — с теми, кто всячески подкреплял меня и телом, и духом.


    Мои узы, которые я ношу ради Иисуса Христа, призывают вас; я же молю, чтобы мне достичь Бога. Храните согласие и молитесь друг за друга. Ведь каждому из вас, а особенно пресвитерам, надлежит ободрять душу вашего епископа — во славу Отца [и во славу] Иисуса Христа и апостолов.[a]


    Молю вас послушать меня с любовью, чтобы написанное мною не стало свидетельством против вас. И вы также молитесь обо мне, потому что по милости Божьей я нуждаюсь в вашей любви, чтобы мне удостоиться участи, которой я ревностно стремлюсь достичь, и не оказаться отвергнутым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и во славу» стоят в квадратных скобках вслед за предоставленным текстовым свидетелем, где они отмечены как восстановленные; прямая сверка с греческой рукописной традицией ещё требуется.
    reason: Сохранение текстологического сигнала источника и прозрачное указание на ограниченность основы перевода.
lexical_decisions:
- source_word: salute / ἀσπάζομαι (предположительно)
  choice: приветствую
  rationale: Естественная и достойная современная формула эпистолярного приветствия.
- source_word: refreshed
  choice: подкреплял
  rationale: Передаёт оказанную Игнатию телесную и духовную поддержку, не сводя её только к утешению.
- source_word: bonds
  choice: узы
  rationale: Сохраняет раннехристианскую эпистолярную лексику и ясно обозначает заключение автора.
- source_word: attain unto God
  choice: достичь Бога
  rationale: Сохранена напряжённая и характерная для Игнатия формулировка без истолкования её как одной лишь смерти, мученичества или спасения.
- source_word: concord
  choice: согласие
  rationale: Передаёт общинное единодушие без избыточно музыкальной метафоры слова «гармония».
- source_word: presbyters
  choice: пресвитеры
  rationale: Исторически точный церковный термин, не подменяющий устройство ранней общины позднейшими наименованиями.
- source_word: cheer the soul
  choice: ободрять душу
  rationale: Сохраняет образ души и смысл поддержки, выраженный в английском свидетеле.
- source_word: lot
  choice: участь
  rationale: Сохраняет идею назначенного удела или судьбы, не уточняя сверх источника, что речь именно о мученичестве.
- source_word: reprobate
  choice: отвергнутым
  rationale: Передаёт смысл невыдержанного испытания или неодобрения, сохраняя богословскую серьёзность без внесения специальной конфессиональной терминологии.
theological_decisions:
- issue: Фраза «достичь Бога»
  choice: Сохранить буквальную направленность к Богу
  alternative: «прийти к Богу через мученическую смерть»
  rationale: Свидетель формулирует мысль кратко и богословски насыщенно; явное упоминание мученичества было бы толкованием.
- issue: «Во славу/честь» Отца, Иисуса Христа и апостолов
  choice: Сохранить параллельную конструкцию и редакционные скобки
  alternative: Перестроить фразу так, чтобы различить виды почитания
  rationale: Источник не разъясняет характер соотношения, а квадратные скобки отмечают восстановление текста; перевод не должен устранять эту текстологическую и богословскую напряжённость.
- issue: Участь, к которой стремится автор
  choice: «участь, которой я ревностно стремлюсь достичь»
  alternative: «мученический венец»
  rationale: Более конкретная формула могла бы быть оправдана контекстом, но отсутствует в предоставленном свидетельстве.
- issue: «Свидетельством против вас»
  choice: Сохранить судебно-библейский оборот
  alternative: «основанием для вашего осуждения»
  rationale: Выбранный вариант не утверждает заранее итогового осуждения и сохраняет образ свидетельства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эпистолярным тоном. Сохранены традиционные, но понятные слова «узы», «пресвитеры» и «участь». Проект выполнен по предоставленному англоязычному публичному свидетелю и проверочному слою English POB; поскольку непосредственная сверка с греческим текстом средней редакции ещё не проведена, спорные места переданы осторожно и без ложной текстологической уверенности.
