revisions:
- from: 'Итак, я призываю вас — впрочем, не я, а любовь Иисуса Христа: питайтесь только христианской пищей и воздерживайтесь от чуждых трав, то есть от ереси.


    Ибо эти люди подмешивают яд к Иисусу Христу и обманывают других видимостью добропорядочности. Они подобны тем, кто подаёт смертельное снадобье в подслащённом мёдом вине, так что ничего не подозревающий без страха выпивает смерть с пагубным наслаждением.[a]'
  to: 'Итак, я призываю вас — впрочем, не я, а любовь Иисуса Христа — питаться только христианской пищей и воздерживаться от чуждых трав, то есть ереси.


    Ибо эти люди смешивают с Иисусом Христом смертоносное снадобье, то есть ересь, действуя убедительно, подобно тем, кто подаёт смертоносное снадобье с вином, подслащённым мёдом, чтобы незнающий без опасения принял смерть с пагубным наслаждением.'
  rationale: Восстановлено опущенное в английском свидетельстве греческое «то есть ересь» после образа смертоносного снадобья. Уточнено значение характеристики способа действия без добавления невыраженного объекта «другие». Образ вина, подслащённого мёдом, и намеренно резкая метафора принятия смерти сохранены. Сноска о непроверенности по греческому удалена, поскольку она более не соответствует проведённой проверке.
