base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: ru
  text: 'Итак, я призываю вас — впрочем, не я, а любовь Иисуса Христа — питаться только христианской пищей и воздерживаться от чуждых трав, то есть ереси.


    Ибо эти люди смешивают с Иисусом Христом смертоносное снадобье, то есть ересь, действуя убедительно, подобно тем, кто подаёт смертоносное снадобье с вином, подслащённым мёдом, чтобы незнающий без опасения принял смерть с пагубным наслаждением.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: христианская пища
  rationale: Сохранена центральная метафора питания и её противопоставление чуждым травам.
- source_word: strange herbage
  choice: чуждые травы
  rationale: Передаёт необычный растительный образ свидетельства, не сводя его к абстрактному «учению».
- source_word: heresy
  choice: ересь
  rationale: Устоявшийся русский термин, прямо поясняющий образ чуждых трав.
- source_word: show of honesty
  choice: видимость добропорядочности
  rationale: Естественно передаёт внешне честный и благонадёжный облик, служащий обману.
- source_word: deadly drug
  choice: смертельное снадобье
  rationale: «Снадобье» уместно в древнем образе смеси, которая выглядит как питьё или лекарство, но несёт смерть.
- source_word: honeyed wine
  choice: подслащённое мёдом вино
  rationale: Ясно раскрывает состав напитка и сохраняет образ приятной сладости, скрывающей яд.
- source_word: drinks in death
  choice: выпивает смерть
  rationale: Сохранена резкая олицетворённая метафора оригинального свидетельства.
theological_decisions:
- issue: Связь яда с Иисусом Христом
  choice: подмешивают яд к Иисусу Христу
  alternative: подмешивают яд в учение об Иисусе Христе
  rationale: Более буквальная формулировка сохраняет напряжённый и отчасти неоднозначный образ, не добавляя отсутствующее в свидетельстве слово «учение».
- issue: Субъект увещания
  choice: не я, а любовь Иисуса Христа
  alternative: не я, но любовь к Иисусу Христу
  rationale: Сохранён родительный оборот свидетельства без решения, означает ли он любовь Христа или любовь к Христу.
- issue: Определение чуждых трав
  choice: то есть от ереси
  alternative: каковы ереси
  rationale: Единственное число свидетельства передано прямо; пояснительная связь выражена естественно по-русски.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранена развернутая метафора пищи, трав, яда и вина; архаичные местоимения и глагольные формы не использованы.
