    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: ru
  text: 'Поскольку в ответ на мою молитву к Богу мне было даровано увидеть ваши благочестивые лица, я получил даже больше, чем просил. Нося узы в Иисусе Христе, я надеюсь приветствовать вас, если на то будет Божья воля и я окажусь достойным дойти до конца.


    Начало и в самом деле складывается хорошо — лишь бы мне достичь цели и беспрепятственно получить своё наследие. Я боюсь самой вашей любви, как бы она ни причинила мне вреда. Ведь вам легко сделать то, чего вы хотите, но мне трудно достичь Бога, если вы меня не пощадите.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly countenances
  choice: благочестивые лица
  rationale: Передаёт религиозно-нравственную характеристику адресатов без архаического оборота «боголюбезные лики».
- source_word: wearing bonds in Christ Jesus
  choice: нося узы в Иисусе Христе
  rationale: Сохраняет образ уз и тесную связь заключения Игнатия со Христом; «узы» уместно в достоинственном церковно-литературном регистре.
- source_word: reach unto the end / attain unto the goal
  choice: дойти до конца / достичь цели
  rationale: 'Сохраняется различие двух близких образов английского свидетеля: завершение пути и достижение намеченной цели.'
- source_word: receive mine inheritance
  choice: получить своё наследие
  rationale: Сохраняет библейскую метафору наследия, не уточняя её содержание сверх свидетельства.
- source_word: unless ye shall spare me
  choice: если вы меня не пощадите
  rationale: Сохраняет намеренно парадоксальную просьбу не вмешиваться из любви; значение не разворачивается толкованием в основном тексте.
theological_decisions:
- issue: Смысл выражения «достичь Бога»
  choice: достичь Бога
  alternative: прийти к Богу
  rationale: Более формальная передача сохраняет напряжённость и необычность выражения, не сводя его однозначно к смерти, мученичеству или посмертному единению.
- issue: «Конец» как завершение пути Игнатия
  choice: дойти до конца
  alternative: претерпеть до конца
  rationale: Не добавляется идея стойкости, хотя она возможна по контексту; сохраняется неопределённость доступного английского свидетельства.
- issue: Любовь римских христиан как возможный вред
  choice: как бы она не причинила мне вреда
  alternative: как бы она мне не помешала
  rationale: 'Сохранена резкость исходной мысли: помощь адресатов может воспрепятствовать цели Игнатия. Более узкое толкование не вводится.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным, раннехристианским регистром. Архаические синтаксические формы устранены, но ключевые библейские образы («узы», «наследие», «достичь Бога») сохранены. Проект предварительный: предоставлен английский публичнодоменный свидетель, а прямая сверка с греческой рукописной традицией ещё ожидается.'
