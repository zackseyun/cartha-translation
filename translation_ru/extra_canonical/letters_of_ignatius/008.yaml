base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: ru
  text: 'Некоторые с коварным злым умыслом разносят повсюду Имя, а сами делают другое, недостойное Бога. Сторонитесь таких людей, как диких зверей: это бешеные псы, кусающие исподтишка. Берегитесь их, потому что их трудно исцелить.


    Есть лишь один Врач — телесный и духовный, рождённый и нерождённый[a], Бог в человеке, истинная жизнь в смерти, и от Марии, и от Бога, сначала подверженный страданию, а затем не подверженный страданию[b], — Иисус Христос, наш Господь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «рождённый и нерождённый» (γεννητὸς καὶ ἀγέννητος). Сжатая антитеза намеренно сохранена без догматического развёртывания; «нерождённый» не следует автоматически заменять словом «несотворённый».
    reason: Передаёт спорную и лексически значимую пару терминов, сохраняя её неоднозначность.
  - marker: b
    text: 'Или: «сначала способный страдать, а потом неспособный страдать». Формула выражает последовательность состояний и не уточняет её богословское объяснение.'
    reason: Сохраняет смысл греческих παθητός и ἀπαθής без конфессионального истолкования.
lexical_decisions:
- source_word: the Name
  choice: Имя
  rationale: 'Сохранена заглавная буква и намеренная краткость свидетельства: выражение, вероятно, обозначает имя Христа и христианское исповедание, но перевод не устраняет эту смысловую ёмкость.'
- source_word: to hawk about / to peddle
  choice: торговать
  rationale: Передаёт порицаемое использование Имени ради корысти или обмана, сохраняя резкую торговую метафору.
- source_word: physician
  choice: Врач
  rationale: Современное, понятное и достойное соответствие; заглавная буква подчёркивает, что речь идёт об Иисусе Христе, без добавления отсутствующего титула.
- source_word: of flesh and of spirit
  choice: плотской и духовный
  rationale: Сохраняет антитетическую параллель и христологическую сжатость оригинального свидетельства.
- source_word: God in man
  choice: Бог в человеке
  rationale: Буквально сохраняет напряжённую формулу, не заменяя её более поздним догматическим толкованием.
- source_word: true Life in death
  choice: истинная Жизнь в смерти
  rationale: Сохранены парадокс, порядок образов и христологическое значение; заглавная буква указывает на личностное именование.
theological_decisions:
- issue: generate and ingenerate
  choice: рождённый и нерождённый
  alternative: сотворённый и несотворённый; возникший и невозникший
  rationale: «Рождённый» лучше подходит к христологическому контексту и русской богословской речи, тогда как «сотворённый» мог бы ошибочно утверждать сотворённость Христа. Слово «нерождённый» сохраняет трудную и спорную антитезу свидетельства; смысл уточнён в примечании без устранения неоднозначности.
- issue: first passible and then impassible
  choice: прежде подверженный страданию, а затем не подверженный страданию
  alternative: сначала способный страдать, а потом неспособный страдать
  rationale: Формулировка передаёт временную последовательность и различие состояний, не объясняя его через частное конфессиональное учение. «Подверженный страданию» звучит естественнее и точнее, чем буквальное «страстный».
- issue: God in man
  choice: Бог в человеке
  alternative: Бог, ставший человеком; Богочеловек
  rationale: Не добавляется идея становления и не вводится позднейший составной термин; сохранена лаконичная формула доступного свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Резкие образы («бешеные псы», «кусают исподтишка») сохранены. Христологический перечень передан ритмично и с минимальными синтаксическими добавлениями. Поскольку прямая сверка с греческим источником обозначена как ожидающая выполнения, решения намеренно не выходят за пределы представленного публичного английского свидетельства.
