revisions:
- from: 'Некоторые имеют обыкновение со злым умыслом торговать Именем, а сами делают то, что недостойно Бога. Вам следует сторониться таких людей, как диких зверей, потому что они — бешеные псы, которые кусают исподтишка. Берегитесь их, ведь их трудно исцелить.


    Есть лишь один Врач — плотской и духовный, рождённый и нерождённый[a], Бог в человеке, истинная Жизнь в смерти, Сын Марии и Сын Божий, прежде подверженный страданию, а затем не подверженный страданию[b], — Иисус Христос, наш Господь.'
