    Есть лишь один Врач — телесный и духовный, рождённый и нерождённый[a], Бог в человеке, истинная жизнь в смерти, и от Марии, и от Бога, сначала подверженный страданию, а затем не подверженный страданию[b], — Иисус Христос, наш Господь.'
  rationale: Правка устраняет отрицательную коннотацию «плотской», восстанавливает исходную формулу происхождения «и от Марии, и от Бога» и уменьшает неоправданную коммерческую конкретизацию в первом предложении. Парадоксальные христологические пары сохранены, а примечания фиксируют их трудность без навязывания доктринального решения.
