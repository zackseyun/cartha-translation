  source_fidelity: Нужна правка по непосредственной сверке с греческим текстом средней редакции. διυλισμός лучше передавать как «просеивание» (или «отсеивание»), сохраняя намеренно необычный образ, а не обобщать его до «очищения». В ἵνα κατὰ Ἰησοῦν Χριστὸν ζῶσιν выражение означает жить «согласно Иисусу Христу»; «по примеру» сужает смысл до подражания. Наконец, τῷ πάθει οὐ συγκατατίθεται буквально говорит о непринятии/несогласии со Страданием, а не прямо об отсутствии «причастности».
  naturalness: Предлагаемая редакция сохраняет образный, раннехристианский регистр, но устраняет несколько неестественное «но — очищение» и делает последнюю фразу ясной современному русскому читателю.
  terminology: «Епископ», «единство Церкви», «Царство Божье» и «раскол» уместны. «Страдания Христовы» передаёт определённое τὸ πάθος в понятном русском виде; примечание сохраняет оттенок греческого глагола συγκατατίθεται, не навязывая догматического объяснения.
  issues:
  - severity: medium
    issue: «очищение» для διυλισμός
    rationale: Греческое слово обозначает фильтрование, просеивание или отсеивание. «Очищение» является возможным выводом из образа, но не сохраняет его конкретную лексику и контраст с «разделением».
  - severity: medium
    issue: «жить по примеру Иисуса Христа»
    rationale: 'κατὰ Ἰησοῦν Χριστόν шире, чем внешнее подражание: «согласно Иисусу Христу», «по Иисусу Христу». Перевод «по примеру» интерпретативно сужает формулу.'
