base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: ru
  text: 'Сторонитесь вредных растений: их не возделывал Иисус Христос, ибо не Отец их насадил. Не то чтобы я нашёл среди вас разделение, но — просеивание.[a]


    Ибо все, кто принадлежит Богу и Иисусу Христу, пребывают с епископом; и все, кто покается и войдёт в единство Церкви, также будут принадлежать Богу, чтобы жить согласно Иисусу Христу. Не обманывайтесь, братья мои.


    Кто следует за тем, кто производит раскол, тот не наследует Царства Божьего. Кто держится чуждого учения, тот не принимает Страданий Христовых.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает «фильтрование», «просеивание» или «отсеивание». Его точный оттенок в этом противопоставлении «разделению» не вполне ясен.
    reason: Сохраняет необычную лексику διυλισμός и не превращает образ в однозначное богословское толкование.
  - marker: b
    text: 'Буквально: «не соглашается со Страданием». Греческий глагол может передавать согласие, принятие или присоединение; английское свидетельство передаёт его как «не имеет общения со Страданием».'
    reason: Указывает на отличие между греческим глаголом συγκατατίθεται и толковательной формулировкой английского свидетельства, сохраняя неоднозначность.
lexical_decisions:
- source_word: noxious herbs
  choice: вредные растения
  rationale: Сохраняет земледельческую метафору и отрицательную оценку без излишне архаичного «зелья».
- source_word: husbandry of Jesus Christ
  choice: их взрастил не Иисус Христос
  rationale: Передаёт образ возделывания естественным современным русским языком и согласуется с последующим образом насаждения Отцом.
- source_word: planting of the Father
  choice: насадил их не Отец
  rationale: Сохраняет библейскую метафору насаждения и личный субъект «Отец».
- source_word: filtering
  choice: очищение
  rationale: Английское свидетельство необычно; вероятный смысл — просеивание или отделение, выявляющее подлинных членов общины. Неопределённость отмечена сноской.
- source_word: are with the bishop
  choice: пребывают с епископом
  rationale: Сохраняет экклезиологическую формулировку без усиления её до безусловного повиновения.
- source_word: living after Jesus Christ
  choice: жить по примеру Иисуса Христа
  rationale: Естественно передаёт жизнь в соответствии со Христом, не сводя выражение лишь к хронологии или внешнему подражанию.
- source_word: maketh a schism
  choice: учиняющим раскол
  rationale: Передаёт активное создание разделения, сохраняя различие между раскольником и просто несогласным.
- source_word: strange doctrine
  choice: чуждому учению
  rationale: Передаёт учение, чуждое апостольской вере, без современного оттенка просто «странного» или необычного.
- source_word: the passion
  choice: страданиям Христовым
  rationale: В христианском контексте обозначает страдания Христа; явное дополнение делает смысл понятным русскому читателю.
theological_decisions:
- issue: Связь принадлежности Богу с единством вокруг епископа
  choice: Сохранено утверждение «кто принадлежит Богу и Иисусу Христу, пребывают с епископом»
  alternative: Ослабить до «поддерживают общение с епископом» или усилить до «повинуются епископу»
  rationale: Исходная формулировка выражает конкретную церковную связь, но сама по себе не уточняет все формы власти и послушания.
- issue: Возвращение раскольников через покаяние
  choice: «покается и войдёт в единство Церкви»
  alternative: «вернётся в общение Церкви»
  rationale: Сохраняется возможность восстановления и движение к единству без определения позднейшей канонической процедуры.
- issue: «Не причастен страданиям»
  choice: Сохранена формула причастности страданиям Христовым
  alternative: Истолковать как отсутствие участия в спасительных плодах Креста или отказ страдать вместе со Христом
  rationale: Фраза допускает богословскую многозначность; перевод не разрешает её в пользу одного толкования.
translation_notes:
  register: Современный литературный русский с умеренно церковной лексикой. Земледельческая метафора сохранена, синтаксис упрощён для ясности. Черновик остаётся предварительным, поскольку предоставлена английская публично-доменная версия, а непосредственная проверка греческого текста средней редакции ещё ожидается.
