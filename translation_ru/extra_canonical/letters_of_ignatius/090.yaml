  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: ru
  text: Игнатий, называемый также Богоносцем[a], — Поликарпу, епископу церкви смирнян, а вернее — тому, кто находится под епископским попечением Бога Отца и Господа Иисуса Христа[b]. Сердечно приветствую тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое прозвище «Феофор» обычно понимают как «Богоносец»; возможно также значение «носимый Богом».
    reason: Сохраняет смысловую неоднозначность прозвища Θεοφόρος.
  - marker: b
    text: 'Здесь обыгрываются родственные слова: Поликарп назван епископом церкви, но сам находится под высшим епископским попечением Бога Отца и Господа Иисуса Христа.'
    reason: Поясняет труднопередаваемую по-русски игру с епископской лексикой, не устраняя выраженную в тексте связь Бога Отца и Господа Иисуса Христа с этим попечением.
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: Богоносец
  rationale: Традиционная и понятная русская передача имени-прозвища, сохраняющая его связь с Богом; возможная двоякость значения отмечена в сноске.
- source_word: bishop / episcopal oversight (ἐπίσκοπος / ἐπισκοπέω)
  choice: епископ; под епископским попечением
  rationale: 'Сохраняет намеренную игру однокоренными словами: Поликарп является епископом общины, но сам пребывает под высшим попечением Бога Отца и Иисуса Христа.'
- source_word: Smyrnaeans (Σμυρναίων)
  choice: смирнян
  rationale: Естественное русское обозначение жителей древней Смирны.
- source_word: abundant greeting (πλεῖστα χαίρειν)
  choice: Сердечно приветствую тебя
  rationale: Передаёт усиленную эпистолярную формулу естественным современным русским языком без буквального, но неидиоматичного «многократно радоваться».
theological_decisions:
- issue: Отношение Бога Отца и Иисуса Христа к Поликарпу в обороте с епископской лексикой
  choice: кто находится под епископским попечением Бога Отца и Иисуса Христа
  alternative: имеющий своим епископом Бога Отца и Иисуса Христа
  rationale: Пассивная формулировка лучше сохраняет смысл надзора и пастырского попечения и не вынуждает превращать Отца и Христа в один формальный церковный сан; при этом словесная связь с «епископом» остаётся явной.
- issue: Смысл прозвища Θεοφόρος
  choice: Богоносец с указанием альтернативы в сноске
  alternative: носимый Богом
  rationale: Греческая форма допускает традиционное активное понимание «несущий Бога» и возможное пассивное «носимый Богом»; основной текст следует устойчивой русской традиции, не скрывая неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Формула приветствия сделана естественной для русского читателя; синтаксическое «а точнее» сохранено. Поскольку прямая сверка с греческим источником обозначена как ожидающая выполнения, проект осторожно учитывает засвидетельствованную греческую лексику, но не вносит в основной текст элементы, отсутствующие в предоставленном английском свидетельстве.
