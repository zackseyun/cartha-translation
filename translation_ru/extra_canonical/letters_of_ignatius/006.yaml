base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: ru
  text: 'Ибо если за короткое время я имел такое общение с вашим епископом — не по-человечески, а в Духе, — то тем более поздравляю вас, тесно соединённых с ним, как Церковь соединена с Иисусом Христом, а Иисус Христос — с Отцом, чтобы всё пребывало в согласии и единстве.


    Пусть никто не обманывается. Если кто-либо находится вне пределов жертвенника, тот лишён хлеба [Божьего].[a] Ведь если молитва одного или двух обладает такой силой, то насколько же сильнее молитва епископа и всей Церкви!


    Итак, кто не приходит на собрание, тот тем самым выказывает гордость и сам себя отделяет, ибо написано: «Бог гордым противится».[b] Поэтому будем остерегаться противиться епископу, чтобы через покорность отдать себя Богу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Божьего» в предоставленном английском свидетельстве заключены в квадратные скобки; их текстовый статус требует прямой сверки с греческой рукописной традицией.
    reason: Сохранение заявленной текстовой неопределённости источника.
  - marker: b
    text: Ср. Притч. 3:34 по греческой традиции; эта формулировка также цитируется в Иак. 4:6 и 1 Пет. 5:5.
    reason: Указание библейского источника цитаты без утверждения, из какого именно новозаветного места она заимствована.
lexical_decisions:
- source_word: converse / fellowship (Greek review pending)
  choice: общение
  rationale: Передаёт личное духовное единение, не сужая значение до разговора.
- source_word: not after the manner of men but in the Spirit
  choice: не по-человечески, а в Духе
  rationale: Сохраняет противопоставление человеческого образа общения и общения в Духе, не уточняя его догматически.
- source_word: closely joined
  choice: тесно соединённых
  rationale: Сохраняет образ прочной связи епископа, Церкви, Христа и Отца.
- source_word: precinct of the altar
  choice: пределы жертвенника
  rationale: Сохраняет метафорический и экклезиальный образ, не заменяя его позднейшим конфессиональным термином.
- source_word: congregation
  choice: собрание
  rationale: Естественно передаёт церковное собрание и не сводит выражение к зданию или учреждению.
- source_word: submission
  choice: покорность
  rationale: Передаёт добровольное непротивление и подчинение в данном контексте, сохраняя силу исходного наставления.
theological_decisions:
- issue: Значение выражения «вне пределов жертвенника»
  choice: Сохранён образ без поясняющей перефразировки
  alternative: «вне церковного общения» или «вне евхаристического собрания»
  rationale: Такие альтернативы могут верно отражать контекст, но разрешают метафору и вносят более конкретное церковно-богословское толкование, чем допускает предоставленное свидетельство.
- issue: «Хлеб [Божий]»
  choice: Слова «Божьего» сохранены в квадратных скобках
  alternative: «хлеба Божьего» без скобок или просто «хлеба»
  rationale: Квадратные скобки в предоставленном свидетельстве отмечают текстовую или редакционную неуверенность; её следует сохранить до прямой сверки с греческой традицией.
- issue: Характер подчинения епископу
  choice: Формулировка сохранена как призыв не противиться епископу и через покорность отдать себя Богу
  alternative: Объяснить это как безусловное послушание или как ограниченную административную дисциплину
  rationale: Обе интерпретации снимают напряжение текста и привносят конфессиональные уточнения, которых в свидетельстве нет.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Синтаксис умеренно формальный, но без архаизмов вроде «да не» и «каковой». Проект остаётся предварительным, поскольку предоставлена английская публично-доменная передача, а прямая проверка греческого текста средней редакции ещё не выполнена.
