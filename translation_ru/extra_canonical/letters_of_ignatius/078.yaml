review_pass:
  verdict: revise
  source_fidelity: 'Греческая среднерецензионная формулировка поддерживает основные соответствия: πάντα γὰρ ταῦτα ἔπαθεν δι’ ἡμᾶς («всё это претерпел ради нас»), ἵνα σωθῶμεν («чтобы мы спаслись»), ἔπαθεν ἀληθῶς ... ἤγειρεν ἑαυτὸν ἀληθῶς («поистине пострадал ... поистине воскресил Себя»), а также ἀσωμάτοις καὶ δαιμονικοῖς («бесплотны и демоноподобны»). Квадратные скобки следует сохранить как сигнал, унаследованный от предоставленного английского свидетеля, хотя греческая сверка не дана в критическом аппарате.'
  naturalness: Текст в целом литературен и соответствует возвышенно-полемическому регистру. Однако «сами они существуют лишь по видимости» несколько ослабляет намеренную игру греческого τὸ δοκεῖν («видимость/кажимость»), которая повторяет характеристику мнимого страдания. «Сами они — одна видимость» естественнее по-русски и лучше сохраняет эту риторическую симметрию.
  terminology: «Поистине», «бесплотны» и «демоноподобны» удачны. Возвратное «воскресил Себя» оправдано греческим активным ἤγειρεν ἑαυτόν и английским audit trail; заменять его на непереходное «воскрес» не следует.
  issues:
  - severity: low
    issue: Ослаблена повторная игра на «видимости».
    rationale: Греческое αὐτοὶ ὄντες τὸ δοκεῖν буквально и риторически представляет оппонентов как саму «видимость/кажимость». Формулировка о существовании «лишь по видимости» передаёт общий смысл, но менее точно воспроизводит повтор ключевого образа.
  revised_text: Ведь всё это Он претерпел ради нас [чтобы мы спаслись]. Он пострадал поистине, как и воскресил Себя поистине, — не так, как говорят некоторые неверующие, будто Он пострадал лишь по видимости, тогда как сами они — одна видимость. И как они мыслят, так с ними и случится, ибо они бесплотны и демоноподобны.
  revised_footnotes: []
