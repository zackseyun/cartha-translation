  to: Ведь всё это Он претерпел ради нас [чтобы мы спаслись]. Он пострадал поистине, как и воскресил Себя поистине, — не так, как говорят некоторые неверующие, будто Он пострадал лишь по видимости, тогда как сами они — одна видимость. И как они мыслят, так с ними и случится, ибо они бесплотны и демоноподобны.
