base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: ru
  text: Ведь всё это Он претерпел ради нас [чтобы мы спаслись]. Он пострадал поистине, как и воскресил Себя поистине, — не так, как говорят некоторые неверующие, будто Он пострадал лишь по видимости, тогда как сами они — одна видимость. И как они мыслят, так с ними и случится, ибо они бесплотны и демоноподобны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: suffered / Greek ἔπαθεν (source-language review pending)
  choice: претерпел / пострадал
  rationale: «Претерпел» естественно охватывает всё перечисляемое ранее, а повторное «пострадал» ясно передаёт утверждение реальности страданий.
- source_word: truly / Greek ἀληθῶς (source-language review pending)
  choice: поистине
  rationale: Сохраняет настойчивое противопоставление подлинного страдания и воскресения одной лишь видимости.
- source_word: in semblance / Greek δοκεῖν (source-language review pending)
  choice: лишь по видимости
  rationale: Передаёт полемику против представления о кажущемся, а не действительном страдании и сохраняет повтор словесного мотива в следующей части фразы.
- source_word: bodiless
  choice: бесплотны
  rationale: Краткий и традиционно понятный русский эквивалент, не добавляющий объяснения природы этого состояния.
- source_word: demon-like
  choice: демоноподобны
  rationale: Передаёт уподобление демонам, не отождествляя оппонентов с демонами.
theological_decisions:
- issue: Реальность страданий и воскресения Христа
  choice: «пострадал поистине, как и воскресил Себя поистине»
  alternative: «действительно пострадал и действительно воскрес»
  rationale: Сохранены параллелизм и усиленное утверждение подлинности обоих событий; возвратная конструкция следует предоставленному свидетельству «raised Himself» и не заменяется богословски сглаженным пассивом.
- issue: Условно восстановленный фрагмент о спасении
  choice: '[чтобы мы спаслись]'
  alternative: «чтобы спасти нас» без скобок
  rationale: Квадратные скобки сохраняют поданный в исходном свидетельстве сигнал текстуального восстановления и не выдают восстановленный текст за бесспорный.
- issue: Высказывание о судьбе оппонентов
  choice: «как они мыслят, так с ними и случится»
  alternative: «во что они верят, то с ними и произойдёт»
  rationale: «Мыслят» осторожнее передаёт интеллектуальную позицию и сохраняет связь между их учением о призрачности и предрекаемой им участью, не конкретизируя её сверх свидетельства.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианской полемики. Повтор «поистине» и игра на «видимости» намеренно сохранены. Проект предварительный: он основан на предоставленном англоязычном свидетельстве J. B. Lightfoot и консультационном English POB; непосредственная сверка со среднерецензионным греческим текстом ещё требуется. Квадратные скобки являются текстологическим сигналом исходного свидетельства, а не маркером сноски.'
