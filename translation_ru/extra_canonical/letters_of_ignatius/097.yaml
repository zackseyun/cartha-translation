lexical_decisions:
- source_word: ἡ ἐκκλησία ἡ οὖσα ἐν Ἀντιοχείᾳ τῆς Συρίας (reconstructed from the middle-recension Greek tradition)
  choice: церковь в сирийской Антиохии
  rationale: Естественная современная русская конструкция, сохраняющая географическое уточнение.
- source_word: εἰρήνην ἔχειν
  choice: обрела мир
  rationale: Передаёт церковный мир и прекращение тревожных обстоятельств, не уточняя их природу сверх свидетельства.
- source_word: διὰ πάθους
  choice: через страдание
  rationale: Сохраняет выраженную у Игнатия связь ученичества и достижения Бога со страданием, не смягчая её и не конкретизируя как мученичество без необходимости.
- source_word: θεοδρόμος
  choice: Божьим вестником
  rationale: Контекст требует посланника, отправляющегося в Сирию; буквальные варианты вроде «богоносный бегун» были бы неясны современному читателю.
- source_word: σχολάζει τῷ θεῷ
  choice: посвящает своё время Богу
  rationale: Передаёт идею предоставления себя и своего времени Богу; буквальное «имеет досуг для Бога» в современном русском вводило бы неверный оттенок праздности.
- source_word: θεοπρεπὴς εὐποιΐα
  choice: доброе дело, достойное Бога
  rationale: Сохраняет нравственную оценку поступка и его богоприличный характер без конфессионально нагруженной терминологии.
theological_decisions:
- issue: Достижение Бога через страдание
  choice: «если только через страдание я достигну Бога»
  alternative: «если через мученичество мне суждено прийти к Богу»
  rationale: Выбранный вариант сохраняет условность и широкое значение страдания, не превращая подразумеваемое мученичество в прямо высказанное утверждение.
- issue: Роль молитв и ходатайства адресатов
  choice: «благодаря вашим молитвам» и «по вашему ходатайству»
  alternative: свести оба выражения к «по вашим молитвам»
  rationale: 'Различение формулировок сохраняет два смысловых акцента свидетельства: молитвы связаны с миром Антиохийской церкви, а ходатайство — с признанием Игнатия учеником.'
- issue: Соотношение Божьего и человеческого действия
  choice: «Это дело Божье и вместе с тем ваше»
  alternative: «Это Божье дело, которое вы должны исполнить»
  rationale: Сохраняется напряжение между Божьей инициативой и ответственностью общины, без подчинения одного аспекта другому.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Обращение к Поликарпу сохранено в единственном числе, к общине — во множественном. Архаизмы и тяжёлые кальки устранены, но условность, богословская напряжённость и риторическая настойчивость оригинального свидетельства сохранены.
