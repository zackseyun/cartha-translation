revisions:
- from: 'И о прочих людях непрестанно молитесь, ведь для них ещё есть надежда на покаяние, чтобы они обрели Бога. Поэтому позвольте им учиться хотя бы на ваших делах.


    На их вспышки гнева отвечайте кротостью; на надменные речи — смирением; на злословие — молитвами; их заблуждениям противопоставляйте твёрдость в вере; их свирепости — незлобивость. И не стремитесь подражать им, воздавая тем же.


    Своим долготерпением покажем, что мы им братья. Но будем ревностно подражать Господу, состязаясь друг с другом в том, кто претерпит бо́льшую несправедливость, кто позволит лишить себя своего, кто перенесёт презрение, — чтобы среди вас не нашлось ни одного ростка дьявола. Но во всякой чистоте и воздержании пребывайте в Иисусе Христе — и плотью, и духом.'
