base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: ru
  text: 'И о прочих людях непрестанно молитесь: ведь в них есть надежда на покаяние, чтобы они обрели Бога. Поэтому позвольте им хотя бы на ваших делах учиться.


    На вспышки их гнева отвечайте кротостью; на их надменные речи — смирением; на их оскорбления — молитвами; перед лицом их заблуждений будьте твёрды в вере; перед лицом их свирепости — мягки. И не стремитесь воздавать им тем же, подражая им.


    Своей снисходительностью покажем, что мы им братья. Но будем ревностно подражать Господу, состязаясь друг с другом: кто претерпит большую несправедливость, кто позволит лишить себя своего, кто перенесёт унижение, — чтобы в вас не оказалось растения дьявола. Но во всякой чистоте и самообладании пребывайте во Христе Иисусе — и плотью, и духом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the rest of mankind
  choice: прочие люди
  rationale: Естественная современная формулировка, сохраняющая отличие адресатов от окружающих их людей без отчуждающего оттенка.
- source_word: find God
  choice: обрели Бога
  rationale: «Обрести» передаёт духовный смысл нахождения Бога и соответствует достоинству стиля.
- source_word: take lessons ... from your works
  choice: учиться ... на ваших делах
  rationale: Передаёт мысль о нравственном наставлении через видимый образ жизни, а не через формальное обучение.
- source_word: railings
  choice: злословие
  rationale: Охватывает оскорбительную, хулительную речь и хорошо вписывается в параллельный ряд.
- source_word: steadfast in the faith
  choice: твёрдость в вере
  rationale: Сохраняет конфессионально нейтральный смысл стойкости, не уточняя содержание заблуждений.
- source_word: gentle
  choice: незлобивость
  rationale: В данном противопоставлении свирепости обозначает отсутствие враждебной ответной реакции; не дублирует уже употреблённую «кротость».
- source_word: forbearance
  choice: долготерпение
  rationale: Передаёт терпеливое перенесение враждебности и сохраняет раннехристианский нравственный регистр.
- source_word: herb of the devil
  choice: росток дьявола
  rationale: Сохраняет растительную метафору, но избегает современного узкого восприятия слова «трава».
- source_word: temperance / self-control
  choice: воздержание
  rationale: Традиционное и понятное обозначение самообладания и сдержанности, не ограниченное одной областью поведения.
theological_decisions:
- issue: Надежда на покаяние окружающих
  choice: «для них ещё есть надежда на покаяние»
  alternative: «в них есть надежда покаяния»
  rationale: Выражение передаёт возможность их покаяния, не утверждая ни его неизбежности, ни наличия некой внутренней добродетели.
- issue: Подражание Господу через добровольное перенесение обиды и утраты
  choice: Сохранён парадоксальный призыв «состязаться» в перенесении несправедливости
  alternative: Обобщить как призыв к смирению
  rationale: 'Исходное богословско-нравственное напряжение не сглаживается: подражание Господу выражается в отказе от возмездия и готовности терпеть ущерб.'
- issue: Единство телесного и духовного пребывания во Христе
  choice: «и плотью, и духом»
  alternative: «телом и духом»
  rationale: «Плоть» сохраняет раннехристианскую антропологическую лексику; конструкция не противопоставляет плоть духу, а включает всего человека.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены риторический параллелизм, императивность и растительная метафора. Поскольку прямой анализ греческого текста ещё не проведён, спорные места не снабжены ложной филологической уверенностью; проект основан на указанном публичном английском свидетельстве с осторожной сверкой смысловых параллелей.
