  source_fidelity: 'Греческая среднерецензионная формулировка в ключевом месте имеет ἀποθνῄσκουσιν («умирают»), а не значение принудительной казни. Поэтому «предаются смерти» чрезмерно конкретизирует текст. Остальные основные соответствия сохранены: οἰκοφθόροι передано как разрушающие/растлевающие семьи, κακὴ διδασκαλία — «злое учение», πίστις θεοῦ — без разрешения неоднозначного родительного отношения, πῦρ ἄσβεστον — «неугасимый огонь».'
  naturalness: Исправленный текст сохраняет современный литературный русский и возвышенный увещевательный регистр. «Умирают» естественно и точно передаёт глагол оригинала; «осквернившись» не навязывает более узкое рефлексивное действие, чем греческое «оказавшись в скверне/нечистоте».
  terminology: «Царство Божье», «по плоти», «вера Божья» и «неугасимый огонь» уместны в данном раннехристианском контексте. Сноска к «вере Божьей» сохраняет возможную неоднозначность πίστις θεοῦ. Сноска к «семьям» уточнена по греческому οἰκοφθόροι и не утверждает недоступность греческой проверки.
