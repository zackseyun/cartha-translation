base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: ru
  text: 'Не обманывайтесь, братья мои. Те, кто растлевает семьи,[a] не наследуют Царства Божьего.


    Если умирают те, кто совершает подобное по плоти, то насколько же более — человек, который злым учением извращает веру Божью,[b] ради которой был распят Иисус Христос. Такой человек, осквернившись, войдёт в неугасимый огонь; и точно так же — тот, кто его слушает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. οἰκοφθόροι: буквально «губители дома (домашнего хозяйства)»; слово может обозначать тех, кто разрушает или нравственно разлагает семью либо домашнее сообщество.'
    reason: Сохраняет широту редкого греческого слова, не сводя его исключительно к буквальному разрушению жилища или к одному конкретному виду проступка.
  - marker: b
    text: Выражение «вера Божья» может означать веру, обращённую к Богу, веру, данную Богом, или веру, принадлежащую Ему; перевод сохраняет эту неоднозначность.
    reason: Родительный падеж в греч. πίστις θεοῦ допускает несколько отношений; контекст не требует выбрать одно из них.
lexical_decisions:
- source_word: Corrupters of houses
  choice: те, кто растлевает семьи
  rationale: Передаёт вред, наносимый домашнему сообществу, не сужая смысл до повреждения зданий; ввиду отсутствия прямой сверки с греческим формулировка отмечена сноской.
- source_word: after the flesh
  choice: по плоти
  rationale: Сохранён раннехристианский богословский оборот и его возможная неоднозначность.
- source_word: evil doctrine
  choice: злым учением
  rationale: Естественно по-русски передаёт вредоносное или ложное наставление, не добавляя конфессиональной конкретизации.
- source_word: the faith of God
  choice: веру Божью
  rationale: 'Сохранена неоднозначность конструкции: это может быть вера, относящаяся к Богу, происходящая от Бога или принадлежащая Ему.'
- source_word: unquenchable fire
  choice: неугасимый огонь
  rationale: Устоявшийся и понятный библейский оборот, точно сохраняющий образ.
- source_word: hearkeneth unto him
  choice: тот, кто его слушает
  rationale: Передаёт не просто слышание, а принятие наставления, не усиливая смысл до полного повиновения.
theological_decisions:
- issue: Смысл выражения «вера Божья»
  choice: Сохранить форму «веру Божью»
  alternative: «веру в Бога» или «веру, данную Богом»
  rationale: Исходное английское свидетельство допускает несколько отношений родительного падежа; без прямой проверки греческого нельзя безосновательно выбрать одно.
- issue: Сопоставление телесного проступка и ложного учения
  choice: Сохранить риторическое «тем более» без добавления явного сказуемого
  alternative: «тем более заслуживает смерти»
  rationale: Так сохраняется напряжённая эллиптическая конструкция и не вводится прямое предписание казни, которого формально нет в представленном тексте.
- issue: Последствие для слушающего ложного учителя
  choice: Сохранить одинаковую участь учителя и слушателя
  alternative: Смягчить до общего предупреждения
  rationale: Свидетельство прямо распространяет последствие и на того, кто слушает.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского увещания. Формы «братья», «Царство Божье», «по плоти» и «неугасимый огонь» сохраняют библейско-церковный регистр, оставаясь понятными современному читателю. Проект предварительный: представленное source evidence является английским публичным свидетельством; прямая проверка греческой среднерецензионной традиции ещё необходима.'
