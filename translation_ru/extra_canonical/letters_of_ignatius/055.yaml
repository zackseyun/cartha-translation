  terminology: «Возлияние», «жертвенник», «слово Божье» и «голос» сохранены удачно. «Епископ из Сирии» точно передаёт сирийское происхождение Игнатия, не приписывая ему титул епископа всей Сирии. «Закатиться… чтобы взойти» воспроизводит пару δῦναι / ἀνατείλω без богословского переосмысления.
