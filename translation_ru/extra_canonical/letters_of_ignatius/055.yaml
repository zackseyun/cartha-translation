base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: ru
  text: 'Я хочу, чтобы вы угождали не людям, а Богу, как вы Ему и угождаете. Ведь мне уже никогда не представится такой возможности достичь Бога, а вам, если вы промолчите, — быть отмеченными за более благородное дело.[a] Ибо если вы промолчите и оставите меня одного, я — слово Божье; если же возжелаете моей плоти, то снова стану лишь голосом.[b]


    Не даруйте мне ничего иного, кроме возможности быть излитым Богу как возлияние, пока жертвенник ещё готов. Тогда, составив в любви единый хор, вы воспоёте Отцу в Иисусе Христе за то, что Бог удостоил епископа из Сирии оказаться на Западе, призвав его с Востока. Хорошо мне закатиться, уйдя из мира к Богу, чтобы взойти к Нему.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть записанными в более благородном деле»; вероятно, речь о том, что их молчаливое невмешательство будет признано особенно благородным поступком.'
    reason: Передаёт образ ἀναγραφῆναι («быть записанными, отмеченными») и сохраняет осторожность в толковании.
  - marker: b
    text: 'В оригинале противопоставлены «слово» (λόγος) и «голос» (φωνή): если община не воспрепятствует его пути, его смерть станет Божьим словом; если же сохранит его телесную жизнь, он останется лишь голосом. Метафора намеренно кратка и допускает оттенки смысла.'
    reason: Обозначает словесное противопоставление, не выдавая одно истолкование за исчерпывающее.
  - marker: c
    text: 'Здесь использован образ солнца: Игнатий идёт на запад, где его земная жизнь «закатится», чтобы он «взошёл» к Богу.'
    reason: Поясняет связь глаголов δῦναι («зайти, закатиться») и ἀνατείλω («взойти») с направлением его пути, не добавляя в текст новых смысловых элементов.
lexical_decisions:
- source_word: ἀνθρωπαρεσκῆσαι
  choice: угождали людям
  rationale: Передаёт идею стремления снискать человеческое одобрение без тяжеловесного буквального «быть человекоугодниками».
- source_word: θεοῦ ἐπιτυχεῖν
  choice: достичь Бога
  rationale: Сохраняет характерное для Игнатия выражение и его богословскую напряжённость, не сводя его к более узкому толкованию вроде «принять мученическую смерть».
- source_word: ἀναγραφῆναι
  choice: быть вписанными
  rationale: Сохраняет образ официальной записи или признания; смысл получения доброй славы поясняется сноской.
- source_word: λόγος θεοῦ / φωνή
  choice: слово Божье / лишь голос
  rationale: Сохраняет намеренное противопоставление осмысленного слова и простого голоса (звука), не устраняя его загадочности.
- source_word: σπονδισθῆναι
  choice: быть излитым Богу как возлияние
  rationale: Воспроизводит жертвенный образ возлияния и естественно связывает его с готовым жертвенником.
- source_word: δῦναι / ἀνατείλω
  choice: закатиться / взойти, чтобы воссиять
  rationale: Сохраняет связанный с движением солнца образ ухода с запада и нового восхождения к Богу.
theological_decisions:
- issue: Значение «достичь Бога» в контексте предстоящего мученичества
  choice: достичь Бога
  alternative: принять мученическую смерть и прийти к Богу
  rationale: Исходная формула шире своего непосредственного мученического контекста; перевод не должен подменять образ его истолкованием.
- issue: Самоопределение Игнатия как «слова Божьего»
  choice: я стану словом Божьим
  alternative: я буду Божьей вестью
  rationale: Буквальный образ сохраняет напряжённое противопоставление λόγος и φωνή; вариант «весть» чрезмерно разъясняет метафору.
- issue: Образ жертвенника и возлияния
  choice: сохранить культовую образность без догматического пояснения
  alternative: прямо назвать казнь жертвоприношением
  rationale: Игнатий метафорически осмысляет свою смерть, но текст не требует разворачивать метафору в отдельное учение о мученичестве.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Архаизмы сведены к минимуму, но сохранены ключевые жертвенные и поэтические образы. Формы обращения передают множественное число. Поскольку в карточке указано, что прямая сверка с греческим источником ещё ожидается, решения ориентированы на засвидетельствованный текст средней редакции и проверяемые греческие формулировки, при сохранении отмеченной неоднозначности.
