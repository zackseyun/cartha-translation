base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: ru
  text: 'Если ты любишь тех, кто охотно учится, это не ставится тебе в заслугу. Лучше кротостью покоряй более тяжело больных. Не всякая рана лечится одной и той же мазью. Острые боли унимай примочками.


    Во всём будь благоразумен, как змея, и всегда простодушен, как голубь. Ты телесен и духовен, чтобы с тем, что перед твоими глазами, обращаться снисходительно[a]; а о невидимом молись, чтобы оно открылось тебе. Тогда ни в чём не будешь иметь недостатка, но будешь изобиловать всяким духовным даром.


    Ты нужен времени, как кормчим нужны ветры, а застигнутому бурей мореходу — гавань, чтобы тебе достичь Бога. Сохраняй трезвость, как атлет Божий. Награда — нетление и вечная жизнь, в которой и ты убеждён. Я и мои узы — выкуп за тебя; ты полюбил эти узы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может означать также «тактично угождать», «применяться». Здесь он не обязательно имеет современный отрицательный оттенок слова «льстить».
    reason: Передаёт смысловой диапазон κολακεύῃς и не закрепляет спорный оттенок в основном тексте.
lexical_decisions:
- source_word: μαθητάς (reflected by “scholars/students” in the supplied witness)
  choice: учеников
  rationale: В раннехристианском контексте речь идёт об учениках или подопечных, а не о школьниках либо учёных.
- source_word: λοιμοτέρους
  choice: более трудных
  rationale: Буквально слово может обозначать более пагубных или зловредных людей; «более трудных» естественно передаёт пастырский контекст, не превращая характеристику в окончательный приговор человеку.
- source_word: ἐμπλάστρῳ / ἐμβροχαῖς
  choice: мазью / примочками
  rationale: Сохранён медицинский образ разных способов лечения ран и острых приступов.
- source_word: φρόνιμος / ἀκέραιος
  choice: благоразумен / простодушен
  rationale: Передаёт узнаваемое сочетание благоразумия змеи и чистой, нековарной простоты голубя.
- source_word: χάρισμα
  choice: духовным даром
  rationale: Контекст допускает «дар» или «дар благодати»; прилагательное «духовным» следует засвидетельствованному смыслу фразы и делает её ясной современному читателю.
- source_word: νῆφε
  choice: бодрствуй
  rationale: Глагол соединяет трезвенность, самообладание и бдительность; «бодрствуй» лучше сочетается с образом Божьего атлета, чем буквальное «будь трезв».
- source_word: ἀντίψυχον
  choice: отдаю за тебя душу
  rationale: Сохранена сильная идиома самоотдачи Игнатия; нейтральное «предан тебе» ослабило бы её образность.
theological_decisions:
- issue: Отношение плоти и духа
  choice: «Ты состоишь из плоти и духа»
  alternative: «Ты сделан плотским и духовным»
  rationale: Формулировка сохраняет антропологическое сочетание видимого и невидимого, не привнося противопоставления, будто плоть сама по себе порочна.
- issue: Цель требования времени
  choice: «чтобы тебе достичь Бога»
  alternative: «чтобы оно достигло Бога»
  rationale: 'Греческая синтаксическая связь естественнее относит инфинитив к адресату: Поликарп должен достичь Бога. Неясность английского местоимения не обязана переноситься в русский, если она возникает в английском свидетельстве, а не в исходной конструкции.'
- issue: Награда атлета
  choice: «Награда — нетление и вечная жизнь»
  alternative: «Ставка — нетление и вечная жизнь»
  rationale: «Награда» естественно продолжает образ атлета и не уточняет сверх текста, каким именно образом она обретается.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского пастырского наставления. Сохранены медицинские, морские и атлетические образы, а также резкая идиома самоотдачи в финале. Архаические формы обращения устранены. Поскольку в задании греческий текст не приведён и прямая сверка источника обозначена как ожидающая выполнения, решения соотносятся с указанной среднегреческой рукописной традицией и доступным английским свидетельством; перед окончательной публикацией желательна построчная проверка по критическому греческому тексту.
