revisions:
- from: 'Если ты любишь хороших учеников, в этом нет тебе заслуги. Лучше кротостью подчиняй более трудных. Не всякая рана лечится одной и той же мазью. Острые приступы успокаивай примочками.


    Во всём будь благоразумен, как змея, и всегда простодушен, как голубь. Ты состоишь из плоти и духа для того, чтобы с видимым, предстающим перед твоими глазами, обращаться сообразно обстоятельствам[a]; а о невидимом проси, чтобы оно было открыто тебе. Тогда ни в чём не будешь иметь недостатка, но будешь изобиловать всяким духовным даром.


    Нынешнее время требует тебя, как кормчие нуждаются в ветрах, а застигнутый бурей моряк — в гавани, чтобы тебе достичь Бога[b]. Бодрствуй, как Божий атлет. Награда — нетление и вечная жизнь, в которых ты и сам убеждён. Во всём я отдаю за тебя душу — и я, и мои узы, которые ты полюбил.'
