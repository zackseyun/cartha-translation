base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: ru
  text: 'Итак, те, кто отвергает благой дар Божий, погибают из-за своих пререканий. Но им следовало бы иметь любовь, чтобы и им воскреснуть.


    Поэтому вам надлежит сторониться таких людей и не говорить о них ни наедине, ни публично, но внимать Пророкам и особенно Евангелию, в котором нам явлены страдания и совершилось воскресение.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: отвергает
  rationale: Передаёт активное противление или отрицание Божьего дара естественным современным русским языком, не сводя смысл лишь к словесному спору.
- source_word: good gift of God
  choice: благой дар Божий
  rationale: Сохраняет богословски значимую и намеренно неуточнённую формулировку свидетельства.
- source_word: questionings
  choice: пререкания
  rationale: Передаёт пагубную спорливость и возражения; «вопросы» в современном русском звучало бы слишком нейтрально.
- source_word: passion
  choice: страдания
  rationale: В данном раннехристианском контексте обозначает страдания Христа; множественное число естественно для русского библейского регистра.
- source_word: is accomplished
  choice: совершилось
  rationale: Сохраняет сильное утверждение о действительном совершении воскресения, не добавляя отсутствующего субъекта действия.
theological_decisions:
- issue: К чему относится «благой дар Божий»
  choice: Оставлено без поясняющей конкретизации
  alternative: Уточнить как Евхаристию, воплощение или спасение
  rationale: Сам отрывок не называет дар прямо; конкретизация сняла бы подлинную контекстуальную неоднозначность.
- issue: Смысл «чтобы и им воскреснуть»
  choice: Сохранена связь любви и будущего воскресения без систематического пояснения
  alternative: Переформулировать как условие спасения либо как нравственное обновление уже теперь
  rationale: Фраза допускает богословское напряжение, которое перевод не должен разрешать за автора.
- issue: «В Евангелии ... воскресение совершилось»
  choice: Сохранено фактическое «совершилось»
  alternative: «Описано» или «возвещено»
  rationale: Свидетельство противопоставляет явленные страдания совершившемуся воскресению; ослабление до описания изменило бы акцент.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным раннехристианским регистром. Формы «надлежит», «внимать», «Пророки» и «Евангелие» сохраняют достоинство текста, оставаясь понятными современному читателю. Прямой анализ греческого источника недоступен; проект основан на указанном публичном английском свидетельстве и потому не вводит текстологических уточнений сверх него.
