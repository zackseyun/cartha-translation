source:
  text: 'They therefore that gainsay the good gift of God perish by their questionings. But it were expedient for them to have love, that they may also rise again.


    It is therefore meet that ye should abstain from such, and not speak of them either privately or in public; but should give heed to the Prophets, and especially to the Gospel, wherein the passion is shown unto us and the resurrection is accomplished.'
