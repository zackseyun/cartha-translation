base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: ru
  text: '[Но] избегайте разделений, как начала зол. Все следуйте епископу, как Иисус Христос — Отцу, и пресвитерию — как апостолам; диаконов же почитайте как Божью заповедь.[a] Никто без епископа да не делает ничего из того, что относится к Церкви. Достоверной Евхаристией пусть считается та, которая совершается под началом епископа или того, кому он поручит это.


    Где бы ни появился епископ, там пусть будет и собрание; подобно тому как там, где Христос Иисус, — вселенская Церковь.[b] Без епископа не дозволяется ни крестить, ни устраивать трапезу любви;[c] но всё, что он одобрит, угодно и Богу, чтобы всё, что вы делаете, было надёжным и действительным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит: «диаконов же почитайте как Божью заповедь». Необычная сравнительная формула сохранена без её истолкования как «согласно Божьей заповеди».'
    reason: Передаёт форму и смысл греческого ὡς θεοῦ ἐντολήν, не сглаживая текст.
  - marker: b
    text: «Вселенская» означает здесь всеобщую, повсеместную Церковь; соответствующее греческое слово καθολική традиционно также передают как «кафолическая».
    reason: Поясняет историческое значение термина без современного конфессионального сужения.
  - marker: c
    text: Трапеза любви — общая братская трапеза ранних христиан; её также называют агапой.
    reason: Поясняет раннехристианскую реалию, обозначенную греческим ἀγάπη.
lexical_decisions:
- source_word: bishop (Greek source review pending)
  choice: епископ
  rationale: Устоявшийся и понятный русский церковно-исторический термин; сохраняет различение между епископом, пресвитерами и диаконами.
- source_word: presbytery
  choice: пресвитеры
  rationale: В данном контексте речь идёт о совокупности пресвитеров; конкретное русское множественное число звучит естественнее абстрактного «пресвитерий» и не смешивает людей с органом управления.
- source_word: valid
  choice: действительной / действительным
  rationale: Передаёт признанность и надлежащую силу церковного действия, не подменяя текст более узким каноническим толкованием.
- source_word: universal Church
  choice: вселенская Церковь
  rationale: Передаёт смысл всеобщности Церкви и исторический церковный регистр; термин «кафолическая» был бы менее понятен обычному современному читателю.
- source_word: love-feast
  choice: трапеза любви
  rationale: Ясная передача раннехристианской агапы без предположения, что читателю знаком термин «агапа».
- source_word: people
  choice: народ
  rationale: Сохраняет коллективное обозначение общины и достоинство исходной формулировки; «община» было бы более интерпретирующим.
theological_decisions:
- issue: Смысл выражения «respect the deacons as God’s commandment»
  choice: «диаконов же почитайте как Божью заповедь»
  alternative: «почитайте диаконов согласно Божьей заповеди»
  rationale: Сохранена необычная и богословски напряжённая сравнительная конструкция свидетельства, а не предложено её сглаживающее толкование.
- issue: Роль епископа в Евхаристии
  choice: «под началом епископа или того, кому он это поручил»
  alternative: «совершённая епископом или его уполномоченным»
  rationale: Формулировка не утверждает, что епископ обязательно лично совершает Евхаристию, и сохраняет более широкий смысл надзора или полномочия.
- issue: Универсальная/кафолическая Церковь
  choice: «вселенская Церковь»
  alternative: «кафолическая Церковь»
  rationale: Выбор передаёт древний смысл всеобщности без современного конфессионального сужения.
- issue: Одобрение епископа и Божье благоволение
  choice: «всё, что он одобрит, угодно и Богу»
  alternative: «делайте только то, что одобрит епископ, ибо это угодно Богу»
  rationale: Сохранено прямое утверждение источника без добавления причинного объяснения или абсолютного правила, отсутствующего в свидетельстве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным раннехристианским церковным регистром. Синтаксис упрощён относительно английского свидетельства, но повелительность, параллелизм и терминологические различия сохранены. Черновик остаётся предварительным, поскольку предоставленное основание — английское публично-доменное свидетельство, а непосредственная сверка со среднерецензионной греческой традицией ещё не проведена.
