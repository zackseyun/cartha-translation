revisions:
- from: Итак, старайтесь совершать одну Евхаристию, ибо одна плоть у Господа нашего Иисуса Христа и одна чаша для единения в Его крови; один жертвенник, как и один епископ вместе с пресвитерами и диаконами, моими сослужителями, — чтобы всё, что вы делаете, вы делали согласно Богу.[a]
  to: Итак, старайтесь участвовать в одной Евхаристии, ибо одна плоть Господа нашего Иисуса Христа и одна чаша для единения в Его крови; один жертвенник, как и один епископ вместе с пресвитерием и диаконами, моими сослужителями, — чтобы всё, что бы вы ни делали, вы делали по Богу.[a]
  rationale: Перевод уточнён по смыслу греческих выражений, при этом сохранены повтор «одна/один», евхаристическая и церковно-устроительная связь, а также неоднозначная финальная формула. Правки не изменяют содержание свидетельства Lightfoot, но устраняют сужение значения глагола и утрату коллективного значения πρεσβυτέριον.
