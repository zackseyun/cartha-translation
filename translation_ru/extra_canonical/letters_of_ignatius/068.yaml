base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: ru
  text: Итак, старайтесь участвовать в одной Евхаристии, ибо одна плоть Господа нашего Иисуса Христа и одна чаша для единения в Его крови; один жертвенник, как и один епископ вместе с пресвитерием и диаконами, моими сослужителями, — чтобы всё, что бы вы ни делали, вы делали по Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по Богу» (греч. κατὰ θεόν). Формула может означать действие в согласии с Богом либо согласно Божьей воле; перевод сохраняет её краткость и не выбирает между этими близкими оттенками.'
    reason: Финальная греческая формула лаконична и допускает несколько близких способов передачи; сноска поясняет это, не превращая один из оттенков в основной текст.
lexical_decisions:
- source_word: one eucharist
  choice: одну Евхаристию
  rationale: Сохранён раннехристианский термин и акцент на единстве евхаристического совершения; «совершать» естественно передаёт английское observe в данном контексте.
- source_word: one flesh
  choice: одна плоть
  rationale: Формальное «плоть» сохраняет телесную и богословскую насыщенность выражения, не заменяя его более толковательным «тело».
- source_word: unto union in His blood
  choice: для единения в Его крови
  rationale: Переданы как целевая направленность («для единения»), так и необычная конструкция «в Его крови», без догматического уточнения.
- source_word: one altar
  choice: один жертвенник
  rationale: «Жертвенник» соответствует раннехристианскому сакральному контексту и не сводит образ к обычному столу.
- source_word: presbytery
  choice: пресвитерами
  rationale: Коллегиальный орган передан естественным русским множественным числом, понятным в сочетании с епископом и диаконами.
- source_word: my fellow-servants
  choice: моими сослужителями
  rationale: Передаёт совместное служение без более узкого утверждения о равенстве церковных должностей.
- source_word: after God
  choice: согласно Богу
  rationale: Сохранена краткая и несколько необычная богословская формула, а не внесено однозначное толкование вроде «по воле Божьей».
theological_decisions:
- issue: Евхаристическое единство и церковное устройство
  choice: 'Сохранена параллель: одна Евхаристия, одна плоть, одна чаша, один жертвенник и один епископ с пресвитерами и диаконами.'
  alternative: Переформулировать как общее наставление о церковном согласии.
  rationale: Исходное свидетельство явно связывает евхаристическое единство с видимым устройством общины; ослаблять эту связь переводом не следует.
- issue: Значение выражения «для единения в Его крови»
  choice: Оставлена формулировка «для единения в Его крови».
  alternative: «Чаша, объединяющая нас Его кровью» или «чаша причастия Его крови».
  rationale: Предложенные альтернативы разрешают синтаксическую и богословскую неоднозначность, тогда как исходная формула допускает несколько оттенков.
- issue: Финальная формула after God
  choice: «согласно Богу» с пояснительной сноской.
  alternative: «по воле Божьей» или «угодно Богу».
  rationale: Более гладкие варианты добавляют конкретное толкование; основной текст сохраняет напряжённую лаконичность свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского церковного наставления. Синтаксис слегка упрощён для ясности, но риторическая цепь повторов «одна/один» сохранена. Поскольку греческая сверка ещё не выполнена, решения не претендуют на окончательное установление нюансов исходной лексики.
