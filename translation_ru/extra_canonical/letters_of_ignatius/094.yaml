base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be servants of lust.'
translation:
  language: ru
  text: 'Не оставляй вдов без попечения. После Господа будь их попечителем. Пусть ничего не делается без твоего согласия; и сам ничего не делай без Бога — как ты, впрочем, и поступаешь. Будь твёрд.


    Пусть собрания проходят чаще. Разыскивай каждого по имени.


    Не пренебрегай рабами и рабынями. Но и они пусть не превозносятся, а служат ещё усерднее во славу Бога, чтобы получить от Бога лучшую свободу. Пусть они не стремятся получить свободу из общих средств[a], чтобы не оказаться рабами страсти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от общего». Вероятно, имеются в виду общие средства церковной общины, которые могли быть употреблены для выкупа из рабства.'
    reason: Примечание поясняет вероятный исторический референт τοῦ κοινοῦ, не превращая его в несомнённое значение основного текста.
lexical_decisions:
- source_word: widows
  choice: вдов
  rationale: Прямое и естественное обозначение социально уязвимой группы, о которой должна заботиться церковь.
- source_word: protector
  choice: защитником
  rationale: Передаёт личную обязанность адресата покровительствовать вдовам, не сужая смысл до одной лишь материальной помощи.
- source_word: meetings
  choice: собрания
  rationale: Нейтральное и исторически уместное обозначение церковных встреч без излишней литургической конкретизации.
- source_word: Seek out all men by name
  choice: Разыскивай каждого по имени
  rationale: Сохраняет активный смысл личного внимания ко всем членам общины; «каждого» в современном русском языке инклюзивно по контексту.
- source_word: slaves, whether men or women
  choice: рабами и рабынями
  rationale: Ясно сохраняет древний социальный статус и явное упоминание обоих полов, не подменяя рабство более мягким понятием служения.
- source_word: better freedom
  choice: лучшую свободу
  rationale: Сохраняет сравнительную и духовно напряжённую формулировку источника, не определяя преждевременно точную природу этой свободы.
- source_word: lust
  choice: страсти
  rationale: Русское «страсть» допускает широкий смысл неупорядоченного желания; более узкое «похоть» могло бы неоправданно свести мысль только к сексуальному влечению.
theological_decisions:
- issue: «После Господа» и роль адресата
  choice: После Господа будь их защитником
  alternative: Будь их защитником вслед за Господом
  rationale: Сохранён необычный порядок и возможная иерархическая оттенённость выражения, без пояснительного толкования.
- issue: Согласие Бога
  choice: без согласия Бога
  alternative: без Бога / без Божьей воли
  rationale: Формальная параллель с согласием адресата сохранена; вариант «Божья воля» был бы толковательным уточнением.
- issue: Природа «лучшей свободы»
  choice: получить от Бога лучшую свободу
  alternative: обрести у Бога высшую свободу
  rationale: Не уточняется, идёт ли речь об эсхатологической, духовной или иной свободе; сохраняется исходная богословская напряжённость.
- issue: «Рабы страсти»
  choice: оказаться рабами страсти
  alternative: стать рабами похоти
  rationale: Сохраняется игра между внешним рабским положением и внутренним порабощением желанию, без необоснованного сужения смысла.
translation_notes:
  register: Современный литературный русский язык с достойным пастырским тоном. Сохранено обращение к одному адресату во втором лице единственного числа. Императивы переданы прямо, но без архаизмов; социально-исторический термин «рабы» оставлен без эвфемизации. Поскольку прямое сопоставление с греческим текстом обозначено как ожидающее проверки, решения осторожно опираются на предоставленное английское свидетельство и не устраняют его смысловые неоднозначности.
