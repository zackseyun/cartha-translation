base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: ru
  text: Итак, мне было позволено увидеть вас в лице вашего глубоко благочестивого епископа Дамаса, достойных пресвитеров Басса и Аполлония и моего сослужителя, диакона Зотиона, которым я хотел бы порадоваться, потому что он подчиняется епископу — как благодати Божьей, а пресвитерию — как закону Иисуса Христа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через Дамаса... пресвитеров... и диакона Зотиона». Заключительное «пресвитерию» передаёт собирательное греческое обозначение коллегии пресвитеров, а не только двух названных лиц.'
    reason: Примечание поясняет синтаксис посредничества и сохраняет различие между отдельными пресвитерами в перечне и коллегиальным πρεσβυτερίῳ в заключительном сравнении.
lexical_decisions:
- source_word: godly
  choice: благочестивого
  rationale: Естественная для современного литературного русского характеристика человека, преданного Богу; не приписывает епископу божественность.
- source_word: presbyters
  choice: пресвитеров
  rationale: Сохраняет раннехристианский церковный термин и не отождествляет его без пояснения с более поздними наименованиями должности.
- source_word: fellow-servant
  choice: сослужителя
  rationale: Передаёт совместное служение автора и Зотиона; слово «сораб» звучало бы архаично и могло бы быть понято как социальный статус.
- source_word: be subject
  choice: повинуется
  rationale: Ясно передаёт добровольное признание установленного порядка и подходит к обоим последующим сравнениям.
- source_word: law
  choice: закону
  rationale: Сохраняет сильную и потенциально напряжённую формулировку свидетельства, не смягчая её до «учения» или «порядка».
theological_decisions:
- issue: Сравнение епископа с благодатью Божьей и пресвитеров с законом Иисуса Христа
  choice: 'Сохранено буквально как сравнение: «как благодати Божьей… как закону Иисуса Христа»'
  alternative: 'Истолковать функционально: «как поставленному по благодати Божьей… как хранящим закон Иисуса Христа»'
  rationale: Свидетель формулирует параллельные сравнения; добавление отношений «поставленному» или «хранящим» разрешило бы богословскую напряжённость без достаточного основания.
- issue: Значение выражения о радости в Зотионе
  choice: «Я хотел бы радоваться о нём»
  alternative: «Да будет он мне в радость»
  rationale: Выбрана понятная формулировка, сохраняющая направленность радости на Зотиона, но не навязывающая более специальный идиоматический смысл до прямой сверки с греческим.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Церковные термины «епископ», «пресвитер» и «диакон» сохранены. Длинная английская фраза разделена на два предложения ради ясности; заключительная мысль при этом остаётся синтаксически завершённой, хотя в более широком контексте главы исходный текст может продолжаться.
