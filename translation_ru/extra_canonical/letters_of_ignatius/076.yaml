base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: ru
  text: 'Игнатий, называемый также Богоносцем, — церкви Бога Отца, возлюбленной Иисусом Христом, по милости наделённой всяким дарованием, исполненной веры и любви и не нуждающейся ни в каком даровании, всецело достойной Бога и несущей святыню; церкви, находящейся в Смирне, в Азии, — в непорочном духе и слове Божьем: великий привет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Богоносец
  rationale: Традиционная и прозрачная русская передача греческого имени-прозвания Θεοφόρος; сохраняет его богословски значимую внутреннюю форму.
- source_word: grace (repeated)
  choice: дар
  rationale: В данном приветствии речь естественно понимается о дарованном Богом благе или духовном даре; «дар» позволяет по-русски сохранить повтор и избежать тяжеловесного «благодатью… ни в какой благодати».
- source_word: most reverend
  choice: достойнейшей почтения
  rationale: Передаёт высокую оценку общины без позднейшего конфессионального оттенка титула «преосвященная».
- source_word: bearing holy treasures
  choice: хранящей святые сокровища
  rationale: Естественная русская формулировка, сохраняющая образ священного достояния; точное греческое чтение требует последующей сверки.
- source_word: abundant greeting
  choice: сердечный привет
  rationale: Передаёт усиленную формулу приветствия естественным современным русским языком.
theological_decisions:
- issue: Связь определений «Бога Отца» и «Иисуса Христа, Возлюбленного» с церковью
  choice: Сохранены оба родительных определения без уточняющего союза
  alternative: «церкви Бога Отца, возлюбленной Иисусом Христом»
  rationale: Предоставленный свидетель допускает понимание церкви как принадлежащей Богу Отцу и Иисусу Христу, причём «Возлюбленный» относится ко Христу. Перевод не перестраивает синтаксис в более однозначное богословское утверждение.
- issue: Значение Theophorus
  choice: Богоносец
  alternative: носящий Бога / носимый Богом
  rationale: Само прозвание может этимологически осмысляться более чем одним способом; традиционная именная форма не разрешает эту неоднозначность пояснением в основном тексте.
- issue: «В непорочном духе и в слове Божьем»
  choice: Сохранено как обстоятельственная формула приветствия
  alternative: Отнести выражение непосредственно к характеристике церкви
  rationale: Английский свидетель синтаксически неоднозначен; пунктуация сохраняет напряжение и не закрепляет единственное толкование до сверки с греческим.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского эпистолярного приветствия. Архаизмы вроде «коей», «всяческою» и конфессионально нагруженные поздние титулы исключены. Поскольку прямой разбор греческого источника ещё не предоставлен и обозначен как ожидающий проверки, draft осторожно следует публичному английскому свидетельству, не выдавая спорные синтаксические детали за окончательно установленные.
