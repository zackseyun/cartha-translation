revisions:
- from: 'Игнатий, называемый также Богоносцем, — церкви Бога Отца и Иисуса Христа, Возлюбленного, по милости наделённой всяким даром, исполненной веры и любви и не имеющей недостатка ни в одном даре, достойнейшей почтения и хранящей святые сокровища; церкви, находящейся в Смирне, в Азии: в непорочном духе и в слове Божьем — сердечный привет.'
  to: 'Игнатий, называемый также Богоносцем, — церкви Бога Отца, возлюбленной Иисусом Христом, по милости наделённой всяким дарованием, исполненной веры и любви и не нуждающейся ни в каком даровании, всецело достойной Бога и несущей святыню; церкви, находящейся в Смирне, в Азии, — в непорочном духе и слове Божьем: великий привет.'
  rationale: 'Текст исправлен по греческим согласованиям и лексике при сохранении структуры приветствия. Формула «в непорочном духе и слове Божьем» оставлена без дополнительного синтаксического развёртывания: её связь с адресатом либо с формулой приветствия не нуждается в догматическом уточнении. «Великий привет» передаёт усиление πλεῖστα, не превращая его в эмоционально окрашенное «сердечный».'
