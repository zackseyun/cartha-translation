base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: ru
  text: 'Я увидел, что этот ваш епископ несёт служение ради общего блага не сам по себе и не через людей, и не ради тщеславия, но в любви Бога Отца и Господа Иисуса Христа. Я изумляюсь его терпению: его молчание сильнее речей других. Ведь он настроен в согласии с заповедями, как лира — со своими струнами. Поэтому душа моя благословляет его благочестивый образ мыслей, ибо я убедился, что он добродетелен и совершенен, а также невозмутим и спокоен, живя во всяком благочестивом терпении.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному английскому свидетельству Дж. Б. Лайтфута; требуется последующая сверка со среднерецензионной греческой рукописной традицией.'
    reason: В исходных данных прямо указано, что проверка по греческому тексту ещё не проведена; читателю важно обозначить ограниченность текстовой основы.
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: служение ради общего блага
  rationale: Передаёт общественную направленность служения естественным современным русским языком, не уточняя его функции сверх свидетельства.
- source_word: not of himself or through men
  choice: не сам по себе и не через людей
  rationale: Сохраняет различие двух исходных формулировок и их богословскую напряжённость, не объясняя подразумеваемый источник призвания.
- source_word: forbearance / patience
  choice: терпение
  rationale: «Терпение» понятно современному читателю и охватывает сдержанность и долготерпение; повтор сохраняет связь между частями отрывка.
- source_word: silence is more powerful
  choice: молчание сильнее
  rationale: Сохраняет выразительный парадокс оригинального свидетельства без добавочного толкования.
- source_word: attuned in harmony with the commandments
  choice: настроен в согласии с заповедями
  rationale: Удерживает музыкальную метафору и подготавливает прямое сравнение с лирой и струнами.
- source_word: godly mind
  choice: благочестивый образ мыслей
  rationale: Естественнее буквального «божественный ум» и не приписывает человеку божественную природу.
- source_word: imperturbable and calm temper
  choice: невозмутим и спокоен
  rationale: Передаёт внутреннюю устойчивость и спокойствие без архаичного психологического словаря.
theological_decisions:
- issue: Источник епископского служения
  choice: Сохранена формула «не сам по себе и не через людей» без пояснения.
  alternative: Истолковать её как прямое назначение Богом или как отрицание человеческого рукоположения.
  rationale: Свидетельство не раскрывает точного отношения между Божьим призванием и человеческим участием; конфессиональное уточнение было бы привнесением.
- issue: «В любви Бога Отца и Господа Иисуса Христа»
  choice: Сохранена синтаксическая связь любви одновременно с Богом Отцом и Господом Иисусом Христом.
  alternative: Передать как любовь, исходящую от Отца и Христа, либо как любовь к Ним.
  rationale: Формулировка допускает смысловую широту; перевод не должен однозначно разрешать направление любви без проверки греческого текста.
- issue: Благословение образа мыслей епископа
  choice: «Душа моя благословляет его благочестивый образ мыслей».
  alternative: «Прославляет его ум» или «считает его разум блаженным».
  rationale: Выбран вариант, близкий предоставленному свидетельству и не усиливающий почитание сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Сохранены риторический парадокс молчания, музыкальный образ лиры и повтор мотива терпения. Архаизмы и конфессионально окрашенная терминология не вводились; из-за отсутствия прямой сверки с греческим текстом формулировки остаются осторожными.
