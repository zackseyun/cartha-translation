    rationale: Определения «плотской и духовной» в исходной греческой конструкции по роду и числу непосредственно относятся к «любви». Безопаснее пояснить, что сохраняется необычное сочетание двух характеристик любви, не предлагая грамматически менее вероятное отнесение также к вере.
