base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: ru
  text: 'Приветствую семьи моих братьев — их жён и детей, а также дев, которых называют вдовами.[a] Желаю вам благополучия в силе Отца. Филон, находящийся со мной, приветствует вас.


    Приветствую семью Тавии и молюсь, чтобы она утвердилась в вере и в любви — плотской и духовной.[b] Приветствую Алку, чьё имя мне очень дорого, несравненного Дафна, Евтекна и каждого по имени. Будьте благополучны в благодати Божьей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «девы, которых называют вдовами» сохранено буквально: оно, вероятно, отражает особое раннехристианское наименование, но его точный смысл здесь не уточняется.'
    reason: Необходимо обозначить необычность выражения, не разрешая спорную историко-церковную идентификацию.
  - marker: b
    text: 'Буквально: «в любви плотской и духовной». Необычное сочетание характеристик любви сохранено без дополнительного истолкования.'
    reason: Определения грамматически относятся к слову «любовь»; примечание не расширяет эту связь на «веру» и не навязывает богословское объяснение.
lexical_decisions:
- source_word: households
  choice: семьи
  rationale: Современное и естественное обозначение домашних общин или домочадцев; контекст «жён и детей» поддерживает семейное значение.
- source_word: virgins who are called widows
  choice: дев, которых называют вдовами
  rationale: Буквально сохраняет необычное и, вероятно, техническое обозначение, не отождествляя самовольно дев с вдовами.
- source_word: grounded
  choice: утвердилась
  rationale: Передаёт образ прочной укоренённости естественным современным русским глаголом.
- source_word: of flesh and of spirit
  choice: по плоти, и по духу
  rationale: Сохраняет параллелизм и возможную смысловую напряжённость формулировки.
- source_word: Fare ye well / Farewell
  choice: Прощаюсь с вами / Пребывайте
  rationale: В первом случае передано эпистолярное прощание, во втором — заключительное благопожелание в связи с «благодатью Божьей».
- source_word: Alce; Daphnus; Eutecnus; Tavia; Philo
  choice: Алка; Дафн; Евтекн; Тавия; Филон
  rationale: Имена переданы в формах, соответствующих русской литературной и греческой ономастической практике, насколько позволяет предоставленное английское свидетельство.
theological_decisions:
- issue: Статус «дев, которых называют вдовами»
  choice: Сохранить формулировку без поясняющего отождествления
  alternative: Перевести как обозначение конкретного церковного чина вдов или посвящённых дев
  rationale: Предоставленное свидетельство сохраняет загадочное наименование; при отсутствии завершённой сверки с греческим текстом нельзя устранять неоднозначность.
- issue: «Любовь по плоти и по духу»
  choice: Сохранить оба определения при слове «любовь»
  alternative: Истолковать как телесное и духовное благополучие либо веру и любовь соответственно
  rationale: Синтаксис английского свидетельства допускает разные связи; буквальный параллелизм лучше сохраняет богословскую и смысловую напряжённость.
- issue: «В силе Отца»
  choice: Сохранить прямую формулу
  alternative: Передать как «силою Отца» или «под защитой Отца»
  rationale: Выражение не следует сводить к защите или благословению, поскольку оно прямо говорит о силе Отца.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Архаические «приветствую», «плоть», «дух», «благодать» сохранены там, где они являются устойчивой религиозной лексикой; устаревшие эпистолярные обороты избегаются. Проект остаётся предварительным, поскольку прямой анализ греческого текста ещё не выполнен.
