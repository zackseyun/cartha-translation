base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a servant even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: ru
  text: 'Я пишу всем церквам и объявляю всем, что добровольно умираю ради Бога — если только вы мне не помешаете. Прошу вас: не оказывайте мне неуместной доброты. Позвольте мне стать добычей диких зверей, ибо через них я могу достичь Бога. Я — Божья пшеница, и зубы диких зверей перемалывают меня, чтобы я оказался чистым хлебом [Христа][a].


    Напротив, приманите диких зверей: пусть они станут моей могилой и не оставят ничего от моего тела, чтобы, уснув, я не стал никому в тягость. Я стану истинным учеником Иисуса Христа тогда, когда мир уже не увидит даже моего тела. Молите Господа обо мне, чтобы посредством этих орудий я оказался жертвой Богу.


    Я не приказываю вам, как приказывали Пётр и Павел. Они были апостолами, а я — осуждённый; они были свободны, а я доныне раб. Но если пострадаю, то стану вольноотпущенником Иисуса Христа и воскресну в Нём свободным. Теперь, находясь в оковах, я учусь отказываться от всякого желания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Христа» в используемом английском свидетельстве заключены в квадратные скобки как текстуально не вполне уверенное восстановление; прямую сверку с греческой рукописной традицией ещё предстоит выполнить.
    reason: Сохраняет сигнал текстологической неуверенности в предоставленном свидетельстве и привязывает сноску непосредственно к отмеченному добавлению.
lexical_decisions:
- source_word: die for God
  choice: умираю ради Бога
  rationale: Сохраняет направленность смерти к Богу, не уточняя её как смерть «за веру» или «во славу», чего свидетель прямо не выражает.
- source_word: unseasonable kindness
  choice: неуместной доброты
  rationale: Передаёт парадокс просьбы не вмешиваться из сострадания именно в неподходящий для автора момент.
- source_word: attain unto God
  choice: достичь Бога
  rationale: Сохраняет сильную и прямую формулировку свидетеля без добавочного богословского истолкования.
- source_word: found
  choice: оказался
  rationale: Повторено в образах хлеба и жертвы, чтобы сохранить оттенок обнаружения или признания таковым, а не просто превращения.
- source_word: convict
  choice: осуждённый
  rationale: Естественно обозначает человека под приговором и избегает более узкого современного смысла слова «преступник».
- source_word: slave
  choice: раб
  rationale: Сохраняет резкое противопоставление свободе и последующему образу вольноотпущенника.
- source_word: freed-man
  choice: вольноотпущенник
  rationale: Точно передаёт социально-правовую метафору освобождённого раба и связь с предшествующим словом «раб».
- source_word: every desire
  choice: всякого желания
  rationale: Не сужает смысл до греховных страстей и сохраняет широкую формулировку текста.
theological_decisions:
- issue: Связь мученичества с достижением Бога
  choice: «через них я могу достичь Бога»
  alternative: «через них я могу прийти к Богу»
  rationale: Выбрана более сильная формулировка свидетеля; она сохраняет богословское напряжение и не превращает высказывание в нейтральное обозначение смерти.
- issue: Статус ученичества после смерти
  choice: «Я стану истинным учеником… тогда»
  alternative: «Тогда я поистине окажусь учеником…»
  rationale: Сохранено временное и условное звучание заявления Игнатия без попытки согласовать его с позднейшими систематическими определениями ученичества.
- issue: Жертвенный язык
  choice: «оказался жертвой Богу»
  alternative: «стал жертвой для Бога»
  rationale: Сохраняется мотив признания или обнаружения жертвой, присутствующий в свидетельстве, без уточнения характера жертвоприношения.
- issue: Свобода во Христе и воскресение
  choice: «стану вольноотпущенником Иисуса Христа и воскресну в Нём свободным»
  alternative: «буду освобождён Иисусом Христом и восстану свободным благодаря Ему»
  rationale: Сохранена метафора рабства и вольноотпущенничества, а также неоднозначная формула «в Нём», без сведения её только к причине или действующему лицу.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сделан яснее для обычного читателя, но сохранены резкие образы пшеницы, зверей, жертвы, рабства и освобождения. Черновик основан на предоставленном общественном английском свидетельстве; прямая проверка по греческому тексту средней редакции пока не проведена.
