base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: ru
  text: 'Помните в своих молитвах Церковь в Сирии, которая вместо меня имеет своим пастырем Бога. Один Иисус Христос будет её епископом — Он и ваша любовь.


    Мне же стыдно называться одним из них, потому что я недостоин: я самый последний среди них и словно родившийся не вовремя[a]. Но я был помилован, чтобы стать кем-то, если только достигну Бога[b].


    Мой дух приветствует вас, как и любовь церквей, которые принимали меня во имя Иисуса Христа не как простого путника. Ведь даже те церкви, которые не находились на моём пути по плоти[c], заранее встречали меня от города к городу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «недоносок» или «родившийся несвоевременно»; это образ крайнего самоуничижения.'
    reason: Русская развернутая формулировка передаёт образ, но примечание сохраняет его более резкую буквальную силу.
  - marker: b
    text: То есть если достигну окончательной цели — единения с Богом; в контексте мученического пути Игнатия выражение имеет эсхатологический оттенок.
    reason: Поясняет необычный оборот, не подменяя его однозначным догматическим термином.
  - marker: c
    text: «По плоти» здесь может означать земной, физический маршрут путешествия.
    reason: Помогает понять идиоматическое выражение, сохраняя его раннехристианскую форму в основном тексте.
lexical_decisions:
- source_word: shepherd
  choice: пастырь
  rationale: Сохраняет церковно-библейский образ руководства и заботы, оставаясь понятным современному читателю.
- source_word: bishop
  choice: епископ
  rationale: Передаёт раннехристианский служебный титул без конфессионального переосмысления.
- source_word: untimely birth
  choice: словно родившийся не вовремя
  rationale: Сохраняет метафору преждевременного или несвоевременного рождения и её уничижительный оттенок.
- source_word: attain unto God
  choice: достигну Бога
  rationale: Следует формулировке свидетеля и сохраняет эсхатологическую направленность без уточнения способа достижения.
- source_word: according to the flesh
  choice: по плоти
  rationale: Сохраняет характерный раннехристианский оборот и возможную смысловую многослойность.
theological_decisions:
- issue: Бог как пастырь и Христос как единственный епископ сирийской церкви
  choice: Сохранить оба образа и соединение «Он и ваша любовь» без поясняющего истолкования.
  alternative: Перефразировать как практическое руководство Бога через любовь римлян.
  rationale: Текст риторически ставит рядом Божье попечение, епископство Христа и любовь адресатов; разрешение этой напряжённости было бы интерпретацией.
- issue: «Стать кем-то» через милость при условии достижения Бога
  choice: Сохранить условную и самоуничижительную формулировку.
  alternative: Передать как окончательное обретение достоинства или спасения.
  rationale: Свидетель оставляет смысл «кем-то» открытым и связывает его с ещё не завершённым достижением Бога.
- issue: Церкви «заранее встречали» Игнатия
  choice: Передать действие без утверждения конкретного организационного механизма.
  alternative: Уточнить, что церкви высылали делегации навстречу.
  rationale: Контекст допускает такое историческое понимание, но данная формулировка сама по себе не требует его явного внесения.
translation_notes:
  register: Современный литературный русский с умеренно церковной лексикой. Синтаксис упрощён относительно английского публичного свидетеля, но параллелизм и торжественный тон сохранены. Поскольку прямая сверка с греческим источником ещё не проведена, спорные обороты переданы консервативно и снабжены примечаниями.
