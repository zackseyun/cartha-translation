base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: ru
  text: 'Ваша молитва достигла церкви, находящейся в Антиохии Сирийской. Выйдя оттуда узником в узах, в высшей степени достойных Бога[a], я приветствую всех, хотя и недостоин принадлежать к этой церкви, ведь я последний среди них. По Божьей воле я был удостоен этого — не по собственной заслуге[b], но по благодати Божьей. Я молюсь, чтобы она была дарована мне во всей полноте и чтобы благодаря вашим молитвам я достиг Бога.


    Итак, чтобы ваше дело было доведено до совершенства и на земле, и на небе, вашей церкви подобает ради чести Божьей избрать Божьего посланника. Пусть он отправится в Сирию и разделит их радость о том, что у них наступил мир, что они вновь обрели подобающую им величину и что их общинное тело[c] было восстановлено.


    Поэтому мне показалось достойным делом, чтобы вы послали кого-нибудь из своих с письмом: пусть он вместе с ними прославит Бога за безмятежие, которое по Божьей воле настало у них, и за то, что благодаря вашим молитвам они уже достигали гавани. Будучи совершенными, помышляйте и о совершенном. Ведь если вы желаете сделать добро, Бог готов дать вам для этого всё необходимое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в богоприличнейших узах»; то есть в узах, которые автор воспринимает как соответствующие Божьему призванию.'
    reason: Необычное греческое определение допускает оттенки «достойные Бога», «подобающие Богу» и «угодные Богу».
  - marker: b
    text: Греческое выражение в этом месте трудно для точного истолкования; возможны также значения «не по свидетельству собственной совести» или «не по моему собственному осознанию».
    reason: Смысл οὐκ ἐκ συνειδότος не вполне ясен, поэтому перевод не должен скрывать текстовую неоднозначность.
  - marker: c
    text: То есть церковь как целостная, устроенная община; буквально выражение связано с образом «тела».
    reason: Поясняет непривычную корпоративно-телесную метафору, не заменяя её толкованием.
lexical_decisions:
- source_word: θεοπρεπεστάτοις δεσμοῖς
  choice: «в узах, в высшей степени достойных Бога»
  rationale: Сохраняет необычное богословски насыщенное определение уз, не сводя его к более узкому значению «угодных Богу».
- source_word: θεοπρεσβευτήν
  choice: «Божьего посланника»
  rationale: Передаёт функцию представителя, направляемого церковью ради Бога; «посол» в современном русском звучал бы преимущественно дипломатически.
- source_word: μέγεθος
  choice: «величину»
  rationale: Сохраняет телесно-общинную метафору восстановления церкви и не уточняет без достаточных оснований, идёт ли речь о численности, положении или полноте устройства.
- source_word: σωματεῖον
  choice: «общинное тело»
  rationale: Передаёт корпоративный образ организованной общины и связь с предшествующим μέγεθος; образ намеренно не сглажен до «устройства».
- source_word: εὐδία / λιμήν
  choice: «безмятежие / гавань»
  rationale: Сохраняет связанную морскую метафору спокойной погоды и достижения безопасной гавани.
theological_decisions:
- issue: Выражение «достигнуть Бога»
  choice: «чтобы … я достиг Бога»
  alternative: «чтобы я соединился с Богом»
  rationale: Сохранена характерная для Игнатия формула цели без её догматического истолкования как конкретного вида посмертного единения.
- issue: Источник восстановления мира в Антиохии
  choice: «по Божьей воле настало у них»
  alternative: «Бог даровал им»
  rationale: Сохраняет прямое указание на Божью волю, не усиливая причинную формулировку сверх свидетельства.
- issue: Совершенство адресатов
  choice: «Будучи совершенными, помышляйте и о совершенном»
  alternative: «Поскольку вы зрелы, принимайте зрелые решения»
  rationale: Сохранены повтор и богословская напряжённость языка совершенства, а не сведены только к практической зрелости.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Синтаксис умеренно упрощён для ясности, но ключевые повторы («совершенство», «молитвы») и морская метафора сохранены. Формулировки сверены с доступным греческим текстом средней редакции, однако с учётом предоставленного указания о необходимости дальнейшей проверки греческой рукописной традиции.
