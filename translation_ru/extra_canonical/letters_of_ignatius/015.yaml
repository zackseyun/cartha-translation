base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: ru
  text: 'Ничто из этого не скрыто от вас, если вы совершенны в вере и любви к Иисусу Христу, ибо они — начало и конец жизни: вера — начало, а любовь — конец. Эти две, пребывая в единстве, суть Бог,[a] всё же остальное следует за ними к истинному благородству.


    Никто, исповедующий веру, не грешит, и никто, обладающий любовью, не ненавидит.[b] Дерево узнаётся по его плоду; так и те, кто называет себя Христовыми, будут узнаны по своим делам. Ибо ныне дело не в исповедании, но оно становится явным, когда человек до конца пребывает в силе веры.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетелю: «эти две, найденные в единстве, суть Бог». Необычная формулировка сохранена без богословского сглаживания; требуется сверка с греческим текстом.'
    reason: Сохраняет подлинную смысловую напряжённость и уведомляет о предварительном характере источниковой базы.
  - marker: b
    text: Высказывания о грехе и ненависти в доступном свидетеле имеют безусловную форму; перевод не уточняет их как речь лишь о постоянной практике греха или ненависти.
    reason: Предотвращает молчаливое внесение толкования, отсутствующего в предоставленном тексте.
  - marker: c
    text: 'Возможен более буквальный перевод: «когда кто-либо оказывается в силе веры до конца».'
    reason: Отмечает неоднозначность конструкции и предварительность перевода до прямой сверки с греческим.
lexical_decisions:
- source_word: perfect
  choice: совершенны
  rationale: Сохраняет сильную формулировку английского свидетеля и вероятный аскетико-нравственный оттенок, не ослабляя её до «искренни» или «тверды».
- source_word: beginning and end
  choice: начало и конец
  rationale: Передаёт параллелизм и богословскую напряжённость исходной формулы без истолковывающего расширения.
- source_word: true nobility
  choice: истинное благородство
  rationale: Естественный современный эквивалент, сохраняющий этико-достоинственный смысл выражения.
- source_word: professing faith
  choice: исповедующий веру
  rationale: Передаёт открытое заявление о вере и поддерживает последующее противопоставление исповедания и дел.
- source_word: profess to be Christ's
  choice: называет себя Христовыми
  rationale: По-русски ясно выражает заявленную принадлежность Христу, не утверждая заранее её подлинность.
- source_word: Work
  choice: дело
  rationale: 'Смысл передан без искусственной прописной буквы: в русском контексте речь естественно понимается как дело или осуществление веры, а не обязательно как именованный термин.'
- source_word: found in the power of faith unto the end
  choice: до конца пребывает в силе веры
  rationale: Сохраняет мотив стойкости до конца и силу веры, избегая неестественной буквальности «оказывается найденным».
theological_decisions:
- issue: Формула «эти две… суть Бог»
  choice: Эти две, пребывая в единстве, суть Бог
  alternative: Их единство ведёт к Богу / происходит от Бога
  rationale: Сохранена явная и напряжённая формулировка свидетеля без догматического сглаживания; неопределённость отмечена сноской.
- issue: Категорические утверждения о грехе и ненависти
  choice: Никто, исповедующий веру, не грешит, и никто, обладающий любовью, не ненавидит
  alternative: Кто действительно верует, тот не живёт во грехе; кто любит, тот не питает ненависти
  rationale: Не внесено смягчающее толкование о привычном или продолжающемся грехе, которого нет в предоставленном свидетеле.
- issue: Соотношение исповедания и дел
  choice: ныне дело не в исповедании, но оно становится явным…
  alternative: важны не слова, а стойкость в вере
  rationale: Сохранены образы «дела», «исповедания» и обнаружения подлинности, без сведения мысли к свободной сентенции.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксический параллелизм и афористичность сохранены; архаизмы сведены к умеренным формам «ибо» и «суть», уместным в ключевой торжественной формуле. Проект основан на предоставленном английском публичнодоступном свидетеле; прямая проверка греческой средней редакции ещё необходима.
