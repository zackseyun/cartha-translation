base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: ru
  text: 'Итак, не будем бесчувственны к Его благости. Ведь если бы Он поступал с нами по нашим делам, мы были бы обречены на гибель. Поэтому, став Его учениками, будем учиться жить достойно христианства. Ибо тот, кто называется иным именем, не от Бога.


    Итак, удалите негодную закваску, застарелую и прокисшую, и обратитесь к новой закваске — Иисусу Христу. Будьте осолены в Нём, чтобы никто из вас не сгнил: ведь по вашему благоуханию вы будете испытаны.[a]


    Нелепо говорить об Иисусе Христе и следовать иудаизму.[b] Ведь не христианство уверовало в иудаизм, а иудаизм — в христианство, в котором всякий язык уверовал и был собран воедино к Богу.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образы соли, гниения и благоухания сохранены буквально. Последнее выражение говорит о том, что люди будут испытаны по своему «запаху» или «благоуханию», то есть по проявляемому ими качеству.
    reason: Греческое слово здесь обозначает запах или благоухание, а не вкус; метафорический смысл не следует чрезмерно конкретизировать.
  - marker: b
    text: «Следовать иудаизму» передаёт древнее выражение о религиозной практике. Это полемическое высказывание автора в конкретном раннехристианском контексте, а не общее этническое суждение о евреях.
    reason: Примечание помогает не смешивать религиозно-полемическое обозначение с характеристикой народа по происхождению.
  - marker: c
    text: «Всякий язык» — библейский оборот, который может обозначать людей всех языков и народов, сохраняя также образ исповедания устами.
    reason: Сохранена образная многозначность выражения.
lexical_decisions:
- source_word: His goodness
  choice: Его благости
  rationale: Сохраняет богословски насыщенное значение доброты и благоволения Бога, оставаясь естественным в достойном литературном регистре.
- source_word: live as beseemeth Christianity
  choice: жить так, как подобает христианству
  rationale: Передаёт нормативный смысл выражения без сведения «христианства» лишь к личному нравственному качеству.
- source_word: called by another name
  choice: носит иное имя
  rationale: Сохраняет образ именования и вероятную связь с христианским именем, не уточняя неоднозначность сверх свидетельства.
- source_word: vile leaven
  choice: негодную закваску
  rationale: Передаёт отрицательную оценку естественным русским словом и сохраняет библейский образ закваски.
- source_word: Be ye salted in Him
  choice: Будьте осолены в Нём
  rationale: Намеренно сохраняет необычную метафору соли и её связь со Христом, не заменяя её толкованием.
- source_word: by your savor ye shall be proved
  choice: по вашему вкусу вас и распознают
  rationale: Сохраняет образ вкуса/качества, а глагол «распознают» передаёт испытание, выявляющее подлинность.
- source_word: practice Judaism
  choice: жить по-иудейски
  rationale: Передаёт практический образ жизни, а не просто интеллектуальное согласие с иудаизмом.
- source_word: every tongue
  choice: всякий язык
  rationale: Сохраняет библейскую идиому и возможную двойственность между народами разных языков и исповедующими устами.
theological_decisions:
- issue: Смысл принадлежности в выражении «is not of God»
  choice: не принадлежит Богу
  alternative: не от Бога
  rationale: В контексте ученичества речь, вероятно, о принадлежности Богу; выбран ясный русский оборот, не превращающий фразу в суждение только о происхождении.
- issue: Отношение христианства и иудаизма
  choice: не христианство уверовало в иудаизм, а иудаизм — в христианство
  alternative: не христианство пришло к вере в иудаизм, но иудаизм — в христианство
  rationale: Сохранена резкая и парадоксальная формулировка свидетеля без смягчения или внесения позднейших конфессиональных схем.
- issue: Собрание «в христианстве»
  choice: в котором всякий язык уверовал и был собран воедино к Богу
  alternative: в которое уверовал всякий язык и в нём был собран к Богу
  rationale: Местоимение оставлено соотнесённым с «христианством», как в английском свидетеле; образ всеобщего собрания к Богу не конкретизирован как институциональная принадлежность.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским регистром. Синтаксис сделан ясным для обычного читателя, но ключевые метафоры закваски, соли, гниения, вкуса и «всякого языка» сохранены. Поскольку представлен английский публичнодоменный свидетель, а непосредственная сверка с греческой рукописной традицией обозначена как ожидающая выполнения, спорные места отмечены сдержанными примечаниями и не подвергнуты чрезмерной гармонизации.
