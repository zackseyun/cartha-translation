base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: ru
  text: 'Не потому, что я узнал о чём-либо подобном среди вас; но я заблаговременно предостерегаю вас, моих возлюбленных, ибо предвижу сети дьявола. Итак, вооружитесь кротостью и вновь обретите себя в вере, которая есть плоть Господа, и в любви, которая есть кровь Иисуса Христа.[a]


    Пусть никто из вас не держит ничего против ближнего. Не давайте язычникам повода, чтобы из-за немногих неразумных людей не хулили живущее в Боге множество. Ибо сказано: «Горе тому, через кого Моё имя напрасно хулится среди некоторых».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальная связь образов намеренно сохранена: вера названа плотью Господа, а любовь — кровью Иисуса Христа. Текст не поясняет, следует ли понимать эти слова прежде всего евхаристически, нравственно или как соединение обоих смыслов.'
    reason: Сохраняет богословскую неоднозначность и предупреждает против молчаливого истолкования метафор.
  - marker: b
    text: Фраза оформлена как цитата или свободное соединение библейских мотивов о хуле на Божье имя среди народов; её точная форма не совпадает дословно с одним общеизвестным стихом. Формулировку следует сверить непосредственно с греческими рукописными свидетелями.
    reason: Указывает на цитатный характер и неопределённую текстовую привязку, не заявляя ложной точности.
lexical_decisions:
- source_word: προφυλάσσω
  choice: заблаговременно предостерегаю
  rationale: Передаёт предупредительную заботу и бдительность, а не только наблюдение со стороны.
- source_word: ἀναλαβόντες τὴν πραΰτητα
  choice: вооружитесь кротостью
  rationale: Сохраняет образ принятия или поднятия средства защиты, отражённый древним английским свидетелем, и естественно звучит по-русски.
- source_word: ἀνακτήσασθε ἑαυτούς
  choice: вновь обретите себя
  rationale: Сохраняет значение восстановления или возвращения себя, не сводя выражение к покаянию либо исцелению.
- source_word: κατὰ τοῦ πλησίον ἐχέτω τι
  choice: не держит ничего против ближнего
  rationale: Естественно передаёт широкое запрещение иметь что-либо против другого, не сужая его только до злопамятства.
- source_word: τὸ ἐν θεῷ πλῆθος
  choice: живущее в Боге множество
  rationale: Сохраняет формулу «в Боге» и делает её синтаксически ясной, не заменяя её конфессиональным обозначением Церкви.
- source_word: ἐπὶ ματαιότητι
  choice: напрасно
  rationale: Передаёт идею тщетности или пустого основания и согласуется с доступным английским свидетелем; точная нюансировка требует проверки греческой традиции.
theological_decisions:
- issue: Отождествление веры с плотью Господа и любви с кровью Иисуса Христа
  choice: сохранить прямую связку «есть»
  alternative: истолковать как веру в плоть Господа и любовь через Его кровь
  rationale: Прямая формулировка сохраняет необычную сакраментальную и образную напряжённость текста, не разрешая её толкованием.
- issue: «Живущее в Боге множество»
  choice: не заменять словом «Церковь»
  alternative: «церковная община» или «народ Божий»
  rationale: Источник использует более широкое выражение; конкретизация могла бы привнести позднейшую терминологию.
- issue: Первое лицо в цитате «Моё имя»
  choice: сохранить заглавную букву и прямую речь
  alternative: передать косвенно как «имя Божье»
  rationale: Так сохраняется форма цитирования и подразумеваемый божественный говорящий без добавочного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Архаические формы устранены; краткие императивы и параллелизм сохранены. Проект основан на доступном публичном английском свидетеле с ограниченной реконструкцией ключевой греческой лексики; перед публикацией необходима полная сверка со среднерецензионной греческой традицией.
