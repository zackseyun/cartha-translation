base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: ru
  text: 'Итак, поскольку всё имеет конец и перед нами вместе поставлены эти два — жизнь и смерть, — каждый пойдёт в своё место. Ведь есть как бы две чеканки: одна — Божья, другая — мирская, и на каждой оттиснуто своё изображение. Неверующие носят изображение этого мира, а верующие в любви — изображение Бога Отца через Иисуса Христа. Если мы по собственной воле не согласимся умереть ради Его страдания,[a] то Его жизни нет в нас…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквальный оттенок выражения можно передать также как «умереть в Его страдании» или «умереть по отношению к Его страданию»; имеется в виду добровольное сообразование со страданием Христа или участие в нём.
    reason: Прямой разбор греческого источника ещё не завершён, а английское свидетельство сохраняет неоднозначную предложную конструкцию.
  - marker: b
    text: Многоточие показывает, что мысль и синтаксическая конструкция продолжаются в следующем разделе.
    reason: Исходное свидетельство оканчивает данный фрагмент знаком продолжения, а не завершает предложение.
lexical_decisions:
- source_word: two coinages
  choice: две чеканки
  rationale: Сохранён образ чеканки монет и следующего за ним оттиснутого изображения; «две монеты» могло бы сместить акцент с принадлежности и отличительного знака на отдельные предметы.
- source_word: proper stamp impressed upon it
  choice: на каждой оттиснуто своё изображение
  rationale: Естественно по-русски передаёт монетную метафору и идею отличительного оттиска, не вводя позднейшего технического богословского смысла слова «печать».
- source_word: the faithful in love
  choice: верующие в любви
  rationale: Сохранена возможная связь выражения «в любви» с верующими без уточнения, означает ли оно их состояние, образ жизни или сферу принадлежности.
- source_word: unto His passion
  choice: ради Его страдания
  rationale: «Страдание» передаёт раннехристианское указание на страдания и смерть Христа; предлог «ради» оставляет смысл участия и сообразования с ними, не превращая фразу в буквальную смерть «внутрь» события.
- source_word: of our own free choice
  choice: по собственной воле
  rationale: Передаёт добровольность решения современным и достойным русским языком, без философски перегруженного термина «свобода воли».
theological_decisions:
- issue: Соотношение смерти верующего со страданием Христа
  choice: «умереть ради Его страдания» с примечанием
  alternative: «умереть в Его страдании» / «умереть по подобию Его страдания»
  rationale: 'Английское свидетельство допускает более одного оттенка. Основной текст звучит естественно, а примечание сохраняет неустранённую смысловую напряжённость: добровольное участие, сообразование или смерть в связи со страданием Христа.'
- issue: Условие пребывания жизни Христа в верующих
  choice: сохранена условная конструкция «Если… не…, то…»
  alternative: смягчить до призыва к подражанию Христу
  rationale: Автор формулирует резкое богословское условие; его не следует ослаблять или согласовывать с позднейшими конфессиональными системами.
translation_notes:
  register: 'Современный литературный русский язык с раннехристианской торжественностью. Монетная метафора сохранена последовательно: «чеканки» — «оттиснуто» — «изображение». Архаизмы вроде «сего», «дабы», «страсть Его» исключены. Поскольку прямой анализ греческого текста ожидается, решения, зависящие от синтаксиса источника, отмечены как предварительные.'
