review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение ключевой монетной метафоры и предложной связи в заключительной фразе. Греч. νόμισμα обозначает монету (а не процесс или вид чеканки); образ состоит в том, что каждая «монета» несёт отличительный χαρακτήρ, то есть оттиск/знак. «Ради Его страдания» добавляет целевое значение, которого конструкция εἰς τὸ αὐτοῦ πάθος надёжно не выражает. Его следует передать ближе, сохранив трудность в примечании.
  naturalness: «Две чеканки» в современном русском звучит неестественно и нарушает логику последующего «на каждой». «Две монеты» и «отличительный оттиск» сохраняют образ и читаются ясно. Формула «верные в любви» несколько книжна, но уместна для торжественного раннехристианского регистра; запятая помогает избежать двусмысленности.
  terminology: «Оттиск» передаёт χαρακτήρ без навязывания позднейшей богословской терминологии. «Страдание» для πάθος допустимо. «Бог Отец» сохранено как именование источника; связь «в Иисусе Христе» оставлена без доктринального перетолкования.
  issues:
  - severity: medium
    issue: «две чеканки» вместо образа двух монет
    rationale: Исходное νόμισμα и английское coinage в контексте «каждая имеет оттиснутый знак» требуют предметного монетного образа. «Чеканка» обычно означает процесс изготовления либо тип выпуска, а не носитель оттиска.
  - severity: medium
    issue: «умереть ради Его страдания»
    rationale: «Ради» выражает цель или мотив. Исходная и засвидетельствованная английская конструкция «die unto/in relation to his passion» намеренно трудна и не требует такого целевого оттенка. Нужна более близкая формулировка с пояснением неоднозначности.
  - severity: low
    issue: Связь «в Иисусе Христе»
    rationale: В греческой традиции здесь стоит ἐν Ἰησοῦ Χριστῷ; английский свидетель передаёт through Jesus Christ. Основной текст должен не утверждать однозначно причинное «через», а сохранить возможную связь с оттиском Бога Отца.
  revised_text: Итак, поскольку всё имеет конец и перед нами вместе положены эти два — смерть и жизнь, — каждый пойдёт в своё место. Ибо, как есть две монеты — одна Божья, а другая мирская, — и каждая несёт свой отличительный оттиск, так неверующие несут оттиск этого мира, а верные, пребывающие в любви, — оттиск Бога Отца в Иисусе Христе. Через Него, если мы добровольно не примем смерти в Его страдании,[a] Его жизни нет в нас…[b]
  revised_footnotes:
  - marker: a
    text: 'Буквально: «принять смерть в Его страдании». Предложная связь допускает несколько близких оттенков — смерть в связи со страданием Христа, соучастие в нём или сообразование ему; она не уточняется в основном тексте.'
    reason: Сохраняет неоднозначность δύσной греческой конструкции εἰς τὸ αὐτοῦ πάθος и не подменяет её целевым значением «ради».
  - marker: b
    text: Многоточие отмечает, что синтаксическая конструкция продолжается в следующем разделе.
    reason: Предоставленный английский свидетель оканчивает данный фрагмент знаком продолжения, а не завершённым предложением.
  revision_rationale: 'Исправление возвращает последовательный образ «монета — оттиск», заменяя неестественное «чеканки». Заключительная фраза приведена ближе к исходной конструкции: добровольное принятие смерти связано со страданием Христа без внесения цели «ради». «В Иисусе Христе» сохраняет греческую предлоговую связь, тогда как «Через Него» относится к следующему относительному обороту, как в английском аудиторском свидетельстве. Смысл продолжения и оба якоря примечаний сохранены.'
