base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: ru
  text: 'Ибо хотя некоторые и хотели обмануть меня по плоти, дух, будучи от Бога, не обманывается. Ведь он знает, откуда приходит и куда уходит, и изобличает сокрытое. Когда я был среди вас, я воскликнул; я говорил громким голосом — голосом Божьим: «Внимайте епископу, пресвитерию и диаконам».


    Однако некоторые подозревали, что я говорил это потому, что заранее знал о разделении среди некоторых. Но Тот, в Ком я пребываю в узах, — мой свидетель: я узнал это не от человеческой плоти, но Дух возвестил, сказав: «Ничего не делайте без епископа; храните свою плоть как храм Божий; дорожите единством; избегайте разделений; подражайте Иисусу Христу, как и Он Сам подражает Своему Отцу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: after/according to the flesh
  choice: по плоти
  rationale: Сохранена характерная раннехристианская формула и противопоставление плоти и духа, без пояснительного сужения смысла.
- source_word: spirit / Spirit
  choice: дух / Дух
  rationale: Регистр первой фразы допускает некоторую неоднозначность, тогда как последующая «проповедь Духа» явно указывает на Божьего Духа; различие передано регистром.
- source_word: presbytery
  choice: пресвитерам
  rationale: В призыве перечисляются лица церковного служения; естественное русское множественное число передаёт собирательный смысл.
- source_word: keep your flesh
  choice: храните свою плоть
  rationale: Сохранён телесный и аскетико-нравственный образ исходного свидетельства, не заменённый более узким «храните тело в чистоте».
- source_word: cherish union
  choice: дорожите единством
  rationale: Современная и ясная формулировка, сохраняющая положительный призыв беречь церковное единство.
- source_word: in whom I am bound
  choice: Тот, ради Кого я ношу узы
  rationale: Передан смысл заключения за Христа; буквальное «в Ком я связан» по-русски неясно и неестественно.
theological_decisions:
- issue: Отнесение слова «дух» в первом абзаце
  choice: Сохранить «дух» со строчной буквы
  alternative: «Дух» как однозначное указание на Святого Духа
  rationale: Свидетельство говорит о духе, который «от Бога», но без греческой сверки не следует типографически устранять возможную неоднозначность.
- issue: «Божьим голосом»
  choice: Сохранить сильное утверждение без смягчения
  alternative: «словно голосом Божьим» или «по Божьему внушению»
  rationale: Смягчающие варианты привнесли бы интерпретацию и ослабили свидетельство автора о пророческом возгласе.
- issue: Подражание Христа Отцу
  choice: «как и Он Сам подражал Своему Отцу»
  alternative: «как и Он Сам следовал Отцу»
  rationale: Сохранена богословски напряжённая параллель исходного свидетельства, а не заменена более привычной формулой.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Сохранены термины «плоть», «пресвитеры», «узы» и риторическая последовательность повелений. Поскольку прямая сверка с греческим источником ещё не выполнена, проект основан на предоставленном публично-доступном английском свидетельстве и не претендует на разрешение его возможных текстовых неоднозначностей.
