revisions:
- from: 'Ибо хотя некоторые и хотели обмануть меня по плоти, дух, будучи от Бога, не обманывается. Ведь он знает, откуда приходит и куда уходит, и исследует сокровенное. Когда я был среди вас, я воскликнул, громко возгласив Божьим голосом: «Внимайте епископу, пресвитерам и диаконам».


    Однако некоторые подозревали, что я сказал это потому, что заранее знал о разделении среди них. Но Тот, ради Кого я ношу узы, — мой свидетель: я узнал это не от человеческой плоти. Это была проповедь Духа, который говорил так: «Ничего не делайте без епископа; храните свою плоть как храм Божий; дорожите единством; избегайте разделений; подражайте Иисусу Христу, как и Он Сам подражал Своему Отцу».'
  to: 'Ибо хотя некоторые и хотели обмануть меня по плоти, дух, будучи от Бога, не обманывается. Ведь он знает, откуда приходит и куда уходит, и изобличает сокрытое. Когда я был среди вас, я воскликнул; я говорил громким голосом — голосом Божьим: «Внимайте епископу, пресвитерию и диаконам».


    Однако некоторые подозревали, что я говорил это потому, что заранее знал о разделении среди некоторых. Но Тот, в Ком я пребываю в узах, — мой свидетель: я узнал это не от человеческой плоти, но Дух возвестил, сказав: «Ничего не делайте без епископа; храните свою плоть как храм Божий; дорожите единством; избегайте разделений; подражайте Иисусу Христу, как и Он Сам подражает Своему Отцу».'
  rationale: 'Правка приводит перевод в более точное соответствие с греческой формой и синтаксисом, устраняет стилистическую тавтологию и не вводит конфессиональных пояснений. Сноски не нужны: существенные термины остаются в самом переводе, а спорная типографическая неоднозначность первого «дух» сохранена.'
