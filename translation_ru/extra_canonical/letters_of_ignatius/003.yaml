base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: ru
  text: 'Что же касается моего сослужителя Вурра, который по воле Божьей является вашим диаконом, благословенным во всём, я прошу, чтобы он остался со мной — к чести вашей и вашего епископа. Также и Крок, достойный Бога и вас, которого я принял как свидетельство любви, которую вы питаете ко мне, во всём дал мне отдохновение. Так пусть Отец Иисуса Христа даст отдохновение ему вместе с Онисимом, Вурром, Евплом и Фронтоном; в них я с любовью увидел всех вас.


    Пусть я всегда радуюсь о вас, если только я достоин этого. Поэтому вам во всём подобает прославлять Иисуса Христа, прославившего вас, чтобы вы, будучи совершенно соединены в едином послушании и повинуясь вашему епископу и пресвитерии, были освящены во всём.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fellow servant (σύνδουλος, вероятно)
  choice: соработник
  rationale: Передаёт совместное служение без неестественного для современного русского языка «сораба»; точная греческая лексема требует проверки по греческому тексту.
- source_word: deacon
  choice: служит у вас диаконом
  rationale: Сохраняет раннехристианский служебный титул и естественно связывает его с общиной.
- source_word: ensample
  choice: живое свидетельство
  rationale: В контексте прибытие Крока воплощает любовь общины; формальное «образец» по-русски могло бы ошибочно характеризовать его нравственные качества.
- source_word: relieved / refresh
  choice: поддержал / дарует отраду
  rationale: Сохраняется словесно-смысловая связь помощи и утешения, но избегается механическое повторение, неясное в русском.
- source_word: presbytery
  choice: пресвитерам
  rationale: По синтаксису речь идёт о повиновении епископу и совету пресвитеров; личная форма понятнее современному читателю.
- source_word: with the eyes of love
  choice: глазами любви
  rationale: Сохранён выразительный образ исходного свидетельства.
theological_decisions:
- issue: Характер подчинения церковному руководству
  choice: «пребывая в совершенном единстве и общем послушании, повинуясь вашему епископу и пресвитерам»
  alternative: «совершенно объединившись в одном повиновении, подчиняясь епископу и пресвитерии»
  rationale: Перевод сохраняет сильный призыв к единству и повиновению, не превращая текст в утверждение позднейшей конфессиональной модели управления.
- issue: Связь единства, повиновения и освящения
  choice: «чтобы… вы были освящены во всём»
  alternative: «дабы вы во всём освящались»
  rationale: Сохранена целевая конструкция и богословская связь, не уточняя сверх текста, кем или каким образом совершается освящение.
- issue: Отец Иисуса Христа
  choice: «Отец Иисуса Христа»
  alternative: «Бог и Отец Иисуса Христа»
  rationale: Не добавлено отсутствующее в представленном свидетельстве слово «Бог»; формула сохранена без догматического расширения.
translation_notes:
  register: 'Современный литературный русский язык с dignified раннехристианским регистром. Имена переданы в традиционной русифицированной форме: Вурр, Крок, Онисим, Евпл, Фронтон. Поскольку прямой разбор среднерецензионного греческого текста заявлен как ожидающий проверки, draft осторожно следует предоставленному публичному английскому свидетельству и не вводит текстологических примечаний без подтверждения.'
