revisions:
- from: 'Что же касается моего соработника Вурра, который по воле Божьей служит у вас диаконом и во всём благословен, прошу, чтобы он остался со мной — к чести вашей и вашего епископа. И Крок, достойный Бога и вас, которого я принял как живое свидетельство вашей любви ко мне, всячески поддержал меня. Пусть же Отец Иисуса Христа дарует отраду ему, а вместе с ним Онисиму, Вурру, Евплу и Фронтону. В них я глазами любви увидел всех вас.


    Да буду я всегда радоваться о вас, если только достоин этого. Поэтому вам подобает всячески прославлять Иисуса Христа, прославившего вас, чтобы, пребывая в совершенном единстве и общем послушании, повинуясь вашему епископу и пресвитерам, вы были освящены во всём.'
