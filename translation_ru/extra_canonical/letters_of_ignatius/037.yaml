    text: 'Перевод предварительный: он выполнен по указанному английскому свидетельству Дж. Б. Лайтфута; необходима прямая сверка с греческим текстом средней редакции.'
    reason: В предоставленных данных прямо указано, что проверка по исходному греческому тексту ещё не проведена.
  revision_rationale: Исправлены управление в первом предложении, оттенки увещательного обращения и интенсивности молитвы, а также передано «united» как «единодушная». Не внесено толкование выражения «достичь Бога» как мученичества и не объяснён образ росы, поскольку доступное свидетельство таких уточнений не требует.
