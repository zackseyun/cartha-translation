base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: ru
  text: Зная, что вы исполнены Бога, я кратко наставил вас. Помните обо мне в своих молитвах, чтобы мне достичь Бога; помните также и о церкви в Сирии, членом которой я недостоин называться. Ибо мне нужны ваша общая молитва и любовь в Боге, чтобы церкви в Сирии было даровано освежиться росой вашей усердной молитвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по указанному английскому свидетельству Дж. Б. Лайтфута; необходима прямая сверка с греческим текстом средней редакции.'
    reason: В предоставленных данных прямо указано, что проверка по исходному греческому тексту ещё не проведена.
lexical_decisions:
- source_word: full of God
  choice: исполнены Бога
  rationale: Сохраняет сильный и необычный образ свидетельства, не ослабляя его до более общего «благочестивы».
- source_word: exhorted
  choice: наставил
  rationale: Передаёт побуждение и увещание в достойном современном регистре; «ободрил» было бы уже по смыслу.
- source_word: attain unto God
  choice: достичь Бога
  rationale: Сохраняет направленность и богословскую напряжённость выражения, не уточняя за автора, идёт ли речь о мученической смерти и вхождении в Божье присутствие.
- source_word: united prayer
  choice: общая молитва
  rationale: Естественно передаёт совместную, единодушную молитву общины без добавления отсутствующего в доступном свидетельстве уточнения.
- source_word: refreshed by the dew
  choice: освежиться росой
  rationale: Сохраняет образ росы и его оживляющее значение, не заменяя метафору объяснением.
- source_word: fervent supplication
  choice: усердной молитвы
  rationale: «Усердной» естественно выражает горячность и настойчивость; «молитва» здесь яснее современному читателю, чем стилистически более узкое «моление».
theological_decisions:
- issue: Смысл выражения «достичь Бога»
  choice: Сохранить буквальную и открытую формулировку
  alternative: «Прийти к Богу через мученичество»
  rationale: Доступное английское свидетельство не выражает мученичество прямо; явное уточнение устранило бы подлинную смысловую напряжённость.
- issue: Образ церкви, освежаемой росой молитвы
  choice: Сохранить метафору без догматического истолкования
  alternative: Передать как «получить помощь благодаря вашей молитве»
  rationale: Образный язык существен для авторского призыва и не требует сведения к одной форме помощи.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским регистром. Синтаксис умеренно формальный, но доступный; сохранены ключевые образы и не разрешённая самим свидетельством богословская неоднозначность.
