review_pass:
  verdict: revise
  source_fidelity: 'Прямая сверка с греческим текстом в предоставленных материалах невозможна: доступно лишь английское свидетельство Лайтфута, и это должно оставаться оговорённым в примечании. По этому свидетельству сохранены все смысловые элементы: краткое увещание, просьба о молитве ради «достижения Бога», память о сирийской церкви, собственное недостоинство автора, а также образ росы пламенной молитвы. «Исполнены Бога» требует исправления на нормативное «исполнены Богом».'
  naturalness: «Исполнены Бога» не соответствует современному литературному русскому управлению. «Усердная молитва» может обозначать прилежание, но слабее передаёт fervent; «пламенная молитва» точнее сохраняет интенсивность и высокий, но понятный регистр. Остальная фразировка слегка выровнена без устранения намеренно открытого выражения «достичь Бога».
  terminology: «Увещевал» точнее, чем «наставил», передаёт exhorted и соответствует увещательному жанру. «Единодушная молитва» точнее «общей молитвы» для united prayer. «Членом которой я недостоин именоваться» сохраняет смысл и достойный раннехристианский регистр; «церковь» оставлено без конфессионального уточнения.
  issues:
  - severity: medium
    issue: Ненормативная конструкция «исполнены Бога».
    rationale: 'В русском языке в данном значении требуется творительный падеж: «исполнены Богом». Это также естественно передаёт full of God.'
  - severity: low
    issue: «Наставил» ослабляет значение exhorted.
    rationale: «Увещевал» яснее передаёт побуждение и настойчивое пастырское обращение, не сводя его к обучению.
  - severity: low
    issue: «Усердной молитвы» не вполне передаёт fervent supplication.
    rationale: «Пламенной молитвы» лучше выражает горячность исходного оборота и сохраняет его образную возвышенность.
  revised_text: Зная, что вы исполнены Богом, я кратко увещевал вас. Помните обо мне в своих молитвах, чтобы мне достичь Бога; помните также и о церкви в Сирии, членом которой я недостоин именоваться. Ибо я нуждаюсь в вашей единодушной молитве и любви в Боге, чтобы церкви в Сирии было даровано освежиться росой вашей пламенной молитвы.[a]
  revised_footnotes:
