revisions:
- from: 'Избегай дурных ухищрений — или, вернее, беседуй о них. Скажи моим сёстрам, чтобы они любили Господа и были довольны своими мужьями по плоти и по духу. Так же увещевай и моих братьев именем Иисуса Христа любить своих жён, как Господь возлюбил Церковь.


    Если кто способен пребывать в целомудрии в честь плоти Господа, пусть пребывает без хвастовства. Если он хвалится, то погиб; а если об этом становится известно кому-либо помимо епископа, он осквернён.[a] Мужчинам и женщинам, вступающим в брак, подобает соединяться с согласия епископа, чтобы брак был по Господу, а не по вожделению. Пусть всё совершается во славу Божью.'
  to: 'Избегай злых ухищрений; вернее же, говори о них. Скажи моим сёстрам, чтобы они любили Господа и были довольны своими мужьями по плоти и по духу. Так же наставляй моих братьев во имя Иисуса Христа любить своих жён, как Господь возлюбил Церковь.


    Если кто может пребывать в чистоте в честь плоти Господа, пусть пребывает без хвастовства. Если же станет хвалиться — пропал; а если об этом станет известно кому-либо, кроме епископа, он осквернён.[a] Мужчинам и женщинам, вступающим в брак, подобает соединяться по совету епископа, чтобы брак был по Господу, а не по вожделению. Пусть всё совершается в честь Бога.'
  rationale: Исправлено существенное направление исключения в πλὴν τοῦ ἐπισκόπου. Уточнены передачи ἁγνεία, γνώμη и εἰς τιμήν, чтобы они были ближе к греческому тексту и не вносили излишне определённой канонической либо богословской интерпретации. Сноска сохранена, но теперь объясняет реальную синтаксическую и смысловую трудность, а не ошибочно связывает её только с отсутствием греческого текста.
