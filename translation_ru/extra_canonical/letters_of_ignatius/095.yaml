base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: ru
  text: 'Избегай злых ухищрений; вернее же, говори о них. Скажи моим сёстрам, чтобы они любили Господа и были довольны своими мужьями по плоти и по духу. Так же наставляй моих братьев во имя Иисуса Христа любить своих жён, как Господь возлюбил Церковь.


    Если кто может пребывать в чистоте в честь плоти Господа, пусть пребывает без хвастовства. Если же станет хвалиться — пропал; а если об этом станет известно кому-либо, кроме епископа, он осквернён.[a] Мужчинам и женщинам, вступающим в брак, подобает соединяться по совету епископа, чтобы брак был по Господу, а не по вожделению. Пусть всё совершается в честь Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если станет известно кроме епископа, он осквернён». Смысл, по-видимому, в том, что намерение или практика воздержания не должна становиться известной другим, кроме епископа; краткие выражения «пропал» и «осквернён» не уточняют характер последствия.'
    reason: Сноска отмечает сжатую и интерпретационно трудную конструкцию, сохраняя в основном тексте значение πλὴν («кроме, за исключением»).
lexical_decisions:
- source_word: evil arts
  choice: дурные ухищрения
  rationale: Передаёт предосудительные приёмы или практики, не сужая значение до магии; прямой анализ греческого источника ещё предстоит.
- source_word: hold thou discourse about these
  choice: беседуй о них
  rationale: Сохраняет контраст с повелением избегать и не уточняет неопределённый референт «о них».
- source_word: be content with their husbands
  choice: были довольны своими мужьями
  rationale: Естественно передаёт удовлетворённость собственным супругом, не добавляя идеи простого подчинения.
- source_word: chastity
  choice: целомудрии
  rationale: Сохраняет широкий аскетический смысл; в данном контексте вероятно подразумевается воздержание, но это не внесено в основной текст без проверки греческого.
- source_word: flesh of the Lord
  choice: плоти Господа
  rationale: Формально сохраняет христологически значимое и необычное выражение, не заменяя его толкованием.
- source_word: concupiscence
  choice: вожделению
  rationale: Передаёт сильное, нравственно окрашенное плотское желание в контрасте с браком «по Господу».
theological_decisions:
- issue: Сопоставление супружеской любви с любовью Господа к Церкви
  choice: как Господь возлюбил Церковь
  alternative: как Христос возлюбил Церковь
  rationale: Следует предоставленному свидетельству «the Lord» и не гармонизирует молча с Еф. 5:25.
- issue: Целомудрие и честь плоти Господа
  choice: в честь плоти Господа
  alternative: из почтения к плоти Господа
  rationale: Сохранена напряжённая и неоднозначная формулировка без сведения её к одной аскетической или сакраментальной интерпретации.
- issue: Роль епископа при заключении брака
  choice: с согласия епископа
  alternative: с ведома епископа
  rationale: «Consent» в предоставленном свидетельстве сильнее простого уведомления; формулировка не развивает это в позднейшую каноническую систему.
- issue: Последствие хвастовства целомудрием
  choice: то погиб
  alternative: то пропал
  rationale: Сохранена серьёзность утверждения «he is lost» без уточнения, означает ли оно окончательное осуждение, нравственное падение или утрату заслуги.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского наставления; сохранены обращения в единственном числе и параллелизм. Проект предварительный: предоставленный материал прямо отмечает, что сверка со среднерецензионным греческим текстом ещё не выполнена.'
