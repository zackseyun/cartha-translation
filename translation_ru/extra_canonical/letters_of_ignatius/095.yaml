review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод близок к греческому среднерецензионному тексту. Однако πλὴν τοῦ ἐπισκόπου означает не «кому-либо помимо епископа», а «кроме епископа / за исключением епископа»: речь о том, что если это станет известно кому-либо, кроме епископа, человек «осквернён/погублен». Также μετὰ γνώμης τοῦ ἐπισκόπου точнее передать как «по совету/с ведома и одобрения епископа», а не исключительно юридическим «с согласия».'
  naturalness: Тон современный литературный и в целом удачный. «Погиб» в данном контексте звучит несколько как окончательное эсхатологическое определение; «пропал» лучше сохраняет краткую, суровую и намеренно неразъяснённую форму ἀπώλετο. «Во имя Иисуса Христа» естественнее поставить непосредственно при наставлении.
  terminology: '«Дурные ухищрения», «целомудрие», «плоть Господа», «вожделение» и «Церковь» уместны. Для ἁγνεία предпочтительно «чистота» как более близкое к исходному слову и менее сужающее выражение до установленного русского понятия «целомудрие». «Во славу Божью» допустимо, но εἰς τιμὴν θεοῦ буквально и риторически точнее: «в честь Бога».'
  issues:
  - severity: high
    issue: Неверно передано πλὴν τοῦ ἐπισκόπου
    rationale: «Кому-либо помимо епископа» делает епископа дополнительным лицом, которому стало известно; πλὴν означает исключение епископа из круга тех, кому не должно стать известно.
  - severity: medium
    issue: «С согласия епископа» чрезмерно юридизирует μετὰ γνώμης τοῦ ἐπισκόπου
    rationale: Γνώμη — мнение, совет, решение, одобрение; «по совету епископа» сохраняет пастырский смысл без привнесения позднейшей юридической процедуры.
  - severity: low
    issue: «Целомудрие» несколько уже, чем ἁγνεία
    rationale: «Чистота» передаёт термин шире и не предрешает конкретный характер воздержания.
