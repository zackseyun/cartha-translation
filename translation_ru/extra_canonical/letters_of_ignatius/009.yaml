review_pass:
  verdict: revise
  source_fidelity: В первом абзаце смысл в целом передан точно. Однако для греческих σαρκικοί / πνευματικοί и τὰ πνευματικά / τὰ σαρκικά предпочтительно сохранить симметрию прилагательных «плотское» и «духовное», не превращая πνευματικά в прямо названные «дела Духа». Это также удерживает смысловую широту оригинала. «По плоти» и парадоксальное утверждение о духовности таких дел сохранены.
  naturalness: Фраза «церковь, церковь эфесян» звучит как неудачный повтор. Кроме того, «делать того, что свойственно Духу» тяжеловесно и менее точно, чем краткий параллелизм «совершать духовного / плотского».
  terminology: «Плоть», «духовное», «вера», «неверие» и «в Иисусе Христе» сохранены без конфессионально обусловленного толкования. Строчная буква в «духовное» отражает греческое прилагательное и не исключает связи с Духом, но не навязывает её грамматически.
  issues:
  - severity: medium
    issue: «то, что свойственно Духу» / «то, что свойственно плоти»
    rationale: В оригинале стоят симметричные субстантивированные прилагательные «духовное» и «плотское». Заглавная буква и экспликация «Дух» несколько сужают и истолковывают выражение.
  - severity: low
    issue: Повтор «за вашу церковь, церковь эфесян»
    rationale: Повтор отсутствует в необходимой для русского фразе форме и ухудшает литературную плавность; «за церковь эфесян» передаёт референт без потери смысла.
  - severity: low
    issue: «делать дела неверия»
    rationale: Повтор однокоренных «делать дела» стилистически тяжёл; «совершать то, что относится к неверию» точнее передаёт эллиптическую конструкцию оригинала.
  revised_text: 'Итак, пусть никто вас не обманывает: ведь вы и не обмануты, потому что всецело принадлежите Богу. Когда в вас не поселится никакое желание, способное мучить вас, тогда вы поистине живёте по Богу. Я посвящаю себя ради вас и приношу себя в жертву за церковь эфесян, славную во все века.[a]


    Плотские люди не могут совершать духовного, и духовные — плотского; так и вера не может совершать того, что относится к неверию, а неверие — того, что относится к вере. Более того, даже то, что вы совершаете по плоти, духовно, потому что всё вы совершаете в Иисусе Христе.'
  revised_footnotes:
  - marker: a
    text: 'Перевод предварительный: он основан на указанном английском свидетельстве Дж. Б. Лайтфута; необходима непосредственная сверка с греческой рукописной традицией средней редакции.'
