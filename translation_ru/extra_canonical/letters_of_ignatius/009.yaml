base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: ru
  text: 'Итак, пусть никто вас не обманывает — впрочем, вы и не обмануты, потому что всецело принадлежите Богу. Ведь когда в вас не укореняется никакое желание, способное вас мучить, тогда вы поистине живёте по Богу. Я отдаю себя за вас и посвящаю себя как жертву за вашу церковь, церковь эфесян, прославленную во все века.[a]


    Те, кто от плоти, не могут делать того, что свойственно Духу, а те, кто от Духа, — того, что свойственно плоти; так и вера не может делать дел неверия, а неверие — дел веры. Более того, даже то, что вы делаете по плоти, духовно, потому что всё вы делаете в Иисусе Христе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он основан на указанном английском свидетельстве Дж. Б. Лайтфута; необходима непосредственная сверка с греческой рукописной традицией средней редакции.'
    reason: Предоставленный материал прямо указывает, что проверка по греческому источнику ещё не проведена; это существенно для оценки спорных выражений и синтаксиса.
lexical_decisions:
- source_word: lust / desire (Greek review pending)
  choice: желание
  rationale: '«Желание» сохраняет широту понятия и не сужает его до сексуальной похоти; отрицательная окраска задаётся контекстом: оно способно мучить и укореняться в человеке.'
- source_word: established within
  choice: укореняется
  rationale: Естественно по-русски передаёт идею прочно утвердившегося внутреннего влечения, не превращая фразу в абстрактную канцелярскую конструкцию.
- source_word: live after/according to God
  choice: живёте по Богу
  rationale: Сохраняет раннехристианскую формулу и её богословскую ёмкость, оставаясь понятной в контексте.
- source_word: of the flesh / of the Spirit
  choice: от плоти / от Духа
  rationale: Сохраняет параллелизм и традиционную богословскую лексику, не истолковывая «плоть» просто как физическое тело.
- source_word: things of unfaithfulness
  choice: дела неверия
  rationale: Передаёт противопоставление веры и неверия как проявляющихся в поступках состояний.
- source_word: according to the flesh
  choice: по плоти
  rationale: 'Сохранена намеренная напряжённость заключительной мысли: действия «по плоти» названы духовными благодаря их совершению во Христе.'
theological_decisions:
- issue: Противопоставление плоти и Духа
  choice: Сохранить формулы «от плоти» и «от Духа» без поясняющего перефразирования
  alternative: Передать как «живущие плотскими желаниями» и «живущие по Духу»
  rationale: Перефразирование могло бы преждевременно разрешить смысловую напряжённость и сузить антропологический и этический диапазон выражений.
- issue: Парадокс действий «по плоти», которые духовны
  choice: Сохранить парадокс буквально и связать его с совершением всего в Иисусе Христе
  alternative: Истолковать «по плоти» как «в повседневной телесной жизни»
  rationale: Источник допускает такую интерпретацию, но прямо её не формулирует; перевод не должен устранять подлинную неоднозначность.
- issue: Самопосвящение Игнатия за эфесскую церковь
  choice: «посвящаю себя как жертву за вашу церковь»
  alternative: «приношу себя в жертву вашей церкви»
  rationale: Выбранная формулировка яснее показывает жертвенный образ и избегает возможного впечатления, будто сама церковь является получателем культовой жертвы.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Сохранены риторические параллели, краткие богословские формулы и намеренный парадокс последнего предложения. Архаизмы и конфессионально маркированные толкования не вводились.
