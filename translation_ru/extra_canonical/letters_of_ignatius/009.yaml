  revision_rationale: Исправления устраняют стилистический повтор и восстанавливают формальный параллелизм второго абзаца. Неоднозначность противопоставления плотского и духовного, а также парадокс заключительной фразы намеренно сохранены. Предварительная оговорка о текстовой базе оставлена, поскольку в материалах не представлена завершённая прямая сверка с греческой традицией.
