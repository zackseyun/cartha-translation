base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: ru
  text: 'Будьте внимательны к епископу, чтобы и Бог был внимателен к вам. Я отдаю себя за тех, кто подчиняется епископу, пресвитерам и диаконам. Да будет мне дано разделить с ними участь перед Богом. Вместе трудитесь, вместе боритесь, вместе бегите, вместе страдайте, вместе ложитесь и вместе вставайте — как Божьи управители, советники[a] и служители.


    Угождайте Военачальнику, в чьём войске вы служите и от кого получаете жалованье. Пусть никто из вас не окажется дезертиром. Пусть ваше крещение остаётся при вас как оружие[b], вера — как шлем, любовь — как копьё, терпение — как полный доспех. Пусть ваши дела будут вашими вкладами, чтобы вы получили причитающуюся вам выплату[c]. Поэтому будьте терпеливы друг к другу в кротости, как Бог терпелив к вам. Да буду я всегда радоваться о вас!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заседатели», «помощники, сидящие рядом».'
    reason: Греческое слово допускает административно-судебный и более общий смысл помощника при старшем.
  - marker: b
    text: 'Буквально: «как оружие» или «как боевое снаряжение»; перевод «как щит» является возможной контекстуальной конкретизацией.'
    reason: Важно сохранить более широкое значение греческого ὅπλα и отметить отличие от предоставленного английского свидетеля.
  - marker: c
    text: Здесь употреблён образ денежного вклада и последующего получения причитающейся суммы.
    reason: Редкие заимствованные финансовые термины в греческой традиции требуют пояснения, не разрешающего метафору в пользу конкретного учения о воздаянии.
lexical_decisions:
- source_word: πάρεδροι
  choice: советники
  rationale: Слово обозначает сидящих рядом с должностным лицом помощников или заседателей. «Советники» естественно по-русски и сохраняет образ совместного служения, не приписывая адресатам конкретной церковной должности.
- source_word: ὑπηρέται
  choice: служители
  rationale: Передаёт общее значение подчинённого служения без искусственного сужения до определённого церковного чина.
- source_word: ᾧ στρατεύεσθε
  choice: Военачальнику, в чьём войске вы служите
  rationale: Сохраняет военную метафору и естественно связывает её с последующими образами жалованья, дезертирства и вооружения.
- source_word: ὅπλα
  choice: оружие
  rationale: Греческое множественное слово может обозначать оружие или боевое снаряжение вообще; «щит» в английском свидетеле чрезмерно конкретизирует образ.
- source_word: πανοπλία
  choice: полный доспех
  rationale: Передаёт совокупность защитного вооружения, а не только один элемент брони.
- source_word: δεπόσιτα / ἄκκεπτα
  choice: вклады / причитающаяся выплата
  rationale: Сохраняет финансово-расчётную метафору заимствованных терминов и делает её понятной современному читателю.
- source_word: ἀντίψυχον
  choice: Я отдаю себя за
  rationale: Формула выражает глубокую личную преданность и готовность пожертвовать собой; буквальное «выкуп за жизнь» в данном контексте звучало бы по-русски неясно и могло бы привнести лишнюю догматическую определённость.
theological_decisions:
- issue: Характер повиновения церковным служителям
  choice: «кто подчиняется епископу, пресвитерам и диаконам»
  alternative: «кто послушен епископу вместе с пресвитерами и диаконами»
  rationale: Сохранена грамматическая возможность отнести подчинение ко всем трём названным группам, как в доступном свидетеле; текст не превращён в утверждение о позднейшей модели церковного управления.
- issue: Воздаяние за дела
  choice: Сохранена метафора вкладов и причитающейся выплаты
  alternative: Истолковать её как заслуги, награду или спасение
  rationale: Авторская финансовая метафора оставлена напряжённой и не сведена к конфессиональной схеме учения о заслугах или спасении.
- issue: Сопоставление Божьего терпения с человеческим
  choice: «как Бог терпелив к вам»
  alternative: «как Бог с вами»
  rationale: Смысловой глагол восстановлен из ближайшего контекста для естественного русского синтаксиса, но без дальнейшего богословского уточнения характера Божьего отношения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной увещательной интонацией. Анафорический ряд «вместе…» и череда военных образов сохранены. Избегались архаизмы вроде «внемлите», «ратоборствуйте» и «мзда». Поскольку карточка указывает, что прямая сверка с греческой рукописной традицией ещё ожидается, решения опираются на предоставленный свидетель и доступные в нём греческие лексемы; спорные места отмечены примечаниями.
