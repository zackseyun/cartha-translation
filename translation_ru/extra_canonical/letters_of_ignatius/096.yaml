review_pass:
  verdict: revise
  source_fidelity: Нужна правка в нескольких местах. В греческом тексте συναναπαύεσθε означает «вместе отдыхайте», а не «ложитесь». Формула ὡς καὶ ὁ θεὸς μεθ᾽ ὑμῶν буквально утверждает, что Бог «с вами»; добавление «терпелив» отсутствует в источнике. Выражение μέρος ἔχειν θεοῦ следует передать с явной связью с Богом, а не как безличную «участь перед Богом». Наконец, ᾧ στρατεύεσθε буквально говорит о том, кому адресаты служат как воины; именование его «Военачальником» — допустимая интерпретация образа, но не прямой текст.
  naturalness: Текст в целом современный и хорошо сохраняет энергичный ряд увещаний. После замены «ложитесь» на «отдыхайте» и устранения неявного добавления в фразе о Боге русский текст остаётся естественным. «Удел у Бога» — более понятная литературная передача, чем буквальное «иметь долю Бога», при сохранении направленности исходной формулы.
  terminology: «Епископ», «пресвитеры», «диаконы», «управители», «служители», «жалованье», «дезертир», «шлем», «копьё» и «полный доспех» уместны. «Советники» для πάρεδροι приемлемо при поясняющем примечании. Для ἀντίψυχον предпочтительнее явно выразить готовность отдать жизнь, не превращая слово в технический догматический термин.
  issues:
  - severity: medium
    issue: «Вместе ложитесь»
    rationale: Греч. συναναπαύεσθε означает «отдыхайте вместе», «обретайте покой вместе», а не просто совместно ложитесь.
  - severity: high
    issue: «как Бог терпелив к вам»
    rationale: В греческом тексте стоит «как и Бог с вами»; понятие терпения в этой части фразы не выражено и не должно добавляться переводом.
  - severity: medium
    issue: «разделить с ними участь перед Богом»
    rationale: Формула μέρος ἔχειν θεοῦ содержит прямую связь с Богом («иметь долю/удел у Бога»). «Перед Богом» меняет образ и ослабляет исходную конструкцию.
  - severity: low
    issue: «Военачальнику»
    rationale: 'Военная метафора несомненна, но греческий текст не употребляет здесь титул «военачальник», а говорит: «тому, кому вы служите как воины». Более буквальная передача избегает лишней конкретизации.'
  revised_text: 'Будьте внимательны к епископу, чтобы и Бог был внимателен к вам. Я готов отдать жизнь за вас, повинующихся епископу, пресвитерам и диаконам. Да будет мне дано вместе с ними обрести удел у Бога. Трудитесь вместе, вместе подвизайтесь, вместе бегите, вместе страдайте, вместе отдыхайте и вместе восставайте — как Божьи управители, советники[a] и служители.


    Угождайте тому, кому вы служите как воины и от кого получаете жалованье. Пусть никто из вас не окажется дезертиром. Пусть ваше крещение остаётся для вас оружием[b], вера — шлемом, любовь — копьём, терпение — полным доспехом. Пусть вашими вкладами будут ваши дела, чтобы вы получили причитающуюся вам выплату[c]. Поэтому будьте долготерпеливы друг к другу в кротости, как и Бог с вами. Пусть я всегда радуюсь вам!'
  revised_footnotes:
  - marker: a
    text: 'Или: «заседатели», «помощники, сидящие рядом».'
    reason: Греческое πάρεδροι может обозначать лиц, сидящих рядом с должностным лицом как помощники или заседатели; «советники» передаёт общий смысл без утверждения определённой церковной должности.
  - marker: b
    text: 'Буквально: «как оружие» или «как боевое снаряжение»; «щит» — возможная контекстуальная конкретизация.'
    reason: Греческое ὅπλα имеет более широкое значение, чем отдельный предмет вооружения, и не требует перевода «щит».
  - marker: c
    text: Образ построен на языке денежного вклада и получения причитающейся суммы.
    reason: Примечание поясняет финансовую метафору δεπόσιτα и ἄκκεπτα, не сводя её к определённой доктрине о заслуге или спасении.
  revision_rationale: 'Исправлены смысловые расхождения с греческим текстом: совместный отдых вместо укладывания, пребывание Бога с адресатами вместо добавленного утверждения о Божьем терпении, а также явная связь «удела» с Богом. Военный образ передан без интерпретирующего титула. Сохранены порядок образов, современный литературный регистр и все требуемые примечания.'
