source:
  text: Ignatius, who is also Theophorus, unto her that is beloved by God the Father of Jesus Christ; to the holy church which is in Tralles of Asia, elect and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto Him; which church also I salute in the Divine plenitude after the apostolic fashion, and I wish her abundant greeting.
