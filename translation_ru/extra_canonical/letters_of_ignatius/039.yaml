base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: ru
  text: Игнатий, называемый также Богоносцем, — возлюбленной Богом, Отцом Иисуса Христа, святой церкви в Траллах Асийских, избранной и достойной Бога, имеющей мир во плоти и духе через страдания Иисуса Христа, Который есть наша надежда через наше воскресение к Нему. Эту церковь и я приветствую в божественной полноте, по-апостольски, и желаю ей всякой радости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: Богоносец
  rationale: Традиционное и смыслово прозрачное русское соответствие имени-прозвания; сохраняет игру между именованием и богословским содержанием.
- source_word: passion (πάθος)
  choice: страдания
  rationale: Во множественном числе по-русски естественно обозначает крестные страдания Христа и сохраняет церковно-исторический смысл без излишней архаизации.
- source_word: flesh and spirit (σαρκὶ καὶ πνεύματι)
  choice: во плоти и духе
  rationale: Формальное соответствие сохраняет антропологическую и экклезиологическую широту выражения, не сводя его заранее к телесной и духовной сферам.
- source_word: Divine plenitude
  choice: божественной полноте
  rationale: Сохраняет насыщенный богословский образ и не уточняет его референт сверх имеющегося свидетельства.
- source_word: abundant greeting
  choice: всякой радости
  rationale: Передаёт эпистолярное пожелание χαίρειν естественной русской формулой, а не буквальным и неуклюжим «обильного приветствия».
theological_decisions:
- issue: Связь воскресения с Христом в выражении «through our resurrection unto Him»
  choice: через наше воскресение к Нему
  alternative: через Его воскресение ради нас
  rationale: Сохранено чтение предоставленного свидетельства и его направленность «к Нему»; не внесено богословски более привычное, но текстуально иное упоминание воскресения Христа.
- issue: Значение мира «во плоти и духе»
  choice: имеющей мир во плоти и духе
  alternative: живущей в телесном и духовном мире
  rationale: 'Сохранена неоднозначность: выражение может относиться и к целостному состоянию церкви, и к двум измерениям мира; толкование не навязывается.'
- issue: «Божественная полнота»
  choice: в божественной полноте
  alternative: полнотой Божьей благодати
  rationale: Не добавлено слово «благодать», отсутствующее в доступном свидетельстве; сохранена богословская напряжённость образа.
translation_notes:
  register: Современный литературный русский с умеренно церковным достоинством. Синтаксис посвящения сохранён как единое развернутое приветствие, но упорядочен для ясности. Проект основан на предоставленном англоязычном свидетельстве средней редакции; прямая сверка с греческим источником ещё требуется.
