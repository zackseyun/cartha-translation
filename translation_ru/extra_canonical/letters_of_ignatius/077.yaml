base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: ru
  text: 'Славлю Иисуса Христа, Бога, даровавшего вам такую мудрость, ибо я понял, что вы утверждены в непоколебимой вере, словно пригвождены ко кресту Господа Иисуса Христа и плотью, и духом, и твёрдо утверждены в любви, в крови Христа. Вы вполне убеждены относительно нашего Господа, что Он истинно из рода Давида по плоти, но Сын Божий по Божественной воле и силе; что Он истинно родился от Девы и был крещён Иоанном, чтобы Им была исполнена всякая праведность;


    что Он истинно был пригвождён во плоти ради нас при Понтии Пилате и Ироде-тетрархе, плодом чего являемся мы, — то есть плодом Его преблаженного страдания; и что Он, чтобы через Своё воскресение воздвигнуть знамя на все века для Своих святых и верных, как среди иудеев, так и среди язычников, — в едином теле Своей Церкви.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: I give glory
  choice: Прославляю
  rationale: Естественная и достойная современная формулировка, передающая действие воздаяния славы.
- source_word: established in faith immovable
  choice: утверждены в непоколебимой вере
  rationale: Сохраняет образ прочной установленности и качество веры без лишнего толкования.
- source_word: nailed on the cross
  choice: пригвождены ... ко кресту
  rationale: Сохраняет резкий образ сопричастности кресту, важный для дальнейшего христологического утверждения.
- source_word: of the race of David according to the flesh
  choice: из рода Давида по плоти
  rationale: Сохраняет раннехристианскую библейскую формулу и её христологическую точность.
- source_word: ensign
  choice: знамя
  rationale: Передаёт публичный, объединяющий знак, воздвигнутый воскресением для всех веков.
- source_word: one body of His Church
  choice: едином теле Своей Церкви
  rationale: Сохраняет экклезиологический образ единого тела без конфессионального уточнения.
theological_decisions:
- issue: Именование Иисуса Христа Богом
  choice: Иисуса Христа, Бога
  alternative: Иисуса Христа — Бога
  rationale: Сохранено прямое приложение английского свидетеля, не ослабляющее явное богословское исповедание текста.
- issue: Соотношение происхождения от Давида и сыновства Богу
  choice: но Сын Божий по Божественной воле и силе
  alternative: и Сын Божий по воле и силе Бога
  rationale: Союз «но» сохраняет напряжённое сопоставление «по плоти / по Божественной воле и силе», не объясняя его позднейшими формулами.
- issue: Исполнение всякой праведности
  choice: чтобы Им была исполнена всякая праведность
  alternative: чтобы Он исполнил всякую праведность
  rationale: Пассивная конструкция сохраняет двусмысленность английского witness «by Him» и возможную аллюзию на Мф. 3:15.
- issue: Плод страдания Христа
  choice: мы являемся плодом этого, то есть Его преблаженного страдания
  alternative: плодом которого являемся мы — плодом Его блаженнейших страданий
  rationale: Сохранена связь общины с плодом страдания, не уточняя механизм этой связи.
- issue: Знамя через воскресение
  choice: через Своё воскресение Он воздвиг знамя
  alternative: Он мог через Своё воскресение воздвигнуть знамя
  rationale: Передана целевая конструкция свидетельства без введения оттенка простой возможности.
translation_notes:
  register: Современный литературный русский с умеренно церковным достоинством; сохранены традиционные и прозрачные формулы «по плоти», «Сын Божий», «всякая праведность», «тело Церкви». Черновик основан на предоставленном публично-доступном английском свидетельстве; прямую сверку с греческим текстом средней редакции ещё предстоит выполнить.
