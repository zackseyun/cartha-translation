revisions:
- from: 'Прославляю Иисуса Христа, Бога, даровавшего вам такую мудрость. Ибо я увидел, что вы утверждены в непоколебимой вере, словно пригвождены плотью и духом ко кресту Господа Иисуса Христа, и прочно укоренены в любви в крови Христа. Вы твёрдо убеждены о нашем Господе, что Он истинно из рода Давида по плоти, но Сын Божий по Божественной воле и силе; что Он истинно родился от Девы и был крещён Иоанном, чтобы Им была исполнена всякая праведность;


    что Он истинно был пригвождён во плоти ради нас при Понтии Пилате и Ироде-тетрархе — и мы являемся плодом этого, то есть Его преблаженного страдания; и что через Своё воскресение Он воздвиг знамя на все века для Своих святых и верных — как среди иудеев, так и среди язычников — в едином теле Своей Церкви.'
  to: 'Славлю Иисуса Христа, Бога, даровавшего вам такую мудрость, ибо я понял, что вы утверждены в непоколебимой вере, словно пригвождены ко кресту Господа Иисуса Христа и плотью, и духом, и твёрдо утверждены в любви, в крови Христа. Вы вполне убеждены относительно нашего Господа, что Он истинно из рода Давида по плоти, но Сын Божий по Божественной воле и силе; что Он истинно родился от Девы и был крещён Иоанном, чтобы Им была исполнена всякая праведность;


    что Он истинно был пригвождён во плоти ради нас при Понтии Пилате и Ироде-тетрархе, плодом чего являемся мы, — то есть плодом Его преблаженного страдания; и что Он, чтобы через Своё воскресение воздвигнуть знамя на все века для Своих святых и верных, как среди иудеев, так и среди язычников, — в едином теле Своей Церкви.'
  rationale: Редакция исправляет синтаксическую двусмысленность в первом образе, делает естественным параллелизм «в любви, в крови Христа» и восстанавливает целевую конструкцию заключения. Неоднозначная, эллиптическая связь общины с плодом страдания намеренно не истолкована шире исходного текста.
