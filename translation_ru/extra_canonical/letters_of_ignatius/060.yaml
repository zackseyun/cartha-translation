review_pass:
  verdict: revise
  source_fidelity: Требуется безопасная правка по греческому тексту среднерецензионной традиции. В частности, φιλόυλον означает не «вещественное желание», а «любовь к веществу/материи»; также ἔσωθέν μοι («внутри меня, мне») следует передать в самой фразе о живой воде. «Князь этого века» точнее передаёт τοῦ αἰῶνος τούτου, хотя «этого мира» отражает английское свидетельство.
  naturalness: 'Текст в целом литературен и хорошо сохраняет увещевательный регистр. Формулировка «а пить я желаю Его кровь» нуждается в небольшой перестройке для естественного русского синтаксиса: «и в качестве питья желаю Его крови».'
  terminology: Сохранены удачные традиционные формулы «князь этого века», «семя Давида», «плоть Иисуса Христа», «нетленная любовь». «Любовь к веществу» точно передаёт редкое греческое φιλόυλον, не навязывая позднейшую доктрину о материи. «Влечение» для ἔρως возможно и уместно в данном контексте.
  issues:
  - severity: medium
    issue: «вещественное желание»
    rationale: Греческое πῦρ φιλόυλον буквально выражает «огонь любви к веществу/материи», а не желание, которое само является вещественным. Нынешний вариант меняет смысл связи слов.
  - severity: medium
    issue: Пропущено «внутри меня» в описании живой воды
    rationale: В оригинале живая вода «живая и говорящая во мне», затем «внутри меня говорящая мне». Проект передаёт лишь то, что вода говорит, без её пребывания и речи внутри автора.
  - severity: low
    issue: «Князь этого мира»
    rationale: Это традиционно понятное выражение, но τοῦ αἰῶνος τούτου — «этого века/века сего». В данном тексте точность важна, поскольку автор употребляет αἰών, а ниже — κόσμος («мир»).
  - severity: low
    issue: «Который произошёл от семени Давида»
    rationale: «Произошёл» допустимо, но греческое ὁ ἐκ σπέρματος Δαυίδ компактно и прямо передаётся библейской формулой «из семени Давида».
  revised_text: 'Князь этого века хочет растерзать меня и извратить моё устремление к Богу. Поэтому пусть никто из вас, кто рядом, не помогает ему. Напротив, будьте на моей стороне — то есть на стороне Бога. Не говорите об Иисусе Христе, желая при этом мира. Пусть зависть не поселится в вас.


    Даже если я сам, оказавшись среди вас, стану просить вас, не слушайтесь меня; лучше поверьте тому, что я пишу вам. [Ибо][a] я пишу вам, будучи жив, но желая умереть. Моё влечение распято, и во мне нет огня любви к веществу; во мне же — живая вода, говорящая внутри меня: «Приди к Отцу».


    Не влекут меня ни пища тления, ни наслаждения этой жизни. Я желаю хлеба Божьего — плоти Иисуса Христа, сущего из семени Давида; и в качестве питья желаю Его крови — нетленной любви.'
  revised_footnotes:
  - marker: a
    text: Слово «Ибо» в используемом английском свидетельстве дано в квадратных скобках как редакционное восстановление. Оно соответствует греческому γάρ в среднерецензионной традиции; текстологическое положение этой части следует сверять с критическим изданием и рукописными свидетельствами.
    reason: Сохраняет редакционный сигнал английского свидетельства, одновременно отмечая, что предоставленный греческий текст содержит γάρ.
  revision_rationale: 'Исправлены два смысловых расхождения с греческим текстом: φιλόυλον передано как «любовь к веществу», а внутренняя речь живой воды выражена явно. «Век» разграничен с «миром» (κόσμος), сохранены прямые христологические и евхаристические формулы без конфессионального толкования. Скобочное «[Ибо]» и сноска сохранены, поскольку исходный аудит помечает его как редакционное восстановление.'
