source:
  text: 'The prince of this world would fain tear me in pieces and corrupt my mind to Godward. Let not any of you therefore who are near abet him. Rather stand ye on my side, that is on God''s side. Speak not of Jesus Christ and withal desire the world. Let not envy have a home in you.


    Even though I myself, when I am with you, should beseech you, obey me not; but rather give credence to these things which I write to you. [For] I write to you in the midst of life, yet lusting after death. My lust hath been crucified, and there is no fire of material longing in me, but only water living and speaking in me, saying within me, Come to the Father.


    I have no delight in the food of corruption or in the delights of this life. I desire the bread of God, which is the flesh of Christ who was of the seed of David; and for a draught I desire His blood, which is love incorruptible.'
