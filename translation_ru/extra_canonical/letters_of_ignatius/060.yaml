base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: ru
  text: 'Князь этого мира хочет растерзать меня и извратить моё устремление к Богу. Поэтому пусть никто из вас, находящихся рядом, не помогает ему. Лучше будьте на моей стороне — то есть на стороне Бога. Не говорите об Иисусе Христе, желая при этом мира. Пусть зависть не живёт в вас.


    Даже если я сам, оказавшись среди вас, стану умолять вас, не слушайтесь меня; лучше верьте тому, что я пишу вам. [Ведь][a] я пишу вам, будучи ещё жив, но страстно желая смерти. Моё влечение распято, и во мне нет огня вещественного желания; во мне лишь живая вода, которая говорит: «Иди к Отцу».


    Не радуют меня ни пища тления, ни удовольствия этой жизни. Я желаю хлеба Божьего — плоти Христа, Который произошёл от семени Давида; а пить я желаю Его кровь — нетленную любовь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Ведь» в используемом английском свидетельстве дано в квадратных скобках как редакционное восстановление; прямую проверку по греческому тексту ещё предстоит провести.
    reason: Сохраняет обозначенный в исходных данных текстологический сигнал и не выдаёт восстановленное слово за бесспорную часть текста.
lexical_decisions:
- source_word: prince/ruler of this world (ὁ ἄρχων τοῦ αἰῶνος τούτου)
  choice: князь этого мира
  rationale: Сохраняет традиционный раннехристианский титул и его личностный характер; «князь» здесь естественнее и выразительнее, чем административное «правитель».
- source_word: corrupt my mind to Godward
  choice: извратить моё устремление к Богу
  rationale: Передаёт направленность мысли и воли к Богу, не сводя выражение только к интеллектуальному «мнению».
- source_word: lust/desire (ἔρως)
  choice: влечение
  rationale: Сохраняет напряжённость образа распятого желания, избегая чрезмерно узкого современного значения слова «похоть».
- source_word: material longing / matter (ὕλη)
  choice: вещественное желание
  rationale: Передаёт противопоставление материального влечения и живой воды, не привнося позднейшей систематической терминологии.
- source_word: food of corruption
  choice: пища тления
  rationale: Сохраняет образность и богословски значимое противопоставление тленного и нетленного.
- source_word: seed of David
  choice: семя Давида
  rationale: Сохраняет библейскую формулу происхождения Мессии без её пояснительного перефразирования.
theological_decisions:
- issue: Повеление не слушаться Игнатия, если лично он станет просить обратного
  choice: «не слушайтесь меня; лучше верьте тому, что я пишу вам»
  alternative: Пояснить, что речь идёт о возможной просьбе освободить его от мученичества
  rationale: Текст намеренно создаёт напряжение между будущей личной просьбой и нынешним письмом; пояснение не внесено в основной текст.
- issue: «Плоть Христа» и «Его кровь»
  choice: Сохранены прямые телесные формулировки
  alternative: Ослабить до метафорических «духовной пищи» и «духовного питья»
  rationale: Источник прямо связывает хлеб Божий с плотью Христа и питьё — с Его кровью; конфессиональное истолкование этой связи не добавляется.
- issue: «Кровь — нетленная любовь»
  choice: Сохранена конструкция отождествления
  alternative: Передать как «Его кровь, дарующую нетленную любовь»
  rationale: Источник допускает сильную аппозиционную формулировку; причинное объяснение было бы интерпретационным добавлением.
- issue: «Иди к Отцу»
  choice: Единственное число, обращённое к автору
  alternative: «Приди к Отцу»
  rationale: «Иди» естественно передаёт внутренний призыв направиться к Отцу и не предполагает, что говорящий уже находится у Него.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского увещания. Архаизмы сведены к минимуму, но сохранены укоренённые библейские выражения «князь этого мира», «пища тления» и «семя Давида». Перевод предварительный: предоставлен английский свидетельский текст, тогда как непосредственная сверка со среднерецензионной греческой традицией ещё не выполнена.'
