base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: ru
  text: 'Поскольку я не смог написать всем церквам, так как внезапно отплыл из Троады в Неаполь, по повелению Божьей воли, ты напиши церквам, находящимся впереди, как человек, имеющий Божье разумение, чтобы и они сделали то же самое: кто может, пусть пошлёт вестников, а остальные — письма через тех, кого пошлёшь ты, чтобы вы были прославлены делом непреходящей значимости, ибо это достойно тебя.


    Приветствую каждого по имени, особенно жену Эпитропа со всем её домом и её детьми. Приветствую моего возлюбленного Аттала. Приветствую того, кто будет назначен идти в Сирию. Благодать да будет всегда с ним и с Поликарпом, который посылает его.


    Всегда прощаюсь с вами в нашем Боге Иисусе Христе. Пребывайте в Нём, в Божьем единстве и под надзором.[a] Приветствую Алку — имя, очень дорогое мне. Прощайте в Господе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально: «в единстве Божьем и в надзоре (ἐπισκοπή)». Слово «Божьем» грамматически относится к «единству»; термин «надзор» не уточняет, подразумевается ли личное попечение или церковное служение.'
    reason: Передаёт синтаксис греческого текста и сохраняет значение ἐπισκοπή без конфессионального истолкования.
lexical_decisions:
- source_word: the mind of God (English witness; Greek review pending)
  choice: разумом Божьим
  rationale: Сохраняет сильную формулировку свидетельства без её ослабления до «благочестивого рассуждения»; выражение естественно в патристическом контексте.
- source_word: messengers
  choice: посланников
  rationale: Передаёт людей, лично направляемых церквами, и отличает их от писем.
- source_word: ever-memorable deed
  choice: навеки памятным делом
  rationale: Сохраняет идею непреходящей памяти и торжественный регистр, не делая фразу чрезмерно архаичной.
- source_word: supervision of God
  choice: под Божьим надзором
  rationale: Сохраняет буквальный смысл доступного английского свидетельства и не подменяет его конфессионально нагруженным термином вроде «епископство».
- source_word: Alce
  choice: Алку
  rationale: Передаёт женское имя Alce как «Алка» в винительном падеже; имя оставлено без попытки семантического перевода.
theological_decisions:
- issue: «our God Jesus Christ»
  choice: «в нашем Боге Иисусе Христе»
  alternative: «в Иисусе Христе, нашем Боге»
  rationale: Прямо сохраняет высокую христологическую формулировку свидетельства и её синтаксическую связь, не ослабляя титул.
- issue: Связь местоимения в «in whom abide ye»
  choice: «Пребывайте в Нём»
  alternative: связать пребывание с более общей формулой «в Боге»
  rationale: Ближайший грамматический антецедент в свидетельстве — Иисус Христос; при этом перевод не добавляет дальнейшего толкования.
- issue: «unity and supervision of God»
  choice: «в единстве и под Божьим надзором»
  alternative: «в единстве и епископстве Божьем»
  rationale: Сохранена смысловая напряжённость доступного свидетельства без внесения определённой модели церковного управления; прямой анализ греческого источника ещё предстоит.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным эпистолярным тоном. Формы обращения различены по числу: поручение Поликарпу передано в единственном числе, заключительное обращение к общине — во множественном. Черновик остаётся предварительным, поскольку предоставлен английский публичнодоменный свидетель, а прямая сверка со среднерецензионным греческим текстом отмечена как ожидающая выполнения.'
