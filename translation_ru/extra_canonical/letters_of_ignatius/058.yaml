base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: ru
  text: 'От Сирии до самого Рима я сражаюсь с дикими зверями — на суше и на море, ночью и днём, связанный среди десяти леопардов, то есть отряда воинов. Когда с ними обходятся по-доброму, они становятся только хуже. Однако через их злодеяния я всё более становлюсь учеником, хотя этим и не оправдываюсь.



    Пусть звери, приготовленные для меня, станут мне на радость. Молюсь, чтобы они оказались готовы; я даже приманю их, чтобы они поскорее пожрали меня, — не так, как с некоторыми: из страха они не решились их тронуть. И даже если они сами не захотят, когда я буду готов, я сам принужу их к этому.



    Позвольте мне. Я знаю, что мне полезно. Теперь я начинаю становиться учеником. Пусть ничто видимое или невидимое не позавидует мне, чтобы мне достичь Иисуса Христа. Пусть придут огонь и крест, схватки с дикими зверями, [рассечения и растерзания],[b] выворачивание костей, отсечение членов, сокрушение всего моего тела; пусть обрушатся на меня жестокие мучения дьявола — лишь бы мне достичь Иисуса Христа.'
  philosophy: optimal-equivalence
