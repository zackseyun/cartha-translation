revisions:
- from: 'От Сирии до самого Рима я сражаюсь с дикими зверями — на суше и на море, ночью и днём, связанный среди десяти леопардов, то есть отряда воинов. Когда с ними обходятся по-доброму, они становятся только хуже. Однако из-за их злодеяний я всё больше становлюсь учеником, хотя этим и не оправдываюсь.


    Пусть принесут мне радость звери, приготовленные для меня. Молюсь, чтобы они оказались готовы; я даже приманю их, чтобы они поскорее пожрали меня, — не так, как случилось с некоторыми, которых они побоялись тронуть. И даже если они сами не захотят, когда я буду готов, я заставлю их.


    Потерпите меня. Я знаю, что мне полезно. Теперь я начинаю становиться учеником. Пусть ничто видимое или невидимое не препятствует мне достичь Иисуса Христа.[a] Пусть придут огонь и крест, схватки с дикими зверями, [рассечения и растерзания],[b] выворачивание костей, отсечение членов, сокрушение всего моего тела; пусть обрушатся на меня жестокие мучения дьявола — лишь бы мне достичь Иисуса Христа.'
