lexical_decisions:
- source_word: θηριομαχῶ (предположительная греческая основа по традиционному тексту)
  choice: сражаюсь с дикими зверями
  rationale: Сохраняет яркую метафору обращения с конвоируемым узником и одновременно её связь с ожидаемой ареной.
- source_word: δέκα λεοπάρδοις
  choice: среди десяти леопардов
  rationale: Буквальный образ сохранён; следующее авторское пояснение указывает, что речь идёт об отряде воинов.
- source_word: μαθητεύομαι
  choice: становлюсь учеником
  rationale: Передаёт процесс, а не уже завершённый статус; повтор этой формулы важен для развития мысли.
- source_word: δεδικαίωμαι
  choice: оправдываюсь
  rationale: Сохраняет богословски насыщенный глагол и оговорку автора, не сводя её к общему «невиновен».
- source_word: ἐπιτύχω Ἰησοῦ Χριστοῦ
  choice: достичь Иисуса Христа
  rationale: Сохраняет направленность к личной встрече и не уточняет сверх текста характер этого достижения.
- source_word: βασκανία / βασκανέω (предположительная лексема)
  choice: препятствует
  rationale: Естественно передаёт в контексте пожелание, чтобы никакая сила не помешала цели; буквальное «завидует» отмечено в сноске как возможная образность.
theological_decisions:
- issue: Связь страдания, ученичества и оправдания
  choice: «из-за их злодеяний я всё больше становлюсь учеником, хотя этим и не оправдываюсь»
  alternative: «через их несправедливость я лучше обучаюсь, но от этого не становлюсь праведным»
  rationale: Сохранено напряжение между ростом в ученичестве через страдание и отрицанием того, что само страдание оправдывает автора.
- issue: Значение «достичь Иисуса Христа»
  choice: Не истолковывать как заслужение спасения или только как физическую смерть
  alternative: «соединиться с Иисусом Христом»
  rationale: Более буквальная формула сохраняет открытым точный оттенок эсхатологической надежды автора.
- issue: «Мучения дьявола»
  choice: Сохранить родительный оборот без уточнения способа действия
  alternative: «мучения, насылаемые дьяволом»
  rationale: Не решает без необходимости, означает ли оборот источник, принадлежность или характер мучений.
