    rationale: 'Это русское выражение означает «сносите меня», тогда как φέρετέ μοι в контексте является просьбой позволить ему принять мученичество: «Позвольте мне».'
  - severity: medium
    issue: «Пусть ничто видимое или невидимое не препятствует мне»
    rationale: Основной текст заменяет образ ζηλωσάτω («пусть не завидует/не ревнует») его предполагаемым следствием. Для оптимально-эквивалентного перевода образ следует оставить в тексте, не разрешая его однозначно.
  - severity: low
    issue: «Пусть принесут мне радость звери»
    rationale: Оборот несколько меняет перспективу греческого пожелания автора получить радость/пользу от зверей. «Пусть ... станут мне на радость» естественнее и ближе.
  - severity: low
