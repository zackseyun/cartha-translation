base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: ru
  text: 'Итак, избегайте этих дурных побегов, приносящих смертоносный плод: кто вкусит его, тотчас умирает. Ведь эти люди — не насаждение Отца.


    Если бы они были Его насаждением, то оказались бы ветвями Креста, и плод их был бы нетленным. Этим Крестом Он через Свои страдания призывает нас, Его члены. Ведь не может быть головы без членов, поскольку Бог обещает единство, а это единство — Он Сам.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод выполнен по английскому свидетельству Дж. Б. Лайтфута; прямая сверка с греческим текстом средней редакции ещё требуется. Поэтому синтаксически трудные выражения о Кресте и единстве переданы без окончательного устранения их неоднозначности.
    reason: Предоставленный источник прямо указывает, что обзор греческого оригинала ещё не проведён; читателю следует обозначить временную текстологическую ограниченность перевода.
lexical_decisions:
- source_word: vile offshoots
  choice: дурные побеги
  rationale: Сохраняет растительный образ и отрицательную оценку, не прибегая к архаичному или чрезмерно резкому слову.
- source_word: deadly fruit
  choice: смертоносный плод
  rationale: Передаёт причиняющую смерть природу плода и поддерживает развернутую метафору насаждения и ветвей.
- source_word: the Father’s planting
  choice: насаждение Отца
  rationale: Сохраняет библейски окрашенную метафору принадлежности Богу и связи с дальнейшим образом ветвей.
- source_word: branches of the Cross
  choice: ветви Креста
  rationale: Формально сохраняет необычный и богословски насыщенный образ исходного свидетельства, не заменяя его толкованием.
- source_word: passion
  choice: страдания
  rationale: Естественное современное русское обозначение страданий Христа в данном контексте.
- source_word: union
  choice: единство
  rationale: Передаёт мысль о соединённости главы и членов; «единение» также возможно, но «единство» естественнее в итоговом утверждении.
theological_decisions:
- issue: К кому относится местоимение «Он» и каким образом Крест «призывает»
  choice: «Этим Крестом Он через Свои страдания призывает нас»
  alternative: «Крестом, к которому Он призывает нас через Свои страдания»
  rationale: Сохранена синтаксическая напряжённость английского свидетельства и не внесено толкование, будто призыв обязательно направлен именно к Кресту.
- issue: Соотношение Христа как главы и верующих как членов
  choice: «нас, Его члены. Ведь не может быть головы без членов»
  alternative: «нас, поскольку мы — Его члены»
  rationale: Сохранена непосредственная связь образов и краткость, без добавочного причинного отношения, которого явно нет в доступном свидетельстве.
- issue: «Это единство — Он Сам»
  choice: Сохранено буквально как богословски напряжённое утверждение
  alternative: «единство с Ним»
  rationale: Альтернатива сгладила бы и истолковала формулировку; доступное свидетельство отождествляет обещанное единство с Самим Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Сохранена цепь образов «побеги — плод — насаждение — ветви», а также «голова — члены». Архаизмы и конфессионально маркированные пояснения не вводились.
