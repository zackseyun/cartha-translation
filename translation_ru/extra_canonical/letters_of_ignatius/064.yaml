  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: ru
  text: Игнатий, называемый также Богоносцем, — церкви Бога Отца и Господа Иисуса Христа, находящейся в Филадельфии Асийской, помилованной и утверждённой в единомыслии Божьем, ликующей в страданиях нашего Господа и непоколебимо уверенной в Его воскресении благодаря полноте милости. Приветствую её в крови Иисуса Христа. Она — вечная и непреходящая радость, особенно если все пребывают в единстве с епископом, с пресвитерами, которые при нём, и с диаконами, поставленными согласно мысли Иисуса Христа. Он по Своей воле утвердил и укрепил их Своим Святым Духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен с учётом предоставленного древнего свидетельства в английском переводе и доступной формы греческого текста средней редакции; окончательная сверка с критическим греческим изданием необходима. В частности, синтаксическая связь слов об уверенности, воскресении и милости допускает иное членение.'
    reason: В метаданных прямо указано, что непосредственная проверка греческого источника ещё не завершена; примечание честно обозначает текстологическую и синтаксическую неопределённость.
lexical_decisions:
- source_word: Θεοφόρος
  choice: Богоносец
  rationale: Традиционное и прозрачное русское соответствие имени-прозвания со значением «несущий Бога» или, при иной интерпретации формы, «носимый Богом»; сама форма оставлена без разъясняющего перефразирования.
- source_word: ἐκκλησίᾳ
  choice: церкви
  rationale: В адресной формуле речь идёт о местной христианской общине; привычное «церковь» сохраняет историко-богословский смысл.
- source_word: ὁμόνοια
  choice: единомыслие
  rationale: Передаёт согласие и внутреннее единство общины, не сводя понятие лишь к организационному единству.
- source_word: πάθος
  choice: страдания
  rationale: Естественное русское обозначение страданий и смерти Христа; форма множественного числа привычна в христианской речи и не ограничивает значение одним эпизодом.
- source_word: ἐπίσκοπος / πρεσβύτεροι / διάκονοι
  choice: епископ / пресвитеры / диаконы
  rationale: Сохранены исторические названия служений без подмены позднейшими конфессиональными моделями.
- source_word: γνώμη
  choice: мысль
  rationale: Сохраняет возможный диапазон «мысль, замысел, воля», не отождествляя слово полностью с последующим θέλημα.
- source_word: παράμονος
  choice: непреходящая
  rationale: Передаёт устойчивость и длительность радости естественным литературным русским языком.
theological_decisions:
- issue: Связь уверенности с воскресением и милостью
  choice: «непоколебимо уверенной в Его воскресении благодаря полноте милости»
  alternative: «ликующей в страданиях... и в Его воскресении, будучи вполне уверенной во всякой милости»
  rationale: 'Синтаксис греческой традиции допускает неодинаковое членение. Выбранное чтение образует естественную русскую фразу, однако не превращает уверенность в рациональное доказательство: её основанием остаётся милость.'
- issue: Антецедент фразы «вечная и непреходящая радость»
  choice: 'Отнесено к церкви: «Она — вечная и непреходящая радость»'
  alternative: Отнести к приветствию или крови Иисуса Христа
  rationale: Женский род относительного местоимения в реконструируемом греческом тексте естественнее соотносится с ἐκκλησία; смысловая необычность сохранена, а не сглажена.
- issue: Субъект утверждения служителей
  choice: «Он... утвердил и укрепил их» — Иисус Христос
  alternative: Понимать субъектом Бога Отца
  rationale: Ближайший явный референт — Иисус Христос; местоименная форма всё же сохраняет лаконичность исходной фразы.
- issue: Церковное единство
  choice: «если все пребывают в единстве с епископом...»
  alternative: «если они едины с епископом...»
  rationale: Добавленное «все» лишь делает понятным подразумеваемый субъект множественного числа и не определяет позднейшую модель церковного управления.
translation_notes:
  register: Современный литературный русский язык с достоинством древней эпистолярной формулы. Длинное греческое приветствие разделено на несколько предложений для ясности, но последовательность образов и церковных служений сохранена. Архаизмы вроде «коей» и «о Господе» не использованы; традиционные термины «Богоносец», «пресвитеры» и «диаконы» сохранены как исторически значимые.
