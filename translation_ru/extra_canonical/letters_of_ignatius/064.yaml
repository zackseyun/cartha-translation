  source_fidelity: 'В черновике существенно смещена синтаксическая связь заключительных определений первой части: «благодаря полноте милости» делает милость основанием уверенности в воскресении, тогда как английское свидетельство (и допустимое членение греческой фразы) говорит о радости в страдании и воскресении без колебаний и об уверенности «во всякой милости». Также добавленное «все» не выражено в источнике, а местоимение «их» в конце способно отнести действие Христа ко всем перечисленным служителям, хотя относительное местоимение относится непосредственно к диаконам. В исправлении сохранена отмеченная текстологическая/синтаксическая осторожность.'
  naturalness: Исправленный вариант остаётся современным литературным русским и сохраняет торжественный адресный регистр. «Страдания Господа» передаёт традиционное значение πάθος без ненужной архаизации; «если они едины» естественно передаёт множественное число исходной фразы, не добавляя «все».
  terminology: «Богоносец», «церковь», «единомыслие», «епископ», «пресвитеры» и «диаконы» уместны. «Согласно мысли Иисуса Христа» сохраняет различие между «мыслью/замыслом» и последующей «волей». В заключении уточнено, что «которых» обозначает диаконов; это не задаёт позднейшей конфессиональной модели служения.
