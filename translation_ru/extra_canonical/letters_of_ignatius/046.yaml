base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: ru
  text: 'Поэтому остерегайтесь таких людей. Это непременно будет так, если вы не возгордитесь и останетесь неразлучны с [Богом] Иисусом Христом, с епископом и с установлениями апостолов.


    Кто находится внутри святилища, тот чист, а кто вне святилища — нечист. Иными словами, кто делает что-либо без епископа, пресвитеров и диаконов, тот нечист в своей совести.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: be ye ... on your guard
  choice: остерегайтесь
  rationale: Естественный современный русский императив, точно передающий призыв быть настороже.
- source_word: puffed up
  choice: возгордитесь
  rationale: Передаёт нравственный смысл надменности и самовозвышения, сохраняя возвышенный, но понятный регистр.
- source_word: inseparable from
  choice: останетесь неразлучны с
  rationale: Сохраняет сильный образ неразрывного единства, не заменяя его более узким толкованием вроде «будете послушны».
- source_word: ordinances of the Apostles
  choice: установлениями апостолов
  rationale: «Установления» достаточно широко передаёт предписания или установленные порядки, не уточняя их природу сверх доступного свидетельства.
- source_word: sanctuary
  choice: святилища
  rationale: Сохраняет культово-пространственную метафору внутреннего и внешнего, не подменяя её словом «церковь».
- source_word: presbytery
  choice: пресвитеров
  rationale: В данном перечислении речь естественно понимается как о совокупности пресвитеров; русский вариант избегает возможной современной ассоциации слова «пресвитерий» со зданием.
- source_word: clean in his conscience
  choice: чист в своей совести
  rationale: Сохраняет сочетание ритуальной метафоры чистоты с нравственной оценкой совести.
theological_decisions:
- issue: Скобочное чтение [God] перед именем Иисуса Христа
  choice: сохранено как «[Богом] Иисусом Христом»
  alternative: «Иисусом Христом» без скобочного слова либо «Богом Иисусом Христом» без скобок
  rationale: Скобки в предоставленном свидетельстве являются текстовым сигналом; их удаление или превращение добавления в бесспорный текст скрыло бы состояние источниковой основы.
- issue: Соотношение святилища и церковного служения
  choice: метафора «внутри/вне святилища» сохранена, а пояснение переведено прямо
  alternative: истолковать «святилище» непосредственно как институциональную Церковь
  rationale: Автор сам поясняет образ через действия с епископом, пресвитерами и диаконами; перевод не должен заранее сводить образ к одному догматическому определению.
- issue: Фраза «без епископа, пресвитеров и диаконов»
  choice: сохранено буквальное «без», без добавления категорий разрешения или действительности
  alternative: «без разрешения» или «вне власти» этих служителей
  rationale: Такие уточнения могли бы сузить смысл и внести позднейшие конфессиональные категории, отсутствующие в предоставленном свидетельстве.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Архаические формы устранены, но ключевые церковные термины и образ святилища сохранены. Проект остаётся предварительным, поскольку прямая сверка с греческим текстом средней редакции ещё не проведена.
