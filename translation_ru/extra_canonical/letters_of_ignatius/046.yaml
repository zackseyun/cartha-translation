review_pass:
  verdict: revise
  source_fidelity: В целом перевод следует предоставленному английскому свидетельству и сохраняет скобочное «[Бог]». Однако «presbytery» — собирательное обозначение пресвитерского совета/пресвитерия, а не просто множественное число «пресвитеры»; это различие следует сохранить. Прямая сверка с греческой средней редакцией в материалах задачи пока недоступна, поэтому образ «святилища», данный в свидетельстве, не заменяется иным термином.
  naturalness: Регистр в целом современный и уместный. Формулировка «останетесь неразлучны» понятна, но в условном увещании несколько менее естественна, чем «будете неразлучны».
  terminology: «Епископ», «диаконы», «святилище» и «установления апостолов» переданы приемлемо. «Пресвитерий» здесь нужен именно как собирательный термин для presbytery; он не означает помещение в данном контексте.
  issues:
  - severity: medium
    issue: «presbytery» передано как «пресвитеров»
    rationale: Английское свидетельство различает bishop, presbytery и deacons. Перевод множественным числом устраняет собирательный характер среднего члена перечисления и меняет структуру исходного выражения. «Пресвитерий» — устоявшееся русское церковно-историческое обозначение коллегии пресвитеров и не требует понимания как здания в данном синтаксическом окружении.
  - severity: low
    issue: «останетесь неразлучны»
    rationale: Смысл передан, но «будете неразлучны» естественнее в условной конструкции и не вносит оттенка сохранения ранее достигнутого состояния.
  revised_text: 'Поэтому остерегайтесь таких людей. Это непременно будет так, если вы не будете надменны и будете неразлучны с [Богом] Иисусом Христом, с епископом и с установлениями апостолов.


    Кто находится внутри святилища, тот чист, а кто вне святилища — нечист. Иными словами, кто делает что-либо без епископа, пресвитерия и диаконов, тот нечист в своей совести.'
  revised_footnotes: []
  revision_rationale: 'Исправлено собирательное «пресвитерий» для точной передачи presbytery. Условная фраза слегка выровнена стилистически: «не будете надменны и будете неразлучны». Скобочное чтение «[Богом]» сохранено, как и метафора святилища; ни одно из них не получает дополнительного конфессионального истолкования.'
