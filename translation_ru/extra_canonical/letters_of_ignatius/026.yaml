  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: ru
  text: 'Да и вам не следует пользоваться молодостью вашего епископа как поводом относиться к нему свысока; напротив, сообразно силе Бога Отца оказывайте ему всяческое почтение. Я узнал, что и святые пресвитеры не пользуются его видимой молодостью, но уступают ему как человеку, мудрому в Боге, — впрочем, не ему, а Отцу Иисуса Христа, Епископу всех.


    Итак, ради чести Того, кто пожелал вас[a], вам подобает повиноваться без притворства. Ведь человек не столько обманывает этого видимого епископа, сколько обманывает Невидимого; и в таком случае он имеет дело не с плотью, а с Богом, знающим сокрытое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Того, кто пожелал вас». Глагол может подразумевать Божью волю или избрание, но это не выражено в тексте прямо; референт также не назван прямо.'
    reason: Сноска сохраняет смысловую и референтную сдержанность исходной формулировки, не представляя «призвал» как прямой лексический эквивалент.
lexical_decisions:
- source_word: presume upon / take advantage of his youth (καταχρῆσθαι τῇ νεότητι, по известному греческому тексту средней редакции)
  choice: пользоваться молодостью ... как поводом относиться к нему свысока
  rationale: Передаёт не просто факт молодости, а недолжное использование молодого возраста епископа для умаления его авторитета; добавление «как поводом» естественно раскрывает смысл по-русски.
- source_word: πρεσβύτεροι / presbyters
  choice: пресвитеры
  rationale: Сохраняет раннехристианский служебный термин и не подменяет его позднейшей конфессиональной терминологией.
- source_word: ἐν Θεῷ φρόνιμος / prudent in God
  choice: мудрому в Боге
  rationale: Сохраняет необычную богословскую формулу и связь мудрости с Богом, не сводя её к обычной житейской рассудительности.
- source_word: ἐπίσκοπος πάντων / Bishop of all
  choice: Епископу всех
  rationale: Сохраняет авторскую метафору и параллель между видимым епископом и Богом; прописная буква указывает на Бога как референта.
- source_word: ἀνυποκρίτως / without dissimulation
  choice: без притворства
  rationale: Современная и ясная передача идеи нелицемерного, искреннего послушания.
- source_word: τὰ κρύφια / hidden things
  choice: сокрытое
  rationale: Краткая, естественная и несколько возвышенная формулировка, сохраняющая представление о том, что Бог знает тайное.
theological_decisions:
- issue: К кому относится выражение «Тот, кто пожелал вас»
  choice: 'Сохранено: «Того, кто пожелал вас»'
  alternative: «Того, кто избрал вас» или явное указание на Бога
  rationale: Свидетель допускает не вполне определённый оттенок глагола и референта; перевод не должен без достаточного основания устранять эту неоднозначность.
- issue: Послушание епископу как отношение к Богу
  choice: Сохранено резкое сопоставление видимого епископа с Невидимым, но без утверждения их тождества
  alternative: Ослабить до общего наставления уважать церковную власть
  rationale: 'У Игнатия богословская напряжённость намеренна: обман видимого предстоятеля рассматривается как попытка обмануть невидимого Бога.'
- issue: Титул Бога «Епископ всех»
  choice: Сохранён буквально как «Епископ всех»
  alternative: «Надзиратель над всеми» или «Пастырь всех»
  rationale: Буквальная передача сохраняет игру с церковным титулом и аргументацию от земного епископа к Богу.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис умеренно формальный, но без архаизмов вроде «ибо», «дабы» и «сей». Термины «епископ» и «пресвитеры» сохранены как исторически уместные. Черновик остаётся предварительным ввиду указанного в задании отсутствия завершённой прямой сверки с греческим текстом.
