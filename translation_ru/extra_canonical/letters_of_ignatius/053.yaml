base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: ru
  text: Игнатий, называемый также Богоносцем, — Церкви, обретшей милость в величии Всевышнего Отца и Иисуса Христа, Его единственного Сына; Церкви, возлюбленной и просвещённой по воле Того, Кто восхотел, чтобы существовало всё сущее, по вере и любви к Иисусу Христу, нашему Богу; Церкви, первенствующей в краю римлян, достойной Бога, достойной чести, достойной того, чтобы её называли блаженной, достойной похвалы, достойной достижения цели, чисто первенствующей в любви, живущей по закону Христа и носящей имя Отца. Эту Церковь я приветствую во имя Иисуса Христа, Сына Отца. Тем, кто плотью и духом соединены со всякой Его заповедью, исполнены Божьей благодати без различия и очищены от всякой чуждой примеси, — обильное приветствие в Иисусе Христе, нашем Боге, в непорочности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: Богоносец
  rationale: Традиционное и прозрачное русское соответствие имени-прозвания; передаёт его греческое значение, не устраняя возможной смысловой многозначности.
- source_word: hath the presidency / having the presidency
  choice: первенствует / первенствует в любви
  rationale: Сохраняет повтор и намеренно не уточняет, идёт ли речь о руководстве, почётном положении или ином виде первенства.
- source_word: country of the region of the Romans
  choice: в пределах области римлян
  rationale: Передаёт географическую формулу без чрезмерной модернизации и без отождествления её с более поздней церковной юрисдикцией.
- source_word: worthy of felicitation
  choice: достойна ублажения
  rationale: Сохраняет отдельный элемент риторического ряда; «ублажение» здесь означает признание блаженной, а не доставление удовольствия.
- source_word: worthy of success
  choice: достойна успеха
  rationale: Сохранена необычная формула свидетеля без домысливания конкретного смысла благополучия или достижения цели.
- source_word: filtered clear from every foreign stain
  choice: очищен от всякой чуждой примеси
  rationale: Передаёт образ удаления посторонней примеси естественным русским языком, не вводя отсутствующего конфессионального толкования.
- source_word: in flesh and spirit
  choice: плотью и духом
  rationale: Сохранена антропологическая парность и её возможное богословское напряжение.
theological_decisions:
- issue: Наименование Иисуса Христа Богом
  choice: Иисусу Христу, нашему Богу / в Иисусе Христе, нашем Боге
  alternative: Иисусу Христу нашему Богу без обособления
  rationale: Свидетель дважды прямо связывает титул «наш Бог» с Иисусом Христом; пунктуация делает русскую фразу ясной, не ослабляя этого утверждения.
- issue: «Первенство» Римской церкви
  choice: Сохранено как «первенствует», включая «первенствует в любви»
  alternative: «председательствует», «главенствует» или толкование как всемирная юрисдикция
  rationale: Исходная формула допускает разные оттенки; перевод не должен заранее разрешать историко-экклезиологический спор.
- issue: Местоимение в выражении «всякой Его заповедью»
  choice: Сохранено местоимение «Его» с прописной буквы
  alternative: Явно назвать Христа или Отца
  rationale: Ближайшая цепочка упоминает Иисуса Христа и Отца, а английский свидетель не устраняет референциальную неоднозначность; эксплицитация была бы толкованием.
- issue: «Носящая имя Отца»
  choice: носит имя Отца
  alternative: «именуется по Отцу» или «принадлежит Отцу»
  rationale: Сохранён образ и возможный богословский смысл без поясняющей подмены.
translation_notes:
  register: Современный литературный русский с достоинством древнего эпистолярного приветствия. Длинный период расчленён точкой перед обращением к членам Церкви, но анафорический ряд «достойна» и повтор «первенствует» сохранены. Поскольку прямой просмотр греческого текста отмечен как ещё не выполненный, спорные места переведены консервативно по предоставленному публичному свидетелю и аудированному английскому слою.
