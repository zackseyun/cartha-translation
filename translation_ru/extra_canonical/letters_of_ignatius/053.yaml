- from: Игнатий, называемый также Богоносцем, — Церкви, обретшей милость по щедрости Всевышнего Отца и Иисуса Христа, Его единственного Сына; Церкви, возлюбленной и просвещённой по воле Того, Кто пожелал, чтобы существовало всё сущее, — через веру и любовь к Иисусу Христу, нашему Богу; Церкви, которая первенствует в пределах области римлян, достойна Бога, достойна чести, достойна ублажения, достойна похвалы, достойна успеха, достойна чистоты и первенствует в любви, живёт по закону Христа и носит имя Отца. Эту Церковь я приветствую во имя Иисуса Христа, Сына Отца. Тем, кто плотью и духом соединён со всякой Его заповедью, непоколебимо исполнен Божьей благодати и очищен от всякой чуждой примеси, — обильное приветствие в Иисусе Христе, нашем Боге, в непорочности.
