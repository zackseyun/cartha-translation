base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: ru
  text: 'Ибо я знаю и верю, что и после воскресения Он пребывает во плоти.


    Когда Он пришёл к тем, кто был с Петром, Он сказал им: «Возьмитесь за Меня, ощупайте Меня и убедитесь, что Я не бесплотный демон».[a] Они тотчас прикоснулись к Нему и уверовали, соединившись с Его плотью и духом. Поэтому они презрели смерть и оказались выше смерти. После воскресения Он ел и пил вместе с ними как пребывающий во плоти, хотя духовно был соединён с Отцом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бесплотный демон». В античном употреблении это слово могло обозначать духовное существо и не обязательно подразумевало злого духа в современном смысле.'
    reason: Сохраняет δαιμόνιον в основном тексте и кратко поясняет историческое значение слова.
lexical_decisions:
- source_word: in the flesh
  choice: во плоти
  rationale: Сохраняет раннехристианскую богословскую формулу и подчёркивает реальную телесность воскресшего Христа.
- source_word: Peter and his company
  choice: Петру и бывшим с ним
  rationale: Естественно передаёт группу людей при Петре, не уточняя их статус сверх свидетельства.
- source_word: Lay hold and handle me
  choice: Возьмитесь за Меня, прикоснитесь ко Мне
  rationale: Передаёт два телесных действия и призыв удостовериться осязанием.
- source_word: demon without a body
  choice: бесплотный дух
  rationale: По греческой традиции здесь засвидетельствовано δαιμόνιον ἀσώματον; слово «дух» в данном контексте звучит по-русски естественно, а сноска сохраняет буквальное значение «демон».
- source_word: being joined unto His flesh and His blood
  choice: соединившись с Его плотью и кровью
  rationale: Сохраняет необычный и богословски напряжённый образ, не сводя его лишь к физическому прикосновению или евхаристии.
- source_word: proved superior to death
  choice: оказались сильнее смерти
  rationale: Ясно и естественно выражает превосходство над смертью без чрезмерно буквального оборота.
- source_word: as one in the flesh
  choice: как имеющий плоть
  rationale: Подчёркивает телесное состояние воскресшего Иисуса и избегает неестественного русского оборота.
theological_decisions:
- issue: Телесность Христа после воскресения
  choice: «был во плоти и после воскресения»
  alternative: «оставался телесным после воскресения»
  rationale: Формулировка сохраняет характерный язык источника и его антидокетическую направленность.
- issue: Соединение учеников с плотью и кровью Христа
  choice: Сохранить формулу без поясняющей интерпретации
  alternative: Истолковать как физическое прикосновение или евхаристическое общение
  rationale: Источник допускает богословскую многозначность; перевод не должен молча устранять её.
- issue: Связь Христа с Отцом
  choice: «духовно был соединён с Отцом»
  alternative: «по духу пребывал в единстве с Отцом»
  rationale: Сохраняет противопоставление реальной плоти и духовного единения, не превращая его в позднейшую догматическую формулу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского свидетельства. Синтаксис сделан ясным для обычного читателя; устойчивые богословские выражения «во плоти», «плоть и кровь» и «соединён с Отцом» сохранены. Проект предварительный: предоставлен английский перевод-свидетель, тогда как непосредственная сверка с греческим источником обозначена как ожидающая выполнения.'
