  to: 'Ибо я знаю и верю, что и после воскресения Он пребывает во плоти.


    Когда Он пришёл к тем, кто был с Петром, Он сказал им: «Возьмитесь за Меня, ощупайте Меня и убедитесь, что Я не бесплотный демон».[a] Они тотчас прикоснулись к Нему и уверовали, соединившись с Его плотью и духом. Поэтому они презрели смерть и оказались выше смерти. После воскресения Он ел и пил вместе с ними как пребывающий во плоти, хотя духовно был соединён с Отцом.'
