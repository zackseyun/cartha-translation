base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: ru
  text: 'Я больше не хочу жить по-человечески; и это сбудется, если вы того захотите. Пожелайте этого, чтобы и вы сами были желанны. В этом кратком письме умоляю вас: поверьте мне.


    И Иисус Христос откроет вам, что я говорю истину, — Иисус Христос, неложные уста, через которые Отец говорил [истинно].[a]


    Молитесь обо мне, чтобы я достиг цели [через Святого Духа].[b] Я пишу вам не по плоти, а по мысли Божьей. Если я пострадаю — вы этого пожелали; если же буду отвергнут — вы меня возненавидели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «истинно» заключено в скобки в доступном английском свидетельстве; проверка греческой рукописной традиции ещё требуется.
    reason: Отмечает текстуальную неопределённость, уже обозначенную в предоставленном источнике.
  - marker: b
    text: Слова «через Святого Духа» заключены в скобки в доступном английском свидетельстве; необходима сверка с греческим текстом.
    reason: Сохраняет явную неопределённость исходного свидетельства и не выдаёт добавление за бесспорный текст.
lexical_decisions:
- source_word: after the manner of men
  choice: по-человечески
  rationale: Естественно передаёт образ жизни, свойственный людям, не перегружая фразу буквальным оборотом «по образу людей».
- source_word: desire / desired
  choice: пожелать / быть желанными
  rationale: Сохраняет намеренную словесную связь и неоднозначность повторяющегося глагола, насколько это возможно по-русски.
- source_word: unerring mouth
  choice: неложные уста
  rationale: Достоинственный и богословски нейтральный оборот, сохраняющий метафору уст и значение отсутствия лжи или заблуждения.
- source_word: attain
  choice: достиг цели
  rationale: Русский глагол требует подразумеваемого дополнения; «цели» сохраняет неопределённость того, чего именно Игнатий надеется достичь.
- source_word: after the mind of God
  choice: по мысли Божьей
  rationale: Сохраняет противопоставление «по плоти» и Божьему замыслу или разумению, не уточняя его как отдельную доктрину.
theological_decisions:
- issue: Посредничество Христа в речи Отца
  choice: «через которые Отец говорил»
  alternative: «в которых Отец говорил»
  rationale: Русское «через» яснее выражает образ Христа как уст Отца, тогда как свидетель использует формально неоднозначное «in whom».
- issue: Неопределённая цель слова «достиг»
  choice: «достиг цели»
  alternative: «достиг мученичества»
  rationale: Контекст предполагает мученическую смерть, однако свидетель не называет её прямо; перевод не должен устранять эту сдержанность.
- issue: Заключительная условная антитеза
  choice: «Если я пострадаю… если же буду отвергнут…»
  alternative: будущие формы «Если мне предстоит пострадать…»
  rationale: Сохранена напряжённая условность текста без догматического объяснения причинности между желанием адресатов и судьбой автора.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Синтаксис сделан ясным для обычного читателя, но сохранены повтор «пожелать / желанны», антитеза «по плоти / по мысли Божьей» и резкость последних условных фраз. Проект предварительный, поскольку прямой анализ греческого текста ещё не выполнен.
