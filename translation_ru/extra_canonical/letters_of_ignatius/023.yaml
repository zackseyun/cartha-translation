base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: ru
  text: Игнатий, называемый также Богоносцем, — церкви в Магнесии-на-Меандре, благословлённой по благодати Бога Отца во Христе Иисусе, нашем Спасителе. В Нём приветствую её и желаю ей преизобильной радости в Боге Отце и в Иисусе Христе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен по предоставленному английскому свидетельству Дж. Б. Лайтфута; непосредственная сверка со среднегреческой рукописной традицией ещё требуется.'
    reason: В исходных данных прямо указано, что проверка по греческому тексту ожидается; читателю важно обозначить ограниченность текстовой основы.
lexical_decisions:
- source_word: Ignatius, who is also Theophorus
  choice: Игнатий, называемый также Богоносцем
  rationale: Традиционное и понятное русское соответствие имени-титула Θεοφόρος; формула «называемый также» не разрешает возможную смысловую многозначность титула.
- source_word: her / the church which is in Magnesia on the Maeander
  choice: церкви в Магнесии-на-Меандре … приветствую её
  rationale: Женский род английского местоимения относится к церкви; название уточнено естественной русской географической формой.
- source_word: blessed through the grace
  choice: благословлённой по благодати
  rationale: Сохраняет связь благословения с Божьей благодатью, не превращая её в указание на человеческую заслугу.
- source_word: abundant greeting
  choice: преизобильной радости
  rationale: Эпистолярное приветствие передано идиоматично и торжественно; «радость» отражает характер раннехристианской приветственной формулы лучше буквального «обильного приветствия».
theological_decisions:
- issue: Отношение благословения к Отцу, Христу и благодати
  choice: «благословлённой по благодати Бога Отца во Христе Иисусе»
  alternative: «благословлённой благодатью Бога Отца и Иисуса Христа»
  rationale: 'Сохранена синтаксическая зависимость, засвидетельствованная предоставленным английским источником: благодать исходит от Бога Отца, а благословение совершается во Христе; координация Отца и Сына здесь не добавляется.'
- issue: Антецедент выражения «в Нём»
  choice: Сохранено «В Нём» без поясняющей замены имени
  alternative: «Во Христе»
  rationale: Местоимение сохраняет формальную связь с ближайшим упоминанием Иисуса Христа и не вносит лишнего толкования.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Начальная формула оформлена как адресное надписание; избегнуты архаизмы вроде «о Господе» и тяжеловесное буквальное «обильное приветствие». Термин «Богоносец» сохранён как укоренившаяся церковно-историческая форма, понятная из контекста имени-титула.
