base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: ru
  text: Ефесяне, находящиеся в Смирне, приветствуют вас; отсюда и я пишу вам. Они находятся здесь со мной во славу Божью, как и вы, и вместе с Поликарпом, епископом смирнян, всячески утешили меня. Приветствуют вас также и все остальные церкви — в чести Иисуса Христа.[a] Прощайте, пребывая в согласии с Богом, и храните непоколебимый дух, который есть Иисус Христос.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетелю: «в чести Иисуса Христа». Возможный точный оттенок выражения требует сверки с греческим текстом.'
    reason: Исходные данные прямо указывают, что проверка по греческому оригиналу ещё не проведена; необычную формулу не следует молча нормализовать.
  - marker: b
    text: 'Или: «обладайте непоколебимым духом, который есть Иисус Христос». Здесь сохранена необычная прямая связь духа с Иисусом Христом без дополнительного истолкования.'
    reason: Фраза богословски неоднозначна, а доступная основа перевода не позволяет надёжно разрешить эту неоднозначность.
lexical_decisions:
- source_word: Ephesians from/in Smyrna
  choice: Ефесяне, находящиеся в Смирне
  rationale: Передаёт, что представители эфесской общины в тот момент пребывали в Смирне, не создавая впечатления, будто они происходили из Смирны.
- source_word: for the glory of God
  choice: во славу Божью
  rationale: Естественная современная русская формула, сохраняющая целевое значение выражения.
- source_word: bishop of the Smyrnaeans
  choice: епископ смирнян
  rationale: Сохраняет раннехристианское обозначение служения и связь Поликарпа с общиной Смирны.
- source_word: in godly concord
  choice: пребывая в согласии с Богом
  rationale: Свидетель допускает буквальное «в Божьем согласии/единомыслии»; выбранная формулировка естественна по-русски и не сводит выражение лишь к взаимному согласию людей.
- source_word: steadfast spirit
  choice: непоколебимый дух
  rationale: Сохраняет образ внутренней твёрдости без неоправданного уточнения, идёт ли речь о человеческом духе, духовном расположении или даруемой Христом реальности.
theological_decisions:
- issue: Фраза «в чести Иисуса Христа»
  choice: Сохранить буквальную связь приветствия всех церквей с честью Иисуса Христа
  alternative: «во имя Иисуса Христа» или «из почтения к Иисусу Христу»
  rationale: В английском свидетеле стоит honor, и без проверки греческого текста нельзя заменять его более привычной, но иной формулой «во имя».
- issue: «дух, который есть Иисус Христос»
  choice: Сохранить прямое отождествляющее придаточное
  alternative: «дух, то есть присутствие Иисуса Христа» или «Духа Иисуса Христа»
  rationale: Так сохраняется богословская напряжённость текста и не вносится толкование о Святом Духе, человеческом духе либо метафорическом присутствии Христа.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Устаревшие формы устранены; церковно-исторические термины «епископ» и «церкви» сохранены. Поскольку прямой разбор греческого источника ожидается, спорные места переведены осторожно и снабжены примечаниями.
