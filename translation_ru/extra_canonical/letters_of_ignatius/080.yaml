review_pass:
  verdict: revise
  source_fidelity: 'Смысловой ход английского свидетеля в целом передан точно: предупреждение о «зверях в человеческом облике», отказ от принятия и даже встречи, молитва об их покаянии, полемика с мнимостью страданий Христа и исповедание реальности собственных уз сохранены. Однако «Иисусу Христу… это подвластно» несколько обезличивает подлежащее и менее прямо передаёт утверждение о власти Христа; его следует восстановить как личное действие. Эллиптический параллелизм «near to the sword, near to God» лучше передать без добавленного сказуемого, не закрепляя толкование, которого нет в источнике.'
  naturalness: 'Текст в основном современный и литературный. Небольшие правки делают начало и афористический фрагмент более естественными по-русски: «обо всём этом», «того же образа мыслей», «близ меча — близ Бога».'
  terminology: «Возлюбленные», «звери в человеческом облике», «лишь по видимости», «узы» и «совершенный Человек» уместны и сохраняют раннехристианский регистр и христологическую формулировку без навязывания специальной конфессиональной терминологии. Местоимение по отношению ко Христу последовательно дано с прописной буквы.
  issues:
  - severity: medium
    issue: Безличная конструкция в высказывании о власти Христа
    rationale: Фраза «Иисусу Христу… это подвластно» грамматически возможна, но ослабляет прямое утверждение свидетеля «Jesus Christ … has power over it». «Иисус Христос… властен и над этим» сохраняет намеренную широту референции «это» и личное подлежащее.
  - severity: low
    issue: Добавленное сказуемое в эллиптическом параллелизме
    rationale: «Но близок к мечу — близок к Богу» вводит сказуемое «близок», тогда как в источнике намеренно краткая номинальная формула. «Близ меча — близ Бога» естественно сохраняет лаконичность и не уточняет субъект.
  - severity: low
    issue: «Об этом» и «так думаете» несколько сужают и упрощают формулировку
    rationale: «Обо всём этом» и «вы сами держитесь того же образа мыслей» точнее передают множественное указание и устойчивую настроенность адресатов, оставаясь современными.
  revised_text: 'Но я предостерегаю вас обо всём этом, возлюбленные, зная, что и вы сами держитесь того же образа мыслей. И всё же я заранее оберегаю вас от зверей в человеческом облике — людей, которых вам следует не только не принимать, но, если возможно, даже не встречать. Только молитесь о них: быть может, они покаются. Это, конечно, трудно, но Иисус Христос, наша истинная жизнь, властен и над этим.


    Ведь если Господь наш совершил всё это лишь по видимости, то и я лишь по видимости нахожусь в узах. Зачем же тогда я предал себя смерти, огню, мечу, зверям? Близ меча — близ Бога; среди зверей — с Богом. Только бы это было во имя Иисуса Христа, чтобы нам пострадать вместе с Ним. Я всё переношу, потому что Он Сам даёт мне силу — совершенный Человек.'
  revised_footnotes: []
  revision_rationale: 'Исправления ограничены стилистикой и более прямым воспроизведением синтаксического и риторического рисунка английского свидетеля. Не добавляются доктринальные выводы; широта «над этим» и множественное «нам пострадать» сохранены. Скобочное восстановление [them] в английском свидетеле не требует русской сноски: русский глагол «встречать» нормативно управляет дополнением, а смысловой объект уже указан словом «людей».'
