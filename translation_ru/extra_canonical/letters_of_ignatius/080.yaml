  english_witness: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: ru
  text: 'Но я предостерегаю вас об этом, возлюбленные, зная, что и вы сами так думаете. И всё же я заранее оберегаю вас от зверей в человеческом облике — людей, которых вам следует не только не принимать, но, если возможно, даже не встречать. Только молитесь о них: быть может, они покаются. Это, конечно, трудно, но Иисусу Христу, нашей истинной жизни, это подвластно.


    Ведь если Господь наш совершил всё это лишь по видимости, то и я лишь по видимости нахожусь в узах. Зачем же тогда я предал себя смерти, огню, мечу, зверям? Но близок к мечу — близок к Богу; среди зверей — с Богом. Только бы это было во имя Иисуса Христа, чтобы нам пострадать вместе с Ним. Я всё переношу, потому что Он Сам даёт мне силу — совершенный Человек.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dearly beloved
  choice: возлюбленные
  rationale: Достоинное и понятное обращение, сохраняющее раннехристианский эпистолярный регистр.
- source_word: wild beasts in human form
  choice: зверей в человеческом облике
  rationale: Сохраняет резкую метафору без смягчения.
- source_word: receive
  choice: принимать
  rationale: Оставляет открытым возможный смысл гостеприимства, общения или церковного принятия.
- source_word: in semblance
  choice: лишь по видимости
  rationale: Естественно передаёт полемику против представления о мнимости страданий, не вводя специального догматического термина.
- source_word: perfect Man
  choice: совершенный Человек
  rationale: Сохраняет христологически значимую формулировку и личностное отнесение к Христу.
theological_decisions:
- issue: Реальность страданий Господа и узничества Игнатия
  choice: «если Господь наш совершил всё это лишь по видимости, то и я лишь по видимости нахожусь в узах»
  alternative: «если Господь наш претерпел это призрачно, то и мои узы призрачны»
  rationale: Выбранный вариант сохраняет параллелизм и богословское напряжение, оставаясь понятным современному читателю.
- issue: «has power over it»
  choice: «Иисусу Христу… это подвластно»
  alternative: «Иисус Христос… властен совершить это»
  rationale: Не уточняет сверх источника, относится ли власть к покаянию противников, преодолению трудности или всей ситуации.
- issue: Сострадание со Христом
  choice: «чтобы нам пострадать вместе с Ним»
  alternative: «чтобы я пострадал вместе с Ним»
  rationale: Сохранено множественное число английского свидетеля, позволяющее услышать общинное участие, хотя контекст говорит о личном мученичестве Игнатия.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания. Архаизмы сведены к минимуму; афористический параллелизм «близок к мечу — близок к Богу» сохранён. Поскольку прямая сверка с греческим источником ещё не выполнена, проект основан на указанном английском публично-доступном свидетеле и должен считаться предварительным.
