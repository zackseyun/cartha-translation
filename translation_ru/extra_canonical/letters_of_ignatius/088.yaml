review_pass:
  verdict: revise
  source_fidelity: Текст в целом точно передаёт свидетельство, однако несколько мест требуют более строгого сохранения его синтаксиса и текстологического сигнала. В частности, «послали сопровождать меня» добавляет цель, которой нет в источнике; «в единстве с Богом и друг с другом» разрешает неоднозначную формулу ἐν ἑνότητι θεοῦ καὶ ὑμῶν; а «телесном и духовном» по-русски должно быть привязано к воскресению, как и грамматически в греческой формуле. Восстановленное [and] должно быть видно непосредственно в основном тексте.
  naturalness: Регистр современный литературный и в целом удачный. «Досточтимый» несколько точнее передаёт venerable, чем «почтенный». Перестроение заключительной части перечисления делает фразу яснее, не сглаживая исходную синтаксическую плотность.
  terminology: «Епископ», «пресвитеры», «диаконы» и «благодать» сохранены уместно. «Братья и сёстры» допустимо передаёт общинное, не обязательно исключительно мужское, употребление ἀδελφοί в данном послании. «Сослужители» приемлемо для fellow-servants.
  issues:
  - severity: medium
    issue: Добавлена цель в описании послания Вурра.
    rationale: Фраза «послали сопровождать меня» утверждает, что целью посылки было сопровождение Игнатия. Свидетельство говорит лишь, что Вурр был послан вместе с ним и с эфесскими братьями.
  - severity: high
    issue: Не сохранена неоднозначность формулы единства.
    rationale: «В единстве с Богом и друг с другом» является интерпретацией выражения «в единстве Бога и вас самих» / ἐν ἑνότητι θεοῦ καὶ ὑμῶν. Сноска не вполне исправляет смысловое разрешение в основном тексте.
  - severity: medium
    issue: Текстологически отмеченное [and] не воспроизведено в основном тексте.
    rationale: В черновике имеется сноска о восстановленном союзе, но сам союз не заключён в квадратные скобки. Сигнал английского свидетельства следует сохранить как [и].
  - severity: medium
    issue: Синтаксическая область определения «телесном и духовном» нуждается в уточнении.
    rationale: В греческой формуле определения σαρκικῇ καὶ πνευματικῇ стоят в единственном числе и грамматически относятся к «воскресению». Формулировка с тире после пары «страдании и воскресении» менее точна.
  revised_text: 'Любовь братьев и сестёр, находящихся в Троаде, приветствует вас. Оттуда я также пишу вам через Вурра, которого вы послали вместе со мной и с вашими братьями и сёстрами — эфесянами. Он всячески подкреплял меня. Желаю, чтобы все подражали ему, потому что он — образец служения Богу. Божья благодать воздаст ему во всём.


    Приветствую вашего благочестивого епископа, ваш досточтимый совет пресвитеров [и][a] моих сослужителей — диаконов, а также всех вас, каждого в отдельности и всех вместе, во имя Иисуса Христа, в Его плоти и крови, страдании и воскресении — телесном и духовном, — в единстве Бога и вас самих.[b] Благодать вам, милость, мир и терпение — всегда.'
  revised_footnotes:
  - marker: a
    text: В доступном английском свидетельстве союз перед «моих сослужителей» восстановлен и заключён в квадратные скобки; прямая сверка с греческой рукописной традицией ещё требуется.
    reason: Сохраняет в основном тексте и поясняет текстологический сигнал, имеющийся в исходном свидетельстве.
  - marker: b
    text: 'Буквально по доступному английскому свидетельству: «в единстве Бога и вас самих». Синтаксическая связь греческой формулы требует проверки по рукописной традиции; перевод намеренно не заменяет её толкованием «с Богом и друг с другом».'
    reason: Сохраняет неоднозначность исходной формулы и фиксирует предварительный характер вывода без навязывания интерпретации.
  revision_rationale: Исправления устраняют добавленный смысл о цели посылки Вурра, восстанавливают в тексте квадратные скобки при спорном союзе и сохраняют неоднозначную формулу единства. Заключительная последовательность перестроена так, чтобы «телесном и духовном» грамматически относилось к воскресению, не устраняя соединение телесного и духовного.
