base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: ru
  text: 'Любовь братьев и сестёр, находящихся в Троаде, приветствует вас. Оттуда я и пишу вам через Вурра, которого вы вместе с вашими братьями и сёстрами — эфесянами — послали сопровождать меня. Он всячески подкреплял меня. Желаю, чтобы все подражали ему, потому что он — образец служения Богу. Божья благодать воздаст ему за всё.


    Приветствую вашего благочестивого епископа, почтенный совет пресвитеров [a] и моих сослужителей — диаконов, а также всех вас, каждого в отдельности и всех вместе, во имя Иисуса Христа, в Его плоти и крови, в Его страдании и воскресении — телесном и духовном, — в единстве с Богом и друг с другом.[b] Благодать вам, милость, мир и терпение — всегда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В доступном английском свидетельстве перед следующим членом перечисления стоит восстановленное в квадратных скобках «и»; прямой анализ греческого текста пока не проведён.
    reason: Сохраняет сигнал текстуальной неуверенности, указанный в исходных данных, не нарушая естественности русского предложения.
  - marker: b
    text: 'Буквально по доступному английскому свидетельству: «в единстве Бога и вас самих»; точная синтаксическая связь требует сверки с греческой рукописной традицией.'
    reason: Фиксирует подлинную неоднозначность формулы единства и предварительный характер работы по английскому свидетелю.
lexical_decisions:
- source_word: the love of the brethren
  choice: любовь братьев и сестёр
  rationale: Передаёт общинное значение «братьев» как всех верующих, не ограничивая выражение только мужчинами.
- source_word: by the hand of Burrhus
  choice: через Вурра
  rationale: Естественно передаёт посредничество Вурра при написании или доставке письма, не уточняя сверх доступного свидетельства.
- source_word: presbytery
  choice: совет пресвитеров
  rationale: Сохраняет раннехристианский церковный термин и одновременно показывает, что речь идёт о коллегии.
- source_word: fellow-servants
  choice: сослужителей
  rationale: Передаёт совместное служение автора и диаконов без оттенка социального рабства, который здесь не является главным.
- source_word: carnal and spiritual
  choice: телесном и духовном
  rationale: «Телесное» в современном русском точнее и естественнее, чем потенциально негативно окрашенное «плотское».
- source_word: patience
  choice: терпение
  rationale: Сохраняет прямое значение добродетели стойкого перенесения испытаний.
theological_decisions:
- issue: Характер страдания и воскресения
  choice: «в Его страдании и воскресении — телесном и духовном»
  alternative: «в Его страдании и воскресении, которые были плотскими и духовными»
  rationale: Сохранено соединение телесного и духовного без попытки догматически распределить определения или устранить напряжение формулировки.
- issue: Формула единства
  choice: «в единстве с Богом и друг с другом»
  alternative: «в единстве Бога и вас самих»
  rationale: Выбрана естественная русская формулировка вероятного отношения единения, но смысловая неоднозначность английского свидетельства отмечена сноской.
- issue: Воздаяние благодати
  choice: «Божья благодать воздаст ему за всё»
  alternative: «Божественная благодать вознаградит его во всём»
  rationale: Сохранена персонифицированная формулировка свидетельства без разработки учения о заслугах.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского послания. Церковные термины «епископ», «пресвитеры», «диаконы» сохранены как исторически уместные и широко понятные. Перевод предварительный: предоставлен английский публичнодоменный свидетель, а прямой разбор греческого текста средней редакции ожидается.'
