source:
  text: 'Let not those that seem to be plausible and yet teach strange doctrine dismay thee. Stand thou firm, as an anvil when it is smitten. It is the part of a great athlete to receive blows and be victorious. But especially must we for God''s sake endure all things, that He also may endure us.


    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
