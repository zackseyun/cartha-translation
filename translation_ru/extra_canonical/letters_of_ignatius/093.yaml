base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: ru
  text: 'Пусть тебя не смущают те, кто кажется убедительным, но учит чуждому учению. Стой твёрдо, как наковальня под ударами. Великому атлету подобает принимать удары и побеждать. Но прежде всего ради Бога мы должны всё переносить, чтобы и Он терпел нас.[a]


    Будь ещё усерднее, чем теперь. Различай времена.[b] Ожидай Того, Кто превыше всякого времени: Вечного, Невидимого, Который ради нас стал видимым; Неосязаемого, Неподверженного страданию, Который ради нас пострадал; Того, Кто ради нас всё претерпел.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по представленному свидетельству: «чтобы и Он терпел нас». Выражение необычно; возможно также понимание «был терпелив к нам», однако текст сохраняет словесную связь с нашим терпением ради Бога.'
    reason: Сохранить смысловую и богословскую напряжённость трудной фразы, не подменяя её более гладким толкованием.
  - marker: b
    text: 'Или: «Замечай сроки (обстоятельства)».'
    reason: Передать диапазон значения слова «времена/сроки» в ожидании прямой сверки с греческим текстом.
lexical_decisions:
- source_word: plausible
  choice: кажется убедительным
  rationale: Передаёт внешнюю правдоподобность таких учителей, не признавая их учение истинным.
- source_word: strange doctrine
  choice: чуждому учению
  rationale: Сохраняет смысл учения, чуждого принятой вере, без излишне конфессионального термина.
- source_word: athlete
  choice: атлету
  rationale: Сохраняет античный образ состязания и при этом понятно современному читателю.
- source_word: Mark the seasons
  choice: Различай времена
  rationale: 'Сохраняет ёмкость выражения: речь может идти о распознавании обстоятельств, сроков или эпох.'
- source_word: Impalpable
  choice: Неосязаемого
  rationale: Точно передаёт телесную недоступность осязанию и поддерживает парадокс воплощения.
- source_word: Impassible
  choice: Неподверженного страданию
  rationale: Передаёт богословски напряжённое понятие без узкоспециального слова «бесстрастный», которое в современном русском часто понимается как эмоциональная холодность.
theological_decisions:
- issue: Фраза «that He also may endure us»
  choice: чтобы и Он терпел нас
  alternative: чтобы и Он поддержал нас / был терпелив к нам
  rationale: Сохранена необычная и трудная взаимность исходного свидетельства; смысл намеренно не сглажен до помощи или принятия.
- issue: Неподверженный страданию, Который пострадал
  choice: Сохранён прямой парадокс
  alternative: Бессмертный, Который претерпел смерть
  rationale: Свидетельство подчёркивает напряжение между неподлежа́нием страданию и реальным страданием ради нас; его нельзя молча разрешать.
- issue: Местоимения о Христе
  choice: Прописные формы «Того», «Кто», «Который»
  alternative: строчные формы
  rationale: Достоинству русского религиозного регистра соответствует традиционное оформление, не меняющее содержания.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Единственное число и обращение на «ты» сохранены. Ритм кратких повелений и христологические парадоксы воспроизведены. Поскольку предоставленная основа — английское публичнодоступное свидетельство, а прямая проверка греческой рукописной традиции ещё не выполнена, формулировки, особенно в трудных местах, следует считать предварительными.
