  source_fidelity: 'Требуется исправление по греческой терминологии: ἀφθαρσία означает «нетление», а не «бессмертие». Кроме того, τὰ κρυπτὰ τοῦ θεοῦ — «сокровенное/сокрытое Божие», без добавления понятия «тайны». Направленность εἰς в выражении о единстве лучше передаётся как «сходится к единству». В заключении ἐν ἀγάπῃ обозначает сферу («в любви»), а не средство («через любовь»).'
  naturalness: После правки текст остаётся современным литературным русским с уместной возвышенной библейской интонацией. «Веруете в любви» несколько возвышенно, но естественно для раннехристианского текста и точнее, чем «верите с любовью».
  terminology: «Первосвященник» и «Святое Святых» сохранены. «Нетление» является традиционным и точным соответствием ἀφθαρσία; примечание поясняет необычность сочетания «полнота нетления», не навязывая богословского истолкования.
  issues:
