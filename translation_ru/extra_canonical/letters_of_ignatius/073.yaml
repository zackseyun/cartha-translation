    issue: «исполнение бессмертия»
    rationale: Греческое ἀφθαρσίας означает «нетления, неподверженности тлению», тогда как «бессмертие» соответствует другому термину (ἀθανασία). Существительное ἀπαρτισμός передаёт завершённость, полноту или совершенное осуществление.
  - severity: medium
    issue: «сокровенные тайны Божьи»
    rationale: Добавление «тайны» усиливает смысл сверх τὰ κρυπτὰ τοῦ θεοῦ («сокрытое/сокровенное Божие») и может вызвать ассоциации с иным техническим термином.
  - severity: medium
    issue: «соединяется в единстве Божьем»
    rationale: εἰς ἑνότητα передаёт движение или схождение к единству; «сходится к единству Божию» сохраняет этот оттенок.
  - severity: medium
    issue: «верите с любовью»
    rationale: Греческое ἐν ἀγάπῃ говорит о вере в сфере, состоянии или пребывании любви; русское «с любовью» может означать лишь доброжелательный способ действия.
