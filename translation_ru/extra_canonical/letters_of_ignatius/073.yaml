base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: ru
  text: 'Также и священники были хороши, но лучше Первосвященник, Которому вверено Святое Святых, ибо Ему одному вверено сокровенное Божие. Он Сам — дверь Отца, через которую входят Авраам, Исаак и Иаков, пророки, апостолы и вся Церковь. Всё это сходится к единству Божию.


    Но у Евангелия есть нечто исключительное: пришествие Спасителя, Господа нашего Иисуса Христа, Его страдание и воскресение. Ибо возлюбленные пророки, проповедуя, указывали на Него, а Евангелие есть полнота нетления.[a] Всё вместе хорошо, если вы веруете в любви.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Полнота нетления» передаёт необычное греческое выражение: оно говорит о завершённости или совершенном осуществлении нетления, не уточняя, следует ли понимать это как достигнутую полноту, дар или завершение пути к ней.'
    reason: Пояснить трудное выражение, сохранив различие между «нетлением» и «бессмертием» и не сводя его к одному толкованию.
  - marker: b
    text: 'Буквально: «если вы веруете в любви». Оборот обозначает веру в сфере или пребывании любви; он не требует выбирать между более развёрнутыми толкованиями этой связи.'
    reason: Сохранить смысловой оттенок греческого предлога ἐν без искусственной догматической конкретизации.
lexical_decisions:
- source_word: High-priest
  choice: Первосвященник
  rationale: Сохраняет храмовый титул и явное превосходство над священниками; прописная буква указывает на уникального носителя титула в данном контексте.
- source_word: holy of holies
  choice: Святое святых
  rationale: Устоявшееся библейское обозначение внутреннего святилища; сохраняет храмовую образность.
- source_word: hidden things of God
  choice: сокровенные тайны Божьи
  rationale: Передаёт идею сокрытого и принадлежащего Богу, не сводя выражение лишь к информации или тайному учению.
- source_word: door of the Father
  choice: дверь Отца
  rationale: Сохраняет прямую метафору и её вероятный евангельский отзвук без поясняющего перефразирования.
- source_word: combine in the unity of God
  choice: соединяется в единстве Божьем
  rationale: Передаёт сведение перечисленного воедино, сохраняя неоднозначность того, означает ли родительный падеж принадлежность Богу или единство, исходящее от Него.
- source_word: singular preeminence
  choice: особое превосходство
  rationale: Естественно выражает уникальный приоритет Евангелия, не превращая его в абсолютное противопоставление пророкам.
- source_word: passion
  choice: страдание
  rationale: Современное и понятное церковно-библейское обозначение страданий Христа в единственном числе, соответствующее формулировке свидетеля.
- source_word: completion of immortality
  choice: исполнение бессмертия
  rationale: Формально сохраняет необычное и богословски насыщенное выражение, не подменяя его толкованием вроде «путь к бессмертию».
- source_word: through love
  choice: с любовью
  rationale: Естественная русская передача образа веры, осуществляемой посредством или в сфере любви; исходная смысловая связь сохранена в примечании.
theological_decisions:
- issue: Отождествление Первосвященника с Христом
  choice: Сохранить подразумеваемое отождествление без вставки имени Христа в первый абзац
  alternative: Явно написать «Христос, Первосвященник»
  rationale: Контекст и последующее упоминание Господа Иисуса Христа делают референт ясным, но добавление имени устранило бы риторическую постепенность исходного текста.
- issue: Вход ветхозаветных праведников, пророков, апостолов и Церкви через дверь Отца
  choice: Сохранить настоящее время «входят» и единый ряд
  alternative: Передать как уже завершённое спасение либо разделить группы по эпохам
  rationale: Так сохраняются временная открытость образа и единство народа Божьего без навязывания конкретной схемы истории спасения.
- issue: Соотношение пророков и Евангелия
  choice: Передать превосходство Евангелия при положительной оценке пророков
  alternative: Противопоставить Евангелие пророческим Писаниям как плохому или недостаточному
  rationale: Текст называет всё хорошим и говорит, что пророки указывали на Христа; превосходство связано с явлением, страданием и воскресением Спасителя.
- issue: «Исполнение бессмертия»
  choice: Сохранить генитивную конструкцию и её напряжённость
  alternative: Истолковать как «завершение учения о бессмертии», «дар бессмертия» или «путь к бессмертию»
  rationale: При отсутствии прямой проверки греческого любая из уточняющих формулировок могла бы преждевременно разрешить подлинную неоднозначность.
- issue: Вера и любовь
  choice: Передать «если вы верите с любовью»
  alternative: «если вы верите посредством любви» или «если вера действует любовью»
  rationale: Выбранная форма естественна по-русски и не импортирует дословно формулу из другого новозаветного места, сохраняя при этом связь веры с любовью.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной раннехристианской интонацией. Сохранены библейские термины «Первосвященник», «Святое святых», «дверь Отца» и «Евангелие», но устранены архаизмы. Проект предварительный: предоставлен английский публично-доменный свидетель, тогда как непосредственная проверка греческой традиции среднего извода ожидается.'
