revisions:
- from: 'Но некоторые по неведению отрекаются от Него — вернее, Он отрёкся от них. Они защищают смерть, а не истину. Их не убедили ни пророчества, ни закон Моисея, ни даже Евангелие — вплоть доныне, — ни страдания каждого из нас, потому что и о нас они думают так же.


    Ибо какая мне польза, если кто-то хвалит меня, но хулит моего Господа, не исповедуя, что Он носил плоть?[a] Кто этого не признаёт, тот тем самым полностью отрекается от Него, а сам носит мёртвое тело.[b]


    Их имён — имён неверующих — я не счёл нужным записывать. Более того, да не случится мне даже вспоминать о них, пока они не раскаются и не обратятся к страданию, которое есть наше воскресение.[c]'
