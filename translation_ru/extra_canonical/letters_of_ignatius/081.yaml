base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: ru
  text: 'Но некоторые по неведению отрекаются от Него — вернее, были отвергнуты Им: они защитники смерти, а не истины. Их не убедили ни пророчества, ни Закон Моисея, ни даже Евангелие поныне, ни страдания каждого из нас, ибо и о нас они думают так же.


    Какая мне польза, если кто-то хвалит меня, но хулит моего Господа, не исповедуя, что Он был носителем плоти?[a] А кто этого не утверждает, тот тем самым совершенно отрекается от Него, сам будучи носителем трупа.[b]


    Имена этих неверующих я не счёл нужным записывать; более того, да не придут они мне даже на память, пока те не раскаются и не обратятся к страданию, которое есть наше воскресение.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что Он был плотоносцем», то есть носителем плоти. Необычный образ подчёркивает действительность Его плоти.'
    reason: Поясняет составное слово σαρκοφόρος, сохраняя его в основном тексте в естественной русской форме.
  - marker: b
    text: 'Буквально: «будучи носителем трупа» (греч. νεκροφόρος). Это намеренная словесная антитеза предшествующему образу «носителя плоти».'
    reason: Сохраняет и объясняет резкий телесный образ и его связь с предыдущим выражением.
  - marker: c
    text: «Страдание» в данном контексте, вероятно, относится к страданию Господа; в основном тексте краткая формулировка источника сохранена без уточнения.
    reason: Указывает вероятный референт, не устраняя неоднозначность переводом.
lexical_decisions:
- source_word: ἀρνοῦνται / ἠρνήθησαν
  choice: «отрекаются / Он отрёкся»
  rationale: 'Сохранена риторическая перемена залога и лица: они отрекаются от Него, но, точнее, сами оказываются отвергнуты Им.'
- source_word: συνήγοροι τοῦ θανάτου
  choice: «защищают смерть»
  rationale: Передаёт образ сторонников или защитников смерти естественным современным русским языком.
- source_word: σαρκοφόρον
  choice: «носил плоть»
  rationale: Сохраняет буквальный образ «плотоносца», но избегает неестественного существительного в основном тексте.
- source_word: νεκροφόρος
  choice: «носит мёртвое тело»
  rationale: Сохраняет намеренный контраст с «носил плоть» и не сглаживает резкий образ автора.
- source_word: πάθος
  choice: «страдание»
  rationale: Оставлено в единственном числе и без добавленного определения «Христово», чтобы сохранить формальную неоднозначность выражения.
- source_word: ἀνάστασις
  choice: «воскресение»
  rationale: Передаёт ключевое богословское утверждение прямо, без поясняющей интерпретации.
theological_decisions:
- issue: Отрицание воплощённости Господа
  choice: «не исповедуя, что Он носил плоть»
  alternative: «не исповедуя, что Он пришёл во плоти»
  rationale: Выбран вариант, передающий необычный авторский образ, а не заменяющий его более знакомой новозаветной формулой.
- issue: Смысл «носит мёртвое тело»
  choice: Образ сохранён без истолкования
  alternative: Передать как «сам духовно мёртв»
  rationale: Источник использует конкретный и полемически заострённый телесный образ; духовная парафраза сняла бы его напряжение.
- issue: К кому относится «страдание»
  choice: «к страданию» без явного дополнения
  alternative: «к страданию Христа»
  rationale: Контекст, вероятно, указывает на страдание Христа, однако добавление имени устранило бы формальную сжатость и возможную неоднозначность текста.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского полемического письма. Синтаксис умеренно упрощён ради ясности, но парадоксы, повторения и резкие телесные образы сохранены. Поскольку предоставленное издание прямо отмечает, что сверка с греческим оригиналом ещё не завершена, решения опираются на доступное свидетельство и известную греческую лексику данного места; перед публикацией желательна окончательная текстологическая сверка.
