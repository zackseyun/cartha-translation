  naturalness: Исходный текст в целом литературен, но оборот «ни даже Евангелие — вплоть доныне, —» пунктуационно и синтаксически тяжеловесен. Перестройка на «ни даже Евангелие поныне» естественнее. «Труп» здесь намеренно резок и соответствует полемической конкретности νεκροφόρος.
  terminology: '«Закон Моисея», «Евангелие», «воскресение» уместны. «Страдание» оставлено без добавления имени Христа: контекстный референт поясняется в сноске, но не навязывается основному тексту. «Носитель плоти» сохраняет необычный христологический образ без подмены привычной формулой «пришёл во плоти».'
