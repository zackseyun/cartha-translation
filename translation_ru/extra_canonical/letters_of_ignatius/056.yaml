    rationale: Греческое ἀλλὰ μεγέθους ἐστὶν ὁ χριστιανισμός говорит о величии, не о силе. Английский audit trail здесь неточен относительно греческого источника.
  - severity: medium
    issue: «становится тем явственнее»
    rationale: 'Причастие ὤν описывает пребывание Христа в Отце, а φαίνεται — состояние явленности: «тем более явен», без оттенка становления.'
