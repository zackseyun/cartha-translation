base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: ru
  text: 'Вы никому не завидовали; вы наставляли других. И я желаю, чтобы наставления, которые вы даёте как учители, оставались в силе.


    Только молитесь, чтобы у меня была сила и внутри, и вовне, чтобы я не только говорил, но и желал; чтобы я не только назывался христианином, но и оказался им. Ведь если я окажусь им, то смогу и называться им и быть верным тогда, когда уже не буду видим для мира.


    Ничто из видимого не благо[a]. Ибо наш Бог Иисус Христос, пребывая в Отце, тем более явен[b]. Дело не в убеждении[c], но христианство — дело величия, когда мир его ненавидит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ничто видимое не благо». Формулировка сохраняет намеренно резкое противопоставление видимого и блага.'
    reason: Греческое τῶν φαινομένων допускает буквальное «из видимого»; примечание отмечает вариант без богословского смягчения.
  - marker: b
    text: 'То есть: «будучи (или пребывая) в Отце, Он тем более явен».'
    reason: Передаёт синтаксическую связь греческого ἐν πατρὶ ὤν ... μᾶλλον φαίνεται и предотвращает ошибочное понимание как становления.
  - marker: c
    text: Греческое слово может означать убеждение или воздействие убеждением; оно не ограничено риторическими речами.
    reason: Сохраняет лексическую широту πεισμονή.
lexical_decisions:
- source_word: grudged
  choice: завидовали
  rationale: Передаёт засвидетельствованный английским переводом смысл недоброжелательного отношения к чужому благу; из-за отсутствия завершённой сверки с греческим выбор остаётся предварительным.
- source_word: power within and without
  choice: сила и внутри, и вовне
  rationale: Сохраняет параллелизм внутренней решимости и внешнего действия, не конкретизируя его сверх свидетельства.
- source_word: be found one
  choice: оказался им
  rationale: Сохраняет противопоставление между именованием христианином и действительным обнаружением себя таковым.
- source_word: visible
  choice: видимое / видеть
  rationale: Сохраняет повторяющийся мотив явленности, хотя в русском контексте требуются разные грамматические формы.
- source_word: persuasiveness
  choice: убедительные речи
  rationale: Естественно передаёт идею словесного убеждения или риторической убедительности без предположения о конкретной технике красноречия.
- source_word: might
  choice: сила
  rationale: Передаёт противопоставление риторической убедительности действенной силе христианства.
theological_decisions:
- issue: Наименование Иисуса Христа Богом
  choice: наш Бог Иисус Христос
  alternative: Иисус Христос, Бог наш
  rationale: Прямо сохраняет высокую христологическую формулировку свидетельства, не смягчая и не поясняя её конфессионально.
- issue: Верность после утраты видимости для мира
  choice: буду верным тогда, когда мир уже не будет меня видеть
  alternative: окажусь верным, когда перестану быть видимым для мира
  rationale: Сохраняет связь верности с предстоящей смертью, не вставляя слово «смерть», которого в предоставленном свидетельстве нет.
- issue: Утверждение «Ничто видимое не является благом»
  choice: сохранено буквально с примечанием
  alternative: Ничто из видимого не имеет истинной ценности
  rationale: Не устраняет напряжённую и потенциально абсолютную формулировку путём богословского смягчения.
- issue: Христианство, ненавидимое миром
  choice: христианство — это сила, когда мир ненавидит его
  alternative: христианство проявляет силу, когда мир его ненавидит
  rationale: Более формально сохраняет предикативное утверждение источника и временно не превращает его в явное утверждение о проявлении силы.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского послания. Перевод сознательно предварительный: предоставлен английский публично-доменный свидетель, а прямая сверка со среднередакционной греческой традицией ещё не выполнена. Архаизмы сведены к минимуму; параллелизмы и парадоксальные формулировки сохранены.'
