  source_fidelity: 'Требуется исправление по греческому тексту среднередакционной традиции. В заключительной антитезе стоит не «сила» (δύναμις), а «величие» (μέγεθος): христианство есть дело величия, а не убеждения. Также ἐν πατρὶ ὤν означает «будучи/пребывая в Отце», а μᾶλλον φαίνεται — «тем более явен», не «становится».'
  naturalness: Русский текст в целом литературен, но «Дело не в убедительных речах» сужает абстрактное πεισμονή до речей, а «мир уже не будет меня видеть» менее естественно и слабее сохраняет мотив явленности, чем «когда я уже не буду видим для мира».
  terminology: «Не завидовали» точно передаёт ἐφθονήσατε. Христологическая формула «наш Бог Иисус Христос» должна быть сохранена. «Наставления» лучше соответствует διδασκαλίαι, чем «уроки», а «найден христианином» яснее удерживает противопоставление имени и действительности.
