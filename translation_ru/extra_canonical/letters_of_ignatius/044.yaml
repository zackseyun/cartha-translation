base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: ru
  text: 'Разве я не могу написать вам о небесном? Но боюсь, как бы не причинить вам вреда, ведь вы ещё младенцы. Поэтому будьте снисходительны ко мне, чтобы вы не подавились, оказавшись не в силах вместить это.


    Ведь и я сам, хотя нахожусь в узах и способен постигать небесное — чины ангелов и построения начальств[a], видимое и невидимое, — ещё не стал от этого учеником. Ибо нам многого недостаёт, чтобы нам не лишиться Бога.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Начальства» — обозначение небесных сил; выражение можно также понять как «соединения» или «устройства начальств».
    reason: Термин и образ допускают несколько оттенков, а прямой разбор греческого источника для данного задания ещё не завершён.
  - marker: b
    text: 'Заключительная фраза намеренно парадоксальна; возможен также смысл: «нам многого недостаёт, чтобы Бог не оставил нас».'
    reason: Сохраняется смысловая напряжённость свидетельства без молчаливого выбора единственного богословского толкования.
lexical_decisions:
- source_word: heavenly things (τὰ ἐπουράνια, по вероятному греческому тексту)
  choice: небесное
  rationale: Собирательная форма естественна по-русски и сохраняет широту выражения, не уточняя без основания, идёт ли речь о тайнах, существах или учении.
- source_word: babes / infants
  choice: младенцы
  rationale: Сохраняет раннехристианский образ духовной незрелости и связь с последующим образом неспособности вместить пищу.
- source_word: take them in
  choice: вместить это
  rationale: Передаёт идею способности принять и усвоить трудное учение, сохраняя метафорическую связь с опасностью подавиться.
- source_word: arrays of the angels
  choice: чины ангелов
  rationale: «Чины» — понятное и традиционное обозначение упорядоченных ангельских рядов; оно не навязывает детальной позднейшей иерархии.
- source_word: musterings of the principalities
  choice: построения начальств
  rationale: 'Необычность образа сохранена: речь идёт об организованных рядах небесных сил, называемых «начальствами».'
- source_word: disciple
  choice: ученик
  rationale: Прямой и богословски нейтральный эквивалент, сохраняющий мысль, что знание само по себе ещё не делает человека истинным учеником.
- source_word: we lack many things
  choice: нам многого недостаёт
  rationale: Сохраняет нарочитый словесный параллелизм заключительной фразы и признание человеческой недостаточности.
theological_decisions:
- issue: Отношение духовного знания к ученичеству
  choice: «ещё не стал от этого учеником»
  alternative: «это ещё не делает меня учеником»
  rationale: 'Выбранная формулировка близка структуре свидетельства и ясно сохраняет напряжение: знание небесного и страдание в узах не являются сами по себе достаточным основанием ученичества.'
- issue: Смысл заключения о недостатке и Боге
  choice: «нам многого недостаёт, чтобы нам не лишиться Бога»
  alternative: «нам ещё многого недостаёт, дабы Бог не оставил нас»
  rationale: Выбранный вариант сохраняет парадокс и не решает без достаточных оснований, означает ли фраза человеческую утрату Бога или оставление Богом. Возможная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Архаизмы сведены к минимуму; сохранены ключевые образы младенчества, пищи, небесного порядка и ученичества. Поскольку предоставлена английская публично-доменная версия, а непосредственная сверка с греческой рукописной традицией обозначена как предстоящая, формулировки и сноски остаются предварительными и не выдают английское свидетельство за полный оригинал-языковой анализ.
