review_pass:
  verdict: revise
  source_fidelity: Смысл в целом передан точно и без конфессионально окрашенных добавлений. Однако «всякого обвинения» неоправданно добавляет количественное «всякого», отсутствующее в свидетельстве, а «совет пресвитеров» несколько сужает собирательное церковное обозначение presbytery до консультативного органа. «Еда и питьё» допустимо, но «пища и напитки» точнее сохраняет противопоставление материальному попечению.
  naturalness: 'Текст в основном современный и литературный. Формулу «живёте не по-человечески, а по Иисусу Христу» лучше передать как «живёте не по человеческому образцу, а по образцу Иисуса Христа»: это естественнее по-русски и сохраняет исходный контраст. «Окажемся в Нём» уместно удерживает будущий оттенок.'
  terminology: «Епископ», «пресвитеры», «диаконы» и «таинства» сохранены удачно. Для presbytery предпочтительно «собранию пресвитеров», поскольку это передаёт коллективное значение без современного оттенка слова «совет». «Порицания» передаёт blame без утверждения доказанной вины и без добавления «всякого».
  issues:
  - severity: medium
    issue: Добавлено слово «всякого» в выражении «остерегаться всякого обвинения».
    rationale: Английское witness имеет blame в единственном общем значении и не содержит квантификатора. Добавление расширяет требование текста.
  - severity: low
    issue: «Совету пресвитеров» придаёт presbytery оттенок совещательного органа.
    rationale: 'Собирательное обозначение лучше передать нейтрально: «собранию пресвитеров».'
  - severity: low
    issue: «По Иисусу Христу» звучит неестественно в современном литературном русском.
    rationale: «По образцу Иисуса Христа» ясно выражает контраст с жизнью «по человеческому образцу», не меняя смысла.
  revised_text: 'Ведь когда вы повинуетесь епископу, как Иисусу Христу, для меня очевидно, что вы живёте не по человеческому образцу, а по образцу Иисуса Христа, Который умер за нас, чтобы вы, уверовав в Его смерть, избежали смерти.


    Поэтому вам необходимо, как вы и привыкли, ничего не делать без епископа. Повинуйтесь также собранию пресвитеров, как апостолам Иисуса Христа, нашей надежды. Ведь если мы живём в Нём, то и окажемся в Нём.


