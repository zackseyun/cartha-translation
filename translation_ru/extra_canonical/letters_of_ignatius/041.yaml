base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: ru
  text: 'Ведь когда вы повинуетесь епископу, как Иисусу Христу, для меня очевидно, что вы живёте не по-человечески, а по Иисусу Христу, Который умер за нас, чтобы вы, уверовав в Его смерть, избежали смерти.


    Поэтому вам необходимо, как вы и привыкли, ничего не делать без епископа. Повинуйтесь также совету пресвитеров, как апостолам Иисуса Христа, нашей надежды. Ведь если мы живём в Нём, то и окажемся в Нём.


    Подобно этому и диаконы таинств Иисуса Христа должны во всём быть угодны всем. Ведь они служители не еды и питья, а Церкви Божьей. Поэтому им следует остерегаться всякого обвинения, как огня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод выполнен по предоставленному английскому свидетельству средней редакции; непосредственная сверка с греческим текстом ещё требуется. Последнее выражение можно также понять как «остерегаться повода для нареканий, как огня».
    reason: Источник прямо отмечает, что проверка по греческому оригиналу ожидается; кроме того, английское blame допускает несколько близких русских передач.
lexical_decisions:
- source_word: bishop
  choice: епископ
  rationale: Устоявшийся русский эквивалент раннехристианского церковного служения; сохраняет историческую терминологию свидетельства.
- source_word: presbytery
  choice: совет пресвитеров
  rationale: Передаёт собирательное значение группы пресвитеров и не смешивает её с самим саном или абстрактным понятием пресвитерства.
- source_word: deacons of the mysteries of Jesus Christ
  choice: диаконы таинств Иисуса Христа
  rationale: Сохраняет широкое и намеренно неуточнённое значение «таинств», не сводя выражение исключительно к позднейшему техническому понятию церковных таинств.
- source_word: servants of the Church of God
  choice: служители Церкви Божьей
  rationale: Естественно передаёт противопоставление служению еде и питью, сохраняя связь с диаконским служением.
- source_word: after men / after Jesus Christ
  choice: по-человечески / по Иисусу Христу
  rationale: Современное и понятное воспроизведение контраста между человеческим образом жизни и жизнью, определяемой Иисусом Христом.
- source_word: blame
  choice: всякого обвинения
  rationale: Сохраняет возможный смысл упрёка, обвинения или основания для нареканий, не утверждая непременно доказанную вину.
theological_decisions:
- issue: Повиновение епископу «как Иисусу Христу»
  choice: сохранено прямое сравнение без поясняющего ограничения
  alternative: «как представителю Иисуса Христа»
  rationale: Добавление идеи представительства разрешило бы напряжение текста и внесло бы отсутствующее в представленном свидетельстве толкование.
- issue: «Уверовав в Его смерть»
  choice: сохранён необычный объект веры — смерть Христа
  alternative: «уверовав в Него благодаря Его смерти»
  rationale: Представленное свидетельство прямо связывает веру с Его смертью; перефразировка могла бы устранить значимую богословскую формулировку.
- issue: «Если мы живём в Нём, то и окажемся в Нём»
  choice: сохранено различие между нынешней жизнью и будущим обнаружением/обретением в Нём
  alternative: «если будем жить в Нём, то пребудем в Нём»
  rationale: Формула «окажемся в Нём» удерживает эсхатологический оттенок и не заменяет его простой идеей продолженного пребывания.
- issue: Диаконы должны «быть угодны всем»
  choice: сохранено широкое требование без нравственного ограничения
  alternative: «стараться служить на благо всем»
  rationale: Более ограниченная формулировка была бы интерпретацией; буквальное напряжение представленного свидетельства сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис упрощён там, где это повышает ясность, но церковно-исторические термины «епископ», «пресвитеры» и «диаконы» сохранены. Заглавные местоимения о Христе употреблены согласно распространённой русской религиозной издательской норме.
