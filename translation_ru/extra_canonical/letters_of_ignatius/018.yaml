base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: ru
  text: 'Поэтому Господь принял помазание на Свою голову, чтобы вдохнуть в Церковь нетление. Не умащайтесь зловонием учения князя этого мира, чтобы он не пленил вас и не лишил жизни, которая перед вами.


    Почему же не все мы поступаем мудро, получив познание Бога, то есть Иисуса Христа? Зачем мы погибаем в своём безрассудстве, не зная дара благодати, который Господь воистину послал?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ointment / anointed
  choice: помазание / умащайтесь
  rationale: Сохранены общий образ благовонного масла и словесная связь между принятым Господом помазанием и предостережением адресатам; «умащаться» естественнее применительно к запаху, чем конфессионально нагруженное «быть помазанными».
- source_word: breathe incorruption upon
  choice: вдохнуть нетление в
  rationale: Сохраняет образ дыхания и богословски значимое «нетление», избегая более отвлечённого «даровать бессмертие».
- source_word: prince of this world
  choice: князь этого мира
  rationale: Традиционное и понятное воспроизведение раннехристианского выражения без уточнения личности сверх текста.
- source_word: walk prudently
  choice: поступаем мудро
  rationale: Передаёт семитизированную метафору поведения естественным современным русским языком.
- source_word: knowledge of God
  choice: познание Бога
  rationale: «Познание» лучше передаёт не только осведомлённость, но и глубокое знание, при этом сохраняется последующее отождествление с Иисусом Христом.
- source_word: gift of grace
  choice: дар благодати
  rationale: Сохраняет оба смысловых компонента исходного свидетельства и раннехристианский богословский регистр.
theological_decisions:
- issue: Соотношение «познания Бога» и Иисуса Христа
  choice: познание Бога — Иисуса Христа
  alternative: познание Божье, то есть Иисуса Христа
  rationale: Тире сохраняет возможное приложение или отождествление, не навязывая более узкого толкования связи между выражениями.
- issue: Образ помазания Господа
  choice: буквально сохранено принятие помазания на голову
  alternative: истолковать как конкретное евангельское помазание
  rationale: Текст не уточняет событие или символику; перевод не должен добавлять такое уточнение.
- issue: incorruption
  choice: нетление
  alternative: бессмертие
  rationale: «Нетление» сохраняет более широкий смысл неподверженности тлению и не сводит его только к бесконечной жизни.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены метафорическая цепочка помазания, запаха и дыхания, а также богословская напряжённость формулы «познание Бога — Иисуса Христа». Поскольку прямой разбор греческого источника ещё не выполнен, проект основан на указанном английском публичнодоменном свидетельстве; спорные места не перегружены пояснениями.
