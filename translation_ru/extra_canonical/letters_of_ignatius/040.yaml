revisions:
- from: 'Я узнал, что ваши помыслы безупречны и что вы непоколебимы в терпении — не по привычке, а по природе. Об этом рассказал мне Поливий, ваш епископ. По воле Бога и Иисуса Христа он посетил меня в Смирне и так радовался вместе со мной моим узам во Христе Иисусе, что в нём я увидел всё ваше множество.


    Итак, приняв через него вашу угодную Богу доброжелательность, я воздал славу, потому что увидел: вы, как я и узнал, подражаете Богу.'
  to: 'Я узнал, что ваш образ мыслей безупречен и что в терпении вы непоколебимы — не по привычке, а по природе. Об этом сообщил мне Поливий, ваш епископ. По воле Бога и Иисуса Христа он посетил меня в Смирне и так разделил со мной радость в моих узах во Христе Иисусе, что в нём я увидел всю вашу общину.


    Итак, получив через него вашу доброжелательность по Богу, я воздал славу, найдя, что вы — подражатели Богу, как я и узнал.'
  rationale: 'Исправлены неточные или неестественные места без изменения смысла: характеристика διάνοια передана как «образ мыслей»; связь Поливия с радостью Игнатия в узах сформулирована по смыслу συγχαρείς μοι ἐν τοῖς δεσμοῖς; «множество» передано контекстуально естественным словом «община»; сохранена структура заключительного «найдя [вас] подражателями Богу». Добавление «по Богу» в выражении о доброжелательности ближе к κατὰ θεόν и избегает двусмысленности «угодная Богу».'
