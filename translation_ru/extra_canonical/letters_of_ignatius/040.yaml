    issue: «ваши помыслы безупречны»
    rationale: Передача «помыслы» во множественном числе делает исходную характеристику внутреннего настроя/образа мыслей менее точной и в русском может вызвать ассоциацию с отдельными мыслями.
  - severity: high
    issue: «он так радовался вместе со мной моим узам»
    rationale: 'Конструкция ненормативна: нельзя «радоваться узам» в таком управлении. Кроме того, συγχαίρειν μοι означает разделить радость с Игнатием, находящимся в узах.'
  - severity: medium
    issue: «в нём я увидел всё ваше множество»
    rationale: Буквальная калька неестественна в современном русском; πᾶν τὸ πλῆθος здесь естественно передать как «всю вашу общину».
  - severity: medium
    issue: '«потому что увидел: вы ... подражаете Богу»'
    rationale: Причастие εὑρών означает «найдя, обнаружив»; существительное μιμητάς лучше сохранить как «подражатели», а не заменять глагольной конструкцией.
