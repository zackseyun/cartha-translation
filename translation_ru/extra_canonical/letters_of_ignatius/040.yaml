base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: ru
  text: 'Я узнал, что ваш образ мыслей безупречен и что в терпении вы непоколебимы — не по привычке, а по природе. Об этом сообщил мне Поливий, ваш епископ. По воле Бога и Иисуса Христа он посетил меня в Смирне и так разделил со мной радость в моих узах во Христе Иисусе, что в нём я увидел всю вашу общину.


    Итак, получив через него вашу доброжелательность по Богу, я воздал славу, найдя, что вы — подражатели Богу, как я и узнал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind (Greek source review pending; likely διάνοια)
  choice: помыслы
  rationale: Передаёт внутренний образ мыслей и нравственную направленность естественнее, чем буквальное «ум», при этом не сужает смысл до мнения или намерения.
- source_word: steadfast in patience (likely ἀδιάκριτον ἐν ὑπομονῇ)
  choice: непоколебимы в терпении
  rationale: Сохраняет сочетание стойкости и терпеливого постоянства, не превращая его лишь в пассивное перенесение страданий.
- source_word: not from habit, but by nature (likely οὐ κατὰ χρῆσιν, ἀλλὰ κατὰ φύσιν)
  choice: не по привычке, а по природе
  rationale: Сохранена выразительная антитеза исходного свидетельства без попытки истолковать её как позднейшее богословское различение природы и благодати.
- source_word: bonds
  choice: узы
  rationale: Достоинственно и привычно для раннехристианского контекста; обозначает заключение Игнатия и сохраняет традиционный образ.
- source_word: godly benevolence (likely τὴν κατὰ θεὸν εὔνοιαν)
  choice: угодная Богу доброжелательность
  rationale: Передаёт и сердечное расположение общины, и его направленность «по Богу», избегая неясного буквального оборота «божественная доброжелательность».
- source_word: imitators of God
  choice: подражаете Богу
  rationale: Прямо сохраняет сильное богословское выражение, не ослабляя его до общего благочестия.
theological_decisions:
- issue: Соотношение воли Бога и Иисуса Христа
  choice: «По воле Бога и Иисуса Христа»
  alternative: «По воле Бога, то есть Иисуса Христа» или «по воле Бога через Иисуса Христа»
  rationale: Союз сохранён без навязывания пояснительной или посреднической связи, которой представленное свидетельство прямо не выражает.
- issue: Выражение «не по привычке, а по природе»
  choice: Сохранить буквально и без догматического разъяснения
  alternative: «не благодаря упражнению, но как врождённое качество»
  rationale: Так сохраняется присущая фразе напряжённость и не вносится позднейшая антропологическая схема.
- issue: Подражание Богу
  choice: Сохранить прямую формулировку
  alternative: «следуете Божьему примеру»
  rationale: Прямая формулировка соответствует древнему свидетельству и не смягчает его богословскую силу.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского послания. Синтаксис умеренно упрощён для ясности, но ключевые антитезы и повторения сохранены. Имена переданы в принятой русской форме: Поливий, Смирна. Поскольку в пакете отмечено, что непосредственная сверка с греческим источником ещё ожидается, решения сформулированы с учётом предоставленного публичного английского свидетельства и доступных указаний на среднюю греческую редакцию.'
