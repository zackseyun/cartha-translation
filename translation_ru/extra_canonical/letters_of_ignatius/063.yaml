base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: ru
  text: 'Пишу вам это из Смирны через эфесян, достойных всяческой похвалы. При мне также Крок, чьё имя мне очень дорого, вместе со многими другими.


    Что касается тех, кто прежде меня отправился из Сирии в Рим во славу Божью, полагаю, вы получили наставления. Дайте им также знать, что я уже близок: все они достойны Бога и вас, и вам подобает поддержать их во всём.[a]


    Пишу вам это за девять дней до сентябрьских календ.[b] Будьте здравы до конца, пребывая в терпении Иисуса Христа.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать подкрепить, утешить или оказать заботливую поддержку; в контексте речь, вероятно, включает попечение о прибывших путниках.
    reason: Передаёт более широкий смысл ἀναψῦξαι, не сводя его к одному лишь ободрению.
  - marker: b
    text: Римская календарная дата сохранена без пересчёта; при обычном включительном счёте она соответствует 24 августа.
    reason: Сохраняет форму древней датировки и поясняет её современному читателю.
  - marker: c
    text: Фраза буквально говорит о «терпении Иисуса Христа». Она может подразумевать стойкость, связанную с Иисусом Христом, и не требует ограничивать смысл только ожиданием Его.
    reason: Сохраняет синтаксическую и смысловую неоднозначность греческого выражения.
lexical_decisions:
- source_word: by the hand of the Ephesians
  choice: через ефесян
  rationale: Передаёт посредничество ефесян в доставке письма естественным современным русским оборотом, не уточняя сверх свидетельства, кто именно был писцом или посланцем.
- source_word: worthy of all felicitation
  choice: достойных всяческих поздравлений
  rationale: Сохраняет необычную похвальную формулу английского свидетельства и не сводит её к более узкому «похвалы».
- source_word: Crocus
  choice: Крок
  rationale: Использована традиционная русская передача греческого личного имени Κρόκος.
- source_word: refresh them
  choice: ободрить их
  rationale: В контексте приёма путников глагол может охватывать поддержку, утешение и заботу; «ободрить» звучит естественно, а примечание сохраняет более широкий смысл.
- source_word: patient waiting
  choice: терпеливо ожидая
  rationale: Передаёт одновременно стойкость и направленное ожидание, не превращая выражение в отвлечённое понятие.
- source_word: Calends of September
  choice: сентябрьских календ
  rationale: Римская календарная формула сохранена без спорного пересчёта, как и в свидетельстве.
theological_decisions:
- issue: «worthy of God and of you»
  choice: достойны Бога и вас
  alternative: достойны перед Богом и перед вами
  rationale: Сохранена сжатая и напряжённая параллель исходного свидетельства; добавление «перед» могло бы сузить смысл до одобрения или оценки.
- issue: «unto the glory of God»
  choice: во славу Божью
  alternative: к славе Божьей
  rationale: Выбрана естественная русская формула цели, без уточнения, относится ли слава к путешествию, служению или его ожидаемому исходу.
- issue: «Fare ye well unto the end»
  choice: Оставайтесь благополучны до конца
  alternative: Прощайте до конца
  rationale: Передан смысл пожелания благополучия и стойкости; буквальное «прощайте» в современном русском ошибочно звучало бы как окончательное расставание.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского письма; синтаксис сделан ясным, но необычные похвальные и богословски ёмкие формулы по возможности сохранены. Поскольку прямая сверка с греческим источником отмечена как ожидающая выполнения, проект осторожно следует предоставленному публичному английскому свидетельству и не вводит неподтверждённых уточнений.
