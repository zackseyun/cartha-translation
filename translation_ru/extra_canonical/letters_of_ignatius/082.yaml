review_pass:
  verdict: revise
  source_fidelity: Нужна правка нескольких мест по греческому тексту средней редакции. Ὁ χωρῶν χωρείτω точнее передаётся как «Кто может вместить, пусть вместит», а не как «Кто способен принять». τόπος означает положение/место, поэтому «положение» точнее «служения». θλιβόμενος — «страждущий», не обязательно «угнетённый». γνώμη τοῦ θεοῦ следует передать как «Божий замысел» (или «мысль Бога»), а не как «воля», поскольку это не тот же термин. Скобочную вставку о божественности Христа необходимо сохранить как отмеченное свидетельством текстологически неуверенное чтение.
  naturalness: Текст в целом литературен, но «своим служением» и «об угнетённом» несколько сужают смысл. Перестроены пунктуация первого предложения и фраза о чуждом учении для более естественного современного русского звучания без потери торжественного регистра.
  terminology: «Евхаристия» уместна и сохранена; её буквальное значение пояснено в сноске без конфессионального истолкования. «Власти» является естественным русским соответствием ἄρχοντες в перечислении небесных и невидимых властей. Формула о плоти Христа сохранена прямой; «воскресил» точно передаёт ἤγειρεν в данном контексте.
  issues:
  - severity: medium
    issue: «Кто способен принять, пусть примет»
    rationale: Исходное Ὁ χωρῶν χωρείτω — намеренно краткая формула со значением «кто может вместить, пусть вместит». «Принять» и особенно добавленное «способен» меняют образ и ослабляют отсылку к традиционной формуле.
  - severity: medium
    issue: «Пусть никто не превозносится своим служением»
    rationale: τόπος буквально означает место, положение; в контексте речь о занимаемом положении, а не о служении как деятельности.
  - severity: medium
    issue: «Божьей воле» и «угнетённом»
    rationale: γνώμη — мысль, намерение, замысел, тогда как «воля» сужает лексику; θλιβόμενος — страждущий/терпящий скорбь, не только испытывающий угнетение.
  - severity: low
    issue: Пояснение к евхаристии допускает «общую трапезу благодарения»
    rationale: Такое уточнение не нужно для перевода и может создать историко-литургическую альтернативу, которой автор здесь не формулирует. Достаточно объяснить буквальное значение слова.
  revised_text: 'Пусть никто не обольщается. Даже небесные существа, слава ангелов и власти — видимые и невидимые, — если не веруют в кровь Христа [Который есть Бог],[a] также подлежат суду. Кто может вместить, пусть вместит.[b] Пусть никого не надмевает его положение, ибо вера и любовь — всё, и ничто не стоит выше их.


    Но обратите внимание на тех, кто держится чуждого учения о благодати Иисуса Христа, пришедшей к нам: насколько они противны Божьему замыслу! Они не заботятся ни о любви, ни о вдове, ни о сироте, ни о страждущем, ни об узнике, ни о голодном, ни о жаждущем. Они сторонятся евхаристии[c] и молитвы, потому что не признают, что евхаристия есть плоть нашего Спасителя Иисуса Христа — та плоть, которая пострадала за наши грехи и которую Отец по Своей благости воскресил.'
  revised_footnotes:
  - marker: a
    text: Слова «Который есть Бог» в предоставленном английском свидетельстве заключены в квадратные скобки. Скобки сохранены как указание на текстологически неуверенное чтение или редакционное восстановление; необходима непосредственная сверка с греческой рукописной традицией.
    reason: Сохранён явный текстологический сигнал английского свидетельства без утверждения спорного чтения как бесспорного.
  - marker: b
    text: 'Буквально: «Кто вмещает, пусть вмещает». Краткая формула может означать: кто способен вместить сказанное, пусть вместит.'
    reason: Передана сжатость и возможная многозначность греческого изречения без неоправданного уточнения «принять».
  - marker: c
    text: «Евхаристия» — греческое слово со значением «благодарение».
    reason: Сохранена глосса «thanksgiving» из английского свидетельства в краткой естественной форме.
  revision_rationale: 'Исправления возвращают ключевые лексические различия исходного греческого текста: «вместить» для χωρεῖν, «положение» для τόπος, «Божий замысел» для γνώμη и «страждущий» для θλιβόμενος. Скобочная христологическая вставка сохранена без догматического развёртывания. Перевод остаётся современным литературным русским и не добавляет конфессиональных выводов.'
