base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: ru
  text: 'Пусть никто не обманывается. Даже небесные существа, слава ангелов и начальства, видимые и невидимые, — если они не веруют в кровь Христа, [Который есть Бог],[a] — также подлежат суду. Кто способен принять, пусть примет.[b] Пусть никто не превозносится своим служением, ведь вера и любовь — всё, и нет ничего выше их.


    Но обратите внимание на тех, кто держится чуждого учения о пришедшей к нам благодати Иисуса Христа: как противны они Божьей воле! Они не заботятся ни о любви, ни о вдове, ни о сироте, ни об угнетённом, ни об узнике, ни о голодном, ни о жаждущем. Они воздерживаются от евхаристии[c] и молитвы, потому что не признают, что евхаристия есть плоть нашего Спасителя Иисуса Христа — та плоть, которая пострадала за наши грехи и которую Отец по Своей благости воскресил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Который есть Бог» в предоставленном английском свидетельстве заключены в квадратные скобки, что указывает на текстологическую неуверенность или редакционное восстановление. Требуется непосредственная сверка с греческой рукописной традицией.
    reason: Сохранить явный текстологический сигнал источника.
  - marker: b
    text: 'Буквально по предоставленному свидетельству: «Кто принимает, пусть принимает». Точный смысл выражения следует проверить по греческому тексту.'
    reason: Отметить неоднозначность трудного краткого изречения.
  - marker: c
    text: «Евхаристия» — от греческого слова со значением «благодарение». Здесь этим словом названо христианское священнодействие или общая трапеза благодарения.
    reason: Передать сохранённую в английском свидетельстве глоссу «thanksgiving» естественным для русского издания способом.
lexical_decisions:
- source_word: office
  choice: служением
  rationale: Передаёт церковное положение или служебную роль без современного бюрократического оттенка слова «должность»; исходный греческий текст для проверки не предоставлен.
- source_word: mind of God
  choice: Божьей воле
  rationale: В данном нравственно-богословском контексте естественно выражает несогласие с Божьим замыслом и расположением, не сводя выражение к интеллектуальному «мнению».
- source_word: afflicted
  choice: угнетённом
  rationale: Сохраняет широкий смысл человека, терпящего бедствие или притеснение; возможны «страждущий» и «несчастный» после сверки с греческим.
- source_word: eucharist (thanksgiving)
  choice: евхаристии
  rationale: Сохраняет раннехристианский термин; его буквальное значение пояснено в сноске, а не тяжеловесной скобочной глоссой в тексте.
- source_word: raised up
  choice: воскресил
  rationale: В контексте плоти Иисуса речь идёт о воскресении; русский глагол передаёт это прямо и естественно.
theological_decisions:
- issue: Фраза «[who is God]»
  choice: 'сохранить в квадратных скобках: «[Который есть Бог]»'
  alternative: включить без скобок или опустить
  rationale: Скобки в предоставленном свидетельстве обозначают текстологическую неуверенность или восстановление; их сохранение не скрывает состояние текста.
- issue: «Евхаристия есть плоть»
  choice: перевести прямо, без конфессионального истолкования
  alternative: ослабить до «символизирует плоть» или уточнить учение о присутствии
  rationale: Авторское утверждение намеренно сохранено в его сильной форме; перевод не должен добавлять позднейшую доктринальную систему.
- issue: «He that receiveth let him receive»
  choice: «Кто способен принять, пусть примет»
  alternative: «Кто принимает, пусть принимает»
  rationale: Фраза двусмысленна и, вероятно, призывает вместить или принять сказанное; добавление «способен» делает русский оборот понятным, но отмечено как требующее сверки с греческим.
- issue: «faith and love are all in all»
  choice: «вера и любовь — всё»
  alternative: «вера и любовь имеют первостепенное значение»
  rationale: Краткая формула сохраняет риторическую абсолютность исходного свидетельства, а следующая часть уточняет превосходство этих добродетелей.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сделан яснее без устранения богословской напряжённости. Поскольку греческий текст не предоставлен и его проверка прямо обозначена как предстоящая, проект остаётся предварительным и основан на публичном английском свидетельстве Лайтфута с консультацией английского POB.
