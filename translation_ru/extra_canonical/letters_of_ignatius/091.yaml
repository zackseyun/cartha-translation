base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: ru
  text: 'Я с радостью принимаю твой образ мыслей в Боге, который ты утвердил словно на непоколебимой скале, и безмерно прославляю Бога за то, что удостоился увидеть твоё безупречное лицо,


    о котором желаю радоваться в Боге. Увещеваю тебя: благодатью, в которую ты облачён, всё дальше продвигайся по своему пути и увещевай всех, чтобы они спаслись. Со всяким усердием — и телесным, и духовным — исполняй служение, вверенное тебе[a]. Заботься о единстве: нет ничего лучше него. Неси бремя каждого, как и Господь несёт твоё. С любовью будь терпелив ко всем, как ты и поступаешь.


    Не оставляй непрестанных молитв. Проси ещё большей мудрости, чем имеешь. Бодрствуй, сохраняя дух неусыпным. С каждым говори лично, сообразуясь с Божьим нравом[b]. Неси немощи всех, как совершенный атлет. Где больше труда, там велика и награда[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отстаивай своё место». Здесь «место» может означать вверенное положение, обязанность или служение.'
    reason: Греческое τόπος сохраняет пространственную метафору и допускает несколько близких служебных значений.
  - marker: b
    text: 'Или: «с каждым говори лично, по подобию Божьему». Греческое выражение необычно и может указывать на обращение с людьми в согласии с Божьим характером.'
    reason: Сохраняет реальную лексическую и смысловую трудность κατὰ ὁμοήθειαν θεοῦ.
  - marker: c
    text: 'Буквально: «где больше труда, там велика прибыль».'
    reason: Греческое κέρδος обозначает прибыль, приобретение или выгоду; в данном наставлении это образ плода или награды за труд.
lexical_decisions:
- source_word: τὴν ἐν θεῷ γνώμην
  choice: твой образ мыслей в Боге
  rationale: Сохраняет богословски значимое «в Боге» и передаёт γνώμη как внутренний склад мысли и намерения, не сводя его только к интеллекту.
- source_word: ἐκδίκει σου τὸν τόπον
  choice: исполняй служение, вверенное тебе
  rationale: Контекст обращения к Поликарпу указывает на ответственное служение; перевод звучит естественно по-русски, а буквальная пространственная метафора отмечена в сноске.
- source_word: πάντας βάσταζε
  choice: неси бремя каждого
  rationale: Передаёт образ глагола «нести, поддерживать» и избегает ослабления до простого «терпи».
- source_word: τὰς νόσους
  choice: немощи
  rationale: Слово допускает болезни и слабости; «немощи» сохраняет более широкий смысл в пастырском контексте.
- source_word: κέρδος
  choice: награда
  rationale: В афористическом контексте речь о плоде или приобретении от труда; «награда» естественна, но буквальный образ прибыли сохранён в сноске.
theological_decisions:
- issue: Характер «места» Поликарпа (τόπος)
  choice: служение, вверенное тебе
  alternative: отстаивай своё место / оправдай свою должность
  rationale: Не уточняет сверх текста конкретную церковную структуру или титул, но ясно выражает возложенную ответственность.
- issue: Кто прославляется в выражении ὑπερδοξάζω
  choice: безмерно прославляю Бога
  alternative: безмерно славлю / чрезвычайно радуюсь
  rationale: Русский текст требует явного дополнения; контекст дара Божьего делает Бога наиболее естественным объектом, хотя греческое выражение само по себе кратко.
- issue: Увещевание всех ко спасению
  choice: увещевай всех, чтобы они спаслись
  alternative: призывай всех спастись
  rationale: Сохраняет целевую конструкцию и не решает богословский вопрос о соотношении человеческого отклика и Божьего действия.
- issue: Божий нрав в личной речи
  choice: сообразуясь с Божьим нравом
  alternative: говори с каждым по подобию Божьему
  rationale: Передаёт трудное κατὰ ὁμοήθειαν θεοῦ без сведения смысла к отдельной технике общения; необычность выражения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского пастырского послания. Сохранено обращение на «ты», соответствующее единственному числу исходного текста. Синтаксис сделан ясным для современного читателя, при этом образы скалы, облачения, пути, несения бремени, бодрствования и атлета сохранены. Абзац после слова «лицо» сохранён по предоставленному свидетельству. Формулировки сверены с доступным текстом средней греческой редакции; там, где греческая конструкция допускает разные понимания, неоднозначность обозначена сносками.
