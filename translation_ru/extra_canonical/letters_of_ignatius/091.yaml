review_pass:
  verdict: revise
  source_fidelity: Нужна правка по греческой средней редакции. В черновике неоправданно добавлен прямой объект «Бога» к ὑπερδοξάζω; страдательное ἡδρασμένην передано активным «который ты утвердил»; «Проси ещё большей мудрости» следует английскому свидетелю, но не лучшим образом передаёт πλεονάζου φρονήσει («преуспевай/возрастай в рассудительности»). Передача τόπος как «служение, вверенное тебе» слишком конкретизирует многозначное слово.
  naturalness: Текст в целом литературен и хорошо выдерживает уважительный пастырский регистр. Однако «о котором желаю радоваться в Боге» неестественно и затемняет формулу οὗ ὀναίμην ἐν θεῷ; «сообразуясь с Божьим нравом» звучит интерпретационно. Более прямые, но всё ещё осторожные формулировки естественнее.
  terminology: «Единство», «благодать», «Господь», «спаслись», «немощи» и «совершенный атлет» уместны. Для τόπος следует сохранить нейтральное «положение/место» с пояснением, не вводя определённую церковную должность. κέρδος лучше передать как «приобретение», а не как «награда», поскольку последнее привносит оттенок воздаяния.
  issues:
  - severity: medium
    issue: Добавлен объект «Бога» к «безмерно прославляю».
    rationale: Ὑπερδοξάζω в этой конструкции не требует и не называет объект; контекст допускает хвалу Богу, но явное добавление снимает исходную краткость и неоднозначность.
  - severity: medium
    issue: «Который ты утвердил» меняет залог и добавляет деятеля.
    rationale: 'Ἡδρασμένην — страдательное причастие: образ мыслей «утверждён/укреплён», без указания, кем он утверждён.'
  - severity: medium
    issue: «Проси ещё большей мудрости» неточно для πλεονάζου φρονήσει.
    rationale: Глагол πλεονάζω призывает изобиловать, возрастать или преуспевать в рассудительности; просьба как действие в греческом тексте не выражена.
  - severity: medium
    issue: «Исполняй служение, вверенное тебе» чрезмерно истолковывает τόπος.
    rationale: Τόπος буквально «место», в контексте может обозначать положение, сферу ответственности или служение; не следует выбирать церковно-административное значение без оговорки.
  - severity: low
    issue: «Награда» для κέρδος сужает образ.
    rationale: Κέρδος означает выгоду, прибыль, приобретение; «награда» способна вызвать невыраженную идею воздаяния.
  revised_text: 'Я с радостью принимаю твой образ мыслей в Боге, утверждённый словно на неподвижной скале, и безмерно радуюсь тому, что удостоился увидеть твоё непорочное лицо,


    которым да будет мне дано радоваться в Боге. Умоляю тебя: в благодати, в которую ты облечён, устремляйся вперёд на своём поприще и побуждай всех, чтобы они спаслись. Со всяким усердием — и телесным, и духовным — отстаивай своё положение[a]. Заботься о единстве: нет ничего лучше его. Неси всех, как и Господь несёт тебя. С любовью неси немощи всех, как ты и делаешь.


    Посвящай себя непрестанным молитвам. Возрастай в рассудительности. Бодрствуй, как Божий атлет. С каждым говори особо, по Божьему подобию[b]. Неси немощи всех, как совершенный атлет. Где больше труда, там велико приобретение[c].'
