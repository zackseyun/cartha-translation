  revision_rationale: Исправлены добавленный объект при ὑπερδοξάζω, залог при ἡδρασμένην, передача πλεονάζου φρονήσει и чрезмерное уточнение τόπος. Формула οὗ ὀναίμην ἐν θεῷ сохранена в осторожной русской форме; трудное κατὰ ὁμοήθειαν θεοῦ снабжено сноской. Сохраняется абзацное членение свидетеля. Вторая фраза о несении немощей в исходной последовательности передана буквально, хотя она тематически повторяет предыдущее наставление.
