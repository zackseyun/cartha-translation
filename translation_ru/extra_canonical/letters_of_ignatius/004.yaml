base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: ru
  text: 'Я не повелеваю вам, будто я что-то собой представляю. Ведь хотя я и в узах ради Имени[a], я ещё не достиг совершенства в Иисусе Христе. Я только начинаю быть учеником и говорю с вами как с товарищами по учению. Ведь мне самому надлежало бы у вас готовиться к состязанию — в вере, вразумлении, стойкости и долготерпении.


    Но поскольку любовь не позволяет мне молчать о вас, я поспешил призвать вас бежать в согласии с замыслом Божьим[b]. Ведь Иисус Христос, наша нераздельная жизнь[c], есть замысел Отца; так и епископы, поставленные до самых пределов земли, пребывают в замысле Иисуса Христа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Имя» — раннехристианское краткое обозначение имени Бога или Иисуса Христа; в тексте оно не уточняется.
    reason: Сохраняет намеренную краткость источника и поясняет непривычное абсолютное употребление.
  - marker: b
    text: Греческое слово может означать «мысль», «намерение», «решение» или «волю». Здесь и далее оно последовательно передано словом «замысел».
    reason: Отмечает лексическую неоднозначность ключевого повторяющегося термина.
  - marker: c
    text: 'Буквально также возможно: «наша неотделимая жизнь»; выражение может подчёркивать, что Христос неотделим от жизни верующих.'
    reason: Фиксирует необычность и возможный смысл греческой формулы, не разрешая образ однозначно в основном тексте.
lexical_decisions:
- source_word: ὡς ὤν τις
  choice: будто я что-то собой представляю
  rationale: Передаёт самоумаление автора естественным современным русским языком, не добавляя идеи общественного положения.
- source_word: ἐν τῷ ὀνόματι
  choice: ради Имени
  rationale: Сохраняет краткую раннехристианскую формулу и её намеренную недосказанность; прописная буква указывает на титульное употребление.
- source_word: ἀπήρτισμαι
  choice: достиг совершенства
  rationale: Передаёт смысл завершённости и духовной сформированности, не утверждая особой доктрины о безгрешности.
- source_word: συνδιδασκαλίταις
  choice: товарищами по учению
  rationale: Редкое слово обозначает тех, кто вместе проходит обучение; формулировка сохраняет ученическую метафору и звучит естественнее буквального неологизма.
- source_word: ἀλειφθῆναι
  choice: готовиться к состязанию
  rationale: Глагол буквально связан с натиранием маслом и подготовкой атлета; перевод раскрывает предполагаемый образ состязания без неясной буквальности.
- source_word: νουθεσίᾳ, ὑπομονῇ, μακροθυμίᾳ
  choice: вразумлении, стойкости и долготерпении
  rationale: Различает наставляющее исправление, способность выдерживать испытания и длительное терпение по отношению к трудностям или людям.
- source_word: συντρέχητε
  choice: бежать в согласии
  rationale: Сохраняет образ совместного бега и одновременно передаёт единство направления.
- source_word: γνώμη
  choice: замысел
  rationale: Греческое слово может означать мысль, намерение, решение или волю; «замысел» сохраняет интеллектуально-волевой оттенок и позволяет повторить ключевой термин.
- source_word: τὸ ἀδιάκριτον ἡμῶν ζῆν
  choice: наша нераздельная жизнь
  rationale: Сохраняет необычный образ Христа как жизни общины, которую нельзя отделить от неё, не сглаживая выражение до более привычного титула.
- source_word: κατὰ τὰ πέρατα ὁρισθέντες
  choice: поставленные до самых пределов земли
  rationale: Передаёт широкое географическое распространение и факт назначения, не преувеличивая его до строгой универсальности.
theological_decisions:
- issue: К кому относится формула «Имя»
  choice: Сохранено «Имя» без вставки имени Иисуса или Бога
  alternative: «ради имени Иисуса Христа»
  rationale: Источник использует абсолютную формулу и не называет референта прямо; развёртывание сняло бы подлинную недосказанность.
- issue: Значение γνώμη в высказываниях об Отце, Христе и епископах
  choice: Во всех случаях последовательно переведено как «замысел»
  alternative: «воля», «мысль» или разные слова по контексту
  rationale: Повтор одного слова сохраняет риторическую и богословскую связь трёх утверждений, а «замысел» не сводит значение только к интеллекту или только к повелению.
- issue: Христос как «нераздельная жизнь»
  choice: Сохранена предикативная формула без поясняющей догматизации
  alternative: «источник нашей неотделимой от Него жизни»
  rationale: Источник выражается сжато и необычно; пояснение навязало бы конкретное толкование отношения Христа и жизни общины.
- issue: Епископы «в замысле Иисуса Христа»
  choice: Сохранена формула пребывания в замысле
  alternative: «действуют по воле Иисуса Христа»
  rationale: Более конкретная формулировка превращала бы утверждение о согласованности и принадлежности в недвусмысленное заявление о каждом действии.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис умеренно торжественный, но без архаизмов; сохранены атлетический образ, повтор ключевого слова «замысел» и напряжение между авторским самоумалением и наставлением общины. Поскольку в пакете указано, что прямая сверка с греческим источником ожидается, решения ориентированы на засвидетельствованный греческий текст средней редакции, но особенно редкие формы и пунктуацию следует подтвердить при финальной критической сверке.
