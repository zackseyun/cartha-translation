review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка: в русском тексте утрачен сохранённый в английском свидетельстве и отмеченный как текстологический сигнал вставной союз «[For]». Кроме того, «у вас готовиться» несколько ослабляет пассивное ὑφ᾽ ὑμῶν ἀλείφεσθαι («получать подготовку от вас»). В остальном переданы самоумаление автора, узничество «ради Имени», атлетический образ и намеренно необычные формулы о Христе и епископах.'
  naturalness: Текст в целом литературный. «Обращаюсь к вам как к моим соученикам» естественнее и точнее, чем «говорю с вами как с товарищами по учению». «Бежать вместе, в согласии с замыслом Бога» яснее раскрывает совместный оттенок συντρέχητε, не утрачивая образ бега.
  terminology: «Имя», «замысел», «нераздельная жизнь», «епископы» сохранены последовательно. «Замысел» остаётся допустимым широким соответствием γνώμη и позволяет удержать повтор; необычное «пребывают в замысле» не следует заменять доктринально более определённым выражением.
  issues:
  - severity: medium
    issue: Пропущен текстологически отмеченный союз «[Ибо]».
    rationale: Английская основа сохраняет [For] именно как сигнал восстановленного/сомнительного чтения, а примечания к английскому POB требуют не утрачивать скобки. Русский текст должен сохранить этот маркер.
  - severity: low
