  yaml_path: translation/extra_canonical/2_esdras/006/050.yaml
  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: ru
  text: Второго Ты назвал Левиафаном. Ты отделил их друг от друга, потому что седьмая часть, где собралась вода, не могла вместить их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: Второго Ты назвал Левиафаном
  rationale: Естественно передаёт латинскую конструкцию с nomen и сохраняет прямое именование второго существа без добавления отсутствующих в тексте сведений.
- source_word: separasti ea ab alterutro
  choice: Ты отделил их друг от друга
  rationale: Передаёт взаимное пространственное разделение двух ранее названных существ; местоимение ea сохранено как «их».
- source_word: septima pars ubi erat aqua congregata
  choice: седьмая часть, где собралась вода
  rationale: Близко следует латинскому тексту и сохраняет его космологическую формулировку без разъясняющих добавлений.
- source_word: capere
  choice: вместить
  rationale: В данном пространственном контексте означает содержать в своих пределах, вмещать.
theological_decisions:
- issue: Уточнение числа существ в заключительном местоимении
  choice: их
  alternative: их обоих
  rationale: Латинское ea указывает на множественное число, но не содержит отдельного слова «оба»; перевод сохраняет это без усиления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавная буква в «Ты» обозначает обращение к Богу. Синтаксис сделан естественным для русского, при этом сохранены последовательность утверждений и неоднозначность латинского местоимения.
