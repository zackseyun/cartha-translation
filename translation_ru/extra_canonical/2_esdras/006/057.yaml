source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc, Domine, ecce istae gentes quae in nihilum deputatae sunt dominari nostri et devorarenos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: ru
  text: А теперь, Господи, вот, эти народы, которые были сочтены за ничто, господствуют над нами и пожирают нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу латинского слова и библейскую торжественность без архаизации.
- source_word: in nihilum deputatae sunt
  choice: были сочтены за ничто
  rationale: Передаёт оценочный смысл deputare и образное «за ничто», не заменяя его более отвлечённым выражением.
- source_word: dominari nostri
  choice: господствуют над нами
  rationale: Латинский текст, вероятно, отражает нестандартное управление или текстовую шероховатость; по контексту естественно передаётся как владычество народов над говорящими.
- source_word: devorarenos
  choice: пожирают нас
  rationale: Нормализованное devorare nos передано сильной метафорой «пожирают нас», сохранённой без ослабления до «уничтожают».
theological_decisions:
- issue: Контраст между прежней ничтожностью народов и их нынешним господством
  choice: 'Сохранён прямой контраст: «были сочтены за ничто — господствуют над нами».'
  alternative: «ничего не значили — теперь властвуют над нами»
  rationale: Формулировка не устраняет напряжение жалобы, обращённой к Богу, и не добавляет объяснения причин происходящего.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис близок к источнику, но естественен по-русски; метафора «пожирают» сохранена.
