source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et factum est cum loqueretur mihi, et ecce paulatim mouebatur locus super quem stabam super eum. Et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/029.yaml
  text: 'And it happened[a], while he was speaking to me, behold, the place on which I was standing was gradually moving. And he said to me:'
translation:
  language: ru
  text: 'И случилось так: когда он говорил со мной, вот, место, на котором я стоял, стало понемногу двигаться[a]. И он сказал мне:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понемногу сотрясалось».'
    reason: Латинское mouebatur может обозначать как движение вообще, так и сотрясение; основной текст сохраняет более нейтральное значение.
lexical_decisions:
- source_word: Et factum est
  choice: И случилось так
  rationale: Передаёт латинскую повествовательную формулу естественным современным русским языком, сохраняя её функцию перехода к событию.
- source_word: cum loqueretur mihi
  choice: пока он говорил со мной
  rationale: Латинское cum с конъюнктивом здесь выражает одновременность; «пока» звучит естественно и не добавляет причинного значения.
- source_word: ecce
  choice: опущено как отдельное слово
  rationale: Его указательно-эмфатическая функция передана живым построением всей фразы; буквальное «вот» в данном окружении утяжеляло бы современный русский текст.
- source_word: paulatim mouebatur
  choice: понемногу приходило в движение
  rationale: Сохраняет постепенность paulatim и нейтральное значение mouebatur, не уточняя без достаточных оснований, было ли это перемещением или сотрясением.
- source_word: locus super quem stabam super eum
  choice: место, на котором я стоял
  rationale: Передаёт ясный смысл латинской фразы; повторное super eum рассматривается как избыточное возобновление относительной конструкции и не дублируется по-русски.
- source_word: Et dixit ad me
  choice: И он сказал мне
  rationale: Клауза сохранена в этом стихе согласно предоставленному исходному сегменту, несмотря на возможное иное деление стихов в современных изданиях.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Двоеточие после «так» и в конце стиха сохраняет последовательность повествования и вводит следующую прямую речь.
