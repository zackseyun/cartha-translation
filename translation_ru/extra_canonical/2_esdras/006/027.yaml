base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/027.yaml
  text: For evil will be blotted out[a], and deceit will be extinguished.
translation:
  language: ru
  text: Ибо зло будет изглажено, и обман угаснет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: delebitur
  choice: будет изглажено
  rationale: Передаёт будущее страдательное значение латинского глагола и сохраняет образ полного стирания или устранения.
- source_word: malum
  choice: зло
  rationale: Нейтральный и естественный эквивалент, сохраняющий обобщённый смысл латинского существительного.
- source_word: extinguetur
  choice: угаснет
  rationale: Сохраняет образ угасания, выраженный латинским глаголом, и звучит естественно по-русски применительно к обману.
- source_word: dolus
  choice: обман
  rationale: Передаёт значение намеренной лжи или коварного введения в заблуждение без неоправданного сужения до одной конкретной формы коварства.
theological_decisions:
- issue: Характер устранения зла и обмана
  choice: 'Сохранены два разных образа: зло изглаживается, обман угасает.'
  alternative: Передать оба глагола общим словом «будет уничтожено».
  rationale: Латинский текст использует разные глаголы и тем самым создаёт образное параллельное высказывание; унификация ослабила бы его выразительность и не требуется для ясности.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка сохраняет параллелизм и причинный союз «ибо». Предыдущее чтение о процветании верности и преодолении тления не включено, поскольку относится к последующему латинскому материалу, отсутствующему в представленном тексте стиха.
