  source_fidelity: 'Точно переданы все элементы латинского текста: enim — «ибо», malum — «зло», delebitur в будущем страдательном значении — «будет изглажено», dolus — «обман», extinguetur — «угаснет». Русское непереходное будущее «угаснет» естественно передаёт латинский образ угасания, не добавляя материала из следующей фразы.'
  naturalness: Фраза краткая, ясная и благозвучная для современного литературного русского языка. «Ибо» и «изглажено» придают уместный возвышенный библейский регистр, не делая текст непонятным. Параллелизм двух частей сохранён.
