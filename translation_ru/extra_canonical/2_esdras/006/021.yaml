  yaml_path: translation/extra_canonical/2_esdras/006/021.yaml
  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: ru
  text: И годовалые младенцы заговорят своими голосами, а беременные будут рожать недоношенных младенцев на третьем и четвёртом месяце беременности[a], и те будут жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «младенцев трёх и четырёх месяцев»; то есть рождённых на третьем или четвёртом месяце беременности.'
    reason: Латинская конструкция необычна; примечание поясняет, что месяцы относятся к сроку беременности, не устраняя намеренно необычный образ.
lexical_decisions:
- source_word: anniculi infantes
  choice: годовалые младенцы
  rationale: Передаёт возрастное значение anniculi и сохраняет повтор существительного infantes в обеих частях стиха.
- source_word: loquentur uocibus suis
  choice: заговорят своими голосами
  rationale: Близко следует латинскому тексту; необычное выражение сохранено, а не истолковано дополнительно.
- source_word: praegnantes
  choice: беременные
  rationale: Субстантивированное прилагательное естественно передаётся по-русски без добавления слова «женщины».
- source_word: immaturos ... infantes trium et quatuor mensium
  choice: недоношенных младенцев на третьем и четвёртом месяце
  rationale: Immaturos означает преждевременно рождённых, а родительный trium et quatuor mensium указывает срок развития; русский оборот делает эту связь естественной.
- source_word: et uiuent
  choice: и те будут жить
  rationale: Указательное «те» ясно относит сказуемое к недоношенным младенцам, не добавляя отсутствующего в источнике смысла.
theological_decisions:
- issue: Необычайное выживание крайне недоношенных младенцев как эсхатологическое знамение
  choice: сохранить прямое утверждение «и те будут жить»
  alternative: смягчить или рационализировать описание
  rationale: Латинский текст недвусмысленно утверждает uiuent; перевод не должен устранять напряжённость образа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого контекста. Синтаксис сделан естественным, но необычные детали исходного текста не сглажены.
