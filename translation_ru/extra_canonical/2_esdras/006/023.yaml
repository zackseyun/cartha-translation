lexical_decisions:
- source_word: tuba
  choice: труба
  rationale: Прямое и естественное соответствие латинскому слову; сохраняет эсхатологический образ без добавочного истолкования.
- source_word: canet cum sono
  choice: протрубит
  rationale: Русский глагол естественно передаёт звучание трубы; отдельное «со звуком» было бы избыточным.
- source_word: subito expavescent
  choice: внезапно ужаснутся
  rationale: Сохраняет как внезапность, так и сильную степень страха, выраженную expavescent.
