source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: ru
  text: И внезапно засеянные места окажутся незасеянными, а полные кладовые вдруг обнаружатся пустыми. И зазвучит труба; когда все услышат её, то внезапно ужаснутся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca non seminata
  choice: засеянные места окажутся незасеянными
  rationale: Сохранён намеренный парадокс латинского текста без попытки его истолковать или сгладить.
- source_word: plena prumptuaria ... uacua
  choice: полные кладовые ... обнаружатся пустыми
  rationale: «Кладовые» естественно передаёт promptuaria; конструкция сохраняет контраст между наполненностью и внезапной пустотой.
- source_word: tuba canet cum sono
  choice: зазвучит труба
  rationale: Естественная русская передача звука трубы без избыточного буквального выражения «зазвучит со звуком».
- source_word: expauescent
  choice: ужаснутся
  rationale: Передаёт сильный внезапный страх, выраженный латинским глаголом.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим ритмом. Три употребления subito переданы словами «внезапно», «вдруг» и «внезапно». Начальное «et sciritabuntur» не включено: по положению перед началом самостоятельного предложения стиха и по сопоставлению с текстовой традицией это повреждённый либо ошибочно присоединённый остаток предшествующего стиха.'
