  source_fidelity: 'Основной текст точно передаёт латинские образы и их порядок: засеянные места предстают незасеянными, полные кладовые оказываются пустыми, затем звучит труба и все, услышав её, внезапно испытывают ужас. Парадокс seminata loca non seminata сохранён без интерпретационного сглаживания. Начальное «et sciritabuntur» не имеет ясного лексического смысла в приведённой очищенной латинской строке и, как отмечено в примечании к переводу, обоснованно рассматривается как повреждённый или ошибочно присоединённый остаток; английский контрольный текст его также не переводит.'
