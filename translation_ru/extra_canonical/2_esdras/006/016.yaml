  text: Поскольку речь идёт о них[a], они затрепещут и содрогнутся, ведь знают, что их конец должен измениться».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «Ибо поскольку речь идёт о них, они затрепещут и содрогнутся…»'
    reason: Сохраняет засвидетельствованный прежний вариант связи этого предложения с предшествующим контекстом.
lexical_decisions:
- source_word: sermo de his est
  choice: речь идёт о них
  rationale: Естественная современная передача латинского оборота со значением «речь касается их»; местоименная отсылка сохранена без уточнения.
- source_word: commovebuntur et concutientur
  choice: они затрепещут и содрогнутся
  rationale: Передаёт два близких глагола сильного движения и потрясения, сохраняя их риторическое удвоение.
- source_word: scit enim
  choice: ведь знают
  rationale: По смыслу подлежащее соотнесено с множественным «они», как в контексте и консультационном английском тексте; форма scit в данном свидетельстве может отражать текстовую неровность.
- source_word: finem eorum oportet commutari
  choice: их конец должен измениться
  rationale: Формально сохраняет неоднозначную мысль об изменении их конца, не уточняя, идёт ли речь об участи, завершении или сроке.
theological_decisions:
- issue: Значение выражения «их конец должен измениться»
  choice: Сохранена буквальная и богословски напряжённая формулировка без истолкования.
  alternative: «их участь должна перемениться»
  rationale: Латинское finis может обозначать конец, предел или исход; выбор «конец» лучше сохраняет исходную многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Кавычка в конце сохранена, поскольку стих завершает прямую речь, начатую ранее.
