source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: ru
  text: Ибо голос твой воистину был услышан у Всевышнего, ибо Сильный увидел твой образ жизни и обратил внимание на чистоту, которую ты хранил с юности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est vox tua
  choice: голос твой был услышан
  rationale: Латинская усилительная конструкция с однокоренными словами передана естественной русской формой; «был услышан» сохраняет смысл принятого Богом обращения.
- source_word: apud Altissimum
  choice: пред Всевышним
  rationale: «Пред» естественно передаёт apud в контексте услышанной Богом молитвы и сохраняет возвышенный библейский регистр.
- source_word: Fortis
  choice: Сильный
  rationale: Субстантивированное именование Бога передано буквально и с прописной буквы, без замены более привычным, но менее точным титулом.
- source_word: directionem tuam
  choice: как ты жил
  rationale: В данном контексте directionem обозначает жизненное поведение или образ жизни; глагольная формулировка звучит по-русски естественнее, чем абстрактное «поведение» или двусмысленное «направление».
- source_word: providit pudicitiam
  choice: обратил внимание на чистоту
  rationale: providit здесь передаёт внимательное распознавание или принятие к сведению; pudicitiam сохранено широким словом «чистота», не сужающим смысл исключительно до целомудрия.
- source_word: a iuventute tua habuisti
  choice: которую ты хранил с юности
  rationale: Русское «хранил» идиоматично выражает длительное обладание нравственной чистотой от юности.
theological_decisions:
- issue: Значение pudicitiam
  choice: чистоту
  alternative: целомудрие
  rationale: «Чистота» сохраняет возможную широту нравственного смысла и не навязывает исключительно сексуально-нравственное прочтение.
- issue: Божественный титул Fortis
  choice: Сильный
  alternative: Всемогущий
  rationale: «Сильный» точнее соответствует латинскому Fortis; «Всемогущий» добавлял бы отсутствующее в исходном слове значение абсолютного могущества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «голос твой» и предлог «пред» поддерживают достоинство стиля, не делая текст архаичным.
