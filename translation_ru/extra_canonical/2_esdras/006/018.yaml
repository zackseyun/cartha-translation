  source_fidelity: 'Перевод точно передаёт сохранившийся латинский текст: «наступают дни» соответствует формуле ecce dies veniunt, «Я начну приближаться» — восстановимому [appro]pinquare incipio, а «посетить живущих на земле» — ut uisitem habitantes in terra. Целевая конструкция с конечной запятой корректно сохраняет незавершённость предложения в данном стиховом отрывке.'
  naturalness: 'Текст звучит естественно для современного литературного русского с умеренно библейским регистром. Формула «и будет так: когда…» несколько книжна, но уместна и хорошо передаёт латинское et quando в составе продолжающейся речи.'
  terminology: «Посетить» удачно сохраняет намеренную широту uisitem и не сужает её преждевременно до суда. «Живущих на земле» нейтрально и точно. Прописное «Я» соответствует принятому библейскому оформлению прямой речи Бога и не добавляет нового смыслового утверждения.
