  yaml_path: translation/extra_canonical/2_esdras/006/018.yaml
  text: And it said, “Behold, days are coming, and it will be that when I begin to draw near to visit those who dwell on the earth,
translation:
  language: ru
  text: 'И он сказал: «Вот, наступают дни, и будет так: когда Я начну приближаться, чтобы посетить живущих на земле,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[appro]pinquare incipio'
  choice: Я начну приближаться
  rationale: Начало слова утрачено на границе предоставленного фрагмента, но форма уверенно восстанавливается как appropinquare; перевод сохраняет образ приближения и первое лицо.
- source_word: uisitem
  choice: посетить
  rationale: Латинское visitare может обозначать как посещение, так и властное вмешательство или суд. «Посетить» сохраняет эту смысловую открытость.
- source_word: habitantes in terra
  choice: живущих на земле
  rationale: Прямой и естественный перевод, не уточняющий без основания, имеется ли в виду земля как мир или суша.
theological_decisions:
- issue: Характер предстоящего посещения
  choice: посетить
  alternative: подвергнуть суду
  rationale: Контекст может подразумевать суд, однако латинское uisitem само по себе сохраняет более широкое значение; явное уточнение сделало бы перевод конфессионально и толковательно перегруженным.
- issue: Обозначение говорящего местоимением первого лица
  choice: Я
  alternative: я
  rationale: Прописная буква уместна в русском библейском регистре, поскольку говорящий в данном контексте — Бог; она не меняет грамматического смысла исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «и будет так» передаёт et erit и облегчает последующее придаточное. Незавершённость стиха сохранена конечной запятой, поскольку исходный фрагмент и английский консультационный слой продолжают предложение.
