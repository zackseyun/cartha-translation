translation:
  language: ru
  text: и начну спрашивать с тех, кто несправедливо причинили вред своей неправедностью[a], и
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и начну требовать ответа от тех, кто несправедливо причинили вред своей неправедностью, и».'
    reason: Латинское inquirere ab eis может обозначать как расспрашивание или расследование, так и требование ответа с виновных.
lexical_decisions:
- source_word: inquirere incipiam ab eis
  choice: начну спрашивать с тех
  rationale: Передаёт начало действия и направленность к виновным; русское «спрашивать с кого-либо» естественно выражает требование ответа, сохраняя судебный оттенок контекста.
- source_word: qui iniuste nocuerunt
  choice: кто несправедливо причинял вред
  rationale: Сохраняет наречие iniuste и значение nocuerunt, не добавляя отсутствующий в латинском тексте объект вреда.
- source_word: iniustitia sua
  choice: своей неправедностью
  rationale: Отражает повтор корня iniust- и инструментальный смысл аблатива; «неправедность» соответствует возвышенному библейскому регистру.
theological_decisions:
- issue: Судебный или вопросительный смысл inquirere ab eis
  choice: спрашивать с тех
  alternative: расспрашивать тех / требовать отчёта от тех
  rationale: Латинское выражение допускает оттенок расследования или взыскания ответа. Выбранная формулировка естественна по-русски и не сводит смысл исключительно ни к допросу, ни к окончательному суду.
- issue: Неуказанный объект причинённого вреда
  choice: не добавлять «другим»
  alternative: причинял вред другим
  rationale: В предоставленном латинском тексте объект при nocuerunt не назван; его добавление устранило бы присущую источнику недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор понятий несправедливости и обрыв на союзе «и», поскольку стих в латинском источнике продолжается в следующем стихе.
