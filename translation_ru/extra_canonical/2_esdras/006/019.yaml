  source_fidelity: Латинское inquirere incipiam ab eis передаёт начало обращения к виновным с расследованием/взысканием ответа; «спрашивать с тех» в целом возможно, но оборот лучше оформить как «спрашивать с тех, кто…». Perfectum nocuerunt следует передать совершенным видом «причинили вред», а не несовершенным «причинял вред». Неуказанный объект вреда в основном тексте верно не добавляется. Повтор iniuste / iniustitia sua сохранён как намеренная тавтология источника.
