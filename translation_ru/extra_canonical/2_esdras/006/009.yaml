source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: finis enim huius saeculi Esau, et principium sequentis Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: ru
  text: Ведь конец этого века — Исав, а начало следующего — Иаков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: века
  rationale: Латинское saeculum здесь обозначает нынешний век или мировой период; «век» естественно сохраняет эсхатологический смысл и связь с последующим веком.
- source_word: finis
  choice: конец
  rationale: Прямое соответствие латинскому слову и риторической паре finis / principium.
- source_word: principium
  choice: начало
  rationale: Прямое соответствие источнику, сохраняющее противопоставление «конец — начало».
- source_word: sequentis
  choice: следующего
  rationale: Субстантивированное прилагательное относится к следующему веку, понятному из первой части; русский язык позволяет не повторять слово «век».
- source_word: Esau / Iacob
  choice: Исав / Иаков
  rationale: Традиционные и общепонятные русские формы библейских имён.
theological_decisions:
- issue: Отождествление Исава и Иакова с границей двух веков
  choice: 'Сохранена именная конструкция: «конец этого века — Исав, а начало следующего — Иаков»'
  alternative: «Исав означает конец этого века, а Иаков — начало следующего»
  rationale: Источник прямо использует связку, не вводя глагола «означает»; буквальная метафорическая идентификация сохраняет богословскую напряжённость и не навязывает толкования.
- issue: Порядок членов предложения
  choice: Сохранена латинская тематизация «конец… Исав; начало… Иаков»
  alternative: «Исав — конец этого века, а Иаков — начало следующего»
  rationale: Так точнее воспроизводится синтаксис finis… Esau et principium… Iacob и перекличка с вопросом о конце и начале в ближайшем контексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным библейским ритмом. Тире естественно передаёт опущенную латинскую связку. Слово «ведь» передаёт пояснительное enim.
