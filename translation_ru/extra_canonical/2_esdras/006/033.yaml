theological_decisions:
- issue: Неуказанный субъект misit
  choice: Он послал меня
  alternative: он послал меня
  rationale: Латинский текст не называет субъекта в этом стихе; местоимение сохранено без добавления имени. Прописная буква отражает божественного референта, устанавливаемого контекстом, но не расширяет содержание стиха.
