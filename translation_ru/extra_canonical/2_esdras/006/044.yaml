    issue: «Бесчисленное множество плодов» для fructus multitudinis inmensus
    rationale: Выражение передаёт изобилие, но inmensus прежде всего означает «безмерный/неизмеримый», а не именно неисчислимый.
  - severity: medium
    issue: «Ароматы непостижимого благоухания» для odores odoramentis inuestigabiles
    rationale: Однокоренной повтор в латинском тексте не требует столь же неестественной конструкции в русском; текущая фраза воспринимается как «запахи благоухания» и затрудняет смысл.
  - severity: low
    issue: Сноска «желание вкусить всё это многообразие»
    rationale: 'Это толкование добавляет «всё это» и глагольный оттенок, которых в выражении нет. Более точное буквальное альтернативное прочтение: «желание разнообразных вкусов».'
