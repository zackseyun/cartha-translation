source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuum processit, et opus statim fiebat. Processit enim subito fructus multitudinis inmensus et concupiscentia gustus multiformis et flores colore inimitabiles et odores odoramentis inuestigabiles. die tertio haec facta sunt. Quarto autem die imperasti fieri solis splendorem, lunae lumen, stellarum dispositionem, Et imperasti eis ut deseruirent futuro plasmato
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/044.yaml
  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: ru
  text: Ибо тотчас появилось неизмеримое изобилие плодов, и многообразная услада для вкуса[a], и цветы неподражаемой окраски, и благоухания с непостижимыми оттенками. Всё это было сотворено в третий день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желание разнообразных вкусов».'
    reason: Латинское concupiscentia буквально может означать «желание»; однако в контексте перечня сотворённых благ оно, вероятнее всего, обозначает их приятность для вкуса.
lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: бесчисленное множество плодов
  rationale: Передаёт как предметное значение fructus, так и идею неизмеримого изобилия; по-русски звучит естественно и торжественно.
- source_word: concupiscentia gustus multiformis
  choice: многообразная услада для вкуса
  rationale: В контексте описывается привлекательность сотворённых плодов, а не возникновение субъективного вожделения. При этом буквальная неоднозначность латинского выражения сохранена в сноске.
- source_word: flores colore inimitabiles
  choice: цветы неподражаемой окраски
  rationale: Близко передаёт inimitabiles и естественно сочетается с описанием цвета цветов.
- source_word: odores odoramentis inuestigabiles
  choice: ароматы непостижимого благоухания
  rationale: Сохраняет усиленное сочетание однокоренных понятий и значение inuestigabiles — того, что невозможно вполне исследовать или постичь.
- source_word: haec facta sunt
  choice: Всё это было сотворено
  rationale: В рассказе о творении facta sunt означает не просто «произошло», а «было создано»; русский пассив сохраняет связь с Божьим творческим действием.
