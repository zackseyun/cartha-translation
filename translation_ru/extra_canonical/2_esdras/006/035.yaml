source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post haec, et flevi iterum et similiter ieiunavi septem diebus, ut suppleam tres ebdomadas quae dictae sunt mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/035.yaml
  text: And it happened after this that I wept again, and likewise I fasted seven days, so that I might complete the three weeks that had been spoken to me.
translation:
  language: ru
  text: 'После этого было так: я снова плакал и также постился семь дней, чтобы завершить три недели, о которых мне было сказано.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est post haec
  choice: И было после этого
  rationale: Сохраняет библейскую повествовательную формулу и последовательность событий, не утяжеляя русский текст буквальным «и случилось».
- source_word: flevi iterum
  choice: я снова плакал
  rationale: Прямо передаёт повторность действия и значение латинского flere.
- source_word: similiter ieiunavi septem diebus
  choice: и также постился семь дней
  rationale: Similiter передано как «также»; длительность поста выражена естественной русской конструкцией.
- source_word: ut suppleam tres ebdomadas
  choice: чтобы завершить три недели
  rationale: Suppleam здесь означает довести до полноты установленный период; «завершить» естественно и точно передаёт смысл.
- source_word: quae dictae sunt mihi
  choice: о которых мне было сказано
  rationale: Сохраняет речевое значение dictae sunt mihi и не вводит отсутствующую в источнике идею назначения срока.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к латинскому, но естественен для обычного читателя; неоднозначность относительно того, кем были высказаны слова о трёх неделях, сохранена.
