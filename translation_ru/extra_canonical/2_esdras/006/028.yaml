  source_fidelity: '«И откроется истина» точно передаёт латинское et ostendebitur ueritas: страдательное значение выражено естественной русской возвратной формой без неоправданного указания на действующее лицо. Придаточное «которая столько времени оставалась бесплодной» сохраняет образ sine fructu fuit и длительность tantis temporibus.'
  naturalness: Фраза краткая, ясная и звучит естественно в современном литературном русском с уместной библейской торжественностью. «Оставалась бесплодной» немного более образно, чем «не приносила плода», но не воспринимается как неестественное.
