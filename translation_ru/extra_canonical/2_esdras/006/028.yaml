  text: and the truth, which has been fruitless for so long, will be revealed.”
translation:
  language: ru
  text: и откроется истина, которая столько времени оставалась бесплодной».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: откроется
  rationale: Будущее страдательное значение передано естественным русским библейским выражением; здесь истина станет явной.
- source_word: ueritas
  choice: истина
  rationale: Прямое и контекстуально нейтральное соответствие латинскому существительному.
- source_word: sine fructu fuit
  choice: оставалась бесплодной
  rationale: Сохранён образ отсутствия плода, а глагол «оставалась» естественно выражает длительное состояние.
- source_word: tantis temporibus
  choice: столько времени
  rationale: Передаёт большую продолжительность периода без излишне буквального и тяжеловесного оборота.
theological_decisions:
- issue: Образ бесплодности истины
  choice: Сохранить выражение «истина… оставалась бесплодной»
  alternative: «истина… не приносила плода»
  rationale: Формулировка сохраняет напряжённый образ латинского sine fructu и не уточняет без достаточных оснований, в каком именно смысле истина не приносила плода.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Синтаксис следует латинскому тексту, но остаётся естественным по-русски.
