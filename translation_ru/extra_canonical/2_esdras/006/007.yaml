  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: ru
  text: 'Тогда я ответил: «Каково будет разделение времён? Или когда наступит конец прежнего и начало следующего?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'divisio temporum (в представленном фрагменте начало утрачено: «porum» — окончание temporum)'
  choice: как будут разделены времена
  rationale: Передаёт вопрос о границе или разделении времён естественным современным русским языком, не уточняя сверх источника, идёт ли речь об эпохах.
- source_word: prioris finis
  choice: конец прежнего
  rationale: Субстантивированное prioris обозначает прежнее время или век и образует смысловую параллель с sequentis.
- source_word: sequentis initium
  choice: начало следующего
  rationale: Сохраняет симметрию латинских prioris и sequentis и не превращает вторую эпоху в пояснительное придаточное предложение.
theological_decisions:
- issue: Что именно разделяют prioris и sequentis
  choice: 'оставить подразумеваемое существительное непрояснённым: «прежнего» и «следующего»'
  alternative: «прежнего века» и «будущего века»
  rationale: Латинский текст использует субстантивированные определения и допускает отнесение как к временам, так и к эпохам; явное добавление «века» внесло бы богословское уточнение, отсутствующее в данной формулировке.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной вопросительной формулировкой. Латинское «ответил и сказал» передано одним глаголом «ответил», поскольку удвоение в русском звучит тяжеловесно и не добавляет содержания.
