    rationale: Исходник спрашивает о самом «разделении времён», а не о способе, которым времена будут разделены. Номинальная конструкция точнее и сохраняет формулировку источника.
  - severity: low
    issue: Неточная и избыточная сноска к «следующего»
    rationale: Латинское sequentis здесь субстантивировано и симметрично prioris; «следующего» уже передаёт его без нужды в пояснении «того, что последует». Сноска создаёт ложное впечатление более буквального альтернативного чтения.
