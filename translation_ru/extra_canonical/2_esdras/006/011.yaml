translation:
  language: ru
  text: пред Твоими очами[a], чтобы Ты показал Твоему рабу конец знамений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему чтению начала фразы: «Тогда я ответил и сказал: „О Владыка Господь, если я обрёл благоволение пред Твоими очами…“»'
    reason: previous_rendering
lexical_decisions:
- source_word: ante oculos tuos
  choice: пред Твоими очами
  rationale: Сохраняет образное и торжественное выражение латинского текста; «в Твоих глазах» было бы более идиоматично, но ослабило бы буквальный образ и связь с альтернативным чтением.
- source_word: ut demonstres
  choice: чтобы Ты показал
  rationale: Передаёт целевое значение ut с конъюнктивом и обычный смысл demonstrare.
- source_word: seruo tuo
  choice: Твоему рабу
  rationale: Прямо передаёт обращение во втором лице и традиционное библейское самообозначение молящегося.
- source_word: finem signorum
  choice: конец знамений
  rationale: Сохраняет возможную смысловую напряжённость finis — завершение или конечный предел — без уточняющего толкования.
theological_decisions:
- issue: Смысл выражения «конец знамений»
  choice: Сохранено без поясняющего дополнения
  alternative: «чем завершатся знамения» или «последнее из знамений»
  rationale: Латинское finem signorum допускает более одного оттенка; перевод не должен заранее выбирать конкретную эсхатологическую трактовку.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Формы «пред» и «очами» сохранены ради регистра и образности апокалиптической молитвы; прописные буквы в местоимениях подчёркивают обращение к Богу.
