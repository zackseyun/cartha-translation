  yaml_path: translation/extra_canonical/2_esdras/006/051.yaml
  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: ru
  text: И Ты отдал Бегемоту одну часть — ту, что высохла на третий день, чтобы он обитал в ней, где тысяча гор.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dedisti
  choice: отдал
  rationale: Передаёт предоставление Бегемоту определённой части суши; по-русски звучит естественнее, чем буквальное «дал» в данном контексте.
- source_word: Behemoth
  choice: Бегемоту
  rationale: Традиционная русская передача имени мифического существа; дательный падеж соответствует латинскому Behemoth при dedisti.
- source_word: unam partem
  choice: одну часть
  rationale: Сохраняет неопределённость латинского выражения без добавления отсутствующего уточнения.
- source_word: quae siccata est tertio [die]
  choice: ту, что высохла на третий день
  rationale: Передаёт относительное придаточное и связь с повествованием о высыхании суши на третий день; слово die восстанавливается по смыслу и подтверждается консультационным английским текстом.
- source_word: ut habitet in ea
  choice: чтобы он обитал там
  rationale: Естественно передаёт цель и пребывание Бегемота в отведённой ему области.
- source_word: ubi sunt montes mille
  choice: где тысяча гор
  rationale: Сохраняет образ и порядок смысла, избегая менее естественного русского «где находятся тысяча гор».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Тире делает пояснение к «одной части» ясным, не превращая его в отдельное утверждение.
