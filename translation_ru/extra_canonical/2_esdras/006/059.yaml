review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: saeculum последовательно обозначено как «мир», propter nos — «ради нас», а nostrum сохранено в «наш мир». Однако possidemus означает «владеем/обладаем», а не «получаем»; настоящее «получаем» смещает вопрос от нынешнего отсутствия наследственного владения к процессу его получения.'
  naturalness: Фраза «почему мы не получаем наш мир в наследие?» понятна, но менее естественна и менее точна, чем «почему мы не владеем нашим миром как наследием?». «Доколе это будет продолжаться?» грамматически естественно, однако добавляет глагольное развитие, которого в кратком эллиптическом haec нет.
  terminology: «Мир» для saeculum в данном контексте приемлем и согласован с английской проверочной версией. «Ради нас», «наш мир» и «наследие» сохраняют существенные элементы исходного текста без конфессионального истолкования.
  issues:
  - severity: medium
    issue: Значение possidemus передано как «получаем».
    rationale: Латинское possidere — «владеть, обладать»; в сочетании hereditatem possidere речь идёт об обладании наследием, а не о его получении.
  - severity: low
    issue: Эллиптическое usquequo haec чрезмерно раскрыто.
    rationale: «Это будет продолжаться» уточняет, что именно происходит во времени. «Доколе всё это?» сохраняет исходную краткость и неопределённость.
  revised_text: И если мир создан ради нас, почему мы не владеем нашим миром как наследием? Доколе всё это?»
