source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: ru
  text: И если мир создан ради нас, почему мы не владеем нашим миром как наследием? Доколе всё это?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: мир
  rationale: В данном контексте латинское saeculum обозначает сотворённый мир; выбор согласуется с параллельным употреблением в стихе и не вводит более узкое значение «век».
- source_word: propter nos
  choice: ради нас
  rationale: Естественно и точно передаёт причинно-целевое значение латинского оборота.
- source_word: hereditatem possidemus
  choice: получаем … в наследие
  rationale: Передаёт образ наследственного обладания естественным современным русским выражением.
- source_word: usquequo haec
  choice: Доколе это будет продолжаться?
  rationale: Эллиптическое латинское восклицание раскрыто минимально для ясности по-русски, без уточнения того, что именно должно прекратиться.
theological_decisions:
- issue: Отношение народа говорящего к сотворённому миру
  choice: «наш мир» сохранено буквально
  alternative: Опустить притяжательное местоимение или заменить на «этот мир»
  rationale: Латинское nostrum подчёркивает заявленное право говорящих на наследие; это напряжение следует сохранить, не подтверждая и не опровергая само притязание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «Доколе». Риторические вопросы и богословское напряжение оригинала сохранены.
