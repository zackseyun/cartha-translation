source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: conuertetur in sensum alium. Delebitur enim malum et extinguetur dolus. Florebit autem fides, et uincetur corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: ru
  text: И изменится, перейдя к иному пониманию[a]. Ибо зло будет изглажено, и обман угаснет. Вера же расцветёт, и тление будет побеждено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В латинском тексте субъект глагола не назван. Выражение можно также передать: «изменится, обретя иной образ мыслей».'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Или: «порча будет побеждена». Латинское corruptela может обозначать порчу, разложение, тление или нравственную испорченность.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: conuertetur in sensum alium
  choice: обратится к иному разумению
  rationale: Сохранены страдательно-возвратная форма и неопределённый подразумеваемый субъект латинского текста; sensus передано как «разумение», поскольку здесь речь может идти как о понимании, так и об образе мыслей.
- source_word: delebitur malum
  choice: зло будет изглажено
  rationale: Передаёт образ полного удаления, заложенный в delebitur, без ослабления до общего «исчезнет».
- source_word: extinguetur dolus
  choice: обман угаснет
  rationale: Сохраняет метафору extinguetur («будет погашен, угаснет») и передаёт dolus обычным современным словом «обман».
- source_word: Florebit fides
  choice: Вера же расцветёт
  rationale: Точно сохраняет образ цветения и противопоставление autem.
- source_word: uincetur corruptela
  choice: тление будет побеждено
  rationale: Corruptela допускает значения порчи, разложения и тления; «тление» сохраняет широкую эсхатологическую окраску, а uincetur передано буквально как «будет побеждено».
theological_decisions:
- issue: Неуказанный субъект conuertetur
  choice: Не добавлять в основной текст ни «сердце», ни «люди»
  alternative: «Сердце изменится» или «люди изменятся»
  rationale: В предоставленном латинском отрывке субъект глагола не выражен. Его уточнение по иному тексту или предыдущему контексту устранило бы подлинную грамматическую неопределённость.
- issue: Значение corruptela
  choice: «тление»
  alternative: «порча» или «развращение»
  rationale: Выбор не ограничивает слово исключительно нравственной испорченностью и сохраняет возможный смысл разрушения и смертности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая неопределённость начала сохранена; финальная запятая оставлена, поскольку латинский источник продолжает фразу далее.
