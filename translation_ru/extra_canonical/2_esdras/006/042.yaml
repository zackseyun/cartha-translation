  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: ru
  text: И в третий день Ты повелел водам собраться в седьмой части земли, а шесть частей осушил и сохранил, чтобы из них пред Тобою было посеянное и возделанное, служащее Тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: в седьмой части земли
  rationale: Передаёт сосредоточение вод в одной седьмой части земли естественным русским оборотом.
- source_word: siccasti et conservasti
  choice: осушил и сохранил
  rationale: 'Сохраняет оба латинских глагола и их последовательность: суша была осушена и оставлена пригодной для дальнейшего назначения.'
- source_word: seminata adeo et culta
  choice: посеянное и возделанное
  rationale: 'Субстантивированные формы сохраняют широкий смысл латинского выражения: всё посеянное и обработанное человеком.'
- source_word: ministrantia
  choice: служа Тебе
  rationale: Причастный оборот передаёт идею служения Богу, не уточняя сверх текста, относится ли она только к произрастающему или ко всему устроенному на суше.
theological_decisions:
- issue: Отношение ministrantia к seminata et culta
  choice: «росло посеянное и возделанное, служа Тебе»
  alternative: «были пред Тобою служащие Тебе посевы и возделанные растения»
  rationale: Выбрана естественная русская конструкция, сохраняющая богословскую мысль о творении как служащем Богу и не вводящая конкретных исполнителей служения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Формулировка следует латинскому источнику и сохраняет необычное деление земли на семь частей.
