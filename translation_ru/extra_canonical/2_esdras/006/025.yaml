  text: stabunt ut non decurrant in horis tribus. Et erit omnis qui derelictus fuerit ex omnibus istis quibus praedixi tibi, ipse saluabitur et uidebit salutare meum et finem saeculi mei. Et uidebunt qui recepti sunt homines, qui mortem non gustauerunt a natiuitate sua, et mutabitur cor inhabitantium et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/025.yaml
  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: ru
  text: И всякий, кто останется после всего того, о чём Я предсказал тебе, будет спасён и увидит Моё спасение и конец Моего века.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто уцелеет среди всего того, о чём Я предсказал тебе».'
    reason: Латинское derelictus fuerit ex omnibus istis допускает представление как об оставшемся после предсказанных событий, так и об уцелевшем среди них; сноска сохраняет эту синтаксико-семантическую неопределённость.
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: уцелеет во всём том
  rationale: Передаёт смысл человека, оставшегося в живых после предсказанных бедствий, естественным современным русским языком, не превращая неясное латинское ex в чрезмерно точное пространственное указание.
- source_word: quibus praedixi tibi
  choice: что Я предсказал тебе
  rationale: Относительное quibus согласуется с подразумеваемым нейтральным множественным «всё то» и относится к предсказанным событиям.
- source_word: salvabitur
  choice: будет спасён
  rationale: Сохраняет страдательную форму и допускает как избавление от бедствий, так и более широкий богословский смысл спасения.
- source_word: salutare meum
  choice: Моё спасение
  rationale: Формально и богословски ёмко передаёт субстантивированное salutare, не сужая его до одного лишь зрелища или поступка.
- source_word: finem saeculi mei
  choice: конец Моего века
  rationale: Сохраняет необычное притяжательное mei и многозначность saeculum — «век», «эпоха», не заменяя выражение толкованием вроде «конец мира».
theological_decisions:
- issue: Характер обещанного спасения
  choice: «будет спасён»
  alternative: «будет избавлен»
  rationale: Латинское salvabitur допускает и избавление в ходе эсхатологических бедствий, и более полный смысл спасения; выбранный вариант сохраняет эту напряжённость.
- issue: Значение saeculi mei
  choice: «Моего века»
  alternative: «Моей эпохи» или «Моего мира»
  rationale: «Век» лучше сохраняет семантический диапазон латинского saeculum и не решает заранее, идёт ли речь об эпохе, мировом порядке или мире.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения «Я», «Моё», «Моего» обозначают говорящего Бога. Синтаксис сделан плавным, при этом сохранены пассивная форма обещания и необычное выражение «конец Моего века».
