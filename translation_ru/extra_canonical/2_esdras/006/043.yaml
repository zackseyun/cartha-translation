  text: For your word went forth, and the work was immediately done.
translation:
  language: ru
  text: Ибо слово Твоё вышло — и дело тотчас совершилось.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Verbum enim
  choice: Ибо слово Твоё
  rationale: «Ибо» передаёт enim, а «слово Твоё» соответствует контексту обращения к Богу; притяжательное местоимение восстанавливается по продолжению стиха, отражённому в контрольном английском тексте.
- source_word: processit / went forth
  choice: вышло
  rationale: Сохранён пространственно-деятельный образ исходящего Божьего слова без замены его более толковательным «было произнесено».
- source_word: statim opus factum est
  choice: дело тотчас совершилось
  rationale: «Тотчас» передаёт немедленность, а «совершилось» естественно и достойно выражает завершение сотворённого дела.
theological_decisions:
- issue: Действенность Божьего слова
  choice: 'Сохранена прямая связь: слово выходит — дело тотчас совершается.'
  alternative: 'Передать смысл пояснительно: «Ты повелел, и всё сразу было создано».'
  rationale: Прямая формулировка сохраняет образ и богословское напряжение исходного текста, не сводя «слово» только к приказу и не уточняя без необходимости характер «дела».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Тире подчёркивает непосредственность результата. Предоставленный латинский фрагмент обрывается на «Verbum enim» и, по-видимому, включает конец предыдущего стиха; остальная часть формулировки сверена с английским контрольным слоем.
