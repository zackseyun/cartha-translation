  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: ru
  text: Тогда Ты повелел вывести из Твоих сокровищниц свет, чтобы тогда явились Твои дела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tunc dixisti
  choice: Тогда Ты повелел
  rationale: В данном контексте dixisti обозначает властное речевое повеление; такой перевод естественно передаёт смысл творящего слова.
- source_word: de thesauris tuis
  choice: из Твоих сокровищниц
  rationale: Сохраняется конкретный образ множественного числа thesauris и принадлежность Богу.
- source_word: proferri lumen
  choice: чтобы … был изведён свет
  rationale: 'Пассивная конструкция сохраняет направленность действия: свет выводится или вызывается наружу; «изведён» соответствует возвышенному, но понятному библейскому регистру.'
- source_word: ut apparerent tunc opera tua
  choice: дабы явились Твои дела
  rationale: «Дабы явились» точно передаёт целевое ut и apparerent; второе tunc по-русски опущено как стилистически избыточное, без изменения временной связи.
theological_decisions:
- issue: Происхождение света из Божьих сокровищниц
  choice: Сохранён образ света, изводимого из сокровищниц
  alternative: «чтобы появился свет»
  rationale: Исходный текст не сводит выражение к простому возникновению света, а использует пространственный образ proferri de thesauris; перевод не должен устранять эту образность или дополнительно объяснять её.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Маркеры сносок не требуются.
