  text: And he said to me[a], “I have come to show you these things tonight.”
translation:
  language: ru
  text: 'Он сказал мне: «Я пришёл показать тебе всё это сегодня ночью[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский текст в этом месте повреждён и буквально читается примерно как «и наступающей ночи». Вероятно, следует читать: «этой наступающей ночью».'
    reason: textual_variant
lexical_decisions:
- source_word: haec
  choice: всё это
  rationale: Передаёт указательное местоимение во множественном значении естественным современным русским выражением.
- source_word: veni tibi ostendere
  choice: Я пришёл показать тебе
  rationale: Сохраняет прямую конструкцию и цель прихода без добавочного толкования.
- source_word: venturae nocti
  choice: сегодня ночью
  rationale: Контекстуально передаёт предполагаемое исправленное чтение hac ventura nocte («этой наступающей ночью»); это также естественно подготавливает противопоставление дню в следующем стихе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь прямая, ясная и dignified. Повреждённое латинское чтение не воспроизводится как бессвязная фраза, но отмечено в сноске; в основном тексте дано наиболее вероятное контекстуальное восстановление.
