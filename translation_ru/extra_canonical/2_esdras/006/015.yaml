id: 2ES.6.15
reference: 2 Esdras 6:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: expauescas, quoniam de fine uerbum, et fundamenta terrae intellegetur, Quoniam de ipsis sermo, tremescet et commoue-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/015.yaml
  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: ru
  text: Не ужасайся, потому что слово — о конце, и основания земли задрожат и поколеблются, потому что речь идёт о них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expauescas
  choice: не ужасайся
  rationale: Передаёт сильный страх, выраженный латинским expavescere; отрицание восстановлено по синтаксическому и текстовому контексту, отражённому в сверенном английском слое.
- source_word: de fine
  choice: о конце
  rationale: Сохраняет краткость и неоднозначность латинского выражения, не уточняя, идёт ли речь о конце мира, века или происходящих событий.
- source_word: fundamenta terrae
  choice: основания земли
  rationale: Прямой и естественный эквивалент образного выражения, сохраняющий космологическую образность источника.
- source_word: tremescet et commoue-
  choice: задрожат и поколеблются
  rationale: Передаёт два близких, но не тождественных движения — дрожь и сотрясение; множественное число согласовано с «основания земли». Значение учитывает обрыв слова commoue- и контекст очищенного фрагмента.
- source_word: de ipsis sermo
  choice: речь идёт о них
  rationale: Естественно передаёт смысл латинского оборота и ясно соотносит местоимение с «основаниями земли» без добавочного толкования.
theological_decisions:
- issue: Значение «конца»
  choice: Сохранено общее выражение «о конце».
  alternative: «о конце мира» или «о последних временах»
  rationale: Латинское de fine само по себе не содержит такого уточнения; его добавление преждевременно снимало бы смысловую открытость текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Параллельные глаголы «задрожат и поколеблются» сохраняют ритм и образность исходного пророческого высказывания.
