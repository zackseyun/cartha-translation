  source_fidelity: 'Перевод точно передаёт смысл, закреплённый в латинском фрагменте и английском аудиторском слое: запрет бояться, «слово/речь» о конце, а также дрожание и сотрясение оснований земли. «О конце» обоснованно сохраняет широту de fine. Синтаксис сохранил соотнесённость финального «о них» с основаниями земли. Учитывая повреждённость/сбой порядка в приведённой латинской строке (в частности, intellegetur и обрыв commoue-), не следует реконструировать или уточнять смысл сверх принятого аудиторского чтения.'
  naturalness: «Не ужасайся» — естественное для современного литературного русского и уместно торжественное обращение. «Основания земли задрожат и поколеблются» звучит ясно и сохраняет пророческую образность. Повтор «потому что» несколько формален, но допустим и отражает два quoniam исходника.
  terminology: «Конец», «основания земли» и «речь идёт о них» терминологически нейтральны, точны и не навязывают конфессионального толкования. Имена и специальные богословские термины в стихе отсутствуют.
