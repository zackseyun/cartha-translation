  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: ru
  text: и прежде чем были воздвигнуты высоты воздуха, и прежде чем были названы меры небосводов, и прежде чем было измерено подножие,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altitudines aerum
  choice: воздушные высоты
  rationale: Сохраняет множественное число и образ латинского выражения буквально, но понятно по-русски.
- source_word: extollerentur
  choice: были воздвигнуты
  rationale: Передаёт основное значение пассивной формы extollere — «поднимать, воздвигать» — и соответствует космогоническому контексту.
- source_word: mensurae firmamentorum
  choice: меры небосводов
  rationale: Сохраняет множественное число обоих существительных; «небосвод» естественно передаёт firmamentum в данном контексте.
- source_word: aestimaretur
  choice: было измерено
  rationale: В контексте сотворения мира передаёт значение определения величины; это точнее, чем буквальное «было взвешено», и не вводит отсутствующее в латинском понятие установления.
- source_word: scabellum
  choice: подножие
  rationale: Прямой и традиционно узнаваемый эквивалент; уточнение «Сиона» отсутствует в латинском источнике и поэтому не добавляется.
theological_decisions:
- issue: Неуточнённое «подножие»
  choice: Сохранить без дополнения
  alternative: «подножие Сиона» или «подножие Бога»
  rationale: Латинский текст не указывает, чьё или какое это подножие; добавление сняло бы присущую источнику неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным анафорическим повтором «и прежде чем». Сохранены пассивные конструкции и открывающая/закрывающая запятые, поскольку стих является частью более длинного предложения. Начальная фраза colligerentur innumerabiles militiae angelorum относится к предшествующему синтаксическому и стиховому отрезку и в текст 6:4 не включена.
