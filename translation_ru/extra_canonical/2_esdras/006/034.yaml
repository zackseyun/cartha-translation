  source_fidelity: 'Перевод точно передаёт латинское предостережение: noli festinare ... cogitare vana отражено как «не спеши предаваться пустым размышлениям», а параллель prioribus temporibus — novissimis temporibus сохранена как «прежние времена — последние времена». Передача a novissimis temporibus через «в отношении последних времён» оправдана контекстом и не навязывает пространственного значения удаления.'
