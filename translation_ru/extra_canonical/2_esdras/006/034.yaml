id: 2ES.6.34
reference: 2 Esdras 6:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: ru
  text: и не спеши предаваться пустым размышлениям о прежних временах[b], чтобы не проявлять нетерпения в отношении последних времён».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему прочтению: «чтобы не удалиться от последних времён».'
    reason: previous_rendering
  - marker: b
    text: Текст этого предостережения труден для понимания. По-видимому, речь идёт о запрете нетерпеливых и пустых рассуждений о прежних временах, которые могли бы исказить отношение Эздры к последним временам.
    reason: textual_variant
lexical_decisions:
- source_word: festinare ... cogitare vana
  choice: спеши предаваться пустым размышлениям
  rationale: Передаёт запрет на поспешные и бесплодные умствования; «предаваться размышлениям» естественнее по-русски, чем буквальное «спешить думать пустое».
- source_word: prioribus temporibus
  choice: о прежних временах
  rationale: Сохраняет временную параллель с «последними временами» и передаёт in в значении предмета размышления.
- source_word: properes a novissimis temporibus
  choice: проявлять нетерпение в отношении последних времён
  rationale: Передаёт properes как нетерпеливую поспешность, а a — как отношение к предмету, что согласуется с контекстом ожидания конца и параллелизмом фразы.
theological_decisions:
- issue: Связь предупреждения с последними временами
  choice: в отношении последних времён
  alternative: удаляться от последних времён
  rationale: Не вводит пространственного смысла, противоречащего контексту нетерпеливого ожидания Эздрой конца, но в сноске сохраняется свидетельство прежнего прочтения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены параллель «прежние времена — последние времена» и неоднозначность трудного латинского оборота; альтернативное пространственное понимание отмечено в сноске.
