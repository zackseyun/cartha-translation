lexical_decisions:
- source_word: imperasti
  choice: повелел
  rationale: Передаёт властное распоряжение, выраженное латинским глаголом imperare.
- source_word: deservirent
  choice: служить
  rationale: Естественно передаёт значение подчинённого служения; приставочное усиление de- не требует отдельного выражения в данном контексте.
- source_word: futuro plasmato homini
  choice: человеку, которому предстояло быть сотворённым
  rationale: Сохраняет будущую по отношению к повелению перспективу futuro и пассивный смысл plasmato; «сотворённым» уместно для формирования человека Богом.
theological_decisions:
- issue: Временное соотношение повеления и сотворения человека
  choice: которому предстояло быть сотворённым
  alternative: будущему сотворённому человеку
  rationale: Выбранный оборот ясно показывает, что человек на момент повеления ещё должен был быть сотворён, не добавляя толкований о его природе или предназначении.
