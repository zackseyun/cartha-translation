revisions:
- from: Когда я услышал это, я встал на ноги и стал слушать. И вот, раздался голос, и звучание его было подобно шуму множества вод.
  to: Когда я услышал, я встал на ноги и стал слушать. И вот, говорил голос, и звучание его было подобно шуму многих вод.
  rationale: Исправлена передача loquens как продолжающегося говорения; устранено невыраженное в источнике «это»; multarum передано непосредственно как «многих». Глагол «стал слушать» сохраняет естественное русское различение между первым восприятием и последующим внимательным слушанием.
