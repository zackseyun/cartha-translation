  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: ru
  text: Когда я услышал, я встал на ноги и стал слушать. И вот, говорил голос, и звучание его было подобно шуму многих вод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est cum audissem
  choice: Когда я услышал это
  rationale: Естественная русская передача латинского повествовательного оборота factum est cum без тяжеловесного буквального «и случилось, когда».
- source_word: surrexi super pedes meos
  choice: я встал на ноги
  rationale: Точно передаёт действие и сохраняет библейскую образность латинского выражения.
- source_word: audiui
  choice: стал слушать
  rationale: В контексте передаёт не повторное восприятие звука, а внимательное слушание после того, как говорящий встал.
- source_word: ecce uox loquens
  choice: И вот, раздался голос
  rationale: Передаёт внезапное появление говорящего голоса естественным русским оборотом, не добавляя личности говорящего.
- source_word: sonus eius sicut sonus aquarum multarum
  choice: звучание его было подобно шуму множества вод
  rationale: «Звучание» сохраняет отнесённость eius к голосу, а «шум множества вод» естественно выражает мощный совокупный звук и сохраняет традиционную библейскую образность.
theological_decisions:
- issue: Кому принадлежит голос
  choice: Не уточнять говорящего
  alternative: Назвать голосом Бога или ангела
  rationale: Латинский текст данного стиха говорит лишь о «голосе»; конкретизация устранила бы намеренную контекстуальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Обрыв следующего предложения («Et dixit…») не включён, поскольку английский консультационный текст и граница указанного стиха завершаются сравнением с множеством вод.
