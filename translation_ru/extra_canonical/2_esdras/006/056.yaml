id: 2ES.6.56
reference: 2 Esdras 6:56
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: residuas autem gentes ab Adam natas dixisti eas nihil esse, et quoniam salivae adsimilatae sunt, et sicut stillicidium de vaso similasti abundantiam eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: ru
  text: А о прочих народах, рождённых от Адама, Ты сказал, что они — ничто, что они подобны слюне, а их множество сравнил с каплей из сосуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: А о прочих народах
  rationale: «Прочие народы» прямо передаёт residuas gentes, а начальное «А» сохраняет связующий и противопоставительный оттенок autem.
- source_word: ab Adam natas
  choice: рождённых от Адама
  rationale: Сохраняет образ происхождения и грамматическую связь определения с народами.
- source_word: nihil esse
  choice: они — ничто
  rationale: Передаёт резкость латинского nihil без смягчения до «ничего не значат».
- source_word: salivae adsimilatae sunt
  choice: они подобны слюне
  rationale: Естественная русская формулировка, сохраняющая уничижительное сравнение исходного текста.
- source_word: abundantiam eorum
  choice: их множество
  rationale: В контексте народов abundantia обозначает многочисленность, а не материальное изобилие.
- source_word: sicut stillicidium de vaso
  choice: с каплей из сосуда
  rationale: Передаёт образ малой капли, происходящей из сосуда; более естественно по-русски, чем буквальное «капанье из сосуда».
theological_decisions:
- issue: Уничижительная характеристика прочих народов в обращении к Богу
  choice: Сохранено прямое «Ты сказал, что они — ничто» как содержание речи говорящего.
  alternative: Смягчить до «они ничего не значат» или оформить как оценку самого переводчика.
  rationale: Латинский текст приписывает эти слова Богу внутри аргумента персонажа; перевод не должен ни ослаблять напряжение, ни превращать цитируемое утверждение в самостоятельный богословский комментарий.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Местоимение «Ты» написано с прописной буквы как традиционная форма обращения к Богу; синтаксис упрощён ровно настолько, чтобы стих звучал естественно, без утраты параллелизма и резких образов оригинала.
