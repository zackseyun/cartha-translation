  language: ru
  text: Ибо дух мой был сильно воспламенён, и душа моя была в тревоге.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur
  choice: воспламенился
  rationale: Сохраняет яркий образ латинского глагола «воспламеняться, разгораться», не сводя его к однозначной эмоции.
- source_word: spiritus meus
  choice: дух мой
  rationale: Прямо передаёт латинское выражение и сохраняет параллелизм с «душа моя».
- source_word: anima mea anxiabatur
  choice: душа моя была в тревоге
  rationale: Естественно передаёт состояние внутренней стеснённости и мучительного беспокойства, выраженное латинским anxiabatur.
theological_decisions:
- issue: Соотношение «духа» и «души»
  choice: Сохранены как два отдельных параллельных обозначения внутреннего состояния говорящего.
  alternative: Объединить их в общее понятие внутреннего мира человека.
  rationale: Латинский текст явно различает spiritus и anima; перевод не должен устранять возможное смысловое или риторическое различие.
translation_notes:
  register: Современный литературный русский язык; сохранены торжественный параллелизм и образность исходного текста без искусственной архаизации.
