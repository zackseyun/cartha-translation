source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: ru
  text: 'Когда завершится унижение Сиона и будет отмечен[a] век, который начнёт проходить, тогда Я совершу такие знамения: книги будут раскрыты перед лицом небосвода, и все увидят одновременно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет запечатан»; латинское слово может обозначать нанесение знака или печати.'
    reason: Сохраняет лексическую неоднозначность редкого supersignabitur.
lexical_decisions:
- source_word: suppleta fuerit humilitas Sion
  choice: завершится унижение Сиона
  rationale: Передаёт завершённость suppleta fuerit и сохраняет прямое значение humilitas как унижения или униженного состояния.
- source_word: supersignabitur
  choice: будет отмечен
  rationale: Редкий глагол допускает значения нанесения знака и запечатывания; нейтральное «отмечен» не сужает образ до одного вида действия.
- source_word: saeculum quod incipiet pertransire
  choice: век, который начнёт проходить
  rationale: Сохраняет будущее время incipiet и образ уходящего века, не заменяя его более толковательным выражением «подходить к концу».
- source_word: haec signa faciam
  choice: Я совершу такие знамения
  rationale: Faciam означает «сделаю/совершу», а signa в данном апокалиптическом контексте естественно передаётся как «знамения».
- source_word: libri aperientur ante faciem firmamenti
  choice: книги раскроются перед лицом небосвода
  rationale: Сохраняет пассивную конструкцию, библейский оборот ante faciem и космологический образ firmamentum.
- source_word: omnes uidebunt simul
  choice: все увидят их одновременно
  rationale: Simul передано как «одновременно»; местоимение «их» естественно восполняет подразумеваемый объект — раскрытые книги.
theological_decisions:
- issue: Характер отметки уходящего века
  choice: будет отмечен
  alternative: будет запечатан / будет отмечен печатью
  rationale: Латинское supersignabitur связано со знаком или печатью, но точный характер действия неясен; основной текст сохраняет эту неопределённость, а вариант вынесен в примечание.
- issue: Значение humilitas Sion
  choice: унижение Сиона
  alternative: смирение Сиона / бедствие Сиона
  rationale: «Унижение» лучше сохраняет смысл претерпеваемого униженного состояния и не придаёт выражению преимущественно нравственного значения добровольного смирения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис исходного условно-временного периода сохранён, но для ясности добавлено соотносительное «тогда».
