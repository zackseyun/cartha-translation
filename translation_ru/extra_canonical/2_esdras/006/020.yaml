  verdict: revise
  source_fidelity: 'Основные соответствия точны: suppleta fuerit humilitas Sion передано как завершение унижения Сиона; supersignabitur — нейтральным «будет отмечен» с корректно вынесенной в примечание возможностью «будет запечатан»; faciam — «совершу», а signa — «знамения». Однако в omnes videbunt simul отсутствует выраженный объект. Добавление «их» сужает исходную синтаксическую недосказанность до книг, тогда как латинский текст этого прямо не уточняет.'
  naturalness: Текст в целом звучит как современный литературный русский с умеренно библейским регистром. «Книги будут раскрыты» лучше воспроизводит латинский пассив aperientur, чем возвратное «книги раскроются», сохраняя при этом естественность. Оборот «перед лицом небосвода» намеренно возвышен и уместен в данном контексте.
  terminology: «Сион», «век», «знамения» и «небосвод» употреблены последовательно и уместно. Примечание к [a] верно отражает спорную семантику supersignabitur и не навязывает конкретного толкования.
