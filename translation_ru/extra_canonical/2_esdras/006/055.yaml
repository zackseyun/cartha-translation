  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: ru
  text: Но всё это я сказал перед Тобою, Господи, потому что Ты сказал, что Ты ради нас сотворил первородный мир.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в латинском тексте: «первородный мир». В сирийской, эфиопской и арабской версиях: «этот мир».'
    reason: textual_variant
lexical_decisions:
- source_word: autem
  choice: но
  rationale: Передаёт переход и лёгкое противопоставление между предшествующим изложением и обращённым к Богу доводом Ездры.
- source_word: coram te
  choice: пред Тобой
  rationale: Естественное и торжественное соответствие латинскому выражению со значением речи в Божьем присутствии.
- source_word: propter nos
  choice: ради нас
  rationale: Сохраняет значение цели или благоприятствующей причины, не сводя выражение к простой причинности.
- source_word: primogenitum saeculum
  choice: первый мир
  rationale: 'В основном тексте отражено принятое контекстуальное понимание: saeculum означает устроенный мир или век, а primogenitum передано как указание на первенство. Буквальное чтение и важный разночтенный вариант указаны в сноске.'
theological_decisions:
- issue: Смысл выражения primogenitum saeculum и его значение для космологии отрывка
  choice: первый мир
  alternative: «первородный мир» по буквальному латинскому тексту; «этот мир» по сирийской, эфиопской и арабской версиям
  rationale: Формулировка основного текста следует предоставленному критически пересмотренному слою и остаётся понятной современному читателю. Сноска сохраняет реальную текстологическую неопределённость и не навязывает определённой схемы миров или веков.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «Тобой» и «Ты» написаны с прописной буквы как уважительное обращение к Богу; синтаксис сохранён ясным и близким к латинскому.
