  source_fidelity: Основной текст передаёт структуру латинского оригинала, однако «первый мир» сглаживает специфическое primogenitum saeculum. Для перевода, проверяемого прежде всего по данной латинской редакции, безопаснее сохранить значение «первородный», а текстологический вариант других версий оставить в сноске.
  naturalness: «Перед Тобою» — современнее и естественнее, чем «пред Тобой», при сохранении умеренно торжественного библейского регистра. Явное повторение «Ты» в придаточном устраняет возможную синтаксическую неоднозначность.
  terminology: «Первородный мир» точно отражает латинское primogenitum saeculum, не превращая его в определённую космологическую схему. Сноска корректно отмечает чтение «этот мир» в восточных версиях.
