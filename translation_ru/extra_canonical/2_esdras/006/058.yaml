source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: ru
  text: Но мы, Твой народ, которого Ты назвал Своим первенцем, Своим единородным, Своим ревнителем[a], Своим самым дорогим, были преданы в их руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское слово aemulatorem трудно для однозначного перевода; оно может иметь оттенки ревности, усердного подражания или соперничества. Здесь оно сохранено как отдельный почётный титул в ряду заветных наименований народа.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были отданы в их руки».'
    reason: translation_alternative
lexical_decisions:
- source_word: primogenitum
  choice: Своим первенцем
  rationale: Прямо передаёт первый почётный заветный титул и сохраняет образ родства.
- source_word: unigenitum
  choice: Своим единородным
  rationale: Сохраняет отличие от «первенца» и формальную силу латинского unigenitum, не добавляя существительного, которого нет в тексте.
- source_word: aemulatorem
  choice: Своим ревнителем
  rationale: Латинское слово трудно и допускает оттенки ревности, усердного подражания или соперничества; «ревнитель» сохраняет эту напряжённость лучше сглаживающего «возлюбленный».
- source_word: carissimum
  choice: самым дорогим для Тебя
  rationale: Передаёт превосходную степень carissimum и не смешивает этот титул с предшествующим aemulatorem.
- source_word: traditi sumus in manibus eorum
  choice: были преданы в их руки
  rationale: «Преданы» передаёт более сильный смысл trado — отдать или выдать во власть других, а не просто «дать».
theological_decisions:
- issue: Накопление почётных наименований Израиля
  choice: Сохранить четыре раздельных титула
  alternative: Сгладить ряд до общего обозначения избранного и возлюбленного народа
  rationale: Латинский текст намеренно накапливает заветные титулы; их сведение к парафразу устранило бы риторическое и богословское напряжение между высоким статусом народа и его преданием врагам.
- issue: Значение aemulatorem
  choice: Передать как «ревнителем» и отметить неоднозначность
  alternative: Передать как «возлюбленным» либо «подражателем»
  rationale: «Возлюбленный» дублировало бы carissimum, а «подражатель» чрезмерно сузило бы трудное латинское слово.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным обращением. Заглавные местоимения в обращении к Богу поддерживают принятый русский библейский регистр. Синтаксический ряд сохранён без сглаживания, чтобы передать контраст между почётными титулами народа и его унижением.
