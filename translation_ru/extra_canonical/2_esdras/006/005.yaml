  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: ru
  text: и прежде чем были исследованы нынешние годы[a], и прежде чем были отчуждены замыслы тех, кто ныне грешит, и прежде чем были запечатлены те, кто собрал веру как сокровище, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нынешние времена»; латинское выражение буквально означает «нынешние годы».'
    reason: Уточняет возможный контекстуальный смысл praesentes anni, сохраняя буквальную формулировку в основном тексте.
lexical_decisions:
- source_word: inuestigarentur
  choice: были исследованы
  rationale: Сохраняет образ латинского investigare — «исследовать, прослеживать, разыскивать», не подменяя его более определённым толкованием вроде «исчислить» или «назначить».
- source_word: praesentes anni
  choice: нынешние годы
  rationale: Прямо передаёт латинское словосочетание и сохраняет его необычность; возможное контекстуальное значение «нынешние времена» отмечено в сноске.
- source_word: abalienarentur
  choice: были устранены
  rationale: В данном сочетании с «замыслами» естественно передаёт значение удаления или отведения; буквальное «отчуждены» по-русски было бы неясным и неидиоматичным.
- source_word: adinventiones
  choice: замыслы
  rationale: Здесь речь, вероятнее всего, об измышлениях или замыслах грешащих, а не об изобретениях в современном техническом смысле.
- source_word: consignarentur
  choice: были запечатлены
  rationale: Сохраняет библейский образ наложения печати и страдательный залог.
- source_word: qui fidem thesaurizaverunt
  choice: накопившие веру
  rationale: Передаёт намеренно необычную метафору thesaurizare — «собирать как сокровище, накапливать», не сглаживая её до «сохранившие верность».
theological_decisions:
- issue: Временная зависимость последнего предложения
  choice: повторено «и прежде чем» перед «были запечатлены»
  alternative: «и накопившие веру были запечатлены» как самостоятельное утверждение
  rationale: Сослагательное consignarentur продолжает ряд придаточных, управляемых antequam; перевод сохраняет временную последовательность, не превращая последнюю часть в отдельное утверждение.
- issue: Смысл выражения «накопившие веру»
  choice: метафора сохранена без догматического пояснения
  alternative: истолковать как «сохранившие верность» или «стяжавшие заслуги верой»
  rationale: Латинская формулировка допускает смысловую напряжённость; конкретизирующее богословское толкование не заложено однозначно в тексте.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Анафора «и прежде чем» сохранена во всех трёх частях. Конечное тире показывает, что синтаксическая последовательность продолжается в следующем стихе.
