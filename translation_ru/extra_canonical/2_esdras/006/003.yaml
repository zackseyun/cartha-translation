  text: and before the beautiful flowers were seen[a], and before the powers of the movements were established, and before
translation:
  language: ru
  text: основания рая; и прежде чем явились прекрасные цветы, и прежде чем утвердились силы движений[a], и прежде чем…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «силы потрясений»; латинское слово может также обозначать землетрясения.'
    reason: Сохраняет многозначность motus и отмечает апокалиптическое прочтение, не закрепляя его в основном тексте.
lexical_decisions:
- source_word: fundamenta paradisi
  choice: основания рая
  rationale: Прямо передаёт латинское словосочетание, сохранённое в предоставленном исходном фрагменте; начальная синтаксическая неполнота не сглаживается.
- source_word: uiderentur decores flores
  choice: явились прекрасные цветы
  rationale: Uiderentur буквально допускает «были видимы», но в контексте ещё не возникшего творения естественное русское «явились» передаёт появление цветов, не меняя образа; decores передано как «прекрасные».
- source_word: confirmarentur
  choice: утвердились
  rationale: Сохраняет значение установления и обретения устойчивости без добавления не выраженного в источнике деятеля.
- source_word: motus uirtutes
  choice: силы движений
  rationale: Формально сохраняет сочетание uirtutes («силы») и многозначного motus («движения», также потрясения/землетрясения), не подменяя его более узким толкованием.
theological_decisions:
- issue: Природа motus в перечне сил творения
  choice: силы движений
  alternative: силы землетрясений
  rationale: Латинское motus может обозначать землетрясения в апокалиптическом контексте, однако само по себе имеет более широкое значение. Основной текст сохраняет эту неопределённость, а примечание сообщает конкретную возможную интерпретацию.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным ритмом повторяющихся придаточных. Сохранены начальная и конечная фрагментарность предоставленного латинского сегмента; многоточие показывает обрыв после et antequam.
