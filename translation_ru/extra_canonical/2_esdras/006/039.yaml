- from: И тогда дух носился[a], а вокруг были тьма и тишина; звук человеческого голоса ещё не исходил от Тебя[b].
  to: И тогда дух носился[a], а вокруг были тьма и тишина; звука человеческого голоса ещё не было от Тебя[b].
  rationale: Заменено только «не исходил» на «не было», чтобы передать экзистенциальный глагол erat и не устранить заложенную в abs te неоднозначность происхождения и Божьего творческого действия. Сноски и их якоря сохранены.
