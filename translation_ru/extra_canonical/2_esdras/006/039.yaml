    issue: «не исходил от Тебя» вместо экзистенциального «не было от Тебя»
    rationale: Nondum erat abs te буквально сообщает, что звука ещё не было «от Тебя». «Исходил» вносит представление о продолжающемся активном истечении/произнесении, которого erat не выражает.
