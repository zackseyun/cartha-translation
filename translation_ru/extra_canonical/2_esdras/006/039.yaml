source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: ru
  text: И тогда дух носился[a], а вокруг были тьма и тишина; звука человеческого голоса ещё не было от Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «летал».'
    reason: Показывает буквальное значение volans, тогда как в основном тексте выбрано более естественное для данного контекста «носился».
  - marker: b
    text: 'Букв.: «ещё не был от Тебя».'
    reason: Отмечает необычную краткость латинского выражения и сохраняет возможность понимать его как происхождение или творческое действие Бога.
lexical_decisions:
- source_word: spiritus
  choice: дух
  rationale: Латинское слово допускает значения «дух», «дыхание» и «ветер». В контексте рассказа о творении «дух» сохраняет вероятную отсылку к повествованию Бытия, но строчная буква не устраняет неоднозначность оригинала.
- source_word: volans
  choice: носился
  rationale: Причастие буквально означает «летящий». Русское «носился» естественно передаёт движение над первозданным миром, не сужая смысл до неподвижного парения.
- source_word: tenebrae circumferebantur et silentium
  choice: вокруг были тьма и тишина
  rationale: Буквальная конструкция «тьма и тишина носились/распространялись вокруг» по-русски звучит неестественно. Выбранная формулировка передаёт окружающее присутствие тьмы и тишины.
- source_word: sonus vocis hominis
  choice: звук человеческого голоса
  rationale: Прямо и естественно передаёт сочетание «звук голоса человека», сохраняя акцент на ещё не существовавшей человеческой речи.
- source_word: nondum erat abs te
  choice: ещё не исходил от Тебя
  rationale: Сохраняет выраженное предлогом abs происхождение от Бога и не добавляет прямо отсутствующего в тексте понятия сотворения.
theological_decisions:
- issue: Отождествление spiritus со Святым Духом
  choice: «дух» со строчной буквы
  alternative: «Дух» с прописной буквы
  rationale: Контекст может подразумевать Божий Дух, однако латинская форма сама по себе не требует однозначной личностно-тринитарной интерпретации; строчная буква сохраняет напряжение текста.
- issue: Смысл выражения abs te применительно к человеческому голосу
  choice: «не исходил от Тебя»
  alternative: «ещё не был создан Тобой»
  rationale: Альтернатива ясно выражает возможный смысл Божьего творческого действия, но делает явным то, что в оригинале дано более сжато как происхождение «от Тебя».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным звучанием. Обращение к Богу передано местоимением «Тебя» с прописной буквы; синтаксис остаётся ясным для широкого читателя, а неоднозначности spiritus и abs te не снимаются догматически.
