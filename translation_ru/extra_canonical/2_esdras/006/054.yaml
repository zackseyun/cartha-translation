source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
translation:
  language: ru
  text: А над всеми ими — Адам, которого Ты поставил правителем над всеми Твоими творениями; от него произошли все мы — народ, который Ты избрал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от него произошли все мы, и избранный Тобой народ».'
    reason: Передаёт менее вероятное соединительное понимание латинского синтаксиса, при котором общий предикат «произошли от него» относится к обеим группам.
lexical_decisions:
- source_word: super his
  choice: над всеми ими
  rationale: Передаёт положение Адама над ранее перечисленными творениями; «всеми» естественно по-русски уточняет совокупный референт.
- source_word: ducem
  choice: правителем
  rationale: В контексте назначения над всеми творениями означает поставленного во главе, обладающего властью; «правитель» звучит современно и не сужает смысл до военного вождя.
- source_word: omnibus factis quae fecisti
  choice: над всеми сотворёнными Тобой созданиями
  rationale: Сохраняет охват всех Божьих дел, избегая тяжеловесного повтора «делами, которые Ты сделал».
- source_word: ex eo educimur nos omnes
  choice: от него произошли все мы
  rationale: Естественно выражает происхождение всех названных здесь людей от Адама.
- source_word: quem elegisti populum
  choice: народ, который Ты избрал
  rationale: 'Основное чтение понимает оборот как приложение к «все мы»: говорящие отождествлены с избранным народом.'
theological_decisions:
- issue: Связь выражения quem elegisti populum с nos omnes
  choice: «все мы — народ, который Ты избрал» (приложение)
  alternative: «все мы и народ, который Ты избрал» (две координированные группы)
  rationale: Латинский оборот естественнее связывает populum в приложении с nos omnes и тем самым отождествляет «всех нас» с избранным народом; однако синтаксис допускает менее вероятное соединительное понимание, сохранённое в примечании.
translation_notes:
  register: Современный литературный русский язык с почтительным обращением к Богу через прописное «Ты». Синтаксис сохраняет торжественность молитвенной речи, оставаясь ясным для обычного читателя.
