  to: Левиафану же Ты отдал седьмую, влажную часть и сохранил их[a], чтобы они стали пищей для тех, кого Ты пожелаешь, и тогда, когда пожелаешь.
  rationale: Заменено интерпретирующее «водную» на более точное «влажную», передающее humidam без сужения смысла. Множественное число сохранено согласно латинскому тексту; сноска оставлена, поскольку английская традиция и некоторые переводы выбирают единственное число.
