  yaml_path: translation/extra_canonical/2_esdras/006/052.yaml
  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: ru
  text: Левиафану же Ты отдал седьмую, влажную часть и сохранил их[a], чтобы они стали пищей для тех, кого Ты пожелаешь, и тогда, когда пожелаешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Бегемота и Левиафана. В латинском тексте местоимение и следующий глагол стоят во множественном числе; некоторые переводы относят эти слова только к Левиафану и передают их в единственном числе.
    reason: Множественное число источника создаёт референциальную неоднозначность, которую нельзя молча устранить.
lexical_decisions:
- source_word: Leuiathan autem
  choice: Левиафану же
  rationale: Дательный падеж передаёт латинское управление; частица «же» естественно выражает противопоставление Бегемоту в предыдущем стихе.
- source_word: septimam partem humidam
  choice: седьмую часть — водную
  rationale: '«Водную» в данном контексте яснее и естественнее буквального «влажную»: речь идёт о седьмой части творения, занятой водой. Тире сохраняет пояснительный характер определения.'
- source_word: seruasti
  choice: сохранил
  rationale: Передаёт смысл сохранения или удержания существ до назначенного Богом времени, не добавляя более узкого толкования.
- source_word: quibus vis et quando vis
  choice: для тех, кого Ты пожелаешь, и тогда, когда пожелаешь
  rationale: Сохраняется двойная неопределённость адресата и времени, а повтор соответствует риторической структуре источника.
theological_decisions:
- issue: К кому относится множественное местоимение ea и глагол fiant
  choice: «их… они» — к двум ранее названным существам, Бегемоту и Левиафану
  alternative: «его… он» — только к Левиафану; либо «её» — к водной седьмой части
  rationale: В представленном латинском тексте ea и fiant имеют форму множественного числа. Поэтому единственное число английского консультационного текста грамматически не поддерживается. Ближайший осмысленный множественный референт в контексте — два существа, Бегемот и Левиафан.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным для обычного читателя; обращённое к Богу «Ты» написано с прописной буквы. Публикуемый текст начинается там, где начинается собственно 2 Ездры 6:52; начальные слова предоставленного фрагмента относятся к окончанию предыдущего стиха.
