  text: 'твоих, часть которых Ты показал мне прошлой ночью». И он ответил и сказал мне: «Встань на ноги — и услышишь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuorum
  choice: твоих
  rationale: Сохраняет зависимую, продолжающую предыдущий стих конструкцию и грамматически передаёт родительный падеж множественного числа.
- source_word: quorum ex parte
  choice: часть которых
  rationale: Естественно по-русски передаёт значение «из которых [некоторую] часть», не уточняя сверх источника, к чему относится местоимение.
- source_word: nocte praeterita
  choice: прошлой ночью
  rationale: Современное и точное соответствие латинскому выражению.
- source_word: surge super pedes tuos
  choice: встань на ноги
  rationale: Нормальная русская идиома, сохраняющая прямой повелительный смысл.
- source_word: audies
  choice: услышишь
  rationale: Передаёт будущее время без добавления не названного в данном фрагменте объекта.
theological_decisions:
- issue: Референт tuorum/quorum
  choice: 'Оставить местоименную зависимость: «твоих, часть которых»'
  alternative: Повторить предполагаемое существительное, например «Твоих знамений»
  rationale: Предоставленный латинский фрагмент начинается в середине предложения; добавление существительного разрешило бы контекстуальную эллиптичность, которой нет в данном тексте.
- issue: Формула et respondit et dixit ad me
  choice: «И Он ответил мне»
  alternative: «И Он ответил и сказал мне»
  rationale: В русском сочетание двух глаголов речи здесь тяжеловесно; единый глагол естественно передаёт семитизированную латинскую формулу без изменения содержания.
translation_notes:
  register: Современный литературный русский с dignified повествовательным тоном. Начальная строчная буква намеренно сохраняет связь с предыдущим стихом; конечная фраза также остаётся незавершённой по границе предоставленного текста.
