  text: 'Et dixit ad me: initium terreni orbis, et antequam starent exitus saeculi et antequam spirarent conuentiones uentorum, Et antequam sonarent uoces tonitruum, et antequam splenderent nitores coruscuum et antequam confirmarentur'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
translation:
  language: ru
  text: 'И Он сказал мне: «В начале земного мира, прежде чем утвердились пределы мира[a] и прежде чем задышали собрания ветров…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходы мира»; возможно также: «края мира». Латинское слово, переданное как «мира», может означать и «века».'
    reason: Латинское exitus saeculi допускает пространственное и временное понимание; основной текст передаёт наиболее вероятный космологический смысл и сноска сохраняет неоднозначность.
lexical_decisions:
- source_word: initium terreni orbis
  choice: в начале земного мира
  rationale: Передаёт космогоническое значение латинского выражения естественным современным русским языком.
- source_word: exitus saeculi
  choice: пределы мира
  rationale: Exitus может означать выходы, края или крайние пределы, а saeculum здесь допускает пространственно-космологическое значение «мир». Формулировка сохраняет образ границ мироздания, не уточняя его как «врата» без достаточного основания.
- source_word: starent
  choice: утвердились
  rationale: В космогоническом контексте означает, что пределы обрели установленное, устойчивое положение.
- source_word: conuentiones uentorum
  choice: собравшиеся ветры
  rationale: Сохраняет необычный образ соединения или собрания ветров, но звучит понятнее буквального «собрания ветров» в роли подлежащего при spirarent.
- source_word: spirarent
  choice: подули
  rationale: Естественный русский эквивалент применительно к ветрам.
theological_decisions:
- issue: Пространственное или временное значение saeculi
  choice: мира
  alternative: века
  rationale: Перечень первозданных космических явлений поддерживает пространственное значение; при этом сноска сохраняет буквальную неоднозначность латинского сочетания.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным библейским звучанием. Многоточие показывает, что синтаксическое перечисление продолжается в следующем стихе; слова исходного фрагмента после conuentiones uentorum относятся к последующему стиху по принятому делению.
