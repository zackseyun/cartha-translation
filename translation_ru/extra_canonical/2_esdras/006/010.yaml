  text: “Do not ask anything else[a], Ezra.” And I answered and said, “O Lord who rules, if I have found favor
translation:
  language: ru
  text: '«Не спрашивай ни о чём другом[a], Ездра». И я ответил и сказал: «О Владыка Господи, если я обрёл благоволение'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Больше ни о чём не спрашивай, Ездра».'
    reason: Передаёт контекстуально возможный смысл прекращения дальнейших вопросов, тогда как основной текст ближе сохраняет значение латинского aliud («другое, иное»).
lexical_decisions:
- source_word: aliud noli querere
  choice: Не спрашивай больше ни о чём
  rationale: Передаёт запрет продолжать расспросы; aliud буквально указывает на «что-либо иное», а в данном контексте естественно выражается как «больше ни о чём».
- source_word: Ezra
  choice: Ездра
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Et respondi et dixi
  choice: И я ответил и сказал
  rationale: Сохранена характерная для библейского повествования двойная формула, хотя по-русски она несколько избыточна.
- source_word: O dominator domine
  choice: О Владыка Господи
  rationale: 'Сохраняет оба обращения: dominator как «Владыка» и domine как звательную форму «Господи», без сведения их к одному титулу.'
- source_word: si inueni gratiam
  choice: если я обрёл благоволение
  rationale: Обычная библейская формула; «обрёл благоволение» естественно передаёт invenire gratiam и оставляет незавершённость фразы на границе стиха.
theological_decisions:
- issue: Передача двойного титула dominator domine
  choice: О Владыка Господи
  alternative: О Господь, Который правит
  rationale: Выбранная форма точнее сохраняет два титульных обращения и их торжественный регистр, не превращая dominator в пояснительное придаточное и не разрешая возможный вопрос об их исходной семитской или греческой основе.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Незавершённая условная фраза сохранена, поскольку латинский текст данного стиха заканчивается на si inueni gratiam и продолжается за его границей.
