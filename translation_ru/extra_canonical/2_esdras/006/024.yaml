source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
translation:
  language: ru
  text: 'И будет в то время: друзья станут воевать с друзьями, как с врагами; земля ужаснётся вместе с теми, кто живёт на ней[a], а потоки источников остановятся и не будут течь три часа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «земля ужаснётся с теми, кто живёт на ней».'
    reason: Поясняет сопроводительное значение латинского cum и сохраняет доступ к более буквальной форме выражения.
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: друзья станут воевать с друзьями, как с врагами
  rationale: Передаёт взаимное вооружённое противостояние и сохраняет контраст между друзьями и врагами без лишнего усиления.
- source_word: expauescet terra cum his qui inhabitant eam
  choice: земля ужаснётся вместе с теми, кто живёт на ней
  rationale: 'Cum понято в сопроводительном значении: ужас охватывает и землю, и её жителей. Формулировка естественна по-русски и не создаёт ошибочного смысла, будто жители являются причиной страха земли.'
- source_word: uenae fontium
  choice: потоки источников
  rationale: Латинское uenae буквально обозначает «жилы, русла, протоки»; в контексте остановившегося течения естественное русское соответствие — «потоки источников».
- source_word: stabunt ... ut non currant tribus horis
  choice: остановятся и не будут течь три часа
  rationale: Сохраняет образ прекращения движения воды и явно передаёт указанную продолжительность.
