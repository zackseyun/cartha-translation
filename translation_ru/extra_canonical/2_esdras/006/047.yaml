  text: On the fifth day you said to the seventh part, where the water was gathered, that it should bring forth living creatures, birds, and fish;
translation:
  language: ru
  text: На пятый же день Ты сказал седьмой части, где была собрана вода, чтобы она произвела живых существ, птиц и рыб;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinto autem die
  choice: На пятый же день
  rationale: Передаёт временное указание и связующую частицу autem в естественном возвышенном русском синтаксисе.
- source_word: dixisti septimae parti
  choice: Ты сказал седьмой части
  rationale: Сохраняет буквальный образ обращения к одной из семи частей мира и форму второго лица, относящуюся к Богу.
- source_word: ubi erat aqua [congregata]
  choice: где была собрана вода
  rationale: Единственное число «вода» соответствует aqua; «была собрана» отражает засвидетельствованный контекст полного стиха и согласуется с предоставленным английским контрольным слоем.
- source_word: animalia, volatilia et pisces
  choice: живых существ, птиц и рыб
  rationale: «Живые существа» понятно передаёт широкое animalia, а «птиц и рыб» естественно и точно обозначает две последующие категории.
theological_decisions:
- issue: Персонифицированное обращение к седьмой части творения
  choice: сказал седьмой части… чтобы она произвела
  alternative: повелел седьмой части произвести
  rationale: Формулировка с «сказал» ближе к dixisti и сохраняет библейский образ действенного Божьего слова, не усиливая его до прямого глагола «повелел».
translation_notes:
  register: Современный литературный русский с библейски возвышенным, но понятным строем речи. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Точка с запятой сохранена, поскольку стих синтаксически продолжает перечисление дней творения.
