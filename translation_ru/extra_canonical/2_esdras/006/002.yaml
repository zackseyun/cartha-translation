  text: и прежде чем раздались голоса громов, и прежде чем засверкали вспышки молний, и прежде чем были утверждены основания рая,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sonarent voces tonitruum
  choice: раздались голоса громов
  rationale: Сохранён образ «голосов громов» и передано значение sonare естественным русским глаголом «раздаться».
- source_word: splenderent nitores coruscuum
  choice: засверкали вспышки молний
  rationale: Переданы и яркий блеск (nitores), и связь с молниями (coruscuum); формулировка звучит естественно и сохраняет образность.
- source_word: confirmarentur fundamenta paradisi
  choice: утвердились основания рая
  rationale: «Утвердились» сохраняет значение укрепления и установления, выраженное confirmarentur, без излишнего уточнения способа действия.
