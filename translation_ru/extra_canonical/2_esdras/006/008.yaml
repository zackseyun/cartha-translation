source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixit ad me : ab Abraham usque ad Abraham, quoniam ab eo natus est Iacob et Esau, manus enim Iacob tenebat ab initio calcaneum Esau. Finis enim huius saeculi Esau, et principium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/008.yaml
  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: ru
  text: 'И он сказал мне: «От Авраама до Авраама[a], потому что от него родились Иаков и Исав; ведь рука Иакова с самого начала держала Исавову пяту. Ибо Исав — конец этого века[b], а начало…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от Авраама до Авраама» неясно в латинском свидетельстве и, вероятно, искажено при переписывании. В ряде древних переводов здесь читается «от Авраама до Исаака», что согласуется со следующим пояснением о рождении Иакова и Исава.
    reason: textual_variant
  - marker: b
    text: 'Или: «этого мира». Латинское слово saeculum может обозначать как век или эпоху, так и миропорядок.'
    reason: translation_alternative
lexical_decisions:
- source_word: ab Abraham usque ad Abraham
  choice: от Авраама до Авраама
  rationale: Сохранено буквальное, хотя и неясное, чтение предоставленного латинского текста; вероятная порча не исправляется молча.
- source_word: manus enim Iacob tenebat ab initio calcaneum Esau
  choice: ведь рука Иакова с самого начала держала Исавову пяту
  rationale: Передана конкретная образность латинского текста и связь с рассказом о рождении близнецов без добавочного истолкования.
- source_word: saeculi
  choice: века
  rationale: В данном эсхатологическом противопоставлении русское «век» естественно передаёт латинское saeculum и сохраняет значение эпохи.
theological_decisions:
- issue: Символическое отождествление Исава с концом нынешнего века
  choice: Исав — конец этого века
  alternative: Исав — конец этого мира
  rationale: Выбрано «века», чтобы сохранить временной и эсхатологический смысл saeculum и не сужать его до пространственного понятия «мир».
- issue: Незавершённая заключительная фраза
  choice: а начало…
  alternative: дополнить подразумеваемый субъект по следующему стиху
  rationale: Источник обрывается после principium; перевод не восполняет отсутствующий текст и сохраняет синтаксическую незавершённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Неясность первого выражения и обрыв конца фрагмента сохранены, а вероятная текстовая порча разъяснена в сноске, но не исправлена в основном тексте.
