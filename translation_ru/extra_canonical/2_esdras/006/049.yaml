  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
translation:
  language: ru
  text: 'Тогда Ты сохранил двух живых существ: одного Ты назвал Бегемотом[a], а другого — Левиафаном.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бегемот и Левиафан — первозданные существа, известные по иудейскому Писанию и более позднему иудейскому преданию; здесь, в пересказе Ездрой истории творения, они представлены как сохранённые Богом существа.
    reason: cross_reference
lexical_decisions:
- source_word: conseruasti
  choice: сохранил
  rationale: Передаёт смысл сохранения двух существ в контексте повествования о творении, не уточняя способ или цель сверх текста.
- source_word: duo animalia
  choice: двух живых существ
  rationale: Латинское animalia здесь обозначает одушевлённых созданий; вариант «живые существа» естественнее по-русски и не сводит Бегемота и Левиафана к обычным животным.
- source_word: nomen uni uocasti Behemoth
  choice: одного Ты назвал Бегемотом
  rationale: Естественная русская передача буквального оборота «имя одного Ты назвал Бегемот» без изменения смысла.
- source_word: Leviathan
  choice: Левиафаном
  rationale: Традиционная русская библейская форма имени; продолжение опирается на засвидетельствованный текст стиха, отражённый в консультационном английском слое, поскольку предоставленный латинский отрывок обрывается на et.
theological_decisions:
- issue: Статус Бегемота и Левиафана
  choice: живые существа
  alternative: звери / чудовища
  rationale: Нейтральная формулировка сохраняет неоднозначность их природы и не навязывает мифологическое либо зоологическое толкование.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Эллиптическая конструкция «а другого — Левиафаном» делает параллелизм естественным и не добавляет толкования.
