  text: congregata, ut procrearet animalia, uolatilia et pisces; Et ita fiebat aqua muta et sine anima, quod ei iubebatur, animalia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
translation:
  language: ru
  text: 'собралась[a], чтобы произвести животных, птиц и рыб; и так произошло: безмолвная и безжизненная вода произвела живых существ, как ей было велено.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произвела живых существ, как ей было велено».'
    reason: Передаёт возможный вариант понимания сжатой заключительной латинской конструкции и сохраняет привязку примечания к тому же месту, что и в английской аудит-традиции.
lexical_decisions:
- source_word: congregata
  choice: собралась
  rationale: Сохраняет образ собравшейся воедино воды и согласуется с женским родом подразумеваемого aqua.
- source_word: procrearet
  choice: произвести
  rationale: Передаёт каузативный смысл рождения/появления существ, не приписывая воде биологическое размножение.
- source_word: animalia, uolatilia et pisces
  choice: животных, птиц и рыб
  rationale: Естественно передаёт перечисление; uolatilia обозначает летающих существ, в данном контексте — птиц.
- source_word: aqua muta et sine anima
  choice: безмолвная и безжизненная вода
  rationale: Сохраняет контраст между самой водой, лишённой голоса и жизни, и возникшими в ней живыми существами.
- source_word: animalia
  choice: живых существ
  rationale: В заключительной части это выражение естественно передаёт общее значение animalia и подчёркивает контраст с безжизненной водой.
- source_word: quod ei iubebatur
  choice: как ей было велено
  rationale: Передаёт подчинение воды Божьему повелению, сохраняя пассивную конструкцию и не добавляя явно не названного деятеля.
theological_decisions:
- issue: Деятельность воды при сотворении живых существ
  choice: вода произвела живых существ, как ей было велено
  alternative: Бог непосредственно произвёл живых существ из воды
  rationale: Латинский текст грамматически представляет воду исполняющей данное ей повеление; перевод не должен устранять эту образность или добавлять неназванного субъекта.
- issue: Смысл sine anima
  choice: безжизненная
  alternative: не имеющая души
  rationale: В контексте противопоставления воде и animalia выражение относится к отсутствию в воде собственной жизни, а не формулирует учение о природе души.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о сотворении мира. Синтаксис остаётся близким к латинскому, но эллиптическая заключительная конструкция раскрыта для ясности; двоеточие подчёркивает контраст между безжизненной водой и произведёнными ею живыми существами.
