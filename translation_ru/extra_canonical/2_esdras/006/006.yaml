  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: ru
  text: Тогда Я помыслил, и всё это было сотворено через Меня, а не через другого; так и конец будет через Меня, а не через другого».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitaui
  choice: Я замыслил
  rationale: Латинское cogitavi здесь передаёт не просто размышление, а предшествующий творению замысел говорящего; «замыслил» естественно связывает мысль с последующим возникновением всего.
- source_word: facta sunt haec
  choice: всё это возникло
  rationale: Сохраняет широкий смысл facta sunt («стало быть», «возникло», «было сделано») без излишне узкого уточнения способа творения.
- source_word: per me et non per alium
  choice: через Меня, а не через другого
  rationale: Формально сохраняет повторяющуюся конструкцию per me и противопоставление non per alium; прописная буква указывает на Бога как говорящего в данном контексте.
- source_word: ut et finis
  choice: так и конец наступит
  rationale: Передаёт соотнесение начала и конца; добавление естественного русского глагола «наступит» делает эллиптическую латинскую конструкцию понятной, не уточняя природу конца.
theological_decisions:
- issue: Божественная исключительность как в творении, так и в наступлении конца
  choice: Сохранено двукратное «через Меня, а не через другого»
  alternative: Передать инструментальную конструкцию как «Мною одним»
  rationale: Повтор исходного текста сохраняет богословское напряжение и не сводит per me к более определённой формуле непосредственного единоличного действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Синтаксический параллелизм латинского текста сохранён; неоднозначное finis передано нейтральным словом «конец».
