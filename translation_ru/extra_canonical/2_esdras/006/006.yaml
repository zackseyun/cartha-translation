  naturalness: Предлагаемая правка сохраняет торжественный, ясный современный литературный регистр. «Помыслил» уместно в библейском повествовании и не вносит более узкого значения намеренного проектирования. Параллельная конструкция с «будет через Меня» передаёт эллиптическое латинское сказуемое без дополнительного смыслового глагола «наступит».
  terminology: Повторены «через Меня, а не через другого» и нейтральное «конец» для per me et non per alium и finis. Прописное «Меня» оправдано речью Бога в данном контексте.
