source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixi: o Domine, loquens locutus es ab initio creaturae in primo die dicens: fiat caelum et terra, et tuum verbum opus perfecit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: ru
  text: 'И я сказал: «О Господи, от начала творения, в первый день, Ты сказал[a]: „Да будут сотворены небо и земля“, — и Твоё слово совершило это дело».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говоря, Ты сказал»; в оригинале это усилительная конструкция.'
    reason: Сохраняет заметную риторическую особенность loquens locutus es, не вводя неестественное удвоение в основной русский текст.
lexical_decisions:
- source_word: ab initio creaturae
  choice: от начала творения
  rationale: Сохраняет исходную временную формулу и её связь с первым днём, не сужая creaturae до отдельного сотворённого объекта.
- source_word: loquens locutus es
  choice: Ты сказал
  rationale: Естественно передаёт латинскую усилительную конструкцию в основном тексте; буквальное удвоение «говоря, сказал» в современном русском звучало бы искусственно. Особенность оригинала отмечена в сноске.
- source_word: fiat caelum et terra
  choice: Да будут сотворены небо и земля
  rationale: Передаёт повелительно-желательное fiat и пассивный смысл «пусть возникнут/будут созданы», сохраняя торжественный регистр.
- source_word: tuum verbum opus perfecit
  choice: Твоё слово совершило это дело
  rationale: Сохраняет персонифицированную действенность слова и значение perfecit — довело дело до исполнения, совершило его.
theological_decisions:
- issue: Действенность Божьего слова в творении
  choice: «Твоё слово совершило это дело»
  alternative: «по Твоему слову дело совершилось»
  rationale: Выбранная формулировка следует грамматике оригинала, где verbum является подлежащим, и не ослабляет утверждение о действующем слове.
- issue: Смысл fiat в речи о небе и земле
  choice: «Да будут сотворены»
  alternative: «Да возникнут»
  rationale: Формулировка сохраняет связь с актом творения, но не уточняет способ или материал сотворения сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Местоимения, обращённые к Богу, даны с прописной буквы согласно распространённой русской издательской практике; архаичные формы и чрезмерная церковнославянизация избегаются.
