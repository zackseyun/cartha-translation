  yaml_path: translation/extra_canonical/2_esdras/006/053.yaml
  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: ru
  text: А в шестой день Ты повелел земле произвести пред Тобою скот, зверей и пресмыкающихся;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iumenta
  choice: скот
  rationale: В ряду наземных животных латинское слово обозначает домашних, преимущественно крупных или тягловых животных; «скот» естественно передаёт эту категорию и отличает её от диких зверей.
- source_word: bestias
  choice: зверей
  rationale: Прямое и стилистически уместное обозначение диких животных, противопоставленных скоту.
- source_word: reptilia
  choice: пресмыкающихся
  rationale: Традиционный библейский и понятный современному читателю термин для ползающих существ; сохраняет категориальность исходного текста.
- source_word: crearet
  choice: произвести
  rationale: С землёй в роли исполнителя «произвести» звучит по-русски естественнее буквального «сотворить», не ослабляя представления о возникновении существ по Божьему повелению.
- source_word: coram te
  choice: пред Тобою
  rationale: Сохраняет пространственно-реляционную формулу оригинала без её истолкования как простого «для Тебя».
theological_decisions:
- issue: Земля как грамматический субъект создания животных
  choice: «Ты повелел земле произвести»
  alternative: «по Твоему повелению земля произвела»
  rationale: 'Выбранная конструкция близко сохраняет последовательность и причинность латинского текста: Бог повелевает, а земля производит.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Прописные местоимения «Ты», «Тобою» обозначают обращение к Богу. Сохранено продолжение периода точкой с запятой.
