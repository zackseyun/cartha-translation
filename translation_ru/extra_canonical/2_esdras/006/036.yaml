  yaml_path: translation/extra_canonical/2_esdras/006/036.yaml
  text: And it happened on the eighth night that my heart was troubled again within me, and I began to speak before the Most High.
translation:
  language: ru
  text: 'И случилось в восьмую ночь: сердце моё снова смутилось во мне, и я начал говорить пред Всевышним.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in octava nocte
  choice: в восьмую ночь
  rationale: Прямо передаёт временное указание латинского текста и естественно звучит по-русски.
- source_word: cor meum iterato turbabatur in me
  choice: сердце моё снова смутилось во мне
  rationale: Сохраняет повторность iterato, внутреннюю локализацию in me и образ сердца как средоточия переживаний; «смутилось» передаёт состояние тревоги и волнения без излишнего уточнения.
- source_word: coram Altissimo
  choice: пред Всевышним
  rationale: «Пред» соответствует coram («перед, в присутствии») и поддерживает достойный библейский регистр; Altissimus традиционно и точно передано как «Всевышний».
