  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
translation:
  language: ru
  text: Я укрыл вас листьями деревьев. Я разделил между вами плодородные земли[a], изгнал от вас хананеев, ферезеев и филистимлян. Что Мне сделать?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В латинском тексте: «Я разделил вам плодородные земли». Это сжатое выражение может подразумевать распределение земли между коленами Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: folia arborum uos texi
  choice: Я укрывал вас листвой деревьев
  rationale: Прямо передаёт латинский образ, не пытаясь уточнить не названное в тексте историческое событие.
- source_word: Diuisi uobis terras pingues
  choice: Я разделил между вами плодородные земли
  rationale: Diuisi передано как «разделил», uobis — естественным русским «между вами», а terras pingues — как «плодородные земли».
- source_word: a facie uestra proieci
  choice: прогнал от вас
  rationale: Естественная русская передача буквального «изгнал от вашего лица», сохраняющая пространственный смысл удаления врагов.
- source_word: quid faciam
  choice: Что Мне ещё сделать для вас?
  rationale: В данном риторическом контексте «ещё» естественно выражает подразумеваемый смысл после перечисления уже совершённых благодеяний, хотя в латинском отдельного слова «ещё» нет.
theological_decisions:
- issue: Риторический вопрос quid faciam
  choice: Что Мне ещё сделать для вас?
  alternative: Что Мне сделать для вас?
  rationale: Выбрана контекстуально естественная формулировка без догматического уточнения; подразумеваемое «ещё» связывает вопрос с предшествующим перечислением Божьих деяний.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены последовательность действий и образность латинского текста; этноним Ferezeos передан традиционным русским библейским названием «ферезеи».
