revisions:
- from: 'Ваши дома Я отдам народу, который придёт[a]: не слыша Меня, они верят; Я не показывал им знамений, но они исполнят то, что Я повелел.'
  to: Ваши дома Я отдам народу, который придёт[a], который, не слыша Меня, верит Мне и которому Я не показал знамений; он исполнит то, что Я повелел.
  rationale: Добавлено «Мне», чтобы передать me credunt; «не показывал» заменено на «не показал» для соответствия перфекту ostendi. Единственное число в «верит» и «исполнит» согласуется с собирательным «народу» и позволяет избежать неясного перехода к «они». Сохранены настоящее время веры, будущее время послушания и осторожная сноска к uenienti.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная структура и временной контраст переданы верно: credunt — настоящее («верят»), facient — будущее («исполнят»). Однако латинское me credunt требует явного дополнения в русском: «верят Мне»; вариант «они верят» оставляет существенное управление непереданным. Non ostendi — совершенное действие («Я не показал»), а не длительное «не показывал».'
  naturalness: Фраза с двоеточием и отдельным «они верят» звучит несколько расчленённо и допускает неясность, кому именно они верят. Относительные придаточные позволяют сохранить ход латинской фразы и современную литературную естественность.
  terminology: «Знамения» и «исполнят то, что Я повелел» уместны и сохраняют библейский регистр. Написание божественных местоимений с прописной буквы последовательно. Примечание к uenienti обоснованно сохраняет допустимую временную неоднозначность.
  issues:
  - severity: medium
    issue: Не передано дополнение при credunt.
    rationale: В qui me non audientes credunt местоимение me является значимым дополнением при credunt. Русское «они верят» не выражает, что приходящий народ верит говорящему Богу.
  - severity: low
    issue: Вид глагола «не показывал» ослабляет значение non ostendi.
    rationale: Ostendi — перфект активного залога, поэтому «Я не показал им знамений» точнее передаёт отрицание совершившегося показа.
  revised_text: Ваши дома Я отдам народу, который придёт[a], который, не слыша Меня, верит Мне и которому Я не показал знамений; он исполнит то, что Я повелел.
  revised_footnotes:
  - marker: a
    text: 'Или: «народу, который приходит».'
    reason: Латинское причастие uenienti допускает передачу как разворачивающегося прихода, хотя контекстуально естественно и будущее значение.
  revision_rationale: Добавлено «Мне», чтобы передать me credunt; «не показывал» заменено на «не показал» для соответствия перфекту ostendi. Единственное число в «верит» и «исполнит» согласуется с собирательным «народу» и позволяет избежать неясного перехода к «они». Сохранены настоящее время веры, будущее время послушания и осторожная сноска к uenienti.
