  text: domus uestras populo uenienti, qui me non audientes credunt ; quibus signa non ostendi, facient quae praecepi. Prophetas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: ru
  text: Ваши дома Я отдам народу, который придёт[a], который, не слыша Меня, верит Мне и которому Я не показал знамений; он исполнит то, что Я повелел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народу, который приходит».'
    reason: Латинское причастие uenienti допускает передачу как разворачивающегося прихода, хотя контекстуально естественно и будущее значение.
lexical_decisions:
- source_word: domus uestras
  choice: ваши дома
  rationale: Прямо передаёт винительный падеж множественного числа и сохраняет конкретный образ.
- source_word: populo uenienti
  choice: народу, который придёт
  rationale: Естественно передаёт причастие uenienti с направленностью предстоящего прихода.
- source_word: qui me non audientes credunt
  choice: не слыша Меня, они верят
  rationale: Сохраняет одновременность настоящего причастия audientes и настоящего времени credunt, не превращая веру в будущее действие.
- source_word: signa
  choice: знамений
  rationale: Обычный библейский эквивалент для signa, обозначающий сверхъестественные подтверждающие знаки.
- source_word: facient quae praecepi
  choice: они исполнят то, что Я повелел
  rationale: Передаёт будущее facient и завершённое praecepi, сохраняя контраст между нынешней верой и будущим послушанием.
theological_decisions:
- issue: Соотношение слышания и веры
  choice: не слыша Меня, они верят
  alternative: хотя они не слышали Меня, они поверят
  rationale: 'Выбранный вариант следует латинской грамматике: audientes — настоящее причастие, credunt — настоящее время. Он не устраняет напряжение между верой без слышания и последующим исполнением повеления.'
- issue: Время будущего послушания
  choice: они исполнят
  alternative: они исполняют
  rationale: Будущее время facient должно быть явно сохранено в отличие от настоящего credunt.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимения, относящиеся к говорящему Богу, написаны с прописной буквы. Пунктуация подчёркивает переход от передачи домов к характеристике приходящего народа.
