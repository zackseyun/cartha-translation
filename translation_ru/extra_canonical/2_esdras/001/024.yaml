  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: ru
  text: Что Мне сделать с тобой, Иаков? Ты не захотел слушаться Меня, Иуда. Я перейду к другим народам и дам им Моё имя, чтобы они соблюдали Мои установления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: Что Мне сделать с тобой
  rationale: Передаёт обращённый к адресату вопрос естественным современным русским языком, сохраняя открытый характер латинской формулы.
- source_word: noluisti me obaudire
  choice: Ты не захотел слушаться Меня
  rationale: Noluisti выражает именно нежелание, а obaudire — послушание, поэтому перевод сохраняет волевой оттенок исходного текста.
- source_word: transferam me ad alias gentes
  choice: Я обращусь к другим народам
  rationale: Буквально конструкция означает перемещение или обращение к другим народам; выбранная формулировка естественна по-русски и не добавляет идеи окончательного отвержения.
- source_word: dabo eis nomen meum
  choice: дам им Моё имя
  rationale: Сохранён прямой образ передачи Божьего имени без истолковывающей конкретизации.
- source_word: legitima mea
  choice: Мои установления
  rationale: Legitima обозначает предписанные нормы или постановления; «установления» сохраняет юридико-заветный оттенок и звучит понятно современному читателю.
theological_decisions:
- issue: Отношение обозначений «Иаков» и «Иуда»
  choice: Сохранить оба обращения без поясняющего отождествления
  alternative: Объединить их как одно обращение к Израилю либо пояснить их взаимосвязь
  rationale: Латинский текст последовательно употребляет Iacob и Iuda; перевод сохраняет эту риторическую смену и не устраняет возможное напряжение.
- issue: Смысл передачи Божьего имени другим народам
  choice: 'Перевести буквально: «дам им Моё имя»'
  alternative: Истолковать как «они будут называться Моим именем» или «Я открою им Себя»
  rationale: Источник не разъясняет точный смысл выражения, поэтому подлинная богословская многозначность сохраняется.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием; синтаксис ясен обычному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской издательской традиции.
