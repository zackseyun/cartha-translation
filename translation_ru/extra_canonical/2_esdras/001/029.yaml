id: 2ES.1.29
reference: 2 Esdras 1:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: ru
  text: чтобы вы были Моим народом, Я — вашим Богом, вы — Моими сыновьями[a], а Я — вашим Отцом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детьми».'
    reason: Латинское filios буквально означает «сыновьями», но в некоторых контекстах форма мужского рода может охватывать детей в целом.
lexical_decisions:
- source_word: in populum
  choice: Моим народом
  rationale: 'Латинская конструкция esse alicui in aliquid передаёт вступление в отношение или статус; по-русски естественно и точно: «быть Моим народом».'
- source_word: in deum
  choice: вашим Богом
  rationale: Сохранена взаимная формула заветных отношений без тяжеловесного буквального воспроизведения предлога in.
- source_word: in filios
  choice: Моими сыновьями
  rationale: Filios — форма мужского рода «сыновья»; такой перевод сохраняет прямую связь с образом Отца и лексическую перекличку с предыдущим стихом.
- source_word: in patrem
  choice: вашим Отцом
  rationale: Передано как «вашим Отцом», что естественно по-русски и сохраняет параллелизм «сыновья — Отец».
theological_decisions:
- issue: Может ли filios обозначать детей вообще
  choice: сыновьями
  alternative: детьми
  rationale: Основное значение filios здесь — «сыновьями», и оно поддерживает выраженную в тексте отцовско-сыновнюю образность. Возможное обобщённое употребление отмечено в сноске, а не подменяет конкретную лексику источника.
- issue: Передача взаимной формулы отношений Бога и народа
  choice: 'Сохранены четыре параллельные части: народ — Бог, сыновья — Отец'
  alternative: Свести формулу к более свободному выражению о принадлежности Богу
  rationale: Параллелизм является существенной частью смысла и риторики латинского текста; его не следует богословски упрощать.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Тире восполняют опущенную связку и сохраняют ритмический параллелизм. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией. Конечное «Ita vos» представляет начало следующего незавершённого оборота и в данный стих не включено, как и в предоставленном разграничении English POB.
