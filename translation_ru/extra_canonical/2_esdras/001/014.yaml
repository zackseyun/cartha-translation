  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: ru
  text: Я дал вам Моисея как предводителя, а Аарона — как священника. Я даровал вам свет через огненный столп и совершил среди вас великие чудеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem
  choice: предводителя
  rationale: Передаёт значение руководителя народа и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: praestiti
  choice: даровал
  rationale: Передаёт смысл «предоставил, дал» и позволяет избежать буквального повтора глагола «дал» из первой части.
- source_word: per columnam ignis
  choice: через огненный столп
  rationale: Сохраняет образ и инструментальное значение латинского предлога per.
- source_word: magna mirabilia
  choice: великие чудеса
  rationale: Естественный русский библейский эквивалент, точно передающий величие необычайных деяний.
