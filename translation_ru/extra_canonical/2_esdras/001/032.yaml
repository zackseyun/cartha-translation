  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: ru
  text: Я послал к вам Моих слуг, пророков, которых вы приняли, убили и растерзали их тела; за их кровь Я потребую ответа, говорит Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: Моих слуг — пророков
  rationale: В данном контексте pueri означает слуг или посланников, а не детей; приложение «пророков» сохранено без перестройки смысла.
- source_word: acceptos
  choice: принимали их
  rationale: Передаёт прямое значение латинского participium от accipere и сохраняет резкое противоречие между принятием пророков и последующей расправой над ними.
- source_word: laniastis corpora illorum
  choice: терзали их тела
  rationale: Глагол laniare обозначает жестокое разрывание, истязание или изувечение; «терзали» естественно и ёмко передаёт насильственный образ.
- source_word: sanguinem exquiram
  choice: за их кровь Я взыщу с вас
  rationale: Exquirere здесь выражает требование ответа за пролитую кровь. Русская формула «взыщу за кровь» сохраняет судебно-возмездный смысл и естественна для библейского регистра.
theological_decisions:
- issue: Субъект и направленность божественного взыскания за кровь пророков
  choice: «За их кровь Я взыщу с вас»
  alternative: «Их кровь Я потребую»
  rationale: Добавление «с вас» эксплицирует подразумеваемый объект взыскания из обращения ad vos и не уточняет сверх текста форму суда или возмездия.
translation_notes:
  register: 'Современный литературный русский с достоинством библейской речи. Сохранены первое лицо Бога, обращение к виновникам и напряжённое сочетание «принимали… убивали». Обрывок «Haec dicit dominus omnipotens: domus uestra de-» относится к следующему текстовому сегменту и в перевод стиха не включён.'
