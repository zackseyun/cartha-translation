revisions:
- from: Я посылал к вам Моих слуг — пророков, но вы принимали их, убивали и терзали их тела. За их кровь Я взыщу с вас, — говорит Господь.
  to: Я послал к вам Моих слуг, пророков, которых вы приняли, убили и растерзали их тела; за их кровь Я потребую ответа, говорит Господь.
  rationale: Исправлены времена и виды глаголов в соответствии с латинским перфектом, устранён отсутствующий в источнике союз «но» и снято эксплицитное «с вас». «Потребую ответа за их кровь» передаёт юридико-карательный смысл exquiram естественным современным русским языком, не уточняя способ или адресата суда.
