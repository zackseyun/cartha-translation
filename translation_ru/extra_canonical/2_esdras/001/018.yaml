  rationale: Сохраняет указательное значение istud и обычное библейское значение desertum.
- source_word: interficere nos
  choice: погубить нас
  rationale: Передаёт смысл «умертвить, привести к гибели» и естественно звучит в эмоциональном вопросе.
- source_word: seruire Aegyptiis
  choice: служить египтянам
  rationale: Прямо сохраняет значение латинского выражения без усиления до «быть рабами».
