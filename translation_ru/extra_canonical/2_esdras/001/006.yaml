source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: ru
  text: 'Ибо грехи их отцов возросли в них: ведь они забыли Меня и принесли жертвы чужим богам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peccata parentum illorum
  choice: грехи их отцов
  rationale: Передаёт родительское поколение естественным библейским выражением; «отцов» здесь уместнее буквального «родителей».
- source_word: in illis creuerunt
  choice: возросли в них
  rationale: Сохраняет необычный образ латинского текста и возможную мысль о продолжении и умножении грехов предков в потомках, не снимая неоднозначности.
- source_word: obliti enim me
  choice: ведь они забыли Меня
  rationale: «Ведь» естественно передаёт пояснительное enim; местоимение относится к людям, в которых возросли грехи.
- source_word: sacrificauerunt diis alienis
  choice: приносили жертвы чужим богам
  rationale: Точно передаёт культовое значение sacrificare и alienus в смысле богов, чуждых заветному Богу Израиля.
theological_decisions:
- issue: Соотношение грехов отцов и потомков
  choice: 'Сохранено: «грехи их отцов возросли в них»'
  alternative: «они умножили грехи своих отцов»
  rationale: Латинский текст грамматически делает «грехи» подлежащим и не формулирует напрямую личную вину как сознательное умножение; буквальный образ сохраняет напряжение между унаследованным образцом и собственной неверностью.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Заглавная буква в «Меня» обозначает речь Бога согласно русской издательской традиции; двоеточие сохраняет пояснительную связь второй части с первой.
