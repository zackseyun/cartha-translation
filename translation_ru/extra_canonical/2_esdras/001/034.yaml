  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: ru
  text: И ваши сыновья не будут иметь потомства, потому что они пренебрегли Моей заповедью среди вас и делали зло предо Мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: не будут иметь потомства
  rationale: Латинское выражение буквально означает «не произведут потомства»; по-русски естественнее и яснее передать его как «не будут иметь потомства».
- source_word: mandatum meum
  choice: Моей заповедью
  rationale: Mandatum обозначает данное Богом повеление или заповедь; «заповедь» сохраняет библейский регистр.
- source_word: uobiscum
  choice: среди вас
  rationale: Буквально «с вами»; в данном контексте выражение указывает на заповедь, присутствовавшую и действовавшую в среде адресатов, поэтому «среди вас» передаёт смысл естественнее.
- source_word: quod malum est coram me fecerunt
  choice: делали зло предо Мной
  rationale: Сохраняется традиционный библейский образ поступков, совершаемых перед Божьим лицом, без добавочного толкования.
theological_decisions:
- issue: Связь отсутствия потомства с непослушанием
  choice: Сохранена прямая причинная связь, выраженная quoniam («потому что»).
  alternative: Ослабить связь формулировкой «ведь» или представить отсутствие потомства как естественное следствие.
  rationale: Латинский текст прямо связывает это предсказание с пренебрежением заповедью и совершением зла; перевод не должен смягчать или догматически объяснять эту связь.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Форма «предо Мной» выбрана ради естественного звучания устойчивого библейского оборота. Начальное «И» сохраняет связь с предыдущим контекстом. Следующее слово Tradam относится к продолжению текста и в данный стих не включено.
