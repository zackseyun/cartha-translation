review_pass:
  verdict: revise
  source_fidelity: «Не будут иметь потомства» точно и естественно передаёт латинское creationem non facient. Причинная связь quoniam и формула «делали зло предо Мной» сохранены. Однако без явно выраженного «они» придаточное после «ваши сыновья» допустимо, но несколько менее прозрачно; местоимение также отчётливо передаёт субъект латинского neglexerunt/fecerunt. «Среди вас» следует сохранить как контекстуальную передачу vobiscum, согласующуюся с английским аудит-трейлом.
  naturalness: Текст в целом литературен и соответствует умеренно библейскому регистру. Добавление «они» улучшает синтаксическую ясность, не утяжеляя фразу.
  terminology: «Заповедь», «потомство» и «предо Мной» уместны. Почтительное написание местоимений с прописной буквы последовательно в прямой речи Бога и не создаёт конфессионального истолкования.
  issues:
