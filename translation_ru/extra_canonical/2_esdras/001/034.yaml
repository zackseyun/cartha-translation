    issue: Неявный субъект в причинном придаточном
    rationale: В исходнике формы neglexerunt и fecerunt имеют того же субъекта, что и «ваши сыновья». В русском местоимение «они» делает эту связь явной и предотвращает кратковременную синтаксическую неоднозначность.
  revised_text: И ваши сыновья не будут иметь потомства, потому что они пренебрегли Моей заповедью среди вас и делали зло предо Мной.
