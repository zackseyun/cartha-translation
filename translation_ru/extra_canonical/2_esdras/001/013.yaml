  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: ru
  text: Поистине, Я провёл вас через море и в бездорожных местах устроил для вас надёжные дороги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe ego
  choice: Ведь Я
  rationale: 'Передаёт усиленное утвердительное начало: говорящий подчёркивает, что именно он совершил названное действие, без превращения утверждения в вопрос.'
- source_word: mare traieci
  choice: провёл вас через море
  rationale: Естественно и точно передаёт перемещение адресатов через море.
- source_word: plateas
  choice: дороги
  rationale: В данном контексте латинское слово обозначает устроенные широкие пути, а не городские улицы.
- source_word: in inuia
  choice: в бездорожных местах
  rationale: Передаёт места, где нет проложенного пути, сохраняя конкретный образ.
- source_word: munitas
  choice: надёжные
  rationale: Передаёт значение укреплённых, обустроенных и безопасных дорог; в сочетании с глаголом «устроил» звучит естественно по-русски.
theological_decisions:
- issue: Связь с вводной формулой предыдущего стиха
  choice: Не добавлять «Так говорит Господь»
  alternative: '«Так говорит Господь: Я провёл вас…»'
  rationale: Латинский текст этого стиха начинается словами Nempe ego и не содержит вводной формулы; её перенос из предыдущего стиха изменил бы исходный текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис ясен обычному читателю; образ моря и дорог в бездорожье сохранён без архаизмов.
