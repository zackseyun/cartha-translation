revisions:
- from: Когда вы станете взывать ко Мне, Я не услышу вас, потому что вы запятнали свои руки кровью, и ноги ваши проворны на убийство.
  to: Когда вы будете взывать ко Мне, Я не услышу вас, потому что вы запятнали свои руки кровью, а ноги ваши спешат совершать убийства.
  rationale: Устранено невыраженное в оригинале начинательное значение, улучшена естественность русской конструкции и восстановлено множественное число «убийства», при сохранении образности, синтаксического параллелизма и силы латинского текста.
