review_pass:
  verdict: revise
  source_fidelity: 'Латинский текст передан в целом точно: сохранены обращение к Богу, будущий отказ внять, образ рук в крови и готовность ног к убийствам. Однако «станете взывать» добавляет начинательное значение, которого в inuocabitis нет, а «проворны на убийство» менее естественно по-русски и сглаживает множественное homicidia («убийства»).'
  naturalness: Пророческий регистр удачен, но «Когда вы будете взывать ко Мне» точнее и плавнее, чем «Когда вы станете взывать ко Мне». Оборот «ноги ваши спешат совершать убийства» естественен для современного литературного русского и сохраняет образ источника.
  terminology: «Взывать ко Мне», «не услышу вас» и «запятнали свои руки кровью» соответствуют библейскому регистру и не вносят богословского истолкования. Прописное «Мне» допустимо в выбранной русской библейской орфографической традиции.
  issues:
  - severity: medium
    issue: Добавлено начинательное значение в «станете взывать».
    rationale: Futurum inuocabitis означает «будете взывать/призовёте», но не специально «начнёте взывать».
  - severity: low
    issue: «Проворны на убийство» звучит не вполне естественно и передаёт homicidia единственным числом.
    rationale: Латинское inpigri sunt ad committenda homicidia характеризует ноги как поспешные, не медлящие в совершении убийств; множественное число следует сохранить.
  revised_text: Когда вы будете взывать ко Мне, Я не услышу вас, потому что вы запятнали свои руки кровью, а ноги ваши спешат совершать убийства.
