  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: ru
  text: Когда вы будете взывать ко Мне, Я не услышу вас, потому что вы запятнали свои руки кровью, а ноги ваши спешат совершать убийства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: станете взывать
  rationale: Передаёт будущее время и религиозный контекст обращения к Богу естественным современным русским выражением.
- source_word: non exaudiam
  choice: не услышу
  rationale: В контексте означает отказ внять мольбе; краткая формулировка сохраняет силу и намеренную резкость оригинала.
- source_word: maculastis
  choice: запятнали
  rationale: Сохраняет образ оскверняющего пятна, не сводя его к отвлечённой виновности.
- source_word: inpigri sunt
  choice: проворны
  rationale: Буквально указывает на деятельную расторопность, готовность без промедления совершать зло; это точнее латинского текста, чем привычное «быстры».
- source_word: ad committenda homicidia
  choice: на убийство
  rationale: Естественная русская конструкция передаёт направленность и готовность совершать убийства; собирательное единственное число звучит как характеристика поведения.
theological_decisions:
- issue: Божий отказ услышать обращение народа
  choice: Я не услышу вас
  alternative: Я не отвечу вам
  rationale: 'Сохранён антропоморфный язык источника и его напряжение: речь не о неспособности Бога слышать, а об отказе благосклонно внимать, однако перевод не подменяет исходный образ толкованием.'
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Местоимение «Мне» написано с прописной буквы согласно принятой русской библейской традиции. Параллелизм «руки… кровью / ноги… на убийство» сохранён.
