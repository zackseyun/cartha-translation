  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
translation:
  language: ru
  text: Не то чтобы вы оставили Меня, а самих себя, — говорит Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non quasi
  choice: Не Меня… а
  rationale: В данном противопоставлении оборот вводит не буквальное отрицание факта, а риторическое переосмысление его истинного объекта; естественная русская конструкция сохраняет резкий контраст.
- source_word: dereliquistis
  choice: вы оставили
  rationale: Латинский perfect передан русским прошедшим совершенного вида; это соответствует завершённому действию и сохраняет связь с контекстом.
- source_word: uos ipsos
  choice: самих себя
  rationale: 'Сохраняет усилительное ipsos и парадоксальный смысл: оставив Господа, адресаты в действительности погубили или покинули себя.'
- source_word: dicit dominus
  choice: говорит Господь
  rationale: Стандартная, ясная и dignified формула пророческой речи.
theological_decisions:
- issue: Риторическое соотношение «оставили Меня» и «оставили самих себя»
  choice: 'Передать как прямое исправляющее противопоставление: «Не Меня… а самих себя»'
  alternative: «Не то чтобы вы оставили Меня, но [вы оставили] самих себя»
  rationale: Латинское Non quasi допускает более буквальный оборот «не так, будто», однако в контексте утверждение не отрицает самого отступничества от Бога, а раскрывает его пагубный итог для людей. Выбранная форма сохраняет богословское напряжение и звучит естественно по-русски.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая формула. Заглавные буквы в «Меня» и «Господь» обозначают Бога согласно устойчивой русской библейской традиции.
