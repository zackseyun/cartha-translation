lexical_decisions:
- source_word: non uiderunt
  choice: Они не видели
  rationale: Передаёт латинскую форму буквально, не добавляя отсутствующее в данном отрывке дополнение вроде «пророков».
- source_word: memorabuntur
  choice: будут помнить
  rationale: Будущее время и значение памяти переданы прямо; в данном контексте это естественнее, чем «будут упомянуты».
- source_word: antiquitatu[m] eorum
  choice: свою древность
  rationale: Сохраняет широкий смысл antiquitas — древность, стародавние времена или наследие древности — и возвратную отнесённость eorum к подлежащему.
- source_word: Testor
  choice: Призываю в свидетели
  rationale: Передаёт юридико-торжественный оттенок латинского testor и сохраняет незавершённость фразы на границе стиха.
