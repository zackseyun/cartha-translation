source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: ru
  text: «Пойди и возвести Моему народу об их злодеяниях, а их детям — о беззакониях, которые они совершили против Меня, чтобы они рассказали об этом детям своих детей.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade
  choice: Пойди
  rationale: Прямо передаёт повелительное наклонение латинского глагола и сохраняет библейскую торжественность без архаизма.
- source_word: nuntia
  choice: возвести
  rationale: Передаёт публичное и весомое провозглашение; современно понятно и стилистически достойно.
- source_word: facinora
  choice: злодеяниях
  rationale: Латинское facinora в отрицательном контексте обозначает тяжкие дурные деяния, а не просто нейтральные поступки.
- source_word: iniquitates
  choice: беззакониях
  rationale: Сохраняет нравственно-религиозную силу iniquitates и отличает его от facinora.
- source_word: in me admiserunt
  choice: совершили против Меня
  rationale: Точно передаёт направленность проступков против Бога, выраженную сочетанием in me.
- source_word: filiis filiorum suorum
  choice: детям своих детей
  rationale: Естественный современный русский эквивалент буквального «сынам своих сыновей», то есть последующим поколениям.
theological_decisions:
- issue: Кто должен передать рассказ следующему поколению
  choice: «чтобы те рассказали» — ближайшим антецедентом сделаны дети народа
  alternative: «чтобы они рассказали» с более широкой или неясной отсылкой к народу и его детям
  rationale: Латинское nuntient грамматически допускает подразумеваемое множественное подлежащее, но ближайшее filiis eorum естественно указывает на детей; местоимение «те» делает русскую фразу ясной без добавления богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранён параллелизм «народу — детям» и различие между «злодеяниями» и «беззакониями».
