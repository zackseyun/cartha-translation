  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: ru
  text: Так Я собрал вас, как наседка собирает своих птенцов под свои крылья. Но что Мне теперь с вами делать? Я отброшу вас от лица Моего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: collegi
  choice: собрал
  rationale: Передаёт совершённое действие латинского perfectum; подразумеваемое дополнение uos восстановлено из окончания предыдущего стиха.
- source_word: ut gallina pullos suos sub alas suas
  choice: как наседка собирает своих птенцов под крылья
  rationale: Естественно воспроизводит образ заботливой птицы; повтор глагола «собирает» явно выражает подразумеваемое в сравнительном обороте действие.
- source_word: proiciam uos a facie mea
  choice: Я прогоню вас от лица Моего
  rationale: «Прогоню» передаёт отвержение и удаление, выраженные proiciam, а традиционно-библейское «от лица Моего» сохраняет образ присутствия и благоволения.
theological_decisions:
- issue: Связь Ita uos с collegi через границу стихов
  choice: Так Я собрал вас
  alternative: Я собрал вас
  rationale: Ita uos находится в конце предыдущего стиха, но синтаксически относится к collegi; «Так» сохраняет эту межстиховую связь.
- issue: Образ божественного отвержения
  choice: Я прогоню вас от лица Моего
  alternative: Я отброшу вас прочь от Моего лица
  rationale: Формулировка сохраняет напряжение между прежним собиранием и последующим отвержением, не смягчая угрозу и не добавляя доктринального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Заглавные местоимения относятся к говорящему Богу. Фрагмент «Oblationes mihi cum» относится к следующему стиху и в текст 1:30 не включён.
