  source_fidelity: 'Начало верно сохраняет межстиховую связь: латинское ita vos из предыдущего стиха относится к collegi, поэтому «Так Я собрал вас» оправдано. Сравнение передано по смыслу точно, однако suas требует явнее обозначить, что речь о крыльях наседки. Proiciam означает скорее «отброшу / извергну», чем «прогоню».'
