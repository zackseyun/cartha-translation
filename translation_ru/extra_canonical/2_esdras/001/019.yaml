  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/019.yaml
  text: in this wilderness[a]. I grieved over your groanings and gave you manna.
translation:
  language: ru
  text: в этой пустыне. Я скорбел из-за ваших стонов[a] и дал вам манну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я испытывал боль из-за ваших стонов».'
    reason: Сохраняет возможный оттенок латинского dolui — внутреннюю боль, а не только скорбь.
lexical_decisions:
- source_word: deserto hoc
  choice: в этой пустыне
  rationale: Передаёт указательное hoc и сохраняет форму продолжения предыдущего контекста, присутствующую в латинском фрагменте.
- source_word: dolui
  choice: скорбел
  rationale: Латинское doleo означает испытывать скорбь или боль; «скорбел» сохраняет эмоциональную силу оригинала и не подменяет её более узким понятием жалости.
- source_word: gemitos uestros
  choice: из-за ваших стонов
  rationale: Естественная русская конструкция, передающая gemitus как стоны и их связь с переживаемой скорбью.
- source_word: mannam
  choice: манну
  rationale: Общепринятое библейское наименование, прямо соответствующее латинскому слову.
theological_decisions:
- issue: Характер Божьей реакции на стоны народа
  choice: Я скорбел из-за ваших стонов
  alternative: Я сжалился над вами, услышав ваши стоны
  rationale: Основной текст сохраняет значение dolui — «скорбел, испытывал боль», не заменяя его идеей милости или жалости, для которой ожидалось бы иное латинское выражение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная строчная буква сохранена, поскольку латинское «deserto hoc» представляет собой окончание фразы, начатой в предыдущем стиховом контексте.
