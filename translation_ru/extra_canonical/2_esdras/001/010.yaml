lexical_decisions:
- source_word: propter eos
  choice: Ради них
  rationale: 'Передаёт причинно-благоприятный смысл латинского выражения: Бог совершил это ради Своего народа.'
- source_word: subuerti
  choice: низверг
  rationale: Сохраняет сильный образ свержения и гибели царей, оставаясь естественным для возвышенной повествовательной речи.
- source_word: pueris suis
  choice: его слугами
  rationale: В данном контексте puer может обозначать слугу или приближённого; буквальное «детьми» менее вероятно и вводило бы иной смысл.
- source_word: percussi
  choice: поразил
  rationale: Точно передаёт действие глагола percutio и сохраняет библейский регистр без ненужного уточнения способа поражения.
