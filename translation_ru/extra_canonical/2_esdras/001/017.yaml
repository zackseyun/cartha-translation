id: 2ES.1.17
reference: 2 Esdras 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: ru
  text: До сих пор вы ропщете. Где те благодеяния, которые Я оказал вам? Разве не взывали вы в пустыне, когда голодали и томились от жажды,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque
  choice: До сих пор
  rationale: Передаёт временное значение латинского выражения и связь с продолжающимся ропотом.
- source_word: murmuratis
  choice: вы ропщете
  rationale: «Роптать» естественно и точно передаёт библейский контекст недовольства и жалоб; настоящее время сохраняет форму латинского текста.
- source_word: beneficia
  choice: благодеяния
  rationale: Сохраняет значение оказанных благ и благосклонных деяний, не сводя его к абстрактной «пользе».
- source_word: praestiti uobis
  choice: Я оказал вам
  rationale: Устойчивое русское сочетание с «благодеяниями», точно выражающее совершённое дарование благ.
- source_word: proclamastis
  choice: взывали вы
  rationale: Передаёт громкий призыв без добавления отсутствующего в латинском тексте адресата «ко Мне».
- source_word: cum esuriretis et sitiretis
  choice: когда голодали и томились от жажды
  rationale: Естественная современная формулировка; для sitire выбрано идиоматическое выражение, сохраняющее силу состояния.
theological_decisions:
- issue: Адресат воззвания в пустыне
  choice: Не добавлять «ко Мне»
  alternative: «взывали ко Мне»
  rationale: Хотя контекст может подразумевать обращение к Богу, в латинском proclamastis адресат прямо не назван; сохранена исходная недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Местоимение «Я» написано с прописной буквы как речь Бога. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
