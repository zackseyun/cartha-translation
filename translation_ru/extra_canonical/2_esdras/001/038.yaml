  text: с востока — им Я дам в предводители Авраама, Исаака и Иакова,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab oriente
  choice: с востока
  rationale: Прямо передаёт исходную точку движения; фрагментарное начало сохранено в соответствии с границами предоставленного текста.
- source_word: quibus dabo
  choice: им Я дам
  rationale: Передаёт относительное местоимение в дательном падеже и глагол будущего времени; местоимение «Я» пишется с прописной буквы как речь Бога.
- source_word: ducattum
  choice: в предводители
  rationale: Контекстуально передаёт значение ducatum — руководство или предводительство — применительно к перечисленным лицам; по-русски конструкция «дать в предводители» естественнее буквального «дать руководство».
- source_word: Abraham, Isaac et Iacob
  choice: Авраама, Исаака и Иакова
  rationale: Использованы традиционные русские формы библейских имён в требуемом синтаксическом падеже.
theological_decisions:
- issue: Характер роли Авраама, Исаака и Иакова
  choice: в предводители
  alternative: руководство Авраама, Исаака и Иакова
  rationale: Формулировка сохраняет представление о данных Богом руководителях, не уточняя сверх текста, является ли их роль буквальной, эсхатологической или символической.
translation_notes:
  register: 'Современный литературный русский язык с библейской торжественностью. Начальная фрагментарность и незавершённость перечисления отражены: текст начинается со строчной буквы и завершается запятой; конечное латинское et понимается как продолжение списка за пределами данного отрывка.'
