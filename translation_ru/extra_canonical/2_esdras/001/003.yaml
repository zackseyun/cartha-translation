base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: ru
  text: сына Аарона, из колена Левия, который был пленником в земле мидян во время царствования Артаксеркса, царя персов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii Aaron
  choice: сына Аарона
  rationale: В контексте родословной filii — форма единственного числа со значением «сына», продолжающая цепочку предков Ездры; это подтверждается единственным числом qui fuit captiuus. Перевод во множественном числе «сыновья» здесь грамматически и контекстуально неверен.
- source_word: ex tribu Leui
  choice: из колена Левия
  rationale: Устойчивое и понятное библейское обозначение племенной принадлежности.
- source_word: fuit captiuus
  choice: был пленником
  rationale: Латинская связка с предикативным captiuus описывает состояние человека в плену, а не само событие его пленения.
- source_word: in regione Medorum
  choice: в земле мидян
  rationale: Regio здесь обозначает территорию; «земля мидян» естественнее для современного русского библейского повествования, чем буквальное «регион мидян».
- source_word: in regno Artaxersis
  choice: во время царствования Артаксеркса
  rationale: Временное значение оборота естественно передаётся словом «царствование»; буквальное «в царстве» могло бы ошибочно обозначать территорию.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Сохранена синтаксическая зависимость фрагмента от предшествующей родословной: начальная форма «сына» намеренно продолжает перечень предков. От ошибочного множественного числа английского консультационного слоя отказались на основании латинского контекста и согласования qui fuit.'
