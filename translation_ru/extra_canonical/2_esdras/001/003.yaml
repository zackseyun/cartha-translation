  source_fidelity: «Сына Аарона» точно передаёт форму filii как родительный падеж единственного числа в продолжающейся родословной; согласование qui fuit captiuus подтверждает единственное число. «Был пленником» верно выражает состояние, обозначенное fuit captiuus, а не акт пленения. Несмотря на английский аудиторский слой, его множественное число не согласуется с qui fuit и не должно определять русский перевод.
