  text: Nahum and Habakkuk[a], Zephaniah, Haggai, Zechariah, and Malachi[b], who is also called the angel of the Lord.”
translation:
  language: ru
  text: Наум и Аввакум, Софония, Аггей, Захария и Малахия, которого также называли ангелом Господним[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестником Господа». Имя Малахия связано со значением «мой вестник», однако латинское angelus здесь обычно означает «ангел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: angelus domini
  choice: ангелом Господним
  rationale: Латинское angelus в данном контексте естественно означает «ангел»; традиционное сочетание «ангел Господень» точно и узнаваемо передаёт domini без подмены авторского словоупотребления этимологическим значением имени Малахии.
- source_word: qui et ... uocatus est
  choice: которого также называли
  rationale: Относительное местоимение мужского рода единственного числа относится к ближайшему имени — Малахии. Русская безличная конструкция естественно передаёт латинский пассив и не уточняет, кем именно его называли.
theological_decisions:
- issue: Отождествляет ли текст Малахию с ангелом Господним
  choice: 'Сохранено прямое утверждение латинского текста: Малахию называли ангелом Господним.'
  alternative: «вестником Господа», с объяснением имени Малахии
  rationale: Перевод «вестник» мог бы ослабить или устранить отражённую в латинском тексте традицию. При этом формулировка «называли» сохраняет различие между наименованием и прямым онтологическим утверждением.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими формами имён и устойчивым выражением «ангел Господень». Синтаксис списка сохранён; начальный союз не добавлен, поскольку в предоставленном латинском тексте его нет.
