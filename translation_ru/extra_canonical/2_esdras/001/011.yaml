    rationale: Латинское interfeci выражает прямое убийство. «Убил» точнее по обычному современному употреблению и сохраняет библейскую простоту без потери регистра.
  revised_text: Я истребил перед ними все народы, а на востоке рассеял народ двух областей — Тира и Сидона — и убил всех их противников.
