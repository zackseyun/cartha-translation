id: 2ES.1.11
reference: 2 Esdras 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: ru
  text: Я истребил перед ними все народы, а на востоке рассеял народ двух областей — Тира и Сидона — и убил всех их противников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: перед ними
  rationale: Латинское выражение буквально означает «от лица их», но в данном контексте естественно передаёт устранение народов с пути Израиля, не добавляя явно отсутствующего в тексте уточнения.
- source_word: perdidi
  choice: истребил
  rationale: В контексте уничтожения народов это точнее нейтрального «погубил» и соответствует последующему interfeci.
- source_word: in oriente
  choice: на востоке
  rationale: Прямое и естественное обозначение места.
- source_word: prouinciarum duarum
  choice: двух областей
  rationale: «Области» уместнее современного административно окрашенного «провинции» и сохраняет общее территориальное значение.
- source_word: populum
  choice: народ
  rationale: Сохранено единственное число латинского текста, несмотря на последующее упоминание двух областей.
- source_word: dissipaui
  choice: рассеял
  rationale: Передаёт значение разгона или рассеяния без необоснованного усиления до полного уничтожения.
- source_word: aduersarios
  choice: противников
  rationale: Сохраняет более широкое значение, чем «враги», и не снимает возможной смысловой неоднозначности.
- source_word: interfeci
  choice: умертвил
  rationale: Точно передаёт совершённое насильственное лишение жизни и выдерживает достоинство библейского регистра.
theological_decisions:
- issue: К кому относится местоимение eorum / «их»
  choice: Сохранена местоименная отсылка без пояснения
  alternative: Явно назвать Израиль или предшествующую группу
  rationale: Сам стих не называет референта; его уточнение внесло бы толкование в основной текст.
- issue: Соотношение Тира и Сидона с «двумя областями»
  choice: Тир и Сидон оформлены как наименования двух областей
  alternative: Понимать их как два народа либо как города
  rationale: Такая пунктуация наиболее прямо следует латинскому приложению, при этом не вводит дополнительной историко-географической конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к источнику, но естественен по-русски; подлинные местоименные и географические неоднозначности не устранены толкованием.
