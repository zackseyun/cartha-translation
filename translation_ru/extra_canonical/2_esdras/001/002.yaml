  text: сын Ахии[a], сын Финееса, сын Илия, сын Амарии, сын Азии, сын Мераиофа, сын Арны, сын Озии, сын Борифа, сын Авишуи, сын Финееса, сын Елеазара,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын Авессы».'
    reason: Сохраняет отмеченный в английском аудиторском следе альтернативный вариант передачи имени (Abishai), не подменяя основное чтение Abishua в священнической родословной.
lexical_decisions:
- source_word: Achiae
  choice: Ахии
  rationale: Латинская родительная форма передана традиционной русской формой библейского имени Ахия; вариант прежнего прочтения отмечен в сноске.
- source_word: Oziae
  choice: Озии
  rationale: Форма непосредственно отражает латинское Oziae и сохраняет отличие от имени Уззий.
- source_word: Abissei
  choice: Ависуя
  rationale: В священнической родословной эта форма соответствует Ависую, предку из линии Елеазара, а не Авессе, родственнику Давида.
- source_word: filii
  choice: сын
  rationale: Повторение слова «сын» сохраняет цепную структуру латинской родословной и естественно звучит по-русски.
