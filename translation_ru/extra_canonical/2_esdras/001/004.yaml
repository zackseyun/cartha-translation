  rationale: Точно передаёт направленность откровения к говорящему.
- source_word: dicens
  choice: двоеточие
  rationale: В современном русском ввод последующей прямой речи естественно выражается двоеточием; буквальное «говоря» здесь было бы тяжеловесным.
