source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis adhuc? dicit dominus. Haec dicit dominus omnipotens: in deserto cum essetis in flumine amaro sitientes et blasphemantes nomen meum,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: ru
  text: 'Так говорит Господь Вседержитель: «В пустыне, когда вы томились от жажды у горького потока и хулили Моё имя,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus omnipotens
  choice: Господь Вседержитель
  rationale: Устойчивое и торжественное русское библейское соответствие латинскому титулу, передающее идею всевластия Бога.
- source_word: in deserto
  choice: в пустыне
  rationale: Прямое соответствие латинскому выражению с сохранением вынесенного вперёд обстоятельства места.
- source_word: in flumine amaro
  choice: у горького потока
  rationale: Предлог «у» естественно передаёт нахождение при водном потоке; «поток» в данном контексте звучит по-русски естественнее буквального «река», не устраняя образ горькой воды.
- source_word: sitientes
  choice: томились от жажды
  rationale: Передаёт состояние сильной жажды естественным современным русским выражением.
- source_word: blasphemantes nomen meum
  choice: хулили Моё имя
  rationale: Сохраняет религиозно-нравственную силу глагола blasphemare и прямой объект «Моё имя».
theological_decisions:
- issue: Передача божественного титула omnipotens
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» является общеупотребительным библейским титулом в русской традиции и не привносит конфессионально-специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок обстоятельств в основном следует латинскому оригиналу. Начальная фраза «uobis adhuc? dicit dominus» расценена как окончание предыдущего стиха согласно предоставленной разбивке и английскому консультационному слою. Стих синтаксически продолжается далее, поэтому текст заканчивается запятой.
