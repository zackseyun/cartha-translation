  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: ru
  text: Я не дал вам огня за ваши богохульства, но, бросив в воду кусок дерева, сделал поток сладким.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non ignem uobis ... dedi
  choice: Я не послал на вас огонь
  rationale: Буквально dedi означает «дал», однако в контексте кары естественное русское выражение «послал на вас огонь» передаёт направленность uobis и не создаёт впечатления благого дара.
- source_word: pro blasphemiis
  choice: за ваши богохульства
  rationale: Предлог pro здесь указывает на основание или воздаяние; «за» точно и естественно передаёт этот смысл.
- source_word: mittens lignum in aqua
  choice: бросил дерево в воду
  rationale: Латинское lignum может означать дерево или кусок древесины. «Дерево» сохраняет традиционную образность исходного повествования; причастие mittens по-русски естественно передано личной формой в последовательности действий.
- source_word: dulce feci flumen
  choice: сделал поток сладким
  rationale: Сохранена конкретная метафора dulce — «сладким», то есть пригодным для питья, без пояснительного расширения в основном тексте; flumen передано как «поток».
theological_decisions:
- issue: Связь огня с богохульствами
  choice: не послал на вас огонь за ваши богохульства
  alternative: не дал вам огня за ваши богохульства
  rationale: Фраза противопоставляет заслуженную кару милостивому чуду. «Послал на вас» ясно передаёт карательный смысл, не добавляя конкретного богословского толкования.
- issue: Образ дерева, сделавшего воду сладкой
  choice: сохранить «дерево» без истолкования
  alternative: уточнить образ как прообраз или назвать кусок древесины
  rationale: Текст прямо говорит лишь о lignum; возможное типологическое значение не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык с библейским достоинством. Синтаксис краткий и контрастный; подлинная предметность образов «огонь», «дерево», «сладкий поток» сохранена.
