    issue: «послал на вас огонь» вместо «дал вам огонь»
    rationale: Латинское dedi — «дал», а дательный uobis — «вам». Вариант «послал на вас» истолковывает огонь как специально направленную кару и отходит от лексики источника; следует сохранить глагол «дать».
  - severity: medium
    issue: «бросил дерево» для lignum
    rationale: В современном русском «дерево» обычно означает живое растение или целое дерево; lignum здесь обозначает древесину, вероятнее всего кусок дерева. Уточнение «кусок дерева» естественно передаёт предметный смысл.
