  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: ru
  text: Потому что вы оставили Меня, Я тоже оставлю вас. Когда вы попросите у Меня милости, Я вас не помилую.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: оставили / оставлю
  rationale: Повтор одного русского корня сохраняет намеренный параллелизм латинского текста и естественно передаёт отказ от верности и поддержки.
- source_word: petentibus uobis
  choice: когда вы станете просить
  rationale: Временная конструкция естественно передаёт латинский аблатив абсолютный и направленность просьбы к Богу.
- source_word: misericordiam / non miserebor
  choice: милости / не помилую
  rationale: Сохраняется лексическая связь между просьбой о милости и отказом помиловать, без добавочного богословского истолкования.
theological_decisions:
- issue: Ответное оставление Богом народа
  choice: «и Я оставлю вас»
  alternative: «и Я покину вас»
  rationale: Формулировка сохраняет прямую взаимность исходного текста — народ оставил Бога, и Бог оставит народ, — не смягчая напряжённость высказывания.
- issue: Категорический отказ в милости
  choice: «Я вас не помилую»
  alternative: «Я не проявлю к вам милости»
  rationale: Краткая форма точно передаёт non miserebor и сохраняет суровый пророческий тон.
translation_notes:
  register: Современный литературный русский язык; речь прямая, торжественная и доступная. Заглавные формы «Меня», «Я» употреблены как традиционное типографическое обозначение речи Бога.
