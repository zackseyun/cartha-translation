  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: ru
  text: 'Так говорит Господь Вседержитель: «Дом ваш опустел. Я выброшу вас, как ветер — солому».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domus vestra deserta est
  choice: Дом ваш опустел
  rationale: Передаёт состояние запустения, выраженное латинским deserta est, естественным современным русским языком; «дом» сохраняет возможный смысл как жилища, рода или сообщества.
- source_word: proiciam uos
  choice: Я разбросаю вас
  rationale: Proiciam означает «брошу, выброшу»; в сочетании с образом ветра и соломы «разбросаю» ясно и естественно передаёт насильственное рассеяние.
- source_word: sicut uentus stipulam
  choice: как ветер разбрасывает солому
  rationale: В латинском выражении опущен повтор глагола; его добавление по-русски делает сравнение прозрачным, не меняя образа. Stipula передано как «солома», то есть лёгкие сухие стебли, уносимые ветром.
- source_word: Dominus omnipotens
  choice: Господь Вседержитель
  rationale: Традиционное и понятное русское соответствие титулу omnipotens, сохраняющее смысл всеобъемлющей власти Бога.
theological_decisions:
- issue: К кому относится «дом ваш»
  choice: Сохранено буквальное и многозначное выражение «дом ваш»
  alternative: «Ваш народ» или «ваше жилище»
  rationale: Латинское domus допускает буквальный и коллективный смысл; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формула «Так говорит…» и титул «Господь Вседержитель» сохраняют библейский регистр без архаизации.
