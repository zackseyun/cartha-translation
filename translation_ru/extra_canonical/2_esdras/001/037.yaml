source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populi uenientis gratiam, cuius paruuli exultant cum laetitia, me non uidentes oculis carnalibus, sed spiritu credent quae dixi. Et nunc, pater, aspice cum gloria et uide populum uenientem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/037.yaml
  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: ru
  text: 'милость грядущего народа[a], чьи малые дети ликуют от радости: не видя Меня телесными глазами, они поверят духом в то, что Я сказал. А теперь, Отец, взгляни во славе[b] и посмотри на грядущий народ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стих начинается в сохранившемся латинском тексте словами в винительном падеже; управляющее слово в данном фрагменте отсутствует. Возможный смысл в более полном контексте: «свидетельствую о милости грядущего народа».'
    reason: textual
  - marker: b
    text: 'Или: «взгляни со славой».'
    reason: ambiguity
lexical_decisions:
- source_word: gratiam
  choice: милость
  rationale: Передаёт латинское gratia без преждевременного сведения смысла только к «благодати» или только к человеческому «благоволению»; зависимость начального винительного падежа от утраченного или предшествующего контекста сохранена как фрагментарное начало.
- source_word: populi uenientis
  choice: грядущего народа
  rationale: Формально и естественно передаёт родительный оборот и повторяется в конце стиха в соответствии с источником.
- source_word: paruuli
  choice: малые дети
  rationale: Сохраняет прямое значение «малые, дети», не превращая его без основания в переносное «смиренные» или «младенцы».
- source_word: exultant cum laetitia
  choice: ликуют от радости
  rationale: Естественное русское выражение, сохраняющее усиленный характер латинской фразы.
- source_word: oculis carnalibus
  choice: телесными глазами
  rationale: Точно передаёт противопоставление телесного зрения вере духом и звучит естественнее буквального «плотскими глазами».
- source_word: spiritu credent
  choice: поверят духом
  rationale: Сохраняет будущее время credent и инструментально-сферическое значение spiritu, не уточняя, идёт ли речь о человеческом духе или действии Духа.
- source_word: aspice cum gloria
  choice: взгляни во славе
  rationale: Близко передаёт cum gloria и оставляет открытым оттенок сопутствующей славы; возможное понимание «взгляни со славой» отмечено в сноске.
theological_decisions:
- issue: Значение spiritu
  choice: духом
  alternative: Духом
  rationale: В латинском тексте нет графического различения, позволяющего однозначно выбрать человеческий дух или Святого Духа; строчная буква сохраняет неоднозначность без навязывания доктринального прочтения.
- issue: Временная форма credent
  choice: они поверят
  alternative: они верят / веруя
  rationale: Будущее время латинского credent сохранено, хотя соседнее exultant стоит в настоящем времени; временное напряжение текста не сглажено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Обращения к Богу оформлены прописными местоимениями. Синтаксис сохраняет фрагментарное начало источника, а также смену настоящего времени на будущее.
