  yaml_path: translation/extra_canonical/2_esdras/001/012.yaml
  text: But you[a], speak to them, saying, ‘Thus says the Lord:’
translation:
  language: ru
  text: 'А ты[a] скажи им: «Так говорит Господь:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты же».'
    reason: Частица vero допускает как противительно-переходную передачу «а», так и усилительную передачу «же».
lexical_decisions:
- source_word: Tu uero
  choice: А ты
  rationale: Латинское vero здесь имеет противительный или усилительно-переходный оттенок, а не значение следствия; естественное русское соответствие — «А ты», при возможном «Ты же».
- source_word: loquere ad eos dicens
  choice: скажи им
  rationale: Сочетание «говори им, говоря» в современном русском избыточно; «скажи им» естественно передаёт повеление и ввод следующей прямой речи.
- source_word: haec dicit dominus
  choice: Так говорит Господь
  rationale: Сохранена традиционная пророческая формула и титул dominus; формула остаётся в данном стихе согласно латинскому тексту.
theological_decisions:
- issue: Граница пророческой формулы
  choice: Слова «Так говорит Господь» сохранены в стихе 1:12, а двоеточие показывает продолжение речи далее.
  alternative: Перенести формулу в следующий стих или завершить её точкой.
  rationale: Латинский источник прямо помещает haec dicit dominus в этом стихе; перенос исказил бы его синтаксис и деление текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Незакрытая кавычка и конечное двоеточие отражают начало продолжающейся далее прямой речи.
