  to: Вы ели хлеб ангелов. Когда вы страдали от жажды, разве Я не рассёк скалу, так что воды хлынули в изобилии? От зноя Я укрывал вас листвой деревьев.
  rationale: 'Исправлена передача результата рассечения скалы: «так что воды хлынули в изобилии» естественно выражает связь excidi et fluxerunt и смысл in satietate, не приписывая тексту дополнительного богословского оттенка. Удалена непереводческая производственная сноска вместе с якорем. Остальные формулировки сохранены.'
