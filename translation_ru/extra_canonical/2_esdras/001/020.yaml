  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: ru
  text: Вы ели хлеб ангелов. Когда вы страдали от жажды, разве Я не рассёк скалу, так что воды хлынули в изобилии? От зноя Я укрывал вас листвой деревьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in escam, panem angelorum manducastis
  choice: Вы ели хлеб ангелов
  rationale: 'Оборот in escam указывает на пищу, но отдельное «в пищу» в русском избыточно: значение естественно передаётся глаголом «ели».'
- source_word: cum sitiretis
  choice: когда вы страдали от жажды
  rationale: Передаёт длительное состояние, выраженное сослагательным imperfectum, и звучит естественно в современном русском.
- source_word: petram excidi
  choice: Я не рассёк скалу
  rationale: Excidere здесь означает расколоть или рассечь скалу, из которой затем хлынула вода; «рассёк» сохраняет образ и высокий, но понятный регистр.
- source_word: fluxerunt aquae in satietate
  choice: воды не потекли вдоволь
  rationale: In satietate означает достаток, насыщение, то есть воду в количестве, которого хватило напиться; «вдоволь» кратко и естественно передаёт этот смысл.
- source_word: propter aestus
  choice: От зноя
  rationale: Aestus обозначает сильный жар или зной; предлог propter выражает причину защитного действия.
- source_word: foliis arborum
  choice: листвой деревьев
  rationale: Собирательное «листва» естественнее буквального «листьями деревьев» и сохраняет конкретный образ укрытия.
theological_decisions:
- issue: Грамматический охват вопроса, введённого Nonne
  choice: 'Обе части — рассечение скалы и истечение воды — оформлены как единый риторический вопрос: «разве Я не… и … не…?»'
  alternative: Закончить вопрос после «рассёк скалу», а истечение воды передать как отдельное утверждение.
  rationale: Так сохраняются координация excidi et fluxerunt и ожидаемый утвердительный ответ на риторический вопрос, без неестественного смешения вопросительной и повествовательной конструкций.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования, без архаизмов. Обращение Бога передано местоимением «Я» с прописной буквы; множественное «вы/вас» — со строчной. Риторический вопрос выстроен естественно для русского языка.
