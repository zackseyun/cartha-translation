    issue: Неудачная передача «fluxerunt aquae in satietate»
    rationale: 'Оборот «воды не потекли вдоволь» не вполне естественен: «вдоволь» здесь неудачно соотнесено с «водами» и размывает значение изобилия. Следует передать обилие воды: «воды хлынули в изобилии».'
  - severity: low
