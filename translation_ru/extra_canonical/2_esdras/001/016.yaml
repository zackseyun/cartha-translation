  source_fidelity: '«Я дал [это] для защиты» бережно передаёт эллиптическое ad tutelam dedi, не выдумывая объект. «Там вы роптали» точно отражает illic murmurastis. «Не ликовали во имя Моё по поводу гибели ваших врагов» верно передаёт non triumphastis in nomine meo de perditione inimicorum vestrorum: ликование относится к гибели врагов, а не к победе над «гибелью». Обрыв sed adhuc сохранён без неподтверждённого продолжения.'
  naturalness: Текст звучит естественно в современном литературном русском при уместно сдержанном библейском регистре. Квадратные скобки после «дал» и многоточие в конце ясно и ненавязчиво отмечают две разные текстологические особенности.
  terminology: «Роптали» — точный и понятный библейский эквивалент murmurastis; «ликовали» удачно передаёт triumphastis в данном контексте; «во имя Моё» сохраняет смысловую широту латинского in nomine meo. «Гибель» не вносит лишних деталей в perditione.
