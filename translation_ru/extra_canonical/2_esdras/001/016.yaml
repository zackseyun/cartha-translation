source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: ru
  text: Я дал [это] для защиты[a], и там вы роптали. Вы не ликовали во имя Моё по поводу гибели ваших врагов, но всё ещё…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сохранившемся латинском тексте не указано, что именно было дано для защиты.
    reason: Сделать явным минимальное переводческое восполнение при эллиптичном ad tutelam dedi.
  - marker: b
    text: Латинский отрывок здесь обрывается на словах «но всё ещё».
    reason: Предупредить читателя, что незавершённость предложения принадлежит представленному источнику, а не является случайным пропуском перевода.
lexical_decisions:
- source_word: ad tutelam dedi
  choice: Я дал [это] для защиты
  rationale: Латинский текст буквально говорит «дал для защиты», но не называет дополнение. Вставка «это» в квадратных скобках делает фразу допустимой по-русски, не скрывая неполноту исходной формулировки.
- source_word: illic murmurastis
  choice: там вы роптали
  rationale: «Роптали» точно передаёт библейски значимое murmurare — недовольно возмущаться и жаловаться — и остаётся понятным современному читателю.
- source_word: non triumphastis
  choice: не ликовали
  rationale: Здесь triumphare с de обозначает ликование по поводу события, а не победу над самой «гибелью»; «ликовали» избегает такого ложного смысла.
- source_word: in nomine meo
  choice: во имя Моё
  rationale: 'Сохранена традиционная и семантически открытая конструкция: ликование совершается с обращением к имени Бога или на основании Его имени.'
- source_word: de perditione inimicorum uestrorum
  choice: по поводу гибели ваших врагов
  rationale: Предлог de с аблативом указывает на предмет или повод ликования. «Гибель» передаёт perditione без уточнения способа уничтожения.
- source_word: sed adhuc
  choice: но всё ещё…
  rationale: Фрагмент обрывается после наречия adhuc. Многоточие сохраняет синтаксическую незавершённость вместо добавления отсутствующего сказуемого.
theological_decisions:
- issue: Ликование во имя Бога при гибели врагов
  choice: Сохранить прямую формулировку без нравственного смягчения
  alternative: Передать как благодарность Богу за избавление от врагов
  rationale: Исходный текст действительно связывает отсутствие ликования во имя Бога с гибелью врагов; замена ликования благодарностью истолковала бы и смягчила богословское напряжение.
- issue: Неуказанный объект глагола dedi
  choice: Обозначить минимальное восполнение квадратными скобками
  alternative: Перевести «Я дал вам защиту»
  rationale: В сохранившейся латинской строке не сказано ни «вам», ни «защиту» как прямое дополнение; более гладкий вариант скрыл бы подлинную эллиптичность текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Роптали» и «во имя Моё» сохраняют узнаваемый библейский регистр, не делая синтаксис архаичным. Квадратные скобки и многоточие открыто обозначают неполноту латинского фрагмента.
