  to: А ты стряхни волосы со своей головы и обрушь на них все бедствия, потому что они не повиновались Моему закону; они — недисциплинированный народ.[a]
  rationale: Исправление сохраняет образ и судебную лексику исходника, но точнее передаёт ключевое indisciplinatus и устраняет добавочный оттенок, не выраженный латинским autem. Сноска сохраняет уместные смысловые оттенки и соответствует английскому аудиту, где основным выбран вариант «undisciplined».
