source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: ru
  text: А ты стряхни волосы со своей головы и обрушь на них все бедствия, потому что они не повиновались Моему закону; они — недисциплинированный народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ, не получивший наставления»; по смыслу также возможно: «непокорный народ».'
    reason: Латинское indisciplinatus означает отсутствие disciplina — дисциплины, обучения или наставления. В контексте неповиновения закону возможен оттенок непокорности, но он не должен заменять основное лексическое значение.
lexical_decisions:
- source_word: excute comam capitis tui
  choice: стряхни волосы со своей головы
  rationale: Передаёт конкретное символическое действие латинского excutere, сохраняя образ волос с головы, а не заменяя его более общим жестом скорби.
- source_word: omnia mala
  choice: все бедствия
  rationale: В данном контексте mala обозначает ниспосылаемые на людей несчастья или бедствия; перевод «зло» мог бы ошибочно прозвучать как призыв совершить нравственное зло.
- source_word: non obaudierunt legi meae
  choice: не повиновались Моему закону
  rationale: Латинское obaudire с дательным legi выражает послушание закону; «повиновались» естественно передаёт этот смысл.
- source_word: populus autem indisciplinatus
  choice: ведь это народ, не знающий порядка
  rationale: Сохраняет значение отсутствия disciplina — порядка, воспитания и наставления — и звучит естественнее современного буквального «недисциплинированный народ».
theological_decisions:
- issue: Значение mala как нравственного зла или постигших людей бедствий
  choice: бедствия
  alternative: зло
  rationale: Контекст символического провозглашения суда указывает на несчастья, которые должны постигнуть непослушный народ, без приписывания говорящему повеления творить нравственное зло.
- issue: Характеристика народа словом indisciplinatus
  choice: не знающий порядка
  alternative: мятежный
  rationale: Выбранный вариант сохраняет специфическую связь с отсутствием disciplina и не сводит выражение к более общему понятию мятежности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Прописное «Моему» обозначает речь Бога по русской издательской традиции; синтаксис сохраняет резкий переход от символического действия к обвинению народа.
