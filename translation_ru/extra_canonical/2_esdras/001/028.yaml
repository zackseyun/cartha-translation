source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: ru
  text: 'Так говорит Господь Вседержитель: разве Я не умолял вас, как отец — сыновей, как мать — дочерей и как кормилица — своих малых детей?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве Я не просил вас, как отец просит сыновей, как мать — дочерей и как кормилица — своих малых детей?»'
    reason: Отмечает более нейтральное возможное значение латинского rogavi и развёртывает подразумеваемый глагол во всех трёх параллельных сравнениях.
lexical_decisions:
- source_word: dominus omnipotens
  choice: Господь Вседержитель
  rationale: Традиционное и понятное русское соответствие, сохраняющее титул и значение всемогущества.
- source_word: rogaui
  choice: умолял
  rationale: Передаёт совершенную форму и эмоционально сильное значение rogo — настойчиво просить, упрашивать, — уместное в контексте обращения родителя к детям.
- source_word: nutrix
  choice: кормилица
  rationale: Точное обозначение женщины, которая кормит грудью и заботится о малых детях; сохраняет отдельный матерински-заботливый образ.
- source_word: paruulos suos
  choice: своих младенцев
  rationale: В сочетании с nutrix речь естественно идёт о вверенных ей малых детях; «младенцев» сохраняет образ особой беспомощности и заботы.
theological_decisions:
- issue: Родительские образы Бога
  choice: Сохранены параллельные сравнения с отцом, матерью и кормилицей без поясняющего истолкования.
  alternative: Свести их к общему образу родительской заботы.
  rationale: Латинский текст намеренно сочетает три образа; их следует сохранить, не устраняя богословское напряжение и образное богатство.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Тире в сравнениях естественно восполняет опущенный в латинском повтор глагола. Знак сноски поставлен после всего предложения, к которому относится лексическая альтернатива.
