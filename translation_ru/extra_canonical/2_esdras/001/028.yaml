revisions:
- from: 'Так говорит Господь Вседержитель: разве Я не умолял вас, как отец — сыновей, как мать — дочерей и как кормилица — своих младенцев?[a]'
  to: 'Так говорит Господь Вседержитель: разве Я не умолял вас, как отец — сыновей, как мать — дочерей и как кормилица — своих малых детей?[a]'
  rationale: Исправлены только возрастной оттенок paruulos и полнота сноски. Риторическая форма, высокий, но современный регистр и образный параллелизм латинского текста сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:09Z'
review_pass:
  verdict: revise
  source_fidelity: Латинское nonne ego vos rogavi точно передано риторическим вопросом с «Я» и глаголом «умолял», который уместно сохраняет настойчиво-просительный оттенок rogavi. Три сопоставления — отец/сыновья, мать/дочери, кормилица/малые дети — сохранены; «кормилица» корректно передаёт nutrix. «Младенцы» возможно, но несколько уже латинского paruuli («малые дети»).
  naturalness: Основной текст литературен и естественен для современного библейского русского. Однако сноска развёртывает только первое из трёх параллельных сравнений, хотя альтернативное значение rogavi относится ко всему высказыванию; это создаёт неполную и не вполне точную привязку примечания.
  terminology: «Господь Вседержитель» — устоявшееся и точное соответствие dominus omnipotens. «Умолял» удачно передаёт усиленный просительный смысл rogo; «просил» следует оставить лишь как отмеченную более нейтральную альтернативу. «Малые дети» точнее по возрастному охвату для paruulos, чем «младенцы».
  issues:
  - severity: low
    issue: Сноска неполно воспроизводит параллельные сравнения.
    rationale: Альтернативное «просил» относится к rogavi во всей фразе, а не только к сравнению с отцом. Полная формулировка устраняет впечатление, будто латинский текст обрывается после первого образа.
  - severity: low
    issue: «Младенцев» несколько сужает значение paruulos.
    rationale: Paruulos обозначает малых, маленьких детей и не обязательно грудных младенцев. «Малых детей» сохраняет образ заботы кормилицы без ненужного возрастного сужения.
