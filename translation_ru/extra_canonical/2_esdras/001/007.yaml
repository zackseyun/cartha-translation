  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: ru
  text: Не Я ли вывел их из земли Египетской, из дома рабства? Но они прогневили Меня и презрели Мои советы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxi
  choice: вывел
  rationale: Точно передаёт действие избавления и сохраняет узнаваемую библейскую формулировку исхода из Египта.
- source_word: domo seruitutis
  choice: из дома рабства
  rationale: Формально и образно воспроизводит латинское выражение, не заменяя его пояснительным пересказом.
- source_word: irritauerunt me
  choice: прогневили Меня
  rationale: В контексте отношения народа к Богу естественно передаёт значение «вызвали гнев, раздражили» и сохраняет сильную нравственно-богословскую окраску.
- source_word: consilia mea
  choice: Мои наставления
  rationale: Consilia может означать советы, замыслы или установления; здесь «наставления» естественно обозначает данное Богом руководство, не внося узкоконфессионального смысла.
- source_word: spreuerunt
  choice: отвергли
  rationale: Передаёт сознательное пренебрежение и отказ следовать Божьим наставлениям; по-русски в данном сочетании звучит естественнее буквального «презрели».
theological_decisions:
- issue: Смысл consilia mea
  choice: Мои наставления
  alternative: Мои советы / Мои замыслы
  rationale: Контекст описывает непослушание Израиля после исхода. «Наставления» сохраняет смысл Божьего руководства, не утверждая, что речь исключительно о тайных замыслах или лишь о необязательных советах.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Риторический вопрос и противопоставление сохранены; местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
