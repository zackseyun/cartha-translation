id: 2ES.1.15
reference: 2 Esdras 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis. uos autem mei obliti estis, dicit dominus. Haec dicit dominus omnipotens: coturnix uobis in signo fuit, castra uobis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: ru
  text: 'Но вы забыли Меня, — говорит Господь. Так говорит Господь Вседержитель: перепел был для вас знамением, и стан[a] был для вас'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское castra имеет форму множественного числа, но обычно означает один лагерь или стан.
    reason: Поясняет расхождение между грамматическим числом латинской формы и русским переводом в единственном числе.
lexical_decisions:
- source_word: mei obliti estis
  choice: вы забыли Меня
  rationale: Прямо передаёт латинскую конструкцию с родительным местоимения при глаголе забвения; современно и естественно по-русски.
- source_word: dominus omnipotens
  choice: Господь Вседержитель
  rationale: Традиционное и понятное соответствие латинскому титулу omnipotens без конфессионального уточнения.
- source_word: coturnix
  choice: перепел
  rationale: Сохраняет единственное число латинского текста; слово может обозначать птицу как знамение, не подменяя форму источника множественным числом по знакомому библейскому сюжету.
- source_word: in signo fuit
  choice: был для вас знамением
  rationale: Естественно передаёт предикативное in signo и сохраняет смысл знака.
- source_word: castra
  choice: стан
  rationale: Castra формально множественного числа, но является pluralia tantum и обычно обозначает один лагерь или стан; «стан» уместен в контексте странствования народа.
- source_word: uobis
  choice: был для вас
  rationale: Сохраняет краткую и неоднозначную дательную конструкцию; не добавляет отсутствующих в источнике значений «Я дал» или «для защиты».
theological_decisions:
- issue: Значение castra uobis
  choice: стан был для вас
  alternative: Я дал вам стан для защиты
  rationale: Латинский текст не содержит ни глагола «дал», ни выражения «для защиты». Выбранный вариант сохраняет незавершённость и смысловую открытость исходного фрагмента.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис оставлен незавершённым в соответствии с границей предоставленного латинского фрагмента; никаких поясняющих слов, отсутствующих в источнике, не добавлено.
