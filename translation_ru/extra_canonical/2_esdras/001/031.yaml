  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: ru
  text: Когда вы принесёте дары[a], Я отверну от вас Моё лицо, потому что Я отверг ваши праздники, новомесячия и обрезания плоти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эта глава относится к более позднему христианскому слою, который часто называют 5-й книгой Ездры. Отвержение «праздников, новомесячий и обрезаний плоти» отражает полемический голос этого слоя; его не следует смешивать с богословием иудейского апокалипсиса в главах 3–14.
    reason: compositional_layer
lexical_decisions:
- source_word: obtulleritis
  choice: принесёте дары
  rationale: Латинская форма передаёт принесение или поднесение чего-либо; дополнение «дары» естественно в культовом контексте, хотя в очищенном фрагменте прямое дополнение отсутствует.
- source_word: auertam faciem meam a uobis
  choice: Я отверну от вас Моё лицо
  rationale: Сохраняет телесную метафору и направленность латинского выражения, не заменяя её более толковательным «отвергну вас».
- source_word: dies enim festos uestros
  choice: потому что Я отверг ваши праздники
  rationale: «Праздники» естественно и точно передаёт культовые праздничные дни; союз enim выражен причинным «потому что».
- source_word: neomenias
  choice: новомесячия
  rationale: Традиционный и точный русский термин для празднований начала нового месяца.
- source_word: circumcisiones carnis
  choice: обрезания плоти
  rationale: Буквально сохраняет множественное число и полемическое уточнение «плоти», не сводя выражение к отвлечённому понятию.
- source_word: repudiavi
  choice: Я отверг
  rationale: Передаёт решительное отвержение перечисленных обрядов без усиления до «возненавидел».
theological_decisions:
- issue: Отвержение праздников, новомесячий и обрезаний
  choice: Сохранить прямую полемическую формулировку текста и пояснить её композиционный слой в сноске.
  alternative: Согласовать высказывание с богословием иудейского апокалипсиса в главах 3–14 или представить его универсальным осуждением любых обрядов.
  rationale: Данное место относится к поздней христианской части произведения; перевод не должен ни смягчать её голос, ни приписывать его всему корпусу 2 Ездры.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской образности. Заглавные местоимения в речи Бога поддерживают достоинство регистра. Сноска привязана к добавленному по контексту слову «дары», как в консультационном английском тексте; она поясняет композиционную принадлежность всего стиха.
