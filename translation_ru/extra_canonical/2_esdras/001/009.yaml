  text: До каких пор Мне терпеть тех, кому Я даровал столь великие благодеяния?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vsquequo
  choice: До каких пор
  rationale: Естественно передаёт временной вопрос с оттенком предела терпения.
- source_word: sustinebo
  choice: Мне терпеть
  rationale: Сохраняет значение продолжительного вынесения или терпения, заложенное в латинском sustinere.
- source_word: tanta beneficia contuli
  choice: Я даровал столь великие благодеяния
  rationale: Beneficia означает оказанные блага или благодеяния; «даровал» достойно и естественно передаёт contuli в данном контексте.
theological_decisions:
- issue: Отношение Божьих даров к неблагодарности адресатов
  choice: Сохранено прямое противопоставление Божьего терпения и дарованных благодеяний
  alternative: Уточнить как «милости» или «благословения»
  rationale: Латинское beneficia шире конфессионально окрашенных терминов и не требует дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской интонацией. Заглавные местоимения «Мне», «Я» обозначают говорящего Бога по принятой русской библейской традиции.
