revisions:
- from: Но он[37], Мой Сын, обличит нечестие пришедших народов — всё то, что надвинулось, словно буря, — и станет укорять их в лицо за их злые помыслы и мучения[a].
  to: Но Он[37], Сын Мой, обличит нечестия пришедших народов — те, что приблизились к буре, — и поставит им в укор их злые помыслы и мучения[a].
  rationale: Редакция исправляет падежно-смысловую передачу tempestati и восстанавливает связь has с impietates, не пытаясь объяснить трудный образ «приблизились к буре». Оборот «поставит им в укор» передаёт обвинительную силу inproperabit и синтаксически позволяет сохранить в качестве предмета укора «злые помыслы и мучения», не уточняя природу мучений. Английская контрольная версия расходится с латинским в образе бури; приоритет отдан исходному тексту.
  reviewer_model: gpt-5.6-terra
