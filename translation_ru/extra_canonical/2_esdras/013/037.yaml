  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: ru
  text: Но Он[37], Сын Мой, обличит нечестия пришедших народов — те, что приблизились к буре, — и поставит им в укор их злые помыслы и мучения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: '37'
    text: В истолковании соединяются образы «горы Сион» и горы, «высеченной без рук». Этот образ намеренно напоминает о святом месте, созданном или явленном Богом, а не об обычной горе, обработанной человеческими руками.
    reason: cross_reference
  - marker: a
    text: 'Или: «упрекнёт их перед ними за их злые помыслы и мучения».'
    reason: previous_rendering
lexical_decisions:
- source_word: arguet
  choice: обличит
  rationale: Передаёт судебно-обвинительный оттенок латинского arguere и естественно сочетается с «нечестием».
- source_word: impietates eorum
  choice: нечестие … народов
  rationale: Русское собирательное единственное число звучит естественнее буквального «нечестия», сохраняя смысл безбожных и неправедных деяний.
- source_word: quae aduenerunt gentes
  choice: пришедших народов
  rationale: Сохраняет определение народов как уже пришедших, не уточняя цель или место их прихода, которых латинский текст не называет.
- source_word: has quae tempestati adpropiauerunt
  choice: всё то, что надвинулось, словно буря
  rationale: Следует образу стремительно приблизившейся бури и сохраняет несколько неровную связь фразы с предшествующим «нечестием».
- source_word: inproperabit coram eis
  choice: станет укорять их в лицо
  rationale: Передаёт обвинительную силу inproperabit и публично-прямой оттенок coram eis; простое «представит перед ними» было бы слабее исходника.
- source_word: mala cogitamenta eorum et cruciamenta
  choice: их злые помыслы и мучения
  rationale: Сохраняет координацию двух винительных дополнений и не добавляет к «мучениям» притяжательного определения, отсутствующего непосредственно при cruciamenta.
theological_decisions:
- issue: Обозначение мессианской фигуры
  choice: Мой Сын
  alternative: сын Мой
  rationale: Сохранено прямое filius meus и его титульная значимость; прописная буква соответствует ясной референции к Божьему Сыну в контексте, не вводя дополнительного догматического толкования.
- issue: К чему относятся «мучения»
  choice: оставлено как «их злые помыслы и мучения» без пояснения
  alternative: «мучения, которые они причиняли» или «уготованные им мучения»
  rationale: Латинский текст не определяет однозначно, кем причиняются и кому принадлежат cruciamenta, поэтому богословски значимая неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Пунктуация помогает прояснить сложный латинский синтаксис, не устраняя его смысловой напряжённости; финальная запятая исходного фрагмента не воспроизводится как случайно оборванная пунктуация.
