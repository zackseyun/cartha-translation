  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
translation:
  language: ru
  text: понимающие то, что сбережено на последние дни, и не встретившиеся с этим[a]. Но также те, кто оставлен
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не достигшие этого».'
    reason: Латинское occurrentes допускает значение встречи, тогда как в данном контексте возможно также значение достижения; местоимение eis относится к тому, что сбережено.
lexical_decisions:
- source_word: reposita
  choice: уготовано
  rationale: Передаёт смысл чего-то заранее отложенного или предназначенного, сохраняя торжественный эсхатологический оттенок.
- source_word: in novissimis diebus
  choice: для последних дней
  rationale: В данном сочетании естественно выражает предназначенность уготованного к последним дням; буквальное «в последние дни» также возможно, но может ошибочно указывать лишь на время хранения.
- source_word: non occurrentes eis
  choice: не столкнувшиеся с этим
  rationale: Передаёт основной смысл occurrere как встречи или столкновения; местоимение соотнесено со всем тем, что уготовано. Возможный смысл достижения вынесен в примечание.
- source_word: derelicti sunt
  choice: оставлен
  rationale: Сохраняет пассивную форму и незавершённость исходного фрагмента, не добавляя отсутствующих в тексте уточнений вроде «в живых».
theological_decisions:
- issue: Характер уготованного в последние дни
  choice: Не уточнять, идёт ли речь о событиях, бедствиях или благах
  alternative: «понимающие, какие события уготованы»
  rationale: Латинское quae имеет широкое значение «то, что»; конкретизация как событий или бедствий необоснованно снимает смысловую открытость.
- issue: Значение occurrentes
  choice: 'Основной текст: «столкнувшиеся»'
  alternative: «достигшие»
  rationale: Латинское occurrere допускает идею встречи или столкновения, тогда как сравнительная версия может поддерживать значение достижения; неоднозначность сохранена примечанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксическая незавершённость сохранена, поскольку стих является частью продолжающегося предложения.
