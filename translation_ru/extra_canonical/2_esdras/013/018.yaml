  source_fidelity: 'В основном передана фрагментарная синтаксическая структура, однако in novissimis diebus следует передать как «на последние дни», а не «для последних дней»: речь о том, что сохранено/отложено к этому времени. Союз et в данном месте не имеет противительного значения «но». Основное «столкнувшиеся с этим» излишне конкретизирует occurrentes как конфликтное столкновение; более нейтральное «встретившиеся с этим» сохраняет значение встречи, при этом вариант «достигшие» уместно оставить в примечании.'
