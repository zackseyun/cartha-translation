  yaml_path: translation/extra_canonical/2_esdras/013/027.yaml
  text: And because you saw breath and fire and storm coming out from his mouth,[a]
translation:
  language: ru
  text: А поскольку ты видел, как из его уст исходило нечто подобное дыханию, огню и буре,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто подобное духу, огню и буре»; возможен также перевод: «ветру, огню и буре».'
    reason: Латинское spiritus может означать «дыхание», «дух» или «ветер».
lexical_decisions:
- source_word: quoniam
  choice: поскольку
  rationale: Передаёт причинно-пояснительную связь с последующим толкованием видения и естественно звучит по-русски.
- source_word: ut
  choice: нечто подобное
  rationale: 'Сохраняет сравнительный характер описания видения: из уст исходили явления, подобные названным стихиям.'
- source_word: spiritum
  choice: дыханию
  rationale: В контексте исходящего из уст ряда разрушительных явлений наиболее естественно значение «дыхание»; возможные значения «дух» и «ветер» отмечены в сноске.
- source_word: ignem
  choice: огню
  rationale: Прямой эквивалент латинского слова, сохраняющий образ видения.
- source_word: tempestatem
  choice: буре
  rationale: Передаёт сильное бурное атмосферное явление без неоправданного уточнения.
- source_word: de ore eius exire
  choice: из его уст исходило
  rationale: Точно сохраняет направление движения и допускает согласование с обобщающим «нечто».
theological_decisions:
- issue: Значение spiritum
  choice: дыхание
  alternative: дух или ветер
  rationale: Контекст уст и соседство с огнём и бурей указывают на исходящую силу, подобную дыханию, однако многозначность латинского слова сохранена в примечании.
- issue: Функция ut
  choice: явное сравнение — «нечто подобное»
  alternative: опустить сравнительный показатель и назвать три явления прямо
  rationale: Латинское ut существенно для языка апокалиптического видения и не должно опускаться.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Формула «нечто подобное» сохраняет образную неопределённость видения; «уста» поддерживает достойный библейский регистр без архаизации всего стиха.
