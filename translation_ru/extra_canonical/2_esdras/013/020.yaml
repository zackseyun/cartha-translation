source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'attamen facilius est periclitantem venire in haec, quam pertransire sicut nubem a saeculo et non videre quae contigerunt in novissimo. Et respondit ad me et dixit:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: ru
  text: 'Однако человеку, которому грозит опасность, легче дожить до этих событий, чем, словно облако, уйти из мира и не увидеть того, что произошло в конце»[a]. И он ответил мне и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чем, словно облако, уйти от века и не увидеть того, что произошло в последнем»; латинское выражение допускает понимание «из мира» и «в конце».'
    reason: Синтаксис pertransire sicut nubem a saeculo необычен, а saeculum и novissimum имеют широкий смысловой диапазон.
lexical_decisions:
- source_word: periclitantem
  choice: тому, кому грозит опасность
  rationale: Передаёт причастие со значением человека, находящегося в опасности, не уточняя характер этой опасности.
- source_word: venire in haec
  choice: дожить до этих событий
  rationale: Буквальное «прийти в это» по-русски неестественно; в контексте речь идёт о том, чтобы достичь времени названных событий и стать их свидетелем.
- source_word: pertransire sicut nubem a saeculo
  choice: словно облако, уйти из мира
  rationale: a saeculo естественнее понимать как отделение — «из мира», а образ облака сохранён без добавочного толкования; форма nubem в источнике синтаксически необычна.
- source_word: quae contigerunt in novissimo
  choice: того, что произошло в конце
  rationale: Сохраняет перфект contigerunt и неопределённость субстантивированного novissimo, не разворачивая его без необходимости в «последние дни».
- source_word: Et respondit ad me et dixit
  choice: 'И он ответил мне:'
  rationale: Естественная русская формула вводной речи; «и сказал» не дублируется, поскольку двоеточие уже вводит последующие слова.
theological_decisions:
- issue: Значение a saeculo
  choice: уйти из мира
  alternative: пройти через век
  rationale: Предлог a с аблативом обычно выражает удаление или отделение; такое прочтение сохраняет противопоставление между дожившим до событий человеком и ушедшим из мира до их наступления.
- issue: Значение in novissimo
  choice: в конце
  alternative: в последние дни
  rationale: Латинское выражение допускает эсхатологическое понимание, но само по себе не содержит множественного «дни»; более сдержанный перевод сохраняет исходную широту.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Неестественные латинские обороты переданы ясно, при этом образ облака и эсхатологическая неопределённость сохранены.
