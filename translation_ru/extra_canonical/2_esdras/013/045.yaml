lexical_decisions:
- source_word: dimidii
  choice: с половиной
  rationale: Форма является окончанием выражения «год с половиной» (anni et dimidii) в более полном латинском контексте стиха; по-русски естественно передаётся именно так.
- source_word: regio illa
  choice: та область / область эта
  rationale: Regio обозначает область или край; «область» точно и нейтрально передаёт географический смысл.
- source_word: uocatur
  choice: называется
  rationale: Прямое и естественное соответствие латинскому пассиву.
- source_word: Arzareth
  choice: Арзареф
  rationale: Транслитерация традиционного латинского топонима с передачей конечного th через «ф»; необычное имя сохранено без истолкования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Предоставленный латинский отрывок начинается лишь со слова dimidii («с половиной») и затем переходит к началу следующего предложения (Tunc inhabitauerunt ibi — «Тогда они поселились там»). Начало стиха восстановлено по засвидетельствованному более полному латинскому контексту, отражённому также в проверочном английском слое; слова следующего стиха в основной текст 13:45 не включены.
