  text: 'И увидел я: вот, он высек себе большую гору и полетел над нею.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi, et ecce
  choice: 'И увидел я: вот'
  rationale: Сохраняет повествовательную формулу и внезапность видения, при этом двоеточие естественно вводит увиденное в современном русском.
- source_word: sibimet ipso sculpsit
  choice: он высек себе
  rationale: «Высек» прямо передаёт sculpsit и сохраняет образ создания горы самим персонажем; «себе» отражает усиленное возвратное sibimet ipso без тяжеловесного «самому себе».
- source_word: montem magnum
  choice: огромную гору
  rationale: В контексте видения «огромную» естественно выражает исключительный масштаб, обозначенный magnum.
- source_word: volavit super eum
  choice: взлетел на неё
  rationale: Передаёт движение полётом к положению на горе; местоимение согласовано с русским словом «гора». Латинское super допускает пространственный оттенок «над», но при глаголе движения возможно направление «на».
