    issue: «Огромную» усиливает montem magnum.
    rationale: Латинское magnum — «большую/великую»; «огромную» вносит невыраженную степень исключительности.
  - severity: high
    issue: «Взлетел на неё» меняет пространственное отношение volavit super eum.
    rationale: Super eum обозначает положение над/сверху горы; русский вариант подразумевает полёт с достижением поверхности. «Полетел над нею» сохраняет исходную пространственную неоднозначность без добавления посадки.
