source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: ru
  text: И где бы ни исходил голос из его уст, все, кто слышал его голос[a], начинали гореть, как плавится воск, ощутив огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его голоса»; множественное число может обозначать звуки или отдельные речения.'
    reason: Латинский текст переходит от единственного vox к множественному voces; основной текст передаёт естественное русское словоупотребление, а примечание сохраняет особенность источника.
lexical_decisions:
- source_word: ubicumque exiebat vox de ore eius
  choice: куда бы ни исходил голос из его уст
  rationale: Передаёт пространственное значение ubicumque и образ голоса, исходящего из уст; отсутствие артикля в латинском не требует искусственной неопределённости в русском.
- source_word: ardescebant
  choice: начинали гореть
  rationale: 'Латинский ardesco — активный инхоативный глагол: «загораться, начинать гореть»; формулировка сохраняет начало действия и не превращает его в пассивное «были подожжены».'
- source_word: sicut liquescit cera quando senserit ignem
  choice: как плавится воск, ощутив огонь
  rationale: Сохраняет сравнение и необычную персонификацию воска в senserit, но звучит естественно и достойно по-русски.
