lexical_decisions:
- source_word: disposuisti
  choice: устроил
  rationale: Передаёт осознанное упорядочение и направление жизни, не сужая смысл до простого планирования.
- source_word: in sapientiam
  choice: по мудрости
  rationale: Естественно по-русски выражает мудрость как принцип, в соответствии с которым устроена жизнь.
- source_word: sensum
  choice: разум
  rationale: В данном контексте означает способность разумения и рассудительность; «разум» сохраняет персонификацию и звучит естественно.
- source_word: vocasti matrem
  choice: назвал своей матерью
  rationale: Прямо сохраняет родственный образ латинского текста.
