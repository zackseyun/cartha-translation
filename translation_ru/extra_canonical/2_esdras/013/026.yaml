source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: ru
  text: Это тот, кого Всевышний хранит уже многие века. Он сам избавит своё творение и сам направит[a] тех, кто остался[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроит»; латинское слово может обозначать устроение, приведение в порядок или руководство.'
    reason: Сохраняет смысловую широту disponet, не предлагая неестественный в данном контексте вариант «расположит».
  - marker: b
    text: 'Возможно также: «тех, кого оставили».'
    reason: Отражает возможное пассивное значение qui derelicti sunt наряду с основным пониманием «тех, кто остался».
lexical_decisions:
- source_word: conservat
  choice: хранит уже
  rationale: Латинская форма настоящего времени передаёт продолжающееся хранение; «уже» естественно связывает его с длительным периодом.
- source_word: multis temporibus
  choice: многие века
  rationale: В данном эсхатологическом контексте речь идёт о множестве длительных временных периодов; «века» звучит естественно и достойно.
- source_word: per semet ipsum
  choice: сам
  rationale: Русское усилительное «сам» ясно передаёт самостоятельность действия без тяжеловесного буквального «через самого себя».
- source_word: creaturam suam
  choice: своё творение
  rationale: Сохраняет широкий смысл латинского creatura и притяжательное отношение, не сужая его до человечества.
- source_word: disponet
  choice: направит
  rationale: Передаёт идею устроения и руководства естественным современным русским глаголом; смысловая широта латинского слова отмечена в сноске.
- source_word: qui derelicti sunt
  choice: тех, кто остался
  rationale: Сохраняет неопределённость относительно того, являются ли эти люди уцелевшими или оставленными другими.
theological_decisions:
- issue: Кто совершает избавление творения
  choice: «Он сам избавит»
  alternative: «через самого себя избавит»
  rationale: Двойное усиление ipse… per semet ipsum подчёркивает, что названный избавитель действует сам; перевод не вводит объяснений о способе или богословском механизме избавления.
- issue: Значение «оставшихся»
  choice: Не уточнять, являются ли они остатком, уцелевшими или покинутыми
  alternative: «уцелевших» либо «остаток»
  rationale: Латинское выражение допускает несколько оттенков, поэтому конфессионально или эсхатологически нагруженное уточнение было бы необоснованным.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Короткое второе предложение сохраняет повторное ударение на «сам», присутствующее в латинском тексте; точка вместо длинной цепочки придаточных делает стих яснее без изменения логических связей.
