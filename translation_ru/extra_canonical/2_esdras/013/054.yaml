lexical_decisions:
- source_word: dereliquisti enim tua
  choice: потому что ты оставил своё
  rationale: Передаёт причинное enim и субстантивированное множественное tua без добавления отсутствующего в латинском уточнения.
- source_word: circa mea vacasti
  choice: посвятил себя Моему
  rationale: Идиома vacare circa означает отдать время и внимание чему-либо; «Моему» сохраняет широкое и несколько неопределённое mea.
- source_word: legem meam exquisisti
  choice: исследовал Мой закон
  rationale: Exquirere выражает усердный поиск и тщательное изучение; «исследовал» сохраняет эту интенсивность.
