source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et visionis interpretationem dicam tibi, sed et de quibus locutus es adaperiam tibi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/021.yaml
  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: ru
  text: И я скажу тебе истолкование видения, а также разъясню тебе то, о чём ты говорил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  choice: истолкование видения
  rationale: Точно передаёт значение латинского выражения и сохраняет возвышенный библейский регистр без архаизации.
- source_word: dicam tibi
  choice: скажу тебе
  rationale: Прямое соответствие латинскому обороту; естественно звучит по-русски.
- source_word: adaperiam tibi
  choice: разъясню тебе
  rationale: В контексте речи о поднятых вопросах глагол означает раскрыть смысл, объяснить; «разъясню» передаёт это естественно и не смешивается с предшествующим «скажу».
- source_word: de quibus locutus es
  choice: то, о чём ты говорил
  rationale: Сохраняет неопределённость относительно содержания затронутых предметов и естественно передаёт латинскую конструкцию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Латинский исходный текст этого стиха не содержит вводной формулы «он ответил мне и сказал», имеющейся в английском консультационном тексте, поэтому она не включена.
