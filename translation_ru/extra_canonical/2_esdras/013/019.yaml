base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: ru
  text: 'Потому горе им: ведь они увидели великие опасности и многие бедствия, как показывают эти сны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc vae
  choice: Потому горе им
  rationale: Передаёт причинное значение propter hoc и в естественной русской форме выражает безличное латинское vae; местоимение «им» восстанавливает подразумеваемых людей по форме последующего глагола.
- source_word: viderunt
  choice: они увидели
  rationale: Сохранено перфектное прошедшее время латинского текста, без замены на будущее из английского консультационного слоя.
- source_word: pericula magna
  choice: великие опасности
  rationale: Прямое и стилистически достойное соответствие, сохраняющее порядок определения после существительного лишь в естественной русской форме.
- source_word: necessitates multas
  choice: многие бедствия
  rationale: В данном контексте necessitates означает тяжёлые обстоятельства, нужды и притеснения; «бедствия» естественно передаёт совокупный смысл, не сводя его к бытовым потребностям.
- source_word: sicut ostendunt somnia haec
  choice: как показывают эти сны
  rationale: Сохранены сравнительно-пояснительная связь и настоящее время ostendunt.
