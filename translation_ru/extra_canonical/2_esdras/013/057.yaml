  source_fidelity: Начальная часть точно передаёт латинское et profectus sum et transii in campum; «отправился и вышел в поле» сохраняет два глагола движения. «Всевышнему» верно передаёт Altissimum, а «чудеса» — mirabilibus. Однако «в своё время» привносит притяжательное значение, отсутствующее в per tempus, и чрезмерно сужает его временной смысл.
  naturalness: Текст в целом литературен и ясен. «Воздавая великую славу и хвалу» несколько тяжеловесно, но допустимо для библейского регистра. «С течением времени» естественно передаёт протяжённость, выраженную per tempus, в сочетании с imperfectum faciebat.
  terminology: «Всевышний» — устоявшийся русский библейский титул. Прописное «Он» допустимо в данном регистре. Богословски нагруженных или спорных терминов помимо титула нет.
