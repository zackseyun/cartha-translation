source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et profectus sum et transii in campum, multum glorificans et laudans Altissimum de mirabilibus, quae per tempus faciebat,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: ru
  text: И я отправился и вышел в поле, воздавая великую славу и хвалу Всевышнему за чудеса, которые Он совершал с течением времени.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum et transii in campum
  choice: я отправился и вышел в поле
  rationale: Передаёт последовательность двух латинских глаголов движения без искусственного усложнения; «вышел в поле» естественно по-русски.
- source_word: multum glorificans et laudans
  choice: воздавая великую славу и хвалу
  rationale: Сохраняет оба близких, но не полностью тождественных действия — прославление и хвалу — в достойном современном регистре.
- source_word: Altissimum
  choice: Всевышнему
  rationale: Устоявшееся библейское соответствие латинскому титулу Altissimus.
- source_word: de mirabilibus
  choice: за чудеса
  rationale: В данном контексте de обозначает основание хвалы; «чудеса» ясно и естественно передаёт mirabilia.
- source_word: quae per tempus faciebat
  choice: которые Он совершал в своё время
  rationale: «В своё время» сохраняет временное значение не вполне обычного per tempus и не привносит идеи периодичности, свойственной переводу «время от времени».
theological_decisions:
- issue: Субъект faciebat
  choice: Он — Всевышний
  alternative: 'без явного местоимения: «совершаемые в своё время»'
  rationale: Грамматическим и смысловым субъектом естественно выступает Всевышний; прописная буква соответствует русской библейской издательской традиции и не меняет содержания.
- issue: Значение per tempus
  choice: в своё время
  alternative: во времена их / с течением времени / время от времени
  rationale: Латинская формулировка допускает некоторую неоднозначность. Выбранный вариант сохраняет идею должного или определённого времени, не утверждая периодичность и не вводя неясный антецедент для «их».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; парность «славу и хвалу» сохраняет риторическую полноту оригинала.
