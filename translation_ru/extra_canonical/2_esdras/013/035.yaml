  verdict: approve
  source_fidelity: '«Желая прийти и одолеть его» точно передаёт латинское uolentes uenire et expugnare eum: намерение множественных действующих лиц сохранено, а «одолеть» уместно передаёт направленность expugnare на преодоление/победу, не сводя его к одному лишь началу нападения. «А он встанет на» верно сохраняет ipse autem stabit super и намеренную незавершённость предоставленного фрагмента.'
  naturalness: Формулировка литературна и понятна в рамках фрагмента. Деепричастное «желая» выглядит зависимым от опущенного в данном отрывке субъекта, что корректно отражает обрывок исходного предложения; искусственно дополнять субъект не следует. «А он» естественно передаёт противопоставительное autem.
  terminology: Имена и специальные богословские термины отсутствуют. Выбор «одолеть» согласуется с силой expugnare и с английской аудиторской пометой, допускающей «attack», без ненужного уточнения способа нападения. Английская сноска не требует русской сноски и не имеет русского якоря в данном тексте.
