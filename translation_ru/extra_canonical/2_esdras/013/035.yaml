lexical_decisions:
- source_word: uolentes uenire
  choice: желая прийти
  rationale: Передаёт причастную конструкцию и намерение действующих лиц, сохраняя фрагментарную связь с предшествующим контекстом.
- source_word: expugnare eum
  choice: одолеть его
  rationale: Expugnare обозначает не просто начало нападения, а стремление победить, захватить или сломить сопротивление. «Одолеть» естественно по-русски и сохраняет направленность на победу без чрезмерно конкретного образа штурма.
- source_word: Ipse autem stabit super
  choice: А он встанет на
  rationale: Сохраняет начало следующего предложения и незавершённость предоставленного латинского отрывка; ipse передано ударным «он», autem — естественным противопоставительным «а».
