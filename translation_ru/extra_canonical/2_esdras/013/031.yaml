  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: ru
  text: 'И смятение ума охватит живущих на земле. И одни против других будут замышлять войну: город против города, место против места.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: смятение ума
  rationale: Латинское выражение обозначает выход ума из обычного состояния — помрачение, растерянность или смятение. «Смятение ума» естественно по-русски и сохраняет широту смысла, не сводя его к безумию.
- source_word: ueniet ... super eos
  choice: охватит
  rationale: Передаёт наступление состояния на людей естественным современным русским оборотом.
- source_word: cogitabunt bellare
  choice: замыслят ... воевать
  rationale: Сохраняет значение намерения или обдуманного замысла начать войну.
- source_word: in alios alii
  choice: друг с другом
  rationale: Идиоматическая передача взаимной вражды; последующие пары уточняют её всеобщий характер.
- source_word: ciuitates ciuitatem et locus locum
  choice: город против города, место против места
  rationale: Сохраняет параллелизм и повтор исходного текста; первое латинское ciuitates, вероятно, представляет текстовую или грамматическую неровность, не требующую воспроизведения по-русски.
