  yaml_path: translation/extra_canonical/2_esdras/013/051.yaml
  text: 'And I said[a], “Lord Master, show me this: why did I see the man coming up from the heart of the sea?” And he said to me:'
translation:
  language: ru
  text: 'И сказал я: «Владыка Господи, покажи мне: почему я видел человека, поднимающегося из сердца моря?» И он сказал мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominator Domine
  choice: Владыка Господи
  rationale: Двойное обращение передано двумя титулами в исходном порядке; форма «Господи» естественно выражает звательный смысл в современном русском языке.
- source_word: virum
  choice: человека
  rationale: Нейтральное и понятное обозначение мужчины в данном контексте; позволяет избежать архаического русского «мужа».
- source_word: ascendentem de corde maris
  choice: поднимающегося из сердца моря
  rationale: Сохраняется образное выражение corde maris («сердце моря») и значение причастия ascendentem — движения вверх или появления из моря.
- source_word: hoc mihi ostende
  choice: покажи мне
  rationale: В русском языке объект «это» можно естественно опустить перед последующим пояснительным вопросом, не теряя смысла.
theological_decisions:
- issue: Титул Dominator Domine
  choice: Владыка Господи
  alternative: Владыка, Господь
  rationale: Обе формы поняты как единое торжественное обращение, а не как назывное утверждение; перевод не вводит конфессионально специфического истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены метафора «сердце моря» и завершающая формула, вводящая ответ в следующем стихе.
