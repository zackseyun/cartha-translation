  text: et gens ad gentem et regnum aduersus regnum. Et erit cum fient haec, et contingent signa quae ante ostendi tibi, et tunc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/032.yaml
  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
translation:
  language: ru
  text: народ против народа[a] и царство против царства. И будет, когда это произойдёт и явятся знамения, которые я прежде показал тебе, тогда...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нация против нации».'
    reason: Латинское gens может обозначать народ как этническую или политическую общность; «нация» — возможный, но более современно окрашенный вариант.
lexical_decisions:
- source_word: gens ad gentem
  choice: народ против народа
  rationale: Латинское gens обозначает народ как этническую или политическую общность; «народ против народа» сохраняет этот смысл и естественно передаёт апокалиптическую формулу по-русски.
- source_word: regnum aduersus regnum
  choice: царство против царства
  rationale: Формальное соответствие устойчивой библейской формуле; aduersus явно выражает противостояние.
- source_word: contingent signa
  choice: явятся знамения
  rationale: В данном контексте речь идёт о наступлении и обнаружении предсказанных знамений; «явятся» звучит естественно и сохраняет смысл.
- source_word: ante ostendi tibi
  choice: Я прежде показал тебе
  rationale: Сохраняет временное значение ante и прямое обращение к адресату; прописная буква указывает на говорящего Бога по нормам русского библейского регистра.
theological_decisions:
- issue: Связь gens с народом или современным национальным государством
  choice: народ
  alternative: нация
  rationale: «Народ» шире и исторически уместнее современного политического понятия «нация», не снимая значения коллективной общности; вариант отмечен в сноске.
- issue: Незавершённость фразы в границах стиха
  choice: сохранить «тогда...»
  alternative: завершить мысль материалом следующего стиха
  rationale: Латинский текст заканчивается et tunc и синтаксически продолжается далее; многоточие честно сохраняет открытый переход, не заимствуя текст следующего стиха.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Параллелизм исходника сохранён; фраза намеренно оставлена незавершённой вслед за латинским текстом стиха.
