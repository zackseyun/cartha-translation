revisions:
- from: 'И всё это смешалось воедино: поток огня, пылающее дыхание и могучая буря. И обрушилось оно на наступавшее множество, приготовившееся к битве, и сожгло всех, так что внезапно от бесчисленного множества не осталось ничего видимого — лишь прах, пепел и запах дыма. Я увидел это и был потрясён.'
  to: 'И всё это смешалось воедино: поток огня, пылающее дыхание и могучая буря. И обрушилось оно на натиск множества, готового к битве, и сожгло всех, так что внезапно от бесчисленного множества ничего не было видно, кроме пепельной пыли и запаха дыма. Я увидел это и замер.'
  rationale: 'Исправлены две смысловые неточности по латинскому тексту: сохранён «натиск» множества и единый образ «пепельной пыли». Заключительная реакция передана более буквально и естественно. Структурных ошибок и оснований для сносок нет.'
