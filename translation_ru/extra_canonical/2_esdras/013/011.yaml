  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Сохранены образность суда и неопределённость среднего рода в «обрушилось оно», относящегося ко всему смешавшемуся явлению; конфессионально окрашенная терминология не добавлялась.
