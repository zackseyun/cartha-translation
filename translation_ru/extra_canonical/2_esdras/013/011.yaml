source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: ru
  text: 'И всё это смешалось воедино: поток огня, пылающее дыхание и могучая буря. И обрушилось оно на натиск множества, готового к битве, и сожгло всех, так что внезапно от бесчисленного множества ничего не было видно, кроме пепельной пыли и запаха дыма. Я увидел это и замер.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo tempestatis
  choice: могучая буря
  rationale: Латинское выражение буквально передаёт «множество/великую массу бури»; по-русски естественнее выразить силу и размах бури прилагательным «могучая».
- source_word: multitudinis impetum
  choice: наступавшее множество
  rationale: Impetus обозначает натиск или наступление. Формулировка передаёт движение враждебного множества и естественно связывается с последующим «приготовившееся к битве».
- source_word: puluis cineris
  choice: прах, пепел
  rationale: Сочетание допускает понимание «пепельная пыль», однако раздельная передача сохраняет оба образа уничтожения и согласуется с перечислительной силой фразы.
- source_word: et uidi et extiti
  choice: Я увидел это и был потрясён
  rationale: Extiti в контексте видения передаёт сильную реакцию изумления или потрясения; буквальное «стоял» по-русски не выражало бы смысл фразы.
