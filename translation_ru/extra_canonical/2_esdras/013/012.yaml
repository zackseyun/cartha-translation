  source_fidelity: 'Текст точно передаёт латинский оригинал: начальное et отражено союзом «И»; post haec — «после этого»; ipsum hominem — «тот человек» без неоправданного усиления; оба одновременных действия в descendentem и advocantem естественно выражены конструкцией «увидел, как… спускается… и созывает». «Другое мирное множество» сохраняет и aliam, и pacificam, не уточняя состав или природу этой группы.'
