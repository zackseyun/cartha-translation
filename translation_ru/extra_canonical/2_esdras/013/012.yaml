  yaml_path: translation/extra_canonical/2_esdras/013/012.yaml
  text: And after this I saw that man coming down from the mountain and calling to himself another peaceful multitude[a].
translation:
  language: ru
  text: И после этого я увидел, как тот человек спускается с горы и созывает к себе другое мирное множество.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ipsum hominem
  choice: тот человек
  rationale: Указательное «тот» естественно связывает этого человека с уже упомянутым образом; ipsum здесь не требует усиления «тот самый».
- source_word: descendentem de monte
  choice: спускается с горы
  rationale: Конструкция «увидел, как…» естественно передаёт латинское объектное сочетание с причастием настоящего времени и сохраняет разворачивающееся перед глазами действие.
- source_word: advocantem ad se
  choice: созывает к себе
  rationale: «Созывает» передаёт обращённый ко многим призыв собраться возле него и соответствует значению advocare ad se.
- source_word: multitudinem aliam pacificam
  choice: другое мирное множество
  rationale: Сохранены как значение aliam («другое»), так и характеристика pacificam («мирное») без уточнения, отсутствующего в источнике.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением начального союза «И» и последовательного повествовательного строя латинского текста. Формулировка остаётся возвышенной, но понятной; неоднозначность природы «мирного множества» не снимается добавочными пояснениями.
