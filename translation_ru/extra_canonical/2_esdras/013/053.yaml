  text: haec est interpretatio somnii quem vidisti, et propter quod inluminatus es haec solus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: ru
  text: Вот истолкование сна, который ты видел, и причина, по которой лишь тебе было открыто понимание этого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatio
  choice: истолкование
  rationale: Естественное для библейского контекста обозначение раскрытия смысла сна.
- source_word: inluminatus es
  choice: тебе было открыто понимание
  rationale: Латинское «ты был просвещён» здесь означает получение свыше понимания увиденного; выбранная формулировка передаёт этот смысл естественно по-русски, сохраняя страдательность.
- source_word: haec solus
  choice: лишь тебе … этого
  rationale: Передаёт исключительность solus и относит haec к содержанию данного откровения, не добавляя отсутствующих в источнике подробностей.
theological_decisions:
- issue: Характер просвещения Ездры
  choice: Безличная страдательная конструкция «тебе было открыто понимание»
  alternative: «ты один был просвещён относительно этого»
  rationale: Сохраняется подразумеваемое божественное действие, но не вводится прямо не названный в латинском тексте деятель; одновременно фраза звучит ясно и современно.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Нерелевантная английская сноска не перенесена: она описывает отсутствующую в данном латинском стихе фразу.'
