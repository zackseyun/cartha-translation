lexical_decisions:
- source_word: ostendet
  choice: покажет
  rationale: Прямо передаёт латинский глагол «покажет, явит» без добавления толкования.
- source_word: multa plurima
  choice: великое множество
  rationale: Естественно по-русски передаёт усиленное сочетание со значением чрезвычайной многочисленности.
- source_word: portenta
  choice: знамений
  rationale: В данном апокалиптическом контексте передаёт необычайные явления как знаки; «чудеса» возможно, но менее точно сохраняет оттенок знамения.
theological_decisions:
- issue: Характер portenta
  choice: знамения
  alternative: чудеса / необычайные явления
  rationale: Выбрано слово, сохраняющее связь сверхъестественного явления со знаковым смыслом и не уточняющее его природу сверх текста.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка, соответствующая апокалиптическому контексту.
