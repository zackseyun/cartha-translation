source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'usque in nouissimo tempore: et nunc iterum coeperunt uenire; Iterum altissimus statuit uenas fluminis, ut possint transire.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/046.yaml
  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: ru
  text: Так они оставались там до последнего времени[a]. Теперь же они снова начали приходить, и Всевышний вновь перекрыл русла реки, чтобы они могли перейти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть до конечного, эсхатологического времени; латинское выражение стоит в единственном числе.
    reason: translation_clarity
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: до последнего времени
  rationale: Передаёт единственное число латинского выражения и сохраняет его эсхатологический оттенок; примечание предотвращает понимание в смысле «до прошлого раза».
- source_word: iterum coeperunt uenire
  choice: снова начали приходить
  rationale: Сохраняет повторность iterum, начинательное значение coeperunt и направленность движения venire.
- source_word: statuit uenas fluminis
  choice: перекрыл русла реки
  rationale: В данном контексте statuit обозначает остановку или преграждение водного потока, а множественное uenas — отдельные русла или протоки реки.
- source_word: ut possint transire
  choice: чтобы они могли перейти
  rationale: Прямо передаёт целевое придаточное и возможность перехода, выраженную possint.
theological_decisions:
- issue: Эсхатологический смысл nouissimum tempus
  choice: последнее время
  alternative: конец времён
  rationale: Выбран более формально близкий вариант в единственном числе, который не устраняет возможную смысловую широту выражения; эсхатологический смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «они» сохраняет связь с участниками, названными в предшествующем контексте. Не относящееся непосредственно к данному стиху примечание об Арзарете не перенесено.
