translation:
  language: ru
  text: но я видел только, как он испускал из уст своих словно волну огня, из губ своих — дыхание пламени, а с языка своего метал искры бури.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emittit de ore suo sicut fluctum ignis
  choice: испускал из уст своих словно волну огня
  rationale: Сохраняет сравнительный образ sicut и передаёт историческое настоящее в соответствии с повествовательным контекстом.
- source_word: spiritum flammae
  choice: дыхание пламени
  rationale: Spiritus допускает значения «дыхание», «дух» и «ветер»; в образе исходящего из губ огня естественнее «дыхание», при этом связь с пламенем сохранена буквально.
- source_word: scintillas tempestatis
  choice: искры бури
  rationale: Буквально сохраняет необычный и намеренно напряжённый образ латинского текста, не заменяя его более привычными «молниями».
- source_word: emittebat
  choice: метал
  rationale: Динамичный русский глагол естественно сочетается с «искрами» и передаёт повторяющееся либо продолженное испускание.
