  yaml_path: translation/extra_canonical/2_esdras/013/008.yaml
  text: And after this I looked, and behold, all those who had gathered against him to attack him were greatly afraid, yet they still dared to fight.
translation:
  language: ru
  text: 'И после этого я увидел: и вот, все, кто собрался против него, чтобы напасть на него, сильно боялись, но всё же осмеливались сражаться.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expugnarent
  choice: сразиться с ним
  rationale: Передаёт в данном военном контексте намерение выступить против него и одолеть его, не добавляя более узкого оттенка осады.
- source_word: timebant valde
  choice: были охвачены великим страхом
  rationale: Естественно и выразительно передаёт усиленное латинское «сильно боялись».
- source_word: tamen audebant pugnare
  choice: однако осмеливались вступить в бой
  rationale: Сохраняет напряжение между сильным страхом и всё же проявленной решимостью сражаться.
