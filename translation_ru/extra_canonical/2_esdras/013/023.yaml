revisions:
- from: Тот, кто в то время наведёт опасность, сам сохранит тех, кто окажется в опасности, — тех, у кого есть дела и вера в Могущественнейшего[a].
  to: Тот, кто в то время принесёт опасность, сам сохранит тех, кто попадёт в опасность, — тех, у кого есть дела и вера в Могущественнейшего[a].
  rationale: 'Исправлены только две лексико-стилистические точки: adferet periculum передано прямым и естественным «принесёт опасность», а inciderint — «попадёт в опасность». Повтор «опасность», усилительное «сам», «дела и вера» и суперлативный титул сохранены.'
