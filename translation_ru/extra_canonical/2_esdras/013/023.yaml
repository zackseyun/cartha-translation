  text: qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad Fortissimum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: ru
  text: Тот, кто в то время принесёт опасность, сам сохранит тех, кто попадёт в опасность, — тех, у кого есть дела и вера в Могущественнейшего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всесильного».'
    reason: Указывает на более привычный русский божественный титул; основной текст сохраняет превосходную степень латинского Fortissimum.
lexical_decisions:
- source_word: adferet periculum
  choice: наведёт опасность
  rationale: Передаёт активное значение латинского оборота «принесёт/навлечёт опасность» и не смягчает напряжение между тем, кто наводит опасность, и тем же лицом как хранителем.
- source_word: custodibit
  choice: сохранит
  rationale: В данном контексте означает охрану и избавление попавших в опасность; «сохранит» звучит естественно и достойно.
- source_word: operas et fidem
  choice: дела и вера
  rationale: Формально сохраняет оба самостоятельных существительных и не подменяет «дела» более толковательным выражением.
- source_word: ad Fortissimum
  choice: в Могущественнейшего
  rationale: Русское управление с «верой» требует естественного «в»; субстантивированный суперлатив Fortissimum передан как особый божественный титул с сохранением превосходной степени.
theological_decisions:
- issue: Лицо, которое наводит опасность и затем охраняет оказавшихся в ней
  choice: 'Сохранено тождество действующего лица: «тот… сам»'
  alternative: Понять первого деятеля как безличную причину бедствия либо как иное лицо
  rationale: Латинское ipse подчёркивает, что хранить будет именно тот, кто принесёт опасность; это богословское напряжение нельзя устранять.
- issue: Смысл Fortissimum как божественного титула
  choice: Могущественнейший
  alternative: Могущественный / Всесильный
  rationale: Fortissimum — суперлатив, употреблённый субстантивно; перевод сохраняет его усиленную степень, не сводя титул к обычному положительному прилагательному.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор слова «опасность» сохранён вслед за латинским текстом. Оборот «у кого есть дела и вера» намеренно близок к источнику и не уточняет, какого именно рода дела имеются в виду.
