review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранено тождество лица, которое приносит опасность и само хранит оказавшихся в ней; operas et fidem передано без толковательного расширения, а Fortissimum сохранено как субстантивированный суперлативный божественный титул. Однако «наведёт опасность» не является точной или естественной передачей adferet periculum; латинское adferet означает «принесёт» (в данном контексте также возможно «навлечёт»).'
  naturalness: «Наведёт опасность» звучит неестественно по-русски. «Принесёт опасность» сохраняет прямоту и намеренную напряжённость латинского выражения. «Попадёт в опасность» несколько яснее передаёт inciderint, чем нейтральное «окажется в опасности».
  terminology: «Могущественнейший» точно отражает превосходную степень Fortissimum и может быть сохранён как намеренно возвышенный божественный титул. Сноска с вариантом «Всесильный» допустима как более обычный русский титул, но не должна создавать впечатления, что это строго эквивалентная передача суперлатива.
  issues:
  - severity: medium
    issue: Неудачное словосочетание «наведёт опасность».
    rationale: Оборот неестественен в современном литературном русском и менее прямо соответствует adferet («принесёт»). Безопасная правка — «принесёт опасность».
  - severity: low
    issue: «Окажется в опасности» ослабляет образ inciderint.
    rationale: Incidere in periculum означает попасть/впасть в опасность. «Попадёт в опасность» передаёт это несколько точнее и при этом естественно.
  revised_text: Тот, кто в то время принесёт опасность, сам сохранит тех, кто попадёт в опасность, — тех, у кого есть дела и вера в Могущественнейшего[a].
  revised_footnotes:
  - marker: a
    text: 'Или: «Всесильного».'
    reason: Указывает на более привычный русский божественный титул; основной текст сохраняет превосходную степень латинского Fortissimum.
  revision_rationale: 'Исправлены только две лексико-стилистические точки: adferet periculum передано прямым и естественным «принесёт опасность», а inciderint — «попадёт в опасность». Повтор «опасность», усилительное «сам», «дела и вера» и суперлативный титул сохранены.'
