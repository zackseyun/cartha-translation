base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: ru
  text: и потому что Он управляет временами и тем, что совершается в эти времена.[a] И я сидел там три дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и потому что Он управляет временами и тем, что привносится в эти времена». В прежней редакции перед этими словами по ошибке был включён текст предыдущего стиха: «И я ушёл и вышел в поле, горячо прославляя и восхваляя Всевышнего за чудеса, которые Он совершил в их времена».'
    reason: previous_rendering
lexical_decisions:
- source_word: gubernat
  choice: управляет
  rationale: Передаёт прямое значение латинского глагола — «направляет, управляет» — и сохраняет мысль о власти Бога над временами.
- source_word: tempora
  choice: временами
  rationale: Форма множественного числа соответствует латинскому tempora и сохраняет различение отдельных времён или эпох.
- source_word: quae sunt in temporibus inlata
  choice: тем, что вводится в эти времена
  rationale: Близко передаёт пассивное inlata («внесено, введено») и не сводит выражение однозначно к событиям, которые просто «происходят».
- source_word: sedi ibi tribus diebus
  choice: я просидел там три дня
  rationale: Естественная русская передача длительного пребывания в сидячем положении; ibi передано словом «там», а длительность — винительным оборотом «три дня».
theological_decisions:
- issue: Объём Божьего управления
  choice: «управляет временами и тем, что вводится в эти времена»
  alternative: «управляет временами и тем, что происходит в эти времена»
  rationale: Основной текст сохраняет образ внесения или введения, выраженный inlata, не утверждая сверх текста, что Бог непосредственно причиняет каждое событие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы как указание на Всевышнего из ближайшего контекста. Начальное «и» сохранено, поскольку стих синтаксически продолжает предыдущее высказывание.
