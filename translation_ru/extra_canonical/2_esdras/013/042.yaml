  text: которых они не соблюдали на своей земле. Но через проходы
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruantes
  choice: соблюдали
  rationale: Причастие от servo в данном контексте означает соблюдение ранее упомянутых установлений или предписаний; прошедшее время естественно передаёт латинскую конструкцию с fuerant.
- source_word: in regione sua
  choice: в своей земле
  rationale: Regio может означать область, край или землю; «в своей земле» естественно обозначает страну их прежнего проживания и соответствует возвратному sua.
- source_word: Per introitus
  choice: через проходы
  rationale: Introitus буквально обозначает входы или пути входа; в незавершённой фразе «через проходы» сохраняет пространственный смысл и позволяет продолжению уточнить, о каких проходах идёт речь.
- source_word: autem
  choice: Но
  rationale: Передаёт переходно-противительный оттенок autem и сохраняет начало нового предложения, как в источнике.
theological_decisions:
- issue: Неясный антецедент относительного местоимения quae
  choice: которых
  alternative: которые
  rationale: Латинское quae относится к подразумеваемому или названному в предшествующем тексте множеству установлений; форма «которых» согласуется с глаголом «не соблюдали», не добавляя отсутствующего в данном фрагменте существительного.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Сохранена фрагментарность границы стиха: заключительные слова «Но через проходы» намеренно остаются синтаксически незавершёнными, как и предоставленный латинский источник.'
