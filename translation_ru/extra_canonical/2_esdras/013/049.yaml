source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dinem earum quae collectae sunt gentes, proteget qui superauerit populum, Et tunc ostendet eis multa plurima portenta. Et dixi ego : dominator domine, hoc mihi ostende, propter quod uidi uirum ascendentem de corde maris. et dixit mihi : Sicut non potest hoc uel scrutinare uel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram uidere filium meum uel eos qui cum eo sunt nisi in tempore diei. Haec est interpretatio somnii quod uidisti, et propter hoc inluminatus es haec solus. Dereliquisti enim tua, et circa mea uacasti, et legem meam exquisisti ; Vitam enim tuam disposuisti in sapientiam, et sensum tuum uocasti matrem. Et propter hoc ostendi tibi haec, merces enim apud altissimum. erit enim post alios tres dies ad te alia loquar, et exponam tibi grauia et mirabilia. Et profectus sum et transii in campum, multum glorificans et laudans altissimum de mirabilibus quae per tempus faciebat, Et quoniam gubernat tempora et quae sunt in temporibus inlata : et sedi
    ibi tribus diebus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/049.yaml
  text: Then it will be, when he begins to destroy the gathered multitude of the nations, that he will protect the people who survive.
translation:
  language: ru
  text: И когда он начнёт истреблять собравшееся множество народов, тогда он защитит уцелевший народ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dinem earum quae collectae sunt gentes
  choice: собравшееся множество народов
  rationale: Начало латинского текста повреждено и сохраняет лишь окончание слова, однако контекст и английский консультационный слой указывают на multitudinem; оборот передан естественно и без устранения собирательного значения.
- source_word: proteget
  choice: защитит
  rationale: Точно передаёт значение латинского глагола — охранять, защищать.
- source_word: qui superauerit populum
  choice: уцелевший народ
  rationale: Латинский порядок слов необычен, но populum понимается как дополнение к proteget, а qui superauerit — как характеристика народа, который останется в живых.
- source_word: cum coeperit exterminare
  choice: когда он начнёт истреблять
  rationale: Сохраняет начинательность действия и сильное значение уничтожения, отражённые в контексте восстановленного начала стиха.
theological_decisions:
- issue: Кого защитит мессианская фигура
  choice: уцелевший народ
  alternative: людей из народа, которые уцелеют
  rationale: Латинское populum имеет собирательное значение «народ»; перевод не уточняет его состав и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Парная конструкция «И когда… тогда…» ясно передаёт временно-следственную связь латинского предложения.
