  yaml_path: translation/extra_canonical/2_esdras/013/017.yaml
  text: For those who are not left will be sorrowful,
translation:
  language: ru
  text: Ибо те, кого не оставили, будут печальны,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelicti
  choice: останется
  rationale: В пассивной конструкции non sunt derelicti слово передано естественным по-русски «не останется», то есть не будет оставлен в живых; при этом перевод не уточняет явно, кем или почему они не оставлены.
- source_word: tristes erunt
  choice: будут скорбеть
  rationale: Передаёт будущее состояние печали естественным и dignified русским выражением, сохраняя предикативный смысл латинского оборота.
theological_decisions:
- issue: К кому относятся «те, кто не останется»
  choice: Сохранена неопределённость без пояснения участи или группы людей.
  alternative: «те, кто не будет оставлен в живых»
  rationale: Латинский текст допускает понимание в контексте оставшихся/неоставшихся, но сам стих не выражает дополнение «в живых» и не называет действующего лица.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Начальное «Ибо» сохраняет причинную связь enim, а запятая в конце отражает незавершённость предложения в данном стихе.
