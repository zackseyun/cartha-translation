  source_fidelity: 'Латинское derelicti — страдательное причастие («оставлены», «покинуты»), тогда как «не останется» меняет залог и обозначает самостоятельное оставание. Следует сохранить пассивную неопределённость: не уточнять, кто оставляет и в каком именно смысле.'
  naturalness: «Те, кого не оставили» — естественная современная литературная русская передача латинской пассивной конструкции. «Будут печальны» точно передаёт tristes erunt как будущее состояние, не усиливая его до активного действия «будут скорбеть».
  terminology: Специальных имён или богословских терминов в стихе нет. «Оставили» сохраняет возможную двусмысленность derelinquo («оставить», «покинуть», «оставить позади») без интерпретационного уточнения.
