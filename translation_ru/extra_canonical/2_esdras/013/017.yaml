    rationale: Черновик заменяет латинский страдательный смысл qui non sunt derelicti активной конструкцией о том, что кто-либо «не останется». Это способно изменить референцию и устраняет существенную синтаксическую неоднозначность подлинника.
  - severity: low
    issue: «будут скорбеть» вместо состояния печали
    rationale: 'tristes erunt буквально выражает состояние: «будут печальны/опечалены». Глагол «скорбеть» возможен по смыслу, но активнее и несколько сильнее оригинала.'
