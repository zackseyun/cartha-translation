  language: ru
  text: И вот, с моря поднимался ветер, чтобы взволновать все его волны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: И вот
  rationale: Передаёт зрительное и повествовательное выделение нового образа естественным современным русским выражением.
- source_word: de mari
  choice: с моря
  rationale: Сохраняет исходное указание на движение или происхождение ветра со стороны моря, не уточняя сверх текста.
- source_word: ventus exsurgebat
  choice: поднимался ветер
  rationale: Имперфект exsurgebat передан как разворачивающееся действие в видении; порядок слов звучит естественно и сохраняет акцент на происхождении ветра.
- source_word: ut conturbaret
  choice: чтобы взволновать
  rationale: Союз «чтобы» сохраняет целевую или результативную смысловую связь ut, а «взволновать» уместно описывает приведение морских волн в сильное движение.
- source_word: omnes fluctus eius
  choice: все его волны
  rationale: Сохраняет всеобщность omnes и местоименную отсылку eius к морю, не заменяя её толкованием.
