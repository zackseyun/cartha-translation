  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: ru
  text: И вот, когда он увидел натиск приближающегося множества, то не поднял руки, не держал ни копья, ни какого-либо боевого оружия;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impetum
  choice: натиск
  rationale: Передаёт наступательное движение и угрозу нападения, не сводя значение лишь к нейтральному «приближению».
- source_word: multitudinis uenientis
  choice: приближающегося множества
  rationale: Сохраняет образ многочисленной массы, движущейся к герою, и естественно звучит по-русски.
- source_word: non leuauit manum suam
  choice: не поднял руки
  rationale: Формально и образно соответствует латинскому выражению, не добавляя предполагаемой цели жеста.
- source_word: frameam
  choice: копья
  rationale: В данном контексте обозначает древковое оружие; «копьё» понятно современному читателю и соответствует консультационному английскому слою.
- source_word: neque
  choice: и никакого другого
  rationale: В конце перечисления по-русски естественно подчёркивает отсутствие любого боевого оружия; слово «другого» делает отношение копья к общей категории явным без изменения смысла.
