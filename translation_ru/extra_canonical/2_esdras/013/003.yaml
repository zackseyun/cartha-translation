  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: ru
  text: 'И увидел я: вот, тот человек летел с облаками небесными. Куда бы он ни обращал лицо, чтобы посмотреть, всё видимое под ним[a] трепетало.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё, что было видно под ним».'
    reason: Уточняет конструкцию латинского quae sub eo videbantur и сохраняет её буквальный пространственный смысл.
lexical_decisions:
- source_word: convolabat
  choice: летел
  rationale: Передаёт длительное движение по воздуху; приставочное значение совместности уже выражено оборотом «с облаками небесными».
- source_word: ipse homo
  choice: тот человек
  rationale: В данном контексте ipse выделяет уже упомянутую фигуру; «тот человек» естественно и без лишнего усиления передаёт это указание.
- source_word: cum nubibus caeli
  choice: с облаками небесными
  rationale: Сохраняет образ и конструкцию латинского текста без уточнения, означает ли cum сопровождение или средство движения.
- source_word: ubi ... convertebat
  choice: куда бы ... ни обращал
  rationale: 'Идиоматически передаёт повторяющееся или неопределённо-направленное действие: всякое место, куда он обращал лицо.'
- source_word: ut consideraret
  choice: чтобы посмотреть
  rationale: Сохраняет целевое значение ut и доступно передаёт внимательное зрительное действие considerare.
- source_word: omnia quae sub eo videbantur
  choice: всё видимое под ним
  rationale: 'Следует непосредственно засвидетельствованному латинскому тексту: sub eo означает «под ним», а videbantur — «было видно / казалось видимым».'
- source_word: tremebant
  choice: трепетало
  rationale: Передаёт физическое содрогание и сохраняет возвышенный, но понятный библейский регистр.
theological_decisions:
- issue: Относится ли sub eo к пространству под человеком или обозначает деятеля при пассивном videbantur
  choice: 'Пространственное значение: «под ним»'
  alternative: 'Агентное прочтение: «увиденное им»'
  rationale: В имеющемся латинском тексте sub с аблативом естественно читается пространственно. Агентное толкование предполагает восстановление греческого оборота за латинским переводом и не должно без рукописной опоры заменять прямое свидетельство указанного источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «И увидел я» сохраняет торжественный характер видения; остальной синтаксис сделан естественным и понятным.
