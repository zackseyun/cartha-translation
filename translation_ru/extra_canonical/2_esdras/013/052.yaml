  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: ru
  text: «Как никто не может исследовать или узнать, что находится в глубинах моря, так никто на земле не сможет увидеть Моего Сына или тех, кто с Ним, кроме как в тот день».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare vel scire
  choice: исследовать или узнать
  rationale: 'Сохранены два различимых латинских действия: попытка исследовать и достижение знания.'
- source_word: in profundo maris
  choice: в морской глубине
  rationale: Естественная русская передача образа глубин моря без добавления отсутствующих в источнике деталей.
- source_word: Filium meum
  choice: Моего Сына
  rationale: Прямо передаёт родственное обозначение и его мессианскую значимость, не заменяя его толкованием.
- source_word: in tempore diei
  choice: во время того дня
  rationale: Передаёт ограничение по времени; указательное «того» естественно отсылает к ожидаемому эсхатологическому дню, как и в консультационном английском тексте, хотя в латинском отдельного указательного местоимения нет.
theological_decisions:
- issue: Возможность увидеть Сына и пребывающих с Ним
  choice: никто на земле не сможет увидеть Моего Сына или тех, кто с Ним, кроме как во время того дня
  alternative: никто на земле не сможет увидеть Моего Сына и тех, кто с Ним, до того дня
  rationale: Формулировка с «кроме как» сохраняет латинское nisi и не превращает точное временное исключение в более общее «до».
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Начальная формула «И он сказал мне» не включена, поскольку её нет в предоставленном латинском тексте данного стиха; перевод следует исходному свидетельству, а не добавлению консультационного английского слоя.
