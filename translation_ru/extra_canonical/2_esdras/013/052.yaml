  source_fidelity: 'Основной смысл передан точно: сохранены сопоставление с непостижимостью морской глубины, два действия scrutinare и scire, земной предел видения, Сын и пребывающие с Ним, а также временное исключение nisi in tempore diei. Однако «во время того дня» — неестественная для современного русского калька; указательное «того» прямо не выражено в латинском тексте, хотя определённый день очевиден из конструкции и контекста.'
