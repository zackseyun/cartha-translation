  text: 'in sensu meo, uae qui derelicti fuerint in diebus illis, et multo plus uuae his qui non sunt derelicti : Qui enim non sunt derelicti, tristos erunt, Intelligentes quae sunt reposita in nouissimis diebus et non occurrentes eis ; sed et qui derelicti sunt Propter hoc uuae ! uidebunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec. Adtamen facilius est periclitantem uenire in haec quam pertransire sicut nubem a saeculo et non uidere quae contingent in nouissimo. Et respondit ad me et dixit : et uisionis interpretationem dicam tibi, sed et de quibus locutus es adaperiam tibi. Quoniam de his dixisti qui derelicti sunt, haec est interpretatio. Qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad fortissimum. Scito ergo quoniam magis beatificati sunt qui derelicti super eos qui mortui sunt. Interpretationes uisionis haec : quia uidisti uirum ascendentem de corde maris, Ipse est quem conseruat altissimus
    multis temporibus, qui per semetipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt. Et quoniam uidisti de ore eius exire spiritum et ignem et tempestatem, Et quoniam non tenebat frameam neque uas bellicosum, corrumpit enim impetum eius multitudinis quae uenerat ad'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/016.yaml
  text: For in my understanding, woe to those who are left in those days, and much more woe to those who are not left!
translation:
  language: ru
  text: Ибо, по моему разумению, горе тем, кто останется[a] в те дни, и гораздо большее горе тем, кто не останется!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут оставлены» (далее: «не оставлены»); по контексту — останутся в живых.'
    reason: Уточняет форму и повтор исходного выражения, сохраняя в основном тексте его намеренно парадоксальную формулировку.
lexical_decisions:
- source_word: in sensu meo
  choice: по моему разумению
  rationale: Передаёт личное осмысление говорящего естественным, но достойным русским выражением; не добавляет отсутствующего в тексте оттенка сомнения.
- source_word: derelicti fuerint
  choice: останется
  rationale: В данном контексте латинское выражение обозначает тех, кто будет оставлен и останется в живых; «останется» сохраняет повтор и парадокс исходного текста.
- source_word: multo plus uae
  choice: гораздо большее горе
  rationale: Естественно передаёт усиление multo plus и повтор восклицания uae.
theological_decisions:
- issue: Парадоксальное сопоставление оставшихся и неоставшихся
  choice: Сохранить формулировки «кто останется» и «кто не останется» без пояснения в основном тексте
  alternative: Истолковать их как «кто выживет» и «кто умрёт»
  rationale: Исходный текст намеренно сохраняет напряжение, которое раскрывается в последующих стихах; явное истолкование здесь преждевременно устранило бы эту риторическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого восклицания. Синтаксический параллелизм и повтор «останется / не останется» сохранены.
