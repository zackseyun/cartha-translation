source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cacumen montis Sion. Sion autem ueniet et ostendetur omnibus parata et aedificata, sicut uidisti montem sculpi sine manibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: ru
  text: Но он встанет на вершине горы Сион. Сион же придёт и явится всем — приготовленный и построенный, как ты видел гору, высеченную без рук.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen montis Sion
  choice: вершине горы Сион
  rationale: «Cacumen» означает вершину, высшую точку; название «Сион» оставлено в принятой русской форме без изменения.
- source_word: ueniet et ostendetur omnibus
  choice: придёт и явится всем
  rationale: Сохраняется необычный образ приходящего Сиона; пассивное «ostendetur» естественно передано возвратной формой «явится», не уточняющей действующее лицо.
- source_word: parata et aedificata
  choice: приготовленный и отстроенный
  rationale: 'Переданы оба признака: готовность и завершённое устройство/строительство; формы согласованы с мужским родом русского названия «Сион».'
- source_word: montem sculpi sine manibus
  choice: гору, изваянную без помощи рук
  rationale: «Sculpi» передаёт высекание или изваяние; формулировка сохраняет образ горы, возникшей не человеческим трудом, и библейский оборот «без помощи рук».
theological_decisions:
- issue: Сион как приходящая и уже приготовленная реальность
  choice: 'Сохранить буквальный образ: «Сион придёт»'
  alternative: «Сион появится» или истолковать Сион как небесный город
  rationale: Латинский текст прямо говорит «Sion ueniet» и не поясняет здесь природу Сиона; перевод не должен заранее разрешать эсхатологическую неоднозначность.
- issue: Кем Сион будет показан всем
  choice: «явится всем» без указания деятеля
  alternative: «будет показан всем [Богом]»
  rationale: Пассивная форма «ostendetur» не называет действующего лица, поэтому добавление Бога было бы толкованием.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Необычная персонификация Сиона и образ горы, изваянной без рук, сохранены без поясняющих добавлений. Начальное «Но он станет» следует контекстуально восстановленной формулировке консультационного английского текста, поскольку предоставленный латинский фрагмент начинается словами «вершина горы Сион» и, по-видимому, не включает начало предложения.
