revisions:
- from: Но он станет на вершине горы Сион. А Сион придёт и явится всем — приготовленный и отстроенный, как ты видел гору, изваянную без помощи рук.
  to: Но он встанет на вершине горы Сион. Сион же придёт и явится всем — приготовленный и построенный, как ты видел гору, высеченную без рук.
  rationale: 'Исправлены лексические неточности без устранения намеренной эсхатологической неоднозначности: не назван деятель явления Сиона и не истолкована природа Сиона. Начальная часть сохранена согласно предоставленному английскому audit trail, поскольку в приведённом латинском фрагменте начало предложения отсутствует.'
