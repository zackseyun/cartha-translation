lexical_decisions:
- source_word: propter hoc
  choice: поэтому
  rationale: Передаёт причинно-следственную связь естественно и точно.
- source_word: multitudinem collectam
  choice: множество, собравшееся
  rationale: Сохраняет образ множества людей, объединённого в одном месте, без добавления отсутствующего в тексте уточнения.
- source_word: cum pace
  choice: в мире
  rationale: Сохраняет смысл мирного состояния или согласия; более буквальное «с миром» по-русски звучало бы неестественно, а «мирно» могло бы чрезмерно сузить значение до способа собрания.
