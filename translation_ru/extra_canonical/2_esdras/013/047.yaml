translation_notes:
  register: Современный литературный русский язык, краткий и возвышенный без архаизации. Первая фраза английского консультационного текста («Снова Всевышний удержит русла реки…») отсутствует в предоставленном латинском тексте и потому не включена. Конечное «Sed et qui» представляет начало следующей незавершённой фразы и также не включено в данный стих.
