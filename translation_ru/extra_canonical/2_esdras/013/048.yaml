  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: ru
  text: А оставшиеся из твоего народа, которые находятся в Моих святых пределах, будут спасены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сохранившемся латинском тексте сказуемое отсутствует. Эфиопская и арабская версии читают «будут спасены», а сирийская — «будут жить».
    reason: Отмечает повреждение латинской традиции и честно представляет разночтение древних дочерних версий, на основании которых восстановлено сказуемое.
lexical_decisions:
- source_word: derelicti sunt de populo tuo
  choice: оставшиеся из твоего народа
  rationale: Передаёт значение уцелевшего или оставшегося остатка народа без добавления отсутствующего в латинском тексте усиления «даже».
- source_word: qui inueniuntur
  choice: которые находятся
  rationale: Естественно передаёт латинское настоящее страдательное со значением пребывания или обнаружения; в данном контексте «находятся» звучит яснее и не вводит дополнительного действующего лица.
- source_word: intra terminum meum Sanctum
  choice: в Моих святых пределах
  rationale: Сохраняет пространственный образ terminus как границы или ограниченной области; множественное «пределах» естественно в современном литературном русском.
- source_word: '[verb absent in extant Latin]'
  choice: будут спасены
  rationale: 'Главный глагол отсутствует в дефектной латинской передаче, но дочерние версии подтверждают завершённое высказывание: эфиопская и арабская имеют смысл «будут спасены», сирийская — «будут жить».'
theological_decisions:
- issue: Судьба остатка народа в дефектно сохранившейся фразе
  choice: будут спасены
  alternative: будут жить
  rationale: Формулировка следует эфиопскому и арабскому свидетельствам и согласуется с контекстом избавления, при этом вариант сирийской версии сохраняется в примечании, чтобы не устранять текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Обращение к Богу передано местоимением «Моих» с прописной буквы. Формулировка ясна обычному читателю и не усиливает текст конфессиональными толкованиями.
