source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: ru
  text: И потому Я показал тебе всё это, ибо у Всевышнего есть награда. Ещё через три дня Я скажу тебе другое и объясню тебе важное и дивное».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: потому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: merces apud Altissimum
  choice: у Всевышнего есть награда
  rationale: Сохраняет образ награды и буквальную пространственно-реляционную конструкцию apud, не уточняя, кому именно предназначена награда.
- source_word: post alios tres dies
  choice: через три дня
  rationale: Современное русское обозначение срока; alios здесь указывает на ещё три дня от настоящего момента.
- source_word: gravia et mirabilia
  choice: важные и дивные вещи
  rationale: Gravia передано по смыслу как «важные», то есть весомые и серьёзные; mirabilia — dignified «дивные», сохраняющее оттенок необычайного и вызывающего изумление.
theological_decisions:
- issue: Кому принадлежит или предназначается награда
  choice: Оставить формулировку «у Всевышнего есть награда» без указания получателя
  alternative: «тебе уготована награда у Всевышнего»
  rationale: Латинский текст не содержит явного местоимения или иного обозначения получателя; добавление «тебе» устранило бы подлинную неоднозначность.
- issue: Характер последующего откровения
  choice: «открою тебе»
  alternative: «объясню тебе»
  rationale: Exponam допускает значения «изложу», «раскрою», «объясню»; в контексте видения «открою» звучит естественно, не вводя дополнительной доктринальной конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавное «Я» отражает речь божественного собеседника по контексту. Синтаксис сделан ясным для обычного читателя без утраты краткости латинского текста.
