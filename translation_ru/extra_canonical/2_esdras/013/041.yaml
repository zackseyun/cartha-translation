id: 2ES.13.41
reference: 2 Esdras 13:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: ru
  text: Они решили оставить множество народов и отправиться в более отдалённую область, где никогда не обитал род человеческий, чтобы хотя бы там соблюдать свои установления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: consilium hoc
  choice: решили
  rationale: Латинское выражение обозначает принятое ими намерение или замысел; русское «решили» естественно передаёт его в контексте зависимого предложения.
- source_word: multitudinem gentium
  choice: множество народов
  rationale: Сохранено собирательное значение multitudo и множественное gentium без сужения до одного народа или населения вообще.
- source_word: ulteriorem regionem
  choice: более отдалённую область
  rationale: Сравнительное ulteriorem передано явно; «область» соответствует общему географическому значению regio.
- source_word: genus humanum
  choice: род человеческий
  rationale: Формально и литературно передаёт латинское обозначение человечества.
- source_word: legitima sua
  choice: свои установления
  rationale: Legitima здесь означает предписанные нормы или установления; выбор сохраняет юридико-религиозный оттенок, не уточняя сверх источника, что речь именно о законе Моисея.
- source_word: uel ibi
  choice: хотя бы там
  rationale: 'Передаёт усилительно-ограничительный оттенок uel: возможность соблюдать установления по крайней мере в том месте.'
theological_decisions:
- issue: Характер legitima sua
  choice: свои установления
  alternative: свои законы / свои постановления
  rationale: Нейтральная формулировка сохраняет религиозно-правовой смысл, не привнося конфессионального толкования и не отождествляя прямо с конкретным сводом закона.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён естественным русским глаголом «решили», при этом все смысловые элементы латинского текста, включая заключительную целевую фразу и оттенок uel, сохранены.
