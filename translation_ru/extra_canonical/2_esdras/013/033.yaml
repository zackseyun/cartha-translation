  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: ru
  text: 'откроется Мой Сын, которого ты видел в виде восходящего человека. И будет так: когда все народы услышат Его голос, каждый оставит свою страну и войну, которую ведёт с другими,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur
  choice: откроется
  rationale: Передаёт будущее страдательное значение латинского глагола и естественно звучит в библейском контексте явления ранее сокрытой личности.
- source_word: filius meus
  choice: Мой Сын
  rationale: Прямое соответствие латинскому выражению; прописные буквы уместны как обозначение мессианской личности в речи Бога.
- source_word: uirum ascendentem
  choice: восходящим как муж
  rationale: Сохраняет значение ascendentem («восходящим») и отдельную предикативную характеристику uirum, не отождествляя без оговорки Сына с обычным человеком.
- source_word: derelinquet unusquisque regionem suam
  choice: каждый оставит свою землю
  rationale: Unusquisque передано обобщающим «каждый», regionem — естественным в данном контексте «землю».
- source_word: bellum quod habent in alterutro
  choice: войну, которую они ведут друг с другом
  rationale: Идиоматично передаёт буквальное «войну, которую имеют между собой», сохраняя взаимный характер конфликта.
theological_decisions:
- issue: 'Описание увиденной фигуры: uirum ascendentem'
  choice: которого ты видел восходящим как муж
  alternative: которого ты видел как восходящего мужа
  rationale: Выбранная формулировка сохраняет связь местоимения с «Моим Сыном» и одновременно сравнительно-образный характер человеческого облика, не вводя дополнительного догматического толкования.
