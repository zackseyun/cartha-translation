  source_fidelity: 'Смысловой каркас передан точно: будущее откровение Сына, услышание Его голоса всеми народами и оставление ими своих земель и взаимной войны сохранены. Однако «восходящим как муж» неверно организует латинское uirum ascendentem: это описание увиденного человеческого облика как «человека, восходящего», а не характеристика «восходящий как муж».'
