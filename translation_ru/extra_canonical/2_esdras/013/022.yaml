  source_fidelity: Латинское derelicti sunt — пассивная форма («были оставлены»), и это следует сохранить в обеих частях противопоставления. В черновике первая группа передана как «оставшиеся», а вторая — активной конструкцией «не остался», что меняет залог и вносит не предусмотренное оригиналом смысловое различие. Исправление сохраняет неопределённость относительно того, кем и в каком смысле они были оставлены.
  naturalness: «Ибо ты сказал о тех, кто был оставлен, и о тех, кто не был оставлен; вот истолкование:» — естественная для современного литературного русского, сдержанно-книжная формулировка, подходящая для вводной реплики перед объяснением.
  terminology: «Истолкование» точно и традиционно передаёт interpretatio. Нейтральная пассивная конструкция «был оставлен» не навязывает богословского либо исторического истолкования.
  issues:
  - severity: medium
    issue: Утрачен пассивный залог derelicti sunt во второй половине противопоставления.
    rationale: «Тех, кто не остался» означает тех, кто не пребывал/не выжил, тогда как латинское non derelicti sunt означает «тех, кто не был оставлен». Кроме того, «оставшихся» в первой половине не является надёжным сохранением пассивной формы.
