  rationale: Передаёт причинно-пояснительную связь с предшествующим контекстом.
- source_word: derelicti sunt
  choice: оставшихся
  rationale: Естественно по-русски передаёт латинскую пассивную конструкцию, сохраняя смысл тех, кто был оставлен или остался.
- source_word: non derelicti sunt
  choice: тех, кто не остался
  rationale: Сохраняет формальное противопоставление исходного текста, не уточняя судьбу этой группы сверх сказанного.
- source_word: haec interpretatio
  choice: Вот истолкование этого
  rationale: Передаёт ввод к последующему объяснению ясной и достойной современной формулировкой.
theological_decisions:
- issue: Неоднозначность derelicti sunt
  choice: оставшихся
  alternative: тех, кто оставлен
  rationale: Русское «оставшихся» допускает требуемую контекстом неоднозначность между уцелевшими и оставленными, не вводя явно действующего субъекта.
