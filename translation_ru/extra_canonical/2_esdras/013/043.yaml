translation_notes:
  register: Современный литературный русский язык; краткая, достойная повествовательная формулировка. Следующее предложение исходного фрагмента («Fecit enim eis tunc») не включено, поскольку оно относится к продолжению стиха/контекста за пределами предоставленного английского текста.
