  text: И они вошли в теснины реки Евфрата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angustos
  choice: теснины
  rationale: Субстантивированное прилагательное в винительном падеже множественного числа обозначает узкие места или проходы; русское «теснины» естественно и сохраняет пространственный образ.
- source_word: fluminis Eufratis
  choice: реки Евфрата
  rationale: Родительный падеж передан обычной русской конструкцией принадлежности/локализации.
- source_word: introierunt
  choice: вошли в
  rationale: Глагол движения с винительным объектом естественно передаётся по-русски как «вошли в».
