source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et accedebant ad eum vultus hominum multorum, quorumdam gaudentium, quorumdam tristantium, aliqui vero alligati, aliqui adducentes ex eis qui offerebantur. et egoa multitudine pavoris expergefactus sum et deprecatus sum Altissimum et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: ru
  text: 'И к нему приближалось множество человеческих лиц: одни радовались, другие печалились; одни были связаны, а другие приводили некоторых из тех, кого вели. Я пробудился от великого ужаса, обратился с мольбой к Всевышнему и сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vultus hominum multorum
  choice: множество человеческих лиц
  rationale: Сохраняет необычный зрительный образ латинского текста, но звучит естественнее буквального «лица многих людей».
- source_word: alligati
  choice: были связаны
  rationale: Передаёт пассивное состояние без уточнения вида уз или причины пленения.
- source_word: adducentes ex eis qui offerebantur
  choice: приводили некоторых из тех, кого вели
  rationale: Ex eis передано как «некоторых из тех», а offerebantur в данном контексте понято как ведение или выведение вперёд, без жертвенного оттенка.
- source_word: multitudine pavoris
  choice: от великого ужаса
  rationale: Естественная русская передача латинского выражения о чрезвычайной силе охватившего героя страха.
- source_word: deprecatus sum Altissimum
  choice: взмолился Всевышнему
  rationale: Передаёт настойчивое молитвенное обращение и сохраняет традиционное достоинство титула Altissimus.
theological_decisions:
- issue: Возможный жертвенный смысл offerebantur
  choice: кого вели
  alternative: кого приносили / кого представляли
  rationale: Контекст описывает движение людей к фигуре видения; поэтому пространственный смысл «вели, выводили вперёд» вероятнее и не вносит неявно отсутствующую идею жертвоприношения.
translation_notes:
  register: Современный литературный русский язык с возвышенным библейским тоном. Необычный образ множества лиц сохранён; синтаксис упрощён лишь настолько, чтобы стих был понятен при обычном чтении.
