source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: scito ergo, quoniam magis beatificati sunt qui derelicti super eos qui mortui sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/024.yaml
  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: ru
  text: 'Итак, знай: оставшиеся более блаженны, чем умершие.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  choice: Итак, знай
  rationale: Передаёт и выводное значение ergo, и прямое повеление scito естественным современным русским языком.
- source_word: magis beatificati sunt
  choice: более блаженны
  rationale: Сохраняет сравнительную степень magis и религиозно значимое beatificati, не сводя его лишь к субъективному счастью.
- source_word: qui derelicti
  choice: оставшиеся
  rationale: В данном противопоставлении умершим речь идёт о тех, кто остался в живых; краткая форма сохраняет естественность и не добавляет отсутствующего в латинском уточнения.
- source_word: qui mortui sunt
  choice: умершие
  rationale: Точно и ясно передаёт субстантивированное описание тех, кто умер.
theological_decisions:
- issue: Характер блаженства оставшихся
  choice: «более блаженны» без пояснения причины или рода блаженства
  alternative: «счастливее» или «находятся в более благословенном положении»
  rationale: Латинское beatificati допускает богословски насыщенное понимание; перевод сохраняет эту открытость и не объясняет её сверх текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и понятным построением; порядок фразы слегка адаптирован ради естественности.
