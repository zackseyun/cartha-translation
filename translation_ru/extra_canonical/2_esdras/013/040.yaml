  source_fidelity: Основной текст обоснованно следует восстановленному чтению «Осия», поддержанному сирийской, эфиопской и арабской версиями; сноска прозрачно фиксирует отличающееся латинское чтение Iosiae. Следует точнее передать направленность латинского in terram aliam как «в другую землю» и не придавать нарицательному flumen невыраженную прописную букву.
  naturalness: Фраза в целом понятна и соответствует современному литературному русскому. «Переправил их за реку» естественнее и яснее, чем конструкция с противопоставительным «а»; строчная буква в слове «реку» нормативна, поскольку название реки в источнике не дано.
