  text: terra sua in diebus Iosiae regis, quem captiuum duxit Salmanassar rex Assyriorum, et transtulit eos trans flumen, et translati sunt in terram aliam. Ipsi autem sibi dederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/040.yaml
  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: ru
  text: Это десять колен, которые были уведены в плен из своей земли во дни царя Осии[a]. Салманасар, царь ассирийцев, увёл его в плен и переправил их за реку, и они были переселены в другую землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В латинском тексте: «во дни царя Иосии». Однако сирийская, эфиопская и арабская версии читают «Осии», что соответствует историческому времени ассирийского пленения северных колен.'
    reason: textual_variant
lexical_decisions:
- source_word: terra sua
  choice: из своей земли
  rationale: Естественно передаёт исходный пункт изгнания и сохраняет притяжательное значение sua.
- source_word: captiuum duxit / transtulit
  choice: увёл в плен / переправил
  rationale: 'Различены два латинских глагольных выражения: пленение царя и перемещение колен за реку.'
- source_word: trans flumen
  choice: за Реку
  rationale: Определённая в контексте река — Евфрат; прописная буква сохраняет традиционное контекстуальное употребление без добавления отсутствующего в тексте названия.
- source_word: in terram aliam
  choice: в другой земле
  rationale: Передаёт результат переселения естественным современным русским выражением.
- source_word: Iosiae
  choice: Осии
  rationale: Основной текст следует вероятному авторскому чтению «Осия», засвидетельствованному древними дочерними версиями и соответствующему историческому контексту; латинское «Иосия» явно отмечено в сноске.
theological_decisions:
- issue: Имя царя при изгнании десяти колен
  choice: Осия в основном тексте с указанием латинского чтения в сноске
  alternative: Иосия в основном тексте
  rationale: Изгнание северных колен произошло при Осии; сирийская, эфиопская и арабская версии поддерживают это имя, тогда как латинское Iosiae, вероятно, возникло из-за переписческой ошибки. Сноска сохраняет прозрачность относительно непосредственного латинского источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «увёл в плен» сохранён ради смысловой связи с латинским текстом; местоимения «его» и «их» передают смену числа в quem и eos.
