  source_fidelity: 'Текст точно передаёт латинский оригинал: «с самого начала» соответствует ab initio, «показал» — demonstrasti, «эти чудеса» — mirabilia haec, а «счёл меня достойным того, чтобы Ты принял моё моление» сохраняет субъект susciperes во 2-м лице и синтаксическую связь с dignum me habuisti. Неоднозначность конструкции ut не устраняется догматически или чрезмерной перефразировкой.'
  naturalness: Перевод звучит естественно на современном литературном русском при уместно возвышенном библейском регистре. Оборот «рабу Твоему» нормативен в обращении к Богу; «моление» несколько возвышенно, но уместно и понятно в данном контексте.
  terminology: '«Моление» удачно передаёт deprecationem и поддерживает лексическую связь с предшествующим deprecari, отмеченную в английской аудиторской истории. Написание «Ты/Твоему» последовательно для молитвенного обращения. Дополнительная сноска не требуется: русская формулировка ясно обозначает, что принять моление должен адресат обращения.'
