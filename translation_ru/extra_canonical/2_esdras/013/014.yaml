source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ab initio demonstrasti servo tuo mirabilia haec et dignum me habuisti, ut susciperes deprecationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: ru
  text: Ты с самого начала показал рабу Твоему эти чудеса и счёл меня достойным того, чтобы Ты принял моё моление.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio
  choice: с самого начала
  rationale: Естественно передаёт исходную временную точку и сохраняет усилительный оттенок латинского выражения.
- source_word: demonstrasti
  choice: показал
  rationale: Современный и ясный эквивалент; «явил» здесь звучало бы более конфессионально и добавляло бы оттенок откровения, не обязательный в латинском тексте.
- source_word: mirabilia haec
  choice: эти чудеса
  rationale: Передаёт чудесные, необычайные явления без тяжеловесного «дивные вещи».
- source_word: dignum me habuisti
  choice: счёл меня достойным
  rationale: Формально и естественно отражает латинскую конструкцию со значением признания достойным.
- source_word: deprecationem meam
  choice: моё моление
  rationale: «Моление» сохраняет значение настойчивой смиренной просьбы и лексическую связь с глаголом deprecari в предыдущем стихе лучше, чем нейтральная «просьба».
- source_word: susciperes
  choice: Ты принял
  rationale: Сохраняет второе лицо единственного числа латинского глагола и ясно показывает, что принимает моление Бог, а не говорящий.
theological_decisions:
- issue: Кто принимает моление в придаточном предложении
  choice: Явно указано «Ты принял»
  alternative: «счёл меня достойным принять моё моление»
  rationale: Латинское susciperes стоит во втором лице единственного числа; явное местоимение устраняет возможную русскую двусмысленность, будто Ездра сам принимает собственное моление.
- issue: Отношение признания достойным к принятию моления
  choice: Сохранена целевая/изъяснительная конструкция «достойным того, чтобы»
  alternative: «удостоил меня, приняв моё моление»
  rationale: Основной текст не превращает латинское ut в однозначно причинную или временную связь и сохраняет напряжение исходного синтаксиса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «Твоему» и «Ты» написаны с прописной буквы как обращение к Богу. Синтаксис намеренно близок к латинскому, но остаётся понятным современному читателю.
