source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: ru
  text: 'После этого я увидел: вот, от четырёх ветров небесных собиралось неисчислимое множество людей, чтобы воевать с человеком, поднявшимся из моря.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi post haec
  choice: После этого я увидел
  rationale: Естественно передаёт последовательность видения, сохраняя значение латинского оборота.
- source_word: et ecce
  choice: вот
  rationale: Сохраняет вводящий новое зрелище указательный элемент, но избегает тяжеловесного буквального «и вот» после двоеточия.
- source_word: multitudo hominum, quorum non erat numerus
  choice: неисчислимое множество людей
  rationale: Передаёт не буквальное отсутствие числа, а невозможность сосчитать множество; по-русски звучит естественно и торжественно.
- source_word: de quattuor ventis caeli
  choice: от четырёх ветров небесных
  rationale: Сохраняет образ и направление движения из всех четырёх сторон небесного пространства, не подменяя метафору словом «стороны».
- source_word: ut debellarent
  choice: чтобы сразиться
  rationale: В контексте выступления множества против человека выражает намерение вступить с ним в войну; глагол «сразиться» естественнее буквального «воевать».
- source_word: hominem qui ascenderat de mari
  choice: с человеком, поднявшимся из моря
  rationale: Сохраняет определённого участника видения и завершённость предшествующего восхождения.
theological_decisions:
- issue: Обозначение фигуры, восходящей из моря
  choice: человек
  alternative: муж / Сын Человеческий
  rationale: Латинское hominem означает «человек» и в этом стихе не содержит титула; перевод не вводит мессианское толкование непосредственно в текст.
- issue: Образ четырёх ветров небесных
  choice: сохранён буквально
  alternative: со всех четырёх сторон света
  rationale: Буквальный образ допускает как географическое, так и космическое прочтение и не сужает символику видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, подходящим для апокалиптического видения строем. Двоеточие после «увидел» делает фразу ясной, а причастный оборот сохраняет компактность оригинала.
