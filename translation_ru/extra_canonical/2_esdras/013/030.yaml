lexical_decisions:
- source_word: Altissimus
  choice: Всевышний
  rationale: Традиционный и естественный русский эквивалент божественного титула в данном контексте.
- source_word: incipiet ... liberare
  choice: начнёт избавлять
  rationale: Сохраняет начинательное значение incipiet и широкий смысл liberare — освобождать или спасать от бедствия.
- source_word: eos qui super terram sunt
  choice: тех, кто живёт на земле
  rationale: Естественно передаёт латинское «тех, которые находятся на земле» без неясного для современного русского оборота «находятся на земле».
theological_decisions:
- issue: Характер действия, выраженного liberare
  choice: избавлять
  alternative: освобождать / спасать
  rationale: «Избавлять» сохраняет неопределённость относительно того, идёт ли речь об освобождении от власти, спасении от бедствия или иной форме избавления.
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная формулировка с сохранением будущего начинательного аспекта латинского текста.
