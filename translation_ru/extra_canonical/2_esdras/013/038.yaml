  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: ru
  text: которыми они начнут терпеть мучения и которые уподоблены пламени; и он без труда погубит их и закон[a], уподобленный огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в латинском тексте: «погубит их и закон». Возможное по смыслу прочтение — «погубит их законом», однако предлога «посредством» или «через» в источнике нет.'
    reason: Текстуально трудная конструкция допускает смысловое инструментальное толкование, но грамматическая форма источника требует сохранить координацию дополнений в основном тексте.
lexical_decisions:
- source_word: incipient cruciari
  choice: начнут мучиться
  rationale: Передаёт начинательный смысл incipient и страдательное значение cruciari без добавления невыраженного деятеля.
- source_word: adsimilatae sunt flammae
  choice: уподоблены пламени
  rationale: Сохраняет образное сравнение и страдательную форму латинского выражения.
- source_word: sine labore
  choice: без труда
  rationale: Прямо передаёт отсутствие усилия, не усиливая выражение до «одним словом» или «мгновенно».
- source_word: legem quae igni adsimilata est
  choice: закон, уподобленный огню
  rationale: Сохраняет accusativus legem и явное сравнение закона с огнём.
theological_decisions:
- issue: Синтаксическая роль «закона»
  choice: «погубит их и закон»
  alternative: «погубит их законом»
  rationale: В данном латинском тексте legem стоит в винительном падеже и присоединено союзом et, поэтому формально является ещё одним дополнением при perdet. Инструментальное прочтение теологически понятнее, но потребовало бы предлога или иной конструкции, отсутствующей в источнике.
- issue: Неуказанный деятель мучения
  choice: сохранена страдательная конструкция «они начнут мучиться»
  alternative: назвать того, кто будет их мучить
  rationale: Латинское cruciari не называет деятеля; перевод не должен восполнять его по толкованию.
translation_notes:
  register: Современный литературный русский язык; сохранены торжественная образность, обрывочная связь с предыдущим контекстом и трудный синтаксис латинского источника. Местоименные формы не получают искусственно добавленного antecedента.
