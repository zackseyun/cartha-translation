  yaml_path: translation/extra_canonical/2_esdras/013/007.yaml
  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: ru
  text: Я же пытался увидеть область или место, откуда была высечена гора, но не смог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaesivi videre
  choice: пытался увидеть
  rationale: Передаёт целенаправленную, но безуспешную попытку увидеть; в современном русском звучит естественнее буквального «искал увидеть».
- source_word: regionem vel locum
  choice: область или место
  rationale: Сохраняет два латинских обозначения и союз vel, не сводя их к одному понятию.
- source_word: unde sculptus esset mons
  choice: откуда была высечена эта гора
  rationale: Сохраняет пространственное unde и образ sculptus — горы, словно высеченной из некоего места; указательное «эта» естественно отсылает к горе из видения.
- source_word: et non potui
  choice: но не смог
  rationale: Латинское et здесь связывает попытку с её неудачей; русское «но» ясно и естественно выражает подразумеваемое противопоставление.
