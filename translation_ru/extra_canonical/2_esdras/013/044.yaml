  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: ru
  text: Ибо тогда Всевышний совершил знамения и сдержал потоки реки, пока они не переправились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшаяся и точная передача латинского титула Бога в современном литературном русском языке.
- source_word: signa
  choice: знамения
  rationale: Сохраняет библейское значение чудесных знаков, не сводя их просто к чудесам.
- source_word: statuit
  choice: остановил
  rationale: По контексту обозначает чудесное удержание или прекращение течения, чтобы народ смог перейти.
- source_word: uenas fluminis
  choice: русла реки
  rationale: Буквально uenae — «жилы, протоки»; «русла» естественно передаёт разветвлённые водные каналы без излишне буквального образа.
- source_word: usquequo transirent
  choice: пока они не переправились
  rationale: Передаёт временной предел действия и подразумеваемый переход через реку, не добавляя отдельного объекта к латинскому глаголу.
theological_decisions:
- issue: Божественный титул altissimus
  choice: Всевышний
  alternative: Всевышний Бог
  rationale: В исходном тексте отсутствует существительное «Бог», поэтому оно не добавлено.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством; синтаксис сделан естественным, при этом сохранены лаконичность и подразумеваемый объект глагола transirent.
