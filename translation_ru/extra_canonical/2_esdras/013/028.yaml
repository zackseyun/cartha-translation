source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: ru
  text: 'И то, что он не держал ни меча, ни оружия, но всё же сокрушил натиск множества людей, пришедших напасть на него, означает следующее:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: меча
  rationale: В данном контексте латинское framea обозначает меч; этот выбор также соответствует уточнённому английскому консультационному тексту.
- source_word: vas bellicosum
  choice: другого боевого оружия
  rationale: Буквально «военного орудия/предмета»; естественное русское соответствие — «боевое оружие». Добавление «другого» ясно передаёт конструкцию «ни меча, ни оружия», не представляя меч отдельной от оружия категорией.
- source_word: corrumpit ... impetum
  choice: сокрушил натиск
  rationale: Передаёт значение уничтожения или полного пресечения вражеского нападения и сохраняет энергичный образ оригинала.
- source_word: multitudinis
  choice: множества людей
  rationale: Латинское слово означает многочисленную массу или толпу; «множество людей» понятно и не добавляет отрицательной окраски слова «толпа».
- source_word: ad expugnare eum
  choice: сразиться с ним
  rationale: Передаёт направленное против него военное выступление; оборот естественен по-русски и не сужает смысл до единичного физического удара.
- source_word: haec interpretatio
  choice: имеет такое истолкование
  rationale: Связывает наблюдаемое знамение с последующим объяснением и естественно вводит продолжение после двоеточия.
theological_decisions:
- issue: Способ победы без оружия
  choice: Сохранено прямое противопоставление отсутствия оружия и сокрушения натиска без объяснения того, каким образом это произошло.
  alternative: Уточнить, что победа совершена словом, дыханием или сверхъестественной силой.
  rationale: Данный стих лишь вводит истолкование; конкретизация здесь преждевременно разрешила бы образ и внесла материал из контекста в сам стих.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Синтаксис сохранён как ввод к последующему истолкованию; двоеточие оставлено.
