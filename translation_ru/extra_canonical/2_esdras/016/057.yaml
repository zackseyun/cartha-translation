  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[verbo illius] … sunt'
  choice: Его словом утверждены
  rationale: 'Начало предложения в предоставленном латинском отрывке усечено: сохранилось лишь конечное sunt. Формулировка восстановлена по контексту засвидетельствованной латинской традиции и передаёт установление звёзд Божьим словом без излишнего уточнения способа действия.'
- source_word: nouit numerum stellarum
  choice: Он знает их число
  rationale: Nouit передано настоящим временем «знает», а повтор stellarum естественно заменён местоимением «их» после непосредственного упоминания звёзд.
theological_decisions:
- issue: К кому относится подразумеваемое действующее лицо
  choice: Местоимение «Он» с прописной буквы указывает на Бога
  alternative: «он» со строчной буквы
  rationale: Контекст описывает Божье творческое слово и совершенное знание звёзд; прописная буква соответствует dignified-регистру русского библейского текста, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и возвышенная, но понятная. Следующее относительное предложение «Qui scrutat abyssum et…» относится уже к последующему стиху и в данный текст не включено.
