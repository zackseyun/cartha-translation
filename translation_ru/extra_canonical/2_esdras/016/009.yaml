source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mala, et quis repell(et) ea? Exiet ignis ex iracundia eius, et quis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/009.yaml
  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: ru
  text: Бедствия — и кто отвратит их? Из гнева Его выйдет огонь — и кто угасит его?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: бедствия
  rationale: Субстантивированное среднее множественное число означает «зло, беды, бедствия»; в контексте грядущих кар «бедствия» звучит естественно и сохраняет множественное число.
- source_word: repellet
  choice: отвратит
  rationale: Будущее время от repellere передаёт действие «отразить, отвести, не допустить»; «отвратит бедствия» соответствует возвышенному, но понятному библейскому регистру.
- source_word: Exiet
  choice: выйдет
  rationale: Будущее время от exire означает «выйдет, явится вовне»; русский глагол не создаёт присущей английскому go out двусмысленности со значением «погаснуть».
- source_word: ignis ex iracundia eius
  choice: из гнева Его выйдет огонь
  rationale: Сохранены образ огня, исходящего из Божьего гнева, и исходное отношение ex «из» без дополнительного толкования.
- source_word: quis
  choice: кто
  rationale: 'Прямо сохраняет риторический вопрос и подразумеваемый ответ: никто.'
theological_decisions:
- issue: Образ огня, исходящего из Божьего гнева
  choice: Из гнева Его выйдет огонь
  alternative: Огонь Его гнева вспыхнет
  rationale: Выбранный вариант сохраняет исходную конструкцию ex iracundia eius и не превращает её в более интерпретирующую метафору принадлежности.
- issue: Подразумеваемая невозможность угасить огонь
  choice: кто угасит его?
  alternative: кто сможет угасить его?
  rationale: Без добавления модального «сможет» риторическая сила и лаконизм исходного вопроса передаются точнее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллельные риторические вопросы и краткость латинского текста сохранены; местоимение «Его» написано с прописной буквы как указание на Бога в данном контексте.
