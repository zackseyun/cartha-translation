  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: ru
  text: Виноград отдаст себя для сбора урожая, и кто соберёт его?[a] Ведь местами будет великое запустение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто свяжет его?»; возможно также: «кто соберёт его в связки?»'
    reason: Сохраняет прямое значение латинского adligabit и отмечает не вполне ясный сельскохозяйственный образ.
lexical_decisions:
- source_word: uva
  choice: виноград
  rationale: Латинское единственное число употреблено собирательно; «виноград» естественно передаёт образ урожая, тогда как «виноградина» здесь было бы слишком узко.
- source_word: tradet se ad vindemiam
  choice: отдаст себя для сбора урожая
  rationale: Сохранена выразительная персонификация tradet se («отдаст себя»), а vindemia передана как сбор виноградного урожая.
- source_word: adligabit
  choice: соберёт
  rationale: Основное значение глагола — «свяжет, соединит»; в контексте винограда речь, вероятно, идёт о собирании гроздей. Более буквальный вариант вынесен в примечание, чтобы не скрывать лексическую неоднозначность.
- source_word: desertio multa
  choice: великое запустение
  rationale: Прилагательное multa согласуется с desertio и указывает на большую степень запустения, а не обязательно на множество мест.
- source_word: locis
  choice: в разных местах
  rationale: Неопределённое множественное число естественно передано по-русски без неуместного определённого артиклевого оттенка.
