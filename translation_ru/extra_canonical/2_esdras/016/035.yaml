  text: earum non habentes adiutorium. Sponsi earum in bello consumentur, et uiri earum in fame exterentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/035.yaml
  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: ru
  text: Не имея помощи, их женихи погибнут на войне, а их мужья будут истреблены голодом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non habentes adiutorium
  choice: не имея помощи
  rationale: Сохраняет присоединённую причастную конструкцию и смысл отсутствия помощи, не уточняя, кто именно её не имеет, поскольку латинская формулировка допускает синтаксическую неоднозначность.
- source_word: sponsi earum
  choice: их женихи
  rationale: Прямо передаёт sponsi как «женихи» и сохраняет притяжательное earum.
- source_word: in bello consumentur
  choice: погибнут на войне
  rationale: Естественно по-русски передаёт будущую пассивную форму со значением уничтожения или гибели в войне.
- source_word: uiri earum
  choice: их мужья
  rationale: В данном параллелизме uiri обозначает мужей женщин, в отличие от sponsi — женихов.
- source_word: in fame exterentur
  choice: будут истреблены голодом
  rationale: Сохраняет сильный пассивный образ exterentur и инструментальный смысл fame.
