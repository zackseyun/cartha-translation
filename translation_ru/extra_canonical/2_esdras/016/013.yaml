  source_fidelity: 'Основной смысл передан верно: сильная правая рука натягивает лук, острые стрелы исходят от Него и не оказываются бездейственными, когда их начинают выпускать. Однако «не дадут промаха» несколько сужает латинское non deficient до точного попадания; глагол deficient в данном образе допускает более широкое значение «не окажутся тщетными / не подведут».'
