  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: ru
  text: Ибо сильна Его правая рука, натягивающая лук; остры Его стрелы, которые Он выпускает, и, когда их начнут выпускать, они не окажутся тщетными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortis dextera eius
  choice: сильна Его правая рука
  rationale: Сохраняет образ и структуру латинского текста в естественной для русского языка форме.
- source_word: arcum tendit
  choice: натягивающая лук
  rationale: Точно передаёт действие подготовки лука к выстрелу.
- source_word: ab ipso mittuntur
  choice: Он выпускает
  rationale: В контексте стрельбы из лука mittuntur естественно передаётся глаголом «выпускает»; активная конструкция по-русски звучит яснее, не меняя деятеля.
- source_word: non deficient
  choice: не дадут промаха
  rationale: В контексте стрел передаёт образное значение «не подведут, не минуют цели», сохраняя при этом результативность действия.
- source_word: cum coeperint mitti
  choice: когда их начнут выпускать
  rationale: Сохраняет начинательное значение coeperint и пассивную неопределённость относительно непосредственного исполнителя.
theological_decisions:
- issue: Референт местоимения eius / ipso
  choice: Его / Он с прописной буквы
  alternative: его / он со строчной буквы
  rationale: Контекст представляет действующим лицом Бога; прописная буква соответствует русской библейской издательской традиции, не добавляя нового содержания.
- issue: Степень определённости non deficient
  choice: не дадут промаха
  alternative: не подведут / не ослабеют
  rationale: Стрелковый контекст поддерживает значение достижения цели, хотя латинский глагол шире; выбран естественный русский образ без добавления объекта «цель».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Параллелизм двух частей сохранён; синтаксис слегка сглажен для естественного чтения.
