  yaml_path: translation/extra_canonical/2_esdras/016/043.yaml
  text: and the one who buys, like one who is about to lose; and the one who trades, like one who will gain no profit;
translation:
  language: ru
  text: и покупающий — словно тот, кому предстоит потерять; и торгующий — словно тот, кто не получит прибыли;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский текст обрывается после слов «и торгующий — словно тот, кто…». Окончание «не получит прибыли» передано по засвидетельствованному в английском консультационном тексте восстановлению; его следует сверить с полным латинским текстом издания.
    reason: Необходимо явно отметить, что в предоставленном оригинальном фрагменте окончание второй части отсутствует, а не выдавать дополнение за непосредственно засвидетельствованное чтение.
lexical_decisions:
- source_word: emit
  choice: покупающий
  rationale: Точно передаёт значение латинского emere «покупать» и сохраняет отличие от следующего mercatur «торгует».
- source_word: perditurus
  choice: кому предстоит потерять
  rationale: 'Передаёт активное значение будущего причастия: покупающий вскоре понесёт утрату; объект потери в латинском не назван.'
- source_word: mercatur
  choice: торгующий
  rationale: Естественный русский эквивалент латинского глагола со значением «вести торговлю, торговать».
theological_decisions:
- issue: Эсхатологическое обесценивание обычной хозяйственной деятельности
  choice: Сохранены параллельные сравнения без уточнения причины и вида потери.
  alternative: Пояснить, что имущество будет утрачено из-за грядущего бедствия.
  rationale: Латинский текст рисует напряжённую картину близкой утраты, но сам в этой строке не объясняет её и не называет конкретного события.
translation_notes:
  register: Современный литературный русский язык; лаконичный и торжественный пророческий ритм поддержан параллельной конструкцией «и … — словно тот, кто…». Объект при «потерять» намеренно не добавлен.
