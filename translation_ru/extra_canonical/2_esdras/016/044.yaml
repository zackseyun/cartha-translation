  text: and the one who sows, like one who will not reap; so also the one who prunes the vines, like one who will not gather the grapes.
translation:
  language: ru
  text: сеющий — как тот, кому не предстоит жать; и обрезающий виноградные лозы — как тот, кому не предстоит собирать виноград.
