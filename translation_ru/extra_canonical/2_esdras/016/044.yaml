lexical_decisions:
- source_word: Qui seminat
  choice: сеющий
  rationale: Передаёт латинское обозначение действующего лица естественным и сжатым русским причастием.
- source_word: quasi qui non metat
  choice: как тот, кому не предстоит жать
  rationale: Сохраняет сравнительную конструкцию и ожидаемое, но не состоявшееся действие; «жать» точно соответствует metere.
- source_word: qui putat
  choice: обрезающий виноградные лозы
  rationale: Латинское putare в данном параллелизме означает обрезку виноградной лозы; дополнение делает значение ясным по-русски.
- source_word: quasi non uindemiaturus
  choice: как тот, кому не предстоит собирать виноград
  rationale: Vindemiare означает собирать урожай винограда; формулировка сохраняет будущую перспективу латинского причастия.
