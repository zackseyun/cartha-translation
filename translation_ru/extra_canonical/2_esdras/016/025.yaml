  text: Не останется земледельца, который возделывает землю и засевает её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: agricola
  choice: земледелец
  rationale: Латинское agricola обозначает человека, обрабатывающего землю; «земледелец» точно передаёт эту конкретную характеристику, не обобщая её до «никто».
- source_word: colit terram
  choice: возделывал бы землю
  rationale: Colere terram в данном контексте означает обрабатывать, возделывать землю; сослагательная форма по-русски естественно зависит от отрицательной конструкции «не останется».
- source_word: seminat eam
  choice: засевал её
  rationale: Местоимение eam относится к terram; «засевать землю» естественно передаёт продолжающийся земледельческий труд, выраженный настоящим временем в латинском.
