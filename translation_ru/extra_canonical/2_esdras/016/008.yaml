translation:
  language: ru
  text: Сильный лучник выпустил стрелу — кто повернёт её вспять? Господь Бог посылает бедствия[a] — кто отвратит их?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастья»; латинское слово может также означать «зло».'
    reason: Отмечает смысловой диапазон mala и сохраняет лексическую и богословскую неоднозначность.
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: сильный лучник выпустил стрелу
  rationale: Латинская пассивная конструкция передана естественной русской активной конструкцией без изменения смысла.
- source_word: Dominus deus
  choice: Господь Бог
  rationale: Традиционное и точное соответствие латинскому титулу.
- source_word: mala (по контексту засвидетельствованного полного текста стиха)
  choice: бедствия
  rationale: В данном ряду образов речь идёт о ниспосылаемых карах и несчастьях; «бедствия» естественно передаёт контекстуальное значение, не утверждая, что Бог творит нравственное зло.
- source_word: quis ... avertet
  choice: кто отвратит их?
  rationale: «Отвратить» сохраняет образ неотвратимо надвигающихся бедствий и высокий, но понятный современному читателю регистр.
theological_decisions:
- issue: Утверждение о том, что Бог посылает mala
  choice: Господь Бог насылает бедствия
  alternative: Господь Бог посылает зло
  rationale: Выбор «бедствия» сохраняет прямое действие Бога в тексте, но передаёт вероятное контекстуальное значение mala как несчастий или кар, не снимая напряжения утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; параллелизм двух риторических вопросов сохранён. Добавлено «назад» для естественной передачи идеи возвращения уже выпущенной стрелы.
