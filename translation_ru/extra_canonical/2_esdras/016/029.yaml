  yaml_path: translation/extra_canonical/2_esdras/016/029.yaml
  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: ru
  text: Ибо из города останутся десять человек, а из сельской местности[a] — двое, укрывшиеся в лесу и в расщелинах скал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с поля» или «из поля».'
    reason: Отмечает более буквальное значение ex agro, сохраняя возможность понимать ager как поле, тогда как основной текст передаёт контекстуальное противопоставление городу.
lexical_decisions:
- source_word: relinquentur
  choice: останутся
  rationale: Передаёт пассивно-результативный смысл «будут оставлены / останутся» естественным русским выражением без уточнения неназванного деятеля.
- source_word: de civitate
  choice: от города
  rationale: 'Сохраняет исходную конструкцию происхождения или остатка от некоторой совокупности: десять останутся от города.'
- source_word: ex agro
  choice: из сельской местности
  rationale: В данном противопоставлении городу ager обозначает негородскую местность; буквальное «с поля» по-русски могло бы неоправданно сузить смысл.
- source_word: in silva
  choice: в лесу
  rationale: Обычное и точное соответствие латинскому silva; не добавляет отсутствующего в источнике значения густоты.
- source_word: in fissuras petrarum
  choice: в расщелинах скал
  rationale: Естественно передаёт место укрытия; латинское направление после in по смыслу результата укрытия по-русски выражается предложным падежом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Человек» добавлено после числительного для ясности и естественности; во второй части оно подразумевается. Форма «укроются» передаёт будущий результат латинского absconderint в контексте пророчества.
