  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: ru
  text: Он распростёр небо, словно сводчатый чертог, и утвердил его на водах; Он устроил источники вод в пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fundauit
  choice: утвердил
  rationale: Передаёт образ прочного основания или утверждения, сохраняя возвышенный библейский регистр.
- source_word: posuit
  choice: устроил
  rationale: В данном контексте естественно выражает то, что Бог поместил и установил источники в пустыне; буквальное «поставил» по-русски звучало бы неестественно.
- source_word: fontes aquarum
  choice: источники вод
  rationale: Сохраняет формальную образность и множественное число латинского текста, не сводя выражение к разговорному «водные источники».
- source_word: in deserto
  choice: в пустыне
  rationale: Прямое и естественное соответствие латинскому выражению.
