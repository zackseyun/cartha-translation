id: 2ES.16.24
reference: 2 Esdras 16:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et mortui quasi stercora proicientur, et non habent qui consolentur eos. et derelinquetur deserta terra, et civitates eius demolientur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: ru
  text: И мёртвых выбросят, как навоз, и некому их утешить. Земля будет оставлена в запустении, и города её будут разрушены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortui
  choice: мёртвых
  rationale: Субстантивированное прилагательное передано естественным русским обозначением умерших; винительный падеж обусловлен пассивной конструкцией «выбросят».
- source_word: quasi stercora
  choice: как навоз
  rationale: Сохраняет резкое и уничижительное сравнение латинского текста без смягчения; латинское множественное число допускает собирательное русское «навоз».
- source_word: proicientur
  choice: выбросят
  rationale: Неопределённо-личная активная конструкция звучит естественнее буквального пассива и точно передаёт будущее действие.
- source_word: non habent qui consolentur eos
  choice: некому будет их утешить
  rationale: Естественная русская передача отсутствия человека, который мог бы их утешить; будущее время согласовано с пророческим контекстом, при том что латинская форма habent морфологически настоящая.
- source_word: derelinquetur deserta terra
  choice: земля останется опустошённой
  rationale: Передаёт результат оставления и состояние запустения, сохраняя будущую перспективу.
- source_word: civitates eius demolientur
  choice: города её будут разрушены
  rationale: Demolientur означает снос или разрушение; пассив сохранён, а местоимение «её» ясно относится к земле.
theological_decisions:
- issue: К кому относится местоимение eos («их»)
  choice: к мёртвым
  alternative: к неуказанной группе людей
  rationale: Ближайший грамматический антецедент — mortui; перевод сохраняет эту прямую связь.
- issue: Связь между отсутствием утешителя и опустошением земли
  choice: два последовательных утверждения
  alternative: 'причинная связь: «ибо земля…»'
  rationale: Латинское et выражает сочинение и само по себе не устанавливает причинного отношения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Резкий образ «как навоз» сохранён. Синтаксис разделён на два предложения в соответствии с пунктуацией издания и для ясности.
