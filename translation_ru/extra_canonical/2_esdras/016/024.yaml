review_pass:
  verdict: revise
  source_fidelity: 'Требуется исправление времени в «некому будет их утешить»: латинское non habent — настоящее время («не имеют»), хотя окружающие глаголы стоят в будущем. Остальная передача в целом верна: proicientur передано как будущее неопределённо-личное действие, quasi stercora сохраняет резкое сравнение, а сочинительная связь между фразами не превращена в причинную.'
  naturalness: Текст звучит естественно для современного литературного русского. Формула «некому их утешить» без будущего «будет» естественна и сохраняет настоящее время оригинала. «Будет оставлена в запустении» несколько точнее выражает derelinquetur deserta, чем «останется опустошённой», сохраняя нормальный русский синтаксис.
  terminology: «Мёртвых», «навоз», «утешить», «земля», «города» не требуют специальной терминологической замены. «Разрушены» адекватно передаёт demolientur. Сноска английского аудиторского следа не относится к русскому тексту и не должна переноситься без самостоятельного русского текстологического основания.
  issues:
  - severity: medium
    issue: Будущее время в «некому будет их утешить»
    rationale: Non habent — настоящее изъявительное, субъектом которого являются mortui. Будущее «будет» сглаживает это грамматическое различие и повторяет ход, уже отвергнутый в английском аудиторском следе.
  - severity: low
    issue: «Останется опустошённой» менее прямо передаёт derelinquetur
    rationale: Derelinquetur означает «будет оставлена», а deserta характеризует оставленную землю как пребывающую в запустении. «Будет оставлена в запустении» сохраняет оба компонента без неестественной буквальности.
  revised_text: И мёртвых выбросят, как навоз, и некому их утешить. Земля будет оставлена в запустении, и города её будут разрушены.
