lexical_decisions:
- source_word: timeatis
  choice: бойтесь
  rationale: Прямое и естественное соответствие латинскому глаголу timeo в данном запрете.
- source_word: haesitemini
  choice: колеблитесь
  rationale: Передаёт нерешительность и замешательство, не сужая значение до сомнения в истинности.
- source_word: dux
  choice: путеводитель
  rationale: В контексте пути и Божьего водительства передаёт того, кто ведёт; более естественно по-русски, чем буквальное «вождь».
theological_decisions:
- issue: Характер Божьего водительства в слове dux
  choice: Бог — ваш путеводитель
  alternative: Бог — ваш предводитель
  rationale: Выбрана формулировка, сохраняющая основную идею Бога как ведущего и не привносящая без необходимости преимущественно военного оттенка.
