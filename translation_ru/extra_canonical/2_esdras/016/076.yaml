review_pass:
  verdict: revise
  source_fidelity: «Не бойтесь» точно передаёт латинское ne timeatis. «Не колеблитесь» удачно сохраняет значение haesitemini («не медлите, не проявляйте нерешительности») без сведения его к интеллектуальному сомнению. Однако «путеводитель» в современном русском обычно означает книгу/справочник, а не того, кто ведёт; для латинского dux требуется обозначение ведущего лица.
  naturalness: Фраза кратка и естественна. Союз «ибо» лучше поддерживает торжественно-наставительный регистр оригинала, чем нейтральное «потому что».
  terminology: «Предводитель» передаёт dux как того, кто ведёт, не добавляя конкретно военного смысла и не вызывая современных политических ассоциаций, возможных у слова «вождь».
  issues:
  - severity: medium
    issue: «Путеводитель» для dux
    rationale: В современном литературном русском «путеводитель» преимущественно называет издание, содержащее сведения о местности или маршруте. Это неестественно применительно к Богу как к ведущему лицу и ослабляет прямое значение латинского dux.
  revised_text: Не бойтесь и не колеблитесь, ибо Бог — ваш предводитель.
