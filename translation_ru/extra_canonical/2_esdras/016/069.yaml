revisions:
- from: И вот, против вас, великое множество, разгорается пламя гнева. Вас будут хватать, и некоторых из вас станут кормить мясом, принесённым в жертву идолам.[a][b]
  to: И вот, против вас — великого множества — разгорается пламя гнева. Вас будут хватать и некоторых из вас станут кормить мясом, принесённым в жертву идолам.[a][b]
  rationale: Исправлено только оформление обращения к «великому множеству» и прояснена русская формулировка альтернативы в сноске. Основной перевод сохраняет выверенное по английскому аудиту понимание идоложертвенного мяса и не переносит заклание на самих адресатов.
