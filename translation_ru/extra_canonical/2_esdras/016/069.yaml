  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: ru
  text: И вот, против вас — великого множества — разгорается пламя гнева. Вас будут хватать и некоторых из вас станут кормить мясом, принесённым в жертву идолам.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сжатый латинский текст допускает и другое понимание: некоторых хватают и убивают в связи с идольским культом либо, убив, скармливают идолам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и, убив вас, отдадут идолам на съедение».'
    reason: previous_rendering
lexical_decisions:
- source_word: Ecce enim
  choice: И вот
  rationale: Передаёт вводное указание на близкую угрозу естественно для современного русского языка; латинское enim здесь не требует отдельного причинного союза.
- source_word: incenditur ardor super uos
  choice: против вас … разгорается пламя гнева
  rationale: Сохраняет образ воспламенения и враждебную направленность super vos; слово «гнева» выражает подразумеваемый характер ardor в данном контексте.
- source_word: turba copiosae
  choice: великое множество
  rationale: Передаёт обращение к многочисленной группе, как в проверенном консультационном слое; форма латинского текста синтаксически шероховата.
- source_word: et rapient
  choice: Вас будут хватать
  rationale: Естественная русская передача будущего времени и насильственного действия rapient.
- source_word: cibabunt … [carne] idolis occisa
  choice: некоторых из вас станут кормить мясом, принесённым в жертву идолам
  rationale: 'Передаёт вероятный смысл с подразумеваемым «мясом»: схваченных принуждают есть идоложертвенное. Дополнение «некоторых» следует аудированному английскому слою, поскольку предоставленная латинская цитата обрывается после et rapient.'
theological_decisions:
- issue: Связь убийства/заклания с людьми или с жертвенным мясом
  choice: Заклание относится к мясу, принесённому идолам
  alternative: Схваченных убивают при идольском культе или после убийства отдают идолам как пищу
  rationale: Исторический контекст принуждения к употреблению идоложертвенного и вероятное подразумеваемое carnem поддерживают основной вариант, однако сжатый и трудный латинский текст допускает альтернативное прочтение, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Длинная латинская конструкция разделена на два предложения ради ясности; неоднозначность заключительной фразы сохранена в сносках.
