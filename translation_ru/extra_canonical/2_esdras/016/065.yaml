  text: Therefore the Lord will search out all their works and will expose you all. And you
translation:
  language: ru
  text: Господь исследует все их дела и обличит всех вас. И вы…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinabit
  choice: исследует
  rationale: Передаёт тщательное рассмотрение и проверку без добавления отсутствующего в латинском усиления.
- source_word: omnia opera eorum
  choice: все их дела
  rationale: Естественное и точное соответствие латинскому выражению; сохраняется местоименное различие между «их» и последующим «вас».
- source_word: traducet
  choice: обличит
  rationale: В данном контексте означает публично вывести на свет и подвергнуть позору; «обличит» естественно передаёт разоблачительный и судебный оттенок.
- source_word: Et uos
  choice: А вы…
  rationale: Сохраняет незавершённый переход к следующему стиху; многоточие обозначает синтаксический обрыв в границе данного фрагмента.
theological_decisions:
- issue: Подлежащее при scrutinabit
  choice: Господь
  alternative: он
  rationale: В предоставленном латинском отрывке подлежащее грамматически подразумевается, а контекст, отражённый в проверенном консультационном слое, отождествляет его с Господом; явное наименование обеспечивает ясность по-русски.
- issue: Характер действия traducet
  choice: обличит
  alternative: выставит на всеобщее обозрение
  rationale: «Обличит» сохраняет возможность как разоблачения, так и осуждающего публичного выявления, не уточняя сверх источника способ или меру наказания.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный. Различие «их дела» / «всех вас» сохранено. Конечное «А вы…» намеренно оставлено незавершённым, поскольку латинский текст стиха заканчивается переходом Et uos к продолжению.
