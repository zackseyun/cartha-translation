  text: Or can anyone turn back an arrow shot by a strong archer?
translation:
  language: ru
  text: Или разве можно повернуть назад стрелу, пущенную сильным лучником?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: повернуть назад
  rationale: Передаёт идею обратного движения или отражения уже выпущенной стрелы, сохраняя риторический образ латинского текста.
- source_word: sagittam inmissam
  choice: стрелу, пущенную
  rationale: Естественное русское соответствие для стрелы, уже выпущенной лучником.
- source_word: a sagittario forte
  choice: сильным лучником
  rationale: Forte согласуется с sagittario и характеризует лучника как сильного; форма творительного падежа естественно передаёт латинскую конструкцию с деятелем.
theological_decisions:
- issue: Риторическая невозможность обратить уже совершившееся действие
  choice: Или разве можно... ?
  alternative: Или может ли кто-нибудь... ?
  rationale: Безличная конструкция естественна по-русски и сохраняет подразумеваемый отрицательный ответ, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык; краткий, образный и достойный риторический вопрос. Слово «лучник» общеупотребительно и точно передаёт sagittarius.
