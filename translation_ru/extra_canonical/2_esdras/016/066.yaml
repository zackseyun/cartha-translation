source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: ru
  text: Вы будете посрамлены, когда ваши грехи обнаружатся перед людьми, а ваши беззакония в тот день выступят обвинителями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: вы будете посрамлены
  rationale: Передаёт будущее состояние стыда и публичного позора в возвышенном, но понятном современном русском регистре.
- source_word: processerint
  choice: обнаружатся
  rationale: В контексте грехов означает их выход наружу и явное раскрытие; «обнаружатся» естественно передаёт публичное выявление, не снижая торжественного тона.
- source_word: coram hominibus
  choice: перед людьми
  rationale: Прямой и естественный эквивалент латинского выражения публичности.
- source_word: iniquitates
  choice: беззакония
  rationale: Сохраняет отличие от peccata («грехи») и передаёт нравственно-правовой оттенок слова.
- source_word: accusatores stabunt
  choice: выступят обвинителями
  rationale: Передаёт персонификацию беззаконий как обвинителей и смысл их выступления против человека на суде.
- source_word: in die illo
  choice: в тот день
  rationale: Сохраняет эсхатологическую формулу источника без дополнительного истолкования.
theological_decisions:
- issue: Персонификация беззаконий на суде
  choice: беззакония ... выступят обвинителями
  alternative: беззакония будут свидетельствовать против вас
  rationale: Источник прямо называет беззакония обвинителями; перевод сохраняет образ и не заменяет его более узким образом свидетельства.
- issue: Характер «того дня»
  choice: в тот день
  alternative: в Судный день
  rationale: Латинский текст не называет день прямо Судным; сохранена намеренная формульность и возможная смысловая широта.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим оттенком. Синтаксис сделан естественным, при этом сохранены параллелизм, публичное раскрытие грехов и судебная персонификация беззаконий.
