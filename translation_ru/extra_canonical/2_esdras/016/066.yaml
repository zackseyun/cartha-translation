  verdict: approve
  source_fidelity: «Вы будете посрамлены» точно передаёт confusi eritis. «Когда ваши грехи обнаружатся перед людьми» естественно выражает публичное выявление, заключённое в cum processerint peccata uestra coram hominibus. «Ваши беззакония в тот день выступят обвинителями» сохраняет судебную персонификацию iniquitates ... accusatores stabunt и эсхатологическую неопределённость in die illo.
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя уместный торжественный и судебно-апокалиптический регистр. Параллелизм частей не перегружен буквальным синтаксисом.
  terminology: Различение peccata («грехи») и iniquitates («беззакония») сохранено. «Посрамлены» и «обвинители» соответствуют возвышенному библейскому регистру. Формула «в тот день» не навязывает интерпретацию «Судный день».
