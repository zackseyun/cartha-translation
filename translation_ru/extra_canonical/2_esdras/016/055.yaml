  text: 'omnia opera hominis et adinuentiones illorum et cogitatum illorum et corda illorum. Qui dixit: fiat terra, et facta est :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/055.yaml
  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: ru
  text: 'все дела людей, их замыслы, мысли и сердца. Тот, кто сказал: «Да будет создана земля», — и она была создана;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opera hominis
  choice: дела людей
  rationale: Передаёт совокупное значение латинского выражения естественно для современного русского; единственное hominis здесь имеет обобщающий смысл.
- source_word: adinventiones illorum
  choice: их замыслы
  rationale: Adinventiones обозначает придуманные намерения или затеи; «замыслы» сохраняет смысл и достоинство стиля.
- source_word: cogitatum illorum
  choice: мысли
  rationale: По смыслу это внутренние размышления людей; перевод исправляет нестандартную латинскую форму без излишнего уточнения.
- source_word: corda illorum
  choice: сердца
  rationale: Сохраняется библейская антропологическая образность латинского corda, без сведения значения только к чувствам.
- source_word: Qui dixit
  choice: Тот, кто сказал
  rationale: Относительное предложение, вероятно продолжающее характеристику Господа из предыдущего стиха; русский вариант сохраняет зависимость и границу исходного фрагмента.
- source_word: fiat terra
  choice: Да будет создана земля
  rationale: Пассивный юссив fiat передан явно, без замены формулой «да будет земля», которая могла бы ослабить значение создания.
- source_word: et facta est
  choice: и она была создана
  rationale: Сохраняет словесный повтор facere и пассивную форму исходника.
theological_decisions:
- issue: Подлежащее относительного оборота Qui dixit
  choice: «Тот, кто сказал» без явного добавления «Господь»
  alternative: «Господь, который сказал»
  rationale: В данном исходном фрагменте имя Господа отсутствует и восстанавливается лишь из предыдущего стиха; перевод не должен молча добавлять его в границы 16:55.
translation_notes:
  register: Современный литературный русский с библейски достойным звучанием. Сохранена фрагментарная связь начала стиха с предыдущим контекстом и точка с запятой в конце, указывающая на продолжение предложения.
