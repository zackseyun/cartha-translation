  source_fidelity: 'Текст точно передаёт предоставленный латинский фрагмент: omnia opera hominis — «все дела людей»; adinventiones — «замыслы»; cogitatum — «мысли»; corda — «сердца». Относительный оборот Qui dixit сохранён без внесения в текст имени Господа, которого в границах данного стиха нет. Fiat terra и et facta est последовательно переданы как повелительное создание земли и его исполнение.'
  naturalness: Русский текст литературный и ясный. Начальная строчная буква, фрагментарное начало и завершающая точка с запятой правомерно сохраняют синтаксическую зависимость от предыдущего стиха. Формула «Да будет создана земля» звучит достойно и понятно в библейском регистре.
  terminology: «Сердца» сохраняет библейскую антропологическую многозначность; «замыслы» удачно передаёт adinventiones без ненужной оценочной окраски. «Создана» в обоих случаях сохраняет повтор латинского facere. Английская помета отражает прежнюю ошибочную разбивку и не требует русского подстрочного знака в исправленном тексте.
