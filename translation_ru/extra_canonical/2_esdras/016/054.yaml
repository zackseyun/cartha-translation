review_pass:
  verdict: revise
  source_fidelity: Латинское conburet — переходная форма будущего времени, и перевод правильно сохраняет подразумеваемого деятеля и «огненные угли» как прямое дополнение. Однако super caput означает «на голову / на голове», а не «над головой»; последнее меняет пространственное отношение.
  naturalness: «Он будет жечь огненные угли» намеренно необычно, но допустимо как буквальное сохранение трудного образа источника. «Перед Богом и Его славой» несколько естественнее для современного литературного русского, не устраняя исходного необычного соположения.
  terminology: «Согрешил», «Господь» и «слава» переданы последовательно и соответствуют библейскому регистру. Сноска к невыраженному подлежащему уместна и не выдаёт вероятное отождествление с Господом за несомненное.
