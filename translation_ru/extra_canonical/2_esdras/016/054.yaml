source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: ru
  text: 'Ибо Он[a] будет жечь огненные угли на голове того, кто говорит: «Я не согрешил перед Богом и Его славой». Вот, Господь знает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте подлежащее не названо прямо; вероятно, имеется в виду Господь.
    reason: source_ambiguity
lexical_decisions:
- source_word: carbones ignis
  choice: огненные угли
  rationale: Прямо передаёт латинское сочетание «угли огня» естественным для современного русского языка выражением.
- source_word: conburet
  choice: будет жечь
  rationale: 'Сохраняет будущее время и переходное значение латинского глагола: угли выступают прямым дополнением, а не подлежащим.'
- source_word: coram deo et gloria ipsius
  choice: пред Богом и славой Его
  rationale: Сохраняет необычное согласованное построение источника, не устраняя возможное смысловое напряжение между Богом и Его славой.
- source_word: Ecce dominus cognoscit
  choice: Вот, Господь знает
  rationale: Кратко и прямо передаёт указательную частицу ecce и настоящее время cognoscit.
theological_decisions:
- issue: Неявное подлежащее при conburet
  choice: Он
  alternative: огненные угли будут гореть
  rationale: Форма conburet — 3-е лицо единственного числа будущего времени переходного глагола; carbones является прямым дополнением. Местоимение обозначает подразумеваемого деятеля, вероятнее всего Господа, названного в следующем предложении, но сноска отмечает, что в латинском тексте подлежащее прямо не выражено.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной библейской интонации. Необычный образ действия — жечь угли над головой — оставлен без поясняющей переформулировки, чтобы не подменять синтаксис и образность латинского источника.
