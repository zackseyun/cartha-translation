  text: donec consumat fundamenta terrae. Quemadmodum non redit sagitta missa a sagittario ualido, sic non reuertentur mala quae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: ru
  text: пока не уничтожит основания земли. Как стрела, пущенная могучим лучником, не возвращается, так не возвратятся и бедствия, посланные на землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagitta missa
  choice: стрела, выпущенная
  rationale: Естественно передаёт образ пущенной стрелы и сохраняет пассивную конструкцию оригинала.
- source_word: sagittario ualido
  choice: сильным лучником
  rationale: Прямо передаёт физическую силу и искусность, подразумеваемые латинским validus, не усиливая образ дополнительными толкованиями.
- source_word: mala
  choice: бедствия
  rationale: В данном контексте речь идёт не о нравственном зле, а о губительных событиях; «бедствия» ясно и естественно передаёт этот смысл.
- source_word: non reuertentur
  choice: не возвратятся
  rationale: Сохраняет повтор глагола «возвращаться» в сравнении и выражает необратимость посланных бедствий.
theological_decisions:
- issue: Необратимость посланных бедствий
  choice: не возвратятся
  alternative: не будут отменены
  rationale: Буквальное повторение образа возвращения сохраняет напряжение и метафору оригинала, не заменяя их богословским истолкованием об отмене суда.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Параллельная конструкция «как… так…» сохраняет образность и логику латинского текста.
