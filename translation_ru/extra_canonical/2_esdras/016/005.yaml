  register: Современный литературный русский язык; риторический вопрос и торжественно-предупредительный тон сохранены. «Посланы» соответствует засвидетельствованному полному чтению missa sunt vobis mala и согласуется с консультационным английским текстом; конечное Numquid repellit относится к продолжению следующей фразы и в стих не включено.
