  source_fidelity: '«На вас посланы бедствия» точно передаёт засвидетельствованное в контексте чтение *[missa sunt] vobis mala*: *mala* в данном контексте — бедствия, а не моральное зло. «Кто сможет их отвратить?» верно передаёт риторический вопрос *et quis est qui repellat ea?*; модальность «сможет» уместно выражает невозможность отвратить эти бедствия.'
  naturalness: Фраза звучит естественно на современном литературном русском, сохраняет пророчески-предупредительный регистр и чёткую риторическую форму. Тире перед вопросом стилистически оправдано.
