  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: ru
  text: Тогда станет явным испытание Моих избранных[a] — подобно золоту, которое испытывают огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда станет явной доказанная подлинность Моих избранных». Латинское probatio может обозначать как само испытание, так и выявленную им подлинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: испытание
  rationale: Латинское слово прежде всего обозначает испытание или проверку; этот смысл поддержан однокоренным probatur в сравнении с золотом. При этом возможный оттенок выявленной подлинности сохранён в сноске.
- source_word: parebit
  choice: станет явным
  rationale: Передаёт значение «явится, обнаружится, станет очевидным» естественным современным русским выражением.
- source_word: electorum meorum
  choice: Моих избранных
  rationale: Точно и традиционно передаёт принадлежность и статус избранных, не уточняя основание или характер избрания.
- source_word: ut aurum quod probatur ab igne
  choice: подобно золоту, которое испытывают огнём
  rationale: Сохраняет образ, страдательное значение латинской конструкции и прямую смысловую связь между probatio и probatur.
theological_decisions:
- issue: Означает ли probatio сам процесс испытания или обнаружившуюся в результате испытанность
  choice: 'В основном тексте: «испытание»'
  alternative: «испытанность» или «доказанная подлинность»
  rationale: Непосредственный контекст бедствий и параллель с золотом, испытываемым огнём, поддерживают процессуальный смысл; результирующий оттенок остаётся возможным и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Начальные слова источника suas eos eicient относятся к предшествующему предложению и не включены в текст данного стиха, согласно принятому членению 16:74.
