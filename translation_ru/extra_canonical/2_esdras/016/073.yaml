lexical_decisions:
- source_word: deuastabunt
  choice: опустошат
  rationale: 'Передаёт значение будущего времени: разорить, подвергнуть опустошению.'
- source_word: diripient
  choice: разграбят
  rationale: Точно выражает насильственное расхищение добычи.
- source_word: substantias eorum
  choice: их имущество
  rationale: В данном контексте substantiae обозначает материальное достояние; русское собирательное «имущество» звучит естественно.
- source_word: domos
  choice: дома
  rationale: Прямое соответствие латинскому существительному; не добавляет отсутствующую в источнике мысль об изгнании жильцов.
