  text: What will you do? Or how will you hide your sins before God
translation:
  language: ru
  text: Что вы будете делать? Или как вы скроете свои грехи перед Богом?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facietis
  choice: вы будете делать
  rationale: Форма второго лица множественного числа будущего времени передана прямо; начальное «Что» восстанавливается из вопросительного контекста, как и в английском консультационном слое.
- source_word: abscondetis
  choice: скроете
  rationale: Будущее время и обращение к нескольким лицам сохранены естественной русской формой.
- source_word: peccata uestra
  choice: свои грехи
  rationale: Возвратное притяжательное местоимение естественно связывает грехи с подлежащим «вы» и точно передаёт uestra.
- source_word: coram deo
  choice: пред Богом
  rationale: «Пред Богом» передаёт значение нахождения перед Божьим лицом/в Божьем присутствии и сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Объект, перед которым невозможно скрыть грехи
  choice: только «пред Богом»
  alternative: «пред Богом и Его ангелами»
  rationale: В предоставленном латинском тексте присутствует только coram deo; упоминание ангелов не добавлено.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «пред Богом». Краткая риторическая структура двух вопросов сохранена.
