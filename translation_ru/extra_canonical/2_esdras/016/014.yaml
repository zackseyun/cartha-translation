lexical_decisions:
- source_word: in fines terrae
  choice: до краёв земли
  rationale: Естественная и достаточно формальная передача пространственного выражения; сохраняет связь с предшествующим контекстом.
- source_word: Ecce
  choice: Вот
  rationale: Современный литературный эквивалент, сохраняющий функцию привлечения внимания.
- source_word: mala
  choice: бедствия
  rationale: В данном апокалиптическом контексте средний род множественного числа обозначает несчастья или бедствия, а не отвлечённое нравственное зло.
- source_word: mittuntur
  choice: посланы
  rationale: Передаёт страдательный залог латинского настоящего времени; по-русски краткая форма причастия здесь звучит естественно.
- source_word: non reuertentur
  choice: не вернутся
  rationale: Прямая передача будущего времени без уточнения подразумеваемого места или отправителя.
- source_word: donec
  choice: пока
  rationale: Сохраняет незавершённость придаточной конструкции на границе данного фрагмента.
theological_decisions:
- issue: Подразумеваемый посылающий бедствия
  choice: Сохранён страдательный оборот «бедствия посланы»
  alternative: «Бог посылает бедствия»
  rationale: Латинский текст не называет действующее лицо; его богословское отождествление не следует вносить в основной текст.
- issue: Незавершённое donec
  choice: Конец обозначен многоточием и пояснён сноской
  alternative: Дополнить фразу по дальнейшему контексту
  rationale: Предоставленный источник обрывается на союзе donec; неподтверждённое дополнение исказило бы границы исходного свидетельства.
translation_notes:
