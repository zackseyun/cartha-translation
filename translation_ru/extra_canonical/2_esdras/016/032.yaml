  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: ru
  text: Так в те дни трое или четверо уцелеют от тех, кто будет обыскивать их дома с мечом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинская конструкция допускает и более буквальное, но неясное прочтение: «трое или четверо останутся от тех, кто будет обыскивать их дома с мечом».'
    reason: Сохраняет подлинную неоднозначность сочетания remanebunt … ab scrutantibus, которую невозможно естественно воспроизвести в основном русском тексте.
lexical_decisions:
- source_word: sic
  choice: Так
  rationale: Передаёт итоговую или следственную связь с предшествующим контекстом без её усиления.
- source_word: remanebunt
  choice: уцелеют
  rationale: В контексте насильственного обыска естественно выражает смысл «останутся в живых / сохранятся»; простое «останутся» по-русски сделало бы связь с последующим оборотом неясной.
- source_word: tres vel quattuor
  choice: трое или четверо
  rationale: Субстантивированные числительные естественно обозначают небольшое число людей и точно сохраняют латинскую альтернативу vel.
- source_word: scrutantibus domos eorum
  choice: тех, кто будет обыскивать их дома
  rationale: Передаёт действительное причастие scrutantibus и сохраняет местоимение eorum без уточнения его референта.
- source_word: in romphea
  choice: с мечом
  rationale: Romphea обозначает меч; предлог in здесь передаёт средство или сопутствующее вооружение.
theological_decisions:
- issue: Неясная связь ab scrutantibus с remanebunt
  choice: «уцелеют от тех, кто будет обыскивать»
  alternative: «останутся после тех, кто будет обыскивать» или буквально «останутся от обыскивающих»
  rationale: Латинское ab допускает понимание источника, удаления или действующего лица, а сама конструкция необычна. Основной вариант делает фразу понятной, но примечание сохраняет текстовую неоднозначность и не приписывает ей особого богословского смысла.
translation_notes:
  register: Современный литературный русский язык; краткая, суровая апокалиптическая фраза. Синтаксис сделан естественным для широкого читателя, а неясность исходной латинской конструкции вынесена в примечание.
