source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: ru
  text: 'Господь говорит: «Вот, бедствия приближаются и не замедлят, подобно тому как у женщины на девятом месяце беременности, когда приближается час её родов, в течение двух или трёх часов боли охватывают её чрево; и когда младенец выходит из чрева, он не замедлит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: бедствия
  rationale: В данном эсхатологическом контексте множественное mala обозначает надвигающиеся несчастья или бедствия, а не нравственное зло.
- source_word: non tardantur
  choice: не замедлят
  rationale: Сохранена образная мысль о том, что наступление бедствий не задержится; русская форма согласована с неодушевлённым множественным подлежащим.
- source_word: praegnans in nono mense filium suum
  choice: женщина, носящая ребёнка уже девятый месяц
  rationale: Естественно передаёт беременность и срок, не утяжеляя фразу буквальным «беременная своим сыном».
- source_word: gementes dolores
  choice: мучительные боли
  rationale: Латинское выражение буквально связано со стоном; в русском контексте родов естественно обозначает сильные, мучительные боли.
- source_word: circum uentrem eius
  choice: во чреве
  rationale: Сохраняет телесный образ источника и достоинство библейского регистра; буквальное «вокруг живота» по-русски звучит неестественно.
- source_word: non tardabit
  choice: уже не медлит появиться на свет
  rationale: Единственное число соотнесено с младенцем; добавление «появиться на свет» делает подразумеваемое действие ясным без изменения образа.
theological_decisions:
- issue: Говорящий в начале стиха
  choice: «Господь говорит» включено в текст
  alternative: Считать dominus окончанием предыдущего стиха либо передать просто «Господь»
  rationale: В предоставленном латинском тексте dominus непосредственно вводит изречение; русская формула естественно обозначает речь Господа, не добавляя конфессионального толкования.
- issue: Явное завершение сравнения
  choice: Добавлено «так будет и с бедствиями» после тире
  alternative: Оставить сравнение синтаксически незавершённым, как в латинском тексте
  rationale: Латинская конструкция эллиптична и, вероятно, текстуально шероховата; добавление лишь раскрывает очевидную связь с первым предложением и сохраняет эсхатологическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены повтор «чрево» и последовательность образов, но латинская шероховатость сглажена ради ясного чтения. Маркеры сносок не требуются.
