  text: и на вершинах гор устроил водоёмы, чтобы с высот текли реки, чтобы земля могла пить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы напоить землю».'
    reason: Буквальная передача сохраняет землю субъектом глагола «пить»; сноска отмечает более идиоматичную, но менее образную альтернативу.
lexical_decisions:
- source_word: lacus
  choice: водоёмы
  rationale: Латинское lacus здесь обозначает скопления воды на горных вершинах; «водоёмы» естественно по-русски и не сужает значение до озёр или прудов.
- source_word: ad emittendum flumina
  choice: чтобы … изливались реки
  rationale: Передаёт целевую конструкцию и образ истечения рек, избегая неестественного буквального «выпускать реки».
- source_word: ab eminenti
  choice: с высот
  rationale: Сохраняет пространственный смысл исходного выражения и естественно соотносится с вершинами гор.
- source_word: ut potaret terra
  choice: и земля могла пить
  rationale: Сохраняет землю как грамматический субъект и поэтический образ земли, пьющей воду.
