  text: So be as strangers in the land; the one who sells, as one who will flee;
translation:
  language: ru
  text: Так будьте как пришельцы в земле; продающий — как тот, кто будет бежать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic
  choice: итак
  rationale: Передаёт выводный или увещательный переход; контекстуально естественнее буквального «так» в начале самостоятельной фразы.
- source_word: aduenae
  choice: чужеземцы
  rationale: Латинское aduena обозначает пришельцев, живущих не на своей земле; «чужеземцы» сохраняет этот смысл и звучит естественно в современном литературном русском.
- source_word: terrae
  choice: на земле
  rationale: Родительный падеж в поздней латыни здесь передаёт отношение к месту; русский предложный оборот ясно выражает пребывание в земле/стране без излишнего уточнения.
- source_word: Qui uendit
  choice: продающий
  rationale: Причастная форма кратко и точно воспроизводит обобщённое обозначение человека, который продаёт.
- source_word: quasi qui fugiet
  choice: как тот, кому предстоит бежать
  rationale: Сохраняет сравнение quasi и будущую направленность fugiet, не утверждая, что бегство уже началось.
theological_decisions:
- issue: Характер пребывания адресатов на земле
  choice: как чужеземцы на земле
  alternative: как странники на земле
  rationale: «Чужеземцы» точнее передаёт aduenae как людей, не принадлежащих данной земле; «странники» могло бы привнести идею непрерывного путешествия, которой слово само по себе не требует.
- issue: Будущее бегство продающего
  choice: кому предстоит бежать
  alternative: который убежит
  rationale: Выбранная формулировка сохраняет будущность и ожидаемость действия, не усиливая высказывание до безусловного пророчества о конкретном поступке.
translation_notes:
  register: Современный литературный русский с достоинством пророческого увещания. Синтаксический параллелизм и точка с запятой сохраняют сжатую структуру латинского текста. Не добавлена отсутствующая в предоставленном источнике фраза о покупающем.
