  verdict: approve
  source_fidelity: 'Текст точно передаёт латинскую последовательность и синтаксическую связь: начальное «трудятся;» сохраняет зависимое от предшествующего контекста laborant; alienigenae, fructus, substantia, domus euertent и filios ... captiuabunt переданы без смыслового сужения. «Потому что в плену и голоде они рождают своих детей» сохраняет прямую, несколько напряжённую причинную конструкцию quia ... generant natos suos и не превращает её в толкование о цели рождения.'
  naturalness: Русский текст современный и литературный, с уместной для пророческого контекста возвышенной сжатостью. «В плену и голоде» допустимо как намеренно суровая библейско-пророческая координация обстоятельств; перестройка на «во время голода» не необходима. «Разрушат их дома» естественно передаёт evertere применительно к строениям.
  terminology: '«Чужеземцы», «имущество», «уведут ... в плен» и «голод» точны и регистрово согласованы. Богословски нагруженных терминов, требующих специальной унификации, в стихе нет. Русских подстрочных примечаний и их маркеров не требуется: вариант английского audit trail об «overturn» не отражает вариант чтения исходного латинского текста и не должен получать искусственный якорь в русском тексте.'
