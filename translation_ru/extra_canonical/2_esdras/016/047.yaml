source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: ru
  text: трудятся; ведь чужеземцы пожнут их плоды, разграбят их имущество, разрушат их дома и уведут их детей в плен, потому что в плену и голоде они рождают своих детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborant
  choice: трудятся
  rationale: Передаёт самостоятельное вводное сказуемое настоящего времени; начальная строчная буква и точка с запятой сохраняют видимый переход от предшествующего контекста.
- source_word: alienigenae
  choice: чужеземцы
  rationale: Естественный литературный эквивалент для людей чужого происхождения, без лишнего уточнения их этнического или политического статуса.
- source_word: Fructus ... illorum
  choice: их плоды
  rationale: 'Сохраняет широкий смысл fructus: урожай, произведённые плоды или результаты труда; контекст жатвы поддерживает предметный образ.'
- source_word: substantiam illorum
  choice: их имущество
  rationale: В данном контексте substantia обозначает материальное достояние или собственность; «имущество» ясно и не сужает смысл до денег.
- source_word: domus euertent
  choice: разрушат их дома
  rationale: При объекте «дома» латинское evertere естественно означает разрушить или разорить; буквальное «опрокинут дома» по-русски неестественно.
- source_word: filios eorum captiuabunt
  choice: уведут их детей в плен
  rationale: Передаёт результат captivare и естественно звучит по-русски; filios здесь может обозначать потомство/детей, а не обязательно только взрослых сыновей.
- source_word: generant natos suos
  choice: рождают своих детей
  rationale: Передаёт сочетание рождения и появления потомства без тяжеловесного буквального повтора «порождают рождённых».
theological_decisions:
- issue: Причинная связь в quia in captiuitate et fame generant natos suos
  choice: потому что в плену и голоде они рождают своих детей
  alternative: так что их дети рождаются для плена и голода
  rationale: Сохранена грамматически прямая причинная формулировка латинского текста и его напряжённая логика; не внесено толкование, будто плен и голод являются предопределённой целью рождения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого предупреждения. Сохранена резкая цепь будущих бедствий и необычная причинная формулировка оригинала; искусственные латинизмы устранены.
