revisions:
- from: Слушайте, избранные Мои, — говорит Господь. Вот, настали дни бедствия, но Я избавлю вас от них. Не бойтесь и не колеблитесь,
  to: 'Слушайте, Мои избранные, — говорит Господь: вот, настали дни скорби, и от них Я избавлю вас. Не бойтесь и не колеблитесь,'
  rationale: Устранена добавочная противительная окраска союза и уточнено соответствие tribulatio. Обещание избавления оставлено без уточнения его способа или времени; незавершённая пунктуация сохранена согласно исходному тексту и английской контрольной версии.
