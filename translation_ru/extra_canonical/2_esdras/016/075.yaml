source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite, electi mei, dicit dominus, ecce adsunt dies tribulationis, et de his liberabo uos. Ne timeatis nec haesitemini,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: ru
  text: 'Слушайте, Мои избранные, — говорит Господь: вот, настали дни скорби, и от них Я избавлю вас. Не бойтесь и не колеблитесь,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: Слушайте
  rationale: Естественный русский императив множественного числа, сохраняющий прямой призыв внимать словам Господа.
- source_word: electi mei
  choice: избранные Мои
  rationale: Формально и богословски нейтрально передаёт обращение к тем, кого Господь избрал; постпозиция местоимения поддерживает возвышенный библейский регистр.
- source_word: adsunt
  choice: настали
  rationale: Передаёт наступившую, а не только приближающуюся реальность дней бедствия; по-русски естественнее сочетания «дни здесь».
- source_word: dies tribulationis
  choice: дни бедствия
  rationale: «Бедствие» понятно современному читателю и передаёт тяжёлые испытания и скорбь без неоправданного сужения значения tribulatio.
- source_word: et de his liberabo uos
  choice: но Я избавлю вас от них
  rationale: 'В данном контексте et естественно выражает смысловое противопоставление: бедствие наступило, однако последует избавление. «От них» сохраняет отсылку к дням бедствия.'
- source_word: Ne timeatis nec haesitemini
  choice: Не бойтесь и не колеблитесь
  rationale: Сохраняет два параллельных запрета; «не колеблитесь» передаёт нерешительность или утрату твёрдости, не сводя выражение только к сомнению.
theological_decisions:
- issue: Характер обещанного избавления
  choice: Сохранено прямое «Я избавлю вас от них» без пояснения способа или времени избавления.
  alternative: Уточнить как избавление до бедствия, посреди него или через окончательное спасение.
  rationale: Латинский текст не определяет механизм и временную точку избавления, поэтому перевод сохраняет эту богословскую открытость.
- issue: Связь между наступлением бедствия и избавлением
  choice: Союз et передан как «но».
  alternative: Буквальное «и».
  rationale: Контекст создаёт явное смысловое противопоставление между бедствием и обещанием избавления; русское «но» делает эту связь естественной, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский с dignified библейской интонацией. Синтаксис ясен обычному читателю; прописные формы «Мои» и «Я» отражают традиционное русское оформление прямой речи Бога. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
