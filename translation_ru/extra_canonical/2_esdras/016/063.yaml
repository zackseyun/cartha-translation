  yaml_path: translation/extra_canonical/2_esdras/016/063.yaml
  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: ru
  text: Дыхание Всемогущего Бога, который создал всё и отыскивает сокрытое в тайниках. Он несомненно знает ваш замысел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiramentum
  choice: дыхание
  rationale: Передаёт конкретное значение латинского существительного «дыхание, дуновение», не подменяя его более истолковывающим словом «дух».
- source_word: dei omnipotentis
  choice: Всемогущего Бога
  rationale: Прямо передаёт omnipotens как «всемогущий» и сохраняет зависимость слова «дыхание» от слова «Бог».
- source_word: scrutatur absconsa in absconsis
  choice: отыскивает сокрытое в тайниках
  rationale: Сохраняет повторный образ сокрытого и скрытых мест, но выражает его естественно по-русски.
- source_word: adinuentionem uestram
  choice: ваш замысел
  rationale: Сохраняет единственное число латинского adinuentionem; «замысел» допускает контекстуально отрицательный оттенок, не усиливая его до явно злого умысла.
theological_decisions:
- issue: Значение spiramentum применительно к Богу
  choice: дыхание
  alternative: дух
  rationale: Латинское spiramentum обозначает прежде всего дыхание или дуновение; вариант «дух» мог бы внести более определённое богословское отождествление, которого форма исходного слова сама по себе не требует.
- issue: Грамматическая незавершённость начала стиха
  choice: сохранена именная конструкция «Дыхание Всемогущего Бога…»
  alternative: добавить связку или начальное «и»
  rationale: В предоставленном латинском тексте стиха нет начального et; добавление союза перенесло бы в этот стих материал соседнего стиха и изменило бы границы текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сохранены границы латинского стиха, в том числе его синтаксическая связь с предшествующим контекстом; не добавлена фраза из следующего стиха.
