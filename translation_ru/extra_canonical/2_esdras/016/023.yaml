  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: ru
  text: И лишатся жизни на земле[a], а меч рассеет тех, кто переживёт голод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В другом чтении: «Ибо многие из живущих на земле умрут от голода, а меч погубит тех, кто переживёт голод».'
    reason: Предыдущее изложение отражает распространённый латинский вариант, отличающийся от предоставленного критического текста.
lexical_decisions:
- source_word: aporiant vitam
  choice: лишатся жизни
  rationale: Латинское выражение передаёт утрату или отсутствие жизни; выбран естественный русский оборот, сохраняющий смысл исходного чтения без подмены его вариантом о смерти от голода.
- source_word: super terram
  choice: на земле
  rationale: Прямое и естественное соответствие латинскому обороту.
- source_word: gladius dispersit
  choice: меч рассеет
  rationale: Сохранён глагол со значением «рассеивать», а не вариантное чтение «погубит»; прошедшая форма dispersit понята в пророческом контексте как действие будущего.
- source_word: quae superaverint a fame
  choice: тех, кто переживёт голод
  rationale: Передаёт выживших после голода; нейтральное «тех» естественно по-русски для обозначения людей при неустойчивом латинском согласовании.
theological_decisions:
- issue: Связь первой части стиха с голодом
  choice: Не уточнять, что люди умрут именно от голода
  alternative: «Многие из живущих на земле умрут от голода»
  rationale: Предоставленный латинский текст говорит «aporiant vitam super terram» и не содержит в первой части ни «многие», ни явного указания на голод; вариантное чтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык; пророческий тон сохранён без архаизации. Формулировка следует предоставленному латинскому чтению и сохраняет его необычность.
