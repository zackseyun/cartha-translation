translation:
  language: ru
  text: некоторых из вас[a], и будут кормить вас пищей, принесённой в жертву идолам. А те, кто согласится с ними, станут для них предметом насмешек, поношения и попрания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало стиха продолжает предложение предыдущего стиха.
    reason: Начальные слова quosdam ex uobis стоят в винительном падеже и синтаксически зависят от предшествующего текста.
lexical_decisions:
- source_word: cibabunt idolis occisam
  choice: станут кормить вас пищей, принесённой в жертву идолам
  rationale: Латинский текст подразумевает пищу или мясо, закланное в жертву идолам; такой перевод естественен по-русски и сохраняет исторический смысл принуждения к вкушению идоложертвенного.
- source_word: qui consenserint eis
  choice: те, кто согласится на их требования
  rationale: Добавление «на их требования» естественно передаёт подразумеваемый объект согласия и не превращает оборот в неоднозначное «согласится с ними».
- source_word: in derisum et in inproperium et in conculcationem
  choice: предметом насмешек, поношения и попрания
  rationale: Сохранена трёхчастная именная конструкция латинского текста и её нарастающая суровость.
theological_decisions:
- issue: Характер идоложертвенной пищи
  choice: пища, принесённая в жертву идолам
  alternative: идоложертвенное мясо
  rationale: Источник допускает подразумеваемое «мясо», однако более широкое «пища» не уточняет сверх текста, что именно было принесено в жертву.
- issue: Синтаксическая связь начальных слов
  choice: сохранить фрагментарное продолжение предыдущего стиха
  alternative: достроить самостоятельное предложение
  rationale: «quosdam ex uobis» является продолжением предшествующего контекста; искусственное достраивание могло бы внести отсутствующий в данном стихе смысл.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены фрагментарное начало стиха и трёхчастный ряд унижений.
