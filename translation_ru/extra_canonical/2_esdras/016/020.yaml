source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: facient, cum uenerint mala? Ecce fames et plaga et tribulatio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/020.yaml
  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: ru
  text: Что они будут делать, когда придут бедствия? Вот — голод, мор и скорбь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: бедствия
  rationale: Передаёт множественное число и широкий смысл латинского mala — надвигающиеся несчастья или беды.
- source_word: fames
  choice: голод
  rationale: Прямой и естественный эквивалент в данном перечне бедствий.
- source_word: plaga
  choice: мор
  rationale: В сочетании с голодом обозначает губительное массовое бедствие, прежде всего эпидемию; «мор» сохраняет краткость и возвышенный библейский регистр.
- source_word: tribulatio
  choice: скорбь
  rationale: Сохраняет значение тяжёлого страдания и притеснения, не добавляя отсутствующего в источнике отдельного понятия «теснота».
- source_word: Ecce
  choice: Вот
  rationale: Передаёт указательно-восклицательную функцию латинского слова естественным современным русским выражением.
theological_decisions:
- issue: Утверждение о наказаниях для исправления
  choice: Не включать слова о том, что бедствия «посланы как бичи для исправления».
  alternative: «Вот, голод, мор и скорбь посланы как бичи для исправления».
  rationale: Такое продолжение имеется в английском консультационном тексте, но отсутствует в предоставленном латинском фрагменте; добавлять его без исходного свидетельства нельзя.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Начальный вопрос сохранён, поскольку он прямо присутствует в предоставленном латинском тексте, хотя английский консультационный слой его не содержит.
