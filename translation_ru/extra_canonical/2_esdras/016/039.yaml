- from: Подобно тому как у женщины на девятом месяце беременности, когда приближается час родов, за два или три часа до них начинаются схватки, охватывающие её чрево, и когда младенец выходит из чрева, он не медлит ни мгновения,
  to: Подобно тому как у женщины на девятом месяце беременности, когда приближается час родов, за два или три часа до родов её чрево охватывают мучительные боли, и когда младенец выходит из чрева, он не медлит ни мгновения,
