    rationale: Латинское определение dolores характеризует боли как стонущие/мучительные; одно слово «схватки» этого значения не выражает.
  - severity: low
    issue: Добавлено «начинаются», а отсылка «до них» недостаточно ясна.
    rationale: 'В источнике нет отдельного глагола «начинаются»; ante horas duas vel tres естественнее и яснее передать прямо: «за два или три часа до родов».'
