source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: ru
  text: Подобно тому как у женщины на девятом месяце беременности, когда приближается час родов, за два или три часа до родов её чрево охватывают мучительные боли, и когда младенец выходит из чрева, он не медлит ни мгновения,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense
  choice: у женщины на девятом месяце беременности
  rationale: Естественная современная русская передача образа беременной женщины на девятом месяце.
- source_word: inadpropinquante hora partus eius
  choice: когда приближается час родов
  rationale: Сохраняет временное значение латинской конструкции и достоинство стиля.
- source_word: ante horas duas vel tres
  choice: за два или три часа до них
  rationale: Ante выражает предшествование, а не продолжительность; местоимение соотнесено с родами.
- source_word: gementes dolores circum ventrem eius
  choice: начинаются схватки, охватывающие её чрево
  rationale: Gementes dolores в контексте родов естественно передаётся как схватки; circum передано образом охватывающей боли. Глагол «начинаются» обеспечивает естественный русский синтаксис, не меняя временного отношения.
- source_word: prodiente infante de ventre
  choice: когда младенец выходит из чрева
  rationale: Близкая к форме источника передача с сохранением повторения образа чрева.
- source_word: non tardabit uno puncto
  choice: он не медлит ни мгновения
  rationale: Передаёт отсутствие даже малейшей задержки; настоящее время по-русски естественно для общего сравнения.
