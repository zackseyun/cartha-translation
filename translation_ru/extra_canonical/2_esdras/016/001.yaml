  terminology: «Горе вам» — устойчивый русский библейский эквивалент vae; традиционные формы «Вавилон», «Азия», «Египет», «Сирия» сохранены. Смысловой оттенок скорбного возвещения бедствия, а не однозначного проклятия, не сужен.
