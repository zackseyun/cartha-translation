  text: Woe to you, Babylon and Asia! Woe to you, Egypt and Syria!
translation:
  language: ru
  text: Горе вам, Вавилон и Азия! Горе вам, Египет и Сирия!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi
  choice: Горе тебе
  rationale: Прямое и естественное соответствие латинской формуле бедственного пророческого возгласа; единственное число сохранено, поскольку каждая пара названий осмысляется как совокупный адресат.
- source_word: Babylon et Asia
  choice: Вавилон и Азия
  rationale: Сохранены традиционные русские формы географических названий и соединительный союз исходного текста.
- source_word: Aegypte et Syria
  choice: Египет и Сирия
  rationale: Сохранены звательная направленность обращения и традиционные русские формы названий.
theological_decisions:
- issue: Характер выражения Vae tibi
  choice: «Горе тебе» как пророческое возвещение бедствия
  alternative: «Увы тебе» как преимущественно скорбное восклицание
  rationale: Латинское vae допускает оттенки скорби и угрозы; «горе тебе» сохраняет эту напряжённость и соответствует библейскому пророческому регистру, не уточняя сверх текста, является ли это проклятием или плачем.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим звучанием. Слова после «Syria!» в предоставленном латинском фрагменте («Praecingite… et») относятся к началу следующего стиха и не включены в 2 Ездры 16:1; это также согласуется с указанной границей в консультационном английском тексте.
