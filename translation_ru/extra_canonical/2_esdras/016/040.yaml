  text: uno puncto, Sic non morabuntur mala ad prodiendum super terram, et saeculum gemet et dolores circumtenent illum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/040.yaml
  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: ru
  text: Так и бедствия не замедлят обрушиться на землю; век будет стонать, и муки окружат его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: бедствия
  rationale: В контексте грядущих земных несчастий латинское множественное mala естественно передаётся как «бедствия», а не более отвлечённое «зло».
- source_word: non morabuntur ... ad prodiendum
  choice: не замедлят обрушиться
  rationale: Сохраняет смысл отсутствия промедления и выхода бедствий на землю; «обрушиться» естественно передаёт угрожающий контекст, не меняя направленности super terram.
- source_word: saeculum
  choice: век
  rationale: Буквальное «век» сохраняет возможную эсхатологическую отсылку к нынешнему мировому веку и не сужает значение до одной лишь «земли» или «мира».
- source_word: gemet
  choice: будет стонать
  rationale: Прямо передаёт образ мучительного стона.
- source_word: dolores circumtenent illum
  choice: муки окружат его
  rationale: «Муки» подходит как к страданиям, так и к родовым болям, а «окружат» близко передаёт circumtenent без дополнительного истолкования.
theological_decisions:
- issue: Значение saeculum
  choice: век
  alternative: мир
  rationale: «Век» сохраняет эсхатологическую многозначность латинского saeculum и не отождествляет его безусловно с космосом или человечеством.
- issue: Образ dolores
  choice: муки
  alternative: боли
  rationale: «Муки» сохраняют широкий образ тяжёлых страданий; перевод не уточняет, являются ли они родовыми схватками или общими бедствиями.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохранён компактным и параллельным; подлинная неоднозначность слов saeculum и dolores не устранена.
