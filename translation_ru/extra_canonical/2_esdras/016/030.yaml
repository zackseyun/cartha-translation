  text: As in an olive orchard three or four olives are left,[a]
translation:
  language: ru
  text: Как в масличном саду останутся три или четыре маслины,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quemadmodum
  choice: Как
  rationale: Передаёт вводимое латинским союзом сравнение и сохраняет связь с последующим контекстом.
- source_word: in oliveto
  choice: в масличном саду
  rationale: Точно передаёт место действия — оливковую рощу или сад — без отсутствующего в источнике уточнения «на каждом дереве».
- source_word: tres vel quattuor olivae
  choice: три или четыре маслины
  rationale: Сохраняет точное число и естественно обозначает плоды маслины по-русски.
- source_word: relinquentur
  choice: остаются
  rationale: Настоящее время естественно для образного сравнения; страдательное значение латинской формы по-русски идиоматично выражается возвратным глаголом.
theological_decisions:
- issue: Масштаб оставшегося урожая
  choice: Три или четыре маслины остаются во всём масличном саду
  alternative: Три или четыре маслины остаются на каждом дереве
  rationale: Латинское in oliveto указывает только на сад и не содержит distributive уточнения «на каждом дереве»; добавление ослабило бы образ крайнего опустошения.
translation_notes:
  register: Современный литературный русский язык; краткая, наглядная и dignified формулировка. Пунктуация сохраняет незавершённость сравнительного оборота в данном стихе.
