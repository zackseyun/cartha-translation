source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite uero ista et cognoscite ea, serui domini. Ecce uerbum domini, excipite eum, ne discredatis de quibus dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, servants of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: ru
  text: 'Но выслушайте это и узнайте, рабы Господа. Вот слово Господа: примите это слово и не сомневайтесь в том, о чём говорится.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: выслушайте
  rationale: Передаёт призыв не просто услышать, а внимательно воспринять сказанное.
- source_word: cognoscite
  choice: познайте
  rationale: Сохраняет значение осознанного узнавания и постижения, не сводя его лишь к интеллектуальному пониманию.
- source_word: serui domini
  choice: рабы Господа
  rationale: Прямое и традиционно понятное соответствие латинскому выражению; сохраняет образ принадлежности и служения Господу.
- source_word: uerbum domini
  choice: слово Господа
  rationale: Формально и богословски нейтрально передаёт латинское выражение.
- source_word: excipite eum
  choice: примите его
  rationale: Местоимение мужского рода в латыни грамматически соотносится с uerbum; русский перевод сохраняет этот призыв, хотя «слово» в русском среднего рода.
- source_word: ne discredatis
  choice: не отвергайте с недоверием
  rationale: Передаёт не только внутреннее неверие, но и отказ довериться или принять сказанное.
- source_word: de quibus dicit
  choice: того, о чём оно говорит
  rationale: Латинская конструкция шероховата и допускает трудность согласования; перевод сохраняет общий смысл без конкретизации неясного референта.
theological_decisions:
- issue: Референт dicit («говорит»)
  choice: оно — «слово Господа»
  alternative: Он — Господь
  rationale: Ближайшим явным референтом служит «слово Господа», а латинское eum также отсылает к uerbum. При этом источник синтаксически неровен, поэтому перевод не вводит Господа как субъекта без прямого основания.
- issue: Значение serui domini
  choice: рабы Господа
  alternative: слуги Господа
  rationale: «Рабы» точнее сохраняет сильную метафору принадлежности, не добавляя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с возвышенным библейским звучанием. Синтаксис сделан ясным, но императивная настойчивость и некоторая напряжённость латинского оригинала сохранены.
