  to: 'Но выслушайте это и узнайте, рабы Господа. Вот слово Господа: примите это слово и не сомневайтесь в том, о чём говорится.'
  rationale: Исправлена неестественная передача местоимения после «слово», устранено добавленное значение «отвергать», а синтаксически невыраженный субъект dicit сохранён без конфессиональной конкретизации посредством безличного оборота. Текст остаётся близким к оригиналу и сохраняет его призывный, возвышенный регистр.
