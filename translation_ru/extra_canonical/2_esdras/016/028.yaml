lexical_decisions:
- source_word: concupiscet
  choice: будет жаждать
  rationale: Передаёт сильное желание, выраженное латинским глаголом, и естественно звучит в контексте крайнего одиночества.
- source_word: homo hominem
  choice: человек… другого человека
  rationale: Сохраняет различение между субъектом и другим человеком, не создавая неестественного повтора.
- source_word: vel certe
  choice: или хотя бы
  rationale: 'Передаёт значение меньшей, вынужденной альтернативы: если увидеть невозможно, то по крайней мере услышать.'
- source_word: vocem eius audire
  choice: услышать его голос
  rationale: Прямо и естественно передаёт латинскую конструкцию.
