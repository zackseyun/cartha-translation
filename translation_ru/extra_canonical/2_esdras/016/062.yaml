  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: ru
  text: Он сотворил человека, поместил сердце посреди его тела и дал ему дух, жизнь и разум.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: medio corporis
  choice: посреди его тела
  rationale: Передаёт пространственное значение латинского оборота естественным современным русским языком; местоимение уточняет принадлежность тела человеку из контекста.
- source_word: misit ei
  choice: вложил в него
  rationale: Буквально глагол означает «послал», но применительно к дарованию внутренних начал естественнее «вложил»; сохраняется образ наделения человека.
- source_word: spiritum
  choice: дух
  rationale: Прямое соответствие латинскому spiritus без уточнения, идёт ли речь о дыхании, жизненном духе или иной духовной реальности.
- source_word: uitam
  choice: жизнь
  rationale: Прямой и нейтральный эквивалент vita.
- source_word: intellectum
  choice: разум
  rationale: Передаёт способность понимания и мышления в ясной для современного читателя форме.
theological_decisions:
- issue: Значение spiritum
  choice: дух
  alternative: дыхание
  rationale: Слово оставлено богословски и антропологически широким; перевод «дыхание» неоправданно сузил бы возможный смысл.
- issue: Отношение духа, жизни и разума
  choice: сохранён перечень трёх даров
  alternative: объединить их как свойства живого духа
  rationale: Союз et в источнике представляет их как отдельные, хотя и связанные понятия; перевод не разрешает их взаимоотношение догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Начальные слова восстановлены по контексту засвидетельствованной формы стиха и консультационному английскому тексту, поскольку приведённый латинский отрывок начинается внутри предложения.
