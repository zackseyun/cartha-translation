source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dolete eos, quoniam adpropinquauit contritio uestra. Inmissus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/002.yaml
  text: Mourn for them[a], because your destruction has drawn near.
translation:
  language: ru
  text: Оплакивайте их, потому что приблизилась ваша гибель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваше сокрушение»; также возможно: «ваша погибель».'
    reason: 'Сохраняет диапазон значений латинского contritio: разрушение, гибель, сокрушение.'
lexical_decisions:
- source_word: dolete eos
  choice: Оплакивайте их
  rationale: Передаёт повелительное dolete и объект eos естественным русским выражением скорби о других; «скорбите о них» также возможно, но звучит менее непосредственно.
- source_word: adpropinquauit
  choice: приблизилась
  rationale: Сохраняет совершенный вид латинского перфекта и характерную для пророческой речи формулу приближающегося бедствия.
- source_word: contritio uestra
  choice: ваша гибель
  rationale: В апокалиптическом контексте contritio означает разрушение, погибель или сокрушительное бедствие; «гибель» ясно и торжественно передаёт смысл, не сводя его к буквальному физическому дроблению.
theological_decisions:
- issue: Характер грядущего contritio
  choice: Не уточнять, кем или каким образом причинена гибель
  alternative: Передать как явно выраженный Божий суд или наказание
  rationale: Латинский текст говорит о приближении гибели, но в самом стихе не называет её виновника и не определяет её точный характер.
translation_notes:
  register: Современный литературный русский язык с кратким и торжественным пророческим звучанием. Начальное Inmissus рассматривается как начало следующего текстового отрезка и в перевод данного стиха не включено.
