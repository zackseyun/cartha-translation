  verdict: approve
  source_fidelity: '«Оплакивайте их» точно передаёт повелительное dolete с объектом eos. «Потому что приблизилась ваша гибель» верно отражает quoniam adpropinquauit contritio uestra: перфект передан естественным русским совершенным видом, а «гибель» уместно передаёт contritio в пророчески-апокалиптическом контексте. Начальное Inmissus является началом следующего фрагмента и не относится к переводу данного стиха.'
  naturalness: Текст краток, ясен и звучит как современный литературный русский с необходимой пророческой торжественностью. Порядок слов естественен; «оплакивайте их» более прямое и выразительное соответствие исходному тексту, чем нейтральное «скорбите о них».
  terminology: «Гибель» согласуется с английским POB «destruction» и с контекстуальным значением латинского contritio («разрушение», «разорение», «гибель»). Сноска корректно отмечает допустимые оттенки «сокрушение» и «погибель», не навязывая конкретного механизма бедствия.
