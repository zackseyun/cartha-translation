  verdict: approve
  source_fidelity: '«Вступающие в брак» точно передаёт qui nubunt без неоправданного гендерного сужения. «Словно у них не будет детей» адекватно выражает sic quasi filios non facturi, сохраняя будущую направленность и сравнительно-ирреальный характер оборота. «Не вступающие в брак — словно вдовцы» верно отражает второй, намеренно эллиптический член параллелизма. Добавлять в стих самостоятельное «пусть будут» не следует: он синтаксически продолжает предшествующий ряд.'
  naturalness: Текст звучит как современный литературный русский, при этом тире и неполные сравнительные конструкции уместно сохраняют краткий ритм оригинала. Формула «словно вдовцы» несколько маркирована контекстной эллиптичностью, но не неестественна и оправданна параллельной структурой.
  terminology: «Вступать в брак» — нейтральное современное соответствие nubunt. «Вдовцы» точно передаёт латинское мужское множественное vidui; не следует заменять его гендерно-нейтральным или толковательным выражением, поскольку это изменило бы форму исходного текста.
