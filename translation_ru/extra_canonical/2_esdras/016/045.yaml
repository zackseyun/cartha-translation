source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui nubunt, sic quasi filios non facturi; et qui non nubunt, sic quasi vidui.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/045.yaml
  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
translation:
  language: ru
  text: вступающие в брак — словно у них не будет детей; а не вступающие в брак — словно вдовцы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui nubunt
  choice: вступающие в брак
  rationale: Передаёт латинское nubunt как обозначение тех, кто женится или выходит замуж, без ограничения одним полом.
- source_word: sic quasi filios non facturi
  choice: словно у них не будет детей
  rationale: Естественно передаёт сравнительно-ирреальный оборот quasi и смысл будущего причастия facturi; буквальное «не произведут детей» по-русски неуместно.
- source_word: qui non nubunt
  choice: не вступающие в брак
  rationale: Сохраняет точный параллелизм с первой частью.
- source_word: sic quasi vidui
  choice: словно вдовцы
  rationale: Сохраняет эллиптический сравнительный оборот и мужскую форму латинского vidui.
theological_decisions:
- issue: Эллиптическая зависимость от повеления в предыдущем контексте
  choice: Не добавлять в самом стихе «пусть живут» или «пусть будут»
  alternative: «Вступающие в брак пусть будут словно…»
  rationale: Латинский текст стиха представляет собой продолжение ритмического ряда и не повторяет управляющий императив; русский перевод сохраняет эту синтаксическую незавершённость.
- issue: Смысл отсутствия детей
  choice: «словно у них не будет детей»
  alternative: «словно они не будут иметь детей» или «словно не собираются рождать детей»
  rationale: Формулировка не уточняет, идёт ли речь о фактической бездетности, отказе от деторождения или образе поведения, тем самым сохраняя широту quasi filios non facturi.
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичный параллелизм, эсхатологическая напряжённость и эллиптическая связь с предшествующим повелением.
