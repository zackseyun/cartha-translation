  text: He who hung the earth upon the water by his word[a], and stretched out the heaven like a vault;
translation:
  language: ru
  text: Тот, кто словом Своим подвесил землю над водой и распростёр небо, словно свод;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super aquam
  choice: над водой
  rationale: Сохраняет единственное число латинского aquam и естественно передаёт пространственное отношение.
- source_word: uerbo suo
  choice: словом Своим
  rationale: Передаёт инструментальное значение аблатива и возвратную принадлежность suo к действующему лицу.
- source_word: extendit caelum
  choice: распростёр небо
  rationale: Достоинственная и понятная формулировка, близкая к образному языку исходного текста.
- source_word: quasi cameram
  choice: словно свод
  rationale: В данном космологическом образе camera означает сводчатое покрытие; «свод» звучит естественно и сохраняет сравнение.
theological_decisions:
- issue: Продолжающаяся относительная конструкция Qui
  choice: Тот, кто
  alternative: Он
  rationale: Сохранена синтаксическая связь с предшествующим славословием и не превращена в самостоятельное утверждение.
- issue: Образ положения земли относительно воды
  choice: подвесил землю над водой
  alternative: утвердил землю на воде
  rationale: «Подвесил» сохраняет необычный и напряжённый образ английского проверочного слоя и предполагаемого полного латинского контекста, не сглаживая его до более привычной формулы.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Точка с запятой сохраняет незавершённость ряда относительных славословных конструкций.
