  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: ru
  text: Земля будет оставлена в запустении, поля её обветшают, дороги её и все тропы покроются тернием, потому что овцы не будут проходить по ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra
  choice: земля
  rationale: Передаёт здесь территорию страны, которая останется безлюдной; естественнее и шире, чем «страна» в данном контексте.
- source_word: deserta
  choice: безлюдной
  rationale: В сочетании relinquetur deserta обозначает землю, оставленную людьми и опустевшую; «безлюдной» ясно передаёт результат запустения.
- source_word: agri eius inveteraverunt
  choice: поля её придут в запустение
  rationale: Буквальное «состарятся» по-русски применительно к полям неестественно. Латинское inveterare допускает значение обветшания и упадка, поэтому выбран контекстуально ясный вариант без переноса терновника в эту часть стиха.
- source_word: germinabunt spinas
  choice: зарастут терновником
  rationale: Передаёт буквальный образ того, как дороги и тропы дадут рост терниям, в естественной русской формулировке.
- source_word: oves
  choice: овцы
  rationale: Сохраняется прямое значение латинского слова и сельский образ исходного текста.
