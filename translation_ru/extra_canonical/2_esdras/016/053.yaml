  text: Праведность будет царствовать в нас[a]. Пусть грешник не говорит, что он не согрешил,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет царствовать над нами».'
    reason: Латинское in nos при форме nos, не различающей винительный и отложительный падежи, может допускать властный оттенок наряду с буквальным «в нас».
lexical_decisions:
- source_word: iusticia
  choice: праведность
  rationale: Передаёт нравственно-богословский смысл латинского iusticia и согласуется с литературным библейским регистром.
- source_word: regnabit
  choice: будет царствовать
  rationale: Сохраняет образ правления, выраженный латинским глаголом regnare, а не ослабляет его до «восторжествует».
- source_word: in nos
  choice: среди нас
  rationale: Латинское выражение буквально допускает «в нас/над нами»; в данном контексте «среди нас» естественно передаёт сферу царствования, не утверждая однозначно внутреннее или властное значение.
- source_word: Non dicat
  choice: Пусть … не говорит
  rationale: Естественная русская передача латинского запретительного конъюнктива.
- source_word: peccator
  choice: грешник
  rationale: Прямой и общепонятный эквивалент.
- source_word: non se peccasse
  choice: что он не согрешил
  rationale: Точно передаёт косвенную речь с перфектным инфинитивом и совершённость действия.
theological_decisions:
- issue: Характер царствования праведности
  choice: «будет царствовать среди нас»
  alternative: «будет царствовать над нами» / «будет царствовать в нас»
  rationale: Источник допускает несколько оттенков in nos. Формулировка «среди нас» сохраняет персонифицированный образ праведности и не навязывает исключительно внутреннее либо властное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранена незавершённость фразы в конце стиха, обозначенная запятой в источнике.
