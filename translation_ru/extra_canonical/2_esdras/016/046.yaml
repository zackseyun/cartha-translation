  source_fidelity: '«Без пользы» истолковывает латинское sine causa как безрезультатность. Однако causa прежде всего означает «причина, основание»; в этом сжатом контексте не следует снимать возможную двусмысленность. Добавленное «уже» также отсутствует в sic quasi uidui. Форма «женятся» уместна: uidui — мужской род («вдовцы»), а nubunt здесь передаёт заключение брака.'
  naturalness: «Они женятся, словно вдовцы» намеренно парадоксально, как и оригинал, но грамматически и стилистически естественно для современного литературного русского. «Те, кто трудится, трудятся» сохраняет повтор laborant ... laborant и пророческую сжатость.
  terminology: Термины специальной богословской корректировки не требуют. «Вдовцы» точнее передаёт мужскую форму uidui, чем нейтральное «овдовели».
