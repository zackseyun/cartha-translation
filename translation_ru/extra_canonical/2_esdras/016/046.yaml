  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubunt
  choice: женятся
  rationale: Настоящее время и общий смысл латинского глагола переданы прямо и естественно.
- source_word: sic quasi uidui
  choice: словно уже овдовели
  rationale: Сохраняется парадоксальное сравнение с вдовцами; «уже» естественно выражает подразумеваемую быстроту утраты супруга, не устраняя напряжённости образа.
- source_word: sine causa
  choice: без пользы
  rationale: В данном контексте выражение означает тщетность и безрезультатность труда; буквальное «без причины» по-русски могло бы ошибочно указывать на отсутствие мотива.
theological_decisions:
- issue: Характер утверждения о браке и труде перед грядущим бедствием
  choice: Сохранить краткую парадоксальную формулировку без поясняющего истолкования.
  alternative: Развернуть смысл как указание на скорую смерть супругов и тщетность труда.
  rationale: Латинский текст оставляет связь с бедствием имплицитной; перевод не должен превращать образ в толкование.
translation_notes:
  register: Современный литературный русский язык; фраза намеренно сохраняет пророческую сжатость и мрачный параллелизм оригинала.
