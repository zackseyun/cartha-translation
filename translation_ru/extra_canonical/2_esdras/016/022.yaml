  text: ecce erit annonae vilitas in brevi super terram, ut putent sibi esse directam pacem. tunc superflorescent mala super terram, gladius et famis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: ru
  text: 'Вот[a], вскоре зерно станет дешёвым на земле, и люди подумают, что мир им обеспечен[b]. Тогда на земле пышно разрастутся бедствия: меч и голод.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинской рукописной традиции этой главы материал примерно из стихов 22–35 повторён. Здесь более полная последовательность приводится один раз, без повторения одних и тех же судов.
    reason: compositional_layer
  - marker: b
    text: 'Или: «…и они подумают, что для них установлен мир».'
    reason: previous_rendering
lexical_decisions:
- source_word: annonae vilitas
  choice: зерно станет дешёвым
  rationale: Передаёт снижение цены на зерно естественным современным русским языком; в данном контексте annona обозначает зерно или продовольственное снабжение, а vilitas — дешевизну.
- source_word: in brevi
  choice: вскоре
  rationale: Сохраняет явное временное указание латинского текста.
- source_word: directam pacem
  choice: мир им обеспечен
  rationale: Естественно передаёт мысль о мире как о достигнутом и надёжно устроенном состоянии, не прибегая к неясной буквальности «мир выпрямлен».
- source_word: superflorescent mala
  choice: пышно разрастутся бедствия
  rationale: Сохраняет усиленный образ бурного цветения или разрастания, выраженный приставкой super-, а mala конкретизируется последующими «мечом и голодом» как бедствия.
- source_word: gladius et famis
  choice: меч и голод
  rationale: Традиционная и точная библейская формула; не добавляет «великого смятения», отсутствующего в предоставленном латинском тексте.
theological_decisions:
- issue: Кажущийся мир перед наступлением бедствий
  choice: «люди подумают, что мир им обеспечен»
  alternative: «они подумают, что для них установлен мир»
  rationale: Сохраняется напряжение между человеческой уверенностью в безопасности и последующим внезапным появлением бедствий; не утверждается, что мир действительно был установлен Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского пророческого стиля. «Вот» сохраняет вводное ecce, а «пышно разрастутся» передаёт яркий образ латинского superflorescent без архаизации.
