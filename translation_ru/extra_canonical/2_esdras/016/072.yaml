  text: super timentes dominum. Erint quasi insani neminem parcentes ad diripiendum et deuastandum adhuc timentes dominum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/072.yaml
  text: They will be like madmen[a], sparing no one, plundering and ravaging those who still fear the Lord.
translation:
  language: ru
  text: Они будут как безумцы, никого не щадя, готовые грабить и разорять тех, кто всё ещё боится Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quasi insani
  choice: словно безумные
  rationale: Передаёт сравнительную конструкцию quasi и значение insani естественным и выразительным современным русским языком.
- source_word: neminem parcentes
  choice: никого не щадя
  rationale: Точно сохраняет абсолютный характер neminem и обстоятельственное значение причастия parcentes.
- source_word: ad diripiendum et deuastandum
  choice: грабя и разоряя
  rationale: 'Передаёт два согласованных действия: насильственное разграбление и опустошительное разорение; русская деепричастная конструкция естественно связывает их с основным действием.'
- source_word: adhuc timentes dominum
  choice: тех, кто всё ещё боится Господа
  rationale: 'Adhuc непосредственно относится к timentes: речь идёт о людях, которые продолжают бояться Господа, а не о том, что грабёж всё ещё продолжается.'
theological_decisions:
- issue: Значение выражения «бояться Господа»
  choice: боится Господа
  alternative: почитает Господа
  rationale: Сохранена библейская формулировка и её смысловая напряжённость; более истолковывающий вариант «почитает» неоправданно сужал бы значение.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской сдержанностью. Начальное «super timentes dominum» в предоставленном фрагменте представляет собой окончание предшествующего контекста и не включено повторно в текст данного стиха.
