  text: Audite uerbum, plebs mea, parate uos in pugnam et in malis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: ru
  text: 'Слушайте слово, народ Мой: приготовьтесь к битве и среди бедствий будьте как пришельцы на земле.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный латинский фрагмент обрывается после слов «и среди бедствий»; окончание стиха передано по засвидетельствованному в консультационном тексте чтению: «будьте как пришельцы на земле».'
    reason: Отмечает текстологическую границу между приведённым латинским фрагментом и засвидетельствованным продолжением стиха.
lexical_decisions:
- source_word: Audite uerbum
  choice: Слушайте слово
  rationale: Передаёт повелительное наклонение множественного числа audite и сохраняет библейски весомое, но понятное современному читателю выражение.
- source_word: plebs mea
  choice: народ Мой
  rationale: В данном обращении plebs означает народ как общину; «народ Мой» естественнее и точнее по регистру, чем «моя толпа» или «простонародье».
- source_word: parate uos in pugnam
  choice: приготовьтесь к битве
  rationale: Возвратная форма передаёт parate vos, а «к битве» естественно выражает направленность подготовки, заложенную в in pugnam.
- source_word: in malis
  choice: среди бедствий
  rationale: Множественное malis здесь обозначает тяжёлые бедствия и несчастья, а не отвлечённое нравственное зло.
- source_word: sicut advenae terrae
  choice: словно чужеземцы на земле
  rationale: Формулировка соответствует продолжению, засвидетельствованному консультационным текстом; «чужеземцы» сохраняет смысл людей, не считающих эту землю своим постоянным домом, не сужая его до современных юридических категорий.
theological_decisions:
- issue: Смысл образа чужеземцев на земле
  choice: Сохранить образ без богословского истолкования
  alternative: Передать как «не привязывайтесь к земному» или «живите как странники»
  rationale: Исходный образ допускает несколько оттенков — временность пребывания, непривязанность и уязвимость пришельца; перевод не должен выбирать одно толкование вместо читателя.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общедоступным библейским звучанием. Обращение оформлено во множественном числе вслед за audite и parate vos; прописная буква в «Мой» указывает на говорящего Бога согласно русской библейской издательской традиции.
