  text: uobis ignis, et quis est qui extinguat illum? Inmissa sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/004.yaml
  text: Fire has been sent upon you, and who is there to quench it?
translation:
  language: ru
  text: На вас послан огонь — и кто сможет его погасить?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uobis
  choice: на вас
  rationale: Дательный местоимения при подразумеваемой направленности посланного бедствия естественно передаётся по-русски сочетанием «на вас».
- source_word: ignis
  choice: огонь
  rationale: Прямое соответствие латинскому существительному без неопределённого артикля и без добавочного уточнения.
- source_word: quis est qui extinguat illum?
  choice: кто сможет его погасить?
  rationale: Русская конструкция с «сможет» естественно передаёт латинский оборот quis est qui с конъюнктивом extinguat, выражающий вопрос о том, найдётся ли способный погасить огонь.
- source_word: Inmissa sunt
  choice: послан
  rationale: По предоставленной разбивке начало следующей фразы не входит в данный стих; форма inmissa sunt не согласуется с ignis и потому не включена в основной текст 16:4.
theological_decisions:
- issue: Неизбежность посланного бедствия
  choice: Сохранён риторический вопрос без прямого ответа
  alternative: «Никто не сможет его погасить»
  rationale: Латинский текст задаёт вопрос и не формулирует ответ явно; перевод сохраняет эту выразительную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и угрожающая формулировка. Тире подчёркивает переход от объявления суда к риторическому вопросу.
