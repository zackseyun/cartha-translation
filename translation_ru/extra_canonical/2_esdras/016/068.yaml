source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: ru
  text: 'Вот: Бог — Судья; бойтесь Его. Перестаньте грешить и забудьте о своих беззакониях — больше не совершайте их вовеки.[a] И Бог выведет вас и избавит от всякой скорби.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «забудьте о своих беззакониях, чтобы больше никогда их не совершать».'
    reason: Латинская конструкция необычна; примечание сохраняет более тесную синтаксическую связь между «забудьте» и прекращением беззаконий.
lexical_decisions:
- source_word: Ecce
  choice: Вот
  rationale: Сохраняет призыв обратить внимание и торжественный тон латинского текста.
- source_word: iudex deus
  choice: Бог — Судья
  rationale: Передаёт именное утверждение с естественным для русского языка порядком слов и смысловым тире.
- source_word: desinite a peccatis uestris
  choice: Перестаньте грешить
  rationale: Естественно передаёт повеление прекратить собственные греховные поступки, не утяжеляя фразу буквальным «отступите от ваших грехов».
- source_word: obliuiscimini iniquitates uestras
  choice: забудьте о своих беззакониях
  rationale: Сохраняет образ забвения прежних беззаконий; предлог «о» необходим в современном русском употреблении.
- source_word: sempiterno
  choice: вовеки
  rationale: Передаёт усиленную неограниченную длительность запрета в достойном библейском регистре.
- source_word: educabit uos
  choice: выведет вас
  rationale: Сохраняет пространственно-освободительный смысл educere, не подменяя его более общим «поведёт».
- source_word: de omni tribulatione
  choice: от всякого бедствия
  rationale: «Бедствие» охватывает страдание, притеснение и тяжёлые обстоятельства, заложенные в tribulatio.
theological_decisions:
- issue: Связь избавления с прекращением греха
  choice: Сохранена последовательность повелений и обещания без добавления причинного союза.
  alternative: 'Передать: «тогда Бог выведет вас», явно обозначив условие.'
  rationale: Латинский текст соединяет части союзом et и не формулирует явную условную конструкцию; перевод не должен усиливать причинно-условную связь.
- issue: Необычная конструкция obliuiscimini… iam agere eas sempiterno
  choice: Передано как призыв навсегда прекратить совершать беззакония.
  alternative: 'Буквально: «забудьте совершать ваши беззакония».'
  rationale: Буквальная русская формулировка неестественна и может означать случайную забывчивость; выбранный вариант сохраняет волевой и временной смысл увещания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «бойтесь Его» и «вовеки» поддерживают достоинство речи, оставаясь понятными широкому читателю. Начальные слова «angelis eius?» расценены как остаток предыдущего контекста или редакционный шов и не включены в текст данного стиха, который по представленному английскому консультационному слою начинается с Ecce.
