    issue: «Бедствие» для tribulatio
    rationale: Латинское tribulatio прежде всего обозначает скорбь, тяжкое стеснение или притеснение; «бедствие» несколько сужает смысл до внешнего несчастья. «Скорбь» точнее и ближе к традиционному библейскому употреблению.
  - severity: low
    issue: Пунктуация после «Вот»
    rationale: 'После указательно-восклицательного Ecce в русском более естественно поставить двоеточие перед поясняющим утверждением: «Вот: Бог — Судья».'
