  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/052.yaml
  text: For behold[a], yet a little while, and iniquity will be taken away from the earth, and
translation:
  language: ru
  text: Ибо вот, ещё немного — и беззаконие будет удалено с земли, и
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предыдущим контекстом, не усиливая её до вывода «поэтому».
- source_word: ecce
  choice: вот
  rationale: Сохраняет указательно-эмфатическую частицу латинского текста естественным русским словом.
- source_word: adhuc pusillum
  choice: ещё немного
  rationale: Естественно передаёт краткий оставшийся промежуток времени; подразумеваемое «времени» не добавлено в основной текст.
- source_word: tolletur
  choice: будет удалено
  rationale: Сохраняет страдательную форму будущего времени и не уточняет не названного в тексте деятеля.
- source_word: iniquitas
  choice: беззаконие
  rationale: Передаёт нравственно-религиозный смысл iniquitas в принятом библейском регистре.
- source_word: a terra
  choice: с земли
  rationale: Точно и естественно передаёт устранение беззакония с лица земли.
- source_word: et
  choice: и
  rationale: Сохраняет незавершённость фразы и связь со следующим стихом, не дописывая отсутствующее продолжение.
theological_decisions:
- issue: Кем будет удалено беззаконие
  choice: Деятель не назван; сохранена страдательная конструкция
  alternative: «Бог удалит беззаконие»
  rationale: Латинский текст использует пассив tolletur и прямо не называет Бога; эксплицирование сняло бы исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Тире естественно оформляет конструкцию «ещё немного — и…». Конечный союз «и» намеренно сохранён, поскольку исходный фрагмент продолжается в следующем стихе.
