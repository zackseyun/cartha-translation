  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: ru
  text: И те, кто торгует, торгуют ради добычи[a], пока наряжаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И те, кто торгует, торгуют ради грабежа». В контексте также возможно, что речь идёт о товарах, которым суждено стать добычей.'
    reason: Латинское *in rapina* допускает как значение цели («ради добычи / грабежа»), так и контекстуально обусловленное значение участи имущества; основной текст не навязывает последнее как единственное.
lexical_decisions:
- source_word: negociantur
  choice: торгуют
  rationale: Латинский глагол обозначает занятие торговлей или деловыми операциями; в данном контексте естественное и точное русское соответствие — «торгуют».
- source_word: in rapina
  choice: на расхищение
  rationale: Оборот передаёт мысль о том, что товары или плоды торговли станут добычей, не добавляя прямо отсутствующей в латинском тексте пассивной конструкции «чтобы их разграбили».
- source_word: quamdiu
  choice: пока
  rationale: Сохраняет временное значение «до тех пор, пока / пока».
- source_word: exornant
  choice: украшают себя
  rationale: Глагол означает «наряжают, украшают»; возвратное дополнение следует из контекста и согласуется с засвидетельствованным пониманием фразы.
theological_decisions:
- issue: Направленность выражения in rapina
  choice: Сохранена неоднозначная формулировка «на расхищение»
  alternative: «торгуют ради грабежа» или «торгуют лишь затем, чтобы всё было разграблено»
  rationale: Первый вариант может представить торговцев грабителями, а второй чрезмерно явно вводит пассивный смысл. Выбранный перевод сохраняет мрачную перспективу утраты имущества и не устраняет грамматическую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с краткой пророческой формулировкой. Повтор «торгуют, торгуют» сохранён вслед за латинским negociantur negociantur; необычность «на расхищение» намеренно удерживает неоднозначность исходного оборота.
