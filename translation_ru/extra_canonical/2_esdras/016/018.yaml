  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: ru
  text: В те дни?[a] Начало мук, и будет много стенаний; начало голода — и многие погибнут; начало войн — и испугаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «В те дни?» в предоставленном латинском тексте, вероятно, завершают вопрос предыдущего стиха; здесь они сохранены согласно переданным границам текста.
    reason: Сохраняет вопросительную пунктуацию источника и отмечает возможную пограничную особенность стихового членения, не превращая фразу без оснований в утвердительное вступление.
lexical_decisions:
- source_word: dolorum
  choice: мук
  rationale: Передаёт физические и душевные страдания, сохраняя сильное и широкое значение латинского dolor без преждевременного уточнения образа.
- source_word: multi gemitus
  choice: многих стенаний
  rationale: Сохраняет множественное число и количественное значение латинского выражения; по-русски звучит естественно и торжественно.
- source_word: multi interient
  choice: многие погибнут
  rationale: Точно передаёт неопределённый круг многочисленных погибающих и будущее время.
- source_word: formidabunt
  choice: станут страшиться
  rationale: Латинский глагол не называет подлежащего; безлично-неопределённая русская конструкция не добавляет отсутствующих в источнике «правителей» или иных действующих лиц.
theological_decisions:
- issue: Отсутствующие в предоставленном латинском тексте слова о начале бедствий и всеобщем трепете
  choice: Не включать их в основной текст
  alternative: 'Добавить по английскому консультационному тексту: «начало бедствий — и все затрепещут»'
  rationale: Предоставленный оригинальный текст заканчивается словом formidabunt. Поскольку перевод должен прежде всего следовать исходному свидетельству, дополнительная фраза из английского слоя не внесена без латинского основания.
- issue: Связь слов in illis diebus с данным стихом
  choice: Сохранить их с вопросительным знаком и снабдить примечанием
  alternative: 'Понять как утвердительное вступление: «В те дни:»'
  rationale: В предоставленном латинском тексте после выражения стоит вопросительный знак; вероятно, оно завершает предшествующий вопрос. Перевод сохраняет данную пунктуационную и стиховую неопределённость.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом и параллельной структурой. Точка с запятой разделяет три повторяющиеся формулы «начало…». Неуказанное подлежащее formidabunt намеренно не конкретизировано.
