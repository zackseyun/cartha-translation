revisions:
- from: В те дни?[a] Начало мук и многих стенаний; начало голода — и многие погибнут; начало войн — и станут страшиться.
  to: В те дни?[a] Начало мук, и будет много стенаний; начало голода — и многие погибнут; начало войн — и испугаются.
  rationale: 'Исправлена только синтаксическая передача первой пары и несколько сглажена последняя глагольная форма. Текст по-прежнему следует предоставленному латинскому свидетельству: не добавляет отсутствующую в нём английскую заключительную клаузу и не уточняет неназванный субъект formidabunt. Вопросительное «В те дни?» и его примечание сохранены.'
