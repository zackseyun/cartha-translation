  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: ru
  text: Ведь Бог — ваш проводник. И вы, соблюдающие Мои заповеди и установления, — говорит Господь Бог, — да не тяготят вас ваши грехи и да не одолеют вас ваши беззакония.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается после слов «да не тяготят вас»; слова о грехах и беззакониях переданы по засвидетельствованному продолжению стиха, отражённому в консультационном английском тексте.
    reason: Обозначает границу непосредственно приведённого латинского фрагмента и прозрачно сообщает основание для перевода последующего текста.
lexical_decisions:
- source_word: dux
  choice: проводник
  rationale: Передаёт образ того, кто ведёт и указывает путь; в данном контексте естественнее современного «вождь» и точнее, чем более отвлечённое «руководитель».
- source_word: mandata
  choice: заповеди
  rationale: Обычное и понятное библейское соответствие для предписанных Богом повелений.
- source_word: praecepta
  choice: установления
  rationale: Сохраняет различие с mandata и обозначает данные Богом предписания без узкоконфессионального оттенка.
- source_word: praeponderent
  choice: отягощают
  rationale: 'Сохраняет весовой образ латинского глагола: грехи не должны становиться тяжестью, давящей на человека.'
- source_word: superent
  choice: одолевают
  rationale: Естественно передаёт смысл превосходства или преобладания над человеком и сохраняет отличие от образа тяжести в предыдущей части.
theological_decisions:
- issue: Соотношение Божьего водительства и человеческой ответственности
  choice: Сохранено прямое утверждение «Бог — ваш проводник» вместе с призывом не быть отягощёнными грехами и одолёнными беззакониями.
  alternative: Истолковать призыв как обещание, что Бог непременно устранит власть греха.
  rationale: Источник ставит рядом Божье водительство, соблюдение заповедей и увещание, не объясняя их причинно-богословскую связь; перевод не должен разрешать эту напряжённость за текст.
- issue: Форма запрета ne praeponderent
  choice: «пусть не отягощают»
  alternative: «не позволяйте ... отягощать вас»
  rationale: Форма с «пусть не» ближе к латинскому пожеланию или повелению в третьем лице и не вводит дополнительно идею сознательного разрешения грехам действовать.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской практике. Синтаксис сохраняет вводную формулу «говорит Господь Бог», но пунктуационно делает длинное обращение ясным для современного читателя.
