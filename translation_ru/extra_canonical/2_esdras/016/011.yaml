  text: He will thunder, and who will not tremble? The Lord will threaten, and who
translation:
  language: ru
  text: Он возгремит — и кто не содрогнётся? Господь пригрозит — и кто…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tonabit
  choice: возгремит
  rationale: Передаёт будущее время и образ громового звучания естественным, возвышенным русским глаголом.
- source_word: horrebit
  choice: содрогнётся
  rationale: Латинское horreo здесь выражает охватывающий человека ужас и трепет; «содрогнётся» сохраняет телесно-эмоциональную силу слова.
- source_word: Dominus
  choice: Господь
  rationale: Устоявшееся русское библейское соответствие латинскому титулу Dominus.
- source_word: comminabitur
  choice: пригрозит
  rationale: Точно передаёт значение угрозы; будущее совершенного вида естественно в данном риторическом параллелизме.
theological_decisions:
- issue: Субъект глагола tonabit
  choice: Сохранено местоимение «Он» без дополнительного уточнения
  alternative: «Господь возгремит»
  rationale: В данном фрагменте субъект первого глагола не назван прямо; его отождествление с Господом вероятно из параллельной второй части, но добавлять имя в первую часть означало бы explicировать то, что источник оставляет подразумеваемым.
- issue: Незавершённый вопрос в конце
  choice: 'Сохранён обрыв: «и кто…»'
  alternative: Восполнить окончание по контексту или иной текстовой традиции
  rationale: Предоставленный латинский источник заканчивается на quis; неподтверждённое продолжение не добавлено.
translation_notes:
  register: Современный литературный русский с достоинством библейской риторики. Тире подчёркивает параллелизм двух вопросов, а многоточие ясно обозначает документально обусловленный обрыв текста.
