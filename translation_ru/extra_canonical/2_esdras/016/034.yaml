review_pass:
  verdict: revise
  source_fidelity: Основной параллелизм и различение «дев» (virgines), «женщин» (mulieres), «женихов» (sponsos) и «мужей» (viros) переданы верно. Однако латинское non habentes буквально обозначает состояние «не имея / не имеющие», а повторённое «у них не будет» переносит отсутствие в будущее и несколько сильнее перестраивает смысл. Adiutorium означает «помощь, содействие»; «поддержка» допустима, но уже, чем исходное слово.
  naturalness: «Девы будут плакать, не имея…» — естественная для современного литературного, несколько торжественного библейского регистра конструкция и хорошо сохраняет краткий параллелизм оригинала. Слово «девы» уместно именно в таком регистре.
  terminology: «Женихи» и «мужья» точны в данном контексте. «Помощь» точнее и нейтральнее передаёт adiutorium, не предполагая эмоциональную либо материальную «поддержку».
  issues:
  - severity: medium
    issue: Временная конкретизация отсутствия
    rationale: Формула «потому что у них не будет» добавляет будущую временную отнесённость, которой нет в латинском non habentes; следует сохранить значение сопутствующего состояния.
  - severity: low
    issue: «Поддержка» вместо adiutorium
    rationale: «Поддержка» допустима, но «помощь» ближе к широкому и нейтральному значению латинского существительного.
  revised_text: Девы будут плакать, не имея женихов; женщины будут плакать, не имея мужей; их дочери будут плакать, не имея помощи.
