source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugebunt virgines non habentes sponsos, lugebunt mulieres non habentes viros, lugebunt filiae earum non habentes adiutorium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: ru
  text: Девы будут плакать, не имея женихов; женщины будут плакать, не имея мужей; их дочери будут плакать, не имея помощи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugebunt
  choice: будут плакать
  rationale: Передаёт скорбь и оплакивание естественным современным русским выражением; трёхкратный повтор сохранён.
- source_word: virgines
  choice: девы
  rationale: Сохраняет прямое значение латинского слова и его отличие от последующих «женщин» и «дочерей».
- source_word: sponsos
  choice: женихов
  rationale: Точно передаёт sponsus в контексте незамужних дев.
- source_word: viros
  choice: мужей
  rationale: В сочетании с mulieres обозначает супругов, а не мужчин вообще.
- source_word: adiutorium
  choice: поддержки
  rationale: Естественно передаёт широкое значение помощи, опоры и содействия, не уточняя, от кого она должна исходить.
theological_decisions:
- issue: Характер отсутствующей помощи у дочерей
  choice: не будет поддержки
  alternative: не будет помощника
  rationale: Латинское adiutorium грамматически означает помощь или поддержку, а не обязательно конкретного человека; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного параллелизма и трёхкратного повтора исходного текста. Причинная конструкция «потому что» естественно раскрывает латинское причастие non habentes.
