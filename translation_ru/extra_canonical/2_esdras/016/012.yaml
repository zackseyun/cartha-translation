source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non funditus conteretur a facie ipsius? Terra tremuit et fundamenta eius, mare fluctuatur de profundo, et fluctus eius disturbabuntur et pisces eius a facie domini et a gloria uirtutis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/012.yaml
  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: ru
  text: Не будет ли земля сокрушена до основания пред лицом Его? Земля и её основания содрогнулись; море волнуется из глубины, и волны его и рыбы его будут встревожены пред лицом Господа и пред славой Его могущества.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: funditus conteretur
  choice: будет… сокрушена до основания
  rationale: Передаёт одновременно усилительное funditus («совершенно, до основания») и будущий пассив conteretur, сохраняя грозный апокалиптический образ.
- source_word: a facie ipsius / a facie domini
  choice: пред лицом Его / пред лицом Господа
  rationale: Сохраняет конкретный библейский образ facies и естественно выражает пребывание перед Божьим присутствием.
- source_word: mare fluctuatur de profundo
  choice: море вздымается из глубины
  rationale: Естественно передаёт настоящее пассивное fluctuatur и движение моря, поднимающееся из глубины.
- source_word: disturbabuntur
  choice: придут в смятение
  rationale: Передаёт будущий пассивный смысл латинской формы и подходит как к волнам, так и к рыбам, не сглаживая необычное соединение подлежащих.
- source_word: gloria uirtutis eius
  choice: слава могущества Его
  rationale: Virtus здесь обозначает силу или могущество; «могущество» сохраняет величественный регистр и не сужает смысл до физической силы.
theological_decisions:
- issue: Образ Божьего присутствия в выражении a facie
  choice: пред лицом
  alternative: перед Ним / от присутствия
  rationale: Буквальный образ «лица» значим в библейской речи и не требует конфессионального истолкования.
- issue: Связь волн и рыб с будущим сказуемым disturbabuntur
  choice: и волны его и рыбы его придут в смятение
  alternative: его волны придут в смятение, как и его рыбы
  rationale: Сохранены оба однородных подлежащих при одном будущем сказуемом, как в латинском тексте, без искусственного разведения образов.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Синтаксический параллелизм и резкие смены времени сохранены как черта латинского источника; архаизмы сведены к устойчивому обороту «пред лицом».
