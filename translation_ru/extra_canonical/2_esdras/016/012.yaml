revisions:
- from: Не будет ли земля сокрушена до основания пред лицом Его? Земля содрогнулась[a], и основания её; море вздымается из глубины, и волны его и рыбы его придут в смятение пред лицом Господа и пред славой могущества Его.
  to: Не будет ли земля сокрушена до основания пред лицом Его? Земля и её основания содрогнулись; море волнуется из глубины, и волны его и рыбы его будут встревожены пред лицом Господа и пред славой Его могущества.
  rationale: Исправлена русская синтаксическая неполнота во втором предложении, при этом сохранён совершенный вид латинского tremuit. Будущая пассивная форма disturbabuntur передана прямо. Сноска удалена, поскольку исходная латинская грамматика не создаёт здесь текстологической или лексической неопределённости, требующей примечания.
