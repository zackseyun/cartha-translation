  text: или как в обобранном винограднике остаётся на виду гроздь, не замеченная теми, кто тщательно собирал виноград,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «остаётся открытая взору гроздь от тех, кто тщательно осматривает сбор винограда». Латинская конструкция допускает также смысл: гроздь остаётся после тщательного сбора винограда.'
    reason: Сноска сохраняет не вполне однозначное отношение, выраженное ab scrutantibus, и буквальное значение patens, не перегружая основной текст.
lexical_decisions:
- source_word: vinea vindemiata
  choice: в обобранном винограднике
  rationale: Передаёт виноградник после сбора урожая и сохраняет значение причастия vindemiata.
- source_word: subremanet
  choice: остаётся
  rationale: Прямо передаёт продолжившееся наличие оставшейся грозди, не превращая глагол в пассивное «оставлена».
- source_word: racemus patens
  choice: остаётся на виду гроздь
  rationale: Сохраняет единственное число racemus и значение patens — «открытая, видимая, находящаяся на виду» — в естественной русской форме.
- source_word: ab scrutantibus vindemiam diligenter
  choice: ускользнувшая от тех, кто тщательно осматривает урожай винограда
  rationale: Передаёт отделение или сохранение от внимательных искателей и не смешивает vindemiam («урожай, сбор винограда») с vineam («виноградник»).
