  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: ru
  text: 'Вот слово Господа: примите его и не сомневайтесь в том, о чём говорит Господь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: вот
  rationale: Краткое и естественное указательное восклицание, сохраняющее торжественную непосредственность латинского текста.
- source_word: verbum Domini
  choice: слово Господа
  rationale: Прямой и традиционно понятный эквивалент, не уточняющий без основания, идёт ли речь об отдельном речении или о возвещённой вести.
- source_word: excipite eum
  choice: примите его
  rationale: Excipite передаёт призыв принять обращённое к слушателям слово. Местоимение согласовано в русском с существительным «слово»; формальная несогласованность латинского eum с verbum не воспроизводится как, вероятно, текстовая или языковая шероховатость.
- source_word: ne discredatis
  choice: не сомневайтесь
  rationale: Передаёт запрет относиться к сказанному с неверием, оставаясь естественным для современного русского языка.
- source_word: de quibus dicit Dominus
  choice: в том, о чём говорит Господь
  rationale: Сохраняет конструкцию de quibus и её предметную направленность, не сводя её к иному смыслу «не сомневайтесь, что Господь говорит».
