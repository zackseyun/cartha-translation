  terminology: «Утверждены» уместно для fundatae и предпочтительнее нейтрального «созданы», поскольку передаёт этимологический образ основания/установления. «Словом Его» адекватно передаёт инструментальное in uerbo illius. Прописная буква в «Его» допустима как редакционная практика.
