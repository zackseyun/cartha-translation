  source_fidelity: Начальная формула в черновике верно не добавляет отсутствующий в латинском субъект «Тот, кто сказал». «Да будет небо» точно передаёт fiat caelum. Однако «оно возникло» несколько ослабляет причинно-творческий смысл factum est и может звучать как самопроизвольное появление; в библейской формуле точнее и естественнее «и стало». «Словом Его утверждены звёзды» удовлетворительно передаёт in uerbo illius stellae fundatae, сохраняя образ прочного установления.
