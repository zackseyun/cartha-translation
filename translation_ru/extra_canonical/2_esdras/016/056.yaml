  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: ru
  text: «Да будет небо», — и стало; и словом Его утверждены звёзды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: «Да будет небо»
  rationale: Сохраняет формулу повеления fiat и естественно перекликается с языком творения, не добавляя отсутствующего в латинском тексте глагола речи.
- source_word: factum est
  choice: оно возникло
  rationale: Передаёт совершившееся сотворение неба и избегает тяжеловесного буквального «было сделано».
- source_word: in uerbo illius
  choice: словом Его
  rationale: Латинское in здесь обозначает средство или действенную силу; по-русски естественно передаётся творительным падежом.
- source_word: stellae fundatae
  choice: утверждены звёзды
  rationale: Fundatae буквально связано с основанием и прочным установлением; «утверждены» сохраняет этот образ лучше, чем нейтральное «созданы».
theological_decisions:
- issue: Субъект формулы творения
  choice: Не добавлять «Тот, кто сказал»
  alternative: '«Тот, кто сказал: „Да будет небо“…»'
  rationale: В предоставленном латинском фрагменте субъект и глагол «сказал» отсутствуют; русский текст сохраняет обрывочную зависимость стиха от предшествующего контекста и не вносит добавления консультационного английского слоя.
- issue: Действенность божественного слова
  choice: «словом Его утверждены звёзды»
  alternative: «по Его слову были основаны звёзды»
  rationale: Выбранная формулировка сохраняет инструментальный смысл и богословский образ слова как действенной силы, не усиливая его сверх латинского текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксическая краткость отражает латинский источник; местоимение «Его» написано с прописной буквы как издательская норма для обозначения Бога.
