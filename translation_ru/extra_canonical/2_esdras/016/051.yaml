id: 2ES.16.51
reference: 2 Esdras 16:51
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: ru
  text: Как добропорядочная и весьма хорошая женщина негодует на блудницу[a], так праведность вознегодует на беззаконие, когда оно украшает себя, и обвинит его прямо в лицо, когда придёт тот, кто защищает того, кто исследует всякий грех на земле[b]. Поэтому не уподобляйтесь ему и его делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинский текст здесь труден и сжат. По-видимому, праведность и беззаконие сопоставляются с добропорядочной женщиной и блудницей; образ выражает открытое противостояние праведности беззаконию.
    reason: textual_variant
  - marker: b
    text: Латинская конструкция допускает разные синтаксические связи. Перевод сохраняет различие между приходящим защитником и «тем, кто исследует всякий грех», не отождествляя их.
    reason: ambiguity
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: негодует / вознегодует
  rationale: Латинское zelari здесь допускает оттенки ревности, негодования и непримиримой враждебности; «негодовать» естественно передаёт направленную нравственную реакцию без чрезмерного усиления до «ненавидеть».
- source_word: mulierem idonea et bona ualde
  choice: достойная и весьма добродетельная женщина
  rationale: Текст грамматически неровен; idonea передано как «достойная», а bona ualde — как «весьма добродетельная», поскольку исходник подчёркивает нравственное качество, а не прямо физическую красоту.
- source_word: fornicariam
  choice: блудницу
  rationale: Передаёт обозначение женщины, занимающейся развратом или проституцией, в dignified библейском регистре.
- source_word: iniquitatem
  choice: беззаконие
  rationale: Обычный и точный библейский эквивалент, сохраняющий олицетворение абстрактного зла.
- source_word: cum exornat se
  choice: когда оно нарядится
  rationale: Сохраняет возвратность и образ беззакония, внешне украшающего себя.
- source_word: accusat eam in faciem
  choice: обвинит его прямо в лицо
  rationale: Передаёт открытое, непосредственное обличение; местоимение согласовано с русским средним родом слова «беззаконие».
- source_word: qui defendat exquirentem omnem peccatum
  choice: кто защищает исследующего всякий грех
  rationale: Сохранена трудная синтаксическая конструкция и различие между защитником и тем, кто исследует грех, без молчаливого отождествления этих фигур.
- source_word: nolite similari eam nec operibus eius
  choice: не уподобляйтесь ему и его делам
  rationale: Сохраняет заключительный запрет; местоимения согласованы с ближайшим русским референтом «беззаконие».
theological_decisions:
- issue: Личность приходящего и связь с исследующим грех
  choice: «когда придёт тот, кто защищает исследующего всякий грех»
  alternative: «когда придёт защитник, исследующий всякий грех»
  rationale: Латинский текст различает qui defendat и причастие exquirentem в винительном падеже. Перевод сохраняет это грамматическое различие и не определяет богословскую личность обоих участников.
- issue: Олицетворение праведности и беззакония
  choice: Сохранены абстрактные существительные с действиями лиц
  alternative: Явно назвать их двумя женщинами
  rationale: Источник проводит образное сравнение, но не требует во второй части прямо превращать обе абстракции в женщин; сохранение олицетворения удерживает исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Блудница», «праведность» и «беззаконие» сохраняют традиционную сакральную лексику, тогда как синтаксис сделан понятным современному читателю. Неясность латинской грамматики отмечена в сносках, а не устранена догматическим толкованием.
