revisions:
- from: Как достойная и весьма добродетельная женщина негодует на блудницу[a], так праведность вознегодует на беззаконие, когда оно нарядится, и обвинит его прямо в лицо, когда придёт тот, кто защищает исследующего всякий грех на земле[b]. Поэтому не уподобляйтесь ему и его делам.
  to: Как добропорядочная и весьма хорошая женщина негодует на блудницу[a], так праведность вознегодует на беззаконие, когда оно украшает себя, и обвинит его прямо в лицо, когда придёт тот, кто защищает того, кто исследует всякий грех на земле[b]. Поэтому не уподобляйтесь ему и его делам.
  rationale: 'Исправлены две небезопасные конкретизации: нравственно-техническое «добродетельная» заменено более широким эквивалентом bona, а не выраженная в источнике характеристика защитника как небесного удалена из сноски. Неясный синтаксис последней относительной конструкции сохранён и пояснён без богословского решения.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T20:11:28Z'
review_pass:
  verdict: revise
  source_fidelity: Основной смысл и заключительное предостережение переданы верно. Однако «весьма добродетельная» несколько сужает латинское bona («хорошая, добропорядочная»), а в сноске a необоснованно вводится «небесный защитник». Трудную конструкцию qui defendat exquirentem следует сохранять без отождествления защитника с исследующим грех.
  naturalness: Текст в целом литературен и понятен. «Того, кто исследует всякий грех» звучит естественнее, чем субстантивированное «исследующего всякий грех», и яснее воспроизводит латинское различение двух лиц.
  terminology: «Блудница», «праведность» и «беззаконие» уместны для современного литературного библейского регистра. «Добропорядочная и весьма хорошая» передаёт нравственно-социальный контраст исходного сравнения, не приписывая тексту специально понятие добродетели.
  issues:
  - severity: medium
    issue: Сноска a называет приходящего «небесным защитником».
    rationale: В латинском тексте сказано лишь о том, «кто защищает»; небесный статус не выражен и не должен добавляться в пояснении.
  - severity: low
    issue: «Весьма добродетельная» чрезмерно конкретизирует bona.
    rationale: Bona прежде всего означает «хорошая»; в данном контрасте безопаснее передать широкое нравственное значение как «добропорядочная и весьма хорошая».
  - severity: low
    issue: Формулировка «защищает исследующего» тяжеловесна.
    rationale: Добавление «того, кто» сохраняет винительное дополнение exquirentem и делает различие между защитником и исследующим прозрачным по-русски.
  revised_text: Как добропорядочная и весьма хорошая женщина негодует на блудницу[a], так праведность вознегодует на беззаконие, когда оно украшает себя, и обвинит его прямо в лицо, когда придёт тот, кто защищает того, кто исследует всякий грех на земле[b]. Поэтому не уподобляйтесь ему и его делам.
