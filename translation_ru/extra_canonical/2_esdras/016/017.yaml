  text: missa fuerint in terram. Vae mihi, uae mihi! quis me liberabit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/017.yaml
  text: Woe is me, woe is me! Who will deliver me in those days?
translation:
  language: ru
  text: Горе мне, горе мне! Кто избавит меня?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae mihi
  choice: Горе мне
  rationale: Естественное и точное русское выражение скорби и бедствия; повтор сохранён для передачи напряжённости латинского текста.
- source_word: quis me liberabit
  choice: Кто избавит меня?
  rationale: Будущее время и открытый вопрос оригинала сохранены без уточнения субъекта или характера избавления.
theological_decisions:
- issue: Подразумеваемый избавитель
  choice: Не уточнять, кто именно может избавить говорящего
  alternative: «Кто спасёт меня?» с возможным более выраженным сотериологическим оттенком
  rationale: Латинское quis оставляет личность избавителя открытой, а liberabit в данном контексте нейтральнее передаётся глаголом «избавит».
- issue: Добавление обстоятельства времени
  choice: Не включать слова «в те дни»
  alternative: «Кто избавит меня в те дни?»
  rationale: В предоставленном латинском тексте стиха соответствующего выражения нет; его добавление вслед за английским консультационным текстом превысило бы данные оригинала.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и эмоционально напряжённый строй оригинала сохранён. Начальные слова «missa fuerint in terram» расценены как окончание предшествующего контекста и в текст данного стиха не включены.
