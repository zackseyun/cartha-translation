lexical_decisions:
- source_word: uae peccantibus
  choice: Горе тем, кто грешит
  rationale: Латинская формула «vae» естественно и точно передаётся традиционным русским «горе», а причастие «peccantibus» — ясным придаточным «кто грешит».
- source_word: uolentibus occultare peccata sua
  choice: и хочет скрыть свои грехи
  rationale: Сохраняет значение желания или намерения («volentibus»), действие сокрытия («occultare») и возвратную отнесённость грехов к самим грешащим («sua»).
