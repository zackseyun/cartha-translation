  text: the more I will be zealous against them for their sins, says the Lord. How
translation:
  language: ru
  text: тем ревностнее Я выступлю против них за их грехи, — говорит Господь. Как
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magis
  choice: тем ревностнее
  rationale: Сравнительное наречие передано конструкцией «тем…», поскольку стих продолжает предшествующее сопоставление; это сохраняет зависимый характер фрагмента.
- source_word: adzelabor
  choice: Я выступлю против них
  rationale: Редкий глагол выражает ревностное, деятельное противодействие. «Выступлю против» естественно по-русски передаёт направленность против eos, а наречие «ревностнее» сохраняет семантику рвения, не сводя её только к гневу.
- source_word: super peccata
  choice: за их грехи
  rationale: 'В данном контексте super обозначает основание направленного против людей действия: наказание или противодействие за совершённые ими грехи.'
- source_word: Quomodo
  choice: Как
  rationale: Слово относится к следующему предложению и сохранено в конце стиха, как в исходном делении текста.
theological_decisions:
- issue: Характер Божьего отношения к грешникам
  choice: «ревностнее Я выступлю против них»
  alternative: «сильнее Я разгневаюсь на них»
  rationale: Перевод сохраняет деятельное рвение, выраженное adzelabor, и не заменяет его более узким понятием гнева.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Заглавная буква в «Я» обозначает речь Господа. Конечное «Как» намеренно оставлено незавершённым, поскольку оно открывает следующую фразу.
