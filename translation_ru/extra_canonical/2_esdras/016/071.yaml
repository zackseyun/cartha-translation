  text: Erit enim locis locus et in uicinas ciuitates exsurrectio multa
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/071.yaml
  text: For there will be much uprising in place after place and in the neighboring cities.
translation:
  language: ru
  text: Ибо место за местом и в соседних городах будут вспыхивать многочисленные восстания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: locis locus
  choice: повсюду
  rationale: Испорченная или необычная латинская формула, вероятно передающая распределительное значение «место за местом»; по-русски естественнее краткое «повсюду», сохраняющее широту охвата.
- source_word: in uicinas ciuitates
  choice: в том числе и в соседних городах
  rationale: Предлог in при обозначении места передан русским «в»; добавление «в том числе» естественно связывает соседние города с предшествующим общим указанием на многочисленные места.
- source_word: exsurrectio multa
  choice: многочисленные восстания
  rationale: Exsurrectio здесь означает поднятие, мятеж или восстание; согласование multa с единственным собирательным существительным передано естественным русским множественным числом без уточнения участников или направленности.
theological_decisions:
- issue: Объект или направленность восстаний
  choice: Не указывать, против кого направлены восстания
  alternative: «восстания против боящихся Господа»
  rationale: В приведённом латинском тексте объект отсутствует; его добавление внесло бы неподтверждённое содержание.
translation_notes:
  register: Современный литературный русский язык; фраза звучит торжественно, но понятно. Сохранена причинная связь enim («ибо») и намеренно не конкретизированы характер и участники беспорядков.
