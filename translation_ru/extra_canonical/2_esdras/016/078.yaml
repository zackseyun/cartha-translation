  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: ru
  text: грехи ваши, и пусть беззакония ваши не возьмут над вами верх.[a] Горе тем, кто крепко связаны своими грехами и покрыты своими беззакониями, как поле, окружённое лесом, семена которого покрыты терниями. Через него никто не проходит; оно отгорожено и отдано на пожрание огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих начинается словами, завершающими предложение из предыдущего стиха согласно принятому здесь делению.
    reason: verse_boundary
lexical_decisions:
- source_word: supereleuent
  choice: не возьмут над вами верх
  rationale: Передаёт значение превосходства или одоления естественным современным русским выражением; подразумеваемое «над вами» следует контексту и английскому консультационному слою.
- source_word: constringuntur
  choice: крепко связан
  rationale: Сохраняет образ людей, прочно стянутых и удерживаемых собственными грехами.
- source_word: obteguntur
  choice: покрыт
  rationale: Прямо сохраняет параллель между людьми, покрытыми беззакониями, и семенами, покрытыми терновником.
- source_word: ager constringitur a silua
  choice: полю, окружённому лесом
  rationale: Буквальное «стянуто лесом» по-русски неестественно; «окружённому» ясно передаёт поле, зажатое со всех сторон.
- source_word: semina eius
  choice: чьи семена
  rationale: Сохраняет формально множественное латинское semina и не уточняет сверх источника, идёт ли речь о семенах или всходах.
- source_word: per quem non transit homo
  choice: Через это поле никто не проходит
  rationale: Сохраняет простое изъявительное утверждение латинского текста, не превращая его в придаточное следствия или возможности.
- source_word: ad deuorationem ignis
  choice: на пожрание огню
  rationale: Сохраняет сильную персонифицированную метафору пожирающего огня в достойном библейском регистре.
theological_decisions:
- issue: Отношение человека к собственным грехам и беззакониям
  choice: Сохранены образы связанности и покрытия без объяснения их как вины, наказания или нравственной неспособности
  alternative: Истолковать метафоры как конкретное учение о порабощении грехом
  rationale: Латинский текст даёт яркую метафору, но не раскрывает её догматически; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксис упрощён там, где длинная латинская конструкция была бы тяжела, но последовательность образов и неоднозначность сохранены.
