  source_fidelity: Начальный фрагмент верно сохранён как продолжение предыдущего стиха; «не возьмут над вами верх» удачно передаёт nec supereleuent. Образы связанности, покрытия, недоступного поля и предания огню в целом соответствуют латинскому тексту. Однако относительное «чьи семена» после «лесом» грамматически относит семена к лесу, а не к полю, что искажает связь semina eius с ager.
  naturalness: 'Нужна правка согласования: при «тем, кто» краткие формы должны быть во множественном числе: «связаны» и «покрыты». Перестройка сравнения также устранит двусмысленность и сделает фразу естественной в современном литературном русском.'
  terminology: «Горе», «грехи», «беззакония», «тернии» и «на пожрание огню» выдержаны в умеренно возвышенном библейском регистре и не вносят доктринальных интерпретаций. «Тернии» точнее, чем «терновник», для латинского spinis.
