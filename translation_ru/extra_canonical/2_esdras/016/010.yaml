  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/010.yaml
  text: Will there be anyone to extinguish him? He will flash forth, and who will not fear?
translation:
  language: ru
  text: Найдётся ли тот, кто погасит его? Он сверкнёт — и кто не устрашится?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est qui extinguat eum?
  choice: Найдётся ли тот, кто погасит его?
  rationale: Латинская конструкция выражает вопрос о существовании того, кто способен погасить или потушить его. «Погасит» сохраняет образ огня или света и естественно звучит по-русски.
- source_word: Coruscabit
  choice: Он сверкнёт
  rationale: Глагол coruscare означает сверкать, блистать, вспыхивать. Будущее совершенного вида передаёт внезапное проявление блеска.
- source_word: quis non timebit?
  choice: кто не устрашится?
  rationale: Риторический вопрос и будущее время сохранены; «устрашится» передаёт сильный страх в достойном библейском регистре без добавления отсутствующих в источнике образов.
theological_decisions:
- issue: Неясный референт местоимения eum и подразумеваемого субъекта coruscabit
  choice: Сохранено мужское местоимение «его» и субъект «он» без поясняющей конкретизации
  alternative: Назвать референта прямо, например огонь или Бога
  rationale: В данном фрагменте латинского текста референт не назван; конкретизация могла бы снять подлинную контекстуальную неоднозначность и внести толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире подчёркивает силу риторического следствия. Сноски не требуются.
