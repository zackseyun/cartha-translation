  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: ru
  text: 'И увидел я: вот, он распростирал свои крылья над всей землёй, и все небесные ветры дули на него[b], а облака собирались к нему[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «а облака собирались к нему» присутствуют в очищенном латинском тексте Бенсли, но заключены в скобки как текстуально не вполне надёжные.
    reason: textual_variant
  - marker: b
    text: 'Или: «вокруг него».'
    reason: previous_rendering
lexical_decisions:
- source_word: expandebat alas suas
  choice: распростёр свои крылья
  rationale: Передаёт образ широкого простирания крыльев над всей землёй; совершенный вид естественно звучит в описании увиденного.
- source_word: in omnem terram
  choice: над всей землёй
  rationale: В данном образном контексте латинское in обозначает пространственное распространение над землёй.
- source_word: omnes uenti caeli
  choice: все небесные ветры
  rationale: Естественная и возвышенная передача латинского оборота без лишнего уточнения.
- source_word: insufflabant ad eam
  choice: дули на него
  rationale: Сохраняет направленность ветров к орлу; местоимение мужского рода согласовано с подразумеваемым русским словом «орёл».
- source_word: '[nubes ad eam] colligebantur'
  choice: облака собирались к нему
  rationale: Сохраняет направительное значение ad («к нему»), не заменяя его пространственным «вокруг»; текстовая неуверенность отмечена сноской.
