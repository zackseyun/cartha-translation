  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: ru
  text: 'рыча; и я услышал, как он обратился к орлу человеческим голосом и сказал: «Слушай, и я буду говорить с тобой; Всевышний говорит тебе:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mugiens
  choice: рыча
  rationale: Передаёт причастие настоящего времени и сохраняет связь с предыдущим стихом, поскольку данный фрагмент начинается внутри продолжающегося предложения.
- source_word: emisit uocem hominis ad aquilam
  choice: издал человеческий голос, обращённый к орлу
  rationale: Сохраняет образ буквального «испускания» человеческого голоса и направление речи к орлу, не подменяя формулировку более свободным «заговорил человеческим голосом».
- source_word: dixit dicens
  choice: сказал, говоря
  rationale: Намеренно сохраняет семитизированную удвоенную формулу латинского текста, несмотря на её необычность для современного русского.
- source_word: Audi tu
  choice: Слушай
  rationale: Естественный русский императив; отдельное местоимение tu служит усилению, которое в русском уже выражено прямым обращением и контекстом.
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшееся и точное русское обозначение Бога, соответствующее латинскому превосходному эпитету.
