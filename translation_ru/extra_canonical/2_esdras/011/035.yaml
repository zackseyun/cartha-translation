  yaml_path: translation/extra_canonical/2_esdras/011/035.yaml
  text: The head on the right side devoured the one on the left. And I heard a voice saying to me, “Look before you, and—”
translation:
  language: ru
  text: 'Голова справа пожрала ту, что слева. И я услышал голос, говоривший мне: «Посмотри перед собой и…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинский текст в этом месте обрывается в начале следующего слова.
    reason: Многоточие и примечание передают фактическую незавершённость представленного латинского фрагмента, не восполняя утраченное содержание предположительно.
lexical_decisions:
- source_word: deuorauit
  choice: пожрала
  rationale: Передаёт сильное и конкретное значение латинского глагола «поглотила, сожрала»; форма согласована с существительным «голова».
- source_word: caput a dextera parte
  choice: голова справа
  rationale: Естественная русская передача пространственного оборота без избыточно буквального «с правой стороны».
- source_word: illud quod est a laeua
  choice: ту, что была слева
  rationale: Сохраняет отсылку к другой голове, не добавляя отсутствующего в данном фрагменте существительного.
- source_word: conspice contra te
  choice: посмотри перед собой
  rationale: Передаёт повеление обратить взгляд на находящееся впереди; не уточняет объект, которого латинский текст здесь не называет.
