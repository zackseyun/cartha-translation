  yaml_path: translation/extra_canonical/2_esdras/011/023.yaml
  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: ru
  text: Двенадцать крыльев и два малых крыла исчезли. И на теле орла не осталось ничего, кроме трёх покоящихся голов и шести малых крыльев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conparuerunt
  choice: исчезли
  rationale: По контексту форма передаёт прекращение видимости или исчезновение; прямое «исчезли» естественно по-русски и соответствует принятому прочтению консультационного слоя.
- source_word: pennae
  choice: крыльев
  rationale: Основные крылья орла, противопоставленные уменьшительному pennacula.
- source_word: pennacula
  choice: малых крыла / малых крыльев
  rationale: Уменьшительная форма обозначает меньшие крылья или крылышки; «малые крылья» сохраняет различие с pennae и звучит достойнее, чем «крылышки».
- source_word: tria capita quiescentia
  choice: трёх покоящихся голов
  rationale: Причастие quiescentia сохранено без уточнения, означает ли оно неподвижность, бездействие или покой.
- source_word: nihil superauit
  choice: не осталось ничего
  rationale: В данном контексте superare имеет значение «оставаться, сохраняться»; русская конструкция передаёт его естественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; образность и различие между большими и малыми крыльями сохранены. Синтаксис слегка сглажен для ясности, без устранения неоднозначности слова quiescentia.
