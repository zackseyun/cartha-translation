id: 2ES.11.46
reference: 2 Esdras 11:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: ru
  text: и твои нечестивые когти, и всё твоё никчёмное тело, чтобы вся земля освежилась[a] и получила облегчение, освободившись от твоего насилия, и стала уповать на суд и милость Сотворившего её».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрела покой».'
    reason: Латинское refrigeret буквально связано с прохладой и освежением, но в контексте может обозначать покой и передышку.
lexical_decisions:
- source_word: ungues tui pessimi
  choice: твои нечестивые когти
  rationale: Передаёт резко отрицательную нравственную оценку pessimi и сохраняет образ когтей.
- source_word: omne corpus tuum uanum
  choice: всё твоё никчёмное тело
  rationale: Vanum здесь характеризует тело как негодное, лишённое ценности; «никчёмное» естественно передаёт этот смысл по-русски.
- source_word: refrigeret
  choice: освежилась
  rationale: Сохраняет основной образ охлаждения и восстановления сил, а не сводит значение только к покою.
- source_word: releuetur
  choice: получила облегчение
  rationale: Естественно передаёт снятие бремени и тяготы.
- source_word: liberata de tua ui
  choice: освободившись от твоего насилия
  rationale: Liberata передано как освобождение, а uis в данном контексте — как насильственная власть или насилие.
- source_word: speret
  choice: стала уповать
  rationale: «Уповать» уместно в возвышенном библейском регистре и выражает направленную надежду.
theological_decisions:
- issue: Соотношение суда и милости Творца
  choice: уповать на суд и милость Сотворившего её
  alternative: уповать на милостивый суд Сотворившего её
  rationale: Латинский текст координирует iudicium et misericordiam как два понятия; перевод не объединяет их и сохраняет богословское напряжение между судом и милостью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «и» сохранено, поскольку стих синтаксически продолжает предыдущую реплику; заключительная кавычка также сохранена.
