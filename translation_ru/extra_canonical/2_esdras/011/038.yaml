  text: Не ты ли тот, кто уцелел из четырёх зверей, которых Я создал?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nonne tu es qui
  choice: Не ты ли тот, кто
  rationale: Передаёт риторический вопрос с ожидаемым утвердительным ответом и естественно вводит определительное придаточное.
- source_word: superasti de quattuor animalibus
  choice: уцелел из четырёх зверей
  rationale: Здесь superare употреблено в значении «пережить, остаться в живых», а de quattuor обозначает выделение из группы. Такой перевод соответствует контексту последнего из четырёх зверей; вариант «превзошёл четырёх зверей» хуже объясняет предлог de.
- source_word: animalibus
  choice: зверей
  rationale: В апокалиптическом контексте «звери» — естественный и традиционно понятный русский эквивалент латинского animalia.
- source_word: quae feceram
  choice: которых Я создал
  rationale: Сохраняет отнесение местоимения к четырём зверям и передаёт facere как Божье творческое действие; прописная «Я» указывает на говорящего Бога.
theological_decisions:
- issue: Отношение последнего зверя к остальным трём
  choice: уцелел из четырёх зверей
  alternative: одержал верх над четырьмя зверями
  rationale: Латинская конструкция superasti de quattuor animalibus указывает скорее на оставшегося в живых представителя группы, чем на победителя над всей группой. Перевод не добавляет идеи завоевания, которой контекст и предлог de не требуют.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная форма риторического вопроса. Синтаксис близок к латинскому, но естественен для обычного читателя.
