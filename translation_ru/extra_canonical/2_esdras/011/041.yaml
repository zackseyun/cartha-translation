  language: ru
  text: И ты судил землю не по истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicasti
  choice: судил
  rationale: Прямо передаёт латинский глагол iudicare во 2-м лице единственного числа и сохраняет обращение к орлу.
- source_word: terram
  choice: землю
  rationale: Соответствует латинскому terram и естественно звучит в контексте суда над обитаемым миром.
- source_word: non [in veritate]
  choice: не по правде
  rationale: Естественная русская передача отрицания справедливого и истинного суда. Представленный латинский отрывок обрывается на non, однако продолжение устойчивой фразы отражено в проверочном английском слое.
theological_decisions:
- issue: Смысл выражения о неправедном суде
  choice: не по правде
  alternative: не по истине
  rationale: «Не по правде» в современном русском яснее выражает несправедливость суда, не вводя дополнительного конфессионального толкования; при этом сохраняется связь истины и справедливости, присущая выражению in veritate.
translation_notes:
  register: Современный литературный русский; краткая, торжественная обвинительная формулировка. Союз «И» сохранён как связь с предыдущим рядом обвинений.
