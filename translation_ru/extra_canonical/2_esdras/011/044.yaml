source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et respexit Altissimus super sua tempora, et ecce finita sunt et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: ru
  text: И Всевышний воззрел на Свои времена — и вот, они окончились, и века Его исполнились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respexit
  choice: воззрел
  rationale: Передаёт целенаправленный взгляд Всевышнего и сохраняет возвышенный библейский регистр.
- source_word: tempora
  choice: времена
  rationale: Прямое и естественное соответствие множественному числу латинского слова.
- source_word: saecula
  choice: века
  rationale: Сохраняет широкое значение длительных периодов или эпох, не сводя его к одному конкретному толкованию.
- source_word: conpleta sunt
  choice: завершились
  rationale: Естественно по-русски передаёт достижение полноты и конца; отличие от «окончились» позволяет сохранить параллелизм без тяжёлого повтора.
theological_decisions:
- issue: К кому относится притяжательное местоимение sua/eius
  choice: 'Сохранено мужское единственное число: «его времена», «века его»'
  alternative: «Свои времена», «свои века» — как относящиеся к Всевышнему
  rationale: Латинские местоимения допускают зависимость от контекстуального мужского референта. Перевод не отождествляет референта с Всевышним и сохраняет формальную неоднозначность настолько, насколько это возможно по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «века его» сохраняет ритм и подчёркивает параллелизм исходного текста.
