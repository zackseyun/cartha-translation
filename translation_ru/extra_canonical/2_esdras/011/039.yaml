  text: regnare in saeculo meo, et ut per ea ueniret finis temporum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: ru
  text: Разве не ты один остался[a] из четырёх зверей, которых Я поставил царствовать в Моём мире, чтобы через них пришёл конец Моих времён?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелел из числа четырёх зверей».'
    reason: 'Сохраняет возможный оттенок латинского superare («уцелеть, пережить»), тогда как основной текст яснее передаёт партитивный смысл: остался один из четырёх.'
lexical_decisions:
- source_word: superasti de quattuor animalibus
  choice: остался из четырёх зверей
  rationale: 'Передаёт партитивный смысл: этот зверь — последний оставшийся из группы четырёх, а не тот, кто пережил нападение зверей.'
- source_word: feceram regnare
  choice: поставил царствовать
  rationale: Естественно передаёт каузативную конструкцию «сделал так, чтобы царствовали» и предшествование этого действия моменту речи.
- source_word: in saeculo meo
  choice: в Мой век
  rationale: Сохраняет эсхатологически ёмкое латинское saeculum и связь с последующим «концом времён», не сужая значение до обычной человеческой эпохи.
- source_word: per ea
  choice: через них
  rationale: Сохраняет инструментально-посредническое значение per и множественное число, относящееся к четырём зверям.
- source_word: finis temporum
  choice: конец Моих времён
  rationale: Прямо передаёт finis temporum с притяжательным meorum, известным из полного контекста стиха, и сохраняет множественное число.
theological_decisions:
- issue: Отношение четырёх зверей к наступлению конца времён
  choice: чтобы через них пришёл конец Моих времён
  alternative: чтобы после них пришёл конец Моих времён
  rationale: Латинское per ea буквально обозначает «через них» и допускает мысль об их роли как средстве или историческом посреднике; перевод «после них» неоправданно устранил бы эту напряжённость.
- issue: Значение «Моего века»
  choice: в Мой век
  alternative: в Моём мире / в Моей эпохе
  rationale: Формулировка сохраняет неоднозначность saeculum между веком, эпохой и устроением мира, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Прописные буквы в «Я», «Мой», «Моих» обозначают речь Бога; синтаксис вопроса сохранён без архаических оборотов.
