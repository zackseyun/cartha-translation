  source_fidelity: 'Начальное «будет держаться в течение твоего срока» в целом передаёт смысл латинского tenebit tempus tuum, однако последующее «но даже не половины его» не образует нормативной русской конструкции: в латинском здесь эллипсис, который по-русски безопасно восполнить повтором глагола. «Третье крыло» оправдано контекстуально подразумеваемым ala; «правило» верно передаёт tenuit principatum. «Исчезло» естественно передаёт non apparuit в данном повествовательном контексте («больше не являлось/не было видно»).'
