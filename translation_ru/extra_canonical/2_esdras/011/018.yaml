lexical_decisions:
- source_word: tenebit tempus tuum
  choice: будет держаться в течение твоего срока
  rationale: Передаёт длительность правления естественным современным русским языком, сохраняя обращение во втором лице; буквальный оборот «будет держать твоё время» по-русски неясен.
- source_word: sed nec dimidium eius
  choice: но даже не половины его
  rationale: Сохраняет эллиптичность латинского текста и усилительное nec — «даже не»; местоимение отнесено к «сроку».
- source_word: tertia
  choice: третье крыло
  rationale: В латыни форма женского рода согласована с подразумеваемым ala («крыло»); существительное восстановлено из контекста, а род приведён в соответствие с русским словом «крыло».
- source_word: tenuit principatum
  choice: правило
  rationale: Естественно выражает осуществление верховной власти; тяжеловесное буквальное «держало правление» в современном русском неуместно.
- source_word: non apparuit
  choice: исчезло
  rationale: В данном повествовательном контексте передаёт прекращение видимого присутствия; буквальное «не явилось» могло бы ошибочно подразумевать, что крыло вовсе не поднималось.
