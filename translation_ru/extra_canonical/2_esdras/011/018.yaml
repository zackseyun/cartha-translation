  terminology: «Крыло», «правило» и «срок» уместны. Не следует уточнять «срок власти», поскольку такого уточнения в данном латинском отрывке нет. Примечание лучше формулировать как указание на буквальный образ, не выдавая неестественную кальку за самостоятельный русский вариант.
