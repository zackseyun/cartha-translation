  source_fidelity: Первая часть точно передаёт всеохватную власть головы (caput percontinuit omnem terram). Однако «с великим гнётом властвовала» — неестественная русская сочетаемость и менее ясно выражает cum labore multo в контексте угнетающего правления. Заключительная формула видения сохранена верно и намеренно остаётся незавершённой.
  naturalness: '«С великим гнётом властвовала» звучит тяжеловесно: гнёт обычно испытывают, налагают или держат под ним. Формулировка «тяжко угнетая её жителей» современна, литературна и сохраняет смысл притеснительного владычества. «Господствовала ... сильнее всех крыльев» также можно сделать более плавным без смыслового расширения.'
  terminology: Образы «голова» и «крылья» сохранены, без аллегорического истолкования. «Обитаемый мир» адекватно передаёт orbis terrarum в данном контексте. «Власть ... превосходящую власть» ясно передаёт potentatum tenuit ... super omnes alas, не добавляя конкретизации природы этой власти.
