  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: ru
  text: 'И эта голова подчинила себе всю землю и властвовала над её жителями, тяжко угнетая их; она удерживала власть над обитаемым миром, превосходящую власть всех крыльев, которые были прежде неё. После этого я увидел — и вот:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput percontinuit omnem terram
  choice: эта голова подчинила себе всю землю
  rationale: Редкий глагол percontinuit здесь передаёт всеохватное удержание земли под властью; «подчинила себе» естественно выражает это в современном русском и согласуется с дальнейшим dominavit.
- source_word: dominauit qui inhabitant in ea cum labore multo
  choice: с великим гнётом властвовала над её жителями
  rationale: Латинское cum labore multo буквально допускает «с великим трудом/тяготой», но в контексте власти естественнее относится к тяготе, испытываемой жителями; «с великим гнётом» сохраняет смысл тяжёлого, притеснительного господства, не делая формулировку чрезмерно пояснительной.
- source_word: potentatum tenuit orbis terrarum
  choice: господствовала над обитаемым миром
  rationale: Potentatum tenere означает удерживать верховную власть; orbis terrarum обозначает населённый земной мир. Русская формулировка передаёт смысл без латинизма.
- source_word: super omnes alas quae fuerunt
  choice: сильнее всех крыльев, которые были прежде неё
  rationale: Super выражает превосходство власти этой головы над прежними крыльями; «сильнее» ясно передаёт сравнительный смысл, а «были прежде неё» сохраняет контекстуальную временную последовательность.
- source_word: Et uidi post haec et ecce
  choice: 'После этого я увидел — и вот:'
  rationale: Сохранена формула видения и незавершённый переход к следующему стиху; двоеточие показывает, что далее следует содержание увиденного.
