    issue: «встал на свои когти»
    rationale: Это ослабляет динамику surrexit («поднялся») и в русском может восприниматься как обычная поза животного, тогда как источник описывает его подъём на когти.
  - severity: low
    issue: 'Сноска «Или: “возгласил”»'
    rationale: Вариант не вполне отражает существительное vocem; «издал голос» ближе к латинской идиоме и к основному смыслу.
