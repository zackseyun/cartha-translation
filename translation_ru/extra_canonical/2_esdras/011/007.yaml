  yaml_path: translation/extra_canonical/2_esdras/011/007.yaml
  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
translation:
  language: ru
  text: 'И увидел я: вот, орёл поднялся на свои когти и подал голос[a] своим крыльям, говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издал голос».'
    reason: Передаёт допустимый вариант латинской идиомы misit vocem, сохраняя образ голоса.
lexical_decisions:
- source_word: surrexit aquila super ungues suos
  choice: орёл встал на свои когти
  rationale: Передаёт необычный образ латинского текста без сглаживания до более общего «поднялся»; «когти» соответствует ungues и сохраняет зрительную конкретность видения.
- source_word: misit uocem
  choice: подал голос
  rationale: Естественный русский эквивалент идиомы со значением «издал/возвысил голос»; не понимает mittere буквально как физическую отправку голоса.
- source_word: pennis suis
  choice: своим крыльям
  rationale: Дательный падеж передаёт направленность речи к крыльям; сохраняется олицетворение частей орла.
- source_word: dicens
  choice: говоря
  rationale: Сохраняет явный ввод прямой речи в источнике и соответствует завершающему двоеточию.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным повествовательным тоном. Формула «И увидел я: вот» сохраняет визионерскую последовательность исходного текста; необычный образ орла, стоящего на когтях и говорящего крыльям, намеренно не рационализирован.'
