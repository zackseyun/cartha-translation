- source_word: non conparuit
  choice: исчезла
  rationale: В данном видении выражение означает, что поднявшаяся фигура перестала быть видимой; «исчезла» звучит ясно и естественно.
- source_word: Et secunda, et haec
  choice: затем вторая — и она также…
  rationale: Сохраняет незавершённость дошедшего латинского текста и не восполняет отсутствующие слова по предположению.
