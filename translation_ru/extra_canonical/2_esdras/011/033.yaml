  text: And after this I looked[a], and behold, the middle head suddenly disappeared, just as the wings had done.
translation:
  language: ru
  text: После этого я взглянул — и вот, средняя голова внезапно исчезла, как исчезли крылья.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
