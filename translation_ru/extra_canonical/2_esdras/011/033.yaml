    reason: Поясняет эллиптическое et hoc sicut alae, сохраняя возможность буквального и развёрнутого понимания.
lexical_decisions:
- source_word: medium caput
  choice: средняя голова
  rationale: Прямо передаёт положение головы среди трёх и сохраняет образ видения.
- source_word: subito non conparuit
  choice: внезапно исчезла
  rationale: Латинское non conparuit буквально означает «не стала видна / больше не появлялась»; в данном повествовательном контексте естественный русский эквивалент — «исчезла».
- source_word: et hoc sicut alae
  choice: как прежде исчезли крылья
  rationale: Эллиптическая фраза отсылает к исчезновению крыльев; глагол восполнен для ясности, а «прежде» естественно выражает подразумеваемое сопоставление с уже описанным событием.
