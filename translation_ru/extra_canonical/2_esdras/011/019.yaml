lexical_decisions:
- source_word: Et sic contingebat
  choice: И так… доставалась
  rationale: Передаёт повторяющееся событие в контексте последовательной смены правителей; русская конструкция с дательным падежом естественно сочетается со словом «власть».
- source_word: omnibus alis
  choice: всем крыльям
  rationale: Сохраняет образ исходного текста и значение охвата всех крыльев.
- source_word: singulatim
  choice: поочерёдно
  rationale: Выражает, что крылья получали власть одно за другим, а не одновременно.
- source_word: principatum
  choice: власть
  rationale: В данном контексте означает правление или верховенство; «власть» звучит ясно и естественно, не добавляя отсутствующих в источнике подробностей.
