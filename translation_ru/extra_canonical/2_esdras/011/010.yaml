source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce uox non exiebat de capitibus eius, sed de medietate corporis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/010.yaml
  text: And I looked, and behold, a voice did not come out from its heads, but from the middle of its body.
translation:
  language: ru
  text: 'И увидел я: вот, голос исходил не из его голов, а из середины его тела.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'И увидел я: вот'
  rationale: Сохранена библейская формула видения, но двукратное латинское et передано естественным для современного русского синтаксисом.
- source_word: uox non exiebat
  choice: голос исходил не
  rationale: 'Отрицание отнесено к источнику голоса: следующая конструкция sed задаёт противопоставление «не из голов, а из середины тела»; по-русски это яснее и естественнее, чем буквальное «голос не исходил из голов, но…».'
- source_word: de capitibus eius
  choice: из его голов
  rationale: Сохранено множественное число capitibus и местоименная соотнесённость с ранее описанным существом.
- source_word: de medietate corporis eius
  choice: из середины его тела
  rationale: Medietas обозначает среднюю часть; «середина тела» точно и естественно передаёт пространственный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной формулы видения. Двоеточие помогает естественно передать связку et ecce; артиклевая неопределённость латыни по-русски специально не маркируется.
