    issue: «его не стало видно ... не было видно и места его»
    rationale: Эта формулировка истолковывает повтор apparuit/appareret как утрату зрительной видимости. Латинский текст повторяет глагол явления/появления и не определяет, исчез ли предмет, перестал ли проявляться или лишь не был виден. Следует сохранить повтор без такого уточнения.
