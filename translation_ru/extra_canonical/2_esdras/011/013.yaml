id: 2ES.11.13
reference: 2 Esdras 11:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: ru
  text: 'И случилось так: когда оно царствовало, пришёл ему конец, и оно не явилось, так что не явилось и место его; затем поднялось следующее, воцарилось и удерживало власть долгое время.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnaret / regnauit
  choice: царствовало / воцарилось
  rationale: Передаёт правление и сохраняет различие между продолжающимся царствованием первого и вступлением в царствование следующего.
- source_word: uenit ei finis
  choice: пришёл ему конец
  rationale: Близко воспроизводит латинскую конструкцию, не уточняя способ прекращения его власти или существования.
- source_word: non apparuit ... non appareret locus eius
  choice: его не стало видно, так что не было видно и места его
  rationale: Сохраняет повтор глагола видимости и не заменяет его более определённым утверждением об уничтожении или исчезновении.
- source_word: sequens exsurrexit
  choice: затем поднялось следующее
  rationale: «Следующее» сохраняет подразумеваемый из контекста образ без внесения существительного, отсутствующего в стихе; «поднялось» прямо передаёт exsurrexit.
- source_word: ipsa multum tenuit tempus
  choice: удерживало власть долгое время
  rationale: Идиоматически передаёт продолжительное обладание царской властью; буквальное «держало много времени» по-русски неясно и неестественно.
theological_decisions:
- issue: Характер конца первого правителя или символического элемента
  choice: Не уточнять, было ли оно уничтожено, умерло или лишь исчезло из виду
  alternative: «оно исчезло» или «было уничтожено»
  rationale: Латинское non apparuit выражает отсутствие видимости/явления и само по себе не определяет причину.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Местоимение среднего рода сохраняет отсутствие названного существительного внутри данного стиха и соответствует консультационному английскому тексту; повтор «не стало видно / не было видно» намеренно отражает повтор apparuit / appareret.
