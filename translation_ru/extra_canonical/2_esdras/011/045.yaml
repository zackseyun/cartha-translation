base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/045.yaml
  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: ru
  text: Поэтому пусть больше никогда не появятся[a] ни ты, орёл, ни твои страшные крылья, ни твои самые нечестивые маховые перья, ни твои злобные головы, ни твои самые нечестивые когти, ни всё твоё ничтожное тело —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не являясь, не являйся»; повторение выражает усиление: «исчезните совершенно» или «никогда больше не появляйтесь».'
    reason: Поясняет необычную латинскую эмфатическую конструкцию и сохраняет возможные способы её передачи.
lexical_decisions:
- source_word: non apparens non appareas
  choice: пусть больше никогда не появятся
  rationale: Эмфатическая конструкция с повторением глагола передаёт решительное пожелание полного и окончательного исчезновения; русский оборот сохраняет образ «появления», но звучит естественно.
- source_word: aquila
  choice: орёл
  rationale: Прямое соответствие латинскому обозначению орла; обращение сохраняет образ видения.
- source_word: alae tuae horribiles
  choice: твои страшные крылья
  rationale: Формально и естественно передаёт horribiles и alae.
- source_word: pennacula tua pessima
  choice: твои самые нечестивые маховые перья
  rationale: «Маховые перья» ясно отличает pennacula от крыльев, а превосходная степень передаёт pessima без необоснованного уменьшительного оттенка.
- source_word: capita tua maligna
  choice: твои злобные головы
  rationale: Сохраняет множественное число и нравственно-враждебную окраску maligna.
- source_word: ungulae tuae nequissimae
  choice: твои нечестивые когти
  rationale: В контексте орла анатомически естественно «когти»; «нечестивые» передаёт резко отрицательную нравственную оценку.
- source_word: omne corpus tuum vanum
  choice: всё твоё ничтожное тело
  rationale: Vanum здесь характеризует всё тело как негодное и лишённое ценности; «ничтожное» естественно в контексте обличения.
theological_decisions:
- issue: Смысл эмфатического оборота non apparens non appareas
  choice: Пожелание, чтобы орёл и все части его тела больше никогда не появились
  alternative: «исчезни совершенно» или буквальное «не появляясь, не появляйся»
  rationale: Конструкция, вероятно отражающая семитский эмфатический оборот через переводной греческий, усиливает отрицательное пожелание. Формулировка не превращает его в целевое придаточное и не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский с торжественно-пророческой интонацией. Перечень оформлен повторяющимся «ни», чтобы согласовать орла и части его тела с формой множественного числа и сохранить нарастающее обличение. Конечное тире оставлено, поскольку фраза продолжается в следующем стихе.
