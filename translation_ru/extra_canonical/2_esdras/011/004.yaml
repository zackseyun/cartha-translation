source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: ru
  text: Ибо головы орла покоились[a], и средняя голова была больше остальных, но и она покоилась вместе с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но».'
    reason: 'Сохраняется зафиксированный вариант прежнего перевода, хотя основное значение Nam здесь пояснительное: «ибо».'
lexical_decisions:
- source_word: Nam
  choice: Ибо
  rationale: Передаёт пояснительно-причинное значение латинского союза и связывает стих с предыдущим; противительное значение выражено далее словом sed.
- source_word: quiescentia / quiescebat
  choice: покоились / покоилась
  rationale: Сохраняет повтор одного латинского корня и описывает состояние бездействия голов.
- source_word: medium caput
  choice: средняя голова
  rationale: Прямое и естественное обозначение головы, находящейся посередине.
- source_word: maius aliorum capitum
  choice: была больше остальных
  rationale: Естественно передаёт сравнительную конструкцию в контексте уже названных голов.
- source_word: cum eis
  choice: вместе с ними
  rationale: Передаёт совместность состояния средней головы с другими головами.
