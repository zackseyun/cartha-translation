id: 2ES.11.29
reference: 2 Esdras 11:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod erat medium, euigilabat, hoc enim erat duorum capitum maius. Et uidi quomodo conplexa est duo capita secum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/029.yaml
  text: the one that was in the middle awoke[a], for it was larger than the two heads. And I saw how it drew the two heads to itself,
translation:
  language: ru
  text: Средняя же голова пробудилась[a], потому что она была больше двух других голов. И я увидел, как она притянула к себе эти две головы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробуждалась».'
    reason: Латинский имперфект euigilabat может описывать как начавшееся в повествовании событие, так и разворачивающийся процесс.
lexical_decisions:
- source_word: quod erat medium
  choice: средняя же голова
  rationale: Средний род относительного местоимения указывает на подразумеваемое caput («голова»); по-русски естественно восстановить существительное. Частица «же» плавно выделяет эту голову среди трёх.
- source_word: euigilabat
  choice: пробудилась
  rationale: Передаёт начало действия в данном повествовательном контексте; латинский имперфект допускает также значение продолжающегося действия «пробуждалась».
- source_word: maius
  choice: больше
  rationale: В описании голов сравнительная степень magnus естественнее всего обозначает физический размер, хотя слово может также значить «величественнее» или «могущественнее».
- source_word: conplexa est ... secum
  choice: притянула к себе
  rationale: Сохраняет направленность secum и допускаемый complector смысл охватывания или присоединения, не уточняя способ действия сверх текста.
- source_word: duo capita
  choice: эти две головы
  rationale: Указательное «эти» в русском ясно соотносит выражение с двумя другими уже упомянутыми головами.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Повтор слова «голова» сохранён ради ясности образа; двусмысленность conplexa est передана без узкого толкования как убийства, союза или поглощения.
