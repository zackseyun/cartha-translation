  source_fidelity: 'Текст точно передаёт все элементы латинского оригинала: средняя голова пробуждается, она больше двух остальных голов, затем говорится, что она привлекает/стягивает к себе две головы. «Притянула к себе» является допустимой передачей conplexa est ... secum в свете не вполне узкой семантики complector и согласуется с английской аудиторской формулировкой “drew ... to itself”.'
