  text: Then I saw, and behold, something like a lion roused from the forest.
translation:
  language: ru
  text: 'И увидел я: вот, словно лев, поднявшийся из леса.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'И увидел я: вот'
  rationale: Передаёт последовательность видения и сохраняет библейское «вот», вводящее внезапно представший взору образ.
- source_word: sicut leo
  choice: словно лев
  rationale: Сохраняет сравнительный характер латинского sicut, не превращая видение в прямое отождествление.
- source_word: suscitatus
  choice: поднявшийся
  rationale: Естественно передаёт образ льва, который поднялся или восстал, не уточняя без необходимости, что он был разбужен или кем-либо поднят.
- source_word: de silua
  choice: из леса
  rationale: Прямой и естественный эквивалент латинского выражения.
theological_decisions:
- issue: Характер образа льва
  choice: Сохранено сравнение «словно лев»
  alternative: «лев» или «нечто, похожее на льва»
  rationale: Латинское sicut обозначает подобие; перевод не должен заранее решать, является ли увиденное существом, символом или явлением в облике льва.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Инверсия «увидел я» сохраняет ритм повествования, оставаясь понятной современному читателю.
