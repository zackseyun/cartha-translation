  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: ru
  text: 'которые не причинили тебе зла. И дерзость твоя вознеслась к Всевышнему, и гордыня твоя — к Могучему. И Всевышний взглянул на Свои времена, и вот: они окончились, и века его завершились.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское sua («Свои») обычно относится к подлежащему «Всевышний». В следующем выражении стоит не возвратное eius («его»); его референт в контексте понимают по-разному — как Всевышнего или как осуждаемую власть, образно представленную орлом.
    reason: Передаёт грамматическое различие латинских местоимений и сохраняет спорность отсылки eius, не добавляя в основной текст толковательного значения «отмеренные ей».
lexical_decisions:
- source_word: qui te non nocuerunt
  choice: которые не причинили тебе зла
  rationale: Передаёт относительное придаточное как продолжение предыдущего стиха; nocere означает причинять вред или зло.
- source_word: contumelia tua
  choice: дерзость твоя
  rationale: В контексте обвинения обозначает вызывающее, оскорбительное высокомерие; «дерзость» сохраняет и нравственную, и конфликтную окраску.
- source_word: ad altissimum
  choice: к Всевышнему
  rationale: Традиционный и понятный русский эквивалент божественного титула Altissimus.
- source_word: superbia tua
  choice: гордыня твоя
  rationale: Передаёт порочную, превозносящуюся гордость, а не нейтральное чувство достоинства.
- source_word: ad fortem
  choice: к Могучему
  rationale: Сохраняет отдельный божественный титул Fortis и параллелизм с «Всевышним».
- source_word: super sua tempora
  choice: на назначенные ей времена
  rationale: Sua грамматически допускает неоднозначность, однако ближайший смысловой субъект суда — держава, представленная орлом; «назначенные» естественно выражает времена, отмеренные ей Богом.
- source_word: saecula eius
  choice: века её
  rationale: Eius естественно относится к осуждаемой державе; saecula передано как длительные периоды её существования и господства.
theological_decisions:
- issue: Референт притяжательных местоимений sua и eius
  choice: 'Осуждаемая держава/орёл: «ей», «её»'
  alternative: 'Всевышний: «Свои времена», «Его века»'
  rationale: Латинские формы допускают формальную двусмысленность, но сообщение о том, что времена окончились, в контексте суда наиболее связно относится к власти орла. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Начальная строчная буква сохранена, поскольку стих начинается продолжением предыдущего предложения. Тире помогает естественно передать эллипсис во второй части параллелизма и вводит итоговое «и вот».
