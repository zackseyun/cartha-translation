  yaml_path: translation/extra_canonical/2_esdras/011/040.yaml
  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: ru
  text: И четвёртый, придя, одолел всех зверей, которые были прежде[a], и своей мощью держал век в великом трепете, а весь мир — в жесточайшем угнетении[b], и долгое время обитал во всём мире, действуя обманом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский текст этого стиха местами повреждён и труден для понимания. Перевод передаёт наиболее вероятный смысл: четвёртый зверь превзошёл прежних и держал век и весь мир в страхе, угнетении и обмане.'
    reason: textual_variant
  - marker: b
    text: 'Или: «и своей мощью держал век, внушая великий трепет, а весь мир — подвергая жесточайшему угнетению».'
    reason: previous_rendering
lexical_decisions:
- source_word: quartus
  choice: четвёртый
  rationale: 'Сохранено субстантивированное порядковое числительное: из контекста ясно, что речь идёт о четвёртом звере.'
- source_word: devicit
  choice: одолел
  rationale: Передаёт решительную победу или превосходство над всеми предшествующими зверями без лишнего уточнения способа.
- source_word: animalia
  choice: зверей
  rationale: В контексте видения естественное русское обозначение символических животных; «животных» звучало бы слишком нейтрально.
- source_word: potentatu
  choice: своей мощью
  rationale: Явно передаёт инструментальное значение аблатива и не опускает присутствующую в латинском тексте идею силы или владычества.
- source_word: saeculum
  choice: век
  rationale: Сохраняет возможное временно-мировое значение латинского слова и согласуется с неоднозначностью источника; перевод «мир» устранил бы различие с последующим omnem orbem.
- source_word: cum tremore multo
  choice: в великом трепете
  rationale: Сохраняет образ охватившего подвластную эпоху или мир сильного страха.
- source_word: cum labore pessimo
  choice: в жесточайшем угнетении
  rationale: В данном контексте labor обозначает тяжкое бедствие и тяготу под властью зверя; «угнетение» естественно передаёт политико-насильственный оттенок.
theological_decisions:
- issue: Отождествление четвёртого зверя или его державы
  choice: Не уточнять историческую или конфессиональную идентификацию
  alternative: Назвать конкретную империю или власть
  rationale: Сам стих говорит символическим языком и не называет исторического референта; перевод не должен вносить частное толкование.
- issue: Значение saeculum
  choice: Сохранить «век»
  alternative: Передать как «мир» или «род человеческий»
  rationale: Латинское слово допускает несколько оттенков; «век» сохраняет напряжение между временным и мировым значением и не дублирует omnem orbem.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Синтаксический параллелизм латинского текста сохранён; шероховатости повреждённого окончания не перенесены в основной текст, а отмечены в сноске.
