    rationale: При повреждённом окончании необходимо сохранять осторожность, но tot указывает на «весь мир»; кроме того, «обитал в мире» по-русски может восприниматься как «жил в согласии/мире». «Обитал во всём мире» точнее передаёт предполагаемый объём и яснее в контексте.
