revisions:
- from: И четвёртый, придя, одолел всех зверей, которые были прежде[a], и своей мощью держал век в великом трепете, а весь мир — в жесточайшем угнетении[b], и так долго обитал в мире, прибегая к обману.
  to: И четвёртый, придя, одолел всех зверей, которые были прежде[a], и своей мощью держал век в великом трепете, а весь мир — в жесточайшем угнетении[b], и долгое время обитал во всём мире, действуя обманом.
  rationale: 'Сделано лишь безопасное уточнение заключительной, текстуально повреждённой фразы: «во всём мире» отражает сохранившееся tot и контекст английского audit trail, а «действуя обманом» естественно передаёт сопутствующий обман без догматического или исторического истолкования. Сноска b переработана, чтобы показать реальную синтаксическую альтернативу.'
