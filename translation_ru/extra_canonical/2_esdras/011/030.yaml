  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et ecce
  choice: И вот
  rationale: Передаёт повествовательное продолжение и привлекающее внимание ecce естественным современным русским оборотом.
- source_word: conuersum est caput
  choice: голова повернулась
  rationale: Сохраняет образ и грамматическую конструкцию латинского текста; средне-страдательная форма conversa est в данном контексте естественно передаётся непереходным глаголом.
- source_word: cum his qui cum eo erant
  choice: вместе с теми, кто был с ней
  rationale: Первое cum выражает совместность; местоимение eo соотнесено с caput, которое по-русски женского рода, поэтому употреблено «с ней».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением образности исходного текста. Конечное «и» в латинском источнике оставляет фразу незавершённой, поэтому это отражено многоточием.
