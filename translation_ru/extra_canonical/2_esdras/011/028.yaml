  text: those that remained were planning among themselves to reign as well; and while they were planning this[a], behold, one of the resting heads,
translation:
  language: ru
  text: Оставшиеся замышляли между собой, чтобы и самим царствовать. И пока они об этом думали, вот одна из покоившихся голов…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauerunt
  choice: оставшиеся
  rationale: Передаёт тех, кто остался после описанных ранее событий; форма по смыслу связана с подразумеваемыми участниками предыдущего контекста.
- source_word: apud semetipsas cogitabant
  choice: замышляли между собой
  rationale: Сохраняет значение совместного внутреннего замысла и естественно звучит по-русски.
- source_word: et ipsae regnare
  choice: тоже воцариться
  rationale: «Тоже» передаёт et ipsae, а «воцариться» — стремление самим начать царствовать.
- source_word: in eo cum cogitarent
  choice: пока они об этом думали
  rationale: Местоимение «об этом» естественно отсылает к только что названному замыслу, не добавляя нового содержания.
- source_word: ecce
  choice: вот
  rationale: Сохраняет внезапный указательный оттенок латинского слова.
- source_word: unum de quiescentium capitum
  choice: одна из покоившихся голов
  rationale: Буквально и ясно передаёт одну голову из числа находившихся в покое; продолжение мысли относится к следующему стиху.
