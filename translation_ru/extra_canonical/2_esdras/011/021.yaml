lexical_decisions:
- source_word: statim non conparescebant
  choice: они тотчас исчезали
  rationale: Буквально оборот означает, что они сразу переставали быть видимыми; «исчезали» естественно и точно передаёт это в данном повествовательном контексте.
- source_word: Nam et
  choice: Ведь … тоже
  rationale: «Ведь» сохраняет пояснительную силу nam, а «тоже» — добавочное значение et.
- source_word: aliquae ex eis erigebantur
  choice: некоторые из них тоже поднимались
  rationale: Форма женского рода aliquae соотносится с упомянутыми ранее крыльями; неполное прошедшее время erigebantur передано несовершенным видом «поднимались».
