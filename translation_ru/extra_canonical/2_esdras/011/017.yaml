  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: ru
  text: '«Я возвещаю тебе это прежде, чем ты начнёшь исчезать: после тебя никто не будет править столько же времени — даже половины этого срока».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный латинский отрывок обрывается после слов «после тебя никто». Окончание стиха переведено по засвидетельствованному в консультационном тексте смыслу: никто из преемников не будет править столь же долго, даже половину этого срока.'
    reason: Прозрачно отмечает, что заключительная часть русского текста не содержится в приведённом пользователем латинском фрагменте.
lexical_decisions:
- source_word: hoc annuntio
  choice: «Я возвещаю тебе это»
  rationale: Передаёт торжественное объявление; адресат выражен русским местоимением по смыслу латинского контекста.
- source_word: antequam incipias non parere
  choice: «прежде, чем ты начнёшь исчезать»
  rationale: Латинское non parere буквально означает «не являться, не быть видимым»; «начнёшь исчезать» естественно передаёт постепенное прекращение присутствия, не уточняя его причину.
- source_word: Nemo post te
  choice: «после тебя никто»
  rationale: Сохранены последовательность преемников и категоричность nemo.
- source_word: hold it for as long
  choice: «не будет править столько же времени»
  rationale: По контексту речь идёт о длительности власти преемников; русский оборот естественнее буквального «удерживать твоё время».
- source_word: not even half as long
  choice: «даже половины этого срока»
  rationale: Сохраняет усиление и сравнение длительности, выражая его естественным современным русским языком.
