  source_fidelity: «hoc annuntio» точно передано как «Я возвещаю тебе это», а «antequam incipias non parere» — естественным для русского «прежде, чем ты начнёшь исчезать». Формулировка сохраняет образ постепенного прекращения явления/присутствия, не навязывая конкретной причины. «Nemo post te» правильно передано как «после тебя никто». Последующее сравнение срока согласуется с предоставленным английским аудиторским текстом; сноска корректно оговаривает, что оно отсутствует в данном обрывке латинского текста.
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет возвышенный пророческий регистр. Оборот «не будет править столько же времени — даже половины этого срока» ясен и идиоматичен; эллипсис после «даже» нормативен в таком сравнительном построении.
  terminology: «Возвещаю» уместно для торжественного объявления. «Править» корректно эксплицирует контекст власти, отражённый в английском audit trail, без богословской или конфессиональной интерпретации. Имена и специальные богословские термины в стихе отсутствуют.
