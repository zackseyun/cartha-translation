  yaml_path: translation/extra_canonical/2_esdras/011/012.yaml
  text: And I looked, and behold, on the right side one wing rose up and reigned over all the earth.
translation:
  language: ru
  text: 'И увидел я: вот, с правой стороны поднялось одно крыло и воцарилось над всей землёй.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'И увидел я: вот'
  rationale: Сохраняет последовательность видения и указательное ecce, передавая её естественным современным русским синтаксисом.
- source_word: a dextera parte
  choice: с правой стороны
  rationale: Прямо передаёт пространственное значение латинского оборота, не уточняя, чья именно это правая сторона.
- source_word: surrexit una penna
  choice: поднялось одно крыло
  rationale: «Поднялось» естественно описывает появление крыла и сохраняет образ; «одно» передаёт una.
- source_word: regnauit super omnem terram
  choice: воцарилось над всей землёй
  rationale: «Воцарилось» передаёт начало царствования, выраженное контекстом surrexit ... et regnauit, а «над всей землёй» сохраняет универсальный охват.
theological_decisions:
- issue: Символическое значение крыла
  choice: Сохранён образ «крыло» без истолкования
  alternative: Передать символ как царя или правителя
  rationale: Латинский текст называет крыло и не раскрывает его значение в самом стихе; перевод не должен преждевременно устранять символическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Инверсия «увидел я» сохраняет характер повествования о видении; двоеточие делает формулу с «вот» естественной.
