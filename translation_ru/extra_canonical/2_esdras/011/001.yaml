  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: ru
  text: 'И было во вторую ночь: я увидел сон, и вот — из моря поднимался орёл, у которого было двенадцать оперённых крыльев и три головы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: И вот
  rationale: Естественная для современного русского повествовательная формула, передающая наступление нового события без тяжеловесного буквализма «И случилось».
- source_word: secunda nocte
  choice: во вторую ночь
  rationale: Прямо сохраняет временное указание латинского текста.
- source_word: uidi somnium
  choice: я увидел сон
  rationale: Формально передаёт глагол видения и апокалиптический характер сна; вариант «мне приснился сон» был бы естественнее, но ослабил бы мотив видения.
- source_word: ecce
  choice: —
  rationale: Его указательно-эмфатическая функция передана конструкцией «И вот» в начале фразы и двоеточием перед описанием видения, что позволяет избежать неестественного повторения «и вот».
- source_word: ascendebat de mari
  choice: из моря поднимался
  rationale: Сохраняет исходную точку и длительный, разворачивающийся характер латинского imperfectum.
- source_word: aquila
  choice: орёл
  rationale: Прямое и общеупотребительное соответствие.
- source_word: duodecim alae pennarum
  choice: двенадцать оперённых крыльев
  rationale: Передаёт необычное выражение alae pennarum и наличие перьев, не сглаживая образ до простого «двенадцать крыльев».
- source_word: capita tria
  choice: три головы
  rationale: Прямое соответствие с естественным русским порядком слов.
