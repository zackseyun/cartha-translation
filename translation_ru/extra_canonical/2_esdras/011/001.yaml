  source_fidelity: 'Начальная формула «И вот» удачно передаёт ecce, но не передаёт отдельно Et factum est («и было/случилось»). В латинском тексте присутствуют обе повествовательные формулы; их следует сохранить раздельно. Остальные элементы образа переданы точно: вторая ночь, видение сна, выход орла из моря, двенадцать оперённых крыльев и три головы.'
  naturalness: Предлагаемая правка сохраняет современный литературный строй, хотя «И было» намеренно оставляет сдержанную библейскую повествовательную окраску, уместную в апокалиптическом контексте. Тире после «и вот» естественно вводит зрительный образ.
  terminology: «Орёл», «оперённые крылья» и «головы» соответствуют латинским aquila, alae pennarum и capita. Специальных богословских терминов и примечаний в стихе нет.
