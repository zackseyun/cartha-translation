  source_fidelity: Русский текст точно передаёт очищенный латинский текст и соответствует английскому контрольному переводу. «Остались две головы» естественно воспроизводит контекстуально восстановленное начало auerunt, а «которые также царствовали» передаёт quae et ipsa regnauerunt без утраты акцента на этих двух головах. Формула «И увидел я — и вот:» включает существенное заключительное Et uidi et ecce и сохраняет её переходный, незавершённый характер.
  naturalness: Формулировка современна и литературна. «Головы» уместно сохраняет образ апокалиптического видения; инверсия «увидел я» и двоеточие после «вот» звучат возвышенно, но не архаично и хорошо связывают стих со следующим.
  terminology: Термины «головы», «царствовали», «земля» и «живущие на ней» последовательны, нейтральны и не вносят конфессионального истолкования. Повтор «над» корректно отражает повтор super в источнике.
