  text: But two heads remained, and they too reigned over the earth and over those who dwell in it. And I saw, and behold,
translation:
  language: ru
  text: 'Но остались две головы, которые также царствовали над землёй и над живущими на ней. И увидел я — и вот:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auerunt
  choice: остались
  rationale: По контексту и принятому восстановлению чтения передаёт сохранение двух голов после исчезновения остальных.
- source_word: duo capita
  choice: две головы
  rationale: Прямое сохранение образа видения; латинское среднего рода по-русски требует женского рода.
- source_word: regnauerunt
  choice: царствовали
  rationale: Точно передаёт политико-царственный смысл глагола regnare.
- source_word: super terram et super eos qui inhabitant in ea
  choice: над землёй и над живущими на ней
  rationale: Сохраняет повторное управление super и естественно передаёт относительную конструкцию qui inhabitant in ea.
- source_word: Et uidi et ecce
  choice: 'И увидел я — и вот:'
  rationale: Сохраняет формулу видения и её незавершённость, ведущую в следующий стих; тире и двоеточие естественно оформляют внезапное предъявление увиденного по-русски.
