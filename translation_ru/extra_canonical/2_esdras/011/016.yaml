lexical_decisions:
- source_word: emissa est illi dicens
  choice: был послан к нему голос, говоривший
  rationale: Пассивная конструкция передана прямо; слово «голос» восстановлено как подразумеваемое подлежащее женского рода, согласующееся с emissa и необходимое для естественной русской фразы.
- source_word: Audi tu
  choice: Слушай, ты
  rationale: Сохранены повелительное обращение и эмфатическое местоимение tu.
- source_word: quae ... tenuisti terram
  choice: державший землю
  rationale: Teneo здесь передаёт власть или господство над землёй; «державший» сохраняет образную широту и не усиливает его до более истолковательного «правивший».
- source_word: toto tempore
  choice: всё это время
  rationale: Передаёт значение «в течение всего времени / всё это время», не подменяя его значением tanto tempore — «так долго».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Мужской род причастия «державший» согласован с подразумеваемым в русском контексте орлом; латинское quae имеет женский род по грамматическому роду aquila и само по себе не указывает на пол существа.
