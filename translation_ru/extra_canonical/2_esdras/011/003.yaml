  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: ru
  text: 'И увидел я: из его крыльев вырастали противоположные[a] крылья, и сами они становились маленькими, невзрачными крылышками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противостоящие».'
    reason: Латинское contrariae может указывать как на противоположное расположение, так и на противостояние.
lexical_decisions:
- source_word: pennis … pennae
  choice: крыльев … крылья
  rationale: Обе формы принадлежат одному существительному penna; в описании орла последовательный перевод «крыло» естественнее, чем искусственное разграничение между «перьями» и «крыльями».
- source_word: nascebantur
  choice: вырастали
  rationale: Передаёт возникновение новых крыльев из уже существующих и по-русски естественно описывает образ видения.
- source_word: contrariae
  choice: противоположные
  rationale: Сохраняет прямое пространственное значение латинского слова, не исключая оттенка противостояния.
- source_word: fiebant in
  choice: становились
  rationale: Естественно передаёт переход к описанному далее малому и слабому виду без чрезмерного уточнения характера превращения.
- source_word: pennaculis minutis et modicis
  choice: маленькими, слабыми крылышками
  rationale: Уменьшительное pennacula передано словом «крылышки»; сочетание «маленькими, слабыми» выражает их малость и незначительность, избегая неестественной русской тавтологии «малыми и небольшими».
