  text: its end was coming[a], so that it did not appear like the former. And behold, a voice
translation:
  language: ru
  text: Его конец приближался[a], так что оно не появлялось, как прежнее. И вот, голос…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его конец приближался, так что оно исчезло, как и прежнее. И вот, голос…»'
    reason: В данном контексте латинское non appareret может пониматься не только как «не появлялось», но и по смыслу как «перестало быть видимым, исчезло».
lexical_decisions:
- source_word: ueniebat finis eius
  choice: Его конец приближался
  rationale: Передаёт латинскую конструкцию буквально и естественно, сохраняя постепенность, выраженную имперфектом ueniebat.
- source_word: ut non appareret sicut prior
  choice: так что оно не появлялось, как прежнее
  rationale: Сохраняет значение appareret («появлялось», «было видимо») и неоднозначную связь сравнительного оборота sicut prior, не заменяя её однозначным «исчезло».
- source_word: Et ecce uox
  choice: И вот, голос…
  rationale: Точно сохраняет оборванную на границе стиха фразу; продолжение из следующего стиха не добавляется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Местоимение «оно» предполагает контекстуальный референт среднего рода («крыло»). Эллипсис после «голос» обозначает незавершённость фразы в пределах данного стиха.
