  source_fidelity: 'Латинские совершенные формы tribulasti, laesisti, odisti, dilexisti, destruxisti, humiliasti лучше передавать совершенным видом в русском перечислении завершённых обвинений. Смысловые соответствия сохранены: mansuetos — «кротких», quiescentes — «мирных», uerum dicentes — «говоривших правду», fructificabant — «приносивших плод». «Низверг их стены» допустимо передаёт образ humiliasti muros eorum — приведения стен к низкому состоянию — без добавления отсутствующего в источнике пояснения.'
