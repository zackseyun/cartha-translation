  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: ru
  text: Ибо ты притеснил кротких и нанёс вред мирным; ненавидел говоривших правду и любил лжецов; разрушил жилища тех, кто приносил плод, и низверг их стены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tribulasti
  choice: притеснял
  rationale: Передаёт длительное угнетение и причинение бедствий без излишнего сужения значения.
- source_word: mansuetos
  choice: кротких
  rationale: Традиционный и понятный эквивалент, сохраняющий нравственную характеристику латинского mansueti.
- source_word: quiescentes
  choice: мирным
  rationale: В контексте противопоставляет не причинявших беспокойства людей угнетающей власти; буквальное «покоящимся» по-русски звучало бы неясно.
- source_word: uerum dicentes
  choice: говоривших правду
  rationale: Прямо передаёт смысл и согласует прошедшее время со всем рядом обвинений.
- source_word: fructificabant
  choice: приносил плод
  rationale: Сохраняет образ плодоношения и его возможный переносный смысл, не сводя его только к процветанию или добрым делам.
- source_word: humiliasti muros eorum
  choice: низверг их стены
  rationale: Humiliare применительно к стенам означает сделать их низкими, повергнуть; «унизил стены» было бы формально буквальным, но неестественным по-русски.
theological_decisions:
- issue: Смысл «тех, кто приносил плод»
  choice: Сохранён образ без пояснения вида плода
  alternative: «тех, кто процветал» или «тех, кто приносил добрый плод»
  rationale: Латинский текст не уточняет, материальное ли это процветание, нравственный плод или более общий образ плодотворности.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Однородные обвинения разделены точками с запятой. Начальное «cum ueritate» принято за завершение предшествующего предложения и в данный стих не включено, как и в структуре консультационного английского текста.
