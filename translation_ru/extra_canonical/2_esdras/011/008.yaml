- source_word: unusquisque in loco suo
  choice: каждый на своём месте
  rationale: Прямое и естественное соответствие латинскому выражению с сохранением индивидуального распределения мест.
- source_word: per tempus
  choice: некоторое время
  rationale: Передаёт временную длительность, не добавляя отсутствующей в латинском тексте идеи очередности.
