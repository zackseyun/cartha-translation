  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
translation:
  language: ru
  text: И я увидел, что всё под небом было покорено ему, и никто ему не противился — ни одно существо на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subiecti erant ei omnia sub caelo
  choice: всё под небом было покорено ему
  rationale: Передаёт всеобщность подчинения и сохраняет мужской род местоимения по отношению к орлу в контексте видения.
- source_word: nemo illi contradicebat
  choice: никто ему не противился
  rationale: В контексте всеобщего господства contradicere означает не только словесно возражать, но и оказывать противодействие; «не противился» естественно передаёт обе стороны значения.
- source_word: neque unus de creatura, quae est super terram
  choice: ни одно из созданий, живущих на земле
  rationale: 'Естественная русская формулировка, сохраняющая усиление: исключений не было даже среди земных созданий.'
theological_decisions:
- issue: Характер отсутствия сопротивления власти орла
  choice: не противился
  alternative: не возражал ему
  rationale: Выбрано более широкое значение, соответствующее непосредственному контексту покорения, без сведения фразы только к словесному возражению.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем; синтаксис сохраняет последовательность латинского свидетельства без буквалистской тяжеловесности.
