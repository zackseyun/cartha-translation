lexical_decisions:
- source_word: tenebant principatum
  choice: удерживали власти
  rationale: Передаёт значение длительного обладания или сохранения верховной власти; множественное число соответствует форме tenebant, а родительный падеж естественен после отрицания.
- source_word: Et uidi post haec
  choice: После этого я увидел
  rationale: Естественный современный порядок слов сохраняет последовательность видения; союз et передан связностью фразы без отдельного «и».
- source_word: et ecce
  choice: — и вот
  rationale: Сохраняет характерную формулу внезапного предъявления увиденного и её повествовательную выразительность.
- source_word: non
  choice: не…
  rationale: Отрицание относится к продолжению следующего стиха; многоточие ясно показывает синтаксическую незавершённость данного фрагмента и не восполняет отсутствующих здесь слов.
