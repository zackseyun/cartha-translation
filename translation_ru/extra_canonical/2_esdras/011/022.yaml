  source_fidelity: Лат. sed non tenebant principatum означает «но [они] не обладали/не удерживали верховной властью». В черновике общий смысл передан, однако «власти» без определения несколько ослабляет principatum. Начальное Et и конечное незавершённое non следует сохранить; «не…» корректно отражает межстиховой перенос.
  naturalness: «Но не удерживали власти» понятно, но в современном литературном русском звучит несколько неполно и менее точно, чем «не обладали верховной властью». «И после этого я увидел — и вот, не…» естественно для намеренно оборванного видения.
  terminology: principatum передано как «верховная власть», что сохраняет значение правления/владычества, не навязывая конкретной политической или богословской интерпретации.
