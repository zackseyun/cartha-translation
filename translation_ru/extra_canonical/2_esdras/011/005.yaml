  yaml_path: translation/extra_canonical/2_esdras/011/005.yaml
  text: And I looked, and behold, the eagle flew on its wings to reign over the earth and over those who dwell in it.
translation:
  language: ru
  text: И увидел я — и вот, орёл полетел на своих крыльях, чтобы царствовать над землёй и над живущими на ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'И увидел я: вот'
  rationale: Сохраняет повествовательную формулу видения и указательное ecce; двоеточие естественно передаёт переход к увиденному в современном русском.
- source_word: aquila
  choice: орёл
  rationale: Прямое соответствие латинскому существительному; мужской род соответствует нормативному русскому употреблению.
- source_word: uolauit in pennis suis
  choice: полетел на своих крыльях
  rationale: Близко передаёт латинскую конструкцию, не устраняя образ крыльев как явно названное средство полёта.
- source_word: ut regnaret
  choice: чтобы царствовать
  rationale: Передаёт целевое значение ut с сослагательным наклонением и сохраняет царственную, а не просто политическую семантику regnare.
- source_word: super terram et super eos qui habitant in ea
  choice: над землёй и над живущими на ней
  rationale: Сохраняет повторяющееся отношение власти «над» и естественно передаёт причастным оборотом латинское qui habitant.
theological_decisions:
- issue: Характер власти орла в выражении regnaret
  choice: царствовать
  alternative: править
  rationale: «Царствовать» точнее сохраняет лексический образ regnare и не конкретизирует природу символической власти сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования; синтаксис слегка приподнят, но понятен обычному читателю. Подлинная целевая направленность полёта сохранена конструкцией «чтобы царствовать».
