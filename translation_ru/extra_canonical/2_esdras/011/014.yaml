  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ipsa
  choice: она
  rationale: Женское местоимение сохраняет грамматическую отсылку латинского текста к орлиной голове, упомянутой в контексте.
- source_word: multum ... tempus
  choice: долго
  rationale: Естественно и точно передаёт значение продолжительного времени без избыточно буквального оборота «много времени».
- source_word: tenuit
  choice: удерживала власть
  rationale: В данном контексте правления глагол tenere означает длительное обладание властью; такой перевод яснее буквального «держала».
- source_word: Et factum est
  choice: И вот
  rationale: Передаёт повествовательную формулу естественным современным русским языком.
- source_word: cum regnaret
  choice: когда она царствовала
  rationale: Сохраняет значение длительного действия в придаточном предложении и незавершённость фразы.
