  register: Современный литературный русский язык; тон повествовательный и достойный. Незавершённость предложения сохранена в соответствии с латинским источником. Несмотря на замечание о возможной ошибке границы стиха, переведён весь предоставленный латинский текст; примечание не добавлено, поскольку редакционная история противоречива, а текущий источник явно содержит первую фразу.
