  text: 'а вторая так и не появилась, исчезнув быстрее первой. И увидел я: вот, две, которые'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non conparuit
  choice: так и не появилась
  rationale: Передаёт отрицание появления в данном повествовательном контексте естественным современным русским языком, не смешивая его со следующим сравнением.
- source_word: uelocius quam prior
  choice: быстрее первой
  rationale: Сохраняет сравнительную конструкцию и отсылку к предыдущей голове.
- source_word: Et uidi et ecce
  choice: 'И увидел я: вот'
  rationale: Сохраняет формулу видения и латинское ecce, используя естественную для русского библейского повествования пунктуацию.
- source_word: duae quae
  choice: две, которые
  rationale: Сохраняет женский род и намеренно незавершённую относительную конструкцию на границе предоставленного фрагмента.
