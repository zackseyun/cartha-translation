  text: pennacula. Et uidi et ecce de sex pennaculis diuisa sunt duo et manserunt sub capite, quod est ad dexteram partem; nam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/024.yaml
  text: And I looked, and behold, two of the six little pinions were separated and remained under the head that was on the right side; for
translation:
  language: ru
  text: 'И увидел я: вот, два из шести малых крыльев отделились и остались под головой, которая была с правой стороны, ибо…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennacula / pennaculis
  choice: малые крылья / малых крыльев
  rationale: Уменьшительная форма от penna обозначает небольшие крылья или крылышки; «малые крылья» звучит достойно и сохраняет отличие от больших крыльев в образе.
- source_word: diuisa sunt duo
  choice: два ... отделились
  rationale: Передаёт выделение двух из шести без уточнения действующего лица; возвратная конструкция естественна по-русски.
- source_word: sub capite
  choice: под головой
  rationale: Прямое пространственное соответствие латинскому выражению.
- source_word: ad dexteram partem
  choice: с правой стороны
  rationale: Естественная русская передача положения головы справа.
- source_word: nam
  choice: ибо
  rationale: Сохраняет причинно-пояснительную связь и намеренную незавершённость стиха.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским ритмом. Формула «И увидел я: вот» сохраняет визионный характер текста. Конечное «ибо…» оставлено незавершённым, поскольку латинский стих обрывается на nam и продолжается далее.'
