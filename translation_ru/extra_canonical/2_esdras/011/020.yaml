revisions:
- from: 'И увидел я: вот, в должное время следующие крылья тоже поднялись с правой стороны, чтобы принять власть[a]. Некоторые из них властвовали, но…'
  to: 'И увидел я: вот, в должное время следующие крылья тоже поднялись на правой стороне, чтобы править[a]; среди них были такие, которые правили, но…'
  rationale: Исправлены пространственная двусмысленность и добавленная в «принять власть» идея получения власти. Сохранены добавочный оттенок et ipsae, последовательность sequentes, возможная процессуальность erigebantur в сноске и синтаксический обрыв в конце стиха.
