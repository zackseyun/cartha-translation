  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: ru
  text: 'И увидел я: вот, в должное время следующие крылья тоже поднялись на правой стороне, чтобы править[a]; среди них были такие, которые правили, но…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «следующие крылья тоже поднимались на правой стороне, чтобы править».'
    reason: Латинский имперфект erigebantur может передавать процесс подъёма; основной вариант воспроизводит повествовательное развитие видения.
lexical_decisions:
- source_word: in tempore
  choice: в должное время
  rationale: Передаёт временное значение выражения как наступление определённого, надлежащего момента.
- source_word: sequentes pennae
  choice: следующие крылья
  rationale: Сохраняет последовательность появления крыльев без уточнения, которого нет в латинском тексте.
- source_word: et ipsae
  choice: тоже
  rationale: 'Передаёт добавочно-сопоставительный оттенок: эти крылья, как и предыдущие, поднялись.'
- source_word: erigebantur
  choice: поднялись
  rationale: В данном повествовательном контексте естественно обозначает произошедшее восстание крыльев; аспектуальная протяжённость латинского имперфекта может быть передана альтернативой в сноске.
- source_word: tenerent principatum
  choice: принять власть
  rationale: Естественно передаёт цель поднявшихся крыльев — обрести и осуществлять правление.
- source_word: ex his erant quae tenebant
  choice: некоторые из них властвовали
  rationale: Сохраняет смысл фактического обладания властью и избегает тяжёлого буквального повтора глагола «держать».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптического повествования. Начальное «И увидел я: вот» сохраняет библейскую формулу видения. Незавершённое «но…» отражает обрыв синтаксической конструкции на границе стиха.'
