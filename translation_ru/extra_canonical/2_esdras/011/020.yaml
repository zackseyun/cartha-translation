review_pass:
  verdict: revise
  source_fidelity: Латинское et ipsae передано верно добавочным «тоже», sequentes pennae — «следующие крылья», а незавершённое sed корректно сохранено. Однако a dextera parte точнее означает расположение «на правой стороне», а не направление «с правой стороны». Формула tenerent principatum говорит о цели правления/удержания верховной власти, не о её принятии или получении.
  naturalness: «На правой стороне» естественно и однозначно в описании частей орла. «Чтобы править» и «среди них были такие, которые правили» — современная литературная передача без неестественного повтора абстрактного слова «власть».
  terminology: «Править» точно передаёт principatum в данном образном апокалиптическом контексте. Имена и специальные богословские термины в стихе отсутствуют. Сноска сохраняет аспектуальную возможность латинского имперфекта erigebantur.
  issues:
  - severity: medium
    issue: «с правой стороны» может обозначать движение или происхождение с правой стороны.
    rationale: a dextera parte относится к месту, где поднимались крылья; «на правой стороне» устраняет пространственную двусмысленность.
  - severity: medium
    issue: «чтобы принять власть» добавляет идею вступления во власть.
    rationale: tenerent principatum означает «чтобы править/удерживать верховную власть», а не обязательно её получить.
