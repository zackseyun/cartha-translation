  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: ru
  text: 'И Он сказал мне: «Суд Мой Я уподоблю венцу[a]: как для последних нет промедления, так и для первых нет поспешности». И я ответил и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «венец» можно также понять как «круг» или «кольцо»; тогда сравнение подчёркивает симметрию между первыми и последними.
    reason: lexical_alternative
lexical_decisions:
- source_word: coronae
  choice: венцу
  rationale: Основное значение латинского corona — «венец»; оно сохраняет образ исходного текста и допускает заложенный в нём круговой смысл.
- source_word: adsimilabo
  choice: уподоблю
  rationale: Формально и естественно передаёт значение «сделаю подобным, сравню по подобию».
- source_word: iudicium meum
  choice: Суд Мой
  rationale: Прямое соответствие латинскому выражению с сохранением богословски значимого понятия суда.
- source_word: nouissimorum tarditas
  choice: для последних нет промедления
  rationale: Передаёт смысл отсутствия задержки для тех, кто идёт последним, без излишнего буквального абстрактного оборота.
- source_word: priorum uelocitas
  choice: для первых нет поспешности
  rationale: Сохраняет симметричное противопоставление последних и первых, а также задержки и поспешности.
theological_decisions:
- issue: Смысл образа corona
  choice: В основном тексте сохранён «венец», а круговой смысл отмечен в сноске.
  alternative: Перевести corona как «круг» или «кольцо».
  rationale: «Венец» — прямое значение слова, однако форма венца может подчёркивать симметрию первых и последних; перевод не должен устранять эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельная конструкция «как… так и…» сохраняет риторическую симметрию латинского текста; заглавные местоименные формы указывают на речь Бога, не добавляя конфессионального толкования.
