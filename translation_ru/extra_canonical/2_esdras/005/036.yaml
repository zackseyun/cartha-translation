translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Конечный союз «и» сохранён, поскольку данный фрагмент стиха синтаксически продолжается в следующем сегменте. Начальные слова латинского свидетельства относятся к предшествующему контексту и вслед за установленной границей в консультационном тексте в этот стих не включены.
