lexical_decisions:
- source_word: numera mihi
  choice: Сосчитай для меня
  rationale: Прямо передаёт повелительное numera и сохраняет повторяющееся mihi («для меня»).
- source_word: qui necdum uenerunt
  choice: тех, кто ещё не пришёл
  rationale: Сохраняет неопределённость относительно того, кто именно подразумевается, и буквально передаёт временное значение necdum.
- source_word: collige mihi dispersas guttas
  choice: собери для меня рассеянные капли
  rationale: Передаёт образ исходного текста без истолкования; «рассеянные» естественно выражает dispersas в данном образном контексте.
