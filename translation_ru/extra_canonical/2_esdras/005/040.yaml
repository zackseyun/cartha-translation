  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
translation:
  language: ru
  text: '«Ты спрашивал меня?»[a] И он сказал мне: «Как ты не можешь сделать ни одной из тех вещей, о которых было сказано, так не сможешь постичь суд».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальные слова буквально: «Ты спрашивал меня?» По форме они могут быть тесно связаны с предшествующим контекстом.'
    reason: textual_context
  - marker: b
    text: 'Буквально: «найти суд»; возможно также: «узнать суд» или «выяснить решение».'
    reason: translation_alternative
lexical_decisions:
- source_word: me interrogasti?
  choice: «Ты спрашивал меня?»
  rationale: Передаёт латинскую вопросительную фразу без попытки перестроить её по предполагаемому контексту.
- source_word: unum de his quae dicta sunt
  choice: «ни одного из этих дел, о которых было сказано»
  rationale: Сохраняет значение unum de his («одного из этих») и отсылку к ранее названным невозможным действиям; «дел» естественнее русского буквального «вещей».
- source_word: inuenire iudicium
  choice: «постичь … суд»
  rationale: Inuenire здесь означает не физически «найти», а выяснить или постичь; iudicium сохранено как «суд», без сужения до «решения» или «приговора».
theological_decisions:
- issue: Что означает iudicium
  choice: «суд»
  alternative: «решение» / «приговор» / «замысел суда»
  rationale: Латинское слово допускает несколько оттенков. Общее «суд» сохраняет богословскую и смысловую широту исходного текста.
- issue: Отсутствующий в данном латинском тексте мотив «цели любви»
  choice: Не включать его в основной текст
  alternative: Добавить «цель любви, обещанной народу»
  rationale: Предоставленный латинский источник заканчивается словами inuenire iudicium и не содержит соответствующего оборота; добавление исказило бы данный источник.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Необычность начального вопроса и широта слова «суд» сохранены, а не устранены толкованием.
