  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: ru
  text: 'И Он сказал мне: «Так и Я дал чрево земли тем, кто был посеян на ней в своё время».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uterum terrae (восстанавливается по непосредственному контексту перед данным фрагментом)
  choice: чрево земли
  rationale: Сохраняет телесно-земледельческий образ исходного текста и связь земли с теми, кто на ней «посеян».
- source_word: dedi
  choice: отдал
  rationale: Передаёт значение «дал, предоставил» естественным русским глаголом, не добавляя идеи сотворения или назначения.
- source_word: seminati sunt
  choice: был посеян
  rationale: Сохраняет пассивную форму и метафору посева применительно к живущим на земле.
- source_word: super eam
  choice: на ней
  rationale: Местоимение относится к земле; буквальное пространственное значение сохранено.
- source_word: per tempus
  choice: в своё время
  rationale: Естественно передаёт временную соотнесённость латинского выражения, не уточняя сверх текста, идёт ли речь о сроке жизни, эпохе или назначенном времени.
theological_decisions:
- issue: Образ земли как чрева
  choice: Сохранён буквально как «чрево земли»
  alternative: «лоно земли»
  rationale: «Чрево» яснее поддерживает образ рождения и телесную метафору, тогда как «лоно» могло бы звучать более сглаженно и менее конкретно.
- issue: Неявный деятель при «были посеяны»
  choice: Деятель не назван
  alternative: «кого Я посеял»
  rationale: Латинский пассив не указывает деятеля прямо; перевод не превращает возможный богословский смысл в явное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Метафоры «чрево земли» и «посеян» сохранены без поясняющего истолкования; прописная «Я» отражает речь Бога.
