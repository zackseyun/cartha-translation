  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
translation:
  language: ru
  text: 'И я сказал[a]: «Владыка Господь! Из каждого леса на земле и из всех её деревьев Ты избрал одну виноградную лозу,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых прежних изданиях здесь помещался текст следующего стиха: «И из всех земель мира Ты избрал Себе одну долину, и из всех цветов мира Ты избрал Себе одну лилию».'
    reason: Отмечает прежнее чтение, возникшее из-за смещения нумерации или границы стихов, не подменяя им засвидетельствованный латинский текст 5:23.
lexical_decisions:
- source_word: Dominator Domine
  choice: Владыка Господь
  rationale: Передаёт двойное обращение с оттенком верховной власти, сохраняя торжественность латинского текста.
- source_word: ex omni silva terrae
  choice: из всех лесов земли
  rationale: Естественная русская передача собирательного латинского выражения без сужения его смысла.
- source_word: ex omnium arborum eius
  choice: из всех деревьев в них
  rationale: Местоимение eius по смыслу относится к лесам/земле; форма «в них» ясно и естественно связывает деревья с лесами.
- source_word: vineam unam
  choice: одну виноградную лозу
  rationale: Vinea может обозначать виноградник или виноградную лозу; контраст с деревьями и консультационный английский текст поддерживают здесь «лозу».
theological_decisions:
- issue: Образ избранной лозы
  choice: Сохранён образ одной виноградной лозы без пояснения его символического значения.
  alternative: Передать как «один виноградник» или прямо отождествить образ с избранным народом.
  rationale: Источник оставляет образ неразъяснённым в пределах стиха; перевод не должен заранее разрешать метафору богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным обращением. Местоимение «Ты» написано с прописной буквы в прямом обращении к Богу; синтаксис сохранён открытым, поскольку стих продолжается далее.
