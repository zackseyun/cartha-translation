  yaml_path: translation/extra_canonical/2_esdras/005/046.yaml
  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: ru
  text: 'Скажешь ей: «Если ты рожаешь десятерых, почему не сразу? Попроси же её родить десятерых за один раз». И я сказал: «Конечно, она не сможет, но…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: Скажешь ей
  rationale: Сохранено обращение к существительному женского рода из предшествующего контекста без внесения отсутствующего здесь уточнения.
- source_word: decem si paris
  choice: Если ты рожаешь десятерых
  rationale: paris передано естественным русским глаголом «рожаешь»; decem по смыслу обозначает десятерых детей.
- source_word: quare per tempus?
  choice: почему не сразу?
  rationale: Латинская эллиптическая фраза буквально связана с распределением рождения во времени; по-русски её противопоставление последующему in unum естественно выражается как «почему не сразу?».
- source_word: det decem in unum
  choice: родить десятерых одновременно
  rationale: det в данном контексте означает «дать/произвести на свет», а in unum — совместно, за один раз; выбран ясный и естественный русский эквивалент.
- source_word: non utique poterit, sed
  choice: Конечно, она не сможет, но…
  rationale: Сохранены уверенное отрицание, будущее значение poterit и оборванность фразы на sed.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь ясная и dignified, без добавления отсутствующего в стихе слова «утроба». Конечное многоточие передаёт незавершённость сохранившейся фразы.
