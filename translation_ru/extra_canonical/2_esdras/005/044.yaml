  text: 'spondit ad me et dixit : non potest festinare creatura super creatorem, nec sustinere saeculum qui in eo creati sunt in unum. Et dixi : quomodo dixisti seruo tuo, quoniam uiuificans uiuifi-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: ru
  text: 'Он ответил мне и сказал: «Творение не может спешить быстрее Творца[a], и век не может вместить одновременно всех, кто создан в нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не может спешить впереди Творца».'
    reason: Латинское super при festinare можно передать не только явно сравнительно, но и как движение впереди или за пределами установленного Творцом хода.
lexical_decisions:
- source_word: creatura
  choice: творение
  rationale: Латинское creatura допускает как собирательное понимание сотворённого порядка, так и единичное «создание». Русское «творение» сохраняет эту широту и поддерживает противопоставление Творцу.
- source_word: festinare super
  choice: спешить быстрее
  rationale: В данном контексте super естественно имеет сравнительное значение. Формулировка передаёт невозможность творению ускорить ход событий относительно Творца, не заменяя образ истолкованием вроде «опередить».
- source_word: saeculum
  choice: век
  rationale: '«Век» сохраняет эсхатологически значимую многозначность saeculum: нынешний мировой период, а не просто физический мир или отвлечённое время.'
- source_word: sustinere
  choice: вместить
  rationale: По контексту речь о способности века принять всех сотворённых одновременно. «Вместить» звучит естественно по-русски и сохраняет смысл ограниченной вместимости.
- source_word: in unum
  choice: одновременно всех
  rationale: Передаёт объединённость всех сотворённых в один момент; порядок слов делает сферу действия выражения ясной.
theological_decisions:
- issue: Соотношение темпа творения и Творца
  choice: не может спешить быстрее Творца
  alternative: не может опередить Творца
  rationale: Основной вариант сохраняет образ спешки и сравнительное значение super, не превращая высказывание в более определённое утверждение об опережении.
- issue: Значение saeculum
  choice: век
  alternative: мир
  rationale: «Век» не устраняет напряжение между временным периодом и устроением мира и лучше соответствует языку апокалиптического контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух частей сохранён; архаизмы и конфессионально окрашенные толкования не вводятся.
