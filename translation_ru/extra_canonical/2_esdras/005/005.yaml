  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: ru
  text: И с дерева будет капать кровь, и камень подаст голос, и народы придут в смятение, и шаги изменятся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de ligno
  choice: с дерева
  rationale: Передаёт исходную точку («с/из дерева») и сохраняет образ дерева или древесины, не уточняя его без достаточных оснований.
- source_word: sanguis stillabit
  choice: будет капать кровь
  rationale: Естественно и точно передаёт будущий характер знамения и глагол stillabit — «капать, сочиться каплями».
- source_word: lapis dabit vocem suam
  choice: камень подаст голос
  rationale: Русское выражение «подать голос» естественно передаёт латинское dabit vocem suam и сохраняет олицетворение камня.
- source_word: populi commovebuntur
  choice: народы придут в смятение
  rationale: Commoveri допускает как физическое потрясение, так и внутреннее волнение; в отношении народов «придут в смятение» звучит естественно и не сводит смысл только к физическому движению.
- source_word: gressus commutabuntur
  choice: поступь их изменится
  rationale: Gressus буквально означает шаги или поступь; выбранная формулировка сохраняет образ движения и апокалиптическую неопределённость. Местоимение «их» связывает фразу с народами, как естественно требует русский синтаксис.
theological_decisions:
- issue: Неопределённость образа изменившихся gressus
  choice: поступь их изменится
  alternative: пути их изменятся / шаги изменятся
  rationale: Текст не объясняет, идёт ли речь о буквальных шагах, направлении движения или образе действий. «Поступь» удерживает телесный образ, не превращая его в явное нравственное или историческое толкование.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим ритмом. Точка с запятой сохраняет двучленное построение латинской фразы; архаизмы и конфессионально окрашенные толкования не вводятся.
