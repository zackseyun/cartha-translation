  text: But I am foolish; how then can I speak about these things concerning which
translation:
  language: ru
  text: Но я неразумен; как же смогу говорить об этих вещах, о которых…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский текст обрывается на словах «о которых»; продолжение здесь не восполняется.
    reason: Поясняет читателю грамматически незавершённую фразу и предотвращает ошибочное восприятие её как стилистической оплошности.
lexical_decisions:
- source_word: insipiens
  choice: неразумен
  rationale: Передаёт признание в недостатке понимания без более резкого современного оттенка слова «глуп».
- source_word: et quomodo potero dicere
  choice: как же смогу говорить
  rationale: «Же» естественно передаёт смысловое следствие, выраженное сочетанием et quomodo; будущее значение potero сохранено.
- source_word: de his quibus
  choice: об этих вещах, о которых
  rationale: Сохраняет соотнесённость латинских his и quibus и намеренно не восполняет отсутствующее продолжение.
theological_decisions:
- issue: Незавершённость предоставленного латинского текста
  choice: Оставить фразу открытой и обозначить обрыв многоточием
  alternative: Восполнить продолжение по контексту или иной текстовой форме
  rationale: Источник заканчивается относительным местоимением quibus; добавление предмета речи или упоминания заданных вопросов устранило бы подлинную текстовую незавершённость без основания в предоставленном тексте.
translation_notes:
  register: Современный литературный русский язык с dignified, но общедоступной формулировкой. Синтаксическая незавершённость оригинала сохранена; богословские и контекстуальные дополнения не внесены.
