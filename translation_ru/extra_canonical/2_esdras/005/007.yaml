source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem facient. Et mare Sodomiticum pisces reiciet, et dabit uocem noctu, quam non nouerunt multi, omnes autem audient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: ru
  text: И Содомское море выбросит рыб[a], а ночью издаст звук, которого многие прежде не знали[b], но услышат все.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Содомское море», вероятно, означает Мёртвое море; перевод сохраняет аллюзивное название латинского текста, не заменяя его более поздним общепринятым названием.
    reason: cultural_note
  - marker: b
    text: 'Или: «И Содомское море выбросит рыб и ночью подаст голос, которого многие прежде не знали, но услышат все».'
    reason: translation_alternative
lexical_decisions:
- source_word: mare Sodomiticum
  choice: Содомское море
  rationale: Передаёт географическое определение латинского текста и сохраняет его аллюзивное название, не подменяя его привычным названием «Мёртвое море».
- source_word: pisces reiciet
  choice: выбросит рыб
  rationale: Прямо передаёт reiciet в значении выбрасывания или извержения наружу; необычность образа сохранена.
- source_word: dabit uocem
  choice: издаст звук
  rationale: Естественная современная русская передача буквального «подаст голос»; слово vox допускает как голос, так и звук.
- source_word: quam non nouerunt multi
  choice: которого многие прежде не знали
  rationale: Перфект nouerunt передан указанием на предшествующий опыт; относительное местоимение отнесено к «звуку».
- source_word: omnes autem audient
  choice: но услышат все
  rationale: Сохраняет противопоставление autem и всеобщность omnes без добавления отсутствующего в основном латинском тексте объекта.
theological_decisions:
- issue: Обозначение моря
  choice: Содомское море
  alternative: Мёртвое море
  rationale: Сохранено название исходного текста, поскольку замена на традиционное географическое имя устранила бы его библейскую аллюзию.
- issue: Неявный объект при audient
  choice: не добавлять «его» или «его голос»
  alternative: «но все услышат его» / «но все услышат его голос»
  rationale: В приведённом латинском тексте после audient объект не выражен; русский синтаксис позволяет сохранить эту лаконичность и потенциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Сохранены необычность знамения, аллюзивное название моря и краткость заключительной фразы.
