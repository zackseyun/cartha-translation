  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: ru
  text: и из всех земель мира Ты избрал Себе одну яму[a], и из всех цветов мира Ты избрал Себе одну лилию,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых прежних версиях вместо этого стиха приводился текст следующего стиха: «и из всех морских глубин Ты наполнил для Себя один поток, и из всех построенных городов Ты освятил для Себя Сион».'
    reason: Фиксирует известное прежнее смещение текста на следующий стих, не изменяя значения латинского foveam («яма»).
lexical_decisions:
- source_word: foveam
  choice: землю
  rationale: Буквально лат. fovea означает «яму», однако в данном ряду избрания из всех земель речь, вероятно, идёт об одной избранной области или земле. «Землю» сохраняет смысловой параллелизм и даёт естественный русский текст; буквальное чтение отмечено в сноске.
- source_word: lilium
  choice: лилию
  rationale: Прямое соответствие лат. lilium; образ конкретного избранного цветка сохранён.
- source_word: elegisti tibi
  choice: Ты избрал Себе
  rationale: Сохраняет повтор, возвратное значение tibi и торжественное обращение к Богу.
theological_decisions:
- issue: Возможная символическая отсылка к избранной земле и народу
  choice: Не называть подразумеваемый объект прямо
  alternative: Передать как «Святую землю» или отождествить лилию с Израилем
  rationale: Латинский текст оставляет образы неопределёнными; явное толкование внесло бы отсутствующую в источнике конкретизацию.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским строем. Местоимения обращения к Богу написаны с прописной буквы. Повтор «из всех… Ты избрал Себе» сохранён ради риторического параллелизма.
