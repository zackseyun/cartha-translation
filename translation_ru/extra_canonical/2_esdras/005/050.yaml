  text: coram te ; nam mater nostra de qua dixisti mihi, adhuc iuuenis est, [an] iam senectuti adpropinquat ? Et respondit ad me et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: ru
  text: 'И я спросил: «Раз ты дал мне возможность, я буду говорить перед тобой. Ведь наша мать, о которой ты сказал мне, всё ещё молода или уже приближается к старости?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте слово «или» восстановлено издателем по смыслу вопроса.
    reason: В издании Bensly частица an заключена в квадратные скобки, что указывает на редакционное восстановление.
lexical_decisions:
- source_word: coram te
  choice: пред тобой
  rationale: Сохраняет прямое обращение и достоинство латинского выражения, оставаясь естественным в современном русском языке.
- source_word: nam
  choice: ведь
  rationale: Передаёт пояснительную связь вопроса с предшествующим рассуждением; русское «ведь» звучит естественнее буквального «ибо» в прямой речи.
- source_word: mater nostra
  choice: наша мать
  rationale: Буквально сохраняет образ матери, не истолковывая его референт в основном тексте.
- source_word: adhuc iuuenis est
  choice: всё ещё молода
  rationale: Точно передаёт adhuc и возрастное противопоставление следующей части вопроса.
- source_word: iam senectuti adpropinquat
  choice: уже приближается к старости
  rationale: Сохраняет аспект постепенного приближения, выраженный adpropinquat.
theological_decisions:
- issue: Референт образа «наша мать»
  choice: Оставить образ без поясняющей подстановки
  alternative: Заменить или пояснить как «мир», «век» либо иной богословский референт
  rationale: Сам стих использует метафору матери; её раскрытие здесь устранило бы сохраняемую текстом образность и могло бы навязать толкование.
- issue: Логическая сила nam
  choice: Передать словом «ведь»
  alternative: Опустить союз ради более гладкого вопроса
  rationale: В предоставленном латинском тексте nam явно присутствует и связывает вопрос с предшествующей аналогией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Конструкция упрощена до естественного «я спросил», поскольку буквальное «спросил и сказал» в современном русском избыточно; логическая частица nam сохранена как «ведь».
