    rationale: Это выражение означает указание направления, тогда как исходная формула полного стиха говорит о предоставленной возможности/разрешении говорить; образ «пути» вносит не выраженный источником смысл.
  - severity: low
    issue: «о которой ты мне говорил»
    rationale: Латинское dixisti — совершенное действие («сказал»), а несовершенный вид «говорил» может подразумевать длительный или повторный разговор.
