id: 2ES.5.8
reference: 2 Esdras 5:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uocem eius. Et chaos fiet per loca multa, et ignis frequenter emittetur et bestiae agrestes transmigrabunt regionem suam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: ru
  text: И во многих местах разверзнутся пропасти[a], и часто будет извергаться огонь, и дикие звери покинут свои края,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и во многих местах наступит хаос». Латинское слово допускает значение «хаос, бездна»; здесь, вероятно, имеются в виду разверзающиеся расселины или пропасти.'
    reason: Сохраняет лексическую неоднозначность латинского chaos и документирует более буквальное альтернативное прочтение.
lexical_decisions:
- source_word: chaos fiet per loca multa
  choice: во многих местах разверзнутся пропасти
  rationale: Латинское chaos в апокалиптическом контексте обозначает зияющую бездну или расселину, а не отвлечённый общественный беспорядок; fiet передано естественной русской конструкцией «разверзнутся».
- source_word: ignis frequenter emittetur
  choice: часто будет извергаться огонь
  rationale: Сохранён пассивно-результативный образ частого выхода или выброса огня без добавления неуказанного источника.
- source_word: bestiae agrestes
  choice: дикие звери
  rationale: Обычное и точное соответствие латинскому обозначению недомашних зверей.
- source_word: transmigrabunt regionem suam
  choice: покинут свои края
  rationale: По смыслу речь о перемещении зверей за пределы привычной области; «края» сохраняет пространственное значение regio и звучит естественно.
theological_decisions:
- issue: Физический или отвлечённый смысл chaos
  choice: Физические пропасти или расселины
  alternative: «наступит хаос»
  rationale: Контекст перечисляет апокалиптические знамения в природе; физический образ также лучше согласуется с древней версионной традицией. Неясность латинского слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим оттенком. Синтаксический параллелизм и завершающая запятая сохранены, поскольку стих продолжается.
