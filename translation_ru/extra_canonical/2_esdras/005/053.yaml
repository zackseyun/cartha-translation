  yaml_path: translation/extra_canonical/2_esdras/005/053.yaml
  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: ru
  text: 'И сама она скажет тебе[a]: «Одни рождены в расцвете молодости, а другие — с приближением старости, когда материнская утроба слабеет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинской рукописной традиции и старых изданиях граница строки могла создавать впечатление, будто вторая половина высказывания относится к следующему стиху; здесь всё высказывание передано как единое целое.
    reason: text_alignment
lexical_decisions:
- source_word: nati sunt
  choice: рождены
  rationale: Передаёт латинское совершённое состояние и сохраняет параллель между двумя группами рождённых.
- source_word: sub tempus senectutis
  choice: с приближением старости
  rationale: Предлог sub с винительным здесь указывает на приближение времени, а не просто на пребывание в определённом возрасте.
- source_word: deficiente matrice
  choice: когда материнское чрево уже слабеет
  rationale: Аблативная конструкция передана придаточным времени/обстоятельства; matrix в данном контексте означает материнскую утробу, а deficiente — ослабление её способности к деторождению.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены образ материнского чрева и параллелизм двух групп. Формулировка естественна для широкого читателя, но остаётся dignified и близкой к латинской структуре.
