  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: ru
  text: 'И я сказал ему[a]: «Уйди от меня и не приближайся ко мне, пока не пройдёт семь дней; тогда придёшь ко мне». Он послушался меня и удалился от меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я постился семь дней, скорбя и плача, как повелел мне ангел Уриил».'
    reason: previous_rendering
lexical_decisions:
- source_word: vade a me
  choice: Уйди от меня
  rationale: Естественно и точно передаёт повеление удалиться.
- source_word: non ad me accedas
  choice: не приближайся ко мне
  rationale: Сохраняет пространственный смысл латинского выражения без излишнего усиления.
- source_word: usque diebus septem
  choice: пока не пройдёт семь дней
  rationale: Передаёт временную границу, а не просто продолжительность действия.
- source_word: et audivit ut dixi
  choice: Он послушался меня
  rationale: В контексте audivit означает не только услышал, но и исполнил сказанное; русский глагол естественно выражает эту идиому.
- source_word: recessit a me
  choice: удалился
  rationale: Достоинный повествовательный эквивалент, сохраняющий значение ухода от говорящего.
