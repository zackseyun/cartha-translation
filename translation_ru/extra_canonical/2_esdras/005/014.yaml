lexical_decisions:
- source_word: euigilaui
  choice: пробудился
  rationale: Точно передаёт завершённое пробуждение и соответствует возвышенному повествовательному регистру.
- source_word: corpus meum
  choice: тело моё
  rationale: Прямое соответствие латинскому выражению с сохранением естественного для библейской прозы порядка слов.
- source_word: horruit ualde
  choice: сильно содрогнулось
  rationale: Передаёт интенсивную телесную дрожь или потрясение; «содрогнулось» естественнее в данном контексте, чем буквальное «ощетинилось».
- source_word: anima mea
  choice: душа моя
  rationale: Сохраняет антропологически открытое значение anima и незавершённость сохранившегося фрагмента.
theological_decisions:
- issue: Соотношение тела и души
  choice: Сохранены отдельные обозначения «тело моё» и «душа моя» без пояснения их отношений.
  alternative: Передать anima как «жизнь» или объединить телесное и внутреннее переживание.
  rationale: Латинский текст явно различает corpus и anima; перевод не должен навязывать более определённую антропологическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Многоточие показывает, что стих в предоставленном латинском источнике обрывается после слов et anima mea; никаких отсутствующих слов не восполнено.
