  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: ru
  text: и из всех морских глубин Ты наполнил для Себя один поток,[a] и из всех построенных городов освятил для Себя Сион,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предыдущей редакции, из-за смещения нумерации стихов: «и из всех сотворённых птиц Ты назвал для Себя одну голубку, и из всего сотворённого скота предусмотрел для Себя одну овцу».'
    reason: Цитата отражает текст следующего стиха, прежде ошибочно отнесённый к 5:25; это не альтернативное чтение основного латинского текста данного стиха.
lexical_decisions:
- source_word: abyssis maris
  choice: морских глубин
  rationale: Прямо передаёт латинское сочетание и сохраняет образ глубин моря.
- source_word: replesti tibi rivum unum
  choice: Ты наполнил для Себя один поток
  rationale: Сохраняет необычный образ и структуру источника, не пытаясь устранить возможную текстовую трудность.
- source_word: aedificatis civitatibus
  choice: построенных городов
  rationale: Естественно и точно передаёт завершённое действие латинского причастия.
- source_word: sanctificasti tibimet ipsi Sion
  choice: освятил для Себя Сион
  rationale: Передаёт сакральное значение sanctificasti и усиленное возвратное выражение tibimet ipsi без стилистической перегрузки.
theological_decisions:
- issue: Избрание Сиона среди всех городов
  choice: освятил для Себя Сион
  alternative: отделил Себе Сион как святыню
  rationale: Формулировка сохраняет богословски насыщенный глагол «освятил», не уточняя сверх источника характер освящения или избрания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Сохранены параллелизм, необычный образ одного потока и конечная запятая, поскольку стих синтаксически продолжается.
