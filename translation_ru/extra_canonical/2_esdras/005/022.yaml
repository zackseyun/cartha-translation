base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: ru
  text: И душа моя вновь обрела дух разумения, и я снова начал говорить пред Всевышним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: вновь обрела
  rationale: Передаёт восстановление ранее утраченного состояния; естественно сочетается с подлежащим «душа».
- source_word: anima mea
  choice: душа моя
  rationale: Прямое и стилистически достойное соответствие латинскому выражению.
- source_word: spiritum intellectus
  choice: дух разумения
  rationale: Сохраняет различие между anima и spiritus и допускаемую исходным текстом смысловую напряжённость; «разумение» указывает на способность понимать.
- source_word: iterum coepi loqui
  choice: я снова начал говорить
  rationale: Точно передаёт повторное начало речи без ненужного добавления отдельного объекта для sermones.
- source_word: coram Altissimo
  choice: пред Всевышним
  rationale: «Пред» естественно для возвышенного библейского регистра и передаёт нахождение перед лицом Всевышнего.
theological_decisions:
- issue: Соотношение «души» и «духа разумения»
  choice: 'Сохранить оба разных термина: «душа моя» и «дух разумения»'
  alternative: 'Передать обобщённо: «ко мне вернулась способность понимать»'
  rationale: Латинский текст явно различает anima и spiritus; обобщение устранило бы возможную антропологическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизирующее «пред» сохранено как понятное и уместное; синтаксис остаётся простым и доступным.
