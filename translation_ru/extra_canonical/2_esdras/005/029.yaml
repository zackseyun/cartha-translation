  yaml_path: translation/extra_canonical/2_esdras/005/029.yaml
  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: ru
  text: И те, кто противился Твоим обещаниям, попрали тех, кто верил Твоим заветам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежнем переводе здесь стояло: «И если Ты возненавидел Свой народ, то его следовало наказать Твоими руками». Однако эти слова передают начало следующего стиха, а не латинский текст данного стиха.'
    reason: Предупреждает о прежнем смещении нумерации на один стих и объясняет исправление текста.
lexical_decisions:
- source_word: contradicebant
  choice: противился
  rationale: Передаёт длительное противодействие или неприятие Божьих обещаний, не сужая смысл до простого словесного возражения.
- source_word: sponsionibus
  choice: обещаниям
  rationale: В данном контексте латинское sponsiones означает данные Богом обещания или заверения.
- source_word: conculcaverunt
  choice: попрали
  rationale: Сохраняет сильный образ буквального или переносного попрания и завершённый вид латинского перфекта.
- source_word: testamentis
  choice: заветам
  rationale: Обычный библейский эквивалент testamenta; множественное число исходного текста сохранено.
- source_word: credebant
  choice: верил
  rationale: Сохраняет смысл веры и доверия, не уточняя, идёт ли речь о признании истинности заветов или об уповании на них.
theological_decisions:
- issue: Связь между двумя группами, обозначенными qui
  choice: Первые («кто противился») представлены как подлежащее, вторые («кто верил») — как подразумеваемое дополнение при глаголе «попрали».
  alternative: Понять оба оборота как однородные определения одной группы.
  rationale: Смысловая противоположность contradicebant и credebant и переходный глагол conculcaverunt поддерживают чтение, отражённое в английском консультационном тексте, хотя в латинской фразе прямое дополнение формально не выражено.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Местоимение «Твоим» написано с прописной буквы как обращённое к Богу; синтаксический параллелизм исходной фразы сохранён.
