  source_fidelity: 'Основной смысл передан верно: pertransiit отражено совершенным «прошла», iustitia — «праведность», а iustum faciens — как «тот, кто поступает праведно», без богословски неоправданного значения «делает праведным». Неопределённость краткого haec не следует разрешать именованием референта.'
