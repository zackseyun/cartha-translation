base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: ru
  text: '«Прошла ли праведность или тот, кто поступает праведно?»[a] И она ответит: «Нет». И в то время люди будут надеяться, но не получат желаемого;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих продолжает вопрос из предыдущего стиха. В латинском тексте перед словами «тот, кто поступает праведно» союз «или» не выражен; он добавлен в переводе для передачи эллиптической координации.
    reason: verse_boundary_and_ellipsis
lexical_decisions:
- source_word: pertransiit
  choice: прошла
  rationale: Передаёт завершённое действие латинского perfectum и сохраняет образ прохождения, продолжающий вопрос из предыдущего стиха.
- source_word: iustitia
  choice: праведность
  rationale: Обычное и богословски нейтральное соответствие латинскому iustitia в данном контексте.
- source_word: iustum faciens
  choice: тот, кто поступает праведно
  rationale: Передаёт семитизированное выражение о человеке, творящем праведность, не истолковывая его как того, кто делает праведным другого.
- source_word: haec negabit
  choice: 'та ответит: «Нет»'
  rationale: Указательное местоимение женского рода отсылает к земле/стране из предыдущего контекста; negabit здесь естественно передаётся как отрицательный ответ.
- source_word: sperabunt homines et non impetrabunt
  choice: люди будут надеяться, но не получат желаемого
  rationale: Impetrare означает добиться или получить то, на что надеются; добавление «желаемого» делает эллипсис понятным по-русски, не уточняя предмет надежды.
theological_decisions:
- issue: Значение iustum faciens
  choice: тот, кто поступает праведно
  alternative: тот, кто делает праведным
  rationale: Контекст и засвидетельствованный семитский оборот указывают на совершающего праведность, а не на оправдывающего другого.
- issue: Референт haec
  choice: та — земля/страна из предыдущего стиха
  alternative: она — праведность
  rationale: Женский род допускает обе связи, но структура продолжающегося диалога земель делает отсылку к отвечающей земле наиболее естественной; формулировка «та» сохраняет связь без повторного внесения существительного.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальная кавычка показывает, что стих продолжает прямую речь предыдущего стиха; двусмысленность предмета человеческой надежды не конкретизируется.
