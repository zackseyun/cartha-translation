  source_fidelity: 'Перевод верно передаёт все три параллельных вопроса латинского текста: передачу «одного» многим, выделение одного корня над другими и рассеяние «единственного Твоего» среди многих. Неопределённые референты исходника не конкретизируются. «Возвысил ... над» является допустимой естественной передачей сочетания praeparasti ... super в данном образном контексте.'
