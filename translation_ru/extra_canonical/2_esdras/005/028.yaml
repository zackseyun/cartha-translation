source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: ru
  text: И теперь, Господи, почему Ты отдал одного многим, возвысил один корень над другими и рассеял Своего единственного среди множества?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tradidisti
  choice: отдал
  rationale: Передаёт значение «передал, отдал во власть» без излишнего уточнения, кому или на погибель ли был отдан объект.
- source_word: unum / unicum tuum
  choice: одного / Своего единственного
  rationale: Сохранены параллель и смысловая напряжённость между «одним» и «единственным Твоим»; референт не конкретизируется вопреки латинскому тексту.
- source_word: plurimis / in multis
  choice: многим / среди множества
  rationale: Различено направление передачи (дательный plurimis) и положение среди многих (in multis), при этом избегается неестественное повторение.
- source_word: praeparasti ... super
  choice: возвысил ... над
  rationale: В данном контексте выражает установление одного корня выше остальных; буквальное «приготовил над» по-русски неясно и неестественно.
- source_word: radicem
  choice: корень
  rationale: Сохранён исходный образ без истолкования как народа, рода или Израиля.
- source_word: dispersisti
  choice: рассеял
  rationale: Прямой и естественный эквивалент, сохраняющий образ рассеяния среди множества.
theological_decisions:
- issue: Кого обозначают «один», «один корень» и «Твой единственный»
  choice: Оставить образы и референт неопределёнными
  alternative: Явно назвать Израиль или избранный народ
  rationale: Латинский стих сам не называет референта; его конкретизация сняла бы подлинную контекстуальную неоднозначность.
- issue: Характер передачи одного многим
  choice: «отдал» без добавления «во власть» или «на погибель»
  alternative: «предал во власть многих»
  rationale: Глагол tradidisti допускает оттенок передачи во власть, но дополнение отсутствует; нейтральная формулировка не усиливает обвинительный смысл сверх источника.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Местоимения, обращённые к Богу, даны с прописной буквы. Ошибочная прежняя привязка текста следующего стиха не воспроизводится; сноска о прежнем варианте не включена, поскольку она относится к редакционной истории, а не к вариантному чтению данного латинского текста.
