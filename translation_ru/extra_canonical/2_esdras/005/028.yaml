  terminology: «Господи», «корень», «отдал», «рассеял» употреблены последовательно и без конфессионально обусловленного истолкования. Написание «Ты» и «Своего» с прописной буквы соответствует принятому русскому религиозно-литературному регистру. Сноска английского аудиторского следа относится к ошибочно привязанному прежнему тексту и не должна переноситься как текстологическая сноска к этому стиху.
