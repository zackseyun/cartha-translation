  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: ru
  text: 'И я сказал: «Господи, Владыка, кто же может знать это, кроме того, кто не обитает среди людей?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Владыка Господь
  rationale: Передаёт двойное обращение с сохранением различия между титулом dominator и обращением domine; формула звучит торжественно и естественно по-русски.
- source_word: quis enim est qui potest haec scire
  choice: кто же может знать это
  rationale: Частица «же» естественно передаёт усилительно-объяснительное enim, а единственное «это» охватывает совокупность ранее сказанного.
- source_word: nisi qui cum hominibus habitationem non habet
  choice: кроме того, кто не обитает среди людей
  rationale: Естественно передаёт буквальный образ отсутствия обитания вместе с людьми, не уточняя личность подразумеваемого знающего.
theological_decisions:
- issue: Кого подразумевает выражение «кто не обитает среди людей»
  choice: Сохранена неопределённая формулировка «тот, кто»
  alternative: Прямо назвать Бога, ангела или небесное существо
  rationale: Латинский текст не называет referent прямо; уточнение устранило бы подлинную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием; синтаксис краткий и ясный, без архаизмов и конфессионально окрашенных добавлений.
