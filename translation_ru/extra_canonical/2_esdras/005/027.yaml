  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: ru
  text: И из всех умножившихся народов Ты приобрёл Себе один народ и этому народу, которого Ты возжелал, даровал закон, всеми признанный.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicatis populis
  choice: умножившихся народов
  rationale: Передаёт причастную форму и смысл многочисленности или размножения народов, сохраняя повторяющуюся конструкцию контекста.
- source_word: adquisisti tibi
  choice: Ты приобрёл Себе
  rationale: Прямо передаёт значение латинского глагола и возвратную направленность tibi.
- source_word: populum unum
  choice: один народ
  rationale: Сохраняет противопоставление множества народов одному избранному народу.
- source_word: quem desiderasti
  choice: которого Ты возжелал
  rationale: Сохраняет сильный оттенок желания в desiderasti и возвышенный библейский регистр.
- source_word: ab omnibus probatam legem
  choice: закон, всеми признанный
  rationale: Передаёт probatam как испытанный и получивший одобрение; формулировка сохраняет возможную неоднозначность того, кто подразумевается под «всеми».
- source_word: donasti
  choice: даровал
  rationale: Передаёт значение дара и соответствует dignified modern Russian biblical register.
theological_decisions:
- issue: Смысл ab omnibus probatam
  choice: всеми признанный
  alternative: испытанный всеми / одобренный всеми
  rationale: Латинское probatam допускает оттенки испытанности и одобрения. «Признанный» естественно по-русски и не уточняет без основания состав «всех».
- issue: Отношение Бога к избранному народу в quem desiderasti
  choice: которого Ты возжелал
  alternative: которого Ты пожелал / который был Тебе желанен
  rationale: Сильная формулировка сохраняет напряжение исходного текста и не заменяет желание более конфессионально окрашенным понятием избрания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавная буква в местоимении «Ты» отражает принятую русскую практику обращения к Богу. Ошибочное прежнее чтение, относящееся к следующему стиху, в примечание не включено, поскольку оно не является вариантом данного латинского текста.
