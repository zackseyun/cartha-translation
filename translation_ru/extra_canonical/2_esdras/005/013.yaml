  source_fidelity: 'Перевод полностью передаёт латинский текст: сохранены будущее время laborabunt, противопоставление et non, пассивная и намеренно неуточнённая метафора non dirigentur uiae eorum, разрешение говорящему возвестить знамения, а также условия повторной молитвы, плача и семидневного поста. «Вновь услышишь о вещах, превосходящих эти» адекватно передаёт iterato horum maiora без лишней интерпретации.'
