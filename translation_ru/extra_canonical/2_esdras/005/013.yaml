  terminology: «Знамения» соответствует signa в апокалиптическом контексте. «Трудиться», «молиться», «поститься» и обращение на «ты» точны и регистрово последовательны. Конструкции, требующей русской сноски, нет; английская помета a относится к истории английского варианта и не должна механически переноситься в русский текст без русского якоря.
