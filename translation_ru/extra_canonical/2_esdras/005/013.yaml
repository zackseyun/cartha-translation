  text: laborabunt et non dirigentur uiae eorum. Haec signa dicere tibi permissum est mihi, et si oraueris iterum et ploraueris sicut et nunc et ieiunaueris septem diebus, audies iterato horum maiora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: ru
  text: Они будут трудиться, но пути их не будут направлены. Мне позволено сообщить тебе об этих знамениях. И если ты снова станешь молиться и плакать, как теперь, и будешь поститься семь дней, то вновь услышишь о вещах, превосходящих эти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborabunt
  choice: будут трудиться
  rationale: Передаёт будущее время и общий смысл латинского laborare без неоправданного уточнения рода труда.
- source_word: non dirigentur uiae eorum
  choice: пути их не будут направлены
  rationale: Сохраняет пассивную форму и образ «направляемых путей» в dirigentur, не сводя неоднозначную метафору исключительно к успеху или процветанию.
- source_word: signa
  choice: знамениях
  rationale: В эсхатологическом контексте «знамения» естественно передаёт знаки, указывающие на грядущие события.
- source_word: iterato horum maiora
  choice: вновь услышишь о вещах, превосходящих эти
  rationale: Передаёт повторность iterato и сравнительное maiora, не уточняя, в каком именно отношении последующие откровения будут «больше».
theological_decisions:
- issue: Смысл образа non dirigentur uiae eorum
  choice: пути их не будут направлены
  alternative: пути их не будут успешны
  rationale: Выбранный вариант ближе к латинской форме и сохраняет возможность понимать выражение как отсутствие верного направления, устроения или благополучного исхода, не закрепляя только идею успеха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис разделён на два предложения для ясности; обращение на «ты» соответствует единственному числу латинского текста.
