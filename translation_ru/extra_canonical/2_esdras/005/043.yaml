  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: ru
  text: Ибо разве Ты не мог сотворить разом тех, кто уже был сотворён, тех, кто существует ныне, и тех, кто ещё будет существовать, чтобы скорее явить Твой суд?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nec enim poteras
  choice: Ибо разве Ты не мог
  rationale: «Ибо» передаёт объяснительную связь enim, а вопросительная конструкция «разве… не мог» естественно выражает латинское nec… poteras без превращения вопроса в утверждение.
- source_word: facere
  choice: сотворить
  rationale: В контексте Божьего приведения людей к бытию «сотворить» точнее и достойнее нейтрального «сделать».
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: тех, кто уже сотворён, тех, кто живёт ныне, и тех, кому ещё предстоит жить
  rationale: Сохранено трёхчастное различение прошлого, настоящего и будущего; для второй и третьей групп существование передано естественным современным русским языком.
- source_word: in unum
  choice: одновременно
  rationale: В данном вопросе выражение указывает на сведение всех поколений в один момент; «одновременно» яснее буквального, но неестественного «в одно».
- source_word: ut celerius iudicium tuum ostendas
  choice: чтобы скорее явить Твой суд
  rationale: Сохраняет целевую конструкцию, сравнительную степень celerius и образ открытого проявления суда в ostendas.
theological_decisions:
- issue: Характер вопроса о Божьей способности и сроке суда
  choice: 'Сохранён прямой риторический вопрос: «разве Ты не мог…?»'
  alternative: «Разве Ты не мог бы…?» или «Разве Ты не мог сотворить…?» в смысле прошедшей нереализованной возможности
  rationale: Латинское poteras допускает контекстуальный оттенок нереализованной возможности, однако не требует догматически уточнять модальность; русское «не мог» сохраняет напряжение вопроса.
- issue: Кого обозначают три группы
  choice: Люди, уже сотворённые, ныне живущие и будущие
  alternative: 'Абстрактно: всё бывшее, сущее и будущее'
  rationale: Относительное qui и контекст суда естественно указывают на лиц; перевод не вводит дополнительных представлений об их состоянии.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-библейской речи. Местоимение «Ты» и притяжательное «Твой» написаны с прописной буквы как форма обращения к Богу. Трёхчастная структура сохранена, но две последние части слегка идиоматизированы для ясности.
