source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: ru
  text: 'Итак, подумай и сам: вы ниже ростом, чем те, кто жил до вас, а те, кто будет после вас, будут ниже вас — как у творения, уже стареющего и оставляющего позади силу юности.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: statura
  choice: ростом
  rationale: Передаёт прямое значение латинского слова и сохраняет конкретный образ уменьшения человеческого роста от поколения к поколению.
- source_word: senescentis creaturae
  choice: творение уже стареет
  rationale: Сохраняет олицетворённый образ стареющего сотворённого мира; «творение» здесь естественнее и шире, чем «создание».
- source_word: fortitudinem iuuentutis praeterientis
  choice: оставляет позади силу юности
  rationale: Передаёт образ ухода творения за пределы юношеской силы, не сводя его лишь к общему ослаблению.
theological_decisions:
- issue: Что обозначает creatura
  choice: творение
  alternative: мир / сотворённый мир
  rationale: Латинское creatura допускает широкий смысл всего сотворённого порядка. Выбрано «творение», чтобы не сужать образ и не вносить дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского образа. Переход от единственного числа («подумай сам») к множественному («вы», «вас») сохранён в соответствии с латинским обращением и смыслом английского консультационного текста.
