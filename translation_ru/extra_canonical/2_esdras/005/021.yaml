lexical_decisions:
- source_word: post dies septem
  choice: через семь дней
  rationale: Естественная русская передача временного значения латинского оборота.
- source_word: cogitationes cordis mei
  choice: мысли моего сердца
  rationale: Сохраняет библейский образ сердца как средоточия внутренней жизни и размышлений.
- source_word: molestae erant mihi valde
  choice: стали для меня весьма тягостны
  rationale: Передаёт личную обременённость и усиление valde, не уточняя сверх источника характер переживания.
