  choice: Основной текст переведён непосредственно с приведённого латинского текста стиха 5:21
  alternative: «И душа моя вновь обрела дух разумения, и я снова начал говорить слова пред Всевышним»
  rationale: Альтернативная формулировка отражает прежнюю редакцию, но не соответствует латинскому тексту данного стиха; она сохранена только в примечании как история варианта.
translation_notes:
  register: Современный литературный русский с сохранением библейского антропологического выражения «мысли моего сердца»; синтаксис достоинственный и понятный.
