  text: And it happened[a], when I had spoken these words, and was sent
translation:
  language: ru
  text: И случилось, когда я произнёс эти слова, что был послан…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: И случилось
  rationale: Естественная для библейского повествования передача латинской формулы, вводящей последующее событие.
- source_word: cum locutus essem sermones istos
  choice: когда я произнёс эти слова
  rationale: Передаёт предшествование действия и сохраняет прямой смысл sermones istos без излишней архаизации.
- source_word: et missus
  choice: что был послан…
  rationale: Союз et здесь вводит главное предложение после Et factum est; пассивная форма и мужской род сохранены, а многоточие показывает, что сказуемое и предложение продолжаются в следующем стихе.
theological_decisions:
- issue: Не назван субъект формы missus
  choice: 'Сохранить неназванный субъект: «был послан»'
  alternative: Уточнить субъект по следующему стиху
  rationale: В данном фрагменте источник не называет посланного; его преждевременное уточнение устранило бы подлинную синтаксическую незавершённость текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Стих сохранён как незавершённая часть предложения, продолжающегося за его границей.
