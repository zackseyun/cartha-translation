  text: And it happened on the second night that Phaltiel, leader of the people, came to me and said, 'Where were you, and why is your face sad?
translation:
  language: ru
  text: 'И случилось во вторую ночь: пришёл ко мне Фалтиил, предводитель народа, и сказал мне: «Где ты был и почему лицо твоё печально?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in nocte secunda
  choice: во вторую ночь
  rationale: Прямо передаёт временное указание латинского текста естественным русским выражением.
- source_word: Phalthiel
  choice: Фалтиил
  rationale: Транслитерация имени в форме, соответствующей традиционной русской библейской передаче.
- source_word: dux populi
  choice: предводитель народа
  rationale: Сохраняет широкое значение dux как руководителя или вождя, не вводя более узкого административного либо военного титула.
- source_word: ubi eras
  choice: где ты был
  rationale: Точно сохраняет вопрос о прежнем местонахождении адресата.
- source_word: quare uultus tuus tristis
  choice: почему лицо твоё печально
  rationale: Передаёт образный строй оригинала без замены на истолковывающее «почему ты печален».
