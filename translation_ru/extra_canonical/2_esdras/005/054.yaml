  text: Therefore consider also for yourself[a], that you are smaller in stature than those before you,
translation:
  language: ru
  text: 'Итак, рассуди и сам: вы ниже ростом тех, кто был до вас,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Considera
  choice: рассуди
  rationale: Передаёт призыв обдумать сказанное и сделать вывод; звучит естественно и достойно в современном русском.
- source_word: et tu
  choice: и сам
  rationale: Сохраняет обращение к собеседнику и эмфатический оттенок латинского выражения.
- source_word: minores statu
  choice: ниже ростом
  rationale: Прямо передаёт сравнительное указание на физический рост, не расширяя его до общего значения «меньше» или «хуже».
- source_word: prae his qui ante vos
  choice: тех, кто был до вас
  rationale: Естественно передаёт сравнение с прежними поколениями, сохраняя открытость формулировки «были до вас».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с ясным, сдержанно возвышенным звучанием. Смена единственного числа в обращении («сам») на множественное («вы», «вас») сохранена в соответствии с латинскими tu и estis/vos. Конечная запятая оставлена, поскольку мысль продолжается в следующем стихе.
