source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: ru
  text: Но если Всевышний даст тебе дожить до того времени, то после третьего потрясения[a] ты увидишь, как солнце внезапно засияет ночью, а луна — днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В других древних версиях: «после третьей трубы»; латинский текст здесь, возможно, испорчен.'
    reason: 'Текстологическая вариантность: латинское turbatam означает потрясение или смятение, тогда как сирийская, эфиопская и арабская версии отражают чтение «труба».'
lexical_decisions:
- source_word: Altissimus
  choice: Всевышний
  rationale: Устоявшееся и естественное русское соответствие латинскому божественному титулу.
- source_word: dederit … vivere
  choice: даст тебе дожить до того времени
  rationale: Передаёт смысл «дарует тебе жить и увидеть это» естественным современным русским оборотом, не утверждая бессмертия или особого богословского смысла.
- source_word: post tertiam turbatam
  choice: после третьего потрясения
  rationale: Следует дошедшему латинскому чтению turbatam и сохраняет апокалиптический смысл потрясения; грамматическая шероховатость латинского текста и свидетельство древних версий требуют текстологической сноски.
- source_word: relucescet subito
  choice: внезапно засияет
  rationale: Точно передаёт внезапное появление света и звучит естественно по-русски.
theological_decisions:
- issue: Текстологическое расхождение между латинским turbatam и чтением древних переводов «труба»
  choice: В основном тексте — «третьего потрясения»
  alternative: «после третьей трубы»
  rationale: Заданный оригинал — очищенный латинский текст Бенсли, где стоит turbatam. Однако вероятная порча текста и согласное свидетельство дочерних версий достаточно значимы, чтобы сохранить альтернативу в сноске, не решая спор молча.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-возвышенным апокалиптическим звучанием. Оборот «дожить до того времени» устраняет неестественную латинскую кальку, а параллелизм «ночью — днём» сохранён.
