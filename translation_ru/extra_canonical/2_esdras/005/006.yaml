  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: ru
  text: И будет царствовать тот, кого не ожидают живущие на земле, и птицы совершат перелёт.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnabit
  choice: воцарится
  rationale: Передаёт будущее вступление в царствование и сохраняет возвышенный библейский регистр.
- source_word: quem non sperant
  choice: тот, кого не ожидают
  rationale: В данном контексте латинское sperant естественно передаётся как «ожидают»; формулировка не уточняет ни личность, ни характер ожидания.
- source_word: qui inhabitant super terram
  choice: живущие на земле
  rationale: Естественный современный эквивалент латинского оборота, сохраняющий его универсальный охват.
- source_word: volatilia
  choice: птицы
  rationale: Контекстуально точное и понятное обозначение летающих птиц.
- source_word: conmigrationem facient
  choice: совершат перелёт
  rationale: Передаёт образ перемещения птиц без добавления отсутствующего в источнике значения «вместе».
theological_decisions:
- issue: Личность будущего царя
  choice: тот, кого не ожидают
  alternative: неожиданный правитель / тот, на кого не надеются
  rationale: Источник не называет и не отождествляет эту фигуру; перевод сохраняет неопределённость и не вводит богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух знамений сохранён; лишнее наречие «вместе» не добавлено.
