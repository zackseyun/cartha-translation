source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: ru
  text: И многие будут искать, но не найдут; и умножатся на земле неправедность и невоздержанность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur a multis et non invenietur
  choice: многие будут искать, но не найдут
  rationale: Активная русская конструкция естественно передаёт латинский пассив, сохраняя не названный в самом стихе объект поиска и связь с предшествующим контекстом.
- source_word: iniustitia
  choice: неправедность
  rationale: Передаёт нравственно-религиозный смысл несправедливости и беззакония, не сужая его до юридической несправедливости.
- source_word: incontinentia
  choice: невоздержанность
  rationale: Обозначает отсутствие самообладания и нравственной сдержанности; соответствует широкому значению латинского слова.
- source_word: multiplicabitur
  choice: умножатся
  rationale: Сохраняет образ количественного возрастания; в русском употреблено множественное число по согласованию с двумя однородными подлежащими.
theological_decisions:
- issue: Не названный объект поиска
  choice: Не добавлять существительное или местоимение
  alternative: 'Уточнить: «будут искать её» либо назвать объект по контексту'
  rationale: Латинский текст оставляет объект выраженным лишь грамматически и зависимым от предшествующего контекста; перевод сохраняет эту связность и не устраняет возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Точка с запятой ясно разделяет два пророческих утверждения без добавления отсутствующего в источнике временного наречия.
