lexical_decisions:
- source_word: secundum tempus
  choice: в своё время
  rationale: Естественно передаёт временное соответствие; притяжательное «своё» восстанавливается по смыслу фрагмента и согласуется с английским консультационным слоем.
- source_word: matricem
  choice: утробе
  rationale: Латинское matrix здесь обозначает материнскую утробу; дательный падеж обусловлен глаголом dedi и сохраняет незавершённость исходного фрагмента.
- source_word: et ego dedi
  choice: И Я дал
  rationale: Сохраняет усиленное местоимение ego; прописная «Я» указывает на речь Бога в данном контексте, не меняя содержания.
theological_decisions:
- issue: Кто говорит во второй фразе
  choice: Божественный говорящий обозначен прописным «Я»
  alternative: «И я дал утробе» со строчной буквы
  rationale: Контекст реплики указывает на Бога; русская издательская традиция допускает прописное местоимение, при этом имя говорящего в текст не добавляется.
- issue: Незавершённый синтаксис стиха
  choice: Сохранить обрыв на словах «дал утробе»
  alternative: Дополнить объект дара по последующему тексту
  rationale: Предоставленный латинский источник заканчивается на matricem; восполнять отсутствующий материал без источниковых данных нельзя.
translation_notes:
  register: Современный литературный русский, сдержанный библейский регистр. Начальная строчная буква и закрывающая кавычка после первой фразы отражают то, что предоставленный материал является серединой более длинной реплики; финал намеренно оставлен незавершённым вслед за источником.
