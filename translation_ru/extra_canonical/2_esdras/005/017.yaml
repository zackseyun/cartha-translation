  source_fidelity: 'Текст точно передаёт единственное вопросительное предложение латинского оригинала. «Тебе вверен» адекватно передаёт tibi creditus est; «в земле его изгнания» соответствует смыслу in regione trans migrationis eorum в принятой для этого места разбивке и согласуется с английским аудиторским следом («in the land of their exile»). Граница стиха соблюдена: последующее «Exsurge ergo...» не включено.'
