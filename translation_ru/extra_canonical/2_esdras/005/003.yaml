id: 2ES.5.3
reference: 2 Esdras 5:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit inconposita vestigio quam nunc vides regnare regionem, et videbunt eam desertam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: ru
  text: И область, которая, как ты видишь, ныне господствует, станет непроходимой пустошью, и увидят её опустевшей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: область
  rationale: Передаёт территориальное значение латинского regionem точнее, чем более широкое «земля», и естественно звучит в данном контексте.
- source_word: quam nunc vides regnare
  choice: которая, как ты видишь, ныне господствует
  rationale: Сохраняет необычную персонификацию области и значение regnare, не подменяя его толкованием о правителях или царстве.
- source_word: inconposita vestigio
  choice: непроходимой пустошью
  rationale: Латинское выражение текстуально затруднительно; перевод передаёт образ местности без проложенного следа или пути и согласуется с последующим desertam, не устраняя полностью образную напряжённость.
- source_word: desertam
  choice: опустевшей
  rationale: Передаёт состояние запустения без добавочного значения намеренного разорения.
theological_decisions:
- issue: Смысл господства области
  choice: 'Сохранена персонификация: «область… господствует».'
  alternative: «область, чьи правители ныне господствуют» или «нынешнее царство».
  rationale: Источник прямо связывает regnare с regionem; развёрнутое историко-политическое истолкование отсутствует в стихе и не должно вноситься в перевод.
- issue: Характер будущего запустения
  choice: «станет… пустошью» и «увидят её опустевшей».
  alternative: «будет разорена».
  rationale: Формулировка сохраняет различие между образом непроходимой местности и состоянием desertam, не вводя явно действующего разрушителя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ныне» сохраняет достоинство стиля и остаётся понятным; синтаксис сделан естественным, при этом необычное «область… господствует» намеренно сохранено.
