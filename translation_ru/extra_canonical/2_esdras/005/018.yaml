source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: exsurge ergo et gusta panem alicuius, etnon derelinquas nos sicut pastor gregem suum in manibus luporum malignorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/018.yaml
  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: ru
  text: Итак, встань и поешь немного хлеба; не оставляй нас, как пастух оставляет своё стадо во власти злых волков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exsurge ergo
  choice: Итак, встань
  rationale: Передаёт побуждение exsurge и логическую связь ergo естественным современным русским порядком слов.
- source_word: gusta panem alicuius
  choice: поешь немного хлеба
  rationale: Gusta буквально означает «отведай», но в контексте призыва подкрепиться естественнее «поешь»; alicuius при panem передано как неопределённое количество — «немного хлеба», в соответствии с контекстом и консультационным переводом.
- source_word: derelinquas nos
  choice: не оставляй нас
  rationale: Сохраняет прямую просьбу не покидать и не бросать говорящих.
- source_word: sicut pastor gregem suum
  choice: как пастух оставляет своё стадо
  rationale: В латинском сравнении глагол при второй части подразумевается; его повторение по-русски делает синтаксис ясным, не меняя образа.
- source_word: in manibus luporum malignorum
  choice: во власти злых волков
  rationale: Идиома «в руках» применительно к волкам звучала бы неестественно; «во власти» передаёт смысл оставления стада на произвол враждебных хищников.
theological_decisions:
- issue: Образ пастыря и стада
  choice: Сохранить сравнение без богословского уточнения личности пастуха
  alternative: Истолковать пастуха как конкретного духовного или мессианского деятеля
  rationale: Латинский текст содержит образное сравнение, но сам не раскрывает его богословскую идентификацию.
translation_notes:
  register: Современный литературный русский язык; тон настоятельной просьбы сохранён. Прежний вариант, фактически передававший следующий стих, не включён как текстовый вариант, поскольку он не подтверждается предоставленным латинским источником.
