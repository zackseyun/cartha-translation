  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: ru
  text: И если Ты действительно возненавидел Свой народ, то он должен быть наказан Твоими руками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: odiens odisti
  choice: и впрямь ненавидишь
  rationale: Повтор однокоренных форм передаёт усилительную конструкцию; «и впрямь» сохраняет эмфазу, не усиливая её до безусловного «совершенно».
- source_word: populum tuum
  choice: Свой народ
  rationale: Естественная русская форма при обращении к Богу, точно передающая принадлежность.
- source_word: tuis manibus
  choice: Твоими собственными руками
  rationale: «Собственными» выражает подчёркнутое латинским притяжательным местоимением личное действие.
- source_word: debet castigari
  choice: должен быть наказан
  rationale: Передаёт модальность долженствования и пассив; «наказан» естественно и достаточно широко сохраняет значение castigari, которое может включать исправительное взыскание.
theological_decisions:
- issue: Высказывание о ненависти Бога к Своему народу
  choice: 'сохранено как условное и эмфатическое: «если Ты и впрямь ненавидишь»'
  alternative: «если Ты совершенно возненавидел»
  rationale: Текст выражает напряжённое риторическое обращение, а не утверждение как установленный факт; настоящее время и умеренная эмфаза ближе к латинскому свидетельству.
- issue: Характер наказания
  choice: «наказан» без уточнения цели
  alternative: «вразумлён наказанием» / «подвергнут взысканию»
  rationale: Не следует без достаточного основания навязывать исключительно исправительное либо карательное богословское толкование.
translation_notes:
  register: Современный литературный русский язык; прямое, торжественное обращение без архаизмов. Местоимения обращения к Богу написаны с прописной буквы. Ошибочная прежняя привязка текста следующего стиха не воспроизводится.
