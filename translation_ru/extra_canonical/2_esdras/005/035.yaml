source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: non potes. et dixi: quare, domine, aut quidnascebar, aut quare non fiebat matrix matris meae mihi sepulchrum, ut non viderem laborem Iacob et defatigationem generis Israhel?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: ru
  text: 'И он сказал мне: «Не можешь». И я сказал: «Почему, Господи? Или зачем я родился? Или почему утроба моей матери не стала для меня могилой, чтобы мне не видеть тягот Иакова и изнеможения рода Израиля?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  choice: Не можешь
  rationale: Прямая и естественная передача краткого латинского ответа без добавления подразумеваемого объекта.
- source_word: quid nascebar
  choice: Зачем я родился?
  rationale: В контексте скорби quid имеет смысл вопроса о цели или причине рождения; современное русское «зачем» естественно передаёт этот оттенок.
- source_word: matrix matris meae
  choice: утроба моей матери
  rationale: «Утроба» точно и литературно передаёт matrix в данном контексте рождения.
- source_word: labor Iacob
  choice: бедствия Иакова
  rationale: Labor здесь обозначает тяготы и страдания народа; множественное «бедствия» естественно по-русски и сохраняет скорбный смысл.
- source_word: defatigatio generis Israhel
  choice: изнеможение рода Израиля
  rationale: «Изнеможение» сохраняет буквальный образ крайней усталости и истощения, а «род Израиля» передаёт generis Israhel без конфессионального уточнения.
theological_decisions:
- issue: Обращение domine
  choice: Господи
  alternative: господин
  rationale: В религиозном контексте обращения Ездры традиционное «Господи» естественно, при этом латинское domine само по себе допускает более широкое значение; текст не уточняет адресата добавочными словами.
- issue: Соотношение Иакова и Израиля
  choice: 'Сохранены оба обозначения: «Иакова» и «рода Израиля»'
  alternative: унифицировать как одно обозначение народа Израиля
  rationale: Параллелизм оригинала следует сохранить, не устраняя возможный риторический и богословский оттенок двух именований.
translation_notes:
  register: Современный литературный русский язык с библейским достоинством; синтаксис упрощён лишь настолько, чтобы длинная цепь риторических вопросов звучала ясно. Неявный объект при «Не можешь» не добавлен, поэтому лаконичность и неоднозначность оригинала сохранены.
