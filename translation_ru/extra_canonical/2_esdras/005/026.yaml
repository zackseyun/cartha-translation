translation:
  language: ru
  text: И из всех сотворённых птиц Ты нарёк Себе одну голубку, и из всех сотворённых животных предназначил Себе одну овцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volatilibus
  choice: птиц
  rationale: Обычное современное соответствие латинскому обозначению летающих существ; в данном контексте речь прямо продолжается образом голубки.
- source_word: nominasti tibi
  choice: нарёк для Себя
  rationale: Сохраняет значение называния или особого назначения, не сводя его без текстового основания к более толковательному «избрал».
- source_word: columbam unam
  choice: одну голубку
  rationale: Передаёт женский род латинского columba и подчёркнутую единичность образа.
- source_word: plasmatis pecoribus
  choice: созданного скота
  rationale: Передаёт образ сформированных Богом домашних стад естественным русским выражением; собирательное единственное число соответствует смыслу латинского множественного оборота.
- source_word: providisti tibi
  choice: предусмотрел для Себя
  rationale: Сохраняет отличие providisti от предшествующего nominasti и значение заблаговременного определения или приготовления для Себя.
- source_word: ovem unam
  choice: одну овцу
  rationale: Прямое и естественное соответствие латинскому ovem с сохранением единичности.
theological_decisions:
- issue: Образы одной голубки и одной овцы
  choice: Сохранить метафорические образы без поясняющей идентификации
  alternative: Передать их как прямое указание на избранный народ
  rationale: Сам стих выражает мысль образно; явное отождествление с народом внесло бы толкование в основной текст и устранило бы намеренную поэтическую форму.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксический параллелизм двух частей латинского текста сохранён.
