- from: И из всех сотворённых птиц Ты нарёк для Себя одну голубку, и из всего созданного скота предусмотрел для Себя одну овцу.
  to: И из всех сотворённых птиц Ты нарёк Себе одну голубку, и из всех сотворённых животных предназначил Себе одну овцу.
  rationale: Исправлена неестественная передача providisti и сглажена русская конструкция при сохранении образности, параллелизма и различия между nominasti («нарёк») и providisti («предназначил»). Английская помета описывает прежний, смещённый на следующий стих вариант и не является вариантом исходного латинского текста данного стиха; в русском тексте для неё нет основания или якоря.
