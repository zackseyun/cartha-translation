- from: Оно изнемогало, пока не стало отказывать. И пришедший ангел, который говорил во мне[a], подхватил меня, укрепил и поставил на ноги.
  to: Оно изнемогало до изнеможения. И пришедший ангел, который говорил во мне[a], поддержал меня, укрепил и поставил на ноги.
  rationale: Заменено неестественное и семантически смещённое «стало отказывать» на «до изнеможения», передающее предел сил без называния субъекта. «Подхватил» заменено на более нейтральное «поддержал», ближе к tenuit в контексте укрепления и постановки на ноги. Неоднозначное «говорил во мне» и его сноска сохранены.
