translation:
  language: ru
  text: Оно изнемогало до изнеможения. И пришедший ангел, который говорил во мне[a], поддержал меня, укрепил и поставил на ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил во мне». Выражение необычно; возможный смысл — говорил изнутри меня. Некоторые переводы понимают его как «говорил со мной».'
    reason: Латинское in me необычно и допускает более одного понимания; примечание сохраняет эту неоднозначность.
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: изнемогало, пока не стало отказывать
  rationale: Передаёт нарастающее усилие или истощение вплоть до утраты сил, не добавляя отсутствующего в данном фрагменте названия субъекта.
- source_word: tenuit me
  choice: подхватил меня
  rationale: В контексте последующего укрепления и постановки на ноги латинское tenuit естественно означает, что ангел удержал или поддержал рассказчика.
- source_word: confortauit me
  choice: укрепил
  rationale: Кратко и точно передаёт восстановление сил.
- source_word: statuit me super pedes
  choice: поставил на ноги
  rationale: Естественная русская формулировка, сохраняющая телесный образ латинского текста.
theological_decisions:
- issue: Необычное выражение loquebatur in me
  choice: говорил во мне
  alternative: говорил со мной
  rationale: Сохранено прямое значение предлога in и возможная идея внутренней речи, без богословского сглаживания до более обычного «со мной».
- issue: Неуказанный субъект laborauit
  choice: Оно
  alternative: моя душа / моё сердце
  rationale: В представленном латинском отрывке субъект не назван; его конкретизация внесла бы толкование, которого нет в исходных данных.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Начальное «Оно» намеренно сохраняет неопределённость субъекта в предоставленном отрывке; выражение «стало отказывать» передаёт достижение предела сил.
