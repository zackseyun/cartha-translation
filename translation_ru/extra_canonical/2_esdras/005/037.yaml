  source_fidelity: 'Перевод в целом точно передаёт латинскую цепочку намеренно невозможных условий: оживление засохших цветов, открытие закрытых хранилищ, выпуск заключённых в них ветров и «образ голоса». «То бедствие» обоснованно передаёт анафорическое eum laborem в контексте 5:35, не создавая ложного значения физической работы. «О котором ты спрашиваешь» соответствует quem rogas без добавления отсутствующего в источнике «увидеть».'
