  text: reuirida mihi aridos flores, Et aperi mihi clausa prumptuaria et produc mihi inclusos in eis flatos, aut monstra mihi uocis imaginem, et tunc ostendam tibi eum laborem quem rogas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/037.yaml
  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: ru
  text: Сделай мне засохшие цветы вновь зелёными, открой запертые хранилища и выпусти заключённые в них ветры, или покажи мне образ голоса — тогда я покажу тебе то бедствие, о котором ты спрашиваешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuirida mihi aridos flores
  choice: Сделай для меня засохшие цветы вновь зелёными
  rationale: 'Передаёт необычный латинский образ буквально и понятно: предполагаемая форма reuirida означает возвращение засохшим цветам зелени или жизни.'
- source_word: prumptuaria
  choice: хранилища
  rationale: Соответствует латинскому обозначению кладовых или вместилищ и естественно сочетается с заключёнными в них ветрами.
- source_word: flatos
  choice: ветры
  rationale: В данном космологическом образе обозначает дуновения или ветры; «ветры» ясно и естественно по-русски.
- source_word: uocis imaginem
  choice: образ голоса
  rationale: Сохраняет намеренно парадоксальное сочетание источника, не подменяя его толкованием вроде «видимая форма звука».
- source_word: eum laborem
  choice: то бедствие
  rationale: Labor здесь анафорически отсылает к laborem Iacob в 5:35 и означает тяготу, бедствие или страдание, а не работу; «то» передаёт указательное eum.
- source_word: quem rogas
  choice: о котором ты спрашиваешь
  rationale: В контексте просьбы Ездры узнать о бедствии естественно передаёт смысл rogas без искусственного добавления «увидеть».
theological_decisions:
- issue: Значение laborem и его связь с «бедствием Иакова» в 5:35
  choice: то бедствие
  alternative: тот труд
  rationale: Контекст говорит о страдании или тяжком бедствии Иакова; буквальное «труд» в современном русском ошибочно наводило бы на мысль о работе, хотя богословская напряжённость высказывания при этом не требует дополнительного истолкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным синтаксисом. Сохранены цепочка невозможных требований и парадоксальный «образ голоса»; не добавлены отсутствующие в латинском пояснения.
