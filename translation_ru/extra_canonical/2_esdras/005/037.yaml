  terminology: '«Хранилища», «ветры» и намеренно парадоксальный «образ голоса» удачны. Специальных терминологических или конфессионально обусловленных решений не требуется. Сноска не нужна: в русском тексте нет сносочного маркера, а английская сноска относится к прежнему варианту английской формулировки.'
