lexical_decisions:
- source_word: quae parit
  choice: рожавшую женщину
  rationale: Латинское обобщающее выражение обозначает женщину, имеющую опыт родов; неопределённость сохранена без добавления определённого артикля.
- source_word: dicet tibi
  choice: она тебе ответит
  rationale: В данном контексте dicere означает дать ответ на поставленный вопрос; это естественно по-русски.
- source_word: Dices enim ei
  choice: Ведь ты спросишь её
  rationale: Хотя буквально dices — «скажешь», последующее quare вводит вопрос, поэтому по-русски естественно «спросишь»; enim передано как «ведь».
- source_word: quare
  choice: Почему…
  rationale: Сохранён начинающийся здесь и продолжающийся в следующем стихе вопрос; многоточие обозначает синтаксический обрыв на границе стиха.
