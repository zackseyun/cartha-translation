source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: ru
  text: 'И сказал я: «Как же ты сказал своему рабу, что разом оживишь творение, сотворённое тобой[a]? Если, стало быть, живые будут жить разом и творение выдержит, то оно может и теперь разом вместить всех присутствующих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «создание, сотворённое тобой». Здесь слово «творение», по-видимому, имеет собирательный смысл.'
    reason: Латинское creatura может обозначать отдельное создание, хотя множественное «живые» в следующей фразе поддерживает коллективное понимание.
lexical_decisions:
- source_word: a te creatam creaturam
  choice: сотворённое тобой творение
  rationale: Сохраняет однокоренной оборот оригинала и коллективный смысл creatura, который подтверждается последующим множественным uiuentes.
- source_word: in unum
  choice: разом / все … разом
  rationale: Передаёт значение совместности и одновременности; добавление «все» при uiuentes естественно выражает коллективный охват по-русски.
- source_word: sustinebit creatura
  choice: творение выдержит
  rationale: Сохраняет творение как подлежащее и не добавляет в текст прямо не названного дополнения.
- source_word: portare praesentes
  choice: вместить всех ныне живущих
  rationale: В контексте речь идёт о способности творения вместить существующее ныне поколение; «ныне живущих» естественно передаёт субстантивированное praesentes.
theological_decisions:
- issue: Коллективное или единичное значение creatura
  choice: творение как совокупность сотворённых живых существ
  alternative: отдельное сотворённое существо
  rationale: Множественное uiuentes в следующей фразе указывает на коллективный охват, однако формальная возможность единичного понимания отмечена в сноске.
- issue: Характер будущего оживления
  choice: сохранена формулировка об одновременном оживлении всех без дальнейшего истолкования
  alternative: уточнить как всеобщее воскресение определённого богословского типа
  rationale: Текст говорит об оживлении творения разом, но не раскрывает здесь всех догматических деталей.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Сохранены риторическая структура рассуждения и повтор «разом»; архаизмы и конфессионально окрашенные уточнения не вводятся. Заключительное Et dixit ad me: interroga matricem mulieris et относится к началу следующего стиха и в текст 5:45 не включено.'
