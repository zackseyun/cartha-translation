  source_fidelity: Латинское iniustitia передано точно как «неправедность», а multiplicabitur — как «умножится». Сравнительное super в обоих случаях сохранено. Однако hanc — женского рода и, по смыслу, отсылает к уже наличной «неправедности»; явное «той» лучше сохраняет эту связь, чем нейтральное «того, что».
