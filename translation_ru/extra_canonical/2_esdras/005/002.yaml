  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: ru
  text: И неправедность умножится сверх той, что ты сам видишь, и сверх той, о которой ты прежде слышал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  choice: неправедность
  rationale: Передаёт нравственно-религиозный смысл латинского существительного и сохраняет связь с библейской лексикой, оставаясь понятным современному читателю.
- source_word: multiplicabitur
  choice: умножится
  rationale: Сохраняет образ количественного возрастания и формально соответствует пассивной форме латинского глагола.
- source_word: super hanc ... et super quam
  choice: сверх того ... и сверх того
  rationale: 'Передаёт сравнительно-превосходящий смысл super: неправедность возрастёт за пределы уже виденного и услышанного.'
- source_word: ipse tu vides
  choice: ты сам видишь
  rationale: Сохраняет эмфатическое ipse tu без добавления отсутствующего в источнике слова «ныне».
- source_word: audisti olim
  choice: слышал прежде
  rationale: Естественно передаёт отнесённость olim к прошлому, не уточняя неопределённую временную дистанцию.
