  terminology: '«Век» уместно передаёт saeculum, не сужая его до одной лишь эпохи или мира. «Устроил» приемлемо для disposui. Явное «женщина» обоснованно: ea quae senuit имеет женский род, а parit задаёт контекст деторождения.'
