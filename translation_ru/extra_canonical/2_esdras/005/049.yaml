  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: ru
  text: '«Ведь как младенец не рождает детей и состарившаяся женщина уже не рожает, так Я устроил сотворённый Мною век». И я спросил: «Раз Ты уже дал мне возможность, я буду говорить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: infans
  choice: младенец
  rationale: Прямое соответствие латинскому слову; сохраняет образ ранней стадии жизни.
- source_word: parit
  choice: рождает / рожает
  rationale: Глагол означает рождение детей; во второй части сказуемое восстановлено из эллипсиса для ясного и естественного русского синтаксиса.
- source_word: ea quae senuit
  choice: состарившаяся женщина
  rationale: Женский род местоимения ea и значение parit подразумевают женщину; явное существительное необходимо для естественного русского текста.
- source_word: disposui
  choice: устроил
  rationale: Передаёт действие Бога по установлению порядка и хода сотворённого века, не сводя смысл лишь к приказу.
- source_word: saeculum
  choice: век
  rationale: Сохраняет временной и космологический диапазон латинского saeculum и связь с этапами жизни в сравнении.
- source_word: uiam
  choice: путь
  rationale: Сохраняет исходную метафору; по контексту это открытая возможность продолжить речь.
theological_decisions:
- issue: Божественное устроение сотворённого века
  choice: так Я устроил сотворённый Мною век
  alternative: так Я распорядился относительно созданного Мною мира
  rationale: Формулировка сохраняет утверждение о сотворении и установленном порядке, не уточняя сверх источника, означает ли saeculum время, эпоху или мир.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Эллиптическое латинское сказуемое во второй части сравнения раскрыто ради ясности; метафоры «век» и «путь» сохранены.
