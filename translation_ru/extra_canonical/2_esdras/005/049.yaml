  source_fidelity: В целом перевод точно передаёт сравнение, божественное устроение сотворённого века и последующий ответ говорящего. Однако латинское «dederis mihi uiam» здесь является устойчиво-образным выражением предоставленной возможности или дозволения говорить; «открыл мне путь» в русском звучит как иной, более пространственный образ.
