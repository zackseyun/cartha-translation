  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: ru
  text: И женщины будут рождать чудовищ, связанных с менструацией[a]. В пресных водах найдутся солёные воды, и все друзья пойдут войной друг на друга. Тогда скроется здравый смысл, и разум будет удалён в свою кладовую. Многие будут искать его, но не найдут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское выражение menstruata monstra неясно. Буквально оно связывает менструацию с «чудовищами», но текст не позволяет уверенно определить характер этой связи.
    reason: lexical_alternative
lexical_decisions:
- source_word: menstruata monstra
  choice: чудовищ во время месячных
  rationale: Латинское выражение неясно. Перевод сохраняет как идею чудовищных рождений, так и явное указание menstruata на менструацию, не уточняя без достаточных оснований характер связи между ними.
- source_word: dulcibus aquis salsae
  choice: в пресных водах обнаружится солёная вода
  rationale: В контексте воды dulcis означает «пресный», а не буквально «сладкий»; русская формулировка естественно передаёт противопоставление пресной и солёной воды.
- source_word: semetipsos expugnabunt
  choice: пойдут войной друг на друга
  rationale: Expugnare выражает вооружённое или ожесточённое нападение; выбран живой русский оборот, сохраняющий взаимность действия.
- source_word: sensus
  choice: здравый смысл
  rationale: Здесь sensus обозначает способность здраво судить и понимать, а не физическое чувство; такое решение также отличает его от следующего intellectus.
- source_word: intellectus ... in promptuarium suum
  choice: разум удалится в свою кладовую
  rationale: Сохранён образ разума, уходящего в место хранения; «кладовая» прямо и понятно передаёт promptuarium, не устраняя образность.
- source_word: Et queretur a multis et non inuenietur
  choice: Многие будут искать его, но не найдут
  rationale: Переведено полное сохранившееся предложение из предоставленного латинского текста; местоимение сохраняет некоторую неуточнённость предмета поисков.
theological_decisions:
- issue: Неясная связь менструации с чудовищными рождениями
  choice: Сохранить оба элемента без физиологического или символического толкования
  alternative: Перевести как «будут рождать чудовищ, покрытых менструальной кровью» либо опустить упоминание менструации
  rationale: Латинское menstruata monstra допускает неясность, а источник не даёт достаточных оснований ни для конкретизации образа, ни для устранения трудного элемента.
- issue: Предмет поисков в заключительной фразе
  choice: Оставить местоименную отсылку «его»
  alternative: Явно назвать «разум» или «здравый смысл»
  rationale: Латинское queretur имеет подразумеваемое подлежащее, и явное повторение одного из двух предшествующих понятий преждевременно сняло бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; необычный образ «кладовой» сохранён, а не заменён отвлечённым объяснением.
