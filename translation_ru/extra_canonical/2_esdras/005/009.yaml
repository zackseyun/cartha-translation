  naturalness: После правки текст остаётся современным литературным русским и сохраняет намеренно тревожную, пророческую образность оригинала. «В свою кладовую будет удалён» несколько необычно, но это оправдано сохранением образа promptuarium и пассивной формы исходного текста.
  terminology: «Пресные воды» и «солёные воды» точно передают контекстуальное противопоставление dulcis/salsus. Различение «здравый смысл» (sensus) и «разум» (intellectus) допустимо. Неясность menstruata monstra следует оставить в основном тексте и пояснить в сноске, не приписывая менструацию женщинам.
