  - severity: medium
    issue: Единственное число «солёная вода» вместо salsae.
    rationale: Латинское прилагательное стоит во множественном числе и эллиптически относится к aquae; естественный русский эквивалент — «солёные воды».
  - severity: medium
    issue: «Разум удалится» сглаживает пассивное separabitur.
    rationale: Исходник говорит, что intellectus будет отделён/удалён в своё хранилище, а не просто сам уйдёт.
