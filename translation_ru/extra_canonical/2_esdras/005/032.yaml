  yaml_path: translation/extra_canonical/2_esdras/005/032.yaml
  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: ru
  text: 'Ангел, приходивший ко мне прошлой ночью, был со мной[a] и сказал мне: «Слушай меня, и я наставлю тебя; внимай мне, и я добавлю ещё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я сказал: „Говори, господин мой“. Он сказал мне: „Ты слишком сильно тревожишься в мыслях об Израиле. Неужели ты любишь его больше, чем Тот, Кто его создал?“»'
    reason: Предыдущее прочтение, отражающее иную разбивку текста по стихам.
lexical_decisions:
- source_word: praeterita nocte
  choice: прошлой ночью
  rationale: Естественная современная передача указания на предшествующую ночь.
- source_word: audi me et instruam te
  choice: Слушай меня, и я наставлю тебя
  rationale: Сохраняет прямую форму повеления и обещание наставления.
- source_word: intende mihi
  choice: внимай мне
  rationale: Передаёт усиленный призыв сосредоточить внимание на словах ангела в достойном литературном регистре.
- source_word: adiciam
  choice: я добавлю ещё
  rationale: Сохраняет незавершённо-обобщённый характер латинского глагола без уточнения того, что именно будет добавлено.
theological_decisions:
- issue: Предмет глагола adiciam не назван
  choice: я добавлю ещё
  alternative: я скажу больше
  rationale: Выбран буквальный, но естественный вариант, сохраняющий неопределённость исходного текста и не вводящий подразумеваемый объект.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повтор «ко мне» в латинском сглажен ради естественности, а смысл est ... ad me передан как «был со мной».
