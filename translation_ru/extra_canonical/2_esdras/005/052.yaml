  text: 'quos peperisti nunc non sunt similes his qui ante sed minores statu ? Et dicet tibi et ipsa : alii sunt qui in iuuentute uirtutis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: ru
  text: 'Ибо ты скажешь ей: «Почему те, кого ты теперь родила, не похожи на тех, кто был прежде, а ростом меньше?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quos peperisti
  choice: те, кого ты родила
  rationale: Передаёт прямой смысл peperisti и сохраняет обращение к земле как к матери.
- source_word: his qui ante
  choice: прежних
  rationale: Естественная русская передача сравнительного указания на тех, кто был прежде.
- source_word: minores statu
  choice: меньше ростом
  rationale: Statu здесь обозначает телесный рост; формулировка ясна современному читателю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены риторический вопрос и материнская образность. В предоставленном латинском фрагменте после вопроса начинается следующая реплика («И она сама скажет тебе…»), которая синтаксически продолжается за пределами данного стиха и потому в основной текст не включена.
