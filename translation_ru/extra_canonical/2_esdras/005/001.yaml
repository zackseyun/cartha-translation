  source_fidelity: 'Основной смысл передан точно: de signis autem — тематический переход; ecce dies venient — пророческое возвещение; adprehendentur ... in excessu multo — состояние, охватывающее жителей земли; abscondetur — сокрытие пути истины. Сноска уместно сохраняет спорный оттенок excessus. Однако «бесплодной для веры» скорее значит «непригодной для веры», тогда как sterilis a fide означает отсутствие/оскудение веры в стране.'
