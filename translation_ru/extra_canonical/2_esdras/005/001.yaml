source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: ru
  text: 'А о знамениях: вот, наступят дни, когда живущие на земле будут охвачены великим ужасом[a], путь истины скроется, и земля оскудеет верой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великим смятением».'
    reason: Латинское in excessu multo допускает значение крайнего потрясения, смятения или панического ужаса.
lexical_decisions:
- source_word: de signis autem
  choice: А о знамениях
  rationale: Сохраняет тематический переход и значение латинского оборота без ненужного уточнения.
- source_word: ecce dies venient
  choice: вот, наступят дни
  rationale: «Вот» передаёт ecce, а естественный русский оборот «наступят дни» — пророческую формулу о грядущем.
- source_word: adprehendentur ... in excessu multo
  choice: будут охвачены великим ужасом
  rationale: Пассивное adprehendentur передано образом состояния, овладевающего людьми; excessus здесь, вероятно, отражает греческое ἔκστασις в апокалиптическом значении ужаса или паники, при сохранении иной возможности в сноске.
- source_word: abscondetur veritatis via
  choice: путь истины скроется
  rationale: Формально близкая и естественная передача пассивной конструкции и генитива.
- source_word: sterilis erit a fide regio
  choice: земля станет бесплодной для веры
  rationale: Сохраняет метафору бесплодия и смысл отсутствия веры; «земля» соответствует regio в данном контексте лучше, чем административное «область».
theological_decisions:
- issue: Характер состояния жителей земли
  choice: великий ужас
  alternative: великое смятение
  rationale: Апокалиптический контекст поддерживает значение сильного страха или паники, однако неоднозначность excessus/предполагаемого ἔκστασις отмечена в сноске.
- issue: Метафора бесплодия веры
  choice: земля станет бесплодной для веры
  alternative: в стране не будет веры
  rationale: Выбранная формулировка не сводит образ к простому отсутствию веры, а сохраняет напряжённую метафору латинского текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены образность, пассивные оттенки и неоднозначность ключевого выражения.
