  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: ru
  text: '…пред Тобой». И я сказал[a]: «Говори, господин мой». Он сказал мне: «Ты совершенно вне себя из-за Израиля; или ты полюбил его больше…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежнем варианте здесь ошибочно был приведён текст следующего стиха: «И я сказал: “Нет, господин, но я говорил в скорби, потому что внутренность моя мучит меня каждый час, когда я стараюсь постичь путь Всевышнего и исследовать часть Его суда”».'
    reason: previous_rendering
lexical_decisions:
- source_word: loquere
  choice: «Говори»
  rationale: Прямой и естественный русский эквивалент повелительной формы; в данном контексте это приглашение продолжить речь.
- source_word: dominus meus
  choice: «господин мой»
  rationale: Сохраняет уважительное обращение к собеседнику и не подменяет его обращением к Богу «Господь мой».
- source_word: ualde in excessu mentis factus es
  choice: «ты совершенно вне себя»
  rationale: Передаёт сильное обвинительное выражение о крайнем душевном состоянии, не сводя его лишь к печали или тревоге. Современный русский оборот естественнее буквального «вышел за пределы разума».
- source_word: in Israel
  choice: «из-за Израиля»
  rationale: В контексте обозначает причину или предмет крайнего душевного состояния Ездры; русский предлог «из-за» передаёт эту связь естественно.
- source_word: aut plus dilexisti
  choice: «или ты полюбил его больше…»
  rationale: Сохраняет незавершённый альтернативный вопрос и прошедшую форму латинского глагола. Местоимение «его», подразумеваемое английским консультационным слоем и дальнейшим контекстом, относится к Израилю.
theological_decisions:
- issue: Сила выражения excessu mentis
  choice: «совершенно вне себя»
  alternative: «пришёл в крайнее душевное смятение»
  rationale: Выбранный вариант сохраняет резкость латинского выражения и не истолковывает его как одну лишь скорбь, тревогу или мистический экстаз.
- issue: Референт подразумеваемого объекта после dilexisti
  choice: «его» — Израиль
  alternative: 'Оставить объект невыраженным: «или ты полюбил больше…»'
  rationale: По синтаксису и развитию вопроса речь идёт об Израиле; местоимение делает русский текст грамматически естественным, не снимая незавершённости фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены начальная и конечная незавершённость фрагмента, уважительное «господин мой» и резкость упрёка; архаизмы без необходимости не используются.
