source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'meum aut finem caritatis quam populo meo promisi. Et dixi: sed ecce, domine, tu praees his qui in fine sunt, et quid facient qui ante nos sunt aut nos aut hi qui post nos ? Et dixit ad'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/041.yaml
  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: ru
  text: 'И я сказал[a]: «Но вот, Господи, Ты стоишь во главе тех, кто живёт в конце времён. И что будут делать те, кто жил до нас, что будем делать мы сами и те, кто будет жить после нас?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможна иная разбивка фразы: «И я сказал: „Господи, Ты стоишь во главе тех, кто живёт в конце времён. Но что будут делать…“»'
    reason: previous_rendering
lexical_decisions:
- source_word: sed ecce
  choice: но вот
  rationale: Сохраняет как противопоставление sed, так и указательно-эмфатическое ecce, не сглаживая переход к возражению.
- source_word: praees
  choice: стоишь во главе
  rationale: Естественно передаёт значение «предводительствуешь, управляешь, начальствуешь над», не сужая его до простого наблюдения.
- source_word: his qui in fine sunt
  choice: тех, кто живёт в конце времён
  rationale: Выражает эсхатологический смысл in fine и по-русски ясно обозначает людей последнего времени; добавленное «живёт» естественно для обозначения поколения.
- source_word: quid facient
  choice: что будут делать
  rationale: Формально сохраняет вопрос о действии, не истолковывая его как вопрос об участи или спасении.
- source_word: qui ante nos sunt
  choice: те, кто жил до нас
  rationale: Русское прошедшее время естественно обозначает предшествующие поколения, тогда как буквальное «те, кто есть до нас» было бы неясно.
- source_word: aut nos aut hi qui post nos
  choice: что будем делать мы сами и те, кто будет жить после нас
  rationale: Повтор сказуемого устраняет русскую синтаксическую двусмысленность; aut в перечислении передано нейтральным «и», поскольку здесь перечисляются три группы, а не предлагается исключающий выбор.
theological_decisions:
- issue: Смысл вопроса quid facient
  choice: сохранён буквальный вопрос «что будут делать»
  alternative: истолковать как «что с ними будет» или «какова будет их участь»
  rationale: Латинский текст говорит facient, поэтому возможное эсхатологическое подразумевание не следует подменять явным толкованием.
- issue: Значение in fine
  choice: «в конце времён»
  alternative: «в конце» или «при конце»
  rationale: Контекст поколений до, ныне и после говорящего указывает на временной и, вероятно, эсхатологический конец; формулировка сохраняет этот смысл без уточнения конкретной доктрины.
- issue: Написание местоимения при обращении к Богу
  choice: «Ты» с прописной буквы
  alternative: «ты» со строчной буквы
  rationale: Прописная буква поддерживает принятый в русском библейском регистре уважительный стиль, не изменяя содержания исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого обращения к Богу. Синтаксис сделан ясным для обычного читателя, однако исходный вопрос о действиях разных поколений не истолкован как утверждение об их конечной участи.
