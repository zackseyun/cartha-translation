  yaml_path: translation/extra_canonical/2_esdras/005/034.yaml
  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: ru
  text: '«…его больше, чем того, кто его создал?» И я сказал: «Нет, господин, но я сказал это от скорби, ибо моё нутро[a] терзает меня каждый час, пока я пытаюсь постичь путь Всевышнего и исследовать часть Его суда». Он сказал мне: «Ты не можешь». И я сказал: «Почему, господин? Или зачем я родился? Или почему утроба моей матери не стала мне могилой, чтобы я не увидел бедствия Иакова?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «мои почки»; в древней образной речи — внутреннее существо человека, средоточие его глубоких переживаний.
    reason: Поясняет буквальный образ renes, который при дословной передаче в современном русском мог бы быть ошибочно понят как указание только на физический орган.
lexical_decisions:
- source_word: dolens
  choice: от скорби
  rationale: Передаёт состояние глубокой душевной боли, из которого говорит Ездра, не добавляя идеи физической боли.
- source_word: renes mei
  choice: всё моё нутро
  rationale: Латинское «почки мои» обозначает внутреннее существо и средоточие переживаний; буквальный русский вариант здесь был бы непонятен без пояснения.
- source_word: per omnem horam
  choice: каждый час
  rationale: Сохраняет образ постоянного, ежечасного мучения близко к латинской формулировке.
- source_word: adprehendere semitam
  choice: постичь путь
  rationale: Естественно по-русски передаёт стремление мысленно охватить и понять путь Всевышнего.
- source_word: inuestigare partem iudicii eius
  choice: исследовать хотя бы часть Его суда
  rationale: Сохраняет ограниченность человеческого поиска («часть») и многозначность iudicium как суда, судебного решения или правосудия; «хотя бы» естественно выражает подразумеваемую ограниченность, не снимая напряжения.
- source_word: laborem Iacob
  choice: бедствия Иакова
  rationale: В контексте lamentation labor означает тяжесть, страдание или бедствие, а не только труд; множественное число естественно обозначает совокупность страданий народа Иакова.
theological_decisions:
- issue: Значение iudicium применительно к Всевышнему
  choice: Его суда
  alternative: Его правосудия / Его решения
  rationale: «Суд» сохраняет широту латинского слова и не сводит вопрос Ездры исключительно к справедливости Бога либо к одному конкретному решению.
- issue: Референт имени «Иаков»
  choice: Иаков
  alternative: народ Иакова / Израиль
  rationale: Сохранено исходное имя без поясняющей подстановки, чтобы не устранять метонимическую многозначность текста.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной библейской окраской. Начальное многоточие показывает, что предоставленный текст начинается в середине реплики. Обращение domine передано как «господин», поскольку Ездра обращается к ангельскому собеседнику; прописная буква не использована, чтобы не отождествлять его с Богом.
