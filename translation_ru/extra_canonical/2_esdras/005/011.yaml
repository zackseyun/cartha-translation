  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: ru
  text: 'Несправедливость и невоздержанность умножатся на земле. И одна область спросит соседнюю: «Прошла ли через тебя праведность?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается на словах «через тебя»; окончание вопроса передано по засвидетельствованному продолжению текста.
    reason: Читателю сообщается о текстологической неполноте непосредственно предоставленной латинской строки и об основании восстановления.
lexical_decisions:
- source_word: iniustitia
  choice: беззаконие
  rationale: Передаёт общественно-нравственную неправедность естественным и библейски уместным русским словом, не сужая значение до юридической несправедливости.
- source_word: incontinentia
  choice: невоздержанность
  rationale: Сохраняет значение отсутствия самообладания; слово уместно для возвышенного, но понятного библейского регистра.
- source_word: multiplicabitur
  choice: умножатся
  rationale: Латинская форма стоит в единственном числе при двух согласованных понятиях, однако по-русски составное подлежащее естественно требует множественного числа.
- source_word: regio proximam suam
  choice: одна область … соседнюю
  rationale: Regio обозначает область или край; эллиптическое «соседнюю» естественно подразумевает соседнюю область и воспроизводит персонификацию.
- source_word: numquid per te
  choice: Проходила ли через тебя праведность?
  rationale: В предоставленном латинском отрывке вопрос обрывается после «через тебя»; восстановление сказуемого и предмета вопроса следует засвидетельствованному продолжению, отражённому в сверочном английском тексте.
theological_decisions:
- issue: Смысл слова «праведность» в вопросе
  choice: Оставить без поясняющей вставки
  alternative: «праведность, которая делает человека праведным»
  rationale: Пояснение отсутствует в предоставленном латинском тексте и неоправданно разрешало бы возможную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм, персонификация областей и неразъяснённый образ проходящей праведности.
