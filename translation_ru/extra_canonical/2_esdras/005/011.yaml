  source_fidelity: 'Первое понятие iniustitia точнее передать как «несправедливость»: «беззаконие» возможно в библейском регистре, но заметно смещает смысл к нарушению закона. Для засвидетельствованного продолжения transivit естественнее совершенный вид «прошла ли», чем «проходила ли». Остальная структура точно передаёт латинский текст, включая персонификацию областей и образ праведности, проходящей через область.'
