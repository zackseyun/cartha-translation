  source_fidelity: «Утробе, носящей души» добавляет к краткому генитивному образу animarum matrici развёрнутое значение («которая носит души»), которого латинский текст прямо не выражает. Лучше сохранить образ «утробы душ» без такого пояснения. «Мук родов» удачно передаёт в данном контексте necessitatem partus как тягостность/страдание родов, а не отвлечённую необходимость.
