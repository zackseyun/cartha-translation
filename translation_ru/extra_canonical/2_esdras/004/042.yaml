  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: ru
  text: Они уподоблены утробе душ. Ибо как роженица спешит освободиться от мук родов, так и они…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: animarum matrici
  choice: утробе, носящей души
  rationale: Передаёт образ вместилища и рождения душ естественнее по-русски, чем буквальное и двусмысленное «матери душ».
- source_word: adsimilata sunt
  choice: они уподоблены
  rationale: Формально сохраняет пассивное сравнение и связь с предшествующим контекстом.
- source_word: quae parit
  choice: роженица
  rationale: Естественное современное обозначение женщины, которая рожает, без лишнего развертывания.
- source_word: necessitatem partus
  choice: мук родов
  rationale: В контексте родов necessitas обозначает тяготу, мучительность и неизбежное давление процесса, а не отвлечённую логическую необходимость.
- source_word: sic et haec
  choice: так и они
  rationale: Сохраняет незавершённость данного латинского фрагмента; средний род множественного числа передан местоимением, отсылающим к ранее названным реалиям.
theological_decisions:
- issue: Образ «утробы душ»
  choice: утробе, носящей души
  alternative: утробе душ
  rationale: Сохранён образ рождения и вместилища душ без догматического уточнения того, что именно обозначает эта утроба.
- issue: Незавершённость стиха в предоставленном источнике
  choice: так и они…
  alternative: дополнить продолжением по иной текстовой форме
  rationale: Дополнительный материал отсутствует в предоставленном латинском отрывке, поэтому он не вносится; многоточие честно показывает синтаксическую незавершённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис близок к латинскому, но образ «animarum matrix» слегка раскрыт ради ясности. Архаизм «чрево» не использован; «роженица» обеспечивает естественную и сжатую формулировку.
