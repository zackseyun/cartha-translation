  text: 'archangelus et dixit: quando impletus fuerit numerus similium uobis, quoniam in statera ponderauit saeculum, Et mensura'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/036.yaml
  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: ru
  text: 'И архангел ответил и сказал: «Когда исполнится число подобных вам, ибо Он взвесил век на весах, и мера…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: archangelus
  choice: архангел
  rationale: Прямой и естественный эквивалент латинского обозначения; имя в данном источнике отсутствует и потому не добавляется.
- source_word: impletus fuerit numerus
  choice: исполнится число
  rationale: Сохраняет библейскую формулу завершения установленного числа и значение латинского perfect passive subjunctive в придаточном времени.
- source_word: similium uobis
  choice: подобных вам
  rationale: Формально передаёт сравнительную конструкцию и сохраняет её некоторую неопределённость.
- source_word: saeculum
  choice: век
  rationale: Передаёт eschatological-temporal смысл saeculum, не сужая его до «мира» или конкретного исторического периода.
- source_word: in statera ponderauit
  choice: взвесил … на весах
  rationale: Сохраняет образ измерения и порядок смысловых компонентов латинского текста.
- source_word: Et mensura
  choice: и измерил…
  rationale: Фрагмент обрывается на начале следующей конструкции; глагольная передача естественна по-русски, а многоточие отмечает незавершённость исходного отрывка.
theological_decisions:
- issue: Субъект глагола ponderauit
  choice: Он
  alternative: Бог
  rationale: Латинский текст не называет субъекта существительным. Местоимение сохраняет подразумеваемого божественного деятеля без внесения отсутствующего слова.
- issue: Имя архангела
  choice: не добавлять имя
  alternative: архангел Иеремиил
  rationale: В предоставленном латинском источнике стоит только archangelus; добавление имени было бы текстологически необоснованным.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранена незавершённость предоставленного латинского фрагмента; архаические формы и конфессионально окрашенные добавления исключены.
