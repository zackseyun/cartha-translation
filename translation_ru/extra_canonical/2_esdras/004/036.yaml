    issue: «Et mensura» передано как «и измерил…».
    rationale: Mensura — существительное «мера»; в предоставленном тексте отсутствует глагол, соответствующий «измерил». Перевод должен сохранить оборванную именную конструкцию.
  revised_text: 'И архангел ответил и сказал: «Когда исполнится число подобных вам, ибо Он взвесил век на весах, и мера…»'
  revised_footnotes: []
