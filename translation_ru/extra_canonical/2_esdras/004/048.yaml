  text: I will show you the interpretation of the likeness. And I stood and saw, and behold, a blazing furnace passed before me, and it happened when
translation:
  language: ru
  text: '«Я покажу тебе истолкование образа». И я встал и увидел: вот, пылающая печь прошла передо мной; и случилось, когда…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstrabo
  choice: покажу
  rationale: Прямо передаёт обещание раскрыть значение увиденного.
- source_word: interpretationem similitudinis
  choice: истолкование этого образа
  rationale: «Истолкование» соответствует interpretationem, а «образ» естественно передаёт similitudo в контексте видения.
- source_word: fornax ardens
  choice: пылающая печь
  rationale: Сохраняет конкретный образ раскалённой, горящей печи без добавочного толкования.
- source_word: transiit coram me
  choice: прошла передо мной
  rationale: Близко воспроизводит пространственное движение латинского текста.
- source_word: factum est cum
  choice: и когда…
  rationale: Передаёт незавершённость исходного фрагмента естественной русской синтаксической конструкцией; многоточие показывает обрыв стиха.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Указательное «этого» делает сочетание естественным по-русски и связывает истолкование с ранее упомянутым образом. Незавершённая конечная конструкция сохранена, а не восполнена по последующему стиху.
