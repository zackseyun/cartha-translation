  rationale: 'Исправлены два безопасных пункта: «научу» точнее передаёт латинское doceam, а альтернатива в сноске приведена к нормативному русскому управлению и к множественной отсылке de quibus. Неоднозначность renuntiare сохранена в сноске; смысловой объём cor malignum не расширен.'
