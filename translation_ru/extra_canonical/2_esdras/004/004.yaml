source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: ru
  text: Если ты сообщишь мне об одном из них[a], то и я покажу тебе путь, который ты желаешь увидеть, и научу тебя, почему сердце зло».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если ты объяснишь мне об одном из них».'
    reason: Глагол renuntiare здесь может обозначать не только сообщение ответа, но и изложение или объяснение одного из предложенных трудных вопросов.
lexical_decisions:
- source_word: renunciaueris
  choice: сообщишь
  rationale: Латинский глагол означает «сообщить, объявить, изложить»; форма будущего совершённого в условной конструкции естественно передаётся русским совершенным будущим без добавления значения возможности.
- source_word: uiam
  choice: путь
  rationale: Прямое и естественное соответствие латинскому существительному, сохраняющее возможный как буквальный, так и образный смысл.
- source_word: cor malignum
  choice: сердце зло
  rationale: Сохраняет краткую именную конструкцию источника и утверждение о качестве сердца, не превращая её в экзистенциальное «существует злое сердце».
theological_decisions:
- issue: Причина зла сердца
  choice: почему сердце зло
  alternative: почему существует злое сердце
  rationale: Источник quare cor malignum эллиптичен; выбранное чтение соответствует ближайшему синтаксическому восполнению («почему сердце является злым») и не добавляет онтологического утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; синтаксический параллелизм «то и я… и объясню» сохранён. Местоименное «об одном из них» соотносится с ранее перечисленными вопросами.
