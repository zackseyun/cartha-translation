source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: ru
  text: 'Ведь я не хотел спрашивать о высших путях[a], а о том, что каждый день происходит с нами: почему Израиль отдан на поругание народам, почему народ, который Ты возлюбил, отдан нечестивым племенам и почему закон наших отцов сведён на нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о путях, лежащих выше».'
    reason: Латинское superioribus допускает пространственное значение; сноска сохраняет эту возможность, не смешивая его со следующим оборотом pertranseunt per nos.
lexical_decisions:
- source_word: superioribus uiis
  choice: о путях горних
  rationale: Сохраняет пространственный и возвышенный оттенок латинского superioribus и естественно передаёт противопоставление земным повседневным бедствиям; неоднозначность отмечена в сноске.
- source_word: quae pertranseunt per nos cotidie
  choice: о том, что каждый день происходит с нами
  rationale: Передаёт вероятный семитический оборот со значением переживаемых событий и бедствий, не создавая ложного образа физического прохождения над людьми или мимо них.
- source_word: in obprobrium gentibus
  choice: на поругание народам
  rationale: Достоинная и понятная библейская формулировка, передающая публичный позор и унижение Израиля среди народов.
- source_word: tribubus impiis
  choice: нечестивым племенам
  rationale: «Нечестивым» передаёт impiis без сужения до ритуальной или конфессиональной характеристики; «племенам» соответствует tribubus.
- source_word: in inritum deducta
  choice: обращён в ничто
  rationale: Выражает утрату силы и действенности закона, не утверждая его формальной отмены.
theological_decisions:
- issue: Причина унижения Израиля и кажущегося бессилия закона
  choice: Сохранён вопросительный протест говорящего без богословского объяснения причин.
  alternative: Добавить, что бедствия являются наказанием Бога за грех.
  rationale: Латинский текст задаёт вопросы и не формулирует здесь ответа; введение причины устранило бы намеренное напряжение.
- issue: Статус закона отцов
  choice: «обращён в ничто» — описание переживаемого положения закона.
  alternative: «отменён» или «упразднён».
  rationale: Такие варианты могли бы привнести утверждение о богословской отмене закона, которого in inritum deducta не требует.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Прописная «Ты» обозначает обращение к Богу. Синтаксический параллелизм трёх вопросов сохранён для ясности и риторической силы.
