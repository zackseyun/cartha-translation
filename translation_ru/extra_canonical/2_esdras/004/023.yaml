revisions:
- from: 'Ведь я хотел спросить не о путях горних[a], а о том, что каждый день происходит с нами: почему Израиль отдан на поругание народам, почему народ, который Ты возлюбил, отдан нечестивым племенам и почему закон наших отцов обращён в ничто.'
  to: 'Ведь я не хотел спрашивать о высших путях[a], а о том, что каждый день происходит с нами: почему Израиль отдан на поругание народам, почему народ, который Ты возлюбил, отдан нечестивым племенам и почему закон наших отцов сведён на нет.'
