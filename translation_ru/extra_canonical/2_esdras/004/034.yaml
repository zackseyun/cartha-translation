source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: ru
  text: 'Он ответил мне и сказал: «Ты не спешишь больше, чем Всевышний: ведь ты спешишь ради самого себя, а Всевышний — ради многих. Разве не об этом спрашивали души праведников в своих хранилищах?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinas
  choice: спешишь
  rationale: Передаёт активную форму латинского глагола и сохраняет повтор, существенный для противопоставления Ездры и Всевышнего.
- source_word: altissimum / excelsus
  choice: Всевышнего / Всевышний
  rationale: Оба латинских обозначения в данном контексте относятся к Богу; единый русский эквивалент звучит естественно и сохраняет титул.
- source_word: propter temetipsum
  choice: ради самого себя
  rationale: Передаёт усиленное возвратное местоимение temetipsum и личную направленность поспешности Ездры.
- source_word: pro multis
  choice: ради многих
  rationale: Сохраняет краткость и намеренный эллипсис источника, не добавляя отсутствующего глагола или предмета Божьего действия.
- source_word: in promptuariis
  choice: в своих хранилищах
  rationale: Буквально передаёт образ promptuaria как хранилищ; местоимение «своих» естественно связывает их с душами праведников, не уточняя природу этих мест сверх текста.
theological_decisions:
- issue: 'Форма первой реплики: утверждение или вопрос'
  choice: 'Утверждение: «Ты не спешишь больше Всевышнего»'
  alternative: 'Вопрос: «Неужели ты спешишь больше Всевышнего?»'
  rationale: Латинское non festinas tu грамматически представляет отрицательное утверждение, тогда как последующий вопрос явно отмечен Nonne; поэтому различие форм следует сохранить.
- issue: Эллипсис в «а Всевышний — ради многих»
  choice: Сохранить эллиптическую конструкцию
  alternative: 'Раскрыть смысл: «а Всевышний спешит ради многих»'
  rationale: Источник опускает глагол после excelsus. Русское тире позволяет сохранить напряжённую краткость и не определять точнее, что именно подразумевается.
- issue: Образ местопребывания душ праведников
  choice: «в своих хранилищах»
  alternative: «в своих обителях» или «в покоях»
  rationale: Более буквальное «хранилищах» сохраняет характерный апокалиптический образ и не подменяет его богословски более привычным термином.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксический повтор сохранён, а эллипсис оформлен тире. Термин «хранилища» намеренно оставлен образным и несколько необычным, как в латинском источнике.
