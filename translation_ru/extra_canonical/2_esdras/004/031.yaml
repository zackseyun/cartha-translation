lexical_decisions:
- source_word: seminis
  choice: семя
  rationale: Латинское seminis — родительный падеж от semen («семя»); в русском естественная конструкция требует именительного падежа как подлежащего при «принесло».
- source_word: quantum fructum
  choice: сколько плода
  rationale: Передаёт количественную конструкцию с quantum и сохраняет образ плода.
- source_word: impietatis
  choice: нечестия
  rationale: «Нечестие» передаёт impietas как отсутствие благочестия и противление Богу, не сужая смысл до отдельного нравственного порока.
- source_word: generauerit
  choice: принесло
  rationale: В сочетании с образом семени и плода естественное русское «принесло» передаёт результат произведения/порождения плода.
- source_word: Quando
  choice: Когда
  rationale: Сохранено как начало следующего предложения или придаточной части, поскольку данный фрагмент источника обрывается на этом слове.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; образ семени и плода сохранён. «Же» естественно выражает побудительно-связочный оттенок обращения. Незавершённое «Когда» намеренно оставлено в конце в соответствии с границей предоставленного исходного фрагмента.
