  yaml_path: translation/extra_canonical/2_esdras/004/025.yaml
  text: to obtain mercy. But what will he do for his name[a], which
translation:
  language: ru
  text: обрести милость. Но что он сделает ради своего имени[a], которое
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в стихе 26.
    reason: Латинский текст данного стиха заканчивается относительным местоимением quod («которое»); слова, завершающие мысль, относятся к следующему стиху.
lexical_decisions:
- source_word: misericordiam consequi
  choice: обрести милость
  rationale: Передаёт значение «достичь, получить милость» естественным и dignified русским выражением.
- source_word: quid faciet nomini suo
  choice: что он сделает ради своего имени
  rationale: Дательный nomini suo выражает интерес или пользу; «ради своего имени» естественно передаёт смысл заботы о собственном имени, не устраняя богословской напряжённости.
- source_word: quod
  choice: которое
  rationale: Сохраняет относительное местоимение и намеренно незавершённую на границе стиха конструкцию; его антецедент — средний род nomen («имя»).
theological_decisions:
- issue: Референт местоимения в выражении Sed quid faciet
  choice: он
  alternative: Он
  rationale: Латинская форма сама по себе не требует типографического почтительного написания с прописной буквы; строчная буква сохраняет нейтральность перевода.
- issue: Смысл действия по отношению к Божьему имени
  choice: ради своего имени
  alternative: для своего имени
  rationale: «Ради» яснее выражает заинтересованность субъекта в имени, но не уточняет, какое именно действие будет совершено; продолжение остаётся открытым, как в источнике.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и синтаксической незавершённости исходного текста на границе стихов.
