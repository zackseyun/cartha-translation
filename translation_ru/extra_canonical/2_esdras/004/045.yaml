  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: ru
  text: '«Если это возможно и если я способен, покажи мне и это: предстоит ли прийти больше, чем уже прошло, или же больше прошло над нами[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «нами» в латинском тексте стоит в начале следующего стиха, но по смыслу завершает выражение «прошло над нами».
    reason: verse_boundary
lexical_decisions:
- source_word: possibile est
  choice: «если это возможно»
  rationale: По контексту передано как условная просьба; буквальное «это возможно» перед союзом et и вторым условием по-русски звучало бы несвязно.
- source_word: idoneus sum
  choice: «я достоин»
  rationale: Idoneus может означать «подходящий, способный, достойный»; в просьбе о получении откровения «достоин» естественно передаёт пригодность говорящего, не уточняя её основание.
- source_word: si plus quam praeteriit habet uenire
  choice: «больше ли того, чему предстоит прийти, чем того, что уже прошло»
  rationale: Сохраняется сопоставление будущего и прошедшего; habet venire передано естественным русским оборотом «предстоит прийти».
- source_word: plura pertransierunt super [nos]
  choice: «больше прошло над нами»
  rationale: Сохранён необычный исходный образ прохождения времени «над нами», а не подставлено симметричное толкование «прошло, чем предстоит прийти».
theological_decisions:
- issue: Условие пригодности говорящего к откровению
  choice: «если я достоин»
  alternative: «если я способен это понять»
  rationale: Латинское idoneus не называет конкретно способность понимания; перевод не должен сужать смысл.
- issue: Смысл заключительного сравнения
  choice: сохранить образ «прошло над нами»
  alternative: «или больше прошло, чем предстоит прийти»
  rationale: Симметричная альтернатива понятнее логически, но отсутствует в сохранившейся латинской формулировке и устраняет семитизированный образ.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной просьбы. Синтаксис слегка приподнят, но понятен; необычное «прошло над нами» намеренно сохранено и пояснено сноской.
