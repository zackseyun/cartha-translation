base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/052.yaml
  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: ru
  text: Ты настойчиво спрашиваешь; я могу ответить тебе лишь отчасти[a], но я не был послан, чтобы говорить тебе о твоей жизни, и этого я не знаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ответ Уриила намеренно остаётся неполным: он может открыть лишь часть, но не срок жизни Ездры. Этот отказ отражает одну из тем книги — человеку доступно лишь ограниченное знание о Божьих сроках.'
    reason: compositional_layer
lexical_decisions:
- source_word: perrogas
  choice: Ты настойчиво спрашиваешь
  rationale: Глагол передаёт не просто единичный вопрос, а настойчивое, повторное расспрашивание.
- source_word: ex parte
  choice: отчасти
  rationale: Кратко и точно сохраняет ограниченный объём доступного ответа.
- source_word: de vita autem tua
  choice: но о твоей жизни
  rationale: Сохраняет противопоставление и намеренно широкое значение vita, которое в контексте может относиться к продолжительности жизни, но не сводится к ней прямо в основном тексте.
- source_word: non sum missus dicere tibi
  choice: я не послан тебе говорить
  rationale: Формально передаёт мотив ограниченного поручения небесного вестника, не уточняя подразумеваемого отправителя.
- source_word: sed nescio
  choice: и не знаю
  rationale: В русском соединение «и» естественно передаёт добавочное признание незнания после уже выраженного противопоставления с помощью «но».
theological_decisions:
- issue: Пределы откровения о личной судьбе Ездры
  choice: Сохранено различие между частичным знанием, которое можно сообщить, и отсутствием поручения и знания относительно его жизни.
  alternative: Уточнить, что речь именно о сроке жизни Ездры или о знамениях последних времён.
  rationale: Латинский текст не называет ни знамений, ни продолжительности жизни прямо; такое уточнение сняло бы заложенную в формулировке неоднозначность.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует непосредственному диалогу. Синтаксис сохраняет сжатость и напряжение латинского текста без добавления отсутствующих в источнике вводных слов.
