lexical_decisions:
- source_word: Si enim
  choice: Итак, если бы
  rationale: «Итак» передаёт выводное значение enim в продолжающемся рассуждении, а условная конструкция сохраняется без смыслового дополнения.
- source_word: eras iudex
  choice: ты был судьёй
  rationale: Прямое и естественное соответствие латинскому обороту; форма сослагательного наклонения по-русски выражена частицей «бы».
- source_word: horum
  choice: над ними
  rationale: В сочетании с «судьёй» русское управление «над ними» естественно передаёт родительный множественного числа horum, чей референт определяется контекстом.
