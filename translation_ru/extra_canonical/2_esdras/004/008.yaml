  source_fidelity: Латинское abyssum точно передано как «бездна», а caelis — естественно как «небеса». Однако infernum в данном космологическом перечислении обозначает нижний/подземный мир; «царство мёртвых» несколько конкретизирует исходное слово, добавляя образ «царства», которого в латинском тексте нет. Imperfect Dicebas fortassis естественно передаётся русским условным оборотом «ты, возможно, сказал бы мне».
  naturalness: Фраза в целом литературна и сохраняет параллелизм. «Подземный мир» — современное естественное обозначение, более нейтральное в данном контексте, чем «царство мёртвых». Порядок «Ты, возможно, сказал бы мне» чуть яснее передаёт вводное fortassis.
  terminology: «Бездна» и «небеса» уместны. Для infernum предпочтительно «подземный мир»; вариант «преисподняя» следует оставить в сноске как традиционную, но потенциально более нагруженную передачу. Не следует вводить «Аид» на основании английской редакционной истории, поскольку в представленном латинском источнике стоит infernum.
