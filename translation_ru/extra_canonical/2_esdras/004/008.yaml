  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: ru
  text: 'Ты, возможно, сказал бы мне: «Я не спускался в бездну, ещё не сходил в подземный мир[a] и никогда не восходил на небеса».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в преисподнюю».'
    reason: Латинское infernum допускает традиционную передачу «преисподняя»; основной текст сохраняет более нейтральный космологический смысл.
lexical_decisions:
- source_word: Dicebas fortassis mihi
  choice: Возможно, ты сказал бы мне
  rationale: Передаёт предположительный характер fortassis и обращённую к собеседнику условную формулировку без утяжеления русского синтаксиса.
- source_word: abyssum
  choice: бездна
  rationale: Прямое и естественное соответствие латинскому слову; сохраняет отличие от следующего infernum.
- source_word: infernum
  choice: царство мёртвых
  rationale: Передаёт подземный мир умерших без автоматического отождествления с местом вечного наказания и без греко-мифологических ассоциаций слова «Аид».
- source_word: caelis
  choice: небеса
  rationale: Форма множественного числа естественно соответствует латинскому caelis и сохраняет возвышенный библейский регистр.
theological_decisions:
- issue: Значение infernum
  choice: царство мёртвых
  alternative: преисподняя / ад
  rationale: Контекст перечисляет недоступные области мироздания — бездну, мир умерших и небеса. «Царство мёртвых» сохраняет эту космологическую мысль и не вносит более узкого учения о месте наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм трёх областей сохранён; повтор глагола «спускаться/сходить» делает направление движения явным и естественным по-русски.
