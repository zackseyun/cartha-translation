  source_fidelity: 'Основной смысл передан точно: призыв выступить против леса, приобрести себе другую область и тщетность этого замысла из-за огня. Однако «замысел против леса» чрезмерно истолковывает латинское cogitatus siluae. Как показывает английский аудиторский слой, конструкция лучше передаётся нейтрально: «замысел относительно леса».'
  naturalness: Текст в целом звучит естественно и сохраняет умеренно возвышенный библейский регистр. «Пожрал его» уместно для огня, хотя «уничтожил его» было бы нейтральнее; исправление не требуется.
  terminology: «Покорим», «лес на равнине», «приобрести себе ещё одну область» и «тщетным» приемлемы. Нейтральная связь «замысел относительно леса» сохраняет синтаксическую неоднозначность оригинала и не приписывает замыслу направленность, выраженную лишь контекстуально.
