  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: ru
  text: 'и сказали: «Пойдём, поднимемся и покорим лес на равнине, чтобы и там приобрести себе ещё одну область». Но замысел относительно леса оказался тщетным, потому что пришёл огонь и пожрал его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uenite ascendentes
  choice: Пойдём, поднимемся
  rationale: Передаёт и побуждение uenite, и движение вверх в причастии ascendentes, сохраняя образность латинского текста.
- source_word: debellemus
  choice: покорим
  rationale: Глагол означает одолеть или подчинить силой; «покорим» естественно сочетается с олицетворённым лесом.
- source_word: siluam campi
  choice: лес на равнине
  rationale: Передаёт родительное campi как указание на местность, не устраняя возможной образной напряжённости.
- source_word: consum[memus] nobismetipsis aliam regionem
  choice: приобрести себе ещё одну область
  rationale: В данном контексте consumere имеет смысл завладеть или присвоить; «приобрести себе» естественно выражает также усиленное nobismetipsis.
- source_word: cogitatus siluae
  choice: замысел против леса
  rationale: Контекст показывает, что это замысел, направленный на покорение леса; формулировка избегает двусмысленного впечатления, будто замысел принадлежал лесу.
- source_word: in uano
  choice: оказался тщетным
  rationale: Естественная русская передача значения неудачи и бесплодности замысла.
- source_word: consumpsit
  choice: пожрал
  rationale: Библейски выразительный и понятный глагол для уничтожающего действия огня; объект восстановлен по продолжению текста и подтверждается английским консультационным слоем.
