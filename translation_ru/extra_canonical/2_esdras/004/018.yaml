- source_word: incipiebas iustificare
  choice: начал бы ты оправдывать
  rationale: Передаёт инцептивное значение incipiebas и условный оттенок контекста, не сводя оборот к простому «оправдал бы».
- source_word: quem condemnare
  choice: кого осуждать
  rationale: Латинское quem — вопросительное местоимение мужского рода в винительном падеже; «кого» сохраняет олицетворение моря и леса в контексте.
- source_word: Et respondi et
  choice: И я ответил и
  rationale: Сохраняет незавершённость предоставленного латинского фрагмента, который оканчивается союзом et.
