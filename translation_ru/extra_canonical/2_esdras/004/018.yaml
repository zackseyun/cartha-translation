  source_fidelity: Текст точно передаёт латинское incipiebas iustificare как инцептивное «начал бы ты оправдывать» и сохраняет условно-риторическую форму вопроса. «Кого осуждать?» корректно отражает quem condemnare; местоимение уместно поддерживает предшествующее олицетворение. Конечное «И я ответил и» намеренно и точно сохраняет обрыв источника на et.
  naturalness: Фраза несколько намеренно неполна и синтаксически напряжённа, но это обусловлено тем, что передан фрагмент середины риторического вопроса и конец обрывается в исходном тексте. Для современного литературного русского «начал бы ты оправдывать или кого осуждать?» приемлемо и не требует сглаживания, которое могло бы изменить структуру источника.
  terminology: «Оправдывать» и «осуждать» — точные, нейтральные в данном контексте соответствия iustificare и condemnare. Неоправданных конфессиональных оттенков не добавлено.
