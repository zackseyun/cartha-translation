revisions:
- from: потому что век этот стремительно спешит пройти. Ведь он не может вместить то, что в назначенные времена обещано праведным, потому что этот век полон скорбей и немощей.
  to: Потому что этот век поспешно стремится пройти. Ведь он не сможет нести того, что было обещано в должные времена, потому что этот век полон скорби и немощей.
  rationale: 'Исправлен главный грамматический сбой: из перевода удалено слово «праведным», отсутствующее в латинском источнике. «В должные времена» передаёт in temporibus iustis, не снимая возможной широты iustis («правильные», «надлежащие»). «Не сможет нести» возвращает образ portare, а единственное число «скорби» следует числу mesticia. Повтор «этот век» сохранён, как в оригинале.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:31:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Существенная поправка необходима: в латинском тексте iustis согласуется с temporibus (abl. pl.) в выражении in temporibus iustis — «в надлежащие/должные времена». Слово «праведным» в черновике не имеет соответствия в данном латинском предложении и вводит получателей обещания, которых источник здесь не называет. Capiet portare буквально выражает способность «нести», а не «вместить».'
  naturalness: «Стремительно спешит пройти» передаёт усиление festinans festinat, но звучит несколько тяжеловесно. «Поспешно стремится пройти» сохраняет намеренно усиленное выражение и остаётся литературно естественным. «Не сможет нести» ясно отражает образ оригинала; «скорби и немощи» соответствует возвышенному, но современно понятному библейскому регистру.
  terminology: «Век» удачно передаёт saeculum и сохраняет временно-эсхатологическую неоднозначность. «Должные времена» передаёт iusta tempora без внесения толкования о праведниках или специально «назначенных» сроках. «Скорбь» и «немощи» подходят для mesticia и infirmitates.
  issues:
  - severity: high
    issue: Добавлены не названные в источнике «праведные».
    rationale: Фраза in temporibus iustis означает «в надлежащие (должные) времена»; iustis грамматически относится к temporibus. Перевод «обещано праведным» меняет содержание и должен быть устранён.
  - severity: medium
    issue: «Вместить» ослабляет образ portare.
    rationale: Capiet portare означает «сможет нести/выдержать, неся», тогда как «вместить» переносит смысл в область ёмкости. Более точное «не сможет нести» сохраняет лексику и образ источника.
  - severity: low
    issue: «Скорбей» во множественном числе менее близко к mesticia.
    rationale: В латинском mesticia стоит в единственном числе рядом с infirmitatibus. «Скорби и немощей» точнее сохраняет это различие и естественно по-русски.
  revised_text: Потому что этот век поспешно стремится пройти. Ведь он не сможет нести того, что было обещано в должные времена, потому что этот век полон скорби и немощей.
