source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: ru
  text: Потому что этот век поспешно стремится пройти. Ведь он не сможет нести того, что было обещано в должные времена, потому что этот век полон скорби и немощей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: Передаёт временную эпоху или нынешний мировой порядок, сохраняя эсхатологический оттенок латинского слова.
- source_word: festinans festinat
  choice: стремительно спешит
  rationale: Сохраняет усилительную конструкцию оригинала без неестественного буквального повтора «спеша спешит».
- source_word: capiet portare
  choice: может вместить
  rationale: Латинская конструкция буквально связана со способностью «нести», но в контексте обещанных благ естественное русское «вместить» передаёт мысль о неспособности нынешнего века принять их.
- source_word: quae ... repromissa sunt
  choice: то, что ... обещано
  rationale: Нейтрально передаёт пассивную конструкцию и не добавляет явно названного субъекта обещания.
- source_word: in temporibus iustis
  choice: в назначенные времена
  rationale: В данном контексте iustis вероятнее означает надлежащие, установленные времена; «назначенные» естественно выражает эту идею.
- source_word: iustis
  choice: праведным
  rationale: В сочетании quae ... iustis repromissa sunt дательный множественного числа относится к получателям обещанного — праведным.
- source_word: mesticia
  choice: скорбей
  rationale: Передаёт печали и бедствия нынешнего века в естественном библейском регистре.
- source_word: infirmitatibus
  choice: немощей
  rationale: Сохраняет широкий смысл слабостей, недугов и ограниченности без неоправданного сведения только к болезням.
theological_decisions:
- issue: Кому предназначено обещанное
  choice: «обещано праведным»
  alternative: «обещано для праведных»
  rationale: Дательный iustis естественно обозначает адресатов обещания; формулировка не уточняет содержание обещанного и не вводит конфессиональных толкований.
- issue: Характер «века»
  choice: «век этот» как временная эпоха
  alternative: «этот мир»
  rationale: «Век» точнее сохраняет временной и эсхатологический смысл saeculum и не разрешает неоднозначность в пользу исключительно пространственного «мира».
- issue: Смысл «назначенных времён»
  choice: времена установлены как надлежащие для исполнения обещания
  alternative: «во времена праведных»
  rationale: Согласование и контекст поддерживают чтение temporibus iustis как указание на должные или назначенные сроки, а не на эпоху принадлежности праведных.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сохранены повтор «век» и усиление движения к завершению; синтаксис сделан ясным для обычного читателя без устранения эсхатологического напряжения.
