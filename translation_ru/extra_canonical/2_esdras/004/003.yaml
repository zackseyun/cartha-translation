  text: 'Et dixi ; ita, dominus meus. et respondit mihi et dixit : tres uias missus sum ostendere tibi, et tres similitudines proponere coram te ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/003.yaml
  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: ru
  text: 'И я сказал: «Да, господин мой». И он ответил мне и сказал: «Я послан показать тебе три пути и предложить тебе три сравнения».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: господин мой
  rationale: В обращении к ангелу слово dominus передаёт почтительное «господин», а не божественный титул «Господь».
- source_word: tres uias
  choice: три пути
  rationale: Сохранён прямой и допускающий образное понимание эквивалент латинского uias.
- source_word: tres similitudines
  choice: три сравнения
  rationale: Similitudines здесь обозначает сопоставления или наглядные аналогии; «сравнения» сохраняет широту значения без преждевременного уточнения жанра.
- source_word: proponere coram te
  choice: предложить тебе
  rationale: Естественно передаёт смысл «представить перед тобой» в современном русском языке.
theological_decisions:
- issue: К кому относится титул dominus meus
  choice: строчное «господин мой»
  alternative: «Господь мой»
  rationale: Контекст реплики указывает на почтительное обращение к небесному собеседнику; прописная буква могла бы ошибочно отождествить его с Богом.
- issue: Посланническая формула missus sum
  choice: «Я послан» без указания отправителя
  alternative: «Бог послал меня»
  rationale: Латинский текст не называет отправителя, поэтому подразумеваемый субъект не добавлен.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией; избыточная латинская формула «ответил мне и сказал» естественно сокращена до «ответил мне» без потери содержания.
