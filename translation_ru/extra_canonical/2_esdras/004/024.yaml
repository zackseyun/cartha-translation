  source_fidelity: «Нигде не найти» несколько смещает латинское экзистенциальное nusquam sunt («нигде нет») в сторону доступности или поиска. Более прямое «нигде нет» сохраняет смысл без этого оттенка. «Проходим через этот век», образ саранчи, сравнение жизни с паром и финальная незавершённость в целом точно передают латинский текст.
  naturalness: Текст в целом звучит естественно в современном литературном русском и сохраняет возвышенный регистр. Замена «нигде не найти» на «нигде нет» также делает первую часть короче и сильнее. Запятая в конце оправдана тем, что фраза продолжается в следующем стихе.
  terminology: «Писаные установления» допустимо передаёт dispositionis scriptae и не сводит выражение к одному типу правовой нормы. В примечании следует избегать несколько тяжеловеского и интерпретирующего оборота «установленного для Израиля письменного порядка»; достаточно говорить о письменном установленном порядке Израиля, сохраняя заявленную неоднозначность.
  issues:
