    issue: Экзистенциальное утверждение передано как возможность найти
    rationale: Латинское dispositionis scriptae nusquam sunt буквально утверждает, что писаных установлений «нигде нет», тогда как «нигде не найти» может подразумевать лишь невозможность их отыскать.
  - severity: low
    issue: Формулировка примечания стилистически тяжеловесна
    rationale: Оборот «установленного для Израиля письменного порядка» менее естественен, чем «письменного установленного порядка Израиля», и может восприниматься как избыточное уточнение.
