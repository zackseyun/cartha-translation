source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: ru
  text: и писаных установлений нигде нет.[a] Мы проходим через этот век, словно саранча, жизнь наша — словно пар, и мы недостойны,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «писаных установлений нигде нет», вероятно, говорят о фактической утрате или упразднении письменного установленного порядка Израиля вследствие катастрофы, а не обязательно о физическом исчезновении всех рукописей.
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  choice: писаных установлений
  rationale: Передаёт идею письменно закреплённых предписаний или установленного порядка, не сужая значение до одного конкретного вида закона.
- source_word: pertransimus de saeculo
  choice: проходим через этот век
  rationale: Сохраняет образ краткого прохождения через нынешний век и не превращает выражение в однозначное указание на смерть или уход из мира.
- source_word: ut locustae
  choice: словно саранча
  rationale: Русское собирательное существительное естественно передаёт латинское множественное число и сохраняет образ мимолётности и бессилия.
- source_word: ut uapor
  choice: словно пар
  rationale: Краткий и традиционно понятный образ непрочности и быстротечности жизни; соответствует широкому значению латинского vapor.
- source_word: nec digni sumus
  choice: и мы недостойны
  rationale: Сохраняет незавершённость исходной фразы, продолжение которой ожидается в следующем стихе или сегменте.
theological_decisions:
- issue: Смысл отсутствия писаных установлений
  choice: Не уточнять, означает ли это физическую утрату текстов или утрату их действующей силы
  alternative: Перевести как «писаные установления утрачены» или «писаный закон больше не действует»
  rationale: Латинское nusquam sunt допускает более одного понимания; основной текст и примечание сохраняют эту неоднозначность без конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Союз «и» в начале и запятая в конце сохранены, поскольку данный отрывок продолжает предшествующую мысль и сам остаётся синтаксически незавершённым.
