  text: suis dicentes, usquequo spero sic? et quando uenit fructus areae mercedis nostrae? Et respondit ad eas Hieremiel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/035.yaml
  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: ru
  text: 'Не об этом ли спрашивали души праведных в своих покоях[a], говоря: «Долго ли ещё мне[b] так надеяться? И когда придёт плод гумна нашей награды?» И Иеремиил ответил им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Образ душ, пребывающих в отведённых им покоях, предваряет сравнение с родами в ст. 40–42: они хранятся там, пока не исполнится назначенное число.'
    reason: cross_reference
  - marker: b
    text: 'В сирийской и эфиопской версиях смысл передан во множественном числе: «Долго ли ещё нам так надеяться?» Латинский текст содержит форму единственного числа.'
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: в своих покоях
  rationale: По контексту речь идёт о местах, где пребывают души праведных; «покои» естественно передаёт образ обособленного, предназначенного для них места, не сужая его до буквального склада.
- source_word: usquequo spero sic?
  choice: Долго ли ещё мне так надеяться?
  rationale: Сохранены единственное число латинского spero и наречие sic, хотя множественное число говорящих создаёт подлинную текстовую напряжённость.
- source_word: fructus areae mercedis nostrae
  choice: плод гумна нашей награды
  rationale: Сохранён земледельческий образ area — «гумно» — и необычная генитивная связь с «нашей наградой», не заменённая богословским истолкованием.
- source_word: Hieremiel
  choice: Иеремиил
  rationale: Употреблена традиционная русская передача имени ангела, отличающая его от пророка Иеремии.
theological_decisions:
- issue: Место пребывания душ праведных до назначенного срока
  choice: покои
  alternative: хранилища
  rationale: «Покои» сохраняет представление об отведённом месте и лучше звучит в современном литературном русском; примечание поясняет связь образа с последующим контекстом.
- issue: Число в вопросе душ праведных
  choice: мне ... надеяться
  alternative: нам ... надеяться
  rationale: Основной текст следует засвидетельствованному латинскому spero в единственном числе; вариант во множественном числе отмечен, поскольку он согласуется с множественным субъектом и поддерживается древними версиями.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной формальностью. Риторический вопрос, земледельческая метафора и грамматическая неоднозначность числа сохранены; синтаксис слегка упорядочен ради ясности.
