  source_fidelity: 'Русский текст точно передаёт латинский текст: риторический вопрос, пребывание душ «в своих» местах, единственное число spero, sic, образ «плода гумна» награды и заключительное «Иеремиил ответил им». Единственное число «мне» намеренно сохраняет засвидетельствованную латинскую форму и не скрывает текстологической трудности.'
