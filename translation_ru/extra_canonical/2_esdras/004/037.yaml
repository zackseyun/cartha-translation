source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mensurauit tempora, et numero numerauit tempora, et non commouebit nec excitabit usque dum impleatur praedicta
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/037.yaml
  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: ru
  text: «Он измерил времена и исчислил их и не поколеблет их, не приведёт в движение, пока не исполнится предсказанное[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предсказанная мера».'
    reason: Praedicta может быть понято как «то, что было предсказано»; возможно и подразумеваемое существительное женского рода в единственном числе, например «мера». Основной текст не добавляет такого существительного без необходимости.
lexical_decisions:
- source_word: mensurauit tempora
  choice: измерил времена
  rationale: Прямо передаёт образ установления меры времён, сохраняя апокалиптическую образность.
- source_word: numero numerauit tempora
  choice: исчислил их
  rationale: Латинская фигура с однокоренными словами буквально означает исчисление времён; в современном русском повтор «числом исчислил» звучал бы искусственно. Местоимение ясно отсылает к временам.
- source_word: non commouebit nec excitabit
  choice: не сдвинет их с места, не приведёт в движение
  rationale: 'Сохраняются два близких, но не полностью тождественных глагола: первый обозначает смещение, второй — приведение в движение. Объект «их» естественно относится к временам.'
- source_word: praedicta
  choice: предсказанное
  rationale: Передаёт значение «предречённое, заранее возвещённое», не добавляя отсутствующего в данной форме текста существительного «мера».
theological_decisions:
- issue: Неизменность установленных Богом времён
  choice: сохранить активную формулировку «не сдвинет… не приведёт в движение»
  alternative: «не изменит их»
  rationale: Более конкретная формулировка удерживает двойной образ латинских commouebit и excitabit и не сводит его к отвлечённому богословскому тезису.
- issue: Референт praedicta
  choice: «предсказанное» в основном тексте
  alternative: «предречённая мера»
  rationale: Латинская форма допускает понимание подразумеваемой меры, однако существительное в предоставленном тексте отсутствует. Основной перевод не восполняет его молча, а альтернативу отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; архаизмы и конфессионально окрашенная терминология не используются.
