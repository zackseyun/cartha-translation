  text: nos omnes pleni sumus impietatem. Et ne forte propter nos prohibeatur iustorum area, propter peccata inhabitantium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: ru
  text: Все мы исполнены нечестия. И, быть может, из-за нас гумно праведных удерживается[a] — из-за грехов живущих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задерживается».'
    reason: Латинское prohibeatur прежде всего означает «удерживается», «встречает препятствие», но в контексте возможно и временное значение — «задерживается».
lexical_decisions:
- source_word: pleni sumus impietatem
  choice: мы исполнены нечестия
  rationale: Передаёт образ полноты и нравственно-религиозный смысл impietas в естественном для современного литературного русского языка обороте.
- source_word: area
  choice: гумно
  rationale: Сохраняет конкретный сельскохозяйственный образ места, где молотят и веют зерно; не подменяет метафору более общим понятием урожая.
- source_word: prohibeatur
  choice: удерживается
  rationale: Передаёт значение препятствования или удерживания, не сводя его только к временному промедлению.
- source_word: inhabitantium
  choice: тех, кто там живёт
  rationale: Естественно передаёт субстантивированное причастие и сохраняет имеющуюся в латинском тексте неопределённость относительно места проживания.
theological_decisions:
- issue: Соотношение человеческого нечестия и удерживания гумна праведных
  choice: Сохранена предположительность связи посредством «быть может»
  alternative: Утвердительная причинная связь без оговорки
  rationale: Латинское ne forte в данном контексте выражает опасение или возможность; перевод не должен превращать это в однозначное богословское утверждение.
- issue: Образ «гумна праведных»
  choice: Метафора сохранена без истолкования
  alternative: «урожай/награда праведных»
  rationale: Исходный текст допускает образное и эсхатологическое прочтение, но сам не раскрывает метафору; её не следует разрешать в переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Нечестие» и «гумно» сохраняют религиозный регистр и исходную метафору; синтаксис сделан ясным для обычного читателя.
