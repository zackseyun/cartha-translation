id: 2ES.4.11
reference: 2 Esdras 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: ru
  text: '«Как же твой сосуд может вместить путь Всевышнего и, уже изнурённый тленным веком, постичь нетление?» Услышав это, я пал ниц и сказал ему: «Лучше было бы нам не существовать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vas tuum
  choice: твой сосуд
  rationale: Сохранён образ сосуда как обозначение ограниченной человеческой способности; более истолковывающие варианты вроде «твой разум» устранили бы метафору оригинала.
- source_word: capere
  choice: вместить
  rationale: Глагол передаёт способность охватить или вместить нечто; в сочетании с «сосудом» русский глагол «вместить» сохраняет образ и естественность.
- source_word: Altissimi
  choice: Всевышнего
  rationale: Устойчивое и точное соответствие латинскому титулу Altissimus.
- source_word: exteritus
  choice: изнурённый
  rationale: Передаёт состояние истощённости, изношенности или ослабленности, подразумеваемое контекстом.
- source_word: corrupto saeculo
  choice: тленным веком
  rationale: Сохраняет характеристику нынешнего века как подверженного порче и распаду, не сводя saeculum только к миру или эпохе.
- source_word: incorruptionem
  choice: нетление
  rationale: Передаёт противопоставление тленному веку и состоянию, не подверженному порче.
- source_word: cecidi in faciem meam
  choice: я пал ниц
  rationale: Естественная русская библейская формула, точно передающая падение лицом к земле.
- source_word: melius erat nos non adesse
  choice: лучше было бы нам не существовать
  rationale: В данном контексте adesse означает быть налицо, существовать; перевод сохраняет сослагательное сожаление говорящего.
theological_decisions:
- issue: Значение образа «сосуд»
  choice: Сохранить буквальную метафору «твой сосуд»
  alternative: 'Передать истолковательно: «твой разум» или «ты»'
  rationale: Латинский текст говорит о vas и допускает более широкое понимание человеческой природы или способности; конкретизация до одного лишь разума сняла бы эту неоднозначность.
- issue: Характер «нетления»
  choice: Оставить отвлечённое существительное «нетление»
  alternative: Конкретизировать как «вечную жизнь» или «нетленный мир»
  rationale: Оригинал использует incorruptio без такого уточнения; перевод не должен заранее разрешать богословский объём понятия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Метафора сосуда и противопоставление тленного века нетлению сохранены; синтаксис слегка упорядочен для ясности без устранения смыслового напряжения.
