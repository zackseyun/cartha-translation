lexical_decisions:
- source_word: profectus sum
  choice: Я отправился
  rationale: Латинский перфект передаёт простое завершённое действие без добавочного значения «однажды».
- source_word: ad siluam lignorum campi
  choice: к лесу, где росли деревья равнины
  rationale: Так сохраняются все основные образы исходной фразы — лес, деревья и равнина, — но устраняется неестественная для современного русского цепочка родительных падежей.
- source_word: cogitauerunt cogitationem
  choice: задумали свой замысел
  rationale: Передаёт усилительную фигуру однокоренных слов в латинском тексте, оставаясь понятным по-русски; субъектом являются упомянутые прежде деревья.
- source_word: uenite et eamus
  choice: Давайте пойдём
  rationale: Естественная русская передача приглашения к совместному действию; буквальное сочетание «придите, и пойдём» здесь звучало бы искусственно.
- source_word: faciamus ad
  choice: выступим против…
  rationale: Предлог ad указывает на направленность действия против чего-либо, а оборванность фразы сохранена многоточием, поскольку её продолжение находится в следующем стихе.
