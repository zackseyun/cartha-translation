  source_fidelity: 'Начало стиха передано верно: «Я отправился» соответствует profectus sum без добавления «однажды», а граница стиха сохранена. Однако «выступим против…» преждевременно вносит значение противостояния и действия, которого в данном стихе ещё нет: латинское faciamus ad обрывается после «сделаем / совершим», тогда как объект и военный контекст появляются лишь в следующем стихе.'
  naturalness: «К лесу, где росли деревья равнины» понятно, но несколько неудачно связывает деревья с лесом. «К лесу из деревьев равнины» сохраняет образ и остаётся литературно приемлемым. «Задумали замысел» намеренно воспроизводит усилительный повтор оригинала; пояснение в сноске делает его прозрачным.
  terminology: Богословских терминов и имен в стихе нет. Олицетворённый субъект («они», то есть деревья из предшествующего контекста) сохранён. Не следует добавлять «против» до появления соответствующего дополнения в следующем стихе.
