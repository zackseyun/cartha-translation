  text: 'seminatae fuerint spicae quarum non est numerus, quam magnam aream incipient facere! Et respondit et dixi: usque-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/032.yaml
  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
translation:
  language: ru
  text: 'Когда будут посеяны бесчисленные колосья[a], какое огромное гумно они начнут образовывать! И я спросил в ответ: «До каких пор…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «колосья, которым нет числа».'
    reason: Сохраняет доступ к форме латинского относительного оборота, свёрнутого в основном тексте ради естественности русского языка.
lexical_decisions:
- source_word: seminatae fuerint
  choice: будут посеяны
  rationale: Будущее совершённое действие передано естественной русской формой будущего времени; пассивный залог сохранён.
- source_word: spicae quarum non est numerus
  choice: бесчисленные колосья
  rationale: Кратко и естественно передаёт буквальный смысл «колосья, которым нет числа».
- source_word: quam magnam aream
  choice: какое огромное гумно
  rationale: area в данном земледельческом образе означает площадку для молотьбы; «гумно» сохраняет исторический образ и возвышенный библейский регистр.
- source_word: incipient facere
  choice: начнут образовывать
  rationale: Сохранён аспект начинательности incipient; «образовывать» естественнее по-русски при множестве колосьев, создающих огромное гумно.
- source_word: Et respondit et dixi
  choice: И я спросил в ответ
  rationale: 'Латинское чтение грамматически шероховато: respondit — 3-е лицо, dixi — 1-е. По контексту реплика «До каких пор…» принадлежит говорящему; формула передана естественно, без буквального воспроизведения несогласования.'
- source_word: usque-
  choice: До каких пор…
  rationale: Обрывок usque- относится к продолжающейся в следующем стихе реплике; многоточие обозначает незавершённость текста данного стиха.
theological_decisions:
- issue: Кто произносит заключительную реплику
  choice: 'Реплику начинает рассказчик: «И я спросил в ответ»'
  alternative: «И он ответил и сказал мне»
  rationale: Форма dixi прямо означает «я сказал», а продолжение вопроса в следующем стихе по контексту исходит от Ездры. Неустойчивое respondit не должно молча менять говорящего.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Термин «гумно» выбран как точный традиционный эквивалент земледельческого area; незавершённость последней реплики обозначена многоточием.
