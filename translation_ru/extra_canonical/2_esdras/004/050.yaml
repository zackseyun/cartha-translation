source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: cogita tibi. sicut enim crescit pluvia amplius quam guttae, et ignis amplius quam fumus, sic superabundavit quae transivit mensura, superaverunt autem guttae et fumus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: ru
  text: 'И он сказал мне: «Рассуди сам: как дождь превосходит капли, а огонь — дым, так и мера прошедшего оказалась намного больше[a]; а капли и дым остались».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так и то, что прошло, намного превысило меру».'
    reason: 'Латинское quae transivit mensura допускает неоднозначное синтаксическое членение: «мера прошедшего» либо «то, что прошло, [превысило] меру».'
lexical_decisions:
- source_word: cogita tibi
  choice: Рассуди сам
  rationale: Передаёт призыв самостоятельно обдумать сказанное естественным современным русским языком.
- source_word: crescit ... amplius quam
  choice: превосходит
  rationale: Латинское сравнительное выражение буквально говорит, что дождь «возрастает больше капель», а огонь — дыма; «превосходит» сохраняет сравнение и звучит по-русски естественно.
- source_word: quae transivit mensura
  choice: мера того, что прошло
  rationale: Сохраняет связь с mensura («мера») и прошедшим временем/периодом, не уточняя сверх текста, что именно прошло.
- source_word: superaverunt
  choice: остались
  rationale: В данном противопоставлении латинский глагол означает, что капли и дым остались; прошедшее время оригинала сохранено.
theological_decisions:
- issue: Соотношение прошедшего и оставшегося времени
  choice: мера того, что прошло, была гораздо больше
  alternative: то, что прошло, далеко превысило меру
  rationale: Основной текст следует наиболее прямому грамматическому пониманию mensura как подлежащего и не вводит явного толкования об эпохах; сжатый латинский синтаксис допускает и другое членение, отмеченное в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским ритмом. Образ дождя, капель, огня и дыма сохранён без поясняющих добавлений; инверсия «остались же» передаёт контраст autem.
