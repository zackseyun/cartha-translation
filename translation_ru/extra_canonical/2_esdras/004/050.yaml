  verdict: revise
  source_fidelity: 'Основная мысль и образы переданы верно: сохраняются сопоставления дождя с каплями и огня с дымом, а также противопоставление прошедшего и остающегося. Однако «была гораздо больше» несколько ослабляет глагольное superabundavit («стало/оказалось в преизбытке, значительно превзошло») и звучит так, словно в латинском прямо выражен обычный сравнительный оборот. Формулировка «мера прошедшего оказалась намного больше» лучше передаёт результативность перфекта, не добавляя отсутствующий объект сравнения.'
