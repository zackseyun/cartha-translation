  text: 'Likewise also the plan of the waves of the sea: for the sand stood fast and held them back.'
translation:
  language: ru
  text: 'Так же было и с замыслом морских волн: песок устоял и сдержал их.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitatus fluctuum maris
  choice: замысел морских волн
  rationale: «Замысел» естественно передаёт здесь олицетворённое намерение волн; «мысль» звучала бы менее ясно.
- source_word: stetit enim
  choice: песок устоял
  rationale: Глагол stetit передан как «устоял», что выражает неподвижность и сопротивление песка напору волн; подлежащее восстановлено по контексту и засвидетельствовано консультационным английским текстом.
- source_word: prohibuit eos (контекстуальное продолжение)
  choice: сдержал их
  rationale: Кратко и естественно передаёт то, что песок не позволил волнам продвинуться дальше.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранено олицетворение морских волн. Оборот «Так же было и с…» не уточняет сверх источника, в чём именно состоялась или не состоялась участь замысла, а причинная часть раскрывает смысл образа.
