lexical_decisions:
- source_word: poterit matrix eius retinere foetum in semetipsa
  choice: '[учтено как контекст предшествующего вопроса]'
  rationale: Эти слова образуют конец вопроса, на который отвечает говорящий; повторять их в данном стихе не следует.
- source_word: non potest, domine
  choice: Не может, Господи
  rationale: Прямо передаёт отрицательный ответ и звательный смысл латинского domine.
- source_word: in inferno
  choice: в преисподней
  rationale: Здесь infernum обозначает мир мёртвых, а не обязательно место окончательного наказания.
- source_word: prumptuaria (promptuaria)
  choice: хранилища
  rationale: Латинское существительное во множественном числе означает кладовые или хранилища; нейтральное «хранилища» сохраняет широту образа.
theological_decisions:
- issue: Значение infernum
  choice: преисподняя как мир мёртвых
  alternative: ад как место окончательного наказания
  rationale: Контекст и семантический диапазон латинского слова не требуют более узкого представления об окончательном наказании.
- issue: Незавершённость исходного фрагмента
  choice: не дополнять предложение и обозначить обрыв многоточием
  alternative: восстановить продолжение по более поздним версиям или английской редакции
  rationale: Предоставленный латинский источник обрывается после prumptuaria; добавление субъекта или сравнения не подтверждается данным текстом.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. «Тогда» естественно связывает реплики; многоточие честно передаёт обрыв сохранившегося латинского фрагмента.
