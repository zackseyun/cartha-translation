- from: Но сейчас я спросил тебя только об огне, ветре и дне, через которые ты прошёл и без которых не можешь существовать, однако ты не ответил мне о них.
  to: Но теперь я спросил тебя только об огне, ветре и дне, через которые ты прошёл и без которых не можешь существовать, а ты не ответил на мой вопрос о них.
  rationale: 'Заменены несколько менее естественные для современного русского элементов: «сейчас» на «теперь», повторное противительное «однако» на «а», а также «не ответил мне о них» на естественное «не ответил на мой вопрос о них». Смысл, синтаксическая связь относительного местоимения со всеми тремя существительными и продолжение речи в следующем стихе сохранены.'
