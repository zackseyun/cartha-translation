  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: ru
  text: Но теперь я спросил тебя только об огне, ветре и дне, через которые ты прошёл и без которых не можешь существовать, а ты не ответил на мой вопрос о них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: Но сейчас
  rationale: Передаёт противопоставление autem и временное значение nunc естественным современным русским выражением.
- source_word: non interrogaui te nisi
  choice: я спросил тебя только
  rationale: Латинская ограничительная конструкция non... nisi естественно передаётся словом «только».
- source_word: de igne et uento et die
  choice: об огне, ветре и дне
  rationale: Сохраняет три однородных понятия исходного текста без добавочного толкования.
- source_word: per quae transisti
  choice: через которые ты прошёл
  rationale: Буквально сохраняет пространственно-опытный образ латинского per... transisti и соотносит относительное местоимение со всеми тремя понятиями.
- source_word: sine quibus esse non potes
  choice: без которых не можешь существовать
  rationale: Esse здесь передано как «существовать», что ясно выражает невозможность быть без названных вещей.
- source_word: non respondisti mihi de eis
  choice: ты не ответил мне о них
  rationale: Сохраняет адресата mihi и повторное указание de eis; необычное, но понятное «ответить о них» точнее, чем разрешающее смысл «не дал ответа на вопросы о них».
