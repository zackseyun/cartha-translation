lexical_decisions:
- source_word: impietatibus
  choice: нечестии
  rationale: Передаёт религиозно-нравственный смысл латинского impietas без привнесения конфессиональной терминологии.
- source_word: pati
  choice: страдать
  rationale: Прямое и естественное соответствие латинскому инфинитиву.
- source_word: de qua re
  choice: за что
  rationale: В контексте страдания естественно выражает вопрос о его причине, сохраняя смысл латинского оборота.
- source_word: proficiscens
  choice: отправляясь
  rationale: Сохраняет присутствующее в источнике причастие и намеренно незавершённый переход к следующему стиху.
theological_decisions:
- issue: Характер impietas
  choice: нечестие
  alternative: безбожие
  rationale: «Нечестие» шире и не сводит смысл исключительно к отрицанию существования Бога.
- issue: Причина страдания в de qua re
  choice: не понимать, за что
  alternative: не понимать, почему
  rationale: Оборот «за что» естественно связан со страданием и допускает как причинный, так и нравственно-возмездный оттенок, не разрешая напряжение однозначно.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и фрагментарной синтаксической границы исходного стиха. Начальное «чем» намеренно сохраняет зависимость от предшествующего контекста.
