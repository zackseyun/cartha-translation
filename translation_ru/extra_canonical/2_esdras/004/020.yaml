  text: to me and said, “You have judged rightly, so why have you not judged for yourself?”
translation:
  language: ru
  text: 'ко мне и сказал: «Ты рассудил верно; почему же ты не рассудил о самом себе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene tu iudicasti
  choice: Ты рассудил верно
  rationale: Передаёт положительную оценку суждения Ездры естественным современным русским языком, сохраняя глагольную связь с последующим iudicasti.
- source_word: quare
  choice: почему же
  rationale: «Же» естественно выражает контраст между верным суждением и неспособностью применить его к себе.
- source_word: non iudicasti tibi
  choice: не рассудил о самом себе
  rationale: Латинское tibi буквально допускает значение «для себя», но по контексту речь идёт о применении суждения к собственной ситуации; формулировка сохраняет повтор iudicasti и звучит по-русски естественно.
theological_decisions:
- issue: Смысл дательного tibi
  choice: о самом себе
  alternative: для самого себя
  rationale: 'Выбрана контекстуальная передача, не вводящая дополнительной доктринальной конкретизации: Ездра должен применить уже высказанное суждение к себе.'
translation_notes:
  register: Современный литературный русский с достойной, ясной интонацией. Начальная строчная буква сохранена, поскольку данный стих начинается продолжением предложения из предыдущего контекста.
