  text: And he answered me and said, “Go and ask a pregnant woman whether, when she has completed her nine months, she can still keep the child within her.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Пойди и спроси беременную женщину: когда срок её беременности достигнет девяти месяцев, может ли она и дальше носить ребёнка в себе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnantem
  choice: беременную женщину
  rationale: Естественный современный русский эквивалент латинского обозначения беременной.
- source_word: impleuerit nouem menses suos
  choice: исполнятся её девять месяцев
  rationale: Передаёт завершение полного срока в девять месяцев, сохраняя образ и синтаксическую связь исходного текста.
- source_word: adhuc
  choice: и дальше
  rationale: Выражает продолжение состояния после истечения указанного срока.
