  to: 'И он ответил мне и сказал: «Пойди и спроси беременную женщину: когда срок её беременности достигнет девяти месяцев, может ли она и дальше носить ребёнка в себе?»'
  rationale: Исправлена неестественная конструкция о «исполняющихся месяцах», восстановлена полная вводная формула оригинала и выбран нейтральный русский глагол для продолжения беременности. Смысл, образ и вопросительная форма латинского текста и английской контрольной версии сохранены.
