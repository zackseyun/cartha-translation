translation_notes:
  register: Современный литературный русский язык; прямую речь сделано естественной и понятной, без конфессиональных уточнений. Формула «ответил мне» сохраняет структуру латинского текста, а «удерживать ребёнка в себе» следует смыслу продолжения фразы, подтверждённому контекстом и консультационным английским текстом.
