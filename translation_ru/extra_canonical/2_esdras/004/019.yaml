  source_fidelity: 'Начало передано точно: utrique относится к двум ранее названным сторонам, а uanam cogitationem cogitauerunt уместно передавать как тщетный/пустой замысел. Однако «морю — место, чтобы нести свои волны» неудачно перестраивает латинское maris locus portare fluctus suos: носителем инфинитива является «место моря», а не море, получающее место. Кроме того, «свои» в этой русской конструкции может соотноситься с «местом» либо с дательным «морю».'
