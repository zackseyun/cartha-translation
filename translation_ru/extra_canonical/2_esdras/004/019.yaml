  yaml_path: translation/extra_canonical/2_esdras/004/019.yaml
  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: ru
  text: 'Я сказал: «Оба замыслили тщетное, ведь земля отдана лесу, а месту моря — нести его волны». И он ответил:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: utrique
  choice: оба
  rationale: Передаёт отнесённость к двум ранее названным сторонам без добавочного толкования.
- source_word: uanam cogitationem cogitauerunt
  choice: замыслили напрасное
  rationale: Сохраняет сочетание мысли и тщетности, избегая тяжеловесного русского повтора «помыслили тщетную мысль».
- source_word: terra enim data est siluae
  choice: ведь земля отдана лесу
  rationale: Близко передаёт пассивную конструкцию и пояснительное enim.
- source_word: maris locus portare fluctus suos
  choice: морю — место, чтобы нести свои волны
  rationale: Сохраняет эллиптическое устройство латинской фразы и смысл предназначенного морю пространства; «свои» соответствует suos.
- source_word: Et respondit
  choice: 'И он ответил:'
  rationale: Сохраняет незавершённый переход к следующей реплике; двоеточие естественно вводит её по-русски.
