  naturalness: «Твой разум совершенно теряется в том, что относится к этому веку» тяжеловесно и не вполне естественно для современного литературного русского. «Когда дело касается этого века» ясно выражает требуемую связь и сохраняет возвышенный, но живой регистр.
  terminology: «Разум», «век», «постичь» и «Всевышний» удачны. «Путь Всевышнего» точно сохраняет uiam altissimi; не следует заменять его доктринально окрашенными объяснениями.
