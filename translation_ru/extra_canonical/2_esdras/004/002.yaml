  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: ru
  text: 'И сказал мне: «Твой разум совершенно теряется, когда дело касается этого века[a], — и ты думаешь постичь путь Всевышнего?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Твой разум, выходя за пределы, далеко вышел в этом веке». Необычный усилительный оборот может также иметь более буквальный пространственный смысл; здесь он, вероятно, выражает крайнюю растерянность или неспособность понять нынешний век.'
    reason: Сохраняет формальную и смысловую неоднозначность excedens excessit, тогда как основной текст остаётся естественным по-русски.
lexical_decisions:
- source_word: cor
  choice: разум
  rationale: В данном контексте латинское cor обозначает внутреннюю способность понимать и мыслить, а не физическое сердце; современное русское «разум» ясно передаёт смысл рассуждения.
- source_word: excedens excessit
  choice: совершенно теряется
  rationale: Повтор однокоренных форм усиливает высказывание. В контексте он указывает на неспособность разума справиться даже с устройством нынешнего века; буквальное «вышел за пределы» по-русски могло бы ошибочно звучать как достижение превосходящего знания или нравственное преступление.
- source_word: in saeculo hoc
  choice: в том, что относится к этому веку
  rationale: Передаёт сферу, в которой разум оказывается неспособен разобраться, и сохраняет эсхатологическое значение saeculum как «век», а не просто «мир».
- source_word: comprehendere
  choice: постичь
  rationale: Естественный и достойный русский эквивалент для интеллектуального охвата или понимания.
- source_word: uiam altissimi
  choice: путь Всевышнего
  rationale: Сохраняет метафору пути и традиционное божественное именование Altissimus.
theological_decisions:
- issue: Смысл excedens excessit cor tuum
  choice: Высказывание о пределах и растерянности человеческого разума
  alternative: «Твоё сердце далеко вышло за пределы в этом веке» или «твоё сердце зашло слишком далеко»
  rationale: 'Ход довода строится от меньшего к большему: если Ездра не может разобраться в нынешнем веке, тем менее он способен постичь путь Всевышнего. Перевод не превращает эту фразу в упрёк за самонадеянное нарушение границ, хотя формальная необычность латинского оборота отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с ясным, но возвышенным библейским звучанием. Риторический вопрос и противопоставление ограниченного человеческого разума пути Всевышнего сохранены.
