  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
translation:
  language: ru
  text: 'и сказали: «Давайте пойдём войной на море, чтобы оно отступило перед нами, и устроим себе другие леса». Подобным образом и морские волны задумали замысел,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mare bellum
  choice: пойдём войной на море
  rationale: В очищенном фрагменте начало фразы повреждено или утрачено; по восстановленному синтаксису речь идёт о замысле лесов начать войну против моря. Такая формулировка естественно передаёт подразумеваемое bellum gerere против mare.
- source_word: recedat coram nos
  choice: оно отступило перед нами
  rationale: Сохраняет пространственный и военный образ латинского recedat coram nos, несмотря на ненормативное позднелатинское управление.
- source_word: alias siluas
  choice: другие леса
  rationale: Alias означает «другие», а не «больше»; перевод сохраняет лексическую точность и параллель с продолжением притчи.
- source_word: faciamus nobis
  choice: мы создали себе
  rationale: Передаёт буквальный смысл «сделали/устроили для себя», но по-русски звучит естественнее применительно к лесам, не уточняя способ их возникновения.
- source_word: cogitauerunt cogita-
  choice: задумали свой замысел
  rationale: Сохраняет этимологическую фигуру латинского cogitaverunt cogitationem, начало второго слова которой видно на границе фрагмента, и не устраняет намеренную повторность.
