    rationale: Латинское faciamus — форма совместного побуждения, продолжающая venite/eamus; в русском после «Давайте пойдём» требуется «и устроим/создадим», а не прошедшее «создали».
  - severity: low
    issue: «Свой замысел» добавляет притяжательное значение и несколько утяжеляет намеренную тавтологию.
    rationale: В реконструируемом cogitaverunt cogitationem притяжательного местоимения нет. «Задумали замысел» сохраняет повтор корня без добавления смысла.
