  rationale: Исправлена только русская грамматика побудительной речи и устранено невыраженное притяжательное значение в заключительной повторной формуле. «Устроим себе» передаёт faciamus nobis в естественном русском употреблении применительно к получению/созданию лесов, не уточняя способа. Фрагментарное, переходящее в следующий стих окончание сохранено.
