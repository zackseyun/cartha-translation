source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: ru
  text: 'И он сказал мне: «Если бы я спросил тебя: „Сколько обителей в сердце моря? Сколько источников в начале бездны? Сколько путей над небесным сводом? Каковы выходы из рая?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: habitationes
  choice: обителей
  rationale: Сохраняет прямое значение «места обитания, жилища» и возвышенный характер перечня.
- source_word: in corde maris
  choice: в сердце моря
  rationale: Буквально передаёт латинскую метафору, не сводя её однозначно к глубине или середине моря.
- source_word: uenae
  choice: источников
  rationale: В контексте водной бездны латинское venae обозначает водные жилы или истоки; «источники» понятно современному читателю.
- source_word: in principio abyssi
  choice: у начала бездны
  rationale: Сохраняет возможную пространственную или космогоническую неоднозначность principium.
- source_word: uiae
  choice: путей
  rationale: Прямой и естественный эквивалент, сохраняющий образ путей над сводом.
- source_word: firmamentum
  choice: небесным сводом
  rationale: Передаёт древний космологический образ ясным современным русским выражением.
- source_word: exitus paradisi
  choice: выходы из рая
  rationale: Буквально сохраняет множественное число и направление наружу, не заменяя его более привычными «вратами».
