  text: granum seminis mali seminatum est in corde Adam ab initio, et quantum impietatis generauit usque nunc et generabit usque cum ueniat area. Aestima autem apud te granum mali
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: ru
  text: Ибо от начала в сердце Адама было посеяно зерно злого семени. Сколько же нечестия оно породило доныне и ещё породит, пока не наступит время молотьбы![a] Сам же подумай о зерне зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока не придёт гумно»; вероятно, имеется в виду время молотьбы как образ окончательного отделения плода.'
    reason: Латинское area буквально обозначает гумно или место молотьбы, но сочетание с глаголом «прийти» требует естественной русской передачи и допускает эсхатологический оттенок.
lexical_decisions:
- source_word: granum seminis mali
  choice: зерно злого семени
  rationale: Сохраняет конкретный земледельческий образ и связь между зерном и последующим плодом нечестия; формулировка не сводит образ к отвлечённому «началу зла».
- source_word: in corde Adam
  choice: в сердце Адама
  rationale: Прямая и естественная передача латинского оборота без добавления учения о способе наследования зла.
- source_word: impietatis
  choice: нечестия
  rationale: Передаёт религиозно-нравственный смысл impietas и сохраняет возвышенный библейский регистр.
- source_word: usque cum ueniat area
  choice: пока не наступит время молотьбы
  rationale: Буквально area — «гумно, место молотьбы», однако выражение «пока не придёт гумно» по-русски непонятно. Передача через наступление времени молотьбы сохраняет образ созревшего урожая и естественно звучит.
- source_word: Aestima autem apud te
  choice: Сам же подумай
  rationale: Передаёт призыв адресату лично обдумать или оценить сказанное; избегает неестественного буквализма «оцени у себя».
- source_word: granum mali
  choice: зерно зла
  rationale: Сохраняет более краткую форму исходного текста и её связь с ранее названным «зерном злого семени».
theological_decisions:
- issue: Природа зла, посеянного в сердце Адама
  choice: Сохранён образ посеянного зерна без пояснения его происхождения или способа передачи потомкам.
  alternative: Истолковать зерно как первородный грех, наследственную вину либо внешнее искушение.
  rationale: Латинский текст сам не разрешает эти богословские вопросы; перевод не должен вносить конфессионально обусловленное толкование.
- issue: Эсхатологический смысл area
  choice: Сохранён образ молотьбы с примечанием о буквальном значении.
  alternative: Передать как «Суд», «конец века» или «жатва».
  rationale: Такие варианты explicируют вероятную эсхатологическую отсылку, но устраняют образную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Земледельческая метафора сохранена, синтаксис упрощён для ясности. Заключительный призыв передан как самостоятельное предложение, без попытки дополнить его толкованием из следующего стиха.
