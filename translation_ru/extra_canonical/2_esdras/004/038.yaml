    reason: Поясняет намеренно сохранённую незавершённость фразы и не восполняет отсутствующий текст.
lexical_decisions:
- source_word: Et respondi et dixi
  choice: И я ответил и сказал
  rationale: Сохранена характерная для библейского повествования двойная формула речи; она понятна современному читателю и точно передаёт латинский текст.
- source_word: O dominator domine
  choice: О Владыка Господь
  rationale: 'Оба обращения переданы отдельно: dominator — «Владыка», domine — «Господь». Это сохраняет торжественный характер и не сводит два латинских слова к одному титулу.'
- source_word: sed et
  choice: но и
  rationale: Буквально и естественно передаёт незавершённую связку; продолжение нельзя восполнять по догадке.
theological_decisions:
- issue: Передача обращения dominator domine
  choice: О Владыка Господь
  alternative: О Господь, Который правит
  rationale: Выбранный вариант сохраняет два титула и традиционно возвышенный регистр, не добавляя пояснительного придаточного и не вводя конфессионально окрашенного толкования.
- issue: Незавершённость высказывания
  choice: Сохранить обрыв после «но и»
  alternative: Восполнить продолжение по иной текстовой традиции
  rationale: Предоставленный латинский источник обрывается на sed et; восполнение разрешило бы текстологическую неопределённость без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, торжественным оттенком. Начальное mensura («мера») не включено, поскольку по форме это окончание предшествующего предложения, стоящее перед началом данного стиха в предоставленном фрагменте.
