source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: festinant reddere ea quae commendata sunt ab initio. Tunc tibi demonstrabitur de his, quae concupiscis uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/043.yaml
  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: ru
  text: Они спешат возвратить то, что было вверено от начала. Тогда тебе будет показано то, что ты желаешь увидеть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant reddere
  choice: спешат возвратить
  rationale: Передаёт и значение поспешности, и идею возвращения вверенного.
- source_word: ea quae commendata sunt
  choice: то, что было вверено им
  rationale: Latin commendata sunt обозначает переданное на хранение или доверенное; добавленное «им» естественно по-русски и подразумевается контекстом.
- source_word: ab initio
  choice: от начала
  rationale: Сохраняет формальную и потенциально богословски значимую неопределённость латинского оборота, не сводя его к простому «с самого начала».
- source_word: demonstrabitur
  choice: будет показано
  rationale: Точно сохраняет пассивную конструкцию и не называет действующее лицо.
- source_word: concupiscis uidere
  choice: желаешь увидеть
  rationale: В данном контексте concupiscere выражает сильное желание; нейтральное «желаешь» не вносит отрицательного оттенка похоти.
theological_decisions:
- issue: Неуказанный деятель в demonstrabitur
  choice: 'сохранён страдательный залог: «будет показано»'
  alternative: «Бог покажет тебе»
  rationale: Источник не называет деятеля; его явное отождествление с Богом было бы интерпретационным добавлением.
- issue: Смысл ab initio
  choice: «от начала»
  alternative: «с самого начала» или «при начале»
  rationale: Выбранная формулировка сохраняет возможную отсылку к изначальному установлению, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис ясен, пассивная форма источника сохранена там, где она удерживает смысловую неопределённость.
