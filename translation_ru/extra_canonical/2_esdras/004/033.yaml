  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: ru
  text: 'И я ответил: «Как долго и когда это будет? Почему наши годы кратки и полны зла?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  choice: Как долго и когда это совершится?
  rationale: Латинское quo в данном контексте передаёт вопрос о пределе или продолжительности ожидания; haec естественно раскрыто как «это совершится», чтобы вопрос звучал ясно по-русски.
- source_word: modici
  choice: кратки
  rationale: О годах modici означает «немногочисленны, ограниченны»; «кратки» естественно выражает малую продолжительность жизни.
- source_word: mali
  choice: полны зла
  rationale: Сохраняет широкий смысл латинского mali — годы бедственные и отмеченные злом, не сводя его лишь к страданию.
- source_word: anni nostri
  choice: годы нашей жизни
  rationale: Контекстуально уточняет, что речь идёт об отпущенных людям годах жизни, а не о календарных годах.
theological_decisions:
- issue: Характер «злых» лет
  choice: полны зла
  alternative: бедственны
  rationale: Выбранный вариант сохраняет нравственную и экзистенциальную многозначность mali и не ограничивает её только несчастьями.
translation_notes:
  register: Современный литературный русский язык; вопросительная интонация и напряжённость жалобы сохранены. Формула «И я спросил» естественно передаёт латинское «Et ... respondi et dixi» без тяжеловесного буквального удвоения.
