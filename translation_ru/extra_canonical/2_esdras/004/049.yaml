source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'transisset flamma et uidi et ecce superauit fumus. Et post hoc transiit coram me nubs plena aquae et inmisit pluuiam impetu multam, et cum transisset impetus pluuiae superauerunt in ea guttae. Et dixit ad me ; cogita tibi ; sicut enim crescit pluuia amplius quam guttae et ignis amplius quam fumus, sic superhabundauit quae transiuit mensura, superauerunt autem guttae et fumus. Et oraui et dixi : putas uiuo usque in diebus illis ? uel quis erit in diebus illis ? Respondit ad me et dixit : de signis de quibus me interrogas, ex parte possum tibi dicere, de uita autem tua non sum missus dicere tibi, sed nescio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/049.yaml
  text: and behold[a], smoke remained behind. After this a cloud full of water passed before me and sent forth a great driving rain, and when the force of the rain had passed, drops remained behind in it.
translation:
  language: ru
  text: 'После того как прошло пламя, я увидел: вот, дым остался. После этого передо мной прошло облако, полное воды, и пролило обильный, бурный дождь; когда напор дождя прошёл, в облаке остались капли.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauit / superauerunt
  choice: «остался» / «оставались»
  rationale: 'В данном сравнении глагол обозначает то, что остаётся после прохождения основного явления: дым после огня и капли после напора дождя.'
- source_word: nubs plena aquae
  choice: «облако, полное воды»
  rationale: Сохраняет конкретный образ латинского текста и звучит естественно в современном русском.
- source_word: inmisit pluuiam impetu multam
  choice: «пролило обильный, бурный дождь»
  rationale: Передаёт одновременно обилие дождя и его напор, избегая тяжеловесной буквальной конструкции.
- source_word: cum transisset impetus pluuiae
  choice: «когда напор дождя иссяк»
  rationale: Передаёт прекращение сильной фазы дождя; «напор» соответствует impetus и сохраняет противопоставление отдельным каплям.
- source_word: in ea
  choice: «в облаке»
  rationale: Явно сохраняет указание латинского текста на то, что капли оставались в облаке; повтор существительного устраняет неясность русского местоимения.
