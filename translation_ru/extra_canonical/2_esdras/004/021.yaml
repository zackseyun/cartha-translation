source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: ru
  text: «Ведь как земля отдана лесу, а море — своим волнам, так и живущие на земле могут понимать лишь то, что на земле, а тот, кто над небесами[a], — то, что над небесами».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинское qui может быть понято и как множественное число: «те, кто над небесами»; однако древние сирийская и эфиопская версии поддерживают единственное число.'
    reason: Сохраняет реальную грамматическую неоднозначность латинского свидетельства, одновременно объясняя основание основного чтения.
lexical_decisions:
- source_word: terra siluae data est
  choice: земля отдана лесу
  rationale: Сохранён необычный, но ясный образ латинского текста без попытки заменить его более привычной формулировкой.
- source_word: mare fluctibus suis
  choice: море — своим волнам
  rationale: Передано естественно по-русски с сохранением притяжательного suis и параллелизма первой части.
- source_word: intellegere solummodo possunt
  choice: могут понимать лишь
  rationale: Точно передаёт ограничительное solummodo и модальное possunt в современном литературном русском.
- source_word: qui super caelos
  choice: Тот, Кто над небесами
  rationale: Латинское qui формально допускает разные числа, однако контраст с живущими на земле и свидетельство древних дочерних версий поддерживают единственное число с подразумеваемым указанием на Бога.
theological_decisions:
- issue: Кого обозначает второе qui
  choice: Тот, Кто над небесами
  alternative: те, кто над небесами
  rationale: Единственное число сохраняет противопоставление земных людей Всевышнему и согласуется с отражённым в сирийской и эфиопской традициях греческим чтением; при этом имя Бога не добавлено в основной текст.
- issue: Эллипсис сказуемого в заключительной части
  choice: — то, что над небесами
  alternative: может понимать то, что над небесами
  rationale: Сохранён лаконичный параллелизм источника; пропущенное сказуемое легко восстанавливается из предыдущей части и не меняет смысла.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью; синтаксический параллелизм и необычная образность латинского источника сохранены. Заглавные буквы в «Тот, Кто» ненавязчиво обозначают подразумеваемого Бога, не вводя отсутствующего в источнике имени.
