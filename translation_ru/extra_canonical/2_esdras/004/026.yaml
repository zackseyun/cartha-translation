source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'inuocatum est super nos? de his interrogaui. Et respondit ad me et dixit: si fueris uidebis, et si uixeris frequenter miraberis,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/026.yaml
  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Если будешь[a], увидишь; и если проживёшь, часто будешь изумляться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если будешь»; что именно подразумевается, в латинском тексте не уточняется.'
    reason: Поясняет намеренно сохранённую эллиптическую и неоднозначную формулировку si fueris.
lexical_decisions:
- source_word: si fueris
  choice: если будешь
  rationale: 'Сохранена необычная и незавершённая формулировка латинского текста: fueris передано отдельно от последующего si vixeris, без добавления подразумеваемого дополнения.'
- source_word: uidebis
  choice: увидишь
  rationale: Прямое и естественное соответствие будущему времени латинского глагола.
- source_word: si uixeris
  choice: если проживёшь
  rationale: Передаёт условную форму от vivere и сохраняет её отличие от предшествующего si fueris; «проживёшь» естественно указывает на продолжение жизни.
- source_word: frequenter miraberis
  choice: часто будешь изумляться
  rationale: Frequenter означает «часто», без добавления идеи «достаточно долго»; mirari передано современным литературным глаголом «изумляться».
- source_word: respondit ad me et dixit
  choice: ответил мне и сказал
  rationale: Сохранена характерная для библейского повествования парная формула исходного текста.
theological_decisions:
- issue: Неясность выражения si fueris
  choice: Сохранить эллиптическое «если будешь» и пояснить его в сноске.
  alternative: Истолковать как «если доживёшь» или «если останешься в живых».
  rationale: Латинский текст не называет состояния или срока и противопоставляет si fueris следующему si uixeris; явное уточнение сняло бы подлинную текстовую неясность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской повествовательной формулой. Необычность первой условной фразы сохранена как особенность источника, а не сглажена толкованием.
