  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
translation:
  language: ru
  text: Ибо зло, о котором ты спрашиваешь меня, посеяно, и его жатва ещё не пришла. Поэтому, если оно не будет сжато,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Seminatum est
  choice: уже посеяно
  rationale: Передаёт совершённость действия и сохраняет сельскохозяйственный образ; «уже» естественно выражает латинский перфект в данном противопоставлении.
- source_word: malum
  choice: зло
  rationale: Прямое и контекстуально естественное соответствие латинскому существительному среднего рода.
- source_word: destrictio ipsius
  choice: жатва его
  rationale: 'Здесь destrictio следует понимать как собирание урожая, а не уничтожение: это согласуется с seminatum и последующим messum, сохраняя последовательную метафору посева и жатвы.'
- source_word: messum fuerit
  choice: будет сжато
  rationale: Латинское metere означает жать; форма передана безлично в соответствии с malum и условной конструкцией.
theological_decisions:
- issue: Смысл destrictio в образе зла
  choice: жатва
  alternative: уничтожение
  rationale: 'Выбор не задаёт особого богословского толкования, а сохраняет развёрнутую в исходном тексте аграрную метафору: зло посеяно, его жатва ещё не наступила, и оно должно быть сжато.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Незавершённая условная фраза в конце сохранена, поскольку стих продолжается в следующем контексте.
