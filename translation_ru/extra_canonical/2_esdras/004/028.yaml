  terminology: «Зло», «посеяно», «жатва» и «сжато» точно и последовательно передают лексику и аграрную метафору исходного текста. Конфликтующий английский след с вариантом «destruction» не должен отменять более вероятное значение латинского *destrictio* в ближайшем контексте.
