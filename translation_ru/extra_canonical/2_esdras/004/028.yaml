  to: Ибо зло, о котором ты спрашиваешь меня, посеяно, и его жатва ещё не пришла. Поэтому, если оно не будет сжато,
  rationale: 'Исправлены добавочное «уже» и противопоставительное «но», чтобы точнее следовать латинскому тексту. «Жатва» сохранена для *destrictio*, поскольку она согласуется с *seminatum* и *messum fuerit* и не разрушает развёрнутую аграрную метафору. Сноска не нужна: вариант «уничтожение» в английском аудиторском следе не отражает выбранного, контекстуально мотивированного значения.'
