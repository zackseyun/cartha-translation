  text: 'et oravi et dixi: putas vivo usque in diebus illis, vel quiserit in diebus illis? respondit ad me et dixit: de signis de quibus me'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: ru
  text: 'И я помолился и сказал: «Как ты думаешь, доживу ли я до тех дней? Или кто будет в те дни?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: putas
  choice: «Как ты думаешь»
  rationale: Передаёт вопросительное вводное выражение естественным современным русским языком.
- source_word: vivo usque in diebus illis
  choice: «доживу ли я до тех дней»
  rationale: Латинская конструкция, вероятно, отражает смысл «останусь ли я в живых до тех дней»; глагол «доживу» выражает это кратко и естественно.
- source_word: vel quiserit in diebus illis
  choice: «Или кто будет жить в те дни?»
  rationale: Текст, вероятно, следует понимать как vel quis erit; перевод сохраняет открытый вопрос о том, кто окажется жив в те дни.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конечные слова латинского источника «respondit ad me et dixit: de signis de quibus me» представляют начало следующего ответа и не включены, поскольку английский консультационный текст и границы данного стиха заканчиваются вопросом.'
