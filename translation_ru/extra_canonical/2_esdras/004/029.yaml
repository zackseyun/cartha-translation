  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: ru
  text: Ибо если то, что было посеяно, не будет пожато[a], и место, где было посеяно зло, не исчезнет, то не явится поле, где было посеяно добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинской рукописной традиции здесь пропущены слова; «не будет пожато» передаёт смысл принятого восстановления.
    reason: textual_difficulty
lexical_decisions:
- source_word: seminatum est
  choice: было посеяно
  rationale: Перфектная пассивная форма трижды передана одинаково, чтобы сохранить видовое значение и строгий параллелизм исходного текста.
- source_word: discesserit
  choice: не исчезнет
  rationale: В данном контексте речь идёт об устранении места зла; «не исчезнет» естественно передаёт значение ухода или прекращения существования.
- source_word: ueniet
  choice: придёт
  rationale: Буквальное пространственно-временное выражение сохранено, поскольку оно обозначает наступление будущего порядка и не нуждается в истолковывающей замене.
- source_word: ager
  choice: поле
  rationale: Сохраняется земледельческий образ и противопоставление места, где посеяно зло, полю, где посеяно добро.
theological_decisions:
- issue: Временная соотнесённость посева зла и добра
  choice: Во всех трёх случаях сохранено «было посеяно».
  alternative: 'Передать посев добра настоящим временем: «где сеется добро».'
  rationale: Одинаковая латинская форма seminatum est указывает на завершённость посева как зла, так и добра; перевод не должен ослаблять этот параллелизм или разрешать эсхатологическое напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, но торжественным синтаксисом. Повтор «было посеяно» намеренно сохранён ради риторического параллелизма.
