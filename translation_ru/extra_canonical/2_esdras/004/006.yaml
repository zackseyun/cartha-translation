  source_fidelity: В целом переданы quis natorum, poterit hoc facere и обращение ко второму лицу. Однако de his — множественное «об этих вещах», тогда как «об этом» вносит неоправданное единственное число. Связь с ut сохраняется в русской конструкции с «что», без ложного истолкования её как цели.
  naturalness: '«Способен сделать это, что...» звучит по-русски неестественно: после «сделать это» требуется более идиоматичное соотнесение с последующим придаточным. «Способен на такое, что...» сохраняет напряжённую риторическую конструкцию оригинала, но читается литературно.'
  terminology: «Из рождённых» оправданно сохраняет отмеченную в исходнике широту natorum. Формула «Я ответил и сказал» уместна для библейского регистра; специальных богословских терминов нет.
