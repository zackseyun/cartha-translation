  yaml_path: translation/extra_canonical/2_esdras/004/006.yaml
  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: ru
  text: 'Я ответил и сказал: «Кто из рождённых способен на такое, что ты спрашиваешь меня об этих вещах?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: natorum
  choice: из рождённых
  rationale: Сохраняет необычное, но понятное обозначение смертных существ исходного текста, не сужая его до «людей» без текстового основания.
- source_word: poterit hoc facere
  choice: способен сделать это
  rationale: Естественно передаёт значение возможности/способности латинского poterit facere.
- source_word: de his
  choice: об этом
  rationale: Передаёт указательное значение «об этих вещах» в естественной современной русской форме.
theological_decisions:
- issue: Круг лиц, обозначенных natorum
  choice: из рождённых
  alternative: из людей
  rationale: Буквальная формулировка сохраняет возможную широту и риторическую силу выражения, не вводя отсутствующего в латинском тексте уточнения.
- issue: Связь придаточного ut me interroges de his с риторическим вопросом
  choice: что ты спрашиваешь меня об этом
  alternative: чтобы ты спрашивал меня об этом
  rationale: Союз «что» сохраняет трудную причинно-следственную/результативную связь оригинала и соответствует прямому характеру английского консультационного слоя, не превращая вопрос в выражение цели.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской формулы «ответил и сказал». Риторическая конструкция намеренно оставлена несколько напряжённой вслед за латинским текстом.
