source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: ru
  text: И я пришла, как видишь, на это поле. Я решила больше не возвращаться в город, а остаться здесь. Не буду ни есть, ни пить, но непрестанно буду скорбеть и поститься, пока не умру».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogito ... non reuerti ... sed hic consistere
  choice: Я решила больше не возвращаться… а остаться здесь
  rationale: 'Cogito с инфинитивами здесь выражает намерение или твёрдое решение, а iam non — прекращение действия: «больше не».'
- source_word: in hoc campo
  choice: на это поле
  rationale: Передаёт конкретное открытое место, на которое пришла говорящая; «поле» сохраняет прямое значение campus.
- source_word: sine intermissione lugere et ieiunare
  choice: непрестанно буду скорбеть и поститься
  rationale: Сохраняет два параллельных действия и значение непрерывности, выраженное sine intermissione.
- source_word: usque dum moriar
  choice: пока не умру
  rationale: Естественно и точно передаёт предельный срок действия.
