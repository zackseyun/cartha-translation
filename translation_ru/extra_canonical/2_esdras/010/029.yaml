source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum essem loquens ego haec, et ecce venit ad me angelus qui in principio venerat ad me et vidit me,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: ru
  text: И когда я говорил это, вот, пришёл ко мне ангел, который приходил ко мне вначале, и увидел меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  choice: И когда я говорил это
  rationale: Естественно передаёт латинскую временную конструкцию; местоимение ego отдельно не выражено, поскольку в русском оно было бы избыточно.
- source_word: et ecce
  choice: вот
  rationale: Сохраняет внезапность и повествовательный акцент латинского ecce.
- source_word: qui in principio venerat ad me
  choice: который приходил ко мне вначале
  rationale: Плюсквамперфект venerat передан по смыслу как предшествующее явление ангела; «вначале» сохраняет буквальную и контекстуально неоднозначную формулировку in principio.
- source_word: et vidit me
  choice: и увидел меня
  rationale: Прямо передаёт латинский текст, не устраняя возможную повествовательную необычность повторного упоминания встречи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксический повтор «пришёл ко мне… приходил ко мне» сохранён ради близости к источнику, несмотря на некоторую стилистическую тяжеловесность.
