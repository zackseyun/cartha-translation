  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: ru
  text: Итак, удержи свою скорбь в себе и мужественно перенеси постигшие тебя несчастья.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam dolorem tuum
  choice: удержи свою скорбь в себе
  rationale: Передаёт призыв сдержать и хранить скорбь внутри себя; женская форма повелительного наклонения соответствует латинскому ipsam.
- source_word: fortiter fer
  choice: мужественно перенеси
  rationale: Сохраняет значение стойкого, отважного перенесения страданий и естественно звучит по-русски.
- source_word: casus
  choice: несчастья
  rationale: В данном контексте слово обозначает постигшие женщину бедствия, а не нейтральные события или случайности.
- source_word: nunc ergo
  choice: итак
  rationale: Выражает итоговый переход и следствие; отдельное «теперь» в русском здесь было бы избыточным.
