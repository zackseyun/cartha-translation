  source_fidelity: «Итак» адекватно передаёт выводное nunc ergo. «Удержи свою скорбь в себе» точно отражает retine apud temet ipsam dolorem tuum, включая акцент на внутреннем переживании; отсутствие грамматически выраженного женского рода в русском неизбежно и не меняет адресации. «Мужественно перенеси постигшие тебя несчастья» верно передаёт fortiter fer quae tibi contigerunt casus.
