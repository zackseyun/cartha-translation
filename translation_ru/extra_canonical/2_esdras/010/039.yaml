  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: ru
  text: Ибо он увидел, что твой путь праведен[a], потому что ты непрестанно скорбел о своём народе и горько оплакивал Сион.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «твой прямой путь».'
    reason: Сохраняет прозрачность буквального образа латинского rectam uiam при контекстуальном нравственном переводе в основном тексте.
lexical_decisions:
- source_word: rectam uiam tuam
  choice: что твой путь праведен
  rationale: Передаёт буквальный образ «прямого пути» и его контекстуальный нравственный смысл; такая конструкция звучит естественнее по-русски, чем «твой праведный путь».
- source_word: sine intermissione contristabaris
  choice: ты непрестанно скорбел
  rationale: Сохраняет длительность и непрерывность скорби, выраженные imperfectum и оборотом sine intermissione.
- source_word: ualde lugebas
  choice: глубоко оплакивал
  rationale: Передаёт усиление ualde и продолжительный характер lugebas естественным современным русским выражением.
theological_decisions:
- issue: Нравственный или пространственный смысл rectam uiam
  choice: 'Нравственный смысл сохранён в основном тексте: «твой путь праведен».'
  alternative: «твой путь прям» / «твой прямой путь»
  rationale: Контекст характеризует отношение и поведение Ездры — его непрестанную скорбь о народе и Сионе, — а не направление движения; метафора пути при этом сохранена.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Причинное quoniam передано словом «потому что»; параллелизм двух глаголов скорби сохранён.
