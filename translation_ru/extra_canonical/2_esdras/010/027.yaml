source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et ecce amplius mulier non conparebat mihi, sed civitas aedificabatur et locus demonstrabatur de fundamentis magnis. et timui et clamavi voce magna et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: ru
  text: 'И вот, женщина больше не являлась мне, а город строился, и открывалось место с великими основаниями.[a] Я испугался, громко вскрикнул и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и открывалось место от великих оснований».'
    reason: Латинское de fundamentis magnis может быть понято более буквально как указание на исходную точку, хотя в позднелатинском употреблении вероятнее характеризует само место.
lexical_decisions:
- source_word: et ecce
  choice: И вот
  rationale: Сохраняет вводную формулу внезапного видения и её библейскую выразительность.
- source_word: amplius ... non conparebat mihi
  choice: передо мной уже не было видно
  rationale: Естественно передаёт прекращение явления женщины наблюдателю, не добавляя отсутствующего в источнике действия «я посмотрел».
- source_word: civitas aedificabatur
  choice: воздвигался город
  rationale: Передаёт незавершённое пассивное действие латинского imperfectum и сохраняет возвышенный, но понятный регистр.
- source_word: locus demonstrabatur
  choice: открывалось место
  rationale: В контексте видения demonstrabatur означает, что место становилось зримым или было показано; безлично-пассивный оттенок сохранён.
- source_word: de fundamentis magnis
  choice: с великими основаниями
  rationale: Позднелатинское de с аблативом здесь естественно понимать как характеристику места, а не как указание исходной точки; «основания» сохраняет образ источника.
- source_word: clamavi voce magna
  choice: громко вскрикнул
  rationale: Идиоматично передаёт буквальное «воскликнул громким голосом» и уместно выражает испуг.
theological_decisions:
- issue: Связь города и места с великими основаниями
  choice: 'Сохранены как два грамматически координированных образа: город воздвигался, место открывалось.'
  alternative: Слить их в один образ города, открывающегося на великих основаниях.
  rationale: Латинский текст различает civitas и locus двумя подлежащими и двумя сказуемыми; перевод не должен устранять эту возможную смысловую напряжённость.
- issue: Значение de fundamentis magnis
  choice: 'Характеристика места: «с великими основаниями».'
  alternative: «от великих оснований» или «из великих оснований».
  rationale: В переводной поздней латыни de + ablativus может заменять родительный падеж качества; однако буквальное пространственное прочтение остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сохраняет последовательность видения, страха и возгласа; архаизмы и конфессионально окрашенные формулировки исключены.
