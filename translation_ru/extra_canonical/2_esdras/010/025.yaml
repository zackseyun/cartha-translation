  text: Et factum est cum loquebar ad eam, et ecce facies eius fulgebat ualde subito et species coruscus fiebat uultus eius, ut etiam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: ru
  text: И когда я говорил с ней, вот, лицо её внезапно засияло чрезвычайно ярко, и вид лица её стал сверкающим[a], так что даже [я сильно испугался её].[25]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внезапно лицо её чрезвычайно ярко засияло, и весь её облик засверкал».'
    reason: previous_rendering
  - marker: '25'
    text: Латинский текст обрывается в конце стиха на словах ut etiam («так что даже»). Слова в квадратных скобках восстановлены по древним переводам, в которых говорится, что рассказчик сильно испугался её.
    reason: textual_variant
lexical_decisions:
- source_word: Et factum est cum loquebar ad eam
  choice: И когда я говорил с ней
  rationale: Естественная русская передача латинской повествовательной формулы без тяжеловесной кальки «и случилось».
- source_word: et ecce
  choice: вдруг
  rationale: В данном контексте передаёт внезапность и привлекающую внимание функцию ecce; отдельное «вот» сделало бы фразу менее естественной.
- source_word: fulgebat ualde subito
  choice: чрезвычайно ярко засияло
  rationale: Сохраняет усиление ualde и внезапный переход к сиянию; subito передано словом «вдруг» перед всем описанием преображения.
- source_word: species coruscus fiebat uultus eius
  choice: облик её лица стал сверкать
  rationale: Передаёт species и vultus eius как единую конструкцию, не превращая их в два самостоятельных субъекта; необычность латинского выражения сохранена.
theological_decisions:
- issue: Восстановление оборванного окончания после ut etiam
  choice: так что даже [я сильно испугался её]
  alternative: так что даже…
  rationale: Латинский основной текст обрывается после «так что даже», однако дочерние версии свидетельствуют о страхе рассказчика. Восстановление заключено в квадратные скобки, чтобы не скрывать состояние латинского свидетельства.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной повествовательной интонацией. Необычный образ сияющего и сверкающего лица сохранён без конфессионального истолкования.
