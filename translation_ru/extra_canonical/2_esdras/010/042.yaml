  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: ru
  text: 'Ты не видишь облика женщины, но тебе явился строящийся город. И то, что она рассказывала тебе о несчастье, постигшем её сына, — вот истолкование этого:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non speciem mulieris uides
  choice: Ты видишь уже не облик женщины
  rationale: Передаёт отрицание и объект «облик женщины» естественным русским порядком слов; латинское non при uides не содержит отдельного слова со значением «теперь».
- source_word: apparuit tibi ciuitas aedificari
  choice: тебе явился строящийся город
  rationale: Сохраняет характер видения в apparuit и незавершённый процесс строительства, выраженный aedificari.
- source_word: de casu filii sui
  choice: о гибели своего сына
  rationale: В данном повествовательном контексте casus обозначает трагическую участь — смерть сына; «гибель» звучит естественно и сохраняет тяжесть события.
- source_word: haec absolutio est
  choice: означает следующее
  rationale: Здесь absolutio вводит разгадку или истолкование видения; формула естественно подводит к последующему объяснению.
theological_decisions:
- issue: Соотношение женщины и города в видении
  choice: Не отождествлять их пояснительной вставкой, а сохранить переход от одного образа к другому
  alternative: «Женщина превратилась в город»
  rationale: Латинский текст говорит лишь, что облик женщины более не виден и явился город; он не формулирует прямо механизм превращения.
- issue: Значение absolutio
  choice: «означает следующее»
  alternative: «вот разрешение этого» / «вот истолкование»
  rationale: Так сохраняется функция вводной формулы перед объяснением без привнесения специальной богословской терминологии.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены обращение на «ты», образный язык видения и двоеточие, вводящее дальнейшее истолкование.
