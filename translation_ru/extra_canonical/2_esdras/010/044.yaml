translation:
  language: ru
  text: Женщина, которую ты видел, — это Сион, который ты теперь видишь как построенный город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ut ciuitatem aedificatam
  choice: как отстроенный город
  rationale: 'Латинское aedificatam — причастие совершённого вида: город представлен как уже возведённый или отстроенный. Такая формулировка точнее исходного текста, чем «строящийся город», и при этом естественна по-русски.'
- source_word: Sion
  choice: Сион
  rationale: Сохранено традиционное русское библейское наименование; грамматический переход от женщины к Сиону передан сменой рода в относительной конструкции.
- source_word: conspicis
  choice: предстаёт перед тобой
  rationale: Контекст видения допускает естественную передачу зрительного восприятия через «предстаёт перед тобой», без избыточного повторения глагола «видеть».
theological_decisions:
- issue: Отождествление женщины с Сионом
  choice: 'Прямое отождествление сохранено: «это Сион»'
  alternative: «олицетворяет Сион»
  rationale: Исходная конструкция утверждает тождество образа, а не объясняет его как простую литературную персонификацию; более интерпретирующее «олицетворяет» ослабило бы формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; сохранены образ видения и грамматически необходимый переход от женского рода («женщина») к мужскому («Сион», «город»).
