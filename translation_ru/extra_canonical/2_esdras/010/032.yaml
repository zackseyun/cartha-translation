  text: 'dixi: Quoniam derelinquens dereliquisti me: ego quidem feci secundum sermones tuos et exiui in campum et ecce uidi et uideo quod non possum enarrare. et dixit ad me: Sta ut uir et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: ru
  text: 'И я сказал: «Потому что ты совсем оставил меня. Я сделал, как ты велел, и вышел в поле — и вот, я увидел и до сих пор вижу то, чего не могу описать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquens dereliquisti me
  choice: ты совсем оставил меня
  rationale: Повтор однокоренных форм служит усилению; по-русски его естественно передать наречием «совсем», сохраняя упрёк и не добавляя отсутствующих в тексте смыслов.
- source_word: secundum sermones tuos
  choice: как ты велел
  rationale: В данном контексте выражение означает действие согласно сказанному наставлению; «как ты велел» звучит естественно и точно передаёт практический смысл слов.
- source_word: ecce
  choice: и вот
  rationale: Сохранён указательный маркер внезапного и поразительного зрелища.
- source_word: uidi et uideo
  choice: я увидел и до сих пор вижу
  rationale: 'Передан контраст латинских времён: видение началось в прошлом и продолжается в момент речи.'
- source_word: quod non possum enarrare
  choice: то, чего не могу описать
  rationale: «Описать» естественно передаёт enarrare в связи с увиденным, сохраняя признание невозможности выразить пережитое словами.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясностью. Сохранены эмоциональный упрёк, последовательность действий и продолжающийся характер видения. Заключительные слова источника «et dixit ad me: Sta ut uir et» относятся к началу следующего стиха по принятому делению и поэтому в текст 10:32 не включены.'
