source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fit multitudo eorum. Quis ergo debet lugere magis nisi haec quae tam magnam multitudinem perdidit, quam tu quae pro
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/011.yaml
  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: ru
  text: Кому же, как не той, которая потеряла столь великое множество, следует скорбеть больше, чем тебе, скорбящей об одном?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugere
  choice: скорбеть
  rationale: Передаёт глубокую скорбь по утрате и соответствует возвышенному, но понятному современному русскому регистру.
- source_word: haec
  choice: той
  rationale: Сохраняет женский род и указательный характер латинского местоимения, не уточняя без достаточного основания, кто именно имеется в виду.
- source_word: tam magnam multitudinem
  choice: столь великое множество
  rationale: Близко передаёт количественный контраст оригинала и его торжественную риторическую окраску.
- source_word: quam tu
  choice: больше, чем тебе
  rationale: Явно выражает сравнительную конструкцию, подразумеваемую глаголом «скорбеть больше».
theological_decisions:
- issue: Личность женщины, потерявшей великое множество
  choice: Сохранено неопределённое «той»
  alternative: Уточнить как «Сиону» или «городу»
  rationale: Латинское haec само по себе не называет референта; уточнение внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической выразительностью. Сравнение сформулировано естественно; женский род и контраст между множеством и одним сохранены.
