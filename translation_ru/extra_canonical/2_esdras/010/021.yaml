source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vides enim, quoniam sanctificatio nostra deserta effecta est et altare nostrum demolitum est et templum nostrum destructum est,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: ru
  text: Ведь ты видишь, что наше святилище опустошено, наш жертвенник разрушен и наш храм уничтожен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio
  choice: святилище
  rationale: В данном контексте латинское sanctificatio обозначает освящённое место; «святилище» естественно по-русски и согласуется с параллельными упоминаниями жертвенника и храма.
- source_word: deserta effecta est
  choice: опустошено
  rationale: Передаёт состояние запустения и разорения, возникшее вследствие бедствия, без излишнего уточнения способа разрушения.
- source_word: altare
  choice: жертвенник
  rationale: Точный и привычный библейский термин для культового алтаря.
- source_word: demolitum est
  choice: разрушен
  rationale: Сохраняет значение снесённого или разрушенного сооружения и пассивный результат действия.
- source_word: templum
  choice: храм
  rationale: Стандартное и ясное соответствие латинскому templum в контексте Иерусалимского храма.
- source_word: destructum est
  choice: уничтожен
  rationale: Отличает эту формулировку от demolitum и передаёт усиленное значение полного разрушения.
