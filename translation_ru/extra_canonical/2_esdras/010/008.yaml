  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: ru
  text: Она унижена — скорбите изо всех сил. И теперь[a], поскольку все мы скорбим и печальны, поскольку все мы опечалены, — а ты…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, без конъектуры «мы печальны»: «Она унижена — скорбите изо всех сил. И теперь, поскольку все мы скорбим, а вы печальны, поскольку все мы опечалены, — ты…»'
    reason: 'Латинский текст в этом месте, вероятно, повреждён: tristes estis («вы печальны») нарушает последовательность форм первого лица множественного числа и обычно исправляется по контексту на tristes sumus («мы печальны»).'
lexical_decisions:
- source_word: humiliata est
  choice: Она унижена
  rationale: Передаёт латинский перфект пассивного залога без подмены его глаголом «скорбит».
- source_word: lugete ualidissime
  choice: скорбите о ней изо всех сил
  rationale: Сохраняет множественное повелительное наклонение lugete; «изо всех сил» естественно передаёт усилительное ualidissime, а «о ней» проясняет подразумеваемый объект скорби из контекста.
- source_word: tristes estis
  choice: мы … печальны
  rationale: 'Следует контекстуально вероятному чтению sumus, отражённому в проверенном английском слое: форма второго лица множественного числа нарушает параллелизм с omnes lugemus и omnes contristati sumus.'
- source_word: tu
  choice: а ты…
  rationale: Сохраняет резкий контраст и намеренно незавершённый конец предоставленного латинского фрагмента.
