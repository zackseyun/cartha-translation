  naturalness: «Душа моя грезит» — естественное литературное выражение с уместным библейским оттенком. «Мой разум обманут» кратко и понятно передаёт пассивную форму fallitur, хотя несколько более возвышенно, чем разговорная речь.
  terminology: «Разум» и «душа» сохраняют два разных обозначения внутренней жизни, представленные в конструкции. Богословски нагруженного переосмысления терминов не вносится.
