  yaml_path: translation/extra_canonical/2_esdras/010/036.yaml
  text: Or is my mind deceived, and is my soul dreaming?
translation:
  language: ru
  text: Или мой разум обманут, и душа моя грезит?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  choice: я обманываюсь
  rationale: Латинская форма в данном фрагменте лишена явно выраженного подлежащего, однако по контексту и английскому консультационному слою передаёт сомнение говорящего в собственном восприятии. Возвратное «обманываюсь» естественно сохраняет смысл заблуждения.
- source_word: anima mea
  choice: душа моя
  rationale: Формальное соответствие латинскому выражению; сохраняет различение между говорящим «я» и его душой, не сводя anima к одному лишь «разуму» или «сознанию».
- source_word: somniatur
  choice: грезит
  rationale: Передаёт состояние видения или переживания как во сне. «Грезит» здесь литературно и естественно, а также сохраняет возможность как буквального сна, так и кажущегося видения.
theological_decisions:
- issue: Различение говорящего и его души
  choice: Сохранено выражение «душа моя»
  alternative: «мне всё снится» или «мой разум грезит»
  rationale: Латинское anima mea прямо называет душу; нейтрализация устранила бы антропологическое выражение источника без текстового основания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «душа моя» сохраняет достоинство стиля и близость к латинской формулировке; пунктуация оформляет единый вопрос.
