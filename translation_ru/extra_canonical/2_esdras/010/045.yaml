source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fuit annis triginta, propter quod erant anni saeculo tres, quando non erat in ea adhuc oblatio oblata. Et factum est post annos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: ru
  text: А то, что она сказала тебе, будто была бесплодна тридцать лет, означает, что в мире прошло три тысячи лет[a], когда в ней ещё не приносили никаких приношений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский текст здесь сжат и труден: буквально — «в мире было три года». Перевод «три тысячи лет» следует символической хронологии этой главы, где тридцать лет женщины соответствуют гораздо более долгому периоду до начала приношений в Сионе.'
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: в мире
  rationale: В данном контексте слово обозначает ход мировой истории; это соответствует символическому соотнесению тридцати лет женщины с тремя тысячами лет до начала приношений в Сионе.
- source_word: oblatio oblata
  choice: не приносили никаких приношений
  rationale: Естественная русская передача латинской фигуры с однокоренными существительным и причастием, сохраняющая смысл жертвенного приношения.
- source_word: in ea
  choice: в ней
  rationale: 'Сохранён женский референт и символическая двусмысленность: речь идёт о женщине как образе Сиона.'
theological_decisions:
- issue: Символическая хронология тридцати лет и трёх тысяч лет
  choice: Передать три тысячи лет в основном тексте
  alternative: Буквально воспроизвести сжатое латинское «в мире было три года»
  rationale: Латинское чтение крайне сжато и, вероятно, отражает числовое соответствие, разъясняемое ближайшим контекстом главы; при этом трудность источника отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство библейского повествования сохранено без архаизации. Формула «а то, что… означает» ясно выражает толкование видения.
