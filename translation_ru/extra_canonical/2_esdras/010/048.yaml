source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: ru
  text: 'И то, что она сказала тебе[a]: «Мой сын, войдя в свой брачный чертог, умер, и с ним случилось несчастье», — было разрушением Иерусалима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А поскольку она сказала тебе: „Мой сын…“».'
    reason: 'Латинское quoniam допускает причинное «поскольку», тогда как в контексте оно также может вводить очередной разъясняемый элемент рассказа: «и то, что».'
lexical_decisions:
- source_word: thalamo
  choice: брачный чертог
  rationale: Передаёт значение латинского thalamus как помещения для новобрачных, сохраняя возвышенный, но понятный библейский регистр.
- source_word: casus
  choice: беда
  rationale: В данном контексте casus означает несчастье или бедствие; «беда» естественно сочетается с оборотом contigisset ei и не уточняет характер случившегося сверх источника.
- source_word: ruina Hierusalem
  choice: разрушение, постигшее Иерусалим
  rationale: Передаёт ruina как разрушение города и естественно выражает относительную конструкцию quae facta est, не добавляя толкования.
theological_decisions:
- issue: Прямая или косвенная речь после quod
  choice: 'Прямая речь: «Мой сын…»'
  alternative: 'Косвенная речь: «…что мой сын…»'
  rationale: Первое лицо meus принадлежит женщине; оформление как прямой речи устраняет ложное впечатление, будто речь идёт о сыне говорящего ангела, и вероятно отражает quod как вводное слово при цитате.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранены образ брачного чертога и отождествление рассказанного бедствия с разрушением Иерусалима.
