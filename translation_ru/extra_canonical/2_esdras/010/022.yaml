source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
translation:
  language: ru
  text: Наши гусли повержены[a], наш гимн умолк, наше ликование рассеялось; свет нашего светильника погас, ковчег нашего завета разграблен, наши святыни осквернены, и имя, призываемое над нами, едва не опорочено. Наши дети подверглись поруганию, наши священники сожжены, наши левиты уведены в плен, наши девы осквернены, наши женщины подверглись насилию, наши праведники похищены, наши малые дети преданы[b], наши юноши отданы в рабство, а наши сильные обессилели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наш струнный инструмент»; латинское слово обозначает псалтерий, древний щипковый инструмент.'
    reason: «Гусли» — близкое традиционное русское соответствие, но не точное название инструмента.
  - marker: b
    text: 'Или: «выданы врагу».'
    reason: Латинское proditi sunt может означать как предательство, так и передачу или выдачу во власть другого.
lexical_decisions:
- source_word: psalterium
  choice: гусли
  rationale: Латинское слово обозначает струнный щипковый инструмент. «Гусли» естественнее для русского библейского регистра, чем малопонятный «псалтерий», и не превращает инструмент в песню.
- source_word: humiliatum est
  choice: повержены
  rationale: Буквально возможно «унижены», но применительно к музыкальному инструменту «повержены» естественно передаёт образ унижения и падения.
- source_word: exultatio nostra dissoluta est
  choice: наше ликование угасло
  rationale: Буквальное «рассеялось/разрушилось» звучит по-русски неестественно; «угасло» передаёт прекращение радости и поддерживает плачевный тон.
- source_word: sancta nostra
  choice: наши святыни
  rationale: Передаёт субстантивированное множественное число «наши святые вещи» естественным русским религиозным словом.
- source_word: proditi sunt
  choice: преданы
  rationale: 'Сохраняет смысловую широту латинского причастия: малые могли быть выданы врагу или преданы в результате измены.'
- source_word: servierunt
  choice: стали рабами
  rationale: В контексте плена глагол означает рабское подчинение, а не просто служение.
- source_word: invalidi facti sunt
  choice: обессилели
  rationale: Кратко и естественно передаёт переход сильных в состояние бессилия.
theological_decisions:
- issue: Формула nomen quod nominatum est super nos
  choice: имя, наречённое над нами
  alternative: имя, которым мы названы
  rationale: Сохранена библейская формула принадлежности Божьему имени без уточнения, отсутствующего в тексте, чьё именно имя подразумевается.
- issue: Характер насилия над женщинами
  choice: подверглись насилию
  alternative: были изнасилованы
  rationale: Контекст допускает сексуальное насилие, однако латинское vim passae шире; перевод сохраняет эту смысловую напряжённость и не сужает выражение.
- issue: coinquinatae sunt о девах
  choice: осквернены
  alternative: обесчещены
  rationale: «Осквернены» сохраняет религиозно-нравственную окраску и не делает сексуальный характер действия более определённым, чем исходный текст.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Анафорическое повторение «наши» сохранено как важная часть плача. Архаизмы ограничены формулой «имя, наречённое над нами», где они помогают удержать исходный библейский образ.
