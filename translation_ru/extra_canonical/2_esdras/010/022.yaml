  source_fidelity: 'В целом перечисление и порядок бедствий переданы точно. Нужна правка «ликование угасло»: латинское dissoluta est означает скорее «рассеялось», «разрушилось», а образ угасания уже специально употреблён в следующей клаузе об огне светильника. Формула nomen quod nominatum est super nos точнее передаётся как «имя, призываемое над нами», а не как имя, просто данное народу.'
  naturalness: Текст звучит литературно и сохраняет плачевный библейский ритм. «Малые дети» понятнее современному читателю, чем субстантивированное «малые»; «отданы в рабство» яснее выражает принудительное servierunt в данном контексте.
  terminology: «Гусли» допустимы как традиционное русское соответствие psalterium при поясняющей сноске. «Святыни», «завет», «левиты» и «осквернены» уместны. Для proditi sunt «преданы» сохраняет неоднозначность, а сноска корректно указывает возможное значение выдачи врагу.
