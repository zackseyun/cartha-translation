  - severity: low
    issue: «Имя, наречённое над нами»
    rationale: «Наречённое» в современном русском скорее означает присвоенное имя и ослабляет значение nomen ... nominatum super nos — имени, призываемого/называемого над народом.
  - severity: low
    issue: «Наши малые» и «стали рабами»
    rationale: «Малые дети» естественнее для parvuli, а «отданы в рабство» отчётливее передаёт принудительное подчинение servierunt в перечне военных бедствий.
