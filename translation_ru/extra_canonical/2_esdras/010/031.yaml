  source_fidelity: Перевод точно передаёт три вопроса латинского текста и сохраняет повтор conturbari («встревожен / встревожены»). Координация intellectus tuus et sensus cordis tui воспроизведена как два отдельных подлежащих; множественное число сказуемого в русском естественно и проясняет конструкцию, не добавляя смысла.
  naturalness: Формулировки современны, литературны и пригодны для прямой речи. «Что с тобой?» — естественный эквивалент Quid tibi est; «твой разум и чувство твоего сердца» несколько образно, но намеренно сохраняет различение и образность исходника, не становясь непонятным.
  terminology: «Разум» обоснованно передаёт intellectus. «Чувство твоего сердца» сохраняет sensus cordis как самостоятельное, не до конца специфицированное внутреннее восприятие; замена на более интерпретирующие «мысли», «совесть» или «помышления» была бы менее нейтральной. Имена и специальные богословские термины отсутствуют.
