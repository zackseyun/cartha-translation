source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: ru
  text: 'и сказал мне: «Что с тобой? Почему ты встревожен? Почему встревожены твой разум и чувство твоего сердца?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi est
  choice: Что с тобой?
  rationale: Естественный современный русский эквивалент вопроса о состоянии человека.
- source_word: conturbaris / conturbatus est
  choice: ты встревожен / встревожены
  rationale: Сохраняет повтор латинского корня и передаёт внутреннее смятение без излишнего усиления.
- source_word: intellectus tuus
  choice: твой разум
  rationale: Прямо и понятно передаёт intellectus как способность понимания и мышления.
- source_word: sensus cordis tui
  choice: чувство твоего сердца
  rationale: Сохраняет отдельный от разума образ внутреннего восприятия, не сводя его к одной определённой способности.
theological_decisions:
- issue: Соотношение «разума» и «чувства сердца»
  choice: Сохранены как два однородных предмета внутреннего смятения.
  alternative: Объединить их в одно понятие, например «мысли твоего сердца».
  rationale: Латинский текст координирует intellectus и sensus cordis; объединение устранило бы присущую источнику смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и достойно. Начальное «и» сохранено, поскольку стих синтаксически продолжает предыдущий контекст; фрагмент «pedes meos» также относится к конструкции предыдущего стиха и сам по себе здесь не переводится.
