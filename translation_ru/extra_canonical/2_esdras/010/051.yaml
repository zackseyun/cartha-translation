  rationale: Прямое и естественное соответствие латинскому выражению.
- source_word: ubi domus non est aedificata
  choice: где не построено ни одного дома
  rationale: Сохраняет настоящее результативное состояние перфектной пассивной формы и по-русски ясно выражает отсутствие построенного дома.
