  yaml_path: translation/extra_canonical/2_esdras/010/007.yaml
  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: ru
  text: Видишь нашу скорбь и то, что с нами случилось?[a] Ведь Сион, мать всех нас, скорбит в печали и унижении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты видишь нашу скорбь и то, что с нами случилось». Латинская форма допускает прочтение как вопроса или как утверждения; вопросительный знак отражает пунктуацию издания.'
    reason: Сохранить грамматико-пунктуационную неоднозначность начала стиха.
lexical_decisions:
- source_word: luctum
  choice: скорбь
  rationale: Передаёт глубокое горе и траурный оттенок латинского существительного без сужения значения до формального плача.
- source_word: quae nobis contigerunt
  choice: то, что с нами случилось
  rationale: Естественно передаёт неопределённо-множественное quae и contigerunt, сохраняя общий характер постигших бед.
- source_word: Sion mater nostra omnium
  choice: Сион, мать всех нас
  rationale: Относит nostra omnium к mater и передаёт Сион как общую мать говорящих без дублирования слова «мать».
- source_word: in tristitia contristatur
  choice: скорбит в печали
  rationale: Сохраняет усилительное повторение однокоренных понятий в латинском, но выражает его доступно и достойно по-русски.
- source_word: humilitate
  choice: унижении
  rationale: В данном контексте обозначает униженное, подавленное состояние Сиона; форма с предлогом согласуется с параллельным in tristitia.
theological_decisions:
- issue: Образ Сиона как матери
  choice: Сион, мать всех нас
  alternative: Сион, наша общая мать
  rationale: Сохранён прямой материнский образ исходного текста без конфессионального уточнения того, кого именно представляет Сион.
- issue: Состояние Сиона в конце стиха
  choice: скорбит в печали и унижении
  alternative: скорбит в печали и была глубоко унижена
  rationale: Не добавлен отдельный глагол состояния, который относится к следующему стиху в свидетельстве Бенсли; сохранены точные границы данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Усилительная конструкция «скорбит в печали» намеренно сохраняет риторическую напряжённость латинского текста; архаизмы и добавления из соседнего стиха исключены.
