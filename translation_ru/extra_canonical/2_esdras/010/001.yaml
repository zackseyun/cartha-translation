lexical_decisions:
- source_word: thalamo
  choice: брачный покой
  rationale: Латинское thalamus в данном контексте обозначает комнату новобрачных; «брачный покой» естественно и точно передаёт смысл.
- source_word: cecidit
  choice: упал
  rationale: Сохранено прямое значение глагола cadere без добавления не выраженных в тексте причин или обстоятельств смерти.
