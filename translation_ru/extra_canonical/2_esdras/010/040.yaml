  text: 'lectus uisionis: mulier quae tibi apparuit ante paululum, Quam'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/040.yaml
  text: 'This, then, is the interpretation of the vision: the woman who appeared to you a little while ago, whom'
translation:
  language: ru
  text: 'Итак, вот истолкование видения: женщина, которая незадолго до этого явилась тебе и которую'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lectus uisionis
  choice: истолкование видения
  rationale: В данном контексте латинское выражение обозначает объяснение смысла увиденного; «истолкование» точнее передаёт функцию последующего разъяснения, чем более общее «значение».
- source_word: ante paululum
  choice: незадолго до этого
  rationale: Естественно передаёт небольшой промежуток времени до описываемого момента, не усиливая его до непосредственного «только что».
- source_word: Quam
  choice: и которую
  rationale: Сохранено начатое в источнике придаточное предложение, продолжающееся в следующем стихе; союз «и» естественно связывает два определения женщины по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и истолковательного контекста. Незавершённость фразы сохранена, поскольку латинский отрывок оканчивается относительным местоимением и синтаксически продолжается далее.
