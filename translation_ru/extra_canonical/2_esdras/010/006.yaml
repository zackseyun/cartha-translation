  text: In anger at her, I said, “Most foolish of all women, do you not see our mourning and what has happened to us?
translation:
  language: ru
  text: 'В гневе на неё я сказал: «Глупейшая из всех женщин, разве ты не видишь нашего горя и того, что с нами случилось?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iracundia ad eam et dixi
  choice: Разгневавшись на неё, я сказал
  rationale: Передаёт направленный на женщину гнев и вводную формулу речи естественным современным русским языком.
- source_word: Stulta super omnes mulieres
  choice: Самая неразумная из всех женщин!
  rationale: Латинское stulta обозначает отсутствие рассудительности; «неразумная» сохраняет упрёк, но звучит dignified и уместно в библейском повествовании. Super omnes передано превосходной степенью.
- source_word: non
  choice: Разве ты не
  rationale: Начало отрицательного риторического вопроса естественно передаётся русской конструкцией «Разве ты не…»; продолжение восстановлено по предоставленному аудированному английскому слою.
