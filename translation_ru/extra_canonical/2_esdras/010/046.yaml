  yaml_path: translation/extra_canonical/2_esdras/010/046.yaml
  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: ru
  text: 'Три события[a]: Соломон построил город и принёс приношения; тогда-то бесплодная родила сына. А то, что тебе было сказано: «…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало фразы в латинском тексте неясно: буквально — «три… Соломон построил город». Здесь оно понято как указание на три последующих события.'
    reason: Предупреждает читателя о синтаксической трудности источника и об интерпретационном характере связного перевода.
  - marker: b
    text: Фраза обрывается и продолжается в следующем стихе.
    reason: Объясняет незавершённую конструкцию с quoniam («что»); двоеточие вводит её дальнейшее содержание.
lexical_decisions:
- source_word: tres
  choice: Три события
  rationale: Латинское tres («три») синтаксически не согласуется с последующим текстом; добавленное «события» позволяет понять фразу как перечисление трёх событий, названных далее, не устраняя отмеченную в сноске трудность текста.
- source_word: aedificauit Salomon ciuitatem
  choice: Соломон построил город
  rationale: Прямо передаёт латинскую конструкцию с ciuitatem как прямым дополнением; вариант «построил в городе» не соответствует падежной форме источника.
- source_word: obtulit oblationes
  choice: принёс приношения
  rationale: Сохраняет намеренный этимологический повтор латинского выражения и его культовый смысл.
- source_word: tunc fuit quando
  choice: тогда-то
  rationale: Естественно и с умеренным усилением передаёт указание на совпадение во времени.
- source_word: peperit sterilis filium
  choice: бесплодная родила сына
  rationale: Сохраняет субстантивированное обозначение женщины и напряжение между её бесплодием и рождением сына.
- source_word: Et quod tibi dixit quoniam
  choice: А то, что было сказано тебе, что…
  rationale: Безличная конструкция не навязывает невыраженного в латинском подлежащего dixit и сохраняет незавершённость перехода к следующему стиху.
theological_decisions:
- issue: Связь трёх событий и образ бесплодной женщины
  choice: Представить строительство города, принесение приношений и рождение сына как три события, сохранив образ без толкования.
  alternative: Понимать tres как относящееся к неизвестному предмету, который Соломон якобы построил в городе.
  rationale: Латинская фраза повреждена или неполна; выбранное чтение даёт связный русский текст, но не превращает образ бесплодной женщины в конкретную богословскую идентификацию.
- issue: Подлежащее dixit
  choice: Использовать безличное «было сказано».
  alternative: «Она сказала тебе» или «он сказал тебе».
  rationale: В данном отрывке латинское подлежащее не названо; безличный перевод сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксически трудное начало сделано читаемым, но трудность исходного текста явно отмечена; конечная незавершённость сохранена многоточием.
