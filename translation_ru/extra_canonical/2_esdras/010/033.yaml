  text: I will remind you.” And I said[a], “Speak, my lord; only do not
translation:
  language: ru
  text: '«Я напомню тебе». И я сказал[a]: «Говори, господин мой, только не…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежней разбивке здесь передавались слова: «И он сказал мне: „Встань как мужчина, и я наставлю тебя“», однако в латинском источнике слова «И он сказал мне: „Встань как мужчина…“» относятся к концу предыдущего стиха.'
    reason: previous_rendering
lexical_decisions:
- source_word: commonebo
  choice: Я напомню тебе
  rationale: Будущее время от commoneo допускает значения «напомнить», «увещевать», «вразумлять». Здесь сохранено принятое в проверенном английском слое значение «напомню», не исключающее оттенка наставления.
- source_word: domine meus
  choice: господин мой
  rationale: Передаёт почтительное обращение к собеседнику без необоснованного отождествления слова domine с божественным титулом.
- source_word: tantum me noli
  choice: только не…
  rationale: Латинский отрывок обрывается после отрицательной повелительной конструкции noli; многоточие сохраняет незавершённость исходного стихового фрагмента и не восполняет отсутствующий глагол.
theological_decisions:
- issue: Кого обозначает обращение domine meus
  choice: господин мой
  alternative: Господь мой
  rationale: Контекст данного фрагмента сам по себе не требует божественного титула; строчная буква и слово «господин» сохраняют обращение к почитаемому собеседнику без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с почтительным, но естественным обращением. Кавычки в начале и конце показывают, что стих начинается продолжением речи из предыдущего стиха и завершается незаконченной репликой.
