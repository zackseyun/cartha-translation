source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelus qui in principio uenerat ad me, et uidit me, Et ecce eram positus ut mortuus, et intellectus meus alienatus erat, et tenuit dexteram meam et confortauit me et statuit me super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: ru
  text: И вот, я лежал, словно мёртвый, и рассудок покинул меня. Тогда он взял меня за правую руку, укрепил и поставил на ноги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: positus ut mortuus
  choice: лежал, словно мёртвый
  rationale: Передаёт состояние неподвижно лежащего человека и сохраняет сравнительное ut, не утверждая буквальную смерть.
- source_word: intellectus meus alienatus erat
  choice: рассудок покинул меня
  rationale: Естественно по-русски выражает утрату сознательного восприятия; буквальное «мой разум был отчуждён» здесь звучало бы неясно и неестественно.
- source_word: tenuit dexteram meam
  choice: взял меня за правую руку
  rationale: Точно сохраняет указание на правую руку и естественно передаёт жест поддержки.
- source_word: confortauit me
  choice: укрепил
  rationale: Сохраняет широкий смысл физического и внутреннего подкрепления, не сужая его до одного лишь утешения.
- source_word: statuit me super [pedes]
  choice: поставил на ноги
  rationale: Передаёт очевидное завершение оборота, отражённое в текстовой традиции и консультационном английском слое; русский оборот естественен и достоин по стилю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий, повествовательный и возвышенный без архаизмов. Начальная часть латинского фрагмента «angelus qui in principio uenerat ad me, et uidit me» синтаксически относится к предшествующему контексту/стиху согласно предоставленной английской сегментации, поэтому данный стих начинается с «И вот».
