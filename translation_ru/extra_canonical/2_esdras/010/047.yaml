base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: ru
  text: 'А то, что она сказала тебе: «Я взращивала его в трудах», — это было обитанием Иерусалима.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пребыванием (жительством) Иерусалима». Буквально: «обитанием Иерусалима»; речь о его населённости или проживании в нём, а не о здании.'
    reason: Поясняет значение латинского habitatio, сохраняя в основном тексте формальную неоднозначность генитивной конструкции.
lexical_decisions:
- source_word: nutrivi eum
  choice: Я растила его
  rationale: Передаёт длительную заботу матери о сыне; в данном контексте естественнее современного русского «питала его».
- source_word: cum labore
  choice: с великим трудом
  rationale: Сохраняет значение тяготы и усилий; «великим» естественно выражает подразумеваемую тяжесть труда, не сужая её до физических мучений.
- source_word: habitatio Hierusalem
  choice: жизнь Иерусалима
  rationale: Здесь habitatio обозначает состояние или период обитания города, а не жилище-здание. «Жизнь Иерусалима» звучит естественно и подходит к символическому истолкованию, хотя буквальная конструкция допускает более формальное «обитание Иерусалима».
theological_decisions:
- issue: Соотнесение слов женщины с историей Иерусалима
  choice: означало жизнь Иерусалима
  alternative: было обитанием Иерусалима
  rationale: Глагол-связка erat в объяснении видения выражает символическое соответствие. «Означало» делает эту функцию ясной, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Образ материнского ухода сохранён, а неоднозначное латинское habitatio передано как состояние жизни города, не как физическое жилище.
