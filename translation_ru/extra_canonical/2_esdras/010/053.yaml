  register: Современный литературный русский язык с ясным, сдержанно-дignified библейским звучанием. Местоимение «Я» написано с прописной буквы, поскольку в контексте говорит ангельский посланник от лица поручившего ему Бога; сама формулировка не усиливает это сверх контекста.
