  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
translation:
  language: ru
  text: Поэтому я и велел тебе прийти в поле[a], где нет фундамента здания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на участок земли».'
    reason: Сохраняет допустимый диапазон значения латинского agrum, при этом основной вариант подчёркивает связь с конкретным полем в контексте видения.
lexical_decisions:
- source_word: agrum
  choice: в поле
  rationale: Латинское agrum обозначает поле или участок земли; в данном контексте речь идёт о конкретном незастроенном месте, куда было велено прийти, поэтому более широкое «за город» или «в сельскую местность» менее точно.
- source_word: fundamentum aedificii
  choice: фундамента здания
  rationale: Передаёт буквальное сочетание «основание/фундамент здания» и сохраняет единственное число aedificii.
- source_word: propterea
  choice: поэтому
  rationale: Сохраняет причинно-следственную связь с предшествующим объяснением.
theological_decisions: []
