source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: ru
  text: Итак, стряхни с себя свою великую печаль и отложи от себя множество скорбей, чтобы Сильный вновь был милостив к тебе, а Всевышний даровал тебе покой — отдых от трудов».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: стряхни с себя
  rationale: Передаёт энергичный образ удаления тяжёлой печали и естественно сочетается с возвратным оборотом русского языка.
- source_word: multitudinem dolorum
  choice: множество скорбей
  rationale: Сохраняет количественный образ латинского выражения и его возвышенный, но понятный регистр.
- source_word: fortis
  choice: Могущественный
  rationale: Субстантивированное божественное именование передано с заглавной буквы; «Могущественный» точнее обозначает силу, чем более узкое «Сильный».
- source_word: repropitietur
  choice: вновь явил тебе милость
  rationale: Приставка re- передана словом «вновь», а propitietur — естественным русским выражением о благосклонности и милости Бога.
- source_word: requiem ... requietionem laborum
  choice: покой — отдых от трудов
  rationale: Сохраняется повтор смыслового корня и пояснительное отношение второй фразы к первой без неестественного буквального дублирования.
theological_decisions:
- issue: Условно-целевой оттенок ut после повелений
  choice: чтобы ... вновь явил ... и ... даровал
  alternative: и тогда ... вновь явит ... и ... дарует
  rationale: Латинское ut допускает целевой или результативный оттенок; «чтобы» сохраняет грамматическую зависимость и не превращает высказывание в более категоричное обещание.
- issue: fortis и altissimus как божественные титулы
  choice: Могущественный; Всевышний
  alternative: Сильный; Высочайший
  rationale: Выбранные формы естественны для современного литературного русского и сохраняют два различных титула без отождествления или богословского пояснения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для обычного читателя; архаизмы сведены к уместному глаголу «отринь».
