id: 2ES.10.38
reference: 2 Esdras 10:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixit: audi me, et doceam te et dicam tibi de quibus times, quoniam altissimus reuelauit tibi mysteria multa. Vidit enim'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: ru
  text: 'И он сказал: «Выслушай меня: я наставлю тебя и расскажу тебе о том, чего ты боишься, потому что Всевышний открыл тебе многие тайны».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: audi me
  choice: Выслушай меня
  rationale: Естественная современная передача призыва внимательно услышать говорящего; местоимение me сохранено.
- source_word: doceam te
  choice: я наставлю тебя
  rationale: «Наставлю» передаёт обучение и разъяснение в данном торжественном контексте без излишне школьного оттенка.
- source_word: de quibus times
  choice: о том, чего ты боишься
  rationale: Сохраняет неопределённость латинского оборота относительно предмета страха и естественно звучит по-русски.
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшееся русское божественное наименование, точно соответствующее латинскому превосходному титулу.
- source_word: mysteria multa
  choice: многие тайны
  rationale: Передаёт множественное число и неопределённый широкий смысл mysteria без внесения конфессионально обусловленного значения «таинства».
theological_decisions:
- issue: Значение mysteria
  choice: тайны
  alternative: таинства
  rationale: Контекст говорит об открытых Богом сокровенных вещах, а не о ритуалах или установленных церковных таинствах.
- issue: Связь откровения со страхом адресата
  choice: потому что Всевышний открыл тебе многие тайны
  alternative: ибо Всевышний явил тебе много тайн
  rationale: Союз «потому что» сохраняет причинную связь quoniam, не уточняя сверх текста, почему полученное откровение служит основанием дальнейшего объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «И» сохраняет повествовательную связность. Латинское продолжение «Vidit enim» относится к следующему стиху или предложению и потому в перевод данного стиха не включено.
