lexical_decisions:
- source_word: dereliqui sermones
  choice: я прервал речь
  rationale: Латинское выражение буквально означает оставление или прекращение слов; по-русски естественно передать прекращение текущей речи, сохранив множественное «слова» как собирательное «речь».
- source_word: in quibus adhuc eram
  choice: которую всё ещё продолжал
  rationale: Идиома буквально описывает говорящего как всё ещё находящегося в этих словах; перевод передаёт незавершённость его речи без неестественной кальки.
- source_word: respondi cum
  choice: ответил с гневом
  rationale: Предоставленный фрагмент обрывается на cum; последующее «с гневом» засвидетельствовано продолжением стиха в консультационном английском тексте и соответствует синтаксической связи cum с аблативом. Дополнение «ей» не внесено, поскольку его нет в данном латинском тексте.
