  source_fidelity: «Тогда я прервал речь, которую всё ещё продолжал, и ответил с гневом:» точно передаёт et dereliqui sermones in quibus adhuc eram et respondi cum. «Речь» естественно передаёт sermones как совокупность произносимых слов; «всё ещё продолжал» корректно раскрывает идиому in quibus adhuc eram. «С гневом» опирается на продолжение, отражённое в английской аудиторской версии, и не добавляет отсутствующего адресата.
