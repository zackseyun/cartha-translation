source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum omnes quievissent ut me consolarentur ut quiescerem, et surrexi nocte et fugi et veni, sicut vides, in hoc campo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/003.yaml
  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: ru
  text: 'И случилось: когда все перестали утешать меня, чтобы я мог отдохнуть, я ночью встал, убежал и пришёл, как видишь, на это поле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: перестали
  rationale: В данном контексте глагол обозначает прекращение попыток утешить говорящего; естественное русское выражение передаёт это без излишней буквальности.
- source_word: ut me consolarentur
  choice: утешать меня
  rationale: Прямо передаёт цель или содержание действий окружающих.
- source_word: ut quiescerem
  choice: чтобы я отдохнул
  rationale: Сохраняет целевое значение ut и повтор корня quiesc-, насколько это допускает естественный русский язык.
- source_word: surrexi nocte
  choice: я встал ночью
  rationale: Передаёт последовательность действий и временное обстоятельство без добавления идеи пробуждения, которой в латинском прямо нет.
- source_word: fugi
  choice: убежал
  rationale: Передаёт активное бегство, выраженное латинским fugio.
- source_word: in hoc campo
  choice: на это поле
  rationale: Русское управление с существительным «поле» требует предлога «на»; винительный падеж сохраняет направленность движения.
