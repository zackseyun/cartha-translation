  source_fidelity: 'В целом переданы все смысловые элементы латинского текста: omnes относится к «мы», lumina — светильники, cives mei — сограждане, surrexerunt — встали/поднялись, а quievi — пребывала в покое/отдыхала. Однако «до следующего дня — до самой ночи» в русском синтаксически размывает конечную границу и может быть понято как два несовместимых срока. Латинское повторение usque указывает на продолжение до ночи следующего дня.'
