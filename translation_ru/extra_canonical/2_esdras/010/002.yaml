  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: ru
  text: Тогда мы все погасили светильники, и все мои сограждане встали, чтобы утешить меня. А я отдыхала до самой ночи следующего дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evertimus ... lumina
  choice: погасили светильники
  rationale: В данном контексте латинское выражение означает прекращение горения светильников; «погасили» естественно передаёт действие, а «светильники» сохраняет конкретный образ источников света.
- source_word: omnes
  choice: мы все
  rationale: Форма omnes — именительный падеж множественного числа мужского/женского рода и относится к подразумеваемому подлежащему «мы», а не к lumina среднего рода.
- source_word: cives mei
  choice: мои сограждане
  rationale: Передаёт принадлежность к одной гражданской общине без лишнего уточнения пола или социального положения.
- source_word: surrexerunt
  choice: поднялись
  rationale: Сохраняет буквальный образ вставания и естественно сочетается с целью утешить говорящую.
- source_word: quievi
  choice: отдыхала
  rationale: Передаёт состояние покоя или отдыха; женский род обусловлен контекстом речи женщины, хотя сама латинская форма рода не выражает.
- source_word: usque in alium diem usque noctem
  choice: до следующего дня — до самой ночи
  rationale: Сохраняет повторную временную границу исходного текста и показывает, что покой продолжался вплоть до ночи следующего дня.
