  terminology: «Светильники» — удачная передача lumina в бытовом древнем контексте. «Сограждане» точно передаёт cives и сохраняет общественный оттенок, не подменяя его «соседями». Женская форма «отдыхала» уместна в непосредственном контексте речи женщины, хотя латинская форма quievi сама по себе рода не маркирует.
