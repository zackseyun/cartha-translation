  text: This woman whom you saw is Zion[a], whom you now see
translation:
  language: ru
  text: Эта женщина, которую ты видел, — Сион, который ты теперь видишь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec mulier
  choice: Эта женщина
  rationale: Прямо передаёт указательное местоимение и существительное, сохраняя связь с увиденным образом.
- source_word: quam uidisti
  choice: которую ты видел
  rationale: Естественная русская передача перфекта со значением предшествующего видения.
- source_word: haec est Sion
  choice: — Сион
  rationale: Именная конструкция с тире естественно передаёт отождествление; повторное haec не воспроизводится механически, поскольку по-русски это звучало бы избыточно.
- source_word: quam nunc conspicis
  choice: который ты теперь видишь
  rationale: Conspicis означает непосредственное зрительное восприятие в настоящем; мужской род относительного местоимения согласован с русским названием «Сион».
theological_decisions:
- issue: Отождествление женщины с Сионом
  choice: 'Передано прямо: «женщина… — Сион»'
  alternative: «эта женщина… представляет Сион»
  rationale: Латинское est выражает прямое отождествление; пояснение «представляет» истолковывало бы образ вместо перевода исходного текста.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» сохраняет единственное число латинских глагольных форм. Формулировка выдержана в ясном и достоинственном повествовательном регистре.
