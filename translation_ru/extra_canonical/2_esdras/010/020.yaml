  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: ru
  text: Не говори этого, но согласись, чтобы тебя убедили — ведь как велико падение Сиона! — и утешься из-за скорби Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: Не говори так
  rationale: Естественно передаёт буквальное «не произноси этой речи / не говори этого» в данном контексте.
- source_word: consenti persuaderi
  choice: согласись принять увещание
  rationale: Сохраняет значение согласия поддаться убеждению, не превращая пассивную латинскую конструкцию в чрезмерно буквальную и тяжёлую русскую.
- source_word: quid enim casus Sion
  choice: ведь как велико падение Сиона!
  rationale: Передаёт резкое риторическое восклицание quid enim и единственное число casus, не истолковывая оборот как причинный.
- source_word: consolare propter dolorem Hierusalem
  choice: утешься в скорби об Иерусалиме
  rationale: Передаёт призыв к утешению в связи со скорбью об Иерусалиме; русское «в скорби» звучит естественнее буквального «из-за скорби».
theological_decisions:
- issue: Связь оборота quid enim casus Sion с окружающей фразой
  choice: Передать как вставное риторическое восклицание
  alternative: «из-за бедствий Сиона»
  rationale: В латинском тексте отсутствует причинный показатель при quid enim; форма лучше понимается как эмоциональное восклицание о падении Сиона.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной выразительностью; синтаксис сохраняет внезапную вставку исходного текста.
