    issue: Временная форма «оплакивала»
    rationale: Латинское luget стоит в настоящем времени; английская контрольная версия также имеет present («she mourns»). «Оплакивает» точнее сохраняет описание видимой Ездре сцены.
  - severity: low
    issue: Оборот «по поводу случившегося»
    rationale: Он возможен, но «о том, что случилось» естественнее в современном литературном русском и ближе к de his quae contigerunt.
