  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: ru
  text: 'И вот, ты увидел её образ: она оплакивает своего сына, а ты стал утешать её о том, что случилось. Всё это должно было быть тебе явлено[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыто».'
    reason: Латинское aperienda буквально допускает «открыто», но в данном апокалиптическом контексте означает также «явлено, раскрыто».
lexical_decisions:
- source_word: filium luget
  choice: она оплакивала своего сына
  rationale: Передаёт настоящее время латинского luget в рамках описания увиденного; притяжательное «своего» естественно по-русски и следует контексту.
- source_word: inchoasti consolare
  choice: стал утешать
  rationale: Естественно передаёт начинательное значение inchoasti и действие consolari без тяжеловесного буквального «начал утешать».
- source_word: de his quae contigerunt
  choice: по поводу случившегося
  rationale: Сохраняет отсутствие в латинском тексте явно названного лица, с которым это произошло.
- source_word: aperienda
  choice: явлено
  rationale: В апокалиптическом контексте означает раскрытие сокровенного, а не физическое открывание; «явлено» сохраняет высокий, но понятный современный регистр.
theological_decisions:
- issue: Характер раскрытия видения
  choice: должно было быть тебе явлено
  alternative: должно было быть тебе открыто
  rationale: Основной вариант передаёт смысл откровения, не уточняя его механизм и не привнося конфессионального толкования; более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией. Начальное «И вот» и слова об увиденном образе сохранены по контексту засвидетельствованной стиховой формы; обрывок «Et nunc uidens altissimus» не включён, поскольку относится к продолжению следующего стиха.
