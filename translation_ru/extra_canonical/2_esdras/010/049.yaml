  source_fidelity: 'В целом перевод точно передаёт смысл латинского фрагмента и согласуется с английской контрольной версией: скорбь женщины о сыне, попытка Ездры утешить её и необходимость раскрыть ему это. Однако настоящее время латинского luget лучше сохранить в русском; в черновике «она оплакивала» необоснованно переводит его в прошедшее.'
  naturalness: Фраза литературна и соответствует умеренно возвышенному регистру. «О том, что случилось» немного естественнее и прямее, чем «по поводу случившегося», при этом не добавляет отсутствующих в оригинале подробностей.
  terminology: «Явлено» удачно передаёт aperienda в апокалиптическом контексте как раскрытие/откровение, не навязывая интерпретации. Альтернативу «открыто» уместно сохранить в сноске.
  issues:
