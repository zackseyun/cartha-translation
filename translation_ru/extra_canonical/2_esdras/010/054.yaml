id: 2ES.10.54
reference: 2 Esdras 10:54
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: ru
  text: Ибо никакое человеческое строение не могло устоять на том месте, где начинал являться город Всевышнего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: человеческое строение
  rationale: Передаёт сооружение, созданное человеком, естественным современным русским выражением без добавления отсутствующего в тексте образа «рук».
- source_word: sustinere
  choice: устоять
  rationale: В данном контексте обозначает способность постройки выдержать присутствие или явление небесного города; «устоять» сохраняет силу и краткость латинского глагола.
- source_word: incipiebat ... ostendi
  choice: начинал являться
  rationale: Сохраняет начинательный и пассивно-явительный смысл латинской конструкции, не уточняя, кому именно показывался город.
- source_word: altissimi ciuitas
  choice: город Всевышнего
  rationale: Традиционно и точно передаёт родительную конструкцию и титул Altissimus.
theological_decisions:
- issue: Соотношение человеческого строения и города Всевышнего
  choice: Сохранено прямое противопоставление без пояснения причины, по которой человеческое строение не могло устоять.
  alternative: Добавить, что человеческое строение не выдержало бы славы или присутствия небесного города.
  rationale: Латинский текст не называет конкретной причины; её добавление устранило бы сохранённую источником богословскую недосказанность.
translation_notes:
  register: Современный литературный русский язык; фраза звучит торжественно, но остаётся понятной. Порядок слов слегка адаптирован к русской норме, при этом логика и образность латинского текста сохранены.
