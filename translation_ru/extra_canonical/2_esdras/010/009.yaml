  terminology: «Скорбишь», «надлежит оплакивать» и персонификация земли удачны. «Именно ей» обоснованно передаёт эмфатическое haec. Английская служебная сноска с вариантом «Ask the earth» не отражает текстологической или переводческой альтернативы для русского и не требует переноса.
