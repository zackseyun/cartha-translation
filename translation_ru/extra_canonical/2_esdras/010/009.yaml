  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: ru
  text: А ты скорбишь об одном сыне. Спроси же землю — и она скажет тебе, что именно ей надлежит оплакивать столь многих, находящихся на ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: autem contristaris
  choice: А ты скорбишь
  rationale: Передаёт противительное autem и настоящее время contristaris естественной русской конструкцией.
- source_word: in uno filio
  choice: об одном сыне
  rationale: Латинское in с глаголом скорби здесь обозначает предмет скорби.
- source_word: Interroga enim terram
  choice: Спроси же землю
  rationale: Императив interroga передан прямо; частица «же» естественно выражает пояснительно-связующее enim.
- source_word: haec est quae debeat lugere
  choice: именно ей надлежит оплакивать
  rationale: «Именно ей» сохраняет эмфатическое haec; «надлежит» передаёт долженствование debeat, не усиливая его до безусловной необходимости.
- source_word: tantorum super eam
  choice: столь многих, лежащих на ней
  rationale: Субстантивированное tantorum означает «столь многих»; добавленное «лежащих» минимально проясняет эллиптическое super eam и естественно связано с образом земли, не вводя отсутствующего в источнике рождения или произрастания.
theological_decisions:
- issue: Кого обозначают «столь многие» и в каком смысле они находятся на земле
  choice: столь многих, лежащих на ней
  alternative: столь многих на ней
  rationale: Источник оставляет существительное при tantorum подразумеваемым. Русский требует более ясной связи; «лежащих» сохраняет погребально-траурный контекст, но не определяет этих многих точнее, чем текст.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Сохранены обращение на «ты», противопоставление личной скорби более широкому плачу земли и персонификация земли.
