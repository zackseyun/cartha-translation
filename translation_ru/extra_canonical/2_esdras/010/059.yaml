  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: ru
  text: В наступающую ночь ты останешься здесь, и Всевышний покажет тебе видения во сне о том, что Всевышний совершит в отношении живущих на земле в последние дни.[a] И я спал ту ночь и следующую, как он повелел мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о том, что Всевышний сделает живущим на земле». Латинский дательный может указывать как на тех, ради кого совершается действие, так и на тех, кого оно касается.'
    reason: Передаёт возможную широту функции his qui habitant, не приписывая относительному quae ошибочную связь с uisiones и не предрешая характера будущих действий.
lexical_decisions:
- source_word: 'in nocte quae futura est (в очищенном фрагменте сохранилось: futura est)'
  choice: в наступающую ночь
  rationale: Восстанавливает естественный смысл латинского оборота в контексте; само по себе futura est является концом выражения «которая наступит».
- source_word: uisiones somniorum
  choice: видения во сне
  rationale: Передаёт сочетание visiones и родительного somniorum естественным современным русским языком, не сводя его просто к «снам».
- source_word: quae faciet altissimus
  choice: о том, что Всевышний совершит
  rationale: Не создаёт неестественного смысла «совершит видения» и сохраняет отнесённость видений к будущим деяниям Всевышнего.
- source_word: his qui habitant super terram
  choice: с живущими на земле
  rationale: Передаёт дательный his в контексте будущих апокалиптических событий, не уточняя без достаточного основания, будут ли эти действия благотворными или карающими.
- source_word: in nouissimis diebus
  choice: в последние дни
  rationale: Устоявшийся и понятный эквивалент эсхатологического выражения.
- source_word: aliam [noctem]
  choice: следующую [ночь]
  rationale: В контексте ellipsis означает ещё одну, следующую ночь; существительное естественно восстанавливается по-русски.
theological_decisions:
- issue: Характер действий Всевышнего по отношению к жителям земли
  choice: что Всевышний совершит с живущими на земле
  alternative: что Всевышний совершит для живущих на земле
  rationale: Латинский дательный his допускает более одного смыслового отношения. Формулировка «с живущими» сохраняет апокалиптическую открытость и не представляет действия заранее ни благодеянием, ни наказанием.
- issue: Связь относительного quae с видениями и будущими событиями
  choice: видения ... о том, что Всевышний совершит
  alternative: видения, которые сотворит Всевышний
  rationale: Формальное согласование в латинском может связывать quae с visiones, но смысл и предполагаемая подоснова указывают на содержание видений — будущие деяния. Основной текст передаёт этот смысл, а примечание сохраняет языковую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «Всевышний» сохранён вслед за источником. Начало стиха передано с учётом того, что очищенный латинский фрагмент начинается внутри оборота; заключительное предложение, присутствующее в латинском источнике, также включено.
