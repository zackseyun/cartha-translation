id: 2ES.10.10
reference: 2 Esdras 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: germinantium. Et ex ipsa initia omnes nacti, et alii ueniunt, et ecce pene omnes in perditionem ambulant et in exterminium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: ru
  text: Все получили от неё начало, и другие приходят; и вот, почти все идут к погибели и истреблению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: от неё
  rationale: Передаёт исходную точку происхождения и сохраняет женский род латинского местоимения, отсылающего к упомянутой в контексте женщине.
- source_word: initia omnes nacti
  choice: все получили своё начало
  rationale: Естественная по-русски передача буквального смысла «все обрели начала», без добавления отсутствующей в тексте конкретизации.
- source_word: alii ueniunt
  choice: другие приходят
  rationale: Сохранено настоящее время и открытость выражения; подразумеваются последующие поколения, но это не внесено прямо в текст.
- source_word: in perditionem ambulant
  choice: идут к погибели
  rationale: Глагол движения передан естественным русским оборотом; «погибель» сохраняет сильный смысл perditionem.
- source_word: in exterminium
  choice: к уничтожению
  rationale: Прямо передаёт exterminium как окончательное истребление или уничтожение и сохраняет параллель с «к погибели».
theological_decisions:
- issue: Объём утверждения о погибели
  choice: почти все
  alternative: едва ли не все
  rationale: Прямо отражает pene omnes, не превращая высказывание ни во всеобщее осуждение без исключений, ни в неопределённую гиперболу.
- issue: Отношение «погибели» и «уничтожения»
  choice: два координированных направления одного движения
  alternative: истолковать второе как следствие или пояснение первого
  rationale: Латинское et связывает два предложных оборота без явного указания на причинную или пояснительную связь; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Синтаксический параллелизм оригинала сохранён, но буквальное «ходят в» заменено естественным русским «идут к».
