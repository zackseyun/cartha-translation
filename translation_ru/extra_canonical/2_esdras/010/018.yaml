lexical_decisions:
- source_word: non faciam
  choice: не сделаю этого
  rationale: В русском языке переходный глагол требует восполнения подразумеваемого объекта; местоимение «этого» естественно отсылает к предшествующему призыву и не добавляет нового содержания.
- source_word: neque ingrediar civitatem
  choice: и не войду в город
  rationale: Точно передаёт отрицательную координацию и значение ingredior с винительным направления.
- source_word: sed hic moriar
  choice: а умру здесь
  rationale: Противительный союз «а» естественно выражает контраст в русском контексте, а «здесь» сохраняет пространственное значение hic.
