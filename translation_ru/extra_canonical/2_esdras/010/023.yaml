source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc et tradita est in manibus eorum qui nos oderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: ru
  text: И, что важнее всего, — печать Сиона, ибо ныне он лишён своей славы и предан в руки ненавидящих нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «печать Сиона» трудно для понимания. Возможно, речь идёт об отличительной славе Сиона, подтверждении его особого положения или символическом знаке чести. Латинский глагол в выражении «ныне он лишён своей славы» (resignata est de gloria sua) буквально продолжает образ снятой печати; в русском тексте этот образ сохранён в словах «печать Сиона», а смысл утраты славы передан более естественно.
    reason: lexical_alternative
lexical_decisions:
- source_word: signaculum Sion
  choice: печать Сиона
  rationale: 'Сохранён трудный и многозначный латинский образ: он может обозначать отличительный знак, подтверждённое достоинство или символ славы Сиона.'
- source_word: resignata est de gloria sua
  choice: лишён своей славы
  rationale: Буквальное «распечатан от своей славы» по-русски неестественно и неясно. Перевод передаёт утрату славы, одновременно оставляя связь с образом снятой печати в примечании; женский род латинского сказуемого указывает на Sion, а не на signaculum.
- source_word: tradita est in manibus
  choice: предан в руки
  rationale: Естественная русская библейская формула точно передаёт латинскую конструкцию и согласуется с мужским родом слова «Сион».
theological_decisions:
- issue: Референт женских форм resignata est и tradita est
  choice: Сион («он»)
  alternative: печать («она»)
  rationale: В латинском Sion имеет женский грамматический референт в данном контексте, тогда как signaculum — среднего рода; следовательно, сказуемые относятся к Сиону. В русском «Сион» мужского рода.
- issue: Смысл выражения «печать Сиона»
  choice: сохранить метафору без истолковывающей подстановки
  alternative: заменить на «слава Сиона», «знак достоинства Сиона» или иной однозначный парафраз
  rationale: Источник допускает несколько смысловых оттенков, поэтому перевод не должен устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Метафора «печать Сиона» сохранена, а не заменена толкованием; местоимение и причастия согласованы с русским словом «Сион».
