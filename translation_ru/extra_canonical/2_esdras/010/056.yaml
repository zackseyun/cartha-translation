  rationale: Передаёт образ ограниченной способности восприятия, сохраняя упоминание ушей и естественное русское звучание.
theological_decisions:
- issue: Предел сообщаемого откровения
  choice: Сохранён образ способности ушей вместить услышанное без уточнения природы этого предела.
  alternative: «столько, сколько ты способен услышать»
  rationale: Более буквальный образ не сводит смысл исключительно к интеллектуальному пониманию и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует латинскому второму лицу единственного числа. Формулировка выдержана в ясном, dignified повествовательном регистре.
