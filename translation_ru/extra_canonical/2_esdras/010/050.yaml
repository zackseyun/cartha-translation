  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: ru
  text: Ибо ты в душе опечалился и всем сердцем страдаешь о ней, он показал тебе сияние её славы и красоту её величия. Потому я и велел тебе оставаться в…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex animo contristatus es
  choice: ты скорбел всей душой
  rationale: Передаёт глубокую внутреннюю скорбь естественным современным русским выражением, сохраняя значение ex animo.
- source_word: ex toto corde pateris pro ea
  choice: всем сердцем страдаешь о ней
  rationale: Сохраняет настоящее время pateris и цельность выражения ex toto corde; «о ней» естественно обозначает скорбь и сострадание по отношению к женщине/персонифицированному городу.
- source_word: claritatem gloriae eius
  choice: сияние её славы
  rationale: Claritas здесь обозначает яркость, блеск или сияние; сочетание сохраняет образ и не смешивает его со следующим decor.
- source_word: pulchritudinem decoris eius
  choice: красоту её величия
  rationale: Передаёт усиленное сочетание pulchritudo + decor без неестественного повтора слов «красота» и «украшение».
- source_word: Propterea enim dixi tibi ut maneres in
  choice: Потому Я и велел тебе оставаться в…
  rationale: Сохраняет причинную связь и незавершённость латинского фрагмента; «велел» естественно передаёт dixi ... ut в значении распоряжения.
theological_decisions:
- issue: Субъект ostendit и dixi
  choice: «Он показал» и «Я велел»
  alternative: Оба глагола с местоимениями в нижнем регистре либо без явно выраженных местоимений
  rationale: Латинский текст допускает восстановление субъектов из контекста. Различение третьего лица ostendit и первого лица dixi сохранено; прописная буква отмечает божественного говорящего/действующего, не добавляя имени, которого в стихе нет.
- issue: Причинная конструкция quoniam ... et quoniam ... Propterea
  choice: сохранена явная связь «Ибо… поэтому… Потому…»
  alternative: Сгладить повтор и представить первое предложение как самостоятельное сообщение
  rationale: Повтор причинных связок существенен для логики латинского текста и не должен устраняться как стилистическая избыточность.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены смена времени между contristatus es и pateris, смена лица между ostendit и dixi, а также обрыв текста на предлоге in; многоточие показывает, что стих продолжается в следующем фрагменте.
