  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: ru
  text: Но ты блаженнее многих и призван Всевышним, как и немногие другие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «призван у (или: пред, в присутствии) Всевышнего». Латинское apud обычно имеет такой пространственно-реляционный оттенок; в данном контексте оно может также указывать на Того, кем человек призван.'
    reason: Сохраняет лексическую неоднозначность apud, тогда как основной текст передаёт наиболее естественное для русского и контекста агентное понимание.
lexical_decisions:
- source_word: beatus es prae multis
  choice: ты блаженнее многих
  rationale: Сравнительное значение prae multis передано прямо и естественно; «блажен» сохраняет возвышенный библейский регистр.
- source_word: uocatus es
  choice: призван
  rationale: Форма сохраняет пассивное значение латинского перфекта и не уточняет сверх текста цель призвания.
- source_word: apud
  choice: пред
  rationale: Apud прежде всего указывает на нахождение перед кем-либо или в чьём-либо присутствии. «Пред Всевышним» сохраняет этот пространственно-реляционный оттенок и не превращает предлог в явное обозначение действующего лица.
- source_word: sicut pauci
  choice: как лишь немногие
  rationale: Передаёт исключительность положения адресата без добавочного пояснения.
theological_decisions:
- issue: Кто совершает призвание и что означает apud Altissimum
  choice: «призван пред Всевышним»
  alternative: «призван Всевышним»
  rationale: Латинское apud обычно означает «у», «перед», «в присутствии», а не обозначает действующее лицо, для чего ожидалось бы ab. Основной текст сохраняет образ признания или призвания перед Всевышним, а возможное агентное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Краткая симметричная конструкция следует ритму латинского текста; форма «пред» уместна в сакральном контексте и остаётся понятной современному читателю.
