  verdict: revise
  source_fidelity: Латинское «beatus es prae multis» точно передано сравнительной конструкцией «блаженнее многих». Пассив «uocatus es» сохранён. «Apud [Altissimum]» в данном позднелатинском контексте допускает передачу действующего лица («Всевышним»), хотя буквально apud обычно обозначает отношение «у / перед / в присутствии». Такой вариант лучше согласуется с конструкцией «призван» и с английским POB audit trail, окончательно избравшим «by the Most High».
  naturalness: «Призван пред Всевышним» возможно в высоком регистре, но без пояснения воспринимается по-русски как призвание, происходящее в присутствии Всевышнего, а не как призвание от Него. Оборот «как лишь немногие» также эллиптичен; «как и немногие другие» естественно выражает подразумеваемое сравнение, не добавляя нового смысла.
  terminology: «Блаженнее» и «Всевышний» уместны в современном литературном библейском регистре. «Призван Всевышним» ясно передаёт пассив и контекстуально вероятное агентное значение; буквальный оттенок apud следует отметить сноской, не представляя его как единственно возможный.
  issues:
