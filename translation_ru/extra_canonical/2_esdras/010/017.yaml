  text: '«Итак, войди в город к своему мужу». И сказала мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingredere
  choice: войди
  rationale: Латинский императив означает «войди, вступи»; в сочетании с in civitatem естественно передаётся как «войди в город».
- source_word: ad virum tuum
  choice: к своему мужу
  rationale: Предлог ad выражает направление к человеку; возвратное «своему» естественно связывает мужа с адресатом повеления.
- source_word: Et dixit ad me
  choice: И мне было сказано
  rationale: Безлично-пассивная конструкция сохраняет невыраженность субъекта в латинском тексте, не навязывая мужской или женский род, который русский глагол прошедшего времени потребовал бы обозначить.
theological_decisions:
- issue: Личность говорящего в заключительной формуле
  choice: Сохранить неопределённость латинского текста посредством «И мне было сказано»
  alternative: «И он сказал мне» или «И она сказала мне»
  rationale: Форма dixit сама по себе не указывает рода субъекта. Контекст может подсказывать говорящего, но перевод не должен превращать контекстуальный вывод в однозначное указание исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повеление передано прямо и ясно; двоеточие сохранено как введение следующей реплики.
