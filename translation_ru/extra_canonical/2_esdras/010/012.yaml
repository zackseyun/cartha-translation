  source_fidelity: 'Перевод точно передаёт латинское условное высказывание: обращение «если ты скажешь мне», сравнение личного плача со скорбью земли и основание этого плача — утрата «плода чрева». Женский род «потеряла» оправдан ближайшим контекстом речи матери. Английская аудиторская формулировка передана без смысловых добавлений.'
  naturalness: 'Фраза грамматически корректна и звучит как современный литературный русский с уместной умеренно библейской окраской. Оборот «не подобна скорби земли» несколько возвышен, но соответствует регистру и образности текста. Конечная запятая оправдана: прямая речь и условная конструкция продолжаются в следующем стихе.'
  terminology: «Скорбь» является приемлемой передачей planctus в данном контексте и сохраняет как горе, так и подразумеваемое оплакивание. «Плод чрева моего» точно отражает fructum ventris mei и сохраняет традиционный библейский образ. Олицетворённая «скорбь земли» сохранена верно.
