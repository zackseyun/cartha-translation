source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uno doles ? Si autem dices mihi, quoniam non est similis planctus meus terrae, quoniam ego fructum uentris mei perdidi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/012.yaml
  text: But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,’
translation:
  language: ru
  text: 'Но если ты скажешь мне: «Моя скорбь не подобна скорби земли, потому что я потеряла плод чрева моего»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: planctus
  choice: скорбь
  rationale: В контексте утраты ребёнка слово обозначает горе, выражаемое плачем; «скорбь» естественно передаёт это по-русски, не сужая смысл до одного обряда оплакивания.
- source_word: fructum uentris mei
  choice: плод чрева моего
  rationale: Сохранён библейский образ и его возвышенный регистр; речь идёт о рождённом женщиной сыне.
- source_word: terrae
  choice: скорби земли
  rationale: Родительный падеж допускает сравнение личной скорби со скорбью земли; повтор существительного делает подразумеваемый смысл ясным по-русски.
theological_decisions:
- issue: Олицетворение земли
  choice: сохранить представление о скорби земли
  alternative: передать как «бедствие земли»
  rationale: Латинское planctus ... terrae представляет землю как оплакивающую свои потери; перевод сохраняет этот образ и не сводит его к безличному бедствию.
translation_notes:
  register: Современный литературный русский с умеренно библейской возвышенностью. Женский род «потеряла» следует контексту речи матери. Конечная запятая сохранена, поскольку условное высказывание синтаксически продолжается в следующем стихе.
