  source_fidelity: Латинское et dormivi illam noctem et aliam точно передаётся как «я спал ту ночь и ещё одну». Однако sicut dixerat mihi означает «как он сказал мне / как он мне сказал», а не обязательно «как он велел мне»; «велел» неоправданно усиливает высказывание до приказа.
  naturalness: «И я спал ту ночь и ещё одну» — естественная, краткая форма современного литературного русского; повтор слова «ночь» не требуется. «Как он сказал мне» сохраняет сдержанный повествовательный регистр.
