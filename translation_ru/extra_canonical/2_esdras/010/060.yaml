lexical_decisions:
- source_word: et dormivi
  choice: И я спал
  rationale: Прямо передаёт латинский глагол первого лица; начальное «И» сохраняет повествовательную связь.
- source_word: illam noctem et aliam
  choice: в ту ночь и ещё одну
  rationale: Сохраняет различие между указанием на конкретную ночь и неопределённым aliam («другую/ещё одну»), не заменяя его более определённым «следующую».
- source_word: sicut dixerat mihi
  choice: как он велел мне
  rationale: В данном контексте dixerat mihi обозначает данное рассказчику указание; «велел мне» естественно передаёт эту прагматическую силу по-русски.
