source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: ru
  text: «Где ангел Уриил, который пришёл ко мне вначале? Ведь это он привёл меня в это великое исступление ума[a]; мой конец обернулся тлением[b], а моя молитва — поношением»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в полноту (или множество) этого исступления ума». Речь идёт о всепоглощающем визионерском состоянии, а не просто об обычном замешательстве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разрушением», «погибелью».'
    reason: lexical_alternative
  - marker: c
    text: Следующие слова латинского источника — «И когда я говорил это, вот, пришёл ко мне…» — относятся к следующему стиху.
    reason: verse_boundary
lexical_decisions:
- source_word: a principio uenit ad me
  choice: который приходил ко мне вначале
  rationale: Передаёт исходное указание на первое явление Уриила без добавления отсутствующего в латинском уточнения.
- source_word: fecit uenire
  choice: привёл меня
  rationale: 'Сохраняет каузативный смысл: именно Уриил ввёл Ездру в описанное состояние.'
- source_word: in multitudinem excessus mentis huius
  choice: в это великое исступление ума
  rationale: «Исступление ума» передаёт выход сознания из обычного состояния и допускает визионерский оттенок; «великое» выражает усилительное multitudinem. Обычное «замешательство» было бы слишком слабым.
- source_word: corruptione
  choice: погибелью
  rationale: В данном контексте слово обозначает гибель или разрушение, а не нравственную испорченность; при этом буквальный образ тления отмечен в сноске.
- source_word: inproperium
  choice: поношением
  rationale: Сохраняет ёмкий смысл позора, укора или предмета насмешки, не уточняя без необходимости, кто именно поносит молитву.
theological_decisions:
- issue: Характер состояния Ездры
  choice: Сохранён образ необычайного выхода ума из обычного состояния — «исступление ума».
  alternative: «Глубокое смятение» или «великое замешательство».
  rationale: Контекст выражает мучительное визионерское состояние, а не радостный экстаз и не просто повседневную растерянность.
- issue: Смысл конца Ездры
  choice: «конец мой стал погибелью»
  alternative: «конец мой стал тлением»
  rationale: Основной текст передаёт контекстуальную угрозу гибели, а сноска сохраняет более буквальную возможность, не превращая фразу в утверждение о нравственной порче.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Синтаксический параллелизм заключительной части сохранён; архаизмы и конфессионально окрашенные толкования не добавлялись.
