    issue: «который приходил ко мне вначале»
    rationale: Venit — совершенная форма («пришёл»). Несовершенный вид может создать впечатление неоднократных приходов, отсутствующее в источнике.
  - severity: medium
    issue: «конец мой стал погибелью»
    rationale: Corruptione сохраняет образ тления, распада или разрушения. «Погибель» является допустимым толкованием, но не должна заменять этот образ в основном тексте.
