  text: Therefore I beg you to show your servant the meaning of this departure.” And he answered me and[a]
translation:
  language: ru
  text: '«Итак, прошу тебя, покажи своему слуге, что означает это необычное переживание». И он ответил мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstres
  choice: объясни
  rationale: В контексте просьбы раскрыть смысл пережитого латинское demonstrare естественно передаётся глаголом «объяснить», а не буквально «показать».
- source_word: seruo tuo
  choice: своему слуге
  rationale: Сохраняет форму смиренного самообозначения говорящего и обращение ко второму лицу.
- source_word: de excessu hoc
  choice: смысл этого исступления
  rationale: Excessus может обозначать выход из обычного состояния, экстатическое или трансовое видение. «Исступление» сохраняет связь с пророческим экстазом и не сводит выражение к физическому уходу.
- source_word: Et respondit ad me et
  choice: И он ответил мне и…
  rationale: Сохранён незавершённый переход к следующему стиху; многоточие по-русски обозначает обрыв фразы на границе стиха.
theological_decisions:
- issue: Характер переживания, обозначенного excessus
  choice: исступление
  alternative: уход; транс; экстаз
  rationale: Контекст указывает на необычное видение или выход из нормального состояния сознания. «Уход» в современном русском слишком легко понимается как физическое удаление или смерть, «экстаз» — как восторг, а «транс» звучит более клинически; «исступление» лучше сохраняет древнюю религиозно-визионерскую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис просьбы сделан естественным для русского языка; незавершённость заключительной формулы источника сохранена.
