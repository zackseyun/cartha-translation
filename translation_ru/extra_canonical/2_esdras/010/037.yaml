revisions:
- from: '«Итак, прошу тебя: объясни своему слуге смысл этого исступления».[a] И он ответил мне и…'
  to: '«Итак, прошу тебя, покажи своему слуге, что означает это необычное переживание». И он ответил мне:'
  rationale: Перевод уточнён для более точной передачи demonstrare и для сохранения неоднозначности excessus. Финальная формула оформлена как начало ответа, продолжающегося в следующем стихе. Сноска сохранена как необходимое указание на альтернативное, более буквальное понимание.
