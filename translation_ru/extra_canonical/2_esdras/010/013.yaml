  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: ru
  text: которого я родила в скорби и произвела на свет в муках; земля же, согласно пути земли, уходит, как и множество, ныне находящееся на ней» —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum meroribus peperi
  choice: родила в скорби
  rationale: Передаёт буквальный образ рождения, сопровождаемого глубоким горем; единственное число «в скорби» естественно для современного русского и сохраняет смысл латинского множественного meroribus.
- source_word: cum doloribus genui
  choice: произвела на свет в муках
  rationale: Сохраняет параллелизм с первой частью и ясно передаёт родовые страдания, выраженные doloribus.
- source_word: secundum uiam terrae
  choice: следуя земному пути
  rationale: Естественно передаёт необычное латинское выражение «согласно пути земли», не устраняя его образность.
- source_word: multitudo praesens
  choice: множество, ныне находящееся
  rationale: Praesens здесь понято как указание на нынешнее присутствие множества людей на земле.
theological_decisions:
- issue: Соотношение ухода земли и находящегося на ней множества
  choice: земля уходит, а вместе с ней — и множество
  alternative: уходит находящееся на земле множество
  rationale: Синтаксис исходного текста называет землю субъектом abiit; формулировка также сохраняет параллельный уход присутствующего на ней множества, не сводя высказывание только к смерти людей.
- issue: Временная форма abiit
  choice: уходит
  alternative: ушла
  rationale: Хотя латинская форма формально перфектная, контекст выражает общий земной удел; настоящее время по-русски естественно передаёт это обобщение и согласуется с praesens.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены двойной образ родов и необычное представление об уходящей земле; тире в конце показывает продолжение реплики в следующем стихе.
