  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: ru
  text: Итак, не бойся, и пусть не ужасается сердце твоё; войди и посмотри на великолепие или величие здания — сколько способны увидеть твои глаза.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli timere
  choice: не бойся
  rationale: Прямой и естественный русский эквивалент латинского запрета.
- source_word: neque expavescat cor tuum
  choice: пусть не ужасается сердце твоё
  rationale: Сохраняет образ сердца и усиленное значение expavescat, не сводя его к простому страху.
- source_word: ingredere
  choice: войди
  rationale: Передаёт направленное внутрь движение, выраженное латинским глаголом.
- source_word: splendorem vel magnitudinem
  choice: великолепие или величие
  rationale: Сохраняет альтернативную либо пояснительную связь vel, не заменяя её союзом «и».
- source_word: aedificii
  choice: здания
  rationale: Нейтральный и контекстуально точный эквивалент.
- source_word: quantum capax est tibi visu oculorum videre
  choice: насколько твои глаза способны это увидеть
  rationale: Естественно передаёт несколько избыточную латинскую конструкцию о пределах зрительного восприятия.
