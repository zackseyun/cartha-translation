  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: ru
  text: 'на поле, где не построен дом. Ведь я знал, что Всевышний начинал показывать тебе это. Поэтому я сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: campo
  choice: на поле
  rationale: Передаёт локативное значение латинского ablativus и сохраняет связь с предшествующим контекстом.
- source_word: ubi domus non est aedificata
  choice: где не построен дом
  rationale: Прямой и естественный перевод без добавления отсутствующих в источнике уточнений.
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшееся и понятное русское божественное именование, точно соответствующее латинскому титулу.
- source_word: incipiebat ... ostendere
  choice: начинал показывать
  rationale: Сохраняет аспектуальное значение incipiebat и не заменяет его более определённым перспективным «собирался показать».
- source_word: haec
  choice: это
  rationale: Естественное русское указание на открываемое видение; не требует искусственного множественного числа.
- source_word: Propterea dixi
  choice: 'Поэтому я сказал:'
  rationale: Сохраняет причинно-следственную связь; двоеточие указывает, что речь продолжается в следующем стихе.
theological_decisions:
- issue: Характер начала откровения в incipiebat ostendere
  choice: начинал показывать
  alternative: собирался показать
  rationale: Латинская форма буквально обозначает начавшийся процесс. Возможный перспективный оттенок не следует делать единственным толкованием без достаточной необходимости.
translation_notes:
  register: Современный литературный русский язык с библейским достоинством; синтаксис близок к источнику, но остаётся естественным. Начальный фрагмент сохранён, поскольку он входит в предоставленный латинский текст и завершает предложение, начатое ранее.
