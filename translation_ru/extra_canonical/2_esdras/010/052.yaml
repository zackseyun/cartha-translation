  source_fidelity: 'Перевод точно передаёт данный латинский фрагмент: campo — «на поле», ubi domus non est aedificata — «где не построен дом», Sciebam enim ego — «Ведь я знал», altissimus — «Всевышний», incipiebat tibi ostendere haec — «начинал показывать тебе это», Propterea dixi — «Поэтому я сказал». Несовершенный вид «начинал показывать» обоснованно сохраняет непосредственное значение incipiebat и не навязывает спорное перспективное «собирался показать».'
  naturalness: 'Фраза естественна для современного литературного русского и сохраняет сдержанно-библейский регистр. Начальная строчная буква оправданна: предоставленный исходный текст также начинается с продолжения предыдущего предложения. Двоеточие после «я сказал» уместно, поскольку прямая речь продолжается в следующем стихе.'
  terminology: «Всевышний» — точное, устоявшееся и стилистически уместное соответствие altissimus. Указательное «это» естественно передаёт haec как совокупность открываемых видений; искусственное множественное число не требуется.
