id: 2ES.10.16
reference: 2 Esdras 10:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: ru
  text: Ибо если ты признаешь справедливость Божьего решения, то в должное время вновь обретешь своего сына и будешь прославлена среди женщин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: признаешь справедливость
  rationale: 'Передает каузативно-декларативный смысл латинского глагола в данном контексте: признать Бога правым, не подразумевая, что человек делает Божье решение справедливым.'
- source_word: terminum Dei
  choice: Божьего решения
  rationale: Terminus здесь естественно понимается как установленное Богом определение или постановление; «решение» сохраняет судебно-властный оттенок и звучит естественно по-русски.
- source_word: recipies
  choice: вновь обретешь
  rationale: В контексте утраты сына recipere означает получить его обратно; формулировка передает возврат, не уточняя его способ.
- source_word: in tempore
  choice: в должное время
  rationale: Передает временную неопределенность исходника без преждевременного уточнения эсхатологического или иного момента.
- source_word: in mulieribus conlaudaberis
  choice: будешь прославлена среди женщин
  rationale: Сохраняет буквальный общественный аспект похвалы и библейски возвышенный регистр.
theological_decisions:
- issue: Смысл оправдания Божьего определения
  choice: признаешь справедливость Божьего решения
  alternative: оправдаешь Божье определение
  rationale: Выбранная формулировка ясно выражает признание Божьей правоты и не создает впечатления, будто Божье решение нуждается в человеческом оправдании.
- issue: Характер возвращения сына
  choice: вновь обретешь своего сына
  alternative: получишь своего сына
  rationale: Recipies допускает смысл возвращения утраченного; перевод не определяет, идет ли речь о воскресении, утешительном видении или ином исполнении обещания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранен близким к латинскому, но сделан естественным; богословская неопределенность выражения «в должное время» не устранена.
