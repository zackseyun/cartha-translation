  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: ru
  text: хранить эти тайны. А ты останься здесь ещё на семь дней, чтобы тебе было показано всё, что Всевышний сочтёт нужным показать тебе».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruare secreta haec
  choice: хранить эти тайны
  rationale: Инфинитивную конструкцию передаём близко к латинскому источнику; secreta здесь естественно означает сокрытые откровения, то есть «тайны».
- source_word: adhuc sustine hic alios dies septem
  choice: останься здесь ещё на семь дней
  rationale: В контексте sustine означает продолжать находиться или ждать; «останься» естественно передаёт смысл, а alios dies septem — «ещё на семь дней».
- source_word: altissimo
  choice: Всевышний
  rationale: Традиционный и понятный русский эквивалент латинского титула Altissimus.
- source_word: quicquid uisum fuerit altissimo
  choice: всё, что Всевышний сочтёт нужным
  rationale: Латинский оборот буквально выражает то, что покажется угодным или правильным Всевышнему; этот вариант сохраняет зависимость откровения от его воли.
- source_word: ut tibi ostendatur
  choice: чтобы тебе было показано
  rationale: Пассивная форма сохранена, поскольку она подчёркивает получение откровения, не называя непосредственного действующего лица.
theological_decisions:
- issue: Объём будущего откровения
  choice: всё, что Всевышний сочтёт нужным показать тебе
  alternative: всё, что будет угодно Всевышнему
  rationale: Выбранная формулировка сохраняет волевой оттенок uisum fuerit и одновременно ясно связывает его с подразумеваемым показом откровения.
- issue: Фраза об уходе говорящего в английском консультационном тексте
  choice: не включать «И он удалился от меня»
  alternative: добавить фразу по английскому POB
  rationale: В предоставленном латинском тексте этой фразы нет; перевод следует указанному оригинально-языковому свидетельству и не вносит отсутствующий материал.
translation_notes:
  register: Современный литературный русский с библейской сдержанностью. Начальная строчная буква сохранена, поскольку фрагмент начинается продолжением предыдущего предложения. Кавычка в конце отражает завершение прямой речи; точка после неё не добавлена, поскольку дан только стиховой фрагмент и исходная пунктуационная связь с продолжением не засвидетельствована.
