  source_fidelity: 'Перевод точно передаёт предоставленный латинский текст: «хранить эти тайны», повеление оставаться ещё семь дней и обещание показать адресату всё, что будет угодно/представится должным Всевышнему. Пассив «тебе было показано» уместно сохраняет латинское ostendatur. Фраза английского аудиторского текста «И он удалился от меня» отсутствует в представленном латинском свидетельстве, поэтому её невключение правильно.'
