id: 2ES.12.38
reference: 2 Esdras 12:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: libro, quae uidisti, et pones ea in loco abscondito. Et docebis ea sapientes de populo tuo, quorum scis corda posse capere et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: ru
  text: И научишь этому мудрых из твоего народа, о которых знаешь, что их сердца способны понять это и сохранить в тайне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: docebis ea
  choice: научишь этому
  rationale: Средний род множественного местоимения ea указывает на ранее упомянутое содержание; по-русски естественнее передать его собирательным «этому», а не неоднозначным «их».
- source_word: sapientes de populo tuo
  choice: мудрых из твоего народа
  rationale: 'Сохраняет значение sapientes и партитивный смысл de: речь идёт о мудрых людях среди народа адресата.'
- source_word: quorum scis corda
  choice: о которых знаешь, что их сердца
  rationale: Передаёт относительную конструкцию буквально по смыслу, сохраняя библейский образ сердца как средоточия понимания.
- source_word: posse capere
  choice: способны понять это
  rationale: Capere здесь означает вместить, постичь сообщаемое; «понять» ясно и естественно для современного читателя, а «это» обозначает подразумеваемый объект.
- source_word: servare … arcana (смысл продолжения, отражённый в сверенном тексте)
  choice: сохранить в тайне
  rationale: Передаёт не просто хранение сведений, а обязанность не разглашать их; не вводит интерпретирующего существительного «тайны».
theological_decisions:
- issue: Образ сердца как способности воспринимать откровение
  choice: сохранён образ «их сердца способны понять»
  alternative: «они способны понять»
  rationale: Латинский текст прямо говорит о сердцах; устранение образа сгладило бы антропологический язык источника.
- issue: Неопределённый предмет обучения и хранения
  choice: передан нейтральным «этому / это»
  alternative: «этим тайнам» или «увиденному»
  rationale: Источник отсылает к ранее сказанному местоимением, не называя предмет заново; перевод не должен сужать его до частного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохранён ясным, без архаизмов; повтор «этому / это» выбран ради недвусмысленного обозначения предмета обучения, понимания и хранения.
