  text: или как я это истолковал. Вот, наступают дни, и восстанет царство,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatus sum
  choice: я это истолковал
  rationale: Передаёт совершённое действие от первого лица; местоимение «это» естественно восполняет подразумеваемый объект в русском языке, не добавляя нового содержания.
- source_word: Ecce
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую функцию латинского слова и библейскую торжественность без архаизации.
- source_word: dies ueniunt
  choice: наступают дни
  rationale: Естественный современный русский эквивалент образного выражения «дни приходят».
- source_word: exsurget regnum
  choice: восстанет царство
  rationale: Сохраняет энергичный образ возникновения или возвышения царства, заложенный в exsurget, и не добавляет отсутствующего в источнике уточнения о земле.
