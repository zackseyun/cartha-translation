lexical_decisions:
- source_word: cum labore multo
  choice: с великим притеснением
  rationale: В данном контексте власти над землёй и её жителями выражение указывает на тяжёлый гнёт; этот перевод естественен по-русски и согласуется с контекстуальным смыслом латинского labor.
- source_word: super omnes qui fuerunt ante hos
  choice: сильнее всех, кто был до них
  rationale: 'Super передаёт превосходство степени: притеснение при них было сильнее, чем при всех предшественниках.'
- source_word: capita
  choice: головами
  rationale: Сохранён буквальный образ «голов», важный для символики видения и не требующий истолковывающей замены.
theological_decisions:
- issue: Основание наименования «головами»
  choice: 'Сохранена причинная связь: «поэтому они названы головами».'
  alternative: Истолковать «головы» как правителей или царей.
  rationale: Латинское propter hoc прямо связывает предшествующее описание с названием, а символический термин следует оставить без конфессионального или частного толкования.
translation_notes:
  register: Современный литературный русский язык; сохранены фрагментарное начало стиха, символический образ и тесная связь частей посредством точки с запятой.
