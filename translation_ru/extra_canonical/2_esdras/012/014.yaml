  text: Regnabunt autem in ea XII reges, unus post unum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/014.yaml
  text: And twelve kings will reign in it[a], one after another.
translation:
  language: ru
  text: И будут царствовать в нём двенадцать царей, один за другим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Regnabunt
  choice: будут царствовать
  rationale: Точно передаёт будущее время и значение латинского глагола regnare, сохраняя возвышенный, но понятный библейский регистр.
- source_word: in ea
  choice: в нём
  rationale: Местоимение ea относится к существительному женского рода в предшествующем контексте; в русском переводе род местоимения согласуется с русским наименованием соответствующего царства/образа, поэтому уместно «в нём».
- source_word: XII reges
  choice: двенадцать царей
  rationale: Прямое и естественное соответствие латинскому количественному сочетанию.
- source_word: unus post unum
  choice: один за другим
  rationale: Естественный русский эквивалент со значением последовательного правления; не добавляет идеи совместного царствования.
theological_decisions:
- issue: Характер последовательности двенадцати царей
  choice: один за другим
  alternative: один после другого
  rationale: Оба варианта передают последовательность; выбранный вариант звучит естественнее и не уточняет длительность, преемственность или историческую идентичность царей сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к латинскому, но естественен по-русски; кавычка из прежнего английского варианта не воспроизводится как редакционный артефакт.
