  source_fidelity: '«И будут царствовать в нём двенадцать царей, один за другим» точно передаёт латинское Regnabunt autem in ea XII reges, unus post unum: будущее время, число царей, их царствование и последовательность сохранены. «В нём» допустимо по-русски, поскольку антецедент в контексте передаётся существительным мужского рода; латинский женский род ea сам по себе не требует женского рода в русском.'
