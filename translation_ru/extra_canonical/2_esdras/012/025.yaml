  yaml_path: translation/extra_canonical/2_esdras/012/025.yaml
  text: of the eagle. For these are the ones who will bring its impieties to a head[a], and
translation:
  language: ru
  text: орла. Ведь именно они доведут его беззакония до предела[a], и
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подытожат его беззакония».'
    reason: Латинское recapitulabunt допускает как значение сведения или подведения итога, так и контекстуальный смысл доведения до кульминации; кроме того, оно перекликается со словом «головы» в предыдущем стихе.
lexical_decisions:
- source_word: recapitulabunt
  choice: доведут до предела
  rationale: В данном апокалиптическом контексте глагол указывает не просто на словесное подведение итога, а на сведение беззаконий воедино и доведение их до кульминации. Русское выражение естественно передаёт этот смысл, хотя игру с предшествующими «головами» полностью воспроизвести невозможно.
- source_word: impietates
  choice: беззакония
  rationale: Множественное число сохраняет представление о совокупности нечестивых деяний; «беззакония» звучит по-русски естественнее, чем буквальное множественное «нечестия».
- source_word: Isti enim erunt qui
  choice: Ведь именно они
  rationale: Передаёт пояснительное enim и выделительную конструкцию isti ... qui без тяжеловесного буквального оборота «это будут те, которые».
- source_word: eius
  choice: его
  rationale: Местоимение отнесено к орлу, как требует ближайший контекст.
- source_word: et
  choice: и
  rationale: Сохранён завершающий союз, связывающий данный фрагмент с продолжением предложения.
theological_decisions:
- issue: 'Значение recapitulabunt: подведение итога или достижение полноты зла'
  choice: доведут его беззакония до предела
  alternative: подытожат его беззакония
  rationale: Основной текст сохраняет апокалиптическую идею кульминации беззакония, а примечание отмечает реальную лексическую возможность значения «подытожить».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая незавершённость в начале и конце сохранена, поскольку стих представляет собой фрагмент продолжающегося предложения.
