lexical_decisions:
- source_word: iterum constituetur
  choice: снова будет возвращено
  rationale: Передаёт повторность iterum и восстановительный смысл пассивного constituetur в данном контексте.
- source_word: in suum initium
  choice: к своему началу
  rationale: Формально сохраняет притяжательное suum и неоднозначность initium, не подменяя «начало» толкованием вроде «первоначальное состояние».
- source_word: Et quoniam
  choice: И поскольку
  rationale: Сохраняет союз и причинное введение в следующую, незавершённую в данном фрагменте мысль.
theological_decisions:
- issue: Значение возвращения «к своему началу»
  choice: Сохранена буквальная формулировка без пояснения объекта или характера восстановления.
  alternative: «будет восстановлено в первоначальном виде»
  rationale: Латинский текст допускает смысл возвращения к исходному состоянию, но прямо говорит initium — «начало»; более истолковывающий вариант снял бы подлинную неоднозначность.
