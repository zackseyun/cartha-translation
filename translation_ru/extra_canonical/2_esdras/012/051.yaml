source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: ru
  text: Я же сидел в поле семь дней, как он повелел мне, и ел только полевые цветы; в те дни моя пища состояла из трав.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedi
  choice: оставался
  rationale: В данном контексте латинское «сидел» естественно передаёт продолжительное пребывание Ездры в поле; буквальное «сидел» по-русски могло бы неоправданно подчеркнуть положение тела.
- source_word: flores agri
  choice: полевые цветы
  rationale: Сохраняет конкретный образ исходного текста и естественно звучит по-русски.
- source_word: de herbis facta est mihi esca
  choice: пищей мне служили травы
  rationale: 'Естественно передаёт смысл латинской конструкции: травы составляли его пищу, без добавления идеи приготовления из трав.'
theological_decisions: []
