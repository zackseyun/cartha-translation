source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: ru
  text: 'А то, что ты видел три покоящиеся головы, истолковывается так: в её последние дни Всевышний воздвигнет три царства, многое обновит в ней[a], и они будут властвовать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское «в ней» стоит в единственном числе; к чему именно относится это местоимение, в данном стихе прямо не указано.
    reason: Сохраняет грамматическое свидетельство источника и отмечает неясность антецедента, не поддерживая ошибочное множественное чтение «в них».
lexical_decisions:
- source_word: quiescentia
  choice: покоящиеся
  rationale: Передаёт причастное значение латинского среднего/непереходного состояния без добавления идеи сна или бездействия.
- source_word: in nouissimis eius
  choice: в последние дни её
  rationale: Латинское выражение обозначает заключительный период; местоимение сохраняет отсылку к ранее названной сущности, не заменяя её толкованием.
- source_word: suscitabit
  choice: воздвигнет
  rationale: Достоинственно и естественно передаёт действие установления или возвышения царств.
- source_word: tria regna
  choice: три царства
  rationale: Прямое соответствие латинскому regna с сохранением политико-апокалиптической образности.
- source_word: renouabit in ea multa
  choice: многое обновит в ней
  rationale: Сохраняет порядок смысловых компонентов и женское единственное число in ea, не превращая его в множественное «в них».
- source_word: dominabunt
  choice: будут властвовать
  rationale: Передаёт самостоятельное правление трёх царств и сохраняет множественное число.
theological_decisions:
- issue: К чему относятся местоимения eius и in ea
  choice: 'Сохранить местоименную отсылку: «её» и «в ней»'
  alternative: 'Назвать предполагаемый антецедент прямо: «державы», «орлицы» или «земли»'
  rationale: Латинский фрагмент не называет антецедент в самом стихе; его конкретизация сняла бы подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис сделан ясным для чтения вслух; сохранены апокалиптические термины «Всевышний», «царства» и «властвовать».
