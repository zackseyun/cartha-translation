  text: Однако и этот в последние дни падёт от меча.[a] А поскольку ты видел
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему прочтению: «Но тех двоих, которые остались, пожрёт меч. Ибо меч одного пожрёт того, кто с ним».'
    reason: Предыдущее прочтение относилось к более раннему фрагменту латинского текста; оно приводится для документирования прежней редакции, но не соответствует данному исходному отрывку.
lexical_decisions:
- source_word: sed tamen
  choice: но
  rationale: Передаёт противительный смысл; отдельное «однако» рядом с «и» по-русски звучало бы избыточно.
- source_word: et hic
  choice: и он
  rationale: Латинское hic указывает на уже упомянутого участника; местоимение «он» естественно сохраняет эту отсылку.
- source_word: gladio ... cadet
  choice: падёт от меча
  rationale: Сохраняет образ и синтаксическую краткость латинского выражения.
- source_word: in nouissimis
  choice: в последние дни
  rationale: Передаёт эсхатологически окрашенное, но не уточнённое латинское выражение без попытки определить точный срок.
- source_word: Et quoniam uidisti
  choice: А поскольку ты видел
  rationale: Сохраняет незавершённый переход к следующему фрагменту и причинно-связующий смысл quoniam.
theological_decisions:
- issue: Временная отсылка in nouissimis
  choice: в последние дни
  alternative: в конце времён
  rationale: Выбранная формулировка сохраняет традиционную эсхатологическую открытость и не усиливает исходный текст дополнительным словом «времён».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Сохранена незавершённость последней фразы, поскольку исходный фрагмент продолжается в следующем стихе.
