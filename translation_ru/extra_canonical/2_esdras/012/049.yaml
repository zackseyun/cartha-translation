lexical_decisions:
- source_word: ite
  choice: идите
  rationale: Прямо передаёт повелительную форму множественного числа.
- source_word: unusquisque uestrum
  choice: каждый
  rationale: Естественная русская передача distributive expression «каждый из вас»; принадлежность к группе ясна из множественного числа глагола и контекста.
- source_word: in domum suam
  choice: в свой дом
  rationale: 'Сохраняет возвратное значение suam: каждому надлежит идти в собственный дом.'
- source_word: post dies istos
  choice: по прошествии этих дней
  rationale: Передаёт временное значение post и сохраняет указательное «этих», не уточняя неопределённую продолжительность периода.
