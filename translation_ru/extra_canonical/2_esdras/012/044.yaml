id: 2ES.12.44
reference: 2 Esdras 12:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nobis mala quae contigerunt? Si ergo tu nos dereliqueris, quanto erat nobis melius, si essemus succensi et nos in incendio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: ru
  text: Или недостаточно бед, постигших нас? Если же ты оставишь нас, насколько лучше было бы для нас, если бы и мы сгорели в огне!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala quae contigerunt
  choice: беды, постигшие нас
  rationale: Передаёт mala как пережитые несчастья, а contigerunt — естественным русским оборотом «постигшие нас».
- source_word: dereliqueris
  choice: оставишь
  rationale: Сохраняет прямой смысл «покинешь, оставишь» без добавления богословского толкования.
- source_word: succensi ... in incendio
  choice: сгорели в огне
  rationale: Естественно передаёт сочетание со значением «быть сожжёнными/сгореть в огне» и избегает неуклюжей тавтологии.
theological_decisions:
- issue: Условное высказывание об оставлении народа
  choice: «Если же ты оставишь нас»
  alternative: «Если же ты нас покинешь»
  rationale: Формулировка сохраняет напряжённое условие исходного текста и не уточняет ни причины, ни окончательности оставления.
translation_notes:
  register: Современный литературный русский язык; тон скорбный и настойчивый, синтаксис ясный, но сохраняющий риторический вопрос и эмоциональное восклицание оригинала.
