  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: ru
  text: '«А что ты видел два малых крыла, перешедших к голове с правой стороны, то вот истолкование: это те, кого Всевышний сохранил до конца. Это было незначительное царство, полное смуты».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: finem suam
  choice: до конца этого царства
  rationale: Возвратное suam требует соотнесения с подразумеваемым царством; явное «этого царства» естественно по-русски и сохраняет связь с последующим regnum.
- source_word: regnum exile
  choice: царство их было недолгим
  rationale: В данном контексте exile характеризует царство как малое или кратковременное; «недолгим» ясно передаёт временной смысл, отражённый также в контекстуальной традиции текста.
- source_word: turbationis plenum
  choice: исполненным смуты
  rationale: Формула передана близко к латинской; «смута» выражает общественно-политические волнения, не сводя смысл к личному беспокойству.
- source_word: Sicut
  choice: не включено в этот стих
  rationale: Слово открывает следующую синтаксическую единицу и в предоставленном английском разграничении стиха 12:30 не представлено.
theological_decisions:
- issue: К кому относится suam в выражении finem suam
  choice: к царству
  alternative: «до его конца» или просто «до конца»
  rationale: Контекст непосредственно поясняет судьбу царства; выбранная формулировка устраняет неестественную русскую местоименную двусмысленность, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. «Вот истолкование», «Всевышний» и «исполненным смуты» поддерживают достоинство пророческого жанра без архаизации.
