- from: '«А что ты видел два малых крыла, перешедших к голове с правой стороны, то вот истолкование: это те, кого Всевышний сохранил до конца этого царства. Царство их было недолгим и исполненным смуты».'
  to: '«А что ты видел два малых крыла, перешедших к голове с правой стороны, то вот истолкование: это те, кого Всевышний сохранил до конца. Это было незначительное царство, полное смуты».'
  rationale: Убрано необоснованное уточнение референта местоимения при finem suam, чтобы сохранить текстовую неопределённость. Exile передано как «незначительное», а hoc erat — как «Это было», без добавления принадлежности. Sicut не включено, поскольку оно начинает следующую синтаксическую единицу согласно предоставленному разграничению.
