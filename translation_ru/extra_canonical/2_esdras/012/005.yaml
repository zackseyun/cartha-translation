  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: ru
  text: Я очень слаб духом, и во мне нет даже малой силы из-за великого страха, который привёл меня в ужас этой ночью. Поэтому теперь я помолюсь.
