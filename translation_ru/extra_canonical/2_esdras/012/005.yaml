lexical_decisions:
- source_word: spiritu meo inualidus sum ualde
  choice: Я очень слаб духом
  rationale: Передаёт состояние глубокой внутренней слабости без добавления отсутствующего в латинском тексте указания на её начало.
- source_word: nec modica est in me uirtus
  choice: во мне не осталось даже малой силы
  rationale: Естественная русская передача усиленного отрицания; «сила» соответствует virtus в данном контексте изнеможения.
- source_word: a multo timore quem expaui nocte hac
  choice: из-за великого страха, охватившего меня этой ночью
  rationale: 'Сохраняет причинное значение a и интенсивность expaui: речь не просто об испытанном чувстве, а о сильном ужасе.'
- source_word: Nunc ergo orabo
  choice: Поэтому теперь я помолюсь
  rationale: Передаёт и логическое следствие ergo, и временное nunc; фраза присутствует в предоставленном латинском источнике.
