lexical_decisions:
- source_word: Quid peccauimus tibi
  choice: Чем мы согрешили против тебя
  rationale: Естественно передаёт вопрос о том, в чём состоял грех против адресата, не воспроизводя неестественную для русского буквальную конструкцию.
- source_word: quid iniuste egimus in te
  choice: какую несправедливость причинили тебе
  rationale: Передаёт значение iniuste agere in aliquem — поступить с кем-либо несправедливо, причинить ему неправду.
- source_word: derelinquens dereliquisti nos
  choice: ты совсем оставил нас
  rationale: Латинская усилительная конструкция с причастием и личной формой того же глагола выражает полноту оставления; «совсем» естественно сохраняет усиление.
