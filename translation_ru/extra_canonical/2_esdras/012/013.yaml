- source_word: timoratio omnium regnorum
  choice: станет ужасом для всех царств
  rationale: Передаёт засвидетельствованное в предоставленном тексте существительное timoratio как «ужас», а родительный omnium regnorum — естественной русской конструкцией «для всех царств».
- source_word: quae fuerunt ante eam
  choice: существовавших прежде
  rationale: Сохраняет временной смысл и избегает неясного в отрывке местоименного соотнесения латинского eam, не добавляя отсутствующего в русском контексте референта.
