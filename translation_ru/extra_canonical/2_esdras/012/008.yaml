  text: the interpretation and the distinction of this dreadful vision[a], so that you may fully comfort my soul. For you have counted me worthy
translation:
  language: ru
  text: истолкование и разъяснение этого ужасающего видения[a], чтобы Ты в полной мере утешил мою душу. Ведь Ты счёл меня достойным
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежнем варианте: «и покажи Твоему рабу истолкование». Эти слова относятся к концу предыдущего стиха; здесь латинский текст начинается словами «истолкование и разъяснение».'
    reason: previous_rendering
lexical_decisions:
- source_word: interpretationem
  choice: истолкование
  rationale: Передаёт значение раскрытия смысла видения и сохраняет форму прямого дополнения, продолжающего просьбу из предыдущего стиха.
- source_word: distinctionem
  choice: разъяснение
  rationale: В данном контексте означает прояснение и подробное раскрытие видения; буквальное «различение» по-русски было бы неясным.
- source_word: uisus horribilis huius
  choice: этого ужасающего видения
  rationale: Естественно передаёт латинское сочетание и силу horribilis без архаизации.
- source_word: ut plenissime consoles animam meam
  choice: чтобы Ты вполне утешил мою душу
  rationale: Сохраняет целевое значение ut, превосходную степень наречия plenissime и обращение к Богу во втором лице.
- source_word: Dignum enim me habuisti
  choice: Ведь Ты счёл меня достойным
  rationale: Точно передаёт устойчивую конструкцию dignum habere; фраза намеренно остаётся незавершённой, поскольку продолжается в следующем стихе.
theological_decisions:
- issue: Объект просьбы в начале стиха
  choice: Начать непосредственно словами «истолкование и разъяснение»
  alternative: «и покажи Твоему рабу истолкование»
  rationale: Латинский текст стиха начинается с accusativus interpretationem et distinctionem; добавочная просьба «покажи рабу Твоему» относится к концу предыдущего стиха и здесь не должна дублироваться.
- issue: Степень утешения
  choice: «вполне утешил»
  alternative: «полностью утешил»
  rationale: «Вполне» естественно и достойно передаёт plenissime, не привнося дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Синтаксическая незавершённость последней фразы сохранена как переход к следующему стиху.
