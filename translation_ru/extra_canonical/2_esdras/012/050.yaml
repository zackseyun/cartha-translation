lexical_decisions:
- source_word: profectus est
  choice: отправился
  rationale: Передаёт начало и совершение движения естественным современным русским языком; согласовано с собирательным существительным «народ» в единственном числе.
- source_word: in ciuitatem
  choice: в город
  rationale: Латинское направление движения с in и винительным падежом прямо передано русской конструкцией «в город».
- source_word: sicut dixi ei
  choice: как я ему велел
  rationale: Сохраняет местоимение ei в единственном числе («ему»). В данном контексте dixi может обозначать данное указание; «велел» естественно выражает смысл, не меняя адресата на множественное число.
