  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: ru
  text: которые доведут до конца его последние дела. И то, что ты видел, как исчезла более крупная голова, означает, что один из них умрёт в своей постели, и всё же в мучениях. А двое оставшихся —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: perficient nouissima eius
  choice: доведут до конца последние его дела
  rationale: Передаёт и значение perficient («завершат, доведут до конца»), и неоднозначное nouissima («последнее, завершающее»), не сводя выражение только к событиям или поступкам.
- source_word: caput maius
  choice: большая голова
  rationale: Формально и естественно передаёт сравнительную характеристику символической головы; контекст не требует уточнять «самая большая».
- source_word: non apparescens
  choice: исчезла
  rationale: В контексте увиденного знамения означает, что голова перестала быть видимой; русское «исчезла» звучит естественно.
- source_word: super lectum suum morietur
  choice: умрёт на своей постели
  rationale: Сохраняет конкретный образ и контраст с последующими мучениями.
- source_word: et tamen cum tormentis
  choice: но в мучениях
  rationale: Передаёт уступительно-противительное tamen и сохраняет неопределённость природы tormenta.
- source_word: duo qui superauerunt
  choice: двое оставшихся
  rationale: В данном контексте superaverunt означает тех двоих, которые пережили или остались после смерти первого; «оставшихся» естественно продолжает незавершённую фразу.
theological_decisions:
- issue: Характер мучений при смерти на постели
  choice: в мучениях
  alternative: под пытками / с карами
  rationale: Латинское tormentis допускает физические мучения, пытки или кары; нейтральное «в мучениях» сохраняет широту смысла и не вводит лишней конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранены начальная и конечная синтаксическая незавершённость, поскольку предоставленный латинский фрагмент начинается продолжением предыдущей фразы и обрывается после Nam duo qui superauerunt.
