- source_word: non fuissem reuersus in ciuitatem
  choice: я не вернулся в город
  rationale: Передаёт предшествующее событие без неестественной для русского речи усложнённой временной формы.
- source_word: a minimo usque ad maximum
  choice: от малого до великого
  rationale: Сохраняет устойчивую меристическую формулу, означающую всех без исключения.
- source_word: uenit ad
  choice: пришли к
  rationale: Сохраняет незавершённость фразы исходного фрагмента; дополнение следует в следующем стихе или сегменте.
