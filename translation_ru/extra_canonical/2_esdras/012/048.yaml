source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: ru
  text: Ибо я не оставил вас и не ушёл от вас, но пришёл на это место, чтобы молиться о разорении Сиона и просить милости ради унижения вашего святилища.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: оставил
  rationale: Естественно и точно передаёт значение «покинуть, оставить» в контексте заверения народа.
- source_word: excessi a uobis
  choice: ушёл от вас
  rationale: Сохраняет отдельный от dereliqui образ физического удаления и звучит естественно по-русски.
- source_word: deprecarer pro desolatione Sion
  choice: молиться о разорении Сиона
  rationale: Передаёт ходатайственный смысл deprecari, не уточняя без достаточных оснований, просит ли говорящий устранить разорение или проявить милость в связи с ним.
- source_word: quererem misericordiam
  choice: просить милости
  rationale: В данном контексте quaerere misericordiam означает добиваться, испрашивать милость, а не просто искать её.
- source_word: humilitate sanctificationis uestrae
  choice: унижения вашего святилища
  rationale: Sanctificatio здесь метонимически обозначает освящённое место, святилище; humilitas сохраняется как «унижение», не сводясь к одному лишь разрушению.
theological_decisions:
- issue: Отношение просьбы о милости к унижению святилища
  choice: просить милости ради унижения вашего святилища
  alternative: просить милости для вашего униженного святилища
  rationale: Латинское pro допускает оттенки «за, ради, в связи с». Выбранная формулировка сохраняет смысл ходатайства по причине постигшего святилище унижения и не персонифицирует святилище как прямого получателя милости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм исходного текста сохранён; архаизмы и конфессионально маркированные формулы не использованы.
