source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: ru
  text: Это — Помазанник[a], которого Всевышний сберёг на конец против них и их нечестия. Он обличит их в их несправедливостях и поставит перед ними их презрение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское unctus буквально означает «помазанный». В этом видении так назван избавитель последних времён, который обличает царство орла и спасает остаток; поэтому титул имеет мессианское звучание.
    reason: messianic_passage
lexical_decisions:
- source_word: unctus
  choice: Помазанник
  rationale: Передаёт буквальное значение латинского слова и сохраняет мессианское звучание титула в контексте видения.
- source_word: reservavit ... in finem
  choice: сохранил до конца
  rationale: Точно передаёт мысль о том, что Всевышний удерживал эту фигуру для эсхатологического времени, не уточняя сверх сказанного, означает ли finis конец времён или заключительный этап событий.
- source_word: ad eos et impietates ipsorum
  choice: чтобы выступить против них и их нечестия
  rationale: Латинское ad здесь естественно понимается как направленность против людей и их нечестия; добавление «чтобы выступить» делает синтаксис ясным по-русски, не конкретизируя способ действия.
- source_word: arguet illos de iniustitiis ipsorum
  choice: обличит их в несправедливости
  rationale: «Обличит» передаёт судебно-пророческий оттенок arguet, а собирательное «несправедливость» естественно звучит по-русски при сохранении смысла множественного iniustitiis.
- source_word: infulciet coram ipsis spretiones eorum
  choice: поставит перед ними их презрение
  rationale: 'Сохраняет необычный и несколько неясный образ исходного текста: их проявления презрения будут предъявлены им самим, без домысливания объекта этого презрения.'
theological_decisions:
- issue: Мессианская идентичность unctus
  choice: Помазанник
  alternative: помазанный
  rationale: Заглавная буква и субстантивированный титул уместны, поскольку контекст изображает конкретного избавителя последних времён; примечание сохраняет буквальный смысл и объясняет мессианское звучание.
- issue: Значение in finem
  choice: до конца
  alternative: на конец времён
  rationale: Более буквальная формулировка сохраняет возможную неоднозначность finis и не навязывает строго определённую эсхатологическую схему.
- issue: Неясный оборот spretiones eorum
  choice: их презрение
  alternative: то, чем они пренебрегали
  rationale: Сохранён абстрактный смысл латинского существительного и не добавлен не названный в источнике объект презрения.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный библейский регистр. Синтаксис упрощён лишь там, где буквальное воспроизведение латинского оборота было бы неестественным; смысловая неоднозначность «до конца» и «их презрение» сохранена.
