translation:
  language: ru
  text: Но лишь ты был достоин узнать эту тайну Всевышнего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знать эту тайну Всевышнего».'
    reason: Латинское *scire* может обозначать как обретение знания («узнать»), так и обладание знанием («знать»).
lexical_decisions:
- source_word: Tu autem solus
  choice: Но только ты
  rationale: Передаёт противопоставление autem и исключительное solus естественным современным русским порядком слов.
- source_word: dignus fuisti
  choice: оказался достоин
  rationale: Латинский оборот означает «ты был/оказался достоин»; формулировка не добавляет идеи внешнего признания или суда.
- source_word: scire
  choice: узнать
  rationale: В данном контексте речь идёт о получении доступа к ранее сокрытой тайне; «узнать» звучит естественнее, чем статическое «знать».
- source_word: altissimi secretum hoc
  choice: эту тайну Всевышнего
  rationale: Сохраняет указательное hoc и родительную связь с титулом Altissimus; «Всевышний» — естественный и традиционный русский эквивалент.
theological_decisions:
- issue: Характер достоинства адресата
  choice: оказался достоин
  alternative: был признан достойным
  rationale: Источник говорит dignus fuisti и не содержит глагола со значением «признать» или «счесть»; поэтому внешнее признание не вносится в текст.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием; синтаксис краткий и доступный, без архаизмов.
