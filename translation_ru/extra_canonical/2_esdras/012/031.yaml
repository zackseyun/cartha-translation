  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: ru
  text: как ты видел. А лев, которого ты видел восстающим из леса, рычащим, говорящим с орлом и обличающим его за его несправедливости и за все его слова, как ты слышал,—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de silua euigilantem
  choice: пробуждающимся в лесу
  rationale: Передаёт образ льва, пробуждающегося или поднимающегося от сна в лесу, без добавления отсутствующего в источнике движения «из леса».
- source_word: mugientem
  choice: рычащим
  rationale: Латинское слово буквально может обозначать рёв или мычание; применительно ко льву естественный русский эквивалент — «рычащим».
- source_word: arguentem eam
  choice: обличающим его
  rationale: Arguere здесь означает изобличать или укорять; местоимение eam относится к aquila, грамматически женского рода в латыни, но по-русски «орёл» мужского рода.
- source_word: iniustitias ipsius
  choice: его несправедливость
  rationale: Латинское множественное число обозначает совокупность несправедливых деяний; русское отвлечённое единственное число звучит естественно и не сужает смысл до одного поступка.
- source_word: omnes sermones eius
  choice: все его слова
  rationale: Сохраняет широкий смысл sermones как произнесённых речей или слов, не уточняя их содержание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Начальное «как ты и видел» сохранено как завершение предыдущей мысли; конечное тире показывает, что синтаксическое продолжение следует в следующем стихе. Фрагмент «Hic est unctus, quem» не включён, поскольку по принятому делению он открывает 12:32.
