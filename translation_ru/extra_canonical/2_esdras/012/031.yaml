    rationale: 'Предлог de с ablativus обозначает исходную точку: лев пробуждается/восстаёт из леса. Вариант «в лесу» меняет пространственное отношение.'
  - severity: low
    issue: Iniustitias передано единственным числом «несправедливость».
    rationale: В источнике стоит множественное число; «несправедливости» сохраняет полноту обвинений без стилистической потери.
  - severity: low
