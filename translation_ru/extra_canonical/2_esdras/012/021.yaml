  yaml_path: translation/extra_canonical/2_esdras/012/021.yaml
  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: ru
  text: времена которых будут кратки[a], а годы — быстротечны. Двое из них погибнут, когда приблизится середина времени, а четверо будут сохранены в то время, когда начнёт приближаться его конец,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «времена которых будут лёгкими».'
    reason: Латинское leuia буквально может означать «лёгкие», хотя применительно ко времени здесь вероятнее значение «краткие, быстротечные».
lexical_decisions:
- source_word: leuia
  choice: кратки
  rationale: При характеристике времён латинское levis естественно означает «краткий, непродолжительный, быстротечный», а не буквально «лёгкий» по весу.
- source_word: anni citati
  choice: годы — быстротечны
  rationale: Citatus передаёт стремительное движение; «быстротечны» естественно сочетается с годами и сохраняет образ быстро проходящего времени.
- source_word: perient
  choice: погибнут
  rationale: Передаёт сильное значение pereo без уточнения способа гибели.
- source_word: seruabuntur
  choice: будут сохранены
  rationale: Сохраняет пассивную форму и более формальное значение латинского servo, не уточняя, кем или каким образом они будут сохранены.
theological_decisions:
- issue: Референт местоимения eius в заключительной части
  choice: его конец
  alternative: конец этого времени / срок его окончания
  rationale: Местоименная формулировка сохраняет не вполне явный референт латинского eius и не навязывает толкование, относится ли оно к периоду, царству или иному предмету ближайшего контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Сохранена структура фрагмента и конечная запятая, поскольку стих синтаксически продолжается.
