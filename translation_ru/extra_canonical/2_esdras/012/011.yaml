  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: ru
  text: четвёртое царство, которое Даниил, твой брат, увидел в видении. Но ему оно не было истолковано так, как я теперь истолковываю его тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: четвёртое царство
  rationale: Прямой и естественный эквивалент латинского выражения, сохраняющий связь с видением Даниила.
- source_word: uisum est in uisu
  choice: было показано в видении
  rationale: Передаёт пассивную конструкцию и избегает неестественного русского повтора «увидено в видении».
- source_word: Danihelo fratri tuo
  choice: твоему брату Даниилу
  rationale: Сохраняет обращение «твой брат» как обозначение духовного и народного родства.
- source_word: interpretatum / interpretor
  choice: истолковано / истолковываю
  rationale: Единый корень отражает повтор латинского interpretari и уместен в контексте объяснения видения.
theological_decisions:
- issue: Смысл сравнительной конструкции quomodo ego nunc tibi interpretor
  choice: так, как Я теперь истолковываю его тебе
  alternative: подобно тому, как Я теперь истолковываю его тебе
  rationale: Формулировка сохраняет сопоставление степени или способа истолкования, не утверждая, что Даниил вовсе не получил никакого объяснения.
- issue: Референт говорящего ego
  choice: Я с прописной буквы
  alternative: я со строчной буквы
  rationale: В контексте толкование сообщает божественный говорящий; прописная буква соответствует русской библейской издательской традиции, не добавляя имени или титула.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сохраняет фрагментарное продолжение предыдущего стиха, как в исходном тексте; местоимение «его» добавлено для естественности и ясности русского выражения.
