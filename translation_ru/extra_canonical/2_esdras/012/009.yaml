lexical_decisions:
- source_word: temporum finem
  choice: конец времён
  rationale: Прямо передаёт латинское выражение, сохраняя эсхатологический смысл и множественное число.
- source_word: temporum nouissima
  choice: то, что будет в самые последние времена
  rationale: Субстантивированное nouissima обозначает последние события или обстоятельства; развёрнутая передача звучит естественно по-русски и не уточняет их характер сверх источника.
- source_word: interpretatio
  choice: истолкование
  rationale: Подходит к объяснению символического видения и сохраняет формальный, возвышенный регистр.
theological_decisions:
- issue: Соотношение выражений temporum finem и temporum nouissima
  choice: Сохранить оба выражения, не сводя их к одному понятию
  alternative: Объединить их как «конец времён»
  rationale: Латинский текст намеренно использует два параллельных, но не полностью тождественных выражения; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальная и конечная незавершённость фразы сохранена, поскольку стих представляет собой часть более длинного предложения.
