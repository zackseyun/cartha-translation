    rationale: Формулировка допустима, но «подверг» обычно предполагает конкретное тяжёлое испытание или состояние и несколько меняет широкое praestitisti haec. «Ты навлёк на меня всё это» естественнее выражает, что дух стал причиной пережитого, не теряя множественно-собирательного haec.
