  text: 'et ego a multo excessu mentis et a magno timore uigilaui, et dixi spiritui meo: Ecce tu mihi praestitisti haec in eo quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: ru
  text: 'Тогда я очнулся от сильного смятения ума[a] и великого страха и сказал своему духу: «Вот, ты навлёк на меня всё это, потому что…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от сильного исступления».'
    reason: Латинское excessus mentis может обозначать смятение, исступление или необычное состояние сознания.
lexical_decisions:
- source_word: a multo excessu mentis
  choice: от сильного смятения ума
  rationale: Передаёт интенсивное необычное состояние сознания, из которого Ездра приходит в себя, не сводя многозначное excessus mentis исключительно к трансу или экстазу.
- source_word: uigilaui
  choice: я очнулся
  rationale: В данном контексте означает возвращение к обычному бодрствующему состоянию после видения или душевного потрясения.
- source_word: spiritui meo
  choice: своему духу
  rationale: Прямо сохраняет латинское выражение и внутреннее обращение говорящего.
- source_word: praestitisti haec
  choice: ты подверг меня всему этому
  rationale: Естественно по-русски передаёт причинение пережитого, сохраняя множественно-собирательное значение haec.
- source_word: in eo quod
  choice: потому что
  rationale: Сохраняет незавершённую причинную конструкцию, продолжающуюся в следующем стихе.
theological_decisions:
- issue: Смысл выражения excessus mentis
  choice: сильное смятение ума
  alternative: глубокое исступление; глубокий транс
  rationale: Выбранная формулировка сохраняет психологическую и визионерскую неоднозначность латинского выражения и не уточняет сверх текста характер состояния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Незавершённость фразы оригинала сохранена многоточием после причинного союза.
