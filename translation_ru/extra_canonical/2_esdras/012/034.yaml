  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: ru
  text: Он с милостью избавит Мой народ[a] — тех, кто был сохранён в Моих пределах, — и обрадует их, пока не придёт конец, день суда, о котором Я говорил тебе с самого начала. Таков сон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В другой разбивке стихов перед этими словами читается: «Когда же он обличит их, тогда погубит их. Но остаток моего народа…» Эти слова относятся к предыдущему стиху; данный стих начинается словами «он с милостью избавит Мой народ».'
    reason: Предупреждает о прежнем варианте, возникшем из-за смещения границ стихов, и поясняет строгое соответствие указанному латинскому отрывку.
lexical_decisions:
- source_word: liberabit cum misericordia
  choice: милосердно избавит
  rationale: Передаёт и действие liberabit, и обстоятельственное значение cum misericordia естественным современным русским оборотом.
- source_word: qui saluati sunt
  choice: тех, кто был сохранён
  rationale: Латинская пассивная форма допускает значение сохранения или спасения; здесь контекстуально уместно «сохранён», без уточнения действующего лица.
- source_word: super fines meos
  choice: в моих пределах
  rationale: В данном контексте fines обозначает пределы или границы владения; русский оборот сохраняет пространственный смысл и не сужает его до пограничной линии.
- source_word: iocundabit eos
  choice: будет радовать их
  rationale: 'Передаёт каузативный смысл глагола: он сделает так, что они будут радоваться.'
- source_word: quoadusque ueniat finis, dies iudicii
  choice: пока не придёт конец, день суда
  rationale: Сохраняет приложение, в котором «день суда» поясняет «конец», не вводя отсутствующего в источнике союза.
- source_word: Hoc est somnium
  choice: Вот этот сон
  rationale: Естественная русская формула указания на только что истолкованное сновидение; сохраняет краткость латинского выражения.
theological_decisions:
- issue: Объект избавления и относительное придаточное
  choice: «мой народ — тех, кто был сохранён»
  alternative: «мой народ, который был спасён»
  rationale: Сохраняется возможное пояснительное отношение qui saluati sunt к populum meum и не утверждается более узкий богословский смысл окончательного спасения.
- issue: Соотношение конца и дня суда
  choice: «конец, день суда»
  alternative: «конец — день суда»
  rationale: Запятая ближе воспроизводит латинское приложение и сохраняет некоторую синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Заглавное «Я» обозначает говорящего Бога по норме религиозного русского письма. Тире выделяют пояснение к словосочетанию «мой народ».
