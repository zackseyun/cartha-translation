  rationale: Сохраняет порядок указания и связь с предшествующей речью.
- source_word: ad
  choice: орлу
  rationale: В представленном латинском отрывке после предлога ad отсутствует дополнение; «орлу» восстановлено по непосредственному повествовательному контексту и подтверждается английским консультационным текстом.
