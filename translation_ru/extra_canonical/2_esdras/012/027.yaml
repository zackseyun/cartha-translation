  yaml_path: translation/extra_canonical/2_esdras/012/027.yaml
  text: the sword will devour them[a]. For one sword will devour him who is with it,
translation:
  language: ru
  text: меч пожрёт их. Ибо один меч пожрёт того, кто с ним,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл второй части в латинском тексте не вполне ясен; возможно также: «Ибо меч одного пожрёт того, кто с ним».'
    reason: Сохраняет и поясняет синтаксическую и референциальную неоднозначность Vnius enim gladius ... qui cum eo.
lexical_decisions:
- source_word: gladius ... comedet
  choice: меч пожрёт
  rationale: Сохраняет яркую латинскую метафору пожирающего меча и повтор глагола в обеих частях.
- source_word: eos
  choice: их
  rationale: Прямо передаёт винительный падеж множественного числа.
- source_word: Vnius ... gladius
  choice: один меч
  rationale: Передаёт наиболее непосредственное чтение формы Vnius при сохранении некоторой шероховатости повреждённого или неполного контекста.
- source_word: qui cum eo
  choice: того, кто с ним
  rationale: Местоимение eo грамматически может соотноситься с мужским gladius; формулировка сохраняет референциальную неоднозначность латинского текста.
theological_decisions:
- issue: Кого или что обозначает eo в qui cum eo
  choice: «кто с ним» без уточнения референта
  alternative: «кто вместе с мечом» / «кто с ним [с одним из них]»
  rationale: Латинский отрывок сам по себе не позволяет уверенно устранить неоднозначность; богословское или сюжетное уточнение не внесено.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Сохранён резкий повтор «меч пожрёт», соответствующий латинскому оригиналу.
