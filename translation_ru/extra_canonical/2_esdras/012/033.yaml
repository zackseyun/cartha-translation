  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
translation:
  language: ru
  text: 'И будет: когда он обличит их, тогда погубит их. Ибо остаток…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: arguerit
  choice: обличит
  rationale: Передаёт значение латинского arguere — уличить, изобличить или осудительно указать на вину — без добавления отсутствующей в тексте публичности.
- source_word: corrumpet
  choice: погубит
  rationale: В данном контексте futurum corrumpet означает довести до гибели, уничтожить; «погубит» естественно и достаточно точно передаёт этот смысл.
- source_word: residuum
  choice: остаток
  rationale: Прямое соответствие латинскому существительному; незавершённость фразы сохранена, поскольку источник обрывается и продолжается в следующем стихе.
theological_decisions:
- issue: Личность подразумеваемого действующего лица
  choice: Сохранено местоимение «он» без поясняющего титула.
  alternative: «Помазанник» или иной явно названный субъект.
  rationale: В данном латинском фрагменте субъект лишь подразумевается из предыдущего контекста; добавление титула внесло бы материал из предшествующего стиха.
- issue: Характер действия corrumpet
  choice: «погубит»
  alternative: «уничтожит» или «развратит»
  rationale: Контекст суда поддерживает значение гибели; перевод не уточняет способ и тем самым не усиливает текст сверх источника.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Латинская конструкция et erit cum передана естественным русским «И когда», без тяжеловесного «И будет, когда». Конечная незавершённость сохранена многоточием, поскольку Nam residuum представляет начало продолжающейся фразы.
