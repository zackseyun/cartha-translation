  text: Но два будут сохранены до конца. И поскольку ты видел три головы
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duo uero
  choice: но два
  rationale: «Но» передаёт противопоставительное значение uero в данном контексте, а «два» сохраняет субстантивированное числительное оригинала.
- source_word: in finem seruabuntur
  choice: будут сохранены до конца
  rationale: Пассивная конструкция точно передаёт seruabuntur, а «до конца» естественно соответствует in finem, не уточняя, о каком именно конце идёт речь.
- source_word: quoniam uidisti
  choice: поскольку ты видел
  rationale: «Поскольку» сохраняет причинно-пояснительную связь quoniam и не завершает мысль, которая продолжается в следующем стихе.
- source_word: tria capita
  choice: три головы
  rationale: Прямое и контекстуально ясное соответствие латинскому выражению.
