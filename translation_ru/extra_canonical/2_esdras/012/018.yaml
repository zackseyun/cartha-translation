source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: ru
  text: 'Вот толкование: спустя некоторое время в том царстве[a] возникнут немалые распри, и оно окажется под угрозой падения, но не падёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «после времени того царства»; возможно также: «по прошествии времени того царства».'
    reason: 'Латинское post tempus regni illius формально допускает более буквальное понимание; основной текст передаёт вероятный контекстуальный смысл: распри возникают в период существования царства.'
lexical_decisions:
- source_word: post tempus regni illius
  choice: спустя некоторое время в том царстве
  rationale: Латинское post tempus здесь естественно понимать как «спустя некоторое время», а не как указание на завершение эпохи царства; последующие слова говорят, что царство окажется под угрозой падения, но не падёт.
- source_word: contentiones non modicae
  choice: немалые распри
  rationale: Сохраняет литоту non modicae и передаёт contentiones как серьёзные внутренние раздоры или столкновения.
- source_word: periclitabitur ut cadat
  choice: окажется под угрозой падения
  rationale: Передаёт опасность падения, не утверждая, что падение действительно произойдёт.
- source_word: et non cadet
  choice: но не падёт
  rationale: Противительный союз естественно выражает контраст с непосредственно предшествующей угрозой.
theological_decisions:
- issue: Происходят ли распри после окончания царства или во время его существования
  choice: во время существования царства — «спустя некоторое время в том царстве»
  alternative: «по прошествии времени того царства» / «после времени того царства»
  rationale: 'Альтернатива может создать впечатление, будто царство уже прекратилось, что плохо согласуется с продолжением: оно будет близко к падению, однако не падёт. Сноска сохраняет формально возможное более буквальное прочтение.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот толкование» понятно и естественно; «немалые распри» сохраняет риторическую форму латинской литоты.
