  text: tu domus Jacob. Est enim memoria uestri coram altissimo,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/047.yaml
  text: For the memory of you is before the Most High[a][b],
translation:
  language: ru
  text: Ты — дом Иакова. Ведь память о вас — пред Всевышним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь воспоминание о вас — пред Всевышним».'
    reason: 'Вариант передачи латинского memoria: «память» обозначает сохраняемую память о людях, а «воспоминание» сильнее подчёркивает акт припоминания.'
lexical_decisions:
- source_word: tu domus Jacob
  choice: Ты — дом Иакова
  rationale: Сохранено прямое обращение в единственном числе к собирательному «дому Иакова».
- source_word: memoria uestri
  choice: память о вас
  rationale: Латинское uestri передаёт объект памяти; «о вас» естественно выражает это по-русски и не создаёт смысла «ваша способность помнить».
- source_word: coram altissimo
  choice: пред Всевышним
  rationale: Краткая возвышенная формула точно передаёт coram («перед, в присутствии») и божественный титул altissimus.
theological_decisions:
- issue: Смысл memoria uestri перед Богом
  choice: Не уточнять сверх текста, каким образом Всевышний помнит адресатов
  alternative: «Всевышний помнит о вас»
  rationale: Именная конструкция источника сохраняет образ памяти, находящейся перед Всевышним, и его смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Пред» выбрано вместо разговорно-нейтрального «перед» ради краткости и достоинства; архаические формы не используются.
