translation:
  language: ru
  text: сел на этом месте? Ведь для нас ты превзошёл всех пророков — словно гроздь с виноградника и словно светильник в тёмном месте,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedisti
  choice: сидишь
  rationale: 'Латинский перфект здесь описывает наступившее и сохраняющееся состояние: адресат сел и продолжает находиться на этом месте. В современном русском «сидишь» естественно передаёт это в вопросе, начавшемся в предыдущем стихе.'
- source_word: superasti
  choice: один остался
  rationale: Хотя superasti может формально пониматься как «превзошёл», в данном контексте сочетание nobis, ex omnibus prophetis и образ грозди, оставшейся после сбора винограда, указывает на значение «уцелел, остался». Слово «один» эксплицирует подразумеваемую исключительность среди всех пророков.
- source_word: botrus de uindemia
  choice: виноградная гроздь после сбора урожая
  rationale: Передан образ грозди, сохранившейся после сбора винограда; такая формулировка ясна современному читателю и поддерживает контекстуальное значение «остался».
- source_word: lucerna
  choice: светильник
  rationale: «Светильник» сохраняет древний предметный образ и звучит естественно в библейском литературном регистре.
theological_decisions:
- issue: Смысл Tu enim nobis superasti ex omnibus prophetis
  choice: «из всех пророков ты один остался у нас»
  alternative: «для нас ты превзошёл всех пророков»
  rationale: 'Выбрано контекстуальное значение выживания или сохранения: следующий образ грозди после жатвы сопоставляет Ездру с редким остатком, а не оценивает его превосходство. Лексическая неоднозначность отмечена в сноске, чтобы не скрывать возможное иное прочтение.'
translation_notes:
  register: Современный литературный русский с dignified библейской образностью. Начальная строчная буква и конечная запятая сохранены, поскольку стих представляет собой фрагмент вопроса и продолжающегося высказывания. Синтаксис сделан естественным для устной речи персонажей без устранения древних образов.
