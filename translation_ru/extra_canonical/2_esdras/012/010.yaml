  yaml_path: translation/extra_canonical/2_esdras/012/010.yaml
  text: 'And he said to me, “This is the interpretation of the vision that you saw: the eagle that you saw coming up from the sea—this is'
translation:
  language: ru
  text: 'И он сказал мне: «Вот истолкование видения, которое ты видел: орёл, которого ты видел поднимающимся из моря, — это…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aquilam
  choice: орёл
  rationale: Прямое соответствие латинскому aquila; винительный падеж в исходном тексте обусловлен конструкцией, которая по-русски естественно передаётся именительным в пояснительном обороте.
- source_word: ascendentem
  choice: поднимающимся
  rationale: Причастие настоящего времени сохраняет образ продолжающегося движения вверх из моря, не уточняя способ появления.
- source_word: de mari
  choice: из моря
  rationale: Буквально и естественно передаёт исходную точку движения.
- source_word: hoc est
  choice: это
  rationale: Сохраняет незавершённую формулу истолкования, переходящую в следующий стих.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор «которое/которого ты видел» сохранён вслед за латинским текстом; многоточие обозначает синтаксическую незавершённость стиха.
