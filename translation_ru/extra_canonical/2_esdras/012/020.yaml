- from: 'А что до восьми малых крыльев, которые ты видел примыкающими к его крыльям, то вот истолкование: в нём восстанут восемь царей, времена правления которых…'
  to: 'А что до восьми малых крыльев, которые ты видел примыкающими к его крыльям, то вот истолкование: в нём появятся восемь царей, времена правления которых…'
