source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uidisti subalares octo coherentes alis eius, Haec est interpretatio : exsurgent enim in ipso octo reges, quorum erunt tempora'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: ru
  text: 'А что до восьми малых крыльев, которые ты видел примыкающими к его крыльям, то вот истолкование: в нём появятся восемь царей, времена правления которых…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subalares octo
  choice: восемь малых крыльев
  rationale: Латинское subalares обозначает меньшие, добавочные крылья; «малые крылья» естественно по-русски и сохраняет образ.
- source_word: coherentes alis eius
  choice: примыкающими к его крыльям
  rationale: Cohaerere передаёт тесное прилегание или соединение; «примыкающими» сохраняет пространственный образ без излишнего уточнения.
- source_word: exsurgent
  choice: восстанут
  rationale: Сохраняет пророческий регистр и значение появления или возвышения правителей.
- source_word: in ipso
  choice: в нём
  rationale: Буквально сохраняет местоименную отсылку к ранее упомянутому существу или царству, не разрешая её искусственно.
- source_word: reges
  choice: царей
  rationale: Прямое и традиционное соответствие латинскому reges.
- source_word: tempora
  choice: времена правления
  rationale: В данном контексте речь идёт о сроках или периодах, относящихся к царям; добавление «правления» делает связь ясной по-русски, не завершая оборванную мысль.
theological_decisions:
- issue: Референт выражения in ipso
  choice: сохранено местоимение «в нём»
  alternative: «в этом царстве» или «в орле»
  rationale: Латинский текст оставляет референт местоименным; перевод не должен навязывать конкретное толкование символа.
- issue: Незавершённость стиха
  choice: предложение оставлено открытым с многоточием
  alternative: завершить мысль по следующему стиху
  rationale: Источник заканчивается на quorum erunt tempora и синтаксически продолжается далее; перевод сохраняет границу предоставленного стиха и его незавершённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим оттенком. Конструкция «А что до… то вот истолкование» естественно передаёт связь видения с объяснением; подлинная неопределённость местоименной отсылки сохранена.
