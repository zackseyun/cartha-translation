  text: 'duas subalares treicentes super caput quod est a dextera parte, Haec est interpretatio: hii sunt quos conseruauit altissimus in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/029.yaml
  text: 'the two little wings crossing over to the head that is on the right side—this is the interpretation: these are the ones whom the Most High has preserved in[a]'
translation:
  language: ru
  text: 'Два малых крыла, прошедшие над головой, находящейся справа, — вот истолкование: это те, кого Всевышний сохранил в…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский текст здесь обрывается на предлоге in («в»).
    reason: Объясняет намеренно сохранённую незавершённость стиха и не воспроизводит прежнее примечание, относившееся к ошибочно совмещённому соседнему стиху.
lexical_decisions:
- source_word: duas subalares
  choice: два малых крыла
  rationale: В контексте видения орла subalares обозначает меньшие, второстепенные крылья; «малые крыла» естественно и сохраняет образ исходного текста.
- source_word: treicentes super caput
  choice: перелетевшие к голове
  rationale: Передаёт движение малых крыльев по направлению к голове; буквальное «перешедшие над головой» по-русски могло бы ошибочно означать движение поверх неё.
- source_word: quod est a dextera parte
  choice: с правой стороны
  rationale: Прямо и естественно передаёт расположение головы справа.
- source_word: conseruauit altissimus
  choice: Всевышний сохранил
  rationale: Сохраняет традиционное божественное наименование Altissimus и нейтральное значение глагола conservo.
theological_decisions:
- issue: Неоконченная фраза в предоставленном латинском источнике
  choice: Сохранить обрыв после предлога «в…»
  alternative: Дополнить фразу по следующему стиху или иному свидетелю
  rationale: Исходный текст заканчивается словом in, поэтому дополнение без представленного источникового материала необоснованно и могло бы снять реальную текстовую неопределённость.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но понятный. Двоеточие и тире ясно отделяют описание видения от его истолкования.
