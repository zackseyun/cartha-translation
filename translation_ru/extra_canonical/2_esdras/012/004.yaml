lexical_decisions:
- source_word: scrutas
  choice: исследуешь
  rationale: Передаёт настойчивое разыскание и тщательное постижение, не усиливая смысл до «испытываешь».
- source_word: uias altissimi
  choice: пути Всевышнего
  rationale: Сохраняет традиционный библейский образ и превосходную степень латинского Altissimus.
- source_word: Ecce
  choice: Вот
  rationale: Естественный библейский указательный оборот в современном литературном русском.
- source_word: adhuc
  choice: всё ещё
  rationale: Передаёт продолжающееся состояние.
- source_word: fatigatus sum animo
  choice: я всё ещё утомлён духом
  rationale: Animo допускает значения «дух», «душа», «ум» и внутреннее состояние; «духом» естественно обозначает внутреннее изнеможение и соответствует консультационному слою.
theological_decisions:
- issue: Значение animo
  choice: духом
  alternative: душой / в душе
  rationale: Выбор не вводит специальной антропологической схемы; здесь слово обозначает внутреннее состояние говорящего, а не строго разграниченную часть человеческого существа.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранено начальное «потому что» и конечное «и», поскольку стих представляет собой фрагмент синтаксически незавершённого контекста.
