  text: Therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: ru
  text: Поэтому я помолюсь Всевышнему, чтобы Он укреплял меня до конца».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  choice: Всевышнему
  rationale: Устойчивое и естественное русское соответствие латинскому титулу Altissimus в библейском контексте.
- source_word: confortet
  choice: укреплял
  rationale: Передаёт значение духовного и внутреннего укрепления; несовершенный вид уместно выражает поддержку, продолжающуюся до конца.
- source_word: usque in finem
  choice: до конца
  rationale: 'Сохраняет краткость и возможную неоднозначность латинского выражения: до завершения испытания, видения или пути.'
theological_decisions:
- issue: Референт выражения usque in finem
  choice: до конца
  alternative: до самого конца / до завершения
  rationale: Более конкретное толкование не внесено, поскольку латинский текст не уточняет, о каком именно конце идёт речь.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Союз «Поэтому» передаёт логическое следствие; не добавлено отдельного временного маркера «теперь», которого нет в источнике.
