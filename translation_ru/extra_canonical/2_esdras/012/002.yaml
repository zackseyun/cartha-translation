  text: aquilam, et uidi Et ecce quod superauerat caput non conparuit. et surrexerunt alae duae quae ad eum transierunt et erectae sunt ut regnarent, et erat regnum eorum exile et tumulti plenum. Et uidi et ecce ipsa non apparesebant, et omne corpus aquilae incendebatur, et expauescebat terra ualde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: ru
  text: Я смотрел[a], и вот, оставшаяся голова не появилась. Тогда поднялись два крыла, перешедшие к ней, и были поставлены царствовать; царство их было недолгим и полным смут. Я смотрел, и вот, они тоже не появились, а всё тело орла горело[b], и земля пришла в великий ужас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежней передаче следующей фразы: «И два крыла, перешедшие к ней, поднялись, чтобы царствовать».'
    reason: previous_rendering
  - marker: b
    text: 'Или: «сжигалось».'
    reason: Смысл пассивной формы допускает акцент на воздействии огня, тогда как несовершенный вид указывает на продолжающийся процесс.
lexical_decisions:
- source_word: non conparuit / non apparesebant
  choice: не появилась / не появились
  rationale: Сохранено буквальное значение глаголов явления, без истолковывающего усиления «исчезла/исчезли».
- source_word: surrexerunt ... erectae sunt
  choice: поднялись ... и были поставлены
  rationale: Переданы оба последовательных действия и различие между активной и пассивной формами.
- source_word: regnum ... exile
  choice: царство ... недолгим
  rationale: В контексте видения exile указывает на ограниченность, краткость их правления; «недолгое» естественно по-русски и соответствует контексту.
- source_word: tumulti plenum
  choice: полным смут
  rationale: Множественное «смут» передаёт насыщенность правления беспорядками и волнениями.
- source_word: incendebatur
  choice: горело
  rationale: Несовершенный вид сохраняет изображённый как продолжающийся процесс, не представляя сгорание завершённым.
- source_word: expauescebat terra ualde
  choice: земля пришла в великий ужас
  rationale: Естественная олицетворяющая формулировка передаёт сильный страх земли.
