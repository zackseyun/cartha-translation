source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et respondi ad eos et dixi: Confide Israel, et noli tristari'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/046.yaml
  text: And I answered them and said[a], “Take courage, Israel, and do not grieve.”
translation:
  language: ru
  text: 'Я ответил им: «Мужайся, Израиль, и не печалься».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Confide
  choice: Мужайся
  rationale: Латинский императив призывает обрести уверенность и мужество; «мужайся» естественно и достойно передаёт это побуждение в обращении к Израилю.
- source_word: Israel
  choice: Израиль
  rationale: Сохранено прямое обращение к народу в форме единственного числа, как в латинском тексте.
- source_word: noli tristari
  choice: не печалься
  rationale: Конструкция noli с инфинитивом выражает запрет или увещание; «не печалься» точно передаёт эмоциональный смысл tristari.
theological_decisions:
- issue: Граница стиха и выражение «дом Иакова»
  choice: Выражение не включено
  alternative: «и не печалься, дом Иакова»
  rationale: В предоставленном латинском тексте стиха 46 слов domus Jacob нет; согласно указанной текстовой традиции, они относятся к началу стиха 47. Их добавление здесь нарушило бы границу исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Формулу et respondi ad eos et dixi передаёт естественное «Я ответил им», без избыточного русского повтора «ответил и сказал».
