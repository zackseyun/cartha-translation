  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your servant.”
translation:
  language: ru
  text: 'И я сказал: «О Владыка, Господи, если я обрёл благоволение в Твоих очах, если я оправдан пред Тобой более многих и если моление моё несомненно взошло пред лицо Твоё, укрепи меня и яви Себя мне, рабу Твоему».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: О Владыка Господь
  rationale: Передаёт двойное обращение с оттенком верховной власти; формула звучит естественно и торжественно в русском библейском регистре.
- source_word: inueni gratiam ante oculos tuos
  choice: обрёл благоволение в Твоих очах
  rationale: Сохраняет образность латинской формулы и остаётся понятным современному читателю.
- source_word: iustificatus sum apud te prae multis
  choice: я оправдан пред Тобой более многих
  rationale: Сохраняет юридико-богословскую многозначность iustificatus и сравнительное prae multis, не подменяя их более узким толкованием.
- source_word: certum ascendit deprecatio mea
  choice: моление моё несомненно взошло
  rationale: «Несомненно» передаёт уверенность certum, а «взошло» сохраняет пространственный образ молитвы, восходящей к Богу.
- source_word: Conforta me
  choice: укрепи меня
  rationale: Прямой и естественный эквивалент просьбы о даровании силы.
- source_word: ostende seruo tuo mihi
  choice: яви Себя мне, рабу Твоему
  rationale: По смыслу неполной/шероховатой латинской конструкции и с учётом контекста передаёт просьбу о самоявлении адресата; «раб» сохраняет зависимое положение говорящего перед Господом.
theological_decisions:
- issue: Значение iustificatus sum
  choice: я оправдан
  alternative: я признан праведным
  rationale: «Оправдан» сохраняет как судебный оттенок, так и богословскую напряжённость формулы, не уточняя способ или основание оправдания.
- issue: Дополнение при ostende
  choice: яви Себя мне
  alternative: покажи мне
  rationale: Латинский текст синтаксически шероховат, однако контекст и консультационный английский слой указывают на просьбу Господу явить Себя; рефлексивная форма создаёт завершенное русское предложение, не вводя отдельного объекта показа.
- issue: Передача seruus
  choice: раб Твой
  alternative: слуга Твой
  rationale: «Раб» точнее сохраняет асимметрию отношений с верховным Господом и соответствует традиционному, но всё ещё понятному русскому библейскому словоупотреблению.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Сохранены формулы «в Твоих очах» и «пред лицо Твоё», поскольку они передают исходную образность без существенного ущерба понятности. Местоимения, относящиеся к Богу, написаны с прописной буквы как издательская норма данного текста.
