lexical_decisions:
- source_word: uocem quae locuta est
  choice: голос, говоривший
  rationale: Передаёт латинскую конструкцию естественно для современного русского языка, сохраняя образ голоса, который говорит.
- source_word: non de
  choice: не из
  rationale: В данном контексте латинское de обозначает источник звучания; русский предлог «из» ясно передаёт это значение без добавления отсутствующего в оригинале глагола движения.
- source_word: in medio corporis (по продолжению, засвидетельствованному консультационным слоем)
  choice: из середины её тела
  rationale: «Середина» сохраняет пространственный образ, а местоимение женского рода соотносится с орлицей из видения.
theological_decisions: []
translation_notes:
