  text: and like a harbor for a ship saved from the storm.
translation:
  language: ru
  text: и словно гавань для корабля, спасённого от бури.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: portus
  choice: гавань
  rationale: Передаёт образ защищённого места, куда приходит судно после опасности; в данном контексте естественнее и точнее, чем более общее «порт».
- source_word: naui saluatae
  choice: для корабля, спасённого
  rationale: Латинский дательный naui передан конструкцией «для корабля», а причастие saluatae сохраняет смысл избавления от гибели.
- source_word: a tempestate
  choice: от бури
  rationale: Предлог a при saluatae указывает на опасность, от которой корабль был спасён; tempestas здесь означает бурю или шторм.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена незавершённая синтаксическая связь с предшествующим контекстом посредством начального «и». Фраза «Aut non sufficiunt» рассматривается как начало следующего стиха и в текст 12:43 не включена.
