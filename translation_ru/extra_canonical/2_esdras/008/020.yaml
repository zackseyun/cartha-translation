  text: 'Et dixit : domine qui inhabitas seculum, cuius oculi elati et superiora in aerem, Cuius thronus inextimabilis et gloria incon-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/020.yaml
  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
translation:
  language: ru
  text: 'И сказал он: «Господи, обитающий в вечности, чьи очи вознесены и чьи горние чертоги[a] — в воздушной выси,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высоты»; вероятно, имеются в виду горние чертоги.'
    reason: Латинское superiora допускает более буквальное «высоты», тогда как контекстуальный образ небесного жилища передан в основном тексте.
lexical_decisions:
- source_word: inhabitas seculum
  choice: обитающий в вечности
  rationale: В данном молитвенном обращении латинское saeculum обозначает непреходящую вечность; причастный оборот естественно передаёт qui inhabitas.
- source_word: oculi elati
  choice: очи вознесены
  rationale: Сохранены возвышенный регистр и формальная образность латинского текста без добавления подразумеваемого объекта взгляда.
- source_word: superiora
  choice: горние чертоги
  rationale: Номинатив среднего рода множественного числа обозначает находящиеся в вышине части небесного жилища; перевод не превращает это слово в объект Божьего взгляда.
- source_word: in aerem
  choice: в воздушной выси
  rationale: Передаёт пространственный образ aer без слишком современного метеорологического оттенка слова «воздух»; необычное латинское направление/положение не делается более точным, чем позволяет текст.
theological_decisions:
- issue: Отношение superiora к oculi
  choice: самостоятельное описание горних чертогов Бога
  alternative: «очи… взирают на высоты»
  rationale: Форма superiora синтаксически параллельна oculi и не является явно выраженным объектом взгляда; такой перевод также согласуется с древним образом небесных горниц, не вводя дополнительного действия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной лексикой («очи», «горние»). Сохранён незавершённый конец предоставленного фрагмента посредством конечной запятой; обрыв следующего слова gloria incon- не воспроизводится, поскольку он относится к продолжающейся далее фразе и не представлен в английском консультационном слое как часть данного стиха.
