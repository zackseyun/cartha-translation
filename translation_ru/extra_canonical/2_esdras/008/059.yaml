source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: ru
  text: Ибо вас примет то, что было предсказано, а их примут уготованные жажда и мучения. Ведь Всевышний не желал, чтобы человек погиб; но те, кто был сотворён, сами осквернили Его имя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: susipient
  choice: примет / примут
  rationale: Сохраняет буквальный образ принимающих человека предсказанного удела, жажды и мучений, не заменяя его более разъяснительным «ожидает».
- source_word: quae praedicta sunt
  choice: то, что было предсказано
  rationale: Передаёт безличное множественное выражение естественной русской конструкцией и сохраняет неопределённость относительно содержания предсказанного.
- source_word: sitis et cruciatus
  choice: жажда и мучения
  rationale: Сохраняет конкретное «жажда» и множественное число cruciatus.
- source_word: quae parata sunt
  choice: уготованные
  rationale: Кратко и в достойном библейском регистре передаёт состояние того, что было приготовлено.
- source_word: uoluit
  choice: не желал
  rationale: Передаёт волю или намерение Всевышнего, не усиливая фразу до богословски более узкого «не предопределял».
- source_word: disperdi
  choice: погиб
  rationale: Естественно передаёт значение уничтожения или гибели человека в данном контексте.
- source_word: coinquinauerunt nomen eius
  choice: осквернили Его имя
  rationale: Точно передаёт религиозно-нравственный смысл coinquinare применительно к имени Бога.
theological_decisions:
- issue: Воля Всевышнего и гибель человека
  choice: Всевышний не желал, чтобы человек погиб
  alternative: Всевышний не предопределил человеку погибнуть
  rationale: Латинское uoluit говорит о воле или желании; перевод не вводит отсутствующее в тексте понятие предопределения и сохраняет напряжение между Божьей волей и ответственностью сотворённых.
- issue: Ответственность сотворённых
  choice: сами сотворённые осквернили Его имя
  alternative: созданные Им сами осквернили Его имя
  rationale: Сохраняет подчёркнутое ipsi и не добавляет местоименного уточнения, которого в исходной фразе нет.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис слегка выровнен для естественного чтения: общее сказуемое второй части выражено во множественном числе после составного подлежащего «жажда и мучения».'
