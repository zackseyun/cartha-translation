revisions:
- from: Ибо вас примет то, что было предсказано, а их примут уготованные жажда и мучения. Ведь Всевышний не желал, чтобы человек погиб; но сами сотворённые осквернили Его имя.
  to: Ибо вас примет то, что было предсказано, а их примут уготованные жажда и мучения. Ведь Всевышний не желал, чтобы человек погиб; но те, кто был сотворён, сами осквернили Его имя.
  rationale: Исправлена только стилистически тяжеловесная конструкция в заключительной части. Смысл, число «мучения», образ «примут», а также акцент на личной ответственности сотворённых сохранены. Английская сноска относится к прежнему, не соответствующему данному стиху варианту и не имеет опоры в русском тексте, поэтому не переносится.
