  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: ru
  text: Ибо для вас открыт рай, посажено дерево жизни, приготовлен грядущий век, уготовано изобилие, возведён город, утверждён покой, благость доведена до совершенства,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vobis enim
  choice: Ибо для вас
  rationale: Передаёт причинно-пояснительное enim и сохраняет обращение к нескольким людям во множественном числе.
- source_word: paradisus
  choice: рай
  rationale: Прямой и общепонятный эквивалент латинского термина.
- source_word: arbor uitae
  choice: дерево жизни
  rationale: Сохраняет устойчивый библейский образ и форму исходного выражения.
- source_word: futurum tempus
  choice: грядущий век
  rationale: В данном эсхатологическом перечне речь идёт не просто о будущем отрезке времени, а о наступающем миропорядке; «грядущий век» естественно передаёт этот смысл.
- source_word: habundantia
  choice: изобилие
  rationale: Передаёт значение полноты и достатка без неоправданного уточнения их характера.
- source_word: ciuitas
  choice: город
  rationale: Прямой эквивалент; контекст не требует добавлять название или богословское определение города.
- source_word: probata est requies
  choice: утверждён покой
  rationale: Probata может означать испытанность, признание или одобрение. «Утверждён» сохраняет положительный итог этого действия и звучит естественнее буквального «испытан покой».
- source_word: perfecta est bonitas
  choice: благость доведена до совершенства
  rationale: Передаёт результативность perfecta est и абстрактное bonitas, не сводя его только к нравственной доброте людей.
theological_decisions:
- issue: Эсхатологический смысл futurum tempus
  choice: грядущий век
  alternative: будущее время
  rationale: Последовательность образов рая, дерева жизни, города и покоя указывает на эсхатологическую реальность; при этом перевод не уточняет её конфессионально.
- issue: Многозначность probata est применительно к покою
  choice: утверждён покой
  alternative: испытан покой / одобрен покой
  rationale: Выбрана формулировка, допускающая смысл подтверждённости и одобрения, но избегающая неестественного для современного русского сочетания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён параллелизм латинского перечня и завершающая запятая, поскольку синтаксическая мысль продолжается в следующем стихе. Слово «gloriam» относится к предшествующему контексту и не включено в текст данного стиха.
