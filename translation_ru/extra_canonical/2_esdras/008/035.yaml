id: 2ES.8.35
reference: 2 Esdras 8:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: ru
  text: Ибо поистине среди рождённых нет никого, кто не поступал бы нечестиво, и среди исповедующих[a] — никого, кто не согрешил бы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, следует читать: «среди существующих». Латинское «исповедующих» может быть искажением сходного по написанию слова; чтение «существующих» поддерживается древними переводами.'
    reason: textual_variant
lexical_decisions:
- source_word: in veritate enim
  choice: Ибо поистине
  rationale: Передаёт причинное enim и усилительное in veritate естественным и торжественным русским оборотом.
- source_word: de genitis
  choice: среди рождённых
  rationale: Сохраняет широкое обозначение всех рождённых людей без добавления отсутствующего в тексте уточнения.
- source_word: impie gessit
  choice: поступал бы нечестиво
  rationale: Передаёт не только отдельный грех, но и нечестивый образ действий; сослагательная форма естественна после отрицательной конструкции «нет никого, кто не…».
- source_word: de confitentibus
  choice: среди исповедующих
  rationale: Формально следует засвидетельствованному латинскому confitentibus, не добавляя подразумеваемого объекта исповедания; вероятная текстовая порча отмечена в сноске.
- source_word: deliquit
  choice: согрешил бы
  rationale: В данном богословском контексте естественно передаёт delinquere как совершение греха.
theological_decisions:
- issue: Объект глагола confitentibus
  choice: 'Оставлен невыраженным: «исповедующих»'
  alternative: «исповедующих Тебя» или «признающих свои грехи»
  rationale: В латинском тексте объект отсутствует; его добавление неоправданно разрешило бы смысловую неоднозначность.
- issue: Возможная порча confitentibus
  choice: В основном тексте сохранено чтение латинского издания, а конъектура вынесена в сноску
  alternative: Принять consistentibus и перевести «среди существующих»
  rationale: Дочерние версии и параллелизм с «рождёнными» весомо поддерживают конъектуру, но представленное латинское чтение — confitentibus; сноска сохраняет и рукописное свидетельство, и текстологическую проблему.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским ритмом. Параллельная конструкция двух частей сохранена; синтаксически необходимое сказуемое во второй части обозначено тире.
