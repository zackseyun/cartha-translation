source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erunt. Neque adtendas impie agentium studia, sed qui tua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
translation:
  language: ru
  text: но на тех, кто истинно служил Тебе. Не обращай внимания[a] на устремления тех, кто поступает нечестиво,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не принимай в расчёт».'
    reason: Латинское adtendas допускает оттенок не только внимания, но и принятия во внимание при оценке.
lexical_decisions:
- source_word: adtendas
  choice: обращай внимания
  rationale: Передаёт значение латинского adtendere — направлять внимание, принимать в расчёт; в отрицательной конструкции современно и естественно звучит «не обращай внимания».
- source_word: impie agentium
  choice: тех, кто поступает нечестиво
  rationale: Сохраняет деятельный смысл agentium и нравственно-религиозную окраску наречия impie, не сужая выражение до обозначения определённой группы людей.
- source_word: studia
  choice: устремления
  rationale: Латинское studia может означать стремления, занятия, старания или замыслы. «Устремления» сохраняет широту значения и естественно сочетается с повелением не обращать на них внимания.
theological_decisions:
- issue: Объект Божьего внимания в первой части стиха
  choice: «на тех, кто истинно служил Тебе»
  alternative: «на тех, кто служил Твоей истине»
  rationale: Выбрано наречное понимание «в истине / истинно», отражённое в консультационном тексте; оно не вводит дополнительного объекта служения и сохраняет контраст с нечестивыми поступками.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Прописное «Тебе» отражает обращение к Богу. Конечная запятая сохранена, поскольку приведённый латинский отрывок обрывается на противопоставлении sed («но»), продолжение которого относится к следующему текстовому сегменту.
