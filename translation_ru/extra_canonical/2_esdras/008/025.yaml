  text: Ne aspicias populi tui delicta, sed qui tibi in ueritate serui-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/025.yaml
  text: Do not look upon the offenses of your people[a], but upon those who have served you in truth.
translation:
  language: ru
  text: Не смотри на проступки Твоего народа, но взгляни на тех, кто служил Тебе в истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aspicias
  choice: смотри / взгляни
  rationale: Латинский конъюнктив в запрете передан повелительной конструкцией «не смотри»; во второй, эллиптической части глагол естественно восстановлен как «взгляни».
- source_word: delicta
  choice: проступки
  rationale: Передаёт нарушения и прегрешения без чрезмерного усиления до «преступлений».
- source_word: in ueritate
  choice: в истине
  rationale: 'Сохраняет формальную и богословскую многозначность выражения: искренне, верно или в соответствии с истиной.'
- source_word: seruierunt
  choice: служил
  rationale: Восстановлено очевидное продолжение перенесённого в издании слова serui-; прошедшее время соответствует латинскому perfectum.
theological_decisions:
- issue: Объект благосклонного внимания Бога во второй части
  choice: «тех, кто служил Тебе в истине»
  alternative: «тех, кто истинно служил Тебе»
  rationale: Сохранена исходная конструкция in ueritate и её богословская открытость, без сведения смысла только к искренности или верности.
translation_notes:
  register: Современный литературный русский язык с молитвенно-достоинным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Разрыв serui- в источнике понят как перенос слова seruierunt, согласно данным о стиховой разметке.
