  text: Я показал это всем, кроме тебя и немногих тебе подобных.[a] И…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Я показал это не всем, а лишь тебе и немногим тебе подобным». Основной текст следует буквальному чтению данного латинского фрагмента: «Я показал всем, кроме тебя и немногих тебе подобных».'
    reason: Нейтрально фиксирует альтернативное чтение из английского контрольного следа, не объявляя сохранённый латинский текст повреждённым без достаточных оснований.
lexical_decisions:
- source_word: omnibus demonstraui
  choice: Я показал это всем
  rationale: Прямо передаёт латинское «я показал всем»; подразумеваемое дополнение естественно выражено местоимением «это».
- source_word: nisi tibi et tibi similibus paucis
  choice: кроме тебя и немногих подобных тебе
  rationale: Сохраняет обычное значение латинского nisi («кроме») и синтаксис данного источника, не исправляя молча его вероятную смысловую трудность.
- source_word: et re-
  choice: И…
  rationale: Источник обрывается после союза и начала следующего слова; многоточие передаёт незавершённое продолжение без догадки о его содержании.
theological_decisions:
- issue: 'Кому было дано откровение: всем, кроме Ездры и немногих ему подобных, или только Ездре и немногим подобным ему'
  choice: 'В основном тексте сохранено буквальное чтение имеющегося латинского фрагмента: «всем, кроме тебя…»'
  alternative: «Я показал это не всем, а лишь тебе и немногим подобным тебе»
  rationale: Предоставленный латинский текст формально поддерживает основной вариант, хотя контекст и иная реконструкция традиции могут указывать на пропуск отрицания или более длинный текст. Неоднозначность отмечена, а не устранена редакторским исправлением.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. Обрыв источника сохранён многоточием. Синтаксическая и смысловая трудность латинского текста не исправлена молча.
