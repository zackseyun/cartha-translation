source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: serui tui et auribus percipe precationem figmenti tui, intende uerba mea. Dum enim uiuo loquar et dum sapio respondeam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: ru
  text: Услышь, Господи, молитву раба Твоего и внемли прошению созданного Тобой; обрати внимание на слова мои. Ибо, пока я жив, буду говорить и, пока обладаю разумом, буду отвечать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: serui tui
  choice: раба Твоего
  rationale: Естественное для библейского регистра обозначение молящегося как слуги Бога; сохраняет смиренный тон латинского текста.
- source_word: auribus percipe
  choice: внемли
  rationale: Передаёт идиоматический смысл «услышь внимательно» без неестественного буквального «прими ушами».
- source_word: precationem
  choice: прошению
  rationale: Отличает второе обозначение мольбы от precatio/«молитвы» в первой части и естественно звучит по-русски.
- source_word: figmenti tui
  choice: создания Твоего
  rationale: Сохраняет образ существа, созданного Богом, и смиренное самонаименование говорящего; буквальное «вылепленного Тобой» здесь было бы тяжеловесным.
- source_word: intende
  choice: обрати внимание
  rationale: Прямо и естественно передаёт призыв внимательно отнестись к словам говорящего.
- source_word: dum sapio
  choice: пока обладаю разумом
  rationale: Сохраняет значение способности понимать и рассуждать, не сводя sapio к конфессионально нагруженной «мудрости».
- source_word: respondeam
  choice: буду отвечать
  rationale: Формально сохраняет значение латинского глагола и возможную связь речи Ездры с ответом Богу.
theological_decisions:
- issue: Образ figmentum как сформированного Богом существа
  choice: создания Твоего
  alternative: того, кого Ты создал / творения Твоего
  rationale: Выбор сохраняет богословский мотив зависимости человека от Творца, не уточняя способ сотворения сверх того, что выражает латинский текст.
- issue: Значение dum sapio
  choice: пока обладаю разумом
  alternative: пока понимаю / пока я в здравом уме
  rationale: Не разрешает чрезмерно узко, идёт ли речь о понимании, сознании или мудрости; передаёт общую способность разумно отвечать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «Услышь», «внемли», «раб Твой» поддерживают библейское достоинство, а остальной синтаксис остаётся понятным современному читателю.
