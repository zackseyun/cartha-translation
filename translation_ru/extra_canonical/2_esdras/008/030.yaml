  text: Не негодуй на тех, кто хуже зверей,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: indigneris
  choice: не негодуй
  rationale: Передаёт запрет с оттенком сильного гнева и возмущения; соответствует возвышенному, но современному русскому регистру.
- source_word: bestiis
  choice: зверей
  rationale: Естественный русский эквивалент латинского ablativus comparationis в выражении «хуже зверей».
- source_word: peius sunt
  choice: хуже
  rationale: Прямо передаёт сравнительную характеристику без добавления отсутствующей в данном исходном тексте идеи «считаются» или «были осуждены».
theological_decisions:
- issue: Характер оценки людей как «хуже зверей»
  choice: 'Сохранена прямая характеристика: «кто хуже зверей»'
  alternative: «кто считается хуже зверей»
  rationale: В предоставленном латинском тексте стоит «peius sunt», а глагол «iudicati» отсутствует; поэтому значение внешней оценки или судебного приговора не добавляется.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. «Не негодуй» точнее и выразительнее нейтрального «не сердись». Начальное «splendide docuerunt» расценено как окончание предшествующего стихового сегмента, что подтверждается английским консультационным слоем и историей последней редакции; в текст 2 Ездры 8:30 оно не включено.
