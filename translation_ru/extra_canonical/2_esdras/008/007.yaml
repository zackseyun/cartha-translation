  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: ru
  text: будет занимать место человека.[a] Ибо Ты один, а мы — единое творение Твоих рук, как Ты и сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних версиях: «примет образ человека». Возможно, латинское locum («место») возникло вследствие раннего смешения близких по написанию греческих слов со значениями «место» и «образ».'
    reason: Сохраняет засвидетельствованное латинское чтение в основном тексте и сообщает о поддерживаемом древними переводами варианте, который может отражать исходный греческий текст.
lexical_decisions:
- source_word: portabit locum hominis
  choice: займёт место человека
  rationale: Передаёт засвидетельствованное латинское чтение буквально по смыслу и естественно по-русски; будущее время portabit сохранено.
- source_word: Solus enim es
  choice: Ведь Ты один
  rationale: Сохраняет краткость и возможную смысловую напряжённость латинского выражения, не добавляя подразумеваемого сказуемого или богословского пояснения.
- source_word: una plasmatio nos sumus manuum tuarum
  choice: все мы — единое творение Твоих рук
  rationale: Plasmatio обозначает созданное, сформированное; «единое творение» сохраняет единственное число una и естественно выражает общность людей как созданных Божьими руками.
- source_word: sicut locutus es
  choice: как Ты и сказал
  rationale: Естественная современная передача латинского оборота со значением ранее произнесённых слов.
theological_decisions:
- issue: Смысл Solus enim es
  choice: Ведь Ты один
  alternative: Ведь только Ты един
  rationale: Основной вариант не превращает неясное краткое утверждение в явно догматическую формулу о единстве Бога и сохраняет неоднозначность источника.
- issue: Общность людей в una plasmatio nos sumus
  choice: все мы — единое творение Твоих рук
  alternative: мы — одно создание Твоих рук
  rationale: «Все мы» естественно раскрывает nos, а «единое творение» сохраняет коллективный смысл без утверждения, будто человечество является одним отдельным существом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-библейской речи. Начальная строчная буква сохранена, поскольку стих начинается продолжением предыдущего предложения.
