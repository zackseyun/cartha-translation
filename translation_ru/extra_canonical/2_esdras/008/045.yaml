lexical_decisions:
- source_word: super nos
  choice: не постигнет нас
  rationale: 'Оборот завершает отрицательную просьбу, начатую в предыдущем стихе: речь о том, чтобы нечто не обрушилось на говорящих. В русском это естественнее передать глагольной конструкцией.'
- source_word: parce
  choice: пощади
  rationale: Точно передаёт просьбу воздержаться от наказания или уничтожения.
- source_word: haereditati tuae
  choice: Твоё наследие
  rationale: Сохраняет библейский образ народа как принадлежащего Богу наследия.
- source_word: creaturae
  choice: творение
  rationale: Передаёт созданное Богом существо или создание без неоправданного сужения значения.
theological_decisions:
- issue: Связь super nos с отрицанием предыдущего стиха
  choice: Пусть это не постигнет нас
  alternative: не на нас
  rationale: Латинское super nos синтаксически завершает начатую ранее отрицательную просьбу; полный русский оборот понятен вне разрыва стихов и не превращает выражение в титул.
- issue: Объём выражения tuae creaturae
  choice: Своё творение
  alternative: Своих созданий
  rationale: Единственное число латинского текста сохранено; формулировка допускает как отнесение к народу, так и более общий смысл, не устраняя возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы; метафора «наследие» сохранена.
