source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: ru
  text: И поскольку Ты, даруя жизнь, ныне оживляешь в утробе сформированное тело и наделяешь его членами, Твоё творение сохраняется в огне и воде, и в течение девяти месяцев Твоё формирование терпит ради Твоего создания, сотворённого в нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «в течение девяти месяцев Твоё формирование терпит для Твоего создания». Латинская конструкция с patitur («терпит, претерпевает») и дательным «Твоему созданию» трудна; референт «в нём» не уточнён.'
    reason: Передаёт грамматическую трудность исходного латинского текста, не навязывая толкование о том, что именно является референтом местоимения или что речь непременно идёт о вынашивании.
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: даруя жизнь, теперь оживляешь
  rationale: Сохранён выразительный повтор латинского корня, но передан естественным русским сочетанием причастного оборота и личного глагола.
- source_word: in matrice
  choice: в утробе
  rationale: В контексте формирования и девятимесячного вынашивания matrix означает материнскую утробу.
- source_word: plasmatum corpus
  choice: уже образованное тело
  rationale: Передаёт пассивное plasmatum и отмеченное nunc состояние тела без добавления прямо не названного деятеля.
- source_word: praestas membra
  choice: наделяешь его членами
  rationale: Praestare здесь означает предоставлять или давать; «члены» сохраняет телесный и возвышенный регистр исходника.
- source_word: in igni et aqua tua creatio
  choice: Твоё творение сохраняется в огне и воде
  rationale: Согласование показывает, что tua относится к creatio, а не к igni et aqua.
- source_word: patitur
  choice: вынашивает
  rationale: В контексте девяти месяцев глагол обозначает перенесение или несение в ходе беременности; «вынашивает» естественно выражает смысл, не устраняя образ напряжения полностью.
- source_word: tua plasmatio
  choice: то, что Ты образовал
  rationale: Буквальное «Твоё образование/формирование» в русском двусмысленно и неестественно; субстантивированный оборот сохраняет результат Божьего формирующего действия.
- source_word: tuae creaturae quae in eo creata est
  choice: Твоё создание, возникшее в нём
  rationale: Сохранена референциальная неопределённость местоимения eo через «в нём»; повтор creatura/creata слегка варьирован ради естественного русского языка.
theological_decisions:
- issue: Отнесение притяжательного tua в выражении in igni et aqua tua creatio
  choice: «Твоё» относится к «творению»
  alternative: «в Твоём огне и воде»
  rationale: Латинское tua стоит в именительном падеже женского рода и согласуется с creatio; с igni и aqua такое согласование невозможно.
- issue: Неясный референт in eo в заключительной части
  choice: Сохранить местоименное «в нём» без поясняющей конкретизации
  alternative: Уточнить как «в теле» или «в утробе»
  rationale: Источник грамматически и смыслово не вполне прозрачен; уточнение устранило бы подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение к Богу оформлено традиционными прописными местоимениями. Синтаксическая плотность исходного длинного предложения сохранена, но тяжёлые латинские номинализации по возможности переданы глагольными оборотами.
