  text: but remember those who have willingly acknowledged your fear. Do not be willing to destroy those who have had the ways of cattle[a], but look upon those who
translation:
  language: ru
  text: Но вспомни тех, кто по своей воле признал страх перед Тобой.[a] Не пожелай погубить тех, кто нравами уподобился скоту, но обрати взор на тех, кто закон Твой…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по своей воле познал страх перед Тобой».'
    reason: Латинское cognouerunt может означать как «познали», так и «признали»; примечание сохраняет эту смысловую возможность.
lexical_decisions:
- source_word: memorare
  choice: вспомни
  rationale: Императив передан прямо и естественно; в контексте молитвы означает благосклонно вспомнить о людях.
- source_word: ex uoluntate
  choice: по своей воле
  rationale: Сохраняет оттенок добровольности и осознанного выбора, выраженный латинским оборотом.
- source_word: tuum timorem cognouerunt
  choice: признал страх перед Тобой
  rationale: «Страх перед Тобой» ясно передаёт объект страха, а «признал» отражает возможное значение cognouerunt как признания Божьей власти, не сводя выражение лишь к интеллектуальному знанию.
- source_word: pecorum mores habuerunt
  choice: нравами уподобился скоту
  rationale: Передаёт буквальный образ скотских нравов, но звучит естественно и достойно по-русски.
- source_word: respicias
  choice: обрати взор
  rationale: Сохраняет образ благосклонного внимания, уместный в молитвенном регистре.
theological_decisions:
- issue: Значение «страха» в tuum timorem
  choice: страх перед Тобой
  alternative: Твой страх
  rationale: Русское «Твой страх» двусмысленно и может означать страх, испытываемый Богом; выбранная форма ясно обозначает благоговейный страх человека перед Богом.
- issue: Степень воли человека в ex uoluntate
  choice: по своей воле
  alternative: добровольно
  rationale: Оборот сохраняет явное указание на собственную волю людей, не усиливая его до утверждения о полной автономии воли.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным тоном. Начальное «Но» и незавершённый конец сохранены, поскольку стих начинается и заканчивается внутри более длинного синтаксического контекста.
