  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: ru
  text: 'Ибо в этом явятся Твоя праведность и Твоя благость, Господи: когда Ты помилуешь тех, у кого нет запаса добрых дел.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntiabitur
  choice: явятся
  rationale: Передаёт публичное обнаружение и провозглашение Божьей праведности и благости естественным русским выражением.
- source_word: iusticia tua et bonitas tua
  choice: Твоя праведность и Твоя благость
  rationale: Сохраняет два отдельных качества и прямую обращённость к Богу.
- source_word: substantiam operum bonorum
  choice: добрых дел
  rationale: В данном контексте substantia обозначает наличие или запас; отрицательная конструкция естественно передаётся как полное отсутствие добрых дел, без привнесения идеи заслуг.
- source_word: misertus fueris
  choice: Ты помилуешь
  rationale: Точно передаёт проявление милости к людям, не уточняя её основание или механизм.
theological_decisions:
- issue: Соотношение Божьей праведности, благости и милости к не имеющим добрых дел
  choice: 'Сохранена причинно-пояснительная связь: Божьи праведность и благость явятся в том, что Он помилует таких людей.'
  alternative: Истолковать праведность как противопоставленную милости либо добавить учение о вменённой праведности.
  rationale: Латинский текст соединяет эти качества и не раскрывает догматического механизма милости; перевод сохраняет это напряжение без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Местоимения при обращении к Богу написаны с прописной буквы. Переведено только содержание стиха 36; последующее «И он ответил мне…» относится к следующему стиху.
