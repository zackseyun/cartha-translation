  source_fidelity: Основной перевод верно передаёт tu autem и основное понимание de similibus tuis как круга «подобных тебе», среди которого следует искать славы. Однако добавленное «это» не выражено в латинском тексте и не требуется русской конструкцией. Сноска предлагает иной смысл («слава подобных тебе»), который не является надёжной передачей данного латинского синтаксиса и к тому же расходится с её собственным объяснением.
