  text: But understand for yourself[a], and seek glory among those like you.
translation:
  language: ru
  text: Но ты сам уразумей и ищи славы среди подобных тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu autem
  choice: Ты же
  rationale: Передаёт противопоставление, выраженное autem, естественным для русского повествования способом.
- source_word: pro te intellege
  choice: уразумей это для себя
  rationale: Сохраняет обращение к самому Ездре и значение личного понимания; добавленное «это» естественно восполняет подразумеваемый объект глагола в русском языке.
- source_word: de similibus tuis inquire gloriam
  choice: ищи славы среди подобных тебе
  rationale: Следует основной синтаксической трактовке латинского текста и согласуется с контекстом противопоставления Ездры и подобных ему прочим обитателям мира; родительный падеж после «ищи» придаёт фразе естественное литературное звучание.
theological_decisions:
- issue: К кому относятся «подобные тебе» и как они связаны со «славой»
  choice: слава ищется среди подобных Ездре
  alternative: «разузнавай о славе подобных тебе»
  rationale: Латинское de допускает оттенок предмета расспросов («о подобных тебе»), но также может обозначать круг, из которого нечто ищут. Основной текст сохраняет принятую в консультационном слое трактовку, а альтернативу отмечает в сноске, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским глаголом «уразумей». Ошибочное прежнее чтение, относившееся к предыдущему стиху, не включено.
