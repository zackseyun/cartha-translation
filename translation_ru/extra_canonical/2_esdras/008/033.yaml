  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: ru
  text: Ведь праведники[a], чьи многочисленные дела хранятся у Тебя, получат награду за собственные дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «А праведники, чьи многочисленные дела хранятся у Тебя, получат награду за собственные дела».'
    reason: Отмечает возможное контекстуальное прочтение enim как перехода с оттенком противопоставления, хотя пояснительно-причинное значение предпочтительнее.
lexical_decisions:
- source_word: Iusti enim
  choice: Ведь праведники
  rationale: «Ведь» передаёт пояснительно-причинное значение латинского enim и сохраняет связь с предыдущим рассуждением.
- source_word: operae multae repositae apud te
  choice: чьи многочисленные дела хранятся у Тебя
  rationale: Формулировка сохраняет образ множества дел, отложенных и находящихся у Бога, но звучит естественно по-русски.
- source_word: ex propriis operibus recipient mercedem
  choice: получат награду за собственные дела
  rationale: «За собственные дела» естественно передаёт основание воздаяния, выраженное ex propriis operibus, без добавочного богословского истолкования.
theological_decisions:
- issue: Связь награды праведников с их делами
  choice: получат награду за собственные дела
  alternative: получат воздаяние по собственным делам
  rationale: Выбранный вариант прямо сохраняет утверждение источника о награде, связанной с делами, не уточняя механизм заслуги или благодати.
- issue: Логическая функция enim
  choice: Ведь
  alternative: А праведники
  rationale: В контексте enim вводит обоснование или пояснение, а не простое противопоставление; «ведь» лучше сохраняет ход аргумента.
translation_notes:
  register: Современный литературный русский язык; обращение к Богу передано почтительным прописным «Тебя». Синтаксис сохраняет достоинство и ясность исходного рассуждения.
