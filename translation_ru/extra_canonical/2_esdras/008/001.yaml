source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Всевышний создал этот век для многих, а будущий — для немногих».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc saeculum
  choice: этот век
  rationale: Передаёт указательное hoc без добавления отсутствующего в источнике слова «нынешний» и сохраняет противопоставление будущему веку.
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшееся и естественное в русском библейском стиле наименование Бога.
- source_word: futurum
  choice: будущий
  rationale: Субстантивированное прилагательное соотносится с ранее названным «веком»; эллипсис естественен по-русски и отражает латинскую конструкцию.
- source_word: propter multos / propter paucos
  choice: для многих / для немногих
  rationale: Сохраняет параллелизм и наиболее естественно передаёт propter в значении предназначения или цели.
theological_decisions:
- issue: Смысл утверждения о многих и немногих
  choice: Сохранить краткое противопоставление без пояснений
  alternative: Уточнить, что речь идёт о числе спасённых или обитателей веков
  rationale: Латинский текст сам не разъясняет точный объём утверждения; добавленное толкование преждевременно сняло бы богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формула dixit не дублируется отдельным «и сказал», поскольку «ответил мне» естественно вводит прямую речь, не теряя содержания.
