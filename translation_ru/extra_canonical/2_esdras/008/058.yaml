  yaml_path: translation/extra_canonical/2_esdras/008/058.yaml
  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: ru
  text: 'они попрали его праведников. И сказали в сердце своём: «Бога нет», хотя точно знают, что умрут. Как'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustos eius
  choice: его праведников
  rationale: Передаёт субстантивированное iustos как людей, признанных праведными, и сохраняет принадлежность, выраженную eius.
- source_word: conculcauerunt
  choice: попирали
  rationale: Сохраняет сильный образ топтания и притеснения; русское «попирать» естественно употребляется и буквально, и в отношении людей и их достоинства.
- source_word: in corde suo
  choice: в своём сердце
  rationale: Сохраняет библейский образ внутреннего решения и речи; единственное число передаёт латинскую распределительную конструкцию.
- source_word: non esse deum
  choice: «Бога нет»
  rationale: Прямая речь естественно и точно выражает содержание латинского оборота с инфинитивом.
- source_word: et quidem scientes sciunt
  choice: хотя точно знают
  rationale: Передаёт уступительный смысл контекста и эмфатическую конструкцию scientes sciunt без неестественного буквального повтора.
- source_word: quoniam moriuntur
  choice: что умрут
  rationale: В контексте речь идёт об осознании собственной будущей смерти; русский будущий вид передаёт это естественнее буквального настоящего времени.
- source_word: Sicut
  choice: Как
  rationale: Сохраняет незавершённый переход к сравнению в следующем стихе или фрагменте.
theological_decisions:
- issue: Отрицание существования Бога нечестивыми
  choice: «Бога нет»
  alternative: «нет Бога»
  rationale: Обе формулировки возможны, но выбранная звучит как естественное внутреннее утверждение и не смягчает прямого отрицания.
- issue: Объект попрания
  choice: «его праведников»
  alternative: «его праведных»
  rationale: «Праведников» ясно обозначает людей и не превращает выражение в отвлечённое качество; богословская категория праведности при этом сохраняется.
translation_notes:
  register: Современный литературный русский с сохранением библейского образа сердца и сильного глагола «попирали». Начальная строчная буква и конечное «Как» оставлены намеренно, поскольку предоставленный латинский текст представляет собой фрагмент, продолжающий предыдущее предложение и обрывающийся на начале сравнения. Местоимение «его» дано со строчной буквы согласно нейтральной современной издательской практике.
