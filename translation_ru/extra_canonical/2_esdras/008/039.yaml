  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: ru
  text: Но я буду радоваться созданию праведных, а также их странствию, их спасению и получению ими награды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plasma iustorum
  choice: созданию праведных
  rationale: Передаёт значение «создание, сотворённое естество» и сохраняет генитивную связь с «праведными», засвидетельствованную более широким латинским контекстом и консультационным слоем.
- source_word: peregrinationis
  choice: их странствию
  rationale: Peregrinatio обозначает странствие или временное пребывание вдали от дома; «странствие» сохраняет образный и богословски открытый характер слова.
- source_word: saluationis
  choice: их спасению
  rationale: Прямой и естественный эквивалент латинского saluatio; притяжательное «их» ясно связывает спасение с праведными.
- source_word: mercedis receptionis
  choice: получению ими награды
  rationale: Естественно передаёт сложную генитивную конструкцию «получение награды» и недвусмысленно указывает, что награду получают праведные.
theological_decisions:
- issue: К кому относятся странствие, спасение и получение награды
  choice: 'К праведным: «их… их… ими»'
  alternative: Оставить существительные без притяжательных указаний как отвлечённые понятия
  rationale: Последовательность латинских генитивов по смыслу продолжает упоминание iustorum; явные местоимения в русском восстанавливают эту связь, не добавляя нового богословского содержания.
- issue: Смысл peregrinatio
  choice: Сохранить общее «странствие»
  alternative: Уточнить как «земное странствие» или «пребывание в чужой земле»
  rationale: Латинское слово допускает несколько близких оттенков; конкретизация «земное» сузила бы подлинную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; архаизмы и конфессионально окрашенные уточнения не используются.
