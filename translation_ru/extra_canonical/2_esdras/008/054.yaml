  source_fidelity: 'Передача в целом верно следует данному латинскому фрагменту: corruptio передано как «тление», dolores — как «страдания», Transierunt — как «миновали», а пассивное ostensus est сохранено без преждевременного введения подразумеваемого дополнения из следующего стиха. Однако in obliuionem обозначает направленность («в забвение»), а не дательный адресат («забвению»).'
  naturalness: «Тление — забвению» неестественно и грамматически не выражает латинское in + accusativus. Замена на «тление — в забвение» сохраняет намеренную фрагментарность межстихового отрывка и делает конструкцию понятной по-русски. «И было явлено» приемлемо как безлично-пассивная передача при отсутствующем в предоставленном фрагменте субъекте.
  terminology: «Тление» уместно для corruptio в эсхатологическом контексте и не сужает смысл до физического распада. «Страдания» сохраняет широкий смысл dolores. Специальных терминологических или конфессиональных уточнений не требуется.
