  text: тление — в забвение. Страдания миновали, и было явлено
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptio
  choice: тление
  rationale: Передаёт состояние порчи и распада; в данном эсхатологическом контексте звучит естественнее и ёмче, чем «порча».
- source_word: in obliuionem
  choice: забвению
  rationale: Конструкция передаёт переход или предназначение к забвению; тире сохраняет фрагментарное продолжение мысли из предыдущего стиха.
- source_word: dolores
  choice: страдания
  rationale: Латинское слово может означать боли, скорби или страдания; нейтральное «страдания» сохраняет широту смысла.
- source_word: Transierunt
  choice: миновали
  rationale: Естественно передаёт завершившееся прохождение и прекращение страданий.
- source_word: ostensus est
  choice: было явлено
  rationale: Сохраняет пассивную форму и грамматическую незавершённость отрывка, где подразумеваемый субъект следует далее.
theological_decisions:
- issue: Незавершённая пассивная конструкция ostensus est
  choice: и было явлено
  alternative: и он был явлен
  rationale: В представленном фрагменте субъект не назван; безличная формулировка не вводит преждевременно род или референт и сохраняет связь со следующим стихом.
- issue: Связь начальной фразы с предыдущим стихом
  choice: тление — забвению
  alternative: тление уйдёт в забвение
  rationale: Источник начинается фрагментом «corruptio in obliuionem» без явного глагола. Эллиптическая передача сохраняет форму текста и не добавляет отсутствующий в данном отрывке глагол.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским звучанием. Эллипсис и незавершённость исходного фрагмента сохранены; дополнительных сносок не требуется.
