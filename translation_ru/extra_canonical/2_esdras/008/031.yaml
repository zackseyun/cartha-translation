  text: judged, but love those who have always trusted in your glory. For we and our fathers have lived in mortal ways, but you, however,
translation:
  language: ru
  text: …судимы, но Ты люби тех, кто всегда уповал на Твою славу. Ибо мы и отцы наши жили по обычаям смертных, Ты же…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  choice: осуждены
  rationale: Причастие передано краткой страдательной формой; начальная синтаксическая зависимость сохраняется, поскольку источник представляет продолжение предыдущей фразы.
- source_word: diligas
  choice: возлюби
  rationale: Сослагательное наклонение в данном молитвенном контексте естественно передаётся русским повелительным пожеланием; «возлюби» сохраняет возвышенный, но понятный библейский регистр.
- source_word: qui semper in tua gloria confiderunt
  choice: тех, кто всегда уповал на Твою славу
  rationale: Confidere in означает доверять, полагаться, уповать; «уповал на» естественно для молитвенной речи и сохраняет направленность доверия на Божью славу.
- source_word: mortalibus moribus egimus
  choice: жили по обычаям смертных
  rationale: Буквально сохраняется связь moribus с образом и обычаями жизни; mortalibus понято как характеристика человеческой смертности, без добавления отсутствующего в тексте слова «греховным».
- source_word: tu autem
  choice: Ты же…
  rationale: Передан противительный переход, а многоточие обозначает обрыв предоставленного латинского отрывка без домысливания продолжения.
theological_decisions:
- issue: Смысл выражения mortalibus moribus
  choice: по обычаям смертных
  alternative: смертными путями / как смертные люди
  rationale: Выбран вариант, не отождествляющий смертность с греховностью и не вносящий в текст богословское уточнение, которого нет в латинском источнике.
- issue: Объект упования в in tua gloria
  choice: на Твою славу
  alternative: на Тебя в Твоей славе
  rationale: Сохранена грамматически выраженная направленность на «славу», несмотря на возможную стилистическую необычность, чтобы не разрешать возможное смысловое напряжение пересказом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной лексикой. Заглавные местоимения обращения к Богу использованы последовательно. Фрагментарность начала и конца сохранена в соответствии с предоставленным источником; в конце поставлено многоточие.
