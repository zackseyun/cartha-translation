review_pass:
  verdict: revise
  source_fidelity: «Осуждены» сужает значение латинского iudicati до приговора/осуждения, тогда как исходное слово означает «судимы, подвергаемы суду». В остальном сохранены фрагментарные границы источника, противительное tu autem и отсутствие богословских добавлений.
  naturalness: «Ты люби» в молитвенном контексте естественнее и современнее, чем «возлюби», при этом передаёт побудительно-пожелательный оттенок diligas. Начальное многоточие необходимо, поскольку предоставленный текст начинается посреди синтаксической конструкции; оно также устраняет ненормативное начало предложения со строчной буквы.
  terminology: «Уповать на Твою славу» допустимо как близкое воспроизведение in tua gloria confiderunt. «По обычаям смертных» точно передаёт mortalibus moribus без неоправданного отождествления смертности с греховностью.
  issues:
  - severity: medium
    issue: «осуждены» для iudicati
    rationale: Русское «осуждены» обычно подразумевает обвинительный приговор, которого латинское iudicati само по себе не требует. «Судимы» сохраняет более широкий и точный смысл.
  - severity: low
    issue: Не обозначен начальный обрыв фразы
    rationale: Латинский фрагмент начинается со строчного iudicati и зависит от предшествующего, не приведённого контекста. Начальное многоточие явно отмечает эту неполноту.
  - severity: low
    issue: «возлюби» излишне архаично и видовое значение усилено
    rationale: Настоящее сослагательное diligas в данном контексте лучше передать формой «люби», которая сохраняет молитвенное пожелание без добавочного акцента на однократном действии.
  revised_text: …судимы, но Ты люби тех, кто всегда уповал на Твою славу. Ибо мы и отцы наши жили по обычаям смертных, Ты же…
