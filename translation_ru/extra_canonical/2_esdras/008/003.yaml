lexical_decisions:
- source_word: actus praesentis saeculi
  choice: ход нынешнего века
  rationale: Латинское actus здесь стоит в единственном числе и в контексте аналогии обозначает ход или устройство нынешнего века, а не непременно нравственные поступки людей.
- source_word: Multi quidem creati sunt
  choice: созданы были многие
  rationale: Сохраняет пассивную форму perfectum и подчёркнутое противопоставление multi quidem ... pauci autem.
- source_word: pauci autem saluabuntur
  choice: но спасутся немногие
  rationale: Естественно передаёт будущую пассивную форму и контраст между многими созданными и немногими спасаемыми.
theological_decisions:
- issue: Соотношение сотворённых и спасённых
  choice: созданы были многие, но спасутся немногие
  alternative: многие были созданы, но лишь немногие будут спасены
  rationale: Выбранная формулировка не уточняет причины или условия спасения и сохраняет краткое, напряжённое противопоставление исходного текста.
