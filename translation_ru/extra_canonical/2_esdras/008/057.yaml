lexical_decisions:
- source_word: contempserunt
  choice: презрели
  rationale: 'Прямо передаёт значение латинского глагола: отнеслись с презрением, отвергли как недостойное.'
- source_word: uias eius
  choice: Его пути
  rationale: Сохраняет библейскую метафору образа жизни и Божьих установлений; прописная буква указывает на Бога согласно русской библейской издательской традиции.
- source_word: dereliquerunt
  choice: оставили
  rationale: Естественный и точный эквивалент в сочетании с «пути», не усиливающий исходный смысл до «полностью отреклись».
- source_word: Adhuc autem et
  choice: Кроме того, они также
  rationale: Передаёт незавершённую связку adhuc autem et и сохраняет синтаксический переход к следующему текстовому отрезку.
theological_decisions:
- issue: Референт eius
  choice: Его
  alternative: его
  rationale: В ближайшем контексте местоимение относится к Богу; прописная буква соответствует принятой русской библейской практике, не добавляя нового содержания.
translation_notes:
  register: 'Современный литературный русский язык с традиционной библейской метафорой «пути». Фрагментарное окончание источника намеренно сохранено: фраза обрывается и продолжается в следующей единице.'
