  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: ru
  text: вопрошая о множестве тех, кто погибает. Ибо и они, получив свободу, презрели Всевышнего и Его закон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inquirendo
  choice: расспрашивать
  rationale: Передаёт значение целенаправленного вопрошания или выяснения; форма сохраняет синтаксическую незавершённость фрагмента, связанного с предыдущим контекстом.
- source_word: multitudine eorum qui pereunt
  choice: о множестве тех, кто погибает
  rationale: Буквально и естественно передаёт собирательное multitudo и настоящее время pereunt, не уточняя без основания характер погибели.
- source_word: libertatem
  choice: свободу
  rationale: Прямое соответствие латинскому слову; не подменяется более богословски нагруженным выражением «свобода воли».
- source_word: spreuerunt
  choice: презрели
  rationale: Передаёт сильное значение сознательного пренебрежения и отвержения.
- source_word: altissimum
  choice: Всевышнего
  rationale: Устоявшееся русское библейское именование Бога для латинского Altissimus.
theological_decisions:
- issue: Смысл libertatem
  choice: свободу
  alternative: свободу воли
  rationale: Исходный текст говорит о свободе, но прямо не добавляет «воли»; перевод не должен вводить более узкое доктринальное толкование.
- issue: Временной оттенок pereunt
  choice: кто погибает
  alternative: кто погибнет / погибшие
  rationale: Сохранено настоящее время латинского текста и присущая ему смысловая открытость.
translation_notes:
  register: 'Современный литературный русский с библейски dignified, но понятной лексикой. Начальная синтаксическая незавершённость сохранена, поскольку латинский стих открывается формой, продолжающей предшествующую мысль. Ошибочное прежнее чтение о скорбях и сокровище бессмертия не включено: оно относится к иному фрагменту текста.'
