id: 2ES.8.38
reference: 2 Esdras 8:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super plasma eorum qui peccauerunt aut mortem aut iudicium aut perditionem ; Sed iocundabor super iustorum figmentum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: ru
  text: Ибо поистине Я не буду помышлять ни о создании согрешивших[a], ни об их смерти, ни об их суде, ни об их погибели, но буду радоваться созданию праведных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни о создании согрешивших, ни о смерти, ни о суде, ни о погибели».'
    reason: Латинская синтаксическая связь допускает формальное чтение, при котором eorum прямо относится только к plasma, хотя контекст и параллелизм поддерживают отнесение местоимения ко всему ряду.
lexical_decisions:
- source_word: plasma / figmentum
  choice: создание
  rationale: Оба латинских слова обозначают сотворённое или сформированное существо; единый перевод сохраняет смысловой параллелизм между согрешившими и праведными.
- source_word: qui peccauerunt
  choice: согрешивших
  rationale: Естественно и точно передаёт субстантивированное придаточное «тех, которые согрешили».
- source_word: iocundabor super
  choice: буду радоваться
  rationale: Передаёт значение радости по поводу праведных без неестественной русской кальки с предлогом «над».
- source_word: iudicium
  choice: суд
  rationale: Сохраняет юридико-эсхатологическое значение латинского существительного.
- source_word: perditionem
  choice: погибель
  rationale: Передаёт окончательную гибель и сохраняет отличие от физической смерти (mortem).
theological_decisions:
- issue: Отнесение смерти, суда и погибели
  choice: «об их смерти, ... их суде, ... их погибели»
  alternative: «о смерти, о суде, о погибели» вообще
  rationale: Родительное eorum естественно распространяется на параллельные mortem, iudicium и perditionem; так ограничивается область высказывания участью согрешивших, а не смертью и судом вообще.
- issue: Значение plasma и figmentum применительно к людям
  choice: «создание»
  alternative: «образование», «творение» или «созданные»
  rationale: «Создание» сохраняет образ Божьего формования человека и неоднозначность между процессом/результатом, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавная «Я» указывает на говорящего Бога. Повтор «ни» сохраняет риторическую последовательность оригинала; «помышлять» передаёт think upon торжественно, но остаётся понятным.
