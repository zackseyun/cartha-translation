review_pass:
  verdict: revise
  source_fidelity: 'Нужно сохранить область действия латинского ut: oremus и des — формы сослагательного наклонения 1-го лица множественного и 2-го лица единственного соответственно. Вариант «позволишь рабу Твоему, чтобы мы молились» передаёт число, но синтаксически тяжёл. Исправленный вариант яснее удерживает намеренный переход от единственного числа servo tuo к множественному oremus. Финальный обрыв после qui сохранён.'
  naturalness: «Если Ты позволишь Твоему рабу, чтобы мы молились… и чтобы Ты дал…» — литературно приемлемая, хотя намеренно необычная конструкция, отражающая необычное число оригинала. «Благодаря которому» естественно и точно выражает второе unde как средство жизни; условная форма «мог бы» согласует фразу с молитвенным пожеланием.
  terminology: '«Тленный» удачно передаёт corruptus в значении смертного, подверженного тлению, не сводя слово к нравственной испорченности. Земледельческие образы semen, cultura и fructus сохранены: «семя», «возделывание», «плод».'
