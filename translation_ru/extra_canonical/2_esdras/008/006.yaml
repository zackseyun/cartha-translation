  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: ru
  text: О Господи, властвующий над нами! Если Ты позволишь Твоему рабу, чтобы мы молились перед Тобой[a] и чтобы Ты дал нам семя для сердца и возделывание для разума, из которых мог бы появиться плод, благодаря которому мог бы жить всякий тленный[b], который…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте «рабу Твоему» стоит в единственном числе, а далее «чтобы мы молились» — во множественном.
    reason: Сохраняет необычный грамматический переход оригинала, который можно ошибочно счесть переводческой неточностью.
  - marker: b
    text: 'Или: «всякий, подверженный тлению».'
    reason: Уточняет, что латинское corruptus здесь обозначает смертное, подверженное распаду существо, а не обязательно нравственно испорченного человека.
lexical_decisions:
- source_word: domine super nos
  choice: Господи, властвующий над нами
  rationale: Передаёт пространственно-властное значение super nos («над нами»), избегая неестественного для современного русского обращения «Господи над нами».
- source_word: semen cordis
  choice: семя для сердца
  rationale: Сохраняет земледельческий образ и дательный оттенок латинского cordis в рамках исходной конструкции.
- source_word: sensui culturam
  choice: возделывание для разума
  rationale: Cultura здесь продолжает земледельческую метафору; «возделывание» точнее сохраняет её, чем отвлечённые «образование» или «развитие».
- source_word: unde fructum fiat
  choice: из чего произрастёт плод
  rationale: Естественно по-русски передаёт появление плода из данных Богом семени и возделывания, сохраняя образ исходника.
- source_word: omnis corruptus
  choice: всякий тленный
  rationale: В контексте речь идёт прежде всего о подверженности распаду и смерти, а не обязательно о нравственной испорченности.
- source_word: qui
  choice: который…
  rationale: Союзное местоимение присутствует в предоставленном латинском тексте и оставляет фразу незавершённой; многоточие честно отмечает обрыв данного фрагмента.
theological_decisions:
- issue: Переход от единственного числа servo tuo к первому лицу множественного числа oremus
  choice: «рабу Твоему, чтобы мы молились»
  alternative: «рабу Твоему молиться»
  rationale: Сохраняется реальный и, вероятно, значимый переход от одного раба к молящемуся сообществу; сглаживание инфинитивом скрыло бы форму oremus.
- issue: Смысл corruptus
  choice: «тленный»
  alternative: «испорченный»
  rationale: «Тленный» удерживает эсхатологическую тему смертности и бренности и не навязывает исключительно нравственного толкования.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным тоном. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской традиции. Земледельческая цепочка «семя — возделывание — плод» сохранена. Финальное многоточие отражает незавершённость предоставленного латинского фрагмента.
