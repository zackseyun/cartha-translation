source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tudinem signorum quae incipies facere in nouissimis, sed non demonstrasti mihi quo tempore.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/063.yaml
  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: ru
  text: Ты показал мне множество знамений, которые начнёшь совершать в последние времена[a], но не показал мне, когда именно».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые совершишь в последние времена». В переводной латыни оборот с «начнёшь» может обозначать просто будущее действие.'
    reason: Сохраняет неоднозначность incipies facere между буквальным началом действия и перифрастическим будущим.
lexical_decisions:
- source_word: multitudinem signorum
  choice: множество знамений
  rationale: Естественно передаёт латинское сочетание без искусственного внесения определённости, которой латинский язык сам по себе не выражает артиклем.
- source_word: incipies facere
  choice: начнёшь совершать
  rationale: Сохраняет прямое значение латинского incipies с инфинитивом facere; при этом в примечании отмечена возможная функция оборота как обозначения будущего действия.
- source_word: in nouissimis
  choice: в последние времена
  rationale: Передаёт эсхатологический смысл субстантивированного множественного nouissimis; слово «времена» естественно восполняется по-русски.
- source_word: quo tempore
  choice: когда именно
  rationale: Идиоматично выражает вопрос о конкретном времени, не утяжеляя фразу буквальным «в какое время».
theological_decisions:
- issue: Начало совершения знамений или просто будущее действие
  choice: начнёшь совершать
  alternative: совершишь
  rationale: Основной текст следует явному inceptive значению incipies и не снимает возможный акцент на начале знамений; вариант без этого акцента отмечен в сноске с учётом характера переводной латыни и свидетельства древних версий.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Обращение на «ты» соответствует прямой речи, обращённой к Богу. Финальная кавычка сохранена как указание на завершение реплики в контексте.
