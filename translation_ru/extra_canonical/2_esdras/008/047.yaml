  terminology: «Творение», «неправедные», «Всевышний» и «смирил себя» уместны для умеренно возвышенного библейского регистра. Прописное написание местоимений Бога допустимо в принятой редакционной традиции. Сноска с маркером [a] поставлена непосредственно после спорного выражения и содержательно соответствует источнику.
