source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: ru
  text: Можешь ли ты любить Моё творение больше, чем Я? Но ты часто ставил себя рядом с неправедными[a]. Никогда так не поступай. И всё же даже в этом ты будешь достоин восхищения перед Всевышним, потому что смирил себя, как и подобает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причислял себя к неправедным».'
    reason: Латинское temetipsum proximasti iniustis буквально говорит о помещении себя рядом с неправедными, но может подразумевать причисление себя к ним.
lexical_decisions:
- source_word: pos­sis diligere meam creaturam super me
  choice: Можешь ли ты любить Моё творение больше, чем Я?
  rationale: Сохранён прямой вопрос и сравнительный смысл super me; формулировка не допускает ошибочного понимания «любить творение больше, чем любить Бога».
- source_word: temetipsum proximasti iniustis
  choice: ты часто ставил себя рядом с неправедными
  rationale: Возвратное proximasti буквально выражает приближение или помещение себя рядом; в контексте возможно также причисление себя к неправедным, что отмечено в сноске.
- source_word: numquam
  choice: Никогда так не поступай
  rationale: Краткий запрет передан отдельным предложением вслед за английским консультационным слоем; «так» отсылает к предшествующему самопоставлению рядом с неправедными.
- source_word: mirabilis eris coram altissimo
  choice: ты будешь дивен перед Всевышним
  rationale: «Дивен» передаёт mirabilis как положительную оценку и сохраняет возвышенный, но понятный библейский регистр; coram передано без замены на более толковательное «в глазах».
- source_word: humiliasti te, sicut decet
  choice: смирил себя, как и подобает
  rationale: Сохранены возвратность действия, причинная связь и нормативный оттенок sicut decet.
theological_decisions:
- issue: Отношение Ездры к неправедным
  choice: ставил себя рядом с неправедными
  alternative: причислял себя к неправедным
  rationale: Латинское proximasti прежде всего обозначает приближение, но контекст допускает самоотождествление или причисление; основной текст остаётся ближе к лексическому образу, а альтернативный смысл вынесен в сноску.
- issue: Похвала за смирение при одновременном запрете
  choice: сохранено напряжение между «Никогда так не поступай» и «даже в этом ты будешь дивен»
  alternative: объяснить, что запрещено самопричисление, а похвально лишь смирение
  rationale: Источник сам связывает похвалу с уничижением себя, не устраняя полностью напряжения; перевод не добавляет толкования сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским тоном. Местоимения, относящиеся к Богу, написаны с прописной буквы. Слово «дивен» выбрано ради краткости и достоинства регистра; остальной синтаксис остаётся современным и прозрачным.
