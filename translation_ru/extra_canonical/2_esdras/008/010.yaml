lexical_decisions:
- source_word: in ea creata fuerint
  choice: то, что было создано в ней
  rationale: Сохраняет пассивное значение creata и местоименную отсылку женского рода in ea; фрагментарность фразы обусловлена границей стиха.
- source_word: Imperasti ut
  choice: Ты повелел произвести
  rationale: Imperasti передано прямым обращением к Богу; добавление инфинитива «произвести» естественно оформляет по-русски конструкцию с ut и источником ex, не уточняя сверх текста, что именно производится.
- source_word: ex ipsis membris
  choice: из самих этих членов
  rationale: «Из» передаёт источник, membris — телесные «члены», а ipsis получает усилительное соответствие «самих этих».
- source_word: hoc est
  choice: то есть
  rationale: Прямое и естественное соответствие латинской пояснительной формуле; многоточие показывает, что пояснение продолжается в следующем стихе.
