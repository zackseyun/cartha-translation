source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: ru
  text: 'грозный, чей вид иссушает бездны, чей гнев заставляет горы таять и чья истина свидетельствует: услышь, Господи, молитву'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: грозный
  rationale: Передаёт внушающий трепет и страх характер обращения, сохраняя возвышенный молитвенный регистр.
- source_word: aspectus
  choice: вид
  rationale: Естественно передаёт здесь явление или облик Бога; слово «взгляд» неоправданно сужало бы значение.
- source_word: arefacit abyssos
  choice: иссушает бездны
  rationale: Формально и образно воспроизводит латинские глагол и существительное во множественном числе.
- source_word: indignatio
  choice: негодование
  rationale: Сохраняет смысл сильного праведного гнева без добавления конфессионального толкования.
- source_word: tabescere facit montes
  choice: заставляет горы таять
  rationale: Передаёт каузативную конструкцию и образ утраты горами твёрдости.
- source_word: ueritas testificatur
  choice: истина свидетельствует
  rationale: Сохраняет необычную и допускающую разные понимания персонификацию истины, не уточняя предмет свидетельства.
- source_word: Exaudi
  choice: Услышь
  rationale: Традиционная и понятная современному читателю форма молитвенной просьбы о благосклонном внимании.
theological_decisions:
- issue: Синтаксическая связь слов «истина свидетельствует»
  choice: Сохранить самостоятельное утверждение без добавленного дополнения
  alternative: «чья истина свидетельствует о Тебе» или иное смысловое уточнение
  rationale: В латинском тексте объект свидетельства не назван; добавление разрешило бы подлинную неоднозначность.
- issue: Пунктуация перед молитвенной просьбой
  choice: Завершить цепь обращений восклицательным знаком и затем дать «Услышь, Господи, молитву»
  alternative: Двоеточие, буквально следующее из издания
  rationale: Русская пунктуация яснее отмечает переход от описательного обращения к прошению, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным регистром. Фрагментарность стиха сохранена, поскольку начало и продолжение обращения находятся в соседних стихах.
