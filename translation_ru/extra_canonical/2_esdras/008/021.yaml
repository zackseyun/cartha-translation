translation:
  language: ru
  text: непостижимый[a], пред Которым воинство ангелов стоит в трепете, сохранение которых[b] обращается в ветер и огонь, чьё слово
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сегмент начинается с окончания латинского слова; полная форма inconprehensibilis означает «непостижимый».
    reason: Поясняет усечение слова на границе сегмента.
  - marker: b
    text: Латинское seruatio обычно означает «сохранение», «соблюдение» или «охранение». Оборот «сохранение которых обращается в ветер и огонь» необычен; его точный смысл неясен.
    reason: Сохраняет лексическую и смысловую трудность seruatio, не подменяя её толковательным «служением».
lexical_decisions:
- source_word: prehensibilis
  choice: непостижимый
  rationale: 'Фрагмент начинается внутри латинского слова inconprehensibilis («непостижимый»): начальная часть относится к предыдущему сегменту стиха. Поэтому перевод передаёт восстановленное слово, а не изолированное prehensibilis («постижимый»).'
- source_word: exercitus angelorum
  choice: сонм ангелов
  rationale: Exercitus буквально означает «войско», но в возвышенной молитвенной речи «сонм ангелов» естественно передаёт множество небесных сил, стоящих перед Богом.
- source_word: cum tremore
  choice: в трепете
  rationale: Передаёт одновременно страх, благоговение и дрожь, не сужая значение до одного эмоционального оттенка.
- source_word: seruatio
  choice: служение
  rationale: В данном ангелологическом контексте слово обозначает исполняемое ангелами установление или служение; буквальное «сохранение» по-русски здесь не даёт связного смысла. Необычность латинского выражения отмечена в сноске.
- source_word: conuertitur
  choice: обращается
  rationale: Сохраняет пассивную форму и образ превращения в ветер и огонь, не уточняя явно действующее лицо.
theological_decisions:
- issue: Связь ангелов с ветром и огнём
  choice: чьё служение обращается в ветер и огонь
  alternative: которых Ты обращаешь в ветер и огонь
  rationale: Выбранный вариант сохраняет грамматическую неоднозначность латинского текста и не вводит отсутствующее в нём прямое обращение «Ты».
- issue: Божественная непостижимость
  choice: непостижимый
  alternative: постижимый
  rationale: Начальное prehensibilis является сохранившимся окончанием inconprehensibilis на границе сегмента; переводить его как самостоятельное утвердительное «постижимый» означало бы принять техническое усечение за смысл исходного текста.
translation_notes:
  register: Возвышенный, но понятный современный русский язык молитвенного регистра. Сохранены синтаксическая незавершённость фрагмента и цепочка относительных оборотов. Местоимение «Которым» написано с прописной буквы как относящееся к Богу.
