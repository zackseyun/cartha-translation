  source_fidelity: 'Перевод «непостижимый» оправдан: приведённое prehensibilis является окончанием слова inconprehensibilis, начатого в предшествующем сегменте. «Сонм ангелов ... в трепете» в целом передаёт exercitus angelorum cum tremore. Однако seruatio не следует без оговорок переводить как «служение»: это иной латинский лексический корень и такой выбор устраняет необычность и неясность чтения. Quorum относится к ангелам во множественном числе, что лучше отразить явно.'
