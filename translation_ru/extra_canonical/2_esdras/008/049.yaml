translation:
  language: ru
  text: тебе[a] и не причислил себя к праведным, чтобы тем более прославиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стих начинается словом «тебе», которое грамматически завершает предыдущее выражение: «как подобает тебе».'
    reason: Сохранить необычную границу стиха в предоставленном латинском источнике и пояснить, почему русский текст начинается незавершённым фрагментом.
lexical_decisions:
- source_word: iudicasti te inter iustos
  choice: не причислил себя к праведным
  rationale: Передаёт смысл «не счёл/не поставил себя в число праведных» естественным современным русским языком, не усиливая его до заявления о фактической неправедности.
- source_word: ut plurimum glorificeris
  choice: чтобы тем более прославиться
  rationale: Сохраняет целевую конструкцию ut с пассивным glorificeris и сравнительно-усилительный оттенок plurimum в данном контексте.
theological_decisions:
- issue: Кого следует считать праведным и на каком основании
  choice: Сохранена субъективная формулировка «не причислил себя к праведным»
  alternative: «признал себя неправедным»
  rationale: Латинский текст говорит о том, что адресат не поставил себя среди праведных, а не утверждает прямо, что он неправеден.
- issue: Значение пассивного glorificeris
  choice: «прославиться» без указания действующего лица
  alternative: «чтобы Бог тем более прославил тебя»
  rationale: Латинский пассив не называет того, кто прославляет; добавление Бога устранило бы подлинную недосказанность.
translation_notes:
  register: Современный литературный русский язык; синтаксическая незавершённость начала сохранена из-за стихового членения источника. Формулировка dignified и понятна без конфессионально окрашенных уточнений.
