  text: propter quod conturbor. Ideo incipiam orare coram te pro me et pro eis, quoniam uideo lapsos nostros qui inhabitamus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: ru
  text: Из-за этого я в смятении. Поэтому я начну молиться пред Тобой за себя и за них, ибо вижу, как пали мы[a], живущие на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши падения»; возможно также: «наши проступки».'
    reason: Передаёт отмеченную в аудиторской версии альтернативу для латинского lapsos, сохраняя основной перевод, который понимает выражение как падшее состояние людей.
lexical_decisions:
- source_word: propter quod conturbor
  choice: Из-за этого я в смятении
  rationale: Передаёт причинную связь и внутреннюю тревогу говорящего естественным современным русским языком.
- source_word: coram te
  choice: пред Тобой
  rationale: Сохраняет образ молитвы в присутствии Бога и соответствует возвышенному, но понятному регистру.
- source_word: lapsos nostros qui inhabitamus
  choice: как пали мы, живущие на земле
  rationale: Латинское чтение синтаксически шероховато; перевод передаёт существенный смысл падшего состояния самих обитателей земли, не ослабляя его до отдельных «проступков».
theological_decisions:
- issue: Смысл lapsos как падения или отдельных прегрешений
  choice: как пали мы
  alternative: наши падения / наши проступки
  rationale: Контекст и сила lapsos указывают скорее на состояние падения или гибельное падение людей, чем на перечень незначительных проступков; формулировка сохраняет апокалиптическую тяжесть текста.
- issue: К кому относится «за них»
  choice: Сохранено местоимение без уточнения
  alternative: за жителей земли / за народ
  rationale: Латинское pro eis не называет референта прямо, поэтому перевод не устраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Пред Тобой» выбрано вместо более разговорного «перед Тобой» ради молитвенного регистра; синтаксис заключительной части сделан естественным без ослабления богословской тяжести «падения».
