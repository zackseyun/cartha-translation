  verdict: revise
  source_fidelity: Первая относительная конструкция относится к ангельскому множеству (Quorum), тогда как последующие — к единственному субъекту (Cuius). В русском чередование «чьё ... чьё» стирает это различие и может отнести служение к Богу. Замена на «служение которых» сохраняет смену референта. «Превращается» ясно передаёт conuertitur. Остальные определения в целом передают firmum, dicta perseuerantia, dispositio fortis и iussio.
  naturalness: «Речения пребывают» понятно, но для современного литературного русского несколько искусственно. «Изречения непреходящи» сохраняет торжественный регистр и естественнее передаёт устойчивость/perseuerantia. «Устроение крепко» звучит литературно и передаёт силу установленного порядка.
  terminology: «Служение», «слово», «изречения», «устроение» и «повеление» уместны в молитвенно-торжественном контексте. «Грозно» адекватно передаёт fearful, не конкретизируя характер страха.
