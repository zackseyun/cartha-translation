  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: ru
  text: служение которых превращается в ветер и огонь[a], чьё слово твёрдо и чьи изречения непреходящи, чьё устроение крепко и чьё повеление грозно[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В латинской традиции это место текстуально трудно: встречается seruatio («сохранение»), однако в данном ангельском контексте выражение обычно понимают как «служение». Перевод передаёт контекстуальный смысл и сохраняет значение обращения или превращения.'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «служение которых — в ветре и огне».'
    reason: previous_rendering
lexical_decisions:
- source_word: seruatio / conuertitur (текстуально трудное место, отражённое в консультационном слое)
  choice: служение обращается
  rationale: В ангельском контексте передаёт служение небесных сил и сохраняет значение изменения или обращения, отмеченное новейшей сверкой, не сводя выражение к статичному «пребывает».
- source_word: firmum
  choice: непреложно
  rationale: В сочетании со «словом» естественно передаёт твёрдость и надёжность, не превращая её в отвлечённую истинность.
- source_word: dicta perseuerantia
  choice: речения пребывают
  rationale: Сохраняет параллелизм и длительный, устойчивый характер сказанного; «речения» соответствует возвышенному, но понятному регистру молитвенного обращения.
- source_word: dispositio fortis
  choice: устроение прочно
  rationale: Dispositio обозначает установленный порядок или устроение; такой выбор не сужает смысл до одного лишь «замысла».
- source_word: iussio
  choice: повеление
  rationale: Передаёт властное распоряжение без излишне административного оттенка.
theological_decisions:
- issue: Отнесение первой части к ангельскому служению, а последующих определений — к Богу
  choice: Сохранено посредством форм единственного числа «чьё» при каждом последующем определении
  alternative: Понять все определения как относящиеся к одному субъекту
  rationale: Это соответствует смене латинского относительного местоимения с множественного Quorum в предшествующей части на единственное Cuius и сохраняет космологическую аллюзию на ветер и огонь.
- issue: Образ превращения служения в ветер и огонь
  choice: «обращается в ветер и огонь»
  alternative: «совершается в ветре и огне»
  rationale: Выбранный вариант сохраняет значение латинского conuertitur, засвидетельствованное в ревизионных данных, и не делает образ статичным.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным ритмом. Параллельные конструкции сохранены; «речения» и «устроение» поддерживают достоинство стиля, оставаясь понятными из контекста. Конечная запятая сохранена, поскольку данный стих представляет часть продолжающегося синтаксического периода.
