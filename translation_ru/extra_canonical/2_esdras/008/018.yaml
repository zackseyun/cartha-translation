  text: But I have heard the swiftness of the judgment that is to come.
translation:
  language: ru
  text: Но я слышал о стремительности грядущего суда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sed
  choice: Но
  rationale: Передаёт противительный переход от предыдущей мысли; начальное латинское terram. относится к предшествующему стиху.
- source_word: audiui
  choice: я слышал о
  rationale: В современном русском сочетание «слышал о» естественно вводит полученное известие; прямое «слышал стремительность» было бы неестественным.
- source_word: celeritatem
  choice: стремительности
  rationale: Сохраняет значение быстроты и неотвратительно скорого совершения, не заменяя его толкованием.
- source_word: iudicii quod futurum est
  choice: грядущего суда
  rationale: Кратко и естественно передаёт определительное придаточное «суда, который будет», сохраняя эсхатологическую перспективу без уточнения её характера.
theological_decisions:
- issue: Характер и время суда
  choice: грядущего суда
  alternative: суда, который предстоит
  rationale: Латинский текст утверждает лишь будущность суда; перевод не уточняет ни его вид, ни точные сроки.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный. Формулировка ясна широкому читателю и сохраняет лаконизм латинского текста.
