  source_fidelity: 'Русский текст точно передаёт предоставленный латинский фрагмент. «В конце» соответствует in finem в его фрагментарном контексте, «сокровище бессмертия» — thesaurus inmortalitatis, а «Поэтому больше не прибавляй…» правильно отражает Noli ergo adhuc adicere. Многоточие оправдано: дополнение при adicere в предоставленном тексте отсутствует.'
  naturalness: Формулировка современна и литературна. Тире после «в конце» уместно передаёт эллиптический, оборванный с обеих сторон характер исходного отрывка; строчная буква в начале также обоснована тем, что латинский текст начинается посреди синтаксической единицы.
  terminology: «Сокровище бессмертия» сохраняет образ и родительную связь оригинала без богословской интерпретации. Запретительная конструкция «больше не прибавляй» естественна для современного русского и не добавляет отсутствующего объекта.
