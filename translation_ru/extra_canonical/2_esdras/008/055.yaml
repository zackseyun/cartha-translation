lexical_decisions:
- source_word: in finem
  choice: в конце
  rationale: Передаёт конечную точку или итог; латинский фрагмент начинается внутри более широкого синтаксического целого, поэтому начальная строчная буква сохранена.
- source_word: thesaurus inmortalitatis
  choice: сокровище бессмертия
  rationale: Прямо сохраняет образ сокровища и родительную связь с бессмертием.
- source_word: Noli ergo adhuc adicere
  choice: Поэтому больше не прибавляй
  rationale: Noli с инфинитивом выражает запрет; adhuc в данном контексте естественно передаётся как «больше не», а adicere оставлено без дополнения, поскольку исходный фрагмент на нём обрывается.
