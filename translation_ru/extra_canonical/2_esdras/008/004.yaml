  text: 'Et respondi et dixi: absorbe ergo anima sensum et deuoret quod sapit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/004.yaml
  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: ru
  text: 'И я ответил и сказал: «Итак, поглоти, душа, разумение, и пусть она поглотит то, что мудро»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально во второй части: «и пусть она поглотит то, что мудро»: в латинском тексте после обращения «душа» происходит переход к форме третьего лица. Sapit также может отсылать к вкусу: «то, что имеет вкус».'
    reason: Сохраняет необычную смену от императива второго лица к форме третьего лица и отмечает смысловую игру sapit с образами поглощения.
lexical_decisions:
- source_word: absorbe
  choice: впитай
  rationale: Императив второго лица означает буквально «поглоти, проглоти». «Впитай» сохраняет образ усвоения и естественно сочетается с «разумением», не превращая метафору в отвлечённое «прими».
- source_word: anima
  choice: душа
  rationale: 'Форма стоит при императиве второго лица и наиболее естественно понимается как обращение: «душа».'
- source_word: sensum
  choice: разумение
  rationale: Передаёт умственное восприятие и понимание, не сужая значение до отдельной мысли или ощущения.
- source_word: deuoret
  choice: поглоти
  rationale: Сохраняет сильную пищевую метафору латинского глагола. В русском согласовано с прямым обращением, тогда как латинский неожиданно переходит от императива ко форме третьего лица.
- source_word: quod sapit
  choice: то, что мудро
  rationale: Сохраняет придаточную конструкцию и смысл мудрости, не заменяя её отвлечённым существительным. Возможный оттенок вкуса отмечен в сноске.
theological_decisions:
- issue: Кто должен обрести разумение
  choice: Прямое обращение к душе
  alternative: «Пусть душа впитает разумение»
  rationale: Императив absorbe во втором лице поддерживает звательное понимание anima; перевод не устраняет эту грамматическую особенность.
- issue: Переход от второго лица к третьему в deuoret
  choice: 'В основном тексте выровнено как продолжение обращения: «поглоти»'
  alternative: 'Буквально: «и пусть она поглотит»'
  rationale: Русская буквальная смена лица была бы неясной и тяжеловесной; особенность исходного текста сохранена в сноске без придания ей богословского значения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Повтор «ответил и сказал» сохранён как формальная черта источника; метафора принятия мудрости как поглощения пищи удержана.
