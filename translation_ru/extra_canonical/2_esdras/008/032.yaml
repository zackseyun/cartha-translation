  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: ru
  text: Ибо если Ты пожелаешь помиловать нас, тогда Тебя назовут милосердным, потому что мы — грешники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desideraueris
  choice: пожелаешь
  rationale: Передаёт условное значение латинской формы и смысл сознательного желания проявить милость.
- source_word: miserearis
  choice: помиловать
  rationale: Естественный и точный русский эквивалент со значением проявления милости к согрешившим.
- source_word: misericors uocaberis
  choice: Тебя назовут милосердным
  rationale: Сохраняет пассивную конструкцию и будущую направленность латинского текста.
- source_word: peccatores
  choice: грешники
  rationale: Прямо передаёт нравственно-религиозное значение латинского существительного.
theological_decisions:
- issue: Связь Божьего наименования «милосердный» с милостью к грешникам
  choice: 'Сохранена условная и риторическая формулировка: «если… тогда Тебя назовут»'
  alternative: Передать как безусловное утверждение, что Бог милосерден по Своей природе
  rationale: Латинский текст строит довод именно как условие и следствие; перевод не должен сглаживать это богословское напряжение.
- issue: Расположение фразы propter nos peccatores
  choice: 'Передано в конце как причинное пояснение: «потому что мы — грешники»'
  alternative: «Из-за нас, грешников, Ты назван милосердным» в начале стиха
  rationale: Так сохраняется всё содержание предоставленного латинского свидетельства и получается связное русское предложение в соответствии с проверенным делением и смысловой реконструкцией английского консультационного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Местоимение «Ты» написано с прописной буквы как обращение к Богу; синтаксис прост и понятен широкому читателю.
