  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: ru
  text: Итак, услышь мой голос и пойми мои слова, и я буду говорить пред Тобой. Начало слов молитвы Ездры, прежде чем он был взят.[a][b]
  philosophy: optimal-equivalence
  footnotes:
