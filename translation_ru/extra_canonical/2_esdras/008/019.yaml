    reason: compositional_layer
lexical_decisions:
- source_word: Ideo
  choice: Итак
  rationale: Передаёт вывод или переход к просьбе естественным современным русским словом, не усиливая причинное значение.
- source_word: audi meam uocem
  choice: услышь мой голос
  rationale: Сохраняет прямой образ латинского текста и форму обращения к Богу.
- source_word: intellege sermonum meorum
  choice: пойми мои слова
  rationale: Латинская форма sermonum, вероятно, вторична или текстуально неровна, но смысл прозрачен; по-русски требуется естественное управление с винительным падежом.
- source_word: loquar coram te
  choice: я буду говорить пред Тобой
  rationale: Сохраняет буквальный пространственно-судебный оттенок coram и возвышенный, но понятный регистр.
- source_word: Initium uerborum orationis Ezrae
  choice: Начало слов молитвы Ездры
  rationale: Сохраняет бессказуемную форму рубрики и не добавляет отсутствующее в источнике «это» или «вот».
- source_word: priusquam adsumeretur
  choice: перед тем, как он был взят
  rationale: 'Сохраняет пассив и неоднозначность: латинский текст не уточняет явно, кем, куда и каким образом был взят Ездра.'
theological_decisions:
- issue: Значение пассива adsumeretur
  choice: он был взят
  alternative: он был вознесён
  rationale: «Взят» сохраняет неопределённость латинского глагола и не утверждает прямо конкретный способ небесного вознесения.
- issue: Статус заключительной фразы
  choice: Передать как отдельную бессказуемную рубрику
  alternative: Это начало слов молитвы Ездры…
  rationale: Латинский свидетель содержит номинальную фразу без глагола; её рубричный или редакционный характер следует сохранить, не сглаживая синтаксис.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной интонацией. Написание «Тобой» с прописной буквы обозначает почтительное обращение к Богу, не меняя смысла источника. Бессказуемность заключительной рубрики намеренно сохранена.
