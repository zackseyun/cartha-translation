source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: ru
  text: Ибо что такое человек, что Ты негодуешь на него, или род, подверженный тлению, что Ты питаешь к нему такую горечь?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: indigneris
  choice: негодуешь
  rationale: Передаёт сильное возмущение и гнев, сохраняя риторический и возвышенный тон латинского текста.
- source_word: genus corruptibile
  choice: смертный род
  rationale: В данном антропологическом контексте corruptibile обозначает подверженность тлению и смерти; «смертный род» естественно звучит по-русски и не сводит смысл к нравственной испорченности.
- source_word: amariceris
  choice: ожесточаешься
  rationale: Передаёт состояние внутренней горечи и сурового отношения, выраженное латинским глаголом, без неестественной русской кальки «огорчаешься против».
theological_decisions:
- issue: Значение corruptibile применительно к человеческому роду
  choice: смертный род
  alternative: тленный род / испорченный род
  rationale: Выбор сохраняет акцент на бренности и подверженности смерти, не внося однозначного утверждения о нравственной испорченности всего рода.
- issue: Характер Божьего отношения в amariceris
  choice: Ты так ожесточаешься против него
  alternative: Ты так озлобляешься на него / Ты питаешь к нему такую горечь
  rationale: Формулировка сохраняет напряжённый язык молитвенного вопроса и не смягчает приписываемое Богу суровое отношение, но избегает слишком разговорного или психологизирующего выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-риторической речи. Сохранены параллельная структура двух вопросов и прямое обращение к Богу; местоимение «Ты» написано с прописной буквы согласно принятому благоговейному регистру.
