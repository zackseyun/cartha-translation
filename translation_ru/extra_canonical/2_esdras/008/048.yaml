  yaml_path: translation/extra_canonical/2_esdras/008/048.yaml
  text: But in this also you will be marvelous before the Most High,[a]
translation:
  language: ru
  text: Но и в этом ты будешь дивен пред Всевышним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но и в этом ты будешь удивителен пред Всевышним».'
    reason: Сохраняет возможную более прямую передачу mirabilis как того, кто вызывает удивление.
lexical_decisions:
- source_word: mirabilis
  choice: дивен
  rationale: Латинское mirabilis означает «дивный, чудесный, вызывающий изумление». «Дивен» сохраняет возвышенную апокалиптическую окраску и не сводит смысл к простой похвале или нравственному одобрению.
- source_word: coram Altissimo
  choice: пред Всевышним
  rationale: «Пред Всевышним» естественно и торжественно передаёт пространственно-оценочное coram («перед, в присутствии») и традиционный божественный титул Altissimus.
