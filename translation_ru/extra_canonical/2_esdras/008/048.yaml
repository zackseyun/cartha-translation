  verdict: approve
  source_fidelity: «Но и в этом ты будешь дивен пред Всевышним» точно передаёт sed et in hoc mirabilis eris coram Altissimo. «Дивен» сохраняет значение mirabilis («чудесный, дивный, вызывающий изумление») без ослабления до простой похвалы; «пред Всевышним» верно передаёт coram Altissimo.
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому с уместно возвышенным библейским оттенком. Предикатив «дивен» и предлог «пред» несколько возвышенны, но не неестественны в данном регистре.
  terminology: «Всевышний» — устойчивый и точный русский библейский титул для Altissimus. Выбор «дивен» удачно передаёт апокалиптическую окраску mirabilis и не навязывает богословского толкования.
