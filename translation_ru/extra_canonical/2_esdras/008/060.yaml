translation:
  language: ru
  text: Который сотворил их, а они были неблагодарны Тому, Кто приготовил для них жизнь. Поэтому ныне приближается Мой суд, которого Я не…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui fecit eos
  choice: Который сотворил их
  rationale: Сохраняет относительную конструкцию и связь с предшествующим контекстом; «сотворил» уместно в речи о Боге-Творце.
- source_word: ingrati fuerunt ei
  choice: они оказались неблагодарны Тому
  rationale: Передаёт состоявшуюся неблагодарность; прописная буква обозначает божественного референта без добавления имени.
- source_word: praeparauit eis uitam
  choice: приготовил для них жизнь
  rationale: Близко передаёт латинские praeparavit, eis и vitam, не уточняя неоднозначное содержание «жизни».
- source_word: iudicium meum modo adpropinquat
  choice: суд Мой теперь приближается
  rationale: «Суд» сохраняет юридико-эсхатологический смысл iudicium, а «теперь приближается» естественно передаёт modo adpropinquat.
- source_word: Quod non
  choice: тот, которого Я ещё не…
  rationale: Фрагмент обрывается внутри предложения; относительное местоимение соотнесено с «судом», non передано как начало незавершённого отрицания, а «ещё» делает русскую оборванную фразу естественной в данном контексте.
theological_decisions:
- issue: Смысл слова iudicium
  choice: суд
  alternative: приговор
  rationale: Латинское слово допускает оттенки суда и судебного решения; «суд» сохраняет более широкую неоднозначность и не утверждает, что речь только о приговоре.
- issue: Незавершённость конца стиха
  choice: сохранить обрыв фразы
  alternative: дополнить фразу по следующему стиху
  rationale: Предоставленный источник заканчивается словами Quod non; добавление отсутствующего продолжения вышло бы за пределы исходного свидетельства.
translation_notes:
  register: Современный литературный русский с торжественным библейским регистром. Синтаксическая незавершённость начала и конца сохранена, поскольку данный стих является фрагментом более длинного предложения; многоточие явно отмечает обрыв предоставленного текста.
