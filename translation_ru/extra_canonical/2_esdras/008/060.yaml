revisions:
- from: Который сотворил их, а они оказались неблагодарны Тому, Кто приготовил для них жизнь. Поэтому суд Мой теперь приближается — тот, которого Я ещё не…
  to: Который сотворил их, а они были неблагодарны Тому, Кто приготовил для них жизнь. Поэтому ныне приближается Мой суд, которого Я не…
  rationale: Исправлен неоправданный добавочный оттенок «ещё» и выбран более прямой эквивалент латинского fuerunt. Обрыв фразы сохранён, поскольку предоставленное латинское свидетельство заканчивается на Quod non. Английские примечания относятся к прежнему, неверно выровненному тексту 8:58–59a и не имеют якоря в данном латинском фрагменте, поэтому русских примечаний не требуется.
