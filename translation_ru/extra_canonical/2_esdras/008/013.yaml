  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: ru
  text: И Ты умертвишь его как Своё творение и оживишь его как [Своё творение].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся латинский текст обрывается после слова «как» во второй части фразы. Слова в квадратных скобках восстановлены по параллельному построению с первой частью.
    reason: Явно обозначает границу сохранённого текста и вероятный характер восстановления.
lexical_decisions:
- source_word: mortificabis
  choice: умертвишь
  rationale: Передаёт каузативное значение латинского глагола — «сделаешь мёртвым, лишишь жизни» — и сохраняет параллель с «оживишь».
- source_word: uiuificabis
  choice: оживишь
  rationale: Прямо передаёт значение «дашь жизнь, сделаешь живым» и сохраняет антитезу с mortificabis.
- source_word: creaturam
  choice: творение
  rationale: Естественное и богословски нейтральное обозначение сотворённого существа; повторено во второй части ради параллелизма, подразумеваемого оборванным латинским текстом.
- source_word: ut
  choice: как
  rationale: В сочетании ut tuam creaturam выражает отношение к человеку как к Божьему творению.
theological_decisions:
- issue: Отношение Бога к человеку в смерти и возвращении к жизни
  choice: Одинаковое выражение «как Своё творение» сохранено в обеих частях
  alternative: Во второй части употребить «как Своё дело» либо опустить повтор
  rationale: Повтор сохраняет симметрию высказывания и не вводит отсутствующего в источнике различия между «творением» и «делом».
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксический параллелизм латинского текста сохранён.
