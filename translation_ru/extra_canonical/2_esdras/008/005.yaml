id: 2ES.8.5
reference: 2 Esdras 8:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: ru
  text: Ибо ты согласилась повиноваться и поневоле отправилась в путь[a], ведь тебе дано прожить лишь совсем недолгое время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ушла».'
    reason: The Latin profecta es can denote either setting out on a journey or departing; the main text preserves the metaphor, while the note gives the more departure-oriented sense.
lexical_decisions:
- source_word: conuenisti
  choice: ты согласилась
  rationale: Perfect of convenire here denotes coming to agreement or consenting; the feminine form follows the addressee implied by the Latin participles.
- source_word: obaudire
  choice: повиноваться
  rationale: The verb expresses obedient hearing, not merely listening; «повиноваться» conveys the volitional response naturally in Russian.
- source_word: profecta es
  choice: отправилась в путь
  rationale: The perfect of proficiscor ordinarily means setting out or departing, rather than advancing; the phrasing retains the journey metaphor without specifying whether life or death is meant.
- source_word: nolens
  choice: поневоле
  rationale: The present participle means being unwilling; «поневоле» succinctly conveys that the setting out occurred against the addressee’s will.
- source_word: spatium nisi solum modicum uiuere
  choice: дано прожить лишь совсем недолгое время
  rationale: Natural Russian rendering of the limited span granted for living, preserving the emphatic restriction conveyed by nisi solum modicum.
theological_decisions:
- issue: Referent and direction of profecta es
  choice: Retain the general image of setting out on a journey
  alternative: Specify entry into life or departure into death
  rationale: The Latin itself does not explicitly identify the journey’s direction or endpoint; specifying either would resolve genuine contextual ambiguity.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; обращение передано в женском роде в соответствии с латинскими формами conuenisti/profecta es и контекстом обращения.
