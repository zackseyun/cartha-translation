  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/042.yaml
  text: For if the farmer’s seed does not come up[a], for it did not receive,
translation:
  language: ru
  text: Ибо если семя земледельца не взойдёт — ведь оно не получило…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В более полном варианте: «Ибо если семя земледельца не взойдёт, потому что вовремя не получило Твоего дождя, или если оно погибнет от слишком обильного дождя…»'
    reason: Предоставленный латинский текст обрывается после «не получило»; примечание сохраняет засвидетельствованный в прежнем переводе более полный вариант, не вводя его в основной текст.
lexical_decisions:
- source_word: Quoniam
  choice: Ибо
  rationale: Сохраняет причинно-аргументативную связь с предшествующей речью.
- source_word: semen agricolae
  choice: семя земледельца
  rationale: Прямо передаёт родительное сочетание и сохраняет сельскохозяйственный образ.
- source_word: si non ascenderit
  choice: если … не взойдёт
  rationale: Для семени латинское ascendere естественно передаётся русским «взойти».
- source_word: non enim accepit
  choice: ведь оно не получило
  rationale: Сохраняет enim и намеренно не восполняет отсутствующее в дошедшем латинском тексте дополнение.
theological_decisions:
- issue: Предполагаемое дополнение о Божьем дожде
  choice: Не включать в основной текст слова о дожде, отсутствующие в предоставленном латинском источнике
  alternative: «потому что вовремя не получило Твоего дождя, или если погибнет от слишком обильного дождя»
  rationale: Дополнение делает образ понятнее, но выходит за пределы данного латинского текста; его следует отметить лишь как вариант более полного чтения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Многоточие обозначает реальную незавершённость предоставленного латинского текста, а не устраняет её догадочным дополнением.
