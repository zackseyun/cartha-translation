  text: which causes me pain[a], and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am sorrowful, and concerning the seed of Jacob,
translation:
  language: ru
  text: что причиняет мне боль, и о наследии Твоём, о котором я скорблю, и об Израиле, о котором я печалюсь, и о потомстве Иакова,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod mihi dolet
  choice: что причиняет мне боль
  rationale: Сохраняет относительную связь с предшествующим стихом и передаёт безличную латинскую конструкцию естественным современным русским языком.
- source_word: hereditate tua
  choice: наследии Твоём
  rationale: Прямо передаёт hereditas в обращении к Богу; прописная буква у местоимения поддерживает достоинство религиозного регистра.
- source_word: propter quam lugeo
  choice: о котором я скорблю
  rationale: Передаёт luctus как глубокую скорбь и сохраняет отнесённость оборота к наследию.
- source_word: propter quem tristis sum
  choice: о котором я печалюсь
  rationale: Сохраняет отличие tristis sum от более сильного lugeo и естественно согласуется с Израилем.
- source_word: semine Iacob
  choice: потомстве Иакова
  rationale: В данном генеалогическом контексте современное «потомство» понятнее буквального «семя», не устраняя коллективного смысла.
theological_decisions:
- issue: Референт начального quod
  choice: Сохранить относительное «что», указывающее назад, за пределы стиха.
  alternative: 'Сделать фразу самостоятельной: «это причиняет мне боль».'
  rationale: Латинское quod грамматически связывает начало стиха с предшествующим упоминанием; перевод не должен скрывать межстиховую связь.
- issue: Граница стиха после «потомства Иакова»
  choice: Закончить запятой, не добавляя причины смятения из следующего стиха.
  alternative: Добавить «из-за которого я смущён/тревожусь».
  rationale: propter quod conturbor относится к следующему исходному отрезку и не входит в предоставленный текст 8:16.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксический параллелизм латинского оригинала сохранён; финальная запятая показывает продолжение предложения в следующем стихе.
