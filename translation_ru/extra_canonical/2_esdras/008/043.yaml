translation:
  language: ru
  text: Твой дождь в своё время; если же от обилия дождя оно испортится, то погибнет. Но человек, созданный Твоими руками и называемый Твоим образом…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam tuam in tempore
  choice: Твой дождь в своё время
  rationale: Сохранены притяжательное местоимение и временное выражение оригинала; формулировка естественна для современного русского языка.
- source_word: corruptum fuerit multitudine pluuiae
  choice: будет погублено обилием дождя
  rationale: Средний род латинского причастия передан местоимением «оно», поскольку определяемый предмет находится в предшествующем контексте; «обилие дождя» близко передаёт multitudine pluuiae без конкретизации причины гибели.
- source_word: plasmatus est
  choice: созданный
  rationale: Передаёт образ намеренного формирования руками Бога; «вылепленный» было бы нагляднее, но в данном контексте звучало бы чрезмерно буквально.
- source_word: imago
  choice: образ
  rationale: Традиционное и одновременно понятное русское соответствие в выражении о человеке как Божьем образе.
theological_decisions:
- issue: Человек назван Божьим образом
  choice: названный Твоим образом
  alternative: называемый Твоим образом
  rationale: Причастие «названный» естественно передаёт заявленный английским консультационным текстом смысл и не уточняет, кем именно дано это наименование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Многоточие в конце показывает, что предоставленный латинский фрагмент обрывается на союзе et и синтаксически продолжается далее; заключительные слова о Божьем образе сохранены по аудированному консультационному слою.
