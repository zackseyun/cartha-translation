lexical_decisions:
- source_word: spondi et dixi
  choice: И я ответил
  rationale: 'Начальное re-, по-видимому, утрачено на границе фрагмента: ожидается respondi et dixi. В современном русском сочетание «ответил и сказал» избыточно, поэтому передано естественным «ответил».'
- source_word: Ecce nunc
  choice: Вот
  rationale: Передаёт указательно-эмфатическую функцию выражения; отдельное «теперь» здесь звучало бы тяжеловесно и могло бы ошибочно восприниматься как строго временное уточнение.
- source_word: domine
  choice: Господи
  rationale: Естественная русская звательная форма обращения к Господу.
- source_word: demonstrasti mihi
  choice: Ты показал мне
  rationale: Прямо передаёт перфект demonstrasti и дательный mihi.
- source_word: multi-
  choice: многие
  rationale: Источник обрывает слово на границе стиха; «многие» сохраняет незавершённость фразы и позволяет продолжить её следующим стихом без домысливания отсутствующего существительного.
