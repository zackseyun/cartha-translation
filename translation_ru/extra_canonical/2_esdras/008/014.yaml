  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuum opus. Si ergo perdideris, qui tantis laboribus plasmatus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/014.yaml
  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: ru
  text: Твоё творение. Итак, если Ты погубишь того, кто был создан столь великими трудами[a], то для чего он был сотворён?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых латинских свидетельствах фраза читается расширенно: «если Ты лёгким повелением погубишь того, кто по Твоему повелению был создан столь великими трудами».'
    reason: Предоставленный очищенный латинский текст не содержит слов о лёгком повелении и Божьем повелении при создании, однако прежняя редакция и данные о варианте чтения свидетельствуют о расширенной форме.
lexical_decisions:
- source_word: tuum opus
  choice: Твоё творение
  rationale: Сохраняет фрагментарную связь с предыдущим контекстом и передаёт opus как результат Божьего созидательного труда.
- source_word: perdideris
  choice: погубишь
  rationale: Передаёт значение уничтожения или приведения к гибели, не сужая его до физического разрушения.
- source_word: plasmatus
  choice: был создан
  rationale: Естественно передаёт образ формирования, заложенный в латинском глаголе; в следующей части использовано «сотворён» ради ясного риторического вопроса.
- source_word: tantis laboribus
  choice: столь великими трудами
  rationale: Передаёт и интенсивность tantis, и множественное число laboribus.
theological_decisions:
- issue: Кто совершает «великие труды» при создании человека
  choice: Не называть деятеля прямо
  alternative: «кого Ты создал столь великими трудами»
  rationale: Латинская пассивная конструкция plasmatus не выражает деятеля явно; перевод сохраняет эту форму и не добавляет отсутствующее в данном источнике «по Твоему повелению».
- issue: Смысл perdideris
  choice: «погубишь»
  alternative: «уничтожишь»
  rationale: «Погубишь» сохраняет богословскую напряжённость между сотворением и гибелью и допускает более широкий смысл, тогда как «уничтожишь» сильнее предполагает прекращение существования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимение «Ты» при обращении к Богу написано с прописной буквы. Начальное «Твоё творение» намеренно сохраняет синтаксическую фрагментарность предоставленного отрывка.
