review_pass:
  verdict: revise
  source_fidelity: 'Латинское a uobis в обеих пассивных конструкциях нормально обозначает действующее лицо: «вами», а не отделение «от вас». Перевод «от вас» и поясняющая его сноска противоречат прямому грамматическому значению и английскому аудиторскому следу. Extincta следует передать как «угашена/уничтожена», а не более свободным «удалена».'
  naturalness: «Прежде была доведена до совершенства мудрость» сохраняет зависимое, начатое в предыдущем стихе построение и приемлемо для возвышенного литературного регистра. «Преисподняя бежала» естественно передаёт олицетворённое infernus.
  terminology: «Преисподняя» уместно передаёт infernus без избыточного догматического уточнения. «Корень» следует оставить без добавленного пояснения. Восстановленное издателем [mors] должно быть отмечено сноской.
  issues:
  - severity: high
    issue: a uobis передано как «от вас»
    rationale: В латинском пассиве a/ab с аблативом обозначает агента. Здесь необходимо «вами» в выражениях signata est a uobis и extincta est a uobis; контекст не оправдывает замену на отделительное значение.
  - severity: medium
    issue: extincta передано как «удалена»
    rationale: Extinguere означает «гасить, угашать, уничтожать». «Угашена» точнее и сохраняет образность оригинала.
  - severity: medium
    issue: Сноска a утверждает необоснованную исходную неоднозначность
    rationale: Она предлагает буквальное, грамматически нормальное значение «вами» как лишь альтернативу и отдаёт предпочтение не поддерживаемому текстом «от вас». Сноску следует удалить вместе с неверным якорем.
  revised_text: Прежде была доведена до совершенства мудрость. Корень запечатан вами, немощь угашена вами, и смерть[a] сокрыта; преисподняя бежала, и…
  revised_footnotes:
