  text: wisdom has been perfected beforehand. The root has been sealed by you[a], weakness has been extinguished by you, and death has been hidden; Hades has fled, and
translation:
  language: ru
  text: Прежде была доведена до совершенства мудрость. Корень запечатан вами, немощь угашена вами, и смерть[a] сокрыта; преисподняя бежала, и…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «смерть» восстановлено издателем в повреждённом месте латинского текста.
    reason: textual_restoration
lexical_decisions:
- source_word: ante perfecta sapientia
  choice: заранее доведена до совершенства мудрость
  rationale: Сохраняет значение ante («заранее, прежде») и завершённость perfecta, при этом по-русски звучит естественнее буквального «заранее усовершена».
- source_word: Radix
  choice: Корень
  rationale: В источнике не уточнено, корень чего имеется в виду; добавление «зла» неоправданно устранило бы недосказанность.
- source_word: signata est a uobis
  choice: запечатан от вас
  rationale: 'В контексте обещанных праведным избавлений a vobis естественно понимать как удаление или ограждение: корень запечатан от них. Латинская форма допускает также формальное прочтение «вами», отмеченное в сноске.'
- source_word: infirmitas extincta est a uobis
  choice: немощь удалена от вас
  rationale: Передаёт контекстуальный смысл избавления от слабости/немощи. Буквальное «угашена вами» грамматически возможно, но плохо согласуется с рядом обетований.
- source_word: infernus fugit
  choice: преисподняя бежала
  rationale: «Преисподняя» передаёт infernus как царство мёртвых без излишнего отождествления с местом вечного наказания; «бежала» сохраняет олицетворение fugit.
theological_decisions:
- issue: Значение a uobis в двух пассивных конструкциях
  choice: от вас
  alternative: вами
  rationale: 'Хотя a/ab с аблативом при пассиве часто обозначает действующее лицо, здесь последовательность избавлений («немощь удалена», «смерть сокрыта», «преисподняя бежала») поддерживает отделительное значение: эти бедствия устранены от адресатов. Неоднозначность первой конструкции сохранена в сноске.'
- issue: Неуточнённый «корень»
  choice: не добавлять определение
  alternative: корень зла
  rationale: Латинский текст содержит только radix; богословское уточнение «зла» является толкованием, а не переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Сохранены начальная зависимость от предыдущего стиха и незавершённое конечное «и…», поскольку предоставленный латинский фрагмент начинается продолжением перечня и обрывается на et.
