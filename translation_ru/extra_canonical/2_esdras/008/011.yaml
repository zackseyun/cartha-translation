  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: ru
  text: из грудей подаётся молоко — плод грудей, чтобы созданное питалось до некоторого времени; а после Ты направляешь его Своей милостью. Ты взрастил его Своей праведностью, наставил в Своём законе и вразумил Своим разумением,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeberi lac, fructum mamillarum
  choice: даваться молоку, плоду грудей
  rationale: Сохранена зависимая инфинитивная конструкция, продолжающая предшествующий контекст, а также пояснительное соответствие «молоко — плод грудей».
- source_word: quod plasmatum est
  choice: созданное
  rationale: Нейтрально передаёт результат божественного формирования, не уточняя пол и не вводя отсутствующего в этой части латинского текста существительного.
- source_word: dispones eum
  choice: Ты направляешь его
  rationale: Disponere здесь означает деятельно направлять или устраивать жизнь человека; настоящее время по-русски естественно выражает последовательное действие в молитвенном описании, следуя аудированной редакции.
- source_word: tuae misericordiae
  choice: Своей милостью
  rationale: Передано как средство действия, параллельно tuae iusticiae и tuo intellectu, без ослабления активного значения dispones.
- source_word: Enutristi eum tuae iusticiae
  choice: Ты взрастил его Своей праведностью
  rationale: Инструментальное понимание дательного сохраняет синтаксический параллелизм с милостью и разумением.
- source_word: corripuisti eum tuo intellectu
  choice: вразумил Своим разумением
  rationale: Corripere допускает исправление через наставление; «вразумил» естественно соединяется с intellectus и сохраняет оттенок исправления.
theological_decisions:
- issue: Связь Божьей милости с dispones
  choice: «направляешь его Своей милостью»
  alternative: «вверяешь его Своей милости»
  rationale: Основной текст сохраняет активное Божье руководство и инструментальное значение tuae misericordiae; альтернативное дативное прочтение отмечено в сноске как реальная грамматическая возможность.
translation_notes:
  register: Современный литературный русский с молитвенно-возвышенным, но понятным строем. Начальная строчная буква и инфинитив сохранены, поскольку стих синтаксически продолжает предыдущее высказывание. Финальная запятая отражает незавершённость предложения в источнике.
