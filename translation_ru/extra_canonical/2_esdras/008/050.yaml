  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: ru
  text: Поэтому многие тяжкие бедствия постигнут живущих в мире в последние времена, потому что они ходили в великой гордыне. Ты же сам пойми и узнай о подобных тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter quod
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: miseriae multae miserabiles
  choice: многие тяжкие бедствия
  rationale: Естественно передаёт усиленное сочетание существительного и однокоренного определения, избегая неуклюжего русского повтора «бедственные бедствия».
- source_word: qui habitant saeculum in nouissimis
  choice: живущих в мире в последние времена
  rationale: Saeculum здесь обозначает нынешний мир или век, а in novissimis — его последние времена; формулировка сохраняет эсхатологический смысл без излишнего уточнения.
- source_word: in multa superbia ambulauerunt
  choice: ходили в великой гордыне
  rationale: Сохранена библейская метафора ambulare «ходить» как обозначение образа жизни; superbia передано как «гордыня».
- source_word: pro te intellege
  choice: вникни в то, что касается тебя
  rationale: Латинское выражение допускает буквальное «разумей о себе»; выбран ясный современный оборот с сохранением направленности на самого адресата.
- source_word: de similibus tuis inquire
  choice: расспроси о подобных тебе
  rationale: Передаёт inquire как побуждение узнать или исследовать, а similibus tuis — без уточнения, в чём именно состоит сходство.
theological_decisions:
- issue: Эсхатологическое значение in nouissimis
  choice: в последние времена
  alternative: в конце века
  rationale: Выбранное чтение естественно согласуется с латинским множественным novissimis и не навязывает более узкую периодизацию.
- issue: Кого обозначают «подобные тебе»
  choice: сохранено без пояснения
  alternative: праведные, подобные тебе
  rationale: Источник не называет их прямо праведными; добавление сняло бы намеренную контекстуальную неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Метафора «ходили в великой гордыне» сохранена ради связи с языком Писания; синтаксис второй фразы сделан понятным обычному читателю.
