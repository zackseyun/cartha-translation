  text: 'plantat, sed non in tempore omnia quae seminata sunt saluabuntur, sed nec omnia quae plantata sunt radicabunt, sic et qui in saeculo seminati sunt non omnes saluabuntur. Et respondi et dixi : si inueni gratiam coram te loquar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/041.yaml
  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: ru
  text: 'сажает, но не всё посеянное будет спасено в своё время и не всё посаженное укоренится. Так и не все из посеянных в мире[a] будут спасены». И я ответил и сказал: «Если я обрёл благоволение перед тобой, позволь мне говорить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в веке».'
    reason: Латинское saeculum может обозначать как мир или миропорядок, так и век, эпоху.
lexical_decisions:
- source_word: plantat
  choice: сажает
  rationale: Сохранено начало с глагола, продолжающее мысль предыдущего стиха; не добавлено отсутствующее в данном стихе упоминание земледельца.
- source_word: saluabuntur
  choice: будет спасено / будут спасены
  rationale: Один и тот же латинский глагол передан последовательно в земледельческой картине и в её применении к людям, что сохраняет намеренную смысловую связь.
- source_word: in tempore
  choice: в своё время
  rationale: Близко передаёт временное выражение и естественно относится к посеянному, не вводя оттенка «в надлежащее время».
- source_word: radicabunt
  choice: укоренится
  rationale: Прямой и естественный русский эквивалент в образе посаженных растений.
- source_word: in saeculo
  choice: в мире
  rationale: В контексте речь идёт о людях, посеянных в нынешнем миропорядке; вариант «в веке» отмечен в сноске как возможная передача многозначного saeculum.
- source_word: gratiam coram te
  choice: благоволение пред Тобой
  rationale: Передаёт формулу обращения dignified современным русским языком без обязательного догматического оттенка слова «благодать».
- source_word: loquar
  choice: позволь мне говорить
  rationale: Сослагательная форма в условной формуле естественно понимается как вежливая просьба о разрешении.
theological_decisions:
- issue: Повтор saluabuntur в отношении семян и людей
  choice: В обоих случаях употреблено «спасено / спасены»
  alternative: В первом случае «сохранится», во втором «будут спасены»
  rationale: Последовательная передача сохраняет явную словесную связь и богословское напряжение исходного текста, хотя применение «спасено» к посеянному необычно по-русски.
- issue: Значение saeculum
  choice: «мир» в основном тексте
  alternative: «век»
  rationale: «Мир» понятнее современному читателю и соответствует контексту человеческого существования; временно-эсхатологическая возможность не устранена, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Начальная фрагментарность сохранена, поскольку стих продолжает синтаксис предыдущего стиха; отсутствующий в латинском тексте материал не восполнен.
