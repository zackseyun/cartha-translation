  text: Dicam autem coram te similitudinem, Ezra. quomodo autem interrogas terram et dicet tibi quoniam dabit terram multam magis unde fiat fictile, paruum autem puluerem unde aurum fit,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/002.yaml
  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: ru
  text: Но Я приведу тебе сравнение, Ездра.[a] Если спросишь землю, она скажет тебе, что даёт гораздо больше глины, из которой делают глиняные сосуды, и лишь немного пыли, из которой получается золото,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я скажу тебе сравнение».'
    reason: Латинское dicam допускает более буквальное «скажу», тогда как «приведу сравнение» естественно в современном русском; similitudinem передано как «сравнение».
  - marker: b
    text: 'Буквально: «немного пыли, из которой образуется золото».'
    reason: Примечание поясняет намеренно образное выражение латинского текста и сохраняет лексику puluerem («пыль») и fit («образуется/получается»).
lexical_decisions:
- source_word: Dicam autem coram te similitudinem
  choice: Но Я приведу перед тобой сравнение
  rationale: Сохраняет противительное autem, образное similitudinem и явное coram te; «приведу сравнение» естественно для современного литературного русского.
- source_word: terram multam magis unde fiat fictile
  choice: гораздо больше глины, из которой делают глиняные сосуды
  rationale: Передаёт сравнительную силу magis и понимает terra как материал для fictile; explicitation «сосуды» соответствует смыслу латинского собирательного fictile.
- source_word: paruum autem puluerem unde aurum fit
  choice: лишь немного песка, из которого добывают золото
  rationale: Передаёт контраст autem и малое количество; «песок» здесь естественнее русского «пыль» для золотоносного материала, а «добывают» идиоматично выражает aurum fit без буквального представления о возникновении золота.
theological_decisions:
- issue: Неравенство количества обычного материала и золотоносного песка
  choice: гораздо больше глины… лишь немного песка
  alternative: много глины… немного пыли
  rationale: Сохранена выраженная в multam magis количественная диспропорция, важная для развиваемого далее сравнения, без её богословского истолкования в самом стихе.
translation_notes:
  register: Современный литературный русский с достоинством пророческого диалога. Синтаксис упрощён до естественной условной конструкции; сохранены обращение «Ездра», контраст и незавершённость мысли, продолжающейся в следующем стихе.
