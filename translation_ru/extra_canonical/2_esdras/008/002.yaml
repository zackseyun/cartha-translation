  source_fidelity: 'Нужна правка в последнем образе: латинское puluerem — «пыль», а не «песок». Глагол fit следует передать без добавления идеи добычи: речь о пыли, «из которой получается/образуется золото». Сравнительная сила multam magis в «гораздо больше глины» передана верно. Конечная запятая сохраняет незавершённое сравнение, продолжающееся в следующем стихе.'
  naturalness: «Приведу тебе сравнение» — естественнее, чем «приведу перед тобой сравнение»; дательный падеж по-русски адекватно передаёт направленность coram te. Формулировка «из которой получается золото» намеренно близка к образному и несколько необычному выражению источника.
  terminology: «Ездра» и «сравнение» уместны. «Глиняные сосуды» ясно передаёт fictile. «Пыль» сохраняет лексику pulvis/puluerem; не следует заменять её «песком» или вводить «добывают», чего в источнике нет.
