source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: quae sunt praesentia praesentibus et quae futura futuris. Multum enim tibi restat ut'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/046.yaml
  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: ru
  text: 'Он ответил мне и сказал: «Нынешнее — для ныне живущих, а будущее — для тех, кто будет жить в будущем».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «То, что существует ныне, — для нынешних, а то, что будет, — для будущих».'
    reason: Сохраняет более формальное соответствие латинскому параллелизму и показывает субстантивированное употребление praesentibus и futuris.
lexical_decisions:
- source_word: quae sunt praesentia
  choice: нынешнее
  rationale: Передаёт субстантивированное среднее множественного числа — «то, что существует сейчас; нынешние вещи/явления» — без излишней конкретизации.
- source_word: praesentibus
  choice: для ныне живущих
  rationale: Латинская форма является дательным множественного числа и естественно обозначает людей настоящего времени, а не абстрактное «настоящее».
- source_word: quae futura
  choice: будущее
  rationale: Кратко и естественно передаёт «то, что будет; будущие вещи/события», сохраняя параллелизм.
- source_word: futuris
  choice: для тех, кто будет жить в будущем
  rationale: Передаёт дательное множественного числа как указание на людей будущего времени и избегает неясного русского «для будущих».
- source_word: respondit ad me et dixit
  choice: ответил мне и сказал
  rationale: Сохраняет характерную для библейского повествования двучленную формулу, оставаясь понятной современному читателю.
theological_decisions:
- issue: К кому относятся praesentibus и futuris
  choice: К людям, живущим соответственно ныне и в будущем
  alternative: К абстрактным периодам — настоящему и будущему
  rationale: Обе латинские формы — дательный падеж множественного числа; в данном апокалиптическом противопоставлении они естественнее понимаются как группы людей. Перевод не уточняет их духовный статус и не вводит конфессионального толкования.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Параллелизм латинской фразы сохранён, но эллиптические формы раскрыты настолько, чтобы ясно обозначить две группы людей. Конечные слова «Multum enim tibi restat ut» не включены: это незавершённое начало следующего смыслового отрезка и отсутствует в предоставленном английском тексте данного стиха.'
