  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: ru
  text: И не желай погубить тех, кто жил по-скотски[a], но воззри на тех, кто превосходно преподавали Твой Закон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «кто имел нравы скота».'
    reason: Сохраняет прозрачность образа pecorum mores habuerunt при более естественном идиоматическом переводе в основном тексте.
lexical_decisions:
- source_word: neque volueris perdere
  choice: И не желай погубить
  rationale: Передаёт volueris как желание или волеизъявление, сохраняя молитвенное обращение и запретительную форму.
- source_word: qui pecorum mores habuerunt
  choice: тех, кто жил по-скотски
  rationale: Идиоматично передаёт буквальное «имел нравы скота» как образ скотского образа жизни, не сводя mores к современному значению «манеры».
- source_word: respicias
  choice: воззри
  rationale: Сохраняет возвышенный молитвенный регистр и смысл благосклонного внимания, а не просто зрительного действия.
- source_word: legem tuam
  choice: Твоему Закону
  rationale: Дательный падеж естественно сочетается с «учил»; прописные буквы отмечают обращение к Богу и Его Закону в русском библейском регистре.
- source_word: splendide docuerunt
  choice: славно учил
  rationale: «Славно» передаёт положительную, возвышенную оценку splendide, сохраняя возможный оттенок превосходного и достойного исполнения.
theological_decisions:
- issue: Основание просьбы о милости
  choice: Сохранено прямое противопоставление живших по-скотски и славно учивших Закону без пояснения их взаимосвязи.
  alternative: Истолковать учителей Закона как основание для помилования остальных или как отдельную группу, на которую Бог должен обратить внимание.
  rationale: Латинский текст не уточняет, каким образом вторая группа связана с просьбой не губить первую; неоднозначность не следует устранять в переводе.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенно-библейским оттенком. Архаизирующее «воззри» уместно в прямом обращении к Богу; остальная фраза остаётся понятной современному читателю.
