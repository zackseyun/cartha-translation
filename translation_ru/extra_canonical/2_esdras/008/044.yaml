source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tua imago nominatus, quoniam similatus est, per quem omnia plasmasti, et similasti eum semini agricolae. Non, domine
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
translation:
  language: ru
  text: названный Твоим образом, потому что он уподоблен Тебе, ради него Ты создал всё и уподобил его семени земледельца. Нет, Господи…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tua imago nominatus
  choice: названный Твоим образом
  rationale: Сохраняет значение nominatus («названный») и именную конструкцию «Твой образ», естественно продолжая предшествующий контекст.
- source_word: quoniam similatus est
  choice: потому что он уподоблен Тебе
  rationale: Передаёт пассивную форму similatus est; подразумеваемое дополнение восстанавливается из tua («Твоим/Тебе»).
- source_word: per quem omnia plasmasti
  choice: ради него Ты создал всё
  rationale: Хотя латинское per quem буквально допускает «через которого», в данном контексте оно, вероятно, отражает греческое δι’ ὅν — «ради которого»; это также согласуется с мыслью книги о мире, созданном ради человека, и не делает человека посредником творения.
- source_word: similasti eum semini agricolae
  choice: уподобил его семени земледельца
  rationale: Сохраняет образ и дательный semini; «земледелец» соответствует agricola и звучит достойно в современном русском.
- source_word: Non, domine
  choice: Нет, Господи…
  rationale: Сохраняет краткий, обрывающийся переход в данном фрагменте; многоточие отмечает незавершённость цитируемого отрезка.
theological_decisions:
- issue: Роль человека в выражении per quem omnia plasmasti
  choice: ради него Ты создал всё
  alternative: через которого Ты создал всё
  rationale: 'Инструментальное прочтение могло бы представить человека действующим посредником творения. Контекст 4 Ездры и вероятная греческая основа указывают на целевое значение: мир создан ради человека.'
translation_notes:
  register: Современный литературный русский с библейской торжественностью; местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксическая фрагментарность начала и конца сохранена, поскольку стих представляет часть более длинной речи и источник здесь обрывается.
