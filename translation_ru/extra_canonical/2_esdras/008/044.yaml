  source_fidelity: 'Перевод точно передаёт фрагментарный латинский текст: nominatus — «названный», tua imago — «Твоим образом», similatus est — «уподоблен Тебе», а similasti eum semini agricolae — «уподобил его семени земледельца». Передача per quem как «ради него» оправдана контекстом и вероятным отражением греческого δι’ ὅν; инструментальное «через которого» здесь исказило бы смысл.'
  naturalness: Фраза грамматически естественна для современного литературного русского и сохраняет возвышенный библейский регистр. Начальная причастная конструкция и обрыв «Нет, Господи…» уместно отражают границы данного фрагмента.
  terminology: «Твой образ», «уподоблен», «создал всё», «семя земледельца» последовательно и без конфессионально обусловленных добавлений передают лексику оригинала. Прописные буквы в обращении к Богу соответствуют заявленному русскому библейскому оформлению.
