  text: enutristi eum tuae iustitiae, et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/012.yaml
  text: You nourished him with your righteousness, and instructed him in your law, and corrected him by your understanding.
translation:
  language: ru
  text: Ты питал его Своей праведностью, наставлял его в Своём законе и исправлял его Своим разумением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enutristi
  choice: питал
  rationale: Передаёт образ взращивания и поддержания, сохраняя конкретность латинского глагола.
- source_word: tuae iustitiae
  choice: Своей праведностью
  rationale: Родительный падеж в латинском допускает инструментальное понимание; русский творительный естественно передаёт праведность Бога как то, чем Он питал человека.
- source_word: erudisti
  choice: наставлял
  rationale: Естественно выражает обучение и воспитание в Божьем законе.
- source_word: in lege tua
  choice: в Своём законе
  rationale: Сохраняет латинскую конструкцию и представляет закон как область наставления.
- source_word: corripuisti
  choice: исправлял
  rationale: Передаёт корректирующее воздействие без излишнего усиления до наказания или обличения.
- source_word: tuo intellectu
  choice: Своим разумением
  rationale: Сохраняет инструментальный смысл и обозначает Божью способность понимать и мудро направлять.
theological_decisions:
- issue: Средство питания и исправления
  choice: «Своей праведностью» и «Своим разумением»
  alternative: «в Своей праведности» и «Своим пониманием»
  rationale: Творительный падеж сохраняет предложенное контекстом инструментальное прочтение, не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Возвратное притяжательное местоимение устраняет неестественную двусмысленность; прописная буква обозначает Бога согласно русской библейской традиции.
