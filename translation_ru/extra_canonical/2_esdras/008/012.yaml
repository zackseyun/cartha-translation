  source_fidelity: 'Текст точно передаёт три латинских совершенных действия по отношению к «нему»: enutristi, erudisti и corripuisti. Творительный падеж в «Своей праведностью» и «Своим разумением» обоснованно выражает инструментальное прочтение форм tuae iustitiae и tuo intellectu; «в Своём законе» прямо соответствует in lege tua.'
