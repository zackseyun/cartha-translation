revisions:
- from: Но и то, что сохраняет, и то, что сохраняется, — и то и другое будет сохранено Твоей охраной. И когда утроба вновь отдаст то, что…
  to: А само то, что сохраняет, и то, что сохраняется, — и то и другое будут сохранены Твоим сохранением. И когда утроба вновь отдаст то, что…
  rationale: Исправление восстанавливает в русском повтор «сохранять / сохраняться / сохранены / сохранение», существенный для формы латинской фразы, и передаёт ipsum без конкретизации его неясного референта. Обрыв перевода сохранён, так как предоставленный латинский текст оканчивается на quae.
