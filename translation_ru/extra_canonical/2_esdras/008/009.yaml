  text: But both what preserves and what is preserved will be preserved by your preservation. And when the womb again gives back
translation:
  language: ru
  text: А само то, что сохраняет, и то, что сохраняется, — и то и другое будут сохранены Твоим сохранением. И когда утроба вновь отдаст то, что…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruat
  choice: сохраняет
  rationale: Передаёт активное значение латинского глагола и сохраняет словесную связь с последующими формами seruatur/seruabuntur.
- source_word: seruatur
  choice: сохраняется
  rationale: Пассивная форма точно отражает латинское противопоставление между сохраняющим и сохраняемым.
- source_word: seruatione tua
  choice: Твоей охраной
  rationale: «Охрана» естественнее по-русски в значении оберегающего действия Бога, при этом позволяет избежать тяжеловесного повтора «сохранено Твоим сохранением».
- source_word: reddit matrix
  choice: утроба вновь отдаст
  rationale: Matrix в контексте означает материнскую утробу; reddit передаёт возвращение или выдачу того, что она прежде приняла.
theological_decisions:
- issue: Кто или что обозначено как «сохраняющее»
  choice: Сохранена безличная формулировка «то, что сохраняет»
  alternative: Истолковать это как душу, дух, пищу или материнскую утробу
  rationale: Латинский отрывок сам не уточняет референт; конкретизация сняла бы подлинную неоднозначность.
- issue: Характер Божьего сохраняющего действия
  choice: «Твоей охраной»
  alternative: «Твоим спасением»
  rationale: Seruatio здесь прежде всего означает сохранение и охрану; перевод «спасением» внёс бы более узкий сотериологический смысл.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Местоимение «Твоей» написано с прописной буквы как обращение к Богу. Поскольку предоставленный исходный фрагмент обрывается на quae, перевод также оставлен синтаксически незавершённым и отмечен многоточием.
