  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: ru
  text: но о тех, кто с болью хранил Твои заветы. Не думай о тех, кто лживо поступал пред Тобой,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamenta
  choice: заветы
  rationale: Латинское множественное число означает данные Богом установления или заветы; «заветы» естественно передаёт это значение в библейском контексте.
- source_word: cum doloribus
  choice: с болью
  rationale: Сохраняет значение сопутствующей скорби или страдания, выраженное предлогом cum, не уточняя, была ли боль обстоятельством или внутренним переживанием.
- source_word: custodierunt
  choice: хранил
  rationale: «Хранил» передаёт верность и соблюдение заветов, сохраняя образ охраны, присущий custodire.
- source_word: Neque cogites
  choice: Не думай
  rationale: Прямое и понятное современное соответствие латинскому выражению; по контексту речь идёт о том, чтобы не обращать помысла на названных людей.
theological_decisions:
- issue: К кому обращено прошение и чьи это заветы
  choice: «Твои заветы», с прописной буквы в местоимении
  alternative: «твои заветы»
  rationale: Контекст молитвенного обращения указывает на Бога; прописная буква поддерживает принятый в русском библейском тексте почтительный регистр, не добавляя отдельного богословского толкования.
- issue: Характер верности заветам в выражении cum doloribus
  choice: «с болью хранил»
  alternative: «хранил среди скорбей»
  rationale: 'Выбранный вариант сохраняет неоднозначность: боль могла сопровождать соблюдение как внутренне, так и внешне. Альтернатива сильнее утверждала бы, что речь именно о внешних бедствиях.'
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Пред Тобой» сохраняет достоинство молитвенной речи; синтаксис и конечная запятая отражают незавершённость фразы в данном стиховом фрагменте.
