revisions:
- from: Если город дан человеку в наследство, но наследник не пройдёт через ожидающую его опасность, как он получит своё наследство?
  to: Если же человеку будет дан город в наследство, то, если наследник не пройдёт через предстоящую ему опасность, как он получит своё наследство?
  rationale: Исправлено место союза «же» и устранено не имеющее опоры в источнике противительное «но». Уточнена форма будущего времени и слегка приближено выражение опасности к antepositum, при сохранении естественного русского языка и исходной неоднозначности относительно того, кем опасность поставлена.
