source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: ru
  text: Если же человеку будет дан город в наследство, то, если наследник не пройдёт через предстоящую ему опасность, как он получит своё наследство?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: civitas
  choice: город
  rationale: Прямое и естественное соответствие латинскому civitas в данном образном контексте.
- source_word: in hereditatem
  choice: в наследство
  rationale: Передаёт назначение дара и сохраняет повторяющийся мотив наследства.
- source_word: antepositum periculum
  choice: ожидающую его опасность
  rationale: Естественно по-русски выражает опасность, поставленную перед наследником, не уточняя, кем именно она поставлена.
- source_word: pertransierit
  choice: не пройдёт через
  rationale: Сохраняет пространственный образ прохождения через препятствие и условную направленность фразы.
theological_decisions:
- issue: Условие получения наследства
  choice: Сохранена необходимость пройти через опасность перед получением наследства.
  alternative: Ослабить условность, передав лишь последовательность событий.
  rationale: Латинская конструкция прямо связывает получение наследства с прохождением предстоящей опасности; эту напряжённость не следует сглаживать.
- issue: Эмфатическая конструкция data dabitur
  choice: Передано простым «дан», без добавления «непременно» или «действительно».
  alternative: «непременно будет дан»
  rationale: Удвоение может отражать семитизирующую эмфатическую конструкцию, однако в данном латинском вопросе её степень не вполне определённа; явное наречное усиление могло бы переинтерпретировать текст.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос сохранён. Повтор «наследник / наследство» намеренно удерживает словесную связь латинских heres / hereditas. Союз «но» естественно передаёт внутреннее противопоставление второго условного придаточного, хотя в источнике повторено si.
