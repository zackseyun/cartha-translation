review_pass:
  verdict: revise
  source_fidelity: Союз «но» в черновике неверно присоединяет второе условие как противопоставление. В латинском si autem вводит первую часть («если же»), после чего следует второе, параллельное si. «Ожидающую его опасность» в целом передаёт смысл antepositum periculum, но «предстоящую ему» ближе сохраняет образ опасности, стоящей перед наследником. Будущее «будет дан» ясно отражает dabitur.
  naturalness: Исправленная фраза сохраняет естественный современный литературный русский синтаксис, риторический вопрос и намеренный повтор «наследник / наследство».
  terminology: «Город», «наследник» и «наследство» точны и согласованы с civitas, heres и hereditas. Доктринальных терминов или спорных интерпретаций не добавлено.
  issues:
  - severity: medium
    issue: «но» перед вторым условием
    rationale: Латинское autem относится к начальному si («если же»), а не создаёт противительного отношения между двумя условиями. Следует сохранить параллельную условную структуру.
  - severity: low
    issue: Временная форма первого условия
    rationale: «Дан» допустимо в обобщённой формулировке, однако «будет дан» отчётливее передаёт латинское будущее dabitur без навязывания усиления.
  revised_text: Если же человеку будет дан город в наследство, то, если наследник не пройдёт через предстоящую ему опасность, как он получит своё наследство?
