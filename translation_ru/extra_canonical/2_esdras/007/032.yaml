id: 2ES.7.32
reference: 2 Esdras 7:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: ru
  text: И земля возвратит тех, кто спит в ней, и прах — тех, кто обитает в нём в безмолвии, и хранилища возвратят вверенные им души.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra reddet
  choice: земля возвратит
  rationale: Сохраняет олицетворение земли и повтор глагола reddet, связывающий первую и третью части стиха.
- source_word: pulvis
  choice: прах
  rationale: В данном контексте обозначает землю как место пребывания умерших; «прах» естественен для библейского регистра и сохраняет образ исходного текста.
- source_word: in eo silentio habitant
  choice: обитает в нём в безмолвии
  rationale: Передаёт мужской род eo как отсылку к pulvis и сохраняет отдельные значения habitant и silentio, не сводя выражение просто к смерти.
- source_word: promptuaria
  choice: хранилища
  rationale: Нейтрально передаёт образ мест, где души временно сохраняются, не уточняя их природу сверх латинского текста.
- source_word: commendatae sunt animae
  choice: вверенные им души
  rationale: Передаёт идею доверенного хранения; местоимение «им» согласовано с множественным числом promptuaria.
theological_decisions:
- issue: Соотношение телесного воскресения и пребывания душ в хранилищах
  choice: Сохранены оба параллельных образа без их систематического согласования
  alternative: Истолковать землю и прах как тела, а хранилища — как определённое место загробного мира
  rationale: Латинский текст утверждает возвращение умерших землёй и прахом и возвращение душ хранилищами, но не объясняет точную связь этих образов.
- issue: Значение безмолвия умерших
  choice: «в безмолвии»
  alternative: «безмолвно» или «в месте безмолвия»
  rationale: Формулировка сохраняет существительное silentio и образ состояния умерших, не превращая его в отдельное названное место.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксический параллелизм трёх частей и повтор «возвратит» сохранены; тире во второй части естественно восполняет пропущенный в латинском повтор сказуемого.
