source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: unum saeculum, sed duo. Tu enim, quia dixisti non esse multos iustos, sed paucos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/051.yaml
  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: ru
  text: Один век, но два. Ведь ты сказал, что праведных не много, а мало,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: Латинское saeculum здесь обозначает век или эпоху; «век» сохраняет краткость и эсхатологическую многозначность исходного текста.
- source_word: iustos
  choice: праведных
  rationale: Прямое и общепонятное соответствие iustos в контексте нравственно-эсхатологического противопоставления.
- source_word: paucos
  choice: мало
  rationale: В конструкции «не много, а мало» естественно передаёт количественное противопоставление multos ... paucos.
theological_decisions:
- issue: Неясное противопоставление «один век, но два»
  choice: 'Сохранено буквально: «Один век, но два»'
  alternative: «Век один, однако их два» или смысловое уточнение двух миров/веков
  rationale: Фраза в предоставленном латинском фрагментарна и парадоксальна. Уточнение подразумеваемого существительного или богословской концепции устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный регистр. Синтаксическая незавершённость в конце сохранена запятой, поскольку исходный фрагмент продолжается.
