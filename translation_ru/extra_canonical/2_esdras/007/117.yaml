  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: ru
  text: Ибо какая польза всем жить в печали в нынешней жизни[a] и, умерев, ожидать наказания?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем людям жить в нынешнее время».'
    reason: Передаёт возможное явное восполнение подразумеваемого «людям» и более свободное временное понимание in praesenti, тогда как основной текст естественно выражает контраст нынешней жизни с посмертным будущим.
lexical_decisions:
- source_word: Quid enim prodest
  choice: Ибо что пользы
  rationale: Передаёт риторический вопрос и причинно-пояснительное enim естественной русской формулой.
- source_word: omnibus
  choice: всем
  rationale: Прямо сохраняет неопределённое «всем», не добавляя отсутствующего в латинском тексте слова «людям».
- source_word: in praesenti
  choice: в настоящем
  rationale: Сохраняет буквальное и контекстуально значимое противопоставление настоящего будущему, не сводя выражение к простому «сейчас».
- source_word: vivere in tristitia
  choice: жить в печали
  rationale: Естественно и достаточно близко передаёт vivere и tristitia, сохраняя серьёзный регистр.
- source_word: mortuos sperare punitionem
  choice: умерев, ожидать наказания
  rationale: Передаёт mortuos как состояние после смерти, избегая неестественного русского «будучи мёртвыми», и сохраняет значение sperare здесь как ожидание предстоящего.
theological_decisions:
- issue: Эсхатологический оттенок in praesenti
  choice: в настоящем
  alternative: ныне / сейчас
  rationale: Формулировка сохраняет возможное противопоставление нынешнего порядка будущему суду, не делая его более явным, чем в источнике.
- issue: Ожидание наказания умершими
  choice: умерев, ожидать наказания
  alternative: после смерти подвергнуться наказанию
  rationale: Источник говорит именно об ожидании наказания, а не прямо о его претерпевании; перевод не устраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос сохранён. Оборот «в настоящем» намеренно несколько приподнят и отражает апокалиптическое противопоставление настоящего будущему.
