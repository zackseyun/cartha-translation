  text: 'И он ответил мне и сказал: «В тебе — весы того, о чём ты размышлял[a], ибо тот, кто имеет…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский текст этого места труден и, вероятно, повреждён. Буквально: «В тебе — весы того, о чём ты размышлял». Возможный перевод по общему смыслу рассуждения: «Взвесь в себе то, о чём ты размышлял».'
    reason: textual_variant
lexical_decisions:
- source_word: pondera
  choice: весы
  rationale: Сохраняет конкретный образ латинского множественного числа и не превращает повреждённый текст в неподтверждённое повеление «взвесь».
- source_word: quæ cogitasti
  choice: того, о чём ты размышлял
  rationale: Естественно передаёт относительную конструкцию и значение cogitasti, не уточняя содержание размышлений.
- source_word: quoniam qui habet
  choice: потому что тот, кто имеет…
  rationale: Передаёт обрывающуюся в предоставленном источнике причинную конструкцию; многоточие показывает её незавершённость.
theological_decisions:
- issue: Смысл повреждённой фразы «In te †stant pondera»
  choice: В тебе — †весы того, о чём ты размышлял
  alternative: Взвесь в себе то, о чём ты размышлял
  rationale: Выбран более формальный вариант, соответствующий сохранившимся словам и сохраняющий неясность текста; повелительное наклонение не засвидетельствовано непосредственно.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Знак † сохранён при сомнительном чтении; незавершённость предоставленного латинского текста обозначена многоточием.
