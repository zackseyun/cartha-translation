  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: ru
  text: которые проявили презрение; и не причисляй себя к тем, кто терпит мучения. Ибо у Всевышнего для тебя хранится сокровище дел, но оно не будет показано тебе до последних времён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до последних»; подразумеваемое существительное в латинском тексте не названо.'
    reason: Латинское nouissimis употреблено эллиптически, поэтому «времён» является контекстуальным восполнением.
lexical_decisions:
- source_word: speruerunt
  choice: выказали презрение
  rationale: Передаёт значение латинского perfectum от spernere («презирать, отвергать») и сохраняет отсутствие явно названного объекта.
- source_word: connumeres te
  choice: не причисляй себя
  rationale: Естественно передаёт запретительный конъюнктив со значением «не считай/не включай себя в число».
- source_word: qui cruciantur
  choice: те, кто терпит мучения
  rationale: Передаёт пассивное значение cruciantur без уточнения источника или характера мучений.
- source_word: thesaurus operum
  choice: сокровище дел
  rationale: Сохраняет конкретную метафору thesaurus и богословски значимое, но не разъяснённое сочетание operum.
- source_word: repositus apud Altissimum
  choice: у Всевышнего … хранится
  rationale: Передаёт как состояние сохранённости, так и пребывание сокровища у Всевышнего.
- source_word: demonstrabitur
  choice: будет показано
  rationale: Формально сохраняет пассив и не подменяет образ толкованием вроде «будет дано» или «откроется».
- source_word: usque in nouissimis
  choice: до последних времён
  rationale: Контекстуально естественное восполнение субстантивированного множественного nouissimis; неопределённость эллиптического выражения отмечена в сноске.
theological_decisions:
- issue: Смысл выражения «сокровище дел»
  choice: Сохранить буквально-образное «сокровище дел»
  alternative: «награда за дела» или «заслуги»
  rationale: Латинский текст не отождествляет сокровище прямо ни с наградой, ни с заслугами; такое уточнение преждевременно разрешило бы богословскую напряжённость.
- issue: Объект презрения
  choice: Не добавлять объект
  alternative: «презрели Бога/Его закон»
  rationale: В данном фрагменте объект при speruerunt не выражен; его добавление зависело бы от толкования предшествующего контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Начальная относительная конструкция сохранена как продолжение предыдущего стиха, а не превращена в самостоятельное предложение.
