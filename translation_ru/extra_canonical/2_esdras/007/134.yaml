  text: et longanimis, quoniam longanimitatem praestat his qui peccaverunt quasi suis operibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/134.yaml
  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: ru
  text: и долготерпелив, потому что проявляет долготерпение к согрешившим, как к Своим творениям,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimis / longanimitatem
  choice: долготерпелив / долготерпение
  rationale: Сохраняет повтор однокоренных слов в латинском тексте и передаёт терпеливое снисхождение Бога.
- source_word: praestat
  choice: проявляет
  rationale: В сочетании с «долготерпением» это естественное русское соответствие со значением «оказывает, являет».
- source_word: his qui peccaverunt
  choice: к согрешившим
  rationale: Кратко и точно передаёт субстантивированную конструкцию «к тем, кто согрешил», не уточняя характер или время греха сверх источника.
- source_word: quasi suis operibus
  choice: как к Своим творениям
  rationale: «Творения» естественно передаёт opera в отношении созданных Богом людей; «как» сохраняет сравнительный оттенок quasi, а не превращает его в прямое отождествление.
theological_decisions:
- issue: Отношение Бога к согрешившим как к Его opera
  choice: как к Своим творениям
  alternative: как к делам Своим
  rationale: Выбранный вариант ясно выражает, что согрешившие остаются Божьими созданиями, при этом не добавляет конфессионального толкования и сохраняет сравнительную форму латинского quasi.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранён риторический повтор «долготерпелив — долготерпение» и завершающая запятая, поскольку стих представляет собой часть продолжающегося перечня.
