base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/094.yaml
  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: ru
  text: 'Третий разряд: они видят свидетельство, которое дал им Тот, Кто их создал[a], — что при жизни они хранили вверенный им закон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу контекста: «свидетельство, которое Тот, Кто их создал, дал о них». Латинское eis обычно означает «им», но может пониматься и как указание на тех, о ком дано свидетельство.'
    reason: Сохраняет неоднозначность связи латинского eis с testimonium/testificatus est, не подменяя прямое грамматическое чтение контекстуальным в основном тексте.
lexical_decisions:
- source_word: Tertius ordo
  choice: Третья ступень
  rationale: В перечислении последовательных состояний «ступень» передаёт ordo естественнее для современного русского читателя, чем буквальное и канцелярское «порядок» или сословное «разряд».
- source_word: uidentes
  choice: они видят
  rationale: Латинское причастие передано личной формой ради естественного русского синтаксиса, при этом сохранено настоящее время и отличие от причинных формулировок соседних пунктов.
- source_word: testimonium quod testificatus est eis
  choice: свидетельство, которое дал о них
  rationale: Формулировка передаёт свидетельство Создателя о душах; неоднозначность местоимения eis отмечена в сноске.
- source_word: qui plasmauit eas
  choice: Тот, Кто их создал
  rationale: Сохраняется образ Создателя и женский референт eas — души; прописные буквы указывают на Бога без внесения конфессиональной терминологии.
- source_word: uiuentes serua-
  choice: при жизни они хранили
  rationale: Передаёт временное значение uiuentes и начатую в сохранившемся фрагменте форму serua-; дополнение о законе восстановлено по продолжению текстовой традиции, отражённому в контрольном английском слое.
- source_word: law that was entrusted to them
  choice: вверенный им закон
  rationale: «Вверенный» естественно передаёт мысль о законе, данном им на хранение и исполнение, не добавляя конфессионального толкования.
theological_decisions:
- issue: Кому или о ком дано свидетельство
  choice: Создатель дал свидетельство о них
  alternative: Создатель засвидетельствовал им
  rationale: Контекст понимает содержание свидетельства как Божье подтверждение верности душ, однако латинское eis допускает более прямое дательное прочтение; оно сохранено в сноске.
- issue: Содержание свидетельства
  choice: свидетельство состоит в том, что при жизни они хранили закон
  alternative: они видят данное им свидетельство, поскольку при жизни хранили закон
  rationale: Двоеточие и конструкция с «что» следуют принятому синтаксическому пониманию, но не превращают сохранение закона в явно выраженную причинную конструкцию, отсутствующую при uidentes.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Синтаксис несколько распрямлён ради ясности; перечислительная структура и богословская неоднозначность исходника сохранены.
