source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam haec est via, quam Moyses dixit cum viveret ad populum dicens: elige tibi vitam ut vivas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: ru
  text: 'Ибо это тот путь, о котором Моисей при жизни говорил народу: «Избери для себя жизнь, чтобы жить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: via
  choice: путь
  rationale: Прямое соответствие латинскому образу; сохраняет как буквальный, так и нравственно-духовный смысл.
- source_word: cum viveret
  choice: при жизни
  rationale: Естественно и точно передаёт временное значение латинского оборота.
- source_word: elige tibi vitam
  choice: избери для себя жизнь
  rationale: Сохраняет повеление elige, возвратную направленность tibi и библейски узнаваемое, но понятное современному читателю слово «избери».
- source_word: ut vivas
  choice: чтобы жить
  rationale: Передаёт цель, выраженную ut с сослагательным наклонением, без стилистического утяжеления.
theological_decisions:
- issue: Связь «пути» с речью Моисея
  choice: «путь, о котором Моисей… говорил»
  alternative: «путь, который Моисей… назвал»
  rationale: Латинское quam Moyses dixit допускает несколько способов передачи; выбранный вариант сохраняет широкую формулировку и не добавляет отсутствующего в источнике значения «назвал».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского, при этом образ пути и формулировка призыва сохранены.
