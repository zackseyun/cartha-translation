source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc torquemur, quoniam scientes perimus. Lugeat hominum genus, et agrestes bestiae laetentur, lugeant omnes qui nati sunt, quadripedia uero et pecora
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: ru
  text: 'И потому мы терпим мучения: ведь мы погибаем, зная. Пусть скорбит род человеческий, а полевые звери радуются; пусть плачут все рождённые, а четвероногие и скот веселятся.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquemur
  choice: мы терпим мучения
  rationale: Передаёт страдание и мучительность латинского глагола без чрезмерного уточнения характера мук.
- source_word: scientes perimus
  choice: мы погибаем, хотя и знаем
  rationale: Сохраняет смысл уступительности, подразумеваемый причастием, и напряжение между знанием и гибелью.
- source_word: hominum genus
  choice: род человеческий
  rationale: Естественное и возвышенное соответствие собирательному обозначению человечества.
- source_word: agrestes bestiae
  choice: полевые звери
  rationale: Передаёт животных дикой природы; «полевые» сохраняет связь agrestes с открытой местностью.
- source_word: quadripedia uero et pecora
  choice: а четвероногие и скот
  rationale: Сохраняет два параллельных класса исходного текста и противопоставление, выраженное uero.
theological_decisions:
- issue: Причина мучений и гибели при наличии знания
  choice: 'Сохранено прямое утверждение: «мы погибаем, хотя и знаем»'
  alternative: «мы сознательно погибаем» или «мы погибаем, зная»
  rationale: Выбранная формулировка не определяет, является ли знание лишь усугубляющим обстоятельством или выражением сознательного выбора, сохраняя напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повелительно-пожелательная анафора «пусть» сохранена; пары «скорбит/радуются» и «плачут/веселятся» передают риторический параллелизм латинского текста.
