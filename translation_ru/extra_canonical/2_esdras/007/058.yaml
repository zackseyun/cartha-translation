source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi : dominator domine, quod abundat uilius, quod enim rarius pretiosius est.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: ru
  text: 'И я сказал: «О Господь, Владыка[a], то, чего больше, менее ценно[b], ибо то, что встречается реже, драгоценнее».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О Господь, Правитель».'
    reason: Латинское dominator может обозначать владыку, повелителя или правителя.
  - marker: b
    text: 'Или: «дешевле».'
    reason: Латинское uilius допускает как общее значение меньшей ценности, так и более узкое указание на меньшую цену.
lexical_decisions:
- source_word: dominator domine
  choice: О Господь Владыка
  rationale: Два латинских звательных титула переданы двумя титулами обращения без превращения одного из них в придаточное предложение; формулировка сохраняет возвышенный библейский регистр и звучит естественно по-русски.
- source_word: quod abundat
  choice: то, чего больше
  rationale: Передаёт идею сравнительной многочисленности или изобилия в рамках противопоставления редкому, не сужая смысл до материального изобилия.
- source_word: uilius
  choice: менее ценно
  rationale: В данном афористическом противопоставлении pretiosius речь прежде всего о ценности, а не обязательно о рыночной цене.
- source_word: quod enim rarius pretiosius est
  choice: ибо то, что встречается реже, драгоценнее
  rationale: Сохраняет причинную связь enim и сравнительное противопоставление rarius — pretiosius в естественной русской форме.
theological_decisions:
- issue: Характер обращения dominator domine
  choice: О Господь Владыка
  alternative: О Господь, Правитель
  rationale: Основной вариант сохраняет оба самостоятельных титула и торжественный характер обращения; примечание оставляет доступным более прямое значение dominator.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Афористическая симметрия между многочисленным и редким сохранена; коммерческий оттенок не навязан основному тексту.
