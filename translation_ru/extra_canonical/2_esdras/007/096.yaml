  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: ru
  text: 'Пятый чин: они радуются тому, как ныне избежали тленного и как унаследуют грядущее; также видят тесный и полный трудов путь[a], ибо были избавлены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте слово, переданное как «трудов», восстановлено издателем; существительное «путь» подразумевается по смыслу.
    reason: textual_and_implicit_noun
lexical_decisions:
- source_word: corruptibile
  choice: тленное
  rationale: Субстантивированное прилагательное среднего рода обозначает всё подверженное тлению; «тленное» сохраняет лаконичность и эсхатологический оттенок латинского слова.
- source_word: futurum
  choice: грядущее
  rationale: Субстантивированное «будущее» здесь обозначает грядущую реальность или удел; «грядущее» естественно звучит в возвышенном, но современном библейском регистре.
- source_word: quomodo … quomodo
  choice: как … как
  rationale: Повтор сохраняет параллелизм оригинала. Русское «как» после глагола радости допускает как изъяснительное, так и образно-модальное прочтение, не устраняя неоднозначность позднелатинского quomodo.
- source_word: angustum et [labore] plenum
  choice: тесный и полный трудов путь
  rationale: Прилагательные требуют подразумеваемого существительного; «путь» естественно передаёт контекст движения и избавления. Множественное «трудов» по-русски идиоматично выражает тяжесть и тяготы пути.
- source_word: liberati sunt
  choice: были избавлены
  rationale: Пассивная форма сохранена, не называя прямо подразумеваемого избавителя и не добавляя отсутствующей в тексте конкретизации.
theological_decisions:
- issue: Характер наследия futurum
  choice: грядущее
  alternative: будущий мир
  rationale: Источник не уточняет, что именно составляет будущее наследие; перевод не вводит более определённое выражение «будущий мир».
- issue: От чего именно избавлены праведные
  choice: не уточнять объект избавления
  alternative: избавлены от тесного и полного трудов пути
  rationale: Латинское quoniam liberati sunt не содержит выраженного дополнения. Сохранение абсолютной конструкции удерживает синтаксическую и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формула «Пятый чин» и глагол «радуются» обеспечивают самостоятельность стиха согласно контексту английского консультационного слоя, хотя предоставленный латинский отрывок начинается с quomodo. Параллельное «как … как» намеренно сохраняет структуру и возможную неоднозначность источника.
