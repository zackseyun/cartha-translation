source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: ru
  text: Ибо какая нам польза, если нам обещан бессмертный век, а мы творили дела смертные?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  choice: Ибо какая нам польза
  rationale: Естественно передаёт риторический вопрос и сохраняет причинно-пояснительное enim.
- source_word: inmortale tempus
  choice: бессмертный век
  rationale: «Век» в данном эсхатологическом контексте точнее, чем буквальное «время», а «бессмертный» сохраняет образ и контраст с mortalia.
- source_word: mortalia opera egimus
  choice: мы творили дела смертные
  rationale: Сохраняет выраженный в латинском контраст «бессмертный — смертные» и передаёт egimus как деятельное совершение поступков.
theological_decisions:
- issue: Смысл выражения inmortale tempus
  choice: бессмертный век
  alternative: вечная жизнь / бессмертное время
  rationale: Не сводит обещание только к индивидуальной жизни и сохраняет эсхатологическую широту и образность исходного текста.
- issue: Характер mortalia opera
  choice: дела смертные
  alternative: смертные поступки / дела, ведущие к смерти
  rationale: 'Буквальная формулировка сохраняет неоднозначность: это могут быть дела смертных людей, преходящие дела или дела, связанные со смертью; причинное толкование не добавляется.'
translation_notes:
  register: 'Современный литературный русский с библейской торжественностью. Инверсия «дела смертные» намеренно сохраняет риторический параллелизм: «бессмертный век — дела смертные».'
