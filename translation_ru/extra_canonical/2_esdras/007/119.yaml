  source_fidelity: 'Текст точно передаёт латинский риторический вопрос: «Ибо какая нам польза» соответствует Quid enim nobis prodest; условное «если нам обещан» воспроизводит promissum est nobis; противопоставление «бессмертный век — дела смертные» сохраняет ключевую лексику и антитезу inmortale / mortalia. «Творили» адекватно передаёт egimus как совершённые человеком дела.'
