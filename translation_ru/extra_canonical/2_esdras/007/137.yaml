source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: ru
  text: Ибо если Он не умножит их[a], то век не будет оживотворён вместе с теми, кто обитает в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если бы Он не умножил их, то век не был бы оживотворён».'
    reason: Сохраняет альтернативный прежний вариант из английского аудиторского следа, не выдавая его за основное значение латинского будущего условия.
lexical_decisions:
- source_word: multiplicaverit
  choice: умножит их
  rationale: Будущее условие передано русским совершенным видом; местоимение «их» восполняет подразумеваемый объект по контексту, как и в консультационном английском тексте.
- source_word: saeculum
  choice: век
  rationale: Сохраняет основное значение латинского saeculum и эсхатологическую многозначность, не сужая его до «мира» или «творения».
- source_word: vivificabitur
  choice: получит жизни
  rationale: Естественно передаёт пассивное «будет оживотворён / ему будет дана жизнь», сохраняя мысль о получении жизни извне.
- source_word: cum his qui habitant in eo
  choice: вместе с теми, кто обитает в нём
  rationale: Близко следует латинской конструкции и сохраняет отнесение местоимения к «веку».
theological_decisions:
- issue: Субъект multiplicaverit
  choice: Он
  alternative: он
  rationale: Подразумеваемый субъект по контексту — Бог; прописная буква принята как русская издательская конвенция, не добавляющая имени в сам текст.
- issue: Временная сила условия
  choice: если Он не умножит… то век не получит
  alternative: если бы Он не умножил… век не получил бы
  rationale: Латинские формы multiplicaverit и vivificabitur выражают реальное будущее условие, а не контрфактическое предположение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Союз «то» добавлен для ясности длинного условного предложения; подлинная многозначность слова saeculum сохранена словом «век».
