id: 2ES.7.70
reference: 2 Esdras 7:70
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Когда Всевышний создавал век, Он прежде приготовил суд и всё, что относится к суду, для Адама и всех, кто пришёл с ним[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних переводах: «от него».'
    reason: Латинское основание имеет cum eo («с ним»), но вариант «от него» известен по древней переводной традиции и поясняет возможное происхождение людей от Адама.
lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: Латинское saeculum здесь обозначает устроенный Богом мировой век; «век» сохраняет эсхатологический оттенок и связь с контекстом книги.
- source_word: iudicium
  choice: суд
  rationale: Прямой и богословски нейтральный эквивалент латинского iudicium.
- source_word: quae sunt iudicii
  choice: всё, что относится к суду
  rationale: Естественно передаёт буквальное «то, что есть суда / принадлежит суду», не уточняя без основания, идёт ли речь о приговорах, обстоятельствах или средствах суда.
- source_word: cum eo uenerunt
  choice: кто пришёл с ним
  rationale: Следует чтению латинского основания cum eo — «с ним», не заменяя его смыслом «от него».
theological_decisions:
- issue: К кому относится приготовление суда
  choice: «для Адама и всех, кто пришёл с ним» отнесено к глаголу «приготовил»
  alternative: Отнести Адама и остальных к созданию века
  rationale: Порядок и синтаксическая структура латинского текста лучше поддерживают понимание, согласно которому суд был приготовлен для Адама и остальных.
- issue: Значение cum eo
  choice: «с ним»
  alternative: «от него»
  rationale: «С ним» точно отражает латинский текст и сохраняет его трудность; «от него» потребовало бы иного латинского выражения или текстовой поправки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены повтор «ответил… и сказал» и термин «век» как характерные элементы исходного текста; громоздкое «вещи суда» передано естественнее, без смыслового сужения.
