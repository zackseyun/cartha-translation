  terminology: '«Суд» — точное и нейтральное соответствие iudicium в данном контексте. Выбор не уточнять «Божий суд» обоснован: такого определения в латинском тексте нет. Терминология согласуется с английской контрольной формулировкой «coming into judgment».'
