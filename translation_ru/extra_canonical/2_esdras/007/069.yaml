source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et si non essemus post mortem in iudicio uenientes, melius fortassis nobis uenisset.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/069.yaml
  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: ru
  text: И если бы после смерти нас не ожидал суд, возможно, для нас было бы лучше».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post mortem
  choice: после смерти
  rationale: Прямо и естественно передаёт латинское временное выражение.
- source_word: in iudicio uenientes
  choice: нас ожидал суд
  rationale: Идиоматично передаёт буквальное «приходящие на суд», сохраняя мысль о предстоящем посмертном суде без уточнения его исхода.
- source_word: melius fortassis nobis uenisset
  choice: возможно, для нас было бы лучше
  rationale: Сохраняет осторожность fortassis и смысл ирреального сравнительного оборота; по-русски звучит естественно и достойно.
theological_decisions:
- issue: Характер посмертного суда
  choice: не уточнять ни исход суда, ни того, кто именно судит
  alternative: «нам не предстояло предстать перед Божьим судом»
  rationale: Латинский текст говорит лишь о приходе на суд после смерти; добавление «Божьим» и образа предстояния внесло бы отсутствующую в стихе конкретизацию.
translation_notes:
  register: Современный литературный русский язык; краткая условная фраза сохраняет мрачную богословскую напряжённость оригинала. Конечная кавычка оставлена в соответствии с тем, что стих завершает реплику в предоставленном английском консультационном тексте.
