  source_fidelity: 'Русский текст точно передаёт латинскую условную конструкцию: «после смерти» соответствует post mortem, а «нас не ожидал суд» естественно выражает мысль in iudicio venientes («нам предстояло прийти на суд»), не добавляя субъекта суда или его результата. «Возможно» верно сохраняет fortassis, а «для нас было бы лучше» — смысл melius nobis venisset.'
