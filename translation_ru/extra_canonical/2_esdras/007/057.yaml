  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: ru
  text: 'Так рассуди и сам, что ценно и желанно: то, что множится, или то, что рождается редко?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aestima et tu
  choice: Так рассуди и сам
  rationale: Передаёт призыв к самостоятельной оценке; «рассуди» естественно и достойно звучит в современном русском.
- source_word: pretiosa et desiderabilia
  choice: ценно и желанно
  rationale: 'Сохраняет оба определения: высокую ценность и желанность.'
- source_word: quod multiplicatur
  choice: то, что множится
  rationale: Передаёт процессуальное значение multiplicatur и сохраняет контраст с редким появлением.
- source_word: quod rarum nascitur
  choice: то, что рождается редко
  rationale: Близко воспроизводит образ nascitur, не сводя его молча к простому «редко встречается».
