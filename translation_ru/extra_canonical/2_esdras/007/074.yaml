  text: 'modo respondebunt in nouissimis temporibus? Quantum enim tempus ex quo longanimitatem habuit Altissimus his qui inhabitant saeculum, et non propter eos, sed propter ea quae prouidit tempora! Et respondi et dixi: si inueni gratiam'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/074.yaml
  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: ru
  text: 'Как же они ответят в последние времена? Ведь как долго Всевышний проявлял долготерпение к обитателям этого века — не ради них, а ради времён, которые Он предвидел! И я сказал в ответ: «Если я обрёл благоволение…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: modo respondebunt
  choice: Как же они ответят
  rationale: Начальное modo по смыслу и, вероятно, по границе фрагмента передаёт окончание quomodo («как»); русский вопрос сформулирован естественно, без попытки придать modo несвойственное контексту значение.
- source_word: in nouissimis temporibus
  choice: в последние времена
  rationale: Сохраняет эсхатологическую временную формулу латинского текста.
- source_word: Quantum enim tempus ex quo
  choice: Ведь как долго
  rationale: Передаёт восклицательно-вопросительный оборот естественным современным русским языком, не утяжеляя его буквальным «сколько времени с тех пор, как».
- source_word: longanimitatem habuit
  choice: проявлял долготерпение
  rationale: «Долготерпение» сохраняет смысл длительного терпения и традиционную библейскую окраску, а глагол «проявлял» звучит по-русски естественно.
- source_word: his qui inhabitant saeculum
  choice: к обитателям этого века
  rationale: Saeculum может обозначать мир или век; «этот век» сохраняет временно-эсхатологическую многозначность и согласуется с последующим упоминанием времён.
- source_word: propter ea quae prouidit tempora
  choice: ради времён, которые Он предвидел
  rationale: Близко передаёт providit без усиления до «предопределил»; тем самым не снимается возможная богословская напряжённость между предведением и предустановлением.
- source_word: si inueni gratiam
  choice: Если я обрёл благоволение
  rationale: Обычная библейская формула, точно передающая gratiam как благосклонность, а не как абстрактную догматическую категорию.
theological_decisions:
- issue: Значение providit применительно ко временам
  choice: предвидел
  alternative: предопределил / предусмотрел
  rationale: Латинское providere допускает оттенки предвидения и предусмотрения; выбран более прямой эквивалент, не вводящий более сильного утверждения о предопределении.
- issue: Значение saeculum
  choice: этот век
  alternative: мир
  rationale: «Этот век» сохраняет эсхатологическое измерение текста и его связь с «последними временами», тогда как «мир» сужает выражение до пространственного значения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; сохранены риторический вопрос, восклицание и незавершённость последней реплики, поскольку стих обрывается на условной формуле.
