  source_fidelity: 'Будущее значение erit ... positus верно передаётся словами «будет расположен». Однако инфинитивный оборот «чтобы быть подобным реке» неудачно оформляет ut esset: он создаёт стилистически и синтаксически ослабленную конструкцию и не выражает явно, что сравнение относится к входу. Придаточное с «так что» естественно передаёт результативно-сравнительный оттенок ut esset, не исключая его целевой окраски.'
  naturalness: «Но вход в него будет расположен в узком месте, чтобы быть подобным реке» в современном литературном русском звучит как тяжёлый инфинитивный оборот; при этом подразумеваемый субъект инфинитива формально не назван. Явное местоимение «он» делает фразу ясной и естественной.
  terminology: «Вход», «узкое место» и «река» точны и соответствуют образности латинского текста. Богословски нагруженных терминов нет.
