  yaml_path: translation/extra_canonical/2_esdras/007/004.yaml
  text: But its entrance will be set in a narrow place[b][a], so that it would be like a river.
translation:
  language: ru
  text: Но вход в него будет расположен в узком месте, так что он будет подобен реке.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: вход
  rationale: Прямое и естественное соответствие латинскому существительному; в контексте обозначает вход в ранее упомянутый город.
- source_word: in angusto loco
  choice: в узком месте
  rationale: Сохраняет пространственный образ и значение angustus без излишнего истолкования.
- source_word: similis fluminis
  choice: подобным реке
  rationale: Передаёт латинскую конструкцию similis с родительным падежом и сохраняет образ сравнения.
theological_decisions:
- issue: Значение придаточного с ut esset
  choice: чтобы быть подобным реке
  alternative: так что он был бы подобен реке
  rationale: Латинское ut с сослагательным наклонением допускает целевой и результативный оттенки. Русское «чтобы» сохраняет эту смысловую открытость и не превращает придаточное в простое утверждение.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и dignified. Будущее значение erit ... positus передано формой «будет расположен», а инфинитивный оборот устраняет неясность местоимения при естественном русском звучании.
