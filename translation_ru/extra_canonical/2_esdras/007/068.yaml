source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: ru
  text: Что пользы в том, что мы будем спасены, если будем подвергнуты мучениям? Ведь все рождённые смешаны с беззакониями, полны грехов и отягощены прегрешениями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid prodest
  choice: Что пользы
  rationale: Естественная для современного литературного русского передача риторического вопроса о пользе или выгоде.
- source_word: salutati saluabimur
  choice: мы будем спасены
  rationale: Сохраняет пассивное значение и не вводит усиления, которого очищенный латинский текст однозначно не требует.
- source_word: tormento tormentabimur
  choice: будем подвергнуты мучениям
  rationale: Передаёт сочетание существительного и однокоренного глагола естественным русским оборотом без неподтверждённого усиления.
- source_word: conmixti sunt iniquitatibus
  choice: сопричастны беззакониям
  rationale: Буквальное «смешаны с беззакониями» по-русски неестественно; «сопричастны» выражает тесную связанность с беззакониями, не добавляя идеи освобождения или прощения.
- source_word: pleni sunt peccatis
  choice: полны грехов
  rationale: Прямая и ясная передача латинской метафоры полноты.
- source_word: grauidi delictis
  choice: отягощены прегрешениями
  rationale: Сохраняет образ тяжести и отличает delicta от peccata; «прегрешения» соответствует возвышенному, но понятному регистру.
theological_decisions:
- issue: Соотношение будущего спасения и мучений
  choice: Сохранить оба утверждения в условном риторическом вопросе без пояснения их взаимосвязи
  alternative: Истолковать спасение как окончательное избавление, а мучения — как временное очищение либо как невозможный исход
  rationale: Латинский текст оставляет богословское напряжение неразрешённым, поэтому перевод не должен навязывать конкретную схему наказания или спасения.
- issue: Всеобщая вовлечённость рождённых в грех
  choice: «все рождённые сопричастны беззакониям»
  alternative: «все люди по природе виновны»
  rationale: Выбранная формулировка передаёт утверждение текста, не добавляя систематического учения о природе или наследовании вины.
translation_notes:
  register: 'Современный литературный русский с достоинством апокалиптической речи. Сохранён параллелизм трёх характеристик: сопричастны беззакониям, полны грехов, отягощены прегрешениями. Архаизмы и конфессионально маркированная терминология не используются.'
