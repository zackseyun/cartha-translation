id: 2ES.7.111
reference: 2 Esdras 7:111
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: ru
  text: Итак, если теперь, когда тление возросло и неправедность умножилась, праведники молились за нечестивых, то почему и тогда не будет так?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptibile
  choice: тление
  rationale: Латинское субстантивированное прилагательное обозначает подверженность порче или тлению; «тление» естественно по-русски и сохраняет смысловую широту.
- source_word: iniustitia
  choice: неправедность
  rationale: Передаёт нравственно-богословский смысл несправедливости и неправоты, не сужая его до отдельного вида беззакония.
- source_word: exoraverunt
  choice: молились за
  rationale: В данном контексте глагол выражает ходатайственную молитву; русская конструкция прямо и естественно обозначает её объект.
- source_word: impiis
  choice: нечестивых
  rationale: Соответствует dative plural impiis после exoraverunt и сохраняет религиозно-нравственный оттенок латинского impius.
- source_word: et tunc
  choice: и тогда
  rationale: 'Союз «и» сохраняет добавочное значение et: если это происходит теперь, почему этого не будет также тогда?'
theological_decisions:
- issue: Возможность ходатайства праведников за нечестивых в будущем времени
  choice: Сохранён вопрос без пояснения или догматического разрешения
  alternative: Уточнить, что речь идёт именно о дне суда или о посмертном ходатайстве
  rationale: Латинский стих говорит лишь tunc («тогда»); ближайший контекст определяет референт, но сам стих оставляет его невыраженным.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Парная конструкция «умножились тление и неправедность» воспроизводит параллелизм источника; «и тогда» сохраняет нюанс латинского et.
