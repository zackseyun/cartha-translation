source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: ru
  text: Ибо не было бы печали об их гибели, как будет радость за тех, кому обещано спасение[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кому дана уверенность в спасении»; латинское выражение допускает смысл удостоверения в спасении, а не только обещания.'
    reason: source_ambiguity
lexical_decisions:
- source_word: quoniam
  choice: Ибо
  rationale: Передаёт причинно-пояснительное значение латинского союза, не превращая его в следственное «поэтому».
- source_word: non esset tristitia
  choice: не должно быть печали
  rationale: Передаёт imperfectum coniunctivi esset как модально окрашенное утверждение, а не как простое будущее время.
- source_word: in perditione eorum
  choice: об их погибели
  rationale: Русское «печаль о погибели» естественно передаёт значение in при существительном эмоционального состояния.
- source_word: futurum est gaudium super eos
  choice: будет радость о тех
  rationale: Сохраняет явное будущее значение futurum est и параллелизм с печалью об их погибели.
- source_word: quibus persuasa est salus
  choice: кому обещано спасение
  rationale: Естественная русская передача трудной позднелатинской конструкции с пассивным persuasa и дательным quibus; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Характер спасения в выражении quibus persuasa est salus
  choice: кому обещано спасение
  alternative: кому дана уверенность в спасении / для кого спасение стало несомненным
  rationale: Основной текст следует понятному контекстуальному смыслу, но не утверждает, что спасение уже совершилось; необычная латинская формулировка допускает оттенок удостоверения, который сохранён в сноске.
- issue: Модальность печали о погибающих
  choice: не должно быть печали
  alternative: не было бы печали
  rationale: Так сохраняется сослагательная форма esset и нормативно-модальный оттенок английского консультационного слоя, без замены её категорическим будущим «не будет».
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и возвышенный. Сохранены причинное начало стиха и смысловой параллелизм между печалью и радостью.
