source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: ru
  text: и исполнен великой милости[a], ибо Он умножает милости для тех, кто ныне живёт, кто ушёл и кто ещё будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и богат милостями, ибо ещё более умножает милости».'
    reason: Отмечает возможное множественное осмысление misericordiae и явное передачу magis как сравнительно-интенсивного «ещё более», не навязывая прогрессивное значение «всё более и более».
lexical_decisions:
- source_word: multae misericordiae
  choice: исполнен великой милости
  rationale: Латинское сочетание буквально означает «[обладающий] великой/обильной милостью». Русское «исполнен великой милости» естественно передаёт подразумеваемую характеристику, не превращая единственное число в отвлечённое множественное.
- source_word: multiplicat magis misericordias
  choice: умножает милости
  rationale: Глагол multiplicat уже выражает увеличение; magis допускает усилительное или сравнительное понимание, поэтому в основном тексте оно не передано отдельным наречием, чтобы не навязывать значение «всё больше и больше».
- source_word: his qui praesentes sunt et qui praeterierunt et qui futuri sunt
  choice: к тем, кто живёт ныне, кто уже отошёл и кто ещё придёт
  rationale: Три временные группы переданы симметрично и естественно по-русски. «Отошёл» сохраняет сдержанную эвфемистическую формулировку источника, а «ещё придёт» не сужает будущих людей до конкретного толкования.
theological_decisions:
- issue: Распространение Божьих милостей на нынешних, ушедших и будущих
  choice: сохранить все три группы без пояснения механизма или следствий этой милости
  alternative: истолковать фразу как утверждение о посмертном спасении либо только о памяти поколений
  rationale: Латинский текст утверждает направленность милостей на три группы, но не объясняет, каким образом они действуют; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка представляет собой продолжение предыдущего синтаксического ряда, поэтому начинается со строчной буквы и союза «и».
