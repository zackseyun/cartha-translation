source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: ru
  text: Ибо явится Мой Сын Иисус[b] вместе с теми, кто с Ним, и в течение четырёхсот лет будет радовать оставшихся[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский порядок слов допускает также смысловое присоединение «четырёхсот лет» к «оставшимся»; однако форма annis quadringentis естественнее понимается как указание на длительность действия: «будет радовать в течение четырёхсот лет».'
    reason: Сохраняет отмеченную в традиции возможность иной группировки, не превращая «оставшихся» в будущее «тех, кто останется».
  - marker: b
    text: В латинском тексте здесь употреблено примечательное именование «Мой Сын Иисус», тогда как в 7:29 сказано «Мой Сын Христос» («Мессия»). Далее описываются период в четыреста лет, смерть Мессии, семь дней изначального безмолвия, а затем воскресение — одно из наиболее ярких мессианских мест ранней иудейской апокалиптики.
    reason: Сохраняет значимое различие формулировок в соседних стихах и поясняет мессианский контекст, не гармонизируя текст.
lexical_decisions:
- source_word: revelabitur
  choice: явится
  rationale: Латинская пассивная форма буквально означает «будет явлен», но в апокалиптическом контексте современное русское «явится» естественно и точно передаёт открытое явление ранее сокрытой личности.
- source_word: Filius meus Iesus
  choice: Мой Сын Иисус
  rationale: Сохранено необычное и текстологически значимое собственное имя Iesus, без замены на «Мессию» или «Христа».
- source_word: cum his qui cum eo
  choice: вместе с теми, кто с Ним
  rationale: Формально и естественно передано повторение предлога cum; не уточняется, кто именно сопровождает Сына, поскольку источник этого не объясняет.
- source_word: iucundabit
  choice: будет радовать
  rationale: 'Передаёт каузативный смысл: он доставит радость, обрадует. Продолженная форма позволяет естественно связать действие с периодом в четыреста лет.'
- source_word: qui relicti sunt
  choice: оставшихся
  rationale: Сохраняется пассивно-результативная идея тех, кто был оставлен или уцелел, без внесения дополнительных представлений о месте либо причине их сохранения.
- source_word: annis quadringentis
  choice: четыреста лет
  rationale: Аблатив выражает временную длительность. В основном тексте срок отнесён к действию «будет радовать», что лучше соответствует грамматической функции формы, однако соседство с qui relicti sunt допускает иную смысловую группировку, отмеченную в сноске.
theological_decisions:
- issue: Соотношение именований Иисуса и Мессии в 7:28–29
  choice: Сохранить «Мой Сын Иисус» в 7:28
  alternative: Гармонизировать с последующим «Мой Сын Христос / Мессия»
  rationale: Латинский свидетель намеренно или по крайней мере фактически различает Iesus в этом стихе и Christus в следующем; перевод не должен устранять это значимое различие.
- issue: К кому относится срок в четыреста лет
  choice: К продолжительности радования оставшихся
  alternative: К продолжительности пребывания или сохранения оставшихся
  rationale: Аблатив annis quadringentis естественно служит обстоятельством длительности при iucundabit, но порядок слов допускает восприятие срока в связи с оставшимися; альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок слов сделан естественным для русского; местоимение «Ним» и слово «Сын» написаны с прописной буквы в соответствии с традиционным русским библейским регистром, без добавления конфессионально специфических толкований.
