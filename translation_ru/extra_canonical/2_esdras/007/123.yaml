source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam ostendetur paradisus, cuius fructus incorruptus perseverat, in quo est saturitas et medella,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: ru
  text: И поскольку будет явлен рай, плод которого остаётся нетленным и в котором — насыщение и исцеление,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: поскольку
  rationale: Передаёт причинное значение латинского союза, не превращая его в условное «если».
- source_word: ostendetur paradisus
  choice: будет явлен рай
  rationale: Сохраняет страдательную форму и эсхатологический, возвышенный регистр оригинала.
- source_word: fructus incorruptus perseverat
  choice: плод которого остаётся нетленным
  rationale: Точно передаёт продолжительное пребывание плода в нетленном состоянии.
- source_word: saturitas
  choice: насыщение
  rationale: Передаёт полноту утоления и насыщенности, не сужая смысл до одного лишь физического сытости.
- source_word: medella
  choice: исцеление
  rationale: Естественный современный эквивалент латинского слова со значением целительного средства или исцеления.
theological_decisions:
- issue: Характер связи, выраженной quoniam
  choice: 'причинная связь: «поскольку»'
  alternative: 'условная связь: «если»'
  rationale: Латинское quoniam здесь естественно имеет причинное значение; условный перевод не подтверждается исходным текстом.
- issue: Нетленность плода
  choice: «остаётся нетленным»
  alternative: «не портится»
  rationale: «Нетленный» сохраняет богословскую и эсхатологическую окраску incorruptus, не добавляя толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая незавершённость и конечная запятая сохранены, поскольку стих является частью продолжающегося предложения.
