source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: soluta est intemperantia, abscisa est incredulitas, crevit autem iustitia, orta est veritas.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/114.yaml
  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: ru
  text: Необузданность прекратилась, неверие было отсечено, а праведность возросла и истина явилась.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: необузданность
  rationale: Передаёт отсутствие самообладания и невоздержанность, не сужая значение до одного вида потворства своим желаниям.
- source_word: soluta est
  choice: прекратилась
  rationale: В данном ряду описывает устранение прежнего состояния; буквальное «разрешилась» в современном русском было бы неясным.
- source_word: incredulitas
  choice: неверие
  rationale: Прямой и богословски нейтральный эквивалент латинского существительного.
- source_word: abscisa est
  choice: было отсечено
  rationale: Сохраняет сильный образ полного устранения, выраженный латинским глаголом.
- source_word: iustitia
  choice: праведность
  rationale: В эсхатологическом и нравственном контексте точнее «справедливости» и сохраняет широкий библейский смысл.
- source_word: crevit
  choice: возросла
  rationale: Сохраняет образ роста и соответствует форме завершённого изменения.
- source_word: veritas
  choice: истина
  rationale: Естественный прямой эквивалент, сохраняющий возможный нравственный и онтологический объём слова.
- source_word: orta est
  choice: явилась
  rationale: Передаёт возникновение или наступление истины; буквальное «взошла» по-русски звучало бы чрезмерно образно без явной метафоры в контексте.
theological_decisions:
- issue: Связь между «праведностью» и «истиной» в описании будущего состояния
  choice: Сохранены два самостоятельных понятия без поясняющего сближения.
  alternative: Передать iustitia как «справедливость» или истолковать veritas как «верность».
  rationale: Латинский текст различает iustitia и veritas и не уточняет, идёт ли речь преимущественно о нравственных, судебных или онтологических качествах.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Пассив «было отсечено» сохранён ради силы исходного образа; союз autem передан как «а», поскольку здесь естественнее обозначить контраст без чрезмерного усиления.
