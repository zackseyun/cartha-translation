  yaml_path: translation/extra_canonical/2_esdras/007/086.yaml
  text: 'The sixth way: they see how some of them will pass over into torment[a].'
translation:
  language: ru
  text: 'Шестой путь: они видят, как некоторые из них перейдут в мучение[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как из их числа перейдут в мучение».'
    reason: Отмечает буквальную конструкцию de eis и показывает основание для перевода «некоторые из них».
lexical_decisions:
- source_word: Sexta via
  choice: Шестой путь
  rationale: Прямо сохраняет нумерацию и ключевой образ латинского текста.
- source_word: videntes
  choice: они видят
  rationale: Латинское причастие передано личной формой для естественного русского синтаксиса; подразумеваемый субъект определяется контекстом перечня.
- source_word: quemadmodum
  choice: как
  rationale: Передаёт вводимое им изъяснительное содержание видения без лишнего истолкования.
- source_word: de eis
  choice: некоторые из них
  rationale: Partitivное de eis означает людей из их числа, а не усилительное «они сами».
- source_word: pertransient in cruciamentum
  choice: перейдут в мучение
  rationale: Сохраняет будущее время, движение к новому состоянию и единственное число cruciamentum.
theological_decisions:
- issue: Кто именно перейдёт в мучение
  choice: некоторые из них
  alternative: они сами
  rationale: Латинское de eis имеет partitivное значение («из них», «из их числа»); для значения «они сами» ожидалось бы ipsi.
- issue: Число существительного cruciamentum
  choice: мучение
  alternative: мучения
  rationale: В восстановленном чтении стоит единственное число, поэтому множественное число не вводится.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, соответствует структуре нумерованного перечня. «Мучение» сохраняет судебно-эсхатологическую напряжённость текста, не уточняя её конфессионально.
