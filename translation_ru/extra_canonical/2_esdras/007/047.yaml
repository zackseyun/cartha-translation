  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: ru
  text: И теперь я вижу, что грядущий век принесёт радость немногим[a], а многим — мучения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И теперь я вижу, что радость грядущего века достанется немногим, а мучения — многим».'
    reason: Сохраняет синтаксическую возможность связать «грядущий век» прежде всего с «радостью», не создавая ошибочного впечатления, будто радость причиняет мучения многим.
lexical_decisions:
- source_word: saeculum futurum
  choice: грядущий век
  rationale: Устойчиво и точно передаёт эсхатологическое значение латинского выражения, не подменяя его более узким понятием «загробная жизнь».
- source_word: iocunditatem
  choice: радость
  rationale: Естественно передаёт значение радости и отрады в противопоставлении мучениям.
- source_word: ad paucos … multis autem
  choice: немногим … а многим
  rationale: Сохраняет резкий количественный контраст исходного текста.
- source_word: tormenta
  choice: мучения
  rationale: Передаёт множественное число и смысл страданий или кар без лишнего уточнения их природы.
theological_decisions:
- issue: Связь «грядущего века» с радостью и мучениями
  choice: «грядущий век принесёт радость немногим, а многим — мучения»
  alternative: «радость грядущего века достанется немногим, а мучения — многим»
  rationale: 'Основной вариант естественен по-русски и сохраняет параллель: грядущий век означает радость для немногих и мучения для многих. Сноска сохраняет возможное прочтение, при котором «радость» непосредственно определяется как радость грядущего века.'
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Эллипсис «а многим — мучения» сохраняет краткость и силу латинского противопоставления.
