revisions:
- from: Ибо Господь, когда пришедшие явились, ясно повелел им, что делать, чтобы жить, и что соблюдать, чтобы не подвергнуться наказанию.
  to: Ибо Господь, когда они пришли, повелел пришедшим, что им делать, чтобы жить, и что соблюдать, чтобы не быть наказанными.
  rationale: Убрано неоснованное наречие «ясно» и восстановлена, в естественно читаемом русском порядке, повторность латинского venientibus quando venerunt. «Не быть наказанными» прямо сохраняет страдательную конструкцию non punirentur, не уточняя характер наказания.
