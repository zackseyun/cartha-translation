source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: ru
  text: Ибо Господь, когда они пришли, повелел пришедшим, что им делать, чтобы жить, и что соблюдать, чтобы не быть наказанными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  choice: ибо… ясно повелел
  rationale: Латинская figura etymologica усиливает глагол «повелеть». Наречие «ясно» естественно передаёт эмфазу, не вводя оттенка строгости, которого сам текст прямо не выражает.
- source_word: venientibus quando venerunt
  choice: когда пришедшие явились… им
  rationale: Сохранены и причастное обозначение людей, и временное придаточное, несмотря на намеренную повторность исходного текста; «явились» позволяет избежать тяжеловесного русского повтора «пришедшие пришли».
- source_word: quid facientes viverent
  choice: что делать, чтобы жить
  rationale: Передаёт конструкцию с причастием и конъюнктивом цели/результата естественным современным русским оборотом, не уточняя природу обещанной жизни.
- source_word: quid observantes non punirentur
  choice: что соблюдать, чтобы не подвергнуться наказанию
  rationale: «Соблюдать» соответствует observare в контексте предписаний; страдательная форма сохраняет пассивное non punirentur.
theological_decisions:
- issue: Значение «жить»
  choice: сохранено без пояснения
  alternative: «обрести жизнь» или «остаться в живых»
  rationale: Латинское viverent допускает контекстуальное богословское наполнение, но стих сам по себе его не конкретизирует.
- issue: Основание избежания наказания
  choice: передана связь соблюдения заповеданного с тем, чтобы не быть наказанными
  alternative: переформулировать как условное обещание или учение о заслуге
  rationale: Перевод сохраняет формулировку источника, не превращая её в более разработанное конфессиональное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксическая повторность латинского оригинала частично сохранена, но смягчена ради естественности и ясности.
