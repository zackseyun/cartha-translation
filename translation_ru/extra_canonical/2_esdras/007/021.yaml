review_pass:
  verdict: revise
  source_fidelity: 'Наречие «ясно» не имеет прямой опоры в латинском mandans mandavit: этимологическая фигура усиливает сам акт повеления, но не утверждает его ясность. В остальном переданы адресаты, временная повторность, предписанное действие для жизни и соблюдение предписаний во избежание наказания.'
  naturalness: «Когда пришедшие явились» несколько искусственно и менее прозрачно, чем «когда они пришли». Сочетание «пришедшим, когда они пришли» намеренно сохраняет повтор исходника, но остаётся понятным в литературном библейском регистре.
  terminology: «Повелел», «соблюдать» и «быть наказанными» точно и естественно передают mandavit, observantes и non punirentur. «Жить» следует сохранить без богословского уточнения.
  issues:
  - severity: medium
    issue: Добавлено значение «ясно».
    rationale: Латинская figura etymologica mandans mandavit подчёркивает повеление, но не характеризует его как ясное. Добавление следует убрать.
  - severity: low
    issue: Ослаблена повторность venientibus quando venerunt.
    rationale: «Пришедшие явились» заменяет повтор однокоренных «пришли/пришедшим» и несколько меняет образ действия. Безопаснее воспроизвести повтор настолько, насколько допускает русский язык.
  revised_text: Ибо Господь, когда они пришли, повелел пришедшим, что им делать, чтобы жить, и что соблюдать, чтобы не быть наказанными.
