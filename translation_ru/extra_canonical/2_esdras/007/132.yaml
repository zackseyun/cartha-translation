id: 2ES.7.132
reference: 2 Esdras 7:132
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: ru
  text: 'И я сказал в ответ: «Я знаю, Господи, что Всевышний ныне именуется милосердным, потому что милует тех, кто ещё не пришёл в этот мир[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не пришёл в век»; то есть ещё не родился.'
    reason: Сохраняет формальную неоднозначность латинского saeculum и поясняет смысл идиомы.
lexical_decisions:
- source_word: respondi et dixi
  choice: сказал в ответ
  rationale: Естественно передаёт латинскую формулу ответа, не утяжеляя современный русский текст буквальным «ответил и сказал».
- source_word: nunc vocatus est
  choice: ныне именуется
  rationale: Сохраняет значение «называется/именуется теперь» и достойный повествовательный регистр.
- source_word: misericors / misereatur
  choice: милосердным / милует
  rationale: Сохраняет намеренный корневой повтор латинского текста.
- source_word: qui nondum in saeculo advenerunt
  choice: тех, кто ещё не пришёл в этот мир
  rationale: В данном обороте речь идёт о ещё не родившихся, то есть ещё не вступивших в земное существование; «в этот мир» естественно выражает идиому, не превращая saeculum без необходимости в технический эсхатологический термин.
theological_decisions:
- issue: Значение saeculum в выражении in saeculo advenerunt
  choice: этот мир
  alternative: этот век / век
  rationale: Контекстуальная идиома обозначает появление на свет. Основной текст передаёт это естественно, а сноска сохраняет формальную возможность прочтения saeculum как «век».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («ныне», «именуется», «Всевышний»). Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
