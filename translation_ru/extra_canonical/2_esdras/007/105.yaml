base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/105.yaml
  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
translation:
  language: ru
  text: или самого дорогого друга[a], чтобы тот за него понимал, спал, ел или был исцелён; поэтому никто никогда не будет молиться за другого, ведь тогда все — каждый в отдельности — понесут свои неправедные или праведные дела».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова перед этим местом в представленном латинском источнике не сохранились; начало фразы передано по контексту засвидетельствованного текста.
    reason: source_fragment
lexical_decisions:
- source_word: eo intellegat
  choice: чтобы тот вместо него понимал
  rationale: Латинское eo передаёт отнесённость действия к другому лицу; «вместо него» естественно выражает мысль о невозможности совершить это за другого.
- source_word: curetur
  choice: исцелился
  rationale: 'Сохранено пассивно-результативное значение: речь идёт о том, чтобы человек получил исцеление.'
- source_word: Sic
  choice: поэтому
  rationale: В данном контексте вводит вывод из перечисленного, а не просто описание способа действия.
- source_word: enim
  choice: ведь
  rationale: 'Передаёт пояснительно-причинную связь: личная ответственность объясняет невозможность ходатайства друг за друга.'
- source_word: omnes ... unusquisque
  choice: все — каждый в отдельности —
  rationale: Сохранены одновременно всеобщность суда и индивидуальная ответственность каждого.
- source_word: iniustitias suas aut iustitias
  choice: свои неправедные или праведные дела
  rationale: Формально множественные абстрактные существительные по-русски звучали бы неестественно; «дела» ясно передаёт множественность конкретных проявлений, не устраняя противопоставление через aut.
theological_decisions:
- issue: Ходатайство одного человека за другого в момент будущего суда
  choice: никто никогда не будет молиться за другого
  alternative: никто никогда не сможет молиться за другого
  rationale: Латинское rogabit — простое будущее «будет просить/молиться», без явно выраженной модальности невозможности; поэтому «сможет» не добавлено.
- issue: Личная ответственность за неправедность или праведность
  choice: каждый в отдельности понесёт свои неправедные или праведные дела
  alternative: каждый понесёт свою неправедность или праведность
  rationale: Сохранены множественное число обеих латинских форм и союз aut, не сводящий формулировку к одной заранее определённой категории.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Точка с запятой отделяет перечень действий, которые нельзя совершить за другого, от вывода о личной ответственности. Кавычка в конце сохранена как указание на продолжение прямой речи из контекста.
