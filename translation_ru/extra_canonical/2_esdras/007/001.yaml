source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum finissem loqui verba haec, et missus est ad me angelus, qui missus fuerat ad me primis noctibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: ru
  text: И когда я закончил говорить эти слова, ко мне снова был послан ангел, который был послан ко мне в первые ночи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est cum
  choice: И когда
  rationale: Латинская повествовательная формула передана естественным современным русским оборотом без тяжеловесного буквального «и случилось, когда».
- source_word: finissem loqui verba haec
  choice: я закончил говорить эти слова
  rationale: Сохраняется значение завершённого высказывания и близость к синтаксису источника.
- source_word: missus est ad me ... qui missus fuerat ad me
  choice: ко мне снова был послан ... который приходил ко мне
  rationale: Первое missus est передано буквально; второе пассивное выражение естественно передано глаголом «приходил». «Снова» ясно выражает повторность послания, подразумеваемую контекстом и отражённую в консультационном английском тексте.
- source_word: primis noctibus
  choice: в первые ночи
  rationale: Сохранено множественное число и временная отсылка латинского текста.
