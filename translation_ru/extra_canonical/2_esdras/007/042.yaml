source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: ru
  text: ни дождя, ни росы, ни полудня, ни ночи, ни рассвета, ни сияния, ни блеска, ни света, но только сияние славы Всевышнего, благодаря которому все начнут видеть то, что поставлено перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam / rorem
  choice: дождя / росы
  rationale: Прямые современные соответствия, сохраняющие парную конструкцию латинского текста.
- source_word: meridiem / noctem / ante lucem
  choice: полудня / ночи / рассвета
  rationale: Ante lucem буквально обозначает время перед дневным светом; «рассвет» естественно передаёт это значение в данном перечне.
- source_word: nitorem / claritatem / lucem
  choice: сияния / блеска / света
  rationale: Сохранено различие трёх близких понятий без искусственного усиления их смысловых границ.
- source_word: nisi solummodo splendorem
  choice: но только сияние
  rationale: Передаёт исключительное противопоставление nisi solummodo естественной русской конструкцией.
- source_word: splendorem claritatis Altissimi
  choice: сияние славы Всевышнего
  rationale: Продолжение, засвидетельствованное консультационным английским текстом, отражает традиционное понимание claritas как явленной славы; «сияние славы» сохраняет сочетание двух световых образов.
- source_word: qua incipient omnes videre quae praeposita sunt
  choice: благодаря которому все начнут видеть то, что поставлено перед ними
  rationale: Сохранены причинно-инструментальный оттенок qua, всеобщность omnes и намеренно неопределённое quae praeposita sunt.
theological_decisions:
- issue: Природа единственного света будущего состояния
  choice: сияние славы Всевышнего
  alternative: свет Всевышнего
  rationale: Выбранная формулировка не сводит два образа к одному и не уточняет способ присутствия Всевышнего сверх того, что выражено текстом.
- issue: Объект будущего видения
  choice: то, что поставлено перед ними
  alternative: то, что им уготовано
  rationale: 'Более буквальная формулировка сохраняет неопределённость: текст сам по себе не уточняет, идёт ли речь о награде, суде или иной предстоящей реальности.'
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом перечисления. Повтор «ни» сохранён ради структуры и нарастающего противопоставления; архаизмы и конфессионально окрашенные уточнения не вводились.
