  source_fidelity: 'Текст точно передаёт латинское «et Iesus qui post eum pro Israhel in diebus Achar, et Samuhel in diebus Saul»: сохранены перечислительная, незавершённая по отношению к предшествующему контексту конструкция, «после него», «за Израиль», а также указания на дни Ахара и Саула. «Иисус Навин» верно идентифицирует Iesus в данном ветхозаветном контексте. «Ахар» обоснованно сохраняет форму латинского Achar, а не гармонизирует её с более привычным «Ахан».'
