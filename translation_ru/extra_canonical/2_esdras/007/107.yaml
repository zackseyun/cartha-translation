  text: and Joshua after him for Israel in the days of Achar[a], and Samuel in the days of Saul,
translation:
  language: ru
  text: и после него Иисус Навин — за Израиль во дни Ахара[a], и Самуил во дни Саула,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте стоит Iesus — форма имени, которой может передаваться как имя Иисуса, так и имя Иисуса Навина. Здесь, в ветхозаветном контексте и во дни Ахара, имеется в виду Иисус, сын Навина.
    reason: lexical_alternative
lexical_decisions:
- source_word: Iesus
  choice: Иисус Навин
  rationale: В ветхозаветном контексте латинское Iesus обозначает Иисуса, сына Навина; добавление «Навин» естественно для русского читателя и устраняет случайное отождествление с Иисусом Христом.
- source_word: Achar
  choice: Ахар
  rationale: Передаёт собственное имя именно в форме латинского источника, не заменяя её более известным вариантом «Ахан».
- source_word: pro Israhel
  choice: за Израиль
  rationale: Сохраняет краткую эллиптическую конструкцию источника и её связь с подразумеваемым из контекста действием.
