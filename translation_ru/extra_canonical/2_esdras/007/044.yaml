  text: For it will last like a week of years. This is my judgment and its ordinance,
translation:
  language: ru
  text: Ведь оно продлится как седмина лет. Это — Мой суд и его установление,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ebdomada annorum
  choice: седмина лет
  rationale: Сохраняет буквальный образ семилетнего периода и библейский оттенок исходного выражения, не сводя его пояснительно к «семи годам».
- source_word: iudicium meum
  choice: Мой суд
  rationale: Прямо передаёт судебно-богословское значение iudicium в речи Бога.
- source_word: constitutio eius
  choice: установленный для него порядок
  rationale: Передаёт constitutio как установленное определение или устройство, а eius соотносит с ранее упомянутым периодом, не приписывая слову более узкого значения.
theological_decisions:
- issue: Значение constitutio eius
  choice: установленный для него порядок
  alternative: его установление
  rationale: Более естественно по-русски и сохраняет смысл божественно установленного порядка; местоименная отсылка в латинском допускает некоторую неоднозначность, поэтому перевод не уточняет содержание этого порядка.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. «Седмина» выбрана как понятный в библейском контексте термин; синтаксис остаётся кратким и торжественным. Конечная запятая сохранена, поскольку данный сегмент продолжается в следующем стиховом контексте.
