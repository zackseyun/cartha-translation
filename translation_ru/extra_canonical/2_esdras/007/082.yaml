  text: 'The second way: because they cannot now make a good repentance so as to live[a].'
translation:
  language: ru
  text: 'Второй путь: потому что они не могут раскаяться, чтобы жить.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «совершить доброе обращение, чтобы жить».'
    reason: Сохраняет для читателя образную форму латинского выражения reuersionem bonam facere и буквальную передачу ut uiuant.
lexical_decisions:
- source_word: via
  choice: путь
  rationale: Сохраняет повторяющийся в перечне образ и соответствует прямому значению латинского слова.
- source_word: reuersionem bonam facere
  choice: раскаяться
  rationale: Латинское выражение буквально говорит о совершении «доброго возвращения»; в данном контексте естественный русский эквивалент — действенное покаяние. Наречие «по-настоящему» не добавлено, чтобы не усиливать оценочный оттенок сверх источника.
- source_word: ut uiuant
  choice: так, чтобы обрести жизнь
  rationale: Передаёт целевое или результативное отношение ut и не сводит «жить» лишь к продолжению физического существования.
theological_decisions:
- issue: Возможный временной оттенок невозможности покаяния после смерти
  choice: Не добавлять «теперь» или «уже» в основной текст
  alternative: «они уже не могут раскаяться»
  rationale: В представленном латинском тексте при non possunt нет временного наречия; посмертный контекст позволяет читателю понять временную ситуацию без её внесения в перевод.
- issue: Смысл reuersionem bonam
  choice: «раскаяться»
  alternative: «совершить доброе обращение» / «принести доброе покаяние»
  rationale: Выбран естественный современный русский оборот, сохраняющий богословский смысл обращения и покаяния без конфессионально специфической терминологии.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка сохранена. Союз «потому что» опущен после двоеточия как избыточный в естественном русском перечислении причин.
