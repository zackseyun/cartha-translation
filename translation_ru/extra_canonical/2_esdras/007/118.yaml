revisions:
- from: О Адам, что ты сделал? Ведь если согрешил ты, то падение твоё стало не только твоим, но и нашим — тех, кто произошёл от тебя.
  to: О Адам, что ты сделал? Ведь если согрешил ты, то падение твоё было не только твоим, но и нашим, ведь мы произошли от тебя.
  rationale: Исправлена синтаксически несогласованная конструкция при qui ex te advenimus и выбран более прямой русский эквивалент для non est factum ... casus. Подчинительная условность si и эмфаза на «ты» сохранены. Английская контрольная версия также сохраняет «if»; её привязка сноски к «Adam» выглядит редакционно сомнительной, но в русском тексте сносок нет и добавлять её без текстологической необходимости не следует.
