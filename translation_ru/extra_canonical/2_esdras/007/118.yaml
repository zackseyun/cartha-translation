source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: ru
  text: О Адам, что ты сделал? Ведь если согрешил ты, то падение твоё было не только твоим, но и нашим, ведь мы произошли от тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  choice: О Адам, что ты сделал?
  rationale: Русское обращение естественно ставит имя рядом с междометием; местоимение «ты» передано личной формой и явным «ты» в вопросе.
- source_word: si enim tu peccasti
  choice: Ведь если согрешил ты
  rationale: «Ведь» передаёт enim, «если» сохраняет формальное условие si, а конечная позиция «ты» подчёркивает выраженное в латинском tu.
- source_word: casus
  choice: падение
  rationale: В контексте греха Адама слово означает его падение; этот выбор сохраняет образ и богословскую насыщенность латинского термина.
- source_word: qui ex te advenimus
  choice: тех, кто произошёл от тебя
  rationale: Передаёт происхождение последующих людей от Адама естественным современным русским языком, не сводя выражение лишь к физическому прибытию.
theological_decisions:
- issue: Условное или уступительное значение si
  choice: если согрешил ты
  alternative: хотя согрешил именно ты
  rationale: Латинское si буквально сохраняет условную форму, хотя контекст допускает уступительное прочтение. Основной текст не должен без необходимости устранять эту смысловую напряжённость или превращать условие в утверждение.
- issue: Соучастие потомков в падении Адама
  choice: падение твоё стало не только твоим, но и нашим
  alternative: последствия твоего падения постигли не только тебя, но и нас
  rationale: Более буквальная формулировка сохраняет сильное и намеренно напряжённое утверждение источника о том, что падение является также «нашим», не заменяя его толкованием только о последствиях.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией. Инверсия «согрешил ты» сохраняет эмфазу латинского tu; тире делает пояснительное qui ex te advenimus ясным без тяжеловесности.
