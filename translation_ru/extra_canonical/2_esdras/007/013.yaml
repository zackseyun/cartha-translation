base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: ru
  text: Ибо входы в больший век[a] широки и безопасны и приносят плод бессмертия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В других древних версиях: «в грядущий век».'
    reason: textual_variant
lexical_decisions:
- source_word: nam
  choice: ибо
  rationale: Передаёт пояснительно-причинную связь с предыдущей мыслью, а не противопоставление.
- source_word: maioris saeculi
  choice: в больший век
  rationale: Следует латинскому maioris («больший, более великий»), при этом конструкция с «в» естественно обозначает вход в этот век.
- source_word: introitus
  choice: входы
  rationale: Сохраняет множественное число и прямое пространственное значение латинского слова.
- source_word: spatiosi et securi
  choice: просторны и безопасны
  rationale: Прямо и естественно передаёт широту и отсутствие опасности.
- source_word: facientes inmortalitatis fructum
  choice: приносят плод бессмертия
  rationale: Русское «приносят плод» естественно передаёт facientes fructum без ослабления образа и сохраняет родительный оборот «бессмертия».
theological_decisions:
- issue: Наименование противопоставленного нынешнему эсхатологического века
  choice: больший век
  alternative: грядущий век
  rationale: Основной текст следует указанному латинскому чтению maioris. Вариант «грядущий» существенен для апокалиптического контраста и засвидетельствован другими древними версиями, поэтому отмечен в сноске, но не подменяет данное латинское чтение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом; образ входов и плода сохранён.
