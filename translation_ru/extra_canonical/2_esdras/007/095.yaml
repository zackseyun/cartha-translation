revisions:
- from: 'Четвёртый порядок: они постигают покой, в котором[a], собранные ныне в своих хранилищах, будут покоиться в глубоком безмолвии, хранимые ангелами, и славу, которая ожидает их в последние времена.'
  to: 'Четвёртый разряд: они постигают покой, в котором, собранные ныне в хранилищах, будут покоиться в глубоком безмолвии, хранимые ангелами, и славу, которая остаётся для них в последние времена[a].'
  rationale: 'Исправлены расположение якоря текстологической сноски и два небольших отклонения от латинского текста: удалено невыраженное «своих», а manentem передано как «остаётся для них». «Четвёртый разряд» делает обозначение последовательной группы естественным для современного русского языка без изменения смысла.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:33:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод верно передаёт латинскую конструкцию: четвёртый разряд понимает покой, в котором, уже собранные в хранилищах, они будут пребывать в великом безмолвии под охраной ангелов. Будущее «будут покоиться» точно отражает requiescent. Однако притяжательное «своих» отсутствует в оригинале, а «ожидает их» несколько слабее передаёт manentem («остающуюся/пребывающую для них»).'
  naturalness: Русская фраза литературна и ясна. «Четвёртый разряд» естественнее, чем калькированный «Четвёртый порядок», при этом сохраняет смысл ordo как последовательного разряда. Образ «хранилищ» намеренно необычен, но оправдан исходным promptuaria.
  terminology: «Покой», «хранилища», «ангелы» и «последние времена» уместны и не вносят конфессиональных уточнений. Текстологическую оговорку следует привязать к спорной заключительной фразе о славе, а не к слову «котором».
  issues:
  - severity: medium
    issue: Сноска поставлена после «в котором», хотя сообщает о текстуальной неопределённости фразы о будущей славе.
    rationale: Якорь должен находиться у заключительного оборота «славу, которая остаётся для них в последние времена», к которому относится повреждённое место латинского текста.
  - severity: low
    issue: Добавлено «своих хранилищах».
    rationale: Латинское in promptuariis не содержит притяжательного местоимения; добавление необязательно и слегка конкретизирует образ.
  - severity: low
    issue: «Слава, которая ожидает их» не вполне передаёт manentem.
    rationale: Manentem означает пребывающую/остающуюся; нейтральное «которая остаётся для них» ближе к тексту и сохраняет осторожность при текстологической неопределённости.
