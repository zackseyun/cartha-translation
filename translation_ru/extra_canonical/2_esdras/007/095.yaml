  text: uerunt quae per fidem data est lex. Quartus ordo, intellegentes requiem quam nunc in promptuariis congregati requiescent cum silentio multo ab angelis conseruati, †atque in nouissimis eorum manentem gloriam.† Quintus ordo, exultantes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: ru
  text: 'Четвёртый разряд: они постигают покой, в котором, собранные ныне в хранилищах, будут покоиться в глубоком безмолвии, хранимые ангелами, и славу, которая остаётся для них в последние времена[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинский текст фразы о славе, остающейся для праведных в последние времена, не вполне надёжен; однако общий смысл — нынешний покой под охраной и будущая слава — остаётся ясным.
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: Четвёртый порядок
  rationale: Сохраняет формальную структуру перечисления и значение ordo как ступени или разряда в последовательности.
- source_word: intellegentes
  choice: они постигают
  rationale: Передаёт действительное осознание и понимание, а не простое получение сведений.
- source_word: requiem
  choice: покой
  rationale: Естественный и богословски нейтральный эквивалент латинского requies.
- source_word: in promptuariis congregati
  choice: собранные ныне в своих хранилищах
  rationale: Формально сохраняет образ promptuaria как мест хранения, не заменяя его интерпретацией вроде «обителей».
- source_word: cum silentio multo
  choice: в глубоком безмолвии
  rationale: Естественно передаёт усиленное multo и торжественный характер silentium.
- source_word: ab angelis conseruati
  choice: хранимые ангелами
  rationale: Сохраняет пассивное значение защиты и попечения со стороны ангелов.
- source_word: manentem gloriam
  choice: славу, которая ожидает их
  rationale: В данном контексте передаёт сохраняющуюся для них будущую славу естественным русским выражением, не утверждая сверх того, что позволяет повреждённый текст.
- source_word: in nouissimis
  choice: в последние времена
  rationale: Передаёт эсхатологический временной смысл выражения, согласующийся с контрастом нынешнего покоя и будущей славы.
theological_decisions:
- issue: Промежуточный покой праведных и последующая слава
  choice: Сохранён контраст между нынешним пребыванием под охраной ангелов и славой последних времён.
  alternative: Слить покой и славу в одно состояние или уточнить их как конкретную конфессиональную доктрину о загробной жизни.
  rationale: Латинский текст различает нынешнее собранное состояние и славу in nouissimis; перевод сохраняет это различие без догматической конкретизации.
- issue: Образ promptuaria
  choice: хранилища
  alternative: обители; чертоги; сокровищницы душ
  rationale: Буквальный образ необычен, но его богословская референция не вполне определена; интерпретирующие замены сняли бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис по возможности следует латинской последовательности, но остаётся понятным обычному читателю; необычный образ «хранилищ» намеренно сохранён.
