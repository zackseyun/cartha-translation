source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: ru
  text: И дело последует, и воздаяние будет явлено; праведные дела будут бодрствовать, а неправедные дела не уснут.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: дело
  rationale: Единственное число сохранено; в контексте суда это совершённое человеком дело, которое следует за ним как свидетельство.
- source_word: subsequetur
  choice: последует за человеком
  rationale: Глагол означает «последует». Дополнение «за человеком» естественно передаёт подразумеваемый объект и делает образ понятным по-русски, не устраняя судебной образности.
- source_word: merces
  choice: воздаяние
  rationale: Слово может обозначать плату, награду или возмездие. «Воздаяние» сохраняет нейтральность относительно благоприятного или неблагоприятного исхода суда.
- source_word: ostendetur
  choice: будет явлено
  rationale: Пассивная форма и значение раскрытия или обнародования сохранены в возвышенном, но современно понятном выражении.
- source_word: iustitiae
  choice: праведные дела
  rationale: Абстрактное множественное число буквально относится к «праведностям»; по-русски естественнее конкретизировать как проявления праведности — «праведные дела».
- source_word: vigilabunt
  choice: будут бодрствовать
  rationale: Передаёт буквальный образ бдения и сохраняет олицетворение деяний, не ослабляя его до простого «станут явными».
- source_word: iniustitiae non dormibunt
  choice: неправедные дела не уснут
  rationale: Сохранены параллелизм, отрицание и олицетворённый образ сна; «неправедные дела» естественно передаёт множественное iniustitiae.
theological_decisions:
- issue: Характер merces на последнем суде
  choice: воздаяние
  alternative: награда
  rationale: «Награда» могла бы необоснованно сузить смысл до благоприятного исхода, тогда как контекст включает и праведные, и неправедные дела.
- issue: Олицетворение праведных и неправедных деяний
  choice: сохранить образы бодрствования и сна
  alternative: 'передать истолковательно: «будут свидетельствовать / не будут забыты»'
  rationale: Латинский текст намеренно олицетворяет деяния; перевод сохраняет богословское напряжение образа, не объясняя сверх сказанного.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной библейской возвышенностью. Симметричный параллелизм второй части сохранён; архаизмы и конфессионально окрашенная терминология не использованы.
