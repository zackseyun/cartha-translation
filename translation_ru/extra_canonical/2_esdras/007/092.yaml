  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: ru
  text: 'Ибо они будут покоиться в семи состояниях. Первое состояние: они с великим трудом боролись, чтобы одолеть злой помысел, сформированный вместе с ними, чтобы он не увлёк их от жизни к смерти.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается на словах ut non eas («чтобы не их…»). Окончание «чтобы он не увлёк их от жизни к смерти» передано по засвидетельствованному продолжению текста, отражённому в сверочном английском переводе.
    reason: 'Текстологическая прозрачность: отмечает, что окончание отсутствует в предоставленном латинском фрагменте и восстановлено по продолжению текстовой традиции.'
lexical_decisions:
- source_word: requiescent
  choice: будут покоиться
  rationale: Передаёт будущее время и основное значение латинского requiescere — покоиться, обрести покой.
- source_word: per septem ordines
  choice: проходя семь ступеней
  rationale: Ordo здесь обозначает последовательные состояния или степени; «ступени» естественно передаёт упорядоченное восхождение, а «проходя» выражает значение per без тяжеловесного буквализма.
- source_word: cum labore multo certati sunt
  choice: с великим трудом боролись
  rationale: Сохраняет одновременно напряжённость certari и цену усилий, выраженную cum labore multo.
- source_word: uincerent
  choice: одолеть
  rationale: Передаёт победу над сопротивляющейся силой и хорошо сочетается с образом борьбы.
- source_word: cum eis plasmatum cogitamentum malum
  choice: злой помысел, возникший вместе с ними
  rationale: 'Сохраняет необычную формулировку источника: помысел был «сформирован» вместе с ними. «Возникший» звучит естественно по-русски и не уточняет сверх текста, кем или каким образом он был создан.'
- source_word: ut non eas … a uita in mortem
  choice: и не позволить ему увлечь их от жизни к смерти
  rationale: Целевая конструкция передана естественно; женское eas относится к душам. Формулировка сохраняет направление перехода от жизни к смерти.
theological_decisions:
- issue: Происхождение злого помысла
  choice: «возникший вместе с ними»
  alternative: «созданный вместе с ними» / «вложенный в них»
  rationale: Латинское plasmatum буквально связано с формированием, однако текст не поясняет ни деятеля, ни точного отношения помысла к человеку. Выбранный вариант не приписывает Богу прямого вложения зла и не устраняет связь помысла с изначальным состоянием людей.
- issue: Образ семи ordines
  choice: «семь ступеней»
  alternative: «семь разрядов» / «семь порядков»
  rationale: В контексте посмертного покоя речь идёт о последовательных степенях или состояниях, а не о социальных категориях; «ступени» сохраняют образ порядка и последовательности.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя; сохранены повтор «ступень» и напряжённый образ внутренней борьбы.
