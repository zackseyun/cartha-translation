  text: First[a], they see with great joy the glory of him who receives them.
translation:
  language: ru
  text: Прежде всего[a] они с великой радостью видят славу Того, кто принимает их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прежде всего они с великой радостью видят славу Того, кто принимает их, ибо они будут покоиться в семи чинах». Эта заключительная фраза в предоставленной латинской сегментации относится к следующему стиху.'
    reason: Сохраняет редакционный маркер и английский аудит-след прежней разбивки, одновременно ясно указывает, что по предоставленному латинскому тексту фраза относится к стиху 92.
lexical_decisions:
- source_word: Imprimis
  choice: Прежде всего
  rationale: Передаёт вводное указание на первый из последующих пунктов, не добавляя отсутствующего в данном стихе материала.
- source_word: uident
  choice: видят
  rationale: Прямое соответствие латинскому глаголу настоящего времени.
- source_word: cum exultatione multa
  choice: с великой радостью
  rationale: Естественно по-русски передаёт сильное ликование; буквальное «с великим ликованием» возможно, но звучит менее обыденно.
- source_word: gloriam eius
  choice: славу Того
  rationale: Сохраняет родительный оборот и личную отсылку; прописная буква обозначает подразумеваемого Бога, не заменяя местоимение именованием.
- source_word: qui suscipit eas
  choice: кто принимает их
  rationale: Suscipit означает принятие/встречу; женское eas относится к душам из контекста. Настоящее время сохранено.
theological_decisions:
- issue: Кто обозначен местоимением eius и относительным qui
  choice: Того, кто принимает их
  alternative: того, кто принимает их
  rationale: Контекст указывает на Бога; прописная буква соответствует русской библейской издательской традиции, при этом перевод не вводит отсутствующего в латинском тексте имени или титула.
- issue: Границы стиха
  choice: Не включать фразу о покое в семи порядках
  alternative: 'Добавить: «ибо они будут покоиться в семи порядках»'
  rationale: В предоставленном латинском источнике эта фраза отсутствует и по источниковой сегментации относится к стиху 92.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Порядок слов слегка адаптирован для естественности; временная форма и смысловая незавершённость вводного «Прежде всего» сохранены.
