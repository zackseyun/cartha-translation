  yaml_path: translation/extra_canonical/2_esdras/007/075.yaml
  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: ru
  text: 'Пред Тобою, Господи, покажи, Господи, рабу Твоему: будем ли мы после смерти — или теперь, когда каждый из нас отдаёт свою душу, — если будем сохранены, сохранены в покое до тех пор, пока…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  choice: Пред Тобой
  rationale: Формально передаёт латинское выражение присутствия перед Господом; прописная буква поддерживает молитвенное обращение.
- source_word: demonstra
  choice: покажи
  rationale: Прямое и естественное соответствие повелительной форме.
- source_word: quando reddimus unusquisque animam suam
  choice: когда каждый из нас отдаёт свою душу
  rationale: Сохраняет образ возвращения/отдания души и распределительное значение unusquisque.
- source_word: conseruati conseruabimur
  choice: если мы будем сохранены, то будем ли мы сохранены
  rationale: Сохраняет необычную условно-вопросительную конструкцию данного латинского текста, не превращая её без достаточного основания в уверительное «непременно».
- source_word: in requie
  choice: в покое
  rationale: Передаёт requies как состояние посмертного покоя без добавления конфессиональной интерпретации.
- source_word: donec
  choice: до тех пор, пока…
  rationale: Сохраняет незавершённость предоставленного фрагмента и показывает, что продолжение условия отсутствует.
theological_decisions:
- issue: Характер посмертного состояния
  choice: «сохранены в покое»
  alternative: «непременно пребудем в покое»
  rationale: Выбранная формулировка сохраняет вопрос и условность латинского фрагмента, не утверждая заранее определённую схему промежуточного состояния.
- issue: Связь uel nunc с post mortem
  choice: «после смерти, то есть теперь, когда…»
  alternative: «после смерти или теперь, когда…»
  rationale: 'В контексте nunc может вводить уточнение предмета вопроса («а именно: когда…»). Русское буквальное «или теперь» создало бы впечатление противопоставления смерти нынешнему моменту, хотя последующая придаточная часть описывает сам момент отдания души.'
translation_notes:
  register: Современный литературный русский с молитвенно-библейской торжественностью. Сохранены повтор обращения «Господи», синтаксическая напряжённость вопроса и обрыв фрагмента на donec; архаизмы сведены к уместному молитвенному «Пред Тобой».
