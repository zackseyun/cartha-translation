  source_fidelity: В черновике союз vel («или») заменён пояснительным «то есть», что меняет прямо выраженную в латинском тексте альтернативу post mortem uel nunc. Следует сохранить «или», даже если сочетание «после смерти или теперь» в данном обрывке выглядит синтаксически трудным. Повтор conservāti conservābimur передан с сохранением условности и повтором корня; это уместнее, чем устранять его посредством уверительного толкования.
  naturalness: Исправленный вариант остаётся современным литературным русским, но намеренно сохраняет незавершённый, напряжённый синтаксис источникового фрагмента. Тире выделяют вставленное обстоятельство «или теперь, когда…» и делают фразу читаемой, не подменяя её смысл.
  terminology: «Господи», «рабу Твоему», «душу», «сохранены» и «в покое» точны по регистру и не навязывают конфессионального истолкования посмертного состояния. Повтор «Господи» сохранён, как в источнике.
