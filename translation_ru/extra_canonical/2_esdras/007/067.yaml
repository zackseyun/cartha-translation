  text: nec enim sciunt cruciamenta nec salutem post mortem repromissam sibi. Nobis autem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/067.yaml
  text: for they do not know torments[a], nor the salvation promised to them after death. But as for us,
translation:
  language: ru
  text: ведь они не знают ни мучений[a], ни спасения, обещанного им после смерти. А мы…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежнем варианте: «Но какая нам польза от того, что мы останемся в живых, если будем терзаемы мучением?» Эти слова относятся к началу следующего стиха.'
    reason: previous_rendering
lexical_decisions:
- source_word: cruciamenta
  choice: мучений
  rationale: Передаёт физические или посмертные страдания без излишнего уточнения их характера.
- source_word: salutem
  choice: спасения
  rationale: Прямой и контекстуально уместный эквивалент латинского salutem.
- source_word: repromissam sibi
  choice: обещанного им
  rationale: Сохраняет значение данного им обещания; усилительный оттенок re- в данном контексте отдельно не выражен.
- source_word: Nobis autem
  choice: А мы…
  rationale: Естественно передаёт незавершённый переход к противопоставлению, продолжающемуся в следующем стихе.
theological_decisions:
- issue: Соотношение мучений и спасения после смерти
  choice: Сохранено простое соединение двух неизвестных им реалий без пояснения их взаимосвязи.
  alternative: Истолковать мучения как противоположность обещанному спасению или конкретизировать их как вечные муки.
  rationale: Латинский текст лишь называет cruciamenta и salutem и не определяет здесь их длительность или точное отношение друг к другу.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка. Многоточие обозначает, что латинское «Nobis autem» представляет собой незавершённый переход к следующему стиху.
