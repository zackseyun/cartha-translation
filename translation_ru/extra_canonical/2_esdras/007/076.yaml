  text: let those times come[a], in which you will begin to renew the creation, or are we tormented from now on?” And he answered me and said, “I will show you this also; but as for you, do not mingle with them
translation:
  language: ru
  text: '«Наступят ли те времена[a], когда ты начнёшь обновлять творение, или же мы мучаемся отныне?» И он ответил мне и сказал: «Я покажу тебе и это; а ты не смешивайся с ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих начинается продолжением вопроса, начатого ранее.
    reason: Латинская граница стиха открывается формой veniant без вводной части; примечание предупреждает читателя о синтаксической связи с предшествующим контекстом, не перенося сюда текст следующего стиха.
lexical_decisions:
- source_word: ueniant tempora illa
  choice: Пусть наступят те времена
  rationale: Передаёт побудительно-желательное значение латинского конъюнктива veniant и сохраняет связь с продолжающимся вопросом.
- source_word: creaturam renouare
  choice: обновлять творение
  rationale: «Творение» естественно передаёт creatura в контексте всеобщего обновления, а несовершенный вид соответствует incipies — началу процесса.
- source_word: amodo
  choice: уже отныне
  rationale: Сохраняет временное значение «с этого момента, отныне»; «уже» естественно подчёркивает противопоставление будущим временам.
- source_word: tu autem
  choice: а ты
  rationale: Передаёт противопоставление и эмфатическое выделение местоимения tu.
- source_word: noli commisceri cum eis
  choice: не смешивайся с ними
  rationale: Сохраняет образное и несколько неоднозначное значение commisceri, не уточняя без основания характер общения или причисления к группе.
theological_decisions:
- issue: К кому относится местоимение во фразе «когда ты начнёшь обновлять творение»
  choice: Сохранено местоимение «ты» без поясняющего наименования адресата
  alternative: Уточнить адресата как Бога или ангела
  rationale: Данный латинский фрагмент не называет адресата непосредственно; уточнение могло бы преждевременно разрешить контекстуальную и богословскую неопределённость.
- issue: Смысл запрета commisceri cum eis
  choice: «не смешивайся с ними»
  alternative: «не причисляй себя к ним» или «не общайся с ними»
  rationale: Более узкие варианты добавляют конкретный смысл, которого сам латинский глагол в этом фрагменте однозначно не устанавливает.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены риторический вопрос, повтор «ответил… и сказал» и противопоставительное «а ты». Местоимения, обращённые к собеседнику, написаны со строчной буквы согласно современной издательской норме и во избежание навязывания идентификации адресата.
