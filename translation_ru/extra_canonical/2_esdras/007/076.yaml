  source_fidelity: 'Начальное «Пусть наступят» формально может передавать конъюнктив veniant как пожелание, однако в сочетании с последующим «или же мы мучаемся...» оно по-русски неопоснованно превращает первую часть вопроса в побуждение. В контексте продолжающегося вопроса безопаснее передать латинскую конструкцию вопросительным «Наступят ли те времена...». Остальные соответствия точны: creaturam renouare — «обновлять творение», amodo — «отныне», tu autem — «а ты», noli commisceri cum eis — «не смешивайся с ними».'
  naturalness: 'После замены начальной формы фраза будет естественным современным литературным русским: две альтернативы образуют единый риторический вопрос. Повтор «ответил мне и сказал» уместно сохраняет библейский регистр.'
  terminology: '«Творение» — удачная нейтральная передача creatura. Не следует уточнять, кто именно обозначен местоимением «ты», или конкретизировать значение commisceri как «причисляй себя» либо «общайся»: латинский текст этого не требует.'
