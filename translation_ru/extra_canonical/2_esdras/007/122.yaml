source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: ru
  text: И поскольку слава Всевышнего начнёт защищать тех, кто жил непорочно[a], а мы шли самыми дурными путями?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жил чистой жизнью».'
    reason: Поясняет, что caste conversati sunt обозначает широкую нравственную чистоту поведения, а не только половое целомудрие.
lexical_decisions:
- source_word: quoniam
  choice: поскольку
  rationale: Передаёт причинное значение латинского союза и сохраняет зависимый, продолжающий предшествующее рассуждение характер вопроса.
- source_word: gloria Altissimi
  choice: слава Всевышнего
  rationale: Прямое и естественное соответствие латинскому выражению без устранения образа славы как действующей и защищающей силы.
- source_word: protegere
  choice: защищать
  rationale: 'Точно передаёт основное значение глагола: оберегать и предоставлять защиту.'
- source_word: caste conversati sunt
  choice: жил непорочно
  rationale: Передаёт общую нравственную чистоту поведения, не сужая caste до полового воздержания; по-русски звучит естественно и достойно.
- source_word: pessimis viis ambulavimus
  choice: мы ходили самыми злыми путями
  rationale: Сохраняет библейскую метафору хождения путями и превосходную степень pessimis.
theological_decisions:
- issue: Слава Всевышнего как субъект защиты
  choice: 'сохранить буквальный образ: «слава Всевышнего начнёт защищать»'
  alternative: «Всевышний в Своей славе начнёт защищать»
  rationale: Латинский текст прямо называет gloria субъектом глагола; перефразирование необоснованно снимало бы возможную богословскую и образную напряжённость.
- issue: Значение нравственной чистоты
  choice: «жил непорочно»
  alternative: «жил целомудренно»
  rationale: Контраст со «злыми путями» указывает на широкую нравственную чистоту, а не исключительно на половую целомудренность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и библейской метафоры «ходить путями». Начальное «И поскольку» и вопросительный знак сохранены, поскольку стих является частью продолжающейся серии риторических вопросов.
