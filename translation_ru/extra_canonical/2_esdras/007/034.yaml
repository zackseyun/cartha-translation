  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/034.yaml
  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: ru
  text: Но останется лишь суд; истина устоит, и вера укрепится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: суд
  rationale: Прямое соответствие латинскому слову, сохраняющее эсхатологический контекст без добавочного толкования.
- source_word: solum remanebit
  choice: останется лишь
  rationale: Естественно по-русски передаёт ограничительное solum и будущее значение remanebit.
- source_word: veritas stabit
  choice: истина устоит
  rationale: Глагол «устоит» сохраняет образ стойкости и утверждённости, выраженный stabit.
- source_word: fides convalescet
  choice: вера укрепится
  rationale: Convalescet означает обретение или возрастание силы; «укрепится» передаёт это естественно и без уточнения неоднозначного fides.
theological_decisions:
- issue: Значение fides
  choice: вера
  alternative: верность
  rationale: Латинское fides допускает оба оттенка. «Вера» наиболее прямолинейна в данном ряду абстрактных понятий и не устраняет возможную богословскую многозначность.
- issue: Характер суда
  choice: суд
  alternative: приговор
  rationale: Iudicium может обозначать и судебное разбирательство, и решение суда; общее слово «суд» сохраняет широту исходного значения.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная фраза с сохранением параллельной структуры латинского текста.
