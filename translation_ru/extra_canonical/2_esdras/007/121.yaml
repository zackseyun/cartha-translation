source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam reposita sunt habitacula sanitatis et securitatis, nos vero male conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: ru
  text: И поскольку уготованы обители здоровья и безопасности, а мы жили дурно?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  choice: уготованы
  rationale: Передаёт смысл того, что обители приготовлены и сохранены для будущего, естественно для возвышенного контекста.
- source_word: habitacula
  choice: обители
  rationale: Сохраняет образ мест пребывания и соответствует достоинству апокалиптической речи, не будучи чрезмерно архаичным.
- source_word: sanitatis et securitatis
  choice: здравия и безопасности
  rationale: «Здравие» передаёт sanitas шире, чем только физическое здоровье, а «безопасность» прямо соответствует securitas.
- source_word: male conversati sumus
  choice: мы вели себя нечестиво
  rationale: Передаёт нравственно отрицательный образ жизни и поведения; «нечестиво» уместно в религиозном контексте и не сводит выражение к отдельным злым поступкам.
theological_decisions:
- issue: Характер приготовленных обителей
  choice: Не уточнять, являются ли они небесными, эсхатологическими или метафорическими
  alternative: «небесные обители» или «вечные жилища»
  rationale: Латинский текст говорит лишь об «обителях здравия и безопасности»; добавочное уточнение сняло бы сохраняемую источником неопределённость.
- issue: Связь между уготованными благами и человеческим поведением
  choice: Сохранить вопросительную форму с противопоставлением «а»
  alternative: Оформить как утверждение или причинно-следственный вывод
  rationale: Источник формулирует риторический вопрос и оставляет напряжение между приготовленным благом и нечестивым поведением людей без явного догматического разрешения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Обители» и «здравие» поддерживают достоинство стиля, а синтаксис остаётся ясным для современного читателя.
