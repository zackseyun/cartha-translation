source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: ru
  text: '«Посмотрите и сюда, и туда: здесь — радость и покой, а там — огонь и мучения». Вот что ты скажешь им в день суда.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот что ты будешь говорить, обращаясь к ним в день суда». Латинский текст употребляет второе лицо; возможен также перевод настоящим временем: «говоришь».'
    reason: Поясняет расхождение с возможной передачей в третьем лице и сохраняет временную неоднозначность формы loqueris.
lexical_decisions:
- source_word: Uidete contra et in contra
  choice: «Посмотрите и сюда, и туда»
  rationale: Передаёт призыв сопоставить две противоположные стороны естественным современным русским языком, сохраняя пространственный контраст, раскрытый далее словами «здесь» и «там».
- source_word: iocunditas et requies
  choice: «радость и покой»
  rationale: «Радость» естественно передаёт iocunditas в данном противопоставлении страданиям, а «покой» точно соответствует requies.
- source_word: ignis et tormenta
  choice: «огонь и мучения»
  rationale: Сохраняет буквальный эсхатологический образ и множественное значение tormenta без смягчения.
- source_word: haec autem loqueris dicens ad eos
  choice: «Вот что ты скажешь им»
  rationale: Форма loqueris допускает настоящее или будущее значение, но в судебном контексте естественно читается как будущее второго лица; dicens ad eos передано без тяжеловесного повтора «говоря им».
theological_decisions:
- issue: Лицо говорящего в заключительной фразе
  choice: «ты скажешь»
  alternative: «он скажет»
  rationale: Латинское loqueris — форма второго лица единственного числа. Поэтому основной текст следует непосредственному языковому свидетельству, хотя консультационный английский текст использует третье лицо.
- issue: Характер посмертного противопоставления
  choice: Сохранены «радость и покой» в противопоставлении «огню и мучениям»
  alternative: Истолковать эти образы как строго буквальные либо исключительно метафорические
  rationale: Перевод сохраняет образность и богословское напряжение исходного текста, не навязывая конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебно-эсхатологической интонацией. Прямая речь выделена кавычками; тире подчёркивают контраст между двумя участями.
