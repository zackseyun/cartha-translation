source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: ru
  text: Итак, тогда никто не сможет смиловаться над тем, кто проиграл дело в суде[a], или низвергнуть того, кто выиграл дело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потерпел поражение в суде».'
    reason: Передаёт более буквальное значение латинского victus и сохраняет судебную противопоставленность victus / vicerit («потерпел поражение / победил»).
lexical_decisions:
- source_word: misereri
  choice: помиловать
  rationale: Передаёт проявление милости к проигравшему суд; в данном контексте естественнее и точнее, чем буквальное «сжалиться».
- source_word: in iudicio victus fuerit
  choice: проиграл на суде
  rationale: 'Victus в сочетании с in iudicio имеет судебный смысл: потерпеть поражение, проиграть дело; перевод сохраняет этот контекст, не подменяя выражение словом «осуждён».'
- source_word: demergere
  choice: низвергнуть
  rationale: Сохраняет сильный образ низведения или низложения победившего, не сводя его к судебному термину, которого в латинском тексте нет.
- source_word: qui vicerit
  choice: кто выиграл дело
  rationale: В паре с victus и в явном судебном контексте vicerit означает выигрыш тяжбы; добавление «дело» делает смысл естественным по-русски и избегает военного оттенка.
theological_decisions:
- issue: Необратимость исхода суда
  choice: 'Сохранена симметрия: проигравшего никто не сможет помиловать, а выигравшего — низвергнуть.'
  alternative: Истолковать проигравшего как уже осуждённого, а выигравшего как оправданного.
  rationale: Латинский текст говорит о проигрыше и выигрыше в суде, но прямо не употребляет терминов «осуждение» и «оправдание»; перевод не должен усиливать богословскую конкретизацию.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Судебная направленность исходного выражения передана естественными оборотами «проиграл на суде» и «выиграл дело»; торжественный оттенок сохранён словами «помиловать» и «низвергнуть».
