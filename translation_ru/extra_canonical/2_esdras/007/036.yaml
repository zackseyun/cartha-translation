base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: ru
  text: И явится озеро мучений[a], а напротив него будет место покоя; и будет показана[b] печь геенны, а напротив неё — рай наслаждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стихи 7:36–105 составляют так называемый «утраченный фрагмент» Бенсли. Он отсутствует в большинстве средневековых латинских рукописей, а потому не вошёл в Вульгату и издание Библии короля Якова 1611 года: там за 7:35 непосредственно следовал текст, который в старых изданиях нумеровался как 7:36 примерно семьюдесятью стихами далее. Роберт Бенсли обнаружил этот фрагмент в испанской рукописи в 1875 году; теперь он восстановлен в современных критических изданиях. Его выпадение, вероятно, было связано с тем, что далее говорится об отказе в ходатайстве за осуждённых, что вызывало затруднения в позднейшем христианском благочестии.'
    reason: recovered_fragment
  - marker: b
    text: 'Возможный перевод начала стиха: «Тогда явится озеро мучений». Однако латинское Et буквально означает «и» и продолжает повторяющуюся последовательность союзов.'
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  choice: озеро мучений
  rationale: Передаёт латинское lacus непосредственно как «озеро», не заменяя его толковательным «яма»; родительный tormenti сохранён естественным русским сочетанием.
- source_word: locus requietionis
  choice: место покоя
  rationale: Буквальная и естественная передача, сохраняющая противопоставление месту мучений.
- source_word: clibanus (gehennae)
  choice: печь геенны
  rationale: Clibanus означает печь или горнило; «печь» понятно современному читателю и сохраняет образ источника. Указание на геенну следует засвидетельствованному продолжению стиха, отражённому в консультационном тексте.
- source_word: paradisus iucunditatis
  choice: рай наслаждения
  rationale: Сохраняет образ рая и значение удовольствия, отрады или блаженного наслаждения без добавления конфессионального толкования.
- source_word: contra illum / contra eum
  choice: напротив него / напротив неё
  rationale: Сохраняет пространственное и риторическое противопоставление двух участей; местоимения согласованы с русским родом существительных.
theological_decisions:
- issue: Характер посмертного противопоставления
  choice: Сохранить конкретные образы «озера мучений», «места покоя», «печи геенны» и «рая наслаждения»
  alternative: Обобщить как «наказание» и «награда»
  rationale: Источник рисует зримое противопоставление мест и образов; обобщение устранило бы его эсхатологическое напряжение.
- issue: Начальная связь Et
  choice: «И явится»
  alternative: «Тогда явится»
  rationale: Латинское Et буквально продолжает цепь сочинительных конструкций; «и» сохраняет её ритм и не вводит дополнительного временного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической прозы. Повтор союза «и» сохраняет ритм исходного текста; параллельные обороты «а напротив» ясно передают композиционное противопоставление. Маркеры [a] и [b] помещены непосредственно в основном тексте.
