id: 2ES.7.14
reference: 2 Esdras 7:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: ru
  text: Итак, если живущие не войдут в эти тесные и тщетные обстоятельства[a], они не смогут получить то, что отложено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в эти тесные и тщетные [вещи]». Существительное в латинском тексте не названо; «обстоятельства» добавлено для естественности русского выражения.'
    reason: Латинские angusta et vana употреблены субстантивированно; примечание отмечает добавленное в русском существительное и сохраняет неоднозначность исходного текста.
lexical_decisions:
- source_word: ingredientes ingressi fuerint
  choice: пройдут через
  rationale: Удвоенная латинская конструкция буквально связана со «вхождением», однако по-русски естественнее передать прохождение через названные далее тяготы; условное значение и направленность действия сохранены без искусственного удвоения глагола.
- source_word: qui vivunt
  choice: живущие
  rationale: Сохраняет обобщённое обозначение всех ныне живущих, не сужая его до какой-либо отдельной группы.
- source_word: angusta et vana haec
  choice: эти тесные и тщетные испытания
  rationale: Латинские прилагательные употреблены субстантивированно и не называют существительное. «Испытания» естественно связывает фразу с образом трудного пути в ближайшем контексте, а «тесные и тщетные» сохраняет обе характеристики.
- source_word: quae sunt reposita
  choice: то, что сохранено для них
  rationale: Передаёт смысл заранее отложенного или сбережённого блага; местоимение «для них» проясняет подразумеваемого получателя, не уточняя природу награды.
theological_decisions:
- issue: Связь получения сохранённого блага с прохождением земных тягот
  choice: 'Сохранено прямое условное высказывание: «если… не пройдут… не смогут получить».'
  alternative: Смягчить условие как призыв стараться или истолковать его как указание на конкретное средство спасения.
  rationale: Латинский текст формулирует отрицательное условие, но не объясняет здесь ни механизма, ни богословского основания получения; перевод не должен добавлять такое объяснение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сделан ясным для обычного читателя; образ пути сохранён, а неестественное латинское удвоение глагола не воспроизведено буквально.
