    rationale: Ingredientes ingressi fuerint построено от ingredi и буквально обозначает вхождение; русское «пройдут через» сдвигает образ от вхождения к преодолению.
  - severity: medium
    issue: Необоснованное уточнение «испытания»
    rationale: В angusta et vana haec существительное не названо. Контекст может предполагать тяготы, но перевод не должен превращать эту возможность в единственно заданное значение основного текста.
  - severity: low
