  source_fidelity: В черновике верно сохранены отрицательное условие и общая направленность образа, но «пройдут через» заменяет прямо выраженное ingredi («войти»), а «испытания» слишком определённо восполняет отсутствующее в латинском существительное. «Для них» в последней части также прямо не сказано. Субстантивированные angusta et vana следует передать с сохранением их намеренной недоговорённости, насколько это возможно по-русски.
  naturalness: Предлагаемая формулировка остаётся современной литературной и ясной. Слово «обстоятельства» позволяет естественно построить русскую фразу, но в примечании честно отмечается, что оно добавлено переводчиком и не задано латинским текстом.
  terminology: «Живущие» уместно передаёт qui vivunt. «Тесные и тщетные» сохраняет лексический состав angusta et vana; «отложено» передаёт reposita без добавления характера или адресата уготованного блага.
