source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: ru
  text: И не буду скорбеть о множестве погибших, ведь именно они были уподоблены пару и пламени, сопоставлены с дымом и разгорелись.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вспыхнули» или «запылали». Латинский глагол может обозначать как вспыхивание, так и сильное горение.'
    reason: Сохраняет лексическую неоднозначность exarserunt, не вводя невыраженный результат полного сгорания.
lexical_decisions:
- source_word: contristabor
  choice: буду скорбеть
  rationale: Будущее время и значение печали переданы естественным литературным русским глаголом.
- source_word: multitudinem eorum qui perierunt
  choice: множестве погибших
  rationale: Сохраняется собирательное значение multitudo и завершённость латинского perfectum perierunt.
- source_word: ipsi enim sunt qui
  choice: ведь именно они
  rationale: Частицы «ведь именно» передают пояснительное enim и эмфатическое ipsi, не утяжеляя русскую фразу буквальным «они суть те, которые».
- source_word: uapori assimilati sunt et flammae
  choice: были уподоблены пару и пламени
  rationale: Сохраняются страдательная конструкция и синтаксическое соединение «пара» и «пламени» при assimilati sunt.
- source_word: fumo adaequati sunt
  choice: приравнены к дыму
  rationale: Отдельная конструкция с fumo передана отдельно от пары «пару и пламени»; «приравнены» отражает adaequati.
- source_word: exarserunt
  choice: сгорели
  rationale: Передаёт огненный образ и завершённое действие perfectum; возможный менее результативный оттенок отмечен в сноске.
theological_decisions:
- issue: Кто является субъектом образных уподоблений
  choice: Сохранено эмфатическое «именно они»
  alternative: Опустить усиление и сказать лишь «они подобны»
  rationale: Формула ipsi enim sunt qui подчёркивает, что речь идёт именно о множестве погибших; её не следует сглаживать.
- issue: Характер гибели в заключительном глаголе
  choice: «сгорели»
  alternative: «вспыхнули» или «разгорелись»
  rationale: Основной текст следует контексту гибели и консультационному английскому «have burned up», но семантическая широта exarserunt сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для широкого читателя, при этом сохранены эмфаза ipsi, последовательность метафор и различие между двумя латинскими конструкциями уподобления. Начальное «nominatum est» расценено как окончание предшествующего сегмента и в текст стиха 7:61 не включено, что соответствует границе стиха в консультационном слое.
