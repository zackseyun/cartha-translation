revisions:
- from: И не буду скорбеть о множестве погибших, ведь именно они были уподоблены пару и пламени, приравнены к дыму и сгорели.[a]
  to: И не буду скорбеть о множестве погибших, ведь именно они были уподоблены пару и пламени, сопоставлены с дымом и разгорелись.[a]
  rationale: Исправлен заключительный глагол, чтобы не приписывать exarserunt значение полного сгорания. Стилистически уточнена передача adaequati sunt, при этом сохранены порядок образов, их синтаксическое распределение и эмфатическое «именно они».
