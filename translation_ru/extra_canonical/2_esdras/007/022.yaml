  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: ru
  text: Но они не убедились, воспротивились Ему и составили себе тщетные замыслы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non sunt persuasi
  choice: не убедились
  rationale: Прямо передаёт отсутствие убеждённости или принятия сказанного, не добавляя более узкого значения непослушания.
- source_word: contradixerunt ei
  choice: воспротивились Ему
  rationale: В данном контексте глагол выражает не просто словесное возражение, а сопротивление Тому, Кто дал повеление; «воспротивились» естественно передаёт эту силу по-русски.
- source_word: constituerunt sibi
  choice: создали себе
  rationale: Сохраняет образ сознательного формирования собственных мыслей и возвратное sibi.
- source_word: cogitamenta vanitatis
  choice: пустые помыслы
  rationale: Естественно передаёт качественный генитив vanitatis; «помыслы» соответствует возвышенному, но понятному библейскому регистру, а «пустые» сохраняет идею тщетности и ложности без чрезмерного истолкования.
theological_decisions:
- issue: Сила contradixerunt по отношению к Богу
  choice: воспротивились Ему
  alternative: возразили Ему
  rationale: «Возразили» могло бы свести смысл к словесному несогласию, тогда как контекст указывает на противление; при этом перевод не уточняет форму этого противления.
- issue: Значение vanitas
  choice: пустые
  alternative: тщетные / суетные
  rationale: «Пустые» сохраняет многозначность vanitas между бессодержательностью, ложностью и тщетностью; «суетные» в современном русском может ошибочно ассоциироваться лишь с житейской занятостью.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Местоимение «Ему» написано с прописной буквы как традиционное указание на Бога; синтаксис сохраняет трёхчастную последовательность латинского текста без тяжеловесной кальки.
