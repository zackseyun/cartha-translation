review_pass:
  verdict: revise
  source_fidelity: В черновике верно переданы χρονологическая последовательность, эсхатологическое saeculum как «век» и неопределённый субстантивированный средний род corruptum. Однако «подвержено тлению» означает скорее «тленно/подлежит тлению» (corruptible), тогда как corruptum в форме среднего рода указывает на уже повреждённое или подвергшееся тлению. Кроме того, excitabitur — пассивная форма; её можно передать по-русски без неестественности.
  naturalness: «И будет:» возможно, но «И будет так:» естественнее как ввод к последующему пророческому сообщению. Пассив «будет пробуждён» несколько торжественен, но соответствует библейскому регистру и латинской форме. «Всё, что подверглось тлению» литературно и сохраняет неопределённость референта.
  terminology: «Век» обоснованно сохраняет временно-эсхатологическую многозначность saeculum и не подменяет её «миром». Заключительное выражение не конкретизирует, что именно умрёт, и не привносит конфессионального толкования.
  issues:
  - severity: medium
    issue: corruptum передано как «то, что подвержено тлению».
    rationale: Эта формулировка выражает потенциальную тленность, тогда как латинское corruptum — субстантивированное «испорченное/повреждённое; подвергшееся тлению». Следует сохранить значение уже наличествующей порчи, не определяя референт.
  - severity: low
    issue: Пассивность excitabitur не выражена явно.
    rationale: «Пробудится» естественно, но является возвратно-непереходной формой. В данном кратком пророческом тексте «будет пробуждён» возможно и точнее отражает латинский пассив.
  revised_text: 'И будет так: через семь дней будет пробуждён век, который ещё не бодрствует, и умрёт всё, что подверглось тлению.'
