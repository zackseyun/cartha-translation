  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: ru
  text: 'И будет так: через семь дней будет пробуждён век, который ещё не бодрствует, и умрёт всё, что подверглось тлению.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post dies septem
  choice: через семь дней
  rationale: Естественно передаёт временное значение латинского оборота в данном контексте.
- source_word: excitabitur
  choice: пробудится
  rationale: Сохраняет образ пробуждения и страдательное по смыслу наступление нового состояния без тяжеловесного «будет пробуждён».
- source_word: qui nondum vigilat saeculum
  choice: век, который ещё не бодрствует
  rationale: Передаёт персонификацию saeculum и различие между vigilat («бодрствует») и excitabitur («пробудится»).
- source_word: corruptum
  choice: то, что подвержено тлению
  rationale: Средний род субстантивированного прилагательного оставляет референт неопределённым; «тление» естественно выражает порчу и распад, подразумеваемые corruptum.
theological_decisions:
- issue: Референт среднего рода corruptum
  choice: то, что подвержено тлению
  alternative: тленное / испорченное
  rationale: Источник не уточняет, идёт ли речь о мире, творении или иной реальности; нейтральная конструкция сохраняет эту неопределённость и не вводит толкование.
- issue: Значение saeculum
  choice: век
  alternative: мир
  rationale: «Век» сохраняет временно-эсхатологический диапазон латинского saeculum и не сужает его до пространственного понятия мира.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Синтаксис краткий и ясный; персонификация века и смысловая неопределённость заключительной части сохранены.
