source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: situm cruciamentum. Quinta uia, uidentes aliorum habitaculum ab angelis conseruari
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/085.yaml
  text: 'The fifth way: they see the dwelling place of the others guarded by angels[a]'
translation:
  language: ru
  text: 'Пятый путь: они видят обитель других, охраняемую ангелами.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «место обитания».'
    reason: Указывает более буквальный и нейтральный вариант передачи habitaculum, не меняя его единственного числа.
lexical_decisions:
- source_word: Quinta uia
  choice: Пятый путь
  rationale: Прямо передаёт порядковое обозначение очередного пути, сохраняя структуру латинского текста.
- source_word: aliorum
  choice: других
  rationale: Сохраняет намеренно неуточнённую отсылку латинского местоимения к другой группе.
- source_word: habitaculum
  choice: обитель
  rationale: Передаёт единственное число латинского существительного и уместно звучит в эсхатологическом контексте.
- source_word: ab angelis conseruari
  choice: охраняемую ангелами
  rationale: Естественно передаёт пассивную конструкцию и значение сохранения под ангельской защитой.
theological_decisions:
- issue: Кого обозначает aliorum
  choice: Не уточнять и перевести «других»
  alternative: «праведников»
  rationale: Латинский фрагмент не называет эту группу прямо; добавление «праведников» устранило бы сохраняющуюся в исходнике отсылочную неоднозначность.
- issue: Число habitaculum
  choice: 'Единственное число: «обитель»'
  alternative: 'Множественное число: «обители»'
  rationale: В предоставленном латинском тексте habitaculum стоит в единственном числе и может обозначать общую обитель другой группы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; краткая синтаксическая форма исходника сохранена. «Обитель» выбрана как естественное для эсхатологического контекста слово, а сноска даёт менее стилистически окрашенную альтернативу.
