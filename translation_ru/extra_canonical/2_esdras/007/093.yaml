  text: seducat a uita in mortem. Secundus ordo, quoniam uident complicationem, in qua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: ru
  text: Второй порядок — потому что они видят запутанность[a], в которой блуждают души нечестивых, и наказание, ожидающее их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хитросплетение»; возможен также смысл «замешательство».'
    reason: Латинское complicationem может обозначать сложное переплетение или запутанное положение; в данном контексте также возможно более отвлечённое значение замешательства.
lexical_decisions:
- source_word: Secundus ordo
  choice: Второй порядок
  rationale: Сохранена формальная структура перечисления и значение ordo как последовательного порядка или разряда, без преждевременного уточнения «ступень» либо «состояние».
- source_word: complicationem
  choice: хитросплетение
  rationale: Латинское complicatio обозначает сложное переплетение, запутанность; выбранное слово сохраняет образ среды, в которой можно блуждать, а не сводит смысл лишь к внутреннему недоумению.
- source_word: uagantur (по продолжению засвидетельствованного текста)
  choice: блуждают
  rationale: Передаёт пространственный образ беспорядочного движения внутри запутанного положения.
- source_word: poenam quae eos manet (по продолжению стиха)
  choice: наказание, ожидающее их
  rationale: Естественная современная формулировка, сохраняющая судебно-эсхатологический смысл наказания.
theological_decisions:
- issue: Характер участи душ нечестивых
  choice: Сохранены одновременно их нынешнее блуждание и ожидающее их наказание.
  alternative: Истолковать хитросплетение как само наказание или как исключительно душевное замешательство.
  rationale: Текст различает complicationem, в которой души блуждают, и наказание, которое их ожидает; перевод не объединяет эти два элемента.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. «Хитросплетение» удерживает образность латинского слова; неоднозначность отмечена в сноске.
