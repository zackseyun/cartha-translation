source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter eos enim feci saeculum, et quando transgressus est Adam constitutiones meas, iudicatum est quod factum est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: ru
  text: Ведь ради них Я сотворил мир[a], а когда Адам преступил Мои установления, сотворённое было подвергнуто суду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь ради них Я сотворил век».'
    reason: Saeculum может обозначать как мир, так и век или эпоху; в данном контексте основной текст выбирает «мир», но лексическая неоднозначность сохраняется в примечании.
lexical_decisions:
- source_word: propter eos
  choice: ради них
  rationale: 'Оборот при feci выражает цель или предназначение: мир сотворён ради тех, о ком говорится в контексте, а не просто вследствие их существования.'
- source_word: saeculum
  choice: мир
  rationale: Хотя saeculum может означать «век», здесь оно является объектом feci и соотносится с quod factum est, поэтому речь, вероятнее всего, о сотворённом мире.
- source_word: constitutiones meas
  choice: Мои установления
  rationale: «Установления» естественно передаёт предписания или постановления Бога, не сужая значение до одного вида закона.
- source_word: iudicatum est quod factum est
  choice: сотворённое было осуждено
  rationale: Сохранена пассивная конструкция и судебный оттенок iudicatum est; quod factum est передано субстантивированным «сотворённое».
theological_decisions:
- issue: Что подверглось суду после преступления Адама
  choice: сотворённое было осуждено
  alternative: было осуждено то, что произошло
  rationale: Латинское quod factum est допускает формальное понимание «то, что было сделано/произошло», однако связь с ранее употреблённым feci saeculum поддерживает отсылку ко всему сотворённому. Формулировка не уточняет сверх текста характер и последствия суда.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сохраняет причинно-временную структуру латинского текста без излишней архаизации.
