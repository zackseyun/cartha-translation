  text: 'Et respondi et dixi: et quomodo invenimus modo, quoniam rogavitprimus Abraham propter Sodomitas, et Moyses pro patribus qui in deserto peccaverunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/106.yaml
  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: ru
  text: 'Я ответил и сказал: «Как же мы теперь видим, что первым[a] Авраам молился за содомлян, а Моисей — за отцов, согрешивших в пустыне,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Авраам назван первым в перечисляемом здесь ряду ходатаев.
    reason: Уточняет, что латинское primus относится к Аврааму, а не означает, что он прежде молился именно за содомлян, а затем — за кого-то ещё.
lexical_decisions:
- source_word: invenimus modo
  choice: мы теперь видим
  rationale: Передаёт буквальное значение «теперь находим/обнаруживаем» естественным современным русским оборотом, не устраняя риторического характера вопроса.
- source_word: rogavit ... propter
  choice: молился за
  rationale: В контексте перечисления ходатаев латинское rogavit означает молитвенное прошение, а propter указывает, за кого оно совершается.
- source_word: Sodomitas
  choice: содомлян
  rationale: Прямое обозначение жителей Содома; современная и понятная русская форма.
- source_word: patribus
  choice: отцов
  rationale: Сохраняет традиционное обозначение предков Израиля без пояснительного расширения.
- source_word: in deserto
  choice: в пустыне
  rationale: Прямое и естественное соответствие латинскому выражению.
theological_decisions:
- issue: Значение и синтаксическая связь primus
  choice: первым Авраам молился
  alternative: Авраам сначала молился
  rationale: 'Латинское primus стоит в именительном падеже и согласуется с Abraham: Авраам назван первым в ряду ходатаев. Выбранный порядок слов не создаёт впечатления, будто речь идёт лишь о последовательности разных молитв самого Авраама.'
- issue: Характер действия Авраама и Моисея
  choice: молился за
  alternative: просил ради
  rationale: Контекст говорит о ходатайстве за других; «молился за» точно и ясно передаёт эту мысль, не добавляя конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранена незавершённость фразы, поскольку предложение продолжается в следующем стихе.
