source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: ru
  text: И входы в этот век стали тесными, мучительными[a] и трудными, немногими и дурными, полными опасностей и сопряжёнными с великими тяготами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорбными».'
    reason: Латинское dolentes может выражать как причинение боли, так и скорбь; основной текст учитывает неодушевлённое определяемое слово, а примечание сохраняет альтернативный оттенок.
lexical_decisions:
- source_word: introitus huius saeculi
  choice: входы в этот век
  rationale: Сохраняет конкретный образ входов и указание на нынешний век, не заменяя метафору толкованием вроде «пути».
- source_word: angusti
  choice: тесными
  rationale: Прямо передаёт пространственный образ узких, стеснённых входов.
- source_word: dolentes
  choice: мучительными
  rationale: При неодушевлённом introitus форма от doleo естественно понимается как причиняющая боль; «мучительными» передаёт это без неуместного олицетворения.
- source_word: laboriosi
  choice: трудными
  rationale: Передаёт идею требующих усилий, тягостных входов и не дублирует буквально последующее laborum.
- source_word: paucae autem et malae
  choice: малочисленными и злыми
  rationale: Сохраняет неожиданное описание входов как немногочисленных и дурных, не сглаживая напряжённость исходного текста.
- source_word: periculorum plenae
  choice: полными опасностей
  rationale: Прямое и естественное соответствие латинскому выражению.
- source_word: laborum magnorum fultae
  choice: обременёнными великими тяготами
  rationale: В контексте fultae описывает входы как отягощённые или окружённые великими трудами и лишениями; «тяготами» передаёт laborum здесь естественнее, чем буквальное «трудами».
theological_decisions:
- issue: Значение «этого века»
  choice: этот век
  alternative: этот мир
  rationale: Сохраняется эсхатологически значимая временная формулировка saeculum и её возможное противопоставление будущему веку, без сведения её только к пространственному «миру».
- issue: Образ входов
  choice: входы
  alternative: пути
  rationale: Исходная метафора сохранена буквально, чтобы не навязывать толкование того, к чему именно ведут эти входы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены синтаксический параллелизм, конкретная метафора входов и намеренно суровое накопление определений.
