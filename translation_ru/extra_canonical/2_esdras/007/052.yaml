  choice: сохранить вводную формулу и незавершённое условное сравнение
  alternative: добавить вопрос о свинце и глине по данным других древних версий
  rationale: Предоставленный латинский сегмент заканчивается на paucos ualde; дополнение из следующего исходного сегмента или иных версий не следует вводить в основной текст этого стиха.
