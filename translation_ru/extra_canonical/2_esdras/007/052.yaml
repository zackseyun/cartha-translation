- source_word: impios uero multiplicari
  choice: о том, почему нечестивых становится всё больше
  rationale: Передаёт умножение числа нечестивых естественным современным русским оборотом; «почему» связывает фразу с последующим сравнением, не устраняя его незавершённости в данном стихе.
- source_word: audi haec
  choice: послушай
  rationale: Прямой и естественный эквивалент повелительного оборота; дополнение раскрыто следующей фразой.
- source_word: Lapides electos
  choice: отборных камней
  rationale: Сохраняет буквальный образ и значение electos — выбранные, отличающиеся качеством; не усиливает его до «драгоценных» без необходимости.
- source_word: paucos ualde
  choice: совсем мало
  rationale: Естественно передаёт усиленное значение «очень мало» при исчисляемом существительном в русском языке.
