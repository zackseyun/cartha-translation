  source_fidelity: 'Смысл латинского оригинала в целом передан верно: сохранены условное противопоставление поражения и победы, а также намеренно неопределённые относительные отсылки. Однако «о чём ты сказал / говорю Я» передаёт quod как предмет речи, тогда как в данном контексте quod естественнее и точнее обозначает то, что было сказано как следствие: «то, что ты сказал / что говорю Я».'
  naturalness: Фраза грамматически естественна, но сочетание «испытает то, о чём ты сказал» несколько расплывчато и менее прямо соответствует параллельной структуре оригинала. «Претерпит то, что ты сказал» ясно выражает неблагоприятный характер patiatur и сохраняет высокий, но современный литературный регистр.
  terminology: «Потерпит поражение», «победит» и «получит» удачно передают victus fuerit, vicerit и recipiet. Прописное «Я» допустимо для речи Бога в русской библейской подаче, но не требуется исходным текстом; в исправленном тексте оно сохранено как редакционное оформление.
  issues:
