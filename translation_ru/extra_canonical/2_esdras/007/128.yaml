    rationale: Латинские quod dixisti и quod dico относятся к содержанию сказанного, а не к теме, о которой ведётся речь. Формула «то, что ты сказал / что говорю Я» точнее сохраняет синтаксис и смысловую симметрию оригинала.
  - severity: low
    issue: «Испытает» для patiatur
    rationale: Слово возможно, но нейтральнее и слабее передаёт значение «претерпит, понесёт». «Претерпит» лучше поддерживает контраст с обещанным получением.
  revised_text: Если он потерпит поражение, то претерпит то, что ты сказал; а если победит, то получит то, что говорю Я.
