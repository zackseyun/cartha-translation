  text: if he is defeated, he will suffer what you have said; but if he conquers, he will receive what I say.
translation:
  language: ru
  text: Если он потерпит поражение, то претерпит то, что ты сказал; а если победит, то получит то, что говорю Я.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: потерпит поражение
  rationale: Передаёт условную форму и значение латинского perfect passive без неестественного буквального «будет побеждён».
- source_word: patiatur
  choice: испытает
  rationale: В данном контексте означает претерпеть на себе упомянутую участь; «испытает» естественно по-русски и сохраняет неблагоприятный оттенок.
- source_word: vicerit
  choice: победит
  rationale: Прямо передаёт противопоставление victus fuerit и vicerit.
- source_word: recipiet
  choice: получит
  rationale: Нейтральное соответствие латинскому recipiet, не уточняющее характер обещанного.
- source_word: quod dico
  choice: то, о чём говорю Я
  rationale: Сохраняет настоящее время латинского dico и посредством прописной буквы обозначает речь Бога в русском библейском стиле.
theological_decisions:
- issue: Кто подразумевается под говорящим в quod dico
  choice: Местоимение «Я» написано с прописной буквы
  alternative: «то, о чём я говорю»
  rationale: В контексте говорит Бог; прописная буква соответствует современному русскому библейскому оформлению, не добавляя нового содержания.
- issue: Содержание страдания и награды
  choice: 'Оставлено неопределённым: «то, о чём ты сказал» и «то, о чём говорю Я»'
  alternative: Конкретизировать участь или награду из контекста
  rationale: Латинский текст использует относительные обороты quod dixisti и quod dico; конкретизация устранила бы намеренную отсылочность и могла бы внести толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм и противопоставление поражения победе сохранены; архаизмы и ненужные пояснения исключены.
