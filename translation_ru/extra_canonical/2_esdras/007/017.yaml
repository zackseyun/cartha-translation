source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et respondi et dixi: dominator domine, ecce disposuisti in lege tua, quoniam iusti hereditabunt haec, impii autem peribunt.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: ru
  text: 'Тогда я ответил: «Владыка Господи, вот, Ты установил в Своём Законе, что праведные унаследуют это, а нечестивые погибнут».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Владыка Господи
  rationale: Двойное обращение передаёт торжественный титул верховного Правителя, не превращая его в описательное придаточное предложение.
- source_word: ecce
  choice: вот
  rationale: Сохраняет риторический указатель, подчёркивающий ссылку Ездры на установленное в Законе.
- source_word: disposuisti
  choice: Ты установил
  rationale: В контексте Закона означает властно определить или постановить; «установил» естественно и достаточно точно передаёт это значение.
- source_word: iusti hereditabunt haec
  choice: праведные унаследуют всё это
  rationale: Сохраняет юридически и богословски значимый образ наследования; «всё» естественно указывает на совокупность ранее названного.
- source_word: impii autem peribunt
  choice: а нечестивые погибнут
  rationale: Передаёт контраст autem и не уточняет природу гибели сверх сказанного в источнике.
theological_decisions:
- issue: Смысл hereditabunt
  choice: унаследуют
  alternative: получат во владение
  rationale: «Унаследуют» сохраняет библейский образ наследия и не сводит его к простому обладанию.
- issue: Характер гибели нечестивых
  choice: погибнут
  alternative: будут уничтожены
  rationale: Латинское peribunt допускает более широкий смысл гибели; перевод не должен без необходимости уточнять её механизм.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным обращением. Повтор «ответил и сказал» сокращён до естественного русского «ответил» без потери содержания; «вот» сохранено как значимый риторический маркер.
