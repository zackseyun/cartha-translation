  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: ru
  text: Ибо лучше пусть погибнут многие из ныне живущих[a], чем будет оставлен без внимания представленный Закон Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие из ныне присутствующих».'
    reason: Praesentes может буквально означать «присутствующие», хотя в контексте также естественно понимается как «ныне живущие».
lexical_decisions:
- source_word: enim
  choice: ибо
  rationale: Сохраняет объяснительную связь с предыдущей мыслью.
- source_word: multi praesentes
  choice: многие из ныне живущих
  rationale: В данном контексте praesentes обозначает людей, живущих ныне; оборот естественнее буквального «присутствующие».
- source_word: pereant ... quam neglegatur
  choice: пусть лучше погибнут ... чем останется без внимания
  rationale: Передаёт сравнительно-предпочтительную конструкцию с quam и сохраняет резкое противопоставление.
- source_word: anteposita est
  choice: явленный им
  rationale: Передаёт смысл закона, поставленного перед людьми, без тяжеловесной буквальности; местоимение уточняет подразумеваемых адресатов.
- source_word: Dei lex
  choice: Закон Божий
  rationale: Традиционный, ясный и достойный русский библейский оборот.
theological_decisions:
- issue: Противопоставление гибели людей и пренебрежения Божьим законом
  choice: Сохранить прямое и резкое противопоставление
  alternative: Смягчить как утверждение о последствиях человеческого выбора
  rationale: Латинский текст формулирует предпочтение непосредственно; перевод не должен устранять его богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью; синтаксис сохранён ясным, а противопоставление — выразительным.
