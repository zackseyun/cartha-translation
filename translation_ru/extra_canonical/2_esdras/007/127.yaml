source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit et dixit: hoc est cogitamentum certaminis, quem certavit qui super terram natus est homo,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: ru
  text: 'И он ответил и сказал: «Вот мысль о борьбе, которую вёл человек, родившийся на земле[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «которую должен вести человек, родившийся на земле».'
    reason: Сохраняет засвидетельствованное контекстуальное понимание фразы как общего долженствования, тогда как основной текст следует прошедшему времени латинского certavit.
lexical_decisions:
- source_word: cogitamentum
  choice: мысль
  rationale: Передаёт основное значение латинского слова и сохраняет несколько необычное, но значимое выражение «мысль о борьбе», не подменяя его более толковательным «смыслом».
- source_word: certaminis
  choice: о борьбе
  rationale: Родительный падеж в латинском передан естественной русской конструкцией; «борьба» сохраняет широкий смысл состязания, противостояния и нравственного усилия.
- source_word: certavit
  choice: вёл
  rationale: В сочетании «вёл борьбу» естественно передаёт латинское прошедшее время и не превращает его без достаточного основания в модальное «должен вести».
- source_word: homo
  choice: человек
  rationale: Нейтральное родовое обозначение человека без указания на конкретного мужчину; порядок слов не навязывает отождествления с определённой личностью.
- source_word: super terram natus est
  choice: родившийся на земле
  rationale: Прямо и естественно передаёт место рождения и универсальный земной удел человека.
theological_decisions:
- issue: Относится ли homo к определённой личности или к человеку вообще
  choice: человек, родившийся на земле
  alternative: этот человек, родившийся на земле
  rationale: Латинское homo допускает грамматическую определённость относительной конструкцией, но по смыслу может быть родовым обозначением; русский текст избегает намёка на Адама, Мессию или иную конкретную фигуру.
- issue: Прошедшее или долженствующее значение certavit
  choice: которую вёл
  alternative: которую должен вести
  rationale: Основной текст следует форме латинского перфекта certavit; традиционное модальное понимание сохранено в примечании, поскольку оно возможно как контекстуальное истолкование универсальной человеческой борьбы.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Формула «ответил и сказал» сохранена как характерный семитизированный оборот латинской традиции; двоеточие оставляет предложение открытым, как в источнике.
