source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: ru
  text: 'Шестая ступень: когда им будет показано, как лица их начнут сиять, словно солнце, и как они начнут уподобляться свету звёзд, став с тех пор нетленными.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sextus ordo
  choice: Шестая ступень
  rationale: В контексте последовательных состояний слово ordo обозначает этап или ступень; буквальное «порядок» здесь звучало бы неестественно и затемняло бы смысл.
- source_word: uultus eorum
  choice: лица их
  rationale: Латинское единственное число имеет собирательный смысл; русское множественное число ясно соотносит сияние со всеми упомянутыми людьми.
- source_word: fulgere sicut sol
  choice: сиять, словно солнце
  rationale: Сохраняет прямое сравнение и возвышенный библейский образ без архаизации.
- source_word: stellarum adsimilari lumini
  choice: уподобляться свету звёзд
  rationale: Передаёт образ постепенного уподобления звёздному свету, не конкретизируя способ преображения.
- source_word: incorruptibiles
  choice: нетленными
  rationale: «Нетленные» точно передаёт отсутствие тления и сохраняет богословскую ёмкость термина, не сводя его только к бессмертию.
theological_decisions:
- issue: Характер будущего преображения праведных
  choice: Сохранены образы сияния и уподобления свету звёзд, а также понятие нетления.
  alternative: Истолковать это как получение прославленных тел или исключительно как духовное сияние.
  rationale: Источник описывает преображение образно и не уточняет его телесный либо исключительно духовный характер; перевод не должен разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция с будущим временем передаёт латинское ostendetur; добавленное «тогда» естественно связывает шестую ступень с последовательностью видений.
