lexical_decisions:
- source_word: item aliud
  choice: И ещё один пример
  rationale: Латинское эллиптическое выражение вводит следующую иллюстрацию; добавление слова «пример» естественно передаёт подразумеваемый смысл, как и консультационный английский текст.
- source_word: civitas
  choice: город
  rationale: В данном образе речь идёт о построенном городе; обычное современное соответствие сохраняет конкретность.
- source_word: posita in loco campestri
  choice: расположен на равнине
  rationale: Передаёт положение города на открытой ровной местности естественным современным русским языком.
- source_word: plena omnium bonorum
  choice: полон всяческих благ
  rationale: Сохраняет широкий смысл латинского bonorum — всего благого и ценного — без неоправданного сужения до вещей или богатств.
