    rationale: Эпитет «окончательное» передаёт лишь часть значения terminus и может означать неоспоримость решения, которой латинский текст прямо не утверждает. «Определение» позволяет передать sententia без такого дополнительного оттенка.
  - severity: low
    issue: Неясная соотнесённость в «чтобы вновь быть отпущенным»
    rationale: Следует явно отнести пассивную цель к «дыханию», сохранив отсутствие указания о направлении или адресате этого отпускания.
