id: 2ES.7.78
reference: 2 Esdras 7:78
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: ru
  text: 'О смерти же речь такова: когда от Всевышнего выйдет определение, что человеку надлежит умереть, дыхание[a] покидает тело, чтобы оно вновь было отпущено,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизненное дыхание»; латинское inspiratio здесь допускает оттенок жизненного начала.'
    reason: Сохраняет смысловую широту исходного слова и объясняет, почему оно не переведено однозначно как «дух».
lexical_decisions:
- source_word: sermo est
  choice: речь такова
  rationale: Естественно передаёт вводную формулу о предмете речи, не усиливая её до значения «учение».
- source_word: terminus sententiae
  choice: окончательное решение
  rationale: Сохраняет идею окончательного постановления; «приговор» в русском звучал бы более явно судебно и мог бы сузить смысл.
- source_word: inspiratio
  choice: дыхание
  rationale: В данном описании смерти слово обозначает покидающее тело жизненное дыхание; перевод «дух» сильнее конкретизировал бы антропологический смысл, чем позволяет латинский текст.
- source_word: dimittatur iterum
  choice: вновь быть отпущенным
  rationale: Передаёт пассивную конструкцию и не добавляет отсутствующего в данном фрагменте указания, куда или к кому оно возвращается.
theological_decisions:
- issue: Смысл inspiratio при смерти
  choice: дыхание
  alternative: дух
  rationale: Выбран более непосредственный лексический смысл, при этом неоднозначность между дыханием и жизненным началом отмечена в сноске.
- issue: Неуказанная цель возвращения
  choice: не уточнять, куда или к кому отпускается дыхание
  alternative: «возвращается к Тому, кто его дал»
  rationale: Такое уточнение известно по более пространным формам текста, но отсутствует в предоставленном латинском источнике и потому не внесено.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Конечная запятая сохранена, поскольку предоставленный латинский текст синтаксически продолжается далее.
