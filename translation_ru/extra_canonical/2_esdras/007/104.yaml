source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'si fideles pro carissimis. [Et respondit ad me et dixit: quoniam inueniisti gratiam ante oculos meos, et hoc demonstrabo tibi: dies iudicii dies decretorius est, et omnibus signaculum ueritatis ostendet; quemadmodum enim non mittit pater filium, uel filius patrem, uel dominus seruum], uel fidus carissimum, ut pro'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a servant, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: ru
  text: 'Он ответил мне и сказал[a]: «Поскольку ты обрёл благоволение в моих глазах, я покажу тебе и это: день суда — решающий день, и он явит всем печать истины. Ведь как отец не посылает сына, сын — отца, господин — слугу, а верный человек — дорогого ему человека[b], чтобы тот предстал на суде вместо него…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Часть этого стиха восстановлена по фрагменту, отсутствующему в большинстве средневековых латинских рукописей. Примеры подчёркивают, что на окончательном суде один человек не может заменить другого.
    reason: recovered_fragment
  - marker: b
    text: 'Буквально: «верный — самого дорогого [ему]»; возможно также: «верный друг — любимого им».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: inueniisti gratiam ante oculos meos
  choice: ты обрёл благоволение в Моих глазах
  rationale: Сохраняет библейский образ и смысл латинского оборота, оставаясь понятным на современном русском языке.
- source_word: dies decretorius
  choice: день решающий
  rationale: Передаёт судебную окончательность decretorius без добавления отсутствующего в источнике богословского толкования.
- source_word: signaculum ueritatis
  choice: печать истины
  rationale: 'Формально сохраняет метафору signaculum и допускаемую ею смысловую многозначность: удостоверение, подтверждение или явный знак истины.'
- source_word: dominus seruum
  choice: господин — слугу
  rationale: В данном социально-бытовом перечислении dominus означает хозяина или господина, а seruus — зависимого слугу; выбранное выражение естественно и не усиливает формулировку до «раб» без необходимости.
- source_word: fidus carissimum
  choice: верный друг — дорогого ему человека
  rationale: Субстантивированное fidus буквально означает «верный», а carissimum — «самого дорогого/любимого». Добавление «друг» делает эллиптическую пару естественной по-русски, не превращая её в более узкое родственное отношение.
- source_word: ut pro
  choice: чтобы тот выступил за него на суде…
  rationale: Латинский отрывок обрывается после предлога pro; формулировка следует контексту судебного заступничества, а многоточие отмечает незавершённость предоставленного текста.
theological_decisions:
- issue: Личная ответственность на окончательном суде
  choice: Сохранена аналогия невозможности послать близкого или подчинённого вместо себя
  alternative: 'Передать смысл прямо: «никто не сможет заступиться за другого»'
  rationale: Источник выражает мысль через ряд бытовых сравнений и не формулирует отвлечённого догматического вывода в пределах данного стиха; образная форма сохраняет напряжение текста.
- issue: «Печать истины»
  choice: Метафора оставлена без поясняющей замены
  alternative: «Окончательно откроет истину всем»
  rationale: Так не устраняется намеренная образность и не выбирается единственное толкование signaculum.
- issue: Время глагола ostendet
  choice: 'будущее: «явит»'
  alternative: 'настоящее: «являет»'
  rationale: Латинское ostendet имеет форму будущего времени и соотносится с грядущим днём суда.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повторы исходного судебного рассуждения сохранены, но эллиптические пары оформлены естественно для русского синтаксиса. Прописные местоимения в прямой речи обозначают говорящего от первого лица в соответствии с русской библейской издательской традицией, не добавляя имени или титула.
