  - severity: medium
    issue: «Выступил за него» сужает значение судебного замещения
    rationale: Конструкция ut pro… в данном контексте относится к тому, чтобы близкий предстал/был судим вместо пославшего, а не обязательно произнёс речь в его защиту.
