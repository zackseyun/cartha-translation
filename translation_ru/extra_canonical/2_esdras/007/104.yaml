  naturalness: «День суда — решающий день» звучит естественнее и точнее передаёт именную конструкцию dies iudicii dies decretorius est. «Верный человек — дорогого ему человека» сохраняет эллиптическую пару без необоснованного добавления слова «друг».
  terminology: «Печать истины» и «господин — слугу» допустимы. «Решающий день» передаёт decretorius без конфессиональной конкретизации. Неоднозначность fidus carissimum отмечена в примечании.
