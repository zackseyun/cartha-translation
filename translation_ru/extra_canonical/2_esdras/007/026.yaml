  text: ecce enim tempus veniet, et erit quando venient signa quae praedixi tibi, et apparebit sponsa et apparescens civitas et ostendetur quae nunc subducitur terra.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: ru
  text: 'Ибо вот, придёт время, и будет так: явятся знамения, которые Я предсказал тебе, явится невеста[a] и появляющийся город[b], и будет показано то, что ныне сокрыто от земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соседство образов являющейся невесты и города, вероятно, кратко соединяет апокалиптические образы восстановления Сиона или Иерусалима. Латинский текст не объясняет, как именно невеста соотносится с городом.
    reason: compositional_layer
  - marker: b
    text: 'Возможный вариант по иной текстовой реконструкции: «ныне скрытый город явится». В данном переводе сохранено прямое чтение латинского текста: «появляющийся город».'
    reason: previous_rendering
lexical_decisions:
- source_word: ecce enim
  choice: Ибо вот
  rationale: Сохраняет причинно-пояснительное enim и торжественный указательный оборот ecce без архаизации.
- source_word: venient signa
  choice: явятся знамения
  rationale: Буквальное «придут знамения» по-русски звучит неестественно; «явятся» передаёт наступление и обнаружение предсказанных знаков.
- source_word: sponsa
  choice: невеста
  rationale: Прямой эквивалент латинского образа; связь невесты с городом намеренно не уточняется.
- source_word: apparescens civitas
  choice: являющийся город
  rationale: Сохраняет причастную форму и эксплицитное чтение латинского текста, не подменяя его реконструкцией «ныне скрытый город».
- source_word: subducitur terra
  choice: сокрыто от земли
  rationale: Передаёт пассивное subducitur как недоступность земному миру; формулировка следует смыслу удаления/сокрытия и сохраняет необычную краткость оригинала.
theological_decisions:
- issue: Соотношение невесты и города
  choice: Оставить их двумя рядом поставленными образами
  alternative: Истолковать невесту как сам город либо оформить слова о городе как приложение
  rationale: Латинский текст соединяет sponsa и civitas, но не разъясняет их отношения; явное отождествление сняло бы подлинную неоднозначность.
- issue: Скрытый или являющийся город
  choice: Перевести эксплицитное латинское apparescens civitas как «являющийся город»
  alternative: «Ныне скрытый город явится»
  rationale: Альтернатива связана с предполагаемым греческим чтением, тогда как предоставленный латинский источник прямо содержит apparescens.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксическая неровность сочетания «невеста и являющийся город» сохранена намеренно, поскольку более гладкая формулировка могла бы отождествить образы или заменить латинское чтение реконструированным.
