  terminology: «Знамения», «невеста» и «город» удачны. «Сокрыто от земли» допустимо как передача subducitur terra и сохраняет образную краткость текста. Не следует заменять «появляющийся город» реконструированным вариантом о ныне скрытом городе в основном тексте.
