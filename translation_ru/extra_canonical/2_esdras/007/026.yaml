  rationale: 'Исправлены две безопасные языковые неточности: русское «появляющийся» точнее и естественнее передаёт латинское apparescens, а «которые Я предсказал тебе» сохраняет прямую объектную связь quae praedixi tibi. Неоднозначное соположение невесты и города, равно как и латинское чтение в отличие от реконструкции, сохранены.'
