id: 2ES.7.66
reference: 2 Esdras 7:66
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iocundentur. Multum enim melius est illis quam nobis, non enim sperant iudicium,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: ru
  text: 'Ведь им гораздо лучше, чем нам: они не ожидают суда и не знают ни мучений, ни спасения, обещанного после смерти.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский текст обрывается после слов «не ожидают суда»; продолжение «и не знают ни мучений, ни спасения, обещанного после смерти» переведено по засвидетельствованному в английском консультационном тексте продолжению стиха.
    reason: Прозрачно обозначает границу непосредственно предоставленного оригинально-язычного свидетельства.
lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: Ведь им гораздо лучше, чем нам
  rationale: Естественно и точно передаёт сравнительную конструкцию и причинно-пояснительное enim.
- source_word: sperant iudicium
  choice: ожидают суда
  rationale: В данном контексте sperare означает ожидание предстоящего, а не обязательно надежду в положительном смысле.
- source_word: tormenta
  choice: мучений
  rationale: Передаёт посмертные страдания без добавления конфессионально окрашенной терминологии.
- source_word: salutem post mortem promissam
  choice: спасения, обещанного после смерти
  rationale: Сохраняет смысл и синтаксическую связь английского консультационного текста; эта часть, однако, отсутствует в предоставленном латинском отрывке и потому отмечена текстологической сноской.
theological_decisions:
- issue: Суд, мучения и спасение после смерти
  choice: Сохранена последовательность понятий без пояснения их природы или времени
  alternative: Уточнить как вечное наказание и окончательное спасение
  rationale: Исходная формулировка не даёт таких уточнений; их добавление устранило бы сохраняемую текстом богословскую открытость.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Начальное латинское iocundentur («пусть радуются») по принятому делению относится к предшествующему контексту и не включено в текст 7:66.
