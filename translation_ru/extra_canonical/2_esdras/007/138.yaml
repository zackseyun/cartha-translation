id: 2ES.7.138
reference: 2 Esdras 7:138
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: ru
  text: И Он щедр, потому что, если бы Он по Своей благости не даровал облегчения от своих беззаконий тем, кто совершил беззакония, то не могла бы быть оживотворена даже одна десятитысячная часть человечества,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: donator
  choice: щедр
  rationale: В данном контексте передаёт характеристику Бога как Того, кто щедро дарует; буквальное «даритель» в современном русском звучит неестественно.
- source_word: de bonitate sua
  choice: по Своей благости
  rationale: Сохраняет основание действия в Божьей благости и естественно звучит по-русски.
- source_word: adleventur ... de suis iniquitatibus
  choice: освободились от своих беззаконий
  rationale: Передаёт образ снятия бремени; латинское выражение допускает оттенки облегчения и освобождения, поэтому формулировка не уточняет, идёт ли речь о вине, наказании или самих беззакониях.
- source_word: decies millesima pars
  choice: одна десятитысячная часть
  rationale: Точно воспроизводит числовую долю латинского текста.
- source_word: vivificari
  choice: ожить
  rationale: Передаёт пассивное «быть оживлённым/получить жизнь» без излишнего догматического уточнения.
theological_decisions:
- issue: Характер освобождения от беззаконий
  choice: освободились от своих беззаконий
  alternative: получили облегчение от своих беззаконий
  rationale: 'Сохранена неопределённость латинского adleventur de: текст не поясняет, снимаются ли вина, последствия, наказание или бремя беззаконий.'
- issue: Значение vivificari
  choice: ожить
  alternative: быть оживотворёнными
  rationale: «Ожить» понятно современному читателю и не навязывает специального богословского значения, хотя сохраняет идею получения жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранена незавершённость фразы посредством конечной запятой, поскольку стих синтаксически продолжается.
