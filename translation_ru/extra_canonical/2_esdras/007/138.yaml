  - severity: medium
    issue: «...даровал облегчения тем, кто совершил беззакония, чтобы они освободились от своих беззаконий»
    rationale: 'Это синтаксически и семантически избыточно: облегчение уже является тем, что в латинском выражено adleventur; «освободились» усиливает смысл до полного освобождения, которого adleventur не требует.'
  - severity: low
    issue: «не могла бы ожить» для vivificari
    rationale: «Ожить» понятно, но не передаёт явно пассивную форму латинского глагола. «Быть оживотворённой» сохраняет пассив без дополнительного богословского истолкования.
  revised_text: И Он щедр, потому что, если бы Он по Своей благости не даровал облегчения от своих беззаконий тем, кто совершил беззакония, то не могла бы быть оживотворена даже одна десятитысячная часть человечества,
