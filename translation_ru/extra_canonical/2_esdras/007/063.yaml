  source_fidelity: '«Прах» верно передаёт лат. pulverem, а «не возник» удачно избегает образа рождения. Однако «чтобы из него не произошло разумение» стилистически и сочетаемостно неудачно: разумение не «происходит» в таком употреблении. Смысл целевой части — чтобы из праха не возникло/не появилось разумение — следует сохранить без интерпретации.'
