  yaml_path: translation/extra_canonical/2_esdras/007/079.yaml
  text: to him who gave it[a], to worship the glory of the Most High first of all. And if indeed it is one of those who have spurned and have not kept the way of the Most High, and of those who have despised the law,
translation:
  language: ru
  text: к Тому, Кто дал её, чтобы прежде всего поклониться славе Всевышнего. Если же она действительно принадлежит к тем, кто презрели и не соблюдали пути Всевышнего, и к тем, кто пренебрегли Законом,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский фрагмент начинается заключительными словами предыдущего стиха и обрывается до окончания этого предложения.
    reason: source_boundary
lexical_decisions:
- source_word: adorare
  choice: поклониться
  rationale: Передаёт религиозное поклонение естественным и достойным современным русским языком.
- source_word: gloriam Altissimi
  choice: славе Всевышнего
  rationale: Сохраняет традиционную библейскую лексику и грамматическую связь латинского текста.
- source_word: spreuerunt et non seruauerunt uiam Altissimi
  choice: отверг путь Всевышнего и не держался его
  rationale: «Отверг» передаёт сильное spreuerunt, а «не держался» естественно выражает несоблюдение пути как образа жизни.
- source_word: contempserunt legem
  choice: пренебрёг Законом
  rationale: Не добавляет отсутствующее в данном латинском фрагменте притяжательное местоимение «Его»; прописная буква обозначает Закон в религиозном смысле.
- source_word: quidem
  choice: действительно
  rationale: Сохраняет явный усилительный оттенок латинской частицы.
theological_decisions:
- issue: Чей Закон имеется в виду
  choice: Законом
  alternative: Его Законом
  rationale: Контекст связывает Закон со Всевышним, но латинское legem в предоставленном источнике не содержит притяжательного местоимения; перевод не делает подразумеваемое явным без необходимости.
- issue: Неявный субъект женского рода
  choice: она
  alternative: душа
  rationale: По контексту речь идёт о душе, однако в данном фрагменте существительное не повторено; местоимение сохраняет связность и не восполняет текст сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Начальная строчная буква и конечная запятая сохранены, поскольку исходный фрагмент начинается и заканчивается внутри предложения.
