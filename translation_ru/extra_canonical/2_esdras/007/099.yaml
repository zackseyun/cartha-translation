  text: '[eius], cui seruiunt uiuentes et a quo incipiunt gloriosi mercedem recipere. Hic ordo animarum iustorum, ut a modo adnuntiatur, praedictae uiae cruciatus, quas'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
translation:
  language: ru
  text: '[Того][a], Кому служат живые и от Кого прославленные начинают получать свою награду. Таков порядок душ праведных, как отныне возвещается; [а таковы] прежде описанные пути мучения, которые'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальное слово восстановлено по контексту; данный отрывок начинается с продолжения предложения предыдущего стиха.
    reason: 'Текстологическая прозрачность: латинское eius заключено в квадратные скобки.'
lexical_decisions:
- source_word: cui seruiunt uiuentes
  choice: Кому служат живые
  rationale: Прямая и естественная передача латинского выражения с сохранением относительной конструкции.
- source_word: gloriosi
  choice: прославленные
  rationale: Сохраняет буквальный смысл «славные/прославленные» и не уточняет без достаточных оснований, кем или в каком смысле они прославлены.
- source_word: a modo
  choice: отныне
  rationale: Передаёт временную направленность выражения «с этого момента, впредь», хотя в контексте возможно и более нейтральное «теперь».
- source_word: ordo animarum iustorum
  choice: порядок для душ праведных
  rationale: По-русски естественно обозначает установленную последовательность их посмертного состояния, не превращая ordo в перечень или чин.
- source_word: praedictae uiae cruciatus
  choice: прежде описанные пути мучения
  rationale: Сохраняет образ «путей» и ретроспективное значение praedictae; родительный cruciatus передан как характеристика путей.
theological_decisions:
- issue: К кому относится восстановленное eius в начале фрагмента
  choice: '[Того]'
  alternative: его / Его
  rationale: Квадратные скобки сохраняют текстологическую восстановленность слова; прописная буква указывает на Бога по контексту, не добавляя имени или титула.
- issue: Смысл gloriosi
  choice: прославленные
  alternative: находящиеся во славе
  rationale: 'Причастная форма сохраняет неоднозначность: речь может идти о тех, кто уже облечён славой, или о славных праведниках.'
- issue: Незавершённость заключительной конструкции
  choice: оставить стих на слове «которые»
  alternative: дополнить сказуемое из следующего стиха
  rationale: Латинский источник заканчивается относительным местоимением quas и продолжается далее; дополнение здесь искусственно разрешило бы синтаксис и вышло за пределы данного стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис намеренно оставлен незавершённым в конце, поскольку предложение продолжается в следующем стихе; квадратные скобки обозначают восстановленное или подразумеваемое.
