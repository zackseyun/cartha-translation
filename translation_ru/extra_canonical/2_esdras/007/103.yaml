  text: iudicii iusti impios excusare poterint uel deprecari pro eis Altissimum, Si patres pro filiis, uel filii pro parentibus, si fratres pro fratribus, si adfines pro proximis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: ru
  text: 'смогут ли они на праведном суде найти оправдание для нечестивых или умолять Всевышнего за них: отцы — за детей, дети — за родителей, братья — за братьев, родственники по браку — за ближних,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicii iusti
  choice: на праведном суде
  rationale: Латинский родительный падеж обусловлен более широким синтаксическим контекстом; по-русски обстоятельственное сочетание естественно передаёт место и ситуацию действия.
- source_word: impios
  choice: нечестивых
  rationale: Передаёт нравственно-религиозное значение impii без сужения до неверующих или преступников.
- source_word: excusare
  choice: оправдать
  rationale: Сохраняет судебную окраску контекста; возможность значения «найти оправдание» отмечена в сноске.
- source_word: deprecari pro eis Altissimum
  choice: умолять Всевышнего за них
  rationale: Передаёт обращённую к Всевышнему настойчивую просьбу в пользу других; русское управление перестроено ради естественности.
- source_word: adfines
  choice: родственники
  rationale: Обобщённое современное соответствие; латинское слово может особенно обозначать родственников по браку, но здесь входит в широкий перечень человеческих связей.
- source_word: proximis
  choice: за близких
  rationale: В данном перечне proximus естественнее понимать как близкого человека, а не исключительно соседа по месту жительства.
theological_decisions:
- issue: Возможность посмертного заступничества на суде
  choice: Сохранён вопрос о том, смогут ли названные лица оправдать нечестивых или умолять за них Всевышнего.
  alternative: Сформулировать как категорическое утверждение о невозможности такого заступничества.
  rationale: Данный фрагмент грамматически представляет вопрос; ответ и богословский вывод нельзя вносить в сам стих из последующего контекста.
translation_notes:
  register: Современный литературный русский с достоинством судебно-религиозной речи. Параллельный перечень передан краткими конструкциями с тире; конечная запятая сохранена, поскольку фраза продолжается в следующем фрагменте.
