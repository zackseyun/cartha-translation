  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: ru
  text: 'И он сказал мне: «Ты не судишь лучше, чем Господь, и не понимаешь больше, чем Всевышний».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально super означает «над»: «Ты не судья над Господом и не стоишь выше Всевышнего в понимании». В этих параллельных оборотах оно может также иметь сравнительное значение: «лучше/больше, чем».'
    reason: Сноска отмечает формальную неоднозначность латинского super, но основной текст передаёт вероятное сравнительное значение и сохраняет параллелизм двух частей.
lexical_decisions:
- source_word: iudex super Dominum
  choice: судить лучше Господа
  rationale: Сочетание super с iudex передано сравнительно и естественно по-русски; это соответствует параллельной конструкции следующей части стиха, не представляя человека судьёй над Богом.
- source_word: intellegens super Altissimum
  choice: понимать больше Всевышнего
  rationale: Сравнительное значение super сохранено параллельно первой части; intellegens передано глаголом «понимать», без добавления идеи мудрости, которой прямо нет в латинском тексте.
- source_word: Altissimum
  choice: Всевышнего
  rationale: Традиционный и ясный русский эквивалент латинского божественного титула Altissimus.
theological_decisions:
- issue: Значение super в двух параллельных оборотах
  choice: 'Сравнительное: «лучше… больше…»'
  alternative: 'Пространственно-властное: «над Господом… над Всевышним»'
  rationale: Параллелизм двух частей и вероятный семитско-греческий фон латинского перевода поддерживают сравнительное прочтение. При этом буквальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и торжественно-сдержанная. Ради естественности два латинских именных оборота переданы параллельными глагольными конструкциями.
