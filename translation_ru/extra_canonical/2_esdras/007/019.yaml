  naturalness: Предлагаемая правка сохраняет современный литературный и сдержанно-библейский регистр. Конструкция «не судишь лучше, чем Господь» ясна и естественна; повтор «чем» устраняет синтаксическую двусмысленность.
  terminology: «Господь» для Dominum и «Всевышний» для Altissimum точны и последовательны. «Судить» передаёт iudex в естественной русской глагольной форме, а «понимать» — intellegens без неоправданного добавления значения «мудрее».
