source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: ru
  text: Ибо день суда будет концом этого времени и началом грядущего бессмертного времени, в котором тление миновало,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dies enim iudicii
  choice: Ибо день суда
  rationale: Сохраняет причинно-пояснительное enim и прямое значение устойчивого выражения dies iudicii.
- source_word: temporis huius
  choice: нынешнего времени
  rationale: Естественно передаёт указательное huius и сохраняет противопоставление нынешнего и грядущего времени.
- source_word: futuri inmortalis temporis
  choice: бессмертного времени, которое грядёт
  rationale: Передаёт futurus в характерном для апокалиптической речи значении «грядущий», а inmortalis относит именно ко времени; развёрнутая конструкция звучит по-русски естественнее, чем цепочка определений.
- source_word: corruptela
  choice: тление
  rationale: Сохраняет широкий библейский смысл порчи, распада и смертности, не сводя его только к нравственной испорченности.
- source_word: pertransivit
  choice: уже миновало
  rationale: Передаёт совершённость латинской формы из перспективы грядущего бессмертного времени; «уже» делает эту временную перспективу ясной по-русски.
theological_decisions:
- issue: Соотношение нынешнего и грядущего времени
  choice: Сохранено буквальное противопоставление двух времён без замены слова «время» на «век».
  alternative: «нынешнего века» и «грядущего бессмертного века»
  rationale: Хотя «век грядущий» привычен в эсхатологической лексике, источник дважды употребляет tempus; перевод не должен усиливать техническую богословскую терминологию сверх латинского текста.
- issue: Состояние тления в грядущем времени
  choice: «тление уже миновало»
  alternative: «тление исчезнет»
  rationale: Сохранена совершённая форма pertransivit и взгляд изнутри грядущего времени, а не заменена прямым будущим временем.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Слово «тление» уместно в библейском контексте и остаётся понятным; синтаксис сохраняет незавершённость исходного фрагмента, поэтому текст оканчивается запятой.
