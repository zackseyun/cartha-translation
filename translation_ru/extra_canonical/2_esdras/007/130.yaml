source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non crediderunt autem ei, sed nec post eum prophetis, sed nec mihi qui locutus sum ad eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/130.yaml
  text: But they did not believe him, nor the prophets after him, nor even me, who spoke to them.
translation:
  language: ru
  text: Но они не поверили ему, ни пророкам после него, ни даже Мне, говорившему к ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non crediderunt
  choice: не поверили
  rationale: Прямо передаёт отрицание латинского crediderunt и естественно звучит в современном русском языке.
- source_word: sed nec ... sed nec
  choice: ни ... ни
  rationale: Латинская повторная конструкция усиливает последовательное отрицание; русское «ни ... ни» точно и естественно сохраняет этот ряд.
- source_word: mihi
  choice: Мне
  rationale: Местоимение относится к говорящему Богу; прописная буква соответствует принятой русской библейской издательской традиции, не меняя смысла текста.
- source_word: qui locutus sum ad eos
  choice: говорившему с ними
  rationale: Передаёт определительное придаточное при mihi. «С ними» в данном контексте естественнее буквального «к ним» и обозначает обращённую к ним речь.
theological_decisions:
- issue: Личность того, кому они сначала не поверили
  choice: Сохранено местоимение «ему» без поясняющего имени
  alternative: Назвать подразумеваемое лицо по контексту
  rationale: Латинский текст использует только ei; добавление имени устранило бы сохранённую источником контекстуальную зависимость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом; синтаксический параллелизм и нарастание до «ни даже Мне» сохранены.
