lexical_decisions:
- source_word: munificus
  choice: щедр
  rationale: Естественно и точно передаёт качество щедрости; краткая форма согласуется с продолжением ряда характеристик.
- source_word: quoniam quidem
  choice: потому что поистине
  rationale: Передаёт причинное значение quoniam и усилительный оттенок quidem, не утяжеляя фразу.
- source_word: donare vult
  choice: желает дарить
  rationale: Сохраняет значение добровольного желания давать в дар.
- source_word: pro exigere
  choice: а не взыскивать
  rationale: Передаёт предпочтение одного действия другому; «взыскивать» сохраняет возможные оттенки требования и истребования должного.
theological_decisions:
- issue: Соотношение Божьей щедрости и взыскания
  choice: желает дарить, а не взыскивать
  alternative: хочет давать, нежели требовать
  rationale: Формулировка сохраняет противопоставление исходного текста и его напряжение, не превращая его в безусловное отрицание суда или взыскания.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён фрагментарный синтаксис стиха как части более длинного перечисления; конечная запятая указывает на продолжение.
