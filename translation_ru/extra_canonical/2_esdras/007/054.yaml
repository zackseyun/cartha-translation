    issue: «Он ответил мне» вместо «И он сказал мне»
    rationale: Латинское dixit ad me буквально и нейтрально означает «сказал мне». Хотя «ответил» возможно по диалогическому контексту, оно вносит оттенок, не выраженный исходным глаголом. Более прямое соответствие также согласуется с английским audit trail.
