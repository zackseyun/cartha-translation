  rationale: Заменён лишь контекстуально усиленный глагол «ответил» на нейтральное «сказал», непосредственно соответствующее dixit. Вопрос передан оборотом «как это может быть?», естественным в русском и сохраняющим модальный смысл poterit. Тире оставлено, поскольку исходный текст оканчивается на interroga.
