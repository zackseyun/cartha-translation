  text: 'dixi: domine, quomodo poterit? Et dixit ad me: non hoc solummodo, sed interroga'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/054.yaml
  text: I said[a], “Lord, how can it be?” And he said to me, “Not only this, but ask—
translation:
  language: ru
  text: 'Я сказал: «Господи, как это может быть?» И он сказал мне: «Не только это, но спроси —»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixi
  choice: Я сказал
  rationale: Прямое и естественное соответствие латинскому перфекту; субъект выражен явно.
- source_word: domine
  choice: Господи
  rationale: Традиционная и современно понятная русская форма обращения к Господу.
- source_word: quomodo poterit?
  choice: как это возможно?
  rationale: Передаёт вопрос о возможности сказанного, не добавляя отсутствующего в источнике уточнения; настоящее «возможно» естественнее буквального будущего времени в русском контексте.
- source_word: Et dixit ad me
  choice: Он ответил мне
  rationale: В диалоге русское «ответил» естественно выражает функцию латинского dixit ad me («сказал мне») без изменения смысла.
- source_word: non hoc solummodo
  choice: Не только это
  rationale: Сохраняет указательное hoc и ограничительную конструкцию; продолжение мысли остаётся открытым.
- source_word: sed interroga
  choice: но спроси —
  rationale: Передаёт противительный союз и повелительное наклонение. Тире показывает, что фраза обрывается на границе предоставленного текста и продолжается далее.
theological_decisions:
- issue: Объект глагола interroga отсутствует в предоставленном стихе
  choice: Не добавлять «землю» и последующие слова; завершить открытым тире
  alternative: Включить «спроси землю, и она скажет тебе…» из продолжения
  rationale: Предоставленный латинский текст заканчивается словом interroga. Добавление объекта и продолжения переносило бы в этот стих материал, отсутствующий в указанном источнике для 7:54.
- issue: Неявное указание в hoc
  choice: Сохранить как «это»
  alternative: Конкретизировать предмет речи по контексту
  rationale: Источник оставляет референт указательного местоимения зависимым от контекста; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис краткий и разговорно естественный; архаизация ограничена звательной формой «Господи». Открытое тире сохраняет незавершённость фразы на границе стиха.
