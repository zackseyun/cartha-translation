  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: ru
  text: славы Всевышнего, благодаря которой все начнут видеть то, что было поставлено перед ними. Срок
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: claritatis Altissimi
  choice: славы Всевышнего
  rationale: Родительный оборот передан прямо; claritas в данном контексте естественно означает сияющую славу.
- source_word: unde
  choice: благодаря которой
  rationale: Сохраняет связь со «славой» и передаёт значение источника или средства, посредством которого становится возможным видение.
- source_word: omnes incipiant uidere
  choice: все начнут видеть
  rationale: Прямо передаёт omnes, начинательность incipiant и инфинитив uidere.
- source_word: quae anteposita sunt
  choice: то, что было поставлено перед ними
  rationale: Сохраняет пассивную форму и намеренно не уточняет, что именно было представлено или помещено перед всеми.
- source_word: Spatium
  choice: Срок
  rationale: В начале следующего предложения обозначает отрезок времени; «срок» естественнее по-русски, чем буквальное «пространство».
