  text: 'But to you alone I showed these things. Then I answered and said[a], “Lord, then I said, and now I say:'
translation:
  language: ru
  text: 'Но только тебе Я показал всё это. Я ответил и сказал: «Господи, я говорил тогда и говорю теперь:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tibi autem soli
  choice: Но только тебе
  rationale: Передаёт противопоставительное autem и исключительное soli естественным современным русским выражением.
- source_word: ostendi haec
  choice: Я показал это
  rationale: Единственное «это» по-русски естественно охватывает совокупность показанного; прописная «Я» указывает на речь Бога в контексте.
- source_word: respondi ... et dixi
  choice: я ответил и сказал
  rationale: Сохраняет формульную двойную конструкцию латинского текста, не сводя её к одному глаголу.
- source_word: tunc ... et nunc
  choice: тогда ... и ... теперь
  rationale: Сохраняет риторическое сопоставление прошлого высказывания с нынешним, засвидетельствованное также древними дочерними версиями.
theological_decisions:
- issue: Кто говорит в первой фразе
  choice: «Я» с прописной буквы как указание на Бога
  alternative: «я» со строчной буквы
  rationale: По смене говорящих следующая фраза принадлежит Ездре, отвечающему Господу; первая продолжает речь божественного собеседника. Прописная буква — редакционная норма русского библейского регистра, а не добавление нового титула.
- issue: Синтаксическое место tunc
  choice: «я говорил тогда и говорю теперь»
  alternative: «тогда я ответил и сказал… и теперь говорю»
  rationale: Буквальный латинский порядок несколько шероховат; противопоставление tunc и nunc лучше сохраняет вероятный исходный смысл и не устраняет временное напряжение фразы.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формульное «ответил и сказал» сохранено ради близости к источнику; двоеточие оставляет фразу открытой к продолжению следующего стиха.
