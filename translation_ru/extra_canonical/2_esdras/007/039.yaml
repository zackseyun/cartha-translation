  terminology: «День» корректно подхватывает непосредственно предшествующее die iudicii («день суда»). Названия небесных светил переданы нейтрально и точно. Конъюнктив habeat не требует специального модального перевода в русском; характеристика через «такой день, в который…» сохраняет его обобщающе-качественный оттенок.
