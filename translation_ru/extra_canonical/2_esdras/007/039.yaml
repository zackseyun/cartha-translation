lexical_decisions:
- source_word: Hic
  choice: Это
  rationale: Проксимальное указательное слово передано как «это», а не «то»; подразумеваемое существительное «день» восстанавливается из непосредственно предшествующего die iudicii.
- source_word: talis
  choice: такой день
  rationale: Сохраняет качественное значение talis и естественно связывает фразу с упомянутым днём суда.
- source_word: qui neque solem [habeat] neque lunam, neque stellas
  choice: когда не будет ни солнца, ни луны, ни звёзд
  rationale: Временная конструкция с «когда» по-русски естественнее буквального «который не имеет» применительно ко дню; повторяющееся neque передано усилительным рядом «ни… ни… ни».
