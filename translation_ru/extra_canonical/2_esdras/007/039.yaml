  source_fidelity: 'Латинское Hic talis (с подразумеваемым dies из die iudicii) указывает на «этот/это», а не на «тот». Однако в представленном фрагменте нет основания вводить будущее время «будет»: связка подразумевается, а относительное habeat характеризует день. Русское «в который нет» естественно передаёт относительную связь qui и не превращает её в предсказание.'
