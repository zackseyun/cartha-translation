source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: ru
  text: 'Седьмая ступень, превосходящая все названные выше: они будут ликовать с уверенностью, уповать и не быть посрамлёнными, радоваться без страха, потому что спешат увидеть лицо Того, Кому служили при жизни и от Кого, облечённые славой, должны получить свою награду.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от Кого они, прославленные, должны получить награду». Слово «прославленные» относится к получающим награду, а не к награде.'
    reason: Уточняет, что латинское gloriosi грамматически характеризует праведников, а не mercedem («награду»).
lexical_decisions:
- source_word: ordo
  choice: ступень
  rationale: В контексте последовательных состояний или степеней блаженства «ступень» естественнее русского «порядок» и сохраняет идею седьмой позиции в перечислении.
- source_word: exultabunt cum fiducia
  choice: будут ликовать с уверенностью
  rationale: Передаёт и бурную радость exultabunt, и уверенность/дерзновение fiducia без конфессионального уточнения.
- source_word: confidebunt non confusi
  choice: уповать, не оставаясь в стыде
  rationale: Confidere означает доверять или уповать; confusi в данном сочетании выражает не просто замешательство, а постыжение, которого уповающие не испытают.
- source_word: gaudebunt non reuerentes
  choice: радоваться без страха
  rationale: В контексте приближения к Божьему лицу revereri имеет оттенок боязни и трепета; формулировка сохраняет отличие от предыдущего упования без постыжения.
- source_word: festinant uidere uultum
  choice: спешат увидеть лицо
  rationale: Прямо передаёт festinant и библейски значимое, но понятное выражение «увидеть лицо».
- source_word: gloriosi
  choice: облечённые славой
  rationale: Прилагательное относится к получающим награду, а не к самой награде; оборот ясно передаёт их прославленное состояние.
- source_word: mercedem recipere
  choice: получить свою награду
  rationale: Merces здесь означает воздаяние/награду; «награда» доступна современному читателю, а местоимение делает русскую фразу естественной.
theological_decisions:
- issue: К кому относится gloriosi
  choice: 'к праведникам: «облечённые славой»'
  alternative: «получить славную награду»
  rationale: Латинское gloriosi — форма именительного падежа множественного числа и грамматически характеризует субъект, тогда как mercedem стоит в винительном падеже единственного числа.
- issue: Смысл non confusi
  choice: уповающие не останутся в стыде
  alternative: «не будут смущены»
  rationale: Выбрана библейская смысловая связь упования с отсутствием постыжения; при этом текст не объясняет механизм их оправдания и не снимает богословское напряжение.
- issue: Упоминание лица Бога
  choice: «лицо Того» с прописной буквы
  alternative: «его лицо»
  rationale: Продолжение определяет Его как Того, Кому они служили и от Кого получают награду; местоименная форма сохраняет почтительный регистр, не добавляя имени, которого здесь нет.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксис сохраняет структуру перечисления и нарастание радости, уверенности и бесстрашия. Прописная буква в «Того» служит ясности референции и соответствует принятому русскому религиозному регистру.
