source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: ru
  text: 'Так же и с творением, обещанным Мною: Я буду радоваться о немногих, которые будут спасены[a], потому что именно они ныне сделали славу Мою более господствующей и через них ныне называется Моё имя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые спасены».'
    reason: Сохраняет засвидетельствованный альтернативный способ передачи, хотя латинское saluabuntur буквально стоит в будущем времени.
lexical_decisions:
- source_word: repromissa creatura
  choice: творении, обещанном Мною
  rationale: Передаёт пассивную конструкцию и явно выраженного деятеля a me, сохраняя образ обещанного творения.
- source_word: iocundabor super paucis
  choice: Я буду радоваться о немногих
  rationale: Сохраняет будущее время и смысл радости по поводу немногих, не сглаживая акцент на их малом числе.
- source_word: saluabuntur
  choice: будут спасены
  rationale: Точно передаёт будущее время пассивного индикатива.
- source_word: gloriam meam nunc dominatiorem fecerunt
  choice: ныне сделали славу Мою ещё более великой
  rationale: Сохраняет сравнительную степень dominatiorem и каузативность fecerunt; буквальное «более господствующей» по-русски звучало бы неестественно применительно к славе.
- source_word: per quos nunc nomen meum ... [nominatur]
  choice: через них ныне именуется Моё имя
  rationale: Следует сохранившейся формулировке и консультационному тексту, удерживая повтор nunc и намеренно не заменяя выражение более толковательным «призывается».
theological_decisions:
- issue: Временная отнесённость спасения
  choice: которые будут спасены
  alternative: которые спасены
  rationale: Форма saluabuntur грамматически обозначает будущее спасение; настоящее время допустимо лишь как менее точный вариант.
- issue: Смысл усиления Божьей славы
  choice: сделали славу Мою ещё более великой
  alternative: сделали славу Мою более господствующей
  rationale: Выбран естественный русский оборот, сохраняющий сравнительный смысл, но не навязывающий учение о том, будто Божья слава онтологически зависит от спасённых.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены повтор «ныне», сравнительная форма и несколько необычная формула «именуется Моё имя», поскольку они отражают напряжённую и местами шероховатую латинскую конструкцию.
