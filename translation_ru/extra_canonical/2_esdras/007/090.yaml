  text: 'the danger, that they might perfectly keep the law of the Lawgiver. Therefore this is concerning them:'
translation:
  language: ru
  text: 'опасность того, что они могли бы в совершенстве соблюдать закон Законодателя. Поэтому вот что касается их:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: опасность
  rationale: Прямо передаёт латинское существительное и сохраняет фрагментарную связь с предшествующим контекстом.
- source_word: uti perfecte custodirent
  choice: чтобы они в совершенстве соблюдали
  rationale: Передаёт целевое значение uti с сослагательным наклонением; «соблюдали» естественно сочетается с законом, а «в совершенстве» сохраняет усиление perfecte.
- source_word: legislatoris legem
  choice: закон Законодателя
  rationale: Сохраняет выразительный повтор корня и титульное обозначение дающего закон.
- source_word: Propter quod hic de his
  choice: Поэтому вот что относится к ним
  rationale: Передаёт вывод Propter quod и намеренно не добавляет отсутствующее в источнике слово «учение»; hic понимается как указание на последующее содержание.
theological_decisions:
- issue: Обозначение законодателя
  choice: Законодатель
  alternative: законодатель
  rationale: Прописная буква уместна при употреблении слова как обозначения Бога, не добавляя конфессионально специфического толкования.
- issue: Содержание заключительной формулы
  choice: вот что относится к ним
  alternative: вот что сказано о них
  rationale: Выбран более нейтральный оборот, поскольку латинский текст не содержит глагола «сказано» и допускает краткую указательную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Начальная строчная буква и синтаксическая незавершённость сохранены, поскольку исходный отрывок начинается внутри предложения; двоеточие в конце указывает на продолжение.
