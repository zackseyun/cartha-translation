review_pass:
  verdict: approve
  source_fidelity: «Они обманули ту, которую приняли» точно передаёт fraudauerunt eam quam acceperunt, сохраняя женский род и нераскрытый референт eam. «И что они смогут сказать на суде или как ответят в последние времена?» верно воспроизводит Et quid habebunt dicere in iudicio, vel quo- и продолжение, известное по английской контрольной версии; сохранены два параллельных вопроса, будущее время и нейтральное «на суде».
  naturalness: Текст звучит как современный литературный русский с уместной библейской краткостью. Формула «И что они смогут сказать» немного подчёркивает возможность, но в вопросительном контексте естественно передаёт латинское habebunt dicere и не меняет смысла. «Последние времена» несколько возвышенно, но нормативно и соответствует эсхатологическому регистру.
  terminology: «Обманули», «на суде» и «последние времена» не вносят конфессиональных толкований. Сноска корректно привязана к «И что» и обозначает допустимую, но не предпочтительную усилительную передачу Et quid; основной текст обоснованно сохраняет простое «И что».
