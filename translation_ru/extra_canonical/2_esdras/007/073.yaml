source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fraudauerunt eam quam acceperunt. Et quid habebunt dicere in iudicio, uel quo-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: ru
  text: Они обманули ту, которую приняли. И что[a] они смогут сказать на суде или как ответят в последние времена?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И что же».'
    reason: Отмечает допустимую смысловую передачу Et quid, при этом основной текст сохраняет простое сочинительное «И что» согласно латинскому тексту и последней редакционной оценке.
lexical_decisions:
- source_word: fraudauerunt
  choice: обманули
  rationale: Передаёт прямое значение латинского глагола fraudare без добавления не выраженного в тексте объекта лишения.
- source_word: eam quam acceperunt
  choice: ту, которую приняли
  rationale: Сохраняет женский род местоимения и неопределённость его референта; «приняли» естественно передаёт acceperunt, не уточняя, что именно или кого именно они получили.
- source_word: Et quid habebunt dicere
  choice: И что они смогут сказать
  rationale: Сохраняет сочинительное Et («И») и естественно по-русски передаёт латинскую конструкцию habebunt dicere в будущем времени.
- source_word: in iudicio
  choice: на суде
  rationale: Обычное и контекстуально уместное соответствие латинскому выражению, без преждевременного уточнения характера суда.
- source_word: in nouissimis temporibus
  choice: в последние времена
  rationale: Следует засвидетельствованному в консультационном слое продолжению фразы и сохраняет множественное число эсхатологического выражения.
theological_decisions:
- issue: Референт женского местоимения eam
  choice: Сохранить как «ту, которую приняли»
  alternative: Уточнить предполагаемый референт, например «душу» или «жизнь»
  rationale: Данный латинский фрагмент не называет референт; его догматическое или контекстуальное уточнение сняло бы подлинную неоднозначность текста.
- issue: Характер суда
  choice: «на суде» без определения
  alternative: «на последнем суде» или «на Божьем суде»
  rationale: Латинское in iudicio само по себе не содержит этих уточнений; эсхатологический оттенок выражен последующей фразой.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранены параллелизм двух вопросов и неоднозначный женский референт; богословские уточнения не внесены.
