  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: ru
  text: 'Блаженны те, кто ныне живёт и соблюдает установления Твои. Но что до тех, о ком была моя молитва: кто из живущих ныне не согрешил и кто из рождённых не преступил Твоего завета?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается после слов «кто из рождённых»; слова «не преступил Твоего завета?» переданы по засвидетельствованному продолжению стиха в консультационном тексте и требуют сверки с продолжением латинской рукописной строки.
    reason: Необходимо явно отметить, что заключительные слова отсутствуют в приведённом пользователем фрагменте латинского источника, хотя содержатся в предоставленном полном английском тексте стиха.
lexical_decisions:
- source_word: beati
  choice: Блаженны
  rationale: Традиционное и вместе с тем понятное соответствие латинскому обозначению благословенного состояния.
- source_word: praesentes
  choice: те, кто ныне живёт / из живущих ныне
  rationale: В данном рассуждении о смертных людях передаёт не просто физическое присутствие, а принадлежность к ныне живущим; повтор источника сохранён.
- source_word: obseruantes quae a te constituta sunt
  choice: соблюдает установления Твои
  rationale: Естественно и достаточно близко передаёт соблюдение того, что установлено Богом, без необоснованного сужения до конкретного корпуса заповедей.
- source_word: de quibus erat oratio mea
  choice: о тех, о ком была моя молитва
  rationale: Oratio может означать речь или молитву; контекст обращения к Богу позволяет выбрать «молитва», сохраняя направленность ходатайства.
- source_word: peccauit
  choice: согрешил
  rationale: Прямое и общепонятное соответствие религиозно-нравственному смыслу глагола.
- source_word: quis natus
  choice: кто из рождённых
  rationale: Сохраняет обобщённую формулировку источника и не вводит гендерно ограниченного «какой мужчина».
theological_decisions:
- issue: Отношение человеческой греховности к блаженству соблюдающих Божьи установления
  choice: Сохранён резкий переход от похвалы соблюдающим установления к риторическому утверждению всеобщей греховности.
  alternative: Сгладить напряжение, добавив пояснение о степени или времени послушания.
  rationale: Источник не разрешает это богословское напряжение, поэтому перевод не должен привносить согласующее толкование.
- issue: Значение oratio mea
  choice: «моя молитва»
  alternative: «моя речь» или «мои слова»
  rationale: Речь обращена к Богу и касается людей, о которых говорящий ходатайствует; «молитва» естественна в контексте, хотя латинское слово само по себе допускает более широкое значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; обращение к Богу отмечено традиционными прописными формами «Твои/Твоего».
