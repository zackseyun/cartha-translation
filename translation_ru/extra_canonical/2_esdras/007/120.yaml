  source_fidelity: «Вечная надежда» точно передаёт perennis spes; «нам предвозвещена» адекватно передаёт praedicta est nobis. Однако оказались ослабляет результативное facti sumus («стали»), а «поскольку ... неужели» в данном виде несколько тяжеловесно для русского риторического вопроса.
  naturalness: «И коль скоро ... неужели ...?» — естественная литературная форма риторического вопроса при сохранении причинного значения quoniam. «Стали совершенно пустыми» звучит яснее и ближе к исходному глаголу, чем «оказались ...».
  terminology: «Пустыми» удачно избегает вводящего в заблуждение современного значения «тщеславными» и сохраняет поле vani («пустые, суетные, тщетные»). В сноске «тщетными» как характеристика людей менее естественно; «суетными» лучше передаёт традиционный библейский регистр, не устраняя основное значение.
  issues:
