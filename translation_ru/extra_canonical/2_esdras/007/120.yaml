  text: Et quoniam praedicta est nobis perennis spes, nos vero pessime vani facti sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/120.yaml
  text: And if everlasting hope has been foretold to us[a], but we have become utterly vain?
translation:
  language: ru
  text: И коль скоро нам предвозвещена вечная надежда, неужели мы стали совершенно пустыми[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенно суетными».'
    reason: Латинское vani допускает значения «пустые», «суетные», «тщетные»; основной текст сохраняет образ пустоты, а вариант отмечает традиционное библейское смысловое поле.
lexical_decisions:
- source_word: quoniam
  choice: поскольку
  rationale: Передаёт причинное значение латинского союза («поскольку, так как»), не превращая его без достаточного основания в условное «если».
- source_word: praedicta est nobis
  choice: нам предвозвещена
  rationale: Сохраняет значение заранее возвещённого обетования и возвышенный библейский регистр.
- source_word: perennis spes
  choice: вечная надежда
  rationale: Естественно и точно передаёт надежду, которая пребывает всегда.
- source_word: nos vero
  choice: неужели мы сами
  rationale: «Сами» подчёркивает противопоставление, выраженное vero, а «неужели» естественно оформляет риторический вопрос.
- source_word: pessime vani facti sumus
  choice: оказались совершенно пустыми
  rationale: «Пустыми» сохраняет образ внутренней пустоты и тщетности в vani, не сводя его к современному значению «тщеславными» и не усиливая до «никчёмными»; «совершенно» передаёт pessime.
theological_decisions:
- issue: Соотношение вечной надежды и человеческой пустоты
  choice: Сохранён неразрешённый риторический контраст
  alternative: Переформулировать как объяснение того, почему надежда не исполнилась для людей
  rationale: Латинский текст ставит напряжённый вопрос и сам в этом стихе не даёт богословского разрешения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Вопросительная форма и смысловая шероховатость исходного риторического противопоставления сохранены.
