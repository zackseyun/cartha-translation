    rationale: Facti sumus обозначает становление, а не только обнаружившееся состояние.
  - severity: low
    issue: Не вполне естественная связка «поскольку ... неужели»
    rationale: При корректном причинном значении quoniam более плавна конструкция «коль скоро ... неужели ...?».
  - severity: low
    issue: Вариант сноски «тщетными»
    rationale: В современном русском «тщетный» обычно относится к попыткам, усилиям или надеждам, а не к людям; «суетными» здесь идиоматичнее.
