  yaml_path: translation/extra_canonical/2_esdras/007/015.yaml
  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: ru
  text: Итак, почему же ты приходишь в смятение, ведь ты подвержен тлению? И почему тревожишься, ведь ты смертен?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: смущаешься
  rationale: Передаёт душевное смятение и внутреннюю растерянность, сохраняя вопросительную форму и параллелизм стиха.
- source_word: corruptibilis
  choice: подвержен тлению
  rationale: Естественное современное выражение, точно передающее не просто испорченность, а свойство смертного существа подвергаться распаду.
- source_word: moveris
  choice: тревожишься
  rationale: В данном параллельном контексте латинский глагол означает внутреннее волнение или потрясение; «тревожишься» звучит естественно и не вызывает характерной для буквального «движешься» двусмысленности.
- source_word: mortalis
  choice: смертен
  rationale: Прямой и общеупотребительный эквивалент, сохраняющий антропологическое утверждение источника.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Два параллельных риторических вопроса сохранены; причинное cum передано естественным «ведь». Различие между conturbaris и moveris обозначено словами «смущаешься» и «тревожишься», без чрезмерного разведения близких понятий.
