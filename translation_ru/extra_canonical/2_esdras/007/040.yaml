- source_word: uentum
  choice: ветра
  rationale: Прямое соответствие латинскому ventum.
- source_word: aquam
  choice: воды
  rationale: Прямое соответствие латинскому aquam; перевод сохраняет границу стиха и не добавляет «воздуха», относящегося к следующему стиху.
