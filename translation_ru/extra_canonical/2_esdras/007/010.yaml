base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/010.yaml
  text: And I said[a], “So it is, Lord.” And he said to me, “So also is Israel’s portion.”
translation:
  language: ru
  text: 'И я сказал: «Так, Господи[a]». И он сказал мне: «Такова и доля Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин».'
    reason: Латинское domine может быть почтительным обращением не только к Богу; примечание сохраняет неоднозначность, отмеченную в английском audit trail.
lexical_decisions:
- source_word: sic
  choice: так / такова
  rationale: Первое sic естественно передано кратким подтверждением «Так», а второе — именной конструкцией «Такова… доля», сохраняющей параллелизм и смысл латинского текста.
- source_word: domine
  choice: Господи
  rationale: Звательная форма прямого обращения; прописная буква соответствует контексту почтительного обращения к небесному собеседнику.
- source_word: Israhel pars
  choice: доля Израиля
  rationale: Pars здесь обозначает выпавшую Израилю участь или долю; «доля» сохраняет краткость и допускает присущую источнику смысловую широту.
theological_decisions:
- issue: Смысл выражения «Israhel pars»
  choice: доля Израиля
  alternative: участь Израиля
  rationale: «Доля» ближе к основному значению pars и не уточняет, идет ли речь исключительно о судьбе, наследии или положении Израиля.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским звучанием. Повтор sic передан естественно для русского языка без устранения смыслового параллелизма.
