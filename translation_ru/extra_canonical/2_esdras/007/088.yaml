translation:
  language: ru
  text: которого в последние времена начнут судить. Ибо тех, кто соблюдал пути…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинский источник здесь обрывается внутри слова seruaue- («соблюдал…»); поэтому конец фразы не сохранился.
    reason: Объяснить читателю намеренную незавершённость текста и не восстанавливать утраченное продолжение предположительно.
lexical_decisions:
- source_word: quem
  choice: которого
  rationale: Сохранены мужской род и единственное число латинского относительного местоимения; стих начинается в середине предложения, поэтому его антецедент находится в предшествующем тексте.
- source_word: in nouissimis temporibus
  choice: в последние времена
  rationale: Буквальная и естественная передача эсхатологического временного выражения без уточнения, которого нет в источнике.
- source_word: iudicari
  choice: судить
  rationale: Латинский пассивный инфинитив передан русской неопределённо-личной конструкцией «начнут судить», которая сохраняет значение «начнёт подвергаться суду» и естественно сочетается с «которого».
- source_word: eorum qui uias seruaue-
  choice: тех, кто соблюдал пути…
  rationale: Родительный eorum передан формой «тех», uias seruare — обычным библейским сочетанием «соблюдать пути»; синтаксическая незавершённость сохранена, поскольку латинский текст обрывается внутри слова.
theological_decisions:
- issue: Объект суда и действующее лицо
  choice: «которого … начнут судить»
  alternative: «который … начнёт подвергаться суду»
  rationale: Неопределённо-личная конструкция естественна по-русски и не называет судей, которых данный фрагмент прямо не определяет.
- issue: Содержание «путей»
  choice: не дополнять определением
  alternative: «пути Всевышнего»
  rationale: В сохранившемся фрагменте после uias определение отсутствует; его добавление привнесло бы чтение из иной текстовой формы.
translation_notes:
  register: Современный литературный русский язык с сдержанным библейским звучанием. Начальная и конечная незавершённость фрагмента сохранена; утраченный текст не восполняется.
