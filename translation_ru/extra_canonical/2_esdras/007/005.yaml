  naturalness: После замены союзной конструкции на ряд однородных инфинитивов фраза остаётся естественной для современного литературного русского и сохраняет риторический вопрос оригинала. «Выйти на простор» удачно передаёт in latitudinem venire в данном пространственном образе.
  terminology: «Овладеть им» приемлемо передаёт dominari eius в образном контексте и не вносит доктринального истолкования. «Теснина» и «простор» сохраняют намеренный контраст узкого прохода и широты.
