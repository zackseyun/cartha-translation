  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: ru
  text: Ведь если кто желает войти в море[a], увидеть его или овладеть им, то как он сможет выйти на простор, если не пройдёт через теснину?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если кто действительно желает войти в море, увидеть его или овладеть им».'
    reason: Латинское volens voluerit может выражать усиление желания; основной текст передаёт его естественным русским «желает».
lexical_decisions:
- source_word: volens voluerit
  choice: хочет
  rationale: Удвоенная латинская конструкция выражает решительное желание, однако в современном русском естественно передаётся простым «хочет» без избыточного усиления.
- source_word: ingredi mare
  choice: войти в море
  rationale: Сохраняет прямой объект латинского ingredi и образ вступления в море.
- source_word: dominari eius
  choice: овладеть им
  rationale: Передаёт значение dominari с родительным eius как установление власти или господства над морем, сохраняя образ исходника.
- source_word: in latitudinem venire
  choice: выйти на простор
  rationale: Естественно передаёт пространственное противопоставление latitudo и angustum — простора и теснины.
- source_word: angustum
  choice: теснина
  rationale: Существительное сохраняет образ узкого прохода и ясно противопоставляется «простору».
theological_decisions:
- issue: Образ узкого пути к широкому пространству
  choice: Сохранить пространственную метафору без истолкования
  alternative: Передать как нравственный или спасительный «трудный путь»
  rationale: Сам стих формулирует образ, а его богословское применение определяется контекстом; перевод не должен заранее снимать эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранено риторическое построение вопроса и контраст между тесниной и простором; архаизмы и конфессионально окрашенные толкования исключены.
