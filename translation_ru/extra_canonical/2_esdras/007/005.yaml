  rationale: 'Исправлена синтаксическая связь: «увидеть» и «овладеть» поставлены в один ряд с «войти» как зависимые от «желает» инфинитивы. Сноска сохранена только для возможного усиленного оттенка volens voluerit и приведена в соответствие с исходным текстом.'
