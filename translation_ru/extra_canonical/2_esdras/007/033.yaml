    issue: «будет отнято» для congregabitur
    rationale: Глагол congregabitur означает «будет собрано/соберётся». Контекст допускает смысл прекращения или устранения, но «отнято» конкретизирует его сильнее, чем требуется источником.
  - severity: low
    issue: Несоответствие якоря английской сноски её содержанию
    rationale: В English POB marker [a] стоит после «seat of judgment», но текст сноски объясняет long-suffering. Русское примечание должно быть привязано к «долготерпению».
