base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: ru
  text: И явится Всевышний на престоле суда, и милости пройдут, и долготерпение будет прекращено[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет собрано»; в данном контексте: прекращено.'
    reason: Передаёт буквальный образ латинского congregabitur, не навязывая более узкое значение «будет отнято».
lexical_decisions:
- source_word: revelabitur
  choice: явится
  rationale: 'Передаёт будущее страдательной формы в естественной русской эсхатологической речи: Всевышний станет явно присутствующим перед всеми.'
- source_word: super sedem iudicii
  choice: на престоле суда
  rationale: Sedem буквально означает «сиденье, место», но в отношении Всевышнего и суда русское «престол суда» сохраняет образ судебного восседания и звучит достойно.
- source_word: pertransibunt misericordiae
  choice: милости пройдут
  rationale: Сохраняет множественное число misericordiae и буквальный образ прохождения или прекращения милостей, не уточняя сверх источника, исчезнут ли они или минует их время.
- source_word: longanimitas congregabitur
  choice: долготерпение будет отнято
  rationale: Буквальное «будет собрано» в данном параллелизме неясно по-русски; вероятный семитизм обозначает устранение или прекращение долготерпения. «Будет отнято» сохраняет пассивность и эсхатологический смысл сворачивания.
theological_decisions:
- issue: Прекращение милости и долготерпения при последнем суде
  choice: 'Сохранить резкое утверждение источника: «милости пройдут» и «долготерпение будет отнято»'
  alternative: Смягчить как «время милости и долготерпения закончится»
  rationale: Источник персонифицирует или объективирует сами misericordiae и longanimitas; добавление «время» рационализировало бы богословское напряжение и внесло отсутствующее пояснение.
- issue: Значение congregabitur
  choice: «будет отнято»
  alternative: «будет собрано» / «будет собрано воедино»
  rationale: Латинская форма буквально связана с собиранием, однако в контексте параллельной утраты милостей, вероятно, калькирует семитский глагол со значением «забирать, устранять». Выбор передаёт контекстуальный смысл, не добавляя субъекта действия.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Синтаксический параллелизм трёх будущих форм сохранён; архаизмы и конфессионально окрашенные уточнения не вводились.
