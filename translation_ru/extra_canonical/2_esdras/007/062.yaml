base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: ru
  text: 'И я ответил: «О земля, зачем ты породила, если разум создан из праха, как и прочие создания?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondit et dixi
  choice: И я ответил
  rationale: Латинская парная формула буквально означает «И я ответил и сказал»; в современном русском естественно и без потери смысла передаётся одним глаголом «ответил».
- source_word: O tu terra
  choice: О земля
  rationale: Сохранено прямое риторическое обращение к земле.
- source_word: quid peperisti
  choice: для чего ты породила нас
  rationale: В данном риторическом контексте quid имеет смысл «зачем/для чего»; объект «нас» восстановлен по смыслу вопроса и по контексту человеческой смертности. Глагол «породила» сохраняет образ земли как рождающей.
- source_word: sensus
  choice: разум
  rationale: Sensus здесь обозначает человеческую способность мыслить и понимать; «разум» ясно передаёт её, не сужая значение до чувственного восприятия.
- source_word: ex pulvere ... sicut et alia creatura
  choice: как и всё остальное творение, создан из праха
  rationale: Формулировка следует засвидетельствованному продолжению стиха и сохраняет сопоставление человеческого разума со всем прочим творением.
theological_decisions:
- issue: Отношение разума к праху и творению
  choice: «разум, как и всё остальное творение, создан из праха»
  alternative: «разум сотворён из праха, как и прочие создания»
  rationale: 'Сохранено напряжение исходного риторического вопроса: разум возвышает человека, однако имеет то же тварное и земное происхождение; текст не объясняет и не разрешает это напряжение.'
translation_notes:
  register: Современный литературный русский язык с достоинством риторической жалобы. Архаическое удвоение «ответил и сказал» устранено; обращение «О земля» и образ рождения сохранены.
