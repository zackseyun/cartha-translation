  source_fidelity: Добавленное «нас» отсутствует как в латинском quid peperisti, так и в английской контрольной формулировке. Хотя контекст подразумевает человеческий род, исходный вопрос оставляет объект глагола невыраженным; это следует сохранить. Остальная передача верно отражает риторическое обращение, причинный смысл quid («зачем») и сравнение разума с прочими созданиями.
  naturalness: «О земля, зачем ты породила» — допустимая для возвышенно-риторического контекста эллиптическая фраза и звучит естественнее, чем буквальное «что ты породила». «Разум» уместен для sensus в данном контексте.
  terminology: «Разум» и «создан из праха» точно и нейтрально передают sensus и factus est de pulvere. «Прочие создания» яснее сохраняет сопоставление с cetera creatura, не превращая его в абстрактное «творение».
