  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: ru
  text: 'А теперь пойми из собственных слов: ведь ты сказал, что разумение растёт вместе с нами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de sermonibus tuis
  choice: из собственных слов
  rationale: Передаёт смысл латинского оборота — сделать вывод на основании сказанного самим собеседником; «собственных» естественно указывает на его прежние слова.
- source_word: intellege
  choice: пойми
  rationale: Прямое и естественное соответствие повелительной форме единственного числа.
- source_word: sensus
  choice: разумение
  rationale: В контексте обозначает способность понимать или достигнутое понимание; «разумение» сохраняет смысловую широту лучше, чем более узкое «знание».
- source_word: nobiscum crescit
  choice: растёт вместе с нами
  rationale: Формально и естественно сохраняет образ совместного роста, не уточняя без основания, идёт ли речь о возрасте, опыте или духовном развитии.
