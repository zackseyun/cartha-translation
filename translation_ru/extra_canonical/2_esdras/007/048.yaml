    rationale: Один глагол управляет разными предложными конструкциями; замена на «повело нас к тлению и по путям смерти» устраняет шероховатость, сохраняя исходные образы и смысл.
  - severity: low
    issue: «И всё это случилось не с немногими» несколько размывает референт латинского hoc.
    rationale: «И это постигло не немногих...» естественнее по-русски и яснее выражает, что описанное состояние/воздействие касается почти всех сотворённых.
