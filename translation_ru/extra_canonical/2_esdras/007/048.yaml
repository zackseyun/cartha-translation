source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: ru
  text: Ибо в нас возросло злое сердце, которое отдалило нас от Бога[a], повело нас к тлению и по путям смерти, показало нам стези погибели и далеко увело нас от жизни. И это постигло не немногих, а почти всех, кто был сотворён».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся латинском тексте: «от этого» или «от них»; древние восточные переводы поддерживают чтение «от Него», то есть от Бога.'
    reason: Текстологически значимое расхождение между латинской формой ab his и согласным свидетельством древних дочерних версий.
lexical_decisions:
- source_word: cor malum
  choice: злое сердце
  rationale: Прямо передаёт латинский образ и сохраняет его нравственно-богословскую ёмкость.
- source_word: Increuit ... in nos
  choice: в нас возросло
  rationale: Сохраняет образ роста внутри человека и естественно звучит по-русски.
- source_word: abalienauit
  choice: отдалило
  rationale: Передаёт отчуждение и удаление, не добавляя более узкого догматического толкования.
- source_word: in corruptionem
  choice: к тлению
  rationale: Сохраняет широкий смысл порчи, распада и смертности, присущий латинскому corruptio.
- source_word: itinera mortis ... semitas perditionis
  choice: пути смерти ... стези погибели
  rationale: Сохраняет параллелизм исходного текста; «стези» придают фразе уместную библейскую торжественность, оставаясь понятными.
- source_word: longe fecit nos a uita
  choice: далеко увело нас от жизни
  rationale: Естественно воспроизводит пространственную метафору удаления от жизни.
theological_decisions:
- issue: Объект отчуждения в ab his
  choice: от Бога
  alternative: от этого / от них
  rationale: Сохранившееся латинское ab his буквально означает «от этого/от них», однако согласное свидетельство сирийской, эфиопской, арабской и армянской версий указывает на лежавшее в основе «от Него», то есть от Бога. Вероятнее всего, латинский текст отражает раннее смешение греческих форм, поэтому в основном тексте восстановлено исходное чтение, а латинское засвидетельствованное чтение отмечено в сноске.
- issue: Охват действия злого сердца
  choice: почти со всеми, кто был сотворён
  alternative: почти со всем творением
  rationale: Формулировка сохраняет личный и универсальный охват английского консультационного текста, не распространяя утверждение без необходимости на нечеловеческое творение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксический параллелизм оригинала сохранён; архаизация ограничена словом «стези», понятным в данном поэтическом контексте.
