  text: ты расположишь их для себя по их числу, свинца же и глины много. И
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad numerum eorum
  choice: по их числу
  rationale: Передаёт соотнесённость действия с числом упомянутых предметов, не уточняя сверх источника, идёт ли речь о счёте, количестве или порядке.
- source_word: compones eos tibi
  choice: ты расположишь их для себя
  rationale: Будущее время и значение componere («располагать, приводить в порядок») сохранены; tibi передано как «для себя».
- source_word: plumbum
  choice: свинца
  rationale: Прямое соответствие латинскому названию металла; родительный падеж естественен при безличной количественной конструкции «много».
- source_word: fictile
  choice: глины
  rationale: В данном сопоставлении с материалами субстантивированное fictile естественно передать как «глина»; более буквальное «глиняное» без названного предмета по-русски неясно.
- source_word: abundat
  choice: много
  rationale: Естественно передаёт значение изобилия в современной русской речи без излишне книжного «изобилует».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно книжным библейским достоинством. Начальная строчная буква и конечное «И» сохранены, поскольку исходный фрагмент начинается и заканчивается внутри более широкого предложения. Неподтверждённая латинским источником прежняя альтернативная формулировка в сноску не включена.
