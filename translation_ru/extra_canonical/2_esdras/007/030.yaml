  terminology: «Век» сохраняет апокалиптическую многозначность saeculum и не подменяет её более узким «миром». «Древнее безмолвие» точно и естественно для antiquum silentium. Богословски нагруженных терминов, требующих иной стандартизации, в стихе нет.
