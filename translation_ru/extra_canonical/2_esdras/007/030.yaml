  source_fidelity: 'Перевод точно передаёт основные элементы латинского текста: saeculum — «век», convertetur — «вернётся», antiquum silentium — «древнее безмолвие», septem diebus — «на семь дней». Оборот «как при первых началах» сохраняет намеренно необычное множественное число initiis и не сужает космогоническую отсылку. «Так что никого не останется» уместно передаёт результативное прочтение nemo derelinquatur в данном контексте, не навязывая причинного объяснения.'
