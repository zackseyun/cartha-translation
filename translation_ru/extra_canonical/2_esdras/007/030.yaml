id: 2ES.7.30
reference: 2 Esdras 7:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: ru
  text: И век вернётся к древнему безмолвию на семь дней, как при первых началах, так что никого не останется.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: В данном апокалиптическом контексте обозначает нынешний мировой век или порядок; «век» сохраняет ёмкость и традиционную библейскую окраску латинского слова.
- source_word: convertetur
  choice: вернётся
  rationale: Естественно передаёт возврат к прежнему состоянию, выраженный сочетанием convertetur ... in.
- source_word: antiquum silentium
  choice: древнее безмолвие
  rationale: Близко воспроизводит образ из источника и сохраняет его торжественный, космогонический оттенок.
- source_word: in prioribus initiis
  choice: при первых началах
  rationale: Сохраняет необычное множественное число initiis и отсылку к изначальному состоянию мира, не сводя её однозначно к одному моменту творения.
- source_word: nemo derelinquatur
  choice: никого не останется
  rationale: В контексте всеобщего прекращения жизни derelinquatur означает, что никто не останется; добавление «позади» по-русски создало бы неуместный пространственный оттенок.
theological_decisions:
- issue: Что именно возвращается к безмолвию
  choice: «век» как прямое соответствие saeculum
  alternative: «мир» или «нынешний век»
  rationale: Источник допускает смысл мирового века и миропорядка; буквальное «век» сохраняет апокалиптическую многозначность, не вводя уточнения, отсутствующего в тексте.
- issue: Смысл заключительной цели/результата
  choice: «так что никого не останется»
  alternative: «так что никто не будет оставлен»
  rationale: Безличная пассивная форма в латыни допускает оба оттенка. Контекст древнего безмолвия поддерживает результативное понимание, однако перевод не уточняет причину отсутствия людей.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской возвышенностью. Синтаксис сохраняет последовательность и образность латинского текста без искусственной архаизации.
