  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: ru
  text: и стали измышлять для себя греховные ухищрения, и даже сказали, что Всевышнего нет, и не познали путей Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: proposuerunt sibi
  choice: замыслили для себя
  rationale: Передаёт намеренное полагание или устроение перед собой, не утяжеляя русский текст буквальным оборотом.
- source_word: circumventiones delictorum
  choice: хитросплетения греха
  rationale: Сохраняет образ коварных замыслов, уловок или обходных путей, связанных с грехом; латинский оборот допускает некоторую смысловую неоднозначность.
- source_word: superdixerunt
  choice: вдобавок сказали
  rationale: 'Передаёт усилительное значение super-: они не только грешили, но ещё и утверждали последующее.'
- source_word: Altissimum non esse
  choice: что Всевышнего нет
  rationale: Естественная русская передача латинского утверждения о небытии Всевышнего.
- source_word: vias eius non cognoverunt
  choice: не познали путей Его
  rationale: Сохраняет библейское значение cognoscere как глубокого познания и образ «путей» Бога.
theological_decisions:
- issue: Характер утверждения об Altissimus
  choice: «что Всевышнего нет»
  alternative: «что Всевышний не существует»
  rationale: Первый вариант естественнее и выразительнее по-русски, при этом без смягчения передаёт отрицание бытия Всевышнего.
- issue: Значение «не познали»
  choice: Сохранено «не познали», без уточнения причины
  alternative: «не знали» или «не пожелали познать»
  rationale: Латинский текст не поясняет, было ли незнание добровольным; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Инверсия и заглавная буква в местоимении «Его» поддерживают традиционный сакральный регистр, не создавая конфессиональной специфики.
