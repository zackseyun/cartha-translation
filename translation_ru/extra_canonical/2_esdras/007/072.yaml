source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: ru
  text: Итак, живущие на земле будут мучимы за то, что, имея разум, совершили беззаконие, получив заповеди, не соблюли их и, обретя закон, вероломно обошлись с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: живущие на земле
  rationale: Передаёт длительное пребывание на земле естественным современным русским оборотом.
- source_word: hinc cruciabuntur
  choice: будут мучимы за то
  rationale: Сохраняет пассивную форму и причинную связь hinc; «за то, что» естественно вводит последующее обоснование.
- source_word: sensum habentes
  choice: имея разум
  rationale: Близко передаёт обладание разумением или нравственной способностью понимать, не сужая смысла до конкретного знания.
- source_word: iniquitatem fecerunt
  choice: творили беззаконие
  rationale: Сохраняет библейскую нравственно-правовую окраску iniquitas и повторяемый характер поведения.
- source_word: mandata accipientes non seruauerunt ea
  choice: получив заповеди, не соблюдали их
  rationale: Прямо и естественно передаёт получение предписаний и отказ хранить или исполнять их.
- source_word: legem consecuti
  choice: обретя закон
  rationale: Consecuti обозначает достижение или получение; «обретя» сохраняет оттенок того, что закон стал им доступен.
- source_word: dealt deceitfully with it (consultation layer; continuation absent from supplied Latin excerpt)
  choice: поступали с ним вероломно
  rationale: Передаёт засвидетельствованный в английском консультационном слое финал без громоздкого буквального оборота; местоимение относится к закону.
theological_decisions:
- issue: Основание мучения
  choice: Причина выражена как сознательное беззаконие и нарушение данных заповедей и закона.
  alternative: Истолковать мучение как следствие одной лишь принадлежности к живущим на земле.
  rationale: Латинское quoniam связывает мучение не с самим земным жительством, а с перечисленными виновными поступками.
- issue: Значение sensum habentes
  choice: «имея разум»
  alternative: «зная истину» или «имея откровение»
  rationale: Более узкие варианты вносили бы богословское уточнение, которого само выражение не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Параллельные причастные конструкции сохранены ради риторического нарастания, но сделаны естественными для русского чтения. Представленный латинский фрагмент обрывается на et legem consecuti; заключительная мысль переведена по аудированному английскому консультационному слою, предполагающему продолжение источника.
