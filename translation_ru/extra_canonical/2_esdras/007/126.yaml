  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: ru
  text: Ведь, живя и творя беззаконие, мы не задумывались о том, что́ начнём терпеть после смерти».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem faciebamus
  choice: творили беззаконие
  rationale: Сохраняет предметное значение латинского iniquitas и повторяющееся действие, выраженное имперфектом faciebamus; сочетание естественно для возвышенной повествовательной речи.
- source_word: non enim cogitavimus
  choice: ведь ... мы не задумывались
  rationale: Передаёт пояснительное enim и смысл cogitare как обдумывания последствий, а не простого знания.
- source_word: incipientes ... pati
  choice: начнём терпеть
  rationale: Сохраняет инхоативный смысл incipere — начало посмертного страдания — без замены его значением долженствования.
- source_word: post mortem
  choice: после смерти
  rationale: Прямое и естественное соответствие латинскому выражению.
theological_decisions:
- issue: Инхоативный характер посмертного страдания
  choice: «начнём терпеть после смерти»
  alternative: «нам придётся терпеть после смерти»
  rationale: Латинский текст указывает именно на начало страдания, а не прямо на обязанность или неизбежность; перевод сохраняет эсхатологическую временную последовательность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской дикцией. Синтаксис сделан естественным, при этом сохранены причинное «ведь», длительно-повторное действие в земной жизни и начало страдания после смерти.
