translation:
  language: ru
  text: ни воздуха, ни тьмы, ни вечера, ни утра, ни лета, ни весны, ни зноя, ни зимы, ни мороза, ни холода, ни града,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aerem
  choice: воздуха
  rationale: Прямое соответствие латинскому слову; оно относится к данному стиху и не должно быть опущено.
- source_word: tenebras
  choice: тьмы
  rationale: Естественное и точное соответствие множественному латинскому существительному в этом перечне.
- source_word: sero
  choice: вечера
  rationale: По контексту временных противопоставлений означает вечер; русская форма согласована с повторяющейся конструкцией «ни… ни…».
- source_word: mane
  choice: утра
  rationale: Передаёт утро как часть суток и образует естественную пару с «вечером».
- source_word: aestatem
  choice: лета
  rationale: Обозначает сезон — лето.
- source_word: uer
  choice: весны
  rationale: Обозначает сезон — весну.
- source_word: aestum
  choice: зноя
  rationale: Здесь назван не сезон, а сильная жара; «зной» сохраняет различие между aestatem и aestum и соответствует возвышенному регистру.
- source_word: hiemem
  choice: зимы
  rationale: Прямое обозначение сезона — зимы.
- source_word: gelu
  choice: мороза
  rationale: Передаёт мороз, замерзание; сохраняет отличие от следующего frigus.
- source_word: frigus
  choice: холода
  rationale: Общее обозначение холода, отличное от более конкретного «мороза».
- source_word: 'grandinem (в источнике перенос: grandi-)'
  choice: града
  rationale: Восстановление обычного слова grandinem по переносу строки; означает атмосферные осадки в виде града.
theological_decisions: []
translation_notes:
  register: Сохранён ритмический перечень с повторением «ни», соответствующий латинской конструкции neque. Начальная строчная буква и конечная запятая отражают то, что стих представляет собой часть более длинного предложения. «Дождь» и «роса» не включены, поскольку по указанной разбивке они относятся к следующему стиху.
