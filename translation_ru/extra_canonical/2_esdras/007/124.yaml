  text: nos vero non ingrediemur, ingratis enim locis conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/124.yaml
  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: ru
  text: Но мы не войдём, ибо жили в неприятных местах?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nos vero
  choice: а мы
  rationale: Передаёт противопоставление, выраженное vero; отдельное усиление местоимения по-русски сохраняется естественно.
- source_word: non ingrediemur
  choice: не войдём
  rationale: Форма будущего времени и отсутствие прямо названного дополнения сохранены.
- source_word: ingratis ... locis
  choice: в местах, неугодных
  rationale: Ingratus здесь означает «неприятный, нежеланный, неугодный», а не «постыдный». «Неугодных» сохраняет смысл неприятия и некоторую исходную неоднозначность.
- source_word: conversati sumus
  choice: жили
  rationale: Латинское conversari в данном контексте естественно означает пребывание или жизнь в каком-либо месте.
theological_decisions:
- issue: Не названо, кому или почему эти места были неугодны
  choice: Не добавлять подразумеваемое лицо или оценщика
  alternative: «в местах, неугодных Тебе» либо «в неприятных для нас местах»
  rationale: Латинский текст не уточняет носителя оценки; добавление разрешило бы реальную смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык; вопросительная форма и напряжённая риторика оригинала сохранены. Союз «потому что» естественно передаёт пояснительное enim.
