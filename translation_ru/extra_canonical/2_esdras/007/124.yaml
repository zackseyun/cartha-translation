review_pass:
  verdict: revise
  source_fidelity: «Неугодных» без указанного лица в русском языке обычно подразумевает, что места неугодны Богу или иному оценщику, тогда как латинское ingratis этого не уточняет. Основное значение в данном сочетании — «неприятных, неблагоприятных, нежеланных». «Жили» адекватно передаёт conversati sumus, а будущее «не войдём» и отсутствие выраженного дополнения сохранены.
  naturalness: Фраза «в местах, неугодных» синтаксически возможна, но стилистически требует подразумеваемого адресата и потому звучит неестественно и направляет смысл. «В неприятных местах» — естественное современное литературное выражение и не добавляет оценщика.
  terminology: Специальных богословских терминов и имён нет. Союз «ибо» точно и литературно передаёт пояснительное enim; «но мы» сохраняет противопоставительное vero.
  issues:
  - severity: medium
    issue: «Неугодных» неудачно передаёт ingratis.
    rationale: В русском «неугодный» обычно означает «неугодный кому-либо» и легко вносит отсутствующую в латинском религиозную направленность. Ingratus здесь скорее характеризует места как неприятные или неблагоприятные.
  revised_text: Но мы не войдём, ибо жили в неприятных местах?
  revised_footnotes:
  - marker: a
    text: 'Или: «нежеланных», «неблагоприятных». Латинское ingratis не уточняет, для кого или в каком отношении эти места были такими.'
    reason: Сохраняет лексическую широту ingratis и предотвращает вывод, будто места были «неугодны» определённому лицу.
