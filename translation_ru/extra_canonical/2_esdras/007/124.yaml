revisions:
- from: а мы не войдём, потому что жили в местах, неугодных[a]?
  to: Но мы не войдём, ибо жили в неприятных местах?
  rationale: Заменено «неугодных» на «неприятных», поскольку это естественнее по-русски и точнее передаёт латинское ingratis без добавления невыраженного оценщика. Добавлена сноска для сохранения допустимой семантической широты. Остальные элементы передают латинский текст верно.
