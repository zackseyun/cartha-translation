source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: ru
  text: Но между ними проложена лишь одна тропа — то есть между огнём и водой, — так что тропа вмещает лишь след человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: тропа
  rationale: Передаёт узкий путь естественным современным русским словом и согласуется с последующим образом следа.
- source_word: una sola
  choice: лишь одна
  rationale: Сохраняет усиленное указание на единственность.
- source_word: inter eos posita
  choice: между ними проложена
  rationale: Передаёт пространственное положение и смысл posita без неестественной буквальности «положена».
- source_word: hoc est ignis et aqua
  choice: то есть между огнём и водой
  rationale: Сохраняет явное пояснение hoc est и уточняет референт eos; повтор предлога нужен для грамматически естественного русского.
- source_word: ut non capiat semita nisi solummodo vestigium hominis
  choice: такая узкая, что на ней помещается лишь след одного человека
  rationale: Передаёт результат/характеристику вместимости тропы; «след одного человека» сохраняет vestigium hominis и образ предельной ширины.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, ясный и dignified; образ узкой тропы сохранён без конфессионального истолкования. Союз «Но» передаёт autem и связь с предыдущим контекстом.
