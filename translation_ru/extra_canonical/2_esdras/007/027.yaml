  source_fidelity: 'Текст точно передаёт латинский оригинал: «всякий, кто будет избавлен» соответствует omnis qui liberatus est; «предсказанных бед» — praedictis malis; возобновляющее «тот увидит» уместно сохраняет эмфатическое ipse videbit; «Мои чудеса» точно передаёт mirabilia mea. Будущее в русском естественно выражает эсхатологическую перспективу контекста, хотя латинский перфект формально может обозначать избавление как предшествующее видению.'
