source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et omnis qui liberatus est de praedictis malis, ipse videbit mirabilia mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: ru
  text: И всякий, кто будет избавлен от предсказанных бед, тот увидит Мои чудеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberatus est
  choice: будет избавлен
  rationale: Латинская форма буквально является перфектом страдательного залога, но в данном эсхатологическом контексте обозначает избавление, предшествующее будущему видению; русская форма передаёт эту временную последовательность естественно.
- source_word: praedictis malis
  choice: предсказанных бед
  rationale: Praedictis может означать как «предсказанных», так и «упомянутых прежде»; по апокалиптическому контексту выбрано «предсказанных», при этом malis естественно передано как «бед», а не как нравственное «зло».
- source_word: ipse videbit
  choice: тот увидит
  rationale: Указательное «тот» сохраняет возобновляющую и слегка эмфатическую конструкцию латинского ipse после придаточного с «всякий, кто», не создавая неестественного русского синтаксиса.
- source_word: mirabilia mea
  choice: Мои чудеса
  rationale: Mirabilia обозначает дивные, чудесные деяния или явления Бога; «Мои чудеса» — ясное и традиционно понятное соответствие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Возобновляющая конструкция «всякий, кто… тот» намеренно сохраняет акцент исходного ipse, оставаясь естественной по-русски.
