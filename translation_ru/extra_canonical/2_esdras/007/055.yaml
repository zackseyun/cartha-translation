  text: Say to it, ‘You produce gold and silver and bronze, and iron also and lead and clay;
translation:
  language: ru
  text: 'Скажи ей: «Ты производишь золото, серебро и медь[a], а также железо, свинец и глину;»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзу». Латинское слово может обозначать как медь, так и бронзу.'
    reason: Сохраняет лексическую неоднозначность латинского aes.
lexical_decisions:
- source_word: creas
  choice: производишь
  rationale: Передаёт смысл возникновения материалов из земли естественным современным русским языком, не приписывая земле богословски нагруженного акта творения.
- source_word: aes
  choice: медь
  rationale: Латинское aes может обозначать медь или бронзу; «медь» естественно в перечне природных материалов и сохраняет связь с землёй.
- source_word: lutum
  choice: глина
  rationale: В данном перечне веществ «глина» точнее и естественнее общего значения «грязь».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с прямой, dignified формулировкой. Женский род местоимения «ей» относится к земле из предшествующего контекста. Конечная точка с запятой отражает незавершённость мысли и продолжение перечня в следующем стихе.
