  text: 'Не немногие, а почти все из сотворённых». И он ответил мне и сказал: «Слушай…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non paucos
  choice: не немногие
  rationale: Сохраняет прямое отрицание и контраст с последующим «но почти все».
- source_word: pene omnes
  choice: почти все
  rationale: Точно передаёт латинское количественное выражение без усиления.
- source_word: qui creati sunt
  choice: сотворённые
  rationale: Естественная и ёмкая русская передача причастной конструкции, относящейся к сотворённым людям.
- source_word: audi
  choice: слушай
  rationale: Передаёт повелительное наклонение единственного числа и сохраняет незавершённость предоставленного фрагмента.
theological_decisions:
- issue: Кого обозначает qui creati sunt
  choice: сотворённые
  alternative: все, кто был сотворён
  rationale: Не уточняется «люди» или «души», поскольку латинский текст этого прямо не выражает; сохраняется широта формулировки.
translation_notes:
  register: Современный литературный русский с библейской сдержанностью. Начальная фраза продолжает реплику предыдущего стиха, поэтому перед ней нет открывающей кавычки, а после неё поставлена закрывающая. Многоточие после «Слушай» указывает, что предоставленный исходный сегмент обрывается посреди прямой речи.
