  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: ru
  text: 'Но вход в него узок и расположен на обрыве: справа — огонь, а слева — глубокая вода.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus autem eius
  choice: Но вход в него
  rationale: Передаёт противопоставление autem и сохраняет отсылку eius к ранее названному месту или пути без уточнения референта.
- source_word: angustus
  choice: узок
  rationale: Прямой и естественный эквивалент латинского прилагательного.
- source_word: in praecipiti positus
  choice: расположен над пропастью
  rationale: Передаёт опасное положение у крутого обрыва; формулировка естественна по-русски и не добавляет лишних деталей.
- source_word: a dextris quidem ignis
  choice: справа — огонь
  rationale: Кратко сохраняет пространственное противопоставление конструкции quidem… vero.
- source_word: a sinistris vero aqua alta
  choice: а слева — глубокая вода
  rationale: Aqua alta здесь означает глубокую воду; союз «а» ясно передаёт контраст.
