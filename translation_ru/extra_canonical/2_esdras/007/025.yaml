  yaml_path: translation/extra_canonical/2_esdras/007/025.yaml
  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: ru
  text: Поэтому, Ездра, пустое — пустым, а полное — полным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: поэтому
  rationale: Передаёт выводное значение латинского оборота естественным современным русским союзным наречием.
- source_word: vacua vacuis
  choice: пустое — пустым
  rationale: Сохраняет краткую афористическую форму и намеренную неопределённость субстантивированных прилагательных; дательный падеж передаёт подразумеваемое отношение «предназначено/принадлежит» без добавления отсутствующего в оригинале глагола.
- source_word: plena plenis
  choice: полное — полным
  rationale: Сохраняет точный параллелизм с первой частью и не уточняет, относятся ли слова к вещам, состояниям или людям.
theological_decisions:
- issue: К кому или к чему относятся «пустое» и «полное»
  choice: Оставить выражение без поясняющих существительных
  alternative: «пустые вещи — для пустых, а полные — для полных»
  rationale: Латинский текст допускает субстантивированное и контекстуально открытое прочтение; добавление «вещи» или «люди» преждевременно разрешило бы смысловую неоднозначность.
translation_notes:
  register: Краткий, торжественный и афористический синтаксис. Тире естественно обозначает пропущенную связку и сохраняет лаконичность оригинала.
