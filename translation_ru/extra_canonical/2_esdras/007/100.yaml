source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: ru
  text: 'И я ответил и сказал: «Значит, душам после отделения от тел будет дано время увидеть то, о чём ты говорил мне?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dabitur tempus animabus
  choice: душам… будет дано время
  rationale: Сохраняет безлично-пассивную конструкцию латинского текста и не уточняет, кто даёт это время.
- source_word: postquam separatae fuerint de corporibus
  choice: после отделения от тел
  rationale: Передаёт совершившееся отделение душ от тел, не вводя отсутствующих в источнике пояснений о смерти или посмертном состоянии.
- source_word: ut uideant de quo mihi
  choice: увидеть то, о чём ты говорил мне
  rationale: Естественно по-русски передаёт конструкцию de quo mihi с подразумеваемым по контексту глаголом речи; сохраняет различие между самим увиденным и сказанным о нём.
theological_decisions:
- issue: Состояние душ после отделения от тел
  choice: Сохранено буквальное обозначение душ, отделённых от тел
  alternative: Истолковать как «после смерти» или «в загробной жизни»
  rationale: Латинский текст говорит именно об отделении душ от тел; более истолковывающие формулировки могли бы привнести богословские уточнения, которых здесь нет.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «ответил и сказал» сохранена как характерная библейская конструкция; «значит» естественно передаёт выводное ergo.
