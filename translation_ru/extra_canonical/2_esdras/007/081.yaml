  text: enter[a], but from now on they will wander in torments, always grieving and sad.
translation:
  language: ru
  text: войдут, но отныне будут блуждать в мучениях, всегда скорбя и печалясь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingredientur
  choice: войдут
  rationale: Будущее время от ingredior передано буквально; грамматически это продолжение отрицательной конструкции предыдущего стиха.
- source_word: uagantes erunt
  choice: будут блуждать
  rationale: Сохраняет образ бесцельного, беспокойного скитания, а не просто пребывания.
- source_word: amodo
  choice: отныне
  rationale: Естественное и точное обозначение начала состояния с этого момента.
- source_word: in cruciamentis
  choice: в мучениях
  rationale: Передаёт страдательный смысл cruciamenta без неоправданного уточнения характера мучений.
- source_word: dolentes semper et tristes
  choice: всегда скорбя и печалясь
  rationale: Причастная конструкция сохраняет одновременность состояний; два близких слова отражают латинскую парность dolentes и tristes.
theological_decisions:
- issue: Связь с отрицанием в предыдущем стихе
  choice: Оставить «войдут» без добавления «не»
  alternative: «не войдут»
  rationale: В латинском тексте данного стиха отрицание отсутствует, поскольку non находится в конце стиха 80. Перевод заданного отрезка сохраняет его межстиховую синтаксическую зависимость и не добавляет отсутствующее слово.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Начальная строчная буква подчёркивает, что стих продолжает предложение предыдущего стиха; при автономном наборе допустима прописная.
