    issue: Активизация и конкретизация servari a
    rationale: «Освобождаться» представляет действие как возвратное избавление; латинское seruari — пассивная форма «быть сохраняемыми, хранимыми от».
  - severity: low
    issue: Добавлено слово «прежде»
    rationale: Источник сообщает о пребывании в сосуде в то время (in eo tempore commoratae), но не содержит наречия «прежде».
