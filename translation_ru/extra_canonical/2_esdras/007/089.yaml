review_pass:
  verdict: revise
  source_fidelity: Нужна правка. В draft форма «начали» не передаёт латинское incipient, указывающее на начало действия в будущем относительно описываемого момента. «Освобождаться» также несколько сильнее и активнее, чем пассивное servari a («быть сохраняемыми/хранимыми от»). Добавленное «прежде» отсутствует в источнике. Продолжение после sustinuerunt действительно не входит в предоставленный латинский фрагмент, но подтверждается английской консультационной трассой и может быть сохранено с примечанием.
  naturalness: Пересмотренный вариант сохраняет современный литературный, умеренно возвышенный библейский регистр. Оборот «хранить от» естественен в русском религиозно-литературном употреблении и позволяет передать пассивность латинского выражения без тяжеловесного «быть сохраняемыми».
  terminology: «Всевышний», «тленный сосуд» и «закон Законодателя» сохранены. «Тленный сосуд» не истолковывается в основном тексте как тело. «Хранить от» не навязывает более конкретное значение «освобождать» или конфессиональное истолкование спасения.
  issues:
  - severity: medium
    issue: Временная форма «начали освобождаться»
    rationale: Lat. incipient означает «начнут»/«будут начинать», а не прошедшее «начали».
