source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: ru
  text: 'Таков порядок Всевышнего: когда их начнут хранить от тленного сосуда. В то время, пока они пребывали в нём, они с трудом служили Всевышнему и каждый час переносили опасности, чтобы в совершенстве соблюдать закон Законодателя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается после слов «каждый час переносили»; слова «опасности» и заключительная цель соблюдения закона восстановлены по засвидетельствованному продолжению стиха, отражённому в консультационном английском тексте.
    reason: Отмечает границу непосредственно предоставленного латинского фрагмента и основание для сохранённого продолжения, не выдавая его за слова из этого фрагмента.
lexical_decisions:
- source_word: ordo
  choice: порядок
  rationale: Прямо передаёт установленный Всевышним порядок происходящего, не подменяя его более толковательным словом «установление».
- source_word: seruari a uaso corruptibili
  choice: освобождаться от тленного сосуда
  rationale: Буквальное «быть сохраняемыми от сосуда» неестественно по-русски; в контексте отделения от смертного тела оборот передан как освобождение, а образ сосуда сохранён.
- source_word: uaso corruptibili
  choice: тленного сосуда
  rationale: Сохраняет телесную метафору и смысл подверженности распаду, не заменяя «сосуд» толкованием «тело».
- source_word: commoratae
  choice: пребывали
  rationale: Передаёт продолжительное нахождение в сосуде; женский род латинской формы подразумевает души, но существительное не добавлено в основной текст.
- source_word: cum labore
  choice: с трудом
  rationale: Естественный современный русский эквивалент служения, сопряжённого с усилием и тяготой.
- source_word: omni hora sustinuerunt
  choice: каждый час подвергались опасности
  rationale: «Каждый час» соответствует omni hora; дополнение «опасности» следует засвидетельствованному продолжению стиха, отражённому в консультационном английском тексте.
- source_word: legislatoris legem
  choice: закон Законодателя
  rationale: Сохраняет намеренный однокоренной оборот и титул дающего закон.
theological_decisions:
- issue: Образ «тленного сосуда»
  choice: Сохранить метафору сосуда
  alternative: Раскрыть её как «смертное тело»
  rationale: Латинский текст говорит образно; явное отождествление сосуда с телом сняло бы часть образности и внесло толкование в основной текст.
- issue: Степень исполнения закона
  choice: «в совершенстве соблюдать»
  alternative: «безупречно исполнить»
  rationale: Формулировка сохраняет силу perfecte, но не превращает её в утверждение о безгрешности или в конфессионально нагруженное учение.
- issue: Временная форма incipient
  choice: «начали освобождаться»
  alternative: «начинают освобождаться» или «начнут освобождаться»
  rationale: В повествовательной рамке стиха прошедшее время яснее связывает освобождение от тленного сосуда с последующим описанием земной жизни; при этом латинская форма буквально имеет значение начала в будущем относительно точки отсчёта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён для ясности, но ключевые образы «тленный сосуд» и «закон Законодателя» сохранены. Маркер [a] присутствует в основном тексте.
