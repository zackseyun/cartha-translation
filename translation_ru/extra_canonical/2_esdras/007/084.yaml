  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: ru
  text: 'Четвёртый путь: в последние времена они представят себе мучение, уготованное им.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: Четвёртый путь
  rationale: Прямо передаёт обозначение четвёртого из перечисляемых путей.
- source_word: considerabunt sibi
  choice: они осознают
  rationale: Передаёт вдумчивое обращение к собственной участи; русское «осознают» естественно выражает смысл сочетания considerabunt sibi без искусственного удвоения возвратности.
- source_word: in nouissimis
  choice: в последние времена
  rationale: Сохраняет эсхатологическую временную формулировку латинского текста и не сужает её до одного конкретного момента.
- source_word: repositum tormentum
  choice: какое мучение уготовано
  rationale: «Уготовано» передаёт идею мучения, отложенного или сохраняемого для них, а придаточная конструкция звучит по-русски естественно.
theological_decisions:
- issue: Характер будущего мучения
  choice: мучение уготовано им
  alternative: ожидающее их мучение
  rationale: Сохранён пассивный образ заранее уготованного мучения без уточнения действующего лица и без добавления конфессионального толкования.
- issue: Значение in nouissimis
  choice: в последние времена
  alternative: в конце
  rationale: Выбрана более широкая формулировка, сохраняющая возможную эсхатологическую многозначность латинского множественного числа.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Формулировка краткая и понятная; архаизмы и излишне буквальное «рассмотрят для себя» устранены.
