  text: and Elijah for those who received rain and for the dead man, that he might live,
translation:
  language: ru
  text: и Илия — за тех, кто получил дождь, и за умершего, чтобы он ожил,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: Илия
  rationale: Традиционная русская форма имени библейского пророка.
- source_word: pro his qui pluviam acceperunt
  choice: за тех, кто получил дождь
  rationale: Сохраняет конструкцию pro с указанием тех, ради кого ходатайствовал Илия, и образ дождя из источника.
- source_word: pro mortuo
  choice: за умершего
  rationale: Передаёт субстантивированное mortuo без добавления отсутствующего в латинском тексте слова «человек».
- source_word: ut viveret
  choice: чтобы он ожил
  rationale: В данном контексте vivere относится к возвращению умершего к жизни; «ожил» естественно и точно выражает результат ходатайства.
theological_decisions:
- issue: Характер действий Илии
  choice: Сохранена единая конструкция «за… и за…», подразумевающая ходатайство из контекста главы.
  alternative: Добавить глагол «молился» или «ходатайствовал».
  rationale: В самом фрагменте глагол отсутствует и восстанавливается из более широкого синтаксического контекста; добавление здесь излишне конкретизировало бы формулировку.
- issue: Референт местоимения в ut viveret
  choice: «чтобы он ожил» относится к умершему.
  alternative: Безличное «чтобы тот вернулся к жизни».
  rationale: Мужской род латинского viveret по смыслу связан с mortuo; русский вариант сохраняет эту ясную связь.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным строем. Тире после имени отражает эллиптическую структуру перечня и не добавляет отсутствующего в источнике сказуемого.
