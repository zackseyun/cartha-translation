  text: And I said, “Speak, my lord.” And he said to me, “The sea is set in a broad place, so that it might be deep and immense.
translation:
  language: ru
  text: 'И я сказал: «Говори, господин мой». И он сказал мне: «Море расположено на просторе, чтобы быть глубоким и необъятным».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: господин мой
  rationale: Передаёт уважительное обращение к собеседнику без необоснованного отождествления с Богом; порядок слов сохраняет возвышенный библейский регистр.
- source_word: mare positum est
  choice: море расположено
  rationale: Естественно передаёт латинскую пассивную конструкцию и пространственный смысл positum est.
- source_word: in spatioso loco
  choice: на просторе
  rationale: Краткое и естественное русское соответствие месту широкому, обширному.
- source_word: altum et inmensum
  choice: глубоким и необъятным
  rationale: 'Сохраняет оба признака: вертикальную глубину и безмерную протяжённость.'
theological_decisions:
- issue: К кому относится обращение dominus meus
  choice: «господин мой» со строчной буквы
  alternative: «Господь мой»
  rationale: Латинское dominus допускает уважительное обращение; контекст реплики не требует вносить прямое именование Бога.
