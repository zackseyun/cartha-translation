  naturalness: 'Нужна небольшая пунктуационно-грамматическая правка: «потому что» — цельный союз, поэтому запятая между его частями не ставится. При «те, кто» форма множественного числа «соблюдали» делает фразу более согласованной и естественной.'
  terminology: «Воздержание» удачно передаёт abstinentia, не конкретизируя вид самоограничения. «Ярче звёзд» и «чернее тьмы» сохраняют симметричный образный строй и современный литературный библейский регистр.
