source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: ru
  text: И потому что лица тех, кто соблюдали воздержание, будут сиять ярче звёзд[a], а наши лица будут чернее тьмы?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут сиять выше звёзд».'
    reason: Латинское super stellas формально допускает пространственное понимание, хотя параллель с «чернее тьмы» указывает на сравнительный смысл.
lexical_decisions:
- source_word: quoniam
  choice: потому, что
  rationale: Передаёт причинное значение латинского союза и сохраняет форму продолжающегося риторического вопроса, не заменяя её условным «если».
- source_word: abstinentiam habuerunt
  choice: соблюдал воздержание
  rationale: Естественно и достаточно широко передаёт практику воздержания или самоограничения, не сужая её до конкретного аскетического предписания.
- source_word: super stellas fulgebunt
  choice: будут сиять ярче звёзд
  rationale: 'В параллели с super tenebras nigrae оборот super с винительным естественно понимается как сравнительный: сияние превосходит сияние звёзд.'
- source_word: super tenebras nigrae
  choice: чернее тьмы
  rationale: Сравнительная степень по-русски ясно передаёт усилительное сравнение латинского оборота и сохраняет параллелизм двух половин стиха.
theological_decisions:
- issue: Значение abstinentia
  choice: воздержание
  alternative: самообладание
  rationale: «Воздержание» сохраняет традиционный аскетико-нравственный диапазон латинского слова, но не уточняет предмет воздержания, которого источник не называет.
- issue: Пространственное или сравнительное значение super stellas
  choice: ярче звёзд
  alternative: выше звёзд
  rationale: Сравнительное прочтение поддерживается непосредственным параллелизмом с «чернее тьмы»; пространственное прочтение остаётся формально возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранены причинная конструкция, противопоставление лиц праведных и говорящих и риторический вопрос; синтаксическая незавершённость начала отражает связь стиха с предшествующим контекстом.
