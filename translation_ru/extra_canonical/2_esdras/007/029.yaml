  yaml_path: translation/extra_canonical/2_esdras/007/029.yaml
  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: ru
  text: 'И будет: после этих лет умрёт Сын Мой, Мессия, и все, в ком есть человеческое дыхание.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post annos hos
  choice: после этих лет
  rationale: Сохраняет указательное значение hos и временную связь с предшествующим контекстом.
- source_word: Filius meus Christus
  choice: Сын Мой, Мессия
  rationale: Filius meus передано прямо; Christus в данном иудейском апокалиптическом контексте означает Помазанника, поэтому выбрано понятное современному читателю «Мессия», без импорта позднейших догматических уточнений.
- source_word: morietur
  choice: умрёт
  rationale: Прямой и естественный эквивалент будущего времени латинского глагола.
- source_word: omnes qui spiramentum habent hominis
  choice: все, в ком есть человеческое дыхание
  rationale: Передаёт буквальный образ дыхания как признака человеческой жизни и сохраняет несколько необычную формулировку источника, не сужая её до отдельной группы.
theological_decisions:
- issue: Заглавная буква в выражении Filius meus
  choice: Сын Мой
  alternative: сын мой
  rationale: Говорящий обозначает уникальную мессианскую фигуру как Своего Сына; заглавная буква соответствует русской религиозно-литературной норме, не добавляя содержания к тексту.
- issue: Передача Christus
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» яснее выражает титульное значение латинского Christus в исходном апокалиптическом контексте; вариант «Христос» возможен, но для современного читателя сильнее воспринимается как имя.
- issue: Объём выражения omnes qui spiramentum habent hominis
  choice: все, в ком есть человеческое дыхание
  alternative: все люди
  rationale: Образная формулировка сохраняет широту и напряжение исходного текста, не разрешая явно вопрос о том, кого именно охватывает «все» в контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Двоеточие естественно раскрывает содержание формулы «И будет», а порядок слов подчёркивает последовательность событий. Архаизмы и конфессионально маркированные добавления исключены.
