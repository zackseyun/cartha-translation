source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: ru
  text: Они презрели Его закон, отвергли Его обещания, не были верны Его установлениям и не исполнили Его дел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem eius spreverunt
  choice: презрели Его закон
  rationale: Глагол spreverunt означает сознательное пренебрежение или презрение; формулировка прямо и естественно передаёт латинский текст.
- source_word: sponsiones eius abnegaverunt
  choice: отвергли Его обещания
  rationale: Sponsiones здесь обозначает обещания или данные заверения, а не завет; abnegaverunt передаёт отказ признать или принять их.
- source_word: legitimis eius
  choice: Его установлениям
  rationale: Субстантивированное legitima означает предписанные нормы или установления; «установления» сохраняет юридико-религиозный оттенок.
- source_word: fidem non habuerunt
  choice: не доверились
  rationale: Выражение буквально связано с отсутствием веры или доверия. «Не доверились Его установлениям» по-русски естественнее, чем буквальное «не имели веры к», и сохраняет связь с fides.
- source_word: opera eius non perfecerunt
  choice: не исполнили Его дел
  rationale: Perfecerunt означает довести до исполнения, совершить; «исполнили» сохраняет формальную связь с источником, не подменяя opera заповедями.
theological_decisions:
- issue: Значение sponsiones
  choice: обещания
  alternative: заветы
  rationale: В данном месте латинское sponsio указывает на обещание или заверение; для понятия завета в этой традиции ожидается testamentum. Поэтому различие между обещанием и заветом сохранено.
- issue: Отношение fides к установлениям
  choice: не доверились Его установлениям
  alternative: не были верны Его установлениям
  rationale: Латинское fidem non habuerunt допускает оттенки веры, доверия и верности. Выбранный вариант сохраняет направленность доверия на Божьи установления, не превращая фразу однозначно в описание послушания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранён параллелизм четырёх обвинений и неоднозначность выражения fidem non habuerunt настолько, насколько это допускает естественный русский синтаксис.
