  yaml_path: translation/extra_canonical/2_esdras/007/133.yaml
  text: and compassionate, because he shows compassion to those who turn back to his law,
translation:
  language: ru
  text: и милосерден, потому что милует тех, кто обращается к его закону,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miserator
  choice: милосерден
  rationale: Передаёт характеристику Бога как проявляющего милость и сохраняет параллель с последующим глагольным выражением.
- source_word: miseretur
  choice: милует
  rationale: Естественно и кратко передаёт повтор того же латинского корня, не устраняя намеренную смысловую перекличку.
- source_word: conversionem faciunt
  choice: обращается
  rationale: Латинская перифраза буквально означает «совершают обращение»; современное русское «обращается» передаёт возвращение к должному пути без лишней тяжеловесности.
- source_word: in lege eius
  choice: к его закону
  rationale: В сочетании с conversionem facere предлог in указывает на направленность обращения; «к его закону» естественно выражает этот смысл и сохраняет принадлежность закона Богу.
theological_decisions:
- issue: Характер обращения к закону
  choice: кто обращается к его закону
  alternative: кто обращается в его законе / кто исправляется по его закону
  rationale: Выбранная формулировка не добавляет ни идеи формального законничества, ни уточнения о способе исправления, а сохраняет направленность обращения, выраженную латинским in.
translation_notes:
  register: Современный литературный русский язык; достоинство и лаконичность исходной фразы сохранены. Строчная буква в начале и запятая в конце отражают положение стиха как части продолжающегося перечисления.
