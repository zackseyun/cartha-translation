translation:
  language: ru
  text: Эти духи не войдут в обители[a], но отныне будут семью путями скитаться в мучениях, всегда скорбя и печалясь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Такие духи не войдут в обители, но отныне будут скитаться в мучениях, всегда скорбя и печалясь».'
    reason: Сохранён засвидетельствованный прежний вариант с указательным значением «такие»; основной текст точнее передаёт Haec как «эти» и включает структурную фразу о семи путях.
lexical_decisions:
- source_word: Haec inspirationes
  choice: Эти духи
  rationale: Указательное Haec передано как «эти», а inspirationes — как «духи» в соответствии с контекстом посмертной участи; это сохраняет образ исходного текста и не подменяет его более толковательным словом «души».
- source_word: habitationes
  choice: обители
  rationale: «Обители» естественно передаёт постоянные места пребывания и сохраняет возвышенный, но понятный регистр.
- source_word: amodo
  choice: отныне
  rationale: Передаёт начальную временную точку последующего состояния.
- source_word: per septem vias
  choice: семью путями
  rationale: Сохраняет структурную метафору семи путей и подготавливает перечисление, начинающееся в следующем стихе.
theological_decisions:
- issue: Обозначение умерших нечестивых
  choice: духи
  alternative: души
  rationale: Выбрано более формально близкое к inspirationes обозначение без внесения дополнительной антропологической конкретизации.
- issue: Связь семи путей с мучениями
  choice: сохранить выражение «семью путями» без поясняющего истолкования
  alternative: «семью видами мучений»
  rationale: Исходная метафора допускает смысл способов или стадий, а следующий стих раскрывает её; перевод не должен преждевременно устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис оставлен ясным, а повтор близких по смыслу слов «скорбя и печалясь» сохраняет накопительный характер латинского dolentes semper et tristes.
