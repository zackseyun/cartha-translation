  yaml_path: translation/extra_canonical/2_esdras/007/087.yaml
  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: ru
  text: Седьмой путь превосходит все упомянутые выше пути[a], ибо они будут чахнуть в смятении, будут поглощены ужасами и увядать в страхах, видя славу Всевышнего, перед Которым согрешали при жизни[b] и перед Которым в последние времена начнут подвергаться суду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Несколько слов этого стиха в латинской рукописной традиции переданы с текстуальными шероховатостями. Общий смысл достаточно ясен: нечестивые испытывают особенно тяжкие мучения, оказавшись перед славой Всевышнего, перед Которым они согрешили.'
    reason: textual_variant
  - marker: b
    text: 'Возможен иной синтаксический разбор: «Седьмой путь, превосходящий все упомянутые выше пути: они чахнут в смятении, поглощаются ужасами и увядают в страхах, потому что видят славу Всевышнего, перед Которым согрешали при жизни и перед Которым им предстоит быть судимыми в последние времена». Однако основной текст точнее сохраняет будущее время глаголов, причинную функцию quoniam («ибо», «потому что») и значение incipient («начнут»).'
    reason: previous_rendering
lexical_decisions:
- source_word: maior
  choice: тяжелее
  rationale: Буквально — «больше»; в контексте путей посмертного мучения сравнительная степень выражает превосходство по тяжести, поэтому естественное русское «тяжелее» передаёт смысл без добавления конфессионального толкования.
- source_word: detabescent in confusione
  choice: будут истлевать в смятении
  rationale: Будущее время сохранено; detabescere обозначает постепенное истощение или угасание, а confusio здесь допускает значения смятения, посрамления и замешательства. «Смятение» не сужает многозначность до одного лишь стыда.
- source_word: consumentur in horroribus
  choice: изнемогать от ужасов
  rationale: horroribus означает «ужасы, страхи», а не «стыд». Формулировка по-русски естественно передаёт губительное воздействие ужасов и сохраняет параллелизм трёх будущих состояний.
- source_word: ma(res)cent in timoribus
  choice: увядать от страхов
  rationale: Латинская форма в передаче текста испорчена, но узнаваемый глагол marcescere означает «увядать, чахнуть»; множественное timoribus передано словом «страхов».
- source_word: uidentes gloriam Altissimi
  choice: видя славу Всевышнего
  rationale: Сохранена обстоятельственная причастная конструкция без превращения её в отдельную причинную придаточную часть; это не нарушает функцию quoniam в начале объяснения.
- source_word: incipient iudicari
  choice: начнётся суд над ними
  rationale: Переданы и начинательность incipient, и страдательное значение iudicari; такая конструкция звучит естественнее буквального «они начнут быть судимы».
theological_decisions:
- issue: Связь славы Всевышнего, греха и последнего суда
  choice: 'Сохранить две соотнесённые конструкции «перед Которым»: перед Ним они согрешали и перед Ним начнётся суд над ними.'
  alternative: Сделать видение славы непосредственной причиной всех мучений или объединить грех и суд в одну свободно истолкованную мысль.
  rationale: Латинский текст последовательно связывает обе части с Всевышним и не уточняет сверх текста ни природу суда, ни механизм страдания.
- issue: Временной аспект суда
  choice: «в последние времена начнётся суд над ними»
  alternative: «они будут судимы в последние времена»
  rationale: 'Слово incipient существенно: речь идёт именно о начале суда, поэтому его нельзя опускать.'
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены образные глаголы постепенного разрушения и трёхчленный ритм латинского текста. Заглавная буква в «Которым» служит уважительным оформлением отнесения к Всевышнему, не добавляя отдельного богословского тезиса.
