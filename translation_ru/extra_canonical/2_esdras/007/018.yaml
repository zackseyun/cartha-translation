source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iusti autem ferent angusta sperantes spatiosa; qui enim impie gesserunt, et angustiam passi sunt et spatiosa non viderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: ru
  text: Праведные же перенесут тесноту[a], надеясь на простор[b]; ведь те, кто поступал нечестиво, и тесноту претерпели, и простора не увидели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тесное»; латинское слово стоит во множественном числе и употреблено как существительное.'
    reason: Сохраняет сведения о необычной форме оригинала, тогда как основной текст передаёт образ естественным русским словом «теснота».
  - marker: b
    text: 'Буквально: «просторное»; латинское слово стоит во множественном числе и употреблено как существительное.'
    reason: Указывает на формальную параллель с «тесным» в оригинале и на отсутствие названного предмета.
lexical_decisions:
- source_word: iusti
  choice: праведные
  rationale: Точное и естественное соответствие латинскому субстантивированному прилагательному во множественном числе.
- source_word: ferent
  choice: перенесут
  rationale: Передаёт будущее время и смысл стойкого перенесения тягот.
- source_word: angusta / angustiam
  choice: тесноту
  rationale: Сохраняет сквозную пространственную метафору тесноты, противопоставленной простору, и одновременно звучит естественно по-русски.
- source_word: sperantes
  choice: надеясь
  rationale: Передаёт одновременность надежды и перенесения тесноты.
- source_word: spatiosa
  choice: простор / простора
  rationale: Сохраняет пространственное противопоставление angusta и spatiosa без преждевременного истолкования того, что именно обозначает ожидаемый простор.
- source_word: impie gesserunt
  choice: поступал нечестиво
  rationale: Передаёт нравственно-религиозную оценку поведения, не сужая её до отдельного поступка.
- source_word: et ... et ...
  choice: и ... и ...
  rationale: Сохраняет латинскую парную конструкцию и подчёркивает двойной итог для нечестивых.
theological_decisions:
- issue: Смысл образов тесноты и простора
  choice: Сохранить пространственную метафору без поясняющей конкретизации
  alternative: Передать как страдания и блаженство либо как тесный и широкий путь
  rationale: Латинский текст сам не раскрывает здесь точного содержания образов; конкретизация сняла бы подлинную смысловую открытость.
- issue: Соотношение опыта праведных и нечестивых
  choice: 'Сохранить параллель: праведные переносят тесноту с надеждой, нечестивые претерпели тесноту, но не увидели простора'
  alternative: Истолковать тесноту нечестивых исключительно как наказание
  rationale: Источник утверждает контраст исходов, но прямо не определяет природу пережитой нечестивыми тесноты.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Повтор «тесноту» и противопоставление «теснота — простор» намеренно сохранены ради риторической и лексической цельности оригинала; парное «и… и…» воспроизводит усиление латинского et… et….
