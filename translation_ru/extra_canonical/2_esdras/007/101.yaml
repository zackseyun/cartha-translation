source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixisti ? Et dixit : septem diebus erit libertas earum, ut uideant qui praedicti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/101.yaml
  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: ru
  text: 'И он сказал: «Семь дней им будет дана свобода, чтобы они увидели то, что было предсказано».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский отрывок обрывается на слове, означающем «предсказанные»; соответствующее существительное находится в продолжении предложения в следующем стихе. Поэтому возможен перевод: «чтобы они увидели предсказанное».'
    reason: fragment_boundary
lexical_decisions:
- source_word: libertas
  choice: свобода
  rationale: Прямо передаёт латинское libertas и сохраняет смысловую широту исходного текста без уточнения характера этой свободы.
- source_word: praedicti
  choice: было предсказано
  rationale: Передаёт пассивное значение praedicti и не подменяет его формулировкой «о чём тебе было сказано».
- source_word: uideant
  choice: увидели
  rationale: Естественный русский эквивалент латинского конъюнктива в придаточном цели после ut.
theological_decisions:
- issue: Кому и в каком смысле дана свобода
  choice: Сохранить местоимение «им» и общее слово «свобода» без пояснения
  alternative: Уточнить референт местоимения или истолковать libertas как свободу передвижения либо освобождение
  rationale: Данный фрагмент сам по себе не определяет ни референт, ни точный характер свободы; уточнение искусственно сняло бы контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский; речь ясная и сдержанно торжественная. Сохранено простое «И он сказал» без отсутствующего в латинском дополнения «мне».
