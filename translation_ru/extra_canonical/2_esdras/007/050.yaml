  text: 'me et instruam te, et de sequenti corripiam te: Propter hoc non fecit Altissimus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/050.yaml
  text: For this reason the Most High did not make one age, but two.
translation:
  language: ru
  text: Поэтому Всевышний создал не один век, а два.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter hoc
  choice: Поэтому
  rationale: 'Естественно и точно передаёт причинно-следственную связь: «по этой причине».'
- source_word: fecit
  choice: создал
  rationale: В контексте устроения веков «создал» яснее русского «сделал» и сохраняет действие Всевышнего как Творца.
- source_word: Altissimus
  choice: Всевышний
  rationale: Устоявшееся и точное соответствие латинскому божественному титулу.
- source_word: saeculum
  choice: век
  rationale: Сохраняет эсхатологический смысл эпохи или мирового века, не сужая его до календарного столетия.
theological_decisions:
- issue: Соотношение одного и двух веков
  choice: не один век, а два
  alternative: не один мир, а два
  rationale: «Век» сохраняет традиционную эсхатологическую неоднозначность между эпохой и мировым порядком и не превращает утверждение в прямую речь о двух пространственных мирах.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка, соответствующая афористичности стиха.
