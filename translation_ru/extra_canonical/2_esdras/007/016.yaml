base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/016.yaml
  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: ru
  text: И почему ты не принял близко к сердцу то, что будет, а не то, что есть сейчас?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accepisti in corde tuo
  choice: принял близко к сердцу
  rationale: Передаёт латинскую идиому естественным современным русским выражением со значением внутреннего принятия и серьёзного осмысления.
- source_word: quod futurum
  choice: то, что грядёт
  rationale: Сохраняет направленность к будущему и придаёт фразе достойное библейское звучание без чрезмерной архаизации.
- source_word: quod in praesenti
  choice: то, что существует сейчас
  rationale: Ясно выражает противопоставление грядущего нынешней действительности; более естественно по-русски, чем буквальное «то, что в настоящем».
theological_decisions:
- issue: Характер противопоставления будущего и настоящего
  choice: «то, что грядёт, вместо того, что существует сейчас»
  alternative: «будущее, а не настоящее»
  rationale: Развёрнутая конструкция сохраняет субстантивированные латинские обороты и не уточняет, идёт ли речь о событиях, мире или состоянии вещей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Вопросительная форма и заключительная кавычка сохранены как часть продолжающейся прямой речи.
