  text: and David for the destruction[a], and Solomon for those in sanctification,
translation:
  language: ru
  text: и Давид — о сокрушении, и Соломон — о тех, кто при освящении[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при посвящении [храма]». Латинское слово может относиться к посвящению храма; слово «храм» в исходном тексте прямо не названо.'
    reason: Уточняет вероятный исторический смысл sanctificationem, не вводя «храм» в основной текст и не устраняя краткость латинской конструкции.
lexical_decisions:
- source_word: confractione
  choice: сокрушении
  rationale: Латинское отвлечённое существительное означает сокрушение, разрушение или бедствие. «Сокрушение» сохраняет широту и напряжённость исходного выражения, не сужая его до мора, войны или разрушения конкретного объекта.
- source_word: sanctificationem
  choice: освящении
  rationale: Прямое соответствие латинскому слову сохраняет неоднозначность между процессом освящения и посвящением храма; более конкретное историческое понимание вынесено в примечание.
- source_word: pro
  choice: о
  rationale: В контексте перечня ходатаев pro обозначает предмет или тех, за кого возносится молитва; русское «о» естественно передаёт эту эллиптическую конструкцию.
theological_decisions:
- issue: Относится ли sanctificatio к освящению вообще или к посвящению храма Соломоном
  choice: В основном тексте оставлено «в освящении»
  alternative: «при посвящении храма»
  rationale: Латинский текст не называет храм прямо. Хотя контекст Соломона делает посвящение храма вероятным, основной текст не должен устранять сохраняющуюся лексическую неоднозначность.
translation_notes:
  register: Сохранена краткая, эллиптическая форма исходного перечня. Повтор «и … и …» передаёт латинскую координацию; тире помогает современному читателю распознать подразумеваемое ходатайство. Формулировка «в освящении» намеренно несколько необычна, поскольку необычна и латинская конструкция in sanctificationem.
