  text: and Hezekiah for the people in the days of Sennacherib, and many for many?
translation:
  language: ru
  text: и Езекия — за народ во дни Сеннахирима, и многие — за многих?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ezechias
  choice: Езекия
  rationale: Традиционная русская библейская форма имени царя Иудеи.
- source_word: pro populo
  choice: за народ
  rationale: Предлог pro в контексте ряда примеров ходатайства передан как «за»; краткость оригинала и эллиптическая конструкция сохранены.
- source_word: in diebus Sennacherib
  choice: во дни Сеннахирима
  rationale: Естественная для русского библейского регистра временная формула, сохраняющая буквальный образ латинского выражения.
- source_word: multi pro multis
  choice: многие — за многих
  rationale: Сохранены параллелизм, лаконичность и обобщённость оригинала; тире обозначает подразумеваемое действие, не уточняя его сверх текста.
theological_decisions:
- issue: Подразумеваемое действие в эллиптическом перечне
  choice: Не добавлять глагол «ходатайствовал/молились»
  alternative: «и Езекия молился за народ… и многие молились за многих?»
  rationale: Латинский текст содержит эллипсис; добавление конкретного глагола могло бы сузить смысл. Русская конструкция с тире сохраняет связь с предшествующим контекстом и подлинную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксическая краткость и вопросительная интонация источника сохранены.
