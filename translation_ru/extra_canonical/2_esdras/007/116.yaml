base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: ru
  text: 'И я ответил: «Вот моё первое и последнее слово: лучше было бы, если бы земля не произвела Адама, или же, после того как она уже произвела его, удержала его, чтобы он не согрешил».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hic sermo meus primus et novissimus
  choice: вот моё первое и последнее слово
  rationale: Сохраняет итоговый, категоричный характер высказывания и естественно звучит по-русски.
- source_word: non dare terram Adam
  choice: если бы земля не произвела Адама
  rationale: Terram понимается как субъект при инфинитиве, а Adam — как его объект; dare здесь передаёт значение «породить, произвести», соответствующее мотиву земли, производящей человека.
- source_word: cum iam dedisset
  choice: а раз уже произвела его
  rationale: Подразумеваемый субъект — земля, а eum относится к Адаму; повтор глагола сохраняет параллелизм исходного текста.
- source_word: coercere eum ut non peccaret
  choice: удержала бы его от греха
  rationale: Естественная русская передача цели — не допустить, чтобы Адам согрешил, без добавления не выраженных в тексте средств принуждения.
theological_decisions:
- issue: Кто действует в выражениях dare и dedisset
  choice: Земля производит Адама, а затем могла бы удержать его от греха
  alternative: Бог даёт землю Адаму, а затем удерживает его от греха
  rationale: Во второй части eum требует мужского референта — Адама, тогда как подразумеваемым субъектом dedisset естественно остаётся terram из конструкции с инфинитивом. Такое прочтение также соответствует языку 4 Ездры о земле, произведшей Адама.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но ясная. Сохранены категоричность слов «первое и последнее» и напряжённая мысль автора о появлении Адама и возможности предотвратить его грех.
