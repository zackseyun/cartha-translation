source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: ru
  text: И если Судья не простит сотворённых его словом и не изгладит множество проявлений презрения[a], то, возможно, от неисчислимого множества останутся лишь очень немногие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множество проявлений пренебрежения».'
    reason: Латинское contemptionum обозначает презрение или пренебрежение; оно может подразумевать сознательную непокорность, но не сводится к ней.
lexical_decisions:
- source_word: iudex
  choice: Судья
  rationale: Существительное передано как титул Бога в данном контексте; условная конструкция сохранена без добавления причинного союза.
- source_word: ignoverit
  choice: не простит
  rationale: Естественно и точно передаёт значение латинского ignoscere в контексте Божьего прощения.
- source_word: qui creati sunt verbo eius
  choice: сотворённых Его словом
  rationale: Сохраняет пассивную конструкцию и инструментальное значение verbo — творение посредством слова.
- source_word: deleverit
  choice: не изгладит
  rationale: Передаёт образ полного удаления или стирания, содержащийся в delere.
- source_word: multitudinem contemptionum
  choice: множества проявлений презрения
  rationale: Contemptiones означает не просто проступки, а проявления презрения, пренебрежения или непокорности; добавление «проявлений» делает абстрактное множественное число естественным по-русски.
- source_word: innumerabilem multitudinem nisi pauci valde
  choice: от неисчислимого множества останутся лишь очень немногие
  rationale: 'Естественно передаёт смысл: из несметного числа сохранятся только крайне немногие.'
theological_decisions:
- issue: Связь суда и прощения
  choice: 'Сохранено прямое условие: «если Судья не простит…»'
  alternative: «Поскольку, если Он не простит…»
  rationale: В представленном латинском тексте отсутствует причинный союз quia/quoniam; не следует вносить его из соседнего контекста.
- issue: Смысл contemptionum
  choice: «проявлений презрения»
  alternative: «прегрешений» или «оскорблений»
  rationale: Выбор сохраняет особый оттенок сознательного пренебрежения и непокорности, не сводя выражение к общему понятию греха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского, при этом сохранены условность, образ изглаживания и напряжение между судом и прощением.
