    rationale: 'Глагол «изгладить» требует винительного падежа: «изгладит множество проявлений презрения». Форма «множества» является родительным падежом и создаёт грамматическую ошибку.'
  - severity: low
    issue: Сноска предлагает несколько суженное значение «неповиновение».
    rationale: Contemptiones прежде всего означает презрение, пренебрежение, сознательное попрание; «неповиновение» возможно как контекстуальное следствие, но не столь прямо передаёт лексическое значение.
