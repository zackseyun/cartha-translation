  text: silver and bronze[a], and also iron and lead and clay; but silver is more abundant than gold, and bronze than silver, and iron than
translation:
  language: ru
  text: серебро и медь, а также железо, свинец и глина; но серебра больше, чем золота, меди — чем серебра, а железа — чем[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стих в данном делении обрывается на словах «а железа — чем»; продолжение находится в следующем стихе. Или: «медный сплав» вместо «медь».'
    reason: Латинский исходный отрывок заканчивается посреди сравнительной конструкции; примечание также сохраняет лексическую широту æramentum.
lexical_decisions:
- source_word: æramentum
  choice: медь
  rationale: Латинское слово обозначает медь или медный сплав; в перечне основных материалов естественнее современное «медь», при сохранении возможного варианта в примечании.
- source_word: fictile
  choice: глина
  rationale: Субстантивированное обозначение материала, которому придают форму; в данном ряду материалов уместно «глина».
- source_word: multiplicatur ... super
  choice: больше, чем
  rationale: Передаёт сравнительное значение «имеется в большем количестве / превосходит числом», а не буквальное пространственное «над».
