id: 2ES.7.112
reference: 2 Esdras 7:112
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: ru
  text: 'Он ответил мне: «Нынешний век — не конец; слава не пребывает в нём постоянно.[a] Поэтому те, кто мог, молились за немощных».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слава пребывает в нём нечасто».'
    reason: Латинское frequens допускает значение частотности, хотя в данном эсхатологическом контексте вероятнее смысл постоянства.
lexical_decisions:
- source_word: praesens saeculum
  choice: нынешний век
  rationale: Передаёт эсхатологическое значение saeculum как нынешней эпохи или мирового века, не смешивая его с «этим миром».
- source_word: non est finis
  choice: не конец
  rationale: Сохраняет краткость и прямое утверждение латинского текста без добавления подразумеваемого пояснения.
- source_word: gloria
  choice: слава
  rationale: Прямой и контекстуально уместный эквивалент, сохраняющий богословскую многозначность.
- source_word: non frequens manet
  choice: не пребывает в нём постоянно
  rationale: В эсхатологическом противопоставлении передаёт отсутствие постоянства славы в нынешнем веке; глагол «пребывает» соответствует manet.
- source_word: qui potuerunt
  choice: те, кто мог
  rationale: Сохраняет неопределённость относительно характера способности и не добавляет объекта, которого нет в тексте.
- source_word: invalidis
  choice: немощных
  rationale: Передаёт значение слабых или бессильных естественным и достойным библейским языком, не уточняя, физическая это или духовная немощь.
theological_decisions:
- issue: Характер славы в нынешнем веке
  choice: слава не пребывает в нём постоянно
  alternative: слава пребывает в нём нечасто
  rationale: 'Основной текст следует эсхатологическому смыслу: нынешнему веку недостаёт постоянной славы. Сноска сохраняет возможное более буквальное понимание frequens как частотности.'
- issue: Кто такие invalidi
  choice: немощные
  alternative: слабые
  rationale: «Немощные» сохраняет широкий смысл латинского слова и не сводит его ни к телесной болезни, ни к духовной слабости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формула «ответил мне» естественно сокращает латинское «ответил мне и сказал» без потери содержания; ключевые эсхатологические термины и смысловая неоднозначность сохранены.
