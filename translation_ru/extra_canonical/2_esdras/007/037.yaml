  source_fidelity: 'Три обвинения в латинском тексте соединены повторяющимся vel («или»): quem negastis, vel cui non servistis, vel cuius vias sprevistis. В черновике оба vel заменены союзом «и», что сглаживает формальный параллелизм источника и не следует его связкам. Остальные ключевые соответствия точны: «Всевышний» для Altissimus, «пробуждённым» для excitatas и личные местоименные формы сохранены.'
  naturalness: 'Исправленный вариант звучит естественно в современном литературном русском и сохраняет торжественный библейский регистр. Повтор «или» намерен: он воспроизводит риторическую структуру оригинала.'
  terminology: «Всевышний», «пробуждённые народы», «служить» и «пути» уместны и не вносят конфессионально обусловленных уточнений. Сноска корректно обозначает контекстуально допустимое понимание пробуждения как воскресения, не заменяя образ основного текста.
