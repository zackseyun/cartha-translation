source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: ru
  text: 'И тогда Всевышний скажет пробуждённым народам[a]: «Посмотрите и поймите, кого вы отвергли, или кому не служили, или чьи пути презрели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народам, восставшим из мёртвых».'
    reason: Отмечает допустимый в контексте воскресения смысл excitatas, сохраняя в основном тексте более буквальный образ пробуждения.
lexical_decisions:
- source_word: Altissimus
  choice: Всевышний
  rationale: Традиционный и естественный русский эквивалент латинского титула, сохраняющий возвышенный библейский регистр.
- source_word: excitatas gentes
  choice: пробуждённым народам
  rationale: Excitatas передаёт пробуждение или выведение из сна; этот образ важен в ближайшем контексте воскресения и суда. Gentes здесь естественно передаётся как «народы».
- source_word: uidete et intellegite
  choice: Посмотрите и поймите
  rationale: 'Сохраняет два последовательных повеления: сначала увидеть, затем осознать их значение.'
- source_word: quem negastis
  choice: кого вы отвергли
  rationale: Negare применительно к лицу может означать отрицать, отрекаться или отвергать; «отвергли» естественно передаёт личностный и судебный контекст, не сужая смысл до одного лишь словесного отрицания.
- source_word: cui non servistis
  choice: кому не служили
  rationale: Передаёт личный объект служения и сохраняет параллелизм трёх обвинений.
- source_word: cuius vias sprevistis
  choice: чьи пути презрели
  rationale: Сохраняет библейскую метафору «путей» как образа установлений и образа жизни, а также силу глагола «презирать».
theological_decisions:
- issue: Смысл excitatas в сцене всеобщего суда
  choice: пробуждённым народам
  alternative: народам, восставшим из мёртвых
  rationale: Основной текст сохраняет непосредственный образ пробуждения, поддержанный контекстом сна и пробуждения, не превращая метафору в более явное истолкование воскресения.
- issue: Объект трёх обвинений
  choice: Сохранить личные формы «кого / кому / чьи» без уточнения личности
  alternative: Явно назвать Бога или Всевышнего
  rationale: Латинский текст оставляет объект выраженным местоимениями; добавление имени устранило бы присущую тексту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с ясным, торжественным библейским звучанием. Синтаксический параллелизм обвинений сохранён. Начальные слова предоставленного латинского фрагмента относятся к окончанию предыдущего высказывания; перевод следует границам стиха, отражённым в консультационном тексте. Последние две фразы восстановлены по засвидетельствованному продолжению стиха, отражённому в аудированном английском слое, поскольку приведённая латинская выдержка обрывается на «uel cui non».
