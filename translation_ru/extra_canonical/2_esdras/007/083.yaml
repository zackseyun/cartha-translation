  yaml_path: translation/extra_canonical/2_esdras/007/083.yaml
  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: ru
  text: 'Третий путь: они видят награду, отложенную для тех, кто…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский текст обрывается после слов «для тех, кто». Продолжение, имеющееся в английском консультационном тексте, не засвидетельствовано в данном фрагменте латинского источника.
    reason: Обозначает обрыв исходного текста и не позволяет включить в основной перевод неподтверждённое данным латинским фрагментом продолжение.
lexical_decisions:
- source_word: Tertia uia
  choice: Третий путь
  rationale: Прямо сохраняет нумерацию и образ «пути» в перечислении.
- source_word: uident
  choice: они видят
  rationale: Передаёт настоящее время латинского глагола и подразумеваемое подлежащее из контекста.
- source_word: repositam mercedem
  choice: награду, приготовленную
  rationale: Repositam обозначает награду, отложенную или сохраняемую для будущего; «приготовленную» звучит естественно и не добавляет сведений о месте её хранения.
- source_word: his qui
  choice: для тех, кто
  rationale: Естественное русское соответствие конструкции с дательным his и относительным qui.
theological_decisions:
- issue: Содержание условия после his qui
  choice: Оставить фразу незавершённой и обозначить лакуну многоточием с примечанием
  alternative: 'Добавить по английскому слою: «доверился заветам Всевышнего»'
  rationale: Предоставленный латинский источник обрывается на his qui и не содержит слов, подтверждающих английское продолжение; добавление такого условия без исходного свидетельства устранило бы реальную неопределённость данных.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет структуру перечисления. Начальные слова исходного фрагмента «uersionem bonam facere ut uiuant» относятся к предшествующему контексту и потому в текст данного стиха не включены.
