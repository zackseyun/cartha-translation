  verdict: approve
  source_fidelity: 'Перевод точно передаёт латинское «nunc autem nobiscum crescit sensus»: sensus уместно передано как «сознание», а образ его роста «вместе с нами» сохранён без излишней конкретизации. Причинная связь в «и потому мы мучаемся» соответствует propter hoc. Оборот «мы погибаем, зная об этом» верно передаёт scientes perimus как сопутствующее осознание, а не как уступительное «хотя мы знаем».'
  naturalness: Фраза звучит естественно на современном литературном русском, сохраняет скорбно-рассудительный регистр и не утяжелена. Двоеточие удачно оформляет пояснение причины мучения.
  terminology: «Сознание» — допустимый и контекстуально точный выбор для sensus в данном рассуждении о мучительном осознании собственной участи. «Погибаем» и «мучаемся» передают силу перimus и torquemur без богословской или интерпретационной надстройки.
