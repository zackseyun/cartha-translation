source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non esse natum, ut non sensus inde fieret. Nunc autem nobiscum crescit sensus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: ru
  text: 'Но теперь вместе с нами растёт сознание, и потому мы мучаемся: мы погибаем, зная об этом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы погибаем, зная»; то есть погибаем, сознавая свою участь.'
    reason: Уточняет обстоятельственное значение латинского причастия и сохраняет его смысловую открытость.
lexical_decisions:
- source_word: sensus
  choice: сознание
  rationale: В данном рассуждении речь идёт не просто о рассудочности, а об осознании человеком собственной участи; «сознание» естественно связывает рост понимания с последующим мучением.
- source_word: nobiscum crescit
  choice: вместе с нами растёт
  rationale: Сохраняет образ совместного взросления или развития человеческого сознания, не уточняя сверх текста, является ли это возрастным или общечеловеческим процессом.
- source_word: torquemur
  choice: мы мучаемся
  rationale: Передаёт сильное значение страдания и внутренней муки без излишнего уточнения способа мучения.
- source_word: scientes perimus
  choice: мы погибаем, зная об этом
  rationale: 'Передаёт причастие как обстоятельство сопутствующего осознания: люди погибают, сознавая свою гибель, а не «хотя знают».'
theological_decisions:
- issue: Связь знания и человеческого страдания
  choice: Осознание собственной гибели является причиной мучения
  alternative: 'Знание противопоставлено гибели уступительно: «хотя мы знаем, мы погибаем»'
  rationale: Ход аргумента и форма scientes указывают на сопутствующее осознание, усиливающее мучение; уступительное прочтение вводило бы не выраженное в тексте ожидание, что знание должно спасти.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет серьёзный, скорбный тон и причинную логику рассуждения. «Сознание» выбрано вместо более книжного «разумение».
