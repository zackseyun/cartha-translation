  text: And he said to me, “Rise, Ezra, and hear the words that I have come to speak to you.”
translation:
  language: ru
  text: 'И он сказал мне: «Встань, Ездра, и выслушай слова, которые я пришёл сказать тебе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surge
  choice: встань
  rationale: Прямо передаёт повелительную форму латинского глагола surgere и естественно звучит по-русски.
- source_word: audi
  choice: выслушай
  rationale: В данном контексте означает не просто физически услышать, а внимательно принять обращённую речь; «выслушай» естественно сочетается со «словами».
- source_word: sermones
  choice: слова
  rationale: Нейтрально и точно передаёт множественное число sermones в значении произносимых речей или слов, не добавляя оттенка проповеди.
- source_word: quos veni loqui ad te
  choice: которые я пришёл сказать тебе
  rationale: Сохраняет целевую конструкцию и направленность речи к Ездре, оставаясь естественной для современного русского языка.
