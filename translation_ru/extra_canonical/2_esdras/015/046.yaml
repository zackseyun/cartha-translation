  verdict: revise
  source_fidelity: Лат. consors означает «сопричастная/разделяющая», а не завершённое действие «разделившая». Предложенная правка сохраняет участие Азии в splendour/glory и не добавляет временного оттенка. «Великолепие» для species и «облик» для persona приемлемы. Притяжательное «её» эксплицирует отнесение к Вавилону, принятое в английской контрольной версии; это согласуется с её синтаксическим разбором.
  naturalness: «Сопричастная великолепию» — литературно-нормативное и уместно возвышенное выражение для пророческого обращения. Оно также лучше сохраняет незавершённую синтаксическую связь с последующим стихом, чем причастие прошедшего времени «разделившая».
  terminology: '«Азия» и «Вавилон» переданы корректно. «Сопричастная» точно передаёт consors без нежелательной окраски «соучастница». Сноска исправлена: прежнее «разделяет участь Вавилона» подменяло предмет сопричастности, прямо названный в тексте, — великолепие и славу.'
