lexical_decisions:
- source_word: consors
  choice: разделившая
  rationale: Передаёт участие Азии в великолепии и славе Вавилона естественнее, чем тяжеловесные «сопричастница» или двусмысленное «соучастница».
- source_word: species
  choice: великолепие
  rationale: В данном хвалебно-риторическом сочетании латинское species обозначает внешнее великолепие или блеск; выбор согласуется с контрастным продолжением пророчества.
- source_word: persona
  choice: облик
  rationale: Передаёт внешний образ или явленный вид, не привнося современного значения слова «личность».
theological_decisions:
- issue: Отнесение gloria personae
  choice: «славу его облика», где местоимение относится к Вавилону
  alternative: «славу своего облика», с отнесением к Азии
  rationale: Латинский эллипсис допускает вопрос об отнесении, однако параллелизм естественнее связывает оба признака с Вавилоном, чьё великолепие разделяет Азия; это также соответствует ближайшему консультационному переводу.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Причастный оборот сохраняет незавершённость фразы и переход к следующему стиху; тире передаёт продолжение обращения.
