  language: ru
  text: И ты, Азия[a], сопричастная великолепию Вавилона и славе её облика, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение к Азии как к сопричастной великолепию Вавилона отражает композиционный слой, отличный от иудейского ядра 4 Ездры. Эта риторика принадлежит более позднему латинскому христианскому приложению, обычно называемому 6 Ездры.
