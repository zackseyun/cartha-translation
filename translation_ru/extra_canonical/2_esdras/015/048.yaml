  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: ru
  text: 'Ты подражала ненавистной блуднице во всех её делах и замыслах. Поэтому Бог говорит:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Fornicariam odibilem
  choice: этой ненавистной блуднице
  rationale: Сохраняет резкое нравственное осуждение латинского выражения и женский образ; «блудница» соответствует библейскому регистру и остаётся понятным современному читателю.
- source_word: imitata es
  choice: Ты подражала
  rationale: Точно передаёт перфект второго лица единственного числа и обращение к адресату женского рода.
- source_word: in omnibus operibus eius et adinuentionibus eius
  choice: во всех её делах и ухищрениях
  rationale: «Дела» формально передаёт opera, а «ухищрения» естественно выражает негативно окрашенные adinventiones в данном контексте.
- source_word: propterea dicit
  choice: Поэтому Бог говорит
  rationale: В латинской фразе субъект глагола подразумевается; явное «Бог» взято из ближайшего пророческого контекста и устраняет неестественную для отдельного русского стиха неопределённость без изменения смысла.
theological_decisions:
- issue: Неявный субъект в propterea dicit
  choice: Бог
  alternative: Он
  rationale: Латинский текст не называет субъекта непосредственно, однако речь вводит божественное изречение; «Бог» делает русский стих самостоятельным и соответствует консультационному английскому тексту, не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкости пророческого обличения. Начальные слова источника «tuis qui te cupierunt semper» синтаксически относятся к предшествующему стиху и здесь не включены.
