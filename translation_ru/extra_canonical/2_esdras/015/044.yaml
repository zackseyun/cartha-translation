revisions:
- from: Вавилон — и они истребят его. Они сойдутся против него, окружат его и обрушат на него бурю[a] и весь свой гнев. Пыль и дым поднимутся до неба, и все вокруг него будут скорбеть.
  to: Вавилон, и они истребят его. Они сойдутся против него, окружат его и обрушат на него бурю[a] и весь гнев. Пыль и дым поднимутся до неба, и все вокруг будут скорбеть.
  rationale: 'Удалены две невыраженные в латинском тексте конкретизации: принадлежность гнева («свой») и указание, что окружающие находятся именно вокруг Вавилона («него»). Начальное соединение сохранено, но тире заменено запятой, чтобы яснее передать союз et без дополнительной интерпретации. Сноска к sidus сохранена, поскольку выбор «буря» контекстуально оправдан, но не бесспорен.'
  reviewer_model: gpt-5.6-terra
