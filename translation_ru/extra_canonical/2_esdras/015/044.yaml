  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: ru
  text: Вавилон, и они истребят его. Они сойдутся против него, окружат его и обрушат на него бурю[a] и весь гнев. Пыль и дым поднимутся до неба, и все вокруг будут скорбеть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесное светило»; латинское слово допускает буквальное астральное понимание, но здесь, вероятно, обозначает бурю или небесную стихию.'
    reason: Латинское sidus обычно означает звезду, созвездие или небесное светило, однако контекст изливаемого бедствия поддерживает метеорологическое прочтение; неоднозначность важно сохранить.
lexical_decisions:
- source_word: Babylonem
  choice: Вавилон
  rationale: Сохранено начало данного стихового отрезка. Латинская форма — винительный падеж, синтаксически продолжающий предшествующий стих; тире передаёт эту обрывочную связь без добавления отсутствующего в данном отрезке глагола.
- source_word: exterent
  choice: истребят
  rationale: Передаёт сильное значение полного разорения или уничтожения; будущее время соответствует латинской форме.
- source_word: Conuenient ad ipsam
  choice: сойдутся против него
  rationale: Conuenire ad означает собраться или сойтись у цели; контекст вражеского окружения позволяет естественное «против него», не смешивая эту фразу с начальным Babylonem.
- source_word: circuibunt eam
  choice: окружат его
  rationale: Прямо передаёт действие обхода со всех сторон; русское местоимение согласовано с мужским родом слова «Вавилон».
- source_word: effundent sidus
  choice: обрушат на него бурю
  rationale: Буквальное основное значение sidus — небесное светило, однако в данном сочетании и контексте бедствия слово допускает метеорологический смысл. «Обрушат бурю» естественно передаёт образ излияния разрушительной стихии; буквальная возможность отмечена в сноске.
- source_word: omnem iram
  choice: весь свой гнев
  rationale: Притяжательное «свой» естественно по-русски обозначает гнев действующих сил; оно не уточняет, чьим именно является гнев, сверх ближайшего грамматического субъекта.
- source_word: subibit puluis et fumus usque ad caelum
  choice: Пыль и дым поднимутся до неба
  rationale: Сохраняет оба существительных и предел движения usque ad caelum в ясной современной формулировке.
- source_word: omnes in circuitu lugebunt
  choice: все вокруг него будут скорбеть
  rationale: 'Сохраняет неопределённость omnes: это могут быть все люди или все окрестные народы; объект скорби в латыни прямо не выражен.'
