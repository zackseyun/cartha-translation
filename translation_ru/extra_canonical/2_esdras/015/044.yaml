    rationale: Omnem iram означает «весь/всякий гнев» и не содержит притяжательного определения. Добавление меняет возможную принадлежность гнева.
  - severity: low
    issue: «Все вокруг него» конкретизирует in circuitu.
    rationale: Латинское omnes in circuitu говорит о находящихся вокруг, но не уточняет «вокруг него»; объект и центр скорби в исходнике не выражены.
