  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
translation:
  language: ru
  text: 'Говорит Господь: «Если бы ты не убивала Моих избранных во всякое время, ликуя, хлопая в ладоши и говоря об их смерти…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicit dominus
  choice: говорит Господь
  rationale: Прямо передаёт вводную формулу настоящего стиха.
- source_word: Nisi occidisses
  choice: Если бы ты не убивала
  rationale: Сохраняет незавершённую условную конструкцию латинского текста, продолжение которой следует в следующем стихе; женский род обусловлен обращением к Вавилону в контексте.
- source_word: electos meos
  choice: Моих избранных
  rationale: Формально и естественно передаёт electos meos без уточнения, отсутствующего в источнике.
- source_word: in omni tempore
  choice: всё это время
  rationale: В данном обвинении обозначает продолжительное, неоднократное действие; эта формулировка естественнее буквального «во всякое время».
- source_word: exultans percussione manuum
  choice: злорадно хлопая в ладоши
  rationale: В контексте ликования над гибелью речь идёт о торжествующих хлопках; «злорадно» передаёт отрицательную окраску exultans.
- source_word: dicens super mortem eorum
  choice: произнося речи над их мёртвыми телами
  rationale: Передаёт действие речи над погибшими; «мёртвыми телами» естественно выражает контекстуальный смысл mortem, хотя буквально это «смерть».
theological_decisions:
- issue: Синтаксическая незавершённость стиха
  choice: Сохранить условное придаточное без завершения и обозначить продолжение многоточием
  alternative: Завершить вопросом или перенести в стих слова из 15:54
  rationale: Латинский текст данного стиха заканчивается на eorum; добавление cum inebriata es относится к следующему стиху и нарушило бы его границы.
- issue: Референт обращения во втором лице
  choice: Использовать женский род без вставки имени адресата
  alternative: Добавить «Вавилон»
  rationale: Контекст указывает на персонифицированный город, но имя в данном стихе отсутствует; грамматический род сохраняет контекст без эксплицитной вставки.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранена незавершённость исходного условного периода на границе стихов. Заглавная буква в «Моих» отражает русскую издательскую традицию при прямой речи Бога, не меняя смысла источника.
