  rationale: 'Исправлены две смысловые конкретизации, отсутствующие в латинском тексте: «речи» и «мёртвые тела». Сохранены женский род адресата, условная незавершённость на границе стихов и отсутствие слов из следующего стиха. Формула in omni tempore передана ближе к оригиналу как «во всякое время».'
