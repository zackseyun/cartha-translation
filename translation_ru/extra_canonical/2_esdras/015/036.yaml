source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et femur hominis et suffraginem cameli. et erit timor et tremor multus super terram,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/036.yaml
  text: and a man's thigh and a camel's hock[a]. And there will be great fear and trembling upon the earth,
translation:
  language: ru
  text: и бедро человека, и скакательный сустав верблюда[a]. И будут на земле великий страх и трепет,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и до бедра человека, и до скакательного сустава верблюда».'
    reason: Связь начальных именных групп с предшествующим контекстом допускает продолжение ранее начатой конструкции, хотя предлог в данном латинском фрагменте отсутствует.
lexical_decisions:
- source_word: femur hominis
  choice: бедро человека
  rationale: Прямо передаёт латинское выражение без добавления не выраженного в данном фрагменте предлога.
- source_word: suffraginem cameli
  choice: скакательный сустав верблюда
  rationale: Латинское suffrago обозначает задний сустав ноги животного; современный анатомический термин точнее и понятнее, чем устаревшие варианты.
- source_word: timor et tremor multus
  choice: великий страх и трепет
  rationale: Сохраняет парное выражение источника и передаёт multus естественным русским прилагательным.
- source_word: super terram
  choice: на земле
  rationale: Естественное русское соответствие латинскому обороту в значении происходящего по всей земле; всеобщность здесь выражается контекстом, без добавления слова «всей».
