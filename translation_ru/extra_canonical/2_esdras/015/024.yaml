lexical_decisions:
- source_word: vae eis
  choice: Горе тем
  rationale: Естественная и традиционная русская формула пророческого предостережения, точно передающая латинское выражение.
- source_word: qui peccant
  choice: кто грешит
  rationale: Настоящее время сохраняет обобщённый характер высказывания и прямо передаёт peccant.
- source_word: non observant
  choice: не соблюдает
  rationale: Глагол «соблюдать» естественно сочетается с «заповедями» и передаёт смысл исполнения и хранения предписаний.
- source_word: mandata mea
  choice: Моих заповедей
  rationale: «Заповеди» — точный и понятный эквивалент mandata в речи Бога; прописная буква в местоимении соответствует принятому благоговейному оформлению.
- source_word: dicit Dominus
  choice: говорит Господь
  rationale: Прямая передача латинской формулы с естественным русским порядком слов.
