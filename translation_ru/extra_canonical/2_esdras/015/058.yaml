    text: 'Или: «первой», «первенствующей». Латинское primaria указывает на первенство или высокое положение; точный оттенок неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: a fame panis et siti aquae
  choice: из-за голода по хлебу и жажды воды
  rationale: Сохраняет параллелизм и причинное значение латинского a; несколько необычное сочетание «голод по хлебу» передаёт напряжённую образность источника, не добавляя идеи нехватки, прямо не выраженной в тексте.
- source_word: Infelix
  choice: Несчастная
  rationale: Женский род соответствует обращению к олицетворённой Азии в контексте; слово передаёт и бедственное положение, и оттенок осуждения.
- source_word: primaria
  choice: как первая
  rationale: Передаёт значение первенства или высшего положения, не добавляя отсутствующего в латинском уточнения «среди женщин».
- source_word: mala
  choice: бедствия
  rationale: В данном пророческом контексте обозначает обрушивающиеся несчастья, а не нравственное зло.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой резкости и параллелизма. Начальное «и» оставлено, поскольку стих продолжает предыдущее высказывание. Представленный латинский фрагмент обрывается на Infelix; продолжение сверено по аудированному английскому консультационному слою, отражающему более полный текстовый контекст.
