lexical_decisions:
- source_word: praeda habebunt
  choice: они захватят добычу
  rationale: Латинское выражение буквально означает «будут иметь добычу»; по-русски в контексте вражеского нападения естественнее передать его как «захватят добычу», не опуская эту часть фразы.
- source_word: gloriam faciei tuae
  choice: славу твоего лица
  rationale: Сохранён конкретный образ исходного текста и возможная смысловая широта слова gloria — слава, великолепие или красота облика.
- source_word: exterminabunt
  choice: уничтожат
  rationale: В поздней латыни глагол может обозначать истребление или полное уничтожение; выбран прямой и понятный русский эквивалент.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранён торжественный и образный строй краткого пророческого высказывания. Местоимение «твоего» передаёт обращение к городу в единственном числе.
