  source_fidelity: 'Начальная часть передана точно: non miserebitur homo proximo suo соответствует «Человек не пощадит своего ближнего». «С мечом ворвётся в их дома» является допустимой контекстуальной передачей трудного и, вероятно, испорченного латинского оборота ad irritum faciendum in domos eorum in gladium; она согласуется с английской контрольной формулировкой. Однако famem panis не следует сводить к одному «голоду»: упоминание хлеба значимо и может быть сохранено без неестественной буквальности.'
