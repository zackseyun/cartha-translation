  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: ru
  text: Человек не пощадит своего ближнего, но с мечом ворвётся в их дома, чтобы разграбить их имущество из-за голода, нехватки хлеба, и великой нужды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  choice: Человек не пощадит своего ближнего
  rationale: Передаёт отсутствие жалости в естественной и достойной русской формулировке; притяжательное «своего» отражает латинское suo.
- source_word: ad irritum faciendum in domos eorum in gladium
  choice: но с мечом ворвётся в их дома
  rationale: Латинская фраза в данном месте текстуально и синтаксически трудна; перевод следует вероятному смыслу насильственного нападения на дома, согласуясь с контекстом и консультационным английским текстом, без буквального воспроизведения неясного оборота.
- source_word: ad diripiendas substantias eorum
  choice: чтобы разграбить их имущество
  rationale: Diripere обозначает насильственное разграбление, а substantiae — имущество или владения.
- source_word: propter famem panis
  choice: из-за голода
  rationale: Латинское уточнение panis буквально означает «хлеба», но сочетание обозначает нехватку пищи; по-русски «голод» естественно передаёт смысл без тяжеловесности.
- source_word: tribulationem multam
  choice: великого бедствия
  rationale: Сохраняет интенсивность multam и широкий смысл tribulatio как тяжкого бедствия или угнетения.
