  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: ru
  text: И они разрушат города и стены, горы и холмы, лесные деревья и траву.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: разрушат
  rationale: Передаёт будущее время и смысл полного разрушения без излишнего уточнения способа действия.
- source_word: ligna siluarum
  choice: лесные деревья
  rationale: В данном перечне латинское ligna обозначает древесную растительность; «лесные деревья» естественно передаёт сочетание с siluarum.
- source_word: fena
  choice: луговую траву
  rationale: Латинское fena буквально связано с сеном или травой; контекст перечисляет уничтожаемую растительность, поэтому выбран естественный русский эквивалент, согласующийся с английским консультационным слоем.
