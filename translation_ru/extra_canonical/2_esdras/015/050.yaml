  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gloria uirtutis tuae
  choice: слава твоей силы
  rationale: Сохраняет родительную конструкцию и смысловую широту virtus как «сила, мощь», не сводя выражение к воинской доблести.
- source_word: sicut flos siccabitur
  choice: увянет, как цветок
  rationale: В образе цветка siccabitur естественно передаётся глаголом «увянет», который подразумевает иссыхание и звучит по-русски идиоматично.
- source_word: cum
  choice: когда
  rationale: Сохраняет незавершённую временную конструкцию источника, продолжающуюся в следующем стихе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Фрагментарное начало и незавершённый конец сохранены в соответствии с границами данного стиха; неподтверждённое имеющимся латинским текстом примечание английского слоя не перенесено.
