base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: ru
  text: Моя правая рука не пощадит грешников, и меч не перестанет разить тех, кто проливает невинную кровь на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: Моя правая рука
  rationale: Сохранён буквальный и образный язык источника; «десница» была бы излишне архаичной для современного литературного русского.
- source_word: non parcet ... super peccantes
  choice: не пощадит грешников
  rationale: Глагол parcere естественно передаётся как «щадить», а super при parcere не требует отдельного воспроизведения в русском управлении.
- source_word: romphea
  choice: меч
  rationale: Нейтральное «меч» точно передаёт орудие суда и не вводит спорной конкретизации типа оружия.
- source_word: nec cessabit ... super
  choice: и меч не перестанет разить
  rationale: Латинское super здесь обозначает направленность действия против людей; добавление «разить» делает русскую фразу естественной, не меняя смысла непрекращающегося действия меча.
- source_word: effundentes sanguinem innocuum
  choice: тех, кто проливает невинную кровь
  rationale: Сохранён устойчивый библейский и современный русский оборот, означающий убийство невиновных.
- source_word: super terram
  choice: на земле
  rationale: Прямой и естественный пространственный эквивалент.
theological_decisions:
- issue: Субъект образа «правая рука»
  choice: Сохранён антропоморфный образ без поясняющей конкретизации
  alternative: Передать смысл как «Я не пощажу»
  rationale: Источник прямо говорит «моя правая рука»; устранение образа ослабило бы риторику божественного суда.
- issue: Характер действия меча
  choice: «не перестанет разить»
  alternative: «не отступит от» или «не прекратится против»
  rationale: Выбран естественный русский оборот, передающий продолжающееся карательное действие, без уточнения способа или окончательного исхода суда.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого тона. Архаизмы вроде «десница» и чрезмерно буквальные конструкции избегаются; параллелизм двух частей стиха сохранён.
