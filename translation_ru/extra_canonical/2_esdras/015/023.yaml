  yaml_path: translation/extra_canonical/2_esdras/015/023.yaml
  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: ru
  text: И вышел огонь из гнева его и пожрал основания земли[a] и грешников — словно охваченную огнём солому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вышел огонь из гнева его и пожрал основания земли и грешников, словно охваченную огнём солому».'
    reason: Передаёт непрерывный ряд однородных дополнений в латинской фразе без интонационного выделения перед «грешниками».
lexical_decisions:
- source_word: exiit ignis ab ira eius
  choice: вышел огонь из гнева его
  rationale: Сохраняет образ и направление действия латинского текста; порядок слов остаётся возвышенным, но понятным в современном русском.
- source_word: devoravit
  choice: пожрал
  rationale: Передаёт сильный образ всепоглощающего огня точнее, чем нейтральное «уничтожил».
- source_word: fundamenta terrae
  choice: основания земли
  rationale: Формально и образно соответствует латинскому выражению, не уточняя, идёт ли речь о физических недрах или космических опорах.
- source_word: peccatores
  choice: грешников
  rationale: Прямой и общеупотребительный библейский эквивалент.
- source_word: quasi stramen incensum
  choice: словно охваченную огнём солому
  rationale: Естественно передаёт сравнение с уже горящей или подожжённой соломой, сохраняя огненный образ incensum.
theological_decisions:
- issue: Образ гнева и исходящего из него огня
  choice: 'Сохранить буквальную образность: «огонь из гнева его»'
  alternative: «огонь его гнева»
  rationale: Латинское ab ira eius представляет гнев как источник огня; перевод не сводит огонь просто к метафорическому обозначению гнева.
- issue: Синтаксическая связь сравнения со «грешниками»
  choice: Посредством «а» и тире связать сравнение прежде всего с грешниками
  alternative: Сохранить непрерывный ряд однородных дополнений без поясняющей пунктуации
  rationale: Такой вариант естественнее по-русски и соответствует наиболее вероятному прочтению, при этом альтернативная пунктуационная связь отражена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Местоимение «его» не капитализировано, поскольку исходный текст не кодирует конфессиональную практику почтительного написания с прописной буквы.
