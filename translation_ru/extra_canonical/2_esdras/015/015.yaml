source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: ru
  text: Ибо приблизились меч и их погибель[a]; народ восстанет на народ для битвы, и в руках у них будут большие мечи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант при ином понимании связи слов: «приблизились их меч и сокрушение».'
    reason: Отмечает возможное альтернативное синтаксическое истолкование связи местоимения «их», не выдавая его за иной текстовый вариант.
lexical_decisions:
- source_word: adpropinquavit
  choice: приблизились
  rationale: Латинское сказуемое стоит в единственном числе, однако относится к двум однородным подлежащим; по нормам современного русского языка естественно множественное число. Перфект передан как наступившая близость угрозы.
- source_word: gladius
  choice: меч
  rationale: Обычное обозначение меча; здесь это образ приближающегося суда, а не оружие, принадлежащее людям.
- source_word: extritio illorum
  choice: их погибель
  rationale: Родительное illorum относится к extritio и обозначает погибель, которая постигнет их. «Погибель» естественно передаёт апокалиптическое значение уничтожения или гибели.
- source_word: gens contra gentem
  choice: народ восстанет на народ
  rationale: Сохраняет повтор исходного существительного и обычную библейскую формулу межнациональной войны.
- source_word: ad pugnam
  choice: для битвы
  rationale: Передаёт целевое значение ad без добавления отсутствующих в источнике деталей.
- source_word: romphea
  choice: большие мечи
  rationale: Позднелатинское заимствование обозначает крупный меч или клинок. «Большие мечи» понятно современному читателю и отличает romphea от gladius, не вводя спорно узкую типологию оружия.
theological_decisions:
- issue: К кому относится местоимение illorum («их»)?
  choice: 'К extritio: «их погибель»'
  alternative: «Их меч и сокрушение»
  rationale: Порядок слов и грамматическая связь в латинском тексте поддерживают отнесение illorum к extritio; меч представлен как приближающееся орудие бедствия, а не как принадлежащий им меч.
- issue: Характер приближающейся угрозы
  choice: Не уточнять, кем направлен меч
  alternative: Явно назвать меч орудием Божьего суда
  rationale: Контекст может подразумевать суд, но данный стих прямо не называет действующее лицо; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены параллелизм и апокалиптическая напряжённость исходного текста.
