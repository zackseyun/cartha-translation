source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et a territorio Assyriorum subsessor subsedebiteos et consumet unum ex illis, et erit timor et tremor in exercitum illorum et inconstabilitio in regno illorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: ru
  text: И с территории ассирийцев засадник будет подстерегать их и уничтожит одного из них; и будет страх и трепет в их войске, а в их царстве — неустойчивость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a territorio Assyriorum
  choice: с территории ассирийцев
  rationale: Сохраняет пространственное значение латинского a territorio и этническую отнесённость Assyriorum без добавочного уточнения.
- source_word: subsessor
  choice: устроивший засаду
  rationale: Передаёт значение скрывающегося в засаде противника естественным современным русским выражением.
- source_word: subsedebit eos
  choice: подстережёт их
  rationale: Отражает засадный характер действия и исправляет слитное чтение очищенного латинского текста subsedebiteos как subsedebit eos.
- source_word: consumet unum ex illis
  choice: уничтожит одного из них
  rationale: Consumere в данном военном контексте означает погубить или уничтожить; конструкция unum ex illis передана буквально.
- source_word: inconstabilitio
  choice: неустойчивость
  rationale: Редкое позднелатинское образование обозначает отсутствие устойчивости; русский выбор сохраняет политическую неопределённость формулировки.
theological_decisions:
- issue: Кого обозначают местоимения «их» и «одного из них»
  choice: Сохранена местоименная референция без уточнения
  alternative: Назвать предполагаемые народы или правителей
  rationale: Сам стих не называет референтов явно; их конкретизация по контексту могла бы устранить подлинную неоднозначность источника.
- issue: Характер «неустойчивости» в царстве
  choice: Передано общим словом «неустойчивость»
  alternative: «мятеж», «смятение» или «распад»
  rationale: Латинское inconstabilitio не требует одного конкретного политического или богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис слегка расчленён для ясности, при этом последовательность образов латинского текста сохранена.
