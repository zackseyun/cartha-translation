revisions:
- from: И с территории ассирийцев выйдет устроивший засаду; он подстережёт их и уничтожит одного из них. И будут страх и трепет в их войске, а в их царстве — неустойчивость.
  to: И с территории ассирийцев засадник будет подстерегать их и уничтожит одного из них; и будет страх и трепет в их войске, а в их царстве — неустойчивость.
  rationale: Убрано невыраженное в источнике «выйдет». Формулировка сохраняет различение subsessor («засадник») и subsedebit eos («будет подстерегать их»), а также не уточняет, кого именно обозначают местоимения. Синтаксис и пророческая интонация приведены к естественной современной литературной норме.
