  text: For a man will desire to go into a city and will not be able[a].
translation:
  language: ru
  text: Ибо человек захочет пойти в город, но не сможет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: concupiscet
  choice: захочет
  rationale: Будущее время латинского concupiscere передано естественным современным глаголом; в данном контексте речь идёт о сильном намерении попасть в город, а не обязательно о страстном желании.
- source_word: enim
  choice: ибо
  rationale: Сохранена пояснительно-причинная связь с предыдущим высказыванием.
- source_word: in civitatem ire
  choice: пойти в город
  rationale: Передаёт направленное движение к городу без добавления отсутствующей в источнике причины невозможности.
- source_word: et non poterit
  choice: но не сможет
  rationale: Латинское et формально означает «и», однако здесь соединяет намерение с противоположным результатом; русское «но» естественно выражает этот контраст, не меняя смысла.
