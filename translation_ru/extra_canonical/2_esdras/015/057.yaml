id: 2ES.15.57
reference: 2 Esdras 15:57
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: ru
  text: Твои города будут сокрушены, и все твои люди, находящиеся в поле, падут от меча. А те, кто в горах, погибнут от голода и будут есть плоть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Продолжение фразы — «свою» — находится в следующем стихе; поэтому возможно понимание: «будут есть собственную плоть».'
    reason: Сохраняет границу исходного фрагмента и одновременно поясняет вариант прочтения непрерывной фразы.
lexical_decisions:
- source_word: ciuitates tuae conterentur
  choice: Твои города будут сокрушены
  rationale: Передаёт сильный пассивный глагол conterentur («будут разбиты, сокрушены») естественным и торжественным русским выражением.
- source_word: omnes tui in campo
  choice: все твои люди, находящиеся в поле
  rationale: Субстантивированное tui буквально означает «все твои»; добавление «люди» естественно раскрывает эллипсис, а оборот «находящиеся в поле» сохраняет обстоятельство места.
- source_word: gladio cadent
  choice: падут от меча
  rationale: Сохраняется традиционная и понятная библейская формула насильственной смерти от оружия.
- source_word: fame peribunt
  choice: погибнут от голода
  rationale: Точно и естественно передаёт причинное значение латинского аблатива fame.
- source_word: manducabunt carnes
  choice: будут есть плоть
  rationale: Carnes в данном фрагменте не имеет выраженного притяжательного определения; перевод не добавляет «свою» из следующего стиха.
theological_decisions:
- issue: Чья именно плоть имеется в виду
  choice: будут есть плоть
  alternative: будут есть собственную плоть
  rationale: В предоставленном латинском тексте стиха имеется только carnes; suas («свою») относится к продолжению за границей данного стиха. Неопределённость следует сохранить, не дополняя текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формулы «будут сокрушены» и «падут от меча» уместны в пророческом контексте; синтаксис остаётся ясным для современного читателя.
