  text: et conlident se invicem et effundent sidus copiosum super terram et sidus illorum, et erit sanguis a gladio usque ad ventrem equi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: ru
  text: И они будут поражать друг друга и обрушат на землю обильную бурю[a] — их бурю[b]; и кровь от меча достигнет брюха коня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское sidus здесь употреблено в единственном числе. Обычно оно означает «звезда», «созвездие» или небесное знамение, но может означать и «буря»; глагол «обрушат», определение «обильную» и контекст поддерживают последнее значение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и их бурю». При ином значении sidus возможен перевод: «обрушат на землю обильную звезду — их звезду»; этот вариант сохраняет образ небесного знамения, но менее естествен в данном контексте.'
    reason: source_ambiguity
lexical_decisions:
- source_word: conlident se invicem
  choice: столкнутся друг с другом
  rationale: Передаёт взаимное ожесточённое столкновение сторон, сохраняя возвратность и взаимность латинского выражения.
- source_word: effundent
  choice: обрушат
  rationale: В сочетании с бурей естественное русское «обрушат» передаёт образ излияния на землю без неуместного буквального «выль­ют».
- source_word: sidus copiosum
  choice: сильную бурю
  rationale: Хотя основное значение sidus — «звезда, созвездие, небесное знамение», у слова засвидетельствовано значение «буря». Глагол effundent, определение copiosum и контекст поддерживают здесь метеорологический смысл; «сильная» звучит естественнее буквального «обильная» применительно к буре.
- source_word: a gladio usque ad ventrem equi
  choice: кровь от меча поднимется до брюха коня
  rationale: Сохраняет исходные образы меча и брюха коня; глагол «поднимется» ясно выражает подразумеваемый уровень крови.
theological_decisions:
- issue: Апокалиптический образ sidus
  choice: буря
  alternative: звезда / небесное знамение
  rationale: Выбор основан на латинской полисемии и ближайшем контексте, а не на конфессиональном истолковании; альтернативный образ отмечен в сноске.
- issue: Повтор sidus illorum
  choice: — свою бурю
  alternative: и их бурю
  rationale: Тире передаёт возможное пояснительное присоединение и сохраняет повтор исходного текста, не определяя окончательно его синтаксическую функцию.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным, но повтор sidus сохранён как смыслово значимая особенность источника. «Брюхо коня» выбрано вместо более книжного «чрево коня» ради понятности и точности анатомического образа.
