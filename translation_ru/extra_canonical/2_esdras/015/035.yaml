review_pass:
  verdict: revise
  source_fidelity: «Столкнутся друг с другом» смягчает и несколько меняет направленность латинского conlident se invicem («будут поражать/бить друг друга»). «Свою бурю» не передаёт притяжательное illorum («их»). Глагол «поднимется» в заключительном образе не выражен в латинском и излишне конкретизирует его.
  naturalness: Предлагаемая редакция сохраняет торжественный апокалиптический регистр, но точнее передаёт взаимное насилие и принадлежность повторённого образа. «Достигнет брюха коня» — естественное русское восполнение эллиптической конструкции без утверждения, что кровь именно «поднимается».
  terminology: «Буря» оправданно передаёт sidus в данном контексте; сноска должна сохранять лексическую альтернативу «звезда/небесное знамение». Copiosum точнее передать как «обильную», а не «сильную».
  issues:
  - severity: medium
    issue: conlident se invicem передано как «столкнутся друг с другом».
    rationale: Латинский глагол означает нанесение ударов, сокрушение; «столкнутся» может означать просто встречу или вооружённое столкновение, но не сохраняет ясно выраженное взаимное действие удара.
  - severity: medium
    issue: illorum передано как «свою».
    rationale: «Свою» отсылает к подлежащему («они»), тогда как латинское illorum — «их». Неоднозначную связь повторного sidus следует сохранять, не заменяя притяжательное местоимение.
  - severity: low
    issue: «Сильную» ослабляет значение copiosum, а «поднимется» добавляет способ достижения уровня крови.
    rationale: Copiosum прежде всего «обильный, изобильный»; исходник не называет движения крови, лишь задаёт предел образа «от меча до брюха коня».
  revised_text: И они будут поражать друг друга и обрушат на землю обильную бурю[a] — их бурю[b]; и кровь от меча достигнет брюха коня.
