- from: И они столкнутся друг с другом и обрушат на землю сильную бурю[a] — свою бурю[b]; и кровь от меча поднимется до брюха коня.
  to: И они будут поражать друг друга и обрушат на землю обильную бурю[a] — их бурю[b]; и кровь от меча достигнет брюха коня.
  rationale: Редакция восстанавливает ударное значение conlident, сохраняет «их» для illorum и не приписывает крови невыраженное движение вверх. Выбор «обильную бурю» ближе к copiosum и поддержан контекстом, тогда как альтернативное значение sidus отмечено в сноске без догматического истолкования.
