  language: ru
  text: Ведь всякий неверующий умрёт в своём неверии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующим контекстом естественным современным русским союзом.
- source_word: omnis incredulus
  choice: всякий неверующий
  rationale: Сохраняет универсальность omnis и субстантивированное значение incredulus без добавочного толкования.
- source_word: in incredulitate sua
  choice: в своём неверии
  rationale: Буквально и естественно передаёт латинскую конструкцию, сохраняя возможный смысл состояния или упорства в неверии.
- source_word: morietur
  choice: умрёт
  rationale: Точно передаёт форму будущего времени и прямое значение латинского глагола.
theological_decisions:
- issue: Характер связи между неверием и смертью
  choice: Сохранена формулировка «умрёт в своём неверии»
  alternative: «умрёт из-за своего неверия»
  rationale: Латинское in обозначает пребывание в состоянии и не требует однозначно причинного прочтения; перевод не должен усиливать причинность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и доступная формулировка. Структура и богословская неоднозначность латинского текста сохранены.
