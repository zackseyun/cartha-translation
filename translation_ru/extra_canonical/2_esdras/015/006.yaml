  text: because iniquity has spread over the whole earth[a], and their deeds have been filled up.
translation:
  language: ru
  text: потому что беззаконие покрыло всю землю, и дела их достигли полной меры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter quod
  choice: потому что
  rationale: Передаёт причинную связь; строчная форма уместна для фрагмента, продолжающего предыдущее высказывание.
- source_word: superposuit iniquitas omnem terram
  choice: беззаконие распространилось по всей земле
  rationale: Буквально оборот описывает беззаконие, наложившееся на всю землю или покрывшее её; «распространилось по всей земле» естественно передаёт всеохватность образа без лишней конкретизации.
- source_word: operationes eorum
  choice: дела их
  rationale: Нейтрально и точно передаёт «их дела»; оценочное слово «вредные» отсутствует в указанном латинском тексте.
- source_word: adimpletae sunt
  choice: достигли полноты
  rationale: Сохраняет образ наполнения или достижения полной меры и звучит естественнее буквального «были наполнены» применительно к делам.
theological_decisions:
- issue: Полнота человеческих дел как основание суда
  choice: дела их достигли полноты
  alternative: их дела завершились
  rationale: Выбранная формулировка сохраняет возможный смысл накопившейся полной меры деяний и не сводит выражение лишь к их хронологическому завершению.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная, с сохранением библейского образа достигшей полноты меры дел.
