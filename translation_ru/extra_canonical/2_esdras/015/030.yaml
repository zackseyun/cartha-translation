base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: ru
  text: Кармонии[a], обезумев от ярости, выйдут из леса, придут с великой силой, встанут на битву против них и своими зубами опустошат часть земли ассирийцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное отождествление: карманийцы, жители Кармании.'
    reason: Латинское Carmonii может быть вариантом названия карманийцев, однако текстовая форма сохранена в основном тексте.
lexical_decisions:
- source_word: Carmonii
  choice: Кармонии
  rationale: Передана непосредственно засвидетельствованная в латинском тексте форма этнонима, без молчаливого исправления на предполагаемое «карманийцы».
- source_word: insanientes in ira
  choice: обезумев от ярости
  rationale: Сохраняет интенсивность insanientes и причинно-обстоятельственный оттенок in ira естественным русским выражением.
- source_word: constabunt in pugnam cum illis
  choice: выстроятся против них на битву
  rationale: Передаёт военное значение constabunt и сохраняет неопределённую отсылку местоимения illis.
- source_word: portionem terrae Assyriorum
  choice: часть земли ассирийцев
  rationale: Близко воспроизводит латинскую конструкцию, не уточняя границы или политический статус территории.
- source_word: in dentibus suis
  choice: своими зубами
  rationale: Сохранён яркий и допускающий образное понимание исходный образ без истолковывающей замены.
