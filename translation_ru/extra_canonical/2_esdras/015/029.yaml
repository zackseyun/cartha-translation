source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: ru
  text: И выступят народы аравийских драконов на многих колесницах[a], и их шипение разнесётся над землёй с расстояния дневного пути[b], так что все, кто их услышит, устрашатся и затрепещут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Трудное латинское выражение nationes draconum Arabum передано близко к форме источника. Образ может быть символическим, чудовищным или этнографическим, но по одному латинскому тексту его точный смысл восстановить невозможно.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «с дневного пути»; выражение обозначает расстояние, с которого слышно шипение, то есть расстояние одного дня пути.'
    reason: source_clarification
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: народы аравийских драконов
  rationale: Передаёт трудное латинское сочетание максимально близко, не устраняя неясность образа и отношений между существительными.
- source_word: in curris multis
  choice: на множестве колесниц
  rationale: Естественно передаёт латинское обозначение средства передвижения, сохраняя множественность.
- source_word: sibilatus
  choice: шипение
  rationale: Основное значение латинского слова соответствует змеиному или драконьему образу контекста.
- source_word: a die itineris
  choice: на расстояние дневного пути
  rationale: Dies itineris — обычная мера расстояния; сочетание указывает, насколько далеко разносится звук, а не на время начала шествия.
- source_word: timeant et trepidentur
  choice: устрашатся и затрепещут
  rationale: Сохраняет два усиливающих друг друга глагола страха и физической дрожи в возвышенном, но понятном регистре.
theological_decisions:
- issue: Природа «аравийских драконов»
  choice: Сохранить образ без истолкования
  alternative: Заменить образ названием исторического народа или войска
  rationale: Латинский текст не позволяет уверенно решить, является ли выражение символическим, чудовищным или этнографическим; перевод не должен навязывать толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Необычный образ сохранён, а синтаксис сделан ясным для обычного читателя.
