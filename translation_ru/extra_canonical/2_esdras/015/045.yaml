lexical_decisions:
- source_word: subremanserint
  choice: останется
  rationale: Передаёт значение «останутся, будут оставаться» без добавочного смысла выживания.
- source_word: seruient
  choice: будут служить
  rationale: Прямо передаёт будущее время латинского глагола servire.
- source_word: exteruerunt
  choice: устрашил
  rationale: Передаёт значение «привели в ужас, устрашили», а не «уничтожили».
- source_word: eam
  choice: её
  rationale: Сохраняет женский род местоимения и его отсылку к упомянутой ранее женщине или персонифицированной земле.
