id: 2ES.15.27
reference: 2 Esdras 15:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: ru
  text: Ибо бедствия уже пришли на весь мир, и вы останетесь среди них; ведь Бог не избавит вас, потому что вы согрешили против Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: бедствия
  rationale: В данном контексте множественное mala обозначает постигшие мир беды и несчастья; «бедствия» естественно передаёт этот смысл, не сводя его к нравственному злу.
- source_word: orbem terrarum
  choice: весь мир
  rationale: Устойчивое латинское выражение обозначает обитаемый мир; современное русское «весь мир» передаёт его ясно и естественно.
- source_word: manebitis in illis
  choice: вы останетесь среди них
  rationale: Сохраняет образ пребывания внутри наступивших бедствий, избегая неестественного русского «останетесь в них».
- source_word: liberabit
  choice: избавит
  rationale: Точно передаёт освобождение от угрожающих бедствий и соответствует возвышенному библейскому регистру.
- source_word: peccastis in eum
  choice: вы согрешили против Него
  rationale: Латинское in eum здесь выражает направленность греха против Бога; это прямо и естественно передаётся по-русски.
theological_decisions:
- issue: Отказ Бога избавить адресатов
  choice: «Бог не избавит вас»
  alternative: «Бог не спасёт вас»
  rationale: «Избавит» лучше сохраняет конкретную связь с окружающими бедствиями и не привносит более широкий сотериологический смысл.
- issue: Причинная связь с грехом
  choice: «потому что вы согрешили против Него»
  alternative: «за то, что вы согрешили против Него»
  rationale: «Потому что» непосредственно сохраняет причинную конструкцию propter quod, не усиливая формулировку до явно карательной, хотя такой оттенок возможен в контексте.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксический параллелизм и причинные связи латинского текста сохранены без излишней буквальности.
