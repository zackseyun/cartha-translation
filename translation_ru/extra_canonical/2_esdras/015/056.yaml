  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: ru
  text: Как ты поступишь с моими избранными[a], — говорит Господь, — так Бог поступит и с тобой и предаст тебя бедствиям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежней редакции здесь было: «Твои города будут разрушены, и все твои, кто в поле, падут от меча». Эти слова относятся к следующему стиху.'
    reason: previous_rendering
lexical_decisions:
- source_word: sicut facies ... sic faciet
  choice: Как ты поступаешь… так… поступит
  rationale: Сохраняет сопоставительную конструкцию и будущее время латинского текста; настоящее «поступаешь» естественно передаёт продолжающееся поведение адресата.
- source_word: electis meis
  choice: Моими избранными
  rationale: Прямо передаёт принадлежность и значение electi без уточнения природы избрания.
- source_word: tradet te
  choice: предаст тебя
  rationale: Передаёт активное действие tradere и сохраняет суровую судебную окраску.
- source_word: in malis
  choice: бедствиям
  rationale: В данном контексте mala естественно означает беды или бедствия, а не нравственное зло; дательный после «предаст» делает фразу по-русски ясной.
theological_decisions:
- issue: 'Смена обозначения говорящего: Dominus и Deus'
  choice: Сохранены «Господь» и «Бог»
  alternative: Унифицировать оба обозначения как «Господь»
  rationale: Латинский текст намеренно или текстуально различает Dominus и Deus; перевод не должен устранять эту особенность.
- issue: Значение in malis
  choice: «бедствиям»
  alternative: «злу» или «во власть бед»
  rationale: Контекст возвездия поддерживает смысл несчастий и бедствий, однако перевод не добавляет конкретного вида наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Моими» написано с прописной буквы как относящееся к Господу; синтаксис сохраняет параллелизм исходника.
