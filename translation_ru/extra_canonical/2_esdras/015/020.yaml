base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: ru
  text: Вот, Я созываю, — говорит Бог, — всех царей земли, тех, кто с севера, с юга, с востока и из Ливана[a], чтобы они пришли в движение, обратились друг против друга и вернули им то, что дали им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «с юго-запада». Латинский текст буквально говорит «из Ливана», но это чтение может быть искажением названия юго-западного ветра; тогда здесь перечислены четыре стороны света.'
    reason: Сохраняет засвидетельствованное латинское чтение, отмечая вероятное текстологическое объяснение, не подменяя текст конъектурой.
  - marker: b
    text: 'Буквально: «вернули им то, что дали им»; к кому относятся местоимения, не вполне ясно.'
    reason: Сохраняет местоименную и синтаксическую неоднозначность латинского текста без добавления новых групп участников.
lexical_decisions:
- source_word: ecce
  choice: Вот
  rationale: Передаёт вводное указание и торжественное привлечение внимания без архаического «се».
- source_word: convoco
  choice: созываю
  rationale: Точно передаёт значение созыва многих правителей; настоящее время сохранено.
- source_word: a borea et a noto et ab euro
  choice: с севера, с юга, с востока
  rationale: Названия ветров в данном перечислении функционируют как обозначения сторон света.
- source_word: a libano
  choice: из Ливана
  rationale: Следует засвидетельствованному латинскому тексту; вероятная конъектура «с юго-запада» вынесена в примечание.
- source_word: ad movendum
  choice: чтобы поднять их
  rationale: Латинское выражение синтаксически сжато; «поднять» сохраняет смысл приведения в движение или побуждения к выступлению и естественно соединяется со следующей целью.
- source_word: ad convertendos in se
  choice: друг против друга
  rationale: Передаёт взаимную направленность in se в контексте царей, обращаемых один против другого.
- source_word: reddere quae dederunt illis
  choice: воздать им тем, что они сами давали другим
  rationale: Сохраняет мотив ответного воздаяния и не отождествляет явно неоднозначные группы, обозначенные латинскими местоимениями.
theological_decisions:
- issue: Кто обращает царей друг против друга
  choice: Бог созывает царей с целью поднять их друг против друга
  alternative: Цари сами восстают и обращаются друг против друга
  rationale: Латинская конструкция цели допускает некоторую синтаксическую неопределённость; выбранная формулировка следует ближайшему управлению от Божьего «Я созываю», не добавляя отдельного богословского объяснения.
- issue: Адресаты и исполнители воздаяния
  choice: Сохранить различие неопределённых групп через «им» и «другим»
  alternative: Уточнить, что цари воздают своим прежним притеснителям
  rationale: Латинское illis и подразумеваемые субъекты допускают неоднозначность; конкретизация внесла бы отсутствующее в источнике толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Архаизмы избегаются; фраза разбита тире вокруг слов автора речи. Синтаксическая шероховатость латинского оригинала сглажена ровно настолько, чтобы стих был понятен, а текстологическая и местоименная неоднозначность сохранена в примечаниях.
