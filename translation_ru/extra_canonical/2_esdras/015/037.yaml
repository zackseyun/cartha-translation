  text: et horrebunt qui videbunt iram illam, et tremor adprehendet illos. et post haec movebuntur nimbi copiosi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/037.yaml
  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: ru
  text: И те, кто увидит тот гнев, содрогнутся[a], и трепет охватит их. И после этого придут в движение многочисленные грозовые тучи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему варианту: «И будет великий страх и трепет на земле, и те, кто увидит тот гнев, содрогнутся, и трепет охватит их. После этого придут в движение могучие грозовые тучи».'
    reason: previous_rendering
lexical_decisions:
- source_word: horrebunt
  choice: содрогнутся
  rationale: Передаёт сильную реакцию ужаса, сохраняя отличие от следующего существительного tremor («трепет»).
- source_word: iram illam
  choice: тот гнев
  rationale: Указательное местоимение illam сохранено; «гнев» естественно передаёт ira в пророческом контексте.
- source_word: tremor adprehendet illos
  choice: трепет охватит их
  rationale: Сохраняет образ страха, который захватывает людей, и естественно звучит по-русски.
- source_word: movebuntur
  choice: придут в движение
  rationale: Передаёт пассивно-непереходное значение латинской формы, не уточняя без основания, кто или что приводит тучи в движение.
- source_word: nimbi copiosi
  choice: многочисленные грозовые тучи
  rationale: Nimbi обозначает дождевые или грозовые тучи, а copiosi — их обилие; «многочисленные» не смешивает это значение с validae («могучие») в стихе 40.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Фраза о великом страхе и трепете на земле не включена в основной текст, поскольку в латинском источнике она относится к концу стиха 36. Повтор союза «И» отражает последовательность латинского текста.
