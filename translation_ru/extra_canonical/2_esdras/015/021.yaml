  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: ru
  text: 'Как они доныне поступали с Моими избранными, так поступлю и воздам им в пазуху[a]. Так говорит Господь Бог:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их пазуху», то есть в складку одежды, служившую подобием кармана.'
    reason: Поясняет предметный образ латинского in sinum ipsorum; «пазуха» здесь означает не часть тела, а складку одежды.
lexical_decisions:
- source_word: sicut faciunt usque hodie
  choice: Как они доныне поступали
  rationale: Русское прошедшее время с «доныне» естественно передаёт действие, продолжавшееся вплоть до настоящего момента; «поступали» соответствует контексту отношения к избранным.
- source_word: electis meis
  choice: с Моими избранными
  rationale: Дательный падеж при латинском выражении естественно передаётся русской конструкцией «поступать с кем-либо»; «избранные» сохраняет богословски значимый термин без уточнения их природы.
- source_word: sic faciam et reddam
  choice: так поступлю и Я и воздам
  rationale: Сохраняется соотносительная конструкция sicut… sic и различие между faciam и reddam; частица «и» при «Я» естественно выражает русское соответствие «как… так и…».
- source_word: in sinum ipsorum
  choice: им в подол
  rationale: Sinus обозначает пазуху или складку одежды, служившую вместилищем. «В подол» сохраняет предметный образ воздаяния, в отличие от современного анатомического понимания слова «лоно».
- source_word: haec dicit Dominus Deus
  choice: Так говорит Господь Бог
  rationale: Устойчивая и точная формула пророческого провозглашения; двоеточие сохранено, поскольку высказывание продолжается далее.
theological_decisions:
- issue: Объект ответного действия Бога
  choice: «так поступлю и Я и воздам им»
  alternative: «то же сделаю и воздам им»
  rationale: Формулировка сохраняет принцип соответствующего воздаяния, не уточняя сверх текста его конкретную форму и не вводя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Слово «доныне» слегка возвышенное, но общепонятное; архаическое «лоно» вынесено только в буквальное пояснение с раскрытием образа.
