  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: ru
  text: Они поразят город, живущий в праздности, и опустошат часть твоей земли; они истребят часть твоей славы, вновь возвращаясь из разорённого Вавилона. Они сокрушат тебя, словно солому, а сами станут для тебя как огонь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ciuitatem otiosam
  choice: беспечный город
  rationale: Otiosus здесь характеризует город как пребывающий в праздности и беспечности; «беспечный» естественно звучит по-русски и сохраняет укоризненный оттенок.
- source_word: exterent aliquam portionem terrae tuae
  choice: опустошат часть твоей земли
  rationale: Exterere в контексте военного разорения передано глаголом «опустошить»; aliquam portionem не требует неопределённого «какую-то», поэтому естественно передано как «часть».
- source_word: partem gloriae tuae exterminabunt
  choice: истребят часть твоей славы
  rationale: Сохранён буквальный и неоднозначный образ gloria — «слава»; он не сводится без достаточных оснований ни к богатству, ни к владениям.
- source_word: a Babylonia subuersa
  choice: из разорённого Вавилона
  rationale: Subversa обозначает разрушение или низвержение; «разорённого» хорошо соответствует контексту военного бедствия. Латинское Babylonia здесь естественно передаётся традиционным названием города «Вавилон».
- source_word: demolita eris illis pro stipula
  choice: Они сокрушат тебя, словно солому
  rationale: Пассивная конструкция естественно преобразована в активную без изменения участников действия. Stipula может означать сухие стебли или стерню; «солома» ясно передаёт образ легко уничтожаемого огнём материала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Образы «славы», «соломы» и «огня» сохранены без конфессионального истолкования. Последняя фраза следует представленному английскому сверочному слою; предоставленный латинский отрывок обрывается на et ipsi («а они сами»), поэтому подразумеваемое продолжение передано осторожно и без дополнительных уточнений.
