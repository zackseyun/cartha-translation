  text: et superinvalescent venti ab oriente et recludent eum et nubem quam suscitavit in ira, et sidus ad faciendam exteritionem ab orientalem notum et occidentem violabitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/039.yaml
  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: ru
  text: И усилятся ветры с востока и запрут его[a] вместе с облаком, которое он поднял в гневе; а звезда, предназначенная совершить истребление, будет поражена восточным, южным[b] и западным ветрами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих — одно из наиболее трудных мест в латинском тексте главы. Перевод приблизительно передаёт картину того, как космические силы оказываются заключены и приходят в смятение, однако синтаксис и то, к чему относятся отдельные местоимения, остаются неясными.
    reason: textual_variant
  - marker: b
    text: 'Возможен перевод: «…и облако, которое он поднял в гневе, и звезда, предназначенная совершить истребление на востоке и западе, придут в смятение».'
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: усилятся
  rationale: Передаёт усилительное значение позднелатинского глагола без неестественного русского удвоения вроде «чрезвычайно усилятся».
- source_word: recludent
  choice: заключат
  rationale: Сохраняет образ помещения внутрь или окружения; дополнения eum и nubem остаются объектами действия.
- source_word: exteritionem
  choice: истребление
  rationale: Передаёт смысл уничтожения; латинская форма, вероятно, является вариантом или искажением exstirpationem/exterminationem.
- source_word: violabitur
  choice: подвергнется яростному натиску
  rationale: Пассивная форма указывает на воздействие со стороны названных ветров; контекстуальное выражение передаёт насильственный характер violare, не сводя его к современному узкому значению «нарушить».
- source_word: notum
  choice: южного ветра
  rationale: Латинское notus обозначает южный ветер; это слово не следует опускать.
theological_decisions:
- issue: Кто поднял облако в гневе
  choice: он поднял
  alternative: Он поднял
  rationale: Латинский текст не называет деятеля прямо. Строчная буква сохраняет грамматическую неопределённость и не вводит редакционного утверждения о божественном референте.
- issue: Связь облака и звезды с глаголами
  choice: облако — объект «заключат», звезда — субъект пассивного «подвергнется натиску»
  alternative: облако и звезда вместе будут приведены в смятение
  rationale: В сохранившемся латинском nubem стоит в винительном падеже и естественно продолжают ряд дополнений при recludent, тогда как sidus согласуется с violabitur.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным апокалиптическим регистром. Синтаксическая трудность латинского текста не сглажена полностью: неопределённый референт «его» сохранён, а альтернативный разбор вынесен в примечание.'
