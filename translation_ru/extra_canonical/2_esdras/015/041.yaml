  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: ru
  text: огонь и град, летящие мечи[a] и множество вод, так что даже[b] все поля и все реки будут наполнены изобилием тех вод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «летящие широкие мечи».'
    reason: Сохраняет возможное более специальное значение латинского romphaea и документирует прежний вариант перевода.
  - marker: b
    text: 'Или: «так что все поля и все реки будут наполнены изобилием тех вод».'
    reason: Указывает вариант без явной передачи усилительного etiam; основной текст передаёт его словом «даже».
lexical_decisions:
- source_word: rompheas volantes
  choice: летящие мечи
  rationale: В позднеантичном библейском и апокалиптическом контексте romphaea обозначает прежде всего меч как орудие суда; более специальное «широкие мечи» звучало бы в современном русском излишне технически.
- source_word: aquas multas
  choice: множество вод
  rationale: Передаёт латинское множественное число и образ огромной массы воды, сохраняя возвышенную апокалиптическую образность.
- source_word: ut etiam impleantur
  choice: так что даже… наполнятся
  rationale: «Даже» явно передаёт etiam и подчёркивает, что вода заполнит не только реки, но и поля.
- source_word: a plenitudine aquarum illarum
  choice: от обилия тех вод
  rationale: Близко передаёт причинно-источниковое значение a и plenitudo, не сглаживая повтор слова «воды» в оригинале.
