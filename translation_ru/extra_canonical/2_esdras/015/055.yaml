  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: ru
  text: Плата блудницы — в складках твоей одежды[a]; поэтому ты получишь воздаяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежней разбивке стихов здесь читалось: «Как ты поступаешь с Моими избранными, говорит Господь, так Бог поступит с тобой и предаст тебя бедствиям. Твои дети умрут от голода, а ты падёшь от меча». Эти слова соответствуют 15:56 и началу 15:57 в латинском тексте.'
    reason: previous_rendering
lexical_decisions:
- source_word: merces fornicariae
  choice: плата блудницы
  rationale: Сохраняет конкретное значение родительного падежа fornicariae («блудницы»), а не превращает его в отвлечённое «блуд» или «распутство».
- source_word: in sinus tuos
  choice: у тебя за пазухой
  rationale: Латинское sinus во множественном числе обозначает складки одежды у груди, служившие для хранения чего-либо; русская идиома естественно передаёт этот образ.
- source_word: redditionem percipies
  choice: ты получишь воздаяние
  rationale: Передаёт идею ответной расплаты, не уточняя сверх источника её вид или непосредственного деятеля.
theological_decisions:
- issue: Характер воздаяния
  choice: воздаяние
  alternative: расплату
  rationale: «Воздаяние» сохраняет формальную открытость redditionem и торжественный регистр, тогда как «расплата» сильнее подчёркивает исключительно карательный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Оборот «за пазухой» выбран как понятный современному читателю образ складки одежды у груди; он не означает тайного умысла в данном контексте.
