    rationale: Deficient означает, что семена/посев терпят неудачу, ослабевают или гибнут; текст не оговаривает именно отсутствие прорастания. «Семена их погибнут» сохраняет более широкое значение без добавочного сценария.
  - severity: medium
    issue: «ржой» вместо «ржавчиной»
    rationale: Uredo в данном аграрном контексте обозначает растительную болезнь, обычно передаваемую как «ржавчина». «Ржа» в современном русском прежде всего относится к коррозии металла и здесь менее точна.
