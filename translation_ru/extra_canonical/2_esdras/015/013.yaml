  yaml_path: translation/extra_canonical/2_esdras/015/013.yaml
  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: ru
  text: Пусть скорбят те, кто возделывает землю, потому что семена их погибнут, а деревья их будут погублены ржавчиной, градом и страшной звездой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeant
  choice: пусть скорбят
  rationale: Точно передаёт латинский призыв в форме конъюнктива и сохраняет торжественный пророческий тон.
- source_word: cultores operantes terram
  choice: те, кто возделывает землю
  rationale: Естественно и достаточно близко передаёт описательное обозначение людей, обрабатывающих землю, без сужения до современного профессионального термина.
- source_word: deficient semina eorum
  choice: их семена не взойдут
  rationale: В земледельческом контексте deficient означает, что посевы подведут и не дадут всходов; такой перевод понятнее буквального «иссякнут».
- source_word: vastabuntur ligna eorum
  choice: их деревья будут погублены
  rationale: Ligna здесь по контексту обозначает древесные растения или деревья; пассивная форма сохраняет образ их опустошения и гибели.
- source_word: uredine
  choice: ржой
  rationale: Латинское uredo может обозначать поражающую растения ржавчину или губительный ожог; «ржа» сохраняет сельскохозяйственный смысл и библейский регистр.
- source_word: a sidus terribile
  choice: страшной звездой
  rationale: Сохраняет необычный и не вполне ясный образ латинского текста, не истолковывая природу небесного знамения.
theological_decisions:
- issue: Природа «страшной звезды»
  choice: Образ оставлен буквально как «страшная звезда».
  alternative: Истолковать как комету, небесное бедствие или палящий зной.
  rationale: Исходный текст не уточняет природу sidus; конкретизация устранила бы подлинную образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified пророческим звучанием. Синтаксис сохранён компактным; архаизмы и узкоспециальная земледельческая терминология не использованы.
