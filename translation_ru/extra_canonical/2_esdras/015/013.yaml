  source_fidelity: 'В целом смысл передан точно: призыв к земледельцам скорбеть, гибель семян/посевов и деревьев от трёх бедствий сохранены. Однако «не взойдут» конкретизирует deficient как отсутствие всходов, тогда как латинское слово шире: семена терпят неудачу/гибнут. Для uredine точнее общеупотребительное русское название болезни растений «ржавчина», а не «ржа».'
  naturalness: Текст звучит естественно и сохраняет сдержанный пророческий регистр. Замена «ржой» на «ржавчиной» также устранит неестественную для современного литературного русского двусмысленность со ржавчиной металла.
  terminology: «Те, кто возделывает землю» удачно передаёт cultores operantes terram. «Страшной звездой» оправданно сохраняет буквальную неопределённость sidus terribile; не следует заменять её кометой или иным конкретным небесным явлением.
  issues:
