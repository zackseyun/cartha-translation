source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exaltabuntur nubes magnae et validae plenaeirae et sidus, ut exterant omnem terram et inhabitantes eam, et fundent super omnemaltum et eminentem sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: ru
  text: И поднимутся великие и могучие облака, полные ярости, и звезда, чтобы истребить всю землю и живущих на ней; и изольют они на всякое высокое и возвышенное место страшную звезду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exaltabuntur
  choice: поднимутся
  rationale: Передаёт пассивно-возвратную форму естественным русским глаголом движения вверх, сохраняя образ появления грозных небесных сил.
- source_word: nubes magnae et validae
  choice: великие и могучие облака
  rationale: Сохраняет оба определения и возвышенный пророческий регистр; validae здесь обозначает силу, а не физическую прочность.
- source_word: plenae irae
  choice: полные ярости
  rationale: Буквально передаёт родительный irae при plenae; «ярость» естественна для образа грядущего суда.
- source_word: sidus
  choice: звезда
  rationale: Основное значение sidus в данном апокалиптическом контексте; сохранён повтор слова в обеих частях стиха.
- source_word: exterant
  choice: истребить
  rationale: По контексту это, вероятно, испорченная либо вариантная форма со значением уничтожения; выбор согласуется с объектами omnem terram et inhabitantes eam.
- source_word: fundent
  choice: изольют
  rationale: Сохраняет буквальный образ излияния, хотя сочетание со «звездой» намеренно необычно.
- source_word: omnem altum et eminentem
  choice: всякое высокое и возвышенное место
  rationale: Субстантивирует два латинских определения для грамматически естественного русского выражения, не конкретизируя тип возвышенности.
- source_word: terribile
  choice: страшную
  rationale: Передаёт terribile как внушающее ужас; согласование исправлено по предполагаемому смыслу при sidus, несмотря на латинское морфологическое напряжение.
theological_decisions:
- issue: Отношение звезды к облакам в plenae irae et sidus
  choice: «облака, полные ярости, и звезда» — два однородных подлежащих
  alternative: «облака, полные ярости и звезды»
  rationale: plenae управляет родительным irae, тогда как sidus — форма именительного/винительного падежа среднего рода и грамматически не является вторым содержимым облаков; так сохраняется исходное различение образов.
- issue: Необычный образ излияния звезды
  choice: 'сохранить буквально: «изольют… страшную звезду»'
  alternative: истолковать как излияние страшного бедствия, огня или звездопада
  rationale: Латинский текст прямо повторяет sidus и соединяет его с fundent; образ не следует догматически или образно разрешать без текстового основания.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксическая неоднозначность в числе подлежащих сохранена настолько, насколько позволяет русский язык; необычное «изольют… звезду» оставлено ради верности источнику.
