  source_fidelity: 'Русский текст точно передаёт синтаксис латинского свидетельства: «облака, полные ярости, и звезда» выступают как однородные подлежащие при pluralis exaltabuntur; целевое придаточное передаёт ut exterant; повтор sidus в последней части сохранён. «Поднимутся» — естественная русская передача exaltabuntur в данном образном контексте. Субстантивация omnem altum et eminentem как «всякое высокое и возвышенное место» оправданна, поскольку в латинском тексте существительное эллиптично.'
