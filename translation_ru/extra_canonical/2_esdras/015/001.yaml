lexical_decisions:
- source_word: Ecce
  choice: Вот
  rationale: Передаёт формулу привлечения внимания кратко, торжественно и естественно для библейского русского регистра.
- source_word: loquere in aures plebi meae
  choice: возвести народу Моему
  rationale: Латинское выражение буквально означает «говори в уши Моему народу», то есть объяви так, чтобы народ услышал. «Возвести» сохраняет публичный и торжественный характер повеления без неестественного буквализма.
- source_word: sermones prophetiae
  choice: слова пророчества
  rationale: Формально и ясно сохраняет сочетание множественного sermones с родительным prophetiae, не сужая его до одного пророческого изречения.
