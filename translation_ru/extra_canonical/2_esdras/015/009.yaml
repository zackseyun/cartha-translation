base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: ru
  text: Я непременно отомщу за них[a], — говорит Господь, — и взыщу с них всю невинную кровь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «мстя, отомщу за них».'
    reason: Сохраняет для читателя форму исходной усилительной конструкции vindicans vindicabo, переданной в основном тексте естественным русским усилением «непременно».
lexical_decisions:
- source_word: vindicans vindicabo
  choice: непременно отомщу
  rationale: Сочетание причастия и однокоренного глагола выражает усиление; по-русски это естественно передаётся наречием «непременно», а буквальное повторение звучало бы неестественно.
- source_word: illos
  choice: за них
  rationale: При глаголе со значением возмездия местоимение обозначает тех, за кого Господь мстит, что соответствует ближайшему контексту и английскому консультационному слою.
- source_word: accipiam ... ex illis ad me
  choice: призову их к ответу передо Мной
  rationale: Буквальное «возьму у них к Себе» по-русски не передаёт подразумеваемого взыскания за пролитую кровь. Выбранная формулировка естественно выражает требование ответа за кровопролитие и сохраняет направленность «ко Мне» посредством «передо Мной».
- source_word: omnem sanguinem innocuum
  choice: всю невинную кровь
  rationale: Сохранён библейский образ крови невинных без поясняющего добавления «пролитую», хотя кровопролитие подразумевается контекстом.
theological_decisions:
- issue: Характер Божьего возмездия
  choice: «отомщу за них»
  alternative: «накажу их»
  rationale: Источник говорит именно о vindicare — воздаянии за пострадавших, а не просто о наказании виновных.
- issue: Взыскание невинной крови
  choice: «призову их к ответу передо Мной за всю невинную кровь»
  alternative: «возьму у них к Себе всю невинную кровь»
  rationale: Выбранный вариант передаёт образ ответственности за кровопролитие, не создавая ошибочного впечатления, будто речь идёт о буквальном собирании крови.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен обычному читателю; библейский образ «невинной крови» сохранён без конфессиональных уточнений.
