source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: ru
  text: Я больше не буду молчать об их нечестивых делах[a], которые они совершают безбожно, и не стану терпеть того, что они несправедливо творят. Вот, невинная и праведная кровь взывает ко Мне, и души праведников непрестанно взывают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «об их нечестиях».'
    reason: Передаёт более формальный вариант для латинского impietates, не навязывая оценку стилистического повтора.
lexical_decisions:
- source_word: impietates
  choice: нечестивые дела
  rationale: Передаёт множественное число и нравственно-религиозный смысл латинского слова естественнее для современного русского языка, чем отвлечённое множественное «нечестия».
- source_word: inreligiose agunt
  choice: совершают безбожно
  rationale: Сохраняет активный смысл agunt и сильную отрицательную религиозно-нравственную окраску inreligiose; «нерелигиозно» в современном русском звучало бы как простое отсутствие религиозности.
- source_word: nec sustinebo
  choice: и не стану терпеть
  rationale: Естественно передаёт отказ далее выносить или допускать совершаемое зло.
- source_word: inique exercent
  choice: творят несправедливо
  rationale: Сохраняет деятельный характер exercent и значение inique без добавления конкретного вида преступления.
- source_word: sanguis innoxius et iustus
  choice: невинная и праведная кровь
  rationale: Буквально сохраняет оба определения крови и библейскую персонификацию.
- source_word: animae iustorum
  choice: души праведников
  rationale: Прямая передача латинской формулировки без сведения animae к «жизням» или к иной антропологической трактовке.
- source_word: perseveranter
  choice: непрестанно
  rationale: Передаёт продолжительный, неослабевающий характер взывания.
theological_decisions:
- issue: Образ крови, взывающей к Богу
  choice: 'сохранить буквальную персонификацию: «кровь взывает»'
  alternative: «пролитие невинной крови требует возмездия»
  rationale: Источник не формулирует требование возмездия прямо; буквальный образ сохраняет его богословскую открытость и межтекстовую библейскую связь.
- issue: Значение animae iustorum
  choice: «души праведников»
  alternative: «жизни праведников»
  rationale: Форма множественного числа и параллелизм с кровью допускают разные антропологические оттенки; буквальный вариант не разрешает эту напряжённость за читателя.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Архаизмы и конфессионально маркированная терминология избегаются; «Вот» сохраняет выразительную функцию латинского ecce.
