revisions:
- from: И после этого одолеет дракон[a], помнящий о своём происхождении; и если они повернут, объединившись с великой силой, чтобы преследовать их[b],
  to: И после этого дракон[a], помнящий о своём происхождении, возьмёт верх; и если они повернутся, действуя сообща с великой силой, чтобы преследовать их[b],
  rationale: Исправлена обязательная возвратность в «повернутся» и заменено стилистически неудобное безобъектное «одолеет» на «возьмёт верх». Неясность местоимений, образ дракона и незавершённость стиха сохранены. Примечание b переформулировано как приемлемый русский вариант, не предлагающий грамматически сомнительное «повернут».
