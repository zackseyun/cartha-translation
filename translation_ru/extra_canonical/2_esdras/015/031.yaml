source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et post haec supervalescet draco nativitatis memoria suae, et si converterint se conspirantes in virtute magna ad persequendos eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/031.yaml
  text: And after this the dragon[a], mindful of its origin, will prevail; and if they turn, conspiring in great force to pursue them[b],
translation:
  language: ru
  text: И после этого дракон[a], помнящий о своём происхождении, возьмёт верх; и если они повернутся, действуя сообща с великой силой, чтобы преследовать их[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза о драконе, помнящем о своём происхождении, текстуально неясна. Перевод сохраняет необычный образ, не заменяя его более гладкой догадкой.
    reason: textual_variant
  - marker: b
    text: 'Или: «повернутся, объединившись в мощную силу, чтобы преследовать их».'
    reason: previous_rendering
lexical_decisions:
- source_word: supervalescet
  choice: одолеет
  rationale: Передаёт усиленное значение глагола — «возьмёт верх, окажется сильнее» — в естественной для русского языка форме.
- source_word: draco
  choice: дракон
  rationale: Прямое соответствие латинскому апокалиптическому образу без истолкования его символического значения.
- source_word: nativitatis memoria suae
  choice: помнящий о своём происхождении
  rationale: Сохраняет необычный образ и передаёт nativitas как «происхождение», не сводя его непременно к буквальному рождению.
- source_word: converterint se
  choice: повернут
  rationale: Передаёт возвратную конструкцию как поворот или изменение направления; намеренно не уточняет, куда именно они повернут.
- source_word: conspirantes
  choice: объединившись
  rationale: В контексте совместного вооружённого преследования обозначает соединение сил; русское «сговорившись» излишне подчёркивало бы тайный заговор.
- source_word: in virtute magna
  choice: с великой силой
  rationale: Сохраняет широкое значение virtus — сила или мощь — не конкретизируя его как численность войска.
theological_decisions:
- issue: Смысл образа дракона и его происхождения
  choice: Образ оставлен без символического отождествления; сохранено упоминание происхождения.
  alternative: Истолковать дракона как конкретную державу или заменить необычную фразу более гладкой догадкой.
  rationale: Латинский текст не называет референта прямо, а сама конструкция текстуально неясна; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксическая незавершённость в конце сохранена, поскольку стих продолжается далее. Все местоименные референты оставлены столь же неопределёнными, как в латинском источнике.
