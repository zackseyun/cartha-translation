  text: Behold, a dreadful vision, and its face is from the east.
translation:
  language: ru
  text: Вот ужасное видение, и лик его — с востока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: вот
  rationale: Сохраняет указательную и привлекающую внимание функцию латинского слова в естественной современной русской форме.
- source_word: visio horribilis
  choice: ужасное видение
  rationale: Прямо передаёт существительное visio и вызывающее ужас значение horribilis, не ослабляя образ.
- source_word: facies illius
  choice: лик его
  rationale: Сохраняет буквальный образ «лица» и возвышенный пророческий регистр; местоимение оставляет референт таким же грамматически неоднозначным, как в латинском.
- source_word: ab oriente
  choice: с востока
  rationale: Естественно передаёт направление или происхождение, выраженное латинским ab с ablativus.
theological_decisions:
- issue: Референт выражения facies illius
  choice: лик его
  alternative: его облик
  rationale: Не отождествляет референт с какой-либо конкретной фигурой и сохраняет персонифицирующую образность исходного текста.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим звучанием. «Лик» выбран вместо разговорно-анатомического «лицо», поскольку речь идёт об образе видения и требуется сохранить достоинство и буквальную метафору.
