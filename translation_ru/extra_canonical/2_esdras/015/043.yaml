lexical_decisions:
- source_word: pratorum
  choice: пастбища
  rationale: Форма представляет собой родительный множественного числа от pratum («луг»); по синтаксису это окончание фразы из предыдущего стиха, а «пастбища» естественно передаёт смысл в данном контексте.
- source_word: frumenta
  choice: хлеба
  rationale: Frumentum обозначает зерновые культуры, зерно или хлеб на корню; множественное «хлеба» в современном литературном русском уместно для посевов зерновых.
- source_word: transibunt
  choice: будут продвигаться
  rationale: Передаёт движение вперёд, выраженное transire, не вводя отсутствующего в данном фрагменте пункта назначения.
- source_word: constanter
  choice: неуклонно
  rationale: Сохраняет значение стойкого, непрерывного продвижения и звучит естественно в русском повествовании.
- source_word: usque
  choice: вплоть до
  rationale: Союз оставляет фразу намеренно незавершённой на границе стиха, как и предоставленный латинский текст.
