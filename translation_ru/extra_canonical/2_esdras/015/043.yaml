    issue: «хлеба» для frumenta
    rationale: В современном русском «хлеба» обычно воспринимается как хлебные изделия либо виды хлеба. Латинское frumenta обозначает зерно/зерновые культуры; «зерно» точнее и естественнее.
  - severity: low
    issue: «пастбища» для pratorum
    rationale: Pratum прежде всего «луг»; «пастбище» возможно контекстуально, но сужает значение до функционального использования. «Луга» сохраняет исходную широту.
