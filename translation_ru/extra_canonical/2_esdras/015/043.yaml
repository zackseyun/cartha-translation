  source_fidelity: Лат. pratorum et frumenta eorum — продолжение предшествующей конструкции; pratorum точнее передать как «луга», а frumenta — собирательным «зерно» (зерновые посевы), не как «хлеба». Et transibunt constanter usque корректно сохраняет незавершённое «И они будут неуклонно продвигаться вплоть до».
  naturalness: «Их луга и зерно» естественно для современного литературного русского и сохраняет фрагментарность начала стиха. «Хлеба» здесь звучит как множественное число от «хлеб» (буханки/сорта хлеба) и неудачно передаёт frumenta.
  terminology: Богословских терминов и имён нет. Замена «пастбища» на «луга» ближе к основному значению латинского pratum; «зерно» адекватно передаёт frumenta в аграрном контексте.
