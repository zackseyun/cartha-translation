  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: ru
  text: Поднимется пламя, посланное против тебя, и ты ослабеешь, обнищаешь от удара и будешь исхлёстана ранами, так что не сможешь принять своих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся латинский текст обрывается на слове «своих»; продолжение предложения утрачено.
    reason: textual_fragment
lexical_decisions:
- source_word: exsurget ardor
  choice: вспыхнет пламя
  rationale: Передаёт буквальный образ поднявшегося, разгоревшегося жара естественным современным русским выражением.
- source_word: infirmaberis
  choice: ты ослабеешь
  rationale: Прямо передаёт значение утраты силы; женский род дальнейших форм в русском согласован с персонифицированным адресатом.
- source_word: paupera a plaga
  choice: обнищаешь от удара
  rationale: Сохраняет конкретное значение paupera («станешь бедной, обнищаешь») и физический смысл plaga в ряду с бичеванием и ранами, не заменяя его образом болезни.
- source_word: mastigata a uulneribus
  choice: будешь истерзана ранами
  rationale: Естественно передаёт образ жестокого бичевания и нанесённых ран, избегая неуклюжего буквального «бичуема ранами».
- source_word: ut non possis tuos
  choice: так что не сможешь принять своих
  rationale: Сохраняет оборванность сохранившегося латинского предложения и не восполняет отсутствующее существительное догадкой.
theological_decisions:
- issue: Неопределённый референт tuos
  choice: сохранить субстантивированное «своих» без уточнения
  alternative: добавить предполагаемое существительное, например «своих людей» или «своих близких»
  rationale: Латинский источник в данном фрагменте обрывается на tuos; уточнение неоправданно сняло бы подлинную текстовую неполноту.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Женский род сохранён как обращение к персонифицированному адресату. Подлинная неполнота последней фразы отмечена сноской.
