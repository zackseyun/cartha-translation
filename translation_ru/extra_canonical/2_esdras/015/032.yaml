  text: then these will be thrown into confusion and fall silent because of their strength[a], and they will turn their feet to flight.
translation:
  language: ru
  text: Тогда эти придут в смятение и умолкнут из-за их силы[a], и обратятся в бегство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умолкнут перед их силой».'
    reason: Латинское in virtute допускает причинный оттенок («из-за их силы») и оттенок реакции перед лицом силы; примечание сохраняет эту неоднозначность.
lexical_decisions:
- source_word: turbabuntur
  choice: придут в смятение
  rationale: 'Передаёт будущее страдательное значение: они будут потрясены и охвачены замешательством.'
- source_word: silebunt
  choice: умолкнут
  rationale: 'Сохраняет активную форму будущего времени латинского глагола: «станут безмолвны», а не «будут заставлены умолкнуть».'
- source_word: in virtute illorum
  choice: из-за их силы
  rationale: Естественно выражает вероятное причинное значение оборота, не превращая силу в прямое орудие действия.
- source_word: convertent pedes suos in fugam
  choice: обратятся в бегство
  rationale: Русский идиоматический эквивалент буквального «обратят свои ноги к бегству», сохраняющий образ движения без неестественной кальки.
