  source_fidelity: Сохранены повелительно-пророческий оттенок lugeat, образ Египта и его «оснований», а также физически конкретная пара verberati et mastigati. Однако тире в конструкции «бедствие — ударов и бичевания» создаёт неестественную и синтаксически неясную аппозицию; связь бедствия с ударами и бичеванием лучше передать прямо.
