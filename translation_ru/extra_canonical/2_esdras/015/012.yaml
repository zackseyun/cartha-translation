  terminology: «Основания» сохраняет образ fundamenta без неоправданного толкования. «Удары и бичевание» точно передаёт усиленную пару физического поражения и бичевания, не смягчая её до «наказания». «Бедствие» допустимо для plaga в данном контексте; сноска не требуется.
