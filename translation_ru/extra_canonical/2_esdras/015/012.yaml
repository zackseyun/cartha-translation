  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: ru
  text: Да скорбят Египет и его основания из-за бедствия от ударов и бичевания, которое Господь наведёт.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeat
  choice: да скорбят
  rationale: Передаёт призывное значение латинского конъюнктива и сохраняет торжественный пророческий регистр. Множественное число естественно согласуется в русском с составным подлежащим «Египет и его основания».
- source_word: plaga
  choice: бедствие
  rationale: В данном апокалиптическом контексте слово обозначает ниспосылаемое тяжёлое поражение или бедствие; «бедствие» сохраняет широту значения, не сводя его только к болезни.
- source_word: verberati
  choice: ударов
  rationale: Сохраняет конкретную физическую силу латинской лексики побоев, не смягчая её до общего «наказания».
- source_word: mastigati
  choice: бичевания
  rationale: Точно передаёт образ истязания бичом и намеренное нагнетание насильственной образности рядом с «ударами».
- source_word: inducet
  choice: наведёт
  rationale: Естественно передаёт действие Господа, насылающего или приводящего бедствие, и соответствует традиционному русскому сочетанию «навести бедствие».
theological_decisions:
- issue: Характер грядущего бедствия
  choice: Сохранена физически жёсткая пара «ударов и бичевания»
  alternative: Обобщить как «наказание» или «кара»
  rationale: Обобщение ослабило бы апокалиптическую напряжённость и устранило бы различие двух близких латинских терминов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пророческой формулой «да скорбят». Тире оформляет пояснение к слову «бедствие» и позволяет естественно сохранить накопление образов в латинском тексте.
