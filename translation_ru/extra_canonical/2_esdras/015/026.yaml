source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: novit Deus qui peccantin eum, propterea tradet eos in mortem et in occisionem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/026.yaml
  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: ru
  text: Бог знает тех, кто грешит против Него; поэтому Он предаст их смерти и истреблению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: novit
  choice: знает
  rationale: Прямо передаёт латинское настоящее время и не добавляет отсутствующего в источнике причинного союза.
- source_word: qui peccant in eum
  choice: тех, кто грешит против Него
  rationale: В данном контексте peccare in aliquem означает грешить против кого-либо; формулировка естественна для современного литературного русского языка.
- source_word: tradet eos
  choice: Он предаст их
  rationale: Сохраняет будущее время и смысл передачи людей во власть смертной кары.
- source_word: in mortem et in occisionem
  choice: смерти и истреблению
  rationale: Сохраняет два координированных понятия; «истребление» передаёт occisio как насильственное умерщвление без неестественного русского сочетания «смерти и убийству».
theological_decisions:
- issue: Характер Божьего знания
  choice: знает
  alternative: распознаёт / знает, кто именно
  rationale: Латинское novit не уточняет, идёт ли речь о простом знании, признании или особом различении; буквальное «знает» сохраняет эту смысловую открытость.
- issue: Связь между двумя частями стиха
  choice: точка с запятой и «поэтому»
  alternative: «Ибо Бог знает…»
  rationale: В источнике перед novit Deus нет причинного союза, тогда как propterea явно выражает следствие во второй части.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Заглавные местоимения «Него», «Он» употреблены для ясного указания на Бога; дополнительных смыслов к латинскому тексту не внесено.
