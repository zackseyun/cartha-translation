  naturalness: Исправленный текст сохраняет сжатую библейскую интонацию, но использует нейтральные современные «мысли» и естественное «говорит против тебя».
  terminology: «Верны и истинны» адекватно сохраняет пару fideles et ueri. «Неверие» точно передаёт incredulitates в собирательном единственном числе и не требует богословского уточнения.
