id: 2ES.15.5
reference: 2 Esdras 15:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego induco, dicit Dominus, super orbem terrarum mala, gladium et famem et mortem et interitum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/005.yaml
  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: ru
  text: 'Вот, Я навожу, — говорит Господь, — на весь мир бедствия: меч, голод, смерть и погибель.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Вот
  rationale: Сохраняет библейский указательный призыв обратить внимание, оставаясь естественным в современном русском языке.
- source_word: induco
  choice: навожу
  rationale: Передаёт настоящее время и активное действие субъекта; в сочетании «наводить бедствия» звучит естественно и близко к латинскому.
- source_word: super orbem terrarum
  choice: на весь мир
  rationale: Естественный русский эквивалент выражения о населённом земном мире; «весь» передаёт всеохватность orbis terrarum.
- source_word: mala
  choice: бедствия
  rationale: В данном перечне означает не нравственное зло, а пагубные несчастья и кары.
- source_word: gladium
  choice: меч
  rationale: Сохраняет традиционный образ войны и насильственной смерти без поясняющего расширения.
- source_word: famem
  choice: голод
  rationale: Прямой и общепонятный эквивалент.
- source_word: mortem
  choice: смерть
  rationale: Прямой эквивалент, сохранённый отдельно от последующего interitum.
- source_word: interitum
  choice: погибель
  rationale: Отличает окончательное разорение или уничтожение от просто «смерти», сохраняя нарастание перечня.
theological_decisions:
- issue: Божественная причинность бедствий
  choice: «Я навожу»
  alternative: «Я допускаю»
  rationale: Латинское induco прямо представляет Господа действующим субъектом; смягчение до «допускаю» внесло бы отсутствующее в источнике богословское толкование.
- issue: Соотношение mortem и interitum
  choice: «смерть и погибель»
  alternative: «мор и уничтожение»
  rationale: Сохранены два отдельных понятия без попытки свести mortem к конкретной эпидемии; источник допускает более широкое значение «смерть».
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Вводное «говорит Господь» выделено парными тире, а перечень после обобщающего слова оформлен двоеточием. Архаизмы и конфессионально окрашенные уточнения исключены.
