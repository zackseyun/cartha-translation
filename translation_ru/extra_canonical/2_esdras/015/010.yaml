  text: Behold, my people are being led like a flock to the slaughter. I will no longer allow them to dwell in the land of Egypt,
translation:
  language: ru
  text: Вот, народ мой, словно стадо, ведут на заклание. Я больше не позволю ему жить в земле Египта,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Вот
  rationale: Сохраняет указательную и торжественную силу латинского слова, оставаясь естественным для библейского повествования.
- source_word: populus meus
  choice: народ Мой
  rationale: Прямая и ясная передача принадлежности народа говорящему Богу.
- source_word: quasi grex
  choice: словно стадо
  rationale: Сохраняет сравнительный характер образа, не превращая его в отождествление.
- source_word: ad occisionem ducitur
  choice: ведут на заклание
  rationale: Передаёт страдательную конструкцию и жертвенно-библейский оттенок occisio без уточнения не названных в тексте исполнителей.
- source_word: iam non patiar
  choice: Я больше не позволю
  rationale: Естественно выражает прекращение прежнего допущения и решимость говорящего.
- source_word: habitare in terra Aegypti
  choice: жить в земле Египетской
  rationale: Сохраняет традиционное географическое выражение и передаёт habitare современным общеупотребительным глаголом.
theological_decisions:
- issue: Неуказанный исполнитель действия ducitur
  choice: Сохранена неопределённо-личная конструкция «ведут»
  alternative: «ведётся» или добавление конкретного притеснителя
  rationale: Латинский текст не называет действующее лицо; перевод не должен устранять эту неопределённость.
- issue: Смысл Божьего «не позволю»
  choice: Оставлен объектный оборот «не позволю ему жить»
  alternative: «выведу его из земли Египетской»
  rationale: Исход может подразумеваться контекстом, но прямо в данном стихе не назван, поэтому он не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок образов и незавершённость фразы перед запятой сохранены в соответствии с исходным текстом стиха.
