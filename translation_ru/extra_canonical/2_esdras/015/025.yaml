source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non parcam illis, discedite, filii apostatae, nolite contaminare sanctificationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
translation:
  language: ru
  text: Я не пощажу их. Уходите, дети-отступники; не оскверняйте Моей святыни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское sanctificationem meam буквально означает «Моё освящение» или «Моё святое». Перевод «Моя святыня» конкретизирует выражение ввиду упоминания об осквернении, однако оно может шире обозначать всё, что принадлежит Божьей святости.
    reason: lexical_alternative
lexical_decisions:
- source_word: non parcam illis
  choice: Я не пощажу их
  rationale: Прямо передаёт решительный отказ проявить пощаду.
- source_word: discedite
  choice: Уходите
  rationale: Естественный современный императив, сохраняющий значение удаления или ухода.
- source_word: filii apostatae
  choice: дети-отступники
  rationale: Сохраняет обращение filii и характеризует адресатов как отпавших или мятежных; форма не уточняет их пол.
- source_word: sanctificationem meam
  choice: Моей святыни
  rationale: В контексте глагола «осквернять» конкретное «святыня» звучит естественно и может обозначать то, что принадлежит Божьей святости, тогда как буквальное «Моё освящение» по-русски может ошибочно восприниматься прежде всего как процесс.
theological_decisions:
- issue: Объём значения sanctificationem meam
  choice: Моей святыни с примечанием о буквальном и более широком значении
  alternative: Моего освящения
  rationale: Перевод не сводит выражение безоговорочно к зданию святилища, а сноска сохраняет возможное указание на освящение или на всё принадлежащее Божьей святости.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и обличительной интонацией. Прописная буква в «Моей» указывает на Бога как говорящего. Маркер сноски поставлен непосредственно после спорного выражения.
