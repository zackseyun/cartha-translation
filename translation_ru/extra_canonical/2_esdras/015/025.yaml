review_pass:
  verdict: approve
  source_fidelity: «Я не пощажу их» точно передаёт non parcam illis; «Уходите» адекватно передаёт discedite; «дети-отступники» сохраняет обращение filii apostatae без неоправданного уточнения пола. «Не оскверняйте Моей святыни» является контекстуально обоснованной конкретизацией sanctificationem meam при глаголе contaminare, а сноска честно сохраняет более широкий и буквальный диапазон смысла.
  naturalness: Текст краток, ясен и естественен для современного литературного русского, с надлежащей торжественно-обличительной интонацией. Сочетание «дети-отступники» несколько возвышенно, но уместно для пророческой речи.
  terminology: «Отступники» верно передаёт apostatae. «Святыня» хорошо работает в данном контексте и не обязует понимать выражение только как здание; примечание надлежащим образом оговаривает буквальное «Моё освящение» и более широкое значение того, что относится к Божьей святости. Это согласуется с английской аудиторской фиксацией лексической неоднозначности, хотя русский перевод избегает неестественного в основном тексте «Моё освящение».
