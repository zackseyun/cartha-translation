review_pass:
  verdict: revise
  source_fidelity: 'Начальное «Когда ты опьянела?» точно передаёт латинское cum inebriata es? в его вопросительном употреблении. «Плата блудницы» верно сохраняет личный генитив fornicariae, а «воздаяние» адекватно передаёт судебно-ответный смысл redditionem. Однако «у тебя на груди» чрезмерно конкретизирует неоднозначное in sinus tuos: sinus может означать лоно/пазуху и складки одежды у груди.'
  naturalness: «Укрась красоту своего лица» — буквальное, но для современного литературного русского неестественное сочетание. «Приукрась своё лицо» естественно и передаёт exorna speciem vultus tui («укрась/приукрась вид своего лица») без искусственной тавтологии. «В твоём лоне» сохраняет высокий пророческий регистр и пространственную неопределённость оригинала.
  terminology: «Блудница» уместна в возвышенно-пророческом контексте и сохраняет олицетворение адресата. «Воздаяние» соответствует контексту расплаты и не вносит конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Неестественная передача speciem vultus tui
    rationale: Латинское выражение означает «облик/вид лица», а не буквально «красоту лица». Русское «укрась красоту» звучит как ненамеренная тавтология и хуже соответствует обычному значению species.
  - severity: medium
    issue: Сужение значения in sinus tuos
    rationale: Вариант «у тебя на груди» выбирает конкретное телесное значение, тогда как латинское sinus оставляет открытыми «лоно/пазуха» и складки одежды. Основной текст должен сохранять эту образную неопределённость.
  revised_text: Когда ты опьянела? Приукрась своё лицо! Плата блудницы — в твоём лоне[a]; ибо ты получишь воздаяние.
