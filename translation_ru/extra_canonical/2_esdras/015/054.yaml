base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: ru
  text: Когда ты опьянела? Приукрась своё лицо! Плата блудницы — в твоём лоне[a]; ибо ты получишь воздаяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское sinus (здесь во множественном числе) может означать «лоно», «пазуху» или складки одежды у груди, где могли хранить деньги.
    reason: Сохраняет неоднозначность пространственного образа в in sinus tuos, не навязывая одного конкретного значения.
lexical_decisions:
- source_word: inebriata es
  choice: ты опьянела
  rationale: Латинская форма допускает буквальное «ты была опьянена», однако по-русски состояние естественно передаётся возвратным по смыслу глаголом «опьянела», без уточнения причины опьянения.
- source_word: Exorna speciem uultus tui
  choice: Укрась красоту своего лица
  rationale: Сохранены повелительная форма и необычное сочетание «укрась красоту», не сглаживающее риторическую резкость оригинала.
- source_word: Merces fornicariae
  choice: Плата блудницы
  rationale: Родительный падеж единственного числа fornicariae обозначает именно блудницу, сохраняя олицетворение адресата, а не отвлечённое «блудодеяние».
- source_word: in sinus tuos
  choice: у тебя на груди
  rationale: Sinus может обозначать грудь, лоно либо складки одежды у груди; основной вариант передаёт образ естественно и без излишней конкретизации.
- source_word: redditionem recipies
  choice: ты получишь воздаяние
  rationale: Передаёт идею ответной расплаты и сохраняет торжественно-судебный оттенок исходного выражения.
