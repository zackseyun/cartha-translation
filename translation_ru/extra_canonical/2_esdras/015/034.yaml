  text: ecce nubs ab oriente et a septentrione usque ad meridianum, et facies illorum horrida valde, plena irae et procellae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/034.yaml
  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: ru
  text: Вот, тучи с востока и с севера простираются до юга; вид их весьма ужасен, полон ярости и бури.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Вот
  rationale: Передаёт указательное и привлекающее внимание значение латинского ecce естественным для русского библейского повествования способом.
- source_word: nubs
  choice: тучи
  rationale: Форма, вероятно, представляет собой вариант или ошибку вместо nubes; «тучи» сохраняет зловещий образ и лучше соответствует последующим словам о буре, чем нейтральное «облака».
- source_word: ab oriente et a septentrione usque ad meridianum
  choice: с востока и с севера простираются до юга
  rationale: В русском добавлен подразумеваемый глагол «простираются», чтобы естественно передать эллиптическую латинскую конструкцию и пространственный охват usque ad.
- source_word: facies illorum
  choice: вид их
  rationale: В данном контексте facies обозначает внешний вид или облик туч; «вид их» звучит естественно и не навязывает буквального образа лиц.
- source_word: horrida valde
  choice: весьма ужасен
  rationale: Сохраняет усиление valde и сильную отрицательную характеристику horrida в dignified modern Russian.
- source_word: plena irae et procellae
  choice: они полны ярости и бури
  rationale: Сохраняет олицетворяющую метафору и оба родительных дополнения, не сводя ira к человеческому гневу и не ослабляя procella.
theological_decisions:
- issue: Олицетворение туч как носителей ярости
  choice: «они полны ярости и бури»
  alternative: «их вид исполнен ярости и бури»
  rationale: Латинское plena, вероятнее всего, согласуется с множественным nubes, поэтому полнота ярости и бури отнесена непосредственно к тучам; образ сохранён без богословского уточнения источника ярости.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Эллипсис исходного текста раскрыт минимально добавленным глаголом «простираются»; неоднозначная и образная связь «ярости» с тучами сохранена.
