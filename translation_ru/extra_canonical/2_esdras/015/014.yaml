  yaml_path: translation/extra_canonical/2_esdras/015/014.yaml
  text: Woe to the world and to those who dwell in it![a]
translation:
  language: ru
  text: Горе миру и тем, кто живёт в нём![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Горе веку».'
    reason: Латинское saeculum может обозначать как мир, так и век (эпоху).
lexical_decisions:
- source_word: saeculo
  choice: миру
  rationale: Хотя saeculum может означать «век», здесь пространственное значение «мир» естественно подтверждается словами qui habitant in eum — «те, кто живёт в нём».
- source_word: habitant
  choice: живёт
  rationale: В сочетании с qui передаёт постоянное пребывание, а по-русски «те, кто живёт» звучит естественно и ясно.
theological_decisions:
- issue: 'Значение saeculum: «мир» или «век»'
  choice: мир
  alternative: век
  rationale: Контекст с обитателями указывает на мир как пространство их жизни, однако возможное временное значение латинского слова сохранено в примечании.
translation_notes:
  register: Краткая пророческая формула передана современным, литературным и торжественным русским языком; сохранены восклицание и параллельная структура исходного текста.
