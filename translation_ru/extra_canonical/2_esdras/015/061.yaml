  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: ru
  text: Они будут для тебя огнём. Они поглотят тебя и твои города, твою землю и твои горы; все твои леса и плодовые деревья они сожгут огнём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: Они станут для тебя огнём
  rationale: Буквально и естественно передаёт именную конструкцию будущего времени и сохраняет образ огня.
- source_word: deuorabunt te
  choice: поглотят тебя
  rationale: «Поглотят» сохраняет сильную метафору латинского devorabunt и подходит к образу пожирающего огня.
- source_word: ciuitates tuas
  choice: твои города
  rationale: Прямой современный эквивалент множественного числа civitates в данном контексте.
- source_word: lignum fructiferum
  choice: плодовые деревья
  rationale: Естественная русская передача деревьев, приносящих плод; она яснее буквального «плодоносная древесина».
