  philosophy: optimal-equivalence
lexical_decisions:
- source_word: primaria
  choice: первой
  rationale: Латинская форма обозначает первенство или главенство и согласована с подразумеваемой адресаткой женского рода; «первой» естественно по-русски и не уточняет, идёт ли речь о первенстве по времени, положению или роли.
- source_word: accipies mala
  choice: примешь бедствия
  rationale: Сохраняет прямой образ получения постигших зол, но передаёт mala естественным в данном пророческом контексте словом «бедствия».
- source_word: Et in transitu
  choice: А проходя…
  rationale: Передаёт незавершённый переход к следующей мысли; многоточие показывает, что предоставленный латинский отрывок обрывается посреди конструкции.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным пророческим звучанием. Женский род сохранён по форме primaria и контексту обращения. Не поддержанное предоставленным латинским текстом слово «несчастная» не добавлено; ошибочное прежнее чтение, фактически относящееся к следующему стиху, не включено.
