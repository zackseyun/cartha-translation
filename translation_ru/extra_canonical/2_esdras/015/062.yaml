  source_fidelity: '«Сыновей твоих уведут в плен» точно передаёт лат. filios tuos captivos ducent. «Богатство твоё» является допустимой контекстуальной передачей censum tuum («имущество, состояние, богатство»). Поскольку приведённый латинский фрагмент обрывается после censum tuum, сказуемое второй части обоснованно сверено с английским аудиторским слоем: «возьмут как добычу» сохраняет смысл без неоправданного уточнения.'
