lexical_decisions:
- source_word: filios tuos
  choice: сыновей твоих
  rationale: Латинское filios прямо означает «сыновей»; сохранена конкретность исходного текста, тогда как более широкое «детей» было бы менее формальным.
- source_word: captiuos ducent
  choice: уведут в плен
  rationale: Естественная русская передача насильственного увода в качестве пленников.
- source_word: censum tuum
  choice: богатство твоё
  rationale: Census может обозначать имущество, состояние или богатство; здесь контекст разграбления поддерживает обобщённое «богатство».
- source_word: take as spoil (audited English completion after truncated Latin excerpt)
  choice: возьмут как добычу
  rationale: Предоставленный латинский фрагмент обрывается после censum tuum, поэтому сказуемое второй части передано по проверочному английскому слою без добавления более узкого смысла.
