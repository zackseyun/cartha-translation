base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: ru
  text: Ибо из-за их гордыни города придут в смятение, дома будут уничтожены, и люди устрашатся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter superbiam enim eorum
  choice: Ибо из-за их гордыни
  rationale: Сохраняет причинную связь propter, пояснительное enim и отрицательно окрашенное значение superbia.
- source_word: civitates turbabuntur
  choice: города придут в смятение
  rationale: Передаёт пассивно-непереходное turbabuntur как состояние потрясения и беспорядка, не сужая его до одного лишь общественного волнения.
- source_word: domus exterentur
  choice: дома будут разорены
  rationale: В контексте бедствий exterentur означает опустошение или уничтожение; «разорены» естественно по-русски и не усиливает выражение до безусловного полного разрушения.
- source_word: homines metuent
  choice: люди устрашатся
  rationale: Точно передаёт будущее время metuent и сохраняет возвышенный, но понятный библейский регистр.
