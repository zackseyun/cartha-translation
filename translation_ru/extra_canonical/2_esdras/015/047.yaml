  source_fidelity: 'Основной смысл передан верно: «Горе тебе», женский род обращения, уподобление другой женщине, украшение дочерей и связь с любовниками сохранены. Однако латинское propter quod требует явного причинного «потому что/за то, что», а конструкция in fornicatione ближе к «для блуда/проституции», чем к общему «для разврата».'
  naturalness: Текст звучит современно и литературно. Явное «потому что» делает причинную связь естественной и снимает синтаксическую неоднозначность. «Хвалиться своими любовниками» естественно передаёт gloriandum in amatoribus.
  terminology: «Любовники» точно соответствует amatores в данном обличительном контексте. «Блуд» — традиционное, но всё ещё понятное литературное слово и точнее сохраняет семантическую широту латинского fornicatione, не сужая её до коммерческой проституции и не размывая до общего «разврата».
