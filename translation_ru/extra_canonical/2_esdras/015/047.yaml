source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: ru
  text: Горе тебе, несчастная, потому что ты уподобилась ей и нарядила своих дочерей для блуда, чтобы угождать своим любовникам и хвалиться ими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi, misera
  choice: Горе тебе, несчастная!
  rationale: Сохраняет пророческое восклицание и прямое обращение женского рода; современно и достойно по регистру.
- source_word: propter quod adsimilasti ei
  choice: Ты уподобилась ей
  rationale: Передаёт причинную связь контекстуальным бессоюзным продолжением после восклицания и сохраняет женский род субъекта и местоимения.
- source_word: ornasti filias tuas
  choice: нарядила своих дочерей
  rationale: Буквально сохраняет образ украшения или наряжания, не сводя его к более общему «приготовила».
- source_word: in fornicatione
  choice: для разврата
  rationale: В данном контексте обозначает сексуальную безнравственность, к которой дочерей наряжают; «разврат» естественнее в современном русском, чем буквальное «в блуде».
- source_word: ad placendum et gloriandum in amatoribus
  choice: чтобы угождать своим любовникам и хвалиться ими
  rationale: Инфинитивы цели переданы однородными русскими глаголами; amatores здесь естественно означает любовников, а in amatoribus — предмет хвастовства.
theological_decisions:
- issue: Характер образа fornicatione
  choice: Сохранить прямой сексуально-нравственный смысл как «разврат», не превращая его явно в метафору идолопоклонства.
  alternative: «для проституции» или «в блуде»
  rationale: Латинское выражение допускает широкий смысл сексуальной распущенности; контекст не требует сужать его исключительно до коммерческой проституции или заранее истолковывать богословски.
translation_notes:
  register: Современный литературный русский с пророческой торжественностью. Синтаксис сделан естественным, при этом сохранены резкость обличения, женский род адресата и образ наряженных дочерей.
