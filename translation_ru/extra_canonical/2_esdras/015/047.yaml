  - severity: low
    issue: «Для разврата» несколько обобщает in fornicatione.
    rationale: «Разврат» в современном русском может охватывать широкий круг безнравственности. «Для блуда» ближе к сексуальному значению fornicatione, при этом не навязывает более узкий смысл проституции.
  revised_text: Горе тебе, несчастная, потому что ты уподобилась ей и нарядила своих дочерей для блуда, чтобы угождать своим любовникам и хвалиться ими.
