id: 2ES.15.16
reference: 2 Esdras 15:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erit enim constabilitio hominibus, alisalios supervalescentes non curabunt regem suum et principem megestanorum suorum in potentia sua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: ru
  text: Ибо среди людей начнётся смута; одолевая друг друга, они не будут считаться ни со своим царём, ни с главой своих вельмож, полагаясь на собственную силу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в своей силе»; заключительный оборот можно также связать со словами «одолевая друг друга».'
    reason: Латинский оборот in potentia sua допускает неоднозначную синтаксическую связь.
lexical_decisions:
- source_word: constabilitio
  choice: смута
  rationale: По контексту и засвидетельствованному пониманию формы как обозначения нестабильности речь идёт об общественном нестроении; «смута» естественно передаёт это значение по-русски.
- source_word: alisalios supervalescentes
  choice: одолевая друг друга
  rationale: Передаёт взаимное действие alii alios и причастное значение supervalescentes — превосходить силой, брать верх.
- source_word: non curabunt
  choice: не будут считаться
  rationale: В данном контексте выражает не просто отсутствие заботы, а пренебрежение властью и отказ принимать её во внимание.
- source_word: principem megestanorum suorum
  choice: главой своих вельмож
  rationale: Сохраняет единственное число principem и зависимый родительный множественного числа megestanorum, обозначающий знатных или могущественных людей.
- source_word: in potentia sua
  choice: полагаясь на собственную силу
  rationale: Естественная русская передача обстоятельственного оборота, сохраняющая связь их неповиновения с ощущением собственной силы.
theological_decisions:
- issue: К кому относится заключительный оборот in potentia sua
  choice: 'Связан с отказом считаться с царём и главой вельмож: «полагаясь на собственную силу»'
  alternative: 'Буквально: «в своей силе»; возможно также отнести оборот к взаимному одолению'
  rationale: Положение оборота допускает синтаксическую неоднозначность; основной текст выбирает наиболее связное русское прочтение, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. «Смута» предпочтена буквальной «неустойчивости» как более естественное обозначение общественного беспорядка; парная конструкция «ни… ни…» ясно объединяет два объекта неповиновения.
