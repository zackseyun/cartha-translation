  rationale: Латинское zelabo — форма будущего времени от zelare; в контексте суда выражает ревностный, пламенный гнев, направленный против адресата. Условное «стал бы» сохраняет функцию фразы в составе условного рассуждения, продолжающегося в следующем стихе.
