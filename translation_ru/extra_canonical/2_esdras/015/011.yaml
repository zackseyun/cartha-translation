source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sed educam eum in manu potenti et brachio excelso, et percutiam Aegyptum plaga sicut prius, et corrumpam terram omnem eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/011.yaml
  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: ru
  text: Но Я выведу его[a] могучей рукой и поднятой мышцей, поражу Египет язвой[b], как прежде, и погублю всю его землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В латинском тексте — «его»; местоимение может обозначать упомянутый народ как единое целое.
    reason: Сохраняет форму источника и поясняет возможное собирательное значение, отражённое в английском переводе словом them.
  - marker: b
    text: 'Или: «бедствием»; единственное число может иметь собирательный смысл, напоминая о прежних казнях Египта.'
    reason: Передаёт лексическую и числовую неоднозначность plaga без её молчаливого устранения.
lexical_decisions:
- source_word: educam
  choice: выведу
  rationale: В контексте нового исхода глагол означает не просто «поведу», а «выведу» из угнетения.
- source_word: in manu potenti et brachio excelso
  choice: могучей рукой и поднятой мышцей
  rationale: Сохраняется двучленная библейская формула и различие между manus («рука») и brachium («мышца, рука от плеча»); «поднятой» прямо передаёт excelso и остаётся понятным в современном торжественном регистре.
- source_word: percutiam
  choice: поражу
  rationale: Прямой и естественный эквивалент в контексте божественной кары.
- source_word: plaga
  choice: язвой
  rationale: Латинское существительное стоит в единственном числе; «язва» сохраняет связь с казнями египетскими и библейский регистр.
- source_word: corrumpam
  choice: погублю
  rationale: Передаёт сильное значение corrumpere применительно ко всей земле, не ограничивая его только материальным разорением.
theological_decisions:
- issue: Число объекта при educam
  choice: его
  alternative: их
  rationale: Латинский текст прямо имеет eum, мужской род, единственное число. Перевод сохраняет эту форму и не подменяет её контекстуальным множественным числом.
- issue: Число plaga
  choice: язвой
  alternative: язвами / казнями
  rationale: Сохранено грамматическое единственное число источника, при этом примечание указывает на возможный собирательный смысл и отсылку к прежним египетским казням.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слово «мышца» употреблено в традиционном значении «рука от плеча», чтобы сохранить параллелизм исходной формулы; остальная лексика остаётся общепонятной.
