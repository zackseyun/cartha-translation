  source_fidelity: 'Текст точно передаёт латинский перечень бедствий: Inmittam tibi mala, uiduitatem, paupertatem, famem, gladium et pestem. «Вдовство», «нищета», «голод», «меч» и «мор» соответствуют исходным словам и сохраняют пророческий регистр. Две конструкции с ad различены: «чтобы опустошить твои дома» передаёт ad deuastandas domus tuas, а «для поругания» не превращает ad uiolationem в обстоятельство способа. Вводное «Бог говорит» — естественное русское оформление имеющегося в тексте deus с последующей прямой речью.'
