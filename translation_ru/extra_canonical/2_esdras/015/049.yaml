source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deus: Inmittam tibi mala, uiduitatem, paupertatem et famem et gladium et pestem ad deuastandas domus tuas, ad uiolationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: ru
  text: 'Бог говорит: «Я пошлю на тебя бедствия: вдовство, нищету, голод, меч и мор — чтобы опустошить твои дома, для поругания[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «для поругания» в латинском тексте представляет собой вторую целевую конструкцию с предлогом ad; синтаксически мысль продолжается в следующем стихе.
    reason: Стих заканчивается на формально незавершённом выражении, которое легко ошибочно принять за указание на способ опустошения домов.
lexical_decisions:
- source_word: Inmittam tibi mala
  choice: Я пошлю на тебя бедствия
  rationale: Естественно передаёт направленное против адресата действие; множественное mala обозначает ряд последующих бедствий.
- source_word: uiduitatem
  choice: вдовство
  rationale: Сохраняет образ утраты супруга, метафорически обращённый к городу, без замены более общим словом «одиночество».
- source_word: paupertatem
  choice: нищету
  rationale: Передаёт крайнюю бедность как одно из бедствий.
- source_word: gladium
  choice: меч
  rationale: Сохраняет традиционную и понятную метонимию войны и насильственной смерти.
- source_word: pestem
  choice: мор
  rationale: Краткий библейский термин для смертоносной эпидемии; здесь он естественнее, чем специальное «моровая язва».
- source_word: ad deuastandas domus tuas
  choice: чтобы опустошить твои дома
  rationale: Передаёт целевую конструкцию ad с герундивом и сохраняет обращение к олицетворённому городу во втором лице единственного числа.
- source_word: ad uiolationem
  choice: для поругания
  rationale: Сохраняет вторую параллельную целевую конструкцию с ad и смысл осквернения, надругательства или попрания, не превращая её в обстоятельство образа действия.
theological_decisions:
- issue: Кто произносит угрозу
  choice: Сохранить вводное «Бог говорит»
  alternative: Начать непосредственно словами «Я пошлю…»
  rationale: Слово deus присутствует в предоставленном латинском тексте; двоеточие указывает на введение прямой речи.
- issue: Синтаксическая незавершённость выражения ad uiolationem
  choice: 'Передать буквально и параллельно: «для поругания»'
  alternative: Связать с предыдущей фразой как «опустошить твои дома поруганием» или завершить смысл догадкой
  rationale: Латинский текст содержит второе ad; его следует сохранить как отдельное целевое выражение и не устранять возможный перенос синтаксиса в следующий стих.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической пророческой речи. Перечень бедствий дан ритмично и ясно; «меч» и «мор» сохранены как общеупотребительные библейские образы. Синтаксическая напряжённость конца латинского фрагмента не сглажена.
