source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc ergo dispone domum tuam, et corripe populum tuum, et consolare humiles eorum, et renuntia iam corruptae uitae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/013.yaml
  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: ru
  text: Итак, теперь приведи свой дом в порядок, обличи свой народ, утешь смиренных в твоём народе и отрекись уже от тленной жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от порочной жизни».'
    reason: Сохраняет возможное нравственное прочтение латинского corruptae наряду с основным контекстуальным значением тленности.
lexical_decisions:
- source_word: dispone domum tuam
  choice: приведи свой дом в порядок
  rationale: Естественное современное соответствие латинскому выражению со значением устроить домашние дела перед уходом.
- source_word: corripe populum tuum
  choice: вразуми свой народ
  rationale: Corripe сочетает обличение с исправительным наставлением; «вразуми» сохраняет эту направленность без излишне узкого оттенка простого порицания.
- source_word: humiles eorum
  choice: смиренных среди них
  rationale: Передаёт humiles как «смиренных», а местоимение eorum естественно соотносит их с упомянутым народом.
- source_word: renuntia iam corruptae uitae
  choice: отрекись уже от тленной жизни
  rationale: «Тленная» передаёт смертность и подверженность разрушению, существенные в ближайшем контексте, тогда как «испорченная» могла бы однозначно подразумевать нравственную порочность; iam передано словом «уже».
theological_decisions:
- issue: Значение corruptae uitae
  choice: тленной жизни
  alternative: испорченной жизни
  rationale: Контекст следующего стиха — смертные помыслы, человеческое бремя и немощная природа — поддерживает значение смертности и тленности, но латинская форма допускает также оттенок испорченности, поэтому он отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повелительные формы ясны и последовательны; «свой народ» и «среди них» устраняют ненужную местоименную тяжеловесность.
