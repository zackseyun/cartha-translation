review_pass:
  verdict: revise
  source_fidelity: «Вразуми» передаёт исправительную цель corripe, но ослабляет его основной оттенок обличения/выговора. «Обличи» точнее отражает латинское повеление. Corruptae vitae в данном контексте обоснованно передано как «тленной жизни»; iam естественно передано словом «уже».
  naturalness: Текст в целом звучит естественно и литературно. «Смиренных среди них» несколько менее прямо выражает зависимое eorum; «смиренных в твоём народе» яснее связывает эту группу с только что названным народом.
  terminology: «Тленная жизнь» удачно сохраняет эсхатологически значимый смысл смертной, преходящей жизни и не навязывает нравственно-порочное прочтение. Сноска допустимо фиксирует альтернативное лексическое прочтение, но «испорченная жизнь» по-русски звучит несколько бытово; «порочная жизнь» точнее передаёт нравственный вариант.
  issues:
  - severity: medium
    issue: «Вразуми свой народ» ослабляет corripe.
    rationale: Corripe означает обличать, делать выговор, исправительно укорять; «вразумить» может обозначать просто наставить или научить понимать.
  - severity: low
    issue: «Смиренных среди них» менее прямо передаёт eorum.
    rationale: Латинское местоимение относится к народу; формулировка «в твоём народе» делает эту связь ясной и сохраняет смысл.
  - severity: low
    issue: Формулировка альтернативы в сноске стилистически неточна.
    rationale: «Испорченная жизнь» в современном русском двусмысленна и разговорно окрашена; при нравственном прочтении corruptae естественнее «порочная жизнь».
  revised_text: Итак, теперь приведи свой дом в порядок, обличи свой народ, утешь смиренных в твоём народе и отрекись уже от тленной жизни.[a]
