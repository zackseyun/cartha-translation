  rationale: Исправлено «вразуми» на «обличи» для более точной передачи corripe; уточнена связь humiles eorum с народом. Основное «тленной жизни» и позиция «уже» сохранены как соответствующие непосредственному контексту и английскому аудиторскому решению; сноска стилистически уточнена без изменения смысла.
