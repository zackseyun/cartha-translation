  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: ru
  text: И я взял это и выпил. Когда же я выпил, сердце моё изливало разумение, и в груди моей возрастала мудрость, потому что дух мой сохранял память[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранял способность помнить».'
    reason: Латинское memoriam может указывать как на сохраняемое содержание памяти, так и на способность помнить.
lexical_decisions:
- source_word: accepi et bibi
  choice: я взял это и выпил
  rationale: Передаёт два последовательных действия; местоимение «это» естественно отсылает к напитку из предшествующего контекста.
- source_word: cor meum eructuabat intellectum
  choice: сердце моё стало изливать разумение
  rationale: Латинское eructuabat буквально описывает извержение или исторжение, но в возвышенном контексте естественно передаётся как «изливать»; intellectum сохранено как «разумение», без сведения смысла только к знаниям.
- source_word: in pectus meum increscebat sapientia
  choice: в груди моей возрастала мудрость
  rationale: Сохраняются телесный образ pectus и процесс постепенного возрастания, выраженный increscebat.
- source_word: spiritus meus conseruabat memoriam
  choice: дух мой сохранял память
  rationale: Conservabat означает «сохранял, удерживал», а memoriam прямо обозначает память; формулировка сохраняет возможную двусмысленность между содержанием памяти и способностью помнить.
theological_decisions:
- issue: Связь духа, памяти и дарованной мудрости
  choice: «дух мой сохранял память»
  alternative: «дух мой сохранял способность помнить»
  rationale: Основной текст не уточняет, идёт ли речь о сохранении воспоминаний или самой способности помнить, и потому не разрешает заложенную в memoria смысловую неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены образы сердца, груди и духа, а также смысловая напряжённость выражения о памяти.
