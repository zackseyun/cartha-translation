  text: But let no one come near me now, nor seek me for forty days.”
translation:
  language: ru
  text: Но пусть теперь никто не приближается ко мне и не разыскивает меня сорок дней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся в приведённом латинском отрывке текст начинается внутри предложения со слов «…будут разыскивать меня сорок дней». Начало запрета восстановлено по контексту и текстовой традиции. Следующие слова — «И я взял пятерых мужей…» — относятся уже к следующему стиху.
    reason: Уточняет границу сохранённого текста и отличает непосредственно засвидетельствованное окончание фразы от её контекстуального восстановления.
lexical_decisions:
- source_word: requirent me
  choice: не ищет меня
  rationale: Латинский глагол requirere здесь означает «искать, разыскивать». В русском запрет естественно передан формой «пусть… не ищет».
- source_word: usque diebus XL
  choice: сорок дней
  rationale: Несмотря на необычную падежную форму в очищенном латинском тексте, выражение обозначает продолжительность установленного сорокадневного срока.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены повелительная форма запрета и краткость исходного высказывания. «Приближается» выбрано вместо разговорного «подходит», чтобы выдержать dignified библейский регистр без архаизации.
