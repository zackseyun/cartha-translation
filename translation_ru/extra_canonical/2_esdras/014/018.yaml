  text: Then I answered and said before you[a], Lord, "Behold, I will go,"
translation:
  language: ru
  text: 'И я ответил и сказал пред Тобой, Господи: «Вот, я уйду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  choice: пред Тобой
  rationale: Передаёт пространственно-реляционное значение латинского выражения и сохраняет возвышенный, но понятный регистр.
- source_word: Ecce enim
  choice: Вот
  rationale: «Вот» естественно передаёт ecce; enim здесь не требует отдельного русского соответствия, поскольку пояснительная связь ясна из контекста, а «ибо» звучало бы незавершённо.
- source_word: abibo
  choice: я уйду
  rationale: Будущая форма глагола abire означает уход; «уйду» точно и естественно передаёт её без добавления направления, которого в тексте нет.
