lexical_decisions:
- source_word: cum perfeceris
  choice: Когда ты закончишь их
  rationale: Временная конструкция с cum передана естественным русским придаточным; местоимение «их» восстанавливает подразумеваемый объект из контекста.
- source_word: quaedam palam facies
  choice: часть сделай общедоступной
  rationale: Palam обозначает открытое, публичное обнародование; «часть» естественно передаёт соотнесённые quaedam… quaedam.
- source_word: quaedam sapientibus absconse trades
  choice: а часть тайно передай мудрым
  rationale: Сохранены противопоставление публичного и тайного, адресат sapientibus и значение trades — «передай».
- source_word: enim
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущим повелением, не оставляя союз без перевода.
- source_word: in crastinum hac hora
  choice: завтра в это же время
  rationale: Современная и точная временная формулировка.
- source_word: profectus sum
  choice: я пошёл
  rationale: Передаёт уход и исполнение повеления без ненужного уточнения направления.
- source_word: congregaui omnem
  choice: собрал всех…
  rationale: Omnem согласуется с подразумеваемым далее существительным или обозначением группы; незавершённость исходного фрагмента сохранена многоточием.
theological_decisions:
- issue: Разделение записанного на открытое и тайно передаваемое
  choice: Сохранить прямое противопоставление без пояснения содержания или статуса обеих частей
  alternative: Уточнить, что речь идёт о канонических и сокровенных книгах
  rationale: Сам стих такого конфессионального или канонического толкования прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Императивы переданы прямо; пояснительное enim сохранено как «ведь». Конечная синтаксическая незавершённость обусловлена границей предоставленного исходного текста.
