  text: 'чтобы живущие в последние дни могли жить». Он ответил мне и сказал: «Пойди, собери народ и скажи им, чтобы они не искали тебя'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuere ... uiuant
  choice: чтобы могли жить
  rationale: Сохранена намеренная лексическая связь между инфинитивом и личной формой латинского глагола; по-русски конструкция передана естественно с модальным оттенком цели/возможности.
- source_word: in nouissimis
  choice: в последние дни
  rationale: Латинское субстантивированное выражение буквально означает «в последних [временах/днях]»; «в последние дни» ясно передаёт эсхатологический смысл и соответствует контексту.
- source_word: uadens congrega populum
  choice: Пойди, собери народ
  rationale: Причастие с императивом естественно передано последовательными повелительными формами, без изменения порядка действий.
- source_word: ut non te quaerant
  choice: чтобы они не искали тебя
  rationale: Сохранены придаточная конструкция и прямой смысл quaerant; местоимение «они» добавлено для естественности русского синтаксиса.
theological_decisions:
- issue: Кого подразумевает начальное uiuere
  choice: те, кому предстоит жить
  alternative: живущие
  rationale: В начале стиха исходный латинский текст представляет продолжение предыдущего предложения и не называет субъект явно. Формулировка восстанавливает подразумеваемых людей, не уточняя их богословский статус.
- issue: Значение in nouissimis
  choice: в последние дни
  alternative: в последние времена
  rationale: Оба варианта допустимы, но «последние дни» сохраняет традиционную библейскую образность, не устраняя эсхатологического напряжения.
translation_notes:
  register: Современный литературный русский язык с простым, достойным библейским регистром. Стих начинается как продолжение фразы из предыдущего стиха и заканчивается незавершённой прямой речью, переходящей в следующий стих; это сохранено.
