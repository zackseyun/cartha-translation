  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: ru
  text: Последние же семьдесят книг[a] сохрани, чтобы передать их мудрым из твоего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последние семьдесят книг представлены как сокровенная мудрость, предназначенная для мудрых из народа Ездры; это важная композиционная черта изображения скрытого откровения в 4-й книге Ездры.
    reason: compositional_layer
lexical_decisions:
- source_word: Nouissimos autem LXX
  choice: Последние же семьдесят книг
  rationale: Латинское «novissimos» означает «последние», а «autem» передано частицей «же», сохраняющей противопоставление. Слово «книг» восстановлено из ближайшего контекста и необходимо для ясности по-русски.
- source_word: conseruabis
  choice: сохрани
  rationale: По контексту обращённой к Ездре заповеди будущее время латинского глагола естественно передаётся русским повелительным наклонением.
- source_word: ut
  choice: чтобы
  rationale: 'Сохраняет целевую связь с продолжением фразы, засвидетельствованным переводной традицией: книги следует сохранить для передачи мудрым.'
theological_decisions:
- issue: Сокрытый характер последних семидесяти книг
  choice: сохрани, чтобы передать их мудрым из твоего народа
  alternative: сохрани в тайне только для посвящённых
  rationale: 'Формулировка не усиливает текст идеей тайного посвящения: она сохраняет различие между общедоступными и предназначенными для мудрых книг, не уточняя природу или условия доступа.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским синтаксисом. Частица «же» передаёт противопоставление без архаизации; неоднозначное обозначение «мудрых» оставлено без конфессионального истолкования.
