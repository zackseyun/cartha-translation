id: 2ES.14.14
reference: 2 Esdras 14:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: ru
  text: И отбрось от себя смертные помыслы, сбрось с себя человеческие тяготы, сбрось с себя теперь немощную природу и отложи в сторону наиболее тягостные для тебя мысли, и…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortales cogitationes
  choice: смертные помыслы
  rationale: Сохраняет буквальную связь с человеческой смертностью и не сужает выражение до греховных или мирских мыслей.
- source_word: pondera humana
  choice: человеческое бремя
  rationale: Естественная русская передача образа тяжести; собирательное единственное число звучит плавно и сохраняет общий смысл.
- source_word: exue te
  choice: совлеки с себя
  rationale: Передаёт метафору снятия одежды, заложенную в латинском exuere, в dignified biblical register.
- source_word: infirmam naturam
  choice: немощную природу
  rationale: Сохраняет антропологическую широту natura и значение слабости infirmam, не подменяя его нравственной испорченностью.
- source_word: repone in unam partem
  choice: отложи в сторону
  rationale: Идиоматично передаёт пространственную метафору удаления и временного оставления.
- source_word: molestissima tibi cogitamenta
  choice: тягостнейшие для тебя мысли
  rationale: Передаёт превосходную степень и личную отнесённость tibi без уточнения причины тягости.
theological_decisions:
- issue: Значение выражения «немощная природа»
  choice: Сохранено широкое обозначение слабой человеческой природы.
  alternative: «греховная природа» или «тленная плоть»
  rationale: Латинское infirmam означает слабую или немощную, а natura — природу; текст сам по себе не требует ни исключительно нравственного, ни исключительно телесного толкования.
- issue: Значение «смертных помыслов»
  choice: 'Оставлена неоднозначность: это могут быть мысли смертного человека или мысли, связанные со смертностью.'
  alternative: «мирские мысли»
  rationale: Определение mortales не тождественно «мирские» и не оправдывает такого богословского уточнения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Совлеки» выбрано ради сохранения образа снятия одежды; остальная лексика остаётся общепонятной. Конечный союз «и…» сохранён, поскольку представленный источник обрывается на et и стих синтаксически продолжается.
