  text: Эти слова ты обнародуешь, а эти скроешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in palam facies
  choice: обнародуешь
  rationale: Латинское выражение означает «сделаешь явными, открытыми для всех»; «обнародуешь» естественно и кратко передаёт публичное раскрытие.
- source_word: abscondes
  choice: скроешь
  rationale: Прямо передаёт будущее действие — сохранить вторую часть слов в тайне, не делая её доступной всем.
theological_decisions:
- issue: Противопоставление открытых и скрытых слов
  choice: Сохранено без пояснения, какие именно слова относятся к каждой группе
  alternative: Конкретизировать содержание или адресатов публикации
  rationale: Источник оставляет указательные местоимения без дальнейшего уточнения; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык; лаконичная и торжественная формулировка. Параллелизм латинского предложения сохранён посредством конструкции «эти… а эти…».
