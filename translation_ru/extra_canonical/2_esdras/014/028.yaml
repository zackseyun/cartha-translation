source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: grinati sunt patres nostri ab initio in Aegypto, et liberati sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/028.yaml
  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: ru
  text: С самого начала[a] наши отцы жили в Египте как пришельцы и были освобождены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наши отцы с самого начала жили как пришельцы в Египте».'
    reason: 'Латинское ab initio допускает несколько различное смысловое присоединение: ко всей последовательности событий либо непосредственно к пребыванию отцов в Египте.'
lexical_decisions:
- source_word: patres nostri
  choice: наши отцы
  rationale: Сохраняет образ и коллективно-родовое значение латинского выражения, не заменяя его более толковательным словом «предки».
- source_word: grinati sunt
  choice: жили … как пришельцы
  rationale: По контексту и засвидетельствованному пониманию текста передаёт проживание не на своей земле; современная конструкция яснее архаичного «пришельствовали».
- source_word: liberati sunt
  choice: были освобождены
  rationale: Точно сохраняет страдательный залог и не добавляет отсутствующего в источнике указания «оттуда».
- source_word: ab initio
  choice: с самого начала
  rationale: Близко передаёт исходное временное выражение, а возможная неоднозначность его связи с остальной фразой отмечена в сноске.
theological_decisions:
- issue: Характер освобождения
  choice: были освобождены
  alternative: были избавлены
  rationale: «Освобождены» не уточняет, было ли избавление политическим, физическим или богословским, и тем самым сохраняет широту латинского liberati sunt.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Выражение «как пришельцы» понятно современному читателю и сохраняет идею временного проживания на чужой земле; синтаксис не добавляет отсутствующего в источнике места освобождения.
