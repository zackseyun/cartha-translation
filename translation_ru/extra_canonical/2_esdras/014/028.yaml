review_pass:
  verdict: approve
  source_fidelity: «Наши отцы» точно передаёт patres nostri. Оборот «жили в Египте как пришельцы» адекватно выражает смысл переданного в издании grinati sunt — пребывание на чужой земле в статусе пришельцев. «С самого начала» соответствует ab initio и не вводит не имеющегося в латинском уточнения о времени или месте освобождения. «Были освобождены» точно сохраняет пассивный liberati sunt.
  naturalness: Текст звучит естественно на современном литературном русском языке и сохраняет сдержанный библейский регистр. Порядок слов ясно передаёт, что пребывание в Египте предшествовало освобождению.
  terminology: «Пришельцы» — уместный библейский и при этом понятный современному читателю термин для временного проживания на чужой земле. «Освобождены» сохраняет широту liberati sunt и не навязывает конкретного истолкования характера избавления. Сноска привязана к «с самого начала» и добросовестно отмечает возможную сферу действия ab initio.
