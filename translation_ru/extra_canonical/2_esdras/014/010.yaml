lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: Передаёт образ нынешней эпохи или мирового века и сохраняет его персонификацию.
- source_word: perdidit iuuentutem suam
  choice: утратил свою юность
  rationale: Близко воспроизводит латинское выражение и естественно звучит в возвышенной современной русской речи.
- source_word: tempora
  choice: времена
  rationale: Сохраняет множественное число и параллелизм с «веком».
- source_word: adpropinquant senescere
  choice: приближаются к старости
  rationale: Передаёт смысл приближения времён к состоянию старости, сохраняя метафору без её истолкования.
theological_decisions:
- issue: Эсхатологический образ стареющего века
  choice: Сохранена метафора утраты юности и приближения к старости.
  alternative: «Этот мир состарился, и конец времён близок».
  rationale: Альтернатива разъясняет подразумеваемую эсхатологию, но устраняет образность и добавляет прямо не выраженный «конец».
translation_notes:
