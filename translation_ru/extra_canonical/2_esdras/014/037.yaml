lexical_decisions:
- source_word: sumus in campo
  choice: Мы были в поле
  rationale: Хотя sumus формально является настоящим временем («мы находимся»), в связном повествовании перед mansimus естественно передать его русским прошедшим временем; campo здесь означает открытое место, «поле».
- source_word: mansimus ibi
  choice: оставались там
  rationale: Глагол maneo передаёт пребывание или продолжение нахождения в месте; несовершенный вид естественно согласуется с повествовательным контекстом.
- source_word: Et factum est in crastinum
  choice: 'На следующий день случилось следующее:'
  rationale: Латинская повествовательная формула буквально означает «и случилось на следующий день» и вводит продолжение; двоеточие сохраняет её незавершённую, переходную функцию в данном сегменте.
