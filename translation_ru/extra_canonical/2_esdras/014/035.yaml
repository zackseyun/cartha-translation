  source_fidelity: Начальное reuiuiscemus передано по смыслу, однако «оживём» в современном русском может обозначать просто «придём в живое состояние», тогда как в контексте будущего воскресения точнее и естественнее «снова будем жить». Сохранены будущее время, первое лицо множественного числа, единственное nomen («имя праведных»), пассивность ostendentur и оборванный переход после neque.
  naturalness: «Явится имя праведных» возможно, но звучит несколько неестественно в современном литературном русском. «Станет явным имя праведных» ясно передаёт apparebit и не добавляет толкования. Незавершённое «и не» необходимо сохранить, поскольку латинский фрагмент заканчивается на neque.
  terminology: «Праведные» и «нечестивые» уместно сохраняют библейско-нравственный регистр iusti и impii. «Дела нечестивых будут раскрыты» естественно передаёт facta ... ostendentur без указания действующего лица.
