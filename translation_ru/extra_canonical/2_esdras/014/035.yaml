lexical_decisions:
- source_word: reuiuiscemus
  choice: мы вновь оживём
  rationale: Передаёт будущее время и значение возвращения к жизни; сохраняет форму первого лица множественного числа.
- source_word: iustorum nomen
  choice: имя праведных
  rationale: Сохранён буквальный и допускающий неоднозначность образ единственного nomen при родительном множественного числа iustorum, без замены на более истолковывающее «слава» или «имена».
- source_word: impiorum facta
  choice: дела нечестивых
  rationale: Естественное русское соответствие, сохраняющее нравственно-религиозную окраску impii и множественное число facta.
- source_word: ostendentur
  choice: будут открыты
  rationale: Пассивная форма сохранена; выражение означает, что дела станут явными, при этом действующее лицо не уточняется.
- source_word: accedat
  choice: приближается
  rationale: В сочетании ad me естественно передаёт запрет подходить к говорящему.
theological_decisions:
- issue: Смысл выражения iustorum nomen
  choice: имя праведных
  alternative: имена праведных / слава праведных
  rationale: Латинское единственное число nomen сохранено, чтобы не снимать возможную собирательность образа и не вводить толкование о славе.
- issue: Незавершённость стиха после neque
  choice: и не
  alternative: опустить незавершённый союз или завершить фразу по контексту следующего стиха
  rationale: Источник оканчивается союзом neque, поэтому перевод сохраняет синтаксический переход и не дополняет отсутствующее продолжение.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизации. Пунктуация сохраняет связь с предшествующим контекстом и намеренно незавершённый переход к следующему стиху.
