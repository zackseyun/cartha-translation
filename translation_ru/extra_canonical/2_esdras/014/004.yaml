  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: ru
  text: И Я послал его, и он вывел Мой народ из Египта. Я возвёл его на гору Синай и держал его при Себе много дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misi eum
  choice: Я послал его
  rationale: Прямо передаёт латинское выражение, сохраняя местоименную связь с Моисеем из контекста.
- source_word: eduxit populum meum de Aegypto
  choice: он вывел Мой народ из Египта
  rationale: Естественная русская формулировка с сохранением принадлежности народа говорящему Богу.
- source_word: adduxi eum super montem Sina
  choice: Я возвёл его на гору Синай
  rationale: «Возвёл» передаёт направленное движение вверх и каузативный оттенок adduxi; название горы оформлено в привычной русской библейской форме.
- source_word: detinui eum apud me diebus multis
  choice: удерживал при Себе много дней
  rationale: Сохраняет более сильный оттенок detinui, чем нейтральное «оставил», а apud me естественно передано как «при Себе».
theological_decisions:
- issue: Смена действующего лица между исходом из Египта и восхождением на Синай
  choice: 'Сохранить: Моисей вывел народ, Бог возвёл Моисея'
  alternative: Сгладить смену субъектов или приписать оба действия одному субъекту
  rationale: Латинский текст явно различает eduxit («он вывел») и adduxi («Я возвёл»), поэтому богословски значимое взаимодействие Бога и Моисея не следует устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные буквы в «Я», «Мой», «Себе» обозначают речь Бога и поддерживают ясность местоименных отсылок.
