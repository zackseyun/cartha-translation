  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: ru
  text: Ибо ты будешь взят из среды людей и останешься с Моим Сыном и с подобными тебе, пока не завершатся времена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: будешь взят из среды людей
  rationale: Передаёт отделение Ездры от человеческого общества, сохраняя пассивную форму и не уточняя способ взятия.
- source_word: conuerteris residuum
  choice: останешься
  rationale: В данном контексте выражение указывает на пребывание в течение оставшегося времени; «останешься» естественно передаёт этот смысл без избыточного толкования.
- source_word: cum filio meo
  choice: с Моим Сыном
  rationale: Буквально передаёт латинское выражение; прописные буквы у местоимения и титула уместны как слова Бога о Сыне.
- source_word: cum similibus tuis
  choice: с подобными тебе
  rationale: Сохраняет намеренно неуточнённую группу лиц, сходных с Ездрой.
- source_word: usquequo finiantur tempora
  choice: пока не завершатся времена
  rationale: Передаёт временной предел и множественное число tempora, не сводя выражение к одному «концу времени».
theological_decisions:
- issue: Характер взятия Ездры
  choice: будешь взят из среды людей
  alternative: будешь восхищен от людей
  rationale: Выбранная формулировка сохраняет смысл удаления из человеческой среды, не навязывая специальной эсхатологической терминологии.
- issue: Кто такие «подобные тебе»
  choice: оставлено без пояснения
  alternative: праведники / вознесённые
  rationale: Источник не определяет эту группу; конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный. Синтаксис близок к источнику, но звучит естественно; неясности оригинала сохранены.
