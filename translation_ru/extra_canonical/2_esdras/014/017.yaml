lexical_decisions:
- source_word: super inhabitantes in eo mala
  choice: на живущих на ней бедствия
  rationale: Сохранён фрагментарный синтаксис начала стиха, продолжающий предыдущее предложение. Местоимение передано в женском роде по естественной русской соотнесённости с землёй.
- source_word: Prolongabit enim magis ueritas
  choice: Ибо истина ещё больше отдалится
  rationale: Латинское prolongabit употреблено непереходно в значении удаления; выбор соответствует противопоставлению приближающейся лжи и не сглаживает образ.
- source_word: adpropinquabit mendacium
  choice: ложь приблизится
  rationale: Буквально сохранены персонификация и пространственное противопоставление истины и лжи.
- source_word: festinat aquila uenire
  choice: орёл… уже спешит прийти
  rationale: Сохранены и значение неотложности festinat, и инфинитив движения uenire; конструкция естественна в возвышенном повествовательном регистре.
- source_word: quam uidisti in uisionem
  choice: которого ты видел в видении
  rationale: Передан очевидный смысл латинской конструкции; нестандартное in uisionem не воспроизводится как грамматическая шероховатость.
theological_decisions:
- issue: Образ орла
  choice: орёл
  alternative: римская держава / власть, представленная орлом
  rationale: Перевод сохраняет апокалиптический символ исходного текста и не подменяет его толкованием.
- issue: Отдаление истины и приближение лжи
  choice: сохранена пространственная персонификация
  alternative: истины станет меньше, а лжи — больше
  rationale: Исходный текст выражает богословское напряжение образно; поясняющий пересказ неоправданно сузил бы смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Начальная синтаксическая незавершённость намеренно сохранена, поскольку стих начинается продолжением предыдущего контекста.
