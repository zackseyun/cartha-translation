source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: apertum est os meum et non est clausum amplius. Altissimus autem dedit intellectum quinque uiris, et scripserunt quae dicebantur ex successione notis quas non sciebant, et sederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: ru
  text: И открылись мои уста и больше не закрывались. Всевышний же дал разумение пяти мужам, и они, сменяя друг друга[b], записывали то, что говорилось, знаками, которых не знали[a]. И просидели они там сорок дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «знаками, которых не знали» может подразумевать незнакомое письмо, скоропись или дарованную свыше форму записи; латинский текст этого не уточняет.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поочерёдно».'
    reason: previous_rendering
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: И открылись мои уста и больше не закрывались
  rationale: Передаёт латинскую образность буквально, но естественно для современного литературного русского языка.
- source_word: dedit intellectum
  choice: дал разумение
  rationale: Сохраняет смысл дарованной свыше способности понимать, не уточняя сверх текста характер этого дара.
- source_word: ex successione
  choice: сменяя друг друга
  rationale: Передаёт последовательную смену пяти писцов, а не упорядочение записываемого содержания.
- source_word: notis quas non sciebant
  choice: знаками, которых не знали
  rationale: Латинское notis допускает понимание как письменных знаков, особого письма или сокращений; общее слово «знаки» сохраняет эту неопределённость.
- source_word: et sederunt
  choice: И просидели они там сорок дней
  rationale: «Просидели» естественно передаёт длительность действия; слова о сорока днях сохранены согласно полной форме стиха в консультационном тексте, хотя предоставленный латинский отрывок обрывается после et sederunt.
theological_decisions:
- issue: Характер дарованного пяти мужам разумения
  choice: Не уточнять, было ли это понимание речи, способность писать или особое сверхъестественное знание
  alternative: «дал пяти мужам способность записывать»
  rationale: Intellectum само по себе обозначает разумение; конкретизация устранила бы сохранённую в источнике смысловую открытость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Мужи» и «разумение» поддерживают достоинство регистра, а синтаксис остаётся понятным обычному читателю.
