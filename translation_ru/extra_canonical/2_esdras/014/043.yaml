  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: ru
  text: В течение сорока дней они писали днём, а ночью ели хлеб. Я же днём говорил, а ночью не умолкал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся латинский текст здесь буквально обрывается словами «а ночью не…»; «умолкал» восстановлено по смыслу и текстовой традиции.
    reason: Отмечает неполноту представленного латинского чтения и делает контекстуальное восполнение прозрачным.
