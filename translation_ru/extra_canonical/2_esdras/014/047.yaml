lexical_decisions:
- source_word: tradas
  choice: чтобы ты передал
  rationale: Сослагательная форма зависит от ut в конце предыдущего стиха; перевод сохраняет синтаксическую связь через границу стихов.
- source_word: sapientibus de populo tuo
  choice: мудрым из твоего народа
  rationale: Прямо передаёт адресатов без добавления отсутствующего в источнике существительного.
- source_word: uena intellectus
  choice: жила разумения
  rationale: Латинское vena буквально означает «жила» и образует самостоятельную метафору рядом с «источником» и «рекой»; необычный образ сохранён, а не унифицирован.
- source_word: sapientiae fons
  choice: источник мудрости
  rationale: Естественное и точное соответствие латинскому fons.
- source_word: scientiae flumen
  choice: река знания
  rationale: Сохраняет нарастающий водный образ и единственное число абстрактного scientia.
theological_decisions:
- issue: Связь начала стиха с предыдущим предложением
  choice: Придаточная конструкция «чтобы ты передал»
  alternative: Самостоятельное повеление «передай» или разрешение «ты можешь передать»
  rationale: Форма tradas здесь синтаксически зависит от ut предыдущего стиха; самостоятельная конструкция скрыла бы эту связь.
- issue: Метафора vena intellectus
  choice: «жила разумения»
  alternative: «родник разумения»
  rationale: Буквальный образ vena отличается от последующего fons; его сохранение не стирает образную напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной образностью. Начальная строчная буква подчёркивает продолжение синтаксиса предыдущего стиха; заключительная кавычка отражает завершение прямой речи в данном месте.
