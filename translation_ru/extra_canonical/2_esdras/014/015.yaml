  verdict: approve
  source_fidelity: «Поспеши покинуть эти времена» точно передаёт повеление festina transmigrare a temporibus his, не устраняя присущую выражению эвфемистическую неопределённость. «Ибо то, что ты теперь увидел» соответствует ограниченному тексту данного стиха, Quae enim uidisti nunc, и верно сохраняет незавершённость, продолжающуюся в ст. 16. Добавления «бедствия» и «случились/произошли» в основной текст не внесены.
  naturalness: Формулировка литературна и уместна для современного библейского русского. «Эти времена» и «ибо» имеют сдержанно возвышенный, но не архаизирующий регистр. Точка с запятой хорошо обозначает тесную связь с последующей незавершённой частью.
  terminology: «Покинуть эти времена» удачно сохраняет образный характер transmigrare, не навязывая толкование о смерти. Сноска корректно объясняет, почему фраза синтаксически не завершена в пределах стиха, и не выдает слова следующего стиха за часть основного текста данного стиха.
