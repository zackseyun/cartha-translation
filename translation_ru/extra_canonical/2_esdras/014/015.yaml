  text: and hurry to depart from these times[a]; for the things you have now seen
translation:
  language: ru
  text: и поспеши покинуть эти времена; ибо то, что ты теперь увидел,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза завершается в следующем стихе. В переводах, иначе разделяющих текст на стихи, здесь может стоять: «ибо бедствия, которые ты теперь увидел…»'
    reason: Поясняет незавершённую синтаксическую конструкцию и расхождение, возникающее при переносе слова mala («бедствия») из 14:16 в 14:15.
lexical_decisions:
- source_word: festina
  choice: поспеши
  rationale: Точно передаёт повелительную форму и настоятельность латинского глагола.
- source_word: transmigrare a temporibus his
  choice: покинуть эти времена
  rationale: Естественно по-русски передаёт образ ухода из нынешней эпохи, не уточняя прямо, означает ли он смерть или иной переход.
- source_word: Quae enim uidisti nunc
  choice: ибо то, что ты теперь увидел
  rationale: Сохраняет незавершённость относительной конструкции на границе стихов и не переносит в этот стих слова из 14:16.
theological_decisions:
- issue: Смысл выражения transmigrare a temporibus his
  choice: покинуть эти времена
  alternative: переселиться из этих времён / уйти из жизни
  rationale: Выбранная формулировка сохраняет эвфемистическую и эсхатологическую многозначность латинского выражения, не сводя его однозначно к физической смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Точка с запятой сохраняет тесную связь частей, а запятая перед сноской подчёркивает, что предложение продолжается в 14:16.
