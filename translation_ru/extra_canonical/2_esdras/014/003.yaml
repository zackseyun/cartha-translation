  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: ru
  text: Я воистину явил Себя в терновнике и говорил с Моисеем, когда Мой народ был в рабстве в Египте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: Я воистину явил Себя
  rationale: Удвоенная конструкция, буквально «являясь, Я был явлен», вероятно, передаёт семитское усиление. «Воистину» сохраняет эмфатическую силу, не воспроизводя неестественную для русского языка форму.
- source_word: super rubum
  choice: в терновом кусте
  rationale: В контексте явления Моисею латинское super естественно передаётся как место явления — «в кусте»; rubus означает колючий, терновый куст.
- source_word: locutus sum Moysi
  choice: говорил с Моисеем
  rationale: Русское управление «говорить с кем» естественно передаёт обращённую к Моисею речь, выраженную латинским дательным Moysi.
- source_word: seruiebat in Aegypto
  choice: был в рабстве в Египте
  rationale: В контексте исхода servire обозначает не просто службу, а подневольное положение народа; «был в рабстве» ясно и естественно выражает этот смысл.
theological_decisions:
- issue: Эмфатическая сила Reuelans reuelatus sum
  choice: Я воистину явил Себя
  alternative: Я явил Себя
  rationale: Сохранено вероятное усиление, обусловленное необычным латинским удвоением, без попытки догматически уточнить характер явления.
- issue: Характер пребывания народа в Египте
  choice: Мой народ был в рабстве
  alternative: Мой народ служил
  rationale: Контекст Моисея и Египта указывает на подневольное служение; выбранная формулировка передаёт историко-богословский смысл без конфессионального расширения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Местоимения, относящиеся к говорящему Богу, написаны с прописной буквы. Усиление исходной конструкции сохранено словом «воистину».
