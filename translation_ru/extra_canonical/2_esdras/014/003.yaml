- from: Я воистину явил Себя в терновом кусте и говорил с Моисеем, когда Мой народ был в рабстве в Египте.
  to: Я воистину явил Себя в терновнике и говорил с Моисеем, когда Мой народ был в рабстве в Египте.
  rationale: Заменено только «в терновом кусте» на более естественное для современного литературного библейского русского «в терновнике». Эмфатическое «воистину» сохранено как осторожная передача удвоенной латинской конструкции; смысл рабского подчинения в Египте и обращение к Моисею сохранены.
