  text: поскольку Он — Судья, Он в своё время отнял у вас то, что даровал. И
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex cum sit
  choice: поскольку Он — Судья
  rationale: Передаёт причинное значение конструкции cum с сослагательным наклонением и сохраняет именное сказуемое без добавления отсутствующего в данном фрагменте определения «праведный».
- source_word: abstulit a uobis
  choice: Он ... отнял у вас
  rationale: Прямо передаёт значение abstulit и направление удаления a vobis; местоимение с прописной буквы указывает на Бога по контексту.
- source_word: in tempore
  choice: в своё время
  rationale: Естественное русское выражение, сохраняющее временной смысл латинской формулы без чрезмерного уточнения.
- source_word: quod donauerat
  choice: то, что даровал
  rationale: Сохраняет относительную конструкцию и значение donare — даровать; подразумеваемое дополнение «вам» уже ясно из «у вас».
- source_word: Et
  choice: И
  rationale: Сохраняет конечный союз, связывающий данный фрагмент со следующим стихом.
theological_decisions:
- issue: Характеристика Судьи
  choice: Не добавлять «праведный»
  alternative: «поскольку Он — праведный Судья»
  rationale: В предоставленном латинском тексте данного стиха стоит только iudex; хотя iustus может относиться к iudex по разбиению соседнего фрагмента, включение этого слова здесь не подтверждается непосредственно представленным текстом.
- issue: Референт подлежащего
  choice: Передать подразумеваемое подлежащее местоимением «Он» с прописной буквы
  alternative: «Судья ... отнял» либо местоимение со строчной буквы
  rationale: Русское предложение требует явного подлежащего при продолжении после придаточной конструкции; контекст указывает на Бога, а прописная буква соответствует достоинству библейского регистра, не изменяя содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис оставлен фрагментарно открытым в конце («И»), поскольку таков предоставленный латинский текст и связь продолжается в следующем стихе.
