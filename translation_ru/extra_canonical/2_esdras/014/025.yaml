  text: hos quia parati sunt ad scribendum uelociter ; Et uenies hic, et ego accendam in corde tuo lucernam intellectus, quae non extinguetur quoadusque finiantur quae incipies scribere. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/025.yaml
  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: ru
  text: этих пятерых, потому что они готовы писать быстро. И ты придёшь сюда, а Я зажгу в твоём сердце светильник разумения, который не угаснет, пока не будет завершено то, что ты начнёшь писать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hos
  choice: этих пятерых
  rationale: Латинское указательное местоимение стоит во множественном числе; число «пять» восстанавливается из непосредственного контекста и явно отражено в проверочном английском слое.
- source_word: parati sunt ad scribendum uelociter
  choice: они готовы писать быстро
  rationale: Прямо передаёт готовность писцов и наречие uelociter без излишней стилизации.
- source_word: accendam
  choice: зажгу
  rationale: Сохраняет конкретный образ зажигания светильника.
- source_word: lucernam intellectus
  choice: светильник разумения
  rationale: «Светильник» соответствует lucerna и сохраняет библейскую образность; «разумение» передаёт intellectus как способность понимать.
- source_word: quae non extinguetur
  choice: который не угаснет
  rationale: Естественная русская передача пассивной формы с сохранением образа непрерывно горящего светильника.
- source_word: quoadusque finiantur quae incipies scribere
  choice: пока не будет завершено то, что ты начнёшь писать
  rationale: Сохраняет неопределённость среднего множественного quae через собирательное «то» и не уточняет, идёт ли речь о книгах, словах или иных записываемых текстах.
theological_decisions:
- issue: Источник разумения
  choice: Я зажгу в твоём сердце светильник разумения
  alternative: Я просвещу твой разум
  rationale: Сохранена исходная метафора божественно зажжённого светильника в сердце, без сведения её к абстрактному интеллектуальному озарению.
- issue: Продолжительность дара
  choice: не угаснет, пока не будет завершено то, что ты начнёшь писать
  alternative: будет гореть, пока ты не закончишь писать
  rationale: Сохранена пассивная форма finiantur и не внесено дополнительное утверждение, что завершение зависит исключительно от самого Ездры.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Метафора «светильник разумения» сохранена как ясная и богословски ненагруженная; прописная «Я» обозначает речь Бога согласно русской библейской типографической традиции.
