lexical_decisions:
- source_word: Superant
  choice: остаются
  rationale: Передаёт значение «оставаться, ещё быть в наличии» в контексте оставшегося времени века.
- source_word: eius
  choice: его
  rationale: Сохраняет явное местоимение латинского текста, относящее две части к упомянутому ранее веку.
- source_word: post medium decimae partis
  choice: после середины десятой части
  rationale: Формально и без истолковательного сглаживания воспроизводит необычное временно-долевое выражение источника.
theological_decisions:
- issue: Соотношение прошедшей и оставшейся частей века
  choice: Сохранено буквальное указание на две его части после середины десятой части.
  alternative: Но остаются две части.
  rationale: Полная формулировка сохраняет местоимение eius и загадочную схему деления века, не разрешая её посредством привнесённого толкования.
translation_notes:
  register: Современный литературный русский язык; фраза намеренно сохраняет необычную и несколько загадочную структуру латинского источника.
