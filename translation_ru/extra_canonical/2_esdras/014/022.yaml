  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
translation:
  language: ru
  text: или то, что должно произойти. Ведь если я обрёл благоволение перед Тобой, ниспошли мне Святого Духа, и я запишу всё, что произошло в мире с самого начала, — то, что было записано в Твоём Законе, — чтобы люди могли найти путь и чтобы те, кто пожелает
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae incipient operari
  choice: то, что должно произойти
  rationale: В данном контексте перифрастическое выражение указывает на будущие события; естественное русское «должно произойти» сохраняет предстоящий характер без неуклюжего буквального «начнёт действовать».
- source_word: Si enim
  choice: Ведь если
  rationale: Enim вводит обоснование и не имеет противительного значения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: inueni gratiam coram te
  choice: я обрёл благоволение перед Тобой
  rationale: Устойчивая библейская формула передана в современном литературном регистре с сохранением образа нахождения благоволения перед Богом.
- source_word: inmitte in me spiritum sanctum
  choice: пошли в меня Святого Духа
  rationale: «В меня» сохраняет необычное, но значимое направление латинского in me, не подменяя его более привычным «на меня».
- source_word: in saeculo ab initio
  choice: в мире от начала
  rationale: При уточнении ab initio saeculum обозначает мир и ход его истории от начала творения, а не преимущественно эсхатологический век.
- source_word: quae erant in lege tua scripta
  choice: то, что было записано в Твоём Законе
  rationale: Сохраняется относительная конструкция и отсылка к содержанию Закона; прописная буква указывает на конкретный Божий Закон в данном контексте.
- source_word: semitam
  choice: путь
  rationale: «Путь» естественнее для современного русского и сохраняет метафорическое значение semita без неоправданного сужения до буквальной тропы.
theological_decisions:
- issue: Обозначение spiritum sanctum
  choice: Святого Духа
  alternative: святого духа
  rationale: Контекст прямого обращения к Богу и просьбы о ниспослании Духа для богодухновенного восстановления Писания поддерживает личностно-титульное написание; перевод не добавляет иных догматических уточнений.
- issue: Направление ниспослания Духа
  choice: в меня
  alternative: на меня
  rationale: Сохранено буквальное и богословски потенциально значимое in me; более привычное «на меня» устранило бы различие, присутствующее в источнике.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Фрагментарное начало и незавершённый конец сохранены, поскольку стих является частью продолжающегося предложения. Местоимения обращения к Богу оформлены с прописной буквы в соответствии с русской религиозной издательской традицией.
