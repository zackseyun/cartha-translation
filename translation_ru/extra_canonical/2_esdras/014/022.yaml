  source_fidelity: 'Начальное «или то, что должно произойти» адекватно передаёт незавершённое продолжение и будущее значение quae incipient operari. «Ведь если» верно отражает пояснительное si enim. Однако «пошли в меня Святого Духа» является слишком буквальной и ненормативной для современного русского калькой inmitte in me: она может быть понята как физическое направление движения. «Ниспошли мне Святого Духа» естественно передаёт просьбу о даровании Духа, не добавляя богословского содержания. «В мире с самого начала» точнее и естественнее передаёт in saeculo ab initio, чем «в мире от начала».'
