  yaml_path: translation/extra_canonical/2_esdras/014/030.yaml
  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: ru
  text: И вы вслед за ними согрешили. И вам была дана земля на земле Сиона, но и вы, и ваши отцы творили беззаконие и не соблюдали путей, которые предписал вам Всевышний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: transgressi estis
  choice: преступили закон
  rationale: Глагол transgredior означает «преступить, нарушить»; дополнение «закон» естественно передаёт подразумеваемый предмет нарушения в данном контексте.
- source_word: post eos
  choice: вслед за ними
  rationale: 'Сохраняет как временную, так и подражательную связь: адресаты пошли путём предшественников.'
- source_word: terra
  choice: земля
  rationale: Прямое и контекстуально уместное соответствие, не добавляющее отсутствующего в источнике понятия наследства.
- source_word: iniquitatem fecerunt
  choice: творили беззаконие
  rationale: Устойчивое, понятное и стилистически достойное выражение, сохраняющее нравственно-богословскую окраску.
- source_word: Altissimus
  choice: Всевышний
  rationale: Традиционное и точное русское обозначение Бога, соответствующее латинскому превосходному титулу.
theological_decisions:
- issue: Совместная вина нынешнего поколения и предков
  choice: но и вы, и ваши отцы
  alternative: но вы и ваши отцы
  rationale: Повтор союза перед обеими группами передаёт усиленную соотносительную конструкцию et uos et patres uestri и подчёркивает общую межпоколенческую ответственность.
- issue: Предмет нарушения в transgressi estis
  choice: преступили закон
  alternative: совершили преступление
  rationale: Контекст последующего несоблюдения заповеданных путей поддерживает значение нарушения Божьего установления; формулировка не вводит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис намеренно сохраняет повтор «земля в земле Сиона», поскольку предоставленный латинский текст содержит terra in, а консультационный английский слой свидетельствует о продолжении «the land of Zion»; добавление «в наследие» исключено как не подтверждённое источником.
