revisions:
- from: И вы вслед за ними преступили закон. И дана была вам земля в земле Сиона, но и вы, и ваши отцы творили беззаконие и не соблюдали путей, которые заповедал вам Всевышний.
  to: И вы вслед за ними согрешили. И вам была дана земля на земле Сиона, но и вы, и ваши отцы творили беззаконие и не соблюдали путей, которые предписал вам Всевышний.
  rationale: Исправления устраняют добавленный объект при transgressi estis, делают пространственный оборот естественным по-русски и уточняют передачу praecepit без изменения содержания. Маркер английской сноски не имеет соответствующего места в русском тексте и не отражает вариант чтения, требующий русской сноски.
