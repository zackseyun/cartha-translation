  text: And I told him many wonders, and I showed him the secrets of the times and the end of the times, and I commanded him, saying,
translation:
  language: ru
  text: 'И Я поведал ему о многих чудесах, открыл ему тайны времён и конец времён и повелел ему, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enarraui
  choice: поведал
  rationale: Передаёт значение подробного изложения или рассказа и сохраняет возвышенный, но понятный регистр.
- source_word: mirabilia multa
  choice: многие чудеса
  rationale: Буквально и естественно передаёт латинское выражение; «чудеса» здесь означает дивные, сверхъестественные деяния или явления.
- source_word: temporum secreta
  choice: тайны времён
  rationale: Сохраняет образность и множественное число исходного текста, не уточняя без основания содержание этих тайн.
- source_word: temporum finem
  choice: конец времён
  rationale: Сохраняет эсхатологическую формулировку оригинала и её связь с предшествующим выражением.
- source_word: praecepi
  choice: повелел
  rationale: Точно отражает властное распоряжение, выраженное латинским глаголом.
- source_word: dicens
  choice: говоря
  rationale: Сохраняет характерную для библейского повествования вводную формулу перед прямой речью.
theological_decisions:
- issue: Смысл выражения temporum finem
  choice: конец времён
  alternative: предел времён
  rationale: Выбрана естественная по-русски эсхатологическая формула, при этом текст не конкретизирует природу или последовательность событий конца.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм латинского оригинала сохранён; прописное «Я» указывает на речь Бога в непосредственном контексте.
