source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc uos hic estis, et fratres uestri introrsum uestrum sunt. Si ergo imperaueritis sensui uestro et erudieritis cor uestrum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: ru
  text: Теперь вы здесь, и ваши братья — внутри вас.[a] Итак, если вы подчините себе свой разум и воспитаете своё сердце,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутри вас». Необычное латинское выражение может также пониматься пространственно: «в глубине, по ту сторону от вас».'
    reason: Сохраняет буквальную формулировку источника и отмечает возможное пространственное понимание без выбора спорного толкования в основном тексте.
lexical_decisions:
- source_word: nunc uos hic estis
  choice: Теперь вы здесь
  rationale: Прямо и естественно передаёт временное nunc и указание места hic.
- source_word: fratres uestri
  choice: ваши братья
  rationale: Сохраняет буквальное родственное обозначение без уточнения, идёт ли речь о соплеменниках или иных членах народа.
- source_word: introrsum uestrum sunt
  choice: среди вас
  rationale: Латинское выражение необычно и буквально указывает на нахождение «внутри вас»; «среди вас» передаёт вероятный пространственно-общественный смысл, а буквальность отмечена в сноске.
- source_word: imperaueritis sensui uestro
  choice: будете повелевать своим разумом
  rationale: Сохраняет сильное значение imperare — «повелевать, держать под властью» — и передаёт sensus как внутреннюю способность разумения.
- source_word: erudieritis cor uestrum
  choice: наставлять своё сердце
  rationale: Передаёт erudire как обучение и воспитание, сохраняя библейское понимание сердца как центра внутренней жизни.
theological_decisions:
- issue: Отношение разума и сердца к воле человека
  choice: «повелевать своим разумом и наставлять своё сердце»
  alternative: «владеть своими помыслами и вразумлять своё сердце»
  rationale: Выбранный вариант не ослабляет повелительный смысл imperare и не сводит sensus только к помыслам; условная конструкция остаётся незавершённой, как и в исходном стихе.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Сохранена незавершённость условного предложения: его следствие относится к следующему стиху.'
