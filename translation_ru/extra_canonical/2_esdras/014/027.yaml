  text: 'the people and said, “Hear these words, O Israel: Sojourners, sojourners—”'
translation:
  language: ru
  text: 'народ и сказал: «Слушай, Израиль, эти слова: странники, странни—»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинский текст здесь обрывается на незавершённом слове: pere-.'
    reason: Предупреждает читателя, что резкий обрыв принадлежит сохранившемуся источнику, а не является смысловым истолкованием перевода.
lexical_decisions:
- source_word: Audi, Israel
  choice: Слушай, Израиль
  rationale: Сохранена прямая библейская формула обращения и повелительное наклонение единственного числа.
- source_word: Peregrinantes
  choice: странники
  rationale: Латинское причастие употреблено субстантивированно; «странники» естественно передаёт людей, живущих не на постоянной родине, не уточняя причины их пребывания.
- source_word: pere-
  choice: странни—
  rationale: Незавершённый фрагмент передан незавершённым русским словом, без попытки восстановить отсутствующий текст.
