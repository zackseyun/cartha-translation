source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: ru
  text: Но кто наставит тех, кто родится позднее? Ведь век пребывает во тьме[a], и живущие в нём лишены света.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помещён во тьму».'
    reason: Сохраняет более буквальную возможность передачи латинского positum est, тогда как основной текст отражает его вероятное статическое значение.
lexical_decisions:
- source_word: autem iterum nati fuerint
  choice: тех, кто родится после
  rationale: По контексту оборот относится к людям, которые родятся позднее; «после» естественно передаёт временную последовательность, не создавая оттенка повторного рождения.
- source_word: quis commonebit?
  choice: кто предостережёт?
  rationale: Латинское commonebit может означать «напомнит», «увещает» или «предостережёт»; в вопросе о будущих поколениях «предостережёт» ясно передаёт мысль о наставлении перед лицом опасности.
- source_word: saeculum
  choice: век
  rationale: «Век» сохраняет широкий смысл saeculum — нынешняя эпоха или мировой порядок — и не сужает его до физического мира.
- source_word: positum est ... in tenebris
  choice: пребывает во тьме
  rationale: 'Сочетание positum est с обстоятельством состояния имеет статическое значение: век находится, пребывает во тьме. Такой перевод не добавляет мысли о том, кто поместил его туда.'
- source_word: sine lumine
  choice: лишены света
  rationale: Естественная и достойная русская передача состояния «без света», сохраняющая образный смысл.
theological_decisions:
- issue: Является ли тьма результатом чьего-либо намеренного действия
  choice: пребывает во тьме
  alternative: помещён во тьму
  rationale: Латинская конструкция допускает буквальное пассивное прочтение, но здесь естественно выражает состояние. Основной текст не приписывает действие Богу или иной силе.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. «Век» сохраняет традиционную богословскую ёмкость, а синтаксис остаётся понятным современному читателю.
