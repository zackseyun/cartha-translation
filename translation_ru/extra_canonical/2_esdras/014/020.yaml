  source_fidelity: 'Основной смысл передан верно: будущие поколения, пребывание века во тьме и отсутствие света у его обитателей сохранены. Однако «предостережёт» несколько сужает commonebit до предупреждения об опасности; латинский глагол шире и в данном контексте естественнее передать как «наставит» (возможны также «увещевает/напомнит» в иных контекстах).'
