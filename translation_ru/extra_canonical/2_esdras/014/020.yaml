revisions:
- from: Но кто предостережёт тех, кто родится после? Ведь век пребывает во тьме[a], и живущие в нём лишены света.
  to: Но кто наставит тех, кто родится позднее? Ведь век пребывает во тьме[a], и живущие в нём лишены света.
  rationale: Заменено только «предостережёт» на «наставит», чтобы точнее передать семантический диапазон commonebit и не добавлять оттенок особого предупреждения. Передача positum est как состояния («пребывает во тьме») соответствует латинскому контексту и английскому аудиту, где предпочтено stative «lies», а сноска сохраняет буквальную пассивную альтернативу.
