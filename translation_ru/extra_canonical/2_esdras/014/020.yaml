  terminology: «Век» удачно передаёт saeculum как эпоху/мировой порядок, не сводя его к календарному столетию или физическому миру. «Лишены света» точно передаёт sine lumine. Сноска корректно отмечает более буквальное пассивное прочтение positum est, не навязывая действующего субъекта.
