lexical_decisions:
- source_word: diebus XL
  choice: сорок дней
  rationale: Сохранён фрагментарный синтаксис исходного стиха, продолжающего предыдущее высказывание; римская цифра передана словами.
- source_word: buxos multos
  choice: много дощечек для письма
  rationale: Латинское buxos буквально указывает на дощечки из самшита; функциональное обозначение ясно современному читателю, а материал отмечен в сноске.
- source_word: accThis should be accipe tecum
  choice: возьми с собой
  rationale: Естественная русская передача латинского повеления accipe tecum.
- source_word: quinque
  choice: пятерых
  rationale: Слово согласовано с перечисленными пятью мужчинами и сохранено как итоговое уточнение числа.
- source_word: Saream, Dabriam, Selemiam, Ethanum et Asihel
  choice: Сарею, Даврию, Селемию, Этана и Асиэла
  rationale: Имена транслитерированы непосредственно с латинских форм с русским падежным оформлением.
