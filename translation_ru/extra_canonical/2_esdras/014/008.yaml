  yaml_path: translation/extra_canonical/2_esdras/014/008.yaml
  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
translation:
  language: ru
  text: Знамения, которые Я показал, и сны, которые ты видел, и истолкования, которые ты слышал, — сохрани всё это в своём сердце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  choice: знамения
  rationale: Передаёт религиозно-визионерский смысл латинского signa и соответствует современному литературному русскому.
- source_word: demonstraui
  choice: Я показал тебе
  rationale: Латинское demonstraui означает «показал, явил»; «тебе» естественно выражает адресата, подразумеваемого контекстом и отражённого в консультационном английском тексте.
- source_word: somnia
  choice: сны
  rationale: Прямое и естественное соответствие латинскому слову в контексте видений.
- source_word: interpretationes
  choice: истолкования
  rationale: Сохраняет смысл данных Ездре объяснений увиденного, не уточняя их источник сверх текста.
- source_word: in corde tuo repone ea
  choice: сохрани всё это в своём сердце
  rationale: Сохраняет образ сердца как места внутреннего хранения и передаёт возобновляющее местоимение ea посредством «всё это».
theological_decisions:
- issue: Риторическое вынесение трёх дополнений перед повелением
  choice: Сохранить исходный порядок с итоговым «сохрани всё это»
  alternative: 'Нормализовать: «Сохрани в своём сердце знамения…»'
  rationale: Латинский текст сначала перечисляет знамения, сны и истолкования, а затем возобновляет их местоимением ea. Русская конструкция естественно сохраняет это смысловое и риторическое выделение.
- issue: Прописная буква в местоимении «Я»
  choice: «Я» с прописной буквы
  alternative: «я» со строчной буквы
  rationale: Говорящий в непосредственном контексте — Бог; прописная буква соответствует принятому русскому библейскому регистру, не меняя содержания высказывания.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Повтор союза «и» сохранён ради трёхчастного накопления исходного текста; тире отмечает переход от вынесенного перечисления к повелению. Сноска не требуется, поскольку основной текст непосредственно сохраняет отмеченную в английском слое исходную конструкцию.
