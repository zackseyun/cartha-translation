  yaml_path: translation/extra_canonical/2_esdras/014/031.yaml
  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: ru
  text: удел в земле Сиона[a]; вы и ваши отцы совершили беззаконие и не соблюли путей, которые предписал вам Всевышний; Праведный[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих в представленном латинском тексте начинается в середине предложения; слова «удел в земле Сиона» синтаксически связаны с предшествующим контекстом.
    reason: Предупреждает читателя о фрагментарном начале и не создаёт искусственно завершённого предложения.
  - marker: b
    text: Латинский текст здесь обрывается на слове Iustus — «Праведный»; продолжение определяет его синтаксическую роль.
    reason: Сохраняет незавершённость источника и не приписывает титулу неподтверждённую связь.
lexical_decisions:
- source_word: sortem
  choice: удел
  rationale: В контексте земли Сиона латинское sors обозначает доставшуюся долю или наследственное владение; «удел» естественно передаёт этот смысл и сохраняет библейскую окраску.
- source_word: iniquitatem fecistis
  choice: творили беззаконие
  rationale: Формально близкая и идиоматичная библейская формулировка, передающая совершение неправды без излишнего уточнения её характера.
- source_word: non seruastis uias
  choice: не хранили путей
  rationale: Сохраняет метафору путей и значение соблюдения, а не заменяет её истолкованием вроде «не исполняли закон».
- source_word: Altissimus
  choice: Всевышний
  rationale: Устоявшееся и точное русское соответствие латинскому титулу Бога.
- source_word: Iustus
  choice: Праведный
  rationale: Субстантивированный титул передан буквально; его синтаксическая связь не определена из-за обрыва предоставленного текста.
theological_decisions:
- issue: К кому относится титул Iustus
  choice: Сохранить самостоятельное «Праведный…» без добавления связки или пояснения
  alternative: «Праведный [Бог]» либо присоединение титула к предыдущему предложению
  rationale: Латинский фрагмент заканчивается словом Iustus, и продолжение отсутствует. Уточнение референта или синтаксической функции преждевременно разрешило бы подлинную текстовую неопределённость.
- issue: Значение sortem в связи с Сионом
  choice: «удел»
  alternative: «наследие»
  rationale: «Удел» непосредственно обозначает долю земли и не усиливает богословское понятие наследования сверх того, что выражает латинское sors.
translation_notes:
  register: Современный литературный русский с умеренной библейской торжественностью. Сохранены метафора «пути», титул «Всевышний» и фрагментарность обеих границ предоставленного латинского отрывка.
