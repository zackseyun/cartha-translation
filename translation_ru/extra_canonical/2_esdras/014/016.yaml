  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: ru
  text: —снова произойдут бедствия, ещё худшие, чем эти. Ведь чем больше век слабеет от старости, тем больше умножатся бедствия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deteriora
  choice: бедствия ещё хуже
  rationale: 'Субстантивированное сравнительное прилагательное передано с учётом контекста mala: речь идёт о ещё худших бедствиях.'
- source_word: facientur
  choice: произойдут
  rationale: 'Будущая пассивная форма здесь естественно выражает событие: «случатся, произойдут», а не активное причинение.'
- source_word: saeculum
  choice: век
  rationale: Сохраняет апокалиптическое обозначение нынешней мировой эпохи и образ её старения.
- source_word: inualidum
  choice: немощнее
  rationale: Передаёт ослабление века в старости и поддерживает сравнительную конструкцию quantum… tantum.
- source_word: multiplicabunt
  choice: умножатся
  rationale: По смыслу подразумеваются mala («бедствия»); русская возвратная форма естественно передаёт их возрастание.
theological_decisions:
- issue: Субъект и залог facientur
  choice: «бедствия ещё хуже этих… произойдут»
  alternative: «эти бедствия вызовут ещё худшие»
  rationale: Латинское deteriora является субъектом будущего пассива facientur; текст утверждает наступление худших событий, не называя нынешние бедствия их непосредственной причиной.
- issue: Образ стареющего saeculum
  choice: сохранён как «век… от старости»
  alternative: обобщённое «мир со временем слабеет»
  rationale: Буквальный апокалиптический образ важен и не должен быть рационализирован или богословски переистолкован.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Начальное тире сохраняет синтаксическую связь с предыдущим стихом; повтор «бедствия» проясняет подразумеваемое mala без изменения смысла.
