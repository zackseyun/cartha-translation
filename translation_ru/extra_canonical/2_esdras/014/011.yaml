  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: ru
  text: Ибо век разделён на двенадцать частей, и уже прошли десять его частей и половина десятой части.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде древних переводов: «девять его частей уже прошли и половина десятой части». Это чтение согласуется со следующим стихом, где остаются две с половиной части; латинский текст здесь читает «десять».'
    reason: 'Текстологически значимое разночтение: латинское X создаёт арифметическую трудность, тогда как древние версии сохраняют IX.'
lexical_decisions:
- source_word: saeculum
  choice: век
  rationale: Передаёт эпоху или мировой век в эсхатологическом контексте, не сужая значение до простого отрезка времени.
- source_word: XII partibus diuisum est
  choice: разделён на двенадцать частей
  rationale: Прямо и естественно передаёт латинскую конструкцию.
- source_word: transierunt
  choice: прошли
  rationale: Обычное русское выражение о миновавших частях временного периода.
- source_word: X iam et dimidium xmae partis
  choice: десять его частей уже прошли, а также половина десятой части
  rationale: Основной текст следует представленному латинскому чтению X и сохраняет его внутреннюю напряжённость; разночтение, поддержанное древними версиями и контекстом следующего стиха, отмечено в сноске.
theological_decisions:
- issue: Число уже прошедших частей
  choice: десять
  alternative: девять
  rationale: Издание в предоставленном латинском источнике читает X («десять»). Хотя «девять» лучше согласуется с половиной десятой части и с 14:12 и поддерживается рядом древних переводов, молча исправлять данный исходный текст не следует.
translation_notes:
  register: Современный литературный русский язык; тон краткий и возвышенный. Сохранено формальное деление века на части и не устранена текстологическая трудность без сноски.
