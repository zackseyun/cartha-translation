  text: Ведь Твой Закон сожжён, и потому никто не знает того, что совершено Тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lex tua
  choice: Твой Закон
  rationale: «Закон» естественно передаёт латинское lex в библейском контексте; прописная буква указывает на данный Богом Закон, не добавляя конфессиональной трактовки.
- source_word: incensa est
  choice: сожжён
  rationale: Точно передаёт страдательную форму совершённого вида и конкретный образ уничтожения огнём.
- source_word: quae a te
  choice: того, что совершено Тобой
  rationale: Латинский фрагмент эллиптичен; согласно контексту и консультационному английскому слою подразумеваются совершённые Богом дела. Формулировка сохраняет обобщённость quae.
theological_decisions:
- issue: Что именно неизвестно людям после сожжения Закона
  choice: того, что совершено Тобой
  alternative: Твоих дел
  rationale: Развёрнутая конструкция ближе к латинскому quae a te и не сужает смысл до какой-либо отдельной категории Божьих деяний.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранена причинная связь quoniam… propter quod через «ведь… и потому». Местоимение, обращённое к Богу, написано с прописной буквы согласно принятой русской библейской традиции.
