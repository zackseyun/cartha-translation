  source_fidelity: '«Твой Закон сожжён» точно передаёт Quoniam lex tua incensa est. «И потому никто не знает того, что совершено Тобой» адекватно воспроизводит propter quod nemo scit quae a te, включая сохранённую в представленном латинском фрагменте незавершённость/эллиптичность. Формулировка также согласуется с английским контрольным текстом: «the things done by you».'
  naturalness: Текст звучит естественно и литературно по-русски. Причинно-следственная связка «Ведь… и потому…» ясна; «сожжён» уместно передаёт образ текста. Оборот «то, что совершено Тобой» несколько торжественен, но соответствует библейскому регистру и не является неестественным.
  terminology: «Закон» — обычный и точный библейский эквивалент lex. Прописные буквы в «Твой», «Тобой» последовательно оформляют обращение к Богу и не меняют смысла. Никаких терминологических или богословских добавлений нет.
