  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: ru
  text: 'И вот, до меня из куста донёсся голос и сказал: «Ездра, Ездра!» Я ответил: «Вот я, Господи». Я встал на ноги, и голос сказал мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: И вот
  rationale: Сохраняет вводный указательный оборот и повествовательную выразительность латинского текста, оставаясь естественным в современном русском.
- source_word: uox exiuit contra me de rubo
  choice: из куста раздался обращённый ко мне голос
  rationale: Передаёт происхождение голоса из куста и направленность к Ездре; русское «раздался» естественно сочетается с «голос», а «обращённый ко мне» отражает contra me без неуместного значения противостояния.
- source_word: ecce ego
  choice: Вот я
  rationale: Устойчивый и точный русский ответ на призыв, соответствующий библейскому контексту.
- source_word: domine
  choice: Господи
  rationale: Звательная форма естественно передаёт прямое обращение к Господу и сохраняет богословскую открытость латинского текста.
- source_word: surrexi super pedes meos
  choice: Я встал на ноги
  rationale: Прямо и естественно передаёт телесное действие исходного текста.
- source_word: dixit ad me
  choice: голос сказал мне
  rationale: Повтор существительного вместо безличного «он» устраняет в русском неясность референта, не добавляя нового участника.
theological_decisions:
- issue: Кем является говорящий голос
  choice: Сохранить обозначение «голос», не называя говорящего прямо Богом или ангелом
  alternative: «Господь сказал мне»
  rationale: Латинский стих называет только голос; обращение «Господи» не требует вставлять явное отождествление в авторскую речь.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Двоеточие в конце сохранено, поскольку стих вводит последующую прямую речь.
