  text: uiui conseruati eritis et post mortem misericordiam consequemini; Iudicium enim post mortem ueniet quando iterum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/034.yaml
  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
translation:
  language: ru
  text: вы будете сохранены в живых и после смерти обретёте милость. Ибо после смерти наступит суд, когда вновь…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих заканчивается на словах «когда вновь…»; предложение продолжается в следующем стихе.
    reason: Предупреждает читателя, что необычная незавершённость обусловлена делением исходного текста на стихи, а не пропуском в переводе.
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: вы будете сохранены в живых
  rationale: Передаёт второе лицо множественного числа, будущее время и идею сохранения жизни, не подменяя пассивную конструкцию простым «вы будете жить».
- source_word: misericordiam consequemini
  choice: обретёте милость
  rationale: Естественно передаёт достижение или получение милости; слово «милость» сохраняет богословскую ёмкость misericordia.
- source_word: Iudicium enim post mortem ueniet
  choice: Ибо после смерти наступит суд
  rationale: Сохраняет причинную связь enim и прямое утверждение о суде после смерти; порядок слов выбран ради естественного русского синтаксиса.
- source_word: quando iterum
  choice: когда вновь…
  rationale: Источник данного стиха обрывается на наречии iterum; перевод не переносит сюда глагол reuiuiscemus из следующего исходного фрагмента и сохраняет незавершённость фразы.
theological_decisions:
- issue: Смысл незавершённого выражения quando iterum
  choice: Сохранить «когда вновь…» без добавления подразумеваемого действия
  alternative: «когда мы вновь оживём»
  rationale: Глагол reuiuiscemus находится в исходном фрагменте следующего стиха. Его добавление здесь устранило бы формальную границу предоставленного источника и преждевременно уточнило бы смысл.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Формы «обретёте милость» и «наступит суд» понятны широкому читателю и не привносят конфессионального толкования. Многоточие отмечает реальный синтаксический обрыв предоставленного латинского фрагмента.
