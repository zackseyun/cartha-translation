  yaml_path: translation/extra_canonical/2_esdras/014/029.yaml
  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: ru
  text: И они приняли закон жизни, но не соблюли его; после них и вы преступили его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem uitae
  choice: закон жизни
  rationale: Прямо передаёт латинское сочетание, сохраняя его богословскую ёмкость без пояснительного истолкования.
- source_word: non custodierunt
  choice: не соблюли его
  rationale: Custodire применительно к закону естественно означает «соблюдать»; местоимение устраняет тяжеловесное повторение относительной конструкции в русском.
- source_word: transgressed
  choice: преступили его
  rationale: По проверенному английскому слою восстановлено продолжение оборванного в предоставленном латинском фрагменте; «преступить закон» — точное и литературное русское соответствие.
- source_word: after them
  choice: после них
  rationale: Сохранена временная и преемственная связь без уточнения, кого именно обозначает местоимение.
theological_decisions:
- issue: Значение выражения «закон жизни»
  choice: 'Сохранить буквально: «закон жизни»'
  alternative: «животворящий закон» или «закон, ведущий к жизни»
  rationale: Латинский родительный падеж допускает смысловую ёмкость; развёрнутые варианты преждевременно определили бы точное отношение закона к жизни.
- issue: Связь двух нарушений закона
  choice: «но не соблюли его; после них и вы преступили его»
  alternative: Две последовательные относительные конструкции
  rationale: Русская синтаксическая форма ясно сохраняет сопоставление прежнего поколения с адресатами, не меняя содержания.
translation_notes:
  register: Современный литературный русский; достоинство библейского регистра сохранено без архаизмов. Предоставленный латинский текст обрывается на втором quem, поэтому окончание передано с опорой на аудированный английский консультационный слой.
