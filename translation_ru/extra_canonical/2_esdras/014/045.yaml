  text: And it happened when the forty days were completed[a], the Most High spoke to me, saying, “The former things that you wrote, set them out publicly, and
translation:
  language: ru
  text: 'И когда исполнилось сорок дней, Всевышний обратился ко мне и сказал: «То, что ты написал прежде, обнародуй, и'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conpleti essent XL dies
  choice: исполнилось сорок дней
  rationale: Естественная для современного литературного русского передача завершения указанного срока с сохранением традиционной библейской торжественности.
- source_word: altissimus
  choice: Всевышний
  rationale: Устоявшийся и точный титул Бога в русской библейской речи.
- source_word: priora quae scripsisti
  choice: то, что ты написал прежде
  rationale: Priorа здесь обозначает написанное ранее; такая формулировка сохраняет временное значение и не создаёт лишнего впечатления о «первых» произведениях как отдельной категории.
- source_word: in palam pone
  choice: обнародуй
  rationale: Кратко и естественно передаёт требование сделать написанное открытым и доступным всем.
- source_word: et
  choice: и
  rationale: Союз сохранён в конце стиха, поскольку латинская граница источника обрывает предложение перед продолжением в следующем стихе.
