translation:
  language: ru
  text: 'И вот[a], голос позвал меня: «Ездра, открой рот и выпей то, что я даю тебе пить». Я открыл рот — и вот, полная чаша…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежней разбивке стихов: «На следующий день случилось так: и вот, голос позвал меня: „Ездра, открой рот и выпей то, что я даю тебе пить“. Я открыл рот — и вот, мне была протянута полная чаша». Начальные и заключительные слова этой версии относятся соответственно к соседним стихам.'
    reason: previous_rendering
lexical_decisions:
- source_word: et ecce
  choice: И вот
  rationale: Передаёт латинский повествовательный оборот с оттенком внезапности и привлечения внимания, сохраняя его повтор во второй фразе.
- source_word: uox uocauit me
  choice: голос позвал меня
  rationale: Прямое и естественное соответствие; источник не уточняет, кому принадлежит голос.
- source_word: bibe quod te potiono
  choice: выпей то, что Я даю тебе
  rationale: Естественно передаёт каузативный смысл редкого potiono («даю пить», «пою»), не вводя отсутствующего в данном фрагменте названия напитка.
- source_word: calix plenus
  choice: полная чаша
  rationale: Сохраняет незавершённую именную конструкцию на границе стиха; «чаша» соответствует dignified biblical register и семантике calix.
theological_decisions:
- issue: Принадлежность голоса и подразумеваемый субъект глагола potiono
  choice: Субъект не назван; местоимение «Я» лишь грамматически обозначает говорящего
  alternative: «выпей то, что Бог даёт тебе»
  rationale: Латинский текст говорит только о «голосе» и не называет говорящего Богом; явное уточнение неоправданно снимало бы неопределённость.
- issue: Незавершённость последней фразы
  choice: 'Сохранить обрыв: «полная чаша…»'
  alternative: «мне была протянута полная чаша»
  rationale: Глагол и дополнение находятся в следующем стихе по данной разбивке; их нельзя переносить в этот стих.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «и вот» сохранён как композиционный элемент. Многоточие в конце ясно показывает, что синтаксическая конструкция продолжается в следующем стихе.
