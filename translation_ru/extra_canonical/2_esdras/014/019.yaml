lexical_decisions:
- source_word: sicut praecepisti mihi
  choice: как Ты повелел мне
  rationale: Прямо передаёт сравнительно-образный оборот и личное обращение к Богу; местоимение написано с прописной буквы согласно принятой русской библейской традиции.
- source_word: corripiam
  choice: обличу
  rationale: Глагол corripere здесь означает строго указать народу на его неправоту, укорить или исправить; «обличу» естественно для современного литературного библейского регистра.
- source_word: praesentem populum
  choice: ныне живущий народ
  rationale: Контекст следующего стиха противопоставляет этот народ тем, кто родится позднее, поэтому praesentem имеет временной смысл — нынешнее поколение, а не находящихся рядом людей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка «ныне живущий народ» сохраняет временное противопоставление контекста и не создаёт ложного пространственного смысла. Начальные слова «Вот, я пойду» следуют засвидетельствованному консультационному тексту стиха, хотя предоставленный латинский фрагмент начинается со слов sicut praecepisti mihi.
