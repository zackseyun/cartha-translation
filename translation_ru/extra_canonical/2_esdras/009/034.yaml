  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/034.yaml
  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: ru
  text: 'И вот, обычно бывает так: когда земля принимает семя, море — корабль, а какой-либо другой сосуд — пищу или питьё,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «а любой сосуд — пищу или питьё».'
    reason: Сохраняет отмеченный в консультационном слое вариант, хотя чтение aliud точнее передаётся словом «другой».
lexical_decisions:
- source_word: uas aliud
  choice: какой-либо другой сосуд
  rationale: Aliud прямо передаёт значение «другой» и сохраняет риторическое объединение земли, моря и прочего сосуда как вместилищ.
- source_word: escas uel potus
  choice: пищу или питьё
  rationale: Сохраняется различие между множественным escas («пища, съестное») и potus («питьё») в естественной современной русской формулировке.
- source_word: mare ... nauem
  choice: море — корабль
  rationale: 'Эллиптическая конструкция передана тире: подразумеваемый глагол «принимает» ясен из первой части и не требует повторения.'
- source_word: consuetudo est
  choice: обычно бывает так
  rationale: Естественно передаёт вводную формулу о привычном порядке вещей без тяжеловесного буквального «есть обычай».
