source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tempus, in quo incipiet altissimus uisitare saeculum qui ab eo factus est. Et quando uidebitur in saeculo motio locorum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/002.yaml
  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: ru
  text: тогда ты поймёшь, что это — время, когда Всевышний начнёт посещать созданный Им мир[a]. И когда в мире станут заметны сотрясения в разных местах,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «посещать» означает деятельно вмешиваться в происходящее; в данном апокалиптическом контексте это может подразумевать суд.
    reason: Поясняет непривычный для современного читателя библейский смысл глагола, не сводя его к одному богословскому истолкованию.
lexical_decisions:
- source_word: uisitare
  choice: посещать
  rationale: 'Сохраняет библейский образ Божьего посещения и его намеренную смысловую широту: речь не о простом приходе, а о деятельном вмешательстве, которое в апокалиптическом контексте может включать суд.'
- source_word: saeculum
  choice: мир
  rationale: В обоих случаях обозначает сотворенный мир как нынешний мировой порядок, а не только временной «век».
- source_word: motio locorum
  choice: сотрясения в разных местах
  rationale: Естественно по-русски передает наблюдаемые потрясения местностей; множественное число раскрывает распределительный смысл латинского родительного множественного locorum.
theological_decisions:
- issue: Характер действия Всевышнего, выраженного глаголом uisitare
  choice: Сохранен образ «посещения» с пояснением в сноске.
  alternative: «вмешиваться в дела мира» или «судить мир»
  rationale: «Вмешиваться» передает деятельную силу, но устраняет образ посещения; «судить» неоправданно сужает значение, поскольку посещение может означать как суд, так и иное явление Божьего действия.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного библейского тона. Местоимение «Им» написано с прописной буквы по устойчивой русской библейской издательской традиции. Заключительная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
