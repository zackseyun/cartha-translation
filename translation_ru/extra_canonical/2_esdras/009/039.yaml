lexical_decisions:
- source_word: dimisi cogitatus
  choice: оставил мысли
  rationale: Передаёт прекращение прежних размышлений без излишне буквального и неестественного повтора.
- source_word: in quibus eram cogitans
  choice: которыми был занят
  rationale: Естественно по-русски передаёт продолжительное состояние размышления; буквальное «которые я обдумывал» создало бы тяжеловесный повтор со словом «мысли».
- source_word: conversus sum ad eam
  choice: повернулся к ней
  rationale: Прямое и естественное соответствие латинскому обороту.
- source_word: dixi ei
  choice: сказал
  rationale: Русское управление и контекст позволяют не повторять местоимение «ей» после «к ней».
