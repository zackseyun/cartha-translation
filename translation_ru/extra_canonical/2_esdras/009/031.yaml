  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: ru
  text: Ибо вот, Я сею в вас Мой закон, и он принесёт в вас плод, и в нём вы будете прославлены навеки».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce enim
  choice: Ибо вот
  rationale: Сохраняет причинно-пояснительную связь enim и выразительное указание ecce.
- source_word: semino in uobis legem meam
  choice: Я сею в вас Мой закон
  rationale: Передаёт сельскохозяйственный образ буквально и сохраняет повторение первого лица.
- source_word: faciet in uobis fructum
  choice: он принесёт в вас плод
  rationale: Естественно передаёт латинское выражение facere fructum, не устраняя необычное уточнение «в вас».
- source_word: glorificabimini in eo
  choice: через него вы будете прославлены
  rationale: in eo допускает инструментальное понимание; «через него» ясно соотносится с законом и сохраняет пассивную форму.
- source_word: per saeculum
  choice: навеки
  rationale: В данном эсхатологическом контексте означает непреходящую длительность.
theological_decisions:
- issue: Смысл in eo
  choice: через него
  alternative: в нём
  rationale: Латинская конструкция допускает оба оттенка. «Через него» естественнее по-русски выражает связь прославления с законом, не уточняя, кем совершается прославление.
translation_notes:
  register: Современный литературный русский язык; сохранены торжественный тон, образ сеяния и богословски значимая пассивная конструкция. Заглавные местоимения отражают речь Бога, принятую в русском библейском регистре.
