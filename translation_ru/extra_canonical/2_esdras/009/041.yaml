  source_fidelity: 'Текст точно передаёт латинский оригинал. «Оставь меня» соответствует dimitte me без добавления «одну»; «чтобы я оплакала себя» сохраняет возвратный объект me; «умножила свою скорбь» естественно передаёт adiciam dolorem. «Душа моя полна горечи» адекватно выражает valde amara sum animo, а «я глубоко унижена» — humiliata sum valde. Отсутствие вводного «Она сказала мне» оправдано: в предоставленном латинском отрывке этих слов нет.'
