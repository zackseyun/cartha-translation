  text: dimitte me, dominus meus, ut defleam me et adiciam dolorem, quoniam valde amara sumanimo et humiliata sum valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: ru
  text: «Оставь меня, господин мой, чтобы я оплакала себя и умножила свою скорбь, ибо душа моя полна горечи и я глубоко унижена».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: Оставь меня
  rationale: Передаёт прямую просьбу оставить говорящую, не добавляя отсутствующего в латинском тексте наречия «одну».
- source_word: ut defleam me
  choice: чтобы я оплакала себя
  rationale: Сохраняет значение defleam — плакать о ком-либо, оплакивать — и возвратный объект me.
- source_word: adiciam dolorem
  choice: умножила свою скорбь
  rationale: Естественно по-русски передаёт буквальное «прибавила скорбь» и сохраняет напряжённый образ сознательного усиления плача.
- source_word: valde amara sum animo
  choice: душа моя полна горечи
  rationale: Идиоматично передаёт внутреннюю горечь; animo здесь обозначает внутреннее состояние, душу или дух.
- source_word: humiliata sum valde
  choice: я глубоко унижена
  rationale: Сохраняет пассивное состояние и степень, выраженную valde, не уточняя, кем или каким образом героиня была унижена.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной выразительностью. Формула обращения «господин мой» сохранена. Вводное «Она сказала мне» из английского консультационного текста не включено, поскольку его нет в предоставленном латинском источнике.
