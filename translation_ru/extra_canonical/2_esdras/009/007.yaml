  text: et erit, omnis qui salvus factus fuerit et qui poterit effugere per opera sua vel per fidem in qua credidit, is
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: ru
  text: 'И будет: всякий, кто будет спасён[a] и сможет уцелеть благодаря своим делам или вере, в которую уверовал, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И всякий, кто будет спасён…»'
    reason: Фиксирует прежнее прочтение, в котором et erit не передаётся отдельной вводной формулой.
lexical_decisions:
- source_word: et erit
  choice: 'И будет:'
  rationale: Сохраняет явную пророческо-апокалиптическую формулу латинского текста и её торжественную функцию.
- source_word: omnis qui salvus factus fuerit
  choice: всякий, кто будет спасён
  rationale: Передаёт будущую завершённость пассивной формы salvus factus fuerit, не уточняя, кем или каким образом человек спасён.
- source_word: poterit effugere
  choice: сможет избежать гибели
  rationale: Русское «избежать» требует дополнения; «гибели» выражает подразумеваемую в контексте угрозу, сохраняя различие между salvus factus fuerit и effugere.
- source_word: per opera sua
  choice: благодаря своим делам
  rationale: Естественно передаёт инструментально-средственное per, не ослабляя спорное утверждение текста о роли дел.
- source_word: vel per fidem in qua credidit
  choice: или вере, в которую уверовал
  rationale: Сохраняет альтернативу vel и необычную, но значимую связь между верой и актом уверования.
theological_decisions:
- issue: Соотношение дел и веры как средств избавления
  choice: благодаря своим делам или вере
  alternative: по своим делам или по вере
  rationale: Перевод сохраняет прямую альтернативу латинского per ... vel per и не гармонизирует её с позднейшими конфессиональными формулами.
- issue: Пассивный характер спасения
  choice: будет спасён
  alternative: спасётся
  rationale: Пассив сохраняет грамматику источника и не превращает спасение в исключительно самостоятельное действие человека.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим оттенком. Двоеточие после «И будет» оформляет формулу естественно по-русски; завершающее тире и запятая показывают, что синтаксическое продолжение находится в следующем стихе.
