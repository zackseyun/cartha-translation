  source_fidelity: Формула et erit и будущая пассивная конструкция salvus factus fuerit переданы точно. Однако «гибели» является добавленным, хотя и контекстуально понятным, объектом к effugere; в данном фрагменте латинский текст объекта не называет. «Уцелеть» естественно передаёт effugere, не внося этой конкретизации и не смешивая его со «спасён».
  naturalness: Торжественное «И будет:» уместно. «Сможет уцелеть» — нормативное и естественное русское выражение без необходимости добавлять подразумеваемый объект. Оборот «вере, в которую уверовал» намеренно сохраняет необычную синтаксическую связь оригинала и остаётся понятным.
  terminology: «Будет спасён» сохраняет пассив salvus factus fuerit; «своими делами или вере» сохраняет альтернативу per opera sua vel per fidem без конфессионального сглаживания. Сноска корректно документирует прежнее опущение формулы et erit.
