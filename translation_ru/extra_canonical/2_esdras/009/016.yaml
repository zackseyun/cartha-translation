lexical_decisions:
- source_word: sicut
  choice: как
  rationale: Передаёт сравнительную связь с предшествующим высказыванием без добавочного толкования.
- source_word: multiplicat
  choice: множатся
  rationale: Сохраняет смысл увеличения или умножения, выраженный латинским глаголом, при этом по-русски естественно связывается с «волнами».
- source_word: fluctus
  choice: волны
  rationale: Форма fluctus допускает неоднозначный грамматический разбор; множественное число соответствует образу множества волн и консультационному слою, а иной разбор отмечен в сноске.
- source_word: super guttam
  choice: в сравнении с каплей
  rationale: Латинское super здесь выражает превосходство или несоизмеримость; буквальное «над каплей» по-русски могло бы ошибочно восприниматься пространственно.
- source_word: et respondit ad me et dixit
  choice: 'И он ответил мне:'
  rationale: Естественное русское оформление формулы введения прямой речи; двоеточие передаёт функцию dixit без тяжеловесного «и сказал».
