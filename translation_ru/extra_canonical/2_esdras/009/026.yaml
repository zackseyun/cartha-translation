  text: Ardat, et sedi ibi in floribus et de herbis agri manducaui et facta est esca earum in saturitatem. Et factum est post dies
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: ru
  text: Итак, я пошёл, как он велел мне, на поле, называемое Ардат, и сел там среди цветов. Я ел полевые травы, и пища из них насытила меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пища их стала для насыщения».'
    reason: Сохраняет возможность более формального понимания неоднозначной латинской конструкции esca earum in saturitatem.
lexical_decisions:
- source_word: Ardat
  choice: Ардат
  rationale: Имя поля передано транслитерацией и сохранено как собственное имя.
- source_word: in floribus
  choice: среди цветов
  rationale: Естественно передаёт местонахождение среди цветов без излишнего уточнения.
- source_word: de herbis agri manducaui
  choice: я ел полевые травы
  rationale: Краткое и естественное соответствие латинскому выражению «ел от трав поля».
- source_word: facta est esca earum in saturitatem
  choice: пища из них насытила меня
  rationale: Передаёт пищу, полученную из трав, и результат — насыщение; устраняет неестественное для русского впечатление, будто пища принадлежала самим травам.
