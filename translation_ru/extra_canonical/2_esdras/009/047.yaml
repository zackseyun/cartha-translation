source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum crevisset et venissem accipere illi uxorem, et feci diem epuli.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/047.yaml
  text: And it happened, when he had grown up and I had come to take a wife for him, that I made a day of feasting.
translation:
  language: ru
  text: И вот, когда он вырос и я пришла взять для него жену, я устроила пир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est
  choice: И вот
  rationale: Естественно передаёт латинскую повествовательную формулу без тяжеловесного буквального «и случилось».
- source_word: cum crevisset
  choice: когда он вырос
  rationale: Сохраняет временное значение cum с плюсквамперфектом и подразумеваемое мужское лицо.
- source_word: venissem accipere illi uxorem
  choice: я пришла взять для него жену
  rationale: 'Близко передаёт латинскую конструкцию: accipere — «взять», illi — «для него». Женский род говорящей восстанавливается из контекста речи матери в данном эпизоде.'
- source_word: feci diem epuli
  choice: я устроила пир
  rationale: Передаёт смысл идиомы «устроила день пиршества» естественным современным русским выражением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный тон простой и достойный. Буквальная латинская идиома «сделала день пиршества» передана естественным выражением «устроила пир».
