  source_fidelity: Начальное «Ибо» верно передаёт объяснительное Nam из более широкого контекста; «принял его» оправданно сохраняет подразумеваемую отсылку к закону. «Погибли» точно передаёт perierunt, а образ посеянного в людях сохранён. В заключительном незавершённом сравнении латинское cum acceperit («когда ... примет/получит») лучше передать совершенным будущим, обозначающим предварительное получение семени.
  naturalness: Текст в целом литературен и ясен. «Таков обычай» естественнее и компактнее, чем разговорно-описательное «обычно бывает так», при этом сохраняет обобщённый характер consuetudo est. «Того, что было посеяно в них» делает подразумеваемое quod явным без добавления смысла.
  terminology: Специальные богословские термины не вводятся. Местоимение «его» сохраняет контекстуальный референт без излишней экспликации. Альтернативное «Но» в сноске допустимо как отражение прежнего варианта, однако основной текст верно выбирает «Ибо».
