  text: acceperunt perierunt non custodientes quod in eis seminatum fuerat. Et ecce consuetudo est ut, cum acceperit terra semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: ru
  text: 'Ибо те, кто принял его, погибли[a], потому что не сохранили того, что было посеяно в них. И вот, таков обычай: когда земля примет семя,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но те, кто принял его, погибли».'
    reason: Сохраняется засвидетельствованный прежний вариант передачи связи с предыдущей мыслью, хотя контекстуальное Nam лучше понимать как «ибо».
lexical_decisions:
- source_word: acceperunt
  choice: приняли его
  rationale: Сохраняет связь с законом из предшествующего контекста; местоимение естественно передаёт подразумеваемый объект.
- source_word: perierunt
  choice: погибли
  rationale: Прямое и контекстуально уместное соответствие латинскому глаголу.
- source_word: non custodientes
  choice: потому что не сохранили
  rationale: Причастный оборот передан естественным русским придаточным причины, как того требует смысловая связь.
- source_word: quod in eis seminatum fuerat
  choice: посеянного в них
  rationale: Сохраняет метафору сеяния и пассивный смысл, не уточняя сверх источника, что именно было посеяно.
- source_word: consuetudo est
  choice: обычно бывает так
  rationale: Естественно передаёт общее установленное положение без неуместного оттенка человеческого обычая.
- source_word: cum acceperit terra semen
  choice: когда земля принимает семя
  rationale: Настоящее время по-русски естественно выражает общее правило; порядок образов источника сохранён.
theological_decisions:
- issue: Логическая связь с предшествующим утверждением
  choice: Ибо
  alternative: Но
  rationale: 'Полный контекст латинской традиции содержит начальное Nam, которое вводит объяснение: погиб не плод закона, а принявшие его люди.'
- issue: Референт подразумеваемого объекта при acceperunt
  choice: его
  alternative: это
  rationale: Мужской род местоимения поддерживает вероятную отсылку к закону из контекста, не добавляя отдельного существительного в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Незавершённость последней фразы сохранена, поскольку стих продолжается далее.
