id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: ru
  text: Так что впредь не любопытствуй о том, как будут мучимы нечестивые, но исследуй, как спасутся праведные, и кому принадлежит век, и ради кого существует век, и когда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в конце: «и когда». Латинский текст оставляет связь этого вопроса с «веком» эллиптической.'
    reason: Сохраняет лаконичную неоднозначность оригинала и поясняет намеренно эллиптическую русскую формулу.
lexical_decisions:
- source_word: tu ergo adhuc noli curiosus esse
  choice: Так что впредь не любопытствуй
  rationale: Передаёт обращение во втором лице, вывод ergo и прекращение прежнего любопытства; современная русская формулировка сохраняет предостерегающий тон.
- source_word: impii
  choice: нечестивые
  rationale: Обычный библейский эквивалент, обозначающий людей, противящихся Богу, без излишнего конфессионального уточнения.
- source_word: cruciabuntur
  choice: будут мучимы
  rationale: Сохраняет пассивную форму и смысл подвергания мучению, не уточняя исполнителя.
- source_word: inquire
  choice: исследуй
  rationale: Передаёт призыв направить внимание на серьёзное разыскание, в противоположность праздному любопытству.
- source_word: iusti salvabuntur
  choice: спасутся праведные
  rationale: Естественная русская конструкция сохраняет богословски значимые понятия праведности и спасения.
- source_word: quorum saeculum et propter quos saeculum
  choice: кому принадлежит век, и ради кого существует век
  rationale: Сохраняет необычный параллелизм и различие между принадлежностью века и теми, ради кого он существует.
- source_word: quando
  choice: когда он наступит
  rationale: В русском языке одиночное «и когда» звучит обрывочно; добавление подразумеваемого наступления делает вопрос понятным, а примечание отмечает буквальную краткость оригинала.
theological_decisions:
- issue: Значение saeculum
  choice: век
  alternative: мир / грядущий век
  rationale: Латинское saeculum может указывать на век, эпоху или мировой порядок. «Век» сохраняет эсхатологическую неоднозначность и не вводит отсутствующее определение «грядущий».
- issue: Подразумеваемый смысл quando
  choice: когда он наступит
  alternative: и когда
  rationale: Контекст допускает вопрос о времени наступления века, однако латинский текст оставляет глагол подразумеваемым. Основной текст обеспечивает естественность, а сноска сохраняет осведомлённость о буквальной форме.
- issue: Деятель спасения и мучения
  choice: сохранены пассивная и возвратная формы без называния деятеля
  alternative: Бог спасёт праведных и накажет нечестивых
  rationale: Источник не называет действующего субъекта; его явное добавление неоправданно разрешило бы богословскую недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. Синтаксис сохраняет противопоставление между праздным интересом к участи нечестивых и исследованием спасения праведных, а также намеренно необычную трёхчастную формулу о веке.
