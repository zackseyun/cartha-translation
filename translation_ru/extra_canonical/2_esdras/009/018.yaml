    issue: «Век, в котором им предстояло обитать»
    rationale: Хотя saeculum может значить «век», глагол inhabitarent требует пространства или мира как места проживания. В русском это сочетание воспринимается неестественно и затемняет космологический смысл; вариант «мир» лучше передаёт данный контекст, а альтернативное значение следует вынести в сноску.
