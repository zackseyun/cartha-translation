id: 2ES.9.18
reference: 2 Esdras 9:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: ru
  text: И тогда, когда Я готовил для них — для тех, кто существует ныне, — ещё до того, как для них был создан мир[a], в котором им предстояло жить, никто Мне не противоречил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «век» или «эпоха». Латинское saeculum может обозначать как мир, так и век или эпоху.'
    reason: semantic_range
lexical_decisions:
- source_word: parans eis
  choice: готовил для них
  rationale: 'Сохраняет отсутствие названного дополнения в латинском тексте: не уточняется, что именно Бог готовил для них.'
- source_word: his qui nunc
  choice: для тех, кто существует ныне
  rationale: Передаёт эллиптическое латинское выражение «те, кто ныне [есть]» ясно и без добавления отсутствующего уточнения.
- source_word: saeculum
  choice: век
  rationale: Сохраняет временно-космологическое значение слова; возможное значение «мир» отмечено в сноске.
- source_word: inhabitarent
  choice: им предстояло обитать
  rationale: Передаёт сослагательное наклонение в зависимом определительном обороте и сохраняет возвышенный, но понятный регистр.
- source_word: nemo contradixit mihi
  choice: никто Мне не противоречил
  rationale: Прямо передаёт латинский текст, не добавляя пояснения «потому что никого не было», отсутствующего в данном источнике.
theological_decisions:
- issue: Неуточнённый предмет приготовления
  choice: Не добавлять, что именно Бог готовил
  alternative: 'Уточнить: «готовил мир» или «готовил всё»'
  rationale: Латинское parans eis не называет предмет; его конкретизация устранила бы подлинную неопределённость текста.
- issue: Значение saeculum
  choice: «век» с указанием варианта «мир» в сноске
  alternative: «мир» в основном тексте
  rationale: «Век» ближе к обычному апокалиптическому значению saeculum, тогда как глагол «обитать» допускает также пространственно-космическое понимание.
- issue: Дополнительное объяснение отсутствия возражающих
  choice: Не включать фразу «потому что никого не было»
  alternative: Добавить её по свидетельству другой древней версии
  rationale: В указанном основном латинском тексте этой фразы нет; её включение в основной перевод нарушило бы источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения «Я» и «Мне» обозначают говорящего Бога. Вставная конструкция сохраняет повтор латинского eis, his qui nunc и поясняет, кого означает «для них».
