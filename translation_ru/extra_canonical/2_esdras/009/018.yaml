revisions:
- from: И тогда, когда Я готовил для них — для тех, кто существует ныне, — ещё до того, как для них был сотворён век[a], в котором им предстояло обитать, никто Мне не противоречил.
  to: И тогда, когда Я готовил для них — для тех, кто существует ныне, — ещё до того, как для них был создан мир[a], в котором им предстояло жить, никто Мне не противоречил.
