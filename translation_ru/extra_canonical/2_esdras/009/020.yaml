source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erat perditum, et orbem meum, et ecce erat periclitans propter cogitationes quae in eo aduenerunt. Et uidi et peperci eis uix
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/020.yaml
  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: ru
  text: И Я взглянул на мир Мой — и вот, он был погублен; и на обитаемый мир Мой — и вот, ему грозила гибель из-за замыслов, появившихся в нём. И Я увидел и едва пощадил их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «едва пощадил их»; кого именно обозначает «их», латинский текст прямо не уточняет — вероятно, обитателей мира.'
    reason: Сохраняет неопределённый антецедент латинского eis и поясняет буквальный смысл vix.
lexical_decisions:
- source_word: saeculum meum
  choice: мир Мой
  rationale: В данном контексте saeculum обозначает существующий мир, а не только временной «век»; современное русское «мир Мой» естественно и согласуется с параллельным orbis.
- source_word: orbem meum
  choice: обитаемый мир Мой
  rationale: Orbis здесь означает земной, населённый мир; добавление «обитаемый» сохраняет различие с saeculum и смысловую параллель.
- source_word: erat perditum
  choice: был погублен
  rationale: Передаёт завершённое состояние гибели или разорения без ослабления до простого «пришёл в упадок».
- source_word: erat periclitans
  choice: ему грозила гибель
  rationale: Естественная русская передача состояния крайней опасности; в контексте речь идёт не о незначительном риске, а об угрозе погибели.
- source_word: cogitationes
  choice: замыслы
  rationale: Слово может означать мысли, намерения или замыслы; «замыслы» сохраняет деятельный, нравственно напряжённый оттенок контекста, не уточняя, чьи именно они.
- source_word: peperci eis uix
  choice: едва пощадил их
  rationale: 'Буквально сохраняет plural eis и наречие vix: пощада была оказана лишь едва, без замены на менее точное «с трудом».'
theological_decisions:
- issue: Неясный антецедент местоимения eis («их»)
  choice: Сохранить местоимение «их» и пояснить неопределённость в сноске
  alternative: Раскрыть как «обитателей мира»
  rationale: Латинский текст не называет объект пощады прямо. Явное добавление «обитателей» устранило бы подлинную синтаксическую неопределённость.
- issue: Соотношение saeculum и orbis
  choice: «мир» и «обитаемый мир»
  alternative: «век» и «земля»
  rationale: Выбранная пара передаёт космологический смысл и параллелизм, не вводя идею отдельной эпохи, которая здесь не обязательна.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Заглавное «Я/Мой» обозначает речь Бога. Параллельная конструкция «и вот» сохранена; архаизмы и конфессионально окрашенные уточнения не вводятся.
