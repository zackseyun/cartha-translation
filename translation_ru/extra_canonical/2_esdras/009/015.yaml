  text: olim locutus sum et nunc dico et postea dicam, quoniam plures suntqui pereunt quam qui salvabuntur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/015.yaml
  text: '“I have spoken before[a], and now I say, and I will say afterward: many more perish than will be saved,'
translation:
  language: ru
  text: '«Я прежде говорил[a], а теперь говорю и позднее скажу: погибающих больше, чем тех, кто будет спасён,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я говорил некогда».'
    reason: Латинское olim может обозначать как предшествующее время («прежде»), так и более отдалённое «некогда».
lexical_decisions:
- source_word: olim locutus sum
  choice: Я говорил прежде
  rationale: Передаёт завершённое прошедшее locutus sum и временное olim естественным современным русским выражением, сохраняя отличие от последующих форм dico/dicam.
- source_word: nunc dico et postea dicam
  choice: и теперь говорю, и впоследствии скажу
  rationale: «Говорю/скажу» естественно вводит последующее утверждение и отражает смену латинской лексемы с loquor на dico, насколько это допускает русский язык.
- source_word: plures sunt qui pereunt quam qui salvabuntur
  choice: погибающих гораздо больше, чем тех, кто будет спасён
  rationale: Сохраняет противопоставление настоящего pereunt и будущего пассивного salvabuntur; «гораздо больше» идиоматично выражает сравнительную конструкцию plures... quam в данном контексте.
theological_decisions:
- issue: Временной и залоговый контраст между pereunt и salvabuntur
  choice: «погибающих» / «будет спасён»
  alternative: «тех, кто погибнет» / «тех, кто спасётся»
  rationale: 'Выбранный вариант следует формам источника: pereunt — настоящее активное, salvabuntur — будущее пассивное, не устраняя богословски значимую асимметрию.'
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Синтаксис сохраняет риторическое повторение исходного текста.
