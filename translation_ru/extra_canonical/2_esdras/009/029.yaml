  text: 'dicere coram altissimo et dixi: O domine in nobis ostendens ostensus es patribus nostris in deserto quando erant exientes de Aegypto et quando ueniebant in deserto quod non calcatur et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: ru
  text: 'И я сказал: «О Господи, Ты явил Себя среди нас, нашим отцам в пустыне, когда они выходили из Египта и входили в нехоженую и бесплодную пустыню,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинская фраза буквально заканчивается: «в пустыню, по которой не ходят и которая не приносит плода».'
    reason: Сохраняет доступ к образной форме исходного выражения, тогда как основной текст передаёт её естественными русскими определениями.
lexical_decisions:
- source_word: ostendens ostensus es
  choice: Ты явил Себя
  rationale: Удвоенная латинская конструкция передаёт усиление, вероятно семитского происхождения. В современном русском естественное «явил Себя» сохраняет торжественный смысл, не добавляя спорного наречия вроде «явно» или «несомненно».
- source_word: in nobis ... patribus nostris
  choice: среди нас нашим отцам
  rationale: 'Сохранены обе предложные связи латинского текста и его некоторая смысловая напряжённость: Бог явил Себя «среди нас» — «нашим отцам».'
- source_word: deserto quod non calcatur
  choice: нехоженую ... пустыню
  rationale: «Нехоженая» естественно и точно передаёт пустыню, по которой не ступали или которую не попирали ногами.
- source_word: fructum non facit
  choice: бесплодную
  rationale: Передаёт смысл «не приносит плода» кратким естественным определением; эта формулировка засвидетельствована продолжением текста и отражена в консультационном английском слое.
theological_decisions:
- issue: Кому и где явился Господь
  choice: Ты явил Себя среди нас нашим отцам
  alternative: Ты явственно явил Себя нашим отцам среди нас
  rationale: Выбранный порядок не устраняет необычную связь in nobis с patribus nostris и не превращает грамматическое усиление в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Обращение «О Господи» и прописные местоимения поддерживают традиционный русский регистр; синтаксис остаётся понятным обычному читателю. Начальное «И я сказал» передаёт dixi; предшествующее dicere coram altissimo, вероятно, относится к оборванному контексту предыдущей фразы.
