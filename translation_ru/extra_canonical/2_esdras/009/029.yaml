    rationale: Запятая после «нас» нужна, чтобы обозначить обстоятельственный оборот и адресатов явления, сохранив необычную двойную отнесённость латинского in nobis ... patribus nostris.
  - severity: low
    issue: Запятая между «нехоженую» и «бесплодную».
    rationale: Определения характеризуют пустыню как единый образ и не требуют разделительной запятой; её удаление улучшает плавность русского текста.
