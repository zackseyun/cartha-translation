source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female servant, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: ru
  text: 'И случилось через тридцать лет: Бог услышал меня, рабу твою, увидел моё унижение, обратил внимание на мою скорбь и дал мне сына. И я очень радовалась ему — и я, и мой муж, и все мои сограждане, — и мы глубоко чтили Могущественного.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exaudivit
  choice: услышал
  rationale: Передаёт услышанную и принятую Богом мольбу; в данном контексте естественно по-русски и не добавляет отсутствующего в тексте уточнения.
- source_word: ancillae tuae
  choice: рабу твою
  rationale: Латинская форма отражает приложение к me, вероятно под влиянием греческой конструкции. «Рабу» сохраняет социально-религиозную силу ancilla, а женский род выражен формой винительного падежа.
- source_word: humilitatem
  choice: унижение
  rationale: Сохраняет значение униженного, бедственного положения, не сужая его до внутреннего смирения.
- source_word: adtendit tribulationi meae
  choice: обратил внимание на мою скорбь
  rationale: Естественно передаёт внимательное отношение к бедствию; «скорбь» соответствует личному страданию говорящей.
- source_word: iucundata sum super eum valde
  choice: я очень радовалась ему
  rationale: Идиоматичный русский эквивалент латинского оборота со значением большой радости о данном сыне.
- source_word: cives mei
  choice: мои сограждане
  rationale: Прямо сохраняет гражданско-общинное значение cives, не заменяя его более расплывчатым «жители города».
- source_word: Fortem
  choice: Могущественного
  rationale: Субстантивированное божественное именование передано с прописной буквы; выбор сохраняет акцент на силе без добавления слова «Бог».
theological_decisions:
- issue: Синтаксис Deus ancillae tuae
  choice: Бог услышал меня, рабу твою
  alternative: Бог рабы твоей услышал меня
  rationale: Последнее чтение формально возможно из поверхностной латинской формы, но плохо согласуется с контекстом и, вероятно, возникло из-за буквального воспроизведения греческого генитива при глаголе слушания. Основной текст передаёт наиболее вероятный смысл, не создавая отдельного «Бога рабы».
- issue: Божественный титул Fortem
  choice: Могущественного
  alternative: Сильного
  rationale: «Могущественный» звучит как достойный божественный титул и сохраняет смысл силы; «Сильный» формально ближе, но в современном русском менее естественен как самостоятельное именование.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Женский голос ясно выражен формами «рабу» и «радовалась». Синтаксис слегка упорядочен для естественного чтения, при этом последовательность действий и повторное включение говорящей в ряд радующихся сохранены.
