  source_fidelity: 'Текст точно передаёт латинскую последовательность: χρονологическое указание, услышанная Богом просьба говорящей как «рабы твоей», увиденное униженное положение, внимание к её бедствию, дарование сына, общая великая радость и почитание божественного именования Fortem. «Через тридцать лет» допустимо для post triginta annos; «унижение» удачно не сводит humilitatem к добродетели смирения.'
