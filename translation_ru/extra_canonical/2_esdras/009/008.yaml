id: 2ES.9.8
reference: 2 Esdras 9:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquetur de praedictis periculis et videbit salutare meum in terra mea et in finibus meis, quae sanctificavi mihi a saeculo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: ru
  text: будет сохранён от предсказанных бедствий[a] и увидит Моё спасение в Моей земле и в Моих пределах, которые Я освятил для Себя издревле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «останется после предсказанных бедствий».'
    reason: Латинское relinquetur de допускает более буквальное понимание «останется, выйдя из», наряду с контекстуальным «будет сохранён от».
lexical_decisions:
- source_word: relinquetur de
  choice: будет сохранён от
  rationale: Передаёт пассивную форму и смысл того, что человек будет оставлен в живых или избавлен от бедствий, не превращая выражение однозначно в активное «переживёт».
- source_word: praedictis periculis
  choice: предсказанных бедствий
  rationale: «Предсказанных» прямо передаёт praedictis, а «бедствий» естественно выражает periculis в эсхатологическом контексте.
- source_word: salutare meum
  choice: Моё спасение
  rationale: Сохраняет субстантивированное значение salutare и принадлежность говорящему без уточнения способа спасения.
- source_word: in terra mea et in finibus meis
  choice: в Моей земле и в Моих пределах
  rationale: Формально и ясно сохраняет оба пространственных обозначения и повтор притяжательного местоимения.
- source_word: a saeculo
  choice: издревле
  rationale: Естественный современный русский эквивалент со значением «с давних времён», без искусственного латинизма «от века».
theological_decisions:
- issue: Характер избавления в relinquetur de
  choice: будет сохранён от
  alternative: переживёт
  rationale: Пассивная формулировка сохраняет подразумеваемое действие Бога и не сводит спасение к способности человека самостоятельно пережить бедствия.
- issue: К чему относится quae sanctificavi
  choice: к ближайшему antecedent — «Моим пределам»
  alternative: к «Моей земле и Моим пределам» вместе
  rationale: Средний род множественного числа quae грамматически непосредственно согласуется с finibus, тогда как terra имеет женский род единственного числа.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра; сохранены исходный порядок образов, пассивность первого сказуемого и смысловая напряжённость формулы избавления.
