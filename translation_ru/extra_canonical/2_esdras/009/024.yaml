  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: ru
  text: Пойди в поле, где не построено ни одного дома, и ешь только полевые цветы. Не вкушай мяса и не пей вина — только цветы. Непрестанно молись Всевышнему, и
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: floribus campi / flores
  choice: полевые цветы / цветы
  rationale: Латинское flores передано прямо как «цветы»; в первом случае campi естественно выражено определением «полевые».
- source_word: carnem non gustabis
  choice: не вкушай мяса
  rationale: «Вкушай» сохраняет буквальный образ gustare и соответствует достоинству религиозного наставления, оставаясь понятным современному читателю.
- source_word: altissimum
  choice: Всевышнему
  rationale: Устоявшееся и точное русское именование Бога, соответствующее латинскому превосходному эпитету Altissimus.
- source_word: sine intermissione
  choice: непрестанно
  rationale: Кратко и естественно передаёт значение «без перерыва, не прекращая».
theological_decisions:
- issue: Незавершённость заключительной фразы
  choice: сохранить конечный союз «и»
  alternative: завершить предложение без союза или дополнить его по следующему стиху
  rationale: Латинский источник заканчивает стих союзом et; сохранение открытой синтаксической связи не сглаживает исходное деление текста и не вводит отсутствующих слов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Повелительные формы передают наставительный характер текста; синтаксическая незавершённость в конце намеренно сохранена по источнику.
