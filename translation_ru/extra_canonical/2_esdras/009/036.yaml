  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: ru
  text: Мы же[a], принявшие Закон, погибнем как грешники, и также погибнет наше сердце, принявшее его[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся латинский текст в этом месте текстуально и синтаксически труден. Основной смысл таков: получившие Закон погибают, тогда как сам Закон не погибает и остаётся в чести.'
    reason: textual_variant
  - marker: b
    text: 'Или: «Мы же, принявшие Закон, погибнем, греша, и также погибнет наше сердце, принявшее его». Латинское причастие допускает разные оттенки значения.'
    reason: previous_rendering
lexical_decisions:
- source_word: nos quidem
  choice: Мы же
  rationale: Частица quidem придаёт местоимению подчёркнутый, отчасти противопоставительный оттенок; «мы же» естественно передаёт его по-русски, не превращая оборот в причинное «ибо мы».
- source_word: legem
  choice: Закон
  rationale: В данном контексте имеется в виду данный Богом Закон; прописная буква ясно обозначает это конкретное понятие.
- source_word: peccantes peribimus
  choice: погибнем, потому что согрешили
  rationale: Причастие peccantes связывает гибель с грехом. Причинная конструкция звучит естественно по-русски, хотя латинскую форму можно передать и как «погибнем как согрешившие» или «погибнем, греша».
- source_word: cor nostrum quod suscepit eam
  choice: наше сердце, которое приняло его
  rationale: Сохранены явное притяжательное nostrum («наше») и женское местоимение eam, относящееся к lex; в русском род местоимения согласуется со словом «Закон».
theological_decisions:
- issue: Связь греха и гибели
  choice: «погибнем, потому что согрешили»
  alternative: «погибнем как согрешившие» / «погибнем, греша»
  rationale: Основной текст ясно выражает причинную связь, не добавляя учения о механизме суда; примечание сохраняет грамматическую неоднозначность латинского причастия.
- issue: Гибель принявшего Закон сердца
  choice: Сохранить буквальное «и также наше сердце»
  alternative: Истолковать «сердце» как внутреннего человека или совесть
  rationale: Необычный образ оставлен без догматического разъяснения, поскольку латинский текст прямо говорит о «нашем сердце» и не уточняет его значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая незавершённость в конце стиха сохранена с точкой с запятой, поскольку мысль продолжается в следующем стихе; необычное упоминание сердца не истолковано сверх текста.
