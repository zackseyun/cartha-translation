  source_fidelity: В основном переданы emphatic/adversative nos quidem («Мы же»), явное nostrum («наше») и связь eam с Законом. Однако «потому что согрешили» превращает латинское настоящее причастие peccantes в завершённый прошлый грех и однозначную причинную конструкцию. Для текстуально шероховатого места это чрезмерное уточнение.
  naturalness: Фраза литературна, но «и также наше сердце» без повторённого сказуемого звучит по-русски несколько обрывочно. Повторение «погибнет» естественно раскрывает эллипсис исходного текста, не меняя смысла.
  terminology: «Закон» с прописной буквы уместен для данного Богом Закона. «Сердце» сохранено буквально и не получает конфессионального истолкования.
