  source_fidelity: Перевод точно передаёт латинское ego enim per singulas horas et per singulos dies in annis triginta his deprecabar Altissimum nocte ac die. Сохранены первое лицо, пояснительный оттенок enim, указание на «эти тридцать лет», усиленное «каждый час и каждый день», а также заключительное «ночью и днём». «Молился Всевышнему» адекватно передаёт deprecabar Altissimum, не внося невыраженного содержания просьбы.
  naturalness: Фраза естественна для современного литературного русского. Порядок обстоятельств с вынесением «все эти тридцать лет» звучит плавно, а повтор временных выражений сохраняет намеренную настойчивость оригинала.
  terminology: «Всевышний» — традиционный, понятный и нейтральный эквивалент Altissimus. Форма «Всевышнему» правильно согласована с глаголом «молиться».
