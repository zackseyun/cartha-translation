  text: For every hour and every day throughout those thirty years I kept praying to the Most High night and day.
translation:
  language: ru
  text: Ведь все эти тридцать лет, каждый час и каждый день, я молился Всевышнему ночью и днём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ego enim
  choice: Ведь… я
  rationale: Передаёт пояснительно-причинный оттенок enim и сохраняет явное первое лицо.
- source_word: per singulas horas et per singulos dies
  choice: каждый час и каждый день
  rationale: Естественно и близко передаёт повторяемость и непрерывность, выраженные singulas.
- source_word: in annis triginta his
  choice: все эти тридцать лет
  rationale: Восстанавливает очевидное чтение очищенного латинского текста и сохраняет указательное his.
- source_word: deprecabar
  choice: молился
  rationale: В данном контексте обозначает настойчивое молитвенное обращение; русское «молился» звучит естественно и не добавляет объекта просьбы, не названного в тексте.
- source_word: Altissimum
  choice: Всевышнему
  rationale: Традиционный и общепонятный эквивалент божественного титула, с дательным падежом при «молился».
- source_word: nocte ac die
  choice: ночью и днём
  rationale: Сохраняет порядок исходного текста и подчёркивает непрестанность молитвы.
