  text: 'И я сказал ей: «Что с тобой случилось? Расскажи мне». И она сказала мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid passa es
  choice: Что с тобой случилось?
  rationale: Естественно передаёт вопрос о пережитом или постигшем женщину несчастье, не сужая смысл до физического страдания.
- source_word: dic mihi
  choice: Расскажи мне
  rationale: В данном контексте просьба раскрыть случившееся по-русски естественнее звучит как «Расскажи мне», а не буквально «Скажи мне».
- source_word: et dixit ad me
  choice: 'И она сказала мне:'
  rationale: Сохраняет заключительную вводную формулу речи и двоеточие, поскольку ответ следует в следующем стихе.
