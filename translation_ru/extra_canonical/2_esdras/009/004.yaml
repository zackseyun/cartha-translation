translation_notes:
  register: 'Современный литературный русский язык; тон краткий и возвышенный. Учитывая явно усечённое начало предоставленной латинской строки («simus…» как окончание Altissimus) и синтаксически полный свидетельствуемый текст стиха, восстановлены элементы, отражённые также в проверочном английском слое: «тогда ты поймёшь… Всевышний».'
