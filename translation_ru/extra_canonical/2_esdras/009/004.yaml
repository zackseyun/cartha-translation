lexical_decisions:
- source_word: intelleges
  choice: ты поймёшь
  rationale: Естественная современная передача будущего времени латинского глагола с сохранением обращения во втором лице.
- source_word: de his ipsis
  choice: именно об этом
  rationale: Частица «именно» передаёт усиление ipsis, а единственное собирательное «об этом» естественно по-русски обозначает упомянутые явления.
- source_word: Altissimus
  choice: Всевышний
  rationale: Устоявшееся и прозрачное русское наименование Бога, соответствующее латинскому превосходному титулу.
- source_word: a diebus qui fuerunt ante ab initio
  choice: издревле, от начала
  rationale: Сохраняет оба временных выражения и их риторическое наложение, не сглаживая его до одного обстоятельства.
