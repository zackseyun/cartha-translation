  text: and confusion among peoples, thoughts among nations, instability among leaders, turmoil among rulers. Then you will understand that it was about these things that the Most High
translation:
  language: ru
  text: смятение народов, замыслы племён, непостоянство вождей, смута среди правителей. Тогда ты поймёшь, что именно об этом говорил Всевышний…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populorum turbatio
  choice: смятение народов
  rationale: Передаёт turbatio как состояние беспорядка и тревоги, сохраняя лаконичную именную конструкцию оригинала.
- source_word: gentium cogitationes
  choice: замыслы племён
  rationale: Cogitationes допускает значения «мысли», «размышления», «намерения» и «замыслы»; в перечне общественно-политических знамений «замыслы» звучит естественно, не добавляя однозначно злого умысла. Gentes передано как «племена», чтобы не повторять «народы» из предыдущей фразы.
- source_word: ducum inconstantia
  choice: непостоянство вождей
  rationale: Формально сохраняет значение inconstantia и отличает duces, ведущих или военных предводителей, от principes.
- source_word: principum turbatio
  choice: смута среди правителей
  rationale: Передаёт turbatio в общественно-политическом смысле; «среди» естественно выражает охват группы правителей и избегает двусмысленного «смятение правителей».
- source_word: Tunc intelleges
  choice: Тогда ты поймёшь
  rationale: Прямо передаёт временное наречие и форму второго лица единственного числа.
- source_word: quoniam de his erat altissimus
  choice: что именно об этом говорил Всевышний
  rationale: Фрагмент обрывается на altis-; по восстановленному синтаксису erat понимается эллиптически в связи с речью/предсказанием Всевышнего. «Именно» подчёркивает de his без избыточной буквальности.
theological_decisions:
- issue: Обозначение Бога словом altissimus
  choice: Всевышний
  alternative: Наивысший
  rationale: «Всевышний» — естественный и традиционный русский эквивалент латинского superlativus, не вносящий конфессионально специфического толкования.
- issue: Незавершённость исходного отрывка
  choice: Сохранить открытый конец многоточием
  alternative: Завершить предложение по контексту следующего стиха
  rationale: Предоставленный латинский текст обрывается на altis-, а английский консультационный слой также оставляет предложение незавершённым; продолжение не следует молча реконструировать.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического перечня. Сохранены параллельные именные конструкции и различие между duces и principes; лексические повторы слегка варьированы там, где это требуется естественным русским употреблением.
