  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: ru
  text: И я увидел и с большим трудом пощадил их; я сохранил для Себя одну ягоду из грозди и один саженец из большого леса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В латинском тексте буквально: «один саженец из великого племени»; вероятно, это древняя порча текста. Другие древние версии читают «из большого леса». Латинское valde буквально означает «весьма»; поэтому начало можно также понять: «и я весьма пощадил их».'
    reason: Отмечает латинское чтение tribu и синтаксико-смысловую проблему valde, не выдавая контекстуальное «с большим трудом» за его буквальное значение.
lexical_decisions:
- source_word: saluaui mihi
  choice: я сохранил для себя
  rationale: Передаёт возвратное значение mihi и смысл сохранения чего-либо для себя.
- source_word: acinum de botru
  choice: одну ягоду из грозди
  rationale: Acinum обозначает отдельную виноградную ягоду, botrus — гроздь; образ передан конкретно и естественно по-русски.
- source_word: plantationem
  choice: одно дерево
  rationale: В параллельном образе с лесом речь идёт об одном сохранённом насаждении, то есть дереве; буквальное «насаждение» по-русски звучало бы отвлечённо и хуже согласовывалось бы с лесом.
- source_word: de tribu multa
  choice: из огромного леса
  rationale: Хотя очищенный латинский текст имеет tribu («племени»), это отражает древнюю порчу греческого текста; сирийская, эфиопская, арабская и армянская версии поддерживают «лес», что также соответствует параллелизму «ягода из грозди — дерево из леса».
- source_word: ualde
  choice: с большим трудом
  rationale: Следует смыслу, сохранённому в консультационном английском слое, и выражает крайнюю ограниченность спасённого остатка; формально латинское valde допускает связь с глаголом «пощадил» в значении «сильно/весьма».
theological_decisions:
- issue: Характер Божьего пощажения
  choice: с большим трудом пощадил их
  alternative: весьма пощадил их
  rationale: 'Выбранное чтение сохраняет напряжение контекста: пощажён лишь малый остаток. Альтернатива ближе к поверхностному синтаксису латинского valde, поэтому неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образ малого остатка передан конкретными и понятными словами; точка с запятой подчёркивает развитие одной мысли.
