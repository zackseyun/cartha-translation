  source_fidelity: 'Основной образ передан верно: отдельная виноградина из грозди и сохранённое растение из большого леса. Однако «дерево» чрезмерно конкретизирует лат. plantationem («посадка; насаждение; саженец»), а «огромного» усиливает multa («большого, великого») без необходимости. Формулировка «с большим трудом» поддержана английским аудиторским слоем и контекстуально осмысленным чтением, но не является буквальным значением изолированного лат. ualde; это следует честно и компактно оговорить в сноске.'
