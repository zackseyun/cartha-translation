  terminology: «Пощадил», «сохранил для Себя», «гроздь», «саженец» точны и не несут конфессионально обусловленных оттенков. «Лес» оправдан как авторское/древневерсийное чтение; вариант латинской рукописной традиции следует оставить в сноске.
