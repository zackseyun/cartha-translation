  text: «Я приду и поговорю с тобой». И я отправился, как он мне сказал, в поле, которое называется…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ueniam et loquar tecum
  choice: Я приду и поговорю с тобой
  rationale: Передаёт два латинских глагола будущего времени естественной современной русской фразой.
- source_word: profectus sum
  choice: я пошёл
  rationale: В данном контексте обозначает отправление в указанное место; «пошёл» звучит естественно и не добавляет способ передвижения.
- source_word: sicut dixit mihi
  choice: как он велел мне
  rationale: Буквально возможно «как он сказал мне», но в контексте указания отправиться в поле оборот имеет побудительный смысл; «велел» ясно и естественно передаёт его.
- source_word: in campum quod uocatur
  choice: в поле, которое называется…
  rationale: Сохраняет незавершённость латинской фразы, продолжение которой следует далее.
