lexical_decisions:
- source_word: non ieiunabis
  choice: ты не будешь поститься
  rationale: Будущее время латинского глагола сохранено; в контексте оно выражает данное адресату указание, не превращаясь в более резкий русский императив.
- source_word: in eis
  choice: в эти дни
  rationale: Латинское местоимение буквально означает «в них» и отсылает к дням из предшествующего контекста; явное обозначение референта естественно по-русски.
- source_word: campum florum
  choice: поле цветов
  rationale: Передаёт конкретный образ поля, покрытого цветами, без добавления отсутствующих в источнике характеристик.
- source_word: ubi
  choice: где…
  rationale: Сохранена незавершённость синтаксической конструкции, продолжающейся в следующем стихе.
