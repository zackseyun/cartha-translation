  text: Но в эти дни ты не будешь поститься[a], а пойдёшь на поле цветов, где…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в них»; то есть в упомянутые ранее дни.'
