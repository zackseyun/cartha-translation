source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: ru
  text: Каково поле, таковы и семена; каковы цветы, таковы и краски; каково дело, таково и творение; каков земледелец, таково и гумно. Ибо было время века,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ager
  choice: поле
  rationale: Прямое и естественное соответствие в земледельском образе.
- source_word: tincturae
  choice: окраска
  rationale: Передаёт цвет или окраску цветов, сохраняя различие между flores и tincturae.
- source_word: opera
  choice: дело
  rationale: Сохраняет широкое значение латинского слова и параллель с creatio.
- source_word: creatio
  choice: творение
  rationale: Формально передаёт латинское creatio, не сужая его до отдельного изделия.
- source_word: agricola
  choice: земледелец
  rationale: Дигнифицированное современное обозначение возделывателя земли.
- source_word: area
  choice: гумно
  rationale: Точный традиционный термин для места молотьбы, уместный в библейском земледельческом контексте.
- source_word: tempus erat saeculi
  choice: было время этого века
  rationale: Передаёт наличие или наступление времени века без добавления отсутствующего в источнике указания «таково»; формулировка остаётся открытой к продолжению мысли в следующем стихе.
theological_decisions:
- issue: Соотношение дела и творения
  choice: «каково дело, таково и творение»
  alternative: «какова работа, таково и создание»
  rationale: Сохранена намеренная обобщённость и возможное богословское звучание creatio без уточнения субъекта или характера творения.
- issue: Значение saeculum
  choice: «век»
  alternative: «мир» или «эпоха»
  rationale: «Век» сохраняет эсхатологическую многозначность латинского saeculum и не разрешает её в пользу исключительно временного либо пространственного смысла.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Анафорическая конструкция «каково/каковы… таково/таковы» воспроизводит риторический параллелизм источника. В предоставленном латинском тексте отсутствует вводное «он ответил мне и сказал», поэтому оно не включено. Конечная запятая сохраняет незавершённость фразы, продолжающейся в следующем стихе.
