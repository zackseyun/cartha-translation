  verdict: revise
  source_fidelity: Смысл и параллельная структура латинского текста в целом переданы точно. Однако латинское множественное tincturae («краски/цвета») лучше передать русским множественным числом. Указательное «этого» в «время этого века» не выражено в saeculi; достаточно «время века».
  naturalness: Анафорическое «каково/каковы — таково/таковы» звучит естественно в современном литературном русском с уместной библейской возвышенностью. «Ибо» несколько точнее передаёт причинный союз quoniam, чем разговорное «ведь».
  terminology: «Поле», «семена», «цветы», «дело», «творение», «земледелец» и «гумно» соответствуют исходному тексту. «Гумно» удачно передаёт area в значении места молотьбы. «Век» сохраняет многозначность saeculum.
