lexical_decisions:
- source_word: quotquot
  choice: все, кто
  rationale: Передаёт обобщающее значение латинского относительного местоимения.
- source_word: non cognoverunt me
  choice: не познал Меня
  rationale: Глагол cognoscere здесь означает не просто распознать, а познать; прописная буква указывает на речь Бога.
- source_word: viventes
  choice: при жизни
  rationale: Естественная русская передача обстоятельственного причастия со значением «будучи живыми».
- source_word: beneficia consecuti
  choice: хотя и получал благодеяния
  rationale: Consecuti передаёт фактическое получение дарованных благ; уступительный оттенок следует из синтаксического противопоставления и сохраняет незавершённость стиха.
theological_decisions:
- issue: Характер Божьих beneficia
  choice: благодеяния
  alternative: блага / милости
  rationale: «Благодеяния» сохраняет широкое значение полученных от Бога благ, не сужая его до особого богословского понятия благодати.
translation_notes:
  register: Современный литературный и достойный регистр. Сохранена синтаксическая незавершённость фразы, поскольку стих продолжается далее; местоимение «Меня» написано с прописной буквы как прямая речь Бога.
