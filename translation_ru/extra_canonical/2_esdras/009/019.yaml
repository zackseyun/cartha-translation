review_pass:
  verdict: revise
  source_fidelity: 'Латинское hoc parato допускает контекстуальное восполнение «мира», а образ «неистощимой трапезы» и «неисследимого закона» передан без чрезмерного толкования. Однако ablativus при mensa ... lege естественнее передать русским «с», чем «при»: последнее создаёт оттенок простого сопутствующего обстоятельства, а не дарованного обеспечения и закона. Пассивное corrupti sunt лучше сохранить как «были развращены».'
  naturalness: «При неистощимой трапезе» звучит несколько неестественно в современном литературном русском. Конструкция «с неистощимой трапезой и неисследимым законом» яснее и плавнее. «Были развращены своими нравами» сохраняет напряжённую, несколько необычную формулировку латинского текста и остаётся приемлемой в библейском регистре.
  terminology: «Трапеза», «закон» и «век» удачно сохраняют высокий библейский регистр и не сужают смысл образов. «Неисследимый» годится для inuestigabili. В сноске лучше не называть наставление прямо «Божьим», поскольку это интерпретирующее уточнение, хотя оно и вероятно по контексту.
