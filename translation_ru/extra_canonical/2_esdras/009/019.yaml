    rationale: Латинский ablativus mensa indeficienti et lege inuestigabili скорее представляет данные условия/дары; «с» точнее и естественнее передаёт эту связь.
  - severity: low
    issue: Пассив corrupti sunt передан возвратным глаголом.
    rationale: «Развратились» передаёт результат, но «были развращены» ближе к грамматической форме источника и сохраняет возможную неоднозначность причинной связи с moribus eorum.
  - severity: low
    issue: Сноска добавляет определение «Божье».
    rationale: Источник в данном предложении говорит лишь о «законе»; пояснение следует оставить менее конфессионально и текстуально более нейтральным.
