  text: hoc parato et mensa indeficienti et lege inuestigabili, corrupti sunt moribus eorum. Et consideraui saeculum meum et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: ru
  text: 'Но созданные в этом приготовленном мире[a], с неистощимой трапезой и неисследимым законом, были развращены своими нравами. И я взглянул на свой век — и вот:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинское выражение «неистощимая трапеза и неисследимый закон» трудно для истолкования. По-видимому, смысл в том, что людям уже были даны всё необходимое и наставление, однако они были развращены своими нравами.
    reason: textual_variant
lexical_decisions:
- source_word: hoc parato
  choice: в этом приготовленном мире
  rationale: Латинское выражение буквально означает «когда это было приготовлено» или «при этом приготовленном»; слово «мире» восполнено из ближайшего контекста и отражает принятое контекстуальное понимание.
- source_word: mensa indeficienti
  choice: при неистощимой трапезе
  rationale: Сохраняется образ трапезы, которая не иссякает; предлог «при» естественно связывает предоставленное людям изобилие с последующим противопоставлением.
- source_word: lege inuestigabili
  choice: неисследимом законе
  rationale: Передаёт значение закона, глубина которого не может быть до конца исследована, не сводя выражение к одной богословской интерпретации.
- source_word: corrupti sunt moribus eorum
  choice: развратились в своих нравах
  rationale: Передаёт нравственную испорченность и сохраняет отнесение «их» к самим упомянутым людям; возвратное «своих» естественно по-русски.
- source_word: saeculum meum
  choice: свой век
  rationale: Сохраняет широкое значение saeculum — эпоха, век или нынешний миропорядок — без преждевременного уточнения.
theological_decisions:
- issue: Соотношение Божьего обеспечения и человеческой испорченности
  choice: Сохранено прямое противопоставление приготовленного мира, неистощимой трапезы и неисследимого закона нравственному развращению людей.
  alternative: Истолковать трапезу исключительно как материальное обеспечение, а закон — исключительно как конкретное откровение.
  rationale: Латинский текст оставляет образы широкими и напряжение между даром и человеческим ответом не разрешает.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного библейского регистра. Образы «трапезы», «закона» и «века» оставлены открытыми; финальное «и вот» сохраняет незавершённый переход к следующему стиху.
