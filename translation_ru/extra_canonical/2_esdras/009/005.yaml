  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: ru
  text: Ибо, как у всего возникшего в этом веке есть начало через завершение[a], а завершение явно,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное и поддерживаемое рядом древних версий чтение: «начало явно, а завершение явно». Латинское чтение «через завершение» текстологически затруднительно.'
    reason: Сохраняет предоставленное чтение `per consummationem` в основном тексте и отмечает более гладкое чтение `initium patet et consummatio manifesta`, не приписывая ему иной смысл.
lexical_decisions:
- source_word: saeculo
  choice: в этом веке
  rationale: Передаёт временное значение латинского saeculum и сохраняет отличие от более конкретного «мира».
- source_word: consummatio
  choice: завершение
  rationale: Нейтрально передаёт достижение конца или полноты, не сужая смысл до уничтожения.
- source_word: manifesta
  choice: становится явным
  rationale: Естественная русская передача сказуемого при эллиптической латинской конструкции; сохраняет значение открытости и очевидности.
theological_decisions:
- issue: Связь начала и завершения в чтении initium per consummationem
  choice: «начало приходит через завершение»
  alternative: «начало явно, а завершение очевидно»
  rationale: Основной текст следует предоставленному латинскому чтению per и не устраняет его трудный, богословски напряжённый смысл; альтернативное чтение patet отмечено в сноске как текстологическое.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Эллиптическая и трудная структура источника слегка прояснена глаголами, но её смысловая напряжённость сохранена; конечная запятая показывает продолжение фразы.
