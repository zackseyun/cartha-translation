  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: ru
  text: Но наши отцы, приняв закон, не соблюдали его и не хранили Моих установлений. Плод же закона не погиб — да и не мог погибнуть, потому что был Твоим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: наши отцы
  rationale: Сохраняет традиционное обозначение предков и прямую форму латинского текста.
- source_word: accipientes legem
  choice: приняв закон
  rationale: Естественно передаёт обстоятельственное значение причастия и последовательность действий.
- source_word: legitima mea
  choice: Моих установлений
  rationale: «Установления» точно и понятно передаёт legitima; притяжательное местоимение сохранено вопреки напряжению с последующим «Твоим».
- source_word: fructus legis
  choice: плод закона
  rationale: Сохранён образный оборот источника без истолкования того, что именно является «плодом».
- source_word: non periens; nec enim poterat
  choice: не погиб — да и не мог погибнуть
  rationale: Передаёт утверждение и последующее обоснование в естественной русской синтаксической форме.
- source_word: quoniam tuus erat
  choice: потому что был Твоим
  rationale: Сохраняет прямую отнесённость плода к адресату и не устраняет местоименную неоднозначность текста.
theological_decisions:
- issue: Напряжение между legitima mea («Мои установления») и tuus erat («был Твоим»)
  choice: 'Оба притяжательных местоимения переданы буквально: «Моих» и «Твоим».'
  alternative: Согласовать местоимения по предполагаемому говорящему либо заменить одно из них существительным «Бога».
  rationale: Источник содержит реальное местоименное напряжение; его не следует молча устранять толкованием.
- issue: Смысл выражения «плод закона»
  choice: Образ сохранён без поясняющей конкретизации.
  alternative: Передать как «результат закона», «праведность» или «награда закона».
  rationale: Латинский текст не определяет референт образа, поэтому конкретизация сузила бы возможный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но ключевые образы и местоименная неоднозначность источника сохранены. Местоимения, обращённые к Богу или относящиеся к Нему, написаны с прописной буквы в соответствии с принятой русской религиозной издательской практикой.
