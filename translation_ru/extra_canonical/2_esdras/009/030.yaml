lexical_decisions:
- source_word: dicens dixisti
  choice: Ты сказал, говоря
  rationale: Передаёт удвоенную глагольную конструкцию латинского текста, сохраняя её библейский, семитизированный характер и не сводя два элемента к одному.
- source_word: Tu Israel audi me
  choice: Слушай Меня, Израиль
  rationale: Сохраняет прямое обращение и порядок смысловых компонентов источника; повелительное audi естественно передано как «слушай».
- source_word: semen
  choice: семя
  rationale: Буквальный и традиционно понятный эквивалент в обращении «семя Иакова», сохраняющий коллективный образ потомства.
