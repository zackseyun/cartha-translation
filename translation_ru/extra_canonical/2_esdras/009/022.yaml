source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seruietur acinus meus et plantatio mea, quia cum multo labore perfeci haec. Tu autem si adhuc intermittas septem dies alios—
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: ru
  text: Пусть будут сохранены мой виноград и моё насаждение, ибо я с великим трудом завершил их. А если ты отложишь это ещё на семь дней,—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruietur
  choice: пусть будет сохранена
  rationale: По контексту передаёт значение сохранения или сбережения; страдательная форма и волевой оттенок латинского сохранены.
- source_word: acinus meus
  choice: моя виноградная лоза
  rationale: Буквально acinus — «виноградная ягода» или «гроздь», но в паре с plantatio это образ принадлежащей говорящему виноградной лозы; перевод сохраняет виноградарский образ и естественно звучит по-русски.
- source_word: plantatio mea
  choice: моё насаждение
  rationale: Сохраняет конкретный земледельческий образ латинского plantatio, не сужая его до отдельного растения.
- source_word: cum multo labore perfeci haec
  choice: я взрастил их с великим трудом
  rationale: В данном образном контексте perfeci означает доведение насаждений до зрелости или устроенности; «взрастил» естественно связывает результат с большим трудом, не вводя идею безупречности.
- source_word: si adhuc intermittas septem dies alios
  choice: если ещё выждешь другие семь дней
  rationale: Intermittere здесь обозначает сделать ещё один промежуток, отсрочить действие; «выждешь» передаёт продолжение ожидания и условность.
theological_decisions:
- issue: Образ винограда и насаждения
  choice: Сохранён как земледельческая метафора без поясняющего отождествления.
  alternative: Истолковать виноград и насаждение как конкретную группу людей.
  rationale: Сам стих не раскрывает референт образа; перевод не должен устранять богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Конечное тире сохраняет незавершённость фразы, продолжающейся в следующем стихе.
