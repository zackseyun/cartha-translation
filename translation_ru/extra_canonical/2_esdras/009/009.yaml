source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc mirabuntur qui nunc abusi sunt vias meas, et in cruciamentis commorabuntur hii qui eos proiecerunt in contemptu.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: ru
  text: Тогда изумятся те, кто ныне злоупотребляют Моими путями, а те, кто с презрением отвергли их, останутся в мучениях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabuntur
  choice: изумятся
  rationale: Передаёт будущее значение латинского глагола и сильную реакцию удивления, не уточняя её причину.
- source_word: abusi sunt vias meas
  choice: злоупотребляет Моими путями
  rationale: Сохраняет необычную и несколько напряжённую формулировку латинского текста; настоящее время по-русски соответствует nunc и описывает нынешнее поведение.
- source_word: proiecerunt in contemptu
  choice: с презрением отверг их
  rationale: Естественно передаёт образ отбрасывания и явно выраженное презрение; местоимение «их» относится к путям.
- source_word: in cruciamentis commorabuntur
  choice: останутся в мучениях
  rationale: Передаёт длительное пребывание в мучениях без добавления отсутствующего в источнике указания на их вечность.
theological_decisions:
- issue: Продолжительность мучений
  choice: останутся в мучениях
  alternative: будут вечно мучиться
  rationale: Латинское commorabuntur выражает пребывание или задержку, но само по себе не означает вечности.
- issue: Объект отвержения
  choice: отверг их
  alternative: отверг Мои пути
  rationale: Сохраняется местоименная связь с ранее названными «Моими путями», без добавления нового содержания.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Заглавная буква в «Моими» обозначает речь Бога. Синтаксический параллелизм двух групп сохранён.
