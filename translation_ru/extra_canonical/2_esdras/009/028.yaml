  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: ru
  text: Сердце моё было в смятении, как и прежде.[a] И открылись уста мои, и я начал[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок начинается со сказуемого «было в смятении»; подлежащее «сердце моё» восстанавливается из непосредственного контекста латинского текста.
    reason: Указывает на контекстуальное восполнение подлежащего и не выдаёт его за присутствующее в данном отрывке.
  - marker: b
    text: Предоставленный латинский текст здесь обрывается на словах «я начал»; продолжение, имеющееся в английском консультационном тексте, в данном отрывке по-латыни не приведено.
    reason: Прозрачно отмечает неполноту исходного фрагмента и объясняет незавершённость русского предложения.
lexical_decisions:
- source_word: turbabatur
  choice: было в смятении
  rationale: Латинский имперфект передаёт продолжавшееся внутреннее смятение; такая формулировка естественна по-русски и не усиливает значение до страха или отчаяния.
- source_word: apertum est os meum
  choice: открылись уста мои
  rationale: Сохранён библейский образ и пассивно-результативный характер латинского выражения без разговорного упрощения «я открыл рот».
- source_word: inchoaui
  choice: я начал
  rationale: Латинский отрывок заканчивается на глаголе «начал», не называя последующего действия; перевод сохраняет эту незавершённость.
theological_decisions:
- issue: Продолжение речи перед Всевышним в английском консультационном тексте
  choice: Не добавлять «говорить перед Всевышним, и сказал» в основной текст
  alternative: Следовать английскому POB и включить продолжение
  rationale: Предоставленный латинский источник непосредственно засвидетельствован только до inchoaui. Добавление отсутствующих слов сделало бы английский слой фактической основой перевода вопреки приоритету оригинального текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью («уста мои»). Сохранены порядок образов, внутреннее смятение и формальная незавершённость предоставленного латинского отрывка; многоточие обозначает обрыв, а не эмоциональную паузу.
