  source_fidelity: Латинское metiens metire передано с эмфазой («тщательно измеряй»), in temetipso — без подстановки отсутствующего в данном фрагменте «времени». Pars quaedam signorum quae praedicta sunt и transiuit переданы точно. Конечное ipsum est оставлено синтаксически незавершённым, как и в предоставленном латинском тексте.
  naturalness: Фраза в целом естественна для современного литературного русского в библейском регистре. Однако скобочная ссылка [b] после многоточия и пояснение о том, что существительное непременно «следует из продолжения предложения», излишне редакторски интерпретируют оборванный фрагмент. Незавершённость лучше обозначить непосредственно многоточием без отдельной сноски.
  terminology: «Знамения» — уместное соответствие signa в данном апокалиптическом контексте; «предсказанные» точно передаёт praedicta. «Тщательно» адекватно передаёт усиление metiens metire. Формула «это и есть то самое» сохраняет усилительное ipsum, не навязывая референт.
