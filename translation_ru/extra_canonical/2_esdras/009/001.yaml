  text: 'Et respondit ad me et dixit: metiens metire in temetipso, et erit cum uideris quoniam transiuit pars quaedam signorum quae praedicta sunt, Tunc intelleges quoniam ipsum est'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/001.yaml
  text: He answered me and said[a], “Measure carefully within yourself, and when you see that some part of the signs foretold has passed by,
translation:
  language: ru
  text: 'Он ответил мне и сказал: «Тщательно измеряй в самом себе[a]. И когда увидишь, что некоторая часть предсказанных знамений уже миновала, тогда поймёшь, что это и есть то самое…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отмеряй в самом себе».'
    reason: Глагол metire допускает как более общее «измеряй», так и контекстуальное «отмеряй».
lexical_decisions:
- source_word: metiens metire
  choice: тщательно измеряй
  rationale: Сочетание причастия с повелительной формой усиливает глагол; наречие «тщательно» естественно передаёт эту эмфазу по-русски.
- source_word: in temetipso
  choice: в самом себе
  rationale: Буквально сохраняет направленность действия на самого адресата и не подменяет выражение реконструируемым «время само по себе».
- source_word: transiuit pars quaedam
  choice: некоторая часть… уже миновала
  rationale: Передаёт неопределённое pars quaedam и завершённость transiuit; «миновала» естественно сочетается со знамениями как уже совершившимися событиями.
- source_word: ipsum est
  choice: это и есть то самое
  rationale: Сохраняет указательно-усилительный смысл ipsum, не вставляя отсутствующее в предоставленном отрывке существительное.
theological_decisions:
- issue: Неявный референт ipsum в конце предоставленного латинского текста
  choice: 'Сохранить недосказанность: «это и есть то самое…»'
  alternative: «Настало то самое время»
  rationale: Существительное tempus отсутствует в предоставленном тексте и, вероятно, следует далее; его явная вставка преждевременно устранила бы синтаксическую неопределённость данного фрагмента.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён лишь настолько, чтобы длинная латинская фраза читалась естественно; повторная формула речи и смысловая незавершённость конца сохранены.
