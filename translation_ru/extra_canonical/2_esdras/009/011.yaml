  text: and all who despised my law while they still had freedom,
translation:
  language: ru
  text: и все, кто отвергал Мой закон, пока ещё имел свободу,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot
  choice: все, кто
  rationale: Передаёт обобщающее значение латинского «сколько бы ни / все, кто» естественным русским оборотом.
- source_word: fastidierunt
  choice: отвергал
  rationale: Глагол fastidire выражает пренебрежение и презрительное неприятие; «отвергал» сохраняет направленность действия на закон, не усиливая её до однозначного «презирал».
- source_word: legem meam
  choice: Мой закон
  rationale: Прямое соответствие латинскому выражению; прописная буква в притяжательном местоимении указывает на речь Бога согласно принятой русской библейской орфографии.
- source_word: cum adhuc erant habentes libertatem
  choice: пока ещё имел свободу
  rationale: Естественно передаёт временное значение cum adhuc и перифрастическое «были имеющими свободу»; единственное число согласуется с русской конструкцией «все, кто».
theological_decisions:
- issue: Смысл libertatem
  choice: свободу
  alternative: возможность выбора / время для покаяния
  rationale: Сохранён широкий и потенциально богословски значимый смысл латинского libertas; контекстуальное уточнение не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён как часть продолжающегося предложения; поэтому строка начинается со строчной буквы и завершается запятой.
