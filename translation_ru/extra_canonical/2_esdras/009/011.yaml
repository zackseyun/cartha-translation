  source_fidelity: 'Текст точно передаёт латинское et quotquot fastidierunt legem meam, cum adhuc erant habentes libertatem: «все, кто» соответствует quotquot; «отвергал Мой закон» адекватно передаёт fastidierunt legem meam без неоправданного догматического усиления; «пока ещё имел свободу» сохраняет временной оттенок cum adhuc и широкий смысл libertatem.'
  naturalness: Фраза естественна для современного литературного русского в контексте продолжающегося предложения. Единственное число «имел» после «кто» нормативно и не создаёт смысловой неясности; оно распределительно относится к каждому из упомянутых людей.
