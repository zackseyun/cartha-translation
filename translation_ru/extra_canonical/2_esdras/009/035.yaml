source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae suscepta sunt, Exterminentur haec, susceptoria uero manent: apud nos enim non sic factum est. Nos quidem qui legem accepimus peccantes peribimus et cor nostrum quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: ru
  text: и когда уничтожается то, что было принято[a], оно погибает, а вместилища остаются. Ведь с нами произошло не так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «...то, что было посеяно, послано или принято, уничтожается; а то, что приняло это, остаётся».'
    reason: Передаёт примечание английского POB об альтернативном понимании образного выражения, сохраняя основной перевод по предоставленному латинскому тексту.
lexical_decisions:
- source_word: suscepta sunt
  choice: то, что было принято
  rationale: Сохраняет значение латинского suscipere — «принимать» — и не добавляет отсутствующих в данном тексте значений «посеянное» или «посланное».
- source_word: Exterminentur
  choice: уничтожается
  rationale: Передаёт устранение или гибель принятого в параллельной временной конструкции; форма согласована с русским оборотом «то, что».
- source_word: susceptoria
  choice: вместилища
  rationale: Передаёт предметы или среды, принимающие в себя нечто, и сохраняет смысловую связь с suscepta без технического оттенка слова «приёмники».
- source_word: apud nos enim non sic factum est
  choice: Ведь с нами произошло не так
  rationale: «Ведь» отражает объяснительное enim, а «с нами» естественно передаёт apud nos в данном рассуждении.
theological_decisions:
- issue: Соотношение уничтожаемого и принимающих его вместилищ
  choice: Не уточнять, что именно было принято и что представляют собой вместилища
  alternative: Истолковать это как семя и землю либо как людей и мир
  rationale: Сам латинский стих выражается обобщённо; конкретизация внесла бы в перевод контекстуальное толкование и сняла бы намеренную образную широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор и противопоставление латинского текста; начало со строчной буквы отражает продолжение предложения из предыдущего стиха.
