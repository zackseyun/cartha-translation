  text: For the law does not perish[a], but remains in its honor.”
translation:
  language: ru
  text: Ибо закон не погибает[a], но пребывает в своей чести».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но закон не погибает и пребывает в своей чести».'
    reason: Сохраняет ранее засвидетельствованный в английской аудиторской записи альтернативный порядок союзов, но не опускает «in suo honore».
lexical_decisions:
- source_word: lex
  choice: закон
  rationale: Прямое и естественное соответствие латинскому lex в данном религиозно-нравственном контексте.
- source_word: non perit
  choice: не погибает
  rationale: Передаёт perire как утрату существования, не ослабляя категоричности отрицания.
- source_word: permanet
  choice: сохраняет
  rationale: В сочетании с in suo honore по-русски естественнее переходная конструкция «сохраняет своё достоинство», чем буквальное «остаётся».
- source_word: in suo honore
  choice: своё достоинство
  rationale: Honor здесь обозначает сохраняемую честь, почёт и высокое положение закона; «достоинство» звучит естественно и достойно в современном русском.
theological_decisions:
- issue: Противопоставление между гибелью закона и его непреходящим достоинством
  choice: «не погибает, но сохраняет своё достоинство»
  alternative: «не погибает и остаётся в чести»
  rationale: Латинское sed выражает явное противопоставление, которое следует сохранить с помощью «но», не превращая его в простое соединение.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная. Начальное «Ибо» передаёт объяснительное Nam, а кавычка в конце отражает завершение прямой речи в предоставленном контексте.
