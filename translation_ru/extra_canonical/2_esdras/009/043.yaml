  text: She said to me, “I, your female servant, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: ru
  text: 'Она сказала мне: «Я, твоя рабыня, была бесплодна и не родила, хотя у меня был муж тридцать лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula tua
  choice: твоя рабыня
  rationale: Латинское famula обозначает служанку или рабыню; «рабыня» сохраняет выраженное женское значение и социальную зависимость, не добавляя отсутствующего в источнике уточнения.
- source_word: sterilis fui
  choice: была бесплодна
  rationale: Прямой и естественный русский эквивалент, сохраняющий состояние, выраженное прошедшим временем.
- source_word: non peperi
  choice: не родила
  rationale: Передаёт конкретное значение parere — родить, не подменяя его более общим «не имела детей».
- source_word: habens maritum annis triginta
  choice: прожив с мужем тридцать лет
  rationale: Естественно передаёт длительность супружества; латинский оборот буквально означает, что у женщины был муж на протяжении тридцати лет.
