id: 2ES.9.6
reference: 2 Esdras 9:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'manifesta in prodigiis et uirtutibus, et consummatio in actu et in signis. Et erit omnis qui saluus factus fuerit, et qui poterit effugere per opera sua uel per fidem in qua credidit, Is relinquetur de praedictis periculis et uidebit salutare meum in terra mea et in finibus meis quae sanctificaui mihi a saeculo. Et tunc mirabuntur qui nunc abusi sunt uias meas, et in cruciamentis commorabuntur hii qui eas proiecerunt in contemptu. Quodquod enim non cognouerunt me uiuentes beneficia consecuti, Et quodquod fastidierunt legem meam, cum adhuc erant habentes libertatem, Et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreuerunt, hos oportet post mortem in cruciamento cognoscere. Tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti saluabuntur, et quorum saeculum et propter quos saeculum et quando. Respondi et dixi : Olim locutus sum et nunc dico et postea dicam, quoniam plures sunt qui pereunt quam ii qui saluabuntur, Sicut multiplicat
    fluctus super guttam. Et respondit ad me et dixit : qualis ager, talia et semina ; et quales flores, tales et tincturae ; et qualis opera, talis et creatio ; et qualis agricola, talis et area. Quoniam tempus erat saeculi, et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum, in quo inhabitarent; et nemo contradixit mihi tunc, nec enim erat quisquam: Et nunc creati in mundo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/006.yaml
  text: 'so also are the times of the Most High: beginnings made manifest in wonders and mighty works[a], and the end in deeds and signs.'
translation:
  language: ru
  text: 'Таковы и времена Всевышнего: начала открываются в чудесах и могущественных деяниях, а конец[a] — в делах и знамениях.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завершение».'
    reason: Латинское consummatio может обозначать как конец, так и завершение или доведение до полноты.
lexical_decisions:
- source_word: manifesta
  choice: открываются
  rationale: Передаёт явное обнаружение или проявление начал; по-русски глагольная конструкция естественнее буквального «явны».
- source_word: prodigiis
  choice: чудесах
  rationale: Латинское prodigia обозначает необычайные чудесные явления; «чудеса» ясно и естественно в данном контексте.
- source_word: uirtutibus
  choice: могущественных деяниях
  rationale: Сохраняет значение проявлений силы, не сводя слово ни только к абстрактному могуществу, ни к нравственным добродетелям.
- source_word: consummatio
  choice: конец
  rationale: Существительное стоит в единственном числе и обозначает завершение времён; «конец» естественно противопоставлен «началам».
- source_word: actu
  choice: делах
  rationale: Передаёт действие, осуществлённое на деле, и сохраняет отличие от последующих «знамений».
- source_word: signis
  choice: знамениях
  rationale: Обычное библейское соответствие для signa, подчёркивающее указательный смысл событий.
theological_decisions:
- issue: Значение consummatio
  choice: конец
  alternative: завершение
  rationale: «Конец» кратко и естественно передаёт эсхатологическое завершение, тогда как «завершение» несколько сильнее подчёркивает доведение процесса до полноты; примечание сохраняет эту смысловую возможность.
- issue: Значение uirtutibus
  choice: могущественные деяния
  alternative: силы
  rationale: Контекст говорит о наблюдаемых проявлениях наряду с чудесами; выбранный вариант не вводит специальной доктринальной трактовки и остаётся понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с сдержанным библейским достоинством. Сохранены множественное число «начала» и единственное число «конец», соответствующие грамматическому контрасту источника.
