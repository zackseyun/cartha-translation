id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: ru
  text: И пока для них ещё была открыта возможность покаяться, они не поняли, но презрели её; этим людям надлежит после смерти, в мучениях, познать это.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально объект глагола «познать» в латинском тексте не назван.
    reason: Сохраняется неопределённость оригинала относительно того, что именно они познают после смерти в мучениях.
lexical_decisions:
- source_word: paenitentiae locus
  choice: возможность покаяться
  rationale: Буквально «место покаяния»; по смыслу латинского оборота речь об ещё открытой возможности для покаяния. Глагольная формулировка естественнее в современном русском языке.
- source_word: spreverunt
  choice: презрели её
  rationale: Передаёт не просто отказ, а выраженное в spreverunt пренебрежение; местоимение указывает на возможность покаяться.
- source_word: hos oportet
  choice: этим людям надлежит
  rationale: Сохраняет указательное hos и безличную необходимость oportet, не превращая её в прямое утверждение о Божьем повелении.
- source_word: in cruciamento
  choice: в мучениях
  rationale: Передаёт состояние мучения или истязания без неоправданного уточнения его природы.
theological_decisions:
- issue: Не выраженный объект cognoscere
  choice: познать это
  alternative: узнать
  rationale: В латинском тексте объект не назван. «Это» сохраняет смысловую отсылку к презренной ими реальности, не уточняя, что именно они познают в мучениях.
- issue: Характер необходимости после смерти
  choice: надлежит
  alternative: придётся
  rationale: «Надлежит» передаёт oportet и сохраняет богословскую сдержанность оригинала; разговорное «придётся» сильнее подчёркивало бы вынужденность.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, достойным регистром. Синтаксис латинского предложения сохранён без тяжеловесной буквальности; точка с запятой подчёркивает причинно-следственное противопоставление двух частей.
