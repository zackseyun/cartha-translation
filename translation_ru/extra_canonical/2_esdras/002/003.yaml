    issue: Видовое значение Educaui
    rationale: «Растил» — несовершенный вид, тогда как латинский перфект Educaui сообщает о совершившемся воспитании. «Воспитал» точнее передаёт форму и смысл.
  - severity: low
    issue: Передача luctu et tristitia
    rationale: '«С плачем и скорбью» возможно, но «в скорби и печали» точнее отражает два существительных оригинала и их различие: luctus — скорбь/траур, tristitia — печаль.'
  - severity: low
    issue: Противительный союз «а»
    rationale: В оригинале стоит соединительный et. Противопоставление подразумевается контекстом, но не выражено отдельным противительным союзом; «и» сохраняет структуру точнее.
