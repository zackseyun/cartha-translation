  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: ru
  text: Я воспитал вас с радостью и потерял вас в скорби и печали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui
  choice: растил
  rationale: Латинское educare здесь означает «взращивать, воспитывать»; «растил» естественно по-русски и сохраняет образ родительской заботы.
- source_word: cum laetitia
  choice: с радостью
  rationale: Прямо и естественно передаёт сопутствующее чувство радости.
- source_word: amisi
  choice: потерял
  rationale: Сохраняет прямой смысл утраты, не уточняя её причину или характер.
- source_word: cum luctu et tristitia
  choice: с плачем и скорбью
  rationale: Luctus может обозначать траур, плач или горе, а tristitia — печаль, скорбь; сочетание «с плачем и скорбью» сохраняет два взаимодополняющих выражения горя и звучит достойно в данном контексте.
theological_decisions:
- issue: Характер утраты в amisi
  choice: потерял
  alternative: лишился
  rationale: Выбрано нейтральное «потерял», чтобы не определять, означает ли утрата смерть, отступничество, изгнание или разрыв отношений.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция исходного текста сохранена. Мужской род глаголов следует за подразумеваемым говорящим в контексте; богословская неоднозначность природы утраты не устранена.
