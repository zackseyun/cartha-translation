  text: Mittam tibi adiutorium pueros meos Isaiam et Hieremiam, ad quorum consilium sanctificaui et paraui tibi arbores xii grauatās uariis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/018.yaml
  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: ru
  text: Я пошлю тебе в помощь Моих слуг[a] — Исаию и Иеремию. По их совету Я освятил и приготовил для тебя двенадцать деревьев, отягощённых разнообразными плодами[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моих юношей»; латинское pueros допускает оба значения.'
    reason: Латинское слово лексически неоднозначно, хотя контекст поддерживает значение «слуг».
  - marker: b
    text: В приведённой латинской строке после «разнообразными» существительное не указано; «плодами» добавлено по контексту образа и в соответствии с английской контрольной версией.
    reason: Прозрачно отмечает добавление, не делая неподтверждённого вывода о состоянии латинской рукописной традиции.
lexical_decisions:
- source_word: Mittam tibi adiutorium
  choice: Я пошлю тебе в помощь
  rationale: Передаёт обещание послать помощь естественным современным русским оборотом, сохраняя личное обращение.
- source_word: pueros meos
  choice: Моих слуг
  rationale: Хотя puer буквально может означать «мальчик» или «юноша», в данном контексте речь об Исаии и Иеремии как Божьих служителях; «слуг» соответствует контексту и остаётся понятным читателю.
- source_word: ad quorum consilium
  choice: По их совету
  rationale: Сохраняет необычное указание латинского текста на участие Исаии и Иеремии в совете, не объясняя и не устраняя богословское напряжение.
- source_word: sanctificaui et paraui tibi
  choice: Я освятил и приготовил для тебя
  rationale: Последовательно передаёт оба латинских глагола и их совершённый вид.
- source_word: arbores xii grauatās uariis
  choice: двенадцать деревьев, отягощённых разнообразными плодами
  rationale: «Отягощённых» сохраняет образ grauatās; «плодами» восстанавливает подразумеваемое существительное после субстантивированного variis в соответствии с контекстом и консультационным английским текстом.
theological_decisions:
- issue: Чьим советом совершается освящение и приготовление
  choice: По их совету Я освятил и приготовил
  alternative: Для их совета Я освятил и приготовил
  rationale: Выбранное чтение естественно передаёт ad quorum consilium и сохраняет прямое утверждение источника о совете Исаии и Иеремии, не переосмысляя его конфессионально.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Тире выделяет приложение с именами пророков; конечная запятая сохранена, поскольку стих синтаксически продолжается.
