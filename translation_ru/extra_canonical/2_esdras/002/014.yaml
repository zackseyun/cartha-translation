source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Testare, testare caelum et terram, omisi enim malum et creaui bonum, quia uiuo ego, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/014.yaml
  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: ru
  text: '«Призови, призови небо и землю в свидетели[a]: Я отверг зло и сотворил добро. Ибо жив Я, — говорит Господь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Призови, призови небо и землю засвидетельствовать».'
    reason: Латинское testare допускает близкие способы передачи; винительный падеж caelum et terram поддерживает понимание как призывание неба и земли в качестве свидетелей.
lexical_decisions:
- source_word: Testare, testare
  choice: Призови, призови … в свидетели
  rationale: 'Латинский deponent testare здесь — повелительное наклонение единственного числа с caelum et terram в винительном падеже: обращённому к кому-то велено призвать небо и землю в свидетели. Повтор сохранён как выражение настойчивости.'
- source_word: caelum et terram
  choice: небо и землю
  rationale: Сохранены винительный падеж и традиционная библейская парность образов.
- source_word: omisi enim malum
  choice: Я отверг зло
  rationale: Omisi передаёт оставление или отвержение зла; «отверг» естественнее современного двусмысленного «оставил» и не усиливает смысл до полного уничтожения.
- source_word: creaui bonum
  choice: сотворил добро
  rationale: Прямо передаёт creavi и сохраняет смысловой контраст со злом.
- source_word: quia uiuo ego
  choice: Ибо жив Я
  rationale: Сохранены эмфатическое ego и торжественная формула утверждения Божьей жизни без добавления отсутствующего слова «вечно».
- source_word: dicit dominus
  choice: говорит Господь
  rationale: Стандартная и естественная передача пророческой формулы.
theological_decisions:
- issue: Отвержение зла и сотворение добра
  choice: «отверг зло и сотворил добро»
  alternative: «устранил зло и создал благо»
  rationale: Выбранная формулировка сохраняет несимметричные латинские глаголы omisi и creavi и не утверждает, что зло было сотворено Господом или уже полностью уничтожено.
- issue: Формула quia vivo ego
  choice: «Ибо жив Я»
  alternative: «потому что Я жив»
  rationale: Торжественный порядок слов сохраняет эмфазу исходного текста и возможный оттенок клятвенной формулы, не разъясняя его сверх текста.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Повтор повелительного глагола намеренно сохранён; синтаксис разбит на два предложения для ясности и выразительности.
