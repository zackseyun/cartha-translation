  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: ru
  text: '[…] чтобы я пошёл к Израилю[a]. Но когда я пришёл к ним, они отвергли меня и отринули повеление Господа. Поэтому говорю вам, народы:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный латинский текст начинается словами «чтобы я пошёл к Израилю» и не содержит начала предложения. Английский консультационный текст восстанавливает его так: «Я, Ездра, получил повеление от Господа на горе Хорив».'
    reason: source_lacuna
lexical_decisions:
- source_word: reprobauerunt me
  choice: они отвергли меня
  rationale: Латинское reprobaverunt выражает непринятие и отвержение; «отвергли» естественно и точно передаёт действие по отношению к говорящему.
- source_word: respuerunt mandatum domini
  choice: отринули повеление Господа
  rationale: Respuere буквально связано с выплёвыванием, а переносно означает решительно отвергать или отбрасывать. «Отринули» передаёт активное, сильное неприятие, не сводя его к внутреннему презрению.
- source_word: gentes
  choice: народы
  rationale: В данном обращении множественное gentes естественно передаётся как «народы»; это сохраняет коллективный и открыто адресный характер фразы.
theological_decisions:
- issue: Отсутствующее в предоставленном латинском источнике начало стиха
  choice: Не включать утверждение «Я, Ездра, получил повеление от Господа на горе Хорив», а обозначить неполное начало многоточием и пояснить его в сноске
  alternative: Восстановить начало по английскому консультационному тексту
  rationale: Предоставленный латинский текст начинается с зависимого оборота ut irem и не содержит имени Ездры, получения повеления или упоминания Хорива. Добавление этих слов в основной текст без представленного оригинального свидетельства нарушило бы требование переводить прежде всего по исходному тексту.
- issue: Сила выражения respuerunt mandatum domini
  choice: «отринули повеление Господа»
  alternative: «презрели повеление Господа»
  rationale: Латинский глагол описывает решительное отвержение, а не обязательно внутреннее чувство презрения; выбранный вариант сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. Синтаксическая незавершённость начала сохранена и явно обозначена, поскольку предоставленный латинский источник начинается с зависимого оборота. Двоеточие в конце сохраняет переход к последующей речи.
