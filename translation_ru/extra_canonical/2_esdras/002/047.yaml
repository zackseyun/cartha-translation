  text: 'tradit? Qui respondens dixit mihi: ipse est filius dei, quem in saeculo confessi sunt. ego autem magnificare eos coepi, qui'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/047.yaml
  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: ru
  text: 'Он сказал мне в ответ: «Он — Сын Божий, которого они исповедовали в мире».[a] Тогда я начал прославлять тех, кто…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Явное отождествление венчающей фигуры с «Сыном Божьим» обычно относят к позднейшей христианской редакционной прослойке этой главы; его не следует безоговорочно переносить на иудейский апокалипсис в главах 3–14.
    reason: compositional_layer
lexical_decisions:
- source_word: ipse est filius dei
  choice: Это Сын Божий
  rationale: Латинское ipse указывает на ранее названного венчающего; естественная русская идентификационная формула передаёт это без лишнего усиления.
- source_word: quem ... confessi sunt
  choice: которого они исповедовали
  rationale: Сохранено прямое значение confiteri — открыто признавать, исповедовать; объектом является Сын Божий.
- source_word: in saeculo
  choice: в этом веке
  rationale: Saeculum допускает значения «век», «мир», «земная жизнь». Буквальное «в этом веке» сохраняет эсхатологический оттенок и неоднозначность.
- source_word: magnificare eos coepi
  choice: я начал прославлять их
  rationale: Magnificare передано как «прославлять», а не «восхвалять», чтобы сохранить возвышенный регистр и структуру исходного текста.
theological_decisions:
- issue: Явное отождествление венчающей фигуры
  choice: Сын Божий
  alternative: Сын Бога
  rationale: Устойчивая и точная русская библейская формула; текст прямо называет фигуру filius dei, без смягчения христологического смысла.
- issue: Редакционный характер стиха
  choice: Отмечен в сноске как вероятная позднейшая христианская редакционная прослойка
  alternative: Не сопровождать историко-критическим пояснением
  rationale: Это существенная черта текстовой композиции главы, однако формулировка сноски не отрицает смысла стиха внутри его нынешней формы.
- issue: Оборванность предоставленного латинского источника
  choice: Сохранить незавершённость знаком многоточия
  alternative: Восполнить продолжение по английскому консультационному тексту
  rationale: Предоставленный латинский текст заканчивается на qui и не содержит слов о стойкости ради имени Господа; их нельзя вводить как будто они засвидетельствованы данным источником.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Перевод следует приведённому латинскому свидетельству. Поскольку источник обрывается после qui, конец фразы не восстановлен по английскому POB; незавершённость обозначена многоточием. Маркер сноски дан буквенным обозначением по требуемому формату.
