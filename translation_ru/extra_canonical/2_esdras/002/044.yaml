  text: Then I asked the angel and said, “Who are these, lord?”
translation:
  language: ru
  text: 'Тогда я спросил ангела: «Кто они, господин?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interrogaui angelum et dixi
  choice: я спросил ангела
  rationale: Латинская формула буквально означает «я спросил ангела и сказал», но в современном русском естественно и без потери смысла передаётся одним глаголом речи «спросил».
- source_word: qui sunt hi
  choice: кто они
  rationale: Естественная русская передача вопроса о группе присутствующих или видимых лиц; указательное hi передано контекстуальным местоимением «они».
- source_word: domine
  choice: господин
  rationale: Это уважительное обращение к ангелу. «Господин» сохраняет форму обращения и не добавляет отсутствующего в источнике притяжательного «мой»; строчная буква не отождествляет адресата с Богом.
theological_decisions:
- issue: Обращение domine к ангелу
  choice: господин
  alternative: Господи
  rationale: По контексту говорящий обращается к ангелу. «Господи» в современном русском преимущественно воспринимается как обращение к Богу и могло бы внести не выраженное источником богословское отождествление.
translation_notes:
  register: Современный литературный русский язык, сдержанный и понятный. Плеонастическая латинская формула речи сглажена, при этом вопрос и уважительное обращение сохранены.
