  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi primam sessionem in resurrectione mea. Pausa et quiesce,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/023.yaml
  text: and I will give you the first seat in my resurrection[23]. Pause and rest[a],
translation:
  language: ru
  text: и Я дам тебе первое место в Моём воскресении[a]. Покойся и пребывай в тишине,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первое сиденье в Моём воскресении». Вероятно, имеется в виду первое, то есть почётное, место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: primam sessionem
  choice: первое место
  rationale: Латинское выражение буквально означает «первое сиденье / первое место для сидения», но в данном контексте указывает прежде всего на почёт и первенство; «первое место» естественно передаёт оба оттенка.
- source_word: in resurrectione mea
  choice: в Моём воскресении
  rationale: Сохранена форма и неоднозначность латинского выражения без уточнения, идёт ли речь об участии в воскресении, времени воскресения или воскресении говорящего.
- source_word: Pausa et quiesce
  choice: Покойся и пребывай в тишине
  rationale: Позднелатинское pausare здесь означает покой, а quiescere добавляет оттенок тишины и безмятежности. Русская формулировка сохраняет параллельную пару повелений и эсхатологический тон.
theological_decisions:
- issue: Связь обещанного первого места с «Моим воскресением»
  choice: Сохранить буквальное «в Моём воскресении»
  alternative: «при воскресении, которое Я совершу» или «когда Я воскрешу мёртвых»
  rationale: Латинский текст допускает разные понимания, поэтому перевод не должен заранее определять субъект или характер воскресения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Моём» написано с прописной буквы как речь Бога. Завершающая запятая сохранена, поскольку фрагмент синтаксически продолжается в следующем стихе.
