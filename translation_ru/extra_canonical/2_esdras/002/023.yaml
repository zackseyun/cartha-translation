  terminology: «Воскресение» последовательно передаёт resurrectione. Прописная буква в «Моём» допустима для речи Бога в данном регистре. Сноска удачно поясняет буквальный образ «сиденья» и не превращает вероятное значение почёта в обязательное толкование.
