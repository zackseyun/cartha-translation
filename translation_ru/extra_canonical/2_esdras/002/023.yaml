  source_fidelity: 'Текст точно передаёт латинское tibi primam sessionem in resurrectione mea: «первое место» естественно выражает sessionem как почётное место/место для сидения, а «в Моём воскресении» сохраняет синтаксическую и смысловую неоднозначность оригинала. «Покойся и пребывай в тишине» адекватно передаёт пару Pausa et quiesce, где pausare в позднелатинском употреблении означает покой, а quiescere — пребывание в покое, тишине.'
