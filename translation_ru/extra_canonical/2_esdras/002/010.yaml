source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus ad Ezram: adnuntia populo meo, quoniam dabo eis regnum Hierusalem, quod daturus eram Israel.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: ru
  text: 'Так говорит Господь Ездре: «Объяви Моему народу, что Я дам им царство Иерусалима, которое собирался дать Израилю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntia
  choice: возвести
  rationale: Передаёт повелительное значение латинского глагола — торжественно и публично объявить — в естественном библейском регистре современного русского языка.
- source_word: populo meo
  choice: Моему народу
  rationale: Прямо сохраняет притяжательное выражение и коллективное значение латинского оригинала.
- source_word: regnum Hierusalem
  choice: царство Иерусалима
  rationale: Формально сохраняет неоднозначную конструкцию оригинала, не сводя её ни к городу Иерусалиму, ни к царству с центром в Иерусалиме.
- source_word: quod daturus eram
  choice: которое намеревался дать
  rationale: Передаёт перифрастическую конструкцию с оттенком прежнего намерения; русское «собирался дать» было бы разговорнее, а «должен был дать» могло бы привнести значение обязательства.
- source_word: Israel
  choice: Израилю
  rationale: Сохраняет форму адресата в единственном числе и не уточняет, имеется ли в виду народ или иное значение имени.
theological_decisions:
- issue: Соотношение выражений «Мой народ» и «Израиль»
  choice: Сохранить их как отдельные обозначения без пояснения
  alternative: Отождествить их или явно противопоставить друг другу
  rationale: Латинский текст оставляет характер их соотношения неразъяснённым; перевод не должен устранять эту богословскую напряжённость.
- issue: Значение «царства Иерусалима»
  choice: Сохранить родительную конструкцию
  alternative: Перевести как «Иерусалимское царство» или «царство в Иерусалиме»
  rationale: Такие альтернативы конкретизировали бы смысл сверх того, что выражено в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы речь оставалась ясной, при сохранении смысловой неоднозначности оригинала.
