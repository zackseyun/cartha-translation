  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: ru
  text: Примите от Господа радость вашей славы и радуйтесь, воздавая благодарность Тому, Кто призвал вас в небесные царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domini accipite
  choice: примите от Господа
  rationale: Передаёт значение получения дара от Господа естественным современным русским языком; формулировка согласована с более полным контекстом стиха, отражённым в проверенном консультационном слое.
- source_word: iocundamini
  choice: радуйтесь
  rationale: Прямой и стилистически естественный эквивалент латинского призыва к радости.
- source_word: gratias agentes
  choice: благодаря
  rationale: Деепричастная конструкция сохраняет сопутствующее действие и не утяжеляет фразу.
- source_word: ei qui uos ad [caelestia regna vocavit]
  choice: Того, Кто призвал вас в небесные царства
  rationale: Сохраняет личное обращение благодарности и множественное число regna; окончание восстанавливается по полному тексту традиции и аудированному английскому слою, поскольку предоставленная латинская строка обрывается на ad.
theological_decisions:
- issue: Характер обещанного удела
  choice: небесные царства
  alternative: Небесное Царство
  rationale: Множественное число сохраняет форму латинского regna и не сводит её без необходимости к привычной конфессионально окрашенной формуле.
- issue: Содержание принимаемого дара
  choice: радость вашей славы
  alternative: вверенный дар Господа
  rationale: Выбрано чтение, засвидетельствованное проверенным консультационным слоем и последней текстовой ревизией; оно сохраняет связь радости со славой адресатов, не вводя идею вверенного имущества.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «радость… радуйтесь» сохранён как смысловая риторическая фигура; прописные буквы в местоименно-относительном обозначении Бога поддерживают принятый русский религиозный регистр.
