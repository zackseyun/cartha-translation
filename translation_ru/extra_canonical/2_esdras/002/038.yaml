  text: Он призвал вас к небесным царствам.[a] Встаньте и стойте, посмотрите на число…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небесные царства»; в латинском тексте — множественное число. Дополнение «вас» прямо не выражено в данном фрагменте, но подразумевается по контексту последующего обращения во множественном числе.'
    reason: Сохраняет форму множественного числа источника и прозрачно отмечает контекстуально восстановленное дополнение.
lexical_decisions:
- source_word: caelestia regna
  choice: небесные царства
  rationale: Сохранено множественное число латинского regna; выражение передано естественно по-русски и без сведения его к единственному числу.
- source_word: uocauit
  choice: призвал вас в
  rationale: В данном контексте vocare обозначает призвание к небесной участи; местоимение «вас» восстанавливает подразумеваемый объект и делает усечённую начальную фразу понятной по-русски.
- source_word: Surgite et state
  choice: Поднимитесь, встаньте
  rationale: Сохранена последовательность двух повелений, хотя их значения близки.
- source_word: uidete numerum
  choice: посмотрите на число
  rationale: Передано буквально и с сохранением незавершённости фразы, продолжающейся в следующем текстовом сегменте.
theological_decisions:
- issue: Число в выражении caelestia regna
  choice: 'Сохранено множественное число: «небесные царства»'
  alternative: «небесное Царство»
  rationale: Латинский текст имеет форму множественного числа regna; нормализация к привычному богословскому выражению в единственном числе необоснованно устранила бы особенность источника.
translation_notes:
