  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: ru
  text: сыновей твоих. Защищай права вдовы, верши суд ради подопечного, давай нуждающемуся, оберегай сироту, одевай нагого, заботься о сокрушённом, немощном и хромом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок начинается словами, завершающими предыдущее высказывание («сыновей твоих»), и оканчивается словом «хромом»; в переводе последнее слово грамматически присоединено к повелению «заботься».
    reason: Поясняет фрагментарные границы исходного текста и синтаксическое присоединение заключительного аккузатива, не скрывая состояния источника.
lexical_decisions:
- source_word: Viduam iustifica
  choice: Защищай права вдовы
  rationale: 'Латинское iustifica здесь имеет судебно-правовой смысл: добиваться справедливости для вдовы, а не объявлять её праведной.'
- source_word: pupillo iudica
  choice: верши суд ради сироты
  rationale: Сохранён судебный образ и направленность действия в пользу беззащитного сироты, без чрезмерного уточнения характера разбирательства.
- source_word: egenti da
  choice: давай нуждающемуся
  rationale: Прямой и естественный эквивалент повеления; egens обозначает человека, испытывающего нужду.
- source_word: orfanum tuere
  choice: оберегай оставшегося без отца
  rationale: Так передано близкое к pupillus, но отдельно названное уязвимое лицо; различие между двумя латинскими обозначениями не устранено полным повтором слова «сирота».
- source_word: nudum uesti
  choice: одевай нагого
  rationale: Сохранены конкретность и лаконичная форма исходного повеления.
- source_word: Confractum
  choice: сокрушённом
  rationale: Confractus может указывать как на физически надломленного, так и на подавленного человека; «сокрушённый» сохраняет эту широту.
- source_word: debilem
  choice: немощном
  rationale: Передаёт слабость или ограниченность состояния без навязывания конкретного диагноза.
- source_word: claudum
  choice: хромом
  rationale: Обычное и точное обозначение человека, имеющего затруднение при ходьбе.
theological_decisions:
- issue: Смысл iustifica применительно к вдове
  choice: Защищай права вдовы
  alternative: Оправдай вдову
  rationale: Контекст перечня обязанностей перед уязвимыми людьми и соседнее iudica поддерживают правовой смысл; перевод «оправдай» мог бы ошибочно вызвать догматические ассоциации.
- issue: Соотношение pupillus и orfanus
  choice: сирота / оставшийся без отца
  alternative: сирота / сирота
  rationale: Исходный текст употребляет два близких, но разных слова; перевод сохраняет их различимость, не утверждая жёсткого технического разграничения.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Сохранена цепь кратких повелений и социально-правовая направленность текста; редкие или конфессионально нагруженные формулы не использованы.
