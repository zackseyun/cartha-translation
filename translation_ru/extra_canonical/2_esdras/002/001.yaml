id: 2ES.2.1
reference: 2 Esdras 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my servants the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: ru
  text: 'Так говорит Господь: «Я вывел этот народ из рабства и дал ему заповеди через Моих слуг — пророков, которых они не захотели слушать, но свели на нет Мои замыслы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделали тщетными Мои советы».'
    reason: Латинское consilia допускает значения «замыслы», «решения» и «советы»; основной текст выбирает наиболее естественное здесь «замыслы», сохраняя альтернативу.
lexical_decisions:
- source_word: seruitute
  choice: рабства
  rationale: Прямое и естественное соответствие латинскому существительному servitus в контексте освобождения народа.
- source_word: pueros meos prophetas
  choice: Моих слуг — пророков
  rationale: Puer при обозначении состоящего на службе лица имеет значение «слуга»; приложение «пророков» сохранено и ясно связывает относительное quos именно с пророками.
- source_word: audire noluerunt
  choice: не захотели слушать
  rationale: Передаёт не просто отсутствие слышания, а сознательное нежелание внимать пророкам.
- source_word: irrita fecerunt mea consilia
  choice: свели на нет Мои замыслы
  rationale: Сохраняет активную конструкцию irrita fecerunt («сделали недействительными, тщетными») и передаёт consilia как Божьи намерения или решения, не превращая их в заповеди.
theological_decisions:
- issue: Возможность людей «свести на нет» Божьи замыслы
  choice: Сохранить сильную формулировку источника без богословского смягчения
  alternative: «Отвергли Мои наставления»
  rationale: Латинское irrita fecerunt mea consilia выражает именно действие, сделавшее Божьи consilia тщетными или недейственными в данном отношении; замена на «отвергли» устранила бы заложенное в тексте богословское напряжение.
- issue: Статус пророков в выражении pueros meos
  choice: «Моих слуг»
  alternative: «Моих рабов»
  rationale: В данном латинском контексте puer — обычное обозначение слуги или служителя. «Рабов» неоправданно усилило бы социально-правовой оттенок и опиралось бы не на предоставленный латинский текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксическая связь quos с «пророками» сохранена посредством «которых», а местоимение «они» естественно возвращает к собирательному «народ». Прямая речь оформлена кавычками; прописные местоимения, относящиеся к Богу, выдержаны последовательно.
