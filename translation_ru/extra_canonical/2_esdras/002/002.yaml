  yaml_path: translation/extra_canonical/2_esdras/002/002.yaml
  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: ru
  text: 'Мать, родившая их, говорит им: «Идите, дети, потому что я вдова и оставлена».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater, quae eos generauit
  choice: Мать, родившая их
  rationale: Точно передаёт значение латинского оборота и сохраняет связь с упомянутыми ранее детьми.
- source_word: ite, filii
  choice: Идите, дети
  rationale: Передаёт повелительное ite и обращение filii без добавления отсутствующего в источнике притяжательного местоимения «мои».
- source_word: uidua sum et derelicta
  choice: я вдова и оставлена
  rationale: Сохраняет два параллельных состояния исходного текста; «оставлена» естественно передаёт derelicta и не уточняет, кем именно она оставлена.
