  yaml_path: translation/extra_canonical/2_esdras/002/019.yaml
  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: ru
  text: и столько же источников, текущих молоком и мёдом, и семь огромных гор, на которых растут розы и лилии[a], среди которых Я наполню ваших детей радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имеющих розу и лилию»; единственное число, вероятно, употреблено собирательно.'
    reason: Поясняет формальную структуру и собирательное значение латинского rosam et lilium, переданного в основном тексте естественным русским множественным числом.
lexical_decisions:
- source_word: totidem
  choice: столько же
  rationale: Сохраняет соотнесённость с количеством, названным в предыдущем контексте.
- source_word: fontes fluentes lac et mel
  choice: источников, текущих молоком и мёдом
  rationale: Прямо передаёт образ источников, из которых текут молоко и мёд, в естественной русской форме.
- source_word: montes inmensos septem
  choice: семь огромных гор
  rationale: Inmensos означает чрезвычайную величину; «огромных» звучит современно и достойно.
- source_word: habentes rosam et lilium
  choice: поросших розами и лилиями
  rationale: Буквально горы «имеют розу и лилию»; русское «поросших» естественно выражает наличие на горах растущих цветов, а множественное число передаёт собирательное употребление латинского единственного.
- source_word: gaudio replebo
  choice: наполню ... радостью
  rationale: Сохраняет метафору наполнения и порядок смысловых компонентов латинского выражения.
theological_decisions:
- issue: Связь относительного оборота in quibus с местом исполнения радостью
  choice: Там Я наполню ваших детей радостью
  alternative: на которых Я наполню ваших детей радостью
  rationale: In quibus грамматически относится к горам и буквально означает «в/на которых». Отдельное «там» сохраняет локальный смысл, но избегает неестественного русского оборота «на горах наполню радостью».
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской образностью. Начальное строчное «и» отражает продолжение предложения из предыдущего стиха. Стоящее в начале предоставленного латинского отрывка fructibus синтаксически относится к предшествующему контексту и вслед за принятой сегментацией английского POB не включено в этот стих.
