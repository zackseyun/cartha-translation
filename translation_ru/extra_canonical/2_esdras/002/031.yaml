  text: latibulis terrae et misericordiam cum illis faciam, quoniam misericors sum, dicit dominus omnipotens. Amplectere natos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/031.yaml
  text: and I will show mercy to them, because I am merciful, says the Lord Almighty.
translation:
  language: ru
  text: И Я явлю им милость, потому что Я милосерден, — говорит Господь Вседержитель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam cum illis faciam
  choice: Я явлю им милость
  rationale: Латинское выражение буквально означает «сотворю/окажу милость с ними»; по-русски естественно и точно передаётся как «явлю им милость».
- source_word: quoniam misericors sum
  choice: потому что Я милосерден
  rationale: Сохраняет прямое обоснование милости качеством самого Бога и естественно звучит на современном литературном русском.
- source_word: dominus omnipotens
  choice: Господь Вседержитель
  rationale: «Вседержитель» — укоренившийся в русской библейской речи эквивалент латинского omnipotens, выражающий Божье всемогущество и верховную власть.
theological_decisions:
- issue: Связь Божьего действия с Его милосердной природой
  choice: Сохранена причинная формулировка «потому что Я милосерден»
  alternative: «ибо Я милостив»
  rationale: «Милосерден» непосредственно соответствует misericors и сохраняет смысловую связь с misericordiam, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Местоимение «Я» написано с прописной буквы как реплика Бога. Начальное «И» сохранено, поскольку латинское et связывает фразу с предшествующим контекстом; фрагменты «latibulis terrae» и «Amplectere natos» относятся к соседним стиховым единицам и в текст стиха не включены.
