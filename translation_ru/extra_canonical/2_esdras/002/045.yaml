  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: ru
  text: 'Он ответил мне: «Это те, кто сняли с себя смертное одеяние и облеклись в бессмертное одеяние, исповедали имя Бога. Теперь их венчают, и они получают пальмовые ветви».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam deposuerunt
  choice: снял с себя смертное одеяние
  rationale: Сохраняет метафору снятия смертной одежды; «одеяние» звучит естественнее и достоиннее буквального «туника» в данном образном контексте.
- source_word: inmortalem sumpserunt
  choice: облачился в бессмертное
  rationale: Передаёт противопоставление смертного и бессмертного одеяния, не добавляя отсутствующего в латинском существительного.
- source_word: confessi sunt nomen dei
  choice: исповедал имя Бога
  rationale: «Исповедал» сохраняет религиозный смысл открытого признания верности имени Бога.
- source_word: coronantur
  choice: их венчают
  rationale: Сохраняет пассивную форму настоящего времени и образ награждения венцом.
- source_word: accipiunt palmas
  choice: вручают им пальмовые ветви
  rationale: В контексте награждения palmas обозначает пальмовые ветви как знаки победы; формулировка ясна современному читателю и сохраняет символический образ.
theological_decisions:
- issue: Образ перехода от смертности к бессмертию
  choice: сохранена метафора снятия смертного одеяния и облачения в бессмертное
  alternative: истолковать как буквальную смерть и воскресение
  rationale: Источник выражается образно и не уточняет момент или механизм перехода; перевод не должен устранять эту смысловую открытость.
- issue: Неуказанный деятель в coronantur
  choice: пассивное «их венчают»
  alternative: «Бог венчает их»
  rationale: Латинский текст не называет совершающего действие, поэтому субъект не добавлен.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Метафорический параллелизм и настоящее время заключительных действий сохранены.
