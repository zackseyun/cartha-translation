  text: Wherever you find the dead, mark them and commit them to the grave, and I will give
translation:
  language: ru
  text: Где бы ты ни нашёл мёртвых, отметь их и предай погребению, и Я дам…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mortuos
  choice: мёртвых
  rationale: Субстантивированное прилагательное во множественном числе передаёт умерших людей без добавления отсутствующего в источнике уточнения.
- source_word: ubi inueneris
  choice: где бы ты ни нашёл
  rationale: Обобщённо-условная конструкция естественно передаёт латинское ubi с конъюнктивом перфекта и сохраняет обращение к одному адресату.
- source_word: signans
  choice: отметь их
  rationale: Латинское signans буквально связано с нанесением знака; императивная передача по-русски естественно согласуется с последующим commenda. Местоимение «их» добавлено только ради ясности объекта.
- source_word: commenda sepulchro
  choice: предай погребению
  rationale: Передаёт поручение умерших могиле идиоматичным и достойным русским выражением, не сводя смысл к простому перемещению тела.
- source_word: et dabo
  choice: и Я дам…
  rationale: Сохранён незавершённый переход к продолжению следующего стиха; заглавная «Я» обозначает говорящего Бога в принятой русской библейской орфографии.
theological_decisions:
- issue: Значение signans
  choice: отметь их
  alternative: осени их знаком
  rationale: Источник не называет ни самого знака, ни обряда; нейтральная формулировка сохраняет эту неопределённость и не привносит конфессионального толкования.
- issue: Незавершённое et dabo
  choice: и Я дам…
  alternative: опустить как начало следующего предложения
  rationale: Слова входят в предоставленный текст стиха, поэтому они сохранены; многоточие ясно показывает синтаксическую незавершённость фрагмента.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка лаконична и следует границам данного латинского фрагмента, не восстанавливая отсутствующее продолжение.
