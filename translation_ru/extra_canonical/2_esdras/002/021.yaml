  text: inridere noli, tutare mancum et caecum ad uisionem claritatis meae admitte, Senem et iuuenem intra muros tuos serua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: ru
  text: Не насмехайся; оберегай увечного и допусти слепого к созерцанию славы Моей. Храни старика и юношу внутри стен твоих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inridere noli
  choice: Не насмехайся
  rationale: Прямо передаёт запрет; объект в данном латинском отрывке не выражен явно, поэтому он не добавлен.
- source_word: tutare mancum
  choice: защищай увечного
  rationale: Tutare означает «защищай, оберегай»; mancus — человека с физическим увечьем или недостатком. «Увечный» сохраняет широту значения лучше, чем более узкое «хромой».
- source_word: caecum ... admitte
  choice: слепого допусти
  rationale: Сохраняет единственное число и прямую синтаксическую связь caecum с admitte.
- source_word: ad uisionem claritatis meae
  choice: созерцать славу Мою
  rationale: Claritas в религиозном контексте естественно передаётся как «слава», а ad visionem — как допущение к её видению или созерцанию.
- source_word: Senem et iuuenem
  choice: Старого и молодого
  rationale: Передаёт парное обозначение людей обоих возрастов без добавления существительных, отсутствующих в источнике.
- source_word: intra muros tuos serua
  choice: храни в стенах твоих
  rationale: Формально сохраняет образ защищённого пространства внутри городских стен и повелительное serua.
theological_decisions:
- issue: Видение Божьей славы
  choice: «допусти созерцать славу Мою»
  alternative: «допусти к видению сияния Моего»
  rationale: Выбрана естественная библейская формулировка без уточнения характера или времени этого видения; тем самым сохраняется богословская открытость латинского выражения.
- issue: Неуказанный объект запрета насмехаться
  choice: Объект не добавлен
  alternative: «Не насмехайся над увечным»
  rationale: В предоставленном тексте после inridere noli объект отсутствует. Хотя контекст и история границ стиха позволяют предполагать объект, перевод не должен молча вносить его в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис близок к латинскому, но остаётся понятным; заглавная буква в «Мою» отмечает речь Бога по принятой русской библейской традиции.
