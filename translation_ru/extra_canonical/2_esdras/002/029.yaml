source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mater, cum filiis tuis, quia ego te eripiam, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/029.yaml
  text: Mother, with your children, because I will deliver you, says the Lord.
translation:
  language: ru
  text: Мать, вместе с твоими детьми, ибо Я избавлю тебя, — говорит Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mater
  choice: Мать
  rationale: Сохранено прямое обращение к матери без добавления отсутствующего в латинском тексте глагола.
- source_word: cum filiis tuis
  choice: вместе с твоими детьми
  rationale: Естественно передаёт совместность; латинское filiis может обозначать детей независимо от пола.
- source_word: eripiam
  choice: избавлю
  rationale: Передаёт обещание спасти или вырвать из беды, не уточняя не названную в тексте опасность.
- source_word: dicit dominus
  choice: говорит Господь
  rationale: Традиционная и ясная формула пророческой речи.
theological_decisions:
- issue: Синтаксическая неполнота обращения
  choice: Не добавлять сказуемое перед «Мать»
  alternative: Добавить «радуйся» или иной повелительный глагол
  rationale: В предоставленном латинском тексте такого глагола нет; добавление устранило бы реальную неполноту и внесло бы неподтверждённый смысл.
- issue: Адресат обещания в форме te
  choice: «тебя» в единственном числе
  alternative: «вас» — мать и детей
  rationale: Латинское te грамматически указывает на мать как на адресата, хотя дети упомянуты вместе с ней.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Необычная фрагментарность исходной фразы сохранена; тире перед формулой речи помогает естественному русскому чтению, не добавляя содержания.
