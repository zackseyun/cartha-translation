source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: ru
  text: Другие будут плакать и скорбеть, а ты будешь радостна и будешь жить в изобилии[a]. Народы будут завидовать тебе и ничего не смогут сделать против тебя, — говорит Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а ты будешь радостна и изобильна».'
    reason: Отмечает буквальную прилагательную форму copiosa и сохраняет возможность более широкого понимания изобилия.
lexical_decisions:
- source_word: alii
  choice: другие
  rationale: Прямо передаёт неопределённое множественное число и сохраняет противопоставление адресату во второй части фразы.
- source_word: plorabunt et tristes erunt
  choice: будут плакать и скорбеть
  rationale: 'Передаёт оба согласованных элемента: внешний плач и внутреннюю печаль; «скорбеть» естественнее буквального «быть печальными» в данном возвышенном контексте.'
- source_word: hilaris
  choice: радостна
  rationale: Сохраняет женский род обращения и значение радости, бодрости.
- source_word: copiosa
  choice: будешь жить в изобилии
  rationale: Латинское прилагательное буквально означает «обильная, богатая»; глагольная конструкция звучит естественнее по-русски и передаёт состояние достатка, не уточняя его природу.
- source_word: Zelabunt
  choice: будут завидовать
  rationale: В данном контексте латинский глагол выражает зависть народов к благополучию адресата.
- source_word: nihil aduersus te poterunt
  choice: ничего не смогут сделать против тебя
  rationale: Естественно раскрывает подразумеваемое действие при латинском posse и сохраняет направленность враждебности.
theological_decisions:
- issue: Личность адресата, обозначенного формами женского рода hilaris и copiosa
  choice: сохранено обращение в женском роде без пояснения личности адресата
  alternative: явно назвать Сион, Иерусалим или общину
  rationale: В самом стихе адресат не назван; явное отождествление внесло бы толкование сверх исходного текста.
- issue: Характер обещанного изобилия
  choice: «жить в изобилии» без уточнения
  alternative: «будешь богата» или указание на материальное/духовное процветание
  rationale: Copiosa допускает широкий смысл полноты и достатка; перевод не должен искусственно ограничивать его материальной либо духовной сферой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Женский род обращения сохранён по латинскому тексту; синтаксис сделан естественным для обычного читателя.
