  to: потому что вы согрешили пред Господом Богом и сделали злое предо мной. Но теперь что мне сделать для вас? Ведь я вдова и оставлена. Идите, дети мои, и просите у Господа.
  rationale: 'Исправлены три смысловые неточности: устранено невыраженное «всеми», восстановлено значение дательного uobis («для вас») и передан предлог a в petite a domino без добавления объекта просьбы. «Сделали злое» сохраняет смысл quod malum est, не вводя дополнительного толкования.'
