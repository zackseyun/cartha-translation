source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: ru
  text: потому что вы согрешили пред Господом Богом и сделали злое предо мной. Но теперь что мне сделать для вас? Ведь я вдова и оставлена. Идите, дети мои, и просите у Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: пред Господом Богом
  rationale: Сохраняет судебно-нравственный оттенок латинского coram и звучит достойно в современном русском библейском повествовании.
- source_word: quod malum est coram me fecistis
  choice: сделали зло предо мной
  rationale: Передаёт буквальное различие между грехом пред Богом и злом, совершённым перед говорящей; не устраняет возможное значение причинённого ей зла.
- source_word: quid faciam uobis?
  choice: что мне делать с вами?
  rationale: Русское «с вами» естественно передаёт дательный uobis в данном вопросе, сохраняя неоднозначность между помощью и дальнейшим обращением с адресатами.
- source_word: uidua sum et derelicta
  choice: я вдова, оставленная всеми
  rationale: «Оставленная всеми» естественно выражает derelicta как состояние покинутости и сохраняет эмоциональную силу фразы.
- source_word: petite a domino
  choice: просите Господа
  rationale: Не добавляет отсутствующий в источнике объект вроде «милости». Русская конструкция сохраняет эллиптичность латинского выражения, хотя допускает понимание Господа как адресата просьбы.
theological_decisions:
- issue: Неуказанный предмет просьбы в petite a domino
  choice: просите Господа
  alternative: просите у Господа
  rationale: Предмет просьбы в латинском тексте не назван. Выбранный вариант следует аудированной редакции и не вводит «милость» или иной богословски значимый объект; исходная конструкция сама допускает некоторую синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Архаизирующее «пред» сохранено как естественная формула сакрального регистра; прочая лексика современна и понятна.
