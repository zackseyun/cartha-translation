review_pass:
  verdict: revise
  source_fidelity: 'Требуется правка. «Оставленная всеми» добавляет отсутствующее в латинском тексте «всеми». «Что мне делать с вами?» меняет направленность dativus uobis: в контексте исходника это «что мне сделать для вас?», а не вопрос о том, как поступать с адресатами. В petite a domino предлог a обозначает источник/адресата просьбы («у Господа»), при этом предмет просьбы остаётся невыраженным.'
  naturalness: После исправления текст звучит как современный литературный русский с умеренным библейским регистром. «Пред» уместно в данном регистре; «просите у Господа» естественно передаёт эллиптическую конструкцию.
  terminology: «Господь Бог», «согрешили», «злое», «вдова» передают исходные понятия без конфессиональных добавлений. Местоимение «мной» остаётся со строчной буквы, поскольку говорящая в данном фрагменте называет себя вдовой, а не отождествляется в тексте с Богом.
  issues:
  - severity: medium
    issue: Добавлено слово «всеми» в «оставленная всеми».
    rationale: Латинское derelicta означает «оставлена/покинута», но не уточняет, кем именно; добавление сужает и усиливает смысл.
  - severity: medium
    issue: «Что мне делать с вами?» неточно передаёт quid faciam uobis.
    rationale: Дательный uobis в этой реплике означает «для вас», тогда как русское «с вами» означает обращение с кем-либо и меняет смысл вопроса.
  - severity: medium
    issue: «Просите Господа» не передаёт предлог a в petite a domino.
    rationale: Petere a domino значит просить у Господа; объект просьбы в оригинале опущен и не должен добавляться.
  revised_text: потому что вы согрешили пред Господом Богом и сделали злое предо мной. Но теперь что мне сделать для вас? Ведь я вдова и оставлена. Идите, дети мои, и просите у Господа.
