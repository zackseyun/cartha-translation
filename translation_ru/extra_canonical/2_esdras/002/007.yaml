  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: ru
  text: Да прекратится их род.[a] Пусть они будут рассеяны среди народов, и пусть их имена будут стёрты с лица земли, потому что они презрели Мой завет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся латинский текст буквально: «Да будет их род». По контексту проклятия формулировка, вероятно, повреждена или неполна; смысл понимается как прекращение рода.'
    reason: Необходимо обозначить реальное расхождение между буквальной формой дошедшего латинского текста и вероятным смыслом в контексте.
lexical_decisions:
- source_word: generatio eorum
  choice: их род
  rationale: Здесь generatio обозначает потомство или продолжающийся род; «род» естественно по-русски передаёт как потомков, так и продолжение родовой линии.
- source_word: Dispergantur in gentes
  choice: Пусть они будут рассеяны среди народов
  rationale: Сохранены пассивность латинской формы и значение распределения между различными народами.
- source_word: nomina eorum deleantur a terra
  choice: пусть их имена будут стёрты с лица земли
  rationale: «Стереть с лица земли» — естественная торжественная формула, передающая полное исчезновение памяти и присутствия; она не сводит множественное nomina к коллективному единственному числу.
- source_word: spreuerunt testamentum meum
  choice: они отвергли Мой завет
  rationale: Spernere означает презрительно отвергать, пренебрегать; «отвергли» ясно передаёт сознательный отказ, а testamentum в библейском контексте — «завет».
theological_decisions:
- issue: Смысл начального пожелания при повреждённой или неполной латинской формулировке
  choice: Да прекратится их род
  alternative: Да будет их род
  rationale: Сохранившееся generatio eorum fiat буквально имеет положительную форму («да будет их род»), которая противоречит последовательности проклятий в следующих предложениях. Перевод передаёт наиболее вероятный контекстуальный смысл, но текстовая трудность открыто отмечена в сноске.
- issue: Отношение к завету
  choice: отвергли Мой завет
  alternative: презрели Мой завет
  rationale: «Отвергли» сохраняет идею сознательного неприятия и звучит естественнее в современном русском; оттенок презрения в spernere не превращён в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Повтор «пусть» сохраняет последовательность повелительно-пожелательных форм. Прописная буква в «Мой» обозначает речь Бога согласно русской издательской традиции.
