  verdict: approve
  source_fidelity: «Чтобы Ты предал их позору, а их мать — разграблению, чтобы не» точно передаёт латинское «Ut des eis confusionem et matrem eorum in direptionem, ne». «Предал ... позору» адекватно выражает des ... confusionem, а «предал ... разграблению» естественно передаёт in direptionem. Незавершённость «чтобы не» верно сохраняет зависимость от продолжения в следующем стихе.
  naturalness: Фраза звучит естественно в современном литературном русском с уместной библейской торжественностью. Тире корректно заменяет повтор глагола и не меняет синтаксических отношений.
  terminology: «Позор» соответствует confusionem в значении публичного посрамления. «Их мать» намеренно сохраняет образную и референциальную неопределённость matrem eorum, не подменяя её толкованием. «Разграбление» точно передаёт direptio.
