  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusionem
  choice: позору
  rationale: В данном контексте латинское confusionem обозначает постыжение, бесчестье; «позор» естественно передаёт этот смысл по-русски.
- source_word: matrem eorum
  choice: их мать
  rationale: Сохранён буквальный и потенциально образный оборот источника без преждевременного уточнения, кого именно обозначает «мать».
- source_word: in direptionem
  choice: разграблению
  rationale: Конструкция с in выражает отдачу или предание на разграбление; дательный падеж после «предал» передаёт её естественно.
- source_word: ne
  choice: чтобы не
  rationale: Сохранена незавершённая отрицательная целевая конструкция, продолжающаяся в следующем стихе.
theological_decisions:
- issue: Образ «их матери»
  choice: Сохранить «их мать» без толкования
  alternative: Заменить на «их город» или пояснить образ в тексте
  rationale: Латинский текст оставляет референт образа неуточнённым; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Конечное «чтобы не» намеренно оставлено незавершённым в соответствии с границей стиха и латинским ne.
