  yaml_path: translation/extra_canonical/2_esdras/002/011.yaml
  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: ru
  text: И Я возьму Себе их славу[a] и дам им вечные шатры,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «славу тех». Латинские слова, переведённые как «их» и далее «им», могут обозначать разные группы.'
    reason: Сохраняет возможное различие референтов illorum и eis, не разрешая контекстуальную неоднозначность в основном тексте.
lexical_decisions:
- source_word: sumam mihi
  choice: возьму Себе
  rationale: Передаёт возвратное значение mihi и сохраняет торжественную, но естественную русскую формулировку.
- source_word: gloriam illorum
  choice: их славу
  rationale: Gloria передано обычным библейским словом «слава»; illorum — местоимением «их», без искусственного уточнения референта в основном тексте. Возможное отличие этой группы от обозначенной далее словом eis отмечено в сноске.
- source_word: tabernacula aeterna
  choice: вечные обители
  rationale: «Обители» естественно обозначает постоянные места пребывания и в данном контексте лучше сочетается с aeterna, чем буквальное «шатры»; образное значение tabernacula указано в сноске.
theological_decisions:
- issue: Соотносятся ли illorum («их») и eis («им») с одной и той же группой людей
  choice: 'В основном тексте референты не уточняются: «их… им»'
  alternative: «славу тех, а им дам» — если местоимения относятся к разным группам
  rationale: Латинский текст использует разные местоименные формы, причём illorum может указывать на более удалённый антецедент, однако один этот стих не устраняет неоднозначности. Поэтому она сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм латинского оригинала сохранён; конечная запятая оставлена в соответствии с тем, что предложение продолжается в следующем стихе.
