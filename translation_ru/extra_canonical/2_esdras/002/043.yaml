  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: ru
  text: А посреди них стоял юноша высокого роста, возвышавшийся над всеми остальными. Он возлагал венцы на голову каждому из них и возвышался ещё более; я же был охвачен изумлением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  choice: юноша
  rationale: Прямое и естественное соответствие латинскому обозначению молодого мужчины.
- source_word: statura celsus
  choice: высокого роста
  rationale: Передаёт физическую высоту естественным современным русским выражением.
- source_word: eminentior omnibus illis
  choice: возвышавшийся над всеми остальными
  rationale: Сохраняет сравнительное значение и допускает сочетание пространственного и величественного оттенков.
- source_word: singulis eorum capitibus inponebat coronas
  choice: возлагал венцы на голову каждому из них
  rationale: 'Идиоматическое русское распределительное соответствие: латинское capitibus стоит во множественном числе, тогда как по-русски при «каждому» естественно единственное «на голову».'
- source_word: magis exaltabatur
  choice: становился ещё более величественным
  rationale: Сохраняет усиление magis и медиально-пассивную динамику exaltabatur, не сводя выражение лишь к физическому росту.
- source_word: miraculo tenebar
  choice: был охвачен изумлением
  rationale: Естественно передаёт образ состояния, которое удерживает или охватывает рассказчика.
theological_decisions:
- issue: Значение exaltabatur применительно к юноше
  choice: становился ещё более величественным
  alternative: возвышался ещё больше
  rationale: Выбран вариант, сохраняющий нарастающее возвышение фигуры, но не утверждающий однозначно ни физическое увеличение роста, ни богословское прославление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Возлагал венцы» сохраняет торжественность сцены; синтаксис разделён на два предложения для ясности без утраты последовательности оригинала.
