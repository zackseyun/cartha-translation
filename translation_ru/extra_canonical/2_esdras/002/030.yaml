  text: Remember your sleeping children, for I will bring them out from the hidden places of the earth,
translation:
  language: ru
  text: Помни о своих уснувших детях, ведь Я выведу их из сокровенных мест земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный латинский отрывок обрывается на предлоге de («из»); слова «сокровенных мест земли» передают продолжение фразы, засвидетельствованное в предоставленном английском контрольном тексте.
    reason: Уточняет основание для перевода слов, отсутствующих в приведённом латинском фрагменте.
lexical_decisions:
- source_word: Filios tuos
  choice: своих… детях
  rationale: Latin filii can denote sons or children; in this address the inclusive Russian «детях» is natural and does not unnecessarily restrict the referent to males.
- source_word: dormientes
  choice: уснувших
  rationale: The participle literally denotes those sleeping and may function as a reverent reference to the dead. «Уснувших» preserves both the image and its theological resonance without replacing it with the interpretive «умерших».
- source_word: memorare
  choice: Помни о
  rationale: The imperative is rendered directly; Russian «помни о» is idiomatic with persons and retains the continuing force of remembrance.
- source_word: quoniam
  choice: ведь
  rationale: Introduces the reason for the command in natural, dignified modern Russian.
- source_word: ego eos educam
  choice: Я выведу их
  rationale: Educere means to lead or bring out. «Выведу» preserves the agentive image, while capitalizing «Я» follows standard Russian reverential usage for divine self-reference.
- source_word: de
  choice: из
  rationale: The surviving supplied excerpt ends with this preposition; «из» appropriately marks movement out from an interior or concealed location.
theological_decisions:
- issue: Whether «sleeping» should be interpreted explicitly as death
  choice: уснувших
  alternative: умерших
  rationale: The translation retains the source metaphor and its possible resurrection implication rather than resolving it into an explicit doctrinal interpretation.
- issue: Nature of the promised action
  choice: выведу
  alternative: воскрешу
  rationale: The Latin speaks of bringing or leading out, not explicitly of raising from the dead. The less interpretive wording preserves the text’s imagery and theological tension.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. «Уснувших» сохраняет образность оригинала; «сокровенных мест» звучит естественнее, чем буквальное пространственное выражение, и соответствует консультационному слою.
