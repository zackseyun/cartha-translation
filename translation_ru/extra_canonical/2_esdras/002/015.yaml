    rationale: Хотя «растить детей» нормативно, форма повелительного наклонения «расти» совпадает с непереходным «расти» и в изолированном стихе может восприниматься не как ясное обращение к матери. «Воспитывай их» безопасно и естественно передаёт educa («взращивай/воспитывай»).
