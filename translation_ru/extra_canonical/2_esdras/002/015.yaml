  source_fidelity: 'Смысл латинского текста в целом передан точно: сохранены обращение к матери, три повеления, образ голубки, буквальные «стопы» и причинное обоснование избрания Господом. Однако русское повелительное «расти их» может быть ошибочно прочитано как повеление детям «расти» и в современном литературном употреблении заметно менее ясно, чем глагол со значением воспитания/взращивания.'
