  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: ru
  text: Мать, обними своих детей; воспитывай их с радостью, словно голубка; укрепи их стопы, ибо Я избрал тебя, — говорит Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater
  choice: Мать
  rationale: Сохранено прямое обращение и образ матери.
- source_word: complectere
  choice: обними
  rationale: Передаёт повелительное значение и телесно-эмоциональный оттенок латинского глагола.
- source_word: educa
  choice: расти
  rationale: В данном материнском контексте естественно выражает длительное воспитание и взращивание детей.
- source_word: cum laetitia sicut columba
  choice: с радостью, словно голубка
  rationale: Сохраняет и радость действия, и открытое по смыслу сравнение с голубкой.
- source_word: confirma pedes eorum
  choice: укрепи их стопы
  rationale: Максимально сохраняет телесную метафору устойчивости, не сводя её к толкованию вроде «утверди их путь».
- source_word: elegi
  choice: избрал
  rationale: Традиционное и точное соответствие языку божественного избрания; мужской род согласован с говорящим Господом.
theological_decisions:
- issue: Основание повеления в quoniam te elegi
  choice: ибо Я избрал тебя
  alternative: потому что Я избрал тебя
  rationale: «Ибо» сохраняет причинную связь и придаёт речи достойный библейский регистр без конфессионального уточнения характера избрания.
- issue: Образ укрепления ног
  choice: укрепи их стопы
  alternative: утверди их путь
  rationale: 'Сохранена исходная метафора и её возможная неоднозначность: речь может идти об устойчивости, способности стоять или идти.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Прописная «Я» указывает на речь Господа. Пунктуация оформляет заключительную авторскую формулу естественно для русского текста.
