  terminology: «Мать», «обними», «стопы», «ибо Я избрал тебя» и «Господь» точны и стилистически уместны. Прописное «Я» в прямой речи Бога допустимо в заявленном библейском регистре. Сравнение «словно голубка» следует сохранить без разъясняющего толкования.
