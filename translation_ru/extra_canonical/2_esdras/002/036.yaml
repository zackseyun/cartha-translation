  text: uestrae; ego testor palam saluatorem meum. Commendatum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: ru
  text: Бегите от тени этого века; примите радость вашей славы. Я открыто призываю моего Спасителя в свидетели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testor
  choice: призываю … в свидетели
  rationale: С личным дополнением в винительном падеже (saluatorem meum) латинский глагол означает торжественно призвать кого-либо в свидетели, а не свидетельствовать о нём.
- source_word: palam
  choice: открыто
  rationale: Передаёт публичный, явный характер заявления без лишнего усиления.
- source_word: saluatorem meum
  choice: моего Спасителя
  rationale: Сохраняет личное притяжательное местоимение и титульное значение существительного.
- source_word: uestrae
  choice: вашей
  rationale: Сохраняет обращение к нескольким адресатам; слово относится к gloriae в восстановленном контексте фразы.
theological_decisions:
- issue: Роль Спасителя в выражении ego testor palam saluatorem meum
  choice: Спаситель призывается как свидетель
  alternative: говорящий открыто свидетельствует о Спасителе
  rationale: Латинская конструкция testor с личным прямым дополнением поддерживает значение «призывать в свидетели»; такой перевод не подменяет грамматическую роль Спасителя.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Императивы переданы прямо; образ «тени этого века» и богословское напряжение между нынешним веком и грядущей славой сохранены.
