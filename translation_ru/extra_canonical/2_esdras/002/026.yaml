  source_fidelity: Первая часть точно передаёт латинское nemo ex eis interiet. Однако de numero tuo — буквально «из твоего числа», а не «из числа твоих»; последняя формула несколько сдвигает образ от числа к группе людей. Requiram действительно допускает как «потребую/взыщу», так и «разыщу», поэтому альтернативу уместно сохранить в сноске.
  naturalness: «Не тревожься» — естественно и соответствует Noli satagere. Для современного литературного русского «из твоего числа» несколько необычно, но оправдано близостью к образному и намеренно не вполне определённому латинскому выражению. Незавершённость последней фразы должна быть сохранена, поскольку она есть в источнике.
  terminology: «Бедствие и скорбь» адекватно передаёт pressurae et angustiae. Божественное «Я» с прописной буквы соответствует принятому библейскому регистру. «Потребую» сохраняет один из основных смыслов requiram, не навязывая богословского истолкования.
