  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: ru
  text: Никто из них не погибнет, ибо Я потребую их из твоего числа[a]. Не тревожься, ибо когда придёт день бедствия и скорби,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разыщу их среди твоих». Латинское requiram может означать как «потребую (взыщу)», так и «разыщу»; буквально: «из твоего числа».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: interiet
  choice: погибнет
  rationale: Передаёт будущее время латинского interire и естественно звучит в контексте обещания сохранности.
- source_word: requiram de numero tuo
  choice: потребую их из числа твоих
  rationale: Сохраняет взыскующий оттенок requiram и необычную, но значимую конструкцию de numero tuo, не сводя её без достаточных оснований ни к поиску, ни к требованию отчёта.
- source_word: Noli satagere
  choice: Не тревожься
  rationale: Естественно передаёт запрет чрезмерно заботиться или беспокоиться.
- source_word: dies pressurae et angustiae
  choice: день бедствия и скорби
  rationale: Сохраняет парность обозначений тяжёлого испытания; «бедствие» передаёт pressura, а «скорбь» — angustia.
theological_decisions:
- issue: Смысл Божьего requiram по отношению к людям, входящим в «твоё число»
  choice: потребую их из числа твоих
  alternative: разыщу их среди твоих
  rationale: Латинское requiram допускает оттенки поиска, востребования и взыскания. Основной текст сохраняет строгость высказывания, а сноска отмечает возможное прочтение без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранено незавершённое синтаксическое продолжение в конце стиха, соответствующее исходному латинскому тексту.
