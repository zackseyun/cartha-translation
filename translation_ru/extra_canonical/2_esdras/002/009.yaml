    issue: Сноска предлагает «предам» как вариант перевода dabo.
    rationale: «Предам» требует или по меньшей мере вызывает представление о невыраженном адресате передачи. В латинском тексте такого дополнения нет; при этом значение dabo в данном месте действительно спорно. Нейтральная дословная помета лучше сохраняет эту неопределённость.
  - severity: low
    issue: «Так же» слегка расширяет значение sic.
    rationale: «Так» прямо передаёт указательное sic; сопоставление с участью Содома и Гоморры остаётся ясным из контекста.
