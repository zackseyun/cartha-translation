base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: ru
  text: 'Вспомни, что Я сделал с Содомом и Гоморрой: их земля лежит среди глыб смолы и груд пепла. Так Я поступлю[a] с теми, кто Меня не послушал, — говорит Господь Вседержитель.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «Так Я дам их». Значение латинского dabo в этом месте спорно; по контексту возможно: «Так Я поступлю с ними».'
    reason: Сохраняет буквальную форму и текстовую неопределённость dabo, не добавляя невыраженного в оригинале адресата передачи.
lexical_decisions:
- source_word: memorare
  choice: Вспомни
  rationale: Императив передан прямо и естественно для современного литературного русского языка.
- source_word: terra iacet in picis glebis et aggeribus cinerum
  choice: их земля лежит среди глыб смолы и груд пепла
  rationale: Сохранены конкретные образы латинского текста и состояние опустошённой земли; «среди» естественно передаёт in при описании окружающих её обломков и насыпей.
- source_word: sic dabo eos
  choice: Так же Я поступлю с теми
  rationale: В поздней латыни dare может употребляться в значении «сделать, обойтись, поступить»; контекст устанавливает параллель с quid fecerim — «что Я сделал». Буквальная неоднозначность dabo отмечена в сноске.
- source_word: non audierunt
  choice: не послушал
  rationale: В данном контексте audire означает не просто услышать, а внять и повиноваться; русское «не послушал» сохраняет оба оттенка.
- source_word: dominus omnipotens
  choice: Господь Вседержитель
  rationale: Устоявшееся и точное библейское соответствие титулу omnipotens, сохраняющее высокий регистр.
theological_decisions:
- issue: Характер обещанного суда в sic dabo eos
  choice: «Так же Я поступлю с теми» с указанием варианта в сноске
  alternative: «Так Я предам тех» или буквально «Так Я дам тех»
  rationale: Основной перевод подчёркивает контекстуальную параллель с судьбой Содома и Гоморры, но не уточняет способ суда. Сноска сохраняет возможное понимание dabo как «отдам/предам», не превращая его в единственно допустимое.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены образы смолы и пепла, формула пророческой речи и неоднозначность ключевого позднелатинского оборота.
