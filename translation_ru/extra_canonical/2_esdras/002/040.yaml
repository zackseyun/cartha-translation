base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: ru
  text: Прими, Сион, своё число и собери своих облачённых в белое[a], исполнивших закон Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинское candidatos буквально связано с белой, сияющей одеждой; возможна также передача: «собери своих одетых в белые одежды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Recipe, Sion, numerum tuum
  choice: Прими, Сион, своё число
  rationale: Сохраняет необычный и намеренно не до конца разъяснённый образ «числа» принадлежащих Сиону; более свободное «прими всех своих» устранило бы подлинную образность исходного текста.
- source_word: conclude
  choice: собери
  rationale: В данном призыве глагол означает собрать вместе, объединить или принять внутрь; «собери» естественно по-русски и соответствует контексту.
- source_word: candidatos tuos
  choice: своих облачённых в белое
  rationale: Candidatos этимологически и образно связано с ярко-белой одеждой. Передача через «облачённых в белое» сохраняет зрительный образ и не вводит современное политическое значение слова «кандидаты».
- source_word: qui legem [domini impleverunt]
  choice: исполнивших закон Господа
  rationale: Причастный оборот естественно связывает характеристику собранных людей с их исполнением закона; «исполнивших» точно передаёт завершённость действия, отражённую в консультационном тексте и предполагаемом продолжении латинской фразы.
theological_decisions:
- issue: Кого обозначает candidatos
  choice: Не отождествлять их прямо ни с крещёными, ни с мучениками, а сохранить общий образ людей в белом
  alternative: Назвать их «новокрещёными», «мучениками» или «избранными»
  rationale: Такие толкования возможны в раннехристианском контексте, но сам латинский текст не уточняет группу; конкретизация внесла бы в перевод лишнее богословское решение.
- issue: Связь с законом Господа
  choice: «исполнивших закон Господа»
  alternative: «соблюдавших закон Господа»
  rationale: «Исполнивших» сохраняет сильный, завершительный смысл формулировки и не ослабляет содержащегося в ней богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Необычное выражение «своё число» сохранено ради образности оригинала; форма «облачённых в белое» передаёт белизну одежды без политической ассоциации слова «кандидаты».
