source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Petite et accipietis, rogate uobis dies paucos ut minorentur; iam paratum est uobis regnum: uigilate.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/013.yaml
  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: ru
  text: Просите — и получите; молитесь, чтобы ваши немногие дни сократились.[a] Царство уже приготовлено для вас; бодрствуйте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза о «немногих днях» трудна. Вероятно, речь идёт о сокращении нынешнего века или времени бедствий, а не о желании прожить недолго. Возможен перевод: «молитесь, чтобы дней ваших было мало и чтобы они сократились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Petite et accipietis
  choice: «Просите — и получите»
  rationale: Сохраняет прямую форму повеления и обещания, а также множественное число латинских глаголов.
- source_word: rogate
  choice: «молитесь»
  rationale: В данном апокалиптическом контексте передаёт обращённую к Богу просьбу естественнее, чем повторное «просите».
- source_word: uobis dies paucos ut minorentur
  choice: «чтобы ваши немногие дни сократились»
  rationale: 'Передаёт prolepsis: dies paucos вынесено вперёд как смысловое подлежащее придаточного с ut, а paucos относится к «дням», а не выступает вторым сказуемым.'
- source_word: iam paratum est uobis regnum
  choice: «Царство уже приготовлено для вас»
  rationale: Сохраняет iam («уже»), завершённую готовность царства и адресованность общине.
- source_word: uigilate
  choice: «бодрствуйте»
  rationale: Устоявшийся, понятный библейский эквивалент призыва сохранять духовную бдительность.
theological_decisions:
- issue: К чему относится сокращение «немногих дней»
  choice: Не уточнять в основном тексте, означают ли «дни» нынешний век, период бедствий или срок жизни адресатов
  alternative: Явно перевести как сокращение нынешнего века или бедствий
  rationale: Латинский текст не называет референт прямо; сохранение образа не устраняет подлинную апокалиптическую неоднозначность.
- issue: Синтаксическая роль paucos
  choice: «ваши немногие дни»
  alternative: «чтобы дней ваших было мало и чтобы они сократились»
  rationale: 'Наиболее вероятна конструкция с предварительно вынесенным дополнением/смысловым подлежащим: молиться о немногих днях, чтобы они сократились. Альтернативное чтение менее убедительно грамматически, но отмечено в сноске.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. «Бодрствуйте» сохраняет традиционную апокалиптическую лексику, оставаясь понятным современному читателю.
