source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: ru
  text: Те, кто слышит и понимает, ожидайте вашего пастыря. Он даст вам вечный покой, ибо близок тот, кто придёт в конце века. Будьте готовы к наградам царства,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae auditis et intellegitis
  choice: которые слышат и понимают
  rationale: Сохраняет два координированных латинских глагола и обращение к группе адресатов; форма quae соотносится с подразумеваемым gentes, восстановленным по контексту и консультационному слою.
- source_word: gentes (подразумевается по контексту)
  choice: язычникам
  rationale: В противопоставлении Израилю в предыдущем стихе раннехристианское gentes обозначает не просто народы, а неевреев — язычников.
- source_word: pastorem uestrum
  choice: вашего Пастыря
  rationale: «Пастырь» естественно сохраняет библейский образ и возможный мессианский оттенок, не конкретизируя личность сверх текста.
- source_word: requiem aeternitatis
  choice: вечный покой
  rationale: Естественный русский эквивалент буквального «покоя вечности», сохраняющий эсхатологический смысл.
- source_word: in finem saeculi
  choice: при конце века
  rationale: Передаёт saeculum как нынешний век/мировую эпоху, а не как конец физического мира; предлог «при» сохраняет временную близость к событию.
- source_word: praemia regni
  choice: наградам Царства
  rationale: Сохраняет множественное число praemia и ёмкое библейское обозначение regnum без добавленного уточнения.
theological_decisions:
- issue: Идентичность адресатов
  choice: язычникам
  alternative: народам
  rationale: Контраст с Израилем и раннехристианское употребление gentes поддерживают значение «язычники»; альтернативное значение отмечено в сноске.
- issue: Обозначение пастыря
  choice: Пастыря / Тот, Кто
  alternative: пастыря / тот, кто
  rationale: Заглавные буквы отражают вероятную личную и мессианскую референцию в контексте, но перевод не добавляет имени или конфессионального толкования.
- issue: Конец saeculum
  choice: конец века
  alternative: конец мира
  rationale: «Век» сохраняет эсхатологическую многозначность saeculum и не сужает смысл до уничтожения мира.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис разбит на ясные предложения; обращение оформлено дательным падежом после «говорю вам». Финальная запятая сохранена, поскольку стих продолжается в следующем контексте.
