id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: ru
  text: Ибо вечный свет будет сиять для вас во веки веков. Бегите от тени этого века; примите радость славы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: вечный свет
  rationale: Естественно и точно передаёт образ непрестанного, непреходящего света.
- source_word: per aeternitatem temporis
  choice: во веки веков
  rationale: Устойчивое возвышенное выражение неограниченной длительности; сохраняет смысл латинской формулы, не утяжеляя русский текст буквальным «на протяжении вечности времени».
- source_word: Fugite
  choice: Бегите
  rationale: Сохраняет силу повеления и образ решительного удаления, заложенный в латинском fugere.
- source_word: umbram saeculi huius
  choice: тени этого века
  rationale: «Век» передаёт saeculum как нынешнюю эпоху или мировой порядок и сохраняет эсхатологическое напряжение без поясняющего истолкования.
- source_word: iocunditatem gloriae
  choice: радость славы
  rationale: Передаёт iocunditas как радость и сохраняет краткую родительную конструкцию исходного текста.
theological_decisions:
- issue: Значение saeculum
  choice: этот век
  alternative: этот мир
  rationale: «Этот век» сохраняет возможный эсхатологический контраст нынешней эпохи с грядущей и не сводит выражение только к пространственному миру.
- issue: Характер «славы»
  choice: оставлено без уточнения принадлежности
  alternative: Божья слава
  rationale: В латинском тексте стоит только gloriae; добавление «Божья» было бы богословски вероятным, но эксплицировало бы то, что источник оставляет невыраженным.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксический параллелизм двух повелений сохранён; точка с запятой подчёркивает их смысловую связь.
