  source_fidelity: 'Текст точно передаёт латинский оригинал: quia — «Ибо», lux perpetua — «вечный свет», lucebit uobis — «будет сиять для вас», per aeternitatem temporis — «во веки веков». Повеления Fugite и accipite сохранены, как и неуточнённые образы «тени этого века» и «радости славы».'
  naturalness: Русский текст литературный, ясный и сохраняет уместно возвышенный библейский регистр. «Бегите от тени этого века» — естественная русская передача управления при «бежать», без утраты образа оригинала. Точка с запятой удачно разделяет два параллельных призыва.
  terminology: «Век» корректно передаёт saeculum, не сужая его до физического мира. «Слава» оставлена без добавления принадлежности, что верно отражает латинское gloriae. «Во веки веков» — допустимая традиционная русская формула для выражения вечности и соответствует возвышенному регистру отрывка.
