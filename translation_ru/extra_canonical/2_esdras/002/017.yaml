  text: Do not fear, mother of children, for I have chosen you, says the Lord.
translation:
  language: ru
  text: Не бойся, мать детей, ибо Я избрал тебя, — говорит Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Noli timere
  choice: Не бойся
  rationale: Естественная и точная передача латинского запрета с инфинитивом.
- source_word: mater filiorum
  choice: мать детей
  rationale: Сохраняет прямое обращение и обобщённое значение filiorum без добавочного уточнения пола.
- source_word: quoniam
  choice: ибо
  rationale: Передаёт причинную связь и поддерживает достойный, умеренно возвышенный регистр.
- source_word: te elegi
  choice: Я избрал тебя
  rationale: Точно передаёт личное избрание; местоимение «Я» добавлено по нормам русского синтаксиса для смыслового акцента, уже выраженного латинской личной формой elegi.
- source_word: dicit dominus
  choice: говорит Господь
  rationale: Стандартная и формально близкая передача пророческой формулы.
theological_decisions:
- issue: Характер избрания адресата
  choice: избрал тебя
  alternative: выбрал тебя
  rationale: «Избрал» сохраняет библейский регистр и богословскую ёмкость исходного elegi, не уточняя цель или природу избрания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и ясен; тире отделяет формулу речи от прямого высказывания.
