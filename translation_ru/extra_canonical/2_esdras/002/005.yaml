source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: ru
  text: Но Я призываю Тебя, Отец, в свидетели против матери детей, потому что они не захотели хранить Мой завет,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testem inuoco
  choice: призываю … в свидетели
  rationale: Естественная русская передача латинской юридической формулы с сохранением значения призыва свидетеля.
- source_word: super matrem filiorum
  choice: против матери этих детей
  rationale: В судебном контексте super с винительным передаёт направленность свидетельства против матери; filiorum обозначает детей, о которых идёт речь.
- source_word: noluerunt
  choice: не захотели
  rationale: Передаёт волевой оттенок латинского nolle, а не просто факт несоблюдения.
- source_word: testamentum meum seruare
  choice: хранить Мой завет
  rationale: Testamentum в библейском контексте означает «завет», а servare естественно передаётся традиционным и понятным выражением «хранить завет».
theological_decisions:
- issue: Судебная направленность свидетельства
  choice: против матери
  alternative: о матери / над матерью
  rationale: Сочетание testem invoco super и последующий контекст кары поддерживают обвинительный, а не нейтральный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прописные местоимения «Я», «Тебя», «Мой» обозначают говорящего Бога и обращение к Отцу. Начальное misericordiam относится к завершению предыдущего стиха и здесь не переводится.
