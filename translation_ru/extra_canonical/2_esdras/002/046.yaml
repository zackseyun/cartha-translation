    issue: «спросил ангела» вместо «сказал ангелу»
    rationale: Dixi — нейтральное «сказал», а ad angelum передаёт адресата. Хотя «спросил» контекстуально понятно, оно конкретизирует исходный глагол и в данной конструкции может также читаться как «задал вопрос ангелу».
  - severity: low
    issue: «этот юноша» вместо «тот юноша»
    rationale: Ille обычно сохраняет выделяющее/дистальное указание; «тот» передаёт его без потери естественности.
