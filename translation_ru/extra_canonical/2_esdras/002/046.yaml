  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
translation:
  language: ru
  text: 'И я сказал ангелу[a]: «Кто тот юноша, который возлагает на них венцы и вкладывает им в руки пальмовые ветви?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда я сказал».'
    reason: Сохраняет якорь, присутствующий в английском аудиторском следе; основной текст правильно передаёт латинское Et как «И».
lexical_decisions:
- source_word: Et dixi
  choice: И я спросил
  rationale: Латинское et передано сочинительным «И», а dixi в контексте прямого вопроса естественно выражено глаголом «спросил».
- source_word: ille iuuenis
  choice: этот юноша
  rationale: Указательное ille выделяет видимого говорящему юношу; «этот юноша» естественно по-русски.
- source_word: coronas inponit
  choice: возлагает на них венцы
  rationale: «Возлагать венцы» сохраняет торжественный регистр и значение inponere.
- source_word: palmas in manus
  choice: вкладывает им в руки пальмовые ветви
  rationale: Palma здесь обозначает пальмовую ветвь как предмет, вручаемый людям; добавленный глагол необходим для естественного русского синтаксиса, хотя в латинском он подразумевается при одном inponit.
theological_decisions:
- issue: Символическое значение венцов и пальм
  choice: Оставить образы без истолкования
  alternative: Передать их как награды или знаки победы
  rationale: Стих называет видимые предметы и не раскрывает их символику; перевод не должен заранее разрешать богословскую интерпретацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Сохранено начальное «И», соответствующее латинскому Et, а не временное «Тогда».
