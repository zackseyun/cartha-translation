source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populus meus, quia ueniet requies tua. Nutrix bona, nutri
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/024.yaml
  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: ru
  text: Народ Мой, ибо придёт твой покой. Добрая кормилица, корми своих детей и укрепляй их ноги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populus meus
  choice: Народ Мой
  rationale: Прямое обращение с сохранением притяжательного местоимения и торжественного, но современного регистра.
- source_word: requies tua
  choice: твой покой
  rationale: Сохраняет конкретное значение requies — «покой, отдохновение» — и обращение во втором лице единственного числа.
- source_word: Nutrix bona, nutri
  choice: Добрая кормилица, корми
  rationale: Передаёт обращение nutrix и повелительную форму nutri; намеренный корневой повтор естественен по-русски и отражает латинскую игру слов.
- source_word: confirma pedes eorum
  choice: укрепляй их ноги
  rationale: Буквально и ясно передаёт образ укрепления ног, не заменяя его толкованием вроде «утверди их путь».
theological_decisions:
- issue: Значение образа покоя
  choice: покой
  alternative: отдохновение / место покоя
  rationale: Латинское requies допускает как состояние покоя, так и эсхатологический оттенок; нейтральное «покой» сохраняет эту смысловую открытость.
- issue: Образ кормилицы
  choice: кормилица
  alternative: мать-кормилица / воспитательница
  rationale: Сохранён прямой женский образ nutrix без добавления отождествления с конкретной религиозной общиной или фигурой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. Формы «твой» и повелительные глаголы в единственном числе сохраняют грамматику обращения; прописная буква в «Мой» указывает на речь Бога без внесения дополнительных титулов.
