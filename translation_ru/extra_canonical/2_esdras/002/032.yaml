source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: ru
  text: Обними своих детей, пока Я не приду, и возвещай им милосердие, потому что Мои источники переливаются через край и благодать Моя не иссякнет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuos
  choice: своих детей
  rationale: Латинское субстантивированное притяжательное местоимение означает «своих»; дополнение «детей» восстанавливается из ближайшего контекста и подтверждается консультационным английским слоем.
- source_word: praedica
  choice: возвещай
  rationale: Передаёт публичное провозглашение без излишне конфессионально окрашенного «проповедуй».
- source_word: misericordiam
  choice: милосердие
  rationale: Прямо передаёт misericordia и сохраняет отличие от последующего gratia.
- source_word: exuberant fontes mei
  choice: источники Мои переполняются
  rationale: Сохраняет образ обильно текущих, выходящих через край источников и настоящее время латинского exuberant.
- source_word: gratia mea non deficiet
  choice: благодать Моя не иссякнет
  rationale: Будущее время deficiet передано будущим; «не иссякнет» естественно перекликается с образом источников и означает, что благодать не оскудеет.
theological_decisions:
- issue: Различение misericordia и gratia
  choice: «милосердие» и «благодать»
  alternative: Передать оба слова как «милость»
  rationale: Разные латинские существительные следует различать, не сводя их к одному богословскому понятию.
- issue: Время глагола deficiet
  choice: 'будущее: «не иссякнет»'
  alternative: 'настоящее: «не иссякает»'
  rationale: Латинское deficiet — форма будущего времени; она выражает обещание на будущее после настоящего exuberant.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи; местоимения, относящиеся к говорящему Богу, написаны с прописной буквы. Заключительное «Я, Ездра, получил повеление…» относится к следующему сегменту и в текст данного стиха не включено.
