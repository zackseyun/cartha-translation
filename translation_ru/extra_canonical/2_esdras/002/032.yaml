  source_fidelity: 'Передача в целом точна: подразумеваемое в начале фразы «обними своих детей» согласуется с предшествующим глаголом в полном латинском тексте; сохранены адресаты illis, различение misericordia и gratia, настоящее время exuberant и будущее deficiet. Однако «источники Мои переполняются» по-русски несколько неестественно: переполняется обычно сосуд, тогда как латинское exuberant описывает избыток, выходящий через край.'
