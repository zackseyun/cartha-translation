source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'fortiter pro nomine domini steterunt. Tunc dixit mihi angelus: uade, adnuntia populo meo, qualia et quanta mirabilia domini dei uidisti.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: ru
  text: 'Они мужественно стояли за имя Господа. Тогда ангел сказал мне: «Иди и возвести моему народу, какие и сколь великие чудеса Господа Бога ты видел».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какие по своему характеру и сколь великие чудеса Господа Бога ты видел».'
    reason: Уточняет, что латинское qualia, наряду с quanta, является определением к mirabilia и может подчёркивать характер чудес, не только их величину.
lexical_decisions:
- source_word: fortiter
  choice: мужественно
  rationale: Передаёт стойкость и смелость в контексте steterunt естественным и достойным русским словом.
- source_word: pro nomine domini
  choice: за имя Господа
  rationale: Сохраняет формальную конструкцию и богословски значимое упоминание имени, не заменяя его толкованием вроде «ради Господа».
- source_word: adnuntia
  choice: возвести
  rationale: Передаёт повеление публично сообщить или провозгласить; слово понятно в современном литературном библейском регистре.
- source_word: qualia et quanta mirabilia
  choice: какие и сколь великие чудеса
  rationale: Сохраняет параллелизм qualia и quanta, относя оба определения к mirabilia, и не устраняет оттенок качества и величия увиденного.
theological_decisions:
- issue: Смысл выражения pro nomine domini
  choice: за имя Господа
  alternative: ради имени Господа
  rationale: Более прямо сохраняет образ стойкого выступления в защиту или поддержку имени Господа, не уточняя сверх текста мотив действия.
- issue: К кому относится притяжательное meo в populo meo
  choice: Моему народу
  alternative: моему народу
  rationale: В прямой речи ангела латинское meo формально относится к говорящему; прописная буква допустима в русском библейском оформлении, однако не превращает ангела в Господа и сохраняет буквальную формулировку источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис близок к латинскому, но остаётся естественным; подлинный параллелизм qualia et quanta сохранён.
