revisions:
- from: 'Они мужественно стояли за имя Господа. Тогда ангел сказал мне: «Иди и возвести Моему народу, какие и сколь великие чудеса Господа Бога ты видел».[a]'
  to: 'Они мужественно стояли за имя Господа. Тогда ангел сказал мне: «Иди и возвести моему народу, какие и сколь великие чудеса Господа Бога ты видел».[a]'
  rationale: Исправлена только регистровая интерпретация притяжательного местоимения, чтобы не приписывать ангелу божественную речь средствами русской орфографии. Сноска уточнена, чтобы действительно отражать смысловой оттенок qualia et quanta и сохранять исходный якорь.
