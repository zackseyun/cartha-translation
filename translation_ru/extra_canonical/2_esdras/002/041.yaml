  source_fidelity: 'Основная проблема — «Воззови к могуществу Господа»: это передаёт обращение к могуществу как адресату и ослабляет прямое roga («проси/моли»). Imperium в данном контексте прежде всего обозначает власть, владычество или верховное повеление; «могущество» возможно как оттенок, но не должно заменять значение в основном тексте.'
