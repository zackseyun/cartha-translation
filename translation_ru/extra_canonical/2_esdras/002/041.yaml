source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: ru
  text: Число твоих детей, которых ты желала, достигло полноты. Моли о власти Господа[a], чтобы твой народ, призванный от начала, был освящён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о могуществе Господа».'
    reason: Imperium может обозначать не только власть или владычество, но и действенное могущество; основной текст сохраняет более прямое значение слова.
lexical_decisions:
- source_word: plenus est numerus
  choice: число… достигло полноты
  rationale: Передаёт завершённость и полноту числа, сохраняя образ исходного выражения и не сводя его лишь к нейтральному «набрано».
- source_word: optabas
  choice: ты желала
  rationale: Имперфект передан прошедшим временем; женский род обусловлен обращением к Сиону в непосредственном контексте.
- source_word: roga imperium domini
  choice: воззови к могуществу Господа
  rationale: Imperium обозначает верховную власть или могущество; такая формулировка сохраняет необычный объект обращения и звучит по-русски достойнее буквального «проси власть Господа».
- source_word: qui uocatus est ab initio
  choice: призванный от начала
  rationale: Сохранены единственное собирательное «народ», пассивное значение uocatus и намеренно неуточнённая исходная точка ab initio.
- source_word: sanctificetur
  choice: был освящён
  rationale: Сохранены пассивная конструкция и сакральный смысл глагола без уточнения действующего лица.
theological_decisions:
- issue: Значение imperium domini
  choice: могущество Господа
  alternative: власть Господа
  rationale: Латинское imperium допускает оттенки власти, верховного владычества и действенной силы. Основной текст использует естественное в данном обращении «могущество», а сноска сохраняет близкую формальную альтернативу.
- issue: Смысл «от начала»
  choice: оставить без пояснения
  alternative: уточнить как «от сотворения мира» или «изначально»
  rationale: Источник не определяет, о каком именно начале идёт речь; уточнение устранило бы подлинную смысловую открытость.
translation_notes:
  register: Современный литературный русский с торжественным библейским оттенком. Начальные слова «domini compleuerunt» относятся к окончанию предыдущего стиха и потому здесь не переводятся.
