  text: I, Ezra, saw on Mount Zion a great multitude that I could not number, and they all were praising the Lord with songs.
translation:
  language: ru
  text: Я, Ездра, увидел на горе Сион великое множество, которое не мог сосчитать; и все они прославляли Господа песнями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turbam magnam
  choice: великое множество людей
  rationale: Передаёт многочисленную толпу естественным современным русским языком; слово «людей» проясняет подразумеваемый состав множества.
- source_word: quam numerare non potui
  choice: которого не мог сосчитать
  rationale: Формально и ясно передаёт невозможность исчислить увиденное множество.
- source_word: canticis conlaudabant
  choice: песнями вместе восхваляли
  rationale: «Песнями» передаёт canticis, а «вместе восхваляли» сохраняет совместный характер действия, выраженный приставкой con-.
- source_word: dominum
  choice: Господа
  rationale: Обычная библейская передача латинского dominum в данном контексте.
