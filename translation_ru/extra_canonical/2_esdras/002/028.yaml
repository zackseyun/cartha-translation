  text: Manus meae tegent te, ne filii tui gehennam uideant. Iocundare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/028.yaml
  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: ru
  text: Мои руки укроют тебя, чтобы твои дети не увидели геенны. Радуйся,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Manus meae
  choice: Мои руки
  rationale: Прямо передаёт множественное число и образ защищающих Божьих рук.
- source_word: tegent te
  choice: укроют тебя
  rationale: Латинское tegere здесь выражает покрытие и защиту; «укроют» естественно передаёт оба оттенка.
- source_word: filii tui
  choice: твои дети
  rationale: В данном обращении filii может обозначать не только сыновей мужского пола, но детей или потомков адресата в целом.
- source_word: gehennam
  choice: геенны
  rationale: Сохраняет конкретный богословский образ Геенны, не заменяя его более общим словом «ад».
- source_word: Iocundare
  choice: Радуйся
  rationale: Естественный современный императив, точно передающий призыв к радости.
theological_decisions:
- issue: Значение «геенны»
  choice: Сохранено слово «геенна» без толкования.
  alternative: «ад» или пояснительная передача как место наказания
  rationale: Исходный текст употребляет gehennam; нейтральная транслитерационная традиция сохраняет его образ и не снимает возможное различие между Геенной и более широким понятием ада.
- issue: Отношение между укрытием адресата и тем, что дети не увидят Геенну
  choice: 'Синтаксическая связь сохранена буквально: «укроют тебя, чтобы твои дети…».'
  alternative: Переформулировать так, будто руки непосредственно укрывают детей
  rationale: Латинский текст грамматически называет объектом tegent именно te, а последующее ne вводит цель или результат; кажущаяся напряжённость не должна устраняться переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Финальная запятая сохранена, поскольку стих синтаксически продолжается в следующем контексте.
