lexical_decisions:
- source_word: filios tuos
  choice: детей твоих
  rationale: Передаёт латинское filios как «детей» в современном литературном русском; сохраняется связь с предшествующим контекстом и исходный фрагментарный синтаксис стиха.
- source_word: confirma enim pedes eorum
  choice: ибо укрепи их стопы
  rationale: Сохраняет повелительное confirma, причинную частицу enim и телесный образ pedes, не заменяя его толкованием вроде «утверди их».
- source_word: Seruos quos tibi dedi
  choice: Слуги, которых Я дал тебе
  rationale: Формально передаёт начало следующей конструкции, не добавляя отсутствующего в источнике связующего оборота; прописная «Я» соответствует принятому русскому библейскому оформлению речи Бога.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Необычный переход от винительного «детей твоих» к повелению намеренно сохранён, поскольку предоставленный латинский отрывок начинается внутри предложения. Завершающая запятая отражает незавершённость исходной фразы и её продолжение в следующем стихе.
