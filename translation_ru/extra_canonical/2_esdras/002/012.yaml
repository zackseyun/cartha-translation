lexical_decisions:
- source_word: quae praeparaueram illis
  choice: которое Я приготовил для них
  rationale: Сохраняет относительную конструкцию и связь с предшествующим контекстом; прописная буква у местоимения указывает на говорящего Бога согласно русской библейской традиции.
- source_word: Lignum uitae
  choice: Дерево жизни
  rationale: Устоявшееся и прямое соответствие латинскому выражению.
- source_word: in odorem unguenti
  choice: благоуханием благовония
  rationale: Передаёт предикативно-результативный смысл in odorem без добавления явного сравнения; «благовоние» охватывает ароматическое масло или парфюмерное вещество.
- source_word: non laborabunt neque fatigabuntur
  choice: не будут ни трудиться, ни утомляться
  rationale: Сохраняет различие между трудом и наступающей от него усталостью, а также парную отрицательную конструкцию.
theological_decisions:
- issue: Характер связи дерева жизни с ароматом
  choice: будет для них благоуханием благовония
  alternative: будет для них словно аромат благовонного масла
  rationale: Латинское in odorem не содержит явного сравнительного показателя; основной текст сохраняет предикацию и не превращает её без необходимости в сравнение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Начальная строчная буква сохраняет синтаксическую зависимость фрагмента от предыдущего стиха; формулировка намеренно не восполняет отсутствующий в данном отрывке антецедент.
