  text: Vae tibi, Assur, qui abscondis iniquos penes te! gens mala,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/008.yaml
  text: Woe to you[a], Assyria, who hide the unrighteous with you! O evil nation,
translation:
  language: ru
  text: Горе тебе, Ассирия[a], укрывающая у себя[b] беззаконников! О злой народ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ассур»; здесь имеется в виду Ассирия.'
    reason: Уточняет форму латинского собственного имени и его значение в контексте.
  - marker: b
    text: 'Или: «при себе»; возможно также: «под своей защитой».'
    reason: Сохраняет диапазон значений латинского penes te.
lexical_decisions:
- source_word: Assur
  choice: Ассирия
  rationale: В данном обращении латинское Assur обозначает олицетворённую страну; «Ассирия» — ясное и традиционное русское наименование.
- source_word: abscondis
  choice: укрывающая
  rationale: Передаёт не только сокрытие, но и предоставление убежища; причастная конструкция естественно связывает характеристику с обращением «Ассирия».
- source_word: iniquos
  choice: беззаконников
  rationale: Субстантивированное прилагательное обозначает людей, творящих неправду; «беззаконники» сохраняет нравственно-судебную окраску.
- source_word: penes te
  choice: у себя
  rationale: Латинское выражение указывает на пребывание при ком-либо, в его распоряжении или под его покровительством; «у себя» сохраняет широту смысла и звучит естественно.
- source_word: gens mala
  choice: О злой народ
  rationale: Сохранено самостоятельное звательное обращение, которое по синтаксису ведёт к продолжению в следующем стихе.
theological_decisions:
- issue: Характер укрывательства беззаконников
  choice: Не уточнять, означает ли это простое сокрытие, принятие к себе или защиту
  alternative: «укрывающая под своей защитой беззаконников»
  rationale: penes te допускает оттенок обладания или покровительства, но не требует его; более узкий перевод преждевременно разрешил бы смысловую неоднозначность.
translation_notes:
  register: 'Современный литературный русский с торжественным пророческим обращением. Запятая в конце сохранена намеренно: обращение «О злой народ» синтаксически продолжается в следующем стихе.'
