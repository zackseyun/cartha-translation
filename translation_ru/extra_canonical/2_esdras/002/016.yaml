  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: ru
  text: И Я воскрешу мёртвых с их мест и выведу их из гробниц, ибо Я познал Моё имя в них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинская фраза необычна. Буквальнее: «ибо Я познал Моё имя в них». Возможны также понимания: «ибо Моё имя известно среди них» или, предположительно, «ибо они познали Моё имя».'
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo
  choice: подниму
  rationale: Будущее время и переходное значение латинского глагола переданы прямо; в контексте мёртвых выражение ясно означает возвращение к жизни.
- source_word: de locis suis
  choice: с их мест
  rationale: Сохранён буквальный и несколько неопределённый образ исходного текста без уточнения, каких именно мест.
- source_word: de monumentis educam illos
  choice: выведу их из гробниц
  rationale: Monumenta здесь обозначает погребальные сооружения; «гробницы» естественно передаёт смысл, а educam — действие выведения наружу.
- source_word: cognoui nomen meum in illis
  choice: узнаю в них Моё имя
  rationale: Cognoui допускает результативно-настоящее значение «узнаю/распознаю». Такая формулировка сохраняет необычный образ имени, находящегося «в них», и не заменяет субъект фразы предположительным «они познали».
theological_decisions:
- issue: Связь воскресения с Божьим именем в людях
  choice: потому что узнаю в них Моё имя
  alternative: потому что Я познал в них Моё имя / потому что Моё имя известно среди них / потому что они познали Моё имя
  rationale: 'Основной текст следует засвидетельствованной латинской грамматике: субъект cognoui — говорящий Бог, объект — «Моё имя», а in illis сохранено как «в них». Более гладкие варианты меняют время, залог либо субъект и потому отмечены только в примечании.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Неопределённость «с их мест» и необычность заключительной фразы намеренно сохранены; местоимения, относящиеся к Богу, написаны с прописной буквы.
