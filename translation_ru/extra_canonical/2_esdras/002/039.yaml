  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: ru
  text: Те, кто вышел из тени века, получили от Господа сияющие одежды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: transtulerunt se
  choice: вышел
  rationale: Возвратная конструкция означает переход или удаление из одного состояния/места; «вышел из» естественно передаёт её в данном контексте.
- source_word: umbra saeculi
  choice: тени этого века
  rationale: «Век» сохраняет эсхатологическую многозначность латинского saeculum; указательное «этого» естественно обозначает нынешний век, подразумеваемый контекстом.
- source_word: splendidas tunicas
  choice: светлые одежды
  rationale: «Светлые» передаёт splendidas как сияющие, славные одеяния, а более широкое «одежды» звучит естественнее и достойнее буквального «туники».
- source_word: a domino acceperunt
  choice: получили от Господа
  rationale: Прямо сохраняет источник дара и завершённое действие латинского перфекта.
theological_decisions:
- issue: Значение saeculum
  choice: этот век
  alternative: мир
  rationale: Выбор сохраняет возможное противопоставление нынешнего века грядущему и не сводит выражение исключительно к физическому миру.
- issue: Синтаксическая самостоятельность предложения
  choice: Относительная конструкция передана самостоятельным «Те, кто… получили…»
  alternative: Присоединить к предыдущему стиху посредством «которые… и получили…»
  rationale: В полном латинском предложении Qui… transtulerunt является подлежащим при главном сказуемом acceperunt; добавлять отсутствующий союз не требуется.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и торжественная. Сохранён образ «тени этого века» без богословского уточнения его смысла.
