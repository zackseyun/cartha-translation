  source_fidelity: 'Основной текст передаёт контекстуально очевидный смысл, согласующийся с английской контрольной линией: Бог даёт Адаму безжизненное тело, затем вдыхает в него дух жизни. «Тело» как референт ipsum грамматически хорошо обосновано средним родом corpus; «в него» далее относится к Адаму (eum). Однако латинская последовательность Et dedit tibi Adam, corpus mortuum ? текстологически затруднительна и не должна в сноске характеризоваться как уже принятое чтение самого представленного текста.'
