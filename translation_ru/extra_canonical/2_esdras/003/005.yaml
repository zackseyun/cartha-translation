source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: ru
  text: И Ты дал Адаму мёртвое тело[a]. Но и это тело было творением рук Твоих. Ты вдохнул в него дух жизни, и он стал живым перед Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинская фраза «Et dedit tibi Adam, corpus mortuum» текстологически затруднительна и в представленном виде может быть понята как «И Адам дал Тебе мёртвое тело». Основной текст следует контекстуальному восстановлению смысла: «И Ты дал Адаму мёртвое тело».'
    reason: Сноска отмечает трудность исходного латинского текста, не выдавая контекстуальное восстановление за бесспорное чтение издания.
lexical_decisions:
- source_word: corpus mortuum
  choice: мёртвое тело
  rationale: Прямо передаёт латинское выражение, сохраняя образ изначально безжизненного тела, ещё не оживлённого Божьим дыханием.
- source_word: figmentum manuum tuarum
  choice: творением рук Твоих
  rationale: Естественное и достойное русское соответствие образу изделия, созданного Божьими руками.
- source_word: spiritum uitae
  choice: дух жизни
  rationale: Сохраняет многозначность spiritus («дух», «дыхание») и устойчивую библейскую формулировку, не сводя её лишь к физическому дыханию.
- source_word: factus est uiuens coram te
  choice: стал живым пред Тобой
  rationale: Близко передаёт латинскую конструкцию и сохраняет значимое указание coram te, не заменяя его простым «ожил».
theological_decisions:
- issue: К чему относится ipsum в выражении sed et ipsum figmentum manuum tuarum erat
  choice: «оно само» — к телу
  alternative: «он сам» — к Адаму
  rationale: Средний род ipsum грамматически согласуется с corpus («тело»). Это чтение точнее латинского текста, хотя английский консультационный перевод относит местоимение к Адаму.
- issue: Передача spiritum uitae
  choice: «дух жизни»
  alternative: «дыхание жизни»
  rationale: «Дух жизни» сохраняет лексическую и богословскую широту латинского spiritus и не устраняет возможную связь духа с оживляющим дыханием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «пред Тобой» и прописные местоимения поддерживают молитвенное обращение, оставаясь понятными современному читателю.
