id: 2ES.3.35
reference: 2 Esdras 3:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut quando non peccaverunt in conspectu tuo qui habitant terram, aut quae gens sic observavit mandata tua?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: ru
  text: И когда живущие на земле не грешили пред Тобой? И какой народ так соблюдал Твои заповеди?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aut quando
  choice: И когда
  rationale: В контексте это риторический вопрос; союз «и» естественно продолжает рассуждение, не устраняя оттенок латинского aut.
- source_word: in conspectu tuo
  choice: пред Тобой
  rationale: Достоинственная и понятная библейская формула, передающая смысл «в Твоих глазах / в Твоём присутствии».
- source_word: qui habitant terram
  choice: живущие на земле
  rationale: Точно и естественно передаёт причастно-относительную конструкцию исходного текста.
- source_word: quae gens
  choice: какой народ
  rationale: Латинское gens здесь обозначает народ как общность, а не языческую принадлежность.
- source_word: sic observavit mandata tua
  choice: так соблюдал Твои заповеди
  rationale: Сохраняет sic («так») и обычное русское сочетание «соблюдать заповеди».
theological_decisions:
- issue: Всеобщность человеческого греха
  choice: Сохранён риторический вопрос без добавления прямого утверждения о том, что согрешили абсолютно все.
  alternative: «Все живущие на земле грешили пред Тобой»
  rationale: Исходный текст выражает мысль вопросительно и тем самым сохраняет силу и форму аргумента, не превращая её в разъясняющий пересказ.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксический параллелизм двух риторических вопросов сохранён.
