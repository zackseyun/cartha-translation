  text: And you brought him into paradise, which your right hand had planted before the earth came into being.
translation:
  language: ru
  text: И Ты ввёл его в рай, который насадила Твоя правая рука прежде чем появилась земля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: induxisti
  choice: ввёл
  rationale: Прямо передаёт каузативное движение «привёл/ввёл»; в сочетании «ввёл в рай» звучит естественно и достойно.
- source_word: paradisum
  choice: рай
  rationale: Устоявшийся русский библейский эквивалент латинского paradisus.
- source_word: plantauit
  choice: насадила
  rationale: Сохраняет образ устроенного Богом сада и традиционную библейскую сочетаемость «насадить рай/сад».
- source_word: dextera tua
  choice: Твоя правая рука
  rationale: Сохраняет телесно-образное выражение оригинала, не заменяя его толкованием вроде «Твоя сила».
- source_word: antequam terra adueṅtaret
  choice: прежде, чем возникла земля
  rationale: Передаёт временное предшествование и смысл появления земли как начала её существования; «возникла» естественнее по-русски, чем буквальное «пришла».
theological_decisions:
- issue: Образ Божьей правой руки
  choice: Сохранено буквальное выражение «Твоя правая рука».
  alternative: «Твоя сила» или «Ты Своей правой рукой».
  rationale: Латинский текст делает dextera грамматическим деятелем и сохраняет поэтическую персонификацию; её не следует сводить к богословскому истолкованию.
- issue: Существование рая до возникновения земли
  choice: Временная последовательность сохранена без пояснения.
  alternative: Смягчить или гармонизировать формулировку с иными рассказами о творении.
  rationale: Текст прямо утверждает, что рай был насаждён прежде возникновения земли; перевод должен сохранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные местоимения «Ты», «Твоя» употреблены как традиционный знак обращения к Богу. Формулировка остаётся ясной для обычного читателя и близкой к синтаксису латинского источника.
