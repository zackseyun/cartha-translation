    rationale: «Прежде чем» выступает составным союзом; запятая внутри него не требуется.
  - severity: low
    issue: «Возникла земля» несколько конкретизирует adveniret
    rationale: Латинское adveniret передаёт приход или появление; «появилась земля» ближе к образу оригинала и не сужает его до отдельной космогонической формулировки.
