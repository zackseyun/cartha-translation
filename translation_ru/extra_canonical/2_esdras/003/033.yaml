id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: ru
  text: А их воздаяние так и не явилось, и труд их не принёс плода? Ведь я обошёл народы и увидел, что они живут в изобилии[a], хотя не помнят Твоих заповедей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преуспевают».'
    reason: Латинское abundantes может передавать как жизнь в достатке, так и процветание в более широком смысле.
lexical_decisions:
- source_word: merces
  choice: воздаяние
  rationale: Передаёт вознаграждение за труд и сохраняет возможный нравственно-богословский оттенок, не сводя смысл только к плате.
- source_word: labor fructificavit
  choice: труд … принёс плода
  rationale: Сохраняет латинский образ плодоносящего труда и естественно звучит по-русски.
- source_word: pertransiens … pertransivi
  choice: прошёл через все народы
  rationale: Латинское усиление передано охватом «все», поскольку буквальный повтор по-русски был бы неестественным.
- source_word: abundantes
  choice: живут в изобилии
  rationale: Причастие обозначает состояние достатка или процветания народов; формулировка естественна и не уточняет без основания, чем именно они изобилуют.
- source_word: non memorantes
  choice: не помнят
  rationale: Прямо передаёт memorari и сохраняет отличие памяти о заповедях от их исполнения.
theological_decisions:
- issue: Контраст между безрезультатным трудом одних и благополучием народов, не помнящих заповедей
  choice: Сохранить контраст без объяснения причин и без добавления оценки справедливости
  alternative: Истолковать изобилие народов как незаслуженное процветание или как Божье благословение
  rationale: Латинский текст формулирует напряжение, но сам не разрешает его и не называет источник благополучия народов.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-библейской речи. Заглавная буква в «Твоих» отмечает обращение к Богу. Вопросительный знак сохранён по латинскому тексту; переход «Ведь» связывает наблюдение за народами с предыдущим вопросом.
