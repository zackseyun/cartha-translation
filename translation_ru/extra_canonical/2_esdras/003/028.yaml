  text: 'Et dixi ego tunc in corde meo: numquid meliora faciunt qui habitant in Babylone, et propter hoc dominabit Sion?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: ru
  text: 'Тогда я сказал в своём сердце[a]: «Неужели жители Вавилона поступают лучше и потому Сион находится под властью?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Латинская фраза здесь синтаксически неровна и, возможно, была искажена при переписывании. Ездра противопоставляет кажущееся благополучие Вавилона падению Сиона; перевод сохраняет риторический вопрос и не уточняет, кто именно властвует над Сионом.
    reason: alternative_reading
lexical_decisions:
- source_word: in corde meo
  choice: в своём сердце
  rationale: Сохранён библейский образ внутреннего размышления; выражение понятно в современном литературном русском.
- source_word: meliora faciunt
  choice: поступают лучше
  rationale: Сравнительная конструкция передана прямо, без добавления нравственной оценки, которой нет в латинском тексте.
- source_word: qui habitant in Babylone
  choice: жители Вавилона
  rationale: Естественная русская передача описательного оборота «те, кто живёт в Вавилоне».
- source_word: dominabit Sion
  choice: Сион находится под властью
  rationale: Формулировка сохраняет направленность фразы на подчинённое положение Сиона и не вводит прямо не названного субъекта господства.
theological_decisions:
- issue: Связь между поведением жителей Вавилона и подчинением Сиона
  choice: Сохранён риторический вопрос с причинной связью «и потому».
  alternative: Утвердительно объяснить падение Сиона превосходством или праведностью Вавилона.
  rationale: Автор оспаривает кажущееся соответствие между нравственным поведением и историческим господством; текст не утверждает, что жители Вавилона действительно лучше.
- issue: Кто властвует над Сионом
  choice: Субъект власти не назван.
  alternative: «Вавилон властвует над Сионом».
  rationale: Латинская строка в переданном виде синтаксически трудна и не называет Вавилон явным субъектом второй части; неоднозначность не следует устранять догадкой.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и библейского образа «сказать в сердце». Риторическая напряжённость и неясность латинского текста сохранены без искусственного сглаживания.
