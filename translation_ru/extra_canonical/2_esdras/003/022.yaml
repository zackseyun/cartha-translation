  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: ru
  text: Так слабость стала постоянной, и закон был в сердце народа вместе с порочностью корня; добро ушло, а зло осталось.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: permanens infirmitas
  choice: немощь стала постоянной
  rationale: Передаёт устойчивое, укоренившееся состояние слабости, сохраняя абстрактность латинского infirmitas.
- source_word: lex in corde populi
  choice: закон пребывал в сердце народа
  rationale: Сохраняет библейский образ закона внутри, в сердце народа; «пребывал» естественно связывает эту мысль с описанием продолжающегося состояния.
- source_word: cum malignitate radicis
  choice: вместе со злым корнем
  rationale: Контекстуально передаёт malignitas radicis как присущий сердцу «злой корень» и сохраняет напряжённое сосуществование закона и зла.
- source_word: discessit quod bonum est, et mansit [quod malum est]
  choice: добро ушло, а зло осталось
  rationale: Краткая параллельная формула естественна по-русски и воспроизводит противопоставление discessit/mansit.
theological_decisions:
- issue: Одновременное присутствие закона и злого корня в сердце народа
  choice: 'сохранено прямое соположение: «закон… вместе со злым корнем»'
  alternative: истолковать злой корень как силу, противодействующую закону извне
  rationale: Латинский текст не объясняет их отношения и тем самым сохраняет богословское напряжение; перевод не должен его разрешать.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис упрощён без утраты параллелизма; архаизмы и конфессионально окрашенные термины не использованы.
