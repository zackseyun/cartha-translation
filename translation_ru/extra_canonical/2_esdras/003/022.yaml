    issue: «вместе со злым корнем» заменяет абстрактное качество корня конкретным «злым корнем».
    rationale: 'В источнике стоит «cum malignitate radicis»: буквально «с порочностью/злом корня», а не «с дурным корнем». Перевод не должен сглаживать это грамматическое и образное различие.'
  - severity: low
    issue: «немощь» и «пребывал» несколько повышают и архаизируют регистр.
    rationale: Для заявленного современного литературного варианта «слабость» и «был» ближе к нейтральному смыслу латинского «infirmitas» и подразумеваемого «erat».
  revised_text: Так слабость стала постоянной, и закон был в сердце народа вместе с порочностью корня; добро ушло, а зло осталось.
