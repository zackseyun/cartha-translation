  source_fidelity: Черновик точно передаёт общий ход и заключительный параллелизм. Однако латинское «malignitate radicis» означает не «злой корень», а «злобу/порочность корня» (зло, присущее корню). Кроме того, «пребывал» несколько усиливает длительность по сравнению с простым эллиптическим «[был]».
  naturalness: Фраза в целом литературна и понятна. «Немощь» имеет заметный церковно-архаический оттенок; для современного литературного русского точнее и нейтральнее «слабость». «Порочность корня» сохраняет метафору оригинала и звучит естественнее, чем буквальная «злоба корня».
  terminology: «Закон», «сердце народа», «добро» и «зло» переданы удачно. Исправление «злым корнем» на «порочностью корня» требуется для различения латинского абстрактного malignitas и конкретного radix.
  issues:
