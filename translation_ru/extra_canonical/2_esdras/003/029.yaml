  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: ru
  text: Но когда я пришёл сюда и увидел беззакония, которым нет числа, душа моя увидела в этом тридцатом году многих грешников, и сердце моё изнемогло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: беззакония
  rationale: Передаёт религиозно-нравственный смысл impietates естественным современным русским словом, не сужая его до одного вида проступка.
- source_word: delinquentes multos
  choice: множество грешников
  rationale: Субстантивированное delinquentes обозначает многих совершающих проступки; «грешники» сохраняет нравственно-религиозный контекст и звучит естественно.
- source_word: vidit anima mea
  choice: всё это увидела душа моя
  rationale: Сохраняет семитически окрашенное обозначение внутреннего «я» и повтор глагола зрения, при этом проясняя связь с обоими предшествующими объектами.
- source_word: hoc tricesimo anno
  choice: в этом тридцатом году
  rationale: Формально сохраняет указание на тридцатый год, не добавляя отсутствующего в данном стихе уточнения, от какого события ведётся отсчёт.
- source_word: excessit cor meum
  choice: сердце моё изнемогло
  rationale: В контексте потрясения excessit выражает утрату сил или самообладания; «изнемогло» естественно передаёт внутреннее потрясение, не навязывая буквальный образ переполнения.
theological_decisions:
- issue: Характер impietates
  choice: беззакония
  alternative: нечестие / проявления нечестия
  rationale: «Беззакония» сохраняет множественное число и охватывает видимые злые дела, не вводя специальной конфессиональной терминологии.
- issue: Значение excessit cor meum
  choice: сердце моё изнемогло
  alternative: сердце моё переполнилось / сердце оставило меня
  rationale: Латинское выражение допускает образ выхода за пределы или утраты устойчивости. Контекст многочисленных беззаконий поддерживает состояние потрясения и бессилия; выбранная передача сохраняет эту напряжённость без сомнительного положительного оттенка «переполнилось».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским строем. Инверсия «душа моя», «сердце моё» сохраняет достоинство и ритм исходного свидетельства; тире разграничивают тяжёлую латинскую цепочку и делают синтаксис понятным.
