  text: him, and you gave him Isaac, and to Isaac you gave Jacob and Esau. And you set apart Jacob for yourself, but Esau you separated, and Jacob became
translation:
  language: ru
  text: его, и Ты дал ему Исаака, а Исааку дал Иакова и Исава. Ты отделил для Себя Иакова, а Исава отделил, и Иаков стал
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: segregasti tibi
  choice: отделил Себе
  rationale: Сохраняет значение избрания и посвящения для Бога, а также выраженное местоимением tibi «для Себя».
- source_word: separasti
  choice: отстранил
  rationale: Передаёт противопоставление избранному Иакову, не повторяя по-русски тот же глагол и не усиливая смысл до безусловного осуждения.
- source_word: factus est
  choice: стал
  rationale: Прямо передаёт начало незавершённой конструкции и сохраняет обрыв стиха.
theological_decisions:
- issue: Противопоставление Иакова и Исава
  choice: «отделил Себе Иакова, Исава же отстранил»
  alternative: «избрал Себе Иакова, а Исава отверг»
  rationale: Выбранная формулировка ближе к латинским segregasti и separasti и не вносит более сильных богословских понятий «избрания» и «отвержения», которых эти слова сами по себе не требуют.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Сохранены повтор глагола «дал», противопоставление autem через «же» и незавершённое окончание исходного фрагмента. Начальное «его» и конечная синтаксическая незавершённость обусловлены границами стиха.
