  text: Dereliquisti autem unum ex his, id Noe cum domo sua, ex eo iustos omnes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: ru
  text: Но Ты оставил одного из них — Ноя с его домом; от него произошли все праведники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: оставил
  rationale: Передаёт прямое значение латинского глагола в контексте сохранения Ноя после гибели прочих.
- source_word: unum ex his
  choice: одного из них
  rationale: Формально и естественно сохраняет соотнесённость с ранее упомянутой группой.
- source_word: Noe cum domo sua
  choice: Ноя с его домом
  rationale: «Дом» сохраняет библейское значение семьи и домашних, не сужая его до одной только семьи.
- source_word: ex eo iustos omnes
  choice: а от него — всех праведников
  rationale: 'Сохраняет эллиптическую конструкцию латинского текста: Бог оставил также всех праведников, происходящих от Ноя. Не добавляется отсутствующий в источнике глагол «произошли».'
theological_decisions:
- issue: Смысл выражения ex eo iustos omnes
  choice: а от него — всех праведников
  alternative: от него произошли все праведники
  rationale: Латинский синтаксис ставит «всех праведников» в один ряд с объектами глагола «оставил», тогда как английский консультационный текст явно вводит идею происхождения. Русский вариант сохраняет и происхождение («от него»), и эллиптическую связь с «оставил», не снимая смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Тире проясняют эллиптическое построение, не добавляя нового сказуемого.
