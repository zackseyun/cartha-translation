  source_fidelity: '«И дух мой сильно встревожился» точно передаёт образное значение лат. et uentilatus est spiritus meus ualde: дух глубоко взволнован/потрясён. «Я начал говорить Всевышнему» соответствует coepi loqui ad altissimum. «Слова, исполненные трепета» удачно передаёт uerba timorata как слова, произносимые в страхе, робости или трепете, а не как слова, внушающие страх.'
