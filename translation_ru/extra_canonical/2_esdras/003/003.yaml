source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uentilatus est spiritus meus ualde, et coepi loqui ad altissimum uerba timorata,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: ru
  text: И дух мой сильно встревожился, и я начал говорить Всевышнему слова, исполненные трепета[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страха».'
    reason: Латинское timorata может обозначать как благоговейную робость, так и собственно страх.
lexical_decisions:
- source_word: uentilatus est spiritus meus ualde
  choice: дух мой сильно встревожился
  rationale: Латинское ventilatus буквально передаёт сильное колебание или потрясение, а здесь образно описывает глубокое внутреннее волнение; «сильно встревожился» естественно выражает это по-русски, не ослабляя интенсивности ualde.
- source_word: ad altissimum
  choice: Всевышнему
  rationale: Дательный падеж естественно передаёт направление речи к Богу и сохраняет титул Altissimus.
- source_word: uerba timorata
  choice: слова, исполненные трепета
  rationale: Формулировка сохраняет существительное «слова» и передаёт timorata как слова, произносимые со страхом и благоговейной робостью, не превращая их в «страшные» для слушателя.
theological_decisions:
- issue: Характер страха в обращении к Всевышнему
  choice: трепета
  alternative: страха
  rationale: «Трепет» допускает сочетание страха, робости и благоговения перед Богом; примечание сохраняет более прямое значение латинского timorata и не навязывает исключительно благоговейное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Порядок фразы близок к латинскому, при этом синтаксис остаётся естественным для русского.
