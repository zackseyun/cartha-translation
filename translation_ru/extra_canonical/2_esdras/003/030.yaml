revisions:
- from: Ибо я видел, как Ты терпишь согрешающих и щадишь поступающих нечестиво[a], а народ Твой погубил и врагов Твоих сохранил — и не объяснил этого.
  to: Ибо я видел, как Ты терпишь согрешающих и пощадил поступающих нечестиво, а народ Твой погубил и врагов Твоих сохранил — и не объяснил этого.
  rationale: «Пощадил» заменяет «щадишь», чтобы передать латинский перфект pepercisti и сохранить контраст с настоящим sustines. Удалены сноска и якорь, поскольку прежняя сноска представляла требуемую исходником форму как необязательный вариант. Остальная формулировка сохранена, включая осторожное анафорическое «этого» при эллиптическом non significasti.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:49Z'
