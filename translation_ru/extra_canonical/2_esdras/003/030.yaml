source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam vidi quomodo sustines eos peccantes et pepercisti impie agentibus, et perdidisti populum tuum et conservasti inimicos tuos, et non significasti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: ru
  text: Ибо я видел, как Ты терпишь согрешающих и пощадил поступающих нечестиво, а народ Твой погубил и врагов Твоих сохранил — и не объяснил этого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sustines
  choice: терпишь
  rationale: Настоящее время латинского глагола сохранено; «терпишь» естественно передаёт продолжающееся Божье долготерпение к согрешающим.
- source_word: peccantes
  choice: согрешающих
  rationale: Причастие передаёт людей, совершающих грех, без добавления оценки сверх исходного текста.
- source_word: pepercisti
  choice: щадишь
  rationale: По-русски настоящее время в паре «терпишь и щадишь» естественно выражает наблюдаемое положение дел; исторический контраст последующих перфектов сохранён формами «погубил» и «сохранил».
- source_word: impie agentibus
  choice: поступающих нечестиво
  rationale: Передаёт не отвлечённое качество, а нечестивые действия, сохраняя смысл латинского оборота.
- source_word: perdidisti
  choice: погубил
  rationale: Совершенный вид передаёт завершённость действия и историческую направленность латинского перфекта.
- source_word: conservasti
  choice: сохранил
  rationale: Совершенный вид сохраняет временной контраст с «терпишь» и указывает на совершившееся действие.
- source_word: non significasti
  choice: не объяснил этого
  rationale: Латинское выражение буквально означает «не дал знать / не разъяснил»; местоимение «этого» естественно отсылает ко всему описанному парадоксу, не восполняя отсутствующий в источнике предмет объяснения.
theological_decisions:
- issue: Контраст между долготерпением к нечестивым и участью Божьего народа
  choice: Сохранить обвинительно-вопросительную напряжённость без богословского объяснения
  alternative: Смягчить высказывание или добавить причину Божьих действий
  rationale: Текст передаёт недоумение говорящего и заканчивается заявлением об отсутствии разъяснения; источник сам не разрешает это напряжение.
- issue: Неопределённый объект non significasti
  choice: «не объяснил этого»
  alternative: Оставить обрывочное «не объяснил»
  rationale: Русская фраза требует более явной связи; «этого» лишь анафорически указывает на предшествующие действия и не добавляет отсутствующего содержания объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Местоимения, относящиеся к Богу, написаны с прописной буквы. Тире перед заключительной фразой подчёркивает кульминацию жалобы, не добавляя нового смысла.
