  source_fidelity: 'Требуется исправление времени у pepercisti: это латинский перфект («Ты пощадил»), тогда как в основном тексте стоит настоящее «щадишь». Контраст sustines («терпишь») с pepercisti, perdidisti и conservasti (перфекты) значим и должен быть сохранён. Остальные соответствия в целом точны; заключительное non significasti допустимо передано как «не объяснил этого», где «этого» анафорически отсылает к описанному положению дел.'
  naturalness: 'После замены «щадишь» на «пощадил» фраза остаётся естественной для современного литературного русского: «Ты терпишь... и пощадил..., а народ Твой погубил...» ясно передаёт жалобный контраст оригинала.'
  terminology: «Согрешающих», «поступающих нечестиво», «народ Твой», «врагов Твоих» и «погубил» уместны и не привносят конфессионального истолкования. «Сохранил» приемлемо для conservasti.
