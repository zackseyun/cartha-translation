  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: ru
  text: Ты заставил бездны трепетать и привёл век в смятение. Твоя слава прошла через четверо врат — огонь, землетрясение, ветер и мороз,[a] — чтобы дать закон семени Иакова и поколению Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «Твоя слава прошла через четверо врат — огонь, землетрясение, ветер и мороз» трудна и по тексту, и по образности. Перевод сохраняет необычный теофанический образ латинского текста, не согласуя его искусственно с книгой Исход.
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: бездны
  rationale: Сохраняет множественное число и возвышенный космологический образ латинского текста.
- source_word: saeculum
  choice: век
  rationale: Передаёт временно-космическую неоднозначность saeculum, не сводя его однозначно к «миру» или определённой эпохе.
- source_word: portas quattuor
  choice: четверо врат
  rationale: Естественная для русского языка собирательная конструкция, сохраняющая буквальный образ четырёх врат.
- source_word: spiritus
  choice: ветер
  rationale: В перечне природных теофанических явлений контекстуально вероятнее значение «ветер», хотя слово также может означать «дух».
- source_word: gelus
  choice: мороз
  rationale: Передаёт холод как природное явление и сохраняет необычность перечисления.
- source_word: legem
  choice: закон
  rationale: Прямое соответствие латинскому legem; один объект глагола «дать» относится к обоим адресатам — семени Иакова и поколению Израиля.
theological_decisions:
- issue: Необычный образ славы, проходящей через четверо врат
  choice: Сохранить образ без согласования с рассказом Исхода
  alternative: Переформулировать перечисление как обычные знамения при богоявлении
  rationale: Латинский текст синтаксически ясен, но образно труден; его богословское напряжение не следует устранять толкованием.
- issue: Объект, данный поколению Израиля
  choice: Отнести «закон» к обоим параллельным адресатам
  alternative: Вслед за английским консультационным текстом добавить «твою заповедь»
  rationale: В предоставленном латинском источнике после et generationi Israel отдельного слова со значением «заповедь» нет; добавление внесло бы отсутствующий элемент.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранены параллелизм, космологическая образность и необычность исходного перечисления; архаизмы ограничены устойчивыми словами «бездна» и «врата».
