  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: ru
  text: И снова, в своё время, Ты навёл потоп на обитателей мира и погубил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  choice: И снова
  rationale: Передаёт повторность iterum и связующую функцию autem естественным современным русским выражением.
- source_word: in tempore
  choice: когда пришло время
  rationale: Сохраняет временное значение оборота, избегая неестественного буквального «во времени»; не уточняет, о каком именно сроке идёт речь.
- source_word: diluuium
  choice: потоп
  rationale: Обычное и контекстуально точное обозначение всемирного потопа.
- source_word: super habitantes saeculum
  choice: на жителей мира
  rationale: Передаёт конструкцию с habitantes и saeculum в значении обитаемого мира; «жители мира» звучит ясно и достойно.
- source_word: perdidisti eos
  choice: погубил их
  rationale: Точно передаёт perdidisti без смягчения смысла.
theological_decisions:
- issue: Божественное действие в отношении потопа и гибели людей
  choice: Ты навёл потоп… и погубил их
  alternative: Ты допустил потоп… и они погибли
  rationale: 'Латинский текст прямо приписывает Богу оба действия: induxisti и perdidisti; перевод сохраняет эту богословскую напряжённость, не смягчая причинность.'
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу.
