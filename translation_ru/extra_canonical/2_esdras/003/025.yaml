  text: Это происходило много лет. И жители города покинули его[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оставили»; в латинском тексте не сказано прямо, кого или что они оставили. Здесь подразумевается город.'
