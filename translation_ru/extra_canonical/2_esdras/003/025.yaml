lexical_decisions:
- source_word: factum est hoc annis multis
  choice: Так продолжалось много лет
  rationale: В контексте длительности оборот передан естественным русским выражением; оно сохраняет смысл того, что описанное положение длилось многие годы.
- source_word: qui habitabant civitatem
  choice: жители города
  rationale: Естественная и точная передача латинского описательного оборота «те, кто населял город».
- source_word: dereliquerunt
  choice: покинули
  rationale: Глагол передаёт основное значение derelinquere — оставить, покинуть; местоимение «его» восполняет невыраженное в латинском тексте дополнение по ближайшему существительному «город».
theological_decisions:
- issue: Не выраженное в латинском тексте дополнение при dereliquerunt
  choice: «покинули его», где «его» относится к городу
  alternative: «оставили его/Его» с отнесением к Богу либо иному подразумеваемому объекту
  rationale: Латинский текст не называет объект прямо. Ближайший грамматически доступный референт — civitatem («город»), что согласуется с консультационным английским текстом; неопределённость отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественно-нейтральное. Конечная запятая сохранена, поскольку стих синтаксически ведёт к продолжению.
