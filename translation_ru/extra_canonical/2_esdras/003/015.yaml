  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: ru
  text: И Ты заключил с ним вечный завет и сказал, что никогда не оставишь его потомство.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: disposuisti ei testamentum aeternum
  choice: заключил с ним вечный завет
  rationale: Латинское testamentum в данном контексте означает завет; естественная русская формула «заключить завет» передаёт установление заветных отношений.
- source_word: semen
  choice: потомство
  rationale: Буквально «семя»; в контексте обещания Аврааму обозначает его потомков. «Потомство» ясно и естественно для современного русского читателя.
- source_word: non unquam derelinqueres
  choice: никогда не оставишь
  rationale: Передаёт усиленное отрицание и обещание не покидать потомство Авраама.
theological_decisions:
- issue: Смысл слова semen
  choice: потомство
  alternative: семя
  rationale: Латинская форма допускает собирательное обозначение потомков; контекст не требует вводить христологическое уточнение, поэтому сохранён общий смысл без конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык; сохранены торжественность молитвенного обращения и заглавная буква в местоимении, относящемся к Богу. Начальное «И» отражает связность повествования.
