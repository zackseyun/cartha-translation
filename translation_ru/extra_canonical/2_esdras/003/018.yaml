  text: eius ex Aegypto, et adduxisti eos super montem Sina. Et inclinasti caelos, et statuisti terram, et commouisti orbem, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/018.yaml
  text: you bent down the heavens[a], established the earth, and moved the world,
translation:
  language: ru
  text: Ты склонил небеса, утвердил землю[a] и привёл мир в движение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде древних версий: «потряс землю».'
    reason: 'Текстологическое разночтение: латинское statuisti означает «утвердил, установил», тогда как сирийская и эфиопская традиции поддерживают чтение «потряс».'
lexical_decisions:
- source_word: inclinasti caelos
  choice: склонил небеса
  rationale: Передаёт образ нисхождения небес без добавочного истолкования; глагол «склонить» естественен для латинского inclinare.
- source_word: statuisti terram
  choice: утвердил землю
  rationale: 'Прямо отражает чтение основного латинского текста: «установил, утвердил землю».'
- source_word: commouisti orbem
  choice: привёл мир в движение
  rationale: Сохраняет отличие commouisti от возможного варианта «потряс» в предыдущей клаузе; orbis здесь означает обитаемый мир или мировой круг, естественно передаваемый как «мир».
theological_decisions:
- issue: Описание Божьего действия при Синае
  choice: Сохранено космическое описание без сведения его к метафоре или буквальному физическому событию.
  alternative: Истолковать выражения как поэтическое описание землетрясения при явлении Бога.
  rationale: Текст не уточняет характер этих действий, поэтому перевод сохраняет образность и богословское напряжение.
- issue: Разночтение statuisti / «потряс»
  choice: В основном тексте переведено засвидетельствованное латинское statuisti — «утвердил».
  alternative: «Потряс землю» по свидетельству ряда древних версий и предполагаемому греческому чтению.
  rationale: Заданным оригинальным источником является очищенный латинский текст Бенсли; значимое древнее разночтение вынесено в примечание, а не молча принято в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм трёх действий сохранён; местоимение «Ты» пишется с прописной буквы как обращение к Богу в молитвенном контексте.
