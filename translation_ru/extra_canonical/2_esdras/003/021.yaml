  terminology: «Первый Адам», «злое сердце» и «был побеждён» точны и не вводят богословского объяснения того, кем был побеждён Адам. «Преступил» точнее отражает transgressus, не конкретизируя прямо упомянутый в предыдущем контексте закон.
