  source_fidelity: 'Начальный фрагмент латинской строки («lex tua in eis fructum») действительно относится к предыдущему предложению и не требует включения в перевод стиха. Основное предложение передано в целом верно. Однако латинское эллиптическое «sed et omnes qui ex eo nati [sunt]» по смыслу продолжает оба сказуемых: потомки Адама также преступили и были побеждены. Оборот «то же случилось» передаёт общий итог, но ослабляет эту двучленную параллель и превращает действия в безличное событие. «Нарушил закон» допустимо контекстуально, но добавляет объект, отсутствующий при transgressus в данном предложении.'
