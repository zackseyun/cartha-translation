  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: ru
  text: Ибо первый Адам, нося в себе злое сердце, преступил и был побеждён; так же преступили и были побеждены все, родившиеся от него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Cor enim malignum baiolans
  choice: Ибо… нося в себе злое сердце
  rationale: Передаёт образ baiolans («неся, нося») без неестественного русского оборота; «в себе» ясно связывает сердце с внутренним состоянием Адама.
- source_word: transgressus
  choice: нарушил закон
  rationale: В непосредственном контексте речь идёт о Божьем законе (lex tua); явное дополнение делает фразу естественной по-русски, не меняя смысла.
- source_word: victus est
  choice: был побеждён
  rationale: Сохраняет пассивную форму и не уточняет, кем или чем Адам был побеждён.
- source_word: sed et omnes qui ex eo nati
  choice: то же случилось и со всеми, кто родился от него
  rationale: 'Естественно восполняет эллиптическое продолжение: оба сказуемых относятся также ко всем потомкам Адама.'
theological_decisions:
- issue: Связь проступка и поражения Адама с его потомками
  choice: то же случилось и со всеми
  alternative: таковы и все родившиеся от него
  rationale: Формулировка сохраняет утверждение текста, что сказанное об Адаме распространяется на его потомков, но не вводит дополнительного объяснения механизма наследования или вины.
- issue: Кем или чем Адам был побеждён
  choice: не уточнять субъект действия
  alternative: был побеждён грехом
  rationale: Латинский пассив victus est не называет победителя; добавление «грехом» устранило бы подлинную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальный обрывок «lex tua in eis fructum» относится к предшествующему контексту и не включён в текст данного стиха, согласно границе, подтверждаемой консультационным английским текстом.
