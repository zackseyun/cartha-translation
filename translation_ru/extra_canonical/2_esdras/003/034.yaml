source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: ru
  text: Итак, взвесь на весах наши беззакония и беззакония живущих в мире — и станет видно, куда отклонится указатель весов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет обнаружено движение указателя — куда он отклонится». Латинское выражение momentum puncti трудно: оно может обозначать отклонение или перевес, а punctum — указатель либо точку весов.'
    reason: Сохраняет отмеченную в источнике неоднозначность выражения momentum puncti, не приписывая ей единственное бесспорное значение.
lexical_decisions:
- source_word: pondera in statera
  choice: взвесь на весах
  rationale: Естественно передаёт повеление взвесить две стороны на весах, сохраняя образ латинского текста.
- source_word: iniquitates
  choice: беззакония
  rationale: Передаёт нравственно-религиозный смысл iniquitas и соответствует возвышенному библейскому регистру.
- source_word: qui habitant in saeculo
  choice: живущих в мире
  rationale: В данном контексте saeculum обозначает обитаемый мир или нынешний век; краткое «в мире» естественно по-русски и не сужает выражение до отдельной местности.
- source_word: momentum puncti ubi declinet
  choice: в какую сторону склонится чаша
  rationale: 'Передаёт итог сравнения на весах понятным русским образом. Латинская фраза трудна: momentum может обозначать движение, перевес или отклонение, а punctum — точку либо указатель.'
theological_decisions:
- issue: Сопоставление вины «наших» и жителей мира
  choice: Сохранено прямое сравнение без пояснения, чьи беззакония окажутся тяжелее.
  alternative: Указать предполагаемый исход взвешивания.
  rationale: Источник формулирует вопрос через образ весов и не сообщает результат прямо; богословское напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире помогает ясно связать взвешивание с его результатом; образ чаши весов добавлен как естественная русская экспликация подразумеваемого устройства весов.
