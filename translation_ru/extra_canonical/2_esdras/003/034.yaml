  rationale: Перевод финального образа уточнён в соответствии с наиболее вероятным значением momentum puncti и с синтаксисом ubi declinet как косвенного вопроса. Примечание переработано, чтобы честно отразить текстологическую и лексическую неопределённость, не оставляя неясной русской формулировки.
