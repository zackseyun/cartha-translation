    rationale: Русский глагол «отнять» с родительным падежом здесь может восприниматься как отнятие некоего принадлежащего им «злого сердца». Замена на «не удалил из них злое сердце» яснее выражает устранение внутреннего нравственного начала, не добавляя богословского истолкования.
