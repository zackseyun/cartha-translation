  source_fidelity: 'Латинское «Et non abstulisti ab eis cor malignum, ut faceret lex tua fructum in eis» передано по смыслу точно: речь о том, что Бог не устранил злое сердце, и закон должен был принести плод в этих людях. Целевая конструкция «чтобы» оправданна и не подменяет ut причинным выводом.'
  naturalness: «Не отнял у них злого сердца» формально возможно, но для современного литературного русского звучит несколько тяжеловесно и неопределённо. «Не удалил из них злое сердце» естественнее, при этом сохраняет образ внутреннего злого сердца и пространственно-внутреннюю направленность исходного выражения.
  terminology: «Злое сердце» удачно сохраняет библейскую антропологическую метафору cor malignum. «Закон» и «плод» соответствуют lex и fructum; прописное «Твой» последовательно для обращения к Богу.
