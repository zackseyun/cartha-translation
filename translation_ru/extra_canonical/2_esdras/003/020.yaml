  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: ru
  text: Но Ты не удалил из них злое сердце, чтобы Твой закон принёс в них плод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non abstulisti ab eis
  choice: не отнял у них
  rationale: Сохраняет прямой образ латинского auferre ab — «отнять, удалить от» — без добавления отсутствующего в источнике объяснения.
- source_word: cor malignum
  choice: злого сердца
  rationale: Точно передаёт нравственный смысл malignum и сохраняет библейский образ сердца как средоточия внутренней направленности человека.
- source_word: faceret … fructum in eis
  choice: принёс в них плод
  rationale: Передаёт метафору плодоношения закона и сохраняет необычное, но значимое указание на внутреннее действие — in eis.
theological_decisions:
- issue: Связь злого сердца и плодотворности закона
  choice: Сохранена целевая конструкция «чтобы Твой закон принёс в них плод»
  alternative: «и потому Твой закон не мог принести в них плод»
  rationale: Латинское ut выражает цель/предполагаемый результат; причинное перефразирование излишне разрешило бы заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский с сохранением торжественного библейского регистра. Местоимения, обращённые к Богу, даны с прописной буквы. Формулировка остаётся ясной и близкой к латинской синтаксической структуре.
