source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: ru
  text: И ему Ты дал Свою заповедь, но он преступил её; и тотчас Ты определил смерть ему и его потомкам. От него произошли бесчисленные народы и племена, народности и роды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandasti diligentiam tuam
  choice: Ты дал Свою заповедь
  rationale: 'Латинское выражение необычно: diligentia буквально связано с усердием или тщательностью, но mandare и контекст преступления указывают на данное Богом повеление. «Дал Свою заповедь» естественно по-русски и не добавляет отсутствующего в источнике акцента на единственности.'
- source_word: praeteriit eam
  choice: он преступил её
  rationale: Praeterire здесь означает нарушить или преступить заповедь; местоимение сохраняет связь с ней.
- source_word: instituisti ... mortem
  choice: Ты определил смерть
  rationale: Передаёт действие установления или назначения смерти, не уточняя сверх текста способ исполнения приговора.
- source_word: in nationibus eius
  choice: его потомкам
  rationale: Буквально оборот необычен — «в его народах»; по смыслу речь идёт о смерти, распространяющейся на произошедшие от него поколения. «Потомкам» ясно выражает эту родовую связь.
- source_word: gentes et tribus, populi et cognationes
  choice: народы и племена, народности и роды
  rationale: Сохранён четырёхчленный перечень социальных и родственных общностей без искусственного сведения близких латинских терминов к одному слову.
- source_word: quorum non est numerus
  choice: бесчисленные
  rationale: Естественная русская передача буквального «которым нет числа»; смысл относится ко всему перечню.
theological_decisions:
- issue: Распространение смерти от первого человека на его потомство
  choice: смерть ему и его потомкам
  alternative: смерть в нём и в его народах
  rationale: Выбран ясный русский смысл латинского in eum ... et in nationibus eius без дальнейшего догматического объяснения механизма или характера наследования смерти.
- issue: Характер данного повеления
  choice: Свою заповедь
  alternative: Своё единственное повеление
  rationale: Источник не выражает явно единственность; поэтому она не добавлена, а сам предмет сохранён как Божья заповедь.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Синтаксис слегка уплотнён в последнем предложении ради естественности, при сохранении всех смысловых компонентов латинского текста.
