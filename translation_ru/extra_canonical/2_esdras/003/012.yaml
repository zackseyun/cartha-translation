  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: ru
  text: И когда живущие на земле начали умножаться, они умножили число детей, народов и многих племён и снова начали совершать нечестие больше прежних.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est cum
  choice: И когда
  rationale: Естественная русская повествовательная связь; буквальное «И случилось, когда» здесь было бы тяжеловесным и не добавляло бы смысла.
- source_word: multiplicari / multiplicauerunt
  choice: стали умножаться / стало больше
  rationale: Сохраняется повтор корня и нарастание численности, но второй оборот передан идиоматично; буквальное «умножили детей и народы» по-русски неестественно.
- source_word: populos et gentes multas
  choice: народов и множества племён
  rationale: Различие между populi и gentes передано как «народы» и «племена», без чрезмерно современного политического оттенка слова «нации».
- source_word: impietatem facere
  choice: поступать нечестиво
  rationale: Передаёт деятельный характер латинского выражения и его религиозно-нравственный смысл.
- source_word: plus quam priores
  choice: ещё хуже, чем их предшественники
  rationale: 'В контексте нечестивых поступков сравнительное plus естественно выражается как усиление степени: «ещё хуже»; priores обозначает живших прежде.'
theological_decisions:
- issue: Характер нечестия последующих поколений
  choice: «поступать нечестиво — ещё хуже»
  alternative: «совершать больше нечестия»
  rationale: Источник допускает количественный или степенной оттенок plus. Выбран естественный русский способ выразить превосходство в нечестивом поведении, не уточняя конкретных грехов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты последовательности событий; архаизмы и конфессионально маркированная лексика не вводятся.
