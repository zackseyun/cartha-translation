  yaml_path: translation/extra_canonical/2_esdras/003/004.yaml
  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: ru
  text: 'И я сказал: «О Господь, Владыка, не Ты ли сказал с самого начала, когда сотворил землю — и Ты один сделал это — и повелел праху'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Владыка Господь
  rationale: Передаёт удвоенное обращение и смысл господства без неестественной русской конструкции «Господствующий Господь».
- source_word: ab initio
  choice: изначально
  rationale: Сохраняет возможный временной смысл «от начала / в начале» и естественно звучит в современном литературном русском.
- source_word: plasmasti
  choice: сотворил
  rationale: В контексте создания земли выражает формирование и созидание; «сотворил» понятно широкому читателю и сохраняет высокий регистр.
- source_word: et hoc solus
  choice: и сделал это один
  rationale: Сохраняет акцент латинского текста на том, что Бог совершил это без соучастника.
- source_word: imperasti pulveri
  choice: повелел праху
  rationale: Точно передаёт управление дательным падежом в латинском и оставляет фразу незавершённой, как в исходном стихе.
theological_decisions:
- issue: Единоличное действие Бога при сотворении
  choice: «и сделал это один»
  alternative: «и только Ты один»
  rationale: Выбранная формулировка прямо связывает solus с действием сотворения и не добавляет отсутствующего в тексте противопоставления другим деятелям.
- issue: Значение ab initio
  choice: «изначально»
  alternative: «в начале»
  rationale: «Изначально» сохраняет оттенок исходного момента или состояния, не вынуждая понимать выражение как точную цитату Бытия 1:1.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Местоимение «Ты» в обращении к Богу написано с прописной буквы. Синтаксическая незавершённость в конце сохранена, поскольку мысль продолжается в следующем стихе.
