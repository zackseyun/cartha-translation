  text: 'И одна участь постигла их всех: как Адама постигла смерть, так и этих постиг потоп.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus corum
  choice: их всех одна участь
  rationale: Латинский текст, вероятно, передаёт смысл общего для всех жребия или исхода. «Одна участь» сохраняет числовой оттенок uno и звучит естественно по-русски.
- source_word: sicut Adac mors
  choice: как Адама постигла смерть
  rationale: В очищенном тексте Adac понимается как искажённое Adae. Глагол «постигла» естественно восполняет эллиптическую конструкцию и связывает обе части сравнения.
- source_word: sic et his diluuium
  choice: так и их — потоп
  rationale: His указывает на ранее названных людей; «и» передаёт et, а тире сохраняет лаконичный параллелизм при подразумеваемом глаголе «постиг».
