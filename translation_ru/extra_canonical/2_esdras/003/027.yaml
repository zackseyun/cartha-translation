lexical_decisions:
- source_word: tradidisti
  choice: предал
  rationale: Точно передаёт совершённое действие передачи города во власть врагов и сохраняет суровую смысловую окраску латинского глагола.
- source_word: civitatem tuam
  choice: Свой город
  rationale: Естественная русская возвратная форма при обращении к Богу; «город» соответствует civitas в данном контексте.
- source_word: in manus
  choice: в руки
  rationale: Сохраняет библейскую метафору власти и подчинения.
- source_word: inimicorum tuorum
  choice: Своих врагов
  rationale: Передаёт принадлежность, выраженную tuorum, без добавочного толкования.
theological_decisions:
- issue: Божье действие в падении города
  choice: «Ты предал»
  alternative: «Ты отдал»
  rationale: Формулировка прямо сохраняет приписывание действия Богу в исходном тексте и не смягчает содержащегося в нём богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма; структура стиха сохранена краткой и прямой.
