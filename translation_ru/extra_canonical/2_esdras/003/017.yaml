lexical_decisions:
- source_word: in multitudine magna
  choice: во множестве великом
  rationale: Сохраняет смысл и порядок латинской фразы; строчная буква отражает продолжение предложения из предыдущего стиха.
- source_word: Et factum est
  choice: И случилось
  rationale: Естественное и достаточно формальное соответствие латинской повествовательной формуле.
- source_word: cum educeres
  choice: когда Ты вывел
  rationale: В данном оборванном фрагменте прошедшее совершенного вида по-русски естественно передаёт действие, вводимое cum, не дополняя отсутствующее продолжение.
- source_word: semen
  choice: потомство
  rationale: В контексте народа латинское semen обозначает потомство; вариант «семя» был бы менее естественным и мог бы восприниматься буквально.
theological_decisions:
- issue: Референт слова semen
  choice: потомство без притяжательного местоимения
  alternative: его потомство / семя
  rationale: Предоставленный латинский фрагмент не содержит eius («его»), поэтому притяжательность не добавляется; неоднозначность референта сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавное «Ты» обозначает обращение к Богу. Текст намеренно остаётся синтаксически незавершённым, поскольку исходный сегмент обрывается после semen; отсутствующие слова из более широкого контекста не восстанавливаются.
