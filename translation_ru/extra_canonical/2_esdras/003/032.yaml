id: 2ES.3.32
reference: 2 Esdras 3:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut alia gens cognovit te praeter Israhel? aut quae tribus crediderunt testamentis sicut haec Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: ru
  text: Или знал ли Тебя какой-нибудь другой народ, кроме Израиля? Или какие племена поверили заветам так, как эти племена Иакова?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Латинское выражение «haec Iacob» грамматически необычно; возможно также буквальное прочтение: «как этот Иаков».'
    reason: Сохраняет засвидетельствованную неоднозначность трудной латинской конструкции и отражает альтернативу консультационного английского текста.
lexical_decisions:
- source_word: alia gens
  choice: какой-нибудь другой народ
  rationale: Латинское сочетание означает не «какой другой народ», а в вопросительном контексте «какой-нибудь иной народ».
- source_word: cognovit te
  choice: знал ли Тебя
  rationale: Сохраняет прямой смысл cognoscere и личное обращение к Богу без добавочного богословского толкования.
- source_word: tribus
  choice: племена
  rationale: В контексте Израиля и Иакова речь идёт о родоплеменных группах; «племена» естественно и понятно по-русски.
- source_word: crediderunt testamentis
  choice: поверили заветам
  rationale: Credere с дательным падежом передаёт доверие или веру; testamenta здесь — «заветы», без отсутствующего в латинском притяжательного местоимения.
- source_word: haec Iacob
  choice: эти племена Иакова
  rationale: Haec, вероятно, позднелатинская форма вместо hae либо субстантивированное указание на ранее названные tribus; Iacob понимается как несогласуемое имя в значении принадлежности.
theological_decisions:
- issue: Относится ли «заветам» притяжательное «Твоим»
  choice: заветам
  alternative: Твоим заветам
  rationale: В латинском тексте притяжательное местоимение отсутствует; хотя контекст допускает заветы Бога, добавлять это уточнение в основном тексте не следует.
- issue: Как понимать грамматически трудное haec Iacob
  choice: эти племена Иакова
  alternative: этот Иаков
  rationale: Форма haec не согласуется с мужским именем Iacob, тогда как по смыслу и ближайшему антецеденту естественно отнести её к tribus. При этом необычная латинская конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Тебя» написано с прописной буквы как уважительное обращение к Богу. Повтор «Или» сохраняет риторический параллелизм оригинала.
