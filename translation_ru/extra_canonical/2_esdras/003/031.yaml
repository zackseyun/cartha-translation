  naturalness: Нужно сохранить обозначение межстихового продолжения, но повторить подразумеваемый из предыдущего стиха глагол после многоточия. Это делает русский текст цельным и не меняет смысла латинского зависимого фрагмента.
  terminology: «Вавилон» и «Сион» переданы нормативно. «Поступает лучше» нейтрально и не навязывает толкования meliora как исключительно «добрых дел». Сноска с вариантом «делает больше добра» чрезмерно сужает значение и не нужна для передачи существенной текстовой неоднозначности.
