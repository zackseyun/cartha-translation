translation:
  language: ru
  text: …и никому не открыл, как следует оставить этот путь. Разве Вавилон поступает лучше Сиона?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nihil nemini
  choice: никому ничего
  rationale: Передаёт двойное отрицание латинского оборота естественной русской отрицательной конструкцией; фраза синтаксически продолжает предыдущий стих.
- source_word: quomodo debeat derelinqui via haec
  choice: о том, как следует оставить этот путь
  rationale: Сохраняет модальность debeat и образ пути, не уточняя, кто именно должен его оставить.
- source_word: numquid
  choice: разве
  rationale: Передаёт риторический вопрос, предполагающий отрицательный ответ.
- source_word: meliora facit
  choice: поступает лучше
  rationale: Естественный русский эквивалент сравнительного выражения; буквальное «делает лучшее» здесь звучало бы неясно.
- source_word: Babylon quam Sion
  choice: Вавилон … лучше Сиона
  rationale: Сохраняет прямое сопоставление двух городов и не привносит толкования их символического значения.
theological_decisions:
- issue: Сопоставление Вавилона и Сиона
  choice: Разве Вавилон поступает лучше Сиона?
  alternative: Разве Вавилон делает больше добра, чем Сион?
  rationale: Латинское meliora facit допускает оттенок «делает лучшее/больше добра», но нейтральное «поступает лучше» сохраняет широту сравнения и не сужает его до нравственных добрых дел.
- issue: Связь начального фрагмента с предыдущим стихом
  choice: Начальное многоточие показывает синтаксическое продолжение предыдущего стиха
  alternative: Добавить в скобках подразумеваемый глагол «не открыл»
  rationale: Латинский текст этого стиха начинается зависимым фрагментом, продолжающим et non significasti предыдущего стиха; многоточие сохраняет принятую разбивку стихов без внесения отсутствующего здесь глагола в основной текст.
translation_notes:
  register: Современный литературный русский, сдержанный и понятный. Начальное многоточие отмечает, что стих начинается в середине предложения вследствие источниковой разбивки; риторическая острота вопроса сохранена.
