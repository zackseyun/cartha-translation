  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: ru
  text: И случилось, когда они творили беззаконие пред Тобой, Ты избрал Себе одного из них, которому
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem facerent
  choice: творили беззаконие
  rationale: Передаёт повторяющееся или продолжающееся действие латинского imperfectum и сохраняет библейски возвышенный, но понятный регистр.
- source_word: coram te
  choice: пред Тобой
  rationale: Точное и естественное в данном регистре соответствие со значением действия перед лицом Бога.
- source_word: elegisti tibi
  choice: Ты избрал Себе
  rationale: Сохраняет возвратный оттенок латинского дательного tibi, не ослабляя его до простого «избрал».
- source_word: ex his unum
  choice: одного из них
  rationale: Не добавляет отсутствующее в источнике слово «человека» и естественно передаёт выбор одного из данной группы.
- source_word: cui
  choice: которому
  rationale: Сохраняет незавершённость исходного фрагмента и синтаксическую связь со следующим стихом или продолжением предложения.
theological_decisions:
- issue: Объект Божьего избрания
  choice: одного из них
  alternative: одного человека из них
  rationale: Латинское unum обозначает «одного», но не содержит существительного «человека»; добавление могло бы неоправданно конкретизировать текст.
- issue: Направленность избрания
  choice: избрал Себе
  alternative: избрал
  rationale: Сохранено tibi, поскольку оно подчёркивает избрание Богом для Себя, не вводя дальнейшего толкования цели избрания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Союз «И» естественно продолжает предшествующий контекст; формула «пред Тобой» сохраняет торжественный регистр. Конечное «которому» намеренно оставлено незавершённым, как в предоставленном латинском отрывке.
