  source_fidelity: В черновике точно переданы imperfectum «творили», coram te («пред Тобой»), tibi («Себе»), ex his unum («одного из них») и незавершённое cui («которому»). Однако опущено самостоятельное вводное Et factum est («И случилось / И было»), присутствующее в латинском тексте и английском аудиторском следе.
  naturalness: «И когда они…» грамматически естественно, но из-за пропуска Et factum est неполно передаёт исходную формулу. «И случилось, когда…» — допустимая для умеренно библейского современного литературного регистра передача, сохраняющая продолжительный характер фрагмента.
  terminology: «Творили беззаконие», «пред Тобой» и «избрал Себе» уместны и точны. «Одного из них» верно не вносит отсутствующего в латинском уточнения «человека».
