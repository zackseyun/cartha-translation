source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: ru
  text: И каждый народ следовал своей воле[a], поступал нечестиво пред Тобой и презирал Тебя, а Ты не препятствовал им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ходил в своей воле».'
    reason: Сохраняет образное устройство латинского выражения ambulauit ... in uoluntate sua и его возможный семитский фон.
lexical_decisions:
- source_word: ambulauit
  choice: жил
  rationale: Латинское «ходил» передаёт образ жизненного пути; в современном русском «жил» естественно выражает этот смысл, не создавая впечатления буквального передвижения.
- source_word: unaquaeque gens
  choice: каждый народ
  rationale: Точно передаёт распределительное значение unaquaeque и коллективное gens.
- source_word: in uoluntate sua
  choice: по своей воле
  rationale: Естественный русский эквивалент со значением самостоятельного следования собственным желаниям; буквальная конструкция сохранена в примечании.
- source_word: impie agebant
  choice: поступал нечестиво
  rationale: Передаёт как действия, так и их религиозно-нравственную оценку; согласование в единственном числе соответствует собирательному «каждый народ».
- source_word: spernebant
  choice: презирал Тебя
  rationale: Прямое значение spernere; объект восстановлен из контекста и соответствует английскому консультационному слою.
- source_word: non prohibuisti eos
  choice: Ты им не препятствовал
  rationale: Сохраняет прямое утверждение исходного текста о том, что Бог не остановил народы, без богословского смягчения.
theological_decisions:
- issue: Божье невмешательство в нечестие народов
  choice: «Ты им не препятствовал»
  alternative: «Ты их не остановил»
  rationale: Формулировка близка prohibuisti и сохраняет напряжение прямого обращения к Богу, не объясняя причин Его невмешательства.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. В обращении к Богу использованы прописные местоимения по принятой русской библейской традиции; синтаксис сделан плавным, но последовательность обвинений исходника сохранена.
