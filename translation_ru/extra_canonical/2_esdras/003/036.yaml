source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: homines quidem per nomina invenies servasse mandata tua, gentes autem non invenies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: ru
  text: Отдельных людей, поимённо, Ты, конечно, найдёшь — тех, кто соблюдал Твои заповеди, но народов не найдёшь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  choice: отдельных людей
  rationale: В противопоставлении gentes речь идёт о людях как отдельных лицах, а не о человечестве вообще; добавление «отдельных» естественно выражает этот контраст по-русски.
- source_word: quidem
  choice: ещё
  rationale: 'В сочетании с autem частица обозначает уступительно-противительный ход: отдельных людей найти всё же можно, но народов — нет.'
- source_word: per nomina
  choice: поимённо
  rationale: Передаёт возможность назвать или установить отдельных соблюдавших заповеди людей по именам, сохраняя акцент латинского выражения.
- source_word: servasse mandata tua
  choice: среди соблюдавших твои заповеди
  rationale: Инфинитив перфекта указывает на людей, которые соблюдали заповеди; русская конструкция естественна и не сужает значение до единственного поступка.
- source_word: gentes
  choice: целых народов
  rationale: «Народы» передаёт коллективное противопоставление отдельным людям; «целых» делает этот контраст ясным, не утверждая ничего сверх контекста.
theological_decisions:
- issue: Контраст между отдельными праведными людьми и народами
  choice: Сохранён как «отдельных людей… но целых народов»
  alternative: «Людей… но язычников»
  rationale: Латинское gentes здесь противопоставлено homines по признаку коллективности; перевод «язычники» внёс бы конфессионально-этническое толкование, которого данный стих сам по себе не требует.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Инверсия и эллипсис во второй части сохраняют краткость и риторическое противопоставление оригинала.
