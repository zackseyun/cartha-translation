revisions:
- from: Отдельных людей, поимённо, ты ещё найдёшь среди соблюдавших твои заповеди, но целых народов не найдёшь.
  to: Отдельных людей, поимённо, Ты, конечно, найдёшь — тех, кто соблюдал Твои заповеди, но народов не найдёшь.
  rationale: Убраны добавочные оттенки «ещё» и «целых», не выраженные латинским текстом; quidem передано словом «конечно». Сохранены противопоставление отдельных людей народам, акцент per nomina и совершённость servasse.
