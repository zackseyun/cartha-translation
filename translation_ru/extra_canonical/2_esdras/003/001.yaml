  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: ru
  text: В тридцатый год после разрушения города я находился в Вавилоне — я, Салафиил, называемый также Ездрой. Лёжа на постели, я пришёл в смятение, и мысли мои поднимались в моём сердце[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимались над моим сердцем» или «на моё сердце».'
    reason: Предлог super допускает пространственно-буквальную передачу, тогда как контекст отражает семитский оборот о мыслях, возникающих во внутреннем человеке.
lexical_decisions:
- source_word: anno tricesimo ruinae civitatis
  choice: В тридцатый год после разрушения города
  rationale: Латинский родительный ruinae допускает буквальное «в тридцатый год разрушения», но по смыслу обозначает отсчёт времени от падения города; выбран естественный современный русский оборот.
- source_word: Salathihel qui et Ezras
  choice: Салафиил, называемый также Ездрой
  rationale: Сохранены традиционные русские формы имён; qui et передаёт второе имя или наименование того же лица без уточнения его природы.
- source_word: conturbatus sum
  choice: я пришёл в смятение
  rationale: Передаёт сильную внутреннюю тревогу, не сводя её лишь к испугу или печали.
- source_word: cogitationes meae ascendebant super cor meum
  choice: мысли мои поднимались в моём сердце
  rationale: Сохранён образ восходящих мыслей и роль сердца как внутреннего средоточия размышлений; буквальное воспроизведение super как «над» или «на» по-русски было бы менее естественным.
