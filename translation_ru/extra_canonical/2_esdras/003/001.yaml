  source_fidelity: 'Перевод точно передаёт латинский текст: временной отсчёт после разрушения города, пребывание в Вавилоне, двойное именование рассказчика, его смятение во время лежания на постели и образ мыслей, восходящих «на/над сердцем». «После разрушения» является обоснованным смысловым раскрытием родительного оборота ruinae civitatis и согласуется с английским аудиторским текстом.'
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя сдержанный библейский регистр. Разделение длинного предложения на два не меняет синтаксических отношений или смысла. Оборот «мысли мои поднимались в моём сердце» несколько образен, но уместно сохраняет намеренно необычную метафору исходного текста.
  terminology: «Вавилон», «Салафиил» и «Ездра» переданы последовательно и в традиционно узнаваемых русских формах. «Пришёл в смятение» адекватно conturbatus sum и не вносит излишней психологической или богословской интерпретации. Сноска корректно отмечает буквальную пространственную сторону super, не выдавая один спорный нюанс за единственно возможный.
