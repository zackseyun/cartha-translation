  language: ru
  text: Его звали Авраамом. И Ты возлюбил его и открыл ему
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nomen erat Abraham
  choice: Его звали Авраамом
  rationale: Естественная современная русская передача латинского оборота «имя [его] было Авраам» без изменения смысла.
- source_word: dilexisti eum
  choice: Ты возлюбил его
  rationale: «Возлюбил» сохраняет возвышенный библейский регистр и прямое значение perfectum.
- source_word: demonstrasti ei
  choice: открыл ему
  rationale: В данном контексте означает, что Бог нечто явил или открыл Аврааму; дополнение остается невыраженным, как и в предоставленном латинском фрагменте.
theological_decisions:
- issue: Неявное дополнение при demonstrasti
  choice: Не восполнять содержание откровения
  alternative: Добавить предполагаемый предмет откровения из иных текстовых форм или контекста
  rationale: Предоставленный латинский источник заканчивается словами «demonstrasti ei»; добавление отсутствующего материала вышло бы за пределы исходных свидетельств.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Ты» написано с прописной буквы как традиционное уважительное обращение к Богу; союз «И» сохранен в начале второго предложения в соответствии с латинским Et.
