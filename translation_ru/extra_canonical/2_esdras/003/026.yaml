  source_fidelity: 'Основной смысл передан верно: in omnibus — «во всём», cor malignum — «злое сердце», а позднелатинское utebantur в данном контексте обоснованно передаётся как обладание, а не как намеренное «пользование». Однако et ipsi точнее и яснее передать личным подлежащим «они тоже», а не конструкцией «у них», которая несколько ослабляет параллель с Адамом.'
  naturalness: Предлагаемая редакция сохраняет плавный современный литературный русский синтаксис. Повтор глагола «поступали» делает сопоставление с Адамом и его потомками явным и не оставляет оборот «во всём поступая» без отчётливой глагольной опоры.
