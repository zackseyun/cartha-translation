  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: ru
  text: во всём поступая так, как поступали Адам и все его потомки; ведь и они тоже имели злое сердце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in omnibus facientes
  choice: во всём поступая
  rationale: Передаёт обстоятельственный оборот и всеохватность латинского in omnibus естественным современным русским выражением.
- source_word: omnes generationes eius
  choice: все его потомки
  rationale: В данном контексте generationes обозначает последующие поколения Адама; «потомки» ясно и естественно выражает этот смысл.
- source_word: utebantur ... cor malignum
  choice: у них было злое сердце
  rationale: Позднелатинское uti с обозначением качества или состояния может значить «иметь, обладать»; буквальное «пользовались» ошибочно внушало бы сознательное использование сердца как орудия.
- source_word: cor malignum
  choice: злое сердце
  rationale: Сохраняет ключевой образ сердца как средоточия нравственной направленности и не ослабляет оценку malignum.
theological_decisions:
- issue: Характер «злого сердца»
  choice: ведь и у них было злое сердце
  alternative: ведь и они пользовались злым сердцем
  rationale: Выбранный вариант передаёт состояние, приписываемое потомкам Адама, не добавляя идеи намеренного использования «злого сердца» и не определяя сверх текста, является ли оно унаследованным.
- issue: Определённость выражения cor malignum
  choice: злое сердце
  alternative: то злое сердце
  rationale: Латинский текст не требует указательного или определённого значения; русский вариант сохраняет образ без искусственного отождествления с заранее сформулированной доктриной.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный, с сохранением причинной связи через «ведь». Маркеры сносок не добавлены, поскольку источник не содержит подлинной текстовой неоднозначности, требующей примечания; прежняя английская сноска отражала отвергнутое лексическое решение.
