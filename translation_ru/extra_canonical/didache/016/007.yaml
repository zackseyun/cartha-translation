  text: 'but not of all, but as it was said: The Lord will come, and all the holy ones with him.'
translation:
  language: ru
  text: 'Но не всех, а как было сказано: «Придёт Господь, и все святые[a] с Ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение не уточняет, имеются ли в виду святые люди, ангелы или иные небесные существа.
    reason: Сохраняет неоднозначность οἱ ἅγιοι, не предлагая неестественную русскую замену и не предрешая референт выражения.
lexical_decisions:
- source_word: οὐ πάντων
  choice: не всех
  rationale: Сохраняет краткость и контекстуальную незавершённость греческого выражения, не добавляя подразумеваемого существительного.
- source_word: ὡς ἐρρέθη
  choice: как было сказано
  rationale: Естественно передаёт безличную форму и вводит цитату как ранее произнесённое Писанием.
- source_word: οἱ ἅγιοι
  choice: святые
  rationale: Прямое и традиционно понятное соответствие, сохраняющее возможность отнести выражение к освящённым людям или небесным святым существам.
- source_word: μετ᾽ αὐτοῦ
  choice: с Ним
  rationale: Точно передаёт совместность; прописная буква соответствует референции к Господу и норме религиозного русского регистра.
theological_decisions:
- issue: Кого обозначают οἱ ἅγιοι
  choice: Сохранить обобщённое «святые» и пояснить неоднозначность в сноске.
  alternative: «святые люди» или «святые ангелы»
  rationale: Греческий текст сам не уточняет референта; конкретизация сняла бы подлинную богословскую неоднозначность.
- issue: Эллипсис в οὐ πάντων
  choice: Сохранить «не всех» без добавления «умерших» или «воскресших».
  alternative: Восполнить подразумеваемую группу по контексту.
  rationale: Этот стих продолжает предшествующую мысль, а исходная формулировка намеренно кратка; добавление стало бы толкованием.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным звучанием цитаты. Повтор греческого противопоставления передан естественной русской конструкцией «не всех, а…».
