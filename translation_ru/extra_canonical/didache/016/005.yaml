source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: ru
  text: Тогда человеческий род войдёт в огонь испытания, и многие соблазнятся и погибнут, но те, кто останутся твёрды в своей вере, будут спасены самим проклятием[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «будут избавлены от самого проклятия». Греческое выражение допускает как инструментальное понимание («самим проклятием»), так и отделительное («из-под самого проклятия»).'
    reason: Сохраняет подлинную смысловую и синтаксическую неоднозначность ὑπ᾽ αὐτοῦ τοῦ καταθέματος, не подменяя существительное среднего рода личным обозначением «Проклятый».
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: человеческий род
  rationale: Буквально — «творение людей» или «человеческое творение». В данном контексте выражение обозначает человечество; «человеческий род» естественно по-русски и не превращает абстрактное собирательное выражение в отдельный акт сотворения.
- source_word: πύρωσις τῆς δοκιμασίας
  choice: огонь испытания
  rationale: πύρωσις передаёт образ огненного жара или горения, а δοκιμασία — проверку, испытание. Формулировка сохраняет образ и звучит естественнее, чем буквальное «горение испытания».
- source_word: σκανδαλισθήσονται
  choice: отступят
  rationale: В эсхатологическом контексте глагол означает не просто испытать замешательство, а споткнуться в вере, отпасть или отступить. «Отступят» ясно передаёт смысл без излишнего толкования причины.
- source_word: οἱ ... ὑπομείναντες ἐν τῇ πίστει αὐτῶν
  choice: те, кто останется твёрд в своей вере
  rationale: ὑπομένω означает стойко выдерживать и не отступать. Такая передача сохраняет идею стойкости, а не только временной продолжительности.
- source_word: ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: самим проклятием
  rationale: 'κατάθεμα — существительное среднего рода со значением «проклятие»; αὐτοῦ согласуется с ним и усиливает его: «самим проклятием». ὑπό с родительным здесь формально допускает инструментально-агентивное прочтение, которое и сохранено в основном тексте.'
theological_decisions:
- issue: Парадоксальная роль «самого проклятия» в спасении
  choice: будут спасены самим проклятием
  alternative: будут избавлены от самого проклятия
  rationale: Основной текст прямо сохраняет грамматически наиболее непосредственное инструментально-агентивное прочтение ὑπό с родительным и не устраняет богословское напряжение. Возможное отделительное понимание указано в примечании, поскольку контекст допускает смысл избавления из-под проклятия.
- issue: Возможная персонификация κατάθεμα
  choice: проклятием
  alternative: Проклятым
  rationale: Форма κατάθεμα грамматически среднего рода и означает «проклятие»; перевод личным обозначением «Проклятым» потребовал бы интерпретации, не выраженной однозначно исходным текстом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным эсхатологическим звучанием. Синтаксис сделан плавным; ключевые образы огня, испытания, отступления, стойкости и проклятия сохранены. Маркер примечания поставлен непосредственно после неоднозначной заключительной фразы.
