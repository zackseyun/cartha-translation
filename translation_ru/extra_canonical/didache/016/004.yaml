source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: ru
  text: Ибо по мере того, как будет возрастать беззаконие, люди станут ненавидеть друг друга, преследовать и предавать друг друга. Тогда явится обольститель мира как сын Божий[a] и совершит знамения и чудеса. Земля будет отдана в его руки, и он совершит беззаконные дела, каких не бывало от века[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как сын Бога». Оборот может означать, что он явится в таком облике или будет претендовать на такое достоинство.'
    reason: Сохраняет неоднозначность ὡς υἱὸς Θεοῦ, не навязывая в основном тексте конкретное истолкование.
  - marker: b
    text: 'Или: «каких никогда не бывало с начала века».'
    reason: Фраза ἐξ αἰῶνος допускает как идиоматическое «от века», так и более развёрнутое временное понимание.
lexical_decisions:
- source_word: αὐξανούσης ... τῆς ἀνομίας
  choice: по мере того, как будет возрастать беззаконие
  rationale: Передаёт родительный абсолют и постепенное усиление ἀνομία естественным современным русским языком.
- source_word: μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι
  choice: люди станут ненавидеть друг друга, преследовать и предавать друг друга
  rationale: Неопределённое подлежащее выражено словом «люди»; взаимный объект, явно указанный при первом глаголе и подразумеваемый далее, естественно восполнен в русском.
- source_word: ὁ κοσμοπλάνος
  choice: обольститель мира
  rationale: 'Сохраняет составное значение: тот, кто вводит мир в заблуждение; «обольститель» соответствует религиозно-эсхатологическому регистру без излишней архаичности.'
- source_word: σημεῖα καὶ τέρατα
  choice: знамения и чудеса
  rationale: Устоявшаяся и точная библейская пара для сверхъестественных знамений и поразительных деяний.
- source_word: ἀθέμιτα
  choice: беззаконные дела
  rationale: Передаёт запрещённые, нечестивые поступки; добавление «дела» естественно выражает субстантивированное прилагательное среднего рода.
- source_word: ἐξ αἰῶνος
  choice: от века
  rationale: Краткая русская формула сохраняет возможное значение «издревле / от начала века», не уточняя его сверх греческого текста.
theological_decisions:
- issue: Значение ὡς υἱὸς Θεοῦ
  choice: выдавая себя за Сына Божьего
  alternative: как сын Божий / словно Сын Божий
  rationale: В контексте «обольстителя мира» ὡς обозначает притязание или обманное явление в таком качестве. Формулировка не утверждает, что он действительно Сын Божий; примечание сохраняет буквальную неоднозначность конструкции и отсутствие артикля перед υἱός.
- issue: Кому будет отдана земля
  choice: Земля будет отдана в его руки
  alternative: земля будет предана в его руки
  rationale: Сохранён пассив παραδοθήσεται и не назван действующий субъект, которого греческий текст не указывает.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского эсхатологического наставления. Синтаксис разделён на три предложения ради ясности, при этом последовательность греческих связок и нарастание событий сохранены. Термины «беззаконие», «знамения и чудеса», «Сын Божий» поддерживают узнаваемый библейский регистр без конфессиональных добавлений.
