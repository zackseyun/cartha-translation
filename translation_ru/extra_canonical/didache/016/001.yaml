source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: ru
  text: Бодрствуйте о своей жизни.[a] Пусть ваши светильники не гаснут и ваши пояса не будут развязаны,[b] но будьте готовы, потому что вы не знаете часа, когда придёт наш Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «Бодрствуйте ради жизни вашей». Выражение не уточняет, идёт ли речь о земной жизни, образе жизни или жизни в более широком смысле.'
    reason: Поясняет смысловую широту ὑπὲρ τῆς ζωῆς ὑμῶν, которую невозможно полностью воспроизвести одним естественным русским оборотом.
  - marker: b
    text: 'Буквально: «пусть ваши чресла не распоясываются». Подпоясанность была образом готовности немедленно отправиться в путь или приступить к делу.'
    reason: Сохраняет буквальный образ греческого текста и поясняет культурный смысл понятной основной формулировки.
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Бодрствуйте
  rationale: Передаёт повеление сохранять духовную и эсхатологическую бдительность; более точно и достойно по регистру, чем нейтральное «следите».
- source_word: ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: ради своей жизни
  rationale: Сохраняет широкое значение ὑπέρ и не ограничивает ζωή только земной жизнью или только поведением.
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  choice: Пусть ваши светильники не гаснут
  rationale: Естественно передаёт греческую запретительную конструкцию и сохраняет образ светильников.
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: одежды остаются подпоясанными
  rationale: Передаёт смысл древнего образа готовности к действию на понятном современном русском языке, не используя малопонятное «чресла».
- source_word: ἕτοιμοι
  choice: готовы
  rationale: Прямое и естественное соответствие, сохраняющее призыв к постоянной готовности.
- source_word: ἔρχεται
  choice: придёт
  rationale: В русском придаточном с неизвестным будущим временем форма будущего звучит естественно и передаёт ожидаемое пришествие Господа, выраженное греческим настоящим.
theological_decisions:
- issue: Значение «жизни» в выражении ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: Оставлено широкое «ради своей жизни»
  alternative: «следите за своим образом жизни» или «берегите свою душу»
  rationale: Греческий текст не уточняет, имеется ли в виду поведение, земная жизнь или жизнь в более полном духовном смысле; перевод не должен сужать эту неоднозначность.
- issue: Образ подпоясанности
  choice: Сохранён как образ одежды, остающейся подпоясанной
  alternative: «всегда будьте готовы действовать»
  rationale: Образ связан с готовностью, но его полная замена толкованием устранила бы связь с традиционной библейской речью и параллелью о светильниках.
- issue: Время глагола пришествия Господа
  choice: Русское будущее «придёт»
  alternative: Буквальное настоящее «приходит»
  rationale: Будущее время естественно после «не знаете часа, когда» и не определяет способ или точную хронологию пришествия.
translation_notes:
  register: Современный литературный русский с торжественной, но доступной интонацией. Синтаксис краткий и увещательный. Архаизм «чресла» вынесен в примечание; в основном тексте сохранён сам древний образ подпоясанной одежды.
