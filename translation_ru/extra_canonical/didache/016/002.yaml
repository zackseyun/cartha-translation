review_pass:
  verdict: revise
  source_fidelity: В целом структура и причинно-следственная связь переданы верно. Однако τὰ ἀνήκοντα означает прежде всего то, что подобает, относится к или требуется для душ, а не просто «полезное». Кроме того, страдательная форма τελειωθῆτε требует сохранить мотив доведения до полноты/совершенства, а не заменять его активным «достигнете».
  naturalness: «Собирайтесь часто» и общий увещательный тон естественны для современного литературного русского. Формулировка «будете доведены до совершенства» несколько книжная, но ясна, соответствует высокому регистру текста и сохраняет существенную грамматическую неопределённость оригинала.
  terminology: «Совершенство» уместно для τελειόω при условии сохранения страдательной конструкции. «В последнее время» сохраняется как наиболее близкий вариант для ἐν τῷ ἐσχάτῳ καιρῷ; контекст снимает обычное русское значение «недавно», не уточняя, о каком именно эсхатологическом периоде идёт речь.
  issues:
  - severity: medium
    issue: «того, что полезно вашим душам» сужает τὰ ἀνήκοντα
    rationale: «Полезно» передаёт возможное прагматическое следствие, но не основной смысл «подобающее/необходимое, относящееся к». Более близкое «того, что подобает вашим душам» не добавляет толкования.
  - severity: medium
    issue: «достигнете совершенства» заменяет пассивную форму τελειωθῆτε активной
    rationale: Греческое слово обозначает быть доведёнными до завершённости или совершенства; агент не назван. Русская страдательная конструкция сохраняет эту особенность.
  revised_text: И собирайтесь часто, ища того, что подобает вашим душам; ибо всё время вашей веры не принесёт вам пользы, если в последнее время вы не будете доведены до совершенства.
