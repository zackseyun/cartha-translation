id: DID.16.2
reference: Didache 16:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: ru
  text: И собирайтесь часто, ища того, что подобает вашим душам; ибо всё время вашей веры не принесёт вам пользы, если в последнее время вы не будете доведены до совершенства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πυκνῶς
  choice: часто
  rationale: Передаёт значение регулярности и частоты без неестественного для современного русского оттенка «плотно».
- source_word: συναχθήσεσθε
  choice: собирайтесь
  rationale: По смыслу контекста это побуждение общине регулярно собираться; русский императив естественно передаёт предписывающую силу формы.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: того, что полезно вашим душам
  rationale: ἀνήκοντα обозначает то, что подобает, относится или необходимо; «полезно» естественно выражает здесь заботу о духовном благе, не конкретизируя предмет поиска.
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: всё время вашей веры
  rationale: Сохраняет необычную, но понятную временную формулировку оригинала и её акцент на всей предшествующей жизни в вере.
- source_word: τελειωθῆτε
  choice: достигнете совершенства
  rationale: Передаёт пассивный аорист со значением доведения до полноты или совершенства; формулировка остаётся естественной по-русски и не сводит смысл лишь к нравственной безупречности.
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: в последнее время
  rationale: Близко передаёт эсхатологически окрашенное выражение, сохраняя его неопределённость относительно конкретного момента или периода.
theological_decisions:
- issue: Смысл τελειωθῆτε
  choice: «достигнете совершенства»
  alternative: «будете доведены до полноты»
  rationale: Выбранный вариант сохраняет мотив завершённости и совершенства, не объясняя, кем или каким образом это совершается; альтернатива точнее отражает пассив, но звучит менее естественно.
- issue: Значение «последнего времени»
  choice: Сохранено без уточнения
  alternative: «в конце» или «в последние дни»
  rationale: Оригинал допускает эсхатологическое прочтение, но не называет прямо ни конец жизни человека, ни определённые «последние дни»; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с увещательным, достойным тоном. Синтаксический параллелизм и причинная связь оригинала сохранены; архаизмы и конфессионально нагруженные уточнения не вводились.
