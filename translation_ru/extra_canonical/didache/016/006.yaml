source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: ru
  text: 'И тогда явятся знамения истины: во-первых, знамение простирания в небе[a]; затем — знамение звука трубы; а третье — воскресение мёртвых —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распростирания», «развёртывания». Греческое слово не уточняет, что именно простирается в небе.'
    reason: Сохранение редкого значения ἐκπέτασις и его предметной неоднозначности.
lexical_decisions:
- source_word: τὰ σημεῖα τῆς ἀληθείας
  choice: знамения истины
  rationale: Сохранена формальная и смысловая связь родительного падежа без уточнения, означает ли он принадлежность, подтверждение или истинность знамений.
- source_word: ἐκπετάσεως
  choice: простирания
  rationale: Слово обозначает распростирание, протягивание или развёртывание; «простирание» сохраняет образ и не подменяет его более конкретным «отверстием» или «раскрытием».
- source_word: φωνῆς σάλπιγγος
  choice: звука трубы
  rationale: В сочетании с музыкальным инструментом φωνή естественно означает звук; русский оборот передаёт это без неуместного олицетворения.
- source_word: ἀνάστασις νεκρῶν
  choice: воскресение мёртвых
  rationale: Прямой и общепонятный русский эквивалент, сохраняющий отсутствие артикля и коллективный смысл.
theological_decisions:
- issue: Природа первого знамения
  choice: Не уточнять, что именно простирается на небе
  alternative: «знамение распростёртого креста на небе» или «знамение отверстия в небе»
  rationale: Греческий текст не называет предмет простирания. Указание на крест возможно как древнее толкование, но внесло бы в основной текст отсутствующую конкретизацию; «отверстие» лексически хуже соответствует ἐκπέτασις.
- issue: Знамения «истины»
  choice: Сохранить буквальную неоднозначность
  alternative: «истинные знамения» или «знамения, подтверждающие истину»
  rationale: Родительный оборот допускает разные смысловые отношения, и контекст стиха не требует выбирать одно из них.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаизированной эсхатологической лексикой. Повтор «знамение» сохранён ради риторической структуры оригинала; конечное тире показывает, что фраза продолжается в следующем стихе.
