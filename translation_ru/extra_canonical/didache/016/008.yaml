translation:
  language: ru
  text: Тогда мир увидит Господа, грядущего на облаках небесных.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Точно передаёт временную последовательность и сохраняет связь с предшествующим описанием.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Обычное и естественное соответствие κόσμος; здесь обозначает мир как совокупность людей, которые увидят явление Господа.
- source_word: τὸν Κύριον
  choice: Господа
  rationale: Передаёт определённую форму и титул Κύριος без добавочного уточнения личности.
- source_word: ἐρχόμενον
  choice: грядущего
  rationale: Причастие сохраняет одновременность действия с глаголом «увидит»; «грядущего» естественно для торжественного эсхатологического контекста и остаётся понятным современному читателю.
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: на облаках небесных
  rationale: Передаёт образ движения или явления на облаках; краткий порядок слов сохраняет достоинство и узнаваемость библейской формулы.
theological_decisions:
- issue: Кого обозначает титул Κύριος
  choice: Сохранить «Господа» без поясняющего имени
  alternative: Уточнить «Господа Иисуса»
  rationale: Греческий текст не называет имя; перевод не должен устранять контекстуальную неоднозначность добавлением отсутствующих слов.
- issue: Пространственное значение ἐπάνω
  choice: «на облаках»
  alternative: «над облаками»
  rationale: В данном апокалиптическом образе ἐπάνω с родительным допускает передачу «на»; она сохраняет традиционный образ пришествия на облаках и не превращает его лишь в указание высоты.
translation_notes:
  register: Современный литературный русский с торжественной библейской окраской. Форма «грядущего» выбрана как понятная и стилистически уместная; архаические синтаксические конструкции не используются.
