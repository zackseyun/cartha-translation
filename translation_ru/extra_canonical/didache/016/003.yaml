  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: ru
  text: Ибо в последние дни умножатся лжепророки и губители, овцы будут обращены в волков, и любовь будет обращена в ненависть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληθυνθήσονται
  choice: умножатся
  rationale: Сохраняет значение увеличения числа и библейскую стилистическую окраску греческой формы.
- source_word: οἱ ψευδοπροφῆται
  choice: лжепророки
  rationale: Устоявшийся и точный русский эквивалент для людей, ложно выступающих как пророки.
- source_word: οἱ φθορεῖς
  choice: развратители
  rationale: Передаёт обозначение тех, кто портит или нравственно разлагает других, не сужая смысл до одной конкретной формы порчи.
- source_word: στραφήσονται τὰ πρόβατα εἰς λύκους
  choice: овцы превратятся в волков
  rationale: Естественно передаёт образ радикальной перемены; пассивная греческая конструкция допускает такой непереходный перевод.
- source_word: ἡ ἀγάπη στραφήσεται εἰς μῖσος
  choice: любовь обратится в ненависть
  rationale: Сохраняет прямое противопоставление ἀγάπη и μῖσος и торжественную лаконичность оригинала.
theological_decisions:
- issue: Характер превращения овец в волков
  choice: овцы превратятся в волков
  alternative: овец превратят в волков
  rationale: Греческий пассив στραφήσονται не называет действующего лица и может описывать изменение состояния; выбранный вариант не вводит в текст неназванного деятеля.
translation_notes:
