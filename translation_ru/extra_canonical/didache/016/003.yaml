revisions:
- from: Ибо в последние дни умножатся лжепророки и развратители, овцы превратятся в волков, а любовь обратится в ненависть.
  to: Ибо в последние дни умножатся лжепророки и губители, овцы будут обращены в волков, и любовь будет обращена в ненависть.
