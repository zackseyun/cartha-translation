  text: Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: ru
  text: Не будь ни двоедушным, ни двуличным в речах[a], ведь двуличная речь — западня смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двуязычным»; здесь — о человеке, который говорит двояко, неискренне или противоречиво.'
    reason: Поясняет греческую игру слов, не создавая ложного впечатления, будто осуждается владение двумя языками.
lexical_decisions:
- source_word: διγνώμων
  choice: двоедушным
  rationale: Передаёт представление о внутренней раздвоенности суждений или намерений и сохраняет параллелизм с последующим предостережением о речи.
- source_word: δίγλωσσος / διγλωσσία
  choice: двуличным в речах / двуличная речь
  rationale: Буквальное «двуязычным / двуязычие» в современном русском обычно означает владение двумя языками и потому вводит в заблуждение. Выбранная формулировка передаёт непостоянную или обманчивую речь и сохраняет повтор одного смыслового корня.
- source_word: παγὶς θανάτου
  choice: западня смерти
  rationale: Сохраняет конкретный образ ловушки и формальную связь родительного падежа без уточнения, ведёт ли такая речь к смерти или принадлежит сфере смерти.
theological_decisions:
- issue: Характер «двойной речи»
  choice: Не уточнять, идёт ли речь прежде всего о лжи, противоречивых обещаниях или разных словах разным людям.
  alternative: 'Перевести пояснительно: «не говори одному одно, а другому другое».'
  rationale: Греческие δίγλωσσος и διγλωσσία допускают более широкий смысл речевой неискренности; конкретизация сузила бы исходное предостережение.
translation_notes:
  register: Современный литературный русский с краткой наставительной интонацией. «Двоедушным» сохраняет библейскую выразительность, а «двуличным в речах» избегает непонятного или ошибочно понимаемого буквального «двуязычным».
