source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: ru
  text: Не будь ни корыстолюбцем, ни грабителем, ни лицемером, ни злобным, ни надменным. Не вынашивай злого замысла[a] против своего ближнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не принимай злого совета».'
    reason: Греческое βουλή может означать как замысел или решение, так и совет.
lexical_decisions:
- source_word: πλεονέκτης
  choice: корыстолюбивым
  rationale: Передаёт стремление получить больше и корыстную жадность, сохраняя отличие от следующего ἅρπαξ.
- source_word: ἅρπαξ
  choice: хищным
  rationale: Выражает захватнический, грабительский характер слова; в данном перечне качеств естественно звучит как прилагательное.
- source_word: κακοήθης
  choice: злобным
  rationale: Передаёт активную злонамеренность и дурной нрав, а не просто неблагоприятную расположенность.
- source_word: ὑπερήφανος
  choice: надменным
  rationale: Точно и естественно передаёт высокомерие в современном литературном русском языке.
- source_word: λήψῃ βουλὴν πονηράν
  choice: не вынашивай злого замысла
  rationale: Естественная русская передача идиомы со значением принятия или удержания злого намерения; неоднозначность βουλή отмечена в сноске.
- source_word: πλησίον
  choice: ближнего
  rationale: Устоявшийся и понятный библейский эквивалент, обозначающий другого человека в отношении к адресату.
theological_decisions:
- issue: Характер запрета λήψῃ βουλὴν πονηράν
  choice: запрет вынашивать злой замысел против ближнего
  alternative: запрет принимать злой совет против ближнего
  rationale: Сочетание допускает оттенки замысла, решения и совета. Основной текст передаёт наиболее естественный в контексте личной нравственной заповеди смысл, а сноска сохраняет иной возможный оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного наставления. Повтор «ни» сохраняет ритм греческого перечня; лексика понятна широкому читателю без архаизации.
