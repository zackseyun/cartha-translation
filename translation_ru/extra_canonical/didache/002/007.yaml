id: DID.2.7
reference: Didache 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: ru
  text: Не питай ненависти ни к одному человеку, но одних обличай, о других молись, а иных люби больше собственной жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μισήσεις
  choice: Не питай ненависти
  rationale: Передаёт запрет будущего времени в значении повеления естественным современным русским выражением, сохраняя смысл μισέω — «ненавидеть».
- source_word: πάντα ἄνθρωπον
  choice: ни к одному человеку
  rationale: В контексте отрицания передаёт всеобщность выражения и сохраняет родовое, не ограниченное мужчинами значение ἄνθρωπος.
- source_word: ἐλέγξεις
  choice: обличай
  rationale: Передаёт смысл выявления проступка и указания на него; «обличать» уместно в нравственно-наставительном регистре.
- source_word: περὶ δὲ ὧν προσεύξῃ
  choice: о других молись
  rationale: Сохраняет различение групп и естественно передаёт περί с глаголом молитвы как «молиться о ком-либо».
- source_word: ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου
  choice: люби больше собственной жизни
  rationale: ψυχή здесь естественно понимается как жизнь; сравнительное значение ὑπέρ передано словом «больше», без устранения силы призыва.
theological_decisions:
- issue: Соотношение запрета ненависти с различным отношением к людям
  choice: 'Сохранены три параллельные реакции: обличение, молитва и превосходящая любовь.'
  alternative: Свести всё к единому предписанию любить каждого одинаковым образом.
  rationale: Греческий текст проводит реальное различие между οὓς μέν, περὶ δὲ ὧν и οὓς δέ; перевод не должен сглаживать эту нравственную напряжённость.
- issue: Значение ψυχή
  choice: «жизнь»
  alternative: «душа»
  rationale: В сочетании с ὑπέρ сравнительная формула указывает на любовь, превосходящую привязанность к собственной жизни; буквальное «душа» в современном русском могло бы создать иной богословский смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным наставительным звучанием. Формы единственного числа передают обращённое к читателю нравственное предписание; параллелизм греческой фразы сохранён посредством «одних… о других… а иных…».
