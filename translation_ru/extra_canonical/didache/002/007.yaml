  verdict: approve
  source_fidelity: Перевод точно передаёт общий запрет в Οὐ μισήσεις πάντα ἄνθρωπον как запрет ненависти к любому человеку, не сужая ἄνθρωπος до мужчин. Три различающиеся реакции, отмеченные οὓς μέν … περὶ δὲ ὧν … οὓς δέ, сохранены. «О других молись» корректно передаёт περί с προσεύχομαι, а «больше собственной жизни» естественно и по смыслу точно передаёт ὑπὲρ τὴν ψυχήν σου в данном контексте.
  naturalness: Текст звучит как современное литературное нравственное наставление. «Не питай ненависти ни к одному человеку» имеет несколько возвышенный, но вполне естественный и уместный для жанра регистр; параллелизм «одних… о других… а иных…» ясен и плавен.
  terminology: «Обличай» адекватно ἐλέγξεις и соответствует наставительному регистру без излишней конфессиональной окраски. «Жизнь» для ψυχή в сравнении с ὑπέρ предпочтительнее буквальной «души», поскольку не вносит не требуемого греческим текстом богословского оттенка. Имена и специальные термины отсутствуют.
