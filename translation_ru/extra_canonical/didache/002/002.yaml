  source_fidelity: В целом последовательность запретов и заключительное противопоставление нерождённого ребёнка уже родившемуся переданы верно. Однако «не прибегай к колдовским снадобьям» сужает φαρμακεύσεις до средств/зелий, тогда как глагол обозначает занятие φαρμακεία — колдовством, чародейством; предметное значение «снадобья» здесь не выражено. «Сексуальному насилию» допустимо как интерпретация παιδοφθορήσεις в данном контексте, но греческий глагол шире и не обязательно обозначает именно насильственное принуждение.
  naturalness: Текст звучит современно, литературно и выдержан в краткой форме запретов. «Не занимайся магией; не прибегай к колдовским снадобьям» создаёт неестественное и смыслово неравное противопоставление действий и средств. Замена на «не занимайся чародейством» естественна и параллельна греческим глаголам.
  terminology: '«Прелюбодействуй» точно для μοιχεύσεις; «предавайся распутству» приемлемо для πορνεύσεις; «магия» и «чародейство» удачно различают μαγεύσεις и φαρμακεύσεις без искусственного приписывания зелий. В примечании a лучше не утверждать безоговорочно «сексуальное насилие»: «растлевать/совращать мальчиков» ближе к лексической широте παιδοφθορέω. В примечании b слово «уничтожение» как буквальная глосса для φθορά не вполне удачно и может быть заменено более нейтральным «погубление».'
