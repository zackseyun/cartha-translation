source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: ru
  text: Не убивай; не прелюбодействуй; не подвергай мальчиков сексуальному насилию[a]; не предавайся распутству; не кради; не занимайся магией; не занимайся чародейством; не убивай ребёнка абортом и не умерщвляй уже родившегося[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово буквально означает «растлевать» или «совращать» детей; в контексте половых запретов оно относится к сексуальному посягательству на мальчиков, но не уточняет его конкретную форму.
    reason: Поясняет значение παιδοφθορέω, сохраняя лексическую широту термина.
  - marker: b
    text: 'Буквально: «не убивай ребёнка при погублении и не убивай родившегося». В данном противопоставлении первая часть относится к аборту, вторая — к убийству ребёнка после рождения.'
    reason: Показывает строение греческой фразы и основание для явного перевода «абортом».
lexical_decisions:
- source_word: παιδοφθορήσεις
  choice: не подвергай мальчиков сексуальному насилию
  rationale: Глагол буквально связан с растлением или совращением детей, а в данном перечне половых запретов обозначает сексуальное надругательство над мальчиками. Современная формулировка передаёт смысл ясно и не ограничивает его одной конкретной формой насилия.
- source_word: πορνεύσεις
  choice: не предавайся распутству
  rationale: Передаёт широкий смысл незаконного или безнравственного полового поведения, не сводя слово к проституции.
- source_word: μαγεύσεις
  choice: не занимайся магией
  rationale: Прямо передаёт практику магических действий и сохраняет отличие от следующего глагола.
- source_word: φαρμακεύσεις
  choice: не прибегай к колдовским снадобьям
  rationale: Слово связано с применением снадобий, зелий или ядов в колдовской практике. Формулировка сохраняет эту предметную окраску и отличает запрет от общего «не занимайся магией».
- source_word: τέκνον ἐν φθορᾷ
  choice: ребёнка абортом
  rationale: В данном контексте выражение противопоставлено убийству уже родившегося ребёнка и обозначает умерщвление ребёнка посредством аборта.
- source_word: ἀποκτενεῖς
  choice: не умерщвляй
  rationale: Отражает обычное значение «убить» и позволяет естественно отличить вторую часть фразы от повторённого φονεύσεις.
theological_decisions:
- issue: Статус нерождённого и уже родившегося ребёнка в заключительном запрете
  choice: Сохранить параллельный запрет умерщвлять ребёнка как до рождения посредством аборта, так и после рождения
  alternative: Обобщить обе части как единый запрет детоубийства
  rationale: Греческий текст намеренно различает τέκνον ἐν φθορᾷ и γεννηθέν; перевод сохраняет это различие, не добавляя дальнейших богословских выводов.
- issue: Объём значения παιδοφθορήσεις
  choice: Передать как сексуальное насилие над мальчиками
  alternative: «Не растлевай мальчиков» или более узкое указание на определённую античную практику
  rationale: Контекст половых запретов требует сексуального смысла, однако греческое слово само по себе не уточняет конкретный вид насилия; поэтому перевод остаётся ясным, но не чрезмерно узким.
translation_notes:
  register: Современный литературный русский язык; краткие запреты выдержаны в форме единственного числа, соответствующей греческому будущему времени с запретительным значением. Лексика ясная и достойная, без архаизмов; различия между близкими греческими глаголами по возможности сохранены.
