lexical_decisions:
- source_word: Δευτέρα
  choice: вторая
  rationale: Прямо передаёт порядковое числительное женского рода, согласованное со словом «заповедь».
- source_word: δὲ
  choice: А
  rationale: Передаёт переход к следующему положению; русское «а» естественно связывает этот заголовок с предыдущим разделом.
- source_word: ἐντολὴ
  choice: заповедь
  rationale: Обычный и точный религиозно-нравственный эквивалент греческого слова со значением предписания или повеления.
- source_word: τῆς διδαχῆς
  choice: учения
  rationale: Сохраняет родительную конструкцию и связь с названием и содержанием «Учения».
theological_decisions:
- issue: Отношение второй заповеди к «учению»
  choice: Сохранена буквальная конструкция «заповедь учения»
  alternative: «заповедь, содержащаяся в учении»
  rationale: Греческий родительный падеж допускает более одного смыслового оттенка; буквальная и естественная русская конструкция не сужает его без необходимости.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная заголовочная формула. Слово «такова» добавлено как естественное русское указание на последующий текст, соответствующее функции исходной фразы и завершающего двоеточия.
