  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: ru
  text: Не желай того, что принадлежит ближнему; не клянись ложно; не лжесвидетельствуй; не злословь; не таи зла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: не желай
  rationale: Глагол означает «желать, вожделеть» и здесь, в явной перекличке с Декалогом, обозначает неправомерное желание присвоить принадлежащее ближнему. Формулировка сохраняет естественность современного русского языка; отрицательный смысл проясняется объектом и сноской.
- source_word: τὰ τοῦ πλησίον
  choice: того, что принадлежит ближнему
  rationale: Субстантивированная конструкция буквально охватывает «всё принадлежащее ближнему»; единственное собирательное «того» звучит по-русски естественно и не сужает перечень имущества.
- source_word: ἐπιορκήσεις
  choice: не клянись ложно
  rationale: Передаёт ложную клятву или нарушение истинности клятвенного заявления без добавления отсутствующих в тексте подробностей.
- source_word: ψευδομαρτυρήσεις
  choice: не лжесвидетельствуй
  rationale: Устоявшийся и точный русский эквивалент запрета давать ложное свидетельство, сохраняющий отзвук Декалога.
- source_word: κακολογήσεις
  choice: не злословь
  rationale: Кратко и точно передаёт злую, оскорбительную или порочащую речь, не ограничивая её только формальной клеветой.
- source_word: μνησικακήσεις
  choice: не таи зла
  rationale: Идиоматичный современный русский оборот для памятования причинённого зла и злопамятного удержания обиды.
theological_decisions:
- issue: Сила запрета ἐπιθυμήσεις и его связь с Декалогом
  choice: не желай того, что принадлежит ближнему
  alternative: не вожделей принадлежащего ближнему
  rationale: Выбрана понятная современная формулировка, сохраняющая объект неправомерного желания. Более традиционное «вожделей» может звучать архаично или преимущественно сексуально; сноска фиксирует возможную усиленную передачу.
translation_notes:
  register: Современный литературный русский язык; краткие параллельные запреты передают афористический наставительный строй оригинала. Сохранён возвышенный, но не архаичный тон.
