  text: Пусть твоё слово не будет ни лживым, ни пустым, но будет наполнено делом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λόγος σου
  choice: твоё слово
  rationale: Сохраняет прямое значение λόγος и личное обращение второго лица.
- source_word: ψευδής
  choice: лживым
  rationale: Передаёт нравственную характеристику речи как ложной, а не только отдельную фактическую ошибку.
- source_word: κενός
  choice: пустым
  rationale: Прямо сохраняет образ пустоты — слов, за которыми ничего не стоит.
- source_word: μεμεστωμένος πράξει
  choice: подтверждается делом
  rationale: 'Естественно по-русски выражает противопоставление пустым словам: речь должна иметь полноту в практическом исполнении. Единственное число «делом» соответствует πράξει и носит собирательный смысл.'
theological_decisions:
- issue: Соотношение слова и поступка
  choice: «подтверждается делом»
  alternative: «исполнено делом» / «наполнено действием»
  rationale: Фраза понимается как требование, чтобы слова находили реальное воплощение в поступке. Выбор не вводит особого конфессионального толкования, хотя несколько раскрывает необычную греческую метафору.
translation_notes:
  register: Современный литературный русский язык, краткий наставительный стиль. Конструкция «Пусть… не будет» звучит естественнее буквального будущего «не будет», сохраняя нормативную силу греческого οὐκ ἔσται.
