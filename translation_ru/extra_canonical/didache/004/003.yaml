  source_fidelity: Перевод точно передаёт ряд греческих предписаний. «Не вноси разделения» адекватно отражает μὴ ποιήσεις σχίσμα без анахронического институционального смысла; «примиряй враждующих» хорошо передаёт εἰρηνεύσεις ... μαχομένους. «Суди справедливо» соответствует κρινεῖς δικαίως, а заключительная формула верно передаёт запрет на лицеприятие при обличении за проступки.
