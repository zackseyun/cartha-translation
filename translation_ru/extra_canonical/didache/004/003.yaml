id: DID.4.3
reference: Didache 4:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: ru
  text: Не вноси разделения[a], но примиряй враждующих. Суди справедливо; обличая за проступки, не проявляй пристрастия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не создавай раскола».'
    reason: Отмечает более буквальный вариант передачи σχίσμα, при этом основной текст избегает позднейшего институционального оттенка слова «раскол».
lexical_decisions:
- source_word: σχίσμα
  choice: разделение
  rationale: В раннехристианском контексте слово обозначает разрыв или разделение внутри общины; «разделение» не привносит более позднего узкоцерковного смысла слова «раскол».
- source_word: εἰρηνεύσεις ... μαχομένους
  choice: примиряй враждующих
  rationale: 'Передаёт направленное на других действие: положить конец вражде между теми, кто находится в конфликте.'
- source_word: κρινεῖς δικαίως
  choice: суди справедливо
  rationale: Прямо и естественно передаёт требование выносить справедливое суждение.
- source_word: οὐ λήψῃ πρόσωπον
  choice: не проявляй пристрастия
  rationale: Передаёт смысл греческой идиомы «не принимать лица» современным литературным русским языком.
- source_word: ἐπὶ παραπτώμασιν
  choice: за проступки
  rationale: παράπτωμα здесь обозначает нарушения или провинности; «проступки» сохраняет нравственный смысл без неоправданного усиления.
theological_decisions:
- issue: Характер σχίσμα
  choice: разделение
  alternative: раскол
  rationale: Выбор сохраняет общинный и нравственный смысл наставления, не предполагая уже оформившегося институционального понятия церковного раскола.
- issue: Объект беспристрастного обличения
  choice: обличая за проступки, не проявляй пристрастия
  alternative: не проявляй пристрастия в обличении проступков
  rationale: Формулировка сохраняет связь беспристрастия с исправительным обличением и не уточняет без основания, какие именно лица или категории нарушителей имеются в виду.
translation_notes:
  register: Современный литературный русский язык с краткими наставительными императивами. Синтаксис сохраняет параллелизм исходного ряда предписаний; архаическая калька «не взирай на лицо» заменена ясным выражением «не проявляй пристрастия».
