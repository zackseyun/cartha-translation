id: DID.4.13
reference: Didache 4:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: ru
  text: Никогда не оставляй заповедей Господа, но соблюдай то, что ты принял, ничего не прибавляя и не убавляя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: Никогда не оставляй
  rationale: Усиленное греческое отрицание οὐ μή передано как категорический запрет «никогда не»; ἐγκαταλείπω означает оставлять, покидать, отступаться.
- source_word: ἐντολὰς Κυρίου
  choice: заповедей Господа
  rationale: Прямое и естественное соответствие греческому выражению с сохранением традиционного библейского термина «заповеди».
- source_word: φυλάξεις
  choice: соблюдай
  rationale: В данном наставительном контексте форма будущего времени выражает предписание; «соблюдай» естественно передаёт идею верного хранения и исполнения.
- source_word: ἃ παρέλαβες
  choice: то, что ты принял
  rationale: παραλαμβάνω здесь обозначает принятие переданного учения или наставления; формулировка сохраняет широту предмета без добавочного уточнения.
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: ничего не прибавляя и не убавляя
  rationale: Сохранена симметрия двух причастий и их связь со соблюдением принятого; «ничего» естественно выражает полноту двойного запрета.
theological_decisions:
- issue: Соотношение «заповедей Господа» и «того, что ты принял»
  choice: Не отождествлять и не разводить эти выражения дополнительными пояснениями
  alternative: Уточнить «принятое учение» или прямо приравнять его к заповедям Господа
  rationale: Греческий текст оставляет связь между выражениями контекстуально понятной, но не формулирует её явно; перевод сохраняет эту содержательную открытость.
- issue: Модальность φυλάξεις
  choice: Передать повелительным наклонением «соблюдай»
  alternative: Будущее «будешь соблюдать»
  rationale: В ряду наставлений Дидахе греческое будущее имеет предписывающую силу; русский императив яснее и естественнее передаёт эту функцию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Единственное число второго лица сохранено. Формулировка краткая и ритмически параллельная оригиналу; архаизмы и конфессиональные уточнения не вводятся.
