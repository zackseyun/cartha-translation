  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: ru
  text: Не отнимай своей руки от своего сына или дочери[a], но с юных лет учи их страху Божьему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «не отнимай своей руки» может подразумевать, что родитель не должен уклоняться от воспитания и наставления ребёнка; греческий текст сохраняет образное выражение, не уточняя конкретного действия.
    reason: Поясняет неоднозначную метафору, не подменяя её одним толкованием в основном тексте.
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: Не отнимай руки от
  rationale: Сохраняет конкретный и неоднозначный греческий образ, не сводя его без достаточных оснований только к наказанию, заботе или руководству.
- source_word: ἀπὸ νεότητος
  choice: с юных лет
  rationale: Естественно передаёт начало воспитания в раннем возрасте и звучит современно по-русски.
- source_word: διδάξεις
  choice: учи
  rationale: Будущее время в греческом здесь имеет предписывающую силу; русский повелительный глагол ясно и естественно передаёт заповедь.
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: страху Божьему
  rationale: 'Сохраняет традиционный библейский термин и его богословскую ёмкость: благоговение, почтение и осознание Божьего суда.'
theological_decisions:
- issue: Смысл образа «не отнимать руки»
  choice: Образ сохранён без уточнения вида родительского воздействия.
  alternative: «Не уклоняйся от воспитания/наказания сына или дочери».
  rationale: Греческое выражение допускает связь с дисциплиной, но само по себе не называет наказание; конкретизация устранила бы исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис краткий и прямой; архаические формы вроде «Божию» и избыточные притяжательные местоимения устранены.
