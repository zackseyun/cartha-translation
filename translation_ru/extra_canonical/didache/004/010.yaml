id: DID.4.10
reference: Didache 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your servant or female servant who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: ru
  text: Не приказывай в раздражении своему рабу или рабыне, которые надеются на того же Бога, чтобы они не перестали бояться Бога, Который над вами обоими; ведь Он приходит призвать не по внешнему положению[a], а тех, кого Дух приготовил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не по лицу»; возможно также: «не взирая на лица». В данном контексте выражение может относиться к внешнему, в том числе социальному, положению.'
    reason: Греческое κατὰ πρόσωπον допускает буквальное и идиоматическое понимание; примечание сохраняет эту неоднозначность, не ограничивая выражение только социальным статусом.
lexical_decisions:
- source_word: ἐν πικρίᾳ σου
  choice: в озлоблении
  rationale: Передаёт действие, совершаемое с горечью и суровостью; естественнее в данном контексте, чем буквальное «в своей горечи».
- source_word: δούλῳ σου ἢ παιδίσκῃ
  choice: своему рабу или рабыне
  rationale: Сохраняет обозначение рабского социального положения обоих лиц и гендерное различие оригинала.
- source_word: τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν
  choice: которые надеются на того же Бога
  rationale: Причастный оборот относится к обоим зависимым лицам; «надеяться на Бога» — естественное русское соответствие ἐλπίζειν ἐπί.
- source_word: τὸν ἐπ᾽ ἀμφοτέροις Θεόν
  choice: Бога, стоящего над вами обоими
  rationale: Сохраняет образ Божьей власти над хозяином и рабом и явно передаёт смысл ἀμφότεροις.
- source_word: κατὰ πρόσωπον
  choice: по положению человека
  rationale: В контексте противопоставлены внешнее социальное положение и Божий призыв; формулировка остаётся понятной современному читателю.
- source_word: ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν
  choice: тех, кого Дух приготовил
  rationale: Сохраняет личное дополнение, действие приготовления и неопределённость относительно характера этого приготовления.
theological_decisions:
- issue: Субъект глагола ἔρχεται
  choice: «Он» относится к Богу
  alternative: Понимать подразумеваемым субъектом Христа
  rationale: Ближайший явно названный субъект — Θεός; текст сам не вводит отдельного христологического референта, поэтому перевод не должен его добавлять.
- issue: Значение κατὰ πρόσωπον
  choice: призыв не определяется положением человека
  alternative: «не взирая на лица» или «по внешности»
  rationale: Контекст хозяина и рабов указывает прежде всего на социальный статус, однако сноска сохраняет более буквальную и широкую формулировку.
- issue: τὸ πνεῦμα — Дух или дух
  choice: Дух с прописной буквы
  alternative: дух человека
  rationale: Определённый артикль и роль в Божьем призыве наиболее естественно указывают на Божьего Духа, хотя греческий текст сам по себе не использует различия прописных и строчных букв.
- issue: μήποτε οὐ μὴ φοβηθήσονται
  choice: чтобы они не перестали бояться
  alternative: «как бы они вовсе не убоялись»
  rationale: Необычное сочетание μήποτε и οὐ μή выражает опасение сильного отрицательного результата; выбранная формулировка естественна по-русски и не превращает высказывание в простое предсказание.
translation_notes:
  register: Современный литературный русский язык с наставительным, достойным тоном. Императив в единственном числе сохраняет прямое обращение. Синтаксис слегка разгружен по сравнению с греческим, но причинно-следственная структура и богословская напряжённость сохранены.
