source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: ru
  text: Не отворачивайся от нуждающегося, но делись всем со своим братом и не говори, что это твоё. Ведь если вы причастны к бессмертному[a], то тем более — к смертным вещам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в том, что бессмертно». Под этим могут подразумеваться духовные или вечные блага; текст не уточняет.'
    reason: Сохраняет грамматическую и богословскую неоднозначность субстантивированного τῷ ἀθανάτῳ.
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: не отворачивайся от
  rationale: Естественно передаёт запрет отвернуться от нуждающегося или отказать ему; русское управление с «от» предпочтительнее буквального воспроизведения греческого прямого дополнения.
- source_word: τὸν ἐνδεόμενον
  choice: нуждающегося
  rationale: Передаёт субстантивированное причастие без сужения нужды исключительно до бедности.
- source_word: συγκοινωνήσεις
  choice: делись
  rationale: Выражает участие в общем владении и предоставление своего другому; повелительная форма естественно передаёт предписывающее будущее.
- source_word: πάντα
  choice: всем
  rationale: Сохраняет широкий охват «всего», не уточняя имущество там, где греческий текст этого прямо не делает.
- source_word: κοινωνοί ἐστε
  choice: вы причастны
  rationale: Сохраняет смысл совместного участия и переход оригинала от обращения к одному человеку к форме множественного числа.
- source_word: τῷ ἀθανάτῳ / τοῖς θνητοῖς
  choice: к бессмертному / к смертным вещам
  rationale: Сохраняет контраст оригинала и различие между субстантивированным единственным и множественным числом, не подменяя их толкованием.
theological_decisions:
- issue: Смысл «бессмертного» и «смертных вещей»
  choice: Сохранить абстрактную формулировку оригинала
  alternative: Передать как «вечные блага» и «земное имущество»
  rationale: Греческий текст допускает понимание бессмертного как духовных или вечных благ, а смертного — как материальных благ, но прямо этого не уточняет; перевод не должен устранять данную смысловую открытость.
- issue: Смена числа обращения
  choice: Сохранить «ты» в предписаниях и «вы» в обосновании
  alternative: Унифицировать всё обращение в единственном числе
  rationale: Переход от форм единственного числа к ἐστε во множественном числе присутствует в источнике и может расширять заключительное утверждение до общины.
translation_notes:
  register: Современный литературный русский язык с ясным, наставительным и достойным звучанием. Единственное число обращения сохранено в повелениях, а множественное — в заключительном доводе. Восклицательный знак естественно передаёт риторический вопрос с πόσῳ μᾶλλον, не превращая его в обычный вопрос.
