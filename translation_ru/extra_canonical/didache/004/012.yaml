source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μισήσεις πᾶσαν ὑπόκρισιν καὶ πᾶν ὃ μὴ ἀρεστὸν τῷ Κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/012.yaml
  text: You shall hate all hypocrisy and everything that is not pleasing to the Lord.
translation:
  language: ru
  text: Ненавидь всякое лицемерие и всё, что не угодно Господу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μισήσεις
  choice: Ненавидь
  rationale: Греческая форма будущего времени в наставительном контексте выражает категорическое предписание; русский императив передаёт это естественно и прямо.
- source_word: πᾶσαν ὑπόκρισιν
  choice: всякое лицемерие
  rationale: ὑπόκρισις здесь имеет обычное нравственное значение притворства, неискренности; «всякое» сохраняет всеохватность πᾶσαν.
- source_word: πᾶν ὃ μὴ ἀρεστὸν
  choice: всё, что не угодно
  rationale: Сохраняется широкая и намеренно неопределённая формулировка оригинала; «угодно» естественно передаёт значение ἀρεστόν в отношении к Господу.
- source_word: τῷ Κυρίῳ
  choice: Господу
  rationale: Традиционное и литературно естественное соответствие греческому κύριος в религиозном контексте.
theological_decisions:
- issue: Категоричность призыва ненавидеть
  choice: Сохранено прямое «Ненавидь»
  alternative: «Отвергай» или «Гнушайся»
  rationale: Оригинал употребляет μισέω («ненавидеть»); смягчение заменило бы выраженную автором нравственную резкость толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и категорическая форма наставления сохранена без конфессиональных добавлений.
