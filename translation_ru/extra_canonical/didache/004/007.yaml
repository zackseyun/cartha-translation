  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: ru
  text: Не медли давать и, давая, не ропщи, ибо узнаешь, кто есть добрый воздаятель награды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ διστάσεις δοῦναι
  choice: Не колеблясь давай
  rationale: Передаёт запрет медлить или сомневаться перед даянием естественной современной русской формой.
- source_word: γογγύσεις
  choice: ропщи
  rationale: «Роптать» точно выражает недовольное ворчание и сохраняет нравственно-наставительный регистр.
- source_word: γνώσῃ
  choice: узнаешь
  rationale: Сохраняет будущее время и прямое значение греческого глагола, не заменяя его более толковательным «познаешь».
- source_word: ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης
  choice: кто воздаёт добрую награду
  rationale: Естественно передаёт образ благого Воздаятеля награды; оборот оставляет его неназванным, как и греческий текст.
theological_decisions:
- issue: Личность воздающего
  choice: «кто воздаёт» без прямого наименования Бога
  alternative: «благой Воздаятель награды» или «Бог, подающий награду»
  rationale: Источник говорит описательно и не называет Бога прямо; перевод сохраняет эту имплицитность.
- issue: Связь καλός с выражением о воздаянии
  choice: «добрую награду»
  alternative: «благой Воздаятель награды»
  rationale: Греческое καλός формально согласуется с ἀνταποδότης («добрый/благой воздаятель»), поэтому выбранная русская формулировка несколько перераспределяет определение ради естественности. Однако она сохраняет общий положительный смысл воздаяния.
translation_notes:
  register: Краткое наставление в современном литературном русском языке с достоинством раннехристианской паренезы. Синтаксис сделан плавным и понятным без конфессиональной терминологии.
