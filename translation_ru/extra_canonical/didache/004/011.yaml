  terminology: '«Рабы» / «господа» — верная исторически конкретная пара. «Представителям Бога» согласовано с русским множественным «господам» и хорошо отражает смысл τύπος, признанный английской аудиторской традицией. В сноске «прообразу Бога» неудачно: оно может предполагать, что хозяин является предсуществующим образцом Бога, чего греческий контекст не требует. Альтернативу следует ограничить «образом Бога» / «образцом Бога».'
