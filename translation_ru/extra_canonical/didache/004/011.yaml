  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you servants shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: ru
  text: Вы же, рабы, подчиняйтесь своим господам как представителям Бога[a], со стыдом и страхом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как образу Бога»; возможно также: «как образцу Бога».'
    reason: Слово τύπος может обозначать представителя или видимую фигуру, а также образ или образец.
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: В контексте отношений с κυρίοις слово обозначает рабов, а не служителей вообще; прямой перевод сохраняет историческую социальную реальность текста.
- source_word: ὑποτάγησεθε
  choice: подчиняйтесь
  rationale: Передаёт требуемое состояние подчинения естественным современным русским императивом.
- source_word: κυρίοις
  choice: господам
  rationale: В паре с δοῦλοι речь идёт о земных владельцах или хозяевах рабов; «господа» сохраняет эту связь и высокий регистр.
- source_word: τύπῳ Θεοῦ
  choice: как представителям Бога
  rationale: При личном референте τύπος может обозначать фигуру или представителя, видимо воплощающего чужую власть. Число согласовано с множественным «господам», а неоднозначность слова отмечена в сноске.
- source_word: ἐν αἰσχύνῃ καὶ φόβῳ
  choice: с почтением и страхом
  rationale: В данном увещательном контексте αἰσχύνη выражает почтительную сдержанность или уважение, тогда как φόβος сохраняется как «страх»; перевод избегает неестественного здесь буквального «со стыдом».
theological_decisions:
- issue: Смысл выражения ὡς τύπῳ Θεοῦ
  choice: как представителям Бога
  alternative: как образу Бога / как прообразу Бога
  rationale: Основной текст передаёт функциональный смысл представительства Божьей власти, не утверждая тождества господ с Богом. Сноска сохраняет возможность более формального понимания τύπος как «образа» или «прообраза».
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и достойным звучанием. Исторически конкретные «рабы» и «господа» сохранены без смягчающей модернизации.
