  timestamp: '2026-07-18T10:05:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: сохранены обращение, два параллельных будущих предписания, личный наставник, «слово Божие», сильное сравнение «как Господа» и намеренно необычная связь κυριότης—Κύριος. Однако «возвещается» усиливает нейтральное λαλεῖται («говорится», «о чём говорится») до проповеди/провозглашения. Более близкое «говорится о господстве» сохраняет пассивную безличную конструкцию и не сужает значение κυριότης.'
  naturalness: «Дитя моё» и будущее время как предписание уместны в наставительном, несколько торжественном регистре. «Где говорится о господстве» по-русски естественнее и точнее, чем «где возвещается господство». Написание «Божие» предпочтительно для данного возвышенно-религиозного регистра, хотя «Божье» не является ошибкой.
  terminology: «Господь» и «господство» удачно удерживают существенную этимологическую и смысловую связь κυριότης—Κύριος. Сноска должна характеризовать κυριότης как многозначительное абстрактное существительное («господство», «владычество», возможно власть/достоинство господина), не определяя его без достаточных оснований как именно «господнюю», то есть Божью, власть.
  issues:
  - severity: medium
    issue: «возвещается господство» передаёт λαλεῖται слишком узко и интенсивно.
    rationale: Греческое λαλεῖται означает «говорится», «ведётся речь»; оно не обязательно предполагает возвещение или проповедь. Формулировка «говорится о господстве» ближе к оригиналу и к английскому аудиторскому варианту “where lordship is spoken”.
  - severity: low
    issue: Сноска необоснованно конкретизирует возможное значение κυριότης как «господнюю» власть.
    rationale: В данном трудном выражении принадлежность господства Богу не выражена отдельно. Следует пояснить лексическую многозначность, сохранив референтную неопределённость оригинала.
  revised_text: Дитя моё, день и ночь будешь помнить того, кто говорит тебе слово Божие, и будешь почитать его как Господа, ибо где говорится о господстве[a], там Господь.
