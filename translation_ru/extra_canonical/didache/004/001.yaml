source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: ru
  text: Дитя моё, день и ночь будешь помнить того, кто говорит тебе слово Божие, и будешь почитать его как Господа, ибо где говорится о господстве[a], там Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владычестве». Греческое слово однокоренно со словом «Господь» и может обозначать господство, власть или достоинство господина; точный смысл выражения остаётся спорным.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Τέκνον μου
  choice: Дитя моё
  rationale: Сохраняет обращение наставника к ученику и звучит dignified and naturally in a catechetical context.
- source_word: μνησθήσῃ … τιμήσεις
  choice: будешь помнить … будешь почитать
  rationale: Обе формы — будущие изъявительные с повелительной силой; одинаковая русская конструкция сохраняет их грамматический параллелизм и наставительный тон.
- source_word: τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ
  choice: того, кто говорит тебе слово Божье
  rationale: Прямо передаёт личного наставника и содержание его речи без добавления специального церковного статуса.
- source_word: ὡς Κύριον
  choice: как Господа
  rationale: Сохраняет сильную и богословски напряжённую формулировку оригинала, не ослабляя её до «как посланника Господа».
- source_word: κυριότης
  choice: господство
  rationale: Передаёт абстрактное существительное, однокоренное с «Господь», и сохраняет словесную связь κυριότης—Κύριος; неоднозначность пояснена в сноске.
- source_word: ἐκεῖ Κύριός ἐστιν
  choice: там есть Господь
  rationale: Сохраняет простое утверждение присутствия Господа без добавления отсутствующего в греческом пояснения.
theological_decisions:
- issue: Почитание говорящего слово Божье «как Господа»
  choice: 'Сохранить прямое сравнение: «почитать его как Господа»'
  alternative: «почитать его как представителя Господа»
  rationale: Альтернатива истолковывает и смягчает текст; греческий оригинал прямо говорит ὡς Κύριον.
- issue: Значение κυριότης
  choice: «господство» с пояснительной сноской
  alternative: «слово Господне» или «власть Господа»
  rationale: В оригинале стоит κυριότης, а не λόγος Κυρίου; основной текст не должен молча заменять необычное выражение более привычной богословской формулой.
translation_notes:
  register: Современный литературный русский с торжественным наставительным оттенком. Будущее время употреблено как предписание, отражая две параллельные греческие формы. Необычная фраза о «господстве» сохранена ради словесной связи с «Господом» и отмечена сноской.
