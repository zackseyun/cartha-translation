revisions:
- from: Дитя моё, день и ночь будешь помнить того, кто говорит тебе слово Божье, и будешь почитать его как Господа, ибо где возвещается господство[a], там есть Господь.
  to: Дитя моё, день и ночь будешь помнить того, кто говорит тебе слово Божие, и будешь почитать его как Господа, ибо где говорится о господстве[a], там Господь.
  rationale: Исправлены только два места, где перевод либо усиливал, либо излишне конкретизировал оригинал. «Говорится о господстве» точно передаёт безличное λαλεῖται и оставляет трудную формулу столь же неразрешённой, как в греческом. Сноска сохраняет словесную связь с «Господом», но не навязывает богословское истолкование.
