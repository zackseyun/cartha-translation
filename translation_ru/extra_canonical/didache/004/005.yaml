review_pass:
  verdict: revise
  source_fidelity: 'Вторая половина в черновике верно передаёт порицаемый контраст между готовностью получать и уклонением от даяния. Однако «когда нужно дать» вводит модальность необходимости, которой в греческом πρὸς δὲ τὸ δοῦναι нет: выражение просто обозначает действие «давать». «Прячет их» несколько сильнее и менее буквально, чем συσπῶν («стягивая/отдёргивая [руки]»).'
  naturalness: Фраза в целом понятна и литературна, но «Не будь тем, кто» менее естественно, чем «Не будь из тех, кто». Оборот «когда дело доходит до того, чтобы дать» естественно выражает греческое противопоставление без добавления идеи долга.
  terminology: Специальной богословской терминологии и собственных имён нет. Телесный образ рук следует сохранить, не заменяя его отвлечённым осуждением скупости.
  issues:
