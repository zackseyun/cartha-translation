    issue: Добавлена модальность в «когда нужно дать».
    rationale: Оригинал противопоставляет получение и даяние, но не уточняет, что давать «нужно»; добавление меняет оттенок высказывания.
  - severity: low
    issue: «Прячет их» неточно передаёт συσπῶν.
    rationale: Глагол описывает стягивание или отдёргивание рук, а не их сокрытие; «отдёргивает» сохраняет образ и естественен по-русски.
