  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: ru
  text: Не будь из тех, кто протягивает руки, чтобы получить, но отдёргивает их, когда дело доходит до того, чтобы дать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνων τὰς χεῖρας
  choice: протягивает руки
  rationale: Сохраняет конкретный телесный образ и естественно звучит по-русски в связи с получением.
- source_word: πρὸς μὲν τὸ λαβεῖν
  choice: чтобы получить
  rationale: Передаёт направленность действия πρὸς τὸ с инфинитивом без ненужной буквальности.
- source_word: πρὸς δὲ τὸ δοῦναι
  choice: когда нужно дать
  rationale: В русском ясно обозначает противопоставленную ситуацию, связанную с даянием; необходимость подразумевается нравственным увещанием, а не вводится как отдельное предписание.
- source_word: συσπῶν
  choice: прячет их
  rationale: Передаёт образ стягивания или втягивания рук как отказа дать; более естественно и наглядно, чем буквальное «сжимает» или «стягивает».
theological_decisions:
- issue: Характер порицаемого поведения
  choice: Сохранён образ человека, охотно принимающего, но уклоняющегося от даяния.
  alternative: 'Перевести отвлечённо: «не будь жадным» или «не отказывайся давать».'
  rationale: Греческий текст выражает наставление через яркий телесный образ; отвлечённая формулировка утратила бы риторический контраст и могла бы сузить смысл.
translation_notes:
  register: Современный литературный русский; краткая, ритмичная форма нравственного наставления. Конструкция «а когда нужно дать — прячет их» естественно раскрывает эллиптический греческий параллелизм, сохраняя его наглядность и резкость.
