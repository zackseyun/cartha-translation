source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: ru
  text: В собрании исповедуй свои проступки и не приступай к молитве с нечистой совестью. Таков путь жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: в собрании
  rationale: В данном раннехристианском контексте ἐκκλησία обозначает собравшуюся общину; «в собрании» естественно передаёт обстоятельство места и не сужает смысл до здания или позднейшей институции.
- source_word: ἐξομολογήσῃ
  choice: исповедуй
  rationale: Форма выражает предписание; «исповедуй» сохраняет смысл открытого признания проступков и звучит естественно в нравственном наставлении.
- source_word: παραπτώματά
  choice: проступки
  rationale: Слово обозначает прегрешения или нарушения; «проступки» сохраняет нравственный смысл без неоправданного усиления.
- source_word: προσελεύσῃ ἐπὶ προσευχήν
  choice: приступай к молитве
  rationale: Устойчивое и точное русское выражение для приближения или обращения к молитве; притяжательное местоимение не добавлено, поскольку его нет в греческом.
- source_word: συνειδήσει πονηρᾷ
  choice: с нечистой совестью
  rationale: Буквально возможно «со злой совестью», но по-русски «нечистая совесть» естественнее обозначает нравственно виновное состояние, не снимая этической силы выражения.
- source_word: Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς
  choice: Таков путь жизни
  rationale: Краткая формула естественно передаёт указательное утверждение и сохраняет образ пути.
theological_decisions:
- issue: Характер исповедания в собрании
  choice: Не уточнять адресата или форму исповеди
  alternative: «Исповедуйся перед общиной» или «исповедуй грехи священнику»
  rationale: Греческий текст указывает место или контекст — «в собрании», — но не называет конкретного принимающего исповедь и не устанавливает позднейшую церковную форму.
- issue: Значение «злой совести»
  choice: Передать как «нечистая совесть»
  alternative: «злая совесть» или «виновная совесть»
  rationale: «Нечистая» идиоматично выражает нравственно неблагое состояние; «виновная» могла бы излишне сузить смысл до субъективного чувства вины.
translation_notes:
  register: Современный литературный русский язык; наставительный, сжатый и dignified тон. Синтаксис сохранён близким к греческому, но без тяжеловесной буквальности. Архаизмы и конфессионально маркированные уточнения исключены.
