id: DID.4.4
reference: Didache 4:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διψυχήσεις, πότερον ἔσται ἢ οὔ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/004.yaml
  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: ru
  text: Не сомневайся, будет ли это или нет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Не будь двоедушен, будет ли это или нет»; то есть не колеблись между двумя мнениями.'
    reason: Сохраняет заметный в греческом слове διψυχέω образ внутренней раздвоенности, который невозможно естественно воспроизвести в основном русском тексте без ложного оттенка лицемерия.
lexical_decisions:
- source_word: διψυχήσεις
  choice: не сомневайся
  rationale: Глагол διψυχέω буквально связан с представлением о «раздвоенности души», но в конструкции с косвенным вопросом πότερον… ἢ οὔ естественно передаёт колебание или сомнение. Русское «не сомневайся» ясно и современно выражает смысл, не привнося оттенка лицемерия, который может иметь слово «двоедушный».
- source_word: πότερον … ἢ οὔ
  choice: будет ли это или нет
  rationale: 'Сохраняется форма альтернативного косвенного вопроса: «будет ли… или нет».'
- source_word: ἔσται
  choice: будет это
  rationale: Форма будущего времени от εἰμί оставлена без уточнения подразумеваемого события, поскольку греческий текст его прямо не называет.
theological_decisions:
- issue: Неуказанный субъект или предмет ἔσται
  choice: Сохранить неопределённое «это»
  alternative: 'Уточнить: «сбудется ли это», «наступит ли суд» или назвать иное событие'
  rationale: Источник говорит лишь ἔσται («будет»); конкретизация устранила бы подлинную контекстуальную неоднозначность и могла бы навязать богословское толкование.
- issue: Образ «раздвоенности» в διψυχέω
  choice: Передать функционально как «сомневаться» и отметить буквальный образ в сноске
  alternative: Перевести в основном тексте «не будь двоедушен»
  rationale: «Двоедушный» в современном русском часто означает неискреннего или лицемерного человека, тогда как здесь косвенный вопрос указывает прежде всего на сомнение и колебание.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная формулировка соответствует афористическому характеру оригинала. Неопределённость выражения «будет это» сохранена намеренно.
