lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: Если у тебя есть средства
  rationale: Греческое выражение буквально означает «если имеешь» и оставляет объект невыраженным; в контексте наставления о даянии русское «есть средства» естественно передаёт подразумеваемое имущество, не сводя его исключительно к деньгам.
- source_word: διὰ τῶν χειρῶν σου
  choice: своими руками
  rationale: Сохраняет образ личного, непосредственного действия, выраженный греческим оборотом «через твои руки», но звучит естественно по-русски.
- source_word: δώσεις
  choice: дай
  rationale: Форма будущего времени в наставлениях Дидахе имеет предписывающую силу; русский повелительный вид передаёт эту функцию яснее, чем буквальное «дашь».
- source_word: λύτρωσιν
  choice: выкуп
  rationale: Прямое значение — цена освобождения, выкуп; этот выбор сохраняет сильную метафору исходного текста и не заменяет её более интерпретирующими словами вроде «искупление» или «милостыня».
- source_word: ἁμαρτιῶν σου
  choice: за свои грехи
  rationale: Предлог «за» естественно связывает «выкуп» с тем, от чего он освобождает, сохраняя богословски напряжённую формулировку источника.
theological_decisions:
- issue: Связь даяния с выкупом за грехи
  choice: Сохранена прямая формулировка «дай выкуп за свои грехи»
  alternative: «Подавай милостыню во искупление грехов» или смягчающее объяснение о знаке покаяния
  rationale: Греческий текст прямо называет даваемое λύτρωσις ἁμαρτιῶν и не разъясняет механизм этой связи. Перевод не должен устранять напряжение или привносить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык; краткая назидательная фраза с сохранением конкретного образа рук и сильной метафоры выкупа. Местоимения даны в единственном числе по греческому тексту.
