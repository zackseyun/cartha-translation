  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: ru
  text: И каждый день ищи встречи со святыми, чтобы находить покой в их словах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищи лица святых»; выражение обозначает поиск личной встречи или присутствия святых.'
    reason: Поясняет буквальный образ оригинала и основание для естественного русского выражения «ищи встречи со святыми».
lexical_decisions:
- source_word: Ἐκζητήσεις
  choice: ищи
  rationale: Передаёт настойчивое, целенаправленное разыскивание, при этом естественно звучит как наставление в современном русском языке.
- source_word: καθ’ ἡμέραν
  choice: каждый день
  rationale: Прямой и естественный эквивалент, выражающий ежедневность действия.
- source_word: τὰ πρόσωπα τῶν ἁγίων
  choice: общения со святыми
  rationale: Буквально «лица святых»; в данном контексте оборот обозначает личное присутствие и встречу с ними. «Общение» естественно передаёт практическую цель таких встреч, не сводя выражение к физическим лицам.
- source_word: ἐπαναπαῇ
  choice: находить покой
  rationale: Глагол выражает обретение покоя или отрады; несовершенный инфинитив по-русски естественно согласуется с ежедневным поиском.
- source_word: τοῖς λόγοις αὐτῶν
  choice: в их словах
  rationale: Сохраняет образ слов как того, в чём человек находит покой, и соответствует конструкции греческого текста.
theological_decisions:
- issue: Значение οἱ ἅγιοι
  choice: святые
  alternative: верующие / святой народ
  rationale: 'Сохранён широкий раннехристианский термин без позднейшего конфессионального уточнения: контекст допускает понимание как членов святого сообщества, особенно наставляющих словом.'
- issue: Характер покоя в ἐπαναπαῇ
  choice: покой
  alternative: отрада / подкрепление
  rationale: «Покой» сохраняет богословскую и образную ёмкость греческого слова и не уточняет, идёт ли речь преимущественно о душевном утешении, духовном укреплении или наставлении.
translation_notes:
  register: Современный литературный русский язык; наставительный тон передан формой единственного числа «ищи», соответствующей обращению контекста Дидахе. Формулировка краткая и dignified, без архаизмов и конфессионально узких толкований.
