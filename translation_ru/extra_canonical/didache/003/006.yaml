source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: ru
  text: Дитя моё, не становись ропотником, потому что это ведёт к богохульству; не будь ни своевольным, ни злонамеренным, ибо от всего этого рождаются богохульства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Дитя моё
  rationale: Сохраняет обращение наставника к ученику и достоинство исходной формулы; в современном русском звучит естественнее буквального «Моё дитя».
- source_word: γόγγυσος
  choice: ропотником
  rationale: Передаёт не просто бытовое недовольство, а привычку роптать; существительное сохраняет конструкцию μὴ γίνου — «не становись».
- source_word: ὁδηγεῖ
  choice: ведёт
  rationale: Прямо передаёт образ движения к нравственному следствию.
- source_word: βλασφημίαν / βλασφημίαι
  choice: богохульству / богохульства
  rationale: Сохраняет соответственно единственное и множественное число греческого текста и религиозно-нравственный смысл βλασφημία.
- source_word: αὐθάδης
  choice: своевольным
  rationale: Передаёт упрямую самоуверенность и действие по собственной воле; точнее в данном перечне пороков, чем узкое «дерзким».
- source_word: πονηρόφρων
  choice: злонамеренным
  rationale: Передаёт направленность мысли и намерения ко злу, не ограничивая значение общей характеристикой «зломыслящий».
- source_word: ἐκ γὰρ τούτων ἁπάντων ... γεννῶνται
  choice: ибо всё это порождает...
  rationale: Естественная русская передача буквального «из всего этого рождаются» с сохранением причинной связи и совокупности названных пороков.
theological_decisions:
- issue: Значение βλασφημία
  choice: богохульство
  alternative: хула / злоречие
  rationale: В раннехристианском наставлении слово естественно обозначает хулу на Бога или священное. Однако перевод не добавляет объект хулы, которого в греческом тексте нет.
- issue: Неодинаковое число βλασφημίαν и βλασφημίαι
  choice: сохранить «к богохульству» и «богохульства»
  alternative: унифицировать оба случая как единственное число
  rationale: Различие числа явно присутствует в источнике и может выражать переход от общего порока к его многочисленным проявлениям; его не следует сглаживать.
translation_notes:
  register: Современный литературный русский, наставительный и достойный по тону. Синтаксис слегка упорядочен ради ясности, но причинные связи, трёхчастный перечень пороков и различие числа у βλασφημία сохранены.
