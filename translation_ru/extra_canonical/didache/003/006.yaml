    issue: В заключительной фразе активная конструкция заменяет пассивно-исходную конструкцию оригинала.
    rationale: ἐκ τούτων ἁπάντων («от/из всего этого») и γεννῶνται («рождаются») лучше сохраняются русским «от всего этого рождаются». Это устраняет ненужную синтаксическую перестройку без изменения смысла.
  revised_text: Дитя моё, не становись ропотником, потому что это ведёт к богохульству; не будь ни своевольным, ни злонамеренным, ибо от всего этого рождаются богохульства.
