source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: ru
  text: Дитя моё, не становись толкователем знамений, потому что это ведёт к идолопоклонству; не будь ни заклинателем, ни астрологом, ни тем, кто совершает очистительные обряды, и даже не желай смотреть на всё это[a], ибо из всего этого рождается идолопоклонство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и даже не желай видеть всё это».'
    reason: Глагол βλέπειν допускает как нейтральное «смотреть на», так и более непосредственное «видеть»; основной текст выбран ради естественности русского наставления.
lexical_decisions:
- source_word: οἰωνοσκόπος
  choice: гадатель по приметам
  rationale: Слово обозначает человека, истолковывающего знамения или предзнаменования; этот вариант понятен современному читателю и сохраняет оккультный смысл.
- source_word: ἐπαοιδός
  choice: заклинатель
  rationale: Передаёт человека, произносящего магические заклинания, без излишнего уточнения характера практики.
- source_word: μαθηματικός
  choice: астролог
  rationale: В данном позднеантичном контексте слово относится не к математику в современном смысле, а к астрологу.
- source_word: περικαθαίρων
  choice: совершающий очистительные обряды
  rationale: Причастие указывает на совершение ритуального очищения, вероятно магического или языческого; описательный перевод избегает неясного слова «очиститель».
- source_word: εἰδωλολατρεία
  choice: идолопоклонство
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий религиозно-нравственный вес исходного слова.
theological_decisions:
- issue: Связь перечисленных оккультных практик с идолопоклонством
  choice: 'Сохранено прямое утверждение: они ведут к идолопоклонству, и из них оно рождается.'
  alternative: Ослабить связь формулировкой «могут привести» или истолковать её как исключительно историческую.
  rationale: Греческий текст выражает категорическую причинную связь и не содержит модального смягчения.
- issue: Референт αὐτά
  choice: «всё это» — перечисленные практики и связанные с ними явления
  alternative: «на них» — перечисленные лица
  rationale: Местоимение αὐτά имеет средний род во множественном числе и потому не отсылает непосредственно к перечисленным обозначениям лиц мужского рода.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Обращение «Дитя моё» сохраняет педагогический и духовный тон. Перечень оформлен естественно по-русски, но его нарастающая запретительная структура и заключительное причинное утверждение сохранены.
