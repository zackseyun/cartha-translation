  - severity: medium
    issue: Неоднородное перечисление «ни заклинателем, ни астрологом, ни совершающим очистительные обряды».
    rationale: Последний элемент требует естественной русской опоры «тем, кто…»; такая правка сохраняет субъектное значение греческого причастия περικαθαίρων.
