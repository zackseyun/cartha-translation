base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: ru
  text: Дитя моё, не предавайся похоти, потому что похоть ведёт к распутству[a]. Не сквернословь и не смотри на других похотливо[b], потому что из всего этого рождаются прелюбодеяния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В представленном греческом тексте стоит πορείαν — «к пути, странствию»; вероятно, это ошибка передачи вместо πορνείαν — «к распутству, блуду», как читается это место в других изданиях.
    reason: textual
  - marker: b
    text: Греческое слово буквально означает «с высоко поднятыми глазами» и может пониматься также как «высокомерный»; в данном контексте оно, вероятно, говорит о похотливом, блуждающем взгляде.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: предавайся похоти / похоть
  rationale: Передаёт не всякое желание вообще, а порочное сексуальное влечение, что следует из ближайшего контекста о распутстве и прелюбодеяниях.
- source_word: πορείαν
  choice: распутству
  rationale: В представленном тексте стоит πορείαν («путь, странствие»), однако контекст и известная форма этого места указывают на πορνείαν («блуд, половая распущенность»). Основной текст передаёт контекстуально осмысленное чтение, а расхождение отмечено в сноске.
- source_word: αἰσχρολόγος
  choice: не сквернословь
  rationale: Естественно передаёт непристойную, постыдную речь как привычное поведение, сохраняя увещательный строй.
- source_word: ὑψηλοόφθαλμος
  choice: не смотри на других похотливо
  rationale: Буквально слово связано с «высоко поднятыми глазами»; в данном сексуальном контексте вероятнее всего обозначает похотливый, блуждающий взгляд. Возможное значение высокомерия сохранено в сноске.
- source_word: μοιχεῖαι
  choice: прелюбодеяния
  rationale: Сохранено множественное число греческого текста и конкретное значение супружеской неверности.
theological_decisions:
- issue: Связь похоти, речи, взгляда и прелюбодеяния
  choice: 'Сохранена причинно-нравственная последовательность без смягчения: «из всего этого рождаются прелюбодеяния».'
  alternative: Обобщить как «всё это ведёт к прелюбодеянию».
  rationale: Греческое γεννῶνται буквально выражает рождение или возникновение, а множественное μοιχεῖαι подчёркивает конкретные случаи прелюбодеяния.
- issue: Значение ὑψηλοόφθαλμος
  choice: В основном тексте передано сексуально-контекстуальное значение похотливого взгляда.
  alternative: «Не будь высокомерен» или буквально «не поднимай надменно глаз».
  rationale: Сочетание с похотью, непристойной речью и итоговым упоминанием прелюбодеяний поддерживает сексуальное прочтение, но лексическая неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский язык с ясным увещательным тоном. «Дитя моё» сохраняет теплоту наставления; глагольные запреты звучат естественнее русских именных характеристик. Термины «похоть», «распутство» и «прелюбодеяния» достаточно понятны и сохраняют нравственную серьёзность оригинала.
