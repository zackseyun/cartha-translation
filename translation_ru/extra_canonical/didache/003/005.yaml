base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: ru
  text: Дитя моё, не становись лжецом, потому что ложь ведёт к краже. Не будь ни сребролюбивым, ни тщеславным, ибо из всего этого рождаются кражи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Дитя моё
  rationale: Сохраняет наставительное и близкое обращение оригинала в dignified современном русском.
- source_word: ψεύστης / τὸ ψεῦσμα
  choice: лжецом / ложь
  rationale: Передаёт связь однокоренных греческих понятий естественной русской лексикой.
- source_word: κλοπήν / κλοπαὶ
  choice: к краже / кражи
  rationale: Сохраняет конкретное значение хищения и различие единственного и множественного числа в оригинале.
- source_word: φιλάργυρος
  choice: сребролюбивым
  rationale: Точно передаёт любовь к деньгам как устойчивый нравственный порок; слово понятно в религиозно-нравственном контексте и не сводит смысл лишь к общей жадности.
- source_word: κενόδοξος
  choice: тщеславным
  rationale: Естественный современный эквивалент стремления к пустой славе.
- source_word: γεννῶνται
  choice: рождаются
  rationale: Сохраняет образ рождения, выраженный греческим глаголом.
