  text: Τέκνον μου, φεῦγε ἀπὸ παντὸς πονηροῦ καὶ ἀπὸ παντὸς ὁμοίου αὐτοῦ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: ru
  text: Дитя моё, беги от всякого зла и от всего, что подобно ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Дитя моё
  rationale: Передаёт прямое наставническое обращение с теплотой и достоинством; слово не уточняет пол адресата.
- source_word: φεῦγε ἀπό
  choice: беги от
  rationale: Сохраняет сильный и конкретный образ решительного удаления, выраженный греческим императивом настоящего времени.
- source_word: παντὸς πονηροῦ
  choice: всякого зла
  rationale: Субстантивированное прилагательное среднего рода допускает обобщённое значение «всё злое / всякое зло»; русский вариант естественен и не сужает смысл до отдельных злых поступков или предметов.
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: от всего, что подобно ему
  rationale: Сохраняет широкую и намеренно неуточнённую отсылку к тому, что имеет сходство со злом.
theological_decisions:
- issue: Объём запрета
  choice: «всякого зла» и «всего, что подобно ему»
  alternative: «всякого злого дела» и «всего похожего на него»
  rationale: В оригинале нет существительного «дело»; более широкий перевод сохраняет нравственную всеохватность и исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная фраза сохраняет отеческий тон, параллелизм и категоричность греческого текста.
