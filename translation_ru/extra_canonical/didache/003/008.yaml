id: DID.3.8
reference: Didache 3:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: ru
  text: Будь терпелив, милосерден, бесхитростен, тих и добр и всегда трепещи перед словами, которые ты услышал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γίνου
  choice: Будь
  rationale: В нравственном наставлении форма γίνου естественно передаётся как «будь»; вариант «становись» возможен, но в сочетании со всем рядом определений и причастием звучал бы по-русски менее естественно.
- source_word: μακρόθυμος
  choice: терпелив
  rationale: Передаёт стойкое долготерпение в обращении с людьми без архаичного оттенка слова «долготерпелив».
- source_word: ἐλεήμων
  choice: милосерден
  rationale: Обычное и точное соответствие качеству сострадания и милости.
- source_word: ἄκακος
  choice: бесхитростен
  rationale: В данном перечне нравственных качеств обозначает отсутствие злого умысла и коварства; «беззлобен» также возможно, но уже по значению.
- source_word: ἡσύχιος
  choice: кроток
  rationale: В контексте личных нравственных качеств передаёт спокойный, мирный нрав; буквальное «тих» по-русски может ошибочно восприниматься как указание на громкость голоса.
- source_word: τρέμων
  choice: трепещи перед
  rationale: Сохраняет сильный образ благоговейного страха и естественно сочетается в русском с объектом «словами».
- source_word: διὰ παντός
  choice: всегда
  rationale: 'Идиоматически передаёт значение постоянства: «непрестанно, во всякое время».'
- source_word: οὓς ἤκουσας
  choice: которые ты услышал
  rationale: Аорист указывает на состоявшееся получение наставления; простое прошедшее время сохраняет это без внесения дополнительного видового оттенка.
theological_decisions:
- issue: Характер трепета перед услышанными словами
  choice: «трепещи перед словами» без уточнения их статуса
  alternative: «благоговей перед словами» или «трепещи перед словами Божьими»
  rationale: Греческий текст говорит о трепете, но не добавляет «Божьими» и не снимает напряжение образа, заменяя его только благоговением.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранён прямой ряд повелительных характеристик во втором лице единственного числа; синтаксис слегка выровнен для естественного русского звучания без устранения образа трепета.
