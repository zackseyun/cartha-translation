id: DID.3.10
reference: Didache 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: ru
  text: Всё, что с тобой случается, принимай как благо, зная, что без Бога ничего не происходит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: Всё, что с тобой случается
  rationale: Передаёт широкий смысл происходящего с человеком. Необычное ἐνεργήματα уточняет происходящее как совершающиеся события или действия, но буквальное воспроизведение сделало бы русскую фразу тяжеловесной.
- source_word: ὡς ἀγαθὰ
  choice: как благо
  rationale: Сохраняет сравнительно-оценочную конструкцию ὡς и не усиливает её до утверждения, что каждое событие само по себе является добром.
- source_word: προσδέξῃ
  choice: принимай
  rationale: Естественно передаёт предписывающую силу формы в контексте наставлений Дидахе.
- source_word: ἄτερ Θεοῦ
  choice: без Бога
  rationale: Прямой и естественный русский эквивалент, сохраняющий богословскую ёмкость выражения «вне/без Бога».
theological_decisions:
- issue: Связь происходящего с Божьим промыслом
  choice: что без Бога ничего не происходит
  alternative: что Бог является непосредственной причиной всего происходящего
  rationale: Греческий текст утверждает, что ничто не происходит ἄτερ Θεοῦ, но не разъясняет характер Божьего участия. Перевод сохраняет это напряжение и не вводит более узкое учение о непосредственной причинности.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и легко воспринимаемая форма наставления. Единственное число «с тобой» сохранено по греческому тексту.
