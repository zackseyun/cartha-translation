review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: ὀργίλος — устойчивая вспыльчивость, ὀργή — гнев, а финальное φόνοι γεννῶνται сохраняет множественное число и причинно-порождающий образ. Однако «ревнивым» в современном русском прежде всего обозначает романтическую или собственническую ревность и слишком сужает ζηλωτής; в данном перечне пороков уместнее «завистливым».'
  naturalness: '«Не будь также ревнивым, ни сварливым, ни горячим» синтаксически и стилистически неудачно: после «не будь» естественен ряд с повтором «ни», а «горячим» без уточнения в современном русском звучит неясно и не передаёт надёжно нравственную черту θυμικός. «Гневливым» естественно и ясно.'
  terminology: «Вспыльчивым», «гнев» и «сварливым» удачны. «Завистливым» передаёт отрицательную соревновательность/зависть ζηλωτής в контексте, не навязывая романтический смысл. «Гневливым» адекватно передаёт θυμικός, хотя частично пересекается с первым словом, как и в исходном перечислении близких пороков.
  issues:
  - severity: medium
    issue: «Ревнивым» чрезмерно сужает ζηλωτής.
    rationale: В современном русском это слово обычно относится к личной, особенно любовной, ревности. В нравственном перечне греческое слово охватывает завистливую/соперничающую настроенность; «завистливым» точнее и естественнее в данном контексте.
  - severity: medium
    issue: «Горячим» неясно передаёт θυμικός.
    rationale: Предикативное «не будь горячим» в современном русском двусмысленно и не закреплено за значением раздражительной, гневной натуры. «Гневливым» ясно выражает нужную черту.
  - severity: low
    issue: Сочетание «не будь также …, ни …, ни …» стилистически шероховато.
    rationale: Ряд однородных отрицаний лучше оформить повтором «ни», что также ближе к повторяющемуся μηδέ оригинала.
  revised_text: Не становись вспыльчивым, потому что гнев ведёт к убийству; не будь ни завистливым, ни сварливым, ни гневливым, ибо из всего этого рождаются убийства.
