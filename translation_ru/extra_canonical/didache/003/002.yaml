source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: ru
  text: Не становись вспыльчивым, потому что гнев ведёт к убийству; не будь ни завистливым, ни сварливым, ни гневливым, ибо из всего этого рождаются убийства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: вспыльчивым
  rationale: Передаёт устойчивую склонность быстро приходить в гнев, а не единичную вспышку гнева.
- source_word: ὀργή
  choice: гнев
  rationale: Прямой и естественный русский эквивалент, сохраняющий связь с предыдущим обозначением вспыльчивости.
- source_word: ζηλωτής
  choice: ревнивым
  rationale: В отрицательном нравственном контексте слово обозначает ревнивую, соперничающую пылкость; «ревнивым» сохраняет этот оттенок без внесения положительного смысла усердия.
- source_word: ἐριστικός
  choice: сварливым
  rationale: Передаёт склонность к спорам и ссорам как черту характера.
- source_word: θυμικός
  choice: горячим
  rationale: Отражает необузданную горячность и сохраняет некоторое смысловое отличие от ὀργίλος.
- source_word: φόνοι γεννῶνται
  choice: порождает убийства
  rationale: Естественная русская причинная конструкция сохраняет множественное число «убийства» и образ возникновения, выраженный глаголом γεννῶνται.
theological_decisions:
- issue: Связь внутренних пороков с убийством
  choice: «всё это порождает убийства»
  alternative: «из всего этого рождаются убийства»
  rationale: Выбранная формулировка ясно сохраняет нравственную причинность исходного текста, не утверждая, что каждый отдельный порок неизбежно заканчивается убийством.
translation_notes:
  register: Современный литературный русский язык с кратким назидательным ритмом. Повтор отрицаний передан естественно для русского, а различие между вспыльчивостью, сварливостью и горячностью сохранено насколько позволяет язык.
