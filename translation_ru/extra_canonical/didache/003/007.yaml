  text: But be meek, because the meek will inherit the earth.
translation:
  language: ru
  text: Но будь кроток, потому что кроткие наследуют землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς / πραεῖς
  choice: кроток / кроткие
  rationale: «Кроткий» точно и естественно передаёт нравственную мягкость, незлобивость и смиренную сдержанность; повтор корня оригинала сохранён.
- source_word: κληρονομήσουσι
  choice: наследуют
  rationale: Будущее время и образ получения наследия переданы прямо, без истолковывающего расширения.
- source_word: τὴν γῆν
  choice: землю
  rationale: 'Сохранена присущая греческому слову и библейской аллюзии смысловая широта: оно может обозначать землю, сушу или страну.'
- source_word: ἐπεί
  choice: потому что
  rationale: Передана причинная связь между наставлением и последующим утверждением.
theological_decisions:
- issue: Связь с формулировкой блаженства о кротких
  choice: Сохранить традиционные ключевые слова «кроткие наследуют землю»
  alternative: Перефразировать как «смиренные получат землю во владение»
  rationale: Прямая формулировка удерживает узнаваемую библейскую аллюзию и не сужает значения πραΰς и γῆ.
translation_notes:
  register: Краткая, современная и достойная формулировка; императив передан естественным русским «будь», а синтаксический параллелизм и повтор «кроток / кроткие» сохранены.
