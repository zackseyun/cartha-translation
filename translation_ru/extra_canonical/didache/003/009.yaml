source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: ru
  text: Не превозноси себя и не давай своей душе дерзости. Пусть твоя душа не прилепляется к надменным, но общайся с праведными и смиренными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: превозноси себя
  rationale: Передаёт идею самовозвышения естественным и достойным русским выражением.
- source_word: δώσεις τῇ ψυχῇ σου θράσος
  choice: не давай своей душе дерзости
  rationale: Сохраняет образ души и прямое значение θράσος как предосудительной дерзости, не добавляя отсутствующего в тексте пояснения.
- source_word: ὑψηλῶν
  choice: надменным
  rationale: В контексте нравственного наставления обозначает высокомерных людей, а не просто людей высокого положения; выбор также сохраняет смысловую связь с запретом превозноситься.
- source_word: κολληθήσεται
  choice: прилепляется
  rationale: Сохраняет сильный образ тесной привязанности или соединения, выраженный глаголом κολλάω.
- source_word: ἀναστραφήσῃ
  choice: общайся
  rationale: Естественно передаёт значение поведения и пребывания среди определённого круга людей в данном контексте.
theological_decisions:
- issue: Характер запретов и наставлений во втором лице будущего времени
  choice: 'Русский повелительный оборот: «не превозноси», «не давай», «пусть… не прилепляется», «общайся»'
  alternative: 'Формально-будущая конструкция: «не будешь превозносить… не прилепится… будешь общаться»'
  rationale: Греческое будущее здесь имеет предписывающую силу. Повелительные формы яснее и естественнее выражают наставление по-русски, не меняя его богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранено слово «душа» и метафора «прилепляться»; синтаксис сделан ясным для современного читателя.
