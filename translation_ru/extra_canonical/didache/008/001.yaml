id: DID.8.1
reference: Didache 8:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: ru
  text: 'Пусть ваши посты не совпадают с постами лицемеров: они постятся во второй и пятый дни недели, а вы поститесь в четвёртый день и в день Приготовления.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в среду и пятницу; «день Приготовления» — традиционное название дня перед субботой.
    reason: Помогает современному читателю соотнести древние порядковые обозначения дней недели с современными названиями, сохраняя в основном тексте форму оригинала.
lexical_decisions:
- source_word: Αἱ δὲ νηστεῖαι ὑμῶν
  choice: Пусть ваши посты
  rationale: Естественно передаёт греческую конструкцию с отрицательным повелительным значением, сохраняя множественное число.
- source_word: μετὰ τῶν ὑποκριτῶν
  choice: не совпадают с постами лицемеров
  rationale: В контексте μετὰ указывает на совместность или совпадение по времени; добавление «постами» по смыслу устраняет неестественное русское «не будьте с лицемерами», не меняя содержания.
- source_word: δευτέρα σαββάτων
  choice: во второй ... день недели
  rationale: Иудейско-греческое обозначение второго дня седмичного цикла; буквальный смысл сохранён без подстановки современного названия дня.
- source_word: πέμπτῃ
  choice: пятый день недели
  rationale: Восстановлено подразумеваемое «день недели» для ясности русского текста.
- source_word: τετράδα
  choice: четвёртый день
  rationale: Передано порядковое обозначение дня недели, как в исходном тексте.
- source_word: παρασκευήν
  choice: день Приготовления
  rationale: Сохраняет историко-религиозное название дня приготовления к субботе и его связь со значением греческого слова.
theological_decisions:
- issue: Кого обозначают «лицемеры»
  choice: Сохранено общее обозначение без отождествления с какой-либо конкретной группой
  alternative: Уточнить как фарисеев, иудеев или другую группу
  rationale: Исходный текст не называет группу; конкретизация внесла бы спорное историко-конфессиональное толкование.
- issue: Характер предписания о днях поста
  choice: Передано прямым наставлением «пусть... / поститесь»
  alternative: Смягчить до рекомендации или описания обычая
  rationale: Греческие императивные формы выражают предписание, хотя сфера и длительность его применения здесь не уточняются.
translation_notes:
  register: Современный литературный русский с умеренно формальным, раннехристианским наставительным звучанием. Параллелизм и противопоставление «они... а вы...» сохранены; архаичное «седмица» не используется.
