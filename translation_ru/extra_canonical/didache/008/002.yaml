source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: ru
  text: 'И не молитесь, как лицемеры[a], но молитесь так, как повелел Господь в Своём Евангелии:


    Отче наш, Который на небесах!


    Да святится имя Твоё,


    да придёт Царство Твоё,


    да исполнится воля Твоя


    как на небе, так и на земле.


    Хлеб наш насущный дай нам сегодня,


    и прости нам долг наш,


    как и мы прощаем должникам нашим,


    и не введи нас в испытание,


    но избавь нас от злого[b],


    ибо Тебе принадлежат сила и слава во веки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное «и не» связывает этот запрет с предыдущим наставлением; возможно также: «Не молитесь, как лицемеры».'
    reason: Поясняет дискурсивную функцию Μηδὲ и допустимый самостоятельный русский вариант.
  - marker: b
    text: 'Или: «от зла»; греческое выражение может обозначать как зло, так и злого — то есть личного противника.'
    reason: Сохраняет подлинную неоднозначность τοῦ πονηροῦ.
lexical_decisions:
- source_word: Μηδὲ
  choice: И не
  rationale: Передаёт продолжающий запрет в связи с предшествующим наставлением; по-русски естественнее буквального изолированного «ни».
- source_word: ὡς οἱ ὑποκριταί
  choice: как лицемеры
  rationale: Естественно передаёт сравнение и сохраняет прямую лексику оригинала.
- source_word: ἐκέλευσεν
  choice: повелел
  rationale: Сохраняет силу глагола со значением распоряжения или заповеди.
- source_word: ἁγιασθήτω
  choice: да святится
  rationale: Устоявшаяся и точная русская молитвенная формула, передающая пассивный императив третьего лица.
- source_word: ἐπιούσιον
  choice: насущный
  rationale: Сохраняет традиционный русский эквивалент редкого и спорного греческого слова, не сводя его смысл исключительно к «на сегодня» или «необходимый».
- source_word: ὀφειλήν / ὀφειλέταις
  choice: долг / должникам
  rationale: Передаёт буквальную долговую метафору оригинала без замены её толкованием «грехи».
- source_word: πειρασμόν
  choice: испытание
  rationale: Передаёт широкий смысл слова — испытание, проверку или искушение — не ограничивая его только нравственным соблазном.
- source_word: τοῦ πονηροῦ
  choice: злого
  rationale: Сохраняет грамматическую и смысловую неоднозначность между «злом» и «злым [существом]».
- source_word: εἰς τοὺς αἰῶνας
  choice: во веки
  rationale: Естественная русская формула для неограниченной длительности, буквально выраженной как «в века».
theological_decisions:
- issue: Значение τοῦ πονηροῦ
  choice: «от злого» с примечанием о неоднозначности
  alternative: «от зла» или «от лукавого»
  rationale: Греческая субстантивированная форма допускает как безличное зло, так и личного злого; основной текст не должен молча устранять эту неоднозначность.
- issue: Значение ἐπιούσιον
  choice: «насущный»
  alternative: «на сегодняшний день», «необходимый» или «на грядущий день»
  rationale: Редкое слово толкуется по-разному. Традиционный русский эквивалент сохраняет открытость смысла и узнаваемость молитвы.
- issue: πειρασμός и действие Бога
  choice: «не введи нас в испытание»
  alternative: «не дай нам поддаться искушению»
  rationale: Выбранный вариант сохраняет напряжение и грамматическую форму просьбы оригинала, не внося поясняющего богословского перефразирования.
- issue: Доксология
  choice: включена без добавления «царство»
  alternative: традиционная формула «ибо Твоё есть Царство, и сила, и слава»
  rationale: Данный греческий источник содержит только «сила и слава»; слово «царство» нельзя добавлять из более поздней литургической традиции.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного текста. Сохранены узнаваемые библейские формулы («да святится», «хлеб насущный», «не введи»), но синтаксис вне молитвы сделан естественным. Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с распространённой русской религиозной нормой.
