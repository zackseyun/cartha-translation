  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: ru
  text: Также, открыв кувшин вина или масла, возьми начаток и отдай пророкам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Так же
  rationale: Передаёт связь с предыдущими предписаниями и сохраняет естественное русское звучание.
- source_word: κεράμιον
  choice: кувшин
  rationale: Обозначает глиняный сосуд; «кувшин» понятно современному читателю и подходит для вина и масла.
- source_word: ἀπαρχή
  choice: начаток
  rationale: Сохраняет культово-этическое понятие первой выделяемой доли, не сводя его просто к первому налитому количеству.
- source_word: προφήταις
  choice: пророкам
  rationale: Прямое и контекстуально точное соответствие греческому термину.
theological_decisions:
- issue: Характер и объём начатка из вина или масла
  choice: «возьми начаток» без уточнения размера или способа отделения
  alternative: «отдели первую долю»
  rationale: Греческий текст не устанавливает размер доли и использует существительное ἀπαρχή; перевод сохраняет эту неопределённость и религиозную окраску понятия.
translation_notes:
  register: Современный литературный русский с краткой наставительной формой. Причастная конструкция «открыв кувшин» естественно передаёт греческое ἀνοίξας; единственное число «начаток» соответствует форме τὴν ἀπαρχὴν.
