source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: ru
  text: А от денег, одежды и всякого имущества, отделив начаток по своему усмотрению, отдай согласно заповеди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебра».'
    reason: ἀργύριον буквально означает «серебро», хотя в данном контексте естественно употреблено в значении денег.
lexical_decisions:
- source_word: ἀργυρίου
  choice: денег
  rationale: Хотя слово буквально может означать «серебро», в койне оно обычно употребляется в значении денег; это естественно и в контексте материальных пожертвований.
- source_word: ἱματισμοῦ
  choice: одежды
  rationale: 'Передаёт обычное значение собирательного существительного: одежда или предметы одежды.'
- source_word: παντὸς κτήματος
  choice: всякого имущества
  rationale: κτῆμα обозначает собственность, владение или имущество; русский вариант сохраняет широкий охват выражения.
- source_word: τὴν ἀπαρχήν
  choice: начаток
  rationale: Традиционный и точный термин для первой, посвящаемой Богу доли; сохраняет связь с предшествующими наставлениями о начатках.
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: по своему усмотрению
  rationale: 'Естественно передаёт предоставленную адресату свободу определить долю: «как тебе покажется [правильным]».'
- source_word: δὸς κατὰ τὴν ἐντολήν
  choice: отдай согласно заповеди
  rationale: Сохраняет повеление и прямую отсылку к заповеди без уточнения её содержания.
theological_decisions:
- issue: Размер начатка
  choice: по своему усмотрению
  alternative: сколько сочтёшь нужным
  rationale: Греческий текст оставляет размер или способ выделения на усмотрение дающего; перевод не вводит фиксированной нормы.
- issue: Референт заповеди
  choice: заповеди
  alternative: предписанию
  rationale: ἐντολή естественно означает «заповедь»; неопределённая ссылка оригинала сохранена и не отождествлена с конкретным текстом.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским термином «начаток». Синтаксис упрощён ради ясности, при этом сохранены неопределённость размера дара и неуточнённая ссылка на заповедь.
