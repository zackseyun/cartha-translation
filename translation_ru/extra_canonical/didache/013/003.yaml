reference: Didache 13:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: ru
  text: Поэтому, взяв всякую первинку от точила и гумна, а также от крупного рогатого скота и овец, отдай её пророкам, ибо они — ваши первосвященники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: начатки
  rationale: Традиционный и понятный библейский термин для первой доли урожая или приплода, посвящаемой Богу; множественное число естественно по-русски при перечислении разных видов.
- source_word: γεννημάτων
  choice: плодов
  rationale: В данном земледельческом контексте обозначает произведённое точилом и гумном, то есть урожай и его продукты; «плоды» сохраняет широкое значение.
- source_word: ληνοῦ καὶ ἅλωνος
  choice: точила и гумна
  rationale: Передаёт конкретные древние места переработки винограда и обмолота зерна, сохраняя библейскую образность исходного текста.
- source_word: βοῶν τε καὶ προβάτων
  choice: крупного и мелкого скота
  rationale: 'Контекстуально естественное обобщение: βοῦς относится к крупному рогатому скоту, πρόβατα — прежде всего к овцам и в хозяйственном перечислении к мелкому скоту.'
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Прямой эквивалент греческого слова; сохраняет сильное культовое сопоставление пророков с первосвященниками.
theological_decisions:
- issue: Пророки названы ἀρχιερεῖς общины
  choice: «они — ваши первосвященники»
  alternative: «они исполняют для вас служение первосвященников»
  rationale: Исходный текст использует прямое отождествление, а не функциональное пояснение; перевод сохраняет его богословскую напряжённость и не смягчает формулировку.
- issue: Объём повеления πᾶσαν ἀπαρχὴν
  choice: «всякие начатки»
  alternative: «все начатки»
  rationale: Форма передаёт каждый вид начатков из перечисленных категорий, не утверждая сверх текста, что следует отдавать весь первый приплод или весь ранний урожай.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. Императив в единственном числе («взяв», «отдай») следует греческим формам, тогда как «ваши» сохраняет множественное число местоимения в заключительной характеристике общины.
