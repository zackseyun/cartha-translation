  to: Поэтому, взяв всякую первинку от точила и гумна, а также от крупного рогатого скота и овец, отдай её пророкам, ибо они — ваши первосвященники.
  rationale: Перевод уточнён для более точной передачи конкретного перечисления животных, единственного числа ἀπαρχή и естественного русского синтаксиса. Прямое, потенциально напряжённое отождествление пророков с «вашими первосвященниками» сохранено без богословского истолкования.
