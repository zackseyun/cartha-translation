review_pass:
  verdict: revise
  source_fidelity: Греческое καὶ αὐτός означает, что истинный учитель также относится к числу достойных пропитания; в черновике «сам достоин» может быть понято лишь как усиление личного достоинства и не вполне ясно передаёт значение «тоже». Местоименная принадлежность αὐτοῦ лучше выражена словом «своего».
  naturalness: Предлагаемая фраза естественна для современного литературного русского и сохраняет краткую афористичность оригинала. Вставное сравнение «как и работник» ясно связывает учителя с приведённым образцом.
  terminology: «Истинный учитель» точно передаёт διδάσκαλος ἀληθινός. «Пропитание» уместно для τροφή в контексте обеспечения пищей/содержанием и не навязывает юридического смысла «права». «Работник» — нейтральный современный эквивалент ἐργάτης.
  issues:
