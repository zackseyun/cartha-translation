source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: ru
  text: Так же и истинный учитель — как и работник — достоин своего пропитания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Так и
  rationale: Естественно передаёт связь с предшествующим установлением и значение «подобным образом».
- source_word: διδάσκαλος ἀληθινός
  choice: истинный учитель
  rationale: Прямо сохраняет характеристику учителя как подлинного, заслуживающего доверия.
- source_word: ἄξιος
  choice: достоин
  rationale: Точно передаёт идею правомерного притязания на содержание.
- source_word: ὥσπερ ὁ ἐργάτης
  choice: подобно работнику
  rationale: Сохраняет явное сравнение; «работник» нейтрально и современно передаёт ἐργάτης.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: пропитания
  rationale: В данном контексте τροφή означает пищу или содержание; «пропитание» естественно охватывает необходимое обеспечение без излишнего расширения смысла.
- source_word: καὶ αὐτός
  choice: сам
  rationale: 'Передаёт акцент: истинный учитель тоже, как и работник, достоин обеспечения; русское «сам» сохраняет эмфазу без тяжеловесного «и сам также».'
theological_decisions:
- issue: Основание материального содержания истинного учителя
  choice: Сформулировано как достоинство получить пропитание, без уточнения механизма или объёма содержания.
  alternative: «имеет право на содержание»
  rationale: Греческое ἄξιος выражает достоинство или заслуженность, а не напрямую юридически оформленное право; перевод не вводит более узкой церковной или правовой трактовки.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная структура оригинала сохранена. Порядок слов слегка перестроен ради естественности, при этом акцент καὶ αὐτός передан словом «сам».
