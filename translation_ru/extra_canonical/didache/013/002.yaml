    issue: Не вполне явно передано καὶ αὐτός.
    rationale: 'Слово «сам» в «сам достоин» прежде всего усиливает подлежащее, тогда как καὶ αὐτός в данном контексте обозначает добавление: истинный учитель, как и работник, тоже достоин пропитания.'
  - severity: low
    issue: Опущено явное соответствие αὐτοῦ («своего»).
    rationale: Русский контекст допускает опущение, однако «своего пропитания» без утяжеления сохраняет принадлежность, выраженную в оригинале.
  revised_text: Так же и истинный учитель — как и работник — достоин своего пропитания.
