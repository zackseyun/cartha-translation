  source_fidelity: «Если готовишь пищу, возьми начаток и отдай согласно заповеди» точно передаёт условное предписание, действие выбора начатка и последующее повеление отдать его. «Начаток» обоснованно сохраняет единственное число ἀπαρχή и библейско-культовую лексику. Не названные в греческом адресат дара и конкретная заповедь не добавлены.
