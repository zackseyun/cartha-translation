id: DID.13.5
reference: Didache 13:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν σιτιαυτοῖς, τὴν ἀπαρχὴν λαβὼν δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/005.yaml
  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: ru
  text: Если готовишь пищу[a], возьми начаток и отдай согласно заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если печёшь хлеб».'
    reason: Глагол допускает более узкое понимание как приготовления хлеба; этот традиционный вариант следует сохранить как текстовую переводческую возможность.
lexical_decisions:
- source_word: Ἐὰν σιτιαυτοῖς
  choice: Если готовишь пищу
  rationale: Редкий глагол σιτιάομαι здесь передаёт приготовление пищи; такой перевод естественен по-русски и не сужает значение исключительно до выпечки хлеба.
- source_word: τὴν ἀπαρχὴν
  choice: начаток
  rationale: Форма единственного числа означает первую, посвящаемую долю продукта; «начаток» сохраняет культово-библейскую окраску и грамматическое число оригинала.
- source_word: λαβὼν δὸς
  choice: возьми … и отдай
  rationale: Передаёт последовательность действий, выраженную причастием и повелительным наклонением, без лишнего местоименного дополнения.
- source_word: κατὰ τὴν ἐντολήν
  choice: согласно заповеди
  rationale: Точно сохраняет отсылку к известной заповеди и определённый артикль.
theological_decisions:
- issue: Характер предписания о начатках
  choice: Сохранить слово «заповедь» без уточнения её источника или адресата дара
  alternative: Уточнить, что речь идёт о ветхозаветном установлении или о даре пророкам
  rationale: Сам стих не называет ни источник заповеди, ни получателя; уточнение преждевременно устранило бы присущую тексту недосказанность.
translation_notes:
  register: Современный литературный русский с умеренной библейской окраской. Единственное число «начаток» сохраняет форму греческого текста; фраза остаётся краткой и наставительной.
