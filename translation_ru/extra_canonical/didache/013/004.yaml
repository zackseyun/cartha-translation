  language: en
  yaml_path: translation/extra_canonical/didache/013/004.yaml
  text: But if you do not have a prophet, give to the poor.
translation:
  language: ru
  text: Если же у вас нет пророка, отдайте бедным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ μὴ ἔχητε
  choice: Если же у вас нет
  rationale: Условная конструкция передана естественно по-русски; δέ выражено союзом «же», сохраняющим переход и противопоставление контексту.
- source_word: προφήτην
  choice: пророка
  rationale: Прямое соответствие греческому существительному в винительном падеже.
- source_word: δότε τοῖς πτωχοῖς
  choice: отдайте бедным
  rationale: Глагол δότε не имеет выраженного прямого дополнения, поэтому оно не добавлено; «отдайте» естественно передаёт распоряжение о передаче подразумеваемого приношения нуждающимся.
theological_decisions:
- issue: Не выраженный в стихе предмет передачи
  choice: Не добавлять местоимение «это» или существительное «приношение»
  alternative: «отдайте это бедным»
  rationale: В греческом тексте прямое дополнение отсутствует. Русский глагол «отдайте» допускает контекстуально подразумеваемый предмет и тем самым сохраняет лаконичность и связь с предыдущим стихом без внесения отсутствующего слова.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. «Бедным» предпочтено более официальному «нищим» как понятное современному читателю и соответствующее τοῖς πτωχοῖς.
