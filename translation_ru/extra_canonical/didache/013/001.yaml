id: DID.13.1
reference: Didache 13:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: ru
  text: Но всякий истинный пророк, желающий поселиться у вас, достоин пропитания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ προφήτης ἀληθινός
  choice: Но всякий истинный пророк
  rationale: Сохраняется обобщающее значение πᾶς, противопоставительно-переходное δέ и смысловое определение ἀληθινός.
- source_word: θέλων καθῆσαι πρὸς ὑμᾶς
  choice: желающий поселиться у вас
  rationale: Хотя καθῆσαι буквально означает «сесть/оставаться», в данном контексте пребывания пророка естественное русское выражение «поселиться у вас» передаёт намерение остаться в общине.
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  choice: достоин пропитания
  rationale: τροφή обозначает пищу или содержание; «пропитание» естественно охватывает необходимое обеспечение пророка, не добавляя деталей, которых нет в греческом тексте. Притяжательное αὐτοῦ по-русски здесь подразумевается и не требует тяжеловесного «своего пропитания».
theological_decisions:
- issue: Право истинного пророка на материальное обеспечение
  choice: достоин пропитания
  alternative: имеет право на содержание
  rationale: Формулировка сохраняет оценочную конструкцию ἄξιός ἐστι и не превращает её в более явно юридическое утверждение.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка, понятная широкому читателю. Синтаксис близок к греческому, но звучит естественно.
