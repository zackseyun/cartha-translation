  language: en
  yaml_path: translation/extra_canonical/didache/012/003.yaml
  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: ru
  text: Но если он хочет поселиться у вас и владеет ремеслом, пусть работает и ест.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσαι
  choice: поселиться
  rationale: В данном контексте глагол означает не просто «сесть», а остаться и обосноваться среди общины.
- source_word: τεχνίτης
  choice: владеет ремеслом
  rationale: Передаёт человека, имеющего практическое ремесло или специальность; такая формулировка естественнее современного узкого «ремесленник» и сохраняет условный смысл причастия.
- source_word: ἐργαζέσθω καὶ φαγέτω
  choice: пусть работает и ест
  rationale: Сохраняет два параллельных повелительных глагола и прямую связь труда с пропитанием.
