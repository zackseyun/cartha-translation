source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: ru
  text: Если же он не имеет ремесла, то, по вашему разумению, позаботьтесь о том, чтобы он жил среди вас как христианин не в праздности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позаботьтесь, по вашему разумению, о том, чтобы христианин не жил среди вас в праздности».'
    reason: Греческая конструкция допускает понимание слова «христианин» как подлежащего общего характера, а не как характеристики ранее упомянутого человека.
lexical_decisions:
- source_word: τέχνην
  choice: не владеет никаким ремеслом
  rationale: τέχνη здесь означает практическое ремесло или профессию, позволяющую человеку обеспечивать себя; глагольная передача естественна по-русски.
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  choice: по своему разумению
  rationale: Сохраняет обращение к практической рассудительности общины без излишне буквального и тяжеловесного «согласно вашему пониманию».
- source_word: προνοήσατε
  choice: позаботьтесь
  rationale: Императив означает заранее принять меры, проявить попечение; «позаботьтесь» естественно сочетается с последующим оборотом.
- source_word: ἀργός
  choice: праздно
  rationale: В контексте речь идет о жизни без труда и о недопущении праздности, а не просто об отсутствии занятости в отдельный момент.
theological_decisions:
- issue: Синтаксическая роль χριστιανός
  choice: «чтобы он жил среди вас как христианин»
  alternative: «чтобы христианин жил среди вас»
  rationale: Контекст продолжает говорить о принятом страннике; предикативное понимание χριστιανός лучше сохраняет эту референцию, однако греческий допускает и обобщенное прочтение, отмеченное в сноске.
- issue: Характер помощи общины
  choice: Не уточнять конкретную форму обеспечения
  alternative: Явно сказать, что община должна найти ему работу
  rationale: προνοήσατε требует практической заботы, но текст не определяет, должна ли она выражаться именно в трудоустройстве, обучении ремеслу или иной мере, предотвращающей праздность.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. «Ремесло», «по своему разумению» и «праздно» немного возвышенны, но понятны широкому читателю и соответствуют практико-нравственному характеру отрывка.
