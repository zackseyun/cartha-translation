source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: ru
  text: Но если он не хочет так поступать, он торгует Христом; остерегайтесь таких людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χριστέμπορος
  choice: торгует Христом
  rationale: Редкое сложное слово буквально обозначает человека, который превращает Христа в предмет торговли или наживы. Глагольная передача естественнее по-русски, чем искусственные существительные вроде «христоторговец», и сохраняет резкую обвинительную метафору.
- source_word: προσέχετε ἀπό
  choice: остерегайтесь
  rationale: Обычная предостерегающая конструкция со значением «берегитесь, держитесь подальше»; «остерегайтесь» соответствует достоинству и строгости контекста.
- source_word: τῶν τοιούτων
  choice: таких людей
  rationale: Субстантивированное указательное выражение обозначает людей подобного рода; явное «людей» звучит естественно и не меняет смысла.
theological_decisions:
- issue: Передача элемента χριστ- в χριστέμπορος
  choice: Христом
  alternative: Мессией
  rationale: Здесь χριστ- входит в раннехристианское сложное слово и в контексте обозначает Иисуса Христа как того, кем человек корыстно торгует, а не непосредственно переводит титул χριστός в самостоятельной позиции. «Торгует Христом» точно и понятно передаёт обвинение, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, строгая и афористичная формулировка. Сохранены условная конструкция, обвинительная метафора и прямое предостережение.
