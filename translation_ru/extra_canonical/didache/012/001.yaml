    rationale: Для γνώσεσθε в наставительном регистре предпочтительнее литературное «вы всё поймёте»; оно также сохраняет отсутствие выраженного объекта.
  - severity: low
    issue: Неполно передана пассивная формула δεχθήτω.
    rationale: «Принимайте» не искажает предписываемого гостеприимства, но «пусть будет принят каждый» точнее отражает грамматическую форму оригинала.
  - severity: low
    issue: Сноска предлагает «вы узнаете» как только альтернативу, хотя это наиболее прямое соответствие γνώσεσθε.
    rationale: После основной передачи «вы всё поймёте» сноска должна пояснять абсолютное употребление и возможность буквального «вы узнаете», не приписывая глаголу дополнение «его».
