source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: ru
  text: Пусть будет принят каждый, кто приходит во имя Господа. Затем, испытав его, вы всё поймёте[a], ибо у вас будет разумение различать правое и левое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы узнаете». Греческий глагол употреблён без выраженного дополнения; «его» относится к «испытав его», а не к последующему глаголу.'
    reason: Передаёт абсолютное употребление γνώσεσθε и предотвращает ошибочное присоединение «его» к этому глаголу.
lexical_decisions:
- source_word: δεχξήσθω (вероятно, δεχθήτω)
  choice: принимайте
  rationale: Передаёт повеление о принятии каждого приходящего; множественное число естественно по-русски при обращении к общине.
- source_word: δοκιμάσαντες
  choice: испытав
  rationale: Глагол обозначает проверку с целью установить подлинность или качества человека.
- source_word: γνώσεσθε
  choice: вы разберётесь
  rationale: Глагол употреблён без выраженного дополнения и здесь означает, что после проверки адресаты узнают истину о пришедшем; перевод не добавляет «его» как прямое дополнение.
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  choice: разумение, чтобы отличить правое от левого
  rationale: 'Сохраняет образ правого и левого, но делает понятной его функцию: способность различать.'
theological_decisions:
- issue: Безусловное принятие и последующая проверка пришедшего
  choice: 'Сохранена последовательность: сначала принять, затем испытать'
  alternative: Передать принятие как зависящее от предварительной проверки
  rationale: Греческие ἔπειτα δέ ясно указывают, что испытание следует после принятия; текст удерживает напряжение между гостеприимством и рассудительностью.
- issue: Объект глагола γνώσεσθε
  choice: Не добавлять «его», а передать абсолютное употребление как «вы разберётесь»
  alternative: «Вы узнаете его»
  rationale: αὐτόν относится к δοκιμάσαντες, тогда как γνώσεσθε не имеет выраженного объекта; вариант избегает оттенка личного знакомства и передаёт распознавание истинного положения дел.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. «Во имя Господа» и образ «правого и левого» сохранены; синтаксис слегка прояснён ради естественности и понятности.
