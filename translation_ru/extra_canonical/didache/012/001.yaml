revisions:
- from: Всякого, кто приходит во имя Господа, принимайте. Затем, испытав его, вы разберётесь[a], ведь у вас будет разумение, чтобы отличить правое от левого.
  to: Пусть будет принят каждый, кто приходит во имя Господа. Затем, испытав его, вы всё поймёте[a], ибо у вас будет разумение различать правое и левое.
  rationale: Исправление делает русский текст более литературным и точнее передаёт пассивное повеление δεχθήτω. Оно сохраняет последовательность «принять — затем испытать», не добавляет к γνώσεσθε отсутствующее в греческом прямое дополнение и удерживает образ «правого и левого».
