review_pass:
  verdict: revise
  source_fidelity: 'Греч. δεχθήτω (в OCR-форме δεχξήσθω) — 3-е лицо ед. числа страдательного повелительного наклонения: «пусть будет принят каждый». «Принимайте» передаёт практический смысл, но заменяет исходную безлично-пассивную формулу прямым обращением к общине. У δοκιμάσαντες есть дополнение αὐτόν («испытав его»), тогда как γνώσεσθε употреблено без дополнения; поэтому не следует добавлять «его» к заключительному глаголу. Образ «правого и левого» сохранён.'
  naturalness: «Вы разберётесь» разговорнее, чем требуется для современного литературного перевода раннехристианского наставления, и несколько ослабляет глагол γνώσεσθε. «Вы всё поймёте» естественно в русском как абсолютное употребление, не вводит прямого дополнения и сохраняет результат распознавания. Конструкция «разумение, чтобы отличить» допустима, но «разумение различать» компактнее и ближе к греческому сочетанию σύνεσιν ... δεξιὰν καὶ ἀριστεράν.
  terminology: «Господь», «во имя Господа», «испытав» и «разумение» уместны. «Правое и левое» следует оставить как намеренно образное выражение, не заменяя его толковательным «добро и зло» или конфессионально окрашенным объяснением.
  issues:
