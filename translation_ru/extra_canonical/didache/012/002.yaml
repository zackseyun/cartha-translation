id: DID.12.2
reference: Didache 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: ru
  text: Если пришедший — путник, помогите ему, чем можете; но пусть он остаётся у вас лишь два или три дня, если в этом есть необходимость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρόδιος
  choice: путник
  rationale: Слово обозначает человека, находящегося в пути; «путник» естественно и ёмко передаёт этот смысл в данном контексте гостеприимства.
- source_word: βοηθεῖτε
  choice: помогите
  rationale: Прямо передаёт призыв оказать практическую помощь.
- source_word: ὅσον δύνασθε
  choice: чем можете
  rationale: Естественный современный русский эквивалент выражения «насколько вы способны».
- source_word: εἰ μὴ
  choice: лишь
  rationale: 'В сочетании с отрицанием обозначает ограничение срока: пришедшему позволено остаться только на указанные два или три дня.'
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: если в этом есть необходимость
  rationale: Сохраняет условный характер фразы и связывает необходимость с пребыванием в течение двух или трёх дней, не создавая впечатления, будто нужда разрешает превысить этот срок.
theological_decisions:
- issue: Соотношение гостеприимства и ограничения срока пребывания
  choice: Сохранены как обязанность помочь, так и ясное ограничение пребывания двумя или тремя днями при необходимости.
  alternative: Передать условие так, будто необходимость позволяет гостю оставаться дольше трёх дней.
  rationale: Греческая конструкция οὐ μενεῖ… εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη ограничивает допустимое пребывание двумя или тремя днями и не вводит исключения для более долгого срока.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и наставительным тоном. Частица μέν не выделена отдельно, поскольку её смысловой контраст получает продолжение в следующем стихе; δέ передано союзом «но».
