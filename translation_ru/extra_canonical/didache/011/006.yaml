id: DID.11.6
reference: Didache 11:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: ru
  text: А уходя, апостол пусть не берёт ничего, кроме хлеба, пока не найдёт ночлега; если же он просит денег, то он лжепророк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξερχόμενος
  choice: уходя
  rationale: Передаёт обстоятельственное значение причастия и естественно звучит в современном русском контексте наставления об отбытии апостола.
- source_word: ὁ ἀπόστολος
  choice: апостол
  rationale: Сохраняет раннехристианский термин и его функциональную неоднозначность без замены на более узкое «миссионер» или «посланник».
- source_word: μηδὲ λαμβανέτω
  choice: пусть не берёт ничего
  rationale: Передаёт запретительную конструкцию с повелительным значением; «ничего» получает необходимое исключение далее.
- source_word: εἰμὴ ἄρτον
  choice: кроме хлеба
  rationale: Прямо выражает единственное допустимое дорожное обеспечение.
- source_word: ἕως οὗ αὐλισθῇ
  choice: пока не найдёт ночлега
  rationale: αὐλίζομαι означает остановиться или разместиться на ночлег; выбран естественный русский оборот, не уточняющий, у кого именно он остановится.
- source_word: ἀργύριον
  choice: денег
  rationale: В данном контексте слово обозначает серебро как деньги; буквальное «серебра» в современном русском могло бы быть понято как материал или утварь.
- source_word: ψευδοπροφήτης
  choice: лжепророк
  rationale: Устоявшийся и точный русский эквивалент сложного греческого существительного.
theological_decisions:
- issue: Соотношение обозначений «апостол» и «лжепророк»
  choice: Сохранены оба разных термина оригинала без гармонизации.
  alternative: Назвать нарушителя «лжеапостолом» либо в обоих случаях употребить «пророк».
  rationale: Греческий текст сначала говорит об ἀπόστολος, но требующего денег называет ψευδοπροφήτης; возможное напряжение следует сохранить.
- issue: Характер просьбы о деньгах
  choice: «если же он просит денег» без добавления цели или получателя
  alternative: «если попросит денег на дорогу» или «если попросит у вас денег»
  rationale: Оригинал не указывает ни назначение денег, ни того, к кому обращена просьба.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный регистр. Синтаксис сохраняет форму общинного наставления. Буква «ё» употреблена последовательно в формах «берёт» и «найдёт».
