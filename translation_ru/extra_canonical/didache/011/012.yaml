id: DID.11.12
reference: Didache 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: ru
  text: 'Но кто скажет в Духе: «Дай мне денег или каких-нибудь других вещей», — не слушайте его. Если же он скажет дать для других, терпящих нужду, пусть никто его не судит.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: 'Сохраняет краткость и неоднозначность греческого выражения: речь может идти о речи под действием Духа или в пророческом состоянии.'
- source_word: ἀργύρια
  choice: денег
  rationale: Во множественном числе слово обозначает серебряные деньги или монеты; современное «денег» естественно передаёт смысл.
- source_word: ἕτερά τινα
  choice: чего-нибудь другого
  rationale: Передаёт неопределённое множественное выражение «какие-либо другие вещи» и ясно включает иной предмет просьбы в прямую речь.
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: не слушайте его
  rationale: Естественный русский запрет следовать такому требованию; форма обращена к общине во множественном числе.
- source_word: περὶ ἄλλων ὑστερούντων
  choice: другим, терпящим нужду
  rationale: Контекстуально передаёт тех, кому недостаёт необходимого, не уточняя вид нужды сверх греческого текста.
- source_word: μηδεὶς αὐτὸν κρινέτω
  choice: пусть никто его не судит
  rationale: Формально и естественно сохраняет запрет выносить суждение о таком пророке.
theological_decisions:
- issue: Значение выражения ἐν πνεύματι
  choice: «в Духе» с прописной буквы
  alternative: «в духе» или «под действием Духа»
  rationale: Контекст Дидахе говорит о пророческой речи; прописная буква указывает на Божьего Духа, а буквальная конструкция не определяет точный механизм вдохновения.
- issue: Кому предназначается дар во второй части
  choice: «дать другим, терпящим нужду»
  alternative: «дать на нужды других»
  rationale: Сохраняется личное обозначение нуждающихся и не добавляется идея учреждения или фонда.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Повелительное «Дайте» согласовано с обращением к общине; пунктуация однозначно включает «или чего-нибудь другого» в содержание корыстной просьбы.
