id: DID.11.2
reference: Didache 11:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: ru
  text: Но если сам учитель, изменившись, станет учить другому учению, чтобы ниспровергнуть[a], не слушайте его; если же он учит, чтобы умножить праведность и познание Господа, примите его как Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть разрушить или упразднить; что именно — в греческом тексте прямо не указано.
    reason: Сохраняет невыраженный объект καταλῦσαι и поясняет диапазон значения глагола без вставки толкования в основной текст.
lexical_decisions:
- source_word: στραφεὶς
  choice: изменившись
  rationale: Передаёт поворот или перемену учителя, не добавляя отсутствующего в греческом тексте уточнения «свернув с пути».
- source_word: ἄλλην διδαχὴν
  choice: иному учению
  rationale: Сохраняет прямое значение «другое/иное учение» и повтор корня «учить — учение».
- source_word: καταλῦσαι
  choice: ниспровергнуть
  rationale: Передаёт сильное значение разрушения или упразднения; объект действия в источнике не назван и потому не добавлен в основной текст.
- source_word: προσθεῖναι
  choice: умножает
  rationale: По-русски естественно выражает добавление или увеличение праведности и познания, сохраняя оба существительных как прямые объекты смыслового действия.
- source_word: γνῶσιν Κυρίου
  choice: познание Господа
  rationale: Сохраняет родительную конструкцию и её возможную смысловую ёмкость, не сводя её только к сведениям о Господе.
- source_word: δέξασθε αὐτὸν ὡς Κύριον
  choice: примите его как Господа
  rationale: Близко передаёт намеренно сильное сопоставление исходного текста, не ослабляя его до простого гостеприимства или представительства.
theological_decisions:
- issue: Смысл выражения «примите его как Господа»
  choice: Сохранено прямое «как Господа»
  alternative: «как посланника Господа» или «как самого Господа»
  rationale: Источник не содержит слова «посланник», а добавление «самого» усилило бы отождествление. Прямой перевод сохраняет богословское напряжение.
- issue: Неназванный объект глагола καταλῦσαι
  choice: Объект не восполнен
  alternative: «ниспровергнуть прежнее учение» или «разрушить всё сказанное»
  rationale: Контекст позволяет предполагать прежнее учение, но греческий текст оставляет объект невыраженным; перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с наставительным, сдержанно-достоинным тоном. Синтаксический параллелизм двух условий сохранён, а буквальная, но неестественная формула «прибавить праведность» передана естественным глаголом «умножает».
