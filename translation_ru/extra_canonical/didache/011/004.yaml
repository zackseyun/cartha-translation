  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ ἀπόστολος
  choice: Пусть всякого апостола
  rationale: Πᾶς с существительным в единственном числе передано распределительно — «всякого»; δέ обозначает переход к следующему наставлению и естественно не выражено отдельным словом.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: приходящего к вам
  rationale: Причастный оборот сохранён близко к греческой конструкции; πρὸς ὑμᾶς здесь естественно означает направление движения — «к вам».
- source_word: δεχθήτω
  choice: пусть ... принимают
  rationale: Императив третьего лица передан нормативной русской конструкцией с «пусть»; множественное «принимают» естественно соотносится с обращением к общине, выраженным ὑμᾶς.
- source_word: ὡς Κύριος
  choice: как Господа
  rationale: Сохранено прямое сравнение с титулом «Господь» без поясняющего добавления; по-русски после «принимать как» требуется винительный падеж.
theological_decisions:
- issue: Смысл выражения «как Господа»
  choice: Сохранить прямую и напряжённую формулировку «как Господа».
  alternative: «как посланника Господа» или «как самого Господа»
  rationale: Греческий текст буквально говорит ὡς Κύριος и не содержит ни слова «посланник», ни усилительного «самого»; перевод не должен ни ослаблять, ни усиливать утверждение.
translation_notes:
  register: Современный литературный русский язык; краткое наставление звучит естественно и достойно. Формулировка сохраняет лаконичность и богословскую напряжённость греческого оригинала.
