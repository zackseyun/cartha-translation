  source_fidelity: 'Греч. ὃς ἂν οὖν передаёт обобщённое условие: «кто бы ни / если кто». Сочетание ἐλθὼν διδάξῃ означает «придёт и будет учить/научит», а δέξασθε αὐτόν — прямое повеление принять такого человека. Смысл черновика в целом верен.'
  naturalness: Фраза понятна и выдержана в современном литературном регистре. Однако оборот «всему этому, сказанному прежде» формально допустим, но стилистически несколько тяжеловесен и может не сразу показать, что «сказанному прежде» относится к содержанию предыдущего наставления.
  terminology: Специальных богословских терминов и спорных собственных имён в стихе нет. «Примите его» точно передаёт δέξασθε αὐτόν, не добавляя значения официального признания или рукоположения.
