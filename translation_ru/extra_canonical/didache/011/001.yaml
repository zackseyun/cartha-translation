  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: ru
  text: Итак, если кто придёт и научит вас всему этому, о чём было сказано прежде, примите его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: если кто
  rationale: 'Условно-обобщающая конструкция естественно передаёт неопределённость греческого выражения: речь идёт о любом человеке, который придёт и станет учить.'
- source_word: οὖν
  choice: итак
  rationale: Сохраняет выводную связь с предшествующим наставлением.
- source_word: διδάξῃ
  choice: научит
  rationale: Передаёт действие глагола διδάσκω в контексте наставления общины; совершенный вид соответствует условию о состоявшемся преподавании учения.
- source_word: ταῦτα πάντα, τὰ προειρημένα
  choice: всему этому, сказанному прежде
  rationale: Сохраняет и полноту πάντα, и обратную отсылку причастия προειρημένα, не добавляя неявного предмета вроде «учения».
- source_word: δέξασθε αὐτόν
  choice: примите его
  rationale: Прямо и естественно передаёт повеление о принятии пришедшего учителя.
theological_decisions:
- issue: Условие принятия приходящего учителя
  choice: Сохранена связь принятия с преподаванием всего ранее сказанного
  alternative: Передать более свободно как одобрение всякого учителя, согласного с учением
  rationale: Греческий текст формулирует конкретное условие и не уточняет ни статуса учителя, ни формы церковного одобрения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и наставительная. Синтаксис близок к греческому, но естественен по-русски.
