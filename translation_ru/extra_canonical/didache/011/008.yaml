source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: ru
  text: Но не всякий, кто говорит в Духе, — пророк, а только если его образ жизни соответствует образу жизни Господа.[a] Итак, по их образу жизни можно распознать и лжепророка, и пророка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если имеет образ жизни [или: нрав, поведение] Господа».'
    reason: Уточняет более буквальную форму выражения τοὺς τρόπους Κυρίου и передаёт возможные значения τρόποι, не смешивая его с ὁδός («путь»).
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: говорит в Духе
  rationale: Сохраняет раннехристианскую формулу речи в состоянии духовного вдохновения и не уточняет сверх текста, каким именно образом действует Дух.
- source_word: τοὺς τρόπους Κυρίου
  choice: живёт так, как Господь
  rationale: В данном контексте τρόποι обозначает нрав, поведение или образ жизни, а не ключевое для Дидахе понятие ὁδός — «путь». Естественная русская формулировка передаёт требование соответствия жизни пророка Господу.
- source_word: Ἀπὸ ... τῶν τρόπων γνωσθήσεται
  choice: по образу жизни можно распознать
  rationale: Передаёт критерий распознавания по поведению и естественно выражает греческий пассив γνωσθήσεται без ненужной тяжеловесности.
- source_word: ὁ ψευδοπροφήτης καὶ ὁ προφήτης
  choice: и лжепророка, и пророка
  rationale: 'Сохраняет обе категории: образ жизни позволяет распознать как ложного, так и истинного пророка.'
theological_decisions:
- issue: Критерий истинности пророка
  choice: Истинность определяется соответствием образа жизни Господу, а не одним лишь заявлением о речи в Духе.
  alternative: Понимать фразу как указание на особый перечень «путей Господа».
  rationale: Текст противопоставляет духовную речь нравственному облику; τρόποι обычно указывает на поведение, нрав или образ жизни и отличается от ὁδός, обозначающего «путь».
- issue: Значение πνεύματι
  choice: «в Духе» с прописной буквы
  alternative: «в духе» или «под действием духа»
  rationale: Контекст пророческой речи естественно указывает на Божьего Духа, однако формула «в Духе» сохраняет лаконичность оригинала и не описывает механизм вдохновения.
translation_notes:
  register: Современный литературный русский с кратким, наставительным звучанием. Формулировка «живёт так, как Господь» понятна широкому читателю; повтор слова τρόποι передан сначала естественной глагольной конструкцией, затем существительным «образ жизни».
