revisions:
- from: Но не всякий, кто говорит в Духе, — пророк, а лишь тот, кто живёт так, как Господь.[a] Итак, по образу жизни можно распознать и лжепророка, и пророка.
  to: Но не всякий, кто говорит в Духе, — пророк, а только если его образ жизни соответствует образу жизни Господа.[a] Итак, по их образу жизни можно распознать и лжепророка, и пророка.
  rationale: Исправление сохраняет условную конструкцию ἐὰν ἔχῃ, точнее передаёт τρόποι как образ жизни или нрав и воспроизводит во втором предложении соотнесение с образом жизни самих пророка и лжепророка. Смысловой контраст между заявлением о речи «в Духе» и проверкой поведения не изменён.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:35Z'
