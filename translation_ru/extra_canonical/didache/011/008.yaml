  verdict: revise
  source_fidelity: 'Греческое ἐὰν ἔχῃ τοὺς τρόπους Κυρίου буквально ставит условие: говорящий в Духе является пророком лишь если его образ жизни соответствует образу жизни Господа. В исходном варианте «живёт так, как Господь» несколько сужает и переформулирует это выражение как сравнение отдельных действий. Во втором предложении опущено притяжательное соотнесение τῶν τρόπων («по их образу жизни»).'
  naturalness: Текст в целом литературный и ясный. Формула «образ жизни соответствует образу жизни Господа» несколько повторна, но оправданна точностью и сохраняет повтор τρόποι в оригинале; она естественна для краткого наставительного контекста.
  terminology: «В Духе», «пророк» и «лжепророк» переданы удачно. «Образ жизни» точно отражает τρόποι как поведение, нравственный уклад или жизненный образ и не смешивает его с ὁδός («путь»), важным термином Дидахе.
  issues:
  - severity: medium
    issue: Условное выражение τοὺς τρόπους Κυρίου передано слишком свободно.
    rationale: «Живёт так, как Господь» может означать буквальное подражание поступкам Господа, тогда как греческое «имеет образ жизни/нрав Господа» характеризует уклад и поведение человека. Более прямое «если его образ жизни соответствует образу жизни Господа» сохраняет условность и смысл τρόποι.
  - severity: low
    issue: Во втором предложении не выражено τῶν («их»).
    rationale: «По образу жизни можно распознать» передаёт общий критерий, но оригинал говорит о распознании пророка и лжепророка по их образу жизни. Притяжательное слово также поддерживает повтор τρόποι.
