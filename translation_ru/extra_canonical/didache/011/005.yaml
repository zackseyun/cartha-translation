id: DID.11.5
reference: Didache 11:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ μενεῖ δὲ ἡμέραν μίαν· ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην· τρεῖς δὲ ἐὰν μείνῃ, ψευδοπροφήτης ἐστίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: ru
  text: Но пусть он не остаётся на один день; если же будет необходимость — то и на следующий. А если он останется на три дня, то он лжепророк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μενεῖ
  choice: пусть он не остаётся
  rationale: Будущее изъявительное здесь передаёт предписание; отрицание сохранено без добавления неподтверждённого «только».
- source_word: ἡμέραν μίαν
  choice: на один день
  rationale: Сохранена буквальная длительность винительного падежа и порядок смысла исходного текста.
- source_word: ἐὰν δὲ ᾖ χρεία
  choice: если же будет необходимость
  rationale: χρεία передано нейтрально как реальная необходимость, без уточнения её причины.
- source_word: καὶ τὴν ἄλλην
  choice: то и на следующий
  rationale: Подразумеваемое ἡμέραν («день») естественно восполнено по-русски; καί передано как «и».
- source_word: ψευδοπροφήτης
  choice: лжепророк
  rationale: Устоявшийся и точный русский эквивалент сложного греческого существительного.
theological_decisions:
- issue: Нормативная сила οὐ μενεῖ
  choice: пусть он не остаётся
  alternative: он не останется
  rationale: В контексте наставления форма выражает правило, однако не усиливается словами «не должен» или «запрещено».
- issue: Необычная последовательность сроков
  choice: сохранены «один день», «следующий» и «три дня» без поясняющей гармонизации
  alternative: переформулировать как разрешение оставаться один или два дня
  rationale: Исходный текст в данной редакции формально начинается с отрицания; его напряжение не следует молча устранять, хотя возможна текстологическая или идиоматическая трудность.
translation_notes:
  register: Современный литературный русский язык; краткая, наставительная и несколько формальная манера оригинала сохранена. Местоимение относится к пророку из контекста главы.
