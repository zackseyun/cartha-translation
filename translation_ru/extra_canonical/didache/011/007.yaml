  source_fidelity: 'Текст точно передаёт категорический запрет, выраженный сочетанием πάντα προφήτην с отрицанием: «ни одного пророка» исключает ошибочное прочтение как запрета испытывать лишь не всех пророков. «Испытывайте» и «судите» адекватно передают πειράσετε и διακρινεῖτε без искусственного сужения последнего. Пассивное «будет прощён» верно сохраняет ἀφεθήσεται и не вводит не названного в греческом действующего лица. Противопоставление «но этот грех не будет прощён» соответствует αὕτη δὲ ἡ ἁμαρτία.'
