  terminology: «Пророк», «грех», «прощён» и «Дух» употреблены последовательно и в уместном религиозном регистре. Прописная буква в «Духе» является интерпретационным решением, но неоднозначность греческого πνεύμα добросовестно обозначена в сноске; сноска привязана к нужному слову и не меняет текста.
