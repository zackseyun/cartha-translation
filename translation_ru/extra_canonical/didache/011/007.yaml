source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: ru
  text: И не испытывайте и не судите ни одного пророка, говорящего в Духе[a], потому что всякий грех будет прощён, но этот грех не будет прощён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно также передать: «говорящего в духе»; в данном контексте, вероятнее всего, имеется в виду речь под действием Божьего Духа.'
    reason: Сохранить формальную неоднозначность слова πνεῦμα, при этом объяснив принятое написание с прописной буквы.
lexical_decisions:
- source_word: πάντα προφήτην … οὐ
  choice: ни одного пророка
  rationale: 'Сочетание πᾶς с отрицанием передаёт полный запрет: нельзя испытывать какого-либо пророка, а не частичное отрицание «не каждого».'
- source_word: πειράσετε
  choice: не испытывайте
  rationale: Передаёт значение проверки или испытания притязаний пророка; будущее изъявительное в контексте имеет силу запрета.
- source_word: διακρινεῖτε
  choice: не судите
  rationale: Сохраняет широкий смысл вынесения суждения или оценки; второе будущее изъявительное также употреблено как запрет.
- source_word: λαλοῦντα ἐν πνεύματι
  choice: говорящего в Духе
  rationale: Формально сохраняет выражение ἐν πνεύματι и его религиозный смысл — речь под действием Духа, не сводя его к пояснительной парафразе.
- source_word: ἀφεθήσεται
  choice: будет прощён
  rationale: Естественно передаёт богословски значимый пассив без явного называния действующего лица.
theological_decisions:
- issue: Кого означает πνεῦμα в выражении ἐν πνεύματι
  choice: Дух (с прописной буквы)
  alternative: дух (со строчной буквы)
  rationale: Контекст пророческой речи наиболее естественно указывает на Божьего Духа, однако греческая орфография сама по себе не выражает различия между прописной и строчной буквой; неоднозначность отмечена в сноске.
- issue: Безусловность запрета испытывать пророка
  choice: Сохранён абсолютный запрет в формулировке данного стиха
  alternative: Добавить условие или ограничение на основании соседних наставлений
  rationale: Сам стих формулирует запрет категорично. Возможное напряжение с проверкой поведения пророков в ближайшем контексте не следует устранять внесением отсутствующей здесь оговорки.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Повтор «не будет прощён» сохранён ради категоричности и риторического соответствия греческому тексту.
