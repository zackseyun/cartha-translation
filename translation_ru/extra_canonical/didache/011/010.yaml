  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: ru
  text: И всякий пророк, учащий истине, если не делает того, чему учит, — лжепророк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: Но всякий пророк
  rationale: πᾶς передано как «всякий», а δέ — как противопоставительное «но», естественное в данном контексте.
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: учащий истине
  rationale: Сохранена конструкция с причастием и прямое значение τὴν ἀλήθειαν; «учить истине» звучит естественно и достойно.
- source_word: εἰ ἃ διδάσκει οὐ ποιεῖ
  choice: если сам не исполняет того, чему учит
  rationale: ποιεῖ буквально означает «делает», но в отношении учения по-русски естественнее «исполняет». «Сам» эксплицирует подразумеваемого субъекта, не изменяя смысла и подчёркивая расхождение между словом и делом.
- source_word: ψευδοπροφήτης ἐστί
  choice: — лжепророк
  rationale: Именная конструкция с нулевой связкой естественна для современного русского языка; тире ясно обозначает сказуемое.
theological_decisions:
- issue: Критерий признания лжепророка
  choice: 'Сохранено прямое утверждение: пророк, не исполняющий собственного истинного учения, назван лжепророком.'
  alternative: Смягчить до «поступает как лжепророк» или «его следует считать лжепророком».
  rationale: Греческое ψευδοπροφήτης ἐστί выражает прямую идентификацию, поэтому смягчение было бы неоправданным истолкованием.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, афористичная и близкая к синтаксической структуре греческого оригинала. Архаизмы и конфессионально окрашенные добавления отсутствуют.
