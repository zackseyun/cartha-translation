  - severity: low
    issue: Начальное «Но»
    rationale: δέ может передаваться как «но», но само по себе не обязательно выражает сильное противопоставление. В изолированном стихе нейтральное «И» точнее отражает его связочную функцию.
  revised_text: И всякий пророк, учащий истине, если не делает того, чему учит, — лжепророк.
