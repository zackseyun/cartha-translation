  source_fidelity: 'Греческая конструкция передана в целом точно: речь идёт о всяком пророке, который учит истине, но не делает того, чему учит; такой человек прямо назван лжепророком. Однако «исполняет» несколько сужает ποιεῖ до исполнения предписаний, тогда как греческое слово шире: «делает», «поступает согласно» своему учению.'
  naturalness: Фраза кратка и понятна. Замена «исполняет того» на «делает того» делает формулировку одновременно более близкой к оригиналу и естественной в данном афористическом контексте. Частица «Но» возможна для δέ в контексте, но без нужды усиливает противопоставление; нейтральное «И» безопаснее.
  terminology: «Пророк», «истина» и «лжепророк» переданы точно и в нейтральном современном литературном регистре. Никаких конфессиональных добавлений нет.
