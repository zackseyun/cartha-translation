source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: ru
  text: И всякий пророк, который в духе велит накрыть стол, не должен есть с него[a]; иначе он лжепророк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который в духе назначает трапезу, не должен есть от неё».'
    reason: Греческое выражение ὁρίζων τράπεζαν допускает более буквальную передачу; τράπεζα может обозначать как стол, так и находящуюся на нём пищу, то есть трапезу. Строчная буква в «в духе» сохраняет неопределённость πνεύματι.
lexical_decisions:
- source_word: ὁρίζων τράπεζαν
  choice: велит накрыть стол
  rationale: ὁρίζων здесь выражает распоряжение или указание, а τράπεζαν обозначает накрытый стол, то есть приготовленную трапезу. Формулировка сохраняет образ стола и естественно передаёт смысл приказания приготовить еду.
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: 'Сохранена краткость и возможная богословская многозначность греческой формулы: пророческое действие совершается под воздействием или по вдохновению Духа.'
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  choice: не должен есть с него
  rationale: Греческая форма будущего времени в нормативном контексте выражает запрет; русское «не должен» передаёт эту силу естественнее буквального «не будет». Местоимение соотнесено со «столом».
- source_word: ψευδοπροφήτης
  choice: лжепророк
  rationale: Устоявшийся и точный русский эквивалент сложного существительного со значением ложного пророка.
theological_decisions:
- issue: Характер выражения «в Духе»
  choice: Сохранить «в Духе» без поясняющей конкретизации
  alternative: «по вдохновению Духа»
  rationale: Исходный текст не объясняет точный механизм пророческого действия; более развернутый вариант мог бы сузить смысл.
- issue: Модальность οὐ φάγεται
  choice: Передать как нормативное «не должен есть»
  alternative: «не будет есть»
  rationale: Контекст устанавливает критерий распознавания истинного пророка, поэтому форма будущего имеет предписывающую силу, но перевод не превращает её в безусловное предсказание.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным звучанием. «Велит накрыть стол» понятно обычному читателю, сохраняет конкретный образ оригинала и избегает неясного буквального «определяет стол».
