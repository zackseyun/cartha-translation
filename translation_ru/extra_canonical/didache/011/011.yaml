source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: ru
  text: Но всякий испытанный, подлинный пророк, совершающий нечто ради земного таинства Церкви[a], но не учащий других делать то, что делает сам, не будет судим вами, ибо суд его — у Бога. Ибо так поступали и древние пророки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение «земное таинство Церкви» необычно и допускает разные толкования; точный смысл и характер упомянутого действия текст не уточняет.
    reason: Сноска отмечает действительную лексическую и историческую неясность выражения, не закрепляя ни одну из интерпретаций.
lexical_decisions:
- source_word: δεδοκιμασμένος, ἀληθινός
  choice: испытанный, истинный
  rationale: 'Сохранены два отдельных определения: пророк прошёл проверку и признан подлинным.'
- source_word: ποιῶν
  choice: совершающий нечто
  rationale: Глагол ποιέω употреблён без явно выраженного дополнения; «нечто» делает русскую фразу грамматически естественной, не уточняя самого действия.
- source_word: εἰς μυστήριον κοσμικὸν ἐκκλησίας
  choice: ради земного таинства Церкви
  rationale: Передаёт необычное и спорное греческое выражение максимально близко, не подменяя его конкретным толкованием.
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  choice: да не будет судим вами
  rationale: Выражает запрет общине выносить суд над таким пророком; пассивная конструкция сохранена.
- source_word: μετὰ Θεοῦ ... ἔχει τὴν κρίσιν
  choice: суд ему — у Бога
  rationale: Естественная русская передача буквального «имеет суд с Богом/у Бога», сохраняющая Бога как того, перед кем решается дело пророка.
- source_word: οἱ ἀρχαῖοι προφῆται
  choice: древние пророки
  rationale: Прямое и стилистически естественное соответствие.
theological_decisions:
- issue: Значение выражения μυστήριον κοσμικὸν ἐκκλησίας
  choice: земное таинство Церкви
  alternative: символический образ Церкви в мирских действиях / земная тайна Церкви
  rationale: Смысл фразы остаётся предметом споров и, возможно, относится к символическому пророческому действию. Основной текст не конкретизирует его как брак, трапезу или иной обряд.
- issue: Предел церковного суждения о признанном пророке
  choice: да не будет судим вами, ибо суд ему — у Бога
  alternative: вы не должны осуждать его, поскольку Бог будет его судить
  rationale: Сохранена напряжённость между ранее упомянутой проверкой пророка и запретом судить уже испытанного истинного пророка за особое символическое действие, которому он не учит остальных.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Формула «да не будет судим» слегка возвышенна, но понятна и передаёт нормативную силу фразы. Неясность центрального греческого выражения намеренно сохранена.
