  text: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν κατὰ τὸ δόγμα τοῦ εὐαγγελίου, οὕτω ποιήσατε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: ru
  text: Что же касается апостолов и пророков, поступайте так, согласно правилу Евангелия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественно передаёт переход к новой теме; частица δὲ отражена словом «же» без добавления временного значения.
- source_word: ἀποστόλων καὶ προφητῶν
  choice: апостолов и пророков
  rationale: Прямой и общепонятный перевод обоих наименований служения.
- source_word: κατὰ τὸ δόγμα τοῦ εὐαγγελίου
  choice: согласно правилу Евангелия
  rationale: δόγμα здесь обозначает установленное правило или предписание; «правило» сохраняет нормативный смысл, не придавая выражению позднейшего оттенка догматической формулы.
- source_word: οὕτω ποιήσατε
  choice: поступайте так
  rationale: Кратко и естественно передаёт наречие οὕτω и императив аориста ποιήσατε; русское несовершенное «поступайте» уместно как общее наставление.
theological_decisions:
- issue: Характер «правила Евангелия»
  choice: Сохранена родительная конструкция «правило Евангелия»
  alternative: «как предписывает Евангелие»
  rationale: Выбранный вариант не уточняет сверх греческого текста, является ли Евангелие источником, содержанием или сферой данного правила, и тем самым сохраняет широту τοῦ εὐαγγελίου.
translation_notes:
  register: Современный литературный русский язык; наставительный, сдержанный и достойный регистр. Синтаксис близок к греческому, но естественен для обычного читателя.
