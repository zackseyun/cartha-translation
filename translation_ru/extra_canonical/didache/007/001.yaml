  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: Περὶ δὲ τοῦ βαπτίσματος передано как «Что же касается крещения», два повеления βαπτίσατε сохранены, а временное причастие προειπόντες корректно выражено оборотом «сперва сказав всё это». Формула εἰς τὸ ὄνομα передана традиционным и естественным «во имя» при сохранении единственного числа «имя».'
