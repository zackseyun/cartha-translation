  terminology: «Крещение / крестите» и троичная формула переданы последовательно и без конфессионально обусловленного толкования. Передача ὕδατι ζῶντι как «в проточной воде» адекватно выражает практический смысл идиомы в этом контексте; сноска с буквальным вариантом «в живой воде» обеспечивает прозрачность исходного выражения. Сноска к προειπόντες верно исключает необоснованно возвышенное значение «провозгласив».
