source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: ru
  text: 'Что же касается крещения, крестите так: сперва сказав всё это,[a] крестите во имя Отца, и Сына, и Святого Духа в проточной воде.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сперва изложив всё это».'
    reason: Причастие προειπόντες допускает оттенок предварительного изложения или наставления, но не требует значения «провозгласив».
  - marker: b
    text: 'Буквально: «в живой воде».'
    reason: Сохраняет прозрачность греческого выражения ἐν ὕδατι ζῶντι, идиоматически относящегося к текущей воде.
lexical_decisions:
- source_word: βαπτίσματος / βαπτίσατε
  choice: крещения / крестите
  rationale: Естественная и традиционно понятная русская передача однокоренных греческих слов; повелительная форма сохранена.
- source_word: προειπόντες
  choice: сперва сказав
  rationale: Передаёт значение «сказав прежде/заранее» без не подтверждённого глаголом оттенка торжественного провозглашения.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Устоявшаяся русская формула, сохраняющая направительный смысл εἰς в контексте крещения.
- source_word: ὕδατι ζῶντι
  choice: проточной воде
  rationale: В данном практическом предписании идиома «живая вода» обозначает текущую, проточную воду; основной текст передаёт предполагаемый конкретный смысл, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Троичная формула крещения
  choice: во имя Отца, и Сына, и Святого Духа
  alternative: в имя Отца, и Сына, и Святого Духа
  rationale: Сохранено единственное число «имя» и все три наименования; русское «во имя» естественно и не навязывает дополнительного богословского истолкования.
- issue: Содержание «всего этого»
  choice: всё это
  alternative: всё изложенное выше
  rationale: Указательность оригинала сохранена без жёсткого определения того, относится ли выражение ко всему предшествующему наставлению или к более узкому материалу.
translation_notes:
  register: Современный литературный русский с ясной наставительной интонацией. Синтаксический повтор «крестите» сохранён как характерная структура оригинала; лексика понятна неспециалисту и остаётся достаточно торжественной для раннехристианского церковного текста.
