source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: ru
  text: Перед крещением пусть заранее постятся и крестящий, и крещаемый, а также другие, если могут. Крещаемому же прикажи поститься один или два дня перед крещением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ δὲ τοῦ βαπτίσματος
  choice: Перед крещением
  rationale: Прямо и естественно передаёт временную связь; δέ здесь служит переходом и не требует отдельного противительного союза.
- source_word: προνηστευσάτω
  choice: пусть заранее постятся
  rationale: Передаёт значение предварительного поста; множественное число по-русски естественно объединяет два следующих подлежащих.
- source_word: ὁ βαπτίζων καὶ ὁ βαπτιζόμενος
  choice: и крестящий, и крещаемый
  rationale: Сохраняет симметрию греческих причастий и различие между совершающим и принимающим крещение.
- source_word: καὶ εἴ τινες ἄλλοι δύνανται
  choice: а также те из других, кто может
  rationale: Сохраняет условный смысл способности или возможности, не уточняя, чем именно она определяется.
- source_word: κελεύσεις
  choice: вели
  rationale: Будущее изъявительное в наставительном контексте имеет предписывающую силу; русский императив передаёт её естественно.
- source_word: πρὸ μιᾶς ἢ δύο
  choice: один или два дня перед крещением
  rationale: У подразумеваемого существительного по контексту значение «день/дни»; повтор «перед крещением» устраняет в русском двусмысленность без изменения смысла.
theological_decisions:
- issue: Обязательность поста для крещаемого и остальных участников
  choice: Для крещаемого сохранено прямое предписание; для крестящего — побуждение, для других — оговорка «кто может».
  alternative: Сформулировать все требования как одинаково обязательные.
  rationale: Греческий текст различает προνηστευσάτω, условное εἴ ... δύνανται и отдельное κελεύσεις в отношении крещаемого; эти оттенки не следует сглаживать.
- issue: Продолжительность поста
  choice: «один или два дня» без установления единой обязательной продолжительности
  alternative: «не менее одного дня» или «два дня».
  rationale: ἢ сохраняет явную альтернативу между одним и двумя днями.
translation_notes:
  register: Современный литературный русский язык с умеренно церковной, но общедоступной лексикой. Формулировка лаконична и наставительна; архаизмы и конфессионально специфические термины не использованы.
