  source_fidelity: 'Смысл в целом передан точно: предварительный пост относится к крестящему и крещаемому; другие включены лишь при условии возможности; крещаемому отдельно предписан пост в течение одного или двух дней перед крещением. Однако оборот «те из других» неестественен для русского и несколько неопределённо передаёт простое ἄλλοι («другие»).'
