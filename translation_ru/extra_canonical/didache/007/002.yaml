  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: ru
  text: Если же у тебя нет проточной воды,[a] крести в другой воде; а если не можешь крестить в холодной воде, крести в тёплой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живой воды»; в данном контексте, вероятно, текущей, проточной.'
    reason: Сохраняет буквальный образ греческого ὕδωρ ζῶν и поясняет его вероятный практический смысл, не устраняя полностью лексическую многозначность.
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: проточная вода
  rationale: Буквально «живая вода»; в данном практическом наставлении выражение обычно обозначает текущую, проточную воду. В основном тексте передан контекстуальный смысл, а буквальная форма сохранена в сноске.
- source_word: βάπτισον
  choice: крести
  rationale: Императив аориста от βαπτίζω передан естественным русским повелительным наклонением в единственном числе, соответствующим обращению ἔχῃς/δύνασαι.
- source_word: εἰς ἄλλο ὕδωρ
  choice: в другой воде
  rationale: Хотя εἰς обычно выражает направление, здесь сочетание относится к среде совершения крещения. Русское «в другой воде» естественно передаёт смысл и избегает неуместного оттенка движения «в воду».
- source_word: ἐν ψυχρῷ, ἐν θερμῷ
  choice: в холодной, … в тёплой
  rationale: Субстантивированные прилагательные относятся к подразумеваемой воде; в русском это естественно передаётся эллиптически с сохранением противопоставления температуры.
theological_decisions:
- issue: Значение выражения ὕδωρ ζῶν
  choice: 'В тексте: «проточная вода»; буквальное чтение отмечено в сноске.'
  alternative: «живая вода»
  rationale: Контекст перечисляет допустимые виды воды для крещения, поэтому речь, вероятнее всего, о текущей воде, а не о богословском образе. Сноска сохраняет прозрачность исходной метафоры и возможную смысловую напряжённость.
- issue: Предлог εἰς при βάπτισον
  choice: «крести в другой воде»
  alternative: «крести в другую воду»
  rationale: В контексте εἰς указывает на воду как среду крещения. Выбор не определяет способ совершения обряда и не вносит конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией оригинала. Синтаксический параллелизм и лаконичность сохранены; терминология не уточняет способ крещения сверх сказанного в источнике.
