  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: ru
  text: Если же у тебя нет ни той, ни другой воды, трижды возлей воду на голову во имя Отца и Сына и Святого Духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφότερα
  choice: ни той, ни другой воды
  rationale: Форма означает «оба / и то и другое» и отсылает к двум названным ранее видам воды. Добавление слова «воды» делает эту отсылку ясной и естественной по-русски, не меняя смысла.
- source_word: ἔκχεον
  choice: возлей
  rationale: Передаёт повеление вылить воду на голову; слово уместно в dignified религиозном тексте и не подразумевает полного погружения.
- source_word: τρὶς
  choice: трижды
  rationale: Точно передаёт троекратность действия.
- source_word: εἰς ὄνομα
  choice: во имя
  rationale: Устойчивая и естественная русская передача формулы; буквальное «в имя» здесь неидиоматично.
theological_decisions:
- issue: Определённость Отца, Сына и Святого Духа при отсутствии артиклей в греческом
  choice: Отца, и Сына, и Святого Духа
  alternative: Отца, Сына и Святого Духа
  rationale: Отсутствие артиклей не делает именования неопределёнными. Повтор союза сохраняет торжественную трёхчастную структуру греческой формулы, не привнося отдельного богословского толкования.
- issue: Способ совершения действия
  choice: возлей воду на голову
  alternative: окропи голову водой
  rationale: Греческий глагол означает «лить, выливать», а не «кропить»; поэтому сохранено именно возлияние воды.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, богослужебно уместным звучанием. Синтаксис остаётся простым и понятным; местоименная отсылка раскрыта словом «воды» ради естественности русского текста.
