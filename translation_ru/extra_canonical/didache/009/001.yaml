lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественно передаёт переход к новой теме; частица δέ выражена русским «же», без добавления временного значения «теперь».
- source_word: τῆς εὐχαριστίας
  choice: благодарения
  rationale: Сохраняет основное значение греческого слова и его словесную связь с последующим εὐχαριστήσατε; возможное специальное обозначение евхаристической трапезы отмечено в сноске.
- source_word: οὕτως εὐχαριστήσατε
  choice: благодарите так
  rationale: Передаёт наречие οὕτως и повелительную форму аориста естественной русской формулой, вводящей последующий текст молитвы.
theological_decisions:
- issue: Значение εὐχαριστία в раннехристианском литургическом контексте
  choice: благодарение
  alternative: Евхаристия / благодарственная трапеза
  rationale: Перевод не подменяет смысл позднейшим исключительно терминологическим употреблением и сохраняет намеренный корневой повтор εὐχαριστία — εὐχαριστήσατε; более специальное контекстуальное значение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формулировкой. Двоеточие сохраняет вводную функцию греческой высокой точки перед молитвенными формулами следующих стихов.
