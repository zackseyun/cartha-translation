source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: ru
  text: 'Но пусть никто не ест и не пьёт от вашей евхаристии, кроме крещённых во имя Господа. Ведь и об этом Господь сказал: «Не давайте святыни псам».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Мф. 7:6.
    reason: Указание на источник приведённого изречения Господа.
lexical_decisions:
- source_word: εὐχαριστίας
  choice: евхаристии
  rationale: В данном раннехристианском контексте слово обозначает общинную благодарственную трапезу; «евхаристия» сохраняет историко-литургический смысл и связь с предыдущими молитвами Дидахе.
- source_word: ἀπὸ τῆς εὐχαριστίας
  choice: от вашей евхаристии
  rationale: Предлог ἀπό передан формально, сохраняя возможный смысл участия в пище и питье, принадлежащих евхаристической трапезе.
- source_word: οἱ βαπτισθέντες
  choice: крещённых
  rationale: Причастие аориста в пассивном залоге обозначает тех, кто прошёл крещение; русская форма естественна после «кроме».
- source_word: εἰς ὄνομα Κυρίου
  choice: во имя Господа
  rationale: Традиционная и точная передача крещальной формулы с εἰς; отсутствие артикля перед Κυρίου не требует неопределённости в русском.
- source_word: τὸ ἅγιον
  choice: святыни
  rationale: Субстантивированное прилагательное означает «то, что свято»; «святыня» кратко и естественно передаёт это значение и узнаваемую библейскую формулировку.
- source_word: τοῖς κυσί
  choice: псам
  rationale: Сохраняется резкий образ цитаты и традиционно возвышенный регистр, подходящий для прямой речи Господа.
theological_decisions:
- issue: Круг допускаемых к евхаристии
  choice: кроме крещённых во имя Господа
  alternative: кроме тех, кто крещён во имя Господа
  rationale: Сохранено прямое условие текста без уточнения способа крещения, церковной принадлежности или дополнительных требований.
- issue: Связь изречения о святыне с евхаристией
  choice: Ведь и об этом Господь сказал
  alternative: Ибо относительно этого Господь также сказал
  rationale: Передана явная авторская отнесённость изречения к рассматриваемому вопросу без объяснения характера этой связи.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранён термин «евхаристия», поскольку контекст непосредственно литургический; синтаксис слегка упрощён ради ясности, но логические связи и строгость запрета не ослаблены.
