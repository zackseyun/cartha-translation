id: DID.9.4
reference: Didache 9:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: ru
  text: Как этот кусок хлеба был рассеян по горам, а затем, собранный вместе, стал одним, так пусть и Твоя Церковь будет собрана от краёв земли в Твоё Царство. Ведь Тебе принадлежат слава и сила через Иисуса Христа[a] во веки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Иисуса Мессию».'
    reason: Χριστός — греческое титульное обозначение Помазанника, то есть Мессии, хотя в данной формуле оно также может восприниматься как закрепившееся «Христос».
lexical_decisions:
- source_word: κλάσμα
  choice: кусок хлеба
  rationale: В контексте благодарения над хлебом слово обозначает отломленный кусок хлеба; такой перевод понятнее современному читателю, чем отвлечённые «частица» или «фрагмент», и не добавляет отсутствующего в данной форме глагола «преломлять».
- source_word: ἐκκλησία
  choice: Церковь
  rationale: Здесь имеется в виду собранная Богом община как единое целое; «Церковь» естественно передаёт этот раннехристианский смысл и сохраняет связь образа с последующим «будет собрана».
- source_word: ἀπὸ τῶν περάτων τῆς γῆς
  choice: от краёв земли
  rationale: Сохраняет пространственный библейский образ исходного выражения без ненужного пояснения.
- source_word: εἰς τοὺς αἰῶνας
  choice: во веки
  rationale: Краткая, достойная и привычная русская формула, соответствующая буквальному «в века».
theological_decisions:
- issue: Передача Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  alternative: Иисуса Мессию
  rationale: В устойчивой раннехристианской формуле Χριστός может восприниматься как закрепившийся титул или часть имени; основной русский вариант «Христос» сохраняет традиционную форму, а мессианское значение отмечено в сноске.
- issue: Направление собирания Церкви
  choice: в Твоё Царство
  alternative: для Твоего Царства
  rationale: Предлог εἰς прямо выражает движение или вхождение в Царство; перевод не ослабляет эту эсхатологическую направленность.
translation_notes:
  register: Современный литературный русский язык с молитвенно-литургическим достоинством. Местоимения, обращённые к Богу, даны с прописной буквы. Синтаксический параллелизм «как… так…» и собирательный образ исходника сохранены.
