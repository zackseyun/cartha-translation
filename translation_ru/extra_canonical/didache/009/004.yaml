  source_fidelity: 'Текст точно передаёт греческий синтаксический параллелизм и основные смысловые элементы: рассеяние κλάσμα по горам, его собирание в одно, молитвенное собирание ἐκκλησία от краёв земли в Божье Царство и заключительную доксологию. «Кусок хлеба» является контекстуально оправданным раскрытием κλάσμα в евхаристической молитве и не меняет смысла.'
  naturalness: Русский текст звучит естественно и сохраняет достойный молитвенный регистр. Конструкция «Как …, так пусть …» ясна; «собранный вместе» немного усилительно, но соответствует смыслу συναχθέν и не создаёт стилистической проблемы.
  terminology: «Церковь», «Царство», «слава и сила», «во веки» уместны для современного литературного русского с литургическим оттенком. Основное «Иисуса Христа» надёжно передаёт закрепившуюся раннехристианскую формулу Ἰησοῦ Χριστοῦ; сноска корректно отмечает переводческое значение «Мессия», не выдавая его за иной греческий вариант.
