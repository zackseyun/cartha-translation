source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ κλάσματος· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ζωῆς καὶ γνώσεως, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: ru
  text: 'А о преломлённом хлебе:


    Благодарим Тебя, Отец наш,

    за жизнь и знание,

    которые Ты открыл нам через Иисуса, Слугу Твоего.

    Тебе слава вовеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσματος
  choice: преломлённом хлебе
  rationale: Буквально слово означает «обломок, преломлённое»; в контексте евхаристической молитвы подразумевается преломлённый хлеб, что естественно и ясно передано по-русски.
- source_word: Εὐχαριστοῦμέν
  choice: Благодарим
  rationale: Передаёт обычное значение глагола «благодарить» без преждевременного превращения его в позднейший технический термин.
- source_word: γνώσεως
  choice: знание
  rationale: Сохраняет прямое и широкое значение греческого слова, не сужая его до «познания» или особого тайного знания.
- source_word: ἐγνώρισας
  choice: открыл
  rationale: В данном контексте означает «сделал известным»; «открыл нам» звучит естественно и сохраняет смысл сообщения или явления.
- source_word: παιδός
  choice: Слугу
  rationale: παῖς здесь допускает значения «слуга» и «отрок/дитя»; «Слуга» соответствует библейскому и раннехристианскому употреблению, не подменяя слово более поздним титулом «Сын».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое, достойное и понятное литургическое соответствие выражению «на века».
theological_decisions:
- issue: Значение παῖς применительно к Иисусу
  choice: Слуга Твоего
  alternative: Сына Твоего; Отрока Твоего
  rationale: Греческий текст не использует υἱός («сын»). Выбор «Слуга» сохраняет вероятную связь с библейским образом Божьего Слуги и не вносит отсутствующий в источнике термин, хотя многозначность παῖς остаётся существенной.
- issue: Объект κλάσμα
  choice: преломлённый хлеб
  alternative: преломлённое; кусок хлеба
  rationale: Само существительное буквально называет то, что отломлено, но евхаристический контекст ясно указывает на хлеб. Экспликация делает русский заголовок естественным, не меняя предмет молитвы.
translation_notes:
  register: Современный литературный русский с кратким, молитвенным и достойным ритмом. Местоимения, обращённые к Богу, написаны с прописной буквы как уместная русская традиция благоговейного текста. Синтаксическая разбивка следует поэтической структуре молитвы.
