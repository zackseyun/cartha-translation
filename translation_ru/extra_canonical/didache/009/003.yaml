  source_fidelity: 'Текст точно передаёт греческий оригинал: «о преломлённом хлебе» оправдано контекстом κλάσμα, «Благодарим» соответствует Εὐχαριστοῦμέν, а «жизнь и знание» сохраняет широкое значение ζωῆς καὶ γνώσεως. Русское множественное «которые» естественно относится к двум однородным существительным, хотя греческое относительное местоимение формально стоит в единственном числе. «Открыл нам» адекватно передаёт ἐγνώρισας («сделал известным»).'
  naturalness: Современный литературный русский звучит естественно, кратко и молитвенно. Разбивка строк поддерживает ритм исходной благодарственной формулы. Благоговейное написание местоимений с прописной буквы последовательно и уместно для выбранного регистра.
  terminology: '«Слуга Твоего» — допустимая и предпочтительная здесь передача παιδός: она не заменяет многозначное παῖς термином «Сын», которого в греческом тексте нет. «Преломлённый хлеб» является ясной контекстуальной экспликацией κλάσμα и не вносит доктринального толкования. «Вовеки» точно и стилистически уместно передаёт εἰς τοὺς αἰῶνας.'
