base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: ru
  text: 'Сначала — о чаше:


    «Благодарим Тебя, Отец наш,


    за святую лозу Давида, служителя Твоего,


    которую Ты открыл нам через Иисуса, служителя Твоего.


    Тебе слава вовеки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον περὶ τοῦ ποτηρίου
  choice: Прежде — о чаше
  rationale: Сохраняет порядок наставления и краткую рубричную форму греческого текста; «чаша» естественна для молитвенного и трапезного контекста.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Благодарим Тебя
  rationale: Прямо передаёт значение глагола εὐχαριστέω без преждевременного введения позднейшего терминологического смысла слова «Евхаристия».
- source_word: ἡ ἁγία ἄμπελος Δαβίδ
  choice: святая лоза Давида
  rationale: Формально сохраняет образ лозы и его неоднозначность; «виноградная лоза» была бы яснее буквально, но тяжелее и могла бы сузить метафору.
- source_word: παῖς
  choice: служитель / Служитель
  rationale: В отношении Давида и Иисуса слово может значить «слуга», «служитель» или «дитя/сын». «Служитель» естественно связывает формулировку с библейским языком о Божьем избраннике, не превращая παῖς в υἱός («Сын»). Заглавная буква в отношении Иисуса служит русской норме благоговейного именования, не меняя лексического значения.
- source_word: ἧς ἐγνώρισας ἡμῖν
  choice: которую Ты открыл нам
  rationale: Передаёт каузативный смысл «дал узнать, сделал известной». Женский род относительного местоимения сохраняет грамматическую связь именно с «лозой».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая, современно понятная и достойная славословная формула, соответствующая идиоматическому значению греческого выражения.
theological_decisions:
- issue: Значение «святой лозы Давида»
  choice: Сохранить образ без истолкования
  alternative: Передать как «святой род Давида», «святое царство Давида» или прямо отнести лозу ко Христу
  rationale: Греческий текст оставляет образ богословски насыщенным и не разъясняет, означает ли он род, обетование, царство, мессианскую линию или Самого Иисуса. Перевод не должен устранять эту многозначность.
- issue: Передача παῖς применительно к Давиду и Иисусу
  choice: В обоих случаях использовать одно и то же слово «служитель»
  alternative: «раб» для Давида и «Сын» для Иисуса
  rationale: Повтор одного греческого слова значим. Разведение вариантов внесло бы в текст различие, которого на лексическом уровне нет, а «Сын» подменило бы παῖς словом υἱός.
- issue: Тип действия в ἐγνώρισας
  choice: «открыл нам»
  alternative: «дал нам познать» или «сделал известной нам»
  rationale: «Открыл» естественно по-русски выражает Божье сообщение и сохраняет направленность действия, не уточняя способ откровения.
translation_notes:
  register: Современный литературный русский с кратким литургическим ритмом. Синтаксис близок к греческому, но не калькирован. Архаические формы сведены к уместному славословному «вовеки». Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с распространённой русской религиозной издательской практикой.
