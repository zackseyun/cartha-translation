source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: ru
  text: 'Есть два пути: один — жизни, другой — смерти, и между этими двумя путями — великое различие.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ δύο
  choice: два пути
  rationale: Прямо передаёт традиционный нравственный образ двух путей и естественно звучит по-русски.
- source_word: μία τῆς ζωῆς καὶ μία τοῦ θανάτου
  choice: один — жизни, другой — смерти
  rationale: Родительный падеж сохранён без добавления толкования; «другой» устраняет неестественное для русского повторение «один».
- source_word: διαφορὰ δὲ πολλὴ
  choice: великое различие
  rationale: Передаёт усиленное значение πολλή и сохраняет возвышенный, но понятный современный регистр.
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: между этими двумя путями
  rationale: Указательное «этими» естественно отсылает к только что названным путям и не меняет смысла.
theological_decisions:
- issue: Образ путей жизни и смерти
  choice: Сохранить образ буквально, не раскрывая его как учение о поведении, спасении или конечной участи.
  alternative: 'Передать истолковательно: «два образа жизни» или «путь к жизни и путь к смерти».'
  rationale: Греческий текст оставляет образ ёмким и допускает одновременно нравственное и эсхатологическое звучание.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным и назидательным строем. Тире подчёркивают параллелизм исходной фразы; архаизмы не используются.
