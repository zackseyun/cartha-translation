  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: ru
  text: Воздерживайся от плотских и мирских желаний. Если кто даст тебе пощёчину по правой щеке, подставь ему и другую щёку, и будешь совершенен. Если кто принудит тебя пройти одну милю[a], пройди с ним две. Если кто заберёт у тебя плащ, отдай ему и рубаху. Если кто возьмёт у тебя то, что принадлежит тебе, не требуй обратно, ведь ты не можешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может обозначать принуждение к службе или сопровождению, в том числе со стороны властей.
    reason: Поясняет исторический оттенок глагола ἀγγαρεύω и основание перевода «принудит».
lexical_decisions:
- source_word: Ἀπέχου
  choice: Воздерживайся
  rationale: Передаёт продолжительное нравственное предписание в естественной форме современного русского языка.
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: плотских и мирских желаний
  rationale: Сохраняет два разных греческих определения и их нравственно-богословскую окраску, не сводя их к одному понятию.
- source_word: ῥάπισμα
  choice: ударит
  rationale: В данном контексте существительное в сочетании с δῷ естественно передаётся по-русски глагольной конструкцией «ударит».
- source_word: ἀγγαρεύσῃ
  choice: принудит тебя пройти
  rationale: Глагол обозначает принуждение к службе или сопровождению; подразумеваемое движение выражено для ясности русского текста.
- source_word: ἱμάτιον / χιτῶνα
  choice: плащ / рубаху
  rationale: Различает верхнюю одежду и носимую под ней одежду доступными современному читателю словами.
- source_word: μὴ ἀπαίτει
  choice: не требуй обратно
  rationale: Глагол означает настойчиво требовать возвращения взятого; «обратно» делает направленность требования явной и естественной по-русски.
theological_decisions:
- issue: Значение τέλειος
  choice: совершенен
  alternative: зрел / достигнешь полноты
  rationale: Буквальный и традиционно узнаваемый эквивалент сохраняет нравственно-богословскую напряжённость высказывания, не сужая значение до одной интерпретации.
- issue: Неуточнённый смысл οὐδὲ γὰρ δύνασαι
  choice: ведь ты и не можешь
  alternative: ведь ты не можешь вернуть своё
  rationale: Греческий текст не называет дополнение при «можешь»; русский перевод сохраняет эту резкую и неоднозначную незавершённость, а не объясняет её за автора.
translation_notes:
  register: Современный литературный русский с краткими повелительными конструкциями и достойным наставительным тоном. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные пояснения не вводились.
