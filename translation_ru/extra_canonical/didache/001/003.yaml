source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: ru
  text: 'А учение этих слов таково: благословляйте проклинающих вас, молитесь за ваших врагов и поститесь за преследующих вас. Ибо какая вам в том заслуга, если вы любите тех, кто любит вас? Разве и язычники не поступают так же? Вы же любите ненавидящих вас — и у вас не будет врага.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ διδαχή
  choice: учение
  rationale: Прямой и естественный эквивалент, сохраняющий наставительный характер текста.
- source_word: χάρις
  choice: благодарность
  rationale: В данном риторическом вопросе слово обозначает признательность или благодарность за поступок; вариант сохраняет связь с формулировкой традиции Иисуса, не сводя смысл к заслуге.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В иудейско-христианском контексте это обычное обозначение народов вне общины; современному читателю оно понятно.
- source_word: οὐχ ἕξετε ἐχθρόν
  choice: у вас не будет врага
  rationale: Сохранено буквальное единственное число и открытая смысловая напряжённость обещания.
theological_decisions:
- issue: Значение χάρις в вопросе о любви к любящим
  choice: какая вам за это благодарность
  alternative: какая вам заслуга / какая вам благодать
  rationale: «Благодарность» передаёт возможный смысл одобрения или признательности и не вводит явно учение о заслуживании спасения; «благодать» в современном русском могла бы неоправданно сузить смысл до специального богословского термина.
- issue: Заключительное обещание об отсутствии врага
  choice: и у вас не будет врага
  alternative: и вы не будете иметь врага
  rationale: 'Сохранено без пояснительного истолкования: текст не уточняет, означает ли это преодоление вражды со стороны ученика, изменение противников или итоговое обещание.'
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис близок к греческому, но естественен по-русски; риторические вопросы и контраст ὑμεῖς δέ переданы явно.
