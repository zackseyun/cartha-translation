source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: ru
  text: Всякому, кто просит у тебя, давай и не требуй назад, ибо Отец хочет, чтобы всем давалось из его собственных даров.[a] Блажен тот, кто даёт согласно заповеди, ибо он невиновен. Но горе тому, кто принимает! Ведь если кто принимает, имея нужду, он будет невиновен; а тот, кто нужды не имеет, понесёт наказание за то, почему он получил и с какой целью. Оказавшись же в заключении,[b] он будет допрошен о том, что сделал, и не выйдет оттуда, пока не отдаст последний кодрант.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Отец хочет, чтобы его собственные дары были даны всем».'
    reason: Греческая конструкция допускает различную расстановку смыслового акцента между раздачей из даров Отца и передачей самих даров всем.
  - marker: b
    text: 'Или: «оказавшись в стеснении»; греческое слово может означать также бедственное или мучительное положение.'
    reason: Слово συνοχή имеет более широкий диапазон значений, чем физическое заключение.
lexical_decisions:
- source_word: χαρισμάτων
  choice: даров
  rationale: Передаёт значение благодатно данных даров без избыточного богословского уточнения; оборот «из его собственных даров» сохраняет ἐκ τῶν ἰδίων χαρισμάτων.
- source_word: ἀθῷος
  choice: невиновен
  rationale: 'Соответствует судебно-нравственному смыслу: человек не подлежит осуждению или наказанию.'
- source_word: δώσει δίκην
  choice: понесёт наказание
  rationale: Естественный русский эквивалент идиомы о несении кары или ответственности.
- source_word: ἐν συνοχῇ
  choice: в заключении
  rationale: Контекст последующего выхода «оттуда» и выплаты последней монеты поддерживает образ содержания под стражей, хотя само слово допускает более широкое значение стеснения.
- source_word: κοδράντην
  choice: кодрант
  rationale: Сохраняет название мелкой римской монеты и исторический колорит исходного текста.
theological_decisions:
- issue: Кому принадлежат и как раздаются дары Отца
  choice: «Отец хочет, чтобы всем давали из его собственных даров»
  alternative: «Отец хочет, чтобы его собственные дары были даны всем»
  rationale: Основной текст сохраняет конструкцию ἐκ τῶν ἰδίων χαρισμάτων («из его собственных даров») и не утверждает однозначно, что каждый дар целиком предназначен каждому человеку.
- issue: Характер последующего разбирательства
  choice: 'Сохранён судебно-тюремный образ: «в заключении… допрошен… не выйдет»'
  alternative: Понимание συνοχή как бедствия, стеснения или мучительного положения
  rationale: Ближайший контекст благоприятствует образу заключения, но лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и слегка афористичным звучанием. Синтаксис сохраняет последовательность увещевания, благословения и предостережения; исторический термин «кодрант» оставлен без модернизации.
