    rationale: Оборот «почему он взял и на что» меняет глагольный смысл λαμβάνω («получать») и оставляет «на что» без ясного управляющего слова. Нужна формулировка «почему он получил и с какой целью».
  - severity: low
    issue: Активная формулировка «чтобы всем давали»
    rationale: Она возможна по смыслу, но греческое δίδοσθαι — пассивный инфинитив. Безличное «чтобы всем давалось» ближе к форме оригинала и не уточняет, кто именно раздаёт.
