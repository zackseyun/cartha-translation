id: DID.1.6
reference: Didache 1:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: ru
  text: 'Но и об этом сказано: «Пусть твоя милостыня потеет в твоих руках, пока не узнаешь, кому дать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: 'Прямое и естественное соответствие в данном контексте: помощь нуждающемуся, подаваемая из милосердия.'
- source_word: Ἱδρωσάτω
  choice: пусть… потеет
  rationale: Сохранён намеренно яркий и необычный образ греческого текста, призывающий не спешить с раздачей без рассуждения.
- source_word: εἰς τὰς χεῖράς σου
  choice: в твоих руках
  rationale: Передаёт локальный смысл выражения и сохраняет телесный образ оригинала.
- source_word: μέχρις ἂν γνῷς
  choice: пока не узнаешь
  rationale: Естественно передаёт временную конструкцию с аористом сослагательного наклонения без уточнения способа узнавания.
- source_word: τίνι δῷς
  choice: кому дать
  rationale: 'Сохраняет эллипсис оригинала: подразумевается, что дать следует милостыню, но дополнение не повторяется.'
theological_decisions:
- issue: Соотношение щедрости и рассудительности при подаянии
  choice: Сохранить повелительный афоризм без поясняющего смягчения
  alternative: Передать смысл как призыв тщательно проверять достоинство получателя
  rationale: Греческий текст требует рассудительности, но не определяет критерии и не говорит прямо о «достоинстве» получателя; такое уточнение внесло бы интерпретацию.
translation_notes:
  register: Современный литературный русский язык с сохранением афористической резкости и необычной метафоры оригинала. Цитата оформлена кавычками; лексика проста и dignified, без конфессиональных добавлений.
