id: DID.1.2
reference: Didache 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: ru
  text: 'Итак, путь жизни таков: во-первых, люби Бога, сотворившего тебя; во-вторых — ближнего своего, как самого себя. И чего не желаешь, чтобы случилось с тобой, того и сам не делай другому.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ ... ὁδὸς τῆς ζωῆς
  choice: путь жизни
  rationale: Прямо передаёт образ пути и сохраняет ключевую формулировку текста.
- source_word: ἀγαπήσεις
  choice: люби
  rationale: Греческая форма будущего времени здесь имеет предписывающую силу; русский императив передаёт её естественно и ясно.
- source_word: τὸν Θεὸν τὸν ποιήσαντά σε
  choice: Бога, сотворившего тебя
  rationale: «Сотворившего» точно передаёт ποιήσαντα в отношении Бога и сохраняет достойный литературный регистр.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: ближнего своего, как самого себя
  rationale: Сохраняет библейскую формулу и подразумеваемый из первой части глагол «люби».
- source_word: πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι
  choice: И чего не желаешь, чтобы случилось с тобой
  rationale: Передаёт широкое значение γίνεσθαι («случаться, происходить»), не сужая его до действий, которые кто-либо намеренно совершает.
- source_word: καὶ σὺ ἄλλῳ μὴ ποίει
  choice: того и сам не делай другому
  rationale: Частица καί и явное местоимение σύ переданы сочетанием «и сам», подчёркивающим личную ответственность адресата.
theological_decisions:
- issue: Предписывающая сила формы ἀγαπήσεις
  choice: Передать повелительным «люби»
  alternative: Передать буквальным будущим «будешь любить»
  rationale: В контексте наставления будущее время функционирует как заповедь; «люби» ясно передаёт эту функцию без конфессиональной интерпретации.
- issue: Объём отрицательного золотого правила
  choice: Сохранить формулировку о том, что может «случиться» с человеком
  alternative: «Чего не хочешь, чтобы делали тебе»
  rationale: Вариант со «случилось» ближе к γίνεσθαι и не ограничивает смысл только намеренными действиями других людей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Синтаксический эллипсис после «во-вторых» сохранён естественным русским тире; вводное οὖν передано словом «итак» как связка с предшествующим изложением.
