  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: ru
  text: 'Ибо это та жертва, о которой Господь сказал: «Во всяком месте и во всякое время приносите Мне чистую жертву, потому что Я — великий Царь, — говорит Господь, — и имя Моё дивно среди народов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη … ἡ ῥηθεῖσα
  choice: это и есть та жертва, о которой сказал
  rationale: Обе формы стоят в женском роде и естественно соотносятся с θυσία («жертва») из непосредственного контекста; русская формулировка делает эту грамматическую связь ясной, не добавляя конфессиональной терминологии.
- source_word: ἐν παντὶ τόπῳ καὶ χρόνῳ
  choice: во всяком месте и во всякое время
  rationale: Передаёт оба обстоятельства с повторением, естественным для торжественной русской речи.
- source_word: προσφέρειν
  choice: приносите
  rationale: Греческий инфинитив внутри цитаты по смыслу выражает предписание; русский императив естественно передаёт обращённое к слушателям повеление.
- source_word: θυσίαν καθαράν
  choice: чистую жертву
  rationale: Прямое и традиционно понятное соответствие, сохраняющее культовый смысл θυσία и нравственно-ритуальную открытость καθαράν.
- source_word: θαυμαστόν
  choice: дивно
  rationale: Сохраняет значение «чудесно, достойно изумления» и возвышенный регистр, не подменяя его значением «велико».
- source_word: ἐν τοῖς ἔθνεσι
  choice: среди народов
  rationale: Передаёт множественное число ἔθνεσι без сужения смысла до язычников как религиозной категории.
theological_decisions:
- issue: К чему относится женский оборот αὕτη … ἡ ῥηθεῖσα
  choice: К жертве, упомянутой в предшествующем контексте
  alternative: «Ибо вот что было сказано Господом» — отнести оборот к изречению в целом
  rationale: Женский род αὕτη и ἡ ῥηθεῖσα грамматически указывает на существительное женского рода, наиболее естественно — θυσία. Перевод сохраняет авторское отождествление ранее названной жертвы с пророчески возвещённой жертвой, не уточняя сверх текста её богословскую природу.
- issue: Характер καθαράν
  choice: Оставить общее определение «чистую»
  alternative: Уточнить как «неосквернённую», «святую» или «бескровную»
  rationale: Греческое слово допускает культовые и нравственные оттенки; более узкое толкование необоснованно разрешило бы сохраняемую текстом смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пригодным для публичного чтения библейским регистром. Заглавные буквы в местоимениях, относящихся к Богу, сохранены как русская издательская конвенция; синтаксис цитаты сделан ясным без архаизмов.
