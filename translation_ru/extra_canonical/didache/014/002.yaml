revisions:
- from: А всякий, у кого есть раздор с ближним, пусть не собирается вместе с вами, пока они не примирятся, чтобы ваша жертва не была осквернена.
  to: А всякий, кто спорит со своим товарищем, пусть не собирается вместе с вами, пока они не примирятся друг с другом, чтобы ваша жертва не была осквернена.
  rationale: 'Исправлены два лексических выбора: ἑταῖρος передано как «товарищ», а ἀμφιβολία — через глагольный оборот «спорит». Уточнена взаимность примирения. Сохранены неопределённость характера собрания и прямой культовый термин «жертва».'
