source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: ru
  text: А всякий, кто спорит со своим товарищем, пусть не собирается вместе с вами, пока они не примирятся друг с другом, чтобы ваша жертва не была осквернена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: раздор
  rationale: В данном контексте слово обозначает разногласие или тяжбу между людьми; «раздор» естественно передаёт нарушенные отношения, требующие примирения.
- source_word: ἑταίρου
  choice: ближним
  rationale: Буквально — «товарищем, спутником»; «ближний» звучит естественно в нравственно-религиозном контексте и не сужает отношение до дружбы.
- source_word: συνελθέτω ὑμῖν
  choice: пусть не собирается вместе с вами
  rationale: Сохраняет буквальный образ совместного собрания общины, не уточняя сверх текста характер участия.
- source_word: διαλλαγῶσιν
  choice: они не примирятся
  rationale: Взаимная форма глагола указывает на восстановление отношений обеими сторонами.
- source_word: κοινωθῇ
  choice: не была осквернена
  rationale: В культовом контексте означает сделать нечистым или неприемлемым; «осквернена» сохраняет сакральную силу выражения.
- source_word: θυσία
  choice: жертва
  rationale: Прямой эквивалент греческого культового термина; не следует заранее истолковывать его как молитву, Евхаристию или иной конкретный обряд.
theological_decisions:
- issue: Значение «жертвы» в контексте собрания
  choice: Сохранено прямое слово «жертва» без поясняющего истолкования.
  alternative: Передать как «приношение», «Евхаристия» или «богослужение».
  rationale: Греческий текст употребляет θυσία и не снимает возможной богословской многозначности; конкретизация внесла бы в перевод позднейшее или конфессиональное толкование.
- issue: Условие допуска к общинному собранию
  choice: Формулировка передаёт запрет собираться с общиной до взаимного примирения.
  alternative: Истолковать как запрет только на участие в трапезе или причащении.
  rationale: Глагол συνελθεῖν сам по себе говорит о совместном собрании; более узкое ритуальное значение возможно из контекста, но не выражено прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, раннехристианским звучанием. Синтаксис остаётся близким к греческому, но читается естественно; подлинная неопределённость слова «жертва» сохранена.
