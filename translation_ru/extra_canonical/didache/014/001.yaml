source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: ru
  text: Но в день Господень, собравшись вместе, преломите хлеб и воздайте благодарение, прежде исповедав свои прегрешения, чтобы ваша жертва была чиста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Но в день Господень, после того как соберётесь вместе, преломите хлеб и воздайте благодарение, предварительно исповедав свои прегрешения, чтобы ваша жертва была чиста».'
    reason: Греческие аористные причастия допускают более явно выраженную временную последовательность; основной текст передаёт её естественной русской причастной конструкцией.
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  choice: Но в день Господень
  rationale: Выражение передаёт особый день, принадлежащий Господу; тавтологичность греческого оборота естественно сглажена по-русски без уточнения, которого нет в тексте.
- source_word: συναχθέντες
  choice: собравшись вместе
  rationale: Аористное причастие обозначает собрание общины, предшествующее дальнейшим действиям.
- source_word: κλάσατε ἄρτον
  choice: преломите хлеб
  rationale: Сохраняется традиционный и понятный библейский оборот, буквально отражающий греческое выражение.
- source_word: εὐχαριστήσατε
  choice: воздайте благодарение
  rationale: Глагол означает благодарить; формулировка сохраняет культовый контекст, не подменяя действие более поздним техническим названием обряда.
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  choice: прежде исповедав свои прегрешения
  rationale: Приставка προ- передаёт предварительность исповедания, а παραπτώματα — проступки или прегрешения.
- source_word: θυσία
  choice: жертва
  rationale: Прямой эквивалент сохраняет сакральный смысл и не решает, к какому именно аспекту собрания относится жертвенная терминология.
theological_decisions:
- issue: Смысл «жертвы» в связи с преломлением хлеба и благодарением
  choice: Сохранено общее слово «жертва»
  alternative: Уточнить как «евхаристическая жертва», «приношение» или «богослужение»
  rationale: Греческий текст не разъясняет точный референт θυσία; конкретизация внесла бы конфессиональное толкование.
- issue: Значение εὐχαριστήσατε
  choice: «воздайте благодарение» как действие
  alternative: «совершите Евхаристию» как название обряда
  rationale: Перевод сохраняет лексическое значение глагола и допускает литургический контекст, не превращая его безоговорочно в позднейший термин.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной сакральной лексикой. Синтаксис ясен для широкого читателя; традиционные выражения «день Господень», «преломить хлеб» и «жертва» сохранены благодаря их точности и узнаваемости.
