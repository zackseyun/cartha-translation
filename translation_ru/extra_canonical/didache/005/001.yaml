id: DID.5.1
reference: Didache 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: ru
  text: 'А путь смерти таков: прежде всего, он зол и полон проклятия[a]: убийства, прелюбодеяния, похоти, разврат, кражи, идолопоклонство, чародейство, колдовство с зельями, грабежи, лжесвидетельства, лицемерие, двоедушие, коварство, высокомерие, злоба, своеволие, алчность, сквернословие, ревнивая зависть, дерзость, надменность, хвастливость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полон проклятий»; возможно также понимание: «полон злословия».'
    reason: Греческое κατάρα может обозначать проклятие как состояние или результат, а также произнесение проклятий.
lexical_decisions:
- source_word: κατάρας μεστή
  choice: полон проклятия
  rationale: Сохраняет генитив единственного числа и образ пути, наполненного проклятием; по-русски сочетание звучит естественно и допускает как состояние проклятости, так и действие проклятия.
- source_word: ἐπιθυμίαι
  choice: похоти
  rationale: В данном перечне пороков слово обозначает дурные, прежде всего чувственные, желания; «похоти» передаёт отрицательную окраску без добавления узкой интерпретации.
- source_word: πορνεῖαι
  choice: разврат
  rationale: Широкое обозначение половой распущенности; не сужено до одного конкретного вида сексуального проступка.
- source_word: μαγεῖαι
  choice: чародейство
  rationale: Передаёт магические практики и позволяет сохранить отличие от следующего φαρμακεῖαι.
- source_word: φαρμακεῖαι
  choice: колдовство с зельями
  rationale: Отражает связь слова с применением снадобий или зелий в колдовских практиках и не смешивает его полностью с μαγεῖαι.
- source_word: διπλοκαρδία
  choice: двоедушие
  rationale: Ёмко передаёт буквальный образ «двойного сердца» и нравственную непостоянность или неискренность.
- source_word: αὐθάδεια
  choice: своеволие
  rationale: Передаёт самоугодную, упрямую установку действовать лишь по собственной воле.
- source_word: ζηλοτυπία
  choice: ревнивая зависть
  rationale: Сочетание сохраняет оттенки ревности и завистливого соперничества, тогда как одно русское «ревность» может восприниматься положительно.
- source_word: ὕψος
  choice: надменность
  rationale: В перечне пороков буквальная «высота» означает превознесение себя; выбор отличает её от ὑπερηφανία и ἀλαζονεία.
- source_word: ἀλαζονεία
  choice: хвастливость
  rationale: Передаёт показное самовозвышение и претенциозное хвастовство.
theological_decisions:
- issue: Смысл κατάρας в выражении κατάρας μεστή
  choice: полон проклятия
  alternative: полон проклятий / полон злословия
  rationale: Греческое существительное стоит в единственном числе и может указывать на проклятие как состояние или силу; основной текст не сводит его к человеческому злословию.
- issue: Различение μαγεῖαι и φαρμακεῖαι
  choice: чародейство, колдовство с зельями
  alternative: волшебство, колдовство
  rationale: Раздельный перевод сохраняет два пункта исходного перечня и историческую связь φαρμακεῖαι со снадобьями, не утверждая более узкой доктринальной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного наставления. Перечень сохранён как ритмичная последовательность существительных; близкие греческие пороки по возможности разведены по смыслу без конфессиональной конкретизации.
