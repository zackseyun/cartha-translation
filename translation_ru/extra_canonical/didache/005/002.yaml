id: DID.5.2
reference: Didache 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: ru
  text: гонители добра, ненавидящие истину, любящие ложь, не знающие награды за праведность, не держащиеся ни добра, ни справедливого суда, бодрствующие не ради добра, а ради зла; те, от кого далеки кротость и терпение, любящие суетное, добивающиеся воздаяния, не милующие бедняка, не сострадающие угнетённому[a], не знающие Того, Кто их сотворил, убийцы детей, губители Божьего создания, отворачивающиеся от нуждающегося, притесняющие страждущего, заступники богатых, беззаконные судьи бедных, грешные во всём. Дети, да будете вы избавлены от всего этого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «не скорбящие об угнетённом»; буквально это выражение может также пониматься как «не трудящиеся ради угнетённого».'
    reason: Глагол πονέω может обозначать как страдание или скорбь, так и тяжёлый труд; в этой конструкции и контексте вероятнее значение сочувственного страдания.
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: гонители добра
  rationale: Передаёт образ преследования и сохраняет обобщённость субстантивированного ἀγαθῶν, которое может относиться к добрым людям или ко всему доброму.
- source_word: μισθὸν δικαιοσύνης
  choice: награды за праведность
  rationale: Естественно передаёт генитивную конструкцию как награду, связанную с праведностью, без уточнения её характера.
- source_word: κολλώμενοι
  choice: держащиеся
  rationale: Современный и понятный эквивалент образа прочной приверженности; менее архаичен, чем «прилепляющиеся».
- source_word: ἀγρυπνοῦντες
  choice: бодрствующие
  rationale: Сохраняет буквальный образ неусыпной направленности и его риторический контраст между добром и злом.
- source_word: ἀνταπόδομα
  choice: воздаяния
  rationale: Сохраняет широкий смысл ответной платы, возмещения или отплаты, не сводя выражение только к денежному возврату.
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  choice: не сострадающие угнетённому
  rationale: В данной конструкции πονέω с ἐπί и дательным обозначает скорбь или боль о чужом бедствии; перевод также соответствует параллели с отсутствием милосердия.
- source_word: φθορεῖς πλάσματος Θεοῦ
  choice: губители Божьего создания
  rationale: φθορεῖς передано как активное причинение гибели, а πλάσμα — как сотворённое Богом создание, с сохранением образа Творца.
- source_word: πλουσίων παράκλητοι
  choice: заступники богатых
  rationale: Передаёт роль тех, кто выступает в пользу богатых, особенно в соседстве с неправедным судом над бедными.
- source_word: πανθαμάρτητοι
  choice: грешные во всём
  rationale: 'Передаёт усиленное значение редкого сложного слова: всецело или во всех отношениях грешные.'
theological_decisions:
- issue: Связь выражений «убийцы детей» и «губители Божьего создания»
  choice: Сохранены как два последовательных определения без поясняющего отождествления.
  alternative: Истолковать второе выражение как прямое разъяснение первого или добавить конкретную ссылку на аборт.
  rationale: Греческий текст ставит определения рядом, но не формулирует их точное логическое отношение; перевод не должен снимать эту неоднозначность или вводить конфессионально нагруженное уточнение.
- issue: Форма заключительного пожелания ῥυσθείητε
  choice: «да будете вы избавлены»
  alternative: Повелительное «избавьтесь» или молитвенное «пусть Бог избавит вас».
  rationale: Оптатив выражает пожелание; пассивная форма не называет действующего лица, поэтому оно не добавлено.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского нравственного наставления. Сохранена длинная ритмическая цепь причастных характеристик, но употреблены понятные современные слова; архаизмы сведены к минимуму. Обращение «Дети» и пожелательная конструкция в финале сохраняют наставнический тон оригинала.
