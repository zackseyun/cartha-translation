  yaml_path: translation/extra_canonical/didache/010/007.yaml
  text: But permit the prophets to give thanks as they desire.
translation:
  language: ru
  text: А пророкам позволяйте благодарить сколько хотят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  choice: А пророкам
  rationale: Частица δέ передана как «а», обозначая переход к особому правилу о пророках; προφήταις — обычным и контекстуально ясным словом «пророкам».
- source_word: ἐπιτρέπετε
  choice: позволяйте
  rationale: 'Форма настоящего времени повелительного наклонения естественно передаёт постоянное предписание: им следует предоставлять такую свободу.'
- source_word: εὐχαριστεῖν
  choice: благодарить
  rationale: Сохранено основное значение глагола — возносить благодарение; в контексте предшествующей благодарственной молитвы оно остаётся понятным без добавления отсутствующего в греческом тексте дополнения.
- source_word: ὅσα θέλουσιν
  choice: так, как они хотят
  rationale: Оборот допускает оттенок объёма или содержания («сколько/что хотят»), но по-русски применительно к молитве естественнее передать предоставленную свободу формулировкой «так, как они хотят», не ограничивая её лишь длительностью.
theological_decisions:
- issue: Степень свободы пророков при благодарении
  choice: так, как они хотят
  alternative: сколько они хотят
  rationale: Выбранная формулировка сохраняет общее разрешение пророкам благодарить не по фиксированной форме и не сводит ὅσα только к продолжительности молитвы.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Синтаксис сохраняет контрастный переход греческого δέ и характер постоянного наставления.
