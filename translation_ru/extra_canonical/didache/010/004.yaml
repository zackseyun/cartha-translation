source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ πάντων εὐχαριστοῦμέν σοι ὅτι δυνατός εἶ· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: ru
  text: Прежде всего благодарим Тебя за то, что Ты могуществен; Тебе слава вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: Прежде всего
  rationale: Естественно передаёт приоритет, выраженный греческим оборотом, не сводя его к буквальному пространственному или временному значению.
- source_word: εὐχαριστοῦμέν σοι
  choice: благодарим Тебя
  rationale: Прямая и современная передача глагола благодарения с адресатом в дательном падеже.
- source_word: δυνατός
  choice: могуществен
  rationale: Передаёт силу и могущество Бога; в данном хвалебном контексте звучит естественнее, чем «силён».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устоявшаяся краткая формула вечной хвалы, соответствующая буквальному образу «в века».
theological_decisions:
- issue: Основание благодарения в ὅτι δυνατός εἶ
  choice: за то, что Ты могуществен
  alternative: потому что Ты могуществен
  rationale: Обе передачи грамматически возможны; выбранный вариант естественно связывает содержание благодарения с Божьим могуществом, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы как уважительная издательская норма; архаизмы сведены к общепонятному литургическому «вовеки».
