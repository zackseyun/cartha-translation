lexical_decisions:
- source_word: Μετὰ δὲ τὸ ἐμπλησθῆναι
  choice: После же того, как вы насытитесь
  rationale: Конструкция с аористным пассивным инфинитивом обозначает момент после насыщения пищей. «Насытитесь» естественно передаёт смысл завершившейся трапезы и не создаёт возможной ассоциации с духовным «исполнением».
- source_word: οὕτως εὐχαριστήσατε
  choice: благодарите так
  rationale: Императив εὐχαριστήσατε здесь вводит последующую благодарственную молитву; «благодарите так» сохраняет прямоту предписания и связь с формулой, которая следует далее.
