id: DID.10.3
reference: Didache 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: ru
  text: 'Ты, Владыка Вседержитель,

    сотворил всё ради Своего имени,

    дал людям пищу и питьё для наслаждения,

    чтобы они благодарили Тебя;

    нам же Ты милостиво даровал духовную пищу и питьё

    и вечную жизнь через Своего Слугу.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Своего Отрока»; греческое слово может означать также «дитя, сын» или «слуга».'
    reason: Сохраняет подлинную неоднозначность παῖς и не навязывает единственное христологическое прочтение.
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: Владыка Вседержитель
  rationale: Передаёт прямое обращение и сочетает идею верховной власти с всемогуществом; сохраняет возвышенный молитвенный регистр.
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: ради Своего имени
  rationale: Формально и естественно сохраняет библейскую семантику имени как выражения личности, славы и власти Бога, не сужая смысл.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Обобщающее значение относится ко всему человечеству, а не только к мужчинам.
- source_word: εἰς ἀπόλαυσιν
  choice: для наслаждения
  rationale: Сохраняет положительное значение получения удовольствия и пользования дарами; более буквальное «для вкушения» чрезмерно сузило бы смысл.
- source_word: ἐχαρίσω
  choice: милостиво даровал
  rationale: Глагол выражает благодатное, щедрое дарование; сочетание передаёт этот оттенок без тяжеловесности.
- source_word: παιδός σου
  choice: Своего Слугу
  rationale: В данном раннехристианском контексте παῖς может означать «слуга» или «отрок/сын»; «Слуга» сохраняет вероятную ветхозаветную и христологическую формулу, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение παῖς в выражении διὰ τοῦ παιδός σου
  choice: через Своего Слугу
  alternative: через Своего Сына / Отрока
  rationale: Греческое παῖς допускает значения «слуга», «отрок», «дитя/сын». В раннехристианской молитвенной речи о Христе слово часто продолжает формулу Божьего Слуги; перевод «Сын» мог бы преждевременно устранить реальную лексическую неоднозначность.
- issue: Контраст между общими дарами творения и дарами общине
  choice: «дал людям…; нам же… даровал»
  alternative: Сгладить противопоставление без частицы «же»
  rationale: δέ подчёркивает различие между пищей и питьём, данными людям вообще, и духовной пищей, питьём и вечной жизнью, дарованными молящейся общине; перевод сохраняет напряжение, не объясняя природу духовных даров.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным строем. Заглавные буквы в местоимениях обращения к Богу и в слове «Слуга» использованы как уместная русская религиозно-литературная конвенция. Строковое членение следует синтаксическому и риторическому движению исходного текста.
