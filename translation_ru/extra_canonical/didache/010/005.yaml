  source_fidelity: 'Основной смысл передан верно: молитва о Церкви, избавлении от зла, усовершении в Божьей любви, собирании от четырёх ветров и доксология сохранены. Однако тире в черновике вместе с порядком слов («собери её от четырёх ветров — освящённую — в Своё Царство») фактически закрепляет εἰς τὴν σὴν Βασιλείαν как направление глагола «собери», тогда как греческий порядок допускает также — и в основном английском аудите отражает — характеристику Церкви как освящённой для Царства. Нужна нейтральная основная передача и сноска о возможной синтаксической связи.'
  naturalness: «Вспомни, Господи» и «сделай совершенной» естественны в современном литературном молитвенном регистре. «От четырёх ветров» сохраняет традиционный библейский образ и приемлемо в данном регистре. Исправленная пунктуация делает фразу яснее, не создавая неестественного вставного оборота между тире.
  terminology: «Церковь», «освящённую», «Царство», «сила и слава», «вовеки» уместны и согласованы с раннехристианским молитвенным регистром. Прописные буквы в местоимениях, относящихся к Богу, допустимы в целевом русском религиозном оформлении.
