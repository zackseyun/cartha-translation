id: DID.10.5
reference: Didache 10:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: ru
  text: Вспомни, Господи, Твою Церковь, чтобы избавить её от всякого зла и сделать совершенной в Твоей любви; собери её от четырёх ветров, освящённую для Твоего Царства[a], которое Ты приготовил для неё. Ибо Тебе принадлежат сила и слава вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…собери её, освящённую, от четырёх ветров в Твоё Царство…»'
    reason: Греческий оборот допускает связь «в Твоё Царство» как с «освящённую», так и с «собери».
lexical_decisions:
- source_word: Μνήσθητι
  choice: Вспомни
  rationale: Прямой императив от μιμνῄσκομαι; в молитвенном контексте означает действенно вспомнить и позаботиться, но перевод сохраняет образ исходного текста.
- source_word: ἐκκλησίας
  choice: Церковь
  rationale: Обозначает собранную общину верующих; «Церковь» естественно для раннехристианского молитвенного текста.
- source_word: ῥύσασθαι
  choice: избавь
  rationale: Передаёт спасение или освобождение от угрожающего зла; русский императив естественно раскрывает зависимый инфинитив цели.
- source_word: τελειῶσαι
  choice: сделай совершенной
  rationale: Сохраняет смысл доведения до полноты или совершенства, не сводя его лишь к нравственному улучшению.
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: от четырёх ветров
  rationale: Сохранён библейский образ собирания со всех сторон света.
- source_word: τὴν ἁγιασθεῖσαν
  choice: освящённую
  rationale: Женский страдательный причастный оборот относится к Церкви; обособление сохраняет его приложенное положение без добавления существительного.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое и понятное молитвенное соответствие формуле вечной хвалы.
theological_decisions:
- issue: Связь выражения τὴν ἁγιασθεῖσαν
  choice: Отнести «освящённую» к Церкви и обособить как приложение
  alternative: «собери освящённую Церковь» или «Церковь, освящённую для Твоего Царства»
  rationale: Согласование женского рода указывает на Церковь, однако синтаксическая связь εἰς τὴν σὴν Βασιλείαν может пониматься либо с «собери», либо с «освящённую». Пунктуация не устраняет эту напряжённость полностью.
- issue: Значение τελειῶσαι ἐν τῇ ἀγάπῃ σου
  choice: «сделай совершенной в Своей любви»
  alternative: «доведи до полноты в Своей любви»
  rationale: Выбран традиционно понятный эквивалент, сохраняющий идею совершенства и полноты без уточнения способа или результата сверх греческого текста.
- issue: Доксология ὅτι σοῦ ἐστιν
  choice: «Ибо Тебе принадлежат сила и слава»
  alternative: «Потому что Твои — сила и слава»
  rationale: Естественная русская формула точно передаёт принадлежность силы и славы Богу.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской молитвы. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозной норме. Двоеточие после «Церковь» позволяет естественно передать греческие инфинитивы как молитвенные императивы; тире обособляют причастие и сохраняют синтаксическую неоднозначность его связи с последующим направительным оборотом.
