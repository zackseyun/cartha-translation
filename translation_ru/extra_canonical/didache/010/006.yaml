id: DID.10.6
reference: Didache 10:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: ru
  text: 'Да придёт благодать,

    и да пройдёт этот мир.

    Осанна Сыну Давида!

    Кто свят, пусть приходит;

    кто не свят, пусть покается.

    Маранафа.[a] Аминь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Маранафа» — арамейская формула, которую можно понимать как «Господь наш, приди!»; при ином членении — «Господь наш пришёл».
    reason: Сохраняет реальную неоднозначность неразделённой арамейской формулы, переданной греческими буквами.
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Передаёт обычное раннехристианское значение «благодать», сохраняя возможную персонификацию и эсхатологический оттенок.
- source_word: παρελθέτω
  choice: да пройдёт
  rationale: Формула с «да» естественно и торжественно передаёт греческий императив третьего лица, не уточняя, идёт ли речь об исчезновении или уходе.
- source_word: Ὡσαννὰ
  choice: Осанна
  rationale: Сохраняется укоренившееся в русской библейской традиции литургическое заимствование.
- source_word: τῷ υἱῷ Δαβίδ
  choice: Сыну Давида
  rationale: Дательный падеж сохранён без добавления подразумеваемого глагола; мессианский титул передан с прописной буквы по нормам русской христианской письменности.
- source_word: ἅγιος
  choice: свят
  rationale: Буквенно и ёмко передаёт культово-нравственную характеристику, не подменяя её более узким «достоин» или «чист».
- source_word: μετανοείτω
  choice: пусть покается
  rationale: Передаёт призыв к покаянию и перемене сердца естественным русским глаголом.
- source_word: μαρανᾰθά
  choice: Маранафа
  rationale: Сохранена арамейская литургическая формула в традиционной русской форме, поскольку её членение и точный смысл допускают варианты.
theological_decisions:
- issue: К чему относится призыв «пусть приходит»
  choice: Сохранить без дополнения объекта или указания на участие в трапезе
  alternative: «Пусть подходит [к трапезе]» или «пусть приходит к Господу»
  rationale: Греческий текст не называет ни места, ни объекта; контекст евхаристической молитвы допускает вывод, но не требует включать его в перевод.
- issue: Смысл арамейского μαραναθά
  choice: Оставить «Маранафа» в основном тексте и пояснить варианты в сноске
  alternative: «Господь наш, приди!» или «Господь наш пришёл»
  rationale: Неразделённая транслитерация допускает по меньшей мере два традиционных прочтения; перевод одного из них молча снял бы подлинную неоднозначность.
- issue: Референт «благодати»
  choice: Не отождествлять явно с Христом, Церковью или эсхатологическим даром
  alternative: «Да придёт Христос»
  rationale: χάρις буквально означает «благодать»; возможная персонификация сохраняется без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с кратким литургическим ритмом. Формы «да придёт» и «да пройдёт» сохраняют молитвенную торжественность, оставаясь понятными; параллелизм и строковое членение оригинала сохранены.
