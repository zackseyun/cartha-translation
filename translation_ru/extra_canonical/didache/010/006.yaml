  source_fidelity: 'Перевод точно передаёт последовательность и синтаксическую структуру греческого текста: молитвенные повелительные формы («Да придёт… и да пройдёт…»), дательный титул «Сыну Давида», а также два условных призыва. «Кто не свят» естественно раскрывает эллипсис εἴ τις οὐκ ἔστιν из непосредственно предшествующего «свят», не меняя смысла. «Маранафа» оставлена транслитерированной, поэтому спорное арамейское членение не предрешено.'
  naturalness: Текст звучит как современный литературный русский с уместным кратким литургическим ритмом. «Да придёт» и «да пройдёт» несколько торжественны, но ясны и соответствуют жанру. Параллелизм «Кто свят…; кто не свят…» хорошо читается.
  terminology: «Благодать», «Осанна», «Сын Давида», «покается» и «Аминь» — устоявшиеся и точные русские соответствия. Прописная буква в титуле «Сыну Давида» оправдана его традиционным мессианским употреблением в данном контексте и не вносит дополнительного доктринального утверждения.
