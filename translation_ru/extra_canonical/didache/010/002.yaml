    rationale: 'Греческое οὗ — относительное местоимение среднего рода в родительном падеже, относящееся к «имени», а κατεσκήνωσας — каузативное действие Бога: Он поселил имя в сердцах. Русская конструкция с дательным падежом меняет эту связь.'
  - severity: medium
    issue: Множественное число «которые Ты открыл»
    rationale: Греческое ἧς имеет форму женского рода единственного числа и непосредственно согласуется с ἀθανασίας («бессмертия»). Множественное число в переводе снимает исходную грамматическую конкретность и меняет объём относительного определения.
