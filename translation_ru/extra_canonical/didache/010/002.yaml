source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: ru
  text: 'Благодарим Тебя, святой Отец,


    за Твоё святое имя,


    которое Ты поселил в наших сердцах,


    и за знание, веру и бессмертие,


    которое Ты открыл нам через Иисуса, Твоего слугу.


    Тебе слава вовеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: Благодарим
  rationale: Прямо передаёт настоящее время и молитвенный характер греческого глагола.
- source_word: κατεσκήνωσας
  choice: дал обитать
  rationale: Сохраняет образ вселения или пребывания, не перегружая русский текст буквальным «поселил в шатре».
- source_word: γνώσεως
  choice: знание
  rationale: Нейтральный и контекстуально естественный эквивалент, сохраняющий широту значения.
- source_word: ἀθανασίας
  choice: бессмертие
  rationale: Точный эквивалент существительного, без замены на более интерпретирующее «вечная жизнь».
- source_word: παιδός
  choice: Слугу
  rationale: В данном раннехристианском молитвенном контексте παῖς может означать «слуга» или «отрок»; «Слуга» естественно передаёт библейский титульный оттенок и сохраняет отличие от обычного слова «сын».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое, краткое и достойное молитвенное выражение для буквального «во веки».
theological_decisions:
- issue: Значение παῖς применительно к Иисусу
  choice: Слуга
  alternative: Отрок / Сын
  rationale: Греческое παῖς действительно допускает значения «слуга», «отрок» и «дитя», однако здесь вероятен библейский титул Божьего Слуги. Перевод «Сын» устранил бы лексическую неоднозначность и смешал бы παῖς с υἱός.
- issue: Связь относительного местоимения ἧς с перечислением
  choice: которые Ты открыл
  alternative: которое Ты открыл
  rationale: 'Форма ἧς грамматически согласована с ближайшим существительным ἀθανασίας, но по смыслу относительное предложение естественно относится ко всему ряду: знанию, вере и бессмертию. Множественное число в русском делает эту связь ясной без изменения содержания.'
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Сохранены параллелизм и строковая структура оригинала; местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозной традиции.
