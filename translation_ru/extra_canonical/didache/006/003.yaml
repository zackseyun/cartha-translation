id: DID.6.3
reference: Didache 6:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: ru
  text: Что же касается пищи, понеси, сколько можешь; но особенно остерегайся идоложертвенной пищи, потому что это — служение мёртвым богам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώσεως
  choice: пищи
  rationale: Передаёт общее значение «еда, пища» и сохраняет связь с последующим εἰδωλόθυτον.
- source_word: ὃ δύνασαι βάστασον
  choice: понеси, сколько можешь
  rationale: Сохраняет образ βάστασον — «нести, брать на себя» — и его вероятную связь с предшествующим наставлением о посильном принятии пищевых требований, не устраняя краткость и некоторую неоднозначность оригинала.
- source_word: εἰδωλοθύτου
  choice: идоложертвенной пищи
  rationale: Естественный и точный русский эквивалент для пищи, принесённой в жертву идолам; существительное «пища» добавлено из непосредственного контекста βρώσεως.
- source_word: λίαν πρόσεχε
  choice: особенно остерегайся
  rationale: 'Передаёт усиленное предостережение: λίαν усиливает πρόσεχε, а «остерегайся» естественно сочетается с предметом опасения.'
- source_word: λατρεία
  choice: служение
  rationale: Сохраняет культово-религиозный смысл слова без ненужного сужения до одного конкретного обряда.
- source_word: θεῶν νεκρῶν
  choice: мёртвым богам
  rationale: Буквально и естественно передаёт резкую полемическую характеристику оригинала.
theological_decisions:
- issue: Объём требования о пище
  choice: Сохранить образ посильного несения требования
  alternative: «Соблюдай, что можешь» или «ешь, что можешь»
  rationale: Греческое βάστασον буквально означает «понеси» и, вероятно, отсылает к «ярму Господа» в 6:2. Перевод не превращает фразу ни в прямое разрешение есть любую пищу, ни в исчерпывающее предписание пищевого аскетизма.
- issue: Характер связи с идоложертвенной пищей
  choice: «потому что это — служение мёртвым богам»
  alternative: «потому что употребление её есть поклонение мёртвым богам»
  rationale: Сохраняется грамматически сжатое отождествление оригинала без добавления толкования о том, какой именно поступок назван служением.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис остаётся кратким и увещательным; архаизм «идоложертвенная» сохранён как устоявшийся и точный религиозный термин. Формулировка «понеси, сколько можешь» намеренно сохраняет метафору и напряжение греческого текста.
