id: DID.6.2
reference: Didache 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: ru
  text: Ведь если ты можешь нести всё иго Господа, то будешь совершенен; а если не можешь, делай то, что можешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: нести
  rationale: Передаёт образ продолжительного несения ига естественным русским выражением, сохраняя метафору оригинала.
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: всё иго Господа
  rationale: Сохраняет полноту (ὅλον), традиционный библейский образ «ига» и неоднозначность родительного оборота «Господа».
- source_word: τέλειος
  choice: совершенен
  rationale: Прямо передаёт значение полноты и зрелости, не сводя его лишь к нравственной безупречности.
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: делай то, что можешь
  rationale: Естественная современная формулировка, точно сохраняющая призыв исполнять посильное.
theological_decisions:
- issue: Смысл «всего ига Господа»
  choice: Сохранён без поясняющего уточнения
  alternative: Конкретизировать как весь Закон, все заповеди или определённую аскетическую практику
  rationale: Греческий текст сам не уточняет объём образа; конкретизация устранила бы подлинную смысловую открытость.
- issue: Значение τέλειος
  choice: «совершенен»
  alternative: «достигнешь полноты» или «будешь зрелым»
  rationale: Традиционный и формально близкий вариант сохраняет богословское напряжение между совершенством и посильным исполнением.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления; сохранено обращение во втором лице единственного числа и параллельная условная конструкция оригинала.
