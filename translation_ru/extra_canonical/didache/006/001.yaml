source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: ru
  text: Смотри, чтобы никто не сбил тебя с этого пути учения, ибо он учит тебя помимо Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  choice: Смотри, чтобы никто не увёл тебя
  rationale: Императив ὅρα с μή и сослагательным выражает предостережение. «Не увёл» естественно передаёт идею отклонения с пути и поддерживает последующий образ дороги.
- source_word: ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: с этого пути учения
  rationale: Сохранены образ «пути» и зависимое определение «учения» без добавочного истолкования.
- source_word: ἐπεὶ
  choice: ведь
  rationale: Передаёт основание предостережения в естественной современной русской связке.
- source_word: παρεκτὸς Θεοῦ
  choice: в стороне от Бога
  rationale: Сохраняет пространственно-реляционный оттенок παρεκτός («вне, отдельно от») и не сужает выражение до конфессионально нагруженного «безбожно».
- source_word: σε διδάσκει
  choice: учит тебя
  rationale: Прямо и без избыточного уточнения передаёт личное дополнение и настоящее время.
theological_decisions:
- issue: Смысл выражения παρεκτὸς Θεοῦ
  choice: в стороне от Бога
  alternative: не от Бога / вопреки Богу
  rationale: Греческое выражение допускает оттенки отделённости от Бога и несогласия с Ним. Выбранная формулировка сохраняет напряжение и не решает однозначно, идёт ли речь прежде всего об источнике учения или о его противостоянии Богу.
translation_notes:
  register: Современный литературный русский язык; обращение во втором лице единственного числа сохранено. Тон краткий, наставительный и предостерегающий. Местоименное «такой человек» проясняет подразумеваемого субъекта διδάσκει, не меняя смысла.
