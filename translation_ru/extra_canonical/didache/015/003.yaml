source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: ru
  text: Обличайте друг друга не в гневе, а мирно, как сказано у вас в Евангелии. И с тем, кто согрешает против другого[a], пусть никто не разговаривает, и пусть он ничего не слышит от вас, пока не покается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто поступает неправильно по отношению к другому»; буквально глагол может означать «промахиваться, уклоняться от верного пути».'
    reason: Сохраняет смысловой диапазон ἀστοχέω и не сводит неоднозначное слово исключительно к техническому термину «грешить».
lexical_decisions:
- source_word: Ἐλέγχετε
  choice: Обличайте
  rationale: Передаёт наставление указывать на проступок и призывать к исправлению; соответствует контексту общинного увещания.
- source_word: ἐν εἰρήνῃ
  choice: с миром
  rationale: Естественная по-русски формулировка, сохраняющая противопоставление гневу и идею мирного образа действий.
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: кто согрешает против другого
  rationale: ἀστοχέω буквально связано с промахом или уклонением, а сочетание с κατὰ τοῦ ἑτέρου указывает на проступок против другого человека; «согрешает» уместно в нравственно-религиозном контексте, при этом буквальная образность отмечена в сноске.
- source_word: μηδὲ παρ' ὑμῶν ἀκουέτω
  choice: и пусть никто из вас его не слушает
  rationale: Передаёт запрет давать провинившемуся возможность быть услышанным общиной; активная русская конструкция яснее буквального пассива и сохраняет практический смысл.
- source_word: μετανοήσῃ
  choice: не покается
  rationale: Стандартно и точно передаёт перемену ума и поведения в контексте признания проступка.
theological_decisions:
- issue: Характер проступка в ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: согрешает против другого
  alternative: поступает неправильно по отношению к другому / причиняет зло другому
  rationale: Выбранный вариант сохраняет нравственно-религиозную силу текста, не уточняя вид проступка; менее конфессионально окрашенная возможность отражена в сноске.
- issue: Смысл μηδὲ παρ' ὑμῶν ἀκουέτω
  choice: пусть никто из вас его не слушает
  alternative: пусть он не будет услышан вами
  rationale: Греческая форма допускает буквальное понимание «пусть не будет услышан», однако по-русски активная конструкция естественнее и не добавляет содержания сверх общинного отказа вступать с ним в общение до покаяния.
- issue: Ссылка на Евангелие
  choice: как сказано у вас в Евангелии
  alternative: как вы имеете в Евангелии
  rationale: Добавление «сказано» естественно раскрывает эллиптическое ὡς ἔχετε ἐν τῷ εὐαγγελίῳ и не устанавливает конкретный канонический текст или место.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Императивы переданы ясно и прямо; синтаксис слегка разгружен делением на два предложения. Формулировки избегают архаизмов и конфессионально специфической терминологии.
