revisions:
- from: Обличайте друг друга не в гневе, а с миром, как сказано у вас в Евангелии. И с тем, кто согрешает против другого[a], пусть никто не разговаривает, и пусть никто из вас его не слушает, пока он не покается.
  to: Обличайте друг друга не в гневе, а мирно, как сказано у вас в Евангелии. И с тем, кто согрешает против другого[a], пусть никто не разговаривает, и пусть он ничего не слышит от вас, пока не покается.
  rationale: 'Исправлен смысл μηδὲ παρ'' ὑμῶν ἀκουέτω: запрет относится к тому, что проступивший может слышать от общины, а не к тому, слушает ли его община. «Мирно» делает русскую формулировку более естественной без смыслового сдвига. Сноска и основной перевод ἀστοχοῦντι сохранены, поскольку контекст допускает «согрешает против другого», но лексема не является строго техническим термином.'
