    issue: Неверно распределены участники действия в «пусть никто из вас его не слушает».
    rationale: 'παρ'' ὑμῶν относится к источнику того, что слышит провинившийся: «пусть он не слышит [ничего] от вас». Русская формулировка меняет смысл на запрет общине слушать его.'
  - severity: low
