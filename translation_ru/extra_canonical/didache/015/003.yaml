  source_fidelity: 'Нужна правка второй части заключительного запрета. μηδὲ παρ'' ὑμῶν ἀκουέτω означает, что провинившийся не должен слышать ничего «от вас» (ср. традиционное понимание: «пусть он не слышит от вас»), а не что члены общины не должны слушать его. Остальная передача в целом точно отражает греческий текст.'
  naturalness: Текст в целом литературен и ясен. «Не в гневе, а мирно» естественнее современного «не в гневе, а с миром» и сохраняет противопоставление τρόпа действия.
  terminology: «Обличайте», «согрешает против другого» и «покается» уместны для наставительного раннехристианского контекста. Сноска об ἀστοχέω полезно сохраняет нетехнический смысловой диапазон слова, не отменяя основного перевода в данном контексте.
  issues:
