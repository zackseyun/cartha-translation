  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: ru
  text: Поэтому не пренебрегайте ими, ведь они — те, кого вы почитаете вместе с пророками и учителями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερίδητε
  choice: пренебрегайте
  rationale: Глагол означает смотреть свысока, не принимать во внимание или пренебрегать; «не пренебрегайте» естественно и точно передаёт запрет в данном контексте.
- source_word: οἱ τετιμημένοι ὑμῶν
  choice: именно их вы почитаете
  rationale: Перфектное страдательное причастие передаёт состояние удостоенных чести. Русская активная конструкция естественно выражает смысл при сохранении связи с ὑμῶν.
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: наряду с пророками и учителями
  rationale: Здесь μετά с родительным указывает на совместность и равное включение в круг почитаемых; «наряду с» передаёт это яснее, чем буквальное «вместе с».
theological_decisions:
- issue: Статус ранее упомянутых служителей по отношению к пророкам и учителям
  choice: «наряду с пророками и учителями»
  alternative: «вместе с пророками и учителями»
  rationale: Формулировка сохраняет утверждение текста о совместном почитании, не вводя дополнительной церковной иерархии или полного тождества служений.
translation_notes:
  register: Современный литературный русский язык; краткая, увещательная и достойная формулировка. Указательное αὐτοί передано усилением «именно их».
