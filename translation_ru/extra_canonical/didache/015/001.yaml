source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: ru
  text: Итак, изберите себе епископов[a] и диаконов, достойных Господа, — людей кротких, не корыстолюбивых, правдивых и испытанных, ведь и они совершают для вас служение пророков и учителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надзирателей». Греческое слово, переведённое как «епископы», означает «надзирающие» или «надзиратели».'
    reason: Поясняет исходное значение ἐπισκόπους и сохраняет привязку примечания к отмеченному слову, не изменяя без отметки перевод глагола Χειροτονήσατε.
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: изберите
  rationale: Глагол первоначально связан с избранием поднятием рук и здесь означает избрать или назначить на служение. «Изберите» естественно передаёт участие общины, не уточняя процедуру сверх текста.
- source_word: ἐπισκόπους
  choice: епископов
  rationale: Сохранён укоренившийся раннехристианский термин; примечание поясняет его исходное значение, не навязывая более позднюю модель церковного устройства.
- source_word: ἀφιλαργύρους
  choice: не корыстолюбивых
  rationale: Передаёт отсутствие любви к деньгам и наживе естественным современным словом.
- source_word: δεδοκιμασμένους
  choice: испытанных
  rationale: Сохраняет смысл людей, прошедших проверку и доказавших свою пригодность.
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  choice: совершают ... служение
  rationale: Естественно передаёт греческую конструкцию с однокоренными глаголом и существительным без неуклюжего повтора в русском.
theological_decisions:
- issue: Соотношение раннехристианских епископов, диаконов, пророков и учителей
  choice: Сохранить названия служений и формулировку «служение пророков и учителей»
  alternative: Истолковать епископов как позднейшую иерархическую должность или сказать, что они заменяют пророков и учителей
  rationale: Текст утверждает общность выполняемого служения, но прямо не определяет ни позднейшую церковную структуру, ни полное замещение одних служителей другими.
- issue: Способ поставления служителей
  choice: «изберите» с примечанием о возможном значении «поставьте»
  alternative: Однозначно перевести «назначьте» или подробно указать голосование поднятием рук
  rationale: Греческий глагол допускает смысл избрания и поставления; конкретная процедура в данном месте не описана.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис сделан ясным для широкого читателя; традиционные термины «епископы» и «диаконы» сохранены, а потенциально анахроничное понимание первого термина смягчено примечанием.
