- from: А что касается ваших молитв, милостыни и всех ваших дел[a], совершайте их так, как это изложено в Евангелии нашего Господа.
  to: А что касается ваших молитв, милостыни и всех ваших дел[a], совершайте их так, как вы знаете из Евангелия нашего Господа.
  rationale: Заменено лишь «как это изложено» на «как вы знаете из», чтобы не превращать неопределённую отсылку к имеющемуся у адресатов евангельскому наставлению в утверждение о письменном изложении. Смысл повеления, тематическое выделение перечисления и существующая сноска сохранены.
