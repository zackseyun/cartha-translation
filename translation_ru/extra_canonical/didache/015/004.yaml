review_pass:
  verdict: revise
  source_fidelity: «Как это изложено» необоснованно конкретизирует ἔχετε как письменное изложение. Греческое выражение буквально означает «как вы имеете [это] в Евангелии нашего Господа» и может относиться к известному общине евангельскому наставлению, не определяя способ его передачи. «Как вы знаете из Евангелия» передаёт эту отсылку естественным современным русским языком, не утверждая, что речь непременно о письменном тексте. «Милостыня» точно передаёт ἐλεημοσύνας; «дела» допустимо передаёт πράξεις.
  naturalness: Фронтирующая конструкция «А что касается...» естественна в современном литературном русском и сохраняет тематическое выделение. «Совершайте их так» грамматически и стилистически приемлемо для общего глагола при молитвах, милостыне и делах. Исправленная заключительная формула звучит естественно.
  terminology: «Молитвы», «милостыня», «Евангелие нашего Господа» уместны по регистру и не вносят конфессионального истолкования. Заглавное «Евангелие» допустимо в данном религиозном контексте; перевод не отождествляет его с какой-либо одной книгой.
  issues:
