    issue: «Как это изложено»
    rationale: Формулировка представляет евангельское содержание как изложенный текст и тем самым сужает значение ὡς ἔχετε ἐν τῷ εὐαγγελίῳ. Исходник и английский audit trail сохраняют более широкое «как вы имеете [это] в Евангелии».
