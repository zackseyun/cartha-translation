source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: ru
  text: А что касается ваших молитв, милостыни и всех ваших дел[a], совершайте их так, как вы знаете из Евангелия нашего Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А ваши молитвы, милостыню и все ваши дела совершайте так».'
    reason: Сохраняет возможность более формально передать вынесенные вперёд дополнения без пояснительной конструкции «что касается».
lexical_decisions:
- source_word: Τὰς δὲ
  choice: А что касается
  rationale: Передаёт δέ и вынесение дополнений в начало фразы, сохраняя тематическое выделение без неестественного для русского порядка слов.
- source_word: ἐλεημοσύνας
  choice: милостыни
  rationale: Здесь слово обозначает конкретную благотворительную помощь нуждающимся, а не милосердие вообще.
- source_word: πάσας τὰς πράξεις
  choice: всех ваших дел
  rationale: πράξεις означает поступки или дела; добавление «ваших» естественно по-русски и соответствует обращению к читателям, хотя в греческом ὑμῶν непосредственно стоит при «молитвах».
- source_word: οὕτω ποιήσατε
  choice: совершайте их так
  rationale: Передаёт повелительное значение аориста и соотносит глагол со всем перечислением.
- source_word: ὡς ἔχετε
  choice: как это изложено
  rationale: Буквальное «как вы имеете» по-русски неестественно; выбранная формулировка передаёт отсылку к имеющемуся у общины евангельскому наставлению, не уточняя его письменную или устную форму.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν
  choice: в Евангелии нашего Господа
  rationale: Сохраняет традиционный и понятный русский эквивалент, не решая, имеется ли в виду текст Евангелия или евангельское учение Господа.
theological_decisions:
- issue: Значение «Евангелия нашего Господа»
  choice: Сохранена широкая формулировка «в Евангелии нашего Господа»
  alternative: «в евангельском учении нашего Господа» или указание на конкретную книгу
  rationale: Греческий текст не устанавливает однозначно, идёт ли речь о письменном тексте или о принятом учении Иисуса; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Милостыня» сохранена как конкретное обозначение помощи нуждающимся. Заглавная буква в слове «Евангелие» соответствует устойчивому русскому религиозному употреблению, при этом перевод не отождествляет выражение с какой-либо одной канонической книгой.
