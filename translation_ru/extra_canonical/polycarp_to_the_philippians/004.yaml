    которая есть мать всех нас; за нею следует надежда, а впереди идёт любовь — любовь к Богу, Христу и нашему ближнему. Ибо если кто занимается этим[b], тот исполнил заповедь праведности, потому что имеющий любовь далёк от всякого греха.'
