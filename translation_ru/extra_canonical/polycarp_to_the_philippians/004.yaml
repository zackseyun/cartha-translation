base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: ru
  text: '**Поликарп — филиппийцам, 3**


    Братья, я пишу вам это о праведности не потому, что сам возложил на себя такое поручение, а потому, что вы попросили меня.


    Ведь ни я, ни кто-либо подобный мне не способен сравниться с мудростью блаженного и славного Павла. Когда он был среди вас, то обстоятельно и твёрдо, лицом к лицу с людьми того времени, возвещал слово истины. А находясь вдали, он написал вам послание[a]. Внимательно вникая в него, вы сможете укрепляться в данной вам вере,


    которая есть мать всех нас; за ней следует надежда, а впереди идёт любовь — любовь к Богу и Христу и к нашему ближнему. Кто живёт этим[b], тот исполнил заповедь праведности, потому что имеющий любовь далёк от всякого греха.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по предоставленному английскому свидетельству: «письмо» или «послание» — в единственном числе. Прямая сверка с греческой и латинской рукописной традицией ещё требуется.'
    reason: Сохраняет число исходного свидетельства и честно обозначает ограниченность текущей источниковой базы.
  - marker: b
    text: То есть названными выше верой, надеждой и любовью; выражение может также означать «пребывает в этом» или «занят этим».
    reason: Местоименная отсылка и характер вовлечённости допускают более одного оттенка; сноска сохраняет эту неоднозначность.
lexical_decisions:
- source_word: righteousness (English witness; Greek/Latin review pending)
  choice: праведность
  rationale: Сохраняет нравственно-богословский смысл и связь с последующим выражением «заповедь праведности», не сужая значение до одной лишь справедливости.
- source_word: follow the wisdom
  choice: сравниться с мудростью
  rationale: В данном контексте речь идёт не о послушании мудрости Павла, а о способности Поликарпа достичь его уровня; формулировка естественна по-русски и сохраняет смиренный тон автора.
- source_word: the word concerning truth
  choice: слово истины
  rationale: Краткое и естественное библейское выражение, передающее возвещение истинного учения без лишнего истолкования.
- source_word: be built up unto the faith
  choice: укрепляться в данной вам вере
  rationale: Передаёт метафору духовного созидания понятным современным языком, сохраняя веру как направленность и сферу укрепления.
- source_word: mother of us all
  choice: мать всех нас
  rationale: Метафора сохранена буквально, несмотря на её богословскую напряжённость и возможность разных толкований.
- source_word: hope follows after and love goes before
  choice: за ней следует надежда, а впереди идёт любовь
  rationale: Сохраняет пространственно-процессуальную образность и последовательность исходного свидетельства, не превращая её в систематическую иерархию добродетелей.
- source_word: be occupied with these
  choice: живёт этим
  rationale: Естественная русская передача постоянной вовлечённости в названные веру, надежду и любовь; неопределённость местоимения отмечена в сноске.
theological_decisions:
- issue: Вера названа «матерью всех нас»
  choice: Сохранить метафору без поясняющей подстановки.
  alternative: Истолковать «мать» как Церковь, любовь или совокупность христианских добродетелей.
  rationale: Предоставленное свидетельство прямо относит относительное местоимение к вере. Без завершённой сверки греческой и латинской традиции нельзя молча заменять этот смысл конфессиональным толкованием.
- issue: Соотношение веры, надежды и любви
  choice: Сохранить формулы «следует» и «идёт впереди».
  alternative: Передать как ранжирование добродетелей или как хронологический порядок спасения.
  rationale: Текст использует образ движения, но не объясняет его догматически; перевод не должен устранять эту напряжённость.
- issue: Любовь и удалённость от всякого греха
  choice: «имеющий любовь далёк от всякого греха».
  alternative: Ослабить до «старается избегать греха» или усилить до утверждения безгрешности.
  rationale: Формулировка сохраняет нравственный тезис автора, не превращая его ни в простое пожелание, ни в разработанное учение о безгрешном совершенстве.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским тоном; архаизмы и тяжёлые кальки устранены. Обращение «Братья» сохраняет форму предоставленного свидетельства. Поскольку древнегреческий и латинский текст для прямой проверки не предоставлен, проект остаётся предварительным и основан на указанном публично-доступном английском свидетельстве с консультацией английского POB.
