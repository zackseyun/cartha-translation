base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: ru
  text: 'Но любовь к деньгам — начало всех бед. Поэтому, зная, что мы ничего не принесли в мир и ничего не можем вынести из него, облечёмся в доспехи праведности и прежде всего научим самих себя жить по заповеди Господа.


    Затем будем учить и наших жён жить в дарованной им вере, в любви и чистоте, любить своих мужей со всей искренностью, относиться ко всем людям с одинаковой любовью и во всяком целомудрии, а детей воспитывать в страхе Божьем.


    Нашим вдовам следует быть рассудительными в том, что касается веры в Господа, непрестанно ходатайствовать за всех, воздерживаться от всякой клеветы, злословия, лжесвидетельства, любви к деньгам и всякого зла. Пусть они знают, что они — жертвенник Божий[a], что все жертвы тщательно исследуются и что от Него не укрывается ничто: ни их мысли, ни намерения, ни что-либо из сокровенного в сердце.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ вдов как «жертвенника Божьего» сохранён буквально. Вероятно, он связан с их непрестанными молитвами и посвящённостью Богу, однако текст прямо не объясняет метафору.
    reason: Метафора богословски насыщенна и может быть непонятна без краткого пояснения; важно не превращать предполагаемое толкование в основной текст.
lexical_decisions:
- source_word: love of money
  choice: любовь к деньгам
  rationale: Прямое и понятное современному читателю выражение, сохраняющее нравственный акцент на привязанности, а не на самих деньгах.
- source_word: armor of righteousness
  choice: доспехи праведности
  rationale: Сохраняет военный образ исходного свидетельства и звучит естественно в возвышенной современной прозе.
- source_word: walk in the commandment
  choice: жить по заповеди
  rationale: Идиома «ходить в заповеди» в современном русском неестественна; «жить по заповеди» точно передаёт образ постоянного образа жизни.
- source_word: in all truth
  choice: со всей искренностью
  rationale: В данном контексте речь, вероятно, о подлинности и верности отношения; буквальное «во всей истине» по-русски неясно.
- source_word: sober-minded
  choice: рассудительными
  rationale: Передаёт самообладание и здравость суждения без неоправданного сведения смысла к воздержанию от алкоголя.
- source_word: making intercession
  choice: ходатайствовать
  rationale: Сохраняет молитвенный смысл просьбы за других и традиционную, но понятную церковную лексику.
- source_word: God's altar
  choice: жертвенник Божий
  rationale: «Жертвенник» точнее обозначает место принесения жертв и поддерживает последующее упоминание жертв.
theological_decisions:
- issue: Фраза о вдовах как Божьем жертвеннике
  choice: сохранить прямую метафору без догматического истолкования
  alternative: передать как «служат у Божьего жертвенника» или разъяснить, что их молитвы являются жертвами
  rationale: Свидетельство прямо отождествляет вдов с жертвенником; толкование метафоры не следует вносить в основной текст.
- issue: Объект веры в выражении «faith of the Lord»
  choice: «вера в Господа»
  alternative: «вера Господа» или «верность Господу»
  rationale: В данном контексте наиболее естественно понимание веры, направленной на Господа, однако исходная форма доступного английского свидетельства допускает иную связь; поэтому решение остаётся предварительным до сверки с греческой и латинской традицией.
- issue: Переход к наставлению жён
  choice: «будем учить и наших жён»
  alternative: понимать конструкцию как прямое наставление самим жёнам без посредничества мужей
  rationale: Синтаксис предоставленного свидетельства продолжает призыв «научим», но проверка исходной традиции может уточнить адресацию и грамматическую связь.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным, раннехристианским звучанием. Архаические обороты устранены, но ключевые библейские образы сохранены. Перевод предварительный: предоставлен англоязычный публичнодоступный свидетельский текст, тогда как непосредственная сверка с греческой и латинской рукописной традицией ещё не выполнена.'
