base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: ru
  text: 'И пресвитеры также должны быть сострадательны и милосердны ко всем: возвращать заблудившихся овец, навещать всех немощных, не оставлять без попечения ни вдову, ни сироту, ни бедного, но всегда заботиться о том, что достойно перед Богом и людьми. Им следует воздерживаться от всякого гнева, лицеприятия и неправедного суда, быть далёкими от всякого сребролюбия, не спешить верить обвинению против кого-либо и не быть поспешными в суде, зная, что все мы — должники греха.[a]


    Итак, если мы просим Господа простить нас, то и сами должны прощать, ибо мы — перед очами нашего Господа и Бога; всем нам предстоит явиться пред судилище Христово, и каждый даст отчёт о себе.


    Поэтому будем служить Ему со страхом и всяким благоговением, как заповедал Он Сам, а также апостолы, благовествовавшие нам, и пророки, заранее возвестившие пришествие нашего Господа. Будем ревностны в добром, уклоняясь от соблазнов, от лжебратьев и от тех, кто лицемерно носит имя Господа и вводит неразумных людей в заблуждение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по представленному свидетельству: «должники греха». Выражение может указывать на общую греховную виновность или на долг, возникший вследствие греха; неоднозначность сохранена.'
    reason: Необычное выражение допускает несколько близких толкований и не должно быть незаметно упрощено.
lexical_decisions:
- source_word: presbyters
  choice: пресвитеры
  rationale: Сохраняет раннехристианский термин служения и не отождествляет его без пояснения с современным общеупотребительным словом «старейшины».
- source_word: all the infirm
  choice: всех немощных
  rationale: Передаёт более широкий смысл, чем только «больные», не исключая слабых и страждущих.
- source_word: respect of persons
  choice: лицеприятие
  rationale: Устоявшийся и точный библейский термин для пристрастного отношения по положению или личности.
- source_word: judgment-seat of Christ
  choice: судилище Христово
  rationale: Сохраняет традиционный судебный образ и явную христологическую отсылку.
- source_word: offenses
  choice: соблазны
  rationale: Передаёт вероятный нравственно-религиозный смысл препятствий, ведущих к падению, не сводя выражение к личным обидам.
- source_word: bear the name of the Lord
  choice: носит имя Господа
  rationale: Сохраняет образ публичного исповедания принадлежности Господу, соединённого здесь с лицемерием.
theological_decisions:
- issue: Выражение «debtors of sin»
  choice: «должники греха» с примечанием
  alternative: «виновны в грехе» или «имеем долг из-за греха»
  rationale: Сохранён необычный и богословски напряжённый образ долга без молчаливого истолкования.
- issue: Кто заповедал служить и кто возвещал
  choice: Различены Христос, апостолы и пророки посредством синтаксиса и пунктуации
  alternative: Прочитать весь ряд как совместных носителей одной заповеди
  rationale: 'Так естественно передаётся свидетельство: Господь заповедал, апостолы благовествовали, пророки предвозвестили, при этом связь всего ряда сохраняется.'
- issue: «our Lord and God»
  choice: «нашего Господа и Бога»
  alternative: «Господа нашего и Бога»
  rationale: Сохранена грамматическая неоднозначность относительно референции титулов; перевод не добавляет имени и не разрешает вопрос искусственно.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Использованы понятные синтаксические конструкции, но сохранены уместные церковно-библейские термины («пресвитеры», «лицеприятие», «судилище», «благоговение»). Поскольку прямой обзор греческой и латинской традиции ещё не выполнен, draft остаётся предварительным и опирается на указанное публично-доступное английское свидетельство с консультацией английского POB.
