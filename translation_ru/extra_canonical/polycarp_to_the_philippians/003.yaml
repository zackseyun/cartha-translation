    issue: Неясное и потенциально неверно направленное «с тех, кто Ему не повинуется»
    rationale: В греческой конструкции кровь относится ко Христу, тогда как непокорность направлена к Богу. Русская фраза после «Его кровь» может прочитываться как неповиновение Христу; прямое «Богу» точнее и не снимает никаких текстологически существенных неоднозначностей.
  - severity: low
    issue: «Всякое дышащее создание»
    rationale: Это тяжеловесно и несколько меняет образ «всякое дыхание / всё, что дышит». Более естественная русская формулировка сохраняет охват и образность.
  - severity: low
    issue: «престол по правую руку от Себя»
    rationale: Добавленное «от Себя» стилистически утяжеляет фразу и может неудачно представлять престол как предмет, расположенный справа. «Престол по правую руку от Бога» яснее передаёт образ возвышения, сохраняя различение Бога и Христа.
