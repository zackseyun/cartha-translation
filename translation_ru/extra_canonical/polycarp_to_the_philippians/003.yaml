base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: ru
  text: 'Поэтому препояшьте чресла ваши[a] и служите Богу в страхе и истине, оставив суетные и пустые разговоры и заблуждение многих, ведь вы уверовали в Того, Кто воскресил нашего Господа Иисуса Христа из мёртвых и дал Ему славу и престол по правую руку от Бога.[b] Ему покорено всё, что на небе и на земле; всё, что дышит, служит Ему. Он грядёт как Судья живых и мёртвых, и Бог взыщет кровь Его с тех, кто не повинуется Богу.[c]


    Тот, Кто воскресил Его из мёртвых, воскресит и нас, если мы исполняем Его волю, следуем Его заповедям и любим то, что любил Он, воздерживаясь от всякой неправедности, алчности, сребролюбия, злоречия и лжесвидетельства; не воздавая злом за зло, оскорблением за оскорбление, ударом за удар и проклятием за проклятие.


    Вспомним же слова, сказанные Господом, когда Он учил: «Не судите, чтобы и вы не были судимы. Прощайте — и будете прощены. Будьте милосердны, чтобы и вам была оказана милость. Какой мерой мерите, такой будет отмерено и вам». И ещё: «Блаженны бедные и гонимые за праведность, ибо их есть Царство Божье».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «препояшьте чресла ваши» — библейский образ готовности к действию.'
    reason: Архаичный образ может быть неясен современному читателю, но важен как межтекстовая библейская формула.
  - marker: b
    text: Выражение передаёт образ царского возвышения Христа по правую руку Бога.
    reason: Поясняет синтаксис и образ, не подменяя текст конфессиональным истолкованием.
  - marker: c
    text: Кровь относится ко Христу; Бог взыскивает её с тех, кто не повинуется Богу.
    reason: Передаёт соотнесение местоимений в древней формулировке и устраняет неясность русского местоименного ряда.
  - marker: d
    text: 'Здесь: «бедные», а не «нищие духом», и «Царство Божье», а не «Царство Небесное»; цитата не приведена в полное соответствие с какой-либо одной канонической формой.'
    reason: Предотвращает скрытую гармонизацию речений Господа с привычной формой евангельского текста.
lexical_decisions:
- source_word: gird up your loins
  choice: препояшьте чресла ваши
  rationale: Сохранён библейский образ призыва быть готовыми к действию; современная пояснительная передача дана в сноске.
- source_word: fear and truth
  choice: в страхе и истине
  rationale: Формально сохранена парная формула; «страх» здесь обозначает благоговейный страх перед Богом, но в основной текст толкование не внесено.
- source_word: vain and empty talking
  choice: суетные и пустые разговоры
  rationale: Передаёт оба близких определения и звучит естественно по-русски.
- source_word: covetousness, love of money
  choice: алчности, сребролюбия
  rationale: Сохранено различие между широкой жадностью к чужому или большему и более узкой привязанностью к деньгам.
- source_word: quick and dead
  choice: живых и мёртвых
  rationale: Современный русский эквивалент традиционной эсхатологической формулы.
- source_word: walk in His commandments
  choice: следуем Его заповедям
  rationale: Идиома передана естественно, без ненужного буквального «ходим в заповедях».
theological_decisions:
- issue: К кому относятся местоимения в выражении о престоле и правой руке
  choice: «дал Ему славу и престол по правую руку от Себя»
  alternative: «дал Ему славу и престол по правую руку Бога»
  rationale: Контекст называет Бога субъектом воскресения и дарования; добавление «от Себя» ясно передаёт синтаксическую связь, не отождествляя Лица.
- issue: Референт в формуле «whose blood God will require»
  choice: «Бог взыщет Его кровь с тех, кто Ему не повинуется»
  alternative: «Бог взыщет кровь Христа с непокорных Богу»
  rationale: Сохранена местоименная неоднозначность доступного свидетельства; сноска обозначает вероятный референт без его догматического закрепления в тексте.
- issue: Условие воскресения «if we do His will»
  choice: «воскресит и нас, если мы исполняем Его волю»
  alternative: «воскресит и нас; поэтому будем исполнять Его волю»
  rationale: Условная конструкция источника сохранена, чтобы не устранять её богословское напряжение.
- issue: «Бедные» или «бедные духом»
  choice: «бедные»
  alternative: «нищие духом»
  rationale: Доступное свидетельство содержит просто «poor»; каноническая формулировка из Матфея не импортирована.
- issue: Царство Бога или Небес
  choice: «Царство Божье»
  alternative: «Царство Небесное»
  rationale: Сохранена формулировка предоставленного свидетельства «kingdom of God», без гармонизации с Матфеем.
translation_notes:
  register: Современный литературный русский с dignified библейским регистром. Архаизм «чресла» оставлен только ради узнаваемого образа и пояснён; прочая лексика преимущественно современная. Поскольку предоставлен англоязычный публичнодоменный свидетель, а прямая сверка греческой и латинской рукописной традиции ещё не проведена, формулировки и сноски сознательно сохраняют отмеченные неоднозначности и не претендуют на окончательную текстологическую реконструкцию.
