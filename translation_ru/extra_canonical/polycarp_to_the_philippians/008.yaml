review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод близко передаёт греческий текст PolPhil. 7 и английский контрольный свидетель: сохранены три параллельных обличения, формулы «во плоти», «свидетельство Креста», «первенец сатаны», а также молитвенная цитата. Однако «суетные дела большинства» неточно передаёт τὴν ματαιότητα τῶν πολλῶν: это скорее «суетные занятия/суетность многих», а «большинство» неоправданно сужает «многих».'
  naturalness: Регистр выдержан и в основном естественен. «Трезвиться для молитвы» звучит несколько неестественно в современном литературном русском; «бодрствуя в молитвах» естественнее и точнее передаёт νήφοντες πρὸς τὰς εὐχάς. «Пребывать в постах» возможно, но «постоянно соблюдая посты» яснее передаёт προσκαρτεροῦντες νηστείαις.
  terminology: '«Исповедует», «свидетельство Креста», «речения Господа», «всевидящий Бог», «искушение», «первенец сатаны» допустимы и сохраняют образность без конфессионального истолкования. В цитате предпочтительно «дух бодр, плоть же немощна»: слово «дух» в русском обычно пишется со строчной буквы, если речь не о Святом Духе; исходник этой неоднозначности не разрешает.'
  issues:
  - severity: medium
    issue: «суетные дела большинства»
    rationale: Греческое τὴν ματαιότητα τῶν πολλῶν говорит о суетности или суетных занятиях «многих», а не обязательно «большинства». Исправление сохраняет число и не усиливает количественное утверждение.
  - severity: low
    issue: «трезвиться для молитвы»
    rationale: Формулировка буквальна, но для современного русского тяжеловесна. «Бодрствуя в молитвах» естественно передаёт призыв к духовной бодрости, связанной с молитвой.
  - severity: low
    issue: Заглавная буква в «Дух бодр»
    rationale: Контекстуально это не следует однозначно относить к Святому Духу. Строчная буква сохраняет традиционную антропологическую формулу и не навязывает толкования.
