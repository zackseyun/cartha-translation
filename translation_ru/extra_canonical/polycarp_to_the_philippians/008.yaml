base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: ru
  text: 'Ибо всякий, кто не исповедует, что Иисус Христос пришёл во плоти, — антихрист; и всякий, кто не исповедует свидетельства Креста, — от дьявола; а всякий, кто искажает речения Господа в угоду собственным желаниям и говорит, что нет ни воскресения, ни суда, — первенец сатаны.


    Поэтому оставим суетные занятия многих и их лжеучения и обратимся к слову, переданному нам от начала; будем бодрствовать в молитвах и постоянно соблюдать посты, в мольбах прося всевидящего Бога не ввести нас в искушение, как сказал Господь: «Дух бодр, плоть же немощна».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confess
  choice: исповедует
  rationale: Сохраняет смысл открытого признания веры и раннехристианский богословский регистр, оставаясь понятным современному читателю.
- source_word: testimony of the Cross
  choice: свидетельства Креста
  rationale: Формально сохраняет неоднозначное выражение свидетельства; не заменяет его толкованием вроде «учения о кресте».
- source_word: oracles of the Lord
  choice: речения Господа
  rationale: Передаёт авторитетные изречения Господа без архаичного и потенциально двусмысленного слова «оракулы».
- source_word: vain doing of the many
  choice: суетные дела большинства
  rationale: Сохраняет указание и на бесплодность практик, и на многочисленность тех, кто им следует; не уточняет характер дел без достаточных исходных данных.
- source_word: being sober unto prayer
  choice: трезвиться для молитвы
  rationale: Сохраняет библейскую метафору духовной бдительности и её направленность к молитве.
- source_word: constant in fastings
  choice: пребывать в постах
  rationale: Передаёт постоянство и множественное число практики без излишнего усиления.
- source_word: all-seeing God
  choice: всевидящего Бога
  rationale: Точно и естественно передаёт традиционный эпитет божественного всеведения.
- source_word: firstborn of Satan
  choice: первенец сатаны
  rationale: Сохраняет резкий образ и его возможную риторическую многозначность, не перефразируя как «главный слуга».
theological_decisions:
- issue: «Иисус Христос пришёл во плоти»
  choice: пришёл во плоти
  alternative: явился как человек
  rationale: Сохранена формула, перекликающаяся с 1 Ин. 4:2–3 и несущая христологическое напряжение; пояснительный пересказ мог бы сузить её смысл.
- issue: Смысл «свидетельства Креста»
  choice: свидетельство Креста
  alternative: учение о кресте
  rationale: Не разрешена подлинная неоднозначность между свидетельством о кресте, свидетельством, исходящим от Креста, и исповеданием его значения.
- issue: Просьба «не ввести нас в искушение»
  choice: не ввести нас в искушение
  alternative: не допустить, чтобы мы поддались искушению
  rationale: Сохранена форма молитвенного предания, близкая к словам Господней молитвы, без богословски мотивированного смягчения причинной конструкции.
- issue: «Дух бодр, плоть же немощна»
  choice: дух / плоть
  alternative: желание / человеческая слабость
  rationale: Сохранена библейская антропологическая лексика и присущая ей напряжённость, без сведения к психологическому пересказу.
translation_notes:
  register: Современный литературный русский язык с dignified раннехристианским регистром. Синтаксис слегка упрощён для ясности, но параллелизм обличений и библейские формулы сохранены. Поскольку предоставлен английский публичнодоменный свидетель, а прямая сверка с греческой и латинской традицией ещё ожидается, спорные выражения переданы консервативно и без конфессионального истолкования.
