revisions:
- from: 'Ведь всякий, кто не исповедует, что Иисус Христос пришёл во плоти, — антихрист; и кто не исповедует свидетельства Креста, тот от дьявола; а кто извращает речения Господа в угоду собственным желаниям и говорит, что нет ни воскресения, ни суда, тот — первенец сатаны.


    Поэтому оставим суетные дела большинства и их лжеучения и обратимся к слову, переданному нам от начала. Будем трезвиться для молитвы и пребывать в постах, в мольбах прося всевидящего Бога не ввести нас в искушение, как сказал Господь: «Дух бодр, плоть же немощна».'
  to: 'Ибо всякий, кто не исповедует, что Иисус Христос пришёл во плоти, — антихрист; и всякий, кто не исповедует свидетельства Креста, — от дьявола; а всякий, кто искажает речения Господа в угоду собственным желаниям и говорит, что нет ни воскресения, ни суда, — первенец сатаны.


    Поэтому оставим суетные занятия многих и их лжеучения и обратимся к слову, переданному нам от начала; будем бодрствовать в молитвах и постоянно соблюдать посты, в мольбах прося всевидящего Бога не ввести нас в искушение, как сказал Господь: «Дух бодр, плоть же немощна».'
  rationale: Исправлены два места, где черновик либо сужал смысл («большинство» вместо «многих»), либо звучал не вполне естественно. Сохранены синтаксический параллелизм и спорно-образные формулы оригинала. Поскольку предоставленный первичный материал включает английского свидетеля, а не критический греческий аппарат, не добавляются текстологические решения сверх устойчиво засвидетельствованной формулировки.
