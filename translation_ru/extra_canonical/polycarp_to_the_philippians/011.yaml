base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: ru
  text: 'Итак, стойте твёрдо во всём этом и следуйте примеру Господа. Будьте тверды и непоколебимы в вере; с братской любовью и сердечной теплотой относитесь друг к другу; будьте сопричастны истине; стремитесь первыми проявлять друг к другу кротость Господа и никого не презирайте.


    Когда можете сделать добро, не откладывайте, ибо милостыня избавляет от смерти.[a] Подчиняйтесь друг другу и ведите себя безупречно среди язычников,[b] чтобы благодаря вашим добрым делам и вы получили похвалу и чтобы из-за вас не хулили Господа.


    Но горе тому, через кого хулится имя Господа! Поэтому учите всех здравомыслию и сами живите в нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «милостыня избавляет от смерти»; ср. Тов. 4:10; 12:9. Какой именно вид смерти имеется в виду, здесь не уточняется.'
    reason: Уточняет лексическое значение «милостыни», отмечает вероятную библейскую параллель и сохраняет неразрешённую смысловую и богословскую неоднозначность выражения.
  - marker: b
    text: 'Или: «среди народов». В данном контексте имеются в виду окружающие христиан нехристиане.'
    reason: Отмечает диапазон значения традиционного библейского обозначения Gentiles, не перегружая основной текст.
lexical_decisions:
- source_word: Stand fast
  choice: стойте твёрдо
  rationale: Сохраняет повелительный характер и образ стойкости, звуча естественно в современном литературном русском.
- source_word: kindly affectioned one to another
  choice: с сердечной теплотой относитесь друг к другу
  rationale: Передаёт тёплую взаимную привязанность без архаического или сентиментального оттенка.
- source_word: partners with the truth
  choice: сообщниками истины
  rationale: Сохраняет сильную метафору участия и единения с истиной, не сводя её лишь к согласию с истинными положениями.
- source_word: forestalling one another
  choice: опережайте друг друга
  rationale: Передаёт идею первенства или инициативы во взаимном проявлении кротости; современное «предупреждайте» было бы двусмысленно.
- source_word: Pitifulness / eleemosyna
  choice: милостыня
  rationale: В латинской традиции eleemosyna означает конкретную помощь нуждающимся, то есть милостыню, а не просто чувство жалости.
- source_word: conversation
  choice: ведите себя
  rationale: Архаическое английское conversation здесь означает образ жизни или поведение.
- source_word: soberness
  choice: здравомыслие
  rationale: Передаёт нравственную рассудительность и самообладание шире, чем буквальная трезвость.
theological_decisions:
- issue: Утверждение «милостыня избавляет от смерти»
  choice: Сохранено без поясняющего ограничения в основном тексте
  alternative: Перефразировать как «милосердие помогает избежать гибели» или уточнить вид смерти
  rationale: Текст намеренно формулирует сильное утверждение и не уточняет, о физической или духовной смерти идёт речь; перевод не должен заранее разрешать эту богословскую напряжённость.
- issue: «the Lord may not be blasphemed in you»
  choice: «чтобы из-за вас не хулили Господа»
  alternative: «чтобы Господь не был хулим в вас»
  rationale: Русская формулировка ясно передаёт причинную связь с поведением адресатов, сохраняя богословский смысл и избегая неестественной кальки.
- issue: Взаимное подчинение
  choice: «Подчиняйтесь друг другу»
  alternative: Ослабить до «уступайте друг другу»
  rationale: Сохранена взаимность и сила наставления без внесения иерархической или конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис умеренно торжественный, но без церковнославянизмов и устаревших оборотов. Поскольку прямая сверка с греческой и латинской рукописной традицией обозначена как ожидающая выполнения, решения опираются на предоставленное публичное английское свидетельство и явно указанное латинское чтение там, где оно надёжно распознаётся.
