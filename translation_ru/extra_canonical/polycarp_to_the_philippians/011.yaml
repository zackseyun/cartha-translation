    rationale: Формула об избавлении от смерти и термин ἐλεημοσύνη имеют греческое текстовое основание; формулировка «буквально по латинской традиции» неоправданно сужает свидетельство. Примечание следует исправить, сохранив отсылку к Товиту и не разрешая значение «смерти».
