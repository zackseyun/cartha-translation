  source_fidelity: 'Основной смысл передан близко к свидетельству: призывы к стойкости, взаимной любви, благотворительности, взаимной подчинённости и безупречному поведению сохранены. Однако «сообщники истины» в современном русском обычно означает соучастников, нередко в преступлении, и потому искажает положительный смысл συμμετοχής/партнёрства с истиной. Примечание о «милостыне» также неточно приписывает буквальное чтение только латинской традиции: ἐλεημοσύνη засвидетельствовано и в греческой форме данного выражения; параллель с Товитом уместна.'
  naturalness: 'Текст в целом литературен и хорошо читается. «Опережайте друг друга в кротости» остаётся не вполне ясной калькой: русский читатель может не понять, в чём именно следует опережать. Более естественно прямо выразить инициативу во взаимном проявлении кротости. «Сопричастны истине» сохраняет образ участия и лишено нежелательной криминальной окраски слова «сообщники».'
  terminology: «Господь», «вера», «братская любовь», «милостыня», «язычники» и «хулить» уместны для современного литературного перевода раннехристианского текста. «Милостыня» обоснованно сохраняет конкретный, а не только эмоциональный смысл ἐλεημοσύνη. «Здравомыслие» допустимо как современная передача нравственной трезвости, хотя не должно пониматься как снятие компонента самообладания.
