  - severity: medium
    issue: «опережайте друг друга в кротости Господней»
    rationale: Формально близко к английскому witness, но по-русски неясно, что означает «опережать» в данной добродетели. Следует явно передать призыв проявлять инициативу во взаимной кротости, не добавляя состязательного смысла.
  - severity: medium
