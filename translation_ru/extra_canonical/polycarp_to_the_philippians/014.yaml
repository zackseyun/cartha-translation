base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: ru
  text: '13. Вы сами и Игнатий писали мне с просьбой: если кто-нибудь отправится в Сирию, пусть доставит туда ваши письма. Я исполню это, как только представится подходящая возможность: либо отправлюсь сам, либо пошлю того, кто будет также вашим посланником.


    Письма Игнатия, присланные нам им самим, а также все другие его письма, которые были у нас, мы посылаем вам, как вы и просили. Они приложены к этому письму. Из них вы сможете извлечь большую пользу, ведь в них говорится о вере, стойкости и всяком назидании, относящемся к нашему Господу. А если у вас есть какие-либо достоверные сведения о самом Игнатии и о тех, кто был с ним, сообщите нам.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод предварительно основан на предоставленном древнем английском свидетельстве; прямая сверка с греческой и латинской рукописной традицией ещё требуется.
    reason: Источник прямо указывает, что проверка по древним языкам пока не проведена; это существенно для прозрачности публикационного черновика.
lexical_decisions:
- source_word: carry thither the letters from you
  choice: доставит туда ваши письма
  rationale: Естественно передаёт направление и поручение, не уточняя адресатов сверх свидетельства.
- source_word: fit opportunity
  choice: подходящая возможность
  rationale: Современная нейтральная формулировка, сохраняющая условный характер обещания.
- source_word: ambassador
  choice: посланником
  rationale: «Посланник» уместнее в контексте церковного поручения и не создаёт современного дипломатического оттенка слова «посол».
- source_word: endurance
  choice: стойкости
  rationale: Передаёт устойчивость в испытаниях; «терпение» возможно, но в современном русском слабее выражает выдержку перед страданием.
- source_word: edification
  choice: назидании
  rationale: Сохраняет раннехристианский смысл духовного созидания в понятном литературном церковном слове.
- source_word: sure tidings
  choice: достоверные сведения
  rationale: Точно передаёт требование надёжности информации без архаизма «вести».
theological_decisions:
- issue: Связь выражения «относящемся к нашему Господу» с перечислением
  choice: Сохранена широкая связь со «всяким назиданием» без догматического уточнения
  alternative: «в назидание в нашем Господе» или отнесение ко всему перечислению
  rationale: Английский свидетель допускает некоторую синтаксическую неоднозначность; русский текст не должен вносить конфессиональное толкование.
- issue: Статус лица, которого Поликарп может послать
  choice: «вашим посланником»
  alternative: «представителем» или «послом»
  rationale: Формулировка сохраняет поручение от имени филиппийцев, не предполагая формализованной церковной или дипломатической должности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского послания; устранены английские архаизмы, сохранены ясность, условность поручения и сдержанный церковный регистр. Нумерация главы добавлена по указанной ссылке PolPhil. 13.
