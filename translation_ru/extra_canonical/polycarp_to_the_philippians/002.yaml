base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: ru
  text: '**Поликарп — филиппийцам, 1**


    Я вместе с вами весьма возрадовался в Господе нашем Иисусе Христе, потому что вы приняли тех, кто являет пример истинной любви[a], и проводили их в путь, как и подобало вам. Они облечены в святые узы — венцы тех, кто поистине избран Богом и Господом нашим.


    Радуюсь и тому, что твёрдый корень вашей веры, известной с давних времён, остаётся доныне и приносит плод Господу нашему Иисусу Христу. Он ради наших грехов претерпел даже смерть, но Бог воскресил Его, расторгнув муки ада[b]. Вы не видели Его, но веруете в Него и радуетесь радостью неизречённой и славной. В эту радость многие желают войти, ведь вы знаете, что спасены благодатью — не от дел, но по воле Бога через Иисуса Христа.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможен смысл: «образы (или примеры) истинной любви». Речь идёт о людях, которые своей жизнью являют такую любовь.'
    reason: The supplied English witness says “followers,” but the underlying Greek expression carries the sense of examples, representations, or embodiments; the note preserves that lexical nuance.
  - marker: b
    text: «Ад» здесь передаёт греческое «хадес» — мир мёртвых; выражение перекликается с Деян. 2:24.
    reason: Modern Russian «ад» can suggest only the place of final punishment, whereas the ancient term has a broader death-realm sense.
  - marker: c
    text: В этом абзаце слышны отголоски 1 Пет. 1:8 и Еф. 2:8–9.
    reason: The wording is densely scriptural; identifying the principal echoes helps readers recognize them without inserting citations into Polycarp’s text.
lexical_decisions:
- source_word: τὰ μιμήματα τῆς ἀληθοῦς ἀγάπης (reflected imperfectly by “the followers of the true Love” in the supplied witness)
  choice: тех, кто являет пример истинной любви
  rationale: The Greek expression is commonly understood as persons who embody or exemplify genuine agapē. This is clearer and more source-sensitive than the potentially misleading literal calque «последователи истинной Любви».
- source_word: τοῖς ἁγιοπρεπέσιν δεσμοῖς / “saintly bonds”
  choice: в святые узы
  rationale: «Узы» is dignified and natural in Russian, retaining both literal imprisonment and the honor attached to suffering for faith.
- source_word: διαμένει καὶ καρποφορεῖ / “abideth … and beareth fruit”
  choice: остаётся доныне и приносит плод
  rationale: Preserves the root-and-fruit metaphor in current literary Russian.
- source_word: τὰς ὠδῖνας τοῦ ᾅδου / “the pangs of Hades”
  choice: муки ада
  rationale: Retains the ancient expression and its scriptural resonance without expanding it into a doctrinal explanation.
- source_word: χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ / “joy unutterable and full of glory”
  choice: радостью неизречённой и славной
  rationale: Preserves the elevated biblical diction and the close allusion to 1 Peter 1:8 while remaining understandable.
theological_decisions:
- issue: Agency and basis of salvation
  choice: спасены благодатью — не от дел, но по воле Бога через Иисуса Христа
  alternative: спасены благодатью, а не делами, по Божьей воле, через Иисуса Христа
  rationale: The chosen punctuation preserves all stated elements—grace, not works, God’s will, and mediation through Christ—without imposing a more developed confessional formula.
- issue: Meaning of Hades
  choice: ад, with an explanatory footnote
  alternative: царство мёртвых
  rationale: «Ад» reflects the traditional scriptural wording familiar to Russian readers, while the note prevents the term from being narrowed automatically to the later concept of final punishment.
- issue: Identity of those in bonds
  choice: No names supplied in the main text
  alternative: Explicitly identify them as Ignatius and his companions
  rationale: The passage itself does not name the prisoners here; leaving them unnamed avoids importing contextual reconstruction into the translation.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской интонацией. Сохранены метафоры корня, плода, уз и венцов, а также библейская ритмика. Архаизмы сведены к понятным словам («узы», «доныне», «неизречённой»). Поскольку в карточке указано, что прямая сверка греческой и латинской рукописной традиции ещё не завершена, решения следует считать публикационным черновиком, нуждающимся в окончательной текстологической проверке.
