  revision_rationale: Внесены только безопасные правки, возвращающие повелительную форму первой цитаты и сохраняющие неопределённую анафорическую формулу «это есть и в вас». Сохранены спорная/повреждённая граница текста в благословении, единственное число в благопожелании и богословская формулировка «Господа и Бога Иисуса Христа» без интерпретирующих добавлений.
