lexical_decisions:
- source_word: sacred writings / scriptures
  choice: священные писания / Писания
  rationale: Сохранено различие между общим обозначением священных текстов и последующей отсылкой к конкретным цитируемым местам; регистр естественный и достоинственный.
- source_word: avoidance of wrath
  choice: негневливость
  rationale: Передаёт не разовое подавление гнева, а устойчивое качество; при этом не добавляет идеи полного бесстрастия.
- source_word: forbearance and long suffering and patient endurance
  choice: снисходительность, долготерпение, стойкость
  rationale: Сохранены три близких, но различимых качества без тяжеловесного буквального нанизывания.
- source_word: lot and portion
  choice: жребий и доля
  rationale: Сохранена библейская парность и образ участия в наследии святых.
- source_word: fruit
  choice: плод
  rationale: Сохранена намеренная библейская метафора без её истолкования как дел или поведения.
- source_word: perfect in him
  choice: совершенны в Нём
  rationale: Формально сохраняет богословски насыщенную и отчасти открытую формулировку.
theological_decisions:
- issue: К кому относится местоимение в благословении после упоминания Отца и вечного Первосвященника
  choice: Сохранено единственное число «Он» без пояснения референта
  alternative: Явно отнести все глаголы либо к Отцу, либо ко Христу
  rationale: Свидетель допускает синтаксическую неоднозначность; перевод не должен устранять её толкованием.
- issue: Титул «our Lord and God Jesus Christ»
  choice: «нашего Господа и Бога Иисуса Христа»
  alternative: Разнести титулы или отнести «Бога» к Отцу
  rationale: Сохранена грамматическая связь титулов с Иисусом Христом в предоставленном свидетельстве без конфессионального переформулирования.
- issue: Отношение веры ко Христу и к Отцу
  choice: «уверуют в нашего Господа и Бога Иисуса Христа и в Его Отца»
  alternative: Сгладить в «поверят Богу через Христа»
  rationale: Сохранена параллельная конструкция источника и её богословское напряжение.
- issue: Цитата «Be angry and sin not»
  choice: «Гневаясь, не согрешайте»
  alternative: «Гневайтесь и не согрешайте»
  rationale: Причастная конструкция естественнее по-русски и сохраняет возможность понимать фразу как предостережение в состоянии гнева, не превращая её однозначно в повеление гневаться.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким церковно-библейским регистром. Архаизмы устранены, но устойчивые библейские слова «блажен», «Первосвященник», «долготерпение», «жребий» и «святые» сохранены ради смысловой точности. Проект остаётся предварительным, поскольку прямое сопоставление с греческой и латинской рукописной традицией ещё не выполнено.
