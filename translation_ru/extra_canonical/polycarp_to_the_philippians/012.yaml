base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: ru
  text: 'Я глубоко опечален из-за Валента, который прежде был у вас пресвитером: он столь мало понимает служение, вверенное ему. Поэтому призываю вас сторониться корыстолюбия, быть чистыми и правдивыми. Сторонитесь всякого зла.


    Но если человек не способен владеть собой в этом, как он может требовать этого от другого? Кто не сторонится корыстолюбия, тот осквернится идолопоклонством и будет судим как один из язычников, не знающих суда Господнего. Разве мы не знаем, что святые будут судить мир, как учит Павел?


    Однако у вас я ничего подобного не обнаружил и ни о чём таком не слышал — у вас, среди кого трудился блаженный Павел и кто вначале были его письмами.[a] Ведь он хвалится вами во всех тех церквах, которые в то время одни знали Бога, а мы Его тогда ещё не знали.


    Поэтому я глубоко опечален из-за него и его жены. Да дарует им Господь истинное покаяние. Будьте же и сами рассудительны в этом деле. Не считайте таких людей врагами, но возвращайте их как немощные и заблудшие члены, чтобы сохранить всё ваше тело. Поступая так, вы созидаете друг друга.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые были его письмами в начале». Необычный образ, вероятно, представляет самих филиппийцев как живое свидетельство апостольского труда Павла; точный смысл выражения остаётся не вполне ясным.'
    reason: Фраза необычна и текстуально/смыслово трудна; основной текст сохраняет её образность, а примечание предупреждает против чрезмерно уверенного истолкования.
lexical_decisions:
- source_word: presbyter
  choice: пресвитер
  rationale: Сохранён раннехристианский термин служения без замены на конфессионально окрашенное современное наименование.
- source_word: covetousness
  choice: корыстолюбие
  rationale: Передаёт не только желание чужого имущества, но более широкую жадность и стремление к наживе, подразумеваемые контекстом.
- source_word: office
  choice: служение
  rationale: В контексте пресвитера естественнее и точнее, чем административные «должность» или «пост».
- source_word: sober
  choice: рассудительны
  rationale: Передаёт призыв к трезвости суждения и бдительности в отношении проступка, а не буквальное воздержание от опьянения.
- source_word: restore
  choice: возвращайте
  rationale: Сохраняет восстановительный, а не только исправительный смысл отношения к согрешившим членам общины.
- source_word: edify
  choice: созидаете
  rationale: Сохраняет образ построения общины и привычную раннехристианскую лексику, оставаясь понятным в современном русском.
theological_decisions:
- issue: Связь корыстолюбия с идолопоклонством
  choice: «осквернится идолопоклонством»
  alternative: «будет запятнан как идолопоклонник»
  rationale: Сохранена резкая формулировка свидетеля и богословская связь порока с идолопоклонством без поясняющего ослабления.
- issue: «Святые будут судить мир»
  choice: Сохранено как прямое утверждение со ссылкой на учение Павла
  alternative: Истолковать «судить» как «участвовать в суде»
  rationale: Текст воспроизводит 1 Кор 6:2; конкретный механизм суда не уточняется и не должен быть внесён переводчиком.
- issue: Спасение всего тела общины
  choice: «чтобы сохранить всё ваше тело»
  alternative: «чтобы спасти всю вашу общину»
  rationale: Сохранена телесная метафора и её богословское напряжение; «сохранить» здесь позволяет не предрешать сотериологический смысл глагола.
- issue: Адресат пожелания о покаянии
  choice: «им»
  alternative: «которым» / «ей»
  rationale: По смыслу покаяние требуется Валенту и его жене; русская формулировка устраняет грамматическую неловкость английского свидетеля, не добавляя учения о характере их вины.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Архаические формы устранены, но ключевые церковные термины («пресвитер», «святые», «покаяние», «созидаете») сохранены. Основание проекта ограничено предоставленным английским публично-доменным свидетелем; прямая сверка с греческой и латинской рукописной традицией ещё требуется.
