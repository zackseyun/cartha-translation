base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: ru
  text: Пишу вам это через Кресцента, которого недавно рекомендовал вам и теперь вновь рекомендую, потому что среди нас он жил безупречно; полагаю, что и у вас он будет поступать так же. Примите и его сестру, когда она придёт к вам. Будьте здоровы в благодати Господа Иисуса Христа — вы и все, кто с вами. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: by/through Crescens
  choice: через Кресцента
  rationale: Передаёт посредничество Кресцента как доставителя письма, не уточняя сверх свидетельства его точную роль.
- source_word: commended
  choice: рекомендовал / вновь рекомендую
  rationale: Современная и естественная передача просьбы принять человека с доверием; повтор сохранён.
- source_word: walked blamelessly
  choice: жил безупречно
  rationale: Передаёт древнюю нравственную метафору естественным современным русским выражением.
- source_word: have his sister commended
  choice: примите также с доверием его сестру
  rationale: Раскрывает несколько тяжёлую буквальную конструкцию как рекомендацию оказать сестре доверительный приём.
- source_word: Fare ye well ... in grace
  choice: Благодатью пребывайте в благополучии
  rationale: Сохраняет и прощальное пожелание, и упоминание благодати, не превращая её в обычную формулу вежливости.
- source_word: all yours
  choice: все ваши
  rationale: Сохраняет широкое, неуточнённое обозначение людей, связанных с адресатами.
theological_decisions:
- issue: Связь благодати с заключительным пожеланием
  choice: Благодатью пребывайте в благополучии в Господе Иисусе Христе
  alternative: Будьте здравы в благодати Господа Иисуса Христа
  rationale: Выбранная формулировка не решает без достаточных исходных данных, относится ли «в благодати» непосредственно к Господу Иисусу Христу или к прощальному пожеланию.
- issue: Будущее поведение Кресцента у филиппийцев
  choice: верю, что так же будет и среди вас
  alternative: верю, что и среди вас он уже поступал так же
  rationale: Следует предоставленному английскому слою, где речь понимается как ожидание его поведения у адресатов; прямое рассмотрение греческой и латинской традиции ещё требуется.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского послания. Перевод неизбежно предварительный: предоставлено только англоязычное свидетельство, а прямая сверка с греческой и латинской рукописной традицией ожидается.'
