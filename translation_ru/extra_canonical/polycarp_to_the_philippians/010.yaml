base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: ru
  text: 'Итак, призываю всех вас быть послушными слову праведности и проявлять всякую стойкость — ту, которую вы собственными глазами видели в блаженных Игнатии, Зосиме и Руфе, а также в других из вашей среды, в самом Павле и в остальных апостолах.


    Будьте уверены, что все они бежали не напрасно, но в вере и праведности, и теперь находятся на подобающем им месте пред Господом, вместе с Которым они и страдали.[a] Ведь они возлюбили не нынешний мир, а Того, Кто умер ради нас и Кого Бог воскресил для нас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Которого они и пострадали». Сохранившаяся формулировка допускает связь их страданий с Господом без точного уточнения характера этой связи.'
    reason: Свидетельство, доступное здесь через английский перевод, допускает как сопереживание Христу, так и страдание ради Него; прямую сверку греческой и латинской традиции ещё предстоит провести.
lexical_decisions:
- source_word: word of righteousness
  choice: слово праведности
  rationale: Сохранена содержательная и, вероятно, традиционная формула свидетельства без сужения до «учения о праведности» или «праведного слова».
- source_word: to practice all endurance
  choice: проявлять всякую стойкость
  rationale: Естественно по-русски передаёт деятельное упражнение в терпеливой выдержке; «стойкость» здесь яснее современному читателю, чем отвлечённое «долготерпение».
- source_word: ran not in vain
  choice: бежали не напрасно
  rationale: Сохранена апостольская метафора бега, вероятно намеренно перекликающаяся с Павловыми посланиями.
- source_word: present world
  choice: нынешний мир
  rationale: Передаёт временной контраст с грядущим, не вводя более узкого значения «мирская жизнь».
- source_word: in their due place
  choice: находятся на подобающем им месте
  rationale: Сохраняет пространственно-эсхатологический образ и не уточняет сверх свидетельства характер награды.
theological_decisions:
- issue: Статус умерших праведников пред Господом
  choice: теперь находятся на подобающем им месте пред Господом
  alternative: достигли предназначенного им места у Господа
  rationale: Не конкретизируется промежуточное состояние или устройство загробной жизни; сохранено утверждение свидетельства о месте пред Господом.
- issue: Фраза «with whom also they suffered»
  choice: вместе с Которым они и страдали
  alternative: за Которого они и пострадали
  rationale: Основной текст сохраняет буквальную соотнесённость страданий с Господом и не подменяет её причинным значением; неоднозначность отмечена сноской.
- issue: Божественное действие в воскресении Христа
  choice: Кого Бог воскресил для нас
  alternative: Который воскрес для нас
  rationale: Сохранено явное указание на Бога как действующего субъекта воскресения.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис слегка упрощён ради ясности, но сохранены риторический ход, метафора бега и богословская напряжённость. Проект предварительный: предоставленное основание — публичный английский свидетель; необходима прямая проверка греческой и латинской рукописной традиции.'
