base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: ru
  text: 'Итак, будем непрестанно и твёрдо держаться нашей надежды и залога нашей праведности — Иисуса Христа. Он Сам вознёс наши грехи в Своём теле на древо. Он не совершил греха, и в устах Его не нашлось обмана. Ради нас Он всё претерпел, чтобы мы жили в Нём.


    Итак, будем подражать Его стойкости. И если нам придётся пострадать ради Его имени, будем прославлять Его. Ведь Он на Самом Себе показал нам этот пример, и мы в это поверили.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительные слова «мы в это поверили» переведены по предоставленному английскому свидетельству. Их точная форма и отсылка нуждаются в сверке с греческой и латинской рукописной традицией.
    reason: Прямой анализ древнегреческого и латинского текста для этого задания ещё не выполнен, а английское свидетельство допускает неоднозначную местоименную отсылку.
lexical_decisions:
- source_word: earnest
  choice: залог
  rationale: Передаёт смысл гарантии, ручательства или первого дара, не сводя выражение к абстрактному «основанию».
- source_word: took up / bore
  choice: вознёс
  rationale: Сохраняет библейскую формулировку о несении грехов и вероятную аллюзию на 1 Пет. 2:24, оставаясь естественным в сочетании «на древо».
- source_word: tree
  choice: древо
  rationale: Сохраняет традиционную библейскую метафору креста, присутствующую в цитируемой формуле.
- source_word: endurance
  choice: стойкость
  rationale: Современное и ясное слово, обозначающее твёрдость в страдании; менее архаично, чем «долготерпение».
- source_word: guile / deceit
  choice: обман
  rationale: Естественно передаёт отсутствие лжи или коварства в речи.
- source_word: in Him
  choice: в Нём
  rationale: Сохраняет богословски значимую пространственно-союзную метафору без истолкования.
theological_decisions:
- issue: «залог нашей праведности» и его отнесение ко Христу
  choice: Сохранена конструкция, в которой залогом назван Сам Иисус Христос.
  alternative: «залог того, что мы будем оправданы»
  rationale: Исходное свидетельство допускает насыщенное и не вполне разъяснённое выражение; разворачивать его в конкретную доктрину оправдания было бы излишним толкованием.
- issue: Фраза «чтобы мы жили в Нём»
  choice: Сохранено «в Нём».
  alternative: «благодаря Ему» или «через Него»
  rationale: Формулировка может обозначать участие, единение или сферу жизни во Христе; перевод не должен устранять эту многозначность.
- issue: Прославление при страдании за имя Христа
  choice: «будем прославлять Его»
  alternative: «будем славить Его»
  rationale: Сохранён объектный смысл свидетельства без уточнения способа прославления.
- issue: Заключительное «we believed this»
  choice: «мы в это поверили» с примечанием
  alternative: «мы уверовали в Него»
  rationale: Предоставленный английский свидетель формально указывает на «это», но местоименная отсылка и источник требуют проверки по греческой и латинской традиции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены узнаваемые формулы «вознёс наши грехи», «на древо», «в устах Его не нашлось обмана» и «жили в Нём». Поскольку древнегреческий и латинский источник ещё ожидает прямой проверки, текст является осторожным публикационным черновиком на основании указанного публичного английского свидетельства и аудированного английского консультационного слоя.
