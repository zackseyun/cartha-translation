base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: ru
  text: 'Итак, зная, что над Богом не посмеешься, мы должны жить достойно Его заповеди и Его славы.


    Так и диаконы должны быть безупречны перед Его праведностью — как служители Бога и Христа, а не людей; не клеветники, не двоедушные в речах, не сребролюбивые, но во всём воздержанные, сострадательные и усердные, живущие по истине Господа, Который стал слугой — диаконом — для всех.[a] Ведь если мы угождаем Ему в нынешнем мире, то получим и будущий мир, поскольку Он обещал воскресить нас из мёртвых. И если мы живём достойно Его, то будем и царствовать вместе с Ним — если только действительно веруем.


    Так и молодые мужчины должны быть во всём безупречны, превыше всего заботиться о чистоте и удерживать себя от всякого зла. Ведь хорошо воздерживаться от мирских желаний, потому что всякое желание ведёт войну против Духа.[b] Ни живущие в половой распущенности, ни изнеженные, ни оскверняющие себя с мужчинами не наследуют Царства Божьего,[c] как и поступающие неподобающим образом. Поэтому следует воздерживаться от всего этого, подчиняясь пресвитерам и диаконам, как Богу и Христу.[d] Девы должны жить с безупречной и чистой совестью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В исходной традиции здесь, по-видимому, обыгрывается одно и то же слово: оно может обозначать и слугу, и диакона как церковного служителя.'
    reason: Сохранение отмеченной английским свидетельством игры слов.
  - marker: b
    text: Слово «Дух» может относиться к Святому Духу; возможное понимание как человеческого духа нельзя окончательно исключить без прямой сверки с древним текстом.
    reason: Сохранение референциальной неоднозначности.
  - marker: c
    text: Названия категорий в этом перечне переданы предварительно. Их точный объём и соотношение требуют сверки с греческой и латинской рукописной традицией; формулировка намеренно не согласована автоматически с каким-либо каноническим переводом.
    reason: Терминологическая и текстовая осторожность в спорном сексуально-этическом перечне.
  - marker: d
    text: Сравнение «как Богу и Христу» передано без добавочного пояснения; оно выражает требуемое отношение к служителям, но не утверждает их тождества с Богом и Христом.
    reason: Предотвращение ложного буквального прочтения без изменения основного текста.
lexical_decisions:
- source_word: walk / walking
  choice: жить / живущие
  rationale: Библейская метафора поведения передана естественным современным русским глаголом; буквальное «ходить» здесь звучало бы архаично и могло бы быть понято физически.
- source_word: deacons / minister (deacon)
  choice: диаконы / слуга — диакон
  rationale: Сохранены церковное обозначение служения и отмеченная в свидетельстве игра однокоренных слов между служителем и диаконом.
- source_word: double-tongued
  choice: двоедушные в речах
  rationale: Передаёт не просто многословие, а неискренность и противоречивость речи, сохраняя образность без неестественного «двуязычные».
- source_word: temperate
  choice: воздержанные
  rationale: Охватывает самообладание и умеренность во всём, что соответствует контексту нравственных требований.
- source_word: younger men
  choice: молодые мужчины
  rationale: Не сужает адресатов до подростков и ясно передаёт мужскую группу.
- source_word: lusts / desire
  choice: мирские желания / всякое желание
  rationale: Сохранено различие формулировок данного свидетельства и намеренно не сведено всё к исключительно сексуальной похоти.
- source_word: presbyters
  choice: пресвитеры
  rationale: Сохраняет историческое наименование церковного служения без преждевременного отождествления с позднейшими должностями.
- source_word: virgins
  choice: девы
  rationale: Краткое и достоинственное обозначение соответствующей группы; «девственницы» звучит более клинически.
theological_decisions:
- issue: Местоимение «Его» в выражении «перед Его праведностью»
  choice: Сохранена референциальная неоднозначность
  alternative: Явно указать «перед Божьей праведностью»
  rationale: Доступное свидетельство содержит местоимение, и при отсутствии прямой сверки с греческим/латинским текстом не следует молча устранять возможную неоднозначность.
- issue: Условность обещания царствовать со Христом
  choice: «если только действительно веруем»
  alternative: «если мы верны»
  rationale: Свидетельство даёт faith; перевод сохраняет акцент на вере, не превращая его без достаточных оснований в верность или стойкость.
- issue: «Всякое желание ведёт войну против Духа»
  choice: «Дух» с прописной буквы, но с примечанием об неоднозначности
  alternative: «духа» как человеческого духа
  rationale: Английское свидетельство понимает Spirit как Святого Духа, однако без проверки исходного регистра и контекста возможна и иная референция.
- issue: Перечень сексуальных проступков
  choice: Сохранены три различимые категории без гармонизации с привычными переводами 1 Кор 6:9
  alternative: Объединить категории в современное обобщающее обозначение
  rationale: Так сохраняются структура свидетельства, историческая дистанция и потенциальная семантическая неоднозначность терминов.
- issue: Подчинение пресвитерам и диаконам «как Богу и Христу»
  choice: Сравнение сохранено буквально
  alternative: Смягчить до «как поставленным Богом и Христом»
  rationale: Смягчение добавило бы отсутствующее пояснение и разрешило бы риторическое напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис умеренно библейский, но без устаревших оборотов. Проект предварительный: предоставлен английский публично-доменный свидетель, тогда как прямая проверка греческой и латинской рукописной традиции ещё не выполнена.'
