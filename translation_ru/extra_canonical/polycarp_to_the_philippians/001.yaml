base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/001.yaml
  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: ru
  text: Поликарп и пресвитеры, находящиеся с ним, — Церкви Божьей, пребывающей в Филиппах. Да умножатся вам милость и мир от Бога Вседержителя и Иисуса Христа, нашего Спасителя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: presbyters
  choice: пресвитеры
  rationale: Передаёт раннехристианское наименование служителей точнее, чем более общее «старейшины», и не уточняет их функции сверх свидетельства текста.
- source_word: sojourneth / residing
  choice: пребывающей
  rationale: Сохраняет образ общины, временно живущей в земном городе, без неестественного для русского адреса «странствующей».
- source_word: be multiplied
  choice: да умножатся
  rationale: Сохраняет форму благопожелания и образ умножения, характерные для раннехристианского эпистолярного стиля.
- source_word: God Almighty
  choice: Бога Вседержителя
  rationale: Традиционный и литературно естественный русский эквивалент титула «Almighty».
- source_word: our Savior
  choice: нашего Спасителя
  rationale: Прямо сохраняет христологический титул и включающее местоимение первого лица множественного числа.
theological_decisions:
- issue: Отнесение слов «нашего Спасителя»
  choice: к Иисусу Христу
  alternative: к Богу Вседержителю либо ко всей объединённой формуле
  rationale: Порядок слов в представленном свидетельстве естественнее связывает титул с ближайшим именем «Иисуса Христа»; пунктуация не усиливает формулу сверх доступного основания.
- issue: Экклезиологический смысл «пребывающей»
  choice: сохранён образ временного пребывания
  alternative: нейтральное «находящейся»
  rationale: Формулировка удерживает возможный богословский оттенок странничества Церкви, не превращая его в явное толкование.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского послания. Адресная формула оформлена естественно для русского языка; сохранены «пресвитеры», «Церковь Божья», благопожелательное «да умножатся». Поскольку непосредственная сверка с греческой и латинской традицией ещё не выполнена, проект остаётся основанным на указанном публичном английском свидетельстве.
