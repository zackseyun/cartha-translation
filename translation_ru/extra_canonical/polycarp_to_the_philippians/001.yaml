revisions:
- from: Поликарп и пресвитеры, находящиеся с ним, — Церкви Божьей, пребывающей в Филиппах. Да умножатся у вас милость и мир от Бога Вседержителя и Иисуса Христа, нашего Спасителя.
  to: Поликарп и пресвитеры, находящиеся с ним, — Церкви Божьей, пребывающей в Филиппах. Да умножатся вам милость и мир от Бога Вседержителя и Иисуса Христа, нашего Спасителя.
  rationale: 'Внесена единственная безопасная правка: «у вас» заменено на «вам», чтобы сохранить адресный дательный оригинальной формулы и естественность современного литературного русского. Остальной текст не меняется.'
  reviewer_model: gpt-5.6-terra
