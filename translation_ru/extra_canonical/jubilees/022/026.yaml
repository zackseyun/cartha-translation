base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: ru
  text: «Этот дом я построил для себя[a], чтобы моё имя пребывало на нём на земле. Он дан тебе и твоему потомству навеки и будет называться домом Авраама[b]. Он дан тебе и твоему потомству навеки, потому что ты построишь мой дом и утвердишь моё имя перед Богом навеки. Твоё потомство и твоё имя сохранятся во всех поколениях земли».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «этот дом я построил для себя» могут относиться к месту поклонения, устроенному Авраамом, однако последующее выражение «дом Авраама» имеет также родовое, династическое звучание. Возможно, эта двусмысленность намеренна.
    reason: segmentation_note
  - marker: b
    text: В представленном геэзском тексте это слово искажено при распознавании; исправленное чтение означает «и будет называться».
    reason: textual_note
lexical_decisions:
- source_word: ቤተ
  choice: дом
  rationale: Сохраняет основной смысл слова и одновременно допускает как буквальное здание, так и род, династию.
- source_word: ዘርእ
  choice: потомство
  rationale: Передаёт собирательное значение «семя, потомки» естественным современным русским словом.
- source_word: አንብር፡ ስምየ፡ ላዕሌሁ
  choice: поместить на нём моё имя
  rationale: Близко передаёт образ помещения имени на доме, не заменяя его более узким толкованием о посвящении или владении.
- source_word: ይቀውም
  choice: сохранятся
  rationale: В заключительной фразе естественно выражает длительное существование имени и потомства; буквальное «будут стоять» по-русски звучало бы неясно.
theological_decisions:
- issue: Значение выражения «дом Авраама»
  choice: Сохранено буквальное «дом Авраама» без пояснения в основном тексте.
  alternative: Явно передать как «род Авраама» или только как название святилища.
  rationale: Контекст допускает одновременно культовое и династическое звучание; перевод не должен устранять эту смысловую напряжённость.
- issue: Время глаголов «построишь» и «утвердишь»
  choice: Будущее время.
  alternative: 'Прошедшее время: «построил» и «утвердил».'
  rationale: Исправленные формы геэзских глаголов имеют имперфектную форму и в пророческом контексте указывают на будущее действие.
- issue: Написание местоимений первого лица
  choice: Строчные «моё», «мой».
  alternative: Прописные «Моё», «Мой», если считать говорящим Бога.
  rationale: В непосредственном контексте слова произносит Авраам; прописные формы могли бы ошибочно отождествить говорящего с Богом, который далее назван в третьем лице.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор формулы «отдан тебе и твоему потомству навеки» сохранён как значимый риторический повтор. Кавычки отражают завершение прямой речи в предоставленном фрагменте.
