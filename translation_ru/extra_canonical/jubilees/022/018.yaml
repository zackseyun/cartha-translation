  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: ru
  text: И ты, сын мой Иаков, помни мои слова и соблюдай заповеди Авраама, отца твоего. Отделись от народов, не ешь вместе с ними, не поступай, как они, и не становись их товарищем, потому что дела их нечисты, а все пути их — скверна, мерзость и нечистота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈለጥ፡ እምአሕዛብ
  choice: Отделись от народов
  rationale: Передаёт повеление об обособлении без усиления до полного физического разрыва; «народы» естественно соответствует обозначению иных народов в данном контексте.
- source_word: ወኢትብላዕ፡ ምስሌሆሙ
  choice: не ешь вместе с ними
  rationale: Сохраняет конкретный смысл совместной трапезы.
- source_word: ወኢትኩኖሙ፡ ቢጸ
  choice: не становись их товарищем
  rationale: Передаёт идею товарищества или близкого общения, не сужая её до дружбы в современном эмоциональном смысле.
- source_word: ርኩስ
  choice: нечисты
  rationale: Естественное предикативное обозначение ритуальной или нравственной нечистоты; не подменяет его более общим «порочны».
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: скверна, мерзость и нечистота
  rationale: Сохраняет трёхчленный ряд отрицательных характеристик путей народов и его риторическое накопление, не устраняя близость значений первого и третьего элементов.
theological_decisions:
- issue: Характер отделения от народов
  choice: Сохранено прямое повеление «Отделись от народов» вместе с конкретными запретами совместной еды, подражания делам и товарищества.
  alternative: Истолковать повеление исключительно как нравственное дистанцирование.
  rationale: Источник сочетает общее повеление с конкретными формами разграничения; перевод не должен заранее сводить его только к нравственной или только к ритуальной сфере.
- issue: Нечистота дел и путей
  choice: Использована лексика «нечисты», «скверна», «мерзость», «нечистота».
  alternative: Передать всё как нравственную испорченность или греховность.
  rationale: Так сохраняется напряжение между культовой и нравственной семантикой нечистоты без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «Авраама, отца твоего» и повтор «дела их / пути их» сохраняют достоинство и риторику исходного наставления, оставаясь понятными современному читателю.
