  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: ru
  text: И не оставляй его и не покидай его отныне и до дней вечности.[a] Пусть Твои глаза будут открыты и обращены к нему и к его потомству,[b] чтобы Ты хранил его, благословлял его и освящал его для народа Твоего наследия.[c] И благословляй его всеми Твоими благословениями отныне и во все дни вовеки; обновляй с ним и с его потомством Свой завет и Свою милость согласно всей Твоей воле во всех поколениях земли».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и до дней вечности»; по смыслу также возможно: «отныне и вовеки».'
    reason: Сохранена необычная временная формула исходного текста и указано её естественное смысловое соответствие.
  - marker: b
    text: 'Буквально: «Пусть Твои глаза будут открыты над ним и над его потомством».'
    reason: Геэзский предлог буквально означает «над», тогда как в русском основном тексте избрана естественная конструкция, обозначающая внимательный и хранящий взор.
  - marker: c
    text: 'Фраза «для народа Твоего наследия» синтаксически сжата. Возможен и более буквальный порядок: «освящал его для народа, [который есть] Твоё наследие»; связь «его» и «народа» в исходнике не развёрнута.'
    reason: Сноска фиксирует синтаксическую трудность без добавления толковательного отождествления Иакова с будущим народом.
lexical_decisions:
- source_word: አትኅድጎ፡ … አትትሐየዮ
  choice: не оставляй его, и не покидай его
  rationale: Два близких запретительных глагола переданы двумя естественными русскими соответствиями, чтобы сохранить исходный параллелизм без искусственного усиления различия.
- source_word: መዋዕለ፡ ዘለዓለም
  choice: дни вечности
  rationale: Сохранено явное существительное «дни», присутствующее в геэзском тексте, а не сведено всё выражение к одному наречию «вовеки».
- source_word: አዕይንቲከ፡ ክሡታተ፡ ላዕሌሁ
  choice: Твои глаза будут открыты и обращены к нему
  rationale: Буквальная конструкция «открыты над ним» по-русски неестественна; добавление «обращены» ясно выражает направленное и попечительное внимание, а буквальная форма отмечена в сноске.
- source_word: ዘርኡ
  choice: его потомство
  rationale: В данном контексте «потомство» естественнее русского «семя» и сохраняет собирательное значение исходного слова.
- source_word: ርስትከ
  choice: Твоё наследие
  rationale: Сохранён библейский образ народа как Божьего наследия без замены его более толковательным выражением «принадлежащий Тебе народ».
- source_word: ሣህለከ
  choice: Твоя милость
  rationale: Передано широким и богословски нейтральным словом «милость», подходящим для благоволения и сострадания в контексте завета.
theological_decisions:
- issue: Освящение Иакова в отношении будущего народа Божьего наследия
  choice: «освящал его как народ, который станет Твоим наследием»
  alternative: «освящал его для народа Твоего наследия»
  rationale: Исходная конструкция с единственным числом «его» и последующим «народом» сжата и допускает разные синтаксические разборы. Основной текст выражает контекстуально вероятный переход от праотца к происходящему от него народу, а более буквальная возможность сохранена в сноске.
- issue: Совместное обновление «завета» и «милости»
  choice: «обновляй для него и его потомства Свой завет и Свою милость»
  alternative: «обновляй Свой завет с ним и его потомством и Свою милость к ним»
  rationale: Выбранная конструкция позволяет одному исходному глаголу управлять обоими дополнениями и не вводит отдельного действия вроде «являй милость».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным тоном. Местоимения, обращённые к Богу, написаны с прописной буквы как стилистический знак почтения, без конфессиональной конкретизации. Параллелизм прошения сохранён, но неестественные для русского языка предложные конструкции смягчены и документированы в сносках.
