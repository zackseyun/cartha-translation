  source_fidelity: 'Начальная временная формула и образ «открытых глаз» переданы в целом точно. Однако основной текст вносит не содержащуюся в оригинале интерпретацию: «его как народ, который станет Твоим наследием» отождествляет Иакова с будущим народом и добавляет будущее становление. Кроме того, «для него и его потомства» ослабляет явно выраженное в источнике «с ним и с его потомством» в заключительной формуле.'
  naturalness: Русский текст в целом литературен и сохраняет молитвенно-благословительный регистр. Формула «обновляй с ним и с его потомством ... завет и милость» несколько тяжеловесна, но намеренно сохраняет сжатую координацию исходника; сноска поясняет эту трудность без смыслового расширения.
  terminology: «Потомство», «завет», «милость» и «наследие» уместны. «Народ Твоего наследия» сохраняет синтаксическую неясность и образ оригинала лучше, чем толковательное «народ, который станет Твоим наследием».
