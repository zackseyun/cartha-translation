base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: ru
  text: Пусть Всевышний Бог дарует тебе все благословения, которыми Он благословил меня и которыми благословил Ноя и Адама. Пусть они почивают на святой голове твоего потомства во всех поколениях[a] и вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из поколения в поколение».'
    reason: Указывает допустимую идиоматическую передачу выражения о последовательности поколений, тогда как основной текст сохраняет явное «всех».
lexical_decisions:
- source_word: የሀብከ
  choice: пусть дарует тебе
  rationale: Передаёт пожелание-благословение и значение глагола «дать» естественным современным русским выражением.
- source_word: አምላከ፡ ልዑል
  choice: Всевышний Бог
  rationale: Сохраняет титул Бога и естественный для русского библейского регистра порядок слов.
- source_word: ኵሎን፡ በረከታተ
  choice: все благословения
  rationale: Прямо сохраняет выраженный в источнике охват «все».
- source_word: ያዕርፉ፡ ዲበ
  choice: пусть они пребывают над
  rationale: Сохраняет образ благословений, покоящихся или пребывающих на потомстве, без его рационализации.
- source_word: ቅዱስ፡ ዘርእከ
  choice: святой главой твоего потомства
  rationale: Передаёт буквальный образ «святая глава» и понимает «семя» в коллективном смысле потомства; форма «главой» согласована с предлогом «над».
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: во всех поколениях
  rationale: Сохраняет явный квантор «всех» и естественно передаёт идиому поколений.
- source_word: ወእስከ፡ ለዓለም
  choice: и вовеки
  rationale: Краткое и dignified библейское соответствие значению вечной продолжительности.
theological_decisions:
- issue: Образ «святой главы» потомства
  choice: 'сохранить буквально: «над святой главой твоего потомства»'
  alternative: «на твоём святом потомстве»
  rationale: Источник содержит слово «глава»; его устранение сгладило бы необычный, но значимый образ.
- issue: Референт множественного местоимения в пожелании
  choice: «пусть они пребывают» относится к благословениям
  alternative: переформулировать в единственном числе как общее благословение
  rationale: Множественное число источника естественно соотносится со «всеми благословениями» и должно быть сохранено.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской религиозной издательской практикой; синтаксис остаётся ясным для обычного читателя.
