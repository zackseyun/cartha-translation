  source_fidelity: Вторая часть точно сохраняет множественное число благословений, образ «святой головы» и всеобщность поколений. Однако ዲበ означает «на, поверх»; «пребывают над» может обозначать нахождение выше, а не покоящееся на объекте.
  naturalness: Фраза торжественна, но понятна в современном литературном русском. «Почивают на святой голове твоего потомства» лучше передаёт исходный образ и остаётся в уместном библейском регистре.
  terminology: «Всевышний Бог», «благословения», «Ной», «Адам», «потомство» и «вовеки» выбраны удачно. Кавычки и сноска оформлены последовательно.
  issues:
