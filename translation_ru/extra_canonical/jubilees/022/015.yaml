    issue: Пространственное значение «над святой главой»
    rationale: 'Предлог ዲበ означает «на». В контексте глагола «покоиться/пребывать» русский предлог «над» ослабляет образ, поскольку допускает значение расположения выше головы. Следует передать: «почивают на святой голове».'
