revisions:
- from: Пусть Всевышний Бог дарует тебе все благословения, которыми Он благословил меня и которыми благословил Ноя и Адама. Пусть они пребывают над святой главой твоего потомства во всех поколениях[a] и вовеки.
  to: Пусть Всевышний Бог дарует тебе все благословения, которыми Он благословил меня и которыми благословил Ноя и Адама. Пусть они почивают на святой голове твоего потомства во всех поколениях[a] и вовеки.
  rationale: Заменено только «пребывают над» на «почивают на», чтобы точно передать ያዕርፉ፡ ዲበ («да покоятся на») и сохранить буквальный образ исходного текста. Остальная формулировка, включая «во всех поколениях» и сноску, верно отражает источник и английскую аудиторскую историю.
