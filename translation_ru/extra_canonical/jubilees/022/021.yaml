  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: ru
  text: А ты, сын мой Иаков, да поможет тебе Бог Всевышний, и да благословит тебя Бог небес и отведёт тебя от их нечистоты и от всех их заблуждений.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: Всевышний Бог
  rationale: Передаёт титул Бога естественно для современного литературного русского языка, сохраняя возвышенный регистр.
- source_word: ይርዳእከ
  choice: да поможет тебе
  rationale: Оптативная форма передана русской конструкцией с «да», уместной в благословении.
- source_word: አምላከ፡ ሰማይ
  choice: Бог небесный
  rationale: Сохраняет исходную конструкцию и торжественное звучание; не подменяет её более привычным, но менее буквальным выражением «Бог небес».
- source_word: ወያግኅሥከ
  choice: и удалит тебя
  rationale: Передаёт избавление или отделение Иакова от названных ниже нравственно-религиозных опасностей без добавления отсутствующего в тексте образа очищения.
- source_word: ርእዮሙ
  choice: их нечистоты
  rationale: Выбор согласуется с древней переводческой традицией данного места и параллелизмом с «заблуждениями»; семантически речь идёт об осквернении или нечистоте.
- source_word: ኵሉ፡ ስሕተቶሙ
  choice: всех их заблуждений
  rationale: Сохраняет множественное число и широкий смысл ошибок, уклонений или заблуждений, не сужая его до конкретной доктринальной категории.
theological_decisions:
- issue: Характер двух божественных наименований
  choice: Сохранены «Всевышний Бог» и «Бог небесный» как два последовательных титула.
  alternative: Объединить их или заменить второе местоимением «Он».
  rationale: Повтор в исходном тексте риторически значим и подчёркивает форму патриархального благословения.
- issue: Смысл удаления от нечистоты и заблуждений
  choice: Передано как просьба к Богу оградить и отделить Иакова от чужого осквернения и ошибок.
  alternative: Перевести как внутреннее очищение Иакова от уже присущего ему греха.
  rationale: Притяжательное «их» связывает нечистоту и заблуждения с другими людьми; текст не утверждает, что Иаков уже разделяет их состояние.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной синтаксической формой благословения. Обращение «сын мой Иаков» и оптативное «да» сохраняют библейское достоинство, оставаясь понятными обычному читателю.
