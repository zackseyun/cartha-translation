  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: ru
  text: И да обновит Он Свой завет с тобой, чтобы ты был для Него народом, Его уделом, во все века, и чтобы Он был Богом для тебя и твоего потомства в истине и праведности во все дни земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ
  choice: да обновит Он Свой завет
  rationale: Передаёт молитвенно-пожелательную форму и прямое значение глагола «обновить»; прописные местоимения соответствуют принятому русскому благоговейному регистру.
- source_word: ሕዝበ፡ ለርስት
  choice: народом, Его уделом
  rationale: Буквальное «народом для наследия/удела» по-русски неестественно; приложение сохраняет образ народа как принадлежащего Богу удела, не сводя его к одному лишь «наследству».
- source_word: ለኵሉ፡ ዓለማት
  choice: во все века
  rationale: Множественное ዓለማት в данном временном контексте естественно означает «века», а не пространственные «миры».
- source_word: ለከ፡ ወለዘርእከ
  choice: для тебя и твоего потомства
  rationale: ዘርእ («семя») передано обычным русским коллективным словом «потомство», сохраняющим родовую протяжённость обещания.
- source_word: በሀልወ፡ ወዘበጽድቅ
  choice: в истине и праведности
  rationale: Сохраняет две нравственно-богословские характеристики и их предложную связь, не превращая их без достаточного основания в определения Бога.
- source_word: በኵሉ፡ መዋዕለ፡ ምድር
  choice: во все дни земли
  rationale: Сохранён образный временной оборот источника, означающий всё время существования земли.
theological_decisions:
- issue: Отношение народа к Богу как наследия/удела
  choice: народом, Его уделом
  alternative: народом для наследия
  rationale: Выбранный вариант ясно выражает принадлежность народа Богу и сохраняет библейский образ удела, не навязывая дополнительного толкования о том, кто именно наследует.
- issue: Связь слов «истина и праведность» с бытием Бога для адресата
  choice: чтобы Он был Богом для тебя и твоего потомства в истине и праведности
  alternative: чтобы Он был для тебя и твоего потомства Богом истины и праведности
  rationale: Предложный оборот источника сохранён как характеристика осуществления заветных отношений, а не однозначно превращён в титул или набор атрибутов Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм двух пожеланий сохранён; архаизмы и конфессионально маркированная терминология не использованы.
