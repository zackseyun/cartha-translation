  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: ru
  text: 'И он благословил Иакова и сказал: «Сын мой, которому я радуюсь всем сердцем и всей своей любовью, да пребудут твоя благодать и твоё милосердие на нём и на его потомстве во все дни»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В оригинале здесь происходит необычный переход между лицами: буквально «твоя благодать и твоё милосердие да пребудут на нём». Формы второго лица при последующем «на нём» создают грамматическую неровность; возможно, это молитвенное обращение.'
    reason: textual_variant
lexical_decisions:
- source_word: ዘበኵሉ፡ ልብየ፡
  choice: которому я радуюсь всем сердцем
  rationale: Передаёт конструкцию с በኵሉ ልብየ («всем моим сердцем») естественным современным русским выражением.
- source_word: ወዘበምሕረትየ፡
  choice: и всей моей любовью
  rationale: В данном описании отношения отца к сыну ምሕረት выражает глубокую привязанность; «любовью» звучит естественно и не смешивает эту фразу с последующим молитвенным «милосердием».
- source_word: ሣህለከ፡ ወምሕረትከ፡
  choice: Твоя благодать и Твоё милосердие
  rationale: Окончание -ከ является формой второго лица мужского рода единственного числа («твоя»), а не первого лица. Заглавная буква отражает подразумеваемое обращение к Богу, не устраняя необычного перехода между лицами.
- source_word: ወላዕለ፡ ዘርኡ፡
  choice: и на его потомстве
  rationale: ዘር может означать «семя» или «потомство»; в современном русском «потомство» ясно передаёт родовую линию Иакова.
- source_word: ኵሎ፡ መዋዕለ።
  choice: во все дни
  rationale: 'Сохраняет буквальный временной оборот: ኵሎ относится к «дням», а не к «потомству».'
theological_decisions:
- issue: Неожиданный переход от обращения к Иакову к форме второго лица в молитвенном благословении
  choice: 'Сохранено: «Твоя благодать и Твоё милосердие… на нём»'
  alternative: 'Согласовать лица: «моя благодать… на тебе» либо «Твоя благодать… на тебе»'
  rationale: Эфиопский текст действительно сочетает суффиксы второго лица у «благодати» и «милосердия» с местоимением третьего лица «на нём». Исправление сделало бы текст грамматически ровнее, но устранило бы подлинную напряжённость источника.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формой благословения. «Да пребудут» сохраняет молитвенный регистр; архаизмы сверх необходимого не используются.
