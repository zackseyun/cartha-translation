    rationale: Геэзский текст выражает второе лицо, но не называет адресата. Написание «Твоя/Твоё» интерпретирует его как Бога; строчные буквы лучше сохраняют неоднозначность.
  - severity: low
    issue: Позиция маркера сноски
    rationale: Сноска относится к необычному переходу лиц в благословении; по русской пунктуационной практике её маркер ставится после закрывающей кавычки и перед точкой.
  - severity: low
