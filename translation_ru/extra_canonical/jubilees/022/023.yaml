  yaml_path: translation/extra_canonical/jubilees/022/023.yaml
  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: ru
  text: Ибо из-за преступления Хама Ханаан впал в заблуждение, и всё его потомство будет истреблено с земли; и в день суда не останется от него ни остатка, ни одного спасшегося.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: преступление
  rationale: Передаёт вину и нарушение, не сужая смысл до случайной ошибки.
- source_word: ስሕተ
  choice: впал в заблуждение
  rationale: Сохраняет значение уклонения или заблуждения и естественно звучит в данном контексте.
- source_word: ዘርአ
  choice: потомство
  rationale: Контекстуальный эквивалент слова «семя» в значении потомков.
- source_word: ይደመሰስ
  choice: будет истреблено
  rationale: Передаёт полное уничтожение, выраженное исходным глаголом.
- source_word: ተረፉ
  choice: остатка
  rationale: Сохраняет библейское понятие оставшейся части рода.
- source_word: ዘይድኅን
  choice: спасшегося
  rationale: Передаёт того, кто уцелел или избежал гибели, не добавляя способа спасения.
- source_word: ዕለተ፡ ደይን
  choice: день суда
  rationale: Прямой и общепонятный эквивалент эсхатологической формулы.
theological_decisions:
- issue: Связь между преступлением Хама и заблуждением Ханаана
  choice: Сохранена причинно-следственная формулировка источника без пояснения механизма ответственности.
  alternative: Переформулировать так, будто Ханаан лично разделил преступление Хама.
  rationale: Источник оставляет богословское напряжение и не разъясняет характер этой связи.
- issue: Значение спасения в последней фразе
  choice: «ни спасшегося»
  alternative: «никого, кто избежит гибели»
  rationale: Выбрана краткая формулировка, сохраняющая более широкий диапазон значения глагола и не ограничивающая его только физическим бегством.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм и категоричность приговора сохранены; архаизмы и конфессионально окрашенные добавления исключены.
