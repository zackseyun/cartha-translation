review_pass:
  verdict: revise
  source_fidelity: 'Перевод в целом точно передаёт причинную связь, выраженную в геэзском тексте: преступление Хама — заблуждение Ханаана, а также последующее уничтожение потомства Ханаана. «Потомство» уместно передаёт ዘርአ в значении «семя, потомки»; «будет истреблено с земли» соответствует ይደመሰስ እምድር. Неоднозначная и богословски напряжённая связь между поступком Хама и виной Ханаана не разъясняется добавочными словами, что правильно. Финальная пара «остаток / спасшийся» сохранена.'
  naturalness: Фраза «не останется от него ни остатка, ни спасшегося» понятна, но «ни спасшегося» без зависимого слова звучит в современном литературном русском несколько обрывочно. «Ни одного спасшегося» естественно и сохраняет смысл отсутствия любого уцелевшего/спасшегося. Перенос «в день суда» ближе к финальной позиции исходника и делает временную рамку всего заключительного утверждения яснее.
  terminology: '«Преступление», «впал в заблуждение», «потомство», «остаток» и «день суда» допустимы в умеренно возвышенном библейском регистре. «Спасшегося» оставлено намеренно: оно не сводит ዘይድኅን исключительно к физическому бегству и не добавляет доктринального толкования.'
  issues:
  - severity: low
    issue: Не вполне естественная субстантивация «ни спасшегося».
    rationale: Добавление «одного» делает отрицательную конструкцию нормативной и плавной в современном русском, не меняя содержания.
  revised_text: Ибо из-за преступления Хама Ханаан впал в заблуждение, и всё его потомство будет истреблено с земли; и в день суда не останется от него ни остатка, ни одного спасшегося.
