revisions:
- from: Ибо из-за преступления Хама Ханаан впал в заблуждение, и всё его потомство будет истреблено с земли; и не останется от него ни остатка, ни спасшегося в день суда.
  to: Ибо из-за преступления Хама Ханаан впал в заблуждение, и всё его потомство будет истреблено с земли; и в день суда не останется от него ни остатка, ни одного спасшегося.
  rationale: 'Внесена только стилистико-синтаксическая правка финального параллелизма: «ни спасшегося» заменено на «ни одного спасшегося», а обстоятельство времени поставлено перед сказуемым заключительной части. Смысл, референция «его» к Ханаану и оставленная источником причинная неоднозначность не изменены.'
