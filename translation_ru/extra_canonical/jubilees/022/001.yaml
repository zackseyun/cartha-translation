  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: ru
  text: 'И было это в первую седмину сорок четвёртого юбилея[a], во второй год этой седмины — в тот год, когда умер Авраам: Исаак и Измаил пришли из Колодца Клятвы, чтобы вместе со своим отцом Авраамом отпраздновать Праздник седмин — этот праздник первых плодов жатвы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых прежних переводах: «сорок второго юбилея». Однако прописанное числительное в эфиопском тексте означает «сорок четвёртого»; стоящий перед ним знак ፪, по-видимому, возник из-за ошибки передачи текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологической формуле слово обозначает семилетний период, а не обычную календарную неделю; «седмина» позволяет сохранить систему летоисчисления книги.
- source_word: አርብዓ፡ ወአርባዕቱ፡ ኢዮቤልዉ
  choice: сорок четвёртого юбилея
  rationale: Прописанная эфиопская числительная формула буквально означает «сорок и четыре»; она имеет преимущество перед неясным знаком ፪ в цифровой передаче текста.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодца Клятвы
  rationale: Сохранено буквальное значение топонима («колодец клятвы»), соответствующего Вирсавии, без замены его традиционным названием.
- source_word: በዓለ፡ ሱባዔያት
  choice: Праздник седмин
  rationale: Это название праздника; «седмины» сохраняют связь с семеричной системой, лежащей в основе названия.
- source_word: ዘቀዳሚ፡ ማእረር
  choice: праздник первых плодов жатвы
  rationale: Фраза указывает на первые плоды урожая, связанные с Праздником седмин, а не на «первый праздник жатвы».
theological_decisions:
- issue: Характер Праздника седмин
  choice: праздник первых плодов жатвы
  alternative: первый праздник жатвы
  rationale: Выбранное чтение передаёт культово-календарное значение первых плодов и не вводит неподтверждённую нумерацию праздников.
- issue: Связь сыновей с Авраамом при праздновании
  choice: вместе со своим отцом Авраамом
  alternative: к своему отцу Аврааму
  rationale: Контекст и консультационный перевод поддерживают совместное празднование; формулировка не утверждает сверх текста дополнительных обстоятельств встречи.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Термин «седмина» использован как краткое и точное обозначение семилетнего периода; названия праздника и топонима оформлены с прописных букв.
