  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: ru
  text: 'И он благословил его от всего сердца и сказал: «Бог Всевышний, Бог всего и Творец всего, Который вывел меня из Ура Халдейского, чтобы дать мне эту землю во владение навеки и чтобы я положил начало святому потомству[a], — да будет Всевышний благословен вовеки!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы я утвердил святое семя».'
    reason: Сохраняет для читателя конкретный образ «семени» и более буквальное значение глагола, тогда как основной текст передаёт их естественным современным русским выражением.
lexical_decisions:
- source_word: በኵሉ፡ ልቡ
  choice: от всего сердца
  rationale: Естественный русский эквивалент выражения «всем своим сердцем», сохраняющий полноту и искренность благословения.
- source_word: አምላከ፡ ልዑል
  choice: Бог Всевышний
  rationale: Передаёт и существительное «Бог», и титул «Всевышний», не сводя сочетание только к одному титулу.
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: эту землю во владение навеки
  rationale: Сохраняет значение земли как вечного владения; «навеки» звучит естественно и достойно в данном регистре.
- source_word: አቅም፡ ዘርአ፡ ቅዱሰ
  choice: я положил начало святому потомству
  rationale: 'Форма глагола указывает на первое лицо: действующим лицом становится говорящий. «Положил начало» естественно передаёт идею установления или воздвижения, а «потомство» — понятный современному читателю смысл слова «семя».'
- source_word: ይትባረክ፡ ልዑል፡ ለዓለም
  choice: да будет Всевышний благословен вовеки
  rationale: Сохраняет пожелательное значение глагола, явное повторение титула «Всевышний» и временную формулу «вовеки».
theological_decisions:
- issue: Смена грамматического субъекта во второй целевой конструкции
  choice: «чтобы я положил начало»
  alternative: «чтобы положить начало» или «и установить» с Богом как подразумеваемым субъектом
  rationale: Геэзская глагольная форма первого лица требует сохранить говорящего субъектом и не приписывать это действие Богу без грамматического основания.
- issue: Повторение титула в заключительном благословении
  choice: «да будет Всевышний благословен»
  alternative: «да будет Он благословен»
  rationale: Источник явно повторяет ልዑል, поэтому местоименная замена устранила бы значимый повтор.
- issue: Синтаксическая напряжённость высказывания
  choice: Сохранена начальная именная формула с последующим заключительным пожеланием, отделённым тире
  alternative: 'Перестроить всё как прямое обращение: «Боже Всевышний… будь благословен»'
  rationale: Источник допускает формулу провозглашения или благословения, а не обязательно прямое обращение; выбранная конструкция не устраняет эту особенность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формы «навеки», «да будет» и «вовеки» уместны для благословения, но текст избегает избыточной архаики. Заглавные буквы в «Который» отражают благоговейную издательскую норму, не меняя смысла.
