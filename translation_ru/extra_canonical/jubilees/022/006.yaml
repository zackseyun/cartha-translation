  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: ru
  text: И Исаак также послал Аврааму через Иакова лучшее от жертвы благодарения, чтобы тот ел и пил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእዴ፡ ያዕቆብ
  choice: через Иакова
  rationale: Буквально «рукой Иакова»; в данном контексте это естественная идиома посредничества и передачи.
- source_word: ዘይሤኒ
  choice: лучшее
  rationale: Передаёт превосходную степень качества при отборе части жертвы.
- source_word: መሥዋዕተ፡ ዘመድኃኒት
  choice: благодарственной жертвы
  rationale: Сочетание обозначает жертву благодарения/благополучия; «благодарственная жертва» естественно и ясно передаёт смысл в русском библейском регистре.
- source_word: ወይብላዕኒ፡ ወይስተይኒ
  choice: чтобы тот поел и выпил
  rationale: Сохраняет цель отправления пищи и напитка и явно относит действия к Аврааму без неясного местоимения.
theological_decisions: []
