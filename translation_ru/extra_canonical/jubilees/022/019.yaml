  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: ru
  text: Они приносят жертвы мёртвым, поклоняются демонам и едят в гробницах[a]; все их дела — суета и пустота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «едят в гробницах», вероятно, относится к погребальным или некромантическим культовым трапезам.
    reason: cultural_note
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ … ይዘብሑ
  choice: приносят жертвы
  rationale: Источник буквально сочетает существительное «их жертвы» с глаголом «закалывают/приносят в жертву». По-русски однокоренной повтор звучал бы тяжеловесно, поэтому смысл передан естественным устойчивым выражением.
- source_word: ለአብድነት
  choice: мёртвым
  rationale: Передаёт адресатов жертвоприношений без уточнения, которого нет в исходном тексте.
- source_word: አጋንንት
  choice: демонам
  rationale: Прямой и понятный современному читателю эквивалент; не вводит дополнительной конфессиональной окраски.
- source_word: በውስተ፡ መቃብራት
  choice: в гробницах
  rationale: Буквально обозначает нахождение внутри могил или гробниц. «Гробницы» естественнее сочетается с трапезой внутри погребального сооружения и не устраняет необычность исходного выражения.
- source_word: ከንቱ፡ ወበከ
  choice: суета и пустота
  rationale: Сохраняет парное заключительное обозначение тщетности и бессодержательности дел, оставаясь естественным в литературном русском языке.
theological_decisions:
- issue: Характер поклонения и погребальной трапезы
  choice: Сохранить прямые формулировки «поклоняются демонам» и «едят в гробницах»
  alternative: Истолковать это как некромантический обряд непосредственно в основном тексте
  rationale: Источник осуждает практики, но не объясняет их точную ритуальную форму; возможное историко-культурное толкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский с кратким, торжественным синтаксисом. Необычный образ трапезы в гробницах сохранён, а не сглажен; культурное пояснение дано в сноске.
