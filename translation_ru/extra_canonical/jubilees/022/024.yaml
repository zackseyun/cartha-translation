base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: ru
  text: А у всех, кто поклоняется идолам, и у нечестивых[a] нет никакой надежды на земле живых, ибо они сойдут в шеол[b] и отправятся в место суда; и не останется о них никакой памяти на земле. Как сыны Содома были удалены с земли, так будут удалены все, кто поклоняется идолам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ненавистных» или «мерзких»; также возможно: «отверженных».'
    reason: лексическая неоднозначность
  - marker: b
    text: Шеол — обозначение мира мёртвых. Здесь он не переведён словами «ад» или «могила», поскольку далее отдельно упомянуто «место суда».
    reason: сохранение различия исходного текста
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: нечестивых
  rationale: Слово связано с представлением о ненавистном, мерзком или отверженном, а не с обычным эфиопским термином для ритуальной нечистоты. «Нечестивых» естественно звучит по-русски, а сноска сохраняет более буквальные оттенки.
- source_word: ሲኦል (śəʾol)
  choice: шеол
  rationale: Транслитерация сохраняет название мира мёртвых и не отождествляет его без основания ни с могилой, ни с адом; далее источник отдельно называет место суда.
- source_word: መካነ፡ ደይን (makāna dayn)
  choice: место суда
  rationale: Прямо передаёт сочетание «место» и «суд», сохраняя его отличие от шеола.
- source_word: ተንሥኡ / ይትነሥኡ
  choice: были удалены / будут удалены
  rationale: Сохранены пассивное значение, временное противопоставление и повтор одного глагола; перевод не усиливает его до однозначного «истреблены».
theological_decisions:
- issue: Соотношение шеола и места суда
  choice: Сохранить их как два последовательно названных понятия
  alternative: Передать шеол как «ад» и тем самым слить оба понятия
  rationale: Источник говорит, что люди сойдут в шеол и пойдут в место суда; перевод не должен заранее разрешать возможное различие между ними.
- issue: Судьба сынов Содома и идолопоклонников
  choice: «Удалены»
  alternative: «Истреблены»
  rationale: Более нейтральная формулировка сохраняет смысл устранения с земли, не уточняя без достаточного основания способ или окончательность наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм и повтор заключительного глагола сохранены; архаизмы и конфессионально нагруженные уточнения избегаются.
