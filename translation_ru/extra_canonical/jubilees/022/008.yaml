  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: ru
  text: И теперь я благодарю Тебя, Боже мой, за то, что Ты показал мне этот день. Вот, мне сто семьдесят пять лет; я стар и исполнен дней, и все дни мои прошли в мире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ
  choice: благодарю Тебя
  rationale: Передаёт прямое личное благодарение естественным современным русским выражением.
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ
  choice: Ты показал мне этот день
  rationale: Сохраняет образ исходного текста, не заменяя его истолковывающим выражением «дал мне дожить до этого дня».
- source_word: ወልደ፡ ፻ወ፸ወ፭ ክረምት
  choice: мне сто семьдесят пять лет
  rationale: Геэзская конструкция буквально говорит о человеке как о «сыне ста семидесяти пяти лет»; по-русски возраст естественно выражается конструкцией с дательным падежом.
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕል
  choice: стар и исполнен дней
  rationale: Сохраняет два параллельных определения — преклонный возраст и завершённую полноту жизни — в понятной библейски возвышенной форме.
- source_word: ወኵሉ፡ መዋዕልየ፡ ኮናኒ፡ ሰላመ
  choice: и все дни мои прошли в мире
  rationale: Естественно передаёт мысль о мире, характеризовавшем всю прожитую жизнь, без добавления причин или богословского истолкования.
