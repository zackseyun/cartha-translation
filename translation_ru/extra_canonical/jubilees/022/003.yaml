  text: For Isaac had many possessions in Beer-sheba, and Isaac would go and look at his possessions and return to his father.
translation:
  language: ru
  text: Ведь у Исаака было много имущества в Вирсавии, и Исаак ходил смотреть на своё имущество, а затем возвращался к отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጥሪቱ / ጥሪተ
  choice: имущество
  rationale: В обоих случаях слово обозначает владения или имущество Исаака; единственное собирательное существительное естественно передаёт смысл по-русски.
- source_word: በቤርሳቤ
  choice: в Вирсавии
  rationale: Устоявшаяся русская библейская форма топонима Беэр-Шева.
- source_word: የሐውር ... ይዋሑ ... ይገብእ
  choice: ходил осматривать ... возвращался
  rationale: Формы имперфекта в данном повествовательном контексте выражают повторяющееся действие в прошлом. «Осматривать» естественно передаёт посещение владений с целью посмотреть за ними.
- source_word: ኀበ፡ አቡሁ
  choice: к отцу
  rationale: Предлог и существительное с притяжательным суффиксом буквально означают «к его отцу»; по-русски при неизменном субъекте естественно «к отцу».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранён причинно-пояснительный союз «ведь» и привычный характер трёх действий; отвергнуто прежнее чтение о приготовлении пира, не поддерживаемое данным текстом.
