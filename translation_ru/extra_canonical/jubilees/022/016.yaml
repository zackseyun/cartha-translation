  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: ru
  text: И да очистит Он тебя от всякой нечистоты и скверны, чтобы простить все твои преступления и прегрешения по неведению[a]. И да укрепит Он тебя и благословит тебя, и да унаследуешь ты всю землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «прегрешения по неведению», текстологически трудно; геэзский текст, по-видимому, отличает проступки от ошибок, совершённых без полного знания.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኵሰት፡ ወርኩስ
  choice: нечистоты и скверны
  rationale: Передаёт два однокоренных, но различающихся обозначения ритуальной или нравственной нечистоты, сохраняя их парность без искусственного уточнения.
- source_word: አበሳከ
  choice: твои преступления
  rationale: Слово обозначает проступки или прегрешения; «преступления» сохраняет вес нарушения и отличается от следующего выражения об ошибках по неведению.
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: прегрешения по неведению
  rationale: Буквально трудная конструкция связывает ошибку или заблуждение с отсутствием знания. Формулировка сохраняет вероятное противопоставление и не утверждает больше, чем позволяет текст.
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: унаследуешь ты всю землю
  rationale: «Земля» естественно сохраняет возможный диапазон между землёй как территорией и всей землёй, не снимая исходной неоднозначности.
theological_decisions:
- issue: Различие между преступлениями и прегрешениями по неведению
  choice: Сохранены две отдельные категории
  alternative: Объединить их в общее выражение «все грехи»
  rationale: Геэзский текст, по-видимому, различает проступки вообще и ошибки, связанные с незнанием; объединение устранило бы значимое напряжение текста.
- issue: Значение «всей земли»
  choice: Оставлено без уточнения масштаба обещания
  alternative: Передать как «всю страну» или «весь мир»
  rationale: Исходное ምድር допускает как территориальное, так и более широкое понимание; перевод не должен заранее выбирать одно из них.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенно-благословительным строем. Повтор «И да…» сохраняет последовательность пожеланий исходного текста.
