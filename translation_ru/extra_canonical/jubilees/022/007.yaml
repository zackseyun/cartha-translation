revisions:
- from: И он ел и пил, и благословил Всевышнего Бога, сотворившего небо и землю, произведшего все плоды земли и давшего их сынам человеческим, чтобы они ели, пили и благословляли своего Творца.
  to: И он ел и пил, и благословил Всевышнего Бога, сотворившего небо и землю, произведшего всё, что производит земля, и давшего это сынам человеческим, чтобы они ели, пили и благословляли своего Творца.
  rationale: 'Уточнено только обозначение земного дара: «всё, что производит земля» передаёт собирательный охват геэзского выражения, не ограничивая его фруктами. «Это» сохраняет единственное число исходного указания на данный людям совокупный дар.'
