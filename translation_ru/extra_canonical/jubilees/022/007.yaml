  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: ru
  text: И он ел и пил, и благословил Всевышнего Бога, сотворившего небо и землю, произведшего всё, что производит земля, и давшего это сынам человеческим, чтобы они ели, пили и благословляли своего Творца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐ፡ ምድር
  choice: плоды земли
  rationale: Буквально выражение связано с «тучностью/изобилием земли», но в данном контексте обозначает то, что земля производит для пищи. «Плоды земли» естественно по-русски и сохраняет собирательный смысл.
- source_word: ውሉደ፡ ሰብእ
  choice: сынам человеческим
  rationale: Формально передаёт традиционное семитское обозначение людей, сохраняя возвышенный библейский регистр.
- source_word: ይባርኩ፡ ፈጣሪሆሙ
  choice: благословляли своего Творца
  rationale: 'Сохраняет повтор глагола «благословлять» и явно передаёт возвратную принадлежность: Творца людей.'
theological_decisions:
- issue: Объект человеческого благословения
  choice: своего Творца
  alternative: их Творца
  rationale: Форма источника означает «их Творца», однако при подлежащем «они» современное русское «своего» яснее выражает принадлежность без изменения богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Длинная цепочка определений сохранена, но синтаксис остаётся понятным обычному читателю.
