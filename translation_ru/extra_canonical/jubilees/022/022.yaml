  yaml_path: translation/extra_canonical/jubilees/022/022.yaml
  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: ru
  text: 'Берегись, сын мой Иаков: не бери себе в жёны женщину из потомства дочерей Ханаана, ибо всё его потомство будет искоренено с земли.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подлежит уничтожению с земли».'
    reason: Передаёт альтернативное, менее образное смысловое развёртывание выражения об искоренении, не внося оттенка предопределённости.
lexical_decisions:
- source_word: ተዐቀብ
  choice: Берегись
  rationale: Передаёт повеление быть настороже и воздержаться от указанного действия; естественно и достойно звучит по-русски.
- source_word: አትንግእ፡ ብእሲተ
  choice: брать себе жену
  rationale: Естественная русская передача запрета вступать в брак; отрицание выражено зависимым инфинитивом после «берегись».
- source_word: ዘርአ፡ አዋልደ፡ ከናአን
  choice: потомства дочерей Ханаана
  rationale: Сохраняет необычную исходную формулировку и родословный акцент, не сводя её просто к «хананеянкам».
- source_word: ለሥራዊ፡ እምድር
  choice: будет искоренено с земли
  rationale: Сохраняет образ удаления с корнем, отмеченный корнем ś-r-w, и естественно сочетается с «с земли».
theological_decisions:
- issue: Смысл будущего искоренения потомства Ханаана
  choice: будет искоренено с земли
  alternative: предназначено к уничтожению с земли
  rationale: Выбранная формулировка сохраняет конкретную метафору искоренения и не добавляет более сильной идеи предопределённости.
- issue: Референт притяжательного значения в выражении «всё его потомство»
  choice: всё его потомство
  alternative: всё их потомство
  rationale: Единственное число сохраняет связь с Ханааном как ближайшим именованным предком и соответствует английскому консультационному слою, не устраняя возможную шероховатость исходной конструкции.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Обращение «сын мой Иаков» сохранено; синтаксис сделан ясным для обычного читателя.
