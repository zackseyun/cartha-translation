    reason: Передаёт альтернативное, менее образное смысловое развёртывание выражения об искоренении, не внося оттенка предопределённости.
  revision_rationale: Изменён только русский синтаксис запрета, чтобы женщина как предполагаемая жена была выражена естественно и ясно. Сохранены исходные родословная формулировка («потомство дочерей Ханаана»), возможная отнесённость «его потомства» к Ханаану и образ искоренения «с земли». Сноска уточнена для нейтральной передачи альтернативы.
