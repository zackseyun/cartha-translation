revisions:
- from: Берегись, сын мой Иаков, брать себе жену из потомства дочерей Ханаана, потому что всё его потомство будет искоренено с земли.[a]
  to: 'Берегись, сын мой Иаков: не бери себе в жёны женщину из потомства дочерей Ханаана, ибо всё его потомство будет искоренено с земли.[a]'
  rationale: Изменён только русский синтаксис запрета, чтобы женщина как предполагаемая жена была выражена естественно и ясно. Сохранены исходные родословная формулировка («потомство дочерей Ханаана»), возможная отнесённость «его потомства» к Ханаану и образ искоренения «с земли». Сноска уточнена для нейтральной передачи альтернативы.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:55:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: запрет на брак с потомством дочерей Ханаана и предсказание искоренения потомства сохранены. «Искоренено с земли» удачно передаёт образность корня ś-r-w. Однако «из потомства дочерей» звучит по-русски несколько неестественно применительно к женщине, которую берут в жёны; безопаснее явно назвать женщину, не сужая исходное «семя/потомство».'
  naturalness: «Берегись ... брать себе жену из потомства» допустимо, но тяжеловесно. Конструкция с прямым запретом «не бери себе в жёны женщину из потомства...» яснее, современнее и сохраняет торжественный библейский регистр.
  terminology: Имена «Иаков» и «Ханаан» переданы последовательно. «Потомство» и «искоренено» точны. В сноске «предназначено к уничтожению» добавляет оттенок предопределённости, которого основной текст обоснованно избегает; более нейтрально «подлежит уничтожению».
  issues:
  - severity: medium
    issue: Не вполне естественная сочетаемость «брать себе жену из потомства».
    rationale: В русском «потомство» обычно обозначает совокупность потомков, а не женщину как объект брачного выбора. Добавление «женщину» делает референт ясным, сохраняя родословную формулировку оригинала.
  - severity: low
    issue: Сноска содержит избыточный оттенок предопределённости.
    rationale: «Предназначено к уничтожению» может подразумевать более сильную идею предопределения. «Подлежит уничтожению» передаёт альтернативное смысловое развёртывание без такого добавления.
  revised_text: 'Берегись, сын мой Иаков: не бери себе в жёны женщину из потомства дочерей Ханаана, ибо всё его потомство будет искоренено с земли.[a]'
  revised_footnotes:
