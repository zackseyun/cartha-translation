  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: ru
  text: Будь силён перед людьми[a] и господствуй среди всего потомства Сифа; тогда пути твои и пути твоих сыновей будут признаны праведными, так что вы станете святым народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Формулировка трудна. В геэзском тексте прямо сказано «потомство Сифа»; слова о положении Иакова среди него могут также означать, что он возвысится среди людей.
    reason: segmentation_note
lexical_decisions:
- source_word: ኩን፡ ኃያለ
  choice: Будь силён
  rationale: Передаёт повелительную конструкцию с прилагательным «сильный, могущественный» прямо и естественно.
- source_word: በቅድመ፡ ሰብእ
  choice: перед людьми
  rationale: Сохраняет пространственно-социальную формулу «перед людьми», не уточняя её как «в глазах людей».
- source_word: ትሜብል
  choice: господствуй
  rationale: В данном трудном контексте передаёт засвидетельствованный в консультационном слое смысл возвышенного положения или владычества; неоднозначность отмечена в сноске.
- source_word: ኵሉ፡ ዘርአ፡ ሴት
  choice: всего потомства Сифа
  rationale: Явно сохраняет названное в геэзском тексте «семя Сифа»; «потомство» естественнее в современном русском.
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: пути твои и пути твоих сыновей
  rationale: Сохраняет множественное число «пути» в обеих частях, согласующееся также с формой сказуемого.
- source_word: ይጸድቃ
  choice: будут признаны праведными
  rationale: Передаёт пассивно-результативный оттенок оправдания путей, не сводя выражение лишь к нравственной правильности.
- source_word: ሕዝብ፡ ቅዱስ
  choice: святым народом
  rationale: Устойчиво и буквально передаёт выражение «святой народ».
theological_decisions:
- issue: Смысл оправдания путей
  choice: «будут признаны праведными»
  alternative: «оправдаются» / «окажутся праведными»
  rationale: Выбранная формулировка сохраняет судебно-оценочный оттенок корня праведности, но не уточняет, кем именно совершается признание.
- issue: Кто становится святым народом
  choice: «чтобы стать вам святым народом»
  alternative: «чтобы они стали святым народом»
  rationale: Дательный субъект при инфинитиве связывает итог с Иаковом и его сыновьями, а не с грамматически ближайшими «путями», избегая при этом излишнего догматического уточнения.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Сохранены «Сиф», «праведными» и «святым народом»; архаические синтаксические обороты сведены к минимуму.
