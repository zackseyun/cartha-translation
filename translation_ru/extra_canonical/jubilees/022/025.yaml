  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: ru
  text: Не бойся, сын мой Иаков, и не тревожься, сын Авраама. Всевышний Бог сохранит тебя от порчи и избавит тебя от всякого пути заблуждения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍራህ
  choice: не бойся
  rationale: Прямой и естественный русский эквивалент отрицательного повеления.
- source_word: አትደንግፅ
  choice: не тревожься
  rationale: Передаёт состояние испуга и смятения, не дублируя дословно предыдущее «не бойся».
- source_word: አምላከ፡ ልዑል
  choice: Всевышний Бог
  rationale: Сохраняет титул Бога и естественный для русского библейского регистра порядок слов.
- source_word: ይዕቀብከ
  choice: сохранит тебя
  rationale: Передаёт значение охраны и оберегания от названной опасности.
- source_word: ሙስና
  choice: порча
  rationale: Сохраняет широкое значение повреждения или развращения, не сужая его до физической гибели.
- source_word: ፍኖተ፡ ስሕተት
  choice: путь заблуждения
  rationale: Близко передаёт образ пути, ведущего в ошибку или уклонение.
- source_word: ይባልሕከ
  choice: избавит тебя
  rationale: Передаёт спасение или освобождение от опасного пути и сохраняет отдельный второй глагол исходного текста.
theological_decisions:
- issue: Характер «порчи»
  choice: Сохранено широкое слово «порча» без уточнения нравственного, телесного или иного характера.
  alternative: «развращение», «гибель» или «тление»
  rationale: Исходное слово допускает широкий смысл; конкретизация могла бы необоснованно разрешить смысловую неоднозначность.
- issue: Соотношение двух действий Бога
  choice: 'Два параллельных действия переданы отдельно: Бог «сохранит» от порчи и «избавит» от пути заблуждения.'
  alternative: Отнести оба предложных оборота к «сохранит», а «избавит» оставить как итоговое действие.
  rationale: Синтаксис геэзского текста и местоимение ውእቱ поддерживают параллельное членение с двумя глаголами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращения и параллелизм сохранены; архаизмы и конфессионально маркированная терминология не вводились.
