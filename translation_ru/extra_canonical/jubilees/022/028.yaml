revisions:
- from: И оба они легли вместе на одну постель, и Иаков спал на груди у Авраама, отца своего отца. И он поцеловал его семь раз, и его сострадание и сердце возрадовались о нём.[a]
  to: И оба они легли вместе на одну постель, и Иаков спал на груди Авраама, отца своего отца. Авраам семь раз поцеловал Иакова, и его сострадание и сердце возрадовались о нём.[a]
  rationale: Уточнены действующее лицо и адресат поцелуя, чтобы русская фраза не приписывала действие Иакову вследствие ближайшего синтаксического антецедента. Сохранены образ «груди» Авраама, родственная формула «отца своего отца», глагол «возрадовались» и трудный параллелизм «сострадание и сердце».
