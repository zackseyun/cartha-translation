  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: ru
  text: И оба они легли вместе на одну постель, и Иаков спал на груди Авраама, отца своего отца. Авраам семь раз поцеловал Иакова, и его сострадание и сердце возрадовались о нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последняя часть фразы трудна для передачи. Буквально она связывает сострадание и сердце Авраама с радостью об Иакове; смысл в том, что Авраам был глубоко растроган и радовался ему.
    reason: segmentation_note
lexical_decisions:
- source_word: ውስተ፡ ሕፅነ፡ አብርሃም
  choice: на груди у Авраама
  rationale: Передаёт образ близости и покоя естественным современным русским языком; буквальное «в лоне Авраама» здесь звучало бы более архаично и могло бы вызвать неуместные новозаветные ассоциации.
- source_word: አቡ፡ አቡሁ
  choice: отца своего отца
  rationale: Сохраняет повтор и родственную формулировку источника, не сводя её к более свободному «деда».
- source_word: ምሕረቱ
  choice: его сострадание
  rationale: Передаёт значение милости, нежной жалости и сердечной привязанности; «сострадание» естественнее в сочетании с внутренним расположением к Иакову.
- source_word: ወትሤሖ
  choice: возрадовались о нём
  rationale: Сохраняет засвидетельствованный глагол радости или услады, не заменяя его статическим «были на нём».
theological_decisions:
- issue: Неоднозначность местоимений в выражении «он поцеловал его»
  choice: Сохранить местоименную формулировку без явного называния Авраама и Иакова
  alternative: «Авраам поцеловал Иакова семь раз»
  rationale: Контекст указывает на Авраама как действующее лицо, однако источник выражает участников местоимениями; перевод не должен устранять эту формальную неоднозначность без необходимости.
- issue: Образ пребывания Иакова у Авраама
  choice: «на груди у Авраама»
  alternative: «в лоне Авраама»
  rationale: Здесь описана семейная близость во время сна, а не формулируется учение о посмертном состоянии; выбранный вариант избегает внесения позднейших богословских ассоциаций.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «отца своего отца» сохранены, но излишне архаичные слова устранены.
