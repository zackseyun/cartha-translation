  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: ru
  text: 'У них нет сердца, чтобы понимать; глаза их не видят ни того, что они сделали, ни того, как они заблуждаются, говоря дереву: «Ты — мой бог», а камню: «Ты — мой господин и мой избавитель». И нет у них сердца.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  choice: сердца, чтобы понимать
  rationale: Сохраняет библейское представление о сердце как средоточии разумения и прямо передаёт целевую конструкцию.
- source_word: ምንተ፡ ገብሮሙ
  choice: что они сделали
  rationale: Передаёт вопросительно-относительное «что» и глагол совершения/изготовления; в контексте речь об изготовленных ими идолах.
- source_word: ይስኅቱ
  choice: заблуждаются
  rationale: Естественно передаёт значение уклонения с верного пути, не уточняя сверх источника, является ли акцент нравственным или интеллектуальным.
- source_word: አምላኪየ
  choice: мой бог
  rationale: Прямое соответствие богословскому титулу в обращении к деревянному идолу.
- source_word: እግዚእየ
  choice: мой господин
  rationale: Передаёт личное обращение «мой господин/владыка» без деноминационно обусловленной капитализации.
- source_word: መባሕሕየ
  choice: мой избавитель
  rationale: Передаёт роль того, кто спасает или избавляет; «избавитель» естественен в данном параллельном исповедании.
theological_decisions:
- issue: Антропологический образ отсутствия сердца
  choice: Сохранено буквальное «нет сердца»
  alternative: «недостаёт разумения»
  rationale: Источник повторяет образ сердца в начале и конце стиха; его сохранение удерживает риторическое обрамление и библейскую антропологию, не сводя сердце только к интеллекту.
- issue: Статус идольных титулов
  choice: «бог» и «господин» со строчной буквы
  alternative: «Бог» и «Господь»
  rationale: Это ложные притязания, обращённые к дереву и камню; строчная буква ясно отражает контекст, не меняя содержания их речи.
- issue: Характер заблуждения
  choice: Нейтральное «заблуждаются»
  alternative: «впадают в грех» или «совращаются»
  rationale: Формулировка не навязывает источнику более узкое догматическое толкование и сохраняет совмещение духовного, нравственного и познавательного уклонения.
translation_notes:
  register: Современный литературный русский с сохранением торжественного библейского параллелизма. Повтор «нет сердца» удержан намеренно; обращения к дереву и камню оформлены ясно и естественно.
