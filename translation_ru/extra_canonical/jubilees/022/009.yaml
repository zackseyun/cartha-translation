- source_word: ሰይፈ፡ ጸላኢ
  choice: меч врага
  rationale: Буквально передаёт сочетание «меч противника/врага» и естественно звучит по-русски.
- source_word: ኢሞአኒ
  choice: не одолел меня
  rationale: Глагол выражает победу или превосходство над кем-либо; «не одолел меня» сохраняет личный и военный образ.
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ
  choice: во всём, что ты дал мне и моим детям
  rationale: Сохраняет синтаксическую связь с дарованным говорящему и его детям, не уточняя сверх источника, каким образом это относится к победе врага.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: во все дни моей жизни до этого дня
  rationale: Точно передаёт временной охват и использует ясный современный русский язык.
theological_decisions:
- issue: Адресат местоимения второго лица
  choice: ты
  alternative: Ты
  rationale: Строчная буква соответствует современному нейтральному издательскому употреблению и не добавляет к источнику отдельной конфессиональной конвенции; сам контекст обращения сохраняется.
