  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: ru
  text: 'Он приблизился и поцеловал его. И сказал: «Да будут благословенны мой сын Иаков и все его сыновья Господом Всевышним во все века! Да даст тебе Господь праведное потомство, и пусть из твоих потомков освятит посреди всей земли[a]. Да служат тебе народы, и да поклонятся перед твоим потомством все народы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и из твоих потомков да освятит посреди всей земли». Глагол активный («да освятит»), но его дополнение в тексте не выражено; возможное понимание: «да освятит некоторых из твоих потомков».'
    reason: Сохраняет эллиптическую и отчасти синтаксически неоднозначную формулировку исходного текста, не добавляя в основной текст слово «некоторых».
lexical_decisions:
- source_word: ቡሩክ
  choice: да будут благословенны
  rationale: Форма передаёт благословение-пожелание; множественное число по-русски согласовано с составным подлежащим «мой сын Иаков и все его сыновья».
- source_word: ዘርአ፡ ጽድቅ
  choice: праведное потомство
  rationale: Буквально «семя праведности»; сочетание может характеризовать потомство как праведное, что естественно выражено по-русски прилагательным.
- source_word: ይቀድስ
  choice: да освятит
  rationale: Глагол имеет активное, а не возвратное значение; субъектом по контексту остаётся Господь.
- source_word: ይትቀነዩ፡ ለከ
  choice: да служат тебе
  rationale: Глагол выражает служение или подчинение, а не желание.
- source_word: ዘርእከ
  choice: твоё потомство
  rationale: В данном контексте «семя» обозначает потомков; современное русское «потомство» ясно и сохраняет собирательный смысл.
theological_decisions:
- issue: Кого именно Господь освятит из потомков Иакова
  choice: «да освятит некоторых из твоих потомков»
  alternative: 'Буквально: «из твоих потомков да освятит» без явно названного объекта'
  rationale: Предлог እም допускает партитивное понимание, а активный глагол требует подразумеваемого дополнения. Добавление «некоторых» делает синтаксис ясным, не превращая действие в возвратное.
- issue: Источник благословения Иакова и его сыновей
  choice: «Господом Всевышним»
  alternative: «перед Господом Всевышним» или «для Господа Всевышнего»
  rationale: Инструментальное понимание естественно передаёт Господа как подателя благословения и соответствует ближайшему смыслу конструкции.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом благословения. Частица «да» сохраняет последовательность пожеланий и не придаёт тексту архаической тяжеловесности.
