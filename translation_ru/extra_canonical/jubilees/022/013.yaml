  naturalness: 'Торжественный современный литературный регистр выдержан. Формула «Да будут благословенны ... Господом Всевышним» естественна. Для сохранения синтаксической неполноты оригинала и более гладкого русского построения предпочтительно: «и пусть из твоих потомков Он освятит [кого пожелает] посреди всей земли» не годится, так как добавляет смысл; поэтому лучше оставить эллипсис через тире: «и пусть из твоих потомков освятит посреди всей земли».'
