  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: ru
  text: В те дни Измаил пришёл повидать своего отца, и оба они пришли вместе. Исаак заколол жертву благодарения и вознёс её на жертвенник, который сделал его отец в Хевроне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይርአይ፡ አባሁ
  choice: повидать своего отца
  rationale: Передаёт цель прихода — увидеть отца — естественным современным русским выражением.
- source_word: መሥዋዕተ፡ ለጽንሓሕ
  choice: жертву благодарения
  rationale: Сочетание обозначает жертву, приносимую в благодарность; традиционный библейский термин сохраняет культовый смысл.
- source_word: አዕረገ
  choice: вознёс её
  rationale: Глагол буквально связан с вознесением/поднятием и в жертвенном контексте означает принесение жертвы на жертвеннике.
- source_word: ምሥዋዕ
  choice: жертвеннике
  rationale: Устоявшийся русский библейский эквивалент для культового алтаря.
theological_decisions:
- issue: К кому относится выражение «его отец» при упоминании жертвенника
  choice: Сохранена формулировка «его отец» без замены на имя Авраама
  alternative: «который Авраам соорудил»
  rationale: Исходный текст использует родственное обозначение; его сохранение не вносит лишнего истолкования, хотя по контексту речь идёт об Аврааме.
- issue: Характер жертвы
  choice: «жертва благодарения»
  alternative: «жертва в благодарность»
  rationale: Выбран культовый термин, не уточняющий сверх текста точный ритуальный класс жертвы.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Буквально повторяющееся «пришли оба вместе» передано естественным «они встретились»; последовательность действий и родственные обозначения сохранены.
