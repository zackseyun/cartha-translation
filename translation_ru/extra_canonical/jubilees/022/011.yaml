  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: ru
  text: 'И он призвал Иакова и сказал: «Сын мой Иаков, да благословит тебя Бог всего и да укрепит тебя творить праведность и исполнять Его волю пред Ним. И да изберёт Он тебя и твоё потомство, чтобы быть для Него народом наследия по Его воле во все дни».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ
  choice: Бог всего
  rationale: Сохраняет широкое и формально близкое значение геэзского выражения без добавления слова «сущего», отсутствующего в тексте.
- source_word: ለገቢረ፡ ጽድቅ
  choice: творить праведность
  rationale: Передаёт деятельный смысл конструкции и сохраняет библейскую категорию праведности.
- source_word: ወፈቃዱ
  choice: и исполнять Его волю
  rationale: 'В контексте зависимого от «укрепит тебя» ряда по-русски естественно требуется глагольное раскрытие: делать праведность и исполнять Его волю.'
- source_word: በቅድመ፡ ዚአሁ
  choice: пред Ним
  rationale: Формальная библейская передача пространственно-нравственного выражения «перед Ним».
- source_word: ወ'በዘርእከ
  choice: и твоё потомство
  rationale: «Потомство» естественно передаёт коллективное значение «семени» в современном русском языке.
- source_word: ሕዝበ፡ ዘርስት
  choice: народом наследия
  rationale: 'Сохраняет генитивную неоднозначность: это может быть народ, являющийся уделом/наследием Бога, либо народ, связанный с наследием.'
- source_word: በኵሉ፡ መዋዕለ
  choice: во все дни
  rationale: Передаёт временную формулу буквально и естественно, не уточняя, чьи именно дни имеются в виду.
theological_decisions:
- issue: Отношение народа к наследию в выражении ሕዝበ፡ ዘርስት
  choice: народом наследия
  alternative: народом, принадлежащим Ему как наследие
  rationale: Выбранная формулировка не разрешает скрыто грамматическую и богословскую неоднозначность исходного сочетания.
- issue: Объект Божьего избрания и число сказуемого в придаточном
  choice: «тебя и твоё потомство, чтобы вы были»
  alternative: «тебя и твоё потомство, чтобы ты был»
  rationale: Русское множественное число ясно охватывает Иакова и его потомство как совместный объект избрания, тогда как исходная форма допускает коллективное осмысление.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены формулы «да благословит», «да укрепит», «да изберёт» и «пред Ним»; архаизмы, затрудняющие понимание, не используются.
