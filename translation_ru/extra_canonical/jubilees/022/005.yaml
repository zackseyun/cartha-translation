  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: ru
  text: И принёс он мирную жертву и устроил большой радостный пир в присутствии своего брата Измаила. А Ревекка испекла свежие лепёшки из зерна нового урожая и дала их своему сыну Иакову, чтобы тот отнёс их Аврааму, своему отцу[a], из первых плодов земли, — чтобы Авраам поел и благословил Творца всего, прежде чем умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его отцу». Авраам был дедом Иакова; здесь слово «отец» употреблено в более широком смысле — о предке.'
    reason: kinship_ambiguity
lexical_decisions:
- source_word: መድኃኒተ
  choice: мирную жертву
  rationale: В данном жертвенном контексте слово передаёт жертву благополучия/мира; «мирная жертва» — естественный и узнаваемый русский библейский эквивалент.
- source_word: ፍሥሓ
  choice: радостный пир
  rationale: Существительное обозначает радость, ликование; в сочетании с глаголом «устроил/сделал» и усилением естественно передать событие как большой радостный пир.
- source_word: ጻፍንተ፡ ሐዳሰ፡ እምስርናይ፡ ኅዲስ
  choice: свежие лепёшки из зерна нового урожая
  rationale: 'Сохраняет оба элемента новизны: свежеприготовленные лепёшки и новое зерно, не сводя выражение только к празднику жатвы.'
- source_word: እምቀዳሚ፡ ፍሬ፡ ምድር
  choice: как начатки плодов земли
  rationale: Буквально речь идёт о первых плодах земли; «начатки» сохраняют культовый оттенок первоплодов и остаются понятными в контексте.
- source_word: ፈጣሪ፡ ኵሉ
  choice: Творца всего
  rationale: Прямо передаёт титул Бога без конфессионального уточнения.
theological_decisions:
- issue: Обозначение Авраама как отца Иакова
  choice: «Аврааму, своему отцу» с пояснительной сноской
  alternative: «Аврааму, своему деду» или «Аврааму, отцу своего отца»
  rationale: Геэзский текст прямо говорит «его отцу». Хотя по родословию Авраам — дед Иакова, древнее употребление слова «отец» может охватывать предка. Основной текст сохраняет формулировку источника, а сноска предотвращает недоразумение.
- issue: Субъект действий «поел и благословил»
  choice: явно назван Авраам
  alternative: сохранить местоименное «он»
  rationale: По синтаксису целью принесения начатков является то, чтобы Авраам поел и благословил Творца. Повтор имени по-русски устраняет случайную двусмысленность, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но жертвенная и первоплодная терминология сохранена. Английская сноска о Празднике недель не включена, поскольку соответствующая фраза отсутствует в предоставленном геэзском тексте данного стиха.
