base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: ru
  text: Боже мой, да пребудут Твоя милость и Твой мир на Твоём рабе и на потомстве его сыновей, чтобы они были для Тебя избранным народом и наследием среди всех народов земли — отныне и во все дни поколений земли, во веки веков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: Боже мой
  rationale: Передаёт обращение «мой Бог» и сохраняет звательный характер фразы.
- source_word: ሣህልከ፡ ወሰላምከ
  choice: Твоя милость и Твой мир
  rationale: Прямо передаёт парные понятия милости и мира; форма пожелания выражена оборотом «да пребудут».
- source_word: ዘርአ፡ ውሉዱ
  choice: потомстве его сыновей
  rationale: Сохраняет буквальную родословную формулу «семя его сыновей», но выражает её естественным современным русским языком.
- source_word: ሕዝበ፡ ኅሩየ
  choice: избранным народом
  rationale: Точно передаёт значение народа, который избран.
- source_word: ወርስተ፡ እምኵሉ፡ አሕዛበ፡ ምድር
  choice: наследием среди всех народов земли
  rationale: Сохраняет образ наследия и исходный предлог, допускающий значение выделения из среды народов, без добавления конфессионального толкования.
- source_word: ለኵሉ፡ ዓለማት
  choice: во веки веков
  rationale: Естественная торжественная русская формула для всеохватного выражения «на все века».
theological_decisions:
- issue: Отношение избранного народа и наследия к прочим народам
  choice: «избранным народом и наследием среди всех народов земли»
  alternative: «избранным народом и наследием из всех народов земли»
  rationale: Формулировка сохраняет идею особого избрания, но не усиливает неоднозначный предлог до категорического утверждения о происхождении этого народа из всех прочих народов.
translation_notes:
  register: Современный литературный русский с молитвенно-торжественным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Архаическое «семя сыновей» заменено понятным «потомство сыновей», тогда как библейские понятия «избранный народ» и «наследие» сохранены.
