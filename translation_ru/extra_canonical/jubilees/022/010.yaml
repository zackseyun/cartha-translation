revisions:
- from: Боже мой, да пребудут Твоя милость и Твой мир на Твоём рабе и на потомстве его сыновей, чтобы они стали для Тебя избранным народом и наследием среди всех народов земли — отныне и во все дни поколений земли, во веки веков.
  to: Боже мой, да пребудут Твоя милость и Твой мир на Твоём рабе и на потомстве его сыновей, чтобы они были для Тебя избранным народом и наследием среди всех народов земли — отныне и во все дни поколений земли, во веки веков.
  rationale: Исправлено только «стали» на «были», чтобы сохранить целевое пожелание исходного текста без добавления смысла становления. Смысловое соотнесение наследия с Богом уже выражено оборотом «для Тебя» и не нуждается в дополнительных толковательных уточнениях. Структурных ошибок и необходимых сносок нет.
