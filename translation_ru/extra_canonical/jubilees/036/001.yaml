  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: ru
  text: 'И в шестой год этой седмины Исаак позвал двух своих сыновей, Исава и Иакова. Они пришли к нему, и он сказал им: «Сыновья мои, я иду путём моих отцов — в вечный дом, где пребывают мои отцы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝሱባዔ
  choice: этой седмины
  rationale: Сохраняет специальное юбилейное обозначение семилетнего периода и отличает его от обычной недели.
- source_word: እሐውር፡ ውስተ፡ ፍኖተ፡ አበውየ
  choice: я ухожу путём моих отцов
  rationale: Передаёт эвфемистический образ смерти без его прямого истолкования и сохраняет метафору исходного текста.
- source_word: ቤት፡ ዘለዓለም
  choice: вечный дом
  rationale: Формально и естественно передаёт устойчивый образ места пребывания умерших.
- source_word: ሀለዉ፡ ህየ
  choice: где пребывают
  rationale: Литературное «пребывают» уместно для торжественной речи о предках и не добавляет уточнений о загробном состоянии.
theological_decisions:
- issue: Смысл выражений «путь моих отцов» и «вечный дом»
  choice: Сохранить образный язык смерти и посмертного пребывания без поясняющего толкования.
  alternative: 'Передать прямо: «я скоро умру и присоединюсь к своим предкам».'
  rationale: Исходный текст выражается эвфемистически и оставляет природу «вечного дома» неопределённой; прямое толкование устранило бы эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Седмина» сохранена как термин семилетнего цикла; синтаксис разделён на два предложения ради естественности и ясности.
