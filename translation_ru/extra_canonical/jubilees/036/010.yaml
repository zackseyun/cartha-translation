base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: ru
  text: И в день смятения, проклятия, ярости и гнева, в пылающем, пожирающем огне, — как Он сжёг Содом, так сожжёт его землю, его город и всё, что ему принадлежит. Он будет изглажен из книги наставления сынов человеческих[a] и не войдёт в книгу жизни, но — в то, что предназначено для погибели; он перейдёт под вечное проклятие. И во все дни их суд будет вновь и вновь обновляться[b] поношением, проклятием, гневом, мучением, яростью, карами и вечной болезнью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «книга наставления сынов человеческих» в геэзском тексте трудно для толкования. По-видимому, это не то же самое, что «книга жизни», однако точный смысл названия неизвестен.
    reason: textual_variant
  - marker: b
    text: В опубликованном геэзском тексте соответствующее слово, вероятно, повреждено; по принятому исправлению здесь читается «их суд». Оборот «будет вновь и вновь обновляться» передаёт буквальное «обновляться».
    reason: textual_variant
lexical_decisions:
- source_word: ሁከት
  choice: смятение
  rationale: Передаёт бедствие и общественный хаос, сохраняя возвышенный тон перечня.
- source_word: መርገም
  choice: проклятие
  rationale: Прямой и устойчивый русский эквивалент; повтор сохранён там, где он повторяется в источнике.
- source_word: ቍጥዓ / መዓት
  choice: ярость / гнев
  rationale: Два соседних слова переданы разными близкими понятиями, чтобы не сгладить накопление синонимичных обозначений Божьего воздаяния.
- source_word: መጽሐፈ ተግሣጸ ውሉደ ሰብእ
  choice: книга наставления сынов человеческих
  rationale: Формально сохраняет отличие этой книги от следующей «книги жизни»; значение названия первой книги остаётся не вполне ясным.
- source_word: መጽሐፈ ሕይወት
  choice: книга жизни
  rationale: Традиционный и прозрачный библейский эквивалент.
- source_word: ጽእለት
  choice: поношение
  rationale: Передаёт враждебное проклятие или хулу, не сливая этот термин с последующим መርገም.
- source_word: መቅሠፍት
  choice: кары
  rationale: По контексту обозначает поражения или бедствия как наказание; «кары» естественно входит в риторический перечень.
theological_decisions:
- issue: Соотношение «книги наставления сынов человеческих» и «книги жизни»
  choice: Сохранены как две различно названные книги.
  alternative: Истолковать первую как иное название книги жизни или как конкретный небесный реестр.
  rationale: Геэзский текст явно различает названия, но не объясняет точную природу первой книги; перевод не должен устранять эту неопределённость.
- issue: Субъект сожжения Содома и грядущего суда
  choice: Местоимение «Он» написано с прописной буквы как указание на Бога в контексте суда.
  alternative: Оставить строчную букву и не уточнять референт.
  rationale: Глагольное сопоставление с сожжением Содома указывает на божественного Судью, однако в текст не добавлено отдельное имя.
- issue: Единственное и множественное число в конце стиха
  choice: Сохранён переход от осуждённого в единственном числе к «суду над ними» во множественном.
  alternative: Унифицировать весь стих в единственном числе.
  rationale: Источник даёт форму «их суд»; её не следует молча исправлять ради синтаксической гладкости.
