revisions:
- from: И в день смятения, проклятия, ярости и гнева пожирающий огонь запылает; как Он сжёг Содом, так сожжёт его землю, его город и всё, что ему принадлежит. Он будет изглажен из книги наставления сынов человеческих[a] и не войдёт в книгу жизни, а окажется в той, что предназначена для погибели; он отойдёт под вечное проклятие. И во все дни суд над ними будет вновь и вновь совершаться[b] с поношением, проклятием, гневом, мучением, яростью, карами и вечной болезнью.
  to: И в день смятения, проклятия, ярости и гнева, в пылающем, пожирающем огне, — как Он сжёг Содом, так сожжёт его землю, его город и всё, что ему принадлежит. Он будет изглажен из книги наставления сынов человеческих[a] и не войдёт в книгу жизни, но — в то, что предназначено для погибели; он перейдёт под вечное проклятие. И во все дни их суд будет вновь и вновь обновляться[b] поношением, проклятием, гневом, мучением, яростью, карами и вечной болезнью.
  rationale: Правка восстанавливает синтаксическую функцию оборота об огне, не превращая его в отдельное действие, и устраняет ложное отождествление неопределённого «предназначенного для погибели» с книгой. Финальная формула уточнена в соответствии с текстологическим исправлением и значением «обновляться». Прописное «Он» сохранено как принятое в черновике контекстуальное обозначение божественного Судьи.
