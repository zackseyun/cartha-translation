  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: ru
  text: И вы, сыновья мои, живите между собой в любви, любя своих братьев, как человек любит собственную жизнь[a], и каждый пусть ищет для брата того, что ему во благо. Действуйте сообща на земле и любите друг друга, как самих себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою душу»; это слово также может означать жизнь или самого человека.'
    reason: lexical_ambiguity
  - marker: b
    text: 'В исходном тексте глагол стоит в 3-м лице множественного числа: «пусть они любят друг друга»; буквально: «как свои души».'
    reason: grammatical_person_shift
lexical_decisions:
- source_word: ውሉድየ
  choice: сыновья мои
  rationale: В контексте отцовского наставления передаёт форму обращения естественно и точно; возможное более широкое значение «дети мои» здесь не требуется.
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: любя своих братьев
  rationale: Сохранено второе лицо множественного числа исходного текста и множественное «братьев», без перехода к распределительному третьему лицу.
- source_word: ነፍሶ
  choice: собственную жизнь
  rationale: Эфиопское слово может означать «душу», «жизнь» или «самого себя»; в сравнении с человеческой любовью естественно звучит «жизнь», при этом буквальная образность отмечена в сноске.
- source_word: ይኀሥሥ
  choice: пусть ищет
  rationale: Передаёт стремление и деятельную заботу о благе брата, не сужая смысл до одного лишь пожелания.
- source_word: በገቢረ፡ ኅቡረ
  choice: трудитесь сообща
  rationale: Естественная русская передача идеи совместного действия или труда; сохраняет деятельный характер наставления.
theological_decisions:
- issue: Любовь к брату сопоставлена с любовью к собственной «душе/жизни».
  choice: как человек любит собственную жизнь; как самих себя
  alternative: как человек любит собственную душу; как свою душу
  rationale: Выбран современный и понятный русский оборот без догматического уточнения природы души; семантическая широта исходного слова сохранена в сноске.
- issue: В последней клаузе исходный текст переходит к форме третьего лица множественного числа.
  choice: любите друг друга
  alternative: пусть они любят друг друга
  rationale: Прямое обращение к сыновьям и ход наставления требуют второго лица для ясного русского текста, однако формальный сдвиг оригинала не скрыт и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством отцовского наставления. Синтаксис слегка выровнен ради естественности, но сохранены прямая адресация, взаимная братская любовь, поиск блага для брата и совместный труд.
