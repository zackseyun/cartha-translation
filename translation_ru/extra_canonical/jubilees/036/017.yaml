lexical_decisions:
- source_word: ብእሲ
  choice: мужа
  rationale: Форма продолжает синтаксис предшествующего контекста; «муж» сохраняет достоинство древнего повествовательного регистра, оставаясь понятным.
- source_word: ዘይገብር፡ ጽድቀ
  choice: который творит праведность
  rationale: Передаёт деятельное значение ገብረ и сохраняет библейское сочетание с абстрактным существительным «праведность».
- source_word: ኪያሁ፡ ወዘርኦ
  choice: его и его потомство
  rationale: ዘር обозначает семя или потомство; в отношении людей естественный русский эквивалент — «потомство».
- source_word: እስከ፡ ለዓለም
  choice: вовеки
  rationale: Краткая традиционная передача значения вечной длительности, соответствующая возвышенному регистру.
- source_word: ይኤዝዞሙ
  choice: наставлять их
  rationale: Глагол имеет значение повеления или наставления; в контексте предсмертных указаний «наставлять» звучит естественно и не ослабляет авторитет речи.
- source_word: ኅቡረ
  choice: вместе
  rationale: Передаёт совместность трапезы без избыточной буквальности.
- source_word: ተፈሥሑ
  choice: радовались
  rationale: Прямой и естественный эквивалент глагола радости.
theological_decisions:
- issue: Связь праведного поступка с благословением потомства
  choice: Сохранена формула «его и его потомство вовеки» без пояснения причинной или заветной природы связи.
  alternative: 'Уточнить: «благословен будет он и его потомство».'
  rationale: Данный фрагмент начинается внутри предложения, а в представленном геэзском тексте сказуемое из предыдущего контекста отсутствует; добавление «благословен» разрешило бы синтаксическую лакуну без достаточного основания в самом отрывке.
- issue: Характер наставления патриарха
  choice: «наставлять»
  alternative: «повелевать» / «давать заповеди»
  rationale: Выбор сохраняет авторитетность, но не вводит специальной богословской категории «заповеди», которой источник здесь прямо не требует.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальная строчная буква и финальная запятая сохранены, поскольку стих представляет собой фрагмент предложения и продолжается далее. Маркеры сносок не требуются.
