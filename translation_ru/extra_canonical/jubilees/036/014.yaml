  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: ru
  text: 'И сказал Исав: «Я продал это Иакову и отдал первородство Иакову; пусть оно будет отдано ему. Мне нечего сказать об этом, потому что оно принадлежит ему».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «нет у меня слова, которое я сказал бы об этом, ибо оно — его».'
    reason: Отмечает более буквальную форму исходной идиомы и местоименного утверждения, естественно переданных в основном тексте.
lexical_decisions:
- source_word: ልህቃነ
  choice: первородство
  rationale: По контексту сделки Исава и Иакова речь идёт о праве первородства; существительное передано естественным и устойчивым русским соответствием.
- source_word: ወይትወሀብ፡ ሎቱ
  choice: пусть оно будет отдано ему
  rationale: Сохранены пассивная форма и волеизъявление исходного выражения без уточнения того, кто должен это отдать.
- source_word: ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: мне нечего сказать об этом
  rationale: Естественно передаёт буквально более развёрнутое выражение «нет у меня слова, которое я сказал бы об этом».
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: потому что оно принадлежит ему
  rationale: Передаёт причинное утверждение «ибо оно — его» и соотносит местоимение с первородством.
theological_decisions:
- issue: Характер передачи первородства
  choice: «продал это» и «отдал первородство» сохранены как два отдельных утверждения
  alternative: Объединить их в одно утверждение о продаже первородства
  rationale: Исходный текст использует два глагольных высказывания; их разграничение сохраняет формальную и смысловую структуру без гармонизирующего сокращения.
translation_notes:
