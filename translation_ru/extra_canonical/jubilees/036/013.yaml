  text: And he said, “I give this greater share to the man who was born first.”
translation:
  language: ru
  text: 'И он сказал: «Эту большую долю я даю человеку, который родился первым».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  choice: я отдам
  rationale: Форма глагола «давать» передана естественным русским будущим временем, выражающим решение говорящего о распределении доли.
- source_word: ዘንተ፡ ዕበየ
  choice: эту бо́льшую долю
  rationale: Указательное слово ዘንተ передано как «эту», а ዕበየ — как сравнительное «бо́льшую»; слово «долю» добавлено по смыслу распределения имущества и соответствует контексту консультационного английского текста.
- source_word: ለብእሲ
  choice: человеку
  rationale: Буквально обозначает мужчину или человека; «человеку» здесь звучит по-русски естественно и сохраняет прямое указание на лицо.
- source_word: ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: который родился первым
  rationale: Сохранена относительная конструкция и буквальный акцент на первенстве рождения, без замены богословски или юридически более нагруженным словом «первенец».
theological_decisions:
- issue: Первенство рождения
  choice: который родился первым
  alternative: первенцу
  rationale: Исходный текст описывает факт рождения первым, а не употребляет отдельный титул; выбранный вариант не усиливает возможный юридический или богословский смысл.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной конструкцией. Ударение в «бо́льшую» графически отмечено, чтобы исключить чтение «большу́ю» и ясно передать сравнительную степень.
