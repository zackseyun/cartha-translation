  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: ru
  text: И в тот день он разделил между ними всё своё имущество и дал бо́льшую долю тому, кто родился первым, а также башню[a] со всем, что было вокруг неё, и всё, что Авраам приобрёл у Колодца Клятвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Башня» может означать отдельное строение, входившее во владения Исаака. Перечень наследства здесь краток, а соответствующее место исходного текста трудно для истолкования.
    reason: cultural_note
lexical_decisions:
- source_word: ጥሪተ
  choice: имущество
  rationale: Явно передаёт названные в источнике владения или собственность, не сводя выражение к неопределённому «всё, что у него было».
- source_word: ዕበየ
  choice: бо́льшую долю
  rationale: В контексте раздела имущества обозначает преимущественную, более крупную часть наследства.
- source_word: ብእሲ
  choice: тому, кто
  rationale: Эфиопское существительное буквально значит «мужчина/человек», но в русском явное «мужчине, который родился первым» звучало бы неестественно; значение лица сохраняется относительной конструкцией.
- source_word: ማኅፈደ
  choice: башню
  rationale: Следует традиционному пониманию трудного слова как обозначения башни или отдельного строения усадьбы; неопределённость отмечена в сноске.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодца Клятвы
  rationale: Буквально передаёт топонимическое выражение «колодец клятвы», сохраняя его связь с библейским названием места.
