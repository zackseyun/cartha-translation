  yaml_path: translation/extra_canonical/jubilees/036/002.yaml
  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: ru
  text: И похороните меня рядом с Авраамом, моим отцом, в двойной пещере на поле Ефрона, хеттеянина, которое Авраам приобрёл там как место для погребения. Там, в гробнице, которую я выкопал для себя, похороните меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅሩበ
  choice: рядом с
  rationale: Передаёт пространственное значение «близ, возле» естественным современным русским выражением.
- source_word: ባዐት፡ ዘካዕበት
  choice: двойная пещера
  rationale: Формально сохраняет традиционное обозначение пещеры Махпела как «двойной пещеры», не подменяя его именем собственным, отсутствующим в данном тексте.
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: Ефрона-хеттеянина
  rationale: Передаёт имя и этноним; дефисное приложение звучит компактно и ясно по-русски.
- source_word: አጥረየ
  choice: приобрёл
  rationale: Нейтрально передаёт получение места Авраамом в собственность, не уточняя способ сделки сверх текста.
- source_word: ከረይኩ
  choice: высек
  rationale: В контексте гробницы глагол естественно означает устройство посредством высекания; это точнее русского «выкопал» для скальной гробницы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «Авраамом, отцом моим» сохраняет достоинство речи, а остальной синтаксис сделан ясным для обычного читателя. Повтор «там» и заключительное «похороните меня» сохранены как смысловое и риторическое усиление оригинала.
