  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: ru
  text: Пусть каждый любит своих братьев с милосердием и праведностью, и пусть никто не желает зла своему брату отныне и вовеки, во все дни вашей жизни, чтобы вы преуспевали во всех своих делах и не погибли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐዱ፡ አሐዱ
  choice: каждый
  rationale: Повторительное сочетание передаёт распределительное значение «каждый [из вас]».
- source_word: እኅዋሁ
  choice: своих братьев
  rationale: В первой части стиха источник употребляет множественное число; возвратное «своих» естественно соотносит братьев с каждым действующим лицом.
- source_word: በምሕረት፡ ወበጽድቅ
  choice: с милосердием и праведностью
  rationale: Сохраняются оба нравственных понятия и инструментально-образный оттенок предлога በ-.
- source_word: ወኢይፈቅድ
  choice: и пусть никто не желает
  rationale: Глагол выражает желание или намерение; отрицательная конструкция естественно передана современным русским увещеванием.
- source_word: በእኁሁ
  choice: своему брату
  rationale: Во второй части источник употребляет единственное число, в отличие от предшествующего множественного.
- source_word: ከመ፡ ትሠርሑ
  choice: чтобы вы преуспевали
  rationale: В контексте благополучного исхода дел форма передаёт успешное совершение, а не просто нейтральное «делать».
- source_word: ወኢትትሐጐሉ
  choice: и не погибли
  rationale: Сохраняется сильный отрицательный итог — гибель или уничтожение — без ослабления до простой неудачи.
theological_decisions:
- issue: Соотношение милосердия и праведности
  choice: с милосердием и праведностью
  alternative: милостиво и справедливо
  rationale: Именная форма сохраняет абстрактные нравственно-богословские понятия источника и не сводит «праведность» только к человеческой справедливости.
- issue: Сила заключительного предостережения
  choice: не погибли
  alternative: не были уничтожены
  rationale: «Не погибли» естественно и весомо по-русски, сохраняя возможность как личной гибели, так и более широкого разорения, без уточнения действующего лица.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Сохранён переход от единственного распределительного «каждый» к обращению во множественном числе «вашей… вы», а также контраст множественного «братьев» и единственного «брату».
