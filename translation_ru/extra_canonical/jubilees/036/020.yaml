lexical_decisions:
- source_word: ኀደረ
  choice: жил
  rationale: Передаёт продолжительное пребывание естественным современным русским языком.
- source_word: ውስተ፡ ደብረ፡ ኬብሮን
  choice: на горе Хеврон
  rationale: Сохраняет географическую конструкцию и традиционную русскую форму имени.
- source_word: ውስተ፡ ማኅደድ፡ ዘምድረ፡ ፍልሰተ
  choice: в башне в земле странствования
  rationale: Сохраняет как «башню», так и присутствующее в геэз элемент «земля», не опуская уточнение исходного текста.
- source_word: ወአምላከ
  choice: и поклонялся
  rationale: В контексте служения Богу глагол естественно передаётся как «поклонялся».
- source_word: በኵሉ፡ ልቡ
  choice: всем сердцем
  rationale: Устойчивая и точная русская передача выражения полноты внутренней преданности.
- source_word: ትእዛዛት
  choice: заповеди
  rationale: Множественное число и религиозный контекст лучше всего передаются словом «заповеди».
- source_word: ዘያስተርኢ
  choice: открытые ему
  rationale: Передаёт значение явления или откровения; добавление «ему» делает синтаксическую связь естественной по-русски, не уточняя субъекта откровения.
theological_decisions:
- issue: Передача божественного имени እግዚአብሔር
  choice: Господу
  alternative: ГОСПОДУ
  rationale: «Господь» соответствует традиционному русскому библейскому употреблению; исходная форма в данном месте сама по себе не требует типографического обозначения тетраграмматона прописными буквами.
- issue: Связь поклонения с заповедями
  choice: «поклонялся Господу всем сердцем, соблюдая открытые ему заповеди»
  alternative: «поклонялся Господу всем сердцем и согласно заповедям, как они были открыты»
  rationale: Русская деепричастная конструкция естественно выражает образ поклонения и сохраняет связь с заповедями, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены конкретные детали геэзского текста, включая «башню» и «землю странствования»; громоздкая буквальная концовка перестроена ради ясности.
