  source_fidelity: 'Начальная часть передана точно: Иаков пребывает на горе Хеврон, в башне, связанной с землёй странствования его отца Авраама. Однако деепричастие «соблюдая» сужает и перестраивает исходную координацию: в тексте говорится о поклонении всем сердцем и о соответствии заповедям в том виде, в каком они были открыты, а не прямо о соблюдении заповедей как отдельном действии.'
