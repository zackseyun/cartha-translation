  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: ru
  text: 'И вот что я заповедую вам, сыновья мои: творите праведность и справедливость на земле, да приведёт Господь на вас всё, что Господь сказал, что сделает для Авраама и его потомства.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: праведность и справедливость
  rationale: Передаёт парные понятия «праведность» и «прямота/справедливость» естественным современным русским языком, не сливая их в одно.
- source_word: ያምጽእ፡ ... ላዕሌክሙ
  choice: исполнил для вас
  rationale: Буквально выражение означает «навёл/привёл на вас», но в контексте обещанного Аврааму по-русски естественнее «исполнил для вас»; благоприятный смысл не превращается в угрозу.
- source_word: ዘርኡ
  choice: его потомства
  rationale: В данном родословно-обетовательном контексте геэзское «семя» обозначает потомство; современное русское соответствие ясно передаёт собирательный смысл.
theological_decisions:
- issue: Связь повеления с исполнением Божьего обещания
  choice: чтобы Господь исполнил для вас
  alternative: и тогда Господь исполнит для вас
  rationale: Сохранена целевая конструкция источника без уточнения характера причинной связи между праведным поведением и исполнением обещания.
- issue: Содержание сказанного Аврааму
  choice: что Он обещал сделать для Авраама
  alternative: что Господь сказал, что сделает для Авраама
  rationale: «Обещал сделать» естественно выражает контекст Божьего слова о будущем, при этом не добавляет конкретного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Обращение «сыновья мои» и глагол «заповедую» сохраняют патриархальный и наставительный регистр; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской практике.
