  language: en
  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: ru
  text: Помните, сыновья мои, Господа, Бога Авраама, отца вашего, и как я поклонялся Ему[a] и служил Ему в праведности и радости, чтобы Он умножил вас и сделал ваше потомство многочисленным, как звёзды небесные, и насадил вас в земле, как насаждение праведности, которое не будет искоренено навеки, во все поколения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В печатном геэзском тексте стоит форма, буквально означающая «мой Бог»; в данном контексте она, вероятно, испорчена. Перевод следует распространённому восстановлению: «я поклонялся Ему».'
    reason: Отмечает вероятное текстологическое восстановление и сохраняет прозрачность в отношении спорного чтения.
lexical_decisions:
- source_word: ተዘከርዎ
  choice: Помните
  rationale: Императив множественного числа естественно и точно передаётся русским «помните».
- source_word: ለእግዚአብሔር
  choice: Господа
  rationale: Стандартная литературная передача традиционного геэзского обозначения Бога.
- source_word: አምላክየ
  choice: я поклонялся Ему
  rationale: Форма в издании, вероятно, испорчена; контекст и текстологически предполагаемое чтение አምለክዎ поддерживают значение «я поклонялся Ему».
- source_word: ወተቀነዩኩ፡ ሎቱ
  choice: и служил Ему
  rationale: Глагол выражает служение или подчинённое служение; «служил Ему» точно и естественно в контексте.
- source_word: ተክለ፡ ጽድቅ
  choice: насаждение праведности
  rationale: Сохраняет растительную метафору и её качественное определение без сведения образа к одному конкретному виду растения.
- source_word: ዘኢይሤረዉ
  choice: которое не будет искоренено
  rationale: Передаёт образ вырывания с корнем и согласуется с метафорой насаждения.
theological_decisions:
- issue: Цель или ожидаемый результат верного служения
  choice: чтобы Он умножил вас
  alternative: и тогда Он умножит вас
  rationale: Геэзское ከመ с последующими глаголами допускает целевое прочтение; сохранена целевая связь исходного текста без превращения её в безусловное обещание.
- issue: Неясное чтение አምላክየ
  choice: и как я поклонялся Ему и служил Ему
  alternative: и я также посвятил себя Ему
  rationale: Учитывается вероятная текстовая порча и признанное восстановление глагола «поклоняться»; при этом следующий отдельный глагол передан как «служил», чтобы не опустить ни один смысловой элемент.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Синтаксис сохранён как единое наставление, но сформулирован понятно для обычного читателя; образ «насаждения праведности» оставлен намеренно, поскольку он существенен для исходной метафоры.
