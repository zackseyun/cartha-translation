  source_fidelity: Перевод в целом точно передаёт смысл геэзского текста и обоснованно следует вероятному восстановлению испорченного чтения አምላክየ как «я поклонялся Ему». Однако это текстологическое решение следует отметить сноской. Образ «насадить ... как насаждение праведности» сохранён; предлог «в земле» точнее передаёт локативный образ оригинала, чем «на земле».
