  to: И ныне я призываю вас поклясться великой клятвой, ибо нет клятвы более великой, чем эта, — славным, почитаемым, великим, величественным, дивным и могущественным именем Того, Кто сотворил небеса, землю и всё сущее в совокупности[a], — чтобы вы боялись Его и поклонялись Ему.
