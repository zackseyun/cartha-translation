  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: ru
  text: И ныне я призываю вас поклясться великой клятвой, ибо нет клятвы более великой, чем эта, — славным, почитаемым, великим, величественным, дивным и могущественным именем Того, Кто сотворил небеса, землю и всё сущее в совокупности[a], — чтобы вы боялись Его и поклонялись Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё творение».'
    reason: Буквальное выражение включает «всё» и «вместе/в совокупности»; его можно понимать как собирательное обозначение всего творения.
lexical_decisions:
- source_word: አምሕለክሙ
  choice: заклинаю вас клятвой
  rationale: Каузативная форма выражает побуждение адресатов поклясться; русское «заклинаю вас ... клятвой» сохраняет торжественный характер и естественнее буквального «заставляю вас поклясться» в данном контексте.
- source_word: ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: славным, почитаемым, великим, величественным, дивным и могущественным
  rationale: Сохранена полная шестичленная цепочка эпитетов имени; «величественный» передаёт здесь смысл обширности и великолепия без неестественного «пространный».
- source_word: ወኵሎ፡ ኅቡረ
  choice: и всё вместе
  rationale: Формулировка удерживает значение «всё» и явно передаёт ኅቡረ «вместе», не заменяя его обобщающим толкованием «всё творение».
- source_word: ከመ፡ ትኩኑ፡ እለ፡ ትፈርህዎ፡ ወእለ፡ ታመልከዎ
  choice: чтобы вы боялись Его и поклонялись Ему
  rationale: Естественная русская передача целевой конструкции; буквальное повторение «были теми, кто» стилистически тяжеловесно и не добавляет смыслового оттенка.
theological_decisions:
- issue: Объект клятвы — имя Творца
  choice: славным ... именем Того, Кто сотворил
  alternative: самим Творцом
  rationale: Сохранено прямое упоминание имени как того, чем заклинают; оно не заменено богословски близким, но менее точным обозначением личности Творца.
- issue: Значение выражения «всё вместе»
  choice: 'основной текст: «всё вместе»'
  alternative: «всё творение»
  rationale: Основной текст следует лексической форме источника и сохраняет возможную собирательную широту, а альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем речи. Заглавные местоимения «Его», «Ему» и обозначение «Того, Кто» применены как принятая русская типографическая форма благоговейного упоминания Бога; архаизмы и конфессионально маркированная терминология избегаются.
