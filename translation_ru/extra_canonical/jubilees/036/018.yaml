  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: ru
  text: Между ними был мир. Они вышли от него, в тот день отдыхали и спали. Исаак же в тот день спал в своей постели, радуясь, и уснул вечным сном, и умер в возрасте ста восьмидесяти лет. Он завершил двадцать пять седмин и пять лет[a]. И похоронили его оба его сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь «седмина» означает период в семь лет: двадцать пять седмин составляют 175 лет, а вместе с пятью годами — 180 лет.'
    reason: cross_reference
lexical_decisions:
- source_word: ዐርዮ
  choice: мир
  rationale: Передаёт состояние мира и согласия между сыновьями без добавления причинной связи, которой в исходном тексте нет.
- source_word: እንዘ፡ ይትፌሣሕ
  choice: радуясь
  rationale: Сохраняет обстоятельное значение геэзского оборота и естественно звучит в современном русском повествовании.
- source_word: ንዋመ፡ ዘለዓለም
  choice: вечным сном
  rationale: Буквально сохраняет эвфемистический образ смерти, после которого источник отдельно добавляет «и умер».
- source_word: ሱባዔ
  choice: седмин
  rationale: Сохраняет календарный термин, обозначающий семилетние периоды; значение пояснено в сноске.
- source_word: ፈጸመ
  choice: завершил
  rationale: Отражает отдельный глагол исходного текста и не подчиняет ему предшествующее сообщение о возрасте в 180 лет.
theological_decisions:
- issue: Соотношение выражений «уснул вечным сном» и «умер»
  choice: Сохранены оба выражения
  alternative: Объединить их в одно сообщение о смерти
  rationale: Повтор присутствует в источнике и поддерживает его образность и богословскую напряжённость, не объясняя природу «вечного сна».
- issue: Календарное обозначение возраста
  choice: 'Сохранено как отдельное предложение: «завершил двадцать пять седмин и ещё пять лет»'
  alternative: 'Передать как пояснение: «то есть прожил двадцать пять седмин и пять лет»'
  rationale: Исходный текст сначала сообщает возраст в 180 лет, а затем отдельно даёт календарное резюме; выбранная структура сохраняет этот синтаксис.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис упрощён лишь там, где это необходимо для ясности; повтор «уснул вечным сном, и умер» и отдельное календарное резюме сохранены. Имена сыновей не добавлены, поскольку в данном стихе исходный текст их не называет.
