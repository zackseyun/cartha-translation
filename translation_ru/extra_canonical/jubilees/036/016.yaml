  text: And my heart has rejoiced concerning the birthright, that you did not do violence concerning it. May the LORD bless you
translation:
  language: ru
  text: И сердце моё возрадовалось о первородстве, потому что ты не совершил насилия из-за него.[a] Да благословит тебя Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что ты не совершил над ним насилия».'
    reason: Предложная конструкция допускает понимание первородства как предмета насилия, а не только как его причины.
lexical_decisions:
- source_word: ልህቃን
  choice: первородство
  rationale: Слово обозначает право или положение первенца; «первородство» естественно передаёт это понятие в библейском контексте.
- source_word: ኢትግበር
  choice: ты не совершил
  rationale: 'Сохранена активная форма второго лица единственного числа: обращённый к Исаву глагол не следует передавать безличной или пассивной конструкцией.'
- source_word: ፁገ
  choice: насилия
  rationale: Передаёт значение насильственного, неправедного действия без уточнения его вида, которого источник не называет.
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Стандартное достоинственное соответствие; определение «Всевышний» в источнике отсутствует.
theological_decisions:
- issue: Связь насилия с первородством
  choice: «ты не совершил из-за него насилия»
  alternative: «ты не поступил с ним насильно»
  rationale: Предложная конструкция допускает оттенки причины и предмета действия. Основной текст естественно связывает возможное насилие с первородством, не уточняя его объект.
- issue: Адресат благословения
  choice: «Да благословит тебя Господь»
  alternative: «Да благословит Господь»
  rationale: Форма глагола и непосредственное обращение поддерживают значение второго лица; явное «тебя» устраняет неестественную обрывочность, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «сердце моё» и формула «Да благословит» сохраняют достоинство речи, оставаясь понятными современному читателю.
