  source_fidelity: 'В целом переданы все элементы текста: радость сердца, первородство, активное отрицательное действие адресата и заключительное благословение. Второе лицо в «ты не совершил» и явное «тебя» в благословении верно отражают смысл и контекст. Связь насилия с первородством остаётся синтаксически неоднозначной, как и в источнике.'
  naturalness: «Совершил из-за него насилия» звучит несколько тяжеловесно и менее естественно по-русски из-за генитивной конструкции после «совершил». «Не совершил насилия из-за него» сохраняет тот же смысл, но читается лучше. «Возрадовалось о первородстве» допустимо в умеренно библейском регистре.
