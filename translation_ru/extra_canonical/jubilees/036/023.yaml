base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: ru
  text: Ибо после смерти Рахили, её сестры, он любил её чрезвычайно сильно, потому что она была безупречна и праведна во всех своих путях и почитала Иакова. Во все дни её жизни с ним он не слышал из её уст ни одного резкого слова, потому что в ней были кротость, миролюбие, праведность и достоинство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что она была кроткой, миролюбивой, праведной и достойной».'
    reason: Альтернативная, более идиоматическая передача ряда абстрактных существительных, за которыми в оригинале следует выражение «в ней».
lexical_decisions:
- source_word: ያፈቅራ፡ ፈድፋደ፡ ጥቀ
  choice: полюбил её чрезвычайно сильно
  rationale: Передаёт усиленную конструкцию со значением чрезвычайной, весьма сильной любви, сохраняя естественный русский порядок слов.
- source_word: ፍጽምት፡ ወሬትዕት
  choice: безупречна и праведна
  rationale: 'Сохраняет два различных качества: цельность/безупречность и нравственную прямоту/праведность.'
- source_word: በኵሉ፡ ፍናዊሃ
  choice: во всех своих путях
  rationale: Сохраняет библейскую метафору поведения и образа жизни, не сводя её к пояснительному «во всех поступках».
- source_word: ወታከብሮ፡ ለያዕቆብ
  choice: и почитала Иакова
  rationale: Глагол передаёт уважение и оказание чести; «почитала» уместно в dignified modern literary register.
- source_word: ቃለ፡ ድሩከ
  choice: ни одного резкого слова
  rationale: Естественно передаёт выражение о грубом или суровом слове; отрицательное «ни одного» согласовано с глаголом «не услышал».
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ፡ ባቲ
  choice: в ней были кротость, миролюбие, праведность и достоинство
  rationale: 'Сохраняет формальную структуру оригинала: ряд абстрактных существительных и заключительное «в ней»; «миролюбие» естественнее описывает качество человека, чем просто «мир».'
theological_decisions:
- issue: Смысл «праведности» в описании Лии
  choice: праведна / праведность
  alternative: пряма / прямота
  rationale: Контекст описывает нравственное качество, но не требует конфессионального толкования; «праведность» сохраняет традиционную библейскую ёмкость термина.
- issue: Передача заключительного ряда абстрактных качеств
  choice: в ней были кротость, миролюбие, праведность и достоинство
  alternative: она была кроткой, миролюбивой, праведной и достойной
  rationale: Выбран вариант, грамматически близкий к геэзскому тексту и сохраняющий акцент на качествах, пребывавших «в ней»; альтернативное адъективное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены метафора «пути», имя Иаков и формальная структура заключительного перечня; архаизмы и конфессионально окрашенные уточнения не вводились.
