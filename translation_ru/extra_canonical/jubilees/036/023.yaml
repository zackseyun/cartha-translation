revisions:
- from: Ведь после смерти её сестры Рахили он полюбил её чрезвычайно сильно, потому что она была безупречна и праведна во всех своих путях и почитала Иакова. За все дни, что она прожила с ним, он не услышал из её уст ни одного резкого слова, потому что в ней были кротость, миролюбие, праведность и достоинство.[a]
  to: Ибо после смерти Рахили, её сестры, он любил её чрезвычайно сильно, потому что она была безупречна и праведна во всех своих путях и почитала Иакова. Во все дни её жизни с ним он не слышал из её уст ни одного резкого слова, потому что в ней были кротость, миролюбие, праведность и достоинство.[a]
  rationale: Исправлен вид глагола «полюбил» на «любил», чтобы не утверждать начало любви после смерти Рахили. Также слегка уточнена временная формула в соответствии с исходным текстом. Смысл, композиция и сноска сохранены.
