lexical_decisions:
- source_word: ወይዜከር
  choice: И он вспоминал
  rationale: Форма передаёт продолжающееся или повторяющееся воспоминание в контексте скорби; русский несовершенный вид звучит естественно.
- source_word: ኵሎ ምግባራቲሃ
  choice: все её дела
  rationale: Буквально и стилистически нейтрально передаёт совокупность её поступков без дополнительной нравственной оценки.
- source_word: በሕይወታ
  choice: при жизни
  rationale: Естественный русский эквивалент выражения «в её жизни», указывающий на совершённое ею до смерти.
- source_word: ወይላሕዋ ጥቀ
  choice: и глубоко скорбел о ней
  rationale: Передаёт сильную степень горя; «глубоко скорбел» соответствует dignified modern Russian and не преувеличивает оттенок плача.
- source_word: ያፈቅራ
  choice: любил её
  rationale: Прямой эквивалент глагола любви с сохранением объекта женского рода.
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: всем сердцем и всей душой
  rationale: Сохраняет параллелизм и традиционно понятную русскую формулу полной, искренней любви.
