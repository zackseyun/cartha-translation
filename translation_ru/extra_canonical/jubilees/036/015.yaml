  text: And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.”
translation:
  language: ru
  text: 'И сказал Исаак: «Да пребудет благословение на вас, сыновья мои, и на вашем потомстве в этот день, потому что вы дали мне покой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታዕርፍ፡ ዲቤክሙ፡ በረከተ
  choice: Да пребудет благословение на вас
  rationale: Передаёт пожелание, чтобы благословение почило и оставалось на сыновьях; «пребудет» естественно и достойно звучит по-русски.
- source_word: አውሉድየ
  choice: сыновья мои
  rationale: Контекстуально и грамматически передаёт прямое обращение Исаака к своим сыновьям.
- source_word: ዘርእክሙ
  choice: вашем потомстве
  rationale: Сохраняет коллективное значение «семя, потомство» без искусственной буквальности.
- source_word: አዕረፍክሙኒ
  choice: вы дали мне покой
  rationale: Сохраняет словесную связь с образом покоя в первой части высказывания и не уточняет, каким именно образом сыновья успокоили Исаака.
