  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: ru
  text: А что касается идолов, то я повелеваю вам и увещеваю вас презирать и отвергать их и не любить их, ибо они несут заблуждение тем, кто служит им и преклоняется перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖት
  choice: идолы
  rationale: Прямой и общепонятный эквивалент обозначения культовых изображений или ложных божеств.
- source_word: አአዝዘክሙ፡ ወእጌሥጸክሙ
  choice: повелеваю вам и увещеваю вас
  rationale: Сохранены оба глагола и различие между властным предписанием и настойчивым наставлением.
- source_word: ትመንንምዎሙ፡ ወተጸረርዎሙ
  choice: презирать и отвергать их
  rationale: Передаёт сочетание отрицательной оценки и деятельного неприятия, не сводя два исходных глагола к одному.
- source_word: ስሕተት፡ ምሉአን
  choice: исполнены заблуждения
  rationale: Сохраняет образ полноты и семантику ошибки, обмана или заблуждения без излишнего догматического уточнения.
- source_word: ያመልኩዎሙ፡ ወ...ይሰግዱ፡ ሎሙ
  choice: поклоняется им и... преклоняется перед ними
  rationale: Различает более широкое культовое служение и телесный жест почитания.
theological_decisions:
- issue: Характер вреда идолов
  choice: они исполнены заблуждения для тех, кто поклоняется им
  alternative: они вводят в заблуждение поклоняющихся им
  rationale: Выбрана более формальная передача, сохраняющая исходное утверждение о самих идолах как «полных заблуждения», а не превращающая его исключительно в описание их действия.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис слегка приподнят, но прозрачен; парные глаголы исходного текста сохранены.
