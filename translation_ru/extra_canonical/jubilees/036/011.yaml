  source_fidelity: 'Конструкция «согласно приговору, который постигнет человека» сохраняет выраженное в геэзском тексте значение соответствия суду/приговору и будущего последствия для человека, желающего сделать зло брату. Однако «свидетельствую перед вами» меняет адресатную связь: здесь уместнее «свидетельствую вам», как и в английском аудиторском следе («to you»).'
