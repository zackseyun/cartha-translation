  yaml_path: translation/extra_canonical/jubilees/036/011.yaml
  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: ru
  text: Я говорю вам и свидетельствую вам, дети мои, согласно приговору[a], который постигнет человека, желающего причинить зло своему брату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно суду».'
    reason: Слово может обозначать как судебное разбирательство или суд, так и вынесенный приговор.
lexical_decisions:
- source_word: አነግር
  choice: говорю
  rationale: Передаёт основной смысл «говорить, объявлять» без излишнего усиления.
- source_word: አስምዕ
  choice: свидетельствую перед вами
  rationale: Каузатив от глагола «слышать» в сочетании с первым глаголом может иметь торжественный, свидетельский оттенок; этот выбор сохраняет его лучше, чем нейтральное «сообщаю».
- source_word: ውሉድየ
  choice: дети мои
  rationale: Буквально «мои дети»; в современном литературном русском естественнее «дети мои».
- source_word: ኵነኔ
  choice: приговор
  rationale: В данном контексте речь идёт не просто об отвлечённом суде, а о судебном решении и его последствии, которое постигнет виновного.
- source_word: ሕሡመ
  choice: причинить зло
  rationale: Сохраняет прямое нравственное значение «сделать зло», оставаясь естественным по-русски в сочетании с направленностью действия против брата.
theological_decisions:
- issue: Связь выражения በከመ ኵነኔ с основным высказыванием
  choice: согласно приговору
  alternative: о приговоре / какой приговор
  rationale: Сохранена явно выраженная в источнике конструкция со значением соответствия («согласно, в соответствии с»), хотя по-русски она звучит несколько торжественно и допускает иное синтаксическое понимание.
- issue: Характер второго глагола አስምዕ
  choice: свидетельствую перед вами
  alternative: возвещаю вам / даю вам услышать
  rationale: Выбран свидетельский оттенок, соответствующий торжественному наставлению Исаака, без введения более узкой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский с торжественным патриархальным оттенком. Порядок обращения «дети мои» естественен для русского; формула «согласно приговору» намеренно сохраняет необычную грамматическую связь оригинала.
