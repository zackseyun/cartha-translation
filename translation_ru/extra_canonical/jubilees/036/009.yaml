  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: ru
  text: 'Но если кто-нибудь из вас замышляет зло против своего брата, то знайте отныне: всякий, кто замышляет зло против своего брата, попадёт в его руки[a], будет истреблён с земли живых, и потомство его исчезнет из-под небес.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «падёт в его руку». Местоимение формально может относиться и к самому злоумышленнику; однако по контексту вероятнее, что речь идёт о руке брата, против которого замышляют зло.'
    reason: Сохраняет референциальную неоднозначность местоимения, но не подменяет конструкцию «пасть в руку» несоответствующим значением «пасть от собственной руки».
lexical_decisions:
- source_word: ኀሠሠ / የኀሥሥ
  choice: замышляет
  rationale: Передаёт намеренное злоумышление против брата естественным современным русским языком.
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: попадёт в его руки
  rationale: Буквально «падёт в его руку»; русский идиоматический оборот сохраняет смысл попадания во власть брата.
- source_word: ይሤር፡ እምድረ፡ ሕያዋን
  choice: будет истреблён из земли живых
  rationale: Сохраняет торжественную библейскую формулу удаления из мира живущих.
- source_word: ዘርኡኒ፡ ይትሐጐል
  choice: потомство его исчезнет
  rationale: ዘር означает «семя, потомство»; по-русски «потомство» ясно передаёт родовую линию, а глагол выражает её исчезновение.
theological_decisions:
- issue: Чья рука обозначена местоимением в выражении እዴሁ
  choice: руки брата, против которого замышляют зло
  alternative: собственные руки злоумышленника
  rationale: Ближайший референт — «его брат»; контекст предупреждает, что злоумышленник попадёт во власть того, кому желал зла. Поскольку местоименная форма допускает формальную неоднозначность, она отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис немного упрощён для ясности, при этом сохранены повтор «замышляет зло против своего брата» и формула «земля живых».
