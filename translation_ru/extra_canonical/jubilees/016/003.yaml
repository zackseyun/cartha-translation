  text: And she was afraid and denied that she had laughed because of the word. And we told her the name of her son, as it had been ordained.
translation:
  language: ru
  text: И она испугалась и стала отрицать, что смеялась из-за сказанного. А мы сказали ей имя её сына, как было установлено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፈርት
  choice: И она испугалась
  rationale: Глагольная форма передаёт страх; естественная русская повествовательная формулировка сохраняет последовательность исходного текста.
- source_word: ወሐሰወት
  choice: и стала отрицать
  rationale: В контексте означает отрицание совершённого действия; «стала отрицать» звучит по-русски естественно и не добавляет уточнения о лжи.
- source_word: በእንተ፡ ቃል
  choice: из-за этих слов
  rationale: Буквально сочетание связано со «словом/речью» и причиной; множественное число в русском естественно передаёт сказанное обещание, не устраняя возможную широту выражения.
- source_word: ወነገርናሃ
  choice: А мы сказали ей
  rationale: Сохраняется первое лицо множественного числа и адресат женского рода; союз «а» естественно обозначает переход к ответу небесных посланников.
- source_word: ስሞ፡ ለወልዳ
  choice: имя её сына
  rationale: Прямое и ясное соответствие исходной именной конструкции.
- source_word: በከመ፡ ሥሩዕ
  choice: как было предопределено
  rationale: Передаёт смысл заранее установленного или назначенного порядка, сохраняя безличность исходной формулы.
theological_decisions:
- issue: Кем было предопределено имя сына
  choice: Сохранена безличная формула «как было предопределено»
  alternative: «как определил Бог»
  rationale: Исходный текст не называет действующее лицо прямо; явное добавление Бога устранило бы грамматическую и богословскую недосказанность.
- issue: Отрицание Сарры
  choice: «стала отрицать»
  alternative: «солгала»
  rationale: Перевод не выносит дополнительной нравственной оценки сверх выраженной исходным глаголом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Синтаксис прост и понятен; сохранены первое лицо множественного числа и безличная формула о предопределении.
