base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/006.yaml
  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: ru
  text: И они осквернили себя, предались блуду в своей плоти и совершали нечистоту на земле. Так и Господь совершит суд над теми местами, где они поступали так же нечисто, как Содом, — как Он осудил Содом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ
  choice: осквернили себя
  rationale: Возвратная форма и контекст передают самоосквернение; современное русское выражение сохраняет нравственно-ритуальный оттенок.
- source_word: ይዜምዉ
  choice: предались блуду
  rationale: Передаёт половую распущенность без неоправданного сужения значения до супружеской измены.
- source_word: በሥጋሆሙ
  choice: в своей плоти
  rationale: Формально сохраняет телесную конкретность исходного текста и его богословскую напряжённость.
- source_word: ርኵሰ
  choice: нечистоту
  rationale: Сохраняет повторяющийся термин и его широкий нравственно-ритуальный смысл.
- source_word: ኵነኔ
  choice: суд
  rationale: В данном контексте обозначает судебное осуждение и наказание; существительное позволяет сохранить формулировку источника.
- source_word: በመካናት
  choice: над теми местами
  rationale: Сохраняет множественное число и пространственную направленность суда.
theological_decisions:
- issue: Характер нечистоты Содома
  choice: поступали по нечистоте Содома
  alternative: совершали такую же нечистоту, как жители Содома
  rationale: Выбранная формулировка не конкретизирует вид греха сверх сказанного в источнике и сохраняет его обобщённую характеристику.
- issue: Соотношение будущего суда и суда над Содомом
  choice: как Он осудил Содом
  alternative: подобно осуждению Содома
  rationale: Личная глагольная конструкция сохраняет Господа как деятеля и прямую параллель между судами.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксис слегка выровнен ради ясности, при этом сохранены повтор «нечистота», телесная формула «в своей плоти» и неопределённость относительно конкретного содержания содомской нечистоты.
