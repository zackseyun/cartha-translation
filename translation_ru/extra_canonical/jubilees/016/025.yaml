  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: ru
  text: И он праздновал этот праздник семь дней, радуясь всем сердцем и всей душой, — он и все, кто был в его доме. Не было с ним ни чужеземца, ни необрезанного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ዘንተ፡ በዓለ
  choice: праздновал этот праздник
  rationale: Глагол ገብረ буквально означает «делать, совершать»; в сочетании с «праздник» естественное русское соответствие — «праздновать», сохраняющее обрядовый смысл.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: семь дней
  rationale: Прямое и ясное соответствие указанию продолжительности праздника.
- source_word: እንዘ፡ ይትፌሣሕ
  choice: радуясь
  rationale: Деепричастная конструкция естественно передаёт сопутствующее действие и значение радости.
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: всем сердцем и всей душой
  rationale: Сохранена библейская антропологическая формула без сведения «души» к чувствам или внутреннему настрою.
- source_word: እለ፡ ውስተ፡ ቤቱ
  choice: кто был в его доме
  rationale: Передано буквально по смыслу; «дом» может обозначать как жилище, так и домочадцев, и русский оборот сохраняет эту широту.
- source_word: foreign/uncircumcised continuation reflected in audited English layer
  choice: ни чужеземца, ни необрезанного
  rationale: Окончание геэзского текста в предоставленном фрагменте обрывается после ወአልቦ («и не было»), поэтому перечисление восстановлено по проверочному английскому слою; формулировка сохраняет различие между этническим и заветным обозначениями.
theological_decisions:
- issue: Соотношение выражений «чужеземец» и «необрезанный»
  choice: Сохранить оба отдельных обозначения
  alternative: Объединить их в общее «посторонний»
  rationale: Два определения могут обозначать разные категории и несут различную этническую и заветную нагрузку; объединение устранило бы смысловое напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но повтор «он и все» и формула «всем сердцем и всей душой» сохранены. Предоставленный геэзский фрагмент включает, вероятно, окончание предыдущего предложения в начале и обрывается перед завершением данного стиха; перевод границ стиха и его окончания учитывает аудированный английский консультационный слой.
