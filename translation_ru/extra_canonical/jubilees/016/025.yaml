  source_fidelity: 'Перевод точно передаёт доступную часть геэзского текста: совершение/празднование праздника в течение семи дней, радость «всем сердцем и всей душой», участие самого героя и всех находившихся в его доме. Окончание исходного фрагмента в предоставленной выписке обрывается после «и не было»; продолжение «ни чужеземца, ни необрезанного» обоснованно сверено с английским аудиторским слоем и сохраняет два отдельных обозначения.'
