  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: ru
  text: И он поселился между Кадесом и Суром, в горах Герара. В середине пятого месяца он ушёл оттуда и поселился у Колодца Клятвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Колодец Клятвы — название, связанное с Вирсавией.
    reason: Поясняет географическое название, сохраняя в основном тексте его смысловую форму.
lexical_decisions:
- source_word: ኀደረ
  choice: поселился
  rationale: Глагол означает пребывание или проживание; «поселился» естественно передаёт длительное местопребывание в данном повествовательном контексте.
- source_word: ማእከለ ቃዴስ ወሱር
  choice: между Кадесом и Суром
  rationale: Сохранены отношения между топонимами и их традиционные русские формы.
- source_word: ውስተ አደባረ ጌራሮን
  choice: в горах Герара
  rationale: Формально передаёт множественное число «горы» и название местности, не заменяя выражение более привычным по параллельным традициям «в Гераре».
- source_word: በመንፈቀ ወርኅ ኃምስ
  choice: в середине пятого месяца
  rationale: Прямое и естественное соответствие исходному временному выражению.
- source_word: Well of the Oath (audited consultation layer for the continuation)
  choice: Колодец Клятвы
  rationale: Сохранено смысловое название места, а не молча подставлен традиционный топоним «Вирсавия».
