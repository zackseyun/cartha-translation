  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: ru
  text: Но Лота мы спасли, потому что Бог вспомнил об Аврааме и вывел Лота из самой гущи бедствия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  choice: мы спасли
  rationale: Сохраняет форму первого лица множественного числа и прямое значение глагола, не уточняя, кто именно говорит.
- source_word: ተዘከሮ
  choice: вспомнил об
  rationale: Естественная русская передача глагола «вспомнить» с объектом; сохраняет причинную связь спасения Лота с Божьей памятью об Аврааме.
- source_word: አውፅኦ
  choice: вывел Лота
  rationale: Местоименный объект ясен из контекста; повтор имени по-русски устраняет возможную двусмысленность после упоминания Авраама.
- source_word: እማእከለ
  choice: из самой гущи
  rationale: Передаёт пространственный образ «из среды, из середины» естественным современным русским выражением.
theological_decisions:
- issue: Первое лицо множественного числа в словах о спасении Лота
  choice: «мы спасли»
  alternative: «он спас» или «Бог спас»
  rationale: Форма источника сохранена без богословского отождествления говорящих с Богом и без устранения смены лица перед словами «Бог вспомнил».
- issue: Причина спасения Лота
  choice: «потому что Бог вспомнил об Аврааме»
  alternative: «ибо Бог вспомнил Авраама»
  rationale: Ясно выражает причинность оригинала, не добавляя объяснения характера Божьей памяти или заслуг Авраама.
translation_notes:
  register: 'Современный литературный русский с достойным повествовательным тоном. Повтор имени «Лот» выбран ради ясности: местоимение «его» после имени Авраама могло бы ошибочно относиться к Аврааму. Выражение «из самой гущи гибели» сохраняет образ нахождения посреди разрушения и звучит естественно для широкого читателя.'
