  source_fidelity: 'Основной смысл передан точно: вечное установление, ежегодное соблюдение, отсутствие временного предела, обязательность для Израиля и перечисление праздничных действий сохранены. Указание «у ручья/потока» к ивам не добавлено, что соответствует геэзскому тексту и английскому аудиторскому следу. Однако «ветви ивы» несколько размывает координацию исходного перечня: после «ветвей с листвой» вторым предметом названы ивы. Более прозрачное «ивовые ветви» сохраняет смысл и естественнее оформляет перечисление по-русски.'
