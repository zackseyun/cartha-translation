  terminology: «Вечное установление», «предписано Израилю», «шалаши» и «венки» уместны. «Венки» предпочтительнее «корон», поскольку не навязывает царского значения слову «аклилат». «Ивовые ветви» не содержит не имеющегося в источнике уточнения о ручье.
