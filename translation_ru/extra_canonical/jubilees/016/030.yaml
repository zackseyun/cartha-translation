base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: ru
  text: 'Это вечное установление для всех их поколений, из года в год. И для этого нет предела дней, потому что оно навеки предписано Израилю: праздновать его, жить в шалашах, носить венки на головах и брать ветви с листвой и ивовые ветви.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: вечное установление
  rationale: Передаёт сочетание со значением постоянно действующего предписания; «установление» естественно в современном литературном русском и сохраняет нормативный оттенок.
- source_word: በትውልዶሙ
  choice: для всех их поколений
  rationale: Сохраняет отнесённость установления к последовательным поколениям; «в роды их» было бы архаично.
- source_word: በኵሉ፡ ዓመት፡ ወዓመት
  choice: из года в год
  rationale: Естественно передаёт ежегодную повторяемость, выраженную исходной формулой.
- source_word: ወአልቦ፡ ለዝንቱ፡ ወሰነ፡ መዋዕል
  choice: И для этого нет предела дней
  rationale: Близко воспроизводит исходный образ отсутствия временной границы, не сводя его лишь к общему «нет конца».
- source_word: ሥሩዕ፡ ላዕለ፡ እስራኤል
  choice: предписано Израилю
  rationale: Передаёт идею установленной для Израиля обязательной практики без добавления субъекта, не названного в тексте.
- source_word: ይግበርዎ
  choice: праздновать его
  rationale: В контексте ежегодного праздника глагол означает совершать или отмечать его; «праздновать» ясно и естественно.
- source_word: ይነበሩ፡ ውስተ፡ ምጽላል
  choice: жить в шалашах
  rationale: Передаёт пребывание в временных праздничных жилищах; «шалаши» понятно современному читателю.
- source_word: ይንበሩ፡ አክሊላተ፡ ውስተ፡ ርእሶሙ
  choice: носить венки на головах
  rationale: Контекстуально естественная передача возложения или ношения венков; не подразумевает царские короны.
- source_word: ዐጽቀ፡ ቈጽል
  choice: покрытые листвой ветви
  rationale: Сохраняет сочетание ветвей с листвой и избегает неестественного буквального выражения.
- source_word: ውኩሓ
  choice: ветви ивы
  rationale: Источник обозначает ивы; слово «ветви» добавлено по русской координации с предыдущим предметом и не вносит указания на ручей.
theological_decisions:
- issue: Продолжительность установления
  choice: «вечное» и «навеки» сохранены без ослабления
  alternative: Передать как «долговременное» или ограниченное определённой эпохой
  rationale: Исходный текст дважды прямо выражает вечность установления и дополнительно говорит об отсутствии предела дней; перевод не должен разрешать возможное богословское напряжение.
- issue: Неуказанный учредитель предписания
  choice: Безличное «предписано Израилю»
  alternative: «Бог навеки предписал Израилю»
  rationale: Хотя подразумеваемый деятель может быть понятен из контекста, в данном отрывке он прямо не назван, поэтому его не следует вводить в основной текст.
translation_notes:
  register: Современный литературный русский, торжественный, но без церковнославянизмов. Синтаксис сохраняет последовательность предписанных действий и повтор вечности установления. Гармонизация с Лев 23:40 («ивы у ручья») отвергнута, поскольку указания на ручей в представленном тексте геэза нет.
