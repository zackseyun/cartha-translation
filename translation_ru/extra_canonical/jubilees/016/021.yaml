  text: near the altar that he had built at the Well of the Oath. And he built booths for himself and for his servants.
translation:
  language: ru
  text: рядом с жертвенником, который он построил у Колодца Клятвы. И он построил шалаши для себя и своих слуг.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный геэзский фрагмент заканчивается словами «для своих слуг». В некоторых разбивках Книги Юбилеев стих 16:21 включает также последующее предложение о празднике шалашей, отсутствующее в данном исходном фрагменте.
    reason: source_fragment_and_verse_alignment
lexical_decisions:
- source_word: በቅሩበ፡ ምሥዋዕ
  choice: рядом с жертвенником
  rationale: Передаёт предложную конструкцию со значением близости и обычное значение ምሥዋዕ — «жертвенник».
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодец Клятвы
  rationale: 'Буквально сохраняет составное географическое наименование: «колодец» и «клятва». Заглавные буквы показывают, что речь идёт о названии места.'
- source_word: ምጽላላተ
  choice: шалаши
  rationale: Множественное число обозначает временные крытые жилища или кущи; «шалаши» понятно современному читателю и сохраняет связь с праздником шалашей без преждевременного толкования.
- source_word: አግብርቲሁ
  choice: своих слуг
  rationale: Естественная современная передача зависимых от него служителей; родовое множественное число источника не конкретизируется.
theological_decisions:
- issue: Связь шалашей с последующим упоминанием праздника
  choice: Передать предмет буквально как «шалаши», не добавляя названия праздника
  alternative: «кущи» или «праздничные шалаши»
  rationale: В предоставленном фрагменте названы только построенные шалаши; добавление праздника внесло бы отсутствующее в данном источнике пояснение.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохранён простым и повествовательным. Начальная строчная буква отражает то, что предоставленный текст начинается продолжением предыдущего предложения.
