  yaml_path: translation/extra_canonical/jubilees/016/031.yaml
  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: ru
  text: И Авраам взял пальмовые ветви и плоды прекрасных деревьев. Каждый день он семь раз обходил жертвенник с ветвями, а по утрам с радостью восхвалял своего Бога и благодарил Его за всё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: пальмовые ветви
  rationale: Выражение обозначает части пальмы, используемые при праздничном обряде; «ветви» естественно и ясно передаёт предмет в данном контексте.
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: плоды прекрасных деревьев
  rationale: Сохранены как значение «плоды», так и положительная характеристика деревьев, без сведения выражения к конкретному виду, которого источник не называет.
- source_word: የዐውድ፡ ምሥዋዐ
  choice: обходил жертвенник
  rationale: Глагол выражает движение вокруг, а ምሥዋዕ обозначает жертвенник; русская конструкция передаёт обрядовое действие прямо и естественно.
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: восхвалял … и благодарил
  rationale: 'Переданы два соотнесённых, но различных действия: хвала и благодарение.'
- source_word: ኵሉ፡ ዘበፍሥሓ
  choice: с радостью … за всё
  rationale: «За всё» отнесено к благодарению, а «с радостью» — к совокупному действию хвалы и благодарения, что соответствует синтаксису и даёт естественный русский текст.
theological_decisions:
- issue: Объект хвалы и благодарения
  choice: своего Бога … Его
  alternative: Бога своего без местоименного дополнения во второй части
  rationale: Источник прямо называет «его Бога»; местоимение «Его» в русском ясно показывает, что и хвала, и благодарение обращены к одному и тому же Богу, не добавляя доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разделён на два предложения ради ясности; повтор ежедневности не добавлен после указания «семь раз».
