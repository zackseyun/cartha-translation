  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: ru
  text: 'завет, установленный навеки. В шестой год четвёртой седмины мы пришли к Аврааму у Колодца Клятвы и явились ему, как и сказали Сарре: мы вернёмся к ней, и она зачнёт сына.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: завет
  rationale: Обычный и точный русский библейский эквивалент для обозначения завета.
- source_word: ተሠርዐት
  choice: установленный
  rationale: Передаёт смысл учреждённого и имеющего постоянную силу установления без излишне конфессиональной окраски.
- source_word: ሱባዔ
  choice: седмина
  rationale: Здесь слово обозначает семилетний хронологический период; «седмина» сохраняет эту специальную библейскую систему счёта.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодец Клятвы
  rationale: Формально передаёт составное географическое наименование и сохраняет связь места с клятвой.
- source_word: ንገብአ፡ ኀቤሃ
  choice: вернёмся к ней
  rationale: Естественно передаёт первое лицо множественного числа и направленность возвращения к Сарре.
- source_word: ወይእቲኒ
  choice: и она зачнёт сына
  rationale: Контекстуально завершает обещание о зачатии; дополнение «сына» соответствует смыслу фразы, засвидетельствованному консультационным слоем.
theological_decisions:
- issue: Число небесных посетителей и говорящего субъекта
  choice: сохранено множественное число «мы»
  alternative: согласовать рассказ с единственным числом в параллельном повествовании Бытия
  rationale: Эфиопский текст последовательно употребляет формы первого лица множественного числа; перевод не должен устранять это напряжение.
- issue: Характер действия над заветом
  choice: «установленный навеки»
  alternative: «предопределённый навеки» или «заключённый навеки»
  rationale: «Установленный» достаточно широко передаёт пассивную форму и не уточняет без основания, идёт ли речь о предопределении, учреждении или заключении.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» сохранён как специальное хронологическое обозначение; синтаксис упрощён настолько, чтобы стих оставался ясным обычному читателю.
