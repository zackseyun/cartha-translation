base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: ru
  text: 'Она зачала сына. В этом месяце Господь совершил суд над Содомом, Гоморрой, Домом[a] и всей областью Иордана: Он сжёг их огнём и серой и уничтожил их до сего дня, как я ныне поведал тебе обо всех их делах, — что они крайне нечестивы и грешны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте: «Дом». Возможно, это искажённое название Адмы; иногда предлагается также чтение «Севоим».'
    reason: Сохраняет буквальную форму спорного топонима в основном тексте и сообщает вероятные идентификации, не выдавая ни одну из них за несомненную.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Она зачала сына
  rationale: Передаёт начальную фразу источника буквально и естественно по-русски; субъект восстанавливается из контекста стиха.
- source_word: ገብረ፡ እግዚአብሔር፡ ዘነኒሆሙ
  choice: Господь совершил суд над
  rationale: Контекстуально выражает действие Господа против городов; формулировка «совершил суд» сохраняет судебный оттенок, отражённый в проверочном английском слое.
- source_word: ወለዶም
  choice: Адмой[a]
  rationale: Форма текста буквально напоминает «Дом», но, вероятно, представляет испорченное название Адмы — города, уничтоженного вместе с Содомом и Гоморрой. Не поддерживаемое источником чтение «Сигор» отвергнуто.
- source_word: አደያመ፡ ዮርዳኖስ
  choice: всей областью Иордана
  rationale: Естественно передаёт обозначение всей прилегающей к Иордану местности.
- source_word: ወአውዐዮሙ፡ በእሳት፡ ወበተይ
  choice: Он сжёг их огнём и серой
  rationale: Сохраняет оба средства уничтожения и субъект действия без стилистической тяжеловесности.
- source_word: በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: как я ныне и возвестил тебе обо всех их делах
  rationale: Явно передаёт частицы «как», «ныне» и глагол первого лица «я возвестил/объявил тебе», которые нельзя сводить к обороту «по их делам».
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: крайне нечестивы и грешны
  rationale: Передаёт два отрицательных определения и усилитель «крайне» современным литературным русским языком.
theological_decisions:
- issue: Характер действия Господа над городами
  choice: совершил суд над
  alternative: сделал с ними то, что им полагалось
  rationale: Судебная формулировка ясна в контексте уничтожения городов, но не добавляет конфессионального толкования.
- issue: Связь заключительной характеристики с возвещением дел
  choice: «как я ныне и возвестил тебе обо всех их делах, что они…»
  alternative: «по всем их делам, потому что они…»
  rationale: Выбранный вариант сохраняет засвидетельствованные в геэзском глагол возвещения, наречие «ныне» и обращение ко второму лицу, не устраняя синтаксического напряжения фразы.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Устаревшее «до сего дня» сохранено как устойчивый библейский оборот; в остальном использована понятная современному читателю лексика.
