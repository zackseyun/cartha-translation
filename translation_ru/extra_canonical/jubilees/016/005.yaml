  source_fidelity: Начальное «Она зачала сына», суд Господа, огонь и сера, уничтожение и заключительное первое лицо переданы по существу верно. Однако ወለዶም в данной геэзской форме непосредственно читается как «Дом»; замена его в основном тексте на «Адма» преждевременно снимает текстуальную неопределённость. Вероятную идентификацию с Адмой следует оставить в примечании.
  naturalness: «Предал их уничтожению» избыточно и менее естественно, чем прямое «уничтожил их». Заключительный оборот лучше оформить без неуклюжего «как я ныне и возвестил», сохранив «ныне», обращение «тебе» и глагол сообщения.
  terminology: «Господь совершил суд» — уместная и нейтральная передача действия суда. «Огнём и серой» и «крайне нечестивы и грешны» соответствуют современному литературному русскому и регистру повествования. Топоним «Дом» следует транслитерировать, а не отождествлять в тексте с Адмой.
