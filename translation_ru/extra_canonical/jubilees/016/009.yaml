base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: ru
  text: От дней Адама до того времени[a], потому что мужчина лёг со своими дочерьми. И вот, о всём его потомстве было повелено и постановлено на небесных скрижалях, чтобы он истребил их и искоренил, чтобы суд над ними совершился, как суд над Содомом, и чтобы он не оставил ему на земле никакого потомства в день осуждения.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «до его времени».'
    reason: 'Местоименный суффикс в አሜሁ допускает буквальное прочтение, хотя всё выражение обычно употребляется наречно: «в то время».'
  - marker: b
    text: В оригинале глаголы «истребил», «искоренил» и «не оставил» имеют форму третьего лица мужского рода единственного числа; их субъект в этом фрагменте прямо не назван. Слово «ему» относится к мужчине, о потомстве которого идёт речь.
    reason: Примечание сохраняет грамматически выраженную, но не названную агентность исходного текста и поясняет референт заключительного дательного местоимения.
lexical_decisions:
- source_word: አሜሁ
  choice: до того времени
  rationale: Эфиопское наречное выражение естественно обозначает «тогда / в то время»; такой перевод яснее, чем буквальное понимание местоименного суффикса как «его».
- source_word: ተአዘዘ፡ ወተቈረጸ
  choice: было повелено и постановлено
  rationale: 'Сохраняется парная формула: первое слово выражает повеление, второе — принятое решение или постановление, а не просто запись.'
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Традиционный и понятный русский эквивалент для образа небесных таблиц, характерного для книги Юбилеев.
- source_word: ያአትትሙ፡ ወ...ይሠርዎሙ
  choice: чтобы он истребил их и искоренил
  rationale: Обе глагольные формы имеют мужской род, единственное число; активный субъект сохранён. «Искоренил» передаёт образ полного удаления потомства.
- source_word: ይገበር፡ ኵነኔሆሙ
  choice: чтобы суд над ними совершился
  rationale: 'Сохранена пассивная форма: суд должен быть совершён, а не сам субъект прямо назван его исполнителем.'
- source_word: ኢያትርፍ
  choice: чтобы он не оставил
  rationale: Передана активная форма третьего лица мужского рода единственного числа, без замены её русским пассивом.
theological_decisions:
- issue: Кто является субъектом глаголов «истребил», «искоренил» и «не оставил»
  choice: Сохранено местоимение «он» без добавления имени и без прописной буквы
  alternative: «Бог» или почтительное «Он»
  rationale: Форма источника указывает на субъект мужского рода единственного числа, но в данном фрагменте прямо его не называет. Добавление «Бог» устранило бы формальную неоднозначность текста.
- issue: Суд над потомством и сравнение с Содомом
  choice: «чтобы суд над ними совершился, как суд над Содомом»
  alternative: «чтобы он совершил над ними суд, подобный суду над Содомом»
  rationale: Выбранная формулировка сохраняет пассивность исходного глагола и не сливает в одно утверждение субъект и действие суда.
translation_notes:
  register: Современный литературный русский с библейски достоинственным, но не архаическим синтаксисом. Использованы «скрижали» как укоренившийся термин и «лёг со своими дочерьми» как прямое, понятное обозначение половой связи без эвфемистического затемнения. Строчные местоимения не навязывают богословского разрешения неявного субъекта.
