translation:
  language: ru
  text: И Сарра рассмеялась, потому что услышала, что мы говорили с Авраамом об этом; и мы укорили её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወስሐቀት፡ ሳራ፡
  choice: И Сарра рассмеялась
  rationale: Глагол передаёт смех; нейтральное «рассмеялась» естественно в современном русском и не добавляет оценки.
- source_word: እስመ፡ ሰምዐት፡
  choice: потому что услышала
  rationale: እስመ имеет причинное значение «потому что», а ሰምዐት — «она услышала».
- source_word: ከመ፡ ተናገርነ፡ ዘንተ፡ ቃለ፡ ምስለ፡ አብርሃም፡
  choice: что мы сказали это Аврааму
  rationale: Передаёт содержание услышанного; «сказали это» звучит естественнее буквального «говорили это слово», а ምስለ в данном контексте обозначает обращённую к Аврааму речь.
- source_word: ወዘለፍናሃ፡
  choice: и мы укорили её
  rationale: «Укорили» сохраняет значение словесного порицания без чрезмерно резкого оттенка «осудили» или административного «сделали выговор».
theological_decisions:
- issue: Кто говорит во множественном числе «мы»
  choice: Сохранено первое лицо множественного числа без уточнения субъекта
  alternative: Назвать говорящими ангелов или Божьих посланников
  rationale: Сам стих не называет субъекта; уточнение устранило бы присущую тексту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием; синтаксис остаётся ясным для обычного читателя.
