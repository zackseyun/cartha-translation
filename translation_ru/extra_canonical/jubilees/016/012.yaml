translation:
  language: ru
  text: Оттуда он отправился и поселился у Колодца Клятвы. А в середине шестого месяца Господь посетил Сарру.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ፡ ወኀደረ
  choice: Оттуда он переселился и поселился
  rationale: እምህየ означает «оттуда», а ወኀደረ — «и поселился/остался». Глагол «переселился» естественно передаёт подразумеваемый переход от прежнего места, не заменяя явно выраженное «поселился».
- source_word: ዐዘቅት፡ መሐላ
  choice: Колодца Клятвы
  rationale: 'Буквально передаёт название места: ዐዘቅት — «колодец», መሐላ — «клятва». Вариант «дуб Мамре» не соответствует данному геэзскому чтению.'
- source_word: በመንፈቀ፡ ወርኅ፡ ሳድስ
  choice: в середине шестого месяца
  rationale: Прямое и естественное соответствие выражению о середине шестого месяца.
- source_word: ሐወጻ፡ እግዚአብሔር
  choice: Господь посетил Сарру
  rationale: Сохранён библейский смысл божественного посещения — действенного обращения Господа к Сарре во исполнение обещания; имя уточняет женский объект по форме и контексту.
theological_decisions:
- issue: Смысл посещения Господом
  choice: посетил
  alternative: явился / позаботился
  rationale: '«Посетил» сохраняет традиционную библейскую многозначность: это может подразумевать и обращение внимания, и действие во исполнение обещания, не сводя выражение лишь к явлению или заботе.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Географическое название переведено по смыслу исходного геэзского текста; недостоверный вариант «дуб Мамре» не включён.
