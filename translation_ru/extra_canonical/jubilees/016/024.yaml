  yaml_path: translation/extra_canonical/jubilees/016/024.yaml
  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: ru
  text: 'И утром, и вечером он воскурял благовонный фимиам: ладан, гальбан, стакту, нард, мирру, кассию и костус — всего семь благовоний. Все эти благовония он приносил, смешав их вместе, в чистом виде.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለመዐዛ፡ ሠናይ
  choice: благовонный фимиам
  rationale: Сочетание обозначает приятное благоухание; в контексте воскурения перечня ароматических веществ естественно передаётся как «благовонный фимиам».
- source_word: ስኂነ
  choice: ладан
  rationale: Наименование ароматической смолы соответствует ладану (frankincense).
- source_word: ቅንአተ
  choice: гальбан
  rationale: Традиционное русское название ароматической смолы galbanum.
- source_word: ማየ፡ ልብን
  choice: стакта
  rationale: Буквально выражение связано с «каплями ладана»; «стакта» сохраняет название благовония и соответствует контексту перечня.
- source_word: ናርድስ
  choice: нард
  rationale: Прямое соответствие названию ароматического растения nard.
- source_word: ከርቤ
  choice: мирра
  rationale: Обычное русское соответствие названию ароматической смолы myrrh.
- source_word: ሰንበልተ
  choice: кассия
  rationale: Передано согласно порядку и идентификации в данном геэзском перечне; растение названо перед костусом.
- source_word: ኵስተ
  choice: костус
  rationale: Транслитерированное общепринятое название ароматического растения; сохранён исходный порядок после кассии.
- source_word: ሰብዐቲሆሙ
  choice: всего семь благовоний
  rationale: Ясно выражает итоговый счёт перечисленных веществ без неестественного буквального «семь из них».
- source_word: ዘንተ፡ ኵሉ፡ ያቀርብ
  choice: Всё это он приносил в смеси, чистым
  rationale: Сохраняет акт приношения, совместное смешение компонентов и характеристику ритуальной чистоты, отражённые источником и текстовой традицией.
theological_decisions:
- issue: Характер действия с благовониями
  choice: различить воскурение и принесение
  alternative: передать оба глагола как «воскурял»
  rationale: Первая часть описывает сжигание благовоний, тогда как заключительный глагол шире означает принесение; различие сохранено без догматического уточнения ритуала.
- issue: Значение чистоты смеси
  choice: «чистым»
  alternative: «в чистом виде» или «очищенным»
  rationale: Краткая формулировка сохраняет возможную ритуальную и качественную окраску определения, не сводя его только к отсутствию примесей.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Редкие названия благовоний сохранены как термины; синтаксис упрощён для ясности. Порядок последних двух компонентов следует геэзскому тексту: кассия, затем костус.'
