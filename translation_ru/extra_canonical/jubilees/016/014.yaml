translation:
  language: ru
  text: И Авраам обрезал своего сына Исаака на восьмой день. Он был первым, кого обрезали согласно установлению, предписанному навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከበቦ፡ አብርሃም፡ ለወልዱ፡
  choice: И Авраам обрезал своего сына Исаака
  rationale: Глагол передаёт совершение обрезания, а имя Исаак, стоящее в начале данного отрывка, естественно включено как уточнение объекта.
- source_word: እመ፡ ሳምንት፡
  choice: на восьмой день
  rationale: Контекстуальное значение выражения — срок совершения обрезания на восьмой день.
- source_word: ውእቱ፡ ቀዳሚ፡ ተከበበ፡
  choice: Он был первым, кого обрезали
  rationale: Сохранена пассивная конструкция источника и утверждение о первенстве Исаака в данном повествовательном контексте.
- source_word: በከመ፡ ሥርዓት፡ ዘተሠርዓ፡ ለዘለዓለም፡
  choice: согласно установлению, предписанному навеки
  rationale: 'Передано полное продолжение фразы, засвидетельствованное критическим изданием: በከመ означает «согласно», ሥርዓት — «установление/порядок», а ዘተሠርዓ ለዘለዓለም — «предписанное навеки».'
theological_decisions:
- issue: Сфера утверждения «первым»
  choice: Не добавлять пояснение о том, среди кого именно Исаак был первым
  alternative: «первым в завете» или «первым из рождённых в доме Авраама»
  rationale: Источник оставляет сферу первенства неуточнённой; пояснение разрешило бы сохраняющуюся в тексте смысловую напряжённость.
- issue: Постоянство установления
  choice: «предписанному навеки»
  alternative: «вечному установлению»
  rationale: Выбранная формулировка сохраняет и существительное «установление», и отдельную пассивную идею того, что оно было предписано навеки.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Пунктуация разделяет два законченных утверждения. Термин «установление» передаёт нормативный смысл без конфессионально окрашенного уточнения.
