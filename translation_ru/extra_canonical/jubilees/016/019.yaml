lexical_decisions:
- source_word: ዘክህነት
  choice: священство
  rationale: Передаёт собирательное значение существительного, а не множественное «священники».
- source_word: ሕዝበ፡ ቅዱሰ
  choice: святой народ
  rationale: Естественное и формально точное соответствие сочетанию «народ святой».
- source_word: ፍኖተ
  choice: своей дорогой
  rationale: В контексте движения выражение естественно передаётся как «пошёл своей дорогой».
- source_word: ለባሬ፡ ኵሉ
  choice: Творца всего
  rationale: Сохраняет конкретный божественный титул и относит «всё» к Творцу, а не к последующему сообщению.
- source_word: ዘነገርናሁ
  choice: за то, что мы рассказали ему
  rationale: Передаёт причинную связь с его радостью и благословением, не превращая «всё» в объект глагола «рассказали».
theological_decisions:
- issue: Божественный титул
  choice: Творца всего
  alternative: Господа
  rationale: Чтение «Творца всего» точнее сохраняет специфический титул исходного текста и не заменяет его более общим обозначением.
- issue: Связь заключительной части предложения
  choice: за то, что мы рассказали ему
  alternative: за всё, что мы рассказали ему
  rationale: Основной текст принимает причинное понимание относительной конструкции и связывает «всё» с титулом «Творец»; альтернативное членение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон простой и достойный. Начальная строчная буква сохранена, поскольку стих начинается продолжением предыдущего предложения. Деепричастная конструкция естественно объединяет радость и благословение с уходом.
