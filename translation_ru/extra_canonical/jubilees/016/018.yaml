  source_fidelity: Исключительное «только Исаак», «святое семя», непринадлежность к народам, «удел Всевышнего», а также образы жребия и царства в целом переданы верно. Однако «избранным» добавляет к ሕዝበ፡ ትርሲት («народ владения/собственности») понятие, которого в этой формулировке источника нет.
  naturalness: 'Оборот «Всё его потомство выпало по жребию Богу» неестественен для современного литературного русского: «выпасть по жребию» требует получателя в конструкции вроде «достаться кому-либо».'
  terminology: «Святое семя», «удел», «жребий», «Господь» и «царство» уместно сохраняют библейский регистр. «Народом в особом владении» естественно передаёт «народ владения», не прибавляя значения избрания.
