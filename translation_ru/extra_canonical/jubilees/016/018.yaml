base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: ru
  text: И только Исаак станет святым семенем[a] и не будет причислен к народам, потому что он станет уделом Всевышнего, а всё его потомство достанется Богу по жребию, чтобы стать для Господа народом в особом владении среди всех народов и чтобы оно стало царством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Исаак один станет святым семенем». Слово «семя» здесь может обозначать Исаака как носителя линии обетования и его потомство как единое целое.'
    reason: Сохраняет возможное расположение исключительного акцента и поясняет коллективное употребление библейского образа «семя».
lexical_decisions:
- source_word: ይስሐቅኒ፡ አሐዱ
  choice: И только Исаак
  rationale: Передаёт явно названного Исаака и исключительное значение አሐዱ — «один, единственный».
- source_word: ዘርእ፡ ቅዱስ
  choice: святым семенем
  rationale: Сохраняет библейскую метафору «семени» и её коллективный смысл.
- source_word: ኢይትኌለቍ፡ ወውስተ፡ አሕዛብ
  choice: не будет причислен к народам
  rationale: Формально и естественно передаёт идею не быть сосчитанным или отнесённым к числу народов.
- source_word: ለመክፈልተ፡ ልዑል
  choice: уделом Всевышнего
  rationale: «Удел» сохраняет идею назначенной доли и традиционную библейскую образность.
- source_word: ወውስተ፡ ዘይመልከ፡ አምላክ፡ ወረደ፡ ኵሉ፡ ዘርኡ
  choice: Всё его потомство выпало по жребию Богу
  rationale: Сохраняет образ жребия и переход к совокупному потомству Исаака.
- source_word: ሕዝበ፡ ትርሲት
  choice: народом, принадлежащим Ему
  rationale: Передаёт народ как Божье владение естественным современным русским языком.
- source_word: እምኵሉ፡ ሕዝብ
  choice: избранным из всех народов
  rationale: В данном синтаксическом контексте «из всех народов» выражает выделение народа Господа; слово «избранным» делает отношение понятным, не устраняя образ принадлежности.
- source_word: መንግሥተ
  choice: царством
  rationale: Прямое соответствие существительному «царство»; незавершённость мысли сохраняется, поскольку стих продолжается далее.
theological_decisions:
- issue: Исключительность Исаака среди потомков Авраама
  choice: «только Исаак»
  alternative: «Исаак один» или просто «Исаак»
  rationale: Источник содержит አሐዱ, поэтому исключительный акцент нельзя опускать; «только Исаак» звучит естественно и ясно.
- issue: Статус потомства как Божьего удела
  choice: Сохранён язык удела и жребия
  alternative: Перефразировать как «Бог избрал всё его потомство»
  rationale: Перефразирование чрезмерно истолковало бы метафору; текст сохраняет напряжение между уделом Всевышнего и жребием Бога.
- issue: Коллективное значение «семени»
  choice: В основном тексте сохранено «семя»
  alternative: «святое потомство»
  rationale: «Семя» сохраняет каноническую библейскую связь и допускает как личный, так и коллективный оттенок; сноска поясняет возможное чтение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены термины «семя», «удел», «жребий» и «царство»; синтаксис разделён на два предложения ради ясности. Конечное «царством» намеренно оставляет мысль открытой, как в предоставленном тексте стиха.
