  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: ru
  text: И он благословил своего Творца, создавшего его в его поколении, потому что Тот создал его по Своему благоволению. Ибо он знал и постиг, что от него произойдёт росток праведности для вечных поколений и от него — святое семя, чтобы оно уподобилось Тому, Кто сотворил всё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: в его поколении
  rationale: Передаёт временно-родовое значение выражения и сохраняет местоименную соотнесённость исходного текста.
- source_word: በሥምረቱ፡
  choice: по Своему благоволению
  rationale: Сочетает значения воли, расположения и благоприятного желания; естественно звучит в возвышенном современном русском языке.
- source_word: ወጠየቀ፡
  choice: и постиг
  rationale: В паре с አእመረ («знал») обозначает углублённое понимание и сохраняет риторическое удвоение без чрезмерного усиления до полной уверенности.
- source_word: ተከለ፡ ጽድቅ፡
  choice: насаждение праведности
  rationale: Сохраняет растительный образ исходного текста и его традиционную религиозную выразительность.
- source_word: ዘርእ፡ ቅዱስ፡
  choice: святое семя
  rationale: Буквально сохраняет собирательный образ потомства и связь с последующим местоимением среднего рода.
- source_word: ኵሎ።
  choice: всё
  rationale: Конечное слово прямо выражает всеохватность объекта творения; его необходимо сохранить вопреки одной из промежуточных редакций.
theological_decisions:
- issue: К кому должно уподобиться святое семя
  choice: Тому, Кто сотворил всё
  alternative: тому, кто сотворил его
  rationale: Конечное ኵሎ означает «всё», а прописные буквы в русском тексте ясно, но без добавочного толкования указывают на Творца как референта.
- issue: Целевая или результативная сила ከመ
  choice: чтобы оно уподобилось
  alternative: так что оно уподобится
  rationale: Целевая конструкция лучше сохраняет модальность исходного ከመ с последующей глагольной формой и не превращает ожидаемое подобие в безусловное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис упрощён ровно настолько, чтобы длинная причинно-целевая структура оставалась понятной; образы «насаждение праведности» и «святое семя» сохранены.
