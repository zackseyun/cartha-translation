  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: ru
  text: И оба они весьма возрадовались. И он построил там жертвенник Господу, Который благословил его и даровал ему радость в земле его странствования. И в этом месяце он устроил семидневный праздник радости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: весьма возрадовались
  rationale: Передаёт сочетание «радость весьма великая» естественным современным русским выражением, сохраняя высокую степень радости.
- source_word: ምሥዋዐ
  choice: жертвенник
  rationale: Традиционный и точный русский библейский эквивалент слова «алтарь/жертвенник».
- source_word: ያስተፈሥሖ
  choice: даровал ему радость
  rationale: Каузативная форма означает, что Господь сделал его радостным; выбранная формулировка естественна и не ослабляет причинное значение.
- source_word: ምድረ፡ ፍልሰቱ
  choice: земле его странствования
  rationale: Сохраняет смысл временного проживания или пребывания вдали от постоянной родины и соответствует библейскому регистру.
- source_word: በዓለ፡ ፍሥሓ
  choice: праздник радости
  rationale: Формально передаёт повтор ключевого мотива радости, не заменяя его более узким названием праздника.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: семидневный
  rationale: Естественно выражает длительность «семь дней» без изменения смысла.
theological_decisions:
- issue: Отнесение причастных определений к Господу
  choice: «Который благословил его и даровал ему радость»
  alternative: Понять второе определение как относящееся к иному субъекту
  rationale: Грамматическая последовательность и контекст связывают оба действия с Господом; перевод сохраняет эту связь без дополнительного толкования.
- issue: Характер пребывания Авраама в земле
  choice: «в земле его странствования»
  alternative: «в земле его поселения»
  rationale: «Странствование» сохраняет напряжение между фактическим пребыванием в земле и отсутствием окончательного владения ею.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксический повтор «И… И…» частично сохранён как черта исходного повествования, но заключительная фраза сделана естественной для русского языка.
