  text: And in this month Abraham moved from Hebron, and went and dwelt between Kadesh and Shur in the mountains of Gerar.
translation:
  language: ru
  text: И в этом месяце Авраам переселился из Хеврона, пошёл и поселился между Кадесом и Суром, в горах Герара.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный фрагмент геэзского текста обрывается после слов «пошёл»; окончание стиха восстановлено по полной текстовой традиции: «и поселился между Кадесом и Суром, в горах Герара».'
    reason: source_truncation
lexical_decisions:
- source_word: ተግዕዘ (исправление ошибочного ፯ዐዘ)
  choice: переселился
  rationale: Глагол обозначает снятие с места и переход; в данном контексте естественное русское соответствие — «переселился».
- source_word: እምነ፡ ኬብሮን
  choice: из Хеврона
  rationale: Предлог እምነ передаёт исходную точку движения.
- source_word: ወሖረ
  choice: пошёл
  rationale: Сохранён отдельный глагол движения, не слитый с «переселился».
theological_decisions:
- issue: Восстановление отсутствующего в предоставленном фрагменте окончания стиха
  choice: 'Включено: «и поселился между Кадесом и Суром, в горах Герара»'
  alternative: Ограничиться словами «Авраам переселился из Хеврона и пошёл»
  rationale: Предоставленный фрагмент геэзского текста обрывается после «и пошёл», однако критическая проверка указывает на усечение источника; полная форма стиха и английский консультационный слой сохраняют место поселения. Это также соответствует повествовательной географии Быт 20:1, не сводя перевод к тексту Бытия.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Географические имена переданы в привычной русской библейской форме. Маркер примечания поставлен в основном тексте.
