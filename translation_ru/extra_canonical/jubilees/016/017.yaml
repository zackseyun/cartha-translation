  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: ru
  text: 'И мы благословили его и рассказали ему всё, что было постановлено о нём: он не умрёт, пока не станет отцом ещё шести сыновей и не увидит их прежде своей смерти; но в Исааке будут наречены ему имя и потомство.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «но в Исааке будут наречены ему имя и семя».'
    reason: Примечание сохраняет буквальную форму заключительной формулы и отмечает многозначность слова «семя», тогда как в основном тексте выбрано естественное «потомство».
lexical_decisions:
- source_word: ባረክናሁ
  choice: благословили его
  rationale: Прямо передаёт форму глагола «благословлять» с объектным местоимением.
- source_word: ዘተአዘዘ ሎቱ
  choice: что было предопределено о нём
  rationale: Передаёт небесное постановление или определение относительно Авраама; «предопределено» естественно в данном контексте, не устраняя оттенка властного установления.
- source_word: ስድስተ ውሉደ
  choice: ещё шестерых сыновей
  rationale: Существительное допускает значение «дети/сыновья»; контекст последующего рассказа и консультационный слой поддерживают «сыновей», а «ещё» отражает дальнейшее рождение после Исаака.
- source_word: ወይሬኢ ዘእንበለ ይመት
  choice: и не увидит их прежде своей смерти
  rationale: Подразумеваемый объект — упомянутые шесть сыновей; местоимение добавлено по нормам русского языка без внесения «сыновей Исаака».
- source_word: ወበይስሐቅ ይጼዋዕ ሎቱ ስም ወዘርአ
  choice: но в Исааке будут наречены его имя и потомство
  rationale: Сохраняет необычную двойную конструкцию «имя и семя/потомство» и формулу наречения, не сводя её только к продолжению рода.
theological_decisions:
- issue: Смысл наречения в Исааке
  choice: «в Исааке будут наречены его имя и потомство»
  alternative: «от Исаака произойдёт названное его именем потомство»
  rationale: Выбранный вариант сохраняет формальную и богословскую напряжённость исходной формулы, не объясняя заранее точное отношение между именем, потомством и Исааком.
- issue: Объект глагола «увидит»
  choice: шесть сыновей, упомянутых непосредственно перед этим
  alternative: сыновья Исаака
  rationale: В геэзском тексте нет имени Исаака при этом глаголе; ближайший грамматический референт — шесть сыновей.
translation_notes:
  register: Современный литературный русский с торжественным повествовательным звучанием. Синтаксис слегка приподнят ради характера древнего текста, но остаётся понятным; архаизмы сведены к уместному библейскому «будут наречены».
