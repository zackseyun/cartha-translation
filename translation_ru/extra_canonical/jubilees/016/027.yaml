  text: И он благословил и возрадовался, и назвал этот праздник праздником Господа — радостью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «праздником Господа, радостью».'
    reason: Пунктуационная и синтаксическая связь заключительного слова «радость» допускает более прямое приложение.
lexical_decisions:
- source_word: ወባረከ
  choice: и он благословил
  rationale: Передаёт последовательную глагольную форму и обычное значение корня «благословлять».
- source_word: ወተፈሥሐ
  choice: и возрадовался
  rationale: Сохраняет возвышенный, но понятный русский регистр и значение радости.
- source_word: ወጸውዐ፡ ስማ
  choice: и назвал
  rationale: Естественно передаёт идиому «призвал/нарёк имя» без ненужного буквализма.
- source_word: በዓለ፡ እግዚአብሔር
  choice: праздником Господа
  rationale: Прямая передача именной конструкции «праздник Господа».
- source_word: ፍሥሓ
  choice: радостью
  rationale: Сохраняет заключительное существительное как приложение к названию праздника; творительный падеж согласован с конструкцией «назвал ... праздником».
theological_decisions:
- issue: Синтаксическая связь заключительного ፍሥሓ («радость»)
  choice: 'Передать как приложение: «праздником Господа — радостью»'
  alternative: «праздником Господа, праздником радости» или «праздником Господа и радости»
  rationale: Источник оставляет краткое существительное в приложении; перевод не превращает его в отдельную часть составного названия и не добавляет союз.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Тире делает краткое приложение естественным по-русски, не устраняя неоднозначность оригинала.
