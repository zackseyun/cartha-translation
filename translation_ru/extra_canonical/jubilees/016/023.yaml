  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: ru
  text: чтобы этой жертвой искупить грех за себя и за своё потомство. А для мирной жертвы — семь баранов[a], семь козлят, семь овец и семь козлов, вместе с их хлебными приношениями и возлияниями. Весь их жир он сжёг на жертвеннике как отборное приношение Господу, в приятное благоухание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь быков, семь баранов, семь овец и семь козлов».'
    reason: Сохраняет альтернативное прочтение перечня животных, отмеченное в английской линии аудита, без выбора между спорными вариантами в основном тексте.
lexical_decisions:
- source_word: ኀጢአት፡ ከመ፡ ያስተስሪ፡ ቦቱ
  choice: чтобы этой жертвой искупить грех
  rationale: Передаёт «грех» как объект искупления и сохраняет инструментальное значение ቦቱ («ею/посредством неё»), при этом по-русски явно связывает местоимение с жертвой из контекста.
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: мирная жертва
  rationale: Устоявшийся и понятный русский библейский термин для жертвы благополучия/мира.
- source_word: አብሐኩ፡ ሰብዐተ፡ ወመሐስአ፡ ሰብዐተ
  choice: семь баранов, семь козлят
  rationale: Следует лексической идентификации форм как «бараны» и «козлята», не подменяя первый вид животного быками под влиянием параллельных жертвенных перечней.
- source_word: መሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ
  choice: хлебные приношения и возлияния
  rationale: Использованы естественные современные русские названия сопутствующих зерновых и жидких приношений.
- source_word: ጽንሓሐ፡ ኅሩየ፡ ለእግዚአ
  choice: избранное приношение Господу, как благоухание, приятное Ему
  rationale: Сохраняет образ отборного приношения и приятного благоухания без конфессионально обусловленного истолкования.
theological_decisions:
- issue: Объект и средство искупления в начальной фразе
  choice: грех является объектом искупления, а жертва — средством
  alternative: «за грех, чтобы искупить себя и своё потомство»
  rationale: Синтаксис ኀጢአት ... ያስተስሪ፡ ቦቱ указывает на искупление греха посредством ранее названной жертвы; выбранный вариант также сохраняет различие между грехом и теми, за кого совершается искупление.
- issue: Характер መሥዋዕተ መድኀኒት
  choice: «мирная жертва»
  alternative: «жертва благополучия»
  rationale: Оба варианта возможны, но «мирная жертва» укоренена в русской библейской речи и не вносит дополнительного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечень животных передан прямо; синтаксис разгружен тире и естественным порядком слов. Начальная строчная буква сохранена, поскольку стих открывается продолжением синтаксической конструкции предыдущего контекста.
