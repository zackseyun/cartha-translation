  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: ru
  text: И имя его — Исаак — было записано на небесных скрижалях. Когда же в назначенное время мы вернулись к ней, она зачала и родила сына.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስሙ፡ … ይስሐቅ
  choice: имя его — Исаак
  rationale: ስሙ означает «его имя», а ይስሐቅ называет это имя; тире естественно передаёт пояснительное приложение в современном русском языке.
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Буквально «скрижали неба»; традиционное и понятное словосочетание «небесные скрижали» сохраняет образ письменной небесной записи.
- source_word: ገባእነ
  choice: мы вернулись
  rationale: Форма глагола ገብአ обозначает возвращение, а не просто прибытие; выбор также сохраняет связь с обещанием возвратиться к Сарре.
- source_word: በጊዜ፡ ሰዓት
  choice: в назначенное время
  rationale: Сочетание указывает на установленный, определённый срок; такой перевод естественен по-русски и соответствует контексту.
theological_decisions:
- issue: Статус записи имени Исаака на небесных скрижалях
  choice: Сохранено прямое утверждение без пояснения его богословского смысла
  alternative: Истолковать запись как предопределение или как простое предведение
  rationale: Исходный текст говорит о записи имени, но не определяет точного отношения этой записи к предопределению, предведению или небесному архиву.
- issue: Кто подразумевается под «мы»
  choice: Местоимение сохранено без уточнения действующих лиц
  alternative: Заменить на «ангелы» или «мы, ангелы»
  rationale: В данном стихе субъект выражен только формой первого лица множественного числа; добавление конкретного обозначения молчаливо разрешило бы контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для древнего религиозного текста. Синтаксис сделан плавным, но ключевые образы и неопределённости сохранены. Оборот «небесные скрижали» выбран как узнаваемый библейский образ; «мы» не конкретизировано.
