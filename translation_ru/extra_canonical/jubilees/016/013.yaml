  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: ru
  text: И Он исполнил для Сарры то, что сказал. Она зачала и родила сына в третьем месяце, в середине месяца, в то время, о котором Господь говорил Аврааму; в праздник первых плодов жатвы родился он.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ላቲ
  choice: сделал для Сарры
  rationale: Передаёт буквальное «сделал ей/для неё», сохраняя связь с исполнением Божьего обещания и естественность русского синтаксиса.
- source_word: በመንፈቀ፡ ወርኅ
  choice: в середине месяца
  rationale: Точно передаёт временное указание «в половине/середине месяца».
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: в праздник первых плодов жатвы
  rationale: Передаёт праздник, связанный с начатками урожая, без привнесения более узкого конфессионального наименования.
- source_word: ተወልደ
  choice: он родился
  rationale: В исходном тексте стоит глагол в мужском роде без явно названного имени; местоимение естественно отсылает к только что упомянутому сыну.
theological_decisions:
- issue: Субъект первого предложения
  choice: Он
  alternative: Господь
  rationale: В данном стихе субъект не назван существительным; местоимение сохраняет связность контекста и не делает подразумеваемое имя явным.
- issue: Имя новорождённого в заключительной фразе
  choice: он родился
  alternative: родился Исаак
  rationale: Геэзский текст не называет Исаака прямо, поэтому имя не добавлено, хотя личность ребёнка ясна из контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Сохранены повтор союза и последовательность временных уточнений; точка с запятой помогает ясно связать дату рождения с праздником.
