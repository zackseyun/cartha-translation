    rationale: Выражение «сделал для Сарры, как сказал» в современном литературном русском воспринимается как синтаксически неполное. «Исполнил для Сарры то, что сказал» ясно выражает подразумеваемый объект действия, не меняя смысла исполнения Божьего слова.
