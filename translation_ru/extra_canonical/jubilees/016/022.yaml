  text: በዛቲ፡ በዓል፡ ወውእቱ፡ መቅድመ፡ ገብረ፡ በዓለ፡ መጻላት፡'፪ በዲበ፡ ምድር። ወበዝ፡ ሰቡዕ፡ መዋዕል፡ ሀሎ፡ ያቀርብ፡ ኵሎ፡ ዕለተ፡ በበ፡ ዕለት፡ ውስተ፡ *ምሥዋዐ፡ ጽንሓሕ፡'፫ ለእግዚአብሔር፡ አልህምተ፡ ክልኤተ፡ ወአብሐኩ፡'፬ ክልኤተ፡ ወአባግዐ፡ ሰብዐተ፡ መሐስአ፡ ጠሊ፡ አሐደ፡ በእንተ፡
