base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/022.yaml
  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: ru
  text: во время этого праздника[a]; и он первым на земле отпраздновал праздник Кущей. В течение этих семи дней он каждый день приносил[b] на жертвеннике Господу двух быков, двух баранов, семь овец и одного козла в жертву за грех,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для этого праздника».'
    reason: Предлог በ допускает иной способ соотнесения оборота с предшествующим контекстом; начало стиха, вероятно, продолжает предыдущую фразу.
  - marker: b
    text: 'Буквально: «представлял» или «подносил».'
    reason: Глагол ያቀርብ буквально означает приближение или представление, а в жертвенном контексте — принесение жертвы.
lexical_decisions:
- source_word: በዛቲ፡ በዓል፡
  choice: во время этого праздника
  rationale: Предлог በ здесь естественно передаёт время совершения действия — «во время, на»; оборот, вероятно, завершает мысль предыдущего стиха.
- source_word: ገብረ፡ በዓለ፡ መጻላት፡
  choice: отпраздновал праздник Кущей
  rationale: Буквально «совершил праздник кущей»; «отпраздновал» точно и естественно передаёт совершение праздника, а «Кущей» соответствует традиционному русскому названию.
- source_word: ያቀርብ፡
  choice: приносил
  rationale: Глагол со значением «приближать, представлять» в жертвенном контексте обозначает принесение жертвы; несовершенный вид уместен для повторявшегося ежедневно действия.
- source_word: አልህምተ፡ ክልኤተ፡ ወአብሐኩ፡ ክልኤተ፡ ወአባግዐ፡ ሰብዐተ፡ መሐስአ፡ ጠሊ፡ አሐደ፡
  choice: двух быков, двух баранов, семь овец и одного козла
  rationale: Сохранены виды животных, их пол там, где он указан, и числовая последовательность источника.
theological_decisions:
- issue: Жертвенное значение глагола ያቀርብ
  choice: приносил на жертвеннике Господу
  alternative: представлял / подносил на жертвенник Господу
  rationale: Контекст алтаря и перечня животных ясно указывает на жертвоприношение, но примечание сохраняет буквальный оттенок «принести, представить».
- issue: Назначение козла
  choice: в жертву за грех
  alternative: за грех
  rationale: Оборот передаёт культовое назначение животного, не добавляя уточнений о характере искупления.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Начальная строчная буква и точка с запятой сохраняют связь фразы с предыдущим стихом; завершающая запятая отражает незавершённость предложения в предоставленном отрывке.
