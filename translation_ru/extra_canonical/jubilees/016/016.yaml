  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: ru
  text: 'И мы возвратились в седьмом месяце и нашли Сарру беременной. Мы благословили Авраама и возвестили ему всё, что было определено о нём: он не умрёт, пока не станет отцом ещё шести сыновей и не увидит их до своей смерти; и в Исааке будет наречено его имя и его потомство.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፀንሰተ፡ ቅድሜነ
  choice: зачала сына ещё до нашего прихода
  rationale: Передаёт беременность Сарры и временной смысл выражения «перед нами / прежде нас» естественным современным русским языком, не создавая впечатления, будто ангелы лишь увидели её стоящей перед собой.
- source_word: ወባረክናሁ
  choice: мы благословили Авраама
  rationale: Местоименный объект мужского рода в контексте относится к Аврааму; имя названо для ясности по-русски.
- source_word: ዘተአዘዘ፡ ሎቱ
  choice: что было определено для него
  rationale: Глагол выражает предписание или установленное решение; «определено» сохраняет оттенок небесного постановления без конфессионального уточнения.
- source_word: ስድስተ፡ ውሉደ
  choice: шести сыновей
  rationale: Буквально речь идёт о шести детях/потомках; дальнейшее повествование связывает это с шестью сыновьями Авраама.
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: но имя его и потомство будут наречены в Исааке
  rationale: 'Сохраняет традиционную библейскую формулу и её смысловую напряжённость: другие сыновья родятся, однако именуемая линия потомства связана с Исааком.'
theological_decisions:
- issue: Кого благословили небесные посланники
  choice: Авраама
  alternative: Господа
  rationale: Форма источника содержит местоименный объект «его», а следующее «возвестили ему» продолжает обращение к Аврааму; чтение «Господа» в консультационном английском слое не подтверждается данной формой геэзского текста.
- issue: Связь имени и потомства с Исааком
  choice: «будут наречены в Исааке»
  alternative: «будут продолжены через Исаака»
  rationale: Выбранная формулировка ближе к источнику и не сводит многозначное «нарекутся/будут названы» только к биологическому продолжению рода.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис упрощён для ясности, но сохранены небесное постановление, обещание шести сыновей и особое положение Исаака. Перевод следует геэзскому свидетельству, включая ту часть стиха, которая отсутствует в предоставленном английском консультационном тексте.
