  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: ru
  text: И построил он там жертвенник Яхве, Который избавил его и даровал ему радость в земле его странствования. И устроил он в этом месяце семидневный праздник радости возле жертвенника, который построил у Колодца Клятвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Колодец Клятвы — буквальное значение названия Вирсавия.
    reason: Поясняет известный библейский топоним, поскольку основной текст сохраняет буквальное значение геэзского выражения.
lexical_decisions:
- source_word: ዘአድኀኖ
  choice: Который избавил его
  rationale: Передаёт относительную конструкцию и совершённое спасительное действие без добавления не выраженных в источнике деталей.
- source_word: ዘአስተፈሥሖ
  choice: даровал ему радость
  rationale: Естественно передаёт каузативное значение «сделал его радостным / дал ему возрадоваться», сохраняя связь с последующим праздником радости.
- source_word: በብሔረ ፡ ፈላስነቱ
  choice: в земле его странствования
  rationale: Сохраняет представление о временном пребывании Авраама в чужой земле; «странствование» здесь точнее нейтрального «проживание» и не усиливает смысл до «изгнания».
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: устроил ... праздник радости
  rationale: Идиоматично передаёт буквальное «сделал праздник радости» и сохраняет повтор мотива радости.
- source_word: በዐዘቅተ ፡ መሐላ
  choice: у Колодца Клятвы
  rationale: Передаёт буквальный смысл геэзской фразы, являющейся калькой топонима Вирсавия, и позволяет сохранить его связь с клятвой.
theological_decisions:
- issue: Передача имени እግዚአብሔር
  choice: Яхве
  alternative: Господь
  rationale: В соответствии с консультационным слоем имя передано как личное имя Бога; такой выбор не привносит конфессионального толкования.
- issue: Характер Божьего действия в ዘአስተፈሥሖ
  choice: даровал ему радость
  alternative: возвеселил его
  rationale: Выбран современный и ясный оборот, сохраняющий каузативный смысл и не уточняющий, каким именно образом была дана радость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения для ясности; повтор «радость / праздник радости» сохранён как смысловая связь исходного текста.
