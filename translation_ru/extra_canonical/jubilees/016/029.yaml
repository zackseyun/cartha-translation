  yaml_path: translation/extra_canonical/jubilees/016/029.yaml
  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: ru
  text: Поэтому на небесных скрижалях установлено относительно Израиля, чтобы израильтяне в седьмом месяце семь дней с радостью праздновали праздник Кущей, угодный Господу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «принимаемый перед Господом»; эти слова могут относиться как к самому празднику, так и к его соблюдению.'
    reason: Сохраняет смысловую и грамматическую неоднозначность заключительной относительной конструкции.
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Традиционный и точный эквивалент выражения «скрижали неба», естественный для русской библейской речи.
- source_word: በዓለ፡ መጸለት
  choice: праздник Кущей
  rationale: Название праздника буквально связано с укрытиями/кущами; сохранено общепринятое русское библейское наименование.
- source_word: በፍሥሓ
  choice: с радостью
  rationale: Передаёт обстоятельственное значение и эмоциональную окраску исходного слова без стилистического утяжеления.
- source_word: ዘይትወከፍ፡ በቅድመ፡ እግዚአብሔር
  choice: угодный Господу
  rationale: Естественно передаёт смысл «принимаемый/приемлемый перед Господом», сохраняя культовый оттенок Божьего благоволения.
theological_decisions:
- issue: К чему относится заключительная характеристика «принимаемый перед Господом»
  choice: 'В основном тексте она отнесена к празднику: «праздник, угодный Господу»'
  alternative: Она может характеризовать соблюдение праздника или празднующих как принимаемых перед Господом
  rationale: Грамматическая связь допускает некоторую неоднозначность; основной текст следует наиболее непосредственному прочтению, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, при этом сохранены формула небесного установления, название праздника, его длительность, радостный характер и календарное указание.
