base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: ru
  text: 'Она зачала сына. В седьмом месяце мы возвратились к Сарре и нашли её беременной пред нами. Мы благословили его и сообщили ему всё, что было ему предписано: он не умрёт, пока не произведёт на свет шестерых сыновей и не увидит их до своей смерти[a]; и в Исааке ему будут наречены имя и потомство.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и увидит прежде, чем умрёт»; объект глагола «увидит» в исходном тексте не выражен.'
    reason: Сноска отмечает контекстуально восполненное местоимение «их» и сохраняет неоднозначность исходного текста.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Она зачала сына
  rationale: 'Прямо передаёт начальную фразу: женский субъект выражен формой глагола, а ወልደ обозначает сына.'
- source_word: በወርኅ፡ ሳብዕ
  choice: в седьмом месяце
  rationale: Согласно порядку и синтаксису исходного текста, обстоятельство относится к возвращению, а не к моменту зачатия.
- source_word: ወረከብናሃ፡ ለሳራ፡ ፀንሰተ፡ ቅድሜነ
  choice: и нашли её беременной пред нами
  rationale: Сохраняет образное и несколько неясное ቅድሜነ («перед нами», «в нашем присутствии»), не превращая его без достаточных оснований в указание на более раннее время.
- source_word: ስድስተ፡ ውሉደ
  choice: шестерых сыновей
  rationale: В данном контексте ውሉደ обозначает рождённых им детей мужского пола; формулировка согласована с мужским субъектом и последующим множественным объектом.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: и не увидит их прежде своей смерти
  rationale: Передаёт «и увидит прежде, чем умрёт»; местоимение «их» восполняет подразумеваемый объект — шестерых сыновей.
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: и в Исааке будут наречены ему имя и потомство
  rationale: Сохраняет библейскую формулу с глаголом «наречь/призвать» и не сводит «имя» и «потомство» к одному понятию.
theological_decisions:
- issue: Формула об имени и потомстве в Исааке
  choice: «в Исааке будут наречены ему имя и потомство»
  alternative: «через Исаака продолжатся его имя и род»
  rationale: Выбранный вариант сохраняет необычную формулировку источника и её богословскую напряжённость, не истолковывая её как простое продолжение рода.
- issue: Объект благословения и сообщения
  choice: сохранено местоимение «его/ему»
  alternative: явно назвать Авраама
  rationale: Исходный текст использует местоименный мужской объект; явное добавление имени Авраама устранило бы формальную неоднозначность, которой нет нужды насильственно разрешать.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Архаизирующее «пред нами» сохранено точечно, поскольку оно лучше удерживает пространственно-присутственное значение исходного выражения; в остальном синтаксис сделан понятным современному читателю.
