  text: He overthrew it. And he and his daughters also committed sin upon the earth, such as had not been on the earth.
translation:
  language: ru
  text: Он ниспроверг его. А тот и его дочери также совершили на земле грех, какого прежде на земле не бывало.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А тот также совершил на земле грех, какого прежде на земле не бывало, — как и его дочери».'
    reason: Порядок и согласование слов в геэзском допускают более раздельное синтаксическое прочтение мужчины и его дочерей.
lexical_decisions:
- source_word: ገፍታአ
  choice: Он ниспроверг его
  rationale: Передаёт отдельное завершённое высказывание со значением свержения или уничтожения и сохраняет местоименный объект, связанный с предыдущим контекстом.
- source_word: ገብረ ... ኀጢአተ
  choice: совершили ... грех
  rationale: Естественная современная русская передача буквального сочетания «сделали грех», без ослабления нравственной оценки.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Прямое и естественное соответствие повторяющемуся пространственному выражению.
- source_word: ዘአኮ ዲበ ምድር
  choice: какого прежде на земле не бывало
  rationale: По-русски выражает сопоставление с беспримерным грехом; «прежде» эксплицирует подразумеваемый временной смысл отсутствия такого случая до этого.
theological_decisions:
- issue: Смена референта местоимения между двумя предложениями
  choice: «Он» в первом предложении и «тот» во втором
  alternative: «Он ниспроверг его. И он сам и его дочери…»
  rationale: Контекст предполагает, что ниспровергает Бог, тогда как грешат Лот и его дочери. «Тот» делает смену референта понятной, не добавляя имени, отсутствующего в данном стихе.
- issue: Синтаксическое соединение мужчины и его дочерей как участников греха
  choice: «тот и его дочери также совершили… грех»
  alternative: «он также совершил грех, и его дочери»
  rationale: Основной текст передаёт наиболее естественное согласование составного подлежащего, а формально возможная более раздельная конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским тоном. «Ниспроверг» сохраняет силу исходного глагола; повтор «на земле» намеренно сохранён. Слово «тот» помогает обозначить смену действующего лица, понятную из контекста предыдущего стиха.
