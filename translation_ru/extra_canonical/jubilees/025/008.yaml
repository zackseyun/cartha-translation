  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: ru
  text: Я прежде слышал, что у Лавана, твоего брата, родились дочери, и обратил к ним своё сердце, чтобы взять себе жену из их числа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕኩ፡ እምቀዲሙ፡
  choice: Я прежде слышал
  rationale: Передаёт первое лицо и временное значение «ранее, прежде» естественным современным русским языком.
- source_word: ትወልዲ፡ አዋልደ፡
  choice: родились дочери
  rationale: Сохраняет значение рождения дочерей и согласуется с предшествующим сообщением в прошлом.
- source_word: ለላባ፡ እኁኪ፡
  choice: у Лавана, твоего брата
  rationale: Русская конструкция с «у» естественно выражает принадлежность; обращение «твоего» сохраняет женский адресат, выраженный формой እኁኪ.
- source_word: አንበርኩ፡ ልብየ፡ ላዕሌሆን፡
  choice: обратил к ним своё сердце
  rationale: Сохраняет телесно-сердечную идиому источника, не сводя её однозначно лишь к решению или романтическому чувству.
- source_word: ከመ፡ እንሣእ፡ እምኔሆን፡ ብእሲተ።
  choice: чтобы взять себе жену из их числа
  rationale: Передаёт цель и значение выбора одной жены из нескольких дочерей; «себе» естественно по-русски уточняет брачное употребление глагола «взять».
