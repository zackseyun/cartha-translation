  yaml_path: translation/extra_canonical/jubilees/025/012.yaml
  text: '"Do not fear, mother; be assured that I will do your will and walk in uprightness, and I will never corrupt my ways."'
translation:
  language: ru
  text: '«Не бойся, мать; поверь мне: я исполню твою волю, буду ходить в праведности и вовек не оскверню своих путей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሂ
  choice: Не бойся
  rationale: Отрицательная форма повеления женского рода естественно передаётся прямым запретом «не бойся».
- source_word: ትእመኒ
  choice: будь уверена
  rationale: Передаёт призыв доверять или быть уверенной; сохраняется обращение к женщине.
- source_word: እገብር ፈቃደኪ
  choice: я исполню твою волю
  rationale: Буквально и естественно передаёт обещание сделать то, чего желает мать.
- source_word: ወበርትዕ አሐውር
  choice: буду ходить в праведности
  rationale: Сохраняет библейскую метафору хождения и нравственный смысл наречия/существительного, связанного с прямотой и праведностью.
- source_word: ወኢያማስን ፍናውየ ለዓለም
  choice: и никогда не развращу путей моих
  rationale: Сохраняет сильное отрицание с временным значением «вовек/никогда» и множественное «пути».
theological_decisions:
- issue: Нравственное значение በርትዕ
  choice: в праведности
  alternative: прямо / в прямоте
  rationale: «Праведность» естественнее в данном нравственном обещании, при этом не вводит конфессионально специфического толкования.
- issue: Образ порчи путей
  choice: не развращу путей моих
  alternative: не испорчу своих путей / не совращусь с пути
  rationale: Сохранена каузативная идея порчи собственных путей и исходная метафора; вариант «не совращусь» сильнее менял бы грамматическую перспективу.
translation_notes:
  register: Современный литературный русский с dignified библейским оттенком. Обращение «мать» сохранено без разговорного «мама»; метафора «ходить в праведности» оставлена как значимый семитский библейский образ.
