  source_fidelity: 'Начальное ትእመኒ точнее передаётся как личный призыв «поверь мне», а не как «будь уверена»: форма связана с «верить/доверять» и подразумевает говорящего. Остальные основные элементы сохранены: обращение к матери, обещание исполнить её волю, образ нравственного «хождения» и окончательное отрицание порчи собственных путей.'
  naturalness: '«Поверь мне» — естественная современная литературная реплика и лучше соответствует прямой речи. Для ወኢያማስን ፍናውየ выбран вариант «не оскверню своих путей»: он сохраняет переходное действие говорящего над «путями», множественное число и образное выражение, но звучит по-русски яснее, чем «не развращу путей моих».'
  terminology: «Праведность» допустимо передаёт нравственную прямоту/непорочность በርትዕ без конфессионального уточнения. «Оскверню» адекватно передаёт идею порчи/загрязнения путей; «вовек» отражает ለዓለም и сохраняет возвышенный, но не архаизирующий регистр.
