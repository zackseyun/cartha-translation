  yaml_path: translation/extra_canonical/jubilees/025/007.yaml
  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: ru
  text: Ибо я помню слово Авраама, нашего отца, ибо он повелел мне не брать жену из дочерей Ханаана, но взять себе жену из потомства дома моего отца и из моего рода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዜከር
  choice: я помню
  rationale: Прямо передаёт значение глагола и естественно звучит в современном русском.
- source_word: ነገረ፡ አብርሃም፡ አቡነ
  choice: слово Авраама, отца нашего
  rationale: Сохраняет формальное существительное «слово» и не превращает его без необходимости в косвенную речь.
- source_word: አዘዘኒ
  choice: он заповедал мне
  rationale: Передаёт сильное значение предписания; «заповедал» уместно в достоинственном библейском регистре и понятно современному читателю.
- source_word: ብእሲተ፡ እምአወልደ፡ ከናአን
  choice: жену из дочерей Ханаана
  rationale: Естественная русская передача родственно-группового выражения источника.
- source_word: እምዘርአ፡ ቤተ፡ አቡየ
  choice: из потомства дома моего отца
  rationale: Сохраняет оба образа источника — «потомство/семя» и «дом отца» — без их слияния.
- source_word: እምዘመድየ
  choice: из моего рода
  rationale: Передаёт родство или родственную общность без чрезмерного сужения до ближайших родственников.
theological_decisions:
- issue: Связь между «словом Авраама» и последующим предписанием
  choice: 'двоеточие: «слово…: он заповедал»'
  alternative: «слово…, ибо он заповедал» или «то, что сказал мне…»
  rationale: Двоеточие естественно раскрывает содержание памятного слова, не вводя в основной текст тяжёлую кальку; неоднозначность синтаксической связи отмечена в сноске.
- issue: Характер повеления Авраама
  choice: «заповедал»
  alternative: «повелел»
  rationale: Оба варианта возможны; выбранный сохраняет торжественный семейно-заветный оттенок, не добавляя конкретной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён ровно настолько, чтобы фраза оставалась ясной, при сохранении ключевых образов «слово», «дом отца», «потомство» и «род».
