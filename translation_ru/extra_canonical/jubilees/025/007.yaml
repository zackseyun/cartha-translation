  source_fidelity: 'Основной текст передаёт ключевые элементы верно: «помню», «слово Авраама, нашего отца», запрет брать жену у дочерей Ханаана и предписание взять жену из потомства дома отца и из рода. Однако второе እስመ в источнике имеет причинное значение («ибо/потому что»), которое в основном тексте заменено двоеточием. Поскольку английская аудиторская трасса также обоснованно фиксирует именно эту связь, её следует сохранить в русском основном тексте, а не только в сноске.'
  naturalness: «Ибо я помню слово Авраама, нашего отца, ибо он повелел мне…» — допустимая и ясная конструкция в современном литературном русском с умеренно библейским регистром. «Нашего отца» естественнее, чем инвертированное «отца нашего» в нейтральном современном изложении. «Из потомства дома моего отца» можно сохранить как близкую к источнику формулу; перестановка «дома отца моего» не требуется.
  terminology: «Слово», «повелел», «дочери Ханаана», «потомство дома моего отца» и «род» точны и не вносят конфессионального истолкования. «Повелел» передаёт አዘዘኒ прямо и несколько менее терминологически нагружено, чем «заповедал».
