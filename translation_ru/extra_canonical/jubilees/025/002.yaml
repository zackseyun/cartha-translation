  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: ru
  text: 'И она сказала ему: «Сын мой, не бери себе жены из дочерей Ханаана, как поступил твой брат Исав, взявший себе двух жён из дочерей Ханаана; всем их нечистым поведением они огорчили мой дух».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: не бери себе жену
  rationale: Прямо передаёт запрет и возвратное значение конструкции; в современном русском естественнее, чем буквальное «не возьми себе».
- source_word: አዋልደ፡ ከናአን
  choice: дочерей Ханаана
  rationale: Сохраняет библейскую родословно-этническую формулу исходного текста.
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: они огорчили мой дух
  rationale: Передаёт образ причинённой внутренней горечи естественным русским выражением, сохраняя слово «дух».
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: всеми своими нечистыми делами
  rationale: «Дела» охватывают поведение и поступки; «нечистыми» сохраняет нравственно-религиозную окраску ርኵስ.
theological_decisions:
- issue: Характер «нечистоты» жён Исава
  choice: нечистые дела
  alternative: порочное поведение
  rationale: Формулировка не сужает значение до одной разновидности нравственного проступка и сохраняет религиозный оттенок исходного понятия нечистоты.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены начальное повествовательное «И», обращения «сын мой» и «брат твой», но синтаксис сделан понятным современному читателю.
