base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: ru
  text: И потому я хранил свой дух[a], чтобы не согрешить и не оскверниться во всех моих путях во все дни моей жизни, ибо из-за распутства и блуда мой отец Авраам дал мне много наставлений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова можно понять и так: «чтобы не осквернить себя и чтобы пути мои не извратились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተዐቀብኩ፡ በመንፈስየ
  choice: я хранил свой дух
  rationale: Сохраняет образ исходного текста и допускает нравственное самообладание без излишнего истолкования.
- source_word: ኢየአብስ፡ ወኢይማስን
  choice: не согрешить и не оскверниться
  rationale: Передаёт два координированных отрицания как грех и нравственное осквернение; возможное иное синтаксическое членение отмечено в сноске.
- source_word: በኵሉ፡ ፍናውየ
  choice: ни на одном из путей моих
  rationale: Естественно по-русски передаёт всеохватность выражения «во всех моих путях» в отрицательном контексте.
- source_word: ምርዐት፡ ወዝሙት
  choice: распутство и блуд
  rationale: Сохраняет различие между необузданным сексуальным поведением и непосредственно блудом, не сливая понятия.
- source_word: አብዝኀ፡ … አዝዘትየ
  choice: дал мне много наставлений
  rationale: Передаёт смысл многочисленных предписаний отца естественным современным русским языком.
theological_decisions:
- issue: Объект осквернения и синтаксическая связь с «путями»
  choice: «не оскверниться ни на одном из путей моих»
  alternative: «не осквернить себя и чтобы пути мои не испортились»
  rationale: Основной текст следует наиболее связному прочтению, но подлинная синтаксико-лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «отец мой Авраам» сохранена ради достоинства речи и связи с древним повествовательным регистром; архаичные и конфессионально окрашенные формулы избегаются.
