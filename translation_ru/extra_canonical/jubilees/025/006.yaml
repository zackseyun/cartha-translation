  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: ru
  text: 'Тогда Иаков поговорил со своей матерью Ревеккой и сказал ей: «Вот, мне теперь девять седмин лет[a], и я не познал женщины, не прикасался ни к одной женщине, не обручался и не намерен брать себе жену из дочерей Ханаана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Девять седмин лет — шестьдесят три года; в основном тексте сохранён принятый в Книге Юбилеев способ исчисления времени.
    reason: cultural_note
lexical_decisions:
- source_word: ወልደ፡ ተስዓተ፡ ሱባዔ፡ ዓመት
  choice: мне уже девять седмин лет
  rationale: Сохранён характерный для Книги Юбилеев хронологический оборот; по-русски возраст выражен естественной конструкцией.
- source_word: ኢያአምር፡ አንስቲ
  choice: я не познал женщины
  rationale: Глагол «познать» сохраняет библейский эвфемизм и не сводит выражение лишь к обычному знакомству.
- source_word: ወአገስስኩ
  choice: не прикасался ни к одной
  rationale: Передано прямое значение прикосновения; «ни к одной» естественно отсылает к женщинам во множественном/собирательном выражении источника.
- source_word: ወአፈፃርኩ
  choice: не обручался
  rationale: Отдельный глагол сохранён и передан как вступление в обручение, без пропуска элемента исходной последовательности.
- source_word: ወኢይሔሊኒ፡ እንሣእ
  choice: не намерен брать
  rationale: Передана выраженная глаголом мысль или намерение, а не простое утверждение о будущем.
- source_word: እምአዋልደ፡ ከናአን
  choice: из дочерей Ханаана
  rationale: Сохранён традиционный библейский этнический оборот источника.
theological_decisions:
- issue: Сексуальный смысл выражения «не познал женщины»
  choice: Сохранить традиционный библейский эвфемизм
  alternative: «не имел близости с женщиной»
  rationale: Формулировка источника допускает и предполагает библейское идиоматическое прочтение; буквальный оборот сохраняет стиль и не добавляет толкования.
- issue: Характер последнего отрицания
  choice: «не намерен брать»
  alternative: «не возьму»
  rationale: Источник обозначает внутреннее намерение или замысел, поэтому категорическое простое будущее было бы менее точным.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Седмина лет» сохраняет древний хронологический образ, а сноска делает его понятным. Последовательность четырёх отрицаний воспроизведена полностью.
