  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: ru
  text: Клянусь перед тобой на все дни моей жизни, что не возьму себе жену из дочерей рода Ханаана и не стану поступать нечестиво, как поступил Исав.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и не поступлю так, как Исав».'
    reason: Сохраняет отмеченную консультационным слоем альтернативу, хотя она менее явно передаёт значение глагола «делать зло».
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: Клянусь перед тобой
  rationale: Передаёт формулу личной клятвы и женский род адресата, выраженный формой ቅድሜኪ.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: на все дни моей жизни
  rationale: Близко сохраняет временной охват исходной идиомы и звучит естественно по-русски.
- source_word: ብእሲተ፡ እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: жену из дочерей рода Ханаана
  rationale: Сохраняет сочетание «дочери» и «семя/род Ханаана» без чрезмерно буквального и тяжеловесного «дочерей семени».
- source_word: ወኢያአኪ፡ ገቢረ
  choice: и не стану поступать нечестиво
  rationale: Глагольная форма ያአኪ выражает совершение зла; «поступать нечестиво» передаёт нравственную оценку, прямо присутствующую в источнике.
- source_word: በከመ፡ ገብረ፡ ዔሳው
  choice: как поступил Исав
  rationale: Естественно передаёт сравнительную конструкцию и завершённое действие Исава.
theological_decisions:
- issue: Нравственная характеристика поступка Исава
  choice: не стану поступать нечестиво, как поступил Исав
  alternative: не поступлю так, как Исав
  rationale: Нейтральная альтернатива опускает значение зла, выраженное в ወኢያአኪ; основной текст поэтому сохраняет явную отрицательную оценку, а сноска отмечает более нейтральную возможность передачи всей конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Формула «на все дни моей жизни» намеренно сохраняет библейский ритм; «род Ханаана» делает генеалогическое выражение понятным современному читателю.
