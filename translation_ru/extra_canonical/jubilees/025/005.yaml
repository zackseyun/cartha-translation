  yaml_path: translation/extra_canonical/jubilees/025/005.yaml
  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: ru
  text: А теперь, сын мой, прислушайся к моим словам и исполни волю своей матери. Не бери себе жену из дочерей этой земли; напротив, возьми себе жену из дома отца моего и из рода отца моего — из дома отца моего.[a] И благословит тебя Бог Всевышний, и дети твои будут праведным потомством и святым семенем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте выражение «из дома отца моего» повторено после повеления взять жену. Повтор может быть намеренным усилением либо отражать неясность членения в извлечённой строке; он сохранён в переводе.
    reason: segmentation_note
lexical_decisions:
- source_word: ቃለየ
  choice: моих слов
  rationale: Буквально «моё слово»; в русском призыв «послушай моих слов» естественно передаёт обращение матери, не ослабляя повелительного смысла.
- source_word: አምላከ፡ ልዑል
  choice: Всевышний Бог
  rationale: Передаёт титул «Бог Всевышний» естественным русским порядком слов и сохраняет его возвышенный характер.
- source_word: ትውልደ፡ ጽድቅ
  choice: праведным потомством
  rationale: Сохраняет образ потомства, определяемого праведностью, без уточнения возможного нравственного или заветного оттенка.
- source_word: ዘርአ፡ ቅዱሰ
  choice: святым семенем
  rationale: Сохранена библейская метафора «семени», а не заменена более общим словом «род».
theological_decisions:
- issue: Характер обещанного благословения потомству
  choice: дети твои станут праведным потомством и святым семенем
  alternative: дети твои будут потомством праведности и семенем святости
  rationale: Выбрана ясная современная формулировка, которая сохраняет оба богословски значимых определения и не объясняет, в каком именно смысле потомство будет праведным и святым.
- issue: Имя благословляющего
  choice: Всевышний Бог
  alternative: Бог Всевышний
  rationale: Обе формы возможны; выбран более естественный для современного русского языка порядок без изменения титула.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис упрощён для чтения, однако повтор исходного текста сохранён и пояснён в сноске; метафоры «потомство» и «семя» оставлены без конфессионального истолкования.
