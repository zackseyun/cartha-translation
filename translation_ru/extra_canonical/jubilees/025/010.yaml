  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: ru
  text: 'И несмотря на всё, что он велел мне,[a] вот уже двадцать два года Исав убеждает и теснит меня, говоря мне: «Брат мой, возьми в жёны одну из сестёр двух моих жён». Но я не хотел поступать так, как поступил он.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод начала: «И со всем, что он велел мне». Оборот, по-видимому, имеет уступительный смысл; упомянутые двадцать два года относятся к длительному давлению со стороны Исава.'
    reason: Сохраняет неоднозначность начального оборота и поясняет временную конструкцию эфиопского текста.
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ
  choice: И несмотря на всё это, что он велел мне
  rationale: Сохранены и уступительное значение начального оборота, и явно выраженный глагол «велел мне»; местоименная отсылка оставлена неоднозначной, как в источнике.
- source_word: ዕሥራ፡ ወክልኤተ፡ ዓመተ
  choice: вот уже двадцать два года
  rationale: Передаёт длительность продолжающегося давления естественным современным русским языком.
- source_word: ይትኃአዘኒ፡ ወያበዝኀ
  choice: убеждает и теснит меня
  rationale: 'Сохранены два координированных глагола: настойчивое увещевание и оказываемое давление.'
- source_word: እኅትነ፡ ለአንስቲያየ፡ ክልኤቲ
  choice: одну из сестёр двух моих жён
  rationale: Сохранено буквальное родственное обозначение и связь с обеими жёнами Исава без попытки уточнить, общая ли это сестра.
- source_word: ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: я не хотел поступать так, как поступил он
  rationale: Естественно передаёт отказ говорящего подражать поступку Исава.
theological_decisions:
- issue: К кому относится «он» в выражении «что он велел мне»
  choice: Сохранить местоимение без уточнения лица
  alternative: Назвать Исава или иного предполагаемого референта
  rationale: Источник не снимает референциальную неоднозначность; уточнение внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Реплика оформлена естественно; повтор «говоря мне и говоря» сглажен без утраты содержания. Сочетание «убеждает и теснит» сохраняет двойное давление исходных глаголов.
