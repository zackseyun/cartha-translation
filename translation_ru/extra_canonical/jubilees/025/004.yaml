    text: 'Заключительные слова в этом месте текста синтаксически трудны; по смыслу это, вероятнее всего, меризм: «днём и в ночные стражи», то есть постоянно.'
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: очень сильно люблю тебя
  rationale: Передаёт усиленное выражение любви без архаичной или неестественной для современного русского избыточности.
- source_word: ልብየ፡ ወምሕረትየ
  choice: моё сердце и моя любовь
  rationale: «Сердце» сохраняет образ оригинала; ምሕረት может обозначать милость или нежную привязанность, и в обращении матери к сыну естественно передаётся как «любовь».
- source_word: በኵሉ፡ ጊዜ
  choice: во всякое время
  rationale: Формально и естественно передаёт значение постоянства.
- source_word: ዕለት፡ ወዐቃቤ፡ ለያልይ
  choice: днём и в ночные стражи
  rationale: Сохраняет временной меризм и древний образ деления ночи на стражи, не сводя его просто к «дню и ночи».
