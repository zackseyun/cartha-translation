  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: ru
  text: Я же, сын мой, люблю тебя безмерно, и моё сердце и моя нежность будут благословлять тебя во все времена — днём и в ночные стражи.[a]
  philosophy: optimal-equivalence
  footnotes:
