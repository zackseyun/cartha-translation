  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: ru
  text: Ибо всё их поведение — разврат и нечистота; нет у них праведности, ибо оно зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ምግባሮሙ
  choice: всё их поведение
  rationale: Передаёт совокупность поступков и образ поведения, сохраняя обобщающий смысл исходного выражения.
- source_word: ዝሙት
  choice: разврат
  rationale: В данном нравственном обличении слово обозначает сексуальную распущенность; «разврат» естественно и достойно звучит на современном русском.
- source_word: ምርጓት
  choice: нечистота
  rationale: Сохраняет нравственно-религиозную широту понятия и не сужает его до одного конкретного вида проступка.
- source_word: ጽድቀ
  choice: праведности
  rationale: Стандартно передаёт понятие праведности или справедливости в религиозно-нравственном контексте.
- source_word: እኩይ
  choice: зло
  rationale: Передаёт предикативную характеристику как нравственно злую; местоимение «оно» сохраняет формальную неоднозначность референта.
theological_decisions:
- issue: Референт заключительного «оно»
  choice: «ибо оно зло»
  alternative: «ибо они злы» / «ибо их поведение зло»
  rationale: Исходный текст допускает связь с ближайшей обобщённой характеристикой или поведением; буквальное единственное число сохраняет эту неоднозначность и не превращает оценку поведения в прямое утверждение о сущности людей.
translation_notes:
  register: Современный литературный русский с кратким, торжественно-назидательным синтаксисом. Сохранены параллелизм обвинений и неоднозначность заключительного местоимения.
