lexical_decisions:
- source_word: ወበካልእ፡ ዓመት፡
  choice: И во второй год
  rationale: 'Сохраняет временную формулу оригинала: союз, предлог и порядковое числительное.'
- source_word: ዘዝ፡ ሱባዔ፡
  choice: этой недели
  rationale: Указательное значение ዝ передано словом «этой»; контекстуальное уточнение «седьмой» не внесено в основной текст, поскольку его нет в данной формулировке оригинала.
- source_word: በዝ፡ አምቤልዉ፡
  choice: в этот юбилей
  rationale: Буквально и ясно передаёт предлог и указательное местоимение при термине «юбилей».
- source_word: ጸውዐት፡
  choice: позвала
  rationale: Естественный русский эквивалент прошедшей формы глагола «звать, призывать»; женский род определяется подлежащим.
- source_word: ርብቃ፡ ያዕቆብሃ፡ ወልዳ፡
  choice: Ревекка позвала своего сына Иакова
  rationale: 'Русский порядок слов естественно выражает отношения: Ревекка — подлежащее, Иаков — объект, «своего сына» — его характеристика.'
