base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/015.yaml
  text: Then Judah said to Jacob his father, saying to him, "Bend your bow, father, and send out your arrows and strike down the enemy and kill the adversary; and may you have strength, for we will not kill your brother, because he is such, and because he is your kinsman we will give him honor." Then Jacob bent his bow and sent forth an arrow and struck Esau his brother on his right breast and killed him. And again he sent an arrow and struck Adoran the Aramean on the left breast and drove him back and killed him. Then the sons of Jacob and their servants went out from the four sides of the tower. And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, on the south side of the tower, and they killed all whom they found before them, and not one of them escaped. And Levi and Dan and Asher went out on the east side of the tower, and fifty men with them, and they killed the warriors of Moab and Ammon. And Reuben and Issachar and Zebulun went out on the north side
    of the tower, and fifty men with them, and they killed the fighters of Philistia. And Simeon and Benjamin and Enoch the son of Reuben went out on the west side of the tower, and fifty men with them, and they killed of Edom and of the Horites four hundred strong and warlike men. And six hundred fled, and four of Esau’s sons fled with them, and they left their father lying slain, as he had fallen on the hill that is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir. But Jacob buried his brother in the hill that is in Adurim, and he returned to his house, and they comforted him there.
translation:
  language: ru
  text: 'Тогда Иуда сказал своему отцу Иакову: «Натяни лук, отец, пусти свои стрелы, срази врага и убей неприятеля. Да будет у тебя сила, ведь мы не станем убивать твоего брата: он твой брат и подобен тебе; окажем ему честь».


    Иаков натянул лук, пустил стрелу, поразил своего брата Исава в правую грудь и убил его. Затем он пустил ещё одну стрелу, поразил арамея Адорана в левую грудь, отбросил его назад и убил.


    Тогда сыновья Иакова и их рабы вышли с четырёх сторон башни. Первым с южной стороны башни вышел Иуда, а с ним Неффалим, Гад и пятьдесят рабов. Они убили всех, кого встретили перед собой, и никто от них не спасся. Левий, Дан и Асир вышли с восточной стороны башни, и с ними было пятьдесят человек; они убили воинов Моава и Аммона. Рувим, Иссахар и Завулон вышли с северной стороны башни, и с ними было пятьдесят человек; они убили филистимских бойцов. Симеон, Вениамин и Енох, сын Рувима, вышли с западной стороны башни, и с ними было пятьдесят человек; они убили четыреста сильных и воинственных мужей из эдомитян и хорреев.


    Шестьсот человек бежали, и вместе с ними бежали четверо сыновей Исава. Они оставили своего отца лежать убитым там, где он упал, — на холме в Адуриме. Сыновья Иакова преследовали их до самой горы Сеир. Иаков же похоронил своего брата на холме в Адуриме, вернулся домой, и там его утешили.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод последних слов: «и там их накормили».'
    reason: Глагольная форма в конце дошедшего текста допускает иное понимание; английский консультационный слой также отмечает эту прежнюю передачу.
lexical_decisions:
- source_word: አግብርቲሆሙ / አግብርቲ
  choice: их рабы / рабы
  rationale: Слово обозначает зависимых слуг и в данном повествовании выражает отношение принадлежности; «рабы» передаёт это точнее, чем нейтральное «слуги».
- source_word: ማኅፈድ
  choice: башня
  rationale: По контексту это укреплённое сооружение, из четырёх сторон которого выходят защитники; традиционное соответствие в данном эпизоде — «башня».
