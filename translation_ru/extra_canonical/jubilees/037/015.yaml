revisions:
- from: 'Тогда Иуда сказал своему отцу Иакову: «Натяни лук, отец, пусти свои стрелы, срази врага и убей неприятеля. Да будет у тебя сила, ведь не нам убивать твоего брата: он такой же, как ты, и подобен тебе; окажем ему эту честь».


    Иаков натянул лук, пустил стрелу, поразил своего брата Исава в правую сторону груди и убил его. Затем он пустил ещё одну стрелу, поразил арамея Адорана в левую сторону груди, отбросил его назад и убил.


    Тогда сыновья Иакова и их рабы вышли с четырёх сторон башни. Первым с южной стороны башни вышел Иуда, а с ним Неффалим, Гад и пятьдесят рабов. Они убили всех, кого встретили перед собой, и никто от них не спасся. Левий, Дан и Асир вышли с восточной стороны башни, и с ними было пятьдесят человек; они убили воинов Моава и Аммона. Рувим, Иссахар и Завулон вышли с северной стороны башни, и с ними было пятьдесят человек; они убили филистимских бойцов. Симеон, Вениамин и Енох, сын Рувима, вышли с западной стороны башни, и с ними было пятьдесят человек; они убили четыреста сильных и воинственных мужей из эдомитян и хорреев.


    Шестьсот человек бежали, и вместе с ними бежали четверо сыновей Исава. Они оставили своего отца лежать убитым там, где он упал, — на холме в Адуриме. Сыновья Иакова преследовали их до самой горы Сеир. Иаков же похоронил своего брата на холме в Адуриме, вернулся домой, и там его утешили.[a]'
