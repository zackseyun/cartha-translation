base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: ru
  text: '«…с нами — и тебе мы причиним зло.[a] А теперь послушай нас: пошлём в Арам, Филистию, Моав и Аммон, выберем себе отборных мужей, рвущихся в бой, выступим против него, сразимся с ним и искореним его с земли, прежде чем он укрепится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало стиха продолжает угрозу, начатую в предыдущем стихе; поэтому в тексте поставлено многоточие.
    reason: Без контекста начальные слова «с нами» выглядят синтаксически незавершёнными; примечание сохраняет фрагментарность границы стиха, не дополняя источник догадкой.
lexical_decisions:
- source_word: ንፈኑ
  choice: пошлём
  rationale: Сохраняет значение глагола «посылать, отправлять» без добавления отсутствующего в источнике прямого дополнения.
- source_word: ኅሩያነ፡ ሰብአ
  choice: отборных мужей
  rationale: Передаёт сочетание «избранные/отборные люди», избегая стилистически тяжёлого повтора с предшествующим «выберем».
- source_word: እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል
  choice: рвущихся в бой
  rationale: Естественно передаёт воинскую готовность и устремлённость к сражению; буквальная конструкция с «убийством» в современном русском звучала бы неясно.
- source_word: ወንሠርዎ፡ እምድር
  choice: и искореним его с земли
  rationale: Глагол связан с образом корня и означает «искоренить, вырвать с корнем»; выбранная формулировка сохраняет этот образ и идею полного устранения.
- source_word: እንበለ፡ የአዝዝ
  choice: прежде чем он укрепится
  rationale: Передаёт смысл «до того, как он станет сильным», естественно выражая возрастание военной или политической силы.
