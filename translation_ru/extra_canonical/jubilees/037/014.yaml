  footnotes:
  - marker: a
    text: В эфиопском тексте здесь сказано «четыре тысячи», тогда как далее посланники называют «четыреста». Расхождение сохранено.
    reason: textual_variant
  - marker: b
    text: 'Фраза допускает разные членения и соотнесения местоимения «они»; буквально: «И снова, прежде чем они умерли, ты нарушил клятву». Вероятно, имеются в виду родители, упомянутые перед этим.'
    reason: source_ambiguity
  - marker: c
    text: Название «раза» передаёт неопределённое эфиопское наименование птицы. Точный биологический вид неизвестен; из сравнения ясно лишь, что она считалась белой.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅፈድ
  choice: башня
  rationale: Контекст ворот и укреплений поддерживает значение укреплённой башни; сохраняется традиционное понимание данного места.
- source_word: ሰብአ፡ ክቡርን
  choice: почтенные люди
  rationale: Передаёт социальную характеристику посланников без архаического «знатные мужи».
- source_word: ብእሲ፡ ጸጋዊ፡ ወመሓሪ
  choice: милостив и сострадателен
  rationale: Передаёт два положительных качества Иакова и сохраняет их сопоставление с Исавом.
- source_word: ተደባብ
  choice: укрепления
  rationale: По контексту речь о верхней оборонительной части башни; нейтральное русское слово естественнее узкотехнических вариантов.
- source_word: ራዛ
  choice: птица раза
  rationale: Точный вид птицы не установлен; транслитерация сохраняет неопределённость источника.
- source_word: መፍለስ
  choice: дикий кабан
  rationale: Образ разъярённого кабана соответствует непосредственному сравнению и более раннему упоминанию животного в речи Исава.
theological_decisions:
- issue: Утверждение Исава об отсутствии истинной клятвы
  choice: Сохранено как прямая речь Исава без богословского исправления
  alternative: Передать как общее авторское утверждение о недействительности человеческих клятв
  rationale: Это высказывание персонажа в полемическом контексте, а не обязательная оценка повествователя.
- issue: Осуждение Исава в момент клятвы
  choice: «ты уже подлежал осуждению»
  alternative: «ты был осуждён»
  rationale: Формулировка сохраняет судебно-нравственный смысл, не уточняя, кем и каким образом вынесено осуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством эпического повествования. Диалог сделан выразительным, но без стилистической архаизации; повторы и цепочки невозможных условий сохранены как существенная часть риторики Исава.
