- from: 'Во всё это время Иаков не знал, что они идут против него, чтобы убить его. Он оплакивал свою жену Лию, пока они не приблизились к башне с четырьмя тысячами человек — отборными воинами и бойцами.[a] Тогда они послали к нему почтенных людей сказать: «Вот, твой брат пришёл против тебя сражаться. С ним четыреста человек, опоясанных мечами; они несут щиты и боевое оружие». Эти люди любили Иакова больше, чем Исава, и сказали ему, что Иаков милостив и сострадателен — не таков, как Исав.


    Когда они приблизились к башне, Иаков встревожился. Он запер ворота башни, встал на укреплениях и заговорил со своим братом Исавом: «Хорошо же ты пришёл утешить меня — утешить из-за смерти моей жены! Такова ли клятва, которую ты дал своему отцу и своей матери? Ещё при их жизни ты нарушил клятву,[b] и в тот самый час, когда ты клялся своему отцу, ты уже подлежал осуждению».


    Тогда Исав ответил ему: «Нет истинной клятвы ни у сынов человеческих, ни у земных зверей: поклявшись, они уже на следующий день злоумышляют друг против друга, чтобы каждый мог убить своего врага и недруга. Ты ненавидишь меня и моих детей навеки, и с тобой невозможно хранить братство. Выслушай слово, которое я тебе скажу. Если кабан сменит свою шкуру, а его щетина станет мягкой, как шерсть, или если у него на голове вырастут рога, как у оленя или барана, тогда я буду хранить братство с тобой. Если отнятые от груди вернутся к своей матери и снова станут сосать её, тогда я примирюсь с тобой как брат. Если волки заключат мир с ягнятами, не станут пожирать и притеснять их и будут расположены к ним сердцем, тогда и в моём сердце будет мир к тебе. Если лев станет другом быка, будет запряжён с ним в одно ярмо, станет вместе с ним пахать и заключит с ним мир, тогда и я заключу мир с тобой. Если ворон побелеет, как птица раза,[c] тогда я пойму, что полюбил тебя, и заключу с тобой мир. Сгинь ты,
    и да сгинут твои сыновья! Не будет тебе мира».


    Иаков увидел, что сердце Исава исполнено зла против него и что тот всей душой намерен его убить. Исав шёл в ярости, словно дикий кабан, который бросается на пронзающее и убивающее его копьё и не отступает перед ним. Тогда Иаков велел своим людям и слугам напасть на Исава и на всех его спутников.'
