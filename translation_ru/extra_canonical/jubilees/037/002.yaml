  yaml_path: translation/extra_canonical/jubilees/037/002.yaml
  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: ru
  text: 'Исаак отдал права первенца Иакову, своему младшему сыну, и они чрезвычайно разгневались. Они стали спорить со своим отцом, говоря: «Почему он отдал права первенца Иакову, который младше тебя, а тебя, старшего, обошёл?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: права первенца
  rationale: По контексту речь идёт не просто о старшинстве, а о принадлежащем первенцу статусе и связанных с ним правах; множественное «права» естественно передаёт смысл по-русски.
- source_word: ዘይንእስ
  choice: младшему / который младше
  rationale: Сохраняет сравнительное указание на возраст Иакова относительно Исава.
- source_word: ተምዑ፡ ፈድፋደ
  choice: чрезвычайно разгневались
  rationale: Передаёт усиленную степень гнева без архаической тяжеловесности.
- source_word: ተጋአዙ
  choice: стали спорить
  rationale: Естественно передаёт словесное противостояние сыновей отцу, не усиливая его до физической борьбы.
- source_word: ዘትልህቅ
  choice: старший
  rationale: В данном контексте обозначает возрастное и первородное старшинство Исава по отношению к Иакову.
theological_decisions:
- issue: Кто дал первородство и кого обошли
  choice: Исаак («он») отдал права Иакову и обошёл Исава («тебя»)
  alternative: Сыновья спрашивают Исаака, почему тот при них отдал права Иакову и обошёл их
  rationale: Непосредственный синтаксис и повествовательный контекст указывают, что сыновья обращаются к своему отцу Исаву об уже умершем Исааке; выражение እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ፡ противопоставляет старшего Исава младшему Иакову.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным регистром. Формулировки ясны обычному читателю; местоимения сохранены там, где их референция определяется контекстом.
