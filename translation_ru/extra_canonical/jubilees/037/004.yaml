  text: Yet now our father has made us swear, me and him, that we should not seek evil, each against his brother,
translation:
  language: ru
  text: Но теперь твой отец заставил нас[a] — меня и его — поклясться, что никто из нас не станет замышлять зло против своего брата,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил меня поклясться — меня и его».'
    reason: Сохраняет отмеченный в английском POB альтернативный вариант при основном чтении «нас», поддержанном геэзской формой первого лица множественного числа.
lexical_decisions:
- source_word: እምሐለኩ፡ አቡከ፡ ኪያየ፡ ወኪያሁ
  choice: твой отец взял с нас — с меня и с него — клятву
  rationale: 'Форма глагола указывает на объект первого лица множественного числа («с нас»), после чего отдельные местоимения уточняют участников: «с меня и с него». Русская конструкция «взял клятву» естественно передаёт каузативное значение «заставил поклясться».'
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: мы не будем замышлять зла
  rationale: Глагол выражает намерение или стремление причинить зло; «замышлять зла» сохраняет смысл и звучит естественно в контексте клятвы.
- source_word: አሐዱ፡ ላዕለ፡ እኁሁ
  choice: друг против друга, как братья
  rationale: 'Буквально: «один против/на своего брата». Взаимная русская конструкция передаёт взаимность запрета, а упоминание братьев сохраняет родственную формулировку источника.'
