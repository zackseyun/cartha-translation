base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: ru
  text: '«Иаков младше; Иакову твой отец отдал первородство, а тебя оставил». И Исав сказал им: «Ведь я продал Иакову своё первородство за небольшое блюдо чечевичной похлёбки. А в тот день, когда отец послал меня охотиться и принести ему дичи, чтобы он поел и благословил меня, Иаков пришёл, прибегнув к хитрости, принёс моему отцу еду и питьё, и мой отец благословил его, а меня подчинил ему. И теперь наш отец взял с нас обоих клятву, что мы не будем замышлять зла друг против друга».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: первородство
  rationale: По контексту продажи Исавом и передачи Иакову обозначает право первородства; русское «первородство» точно и естественно передаёт понятие без избыточного уточнения.
- source_word: በኅዳጥ፡ ጸብሐ፡ ብርስን
  choice: за небольшое блюдо чечевичной похлёбки
  rationale: Сохраняет указание на малое количество и чечевичное блюдо, выражая его современным естественным русским оборотом.
- source_word: በተጠብቦት
  choice: с хитростью
  rationale: Передаёт способ действия без усиления до явно нравственно окрашенных «обмана» или «коварства».
- source_word: ታሕተ፡ እዴሁ
  choice: подчинил ему
  rationale: Буквально образ означает положение «под его рукой»; функциональное русское соответствие ясно передаёт подчинённое положение Исава относительно Иакова.
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: не будем замышлять зла
  rationale: Сохраняет направленность намерения или стремления к злу, а не только совершение вредного поступка.
theological_decisions:
- issue: Характер поступка Иакова
  choice: пришёл с хитростью
  alternative: пришёл обманом / коварно
  rationale: Источник характеризует способ действия, но перевод не должен усиливать нравственную оценку сверх выраженной лексики.
- issue: Отношение Исава к Иакову после благословения
  choice: меня подчинил ему
  alternative: поставил меня под его руку
  rationale: Выбран ясный современный русский эквивалент образа власти и подчинения; он не вводит дополнительных представлений о рабстве или абсолютном господстве.
- issue: Объём взаимной клятвы
  choice: взял с нас обоих клятву, что мы не будем замышлять зла друг против друга
  alternative: заклял меня и его, чтобы один не искал зла против брата
  rationale: Сохраняются взаимность, братские отношения и запрет злого умысла, но устраняется неестественная для русского языка конструкция.
translation_notes:
  register: Современный литературный русский, повествовательный и достойный по тону. Прямая речь сохранена; синтаксис сделан прозрачным для обычного читателя. Начальная реплика передана как продолжение речи сыновей из контекста, а союз እስመ в ответе Исава — словом «ведь».
