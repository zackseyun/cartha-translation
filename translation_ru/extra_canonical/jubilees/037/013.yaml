base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: ru
  text: 'Он пошёл впереди, чтобы вести их к Иакову, своему брату. Тогда он вспомнил всё зло, которое было скрыто в его сердце против Иакова, его брата, и не вспомнил клятвы, которую дал своему отцу и своей матери: не искать никакого зла против Иакова во все дни своей жизни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: Он пошёл впереди, чтобы вести их
  rationale: Передаёт движение впереди группы и цель — вести её; сохраняет содержание первой фразы, ранее опущенной в английском слое.
- source_word: ተዘከረ
  choice: вспомнил
  rationale: Прямое и естественное соответствие глаголу памяти в данном повествовательном контексте.
- source_word: ኅብእተ፡ ላዕለ፡ ያዕቆብ፡ እኁሁ
  choice: таилось в его сердце против его брата Иакова
  rationale: «Таилось» естественно передаёт сокрытое внутри зло; родственное обозначение сохранено при этом упоминании Иакова.
- source_word: ኢይትኃሠሥ፡ ኵሎ፡ እኩየ
  choice: не замышлять никакого зла
  rationale: В контексте скрытого в сердце зла русский «замышлять» передаёт направленное злое намерение, не ограничивая смысл только фактическим причинением вреда.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: во все дни своей жизни
  rationale: Идиоматичная русская передача буквального «все его дни», сохраняющая временной охват клятвы.
theological_decisions:
- issue: Содержание клятвы и внутреннее зло Исава
  choice: 'Сохранён контраст: он вспомнил скрытое зло, но не вспомнил клятву не замышлять зла.'
  alternative: Сгладить текст как сознательное нарушение клятвы.
  rationale: Источник формулирует напряжение через два акта памяти и не объясняет психологически или богословски, как именно они соотносятся.
- issue: Заключительное упоминание Иакова
  choice: «против Иакова» без добавления «брата».
  alternative: «против своего брата Иакова».
  rationale: В заключительной части эфиопский текст не повторяет እኁሁ («его брат»), хотя употребляет это слово ранее.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис остаётся ясным для широкого читателя; повтор имени Иакова и контраст «вспомнил — не вспомнил» сохранены. Маркер сноски поставлен непосредственно после относящейся к ней фразы.
