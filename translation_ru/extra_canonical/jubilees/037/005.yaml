translation:
  language: ru
  text: 'и чтобы мы жили в любви и мире, каждый со своим братом, и не портили наших путей[a]». Но они сказали ему: «Мы не послушаем тебя и не заключим с ним мира, потому что наша сила превосходит его силу и мы сильнее его. Выступи против него, и мы убьём его и истребим его сыновей. Но если ты не пойдёшь…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «не губили наших путей»; речь идёт о порче или разрушении образа жизни.'
    reason: Геэзский глагол допускает значения «портить», «губить», «разрушать», а «пути» — идиоматический образ образа жизни.
lexical_decisions:
- source_word: ነሀሉ፡ በተፋቅሮ፡ ወበሰላም
  choice: чтобы мы жили в любви и мире
  rationale: Передаёт значение пребывания или жизни в состоянии взаимной любви и мира естественным современным русским языком.
- source_word: ብእሲ፡ ምስለ፡ እኁሁ
  choice: каждый со своим братом
  rationale: Буквально конструкция говорит о «человеке с его братом»; distributивное «каждый» естественно выражает общий принцип братского мира.
- source_word: ወኢናማስን፡ ፍኖዊነ
  choice: и не развращали своих путей
  rationale: Глагол имеет сильное значение разрушения, порчи или развращения, а существительное стоит во множественном числе — «наши пути». Сохранён библейский образ нравственного поведения как пути.
- source_word: ኢንሰምዐከ፡ ለገቢረ፡ ምስሌሁ፡ ሰላመ
  choice: Мы не послушаем тебя и не заключим с ним мира
  rationale: Смысл исходной конструкции — отказ внять призыву заключить мир; сочинительная русская формулировка устраняет неестественную кальку, не меняя содержания.
- source_word: ኃይለ፡ ዚአነ፡ ይጸንዕ፡ እምኃይሉ፡ ወንሕነ፡ ንጸንዕ፡ እምኔሁ
  choice: наша сила превосходит его силу и мы сильнее его
  rationale: Сохранены повтор существительного «сила» и параллельное утверждение о превосходстве говорящих.
- source_word: ሖውር፡ ላዕሌሁ
  choice: Выступи против него
  rationale: Передаёт повеление пойти против противника без буквального, но вводящего в заблуждение пространственного «поднимись на него».
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: и истребим его сыновей
  rationale: Сильный глагол уничтожения передан как «истребим»; ውሉድ в данном контексте по консультационному тексту обозначает сыновей.
theological_decisions:
- issue: Нравственный образ «путей»
  choice: Сохранить выражение «развращали своих путей»
  alternative: 'Передать смысл описательно: «не портили свою жизнь»'
  rationale: Образ пути является частью библейской нравственной лексики и не требует конфессионального истолкования; его сохранение также удерживает семантическую силу глагола.
