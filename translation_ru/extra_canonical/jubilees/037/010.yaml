revisions:
- from: И пришли к ним из Моава и из сынов Аммона тысяча отборных наёмников; из Филистии — тысяча отборных воинов, пригодных к войне; из Эдома и от хорреев — тысяча отборных воинов, обученных сражаться; а от киттиев — сильные воины, пригодные к войне.
  to: И пришли к ним из Моава и от сыновей Аммона тысяча отборных людей, нанятых для этого; из Филистии — тысяча отборных воинов, годных к войне; из Эдома и от хорреев — тысяча отборных воинов, обученных сражаться; а из Киттима — сильные воины, годные к войне.
  rationale: Исправлены буквальная калька «из сынов Аммона», излишне категориальное «наёмники» и неустойчивая форма имени «киттиев». Оборот «нанятых для этого» вносит лишь эксплицитную в русском связь с военным предприятием, уже заданным контекстом перечня; численность последнего отряда по-прежнему не добавляется. Параллельная структура и различение между «годными к войне» и «обученными сражаться» сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T18:50:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перечисление контингентов, их численность и отсутствие численности у последней группы переданы верно. Однако «наёмники» несколько сужает конструкцию «отборные люди, которые были наняты»: источник характеризует именно нанятость данного отряда, а не обязательно профессиональный статус людей. «Из сынов Аммона» также является слишком буквальной калькой для современного русского.'
  naturalness: Текст понятен и выдержан в нейтрально-литературном регистре, но «из сынов Аммона» звучит архаично и неестественно. «Годных к войне» лучше передаёт военную характеристику, чем «пригодных к войне», которое в русском может иметь оттенок общей пригодности.
  terminology: «Моав», «Филистия», «Эдом» и «хорреи» переданы удовлетворительно. Для Κиттим/Киттима безопаснее сохранить традиционное собственное имя «Киттим», а не вводить менее устойчивую форму этнонима «киттии».
  issues:
  - severity: medium
    issue: «из сынов Аммона»
    rationale: Это буквальная калька, не соответствующая норме современного литературного русского. «От сыновей Аммона» сохраняет исходное обозначение группы без ненужной интерпретации как этнонима.
  - severity: low
    issue: «тысяча отборных наёмников»
    rationale: Существительное «наёмники» может означать профессиональную социальную категорию, тогда как источник говорит об отборных людях, нанятых для данного похода. Причастный оборот точнее сохраняет эту структуру.
  - severity: low
    issue: «киттиев»
    rationale: Форма не является наиболее устойчивой русской передачей имени Kittim. «Из Киттима» сохраняет традиционное имя и не решает за источник, понимается ли оно как страна или группа.
  revised_text: И пришли к ним из Моава и от сыновей Аммона тысяча отборных людей, нанятых для этого; из Филистии — тысяча отборных воинов, годных к войне; из Эдома и от хорреев — тысяча отборных воинов, обученных сражаться; а из Киттима — сильные воины, годные к войне.
