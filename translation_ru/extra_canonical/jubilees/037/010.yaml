  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: ru
  text: И пришли к ним из Моава и от сыновей Аммона тысяча отборных людей, нанятых для этого; из Филистии — тысяча отборных воинов, годных к войне; из Эдома и от хорреев — тысяча отборных воинов, обученных сражаться; а из Киттима — сильные воины, годные к войне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ
  choice: отборных
  rationale: Передаёт значение «избранные, отборные» и естественно характеризует воинские отряды.
- source_word: ተዐሰቡ
  choice: наёмников
  rationale: Форма указывает на нанятых людей; в данном военном контексте естественно передать существительным «наёмники».
- source_word: መስተቃትላነ
  choice: пригодных к войне
  rationale: Сохраняет характеристику боеспособности, не добавляя более узкого смысла опытности.
- source_word: መስተባእሳነ
  choice: обученных сражаться
  rationale: Контекстуально передаёт готовность и подготовленность к бою, отличая выражение от повторяющегося определения «пригодных к войне».
- source_word: ዕደወ
  choice: сильные воины
  rationale: В военном перечне выражение обозначает сильных или доблестных людей; добавление «воины» естественно и ясно по контексту.
- source_word: ኬጢዎን
  choice: киттиев
  rationale: Традиционная русская передача этнонима Kittim в форме родительного падежа.
