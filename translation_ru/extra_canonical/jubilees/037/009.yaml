    issue: «этих слов» вместо единственного числа
    rationale: Геэзское ዘንተ፡ ነገረ означает «это слово/это сказанное»; множественное число в русском расширяет исходный текст.
  - severity: medium
    issue: «послали в Арам» представляет Арама как место
    rationale: В источнике Арам координирован с Адурамом, а английский аудиторский текст также передаёт оба элемента как Aram и Aduram. Русский должен передать «к Араму и к Адураму».
