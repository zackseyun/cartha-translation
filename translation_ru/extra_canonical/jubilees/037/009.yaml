lexical_decisions:
- source_word: ታበውአ፡ ክሳደከ፡ ታሕተ፡ አርዑቱ
  choice: склони шею под его ярмо
  rationale: Сохраняет конкретную метафору подчинения и повелительную форму исходного текста.
- source_word: ኢንሰምዕ፡ ንሕነሰ፡ ዘንተ፡ ነገረ
  choice: Мы же не послушаемся этих слов
  rationale: Отрицательная форма глагола «слышать» в таком контексте естественно означает отказ слушаться; частица передаёт противопоставление «мы же». Множественное «слов» идиоматично по-русски при значении «сказанное».
- source_word: ዐርከ፡ አቡሆሙ
  choice: другу их отца
  rationale: Прямо передаёт родственное определение и не добавляет предположений о статусе этого человека.
- source_word: ፲፻ መስተባእሳነ
  choice: тысячу воинов для битвы
  rationale: Передаёт числительное и военное назначение людей без расширения до «отборных» или «закалённых», которого источник явно не требует.
