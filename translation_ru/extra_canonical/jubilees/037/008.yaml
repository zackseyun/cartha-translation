- source_word: እምውርዝትከ
  choice: с юности своей
  rationale: Сохраняет исходное значение начального периода жизни и притяжательное отношение к адресату.
- source_word: እስከ ዛቲ ዕለት
  choice: до сего дня
  rationale: Точно и литературно передаёт временную границу «до этого дня».
- source_word: ወአንተ
  choice: и ты…
  rationale: Сохраняет явно начатое, но оборванное продолжение в предоставленном тексте стиха.
