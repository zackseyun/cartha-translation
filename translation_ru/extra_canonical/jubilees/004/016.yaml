  yaml_path: translation/extra_canonical/jubilees/004/016.yaml
  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: ru
  text: И они творили правосудие и праведность на земле. В десятый юбилей, в первую седмину, Иаред взял себе в жёны Бараку, дочь Расуяла, дочери сестры его отца, в четвёртый год этой седмины; и она родила ему сына в пятую седмину, в четвёртый год.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: правосудие и праведность
  rationale: 'Сохраняет парную формулу эфиопского текста: первое слово обозначает справедливый суд или правосудие, второе — правоту и праведность.'
- source_word: ኢዮቤልዉ
  choice: юбилей
  rationale: Техническое хронологическое обозначение книги передано привычным русским термином.
- source_word: ሱባዔ
  choice: седмина
  rationale: Здесь речь идёт о семилетнем периоде внутри юбилея; «седмина» точно и компактно сохраняет древнюю хронологическую систему.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: взял себе в жёны
  rationale: Естественная русская передача брачной формулы без ненужного буквального повтора «жену ... как жену».
