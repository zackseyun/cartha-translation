    rationale: Фраза «Бараку, дочь Расуяла, дочь сестры своего отца» может формально отнести последнее определение к Бараке. Исходный текст и английский контрольный перевод называют Расуял дочерью сестры отца Иареда. Следует выразить зависимость формой «дочери сестры его отца».
  - severity: low
    issue: Неестественная временная формула
    rationale: «В десятом юбилее» калькирует английское выражение; «в десятый юбилей» естественнее по-русски и сохраняет значение.
  - severity: low
    issue: Английская сноска 16 не относится к данному стиху
    rationale: Её текст обсуждает потоп и землю Эдема, которых нет ни в Жюб. 4:16, ни в русском переводе. В русском тексте не следует создавать якорь или переносить нерелевантную сноску.
