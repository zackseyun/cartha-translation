translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Имена переданы как Иаред, Барака и Расуял. Хронологические формулы сохранены без упрощения. Заключительная дата «в пятую седмину, в четвёртый год» следует представленному эфиопскому тексту, хотя она хронологически необычна.
