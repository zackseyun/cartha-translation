  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
translation:
  language: ru
  text: И он убил его в поле, и кровь убитого возопила от земли к небу, жалуясь на него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обвиняя его».'
    reason: Геэзский глагол допускает значения жалобы и обвинения.
lexical_decisions:
- source_word: በገዳም (ba-gadām)
  choice: в поле
  rationale: В данном повествовательном контексте слово обозначает незаселённое открытое место; «в поле» естественно по-русски и согласуется с контекстом братоубийства.
- source_word: ደሙ (damu)
  choice: кровь убитого
  rationale: Буквально «его кровь», но два мужских участника делают русское местоимение двусмысленным; явное обозначение жертвы сохраняет референт без изменения смысла.
- source_word: ይስኪ (yəsakki)
  choice: жалуясь
  rationale: Глагол выражает жалобу или обвинение; «жалуясь» естественно сочетается с персонифицированной кровью и сохраняет образ исходного текста.
- source_word: እምድር ውስተ ሰማይ (ʾəm-dər wəsta samāy)
  choice: от земли к небу
  rationale: Сохраняет пространственное направление вопля крови в исходном тексте.
theological_decisions:
- issue: Персонификация крови как свидетеля против убийцы
  choice: «кровь убитого возопила… жалуясь на него»
  alternative: «кровь убитого возопила… обвиняя его»
  rationale: Сохранена судебно-нравственная сила образа, но не устранена лексическая неоднозначность между жалобой и прямым обвинением; альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возопила» сохраняет высокий регистр и традиционный образ, оставаясь понятным современному читателю.
