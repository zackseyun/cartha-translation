base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/011.yaml
  text: He was the first among those born on earth to learn writing, instruction, and wisdom, and to write down the signs of heaven according to the order of their months in a book, so that the children of men might know the seasons of the years according to the order of each of their months.
translation:
  language: ru
  text: Он первым среди рождённых на земле научился письму, наставлению и мудрости и записал в книге знамения небес согласно порядку их месяцев, чтобы сыны человеческие знали сроки лет согласно порядку месяцев каждого из них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ
  choice: письму
  rationale: В сочетании с глаголом «научился» передаёт умение писать, а не отдельную книгу; далее книга названа явно.
- source_word: ትምህርተ
  choice: знанию
  rationale: Передаёт обучение или наставление как приобретённое знание и естественно сочетается с «письму» и «мудрости».
- source_word: ጥበበ
  choice: мудрости
  rationale: Прямое и устойчивое соответствие значению мудрости или искусности.
- source_word: ተአምረ፡ ሰማይ
  choice: небесные знамения
  rationale: Сохраняет значение небесных знаков и не сужает его до конкретных астрономических тел или явлений.
- source_word: ጊዜ፡ ዓመታት
  choice: времена годов
  rationale: Формально сохраняет сочетание «времена/сроки годов», не подменяя его более узким «календарём».
- source_word: እጓለ፡ እመሕያው
  choice: сыны человеческие
  rationale: Традиционное, понятное и контекстуально уместное обозначение людей, сохраняющее образность исходного выражения.
