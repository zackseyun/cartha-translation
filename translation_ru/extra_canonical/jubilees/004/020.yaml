base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/020.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: ru
  text: И в двенадцатый юбилей, в седьмую его седмину, он взял себе жену по имени Эдни, дочь Даниэля, дочь сестры его отца. А в шестой год этой седмины она родила ему сына, и он назвал его[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный текст стиха обрывается после слов «и он назвал его»; имя сына в нём не сохранилось.
    reason: Нельзя восполнять отсутствующее имя по контексту или иной текстовой традиции без рукописного основания.
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: юбилей
  rationale: Обычный термин для юбилейного периода в Книге Юбилеев; сохраняет структуру древнего летосчисления.
- source_word: ሱባዔ
  choice: седмина
  rationale: Обозначает семилетний период, а не обычную календарную неделю; «седмина» точно и достаточно понятно передаёт специальное значение.
- source_word: እድኒ
  choice: Эдни
  rationale: Транслитерация засвидетельствованной эфиопской формы имени без замены её иной текстовой традицией.
- source_word: ዳንኤል
  choice: Даниэль
  rationale: Передаёт форму имени в данном источнике и не навязывает отождествление с библейским Даниилом.
- source_word: ወጸውዐ ስሞ
  choice: и он назвал его
  rationale: Естественная русская передача буквального «и назвал его имя»; объект подразумевается исходной идиомой.
theological_decisions:
- issue: Родственная формула об Эдни
  choice: «дочь Даниэля, дочь сестры его отца»
  alternative: «дочь Даниэля, внучка сестры его отца»
  rationale: Сохранено повторение «дочь» и присущая источнику синтаксическая неоднозначность; вариант «внучка» яснее, но уже истолковывает точную степень родства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной исторической лексикой. Специальный хронологический термин «седмина» используется последовательно; синтаксис упрощён лишь настолько, чтобы текст звучал естественно, при сохранении родственной неоднозначности и незавершённости источника.
