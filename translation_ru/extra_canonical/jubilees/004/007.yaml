- source_word: ዘርአ
  choice: потомство
  rationale: В данном контексте «семя» означает продолжение рода; «потомство» естественнее по-русски, не устраняя отсылки к Быт 4:25.
- source_word: ትጉሃነ
  choice: Стражи
  rationale: Традиционное и смыслово точное обозначение группы ангелов; прописная буква показывает употребление как наименования.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: людей
  rationale: Идиоматическое обозначение человеческого рода; буквальное «сынов человеческих» здесь менее естественно для современного русского текста.
theological_decisions:
- issue: Способ призывания имени Господа Еносом
  choice: «Он первым стал призывать имя Господа»
  alternative: «Он первым назвал имя Господа»
  rationale: Глагол допускает значение называния или призывания; контекст и параллель Быт 4:26 поддерживают «призывать», но формулировка не уточняет характер богослужения.
- issue: Цель нисхождения Стражей
  choice: «чтобы наставлять людей»
  alternative: «чтобы учить сынов человеческих»
  rationale: Сохранена положительно сформулированная в данном фрагменте цель нисхождения без привнесения последующего осуждения Стражей.
- issue: Именование Бога
  choice: «Господь»
  alternative: «Яхве» или графическое «ГОСПОДЬ»
  rationale: Источник употребляет титул, а не явно представленное тетраграмматическое имя; перевод не должен подменять его конфессионально маркированной формой.
