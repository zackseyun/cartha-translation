  naturalness: '«Возвещаем пред Господом ... все грехи» синтаксически и лексически не вполне естественно: «пред Господом» оказывается привязано к возвещению, а не к приходу; кроме того, «возвещать грехи» звучит не по-русски. Перестановка с придаточным времени и глаголом «признаём» даёт естественную современную литературную фразу.'
  terminology: «Господь, Бог наш» точно передаёт геэзские титулы и не подменяет титул личным именем. «Признаём все грехи» в данном контексте естественно выражает объявление/сообщение о грехах, не вводя конфессионально специфической терминологии.
