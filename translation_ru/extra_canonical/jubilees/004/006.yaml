lexical_decisions:
- source_word: ወበእንተዝ
  choice: И потому
  rationale: Передаёт причинно-следственную связку «и по этой причине» естественным современным русским оборотом.
- source_word: ንሕነ፡ ናየድዕ
  choice: мы возвещаем
  rationale: Глагольная форма допускает значение сообщения или объявления; «возвещаем» сохраняет торжественный регистр и направленность высказывания.
- source_word: መጻእነ፡ ቅድመ
  choice: пред
  rationale: В сочетании с формой «приходим» выражает явление перед Богом; по-русски смысл естественно передаётся кратким «пред», без тяжеловесного придаточного.
- source_word: እግዚአብሔር፡ አምላክነ
  choice: Господом, Богом нашим
  rationale: Источник содержит титул «Господь», а не собственное имя Яхве; сохранено приложение «Бог наш».
- source_word: ኵሎ፡ ኀጢአተ
  choice: все грехи
  rationale: Буквальное и ясное соответствие; оборванность исходного стиха не устраняется добавлением отсутствующего дополнения.
theological_decisions:
- issue: Обозначение Бога
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: В геэзском тексте стоит божественный титул, а не тетраграмматон; написание капителью могло бы ошибочно обозначить имя Яхве.
- issue: Фрагментарный синтаксис стиха
  choice: Сохранить формально завершённую русскую фразу без домысливания объекта или продолжения
  alternative: Дополнить фразу материалом из соседнего стиха
  rationale: Предоставленный источник заканчивается словами «все грехи»; нельзя вносить отсутствующее продолжение, хотя русский падеж позволяет оформить данный отрывок как самостоятельное высказывание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Форма «пред» выбрана ради достоинства стиля; чрезмерно архаичные конструкции исключены.
