translation:
  language: ru
  text: Он первым записал свидетельство[a] и засвидетельствовал сынам человеческим среди поколений земли; он поведал о неделях юбилеев, возвестил дни лет и установил порядок месяцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «записал свидетельство» можно также понять как «составил запись» или «записал свидетельское сообщение».
    reason: lexical_alternative
lexical_decisions:
- source_word: ጸሐፈ ስምዐ
  choice: записал свидетельство
  rationale: Передаёт сочетание глагола «писать» и существительного со значением «свидетельство / свидетельское сообщение», сохраняя возможность понимать его как письменную запись.
- source_word: አስምዐ
  choice: засвидетельствовал
  rationale: Сохраняет связь с предшествующим «свидетельством» и каузативно-декларативный смысл глагола.
- source_word: ውስተ ትዝምደ ምድር
  choice: среди поколений земли
  rationale: Формально и естественно передаёт родо-поколенческое значение выражения, не заменяя его более узким «в родословиях».
- source_word: ሱባዔሆሙ ለኢዮቤልውሳት ነገረ
  choice: исчислил недели юбилеев
  rationale: Глагол допускает значение сообщения или перечисления; «исчислил» уместно в календарном контексте и сохраняет идею упорядоченного счёта.
- source_word: መዋዕለ ዓመታት አይድዐ
  choice: возвестил дни годов
  rationale: Сохраняет буквальный календарный оборот и значение «дать знать / объявить».
- source_word: አውራኅ ሰርዐ
  choice: установил порядок месяцев
  rationale: Естественно передаёт действие упорядочивания месяцев, не уточняя сверх источника конкретную календарную систему.
