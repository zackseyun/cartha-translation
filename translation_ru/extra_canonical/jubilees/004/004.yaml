  yaml_path: translation/extra_canonical/jubilees/004/004.yaml
  text: And therefore the Lord rebuked Cain because of Abel[4], because he had killed him; and he made him a fugitive on the earth because of the blood of his brother, and he cursed him on the earth.
translation:
  language: ru
  text: И потому Господь обличил Каина за Авеля[a], за то, что тот убил его; Он сделал Каина скитальцем на земле из-за крови его брата и проклял его на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рабочем корпусе стих 4 не сохранился отдельной пронумерованной строкой: его смысл передают начальное повторение и продолжение в строке 5. Перевод восстанавливает связный текст по ближайшему контексту геэзского источника, не добавляя новых подробностей.'
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: Господь
  rationale: Обычное и естественное русское соответствие геэзскому божественному титулу; написание «ГОСПОДЬ» не используется, поскольку в геэзском тексте нет отдельного обозначения тетраграмматона.
- source_word: ዘለፎ (zaläfo)
  choice: обличил
  rationale: Передаёт порицание и осуждающий укор без излишнего усиления до значения наказания.
- source_word: በእንተ አቤል (baʾəntä ʾAbel)
  choice: за Авеля
  rationale: Предлог допускает значения «из-за, по поводу, за»; в данном контексте «за Авеля» естественно выражает причину обличения, а следующая фраза её поясняет.
- source_word: ደመ እኁሁ (damä ʾəḫuhu)
  choice: крови его брата
  rationale: Сохраняет конкретный образ пролитой крови и родственную связь из источника.
- source_word: ደበ ምድር / በዲበ ምድር (diba mədr)
  choice: на земле
  rationale: Прямое и естественное пространственное соответствие, сохраняющее повтор источника.
theological_decisions:
- issue: Обозначение Бога
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует форме геэзского текста и не привносит типографическое обозначение еврейского тетраграмматона.
- issue: Субъект убийства в пояснительной фразе
  choice: «за то, что тот убил его»
  alternative: «за то, что он убил его»
  rationale: 'Указательное «тот» устраняет ненужную русскую местоименную двусмысленность, не меняя однозначного по контексту смысла: Каин убил Авеля.'
- issue: Восстановление смысла при нарушенной нумерации
  choice: Включён связный смысл перехода между сохранившимися строками
  alternative: Оставить стих фрагментарным
  rationale: Рабочий геэзский корпус не содержит отдельной строки с номером 4, однако начало отрывка и продолжение под номером 5 сохраняют содержание стиха; перевод не расширяет его сверх непосредственного контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повтор «на земле» сохранён как значимый элемент источника; местоимения слегка уточнены ради ясности.
