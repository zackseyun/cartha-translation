  text: And he was still with the angels of God for six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.
translation:
  language: ru
  text: И пребывал он с ангелами Божьими на протяжении шести юбилеев[a]. Они показали ему всё, что на земле и на небесах, власть солнца, и он всё записал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Один юбилей равен сорока девяти годам; шесть юбилеев составляют 294 года.
    reason: Поясняет специальную хронологическую единицу, сохранённую в основном тексте.
lexical_decisions:
- source_word: ሀሎ፡ እንከ
  choice: пребывал
  rationale: Передаёт продолжительное пребывание Еноха; частица እንከ служит связке повествования и не требует отдельного тяжеловесного соответствия.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: шесть юбилеев лет
  rationale: Сохранена особая хронологическая единица Книги Юбилеев, а не заменена истолкованным числом лет.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: владычество солнца
  rationale: ሥልጣን обозначает власть, господство или управление; «владычество» сохраняет образный и космологический смысл без его сведения к движению или календарному циклу солнца.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: и он всё записал
  rationale: Естественная русская передача буквального «и написал всё» в контексте письменного знания Еноха.
theological_decisions:
- issue: Характер открытого Еноху знания
  choice: «владычество солнца»
  alternative: «движение солнца» или «законы солнца»
  rationale: Исходное слово прямо выражает власть или управление. Более конкретные варианты истолковывали бы космологическое выражение и устраняли его смысловую напряжённость.
