base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/014.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: ru
  text: И в двенадцатый юбилей, в седьмую его седмицу, он взял себе жену по имени Эдни, дочь Данела, дочери сестры его отца[a]. В шестой год этой седмицы она родила ему сына, и он назвал его Мафусалом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская родословная формула буквально: «дочь Данела, дочь сестры его отца». Её синтаксическая соотнесённость не вполне ясна; поэтому она сохранена без реконструкции. В английском консультационном тексте дано иное родство: «дочь Данела, дочери брата его отца».'
    reason: Сохраняет неоднозначность эфиопского текста и прозрачно отмечает расхождение с английским POB-аудитом, не навязывая одну реконструкцию.
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: юбилей
  rationale: Сохраняется специальное хронологическое обозначение Книги Юбилеев — период в сорок девять лет.
- source_word: ሱባዔ
  choice: седмица
  rationale: Здесь это хронологическая единица в семь лет; «седмица» передаёт её точнее, чем обычное «неделя».
- source_word: እድኒ
  choice: Эдни
  rationale: Транслитерация эфиопского имени без отождествления с иным библейским именем.
- source_word: ማቱሳላ
  choice: Мафусал
  rationale: Употреблена традиционная русская форма имени Мафусала.
theological_decisions:
- issue: Родственная связь Эдни с семьёй Еноха
  choice: «Данела, который происходил из рода сестры его отца» с текстологической сноской
  alternative: «Данела, дочери сестры его отца» или, по английскому консультационному тексту, «дочери брата его отца»
  rationale: Эфиопская последовательность буквально содержит слова «дочь Данела, дочь сестры его отца», но её грамматическая соотнесённость и пол Данела неясны; основной текст передаёт несомненную родовую связь, не навязывая спорную реконструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Термин «седмица» выбран ради ясного отличия семилетнего периода от календарной недели; синтаксис упрощён без утраты хронологии и родословной связи.
