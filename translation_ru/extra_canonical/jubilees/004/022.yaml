base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: ru
  text: Он свидетельствовал Стражам, согрешившим с дочерьми человеческими, ибо они начали соединяться с дочерьми человеческими, чтобы оскверняться; и Енох свидетельствовал против всех них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: Стражей
  rationale: Традиционное и контекстуально точное обозначение сверхъестественных «наблюдающих» существ; прописная буква показывает, что речь идёт об определённой группе.
- source_word: አበሱ
  choice: согрешивших
  rationale: Передаёт глагол со значением совершения греха или проступка без уточнения его природы сверх сказанного в тексте.
- source_word: ይደመሩ
  choice: соединяться
  rationale: Сохраняет значение присоединения или вступления в связь и не делает выражение более откровенным, чем источник.
- source_word: ይርኩሱ
  choice: оскверняться
  rationale: Передаёт идею ритуально-нравственного осквернения и сохраняет богословскую оценку связи.
- source_word: አስምዐ
  choice: свидетельствовал против
  rationale: В данном судебно-обличительном контексте глагол означает давать свидетельство, направленное против виновных.
theological_decisions:
- issue: Природа греха Стражей
  choice: Сохранена формулировка о соединении с дочерьми человеческими и осквернении
  alternative: Уточнить как половые отношения или брак
  rationale: Источник говорит о соединении и осквернении, но не вводит здесь более специального термина; конкретизация могла бы снять присущую тексту меру неоднозначности.
- issue: Судебный характер действий Еноха
  choice: «свидетельствовал против»
  alternative: «обличал» или «предостерегал»
  rationale: Так сохраняется повторяющийся в источнике язык свидетельства и его направленность против всех Стражей.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён настолько, чтобы фраза была ясна обычному читателю, при этом повтор имени Еноха и глагола «свидетельствовал» сохранён вслед за источником.
