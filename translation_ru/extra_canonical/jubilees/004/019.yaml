base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: ru
  text: И он рассказал о субботах лет, как мы открыли ему. И в сонном видении он увидел то, что было и что будет, — что произойдёт с сынами человеческими в их поколениях до дня суда. Он всё увидел и познал, записал своё свидетельство и поместил его на земле…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: субботы лет
  rationale: Сохраняет характерное для книги юбилейное обозначение периодов по семь лет, не подменяя его пояснительным толкованием.
- source_word: ነገረ
  choice: исчислил
  rationale: В данном контексте передачи временных циклов глагол естественно означает перечисление или счёт; «исчислил» сохраняет достоинство стиля.
- source_word: በራእየ፡ ንዋሙ
  choice: в сонном видении
  rationale: Передаёт оба элемента выражения — видение и сон — естественным современным русским оборотом.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: сыны человеческие
  rationale: Формальное библейское соответствие антропологическому выражению источника; здесь речь идёт о человечестве.
- source_word: ዕለተ፡ ደይን
  choice: день суда
  rationale: Прямое и богословски нейтральное соответствие эсхатологическому выражению.
- source_word: ርእየ፡ ወአእመረ
  choice: увидел и познал
  rationale: 'Сохраняет различие двух глаголов: восприятие видения и обретение знания/понимания.'
- source_word: አንበረ
  choice: оставил
  rationale: В сочетании со свидетельством на земле по-русски естественнее «оставил», хотя буквально возможно «поместил».
theological_decisions:
- issue: Объём знания Еноха
  choice: Он всё увидел и познал
  alternative: Он всё увидел и понял
  rationale: «Познал» не сводит сказанное лишь к интеллектуальному пониманию и сохраняет широкий смысл исходного глагола.
- issue: Характер суда
  choice: до дня суда
  alternative: до Судного дня
  rationale: Строчная форма ближе к обычному выражению источника и не усиливает терминологическую определённость сверх текста.
- issue: Связь предсказанного с поколениями людей
  choice: что произойдёт с сынами человеческими во всех их поколениях
  alternative: как будет с сынами человеческими в их поколениях
  rationale: Выбрана естественная русская формулировка без уточнения природы событий, которой источник не раскрывает.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены выражения «субботы лет» и «сыны человеческие» как значимые особенности древнего текста. Многоточие в конце отражает обрыв предоставленного фрагмента источника, а не завершённость синтаксической единицы.
