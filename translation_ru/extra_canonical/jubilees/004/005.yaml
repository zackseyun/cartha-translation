base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: ru
  text: 'И потому на небесных скрижалях написано: «Проклят тот, кто злонамеренно ударит ближнего». И пусть все, кто увидит и услышит об этом, скажут: «Да будет так». А человек, увидевший это и не сообщивший[a], пусть будет проклят так же, как он.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной электронной передаче стоит «и сообщит»; по смыслу и принятому текстологическому исправлению следует читать: «и не сообщит».'
    reason: 'Отрицание текстологически значимо: проклятие относится к свидетелю, который не сообщил о проступке.'
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Устойчивое и понятное соответствие буквальному выражению «скрижали неба», сохраняющее характерную терминологию Книги Юбилеев.
- source_word: ዘይዘብጥ
  choice: тот, кто ... ударит
  rationale: Глагол означает нанесение удара; выбран прямой русский эквивалент без усиления до «убьёт».
- source_word: ካልአ
  choice: другого
  rationale: Буквально «другого»; это не обязательно узкий термин «ближний», поэтому сохранён более широкий смысл.
- source_word: በእኩይ
  choice: со злым умыслом
  rationale: Передаёт злонамеренный, преступный характер действия и естественно звучит по-русски.
- source_word: ይኩን
  choice: Да будет так
  rationale: Формула подтверждения или согласия передана буквально и торжественно.
- source_word: ከማሁ
  choice: так же, как он
  rationale: Сохраняет сравнительную отсылку к проклятому виновнику, не уточняя её сверх источника.
theological_decisions:
- issue: Проклятие свидетеля, не сообщившего о злодеянии
  choice: «увидит это и не сообщит»
  alternative: «увидит это и сообщит»
  rationale: 'Контекст требует отрицания: проклятию подвергается тот, кто видел проступок, но не заявил о нём. Положительное чтение делало бы наказуемым именно сообщение; оно объясняется ошибкой в представленном тексте/его распознавании.'
- issue: Объект злонамеренного удара
  choice: «другого»
  alternative: «ближнего»
  rationale: Передаёт исходное καልአ / «другого» без внесения дополнительной богословско-этической терминологии.
translation_notes:
  register: Современный литературный русский с достоинством древнего законодательного изречения. Формулы «на небесных скрижалях», «Проклят тот» и «Да будет так» сохраняют торжественный регистр; синтаксис при этом остаётся ясным для обычного читателя.
