  source_fidelity: 'Предоставленный геэзский фрагмент не соответствует ссылке: он относится к последующему эпизоду об Авеле и Каине, а не к Юбилеям 4:1. В соответствии с зафиксированной редакционной реконструкцией и английской контрольной версией содержание 4:1 — рождения Каина, Авеля и Аван. Перевод сохраняет порядок событий, указания на третью, четвёртую и пятую недели второго юбилея и принадлежность Аван к дочерям той же женщины.'
  naturalness: 'Небольшая правка делает временные обстоятельства и порядок слов более естественными для современного литературного русского: «в третью неделю» и «свою дочь Аван».'
  terminology: 'Имена «Каин» и «Авель» соответствуют обычному русскому библейскому употреблению; «Аван» — принятая передача имени Awan. «Юбилей» сохранён как хронологический термин книги. Сноска не требуется: английская сноска отражает ошибочно подставленный текст другого стиха и не имеет якоря в данном переводе.'
