- source_word: ፍትሐ፡
  choice: справедливость
  rationale: Передаёт значение правосудия и справедливого порядка, сохраняя отличие от следующего понятия.
- source_word: ርተዐ፡
  choice: праведность
  rationale: Передаёт нравственную прямоту и правильность поведения; вместе со «справедливостью» сохраняет парную формулу источника.
