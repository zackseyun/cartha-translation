  choice: 'Сохранить два отдельных понятия: «справедливость и праведность»'
  alternative: Объединить их в выражении «поступали справедливо»
  rationale: Источник использует два координированных существительных; их объединение устранило бы смысловое напряжение между общественно-судебной справедливостью и нравственной прямотой.
