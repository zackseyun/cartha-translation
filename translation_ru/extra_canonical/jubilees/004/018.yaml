  yaml_path: translation/extra_canonical/jubilees/004/018.yaml
  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: ru
  text: …сынам человеческим времена лет в соответствии с их порядком, по каждому из их месяцев.[a] Он первым записал свидетельство и засвидетельствовал сынам человеческим среди поколений земли, рассказал о седминах юбилеев, возвестил дни лет и упорядочил месяцы.
  philosophy: optimal-equivalence
  footnotes:
