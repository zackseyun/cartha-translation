    reason: source_fragment
lexical_decisions:
- source_word: እጓለ፡ እመሕያው
  choice: сынам человеческим
  rationale: Традиционное и понятное соответствие геэзскому выражению «дети/сыны людей»; в первом вхождении сохранён дательный синтаксис фрагмента, во втором — адресат свидетельства.
- source_word: ጊዜ፡ ዓመታት
  choice: времена годов
  rationale: Передаёт календарные периоды/сроки годов, не сужая значение до обычных времён года.
- source_word: ስምዐ፡ ወአስምዐ
  choice: записал свидетельство и засвидетельствовал
  rationale: Сохранена словесная связь между существительным «свидетельство» и глаголом «свидетельствовать».
- source_word: ትዝምደ፡ ምድር
  choice: поколений земли
  rationale: Формально сохраняет земной и генеалогический образ исходного текста.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: седминах юбилеев
  rationale: «Седмины» обозначают семилетние циклы и позволяют отличить их от обычных календарных недель.
- source_word: መዋዕለ፡ ዓመታት
  choice: дни годов
  rationale: Сохранено буквальное календарное выражение без истолкования как общей хронологии.
- source_word: አውራኅ፡ ሰርዐ
  choice: упорядочил месяцы
  rationale: Естественно передаёт действие установления месяцев в надлежащем порядке.
theological_decisions:
- issue: Содержание записанного свидетельства
  choice: Не отождествлять свидетельство с конкретным позднейшим текстом или каноном
  alternative: Назвать его пророчеством, книгой либо определённым священным произведением
  rationale: Исходный текст говорит только о «свидетельстве» и не уточняет его канонический или жанровый статус.
- issue: Смысл седмин юбилеев
  choice: Сохранить календарно-хронологический термин без богословского истолкования
  alternative: Раскрыть его как пророческие эпохи или периоды истории спасения
  rationale: Такая конкретизация выходила бы за пределы исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Архаизирующее «седмины» сохранено как точный технический термин для семилетних циклов; прочая лексика сделана общепонятной. Маркер сноски помещён непосредственно в основной текст.
