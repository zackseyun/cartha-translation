base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: ru
  text: В одиннадцатый юбилей Иаред взял себе в жёны Бараку, дочь Расуяла[a], дочь брата своего отца, в четвёртую седмину этого юбилея. Она родила ему сына в пятую седмину, в четвёртый год юбилея, и он нарёк ему имя Енох.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых старых изданиях это имя передаётся латинской формой Rasujal.
    reason: lexical_choice
lexical_decisions:
- source_word: ባረካ
  choice: Барака
  rationale: Имя передано прямой транслитерацией с геэзского; форма сохраняет узнаваемость и морфологическую нейтральность.
- source_word: ራሱያል
  choice: Расуял
  rationale: Прямая передача геэзских знаков; вариант «Расуял» точнее отражает y, чем встречающееся в старых изданиях написание через j.
- source_word: ሱባዔ
  choice: седмина
  rationale: Здесь слово обозначает хронологическую неделю из семи лет; «седмина» позволяет отличить её от обычной семидневной недели и естественно сочетается с юбилейным летосчислением.
- source_word: ወሰመየ ፡ ስሞ
  choice: и он нарёк ему имя
  rationale: Дигнифицированная, но понятная передача формулы именования без добавления отсутствующего в источнике объяснения имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Родство передано буквально как «дочь брата своего отца», чтобы не устранять референциальную структуру источника. Временная формула понята по контексту как четвёртый год пятой седмины; повтор «этой седмины» внесён для ясности смысла, который в геэзском выражен эллиптически.
