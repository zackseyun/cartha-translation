base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: ru
  text: …году юбилея и нарёк ему имя Енох. Он был первым среди сынов человеческих, родившихся на земле, кто научился письму, знанию и мудрости и записал в книге знамения неба в соответствии с порядком их месяцев, чтобы они знали…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እጓለ፡ እመሕያው
  choice: сынов человеческих
  rationale: Устойчивое и точное соответствие эфиопскому обозначению людей; сохраняет библейский регистр без архаической тяжеловесности.
- source_word: መጽሐፈ፡ ወትምህርተ፡ ወጥበበ
  choice: письму, знанию и мудрости
  rationale: Передаёт трёхчленный ряд навыка письма, усвоенного знания и мудрости, не сводя разные понятия к одному.
- source_word: ተአምረ፡ ሰማይ
  choice: знамения неба
  rationale: Сохраняет широкий смысл небесных знаков или явлений и не сужает его до конкретной астрономической системы.
- source_word: በከመ፡ ሥርዐተ፡ አውራኅሆሙ
  choice: в соответствии с порядком их месяцев
  rationale: Близко следует грамматике сохранившегося текста и сохраняет местоименную соотнесённость, не разъясняя её сверх источника.
theological_decisions:
- issue: Кто подразумевается в заключительном «чтобы они знали»
  choice: сохранено местоимение «они» без уточнения
  alternative: «чтобы сыны человеческие знали»
  rationale: Предоставленный фрагмент заканчивается на ይእምሩ («они знали»); явное дополнение субъекта из более полного текста вышло бы за пределы данного источника и сняло бы его фрагментарность.
- issue: Характер «знамений неба»
  choice: нейтральное «знамения неба»
  alternative: «небесные светила» или «астрономические явления»
  rationale: Нейтральная формулировка не навязывает ни астрологического, ни современного научного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Начальное и конечное многоточия сохранены, поскольку предоставленный текст представляет собой фрагмент, продолжающий предыдущую фразу и обрывающийся до завершения следующей.
