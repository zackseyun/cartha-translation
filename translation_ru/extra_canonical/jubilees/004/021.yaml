  yaml_path: translation/extra_canonical/jubilees/004/021.yaml
  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: ru
  text: И он пробыл с ангелами Божьими шесть юбилеев лет[a]. Они показали ему всё, что на земле и на небесах, владычество солнца[b], и он всё записал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Юбилей — хронологический период продолжительностью сорок девять лет; шесть юбилеев составляют 294 года.
    reason: Поясняет специфическую для Книги Юбилеев единицу времени.
  - marker: b
    text: 'Или: «власть солнца». Возможно, речь идёт об установленном для солнца порядке или сфере его действия.'
    reason: Сохраняет смысловой диапазон слова, обозначающего власть или господство, не подменяя перевод однозначным толкованием.
lexical_decisions:
- source_word: ወሀሎ፡ እንከ፡
  choice: И он оставался… ещё
  rationale: Передаёт продолженное пребывание и добавочный оттенок እንከ, не утяжеляя современную русскую фразу.
- source_word: መላእክት፡ አምላክ፡
  choice: ангелами Божьими
  rationale: Прямое и естественное соответствие выражению «ангелы Бога».
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት፡
  choice: шесть юбилеев лет
  rationale: Сохраняет характерную для книги хронологическую формулу и прямое упоминание лет; значение поясняется в сноске.
- source_word: ኵሎ፡ ዘውስተ፡ ምድር፡ ወዘበሰማያት፡
  choice: всё, что на земле и на небесах
  rationale: Естественно передаёт всеохватность исходной формулы и сохраняет множественное число «небеса».
- source_word: ሥልጣነ፡ ለፀሐይ፡
  choice: власть солнца
  rationale: Формально передаёт ሥልጣን как «власть/владычество», не сводя выражение без достаточных оснований к движению или ходу солнца.
- source_word: ወጸሐፈ፡ ኵሎ።
  choice: и он всё записал
  rationale: В контексте откровения «записал» яснее русского «написал» выражает фиксацию всего увиденного.
theological_decisions:
- issue: Смысл выражения «власть солнца»
  choice: Сохранить буквальное и неоднозначное выражение «власть солнца».
  alternative: «движение солнца» или «законы, управляющие солнцем»
  rationale: Исходное ሥልጣን обозначает власть, господство или полномочие; более конкретные варианты устранили бы образность и истолковали космологию текста за читателя.
- issue: Обозначение ангелов
  choice: «ангелы Божьи»
  alternative: «ангелы Бога»
  rationale: Оба варианта возможны, но притяжательное прилагательное звучит по-русски естественно и не добавляет конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя, тогда как необычная хронологическая формула и космологическое выражение сохранены и кратко пояснены. Начальное ማቱሳላ («Мафусал») рассматривается как завершение предшествующего контекста/сегмента, а не как синтаксическая часть данного предложения, в соответствии со смыслом стиха и консультационным слоем.
