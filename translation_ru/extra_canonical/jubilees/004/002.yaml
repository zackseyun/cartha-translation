  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: ru
  text: На пятой седмине она родила ему дочь Аван. А в первый год третьего юбилея Каин убил Авеля, потому что приношение Авеля было принято, а жертва Каина — не принята.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃምስ፡
  choice: пятая седмина
  rationale: Передаёт счёт времени по семилетним периодам; «седмина» сохраняет специальный хронологический смысл и уместна в книге Юбилеев.
- source_word: አዋን፡
  choice: Аван
  rationale: Транслитерация эфиопского личного имени в форме, естественной для русского текста.
- source_word: ኢዮቤሌው፡
  choice: юбилей
  rationale: Обозначает сорокадевятилетний хронологический цикл в структуре книги.
- source_word: ቍርባኖ፡
  choice: приношение
  rationale: Позволяет отличить обозначение дара Авеля от следующего слова «жертва», сохраняя лексическое варьирование источника.
- source_word: መሥዋዕቶ።
  choice: жертва
  rationale: Прямое и традиционно понятное обозначение жертвенного дара Каина.
- source_word: ተወክፈ፡ / ኢተወክፈ፡
  choice: было принято / не принята
  rationale: Сохраняет пассивную форму источника и не добавляет прямо не названного действующего лица.
theological_decisions:
- issue: Кем были приняты или не приняты приношения
  choice: 'Сохранён безличный пассив: «было принято… не принята»'
  alternative: «Бог принял… не принял»
  rationale: Источник использует пассив и не называет Бога непосредственно; перевод не устраняет эту сдержанность.
- issue: Явное указание владельца второй жертвы
  choice: «жертва Каина»
  alternative: «его жертва»
  rationale: Источник прямо называет Каина, поэтому явное имя устраняет ненужную местоименную двусмысленность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» выбран ради точного обозначения семилетнего периода; синтаксис упрощён до естественного русского без утраты хронологии и причинной связи.
