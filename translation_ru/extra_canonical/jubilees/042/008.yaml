lexical_decisions:
- source_word: አሕስሊሆሙ
  choice: их мешки
  rationale: Форма обозначает принадлежавшие им мешки; такое соответствие согласуется с контекстом рассказа об их поклаже.
- source_word: ወኢያእመሩ
  choice: а они об этом не знали
  rationale: Передаёт отрицание знания естественным современным русским оборотом; противительное «а» ясно выражает контраст с тайным помещением в мешки.
- source_word: ወአዘዞሙ
  choice: И он велел им
  rationale: Глагол выражает распоряжение или повеление; «велел» здесь звучит естественно и сохраняет силу приказа.
- source_word: ያምጽኡ
  choice: привести
  rationale: Инфинитив цели после глагола повеления точно передаёт требование доставить брата к говорящему.
- source_word: እኅዋሆሙ
  choice: своего самого младшего брата
  rationale: Притяжательное отношение передано возвратным местоимением, относящимся к исполнителям приказа; «самого младшего» уточняется продолжением стиха и контекстом.
