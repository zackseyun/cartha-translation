lexical_decisions:
- source_word: አኀዊሁ
  choice: своих братьев
  rationale: Форма означает «его братья»; по-русски при совпадении действующего лица и обладателя естественно «своих братьев».
- source_word: አሕስሊሆሙ
  choice: их мешки
  rationale: Передаёт ёмкости для зерна нейтральным и понятным современным словом «мешки».
- source_word: ስርናየ
  choice: зерном
  rationale: Общее обозначение зерна сохраняет лексическую широту исходного слова и соответствует контексту наполнения мешков.
- source_word: ወርቆሙ
  choice: их деньги
  rationale: Буквально слово связано с «золотом», но в данном торговом контексте обозначает деньги; «серебро» не соответствует геэзскому тексту.
- source_word: ሎሙ
  choice: для них
  rationale: Дательный оборот означает «для них», а не «в них»; сохранена конструкция источника без гармонизации с Быт 42:25.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; последовательность действий передана плавно, при этом сохранено исходное «для них», несмотря на возможную необычность оборота.
