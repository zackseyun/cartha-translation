  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: ru
  text: Он отпустил своих братьев, наполнил их мешки зерном и положил им также их деньги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
