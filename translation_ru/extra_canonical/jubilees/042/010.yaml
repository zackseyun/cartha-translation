translation:
  language: ru
  text: 'чтобы они привели Вениамина. И сказал Иаков: «Вы лишили меня детей: Иосифа больше нет, и Симеона тоже нет…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: чтобы они привели Вениамина
  rationale: Передаёт целевую/зависимую глагольную форму и имя Вениамина естественным современным русским языком; начало стиха синтаксически продолжает предшествующий контекст.
- source_word: እምከንከሙኒከ
  choice: вы лишили меня детей
  rationale: Глагол выражает утрату детей; русская конструкция сохраняет обращение Иакова к сыновьям и смысл тяжёлой семейной потери.
- source_word: ኢሀሎ
  choice: больше нет
  rationale: Буквально выражение означает «нет / не существует», но в данном контексте утраты человека русское «больше нет» звучит естественно и не уточняет, умер ли Иосиф.
- source_word: ወስምዖንሂ፡
  choice: и Симеона тоже
  rationale: Частица ሂ передана словом «тоже», связывающим судьбу Симеона с упоминанием Иосифа.
theological_decisions:
- issue: Считать ли слова Иакова утверждением о смерти Иосифа и Симеона
  choice: «больше нет»
  alternative: «умер» / «погиб»
  rationale: Источник говорит об отсутствии, а не прямо о смерти. Формулировка сохраняет драматическую перспективу Иакова и не устраняет повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Многоточие сохранено, поскольку предоставленный отрывок обрывается и предложение продолжается за его пределами.
