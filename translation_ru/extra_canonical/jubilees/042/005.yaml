  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: ru
  text: 'И Иосиф узнал их, но они его не узнали. Он говорил с ними сурово и сказал им: «Не соглядатаи ли вы? Не пришли ли вы высмотреть незащищённые места этой земли?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእመሮሙ፡ ዮሴፍ፡ ወእሙንቱሰ፡ ኢያእመርዎ
  choice: И Иосиф узнал их, но они его не узнали
  rationale: Сохранены взаимно противопоставленные формы глагола «знать/узнавать» и явный контраст между Иосифом и братьями.
- source_word: ወተናገረ፡ ምስሌሆሙ፡ ዐጹባጺበ
  choice: Он говорил с ними сурово
  rationale: Наречное значение передано естественным русским оборотом без усиления до «жестоко».
- source_word: ሰብአ፡ ዓይን
  choice: соглядатаи
  rationale: Буквально выражение связано с «людьми глаза», но в контексте обвинения обозначает разведчиков или шпионов; «соглядатаи» сохраняет библейское достоинство и идею высматривания.
- source_word: ታስተሓይዪ
  choice: высмотреть
  rationale: Выбор связывает цель прихода с наблюдением и разведкой, сохраняя смысл обвинения.
- source_word: ጸባረ፡ ምድር
  choice: незащищённые места этой земли
  rationale: Передаёт уязвимые, открытые части страны естественно и конкретно, не сужая значение до одного географического объекта.
