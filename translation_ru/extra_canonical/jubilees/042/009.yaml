  yaml_path: translation/extra_canonical/jubilees/042/009.yaml
  text: And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and how the ruler of the land had spoken harshly with them and had seized Simeon until...
translation:
  language: ru
  text: Они вышли из Египта и пришли в Ханаан. Они рассказали своему отцу обо всём, что с ними произошло, и о том, как правитель страны говорил с ними сурово и удерживал Симеона до тех пор, пока…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в следующем стихе.
    reason: Геэзское እስከ፡ ሶበ («до тех пор, пока») вводит придаточную часть, продолжающуюся за границей стиха; многоточие передаёт эту незавершённость.
lexical_decisions:
- source_word: ወአፎ
  choice: «и о том, как»
  rationale: Передаёт значение «и как» и естественно связывает вторую часть рассказа с предшествующим сообщением.
- source_word: መኰንነ፡ ብሔር
  choice: «правитель страны»
  rationale: Точно и нейтрально передаёт титул и область власти, не уточняя должность сверх исходного текста.
- source_word: ዐጹባጺበ፡ ተናገረ
  choice: «сурово говорил»
  rationale: Сохраняет характеристику речи без усиления до угроз или жестокого обращения.
- source_word: ወአሐዘ፡ ለስምዖን
  choice: «и задержал Симеона»
  rationale: В данном повествовательном контексте глагол означает, что Симеона схватили и удерживали; «задержал» естественно выражает оба аспекта.
- source_word: እስከ፡ ሶበ
  choice: «до тех пор, пока…»
  rationale: Это сочетание вводит придаточную часть, продолжающуюся в следующем стихе; многоточие сохраняет незавершённость синтаксиса на границе стиха.
