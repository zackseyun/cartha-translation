revisions:
- from: И они поднялись из земли Египетской и пришли в землю Ханаанскую. Они рассказали своему отцу обо всём, что с ними произошло, и о том, как правитель страны сурово говорил с ними и задержал Симеона до тех пор, пока…[a]
  to: Они вышли из Египта и пришли в Ханаан. Они рассказали своему отцу обо всём, что с ними произошло, и о том, как правитель страны говорил с ними сурово и удерживал Симеона до тех пор, пока…[a]
  rationale: Правка ограничена стилистическим обновлением географических формул, естественным порядком слов и более точной передачей удержания Симеона. Многоточие и примечание сохранены, поскольку конец стиха в источнике открывает придаточную конструкцию, завершающуюся в следующем стихе.
