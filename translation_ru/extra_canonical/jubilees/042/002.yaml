- from: И дождь не давался земле[a], потому что не было ливня, который сошёл бы на неё. Земля стала бесплодной, и только в земле Египетской была пища, потому что Иосиф собрал семена для земли.
  to: И дождь не был дан земле[a], потому что не было ливня, который шёл. Земля стала бесплодной, и только в земле Египетской была пища, потому что Иосиф собрал семена для земли.
  rationale: Правка делает начальную фразу естественной для современного литературного русского, сохраняя пассивный смысл «не был дан» и оставляя необычную идиому в сноске. Замена «сошёл бы» на «шёл» устраняет не предусмотренный источником условный оттенок. Остальная лексика и синтаксическое членение сохранены.
