lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  choice: И дождь не давался земле
  rationale: Передаёт необычную исходную конструкцию с глаголом «отказываться/не соглашаться» и пассивным инфинитивом, не превращая её полностью в безличное «дождь был удержан».
- source_word: ምትነ
  choice: ливня
  rationale: Контекстуально обозначает нисходящий дождевой поток; «ливень» естественно отличает его от общего слова «дождь» в предыдущей части.
- source_word: ዐብረተ፡ ምድር
  choice: Земля стала бесплодной
  rationale: Передаёт результат отсутствия дождя современным и ясным русским выражением.
- source_word: ሲሲተ
  choice: пища
  rationale: Широкое значение соответствует контексту запасов продовольствия и не сужает смысл до конкретного продукта.
- source_word: ዘርአ
  choice: семена
  rationale: Сохраняет буквальный сельскохозяйственный образ; множественное число естественно для русского контекста запасённого зерна для страны.
