lexical_decisions:
- source_word: በቀዳሚ ዓመት
  choice: в первый год
  rationale: Прямо передаёт временное обозначение исходного текста.
- source_word: ሱባዔ
  choice: седмина
  rationale: Здесь обозначает семилетний период; «седмина» сохраняет календарно-хронологический смысл и библейский регистр.
- source_word: ኢዮቤልው
  choice: юбилей
  rationale: Передаёт техническое обозначение юбилейного сорокадевятилетнего цикла.
- source_word: ዐባር
  choice: голод
  rationale: Контекстуальное значение — голод, нехватка пищи.
- source_word: ይምጻእ ውስተ
  choice: пришёл в
  rationale: Сохраняет образ движения и наступления голода; русское прошедшее время естественно в повествовательной рамке.
