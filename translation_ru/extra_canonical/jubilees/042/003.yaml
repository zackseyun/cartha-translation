    issue: «зерно прежнего года»
    rationale: 'Перевод в единственном числе создаёт смысл одного предшествующего года, тогда как контекст и принятый английский аудит передают запасы зерна прежних лет. Следует сохранить более широкий временной смысл: «зерно прежних лет».'
  - severity: low
    issue: «народам той земли»
    rationale: «Той» не имеет явной опоры в данном фрагменте и звучит менее естественно. «Народам страны» точно передаёт «peoples of the land» без лишней указательности.
