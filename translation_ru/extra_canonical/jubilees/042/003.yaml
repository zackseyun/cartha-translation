translation:
  language: ru
  text: за семь лет изобилия и сохранил его. И египтяне[a] пришли к Иосифу, чтобы он дал им пищу. Тогда он открыл хранилища, где находилось зерно прежних лет, и продал его народам страны за золото.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Египет».'
    reason: В оригинале стоит название страны, грамматически связанное с формами множественного числа и потому обозначающее египтян собирательно.
lexical_decisions:
- source_word: ግብጽ
  choice: египтяне
  rationale: Название «Египет» употреблено собирательно; множественное число глагола ወመጽኡ и местоименного суффикса в የሀቦሙ указывает на жителей Египта.
- source_word: ሲሲተ
  choice: пищу
  rationale: Общее обозначение пропитания; в контексте выдачи зерна естественно передаётся современным словом «пища».
- source_word: መዛግብተ
  choice: хранилища
  rationale: Передаёт множественное число и смысл помещений или запасников, в которых находилось зерно, не сужая значение до одного конкретного типа сооружения.
- source_word: ስርናይ ዘቀዳሚ ዓመት
  choice: зерно прежнего года
  rationale: Сохраняет единственное число ዓመት и значение ቀዳሚ как предшествующего, прежнего времени.
- source_word: በወርቅ
  choice: за золото
  rationale: ወርቅ прямо означает «золото», а не серебро или деньги вообще.
