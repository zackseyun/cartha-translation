  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: ru
  text: И голод в земле Ханаанской стал очень сильным. Иаков услышал, что в Египте есть зерно, и послал десятерых своих сыновей, чтобы они добыли для него зерно в Египте. Но Вениамина он не послал. И десять сыновей Иакова прибыли в Египет вместе с другими путниками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረኃብ
  choice: голод
  rationale: Прямое и естественное соответствие геэзскому слову со значением «голод».
- source_word: ሲሲት
  choice: зерно
  rationale: В данном повествовательном контексте слово обозначает продовольственное зерно, за которым сыновья Иакова отправились в Египет; «зерно» точнее общего «пища».
- source_word: ምስለ፡ ዘየሐውር
  choice: вместе с другими путниками
  rationale: Передаёт буквально неопределённую группу «тех, кто шёл/путешествовал», одновременно обеспечивая естественное русское выражение.
