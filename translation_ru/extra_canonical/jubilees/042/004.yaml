translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор союза «и» частично сохранён как черта исходного стиля, но синтаксис сделан естественным для современного читателя. Формулировка о Вениамине сохраняет смысловое ударение оригинала.
