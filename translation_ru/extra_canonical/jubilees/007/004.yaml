revisions:
- from: Сначала он приготовил козлёнка и возложил часть его крови на мясо жертвы, лежавшее на устроенном им жертвеннике. Весь его жир он вознёс на жертвенник, где совершил всесожжение, а также принёс быка, барана и овец.
  to: Сначала он приготовил козлёнка и возложил часть его крови на мясо, принесённое им в жертву и лежавшее на устроенном им жертвеннике. Весь его жир он вознёс на жертвенник, где совершил всесожжение быка, барана и овец.
  rationale: Исправление уточняет относительное определение «мясо, принесённое им в жертву» и сохраняет связь перечисленных животных с совершаемым у жертвенника жертвоприношением. Смысл «всесожжение» согласован с английской контрольной версией и жертвенным контекстом; дополнительных конфессиональных выводов не вносится.
