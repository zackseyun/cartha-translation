  source_fidelity: 'Первая часть передана в целом верно: речь идёт о козлёнке, его крови, мясе жертвы и жертвеннике, устроенном действующим лицом. Однако заключительный перечень животных в геэзском тексте связан с предшествующим жертвенным действием; перевод «а также принёс» слишком свободно восполняет эллипсис и ослабляет эту связь. Английская контрольная версия также относит быка, барана и овец к совершению всесожжения, хотя её синтаксис шероховат.'
