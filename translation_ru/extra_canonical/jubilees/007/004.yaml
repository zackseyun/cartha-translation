  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: ru
  text: Сначала он приготовил козлёнка и возложил часть его крови на мясо, принесённое им в жертву и лежавшее на устроенном им жертвеннике. Весь его жир он вознёс на жертвенник, где совершил всесожжение быка, барана и овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሕስአ
  choice: козлёнка
  rationale: Обозначает молодого козла; «козлёнок» естественно и точно в данном жертвенном контексте.
- source_word: አንበረ
  choice: возложил
  rationale: Передаёт действие помещения крови на жертвенное мясо и сохраняет возвышенный культовый регистр.
- source_word: ስብሖ
  choice: его жир
  rationale: Суффиксальное местоимение относится к козлёнку; явное «его» устраняет ненужную неясность.
- source_word: አዕረገ
  choice: вознёс
  rationale: Буквально связано с восхождением; в жертвенном контексте «вознёс» сохраняет образ и означает принесение на жертвеннике.
- source_word: ጽንሓሐ፡ ወላህመ፡ ወበሐኩ፡ ወአባግዐ
  choice: а также принёс быка, барана и овец
  rationale: Перечень жертвенных животных оформлен естественным русским синтаксисом; подразумеваемый глагол восполнен по контексту.
theological_decisions:
- issue: Характер действия с жиром
  choice: вознёс на жертвенник
  alternative: принёс в жертву на жертвеннике
  rationale: Выбрана формулировка, сохраняющая исходный образ восхождения и его культовый смысл без чрезмерного истолкования.
- issue: Синтаксическая связь заключительного перечня животных
  choice: а также принёс быка, барана и овец
  alternative: где совершил всесожжение быка, барана и овец
  rationale: Эфиопский текст синтаксически сжат и допускает не вполне однозначную связь перечня. Выбран естественный вариант, не утверждающий без необходимости, что все перечисленные животные составляли одно всесожжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной жертвенной лексикой. Сохранены последовательность действий и образ «вознесения» жира; эллипсис заключительного перечня раскрыт минимально ради ясности.
