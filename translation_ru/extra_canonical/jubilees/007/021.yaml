  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: ru
  text: 'И нечистота, и всякое беззаконие. Ибо из-за этих трёх вещей потоп пришёл на землю: из-за блуда, которому предались Стражи, нарушив данную им заповедь и пойдя к дочерям человеческим. Они взяли себе в жёны всех, кого избрали, и положили начало нечистоте.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵስ / ርኵሰ
  choice: нечистота / нечистоте
  rationale: Передаёт нравственно-ритуальный оттенок эфиопского слова и сохраняет повтор в начале и конце стиха.
- source_word: ዐመፃ
  choice: беззаконие
  rationale: Естественный литературный эквивалент для нарушения установленного порядка или закона.
- source_word: አይኅ
  choice: потоп
  rationale: Контекстуально определённое обозначение всемирного потопа.
- source_word: ትጉሃን
  choice: Стражи
  rationale: Традиционное и понятное обозначение ангельской группы; сохраняется как наименование.
- source_word: ዝሙት ዘዘመዉ
  choice: блуд, которому предались
  rationale: Естественно передаёт эфиопскую фигуру с однокоренными существительным и глаголом, не утяжеляя русский текст.
- source_word: በድኅረ አዋልደ ሰብእ
  choice: пойдя к дочерям человеческим
  rationale: Передаёт направленность «вслед/за дочерьми людей» в данном контексте без неестественной русской кальки.
- source_word: ነሥኡ ሎሙ አንስተ
  choice: взяли себе в жёны
  rationale: Точно и идиоматично передаёт брачную формулу.
theological_decisions:
- issue: Связь блуда Стражей с заповедью и дочерьми человеческими
  choice: «предались ... вопреки предписанной им заповеди, пойдя к дочерям человеческим»
  alternative: «нарушили предписанную им заповедь из-за дочерей человеческих»
  rationale: Выбранный вариант сохраняет явное упоминание блуда и одновременно отражает синтаксическую неоднозначность сочетания заповеди и движения к дочерям человеческим, не вводя частного толкования.
- issue: Причина потопа
  choice: «из-за этих трёх дел потоп пришёл на землю»
  alternative: «ради этих трёх произошёл потоп на земле»
  rationale: Сохраняется прямая причинная связь исходного текста и естественный современный русский порядок слов.
translation_notes:
  register: Современный литературный и достойный регистр с библейской окраской. Сохранены повтор «нечистота» и причинная структура стиха; архаизмы и конфессионально специфическая терминология не вводились.
