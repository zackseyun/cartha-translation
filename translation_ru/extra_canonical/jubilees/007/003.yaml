base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: ru
  text: 'В новолуние первого месяца он устроил в тот день радостный пир и принёс Господу всесожжение: одного молодого быка, одного барана, семь годовалых овец и одного козлёнка, чтобы совершить искупление за себя и своих сыновей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: В новолуние первого месяца
  rationale: Передаёт явное календарное указание эфиопского текста; «новолуние» естественно и точно обозначает начало лунного месяца.
- source_word: ገብረ፡ ዕለተ፡ ዛቲ፡ በዓለ፡ በፍሥሓ
  choice: он устроил в тот день радостный пир
  rationale: Сочетает значение празднества/пира с прямо выраженной радостью, не утяжеляя русскую фразу буквальным повтором «праздновал праздник».
- source_word: ጽንሓሐ
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, полностью сжигаемой перед Богом.
- source_word: እምአልህምቱ፡ አሐደ
  choice: одного быка
  rationale: Источник буквально указывает одну голову крупного скота; в перечне жертв «бык» является естественным контекстуальным обозначением, тогда как признак молодого возраста в данной форме явно не выражен.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: семь годовалых овец
  rationale: Сохраняет указание, что каждое из семи животных было возрастом в один год.
- source_word: መሐስአ፡ ጢለ፡ አሐደ
  choice: одного козлёнка
  rationale: Передаёт буквальное обозначение молодого животного из коз; не добавляет возраст или иные признаки, которых текст прямо не уточняет.
theological_decisions:
- issue: Значение глагола ያስተስሪ в жертвенном контексте
  choice: чтобы совершить искупление за себя и своих сыновей
  alternative: чтобы очистить себя и своих сыновей
  rationale: «Совершить искупление за» сохраняет жертвенно-богословский смысл глагола и не сводит его только к обрядовому очищению; конструкция с целью отражает эфиопское ከመ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Перечень жертв дан ясно и ритмично; архаизмы и конфессионально окрашенные добавления исключены.
