  yaml_path: translation/extra_canonical/jubilees/007/005.yaml
  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: ru
  text: И он вознёс на жертвеннике всю их плоть, и положил на него все их приношения, смешанные с маслом, а затем возлил вино в огонь, горевший на жертвеннике, и положил на жертвенник благовоние. И он вознёс благоухание, угодное Господу, своему Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ
  choice: вознёс
  rationale: Передаёт каузативное жертвенное действие — заставить жертву или её благоухание подняться — и сохраняет повтор ключевого глагола.
- source_word: ሥጋሆሙ
  choice: всю их плоть
  rationale: Формально сохраняет множественное местоимение и жертвенный термин «плоть», не заменяя его более узким «мясо».
- source_word: ቅብዕ
  choice: маслом
  rationale: В данном жертвенном контексте обозначает масло для смешивания с приношением.
- source_word: ስኂነ
  choice: благовоние
  rationale: Выбран общий термин для ароматического вещества; источник не требует уточнения «ладан».
- source_word: መዐዛ፡ ሠናየ
  choice: благоухание
  rationale: Естественно передаёт буквальное сочетание «приятный/добрый аромат» в языке жертвоприношения.
- source_word: ያሠምር
  choice: угодное
  rationale: Передаёт идею принятия или одобрения Богом, не уточняя сверх текста механизм принятия.
- source_word: እግዚአብሔር
  choice: Господу
  rationale: Традиционная и понятная русская передача божественного наименования в библейском регистре.
theological_decisions:
- issue: Характер благоухания перед Богом
  choice: «благоухание, угодное Господу»
  alternative: «приятное благоухание перед Господом»
  rationale: Формулировка сохраняет богословскую идею принятия жертвы Богом, выраженную глаголом ያሠምር, не сводя её лишь к приятности запаха.
- issue: Референт местоимения «их»
  choice: сохранено «их»
  alternative: заменить явным названием принесённых животных
  rationale: В стихе референт зависит от предшествующего контекста; его явное уточнение устранило бы присущую тексту контекстуальную зависимость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический параллелизм исходного перечисления сохранён, но финальное действие выделено отдельным предложением ради ясности. Архаизмы избегаются, кроме укоренённых культовых слов «жертвенник», «приношение», «возлил» и «благоухание».
