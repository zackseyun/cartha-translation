lexical_decisions:
- source_word: አጋንንት
  choice: демоны
  rationale: Прямое соответствие геэзскому множественному числу; сохраняет сверхъестественный характер противников.
- source_word: ሲኦል
  choice: Шеол
  rationale: Транслитерация сохраняет древнее обозначение мира мёртвых и не отождествляет его без пояснений с адом.
- source_word: ነፍስ
  choice: жизнь / душа
  rationale: В наставлении о крови слово обозначает жизнь, тогда как в выражении о добре для себя естественно передаётся как «душа»; контекстуальная вариативность сохраняет семантический диапазон.
- source_word: ፍትሐ፡ ወጽድቀ
  choice: суд и праведность
  rationale: Сохраняется парная нравственно-правовая формула источника без сведения обоих понятий к общему «добру».
- source_word: ቀዳሜ፡ ፍሬ
  choice: начаток плодов
  rationale: Передаёт культовое значение первых плодов урожая и согласуется с последующим упоминанием вина и масла.
theological_decisions:
- issue: Неясное начальное наставление в повреждённом тексте
  choice: «[любите] друг друга»
  alternative: «будьте едины друг с другом»
  rationale: Редакционное восстановление отражено квадратными скобками, чтобы не скрывать текстуальную неопределённость; контекст «один с братом своим» поддерживает взаимную братскую любовь.
- issue: Смысл запрета есть «душу» с плотью
  choice: «Не ешьте жизнь вместе с плотью»
  alternative: «Не ешьте душу вместе с плотью»
  rationale: В контексте крови нефеш/нафс означает жизнь; следующий оборот прямо отождествляет кровь с жизнью.
- issue: Очищение земли кровью пролившего кровь
  choice: Сохранена формулировка возмездия без догматического пояснения
  alternative: Истолковать как обязательную смертную казнь
  rationale: Текст утверждает принцип кровного воздаяния, но не уточняет здесь исполнителя или правовой механизм.
- issue: Место суда после смерти
  choice: «место суда»
  alternative: «место осуждения»
  rationale: Нейтральная передача сохраняет возможность как судебного разбирательства, так и неблагоприятного приговора, не предрешая оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного наставления. Синтаксис упрощён там, где буквальное следование геэзскому создавало бы неясность, но повторения о крови, жизни, земле и потомстве сохранены. Квадратные скобки отмечают восстановление повреждённого начала.
