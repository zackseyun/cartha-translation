base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: ru
  text: 'Дети мои, [любите] друг друга. Ибо я вижу: вот, демоны начали грешить против вас и против ваших детей. И теперь я боюсь за вас: после моей смерти вы станете проливать человеческую кровь на земле — и сами будете истреблены с лица земли. Ибо всякий, кто проливает человеческую кровь[a], и всякий, кто ест кровь какой бы то ни было плоти, — все они будут истреблены с земли. Не останется ни одного человека, который ест кровь или проливает человеческую кровь на земле; не останется у него под небом ни семени, ни живого потомка. Они уйдут в Шеол, сойдут в место суда и войдут в глубокую тьму — все погибнут насильственной смертью.


    Пусть на вас не будет крови — крови зверей, домашних животных или существ, ползающих по земле, которых вы закалываете во все дни вашей жизни. Сделайте добро своим душам: засыпайте землёй кровь, пролитую на поверхность земли. Не уподобляйтесь тому, кто ест мясо с кровью; будьте тверды, чтобы не есть крови. Засыпайте кровь землёй, ибо так мне велено засвидетельствовать вам, вашим детям и всякой плоти. Не ешьте плоть вместе с её жизнью, чтобы ваша кровь — ваша жизнь — не была взыскана с любого существа, которое прольёт её на земле. Ведь земля не очистится от пролитой на неё крови иначе как кровью того, кто её пролил; так земля будет очищаться во всех своих поколениях.


    А теперь, дети мои, слушайте: поступайте справедливо и праведно, чтобы вы утвердились в праведности по всему лицу земли и ваша слава возвысилась пред моим Богом, Который спас меня от вод потопа. И вот, идите, стройте себе города и сажайте в них всякое земное растение и всякое плодовое дерево. Три года его плодов нельзя собирать для еды. На четвёртый год пусть его плоды будут собраны, и пусть начаток плодов, приносимых в дар, вознесётся пред Господом Всевышним, сотворившим небо, землю и всё сущее. Пусть в изобилии принесут начатки вина и масла, начатки плодов — на жертвенник Господа, Который принимает их; а оставшееся пусть едят в доме Господнем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сохранившейся строке данных пространное наставление о крови, убийстве и первых плодах сведено в один длинный стих, хотя в более полных изданиях оно, вероятно, разделено на несколько стихов.
