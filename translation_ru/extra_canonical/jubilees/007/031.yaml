base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/031.yaml
  text: 'And I also command you, my sons, according to the command that Enoch gave to his son in the first jubilees, while he was still alive in the seventh generation: he commanded and testified to his son and to his sons'' sons until the day of his death.'
translation:
  language: ru
  text: И я также заповедую вам, сыновья мои, согласно тому, как Енох заповедал своему сыну в первые юбилеи, когда он был ещё жив, в седьмом поколении. Он заповедал своему сыну и засвидетельствовал своему сыну и сыновьям своего сына — до дня своей смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኤዝዘክሙ / አዘዘ
  choice: заповедую / заповедал
  rationale: Передаёт сильное значение предписания и сохраняет повтор корня в исходном тексте.
- source_word: ውሉድየ
  choice: дети мои
  rationale: Современное и естественное обращение, охватывающее потомков адресата; буквальное «сыновья мои» было бы уже по значению.
- source_word: ኢዮቤልውሳት
  choice: юбилеи
  rationale: Сохраняет специальный календарный термин Книги Юбилеев, не заменяя его толкованием.
- source_word: አስምዐ
  choice: засвидетельствовал
  rationale: 'Сохраняет юридико-наставительный оттенок глагола: не просто «сказал», а торжественно подтвердил и вменил услышанное.'
- source_word: ውሉደ፡ ውሉዱ
  choice: детям его сына
  rationale: Формально передаёт родственную цепочку исходника и не расширяет её без необходимости до общего «потомкам».
theological_decisions:
- issue: Характер наставления Еноха
  choice: «заповедал… и засвидетельствовал»
  alternative: «повелел… и наставлял»
  rationale: Выбранная формулировка сохраняет два различных действия исходного текста и его торжественный тон, не придавая им конфессионально обусловленного смысла.
- issue: Хронологическая формула о седьмом поколении
  choice: сохранить отдельной фразой «в седьмом поколении»
  alternative: «будучи седьмым поколением» или «в седьмом роде»
  rationale: Исходная конструкция допускает некоторую неясность связи; отдельная формула сохраняет её и не навязывает точного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного наставления. Повторы «заповедую / заповедал» намеренно сохранены; синтаксис слегка расчленён для ясности без устранения хронологической неоднозначности.
