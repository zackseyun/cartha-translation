revisions:
- from: И я также заповедую вам, дети мои, как Енох заповедал своему сыну во время первых юбилеев, ещё при жизни, в седьмом поколении. Он заповедал своему сыну и засвидетельствовал ему и детям его сына — до дня своей смерти.
