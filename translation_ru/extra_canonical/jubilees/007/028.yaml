  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: ru
  text: Три года плоды всего, что пригодно в пищу, нельзя собирать. На четвёртый год пусть соберут плоды и вознесут первины перед Господом Всевышним, сотворившим небо, землю и всё сущее. Пусть в изобилии принесут на жертвенник Господа, принимающий приношения, первое вино и масло из первин, а оставшееся пусть съедят служители дома Господа перед жертвенником, принимающим приношения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ … እምኵሉ፡ ዘይትበላዕ
  choice: плоды всего, что пригодно в пищу
  rationale: Передаёт генитивный смысл всей фразы и естественно выражает собирательное значение плодов съедобных насаждений; формулировка не ограничивает речь уже сорванной пищей.
- source_word: ይትቀሠም
  choice: собирать
  rationale: В контексте плодов глагол означает сбор урожая; нейтральный современный русский эквивалент.
- source_word: ቀዳሜ፡ ፍሬ
  choice: первые плоды
  rationale: Сохраняет конкретный культовый образ первин урожая без конфессионально окрашенной терминологии.
- source_word: እግዚአብሔር፡ ልዑል
  choice: Господь Всевышний
  rationale: Прямое и традиционно понятное соответствие божественному титулу.
- source_word: በጥሉ
  choice: в изобилии
  rationale: Следует смыслу консультационного слоя; выражение относится к щедрому принесению вина и масла, хотя точный оттенок редкой формы не вполне прозрачен.
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: служители дома Господа
  rationale: Передаёт обозначение лиц, состоящих при доме Господа, естественно и без уточнения их статуса сверх источника.
theological_decisions:
- issue: Характер приношения первых плодов
  choice: вознесут первые плоды, угодные Господу Всевышнему
  alternative: принесут первые плоды перед Господом Всевышним
  rationale: Сохраняется жертвенно-культовый глагол «вознести» и характеристика приемлемости приношения, не утверждая сверх текста отдельного обряда или священнической процедуры.
- issue: Повторение формулы о принимающем жертвеннике
  choice: сохранить оба упоминания принятия
  alternative: устранить второе как стилистический повтор
  rationale: Повтор присутствует в источнике и подчёркивает принятие приношения; его не следует сглаживать ценой потери смыслового акцента.
