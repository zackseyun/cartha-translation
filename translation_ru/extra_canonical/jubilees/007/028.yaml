- from: Три года плоды всего, что пригодно в пищу, нельзя собирать[a]. На четвёртый год пусть соберут плоды и вознесут первые плоды, угодные Господу Всевышнему, сотворившему небо, землю и всё сущее. Пусть в изобилии принесут первое вино и масло как первые плоды на жертвенник Господа, принимающего это, а оставшееся пусть съедят служители дома Господа перед жертвенником, принимающим это.
