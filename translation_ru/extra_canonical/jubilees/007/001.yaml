  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: ru
  text: И в седьмой семилетний период, в первый его год, в этот юбилей, Ной посадил виноградную лозу на горе, на которой остановился ковчег; имя этой горы — Лубар, одна из гор Арарата. В четвёртый год лоза принесла плод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ሳብዕ
  choice: седьмую седмицу
  rationale: Передаёт юбилейную хронологическую единицу — период из семи лет — и отличает её от обычной календарной недели.
- source_word: ወይነ
  choice: виноградную лозу
  rationale: Контекст посадки и последующего плодоношения указывает на лозу, а не на вино.
- source_word: አዕረፈት፡ ታቦት
  choice: остановился ковчег
  rationale: Естественно передаёт смысл покоя или прекращения движения ковчега на горе.
- source_word: ሉባር
  choice: Лубар
  rationale: Транслитерация собственного названия горы.
- source_word: እምአድባረ፡ አራራት
  choice: одной из гор Арарата
  rationale: Сохраняет множественное число и отношение части к горному массиву Арарата.
- source_word: ገብረ፡ ፍሬ
  choice: принесла плод
  rationale: Буквально и естественно передаёт плодоношение лозы.
