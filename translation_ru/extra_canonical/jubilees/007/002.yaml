  yaml_path: translation/extra_canonical/jubilees/007/002.yaml
  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: ru
  text: И он сохранил его плоды и собрал их в том году, в седьмом месяце. И сделал из них вино, налил его в сосуд и хранил до пятого года, до первого дня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть до первого дня; слова «первого месяца» начинаются в следующем стихе.
    reason: Уточняет границу стиха и предотвращает внесение в основной текст слов из начала следующего стиха.
lexical_decisions:
- source_word: ዐቀበ / ዐቀቦ
  choice: сохранил / хранил
  rationale: Глагол передаёт хранение и сбережение; повтор корня в русском сохранён с естественным изменением вида по контексту.
- source_word: ቀሰሞ
  choice: собрал их
  rationale: Передаёт сбор урожая; местоимение явно соотнесено с плодами для естественного русского синтаксиса.
- source_word: ገብረ ... ወይነ
  choice: сделал из них вино
  rationale: Буквально «сделал вино»; «из них» естественно указывает на ранее названные плоды, не добавляя нового содержания.
- source_word: ወደየ ውስተ ንዋይ
  choice: налил его в сосуд
  rationale: В контексте вина более естественно, чем общее «положил»; ንዋይ здесь обозначает вместилище, сосуд.
- source_word: እስከ ዕለት ቀዳሚት
  choice: до первого дня
  rationale: Перевод ограничен текстом данного стиха; указание «первого месяца» в предоставленном геэзском тексте отсутствует и относится к следующему стиху.
