  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: ru
  text: Он обрадовался и вместе со своими сыновьями с радостью выпил этого вина. Когда настал вечер, он вошёл в свой шатёр, лёг, будучи пьяным, и уснул. И, пока он спал, он лежал обнажённым внутри своего шатра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ / በፍሥሓ
  choice: обрадовался / с радостью
  rationale: Сохранён повтор корня, обозначающего радость, хотя по-русски он передан двумя естественными конструкциями.
- source_word: ወሰትየ ... ወይነ
  choice: пил это вино
  rationale: Передаёт действие питья и указание на ранее упомянутое вино; партитивный смысл русского контекста не требует обязательного слова «немного».
- source_word: ሰቀላሁ
  choice: свой шатёр
  rationale: В данном повествовательном контексте слово обозначает жилище-палатку; «шатёр» соответствует библейскому регистру, оставаясь понятным.
- source_word: ስኩሩ
  choice: пьяный
  rationale: Прямо сохраняет указание на состояние опьянения без смягчения.
- source_word: ተከሥተ
  choice: обнажился
  rationale: Возвратная форма естественно передаёт наступившее состояние раскрытости/наготы, не уточняя намеренность.
- source_word: እንዘ፡ ይነውም
  choice: во сне
  rationale: Кратко и естественно передаёт обстоятельство «пока он спал».
theological_decisions:
- issue: Намеренность обнажения
  choice: обнажился
  alternative: раскрылся
  rationale: Текст сообщает о наготе во время сна, но не устанавливает сознательного намерения; возвратный глагол сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, последовательность событий и повтор темы радости сохранены.
