  yaml_path: translation/extra_canonical/jubilees/007/026.yaml
  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: ru
  text: 'которую они пролили посреди земли.[a] Он истребил всё, а в живых остались я, вы, дети мои, и все, кто вошёл вместе с нами в ковчег. И вот, я вижу перед собой ваши дела: вы не ходите в праведности, ибо начали ходить путём развращения; вы отделяетесь друг от друга, будете сражаться друг с другом и не будете едины.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный, но менее вероятный разбор: «которая уничтожила середину земли».'
    reason: Предыдущая традиция перевода допускала иную синтаксическую связь; основной текст следует разбору глагола как «пролили» с кровью из предыдущего стиха в качестве антецедента.
lexical_decisions:
- source_word: ዘከዐዉ፡ ማእከለ፡ ምድር
  choice: которую они пролили посреди земли
  rationale: Относительное местоимение продолжает упоминание крови в предыдущем стихе; ከዐዉ передано как «пролили», а ማእከለ ምድር — как обстоятельство места.
- source_word: ደምሰሰ፡ ኵሎ
  choice: Он истребил всё
  rationale: Сохранены подлежащее в 3-м лице единственного числа и прямое дополнение «всё»; местоимение не уточняется именем, отсутствующим в исходном тексте.
- source_word: ወተርፍኩ
  choice: а в живых остались я
  rationale: Глагол означает «остаться, уцелеть»; выражение «остались в живых» естественно передаёт контекст спасения от потопа.
- source_word: ዘአኮንክሙ፡ ዘተሐውሩ፡ በጽድቅ
  choice: вы не ходите в праведности
  rationale: Сохранён библейский образ хождения как нравственного образа жизни без конфессионального истолкования.
- source_word: በፍኖተ፡ ሙስና
  choice: путями развращения
  rationale: «Развращение» передаёт нравственную порчу, сохраняя связь с образом путей.
- source_word: ወትትፋለጡ፡ አሐዱ፡ አሐዱ፡ እም ቢጹ
  choice: вы отделяетесь друг от друга
  rationale: ተፋለጠ имеет значение разделения или удаления, а እም обозначает исходную точку «от»; русское взаимное выражение естественно передаёт «каждый от своего ближнего».
- source_word: ወከመ፡ ኢትሄልዉ፡ ኅቡረ
  choice: и не будете едины
  rationale: Передано отрицание совместности и единства без добавочного толкования.
theological_decisions:
- issue: Не названный прямо деятель в словах «Он истребил всё»
  choice: Сохранить местоимение «Он» без замены на «Бог»
  alternative: «Бог истребил всё»
  rationale: Хотя контекст указывает на Бога, исходная строка использует только глагольную форму 3-го лица; явное именование сняло бы формальную недосказанность.
- issue: Нравственный образ «ходить в праведности»
  choice: Сохранить образ буквально
  alternative: «жить праведно»
  rationale: Буквальная метафора понятна современному читателю и удерживает связь с последующим упоминанием путей.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён там, где буквальное воспроизведение геэзского перечисления было бы тяжеловесным; ключевые образы «ходить», «пути», «ковчег» и «быть едиными» сохранены.
