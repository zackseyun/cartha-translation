    rationale: Формула «Сим взял одежду, и они с Иафетом положили её...» формально понятна, но местоимение «они» появляется до ясного называния пары. Прямое «он и Иафет» точнее воспроизводит структуру источника и естественнее в современном литературном русском.
  - severity: low
    issue: Позиция маркера сноски
    rationale: Сноска относится к границе и сегментации повествования, а не к Ною либо к его наготе. Маркер после последнего предложения яснее обозначает её сферу действия.
