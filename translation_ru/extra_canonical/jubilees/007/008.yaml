  yaml_path: translation/extra_canonical/jubilees/007/008.yaml
  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: ru
  text: И Хам увидел наготу своего отца Ноя, вышел и рассказал об этом двум своим братьям, которые были снаружи. Сим взял одежду, и он и Иафет положили её себе на плечи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В источнике разметка строк и стихов в этом месте необычна. Здесь стих передан в пределах приведённого текста; продолжение рассказа о том, как братья, пятясь, прикрыли отца, относится к следующему стиху.
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ
  choice: наготу
  rationale: Форма передаёт состояние обнажённости Ноя; существительное «нагота» естественно по-русски и сохраняет библейский регистр, не добавляя идеи стыда, которой в этой строке нет.
- source_word: በአፍአ
  choice: которые были снаружи
  rationale: Буквально «снаружи». В русском придаточное ясно связывает обстоятельство с двумя братьями и избегает неестественного повторения «вышел... снаружи».
- source_word: ልብሰ
  choice: одежду
  rationale: Общее обозначение предмета одежды; «одежда» точнее сохраняет неопределённость источника, чем конкретизирующие «плащ» или «покрывало».
- source_word: መታክፍቲሆሙ
  choice: себе на плечи
  rationale: Передаёт множественное «на их плечи» естественной русской конструкцией при общем действии Сима и Иафета.
theological_decisions:
- issue: Характер увиденного Хамом
  choice: «увидел наготу» без дополнительных пояснений
  alternative: истолковать выражение как эвфемизм полового действия или иного проступка
  rationale: Источник прямо говорит об увиденной наготе; перевод не должен привносить спорную богословскую интерпретацию.
- issue: Предмет, взятый Симом
  choice: «одежду»
  alternative: «покрывало» или «плащ»
  rationale: Сохраняется лексическая широта исходного слова и не уточняется назначение предмета сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан естественным, но последовательность действий и неопределённость слова «одежда» сохранены.
