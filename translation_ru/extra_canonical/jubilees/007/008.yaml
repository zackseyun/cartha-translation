  source_fidelity: 'Содержание передано верно: Хам видит отца Ноя обнажённым, выходит и сообщает двум братьям; Сим берёт одежду, после чего Сим и Иафет кладут её на свои плечи. Продолжение о движении задом и прикрытии отца отсутствует, как и должно быть для данного сегмента источника.'
  naturalness: '«Они с Иафетом положили» менее прозрачно и несколько разговорно-неуклюже: после подлежащего «Сим» лучше прямо назвать обоих участников действия. Также сноску о сегментации лучше поставить после законченного смыслового блока, а не после имени Ноя, поскольку она не поясняет имя или слово «наготу».'
  terminology: Имена «Хам», «Ной», «Сим», «Иафет» приняты и последовательны. «Нагота» и «одежда» удачно сохраняют библейский регистр и лексическую неопределённость исходника. Не следует добавлять «стыд», «покрывало» или толковательное описание проступка.
