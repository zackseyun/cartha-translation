base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/011.yaml
  text: May God enlarge Japheth, and may God dwell in the dwellings of Shem; and let Canaan be his servant.”
translation:
  language: ru
  text: Пусть Бог даст простор Иафету, и пусть Бог обитает в шатрах Сима; а Ханаан пусть будет его слугой».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть Бог расширит Иафета». Неясно, к кому именно относится слово «его» в последней фразе — к Иафету или к Симу.'
    reason: Поясняет словесную игру и сохраняемую синтаксическую неоднозначность.
lexical_decisions:
- source_word: ያስፋሕ (yāśfaḥ)
  choice: даст простор
  rationale: Передаёт каузативное значение «расширит, даст простор» и сохраняет игру с именем Иафета, насколько это возможно по-русски.
- source_word: እግዚአብሔር (ʾEgziʾabḥēr)
  choice: Бог
  rationale: В данном тексте это обозначение Бога, а не тетраграмматон; перевод «Господь» мог бы ошибочно создать впечатление, что в источнике стоит имя Яхве.
- source_word: ማኅደሪ (maḥāderī)
  choice: шатрах
  rationale: В контексте благословения Ноя естественно передаёт жилища или шатры Сима и согласуется с образом родовых поселений.
- source_word: ገብሮ (gabrō)
  choice: его слугой
  rationale: Слово допускает значения «слуга, раб». «Слуга» сохраняет отношение подчинения без ненужного усиления формулировки.
theological_decisions:
- issue: К кому относится местоимение в словах «его слугой»
  choice: Сохранено местоимение «его» без уточнения
  alternative: «слугой Иафета» или «слугой Сима»
  rationale: Источник грамматически не устраняет неоднозначность антецедента; перевод не должен разрешать её за читателя.
- issue: Субъект глагола «обитает»
  choice: «Бог»
  alternative: «он» — Иафет
  rationale: Геэзский текст повторяет እግዚአብሔር перед глаголом «обитать», явно называя Бога субъектом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского благословения. «Иафет», «Сим» и «Ханаан» даны в традиционной русской библейской форме; синтаксическая неоднозначность заключительной фразы сохранена.
