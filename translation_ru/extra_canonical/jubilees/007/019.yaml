  terminology: «Установления и заповеди», «законы», «праведно», «разврат», «нечистота» и «неправда» допустимы и сохраняют нормативно-этический характер текста. «Ближний» уместен для ቢጾ, не исключая более широкого значения «соплеменник/другой человек».
