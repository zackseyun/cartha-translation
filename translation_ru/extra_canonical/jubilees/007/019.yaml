base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/019.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: ru
  text: Это сыновья Ноя. В двадцать восьмой юбилей Ной начал давать своим внукам установления и заповеди, а также все законы, которые знал. Он наставлял своих сыновей поступать праведно, прикрывать свою наготу, благословлять своего Творца, почитать отца и мать, чтобы каждый любил ближнего и хранил себя от разврата, нечистоты и всякой неправды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: установления и заповеди
  rationale: Передаёт различие между предписанным порядком/установлениями и прямыми повелениями, сохраняя естественный библейский регистр.
- source_word: ፍትሐ
  choice: законы
  rationale: В данном перечислении речь идёт о нормах справедливого поведения, известных Ною; «законы» по-русски естественнее буквального «суды», не снимая нормативного смысла.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: наготу своего тела
  rationale: Идиома буквально связана со «стыдом плоти» и обозначает телесную наготу; выбран ясный современный эквивалент.
- source_word: ቢጾ
  choice: ближнего
  rationale: Слово обозначает товарища, другого человека или ближнего; «ближний» естественно передаёт этический смысл наставления.
- source_word: ዝሙት፡ ወርኵስ፡ ወእምኵሉ፡ ዐመፃ
  choice: разврата, нечистоты и всякой неправды
  rationale: 'Сохраняет трёхчастное перечисление: половая распущенность, ритуально-нравственная нечистота и всякое беззаконие/несправедливость.'
theological_decisions:
- issue: 'Кого Ной наставляет: сыновей или внуков'
  choice: 'Сохранены оба указания источника: сначала сыновья сыновей как адресаты заповедей, затем сыновья как адресаты свидетельства-наставления.'
  alternative: Свести всё наставление только к сыновьям или только к внукам.
  rationale: Текст последовательно употребляет обе формулировки; их унификация устранила бы реальную особенность источника.
- issue: Значение ፍትሐ в перечне наставлений
  choice: Передано как «законы».
  alternative: «суды», «правосудие» или «справедливость».
  rationale: Контекст установлений и заповедей поддерживает нормативное значение, однако формулировка не связывает его с позднейшей конфессиональной системой.
