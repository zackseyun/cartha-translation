  yaml_path: translation/extra_canonical/jubilees/007/029.yaml
  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: ru
  text: В пятый год совершите отпущение[a] по правде и справедливости; вы будете праведны, и все ваши насаждения будут процветать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предписание о пятом годе не вполне ясно. Слово «отпущение» передаёт понятие оставления, отпускания или прекращения; вероятно, речь идёт о сельскохозяйственном обычае, связанном с предшествующим законом о первых плодах.
    reason: alternative_reading
lexical_decisions:
- source_word: ኅድገተ (ḥədgata) / ታሕድግዎ (taḥdəgəwo)
  choice: «отпущение» / «оставить»
  rationale: Оба слова восходят к корню со значением оставления, отпускания или прекращения. «Отпущение» сохраняет неопределённость предписания, а «оставить плод» естественно связывает его с предшествующим законом о плодах насаждений.
- source_word: በጽድቅ፡ ወበርኅብ
  choice: «по правде и справедливости»
  rationale: Передаёт парные нравственные понятия без сведения их к одному качеству; точный оттенок второго слова не вполне ясен в данном контексте.
- source_word: ወትጸድቁ
  choice: «тогда вы будете праведны»
  rationale: Сохраняет отдельное утверждение о самих адресатах, не объединяя его со следующим высказыванием о насаждениях.
- source_word: ወይረኅብ፡ ኵሉ፡ ተክልክሙ
  choice: «и все ваши насаждения будут процветать»
  rationale: Передаёт благополучие и успешный рост насаждений; это отдельная клауза после утверждения о праведности людей.
theological_decisions:
- issue: Характер предписания пятого года
  choice: Сохранить общий термин «отпущение» и пояснить неопределённость в сноске
  alternative: Истолковать его прямо как оставление урожая, сельскохозяйственный покой или пожертвование
  rationale: Геэзский текст говорит об оставлении или отпускании, но не определяет однозначно конкретный обряд; контекст связывает его с предписаниями о плодах.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Неясность редкого предписания сохранена, но синтаксис сделан понятным; две заключительные клаузы — о праведности людей и процветании насаждений — переданы раздельно.
