- source_word: ለአኃዊሁ
  choice: у своих братьев
  rationale: Дательный оборот выражает служение или подчинение братьям; русская конструкция сохраняет эту связь естественно.
theological_decisions:
- issue: Кого обозначает местоимение в словах «проклял его сына»
  choice: Сохранено «его сына», допускающее отнесение к младшему сыну Ноя, то есть к Хаму.
  alternative: «проклял своего сына» или прямое пояснение «проклял сына Хама»
  rationale: Местоименная цепочка источника не должна быть без необходимости разрешена редакторским уточнением; следующее имя «Ханаан» позволяет читателю установить референта.
- issue: Связь формулы проклятия с Быт 9:25
  choice: Переведено по эфиопскому тексту как указание на низшее положение раба.
  alternative: Традиционное «раб рабов»
  rationale: Традиционную библейскую формулу не следует импортировать туда, где сохранившийся эфиопский текст имеет иную лексику.
