  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: ru
  text: И земля наполнилась насилием. После этого они согрешили против зверей, птиц и всего, что движется и ходит по земле; много крови пролилось на земле, и всё…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: насилием
  rationale: В данном контексте слово обозначает насилие и беззаконие; «насилие» естественно связано с последующим пролитием крови.
- source_word: አበሱ፡ ሎሙ፡ በአራዊት
  choice: они согрешили против зверей
  rationale: Местоименный элемент предвосхищает названных далее зверей, а конструкция с በ- обозначает тех, против кого был совершён грех.
- source_word: ዘይትሐወስ፡ ወዘያንሶሱ
  choice: что движется и ходит
  rationale: Сохранены два параллельных обозначения передвижения без искусственного сведения их к одному понятию.
- source_word: ወትክዐወ፡ ደም፡ ብዙኅ
  choice: много крови пролилось
  rationale: Естественная русская передача пассивной конструкции о пролитии большого количества крови.
- source_word: ወኵሉ
  choice: и всё…
  rationale: Предоставленный текст обрывается на словах «и всё»; многоточие сохраняет незавершённость источника, не дополняя его предположительным продолжением.
theological_decisions:
- issue: Характер греха по отношению к животным
  choice: «согрешили против зверей»
  alternative: «согрешили с животными» / «согрешили против самих себя посредством животных»
  rationale: Грамматика и ближайший контекст пролития крови указывают на насилие против животных; основной текст не вводит толкование о скотоложстве.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Синтаксический параллелизм оригинала сохранён; незавершённый конец предоставленного текста обозначен многоточием.
