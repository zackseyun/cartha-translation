base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: ru
  text: Помыслы и желания человека постоянно обращаются к суетному и злому[a], и Господь истребил всё с лица земли из-за их злых дел и из-за крови[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянно замышляют суетное и злое».'
    reason: Глагол допускает передачу через «думать», «помышлять» или «замышлять»; временное выражение означает постоянство.
  - marker: b
    text: 'Букв.: «из-за крови».'
    reason: Источник не уточняет характер «крови»; возможный смысл кровопролития не вводится в основной текст.
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: Помыслы и желания человека
  rationale: Передаёт два внутренних начала — мысль/помышление и волю/желание — естественным современным русским выражением.
- source_word: ይኄሊ፡ ከንተ፡ ወእኩየ፡
  choice: устремлены к суетному и злому
  rationale: 'Сохраняет смысл глагола мышления или внутренней направленности, а также оба определения: «суетное/тщетное» и «злое»; не сводит фразу к простой связке «являются».'
- source_word: በኵሉ፡ መዋዕል
  choice: во все дни
  rationale: Формально сохраняет временное выражение источника; по смыслу — постоянно, всегда.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እም ... ገጸ፡ ምድር
  choice: и Господь истребил всё с лица земли
  rationale: Передаёт действие полного уничтожения и традиционную пространственную формулу без добавления отсутствующего объекта.
- source_word: ወበእንተ፡ ደም
  choice: и из-за пролитой крови
  rationale: В контексте суда «кровь» метонимически указывает на кровопролитие; добавленное «пролитой» делает смысл ясным по-русски, при этом буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Характер постоянной человеческой испорченности
  choice: «во все дни устремлены к суетному и злому»
  alternative: «постоянно замышляют суетное и злое» / «всегда злы»
  rationale: Выбранная формулировка сохраняет упоминание и суетного, и злого, а также внутреннюю направленность мысли и желания, не превращая текст в более жёсткое онтологическое утверждение.
- issue: Значение «крови» как причины суда
  choice: «из-за пролитой крови»
  alternative: «из-за крови»
  rationale: Контекстуальная метонимия раскрыта минимально; сноска сохраняет буквальную форму источника.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. «Помыслы» и «с лица земли» поддерживают достоинство стиля, тогда как синтаксис остаётся понятным обычному читателю. Числовой элемент в печатном геэзском тексте перед «лица земли» не отражён как семантическая часть стиха: по контексту и засвидетельствованному переводу это, вероятно, посторонний наборный или пагинационный элемент.'
