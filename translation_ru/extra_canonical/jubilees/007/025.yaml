    reason: Источник не уточняет характер «крови»; возможный смысл кровопролития не вводится в основной текст.
  revision_rationale: 'Исправлены две безопасные точки: мыслительный оттенок первой части передан точнее, а «кровь» оставлена в исходной, неуточнённой форме. Также сглажен русский синтаксис при сохранении смысла и регистра.'
