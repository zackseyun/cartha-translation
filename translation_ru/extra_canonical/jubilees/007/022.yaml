base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: ru
  text: Они породили детей нафидимов[a]. Все они отличались друг от друга и пожирали друг друга. Исполины убивали нафила, нафил — эльо[b], а эльо — людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Нафидимы» — транслитерация названия, отличного в исходном тексте от последующего слова «нафил».
    reason: Предотвращает ошибочное отождествление двух разных терминов.
  - marker: b
    text: Названия «нафил» и «эльо» здесь, вероятно, обозначают разные классы существ; точное значение слова «эльо» неясно.
    reason: Сохраняет лексическую и смысловую неясность источника, поясняя необычную форму перечисления.
lexical_decisions:
- source_word: ናፊዲም (nāfīdīm)
  choice: нафидимы
  rationale: Передано транслитерацией как название особого рода существ; оно не отождествлено с ናፊል, поскольку исходный текст последовательно различает эти обозначения.
- source_word: ይርባሕ
  choice: исполины
  rationale: Выбрано понятное русское родовое обозначение класса великанов в соответствии с контекстом и засвидетельствованным прочтением текста.
- source_word: ናፊል (nāfīl)
  choice: нафил
  rationale: Сохранена отдельная транслитерация в единственном числе, чтобы не смешивать это слово с предшествующим «нафидимы».
- source_word: ኤልዮ (ʾelyo)
  choice: эльо
  rationale: Неясное название следующего класса существ оставлено транслитерированным, без догматического или спекулятивного истолкования.
- source_word: አመሕያው
  choice: людей
  rationale: Естественная современная русская передача собирательного обозначения человечества в заключительном звене ряда.
theological_decisions:
- issue: Соотношение нафидимов, нафила и эльо
  choice: Сохранить три различающихся обозначения
  alternative: Объединить их под названием «нефилимы» или «исполины»
  rationale: Исходный текст использует разные слова; их объединение устранило бы заложенную в нем классификацию и изменило бы смысл последовательности взаимного истребления.
- issue: Число в последовательности убийств
  choice: Передать исполинов во множественном числе, а «нафил» и «эльо» — в формально засвидетельствованной форме, понимаемой как название класса
  alternative: Последовательно поставить все названия во множественном числе
  rationale: Так сохраняется необычная и сжатая форма источника, не устраняя ее возможный собирательный смысл.
translation_notes:
  register: Современный литературный русский с кратким, суровым ритмом повествования. Эллипсис во второй части («нафил — эльо») естественен по-русски и передает сжатость исходного ряда; редкие названия не русифицированы до неразличимости.
