  yaml_path: translation/extra_canonical/jubilees/007/014.yaml
  text: And Japheth saw it and became jealous of his brother, and he too built for himself a city and called its name after the name of his wife, Adataneses[a].
translation:
  language: ru
  text: И увидел это Иафет, и позавидовал своему брату. Он тоже построил себе город и назвал его именем своей жены — Адатанесес[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Адатанесес — транслитерация эфиопской формы; точное написание имени не вполне ясно.
    reason: segmentation_note
lexical_decisions:
- source_word: ወርእየ፡ አያፌት
  choice: И увидел это Иафет
  rationale: У глагола «увидел» объект не выражен; русское «это» естественно отсылает к построенному братом городу, не устраняя контекстуальной связи.
- source_word: ወቀንአ፡ ለአኁሁ
  choice: и позавидовал своему брату
  rationale: Передаёт значение зависти или ревности по отношению к брату; в данном контексте естественнее русское «позавидовал».
- source_word: ወሐነጸ፡ ሎቱ፡ ውእቱሂ፡ ሀገረ
  choice: Он тоже построил себе город
  rationale: Сохраняет усилительное «тоже» и возвратное значение «для себя», избегая тяжеловесного буквального порядка слов.
- source_word: ወሰመየ፡ ስማ፡ በስመ፡ ብእሲቱ
  choice: и назвал его именем своей жены
  rationale: Естественная русская передача семитизированной формулы «назвал его имя по имени своей жены».
- source_word: አዳተኔሴስ
  choice: Адатанесес
  rationale: Транслитерация эфиопской формы имени с сохранением её засвидетельствованного облика.
