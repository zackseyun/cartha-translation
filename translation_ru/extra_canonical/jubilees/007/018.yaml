  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: ru
  text: 'И вот сыновья Сима: Елам, Ассур и Арфаксад — он родился через два года после потопа, — Луд и Арам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: сыновья Сима
  rationale: Прямое и естественное соответствие генеалогической формуле; имя передано в привычной русской библейской форме.
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ
  choice: Елам, Ассур и Арфаксад
  rationale: Имена переданы в традиционных русских библейских формах, а повторяющийся союз сохранён там, где это естественно по-русски.
- source_word: ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ፡ ወሉድ
  choice: он родился через два года после потопа
  rationale: Передаёт временное указание и сказуемое источника; местоимение относится к непосредственно предшествующему Арфаксаду.
- source_word: ሉድ፡ ወአራም
  choice: Луд и Арам
  rationale: Использованы общепринятые русские формы этих имён.
