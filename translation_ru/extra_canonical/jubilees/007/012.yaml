  yaml_path: translation/extra_canonical/jubilees/007/012.yaml
  text: 'And Ham knew that his father had cursed his youngest son, and it displeased him that he had cursed his son; and he separated from his father, he and his sons with him: Cush and Mizraim and Put and Canaan.'
translation:
  language: ru
  text: И Хам узнал, что его отец проклял его младшего сына. Ему не понравилось, что отец проклял его сына, и он отделился от отца вместе со своими сыновьями — Кушем, Мицраимом, Путом и Ханааном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእመረ፡ ካም
  choice: И Хам узнал
  rationale: Передаёт глагол «знать, узнать» в повествовательном контексте естественным современным русским выражением.
- source_word: ወሐሎሙ፡ ኮነ፡ ሎቱ
  choice: Хаму было тяжело
  rationale: Передаёт отрицательную внутреннюю реакцию Хама без чрезмерно разговорного «ему это не понравилось» и без уточнения эмоции сильнее, чем позволяет текст.
- source_word: ወተፈልጠ፡ እምአቡሁ
  choice: и он отделился от отца
  rationale: Сохраняет прямой смысл отделения или обособления от отца.
- source_word: ኵስ፡ ወመሰጠሬም፡ ወፉድ፡ ወከናአን
  choice: Кушем, Мицраимом, Путом и Ханааном
  rationale: Использованы узнаваемые русские формы библейских имён; творительный падеж согласован с оборотом «вместе с».
theological_decisions:
- issue: К кому относится «младший сын»
  choice: «его отец проклял его младшего сына»
  alternative: «его отец проклял младшего сына Хама»
  rationale: Местоименная формулировка сохраняет структуру и некоторую референциальную напряжённость исходного текста, тогда как ближайший контекст далее указывает, что проклят сын Хама.
- issue: Характер реакции Хама на проклятие
  choice: «Хаму было тяжело»
  alternative: «это вызвало его недовольство»
  rationale: Выбранная формулировка не превращает реакцию в богословски или нравственно однозначный протест и сохраняет более широкую эмоциональную семантику.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис слегка упрощён ради естественного чтения, при этом повтор «проклял» сохранён как смысловой акцент оригинала.
