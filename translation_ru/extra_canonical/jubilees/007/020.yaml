base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
translation:
  language: ru
  text: И в двадцать восьмой юбилей Ной начал наставлять детей своих детей в установлениях, заповедях и во всём, что он знал о правосудии[a]. Он наставлял своих детей, чтобы они поступали праведно, прикрывали наготу своего тела, благословляли своего Создателя[b], почитали отца и мать, любили каждый своего ближнего и хранили свои души от блуда, нечистоты и всякого беззакония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о справедливости».'
    reason: lexical_choice
  - marker: b
    text: 'Буквально: «того, кто создал их».'
    reason: literal_translation
lexical_decisions:
- source_word: ፍትሐ
  choice: правосудии
  rationale: Слово относится к области суда и справедливости. В сочетании с «установлениями и заповедями» «правосудие» сохраняет правовой смысл и допускаемую источником связь со справедливостью.
- source_word: ለውሉደ፡ ውሉዱ፡
  choice: детям своих детей
  rationale: Буквально передаёт указание на потомков второго поколения, то есть внуков Ноя, не добавляя лишнего поколения.
- source_word: ለዘፈጠሮሙ
  choice: своего Создателя
  rationale: Естественная русская передача буквального выражения «того, кто создал их»; притяжательное местоимение соотнесено с наставляемыми потомками.
- source_word: ዝሙት
  choice: блуда
  rationale: «Блуд» — ясный и уместный в библейском регистре термин для половой распущенности, без неоправданного сужения до одной её формы.
- source_word: ርኵስ
  choice: нечистоты
  rationale: Сохраняет широкое нравственно-ритуальное значение источника и последовательность перечисления.
theological_decisions:
- issue: Значение ፍትሐ в правовом и нравственном контексте
  choice: правосудии
  alternative: справедливости; судах; законах
  rationale: Выбор не сводит слово к набору законов и сохраняет его смысловую связь как с судебным порядком, так и со справедливостью; альтернативное понимание отмечено в сноске.
- issue: Объект наставления в первой и второй частях стиха
  choice: «детям своих детей» в первой части и «своих детей» во второй
  alternative: унифицировать обе формулировки как «потомков»
  rationale: Сохранена различимая формулировка источника без сглаживания возможного перехода от внуков к более общему обозначению детей.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для широкого читателя; сохранены повторяющаяся структура наставлений и нравственно-правовая терминология источника.
