  yaml_path: translation/extra_canonical/jubilees/007/030.yaml
  text: For thus Enoch, the father of your father, commanded his son Methuselah, and Methuselah commanded his son Lamech, and Lamech commanded me everything that his fathers commanded him.
translation:
  language: ru
  text: Ибо так Енох, отец вашего отца,[a] заповедал своему сыну Мафусалу; Мафусал — своему сыну Ламеху; а Ламех заповедал мне всё, что заповедали ему его отцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное прочтение: «Енох, отец вашего отца Мафусала, заповедал своему сыну».'
    reason: Геэзская конструкция допускает иное членение, хотя в основном тексте Мафусал отнесён к словам «своему сыну».
lexical_decisions:
- source_word: አዘዘ
  choice: заповедал
  rationale: Передаёт авторитетное наставление и сохраняет повтор, связывающий цепь передачи от Еноха до Ноя.
- source_word: ወእዱ
  choice: своему сыну
  rationale: Мафусал синтаксически понимается как уточнение к «своему сыну», в соответствии с последовательностью родословия и формой исходного текста.
- source_word: አበዊሁ
  choice: его отцы
  rationale: Сохранено множественное число источника; речь идёт о предках Ламеха, передававших заповеди.
theological_decisions:
- issue: Цепь передачи заповеди
  choice: Енох заповедует сыну Мафусалу, Мафусал — сыну Ламеху, Ламех — Ною
  alternative: Понять Мафусала как приложение к выражению «вашего отца»
  rationale: Основное прочтение лучше отражает синтаксическую роль имени после «своему сыну» и не искажает явно изложенную далее цепь передачи.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставления. Повтор глагола «заповедал» сохранён как смысловой каркас стиха; во второй части использовано естественное русское опущение повторяющегося сказуемого.
