  text: But Shem remained with his father Noah, and he built a city near his father, by the mountain, and he called its name after the name of his wife, Sedeqetelebab[a].
translation:
  language: ru
  text: Сим же остался с отцом своим Ноем и построил город неподалёку от него, у горы. Он назвал этот город именем своей жены — Седекателбаб[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Седекателбаб» передано по эфиопскому тексту. Возможно, в нём сохранилось значение, связанное с праведностью, однако в основном тексте оно оставлено как имя собственное.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ (nabara)
  choice: остался
  rationale: В данном повествовательном контексте глагол означает, что Сим продолжал жить с отцом, в отличие от отделившихся братьев; «остался» естественно передаёт этот смысл по-русски.
- source_word: በአደ፡ አቡሁ (baʾada ʾabuhu)
  choice: рядом с отцом
  rationale: Передаёт пространственное значение выражения без тяжеловесного буквального оборота «при стороне своего отца».
- source_word: ኀበ፡ ደብር (ḫaba dabr)
  choice: у горы
  rationale: Сохраняет простое пространственное указание эфиопского текста; название горы в самом стихе не повторяется.
- source_word: ሴደቃቴልባብ
  choice: Седекателбаб
  rationale: Имя транслитерировано с эфиопской формы, а не переведено по предположительной этимологии.
