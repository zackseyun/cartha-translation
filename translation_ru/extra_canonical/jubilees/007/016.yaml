  text: 'And behold, these three cities are near Mount Lubar: Sedeqetelebab in front of the mountain toward its east, Ne''elatama''uk toward the south, and Adataneses toward the sea.'
translation:
  language: ru
  text: 'И вот, эти три города находятся близ горы Лубар: Седекателебаб — перед горой, с восточной её стороны; Неэлата-Маук — к югу; Адатанесес — в сторону моря.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠላስ፡ ቅሩበ፡ ሉባር፡ ደብር
  choice: эти три города находятся близ горы Лубар
  rationale: Передаёт число, близость и топоним естественным русским синтаксисом; слово «города» восстанавливается из ближайшего контекста.
- source_word: ቅድመ፡ ገጸ፡ ደብር፡ በጽባሒሁ
  choice: перед горой, с восточной её стороны
  rationale: ጽባሕ буквально связано с утром и в пространственном употреблении обозначает восток; формулировка сохраняет сочетание «перед горой» и ориентацию.
- source_word: ገጸ፡ ሰሜን
  choice: к северу
  rationale: В предоставленном тексте прямо стоит ሰሜን, обычное геэзское обозначение севера; поэтому основной текст следует исходному чтению, несмотря на английское «toward the south».
- source_word: መንገለ፡ ባሕር
  choice: в сторону моря
  rationale: Сохраняет относительную ориентацию исходника без необоснованного уточнения, какое именно море или какая сторона света имеется в виду.
