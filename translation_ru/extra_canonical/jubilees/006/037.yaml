base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: ru
  text: Поэтому настанут для них годы, когда они нарушат порядок и сделают день свидетельства отвратительным днём[a], а нечистый день — праздничным; они смешают все святые дни с нечистыми, а нечистый день — со святым, потому что собьются в счёте месяцев, суббот, праздников и юбилеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и сделают отвратительный день днём свидетельства».'
    reason: Сохранён засвидетельствованный альтернативный синтаксический разбор, хотя порядок и конструкция геэзского текста предпочтительно поддерживают основной перевод.
lexical_decisions:
- source_word: ያማስኑ
  choice: нарушат порядок
  rationale: Глагол передаёт порчу или расстройство установленного порядка; такой перевод естественно связывает дальнейшие перестановки святых и нечистых дней с календарным беспорядком, не уточняя его сверх контекста.
- source_word: ዕለተ፡ ስምዐ
  choice: день свидетельства
  rationale: Сохранено прямое значение сочетания «день свидетельства» и его роль как того, что превращают в отвратительный день.
- source_word: ምግንተ
  choice: отвратительным
  rationale: Передаёт отрицательную оценку — мерзость, негодность или предмет порицания — без привнесения узкоконфессионального термина.
- source_word: ዕለተ፡ ርኵስተ
  choice: нечистый день
  rationale: Формально и последовательно передаёт противопоставление нечистого и святого.
- source_word: ይስሕቱ
  choice: собьются в счёте
  rationale: В календарном контексте естественно передаёт ошибку относительно месяцев, суббот, праздников и юбилеев.
- source_word: ኢዮቤል
  choice: юбилеев
  rationale: Передаёт название юбилейных периодов привычным русским библейским термином.
theological_decisions:
- issue: Направление превращения дня свидетельства и отвратительного дня
  choice: «сделают день свидетельства отвратительным днём»
  alternative: «сделают отвратительный день днём свидетельства»
  rationale: Последовательность и синтаксическая связь слов в геэзском тексте лучше поддерживают понимание «дня свидетельства» как прямого дополнения, а «отвратительного» — как результата превращения; альтернативное чтение сохранено в примечании из-за истории передачи и возможной синтаксической неоднозначности.
- issue: Характер календарной ошибки
  choice: Не конкретизировать ошибочную календарную систему
  alternative: Отождествить её с определённым историческим или конфессиональным календарём
  rationale: Стих говорит об ошибке в месяцах, субботах, праздниках и юбилеях, но сам по себе не называет конкретную позднейшую систему.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Параллелизм «святые — нечистые» и перечень календарных единиц сохранены; фраза «собьются в счёте» делает календарный смысл ясным без избыточного толкования.
