  yaml_path: translation/extra_canonical/jubilees/006/002.yaml
  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: ru
  text: И он положил жир на жертвенник, взял быка, барана, овцу, козлят, соль, горлицу и молодого голубя и принёс на жертвеннике всесожжение. На них он положил приношение, смешанное с маслом, окропил их вином и на всё возложил благовоние. Так он вознёс приятное благоухание, угодное Господу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥብሐ
  choice: жир
  rationale: Слово обозначает жир жертвенного животного; это соответствует культовому контексту и не требует расширительного толкования.
- source_word: ነዝኀ
  choice: окропил
  rationale: Глагол означает «кропить, разбрызгивать», а не обычное «выливать»; перевод сохраняет конкретный образ исходного текста.
- source_word: ጽንሓሐ
  choice: всесожжение
  rationale: В данном жертвенном контексте слово обозначает сжигаемую жертву; традиционный русский термин точен и понятен.
- source_word: ዕጣነ
  choice: благовоние
  rationale: Передаёт ароматическое вещество, возлагаемое на жертву; формулировка «всё покрыл благовонием» естественно выражает ወወደየ፡ ላዕለ፡ ኵሉ.
- source_word: መዐዛ፡ ሠናየ
  choice: приятное благоухание
  rationale: Сохраняет культовый образ приятного запаха без добавления отсутствующего в источнике термина «жертва».
theological_decisions:
- issue: Передача እግዚአብሔር
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: В геэзском тексте употреблён обычный титул «Господь», а не явно обозначенное личное имя YHWH; поэтому специальное типографическое выделение неуместно.
- issue: Характер угодного благоухания
  choice: угодное пред Господом
  alternative: которое угождает Господу
  rationale: Сохранена формула исходного текста и её культово-богословская напряжённость без объяснения механизма принятия жертвы.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но последовательность жертвенных действий и исходная культовая терминология сохранены.
