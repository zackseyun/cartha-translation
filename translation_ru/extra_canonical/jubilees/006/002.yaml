revisions:
- from: И он положил жир на жертвенник, взял быка, барана, овцу, козлят, соль, горлицу и молодого голубя и принёс на жертвеннике всесожжение. Поверх них он положил приношение, смешанное с маслом, окропил вином и всё покрыл благовонием. Так он вознёс приятное благоухание, угодное пред Господом.
  to: И он положил жир на жертвенник, взял быка, барана, овцу, козлят, соль, горлицу и молодого голубя и принёс на жертвеннике всесожжение. На них он положил приношение, смешанное с маслом, окропил их вином и на всё возложил благовоние. Так он вознёс приятное благоухание, угодное Господу.
  rationale: Исправлены две формулировки, чтобы точнее передать глагол «возложил» в отношении благовония и обеспечить современную естественность заключительной формулы. Не добавлялись толкования о виде приношения или о ритуальном значении действий.
