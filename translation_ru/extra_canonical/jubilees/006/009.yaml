  text: And as for you, be fruitful and multiply upon the earth.
translation:
  language: ru
  text: Вы же плодитесь и размножайтесь на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ
  choice: плодитесь
  rationale: В данном благословении слово передаёт призыв приносить плод, то есть иметь потомство; традиционная русская формула естественно выражает этот смысл.
- source_word: ብዙአ
  choice: размножайтесь
  rationale: Передаёт повеление становиться многочисленными и сохраняет парную формулу благословения.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Прямое и естественное соответствие пространственному выражению «на/по земле».
theological_decisions:
- issue: Связь формулировки с благословением о продолжении рода
  choice: Сохранена формула «плодитесь и размножайтесь»
  alternative: «умножайтесь и становитесь многочисленными»
  rationale: Выбранная формула точно передаёт два взаимосвязанных повеления, звучит достойно и понятно и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой повеления. Начальное ወ и усилительное местоимение переданы как «Вы же», что сохраняет переход и акцент на адресатах без тяжеловесного «а что до вас».
