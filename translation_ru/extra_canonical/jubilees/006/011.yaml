base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: ru
  text: Поэтому Я сказал, что и ты заключишь завет с сынами Израиля в этом месяце на горе, скрепив его клятвой, и окропишь их кровью ради всех слов завета, который Бог заключил с ними на все времена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትካየድ፡ ኪዳነ
  choice: заключишь завет
  rationale: Естественная русская формула, точно передающая действие установления завета.
- source_word: ደቂቀ፡ እስራኤል
  choice: сыны Израиля
  rationale: Сохраняет традиционную библейскую формулу и коллективное значение выражения.
- source_word: ምስለ፡ ማሕላ
  choice: скрепив его клятвой
  rationale: Передаёт сопутствующую клятву и по-русски ясно связывает её с заключением завета.
- source_word: ትእዛዝ፡ ላዕሌሆሙ፡ ደመ
  choice: окропишь их кровью
  rationale: Следует смыслу исходного выражения и сохраняет ритуальный характер действия.
- source_word: እግዚአብሔር
  choice: Бог
  rationale: В данном эфиопском тексте это обозначение Бога; выбор не подменяет его особым заветным именем.
- source_word: ለኵሉ፡ መዋዕል
  choice: на все времена
  rationale: Естественно передаёт идею непрерывной длительности во все последующие дни.
theological_decisions:
- issue: Отношение кровного окропления к словам завета
  choice: «ради всех слов завета»
  alternative: «в связи со всеми словами завета»
  rationale: Сохранена широкая причинно-целевая связь исходного በእንተ без уточнения богословского механизма.
- issue: Субъект заключения завета
  choice: Моисей заключает завет с Израилем, тогда как далее говорится о завете, который Бог заключил с ними
  alternative: Сгладить оба действия как единое Божье заключение завета
  rationale: Сохранено различие формулировок источника и присущая ему напряжённость между человеческим посредничеством и Божьим действием.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Синтаксис упрощён для ясности, но последовательность действий и повтор глагола «заключить» сохранены ради смысловой точности.
