    rationale: Исходник повторяет выводное «поэтому». «Поэтому» точнее сохраняет ход аргумента и более уместно в данном торжественном регистре.
  - severity: low
    issue: «Установленных времён»
    rationale: Определение «установленных» интерпретирует общий календарный термин. «Времён» сохраняет исходную широту и звучит естественно в перечне.
