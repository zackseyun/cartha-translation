  naturalness: «Исчислять год состоящим ровно из… дней» — естественная современная литературная формулировка для календарного контекста. Торжественный повтор «свидетельствую… свидетельствовал» допустим и сохраняет регистр.
  terminology: «Новолуния, времена, субботы и праздники» верно сохраняет календарный перечень. «Времена» не следует излишне конкретизировать как «установленные времена». Заключительная фраза оставлена в естественном русском виде, а буквальный порядок и широта кванторов отмечены сноской.
