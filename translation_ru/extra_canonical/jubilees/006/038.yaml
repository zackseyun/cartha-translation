  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: ru
  text: Поэтому я повелеваю тебе и свидетельствую тебе, чтобы и ты свидетельствовал им. Ибо после твоей смерти твои потомки исказят этот порядок и не будут исчислять год состоящим ровно из трёхсот шестидесяти четырёх дней. Поэтому они собьются в определении новолуний, времён, суббот и праздников и будут есть всякую плоть вместе с кровью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут есть всю кровь со всякой плотью».'
    reason: Исходная фраза допускает более буквальную, но по-русски менее естественную конструкцию; примечание сохраняет её форму и потенциальную смысловую широту.
lexical_decisions:
- source_word: አስምዕ / ታስምዕ
  choice: свидетельствую / свидетельствовал
  rationale: Сохраняет юридико-заветный оттенок глагола и намеренный повтор исходного текста, хотя по-русски такая формула звучит торжественно.
- source_word: ያማስኑ
  choice: исказят этот порядок
  rationale: Глагол передаёт порчу или искажение; подразумеваемый объект раскрыт из ближайшего контекста календарного порядка, не сводя значение только к ошибке в подсчётах.
- source_word: ዓመተ ... ምእተ ወስሳ ወረቡዐ መዋዕለ ባሕቲተከ
  choice: в году ровно триста шестьдесят четыре дня
  rationale: Естественно передаёт утверждение о годе, состоящем только из 364 дней; «ровно» выражает ограничительное значение.
- source_word: ሠርቀ
  choice: новолуний
  rationale: В календарном перечне обозначает начало лунного месяца или новолуние; выбран понятный традиционный русский термин.
- source_word: ጊዜ
  choice: установленных времён
  rationale: Передаёт не просто течение времени, а календарные сроки или времена в одном ряду с субботами и праздниками.
- source_word: ኵሎ ደመ ምስለ ኵሉ ሥጋ
  choice: всякую плоть вместе с кровью
  rationale: Естественная русская формулировка пищевого нарушения; буквальное устройство фразы сохранено в примечании.
theological_decisions:
- issue: Заветный или лишь информационный смысл አስምዕ
  choice: свидетельствую тебе, чтобы и ты свидетельствовал им
  alternative: сообщаю тебе, чтобы и ты сообщил им
  rationale: «Свидетельствовать» сохраняет торжественный, обязывающий характер наставления и одинаково передаёт повтор одного глагола, не добавляя конфессионального толкования.
- issue: Связь крови и плоти в заключительной фразе
  choice: есть всякую плоть вместе с кровью
  alternative: есть всю кровь со всякой плотью
  rationale: Выбранная формулировка ясно выражает употребление мяса с кровью и остаётся близкой к исходной конструкции; буквальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор «свидетельствую… свидетельствовал» сохранён намеренно. Календарная терминология сформулирована понятно, без привнесения поздней конфессиональной системы.
