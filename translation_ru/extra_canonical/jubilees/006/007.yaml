  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: ru
  text: Но мяса с его жизнью — с его кровью — не ешьте, потому что жизнь всякой плоти находится в крови, дабы не была взыскана ваша кровь за ваши жизни. С руки всякого человека, с руки всякого живого существа Я взыщу кровь человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ
  choice: его жизнью
  rationale: Хотя слово обычно означает «дух», в сочетании с плотью и кровью здесь оно обозначает оживляющее начало, то есть жизнь; буквальное «духом» в современном русском исказило бы смысл запрета.
- source_word: ነፍሰ
  choice: жизнь
  rationale: В утверждении о крови слово имеет значение жизни живого существа; выбор согласуется с контекстом и сохраняет связь между жизнью и кровью.
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: будет взыскана / Я взыщу
  rationale: Корень передаёт требование ответа или взыскание крови, а не простой поиск; русский глагол сохраняет судебно-возмездный оттенок.
- source_word: እምውስተ፡ እዴ / እምእዴ
  choice: с руки
  rationale: Сохранена семитская формула ответственности «с руки», понятная в торжественном библейском регистре и не сводящая смысл только к физическому действию.
- source_word: ሥጋ
  choice: плоть / мясо
  rationale: В пищевом запрете естественно «мясо», а в общем утверждении о природе живых существ — традиционное и точное «плоть».
theological_decisions:
- issue: Связь крови, жизни и последующего взыскания
  choice: «чтобы не была взыскана ваша кровь за ваши жизни»
  alternative: «иначе будет взыскана кровь ваших жизней»
  rationale: Сохранена целевая/предостерегающая конструкция ከመ с отрицательным глаголом и различение между «вашей кровью» и «вашими жизнями», не устраняя трудность исходной формулировки.
- issue: Субъект последнего требования крови
  choice: «Я взыщу» с прописной буквы
  alternative: безличное «будет взыскана»
  rationale: Форма источника в последней части передаёт первое лицо; в контексте говорящим является Бог, поэтому русская орфография обозначает это прописной буквой, не добавляя имени или титула.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Тире поясняет, что кровь раскрывает смысл «жизни» при мясе, а повтор «с руки» намеренно сохранён ради риторической структуры и темы личной ответственности.
