revisions:
- from: И нет для этого закона предела во времени, потому что он установлен навеки. Они будут соблюдать его из поколения в поколение, непрестанно вознося за вас мольбы[a] с кровью перед жертвенником каждый день, утром и вечером. Они всегда будут совершать за него искупление[b] перед Господом, чтобы соблюдать его и не быть искоренёнными.
  to: У этого закона нет срока, ибо он навеки. Они будут соблюдать его из поколения в поколение, чтобы возносить за вас мольбы[a] с кровью перед жертвенником каждый день, утром и вечером. Они будут постоянно совершать за него искупление[b] перед Господом, чтобы соблюдать его и не быть искоренёнными.
  rationale: 'Внесены только безопасные стилистические и аспектуальные правки: устранено не подтверждаемое отдельно исходником «непрестанно» при первой мольбе, а постоянство сохранено при следующем действии; начальная фраза сделана естественнее по-русски. Не изменены различие мольбы и искупления, неопределённый референт «за него», упоминание крови и жертвенника, а также пассивный образ искоренения.'
