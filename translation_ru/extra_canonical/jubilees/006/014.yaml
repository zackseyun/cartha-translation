  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: ru
  text: У этого закона нет срока, ибо он навеки. Они будут соблюдать его из поколения в поколение, чтобы возносить за вас мольбы[a] с кровью перед жертвенником каждый день, утром и вечером. Они будут постоянно совершать за него искупление[b] перед Господом, чтобы соблюдать его и не быть искоренёнными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ходатайствуя за вас».'
    reason: Глагол допускает передачу через близкие понятия мольбы и ходатайства.
  - marker: b
    text: 'Или: «совершать за него очищение».'
    reason: Глагол искупления может в данном культовом контексте обозначать также очищение.
lexical_decisions:
- source_word: ዐቅመ፡ መዋዕል
  choice: предела во времени
  rationale: Буквально сочетание означает «меры/предела дней»; современная русская формулировка передаёт неограниченную продолжительность закона.
- source_word: ይትመሀለሉ
  choice: вознося ... мольбы
  rationale: Глагол означает «молить, умолять, просить»; сохранено его отличие от следующего глагола искупления.
- source_word: በእንቲአክሙ፡ በደም
  choice: за вас ... с кровью
  rationale: Сохранены значение ходатайства за адресатов и явное упоминание крови как части жертвенного действия, без отождествления самой мольбы с искуплением.
- source_word: ያስተሰርዩ
  choice: будут совершать ... искупление
  rationale: Каузативная форма передаёт совершение искупления или очищения и лексически отличается от предшествующей мольбы.
- source_word: ይሠረዉ
  choice: не быть искоренёнными
  rationale: Передано пассивное значение глагола «искоренять, вырывать с корнем» и сохранена серьёзность угрозы, а не ослабленное «не пренебрегать».
theological_decisions:
- issue: Различие между мольбой и искуплением
  choice: Передать ይትመሀለሉ как мольбу, а ያስተሰርዩ как совершение искупления
  alternative: Оба действия передать языком искупления
  rationale: В источнике употреблены разные глаголы; их разграничение сохраняет последовательность молитвенного и жертвенно-искупительного действий.
- issue: Объект искупления в выражении በእንቲአሁ
  choice: «за него», с отсылкой к закону/предписанию
  alternative: «за себя» или без выраженного объекта
  rationale: Местоименная форма указывает на объект в единственном числе; перевод не заменяет его референтом «они сами», хотя точная природа искупления остаётся контекстуально напряжённой.
- issue: Заключительная угроза
  choice: «не быть искоренёнными»
  alternative: «не пренебрегать им»
  rationale: Пассивная форма исходного глагола выражает искоренение людей; это сохраняет заветное последствие непослушания.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Оборот «предела во времени» естественно передаёт буквальную «меру дней»; различие между мольбой и искуплением намеренно сохранено. Написание «Господом» соответствует обычной русской библейской традиции без типографического выделения капителью.
