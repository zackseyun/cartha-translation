  verdict: revise
  source_fidelity: 'Смысловые опоры исходника в целом переданы верно: закон вечен, предписание соблюдается поколениями; различены мольба (ይትመሀለሉ) и последующее искупительное действие (ያስተሰርዩ); сохранены «кровь», жертвенник, ежедневные утренние и вечерние действия, а также пассивная угроза «быть искоренёнными» (ይሠረዉ). Однако «непрестанно» при первой мольбе излишне усиливает исходное выражение и создаёт ненужное дублирование с «каждый день, утром и вечером»; наречие «всегда/постоянно» относится к следующему искупительному действию.'
  naturalness: «Предела во времени» понятно, но для современного литературного русского несколько канцелярски. «У этого закона нет срока» естественнее и сохраняет смысл «нет меры/предела дней». Перестройка среднего предложения с личной формой «чтобы они возносили» делает связь цели яснее, чем деепричастный оборот после «будут соблюдать».
  terminology: «Мольбы», «искупление», «жертвенник» и «Господь» уместны по регистру. «За него» намеренно сохраняет единственное число и не подменяет не вполне прозрачный референт местоимения конкретизацией «за себя». «Искоренёнными» точно передаёт образ пассивного искоренения; заменять его «не пренебрегать» нельзя.
