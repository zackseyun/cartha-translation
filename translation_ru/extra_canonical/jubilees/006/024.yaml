  source_fidelity: Начальный оборот ወሥርዓት፡ ለስምዕ፡ ለዓለም прямо содержит «и установление/постановление для свидетельства навеки». В основном тексте проекта предлог передан как «как», хотя более прямое целевое прочтение должно быть основным; характеризующее прочтение можно сохранить в сноске. «И Ной установил их для себя как праздники» сохраняет глагол, местоименный объект, дативное «для себя» и значение «праздники».
  naturalness: «Установление для свидетельства навеки» естественно в сдержанном библейско-литературном регистре. В заключительном обороте «на вечные поколения» яснее выражает продолжительность действия, чем «для вечных поколений», которое в современном русском может двусмысленно характеризовать сами поколения.
  terminology: «Установление», «свидетельство» и «праздники» уместны и не вносят конфессиональной интерпретации. Местоимение «их» следует сохранить без добавления предполагаемого референта.
