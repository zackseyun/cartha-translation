  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: ru
  text: И установление для свидетельства навеки.[a] И Ной установил их для себя как праздники на вечные поколения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и установление — свидетельство навеки».'
    reason: Сохраняет возможное характеризующее понимание связи между «установлением» и «свидетельством», тогда как основной текст передаёт предлог в его прямом целевом значении.
lexical_decisions:
- source_word: ሥርዓት
  choice: установление
  rationale: Передаёт значение предписанного порядка или постановления, сохраняя именную форму исходного текста.
- source_word: ስምዕ
  choice: свидетельство
  rationale: Обычное и контекстуально подходящее соответствие значению «свидетельство, знак свидетельства».
- source_word: ሠርዓን
  choice: установил их
  rationale: Глагол связан с идеей установления или упорядочения; объект во множественном числе сохранён без уточнения референта сверх данного контекста.
- source_word: በዓላት
  choice: праздники
  rationale: Естественный современный русский эквивалент для установленных праздничных дней.
- source_word: ለትውልድ፡ ዘለዓለም
  choice: для вечных поколений
  rationale: Естественно передаёт непрерывную длительность предписания из поколения в поколение.
theological_decisions:
- issue: Связь «установления» со «свидетельством»
  choice: «установление — как свидетельство навеки»
  alternative: «установление для свидетельства навеки»
  rationale: Предлог допускает целевое или характеризующее понимание; основной текст звучит естественно, а альтернативное прочтение отмечено в сноске.
- issue: Местоименный объект при «установил»
  choice: сохранить «их» без явного пояснения
  alternative: уточнить предполагаемый референт, например «эти дни»
  rationale: Источник использует местоименный объект, и его референт определяется предшествующим контекстом; эксплицитное уточнение могло бы неоправданно снять неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования; синтаксис слегка торжественный, но понятный. Начальный союз «и» сохранён как связь с предыдущим стихом.
