  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: ru
  text: И весь этот праздник совершался на небесах от дня сотворения до дней Ноя — двадцать шесть юбилеев и пять седмиц лет. И Ной и его сыновья соблюдали его семь юбилеев и одну седмицу лет, до дня смерти Ноя. А со дня смерти Ноя его сыновья искажали его вплоть до дней Авраама и ели кровь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓል
  choice: праздник
  rationale: Передаёт значение установленного праздничного торжества и естественно звучит по-русски.
- source_word: ትትገበር
  choice: совершался
  rationale: Страдательная форма указывает на совершение или празднование; «совершался» сохраняет возвышенный регистр и не уточняет субъект.
- source_word: ዐቀብዋ
  choice: соблюдали его
  rationale: Глагол выражает хранение и соблюдение установления; местоимение отсылает к празднику.
- source_word: ኢዮቤልዉ
  choice: юбилеев
  rationale: Сохраняется специальная календарная единица книги Юбилеев — период в сорок девять лет.
- source_word: ሱባዔ ዓመት / ሱባዔ ዓመታት
  choice: седмиц лет
  rationale: Буквально «семилетий/недель лет»; «седмица лет» сохраняет библейскую календарную образность и отличает единицу от обычной недели.
- source_word: ይበልዑ ደመ
  choice: ели кровь
  rationale: Прямо сохраняет конкретное обвинение исходного текста, не заменяя его толкованием вроде «употребляли кровь в пищу».
theological_decisions:
- issue: Небесное соблюдение праздника
  choice: «праздник совершался на небесах»
  alternative: «праздник праздновали на небе»
  rationale: Сохранена пассивная конструкция источника и не введён явно не названный субъект, например ангелы.
- issue: Действия сыновей Ноя после его смерти
  choice: «нарушали его»
  alternative: «исказили его» / «оставили его»
  rationale: Глагольная форма в данном контексте противопоставлена прежнему соблюдению; «нарушали» передаёт это противопоставление, не уточняя способ отступления.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмица лет» выбран ради точности календарной системы; синтаксис разделён на три ясных предложения, соответствующих смысловым частям источника.
