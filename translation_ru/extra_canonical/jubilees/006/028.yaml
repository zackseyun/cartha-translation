lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: вершины гор
  rationale: Буквально «главы/вершины гор»; естественный и точный русский эквивалент.
- source_word: ተፈሥሐ
  choice: обрадовался
  rationale: Передаёт радость Ноя без стилистического утяжеления.
- source_word: ሠርዓን፡ ኪያሆን፡ ሎቱ
  choice: он установил эти дни для себя
  rationale: Глагол означает установление или назначение; местоименный объект в контексте относится к ранее названным памятным дням.
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: как праздники вечного воспоминания
  rationale: 'Учитывает продолжение эфиопского текста, утраченное в предоставленном фрагменте из-за ошибочного деления: это праздники для непрестанного памятования.'
- source_word: ወከማሁ፡ ሠርዓዋ
  choice: и так они и установлены
  rationale: Сохраняет итоговое утверждение оригинала и его связь с предшествующим установлением.
theological_decisions:
- issue: Характер установленных дней
  choice: праздники вечного воспоминания
  alternative: праздники навеки
  rationale: Чтение сохраняет засвидетельствованное в полном тексте ለተዝካር «для воспоминания/памятования», не сводя смысл только к длительности праздников.
