base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: ru
  text: 'А ты повели сыновьям Израиля соблюдать годы по этому исчислению: триста шестьдесят четыре дня — и это будет полный год. И год не нарушит своего порядка ни в днях своих, ни в праздниках своих, потому что всё наступит в них согласно их свидетельству; и они не пропустят ни одного дня и не нарушат ни одного праздника.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእንተኒ
  choice: А ты
  rationale: Передаёт самостоятельное местоимение с эмфатическим выделением адресата, сохраняя естественность русской речи.
- source_word: ይዕቀቡ፡ ዓመታተ
  choice: соблюдать годы
  rationale: Сохраняет прямое значение глагола «хранить, соблюдать» и календарный смысл множественного числа «годы».
- source_word: በዝ፡ ኍልቍ
  choice: по этому исчислению
  rationale: Естественно передаёт указание на данный способ счёта календарных лет.
- source_word: ፍጹመ፡ ዓመተ
  choice: полный год
  rationale: Буквально и ясно передаёт завершённость годового цикла.
- source_word: ወኢያማስን
  choice: И он не собьёт
  rationale: Сохранено мужское единственное число геэзского глагола; местоимение соотносится с годом.
- source_word: ይበጽሕ
  choice: наступит
  rationale: В календарном контексте естественно выражает приход назначенных дней и праздников, не усиливая значение сверх источника.
- source_word: ወኢየኀልፉ፡ ዕለተ
  choice: и они не пропустят ни одного дня
  rationale: Передаёт множественное число и смысл непрохождения мимо/непропуска дня; «ни одного» естественно по-русски выражает отрицательную конструкцию.
- source_word: ወኢያማስኑ፡ በዓለ
  choice: и не собьют срок праздника
  rationale: Сохраняет множественное число последнего глагола и отличает его от предшествующего единственного; добавление «срок» делает календарный смысл естественным, не меняя содержания.
theological_decisions:
- issue: Референт единственного числа в выражении ወኢያማስን
  choice: «он» относится к полному году
  alternative: «оно» относится к исчислению
  rationale: Ближайшее существительное «год» имеет мужской род в русском и подходит по форме; при этом источник допускает смысловую связь с календарным исчислением, поэтому перевод не развивает дополнительного толкования.
- issue: Значение «свидетельства» в календарном контексте
  choice: сохранено буквальное «согласно их свидетельству»
  alternative: истолковать как «согласно установленному для них порядку/знакам»
  rationale: Источник не устраняет необычность выражения; буквальная передача сохраняет его возможную правовую или знаковую окраску и не навязывает толкование.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены эмфаза начального местоимения, календарная терминология и различие между единственным и множественным числом глаголов.
