revisions:
- from: 'А ты повели сынам Израиля соблюдать годы по этому исчислению: триста шестьдесят четыре дня — и это будет полный год. И он не собьёт установленное время ни для его дней, ни для его праздников, потому что всё наступит в них согласно их свидетельству; и они не пропустят ни одного дня и не собьют срок праздника.'
  to: 'А ты повели сыновьям Израиля соблюдать годы по этому исчислению: триста шестьдесят четыре дня — и это будет полный год. И год не нарушит своего порядка ни в днях своих, ни в праздниках своих, потому что всё наступит в них согласно их свидетельству; и они не пропустят ни одного дня и не нарушат ни одного праздника.'
