  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: ru
  text: Во все дни земли сев и жатва не прекратятся; холод и зной, лето и зима, день и ночь не изменят своего порядка и не прекратятся вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: во все дни земли
  rationale: Точно передаёт временное обстоятельство «во все дни существования земли», сохраняя краткость и библейскую торжественность.
- source_word: ዘርእ፡ ወማእረር
  choice: сев и жатва
  rationale: Передаёт устойчивую пару сельскохозяйственных сезонов; «сев» естественнее по-русски, чем буквальное «семя».
- source_word: ቍር፡ ወሙቀት
  choice: холод и зной
  rationale: Сохраняет контраст холода и тепла; «зной» придаёт фразе достоинство и соответствует сезонному контексту.
- source_word: ሐጋይ፡ ወክረምት
  choice: лето и зима
  rationale: Естественный русский эквивалент сезонной пары; возможные значения «сухой сезон» и «дождливый сезон» здесь передаются функционально.
- source_word: ኢይወልጡ፡ ሥርዓቶሙ
  choice: не изменят своего порядка
  rationale: Формально отражает множественное подлежащее и идею установленного порядка чередования.
- source_word: ለዓለም
  choice: вовеки
  rationale: Передаёт продолжительность без конца в краткой, традиционной и понятной современной форме.
theological_decisions:
- issue: Объём заключительного «вовеки»
  choice: Синтаксически отнесено к ближайшему сказуемому «не прекратятся», при естественном смысловом распространении на весь установленный порядок.
  alternative: Явно распространить «вовеки» на обе части стиха посредством перестройки предложения.
  rationale: Исходный порядок слов ставит выражение в конце и не требует искусственно уточнять его область действия.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены параллельные пары и переход от прекращения сева и жатвы к неизменности природного порядка; пунктуация делает синтаксис ясным, не добавляя толкования.
