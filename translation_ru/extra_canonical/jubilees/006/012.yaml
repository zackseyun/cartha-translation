base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: ru
  text: И это свидетельство записано о вас, чтобы вы соблюдали его во все дни и не ели никакой крови зверей, птиц и скота во все дни земли. А человек, который ест кровь зверя, скота или птицы во все дни земли, будет искоренён с земли — он и его потомство.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: свидетельство
  rationale: Передаёт основное значение геэзского слова и сохраняет юридико-заветный оттенок контекста.
- source_word: አራዊት
  choice: звери
  rationale: Обозначает диких животных и естественно противопоставляется скоту и птицам.
- source_word: እንስሳ
  choice: скот
  rationale: В данном перечислении речь идёт о домашних животных; «скот» ясно отличает их от зверей.
- source_word: ዘርኡ
  choice: его потомство
  rationale: Буквально «его семя»; «потомство» естественно для современного русского языка и сохраняет родовое значение.
- source_word: ይስሮ
  choice: да будет искоренён
  rationale: Сохраняет образ удаления с корнем и повелительно-судебную силу исходной формы.
theological_decisions:
- issue: Объём запрета крови
  choice: Сохранён всеобщий запрет на кровь перечисленных животных без дополнительных ограничений.
  alternative: Уточнить запрет как относящийся только к крови, выпитой отдельно, или к мясу с кровью.
  rationale: Исходный текст таких уточнений не содержит, поэтому перевод не сужает и не расширяет предписание.
- issue: Суд над человеком и его потомством
  choice: Формулировка «да будет искоренён с земли — и он, и его потомство» сохранена без смягчения.
  alternative: Передать как простое изгнание или смерть только самого нарушителя.
  rationale: Исходный текст прямо включает нарушителя и его семя и использует сильный образ искоренения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «во все дни земли» сохранён, поскольку он присутствует в обеих частях исходного текста и подчёркивает непрерывность установления.
