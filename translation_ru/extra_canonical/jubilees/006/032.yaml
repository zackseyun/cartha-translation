  naturalness: 'Текст в основном литературен, но «нарушат все свои сроки» двусмысленно: по-русски это может означать не соблюсти сроки, а не расстроить календарные времена. «Приведут в расстройство все их времена» ясно выражает активное воздействие и остаётся естественным.'
