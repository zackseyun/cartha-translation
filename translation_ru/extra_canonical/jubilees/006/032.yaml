  yaml_path: translation/extra_canonical/jubilees/006/032.yaml
  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: ru
  text: Но если они преступят и не будут соблюдать их согласно Его повелению, тогда они приведут в расстройство все их времена[a], и годы отклонятся от этого порядка, и они преступят свои установления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть установленные календарные времена или сроки.
    reason: Поясняет календарный смысл «времена» и активное значение глагола без внесения альтернативного чтения.
lexical_decisions:
- source_word: ተዐደዉ
  choice: преступят установления
  rationale: Глагол выражает нарушение или преступление предписанной границы; дополнение добавлено по смыслу контекста и заключительного «их установления».
- source_word: ወኢገብርዎን
  choice: и не будут соблюдать их
  rationale: Отрицательная форма с объектным суффиксом женского рода множественного числа указывает на «их», а в контексте означает исполнение или соблюдение установлений.
- source_word: ያማስኑ
  choice: нарушат
  rationale: 'Активная каузативная форма: нарушители воздействуют на сроки, приводя их в расстройство; сохранён активный залог.'
- source_word: ጊዜያቲሆሙ
  choice: свои сроки
  rationale: «Сроки» естественно передаёт установленные календарные времена; возвратное «свои» соотносит их с субъектом.
- source_word: ይትሐወሱ
  choice: собьются
  rationale: Передаёт идею смещения и смешения годов относительно установленного порядка без чрезмерно буквального оборота.
- source_word: ሥርዐቶሙ
  choice: свои установления
  rationale: Существительное обозначает порядок, устав или предписание; во множественном контекстуальном значении «установления» сохраняет связь с их нарушением.
theological_decisions:
- issue: Референт местоимения в «не будут соблюдать их»
  choice: Сохранено множественное число «их»
  alternative: «не будут соблюдать его» — о единственном повелении или порядке
  rationale: Объектный суффикс в ወኢገብርዎን грамматически поддерживает женский род множественного числа; неоднозначность референта отмечена сноской.
- issue: Агент нарушения сроков
  choice: Люди активно «нарушат все свои сроки»
  alternative: «все их сроки нарушатся»
  rationale: Форма ያማስኑ активная и каузативная, поэтому нельзя без основания превращать её в пассив.
- issue: Скобочная повторная фраза в издании
  choice: Не включена в основной текст
  alternative: 'Повторить: «и сроки нарушатся, и годы собьются»'
  rationale: Фраза в источнике заключена редактором в квадратные скобки и, вероятно, представляет вторичное повторение; основной ход высказывания остаётся полным без неё.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего установительного текста. Формулировка остаётся ясной для широкого читателя; активный залог и календарная терминология исходника сохранены. Заглавная буква в «Его» указывает на Бога по ближайшему контексту, не добавляя конфессиональной интерпретации.
