  - severity: medium
    issue: «Тринадцать недель, одна за другой» неточно передаёт отношение между памятными днями.
    rationale: Русское «одна за другой» обычно описывает последовательные единицы, а исходное выражение в данном календарном контексте говорит о тринадцатинедельных интервалах от одной памятной даты к другой.
