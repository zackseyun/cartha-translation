  naturalness: Предлагаемая редакция сохраняет сжатый торжественный регистр, но яснее связывает тринадцатинедельные промежутки с последовательностью от первого памятного дня до четвёртого.
  terminology: «Праздники», «памятные дни», «установление» и «небесные скрижали» уместны в современном литературном русском и передают исходную лексику без конфессионального переосмысления.
  issues:
