- from: 'Для праздников и вечных памятных дней — таково их установление. На небесных скрижалях записаны тринадцать недель, одна за другой, для их памятных дней: от первого до второго, от второго до третьего и от третьего до четвёртого.[a]'
  to: 'Для праздников и памятных дней навеки таково их установление. На небесных скрижалях записаны тринадцать недель между каждыми двумя из этих памятных дней: от первого до второго, от второго до третьего и от третьего до четвёртого.[a]'
