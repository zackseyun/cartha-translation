base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: ru
  text: 'Для праздников и памятных дней навеки таково их установление. На небесных скрижалях записаны тринадцать недель между каждыми двумя из этих памятных дней: от первого до второго, от второго до третьего и от третьего до четвёртого.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тринадцать недель, одна от другой»; выражение указывает на равные промежутки между памятными днями.'
    reason: Сохраняет формальную особенность исходного выражения и поясняет выбранную в основном тексте передачу календарных интервалов.
lexical_decisions:
- source_word: ለበዓላት፡ ለተዝካር፡ እስከ፡ ለዓለም
  choice: Для праздников и вечных памятных дней
  rationale: Сохраняет назначение установления и идею непреходящего памятования; «памятные дни» естественнее по-русски, чем отвлечённое «воспоминания».
- source_word: ሥርዓት
  choice: установление
  rationale: Передаёт норму или установленный порядок без излишне конфессионального оттенка слова «устав».
- source_word: ጽላት፡ ሰማይ
  choice: небесные скрижали
  rationale: Устойчивый и достойный русский эквивалент образа небесных таблиц.
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት
  choice: тринадцать недель
  rationale: В данном календарном контексте ሰንበታት обозначает недели, а не отдельные субботы.
- source_word: አሐቲ፡ አሐቲ፡ እምኔሆን
  choice: одна за другой
  rationale: Естественно выражает последовательность равных тринадцатинедельных промежутков.
theological_decisions:
- issue: Временная форма записи на небесных скрижалях
  choice: записаны
  alternative: были записаны / записываются
  rationale: Русская краткая страдательная форма без явной прошедшей связки передаёт наличное, сохраняющее силу состояние записи и не сводит значение ни только к прошлому акту, ни к продолжающемуся процессу.
- issue: Связь тринадцати недель с четырьмя памятными днями
  choice: последовательные промежутки от первого до четвёртого
  alternative: тринадцать недель, каждая отдельно
  rationale: Контекст и синтаксис указывают на интервалы между четырьмя памятными точками календаря; перевод сохраняет эту структуру, не уточняя природу самих праздников сверх текста стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («скрижали»). Синтаксис упрощён для ясности, при этом сохранены календарная последовательность и неоднозначность временной формы записи.
