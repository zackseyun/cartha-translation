  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: ru
  text: И обонял Господь приятное благоухание и заключил с ним завет, что впредь воды потопа не будут уничтожать землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጼነወ
  choice: обонял
  rationale: Формально передаёт чувственный образ исходного глагола «обонять, чувствовать запах», не ослабляя антропоморфизм.
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычное и торжественное русское соответствие божественному наименованию в данном контексте.
- source_word: መዐዛ፡ ሠናየ
  choice: приятное благоухание
  rationale: Передаёт сочетание «добрый/приятный аромат» естественным современным русским библейским выражением.
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ
  choice: заключил с ним завет
  rationale: Идиоматически передаёт действие установления завета с Ноем, сохраняя явно выраженное «с ним».
- source_word: ኢይኩን፡ ማየ፡ አይኅ
  choice: впредь воды потопа не будут
  rationale: Отрицательная конструкция передана как обещание о будущем; «впредь» естественно выражает неповторение бедствия.
- source_word: ዘያማስን፡ ምድረ
  choice: уничтожать землю
  rationale: Сохраняет сильное значение причинения гибели или разорения и объект «землю» без уточнения масштаба.
theological_decisions:
- issue: Антропоморфное описание восприятия Богом запаха
  choice: 'сохранено буквально: «обонял Господь»'
  alternative: «Господь ощутил приятное благоухание»
  rationale: Исходный текст прямо описывает обоняние; смягчение могло бы скрыть образность и богословское напряжение.
- issue: Объём заветного обещания
  choice: «воды потопа не будут уничтожать землю»
  alternative: «никогда больше не будет потопа, уничтожающего землю»
  rationale: Выбранная формулировка следует структуре исходного текста и не вводит дополнительных уточнений о всяком возможном потопе.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис ясен для широкого читателя; антропоморфизм и формула завета сохранены без конфессиональных добавлений.
