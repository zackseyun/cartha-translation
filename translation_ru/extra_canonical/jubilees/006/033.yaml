  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: ru
  text: И все сыны Израиля забудут и не найдут пути лет; они забудут новомесячия, установленные времена и субботы и будут ошибаться во всём порядке лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: сыны Израиля
  rationale: Традиционное и естественное для библейского регистра обозначение всего народа Израиля.
- source_word: ፍኖተ፡ ዓመታት
  choice: путь лет
  rationale: Сохраняет конкретную метафору источника и её связь с правильным календарным счётом.
- source_word: ሠርቀ
  choice: новомесячия
  rationale: В данном календарном контексте слово обозначает начала лунных месяцев, а не просто явление новой луны.
- source_word: ጊዜ
  choice: установленные времена
  rationale: Передаёт не только общее значение «времена», но и контекстуальный смысл назначенных календарных или праздничных сроков, не уточняя их сверх источника.
- source_word: ሰንበተ
  choice: субботы
  rationale: Прямое соответствие календарно-религиозному термину источника.
- source_word: ኵሎ፡ ሥርዐተ፡ ዘዓመታት
  choice: весь порядок лет
  rationale: Сохраняет представление о целостном устройстве годового календаря.
- source_word: ይጌግዩ
  choice: собьются
  rationale: Естественно выражает уклонение или ошибку в соблюдении и исчислении календарного порядка.
theological_decisions:
- issue: Значение календарных «времён»
  choice: установленные времена
  alternative: праздники / сроки
  rationale: Формулировка сохраняет возможный празднично-календарный смысл, но не сводит более широкое слово исключительно к праздникам.
- issue: Характер «пути лет»
  choice: сохранить метафору буквально
  alternative: правильный счёт лет / календарь
  rationale: Источник говорит о «пути лет»; буквальная метафора сохраняет образ и не устраняет возможную богословскую идею установленного порядка времени.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён для ясности, однако ключевые календарные термины и метафора «пути лет» сохранены.
