    rationale: «Собьются во всём порядке лет» может означать утрату ориентации, тогда как оригинал и английский audit trail выражают ошибку/уклонение относительно всего порядка лет. Формулировка «будут ошибаться во всём порядке лет» сохраняет эту связь и естественнее по-русски.
  revised_text: И все сыны Израиля забудут и не найдут пути лет; они забудут новомесячия, установленные времена и субботы и будут ошибаться во всём порядке лет.
