  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: ru
  text: 'И в новолуние третьего месяца он вышел из ковчега и построил жертвенник на той горе. Он совершил искупление за землю: взял молодого козла и его кровью искупил всю вину земли, потому что всё, что было на ней, погибло, кроме тех, кто находился в ковчеге вместе с Ноем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: в новолуние третьего месяца
  rationale: Оборот обозначает начало месяца, то есть новолуние; такая передача естественна по-русски и сохраняет календарную точность.
- source_word: ምሥዋዐ
  choice: жертвенник
  rationale: Обычное библейское соответствие для алтаря, воздвигнутого для жертвоприношения.
- source_word: አስተስረየ
  choice: совершил искупление / искупил
  rationale: Повторяющийся культовый глагол передан единообразно через «искупление», без ослабления его ритуально-богословского смысла.
- source_word: መሐስአ፡ ጠሊ
  choice: молодого козла
  rationale: Передаёт название жертвенного животного в соответствии с лексическим смыслом исходного выражения.
- source_word: አበሳ፡ ምድር
  choice: всю вину земли
  rationale: «Вина» сохраняет нравственно-культовую неоднозначность термина; родительный оборот не уточняет насильственно, виновна ли сама земля или речь о совершённом на ней.
- source_word: ተደምሰሰ
  choice: погибло
  rationale: В контексте потопа естественно выражает полное уничтожение жившего на земле, не создавая ненужной буквальной тяжеловесности.
theological_decisions:
- issue: Искупление, совершаемое за землю
  choice: сохранить буквальный объект «за землю»
  alternative: «очистил землю» или «искупил грехи живших на земле»
  rationale: Исходный текст прямо связывает искупительное действие с землёй; более разъясняющие варианты сняли бы присущую тексту богословскую напряжённость.
- issue: Значение «вины земли»
  choice: «всю вину земли»
  alternative: «все грехи, совершённые на земле»
  rationale: Выбранная формулировка сохраняет олицетворение земли и не вводит отсутствующего в источнике толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён там, где это улучшает ясность, но культовая терминология и неоднозначность отношений между искуплением, кровью и землёй сохранены.
