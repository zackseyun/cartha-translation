  source_fidelity: Начальный союз «И» верно передаёт Geʿez ወ. Конструкция «будут те, кто» сохраняет экзистенциально-проспективный смысл. «Станет внимательно наблюдать» адекватно передаёт усиленное выражение о совершении наблюдений; причинный союз и женское соотнесение «она» сохранены. «Искажает времена» передаёт сильную отрицательную семантику ታማስን, не сужая ጊዜያተ до времён года.
