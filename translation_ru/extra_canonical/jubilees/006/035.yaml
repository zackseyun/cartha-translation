  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: ru
  text: И будут те, кто станет внимательно наблюдать за луной[a], потому что она искажает времена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за месяцем»; соответствующее слово означает как луну, так и месяц.'
    reason: Сохранение лексической двусмысленности ወርኀ в календарном контексте.
lexical_decisions:
- source_word: ወይከውኑ፡ እለ
  choice: И будут те, кто
  rationale: Начальное ወ передано союзом «и», а конструкция существования с относительным оборотом — естественным русским «будут те, кто».
- source_word: ያስተሐይጹ፡ ወርኀ፡ በሑያጼ
  choice: станет внимательно наблюдать за луной
  rationale: Сочетание глагола наблюдения с однокоренным существительным выражает усиленное или старательное наблюдение; по-русски это естественно передаётся наречием «внимательно». ወርኀ допускает значения «луна» и «месяц», но контекст наблюдения благоприятствует «луне».
- source_word: እስመ
  choice: потому что
  rationale: Передаёт явно причинную связь.
- source_word: ታማስን፡ ይእቲ፡ ጊዜያተ
  choice: она искажает времена
  rationale: Женское местоимение соотнесено с луной; сильное значение глагола сохранено как «искажает», а ጊዜያተ оставлено широким «времена», без добавления отсутствующего в тексте уточнения.
theological_decisions:
- issue: Оценка лунного счёта времени
  choice: Сохранена резкая формулировка «искажает времена».
  alternative: «нарушает времена» или «сбивает времена года»
  rationale: Исходный глагол имеет сильное значение порчи или искажения; смягчение ослабило бы полемическую направленность текста, а «времена года» чрезмерно сузило бы многозначное ጊዜያተ.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно, при этом сохраняет календарную терминологическую неоднозначность и сильную отрицательную оценку исходного текста.
