lexical_decisions:
- source_word: በዓል
  choice: праздник
  rationale: Обычное и контекстуально точное обозначение установленного праздника.
- source_word: ቍሩጽ
  choice: установлено
  rationale: В данном предписывающем контексте передаёт смысл определённого, постановленного порядка естественнее, чем буквальное «высечено».
- source_word: ግብራ / ትግበራ / ይግበርዋ
  choice: совершай / совершал / совершали
  rationale: Повторяющийся глагол относится к соблюдению и совершению праздника; единая русская лексема сохраняет этот повтор.
- source_word: ዝክራነ
  choice: напоминанием
  rationale: Сохраняет значение памятного установления, не уточняя без основания, кому или о чём оно должно напоминать.
- source_word: ውስተ
  choice: в…
  rationale: Предлог завершает данный стих и синтаксически связан с началом следующего; оборванность сохранена на границе стихов.
theological_decisions:
- issue: Характер праздничных жертв как «напоминания»
  choice: чтобы они служили напоминанием
  alternative: чтобы они были памятными жертвами
  rationale: Выбранный вариант не добавляет специального культового значения сверх исходного текста и сохраняет смысловую открытость.
- issue: Завершение фразы на границе стихов
  choice: сохранить незавершённое «в…»
  alternative: дополнить словами из следующего стиха или выражением «из рода в род»
  rationale: Геэзский текст данного стиха заканчивается предлогом, продолжающимся в стихе 23; добавление «из рода в род» не подтверждается источником.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан ясным для широкого читателя; повтор глагола «совершать» сохранён как важная связь между повелением, записью в законе и исполнением Израилем.
