  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: ru
  text: 'Ибо[a] этот праздник совершай, как о нём написано и установлено. Ибо я написал в книге первого закона то, что написал для тебя: совершать его в назначенное время — один день в году. И о его жертвах я рассказал тебе, чтобы они служили напоминанием и чтобы сыны Израиля совершали его в…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В печатном тексте первое слово неясно; перевод следует рукописному чтению «ибо».
    reason: textual_variant
  - marker: b
    text: Предложение продолжается в стихе 23.
