  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: ru
  text: А вы плодитесь и размножайтесь на земле, станьте многочисленными на ней и будьте для неё благословением. Страх и трепет перед вами Я наведу на всё, что на земле и в море.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: плодитесь и размножайтесь
  rationale: Передаёт традиционную формулу благословения и повеления, сохраняя различие между плодоношением и умножением.
- source_word: ወብዙኁ፡ ላዕሌሃ
  choice: станьте многочисленными на ней
  rationale: Сохраняет отдельный, усиливающий элемент исходного текста после «размножайтесь».
- source_word: ወኩኑ፡ ለበረከት፡ ላዕሌሃ
  choice: и будьте для неё благословением
  rationale: Естественно передаёт конструкцию со значением благотворного присутствия людей на земле, не сливая её с предыдущими повелениями.
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: страх и трепет перед вами
  rationale: Сохраняет парное усиление исходного текста и по-русски ясно обозначает объект страха.
- source_word: እሁብ፡ ዲበ
  choice: Я наведу на
  rationale: Передаёт буквальное «дам/положу на» естественным русским оборотом применительно к страху и трепету.
theological_decisions:
- issue: Связь человечества с землёй в выражении о благословении
  choice: «будьте для неё благословением»
  alternative: «будьте благословенны на ней»
  rationale: Геэзская конструкция и консультационный английский текст поддерживают понимание людей как благословения для земли; выбранный вариант не превращает эту фразу лишь в обещание благословения людям.
- issue: Объём выражения «всё, что на земле и в море»
  choice: сохранить обобщённую формулировку
  alternative: уточнить «все животные на земле и в море»
  rationale: Исходный текст выражается обобщённо; добавление «животные» сняло бы формальную широту текста без прямого лексического основания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан плавным и понятным, при этом сохранены повтор и торжественная последовательность повелений. Заглавное «Я» обозначает речь Бога в соответствии с русской издательской традицией.
