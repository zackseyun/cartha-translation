base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: ru
  text: Ибо я знаю и отныне возвещу тебе — не от своего сердца, ведь передо мной написана книга, и на небесных скрижалях установлено разделение дней[a], — чтобы они не забыли праздников завета и не следовали праздникам народов в их заблуждении и неведении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разделение времён».'
    reason: Слово буквально означает «дни», но в календарном контексте выражение может пониматься шире — как установленное деление времён.
lexical_decisions:
- source_word: አየድዐከ
  choice: возвещу тебе
  rationale: Передаёт каузативное значение «дам тебе знать, сообщу тебе» естественным и достойным русским выражением.
- source_word: መጽሐፍ፡ ጽሑፍ
  choice: написана книга
  rationale: Сохраняет явное сочетание существительного «книга» и значения «написана», не сводя его к более общему «писание».
- source_word: ተሠርዐ
  choice: установлено
  rationale: В данном контексте глагол обозначает установленный, предписанный порядок, записанный на небесных скрижалях.
- source_word: ክፋሌሁ፡ ለመዋዕል
  choice: разделение дней
  rationale: Сохраняет буквальное значение መዋዕል «дни» и календарный акцент книги; «разделение» передаёт распределение дней по установленному порядку.
- source_word: የሐውሩ፡ በበዓላት፡ አሕዛብ
  choice: следовали праздникам народов
  rationale: Буквальный образ «ходить в/по праздникам» естественно передаётся по-русски как соблюдение чужого праздничного порядка.
theological_decisions:
- issue: Источник откровения говорящего
  choice: «не от своего сердца»
  alternative: «не по собственному разумению»
  rationale: Сохранён телесно-образный язык источника и противопоставление личного измышления небесной записи, без конфессионального истолкования.
- issue: Календарное выражение መዋዕል
  choice: «дней»
  alternative: «времён»
  rationale: Буквальное «дней» важно для календарной проблематики Книги Юбилеев; вариант «времён» оставлен в примечании как возможное контекстуальное понимание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («возвещу», «скрижали», «завет»). Синтаксис сохраняет напряжённую связь между небесной книгой, календарным порядком и предупреждением о праздниках народов, оставаясь понятным современному читателю.
