  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: ru
  text: Поэтому установлено и записано на небесных скрижалях, чтобы они праздновали в этом месяце Праздник недель раз в год — для ежегодного обновления завета.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: установлено
  rationale: Передаёт значение предписания или установления, сохраняя безличную форму оригинала.
- source_word: ጽላተ፡ ሰማይ
  choice: небесных скрижалях
  rationale: Традиционное и понятное библейское обозначение небесных таблиц.
- source_word: በዓል፡ ዘሱባዔ
  choice: Праздник недель
  rationale: Устоявшееся название праздника; прописная буква показывает, что это собственное название.
- source_word: ለሐዲስ፡ ኪዳን
  choice: обновляя завет
  rationale: Передаёт цель или сопутствующее назначение ежегодного празднования без добавления богословского толкования.
- source_word: በኵሉ፡ ዓም፡ ወዓመት
  choice: из года в год
  rationale: Естественно передаёт подчёркнутую ежегодную повторяемость.
theological_decisions:
- issue: Характер небесного предписания
  choice: Сохранена безличная формула «установлено и записано»
  alternative: «Бог установил и записал»
  rationale: В стихе действующее лицо прямо не названо; его не следует добавлять, хотя контекст подразумевает небесный авторитет.
- issue: Смысл обновления завета
  choice: «обновляя завет»
  alternative: «для обновления завета»
  rationale: Обе формулировки возможны; деепричастный оборот естественно связывает обновление завета с ежегодным празднованием, не уточняя сверх текста его точный ритуальный или богословский механизм.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Повтор ежегодности сохранён как смысловой акцент оригинала, но выражен естественно: «один раз в год… из года в год».'
