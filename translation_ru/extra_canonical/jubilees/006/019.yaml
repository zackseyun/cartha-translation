  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: ru
  text: Но только Авраам соблюдал его; Исаак, Иаков и его дети соблюдали его до твоих дней. А в твои дни сыны Израиля забыли его, пока Я не восстановил его для них на этой горе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  choice: один Авраам
  rationale: Передаёт усилительное значение «Авраам один / только Авраам», естественно сохраняя порядок и акцент исходного текста.
- source_word: ዐቀበ / ዐቀብዋ
  choice: соблюдал / соблюдали
  rationale: В контексте установления или праздника глагол имеет смысл хранить и исполнять предписание; «соблюдать» наиболее естественно по-русски.
- source_word: ረከቡ
  choice: забыли
  rationale: Следует смыслу, засвидетельствованному данной эфиопской текстовой традицией и контекстом последующего восстановления; буквальная форма в представленном тексте может отражать текстологическую особенность издания.
- source_word: ኀይስክዎሙ
  choice: восстановил его для них
  rationale: Передаёт возобновление забытого установления без добавления конфессиональной интерпретации.
- source_word: በኀበዝ፡ ደብር
  choice: на этой горе
  rationale: Дейктическое выражение указывает на гору, где происходит откровение; современная русская формулировка сохраняет эту отсылку.
theological_decisions:
- issue: Неявный референт местоимения «его»
  choice: Сохранить местоимение без поясняющей вставки
  alternative: Назвать праздник или установление прямо
  rationale: Стих зависит от ближайшего контекста; конкретизация внутри стиха устранила бы присущую оригиналу анафорическую связь и могла бы навязать толкование.
- issue: Субъект восстановления
  choice: «Я» с прописной буквы
  alternative: «я» со строчной буквы
  rationale: Говорящий в контексте — Бог; прописная буква соответствует достоинству современного русского библейского регистра, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Сыны Израиля» сохранено как устойчивое историко-библейское обозначение; синтаксис сделан ясным, при этом повтор местоимения «его» удерживает зависимость стиха от контекста.
