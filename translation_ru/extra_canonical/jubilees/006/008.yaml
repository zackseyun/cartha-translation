  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: ru
  text: Кто прольёт кровь человека, того кровь будет пролита человеком, потому что Бог сотворил человека по Своему подобию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Адама».'
    reason: Форма ለአዳም допускает прочтение имени собственного, хотя в данном контексте вероятнее родовое значение «человек».
lexical_decisions:
- source_word: ዘይከዑ፡ ደመ፡ ሰብእ
  choice: Кто прольёт кровь человека
  rationale: Передаёт условно-относительную конструкцию и сохраняет повтор ключевого слова «кровь».
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው
  choice: того кровь будет пролита человеком
  rationale: 'Сохраняет пассив исходного текста и инструментальное значение предлога: воздаяние совершается человеком.'
- source_word: በምስለ፡ እግዚአብሔር
  choice: по Своему подобию
  rationale: Местоимение естественно указывает на Бога как на обладателя подобия; «подобие» формально соответствует ምስል.
- source_word: ገብሮ፡ ለአዳም
  choice: Бог сотворил человека
  rationale: Форма ለአዳም в контексте цитаты Бытия 9:6 обозначает человека как род, а не обязательно собственное имя Адам; подлежащее «Бог» выражено в предшествующем обороте и восстановлено для ясности по-русски.
theological_decisions:
- issue: 'Значение አዳም: родовое обозначение или имя собственное'
  choice: человека
  alternative: Адама
  rationale: Контекст связывает запрет кровопролития с богоподобием всякого человека; при этом подлинная лексическая возможность имени отмечена в сноске.
- issue: Образ или подобие Бога
  choice: подобию
  alternative: образу
  rationale: Геэзское ምስል здесь прямо означает «подобие»; не следует без необходимости заменять его более привычной формулой русского текста Бытия.
translation_notes:
  register: Современный литературный русский язык с dignified библейской ритмикой. Синтаксический параллелизм исходного изречения сохранён; архаизмы и конфессионально окрашенные уточнения не вводились.
