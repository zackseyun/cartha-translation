  yaml_path: translation/extra_canonical/jubilees/006/010.yaml
  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: ru
  text: И Ной и его сыновья поклялись, что не будут есть никакой крови, находящейся в какой бы то ни было плоти; и он заключил завет пред Господом Богом навеки, во всех поколениях земли, в этом месяце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወመሐኩ
  choice: И поклялись
  rationale: Форма передаёт клятву; множественное число естественно согласуется с составным подлежащим «Ной и его сыновья».
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ፡ ዘበኵሉ፡ ሥጋ
  choice: не есть никакой крови, которая во всякой плоти
  rationale: Сохранены всеобщие выражения источника и библейское представление о крови, находящейся в плоти, без сведения смысла лишь к «мясу с кровью».
- source_word: ወተካየደ፡ ኪዳነ
  choice: и он заключил завет
  rationale: Устойчивое современное русское сочетание точно передаёт учреждение завета; единственное число сказуемого сохранено вслед за формой источника.
- source_word: ቅድመ፡ እግዚአብሔር፡ አምላክ
  choice: пред Господом Богом
  rationale: Буквально и торжественно передаёт «перед Господом Богом»; источник не содержит собственного имени Яхве.
- source_word: ለዓለም፡ በኵሉ፡ ትውልደ፡ ምድር
  choice: навеки, для всех поколений земли
  rationale: 'Сохраняет оба временно-всеобщих элемента текста: вечность завета и охват всех поколений земли.'
theological_decisions:
- issue: Кто заключил завет после общей клятвы
  choice: «он заключил завет»
  alternative: «они заключили завет»
  rationale: Сохранено грамматическое единственное число источника и его возможная отсылка к Ною, а не устранена посредством согласования по смыслу.
- issue: Характер запрета крови
  choice: «не есть никакой крови, которая во всякой плоти»
  alternative: «не есть мяса с кровью»
  rationale: Выбранное чтение не сужает прямой запрет употребления крови и сохраняет формулировку источника.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Пред» поддерживает торжественный регистр, оставаясь понятным; синтаксис слегка упрощён для ясности, но повтор всеобщности источника сохранён.
