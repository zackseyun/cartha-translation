revisions:
- from: И поклялись Ной и его сыновья не есть никакой крови, которая во всякой плоти; и он заключил завет пред Господом Богом навеки, для всех поколений земли, в этом месяце.
  to: И Ной и его сыновья поклялись, что не будут есть никакой крови, находящейся в какой бы то ни было плоти; и он заключил завет пред Господом Богом навеки, во всех поколениях земли, в этом месяце.
  rationale: Правка ограничена улучшением естественности русского синтаксиса и более прямой передачей всеобщих выражений источника. Единственное число «он заключил» намеренно сохранено, поскольку геэзская форма допускает отсылку именно к Ною; двусмысленность не устранена.
