lexical_decisions:
- source_word: ወባቲ
  choice: И в тот день
  rationale: Форма буквально допускает значение «и в тот/в него»; по контексту временной отсылки естественное русское соответствие — «в тот день», без тяжеловесного «в него».
- source_word: የብሰት
  choice: высохла
  rationale: Передаёт завершившееся иссушение земли естественным русским глаголом.
- source_word: ሠርቀ፡ ወርኅ
  choice: новолуние
  rationale: Буквально выражение связано с восходом/появлением луны и обозначает начало лунного месяца; «новолуние» сохраняет календарный образ источника.
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: устья глубин нижней бездны
  rationale: Сохранена образная анатомическая метафора «устья» и цепочка родительных отношений, не сводя её к более истолковывающему «источники».
- source_word: ተርኅወ
  choice: открылись
  rationale: Явно передан имеющийся в геэзском тексте глагол; пассивно-возвратная русская форма естественно соответствует форме источника.
theological_decisions:
- issue: Образ космических вод и бездны
  choice: Сохранить «устья глубин нижней бездны»
  alternative: «источники подземной бездны»
  rationale: Более буквальный образ не навязывает современную геологическую или конфессиональную интерпретацию древней космологии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но образность и незавершённость исходного фрагмента сохранены.
