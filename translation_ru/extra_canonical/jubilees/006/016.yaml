  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: ru
  text: Он поместил радугу в облаке как знамение вечного завета, чтобы впредь не было на земле вод потопа, чтобы уничтожить её, во все дни земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: радугу
  rationale: Буквально слово означает «лук», однако в контексте небесного знамения завета речь идёт о радуге; такой выбор естественен по-русски и сохраняет образ.
- source_word: ወሀበ ውስተ ደመና
  choice: поместил ... в облаке
  rationale: Передаёт действие установления или помещения знамения в облаке без излишнего уточнения способа.
- source_word: ለትእምርተ ኪዳን ዘለዓለም
  choice: как знамение вечного завета
  rationale: Прямо сохраняет лексику знамения, завета и вечности.
- source_word: ማየ አይኅ
  choice: воды потопа
  rationale: Соответствует составному выражению «воды потопа» и связи с повествованием о потопе.
- source_word: ለአማስኖታ
  choice: не уничтожали её
  rationale: Глагол выражает гибельное уничтожение; местоимение относится к земле.
- source_word: ኵሎ መዋዕለ ምድር
  choice: во все дни земли
  rationale: Сохраняет характерную временную формулу источника, не заменяя её толкованием «пока существует земля».
theological_decisions:
- issue: Принадлежность радуги
  choice: Свою радугу
  alternative: радугу
  rationale: Притяжательное местоимение делает по-русски ясным, что знак установлен Богом, и соответствует смыслу выражения «его лук», отражённому в консультационном тексте.
- issue: Объём обещания после потопа
  choice: чтобы впредь воды потопа не покрывали землю и не уничтожали её
  alternative: чтобы на земле больше никогда не было вод потопа, уничтожающих всё
  rationale: Формулировка сохраняет направленность обещания на землю и избегает добавления универсального «всё», которое в геэзском тексте может пониматься через землю как объект уничтожения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («знамение», «завет»). Формула «во все дни земли» намеренно сохранена ради образности и близости к источнику.
