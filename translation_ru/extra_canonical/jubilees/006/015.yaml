  text: And he gave Noah and his sons a sign that there should never again be a flood upon the earth.
translation:
  language: ru
  text: И Он дал Ною и его сыновьям знамение, что потопа на земле больше не будет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእምርተ
  choice: знамение
  rationale: Передаёт значение «знак, знамение» и сохраняет возвышенный библейский регистр.
- source_word: ዳግመ
  choice: больше не будет
  rationale: В сочетании с отрицанием естественно передаёт смысл «вновь, ещё раз» без излишне буквального оборота.
- source_word: አይኅ
  choice: потоп
  rationale: Контекстуально обозначает всемирный потоп в повествовании о Ное.
- source_word: ዲበ፡ ምድር
  choice: на земле
  rationale: Прямое и естественное соответствие пространственному выражению исходного текста.
theological_decisions:
- issue: Референт местоимения в начале стиха
  choice: Он
  alternative: Бог
  rationale: Исходный текст использует местоименную форму; сохранение местоимения не добавляет отсутствующего в стихе имени и опирается на контекст.
- issue: Сила отрицания будущего потопа
  choice: потопа на земле больше не будет
  alternative: никогда больше не будет потопа на земле
  rationale: Формулировка передаёт сочетание отрицания и «снова», не усиливая его добавочным словом «никогда», которого формально нет в данном тексте.
