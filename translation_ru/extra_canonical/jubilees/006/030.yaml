  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: ru
  text: Все дни заповедей составляют пятьдесят две недели дней, и все они образуют полный год. Так начертано и установлено на небесных скрижалях, и ни один год не должен быть пропущен — из года в год.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዛት
  choice: заповедей
  rationale: Форма множественного числа; перевод сохраняет морфологическое число и нормативный смысл слова.
- source_word: ፶ምሳ፡ ወክልኤ፡ ሰንበታት፡ መዋዕል
  choice: пятьдесят две недели дней
  rationale: Сохранён явный счёт недель и буквальное уточнение «дней», важное для календарного контекста.
- source_word: ዓመት፡ ፍጹም
  choice: полный год
  rationale: Передаёт идею завершённого, целого годового цикла.
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: начертано и установлено
  rationale: 'Сохраняет порядок исходных глаголов: сначала запись/начертание, затем установление; пассивная форма соответствует источнику.'
- source_word: ጽላት፡ ሰማይ
  choice: небесных скрижалях
  rationale: Традиционное и понятное русское обозначение небесных табличек в сакральном контексте.
- source_word: አልቦ፡ ተዐድዎ
  choice: нельзя пропустить
  rationale: В данном календарном контексте выражение означает недопустимость упущения или несоблюдения года, а не обязательно сознательное преступление.
- source_word: ወዓመ፡ እምዓም
  choice: из года в год
  rationale: Естественный русский эквивалент повторяющейся последовательности лет.
theological_decisions:
- issue: Нормативный характер календаря
  choice: «начертано и установлено на небесных скрижалях»
  alternative: «высечено и предписано на небесных скрижалях»
  rationale: Выбранная формулировка сохраняет небесное закрепление календарного порядка, не усиливая текст до более узкого значения юридического предписания.
- issue: Характер нарушения годового счёта
  choice: «нельзя пропустить ни одного года»
  alternative: «нельзя преступить ни одного года»
  rationale: «Пропустить» лучше соответствует непосредственному календарному контексту и не вносит дополнительной морально-правовой окраски.
translation_notes:
  register: Современный литературный русский с достоинством сакрального текста. Сохранена несколько необычная формула «пятьдесят две недели дней», поскольку она подчёркивает календарную арифметику источника; синтаксис слегка сглажен для ясности без устранения смысловой напряжённости.
