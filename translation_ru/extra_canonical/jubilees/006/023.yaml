  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: ru
  text: 'для их поколений: в этом месяце[a] — один день в каждом году. Новолуния первого, четвёртого, седьмого и десятого месяцев — дни памятования и дни сроков в четырёх частях года; они записаны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «этот месяц».'
    reason: Синтаксис начального фрагмента, продолжающего предыдущий стих, допускает понимание без предлога «в».
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: для их поколений
  rationale: Передаёт вероятное значение формы, соответствующей «их поколениям / для их поколений», и сохраняет связь с предшествующим стихом.
- source_word: በሠርቀ፡ ወርኅ
  choice: новолуния
  rationale: Буквально выражение связано с появлением, или восходом, месяца; в календарном контексте естественный русский эквивалент — «новолуние».
- source_word: ዕለታት፡ ተዝካር
  choice: дни воспоминания
  rationale: Сохраняет прямое значение памятного воспоминания, не уточняя его культовую функцию сверх источника.
- source_word: ዕለታት፡ ጊዜ
  choice: дни, отмечающие времена
  rationale: Передаёт широкое значение ጊዜ («время, срок, период») и ясно связывает эти дни с календарными рубежами.
- source_word: አርባዕቱ፡ መክፈላት፡ ዓመት
  choice: четыре части года
  rationale: Прямая и понятная передача четырёх делений года без навязывания более специального календарного термина.
theological_decisions:
- issue: Характер календарных дней
  choice: «дни воспоминания и дни, отмечающие времена»
  alternative: «памятные дни и дни установленных времён»
  rationale: Источник называет их днями памяти и времени, но прямо не вводит понятие божественно «установленных» сроков; перевод не добавляет отсутствующей квалификации.
- issue: Заключительное утверждение
  choice: «они записаны»
  alternative: «они записаны и установлены»
  rationale: В данном тексте присутствует только сказуемое «записаны»; добавление «установлены» не поддерживается источником.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор четырёх однотипных оборотов источника компактно объединён в перечисление без потери содержания; зависимое начало стиха сохранено со строчной буквы, поскольку оно продолжает предыдущую фразу.
