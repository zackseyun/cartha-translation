  - severity: low
    issue: «Дни, отмечающие времена» отходит от двучленной именной формулы источника.
    rationale: Источник называет эти даты «днями памятования» и «днями/сроками времени». Более близкое «дни памятования и дни сроков» сохраняет параллелизм, не вводя причинно-функциональное толкование «отмечающие».
