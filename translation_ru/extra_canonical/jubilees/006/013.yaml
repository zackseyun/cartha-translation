  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: ru
  text: А ты повели сынам Израиля не есть никакой крови, чтобы их имя и их потомство всегда пребывали пред Яхве, Богом нашим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለደቂቀ፡ እስራኤል
  choice: сынам Израиля
  rationale: Традиционное и понятное обозначение народа Израиля, соответствующее буквальному образу исходного выражения.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ
  choice: не есть никакой крови
  rationale: Сохраняет всеохватный запрет исходного текста; по-русски «есть кровь» естественно в контексте пищевого предписания.
- source_word: ወዘርኦሙ
  choice: и их потомство
  rationale: Передаёт значение «семя, потомки» естественным современным русским словом без утраты родовой перспективы.
- source_word: ቅድመ፡ እግዚአብሔር፡ አምላክነ
  choice: пред Яхве, Богом нашим
  rationale: «Пред» сохраняет торжественный библейский регистр и пространственно-реляционное значение; имя Яхве передаёт божественное имя согласно политике POB.
- source_word: ኵሎ፡ መዋዕለ
  choice: всегда
  rationale: Кратко и естественно передаёт значение «во все дни, всегда».
theological_decisions:
- issue: Связь запрета крови с пребыванием имени и потомства пред Богом
  choice: сохранена целевая конструкция «чтобы»
  alternative: истолковать как причинное следствие или условное обещание
  rationale: Исходный текст формулирует цель или предполагаемый результат, не разъясняя точный богословский механизм; перевод сохраняет эту напряжённость.
- issue: Передача божественного имени
  choice: Яхве
  alternative: Господь
  rationale: Передаёт собственное божественное имя, а не заменяет его титулом, в согласии с проверенным консультационным слоем POB.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «сынам Израиля» и «пред Яхве» сохраняют достоинство и традиционную окраску, оставаясь понятными современному читателю.
