  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: ru
  text: 'как установление для них: один день в году, в этом месяце, пусть они празднуют этот праздник. Ибо это праздник Недель и праздник первых плодов. Он — двух видов и двойной природы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለትእዛዝ፡ ሎሙ
  choice: как заповедь для них
  rationale: Передаёт целевое или нормативное значение выражения, не усиливая его до отдельной формулы закона.
- source_word: በዓለ፡ ሱባዔያት
  choice: праздник Недель
  rationale: Устоявшееся и прозрачное русское название праздника; сохраняет буквальное значение исходного наименования.
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: праздник Первых плодов
  rationale: Формально передаёт название как праздник первых плодов, сохраняя связь с земледельческим приношением.
- source_word: ክልኤ፡ ዐጽፍት፡ ይእቲ፡ ወለክልኤ
  choice: Он — двух видов и двойной природы
  rationale: Сохраняет повторную характеристику двойственности, не сводя два исходных выражения к одному.
theological_decisions:
- issue: Соотношение праздника Недель и праздника Первых плодов
  choice: Представить их как два наименования одного праздника
  alternative: Понять их как два самостоятельных праздника
  rationale: Повтор связки «это» и последующее описание двойственной природы указывают на один праздник с двумя аспектами, при этом формулировка не объясняет их богословское соотношение сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским регистром. Названия праздников оформлены с прописной буквы как официальные наименования. Финальная необычная двойная формула сохранена, поскольку она отражает смысловую напряжённость и повтор исходного текста.
