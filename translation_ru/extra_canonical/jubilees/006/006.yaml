  yaml_path: translation/extra_canonical/jubilees/006/006.yaml
  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: ru
  text: И вот, Я дал вам всех зверей, всё, что летает, всё, что движется по земле, и рыб в водах — всё это Я дал вам в пищу. Подобно зелёным растениям, Я дал вам всё это в пищу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ
  choice: зверей
  rationale: Передаёт собирательное обозначение животных в данном перечне, сохраняя отличие от летающих существ и рыб.
- source_word: ዘይሰርር
  choice: что летает
  rationale: Глагольная форма означает летающих существ; перевод явно сохраняет эту категорию, присутствующую в геэзском тексте.
- source_word: ዘይትሐወስ
  choice: что движется
  rationale: Нейтрально передаёт движение без неоправданного сужения значения до «ползает» или расширения до «живёт».
- source_word: ለሲሲት
  choice: в пищу
  rationale: Естественная русская передача назначения перечисленных существ для еды.
- source_word: ሐምለ፡ ሣዕር
  choice: зелёные растения
  rationale: Понятная современная передача растительной зелени; она сохраняет параллель с данным прежде растительным пропитанием.
- source_word: ትብልዑ
  choice: ешьте
  rationale: Сохраняет прямую форму повеления во множественном числе.
theological_decisions:
- issue: Объём разрешённой пищи
  choice: «всё это вам в пищу» и «Я дал вам всё»
  alternative: Ограничить «всё» только отдельными видами животных
  rationale: Текст выражает всеобъемлющее дарование перечисленных категорий; перевод сохраняет его силу и не вводит отсутствующих здесь ограничений.
- issue: Связь с зелёными растениями
  choice: «Как зелёные растения, Я дал вам всё»
  alternative: «Всё дал вам в пищу, как зелёные растения»
  rationale: Сохранено прямое сопоставление нового дара с прежде данным растительным пропитанием без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Перечень выстроен ясно и ритмично; заглавное «Я» употреблено как принятое в русском библейском стиле обращение Бога о Себе. Подлинная широта слов «всё» и «движется» сохранена без конфессионального уточнения.
