lexical_decisions:
- source_word: መዓምቅተ፡ ምድር
  choice: глубины земли
  rationale: Передаёт буквально сочетание «глубины земли» и сохраняет связь с повествованием о водах потопа.
- source_word: ይረድ፡ ውስቴቱ
  choice: стали стекать в них
  rationale: Глагол выражает движение вниз; «стекать» естественно описывает уход вод в земные глубины, а начальное значение формы передано словом «стали».
- source_word: በሠርቀ፡ ወርኅ
  choice: в новомесячие
  rationale: Выражение обозначает наступление нового месяца, то есть день новолуния/новомесячия; «новомесячие» сохраняет календарный смысл без уточнения лунной фазы сверх текста.
