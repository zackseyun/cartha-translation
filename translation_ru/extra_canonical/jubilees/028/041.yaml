translation:
  language: ru
  text: Она также взяла свою служанку Зелфу и отдала её Иакову в жёны; та зачала и родила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአት፡ ወወሀበት፡
  choice: взяла… и отдала
  rationale: Передаёт последовательность двух перфектных глаголов без сглаживания одного из них.
- source_word: ይእቲኒ፡
  choice: она также
  rationale: Самостоятельное местоимение женского рода с присоединённым значением «также» относится к действующему лицу и подчёркивает параллель с предшествующим поступком.
- source_word: ዜልፋሃ፡
  choice: Зелфу
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: ለአኪታ፡
  choice: свою служанку
  rationale: Естественно передаёт существительное с притяжательным суффиксом третьего лица женского рода.
- source_word: ለያዕቆብ፡ ብእሲተ፡
  choice: Иакову в жёны
  rationale: Сохраняет направление передачи и брачный статус; русское «в жёны» здесь естественнее буквального «как жену».
- source_word: ወፀንሰት፡ ወወለደት፡
  choice: та зачала и родила
  rationale: Оба глагола сохранены; указательное «та» естественно устраняет возможную неясность относительно того, что подлежащее теперь Зелфа.
theological_decisions:
- issue: Статус Зелфы
  choice: в жёны
  alternative: как жену
  rationale: Источник прямо называет её женой; перевод не ослабляет это до наложницы или суррогатной матери и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. Синтаксис краткий и повествовательный; оборот «та зачала» делает смену подлежащего ясной, не добавляя нового содержания.
