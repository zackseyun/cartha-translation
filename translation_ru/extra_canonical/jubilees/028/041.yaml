  source_fidelity: 'Перевод передаёт оба последовательных глагола «взяла и отдала», субъектное значение «она также», обозначение Зелфы как её служанки, передачу Иакову в статусе жены и последующие действия Зелфы: «зачала и родила». «Та» обоснованно и без добавления смысла устраняет смену референта после передачи Зелфы.'
