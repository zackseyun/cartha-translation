  text: Это дело — зло пред Господом. И ты также повели сынам Израиля, чтобы они не…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный текст стиха обрывается после начала отрицательной конструкции: «чтобы они не…».'
