lexical_decisions:
- source_word: እኩይ፡ ዝንቱ፡ ግብር
  choice: Зло это дело
  rationale: 'Передаёт именную конструкцию с вынесенным предикативным прилагательным: «зло это дело», сохраняя акцент исходного порядка слов.'
- source_word: በቅድመ፡ እግዚአብሔር
  choice: пред Господом
  rationale: Традиционное и точное соответствие выражению «перед/пред Богом (Господом)»; «Господом» естественно для русского библейского регистра.
- source_word: ወአንተኒ፡ አዝዝ
  choice: И ты также повели
  rationale: Сохраняет присоединительное «и», усиление «также» и повелительное значение глагола.
- source_word: ለደቂቀ፡ እስራኤል
  choice: сынам Израиля
  rationale: Формально и идиоматично передаёт библейский этноним «дети/сыны Израиля»; выбран устойчивый русский библейский оборот.
- source_word: ወአይ
  choice: чтобы они не…
  rationale: Фрагмент источника обрывается на начале отрицательной зависимой конструкции; многоточие честно обозначает незавершённость без домысливания продолжения.
theological_decisions:
- issue: Передача እግዚአብሔር
  choice: Господом
  alternative: Богом
  rationale: В данном библейском регистре «Господь» является естественным соответствием титулу; контекст не требует конфессионального уточнения.
- issue: Незавершённость предоставленного текста стиха
  choice: Не восстанавливать отсутствующее продолжение
  alternative: Дополнить по иной рукописи или переводу
  rationale: Предоставленный геэзский фрагмент заканчивается на отрицательной частице; добавление содержания без приведённых исходных свидетельств разрешило бы лакуну необоснованно.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «Зло это дело» сохраняет исходный акцент и остаётся понятной; «сынам Израиля» поддерживает традиционный библейский регистр. Лакуна явно отмечена, но не восполнена.
