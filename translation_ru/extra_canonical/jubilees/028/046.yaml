lexical_decisions:
- source_word: ለኃምስ፡ ወርኅ፡
  choice: в пятом месяце
  rationale: Контекстуальное временное значение передано естественной русской конструкцией; буквально-предложная форма геэза здесь обозначает время события.
- source_word: ሱባዔ
  choice: седмина
  rationale: Слово обозначает семилетний период в хронологической системе Книги Юбилеев; «седмина» сохраняет специальный смысл и отличает его от обычной календарной недели.
- source_word: ወወሀበተ፡ ለሐፂኒት።
  choice: И она отдала его кормилице.
  rationale: Женская форма глагола сохранена; адресат передан дательным падежом. Местоимение «его» восстанавливается из контекста, как и в консультационном английском тексте.
- source_word: ወቦአ፡ ያዕቆብ፡ ዳግመ፡
  choice: И Иаков снова вошёл к ней.
  rationale: ዳግመ передано как «снова»; направление «к ней» подразумевается контекстом и делает незавершённую без дополнения русскую фразу понятной, не уточняя характер действия.
