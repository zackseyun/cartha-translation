translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Специальный хронологический термин «седмина» сохранён ради устройства летосчисления книги; синтаксис сделан естественным, а двусмысленность глагола «вошёл» не устранена толкованием.
