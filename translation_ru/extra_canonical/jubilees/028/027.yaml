  text: Leah conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first.
translation:
  language: ru
  text: Лия зачала и родила Иакову второго сына, и он назвал его Симеоном в двадцать первый день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልደ፡ ካልአ፡
  choice: второго сына
  rationale: Буквально «сына второго»; естественный русский порядок слов сохраняет значение.
- source_word: ወጸውዐ፡ ስሞ፡ ስምዖን፡
  choice: и он назвал его Симеоном
  rationale: Глагол ጸውዐ имеет форму 3-го лица мужского рода единственного числа, поэтому субъект передан как «он», то есть Иаков; выражение «назвал его Симеоном» естественно передаёт семитскую формулу наречения имени.
- source_word: አመ፡ ፲ሥራ፡
  choice: двадцать первого числа
  rationale: В данном календарном повествовательном контексте числительное обозначает день месяца; «числа» добавлено для ясного и естественного русского выражения.
theological_decisions:
- issue: Кто дал имя Симеону
  choice: 'Иаков: «он назвал»'
  alternative: 'Лия: «она назвала»'
  rationale: Мужская форма глагола в данном геэзском тексте указывает на мужского субъекта. Это чтение сохранено без гармонизации с повествованием Бытия.
translation_notes:
  register: Современный литературный русский язык; изложение простое и достойное. Начальный союз источника опущен как избыточный при отдельном цитировании стиха. Подлинная мужская форма глагола сохранена.
