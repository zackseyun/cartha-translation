lexical_decisions:
- source_word: ሱባዔ
  choice: седмица
  rationale: Слово обозначает семидневный период; «седмица» сохраняет отличие от следующего буквального выражения «семь дней» и соответствует возвышенному повествовательному регистру.
- source_word: መዋዕለ፡ ... ሰቡዕ፡ ዕለት
  choice: семь дней
  rationale: Передано буквально как указание на полный семидневный срок.
- source_word: ዘግዝአ፡ ዘልያ
  choice: брачного пира Лии
  rationale: По синтаксису и контексту выражение относится к свадебному/брачному празднованию Лии; «брачный пир» естественно передаёт праздничную неделю после заключения брака.
