lexical_decisions:
- source_word: ወአሐዱ፡ ዘወርኅ፡ ዓሥር
  choice: И в первый день десятого месяца
  rationale: Числительное «один» в календарной формуле естественно передаётся порядковым «первый»; союз ወ сохранён.
- source_word: ወበሣልስ፡ ዓመት፡ ለዝ፡ ሱባዔ
  choice: в третий год этой седмины
  rationale: ሱባዔ обозначает семилетний цикл; «седмина» сохраняет специальное хронологическое значение и соответствует возвышенному историческому регистру.
- source_word: ወደገመ፡ ያዕቆብ
  choice: Иаков снова
  rationale: ደገመ передаёт повторность действия; в русском естественный порядок слов требует наречия перед сказуемым.
- source_word: ወቦአ፡ ኀበ፡
  choice: вошёл к…
  rationale: ቦአ означает «войти», а ኀበ вводит направление к лицу или месту. Источник обрывается после предлога, поэтому дополнение не восстанавливается догадочно.
