  text: And he served him for his daughter Rachel one week.
translation:
  language: ru
  text: И он служил ему за его дочь Рахиль одну неделю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть одну неделю лет — семь лет.
    reason: Поясняет хронологический термин Книги Юбилеев, не заменяя буквальную «неделю» истолковывающим переводом «семь лет».
lexical_decisions:
- source_word: ተቀንየ (taqannaya)
  choice: служил
  rationale: Глагол обозначает службу или работу на другого; «служил» точно передаёт форму исходного текста и соответствует контексту службы Иакова Лавану.
- source_word: ወለቱ (walatu)
  choice: его дочь
  rationale: Притяжательный элемент исходного текста прямо называет Рахиль дочерью того, кому он служил; его нельзя опускать.
- source_word: ሱባዔ አሐደ (subāʿē ʾaḥada)
  choice: одну неделю
  rationale: Буквально — «одну седмицу/неделю». Такой перевод сохраняет характерную для Книги Юбилеев систему счёта времени неделями, а сноска поясняет, что здесь подразумевается неделя лет.
