lexical_decisions:
- source_word: በቀዳሚ፡ ዓመት፡
  choice: В первый год
  rationale: Прямо передаёт временную формулу источника и сохраняет её летописную краткость.
- source_word: ዘሱባዔ፡ ራብዕ
  choice: четвёртой седмины
  rationale: «Седмина» обозначает семилетний период в хронологической системе Книги Юбилеев и позволяет отличить его от обычной календарной недели.
- source_word: በዝ፡ ኵሉ፡
  choice: Всё это время
  rationale: Естественная русская передача значения «при/на протяжении всего этого», связывающая чувство Рахили с описанными обстоятельствами.
- source_word: ትቀንዕ፡ በልያ
  choice: ревновала к Лии
  rationale: Сохраняет направленность ревности или зависти Рахили по отношению к Лии; «ревновала к» звучит достойно и соответствует библейскому регистру.
- source_word: እስመ፡ ይእቲ፡ [бесплодна]
  choice: потому что была бесплодна
  rationale: Передаёт причинную заключительную часть стиха согласно засвидетельствованному чтению и контексту; подлежащее по-русски естественно опущено, но однозначно относится к Рахили.
