  text: он возносит на небо грех против самого себя,[a] и никто, кто делает это, не праведен, ибо
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его грех восходит на небо из-за него».'
    reason: Сохраняет альтернативное, непереходное понимание глагола и возможное значение በእንቲአሁ («из-за него», «по его причине»), не изменяя основного каузативного перевода.
lexical_decisions:
- source_word: አበሳ
  choice: грех
  rationale: Передаёт значение вины или греха; в данном контексте естественно сочетается с каузативным глаголом «возносит».
- source_word: ያዐርግ
  choice: возносит
  rationale: Каузативная форма означает «поднимает, заставляет взойти», а не непереходное «восходит».
- source_word: በእንቲአሁ
  choice: против самого себя
  rationale: Контекстуально передаёт направленность вины на самого совершающего поступок, сохраняя возможность более буквального понимания «из-за него» в примечании.
- source_word: ይጸድቅ
  choice: праведен
  rationale: Сохраняет судебно-нравственную лексику корня со значением праведности или оправданности.
- source_word: ዘንተ፡ ነገረ
  choice: это
  rationale: Естественное русское обозначение данного поступка; буквальное «это дело» здесь звучало бы тяжелее.
theological_decisions:
- issue: Связь поступка с праведностью совершающего
  choice: никто, кто делает это, не праведен
  alternative: нет праведника, который делает это
  rationale: Выбранная формулировка яснее выражает оценку всякого совершающего данный поступок и не создаёт впечатления лишь эмпирического утверждения о группе праведников.
- issue: Направленность греха
  choice: грех против самого себя
  alternative: его грех из-за него
  rationale: Основной текст следует контекстуальному пониманию, не устраняя возможную буквальную неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конечное «ибо» сохранено, поскольку стих синтаксически продолжается далее.
