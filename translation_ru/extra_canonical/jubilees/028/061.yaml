lexical_decisions:
- source_word: ወኮነ፡ እምዘ
  choice: И было после того, как
  rationale: Сохраняет повествовательную формулу и временную связь, но звучит естественно в современном литературном русском.
- source_word: ወለደት፡ ራሔል፡ ዮሴፍሃ
  choice: Рахиль родила Иосифа
  rationale: Прямо передаёт субъект, действие и объект; притяжательный элемент при имени Иосифа не требует отдельного выражения по-русски.
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: стричь своих овец
  rationale: Передаёт хозяйственное действие и притяжательное значение суффикса при слове «овцы».
- source_word: እስመ፡ ርሑቅ
  choice: потому что находился далеко
  rationale: Сохраняет причинный союз и значение пространственной удалённости; добавленный глагол-связка необходим для естественного русского предложения.
