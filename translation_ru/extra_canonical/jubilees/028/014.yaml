lexical_decisions:
- source_word: እምእንተ፡ ትልህቅ፡
  choice: прежде старшей
  rationale: Фраза завершает начатую в предыдущем стихе мысль о том, чтобы не отдавать младшую прежде старшей; её нельзя устранять как лишнюю.
- source_word: ያቀድም፡ ውሂበ፡
  choice: пусть он сперва отдаст
  rationale: Передаёт побудительную форму и значение первоочерёдности; «отдаст» естественно звучит в контексте выдачи дочери замуж, не добавляя это пояснение в основной текст.
- source_word: እንተ፡ ትልህቅ፡ … እንተ፡ ትንእስ፡
  choice: старшую … младшую
  rationale: Женский род сохраняет указание на двух женщин и соответствует контексту ближайших стихов.
- source_word: ወበእሲ፡ ዘይገብር፡ ከመዝ፡
  choice: И человек, который поступает так,
  rationale: Буквально и естественно передаёт незавершённое придаточное, продолжающееся в следующем стихе.
