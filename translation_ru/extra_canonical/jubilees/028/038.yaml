  text: 'The sixth: in the sixth year of the third week, Jacob again went in to Bilhah, and she conceived.'
translation:
  language: ru
  text: 'Шестой[a]: в шестой год третьей седмины Иаков снова вошёл к Валле, и она зачала.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если первое «шестой» понимать как часть указания времени: «В шестой год третьей седмины…»'
    reason: Сохраняет возможность иного синтаксического понимания необычного повторения слова «шестой» в источнике.
lexical_decisions:
- source_word: ሳድስ፡ በ*ሳድስ፡
  choice: 'Шестой: на шестом году'
  rationale: 'Передана повторяющаяся в источнике форма «шестой»: первое слово сохранено как элемент перечисления, второе — как указание года.'
- source_word: ዓመት፡ ዘሱባዔ፡ ሣልስ
  choice: году третьей седмины
  rationale: «Седмина» точно обозначает семилетний хронологический период и соответствует принятой библейской лексике.
- source_word: ወደገመ፡ ያዕቆብ፡ ካዕበ፡ ወቦአ፡ ኀበ፡ ባላ፡
  choice: Иаков снова вошёл к Валле
  rationale: «Снова» передаёт повторность, выраженную источником; «вошёл к» сохраняет библейский эвфемизм половой близости. Имя Bilhah дано в традиционной русской библейской форме «Валла».
- source_word: ወፀንሰት
  choice: и она зачала
  rationale: Прямой и естественный русский эквивалент глагола зачатия.
theological_decisions:
- issue: Значение начального «Шестой»
  choice: Сохранить как отдельный элемент перечисления
  alternative: Начать только словами «На шестом году…»
  rationale: Начальное слово явно присутствует в геэзском тексте и, вероятно, отмечает шестого сына в последовательности рождений; удаление устранило бы значимую особенность источника.
translation_notes:
  register: Современный литературный русский с сохранением библейского эвфемизма «вошёл к» и хронологического термина «седмина». Необычное начальное перечисление сохранено, а не сглажено.
