lexical_decisions:
- source_word: ድኩም
  choice: слабы
  rationale: Передаёт характеристику глаз Лии без попытки уточнить, означает ли она физическую слабость, тусклость или иной недостаток.
- source_word: ላሕይ፡ ራእያ፡ ጥቀ
  choice: облик её был очень красив
  rationale: Сохраняет относящееся к Лии местоимение, значение «облик/внешность» и усилитель ጥቀ «очень», не перенося эти слова на Рахиль.
- source_word: ወራሔል፡ ሠናይ
  choice: и Рахиль была красива
  rationale: Передаёт отдельное краткое утверждение о красоте Рахили, как в геэзском тексте.
