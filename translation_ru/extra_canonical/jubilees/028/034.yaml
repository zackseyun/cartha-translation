lexical_decisions:
- source_word: ፍሬ፡ ከርሥኪ
  choice: плод твоего чрева
  rationale: Буквально передаёт образ «плода утробы/чрева»; слово «чрево» сохраняет достоинство библейского регистра и остаётся понятным современному читателю.
- source_word: ኀደገኪ
  choice: оставил тебя
  rationale: Передаёт значение «оставить, покинуть» без усиления до более узкого «отвергнуть»; женский объект отражён местоимением «тебя» в обращении к Рахили.
- source_word: ደቀ፡ አርባዕተ
  choice: четверых детей
  rationale: Сохраняет нейтральное обозначение детей и количественное значение «четыре»; форма «четверых» естественна при одушевлённом прямом дополнении.
theological_decisions:
- issue: Риторический характер слов «я оставил тебя?»
  choice: Разве я оставил тебя?
  alternative: Вот, я оставил тебя.
  rationale: Контекст и пунктуация издания/консультационного слоя указывают на вопрос, выражающий отрицание обвинения. Частица «разве» естественно передаёт риторическую силу, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начало и конец сохранены как фрагменты стиха; синтаксис не был искусственно дополнен сведениями из соседнего контекста.
