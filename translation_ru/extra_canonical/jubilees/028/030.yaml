translation:
  language: ru
  text: Первый[a] — в шестой год этой седмины. Иаков снова вошёл к ней, и она зачала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Первый»; вероятно, это слово завершает мысль предыдущего стиха. Возможно также начать перевод: «В шестой год этой седмины».'
    reason: Сегментация стиха оставляет ቀዳማዊ («Первый») без явно выраженного существительного; примечание отмечает эту связь, не добавляя невыраженное в сегменте «сын».
lexical_decisions:
- source_word: ቀዳማዊ
  choice: Первый
  rationale: Передаёт порядковое значение «первый»; синтаксическая незавершённость сохранена, поскольку слово, вероятно, завершает мысль предыдущего стиха.
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологии Книги Юбилеев обозначает семилетний период; «седмина» кратко передаёт это специальное значение и сохраняет отличие от обычной недели.
- source_word: ደገመ
  choice: снова
  rationale: Передаёт повторность действия естественным современным русским наречием.
- source_word: ቦአ፡ ኀቤሃ
  choice: вошёл к ней
  rationale: Сохранён библейский эвфемизм для супружеской близости без ненужного истолкования.
- source_word: ፀንሰት
  choice: она зачала
  rationale: Прямой и традиционный, но понятный современному читателю эквивалент.
theological_decisions:
- issue: Связь слова ቀዳማዊ с контекстом предыдущего стиха
  choice: Сохранить отдельное «Первый» с тире
  alternative: Опустить слово либо встроить его в реконструированную фразу из предыдущего стиха
  rationale: Источник в данном сегменте содержит слово «первый», однако его смысл синтаксически зависит от предыдущего контекста. Перевод не устраняет эту текстовую напряжённость домыслом.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» употреблён в специальном хронологическом смысле — семь лет. Повтор, ошибочно присутствующий в английском консультационном слое, не воспроизведён, поскольку в геэзском источнике предложение дано один раз.
