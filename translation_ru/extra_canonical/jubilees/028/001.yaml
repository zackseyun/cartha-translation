  text: And he lifted up his feet and went to the land of the east, to Laban, the brother of Rebekah, and he stayed with him.
translation:
  language: ru
  text: И поднялся он и пошёл в восточную землю, к Лавану, брату Ревекки, и остался у него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንሥአ፡ እገሪሁ
  choice: И поднялся он
  rationale: Буквально выражение связано с поднятием ног, то есть с отправлением в путь. По-русски «поднялся» естественно передаёт начало движения без неуместного буквализма «поднял ноги».
- source_word: ምድረ፡ ጽባሕ
  choice: в восточную землю
  rationale: Буквально «земля восхода/утра»; в данном географическом употреблении это земля на востоке. Формулировка сохраняет образ земли как области и остаётся понятной современному читателю.
- source_word: ወሀሎ፡ ምስሌሁ
  choice: и остался у него
  rationale: Глагольное сочетание буквально означает пребывание с ним; по контексту естественное русское соответствие — «остался у него», то есть жил или находился у Лавана некоторое время.
