  rationale: Прямая и естественная передача обстоятельства, относящегося к увиденному.
- source_word: ዘተናገረ፡ ሎቱ
  choice: что было сказано ему
  rationale: Сохранена пассивная конструкция оригинала без уточнения не названного здесь говорящего.
theological_decisions:
- issue: Не назван субъект того, что было сказано герою
  choice: сохранить пассивное «было сказано ему»
  alternative: «что Бог сказал ему»
  rationale: Оригинал в данном фрагменте не называет говорящего; добавление Бога устранило бы подлинную недосказанность текста.
translation_notes:
