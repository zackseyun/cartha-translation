lexical_decisions:
- source_word: ምድረ፡ ከናአን
  choice: землю Ханаанскую
  rationale: Естественное для современного литературного русского языка библейское географическое наименование, сохраняющее конструкцию исходного текста.
- source_word: ነገሮን
  choice: рассказал им
  rationale: Передаёт глагол сообщения и местоименный объект множественного числа.
- source_word: በህልም
