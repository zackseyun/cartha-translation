  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሀቦ፡ ላባ፡ ራሔልሃ፡ ለያዕቆብ
  choice: Лаван отдал Рахиль Иакову
  rationale: Глагол ወሀቦ передаёт действие «дал/отдал», а формы имён и предложная конструкция ясно обозначают Рахиль как передаваемое лицо и Иакова как получателя. «Отдал» естественно по-русски в контексте брака.
- source_word: ከመ፡ ይትቀነይ፡ ሎቱ፡ ካልአተ፡ ዓመተ፡ ሰብዓተ
  choice: чтобы тот служил ему ещё семь лет
  rationale: Сохранены целевая конструкция, служение Лавану и значение дополнительного семилетнего срока. «Тот» недвусмысленно соотносится с Иаковом и звучит естественнее повторения имени.
- source_word: ወወሀባ፡
  choice: И он отдал её…
  rationale: Форма содержит местоименный объект женского рода, поэтому «её» нельзя опускать. Многоточие показывает, что представленная исходная строка обрывается на незавершённой конструкции; «отдал» поддерживает лексическую связь с первым предложением.
