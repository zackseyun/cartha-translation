  text: And in the first year of the third week he said to him, “Give me my wife, for whom I have served you.”
translation:
  language: ru
  text: 'И в первый год третьей седмины он сказал ему: «Отдай мне мою жену, ради которой я служил тебе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: Обозначает семилетний период в юбилейной хронологии; «седмина» сохраняет специальный временной смысл и отличается от обычной календарной недели.
- source_word: ሀበኒ
  choice: отдай мне
  rationale: Императив буквально значит «дай мне»; в контексте обещанной жены естественное русское «отдай мне» передаёт требование исполнить обязательство, не добавляя нового содержания.
- source_word: ብእሲትየ
  choice: мою жену
  rationale: Прямое соответствие существительному «жена» с притяжательным суффиксом первого лица.
- source_word: ተቀነይኩ
  choice: я служил
  rationale: Сохраняет буквальный смысл служения/работы у адресата и связь с брачным договором.
