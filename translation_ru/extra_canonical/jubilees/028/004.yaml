translation:
  language: ru
  text: 'эти семь лет». И Лаван сказал Иакову: «Я отдам тебе твою жену». И устроил Лаван пир и взял…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዓተ፡ ዓመተ፡
  choice: эти семь лет
  rationale: Фрагмент продолжает предыдущее предложение; указательное «эти» естественно передаёт определённость данного периода в контексте.
- source_word: እሁበከ፡ ብእሲተከ።
  choice: Я отдам тебе твою жену
  rationale: Глагол ሀበ означает «дать, отдать», а ብእሲት с суффиксом — «твою жену»; сохранена формулировка источника без уточнения имени.
- source_word: ገብረ፡ ላባ፡ ግብአ፡
  choice: устроил Лаван пир
  rationale: Буквально сочетание передаёт действие «сделал/устроил пир»; по-русски естественно «устроил пир».
- source_word: ወነሥአ፡
  choice: и взял…
  rationale: Форма означает «и взял»; стих обрывается на глаголе, поэтому незавершённость сохранена многоточием.
