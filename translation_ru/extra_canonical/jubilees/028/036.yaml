  text: мою служанкуᵃ; и она зачнёт и родит мне сына». И она отдала ему в жёны свою служанку Валлу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመትየ
  choice: мою служанку
  rationale: Форма означает «моя служанка/рабыня»; винительный синтаксис обусловлен началом фразы в предыдущем контексте. «Служанка» естественно и достойно звучит по-русски.
- source_word: ወትፀንስ ወትወልድ ሊተ ወልደ
  choice: и она зачнёт и родит мне сына
  rationale: Сохраняется последовательность двух глаголов и прямое значение «мне сына», без отсутствующего в геэзском тексте выражения «войди к ней».
- source_word: ወወሀበት ባላሃ አመታ ትኩኖ ብእሲተ
  choice: И она отдала ему в жёны свою служанку Валлу
  rationale: Передаёт смысл «дала Виллу/Валлу, свою служанку, чтобы она стала [ему] женой» естественным русским оборотом. Имя дано в традиционной русской библейской форме «Валла».
theological_decisions:
- issue: Возможная гармонизация с Быт 30:3
  choice: Не добавлять «войди к ней»
  alternative: «мою служанку; войди к ней, и она зачнёт»
  rationale: В представленном геэзском тексте после «мою служанку» непосредственно стоят слова «и она зачнёт»; добавление брачной формулы было бы заимствованием из параллельного места, а не переводом источника.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксическая фрагментарность начала стиха сохранена, поскольку отрывок начинается в середине реплики; кавычка закрывает речь, начатую в предыдущем стихе.
