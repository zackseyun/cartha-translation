  text: And Jacob’s possessions increased greatly, and he acquired cattle and sheep and donkeys and camels.
translation:
  language: ru
  text: Имущество Иакова чрезвычайно умножилось, и он приобрёл крупный скот, овец, ослов и верблюдов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጥሪቱ
  choice: имущество
  rationale: Передаёт совокупность владений Иакова, не сужая значение только до скота или денежного богатства.
- source_word: በዝኅ፡ … ጥቀ
  choice: чрезвычайно умножилось
  rationale: 'Сохраняет усиленное значение: имущество значительно возросло.'
- source_word: አጥረየ
  choice: приобрёл
  rationale: Естественно передаёт обретение и накопление перечисленного скота.
- source_word: አልህምተ
  choice: крупный скот
  rationale: Обозначает cattle и отличает эту группу от следующих далее овец.
- source_word: አባግዐ
  choice: овец
  rationale: Прямое соответствие названию данного вида мелкого скота.
- source_word: አእዱገ
  choice: ослов
  rationale: Слово явно присутствует в геэзском тексте и не должно быть опущено.
- source_word: አገማለ
  choice: верблюдов
  rationale: Прямое соответствие заключительному элементу перечня.
