  text: Leah conceived and bore him a third son, and he called his name Levi, on the first day of the first month.
translation:
  language: ru
  text: Лия зачала и родила ему третьего сына, и он назвал его Левием — в новомесячие первого месяца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в первый день первого месяца».'
    reason: Фраза በሠርቅ፡ ወርኅ፡ обозначает начало, или новомесячие, месяца; альтернативная формулировка яснее раскрывает календарный смысл.
lexical_decisions:
- source_word: ወጸውዐ፡ ስሞ፡
  choice: и он назвал его
  rationale: Глагол ወጸውዐ имеет форму 3-го лица единственного числа мужского рода; субъектом подразумевается Иаков. Русское «назвал его» естественно передаёт буквальное «назвал его имя».
- source_word: ሌዊ፡
  choice: Левием
  rationale: Использована традиционная русская библейская форма имени в творительном падеже после глагола «назвал».
- source_word: በሠርቅ፡ ወርኅ፡
  choice: в новомесячие первого месяца
  rationale: Сочетание указывает на начало месяца, то есть новомесячие/первый день; «новомесячие» сохраняет календарный оттенок и не смешивает это значение с возможным значением «рассвет».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционной библейской формой имени. Синтаксис сделан плавным, при этом мужской род глагола называния и календарная формулировка исходного текста сохранены.
