translation:
  language: ru
  text: 'Иосифа[a]. Иаков сказал Лавану: «Отдай мне моих жён и детей, и я пойду к моему отцу Исааку и сделаю…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя «Иосиф» завершает фразу, начатую в предыдущем фрагменте; буквально в данном сегменте стоит только: «Иосиф».'
    reason: vertex_chapter_split
  - marker: b
    text: 'Фраза обрывается на границе сегмента; буквально: «и сделаю».'
    reason: vertex_chapter_split
lexical_decisions:
- source_word: ዮሴፍ
  choice: Иосифа
  rationale: Имя морфологически неизменно в геэз, но по контексту оно завершает предшествующее высказывание о рождении сына; русский винительный падеж позволяет естественно передать эту синтаксическую связь без добавления отсутствующих в данном фрагменте слов.
- source_word: አንስትየየ
  choice: моих жён
  rationale: В данном контексте слово обозначает жён Иакова, а не женщин вообще.
- source_word: ወእሖር
  choice: и я пойду
  rationale: Передаёт глагол движения እሖር без подмены его значением «вернусь».
- source_word: ወእግበር
  choice: и сделаю…
  rationale: Форма от ገብረ означает «делать, совершать», а не «возвращаться»; многоточие сохраняет незавершённость фразы на границе сегмента.
