  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዒሁ
  choice: своих овец
  rationale: 'Форма означает «его овцы»; в данном фрагменте естественно передаётся как продолжение предшествующего предложения: «своих овец».'
- source_word: ወጸውዖን
  choice: и позвал
  rationale: Глагол передаёт призыв или приглашение; русское «позвал» сохраняет прямой смысл и естественно сочетается с именами.
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: и говорил к их сердцам
  rationale: Сохранён необычный образ исходного текста — речь, обращённая «в/к их сердцам», без сведения его к более определённому «убеждал».
- source_word: ከመ፡ ይምጽኣ
  choice: чтобы они пришли
  rationale: Передана целевая конструкция с глаголом «приходить»; форма допускает понимание множественного субъекта по контексту Лии и Рахили.
