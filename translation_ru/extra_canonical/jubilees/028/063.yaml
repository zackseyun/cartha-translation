  source_fidelity: 'Смысл передан в целом точно: «его/своих овец», призыв Иакова к Лии и Рахили и обращение, связанное с их приходом, соответствуют геэзскому тексту и английскому аудиторскому переводу. Однако исходный фрагмент продолжается после «овец» без завершения предложения, поэтому точка в русском тексте неоправданно разрывает синтаксис.'
