  register: Современный литературный русский с умеренно формальным библейским достоинством. Фрагмент начинается и заканчивается внутри предложения; поэтому начальная строчная буква и незавершённость синтаксиса сохранены. Надстрочные числа в издании Charles расценены как редакционные указатели, а не часть текста.
