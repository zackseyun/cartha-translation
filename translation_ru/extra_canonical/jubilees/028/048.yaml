  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: ru
  text: И родилась дочь, имя ей — Дина, в седьмом месяце седьмого года шестой седмины четвёртого юбилея. И Он смилостивился над ней,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለወለት
  choice: родилась дочь
  rationale: По контексту и текстологическому уточнению это форма глагола рождения в женском роде; добавление «дочь» естественно передаёт подразумеваемое лицо и согласуется с последующим именем Дина.
- source_word: ስማ፡ ዲና
  choice: имя ей — Дина
  rationale: Сохраняет явно выраженное в геэз слово «имя» и передаёт именную конструкцию естественным современным русским языком.
- source_word: በሳብዕ፡ ወርኅ
  choice: в седьмом месяце
  rationale: Прямое обозначение календарного месяца.
- source_word: ዘሳብዕ፡ ዓመት፡ ዘሳድስ፡ ሱባዔ፡ ዘራብዕ
  choice: седьмого года шестой седмины четвёртого юбилея
  rationale: Сохраняет вложенную юбилейную хронологию оригинала; «седмина» отличает семилетний период от обычной недели.
- source_word: ወተሣሀላ
  choice: И Он смилостивился над ней
  rationale: Форма указывает на субъект мужского рода в третьем лице и женский объектный суффикс; местоимение «Он» сохраняет подразумеваемого, но не названного в этом фрагменте субъекта.
theological_decisions:
- issue: Личность субъекта в заключительной фразе
  choice: «Он» с прописной буквы, без добавления имени Господа
  alternative: «он» со строчной буквы или «Господь»
  rationale: Грамматика требует мужского субъекта, а продолжение и контекст указывают на Бога; при этом имя или титул Бога в данном фрагменте отсутствует, поэтому оно не добавляется.
- issue: Объект милости
  choice: «над ней»
  alternative: «она смилостивилась»
  rationale: Женский суффикс является объектным, а не показателем женского субъекта; перевод сохраняет грамматическое различие.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Хронологическая формула сохранена близко к источнику; «седмина» употреблена как понятное традиционное обозначение семилетнего цикла. Конечная запятая сохраняет незавершённость мысли, продолжающейся в следующем стихе.
