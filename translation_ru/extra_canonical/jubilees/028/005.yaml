lexical_decisions:
- source_word: ትልህቅ
  choice: старшую
  rationale: Передаёт значение «большая, старшая» применительно к двум дочерям и естественно звучит по-русски.
- source_word: ብእሲተ
  choice: в жёны
  rationale: Эфиопское слово означает «женщина, жена»; в конструкции с глаголом «дать» русский оборот «отдать в жёны» точно передаёт брачный смысл.
- source_word: አመተ
  choice: в служанки
  rationale: Передаёт зависимое положение женщины при Лии, сохраняя различие между Зелфой как рабыней Лавана и её назначением служанкой Лии.
- source_word: ለእኪት
  choice: свою рабыню
  rationale: Выбрано «рабыню», поскольку исходное обозначение подчёркивает принадлежность и несвободный статус; притяжательное значение передано словом «свою».
