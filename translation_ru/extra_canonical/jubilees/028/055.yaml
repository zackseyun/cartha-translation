translation:
  language: ru
  text: А из коз всякая крапчатая[a], пятнистая и белая, которая родится, будет ему платой. И они родили
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пепельная».'
    reason: Значение ሐመደ допускает указание как на крапчатую, так и на пепельную окраску.
lexical_decisions:
- source_word: እምአጣሊ (ʾəm-ʾaṭāli)
  choice: из коз
  rationale: አጣሊ обозначает коз, а не ягнят; предлог እም передаёт значение «из, среди».
- source_word: ሐመደ (ḥamada)
  choice: крапчатая
  rationale: Слово связано с представлением о пепельной окраске и может обозначать пёстрый или крапчатый вид; «крапчатая» естественно отличает этот признак от следующего «пятнистая».
- source_word: ጋሰ (gāsa)
  choice: пятнистая
  rationale: Передаёт отдельный признак неоднородной окраски и сохраняет трёхчленное перечисление оригинала.
- source_word: ጸዐዳ (ṣaʿdā)
  choice: белая
  rationale: Прямое современное соответствие обозначению белого цвета.
- source_word: ዐስቦ (ʿasbo)
  choice: платой
  rationale: В контексте договора о стаде означает вознаграждение за труд; «плата» звучит естественно и точно.
- source_word: ወይወልዱ (wa-yəwallədu)
  choice: И они родили
  rationale: Форма продолжает повествование и буквально вводит следующее сообщение о приплоде; незавершённость сохранена, поскольку исходный фрагмент обрывается здесь.
