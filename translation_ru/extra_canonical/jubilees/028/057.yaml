lexical_decisions:
- source_word: አባግዐ
  choice: овцы
  rationale: Прямое обозначение овец; существительное сохранено как явное подлежащее.
- source_word: ይለዳ
  choice: приносили приплод
  rationale: Передаёт рождение потомства у скота естественным современным русским выражением и согласуется с повествованием в прошедшем времени.
- source_word: ዘበአርአያሆን
  choice: по своим видам
  rationale: Сохраняет буквальный смысл конструкции «согласно их видам/облику», не уточняя способ размножения сверх текста.
- source_word: ትእምርት
  choice: отметинами
  rationale: Передаёт видимый отличительный знак на животных без чрезмерной конкретизации его формы.
- source_word: ለያዕቆብ / ለላባ
  choice: принадлежали Иакову / Лавану
  rationale: Дательный оборот принадлежности естественно передан русским глаголом «принадлежать».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль с сохранением параллелизма двух заключительных частей. Местоименное «все» раскрыто как «все животные», поскольку в русском языке это устраняет двусмысленность и ясно соотносится с овцами.
