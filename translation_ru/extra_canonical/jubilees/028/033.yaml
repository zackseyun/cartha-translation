  text: 'Она не рожала и сказала Иакову: «Дай мне детей». Иаков сказал: «Разве я удержал от тебя?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Разве я удержал от тебя?» В представленном геэзском тексте реплика на этом обрывается.'
    reason: Сноска поясняет намеренно сохранённую формальную незавершённость последней реплики, не восполняя её по библейской параллели.
lexical_decisions:
- source_word: ኢትወልድ
  choice: Она не рожала
  rationale: Отрицательная форма глагола «рождать» передана естественно по-русски; женский субъект восстанавливается из формы и контекста.
- source_word: ሀበኒ፡ ውሉደ
  choice: Дай мне детей
  rationale: Прямое повеление передано кратко и буквально.
- source_word: አነሁ፡ ከላእኩ፡ እምኔኪ
  choice: Разве это я не даю тебе детей?
  rationale: Риторический вопрос сохраняет акцент на «я» и отрицательный смысл глагола; объект «детей» восполнен по непосредственному контексту для ясного русского синтаксиса.
theological_decisions:
- issue: Незавершённость последней реплики в данном геэзском фрагменте
  choice: Не добавлять упоминание Бога или дальнейшее продолжение реплики
  alternative: 'Расширить по параллели с Быт. 30:2: «Разве я Бог, Который не даёт тебе детей?»'
  rationale: Предоставленный исходный текст заканчивается выражением «я удержал/не дал от тебя»; богословски значимое упоминание Бога нельзя вносить лишь из библейской параллели.
translation_notes:
  register: Современный литературный русский язык; прямая речь проста и выразительна. Сохранён резкий риторический тон ответа Иакова без внесения отсутствующего в источнике продолжения.
