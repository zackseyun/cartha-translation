  text: to her, and she conceived and bore another son and a daughter, and she called the son's name Zebulun,
translation:
  language: ru
  text: к ней, и она зачала и родила ещё одного[a] сына и дочь, и нарекла сыну имя Завулон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второго сына».'
    reason: Слово ካልእ допускает значения «другой, ещё один» и «второй»; основная формулировка избегает возможного противоречия с порядком рождения сыновей Лии.
lexical_decisions:
- source_word: ካልእተ፡ ወልደ፡
  choice: ещё одного сына
  rationale: ካልእ может означать «другой, ещё один» или «второй». В данном повествовательном контексте «ещё одного сына» сохраняет смысл исходного текста и не создаёт ложного впечатления, будто Завулон был вторым сыном Лии.
- source_word: ወወለተ፡
  choice: и дочь
  rationale: Передаёт отдельное упоминание дочери в исходном тексте без добавления отсутствующего там имени.
- source_word: ወጸውዐት፡ ስሞ፡ ለወልድ፡
  choice: и нарекла сыну имя
  rationale: Формально и естественно передаёт формулу именования, ясно сохраняя указание, что имя относится к сыну.
- source_word: ዘቡሎን፡
  choice: Завулон
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions: []
