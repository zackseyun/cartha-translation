lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычное и уместное в библейском контексте соответствие эфиопскому обозначению Господа.
- source_word: ወአርኀወ፡ ማኅፀና
  choice: открыл её утробу
  rationale: Сохраняет телесную метафору источника и библейскую образность, не заменяя её истолкованием вроде «даровал ей способность зачать».
- source_word: ወፀንሰት፡ ወወለደት፡ ወልደ
  choice: она зачала и родила сына
  rationale: Прямо и естественно передаёт последовательность действий и явно выраженное слово «сын».
- source_word: ወጸውዐት፡ ስሞ
  choice: и назвала его
  rationale: Естественная современная русская передача выражения «назвала его имя»; многоточие сохраняет незавершённость сохранившегося текста стиха.
theological_decisions:
- issue: Божье действие в зачатии
  choice: Сохранена формулировка «открыл её утробу»
  alternative: «даровал ей ребёнка» или «сделал её способной зачать»
  rationale: Источник описывает действие Господа метафорически и непосредственно; перевод не должен усиливать или рационализировать это утверждение.
- issue: Глагол «вспомнил» при имени Рахили
  choice: «вспомнил о Рахили»
  alternative: Опустить глагол как отсутствующий в представленном фрагменте строки
  rationale: Форма ለራሔል сама по себе не образует естественного высказывания после подлежащего; засвидетельствованная и аудированная реконструкция отражает явно подразумеваемое чтение и библейский контекст, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Синтаксис сделан плавным и понятным; архаизмы вроде «разверз утробу» и «нарекла имя» не использованы. Многоточие и сноска сохраняют реальную незавершённость исходного стиха.
