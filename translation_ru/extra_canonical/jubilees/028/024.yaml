  language: ru
  text: И она родила Иакову сына, и он назвал его Рувимом, в четырнадцатый день месяца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «девятого месяца».'
    reason: Текстологический вариант уточняет месяц, тогда как в предоставленном основном тексте слово «девятого» отсутствует.
lexical_decisions:
- source_word: ወወለደት፡ ለያዕቆብ፡ ወልደ፡
  choice: И она родила Иакову сына
  rationale: Женская форма глагола передана явным местоимением «она»; дательный оборот и слово «сын» сохранены естественным для русского языка порядком слов.
- source_word: ወጸውዐ፡ ስሞ፡ ሮቤል፡
  choice: и он назвал его Рувимом
  rationale: Мужская форма глагола требует отдельного субъекта «он», то есть Иакова; идиоматическое русское «назвал его Рувимом» точно передаёт выражение «назвал его имя Рувим».
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡
  choice: в четырнадцатый день месяца
  rationale: Основной предоставленный текст называет четырнадцатый день, но не указывает порядковый номер месяца.
