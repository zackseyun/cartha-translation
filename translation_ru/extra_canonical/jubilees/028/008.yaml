lexical_decisions:
- source_word: ተቀነይኩ፡ ለከ፡
  choice: Я служил тебе
  rationale: Первое лицо и адресат переданы явно; «служил» естественно выражает работу Иакова у Лавана.
- source_word: በእንተ፡ ራሔል፡
  choice: ради Рахили
  rationale: Предлог передаёт основание и цель службы; это естественнее по-русски, чем буквальное «за Рахиль».
- source_word: 7ፋዕከኒ፤
  choice: ты обманул меня
  rationale: По контексту брачной подмены глагол означает вероломное введение в заблуждение; «обманул» ясно и современно.
- source_word: ንግአ፡ ወሰተከ፡
  choice: Забери свою дочь
  rationale: Императив сохранён; «свою дочь» естественно обозначает дочь собеседника в русском языке.
