lexical_decisions:
- source_word: ለወርኅ፡ ሳብዕ
  choice: в седьмом месяце
  rationale: Предлог «в» естественно передаёт временное значение конструкции; речь идёт о событии, произошедшем в течение седьмого месяца.
- source_word: ዘሱባዔ፡ ራብዕ
  choice: четвёртой седмины
  rationale: «Седмина» сохраняет характерный для хронологии книги термин, обозначающий последовательность из семи лет, не перегружая основной текст пояснением.
- source_word: አቀመት፡ ወኢትወልድ
  choice: перестала рожать
  rationale: Два близких по смыслу выражения — «прекратила» и «не рожала» — естественно и без смысловой потери сведены в русском к результативной формулировке «перестала рожать».
