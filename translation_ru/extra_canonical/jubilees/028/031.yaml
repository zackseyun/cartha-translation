  text: and she bore him a fourth son, and he called his name Judah, on the fifteenth day of the third month,
translation:
  language: ru
  text: И она родила ему четвёртого сына, и он назвал его Иудой[a] — в пятнадцатый день третьего месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Быт. 29:35 имя ему даёт Лия; здесь эфиопский текст имеет мужскую форму: «он назвал». Возможное разночтение: «она назвала».'
    reason: Текст источника расходится с параллельным местом Бытия и с возможным вариантом женского рода; сноска сохраняет эту текстовую неоднозначность.
lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡ ራብዐ፡
  choice: И она родила ему четвёртого сына
  rationale: Женская форма глагола ወለደት передана явным местоимением «она»; дательный элемент ሎቱ сохранён как «ему», а порядковое ራብዐ — как «четвёртого».
- source_word: ወጸውዐ፡ ስሞ፡ ይሁዳ፡
  choice: и он назвал его Иудой
  rationale: Форма ጸውዐ — мужской род, 3-е лицо единственного числа, поэтому субъект передан как «он». Оборот «назвал его Иудой» естественно выражает буквальное «назвал его имя Иуда».
- source_word: በዐሡሩ፡ ወኀሙሱ፡ ለወርኅ፡ ሣልስ፡
  choice: в пятнадцатый день третьего месяца
  rationale: Составное числительное «десять и пять» естественно передано как «пятнадцатый день»; календарное обозначение сохранено без дополнительного истолкования.
theological_decisions:
- issue: Кто дал имя Иуде
  choice: он назвал
  alternative: она назвала
  rationale: Основной текст следует данной эфиопской форме ጸውዐ, которая является мужской, хотя в Быт. 29:35 и в возможном варианте чтения имя даёт Лия. Разночтение не исправлено молча и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, простой и достойный библейский регистр. Тире перед датой делает длинную последовательность союзов естественнее, не изменяя смысла.
