lexical_decisions:
- source_word: ወእሁበከ
  choice: и я отдам тебе
  rationale: Будущая форма глагола «дать» с объектным суффиксом второго лица передана естественной русской конструкцией.
- source_word: ራሔልሃ
  choice: также Рахиль
  rationale: Имя передано в принятой русской библейской форме «Рахиль»; присоединительный элемент отражён словом «также» по смыслу контекста и консультационного слоя.
- source_word: ትትቀነይ፡ ሊተ
  choice: ты будешь служить мне
  rationale: Сохранено прямое значение служения одному лицу без конфессиональной конкретизации.
- source_word: ካልአነ፡ ዓመተ፡ ሰብዐተ
  choice: ещё семь лет
  rationale: Буквально речь идёт о других, то есть дополнительных, семи годах; «ещё» естественно выражает это по-русски.
- source_word: ትርዐይ፡ አባግዐየ
  choice: пасти моих овец
  rationale: Передано прямое пастушеское значение глагола и притяжательная форма существительного.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением простой договорной речи персонажа. Союз «и» перед последним инфинитивным оборотом сохраняет последовательность исходных условий и не вводит оттенка одной лишь одновременности. Конечная кавычка предполагает, что стих завершает прямую речь, начатую ранее.
