  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: ru
  text: И он вошёл к ней; она зачала и родила ему сына, и он дал ему имя Дан[a] — в девятый день месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «она дала ему имя Дан».'
    reason: Основной текст следует мужской форме глагола в предоставленном геэзском источнике; примечание сохраняет засвидетельствованный вариант с женской формой.
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  choice: И он вошёл к ней
  rationale: Передаёт обычный библейский эвфемизм о супружеской близости, не делая его ни грубее, ни более явным.
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  choice: и он нарёк ему имя Дан
  rationale: Мужская форма глагола ወጸውዐ указывает на подлежащее «он»; «нарёк имя» сохраняет достоинство и библейский оттенок формулы именования.
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  choice: в девятый день месяца
  rationale: Формула с አመ и порядковым числительным обозначает календарный день месяца, а не девятый месяц.
theological_decisions:
- issue: Кто дал ребёнку имя
  choice: он нарёк
  alternative: она нарекла
  rationale: Предоставленный текст содержит глагол в форме третьего лица мужского рода единственного числа; альтернативное чтение отражено в примечании без подмены основного источника.
- issue: Календарная датировка
  choice: в девятый день месяца
  alternative: в девятом месяце
  rationale: Основной перевод следует наиболее естественному календарному пониманию геэзской формулы, а возможная иная трактовка сохранена в примечании.
translation_notes:
  register: Современный литературный русский с умеренно библейским, достойным регистром. Синтаксис близок к последовательности оригинала, но естественен по-русски; календарное выражение слегка развёрнуто для ясности.
