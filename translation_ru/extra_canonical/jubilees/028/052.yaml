  text: дом для себя, ибо я отслужил тебе все годы за обеих твоих дочерей и уйду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: дом для себя
  rationale: 'Буквально: «мне дом» / «для меня дом». Сохраняет чтение геэзского текста и синтаксическую связь с предыдущим стихом; вариант «отдай мне жену» опирается на параллель в Бытии, а не на данный источник.'
- source_word: ፈጸምኩ፡ ዓመታተ፡
  choice: я отслужил все годы
  rationale: Глагол выражает завершение установленного срока; «все» естественно передаёт полноту отработанных лет в современном русском.
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: отслужил тебе
  rationale: Передаёт службу Иакова Лавану без архаического и менее естественного «служил у тебя».
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: за обеих твоих дочерей
  rationale: 'ህየንተ указывает на возмещение или условие обмена: годы службы были отданы за двух дочерей.'
- source_word: ወአሐውር፡
  choice: и теперь уйду
  rationale: Будущее движение естественно выражено как намерение уйти; «теперь» делает русскую связь с завершением срока явной, не меняя смысла.
theological_decisions:
- issue: Соотношение с параллелью в Бытии и прежним вариантом «отдай мне жену»
  choice: Следовать засвидетельствованному геэзскому чтению «дом для себя»
  alternative: «Отдай мне жену»
  rationale: Перевод должен исходить из предоставленного оригинального текста. Здесь прямо стоит ቤተ («дом»), поэтому гармонизация с повествованием Бытия необоснованна.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Начальная строчная буква сохранена, поскольку стих представляет собой продолжение фразы из предыдущего стиха.
