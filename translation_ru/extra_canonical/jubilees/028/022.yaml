lexical_decisions:
- source_word: ራሔል
  choice: Рахили
  rationale: Форма понята как зависимое дополнение «Рахили» в продолжении фразы предыдущего стиха, а не как подлежащее «Рахиль».
- source_word: ባላንሃ
  choice: Валлу
  rationale: Передача традиционного русского библейского имени Билхи/Валлы в форме винительного падежа, поскольку она является тем, кого дают в служанки.
- source_word: አኅታ፡ ለዜልፋን
  choice: сестру Зелфы
  rationale: Буквально сохранено родственное определение; употреблено традиционное русское имя Зелфа.
- source_word: ለአኪት
  choice: в служанки
  rationale: Естественная современная русская передача целевого значения «как служанку / в качестве служанки».
- source_word: ወትቀንየ፡ ሰብዓተ፡ ዓመተ፡ ዳግመ
  choice: И он служил ещё семь лет
  rationale: Сохраняет субъект, подразумеваемый формой глагола, и значение повторности ዳግመ.
theological_decisions:
- issue: Кто дал Валлу Рахили
  choice: Не добавлять в этом стихе ни подлежащего, ни глагола «дал»
  alternative: «Рахиль дала Валлу…» или «Лаван дал Рахили Валлу…»
  rationale: Сохранившийся сегмент является продолжением предыдущей фразы. Добавление «Рахиль дала» исказило бы повествование, а явное добавление «Лаван дал» внесло бы в данный сегмент слова, отсутствующие в представленном исходном тексте.
translation_notes:
  register: Современный литературный русский с традиционными библейскими формами имён «Валла» и «Зелфа». Синтаксическая фрагментарность начала и конца сохранена намеренно; тире помогает читателю распознать продолжение перечня из предыдущего стиха, не добавляя отсутствующего глагола.
