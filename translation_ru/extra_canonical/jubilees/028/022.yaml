  text: Рахили Валлу, сестру Зелфы, как служанку.[a] И он служил ещё семь лет за…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха продолжает фразу предыдущего стиха: Валлу дал Рахили Лаван.'
