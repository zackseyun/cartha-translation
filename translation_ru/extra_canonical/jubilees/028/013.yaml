  language: ru
  text: 'Так установлено и записано на небесных скрижалях: никто не должен отдавать младшую дочь…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥሩዕ
  choice: установлено
  rationale: Передаёт значение предписанного, установленного порядка естественным современным русским языком.
- source_word: ጽሑፍ
  choice: записано
  rationale: Сохраняет параллельную конструкцию «установлено и записано».
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Традиционное и понятное обозначение небесных таблиц, соответствующее образу книги Юбилеев.
- source_word: የሀብ
  choice: отдавать
  rationale: В контексте дочери глагол естественно означает отдавать её замуж; перевод не добавляет отсутствующее в данном отрывке уточнение «замуж».
- source_word: ወለተ፡ እንተ፡ ትንእስ
  choice: младшую дочь
  rationale: Прямо передаёт определительную конструкцию «дочь, которая младшая».
theological_decisions:
- issue: Нормативная сила записи на небесных скрижалях
  choice: никто не должен
  alternative: пусть никто не отдаёт
  rationale: Передаёт общий запрет, не усиливая и не ослабляя его конфессиональным толкованием.
- issue: Незавершённость предоставленного исходного фрагмента
  choice: многоточие после «младшую дочь»
  alternative: завершить предложение точкой
  rationale: Исходный текст заканчивается на объекте действия и, по смыслу главы, продолжается далее; многоточие не создаёт ложного впечатления законченного предписания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «небесные скрижали». Синтаксис ясен широкой аудитории; подлинная незавершённость данного фрагмента сохранена.
