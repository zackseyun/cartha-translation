lexical_decisions:
- source_word: በምድርነ
  choice: в нашей земле
  rationale: Буквально передаёт местное установление, сохраняя торжественный, но понятный современный регистр.
- source_word: ውሂበ
  choice: выдавать
  rationale: В контексте брака глагол «дать» естественно передаётся как «выдавать [замуж]»; слово «замуж» не добавлено, чтобы не перегружать исходную формулировку.
- source_word: እንተ፡ ትንእስ፡ እምእንተ፡ ትልህቅ
  choice: младшую прежде старшей
  rationale: Сохраняет порядок и противопоставление младшей и старшей сестёр; женский род определяется повествовательным контекстом.
- source_word: አኮ፡ ርቱዐ
  choice: неправильно
  rationale: Передаёт нравственно-нормативное значение «не право / не подобает» естественным современным русским словом без усиления до юридического запрета.
- source_word: ለገቢረ፡ ዝንቱ
  choice: поступать так
  rationale: Естественный русский эквивалент буквального «делать это».
- source_word: እስመ
  choice: ибо
  rationale: Сохраняет причинную связь и незавершённость отрывка в dignified literary register.
