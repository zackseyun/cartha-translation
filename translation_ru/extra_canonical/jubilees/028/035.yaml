translation:
  language: ru
  text: 'Иакову — Рувима, Симеона, Левия и Иуду, — и сказала ему: «Войди к Валле».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова в исходном тексте, по-видимому, повреждены. Возможный вариант: «И сказала Валле: „Вот Валла“».'
    reason: Сохранить текстологическую неопределённость и засвидетельствованный прежний вариант прочтения.
lexical_decisions:
- source_word: ወትቤሎ
  choice: «и сказала ему»
  rationale: Глагольная форма с местоименным суффиксом указывает на адресата мужского рода; в данном контексте это Иаков.
- source_word: ኀበ
  choice: «к»
  rationale: Предлог передаёт направление движения к лицу; по-русски в сочетании «войти к» звучит естественно.
- source_word: ባላ
  choice: «Валла»
  rationale: Передача имени служанки Рахили в форме, принятой в русской библейской традиции; написание исходного места текстологически неустойчиво.
- source_word: ሮቤል … ስምዖን … ሌዊ … ይሁዳ
  choice: «Рувима, Симеона, Левия и Иуду»
  rationale: Использованы общеупотребительные русские библейские формы имён; винительный падеж сохраняет синтаксическую связь с глаголом из предшествующего контекста.
theological_decisions:
- issue: Адресат слов и смысл повреждённой заключительной фразы
  choice: 'Речь обращена к Иакову: «Войди к Валле»'
  alternative: '«И сказала Валле: „Вот Валла“»'
  rationale: Форма ወትቤሎ естественно понимается как «и сказала ему», тогда как заключительные слова, по-видимому, испорчены. Основной текст следует наиболее вероятной реконструкции, но альтернативное чтение сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Начало оставлено как продолжение предложения из предыдущего стиха, без добавления отсутствующего в данном фрагменте глагола.
