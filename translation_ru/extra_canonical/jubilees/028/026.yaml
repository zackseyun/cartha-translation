  text: the LORD saw that Leah was hated, while Rachel was loved. And Jacob again went in to
translation:
  language: ru
  text: Господь увидел, что Лию ненавидят, а Рахиль любят. Иаков снова вошёл к[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в следующем стихе, где названо, к кому вошёл Иаков.
    reason: Геэзский текст стиха оканчивается предлогом ኀበ («к»), а его дополнение стоит в начале стиха 27; примечание объясняет намеренно сохранённую незавершённость.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычный и достойный русский эквивалент эфиопского божественного титула; соответствует контексту и консультационному английскому тексту.
- source_word: ትጸላእ
  choice: ненавидят
  rationale: Передаёт сильное значение «быть ненавидимой», не ослабляя его до «не любят».
- source_word: ትትፈቀር
  choice: любят
  rationale: Естественно передаёт страдательное значение «быть любимой» и сохраняет противопоставление Лии и Рахили.
- source_word: ወደገመ
  choice: снова
  rationale: Передаёт повторность действия без тяжеловесного буквального оборота.
- source_word: ቦአ፡ ኀበ
  choice: вошёл к
  rationale: 'Сохраняет незавершённую предложную конструкцию исходного деления стихов: её объект назван в начале следующего стиха.'
theological_decisions:
- issue: Степень противопоставления отношения к Лии и Рахили
  choice: «Лию ненавидят, а Рахиль любят»
  alternative: «Лию любят меньше, чем Рахиль»
  rationale: Источник выражает прямую антитезу «ненавидима / любима»; смягчение до сравнительной степени устранило бы подлинное напряжение текста.
- issue: Субъект отношения к Лии и Рахили
  choice: безлично-множественная форма «ненавидят / любят»
  alternative: «Иаков ненавидел / любил»
  rationale: Русская форма естественно передаёт страдательные конструкции и не добавляет в пределах данного стиха явно не названного деятеля.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Сильное слово «ненавидят» сохранено, а необычный обрыв после «к» оставлен ради точного воспроизведения границы стихов и снабжён пояснением.
