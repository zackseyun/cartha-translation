lexical_decisions:
- source_word: አዕይንቲሃ
  choice: её глаза
  rationale: Буквально передаёт отдельный фрагмент «глаза её», не добавляя отсутствующего в данном сегменте сказуемого.
- source_word: ሠናይ፡ ራእያ
  choice: видом она была красива
  rationale: Слово ሠናይ стоит в единственном числе и относится к ራእያ («её вид, внешность»), а не к множественному አዕይንቲሃ («её глаза»). Русская конструкция естественно передаёт описание внешности.
- source_word: ወላሕይት፡ ጥቀ
  choice: и очень привлекательна
  rationale: 'Передаёт усиленное описание: ጥቀ означает «очень, весьма», а ላሕይት выражает привлекательность или миловидность.'
- source_word: ኢኮነ፡ ከመዝ
  choice: У нас так не делают
  rationale: Идиоматичный русский эквивалент формулы «не бывает/не делается так»; добавление «у нас» ясно передаёт местный обычай, раскрываемый продолжением речи, но не устраняет незавершённость сегмента.
