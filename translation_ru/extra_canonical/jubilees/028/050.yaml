translation:
  language: ru
  text: Иосифа — в новолуние четвёртого месяца, в шестой год этой четвёртой седмины. И в те дни, когда он родился…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሠርቅ፡ ወርኅ፡ ራብዕ
  choice: в новолуние четвёртого месяца
  rationale: В данной календарной формуле ሠርቅ обозначает начало месяца, то есть новолуние; это не указание на рассвет или четвёртый день.
- source_word: በሱባዔ፡ ዝንቱ፡ ራብዕ
  choice: этой четвёртой седмины
  rationale: Слово ሱባዔ буквально связано с семидневным или семилетним циклом; «седмина» сохраняет принятую в книге хронологическую терминологию и отличается от обычной недели.
- source_word: ወበመዋዕለ፡ ተወልደ
  choice: И в те дни, когда он родился…
  rationale: Конструкция имеет зависимый характер — «в дни, когда он родился» — и ведёт к продолжению, поэтому не превращена в самостоятельное законченное утверждение.
