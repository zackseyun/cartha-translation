  rationale: Точно передаёт женскую форму глагола и естественно завершает фразу по-русски.
theological_decisions:
- issue: Причинная связь между любовью к Рахили и тем, что Лия была отдана Иакову
  choice: потому что Лия была отдана ему
  alternative: хотя Лия была отдана ему
  rationale: Сохранено формально причинное значение текста без богословского или психологического сглаживания его необычной логики.
- issue: Божье участие в зачатии
  choice: Господь открыл утробу Лии
  alternative: Господь сделал Лию способной зачать
  rationale: Сохранён конкретный образ исходного текста и прямое действие Господа, без рационализирующей перефразировки.
