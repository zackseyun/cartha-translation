lexical_decisions:
- source_word: ሱባዔ፡ ራብዕ
  choice: четвёртой седмины
  rationale: Сохраняет характерный для книги Юбилеев хронологический термин «седмина», то есть период в семь лет; начальный родительный оборот продолжает предыдущее предложение.
- source_word: ደገመ፡ ቦአ፡ ኀቤሃ
  choice: он снова вошёл к ней
  rationale: Передаёт повторность действия и библейский эвфемизм исходного текста, не делая его более явным.
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ
  choice: она зачала и родила ему
  rationale: Близко воспроизводит последовательность глаголов и отношение, выраженное местоимением «ему».
- source_word: ወልደ፡ ካልአ
  choice: второго сына
  rationale: Естественный русский порядок слов при точной передаче значения.
- source_word: ወጸውዐት
  choice: и назвала…
  rationale: Форма означает «и она назвала/нарекла»; стих в предоставленном фрагменте обрывается до имени, поэтому незавершённость сохранена многоточием.
