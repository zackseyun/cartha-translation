translation:
  language: ru
  text: всех пёстрых овец, а также овец с пятнистыми отметинами и с тёмными пятнами; и они снова давали приплод
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዕ
  choice: овец
  rationale: Обычное обозначение овец; форма в данном перечислении понимается как множественное число.
- source_word: ጋሴ
  choice: пёстрых
  rationale: Передаёт характеристику неоднородной, крапчатой окраски, согласуясь с контекстом отбора животных по масти.
- source_word: ትእምርተ፡ ኵስኵሰ
  choice: с пятнистыми отметинами
  rationale: Сохраняет сочетание «отметина/знак» и указание на пятнистый рисунок, не сводя его к неопределённому «пятнистые».
- source_word: ሐመደ፡ ኵስኵሰ
  choice: с тёмными пятнами
  rationale: Передаёт вторую разновидность пятнистой окраски и отличает её от предшествующих пятнистых отметин.
- source_word: ወይደግማ
  choice: и они снова давали приплод
  rationale: По контексту размножения стад финальный глагол естественно передаётся как повторное принесение приплода; местоимение сохраняет невыраженный в форме русский субъект.
