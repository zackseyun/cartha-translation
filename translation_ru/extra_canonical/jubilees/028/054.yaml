  text: and take your wages.” And they agreed between themselves that he would give him as his wages every lamb
translation:
  language: ru
  text: «И возьми свою плату». Они договорились, что он будет давать ему в качестве платы каждого ягнёнка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждую овцу».'
    reason: Существительное በግዐ само по себе может обозначать овцу или животное из мелкого скота, хотя последующее እመሐስዕ указывает на молодняк.
lexical_decisions:
- source_word: ወንሣእ፡ ዐስበከ
  choice: «И возьми свою плату»
  rationale: Императив ንሣእ передан прямым побуждением «возьми», а суффикс второго лица в ዐስበከ — притяжательным «свою».
- source_word: ወተካሀሉ፡ በበይናቲሆሙ
  choice: И они договорились между собой
  rationale: Передаёт взаимный характер соглашения и прямое значение оборота «между собой».
- source_word: የሀቦ፡ ዐስቦ
  choice: он будет давать ему в качестве причитающейся ему платы
  rationale: 'Сохраняет два мужских референта глагольных форм и значение ዐስቦ с притяжательным суффиксом третьего лица: плата принадлежит получателю.'
- source_word: ኵሎ፡ በግዐ፡ እመሐስዕ
  choice: каждого ягнёнка
  rationale: ኵሎ задаёт распределительное «каждого», а እመሐስዕ уточняет, что речь идёт о молодняке стада, поэтому выбрано «ягнёнка», а не общее «овцу».
