- from: «И возьми свою плату». И они договорились между собой, что он будет давать ему в качестве причитающейся ему платы[b] каждого ягнёнка[a].
  to: «И возьми свою плату». Они договорились, что он будет давать ему в качестве платы каждого ягнёнка[a].
  rationale: Убрано невыраженное исходником «причитающейся» и упрощена синтаксическая конструкция. Оборот «давать ему в качестве платы» естественно передаёт, что ягнята составляют плату, предназначенную этому лицу; «каждого ягнёнка» сохраняет распределительное значение и уточнение молодняка. Избыточная сноска b удалена.
