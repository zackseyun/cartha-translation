  revision_rationale: Убрано невыраженное исходником «причитающейся» и упрощена синтаксическая конструкция. Оборот «давать ему в качестве платы» естественно передаёт, что ягнята составляют плату, предназначенную этому лицу; «каждого ягнёнка» сохраняет распределительное значение и уточнение молодняка. Избыточная сноска b удалена.
