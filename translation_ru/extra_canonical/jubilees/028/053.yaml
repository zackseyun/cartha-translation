  text: 'в дом моего отца». И Лаван сказал Иакову: «Останься у меня за плату — и снова паси для меня моё стадо».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንበር፡ ኀቤየ
  choice: Останься у меня
  rationale: Глагол ንበር передаёт пребывание или проживание; в обращении Лавана естественное русское «останься у меня» сохраняет смысл приглашения продолжить жить и работать у него.
- source_word: በዐስብከ
  choice: за плату
  rationale: Слово обозначает вознаграждение, плату или заработок; «за плату» кратко и ясно выражает условие дальнейшей службы.
- source_word: ወረዐይ፡ ሊተ፡ ካዕበ፡ መርዔትየ
  choice: и снова паси для меня моё стадо
  rationale: Сохранены значение повторности ካዕበ («снова»), адресат пользы «для меня» и пастушеский смысл глагола ረዐየ.
