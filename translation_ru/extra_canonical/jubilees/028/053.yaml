    issue: Неясная синтаксическая связь оборота «за плату»
    rationale: Без интонационного разделения оборот может восприниматься как плата за пребывание у Лавана, а не как условие дальнейшей службы Иакова. Тире сохраняет краткость и не добавляет отсутствующих в источнике деталей.
