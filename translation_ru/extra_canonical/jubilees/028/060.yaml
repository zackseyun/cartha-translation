lexical_decisions:
- source_word: እምኔሁ
  choice: от него
  rationale: Сохраняет предложное значение «от него» и фрагментарный синтаксис данного стиха.
- source_word: አስተሐየጸ
  choice: поступил коварно
  rationale: Передаёт действие обмана или вероломства естественным современным русским выражением.
- source_word: ለእኩይ
  choice: замышляя зло
  rationale: Явно сохраняет указание на зло или злой умысел, не подменяя его значением «по отношению к нему».
theological_decisions:
- issue: Направленность коварного поступка и значение ለእኩይ
  choice: «поступил коварно, замышляя зло»
  alternative: «поступил коварно по отношению к нему»
  rationale: В засвидетельствованном тексте ለእኩይ указывает на зло или злую цель; местоименное дополнение «к нему» здесь явно не выражено. Формулировка сохраняет злой умысел, не вводя отсутствующий объект.
translation_notes:
  register: Современный литературный русский язык; сохранён фрагментарный характер исходной строки. Выражение «замышляя зло» звучит естественно и передаёт злую направленность поступка без конфессионального истолкования.
