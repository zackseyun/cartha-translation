base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: ru
  text: И отец научил его письму. Затем он пошёл искать себе место, где мог бы захватить себе город. Он нашёл надпись, которую древние высекли на скале, и прочитал написанное в ней. Он переписал её и узнал из неё, что в ней содержится учение Стражей, по которому они наблюдали солнечные знамения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «предзнаменования солнца».'
    reason: Выражение может обозначать истолковываемые знаки или предзнаменования, связанные с солнцем.
lexical_decisions:
- source_word: መጽሐፈ
  choice: письму / надпись
  rationale: В первом употреблении слово обозначает письмо как навык, а во втором — письменный текст, высеченный на скале; контекстуальное разведение значений естественно по-русски.
- source_word: ይእኅዝ
  choice: основать
  rationale: Буквально глагол может означать «взять, овладеть»; в сочетании с городом и поиском места контекст допускает смысл «основать/занять». Неоднозначность отмечена в сноске.
- source_word: ወአዕለዎ
  choice: Он переписал её
  rationale: Передаёт действие копирования или переписывания текста, а не его понимания.
- source_word: ትጉሃን
  choice: Стражей
  rationale: Устоявшееся русское обозначение сверхъестественных Watchers в традиции Книги Юбилеев; написание с прописной буквы показывает, что это название группы.
- source_word: ሰገለ፡ ፀሓይ
  choice: солнечные знамения
  rationale: Сохраняет гадательно-прорицательный оттенок «предзнаменований/знаков солнца», не сводя выражение к нейтральным астрономическим наблюдениям.
theological_decisions:
- issue: Характер учения Стражей
  choice: учение Стражей, по которому они наблюдали солнечные знамения
  alternative: учение Стражей о наблюдении знаков солнца
  rationale: Сохранена связь учения с практикой Стражей без дополнительной оценки и без уточнения, было ли это астрономией, астрологией или гаданием.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан ясным для широкого читателя; повтор исходного «в ней» частично сохранён содержательно, но сглажен ради естественности. Все сноски отмечены в основном тексте.
