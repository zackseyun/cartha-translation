revisions:
- from: И отец научил его письму. Затем он пошёл искать себе место, где мог бы основать[a] свой город. Он нашёл надпись, которую древние высекли на скале, и прочитал написанное в ней. Он переписал её и узнал из неё, что в ней содержится учение Стражей, по которому они наблюдали солнечные знамения[b].
  to: И отец научил его письму. Затем он пошёл искать себе место, где мог бы захватить себе город. Он нашёл надпись, которую древние высекли на скале, и прочитал написанное в ней. Он переписал её и узнал из неё, что в ней содержится учение Стражей, по которому они наблюдали солнечные знамения[b].
  rationale: В основной текст возвращено значение овладения или захвата города, требуемое исходником; сноска a удалена, поскольку вариант «основать» не следует сохранять как равноправное чтение. Остальная формулировка и сноска о солнечных знамениях сохранены.
