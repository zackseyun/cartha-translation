    rationale: Геэзское ይእኅዝ передаёт взятие или овладение; английская аудиторская версия также имеет «seize». «Основать» меняет описываемое действие, а не просто сглаживает стиль. Поэтому сноска не устраняет проблему, пока этот вариант стоит в основном тексте.
