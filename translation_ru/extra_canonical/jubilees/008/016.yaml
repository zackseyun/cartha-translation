  source_fidelity: 'В целом перевод верно отражает исправления английского аудита: ድንጋጉ не передано как собственное имя, сохранены «граница этой реки», отдельные северные ориентиры, «от востока» и восточная сторона горы. Однако оборот «а от восточной стороны всей земли Эдема — ко всему востоку» синтаксически обрывается и затрудняет чтение. Его можно перестроить, не устраняя нарочито повторяющуюся географическую ориентацию оригинала. Примечание c не должно называть конструкцию неоднозначной: в данном контексте она указывает на восточную сторону горы.'
