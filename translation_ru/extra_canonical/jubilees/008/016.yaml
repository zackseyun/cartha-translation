  text: And it goes toward the border of this river, and it goes toward the east until it approaches the garden of Eden, toward its north, to the north, and from the east of all the land of Eden, and to all the east, and it turns within the east and comes until it approaches the east of the mountain whose name is
translation:
  language: ru
  text: И она идёт к границе этой реки[a], затем направляется на восток, пока не приблизится к саду Эдема, к его северной стороне, к северу[b]. От восточной стороны всей земли Эдема она идёт ко всему востоку. Затем она поворачивает на востоке и идёт, пока не приблизится к восточной стороне горы[c], имя которой…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в направлении границы этой реки».'
    reason: Передаёт направительное значение መንገበ и поясняет плотную географическую формулировку оригинала.
  - marker: b
    text: 'Буквально: «к её северу, к северу».'
    reason: Сохраняет повтор и местоименную форму оригинала, не превращая их в обозначение северо-востока.
  - marker: c
    text: 'Буквально: «в направлении восточной стороны горы».'
    reason: 'Поясняет направительное значение оборота: речь идёт о восточной стороне горы, а не просто о движении на восток к горе.'
lexical_decisions:
- source_word: መንገበ፡ ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: к границе этой реки
  rationale: መንገበ передаёт направление, а ድንጋጉ — «его/её граница, рубеж, берег»; это не собственное имя и не слово «дорога».
- source_word: መንገበ፡ ጽባሕ
  choice: направляется на восток
  rationale: Естественная русская передача направительного оборота при сохранении географической последовательности.
- source_word: ገነት፡ ዘኤዶም
  choice: Эдемский сад
  rationale: Устойчивое и понятное русское соответствие конструкции «сад Эдема».
- source_word: መንገበ፡ ሰሜኑ፡ ለሰሜን
  choice: с северной его стороны — к северу
  rationale: Сохранены и указание на северную сторону сада, и отдельное направление «к северу», без сведения их к «северо-востоку».
- source_word: ወእምጽባሒሃ፡ ለኵላ፡ ምድረ፡ ኤዶም
  choice: а от восточной стороны всей земли Эдема
  rationale: Предлог እም передан как «от»; местоименный суффикс отражён выражением «восточной стороны».
- source_word: ወይትመየጥ፡ ውስተ፡ ጽባሕ
  choice: затем она поворачивает в пределах востока
  rationale: Сохранён пространственный образ исходного текста; «в пределах» естественнее буквального «внутри» в описании границы.
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: к восточной стороне горы
  rationale: Оборот указывает на восток/восточную сторону горы, а не просто на движение к горе в восточном направлении.
