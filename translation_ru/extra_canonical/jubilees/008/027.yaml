base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: ru
  text: 'Ибо я вижу: вот, бесы уже начали совращать вас и ваших детей. И теперь я боюсь за вас: после моей смерти вы станете проливать человеческую кровь на земле и сами будете истреблены с лица земли.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: бесы
  rationale: Прямое обозначение злых духов; «бесы» естественно и традиционно звучит в русском библейском регистре.
- source_word: አበሱተ ወጠኑ
  choice: уже начали совращать
  rationale: Передаёт начинательный аспект и пагубное духовно-нравственное воздействие, не уточняя его сверх исходного текста.
- source_word: ትክዐዉ ደመ ሰብእ
  choice: станете проливать человеческую кровь
  rationale: Сохраняет библейскую идиому кровопролития и будущую направленность предостережения.
- source_word: ትደመሰሱ
  choice: будете истреблены
  rationale: Выражает полное уничтожение, соответствующее следующему обороту «с лица земли».
theological_decisions:
- issue: Характер воздействия бесов
  choice: «совращать»
  alternative: «вводить в заблуждение»
  rationale: «Совращать» сохраняет одновременно нравственный и духовный смысл и не сводит действие лишь к интеллектуальной ошибке.
- issue: Причинно-следственная связь между кровопролитием и уничтожением
  choice: Сохранено последовательное «и», без явного утверждения о прямом воздаянии
  alternative: «за что будете истреблены»
  rationale: Исходный текст ставит события рядом, но не формулирует причинную связь отдельным пояснительным союзом.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. Вводное «вот» сохраняет эмфатический оборот оригинала; местоимение «сами» передаёт акцент «и вы».
