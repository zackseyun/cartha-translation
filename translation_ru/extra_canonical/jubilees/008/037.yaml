  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: ru
  text: Перед жертвенником, который принимается[a]. А на пятый год они совершили отпущение, чтобы вы отпустили его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «который будет принят».'
    reason: Имперфектная форма допускает настоящее или будущее временное прочтение.
  - marker: b
    text: 'В тексте стоит: «они совершили»; возможно, следует читать как повеление: «совершите отпущение, чтобы вы отпустили его».'
    reason: Засвидетельствованная форма ገበሩ — 3-е лицо множественного числа, однако по контексту и последующему глаголу 2-го лица возможна конъектура ግበሩ, повелительное наклонение множественного числа.
lexical_decisions:
- source_word: ምሥዋዕ
  choice: жертвенник
  rationale: Геэзское ምሥዋዕ обозначает жертвенник; «жертва/приношение» обычно передаётся иной формой — መሥዋዕት.
- source_word: ዘይትወከፍ
  choice: который принимается
  rationale: Сохранено пассивное значение относительной формы и необычное сочетание с «жертвенником», без добавления подразумеваемого деятеля или богословского пояснения.
- source_word: ኅድገተ
  choice: освобождение
  rationale: Передаёт отглагольное существительное со значением отпущения, освобождения или оставления; выбран вариант, согласующийся с последующим глаголом.
- source_word: ታሕድግዎ
  choice: чтобы вы отпустили его
  rationale: Сохранены второе лицо множественного числа и местоименный объект мужского рода/общей отнесённости; конкретный референт в данном фрагменте не назван.
theological_decisions:
- issue: Смена лица между ገበሩ и ታሕድግዎ
  choice: «они совершили … чтобы вы отпустили»
  alternative: «совершите … чтобы вы отпустили»
  rationale: В основном тексте переведено засвидетельствованное ገበሩ как форма 3-го лица множественного числа. Возможная конъектура ግበሩ, устраняющая рассогласование и дающая повелительное наклонение, вынесена в примечание, а не внесена в текст молча.
translation_notes:
  register: Современный литературный русский с умеренно формальным, библейски достойным звучанием. Синтаксическая обрывочность первой фразы и неясность референта «его» сохранены, поскольку они присутствуют в предоставленном фрагменте; необычное рассогласование лиц не исправлено без явного примечания.
