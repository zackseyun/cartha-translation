base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: ru
  text: Человек в своих помыслах и желаниях постоянно замышляет суетное и злое, и Господь истребил всё с лица земли за их злые дела и за кровь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за пролитую кровь, или за кровопролитие.
    reason: Поясняет вероятный смысл буквального выражения «за кровь», не подменяя его в основном тексте.
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: помысел и желание человека
  rationale: Сохраняет два отдельных внутренних начала — мысль/помысел и желание — и родительную связь с «человеком».
- source_word: ይኄሊ
  choice: замышляют
  rationale: Передаёт активное значение «мыслить, воображать, замышлять», не сводя выражение к простой характеристике «были злы».
- source_word: ከንተ፡ ወእኩየ
  choice: суетное и злое
  rationale: 'Сохраняет оба дополнения: «тщетное/суетное» и «злое».'
- source_word: በኵሉ፡ መዋዕል
  choice: во все дни
  rationale: Формально отражает временное выражение источника и естественно передаёт постоянство.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እምነ፡ ገጸ፡ ምድር
  choice: и Господь истребил всё с лица земли
  rationale: Близко следует последовательности и образности исходного текста.
- source_word: በእንተ፡ ደም
  choice: за кровь
  rationale: Не добавляет отсутствующее в тексте уточнение «пролитую», сохраняя краткость и некоторую неоднозначность формулировки.
theological_decisions:
- issue: Характер человеческого внутреннего состояния
  choice: активное «замышляют суетное и злое»
  alternative: «были злы непрестанно»
  rationale: Источник содержит глагол мышления и отдельно называет как суетное, так и злое; более краткая альтернатива теряет эти элементы.
- issue: Значение «крови» как основания суда
  choice: сохранить буквальное «за кровь» с пояснением в сноске
  alternative: внести в текст «за пролитую кровь» или «за кровопролитие»
  rationale: Контекст допускает значение кровопролития, однако само исходное выражение буквально говорит о крови; сноска позволяет пояснить смысл без устранения исходной сжатости.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формулировка следует образам и синтаксическому движению источника, но остаётся понятной современному читателю.
