  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
translation:
  language: ru
  text: и человек — своего ближнего. И каждый продал себя, чтобы творить беззаконие и проливать много крови.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предыдущая редакция содержала здесь: «И Хам узнал, что отец проклял его младшего сына, и отделился от отца — он и его сыновья с ним: Куш, Мицраим, Пут и Ханаан». Этот текст относится к другому месту и не соответствует данной эфиопской строке.'
    reason: previous_rendering
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: и человек — своего ближнего
  rationale: Фрагментарная конструкция буквально передаёт «и человек — ближнего своего»; глагол, вероятно, находится в предшествующем контексте, поэтому он не восполняется без текстового основания.
- source_word: ኵሉ፡ ተሰይጠ
  choice: каждый продал себя
  rationale: Возвратная форма выражает добровольную отдачу себя; буквальный образ сохранён.
- source_word: ይግበር፡ ዐመፃ
  choice: творить беззаконие
  rationale: Передаёт целевую конструкцию и нравственно-религиозный смысл ዐመፃ без сужения до отдельного преступления.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: проливать много крови
  rationale: Сохранены библейская идиома «проливать кровь» и количественное определение «много».
theological_decisions:
- issue: Добровольность предания беззаконию
  choice: «продал себя»
  alternative: «был продан»
  rationale: Форма и консультационный перевод поддерживают возвратное значение; оно сохраняет нравственную ответственность действующих лиц.
- issue: Неясность начального фрагмента
  choice: не восполнять отсутствующий глагол
  alternative: добавить по предполагаемому контексту «убивал/ненавидел человек своего ближнего»
  rationale: Исходная строка не содержит такого глагола, поэтому восполнение необоснованно устранило бы подлинную текстовую неполноту.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской торжественности. Начало стиха оставлено синтаксически неполным, как в предоставленном источнике; тире обозначает пропуск сказуемого без его домысливания.
