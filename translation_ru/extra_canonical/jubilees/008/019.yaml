base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: ru
  text: «…Господь в жилище Сима».[a] И он узнал, что Эдемский сад — Святое святых и обитель Господа, гора Синай — посреди пустыни, а гора Сион — в самом пупе земли; эти три места были сотворены как святые места, обращённые друг к другу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза продолжает благословение из предыдущего стиха: «…и да обитает Господь в жилище Сима».'
    reason: Безглагольное начало стиха зависит от пожелательной формы в предыдущем контексте; примечание предотвращает ошибочное прочтение как отдельного утверждения.
lexical_decisions:
- source_word: መሓድሪሁ ለሴም
  choice: жилище Сима
  rationale: Сохраняет буквальный образ и связь с незавершённым благословением в предыдущем стихе.
- source_word: ገነት ኤዶም
  choice: Эдемский сад
  rationale: Естественное современное русское наименование при точной передаче исходного выражения.
- source_word: ቅድስተ ቅዱሳን
  choice: Святое святых
  rationale: Устоявшееся библейское соответствие превосходной степени святости.
- source_word: ማኅደሩ ለእግዚአብሔር
  choice: обитель Господа
  rationale: Передаёт место пребывания Бога в достойном литературном регистре и избегает навязчивого повторения слова «жилище».
- source_word: ማእከለ ሕንብርት ለምድር
  choice: в центре, у пупа земли
  rationale: Сохраняет одновременно указание на центральность и конкретный древний образ «пупа земли», не сглаживая его.
- source_word: መንጸረ ዝንቱ
  choice: обращёнными друг к другу
  rationale: Передаёт пространственное отношение трёх святынь; исходный текст в этой точке текстуально труден, поэтому выбрана формулировка, согласующаяся с контекстом и засвидетельствованной традицией перевода.
theological_decisions:
- issue: Начальный фрагмент и благословение предыдущего стиха
  choice: Сохранить его как цитатное продолжение без добавления глагола
  alternative: «Да обитает Господь в жилище Сима» или «Господь обитал в жилище Сима»
  rationale: Геэзский текст здесь безглагольный и завершает начатую ранее фразу с пожелательным глаголом. Самостоятельное прошедшее время искажало бы пророческое благословение, а восстановление глагола в основном тексте устраняло бы подлинную синтаксическую зависимость от предыдущего стиха.
- issue: Статус трёх мест
  choice: «были сотворены святыми»
  alternative: «были созданы как святые места»
  rationale: Более прямо сохраняет утверждение источника о сотворённой святости мест, не вводя дополнительного существительного как часть перевода.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Архаизмы сведены к устойчивым выражениям «Святое святых» и «пуп земли»; синтаксическая незавершённость начала намеренно сохранена и разъяснена сноской.
