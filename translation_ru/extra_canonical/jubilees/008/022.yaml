base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/022.yaml
  text: all the land of Eden, and all the land of the Erythraean Sea, and all the land of the east, and India, and on the Erythraean Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea beyond the mountains of Asshur toward the north—a blessed and spacious land, and all that is in it is very good.
translation:
  language: ru
  text: Вся земля Эдема, все земли у Эритрейского моря, вся восточная земля, Индия, земли у Эритрейского моря и его гор, вся земля Васана, вся земля Ливана с островами Кафтора, все горы Сенира и Аманы, горы Ассура на севере[a], все земли Элама, Ассура, Вавилона, Суз и Мидии, все горы Арарата и вся область за морем, по ту сторону гор Ассура, к северу, — земля благословенная и просторная, и всё, что в ней, весьма хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В более ранней передаче: «на юге».'
    reason: Сохраняет отмеченную в английском контрольном слое историю прежней передачи, не выдавая её за равновесный вариант проверенного геэзского чтения, которое указывает на север.
lexical_decisions:
- source_word: ኤዶም
  choice: Эдем
  rationale: Устоявшаяся русская библейская форма топонима.
- source_word: Эритрейское море (по контексту английского контрольного слоя)
  choice: Эритрейское море
  rationale: Сохранено древнее географическое название без преждевременного отождествления с конкретным современным морем.
- source_word: ቡርክት፡ ወስፍሕት
  choice: благословенная и просторная
  rationale: 'Передаёт оба согласованных определения земли: благословенность и обширность.'
- source_word: ጥቀ፡ ሠናይ
  choice: весьма хорошо
  rationale: Сохраняет усилительное наречие и оценочную формулу источника.
- source_word: Кафтор / Сенир / Амана / Ассур
  choice: Кафтор / Сенир / Амана / Ассур
  rationale: Использованы узнаваемые русские библейские формы древних топонимов.
theological_decisions:
- issue: Оценка удела как благословенной земли
  choice: земля благословенная и просторная
  alternative: плодородная и просторная земля
  rationale: Сохранена религиозно значимая семантика благословения, а не сведена к плодородию.
- issue: Направление гор Ассура
  choice: на севере
  alternative: на юге
  rationale: Последняя источниковедческая сверка указывает на геэзское выражение со значением северного направления; прежнее чтение «на юге» отмечено как вариант истории передачи.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего географического перечня; повторяющийся союз «и» сохранён как характерная структура исходного текста. Формулировка «земли вдоль Эритрейского моря» выбрана ради естественного русского синтаксиса и отличения от предшествующего более широкого обозначения «земля Эритрейского моря».
