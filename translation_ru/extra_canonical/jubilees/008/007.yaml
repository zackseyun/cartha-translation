base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: ru
  text: И в шестой год она родила ему сына, и он назвал его Фалеком,[a] потому что в его дни, когда он родился, сыновья Ноя начали делить землю между собой. Поэтому он назвал его Фалеком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Фалек (геэз ፋሌክ, Фалек) связано с еврейским корнем פלג (п-л-г), означающим «делить», «разделять»; здесь оно соотнесено с разделением земли.
    reason: lexical_choice
lexical_decisions:
- source_word: ፋሌክ
  choice: Фалек
  rationale: Использована традиционная русская библейская форма имени, соответствующая Пелегу в родословиях; этимологическая связь с разделением пояснена в сноске.
- source_word: ይትካፈሉ
  choice: делить
  rationale: Передаёт начавшееся распределение земли между сыновьями Ноя и сохраняет смысловую связь с именем Фалек.
- source_word: ደቂቀ፡ ኖኅ
  choice: сыновья Ноя
  rationale: Прямое и естественное соответствие исходному выражению; не расширено до более общего «потомки Ноя».
