  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: ru
  text: 'Вот сыновья Ноя. В двадцать восьмой юбилей и в седьмую седмину, когда Ной предписывал детям своих сыновей установления и заповеди и передавал им всё, что знал о справедливости,[a] он наставлял своих сыновей: творить праведность, прикрывать наготу своего тела, благословлять своего Создателя, почитать отца и мать, любить друг друга и беречь свои души от блуда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда Ной предписывал… и [передавал] всё, что знал о справедливости». Форму እንዘ обычно понимают как «когда» или «в то время как»; возможна также конъектура «начал [предписывать]», отражённая в некоторых переводах.'
    reason: Уточняет синтаксическую неоднозначность, не выдавая конъектурное понимание за буквальное чтение геэзского текста.
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ፡
  choice: установления и заповеди
  rationale: Передаёт различие между предписанным порядком/установлением и конкретной заповедью, сохраняя парную формулу источника.
- source_word: ፍትሐ፡
  choice: справедливости
  rationale: Слово может обозначать справедливость, правосудие или верное суждение; здесь речь идёт о нравственном наставлении Ноя, поэтому выбран широкий и естественный русский эквивалент.
- source_word: ጽድቀ፡
  choice: праведность
  rationale: Сохраняет отличие от ፍትሐ и передаёт нравственно-религиозный смысл повеления.
- source_word: ኃፍረተ፡ ሥጋሆሙ፡
  choice: наготу своего тела
  rationale: Буквально выражение связано со «стыдом плоти»; по смыслу обозначает наготу, которую следует прикрывать.
- source_word: አሐዱ፡ አሐዱ፡ ቢጾ፡
  choice: любить друг друга
  rationale: 'Буквально: «каждый — своего ближнего/товарища»; взаимная русская формула естественно передаёт смысл и не сужает его до кровных братьев.'
- source_word: ዝሙት፡
  choice: блуда
  rationale: Передаёт сексуальную безнравственность в сжатом, достоинственном и традиционно понятном русском выражении.
theological_decisions:
- issue: Характер наставления Ноя
  choice: он наставлял своих сыновей
  alternative: он свидетельствовал своим сыновьям
  rationale: Буквальное «свидетельствовал» в современном русском здесь неясно; «наставлял» передаёт торжественное нравственное увещание, не добавляя конфессиональной трактовки.
- issue: Объект взаимной любви
  choice: друг друга
  alternative: каждый своего брата
  rationale: Геэзское ቢጽ обозначает товарища, ближнего или другого человека и не требует значения кровного брата; более широкая формулировка сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Седмина», «праведность» и «блуд» сохраняют древний религиозно-нравственный колорит, а синтаксис упрощён для ясного чтения. Маркер сноски помещён непосредственно после спорной конструкции.
