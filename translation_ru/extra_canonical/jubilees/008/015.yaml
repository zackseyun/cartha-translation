  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: ru
  text: Это море называется языком Египетского моря. Оно тянется оттуда на север, до устья Великого моря, у кромки вод; затем идёт на запад, к Афре[a], и продолжается, пока не приблизится к водам реки Гихон[b], с северной стороны вод Гихона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «к западу от Афры».'
    reason: Сочетание направительного выражения с названием Афры допускает менее вероятное пространственное прочтение.
  - marker: b
    text: 'Возможно: «к водам Гихона».'
    reason: Слово «река» может относиться к географическому обозначению Гихона, а не входить непосредственно в словосочетание «воды реки Гихон».
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: заливом Египетского моря
  rationale: Буквально «языком Египетского моря»; в географическом описании «залив» естественно передаёт метафорическое обозначение вытянутой части моря.
- source_word: መንገበ፡ አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: к устью Великого моря
  rationale: Сохраняет географический термин «устье» и традиционное собственное наименование Великого моря.
- source_word: ውስተ፡ ክናፍረ፡ ማያት
  choice: вдоль кромки вод
  rationale: Буквально образное выражение связано с «губами/краями вод»; «кромка вод» передаёт его как обозначение береговой линии.
- source_word: መንገበ፡ ዐረብ፡ ዐፍራ
  choice: на запад, к Афре
  rationale: Передаёт направление ዐረብ и пункт назначения Афра, не превращая сочетание в «к западу от Афры».
- source_word: ማየ፡ ጊዮን፡ ፈለገ
  choice: к водам реки Гихон
  rationale: 'Передаёт все элементы выражения: воды, Гихон и река; синтаксическая связь в источнике допускает более буквальное прочтение, указанное в примечании.'
