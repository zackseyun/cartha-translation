revisions:
- from: Это море называется заливом Египетского моря. Оттуда граница поворачивает на север, к устью Великого моря, вдоль кромки вод, затем идёт на запад, к Афре[a], и продолжается, пока не приблизится к водам реки Гихон[b], с северной стороны вод Гихона.
  to: Это море называется языком Египетского моря. Оно тянется оттуда на север, до устья Великого моря, у кромки вод; затем идёт на запад, к Афре[a], и продолжается, пока не приблизится к водам реки Гихон[b], с северной стороны вод Гихона.
  rationale: Восстановлен образ «язык», непосредственно выраженный в геэзском тексте, и уточнено, что речь идёт о нахождении у кромки вод. Направление «на запад, к Афре» сохранено согласно английскому audit trail; обе сноски оставлены, поскольку они отмечают реальную синтаксическую неоднозначность, не навязывая её основному тексту.
