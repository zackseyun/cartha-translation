translation:
  language: ru
  text: Рафа. Граница спускается к северу, к берегу реки Тина.[a] Этот удел выпал по жребию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова, переданные как «к северу, к берегу», в геэзском тексте не вполне ясны; возможно также: «вдоль края, к реке Тина».'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: ራፋ
  choice: Рафа
  rationale: Сохранено как географическое название, стоящее в начале предоставленного текста стиха; по смыслу оно завершает предшествующее описание.
- source_word: ወይወርድ
  choice: Оттуда граница спускается
  rationale: Глагол передан в настоящем времени как часть описания границы; слово «граница» восстановлено из картографического контекста для естественного русского синтаксиса.
- source_word: መንገበ፡ ጽንፉ፡ ለመጻእ
  choice: на север, к берегу
  rationale: 'Передано в соответствии с наиболее вероятным географическим смыслом трудного чтения: направление на север и движение к краю или берегу.'
- source_word: ጢና፡ ፈለገ
  choice: реки Тина
  rationale: ፈለገ обозначает реку или поток, а ጢና сохранено как собственное имя.
- source_word: ዛቲ፡ መክፈልት፡ ወፅአት፡ በዕፁ
  choice: Этот удел выпал по жребию
  rationale: Идиоматично передано распределение территории посредством жребия без добавления отсутствующего здесь указания «на севере».
