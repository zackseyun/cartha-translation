base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: ru
  text: В двадцать девятом юбилее[a], в первую седмицу, в первый год этой седмицы, Арфаксад взял себе жену по имени Расуэя, дочь Сусан, дочери Элама, и она родила ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сорок девятом юбилее» — согласно буквальному чтению числовой записи в данном издании; хронология повествования поддерживает чтение «двадцать девятый».'
    reason: Текстологическая неопределённость числительного в печатном геэзском источнике.
  - marker: b
    text: Продолжение фразы находится в следующем стихе, где назван родившийся ребёнок.
    reason: Поясняет намеренно сохранённую незавершённость предложения на границе стихов.
lexical_decisions:
- source_word: በ፬ሥራ፡ ወተስዐቱ፡ እዮቤልው
  choice: в двадцать девятый юбилей
  rationale: Принято контекстуально и хронологически подтверждённое чтение «двадцать девятый»; видимое «сорок» в издании рассматривается как ошибка передачи числового знака. Формальная альтернатива отражена в сноске.
- source_word: በሱባዔ፡ ቀዳሚ
  choice: в первую седмицу
  rationale: «Седмица» сохраняет значение семилетнего периода в хронологической системе Книги Юбилеев; обычное «неделя» рядом с упоминанием года могло бы ввести читателя в заблуждение.
- source_word: ነሥአ፡ ሎቱ፡ አርፋክስድ፡ ብእሲተ
  choice: Арфаксад взял себе жену
  rationale: Передаёт идиоматическое значение глагольной конструкции естественным современным русским языком.
- source_word: ራሱእያ
  choice: Расуэя
  rationale: Русская транслитерация эфиопской формы личного имени без отождествления с иным библейским именем.
- source_word: ወለተ፡ ሱሳን፡ ወለተ፡ ኤላም
  choice: дочь Сусана, сына Элама
  rationale: 'В генеалогической цепочке одно и то же слово «дитя/потомок» грамматически согласуется с именами: Расуэя — дочь Сусана, а Сусан — сын Элама.'
- source_word: ወወለደት፡ ሎቱ
  choice: и она родила ему
  rationale: 'Сохранено незавершённое в пределах стиха управление: дополнение, называющее ребёнка, следует в следующем стихе.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Термин «седмица» выбран как понятное в контексте обозначение семилетнего периода; имена переданы в формах, близких к геэзскому тексту, кроме традиционного русского «Арфаксад».
