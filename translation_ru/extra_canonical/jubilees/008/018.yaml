  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: ru
  text: 'Симу и его сыновьям — владеть ею вечно, на все его поколения, навеки. И Ной обрадовался, потому что этот удел достался Симу и его сыновьям. Он вспомнил всё, что пророчески произнёс своими устами, ведь он сказал: «Благословен Господь, Бог Сима, и да обитает Он…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእኂዞታ
  choice: владеть ею
  rationale: Инфинитив с местоименным суффиксом непосредственно передаёт значение «чтобы владеть ею», не превращая форму в существительное «владение».
- source_word: መክፈልት
  choice: удел
  rationale: Слово обозначает выделенную долю земли; «удел» естественно передаёт контекст раздела территории по жребию.
- source_word: ወፅአ
  choice: достался
  rationale: Буквально глагол означает «вышел», но в контексте распределения уделов русское «достался» ясно передаёт результат жеребьёвки без неестественного буквализма.
- source_word: በአፉሁ
  choice: своими устами
  rationale: Сохранён конкретный образ исходного текста, хотя по-русски было бы возможно более краткое «произнёс».
- source_word: በትንቢት
  choice: пророчески
  rationale: Наречная передача естественно связывает выражение с речью Ноя и сохраняет указание на пророческий характер сказанного.
- source_word: ይኅድር
  choice: да обитает
  rationale: Юссивная форма передана пожелательной конструкцией; субъект не уточняется сверх того, что позволяет оборванный исходный фрагмент.
theological_decisions:
- issue: Субъект заключительного «да обитает»
  choice: Сохранено местоимение «Он» без поясняющего существительного
  alternative: «и да обитает Господь» либо иной явно названный субъект
  rationale: Исходный фрагмент заканчивается на глаголе и не устраняет полностью синтаксическую неоднозначность; явное называние субъекта внесло бы толкование в оборванную цитату.
- issue: Формула «Господь, Бог Сима»
  choice: «Благословен Господь, Бог Сима»
  alternative: «Да будет благословен Господь Бог Сима»
  rationale: Краткая именная формула сохраняет торжественный библейский строй и не добавляет отсутствующий глагол-связку.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальная синтаксическая незавершённость и многократное «навеки» сохранены, поскольку стих продолжает описание предыдущего стиха и подчёркивает непрерывность владения. Многоточие в конце обозначает, что предоставленный геэзский источник обрывается посреди высказывания.
