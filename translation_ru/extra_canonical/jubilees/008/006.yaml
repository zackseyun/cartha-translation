base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/006.yaml
  text: For he said, “I was indeed sent,” and in the fourth year Shelah was born and grew up; and he took for himself a wife, and her name was Melka, the daughter of Kebed, his father’s brother, in the first year of the fifth week of the thirty-first jubilee.
translation:
  language: ru
  text: 'Ибо он сказал: «Воистину, я был послан». И в четвёртый год родился и вырос Сала. Он взял себе жену по имени Мелка, дочь Кебеда, брата его отца, в первый год пятой седмины тридцать первого юбилея.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈንዎ፡ ተፈነውኩ
  choice: «Воистину, я был послан»
  rationale: Повтор однокоренных форм передан усилительной частицей «воистину», сохраняя смысл эмфатического утверждения без неестественного русского повтора.
- source_word: ወልህቀ
  choice: «и вырос»
  rationale: Глагол означает взросление или возрастание; он относится к Сале и не должен быть опущен.
- source_word: ሳላ
  choice: «Сала»
  rationale: Использована укоренившаяся русская библейская форма имени, соответствующая геэзскому Sālā.
- source_word: በቀዳሚ፡ ወበሠላስ፡ እዮቤልው፡ በሱባዔ፡ ኃምስ፡ በቀዳሚ፡ ዓመት
  choice: «в первый год пятой седмины тридцать первого юбилея»
  rationale: Числовая последовательность указывает на тридцать первый юбилей, пятую седмину и первый год; порядок адаптирован к естественному русскому синтаксису.
theological_decisions:
- issue: Связь слов «я был послан» с контекстом именования
  choice: Сохранить как прямую речь без пояснения происхождения имени
  alternative: Добавить, что эти слова объясняют имя Салы
  rationale: Сам стих не выражает эту связь явно; пояснение устранило бы сохранённую в источнике контекстуальную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Хронологический термин «седмина» выбран для обозначения семилетнего периода и различения его с обычной неделей.
