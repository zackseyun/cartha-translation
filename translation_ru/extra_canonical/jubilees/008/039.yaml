revisions:
- from: Он заповедал мне всё, что заповедали ему его отцы. И я также заповедаю вам, дети мои, как Енох заповедал своему сыну в первые юбилеи. Будучи ещё жив, в седьмом поколении, он давал повеления и свидетельствовал[a] своему сыну и детям своего сына до самого дня своей смерти.
  to: Он заповедал мне всё, что заповедали ему его отцы. И я также заповедаю вам, дети мои, как Енох, живший в седьмом поколении, заповедал своему сыну в первые юбилеи; он заповедовал и свидетельствовал[a] своему сыну и детям своего сына до самого дня своей смерти.
  rationale: Исправление восстанавливает повтор «заповедал / заповедаю / заповедал» и перестраивает фразу так, чтобы уточнение о седьмом поколении недвусмысленно относилось к Еноху. Значение, родственные связи, временная формула и сноска к አስምዐ сохранены.
