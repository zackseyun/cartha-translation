base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: ru
  text: Он заповедал мне всё, что заповедали ему его отцы. И я также заповедаю вам, дети мои, как Енох, живший в седьмом поколении, заповедал своему сыну в первые юбилеи; он заповедовал и свидетельствовал[a] своему сыну и детям своего сына до самого дня своей смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «давал услышать»; возможно также: «торжественно возвещал».'
    reason: Геэзский каузатив допускает как буквальное значение «дать услышать», так и контекстуальное «свидетельствовать, торжественно объявлять».
lexical_decisions:
- source_word: አዘዘ / እኤዝዘክሙ
  choice: заповедал / заповедаю вам
  rationale: Передаёт повторяющийся глагол со значением властного повеления или завещанного наставления и сохраняет его риторический повтор.
- source_word: በቀዳሚ፡ እዮቤልውሳት
  choice: в первые юбилеи
  rationale: Сохраняет множественное число и специфическую для книги систему исчисления времени, не подменяя её пояснительным толкованием.
- source_word: አስምዐ
  choice: свидетельствовал
  rationale: Каузатив от глагола «слышать» в данном наставительном контексте может означать торжественно свидетельствовать или объявлять; буквальная возможность отмечена в сноске.
- source_word: ወለውሉደ፡ ውሉዱ
  choice: и детям своего сына
  rationale: Прямо воспроизводит родственную цепочку исходного текста, не обобщая её как «потомкам».
theological_decisions:
- issue: Характер передачи повелений от отцов к сыновьям
  choice: Сохранена последовательность «заповедал — заповедаю — заповедал»
  alternative: Передать последующие формы как «наставлял» или «учил»
  rationale: Повтор глагола подчёркивает преемственность авторитетного предания и не должен быть ослаблен без текстовых оснований.
- issue: Значение አስምዐ
  choice: «свидетельствовал» с буквальной альтернативой в сноске
  alternative: «давал услышать» или «возвещал»
  rationale: «Свидетельствовал» естественнее в торжественном контексте, но сноска сохраняет внутреннюю форму и подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Синтаксис разделён на удобочитаемые предложения, при этом повтор ключевого глагола и неоднозначность последнего сказуемого сохранены.
