base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: ru
  text: И наполнилась земля насилием. После этого они согрешили против зверей, птиц и всего, что движется и ходит по земле, и много крови пролилось на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: насилием
  rationale: Передаёт насильственное беззаконие; соответствует контексту последующего пролития крови.
- source_word: አበሱ፡ ሎሙ
  choice: согрешили против
  rationale: Сохраняет нравственно-религиозный смысл глагола и направленность действия на живых существ.
- source_word: አራዊት
  choice: зверей
  rationale: Естественное русское обозначение наземных животных в паре с птицами.
- source_word: ዐዋፍ
  choice: птиц
  rationale: Прямой современный эквивалент.
- source_word: ዘይትሐወስ፡ ወዘያንሶሱ
  choice: всего, что движется и ходит
  rationale: Сохраняет два параллельных определения исходного текста, не сводя их к одному общему понятию.
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: много крови пролилось
  rationale: Естественная русская формула, точно передающая обильное пролитие крови.
theological_decisions:
- issue: Направленность греха против животных
  choice: согрешили против зверей, птиц
  alternative: грешили со зверями и птицами
  rationale: Предлог ሎሙ здесь передан как указание на тех, против кого совершён грех; это согласуется с контекстом насилия и кровопролития и не вносит более конкретного вида проступка, которого текст прямо не называет.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Сохранены повтор слова «земля» и последовательность образов исходного текста; синтаксис слегка выровнен для естественного русского звучания.
