base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/026.yaml
  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: ru
  text: 'которую они пролили посреди земли, — Он уничтожил всё; а в живых остались я, вы, дети мои, и все, кто вошёл с нами в ковчег. И вот теперь я вижу перед собой ваши дела: вы не ходите в праведности, но начали идти путём порока; вы отделяетесь каждый от своего ближнего, завидуете друг другу и не едины.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘከዐዉ
  choice: которую они пролили
  rationale: Относительная форма глагола означает «которую они вылили/пролили» и в контексте относится к крови из предыдущего стиха.
- source_word: ኵሎ
  choice: всё
  rationale: Форма без местоименного суффикса означает «всё», а не «их всех».
- source_word: ዘተሐውሩ
  choice: вы не ходите
  rationale: Имперфективная форма выражает настоящее или продолжающееся действие, а не завершённое прошлое.
- source_word: በፍኖተ ሙስና
  choice: путём порока
  rationale: «Путь» стоит в единственном числе; «порок» естественно передаёт нравственное разложение и уклонение от должного пути.
- source_word: ትትፋለጡ
  choice: вы отделяетесь
  rationale: Сохраняет значение взаимного разобщения, уточнённое далее словами «каждый от своего ближнего».
- source_word: ትትቃነኡ
  choice: завидуете друг другу
  rationale: Передаёт взаимную зависть или ревность без добавления конфессионального толкования.
- source_word: ኢትሄልዉ ኅቡረ
  choice: не живёте вместе в единстве
  rationale: Передаёт как совместность, так и противопоставленное разобщению единство.
theological_decisions:
- issue: Субъект уничтожения после пролития крови
  choice: Он уничтожил всё
  alternative: Бог уничтожил всё
  rationale: Местоименное обозначение сохраняет связность с предшествующим контекстом и не добавляет имени, отсутствующего в данном фрагменте; прописная буква делает референцию ясной.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Начальная строчная буква намеренно сохраняет синтаксическую связь с предыдущим стихом. Образ «ходить в праведности» сохранён как библейская метафора; остальная фраза сформулирована естественно и понятно.
