- source_word: በዓመተ፡ ሣልስ፡ በሱባዔ፡ ዝንቱ
  choice: в третий год этой седмины
  rationale: Сохраняет юбилейную хронологическую формулу оригинала; «седмина» обозначает семилетний период и звучит уместно в библейско-хронологическом контексте.
