  text: '...and the moon and the stars in all the signs of heaven. And he wrote it down and said nothing about it...'
translation:
  language: ru
  text: …и луны, и звёзд во всех знамениях неба. Он записал это и ничего об этом не сказал[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном эфиопском тексте буквально: «и рассказал об этом»; перевод «ничего об этом не сказал» предполагает исправление одной буквы в слове.'
    reason: 'Текстологически значимая эмендация: в источнике ወአነገረ («и рассказал»), вероятное чтение — ወኢነገረ («и не рассказал»).'
lexical_decisions:
- source_word: ትእምረ፡ ሰማይ
  choice: знамениях неба
  rationale: ትእምርት обозначает знак или знамение; в данном астрономическом контексте «знамения неба» сохраняет предметную широту выражения и не сводит его исключительно к созвездиям.
- source_word: ወጸሐፋ
  choice: Он записал это
  rationale: Форма передаёт действие письма; местоименное дополнение естественно восстанавливается по контексту в русском языке.
- source_word: ወአነገረ፡ በእንቲአሃ
  choice: и ничего об этом не сказал
  rationale: 'Перевод следует вероятной исправленной форме ወኢነገረ, принятой при разметке стиха: имеющееся чтение без отрицания, вероятно, возникло из-за пропуска ኢ.'
theological_decisions:
- issue: Отрицание при глаголе «сказать/рассказать»
  choice: Основной текст передаёт вероятную эмендацию «не сказал»
  alternative: 'Рукописное чтение представленного текста: «и рассказал об этом»'
  rationale: Предоставленный текст буквально не содержит отрицания, однако контекст и история пересмотра указывают на вероятную описку ወአነገረ вместо ወኢነገረ. Поскольку эмендация существенна, рукописное чтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Начальное и конечное многоточия сохраняют фрагментарность предоставленного сегмента и его переход через границы стихов.
