base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
translation:
  language: ru
  text: Вы живите в праведности и прямоте, будьте праведны, и всё, что вы посадите, будет процветать. Ибо так Енох, отец отца вашего,[a] повелел Мафусалу, своему сыну; Мафусал повелел Ламеху, своему сыну, а Ламех…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное прочтение: «Енох повелел вашему отцу, Мафусалу».'
    reason: Сохраняет отмеченную в английском аудиторском следе возможность иного синтаксического членения. Основной текст следует формальному разбору предоставленного эфиопского текста, где отдельно названы «отец вашего отца» и «Мафусал, его сын».
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ
  choice: праведно и честно
  rationale: Передаёт сочетание праведности и прямоты/честности естественным современным русским языком, не сливая два понятия.
- source_word: ወትጸድቁ
  choice: и будете праведны
  rationale: Сохраняет отдельное утверждение исходного текста и его повтор корня «праведность», не подменяя его конфессионально нагруженным «оправдаетесь».
- source_word: ወይረተው፡ ኵሉ፡ ተክሊክሙ
  choice: и всё посаженное вами будет процветать
  rationale: «Посаженное вами» естественно передаёт образ насаждений и допускает как буквальное, так и образное понимание; «будет процветать» следует смыслу консультационного перевода.
- source_word: አቡሁ፡ ለአቡክሙ
  choice: отец вашего отца
  rationale: Формально сохраняет явное генеалогическое определение Еноха в представленном эфиопском тексте, несмотря на его необычность в контексте родословия.
- source_word: አዘዘ
  choice: заповедал
  rationale: Передаёт авторитетное наставление предка и хорошо сочетается с цепью передачи повеления.
theological_decisions:
- issue: Соотношение праведного поведения и состояния праведности
  choice: «поступайте праведно и честно — и будете праведны»
  alternative: «в праведности и прямоте будьте праведны»
  rationale: Выбранная формулировка делает фразу понятной по-русски, но сохраняет последовательность исходника и не объясняет догматически, каким образом поведение связано с праведностью.
- issue: Необычное обозначение Еноха в родословной
  choice: Сохранить «Енох, отец вашего отца»
  alternative: «Енох заповедал вашему отцу Мафусалу»
  rationale: Альтернатива сглаживает фразу, но утрачивает отдельно выраженные в источнике определение Еноха и указание на Мафусала как его сына.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Генеалогическая цепь передана параллельными конструкциями. Многоточие сохранено, поскольку предоставленный исходный фрагмент обрывается после упоминания Ламеха.
