  terminology: «Седмина» уместна для семилетнего периода в хронологии Юбилеев. Имена «Мелка», «Мадай», «Иафет» и «Сала» последовательно переданы. Сноска верно отмечает грамматически мужской субъект и не выдаёт альтернативное прочтение за несомненный смысл.
