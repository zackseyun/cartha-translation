translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Хронологический термин «седмина» выбран для семилетнего периода; уточнение «той седмины» естественно раскрывает местоименную отсылку геэзского текста. Все имена переданы в формах, соответствующих русскому синтаксису.
