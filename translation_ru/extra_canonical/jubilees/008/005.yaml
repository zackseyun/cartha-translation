base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: ru
  text: Ибо он боялся рассказать об этом Ною, чтобы тот не разгневался на него из-за этого. В пятый юбилей, в первую седмину, в первый год он взял себе жену по имени Мелка, дочь Мадая, сына Иафета. В четвёртый год той седмины он породил сына[a] и назвал его Салой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «породил сына»; глагол в геэзском тексте стоит в форме мужского рода. Возможен также перевод: «она родила ему сына».'
    reason: Сохраняет грамматически выраженный мужской субъект оригинала и отмечает распространённую альтернативную передачу.
lexical_decisions:
- source_word: ይፈርህ
  choice: боялся
  rationale: Передаёт значение страха без усиления до ужаса или робости.
- source_word: ይትመዐዐ
  choice: не разгневался
  rationale: Точно передаёт возможный гнев Ноя; сослагательно-предупредительная конструкция выражена через «чтобы… не».
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологии Книги Юбилеев обозначает семилетний период; «седмина» сохраняет особый календарный смысл и остаётся понятной в контексте.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: взял себе жену
  rationale: Естественная русская передача устойчивого брачного выражения, сохраняющая возвратное значение ሎቱ.
- source_word: ወሊደ፡ ወልደ
  choice: стал отцом сына
  rationale: Форма глагола имеет мужской субъект; перевод сохраняет это, избегая неестественного русского «родил сына».
- source_word: ሳላ
  choice: Сала
  rationale: Русская передача геэзской формы имени; в косвенном падеже в тексте употреблено «Салой».
