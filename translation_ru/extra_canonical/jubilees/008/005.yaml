  source_fidelity: 'Содержание передано точно: страх сообщить Ною, опасение его гнева, датировка, брак с Мелкой, её происхождение, мужской субъект глагола «родил/породил» и наречение Салы сохранены. Местоименная отсылка в «в четвёртый год той седмины» обоснованно относится к седмине, а не к жене.'
