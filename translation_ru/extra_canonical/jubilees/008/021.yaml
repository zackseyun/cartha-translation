base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: ru
  text: 'и Господь — навеки.[a] И он знал, что благословенная доля и благословение[b] достались Симу и его потомкам на вечные поколения: вся земля Эдома, вся земля Красного моря, все земли Востока и Индия, в Эритрейском море и его горах, вся земля Васана, вся земля Ливана и острова Кафтора, все горы Сенира и Аманы, горы Ассура на юге, вся земля Элама, Ассура и Вавилона, а также Сузы и Мидия, все горы Арарата и вся область за морем, за горами Ассура, к северу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова завершают предложение предыдущего стиха, но входят в предоставленный исходный текст данного стиха.
    reason: verse_boundary
  - marker: b
    text: 'Буквально: «доля благословения и благословение».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: благословенная доля и благословение
  rationale: Передаёт оба однокоренных понятия — долю, связанную с благословением, и само благословение — не вводя отсутствующего в источнике значения «обширная».
- source_word: ባሕረ፡ ኤርትራ
  choice: Красное море / Эритрейское море
  rationale: В первом упоминании выбран привычный современному читателю географический эквивалент «Красное море», а во втором сохранено историческое название «Эритрейское море», поскольку исходный перечень различает соответствующие формулировки.
- source_word: ባሳ
  choice: Васан
  rationale: Использована устоявшаяся русская библейская форма топонима Башан/Васан.
- source_word: ከፍቸር
  choice: Кафтор
  rationale: Использована традиционная русская форма древнего топонима Caphtor.
- source_word: አሱር
  choice: Ассур
  rationale: Форма сохраняет возможность понимать название как обозначение Ассирии или связанного с ней региона, не подменяя его современным географическим термином.
- source_word: ማዕዳይ
  choice: Мидия
  rationale: Передано традиционным русским названием страны мидян.
theological_decisions:
- issue: Субъект глагола ወአእመረ («и он знал»)
  choice: Сохранено местоимение «он»
  alternative: Назвать Ноя прямо
  rationale: В данном фрагменте имя субъекта не повторено; местоимение сохраняет структуру и не добавляет явного уточнения сверх источника.
- issue: Начальный фрагмент ወእግዚአብሔር፡ እስከ፡ ለዓለም
  choice: Переведён в начале стиха как окончание предшествующего предложения
  alternative: Опустить как относящийся к предыдущему стиху
  rationale: Фраза присутствует в предоставленном исходном сегменте и потому не должна быть утрачена, хотя синтаксически завершает предыдущий контекст.
translation_notes:
  register: Современный литературный русский с достоинством библейского географического перечня. Повторы «вся земля» и «все горы» сохранены как важная риторическая и структурная черта источника; названия переданы преимущественно в традиционных русских библейских формах.
