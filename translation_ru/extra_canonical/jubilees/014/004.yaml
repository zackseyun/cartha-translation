translation:
  language: ru
  text: 'но тот, кто произойдёт из твоего чрева, — он будет твоим наследником». И Он вывел его наружу и сказал ему: «Посмотри'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  choice: тот, кто произойдёт из твоего чрева
  rationale: Передаёт исходное выражение буквально и естественно для торжественного повествования; «чрево» сохраняет телесный и родовой образ, не сужая его до более толковательного «родной сын».
- source_word: ይወርሰከ
  choice: станет твоим наследником
  rationale: По-русски это естественнее буквального «унаследует тебя» и соответствует смыслу глагола в данном контексте наследования.
- source_word: ወአውፅኦ፡ አፍአ
  choice: И Он вывел его наружу
  rationale: Сохраняет последовательность и субъект повествования; прописная буква у местоимения ясно указывает на Бога в русской религиозной письменной традиции.
- source_word: ነጽር
  choice: Посмотри
  rationale: Простой современный императив точно передаёт призыв обратить взгляд; многоточие показывает, что стиховой фрагмент обрывается на начале прямой речи.
theological_decisions:
- issue: Характер обещанного наследника
  choice: сохранить образ происхождения «из твоего чрева»
  alternative: «твой родной сын» / «тот, кто произойдёт от тебя»
  rationale: Исходный текст подчёркивает телесное происхождение; перевод не должен заранее уточнять или ослаблять этот образ.
- issue: Обозначение Бога местоимением
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы
  rationale: В контексте субъектом является Бог; прописная буква соответствует достоинству русского библейского регистра, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис близок к исходному, но выражение о наследовании дано идиоматично. Незавершённость последнего повеления сохранена многоточием, поскольку предоставленный стиховой сегмент заканчивается словом «Посмотри».
