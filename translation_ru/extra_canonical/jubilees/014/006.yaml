translation:
  language: ru
  text: 'звёзды. И сказал ему: «Таким будет твоё потомство[a]». И он поверил Господу, и это было зачтено ему как праведность[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя».'
    reason: Сохраняет доступ к конкретному образу оригинала, тогда как основной текст передаёт его контекстуальное значение.
  - marker: b
    text: Буквально заключительная фраза не называет прямо ни того, что было зачтено, ни того, кому это было зачтено; оба элемента понятны из контекста.
    reason: Отмечает грамматическую сжатость геэзского текста и показывает, где русский перевод ради ясности восполняет подразумеваемые элементы.
lexical_decisions:
- source_word: ዘርእከ (zarʾəka)
  choice: твоё потомство
  rationale: Буквально «твоё семя»; в данном обещании слово обозначает потомков. «Потомство» ясно для современного читателя и не сужает значение до одного непосредственного наследника.
- source_word: ወአምኖ፡ ለእግዚአብሔር
  choice: И он поверил Господу
  rationale: Передаёт доверие слову Господа без добавления богословского толкования; дательный падеж естественно соответствует конструкции с ለ.
- source_word: ወተኈለቍ፡ ጽድቀ
  choice: и это было зачтено ему как праведность
  rationale: «Зачтено» передаёт идею исчисления/признания, а оборот «как праведность» сохраняет различие между верой и праведностью, не объясняя способ их соотнесения.
theological_decisions:
- issue: Что именно было зачтено как праведность
  choice: это было зачтено ему как праведность
  alternative: вера была зачтена ему как праведность
  rationale: Источник не называет существительным подлежащее заключительного оборота. Указательное «это» отсылает к предшествующему доверию Авраама, но не делает неявное явным и не устраняет богословскую напряжённость.
- issue: Передача формулы праведности
  choice: как праведность
  alternative: в праведность
  rationale: «Как праведность» звучит естественно по-русски и сохраняет смысл признания или засчитывания, не уточняя, является ли речь о статусе, качестве или результате.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальное слово со строчной буквы сохранено как продолжение предложения из предыдущего стиха. Архаизм «семя» вынесен в примечание; основной текст остаётся понятным широкому читателю.
