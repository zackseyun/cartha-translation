  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: ru
  text: 'Елиезер — он унаследует меня, а Ты не дал мне потомства». И Он сказал ему: «Этот не унаследует тебя»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይወርሰኒ
  choice: унаследует меня
  rationale: Сохраняет прямую конструкцию геэзского текста и связь с речью о наследнике, не подменяя её более истолковывающим «станет моим наследником».
- source_word: ዘርአ
  choice: потомства
  rationale: Буквально «семя»; в данном контексте слово обозначает потомство. Современное русское «потомство» ясно передаёт смысл без ненужной физиологической окраски.
- source_word: ውእቱ
  choice: он
  rationale: 'Явное местоимение после имени передано отдельно; тире сохраняет эмфатическое выделение: «Елиезер — он…».'
- source_word: ኢይወርስከዝ
  choice: Не он унаследует тебя
  rationale: Отрицание и указательное/эмфатическое значение переданы естественной русской конструкцией, сохраняющей противопоставление будущему наследнику.
theological_decisions:
- issue: Кто говорит Авраму в заключительной фразе
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы
  rationale: По контексту ответ принадлежит Богу; прописная буква соответствует принятому русскому библейскому употреблению, не добавляя имени, отсутствующего в данном фрагменте.
- issue: Значение наследования человека
  choice: сохранено «унаследует меня / тебя»
  alternative: «будет моим / твоим наследником»
  rationale: Источник допускает прямое выражение, которое несёт одновременно юридический и личный оттенок; его не следует без необходимости сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксическая обрывочность конца стиха сохранена запятой, поскольку фрагмент продолжается в следующем стихе. Все местоимения, относящиеся к Богу, оформлены с прописной буквы по русской библейской традиции.
