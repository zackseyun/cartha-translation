  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: ru
  text: И народ, которому они будут служить, Я также подвергну суду; после этого они выйдут оттуда с большим имуществом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ፡
  choice: И народ… также
  rationale: Энклитика -ኒ передаёт добавочное значение «также»; союз ወ естественно передан как «и».
- source_word: ይትቀነዩ፡
  choice: которому они будут служить
  rationale: Имперфект в пророческом контексте имеет будущее значение. Глагол допускает оттенок подневольного служения, однако нейтральное «служить» сохраняет формальную близость и не усиливает смысл без необходимости.
- source_word: እፈትሖሙ፡ ሎሙ፡
  choice: Я … подвергну суду
  rationale: Идиоматически выражает Божий суд над этим народом; такое русское сочетание сохраняет судебную семантику без неестественного буквального оборота.
- source_word: ጥሪት፡ ብዙኅ።
  choice: с большим имуществом
  rationale: ጥሪት обозначает имущество, собственность или достояние; «имущество» точно и естественно в данном контексте.
theological_decisions:
- issue: Характер будущего служения потомков Аврама
  choice: «будут служить»
  alternative: «будут порабощены»
  rationale: Исходный глагол связан со служением и подчинением. «Будут служить» сохраняет лексическую широту и не устраняет подразумеваемую подневольность, раскрываемую контекстом.
- issue: Смысл Божьего действия в отношении народа
  choice: «подвергну суду»
  alternative: «буду судить»
  rationale: Обе передачи возможны; выбранная формулировка ясно выражает вынесение и осуществление суда и звучит естественно в современном литературном русском.
translation_notes:
  register: Современный литературный русский с библейской торжественностью; синтаксис ясен для широкого читателя, местоимение «Я» в прямой Божьей речи написано с прописной буквы.
