  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: ru
  text: И прошёл тот день, и Аврам вознёс рассечённые части, птиц, хлебные приношения и возлияния, и огонь поглотил всё это.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀለፈ፡ ይእቲ፡ ዕለት
  choice: прошёл тот день
  rationale: Прямо передаёт временную формулу, сохраняя повествовательный порядок оригинала.
- source_word: አዕረገ
  choice: вознёс
  rationale: Культовый глагол буквально выражает поднятие/вознесение приношения; русский вариант сохраняет сакральный оттенок и не сводит действие просто к принесению.
- source_word: ክፍላተ
  choice: рассечённые части
  rationale: В контексте обряда Быт 15 речь идёт о частях рассечённых животных; уточнение делает подразумеваемое значение естественным по-русски.
- source_word: መሥዋዕቶሙ
  choice: хлебные приношения
  rationale: В паре с возлияниями термин обозначает сопровождающие пищевые, вероятнее всего мучные/хлебные, приношения; этот перевод сохраняет культовую точность и избегает тавтологии с частями жертв.
- source_word: ሞጻሕቶሙ
  choice: возлияния
  rationale: Стандартное и понятное русское обозначение жидких культовых приношений.
- source_word: በልዐቶሙ፡ እሳት
  choice: огонь поглотил всё это
  rationale: Передаёт образное «съел их огонь» естественной русской культовой формулой; «всё это» ясно соотносится со всем перечнем.
theological_decisions:
- issue: Характер መሥዋዕቶሙ рядом с возлияниями
  choice: хлебные приношения
  alternative: жертвы
  rationale: Более узкое культовое значение лучше согласуется с парой «приношения и возлияния» и не создаёт впечатления, будто ранее названные части и птицы отличаются от собственных жертв Аврама.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм оригинала сохранён без архаизмов; имя передано как «Аврам» согласно данному этапу повествования.
