  yaml_path: translation/extra_canonical/jubilees/014/022.yaml
  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: ru
  text: И в этот день мы заключили завет с Аврамом[a], как заключили его в этом месяце с Ноем; и Аврам возобновил его как праздник и как установление для себя навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Форма первого лица множественного числа («мы заключили завет») отражает представленное в Книге Юбилеев небесное посредничество. Вероятно, здесь в рамках откровения Моисею говорит ангел-повествователь.
    reason: cross_reference
lexical_decisions:
- source_word: ተካየድነ፡ ኪዳነ
  choice: мы заключили завет
  rationale: Передаёт форму первого лица множественного числа и устойчивое русское сочетание «заключить завет».
- source_word: ሐደሶ
  choice: возобновил его
  rationale: Сохраняет идею обновления ранее заключённого завета; местоимение естественно отсылает к завету.
- source_word: በበዓል
  choice: как праздник
  rationale: Передаёт значение установленного праздничного соблюдения без добавления конфессиональной терминологии.
- source_word: ለሥርዓት፡ ሎቱ
  choice: как установление для себя
  rationale: Сохраняет нормативный смысл ሥርዓት и личную соотнесённость выражения ሎቱ.
- source_word: እስከ፡ ለዓለም
  choice: навеки
  rationale: Естественный и точный русский эквивалент формулы постоянной длительности.
theological_decisions:
- issue: Первое лицо множественного числа в словах о заключении завета
  choice: Сохранено буквальное «мы заключили» с пояснением в сноске.
  alternative: Заменить на «Бог заключил» или «был заключён завет».
  rationale: Исходный текст выраженно использует первое лицо множественного числа; его устранение разрешило бы заложенную в повествовании неоднозначность и изменило бы небесную посредническую рамку книги.
- issue: Отношение праздника и установления к завету
  choice: 'Сохранены две параллельные характеристики: «как праздник и как установление».'
  alternative: Истолковать фразу как учреждение конкретного названного праздника.
  rationale: Стих сам не называет праздник, поэтому перевод не вводит более определённую идентификацию, чем позволяет источник.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет торжественный библейский ритм, оставаясь понятным. Имя «Аврам» выбрано согласно данному этапу повествования.
