lexical_decisions:
- source_word: ይከልኦሙ
  choice: отгонял их
  rationale: По контексту речь идёт о птицах, слетавшихся к рассечённым жертвенным животным; форма передаёт действие Аврама, препятствующего им.
- source_word: ኢየኀድጎ
  choice: не позволял
  rationale: Естественно передаёт отрицание разрешения или допущения действия.
- source_word: ይልከፍዎሙ
  choice: касаться рассечённых частей
  rationale: Глагол означает прикосновение/посягательство; местоименный объект относится к ранее названным частям жертвенных животных, что в русском уточнено ради ясности.
- source_word: ዐርበት፡ ፀሐይ
  choice: солнце заходило
  rationale: Обычное современное русское выражение для заката, сохраняющее временную придаточную конструкцию источника.
