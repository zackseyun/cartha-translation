lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычная и достойная передача геэзского обозначения Господа в прямой божественной речи.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ур Халдейский
  rationale: Устоявшаяся русская библейская форма названия «Ур халдеев», естественная для данного контекста.
- source_word: እሀብከ፡ ምድረ፡ ዛቲ፡ ትረሳ
  choice: дать тебе эту землю в наследие
  rationale: Передаёт цель дарования земли и смысл наследования без тяжеловесного буквального повтора «дать… чтобы ты унаследовал её».
theological_decisions:
- issue: Говорящий обозначает Себя как Господа и инициатора исхода Авраама
  choice: Сохранена прямая формула «Я — Господь, Который вывел тебя»
  alternative: «Я, Господь, вывел тебя»
  rationale: Выбранная конструкция сохраняет самооткровение и относительное придаточное исходного текста, не добавляя богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской издательской традиции; синтаксис остаётся ясным для обычного читателя.
