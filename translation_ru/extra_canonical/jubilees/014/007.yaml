  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: ru
  text: 'И Он сказал ему: «Я — Господь, Который вывел тебя из Ура Халдейского, чтобы дать тебе эту землю[a] в наследие».'
