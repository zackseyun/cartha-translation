lexical_decisions:
- source_word: ከናናዊያን
  choice: хананеев
  rationale: Передаёт этноним в родительном падеже и сохраняет синтаксическую связь с началом фразы в предыдущем стихе.
- source_word: ለእኂዝ፡ ለዓለም
  choice: во владение навеки
  rationale: Инфинитив со значением обладания передан естественной русской именной конструкцией; ለዓለም выражает бессрочность — «навеки».
- source_word: ወለከዊነ፡ ለከ፡ አምላከ
  choice: и быть Богом тебе
  rationale: Сохранена прямая инфинитивная конструкция источника без добавления модального оттенка возможности или намерения.
- source_word: ወለዘርእከ፡ እምድኅሬከ
  choice: и твоему потомству после тебя
  rationale: «Потомство» естественно передаёт коллективное значение «семени», а «после тебя» сохраняет временно-преемственный смысл.
- source_word: ወይቤ
  choice: 'И он сказал:'
  rationale: Стандартная повествовательная формула; двоеточие указывает, что речь продолжается в следующем стихе.
theological_decisions:
- issue: Формула отношений Бога с Авраамом и его потомством
  choice: быть Богом тебе и твоему потомству
  alternative: стать твоим Богом и Богом твоего потомства
  rationale: Выбранная формулировка ближе к форме источника и не привносит предположения о смене прежнего состояния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная строчная буква и фрагментарность сохранены, поскольку стих продолжает предложение предыдущего стиха; искусственно добавлять слово «землю», отсутствующее в данном отрывке, не потребовалось.
