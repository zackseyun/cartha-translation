  language: ru
  text: 'И Аврам обрадовался и рассказал обо всём этом своей жене Саре. Он поверил, что у него будет потомство, хотя она не рожала. И Сара дала совет своему мужу Авраму, сказав ему: «Войди к Агари, моей служанке-египтянке; быть может, через неё я устрою тебе потомство». Аврам послушался своей жены Сары и сказал ей: «Так и сделай». И она взяла её,'
