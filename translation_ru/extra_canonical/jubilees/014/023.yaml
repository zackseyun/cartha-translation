lexical_decisions:
- source_word: ዘርእ / ዘርአ
  choice: потомство
  rationale: Передаёт значение «семя, потомство» естественным современным русским словом и сохраняет связь обоих употреблений в стихе.
- source_word: ባእ፡ ኀበ፡ አጋር
  choice: войди к Агари
  rationale: Сохраняет библейский эвфемизм для половой близости, не делая выражение ни грубее, ни более прямым, чем оригинал.
- source_word: አሐንጽ፡ ለከ፡ ዘርአ፡ እምኔሃ
  choice: через неё я устрою тебе потомство
  rationale: Глагол буквально связан с построением или созиданием; «устрою» сохраняет этот образ в приемлемой для современного русского форме, а «через неё» передаёт посредническую роль Агари.
- source_word: ሰአኪትየ፡ ግብጻዊት
  choice: моей служанке-египтянке
  rationale: Передаёт статус и происхождение Агари без архаического «рабыня» там, где исходное обозначение допускает домашнюю служанку.
- source_word: ወሥአታ
  choice: И она взяла её,
  rationale: Сохраняет женский субъект и женский объект, выраженные глагольной формой и объектным суффиксом, а также незавершённость фразы, продолжающейся в следующем стихе.
theological_decisions:
- issue: Отношение веры Аврама к бесплодию Сары
  choice: «Он поверил, что у него будет потомство, хотя она не рожала»
  alternative: «Он поверил, что будет семя, а она не рождала»
  rationale: Перевод сохраняет напряжение между верой Аврама и фактическим бесплодием Сары, не уточняя сверх текста способ исполнения обещания.
- issue: Образ созидания потомства через Агарь
  choice: «через неё я устрою тебе потомство»
  alternative: «может быть, я буду иметь детей от неё»
  rationale: Выбранный вариант не переносит в текст более привычную формулировку Бытия и сохраняет характерный для данного источника образ созидания потомства.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Имена переданы в привычной русской библейской форме: Аврам, Сара, Агарь. Финальная запятая намеренно сохраняет переход незавершённой фразы в следующий стих.'
