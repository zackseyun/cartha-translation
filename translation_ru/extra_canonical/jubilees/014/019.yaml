  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: ru
  text: 'В тот день Господь заключил завет с Аврамом, сказав: «Твоим потомкам Я дам эту землю — от реки Египта до великой реки, реки Евфрата».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተካየደ፡ ኪዳነ
  choice: заключил завет
  rationale: Естественное современное русское выражение, точно передающее формулу установления завета.
- source_word: ለዘርእከ
  choice: твоим потомкам
  rationale: Собирательное «семя» здесь обозначает потомство Аврама; «потомкам» ясно и естественно передаёт смысл без устранения собирательного значения.
- source_word: ፈለገ፡ ግብጽ
  choice: реки Египетской
  rationale: Сохраняет географическое наименование источника и традиционную русскую библейскую форму, не отождествляя эту реку с Нилом.
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: великой реки, реки Евфрата
  rationale: Сохранено повторение «реки» и пояснительное наименование Евфрата, присутствующие в источнике.
theological_decisions:
- issue: Адресат обещания земли
  choice: «Твоим потомкам Я дам»
  alternative: «Твоему семени Я дам»
  rationale: Выбрана естественная современная формулировка, сохраняющая обещание потомству Аврама и не сужающая его до одного конкретного потомка.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования; синтаксис и географическая формула близки к источнику, без архаизмов и конфессионально окрашенных уточнений.
