  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: ru
  text: '«…и награда твоя будет чрезвычайно велика». И он сказал: «Господи, Господи, что Ты дашь мне? Ведь я остаюсь бездетным, а сын Масека, сын моей рабыни, — это Дамаск».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Конец фразы в эфиопском тексте сжат и буквально читается: «сын Масека, сын моей рабыни, — это Дамаск». По параллельному рассказу в Быт. 15:2 речь идёт о домашнем наследнике Аврама, Елиезере из Дамаска, однако имя «Елиезер» здесь отсутствует.'
    reason: Текстологическое пояснение трудного, негладкого чтения без гармонизации основного текста.
lexical_decisions:
- source_word: ዐስብከ
  choice: награда твоя
  rationale: Передаёт обычное значение существительного «награда, воздаяние» с местоименным суффиксом второго лица.
- source_word: ይፈደፍድ፡ ጥቀ
  choice: будет чрезвычайно велика
  rationale: Естественно передаёт усиленное выражение чрезвычайной величины награды.
- source_word: አሐውር፡ ዘእንበለ፡ ውሉድ
  choice: я остаюсь бездетным
  rationale: Буквально выражение связано с «идти без детей»; по-русски «остаюсь бездетным» ясно передаёт состояние говорящего, не добавляя наследника в основной текст.
- source_word: ወወልደ፡ ማሴቅ፡ ወልደ፡ አመትየ
  choice: а сын Масека, сын моей рабыни
  rationale: Сохраняет повторение «сын» и родственные отношения исходного текста, не исправляя имя по параллели из Бытия.
- source_word: ውእቱ፡ ደማስቆስ
  choice: — это Дамаск
  rationale: Следует засвидетельствованному эфиопскому чтению «он/это — Дамаск» и не вставляет отсутствующее в тексте имя Елиезер.
theological_decisions:
- issue: Отождествление предполагаемого наследника
  choice: Сохранено трудное чтение «это Дамаск»
  alternative: «это Елиезер из Дамаска»
  rationale: Имя Елиезер отсутствует в данном эфиопском тексте. Гармонизация с Быт. 15:2 сняла бы реальную текстовую трудность и внесла бы материал из параллельного места.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Обращение «Господи, Господи» и прописные местоимения в обращении к Богу сохранены как уместная русская религиозно-литературная норма. Начальное многоточие показывает, что стих начинается продолжением предыдущей речи.
