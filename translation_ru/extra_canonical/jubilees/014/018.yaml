  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: ru
  text: Он пробудился ото сна и встал. Солнце зашло, и появилось пламя. И вот, дымящаяся печь и огненный факел прошли между рассечёнными частями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነድ፡ ኮነ፡
  choice: и появилось пламя
  rationale: Существительное ነድ означает «пламя»; конструкция с ኮነ передана естественным русским оборотом «появилось пламя», без гармонизации с формулировкой Бытия 15:17 о наступившей тьме.
- source_word: እቶን፡ ይጤይስ፡
  choice: дымящаяся печь
  rationale: Передаёт образ печи, испускающей дым, кратко и естественно по-русски.
- source_word: ልባስ፡ እሳት፡
  choice: огненный факел
  rationale: Выражение обозначает факел или светильник, связанный с огнём; «огненный факел» сохраняет яркий образ и соответствует контексту.
- source_word: ማእከለ፡ ክፍል፡
  choice: между рассечёнными частями
  rationale: «Части» в контексте — разделённые части жертвенных животных; добавление «рассечёнными» делает подразумеваемый смысл понятным, не перегружая текст.
theological_decisions:
- issue: Соотношение с Бытие 15:17
  choice: Сохранено чтение «появилось пламя» по эфиопскому тексту Юбилеев
  alternative: «стало темно» по формулировке, знакомой из Бытия 15:17
  rationale: Перевод следует непосредственно данному оригиналу и не исправляет его посредством гармонизации с каноническим параллельным местом.
translation_notes:
  register: Современный литературный русский язык с dignified библейской повествовательностью; синтаксис разделён на короткие фразы ради ясности, а формула «И вот» сохранена как выразительный повествовательный переход.
