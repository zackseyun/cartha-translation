  yaml_path: translation/extra_canonical/jubilees/014/014.yaml
  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: ru
  text: 'Глубокий сон объял Аврама; и вот, великий ужас тьмы объял его. И было сказано Авраму: «Знай наверняка: твои потомки будут пришельцами в чужой земле; их поработят и будут угнетать четыреста лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ
  choice: глубокий сон
  rationale: В данном контексте слово обозначает оцепенение или глубокий сон; этот вариант естественен по-русски и соответствует параллельному повествованию Быт. 15:12.
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: великий ужас тьмы
  rationale: Сохраняет сочетание величия ужаса и тьмы, не устраняя возможную смысловую связь между ними.
- source_word: አእምሮ፡ አእምር
  choice: знай наверняка
  rationale: Повтор однокоренных форм служит усилению уверенности знания; по-русски это естественно передаётся наречием «наверняка».
- source_word: ዘርእከ
  choice: твои потомки
  rationale: Буквально «твоё семя»; в контексте речь идёт о потомстве, и современное русское «потомки» ясно передаёт смысл.
- source_word: ፈላሴ
  choice: пришельцами
  rationale: Передаёт положение чужеземцев, временно живущих не в своей стране, без добавления позднейших юридических оттенков.
- source_word: ምድረ፡ ነኪር
  choice: в чужой земле
  rationale: Естественная русская передача буквально «в земле чужой»; смысл принадлежности земли другим сохраняется.
- source_word: ይቀንይዎሙ
  choice: их поработят
  rationale: Передаёт каузативный смысл подчинения служению или рабству и сохраняет неопределённого субъекта действия.
- source_word: ያሐምምዎሙ
  choice: будут угнетать
  rationale: В контексте обозначает причинение страдания и притеснение; «угнетать» естественно сочетается с порабощением.
theological_decisions:
- issue: Значение «семени» Аврама
  choice: твои потомки
  alternative: твоё семя
  rationale: Контекст явно говорит о множестве будущих людей; «потомки» понятно современному читателю и не вводит дополнительного богословского толкования.
- issue: Неопределённый субъект формулы «было сказано»
  choice: сохранена безличная конструкция
  alternative: Бог сказал Авраму
  rationale: Источник не называет говорящего в самом предложении; перевод не должен молча уточнять эту неоднозначность.
- issue: Отношение четырёхсот лет к порабощению и угнетению
  choice: сохранено последовательное присоединение без пояснения охвата периода
  alternative: они будут порабощены и угнетаемы в течение четырёхсот лет
  rationale: Формулировка источника допускает вопрос, относится ли срок ко всему пребыванию в чужой земле или непосредственно к угнетению; перевод не разрешает эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для обычного читателя; повтор «объял» намеренно сохраняет параллелизм двух первых частей стиха.
