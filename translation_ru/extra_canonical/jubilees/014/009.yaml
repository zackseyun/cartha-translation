  verdict: revise
  source_fidelity: 'Вопрос Аврама передан по смыслу точно, включая повторное обращение и наследование земли, подразумеваемой местоимением. Однако ንሣእ естественнее передать как «возьми», а не «приведи»: речь идёт о приобретении/взятии животного для последующего обряда, что подтверждается параллелью Быт. 15:9. «Для Меня» точно передаёт дативный элемент оригинала.'
  naturalness: «Как мне узнать, что я унаследую её?» — современная и литературно естественная русская формулировка, сохраняющая вопрос о способе/основании узнавания. «Телица» — нейтральный библейско-литературный термин; многоточие не требуется, поскольку оно не выражено в источнике и не должно подменять пунктуацией границу стиха.
  terminology: «Господи, Господи» сохраняет повтор обращения. «Унаследую её» верно отражает глагол наследования и не вводит явно отсутствующее слово «земля». «Трёхлетняя телица» соответствует указанному животному и возрасту.
  issues:
  - severity: medium
    issue: Повеление «Приведи Мне»
    rationale: Геэзское ንሣእ означает «возьми»; «приведи» смещает действие к доставке уже имеющегося животного, тогда как контекст требует взять животное для обряда.
  - severity: low
    issue: Многоточие в конце реплики
    rationale: Многоточие добавляет редакторский сигнал незавершённости, отсутствующий в источнике. Продолжение повеления в следующем стихе не требует включать многоточие в перевод данного стиха.
  - severity: low
    issue: «По чему я узнаю»
    rationale: Формально допустимо, но в современном литературном русском менее естественно и зрительно двусмысленно. «Как мне узнать» передаёт тот же вопрос без смыслового добавления.
