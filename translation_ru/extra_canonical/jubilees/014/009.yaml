lexical_decisions:
- source_word: በምንት
  choice: по чему
  rationale: Передаёт вопрос о признаке или основании узнавания, сохраняя формулировку источника и связь с Быт. 15:8.
- source_word: እወርሳ
  choice: унаследую её
  rationale: Глагол означает получение во владение как наследства; местоимение женского рода по контексту относится к земле.
- source_word: ጣዕዋ
  choice: трёхлетнюю тёлку
  rationale: Контекстуальное значение подтверждается параллелью Быт. 15:9; возраст животного выражен одним лексическим обозначением.
theological_decisions:
- issue: Определение говорящего во второй реплике
  choice: Он
  alternative: он
  rationale: Прописная буква указывает на Господа как говорящего согласно ближайшему контексту, не добавляя в текст имени или титула.
- issue: Объект наследования
  choice: её
  alternative: это
  rationale: Женский род естественно отсылает к земле; при этом сам референт не вставлен явно, поэтому сохраняется контекстуальная зависимость.
translation_notes:
