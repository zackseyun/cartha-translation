lexical_decisions:
- source_word: ወከዐወ፡ ደሞሙ፡ ውስተ፡ ምሥዋዕ
  choice: и вылил их кровь на жертвенник
  rationale: Передаёт конкретное действие и культовое значение ምሥዋዕ без ослабления до общего «места жертвоприношения».
- source_word: ወነፈቆሙ፡ እማእከል
  choice: и рассёк их пополам
  rationale: Естественно по-русски выражает разделение жертвенных животных посередине.
- source_word: አንጻራቲሆሙ፡ በበገጾሙ
  choice: половины одну напротив другой, лицом к лицу
  rationale: Слово «половины» восполняет подразумеваемый объект после рассечения, а «лицом к лицу» сохраняет образное выражение источника.
- source_word: ወለዐዋፊሰ፡ ኢነተፈ
  choice: птиц же он не рассекал
  rationale: Сохраняет противопоставление и видовое различие; несовершенный вид естественно описывает исключение из совершённого обряда.
- source_word: ክፍሉ
  choice: рассечённые части
  rationale: Контекст требует частей разделённых животных; формулировка не уточняет сверх источника, были ли это именно половины или более общо куски.
