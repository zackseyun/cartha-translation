translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «всех их» намеренно сохраняет синтаксическую связь стиха с предшествующим контекстом. Повтор «птиц / птицы» отражает различие между жертвенными птицами и птицами, слетевшими на части.
