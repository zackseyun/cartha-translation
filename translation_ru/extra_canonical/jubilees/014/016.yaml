lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: отойдёшь к своим отцам
  rationale: Буквально передаёт движение «к твоим отцам» и сохраняет традиционный библейский эвфемизм смерти, не сводя его к одному толкованию.
- source_word: በሰላም
  choice: с миром
  rationale: Сохраняет краткую предложную конструкцию источника и естественно звучит в библейском русском регистре.
- source_word: ወትትቀበር
  choice: и будешь погребён
  rationale: Передаёт пассивную глагольную форму без добавления действующего лица.
- source_word: በርእስ፡ ሠናይ
  choice: в доброй старости
  rationale: Выражение обозначает благую, почтенную старость; русская формула естественна и сохраняет смысл исходного сочетания.
theological_decisions:
- issue: Смысл выражения «отойти к отцам»
  choice: Сохранён традиционный образ без поясняющей замены словом «умрёшь».
  alternative: «Ты умрёшь мирно»
  rationale: Источник использует образное выражение о присоединении к предкам; его сохранение не предрешает богословский вопрос о состоянии умерших.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис простой и ясный; архаизмы не вводились, но устойчивый библейский оборот «отойти к отцам» сохранён.
