  revised_text: Сара взяла Агарь, свою служанку, египтянку, и отдала её своему мужу Авраму в жёны. Он вошёл к ней, и она зачала и родила сына. В пятый год этой седмины он нарёк ему имя Измаил; тот год был восемьдесят шестым годом жизни Аврама.
