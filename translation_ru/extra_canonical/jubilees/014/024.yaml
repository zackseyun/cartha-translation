  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: ru
  text: Сара взяла Агарь, свою служанку, египтянку, и отдала её своему мужу Авраму в жёны. Он вошёл к ней, и она зачала и родила сына. В пятый год этой седмины он нарёк ему имя Измаил; тот год был восемьдесят шестым годом жизни Аврама.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሶራ
  choice: Сара
  rationale: Передача традиционной русской формы имени; в данном источнике стоит форма, соответствующая Саре.
- source_word: አጋር
  choice: Агарь
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: ለአአታ
  choice: свою служанку
  rationale: Контекстуально обозначает служанку Сары; притяжательное местоимение обеспечивает естественность и сохраняет отношение принадлежности.
- source_word: ለምታ
  choice: своему мужу
  rationale: Слово явно называет Аврама мужем Сары; эта деталь сохранена вопреки её отсутствию в более ранней английской редакции.
- source_word: ትኩኖ፡ ብእሲተ
  choice: в жёны
  rationale: Естественная русская передача целевого выражения «чтобы она была женой» без ослабления брачного статуса.
- source_word: ቦአ፡ ኀቤሃ
  choice: вошёл к ней
  rationale: Сохранён традиционный эвфемизм источника для половой близости, без эксплицитного перетолкования.
- source_word: ይስማዔል
  choice: Измаил
  rationale: Устоявшаяся русская форма имени.
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ
  choice: в пятый год этой седмины
  rationale: Передана юбилейная хронологическая единица «седмина»; указательное «этой» следует контекстуальному значению конструкции.
- source_word: ዓመት፡ ሰማንያ፡ ወስድስቱ፡ ዓም፡ በሕይወተ፡ አብራም
  choice: восемьдесят шестым годом жизни Аврама
  rationale: Точно и естественно передаёт возрастную датировку источника.
theological_decisions:
- issue: Статус Агари после передачи Авраму
  choice: в жёны
  alternative: как жену
  rationale: Источник прямо употребляет обозначение жены; перевод сохраняет это, не заменяя его более конфессионально или юридически нагруженными словами вроде «наложница».
- issue: Эвфемизм половой близости
  choice: Он вошёл к ней
  alternative: Он лёг с ней
  rationale: Формальная образность источника сохранена, чтобы не устранять его семитскую манеру выражения и не добавлять отсутствующую конкретизацию.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Короткие предложения разгружают длинную цепочку исходного текста. Архаизм «нарёк» сохранён как широко понятный элемент возвышенного библейского регистра; «седмина» употреблена как точный термин юбилейной хронологии.
