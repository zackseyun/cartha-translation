  yaml_path: translation/extra_canonical/jubilees/014/001.yaml
  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: ru
  text: 'После этого события, в четвёртый год этой седмины, в новолуние[a] третьего месяца, слово Господа пришло к Авраму во сне: «Не бойся, Аврам! Я — твой защитник, и награда твоя будет весьма велика».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское слово может означать «на восходе» или «в начале», но в календарной системе Книги Юбилеев оно часто обозначает новолуние, то есть начало месяца.
    reason: cultural_note
  - marker: b
    text: Предоставленный фрагмент геэзского текста обрывается после слов «Я — Он»; заключительные слова стиха восстановлены по полному тексту данного места, отражённому в издании и проверочном переводе.
    reason: textual_note
lexical_decisions:
- source_word: ነገር (nagar)
  choice: события
  rationale: Здесь слово обозначает предшествующее событие или дело; «после этого события» естественно передаёт временной переход и не смешивает его с последующим календарным указанием.
- source_word: ዝሱባዔ (zə-subāʿe)
  choice: этой седмины
  rationale: В Книге Юбилеев речь идёт о семилетнем периоде. «Седмина» сохраняет специальное хронологическое значение и отличается от обычной недели.
- source_word: በሠርቀ (ba-śarqa)
  choice: в новолуние
  rationale: Буквально выражение связано с восходом или началом; в календарном контексте Книги Юбилеев оно обозначает начало месяца, то есть новолуние.
- source_word: ኮነ፡ ቃለ፡ እግዚአብሔር፡ ኀበ፡ አብራም
  choice: слово Господа было к Авраму
  rationale: Сохранена библейская формула исходного текста без ненужного истолкования как простого обращения или сообщения.
- source_word: ኢትፍራህ
  choice: Не бойся
  rationale: Прямой и естественный русский эквивалент запрета со значением страха.
theological_decisions:
- issue: Божественное самообозначение и обещание Авраму
  choice: «Я — твой защитник, и награда твоя будет весьма велика»
  alternative: «Я — твой щит; награда твоя весьма велика»
  rationale: «Защитник» соответствует смыслу традиционного продолжения стиха и остаётся понятным современному читателю; союз «и» не превращает защиту и награду в взаимоисключающие толкования. При этом в примечании честно отмечена граница предоставленного фрагмента геэзского текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Специальное хронологическое слово «седмина» сохранено ради точности; остальная лексика рассчитана на обычного современного читателя. Неясность календарного термина вынесена в примечание, а неполнота предоставленной геэзской строки обозначена открыто.
