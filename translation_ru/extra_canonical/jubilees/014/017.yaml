  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: ru
  text: И в четвёртом поколении они возвратятся сюда, потому что грех амореев доныне ещё не достиг полноты».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что грех амореев доныне не завершился».'
    reason: Отмечает более формальную передачу глагола завершения и временного оборота.
lexical_decisions:
- source_word: ወበትውልድ፡ ራብዕ
  choice: И в четвёртом поколении
  rationale: Передаёт временно-родовое выражение буквально и естественно по-русски.
- source_word: ይትመየጡ፡ ዝየ
  choice: они возвратятся сюда
  rationale: Сохраняет значение возвращения и указательное наречие «сюда».
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: грех амореев
  rationale: Коллективное единственное число источника передано без богословского уточнения характера греха.
- source_word: ኢተፈጸመ ... እስከ፡ ይእዜ
  choice: доныне ещё не достиг полноты
  rationale: Естественная русская передача отрицательной завершённости с временным пределом «до настоящего времени»; «ещё» подчёркивает незавершённость без тяжеловесного «не завершился доныне».
theological_decisions:
- issue: Смысл «полноты» греха амореев
  choice: не достиг полноты
  alternative: не завершился
  rationale: Формулировка сохраняет образ меры или созревания греха и не объясняет сверх текста, каким образом определяется его полнота.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис простой и общепонятный; архаизмы устранены, кроме уместного наречия «доныне».
