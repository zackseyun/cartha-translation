  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ru
  text: кенеев, кенезеев, кедмонеев, ферезеев, рефаимов, ракитов[a], аввеев, аморреев, хананеев, гергесеев и иевусеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этноним «ракиты» передаёт чтение геэзского текста; в параллельных традициях эта группа могла называться иначе. Здесь сохранена дошедшая до нас форма без согласования с параллельными перечнями.
    reason: textual_variant
lexical_decisions:
- source_word: ራኬዎን
  choice: ракитов
  rationale: Передаёт засвидетельствованную в геэзском тексте форму как самостоятельный этноним и не гармонизирует её с параллельными перечнями.
- source_word: ለአዊውስ
  choice: аввеев
  rationale: Современная русская форма этнонима, соответствующая передаче Avvites и исходной форме.
- source_word: ለራፋኤዎን
  choice: рефаимов
  rationale: Сохраняет традиционно узнаваемую русскую форму библейского этнонима.
- source_word: ለገር ጌሴዎን
  choice: гергесеев
  rationale: Передаёт этноним в принятой русской библейской форме, несмотря на графическое разделение слова в издании.
theological_decisions: []
translation_notes:
  register: Перечень оформлен современным литературным русским языком с традиционными формами известных библейских этнонимов. Повторяющийся союз геэзского оригинала передан естественным русским перечислением, с союзом «и» перед последним элементом. Формы стоят в винительном падеже как продолжение синтаксической конструкции контекста.
