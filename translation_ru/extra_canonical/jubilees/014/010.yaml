lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  choice: трёх лет
  rationale: Фраза открывает стих из-за деления текста и относится к телице, названной в предыдущем стихе; её сохранение передаёт исходный синтаксический переход.
- source_word: ጠሌ
  choice: козу
  rationale: В контексте перечня жертвенных животных обозначает козу; винительный падеж обусловлен продолжающейся прямой речью предыдущего стиха.
- source_word: በገዐ
  choice: барана
  rationale: Обычное значение слова в данном жертвенном перечне — взрослый самец овцы.
- source_word: መንጢጠ
  choice: горлицу
  rationale: Традиционное и точное русское название птицы, соответствующее контексту Бытия 15:9.
- source_word: ርግብ
  choice: голубя
  rationale: Передаёт вторую птицу в перечне без излишнего уточнения её возраста или пола сверх формы русского текста.
- source_word: በመንፈቀ፡ ወርኅ
  choice: в середине месяца
  rationale: Явное временное указание в геэзском тексте сохранено буквально и естественно по-русски.
- source_word: ይነብር፡ ኀበ፡
  choice: жил у
  rationale: Предлог ኀበ требует объекта, находящегося в следующем стихе; незавершённость фразы сохранена, чтобы не подменять его наречием «там».
