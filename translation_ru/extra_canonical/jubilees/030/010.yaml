  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: ru
  text: 'Тот, кто осквернит её, непременно должен быть предан смерти: его побьют камнями. Для этого закона нет ограничения по времени; нет ни прощения, ни какого-либо искупления — лишь мужчина, осквернивший дочь среди всего Израиля, будет искоренён, потому что он отдал своё семя Молоху[a] и совершил зло, чтобы осквернить её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Упоминание Молоха здесь неожиданно по контексту, однако оно присутствует в эфиопском тексте. Возможно, это более широкое сопоставление незаконного излияния семени с культовым осквернением.
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ፡ ሞተ፡ ለይሙት
  choice: Тот, кто осквернит её, непременно должен умереть
  rationale: Сохранены относительная конструкция, значение осквернения и усиленная формула смертного приговора; женское местоимение определяется упомянутой далее дочерью.
- source_word: ወበእብን፡ ይትወገር
  choice: пусть побьют его камнями
  rationale: Естественно передаёт пассивную формулу казни через побиение камнями.
- source_word: ወአልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: Для этого закона нет ограничения по времени
  rationale: Буквальное «нет меры дней» означает отсутствие временного предела действия закона.
- source_word: ወአልቦ፡ ኅድገተ፡ ወኵሉ፡ ስርየተ
  choice: нет ни прощения, ни какого-либо искупления
  rationale: Различены два близких понятия — прощение и искупление — без их сведения к одному термину.
- source_word: ይሤረው፡ ብእሲ
  choice: да будет искоренён … мужчина
  rationale: Передан пассивный глагол со значением «быть вырванным с корнем, искоренённым»; не добавлены отсутствующие в источнике «немедленно» или активное «предать смерти».
- source_word: ወሀቦ፡ ለሞሎክ
  choice: отдал … Молоху
  rationale: Сохранено имя Молох и культовая формула передачи потомства/семени.
theological_decisions:
- issue: Связь осквернения дочери с отдачей семени Молоху
  choice: Сохранить резкий переход и прямую связь предложений
  alternative: Истолковать упоминание Молоха как пояснительную аналогию или исправить текст
  rationale: Эфиопский текст содержит эту трудную и неожиданную формулировку; перевод не должен устранять её богословское и контекстуальное напряжение.
- issue: Характер наказания в выражении ይሤረው
  choice: «да будет искоренён»
  alternative: «его следует предать смерти»
  rationale: Выбран образный смысл исходного пассива, допускающий библейскую идею удаления из общины и не сводящий её без необходимости только к казни.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формулы «непременно должен умереть» и «да будет искоренён» сохраняют библейскую торжественность, оставаясь понятными современному читателю.
