base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: ru
  text: 'Её сожгут в огне, потому что она осквернила имя дома своего отца, и она будет искоренена из Израиля. И пусть ни блудник, ни нечистый не найдётся в Израиле во все дни поколений земли[a], ибо Израиль свят для ГОСПОДА. Всякий, кто осквернит его, непременно должен умереть: его побьют камнями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во все поколения земли».'
    reason: Более идиоматичный вариант передаёт весь временной оборот без отдельного воспроизведения слова «дни»; основной текст сохраняет его формально.
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Её сожгут в огне
  rationale: Глагольная форма включает женский объект; он явно выражен в русском. Оборот «в огне» сохраняет образ исходного текста.
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: она опорочила имя дома своего отца
  rationale: «Опорочила» естественно передаёт ритуально-нравственный смысл корня ‘осквернять’ применительно к имени и репутации отцовского дома.
- source_word: ትሠረው፡ እምእስራኤል
  choice: она будет искоренена из Израиля
  rationale: Сохранена метафора удаления с корнем, а не сведена к менее образному «истреблена».
- source_word: ዘማ፡ ወርኵስ
  choice: ни блудник, ни нечистый
  rationale: Переданы два координированных определения без попытки отождествить нравственную и ритуальную нечистоту.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: во все дни поколений земли
  rationale: Сохранён явно присутствующий компонент «дни» и характерный для Книги Юбилеев временной оборот.
- source_word: ሞተ፡ ለይሙት
  choice: непременно должен умереть
  rationale: Инфинитивно-финитная конструкция выражает эмфатическую неизбежность смертного приговора.
- source_word: በእብን፡ ይውግርዎ
  choice: его побьют камнями
  rationale: Естественный русский эквивалент казни посредством забрасывания камнями; множественное число средства передано словом «камнями».
theological_decisions:
- issue: Референт местоименного объекта после «осквернит»
  choice: «его» — Израиль
  alternative: «это» или подразумеваемая святыня/установление
  rationale: Ближайший явно названный референт — Израиль; мужской род русского названия позволяет сохранить местоименную связь, не добавляя нового богословского объекта.
- issue: Значение «нечистый»
  choice: Сохранено без уточнения вида нечистоты
  alternative: «осквернённый», «ритуально нечистый» или «развратный»
  rationale: Исходный термин допускает широкую категорию нечистоты; уточнение могло бы необоснованно сузить нравственно-ритуальную напряжённость текста.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Синтаксис сделан ясным для обычного читателя, но сохранены юридическая строгость, повторяющаяся лексика осквернения и необычный временной оборот исходного текста. Имя ГОСПОДЬ оформлено прописными буквами в соответствии с принятой библейской передачей тетраграмматического титула в консультационном слое.
