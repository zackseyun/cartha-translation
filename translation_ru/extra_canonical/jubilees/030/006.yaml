  yaml_path: translation/extra_canonical/jubilees/030/006.yaml
  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: ru
  text: потому что они совершили бесчестье в Израиле. И Господь предал их в руки сыновей Иакова, чтобы те истребили их мечом[a] и поступили с ними так, и чтобы подобное больше не повторилось,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искоренили их»; возможно также: «уничтожили их».'
    reason: Геэзский глагол обозначает искоренение или полное уничтожение и сильнее обычного глагола «убить».
lexical_decisions:
- source_word: ኀፍረተ (ḥafrat)
  choice: бесчестье
  rationale: Передаёт значение позора, постыдного деяния и сохраняет связь с формулой о бесчестье, совершённом «в Израиле».
- source_word: መጠዎሙ ... ውስተ እዴ
  choice: предал их в руки
  rationale: Естественная русская библейская формула, точно отражающая передачу во власть другого.
- source_word: ይሠርውዎሙ (yəśärwəwomu)
  choice: истребили их
  rationale: Глагол имеет смысл искоренения или полного уничтожения; «истребили» точнее простого «убили» и естественно сочетается с «мечом».
- source_word: ይግበሩ ላዕሌሆሙ ዝንተ
  choice: поступили с ними так
  rationale: Сохраняет указательное и несколько неопределённое выражение источника, не добавляя пояснений из контекста.
- source_word: ኢይኩን
  choice: подобное больше не повторилось
  rationale: Естественно выражает цель — чтобы этого впредь не было, сохраняя незавершённость стиха перед продолжением.
theological_decisions:
- issue: Субъект передачи жителей в руки сыновей Иакова
  choice: Господь предал их
  alternative: Бог отдал их
  rationale: Передаёт явное именование እግዚአብሔር и сохраняет утверждение источника о Божьем действии, не смягчая богословского напряжения.
- issue: Характер действия сыновей Иакова
  choice: истребили их мечом
  alternative: совершили над ними суд мечом
  rationale: Источник говорит об уничтожении, а не употребляет явный термин «суд»; поэтому судебное толкование не внесено в текст.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены повторение целевых оборотов и конечная запятая, поскольку исходный текст стиха синтаксически продолжается далее; контекстуальное дополнение не внесено.
