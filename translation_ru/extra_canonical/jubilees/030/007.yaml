base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: ru
  text: 'Итак, пусть не будет в Израиле никого, кто оскверняет израильскую деву. Если же кто-нибудь из израильтян захочет отдать свою дочь или сестру мужчине из потомков народов, он непременно должен умереть: его должны побить камнями, потому что он совершил позорное дело в Израиле. А женщину[a] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и женщину также». Эти слова начинают фразу, которая продолжается в следующем стихе.'
    reason: Поясняет намеренную синтаксическую незавершённость и не позволяет отнести женщину к предшествующему побиению камнями.
lexical_decisions:
- source_word: ለአርኵሶ
  choice: того, кто осквернит
  rationale: Инфинитивная форма выражает осквернение; по-русски запрет естественно передаётся личной конструкцией.
- source_word: ድንግለ፡ እስራኤላዊት
  choice: израильскую деву
  rationale: Сохраняется конкретное обозначение незамужней девушки/девственницы и её принадлежность к Израилю.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: мужчине из потомства языческих народов
  rationale: Буквально сохраняет образ «семени/потомства народов»; «языческие народы» передаёт противопоставление Израилю в данном контексте.
- source_word: ሞተ፡ ለይሙት
  choice: непременно должен умереть
  rationale: Повтор корня смерти — эмфатическая конструкция, переданная русским усилением.
- source_word: ገብረ፡ ኀፍረተ
  choice: совершил позорное дело
  rationale: Сохраняет нравственно-общественный смысл «сделал позор/постыдное» без чрезмерной конкретизации.
- source_word: ወለብእሲትሂ
  choice: А женщину —
  rationale: Префикс ለ маркирует вынесенный вперёд объект, синтаксически продолжающийся в следующем стихе; тире показывает незавершённость фразы.
theological_decisions:
- issue: К кому относится смертный приговор
  choice: Приговор в этом стихе грамматически отнесён к мужчине, отдающему дочь или сестру
  alternative: Распространить побиение камнями также на женщину
  rationale: Финальное ወለብእሲትሂ вводит женщину как объект последующего действия в следующем стихе, а не присоединяет её к предшествующему приговору.
- issue: Значение «народов»
  choice: «языческие народы»
  alternative: «народы» или «иноплеменники»
  rationale: В контексте брачного запрета термин обозначает не-Израиль; формулировка не уточняет конкретную этническую группу и сохраняет религиозно-общественное противопоставление.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Синтаксическая незавершённость конца стиха сохранена намеренно; сноска поясняет связь со следующим стихом.
