  text: And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.
translation:
  language: ru
  text: Так на небесных скрижалях записывают в его пользу, как свидетельство, благословение и праведность перед Богом всего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከመዝ
  choice: И так
  rationale: Передаёт связующее и итоговое значение выражения без излишнего усиления.
- source_word: ያዐርጉ ሎቱ በስምዐ
  choice: ему записывают во свидетельство
  rationale: В контексте небесных скрижалей глагольное выражение означает внесение записи, а በስምዐ сохраняется как «во свидетельство»; этот элемент отсутствует в английском консультационном тексте, но присутствует в эфиопском источнике.
- source_word: ጽላተ ሰማይ
  choice: небесных скрижалях
  rationale: Традиционное и понятное соответствие устойчивому выражению Книги Юбилеев.
- source_word: በረከተ ወጽድቀ
  choice: благословение и праведность
  rationale: Сохраняет два самостоятельных понятия исходного текста и их богословскую напряжённость.
- source_word: ለአምላከ ኵሉ
  choice: перед Богом всего
  rationale: Формально передаёт универсальное определение Бога, не добавляя отсутствующего в источнике уточнения «сущего».
theological_decisions:
- issue: Смысл небесной записи о Левии
  choice: «ему записывают … благословение и праведность»
  alternative: «его объявляют благословенным и праведным»
  rationale: Исходный текст говорит о записи благословения и праведности, но не объясняет точный характер их отношения к Левию; перевод не превращает это в более определённую декларацию статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «скрижали» сохранено как общеупотребительный термин данного жанра; синтаксис оставлен кратким и торжественным.
