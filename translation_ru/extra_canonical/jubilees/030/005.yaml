  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: ru
  text: Дину, их сестру.[a] Итак, отныне нельзя осквернять дочь Израиля, ибо на небесах постановлено против них, чтобы все мужчины Сихема были истреблены мечом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Дину, их сестру» по смыслу завершают фразу предыдущего стиха; здесь сохранено деление предоставленного текста на стихи.
    reason: Исходный геэзский текст данного стиха начинается словами ዲናሃ፡ እኅቶሙ, отсутствующими в английском консультационном слое и синтаксически связанными с предшествующим контекстом.
  - marker: b
    text: В геэзском тексте при глаголе «истребить» выражены местоимения множественного числа; их точная соотнесённость раскрывается предшествующим повествованием. Пассивная форма в переводе передаёт установленный результат, не приписывая исполнителя там, где сам стих называет его местоименно.
    reason: Примечание отмечает синтаксическую особенность источника и объясняет нейтральную русскую перестройку без добавления толкования.
lexical_decisions:
- source_word: አይትገበር
  choice: да не совершается
  rationale: Передаёт отрицательную безличную форму с нормативно-запретительным оттенком, сохраняя торжественный, но понятный регистр.
- source_word: ለአርኵሶ
  choice: осквернения
  rationale: Инфинитив от корня со значением «делать нечистым, осквернять»; существительное естественно присоединяется к пояснительному обороту «подобного — ...».
- source_word: ተሠርዐ
  choice: было постановлено
  rationale: Глагол выражает установленный порядок или предписание; «постановлено» передаёт небесное решение без добавления конфессиональной терминологии.
- source_word: ያጥፍእዎሙ
  choice: чтобы они истребили
  rationale: Сохраняет активную форму и два местоименных участника исходного текста, не превращая постановление в безличный пассив.
- source_word: ዐደወ፡ ሴቄማ
  choice: мужчин Сихема
  rationale: По контексту и засвидетельствованному пониманию выражение обозначает мужское население Сихема; русская форма остаётся достаточно близкой к источнику.
theological_decisions:
- issue: Характер небесного решения
  choice: «на небесах против них было постановлено»
  alternative: «на небесах им был вынесен приговор»
  rationale: Выбранный вариант сохраняет более широкое значение ተሠርዐ («установлено, предписано») и не усиливает судебную образность сверх текста.
- issue: Исполнители и объекты истребления
  choice: «чтобы они истребили ... всех мужчин Сихема»
  alternative: «чтобы все мужчины Сихема были истреблены»
  rationale: Активная конструкция сохраняет формально выраженный в геэзском субъект множественного числа, хотя его референт определяется контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «да не совершается» передаёт запрет без архаизмов вроде «да не будет соделано». Начальный фрагмент сохранён по геэзскому источнику, несмотря на его отсутствие в английском POB.
