  yaml_path: translation/extra_canonical/jubilees/030/002.yaml
  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: ru
  text: Там Сихем, сын Еммора-хивея, правителя той земли, увидел Дину, дочь Иакова, схватил её, лёг с ней и осквернил её[a]. Она была юной девочкой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «унизил её». Однако употреблённый здесь глагол означает «осквернить, сделать нечистой».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «она была мала». В следующем стихе уточняется, что Дине было двенадцать лет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መስተዋ፡ ለዲና
  choice: увидел Дину
  rationale: Передаёт простое зрительное восприятие без добавления мотива или желания.
- source_word: ወሰተ
  choice: схватил её
  rationale: Глагол означает взятие или захват; в данном насильственном контексте «схватил» естественно и не смягчает действие.
- source_word: ወሰከበ፡ ምስሌሃ
  choice: лёг с ней
  rationale: Сохраняет традиционную и понятную русскую формулу, близкую к буквальному выражению источника.
- source_word: ወአርኰሳ
  choice: осквернил её
  rationale: Глагол выражает осквернение или причинение нечистоты; это значение важно для дальнейшей темы главы и точнее варианта «унизил».
- source_word: ወይእቲሰ፡ ንስቲት
  choice: Она была ещё совсем юной
  rationale: Естественно передаёт указание на малолетство или юный возраст, не называя точного возраста, который сообщается далее.
theological_decisions:
- issue: Характер последнего глагола в цепочке насильственных действий
  choice: осквернил её
  alternative: унизил её
  rationale: Выбранное чтение следует собственному словоупотреблению геэзского текста и сохраняет центральную для главы тему осквернения, не подменяя её формулировкой из параллельной традиции Бытия 34:2.
translation_notes:
  register: Современный литературный русский язык с прямой, сдержанной передачей насилия без эвфемистического смягчения и без излишней натуралистичности. Имена и этноним оформлены в привычной русской библейской традиции. Начальные слова геэзского фрагмента «в мире, в четвёртом месяце» относятся к завершению предыдущего стиха по принятому делению и потому в текст 30:2 не включены.
