  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: ru
  text: И это мерзость для Израиля. Израиль не очистится от этой нечистоты, если у кого-либо есть жена из дочерей народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у кого есть жена»; конструкцию можно понимать и как относительную, а не условную.'
    reason: Сохраняет грамматическую неоднозначность геэзского ዘቦ፡ ብእሲት и поясняет избранную естественную русскую условную передачу.
lexical_decisions:
- source_word: ምኑን
  choice: мерзость
  rationale: Передаёт сильную нравственно-культовую оценку исходного слова и соответствует контексту запретного брака.
- source_word: ኢይነጽሕ
  choice: не очистится
  rationale: Сохраняет значение очищения, а не просто освобождения от вины.
- source_word: ርኵስ
  choice: нечистота
  rationale: Сохраняет культово-нравственную лексику оригинала и связь с глаголом «очиститься».
- source_word: ዘቦ፡ ብእሲት
  choice: если у него жена
  rationale: Конструкция буквально выражает обладание женщиной или женой; условная передача естественна по-русски и сохраняет связь с человеком, имеющим иноплеменную жену.
- source_word: እም
  choice: из
  rationale: Предлог указывает на происхождение жены; дополнение «дочерей народов» подтверждается консультационным текстом, хотя предоставленный фрагмент геэзского текста обрывается сразу после предлога.
theological_decisions:
- issue: Характер нечистоты
  choice: Сохранить лексику «очистится» и «нечистота»
  alternative: Передать как «не будет прощён за этот грех»
  rationale: Оригинал использует язык чистоты и не требует отождествлять его исключительно с юридической виной или прощением.
- issue: Отношение отдельного нарушителя к собирательному Израилю
  choice: Сохранить местоимение «у него» без добавления поясняющего существительного
  alternative: «если у израильтянина жена»
  rationale: Так не вводится отсутствующее в данном фрагменте слово и сохраняется напряжение между собирательным «Израиль» и отдельным человеком.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью; сохранены повтор «Израиль» и культовая пара «очистится — нечистота». Формула «дочери народов» оставлена как традиционный библейский оборот. Предоставленный геэзский фрагмент заканчивается на предлоге «из», поэтому завершение фразы сверено с аудированным английским консультационным слоем.
