base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: ru
  text: И ты, Моисей, повели сынам Израиля и предостереги их[a], чтобы они не отдавали своих дочерей народам и не брали для своих сыновей жён из дочерей народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дай им услышать». Это выражение может также означать: «засвидетельствуй им» или «свидетельствуй против них».'
    reason: Сохраняет буквальный образ и неоднозначный оттенок геэзской идиомы, тогда как основной текст передаёт её предупредительную функцию в данном контексте.
lexical_decisions:
- source_word: አዝዞሙ
  choice: повели
  rationale: Передаёт повелительное значение глагола и сохраняет торжественный, но понятный современному читателю регистр.
- source_word: ለደቂቀ፡ እስራኤል
  choice: сынам Израиля
  rationale: Традиционное библейское обозначение народа Израиля, естественное для русского литературного библейского регистра.
- source_word: ወአስምዕ፡ ላዕሌሆሙ
  choice: и засвидетельствуй им
  rationale: Каузатив глагола «слышать» с предлогом «на/против» образует идиому свидетельства или настоятельного предостережения; выбранный вариант сохраняет юридико-заветный оттенок.
- source_word: ለአሕዛብ
  choice: языческим народам
  rationale: Передаёт множественное число «народы» и в данном контексте ясно обозначает народы вне Израиля, не сводя выражение к современному этническому смыслу слова «нации».
- source_word: ለውሉዶሙ
  choice: для своих сыновей
  rationale: По контексту брачного запрета слово обозначает сыновей, для которых берут жён.
- source_word: እምአዋልደ፡ አሕዛብ
  choice: из дочерей этих народов
  rationale: Сохраняет образное и симметричное выражение оригинала; указательное «этих» естественно отсылает к уже названным языческим народам.
theological_decisions:
- issue: Сила выражения ወአስምዕ፡ ላዕሌሆሙ
  choice: засвидетельствуй им
  alternative: предостереги их / дай им услышать
  rationale: Формулировка может обозначать как торжественное свидетельство, так и настоятельное предупреждение. Основной текст сохраняет заветно-юридический оттенок, а сноска отмечает буквальную форму и возможный смысл.
- issue: Обозначение אሕዛብ как внешних по отношению к Израилю народов
  choice: языческие народы
  alternative: народы / иноплеменники
  rationale: В контексте запрета смешанных браков речь идёт не просто о любых нациях, а о народах вне Израиля; вариант не уточняет конкретную религиозную систему и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Синтаксический параллелизм двух запретов сохранён; архаизмы сведены к широко понятной формуле «сынам Израиля».
