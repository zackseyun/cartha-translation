  source_fidelity: 'Смысл двух запретов передан верно, как и обращение к Моисею. Однако «языческим народам» добавляет религиозную квалификацию, которой в данном выражении источника нет: አሕዛብ означает «народы». Идиома ወአስምዕ፡ ላዕሌሆሙ допускает оттенки свидетельства и настоятельного предупреждения; «предостереги их» естественно передаёт её функцию в данном контексте, а сноска сохраняет неоднозначность.'
