base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: ru
  text: 'И в тот день, когда сыновья Иакова убили сихемлян, на небесах для них была сделана запись: они поступили праведно и справедливо и совершили отмщение над грешниками; и эта запись была сделана им во благословение.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፍ
  choice: было записано
  rationale: Буквально «книга, запись»; в сочетании с пассивным ተጽሕፈ естественно передано как небесная запись, а не как движение записи вверх.
- source_word: ሰቂማነ
  choice: жителей Сихема
  rationale: Форма обозначает сихемлян, то есть жителей Сихема, а не только человека по имени Сихем.
- source_word: ጽድቀ ወርትዐ
  choice: поступили праведно и справедливо
  rationale: Сохраняет два согласованных понятия — праведность и справедливость — в естественной русской глагольной конструкции.
- source_word: ወበቀለ ላዕለ ኃጥአን
  choice: совершили отмщение над грешниками
  rationale: Передаёт существительное со значением возмездия или отмщения и не смягчает оценку поступка в источнике.
- source_word: ለበረከት
  choice: им во благословение
  rationale: 'Сохраняет целевое значение: запись сделана в их пользу, для благословения.'
theological_decisions:
- issue: Положительная небесная оценка расправы над жителями Сихема
  choice: Сохранена явная оценка поступка как праведного и справедливого отмщения.
  alternative: Смягчить формулировку до нейтрального сообщения о наказании или лишь отметить их ревность.
  rationale: Источник прямо называет поступок праведностью, справедливостью и отмщением и связывает запись с благословением; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «во благословение». Пассив ተጽሕፈ передан точно как «было записано», без прежнего варианта «запись взошла».
