base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: ru
  text: или если он отдаст одну из своих дочерей замуж за человека из какого бы то ни было народа. Ведь это — бедствие за бедствием[a] и проклятие за проклятием; всякий приговор, бедствие и проклятие обрушатся на него. И если он сделает такое или закроет глаза на тех, кто творит нечистоту, оскверняет святилище Господа и бесчестит Его святое имя, то весь народ сообща будет осуждён за всю нечистоту и бесчестие. Не будет ни лицеприятия, ни принятия плодов из его рук, ни жертвы, ни всесожжения, ни тука, ни благоухания приятного аромата — ничто не будет принято. Так будет со всяким мужчиной и всякой женщиной в Израиле, кто оскверняет Его святилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стих 15 необычайно насыщен и, вероятно, сжимает несколько правовых и культовых положений. Перевод сохраняет последовательность: нечистота, общая ответственность, отсутствие лицеприятия и непринятие приношений — без излишнего сглаживания.'
    reason: segmentation_note
lexical_decisions:
- source_word: መቅሠፍት
  choice: кара
  rationale: Слово обозначает поражение или тяжёлое карательное бедствие; «кара» естественно передаёт судебно-карательный смысл и сохраняет повтор.
- source_word: ዘነከ
  choice: всякий суд
  rationale: Геэзская форма в данном плотном месте текстуально трудна; по контексту передаёт судебное последствие. Выбрано широкое «суд» без чрезмерного уточнения.
- source_word: ይጌምሩ፡ ስሞ፡ ቅዱሰ
  choice: бесчестит Его святое имя
  rationale: Передаёт профанацию святого имени естественным современным русским выражением, не ограничивая её только речевым действием.
- source_word: ነሢአ፡ ገጽ / አድልዎ፡ ለገጽ
  choice: лицеприятие
  rationale: Обе засвидетельствованные формулировки указывают на предпочтение по лицу; традиционный русский термин точен и понятен в судебном контексте.
- source_word: ጽንሓሐ
  choice: тук
  rationale: В перечне культовых приношений обозначает жировую часть жертвы; «тук» сохраняет библейско-культовую точность.
- source_word: ትምዐዘ፡ መዐዛ፡ ሠናይ
  choice: благоухание приятного аромата
  rationale: Сохраняет образ запаха угодного приношения и повтор семантики благоухания, не превращая его в отдельный вид жертвы.
theological_decisions:
- issue: Объём коллективной ответственности
  choice: «весь народ сообща будет осуждён»
  alternative: «вся община понесёт вину»
  rationale: Формулировка сохраняет напряжение текста между поступком отдельных лиц, попустительством и общим судом, не объясняя механизм коллективной вины.
- issue: Непринятие приношений
  choice: 'Субъектом непринятия оставлен Бог имплицитно: «ничто не будет принято»'
  alternative: «Господь не примет»
  rationale: Источник использует конструкцию принятия без необходимости явно вводить названного субъекта; пассив сохраняет эту особенность.
- issue: Принадлежность святилища
  choice: «Его святилище» с прописной буквой в местоимении
  alternative: «святилище Господа» во всех случаях
  rationale: Местоимение естественно отсылает к Господу, названному ранее, не добавляя нового богословского уточнения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис умеренно упрощён ради ясности, но повторы «кара сверх кары» и «проклятие сверх проклятия», культовая лексика и напряжение коллективного суда сохранены.
