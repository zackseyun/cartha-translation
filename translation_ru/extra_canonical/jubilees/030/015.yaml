  terminology: «Святилище Господа», «лицеприятие», «всесожжение» и «тук» употреблены уместно. «Бесчестит Его святое имя» точно передаёт профанацию имени. «Благоухание приятного аромата» сохраняет намеренную тавтологическую образность источника.
