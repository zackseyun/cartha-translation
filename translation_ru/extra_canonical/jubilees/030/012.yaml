  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: ru
  text: 'потому что это мерзость пред Господом. Поэтому Я записал для тебя в словах закона все деяния сихемлян[a], совершённые ими против Дины, и то, как сыновья Иакова говорили:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все деяния Сихема, совершённые ими». Название города может обозначать его жителей как единое целое.'
    reason: Сочетание названия Сихема с формами множественного числа допускает как коллективное понимание топонима, так и явное обозначение жителей города.
lexical_decisions:
- source_word: ምኑን
  choice: мерзость
  rationale: Передаёт существительное с сильной нравственно-религиозной оценкой; сохраняет формулировку «это мерзость», не ослабляя её до прилагательного.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: пред Господом
  rationale: Традиционная и при этом понятная русская передача выражения «перед Господом», обозначающего Божью оценку поступка.
- source_word: ውስተ፡ ቃለ፡ ሕግ
  choice: в словах закона
  rationale: Сохраняет необычную, но осмысленную формулировку источника, не сводя её без достаточного основания к более общему «в законе».
- source_word: ግብሮሙ፡ ለሴቄማ
  choice: деяния сихемлян
  rationale: Множественные местоименные и глагольные формы указывают на жителей Сихема как коллектив; «деяния» соответствует возвышенному законодательному контексту.
- source_word: ላዕለ፡ ዲና
  choice: против Дины
  rationale: Передаёт направленность враждебных действий против Дины без смягчения их характера.
theological_decisions:
- issue: Обозначение Бога в выражении እግዚአብሔር
  choice: Господом
  alternative: Богом
  rationale: «Господь» соответствует устойчивому употреблению данного геэзского божественного титула и согласуется с контекстом Божьего закона, не добавляя конфессиональной конкретизации.
- issue: Степень нравственной оценки поступка
  choice: это мерзость пред Господом
  alternative: это отвратительно пред Господом
  rationale: Именная конструкция точнее сохраняет категоричную юридико-богословскую оценку источника.
translation_notes:
  register: Современный литературный русский с умеренно высоким, законодательным регистром. Формы «пред», «деяния» и «сказав» сохраняют достоинство и структуру древнего текста, оставаясь понятными современному читателю. Прямая речь намеренно вводится двоеточием, поскольку стих заканчивается формулой «сказав».
