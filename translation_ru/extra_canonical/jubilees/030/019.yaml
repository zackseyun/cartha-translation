  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: ru
  text: 'И потому ему записывают на небесных скрижалях свидетельство о благоволении[a]: благословение и праведность перед Богом всего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Геэз: ስምዐ ፡ ሞገስ (semʿa mogas) — буквально сочетание, обозначающее свидетельство или официальную запись о благоволении, одобрении либо милости.'
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: записывают
  rationale: Передаёт активную форму множественного числа источника, не уточняя, кто именно ведёт небесную запись.
- source_word: ስምዐ ፡ ሞገስ
  choice: свидетельство о благоволении
  rationale: Сохраняет значение засвидетельствованного одобрения или милости; конструкция с «о» естественна в современном русском языке.
- source_word: በጽላተ ፡ ሰማይ
  choice: на небесных скрижалях
  rationale: Точно передаёт устойчивый образ небесных табличек как места официальной записи.
- source_word: በረከተ ፡ ወጽድቀ
  choice: благословение и праведность
  rationale: Сохраняет два самостоятельных понятия источника без истолковывающего объединения.
- source_word: አምላከ ፡ ኵሉ
  choice: Богом всего
  rationale: Буквально сохраняет широкий и допускающий неоднозначность смысл «Бог всего», не сужая его до «всех людей».
theological_decisions:
- issue: Неопределённый субъект глагола ይጽሕፉ
  choice: сохранить безлично воспринимаемое множественное число «записывают»
  alternative: «записано» или «ангелы записывают»
  rationale: Источник употребляет активное множественное число, но не называет деятелей; перевод не должен вводить ангелов или превращать конструкцию в пассивную.
- issue: Связь «благословения и праведности» со свидетельством
  choice: сохранить пояснение после двоеточия
  alternative: включить их в однородный перечень отдельных записей
  rationale: Двоеточие естественно передаёт возможную пояснительную связь, не устраняя полностью синтаксическую сжатость исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской окраской. «Скрижали» сохраняют традиционный образ, а формулировка не уточняет неназванных в источнике деятелей и не разрешает неоднозначность выражения «Бог всего».
