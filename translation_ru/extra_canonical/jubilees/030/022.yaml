  yaml_path: translation/extra_canonical/jubilees/030/022.yaml
  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: ru
  text: И всё это они принесли Иакову, своему отцу. Он разговаривал с ними о том, что они уничтожили город[a], потому что боялся жителей той земли — хананеев и ферезеев. И страх, наведённый Яхве, охватил все города вокруг Сихема, и они не выступили в погоню за сыновьями Иакова, потому что их объял страх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «убили город».'
    reason: 'Сохраняет заметную идиоматичность исходного выражения и указывает на возможную метонимию: город назван вместо его жителей.'
lexical_decisions:
- source_word: ቀተሉ፡ ሀገረ
  choice: уничтожили город
  rationale: Буквально сочетание означает «убили город», но это идиома, в которой город обозначает его жителей; «уничтожили город» естественно передаёт смысл, не сужая его до одного лишь убийства населения.
- source_word: ግርማ፡ እግዚአብሔር
  choice: ужас перед Яхве
  rationale: Конструкция обозначает внушённый божественным присутствием страх; «перед Яхве» сохраняет связь ужаса с Богом и согласуется с принятой передачей божественного имени.
- source_word: ሰሰዲደ
  choice: выступили в погоню
  rationale: Передаёт направленное преследование сыновей Иакова естественным современным русским выражением.
- source_word: ድንጋፄ፡ ወደቀ፡ ላዕሌሆሙ
  choice: их объял страх
  rationale: Сохраняет образ внезапно охватившего их сильного страха, избегая неестественного буквального «страх пал на них».
theological_decisions:
- issue: Передача እግዚአብሔር в выражении о божественном ужасе
  choice: Яхве
  alternative: Господь
  rationale: Выбрано личное имя «Яхве» в соответствии с консультационным слоем POB; формулировка не уточняет сверх текста способ божественного воздействия.
translation_notes:
  register: Современный литературный русский, повествовательный и сдержанно-торжественный. Названия народов переданы традиционными библейскими формами; синтаксис упрощён для ясности без устранения причинно-следственных связей исходного текста.
