translation:
  language: ru
  text: 'И они вывели свою сестру Дину из дома Сихема и разграбили всё, что было в Сихеме: их овец, крупный скот, ослов, всё их имущество и всё их богатство. Всё это они принесли своему отцу Иакову.'
