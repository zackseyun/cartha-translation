- source_word: ወአውፅኡ፡ ዳናሃ፡ እኅቶሙ፡ እምፄ፡ ቤተ፡ ሴኬም
  choice: И они вывели свою сестру Дину из дома Сихема
  rationale: Передаёт последовательность глагола «вывели» и родственные отношения; форма имени нормализована по русской библейской традиции как «Дина».
- source_word: ወፄወዉ፡ ኵሎ፡ ዘሀለወ፡ ውስተ፡ ሰቂሞን
  choice: и разграбили всё, что было в Сихеме
  rationale: Глагол обозначает захват добычи или разграбление; оборот сохраняет широкое значение «всё, что находилось».
- source_word: አባግዒሆሙ፡ ወአልህምቲሆሙ፡ ወአእዱጊሆሙ
  choice: их овец, крупный скот, ослов
  rationale: Перечень видов домашнего скота передан естественными современными русскими названиями.
- source_word: ወኵሎ፡ መራዕዮሙ፡ ወኵሎ፡ ንዋዮሙ
  choice: все их стада и всё их имущество
  rationale: 'Сохраняются два параллельных обобщающих понятия: совокупность стад и прочее имущество/богатство.'
- source_word: ወአምጽኡ፡ ኵሎ፡ ኀበ፡ ያዕቆብ፡ አቡሆሙ
  choice: Всё это они принесли своему отцу Иакову
  rationale: Полностью сохраняет заключительную клаузу эфиопского текста, включая адресата и родственную связь.
