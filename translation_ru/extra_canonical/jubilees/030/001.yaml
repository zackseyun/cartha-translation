  text: And in the first year of the sixth week[1], he went up to Salem, east of Shechem, in peace, in the fourth month.
translation:
  language: ru
  text: И в первый год шестой седмины[a] он поднялся в Салим, к востоку от Сихема, с миром, в четвёртом месяце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальная хронологическая формула текста трудна. Речь идёт об Иакове, возвращающемся в Ханаан; движение описано в связи с Салимом, находящимся к востоку от Сихема.
    reason: segmentation_note
lexical_decisions:
- source_word: በቀዳሚ፡ ዓመት፡ ዘሱባዔ፡ ፮ይ
  choice: в первый год шестой седмины
  rationale: Сохраняется хронологическая формула оригинала. «Седмина» ясно обозначает семилетний цикл и соответствует возвышенному историческому регистру.
- source_word: ዐርገ
  choice: поднялся
  rationale: Передаёт пространственное значение глагола восхождения без ненужного уточнения способа движения.
- source_word: ሰሌማሃ
  choice: в Салим
  rationale: Передано как географическое название; форма «Салим» естественна в русской библейской ономастике.
- source_word: ዘመንገለ፡ ጽባሒሁ፡ ለሰቂማ
  choice: к востоку от Сихема
  rationale: Естественно передаёт относительное местоположение Салима по отношению к Сихему.
- source_word: በወርኅ፡ ፬ይ
  choice: в четвёртом месяце
  rationale: Следует засвидетельствованному чтению стандартного эфиопского текста; прежний вариант «в седьмом месяце» не поддерживается источником.
