revisions:
- from: Потомство Левия было избрано для священства и служения левитов, чтобы служить перед Господом, как мы служим во все дни[a]. Левий и его сыновья будут благословенны вовеки, потому что он проявил ревность, совершив праведный суд и возмездие над всеми, кто восставал против Израиля.
  to: Род Левия был избран для священства и быть левитами, чтобы они служили перед Господом, как мы служим во всякое время[a]. Левий и его потомство будут благословенны вовеки, потому что он ревностно совершал праведность, суд и возмездие над всеми, кто восставал против Израиля.
  rationale: 'Правка уточняет, что потомство Левия избрано не просто для некоего левитского служения, а для статуса левитов, сохраняет собирательный смысл «семени» и восстанавливает все три элемента исходной формулы: праведность, суд и возмездие. Сноска сохранена, а её якорь оставлен при объясняемой фразе.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T18:48:12Z'
review_pass:
  verdict: revise
  source_fidelity: Нужна правка двух мест. Выражение «служения левитов» может означать служение, совершаемое левитами, тогда как исходная конструкция говорит об избрании потомства Левия для священства и в качестве левитов. Кроме того, формула «праведность, суд и возмездие» в исходнике трёхчленна; в черновике «праведный суд» сливает первые два понятия.
  naturalness: Текст в целом литературен и ясен. «Быть левитами» естественнее и точнее, чем «служения левитов». «Во всякое время» передаёт постоянство служения более естественно, чем буквальное «во все дни».
  terminology: «Господь», «священство», «левиты», «ревность» и «возмездие» уместны. «Потомство» адекватно передаёт собирательное «семя/род»; во втором предложении его следует сохранить вместо более узкого «сыновья».
  issues:
  - severity: medium
    issue: Не вполне точно передан статус левитов.
    rationale: «Для священства и служения левитов» допускает понимание «для служения, которое совершают левиты», а не избрание потомства Левия быть левитами.
  - severity: medium
    issue: Слита трёхчленная формула действий Левия.
    rationale: Исходный текст перечисляет праведность, суд и возмездие. «Праведный суд и возмездие» неявно поглощает «праведность» определением к слову «суд».
  - severity: low
    issue: «Его сыновья» уже, чем исходное «его семя/потомство».
    rationale: Речь относится к Левию и его потомству в целом, а не только к его непосредственным сыновьям.
  revised_text: Род Левия был избран для священства и быть левитами, чтобы они служили перед Господом, как мы служим во всякое время[a]. Левий и его потомство будут благословенны вовеки, потому что он ревностно совершал праведность, суд и возмездие над всеми, кто восставал против Израиля.
