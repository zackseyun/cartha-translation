  yaml_path: translation/extra_canonical/jubilees/030/017.yaml
  text: And the seed of Levi was chosen for the priesthood and to be Levites, that they might minister before the LORD as we do at all times[17]. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.
translation:
  language: ru
  text: Род Левия был избран для священства и быть левитами, чтобы они служили перед Господом, как мы служим во всякое время[a]. Левий и его потомство будут благословенны вовеки, потому что он ревностно совершал праведность, суд и возмездие над всеми, кто восставал против Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «как мы служим во всякое время» передают точку зрения ангела, говорящего в повествовательной рамке откровения на Синае.
    reason: cross_reference
lexical_decisions:
- source_word: ዘርአ፡ ሌዊ
  choice: потомство Левия
  rationale: Передаёт собирательное значение «семя/род Левия» естественным современным русским языком.
- source_word: ለክህነት፡ ወለሌዋውያን
  choice: для священства и служения левитов
  rationale: Сохраняет две связанные категории исходного выражения, но избегает неясного буквального «для священства и для левитов».
- source_word: ይትለአኩ
  choice: служить
  rationale: В данном культовом контексте глагол обозначает служение перед Богом.
- source_word: ቀንአ
  choice: проявил ревность
  rationale: Сохраняет положительный смысл ревностной преданности и усердия, а не чувство зависти.
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: праведный суд и возмездие
  rationale: Передаёт совокупный судебно-нравственный смысл трёхчленной формулы естественно по-русски; «праведность» определяет совершённый суд, а «возмездие» сохраняет идею отмщения.
theological_decisions:
- issue: Основание избрания потомства Левия
  choice: Сохранена причинная связь с ревностью Левия и его действиями против восставших на Израиль.
  alternative: Ослабить связь и представить избрание как не обусловленное описанными действиями.
  rationale: Исходный текст прямо связывает вечное благословение Левия с тем, что он проявил ревность и совершил суд и возмездие; эту напряжённость нельзя устранять богословским переосмыслением.
- issue: Говорящий в выражении «как мы»
  choice: Множественное число сохранено и пояснено сноской как речь ангельского повествователя.
  alternative: Заменить на безличное «непрестанно» или отнести «мы» к людям.
  rationale: Форма первого лица множественного числа принадлежит исходному тексту и отражает повествовательную рамку Книги Юбилеев.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Сохранены культовая лексика, вечное благословение и мотив ревностного суда; синтаксис сделан ясным для обычного читателя.
