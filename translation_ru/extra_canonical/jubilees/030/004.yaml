base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: ru
  text: Они говорили с ними лживо, поступили с ними вероломно и ввели их в заблуждение. Симеон и Левий внезапно вошли в Сихем и совершили суд над всеми мужчинами Сихема. Они убили всех мужчин, которых нашли в городе, не оставив там ни одного; всех их убили, когда те мучились[a], потому что они опозорили их сестру Дину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в мучении» или «в страдании»; вероятно, имеется в виду боль после обрезания.'
    reason: Сохраняет отличительную деталь эфиопского текста и предотвращает привычную гармонизацию с Быт. 34:26 («остриём меча»).
lexical_decisions:
- source_word: በአኩይ
  choice: лживо
  rationale: Наречное выражение буквально связано со злом; в контексте переговоров перед нападением естественно передаёт злой умысел и обман.
- source_word: ወኀብለይዎሙ
  choice: поступили с ними вероломно
  rationale: Передаёт идею предательского, коварного обращения, не сводя её к простому произнесению лжи.
- source_word: ወአስፈጥዎሙ
  choice: и ввели их в заблуждение
  rationale: Сохраняет отдельный третий элемент последовательности действий и соответствует значению обмана или введения в заблуждение.
- source_word: ግብተ
  choice: внезапно
  rationale: По контексту обозначает неожиданный, заставший жителей врасплох вход; русское «внезапно» звучит естественно и не уточняет способ проникновения.
- source_word: ገብሩ፡ ኵነኔ
  choice: совершили суд
  rationale: Формально сохраняет судебную лексику источника, не заменяя её нейтральным «расправились» и не одобряя сам поступок.
- source_word: በ፵ዐር (испр. በጻዕር)
  choice: когда те мучились
  rationale: Передаёт значение «в мучении, страдании» и связывает обстоятельство с состоянием убитых; не гармонизирует текст с выражением «остриём меча» из Бытия 34.
- source_word: ገመፉ
  choice: опозорили
  rationale: Передаёт тяжёлое бесчестье и надругательство, сохраняя оценочный язык источника.
theological_decisions:
- issue: Судебная оценка действий Симеона и Левия
  choice: «совершили суд над»
  alternative: «учинили расправу над»
  rationale: Источник использует лексику суда. Перевод сохраняет её, но не добавляет утверждения, что этот суд был божественно санкционирован или справедлив.
- issue: Причина мучений мужчин Сихема
  choice: Не раскрывать в основном тексте, но пояснить в сноске вероятную связь с обрезанием
  alternative: Прямо написать «от боли после обрезания»
  rationale: В данном стихе причина мучений не названа прямо; связь ясна из повествовательного контекста, однако её не следует вносить в основной текст как явное содержание фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан ясным для широкого читателя; повторение «всех» сохранено как риторическое усиление источника. «В городе» употреблено вместо буквального местоименного «в нём/в ней», чтобы исключить неясность русской анафоры.
