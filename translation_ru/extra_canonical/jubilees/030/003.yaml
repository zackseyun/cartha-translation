  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: ru
  text: Ей было двенадцать лет. И он просил её отца и её братьев отдать её ему в жёны. Иаков и его сыновья разгневались из-за мужчин Сихема, потому что те осквернили их сестру Дину.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰተ፡ ፲ወ፪ዓመት
  choice: Ей было двенадцать лет
  rationale: Естественная русская передача указания возраста при сохранении смысла геэзского текста.
- source_word: አስተብቍዓ
  choice: просил
  rationale: Передаёт просьбу о выдаче девушки замуж без добавления оттенка требования.
- source_word: ትትወሀብ፡ ሎቱ፡ ብእሲተ
  choice: отдать её ему в жёны
  rationale: Естественно и точно передаёт пассивную конструкцию «чтобы она была дана ему как жена».
- source_word: ዐደወ፡ ሰቂማ
  choice: мужчин Сихема
  rationale: ዐደወ — конструктивная форма множественного числа со значением «мужчины/люди», а не «город».
- source_word: አርኰስዋ
  choice: осквернили
  rationale: Сохраняет сильную нравственно-ритуальную окраску глагола и не конкретизирует действие сверх исходного текста.
theological_decisions:
- issue: Характер осквернения Дины
  choice: осквернили
  alternative: обесчестили
  rationale: «Осквернили» ближе к исходной лексеме и сохраняет её богословско-нравственную напряжённость, не сводя смысл лишь к общественной чести.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования; синтаксис упрощён лишь настолько, чтобы текст был понятен обычному читателю. Противительное «но» естественно выражает смену действия и реакции, не меняя содержания.
