  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: ru
  text: 'И потому Я повелел тебе: «Засвидетельствуй это перед Израилем: посмотри, что произошло с жителями Сихема и их сыновьями. Они были отданы в руки двух сыновей Иакова, и те мучительно убили их[a]. Это было вменено им в праведность и записано им в праведность».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение в источнике трудно для истолкования. Здесь оно передано как «мучительно»; его также можно понять как «в бедствии», а в некоторых текстовых традициях — «мечом». Во всех случаях речь идёт о насильственной гибели сихемлян.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስምዕ፡ ዛተ፡ ስምዐ፡ ላዕለ፡ እስራኤል
  choice: Засвидетельствуй это перед Израилем
  rationale: Передаёт сочетание глагола «свидетельствовать» и существительного «свидетельство» естественным современным русским выражением, не перегружая текст тавтологией.
- source_word: ለሰቂሞን፡ ወለውሉዱ
  choice: с жителями Сихема и их сыновьями
  rationale: Форма обозначает сихемлян; описательное «жители Сихема» понятнее современному читателю, чем редкий этноним.
- source_word: በፃዕር
  choice: подвергнув мучениям
  rationale: Сохраняет значение тяжкого страдания или мучения, засвидетельствованное основной традицией, при этом трудность выражения отмечена в сноске.
- source_word: ወኮነቶሙ፡ ጽድቀ
  choice: Это было вменено им в праведность
  rationale: Сохраняет библейскую формулу и связь поступка с приписанной им праведностью, не заменяя её более узким толкованием.
- source_word: ወተጽሕፎሙ፡ ለጽድቅ
  choice: и записано им как праведность
  rationale: Передаёт письменную небесную запись и дательный элемент «им», не создавая ложного впечатления, будто им было адресовано письмо.
theological_decisions:
- issue: Положительная оценка убийства сихемлян
  choice: Сохранено прямое утверждение, что поступок был вменён двум сыновьям Иакова в праведность.
  alternative: Смягчить формулировку до «это сочли оправданным».
  rationale: Источник намеренно даёт напряжённую богословскую оценку; перевод не должен устранять её или согласовывать с иной традицией толкования.
- issue: Смысл выражения о праведности
  choice: Использована формула «вменено им в праведность».
  alternative: «Было признано их праведным поступком».
  rationale: Выбранная формула точнее сохраняет различие между поступком и приписанной праведностью, а также повтор источника «праведность… праведность».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь оформлена ясно; повтор слова «праведность» сохранён как значимый элемент источника.
