  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: ru
  text: «Мы не отдадим нашу дочь необрезанному мужчине, потому что это позор для нас».[a] И это позор для Израиля — для тех, кто отдаёт дочерей, и для тех, кто берёт жён из дочерей других народов, потому что это нечисто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первая фраза представляет собой прямую речь и перекликается с Быт. 34:14; далее следует отдельное суждение об Израиле.
    reason: Уточняет границу говорящих, которую важно обозначить кавычками, но которая не выражена отдельной вводной формулой в данном стихе.
lexical_decisions:
- source_word: ቍልፈተ
  choice: крайняя плоть
  rationale: Передаёт конкретное телесное значение исходного слова и сохраняет связь с формулировкой Быт. 34:14, не заменяя её истолковывающим словом «необрезанный».
- source_word: ጽእለት
  choice: позор
  rationale: Современное и естественное соответствие значению «поругание, бесчестье, позор»; повтор слова сохранён вслед за источником.
- source_word: አሕዛብ
  choice: другие народы
  rationale: Передаёт этнический смысл «народы» в противопоставлении Израилю, не вводя более узкого религиозного обозначения «язычники».
- source_word: ርኵስ
  choice: нечисто
  rationale: Сохраняет категорию нечистоты исходного текста и его краткую безличную формулировку.
theological_decisions:
- issue: Переход от прямой речи к нормативному комментарию
  choice: Первая фраза заключена в кавычки, а последующая фраза оставлена за их пределами.
  alternative: Передать весь стих как непрерывное высказывание без кавычек.
  rationale: Так ясно сохраняется вероятная граница между цитатой сыновей Иакова, перекликающейся с Быт. 34:14, и последующим комментарием об Израиле.
- issue: Характер нечистоты
  choice: «потому что это нечисто»
  alternative: «потому что это осквернение» или уточнение, что речь идёт о ритуальной нечистоте.
  rationale: Источник не уточняет вид нечистоты; буквальная нейтральная формулировка сохраняет богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксический параллелизм «для тех, кто… и для тех, кто…» и повтор слова «позор» сохранены. Добавлен подразумеваемый объект «дочерей» после «отдаёт» для естественности по-русски; «себе» поясняет направленность глагола «берёт», не уточняя сверх источника форму брачного союза.
