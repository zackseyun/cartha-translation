  terminology: «Позор», «Израиль», «дочери других народов» и «нечисто» удачны. «Необрезанному мужчине» передаёт значение геэзской формулы без медицински неудачного буквального калькирования; это не богословское уточнение, а нормальное воспроизведение её референта.
