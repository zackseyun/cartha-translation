  source_fidelity: 'Первая фраза верно передаёт цитату и границу между прямой речью и последующим комментарием. Однако буквальное «мужчине, у которого есть крайняя плоть» в современном русском семантически сбивает: крайняя плоть есть у любого не обрезанного хирургически мужчины, а исходная формула является устойчивым обозначением необрезанного. Во второй части «берёт себе дочерей других народов» недостаточно ясно передаёт брачно-семейственный смысл параллельных глаголов «отдавать» и «брать».'
