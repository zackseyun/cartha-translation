  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: ru
  text: 'Итак, установлено и записано на небесных скрижалях об Израиле и его потомстве: они должны отмечать этот праздник семь дней с праздничной радостью[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с радостью праздника».'
    reason: Показывает необычное исходное сочетание и сохраняет заметное повторение слова «праздник».
lexical_decisions:
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ
  choice: установлено и записано
  rationale: Передаёт сочетание предписания и его письменного закрепления; по-русски естественнее без буквального упоминания «книги/письма».
- source_word: ጽላተ፡ ሰማይ
  choice: небесных скрижалях
  rationale: Устоявшийся и точный эквивалент образа небесных таблиц/скрижалей.
- source_word: ዲበ፡ ዘርኡ
  choice: о … его потомстве
  rationale: ዘር означает «семя» в собирательном значении потомков; «потомство» естественно в современном русском.
- source_word: ለገቢረ፡ ዛቲ፡ በዓል
  choice: они должны отмечать этот праздник
  rationale: Буквально «совершать/делать этот праздник»; «отмечать» ясно передаёт предписанное празднование.
- source_word: በፍሥሓ፡ በዓል
  choice: с праздничной радостью
  rationale: Сохраняет и значение радости, и повторное упоминание праздника в конце стиха, не сводя выражение просто к «с радостью».
theological_decisions:
- issue: Обязательный характер небесного установления
  choice: они должны отмечать
  alternative: чтобы они отмечали
  rationale: Форма с «должны» ясно выражает нормативную силу установленного и записанного предписания, не добавляя конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский с библейски уместным словом «скрижали». Синтаксис упрощён ради ясности, а повторное значение «праздника» сохранено в выражении «праздничная радость».
