  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: ru
  text: И встал он рано утром, оседлал своего осла, взял с собой двух слуг и Исаака, своего сына, расколол дрова для всесожжения и на третий день отправился к тому месту.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አድጎ
  choice: своего осла
  rationale: В данном контексте слово обозначает осла; притяжательное «своего» естественно по-русски и соответствует определённости участника повествования.
- source_word: ደቂቀ
  choice: двух слуг
  rationale: Форма передаёт сопровождающих Авраама молодых людей/слуг; «слуг» ясно выражает их роль в контексте и соответствует параллельному рассказу Быт 22:3.
- source_word: መሥዋዕተ
  choice: для всесожжения
  rationale: Жертвенный термин передан традиционным и общепонятным библейским словом «всесожжение».
- source_word: መካን
  choice: к тому месту
  rationale: Определённое место, о котором уже было сказано или которое было указано; указательное «тому» естественно передаёт контекстуальную определённость.
theological_decisions:
- issue: Связь выражения «на третий день» с данным стихом или следующим повествовательным эпизодом
  choice: Выделить «На третий день…» как начало следующей фразы и отметить текстовую неопределённость сноской
  alternative: «…и на третий день пришёл к тому месту»
  rationale: Сохранившаяся геэзская строка ставит выражение «на третий день» после глагола движения, но из-за границы стиха и синтаксической связи возможны разные членения. Не следует добавлять отсутствующий здесь глагол «пришёл» и тем самым устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Последовательность действий сохранена; избыточное повторение союза ወ передано естественным русским перечислением. Сноска отмечена в основном тексте.
