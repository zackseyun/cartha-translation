  text: And I called to him from heaven and said to him, “Abraham, Abraham.” And he was terrified and said, “Here I am.”
translation:
  language: ru
  text: 'И я воззвал к нему с неба и сказал ему: «Авраам, Авраам!» Он ужаснулся и ответил: «Вот я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: воззвал к нему
  rationale: Форма глагола «звать, взывать» с объектным суффиксом; «воззвал» сохраняет торжественный повествовательный регистр и направление обращения.
- source_word: እምሰማይ
  choice: с неба
  rationale: Прямое соответствие предлогу исходной точки и существительному «небо».
- source_word: ወይገብዕ
  choice: он ужаснулся
  rationale: Передаёт засвидетельствованное в данном контексте значение ገብዐ — «испугаться, ужаснуться, отпрянуть от страха», а не ранее предложенное «поспешил».
- source_word: ነየ፡ አነ
  choice: Вот я
  rationale: Естественная русская формула готовности откликнуться, соответствующая буквальному «вот я».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор имени и внезапная испуганная реакция Авраама сохранены без сглаживания. Местоимение «я» оставлено со строчной буквы, поскольку говорящий в контексте стиха прямо не назван.
