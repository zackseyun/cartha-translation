review_pass:
  verdict: revise
  source_fidelity: 'Содержание передано верно: говорящий стоит перед Господом и князем Мастемой; Господь велит удержать адресата от действия против юноши и подтверждает, что тот боится Бога. Однако «простирать руки» во множественном числе менее точно передаёт единственное число «руку», а «ничего ему не делать» в русском языке допускает нежелательное нейтральное прочтение («ничего для него не делать»).'
  naturalness: «Вели ему не простирать руки» звучит несколько тяжеловесно, а последующее «ничего ему не делать» двусмысленно. Конструкция «Скажи ему, чтобы он не поднимал руки на отрока и ничего не делал над ним» естественна, сохраняет библейски сдержанный регистр и ясно выражает запрет.
  terminology: «Князь Мастема» соответствует английской контрольной версии и традиционной титулатуре данного персонажа. «Отрок» уместен для умеренно библейского современного регистра. Формула «боится Бога» точно сохраняет исходное выражение без богословского истолкования.
  issues:
  - severity: medium
    issue: Неясное выражение «ничего ему не делать»
    rationale: В русском оно может означать не причинять ему ничего либо не предпринимать ничего для него. Исходник запрещает какое-либо действие над/против юноши; «ничего не делать над ним» устраняет двусмысленность.
  - severity: low
    issue: Множественное число «руки»
    rationale: В источнике и английской контрольной версии стоит единственное число («his hand»). Русская идиома «поднимать руку на кого-либо» точно и естественно передаёт смысл.
  - severity: low
    issue: «Вели ему» менее естественно для передачи повеления «Tell him»
    rationale: «Скажи ему, чтобы...» сохраняет опосредованный характер распоряжения и звучит по-русски плавнее.
  revised_text: 'И я встал перед Ним и перед князем Мастемой. И Господь сказал: «Скажи ему, чтобы он не поднимал руки на отрока и ничего не делал над ним, ибо теперь Я знаю, что он боится Бога».'
