  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: ru
  text: 'И я встал перед Ним и перед князем Мастемой. И Господь сказал: «Скажи ему, чтобы он не поднимал руки на отрока и ничего не делал над ним, ибо теперь Я знаю, что он боится Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእክት፡ መስተማ
  choice: князем Мастемой
  rationale: Передаёт титул и имя, засвидетельствованные в эфиопском тексте; русская форма имени согласована с традиционной передачей Мастемы.
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: не простирать руки на отрока
  rationale: Сохраняет библейскую идиому о поднятии или простёртии руки с целью причинить вред, не вводя неестественного буквального «не опускать руку».
- source_word: ሕፃን
  choice: отрока
  rationale: Контекст указывает на Исаака как юного сына; «отрок» сохраняет достоинство библейского регистра и понятен современному читателю.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: боится Бога
  rationale: Устойчивая библейская формула, выражающая благоговейный страх перед Богом без дополнительного толкования.
theological_decisions:
- issue: Формула Божьего знания после испытания
  choice: ибо теперь Я знаю
  alternative: ибо Я узнал
  rationale: Сохранена временная формула источника и её богословское напряжение; текст не объясняет, как она соотносится с Божьим всеведением.
- issue: Референт местоимения в повелении
  choice: Вели ему
  alternative: Скажи ему
  rationale: Повелительная формулировка естественно передаёт обращение Господа к говорящему ангелу о том, кто должен удержаться от действия; неоднозначность личности исполнителя не расширяется толкованием.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Местоимение «Ним» написано с прописной буквы как отсылка к Господу; синтаксис разделён на два предложения для ясности без изменения содержания.
