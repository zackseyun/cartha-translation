  rationale: Исправлены русская двусмысленность и число существительного в образе «руки», без изменения участников, временной формулы «теперь Я знаю» или намеренно неразрешённого соотношения местоимений. Титул и имя Мастемы сохранены согласно контрольной английской версии.
