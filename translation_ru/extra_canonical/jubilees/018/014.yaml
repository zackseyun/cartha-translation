  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: ru
  text: И Господь во второй раз воззвал с неба к Аврааму по имени, как он показал мне, что нам следует говорить во имя Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዖ
  choice: И … воззвал
  rationale: Глагол передаёт обращённый к человеку призыв; «воззвал» сохраняет возвышенный библейский регистр и естественно сочетается с «с неба».
- source_word: በስሙ
  choice: по имени
  rationale: Буквально и естественно передаёт указание на обращение к Аврааму по имени.
- source_word: ዳግመ
  choice: во второй раз
  rationale: Точно передаёт повторность действия в данном контексте.
- source_word: አስተረአየኒ
  choice: показал мне
  rationale: Сохраняет каузативное значение исходной формы и местоимение первого лица, не уточняя сверх текста, что именно было показано.
- source_word: ንትናገር
  choice: мы говорили
  rationale: Сохраняет форму первого лица множественного числа и зависимость от союза цели/следствия «чтобы».
- source_word: በስመ እግዚአብሔር
  choice: во имя Господа
  rationale: Устойчивое и близкое к форме источника соответствие выражению «в имени/во имя Господа».
theological_decisions:
- issue: К кому относится подлежащее «показал» и какова связь заключительной части
  choice: Сохранены местоименное «Он» и конструкция «как Он показал мне, чтобы мы говорили…» без поясняющей вставки.
  alternative: Уточнить предполагаемого говорящего или истолковать фразу как «как Он явился мне и велел нам говорить…».
  rationale: Исходный текст допускает напряжённую и несколько неясную синтаксическую связь; перевод не должен молча устранять эту неоднозначность или добавлять повеление, которого явно нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сделан естественным для русского, при этом сохранены повторность призыва, небесное происхождение голоса, первое лицо рассказчика и неоднозначная связь сравнительно-целевой конструкции.
