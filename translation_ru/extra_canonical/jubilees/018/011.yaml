  yaml_path: translation/extra_canonical/jubilees/018/011.yaml
  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: ru
  text: 'И я сказал ему: «Не поднимай руку на мальчика и ничего ему не делай, ибо теперь я знаю, что ты боишься Бога и не пожалел для меня своего сына, своего первенца[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В печатном издании Charles: «твоего первенца». Чтение «твоё семя» в предоставленной электронной транскрипции — результат ошибки распознавания текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ወእቤሎ
  choice: И я сказал ему
  rationale: Форма глагола — 1-е лицо единственного числа; говорящий продолжает повествование от первого лица.
- source_word: አትፈኑ፡ እዴከ፡ ዲበ፡ ሕፃን
  choice: Не поднимай руки на отрока
  rationale: Естественный русский оборот точно передаёт запрет простирать/направлять руку против юноши; «отрок» сохраняет достоинство повествовательного регистра.
- source_word: ወአትግበር፡ ምንተኒ፡ ዲቤሁ
  choice: и ничего ему не делай
  rationale: Прямое и естественное соответствие исходному запрету не делать ему ничего.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: боишься Бога
  rationale: Передаёт буквальный смысл «боящийся Бога», не заменяя его более конфессионально окрашенным истолкованием.
- source_word: ወኢምሕከ
  choice: ты не пожалел для меня
  rationale: В контексте принесения сына выражает то, что Авраам не удержал и не пощадил его; по-русски звучит естественнее буквального «не удержал от меня».
- source_word: ወልደከ፡ በኵረከ
  choice: своего сына, своего первенца
  rationale: Следует чтению печатного издания Charles 1895; переданное в машинной транскрипции በዘረከ («твоё семя») является ошибкой распознавания вместо በኵረከ («твой первенец»).
theological_decisions:
- issue: Кто говорит в первом лице
  choice: Сохранено «я сказал» и строчная форма «для меня»
  alternative: «он сказал» либо богословски интерпретирующее «для Меня»
  rationale: Глагольная форма прямо указывает на первое лицо, но стих сам по себе не требует типографски отождествлять говорящего с Богом; строчная буква сохраняет повествовательную неоднозначность.
- issue: Значение страха Божьего
  choice: «ты боишься Бога»
  alternative: «ты благоговеешь перед Богом»
  rationale: Буквальная формулировка сохраняет богословское напряжение понятия страха Божьего и не сводит его только к благоговению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис оставлен ясным, без архаических форм; слово «отрок» избрано как уместное для торжественного повествования.
