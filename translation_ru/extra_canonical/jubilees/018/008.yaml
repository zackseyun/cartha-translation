  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: ru
  text: И он построил жертвенник, положил дрова на жертвенник, связал своего сына Исаака и положил его на дрова поверх жертвенника. Затем он протянул руку, чтобы взять нож и заколоть своего сына Исаака.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: жертвенник
  rationale: В данном контексте слово обозначает сооружённый Авраамом алтарь для жертвоприношения; «жертвенник» естественно и точно передаёт культовый смысл.
- source_word: ዕፀወ / ዕፀው
  choice: дрова
  rationale: Хотя буквально речь идёт о древесине, контекст жертвоприношения требует естественного русского «дрова».
- source_word: አሰረ
  choice: связал
  rationale: Прямое соответствие действию связывания Исаака без добавления не выраженных в источнике подробностей.
- source_word: መጥባሕተ
  choice: нож
  rationale: Орудие заклания в данном повествовании; нейтральное «нож» сохраняет предметный смысл исходного слова.
- source_word: ይዝብሖ
  choice: заколоть
  rationale: Глагол выражает ритуальное убоение, а не просто убийство; «заколоть» сохраняет жертвенный контекст.
theological_decisions:
- issue: Характер намерения Авраама в финальной фразе
  choice: «чтобы … заколоть»
  alternative: «чтобы принести … в жертву»
  rationale: Перевод сохраняет конкретное действие исходного глагола и не заменяет его более широким богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка разделён на два предложения ради ясности, при сохранении последовательности действий и повторения «своего сына Исаака».
