  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: ru
  text: 'Он увидел то место издалека. Дойдя до колодца[a], он сказал своим слугам: «Останьтесь здесь с ослами, а мы с мальчиком пойдём дальше, поклонимся и вернёмся к вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «колодца с водой»; возможно также: «ямы с водой».'
    reason: Сочетание ዐዘቅተ ማይ допускает передачу как колодца либо водяной ямы/резервуара.
lexical_decisions:
- source_word: መካነ
  choice: то место
  rationale: Определённый по контексту объект передан естественным русским выражением «то место».
- source_word: ዐዘቅተ፡ ማይ
  choice: колодец
  rationale: Сочетание буквально обозначает углубление или колодец с водой; «колодец» — наиболее естественное современное соответствие, а более буквальный вариант отмечен в сноске.
- source_word: ለደቁ
  choice: своим слугам
  rationale: В контексте это сопровождающие Авраама молодые слуги; перевод «слугам» ясно передаёт их роль без неестественного буквализма.
- source_word: አድግት
  choice: ослами
  rationale: В геэзском тексте стоит форма множественного числа; она сохранена без гармонизации с Быт. 22:5.
- source_word: ወሕፃን
  choice: с мальчиком
  rationale: Слово обозначает ребёнка или мальчика; здесь речь об Исааке, и «мальчик» естественно в данном повествовательном контексте.
- source_word: ወሰጊደነ
  choice: поклонимся
  rationale: Глагол выражает поклонение или совершение поклона; «поклонимся» сохраняет и телесный, и культовый оттенок.
theological_decisions:
- issue: Утверждение Авраама о возвращении обоих
  choice: «вернёмся к вам»
  alternative: «я вернусь к вам» или пояснение скрытого намерения Авраама
  rationale: Форма первого лица множественного числа сохранена без богословского объяснения или согласования с последующими событиями; напряжение повествования остаётся открытым.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Конструкция «мы с мальчиком» выбрана как естественный русский эквивалент буквального «я и мальчик». Множественное число «ослами» строго следует геэзскому тексту.
