translation:
  language: ru
  text: 'И назвал Авраам то место «Господь увидел», так что говорится: «Господь увидел» — это гора Сион.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ
  choice: назвал
  rationale: Обычное современное соответствие глаголу «называть, давать имя» в данном повествовательном контексте.
- source_word: መካን
  choice: место
  rationale: Прямое и естественное соответствие существительному «место».
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Традиционное русское библейское соответствие обозначению Бога в этой формуле.
- source_word: ርእየ
  choice: увидел
  rationale: Сохранено прямое значение формы «увидел» без истолковывающего расширения «усмотрит/предусмотрит».
- source_word: ደብረ፡ ጽዮን
  choice: гора Сион
  rationale: Прямое соответствие географическому наименованию; форма «гора Сион» естественна для современного русского библейского регистра.
theological_decisions:
- issue: Значение формулы «Господь увидел»
  choice: Господь увидел
  alternative: Господь усмотрел / Господь предусмотрит
  rationale: Перевод следует засвидетельствованному эфиопскому тексту и сохраняет глагол зрительного восприятия, не вводя богословское толкование о провидении или обеспечении.
- issue: Отождествление места с Сионом
  choice: это гора Сион
  alternative: то есть гора Сион
  rationale: Прямая связка сохраняет утверждение источника и не делает его явно пояснительной вставкой переводчика.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified библейским звучанием. Повтор формулы сохранён как значимый элемент источника; двусмысленность между буквальным «увидел» и возможным богословским осмыслением не устранена.
