  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: ru
  text: И он соблюдал этот праздник каждый год семь дней с радостью и назвал его праздником Господа — по числу семи дней, в которые он отправился и возвратился с миром.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር፡ ዛተ፡ በዓለ
  choice: соблюдал этот праздник
  rationale: Глагол буквально означает «делать, совершать»; применительно к ежегодному празднику естественное русское соответствие — «соблюдать праздник».
- source_word: በኵሉ፡ ዓመታት
  choice: каждый год
  rationale: Передаёт регулярность ежегодного совершения праздника естественным современным русским выражением.
- source_word: በፍሥሓ
  choice: с радостью
  rationale: Сохраняет прямое значение радости или ликования без стилистического утяжеления.
- source_word: በዓለ፡ እግዚአብሔር
  choice: праздником Господа
  rationale: Формально и естественно передаёт наименование праздника; родительный падеж сохраняет возможную связь посвящения или принадлежности.
- source_word: ሖረ፡ ወተመይጠ፡ በሰላም
  choice: ходил и возвратился с миром
  rationale: Сохраняет последовательность двух глаголов и формулу благополучного возвращения, не уточняя подразумеваемое путешествие сверх источника.
theological_decisions:
- issue: Значение наименования «праздник Господа»
  choice: Сохранено без поясняющего добавления
  alternative: «праздник, посвящённый Господу»
  rationale: Источник допускает оттенки принадлежности и посвящения; более развёрнутая формулировка преждевременно устранила бы эту неоднозначность.
- issue: Связь семи дней праздника с путешествием
  choice: «по числу семи дней, в течение которых он ходил и возвратился»
  alternative: «соответственно семи дням его пути туда и обратно»
  rationale: Выбранная форма ближе к исходной глагольной конструкции и не вводит явно выраженного направления «туда», которого в тексте нет.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; подлинная неопределённость выражения о пути сохранена.
