    issue: «ходил» вместо однократного отправления
    rationale: Геэзские глаголы и английское audit trail («he had gone and returned») описывают отправление и возвращение, а не продолжительное либо многократное хождение. «Отправился» сохраняет неназванное направление и не добавляет деталей пути.
