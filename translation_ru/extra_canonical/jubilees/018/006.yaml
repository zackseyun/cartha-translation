  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: ru
  text: 'Исаак сказал своему отцу: «Отец мой!» Тот ответил: «Вот я, сын мой». Исаак сказал ему: «Вот огонь, нож и дрова, но где овца для всесожжения, отец мой?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጥባሕት
  choice: нож
  rationale: Слово обозначает орудие для заклания; «нож» естественно по-русски и соответствует контексту жертвоприношения.
- source_word: በግዕ
  choice: овца
  rationale: Геэзское слово обозначает овцу или животное из мелкого рогатого скота; сохранено более буквальное «овца», без сужения до «ягнёнка».
- source_word: ጽንሓሕ
  choice: всесожжение
  rationale: Передаёт жертву, целиком сжигаемую на огне, и соответствует устойчивой русской библейской терминологии.
theological_decisions:
- issue: Вид жертвенного животного
  choice: овца
  alternative: ягнёнок / агнец
  rationale: Источник не требует уточнять возраст животного; «овца» сохраняет его лексическую широту и не вносит дополнительной типологической окраски.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повтор речи слегка прояснён именем «Исаак», чтобы избежать неясной цепочки местоимений, при сохранении структуры диалога.
