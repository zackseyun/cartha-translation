  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: ru
  text: И благословятся в твоём потомстве все народы земли за то, что ты послушался Моего голоса. Я возвестил всем, что ты верен Мне во всём, что Я сказал тебе. Иди с миром».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  choice: в твоём потомстве
  rationale: Передаёт собирательное значение «семя, потомство» и сохраняет формулу благословения без преждевременного сведения к одному потомку.
- source_word: ይትባረኩ
  choice: благословятся
  rationale: Возвратная форма естественно передаёт пассивное значение геэзского глагола и сохраняет формальную связь с библейской формулой.
- source_word: ህየንተ፡ ዘሰማዕከ፡ ቃለ፡ ዚአየ
  choice: за то, что ты послушался Моего голоса
  rationale: «Слышать голос» в данном контексте означает повиноваться; русский оборот «послушался голоса» сохраняет и образ, и смысл.
- source_word: አይደዐኩ፡ ለኵሉ
  choice: Я возвестил всем
  rationale: Передаёт каузативное «дал знать, сделал известным» естественным литературным русским выражением.
- source_word: ምእመን
  choice: верен
  rationale: Точно выражает характеристику Авраама как надёжного и верного Богу.
- source_word: ዘእቤለከ
  choice: что Я повелел тебе
  rationale: Буквально возможно «что Я сказал тебе»; в контексте испытания речь относится к Божьему распоряжению, поэтому «повелел» яснее передаёт прагматический смысл.
- source_word: ሖር፡ በሰላም
  choice: Иди с миром
  rationale: Устойчивый и точный русский эквивалент формулы отпущения.
theological_decisions:
- issue: Значение «семени» в обещании
  choice: потомство
  alternative: потомок
  rationale: Геэзское ዘርእ допускает собирательное значение. Контекст не требует в основном тексте однозначно выбирать единственного потомка, поэтому сохранена исходная широта.
- issue: Основание благословения народов
  choice: за то, что ты послушался Моего голоса
  alternative: потому что ты услышал Мой голос
  rationale: Сохранена явная связь обещания с послушанием Авраама, но без добавления конфессионального объяснения её отношения к вере или заслуге.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской традиции. Синтаксис разделён на короткие фразы ради ясности; заключительная кавычка сохранена как указание на окончание прямой речи.
