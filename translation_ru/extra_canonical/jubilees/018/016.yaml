  source_fidelity: 'Первая и заключительная части переданы точно: «в твоём потомстве» сохраняет собирательную широту በዘርእከ, «благословятся» приемлемо передаёт глагольную форму в традиционной формуле, а «за то, что ты послушался Моего голоса» верно выражает причинное основание и смысл послушания. «Я возвестил всем» допустимо передаёт «Я сделал известным всем». Однако ዘእቤለከ означает «что Я сказал тебе», а не специально «что Я повелел тебе»; последнее неоправданно сужает смысл и усиливает повелительный оттенок.'
