  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: ru
  text: 'И Господь сказал Аврааму: «Авраам, Авраам!» Тот ответил: «Вот я». И Он сказал: «Возьми твоего сына, твоего любимого, которого ты любишь, — Исаака, и пойди в нагорье[a], и принеси его в жертву[b] на одной из гор, которую Я укажу тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в высокую землю».'
    reason: Передаёт буквальную форму геэзского сочетания ምድር፡ ልዐልት; в основном тексте «нагорье» выбрано как естественное русское обозначение возвышенной местности.
  - marker: b
    text: 'Буквально: «вознеси его» или «сделай так, чтобы он взошёл».'
    reason: Сохраняет образное значение каузативного глагола ወአዕርጎ, переданного в тексте согласно жертвенному контексту.
lexical_decisions:
- source_word: ምድር፡ ልዐልት
  choice: нагорную землю
  rationale: Существительное с согласованным определением означает «высокая земля». «Нагорная земля» естественно передаёт возвышенный характер местности, не превращая сочетание в конструкцию «земля высоты».
- source_word: ወአዕርጎ
  choice: и принеси его в жертву
  rationale: Каузативный глагол буквально выражает действие «возвести/вознести», а в данном жертвенном контексте означает принесение жертвы. Буквальный образ сохранён в сноске.
- source_word: ነየ፡ አነ
  choice: Вот я
  rationale: Обычная формула ответа на призыв, буквально указывающая на присутствие и готовность говорящего.
- source_word: ፍቁረከ፡ ዘታፈቅር
  choice: твоего любимого, которого ты любишь
  rationale: Сохранены намеренный повтор и эмоциональная напряжённость исходного текста.
theological_decisions:
- issue: Характер повеления об Исааке
  choice: принеси его в жертву
  alternative: вознеси его
  rationale: Контекстуальное значение глагола передано ясно, но его буквальный образ и потенциальная лексическая широта отмечены в сноске без конфессионального истолкования.
- issue: Определение Исаака как любимого сына
  choice: твоего сына, твоего любимого, которого ты любишь, — Исаака
  alternative: сына твоего, возлюбленного твоего, которого ты любишь, Исаака
  rationale: Сохранены все элементы и повтор исходника, при этом выбран современный литературный русский синтаксис.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повторы исходника сохранены там, где они создают смысловое и эмоциональное напряжение; архаизмы и добавленное наречие «там», отсутствующее в геэзском тексте, не использованы.
