  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: ru
  text: 'И он сказал: «Бог сам усмотрит себе овцу для всесожжения, сын мой». И он приблизился к месту на горе Господней.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к месту горы Господней»; исходная конструкция кратко связывает место с горой.'
    reason: Сохраняет формальную сжатость и возможную более тесную определительную связь в оригинале, тогда как основной текст остаётся естественным по-русски.
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ፡
  choice: сам усмотрит себе
  rationale: Глагол буквально означает «увидит», но в данном контексте выражает предусмотрение или обеспечение; «усмотрит» сохраняет библейскую перекличку и естественно сочетается с возвратным местоимением «себе».
- source_word: በግዐ
  choice: овцу
  rationale: Существительное обозначает овцу или животное из мелкого скота; здесь выбрано конкретное «овцу», в соответствии с формой исходного текста и жертвенным контекстом.
- source_word: ለጽንሓሕ
  choice: для всесожжения
  rationale: Передаёт назначение жертвенного животного; «всесожжение» — точный и общепонятный библейский термин.
- source_word: ወልድየ
  choice: сын мой
  rationale: Прямое обращение сохранено без перестройки.
- source_word: ወቀረበ፡ ኀበ፡ መካን
  choice: И он приблизился к месту
  rationale: Сохраняет субъект в единственном числе и пространственное значение глагола и предлога.
- source_word: ዘደብረ፡ እግዚአብሔር
  choice: у горы Господней
  rationale: Конструкция допускает понимание связи места с горой Господа; русский оборот сохраняет эту связь без искусственного уточнения.
theological_decisions:
- issue: Значение слов Бога о жертвенном животном
  choice: «Бог сам усмотрит себе овцу»
  alternative: «Бог сам увидит для себя овцу» / «Бог сам обеспечит овцу»
  rationale: «Усмотрит» сохраняет двусмысленность между видением и обеспечением, не сводя фразу только к практическому приготовлению жертвы.
- issue: Связь «места» и «горы Господней»
  choice: «к месту у горы Господней» с примечанием
  alternative: «к месту горы Господней» / «к месту, к горе Господней»
  rationale: Исходная конструкция синтаксически сжата; основной текст должен быть понятен по-русски, а примечание сохраняет возможную более тесную связь места с горой.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены повтор союза «И», прямое обращение и традиционные термины «усмотрит» и «всесожжение»; архаичная грамматика не используется.
