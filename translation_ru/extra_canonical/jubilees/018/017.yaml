  text: And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.
translation:
  language: ru
  text: И Авраам пошёл к своим слугам; они поднялись и вместе отправились в Вирсавию. И поселился Авраам у Колодца клятвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቁ
  choice: своим слугам
  rationale: В данном эпизоде слово обозначает сопровождавших Авраама молодых слуг; местоимение «своим» естественно передаёт принадлежность по контексту.
- source_word: በርስሕ
  choice: в Вирсавию
  rationale: Географическое название передано в принятой русской библейской форме; последующее «Колодец клятвы» сохраняет смысловую прозрачность эфиопского обозначения.
- source_word: ኀቡረ
  choice: вместе
  rationale: Непосредственно передаёт совместное возвращение Авраама и слуг.
- source_word: ኀደረ
  choice: поселился
  rationale: В контексте места жительства глагол естественно означает пребывание или обоснование на месте, а не только однократную ночёвку.
- source_word: ዐዘቅት፡ መሐላ
  choice: Колодца клятвы
  rationale: Калькирует составное наименование «колодец клятвы», сохраняя связь с названием Вирсавии.
