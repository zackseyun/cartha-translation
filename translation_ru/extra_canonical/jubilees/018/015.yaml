base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/015.yaml
  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: ru
  text: 'И Он сказал: «Клянусь Самим Собой, — говорит Господь, — за то, что ты сделал это и не удержал от Меня своего сына, своего первенца, которого ты любишь, Я непременно благословлю тебя и непременно умножу твоё потомство, как звёзды небесные и как песок на морском берегу; и твоё потомство овладеет городами своих врагов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በርእስየ፡ መሐልኩ
  choice: Клянусь Самим Собой
  rationale: Передаёт буквальное «Собой поклялся Я» естественной и торжественной русской формулой.
- source_word: ወኢምሕከ
  choice: и не пожалел для Меня
  rationale: Глагол в контексте означает не удержать, не пощадить; русское выражение сохраняет смысл добровольной готовности отдать сына.
- source_word: ወልደከ፡ በዘረከ፡ እምኔየ፡ ዘአፍቀርከ
  choice: своего сына, своего первенца, которого ты любишь
  rationale: 'Учитывает засвидетельствованную корректировку OCR: በዘረከ понимается как искажённое በኵረከ, «твоего первенца»; относительное определение передано естественно по-русски.'
- source_word: ባርኮ፡ እባርከከ፡ ወአበዝኆ፡ አበዝኆ
  choice: Я непременно благословлю тебя и непременно умножу
  rationale: Эфиопские сочетания абсолютной формы с личным глаголом выражают усиление; повтор «непременно» передаёт эмфазу без неестественной кальки.
- source_word: ዘርአከ
  choice: твоё потомство
  rationale: Сохраняет собирательное значение «семя, потомство» и допускает как коллективное, так и родовое прочтение.
- source_word: ይወርሱ፡ ዘርእከ፡ አህጉረ፡ ፀሮሙ
  choice: твоё потомство овладеет городами своих врагов
  rationale: «Овладеет» естественно передаёт наследование или захват владения; አህጉር здесь передано как «города» согласно контексту и консультационному слою.
theological_decisions:
- issue: Усилительные инфинитивно-глагольные конструкции в обещании
  choice: передать как «непременно благословлю» и «непременно умножу»
  alternative: буквальное «благословляя, благословлю» и «умножая, умножу»
  rationale: Выбранная форма сохраняет категоричность божественного обещания и звучит современно и достойно.
- issue: Значение ዘርእ («семя»)
  choice: потомство
  alternative: семя
  rationale: «Потомство» ясно обычному читателю и сохраняет собирательный смысл, не вводя дополнительного христологического или исключительно индивидуального толкования.
- issue: Синтаксическая связь «любимый»
  choice: «которого ты любишь» относится к сыну-первенцу
  alternative: отдельное приложение «твоего возлюбленного»
  rationale: Такова наиболее естественная связь слов в контексте, без устранения содержания каждого исходного элемента.
translation_notes:
  register: Современный литературный русский с библейски торжественным, но понятным синтаксисом. Сохранены формула клятвы, эмфатические обещания, образные сравнения и собирательное «потомство».
