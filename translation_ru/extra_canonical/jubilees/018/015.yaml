revisions:
- from: 'И Он сказал: «Клянусь Самим Собой, — говорит Господь, — за то, что ты сделал это и не пожалел для Меня своего сына, своего первенца, которого ты любишь, Я непременно благословлю тебя и непременно умножу твоё потомство, как звёзды небесные и как песок на морском берегу; и твоё потомство овладеет городами своих врагов».'
  to: 'И Он сказал: «Клянусь Самим Собой, — говорит Господь, — за то, что ты сделал это и не удержал от Меня своего сына, своего первенца, которого ты любишь, Я непременно благословлю тебя и непременно умножу твоё потомство, как звёзды небесные и как песок на морском берегу; и твоё потомство овладеет городами своих врагов».'
  rationale: 'Исправлено только управление при глаголе: «не удержал от Меня» точнее воспроизводит исходное «не удержал ... от Меня». Остальная редакция достоверно передаёт текст, включая «первенца» — восстановленное чтение, отмеченное в английской аудиторской истории.'
