  yaml_path: translation/extra_canonical/jubilees/018/012.yaml
  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ru
  text: И князь Мастема был посрамлён. Авраам поднял глаза, посмотрел — и вот, один баран застрял рогами в чаще. Авраам пошёл, взял барана и принёс его во всесожжение вместо своего сына.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: князь Мастема
  rationale: መኰንን обозначает правителя или князя; сочетание передано как титул и имя без внесения дополнительного богословского толкования.
- source_word: ትገፍረ
  choice: был посрамлён
  rationale: Форма выражает состояние унижения или посрамления; пассивная передача сохраняет структуру и смысл источника.
- source_word: አሐዱ፡ በሐኵ
  choice: один баран
  rationale: Сохраняется явно присутствующее в источнике числительное አሐዱ «один».
- source_word: አኀዝ፡ በዕፀው፡ በአቅርንቲሁ
  choice: запутался рогами в чаще
  rationale: Естественная русская передача образа барана, удерживаемого растительностью за рога; не уточняется вид зарослей сверх данных текста.
- source_word: አዕረገ፡ ለጽንሓሕ
  choice: принёс его во всесожжение
  rationale: Жертвенная формула передана принятым, понятным и стилистически достойным русским библейским термином.
- source_word: ህየንተ፡ ወልዱ
  choice: вместо своего сына
  rationale: Точно сохраняется заместительный характер жертвы и принадлежность сына Аврааму.
theological_decisions:
- issue: Статус обозначения Мастемы
  choice: «князь Мастема»
  alternative: «князь Мастемы» или «правитель Мастема»
  rationale: Синтаксис и контекст поддерживают понимание «Мастема» как имени, а መኰንን — как титула; перевод не развивает это в отдельную демонологическую доктрину.
- issue: Заместительный характер жертвы
  choice: «вместо своего сына»
  alternative: «за своего сына»
  rationale: «Вместо» точнее передаёт ህየንተ и сохраняет непосредственную замену сына бараном, не добавляя иных оттенков значения.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены последовательность повествования, титул Мастемы и числительное «один»; архаизмы и избыточно конфессиональная терминология избегаются.
