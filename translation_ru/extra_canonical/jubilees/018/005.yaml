  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: ru
  text: И он взял дрова для жертвы и возложил их на Исаака, своего сына; а сам взял в руку огонь и нож. И пошли они оба вместе к тому месту.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: дрова для жертвы
  rationale: Передаёт сочетание «дерево/дрова жертвы» естественным современным русским языком, не уточняя вид жертвы сверх источника.
- source_word: አስከሞ
  choice: возложил их
  rationale: Глагол означает «положил, нагрузил»; «возложил» сохраняет действие помещения дров на Исаака и соответствует достоинству повествовательного регистра.
- source_word: መጥባሕት
  choice: нож
  rationale: В контексте жертвоприношения обозначает режущий нож; нейтральное «нож» не добавляет отсутствующей в тексте детализации.
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: они оба вместе
  rationale: 'Сохраняет оба компонента выражения: двойственность участников и совместность их пути.'
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: к тому месту
  rationale: В данном контексте выражает движение к обозначенному месту; такая формулировка естественнее буквального «до того места» и соответствует повествовательному смыслу.
