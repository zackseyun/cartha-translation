lexical_decisions:
- source_word: ፍልስጥኤም
  choice: филистимляне / среди филистимлян
  rationale: Этноним передан принятой русской библейской формой; начальная синтаксическая связь по контексту выражена естественным русским оборотом «среди филистимлян».
- source_word: መእተ፡ ስዊተ
  choice: урожай во сто крат
  rationale: Сохраняет числовое значение «стократно» и ясно обозначает результат жатвы в современном русском языке.
- source_word: ዐብየ፡ ... ፈድፋደ
  choice: весьма возвеличился
  rationale: Передаёт усиленную степень величия или процветания Исаака, не сводя выражение исключительно к богатству.
- source_word: ቀንኡ፡ ላዕሌሁ
  choice: стали завидовать ему
  rationale: Естественно передаёт направленную на Исаака зависть; «стали» отражает развитие реакции на его возвышение.
- source_word: ዐዘቅተ
  choice: колодцы
  rationale: Соответствует предметному контексту рассказа о колодцах Авраама и Исаака.
- source_word: ደፈንዎ
  choice: засыпали
  rationale: Передаёт намеренное закрытие колодцев землёй более конкретно и естественно, чем общее «закрыли».
