  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: ru
  text: «И через твоё потомство благословятся все народы земли, потому что твой отец послушался Моего голоса и соблюдал порученное Мною, Мои заповеди, Мои законы, Мои установления и Мой завет.[a] Теперь и ты послушайся Моего голоса и живи в этой земле». И он прожил в Гераре три седмины лет. А Авимелех издал о нём распоряжение…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В речи Бога следует плотный ряд близких юридических понятий: «порученное Мною, Мои заповеди, Мои законы, Мои установления и Мой завет». В переводе все элементы перечня сохранены раздельно.'
    reason: segmentation_note
lexical_decisions:
- source_word: በዘርእከ
  choice: через твоё потомство
  rationale: Предлог በ допускает инструментальное значение «через», а ዘርእ обозначает семя/потомство; в современном русском «потомство» естественнее и сохраняет собирательность.
- source_word: ሰምዐ … ቃለ
  choice: послушался … голоса
  rationale: Глагол буквально означает «услышал», но в сочетании с «голосом» здесь выражает повиновение; русский «послушался» передаёт этот смысл без утраты образа голоса.
- source_word: ዑቃቤየ
  choice: порученное Мною
  rationale: Существительное связано с хранением и соблюдением доверенного; оборот позволяет отличить его от последующих заповедей, законов и установлений.
- source_word: ትእዛዛትየ / ሕገጊየ / ሥርዐትየ / ኪዳንየ
  choice: Мои заповеди / Мои законы / Мои установления / Мой завет
  rationale: Сохранены все четыре отдельные позиции плотного юридико-заветного перечня, без сведения их к одному общему слову.
- source_word: ኀድር
  choice: живи
  rationale: Глагол означает пребывать или обитать; «живи в этой земле» естественно звучит по-русски и передаёт длительное пребывание.
- source_word: ሠለስተ ሱባዔ ዓመት
  choice: три седмины лет
  rationale: Буквально «три недели/седмины лет», то есть три семилетних периода; сохранена характерная древняя мера времени.
theological_decisions:
- issue: Благословение народов через потомство
  choice: «через твоё потомство благословятся все народы земли»
  alternative: «твоим потомством будут благословлять себя все народы земли»
  rationale: Контекст и параллельная формула поддерживают пассивное понимание благословения; при этом «через» не уточняет сверх текста способ исполнения обещания.
- issue: Связь благословения с послушанием отца
  choice: «потому что твой отец послушался»
  alternative: 'Разделить фразы: «…благословятся. Твой отец послушался…»'
  rationale: ህየንተ в данном контексте выражает причинную связь; перевод сохраняет напряжение между обещанием и названным основанием, не переистолковывая его богословски.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Обращение Бога передано с прописными местоимениями по русской религиозно-издательской традиции. «Седмины лет» сохранены как понятный из контекста древний счёт времени. Финальное многоточие показывает, что последняя фраза продолжается за пределами данного стиха.
