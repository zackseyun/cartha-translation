  to: «И через твоё потомство благословятся все народы земли, потому что твой отец послушался Моего голоса и соблюдал порученное Мною, Мои заповеди, Мои законы, Мои установления и Мой завет.[a] Теперь и ты послушайся Моего голоса и живи в этой земле». И он прожил в Гераре три седмины лет. А Авимелех издал о нём распоряжение…
