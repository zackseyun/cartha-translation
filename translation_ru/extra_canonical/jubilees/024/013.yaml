lexical_decisions:
- source_word: ሞተ፡ ለይሙት
  choice: пусть непременно умрёт
  rationale: 'Эфиопская конструкция сочетает абсолютный инфинитив с личной глагольной формой и выражает усиление: смерть как несомненный приговор.'
- source_word: በፍልስጥኤም
  choice: в Филистии
  rationale: Форма обозначает географическое название; перевод местностью точнее, чем этнонимом «среди филистимлян».
- source_word: አህቀ
  choice: преуспевал
  rationale: По контексту глагол указывает на благополучие или процветание Исаака; «преуспевал» естественно связывается с последующим упоминанием имущества.
- source_word: ጥሪት፡ ብዙኅ
  choice: большое имущество
  rationale: Сочетание обозначает многочисленное или значительное достояние; «большое имущество» сохраняет общий характер исходного выражения, не сужая его до скота или богатства.
