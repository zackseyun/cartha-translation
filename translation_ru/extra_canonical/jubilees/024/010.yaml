  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: ru
  text: И твоему потомству Я дам всю эту землю и утвержу Мою клятву, которой Я поклялся Аврааму, твоему отцу. Я умножу твоё потомство, как звёзды небесные, и дам твоему потомству всю эту землю. И они благословят себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они будут благословлены». В данном фрагменте исходного текста субъект не уточнён.'
    reason: Сохранена грамматическая неоднозначность заключительной формы; не добавлена фраза о народах земли, которой нет в предоставленном источнике.
lexical_decisions:
- source_word: ዘርእከ
  choice: твоё потомство / твоему потомству
  rationale: Слово обозначает «семя, потомство»; в современном русском «потомство» естественно передаёт собирательный смысл и сохраняет связь с обетованием.
- source_word: አቀውም
  choice: утвержу
  rationale: Глагол имеет значение «поставить, утвердить, упрочить»; в сочетании с клятвой «утвержу» звучит естественно и точно.
- source_word: መሐላየ
  choice: Мою клятву
  rationale: Передаёт притяжательную форму существительного «клятва» без добавления отсутствующих в источнике понятий завета или обещания.
- source_word: ይትባረኩ
  choice: они благословятся
  rationale: Возвратно-страдательная форма допускает понимание «благословятся / будут благословлены»; основной текст сохраняет традиционно возможный возвратный оттенок, а примечание отмечает альтернативу.
theological_decisions:
- issue: Значение заключительной возвратно-страдательной формы
  choice: И они благословятся
  alternative: И они будут благословлены
  rationale: Форма допускает как возвратное, так и страдательное прочтение. Не уточняется субъект словами «все народы земли», поскольку они отсутствуют в предоставленном фрагменте геэзского текста.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, использованы последовательно; синтаксис остаётся ясным для современного читателя.
