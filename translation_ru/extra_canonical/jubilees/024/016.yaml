    В тот же день Исаак проклял филистимлян и сказал: «Да будут прокляты филистимляне гневом и яростью среди всех народов! Пусть ГОСПОДЬ предаст их на поругание и проклятие, на гнев и ярость, в руки грешных народов, в руки киттимов. А тех, кто спасётся от меча врага и от киттимов, пусть праведный народ по суду[a] искоренит из-под небес, потому что из поколения в поколение на земле они будут врагами и ненавистниками моих детей. Не останется у них ни уцелевшего, ни спасшегося в день гневного суда. Ибо всё потомство филистимлян обречено на погибель, искоренение и исчезновение с земли, и не останется у этих кафторимов на земле ни остатка, ни потомства. Даже если кто из них взойдёт на небо, оттуда он будет низвергнут; если погрузится в землю, оттуда будет извлечён; если скроется среди народов, оттуда будет искоренён; если сойдёт в шеол, и там приговор ему станет ещё суровее, и не будет ему там покоя. Если же он попадёт в плен, то ищущие его жизни убьют его на дороге, и не останется от него на
    всей земле ни имени, ни потомства, ибо он предан вечному проклятию».


    Так написано и определено о нём на небесных скрижалях, чтобы в день суда поступить с ним так и искоренить его с земли.


