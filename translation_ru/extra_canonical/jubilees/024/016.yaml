revisions:
- from: 'после смерти Авраама и засыпали их землёй. И Авимелех сказал Исааку: «Уйди от нас, потому что ты стал гораздо могущественнее нас». И Исаак ушёл оттуда в первый год седьмой седмины и расположился в долине Герара. Там вновь выкопали водяные колодцы, которые прежде выкопали слуги его отца Авраама и которые филистимляне засыпали после смерти Авраама, его отца; и назвали их теми именами, которые дал им его отец Авраам. Слуги Исаака выкопали колодец в русле потока и нашли живую воду. Пастухи Герара стали спорить с пастухами Исаака, говоря: «Это наша вода». Исаак назвал тот колодец Спор, потому что они спорили с нами. Потом выкопали другой колодец, и из-за него тоже поссорились; Исаак назвал его Вражда. Он ушёл оттуда и выкопал ещё один колодец, из-за которого уже не спорили, и назвал его Простор. Исаак сказал: «Теперь ГОСПОДЬ дал нам простор, и мы будем плодиться на этой земле».


    Оттуда он поднялся к Колодцу Клятвы в первый год первой седмины сорок четвёртого юбилея. В ту ночь, на рассвете первого дня первого месяца, ему явился ГОСПОДЬ и сказал: «Я — Бог Авраама, твоего отца. Не бойся, потому что Я с тобой. Я благословлю тебя и весьма умножу твоё потомство, как песок земной, ради Авраама, Моего слуги». И он построил там жертвенник, на том месте, где прежде построил жертвенник его отец Авраам, призвал имя ГОСПОДА и принёс жертву Богу Авраама, своего отца. Они выкопали колодец и нашли живую воду. Затем слуги Исаака выкопали другой колодец, но воды не нашли. Они пришли и сказали Исааку, что не нашли воды. Исаак сказал: «Сегодня я поклялся филистимлянам — и вот что с нами случилось». Он назвал то место Колодцем Клятвы, потому что там поклялся Авимелеху, его спутнику Ахуззату и Фиколу, начальнику его войска. В тот день Исаак понял, что поклялся под принуждением, чтобы заключить с ними мир.


    В тот же день Исаак проклял филистимлян и сказал: «Да будут прокляты филистимляне гневом и яростью среди всех народов! Пусть ГОСПОДЬ предаст их на поругание и проклятие, на гнев и ярость, в руки грешных народов, в руки киттимов. А тех, кто спасётся от меча врага и от киттимов, пусть праведный народ по суду[a] искоренит из-под небес, потому что из поколения в поколение на земле они будут врагами и ненавистниками моих детей. Не останется у них ни уцелевшего, ни спасшегося в день гневного суда. Ибо всё потомство филистимлян обречено на погибель, искоренение и исчезновение с земли, и не останется у этих кафторимов на земле ни остатка, ни потомства. Даже если кто из них взойдёт на небо, оттуда он будет низвергнут; если погрузится в землю, оттуда будет извлечён; если скроется среди народов, оттуда будет искоренён; если сойдёт в шеол, и там приговор ему станет ещё суровее, и не будет ему там покоя. Если же он попадёт в плен, то ищущие его жизни убьют его на дороге, и не останется от него на
    всей земле ни имени, ни потомства, ибо он предан вечному проклятию».


    Так написано и определено о нём на небесных скрижалях, чтобы в день суда поступить с ним так и искоренить его с земли.


