base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: ru
  text: «Поклянись мне сегодня». И тот поклялся ему. Тогда Иаков дал своему брату Исаву хлеб и похлёбку, и тот ел, пока не насытился. Так Исав продал своё право первородства. Поэтому его назвали Эдомом — из-за пшеничной похлёбки[a], которую Иаков дал ему в обмен на право первородства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Быт 25:34 говорится о чечевичной похлёбке; здесь в эфиопском тексте прямо названа пшеница.
    reason: Предупреждает привычную гармонизацию с рассказом Бытия и поясняет источник неожиданного чтения.
lexical_decisions:
- source_word: መሐል፡ ሊተ፡ ዮም
  choice: «Поклянись мне сегодня»
  rationale: Передаёт повеление, дополнение «мне» и временное наречие без добавления отсутствующего содержания.
- source_word: ተብሰለ
  choice: похлёбка
  rationale: Естественное русское обозначение приготовленного густого блюда; соответствует контексту еды вместе с хлебом.
- source_word: መጠ
  choice: продал
  rationale: Глагол в данном контексте обозначает продажу/передачу за встречное предоставление; это точнее, чем гармонизирующее «пренебрёг».
- source_word: ቀዳሙ፡ ትውልዶ / ቅድመተ፡ ልደቱ
  choice: право первородства
  rationale: Обе формулы относятся к статусу и правам первенца; устойчивое русское выражение сохраняет смысл повторения.
- source_word: ስርናይ
  choice: пшеничной
  rationale: Геэзское слово прямо означает пшеницу; перевод не гармонизирован с чечевичной похлёбкой в Быт 25.
- source_word: ተሰምየ፡ ስሙ፡ … ኤዶም
  choice: его назвали Эдомом
  rationale: Естественная русская передача пассивной формулы именования без указания неназванного действующего лица.
theological_decisions:
- issue: Характер поступка Исава с правом первородства
  choice: продал своё право первородства
  alternative: пренебрёг своим правом первородства
  rationale: Источник описывает именно сделку; вариант «пренебрёг» привносил бы оценочную формулировку из параллельной традиции.
- issue: Состав похлёбки
  choice: пшеничная похлёбка
  alternative: красная чечевичная похлёбка
  rationale: Несмотря на знакомую формулировку Быт 25, в данном геэзском тексте названа пшеница и отсутствует слово «красная».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; «тот» снимает двусмысленность местоимений, а причинная связь с именем Эдом сохранена без добавления отсутствующей в источнике этимологии «красный».
