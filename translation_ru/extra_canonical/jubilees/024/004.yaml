translation:
  language: ru
  text: '«И я дам тебе хлеб и ещё эту чечевичную похлёбку». И Исав сказал в своём сердце: «Я вот-вот умру;»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: хлеб
  rationale: Прямое и естественное соответствие существительному со значением «хлеб, пища»; в данном контексте имеется в виду хлеб.
- source_word: ብርስን
  choice: чечевичная похлёбка
  rationale: Передаёт чечевичное варево естественным современным русским выражением и согласуется с контекстом рассказа.
- source_word: በልቡ
  choice: в своём сердце
  rationale: Сохраняет буквальный библейский образ внутренней речи, не сводя его просто к «подумал».
- source_word: እመውት
  choice: я умираю
  rationale: Формально передаёт форму настоящего времени в геэз; «вот» в русском помогает выразить непосредственность и близость смерти, не усиливая её до однозначного будущего.
