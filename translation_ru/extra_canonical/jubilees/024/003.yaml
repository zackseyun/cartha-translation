base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: ru
  text: 'Иаков сварил чечевичную похлёбку. Исав пришёл с поля голодный и сказал своему брату Иакову: «Дай мне этой пшеничной похлёбки[a]». Иаков ответил ему: «Продай мне своё право первородства».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «похлёбки из пшеницы (или зерна)». Хотя выше похлёбка названа чечевичной, здесь в геэзском тексте стоит «пшеничная»; это необычное различие сохранено в переводе.'
    reason: Сохраняет текстовую особенность источника, не выдавая её без дополнительных данных за разночтение рукописей.
lexical_decisions:
- source_word: ተብሰለ፡ ብርስን
  choice: сварил чечевичную похлёбку
  rationale: Сочетание обозначает приготовленную чечевичную похлёбку; естественный русский глагол «сварил» передаёт способ приготовления без лишнего усложнения.
- source_word: ርኁብ
  choice: голодный
  rationale: Прямое и естественное соответствие состоянию Исава после возвращения с поля.
- source_word: ተብሰል፡ ዘሥርናይ
  choice: пшеничной похлёбки
  rationale: В просьбе Исава источник прямо называет похлёбку из пшеницы или зерна. Чтение сохранено, хотя оно расходится с упомянутой ранее чечевичной похлёбкой.
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: своё право первородства
  rationale: Фраза относится к статусу и праву первенца, а не к наречному «сначала». Устойчивое русское выражение ясно и без толковательного расширения передаёт смысл.
theological_decisions:
- issue: Значение выражения ዘቅድመ፡ ልደት
  choice: право первородства
  alternative: продай мне сначала
  rationale: Генитивная характеристика «первого рождения» определяет продаваемое право или старшинство; временное прочтение «сначала» устранило бы явную связь с перворождением.
translation_notes:
  register: Современный литературный русский язык с простой повествовательной структурой и умеренно библейским достоинством. Повторы источника слегка упорядочены ради естественного русского синтаксиса, но различие между чечевичной и пшеничной похлёбкой сохранено и пояснено в сноске.
