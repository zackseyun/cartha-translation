  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዚአሁ
  choice: что принадлежало ему / из принадлежащего ему
  rationale: Притяжательная конструкция буквально означает «то, что его»; по-русски естественно передаётся через «принадлежать» с сохранением широкого значения.
- source_word: ዘይሰክፎ
  choice: который коснётся его
  rationale: Форма передаёт действие прикосновения или соприкосновения; нейтральное «коснётся» сохраняет буквальный смысл и условно-обобщающий характер выражения.
- source_word: ኵሉ፡ ሰብእ
  choice: всякий человек
  rationale: Сохранена универсальная формулировка источника; «всякий» соответствует контексту предостережения и звучит литературно.
