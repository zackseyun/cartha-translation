  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: ru
  text: После смерти Авраама Господь благословил его сына Исаака. Исаак вышел из Хеврона, пошёл и поселился у Колодца Видения[a] в первый год третьей недели этого юбилея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название места буквально передано с геэза как «Колодец Видения». Вероятно, речь идёт о месте, известном из книги Бытие, однако более полная традиционная форма названия здесь не добавляется. Слово «неделя» в хронологии Книги Юбилеев обозначает семилетний период.
    reason: cross_reference_and_chronology
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычное и достойное русское соответствие геэзскому обозначению Бога в данном контексте.
- source_word: ዐዘቅተ፡ ራእይ
  choice: Колодец Видения
  rationale: Название передано буквально, без внесения более полного традиционного наименования из параллельных библейских текстов.
- source_word: ሱባዔ
  choice: неделя
  rationale: Сохранён хронологический термин источника; в системе Книги Юбилеев он обозначает семилетний период, что пояснено в примечании.
- source_word: ዘዝ
  choice: этого юбилея
  rationale: Передаёт указание на текущий юбилейный цикл без добавления отсутствующих в стихе слов.
theological_decisions:
- issue: Обозначение Бога
  choice: Господь
  alternative: Бог
  rationale: Геэзское እግዚአብሔር традиционно и контекстуально соответствует титулу «Господь»; выбор не вносит конфессионально специфического толкования.
- issue: Подлежащее после благословения Исаака
  choice: Имя «Исаак» повторено
  alternative: местоимение «он»
  rationale: Повтор имени естественно устраняет возможную для русского читателя неясность, не изменяя референта исходной последовательности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Начальная формула передана без архаичного «И было». Координация действий сохранена, но имя Исаака повторено ради ясности. Финальное добавление «семь лет» не внесено, поскольку в тексте стиха его нет.
