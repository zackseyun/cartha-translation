lexical_decisions:
- source_word: አልህምተ
  choice: крупный скот
  rationale: Передаёт категорию домашнего скота и естественно сочетается с последующим упоминанием овец как мелкого скота.
- source_word: አባግዐ
  choice: мелкий скот
  rationale: Буквально обозначает овец; в данном перечне современное русское выражение «мелкий скот» сохраняет хозяйственную категорию и избегает стилистической тяжеловесности.
- source_word: አግማለ
  choice: верблюдов
  rationale: Прямое соответствие геэзскому обозначению верблюдов.
- source_word: አእዱገ
  choice: ослов
  rationale: Прямое соответствие геэзскому обозначению ослов.
- source_word: ጥሪት ብዙኅ
  choice: много другого имущества
  rationale: ጥሪት обозначает имущество или богатство; «другого» естественно показывает, что перечисленные животные также входят в состав достояния, не усиливая смысл до абстрактного богатства.
- source_word: ዘርአ በምድረ
  choice: сеял в той земле
  rationale: Сохраняет конкретный земледельческий смысл глагола и связность с уже известной из контекста землёй.
