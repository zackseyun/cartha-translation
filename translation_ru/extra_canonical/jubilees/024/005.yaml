- source_word: ለምንት፡ ሊተ
  choice: Что мне
  rationale: Передаёт краткий риторический вопрос «зачем/что [это] мне?» естественным современным русским оборотом, не добавляя отсутствующего в тексте пояснения.
- source_word: ዝቀዳሙ፡ ትውልድ
  choice: это первородство
  rationale: Сочетание обозначает статус или право первенца; «первородство» сохраняет связь с библейским рассказом и звучит естественнее буквального «первое рождение».
- source_word: ወሀብኩከ
  choice: Я отдаю его тебе
  rationale: Форма от глагола «давать» передана как совершаемая уступка права; местоимение «его» соотнесено с «первородством».
