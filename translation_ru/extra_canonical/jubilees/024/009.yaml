  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: ru
  text: 'И явился ему Господь и сказал ему: «Не спускайся в Египет. Живи в земле, которую Я укажу тебе, и будь пришельцем в той земле. Я буду с тобой и благословлю тебя, ибо тебе…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный текст источника обрывается после слов «ибо тебе»; продолжение здесь не реконструируется.
    reason: Предупреждает читателя о фактической незавершённости исходного фрагмента и объясняет многоточие.
lexical_decisions:
- source_word: ኢትረድ፡ ግብጸ
  choice: Не спускайся в Египет
  rationale: Передаёт пространственный глагол «спускаться» и направление в Египет без сглаживания до общего «не ходи».
- source_word: ንበር፡ ውስተ፡ ምድር
  choice: Живи в земле
  rationale: Повелительная форма передана естественным современным русским глаголом длительного пребывания.
- source_word: ወፍልስ፡ ውስተ፡ ይእቲ፡ ምድር
  choice: и будь пришельцем в той земле
  rationale: 'Сохранено отличие от предыдущего «живи»: здесь речь о проживании в качестве пришельца, без права коренного владения.'
- source_word: ወእሄሉ፡ ምስሌከ
  choice: Я буду с тобой
  rationale: Прямой и естественный эквивалент формулы божественного присутствия.
- source_word: ወእባርከከ
  choice: и благословлю тебя
  rationale: Сохраняет традиционный богословский термин и форму обещания.
theological_decisions:
- issue: Статус Исаака в обещанной земле
  choice: «будь пришельцем»
  alternative: «оставайся / поселись»
  rationale: Выбранная формулировка сохраняет напряжение между пребыванием в земле и отсутствием полного владения ею; это смысловое различие присутствует в исходном тексте.
- issue: Незавершённость предоставленного текста стиха
  choice: Сохранить обрыв после «ибо тебе…» и отметить его сноской
  alternative: Дополнить стих по параллельным изданиям или библейскому контексту
  rationale: Источник в задании заканчивается словами «ибо тебе»; восполнение отсутствующего материала было бы неподтверждённой реконструкцией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имя እግዚአብሔር передано как «Господь». Различие между обычным проживанием и пребыванием пришельца намеренно сохранено.
