  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: ru
  text: Во второй год этой седмины Исаак собирался спуститься в Египет и пошёл в Герар, к Авимелеху, царю филистимлян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይረድ
  choice: собирался спуститься
  rationale: Имперфектная форма передаёт намерение или намечавшееся действие, а не завершённый спуск; далее Исаак направляется в Герар, не достигнув Египта.
- source_word: ዘዝ፡ ሱባዔ
  choice: этой седмины
  rationale: Сохраняет указательное значение «этой», не подменяя его контекстуальным «шестой»; «седмина» ясно обозначает семилетний период в хронологии книги.
- source_word: ወሖረ
  choice: но пошёл
  rationale: Форма обозначает завершённое движение. Союз «но» естественно выражает подразумеваемый источником контраст между намерением спуститься в Египет и фактическим направлением в Герар.
- source_word: ንጉሠ፡ ፍልስጥኤም
  choice: царю филистимлян
  rationale: Передаёт титул и название народа в принятой русской библейской форме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Седмина» выбрана как компактный и понятный в контексте юбилейной хронологии термин; синтаксис сделан естественным, при этом различие между намерением и совершившимся действием сохранено.
