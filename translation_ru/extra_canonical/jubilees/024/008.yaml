  source_fidelity: Форма ይረድ верно передана как намерение/намечавшееся действие («собирался спуститься»), а ዘዝ፡ ሱባዔ — как «этой седмины», без необоснованной подмены на «шестой». Однако исходный соединительный союз ወ не выражает явного противительного значения; «но» добавляет интерпретацию, которой в тексте нет.
