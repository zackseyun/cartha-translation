  text: And Jacob grew up, and kept the command of his father, but Esau rejected it. And there was famine upon the land, and he came
translation:
  language: ru
  text: Иаков вырос и соблюдал повеление своего отца, а Исав отверг его. На земле настал голод, и он пришёл…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'አህቀ (в переданном тексте: አህቀ፡)'
  choice: вырос
  rationale: Глагол обозначает взросление, достижение зрелости, а не возвышение по положению.
- source_word: ኀለወ
  choice: соблюдал
  rationale: Передаёт значение «хранить, соблюдать» применительно к повелению.
- source_word: ዐበየ
  choice: отверг
  rationale: В восстановленном чтении относится к Исаву и выражает отказ принять или исполнить отцовское повеление.
- source_word: ዐባር
  choice: голод
  rationale: По контексту и традиционному чтению речь о голоде на земле.
- source_word: መጽአ
  choice: пришёл
  rationale: Прямое соответствие глаголу «приходить»; место назначения находится в следующем стихе.
theological_decisions:
- issue: Кто соблюдает и кто отвергает повеление отца
  choice: Иаков соблюдает повеление, Исав отвергает его
  alternative: Иаков отходит от повеления своего отца
  rationale: Предоставленная строка повреждена распознаванием текста; засвидетельствованное чтение издания Чарльза содержит упоминание отца и Исава и противопоставляет послушание Иакова отказу Исава. Это также соответствует значению ኀለወ «соблюдать».
- issue: Незавершённость последней фразы
  choice: сохранить «и он пришёл…»
  alternative: добавить место назначения из следующего стиха
  rationale: Стиховая разбивка обрывает предложение после глагола; дополнение объекта или места назначения внесло бы материал следующего стиха.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Имена субъектов названы явно там, где восстановленное исходное чтение противопоставляет Иакова и Исава. Многоточие обозначает синтаксическое продолжение в следующем стихе, а не неуверенность перевода.
