lexical_decisions:
- source_word: ብርሃናት
  choice: светила
  rationale: Множественное число обозначает небесные источники света; «светила» естественно передаёт смысл и сохраняет библейский регистр.
- source_word: ምጽናዓት
  choice: небесная твердь
  rationale: «Твердь» сохраняет традиционный космологический термин, а определение «небесная» делает выражение понятнее современному читателю.
- source_word: በቅድመ፡ አዕይንቲሃ
  choice: в присутствии
  rationale: Буквальное «перед её глазами» здесь идиоматически означает, что действие совершилось в присутствии Ревекки.
theological_decisions:
- issue: Неуказанный субъект глагола «позвал»
  choice: сохранено местоимение «он» без уточнения личности
