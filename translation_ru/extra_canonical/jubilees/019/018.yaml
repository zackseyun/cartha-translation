lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Передаёт причинную связь с предшествующим контекстом.
- source_word: አእምር
  choice: я знаю
  rationale: Прямое соответствие форме первого лица единственного числа.
- source_word: ያኀሪ
  choice: изберёт
  rationale: Сохраняет значение намеренного избрания и будущую направленность высказывания.
- source_word: ኪያሁ ... ሎቱ
  choice: его Себе
  rationale: Передаёт объект избрания и значение принадлежности Господу.
- source_word: ለሕዝብ
  choice: в народ
  rationale: Буквально сохраняет предикативное назначение избранного как народа, не устраняя необычное сочетание единственного лица и собирательного существительного.
theological_decisions:
- issue: Единственное лицо «его» названо народом
  choice: Сохранить формулировку «изберёт его Себе в народ»
  alternative: «изберёт его, чтобы от него произошёл Его народ»
  rationale: Источник выражает отождествление или предназначение с помощью «его» и «народ»; развёрнутый вариант истолковал бы подразумеваемую связь и снял бы подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным синтаксисом. Заглавная буква в «Себе» обозначает отнесённость местоимения к Господу; искусственная архаизация исключена.
