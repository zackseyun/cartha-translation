translation:
  language: ru
  text: И Адам. И они будут утверждать небо, укреплять землю и обновлять всё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они будут для утверждения неба, для укрепления земли и для обновления всего».'
    reason: Сохраняет более буквальную возможность понять повторяющиеся формы с ለ- как конструкции назначения.
lexical_decisions:
- source_word: ለሳርረ፡ ሰማይ
  choice: утверждать небо
  rationale: Инфинитив от корня со значением основания или утверждения передан глагольно и без добавления идеи простого «поддерживания».
- source_word: ለአጽንዖ፡ ምድር
  choice: укреплять землю
  rationale: Сохраняет значение укрепления и параллельную инфинитивную конструкцию.
- source_word: ለኀድሶ፡ ኵሉ
  choice: обновлять всё
  rationale: Передаёт значение обновления; ኵሉ сохранено в намеренно широком значении «всё».
theological_decisions:
- issue: Значение ряда конструкций с ለ- после ይኩኑ
  choice: И они будут утверждать… укреплять… обновлять…
  alternative: И они будут для утверждения… для укрепления… для обновления…
  rationale: Глагольная передача естественна для современного русского языка и отражает целевую силу инфинитивных форм, не вводя дополнительного субъекта или богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной глагольной триадой. Начальное «и Адам» оставлено как фрагмент синтаксической связи с предшествующим контекстом; неподтверждённые слова не добавлены.
