lexical_decisions:
- source_word: ዘይቀውም
  choice: который возвысится
  rationale: Форма от глагола «стоять, встать, утвердиться» в данном контексте передаёт выделение и возвышение среди народов; перевод сохраняет относительную конструкцию и не уточняет субъект, находящийся за пределами фрагмента.
- source_word: እምኵሎሙ፡ አሕዛብ
  choice: среди всех народов
  rationale: Предлог እም буквально может означать «из, от»; по-русски «среди» естественно передаёт выделение одного из совокупности народов.
- source_word: እለ፡ ዲበ፡ ገጸ፡ ምድር
  choice: живущих на лице земли
  rationale: 'Буквально: «которые на лице земли». Добавление «живущих» делает эллиптический оборот естественным по-русски, не изменяя его референции.'
- source_word: ወናሁ
  choice: А теперь
  rationale: ወ передаёт связь «и/а», а ናሁ — указательно-переходное «вот, теперь»; в обращении естественно «А теперь».
- source_word: ይስሐቅ፡ ወልድየ
  choice: Исаак, сын мой
  rationale: Прямое обращение требует запятых в современном русском языке; ወልድየ буквально означает «сын мой».
