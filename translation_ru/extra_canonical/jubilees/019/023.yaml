  text: If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which he blessed me
translation:
  language: ru
  text: Если человек сможет сосчитать песок земной, то и его потомство будет исчислено. И все благословения, которыми он благословил меня[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с уточнением подразумеваемого субъекта: «которыми Господь благословил меня». В исходном тексте субъект здесь не назван.'
    reason: Сохраняет неназванного в геэзском тексте субъекта в основном переводе и фиксирует вариант из английского аудиторского следа без внесения имени Господа в основной текст.
lexical_decisions:
- source_word: ይክል፡ ሰብእ፡ ኈልቆ፡ ኖላ፡ ምድር
  choice: Если человек сможет сосчитать песок земли
  rationale: Передаёт условную конструкцию и образ неисчислимого песка естественным современным русским языком.
- source_word: ይትኌለቍ፡ ዘርኡሂ
  choice: то и потомство его будет сочтено
  rationale: ዘር означает «семя, потомство»; в данном контексте русское «потомство» ясно передаёт смысл, а страдательная форма сохраняется.
- source_word: ወኵሉን፡ በረከት
  choice: И все благословения
  rationale: Сохраняется соединительная конструкция и множественный смысл выражения.
- source_word: እለ፡ ባረከኒ
  choice: которыми он благословил меня
  rationale: Форма ባረከኒ буквально обозначает «он благословил меня»; субъект по имени в данном отрывке не выражен.
theological_decisions:
- issue: Неявный субъект глагола «благословил»
  choice: он благословил меня
  alternative: Господь благословил меня
  rationale: В геэзском тексте присутствует местоименный субъект «он», но имя Господа отсутствует. Перевод не должен без необходимости устранять эту референциальную неоднозначность.
- issue: Незавершённость фразы в предоставленном отрывке
  choice: поставить многоточие после «меня»
  alternative: завершить предложение точкой
  rationale: Отрывок оканчивается относительной конструкцией, которая синтаксически продолжается далее; многоточие не создаёт ложного впечатления завершённости мысли.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Потомство» выбрано вместо буквального «семя» ради естественности и ясности; синтаксическая незавершённость стиха обозначена многоточием.
