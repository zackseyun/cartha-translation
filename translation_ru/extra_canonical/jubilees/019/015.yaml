  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: ru
  text: Все его дела были жестоки. Авраам любил Иакова, а Исаак любил Исава. Авраам видел дела Исава и знал, что в Иакове будут наречены его имя и потомство. Он позвал Ревекку и дал ей указание относительно Иакова, потому что знал, что она любит Иакова гораздо больше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድሩክ
  choice: свирепы
  rationale: Передаёт суровый отрицательный смысл характеристики дел Исава; соответствует засвидетельствованному пониманию «fierce», не добавляя более узкой идеи жестокости.
- source_word: ይጼዋዕ
  choice: будут наречены
  rationale: Сохраняет буквальный образ «называться/быть названным» и намеренную необычность высказывания об имени и потомстве.
- source_word: ዘርእ
  choice: потомство
  rationale: В данном родословном контексте естественнее современного буквального «семя», при этом сохраняет коллективный смысл рода и потомков.
- source_word: አዘዘ
  choice: дал ей наставление
  rationale: Естественно передаёт распоряжение или повеление, обращённое к Ревекке, не уточняя неуказанное содержание.
- source_word: ፈድፋደ
  choice: гораздо больше
  rationale: Передаёт усиленное сравнительное значение любви Ревекки к Иакову.
theological_decisions:
- issue: Смысл того, что имя и потомство Авраама будут «наречены» в Иакове
  choice: Сохранена формулировка «в Иакове будут наречены его имя и потомство».
  alternative: «Через Иакова продолжатся его имя и род».
  rationale: Источник сохраняет образ призвания/наречения; более разъяснительный вариант преждевременно разрешил бы генеалогическую и богословскую многозначность.
- issue: Предпочтение Иакова Авраамом и Ревеккой
  choice: Передано прямо, без оправдания или моральной оценки.
  alternative: Добавить пояснение об избрании Иакова.
  rationale: Стих сообщает семейные предпочтения и знание Авраама, но не формулирует здесь отдельного учения об избрании.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного текста. Синтаксис близок к источнику, но без неестественной кальки. Имена даны в традиционной русской библейской форме.
