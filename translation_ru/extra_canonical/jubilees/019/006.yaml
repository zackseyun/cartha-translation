  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
translation:
  language: ru
  text: 'то есть Хеврон — за четыреста серебряных монет. Они уговаривали его, говоря: «Мы отдадим его тебе даром». Но он не принял его из их рук даром, ибо заплатил за это место полную цену серебром.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  choice: Хеврон
  rationale: Устоявшаяся русская библейская форма топонима.
- source_word: በአርባዕቱ ምእት ብሩር
  choice: за четыреста сиклей серебра
  rationale: В контексте покупки пещеры и поля у Хеврона число обозначает денежный вес серебра; «сиклей» делает подразумеваемую единицу понятной современному читателю.
- source_word: በከ
  choice: даром
  rationale: 'Слово повторено в предложении дважды: в предложении отдать место без платы и в сообщении об отказе принять его без платы; повтор сохранён.'
- source_word: ብሩረ ፍጹመ
  choice: полную цену серебром
  rationale: Передаёт полную, неуменьшенную плату, внесённую серебром, без неестественного буквального оборота.
theological_decisions:
- issue: Причинно-противительная связь перед заключительной частью
  choice: «а отдал»
  alternative: «потому что отдал»
  rationale: Эфиопское እስመ обычно вводит причину, однако по-русски здесь естественнее явно противопоставить бесплатному получению полную оплату; смысловая причинная связь сохраняется контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но повтор «даром» сохранён как значимая особенность оригинала.
