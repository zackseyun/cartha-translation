  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
translation:
  language: ru
  text: И Авраам пошёл оплакать её и похоронить. Мы испытали его, чтобы узнать, терпелив ли его дух,[3] и он не говорил резко.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '3'
    text: По-видимому, смерть Сарры стала десятым испытанием Авраама. Синтаксис источника сжат, поэтому подразумеваемая связь выражена в переводе явно.
    reason: segmentation_note
  - marker: a
    text: 'Вариант по иному, вероятно испорченному чтению: «оплакать её и плакать о ней, и вспоминать её, сдерживая свой дух».'
    reason: textual_variant
lexical_decisions:
- source_word: ይብክያ
  choice: оплакать её
  rationale: Глагол означает плакать о ком-либо, оплакивать; русское «оплакать» естественно передаёт действие в контексте смерти Сарры.
- source_word: ይቅበራ
  choice: похоронить
  rationale: Передаёт прямое значение «погребсти, похоронить» и сохраняет последовательность скорби и погребения.
- source_word: ወመከርኖ (в исправленном чтении)
  choice: Мы испытали его
  rationale: Контекст и текстологически исправленное чтение указывают на испытание Авраама; данная формулировка сохраняет первое лицо множественного числа речи ангела.
- source_word: ይትነገሥ፡ መንፈሱ
  choice: терпелив ли его дух
  rationale: Передаёт проверку внутренней выдержки Авраама, не сводя «дух» к настроению или характеру.
- source_word: последняя, обрезанная в предоставленном фрагменте клауза
  choice: в словах своих он не выразил негодования
  rationale: Формулировка опирается на засвидетельствованное продолжение стиха и передаёт отсутствие гневного или возмущённого высказывания естественным современным русским языком.
theological_decisions:
- issue: Смерть Сарры как испытание Авраама
  choice: Сохранить прямое утверждение «Мы испытали его» и пояснить связь в сноске [3].
  alternative: Представить скорбь и погребение без упоминания испытания либо считать испытанием только реакцию Авраама.
  rationale: Исправленное чтение и контекст Книги Юбилеев связывают смерть Сарры с испытанием терпения Авраама, но сжатый синтаксис не вполне явно определяет объём испытания.
- issue: Характер реакции Авраама
  choice: «не выразил негодования»
  alternative: «не стал говорить резко» или «не проявил нетерпения».
  rationale: Выбранный вариант сохраняет нравственное напряжение текста и относится именно к произнесённым словам, не утверждая, что Авраам вовсе не испытывал скорби или внутренней борьбы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного религиозного текста. «Оплакать» и «похоронить» ясны широкому читателю; «дух» сохранён ради смысловой и богословской открытости оригинала. Синтаксис разделён на два предложения для естественности без устранения связи между погребением и испытанием.
