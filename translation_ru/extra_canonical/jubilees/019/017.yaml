translation:
  language: ru
  text: 'чем Исава. И он сказал ей: «Дочь моя, храни моего сына Иакова, потому что он займёт моё место на земле и станет благословением среди сынов человеческих и для всего потомства Сима».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀቢ
  choice: храни
  rationale: Императив передаёт призыв беречь, охранять и заботиться; «храни» естественно и сохраняет широту значения.
- source_word: ህየንቴየ
  choice: займёт моё место
  rationale: Буквально выражает пребывание «вместо меня»; по-русски о преемнике естественнее сказать «займёт моё место».
- source_word: ለበረከት
  choice: станет благословением
  rationale: Целевая конструкция «для благословения» в данном предикативном ряду естественно передаётся как будущая роль Иакова.
- source_word: ውሉደ፡ ሰብእ
  choice: сынов человеческих
  rationale: Сохранён традиционный и достаточно прозрачный антропологический оборот оригинала.
- source_word: ለኵሉ፡ ዘርኡ ሴም
  choice: для всего потомства Сима
  rationale: Точно передаёт «для всего семени Сима» современным русским словом «потомство»; слова «слава» в источнике нет.
theological_decisions:
- issue: Роль Иакова после Авраама
  choice: он займёт моё место на земле
  alternative: он будет вместо меня на земле
  rationale: Выбор не уточняет сверх текста характер преемства и сохраняет его богословскую широту, но звучит естественно по-русски.
- issue: Отношение Иакова к благословению
  choice: станет благословением
  alternative: будет для благословения
  rationale: Сохранена возможность понимать Иакова как носителя и средство благословения без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Начальный фрагмент «чем Исава» намеренно сохранён как продолжение сравнительной конструкции предыдущего стиха. Синтаксис слегка разгружен, но параллелизм исходного высказывания сохранён.
