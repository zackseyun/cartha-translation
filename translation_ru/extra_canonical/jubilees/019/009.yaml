revisions:
- from: В этом Авраам оказался верным и терпеливым духом. Он не сказал ни слова об обещании земли, которую ГОСПОДЬ, по Его словам, даст ему и его потомству после него, но попросил там место, чтобы похоронить свою умершую. Ибо он оказался верным и был записан как друг ГОСПОДА на небесных скрижалях.
  to: В этом Авраам оказался верным и был терпелив духом. Он не сказал ни слова об обещании земли, которую, как сказал ГОСПОДЬ, Он даст ему и его потомству после него, но попросил там место, чтобы похоронить умершего. Ибо он оказался верным и был записан как друг ГОСПОДА на небесных скрижалях.
