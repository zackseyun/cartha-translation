base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: ru
  text: В этом Авраам оказался верным и был терпелив духом. Он не сказал ни слова об обещании земли, которую, как сказал ГОСПОДЬ, Он даст ему и его потомству после него, но попросил там место, чтобы похоронить умершего. Ибо он оказался верным и был записан как друг ГОСПОДА на небесных скрижалях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦቱ
  choice: В этом
  rationale: 'Сохраняет отсылку к предшествующему испытанию: «в этом / в этом деле».'
- source_word: ተረክበ፡ ምእመነ
  choice: оказался верным
  rationale: Передаёт буквально-предикативное «был найден верным» естественным современным русским оборотом без утраты смысла испытанной верности.
- source_word: ዕጉሠ፡ መንፈስ
  choice: терпеливым духом
  rationale: Сохраняет связь качества терпения с духом, не сводя выражение лишь к спокойствию.
- source_word: ንባብ፡ ዘበምድር
  choice: об обещании земли
  rationale: В контексте последующего «даст ему» речь идёт о возвещённом Богом обещании относительно земли; формулировка остаётся естественной по-русски.
- source_word: ዘርኡ
  choice: его потомству
  rationale: Коллективное «семя» передано общеупотребительным русским словом «потомство».
- source_word: ቤድኖ
  choice: свою умершую
  rationale: Существительное обозначает умершего/тело умершего; женский род обусловлен ближайшим контекстом смерти Сарры.
- source_word: ዐርከ
  choice: друг
  rationale: Прямое и традиционно понятное соответствие обозначению близкого, угодного Богу человека.
- source_word: ተጽሕፈ
  choice: был записан
  rationale: 'Страдательная форма относится к Аврааму: именно он был внесён в небесную запись как друг.'
theological_decisions:
- issue: Божественное имя እግዚአብሔር
  choice: ГОСПОДЬ
  alternative: Господь
  rationale: Капителью обозначено божественное имя в соответствии с принятой библейской русской практикой; богословское содержание не расширяется.
- issue: Связь просьбы о погребении с верностью Авраама
  choice: Сохранено повторное «Ибо он оказался верным»
  alternative: Связать причинность только с просьбой или только с небесной записью
  rationale: Исходная последовательность допускает некоторую неоднозначность связи причинного предложения; перевод не устраняет её пояснительной перестройкой.
- issue: Небесные скрижали
  choice: на небесных скрижалях
  alternative: в небесных книгах
  rationale: Сохранён характерный для Книги Юбилеев образ, без замены его более привычной канонической терминологией.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис умеренно формальный, но понятный обычному читателю; архаизмы вроде «семя» и искусственное «был найден верным» избегаются.
