  text: And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a fierce man, and a man of the field,
translation:
  language: ru
  text: И в шестую седмицу, во второй её год, Ревекка родила Исааку двух сыновей — Иакова и Исава. Иаков был гладок и праведен, а Исав был человеком свирепым, человеком поля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ (subāʿe)
  choice: седмица
  rationale: Передаёт особую для книги Юбилеев хронологическую единицу — период из семи лет — и сохраняет её отличие от обычной недели.
- source_word: ደቂቀ (daqiq)
  choice: сыновей
  rationale: В данном контексте общее «дети» конкретизируется последующим перечислением Иакова и Исава; «сыновей» естественно и точно по смыслу.
- source_word: ልሙጽ (ləmuṣ)
  choice: гладок
  rationale: Сохранено прямое значение слова без добавления отсутствующего в тексте указания на волосы или тело.
- source_word: ሬትዕ (rētuʿ)
  choice: праведен
  rationale: Передаёт нравственный оттенок значения «правый, прямой, праведный», не сводя характеристику лишь к внешности или манерам.
- source_word: ድሩክ (dəruk)
  choice: свирепым
  rationale: Слово обозначает суровость, неукротимость или свирепость; перевод «волосатым» был бы гармонизацией с Быт 25 и не соответствует данному слову геэзского текста.
- source_word: ሐቃላዊ (ḥaqlāwi)
  choice: человеком поля
  rationale: Сохранён буквальный и библейски значимый образ человека, связанного с полем, без пояснительного сужения до «охотника».
theological_decisions:
- issue: Нравственная характеристика Иакова
  choice: «праведен»
  alternative: «прям» или «безупречен»
  rationale: Форма ሬትዕ допускает значения прямоты и праведности. «Праведен» естественно передаёт положительную нравственную оценку, не добавляя конфессионального толкования.
- issue: Описание Исава
  choice: «свирепым»
  alternative: «суровым» или «неукротимым»
  rationale: Выбор следует лексике геэзского источника и не подменяет её знакомым по каноническому рассказу описанием Исава как волосатого.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Седмица» сохранена как термин летоисчисления книги Юбилеев; синтаксический повтор «человеком свирепым, человеком поля» отражает параллелизм источника.
