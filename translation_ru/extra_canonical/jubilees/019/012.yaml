  yaml_path: translation/extra_canonical/jubilees/019/012.yaml
  text: 'for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.'
translation:
  language: ru
  text: 'потому что Агарь умерла раньше Сарры. И она родила ему шестерых сыновей: Зимрана, Иокшана, Медана, Мадиана, Ишбака и Шуаха — за две седмины лет.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за четырнадцать лет.
    reason: Поясняет древнее исчисление времени, сохраняя его буквальную форму в основном тексте.
lexical_decisions:
- source_word: እምቅድመ፡ ሳራ
  choice: раньше Сарры
  rationale: Передаёт временное значение «до Сарры», то есть до смерти Сарры, естественным современным русским выражением.
- source_word: ውሉደ፡ ስድስተ
  choice: шестерых сыновей
  rationale: Буквально возможно «шесть детей», однако перечислены мужские имена, а контекст родословия указывает на сыновей.
- source_word: በክልኤ፡ ሱባዔ፡ ዓመት
  choice: за две седмины лет
  rationale: Сохраняет характерную для книги меру времени — две семилетние недели — без молчаливой замены на вычисленное число лет.
theological_decisions:
- issue: Не названная в стихе женщина, обозначенная местоимением «она»
  choice: сохранить «она» без добавления имени
  alternative: уточнить имя женщины по предшествующему контексту
  rationale: В исходном тексте стоит местоименная форма; добавление имени устранило бы существующую связность с предыдущим стихом и внесло бы отсутствующее здесь пояснение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Редкое слово «седмина» сохранено как специальное обозначение семилетнего периода и разъяснено в сноске. Имена приведены в традиционной русской библейской форме.
