  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: ru
  text: и был покрыт волосами. Иаков жил в шатрах. Юноши выросли, и Иаков научился письму, а Исав не учился, потому что был человеком поля и охотником; он обучился военному делу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸጕር
  choice: был покрыт волосами
  rationale: Передаёт значение «волосатый, покрытый волосами» естественным русским выражением; начальное «и» сохранено, поскольку стих начинается как продолжение предыдущего.
- source_word: ምጽላላት
  choice: шатрах
  rationale: Множественное число обозначает шатры или палатки как место обитания Иакова.
- source_word: ወሬዛ
  choice: юноши
  rationale: Сохраняет обозначение обоих подросших молодых людей без преждевременного уточнения «братья».
- source_word: መጽሐፈ
  choice: письму
  rationale: В конструкции с глаголом обучения слово связано с письменностью и книжным знанием; «научился письму» звучит ясно и не сужает смысл до одной конкретной книги.
- source_word: ብእሲ፡ ሐቃላዊ
  choice: человеком поля
  rationale: Формально сохраняет традиционный образ человека, чья жизнь и занятия связаны с открытым полем.
- source_word: ነዓዊ
  choice: охотником
  rationale: Прямое и естественное обозначение охотника.
- source_word: ፀብአ
  choice: военному делу
  rationale: Передаёт обучение войне или ведению войны в литературном русском регистре, не подразумевая участие в одной конкретной войне.
