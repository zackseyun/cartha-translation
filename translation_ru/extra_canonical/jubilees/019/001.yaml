  yaml_path: translation/extra_canonical/jubilees/019/001.yaml
  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: ru
  text: В первый год первой седмины пятьдесят восьмого юбилея Авраам возвратился и поселился напротив Хеврона, то есть Кириаф-Арба, ещё на одну седмину лет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ещё на семь лет.
    reason: Поясняет специализированное календарное выражение «седмина лет», сохраняя его в основном тексте.
lexical_decisions:
- source_word: ፶ወ፰
  choice: пятьдесят восьмого
  rationale: Эфиопское числительное буквально означает «пятьдесят и восемь», то есть 58; вариант «сорок восьмого» не соответствует предоставленному исходному тексту.
- source_word: አንጻረ
  choice: напротив
  rationale: Передаёт конкретное пространственное значение «напротив, лицом к», не ослабляя его до общего «у» или «возле».
- source_word: ሱባዔ፡ ዓመት
  choice: седмину лет
  rationale: Сохраняет характерный для Книги Юбилеев календарный термин «неделя/седмина лет», а не заменяет его только пояснительным «семь лет».
- source_word: ቀርያታርቦቅ
  choice: Кириаф-Арбы
  rationale: Использована узнаваемая русская библейская форма топонима; падеж согласован с пояснительной конструкцией «то есть».
theological_decisions:
- issue: Календарная терминология юбилеев и седмин
  choice: Сохранены формулы «первая седмина», «пятьдесят восьмой юбилей» и «седмина лет».
  alternative: 'Передать их как обычные числовые периоды: «первые семь лет» и «ещё семь лет».'
  rationale: Формальная календарная структура несёт смысловую нагрузку в Книге Юбилеев; её динамическое упрощение скрыло бы связь между седминами и юбилеями.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Специализированное слово «седмина» сохранено ради календарной системы книги и сразу пояснено в сноске; синтаксис сделан естественным и ясным.
