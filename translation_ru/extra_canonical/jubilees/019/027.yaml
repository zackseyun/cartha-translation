  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: ru
  text: 'И он поцеловал его, благословил и сказал: «Иаков, любимый сын мой, которого любит душа моя! Да благословит тебя Бог, пребывающий над твердью, и да даст тебе все благословения, которыми Он благословил Адама, Еноха, Ноя и Сима[a]. И всё, что Он изрёк мне, и всё, что обещал дать мне, да пребудет на тебе и на твоём потомстве вовеки — доколе небо над землёй. Да не нападут духи Мастемы на тебя и на твоё потомство, чтобы отвратить тебя от следования за Господом, твоим Богом, отныне и вовеки. И да будет Господь Бог тебе Отцом, а ты — Его первородным сыном и [Его] народом во все дни[b]. Иди, сын мой, с миром». И оба они вместе ушли от Авраама. Ревекка любила Иакова всем сердцем и всей душой, гораздо больше, чем Исава, а Исаак любил Исава гораздо больше, чем Иакова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином членении фразы: «...Адама, Еноха и Ноя; и всё, что...»; имя Сима тогда относится к началу следующей части текста.'
    reason: Английский audit trail отмечает альтернативную пунктуацию/сегментацию после имени Ноя. Основной вариант сохраняет чтение с Симом в перечне, но альтернатива должна быть доступна читателю.
  - marker: b
    text: 'Геэзская фраза после слов «первородным сыном» предельно кратка и синтаксически не вполне ясна. Буквально она содержит «и народу/народом ... во все дни»; «[Его]» — восполнение для связности. Возможное понимание: «а ты — Его первородным сыном среди народа во все дни».'
    reason: Сохраняет и маркирует неоднозначность выражения ወለሕዝብ፡ ኵሎ፡ መዋዕለ, не навязывая одну богословскую или синтаксическую интерпретацию.
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት
  choice: Бог, пребывающий над твердью
  rationale: Сохраняет конкретный космологический образ «Бог из/над твердью», не подменяя его более общим титулом «Бог Всевышний»; причастный оборот естественнее по-русски, чем буквальное «Бог из-за твердей».
- source_word: ዘርእከ
  choice: твоё потомство
  rationale: В контексте благословения родовая «семя» передаётся естественным современным русским словом «потомство».
- source_word: መናፍስተ፡ መስቴማ
  choice: духи Мастемы
  rationale: Имя Мастемы сохраняется как имя собственного; родительный падеж естественно выражает связь духов с Мастемой.
- source_word: እምድኅረ፡ እግዚአብሔር
  choice: от следования за ГОСПОДОМ
  rationale: Передаёт пространственный образ ухода «из-за/вслед Господа», то есть прекращения следования за Ним, не сводя выражение к общему «отвратить от Господа».
- source_word: በከመ፡ መዋዕለ፡ ሰማይ፡ ዲበ፡ ምድር
  choice: доколе небо над землёй
  rationale: Идиоматично передаёт длительность «по дням неба над землёй» и сохраняет образ неба над землёй.
theological_decisions:
- issue: Божественное именование в первом благословении
  choice: Бог, пребывающий над твердью
  alternative: Бог Всевышний
  rationale: Исходный геэзский текст содержит пространственно-космологическое выражение, а не обычный титул «Всевышний».
- issue: Отношение Господа Бога к Иакову
  choice: да будет Господь Бог тебе Отцом
  alternative: да будет ГОСПОДЬ тебе Отцом
  rationale: Сохранены оба элемента исходного እግዚአብሔር፡ አምላከ — «Господь Бог»; опускать «Бог» оснований нет.
- issue: Метафора верности Богу
  choice: от следования за ГОСПОДОМ
  alternative: от ГОСПОДА
  rationale: Формулировка удерживает заложенный в тексте образ следования за Господом и не ослабляет его до абстрактного удаления.
- issue: Первенство Иакова
  choice: ты — Его первородным сыном
  alternative: ты — первым сыном
  rationale: «Первородный» сохраняет семейно-заветную образность и не уточняет сверх текста, в каком именно смысле понимается первенство.
translation_notes:
  register: Современный литературный русский с достоинством благословения и без архаизации сверх необходимого. Прямая речь оформлена плавными синтаксическими периодами; «ГОСПОДЬ» используется для передачи божественного имени/традиционного господнего титула в соответствующей позиции. Формула «всем сердцем и всей душой» сохранена как естественная библейская идиома.
