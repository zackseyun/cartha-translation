  terminology: Имена Иаков, Ревекка, Исаак, Исав, Сим и Мастема переданы последовательно. «Потомство», «первородный сын» и «следование за Господом» точно передают ключевые выражения. «Господь Бог» сохраняет оба компонента божественного именования; в предыдущем упоминании принято обычное русское «Господь» без искусственной графической дифференциации, которой геэзский текст сам по себе не задаёт.
