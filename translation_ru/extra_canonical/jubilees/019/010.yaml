  yaml_path: translation/extra_canonical/jubilees/019/010.yaml
  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: ru
  text: А в четвёртый год этого периода[a] он взял для Исаака, своего сына, жену. Её звали Ревекка; она была дочерью Вафуила, сына Нахора, брата Авраама, сестрой Лавана и дочерью Вафуила; Вафуил же был сыном Милки, жены Нахора, брата Авраама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в четвёртый год его»; местоимение отсылает к упомянутому ранее периоду.'
    reason: Русский основной текст требует явного существительного, тогда как геэзский сохраняет местоименную отсылку.
lexical_decisions:
- source_word: በዓመት፡ ራብዕ፡ ሎቱ
  choice: в четвёртый год этого периода
  rationale: Буквально конструкция означает «в четвёртый год его». Указательное уточнение «этого периода» естественно по-русски передаёт анафорическую связь с предшествующим хронологическим отрезком, не вводя нового содержания.
- source_word: ነሥአ፡ ለይስሐቅ፡ ወልዱ፡ ብእሲተ
  choice: он взял жену своему сыну Исааку
  rationale: 'Сохранена каузативно-семейная ситуация: подразумеваемый Авраам выбрал и взял жену для Исаака; русская формулировка не превращает Исаака в грамматического деятеля.'
- source_word: ወስማ፡ ርብቃ
  choice: Её звали Ревекка
  rationale: Современный и естественный русский эквивалент буквального «и имя её — Ревекка»; использована устоявшаяся русская библейская форма имени.
- source_word: ወለተ፡ ባቱኤል
  choice: дочерью Вафуила
  rationale: Родство передано буквально; повторное упоминание Вафуила сохранено, поскольку оно присутствует в источнике и может отражать намеренную генеалогическую формулу либо текстовую избыточность.
- source_word: ወባቱኤል፡ ወልደ፡ ሜልካ
  choice: Вафуил же был сыном Милки
  rationale: Сохранено прямое утверждение геэзского текста без сглаживания до «внукой Милки» и без замены родословной на более привычную читателю формулировку.
theological_decisions:
- issue: Необычная и повторная генеалогическая формула
  choice: Сохранить повтор «дочерью Вафуила» и утверждение «Вафуил был сыном Милки»
  alternative: Сжать до «внучкой Милки» или устранить повтор как ошибку переписчика
  rationale: Источник явно повторяет имя Вафуила и затем называет его сыном Милки. Исправление по параллельным библейским родословиям молчаливо разрешило бы текстовое напряжение и отошло бы от данного оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён для ясности, но повторения и необычная родословная источника намеренно сохранены. Начальные слова предоставленного фрагмента «Господь на небесных скрижалях» относятся к предыдущему предложению при указанном делении главы и потому в стих 19:10 не включены.
