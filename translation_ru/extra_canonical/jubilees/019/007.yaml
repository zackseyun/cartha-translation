review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: ካዕበ отражено словом «снова», «двойная пещера» сохраняет буквальное обозначение места, а возраст Сарры передан с разложением на юбилеи и семилетние периоды. Однако «свою умершую» хотя и возможно как контекстуальное субстантивированное выражение, для современного литературного русского звучит неестественно.'
  naturalness: 'Следует заменить неуклюжее «свою умершую» на естественное «свою покойную» и сгладить формулу возраста: «Все дни жизни Сарры составили...». «Семилетия» ясно передаёт седмины лет без риска понимания как обычных недель.'
  terminology: «Юбилей» сохранён как специальная единица летосчисления. «Семилетия» является современным и точным соответствием седминам лет. Имя Сарры и нейтральное «двойная пещера» корректны.
  issues:
  - severity: medium
    issue: Неестественная субстантивация «свою умершую».
    rationale: Выражение формально передаёт «свою умершую», но в современном литературном русском воспринимается шероховато. «Свою покойную» естественно обозначает умершую женщину, не добавляя отсутствующее в исходнике слово «жену».
  - severity: low
    issue: Формула «Всех дней жизни Сарры было...» тяжеловесна.
    rationale: «Все дни жизни Сарры составили...» сохраняет счётную формулу исходника и звучит нормативнее в современном русском.
  - severity: low
    issue: «Седмины лет» менее прозрачно для современного читателя.
    rationale: «Семилетия» непосредственно обозначает четыре периода по семь лет и сохраняет календарно-хронологический смысл ሱባዔ.
