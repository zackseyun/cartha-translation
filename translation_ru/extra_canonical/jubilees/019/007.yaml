  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: ru
  text: 'И он снова поклонился им, а после этого похоронил свою покойную в двойной пещере. Все дни жизни Сарры составили сто двадцать семь лет: два юбилея и четыре семилетия.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካዕበ
  choice: снова
  rationale: Передаёт наречие со значением «опять, во второй раз» и сохраняет отмеченный в источнике повтор поклона.
- source_word: ቤድኖ
  choice: свою умершую
  rationale: Контекстуально речь идёт о Сарре; такая передача сохраняет субстантивированное значение «умершая» и естественна по-русски.
- source_word: ባዓት፡ ዘካዕበት
  choice: двойной пещере
  rationale: Буквально передаёт традиционное обозначение пещеры как двойной, не подменяя его именем собственным.
- source_word: ኢዮቤልዉ
  choice: юбилея
  rationale: Сохраняет принятую в книге единицу летосчисления — юбилей.
- source_word: ሱባዔ
  choice: седмины лет
  rationale: Обозначает семилетние периоды; добавление «лет» устраняет возможное понимание как обычных недель.
