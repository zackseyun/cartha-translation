  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: ru
  text: Он говорил с сынами Хета, чтобы они дали ему место, где он мог бы похоронить свою покойную. И Господь даровал ему благоволение в глазах всех, кто его видел. Он кротко обратился с просьбой к сынам Хета, и они дали ему участок у двойной пещеры, что напротив Мамре…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ኬጥ
  choice: сыны Хета
  rationale: Буквально «дети/сыны Хета»; традиционная библейская форма естественна в повествовании и сохраняет этноним исходного текста.
- source_word: መካነ
  choice: место
  rationale: Передаёт общее значение «место», не сужая его заранее до могильного участка.
- source_word: ቤድኖ
  choice: свою умершую
  rationale: Слово обозначает умершего или мёртвое тело; женский род обусловлен ближайшим повествовательным контекстом — смертью Сарры — и позволяет избежать неестественного русского «своего мертвеца».
- source_word: ሞገሰ
  choice: благоволение
  rationale: Соответствует значению милости, расположения или благосклонности и сохраняет библейский регистр.
- source_word: በየውሀት
  choice: кротко
  rationale: Передаёт образ действия со значением мягкости, смирения и учтивости без добавления более узкой идеи формальной вежливости.
- source_word: ምድረ፡ ባዓት፡ ዘካዕበት
  choice: землю с двойной пещерой
  rationale: Сохраняет оба элемента выражения — землю/участок и двойную пещеру — в естественном русском синтаксисе.
- source_word: ዘአንጻረ፡ መምብሬም
  choice: что напротив Мамре
  rationale: Прямо передаёт пространственное отношение и традиционную форму топонима.
theological_decisions:
- issue: Божественное имя እግዚአብሔር
  choice: Господь
  alternative: Господь Бог / Владыка
  rationale: «Господь» является обычным и нейтральным русским библейским соответствием; дополнительные титулы отсутствуют в данном контексте.
- issue: Божье действие по отношению к Аврааму
  choice: даровал ему благоволение в глазах всех
  alternative: сделал его угодным всем
  rationale: Выбранная формулировка сохраняет представление об активном Божьем даре и не переопределяет природу отношения окружающих.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис расчленён на три предложения ради ясности, при этом последовательность исходных клауз сохранена. Финальное многоточие показывает, что фраза продолжается в следующем стихе или сегменте источника.
