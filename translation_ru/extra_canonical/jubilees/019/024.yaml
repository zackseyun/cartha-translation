  yaml_path: translation/extra_canonical/jubilees/019/024.yaml
  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: ru
  text: Да будет Бог моим Богом и Богом моего потомства, Богом Иакова и его потомства вовеки.[a] И в его потомстве да благословится моё имя и имя моих отцов — Сима, Ноя, Еноха, Малелеила, Еноса и Сифа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и моё потомство да принадлежит Иакову и его потомству вовеки».'
    reason: Альтернативное членение и синтаксическое понимание первой части стиха, сохранённое из предыдущей традиции перевода.
lexical_decisions:
- source_word: እግዚአብሔር፡ ኪያየ፡ … ይኩን
  choice: Да будет Бог моим Богом…
  rationale: Передаёт እግዚአብሔር как подлежащее, ይኩን как пожелание и притяжательный смысл ኪያየ естественной русской конструкцией с повтором слова «Богом».
- source_word: ወዘርእየ፡ ለያዕቆብ፡ ወለዘርኡ
  choice: и Богом моего потомства, Богом Иакова и его потомства
  rationale: Сохраняет последовательность лиц и потомства в основном чтении, не отождествляя без пояснения всё потомство говорящего только с Иаковом.
- source_word: ኵሎ፡ መዋዕለ
  choice: вовеки
  rationale: Кратко и достойно передаёт значение «во все дни / навсегда».
- source_word: ወበዘርኡ፡ ይትባረክ፡ ስምየ
  choice: И в его потомстве да благословится моё имя
  rationale: Сохраняет пассивно-пожелательную форму и место благословения «в его потомстве», не уточняя за источником, кто именно благословляет.
- source_word: ወስመ፡ አበዊየ
  choice: и имя моих отцов
  rationale: Сохраняет единственное число слова «имя» перед перечнем предков, как в геэзском тексте.
- source_word: ሴም፡ ወኖኅ፡ ወሄኖክ፡ ወመላልኤል፡ ወኤኖስ፡ ወሴት
  choice: Сима, Ноя, Еноха, Малелеила, Еноса и Сифа
  rationale: Использованы укоренившиеся русские библейские формы имён в родительном падеже после слова «имя».
theological_decisions:
- issue: Кто является субъектом ይኩን в первой части стиха
  choice: 'Бог: «Да будет Бог моим Богом…»'
  alternative: «И моё потомство да принадлежит Иакову и его потомству…»
  rationale: Непосредственно стоящее እግዚአብሔር естественно понимать как подлежащее глагола ይኩን; альтернативное прежнее членение сохранено в примечании из-за засвидетельствованной неоднозначности конструкции.
- issue: Смысл благословения имени в потомстве Иакова
  choice: Сохранена формула «да благословится моё имя»
  alternative: «пусть моим именем благословляют» или «моё имя будет прославлено»
  rationale: Источник допускает богословски насыщенное понимание благословения имени; перевод не конкретизирует ни способ, ни действующее лицо.
translation_notes:
  register: Современный литературный русский с умеренно торжественными формами «да будет», «вовеки» и «да благословится». Повтор «Богом» введён ради ясного и естественного выражения цепочки притяжательных отношений; имена даны в привычной русской библейской форме.
