  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: ru
  text: Для благословения на земле отныне и во все поколения земли. Да укрепятся твои руки, и да возрадуется твоё сердце о твоём сыне Иакове, потому что его Я полюбил гораздо больше всех остальных.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት
  choice: Для благословения
  rationale: Сохраняет целевое значение предлога ለ и фрагментарную связь этой начальной фразы с предшествующим контекстом, не добавляя отсутствующего в источнике сказуемого.
- source_word: ይጽንዓ፡ እደዊኪ
  choice: Да укрепятся твои руки
  rationale: Передаёт пожелание/побуждение и буквальный образ укрепляющихся рук в естественной для торжественной русской речи форме.
- source_word: ትትፈሣሕ፡ ልብኪ
  choice: да возрадуется твоё сердце
  rationale: Сохраняет образ сердца как субъекта радости и параллелизм с предыдущим пожеланием.
- source_word: ፈድፋደ፡ እምኵሎሙ
  choice: гораздо больше всех остальных
  rationale: Передаёт усиленную сравнительную конструкцию и явно сохраняет множественную группу сравнения.
theological_decisions:
- issue: Субъект высказывания «Я полюбил»
  choice: Сохранено первое лицо с прописной буквы «Я»
  alternative: Строчная буква «я» или явное добавление имени говорящего
  rationale: Источник оставляет субъект выраженным только глагольной формой первого лица; перевод не вводит дополнительного имени, а прописная буква соответствует контексту божественной речи и принятому русскому библейскому оформлению.
- issue: Степень любви к Иакову относительно других
  choice: «гораздо больше всех остальных»
  alternative: «больше всех»
  rationale: Сохранено усиление сравнения, не объясняя, кто именно входит в группу «всех».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальная предложная фраза намеренно оставлена без добавленного сказуемого, поскольку стих начинается как продолжение предыдущего контекста.
