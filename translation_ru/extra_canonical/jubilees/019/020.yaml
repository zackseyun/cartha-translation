  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: ru
  text: Он[a] любит Исава больше, чем Иакова, но я вижу твою праведную любовь к Иакову. И впредь оказывай ему доброту; пусть твой взор будет обращён к нему с любовью, потому что отныне и во все поколения земли он будет благословением на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя субъекта здесь не названо; форма геэзского глагола означает «он любит». Из контекста речь идёт об Исааке.
    reason: Сохраняет грамматическую и контекстуальную особенность источника, не оставляя русское предложение без подлежащего.
lexical_decisions:
- source_word: ያፈቅሮ፡ ለዔሳው፡ እም፡ ያዕቆብ
  choice: Он любит Исава больше, чем Иакова
  rationale: Форма глагола сама указывает на мужской субъект в 3-м лице; сравнительное እም передано естественной русской конструкцией «больше, чем».
- source_word: መፍቀሪተ፡ ጽድቅ
  choice: праведную любовь
  rationale: Сохранено сочетание существительных «любовь/привязанность» и «праведность», не сводя его ни к одной лишь искренности, ни к конфессионально окрашенному понятию.
- source_word: ፃዲ፡ አሡንዮ፡ ላዕሌሁ
  choice: И впредь оказывай ему милость
  rationale: Передаёт продолжающееся благожелательное действие естественным современным русским языком.
- source_word: ወይኩና፡ አዕይንትኪ፡ ላዕሌሁ፡ ለፍቅር
  choice: пусть твои глаза смотрят на него с любовью
  rationale: Сохранён телесный образ направленных на Иакова глаз, а не заменён абстрактным «заботься о нём».
- source_word: እስመ፡ ውእቱ፡ ይከውን
  choice: потому что … он будет
  rationale: Сохранена причинная связь и будущая форма; продолжение фразы восстановлено по засвидетельствованному тексту стиха в консультационном слое, поскольку предоставленный геэзский фрагмент обрывается после «он будет».
theological_decisions:
- issue: Характер любви к Иакову
  choice: «праведная любовь»
  alternative: «искренняя любовь» или «заслуженная привязанность»
  rationale: Буквальный компонент «праведность» сохранён, чтобы не устранять возможный нравственно-богословский оттенок выражения.
- issue: Иаков как благословение
  choice: «он будет благословением на земле»
  alternative: «через него земля будет благословлена»
  rationale: Сохранено прямое предикативное утверждение о самом Иакове без добавления невыраженного посреднического смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы текст был понятен обычному читателю; образ глаз и нравственный оттенок «праведной любви» сохранены.
