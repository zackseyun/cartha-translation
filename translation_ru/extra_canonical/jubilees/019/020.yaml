revisions:
- from: Он[a] любит Исава больше, чем Иакова, но я вижу твою праведную любовь к Иакову. И впредь оказывай ему милость; пусть твои глаза смотрят на него с любовью, потому что отныне и во все поколения земли он будет благословением на земле.
  to: Он[a] любит Исава больше, чем Иакова, но я вижу твою праведную любовь к Иакову. И впредь оказывай ему доброту; пусть твой взор будет обращён к нему с любовью, потому что отныне и во все поколения земли он будет благословением на земле.
