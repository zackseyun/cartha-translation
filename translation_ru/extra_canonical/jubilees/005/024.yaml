  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: ru
  text: И Господь открыл семь небесных шлюзов и отверстия источников великой бездны — всего семь отверстий[a] — и небесные шлюзы сорок дней и сорок ночей изливали воду с неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь уст по числу». Русское «отверстий» передаёт этот образ понятнее в данном контексте.'
    reason: cultural_note
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: небесные шлюзы
  rationale: Сочетание обозначает отверстия, через которые с неба изливается вода; «шлюзы» естественно передаёт образ управляемых небесных затворов и сохраняет древнюю космологическую картину.
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: отверстия источников великой бездны
  rationale: Передаёт буквальный пространственный образ отверстий у источников бездны, не сводя выражение к общему описанию потопа.
- source_word: በሰብዑ፡ አፈወ፡ በኍልቍ
  choice: всего семь отверстий
  rationale: Буквальный идиоматический образ «семь уст по числу» передан понятным современным русским выражением; исходный образ отмечен в сноске.
- source_word: ይውርዱ፡ ማየ
  choice: низвергалась вода
  rationale: Глагол выражает движение воды вниз; «низвергалась» сохраняет направление и мощь потока, оставаясь уместным для повествовательного регистра.
theological_decisions:
- issue: Древняя космологическая образность небесных шлюзов и источников бездны
  choice: Сохранить конкретные пространственные образы текста
  alternative: Передать обобщённо как сильный дождь и подземные воды
  rationale: Источник описывает устройство мира образным и структурированным языком; нейтрализация устранила бы значимую особенность текста.
- issue: Соотнесение числа семь с отверстиями источников бездны
  choice: Разместить уточнение непосредственно после «отверстия источников великой бездны»
  alternative: Понять число как общий итог небесных шлюзов и отверстий бездны вместе
  rationale: Синтаксическая близость в эфиопском тексте и консультационный английский слой поддерживают отнесение уточнения к отверстиям бездны, хотя форма выражения остаётся несколько сжатой.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. «Небесные шлюзы», «великая бездна» и «низвергалась» сохраняют возвышенный космологический образ без архаической перегруженности.
