  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: ru
  text: И Он истребил всех с их мест, и не осталось из них ни одного, кого Он не осудил за всё их зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: И Он истребил
  rationale: Глагол передаёт полное уничтожение; «истребил» естественно и точно звучит в контексте суда.
- source_word: ኵሉ፡ እመካኖሙ
  choice: всех с их мест
  rationale: Сохраняет исходное сочетание всеобщности и удаления людей из занимаемых ими мест, не уточняя способ сверх текста.
- source_word: አኰነነ
  choice: осудил
  rationale: Соответствует судебному значению глагола и сохраняет образ Божьего суда.
- source_word: በኵሉ፡ እኪዮሙ
  choice: за всё их зло
  rationale: Передаёт совокупность их злых дел естественным современным русским выражением.
theological_decisions:
- issue: Субъект суда и уничтожения
  choice: Местоимение «Он» написано с прописной буквы как указание на Бога в ближайшем контексте.
  alternative: Писать «он» со строчной буквы.
  rationale: Прописная буква помогает русскому читателю распознать божественного субъекта, не добавляя нового богословского содержания.
- issue: Связь суда со злом
  choice: «осудил бы за всё их зло»
  alternative: «судил по всей их нечестивости»
  rationale: Предлог «за» естественно выражает основание приговора; формулировка не определяет отдельно, идёт ли речь о поступках, состоянии или их совокупности.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксический параллелизм оригинала сохранён, но громоздкая буквальная конструкция сделана естественной для русского языка.
