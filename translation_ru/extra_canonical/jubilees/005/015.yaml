  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: ru
  text: 'Всех Он будет судить: великого — сообразно его величию, малого — сообразно его малости, и каждого — сообразно его пути.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ
  choice: всех
  rationale: В контексте суда обобщающее «всех» естественно передаёт эфиопское обозначение совокупности людей.
- source_word: ለዐቢይ ... በከመ፡ ዐበየ
  choice: великого — сообразно его величию
  rationale: Сохранена лексическая связь между «великим» и «величием», а также смысл меры или соответствия в በከመ.
- source_word: ለንኡስ ... በከመ፡ ንእሰ
  choice: малого — сообразно его малости
  rationale: Сохранён параллелизм исходного текста и соответствие между статусом человека и мерой суда.
- source_word: ለለ፡ አሐዱ
  choice: каждого
  rationale: Идиоматическое русское соответствие распределительному выражению «каждый один».
- source_word: ፍኖቱ
  choice: его пути
  rationale: Буквальное «путь» сохраняет традиционную нравственно-жизненную метафору и не сужает её до отдельных поступков.
- source_word: ይኴንኖ
  choice: Он будет судить
  rationale: Форма передаёт будущее судебное действие; прописная буква у местоимения указывает на Бога по контексту, не добавляя имени в основной текст.
theological_decisions:
- issue: Смысл суда «сообразно величию/малости»
  choice: Сохранить формулу без поясняющего толкования
  alternative: Передать как более строгий суд над великими и более снисходительный над малыми
  rationale: Исходный текст утверждает соответствие меры суда положению человека, но не объясняет, означает ли это строгость, ответственность или иной принцип.
- issue: «Путь» как основание суда
  choice: Сохранить единственное число «его путь»
  alternative: Конкретизировать как «его дела» или «его поведение»
  rationale: Метафора пути шире отдельных дел и сохраняет богословскую и нравственную ёмкость оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным синтаксисом. Двоеточие и тире делают трёхчастный параллелизм естественным по-русски, не устраняя повторов и напряжения оригинала.
