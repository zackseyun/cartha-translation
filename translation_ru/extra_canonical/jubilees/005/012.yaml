  yaml_path: translation/extra_canonical/jubilees/005/012.yaml
  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: ru
  text: И Он создал для всех Своих творений новую и праведную природу[a], чтобы они не грешили во всей своей природе вовеки, но все были праведны — каждый по своему роду во все дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это место трудно как с текстуальной, так и со смысловой стороны. Перевод сохраняет мысль о новой, праведной природе творений и об их устроении по родам, не сводя её к более общему утверждению.
    reason: textual_variant
lexical_decisions:
- source_word: ግብረ፡ ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: новую и праведную природу
  rationale: Передаёт трудное сочетание, в котором ግብር и ፍጥረት указывают на устроение или природу творения; формулировка сохраняет идею обновлённого праведного состояния, не сводя её к общему утверждению.
- source_word: እይረብቡ
  choice: не грешили
  rationale: По контексту передаёт нравственное отступление; сослагательная форма естественно выражает цель после «чтобы».
- source_word: በበ፡ ትዝምዳ
  choice: каждый по своему роду
  rationale: Сохраняет распределительное значение በበ и порядок творения согласно отдельным родам или видам.
- source_word: እስከ፡ ለዓለም
  choice: вовеки
  rationale: Естественный литературный эквивалент выражения неограниченной длительности.
- source_word: ኵሉ፡ መዋዕለ
  choice: во все дни
  rationale: Формально сохраняет временную формулу исходного текста, не заменяя её толкованием.
theological_decisions:
- issue: Характер обновления творения
  choice: «даровал ... новую и праведную природу»
  alternative: «сотворил для всех Своих дел новое и праведное устроение»
  rationale: Основной текст сохраняет антропоморфно-нравственную напряжённость и связь с природой творений, не уточняя механизм этого обновления.
- issue: Соотношение всеобщей праведности и различий между родами
  choice: «все были праведны — каждый по своему роду»
  alternative: «каждый род был праведен»
  rationale: Выбранная формулировка удерживает одновременно всеобщность утверждения и распределительную конструкцию оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» и притяжательное «Своим» написаны с прописной буквы как указание на Бога; синтаксис упрощён ровно настолько, чтобы трудная исходная конструкция оставалась понятной, но не была истолкована сверх текста.
