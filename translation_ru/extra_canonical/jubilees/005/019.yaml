base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: ru
  text: Но никому из тех, кто извратил свои пути и замыслы до потопа[a], не было оказано благоволения, кроме одного Ноя. Ему же было оказано благоволение ради его сыновей[b], которых он спас от вод потопа благодаря ему, потому что он был праведен сердцем во всех своих путях, в соответствии с тем, что было ему заповедано, и ни в чём не отступил от того, что было ему предписано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквальное чтение этого трудного места связано с выражением «воды потопа». По смыслу речь идёт о поколении до потопа, в котором благоволение было оказано одному Ною.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в пользу его сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  choice: извратил свои пути и замыслы
  rationale: Передаёт параллельные понятия поведения и намерений естественным современным русским языком, сохраняя нравственную окраску глагола.
- source_word: ኢተነሥአ፡ ገጾሙ / ተነሥአ፡ ሎቱ፡ ገጸ
  choice: не было оказано благоволения / было оказано благоволение
  rationale: Буквальный образ поднятого лица в контексте означает благосклонный приём или благоволение; симметричный перевод сохраняет повтор исходного текста.
- source_word: በእንተ፡ ውሉዱ
  choice: ради его сыновей
  rationale: Предлог здесь указывает на направленность благоволения в пользу сыновей, а не на то, что их заслуги стали причиной благоволения к Ною.
- source_word: በእንቲአሁ
  choice: благодаря ему
  rationale: 'Сохраняет причинную связь: сыновья были спасены по причине праведности Ноя.'
- source_word: ጻድቅ፡ ይእቲ፡ ልቡ
  choice: сердце его было праведно
  rationale: Сохранён исходный антропологический образ сердца как средоточия нравственной жизни.
- source_word: ዘሥሩዕ፡ ሎቱ
  choice: того, что было ему предписано
  rationale: Передаёт установленное или назначенное для Ноя без внесения дополнительной богословской конкретизации.
theological_decisions:
- issue: Кто является действующим лицом в спасении сыновей
  choice: «которых Бог спас»
  alternative: «которых он спас»
  rationale: В форме исходного текста субъект допускает неявное понимание, но контекст потопа указывает на Бога как на совершающего спасение. Имя добавлено для устранения ложного впечатления, будто Ной собственными силами спас сыновей.
- issue: Основание спасения сыновей
  choice: «благодаря ему»
  alternative: «ради него»
  rationale: Формулировка сохраняет утверждение, что спасение сыновей связано с Ноем, не уточняя механизм этой связи и не вводя конфессиональной модели вменения заслуг.
- issue: Соотношение заповеди и предписания
  choice: сохранены обе формулы
  alternative: объединить их как общее послушание Богу
  rationale: Исходный текст различает заповеданное и предписанное; повтор сохранён, чтобы не сгладить возможный смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; ключевые повторы исходного текста сохранены.
