lexical_decisions:
- source_word: አዘዞ
  choice: повелел
  rationale: Передаёт значение властного приказания и сохраняет возвышенный повествовательный регистр.
- source_word: ታቦተ
  choice: ковчег
  rationale: Устоявшийся русский библейский эквивалент для сооружения, построенного Ноем.
- source_word: ማየ፡ አይኅ
  choice: вод потопа
  rationale: Естественно передаёт сочетание «воды потопа», сохраняя прямую связь со стихийным бедствием.
- source_word: ይድኀኖ
  choice: спастись
  rationale: Инфинитив с «чтобы» естественно выражает цель; форма не уточняет способ спасения сверх сказанного в источнике.
theological_decisions:
- issue: Подлежащее глагола «повелел»
  choice: Он
  alternative: Бог
  rationale: В стихе источник использует глагольную форму с подразумеваемым субъектом; местоимение сохраняет контекстуальную отсылку и не добавляет явно отсутствующее имя.
- issue: Отношение ковчега к спасению
  choice: чтобы спастись
  alternative: чтобы он был спасён
  rationale: Русская возвратная конструкция сохраняет смысл цели и не навязывает различие между активным и пассивным пониманием избавления.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «ковчег». Синтаксис краткий и близкий к структуре геэзского источника; прописное «Он» обозначает Бога в соответствии с русской религиозно-литературной традицией.
