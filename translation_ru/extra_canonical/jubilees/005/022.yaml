  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: ru
  text: И сделал Ной ковчег во всём, как Он повелел ему, в двадцать шестой юбилей, в пятую седмину, в пятый год.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታቦተ
  choice: ковчег
  rationale: Традиционный и общеупотребительный русский эквивалент обозначения Ноева ковчега.
- source_word: በኵሉ
  choice: во всём
  rationale: 'Передаёт значение полноты: Ной исполнил всё во всех отношениях.'
- source_word: ኢዮቤልው፡ ዓመታት
  choice: юбилее лет
  rationale: Сохраняет особую хронологическую систему книги и связь юбилея с годами, не заменяя её приблизительным современным обозначением.
- source_word: ሱባዔ
  choice: седмине
  rationale: В данном хронологическом контексте речь идёт о семилетнем цикле, а не об обычной семидневной неделе; «седмина» сохраняет это различие.
theological_decisions:
- issue: Субъект глагола አዘዞ
  choice: «Он повелел ему»
  alternative: «ему было повелено»
  rationale: Форма источника активна и содержит объектный суффикс «ему»; местоимение «Он» передаёт подразумеваемого по контексту Бога, не превращая активную конструкцию в пассивную.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими терминами «ковчег» и «седмина». Формула датировки сохранена близко к структуре источника; последовательность «юбилей — седмина — год» не упрощена.
