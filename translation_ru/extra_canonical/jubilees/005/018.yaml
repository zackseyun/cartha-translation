  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: ru
  text: Записано и установлено, что милость будет явлена всем, кто отвернётся от всех своих прегрешений, — раз в год.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «раз в год», возможно, связано с характерным для Книги Юбилеев представлением о календарно повторяющемся искуплении или явлении милости. В переводе эта периодичность сохранена прямо, без обобщения.
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: Записано и установлено
  rationale: 'Сохраняет две пассивные формы исходного текста: постановление одновременно представлено как записанное и установленное.'
- source_word: ይትመሐር፡
  choice: милость будет явлена
  rationale: Безличная пассивная передача сохраняет значение оказания милости и не вводит явно названного деятеля, которого в данной формулировке источника нет.
- source_word: ተመይጡ፡ እምኵሉ፡ ጌጋዮሙ፡
  choice: кто отвернётся от всех своих прегрешений
  rationale: «Отвернётся» естественно передаёт уход от прежнего пути, а «прегрешения» охватывает нравственные ошибки и проступки, не сводя выражение лишь к интеллектуальному заблуждению.
- source_word: ምዕረ፡ ለለ፡ ዓመት።
  choice: раз в год
  rationale: Кратко и прямо сохраняет ежегодную периодичность, выраженную в источнике.
theological_decisions:
- issue: Кто оказывает милость
  choice: 'Сохранена пассивная конструкция: «милость будет явлена»'
  alternative: «Он явит милость»
  rationale: Исходная формулировка не называет деятеля явно; пассив не устраняет возможную божественную отнесённость, но и не добавляет местоимение.
- issue: Характер ежегодной милости
  choice: «раз в год» оставлено без пояснения в основном тексте
  alternative: Истолковать как ежегодное искупление или конкретный обрядовый день
  rationale: Текст утверждает периодичность, но сам по себе не уточняет её обрядовый или богословский механизм; возможная календарная связь отмечена только в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировка остаётся ясной для широкого читателя; тире выделяет значимое указание на ежегодную периодичность.
