  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: ru
  text: А в двадцать седьмой день того месяца он открыл ковчег и выпустил из него диких зверей, домашних животных, птиц и всё, что движется.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ
  choice: диких зверей
  rationale: Передаёт категорию зверей в отличие от следующего обозначения домашних животных.
- source_word: እንስሳ
  choice: домашних животных
  rationale: В данном перечислении противопоставлено диким зверям и естественно обозначает скот или одомашненных животных.
- source_word: አዕዋፈ
  choice: птиц
  rationale: Прямой и естественный русский эквивалент.
- source_word: ወዘይትነወስ
  choice: и всё, что движется
  rationale: Сохраняет широкую и несколько неопределённую формулировку исходного текста.
- source_word: ዕሥራ ወሰብዑ ሎቱ
  choice: в двадцать седьмой день этого месяца
  rationale: Контекстуально проясняет эллиптическое указание даты; «этого месяца» естественнее по-русски, чем буквальное «его».
- source_word: አርኀዋ ለታቦት
  choice: открыл ковчег
  rationale: Формально и естественно передаёт действие Ноя над ковчегом.
