  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: ru
  text: 'А о сынах Израиля написано и установлено: если они обратятся к Нему в праведности, Он простит все их преступления и отпустит все их грехи.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: сынах Израиля
  rationale: Традиционное и естественное для библейского регистра обозначение народа Израиля; сохраняет образность исходного выражения.
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: написано и установлено
  rationale: Передаёт два координированных пассивных глагола, сохраняя различие между письменным свидетельством и установленным определением.
- source_word: ተመይጡ፡ ኀቤሁ
  choice: обратятся к Нему
  rationale: Выражает направленное возвращение к Богу без добавления конфессионально окрашенной терминологии.
- source_word: በጽድቅ
  choice: в праведности
  rationale: Формально сохраняет абстрактное существительное и возможную смысловую напряжённость между праведным образом обращения и нравственной праведностью.
- source_word: አበሳሆሙ
  choice: их преступления
  rationale: Передаёт проступки или вину более конкретно, не смешивая это слово со следующим обозначением грехов.
- source_word: ይስሬ፡ ኵሎ፡ ኀጢአቶሙ
  choice: отпустит все их грехи
  rationale: Сохраняет параллелизм со словом «простит» и различие второго глагола; «отпустит грехи» соответствует достоинству библейского регистра.
theological_decisions:
- issue: Условие Божьего прощения
  choice: если они обратятся к Нему в праведности
  alternative: если они праведно обратятся к Нему
  rationale: Существительная конструкция точнее сохраняет формулировку источника и не уточняет без необходимости, означает ли она искренность, праведный образ действий или состояние праведности.
- issue: Два параллельных выражения прощения
  choice: простит все их преступления и отпустит все их грехи
  alternative: простит все их преступления и все их грехи
  rationale: Сохранены оба исходных глагола и оба обозначения проступка, чтобы не стирать поэтический параллелизм и возможный смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, dignified регистром. Заглавная буква в местоимении «Нему/Он» служит русской издательской ясности и не добавляет к тексту нового референта; контекст указывает на Бога. Синтаксис оставлен компактным и близким к структуре геэзского текста.
