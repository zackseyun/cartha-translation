  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: ru
  text: 'И сказал Господь, что истребит всё, что на суше: от человека до скота, до диких зверей, до небесных птиц и до всего, что движется по земле.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему прочтению: «Пусть будет истреблено всё, что на суше: от человека до скота, до диких зверей, до небесных птиц и до всего, что движется по земле».'
    reason: previous_rendering
lexical_decisions:
- source_word: ይደመስስ
  choice: истребит
  rationale: Активная форма 3-го лица требует сохранить Господа как подразумеваемого деятеля; «истребит» естественно передаёт полное уничтожение в контексте потопа.
- source_word: የብስ
  choice: суше
  rationale: Передаёт противопоставление сухой земли воде и соответствует значению геэзского слова.
- source_word: እንስሳ
  choice: скота
  rationale: В данном перечислении обозначает домашних животных, в отличие от следующего слова «дикие звери».
- source_word: አራዊት
  choice: диких зверей
  rationale: Сохраняет различие между домашними животными и зверями.
- source_word: አዕዋፈ፡ ሰማይ
  choice: небесных птиц
  rationale: Буквальный и естественный для библейского регистра эквивалент сочетания «птицы неба».
- source_word: ዘይትሐወስ፡ ውስተ፡ ምድር
  choice: всего, что движется по земле
  rationale: Сохраняет обобщённость и движение по земле без неоправданного уточнения вида существ.
theological_decisions:
- issue: Прямая или косвенная речь и субъект уничтожения
  choice: 'Косвенная речь: «сказал Господь, что истребит»'
  alternative: 'Прямая пассивная речь: «Пусть будет истреблено всё…»'
  rationale: Форма ይደመስስ является активным глаголом 3-го лица с объектом ኵሎ («всё»), поэтому наиболее вероятна косвенная речь, где подразумеваемый субъект — Господь. Альтернативное прочтение отмечено в сноске ввиду истории передачи текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Сохранена последовательная формула «от… до…», хотя по-русски она несколько тяжеловесна, поскольку она отражает структуру исходного перечисления. Местоимение, обозначающее Господа, не добавлено: субъект формы «истребит» однозначно восстанавливается из контекста.'
