  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: ru
  text: А на Своих ангелов, которых Он послал на землю, Он сильно разгневался и лишил их всей власти.[a] Он велел нам связать их в глубинах земли; и вот, они связаны там[b] и отделены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «Он сильно разгневался, чтобы лишить их всей власти». Исходная конструкция кратко связывает гнев с лишением власти; русский текст передаёт это как последовательное действие.'
    reason: translation_ambiguity
  - marker: b
    text: 'Буквально: «среди них»; местоимение, вероятно, относится к «глубинам земли».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ተምዐ፡ ፈድፋደ
  choice: сильно разгневался
  rationale: Сочетание передаёт чрезвычайно сильный гнев; современная формулировка сохраняет усиление без архаизации.
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: лишил их всей власти
  rationale: Глагол в контексте означает устранение или лишение, а ሥልጣን — власть, полномочие или господство. «Лишил их всей власти» естественно передаёт смысл, не вводя более узкое толкование.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: в глубинах земли
  rationale: Буквальное и естественное обозначение подземных глубин.
- source_word: ማእከሎሙ
  choice: там
  rationale: Местоименный суффикс, вероятнее всего, отсылает к множественному «глубинам». Русское «там» избегает неестественного «посреди них», сохраняя локативный смысл.
- source_word: ብሕትዋን
  choice: отделены
  rationale: Передаёт состояние обособления или изоляции без добавления того, от кого или от чего они отделены.
theological_decisions:
- issue: Кто говорит в форме первого лица множественного числа
  choice: Сохранено «нам» без уточнения личности говорящих
  alternative: «ангелам» или «нам, ангелам»
  rationale: Источник говорит «Он велел нам» в рамках ангельского повествования, но не вставляет поясняющего существительного в сам стих.
- issue: Характер лишения ангелов власти
  choice: «лишил их всей власти»
  alternative: «искоренил их из всего их владения» или «повелел лишить их власти»
  rationale: Формулировка сохраняет действие Бога против согрешивших ангелов, не уточняя сверх текста, было ли оно осуществлено непосредственно или посредством повеления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксис разделён на два предложения ради ясности, при сохранении последовательности исходного текста.
