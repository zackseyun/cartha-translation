  source_fidelity: 'В целом перевод точно передаёт геэзский текст: «ангелы Божьи», красота дочерей, взятие жён и рождение исполинов сохранены без гармонизации с Быт. 6. Однако «взяли себе в жёны всех, кого избрали» грамматически и семантически неудачно: «всех» в русском по умолчанию мужского рода и не обозначает избранных женщин. Также заключительное «это были исполины» несколько размывает отсылку к детям.'
