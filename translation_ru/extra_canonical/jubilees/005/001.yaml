base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: ru
  text: 'И было: когда сыны человеческие начали умножаться по лицу земли и у них родились дочери, в некий год этого юбилея ангелы Божьи увидели, что они прекрасны видом. И они взяли себе в жёны тех из них, кого избрали; те родили им детей, и эти дети были исполинами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: сыны человеческие
  rationale: Устойчивое библейское выражение, соответствующее буквальному смыслу «дети/сыны людей» и связи этого места с Быт. 6:1.
- source_word: መላእክተ፡ እግዚአብሔር
  choice: ангелы Божьи
  rationale: Прямо передаёт чтение геэзского источника, не заменяя его вариантом «сыны Божьи» из иной текстовой традиции.
- source_word: ሠናያት፡ ለርእይ
  choice: прекрасны видом
  rationale: Сохраняет зрительный компонент выражения — буквально «хороши/прекрасны для взора» — в естественной русской форме.
- source_word: ረዐይት
  choice: исполины
  rationale: Передаёт обозначение гигантов традиционным и понятным библейским словом, не отождествляя их дополнительно с какой-либо иной группой.
theological_decisions:
- issue: Кем названы увидевшие дочерей людей
  choice: ангелы Божьи
  alternative: сыны Божьи
  rationale: Геэзский текст прямо называет их ангелами Бога; перевод следует данному источнику и не гармонизирует его с формулировкой Быт. 6:2.
- issue: Объём выражения «из всех, кого избрали»
  choice: взяли себе в жёны всех, кого избрали
  alternative: брали себе в жёны, кого выбирали
  rationale: Сохранён универсальный оттенок исходного እምኵሎን («из всех/всех»), хотя по-русски эта формулировка оставляет открытым, идёт ли речь о каждой избранной ими женщине или о неограниченном выборе.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальное «И было» сохраняет повествовательную формулу без архаического «и случилось». Местоимения распределены так, чтобы жёны, а не ангелы, естественно понимались как родившие детей.
