  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: ru
  text: И увидел Господь землю — и вот, она была растлена; и всякая плоть извратила свой порядок, и все, кто был на земле, творили зло пред очами Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሰነት / አማሰነት
  choice: была растлена / извратила
  rationale: Повтор одного корня передан родственными словами, отражающими состояние земли и действие всякой плоти; «растлена» сохраняет библейский регистр без архаической тяжеловесности.
- source_word: ኵሉ፡ ዘሤጋ
  choice: всякая плоть
  rationale: Формально и идиоматически передаёт библейское собирательное обозначение живых существ или людей, не сужая референт.
- source_word: ሥርዓታ
  choice: установленный для неё порядок
  rationale: Слово обозначает порядок, установление или правило, а не просто путь; добавление «установленный для неё» естественно раскрывает притяжательную конструкцию и сохраняет тему нарушенного порядка.
- source_word: አእከየ
  choice: творили зло
  rationale: Передаёт деятельное совершение зла и соответствует естественной библейской русской формуле.
- source_word: ቅድመ፡ አዕይንቲሁ
  choice: пред очами Его
  rationale: Сохраняет образ исходного текста и его торжественный библейский регистр.
theological_decisions:
- issue: Значение ሥርዓት как нарушенного установления
  choice: установленный для неё порядок
  alternative: свой путь
  rationale: Исходная лексема выражает порядок, правило или установление; вариант «путь» сглаживал бы тему нарушения установленного порядка и был бы менее точен.
- issue: Референт выражения «всякая плоть»
  choice: сохранить собирательное выражение без уточнения
  alternative: все люди / все живые существа
  rationale: Контекст допускает различный объём референта, поэтому перевод не должен искусственно разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический параллелизм исходника сохранён; архаизмы ограничены устойчивым выражением «пред очами Его».
