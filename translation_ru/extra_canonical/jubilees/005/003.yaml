  source_fidelity: 'Основной смысл передан верно: земля показана растленной, «всякая плоть» нарушает свой порядок, а пребывающие на земле творят зло перед Божьими очами. Однако добавление «установленный для неё» не выражено прямо в геэзском тексте: притяжательный суффикс передаёт «её/свой порядок», но не уточняет, кем он установлен и для кого именно.'
