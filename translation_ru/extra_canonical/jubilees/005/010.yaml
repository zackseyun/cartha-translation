  yaml_path: translation/extra_canonical/jubilees/005/010.yaml
  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: ru
  text: И отцы их наблюдали; после этого они были скованы в глубинах земли навеки — до дня великого суда, для суда над всеми[a], кто извратил свои пути и свои дела пред Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда совершится суд над всеми».'
    reason: Конструкция после «дня великого суда» допускает событийное развёртывание, однако основной текст сохраняет более прямую целевую связь и направленность суда «над всеми».
lexical_decisions:
- source_word: ይኔጽሩ
  choice: наблюдали
  rationale: Передаёт значение продолжающегося зрительного наблюдения, не уточняя его цель или эмоциональную окраску.
- source_word: ተአስሩ
  choice: были скованы
  rationale: Страдательная форма указывает на связывание или заключение; «скованы» естественно сочетается с последующим пребыванием в глубинах земли.
- source_word: ውስተ መዓምቅቲሃ ለምድር
  choice: в глубинах земли
  rationale: Прямо передаёт пространственный образ источника без его догматического отождествления с адом или иным определённым местом.
- source_word: እስከ ለዓለም
  choice: навеки — до
  rationale: Сохраняет напряжение между указанием на вечность и пределом «до дня великого суда», не устраняя его толкованием.
- source_word: ዲበ ኵሎሙ
  choice: над всеми
  rationale: Предлог ዲበ имеет направленное значение «над, на, против» и здесь обозначает тех, над кем совершается суд.
- source_word: አማሰኑ ፍኖቶሆሙ ወምግባሪሆሙ
  choice: извратил свои пути и свои дела
  rationale: Сохраняет параллельные объекты исходного текста и нравственный смысл глагола «портить, развращать, извращать».
theological_decisions:
- issue: Соотношение вечного заключения и суда в определённый день
  choice: «навеки — до дня великого суда»
  alternative: «навечно, вплоть до дня великого суда»
  rationale: Формулировка сохраняет внутреннее временное напряжение исходного текста и не решает заранее, прекращается ли заключение после суда.
- issue: Синтаксическая связь повторённого слова «суд»
  choice: «когда совершится суд над всеми»
  alternative: «для суда над всеми»
  rationale: Основной текст выражает вероятный событийный смысл при сохранении повторной идеи суда; альтернативная целевая связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Пред Господом» сохраняет достоинство стиля, а синтаксис остаётся понятным современному читателю.
