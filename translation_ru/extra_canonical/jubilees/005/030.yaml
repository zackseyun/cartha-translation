  text: And on the new moon of the tenth month the tops of the mountains appeared, and on the new moon of the first month the earth appeared.
translation:
  language: ru
  text: И в новолуние десятого месяца показались вершины гор, а в новолуние первого месяца показалась земля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡
  choice: в новолуние
  rationale: Оборот буквально связан с восходом/появлением луны и в данном календарном контексте естественно означает начало месяца, то есть новолуние.
- source_word: አስተርአየ
  choice: показались
  rationale: Передаёт значение «стали видимы, явились» без добавления причины или наблюдателя.
- source_word: አርእስተ፡ አድባር፡
  choice: вершины гор
  rationale: Формальное соответствие сочетанию «главы/вершины гор» и естественная русская формулировка.
- source_word: ምድር
  choice: земля
  rationale: 'Сохраняет широкое значение слова: земля или суша; контекст допускает понимание ставшей видимой поверхности земли.'
