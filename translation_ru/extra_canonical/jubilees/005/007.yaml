  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: ru
  text: А о сыновьях их вышло слово от лица Его, чтобы их поразили мечом и удалили из-под неба.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истребили мечом и уничтожили».'
    reason: Сохраняет известный более динамичный вариант передачи, хотя основной текст точнее отражает значения двух эфиопских глаголов.
lexical_decisions:
- source_word: ወዲበ፡ ውሉዶሙ፡
  choice: А о сыновьях их
  rationale: Передаёт предложную конструкцию «относительно их сыновей», сохраняя связь с предыдущим контекстом.
- source_word: ወፅአ፡ ቃል፡ እምቅድመ፡ ገጹ፡
  choice: вышло слово от лица Его
  rationale: Формально сохраняет образ повеления, исходящего от Божьего лица; прописная буква указывает на референта без добавления имени.
- source_word: ይምሐጾሙ፡ በሰይፍ፡
  choice: их поразили мечом
  rationale: Глагол maḥaṣa означает «ударить, поразить»; это точнее, чем более истолковательное «истребили».
- source_word: ወያሰስሎሙ፡ እምታሕተ፡ ሰማይ።
  choice: и удалили из-под неба
  rationale: Сохраняет конкретное значение asasala «удалить» и пространственный образ «из-под неба».
theological_decisions:
- issue: Кто произносит приговор
  choice: «от лица Его» с прописной буквой
  alternative: «от его лица» или явное «от лица Бога»
  rationale: Источник использует местоимение, а не имя; перевод сохраняет эту форму и вместе с тем ясно обозначает божественного референта по контексту.
- issue: Сила двух глаголов наказания
  choice: «поразили мечом и удалили»
  alternative: «истребили мечом и уничтожили»
  rationale: Более сильная альтернатива сглаживает различие исходных глаголов и чрезмерно конкретизирует второй как уничтожение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским строем. Инверсия «сыновьях их» и выражение «от лица Его» намеренно сохраняют достоинство и образность источника, не делая фразу непонятной.
