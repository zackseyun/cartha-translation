  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: ru
  text: Он не лицеприятен и не принимает взяток. Если Он говорит, что совершит суд над каждым, то, даже если кто-нибудь отдаст всё, что есть на земле, Он не проявит лицеприятия, не примет дара и ничего не возьмёт из его руки, потому что Он — праведный Судья.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነሥእ ገጸ
  choice: лицеприятен / проявит лицеприятие
  rationale: Буквально «принимает лицо»; это устойчивый семитский судебный оборот, обозначающий пристрастное отношение к человеку.
- source_word: ይነሥእ ሕሊና
  choice: принимает взятки
  rationale: В контексте праведного суда речь идёт о даре, способном повлиять на решение; современное «взятка» ясно передаёт судебный смысл.
- source_word: ይትሜጠው እምእዴሁ
  choice: ничего не возьмёт из его руки
  rationale: Глагол означает принятие или получение; выражение передано непосредственно, без прежнего истолкования «не поддастся влиянию».
- source_word: መኰንን ጽድቅ
  choice: праведный Судья
  rationale: Сохраняет судебный титул и характеристику справедливости/праведности исходного выражения.
theological_decisions:
- issue: Беспристрастность Божьего суда
  choice: Сохранено категорическое утверждение, что Судья не проявляет лицеприятия и не принимает взяток.
  alternative: Ослабить формулировку до общего утверждения о справедливости.
  rationale: Исходный текст подчёркивает неподкупность конкретными судебными образами; их не следует сводить к абстрактной характеристике.
- issue: Референт местоимения
  choice: Местоимение «Он» и слово «Судья» написаны с прописной буквы как указание на Бога в контексте.
  alternative: Писать со строчной буквы.
  rationale: Прописная буква соответствует современному русскому библейскому регистру, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с ясной судебной лексикой. Синтаксис упрощён для естественного чтения, но повтор лицеприятия и принятия дара сохранён как риторическое усиление исходного текста.
