  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: ru
  text: И он вошёл в него в шестой год[a], во втором месяце, в новолуние второго месяца, — до шестнадцатого дня; и вошли в ковчег он и всё, что мы привели к нему, а Господь затворил его снаружи вечером семнадцатого дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Датировка в этом стихе сформулирована неясно. Слова «в новолуние второго месяца — до шестнадцатого дня… вечером семнадцатого дня», вероятно, описывают вхождение в ковчег и то, как Господь затворил его непосредственно перед началом потопа.
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ
  choice: в шестой год
  rationale: Форма означает «в шестой» и в контексте хронологии Книги Юбилеев относится к шестому году; перевод «в шестисотый год» был бы гармонизацией с Бытием, не поддержанной данным чтением.
- source_word: በሠርቅ
  choice: в новолуние
  rationale: Сохранён характерный для календарной системы Книги Юбилеев термин «новолуние», а не нейтрализующее «в первый день».
- source_word: ታቦት
  choice: ковчег
  rationale: Устоявшееся и понятное русское обозначение Ноева ковчега.
- source_word: ዐጸዎ ... እንተ አፍአሁ
  choice: затворил его снаружи
  rationale: Передаёт действие Господа и пространственное указание исходного текста, сохраняя местоименную форму объекта.
theological_decisions:
- issue: Соотношение «шестого года» с Быт 7:6
  choice: Сохранено «в шестой год»
  alternative: «в шестисотый год»
  rationale: Исходный геэзский текст прямо читает «шестой»; исправление на «шестисотый» устранило бы особенность собственной хронологии Книги Юбилеев посредством внешней гармонизации.
- issue: Календарное обозначение начала месяца
  choice: «в новолуние»
  alternative: «в первый день»
  rationale: Перевод сохраняет календарную терминологию и не сводит её без пояснения к предполагаемому эквиваленту.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Повтор глагола «вошёл/вошли» и трудная последовательность дат в основном сохранены, чтобы не устранять неоднозначность исходного текста.
