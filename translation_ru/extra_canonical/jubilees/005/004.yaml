  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: ru
  text: 'И Он сказал: «Я истреблю человека и всякую плоть на лице земли — то, что Я сотворил».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Относительный оборот можно понимать как относящийся к человеку и всякой плоти; его точная область отнесения в геэзском синтаксисе не вполне ясна.
    reason: Сохраняет синтаксическую неопределённость относительного оборота ዘፈጠርኩ, не добавляя в основной текст обобщающего «всё».
lexical_decisions:
- source_word: አይመሰለ
  choice: Я истреблю
  rationale: Передаёт решительное намерение уничтожить, выраженное глагольной формой в данном контексте.
- source_word: ለሰብእ
  choice: человека
  rationale: Сохраняет собирательное единственное число источника.
- source_word: ለኵሉ ዘሥጋ
  choice: всякую плоть
  rationale: Естественная для библейского регистра передача выражения «всё, что [есть] плоть», охватывающего живые существа.
- source_word: በመልዕልተ ገጸ ምድር
  choice: на лице земли
  rationale: Предлог በ здесь означает «на», а не «с»; формулировка сохраняет образ поверхности земли.
- source_word: ዘፈጠርኩ
  choice: всё, что Я сотворил
  rationale: Отдельный оборот после тире естественно передаёт относительную конструкцию и не делает слово «земля» её единственным антецедентом.
theological_decisions:
- issue: К чему относится выражение ዘፈጠርኩ («что Я сотворил»)
  choice: 'Отнесено обобщённо к названным живым существам: человеку и всякой плоти'
  alternative: «земли, которую Я сотворил»
  rationale: Форма относительного элемента ዘ не поддерживает естественное согласование с «землёй» как единственным антецедентом; при этом обобщающий русский оборот избегает неуклюжего смешанного согласования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Местоимение, относящееся к Богу, написано с прописной буквы. Сохранены собирательное «человек» и традиционное выражение «всякая плоть».
