  yaml_path: translation/extra_canonical/jubilees/005/029.yaml
  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: ru
  text: В четвёртом месяце закрылись источники великой бездны[a], и небесные шлюзы были перекрыты; а с наступлением седьмого месяца открылись все устья земных глубин, и воды стали стекать в нижнюю бездну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Формулировка может показаться парадоксальной: после того как источники великой бездны «закрылись», устья земных глубин «открылись», чтобы воды стекали в нижнюю бездну. Перевод сохраняет эту космологическую последовательность, не пытаясь её сгладить.'
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: источники великой бездны
  rationale: Передаёт космологический образ источников или родников великой глубины и сохраняет связь с языком повествования о потопе.
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: небесные шлюзы
  rationale: Современное и понятное обозначение отверстий небесного свода, через которые изливаются воды; сохраняет древний космологический образ.
- source_word: ተአኀዘ
  choice: были перекрыты
  rationale: Естественно по-русски передаёт значение удерживания или прекращения действия небесных шлюзов, не повторяя глагол «закрылись».
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: с наступлением седьмого месяца
  rationale: Передаёт начало седьмого месяца без излишне конкретного толкования как строго определённого дня новолуния.
- source_word: አፈወ፡ መዓምቅተ፡ ምድር
  choice: устья земных глубин
  rationale: Буквально сохраняет образ «уст» или отверстий глубин земли, через которые вода уходит вниз.
- source_word: ቀላይ፡ ታሕቲት
  choice: нижняя бездна
  rationale: Сохраняет пространственное различие между великой бездной и расположенной ниже областью, куда стекают воды.
theological_decisions:
- issue: Кажущееся противоречие между закрытием источников бездны и последующим открытием устьев земных глубин
  choice: Сохранить последовательность образов без согласующего пояснения в основном тексте
  alternative: Переформулировать открытие глубин как простое отступление или просачивание вод
  rationale: 'Источник описывает два разных действия в древней космологической картине: прекращение притока вод и открытие путей для их ухода. Перевод не должен устранять эту смысловую напряжённость.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис сохраняет последовательность исходного повествования, а термины «бездна», «небесные шлюзы» и «устья земных глубин» передают древнюю космологию без конфессионального истолкования.
