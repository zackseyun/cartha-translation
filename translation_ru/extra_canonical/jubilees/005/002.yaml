- from: И умножилось беззаконие на земле, и всякая плоть извратила свой путь — от людей до скота, диких зверей, птиц и всего, что движется по земле. Все они извратили свои пути и установления и начали пожирать друг друга. Беззаконие умножилось на земле, и всякое помышление разума всех сынов человеческих было таким — злым во все дни.
