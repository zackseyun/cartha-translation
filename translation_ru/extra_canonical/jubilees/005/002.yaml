  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: ru
  text: И умножилось беззаконие на земле, и всякая плоть — от людей до скота, диких зверей, птиц и всего, что движется по земле, — извратила свой путь. Все они извратили свои пути и порядки и начали пожирать друг друга. Беззаконие умножилось на земле, и всякий замысел в помыслах всех сынов человеческих во все дни был злым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: беззаконие
  rationale: Передаёт нравственное нарушение и неправедность, сохраняя библейский регистр; «насилие» было бы уже по смыслу.
- source_word: ኵሉ ዘሥጋ
  choice: всякая плоть
  rationale: Сохраняет широкий библейский образ, охватывающий людей и животных.
- source_word: አማሰነ ፍኖተ
  choice: извратила свой путь
  rationale: Формально и естественно передаёт порчу образа жизни или поведения, не сводя смысл только к физическому разрушению.
- source_word: ሥርዐቶሙ
  choice: установления
  rationale: Сохраняет возможный смысл порядка, устройства или предписанного образа существования без излишнего уточнения.
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: пожирать друг друга
  rationale: Передаёт взаимное поедание прямо и идиоматично.
- source_word: ሕሊና አእምሮ
  choice: помышление разума
  rationale: Сохраняет сочетание понятий замысла/воображения и мысли/разума, не устраняя присущую выражению смысловую плотность.
- source_word: እጓለ እመሕያው
  choice: сыны человеческие
  rationale: Традиционное библейское обозначение человечества, соответствующее достоинству регистра.
theological_decisions:
- issue: Объём выражения «всякая плоть»
  choice: Сохранить универсальную формулировку и затем перечисление живых существ
  alternative: Передать как «все живые существа»
  rationale: Буквальный библейский образ важен для связи с повествованием о потопе и не требует богословского уточнения.
- issue: Характер зла человеческих помышлений
  choice: «было таким — злым во все дни»
  alternative: «всегда было только злым»
  rationale: Выбранная формулировка ближе к данной эфиопской конструкции и не добавляет усилительное «только», отсутствующее в тексте.
translation_notes:
  register: Современный литературный русский с сохранением достоинства древнего библейского повествования. Синтаксис слегка упрощён для ясности, но повтор «беззаконие умножилось на земле» сохранён как композиционный элемент исходного текста.
