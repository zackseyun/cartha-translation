  text: And the fountains of the deep also sent up waters until the whole world was full of water.
translation:
  language: ru
  text: И из источников бездны также поднимались воды, пока весь мир не наполнился водой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ
  choice: источники бездны
  rationale: Сочетание обозначает источники или родники глубины; «бездна» естественно передаёт первозданную глубину и сохраняет библейскую образность повествования о потопе.
- source_word: ያዐርጉ፡ ማያተ
  choice: изливали воды
  rationale: Глагол имеет направленность вверх («поднимать, заставлять подниматься»), однако в данном контексте речь о выходе воды из глубины; «изливали» звучит естественно и сохраняет образ непрерывного поступления воды.
- source_word: ኵሉ፡ ዓለም
  choice: весь мир
  rationale: Буквально «весь мир»; формулировка сохраняет масштаб высказывания источника, не уточняя его географически.
- source_word: መልአ ... ማየ
  choice: наполнился водой
  rationale: Прямая и естественная передача конструкции «стал полон воды».
theological_decisions:
- issue: Масштаб потопа
  choice: весь мир
  alternative: вся земля
  rationale: Эфиопское ዓለም допускает значение «мир, век»; выбранное чтение соответствует непосредственной формулировке текста и не разрешает богословский вопрос о географическом масштабе потопа посредством поясняющей добавки.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной библейской образности. Синтаксис краткий и ясный; архаизмы не используются.
