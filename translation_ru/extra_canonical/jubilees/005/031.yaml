  text: And the waters receded from upon the earth in the fifth week, in its seventh year; and on the seventeenth day in the second month the earth was dry.
translation:
  language: ru
  text: И воды отступили с земли в пятую семилетку, в седьмой её год; а в семнадцатый день второго месяца земля высохла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነጽፈ፡ ማያት
  choice: И воды отступили
  rationale: Глагольная форма передаёт прекращение или убыль вод; «отступили» естественно по-русски выражает их схождение с поверхности земли, не усиливая смысл до полного исчезновения.
- source_word: አመልዐልተ፡ ምድር
  choice: с земли
  rationale: Буквально речь идёт о водах, находившихся «над/на поверхности земли»; русское «отступили с земли» сохраняет пространственный смысл без неестественной кальки.
- source_word: በሱባዔ፡ ኃምስ፡ በሳብዕ፡ ዓመት፡ ሎቱ
  choice: в пятую неделю, в седьмой её год
  rationale: 'Сохранена юбилейная хронологическая формула источника: пятая седмица лет и её седьмой год.'
- source_word: አመ፡ ዐሡሩ፡ ወሰብዑ፡ ዕለት፡ በካልእ፡ ወርኀ
  choice: в семнадцатый день второго месяца
  rationale: Прямая и идиоматичная передача календарной даты.
- source_word: የብሰት፡ ምድር
  choice: земля высохла
  rationale: Передаёт состояние суши после схода вод и соответствует простой повествовательной формулировке оригинала.
