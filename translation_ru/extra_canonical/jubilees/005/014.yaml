base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: ru
  text: И если они не ходят по нему, приговор записан для всякого создания и всякого рода. И нет ни одного приговора — ни на небе, ни на земле, ни во свете, ни во тьме, ни в шеоле, ни в бездне, ни в месте тьмы[a], — который не был бы установлен, записан и высечен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перечень «на небе… на земле… во свете… во тьме… в шеоле… в бездне… в месте тьмы» охватывает все области мироздания.
    reason: cultural_note
  - marker: b
    text: 'Буквально заключительная трёхчастная формула: «установлен, записан и высечен»; она сохраняет образ неотменимой судебной записи.'
    reason: translation_note
lexical_decisions:
- source_word: ተጽሕፈ፡ ዘንተ
  choice: это записано
  rationale: Буквально сочетание указывает на «это записано», без явного существительного «приговор» в данной фразе; указательное местоимение сохраняет связь с предшествующим контекстом и не вносит отсутствующее слово.
- source_word: ለኵሉ፡ ፍጥረት
  choice: для всякого творения
  rationale: Сохраняет широкий охват исходного выражения и его связь со всем сотворённым.
- source_word: ወለኵሉ፡ ትዝምድ
  choice: и для всякого рода
  rationale: «Род» естественно передаёт значение группы по происхождению или виду, не сужая его до человеческих поколений.
- source_word: ሲኦል
  choice: шеол
  rationale: Транслитерация сохраняет древний космологический термин и не отождествляет его безоговорочно с позднейшим понятием ада.
- source_word: ቀላይ
  choice: бездна
  rationale: Передаёт образ глубины или водной бездны в составе космологического перечисления.
- source_word: መጽልም
  choice: место мрака
  rationale: Сохраняет отличие от ранее названной «тьмы» и пространственный оттенок исходного слова.
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: установлен, записан и высечен
  rationale: Сохранена трёхчастная формула, соединяющая предопределённость с образами письменной и высеченной судебной записи.
theological_decisions:
- issue: Отнесение заключительной формулы к судебному приговору
  choice: «нет ни одного приговора … который не был бы установлен, записан и высечен»
  alternative: «нет ничего … все их приговоры установлены, записаны и высечены»
  rationale: Русская относительная конструкция делает синтаксическую связь ясной, сохраняет судебную лексику источника и не превращает утверждение в общее учение о предопределённости всего сущего.
- issue: Передача шеола
  choice: «шеол»
  alternative: «преисподняя» или «ад»
  rationale: Нейтральная транслитерация не навязывает более позднюю конфессиональную трактовку мира мёртвых.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Юридическая образность сохранена; архаизмы сведены к принятому библейскому термину «шеол».
