- source_word: ልህቀ፡ ማያት
  choice: воды поднялись
  rationale: Глагол передаёт возрастание или подъём вод; естественное русское соответствие сохраняет образ наводнения.
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: на пятнадцать локтей
  rationale: Буквально переданы число и древняя мера длины без пересчёта в современные единицы.
- source_word: ኵሉ፡ ደብር፡ ነዋኅ
  choice: всеми высокими горами
  rationale: Сохранены всеобщность и характеристика гор; выражение не уточняет географический охват сверх сказанного в тексте.
- source_word: ታቦት
  choice: ковчег
  rationale: Традиционный и общепонятный русский эквивалент для судна Ноя.
- source_word: ተንሰፈ፡ ዲበ፡ ገጸ፡ ማያት
  choice: поплыл по поверхности вод
  rationale: Передаёт движение ковчега на поверхности воды естественным современным русским языком.
theological_decisions:
- issue: Масштаб выражения «над всеми высокими горами»
  choice: Сохранить прямую всеобщую формулировку источника
  alternative: Истолковать её как указание на локальный либо глобальный географический масштаб
  rationale: Перевод не должен разрешать географический и богословский вопрос, который сам стих прямо не разъясняет.
