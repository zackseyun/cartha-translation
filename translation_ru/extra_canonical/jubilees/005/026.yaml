  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: ru
  text: И воды поднялись над землёй на пятнадцать локтей; воды возвысились над всеми высокими горами, и ковчег поднялся от земли и поплыл по поверхности вод.
  philosophy: optimal-equivalence
