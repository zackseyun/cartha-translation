  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: ru
  text: И Он послал среди них меч, чтобы каждый убил своего ближнего. И стали они убивать друг друга, пока все не пали от меча и не были истреблены с лица земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ
  choice: меч
  rationale: 'Существительное передано без притяжательного местоимения: в геэзском тексте сказано «меч», а не «Его меч».'
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Естественно передаёт пространственное значение «посреди них / среди них».
- source_word: ቢጹ
  choice: своего ближнего
  rationale: Передаёт значение товарища, ближнего или соплеменника; в данном контексте обозначает взаимное убийство внутри одной группы.
- source_word: ዝንቱ ዘንተ
  choice: друг друга
  rationale: Русское взаимное местоимение естественно выражает буквальное «этот — того».
- source_word: ተደምሰሱ
  choice: были истреблены
  rationale: Сохраняет сильное значение полного уничтожения или стирания с земли.
theological_decisions:
- issue: Отнесение действия «послал» к Богу
  choice: Он
  alternative: он
  rationale: Контекст стиха подразумевает действие Бога; прописная буква соответствует русской библейской издательской традиции, не добавляя нового притяжательного смысла к слову «меч».
- issue: Характер посланного меча
  choice: послал среди них меч
  alternative: послал Свой меч среди них
  rationale: В исходном тексте нет притяжательного показателя, поэтому формулировка не превращает меч в явно принадлежащее Богу орудие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксис ясен для широкого читателя; сохранены причинно-целевая связь и последовательность взаимного убийства, падения от меча и полного истребления.
