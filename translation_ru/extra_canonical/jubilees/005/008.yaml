  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: ru
  text: 'И Он сказал: «Не будет Мой дух пребывать над человеком вечно, потому что и они — плоть; их дни будут составлять сто двадцать лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይነብር፡ መንፈስየ
  choice: Не будет Мой дух пребывать
  rationale: Глагол передаёт продолжительное пребывание; будущее отрицание сохранено без привнесения идеи суда сверх текста.
- source_word: ዲበ፡ ሰብእ
  choice: над человеком
  rationale: Предлог ዲበ буквально означает «на, над»; это чтение сохранено, а не гармонизировано с традиционным «в человеке» из Бытия 6:3.
- source_word: እሙንቱኒ፡ ሥጋ
  choice: и они — плоть
  rationale: Энклитика -ኒ передаёт значение «также, и»; местоимение во множественном числе сохранено, несмотря на собирательное единственное «человек» ранее.
- source_word: ወይኩን፡ መዋዕሊሆሙ
  choice: и пусть дней их будет
  rationale: Юссивная форма передана как установление или постановление, а не как простое предсказание.
- source_word: ምእት፡ ወዕሥራ፡ ዓመት
  choice: сто двадцать лет
  rationale: Числовое выражение переведено прямо.
theological_decisions:
- issue: Значение срока в сто двадцать лет
  choice: Сохранить без пояснения, относится ли срок к продолжительности человеческой жизни или ко времени до потопа
  alternative: Истолковать как предел долголетия либо как отсрочку до потопа
  rationale: Сам стих допускает оба известных прочтения и не разрешает неоднозначность явно.
- issue: Отношение духа к человеку
  choice: «над человеком»
  alternative: «в человеке»
  rationale: Формулировка следует конкретному эфиопскому предлогу и не подменяет его богословски привычным вариантом.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксическое напряжение между единственным «человеком» и множественным «они» намеренно сохранено как особенность источника.
