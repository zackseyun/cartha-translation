  source_fidelity: 'Смысл в целом передан точно: отрицательное будущее, предлог «над», добавочное значение энклитики -ни («и/также они»), множественное местоимение и срок в 120 лет сохранены. Однако русское «пусть дней их будет сто двадцать лет» неудачно передаёт формулу «их дни будут/составят 120 лет»: слово «дней» в такой конструкции требует иного синтаксиса.'
