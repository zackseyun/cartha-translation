  source_fidelity: 'Основной смысл передан точно: ሠርዐ последовательно отражено как «установлено / установленного», «небесные скрижали» соответствует ጽላተ ሰማይ, а ዐመፃ — «несправедливость». Однако союз ወ перед «все, кто…» означает простое «и», а не русское противительное «а»; его следует сохранить без изменения логической связи между частями.'
