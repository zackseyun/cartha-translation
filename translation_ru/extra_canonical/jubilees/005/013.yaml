  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: ru
  text: Всё это было установлено и записано на небесных скрижалях, и нет несправедливости; и все, кто отступил от пути, установленного для них, чтобы идти по нему, —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в следующем стихе.
    reason: Стих заканчивается незавершённой конструкцией; тире отмечает переход мысли через границу стихов, не предполагая утраты текста.
lexical_decisions:
- source_word: ሠርዐ (śarʿa)
  choice: «установлено» / «установленного»
  rationale: Один и тот же глагол употреблён в стихе дважды; повтор сохранён, чтобы передать лексическую связь оригинала. «Установить» здесь естественно выражает назначение или предписание порядка и пути.
- source_word: ጽላተ፡ ሰማይ (ṣallāta samāy)
  choice: «небесных скрижалях»
  rationale: Передаёт традиционный образ небесных табличек как письменного свидетельства; «скрижали» сохраняет достоинство и религиозно-литературный регистр.
- source_word: ዐመፃ (ʿamaṣā)
  choice: «несправедливости»
  rationale: Слово может обозначать неправду, беззаконие или несправедливость. В данном утверждении «нет несправедливости» сохраняет широкую нравственно-судебную семантику без лишнего уточнения.
- source_word: ተዐደዉ፡ እምፍኖተ (taʿaddawu ʾem-fənota)
  choice: «уклонился от пути»
  rationale: Глагол выражает отступление или переход за установленную границу. В сочетании с «путём» современное русское «уклониться от пути» звучит естественно и сохраняет нравственный образ оригинала.
theological_decisions:
- issue: Связь слов «нет несправедливости» с последующей фразой об уклонившихся
  choice: 'Разделить части точкой с запятой: «нет несправедливости; а все, кто…»'
  alternative: «нет несправедливости для всех, кто уклонился…»
  rationale: Перед «все» в геэзском стоит обычный соединительный союз ወ («и»); превращение его в «для» ошибочно связало бы отсутствие несправедливости с отступниками и внесло бы не выраженное в источнике богословское утверждение.
- issue: Незавершённость мысли в конце стиха
  choice: Сохранить синтаксический обрыв с тире
  alternative: Завершить фразу точкой
  rationale: Придаточная конструкция получает продолжение в следующем стихе. Тире показывает читателю, что мысль не окончена, не добавляя отсутствующих в данном стихе слов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Скрижали» сохранены как узнаваемый религиозно-литературный термин; остальная фраза построена просто и ясно. Лексический повтор ሠርዐ передан повтором «установлено / установленного».
