  yaml_path: translation/extra_canonical/jubilees/029/009.yaml
  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: ru
  text: «Груда свидетельства» — по этой груде.[a] Прежде землю Галаад называли землёй рефаимов,[b] потому что это была земля рефаимов. Там рождались рефаимы — исполины ростом в десять локтей, в девять локтей, в восемь локтей и вплоть до семи локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшем эфиопском тексте буквально: «Праздник [или: Радость] свидетельства — по этому празднику». Обычно здесь предполагают ошибку переписчика и восстанавливают «груда», поскольку выражение объясняет название Галаад как «Груда свидетельства» (ср. Быт. 31:47–48).'
    reason: textual_variant
  - marker: b
    text: В рукописном чтении при первом упоминании стоит форма, которую можно понять как «земля Рафаила»; дальнейшее пояснение дважды говорит о рефаимах, поэтому в основном тексте принято согласованное чтение «земля рефаимов».
    reason: textual_variant
lexical_decisions:
- source_word: ፍሥሐተ ... ፍሥሐት
  choice: «Груда свидетельства» — по этой груде
  rationale: Сохраняет предполагаемую этимологию Галаада (ср. Быт. 31:47–48). В дошедшем эфиопском тексте стоит «праздник/радость», однако это принято считать порчей чтения со значением «груда»; расхождение отмечено в сноске.
- source_word: ምድረ፡ ገለአድ
  choice: землю Галаад
  rationale: Современная русская форма традиционного библейского топонима; «земля» передаёт конструкцию оригинала без добавления политического значения.
- source_word: ረፋኤም / ራፋኤም
  choice: рефаимы
  rationale: Передаёт древнее название народа транслитерацией и не сводит его заранее только к описанию телосложения.
- source_word: ረዐይት
  choice: исполины
  rationale: По контексту это пояснение к рефаимам, за которым непосредственно перечисляется их необычайный рост; «исполины» звучит естественно и сохраняет древний колорит.
- source_word: በአመት
  choice: ростом ... локтей
  rationale: В данном числовом ряду эфиопское чтение буквально выглядит как «в год/лет», но контекст требует меры роста; перевод следует смыслу текстовой традиции, отражённому в критических переводах.
theological_decisions:
- issue: Соотношение рефаимов и исполинов
  choice: «рефаимы — исполины»
  alternative: Перевести имя «рефаимы» как «великаны» во всех случаях
  rationale: Транслитерация сохраняет историко-этническое название, а приложение «исполины» передаёт данную самим текстом характеристику, не отождествляя безоговорочно все употребления этого имени с одной поздней трактовкой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён для ясности, но повтор «земля рефаимов» сохранён как часть объяснения прежнего названия. Единица «локоть» оставлена как древняя мера; числовая нисходящая последовательность передана полностью.
