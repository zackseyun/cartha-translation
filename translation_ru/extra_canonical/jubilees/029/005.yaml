  to: земли Галаадской. И Иаков утаил от Лавана своё намерение и не сказал ему. В седьмой год четвёртой седмины[a] Иаков отправился в Галаад в двадцать первый день первого месяца; Лаван погнался за ним и настиг Иакова на горе Галаад в тринадцатый день третьего месяца.
