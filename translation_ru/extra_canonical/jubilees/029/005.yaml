  rationale: Передаёт направленное движение естественным современным русским языком без излишне буквального «повернул».
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ
  choice: Лаван погнался за ним
  rationale: Следует непосредственно эфиопскому тексту; не добавляет отсутствующее в источнике «услышал».
- source_word: በደብረ፡ ገላአድ
