lexical_decisions:
- source_word: ምድረ፡ ገለአድ
  choice: земли Галаадской
  rationale: Сохранён фрагментарный переход из предыдущего стиха и обычная русская форма топонима.
- source_word: ወኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
