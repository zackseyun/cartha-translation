  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: ru
  text: Авраама, своего отца, на горе Хеврон. И туда Иаков время от времени посылал своему отцу и своей матери всё необходимое; а они благословляли Иакова всем сердцем и всей душой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'ህየ
  choice: И туда
  rationale: Сохраняет выраженный в геэзском тексте указатель места, отсылающий к горе Хеврон.
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: время от времени
  rationale: Естественно передаёт повторяемость действия, выраженную исходной идиомой.
- source_word: ኵሎ፡ ትካዞሙ
  choice: всё необходимое
  rationale: Передаёт смысл обеспечения всех их нужд без неестественной буквальности.
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: всем сердцем и всей душой
  rationale: Сохраняет парную формулу полноты и её торжественное звучание.
