  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: ru
  text: На следующее утро он отправился в землю Галаадскую. Иаков перешёл Иавок в девятом месяце, в одиннадцатый день этого месяца[a]. В тот день к нему пришёл его брат Исав, и они примирились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст здесь повреждён. Вероятное чтение: «в одиннадцатый день этого месяца»; другое толкование: «в первый год десятой седмины».'
    reason: Сохраняет сведения о реальной текстовой неопределённости календарной формулы.
lexical_decisions:
- source_word: ምድረ፡ ጽባሕ
  choice: на следующее утро
  rationale: Передаёт временное указание естественным современным русским выражением.
- source_word: ምድረ፡ ገለአድ
  choice: в землю Галаадскую
  rationale: Сохраняет традиционное библейское географическое название и указание на область.
- source_word: ኢያቦክሃ
  choice: Иавок
  rationale: Использована укоренившаяся в русской библейской традиции форма названия реки.
- source_word: በታስዕ፡ ወርኅ
  choice: в девятом месяце
  rationale: Прямая передача календарного обозначения.
- source_word: አመ፡ ፲ሡሩ፡ ወአሚሩ
  choice: в одиннадцатый день этого месяца
  rationale: Контекстуально наиболее вероятное чтение повреждённой эфиопской формы; местоименная связь с девятым месяцем выражена явно для ясности.
- source_word: ወተኂነኖ
  choice: и они примирились
  rationale: Передаёт взаимное восстановление мирных отношений без добавления деталей, которых нет в тексте.
theological_decisions:
- issue: Характер встречи Иакова и Исава
  choice: они примирились
  alternative: они обнялись
  rationale: Выбрано более широкое значение восстановления мира, соответствующее контексту и консультационному переводу; конкретный жест не навязывается.
- issue: Неясная календарная формула
  choice: в одиннадцатый день этого месяца
  alternative: в первый год десятой седмины
  rationale: Основной текст следует наиболее вероятному восстановлению как дню месяца, а прежнее альтернативное понимание отмечено в сноске из-за повреждённости источника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, традиционные имена и географические названия сохранены.
