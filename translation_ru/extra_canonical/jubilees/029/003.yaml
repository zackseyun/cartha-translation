  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: ru
  text: 'Ибо он рассказал им всё, что видел во сне, и всё, что было сказано ему: что он должен возвратиться в дом своего отца. И сказал ему: «Иди во всякое место, куда бы ты ни пошёл».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте буквально: «Иди во всякое место, и куда бы ты ни пошёл». В некоторых реконструкциях по Быт. 31:3: «Иди… и Я буду с тобой».'
    reason: Необычная синтаксическая форма сохранившегося текста и известная текстологическая реконструкция требуют прозрачного пояснения.
lexical_decisions:
- source_word: ይግባእ
  choice: должен возвратиться
  rationale: Форма от ገብአ здесь означает возвращение; это также соответствует повествовательному контексту возвращения Иакова в дом отца.
- source_word: ቤተ አቡሁ
  choice: в дом своего отца
  rationale: Прямое и естественное соответствие геэзскому выражению.
- source_word: ሖውር
  choice: иди
  rationale: Императив движения передан обычной современной русской формой.
- source_word: ውስተ ኵሉ መካን
  choice: во всякое место
  rationale: Сохраняет универсальность исходного выражения и направленность движения.
- source_word: ወአይ ተሐውር
  choice: куда бы ты ни пошёл
  rationale: Передаёт сохранившийся геэзский текст без внесения реконструированной фразы «и Я буду с тобой».
theological_decisions:
- issue: Референт подлежащего в словах «И Он сказал ему»
  choice: Он (с прописной буквы)
  alternative: он (со строчной буквы)
  rationale: По контексту содержание сна восходит к Божьему повелению Иакову; прописная буква помогает обозначить вероятного говорящего, не добавляя имени в основной текст.
- issue: Текст после повеления «Иди»
  choice: перевести сохранившееся «куда бы ты ни пошёл»
  alternative: реконструировать «и Я буду с тобой» по Быт 31:3
  rationale: Издание геэзского текста содержит ወአይ ተሐውር; перевод должен отражать extant source и не подменять его вероятной реконструкцией.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «всё… и всё» сохранён как характерная повествовательная структура; синтаксис слегка упорядочен для ясности.
