  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: ru
  text: Он ушёл от него в землю Сеир, а Иаков жил в шатрах. В первый год пятой седмины этого юбилея Иаков перешёл Иордан и поселился за Иорданом. Он пас своих овец от Моря Нагромождений[a] до Бет-Шана, до Дотана и до…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Море Нагромождений» в эфиопском тексте неясно; за ним может стоять другой топоним.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድረ፡ ሴኢር
  choice: землю Сеир
  rationale: Передаёт географическое название и обычное значение ምድር «земля, страна» без лишнего уточнения.
- source_word: ኀደረ፡ በምጽላላት
  choice: жил в шатрах
  rationale: Естественная русская передача проживания в шатрах; множественное число исходного текста сохранено.
- source_word: ሱባዔ
  choice: седмины
  rationale: Здесь обозначен семилетний период внутри юбилейного счёта; «седмина» кратко и точно отличает его от обычной недели.
- source_word: ዐደወ፡ ዮርዳኖስ
  choice: перешёл Иордан
  rationale: Глагол означает переход или переправу; по-русски название реки употребляется здесь без предлога.
- source_word: ማዕዶተ፡ ዮርዳኖስ
  choice: за Иорданом
  rationale: Передаёт относительное обозначение противоположной стороны реки, не уточняя направление, которого исходный текст не задаёт.
- source_word: ባሕረ፡ ፌሐሐት
  choice: Моря Нагромождений
  rationale: Формально отражает эфиопское чтение как топоним, но его идентификация неуверенна и потому отмечена сноской.
- source_word: ቤተስን
  choice: Бет-Шана
  rationale: Современная и узнаваемая русская транслитерация топонима Beth-shan.
- source_word: ዶታኤም
  choice: Дотана
  rationale: Передача традиционно узнаваемой формы топонима Dothan в нужном русском падеже.
theological_decisions:
- issue: Субъект перехода через Иордан после противопоставления двух персонажей
  choice: Явно назван Иаков
  alternative: Сохранить местоименное «он»
  rationale: В исходном тексте субъект глагола формально не назван, однако ближайший явно названный деятель — Иаков; повтор имени в русском устраняет ложное отнесение к ушедшему в Сеир персонажу, не добавляя богословского толкования.
- issue: Незавершённое окончание стиха
  choice: Сохранено «и до…»
  alternative: Дополнить конечный пункт по последующему контексту или иной редакции
  rationale: Предоставленный эфиопский фрагмент заканчивается словами «и до», поэтому пропущенный объект не восстанавливается догадочно.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Термин «седмина» сохранён ради точного обозначения семилетнего цикла. Топонимы даны в узнаваемой русской форме. Незавершённость исходного фрагмента обозначена многоточием; маркер [a] поставлен непосредственно после спорного топонима.
