  text: And it came to pass, after Rachel had borne Joseph, that Laban went to shear his sheep, for he was a three days' journey away from him.
translation:
  language: ru
  text: После того как Рахиль родила Иосифа, Лаван пошёл стричь своих овец, потому что был в трёх днях пути от него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте здесь стоит местоимение «от него»; имя того, от кого Лаван находился на таком расстоянии, в самом стихе не названо.
    reason: Сохраняет неоднозначность местоименного референта исходного текста и не подставляет имя толковательно.
lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: После того как
  rationale: Передаёт временную конструкцию естественным современным русским языком без избыточного библеизма «и было».
- source_word: ይቅርጽ፡ አባግዒሁ፡
  choice: стричь своих овец
  rationale: Точно передаёт действие стрижки и притяжательный суффикс при слове «овцы».
- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት።
  choice: на расстоянии трёх дней пути
  rationale: Естественная русская формулировка меры расстояния через продолжительность пути.
theological_decisions:
- issue: Референт местоимения в выражении «от него»
  choice: Сохранено местоимение «от него» с примечанием
  alternative: 'Уточнить: «от Иакова»'
  rationale: Эфиопский текст содержит местоименный суффикс, но не называет референта в самом стихе; явное указание на Иакова устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Традиционные формы имён «Рахиль», «Иосиф» и «Лаван» сохранены; архаическое вводное «и было» опущено ради естественности.
