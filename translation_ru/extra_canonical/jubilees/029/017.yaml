lexical_decisions:
- source_word: ማኅፈደ
  choice: башня
  rationale: Слово обозначает башню; это также соответствует известному в контексте Книги Юбилеев месту, связанному с Авраамом. Перевод «пещера» здесь не принят.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодец Клятвы
  rationale: Передаёт составное название буквально и сохраняет его связь с клятвой, не подменяя его географическим именем.
- source_word: ጸዳይ፡ ወዝናም፡ ወማእከለ፡ ክረምት፡ ወሐጋይ
  choice: Весна, сезон дождей, середина зимы и лето
  rationale: Сохраняет необычное перечисление времён и сезонов источника, не пытаясь скрыто исправить или истолковать его.
