  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: ru
  text: И он жил там отдельно от своего сына Исава. Ибо в те дни, когда Иаков отправился в Месопотамию, Исав взял себе в жёны Махалафу, дочь Измаила, собрал весь скот своего отца и своих жён, поднялся на гору Сеир и поселился там, а своего отца Исаака оставил у Колодца Клятвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в Вирсавии; название «Вирсавия» связано со словами «колодец клятвы».
    reason: Поясняет смысл переведённого географического названия и его соответствие привычному библейскому топониму.
lexical_decisions:
- source_word: ኀደረ፡ ህየ፡ እምዓሳው፡ ወልዱ
  choice: жил там отдельно от своего сына Исава
  rationale: Предлог እም передаёт отделение или удаление; формулировка сохраняет смысл раздельного проживания и естественно звучит по-русски.
- source_word: መስጴጦምያ
  choice: Месопотамия
  rationale: Общепринятое современное русское географическое название.
- source_word: ብእሲተ፡ ማሕሌትሃ፡ ወሰተ፡ ይስማዔል
  choice: в жёны Махалафу, дочь Измаила
  rationale: Передаёт брачную конструкцию и родственную связь без ненужной буквальности.
- source_word: ኵሎ፡ መርዔተ፡ አቡሁ
  choice: весь скот своего отца
  rationale: መርዔት обозначает пасущийся домашний скот; «скот» точнее и шире, чем одни лишь «стада».
- source_word: ውስተ፡ ደብረ፡ ሴር
  choice: на гору Сеир
  rationale: Русская локативная норма требует «на» применительно к горе; сохранено название Сеир.
- source_word: ዐዘቅተ፡ መሐላ
  choice: у Колодца Клятвы
  rationale: Восстановлен засвидетельствованный конец стиха, отсутствующий в обрезанном фрагменте; название передано смысловым переводом.
