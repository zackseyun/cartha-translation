  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: ru
  text: ночью и рассказал Лавану об Иакове. А в пятнадцатый из тех дней Иаков устроил пир для Лавана и для всех, кто пришёл с ним. В тот день Иаков поклялся Лавану, а Лаван — Иакову, что ни один из них не перейдёт к другому со злым умыслом, на горе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ ... ግዝአ
  choice: устроил пир
  rationale: Сочетание передаёт приготовление или проведение угощения; «устроил пир» естественно и точно выражает смысл в данном повествовательном контексте.
- source_word: መሐለ
  choice: поклялся
  rationale: Глагол обозначает принесение клятвы; сохранена взаимность клятвы Иакова и Лавана.
- source_word: ኢይትዐደዉ አሐዱ ኀበ ካልኡ
  choice: ни один из них не перейдёт к другому
  rationale: Формулировка сохраняет буквальный пространственный образ взаимного перехода границы.
- source_word: በእኩይ
  choice: со злым умыслом
  rationale: Предлог с существительным/прилагательным зла здесь указывает на враждебную цель, а не просто на абстрактное зло.
- source_word: በደብረ
  choice: на горе
  rationale: Исходный фрагмент заканчивается словом «гора» без сохранившегося уточняющего названия; перевод не восполняет лакуну догадкой.
