  terminology: Имена сохранены в консервативной форме; «амореи», «рефаимы», «беззаконны» и «грешный» уместны. Сноску следует сохранить у конца перечня имён; её формулировку можно немного уточнить, назвав перечень перечнем царств, как в тексте.
