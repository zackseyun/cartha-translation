  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: ru
  text: Их царствами были Карнаим, Астарот, Едреи, Мисур и Беон[a]. Господь уничтожил их за злые дела, потому что они были крайне беззаконны, и поселил вместо них амореев — народ злой и грешный. До сего дня нет народа, который совершил все их грехи, а их уже нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые географические названия в этом перечне царств рефаимов не вполне ясны из-за особенностей эфиопской рукописной традиции; здесь дана консервативная транслитерация.
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: Их царствами
  rationale: Форма источника имеет множественное число; творительный оборот естественно вводит перечень царств или владений.
- source_word: ቃራናኤም፡ ወአስጠሮስ፡ ወአድራእ፡ ወሚሱር፡ ወቤዎን
  choice: Карнаим, Астарот, Едреи, Мисур и Беон
  rationale: Сохранена консервативная транслитерация трудных географических названий с учётом привычного русского библейского облика имён.
- source_word: ጸዋጋን፡ ጥቀ
  choice: крайне беззаконны
  rationale: Передаёт усилитель «весьма, чрезвычайно» и нравственно-правовой смысл определения без конфессионального уточнения.
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: и поселил вместо них амореев
  rationale: Естественно передаёт каузативный глагол проживания и выражение замещения.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: который совершил бы все их грехи
  rationale: Сохраняет буквальную идею «довести до конца / совершить» все их грехи, не вводя отсутствующего в источнике образа «полной меры».
- source_word: ወአልቦሙ
  choice: их же самих больше не существует
  rationale: Краткая эллиптическая концовка источника раскрыта по-русски как утверждение об их отсутствии или прекращении существования.
theological_decisions:
- issue: Смысл утверждения о народе, совершившем все их грехи
  choice: «нет народа, который совершил бы все их грехи»
  alternative: «нет народа, который достиг бы полной меры их грехов»
  rationale: Выбран вариант, наиболее непосредственно соответствующий глаголу «завершить/совершить» и слову «все», без добавления богословского образа меры греха.
- issue: Отнесение характеристики «злой и грешный»
  choice: к амореям как к народу
  alternative: к предыдущему населению или к подразумеваемому деянию
  rationale: Синтаксическая близость характеристики к «амореям» поддерживает приложение «народ злой и грешный», хотя резкий переход намеренно не сглажен дополнительным объяснением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены суровая оценочная лексика, последовательность исходных утверждений и неоднозначная формула о «совершении всех их грехов».
