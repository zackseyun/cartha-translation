  rationale: В данном контексте слово обозначает праздничное пиршество; «пир» естественно передаёт смысл без излишнего уточнения.
- source_word: ለስምዐ
  choice: в свидетельство
  rationale: Сохраняет значение свидетельства или памятного знака и не сужает его до конкретного юридического смысла.
- source_word: መካን
