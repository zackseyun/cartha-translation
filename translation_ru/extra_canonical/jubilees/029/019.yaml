lexical_decisions:
- source_word: ዐዘቅተ፡ መሐላ፡
  choice: Колодец Клятвы
  rationale: Передаёт составное геэзское наименование буквально и сохраняет его связь с традиционным названием Вирсавии, не подменяя исходную форму готовым топонимом.
- source_word: ባሕቲቶ
  choice: один лишь
  rationale: Сохраняет ограничительно-усилительное значение формы и согласуется с мужским родом слова «колодец».
- source_word: ዐርገ
  choice: поднялся
  rationale: Передаёт основное пространственное значение глагола «подниматься, восходить», не сглаживая его до общего «ушёл».
- source_word: ኀደረ
  choice: поселился
  rationale: В данном повествовательном контексте глагол означает пребывание или обитание; «поселился» звучит естественно и не добавляет временного ограничения.
- source_word: ማኅፈደ
  choice: в башне
  rationale: Это форма сопряжённого состояния общего существительного «башня», а не имя собственное; зависимое слово находится в продолжении за границей стиха.
