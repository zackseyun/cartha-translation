  text: And the Lord did not allow him to devise harm against Jacob, because he had appeared to him in a dream.
translation:
  language: ru
  text: И Господь не позволил ему замыслить зло против Иакова, потому что явился ему во сне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢኀደጎ፡ እግዚአብሔር
  choice: И Господь не позволил ему
  rationale: Отрицательная конструкция с глаголом «оставлять, допускать» естественно передаётся по-русски как «не позволил».
- source_word: ከመ፡ ይሕስም፡ ላዕለ፡ ያዕቆብ
  choice: замыслить зло против Иакова
  rationale: Глагол выражает намерение причинить вред; «замыслить зло» сохраняет как внутренний умысел, так и враждебную направленность действия.
- source_word: እስመ፡ አስተረአዮ፡ በሕልም
  choice: потому что явился ему во сне
  rationale: እስመ передаёт причинную связь, а форма явления указывает на предшествующее Божественное явление во сне; русская форма совершенного вида ясно выражает эту предшествующую причину.
theological_decisions:
- issue: Кто явился во сне
  choice: Сохранён субъект «Господь», подразумеваемый ближайшим явно названным субъектом.
  alternative: Понять местоименный субъект как иное, не названное в стихе лицо.
  rationale: Грамматическая последовательность и контекст английского контрольного слоя поддерживают отнесение явления к Господу, без добавления отсутствующего в исходном тексте имени.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный, без архаизмов. Местоимение «ему» сохраняет контекстуальную референцию исходного стиха.
