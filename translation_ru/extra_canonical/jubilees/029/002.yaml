  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: ru
  text: Иаков увидел, что Лаван ушёл стричь своих овец. Тогда Иаков позвал Лию и Рахиль и поговорил с ними по душам[a], чтобы они пошли с ним в землю Ханаан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил в их сердце» — то есть говорил задушевно, стараясь убедить их.'
    reason: Сноска сохраняет образ и убеждающий оттенок геэзского идиоматического выражения, тогда как основной текст передаёт его естественным современным русским оборотом.
lexical_decisions:
- source_word: የሐውር፡ ላባ፡ ይቅርጽ፡ አባግዒሁ
  choice: Лаван ушёл стричь своих овец
  rationale: Передаёт движение с целью, выраженное формами «ушёл» и «стричь», естественным современным русским синтаксисом.
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: говорил к их сердцу
  rationale: Сохраняет явно выраженный образ «в/к их сердцу» и его оттенок задушевного, убеждающего обращения, не сводя выражение к нейтральному «говорил с ними».
- source_word: ከመ፡ ይምጽኣ፡ ምስ ሌሁ
  choice: чтобы они пошли с ним
  rationale: В контексте ухода в Ханаан русское «пошли с ним» естественно выражает приглашение сопровождать Иакова.
- source_word: ምድረ፡ ከናአን
  choice: землю Ханаанскую
  rationale: Достоинная и привычная русская библейская форма географического обозначения, точно соответствующая «земле Ханаан».
