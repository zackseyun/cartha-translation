translation:
  language: ru
  text: …жизни на земле.[a] Иаков отпустил Лавана, и тот ушёл в Месопотамию, в землю востока; а Иаков возвратился в землю Галаадскую. В девятый месяц, в одиннадцатый день месяца, он перешёл Иавок. В тот день к нему пришёл его брат Исав и примирился с ним.
