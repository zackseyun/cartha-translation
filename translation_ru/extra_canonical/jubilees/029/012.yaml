  rationale: Сохранена традиционная русская библейская форма топонима и исходная конструкция со словом «земля».
theological_decisions:
- issue: Смысл начальной фразы о жизни на земле
  choice: Сохранён фрагмент «…жизни на земле» с примечанием
  alternative: «На земле для них уже не осталось жизни»
  rationale: Стих начинается в середине предложения, а текст допускает различное понимание того, отрицается ли продолжение жизни или говорится об отсутствии оставшейся доли жизни; основной текст не устраняет эту неоднозначность.
- issue: Характер встречи Исава и Иакова
  choice: «примирился с ним»
  alternative: «они примирились»
  rationale: Сохранена направленность исходной формулировки, где примирение грамматически относится к Исаву, без расширения до явно взаимного действия.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими формами имён и топонимов. Многоточие в начале показывает, что стих продолжает предложение из предыдущего контекста; синтаксис далее сделан ясным и естественным без устранения смысловой неоднозначности.
