  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: ru
  text: И благословил Иаков Бога Исаака, своего отца, и Бога Авраама, отца своего отца. Затем он встал, посадил своих жён и детей на животных, взял всё своё имущество, перешёл реку и прибыл.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Место назначения в исходном тексте не названо: буквально «и прибыл».'
    reason: Уточняет намеренно незавершённую формулировку стиха и предохраняет от добавления отсутствующего пункта назначения.
lexical_decisions:
- source_word: ባረኮ
  choice: благословил
  rationale: Прямое и естественное соответствие глаголу «благословлять»; необычный объект — Бог — сохранён без истолкования.
- source_word: አበ፡ አቡሁ
  choice: отца своего отца
  rationale: Сохраняет явную родословную формулировку источника, не заменяя её более привычным «деда».
- source_word: ጸዐ
  choice: посадил ... на вьючных животных
  rationale: Передаёт действие погрузки или размещения жён и детей на животных; объект подразумевается по смыслу и параллели с Быт. 31:17.
- source_word: ጥሪተ
  choice: имущество
  rationale: В данном контексте обозначает совокупность собственности и пожитков Иакова.
- source_word: ፈለገ
  choice: реку
  rationale: Нарицательное обозначение водного потока; прописная буква не вводится, поскольку собственное имя в источнике не выражено.
- source_word: በጽሐ
  choice: прибыл
  rationale: Глагол не называет место назначения, поэтому перевод также оставлен без дополнения.
theological_decisions:
- issue: Иаков благословляет Бога
  choice: 'сохранить буквальную направленность действия: «благословил ... Бога»'
  alternative: «прославил Бога» или «возблагодарил Бога»
  rationale: Источник допускает и прямо выражает благословение Бога человеком; замена сняла бы библейское богословское напряжение.
- issue: Бог Исаака и Бог Авраама
  choice: сохранить две координированные формулы
  alternative: объединить в «Бога своих предков»
  rationale: Развёрнутая формула источника важна для связи поколений и не должна обобщаться.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён до естественного повествования, но родословная формула и отсутствие названного места прибытия сохранены. Выражение «вьючные животные» конкретизирует подразумеваемых ездовых/грузовых животных без неоправданного сведения только к верблюдам.
