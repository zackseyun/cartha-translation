lexical_decisions:
- source_word: ስቴ
  choice: питьё
  rationale: Передаёт общее значение напитка в перечне даров; исходная форма допускает понимание как питья/напитка.
- source_word: ኅብስተ፡ ሐሊብ
  choice: сыр
  rationale: Буквально «хлеб молока»; в контексте перечня молочных продуктов это естественное обозначение сыра, при этом буквальный образ сохранён в сноске.
- source_word: ትመርት፡ ቍላ
  choice: плоды низменности
  rationale: Сочетание, вероятно, обозначает продукты или плоды низменной местности; более конкретное «финики долины» возможно, но не бесспорно по данной форме.
- source_word: ለአውራኅ
  choice: месячных
  rationale: Форма относится к месяцам, а не к путям; перевод следует исправлению, основанному на языке источника.
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: между пахотой и жатвой
  rationale: Конструкция «между … и …» и значения двух сельскохозяйственных терминов требуют именно такого противопоставления.
