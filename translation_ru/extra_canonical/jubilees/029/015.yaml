  text: at the time of autumn. And he sent to his father Isaac from all his possessions clothing and food, meat.
translation:
  language: ru
  text: осенью. И он послал своему отцу Исааку из всего, чем владел, одежду и пищу — мясо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: осенью
  rationale: Оборот обозначает время осени и завершает сезонный перечень предыдущего стиха; краткое наречное выражение естественно передаёт его по-русски.
- source_word: ወይፌኑ
  choice: И он послал
  rationale: Форма глагола означает отправление или посылку, а не принесение.
- source_word: እምኵሉ፡ ጥሪቱ
  choice: из всего, чем владел
  rationale: Передаёт смысл «из всего его имущества/достояния» естественным современным русским оборотом.
- source_word: ልብሰ
  choice: одежду
  rationale: Прямое соответствие значению «одежда, одеяние».
- source_word: ወሲሲተ፡ ሥጋ
  choice: и пищу — мясо
  rationale: ሲሲት означает пищу или припасы, а ሥጋ — мясо; тире сохраняет приложение и не превращает выражение в не засвидетельствованные «первые плоды мяса».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; строчная буква в начале сохранена, поскольку фраза «осенью» синтаксически завершает перечень предыдущего стиха. Формулировка лаконична и не сглаживает несколько рубленое приложение «пищу — мясо».
