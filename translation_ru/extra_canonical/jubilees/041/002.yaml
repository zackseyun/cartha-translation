  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: ru
  text: Своему первенцу Эру он взял жену из дочерей Арама; звали её Фамарь. Но Эр возненавидел её и не ложился с ней, потому что его мать была из дочерей Ханаана, а он хотел взять себе жену из рода своей матери.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸልአ
  choice: возненавидел
  rationale: Глагол означает «ненавидеть, испытывать неприязнь»; этот вариант точнее передаёт сильное значение оригинала, чем более мягкое «отверг».
- source_word: ኢሰከበ፡ ምስሌሃ
  choice: не ложился с ней
  rationale: Сохранён телесный эвфемизм оригинала без излишней натуралистичности; в контексте ясно подразумеваются супружеские отношения.
- source_word: እምነገደ፡ እሙ
  choice: из рода своей матери
  rationale: «Род» естественно по-русски передаёт принадлежность к племени или родственной группе и не сужает значение до ближайших родственников.
- source_word: ብእሲተ
  choice: жену
  rationale: В брачном контексте существительное «женщина» естественно и точно передаётся как «жена».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Имя ትዕማር передано в традиционной русской библейской форме «Фамарь», а ከናአን — как «Ханаан». Во втором предложении имя «Эр» названо явно, чтобы по-русски устранить неестественную цепочку двусмысленных местоимений; по контексту именно он ненавидит Фамарь, не ложится с ней и желает жену из рода своей матери.
