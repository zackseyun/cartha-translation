  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: ru
  text: 'Иуда сказал Онану, брату Ира[a]: «Войди к жене своего брата, исполни по отношению к ней долг деверя и воздвигни потомство своему брату».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Онану, его брату». По контексту имеется в виду, что Онан был братом умершего Ира.'
    reason: Уточняет неоднозначный местоименный референт оригинала и предотвращает ошибочное понимание, будто Онан назван братом Иуды.
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ፡
  choice: «Войди к жене своего брата»
  rationale: Сохраняет эвфемистическое выражение оригинала о супружеской близости; современное русское «войди к» здесь понятно в библейском регистре и не делает неявное грубо явным.
- source_word: ወረከያ፡ ናዕልተ፡
  choice: «исполни перед ней долг деверя»
  rationale: Передаёт обязанность брата умершего вступить в левиратный союз с вдовой. «Долг деверя» точнее и естественнее, чем буквальная, но неясная калька.
- source_word: ወአንሥእ፡
  choice: «и воздвигни потомство»
  rationale: Глагол буквально выражает поднятие/воздвижение; объект подразумевается контекстом левирата. «Потомство» восполняет его без сужения до одного сына.
theological_decisions:
- issue: Кому должно быть приписано потомство от левиратного союза
  choice: «своему брату»
  alternative: «воздвигни потомство» без указания получателя
  rationale: Контекст и устойчивый смысл левиратной обязанности требуют связи потомства с умершим братом; это не вводит особого конфессионального толкования.
- issue: Референт выражения እኁሁ («его брат»)
  choice: «брату Ира» с текстовой сноской
  alternative: «его брату» или «своему брату»
  rationale: Буквальное русское местоимение создало бы ложное впечатление, будто Онан — брат Иуды. Контекст указывает на Ира, однако неоднозначность формы оригинала отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Эвфемизм «войди к жене» и выражение «воздвигни потомство» сохраняют образность и этическую сдержанность исходного текста; специальный термин пояснён самим сочетанием «долг деверя».
