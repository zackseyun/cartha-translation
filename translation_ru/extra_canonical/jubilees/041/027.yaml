  yaml_path: translation/extra_canonical/jubilees/041/027.yaml
  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: ru
  text: И этим он отвратит от Израиля гнев и кару. И мы сказали[a] Иуде, что оба его сына не ложились с ней; поэтому его потомство утвердилось для другого колена и не было искоренено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуде было сказано».'
    reason: Отмечает возможную безличную передачу конструкции; основной текст сохраняет первое лицо множественного числа, засвидетельствованное в источнике и существенное для повествовательной рамки.
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: Так
  rationale: Передаёт причинно-средственное значение «этим / благодаря этому» естественно для русского связного повествования.
- source_word: መዐተ፡ መመቅሠፍተ
  choice: гнев и кару
  rationale: 'Сохраняет два отдельных понятия источника: гнев и последующее наказание, без избыточного уточнения его формы.'
- source_word: ኢበከቡ፡ ምስሌነ
  choice: не ложились с ней
  rationale: Прямое и понятное обозначение половой связи, соответствующее библейскому регистру и не смягчающее смысл.
- source_word: ዘርአ
  choice: потомство
  rationale: В контексте продолжения рода это естественнее русского «семя», сохраняя династический смысл.
- source_word: ለካልእ፡ ነገደ
  choice: для другого колена
  rationale: Сохраняет необычную формулировку источника и его племенной контекст, не пытаясь истолковать, какое именно колено имеется в виду.
- source_word: ወኢይሤረወ
  choice: и не было искоренено
  rationale: Воспроизводит метафору уничтожения рода через искоренение и согласуется с собирательным «потомство».
theological_decisions:
- issue: Кто сообщает Иуде о его сыновьях
  choice: мы сказали Иуде
  alternative: Иуде было сказано
  rationale: Форма первого лица множественного числа сохраняет повествовательную рамку книги, где ангельский говорящий может употреблять «мы»; безличный пассив скрыл бы эту особенность.
- issue: Причинная связь с отвращением кары
  choice: Так он отвратит
  alternative: И этим будет отвращён
  rationale: Сохранены и причинно-средственное значение начальной фразы, и личная форма сказуемого; действующее лицо не уточняется сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан ясным для широкого читателя; необычное «для другого колена» сохранено как смысловая напряжённость источника.
