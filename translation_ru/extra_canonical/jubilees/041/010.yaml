  text: And she sat at the entrance that is on the road to Timnah. And as Judah was going, he found her.
translation:
  language: ru
  text: И она села у входа, который находился на дороге в Тимну. И, когда Иуда шёл, он нашёл её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встретил её».'
    reason: Геэзское ረከበ обычно означает «нашёл»; в данном дорожном контексте возможно также «встретил её». Сноска сохраняет эту менее прямую, но допустимую передачу без подмены основного значения.
lexical_decisions:
- source_word: ወነበረት
  choice: И она села
  rationale: Форма глагола ነበረ в данном повествовательном контексте обозначает, что она заняла место и сидела; это точнее, чем нейтральное «осталась».
- source_word: ውስተ፡ አንቀጽ
  choice: у входа
  rationale: Передаёт местонахождение у входа или прохода естественным современным русским выражением.
- source_word: እንተ፡ መንገሰ፡ ፍኖተ፡ ቴምናታ
  choice: который находится на дороге в Тимну
  rationale: Сохраняет относительную конструкцию и направление дороги к Тимне.
- source_word: ወእንዘ፡ የሐውር፡ ይሁዳ
  choice: Когда Иуда проходил там
  rationale: Естественно передаёт одновременность действия; «там» уточняет контекст движения, не меняя событийной логики.
- source_word: ረከባ
  choice: он увидел её
  rationale: Глагол может означать «найти», «встретить», «обнаружить/увидеть». В дорожном контексте «увидел её» естественно передаёт, что Иуда наткнулся на неё, не предполагая намеренного поиска.
