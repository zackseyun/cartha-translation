  naturalness: Текст читается естественно, однако «Когда Иуда проходил там» добавляет обстоятельство и несколько ослабляет простое повествовательное «когда Иуда шёл». Исправленный вариант остаётся современным литературным и плавным.
  terminology: «Иуда» и «Тимна» переданы последовательно. Богословски нагруженных терминов в стихе нет. Сноску следует привязать к «нашёл её», а не использовать её для оправдания основного варианта «увидел её».
