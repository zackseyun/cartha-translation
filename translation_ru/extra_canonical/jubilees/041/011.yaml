  text: And he thought her to be a prostitute and said to her, “Let me come in to you,” and she said to him, “Come,” and he went in. And she said to him,
translation:
  language: ru
  text: 'И он принял её за блудницу и сказал ей: «Позволь мне войти к тебе»[a]. Она сказала ему: «Войди», — и он вошёл. И она сказала ему:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дай мне войти к тебе».'
    reason: Смысл формы допускает близкие русские способы передачи просьбы или позволения; примечание показывает альтернативу без изменения лица и направления действия.
lexical_decisions:
- source_word: ወተሐዘባ፡ ከመ፡ ዘማዊት፡
  choice: И он принял её за блудницу
  rationale: Глагол ተሐዘበ передаёт мысль или предположение, а не верное узнавание; «принял её за» естественно выражает ошибочное заключение в данном контексте.
- source_word: እባእ፡ ኀቤኪ፡
  choice: Позволь мне войти к тебе
  rationale: Форма первого лица выражает просьбу/волеизъявление говорящего («пусть/позволь мне войти»), направленное к женщине, а не повеление ей прийти к нему. Русское «войти к тебе» сохраняет сексуальный эвфемизм исходного выражения.
- source_word: ባእ፡
  choice: Войди
  rationale: Ответ женщины передан кратким повелением, соответствующим исходному глаголу и непосредственно перекликающимся с просьбой мужчины.
- source_word: ወቦአ።
  choice: и он вошёл
  rationale: Сохранена лаконичная последовательность повествования и тот же эвфемистический глагол.
theological_decisions:
- issue: Характер определения женщины как блудницы
  choice: принял её за блудницу
  alternative: узнал в ней блудницу
  rationale: Исходный текст описывает ошибочное предположение героя, а не достоверное распознавание личности или действительного положения женщины.
- issue: Сексуальный смысл глагола «войти»
  choice: сохранить эвфемизм «войти к тебе»
  alternative: эксплицировать как «лечь с тобой»
  rationale: Буквально-эвфемистическая формулировка сохраняет образность и сдержанность источника, не устраняя его подразумеваемого смысла.
translation_notes:
  register: Современный литературный русский с библейской сдержанностью. Сохранены цепочка кратких реплик, повтор глагола «войти» и незавершённость последней фразы, переходящей в следующий стих.
