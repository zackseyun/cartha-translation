  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: ru
  text: Ибо он, по невинности своих глаз[a], искал суда, ибо по суду Авраама[b], который тот заповедал своим сыновьям, Иуда хотел, чтобы её сожгли огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в простоте своих глаз».'
    reason: Слово передаёт простоту, невинность или незлобие; образ «глаз» сохранён в основном тексте.
  - marker: b
    text: 'Или: «от суда Авраама».'
    reason: 'Предлог буквально может означать «от»; в контексте он также допускает значение основания: «по суду».'
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: в простоте сердца
  rationale: Буквально выражение связано с «простотой/невинностью его глаз». Русское «в простоте сердца» естественно передаёт нравственную невиновность и чистоту намерения, не смешивая это с желанием.
- source_word: ኀሠሠ፡ ኵነኔ
  choice: потребовал суда
  rationale: Передаёт активное обращение к судебному решению или наказанию; «искал суда» по-русски здесь менее естественно.
- source_word: እምፍተሐ፡ አብርሃም
  choice: согласно установлению Авраама
  rationale: Предлог буквально допускает «от», однако в юридическом контексте выражение указывает на основание решения. «Установление» естественно сочетается с последующим указанием, что Авраам заповедал это сыновьям.
- source_word: ፈቃደ፡ ይሁዳ
  choice: Иуда хотел
  rationale: Сохраняет прямое значение воления или желания, не усиливая его до вынесенного приговора.
- source_word: ይውዐይ፡ በእሳት
  choice: чтобы её сожгли в огне
  rationale: Передаёт пассивную форму и сохраняет явное упоминание огня исходного текста.
theological_decisions:
- issue: Нравственная оценка действий Иуды
  choice: в простоте сердца
  alternative: следуя желанию своих глаз
  rationale: Слово የውሀተ означает простоту, невинность или незлобие. Перевод через «желание» изменил бы смысл и представил бы поступок как продиктованный влечением.
- issue: Основание требования Иуды
  choice: согласно установлению Авраама
  alternative: от суда Авраама
  rationale: Выбранная формулировка показывает, что Иуда опирался на переданное Авраамом правовое установление, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; местоимение «тот» устраняет двусмысленность относительно того, кто дал заповедь.
