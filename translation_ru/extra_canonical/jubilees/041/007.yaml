base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: ru
  text: «Оставайся вдовой, пока не вырастет мой сын Шела, и я отдам тебя ему в жёны». Он вырос, но Бедсуэл, жена Иуды, не позволила своему сыну Шеле жениться, и Бед[суэл] умерла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сохранившемся тексте имя в конце стиха обрывается после «Бед»; недостающая часть имени восстановлена по его предыдущему упоминанию.
    reason: textual_truncation
lexical_decisions:
- source_word: ትመዐስቢ
  choice: оставайся вдовой
  rationale: Форма обозначает пребывание во вдовстве, а не просто ожидание; это сохраняет юридический и повествовательный оттенок.
- source_word: ሴሎም
  choice: Шела
  rationale: Передача имени в привычной русской библейской форме.
- source_word: ወልህቀ
  choice: Он вырос
  rationale: Явно передаёт присутствующее в источнике звено повествования, ранее пропускавшееся.
- source_word: ወኢኀደገት
  choice: не позволила
  rationale: По контексту выражает воспрепятствование браку Шелы.
- source_word: ቤድ
  choice: Бед[суэл]
  rationale: Сохраняет засвидетельствованное усечённое чтение, а редакционное восполнение имени отмечает квадратными скобками.
theological_decisions:
- issue: Кто препятствовал браку Шелы
  choice: Бедсуэл, жена Иуды
  alternative: сам Иуда
  rationale: Грамматика данного геэзского текста называет субъектом Бедсуэл; не следует гармонизировать этот вариант с иной традицией повествования.
- issue: Смысл пребывания Фамари до взросления Шелы
  choice: оставаться вдовой
  alternative: просто ждать
  rationale: Более конкретное чтение непосредственно поддерживается исходным словом и сохраняет социально-правовую напряжённость рассказа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности, но последовательность событий и необычное указание на жену Иуды как препятствующую браку сохранены. Маркер примечания помещён непосредственно после восстановленного имени в конце стиха.
