  text: And Judah his father forbade him. And Er, Judah’s firstborn, was evil, and the LORD put him to death.
translation:
  language: ru
  text: Иуда, его отец, удержал его[a]. А Ир, первенец Иуды, был злым, и Господь умертвил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспрепятствовал ему»; возможно также: «запретил ему». Дополнение, в чём именно состояло удержание или запрещение, в стихе не выражено.'
    reason: Геэзский глагол допускает значения удерживать, препятствовать и запрещать; сноска сохраняет эту неопределённость, не добавляя невыраженного действия.
lexical_decisions:
- source_word: አሕበሶ (ʾaḥabaso)
  choice: запретил ему
  rationale: Каузативная форма от ሐበሰ передаёт воспрепятствование, удержание или запрет. «Запретил ему» естественно выражает смысл в данном контексте, не подменяя его значением «упрекнул».
- source_word: እኩይ (ʾəkuy)
  choice: был злым
  rationale: Прямо сохраняет нравственную оценку исходного прилагательного, не добавляя отсутствующей в стихе формулы «в глазах Господа».
- source_word: ወቀተሎ (wa-qatalo)
  choice: и Господь умертвил его
  rationale: 'Передаёт прямое каузативно-деятельное утверждение текста: Господь предал Ира смерти.'
theological_decisions:
- issue: Прямая причинность смерти Ира
  choice: Господь умертвил его
  alternative: Господь допустил его смерть
  rationale: Исходный текст прямо называет Господа действующим лицом глагола «убил/умертвил»; смягчение до дозволения устранило бы богословское напряжение текста.
- issue: Характеристика Ира
  choice: был злым
  alternative: творил зло перед Господом
  rationale: В исходном стихе стоит краткое прилагательное без уточнения «перед Господом» и без глагола действия, поэтому эти элементы не добавлены.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксическая краткость оригинала сохранена; эллиптическое «запретил ему» не дополнено догадкой о содержании запрета.
