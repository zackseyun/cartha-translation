- source_word: ሱባዔ
  choice: седмину
  rationale: Обозначает семилетний период внутри юбилея; «седмина» точнее обычного «неделя» в данном хронологическом контексте.
- source_word: ነሥአ
  choice: взял
  rationale: Буквально передаёт глагол «брать» и сохраняет незавершённость фрагмента, не уточняя подразумеваемый объект.
- source_word: ይሁዳ
  choice: Иуда
  rationale: Устоявшаяся русская форма библейского имени.
