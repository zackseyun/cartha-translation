translation:
  language: ru
  text: '…Господь умертвил его. Иуда сказал Фамари, своей невестке: «Оставайся в доме своего отца, пока…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычное современное русское соответствие эфиопскому божественному титулу; начальное многоточие показывает, что предоставленный фрагмент начинается внутри предложения.
- source_word: ወቀተሎ
  choice: и Он умертвил его
  rationale: Передаёт каузативно-результативный смысл «предал смерти / умертвил» и сохраняет Господа как действующее лицо.
- source_word: ለትዕማር፡ መርዓቱ
  choice: Фамари, своей невестке
  rationale: Имя передано в традиционной русской библейской форме; родственное обозначение выражено естественно и однозначно.
- source_word: ንበሪ፡ ቤተ፡ አቡኪ
  choice: Оставайся в доме своего отца
  rationale: Женская форма повеления сохранена; формулировка звучит естественно в современном литературном русском.
- source_word: እንዘ
  choice: пока…
  rationale: Союз открывает зависимую конструкцию, однако предоставленный исходный текст на нём обрывается; многоточие сохраняет незавершённость и не добавляет отсутствующий материал.
theological_decisions:
- issue: Божественное действие как непосредственная причина смерти
  choice: Он умертвил его
  alternative: он умер
  rationale: Исходный текст прямо представляет Господа действующим лицом; пассивная или безличная передача ослабила бы это богословски значимое утверждение.
- issue: Регистр божественного титула
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В эфиопском тексте нет типографического различения, соответствующего английскому LORD; обычная русская форма сохраняет титул, не привнося дополнительной интерпретации.
