  register: 'Современный литературный русский с традиционными библейскими именами и сдержанным повествовательным регистром. Переведён только предоставленный эфиопский фрагмент: начальное и конечное многоточия обозначают обрыв исходного сегмента, а отсутствующее продолжение стиха не восстанавливается.'
