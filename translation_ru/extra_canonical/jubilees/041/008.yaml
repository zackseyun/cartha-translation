  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: ru
  text: 'В пятый год этого семилетия умерла Суэл, жена Иуды. В шестой год Иуда поднялся в Тимну стричь своих овец. Тамар сказали: «Вот, твой свёкор поднимается в Тимну на стрижку».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱኤል
  choice: Суэл
  rationale: Имя передано транслитерацией непосредственно по представленному эфиопскому тексту, без замены на форму «Шуа» из английского консультационного слоя.
- source_word: ዘዝሱባዔ
  choice: этого семилетия
  rationale: Сочетание указывает на текущую семилетнюю единицу времени — «этого семилетия», а не на «седьмое семилетие». «Семилетие» яснее современному читателю, чем буквальная «неделя», поскольку речь идёт о счёте лет.
- source_word: ዐርገ
  choice: поднялся / поднимается
  rationale: Сохранено пространственное значение глагола «восходить, подниматься», присутствующее в источнике.
- source_word: ይቅርጽ አባግዒሁ
  choice: стричь своих овец
  rationale: Первое употребление прямо называет овец и передано полностью.
- source_word: ይቅርጽ
  choice: на стрижку
  rationale: В заключительной реплике источник не повторяет слово «овцы»; русское «на стрижку» естественно передаёт подразумеваемое действие, не добавляя повторения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Имена Тамар и Тимна переданы в формах, близких к исходным; хронологическая «седмица» выражена понятным словом «семилетие». Неподтверждённое источником чтение «седьмого семилетия» не внесено ни в текст, ни в примечание.
