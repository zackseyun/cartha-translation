lexical_decisions:
- source_word: ዘርአ
  choice: потомство / семя
  rationale: Одно и то же геэзское слово в контексте обозначает сначала потомство, а затем изливаемое семя; разные русские соответствия сохраняют естественный смысл в каждом употреблении.
- source_word: ወቦአ፡ ቤተ፡ ብእሲተ፡ እኁሁ
  choice: и когда он вошёл к жене своего брата
  rationale: Естественная русская передача эвфемистического выражения о вступлении в половую связь без излишней конкретизации.
- source_word: ወእኩየ፡ ኮነ፡ በቅድመ፡ አዕይንተ
  choice: И это было злом в глазах
  rationale: Формулировка следует обрывающемуся исходному фрагменту и не восполняет отсутствующий объект от себя.
theological_decisions:
- issue: Чья собственность или родовая принадлежность приписывается потомству
  choice: потомство будет не его, а его брата
  alternative: потомство не будет считаться его
  rationale: Прямая формулировка сохраняет противопоставление текста и не добавляет юридического объяснения.
- issue: Незавершённость последней фразы
  choice: сохранить обрыв с многоточием и пояснить сноской
  alternative: дополнить «Господа» по параллельной традиции
  rationale: Предоставленный геэзский источник заканчивается словом «глаз» во множественном числе; дополнение отсутствующего имени означало бы молчаливую реконструкцию текста.
translation_notes:
  register: Современный литературный русский с сохранением библейской сдержанности. Начало и конец фрагментарны, что обозначено кавычкой с многоточием в начале и многоточием со сноской в конце.
