lexical_decisions:
- source_word: አባግዒሁ፡ በቴምናታ
  choice: его овец в Фамне
  rationale: Сохраняет обрывочный конец предшествующей фразы в предоставленном фрагменте; топоним передан в форме «Фамна», привычной для русской библейской традиции.
- source_word: ወአንበረች፡ አልባሰ፡ ምዕስብናሃ
  choice: Она сняла с себя одежды вдовства
  rationale: Передаёт действие снятия/отложения и буквально сохраняет образ особой одежды, обозначающей вдовство.
- source_word: ወለብሰት፡ ገልባቤ
  choice: надела покрывало
  rationale: Глагол означает облачение, а существительное — покрывало или вуаль; нейтральное «покрывало» не уточняет способ ношения сверх источника.
- source_word: ወተሣየየት
  choice: и украсила себя
  rationale: Возвратная форма естественно передаётся как действие, направленное на собственный внешний вид.
