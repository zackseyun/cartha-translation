base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: ru
  text: '«Отдай нам[a] людей, которых ты спас, а имущество пусть останется тебе». Аврам ответил ему: «Я поднял руки к Богу Всевышнему: ни нитки, ни ремешка от сандалии — ничего из всего, что принадлежит тебе, я не возьму, чтобы ты не сказал: „Я обогатил Аврама“. Исключение — лишь то, что съели юноши, и доля людей, ходивших со мной: Анера, Эшкола и Мамре. Пусть они возьмут свою долю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по геэзскому тексту: «нам»; в некоторых переводах: «мне».'
    reason: Отмечает расхождение с распространенным чтением параллельного места в Быт. 14:21 и прежними переводами, сохраняя форму исходного текста Юбилеев.
lexical_decisions:
- source_word: ጸግወነ
  choice: Отдай нам
  rationale: Геэзская форма содержит местоименный суффикс первого лица множественного числа («нам»), поэтому ее нельзя согласовывать с Быт. 14:21 как «мне».
- source_word: ነፍሰ
  choice: людей
  rationale: В контексте речь идет о спасенных людях; буквальное «души» в современном русском звучало бы неестественно и могло бы сузить смысл.
- source_word: አነሣእ፡ እደየ
  choice: Я поднял руки
  rationale: Сохранен жест торжественной клятвы без добавления пояснения, отсутствующего в исходном тексте.
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: ни нитки, ни ремешка от сандалии
  rationale: Передает меризм от ничтожной нитки до ремешка обуви естественной русской отрицательной конструкцией.
- source_word: ወራዙት
  choice: юноши
  rationale: Сохранено прямое значение обозначения молодых мужчин, без контекстуального переосмысления как «слуги».
- source_word: መክፈልቶሙ
  choice: свою долю
  rationale: Передает причитающуюся спутникам часть добычи без уточнений, которых нет в источнике.
theological_decisions:
- issue: Адресат клятвы Аврама
  choice: к Богу Всевышнему
  alternative: к Господу, Богу Всевышнему
  rationale: В данном геэзском тексте присутствует «Бог Всевышний», но нет отдельного божественного имени; оно не добавлено из параллельного текста Бытия.
- issue: Характер жеста поднятых рук
  choice: сохранить образ без пояснения
  alternative: перевести как «я поклялся Богом Всевышним»
  rationale: Поднятие рук подразумевает клятву, но образное выражение источника сохранено, чтобы не устранять его форму и возможный оттенок смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Прямая речь и формула отказа переданы ясно; архаизмы и искусственное подражание синодальному стилю исключены.
