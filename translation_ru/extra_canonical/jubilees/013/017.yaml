  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: ru
  text: 'И он сказал: «Ты — Бог Всевышний, мой Бог во веки веков». В седьмой год этой седмины Лот отделился от него и поселился в Содоме; жители Содома были весьма грешны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: Бог Всевышний
  rationale: Точно и естественно передаёт титул «Бог Высочайший / Всевышний» в современном литературном русском.
- source_word: ለዓለመ፡ ዓለም
  choice: во веки веков
  rationale: Сохраняет усиленную формулу вечности исходного текста и её достоинство.
- source_word: ዘዝሱባዔ
  choice: этой седмины
  rationale: «Седмина» обозначает семилетний период в юбилейной хронологии и позволяет не смешивать его с обычной неделей.
- source_word: ተፈልጠ
  choice: отделился
  rationale: Передаёт значение разлучения или отделения Лота от названного ранее лица, не добавляя причины.
- source_word: ኀደረ
  choice: поселился
  rationale: В данном повествовательном контексте естественно передаёт пребывание и обоснование Лота в Содоме.
- source_word: ሰብአ፡ ሰዶም
  choice: жители Содома
  rationale: Идиоматичный русский эквивалент буквального «люди/мужи Содома», относящийся к населению города.
- source_word: ኃጥኣን፡ ጥቀ
  choice: весьма грешны
  rationale: Сохраняет нравственно-религиозное значение «грешные» и усилитель «очень, весьма».
theological_decisions:
- issue: Титул Бога и личное исповедание
  choice: «Ты — Бог Всевышний, мой Бог»
  alternative: «Ты, Всевышний Бог, — мой Бог»
  rationale: Выбранный порядок ближе к последовательности исходного текста и не устраняет возможную предикативность выражения.
- issue: Оценка жителей Содома
  choice: «были весьма грешны»
  alternative: «были великими грешниками»
  rationale: Сохраняется характеристика исходного текста без усиления до устойчивого русского выражения, которое могло бы звучать более интерпретирующе.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Архаизирующий элемент «седмина» сохранён как точный хронологический термин; остальная лексика общепонятна. Местоимение «него» оставлено без явного уточнения, чтобы не добавлять отсутствующее в данном стихе имя.
