  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: ru
  text: 'Всю землю, которую ты видишь, Я отдам тебе и твоему потомству навеки. Я сделаю твоё потомство многочисленным, как морской песок: если человек сможет сосчитать песок земли, то и твоё потомство[a]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в следующем стихе.
    reason: Читателю важно понимать, что необычный обрыв в конце стиха воспроизводит деление исходного текста и не является пропуском.
lexical_decisions:
- source_word: ዘርእ
  choice: потомство
  rationale: В данном обещании слово означает совокупность потомков; «потомство» естественно по-русски и сохраняет собирательное значение.
- source_word: ኆፃ፡ ባሕር
  choice: морской песок
  rationale: Буквально «песок моря»; этот образ передаёт неисчислимое множество.
- source_word: ኆፃ፡ ምድር
  choice: песок земли
  rationale: В источнике повторено ኆፃ («песок»), поэтому не вводится английское «пыль»; сочетание передано близко к форме оригинала.
- source_word: እስከ፡ ለዓለም
  choice: навеки
  rationale: Краткий и естественный русский эквивалент выражения о бессрочном владении.
theological_decisions:
- issue: Незавершённая условная конструкция на границе стихов
  choice: 'Сохранить обрыв: «то и твоё потомство…»'
  alternative: 'Дополнить: «то и твоё потомство можно будет сосчитать»'
  rationale: Сказуемое содержится в следующем стихе и имеет отрицательную форму. Его положительное восполнение здесь исказило бы смысл и нарушило синтаксическую связь между стихами.
- issue: Значение обещания о потомстве
  choice: «сделаю твоё потомство многочисленным, как морской песок»
  alternative: 'Формально: «сделаю твоё потомство как морской песок»'
  rationale: Добавление «многочисленным» явно выражает функцию сравнения в современном русском, не определяя точное число и не снимая образную гиперболу.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, оформлены с прописной буквы по принятой русской издательской традиции; обращение к человеку оставлено со строчной. Многоточие отмечает реальную незавершённость фразы на границе стихов.
