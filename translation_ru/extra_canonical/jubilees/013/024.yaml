  to: 'И пришёл один из спасшихся и сообщил Авраму, что сын его брата взят в плен. Аврам вооружил слуг, рождённых в его доме…[a] На Авраме и его потомстве лежит обязанность отдавать Господу первую десятину,[b] и Господь сделал это вечным установлением: пусть отдают её священникам, служащим пред Ним, чтобы…[c]'
