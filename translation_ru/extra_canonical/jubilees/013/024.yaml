  yaml_path: translation/extra_canonical/jubilees/013/024.yaml
  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: ru
  text: 'И пришёл один из спасшихся и сообщил Авраму, что сын его брата взят в плен. Аврам вооружил слуг, рождённых в его доме…[a] На Авраме и его потомстве лежит обязанность отдавать Господу первую десятину,[b] и Господь сделал это вечным установлением: пусть отдают её священникам, служащим пред Ним, чтобы…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В дошедшем тексте после слов «рождённых в его доме» повествование резко обрывается и сразу переходит к установлению десятины; вероятно, здесь утрачена часть рассказа.
    reason: segmentation_note
  - marker: b
    text: Выражение «первая десятина» необычно; возможны также переводы «главная десятина» или понимание как начальной десятины, связанной с первыми плодами.
    reason: lexical_alternative
  - marker: c
    text: Геэзский текст стиха оканчивается словом «чтобы», поэтому незавершённость фразы сохранена.
    reason: textual_note
lexical_decisions:
- source_word: ዚድኅነ
  choice: один из спасшихся
  rationale: Передаёт субстантивированную форму со значением человека, избежавшего гибели или плена; по-русски это естественнее буквального «спасшийся пришёл».
- source_word: ተፄወወ
  choice: взят в плен
  rationale: Контекстуально и лексически передаёт пленение, не уточняя не выраженных в тексте обстоятельств.
- source_word: ወልደ፡ እኁሁ
  choice: сын его брата
  rationale: Сохранено буквальное родственное обозначение вместо поясняющего «племянник».
- source_word: አስተረሰየ፡ ልደ፡ ቤቱ
  choice: вооружил слуг, рождённых в его доме
  rationale: Следует традиционно понимаемому повествовательному смыслу; существительное «слуг» восполнено по устойчивому выражению и контексту, поскольку дошедший текст сжат и повреждён.
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: первая десятина
  rationale: Сохраняет необычное сочетание «десятина» и «первая», не сводя его без достаточных оснований к «лучшей» или к десятине от первых плодов.
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: служащим пред Ним
  rationale: Достоинственная и понятная передача священнического служения перед Господом.
theological_decisions:
- issue: Кто устанавливает обязанность первой десятины
  choice: «На Авраме и на его потомстве лежит первая десятина Господу»
  alternative: «Он возложил на Аврама и его потомство первую десятину Господу»
  rationale: В геэзском предложении явный глагол и субъект отсутствуют. Русское «лежит» естественно передаёт обязанность, не вводя не названного деятеля.
- issue: Получатели десятины
  choice: «священникам, служащим пред Ним»
  alternative: «священникам, которые совершают служение перед Ним»
  rationale: Сохранены и священнический статус, и направленность служения к Господу без конфессионального уточнения характера этого служения.
- issue: Незавершённое конечное «чтобы»
  choice: сохранить обрыв как «чтобы…»
  alternative: опустить незавершённый союз
  rationale: Источник оканчивается союзом ከመ («чтобы/дабы»). Сохранение обрыва честно отражает состояние текста и не создаёт отсутствующего продолжения.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Устаревшая лексика сведена к понятному выражению «пред Ним»; синтаксическая и текстовая незавершённость оригинала не сглажена.
