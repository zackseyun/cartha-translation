  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: ru
  text: И Таргал[a], царь народов; и они убили царя Гоморры, а царь Содома бежал, и многие упали в битум долины содомлян[b] у Солёного моря. Они захватили Содом, Адаму и Севоим, а также взяли в плен Лота, сына брата Аврама, и всё его имущество, и дошли до Дана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте — Таргал; это имя соответствует Фидалу в Быт 14:1.
    reason: lexical_choice
  - marker: b
    text: 'Буквально: «в битум долины содомлян». Это соответствует «смоляным ямам в долине Сиддим» в Быт 14:10. Чарльз (1902) считал текст повреждённым и исправлял его на «от ран», однако геэзское чтение осмысленно и отражает традицию книги Бытия.'
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: Таргал
  rationale: Передана форма имени, непосредственно засвидетельствованная в геэзском тексте; отождествление с Фидалом из Бытия вынесено в сноску.
- source_word: ወጐየ
  choice: бежал
  rationale: Глагол означает бегство и соответствует развитию событий в Быт 14:10; каузативное «прогнали» здесь неуместно.
- source_word: በቀብአ
  choice: в битум
  rationale: Обычное значение связано с маслом или мазью, однако в данном контексте слово передаёт битум из традиции Быт 14:10. Конъектура «от ран» не требуется.
- source_word: ሰዶማውያን
  choice: содомлян
  rationale: Геэзский текст прямо называет жителей Содома, а не долину Сиддим; это чтение сохранено, несмотря на параллель в Бытии.
- source_word: ፄወዉ
  choice: захватили
  rationale: В отношении городов естественное русское «захватили» передаёт идею взятия в плен; далее применительно к Лоту употреблено «взяли в плен».
