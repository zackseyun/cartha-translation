translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная синтаксическая незавершённость («И Таргал…;») сохранена, поскольку стих продолжает перечень из предшествующего контекста. Имена переданы в привычных русских формах там, где они устойчивы; специфическая геэзская форма Таргал сохранена буквально.
