  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: ru
  text: 'В том году, когда Лот был взят в плен, Господь сказал Авраму после того, как Лот отделился от него, в четвёртый год этой недели[a]: «Подними глаза и посмотри с того места, где ты живёшь, на север, на юг, на запад и на восток,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «неделя» означает период в семь лет.
    reason: Термин имеет специальное хронологическое значение в Книге Юбилеев и без пояснения может быть понят как обычная семидневная неделя.
lexical_decisions:
- source_word: ተፄወወ፡ ሎጥ
  choice: Лот был взят в плен
  rationale: Глагол передаёт пленение или увод в плен; пассивная формулировка естественна по-русски и соответствует контексту.
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Традиционное и уместное русское соответствие божественному наименованию в данном библейском контексте.
- source_word: በ፬ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: в четвёртый год этой недели
  rationale: Сохранён характерный для Книги Юбилеев хронологический термин «неделя» как семилетний период; значение пояснено в сноске.
- source_word: መንገለ፡ ሰሜን፡ ወሌብ፡ ወባሕር፡ ወጽባሕ
  choice: к северу и югу, к западу и востоку
  rationale: «Море» и «восход» переданы их контекстуальными сторонами света — западом и востоком; исходный порядок направлений сохранён.
theological_decisions:
- issue: Передача божественного имени እግዚአብሔር
  choice: Господь
  alternative: Бог
  rationale: «Господь» сохраняет традиционный библейский регистр и не вносит дополнительного конфессионального толкования.
- issue: Соотношение пленения Лота и его более раннего отделения от Аврама
  choice: Сохранить обе временные привязки без их перестановки или согласования
  alternative: Переформулировать хронологию для устранения кажущегося напряжения
  rationale: Источник упоминает пленение в рамочной фразе и затем отделение Лота; перевод не должен молча разрешать возможное хронологическое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Начальная кавычка оставлена незакрытой, поскольку прямая речь продолжается в следующем стихе.
