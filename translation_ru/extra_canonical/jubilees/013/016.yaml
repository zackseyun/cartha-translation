  yaml_path: translation/extra_canonical/jubilees/013/016.yaml
  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: ru
  text: И в сорок первом юбилее, в третий год первой седмины, он вернулся на это место, принёс на нём жертву и призвал имя Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ፡ ውስተዝ፡ መካን፡
  choice: он вернулся на это место
  rationale: Глагол ገብአ в данном контексте обозначает возвращение, а указательное ዝ — «это»; формулировка также естественно продолжает рассказ о возвращении Аврама из Египта.
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ፡
  choice: принёс там жертву
  rationale: Оборот сообщает о вознесении/принесении жертвы на этом месте; «там» естественно передаёт местное значение በዲቤሁ без тяжеловесного «на нём».
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር፡
  choice: и призвал имя Господа
  rationale: Формально и богословски нейтрально сохраняет библейский оборот «призывать имя Господа».
- source_word: በዘአርብዓ፡ ወአሐዱ፡ ኢዮቤልዎን፡ በሣልስ፡ ዓም፡ ዘሱባዔ፡ ቀዳማ፡
  choice: в сорок первом юбилее, в третий год первой седмины
  rationale: Сохраняет характерную для книги юбилейно-седмичную систему датировки; «седмина» ясно обозначает семилетний период и поддерживает достойный библейский регистр.
theological_decisions:
- issue: Характер действия на месте
  choice: принёс там жертву
  alternative: построил там жертвенник
  rationale: Эфиопский текст прямо указывает на принесение жертвы; вариант о строительстве жертвенника возник бы из гармонизации с Быт 13:4 и не отражает данный источник.
- issue: Формула обращения к Богу
  choice: призвал имя Господа
  alternative: воззвал к Господу по имени
  rationale: Выбранный вариант сохраняет традиционную формулу исходного текста и не сужает её значения до одного лишь обращения или молитвы.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис остаётся простым и доступным; термин «седмина» употреблён как точное обозначение семилетнего цикла, а не обычной недели.
