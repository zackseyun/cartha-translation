  to: И в сорок первом юбилее, в третий год первой седмины, он вернулся на это место, принёс на нём жертву и призвал имя Господа.
  rationale: Заменено «там» на «на нём», чтобы отразить местное በዲቤሁ, не добавляя представления о сооружении жертвенника и не меняя смысла. Остальной текст точно следует источнику и согласуется с английским аудиторским следом.
