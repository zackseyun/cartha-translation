    issue: Ослаблено местное уточнение при жертвоприношении
    rationale: Оборот በዲቤሁ указывает, что жертва была принесена «на нём» — на упомянутом месте. Наречие «там» передаёт общий локатив, но не сохраняет эту связь столь явно.
  revised_text: И в сорок первом юбилее, в третий год первой седмины, он вернулся на это место, принёс на нём жертву и призвал имя Господа.
