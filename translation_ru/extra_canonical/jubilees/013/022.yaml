  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: ru
  text: «Ибо Я отдам её твоему потомству». И Аврам пошёл в Хеврон и поселился там. В этом году пришёл Кедорлаомер, царь Элама, и Амрафел, царь Сеннаара, и Ариох, царь Элласара,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: твоему потомству
  rationale: Эфиопское выражение буквально означает «твоему семени»; в современном русском «потомству» естественно передаёт собирательный смысл.
- source_word: እሁብ
  choice: Я отдам её
  rationale: Форма передаёт обещание дарования; местоимение «её» восстанавливает подразумеваемую землю из контекста и согласуется с русской грамматикой.
- source_word: ኀደረ
  choice: поселился
  rationale: В данном повествовательном контексте глагол пребывания естественно означает обосноваться или поселиться.
- source_word: መጽአ
  choice: пришли
  rationale: В источнике глагол стоит в единственном числе перед перечнем царей, но по-русски согласование по смыслу с составным подлежащим требует множественного числа.
- source_word: ሴናአር
  choice: Сеннаара
  rationale: Использована укоренившаяся русская библейская передача географического имени Шинар/Сеннаар.
theological_decisions:
- issue: Значение слова «семя» в обещании
  choice: потомство
  alternative: семя
  rationale: Выбор сохраняет собирательный родовой смысл без уточнения числа потомков и не навязывает позднейшего богословского истолкования.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены незавершённость предложения и конечная запятая, поскольку стих переходит к продолжению перечня царей в следующем сегменте.
