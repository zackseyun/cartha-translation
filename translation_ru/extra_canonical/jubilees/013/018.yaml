lexical_decisions:
- source_word: ወአእከዮ፡ በልቡ፡
  choice: И тяжело было у него на сердце
  rationale: Передаёт внутреннюю скорбь естественным современным русским оборотом, сохраняя прямое упоминание сердца.
- source_word: ተፈልጠ፡
  choice: был разлучён
  rationale: 'Сохраняет пассивное значение исходной формы: племянник оказался отделён от него, а не обязательно сам сознательно ушёл.'
- source_word: ወልደ፡ እኁሁ፡
  choice: сын его брата
  rationale: Формально и ясно воспроизводит родственную формулу оригинала, не заменяя её словом «племянник».
- source_word: አልቦ፡ ውሉደ፡
  choice: у него не было детей
  rationale: Сохраняет обобщённое множественное число и не уточняет пол детей сверх исходного текста.
