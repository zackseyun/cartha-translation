  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: ru
  text: 'И для этого закона нет предела во времени, потому что он установил его для всех поколений навеки, чтобы они отдавали Господу десятую часть от всего: от зерна[a], вина и масла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «зерном» здесь, вероятно, подразумевается урожай зерновых вообще, а не только семена, отложенные для посева.
    reason: cultural_note
lexical_decisions:
- source_word: ወሰነ፡ መዋዕል፡
  choice: предела во времени
  rationale: Буквально выражение означает «предел дней»; русское «предел во времени» сохраняет смысл отсутствия временного ограничения и звучит естественно.
- source_word: ለትውልድ፡ ዘለዓለም፡
  choice: для всех поколений навеки
  rationale: Передаёт как связь установления с последующими поколениями, так и его бессрочный характер.
- source_word: ዓሥራተ፡ እምኵሉ፡
  choice: десятую часть всего
  rationale: Точно передаёт предписание отдавать одну десятую от всего, не вводя более специализированную церковную терминологию.
- source_word: እምዘርእ፡
  choice: зерна
  rationale: Основное значение — «семя, зерно»; в данном перечне сельскохозяйственных благ речь, вероятно, идёт об урожае зерновых, что пояснено в сноске.
- source_word: ቅብእ፡
  choice: масла
  rationale: В сельскохозяйственной триаде имеется в виду масло, прежде всего оливковое; родовое «масло» не добавляет отсутствующего в тексте уточнения.
theological_decisions:
- issue: Кто установил закон
  choice: он установил его
  alternative: Бог установил его
  rationale: Источник использует глагольную форму с местоименным субъектом, но не называет Бога прямо; местоимение сохраняет формальную неоднозначность и не вносит уточнение от переводчика.
- issue: Передача имени Господа
  choice: Господу
  alternative: Богу
  rationale: Эфиопское እግዚአብሔር обычно соответствует титулу «Господь»; этот вариант точен и естественен для русского библейского регистра.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён без утраты причинной связи и торжественного характера установления; двоеточие сохраняет пояснительную структуру исходного текста.
