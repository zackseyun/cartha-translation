  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: ru
  text: И фараон отпустил Сару, жену Аврама, и выслал его из Египта. Аврам пошёл туда, где прежде поставил свой шатёр, к месту жертвенника, между Вефилем на западе и Гаем на востоке, и благословил Господа, своего Бога, который возвратил его с миром.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሦራሃ
  choice: Сару
  rationale: Передача имени в форме «Сара» согласуется с русской библейской традицией; винительный падеж обусловлен синтаксисом.
- source_word: አፍለሶ
  choice: выслал его
  rationale: Глагол выражает удаление или изгнание из страны; «выслал» сохраняет принудительный оттенок, не перегружая фразу.
- source_word: ደብተራሁ
  choice: свой шатёр
  rationale: В данном повествовательном контексте слово обозначает шатёр Аврама.
- source_word: ምሥዋዕ
  choice: жертвенника
  rationale: Обычное и точное русское соответствие месту принесения жертв.
- source_word: አጌ
  choice: Гаем
  rationale: Использована укоренившаяся русская библейская форма топонима Гай.
- source_word: ዘገብ በሰላም
  choice: который возвратил его с миром
  rationale: Передаёт возвращение в сохранности и мире, сохраняя прямую причинную связь с благословением Бога.
theological_decisions:
- issue: Передача божественного имени/титула እግዚአብሔር
  choice: Господа
  alternative: Владыку / ГОСПОДА
  rationale: «Господь» — естественная и традиционная русская передача в данном контексте; источник не требует типографически выделять тетраграмматон.
- issue: Субъект заключительного действия возвращения
  choice: Бог возвратил Аврама с миром
  alternative: Аврам вернулся с миром
  rationale: Относительная конструкция источника грамматически связывает возвращение с Богом как действующим лицом; это сохранено без богословского ослабления.
