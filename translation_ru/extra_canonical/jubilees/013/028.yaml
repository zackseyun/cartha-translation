  rationale: В данном контексте естественно передаёт приближение царя к Авраму.
- source_word: ሰገደ
  choice: поклонился
  rationale: Сохраняет значение почтительного телесного поклона, не приписывая действию исключительно богослужебный смысл.
- source_word: እግዚእነ
  choice: Господин наш
  rationale: Передаёт форму почтительного обращения с суффиксом первого лица множественного числа, не смешивая её с божественным именованием.
theological_decisions:
- issue: Характер поклона царя Содома перед Аврамом
  choice: поклонился ему
  alternative: пал ниц перед ним / поклонился ему как объекту поклонения
  rationale: Исходный глагол допускает поклон как жест почтения; контекст не требует богослужебного толкования.
