  text: and from cattle and from sheep. And he gave it to his priests to eat and to drink with rejoicing.
translation:
  language: ru
  text: И из крупного скота, и из овец. И он дал это своим священникам, чтобы они ели и пили с радостью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልህምት
  choice: крупного скота
  rationale: Существительное обозначает крупный домашний скот; в сочетании с последующим «овцы/мелкий скот» естественно передаётся как категория животных.
- source_word: አባግዕ
  choice: мелкого скота
  rationale: Буквально речь идёт об овцах, однако в паре с крупным скотом русское «мелкий скот» естественно сохраняет категориальное противопоставление.
- source_word: ካህናቲሁ
  choice: своим священникам
  rationale: Суффикс принадлежности передан возвратным притяжательным местоимением; термин означает священников.
- source_word: በፍሥሓ
  choice: с радостью
  rationale: Передаёт обстоятельственное значение радости, ликования или веселья без излишнего усиления.
