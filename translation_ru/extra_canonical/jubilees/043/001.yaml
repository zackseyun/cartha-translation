  yaml_path: translation/extra_canonical/jubilees/043/001.yaml
  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: ru
  text: 'Иосиф задумал, как узнать их намерения — мирные ли у них намерения по отношению друг к другу. Он сказал управляющему своим домом: «Наполни все их мешки зерном, возврати им их деньги[a], положив их внутрь мешков, а мою чашу, из которой я пью, серебряную чашу, положи в мешок младшего». И отпустил их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «их золото».
    reason: Сохраняет доступ к буквальному значению ወርቆሙ, которое в основном тексте контекстуально передано словом «деньги».
lexical_decisions:
- source_word: ሐለየ፡ … ሕሊና
  choice: задумал
  rationale: Сочетание глагола и однокоренного существительного буквально означает «помыслить мысль»; по-русски естественно передаётся как замысел или намеренный план.
- source_word: ሕሊናሆሙ / ሕሊና፡ ሰላም
  choice: их намерения / мирные ли … намерения
  rationale: Слово ሕሊና может обозначать мысль, помысел или намерение. В контексте проверки братьев «намерения» звучит естественно и сохраняет повтор ключевого понятия.
- source_word: አግብእ፡ ሎሙ
  choice: возврати им
  rationale: Глагол выражает возвращение, а не просто помещение денег в мешки; это отличает эфиопский текст от возможной гармонизации с Быт 44:1.
- source_word: ወርቆሙ
  choice: их деньги
  rationale: Буквально «их золото», но в данной торговой ситуации золото служит платой; «деньги» ясно передаёт функцию, а буквальный образ отмечен в сноске.
- source_word: ማእከለ፡ መዋዲቶሙ
  choice: внутрь мешков
  rationale: Буквально «в середину их мешков»; русское «внутрь» естественно передаёт пространственный смысл без неуместного акцента на точной середине.
- source_word: ኮራ፡ ዘብሩር
  choice: серебряную чашу
  rationale: Сохраняется уточняющее приложение исходного текста после упоминания чаши, из которой пьёт Иосиф.
theological_decisions:
- issue: Значение выражения «мысль мира»
  choice: мирные ли у них намерения по отношению друг к другу
  alternative: есть ли между ними мысль о мире
  rationale: Перевод сохраняет направленность проверки на отношения между братьями и не превращает «мир» в отвлечённое внутреннее спокойствие. Формулировка не уточняет сверх текста, были ли эти намерения направлены также на Иосифа.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественной библейской интонацией. Повтор слова «намерения» отражает лексический повтор оригинала; прямая речь оформлена естественно для русского текста.
