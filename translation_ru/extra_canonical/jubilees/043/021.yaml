  text: and over all the land of Egypt. And tell my father of all my honor and of all that has been given to me."
translation:
  language: ru
  text: «…и над всей землёй Египетской. Расскажите моему отцу обо всей моей славе[a] и обо всём, что мне дано».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чести»; также возможно: «почёте».'
    reason: Эфиопское ክብር охватывает значения славы, чести и почёта.
lexical_decisions:
- source_word: ክብረየ
  choice: моей славе
  rationale: Слово обозначает славу, честь или почёт; в рассказе об Иосифе «слава» естественно передаёт его высокое положение, не добавляя отсутствующих в тексте пояснений.
- source_word: ኵሎ፡ ዘመጠነ፡ ወሀበኒ
  choice: обо всём, что мне дано
  rationale: Сохраняет обобщённость и пассивный смысл исходного выражения, не уточняя ни дарителя, ни содержание полученного.
- source_word: ወዜንውዎ፡ ለአቡየ
  choice: Расскажите моему отцу
  rationale: Естественная русская передача повеления сообщить отцу последующие сведения; предлог «обо» вводит содержание сообщения.
theological_decisions:
- issue: Кто дал Иосифу всё упомянутое
  choice: Не называть дарителя
  alternative: «что дал мне Бог» или «что дал мне фараон»
  rationale: В данном исходном тексте даритель прямо не назван; его уточнение устранило бы подлинную неопределённость.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Начальное многоточие показывает, что стих начинается продолжением предыдущей фразы.
