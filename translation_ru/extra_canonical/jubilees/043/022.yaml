  language: ru
  text: И по повелению фараона он дал им повозки и припасы в дорогу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቃለ፡ አፈ፡ ፈርዖን
  choice: по повелению фараона
  rationale: Буквально «по слову уст фараона»; в данном контексте это естественный эфиопский оборот со значением распоряжения или приказа.
- source_word: ሰረገላተ
  choice: повозки
  rationale: Обозначает колёсные повозки; нейтральное «повозки» здесь точнее контекстуально, чем военное или церемониальное «колесницы».
- source_word: ስንቀ፡ ለፍኖት
  choice: припасы в дорогу
  rationale: Сочетание означает дорожный провиант или снабжение для пути; перевод сохраняет практический смысл без ненужного сужения до одной только пищи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным синтаксисом. Начальные слова предоставленного фрагмента «እግዚአብሔር፡ ብዕለ፡ ወክብረ» («Господь, богатство и слава») выглядят как окончание предыдущего стиха при разбиении главы и поэтому не включены в 43:22; это согласуется с контрольным английским текстом.
