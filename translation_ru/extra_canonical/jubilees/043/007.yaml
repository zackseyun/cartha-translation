  text: I will take him as a servant, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: ru
  text: «Я возьму его в рабы[a], а вы с миром возвращайтесь по домам». И обыскивали их вещи, начав со старшего и закончив младшим; и это было найдено в мешке Вениамина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я возьму его себе слугой».'
    reason: Существительное ገብረ может передаваться более мягким словом «слуга», хотя в данном контексте основной перевод «в рабы» яснее передаёт зависимый статус.
lexical_decisions:
- source_word: እነሥእ፡ ገብረ
  choice: Я возьму его себе в рабы
  rationale: Первое лицо активного глагола እነሥእ сохранено; ገብረ передаёт положение раба или слуги. Оборот «себе в рабы» естественно выражает результат взятия.
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: а вы с миром возвращайтесь по домам
  rationale: Передаёт обращение во множественном числе и идиому мирного ухода домой; «возвращайтесь» естественнее буквального «войдите» в данном контексте.
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: стали обыскивать их вещи
  rationale: Глагол означает проверку или тщательный поиск, а ንዋዮሙ — принадлежащие им вещи, имущество.
- source_word: እምዘ፡ ይልህቅ፡ ቀደሙ፡ ወፈጸሙ፡ በኀበ፡ ዘይንእስ
  choice: начав со старшего и закончив младшим
  rationale: Сохраняется последовательность поиска от старшего к младшему.
- source_word: ወተረክበ፡ ውስተ፡ ሐስለ፡ ብንያም
  choice: и чаша была найдена в мешке Вениамина
  rationale: Пассивная форма «была найдена» соответствует источнику. ሐስለ в контексте обозначает мешок; предмет восстанавливается как чаша из непосредственного повествовательного контекста.
theological_decisions:
- issue: Статус Вениамина в словах Иосифа
  choice: Я возьму его себе в рабы
  alternative: Я возьму его себе в слуги
  rationale: «Раб» яснее сохраняет суровый юридико-социальный смысл угрозы, не меняя активное первое лицо источника; возможное более мягкое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Синтаксис сделан естественным для широкого читателя; активное «Я возьму» и последовательность обыска сохранены. Кавычка закрывает прямую речь, начатую ранее.
