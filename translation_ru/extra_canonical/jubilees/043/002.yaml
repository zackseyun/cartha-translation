  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: ru
  text: 'И он сделал так, как велел ему Иосиф: наполнил все их мешки зерном и положил их деньги в их мешки; а чашу положил в мешок Вениамина. Когда же настало утро, они отправились в путь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕስሊሆሙ / ሐስለ
  choice: их мешки / мешок
  rationale: Контекст обозначает дорожные мешки для зерна; единообразная передача сохраняет связь между общим распоряжением и мешком Вениамина.
- source_word: ሲሊተ
  choice: зерном
  rationale: Слово означает зерно, выдаваемое братьям; это естественная и точная передача в данном контексте.
- source_word: ወርቆሙ
  choice: их деньги
  rationale: Буквально связано с золотом, но в повествовательном контексте обозначает принесённую плату; «деньги» ясно передаёт функцию без ненужного уточнения материала.
- source_word: ኮራ
  choice: чашу
  rationale: Предмет, тайно помещённый в мешок Вениамина; «чаша» соответствует контексту и традиционному обозначению сосуда.
- source_word: ወነግሀ፡ በጽባሕ
  choice: Когда же настало утро
  rationale: Передаёт временную конструкцию естественным современным русским языком, сохраняя переход к следующему действию.
- source_word: ሖሩ
  choice: отправились в путь
  rationale: Глагол движения здесь обозначает их отъезд; выражение звучит естественно и не уточняет способ передвижения, которого источник не называет.
