revisions:
- from: 'Он побежал за ними и передал им эти слова. Они ответили ему: «Да не будет того, чтобы твои слуги сделали такое и украли из дома твоего господина какое-либо имущество — деньги или золото![a] Деньги, которые мы прежде нашли в своих мешках, мы, твои слуги, принесли обратно из нашей земли…»'
  to: 'Он побежал за ними и сказал им эти слова. Они ответили ему: «Да не будет того, чтобы твои слуги сделали такое и украли из дома твоего господина какие-либо деньги или золото. Деньги, которые мы прежде нашли в своих мешках, мы, твои слуги, принесли обратно из земли…»'
  rationale: Исправлены добавленное «нашей», неудачная конструкция при ንዋይ и глагол речи. Многоточие сохранено, поскольку предоставленный исходный текст обрывается после «из земли»; перевод не достраивает отсутствующее продолжение. Маркер сноски удалён вместе со сноской, поскольку она более не требуется и её формулировка не является надёжной буквальной передачей.
