  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: ru
  text: 'Он побежал за ними и сказал им эти слова. Они ответили ему: «Да не будет того, чтобы твои слуги сделали такое и украли из дома твоего господина какие-либо деньги или золото. Деньги, которые мы прежде нашли в своих мешках, мы, твои слуги, принесли обратно из земли…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሮጸ፡ ድኅሬሆሙ
  choice: Он побежал за ними
  rationale: Прямо передаёт движение вслед за группой; русское «побежал за ними» естественно и сохраняет динамику оригинала.
- source_word: ወይቤሎሙ፡ በከመ፡ ዝንቱ፡ ነገር
  choice: передал им эти слова
  rationale: Передаёт смысл речи в соответствии с данным поручением, не создавая неестественной кальки «сказал им согласно этому слову».
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ
  choice: Да не будет того, чтобы твои слуги
  rationale: Сохраняет сильную формулу отрицания и самоназвание говорящих как слуг адресата.
- source_word: ንዋየ፡ ወወርቀኒ
  choice: имущество — деньги или золото
  rationale: ንዋይ обозначает имущество, добро, богатство или деньги, а не специально серебро; формулировка не гармонизирует текст с Быт 44:8 и сохраняет широту лексемы.
- source_word: ዘረከብነ፡ ቀዳሙ፡ ውስተ፡ አኅጢነ
  choice: Деньги, которые мы прежде нашли в своих мешках
  rationale: «Прежде» отражает ቀዳሙ, а «в своих мешках» естественно передаёт принадлежность мешков говорящим.
- source_word: አበጥከ፡ ደቂቅከ፡ እምድረ፡
  choice: мы, твои слуги, принесли обратно из нашей земли
  rationale: Предложение в предоставленном фрагменте обрывается на «из земли»; многоточие честно отмечает незавершённость стиха в данном источниковом отрывке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Формула «Да не будет того» сохранена как торжественное и решительное отрицание. Конец оформлен многоточием, поскольку предоставленный исходный текст заканчивается посреди фразы.
