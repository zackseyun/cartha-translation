  text: And he could no longer restrain himself, and told them that he was Joseph. And he spoke with them in the Hebrew language.
translation:
  language: ru
  text: Он больше не мог сдерживаться[a] и сказал им, что он — Иосиф. И говорил с ними на еврейском языке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в сохранившемся эфиопском тексте: «Он сдержался» или «Он сдерживал себя»; отрицание отсутствует. По смыслу контекста, вероятно: «не мог больше сдерживаться».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ተዐገሦ
  choice: больше не мог сдерживаться
  rationale: Форма буквально означает «сдержался / сдерживал себя» и не содержит явного отрицания, однако в данном повествовательном контексте раскрытие Иосифом своей личности требует значения «не мог больше сдерживаться», как и в параллельном рассказе Быт. 45:1. Текстовая трудность открыто отмечена в сноске.
- source_word: ነገሮሙ
  choice: сказал им
  rationale: Естественно передаёт значение глагола сообщения в данном контексте.
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ
  choice: на еврейском языке
  rationale: Современная и ясная русская передача выражения «по/на языке еврейском».
theological_decisions:
- issue: Отсутствие отрицания при глаголе «сдерживаться» в сохранившемся эфиопском тексте
  choice: В основном тексте передано контекстуально ожидаемое «больше не мог сдерживаться» с указанием разночтения в сноске.
  alternative: «Он сдержался» или «он сдерживал себя».
  rationale: Буквальная утвердительная передача противоречит следующему действию — немедленному раскрытию личности — и очевидной повествовательной связи с Быт. 45:1. Сноска сохраняет доступ к форме исходного свидетельства и не скрывает текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Разделение на два предложения сохранено; повтор «И» перед вторым предложением отражает структуру источника.
