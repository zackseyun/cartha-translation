  text: And he gave all of them changes of garments and silver[23]. And to their father also he sent garments and silver.
translation:
  language: ru
  text: И он дал всем им сменную одежду[a] и серебро. Их отцу он также послал одежду и серебро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «сменная одежда», может также означать «разнообразная одежда» или «цветная одежда».
    reason: lexical_alternative
lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: сменную одежду
  rationale: Сочетание допускает значения одежды для смены, разнообразной одежды или цветной одежды. В контексте, параллельном Быт. 45:22, естественный русский эквивалент — «сменная одежда»; неоднозначность отражена в сноске.
- source_word: ብሩረ
  choice: серебро
  rationale: Прямое значение существительного; источник не указывает ни количества, ни формы серебра.
- source_word: ፈነወ
  choice: послал
  rationale: Передаёт отличие от предыдущего глагола «дал» и соответствует направлению дара отцу через братьев.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «одежду и серебро» сохранён ради близости к структуре источника.
