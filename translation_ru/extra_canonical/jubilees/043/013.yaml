base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your servant, remain alone instead of the boy as a servant to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your servant, our father. And if I do not bring him back, your servant will bear the blame before our father all our days.’
translation:
  language: ru
  text: И пусть я, твой раб, один останусь вместо отрока рабом у господина моего, а юноша пусть пойдёт со своими братьями, ибо я поручился за него из руки твоего раба, нашего отца. Если я не приведу его обратно, то буду нести вину перед нашим отцом во все дни».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Переданный текст на геэзе в этом месте сжат и местами синтаксически неровен. Выражение «поручился за него из руки твоего раба, нашего отца» передано близко к тексту; оно, вероятно, связано с принятым Иудой перед отцом обязательством за отрока. Основной смысл ясен: Иуда предлагает остаться рабом вместо отрока и просит отпустить юношу с братьями.'
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ
  choice: твой раб
  rationale: Существительное обозначает раба или слугу; в самоуничижительной речи Иуды перед господином буквальное «раб» сохраняет социальную и риторическую силу выражения.
- source_word: ባሕቱ
  choice: один
  rationale: Передаёт мысль о том, что Иуда просит оставить именно его одного вместо отрока.
- source_word: ህየንቴሁ ለሕፃን
  choice: вместо отрока
  rationale: 'Сохраняет заместительный смысл: Иуда предлагает себя на месте младшего брата.'
- source_word: ወሬዛ
  choice: юноша
  rationale: Естественное современное соответствие для обозначения молодого человека, отличённого в тексте от братьев.
- source_word: ተሀበይክዎ
  choice: я поручился за него
  rationale: Контекст Бытия 44:32 и форма в данном предложении указывают на обязательство Иуды возвратить отрока; перевод избегает ошибочного смысла «ты доверил его».
- source_word: ይሌብከ
  choice: буду нести вину
  rationale: Передаёт длительную личную ответственность и вину за невозвращение отрока.
- source_word: ኵሎነ መዋዕለ
  choice: во все дни нашей жизни
  rationale: Сохраняет множественное «наши» и выражает пожизненную продолжительность в естественной русской форме.
theological_decisions:
- issue: Заместительное предложение Иуды
  choice: «останусь вместо отрока рабом»
  alternative: «поручился за отрока перед господином»
  rationale: Непосредственная последовательность слов и повествовательный контекст поддерживают предложение Иуды остаться в рабстве вместо юноши; перевод не превращает эту фразу лишь в повтор поручительства.
- issue: Адресат поручительства
  choice: «перед твоим рабом, нашим отцом»
  alternative: «из руки твоего раба, нашего отца»
  rationale: Буквальный образ «из руки» в данном контексте обозначает принятие обязательства перед отцом; русское «перед» ясно передаёт отношение без добавления нового богословского смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской речью. «Отрок» сохранён как уместное традиционное обозначение младшего сына, тогда как «юноша» передаёт отдельное исходное слово; синтаксис сделан понятным без устранения отмеченной в сноске текстовой неровности.
