  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
translation:
  language: ru
  text: 'И он обнял их за шеи и заплакал[a]; они же не узнали его и тоже заплакали. И он сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «они же не узнали его» могут указывать либо на продолжавшееся изумление, либо на то, что во время признания Иосифа братья ещё не вполне осознали, кто перед ними.
    reason: alternative_reading
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳውዲሆሙ
  choice: обнял их за шеи
  rationale: Сохраняет конкретный образ геэзского текста, а не обобщает его как «обнял их».
- source_word: ወበከየ
  choice: и заплакал
  rationale: Естественная современная передача глагола плача в данном повествовательном контексте.
- source_word: ኢያእመርዎ
  choice: не узнали его
  rationale: Передаёт значение узнавания/распознавания без попытки объяснить кажущееся напряжение контекста.
- source_word: ወአንከ፡ ይብከዩ
  choice: и тоже заплакали
  rationale: «Тоже» естественно выражает присоединение братьев к плачу Иосифа.
theological_decisions:
- issue: Братья не узнают Иосифа во время раскрытия его личности
  choice: они же не узнали его
  alternative: они ещё не вполне осознали, что это он
  rationale: Сохранено прямое и неоднозначное свидетельство исходного текста; психологическое объяснение не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской повествовательной сдержанности. Частица «же» мягко передаёт контраст; синтаксис оставляет финальную реплику открытой, как в источнике.
