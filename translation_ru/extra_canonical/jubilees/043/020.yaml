lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  choice: многочисленный народ
  rationale: Сохраняет прямое значение сочетания и его связь с предшествующим контекстом; строчная буква отражает начало стиха внутри продолжающегося предложения.
- source_word: ዜንውዎ፡ ለአቡየ
  choice: сообщите моему отцу
  rationale: Естественно передаёт повеление рассказать или известить отца, не добавляя отсутствующего содержания.
- source_word: ዓዲ፡ ሕያው፡ አነ
  choice: я всё ещё жив
  rationale: Передаёт продолжение состояния жизни; «всё ещё» естественно и точно выражает значение ዓዲ в данном контексте.
- source_word: አንትሙኒ
  choice: вы и сами
  rationale: Передаёт местоимение второго лица множественного числа и усилительно-присоединительную частицу -ኒ.
- source_word: ሠርዐኒ፡ እግዚአብሔር
  choice: Бог поставил меня
  rationale: Глагол обозначает назначение или поставление на положение; выбранное выражение сохраняет субъект и направленность действия.
- source_word: አቡሁ፡ ለፈርዖን
  choice: отцом фараону
  rationale: Сохраняет буквальный образ отцовского положения по отношению к фараону, не истолковывая его как конкретную административную должность.
- source_word: እመብል፡ ውስተ፡ ቤቱ
  choice: правителем в его доме
  rationale: Передаёт власть или руководство в доме фараона; местоимение сохранено без замены на поясняющее имя.
theological_decisions:
- issue: Божье действие при возвышении Иосифа
  choice: «Бог поставил меня»
  alternative: «Бог сделал меня»
  rationale: «Поставил» точнее выражает назначение на положение и сохраняет прямое утверждение о Божьем действии без дополнительного богословского истолкования.
- issue: Метафора «отец фараону»
  choice: сохранить буквально
  alternative: передать как «советник фараона»
  rationale: Исходный текст использует родственный образ, значение которого шире одной должности; буквальная передача сохраняет его напряжение и возможную многозначность.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан естественным для широкого читателя, но образ «отцом фараону» сохранён. Начальная строчная буква и конечная запятая отражают фрагментарность стиха: он продолжает предыдущее и переходит в следующее предложение.'
