  naturalness: Текст в целом литературен и понятен. «От потрясения его разум оцепенел» несколько утяжеляет фразу и вводит причинное оформление, тогда как оригинал непосредственно характеризует состояние ума. «Ум его был потрясён» передаёт это естественнее и без добавочного объяснения.
  terminology: «Жизнь его духа обновилась» удачно сохраняет образ оригинала; «Иосиф» и «сойду» переданы последовательно и точно. Конфессионально обусловленных терминологических решений не требуется.
