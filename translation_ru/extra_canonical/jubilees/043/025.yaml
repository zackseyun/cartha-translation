lexical_decisions:
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: от потрясения его разум оцепенел
  rationale: Передаёт состояние внезапного душевного потрясения и умственного оцепенения, не сводя выражение лишь к удивлению.
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: жизнь его духа обновилась
  rationale: Сохраняет необычный образ исходного текста и не заменяет его более привычным, но менее точным выражением «он воспрянул духом».
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ፡ እመ
  choice: Мне довольно и того, что
  rationale: 'Естественно передаёт контекстуальный смысл достаточности: для отца известие о том, что Иосиф жив, превосходит всё остальное.'
- source_word: እረድ
  choice: Я сойду
  rationale: Сохраняет пространственный глагол «сойти/спуститься», традиционно связанный с путешествием в Египет.
