lexical_decisions:
- source_word: ወዓዲ
  choice: И ещё остаётся
  rationale: Передаёт добавочное значение «ещё» и в контексте — продолжающийся остаток срока.
- source_word: ኃምስቱ፡ ዓመት
  choice: пять лет
  rationale: Прямое соответствие числительному и существительному источника.
- source_word: ማእረር
  choice: пахоты
  rationale: Обозначает земледельческую обработку почвы; «пахота» естественно сочетается с последующими элементами перечня.
- source_word: ፍሬ፡ ዕፅ
  choice: плодов на деревьях
  rationale: Буквально передаёт сочетание «плод дерева/деревьев» естественным современным русским выражением.
- source_word: ሐፅስ
  choice: жатвы
  rationale: Передаёт сбор хлебных культур и сохраняет отличие от плодов деревьев.
