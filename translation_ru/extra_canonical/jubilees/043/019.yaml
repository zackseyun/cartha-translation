  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: ru
  text: Поспешите, сойдите вы и ваши домочадцы, чтобы голод не погубил вас и чтобы вы не горевали о своём имуществе. Ведь ради сохранения[a] Бог послал меня впереди вас, чтобы они жили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради сохранения остатка»; или: «ради выживания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: 'Поспешите: сойдите'
  rationale: Наречие ፍጡነ («быстро, поспешно») естественнее связывается с непосредственно следующим повелением ረዱ («сойдите»), а не с последующим сообщением о Божьем посланничестве.
- source_word: ኢትትሐጐሉ፡ በዐባር
  choice: чтобы голод не погубил вас
  rationale: Передаёт угрозу уничтожения или гибели от голода естественным современным русским выражением.
- source_word: ኢትትከዙ
  choice: чтобы вы не горевали
  rationale: Глагол означает печалиться, скорбеть, тревожиться; значение «погибнуть» здесь неуместно и создало бы повтор предыдущего глагола.
- source_word: በእንተ፡ ጥዕንትከሙ
  choice: о своём имуществе
  rationale: Сохраняет смысл причины или предмета скорби и передаёт множественное притяжательное выражение естественно по-русски.
- source_word: ለሠሪዕ
  choice: ради сохранения
  rationale: Сохраняет широкий смысл цели — сохранение, выживание или сбережение остатка — без чрезмерного уточнения в основном тексте.
- source_word: ይሕየዉ
  choice: чтобы они жили
  rationale: Форма глагола — третье лицо множественного числа, не каузативное единственное; буквальная множественность сохранена, несмотря на неявный референт.
theological_decisions:
- issue: Цель того, что Бог послал Иосифа вперёд
  choice: ради сохранения
  alternative: ради сохранения остатка / ради выживания
  rationale: Основной текст не уточняет, идёт ли речь именно об «остатке» как богословски нагруженном понятии; более широкая формулировка сохраняет смысловую напряжённость источника.
- issue: Субъект формы «чтобы они жили»
  choice: сохранить третье лицо множественного числа без явного уточнения
  alternative: чтобы Он сохранил вас в живых
  rationale: Источник имеет форму третьего лица множественного числа; замена на Бога как единственного субъекта и каузатив «сохранил» грамматически и богословски разрешила бы неоднозначность, которой текст не разрешает.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повеление передано энергично, но без архаизмов. Неявный референт местоимения «они» сохранён согласно грамматике геэзского текста; сноска поставлена непосредственно после спорной фразы.
