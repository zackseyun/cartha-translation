lexical_decisions:
- source_word: ዘይወስዱ፡ ስርናየ
  choice: навьюченных зерном
  rationale: Причастный оборот передаёт ослов, несущих зерно, естественным современным русским выражением.
- source_word: ወፈነዎሙ
  choice: И он отпустил их
  rationale: Сохраняет субъект в единственном числе и значение отправления людей в путь.
- source_word: ወዐርጉ
  choice: Они поднялись
  rationale: Формально сохраняет пространственный глагол «подняться/взойти», не заменяя его толкованием «отправились».
- source_word: ይበፍር፡ ስርናየ
  choice: раздаёт зерно
  rationale: Передаёт действие распределения зерна без добавления мотива или условий раздачи.
- source_word: ለኵሉ፡ አሕዛበ፡ ምድር
  choice: всем народам земли
  rationale: Сохраняет универсальный охват и множественное число «народы».
- source_word: ወይኴንን
  choice: и правит
  rationale: Передаёт продолжающееся владычество; краткая форма сохраняет незавершённо-продолжительный характер исходной фразы.
