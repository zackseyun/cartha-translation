  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: ru
  text: 'И было: когда они вышли оттуда, Иосиф сказал управляющему его домом: «Погонись за ними, беги и настигни их. Скажи им: „За добро вы отплатили мне злом: вы украли у меня серебряную чашу, из которой пьёт мой господин“». А их младшего брата приведи ко мне обратно — приведи его скорее, прежде чем я приступлю к суду[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная часть стиха в такой сегментации трудна для понимания. По-видимому, Иосиф велит немедленно привести младшего брата обратно, прежде чем он приступит к разбирательству; точный смысл оборота неясен.
    reason: segmentation_note
lexical_decisions:
- source_word: ለብእሲ፡ ቤቱ
  choice: управляющему своим домом
  rationale: Буквально «мужу/человеку своего дома»; в контексте речь идёт о домашнем управляющем Иосифа.
- source_word: ደግፎሙ፡ ሩጽ፡ ወተአንዞሙ
  choice: Погонись за ними, беги и настигни их
  rationale: Переданы три последовательных повеления без добавления отсутствующего в источнике «встань».
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: За добро вы отплатили мне злом
  rationale: ህየንተ означает «вместо»; по-русски противопоставление естественно выражается формулой «за добро… злом», без вопросительного «почему».
- source_word: ሠረቅክሙኒ
  choice: вы украли у меня
  rationale: 'Сохранён объектный суффикс первого лица единственного числа: чашу украли «у меня».'
- source_word: ወአገብአ፡ ሊተ፡ ለአኁሆሙ፡ ዘይንእስ
  choice: А их младшего брата приведи ко мне обратно
  rationale: Это отдельное распоряжение управляющему; местоимение передано как «их», а не «вашего».
- source_word: ዘእንበለ፡ እባእ፡ ውስተ፡ ምኵናንየ
  choice: прежде чем я приступлю к суду
  rationale: ዘእንበለ передано временным «прежде чем», а идиома «войти в мой суд» выражена понятным современным русским оборотом.
theological_decisions:
- issue: Границы прямой речи и субъект заключительного повеления
  choice: Закрыть передаваемую братьям речь после слов о чаше; затем передать распоряжение Иосифа управляющему о младшем брате
  alternative: Включить слова о младшем брате и суде в речь, которую управляющий должен произнести братьям
  rationale: Форма «их младшего брата» и повеление «приведи ко мне» указывают на обращение Иосифа к управляющему, хотя сегментация заключительной части стиха остаётся трудной.
- issue: Образ суда в заключительной фразе
  choice: «прежде чем я приступлю к суду»
  alternative: 'Буквально: «прежде чем я войду в мой суд»'
  rationale: Выбран естественный русский эквивалент без уточнения характера суда и без богословского истолкования неясной идиомы.
translation_notes:
  register: Современный литературный русский язык с сдержанным повествовательным достоинством. Сохранена повторность повелений и различие между словами, которые управляющий должен сказать братьям, и последующим распоряжением Иосифа.
