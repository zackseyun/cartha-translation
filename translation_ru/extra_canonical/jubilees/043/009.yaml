  yaml_path: translation/extra_canonical/jubilees/043/009.yaml
  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: ru
  text: 'И они пришли к Иосифу, и все пали перед ним ниц, лицом до земли. Иосиф сказал им: «Зло вы сделали». Они ответили: «Что нам сказать и чем оправдаться? Господь наш обнаружил их вину».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обнаружил их вину». По смыслу речи братьев ожидалось бы: «обнаружил нашу вину»; ср. Быт 44:16: «Бог обнаружил вину рабов твоих».'
    reason: В геэзском тексте стоит местоименное окончание третьего лица множественного числа, тогда как контекст и параллель в Бытии предполагают первое лицо или выражение «рабов твоих».
lexical_decisions:
- source_word: ሰገዱ፡ ሎቱ፡ ኵሎሙ፡ በገጾሙ፡ ውስተ፡ ምድር
  choice: все пали перед ним ниц, до земли
  rationale: Передаёт поклон всех братьев лицом к земле естественным и торжественным русским оборотом, не добавляя отсутствующего в источнике упоминания дома.
- source_word: እኩየ፡ ገበርክሙ
  choice: Зло вы сделали
  rationale: Сохраняет прямую оценку поступка и порядок смысловых компонентов исходного выражения.
- source_word: ምነት፡ ንትዋቀስ
  choice: чем оправдаться?
  rationale: По контексту глагол обозначает попытку дать оправдание или защитить себя; русский вопрос звучит естественно и не снимает напряжения сцены.
- source_word: እግዚእነ
  choice: Господь наш
  rationale: Форма означает «наш Господь»; прописная буква отражает вероятное указание на Бога в свете контекста и параллели Быт 44:16, а не обращение к Иосифу.
- source_word: ረከበ፡ አበሳሆሙ
  choice: обнаружил их вину
  rationale: Буквально сохраняет засвидетельствованное в представленном геэзском тексте местоименное окончание третьего лица множественного числа («их»), несмотря на контекстуальную трудность.
theological_decisions:
- issue: Кого обозначает «Господь наш»
  choice: Бог
  alternative: Иосиф как господин братьев
  rationale: Форма «наш Господь» и параллель Быт 44:16 поддерживают отнесение к Богу; прописная буква делает это чтение явным, не вводя конфессиональной особенности.
- issue: Чья вина обнаружена
  choice: их вина — по сохранившемуся тексту
  alternative: наша вина / вина рабов твоих — по контексту и параллели Быт 44:16
  rationale: Исходная строка оканчивается формой አበሳሆሙ, буквально «их вина»; перевод не исправляет её молча по библейской параллели, а отмечает контекстуально ожидаемое чтение в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Краткие реплики сохраняют суровость сцены; архаизмы сведены к общеупотребительному библейскому обороту «пали ниц». Маркер сноски помещён непосредственно после спорной фразы.
