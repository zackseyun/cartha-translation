  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: ru
  text: Не плачьте обо мне, но поспешите и приведите моего отца ко мне. Вы видите[a], что говорят именно мои уста, и глаза моего брата Вениамина тоже это видят. Ведь вот уже второй год голода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы увидите».'
    reason: Глагольная форма может иметь настоящее или будущее значение.
  - marker: b
    text: 'Или: «вот второй год голода».'
    reason: Сохраняет более близкий к порядку слов оригинала вариант заключительной фразы без добавления значения длительности или «проведённого в голоде» года.
lexical_decisions:
- source_word: ወትሬእዩ
  choice: «вы видите»
  rationale: Форма допускает настоящее или будущее значение; настоящее время естественно передаёт непосредственное свидетельство братьев и сохраняет связь с текущей речью Иосифа.
- source_word: ዘይነብብ፡ አፉየ
  choice: «что это мои уста говорят с вами»
  rationale: Сохраняет эмфатическую формулировку источника о собственных устах Иосифа; «с вами» естественно выражает адресованную братьям речь, не меняя смысла.
- source_word: ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: «вот уже второй год голода»
  rationale: Кратко и естественно передаёт указание на второй год голода, не внося отсутствующего в данном стихе упоминания о пяти оставшихся годах.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified biblical cadence; повеления переданы прямо, а указательное «ведь вот» сохраняет выразительность исходного እስመ፡ ናሁ без архаизации.
