  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: ru
  text: Наш отец любит его, и его душа связана с душой юноши. И когда мы придём к твоему слуге, нашему отцу, если юноши не будет с нами, он умрёт, и мы подвергнем нашего отца смертельному горю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያፈቅሮ
  choice: любит его
  rationale: Прямо передаёт значение глагола «любить» и сохраняет объект мужского рода из контекста.
- source_word: ነፍሱኒ፡ እስርት፡ እምነፍስዝ
  choice: его душа связана с душой юноши
  rationale: Сохраняет образ взаимосвязанности душ; «юноши» естественно проясняет указательное выражение, относящееся к Вениамину.
- source_word: ወሬዛ
  choice: юноша
  rationale: Передаёт обозначение молодого человека без снижения регистра до разговорного «мальчик».
- source_word: ይመውት
  choice: он умрёт
  rationale: Не добавляет отсутствующее в источнике существительное «старик»; референт местоимения определяется контекстом.
- source_word: ንቀጽዕ
  choice: сведём
  rationale: В сочетании с «горем» и пределом «в могилу/до смерти» естественно выражает причинение отцу смертельного горя, не подменяя глагол формой, буквально означающей «низводить».
- source_word: በሐዘን፡ እስክ
  choice: горем … в могилу
  rationale: Идиоматически передаёт инструментальное «печалью/горем» и конечный предел «до смерти», сохраняя торжественный библейский образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранён образ связанной души; местоимение «он» оставлено неоднозначным на формальном уровне, хотя контекст указывает на отца. В финале выбран естественный русский идиоматический оборот, а отличительная лексика геэзского текста отмечена в сноске.
