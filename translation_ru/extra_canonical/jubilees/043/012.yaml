review_pass:
  verdict: revise
  source_fidelity: Начальное «ведь» не имеет явного соответствия в данном геэзском тексте. Союз «а» в условной части ослабляет/изменяет значение እምከመ («если»). Финальное «сведём ... в могилу» воспроизводит традиционный образ параллели в Бытии, но не передаёт отличительный глагол ንቀጽዕ («причинять страдание, поражать, подвергать страданию»).
  naturalness: Текст в целом литературен. «Если юноши не будет с нами» и «подвергнем нашего отца смертельному горю» естественны для современного литературного русского и сохраняют высокий повествовательный регистр.
  terminology: «Душа», «юноша» и «твой слуга, наш отец» переданы уместно. «Душа связана с душой юноши» сохраняет образ источника. Не следует заменять глагол причинения страдания оборотом о сведении в могилу.
  issues:
  - severity: medium
    issue: Необоснованное «ведь» в начале
    rationale: В представленном источнике стих начинается с утверждения «наш отец любит его» без частицы, соответствующей «ведь».
  - severity: medium
    issue: «А юноши не будет с нами» вместо условия
    rationale: Геэзское እምከመ вводит условие; по-русски требуется «если юноши не будет с нами».
  - severity: high
    issue: «Сведём нашего отца в могилу» подменяет глагол источника
    rationale: ንቀጽዕ означает причинить страдание/поразить, а не «свести» или «низвести». Формулировка также чрезмерно сближает стих с генезисной параллелью, где употреблён иной глагол.
