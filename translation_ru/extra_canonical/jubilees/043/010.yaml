  text: his servants. Look, we are servants to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my servant, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: ru
  text: 'его рабами. «Вот, мы — рабы нашего господина, и мы, и наши ослы тоже». Иосиф сказал им: «Боже упаси меня так поступить![a] Вы ступайте по домам своим, а ваш младший брат будет моим рабом, потому что вы сделали зло. Разве вы не знали, что человек непременно гадает с помощью своей чаши, как это делаю я?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза, переведённая как «Боже упаси меня так поступить», в геэзском тексте неясна. По контексту Иосиф решительно отвергает предложение сделать рабами всех братьев и настаивает, что останется только тот, у кого была найдена чаша.
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: рабы / моим рабом
  rationale: Передаёт обозначение подневольного статуса прямо и последовательно, не смягчая его до «слуг».
- source_word: አእዱጊነሂ
  choice: и даже наши ослы
  rationale: Сохраняет необычное включение ослов в предложение братьев; частица передана словом «даже» для естественности по-русски.
- source_word: ያስተቀስም … ጽዋዖ
  choice: гадает с помощью своей чаши
  rationale: Передаёт гадание посредством чаши и сохраняет напряжение повествования, не объясняя, действительно ли Иосиф практиковал гадание.
- source_word: አብያቲክሙ
  choice: по домам своим
  rationale: Сохраняет множественное число исходного выражения, оставаясь понятным в современном русском языке.
theological_decisions:
- issue: Упоминание гадания Иосифа
  choice: «как это делаю я» сохранено как часть прямой речи
  alternative: Истолковать фразу как притворство Иосифа или убрать утверждение о его гадании
  rationale: Источник оставляет характер заявления неразъяснённым; перевод не должен заранее снимать повествовательную и богословскую неоднозначность.
- issue: Трудная формула отказа Иосифа
  choice: «Боже упаси меня так поступить!»
  alternative: Буквальная, но неясная передача вроде «Бог удержал/заставил бояться»
  rationale: Контекст ясно указывает на решительный отказ сделать всех братьев рабами, однако трудность исходной формулировки отмечена сноской.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Сохранены начальный фрагмент предложения, необычное упоминание ослов, терминология рабства и неоднозначное заявление о гадании. Маркер сноски поставлен непосредственно после трудной фразы.
