  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: ru
  text: 'И сказал Иуда: «Прошу тебя, господин мой, позволь рабу твоему сказать слово господину моему. Его мать родила двух братьев рабу твоему, отцу нашему.[a] Один ушёл и пропал, и никто не нашёл его; он один остался от своей матери, и раб твой…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «У отца нашего, раба твоего, было два сына от одной матери».'
    reason: Буквальный синтаксис геэзского текста — «его мать родила двух братьев рабу твоему, отцу нашему» — допускает более естественную по-русски передачу через отношение отца к двум сыновьям, но основной текст сохраняет лексику и структуру источника.
lexical_decisions:
- source_word: ሳዕሌየ፡ እግዚኦ
  choice: Прошу тебя, господин мой
  rationale: Передаёт почтительную мольбу Иуды естественным современным русским языком.
- source_word: ቃለ፡ ውስተ፡ እዝነ፡ እግዚእየ
  choice: сказать слово вслух господину моему
  rationale: Буквальный образ «в уши господина моего» по-русски звучит неестественно; «вслух» сохраняет смысл личного обращения в пределах слышимости господина.
- source_word: ክልኤተ፡ አኀወ
  choice: двух братьев
  rationale: Сохраняет прямое значение «два брата», не заменяя его истолковывающим «два сына».
- source_word: ወፅአ፡ ወተገደፈ
  choice: ушёл и пропал
  rationale: Передаёт последовательность ухода и утраты; формулировка согласуется с последующим сообщением, что его никто не нашёл.
- source_word: ባሕቲቱ፡ ተረፈ፡ እምእሙ
  choice: он один остался от своей матери
  rationale: Сохраняет акцент на единственном оставшемся сыне этой матери и местоименную форму исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с уважительной придворной речью. Повтор «раб твой / рабу твоему» сохранён как характерная формула смиренного обращения. Конечное многоточие отражает незавершённость исходного фрагмента. Начальные слова предоставленного геэзского отрывка о чаше относятся к предшествующей реплике и не включены в стих 43:11 согласно границе стиха в консультационном слое.
