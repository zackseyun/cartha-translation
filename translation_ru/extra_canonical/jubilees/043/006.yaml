translation:
  language: ru
  text: '«Мы станем рабами нашего господина». Но он сказал им: «Нет, не так. Лишь тот человек, у которого я нашёл её, — он один…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ
  choice: мы станем рабами
  rationale: Форма выражает служение и подчинённое положение; в контексте угрозы порабощения за найденную чашу русское «станем рабами» точнее, чем более мягкое «будем служить».
- source_word: ለእግዚእነ
  choice: нашего господина
  rationale: Передаёт существительное со значением «господин, владыка» и притяжательный суффикс первого лица множественного числа.
- source_word: ወይቤሎሙ
  choice: Но он сказал им
  rationale: Глагол прямо вводит ответ, обращённый к ним; союз по функции в данном контексте естественно передаётся противительным «но».
- source_word: አኮ፡ ከማሁ
  choice: Нет, не так
  rationale: Сохраняет краткое и решительное отрицание предложенного братьями общего наказания.
- source_word: ዘረከብክዎ
  choice: у которого я нашёл её
  rationale: Форма глагола содержит явный субъект первого лица единственного числа, поэтому выбран активный перевод «я нашёл», а не пассивное «она найдена». Женское «её» по-русски соотносится с подразумеваемой чашей из контекста.
- source_word: ኪያሁ፡ ባሕቲቶ
  choice: он один
  rationale: Эмфатическое местоимение и ограничительное слово подчёркивают, что наказанию подлежит только этот человек.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Сохранена незавершённость фрагмента исходного стихового сегмента многоточием; начальная реплика также оставлена как продолжение речи из предыдущего контекста. «Господин» написано со строчной буквы, поскольку речь идёт о человеческом властителе.
