  yaml_path: translation/extra_canonical/jubilees/044/007.yaml
  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: ru
  text: И поднялись его сыновья и внуки и поместили своего отца и своё имущество на повозки. Шестнадцатого дня третьего месяца Израиль отправился от Колодца Клятвы и пошёл в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉዱ፡ ወውሉደ፡ ውሉዱ
  choice: его сыновья и внуки
  rationale: 'Буквально: «его сыновья и сыновья его сыновей»; «внуки» естественно и точно передаёт родственную связь по-русски.'
- source_word: አጽዐኑ፡ አበሆሙ፡ ወንዋዮሙ፡ ዲበ፡ ሰረገላት
  choice: посадили своего отца на повозки и погрузили на них всё своё имущество
  rationale: Глагол имеет значение погрузки или помещения груза; русская формулировка различает человека и имущество, не меняя состава действия.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Колодец Клятвы
  rationale: Передано значение геэзского наименования («колодец клятвы»), соответствующего Беэр-Шеве, без замены смыслового названия одной транслитерацией.
- source_word: ዐሡሩ፡ ወስዱሱ፡ ለዝ፡ ወርኅ፡ ሣልስ
  choice: шестнадцатого дня третьего месяца
  rationale: Естественная русская передача календарной даты; указательное «этого» опущено как избыточное в данном контексте.
- source_word: ብሔረ፡ ግብጽ
  choice: в Египет
  rationale: Буквально «в землю Египта»; краткая форма естественна в современном русском и сохраняет направление движения.
theological_decisions: []
translation_notes:
