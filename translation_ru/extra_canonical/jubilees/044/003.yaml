  yaml_path: translation/extra_canonical/jubilees/044/003.yaml
  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: ru
  text: 'Пока он размышлял, не послать ли за Иосифом, чтобы тот пришёл к нему, и не спускаться ли ему самому, он оставался там семь дней, ожидая видения, которое открыло бы, остаться ему или спуститься.[a] И он отпраздновал праздник жатвы первых плодов старого зерна, потому что во всей земле Ханаанской не было ни горсти посеянного зерна: голод постиг всех диких животных, весь скот, всех птиц и всех людей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало стиха в дошедшем геэзском тексте синтаксически затруднено. По-видимому, Иаков семь дней ждал подтверждающего видения, размышляя, вызвать ли Иосифа к себе или самому спуститься к нему.
    reason: textual_variant
lexical_decisions:
- source_word: ይልአክ፡ ለዮሴፍ፡ ከመ፡ ይምጻእ፡ ኀቤሁ
  choice: не послать ли за Иосифом, чтобы тот пришёл к нему
  rationale: Передаёт намерение послать к Иосифу с целью вызвать его к себе; по-русски «послать за Иосифом» естественно выражает этот смысл.
- source_word: ሰቡዐ፡ ዕለተ
  choice: семь дней
  rationale: Прямое и естественное соответствие исходному выражению.
- source_word: ይርአይ፡ ራእየ
  choice: ожидая видения, которое открыло бы
  rationale: Буквально речь идёт о том, чтобы «увидеть видение»; контекст показывает, что Иаков ждал через него указания, но формулировка не утверждает, что видение действительно последовало.
- source_word: በዓለ፡ ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: праздник жатвы первых плодов
  rationale: Сохраняет оба элемента исходного текста — «жатва» и «первые плоды», не сокращая выражение до одного лишь праздника первых плодов.
- source_word: እምሥርናይ፡ ብሉይ
  choice: старого зерна
  rationale: Передаёт указание на зерно прежнего урожая; более узкое «старая пшеница» возможно, но «зерно» лучше согласуется с дальнейшим общим упоминанием посевного зерна.
- source_word: አልቦ፡ ... ምልአ፡ እደ፡ ምንተኒ፡ ዘርአ
  choice: не было ни горсти посеянного зерна
  rationale: Воспроизводит образ «наполнения руки», то есть горсти, и связывает «семя» с земледельческим контекстом.
- source_word: ዐባር
  choice: голод
  rationale: Слово обозначает голод; оно должно быть явно отражено, а не понято как подразумеваемая пища для животных и людей.
- source_word: አራዊት፡ ለእንስሳ፡ ወለአዕዋፍ፡ ወለሰብእኒ
  choice: всех диких зверей, домашний скот, птиц и людей
  rationale: Различает диких животных и скот и сохраняет все перечисленные группы.
theological_decisions:
- issue: Характер ожидаемого откровения
  choice: Иаков ожидает видения, которое укажет, остаться ему или спуститься
  alternative: Иаков намеренно ищет божественного знамения или уже получает видение
  rationale: Исходный текст говорит об ожидании видения, но не уточняет способ его получения и не сообщает в этом стихе, что оно уже было дано; перевод не добавляет таких утверждений.
- issue: Связь праздника с обрядовым календарём
  choice: Сохранено описательное название «праздник жатвы первых плодов»
  alternative: Отождествить его с конкретным позднейшим названием праздника
  rationale: Текст описывает праздник лексически, но здесь не требует конфессионально или исторически более узкой идентификации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксически трудное начало сделано понятным без устранения альтернативы между пребыванием на месте и спуском; сельскохозяйственная и зоологическая лексика передана общеупотребительными словами.
