  text: 'And the sons of Asher: Imnah, Ishvah, Beriah, and Serah, their sister—four. All the persons were sixteen, and all the persons of Leah were forty-nine.'
translation:
  language: ru
  text: 'Сыновья Асира: Имна, Ишва, Ишви[a] и Берия; и одна их сестра Сара — всего пятеро. Всего было шестнадцать человек, а всех потомков Лии — сорок девять.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя «Ишви» в издании источника заключено в скобки. Если его не учитывать, перечислены лишь четверо, хотя далее в тексте стоит: «пятеро».'
    reason: Сохраняет редакционную неопределённость исходного издания и объясняет расхождение между перечнем и итоговым числом при исключении имени.
lexical_decisions:
- source_word: ነፍስ
  choice: человек
  rationale: В родословном подсчёте геэзское «душа» обозначает отдельного человека; современное русское «человек» естественно передаёт смысл и сохраняется для счёта шестнадцати.
- source_word: ኵሉ፡ ዘልያ
  choice: всех потомков Лии
  rationale: Буквально конструкция означает «всё/все Лии»; в данном родословном контексте речь идёт о совокупности её потомков.
- source_word: እኅቶሙ፡ አሐቲ
  choice: одна их сестра
  rationale: Сохранены и родственное обозначение, и явно выраженное числительное женского рода.
- source_word: አሴር / ሳራ
  choice: Асир / Сара
  rationale: Использованы привычные русские библейские формы имён.
