translation_notes:
  register: Современный литературный русский язык; родословный перечень передан кратко и торжественно. Повтор слова ነፍስ по смыслу отражён в счётных формулах, а не заменён понятием рода или линии. Итог «пятеро» следует геэзскому тексту, несмотря на чтение «четверо» в английском консультационном слое.
