  text: And Jacob remembered the dream that he had seen at Bethel, and he was afraid to go down into Egypt.
translation:
  language: ru
  text: И вспомнил Иаков сон, который видел в Вефиле, и побоялся идти в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከረ
  choice: вспомнил
  rationale: Прямо передаёт значение глагола и естественно звучит в современном русском повествовании.
- source_word: ሕልመ፡ ዘርእየ
  choice: сон, который видел
  rationale: Сохраняет исходную конструкцию «сон, который он видел», не заменяя её более свободным «сон, который ему приснился».
- source_word: በቤቴል
  choice: в Вефиле
  rationale: Употреблена традиционная русская форма библейского топонима Бет-Эль с нормативным предложным падежом.
- source_word: ፈርሀ
  choice: побоялся
  rationale: Передаёт страх как причину нерешительности перед последующим действием и естественно сочетается с инфинитивом.
- source_word: ፈደ፡ ውስተ፡ ግብጽ
  choice: идти в Египет
  rationale: В данном контексте глагол движения означает отправление в Египет; русское «идти» сохраняет смысл без ненужного уточнения направления как «спуститься».
theological_decisions:
- issue: Связь страха Иакова с воспоминанием о сне в Вефиле
  choice: 'Сохранена простая последовательность: вспомнил сон и побоялся идти.'
  alternative: Явно представить сон причиной страха или истолковать его содержание.
  rationale: Исходный текст не разъясняет причинную связь и не уточняет, какой именно аспект сна вызвал страх; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис краткий и ясный; архаизмы и добавочные толкования исключены.
