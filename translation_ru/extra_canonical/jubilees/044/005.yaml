  text: And he said to him, “I am the God of your fathers, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.”
translation:
  language: ru
  text: 'И сказал ему: «Я — Бог твоих отцов[a], Бог Авраама и Исаака. Не бойся, сойди в Египет, потому что там Я сделаю тебя великим народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых параллельных текстах: «твоего отца».'
    reason: Отмечает значимое разночтение с параллельной традицией, не подменяя чтение представленного эфиопского источника.
lexical_decisions:
- source_word: አምላከ፡ አቡከ
  choice: Бог твоих отцов
  rationale: В представленном эфиопском тексте форма передаёт множественное число; последующее уточнение «Бог Авраама и Исаака» поддерживает это прочтение.
- source_word: ወሪደ፡ ግብጽ
  choice: сойди в Египет
  rationale: Сохранён обычный для библейского повествования глагол движения «сойти», соответствующий направлению пути и формулировке источника.
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስየከ
  choice: там Я произведу от тебя великий народ
  rationale: Естественная русская передача обещания сделать адресата родоначальником великого народа; местоимение «там» отражает በህየ в следующей позиции исходной фразы.
theological_decisions:
- issue: Число в выражении «Бог твоего отца/твоих отцов»
  choice: Бог твоих отцов
  alternative: Бог твоего отца
  rationale: Сохранено множественное число данной версии Книги Юбилеев, а не единственное число параллельного места в Бытии 46:3.
