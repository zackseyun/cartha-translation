  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: ru
  text: И Израиль послал впереди себя Иуду к своему сыну Иосифу, чтобы Иуда осмотрел[a] землю Гесем, потому что Иосиф велел своим братьям прийти и поселиться там, чтобы они были рядом с ним. Это была лучшая[b] часть земли Египетской, близкая к нему, — для всех них и для их скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подготовить».'
    reason: Глагол допускает традиционное контекстуальное понимание «подготовить», хотя основное значение здесь — осмотреть или обследовать.
  - marker: b
    text: 'Буквально: «она была лучшей в земле Египетской».'
    reason: Сохраняется оттенок исходного выражения, которое можно понять как указание на лучшую часть Египта.
lexical_decisions:
- source_word: ያስተዳሉ
  choice: осмотрел
  rationale: По контексту глагол передает обследование или осмотр земли; это точнее, чем гармонизирующее «приготовил».
- source_word: ምድረ፡ ጌሴም
  choice: землю Гесем
  rationale: Традиционная русская передача географического названия с сохранением обозначения области.
- source_word: ሠናይት
  choice: лучшая
  rationale: В данном контексте выражение указывает не просто на хорошую землю, а на лучшую часть Египта.
- source_word: ለእንስሳሂ
  choice: для их скота
  rationale: Контекст переселения семьи и параллельная библейская традиция указывают на домашних стадных животных.
