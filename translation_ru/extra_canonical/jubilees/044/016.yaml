  text: 'And the sons of Zilpah[16], Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.'
translation:
  language: ru
  text: 'А сыновья Зелфы[a], служанки Лии, которых она родила Иакову, — Гад и Асир. Вот имена их сыновей, вошедших вместе с ним в Египет. Сыновья Гада: Цифион, Хагги, Шуни, Эцбон, Ери, Ароди и Арели — семеро.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленной строковой сегментации одно имя в перечне сыновей Гада не сохранилось полностью; «Арели» восстановлено по наиболее вероятной последовательности имён, засвидетельствованной геэзской и библейской традицией.
    reason: segmentation_note
