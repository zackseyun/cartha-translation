  yaml_path: translation/extra_canonical/jubilees/044/027.yaml
  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: ru
  text: Всех людей Иакова, вошедших в Египет, было семьдесят. Это были его сыновья и сыновья его сыновей[a] — всего семьдесят пять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Подсчёт в этой главе намеренно дан непросто: сначала говорится о семидесяти вошедших в Египет, затем — о семидесяти пяти сыновьях и внуках; далее поясняется, что пятеро умерли в Египте, причём Иосиф и двое его сыновей в это сообщение о смерти не включены.'
    reason: cross_reference
lexical_decisions:
- source_word: ኵሉ፡ መንፈስ፡ ዘያዕቆብ
  choice: всех душ дома Иакова
  rationale: В данном счётном контексте መንፈስ обозначает людей, причисленных к семье Иакова. «Душ» сохраняет библейскую образность, а «дома» естественно передаёт подразумеваемую семейную общность.
- source_word: ዘቦአ፡ ውስተ፡ ግብጽ
  choice: вошедших в Египет
  rationale: Формально и ясно передаёт глагол «войти» и направление движения.
- source_word: ውሉዱ፡ ወውሉደ፡ ውሉዱ
  choice: его сыновья и сыновья его сыновей
  rationale: Сохраняет повтор и точно передаёт две названные в источнике степени родства, не заменяя вторую обобщающим «потомки».
- source_word: ሰብዓ፡ … ሰብዓ፡ ወኃምስቱ
  choice: семьдесят … всего семьдесят пять
  rationale: Оба числа переданы как стоят в источнике; добавленное «всего» естественно выражает итоговый характер второй суммы, не устраняя расхождения.
theological_decisions:
- issue: Расхождение между числами семьдесят и семьдесят пять
