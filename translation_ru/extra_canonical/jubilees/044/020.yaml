  text: 'And the sons of Benjamin: Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard—ten.'
translation:
  language: ru
  text: 'Сыновья Вениамина: Бела, Бехер, Ашбел, Гера, Нааман, Ехи, Рош, Муппим, Хуппим и Ард — одиннадцать.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте сказано «одиннадцать», хотя в перечне приведены десять имён. Некоторые переводы исправляют итог на «десять».
    reason: Сохраняет явное разночтение между итоговым числом источника и фактическим количеством перечисленных имён, не исправляя текст молча.
