  choice: Бела, Бехер, Ашбел, Гера, Нааман, Ехи, Рош, Муппим, Хуппим и Ард
  rationale: Имена переданы в формах, узнаваемых по русской библейской традиции, с сохранением всех десяти имён и их порядка в геэзском тексте.
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: одиннадцать
  rationale: Буквально «десять и один»; перевод следует представленному геэзскому источнику, хотя перечислено десять имён.
