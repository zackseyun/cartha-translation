base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: ru
  text: '[Вот имена сыновей Валлы, служанки][a] Рахили, жены Иакова, которых Валла родила Иакову: Дан и Неффалим. А вот имена их детей, пришедших с ними в Египет: сыновья Дана — Хусим и Самон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальные слова восстановлены по контексту полного стиха: в предоставленном фрагменте геэзского текста начало предложения утрачено из-за разделения текста.'
    reason: segment_reconstruction
lexical_decisions:
- source_word: ለራሔል፡ ብእሲቱ፡ ለያዕቆብ
  choice: Рахили, жены Иакова
  rationale: Сохраняет принадлежность служанки Рахили и приложение «жены Иакова» в соответствии с синтаксисом восстановленного начала стиха.
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: которых Валла родила Иакову
  rationale: Женская форма глагола передана действительным залогом; имя «Валла» повторено вместо потенциально двусмысленного русского местоимения «она», чтобы не приписать материнство Рахили.
- source_word: እለ፡ ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  choice: пришедших с ними в Египет
  rationale: Прямо передаёт движение в Египет и совместность действия без добавочного толкования.
- source_word: ሑሲም፡ ወሳሞን
  choice: Хусим и Самон
  rationale: Имена переданы близко к геэзским формам Ḥusim и Samon, без гармонизации с иными текстовыми традициями.
theological_decisions:
- issue: Кто родил Дана и Неффалима
  choice: Валла родила их Иакову
  alternative: Рахили родились от Иакова Дан и Неффалим
  rationale: Женская форма ዘወለደት требует действительного значения «она родила»; восстановленный субъект из утраченного начала — Валла, служанка Рахили, а не Рахиль.
- issue: Отнесение выражения «их дети»
  choice: Сохранено общее множественное «их детей», после чего перечислены сыновья Дана
  alternative: Уточнить, что речь только о детях Дана
  rationale: Исходный текст сначала говорит о детях Дана и Неффалима вместе, а затем начинает перечень с сыновей Дана; эта структура сохранена без устранения возможного напряжения.
translation_notes:
  register: Современный литературный русский с сохранением традиционных русских библейских имён «Валла», «Дан», «Неффалим». Квадратные скобки явно отмечают восстановленное начало; тире естественно вводит перечень сыновей Дана.
