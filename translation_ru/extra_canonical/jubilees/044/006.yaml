  yaml_path: translation/extra_canonical/jubilees/044/006.yaml
  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: ru
  text: «Я сойду с тобой и Я выведу тебя. В этой земле ты будешь погребён, и Иосиф положит руки[a] на твои глаза. Не бойся, иди в Египет».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В древнееврейском тексте Быт 46:4: «руку».'
    reason: Основной текст сохраняет множественное число «руки» геэзского текста Юбилеев; примечание кратко отмечает значимый вариант в параллельном библейском тексте.
lexical_decisions:
- source_word: አነ እወርድ ምስሌከ
  choice: Я сойду с тобой
  rationale: Прямо передаёт обещание Божьего присутствия и совместного нисхождения, сохраняя образ движения в Египет.
- source_word: ወአነ አወጽአከ
  choice: и Сам выведу тебя оттуда
  rationale: Повторное местоимение передано усилительным «Сам»; глагол означает выведение наружу. «Оттуда» естественно уточняет подразумеваемый Египет, не превращая фразу в однозначное указание лишь на личное возвращение Иакова.
- source_word: ትትቀበር
  choice: ты будешь погребён
  rationale: Достоинная современная формулировка, точно передающая пассивную форму со значением погребения.
- source_word: ያነብር እዴሁ ዲበ አዕይንቲከ
  choice: Иосиф положит руки на твои глаза
  rationale: Сохранён конкретный жест у смертного одра; множественное «руки» следует засвидетельствованной редакционной оценке текста Юбилеев и его соответствию греческой форме Быт 46:4.
- source_word: ኢትፍራህ ረድ ውስተ ግብጽ
  choice: Не бойся, иди в Египет
  rationale: Передаёт запрет страха и повеление спуститься в Египет естественным русским языком; направление уже выражено предыдущим «сойду».
theological_decisions:
- issue: Смысл обещания «вывести» Иакова
