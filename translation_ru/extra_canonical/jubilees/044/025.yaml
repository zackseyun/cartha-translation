    28. ለራሔል፡ ብእሲቱ፡ ለያዕቆብ፡ ዘወለደት፡ ለያዕቆብ፡ ዳን፡ ወንፍታሌም። ወዝ፡ አስማተ፡ ውሉዶሙ፡ እለ፡ ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ፤ ወውሉደ፡ ዳን፡ ሑሲም፡ ወሳሞን፡

