base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/015.yaml
  text: 'These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.'
translation:
  language: ru
  text: Вот сыновья Иакова и их сыновья. Лия родила Иакову шестерых сыновей и одну дочь — их сестру Дину — в Месопотамии. Всего сыновей Лии и их сыновей, пришедших в Египет вместе со своим отцом Иаковом, было тридцать три человека; а вместе с их отцом Иаковом их было тридцать четыре.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ያዕቆብ፡ ወውሉዶሙ
  choice: сыновья Иакова и их сыновья
  rationale: Сохранена повторяющаяся родственная формула источника, различающая сыновей Иакова и следующее поколение.
- source_word: መስጴጦምያ
  choice: Месопотамия
  rationale: Употреблено общепринятое современное русское географическое название.
- source_word: ኵሉ፡ ነፍስ
  choice: всего … человек
  rationale: Буквально «всякая/вся душа» здесь обозначает число людей; естественный русский счётный оборот передаёт смысл без неуместной буквальности.
- source_word: ቦኡ፡ … ውስተ፡ ግብፅ
  choice: пришедших в Египет
  rationale: Передано направленное движение, выраженное глаголом «войти», естественным для русского повествования.
theological_decisions:
- issue: Включение Иакова в итоговый подсчёт
  choice: тридцать три человека; а вместе с их отцом Иаковом их было тридцать четыре
  alternative: считать Иакова уже включённым в число тридцати трёх
