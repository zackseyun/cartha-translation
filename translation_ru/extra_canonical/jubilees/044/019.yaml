  yaml_path: translation/extra_canonical/jubilees/044/019.yaml
  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: ru
  text: 'В Египте, до того как его отец пришёл в Египет, Асенефа, дочь Потифары, жреца Илиополя, родила Иосифу сыновей: Манассию и Ефрема — двоих.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተወልዱ፡ ለዮሴፍ
  choice: у Иосифа… родились сыновья
  rationale: Естественно передаёт эфиопскую конструкцию со значением рождения детей у Иосифа; мужской род уточняется последующими именами.
- source_word: ዘእንበለ፡ ይባእ፡ አቡሁ፡ ውስተ፡ ግብፅ
  choice: ещё до прихода его отца в Египет
  rationale: Сохраняет временное отношение «прежде чем его отец вошёл/пришёл в Египет» и по-русски звучит естественно.
- source_word: አስኔት
  choice: Асенефа
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: ጶጢፋራ
  choice: Потифар
  rationale: Передаёт имя источника и соответствует традиционной русской форме для данного лица в этом родословии.
- source_word: ካህን
  choice: жрец
  rationale: В контексте египетского культа это точнее современного русского «священник».
- source_word: ኤልዮጶሊስ
  choice: Илиополь
  rationale: Устоявшееся русское название древнеегипетского города Гелиополя; форма соответствует традиции русских библейских переводов.
- source_word: ፪
  choice: двое
  rationale: Сохраняет итоговый счёт перечисленных сыновей как отдельный элемент родословной.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, с умеренно библейским достоинством. Родословная структура и заключительный подсчёт сохранены; перегруженная относительная конструкция источника слегка упорядочена без изменения смысла.
