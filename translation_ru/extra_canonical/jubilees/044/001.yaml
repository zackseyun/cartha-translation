  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: ru
  text: И отправился Израиль из своего дома в Харане[a] в новолуние третьего месяца. Он пошёл по дороге к Колодцу Клятвы и в седьмой день этого месяца принёс жертву Богу своего отца Исаака.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте — «Харан»; вероятно, это ошибка переписчика вместо «Хеврон».
    reason: Чтение рукописной традиции сохранено в основном тексте, а вероятная текстовая ошибка разъяснена без молчаливого исправления.
lexical_decisions:
- source_word: ተንሥአ
  choice: отправился
  rationale: Буквально глагол означает «встал, поднялся»; в повествовании о начале пути естественно передаётся как «отправился».
- source_word: እምካራን፡ እምቤቱ
  choice: из своего дома в Харане
  rationale: Сохраняет засвидетельствованное геэзское название места и естественно объединяет повторяющуюся конструкцию с двумя предлогами «из».
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: в новолуние третьего месяца
  rationale: В календарном контексте ሠርቀ передаёт начало месяца, то есть новолуние.
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: по дороге к Колодцу Клятвы
  rationale: Передаёт составное географическое обозначение буквально и понятно; речь идёт о Вирсавии.
- source_word: ሦዐ፡ መሥዋዕተ
  choice: принёс жертву
  rationale: Устойчивое и точное русское выражение для совершения жертвоприношения.
theological_decisions:
- issue: Обозначение Бога через родственную связь
  choice: Богу своего отца Исаака
  alternative: Богу Исаака, своего отца
  rationale: Сохранена исходная формула без уточнения вида жертвы или дополнительных богословских интерпретаций.
