  text: And Asudi, and Iyak, and Solomon were six. And they died in the year they entered Egypt, and there remained to Dan
translation:
  language: ru
  text: И Асуди, Ияк и Соломон — всего шестеро. Они умерли в тот год, когда вошли в Египет, а у Дана остался…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «а Дан остался». В геэзском тексте буквально: «и остался Дану», причём фраза, вероятно, продолжается далее.'
    reason: Сохраняет отмеченную ранее альтернативу, но разъясняет дательную конструкцию и незавершённость фразы.
lexical_decisions:
- source_word: ወአሱዲ፡ ወኢያክ፡ ወስሎሞን፡
  choice: И Асуди, Ияк и Соломон
  rationale: Имена переданы транслитерацией; повторяющийся союз ወ естественно свёрнут в современное русское перечисление без изменения состава списка.
- source_word: ሲድስቱ።
  choice: — всего шестеро
  rationale: Форма означает «шесть/шестеро» и, по-видимому, подводит итог более широкому перечню; «всего» делает эту функцию понятной, не утверждая, что здесь названы шесть имён.
- source_word: ወሞቱ፡
  choice: Они умерли
  rationale: Множественное число глагола сохранено; отдельное предложение соответствует границе в источнике.
- source_word: በዓመተ፡ ቦኡ፡ በግብጽ፡
  choice: в тот год, когда вошли в Египет
  rationale: Передаёт временную конструкцию буквально по смыслу и естественно по-русски.
- source_word: ወተርፈ፡ ለዳን፡
  choice: а у Дана остался…
  rationale: Дательный/посессивный оборот ለዳን передан конструкцией «у Дана», не превращая Дана в подлежащее. Незавершённость сохранена многоточием, поскольку ожидаемый субъект, вероятно, следует далее.
theological_decisions:
- issue: Кто является субъектом последнего глагола
  choice: 'Дан не представлен как тот, кто остался; фраза оставлена открытой: «у Дана остался…»'
  alternative: «а Дан остался»
  rationale: Глагол ተርፈ употреблён с ለዳን («Дану/у Дана»), поэтому грамматически вероятнее, что остался кто-то или что-то у Дана; последующий контекст должен восполнить субъект. Это текстовый, а не конфессиональный выбор.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного регистра. Итоговое «всего шестеро» устраняет ложное впечатление, будто три перечисленных имени сами составляют шесть человек. Многоточие намеренно сохраняет синтаксическую незавершённость исходного отрывка.
