  source_fidelity: Перевод точно передаёт перечисление имён, указание на число («шестеро»), смерть в год прихода в Египет и синтаксически незавершённую дательную конструкцию ወተርፈ፡ ለዳን፡. Дан не превращён в подлежащее последнего глагола.
  naturalness: Современный литературный русский в целом естественен. Намеренно оборванное «а у Дана остался…» необычно вне контекста, но оправдано тем, что исходный текст в данном разбиении также обрывается до выраженного субъекта; многоточие и примечание делают это понятным.
  terminology: Имена «Асуди», «Ияк» и «Соломон» последовательно переданы транслитерацией/традиционной русской формой. Формулировка «всего шестеро» адекватно передаёт итоговое числительное и не утверждает, будто только три названных лица составляют шесть.
