  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: ru
  text: дочерей народов. И если он отдаст какую-либо из своих дочерей мужчине из какого-либо народа, то это — бедствие за бедствием и проклятие за проклятием. Всё это бедствие и проклятие придёт, если он так поступит и если закроет глаза на тех, кто творит нечистоту, на тех, кто оскверняет святилище Господа, и на тех, кто бесчестит Его святое имя. Весь народ сообща будет осуждён за всякую нечистоту и осквернение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አሕዛብ
  choice: дочерей других народов
  rationale: Начальная фраза является продолжением предыдущего контекста; «других» естественно передаёт противопоставление своему народу без добавления отсутствующего предлога «над».
- source_word: እምአዋልዲሁ
  choice: какую-либо из своих дочерей
  rationale: Суффикс третьего лица мужского рода означает «его/своих дочерей», а не «ваших дочерей».
- source_word: መቅሠፍት፡ ላዕለ፡ መቅሠፍት
  choice: бедствие за бедствием
  rationale: Сохраняется усилительная повторная конструкция; «бедствие» достаточно широко передаёт карающее несчастье, не сужая смысл до конкретной болезни.
- source_word: ያረኵሱ፡ መቅደሶ
  choice: оскверняет святилище
  rationale: Прямая и традиционно понятная передача глагола осквернения и существительного «святилище».
- source_word: ይጌምኑ፡ ስሞ፡ ቅዱሰ
  choice: бесчестит Его святое имя
  rationale: «Бесчестит» передаёт профанацию святого имени естественным современным русским языком.
- source_word: ይትኬነን
  choice: будет осуждён
  rationale: Пассивная форма судебного глагола сохранена без уточнения исполнителя суда.
theological_decisions:
- issue: Коллективная ответственность народа
  choice: Весь народ сообща будет осуждён
  alternative: Каждый из народа будет осуждён
  rationale: Текст прямо соединяет «весь народ» и «вместе/сообща»; коллективное напряжение сохранено и не индивидуализировано.
- issue: Причинная формула о бедствии и проклятии
  choice: то это — бедствие за бедствием и проклятие за проклятием
  alternative: на нём будет бедствие за бедствием
  rationale: Сохранены እስመ («ибо/то») и ውእቱ («это есть»); не добавлено отсутствующее в источнике указание «на нём».
translation_notes:
  register: Современный литературный русский с торжественной, но доступной библейской интонацией. Начальный фрагмент оставлен как синтаксическое продолжение предыдущего стиха. Лексика избегает конфессионально специфических толкований.
