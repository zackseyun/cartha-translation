  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: ru
  text: 'И Иаков встал рано утром, в четырнадцатый день этого месяца, и отделил десятую часть из всего, что пришло вместе с ним: от людей до скота, от золота до всякого имущества; и принёс это и отделил десятую часть из всего.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጌሰ፡ ያዕቆብ፡ በነግህ
  choice: И встал Иаков рано утром
  rationale: Передаёт утреннее действие естественным современным русским оборотом, следуя смыслу текста и консультационному слою.
- source_word: ዐሠረ፡ እምኵሉ
  choice: отделил десятую часть от всего
  rationale: Буквальное повторение глагольной идеи «десятинить» по-русски звучало бы неестественно; выражение сохраняет конкретное значение выделения одной десятой.
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: от людей до скота
  rationale: Сохраняет диапазон исходного выражения, не устраняя его потенциально трудную для читателя широту.
- source_word: እምወርቅ፡ እስከ፡ ኵሉ፡ ንዋይ
  choice: от золота до всякого имущества
  rationale: «Имущество» естественно охватывает вещи и достояние; «всякого» отражает ኵሉ.
- source_word: ወአብአ
  choice: и принёс это
  rationale: Каузатив глагола со значением входа здесь означает «внёс/принёс», а не «взял»; местоимение делает русский синтаксис ясным без изменения референта.
theological_decisions:
- issue: Десятая часть людей и скота
  choice: Сохранить формулировку «от людей до скота»
  alternative: Истолковать как десятину только от имущества, связанного с людьми и скотом
  rationale: Исходный текст прямо задаёт этот диапазон; перевод не должен заранее разрешать возможную ритуальную или повествовательную трудность.
- issue: Характер действия, выраженного ወአብአ
  choice: «принёс это»
  alternative: «внёс это» или «принёс в дар»
  rationale: «Принёс» сохраняет действие и не добавляет прямо не выраженного адресата или культового толкования.
translation_notes:
  register: Современный литературный русский, ясный и достоинственный. Сохранён повтор «десятую часть от всего», характерный для исходного текста; точка с запятой разграничивает перечисление и итоговое действие.
