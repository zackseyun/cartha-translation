  text: And he went up into heaven[21]. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his children through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make it an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father, and dwell with Isaac your father until the day of your father's death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will make you remember everything."
    And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen[21]. And there he celebrated one additional day, and he observed it according to all that they sacrifice in former days, and he called its name Addition, because that day had been added, and they had formerly called them a feast. And thus he showed that it should be so, and it is written on the heavenly tablets concerning this, that it was revealed to him that he should observe it and add it to the seven days of the feast. And its name was called Addition, because it is added to the feast days according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah's nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place Deborah's River, and the oak, the Oak of the Mourning of Deborah. And Rebekah went and entered her house
    to Isaac her father, and Jacob sent by her hand rams and sheep, that she might bring them to his father's house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his possessions and crossed the river and arrived.
translation:
  language: ru
  text: 'И он поднялся на небо. Ночью Иаков увидел видение: вот, с неба спускается ангел, держа в руках скрижали. Ангел передал их Иакову; тот прочитал их и узнал всё написанное на них — всё, что произойдёт с ним и его потомками во все века. Ангел показал ему всё написанное на скрижалях и сказал:


    «Не строй на этом месте и не возводи здесь вечного святилища; не оставайся здесь, потому что это не то место. Иди в дом Авраама, отца твоего, и живи с Исааком, отцом твоим, до дня смерти отца твоего. Ты умрёшь в Египте с миром, а в этой земле будешь с честью погребён в гробнице своих отцов, рядом с Авраамом и Исааком. Не бойся: всё будет так, как ты увидел и прочитал. И ты запиши всё, что увидел и прочитал».


    Иаков спросил:


    «Господин мой, как же я вспомню всё, что прочитал и увидел?»


    Он ответил:


    «Я напомню тебе всё».


    И ангел поднялся от него. Иаков пробудился ото сна и вспомнил всё, что прочитал и увидел, и записал обо всём, что прочитал и увидел.


    Там он прибавил ещё один день и приносил в этот день жертвы так же, как их приносили в прежние дни. Он назвал этот день «Прибавлением», потому что тот был добавлен; прежние же дни называли праздником.[a] Так было показано, что надлежит поступать именно так. И на небесных скрижалях записано об этом: ему было открыто, что он должен соблюдать этот день и прибавить его к семи дням праздника. День получил название «Прибавление», потому что он прибавляется к дням праздника в соответствии с числом дней года.


    В ночь на тринадцатое число этого месяца умерла Девора, кормилица Ревекки. Её похоронили ниже города, под дубом у реки. То место назвали «Река Деворы», а дуб — «Дуб плача по Деворе».[b]


    Ревекка пошла и вошла в дом Исаака, отца Иакова. Иаков послал с ней баранов и овец, чтобы она отвела их в дом его отца. Он сказал ей: «Пойдём во всякое место, но ты не ходи со мной».[c]


    Иаков благословил Бога Исаака, своего отца, и Бога Авраама, отца своего отца. Затем он встал, посадил на вьючных животных своих жён и детей, взял всё своё имущество, перешёл реку и прибыл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Прибавление» передаёт слово со значением «добавленное, присоединённое». Речь идёт о дополнительном праздничном дне, прибавленном к семи дням праздника.
    reason: cultural_note
  - marker: b
    text: Форма слова, переданного как «плач», в рукописной традиции, по-видимому, искажена; контекст и традиционное название указывают на значение скорби или плача.
    reason: textual_variant
  - marker: c
    text: Несколько фраз о возвращении Ревекки и данных ей Иаковом поручениях синтаксически неясны в дошедшем эфиопском тексте. Последняя реплика передана близко к её грамматической форме, без попытки устранить её внутреннюю трудность.
    reason: textual_variant
lexical_decisions:
- source_word: ተውሳክ
  choice: «Прибавление»
  rationale: Слово обозначает добавление или прибавку; контекст прямо связывает название с дополнительным днём после семи дней праздника.
- source_word: ይሠውዑ
  choice: приносили жертвы
  rationale: Глагол имеет конкретное жертвенное значение, которое нельзя ослаблять до общего «делали» или «соблюдали».
- source_word: ኀሐ (вероятно, искажённое ኀዘነ)
  choice: плача
  rationale: Передаёт засвидетельствованное в контексте погребения значение скорби/плача и соответствует названию дуба, а не опускает его.
- source_word: አብርሃም፡ አቡከ
  choice: Авраама, отца твоего
  rationale: Формально сохраняет родовое употребление «отец» и не добавляет отсутствующее в этой фразе уточнение «отец твоего отца».
theological_decisions:
- issue: Статус небесных скрижалей и предсказанного будущего
  choice: Сохранены прямые утверждения о записи на небесных скрижалях и о том, что всё исполнится
  alternative: Истолковать скрижали метафорически или смягчить предопределённость
  rationale: Источник формулирует эти положения прямо; перевод не должен разрешать их богословское напряжение.
- issue: Обращение Иакова к ангелу словом እግዚኦ
  choice: «Господин мой»
  alternative: «Господи»
  rationale: Контекстуальным адресатом остаётся ангел; «Господин мой» сохраняет почтительное обращение, не отождествляя его без необходимости с Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Короткие прямые речи оформлены ясно; повторения «увидел и прочитал» и родовое именование Авраама «отцом» сохранены как значимые черты источника. В повреждённом заключительном эпизоде избрано осторожное, минимально интерпретирующее изложение.
