base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: ru
  text: Исполняя молитву, которой он молился, он должен был отдавать десятину вместе с их жертвами и возлияниями. Когда огонь поглотил это, он воскурил над ним на огне ладан, а в жертву избавления принёс двух быков, четырёх баранов, четырёх овец, четырёх козлов и четырёх годовалых ягнят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የዐሥር
  choice: отдавать десятину
  rationale: Передаёт действие, связанное с отделением десятой части, естественным современным русским выражением.
- source_word: ጥዓሕቶሙ
  choice: их возлияниями
  rationale: Сохраняет множественное число и местоименный суффикс 3-го лица множественного числа, не заменяя его единственным числом.
- source_word: ስኂነ
  choice: ладан
  rationale: В данном жертвенном контексте обозначает благовоние для воскурения; «ладан» является ясным и традиционным русским соответствием.
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: жертву избавления
  rationale: Сохраняет значение избавления/спасения и не отождествляет выражение без достаточных оснований с конкретным видом жертвы из иной культовой терминологии.
- source_word: አርባዕተ፡ *ይቤላት
  choice: четырёх козлов
  rationale: Словесно записанное አርባዕተ означает «четыре»; следующий в издании знак ፭ является сносковым маркером, а не числительным «пять».
- source_word: አባግዐ፡ ዘዘ፡ ዓመት
  choice: четырёх годовалых ягнят
  rationale: Передаёт животных, каждому из которых один год, естественным русским жертвенным обозначением.
theological_decisions:
- issue: Наименование жертвы መሥዋዕተ፡ መድኃኒት
  choice: жертва избавления
  alternative: жертва спасения
  rationale: «Избавление» сохраняет конкретный оттенок освобождения от беды и не вносит дополнительной систематической богословской трактовки.
- issue: Неясный референт местоимения во фразе «их жертвами и возлияниями»
  choice: сохранить множественное «их»
  alternative: заменить на «его» ради предполагаемого смысла
  rationale: Геэзский текст дважды содержит суффикс 3-го лица множественного числа; неоднозначность его референта нельзя устранять исправлением текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Начальная синтаксическая зависимость («из молитвы…») сохранена, поскольку стих продолжает предшествующее высказывание. Формулировка об огне не дополняется словами «всесожжение» или «жертва», отсутствующими в данном месте источника.
