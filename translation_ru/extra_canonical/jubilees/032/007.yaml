  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: ru
  text: 'Итак, вот что установлено в Израиле относительно осквернения израильской девы[a]: если кто-либо в Израиле захочет отдать свою дочь или даже сестру кому-нибудь из потомков языческих народов, он непременно должен умереть; пусть побьют его камнями, потому что он совершил постыдное дело в Израиле; и женщина…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «об осквернённой израильской деве».'
    reason: Геэзская конструкция допускает понимание первого слова либо как отвлечённого существительного «осквернение», либо как формы, характеризующей деву как осквернённую.
  - marker: b
    text: В предоставленном тексте стиха фраза обрывается на словах «и женщина».
    reason: Исходный текст заканчивается союзом и словом «женщина»; незавершённость нельзя молча устранять или дополнять.
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: относительно осквернения израильской девы
  rationale: 'Сохраняет именную конструкцию источника: «осквернение» + «дева» + определение «израильская», не превращая её без необходимости в придаточное предложение.'
- source_word: ወእመኒ፡ እኅተ
  choice: или сестру
  rationale: Передаёт добавочную альтернативу «и также/даже сестру» естественной русской конструкцией; притяжательное «свою» по смыслу распространяется и на второй однородный член.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: из потомков языческих народов
  rationale: Буквально отражает выражение «из семени народов» и при этом ясно передаёт противопоставление Израилю; множественное число «народов» сохранено.
- source_word: ሞተ፡ ለይሙት
  choice: непременно должен умереть
  rationale: Передаёт усиленную формулу смертного приговора, соответствующую буквальному «смертью да умрёт».
- source_word: ገብረ፡ ኀፍረተ
  choice: совершил постыдное дело
  rationale: Естественно передаёт «сделал/совершил позор, бесчестие», не уточняя характер проступка сверх текста.
theological_decisions:
- issue: Статус предписания внутри повествования
  choice: «вот что установлено в Израиле»
  alternative: «так предписано Израилю»
  rationale: Формулировка сохраняет законодательный тон и не добавляет явно названного божественного субъекта, отсутствующего в данном фрагменте.
- issue: Обозначение не-израильтян
  choice: «потомки языческих народов»
  alternative: «семя народов»
  rationale: Выбрана понятная современному читателю формулировка без привнесения конкретной этнической или конфессиональной категории; более буквальная альтернатива звучит по-русски искусственно.
translation_notes:
  register: Современный литературный русский с достоинством законодательного контекста. Архаизирующие формулы сведены к минимуму, но усиленный смертный приговор и повтор каменной казни сохранены. Незавершённость текста обозначена многоточием и пояснена сноской.
