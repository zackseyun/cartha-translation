base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: ru
  text: Таковы будут и дети твои во все века. И да даст тебе Господь, тебе и твоему потомству, величие сердца во славу Свою; и да приблизит Он к Себе тебя и твоё потомство из всех людей, чтобы они служили[a] в Его святилище, как ангелы Лица и как святые. Подобным им будет потомство твоих детей — в славе и величии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повиновались».'
    reason: Геэзский глагол прежде всего выражает повиновение или послушание, но в контексте святилища может обозначать исполнение служения.
lexical_decisions:
- source_word: ዘርእከ
  choice: твоё потомство
  rationale: Передаёт собирательное значение «семя, потомство» естественным современным русским языком.
- source_word: ዐበየ፡ ልበየ
  choice: величие сердца
  rationale: Сохраняет образ и необычную формулировку источника, не сводя её без основания к мужеству или мудрости.
- source_word: እምኵሉ፡ ዘሥጋ
  choice: из всех людей
  rationale: Буквально выражение связано со «всякой плотью»; в данном контексте речь идёт об избрании из всего человечества, поэтому выбран ясный русский эквивалент.
- source_word: ይትአዘዙ
  choice: служили
  rationale: В контексте святилища глагол повиновения/исполнения служения естественно передаётся как «служили»; его третье лицо множественного числа сохранено словом «они».
- source_word: መላእክተ፡ ገጽ
  choice: ангелы Лица
  rationale: Сохранён характерный сакральный титул «ангелы Лица», а не истолковывающее «ангелы присутствия».
- source_word: ቅዱሳን
  choice: святые
  rationale: Прямой и достаточно широкий эквивалент, не уточняющий без основания, идёт ли речь именно об ангелах.
theological_decisions:
- issue: Кто должен служить в святилище
  choice: «чтобы они служили»
  alternative: «чтобы ты служил»
  rationale: Форма ይትአዘዙ стоит в третьем лице множественного числа и относится к названным перед этим Иакову и его потомству либо прежде всего к потомству; единственное число второго лица грамматически менее вероятно.
- issue: Обозначение небесных существ
  choice: «как ангелы Лица и как святые»
  alternative: «как ангелы присутствия и святые ангелы»
  rationale: Формулировка сохраняет два обозначения источника и не отождествляет «святых» с ангелами сверх того, что сказано в тексте.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозной издательской практике. Начальная строчная буква сохраняет фрагментарную связь стиха с предшествующим контекстом.
