base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: ru
  text: 'Благословен ты, и всякий народ, проклинающий тебя, да будет проклят. И Иуде он сказал: «Пусть Господь даст тебе силу и крепость, чтобы ты попирал всех ненавидящих тебя. Будь правителем над сынами Иакова — ты и один из твоих сыновей. Пусть твоё имя и имя твоих сыновей распространятся и будут возвещены по всей земле и по всем областям[a]. Тогда народы убоятся тебя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всем странам»; слово также может обозначать города или области.'
    reason: Лексический диапазон геэзского አህጉር допускает несколько пространственно-политических значений.
lexical_decisions:
- source_word: ቡሩክ
  choice: Благословен ты
  rationale: В исходном тексте стоит самостоятельное «благословен»; подразумеваемое местоимение добавлено по-русски для ясности. Формулировка «благословен всякий, кто благословляет тебя» отсутствует в представленном геэзском тексте.
- source_word: ኃይለ፡ ወጽንዐ
  choice: силу и крепость
  rationale: 'Сохранена парная формула: ኃይል обозначает силу или мощь, а ጽንዕ — крепость, стойкость, твёрдость.'
- source_word: መኰንነ
  choice: правителем
  rationale: Слово может обозначать правителя, начальника или судью; «правитель» естественно соответствует контексту власти над сынами Иакова, не сужая смысл до судебной должности.
- source_word: ዘየሐውር፡ ወዘያንበቡ
  choice: распространятся и будут возвещены
  rationale: Передана пара глаголов, буквально связанная с хождением/распространением и чтением/произнесением; русская формулировка выражает широкое распространение имени и его публичное возвещение.
- source_word: አህጉር
  choice: областям
  rationale: Множественное существительное может обозначать земли, области, страны или города; в сочетании со «всей землёй» слово «области» избегает ненужного повторения.
- source_word: እምቅድመ፡ ገጽከ
  choice: тебя
  rationale: Буквально «перед твоим лицом»; по-русски естественный смысл страха перед человеком передан местоимением без неидиоматичного буквального оборота.
theological_decisions:
- issue: Кто назван благословенным в начале стиха
  choice: «Благословен ты»
  alternative: «Благословен всякий, кто благословляет тебя»
  rationale: Представленный геэзский текст содержит ቡሩክ («благословен») без оборота «кто благословляет тебя», после чего отдельно говорит о проклинающем народе. Перевод не восполняет отсутствующую в данном источнике симметричную формулу.
- issue: Характер власти Иуды и его потомка
  choice: «правителем над сынами Иакова»
  alternative: «судьёй сынов Иакова»
  rationale: Лексема допускает оба значения, однако контекст силы, победы над врагами и наследственной власти поддерживает более широкое «правитель», не утверждая особой конфессиональной интерпретации.
translation_notes:
  register: 'Современный литературный русский с торжественным, но понятным благословительным тоном. Прямая речь намеренно не закрыта кавычкой: речь продолжается в следующем стихе. Буквально-лицевой оборот в финале передан естественным русским «убоятся тебя».'
