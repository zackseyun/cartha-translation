translation:
  language: ru
  text: Им предписано поступать так, чтобы они были записаны как друзья.[a] Но если они преступят и во всех его путях будут поступать нечисто, то на небесных скрижалях они будут записаны как враги; их изгладят из книги жизни и запишут в книгу тех, кому предстоит погибнуть, вместе с теми, кто…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод начала: «Для них установлено, чтобы они поступали так и были записаны как друзья».'
    reason: Форма начального выражения допускает оттенок установленного порядка наряду с предписанием.
  - marker: b
    text: Предоставленный исходный фрагмент обрывается на словах «вместе с теми, кто».
    reason: Многоточие обозначает неполноту исходного сегмента, а не завершение мысли автора.
lexical_decisions:
- source_word: ሠርዐት
  choice: предписано
  rationale: Передаёт безлично-пассивный смысл установления или предписания, не вводя явно названного повелевающего субъекта.
- source_word: አዕርክተ
  choice: как друзья
  rationale: Сохраняет смысловой контраст с последующим «как враги»; речь идёт не о записи постановления, а о том, кем они будут записаны.
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Традиционное и понятное обозначение небесных письменных таблиц, соответствующее образному строю текста.
- source_word: ጸላእተ
  choice: враги
  rationale: Прямой и естественный русский эквивалент, противопоставленный «друзьям».
- source_word: መጽሐፈ፡ ሕይወት
  choice: книга жизни
  rationale: Устойчивое библейское выражение, точно отражающее исходную конструкцию.
- source_word: እለ፡ ይትሐጐሉ
  choice: те, кому предстоит погибнуть
  rationale: Передаёт будущую гибель без чрезмерного уточнения её характера или причины.
theological_decisions:
- issue: Статус записываемых как друзей или врагов
  choice: сохранён прямой контраст «записаны как друзья» — «записаны как враги»
  alternative: понимать первую запись как фиксацию предписания
  rationale: Геэзское አዕርክተ обозначает друзей и образует намеренную антитезу слову ጸላእተ «враги».
- issue: Безличное установление в начале стиха
  choice: «Им предписано»
  alternative: «Он повелел им»
  rationale: Исходный фрагмент не требует явного указания действующего лица; безличная формулировка сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («скрижали», «изгладят»). Синтаксис сделан ясным для широкого читателя; незавершённость последней фразы сохранена и пояснена сноской.
