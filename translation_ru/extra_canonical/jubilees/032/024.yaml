base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: ru
  text: И пришёл он в землю Ефрафы и остановился там. Ночью Рахиль родила сына и назвала его Сын Моей Скорби, потому что тяжело страдала при родах; отец же назвал его Вениамином. Это было в одиннадцатый день восьмого месяца, в первый год шестой седмины[a] этого юбилея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Седмина — семилетний период.
    reason: Поясняет хронологический термин книги Юбилеев и предотвращает ошибочное понимание как обычной недели.
lexical_decisions:
- source_word: ምድረ ከብራታን
  choice: землю Ефрафы
  rationale: Передано традиционное отождествление топонима с Ефрафой, отражённое и в проверочном английском слое; конструкция с родительным падежом естественна для современного русского языка.
- source_word: ወልደ ሕማምየ
  choice: Сын Моей Скорби
  rationale: Сохранено прозрачное буквальное значение имени, данного Рахилью, и его связь с последующим объяснением страдания при родах.
- source_word: ዐጸበታ ሶበ ትወልድ
  choice: тяжело страдала при родах
  rationale: Передаёт тяжесть и мучительность родов естественным русским выражением, не уточняя сверх источника характер осложнений.
- source_word: ብንያም
  choice: Вениамин
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: ሱባዔ
  choice: седмина
  rationale: Слово обозначает семилетний цикл, а не обычную календарную неделю; термин сохранён и пояснён в сноске.
