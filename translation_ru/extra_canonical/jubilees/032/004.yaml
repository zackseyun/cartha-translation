base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: ru
  text: Он облачился в священнические одежды и наполнил свои руки[a]. А в пятнадцатый день этого месяца он привёл к жертвеннику четырнадцать быков из крупного скота, двадцать восемь баранов, сорок девять овец, семь ягнят и двадцать одного козлёнка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Наполнить руки» — древнее ритуальное выражение, связанное с посвящением или вступлением в священническое служение.
    reason: Фразеологизм при буквальной передаче может быть непонятен современному читателю, однако его образность и смысловая широта должны быть сохранены.
lexical_decisions:
- source_word: አልባሰ፡ ክህነት
  choice: облачился в священнические одежды
  rationale: Передаёт действие облачения и священнический характер одежды естественным, современным и достойным русским языком.
- source_word: መልአ፡ እደዊሁ
  choice: наполнил свои руки
  rationale: Сохранён буквальный ритуальный оборот «наполнил руки», поскольку его замена словом «посвятился» устранила бы образность и могла бы сузить значение.
- source_word: አብአ፡ ውስተ፡ ምሥዋዕ
  choice: привёл к жертвеннику
  rationale: Глагол передан как доставление живых животных, а направление к жертвеннику сохранено без добавления отсутствующего в тексте выражения «в жертву».
- source_word: አስዋረ፡ እምአልህምት
  choice: быков из крупного скота
  rationale: Сочетание сохраняет как конкретное обозначение быков, так и указание на категорию крупного скота.
- source_word: መሓስዐ፡ ጠሊ
  choice: козлёнка
  rationale: Контекст перечня жертвенных животных и английский контрольный слой поддерживают значение «козлята»; выбрана обычная современная русская форма.
theological_decisions:
- issue: Значение выражения «наполнил свои руки»
  choice: Сохранить ритуальный идиом в основном тексте и пояснить его в сноске
  alternative: 'Передать толковательно: «посвятил себя на священническое служение»'
  rationale: Исходная формула может указывать на священническое поставление или вступление в служение, но прямой толковательный перевод сделал бы неоднозначный ритуальный образ однозначным.
- issue: Жертвенное назначение животных
  choice: Не добавлять слова «в жертву»
  alternative: «принёс к жертвеннику в жертву»
  rationale: Хотя контекст жертвенника подразумевает жертвенное назначение, соответствующего выражения в данном месте исходного текста нет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Перечень животных изложен ясно и ритмично; архаизмы и конфессионально окрашенные уточнения не добавлялись.
