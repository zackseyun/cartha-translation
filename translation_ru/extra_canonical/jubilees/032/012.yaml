  source_fidelity: 'Перевод верно передаёт ተኀርየ как безличное установление и не ошибочно включает эфиопские цифры-указатели примечаний в текст. Смысл отсутствия переноса остатка на следующий год сохранён. Однако «от нынешнего года до следующего» менее точно и менее естественно, чем обычное русское «с одного года на другой»: источник говорит именно о недопустимости оставлять запас до наступающего года, а не о временном промежутке. Обрив исходника в конце корректно отмечен.'
