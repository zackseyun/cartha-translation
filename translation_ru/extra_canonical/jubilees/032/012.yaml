lexical_decisions:
- source_word: ተኀርየ
  choice: это установлено
  rationale: Пассивная форма передаёт смысл назначения или установления; «установлено» естественно звучит по-русски и не сужает значение до человеческого выбора.
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: и ничего из этого нельзя оставлять
  rationale: Оборот выражает отсутствие возможности оставить или сохранить часть названного; модальная русская конструкция передаёт смысл естественно.
- source_word: ዘርእ
  choice: зерно
  rationale: В контексте поедания и сбора урожая значение «зерно» естественнее общего «семя».
- source_word: መዋዕለ፡ ሐፊረ፡ ዘርእ
  choice: дни сбора урожая
  rationale: Буквально речь идёт о днях собирания зерна; русское «сбор урожая» ясно передаёт сельскохозяйственный контекст.
- source_word: አመ
  choice: времени
  rationale: Сохраняет незавершённость последней фразы и не вводит отсутствующее в данном фрагменте продолжение.
theological_decisions:
- issue: Кем установлено предписание
  choice: Сохранена безличная пассивная конструкция «это установлено»
  alternative: «Бог установил это»
  rationale: В приведённом тексте деятель прямо не назван; перевод не должен добавлять его, даже если контекст может подразумевать божественное установление.
- issue: Интерпретация эфиопских чисел ፳፮, ፳፯ и ፳፰
  choice: Не включены в основной текст как числа лет
  alternative: Перевести их как «двадцать шесть», «двадцать седьмой» и «двадцать восьмой» годы
  rationale: Согласно критической истории правок, это типографские указатели примечаний в издании Charles 1895, а не слова текста Юбилеев.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Синтаксис сохраняет нормативно-предписывающий характер отрывка. Многоточие и примечание отмечают физическую незавершённость предоставленного источника.
