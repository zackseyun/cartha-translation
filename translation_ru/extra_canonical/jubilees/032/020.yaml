  terminology: «Спасение Израиля», «престол славы твоей праведности» и субстантивированное «Возлюбленного» сохранены последовательно. Сноска b надлежащим образом отмечает альтернативное членение спорной конструкции, не навязывая идентификацию Возлюбленного.
