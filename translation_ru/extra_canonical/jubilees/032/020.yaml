base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: ru
  text: И через тебя будет обретено спасение Израиля. И в тот день, когда ты воссядешь[a] на престоле славы твоей праведности, великий мир наступит для всего потомства сынов Возлюбленного[b]. Кто благословляет тебя, будет благословен, а все ненавидящие и притесняющие тебя, равно как и проклинающие тебя, будут искоренены и погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда ты будешь пребывать».'
    reason: Глагол может означать как сидение на престоле, так и пребывание на нём.
  - marker: b
    text: 'Буквально: «семени сынов Возлюбленного»; возможно также: «потомству его возлюбленных сыновей».'
    reason: Конструкция допускает иное членение, хотя антиципирующее местоимение поддерживает основное прочтение.
lexical_decisions:
- source_word: ብከ (bəka)
  choice: через тебя
  rationale: Передаёт посредническое значение конструкции в данном контексте, не превращая её в более отвлечённое «благодаря тебе».
- source_word: ትነብር (tənabbər)
  choice: воссядешь
  rationale: Глагол допускает значения «сидеть» и «пребывать»; при упоминании престола естественно русское «воссядешь», а неоднозначность отмечена в сноске.
- source_word: መንበረ ክብር ጽድቅከ
  choice: на престоле славы твоей праведности
  rationale: Сохраняет цепочку родительных отношений и необычный образ исходного текста, не сводя «славу» к простому «почёту».
- source_word: ዘርአ ውሉዱ ለፍቅር
  choice: потомству сынов Возлюбленного
  rationale: 'Учитывает антиципирующую местоименную конструкцию: речь идёт о сынах того, кто назван Возлюбленным, а не просто о «его возлюбленных сыновьях».'
- source_word: ይሠረዉ ወይትሐጐሉ
  choice: будут искоренены и погибнут
  rationale: 'Различает два последовательных глагола: искоренение и гибель, сохраняя их суровую образность.'
theological_decisions:
- issue: Статус слова ፍቅር как обозначения лица
  choice: Возлюбленного
  alternative: возлюбленного / его возлюбленных сыновей
  rationale: Субстантивное употребление лучше отражается как титул, однако не уточняется, к кому именно он относится; возможное иное прочтение вынесено в сноску.
- issue: Связь воцарения с наступлением мира
  choice: 'единое временное предложение: «в тот день, когда… великий мир…»'
  alternative: 'два самостоятельных утверждения: «в тот день ты будешь пребывать… Великий мир…»'
  rationale: Сохраняет временную синтаксическую связь, выраженную конструкцией ወአመ ዕለት, не вводя дополнительного причинного толкования.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены необычные исходные образы — «престол славы твоей праведности» и «сыны Возлюбленного».
