  naturalness: Русский текст литературен и сохраняет уместный возвышенно-библейский регистр. Небольшая правка формулы «в пользу этих двоих» делает её одновременно ближе к источнику и яснее. «Сына раба Своего, Исаака» снимает синтаксическую двусмысленность.
  terminology: «Господь», «праведность», «жертвенник», «небесные скрижали», «Бог Всевышний» и формула «наполнил его руки» употреблены последовательно. Сноска к последней формуле уместна. Формулировка о «вечном свидетельстве» сохранена без доктринального уточнения.
