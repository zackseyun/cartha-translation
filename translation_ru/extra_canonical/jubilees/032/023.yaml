  text: in joy. And Jacob arranged his two sons[23], one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I am no longer able to travel; set your mother on a beast and let her go with
    you. And I know, my son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And he said to Rebekah, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed
    that they had appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.
translation:
  language: ru
  text: 'в радости. И Иаков поставил двух своих сыновей[a]: одного по правую руку, а другого по левую, — и это было вменено ему в праведность. Ночью Иаков рассказал своему отцу обо всём: как Господь явил ему великую милость, как даровал успех на всём его пути и оберегал его от всякого зла. Исаак благословил Бога своего отца Авраама, который не лишил милости и праведности сына раба Своего, Исаака.


    Утром Иаков рассказал своему отцу Исааку о молитве, с которой он обратился к Господу, о видении, которое видел, о том, как построил жертвенник и приготовил всё для жертвы, чтобы принести её пред Господом, как и молился, а также о том, как пришёл, чтобы посадить отца на осла. Исаак сказал Иакову:


    «Сын мой, я не могу пойти с тобой, потому что состарился и не вынесу дороги. Ступай, сын мой, с миром. Сегодня мне сто шестьдесят пять лет, и я уже не могу путешествовать. Посади свою мать на верховое животное, и пусть она идёт с тобой. Я знаю, сын мой, что ты пришёл ради меня. Благословен этот день, когда ты увидел меня живым, а я увидел тебя, сын мой. Преуспевай и исполни то, о чём молился. Не откладывай исполнения своей молитвы, ибо она взыскуется[b]. Теперь поспеши исполнить её, и пусть Тот, кто совершил всё, дарует успех всему, о чём ты молился».


    И он сказал Ревекке: «Иди с Иаковом, сыном своим». Ревекка пошла со своим сыном Иаковом, и с ней была Девора; и они пришли в Вефиль. Иаков вспомнил молитву, которой отец благословил его и двух его сыновей, Левия и Иуду. Он возрадовался и благословил Бога своих отцов, Авраама и Исаака. И сказал: «Теперь я знаю, что у меня и у моих детей есть вечная надежда пред Богом всего. Так установлено об этих двоих, и это будет вознесено в пользу этих двоих как вечное свидетельство на небесных скрижалях — согласно благословению, которое дал им Исаак».


    Ту ночь он провёл в Вефиле. И приснилось Левию, что его и его сыновей поставили и посвятили навеки в священники Бога Всевышнего. Проснувшись, он благословил Господа.


    Рано утром, в четырнадцатый день этого месяца, Иаков отделил десятую часть всего, что пришло с ним: от людей до скота, от золота до всякого имущества, — от всего он отделил десятину. В те дни Рахиль зачала Вениамина. Иаков пересчитал своих сыновей, и по жребию Господним выпал Левий. Отец облачил его в священнические одежды и наполнил его руки[c].


    В пятнадцатый день этого месяца он принёс на жертвенник в жертву из скота четырнадцать быков, восемнадцать баранов, сорок девять овец, семь ягнят и двадцать одного козлёнка.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Исходная строка повторяет материал из начала главы, а затем продолжается повествованием о зачатии Вениамина. Перевод сохраняет повтор как часть дошедшего текста.
    reason: segmentation_note
  - marker: b
    text: 'Буквально: «ибо молитва взыскуется»; выражение может означать, что молитва ожидает исполнения или что за её исполнение будет спрошено.'
    reason: source_ambiguity
  - marker: c
    text: «Наполнить руки» — древняя формула поставления или посвящения в священническое служение.
    reason: cultural_clarification
lexical_decisions:
- source_word: ተብቈ፡ ሎቱ፡ ጽድቀ
  choice: это было вменено ему в праведность
  rationale: Передаёт юридико-богословскую формулу Geʽez без уточнения, кем именно совершено вменение.
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: чтобы посадить отца на осла
  rationale: Глагольная форма содержит объект 3-го лица мужского рода; речь не о том, что сам Иаков приехал верхом, а о намерении посадить Исаака на осла.
- source_word: ጻዕና፡ ለአምካ
  choice: посади свою мать на верховое животное
  rationale: Сохраняет прямое указание Исаака взять Ревекку с собой; подразумеваемое животное выражено по контексту путешествия.
- source_word: ወዐርገ፡ ወወረደ፡ ሌዊ፡ በመክፈሊተ፡ እግዚአብሔር
  choice: по жребию Господним выпал Левий
  rationale: Естественная русская передача идиомы о выпадении доли или жребия, согласно которой Левий определяется Господу.
- source_word: መልአ፡ እደዊሁ
  choice: наполнил его руки
  rationale: Сохранена буквальная формула священнического посвящения, а её смысл пояснён в сноске.
theological_decisions:
- issue: Неявный субъект в формуле о вменении праведности
  choice: «это было вменено ему в праведность»
  alternative: «Бог вменил ему это в праведность»
  rationale: Источник не называет субъекта явно; перевод не добавляет богословское уточнение.
- issue: Статус Левия и его потомков
  choice: «поставили и посвятили навеки в священники Бога Всевышнего»
  alternative: «избрали священником Всевышнего Бога»
  rationale: Сохранены оба исходных глагола и распространяющееся на потомков вечное назначение без конфессионального переосмысления.
- issue: Небесное свидетельство о Левии и Иуде
  choice: «будет вознесено о них как вечное свидетельство на небесных скрижалях»
  alternative: «будет записано о них как вечное свидетельство»
  rationale: Не заменяет образ восхождения/вознесения более привычным, но отсутствующим здесь глаголом «записать».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Архаизмы сохранены лишь там, где они ясны и поддерживают сакральный тон («пред Господом», «возрадовался», «скрижали»). Длинная исходная строка разбита на абзацы и прямую речь для удобства чтения; смысловые повторы и напряжённые формулы не устранены.
