  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: ru
  text: всех сынов человеческих. И Я дам твоему потомству всю землю, которая под небом, и они будут властвовать над всеми народами, как пожелают; а после этого они соберут к себе всю землю[a] и унаследуют её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привлекут к себе всю землю»; возможно также: «соберут всю землю».'
    reason: Геэзский глагол допускает оттенки собирания, соединения и привлечения; контекст не позволяет однозначно выбрать между буквальным собиранием и присоединением к себе.
lexical_decisions:
- source_word: ውሉደ፡ ሰብእ
  choice: сынов человеческих
  rationale: Буквально передаёт «детей/сынов людей» и сохраняет связь с предшествующим контекстом; в русском возвышенном повествовании естественно «сыны человеческие».
- source_word: ለዘርእከ
  choice: твоему потомству
  rationale: ዘርእ обозначает семя или потомство; контекст требует собирательного значения.
- source_word: ይኴንኑ፡ ውስተ፡ ኵሉ፡ አሕዛብ
  choice: будут властвовать над всеми народами
  rationale: Глагол выражает господство или управление; русское «властвовать над» ясно передаёт направленность власти.
- source_word: በከመ፡ ፈቀዱ
  choice: как пожелают
  rationale: Сохраняет значение действия согласно их воле без дополнительного истолкования.
- source_word: ያስተጋብኡ፡ ኵላ፡ ምድረ
  choice: соберут к себе всю землю
  rationale: Каузативный глагол допускает значения «собрать, соединить, привлечь»; добавление «к себе» естественно выражает консолидацию земли под их властью, не превращая образ в чисто физическое собирание.
- source_word: ይወርስዋ
  choice: унаследуют её
  rationale: Прямо передаёт глагол наследования; местоимение согласовано с русским словом «земля».
theological_decisions:
- issue: Объём обещанного владения
  choice: всю землю, которая под небом
  alternative: всю страну под небом
  rationale: ምድር может означать землю или страну, но повторение «всей земли» и упоминание всех народов поддерживают универсальную формулировку, не требуя догматического уточнения её исполнения.
- issue: Характер собирания земли
  choice: соберут к себе всю землю
  alternative: привлекут к себе всю землю
  rationale: Выбрано более формально близкое «соберут», а неоднозначность между собиранием, присоединением и привлечением отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к источнику, но сделан естественным для русского читателя; местоимение Бога написано с прописной буквы по издательской библейской норме.
