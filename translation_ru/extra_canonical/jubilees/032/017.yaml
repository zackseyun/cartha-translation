  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: ru
  text: 'всякого мужчину и всякую женщину в Израиле, кто оскверняет Его святилище. Поэтому Я повелел тебе: «Провозгласи это свидетельство Израилю:[a] посмотри, что произошло с Сихемом и его сыновьями, как они были отданы в руки двух сыновей Иакова и те убили их, пока те мучились от боли.[b] Это было вменено им в праведность и записано им как праведность».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дай услышать это свидетельство над Израилем».'
    reason: Сохраняет для читателя каузативную форму и пространственный предлог исходного выражения.
  - marker: b
    text: 'Или: «убили их, когда те были в мучениях».'
    reason: Передаёт возможное более сжатое понимание оборота с ፃዕር — «боль, мучение, страдание» — и ясно относит мучение к убитым.
lexical_decisions:
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: Провозгласи это свидетельство
  rationale: Каузативный глагол буквально означает «дай услышать», а однокоренное существительное имеет значение «свидетельство». Русское «провозгласи» естественно передаёт публичное оглашение, сохраняя вес слова «свидетельство».
- source_word: ተውህበት፡ ውስተ፡ እዴ
  choice: были отданы в руки
  rationale: Передаёт исходный пассив «были даны/отданы» и семитскую идиому власти, естественно выражаемую по-русски множественным «в руки».
- source_word: በፃዕር
  choice: когда они мучились от боли
  rationale: Слово обозначает боль, страдание или мучение; контекст согласуется с мучительным состоянием сихемлян, а не со значением «меч».
- source_word: ኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: Это было вменено им в праведность и записано им как праведность
  rationale: Сохранены повтор «праведность» и различие между признанием поступка праведным и его письменной фиксацией.
theological_decisions:
- issue: Оценка поступка сыновей Иакова
  choice: Сохранено прямое утверждение, что поступок был вменён и записан им как праведность
  alternative: Смягчить оценку или пояснить её как ограниченную отдельным аспектом поступка
  rationale: Источник выражает богословски напряжённую положительную оценку без оговорок; перевод не должен устранять эту напряжённость.
- issue: Принадлежность святилища
  choice: «Его святилище» с прописной буквы
  alternative: «своё святилище» или «его святилище» без уточнения референта
  rationale: Местоимение относится к Богу; прописная буква делает референцию понятной современному русскому читателю, не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис сделан ясным для широкого читателя; юридико-заветная лексика «свидетельство», «вменено в праведность» и повтор «праведность» сохранены.
