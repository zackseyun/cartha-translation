base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: ru
  text: Бог вложит это в их уста, чтобы они благословляли всё потомство возлюбленного. Твоя мать назвала тебя Левием и поистине назвала тебя так, чтобы ты был присоединён к Господу и стал спутником для всех сыновей Иакова. Пусть трапеза будет твоей; ты и твои сыновья будете вкушать её — и для всех…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В эфиопском тексте стих оканчивается незавершёнными словами: «и для всех».'
    reason: Сохраняет обрыв источника и предупреждает читателя, что многоточие не является стилистическим сокращением перевода.
lexical_decisions:
- source_word: አብሔር
  choice: Бог
  rationale: Передаёт употреблённое в начале стиха обозначение Бога без смешения с последующим полным титулом እግዚአብሔር.
- source_word: ይትወሀብ፡ ውስተ፡ አፉሆሙ
  choice: вложит это в их уста
  rationale: Естественная русская передача буквального образа «даст в их уста»; местоимение «это» восполняет подразумеваемое содержание речи, не конкретизируя его.
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: всё потомство возлюбленного
  rationale: «Потомство» естественно передаёт коллективное «семя», а субстантивированное «возлюбленного» сохраняет неопределённость референта.
- source_word: እምከ
  choice: твоя мать
  rationale: Это форма «твоя мать», а не предлог «из/среди»; фраза отсылает к наречению Левия матерью.
- source_word: አጸቁ
  choice: был присоединён
  rationale: Сохраняет этимологическую игру с именем Левий, связанную с присоединением, насколько это возможно по-русски.
- source_word: ሱታፌ
  choice: общником
  rationale: Передаёт значение участника, товарища или соучастника без излишне узкой институциональной окраски.
- source_word: ማእዳ
  choice: трапеза
  rationale: Достоинственный и понятный эквивалент слова «стол/трапеза», подходящий к сакральному контексту.
theological_decisions:
- issue: Связь Левия с Богом и сыновьями Иакова
  choice: «чтобы ты был присоединён к Господу и стал общником всех сыновей Иакова»
  alternative: «чтобы ты приблизился к Господу, принадлежал Ему и все сыновья Иакова ели за твоим столом»
  rationale: Выбранный вариант следует засвидетельствованным словам о присоединении и общничестве, сохраняет игру с именем Левий и не вводит отсутствующие отношения принадлежности или иной субъект трапезы.
- issue: Референт «Его» в выражении о трапезе
  choice: «Пусть Его трапеза будет твоей»
  alternative: «Пусть трапеза его будет твоей»
  rationale: Заглавная буква отражает наиболее естественную связь с ближайшим упоминанием Господа, но сама синтаксическая формулировка не расширена толкованием.
- issue: Незавершённое окончание стиха
  choice: сохранить «и для всех…» с примечанием
  alternative: дополнить подразумеваемым сказуемым или объектом
  rationale: Источник заканчивается обрывочной фразой; её богословский или ритуальный смысл нельзя надёжно восполнить без конъектуры.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Архаизмы сведены к минимуму; «трапеза» и «общник» выбраны ради достоинства и смысловой точности. Неясный финал намеренно не дополнен.
