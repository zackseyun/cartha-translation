  terminology: «Бог» и «Господь» последовательно передают различие между начальными обозначением Бога и последующим титулом. «Левием», «Иаков», «потомство», «трапеза» уместны. Не следует капитализировать или добавлять притяжательное местоимение там, где оно не засвидетельствовано в данном тексте.
