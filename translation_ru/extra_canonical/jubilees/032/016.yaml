- from: Бог вложит это в их уста, чтобы они благословляли всё потомство возлюбленного. Твоя мать назвала тебя Левием и поистине назвала тебя так, чтобы ты был присоединён к Господу и стал общником всех сыновей Иакова. Пусть Его трапеза будет твоей; ты и твои сыновья будете есть с неё — и для всех…[a]
  to: Бог вложит это в их уста, чтобы они благословляли всё потомство возлюбленного. Твоя мать назвала тебя Левием и поистине назвала тебя так, чтобы ты был присоединён к Господу и стал спутником для всех сыновей Иакова. Пусть трапеза будет твоей; ты и твои сыновья будете вкушать её — и для всех…[a]
  rationale: Убрано невыраженное в исходном тексте притяжательное «Его», чтобы не навязывать референт трапезы. «Общником» заменено на более естественное «спутником», а «есть с неё» — на согласованное с «трапезой» «вкушать её». Незавершённый финал и примечание сохранены без конъектур.
