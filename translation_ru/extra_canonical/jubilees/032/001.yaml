  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: ru
  text: 'И Иуда увидел и обрадовался[a], и благословил Бога своих праотцов — Авраама и Исаака. Он сказал: «Теперь я знаю, что у меня и у моих детей есть вечная надежда перед Богом всего. Так установлено об этих двоих, и это будет записано им как вечное свидетельство на небесных скрижалях — согласно благословению, которое дал им Исаак».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Иуда обрадовался». Слово «увидел» следует вероятному исправлению повреждённого чтения в переданном эфиопском тексте; его поддерживают критическая реконструкция и основные переводы.'
    reason: Указывает, что «увидел» основано на вероятной текстологической реконструкции, не выдавая её за бесспорное чтение.
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም
  choice: вечная надежда
  rationale: Прямо передаёт сочетание «надежда» и «вечный», сохраняя его богословскую открытость.
- source_word: በቅድመ፡ አምላከ፡ ኵሉ
  choice: перед Богом всего
  rationale: Сохраняет широкое значение родительного оборота, не уточняя его как «Бог всех» или «Бог всего сущего».
- source_word: ሥሩዕ
  choice: установлено
  rationale: Передаёт смысл предписанного или определённого свыше порядка без излишне конфессионального оттенка.
- source_word: በስምዕ፡ ዘለዓለም
  choice: как вечное свидетельство
  rationale: Отражает значение «свидетельство» и сохраняет функцию записи как непреходящего удостоверения.
- source_word: ውስተ፡ ጽላተ፡ ሰማይ
  choice: на небесных скрижалях
  rationale: Устойчиво и точно передаёт характерный для Книги Юбилеев образ небесных таблиц.
theological_decisions:
- issue: К кому относится вечная надежда
  choice: «у меня и у моих детей есть вечная надежда»
  alternative: «у меня есть вечная надежда, а также у моих детей»
  rationale: Русская формулировка естественно объединяет Иуду и его потомков, не меняя объёма утверждения.
- issue: Смысл выражения «Бог всего»
  choice: 'сохранить буквальную широту: «Богом всего»'
  alternative: «Богом всех» / «Богом всего сущего»
  rationale: Исходный оборот допускает широкое понимание; перевод не должен без необходимости ограничивать его лицами или явно добавлять «сущее».
- issue: Небесное установление о «двоих»
  choice: «Так установлено об этих двоих»
  alternative: назвать этих двоих по именам
  rationale: Стих сам сохраняет отсылку к предшествующему контексту; добавление имён разрешило бы анафору за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён там, где это нужно для ясности, но сохранены повторяющиеся союзы и ключевые образы исходного текста.
