  source_fidelity: 'Вторая фраза черновика передаёт общий смысл, но сглаживает два самостоятельных указания источника: столб воздвигнут у могилы Рахили и расположен при дороге, над её могилой. Для оптимально-эквивалентного перевода это уточнение следует сохранить, включая намеренное повторение «могила Рахили — её могила».'
