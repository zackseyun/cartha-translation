  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: ru
  text: И умерла там Рахиль, и была погребена в земле Ефрафы, то есть Вифлеема. У могилы Рахили Иаков воздвиг памятный столб при дороге, над её могилой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ፡ ኤፍራታ
  choice: в земле Ефрафы
  rationale: Сохраняет географическую формулировку источника и традиционную русскую передачу имени Ефрафа.
- source_word: ሐውልተ
  choice: памятный столб
  rationale: Передаёт значение воздвигнутого надгробного знака яснее, чем многозначное «памятник», и естественнее для данного древнего контекста, чем просто «столб».
- source_word: ውስተ ፡ ፍኖት
  choice: у дороги
  rationale: Естественно передаёт пространственное указание источника; столб стоит у дороги, над могилой.
- source_word: ላዕለ ፡ መቃብሪሃ
  choice: над могилой Рахили
  rationale: Сохраняет пространственное отношение «над» и явно передаёт местоименный суффикс женского рода.
