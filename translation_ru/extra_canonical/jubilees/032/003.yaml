  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: ru
  text: И в те дни Рахиль зачала Вениамина, и Иаков стал считать своих сыновей, начиная с него; Левий пришёлся на долю Господа, и его отец облачил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፀንሰት
  choice: зачала
  rationale: Точно и естественно передаёт наступление беременности в повествовательном библейском регистре.
- source_word: ብንያምሃ
  choice: Вениамина
  rationale: Объект зачатия; традиционная русская форма имени Benjamin.
- source_word: አዳነ ... እምኔሁ
  choice: отсчитал ... начиная с него
  rationale: 'Сохраняет существенную деталь እምኔሁ «от него»: счёт начинается с Вениамина, благодаря чему Левий оказывается десятым.'
- source_word: ዐርገ
  choice: выпал
  rationale: В контексте счёта и определения доли естественное русское выражение «выпал в удел», не предполагающее буквального восхождения.
- source_word: በመክፈሊተ፡ እግዚአብሔር
  choice: в удел Господу
  rationale: Передаёт принадлежность Левия доле, определённой Господу, и сохраняет богословскую образность текста.
- source_word: አልበሱ
  choice: облачил
  rationale: Более уместно, чем нейтральное «одел», ввиду последующего священнического контекста, но без добавления названия конкретного облачения.
theological_decisions:
- issue: Почему Левий оказывается уделом Господа
  choice: Сохранить указание, что Иаков считал сыновей начиная с Вениамина
  alternative: Опустить «начиная с него» и сказать лишь, что Иаков пересчитал сыновей
  rationale: 'Исходное እምኔሁ важно для логики эпизода: при обратном счёте от Вениамина Левий становится десятым, то есть выделяемой Господу долей.'
- issue: Характер одежды Левия
  choice: «облачил его» без уточнения одежды
  alternative: «одел его в священнические одежды»
  rationale: Глагол допускает торжественный или культовый оттенок, однако данный стих прямо не называет одежду священнической; уточнение преждевременно снимало бы неоднозначность.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Синтаксис сделан ясным: местоимение «него» непосредственно относится к Вениамину. «Выпал в удел Господу» естественно связывает результат счёта с посвящением Левия, не добавляя конфессиональной интерпретации.'
