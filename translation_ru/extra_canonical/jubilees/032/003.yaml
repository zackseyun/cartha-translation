revisions:
- from: И в те дни Рахиль зачала Вениамина. Иаков отсчитал своих сыновей, начиная с него, и Левий выпал в удел Господу, и отец облачил его.
  to: И в те дни Рахиль зачала Вениамина, и Иаков стал считать своих сыновей, начиная с него; Левий пришёлся на долю Господа, и его отец облачил его.
  rationale: Исправлен только способ передачи результата счёта, чтобы не вносить идею жребия, отсутствующую в исходнике. Также слегка улучшена естественность русского повествования; указание на начало счёта с Вениамина и неоднозначность характера одежды сохранены.
