base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: ru
  text: 'Кто осквернит, тот непременно умрёт: он будет побит камнями. Для этого закона нет ограничения по дням; нет ни прощения, ни какого-либо искупления, кроме того, что человек, осквернивший свою дочь среди всего Израиля, будет искоренён[a], потому что он отдал Молоху одного из своих потомков и совершил зло, осквернив его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кроме того, что человек будет искоренён». Глагольная форма в источнике передаётся как пассивная; она не называет того, кто совершает это действие.'
    reason: Сохраняет пассивную грамматику источника, не вводя активного субъекта.
  - marker: b
    text: 'Референт местоимения в источнике неясен; буквально стоит форма мужского рода: «осквернив его». Возможный перевод по смыслу: «осквернив её», то есть дочь.'
    reason: Передаёт мужской род формы источника и отмечает возможную смысловую отсылку к дочери, не разрешая неоднозначность.
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Кто осквернит
  rationale: Передаёт относительную конструкцию и ключевой глагол «осквернять», не уточняя без достаточных оснований характер осквернения.
- source_word: ሞተ፡ ለይሙት
  choice: непременно должен умереть
  rationale: Естественно передаёт усиленную фигуру с инфинитивом и личной формой глагола «умирать».
- source_word: ወበእብን፡ ይትወገር
  choice: его побьют камнями
  rationale: Передаёт пассивную конструкцию и казнь посредством камней современным литературным русским языком.
- source_word: አልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: Этот закон не имеет срока давности
  rationale: Буквальная идея отсутствия предела дней естественно выражена как бессрочная обязательность закона; формулировка не означает лишь процессуальную давность.
- source_word: ጸአሙ፡ ይሤረው፡ ብእሲ
  choice: через искоренение человека
  rationale: Сохраняет значение удаления или истребления человека и согласуется с источниковой пассивной формой, избегая ошибочного неопределённо-личного активного субъекта.
- source_word: እምውስተ፡ ዘርኡ፡ ወሀቦ፡ ለሞሎክ
  choice: он отдал Молоху одного из своих потомков
  rationale: Передаёт идиому «из своего семени» понятным современным языком, сохраняя культовый объект Молоха без пояснительного расширения.
- source_word: በአርኵሶ
  choice: осквернив это
  rationale: Мужской суффикс единственного числа не поддерживает прямую отсылку к слову «дочь»; нейтральное «это» сохраняет неясность референта.
theological_decisions:
- issue: Характер прощения и искупления
  choice: нет ни прощения, ни какого-либо искупления, кроме как через искоренение человека
  alternative: нет прощения и искупления вообще
  rationale: Источник связывает отсутствие прощения и искупления с последующим исключающим оборотом; его нельзя опускать или превращать в абсолютное богословское утверждение.
- issue: Референт заключительного местоименного суффикса
  choice: это
  alternative: её, то есть дочь
  rationale: В геэзском тексте стоит мужской суффикс, тогда как явная отсылка к дочери ожидала бы женского; перевод сохраняет текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной юридико-повествовательной тональностью. Усиленная смертная формула передана естественно; архаизмы сведены к минимуму. Неясности источника в пассивной конструкции и заключительном местоимении сохранены и вынесены в примечания.
