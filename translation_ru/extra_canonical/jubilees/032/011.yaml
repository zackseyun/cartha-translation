revisions:
- from: Их царствами были Карнаим, Аштарот, Эдреи, Мисур и Беон. Господь уничтожил их за злые дела, потому что они были крайне нечестивы, и поселил вместо них амореев — злых и грешных. И нет ныне народа, который совершил бы все их грехи; и их больше нет.
  to: Их царствами были Карнаим, Аштарот, Эдреи, Мисур и Беон. Господь уничтожил их за злые дела, потому что они были крайне нечестивы, и поселил вместо них амореев — злых и грешных. И нет ныне народа, который совершил все их грехи; и их больше нет.
  rationale: Исправлено только условно-сослагательное «совершил бы» на изъявительное «совершил». Это сохраняет прямое утверждение источника, не уточняет спорную местоименную отсылку и не добавляет толкования о «полной мере» грехов.
