    issue: Необоснованное условно-сослагательное наклонение в «который совершил бы все их грехи».
    rationale: Геэзская относительная форма обозначает народ, который «совершил/завершил» все их грехи; условное «бы» добавляет отсутствующий оттенок гипотетичности.
  revised_text: Их царствами были Карнаим, Аштарот, Эдреи, Мисур и Беон. Господь уничтожил их за злые дела, потому что они были крайне нечестивы, и поселил вместо них амореев — злых и грешных. И нет ныне народа, который совершил все их грехи; и их больше нет.
