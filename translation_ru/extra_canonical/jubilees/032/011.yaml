base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: ru
  text: Их царствами были Карнаим, Аштарот, Эдреи, Мисур и Беон. Господь уничтожил их за злые дела, потому что они были крайне нечестивы, и поселил вместо них амореев — злых и грешных. И нет ныне народа, который совершил все их грехи; и их больше нет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: Их царствами
  rationale: Передаёт форму множественного числа и притяжательный суффикс; последующий перечень понимается как названия царств или их главных городов без внесения пояснения в текст.
- source_word: አሕጐሎሙ
  choice: уничтожил их
  rationale: Глагол означает уничтожение или разорение; перевод «судил их» здесь лексически недостаточно точен.
- source_word: እምእኩይ፡ ምግባሮሙ
  choice: за злые дела
  rationale: 'Естественно передаёт причинную связь: уничтожение последовало из-за их злых поступков.'
- source_word: ጸዋጋን፡ ጥቀ
  choice: крайне нечестивы
  rationale: Сохраняет усиление «весьма/крайне» и нравственную оценку исходного текста.
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: и поселил вместо них амореев
  rationale: Прямо передаёт каузативное действие и замещение прежних жителей амореями.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: который совершил бы все их грехи
  rationale: Сохраняет буквальное «все» и не добавляет отсутствующих в исходнике выражений «полную меру» или «как они».
- source_word: ወአልቦሙ
  choice: и их больше нет
  rationale: Кратко и естественно передаёт заключительное утверждение об их отсутствии или исчезновении, сохраняя местоименную отсылку исходника.
theological_decisions:
- issue: Характер действия Господа
  choice: «Господь уничтожил их»
  alternative: «Господь судил их»
  rationale: Исходный глагол обозначает уничтожение или разорение. Более общее «судил» смягчило бы конкретный смысл текста.
- issue: Смысл выражения о грехах
  choice: «совершил бы все их грехи»
  alternative: «довёл бы свои грехи до полной меры, как они»
  rationale: Выбранный вариант следует засвидетельствованной формулировке и сохраняет её напряжённую, несколько необычную конструкцию, не вводя идеи «меры» и сравнения «как они», которых в данном тексте нет.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Союзное построение исходника слегка упорядочено для естественного русского синтаксиса; названия мест переданы традиционной библейской транслитерацией. Финальная местоименная отсылка намеренно не конкретизирована, поскольку исходный текст допускает некоторую неоднозначность.
