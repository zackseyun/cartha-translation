base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: ru
  text: Это свидетельство радости — такой же, как эта радость. Прежде землю Галаада называли землёй рефаимов, потому что это земля рефаимов; там рождались рефаимы — великаны ростом в десять, девять, восемь и вплоть до семи локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዕ፡ ከመዝ፡ ፍሥሐተ
  choice: свидетельство о радости, подобной этой радости
  rationale: Передаёт оба разных слова — «радость» и «свидетельство» — и повтор слова «радость», не подменяя второй случай словом «свидетельство». Несколько шероховатый синтаксис сохранён ввиду трудности исходной фразы.
- source_word: ምድረ፡ ገለአድ
  choice: земля Галаадская
  rationale: Традиционная и естественная русская форма библейского топонима.
- source_word: ራፋኤም / ረፋኤም
  choice: рефаимы
  rationale: Устоявшаяся русская передача названия древнего народа; множественное число соответствует контексту.
- source_word: ረዐይት
  choice: великаны
  rationale: Контекст последующего указания необычайного роста поддерживает значение «великаны».
- source_word: በአመት
  choice: в ... локтей
  rationale: В контексте измерения роста передано как мера длины «локоть», что согласуется с древней системой мер и смыслом перечисления.
- source_word: ዐሥር ... ትስዕ ... ስምን ... ስብዕ
  choice: десять ... девять ... восемь ... семь
  rationale: Сохраняется полный ряд из четырёх величин; первое число понимается как десять с учётом установленной ошибки распознавания знака в представленном тексте.
