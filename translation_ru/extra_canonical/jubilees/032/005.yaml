  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: ru
  text: из земли Галаадской. И Иаков скрыл от Лавана своё намерение[a] и ничего ему не сказал. В седьмой год четвёртой недели, в двадцать первый день первого месяца, Иаков повернул к Галааду. Лаван погнался за ним и настиг Иакова у горы Галаадской в тринадцатый день третьего месяца. Но Господь не позволил ему причинить Иакову зло, потому что ночью явился ему во сне; и Лаван рассказал об этом Иакову. В пятнадцатый день Иаков устроил пир для Лавана и всех пришедших с ним. В тот день Иаков поклялся Лавану, а Лаван — Иакову, что ни один из них не перейдёт к другому со злым умыслом[b] у горы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скрыл от Лавана своё сердце».'
    reason: Сохраняет для читателя исходный образ при естественной передаче идиомы в основном тексте.
  - marker: b
    text: 'Буквально: «не перейдут один к другому во зло».'
    reason: Показывает более широкую и несколько неоднозначную формулировку оригинала.
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: Иаков скрыл от Лавана своё намерение
  rationale: Буквальный образ «скрыл своё сердце» в современном русском здесь звучал бы неясно; контекстуальный смысл семитизма передан естественно, а буквальная форма отмечена в сноске.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: Иаков повернул к Галааду
  rationale: Направительный суффикс в ገለአድሃ указывает движение к Галааду; перевод не следует прежнему ошибочному чтению «ушёл из Галаада».
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: в двадцать первый день первого месяца
  rationale: ቅዳሜ ወርኅ обозначает первый месяц, а числительное — двадцать первый день.
- source_word: በወርኅ፡ ሣልስ፡ አመ፡ ዐሡሩ፡ ወሠሉሱ
  choice: в тринадцатый день третьего месяца
  rationale: አመ в данной календарной формуле означает «день»; речь не о тринадцатом годе.
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ
  choice: Иаков устроил пир
  rationale: Передаёт действие и значение существительного как праздничного угощения, естественно для русского повествования.
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡ በእኩይ
  choice: ни один из них не перейдёт к другому со злым умыслом
  rationale: Сохраняется взаимность клятвы и широкое значение «во зло», не сводимое только к физическому нападению.
theological_decisions:
- issue: Кому Бог явился во сне и кто затем говорил с Иаковом
  choice: Бог явился Лавану; затем Лаван рассказал об этом Иакову
  alternative: Бог говорил Лавану об Иакове
  rationale: Местоимение по контексту относится к Лавану, а явная конструкция ወነገሮ፡ ላባ፡ ለያዕቆብ называет Лавана субъектом и Иакова адресатом. Формулировка «об этом» естественно связывает рассказ Лавана с явлением, не добавляя отсутствующего прямого содержания речи.
- issue: Передача имени Бога እግዚአብሔር
  choice: Господь
  alternative: Господь Бог / Владыка
  rationale: Традиционное и общеупотребительное русское соответствие, не вносящее конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Календарные формулы переданы ясно и без ошибочного превращения дня в год. Начальная и конечная фрагментарность сохранена, поскольку стих начинается продолжением предыдущей фразы и заканчивается посреди указания места, переходящего в следующий стих.
