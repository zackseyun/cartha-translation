  yaml_path: translation/extra_canonical/jubilees/032/008.yaml
  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: ru
  text: 'Её сожгут огнём, потому что она осквернила имя дома своего отца, и она будет искоренена из Израиля. И пусть в Израиле не будет ни блуда, ни нечистоты во все дни, из поколения в поколение на земле, ибо Израиль свят Господу. Всякий, кто осквернит его, непременно умрёт: его побьют камнями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Её сожгут в огне
  rationale: Переданы явный объект женского рода и буквальный образ казни огнём; формулировка сохраняет связь с предыдущим контекстом.
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: она опозорила имя дома своего отца
  rationale: Глагол в данном сочетании обозначает нанесение позора или осквернение доброго имени; «опозорила имя» естественно по-русски и сохраняет социально-семейный смысл.
- source_word: ትሠረው፡ እምእስራኤል
  choice: будет искоренена из Израиля
  rationale: Сохранена сильная метафора удаления из общины без уточнения механизма сверх сказанного в тексте.
- source_word: ዘማ፡ ወርኵስ
  choice: ни блуда, ни нечистоты
  rationale: «Блуд» передаёт незаконную половую связь в торжественно-библейском регистре, а «нечистота» сохраняет более широкое и потенциально культовое значение второго слова.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: во все дни поколений земли
  rationale: Сохранён необычный временной оборот источника, не сведённый без достаточных оснований к более привычному «во все поколения».
- source_word: ሞተ፡ ለይሙት
  choice: непременно умрёт
  rationale: Естественная русская передача семитской эмфатической конструкции «смертью да умрёт».
- source_word: በእብን፡ ይውግርዎ
  choice: его побьют камнями
  rationale: Идиоматично передан установленный способ казни; множественное число «камнями» отражает источник.
theological_decisions:
- issue: Референт местоимения в выражении «кто осквернит его»
  choice: Сохранить мужское местоимение «его», относя его наиболее непосредственно к Израилю
  alternative: Передать «кто осквернится» или «кто осквернит себя»
  rationale: В источнике глагол допускает объектное понимание, а ближайший грамматически подходящий референт — Израиль. Перевод не подменяет это чтение рефлексивным толкованием.
- issue: Характер святости Израиля
  choice: «Израиль свят Господу»
  alternative: «Израиль — святыня Господня»
  rationale: Выбранная формулировка сохраняет предикативность и посвящённость Господу, не усиливая исходный текст до предметного обозначения «святыня».
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Архаизмы сведены к общеупотребительному слову «блуд»; синтаксис ясен, но необычный оборот «дни поколений земли» сохранён ради формы и смысловой открытости источника. Имена и обозначение Господа переданы согласно русской библейской традиции.
