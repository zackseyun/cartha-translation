  rationale: 'Исправлена только вторая фраза: восстановлены параллельные адресаты «для тех, кто отдаёт» и «для тех, кто берёт», устранено невыраженное в источнике противопоставление «одни… а другие…» и не добавлено определение «других». Брачное значение подразумеваемого объекта у «берёт» передано естественным русским «берёт жён», как допускает контекст.'
