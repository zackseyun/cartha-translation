base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: ru
  text: Не станем отдавать нашу дочь за необрезанного, потому что это позор для нас. Это позор для Израиля — для тех, кто отдаёт дочерей, и для тех, кто берёт жён из дочерей народов, потому что это нечисто.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለብእሲ፡ ዘቦ፡ ቍልፈተ
  choice: за необрезанного
  rationale: Буквально выражение означает «за мужчину, у которого есть крайняя плоть». Современное русское «за необрезанного» естественно передаёт смысл в контексте брака и обрезания.
- source_word: ጽእለት
  choice: позор / позорно
  rationale: Слово обозначает поношение или бесчестье; «позор» здесь ясно и естественно для современного читателя.
- source_word: ይሁቡ፡ ወ... ይነሥኡ
  choice: одни отдают своих дочерей, а другие берут себе жён
  rationale: Глаголы имеют значения «давать» и «брать». Объекты раскрыты по брачному контексту, чтобы русская фраза не была двусмысленно обрывочной.
- source_word: እምአዋልደ፡ አሕዛብ
  choice: из дочерей других народов
  rationale: «Народы» точнее нейтрального исходного обозначения, чем конфессионально окрашенное «язычники»; «других» естественно выражает противопоставление Израилю.
- source_word: ርኩስ
  choice: нечисто
  rationale: Сохранено понятие нечистоты без уточнения, является ли она ритуальной, нравственной или социальной, поскольку сам стих этого не разъясняет.
theological_decisions:
- issue: Характер нечистоты смешанного брака
  choice: «потому что это нечисто» без пояснения
  alternative: «потому что это ритуально нечисто» или «это грех»
  rationale: Источник называет это нечистым, но не определяет в данном стихе точную категорию; перевод не должен разрешать эту богословскую неоднозначность.
- issue: Обозначение мужчины с крайней плотью
  choice: «необрезанный»
  alternative: буквальное «мужчина, у которого есть крайняя плоть»
  rationale: Выбран обычный библейский термин, точно передающий противопоставление обрезанию без дополнительной конфессиональной интерпретации.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный. Синтаксис слегка раскрыт для естественности: в брачном контексте уточнены «своих дочерей» и «берут себе жён», при этом смысловая симметрия «дают — берут» сохранена.'
