  source_fidelity: 'Первая фраза передана точно: запрет отдать «нашу дочь» мужчине с крайней плотью и мотив «это позор для нас» сохранены. Во второй фразе исходник и английский audit trail сохраняют параллелизм «тем, кто отдаёт, и тем, кто берёт из дочерей народов». Черновое «когда одни… а другие…» несколько ослабляет эту адресную конструкцию и вносит противопоставление между двумя группами, которого в тексте нет.'
  naturalness: '«За необрезанного» и «позор для нас» естественны для современного литературного русского в библейском регистре. Перестройка второй фразы с «для тех, кто…» делает её одновременно ближе к источнику и яснее. Слово «других» не требуется: исходник говорит просто о «народах».'
  terminology: «Необрезанный», «позор» и «нечисто» удачно передают ключевые термины без конфессионального истолкования. «Брать жён из дочерей народов» эксплицирует брачный контекст, уже заданный первым предложением и английским audit trail, не меняя смысла.
