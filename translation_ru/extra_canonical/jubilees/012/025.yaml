  to: 'Господь Бог [сказал]: «Открой ему уста и уши, чтобы он мог слышать и говорить своими устами на языке, который был явлен, ибо со дня низвержения он исчез из уст всех сынов человеческих».[a]'
  rationale: 'Сделана одна безопасная лексическая правка: «открыт» заменено на «явлен», поскольку последнее передаёт смысл языка, явленного/открытого, тогда как первое в русском может означать лишь обнаружение. Остальная формулировка, включая квадратные скобки при контекстуально восполненном глаголе речи и осторожную сноску о вероятной связи с Вавилоном, сохранена.'
