  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: ru
  text: 'Господь Бог [сказал]: «Открой ему уста и уши, чтобы он мог слышать и говорить своими устами на языке, который был явлен, ибо со дня низвержения он исчез из уст всех сынов человеческих».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последние слова, вероятно, относятся к утрате первоначального языка после суда, связанного с Вавилонской башней. Геэзская формулировка кратка: «со дня низвержения».'
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ፡ አፉሁ፡ ወአዛኒሁ
  choice: Открой ему уста и уши
  rationale: ፍታሕ — повелительная форма 2-го лица ед. числа; местоименные суффиксы при «устах» и «ушах» относятся к третьему лицу.
- source_word: በልሳን፡ እንተ፡ ታስተርኢ
  choice: на языке, который был открыт
  rationale: Страдательное значение ታስተርኢ передано без уточнения того, кому или каким образом язык был открыт; этим сохранена неоднозначность источника.
- source_word: አዐረፈ፡ እምአፈ፡ ኵሉ፡ ውሉደ፡ ሰብእ
  choice: он исчез из уст всех сынов человеческих
  rationale: Буквальный образ «перестал/прекратился из уст» по-русски неестественен; «исчез из уст» ясно передаёт прекращение употребления языка, сохраняя образ уст.
- source_word: እምዕለተ፡ ድቀት
  choice: со дня низвержения
  rationale: «Низвержение» сохраняет широкое значение ድቀት и не отождествляет событие прямо с Вавилонской башней в основном тексте.
theological_decisions:
- issue: Кто произносит повеление
  choice: Господь Бог [сказал]
  alternative: Да откроет Господь Бог
  rationale: ፍታሕ является повелительной формой «открой», а не пожеланием «да откроет». Глагол речи отсутствует в предоставленной строке, поэтому восстановлен в квадратных скобках по повествовательному контексту, без выдачи его за прямо засвидетельствованный текст.
- issue: Смысл «дня низвержения»
  choice: Оставить формулировку без прямого упоминания Вавилона
  alternative: со дня разрушения Вавилонской башни
  rationale: Источник не называет Вавилон прямо; вероятная связь поясняется в сноске, а не вносится в перевод.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Уста» и «сыны человеческие» сохраняют образность и достоинство исходника; синтаксис сделан понятным современному читателю. Квадратные скобки отмечают контекстуально восполненный глагол речи.
