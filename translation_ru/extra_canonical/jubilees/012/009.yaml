  text: He told this matter to his two brothers,, and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of
translation:
  language: ru
  text: Он рассказал об этом двум своим братьям, и они разгневались на него и умолкли. В сороковой юбилей, во вторую седмину, в седьмой год этой седмины Аврам взял себе жену по имени Сара; она была дочерью…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный геэзский фрагмент обрывается после слова «дочерью»; продолжение, уточняющее родство Сары, здесь отсутствует. В рукописях и толкованиях это родство передаётся неодинаково.
    reason: textual_variant
lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: рассказал об этом
  rationale: Передаёт указательное местоимение и глагол речи естественным современным русским оборотом.
- source_word: ለክልኤ፡ አሐዊሁ
  choice: двум своим братьям
  rationale: Сохраняет точное число и родственное отношение.
- source_word: ወአርመሙ
  choice: и умолкли
  rationale: Глагольная форма имеет множественное число и относится к братьям; книжно-нейтральное «умолкли» соответствует повествовательному регистру.
- source_word: ሱባዔ
  choice: седмину
  rationale: В хронологической системе Книги Юбилеев обозначает семилетний период; «седмина» компактно отличает его от обычной недели.
- source_word: ብእሲተ
  choice: жену
  rationale: В контексте глагола «взял себе» слово обозначает супругу, а не просто женщину.
- source_word: ሶራ
  choice: Сара
  rationale: Использована привычная русская форма имени праматери, соответствующая здесь геэзской форме Sora; вариант «Сарай» возможен по другим текстовым традициям.
theological_decisions:
- issue: К кому относится молчание
  choice: «они… умолкли», то есть братья
  alternative: «он умолк», то есть Аврам
  rationale: Форма ወአርመሙ стоит в третьем лице множественного числа; богословски или повествовательно переопределять субъект нет оснований.
- issue: Незавершённое обозначение родства Сары
  choice: 'сохранить обрыв: «она была дочерью…»'
  alternative: дополнить «своего отца» или иным указанием родства
  rationale: Предоставленный геэзский сегмент заканчивается словом, вводящим отношение дочери, но не содержит названия родителя; дополнение было бы не засвидетельствованной в данном фрагменте гармонизацией.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Хронологический термин «седмина» сохранён ради точности системы юбилеев; синтаксис сделан ясным без устранения текстового обрыва.
