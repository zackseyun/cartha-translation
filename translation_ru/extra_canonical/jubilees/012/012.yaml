  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: ru
  text: В шестидесятый год жизни Аврама, то есть в четвёртую седмину[a], в четвёртый её год, Аврам встал ночью и сжёг дом идолов. Он сжёг всё, что было в доме, и никто об этом не узнал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Седмина — период из семи лет.
    reason: Современному читателю специальное хронологическое значение слова может быть неочевидно.
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: Слово обозначает группу из семи, здесь — семилетний хронологический период. «Седмина» сохраняет специальный смысл и не смешивает его с современной календарной неделей; значение пояснено в сноске.
- source_word: ቤተ፡ ጣዖታት
  choice: дом идолов
  rationale: Формально передаёт конструкцию «дом идолов» и не уточняет без основания, был ли это храм, святилище или помещение для хранения изображений.
- source_word: አውዐየ
  choice: сжёг
  rationale: Естественно передаёт повторяющийся глагол со значением предания огню; повтор сохранён отдельным предложением для ясности.
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: никто об этом не узнал
  rationale: Современная русская формулировка естественно передаёт буквальный смысл «не было человека, который знал»; «об этом» ясно отсылает к поджогу.
