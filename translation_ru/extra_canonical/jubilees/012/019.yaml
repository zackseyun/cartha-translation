  yaml_path: translation/extra_canonical/jubilees/012/019.yaml
  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: ru
  text: 'И в ту ночь он сказал: «Бог мой, Бог Всевышний, Ты один — мой Бог. Ты сотворил всё, и всё существующее — дело рук Твоих. Тебя и Твоё владычество[a] я избрал. Спаси меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твою хвалу».'
    reason: Предоставленная форма геэзского текста неясна; перевод «владычество» следует принятому исправлению чтения, тогда как альтернативное понимание допускает передачу «хвалу».
lexical_decisions:
- source_word: በይእቲ፡ ሌሊት፡ ወይቤ
  choice: И в ту ночь он сказал
  rationale: Передаёт временное обстоятельство и глагол речи без добавления отсутствующего в источнике указания на молитву.
- source_word: አምላኪየ፡ አምላከ፡ ልዑል
  choice: Бог мой, Бог Всевышний
  rationale: Сохраняет повтор слова «Бог» и титул Всевышнего, оставаясь естественным русским обращением.
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ
  choice: Ты один — мой Бог
  rationale: 'Естественно выражает исключительность: буквально «Ты один для меня Бог».'
- source_word: ኵሎ፡ ፈጠርከ
  choice: Ты сотворил всё
  rationale: Кратко и точно передаёт всеохватный объект творения.
- source_word: ወግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ
  choice: и всё существующее стало делом рук Твоих
  rationale: Сохраняет образ рук и формулировку становления всего существующего, не сглаживая повтор всеобщности.
- source_word: ወኪያከ፡ ወመሰክንከ፡ ኀረይኩ
  choice: Тебя и Твоё владычество я избрал
  rationale: Принимает засвидетельствованное редакционное исправление чтения к слову со значением «владычество, правление»; местоименная конструкция сохраняет два координированных объекта выбора.
- source_word: አድኅነኒ
  choice: Спаси меня
  rationale: Прямая и контекстуально уместная передача просьбы об избавлении или спасении.
theological_decisions:
- issue: Исключительное признание Бога
  choice: Ты один — мой Бог
  alternative: Ты один для меня Бог
  rationale: Выбран естественный современный русский оборот, сохраняющий личное и исключительное исповедание без внесения дополнительной догматической формулы.
- issue: Неясное чтение перед «я избрал»
  choice: Твоё владычество
  alternative: Твою хвалу
  rationale: «Владычество» соответствует принятому исправлению повреждённого или ошибочно распознанного геэзского чтения и поддерживается критической традицией; альтернативу сохраняет сноска, поскольку предоставленный текст внешне допускает иное истолкование.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксический повтор «всё — всё существующее» сохранён как смысловой акцент источника.
