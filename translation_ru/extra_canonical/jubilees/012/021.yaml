  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: ru
  text: 'И он сказал[a]: «Вернуться ли мне в Ур Халдейский, к тем, кто ищет моего лица, чтобы я вернулся к ним?[b] И что мне делать здесь, в этом месте? Сделай верный путь прямым пред Тобой; пусть Твой раб поступает так,[c] и не дай мне ходить в заблуждении моего сердца, Боже мой». И он закончил говорить и молиться. И вот, был послан некто.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Середина стиха в сегментированном геэзском тексте трудна для синтаксического разбора. Перевод сохраняет общий смысл просьбы Аврама: Бог должен указать верный путь и не позволить ему последовать заблуждению собственного сердца.'
    reason: segmentation_note
  - marker: b
    text: 'Буквально: «ищет моего лица». Здесь это, по-видимому, означает, что они хотят его возвращения, а не ищут его смерти.'
    reason: idiom_clarification
  - marker: c
    text: 'Возможный перевод трудной фразы: «Сделай предо мной прямым верный путь, и пусть это будет совершено рукой Твоего раба». Однако в геэзском тексте буквально стоит «пред Тобой», а глагол имеет активное значение: «пусть он совершит».'
    reason: textual_syntactic_ambiguity
lexical_decisions:
- source_word: የኀሥሡ፡ ገጽየ
  choice: ищет моего лица
  rationale: Буквально передаёт «ищут моё лицо»; последующая цель — возвращение к ним — показывает, что речь идёт о желании видеть Аврама у себя, а не о стремлении лишить его жизни.
- source_word: እግባእ
  choice: я вернулся
  rationale: Глагол здесь означает возвращение; это согласуется с начальным вопросом о возвращении в Ур.
- source_word: ፍኖተ፡ ርቱዐ
  choice: верный путь
  rationale: Сохраняет нравственно-религиозный оттенок «правильного, правого пути», избегая неестественного русского сочетания «прямой путь сделать прямым».
- source_word: በቅድሜከ
  choice: пред Тобой
  rationale: Передаёт второе лицо источника — «перед Тобой», а не «передо мной».
- source_word: ተፈነወ
  choice: был послан
  rationale: Сохранена пассивная форма и незавершённость фразы, поскольку личность посланного раскрывается далее.
theological_decisions:
- issue: Просьба о Божьем водительстве и человеческом действии
  choice: 'Сохранить одновременно Божье выпрямление пути и действие раба: «чтобы он совершил это»'
  alternative: Истолковать фразу только как просьбу, чтобы Бог повёл Аврама по пути
  rationale: Источник сохраняет напряжение между Божьим устроением пути и действием служителя; перевод не должен устранять его толкованием.
- issue: «Ищут моего лица»
  choice: Сохранить буквальную идиому в основном тексте
  alternative: Перевести «хотят видеть меня» или «ищут моей жизни»
  rationale: Контекст поясняет идиому через желание его возвращения, а буквальная форма сохраняет образность источника без внесения враждебного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Обращение к Богу оформлено традиционными прописными местоимениями. Буквальная идиома «ищет моего лица» и несколько шероховатая синтаксическая конструкция молитвы сохранены намеренно и пояснены сносками; заключительная пассивная фраза оставлена незавершённой, как в источнике.
