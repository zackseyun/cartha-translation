  terminology: «Ур Халдейский», «Боже мой», «верный путь» и «заблуждение моего сердца» приемлемы. В молитвенном регистре «пред Тобой» возможно, но его положение следует изменить. «Некто был послан» оправдано неопределённостью субъекта, однако «был послан некто» естественнее в данном контексте.
