  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: ru
  text: '«[Они — обман][a] для тех, кто их делает, и смятение сердца для тех, кто им поклоняется. Не поклоняйся им». Отец сказал ему: «Я тоже знаю это, сын мой. Но что мне делать с народом, который заставил меня повиноваться?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова в квадратных скобках восполняют подразумеваемую мысль из предыдущего стиха; буквально начало фразы: «для тех, кто их делает».'
    reason: У исходного текста в начале стиха нет явно выраженного сказуемого, поскольку фраза продолжает предшествующий контекст.
lexical_decisions:
- source_word: ወከሕተት፡ ልብ
  choice: и смятение сердца
  rationale: Передаёт внутреннюю спутанность и помрачение без неоправданного сведения выражения только к интеллектуальной ошибке.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: им поклоняется / Не поклоняйся им
  rationale: Естественно и последовательно передаёт культовое почитание идолов.
- source_word: እትአዘዝ
  choice: повиноваться
  rationale: Глагол означает подчиняться, слушаться, повиноваться; выбранное слово сохраняет отсутствие прямо названного объекта и не вводит более узкое представление о жреческом служении.
theological_decisions:
- issue: К чему относится вынужденное повиновение Фарры
  choice: Не называть прямо объект повиновения
  alternative: «который заставил меня служить ему» или «заставил меня служить идолам»
  rationale: 'В исходной фразе объект при глаголе не выражен. Русское «повиноваться» сохраняет напряжение контекста: речь может идти о подчинении народу и установленному им идольскому порядку.'
- issue: Восполнение сказуемого в начале стиха
  choice: «[Они — обман]» в квадратных скобках
  alternative: «Позор тем, кто их делает»
  rationale: Начало стиха синтаксически продолжает мысль предыдущего стиха. Восполнение из контекста обозначено как редакционное; вариант с «позором» вводил бы отсутствующее в данном месте понятие.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной диалогической интонацией. Термины понятны широкому читателю; квадратные скобки прозрачно отмечают контекстуальное восполнение.
