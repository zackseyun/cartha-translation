  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: ru
  text: '«Избавь меня от власти злых духов, которые властвуют над помышлениями человеческого сердца, и не дай им отвратить меня от следования за Тобой, Бог мой. Утверди меня и моё потомство навеки, чтобы мы не уклонялись отныне и вовеки». И он сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእዴ
  choice: от власти
  rationale: Буквально «из руки»; в данном контексте это естественная русская передача власти или господства злых духов.
- source_word: መናፍስት፡ እኩያን
  choice: злых духов
  rationale: Прямая и естественная передача сочетания «духи злые».
- source_word: ይስልጡ
  choice: властвуют
  rationale: Сохраняет смысл господства и контроля, не ослабляя его до простого влияния.
- source_word: ሕሊና፡ ልበ፡ ሰብእ
  choice: помышлениями человеческого сердца
  rationale: Передаёт сочетание мысли/намерения и сердца в библейской антропологии, сохраняя формальную близость и естественность по-русски.
- source_word: ወአይስሕቱኒ፡ እምድኅሬከ
  choice: и не дай им увести меня от Тебя
  rationale: Глагол выражает введение в заблуждение или уклонение; оборот с እምድኅሬከ буквально связан со следованием за Богом, а по-русски естественно передаётся как удаление «от Тебя».
- source_word: ወትረሰየኒ፡ ኪያየ፡ ወዘርእየ
  choice: Утверди меня и моё потомство
  rationale: ኪያየ — самостоятельное местоимение «меня», уточняющее составной объект «меня и моё семя»; значения «пред Тобой» здесь нет.
- source_word: ወይቤ
  choice: 'И он сказал:'
  rationale: Сохранена заключительная повествовательная формула, открывающая последующую речь.
theological_decisions:
- issue: Характер власти злых духов над внутренним миром человека
  choice: «властвуют над помышлениями человеческого сердца»
  alternative: «влияют на мысли человека»
  rationale: Источник использует сильный глагол господства; перевод не смягчает утверждение и не добавляет объяснений о пределах этой власти.
- issue: Объект просьбы об утверждении
  choice: «меня и моё потомство навеки»
  alternative: «меня и моё потомство пред Тобой навеки»
  rationale: В тексте отсутствует выражение «пред Тобой»; ኪያየ означает «меня» и находится в приложении к объектному суффиксу глагола.
- issue: Переход от единственного числа к множественному
  choice: «чтобы мы не уклонялись»
  alternative: «чтобы я не уклонялся»
  rationale: Множественное число естественно соотносится с составным объектом «я и моё потомство» и сохраняет смысл исходной последовательности.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Местоимение «Тебя» написано с прописной буквы как традиционная форма обращения к Богу. Архаизмы сведены к минимуму; «помышления» сохранено как понятное слово, точно выражающее внутренние мысли и намерения.
