lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ
  choice: до Фарры, отца своего
  rationale: 'Сохранён обрывочный переход от предыдущего стиха: выражение буквально продолжает предшествующее предложение и не должно искусственно превращаться в самостоятельную фразу.'
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ур Халдейский
  rationale: Употреблена традиционная и естественная русская форма библейского топонима, передающая конструкцию «Ур халдеев».
- source_word: ምድረ፡ ሊባኖስ
  choice: земля Ливанская
  rationale: Передано как название области, без отождествления с современным государством Ливан.
- source_word: ምድረ፡ ካራን
  choice: земля Харранская
  rationale: Конструкция буквально обозначает землю или область Харрана; географический компонент сохранён.
- source_word: ወኀደረ
  choice: поселился
  rationale: В данном повествовательном контексте глагол означает пребывание или обоснование на месте; «поселился» звучит естественно и соответствует смыслу.
- source_word: አብራም
  choice: Аврам
  rationale: Сохранена библейская форма имени до его переименования в Авраама.
