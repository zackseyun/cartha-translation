lexical_decisions:
- source_word: ከመ፡ ያድኅኖሙ፡
  choice: чтобы спасти их
  rationale: Целевая конструкция с глаголом «спасти» прямо передаёт значение геэзского выражения.
- source_word: ወነደደ፡ እሳት፡ ላዕሌሁ፡
  choice: Но над ним разгорелся огонь
  rationale: «Разгорелся огонь» естественно и близко передаёт сочетание глагола горения с существительным «огонь»; «над ним» сохраняет пространственную формулировку источника. Союз «но» по-русски ясно выражает резкий переход от намерения спасти к гибели, допустимый для многозначного ወ-.
- source_word: ወውዐየ፡ በእሳት፡
  choice: и он сгорел в огне
  rationale: Сохранено повторное упоминание огня и результативный смысл глагола; русское «сгорел в огне» звучит естественнее буквального инструментального оборота.
- source_word: ወሞተ፡ በኡር፡ ዘከለዳዊያን፡
  choice: и умер в Уре Халдейском
  rationale: Традиционная и понятная русская передача топонимического сочетания «Ур халдеев»; форма согласована с установившимся библейским названием.
