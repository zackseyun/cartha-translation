  text: '...of the sun and the moon, all are in the hand of the Lord. Why do I search? If he wills...'
translation:
  language: ru
  text: …солнца и луны — всё в руке Господа. Зачем я ищу? Если Он пожелает…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Этот отрывок начинается и заканчивается посреди фразы: слова «солнца и луны» продолжают предыдущий контекст, а «Если Он пожелает…» открывает следующую мысль.'
    reason: Сегментация стиха разрывает обе синтаксические конструкции; примечание предотвращает ошибочное прочтение их как самостоятельных законченных предложений.
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: …солнца и луны
  rationale: Префикс ለ- указывает на зависимую форму («солнца и луны»), продолжающую фразу предыдущего отрывка; начальное многоточие сохраняет фрагментарность сегмента.
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: всё в руке Господа
  rationale: Сохранены обобщающее «всё» и библейская метафора власти и распоряжения «в руке Господа».
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: Зачем я ищу?
  rationale: Прямой вопрос передан без добавления значения продолжительности («продолжаю искать»), которого в данном фрагменте явно нет.
- source_word: በእመ፡ ፈቀደ
  choice: Если Он пожелает…
  rationale: Условная фраза начинает следующую мысль и потому не присоединена к предыдущему вопросу; конечное многоточие обозначает обрыв сегмента.
theological_decisions:
- issue: Референт подразумеваемого субъекта в «если пожелает»
  choice: «Если Он пожелает…» с прописной буквы
  alternative: «Если он пожелает…»
  rationale: Ближайший названный субъект — Господь; русская прописная буква делает этот вероятный референт понятным, не дополняя условную фразу отсутствующим продолжением.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским звучанием. Многоточия намеренно сохраняют обе границы фрагмента; условная фраза не присоединяется к вопросу.
