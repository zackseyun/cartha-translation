base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: ru
  text: И я открыл его уста, уши и губы и начал говорить с ним на еврейском языке, на языке творения. Он взял книги своих отцов — они были написаны на еврейском языке, — переписал их и с тех пор начал их изучать. Я объяснял ему всё, чего он не мог понять, и он изучал их шесть дождливых месяцев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕብራይስጥ
  choice: по-еврейски
  rationale: Естественная современная русская передача наречия со значением «на еврейском языке».
- source_word: በልሳነ፡ ፍጥረታት
  choice: на языке творения
  rationale: Сохранено буквальное и богословски значимое обозначение языка без попытки истолковать его как «первоначальный» или «язык мироздания».
- source_word: ወደገሞን
  choice: переписал их
  rationale: В контексте книг выражение указывает на воспроизведение текста; «переписал» по-русски яснее, чем буквальное «повторил их».
- source_word: አየድዖ
  choice: объяснял ему
  rationale: Передаёт каузативный смысл «давал знать, делал понятным» и естественно сочетается с тем, чего он не мог понять.
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: шесть дождливых месяцев
  rationale: Сохраняет конкретное указание на месяцы сезона дождей, не заменяя его более общим «полгода».
theological_decisions:
- issue: Статус еврейского языка как «языка творения»
  choice: Сохранить формулировку как прямое утверждение повествователя
  alternative: Смягчить до «языка, на котором говорили при сотворении» или пояснить как позднее предание
  rationale: Источник прямо отождествляет еврейский с языком творения; перевод не должен ни ослаблять, ни дополнительно догматизировать это утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён там, где буквальное нанизывание союзов звучало бы тяжеловесно, но последовательность действий и повтор местоимения «их» сохранены. Маркеры сносок не требуются.
