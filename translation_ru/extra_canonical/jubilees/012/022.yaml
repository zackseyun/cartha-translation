  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: ru
  text: 'И слово Господа пришло к нему через меня: «Выйди из своей земли, от своих родных и из дома своего отца в землю, которую Я покажу тебе. Я произведу от тебя великий и многочисленный народ и благословлю тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: слово Господа
  rationale: Прямое и естественное соответствие геэзскому выражению; сохраняет библейскую формулу.
- source_word: በእዴየ
  choice: через меня
  rationale: Буквально выражение связано с «моей рукой», но по смыслу обозначает посредничество говорящего; современное русское «через меня» передаёт это без неестественного буквализма.
- source_word: ትዝምድከ
  choice: свои родные
  rationale: Передаёт круг родства/сородичей естественным современным русским языком.
- source_word: እሬስየከ፡ ሕዝበ
  choice: произведу от тебя… народ
  rationale: Геэзский глагол буквально означает «сделаю тебя», однако по-русски сочетание «сделаю тебя народом» звучит так, будто сам Аврам станет коллективом; выбранная формулировка ясно передаёт смысл происхождения народа от него.
- source_word: ዐቢየ፡ ወብዙኃ
  choice: великий и многочисленный
  rationale: Сохраняет оба определения исходного текста, не сводя «великий» только к численности.
theological_decisions:
- issue: Посредничество ангела в передаче слова Господа
  choice: «слово Господа пришло к нему через меня»
  alternative: «слово Господа было к нему через мою руку»
  rationale: Сохранено различие между Господом как источником речи и повествователем как посредником, но геэзская идиома передана понятным русским оборотом.
- issue: Обещание о народе
  choice: «произведу от тебя великий и многочисленный народ»
  alternative: «сделаю тебя великим и многочисленным народом»
  rationale: Выбор не добавляет конфессионального толкования, а устраняет в русском языке ложное впечатление, будто один человек буквально отождествляется с народом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён настолько, чтобы речь оставалась ясной, но торжественность прямой Божьей речи сохранена.
