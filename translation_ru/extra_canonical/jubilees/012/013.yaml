lexical_decisions:
- source_word: ወተንሥኡ፡ በሌሊት
  choice: И встали они ночью
  rationale: Прямо передаёт последовательность действий и временное обстоятельство.
- source_word: ወፈቀዱ፡ ያድኅኑ
  choice: намереваясь спасти
  rationale: ፈቀደ выражает волю или намерение, а አድኀነ — спасение/избавление; конструкция естественно передана деепричастным оборотом.
- source_word: አማልክቲሆሙ
  choice: своих богов
  rationale: Сохраняет множественное число и притяжательное значение формы.
- source_word: እማእከለ፡ እሳት
  choice: из огня
  rationale: Буквально «из среды огня»; краткая русская формулировка естественна и сохраняет смысл.
- source_word: ወሰረረ፡ አራን
  choice: А Харан бросился
  rationale: Глагол ሰረረ передаёт стремительное движение — «ринулся, бросился»; имя አራን соотнесено с библейским Хараном.
theological_decisions:
- issue: Обозначение идолов словом «боги»
  choice: своих богов
  alternative: своих идолов
  rationale: Источник прямо употребляет «боги»; замена на «идолы» внесла бы поясняющую богословскую оценку, которой в данной формулировке нет.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Эллиптическое окончание сохранено многоточием, поскольку предоставленный исходный сегмент обрывается после глагола движения.
