  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: ru
  text: И Я возвеличу твоё имя, и ты будешь благословен на земле, и в тебе благословятся все народы земли. Тех, кто благословляет тебя, Я благословлю, а тех, кто проклинает тебя, Я прокляну.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: И Я возвеличу твоё имя
  rationale: Точно передаёт каузативное значение «сделаю великим твоё имя» в естественной и достойной русской формулировке.
- source_word: ወትከውን፡ ቡሩከ፡ ውስተ፡ ምድር
  choice: и ты будешь благословен на земле
  rationale: Сохранены пассивная форма и указание на землю; формулировка не подменяет их повелением или обещанием сделать адресата источником благословения.
- source_word: ወይትባረኩ፡ ብከ፡ ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: и в тебе благословятся все народы земли
  rationale: Возвратная форма «благословятся» сохраняет пассивно-медиальную неоднозначность исходного выражения, а «в тебе» буквально передаёт ብከ.
- source_word: ወለእለ፡ ይባርኩከ፡ እባርኮሙ
  choice: Тех, кто благословляет тебя, Я благословлю
  rationale: Сохранены множественное число участников и соответствие между их действием и ответным действием говорящего.
- source_word: ወለእለ፡ ይረግሙከ፡ እረግሞሙ
  choice: а тех, кто проклинает тебя, Я прокляну
  rationale: Передаёт прямой параллелизм исходного текста без смягчения значения глагола «проклинать».
theological_decisions:
- issue: Способ участия народов в благословении Авраама
  choice: «в тебе благословятся»
  alternative: «через тебя получат благословение»
  rationale: Выбрана более формально близкая передача, сохраняющая как предлог «в», так и богословски значимую неопределённость пассивно-медиальной формы.
- issue: Характер ответа Бога проклинающим
  choice: «Я прокляну»
  alternative: «Я предам проклятию»
  rationale: Прямой глагол сохраняет резкость и симметрию исходного высказывания и не добавляет отдельного представления о ритуальном или судебном акте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Я» написано с прописной буквы как традиционное обозначение речи Бога; синтаксис остаётся ясным для обычного современного читателя.
