  source_fidelity: 'Русский текст точно передаёт все смысловые элементы геэзского оригинала: обещание возвеличить имя, состояние благословения «на земле», благословение всех народов земли «в тебе», а также симметричный ответ благословляющим и проклинающим. Формула «в тебе благословятся» уместно сохраняет заложенную в исходной конструкции неоднозначность и не превращает её в более истолковательное «через тебя».'
