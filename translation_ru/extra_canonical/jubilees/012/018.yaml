  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: ru
  text: Он посылает дождь утром и вечером; а если пожелает, не даёт дождю пролиться. Всё в Его руке». И он помолился.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «И он помолился» по смыслу, вероятно, начинают следующее повествовательное звено, но входят в предоставленный исходный сегмент этого стиха.
    reason: segment_boundary
lexical_decisions:
- source_word: ያዘንም
  choice: посылает дождь
  rationale: Каузативный глагол со значением «даёт дождь / вызывает дождь» естественно и точно передан современным русским выражением «посылает дождь».
- source_word: ነግሀ፡ ወሰርከ
  choice: утром и вечером
  rationale: Сохраняет оба временных обозначения и их соединение без добавления отсутствующего в первой части условия.
- source_word: ወእመ፡ ፈቀደ፡ ኢያወርድ
  choice: а если пожелает, не даёт ему пролиться
  rationale: Условие относится только к непосыланию дождя. Местоимение «ему» относится к дождю, а «пролиться» естественно передаёт буквальное «сойти вниз».
- source_word: ወኵሉ፡ ውስተ፡ እዴሁ
  choice: Всё в Его руке
  rationale: Сохранён образ единственного числа «в его руке» и смысл верховной власти, без поясняющего богословского расширения.
- source_word: ወጸለየ
  choice: И он помолился
  rationale: Фраза присутствует в данном исходном сегменте и потому переведена, хотя по ходу повествования она, вероятно, открывает следующую сцену.
theological_decisions:
- issue: Божественное владычество над дождём
  choice: Сохранено прямое утверждение «Всё в Его руке»
  alternative: Разъяснить как «Всё находится в Его власти»
  rationale: Исходный текст использует конкретный образ руки; его сохранение не устраняет богословскую напряжённость и остаётся понятным по-русски.
- issue: Условие «если пожелает»
  choice: Отнесено только к удержанию дождя
  alternative: Повторить условие и перед первым утверждением о дожде
  rationale: В геэзском тексте условная конструкция появляется лишь перед отрицательным сказуемым; добавлять её в первую часть нет текстового основания.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис близок к источнику, но естественен для обычного читателя; архаизмы и конфессионально окрашенные пояснения не вводятся. Заглавные местоимения «Его» указывают на Бога в рамках принятого русского библейского регистра.
