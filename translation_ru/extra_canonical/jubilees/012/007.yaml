  text: before them? And if I speak the truth to them, they will kill me, for their souls cling to them.
translation:
  language: ru
  text: перед ними? И если я скажу им правду[a], они убьют меня, потому что души их привязаны к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скажу им о праведности»; буквальнее: «скажу праведность».'
    reason: Сохраняет семантический диапазон ጽድቀ и подлинную неоднозначность между «истиной» и «праведностью».
lexical_decisions:
- source_word: ጽድቀ
  choice: правду
  rationale: Существительное может обозначать «праведность», но при глаголе речи и в данном контексте естественно передаёт смысл правдивого высказывания; буквальная возможность сохранена в сноске.
- source_word: ተለውት፡ ነፍሶሙ፡ ኀቤሆሙ
  choice: души их привязаны к ним
  rationale: Сохранены образ «душ» и местоименная отсылка источника без уточнения подразумеваемого объекта.
theological_decisions:
- issue: Значение ጽድቀ в речи Аврама
  choice: скажу им правду
  alternative: скажу им о праведности / изреку праведное
  rationale: Контекст допускает как этическое понятие праведности, так и правдивость сказанного. В основном тексте выбран естественный русский оборот, а более формальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Начальная строчная буква и вопросительный знак сохранены, поскольку стих начинается продолжением вопроса из предыдущего контекста; местоимение «к ним» намеренно не разъяснено.
