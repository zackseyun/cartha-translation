  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
translation:
  language: ru
  text: 'две седмины лет[a]. В шестой седмине, в пятый её год, Аврам провёл ночь без сна при наступлении седьмого месяца[b], наблюдая звёзды с вечера до рассвета, чтобы узнать, каким будет этот год по количеству дождей. Он был там один, сидел и наблюдал. И пришло ему на сердце слово, и он сказал: «Все знамения звёзд и их знаки…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Седмина» здесь означает календарный период в семь лет. В Книге Юбилеев время регулярно исчисляется юбилеями, седминами и годами.
    reason: cultural_note
  - marker: b
    text: Выражение может обозначать более конкретно появление новой луны, с которого начинался седьмой месяц.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: седмины лет
  rationale: Буквально передаёт календарную единицу из семи лет и сохраняет характерный для книги способ исчисления времени; пояснение вынесено в сноску.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: при наступлении седьмого месяца
  rationale: 'Сохраняет естественную для контекста неоднозначность: выражение может обозначать начало месяца вообще или, конкретнее, появление новой луны.'
- source_word: ያበይነ፡ ከዋክብተ
  choice: наблюдая звёзды
  rationale: По контексту Аврам бодрствует и исследует звёзды ради прогноза дождей; нейтральное «наблюдая» не добавляет оценки этой практики.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: каким будет этот год по количеству дождей
  rationale: Передаёт смысл вопроса о характере предстоящего года применительно к осадкам естественным современным русским языком.
- source_word: መጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: пришло ему на сердце слово
  rationale: Сохраняет образную формулировку источника, не уточняя без текстового основания, откуда пришло слово.
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: Все знамения звёзд и их знаки…
  rationale: Сохраняет повтор исходного текста и его незавершённость на границе стиха; небольшое лексическое варьирование делает фразу понятнее по-русски, не устраняя её напряжённость.
theological_decisions:
- issue: Характер ночного наблюдения Аврама
  choice: Описать действие нейтрально как наблюдение звёзд
  alternative: Назвать его астрологическим гаданием или, напротив, астрономическим исследованием
  rationale: Источник сообщает цель наблюдения, но не даёт здесь однозначной богословской квалификации; перевод не должен заранее осуждать или оправдывать практику.
- issue: Происхождение слова, пришедшего Авраму на сердце
  choice: Не называть его прямо Божьим словом
  alternative: «Бог вложил ему в сердце слово»
  rationale: В данном отрывке субъект не назван; сохранена исходная неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Седмина» сохранена как точный и узнаваемый календарный термин, но пояснена в сноске. Синтаксис упрощён для ясности, при этом повтор и незавершённая прямая речь источника сохранены.
