  yaml_path: translation/extra_canonical/jubilees/012/024.yaml
  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: ru
  text: 'И Я буду Богом тебе, твоему сыну, сыну твоего сына и всему твоему потомству. Не бойся отныне и во все поколения земли[a]: Я — твой Бог». И Он сказал мне:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и до (вплоть до) всех поколений земли».'
    reason: Сохраняет необычное предложное значение ወእስከ и показывает, что в оригинале нет отдельного слова «вечно».
lexical_decisions:
- source_word: ዘርእከ፡ (zarʾeka)
  choice: всему твоему потомству
  rationale: Собирательное «потомство» естественно передаёт значение «семя, потомки» и сохраняет охват всех последующих поколений.
- source_word: ኢትፍራህ፡ (ʾitfərah)
  choice: Не бойся
  rationale: Прямой запрет во втором лице единственного числа.
- source_word: ወእስከ፡ ኵሉ፡ ትዝምደ፡ ምድር፡
  choice: и во все поколения земли
  rationale: Предлог እስከ буквально выражает предел («до, вплоть до»), однако с «всеми поколениями» по-русски естественнее передать продолжительность как «во все поколения»; буквальная конструкция отмечена в сноске без добавления отсутствующего в оригинале слова «вечность».
- source_word: ወይቤለኒ፡
  choice: И Он сказал мне
  rationale: Источник содержит местоименную глагольную форму «и он сказал мне» и не называет говорящего титулом; прописная буква отражает ближайшего говорящего — Бога — без внесения дополнительного имени.
theological_decisions:
- issue: Объём обещания быть Богом Аврааму и его потомству
  choice: Сохранена последовательность «тебе — твоему сыну — сыну твоего сына — всему твоему потомству»
  alternative: Обобщить как «тебе и всем твоим потомкам»
  rationale: Развёрнутая формула оригинала важна для межпоколенческого характера обещания и не должна сглаживаться.
- issue: Обозначение говорящего в заключительной фразе
  choice: «Он», без добавления титула
  alternative: «Господь Бог» или строчное «он»
  rationale: В оригинале титула нет; прописная буква в русском контексте указывает на Бога, но не расширяет исходный текст.
translation_notes:
  register: Современный литературный русский с достоинством прямой божественной речи. Формула обещания сохранена близко к структуре геэзского текста; неестественная по-русски временная конструкция передана плавно, а её буквальная форма вынесена в сноску.
