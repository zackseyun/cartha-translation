  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: ru
  text: В них нет духа, потому что они — дело рук; вы носите их на своих плечах, и нет вам от них никакой помощи, кроме великого позора.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈስ
  choice: духа
  rationale: Прямое соответствие значению «дух»; речь идёт о безжизненности идолов.
- source_word: ግብረ፡ እደው
  choice: дело рук
  rationale: Сохраняет конкретный и традиционно понятный образ изготовленного руками предмета.
- source_word: ትጸውርዎሙ
  choice: носите их
  rationale: Передаёт значение физического несения без добавления отсутствующей в источнике мысли о бремени.
- source_word: ረድኤት
  choice: помощи
  rationale: Естественный русский эквивалент значения «помощь, содействие».
- source_word: ሐሳር፡ ዐቢይ
  choice: великого позора
  rationale: Передаёт сочетание усилителя «великий» с существительным, обозначающим унижение, стыд или позор.
theological_decisions:
- issue: Природа идолов
  choice: «В них нет духа»
  alternative: «В них нет дыхания»
  rationale: Сохранена лексическая и богословская многозначность መንፈስ, которое может соотноситься с духом и дыханием; основной русский текст следует наиболее прямому соответствию.
- issue: Результат обращения к идолам
  choice: «кроме великого позора»
  alternative: «а лишь великий позор»
  rationale: Формально сохраняется конструкция исключения источника, не превращая её в более свободное противопоставление.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся близким к источнику, но звучит естественно; необоснованное добавление о том, что идолы являются бременем, исключено из основного текста.
