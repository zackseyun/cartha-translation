  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: ru
  text: Тогда главный виночерпий вспомнил об Иосифе и рассказал о нём царю. И царь вывел его из темницы, и Иосиф рассказал царю оба сна царя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: главный виночерпий
  rationale: Титул обозначает начальника виночерпиев; такой перевод естественен по-русски и соответствует придворной должности в контексте.
- source_word: ንጉሥ
  choice: царь
  rationale: Прямое соответствие слову «царь»; здесь речь идёт о египетском правителе.
- source_word: ቤተ፡ ሞቅሕ
  choice: темница
  rationale: Буквально «дом заключения»; «темница» кратко и достойно передаёт смысл в данном повествовательном контексте.
- source_word: ክልኤሆሙ፡ ሕለመሁ
  choice: оба его сна
  rationale: 'Форма ሕለመሁ содержит притяжательный суффикс 3-го лица мужского рода единственного числа («его»), а ክልኤሆሙ выражает парность: «оба».'
theological_decisions:
- issue: Неявные подлежащие последовательных глаголов
  choice: Явно обозначить царя как того, кто вывел Иосифа, а Иосифа — как того, кто пересказал сны
  alternative: 'Сохранить цепочку местоимений: «и он вывел его… и рассказал перед ним…»'
  rationale: В геэзском подлежащие восстанавливаются из повествовательной последовательности, но по-русски одни местоимения создают опасную двусмысленность. Экспликация участников сохраняет естественный смысл эпизода, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Длинная исходная цепочка предложений разделена для ясности; смысловые связи и притяжательная форма источника сохранены.
