  naturalness: Текст в целом литературный и ясный. Однако местоимение в «все его слуги» может быть по-русски отнесено к Иосифу, тогда как в оригинале это слуги фараона. Явное повторение имени устраняет ненужную двусмысленность. Также конструкция «все исполнявшие царскую службу» естественнее звучит как «все, кто исполнял царскую службу».
  terminology: «Иосиф», «фараон», «Египетская», «лицеприятие», «взятки» и «судил по справедливости» уместны в современном литературном русском с умеренно библейским регистром. Конфессионально нагруженных добавлений нет.
