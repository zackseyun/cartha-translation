  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: ru
  text: 'И Иосиф прошёл по всей земле Египетской. Все князья фараона полюбили его, как и все слуги фараона и все, кто исполнял царскую службу, потому что он поступал праведно: не было в нём ни гордости, ни высокомерия в сердце, ни лицеприятия, и он не брал взяток. Он судил по справедливости все народы земли.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መበለ
  choice: прошёл
  rationale: В контексте передвижения Иосифа по Египту глагол естественно передаётся как «прошёл».
- source_word: አፍቀርዎ
  choice: полюбили его
  rationale: Сохраняет прямое значение любви и расположения, не ослабляя его до простого уважения.
- source_word: እለ፡ ይገብሩ፡ ግብረ፡ ንጉሥ
  choice: исполнявшие царскую службу
  rationale: Естественно передаёт буквальную идею тех, кто совершает дело или работу царя.
- source_word: ርቱዐ፡ የሐውር
  choice: поступал праведно
  rationale: Идиома хождения описывает образ поведения; «поступал праведно» ясно и достойно звучит по-русски.
- source_word: ትዕቢተ
  choice: гордости
  rationale: Передаёт отрицательное нравственное качество без конфессионального уточнения.
- source_word: አዐብዮ፡ ልብ
  choice: высокомерия в сердце
  rationale: Сохраняет образ сердца и отличие от предшествующей «гордости».
- source_word: አሢሦተ፡ ገጽ
  choice: лицеприятия
  rationale: Идиома, связанная с лицом, обозначает пристрастное предпочтение людей; русское библейское слово точно и ёмко.
- source_word: ነሢአ፡ ሕልያነ
  choice: не брал взяток
  rationale: Передаёт принятие даров-взяток в судебно-управленческом контексте и избегает ошибочного понимания как «мыслей».
- source_word: ርቱዐ፡ ይኴንን
  choice: судил по справедливости
  rationale: Естественная русская передача праведного, беспристрастного суда.
theological_decisions:
- issue: Характер праведности Иосифа
  choice: поступал праведно
  alternative: ходил праведно
  rationale: Смысл нравственного поведения сохранён без превращения выражения в специальную доктринальную формулу.
- issue: Объём выражения «все народы земли»
  choice: все народы земли
  alternative: весь народ страны
  rationale: Сохранена грамматическая множественность «народы» и формальная широта исходного выражения, несмотря на возможную контекстуальную гиперболу.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис слегка упрощён для ясности, при этом сохранены перечисление нравственных качеств, повторное отрицание перед взятками и смысл всеобщей справедливости суда.
