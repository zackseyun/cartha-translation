  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: ru
  text: 'И в тот год умер Исаак. И всё произошло так, как Иосиф говорил об истолковании двух его снов[a], как он сказал ему: во всей земле Египта было семь лет изобилия, и земля Египта приносила чрезвычайно обильный урожай — одна мера давала тысячу восемьсот мер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В оригинале местоименные отсылки в выражении «двух его снов» и «как он сказал ему» не называют участников прямо; повествовательный контекст может связывать их с Иосифом и фараоном.
    reason: Сохраняет синтаксическую неоднозначность исходного текста, не вводя в основной текст имя, отсутствующее в данном стихе.
lexical_decisions:
- source_word: ሞተ
  choice: умер
  rationale: Прямой и естественный эквивалент глагола «умирать».
- source_word: ፍካሬ
  choice: истолкование
  rationale: Передаёт значение объяснения смысла сновидений в литературном библейском контексте.
- source_word: ጽጋብ
  choice: изобилие
  rationale: Сохраняет смысл достатка и обильного урожая, не сужая его только до сытости.
- source_word: ፈርየት
  choice: приносила чрезвычайно обильный урожай
  rationale: Естественно передаёт плодородие земли и усиление ብዙኀ в данном земледельческом контексте.
- source_word: መስፈርት / መስፈረ
  choice: мера / мер
  rationale: Сохраняет неопределённую единицу объёма исходного текста, не подменяя её конкретной поздней мерой.
theological_decisions:
- issue: Чьи два сна истолковал Иосиф
  choice: двух снов фараона
  alternative: двух его снов
  rationale: Местоименная отсылка в исходной формулировке может быть не вполне явной, но повествовательный контекст указывает на сны фараона; явное обозначение предотвращает ошибочное понимание, будто речь идёт о собственных снах Иосифа.
- issue: Исполнение предсказания Иосифа
  choice: всё произошло так, как Иосиф сказал
  alternative: исполнилось согласно тому, что сказал Иосиф
  rationale: Формулировка сохраняет повествовательное утверждение о соответствии событий истолкованию, не добавляя богословского объяснения механизма исполнения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но последовательность исходного повествования и точная числовая величина сохранены.
