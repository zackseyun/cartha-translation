  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: ru
  text: 'И он сказал фараону, что оба сна фараона — это один и тот же сон, и сказал ему: «Наступят семь лет изобилия во всей земле Египта, а после этого — семь лет голода, какого ещё не бывало на всей земле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: оба его сна — одно и то же
  rationale: Передаёт утверждение о единстве двух снов естественно по-русски, не добавляя отсутствующего в источнике глагола «означают».
- source_word: ጽጋብ
  choice: изобилие
  rationale: Соответствует периоду достатка и обилия урожая в данном контексте.
- source_word: ወእምድኅረዝ
  choice: а после этого
  rationale: 'Сохраняет единственное число указательного элемента: буквально «и после этого», а не «после них».'
- source_word: ረኃብ፡ ዘአኮ፡ ከማሁ
  choice: голода, какого ещё не бывало
  rationale: 'Естественно передаёт сравнительно-отрицательную конструкцию источника: голода, подобного которому не было.'
- source_word: ውስተ፡ ኵሉ፡ ምድር፡ ግብጽ
  choice: по всей земле Египетской
  rationale: Дигнифицированное и понятное обозначение всей территории Египта.
