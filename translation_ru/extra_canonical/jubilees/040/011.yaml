  text: And in the year Joseph stood before Pharaoh, he was thirty years old when he stood before Pharaoh.
translation:
  language: ru
  text: И в тот год, когда Иосиф предстал перед фараоном, ему было тридцать лет, когда он предстал перед фараоном.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иосифу было тридцать лет, когда он предстал перед фараоном».'
    reason: Альтернативный, более краткий перевод опускает повтор; основной текст сохраняет обе конструкции о предстоянии перед фараоном, присутствующие в представленном тексте на языке геэз.
lexical_decisions:
- source_word: ወበዐሰተ
  choice: И в тот год
  rationale: По контексту и данным текстологической проверки форма, вероятно, представляет собой ошибочное написание или дефект передачи ወበዐመተ — «и в год»; перевод сохраняет отдельную начальную временную конструкцию.
- source_word: ቆመ፡ ኀበ፡ ፈርዖን
  choice: предстал перед фараоном
  rationale: Буквально сочетание означает «стоял/встал перед фараоном»; «предстал перед» естественно передаёт официальный характер явления к правителю и сохраняет повтор исходного текста.
- source_word: ወልደ፡ ሠላሳ፡ ክረምተ
  choice: ему было тридцать лет
  rationale: Геэзская возрастная формула буквально связана с «сыном тридцати лет/зим»; современная русская возрастная формула точна и естественна.
