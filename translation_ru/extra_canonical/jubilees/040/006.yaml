  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: ru
  text: 'И Господь даровал Иосифу благоволение и милость в глазах фараона. И сказал фараон своим слугам: «Не найти нам такого мудрого и разумного человека, как этот, ибо с ним Дух Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞገሰ፡ ወምሕረተ
  choice: благоволение и милость
  rationale: 'Передаёт два отдельных понятия исходного текста: расположение/благосклонность и милость, сохраняя их парность.'
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: в глазах фараона
  rationale: Естественный русский эквивалент древней идиомы со значением «перед фараоном, по его оценке».
- source_word: ለባእክኒሁ
  choice: своим слугам
  rationale: Контекстуально и лексически соответствует адресатам фараона; слово «слуги» сохраняет придворно-служебный оттенок.
- source_word: ኢንረክብ
  choice: не найти нам
  rationale: Сохраняет отрицательную форму и значение первого лица множественного числа без усиления до категорического утверждения о невозможности.
- source_word: ጠቢበ፡ ወማእምረ
  choice: мудрого и разумного
  rationale: Передаёт два согласованных качества — практическую мудрость и разумение — привычной и ясной русской парой.
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: Дух Господа
  rationale: Формально передаёт конструкцию «дух Господа», не заменяя её толкованием вроде «Божья мудрость».
- source_word: ምስሌሁ
  choice: с ним
  rationale: Прямо сохраняет значение совместного присутствия, не подменяя его формулой «в нём».
theological_decisions:
- issue: Характер присутствия Духа Господа при Иосифе
  choice: «с ним Дух Господа»
  alternative: «в нём Дух Божий»
  rationale: Эфиопский текст использует выражение «с ним»; перевод сохраняет эту формулировку и не гармонизирует стих с иной традицией Бытия 41:38.
- issue: Регистр слова «Дух»
  choice: прописная буква
  alternative: «дух Господа» со строчной буквы
  rationale: В современном русском библейском регистре личное и божественное обозначение обычно пишется с прописной; при этом перевод не добавляет догматического пояснения.
