  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: ru
  text: И царь нарёк Иосифу имя Понтифанс[a] и дал ему в жёны дочь Потифарана, дочь Сауэса[b] из Гелиополя, начальника стражи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Септуагинте в Быт 41:45 это имя передано как «Псонтомфаних»; здесь сохранена форма эфиопского текста: «Понтифанс».'
    reason: Объясняет непривычную форму имени и отказ от гармонизации с Быт 41:45.
  - marker: b
    text: Эфиопский текст читает «Сауэс» как имя собственное; возможно, эта форма возникла из слова со значением «жрец» или «священник».
    reason: Сохраняет засвидетельствованное чтение, одновременно отмечая вероятную текстовую историю и альтернативное понимание.
lexical_decisions:
- source_word: ጸውዐ፡ ንጉሥ፡ ስሞ፡ ለዮሴፍ
  choice: царь нарёк Иосифу имя
  rationale: Формальная библейская конструкция естественно передаёт действие именования, не сглаживая структуру исходного текста.
- source_word: ጶንጢፋንስ
  choice: Понтифанс
  rationale: Передаёт собственную эфиопскую форму имени, не гармонизируя её с Септуагинтой.
- source_word: ወወሀቦ፡ ወለተ፡ ጶጢፋራን፡ ብእሲተ፡ ለዮሴፍ
  choice: и дал ему в жёны дочь Потифара
  rationale: Русская перестройка ясно выражает, что женщину дали Иосифу в жёны, при сохранении всех компонентов исходной фразы.
- source_word: ሳውፅ
  choice: Сауэс
  rationale: В эфиопском тексте форма воспринимается как имя собственное; перевод «священник» был бы молчаливой эмендацией по Быт 41:45.
- source_word: ዘኢሊዮጶሊስ
  choice: из Гелиополя
  rationale: Естественная русская передача географической принадлежности.
- source_word: ሊቀ፡ ዐቀብት
  choice: начальника стражи
  rationale: Буквально и понятно передаёт титул, сохраняя его синтаксическую связь с ближайшим мужским именем Сауэсом.
theological_decisions:
- issue: Расхождение с Быт 41:45 в имени и титуле тестя Иосифа
  choice: Сохранить чтения «Сауэс» и «начальник стражи» основного текста Геэз
  alternative: Исправить по Быт 41:45 на «жрец (священник) Гелиополя»
  rationale: Перевод следует предоставленному оригинальному тексту и не устраняет текстовую напряжённость посредством гармонизации.
- issue: Неоднозначная генеалогическая конструкция «дочь Потифара, дочь Сауэса»
  choice: Сохранить последовательность двух обозначений «дочь»
  alternative: Перестроить фразу так, чтобы Потифар однозначно стал иным лицом или титулом
  rationale: Исходная формулировка трудна и допускает вопросы о соотношении имён; их нельзя разрешать без текстовой опоры.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Оборот «нарёк имя» сохранён как узнаваемый и уместный для повествовательного регистра; синтаксис слегка упрощён ради ясности, но трудные собственные имена и повтор «дочь» не нормализованы.
