base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: ru
  text: «А теперь пусть фараон поставит надзирателей по всей земле Египетской, и пусть они запасают зерно в городских хранилищах[a] — в каждом городе — во дни урожайных лет[b]. Оно будет запасом на семь лет голода, и земля не погибнет от голода, потому что голод будет очень тяжёлым».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дома городов».'
    reason: Сохраняет доступ к форме геэзского выражения, контекстуально понятого как городские хранилища.
  - marker: b
    text: 'Или: «в годы изобилия».'
    reason: Предлагает более идиоматичную передачу выражения «во дни урожайных лет», не устраняя буквальный оборот из основного текста.
lexical_decisions:
- source_word: መኰንነ
  choice: надзирателей
  rationale: Слово обозначает назначенных должностных лиц; «надзиратели» естественно передаёт их административную роль в данном контексте.
- source_word: ይዝግቡ
  choice: пусть они собирают зерно
  rationale: Глагол выражает накопление или заготовление; объект «зерно» восстанавливается из контекста и делает русскую фразу ясной.
- source_word: በቤተ፡ አህጉር
  choice: в городские хранилища, в каждом городе
  rationale: 'Буквально «в дома городов»; по контексту это хранилища. Следующее «в городе» передано распределительно: «в каждом городе».'
- source_word: በመዋዕለ፡ ዓመታት፡ ዘጽጋብ
  choice: во дни урожайных лет
  rationale: Сохраняется буквальный семитский оборот «во дни лет», а ዘጽጋብ естественно передаётся как характеристика лет изобилия.
- source_word: ሲሳተ
  choice: запасом
  rationale: В контексте продовольствия на будущий голод слово означает припасы, обеспечение или провиант; «запас» звучит естественно и точно.
- source_word: ወኢትትሐጐል፡ ምድር
  choice: и земля не погибнет
  rationale: Сохраняет прямое олицетворённое выражение источника без замены на более истолковывающее «народ не погибнет».
- source_word: እምቅድመ፡ ገጸ፡ ረኃብ
  choice: от голода
  rationale: Буквально «перед лицом голода»; в современном русском причинное «от голода» естественно передаёт смысл, не меняя референта.
- source_word: ኀያል፡ ይከውን፡ ጥቀ
  choice: он будет очень жесток
  rationale: Сохраняется мужской референт «голод» и высокая степень тяжести; «жесток» уместно характеризует губительный голод.
