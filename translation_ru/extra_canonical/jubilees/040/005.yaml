- from: «А теперь пусть фараон поставит надзирателей по всей земле Египетской, и пусть они собирают зерно в городские хранилища[a], в каждом городе, во дни урожайных лет[b]. Оно будет запасом на семь лет голода, и земля не погибнет от голода, потому что он будет очень жесток»].
  to: «А теперь пусть фараон поставит надзирателей по всей земле Египетской, и пусть они запасают зерно в городских хранилищах[a] — в каждом городе — во дни урожайных лет[b]. Оно будет запасом на семь лет голода, и земля не погибнет от голода, потому что голод будет очень тяжёлым».
  rationale: Исправлена структурная пунктуационная ошибка. «Собирают» заменено на «запасают» для передачи накопления продовольствия впрок; характеристика голода уточнена как «очень тяжёлый», что ближе к смыслу исходного выражения и естественнее по-русски. Повтор распределительного указания «в каждом городе» сохранён, а примечания и их привязки оставлены на соответствующих местах.
