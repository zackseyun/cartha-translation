base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: ru
  text: И земля Египетская процветала при фараоне благодаря Иосифу, ибо Господь был с ним и даровал ему больше благоволения и милости, чем всем его современникам[a], на глазах у всех, кто знал его, и всех, кто слышал о нём. Царство фараона было благоустроено, и не было ни противника, ни зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чем всем людям его поколения»; возможно также: «чем всем его родичам».'
    reason: Слово ዘመድ может означать родичей, но в данном контексте, а также с учётом вероятной греческой основы, вероятнее относится к поколению или современникам.
lexical_decisions:
- source_word: ትሠናአወት
  choice: процветала
  rationale: Передаёт благополучие и успешное состояние Египта; контекст шире одного лишь покоя.
- source_word: በቅድሜሁ፡ ለፈርዖን
  choice: при фараоне
  rationale: Естественная русская передача положения земли по отношению к царствующему фараону без неясного буквального «перед фараоном».
- source_word: ሞገሰ፡ ወምሕረተ
  choice: благоволение и милость
  rationale: Сохраняет два отдельных понятия исходного текста.
- source_word: ላዕለ፡ ኵሎሙ፡ ዘመዱ
  choice: возвысив его над всеми его современниками
  rationale: ላዕለ означает «над/сверх», а ዘመድ в данном контексте понимается как люди одного поколения; добавление «возвысив его» делает синтаксическое отношение естественным по-русски.
- source_word: ወረጐዐት፡ መንግሥተ፡ ፈርዖን
  choice: Царство фараона было благоустроено
  rationale: Передаёт устойчивость, упорядоченность и спокойное состояние царства.
- source_word: ሰይጣነ
  choice: противника
  rationale: Здесь слово употреблено в общем значении «противник», а не обязательно как имя Сатаны.
- source_word: እኩየ
  choice: зла
  rationale: Сохраняет абстрактное и контекстуально вероятное значение, не превращая выражение в «злого человека».
theological_decisions:
- issue: Значение ሰይጣነ в заключительной фразе
  choice: противника
  alternative: сатаны
  rationale: Контекст описывает политический порядок в царстве; нарицательное значение сохраняет смысл и не вводит без достаточного основания личного сверхъестественного деятеля.
- issue: Отношение Божьего дара к положению Иосифа среди поколения
  choice: «даровал ему благоволение и милость, возвысив его над…»
  alternative: «даровал ему благоволение и милость над…»
  rationale: Русское «милость над кем-либо» неестественно и может исказить смысл; предложенная конструкция сохраняет превосходящее положение Иосифа, выраженное ላዕለ.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного религиозного текста. Устранены неестественные буквальные обороты, но сохранены параллелизм заключения и различие между «противником» и «злом».
