  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: ru
  text: 'И он поставил его вторым во всём своём царстве, назначил правителем над всем Египтом и велел ему ехать на второй колеснице фараона. Он одел его в одежды из тонкого льна, возложил ему на шею золотую цепь, и перед ним возглашали: «Эл, Эл» и «Абрер»[a]. Он отдал ему в руку свой перстень с печатью, поставил его над всем своим домом, возвеличил его и сказал ему: «Только престолом я буду выше тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эл, Эл» и «Абрер» — возгласы или титулы с неясным значением; поэтому они переданы по звучанию.
    reason: Необходимо сохранить лексическую неопределённость исходного текста и объяснить непривычные формы читателю.
lexical_decisions:
- source_word: ዳግመ
  choice: вторым
  rationale: Передаёт положение Иосифа как второго лица в царстве, в соответствии с прямым значением и контекстом.
- source_word: ቢሶስ
  choice: тонкий лён
  rationale: Заимствованное обозначение высококачественной льняной ткани естественно передаётся по-русски как «тонкий лён».
- source_word: በዝግና፡ ወርቅ
  choice: золотая цепь
  rationale: Контекст коронационного возвышения и параллель в Быт 41:42 поддерживают значение шейной цепи или ожерелья; выбран общеупотребительный русский эквивалент.
- source_word: ማዕተቤ
  choice: перстень с печатью
  rationale: Речь идёт о царском удостоверяющем перстне, передаваемом в руку; выражение ясно современному читателю.
- source_word: መንበር
  choice: престол
  rationale: Сохраняет буквальный образ царской власти и контраст между властью Иосифа и верховным положением фараона.
theological_decisions:
- issue: Значение возгласов «አል፡ አል» и «አቢርር»
  choice: Транслитерировать как «Эл, Эл» и «Абрер» с примечанием о неясности
  alternative: Перевести предположительно как приказ преклониться или как почётный титул
  rationale: Значение этих форм в геэзском тексте неясно; перевод по догадке устранил бы подлинную текстовую неоднозначность.
- issue: Соотношение власти фараона и Иосифа
  choice: «Только престолом я буду выше тебя»
  alternative: «Только в отношении престола я буду больше тебя»
  rationale: Выбран естественный русский оборот, который сохраняет ограничение превосходства фараона именно престолом, не расширяя его смысл.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сделан плавным и доступным, при этом сохранены последовательность царских действий, формальная образность и неоднозначные возгласы исходного текста.
