  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: ru
  text: Иосиф собирал продовольствие для каждого города — в самом этом городе[a], пока города не наполнились зерном, которого из-за обилия уже невозможно было ни сосчитать, ни измерить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для города — в городе»; то есть продовольствие для каждого города складывали в нём самом. Возможное, но менее вероятное понимание: «из города в город».'
    reason: Сжатая геэзская конструкция допускает прежнее пространственное прочтение, однако контекст и параллель с Быт. 41:48 поддерживают распределительное понимание.
lexical_decisions:
- source_word: ሲሳተ
  choice: продовольствие
  rationale: Передаёт общее значение «пища, продовольствие»; последующее упоминание зерна конкретизирует состав запасов.
- source_word: ለሀገር፡ ውስተ፡ ሀገር
  choice: каждого города в самом этом городе
  rationale: Конструкция означает, что продовольствие, относившееся к каждому городу, складывали в нём же; такая передача сохраняет противопоставление двух одинаковых существительных и избегает ошибочного смысла перемещения из города в город.
- source_word: መልአ፡ ስርናየ
  choice: города не наполнились зерном
  rationale: Глагол መልአ прямо выражает наполнение, а ስርናየ — зерно; русская фраза естественно восстанавливает подразумеваемый субъект из контекста.
- source_word: ይስእኑ፡ ኍልቈቶ፡ ወሰፈረ
  choice: невозможно было ни сосчитать, ни измерить
  rationale: Один глагол невозможности относится к обоим параллельным действиям — счёту и измерению.
- source_word: እምነ፡ ብዝኁ
  choice: из-за обилия
  rationale: Сохраняет причинное значение предлога и указывает, что невозможность счёта и измерения была следствием огромного количества зерна.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Продовольствие» выбрано вместо разговорного «еду», а парная конструкция «ни сосчитать, ни измерить» сохраняет грамматический параллелизм источника.
