  rationale: Исправлена только заключительная конструкция, чтобы передать отсутствие памяти о сообщении фараону, не добавляя понятия обязанности. Явное повторение имени Иосифа во втором предложении устраняет потенциальную русскую двусмысленность местоимения «тот» и не меняет смысла.
