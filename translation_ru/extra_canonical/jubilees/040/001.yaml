base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: ru
  text: 'И случилось с ними так, как он им истолковал: фараон вернул начальника виночерпиев к его службе, а пекаря казнил — как Иосиф и истолковал им. Начальник виночерпиев оставил Иосифа в темнице, хотя Иосиф сообщил ему, что произойдёт; он не вспомнил сообщить фараону то, что сказал ему Иосиф, потому что забыл.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: начальник виночерпиев
  rationale: Передаёт явно выраженное в геэзском сочетание «глава/начальник виночерпиев» и сохраняет привычное для библейского повествования обозначение должности.
- source_word: ውስተ፡ ግብሩ
  choice: к его службе
  rationale: Буквально речь идёт о возвращении к его делу или службе; это естественно обозначает восстановление в должностных обязанностях без добавления отсутствующего в тексте слова «должность».
- source_word: ሐባዚስ
  choice: пекарь
  rationale: В источнике перед словом нет ሊቀ («начальник»), поэтому вариант «главный пекарь» был бы гармонизацией с Книгой Бытия.
- source_word: ቀተሎ
  choice: казнил
  rationale: Глагол означает «убил»; в контексте действия фараона «казнил» естественно передаёт смысл, не добавляя способа смерти.
- source_word: ወረሰዮ
  choice: оставил
  rationale: Глагол означает «оставил/поместил», а не «забыл»; значение забывания отдельно выражено глаголом ረሳዐ в конце стиха.
- source_word: ቤተ፡ ሞቅሕ
  choice: в темнице
  rationale: Буквально «дом заключения»; современное литературное «темница» сохраняет достоинство и библейский регистр.
- source_word: አይድዖ
  choice: сообщил ему
  rationale: Каузативная форма означает «дал ему знать, сообщил ему», а не просто «знал».
- source_word: ረሳዐ
  choice: забыл
  rationale: Прямое значение заключительного глагола; сохранено как мотивировка того, что виночерпий не сообщил фараону.
theological_decisions:
- issue: Указание имени Иосифа в начальной формуле
  choice: сохранено местоимение «он»
  alternative: «как Иосиф им истолковал»
  rationale: В первой формуле геэзский текст использует местоимение, а имя Иосифа называет позднее; перевод не вводит отсутствующего повтора.
- issue: Субъект сообщения о будущем
  choice: «хотя тот сообщил ему» — Иосиф сообщил виночерпию
  alternative: виночерпий сообщил Иосифу
  rationale: Форма сама по себе местоименная, однако ближайший контекст толкования снов и содержание сообщения указывают на Иосифа как сообщившего; местоимение «тот» позволяет выразить это естественно, не превращая пояснение в богословское истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет повторное упоминание исполнения толкования и заключительное объяснение «потому что забыл», не сглаживая характерную для источника повторность. Гармонизация с Быт. 40 («главный пекарь») исключена.
