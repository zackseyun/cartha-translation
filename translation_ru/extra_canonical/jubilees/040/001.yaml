revisions:
- from: 'И случилось с ними так, как он им истолковал: фараон вернул начальника виночерпиев к его службе, а пекаря казнил — как Иосиф и истолковал им. Начальник виночерпиев оставил Иосифа в темнице, хотя тот сообщил ему, что произойдёт; он не вспомнил, что должен передать фараону сказанное ему Иосифом, потому что забыл.'
