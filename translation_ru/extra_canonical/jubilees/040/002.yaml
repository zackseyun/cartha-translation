  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: ru
  text: И в те дни фараону в одну ночь приснились два сна о голоде, который наступит по всей земле. Пробудившись ото сна, он созвал всех толкователей снов, бывших в Египте, и прорицателей и рассказал им оба своих сна, но они не смогли понять их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለመ፡ ፈርዖን፡ ሕለመ፡ ክልኤተ
  choice: фараону ... приснились два сна
  rationale: Естественная русская конструкция точно передаёт сообщение о двух снах фараона.
- source_word: በእንተ፡ ነገረ፡ ረኃብ
  choice: о голоде
  rationale: Передаёт тему и содержание снов без тяжеловесного буквального оборота «о деле голода».
- source_word: ዘይከውን፡ ዲበ፡ ኵሉ፡ ምድር
  choice: который наступит по всей земле
  rationale: Будущее значение сохранено; «наступит» естественно сочетается с голодом, а «вся земля» оставлена с присущей выражению широтой.
- source_word: መፈክራነ፡ ሕልም
  choice: толкователей снов
  rationale: Прямое и понятное обозначение людей, истолковывающих сновидения.
- source_word: ወረቅይተ
  choice: и прорицателей
  rationale: Передаёт отдельную группу гадателей или прорицателей, не отождествляя её с толкователями снов.
- source_word: ወአክሀሉ፡ አእምሮ
  choice: но они не смогли понять их
  rationale: Следует прямому смыслу заключительной фразы — неспособности понять, не добавляя отсутствующего в источнике указания на объяснение значения.
theological_decisions:
- issue: Охват выражения «вся земля»
  choice: по всей земле
  alternative: по всей стране
  rationale: Источник использует широкое выражение «вся земля»; перевод не сужает его до Египта или конкретной области.
- issue: Характер деятельности призванных людей
  choice: толкователи снов ... и прорицатели
  alternative: мудрецы ... и волхвы
  rationale: Выбраны функционально ясные современные термины без библейско-конфессиональных ассоциаций, не требуемых данным эфиопским текстом.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан плавным и общедоступным; историко-культурные названия занятий переданы без архаизации. Подлинная широта выражения «вся земля» сохранена.
