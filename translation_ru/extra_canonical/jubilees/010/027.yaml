  yaml_path: translation/extra_canonical/jubilees/010/027.yaml
  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: ru
  text: Это было между Ассуром и Вавилоном, в земле Сеннаар. И он назвал это место Разрушением[a]. В четвёртую неделю, в первый год, в начале его, в тридцать четвёртый юбилей они были рассеяны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Падением», «Крушением».'
    reason: Сохраняется смысловой диапазон геэзского ደቀት, которое может обозначать падение, гибель, разрушение или ниспровержение.
lexical_decisions:
- source_word: ደቀት (däqät)
  choice: Разрушение
  rationale: Слово обозначает падение, гибель, разрушение или ниспровержение. Смысловой перевод уместнее транслитерации, поскольку текст поясняет данное месту имя.
- source_word: ሰናአር (Śänāʾār)
  choice: Сеннаар
  rationale: Употреблена принятая в русской библейской традиции форма названия земли Шинар.
- source_word: ተዘርዉ (täzäräwu)
  choice: они рассеялись
  rationale: Передаёт форму множественного числа и значение рассеяния без добавления явно не названного деятеля.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением летописной последовательности фраз. Неясный антецедент местоимения «он» не уточняется. Формулировка «в самом его начале» сохраняет грамматическую отсылку источника, не решая молча, относится ли начало непосредственно к первому году или к более широкому периоду.
