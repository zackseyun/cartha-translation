    issue: Не вполне ясная соотнесённость «их отца» в заключительном обороте.
    rationale: После слов «братьев своей жены» местоимение «их» в русском может быть ошибочно отнесено к братьям жены, тогда как по контексту и английскому контрольному тексту Мадай — отец сыновей.
  revised_text: И он жил в земле Мидии, близ братьев своей жены, до сего дня. И он назвал место своего жительства и место жительства своих сыновей Мидией — в честь Мадая, их отца.
