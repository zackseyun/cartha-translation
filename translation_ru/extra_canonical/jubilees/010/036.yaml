  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: ru
  text: И он жил в земле Мидии, близ братьев своей жены, до сего дня. И он назвал место своего жительства и место жительства своих сыновей Мидией — в честь Мадая, их отца.
