  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: ru
  text: И они начали строить. На четвёртой неделе они обжигали кирпичи в огне; кирпичи служили им вместо камня, а глина, которой они обмазывали кирпичи, была асфальтом, выходящим из моря и из источников воды в земле Сеннаар.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ራብዕ
  choice: на четвёртой неделе
  rationale: Передаёт временное обозначение буквально и согласуется с принятой в книге системой исчисления неделями.
- source_word: ንንፈሱ፡ በእሳት
  choice: обжигали кирпичи в огне
  rationale: Контекст строительства и последующее упоминание кирпичей указывают на изготовление кирпича посредством обжига.
- source_word: ከመ፡ እብን
  choice: вместо камня
  rationale: 'Естественно передаёт функциональное сравнение: кирпичи использовались как строительный камень.'
- source_word: ፀቡር
  choice: раствором
  rationale: По синтаксису это материал, которым скрепляли или обмазывали кладку; «раствор» ясно выражает строительную функцию, не отождествляя сам материал с обычной глиной.
- source_word: አስፋሌጦስ
  choice: асфальт
  rationale: Прямое обозначение природного битумного материала; современное русское слово соответствует источнику.
- source_word: ባሕር
  choice: море
  rationale: Сохранено прямое значение исходного слова без уточнения конкретного водоёма.
- source_word: земле Сеннаар
  choice: земле Сеннаар
  rationale: Топоним, присутствующий в полном контексте стиха и подтверждённый консультационным слоем, передан в традиционной русской библейской форме.
