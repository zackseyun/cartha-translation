base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: ru
  text: Ханаан увидел, что земля Ливана вплоть до Египетского потока очень хороша. Он не пошёл в землю, доставшуюся ему в наследие, на запад, к морю,[a] а поселился в земле Ливана — с востока и с запада, от рубежа Иордана и от рубежа моря.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально сочетание можно передать: «в сторону запада, моря»; точная синтаксическая связь слов «запад» и «море» не вполне ясна.'
    reason: Сохраняет подлинную неоднозначность геэзского выражения и объясняет избранную естественную русскую формулировку.
  - marker: b
    text: Предоставленный фрагмент геэзского текста обрывается после слов «и от рубежа»; слово «моря» восстановлено по параллельной структуре перечисления и подтверждается консультационным английским текстом.
    reason: Прозрачно отмечает текстуальное восполнение в конце предоставленного источника.
lexical_decisions:
- source_word: መሐዘ፡ ግብጽ
  choice: Египетский поток
  rationale: Передаёт географическое обозначение буквально и в привычной для библейского русского языка форме, не отождествляя его без достаточных оснований с современной рекой.
- source_word: ሠናይ፡ ይእቲ፡ ጥቀ
  choice: очень хороша
  rationale: 'Сохраняет усилительную конструкцию: земля названа не просто хорошей, а очень хорошей.'
- source_word: ምድረ፡ ርስት
  choice: земля, доставшаяся ему в наследие
  rationale: Естественно передаёт понятие наследственного удела, не добавляя богословской интерпретации.
- source_word: መንገለ፡ ዐረብ፡ ባሕር
  choice: на запад, к морю
  rationale: Передаёт направление движения; сочетание допускает понимание запада как стороны моря, поэтому связь оставлена несколько свободной и пояснена в сноске.
- source_word: እምእደ፡ ዮርዳኖስ
  choice: от рубежа Иордана
  rationale: Слово እደ обозначает сторону, край или предел; «рубеж» естественно подходит к описанию границ территории.
theological_decisions:
- issue: Ханаан не занял назначенный ему наследственный удел
  choice: Сохранено прямое противопоставление между наследственной землёй и землёй Ливана, где он поселился
  alternative: Уточнить, что Ханаан сознательно нарушил установленный Богом жребий
  rationale: В самом стихе действие описано без прямой богословской оценки; её не следует вносить из последующего контекста.
- issue: Географическая связь слов «запад» и «море»
  choice: «на запад, к морю»
  alternative: «к западу от моря»
  rationale: Альтернатива создаёт географически и грамматически сомнительное значение. Выбранный вариант сохраняет два ориентира, не делая чрезмерно точного вывода об их синтаксической связи.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством; географические формулы сделаны понятными без архаизации. Начальные слова предоставленного фрагмента («при его разделе — в южной земле») выглядят как окончание предыдущего стиха и потому не включены в текст JUB.10.29.
