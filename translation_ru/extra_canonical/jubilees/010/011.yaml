    text: 'Эфиопский текст в начале стиха труден: соответствующие слова могут выражать силу, твёрдость или правильность, а также усилие, борьбу или состязание. Здесь передан наиболее вероятный общий смысл.'
    reason: textual_difficulty
  - marker: b
    text: Фраза остаётся незавершённой и продолжается в следующем стихе.
