lexical_decisions:
- source_word: በርቱዕ
  choice: прямым путём
  rationale: Слово связано с силой, твёрдостью и правильностью; в сочетании с глаголом «идти» выражение «идти прямым путём» естественно передаёт нравственную направленность, не сводя значение лишь к физической силе.
- source_word: በጽድቅ
  choice: к праведности
  rationale: Передаёт обычное значение «праведность, справедливость» и сохраняет параллелизм с предшествующей нравственной характеристикой.
- source_word: ይትባአሱ
  choice: стремятся
  rationale: Глагол допускает смысл усилия, борьбы или состязания; «стремятся» естественно передаёт целенаправленное усилие в данном нравственном контексте, не внося явного вооружённого противостояния.
- source_word: ይጸውጉ
  choice: причинявших страдания
  rationale: Передаёт действие злых существ как причинение боли или вреда, не добавляя отсутствующий в тексте объект.
- source_word: መካነ፡ ደይን
  choice: месте суда
  rationale: Формально и ясно сохраняет сочетание «место» и «суд».
- source_word: ዓሥራተሙ
  choice: десятую часть из них
  rationale: Передаёт долю группы; незавершённость фразы сохраняется, поскольку предложение продолжается в следующем стихе.
theological_decisions:
- issue: Кого обозначает «всех злых»
  choice: Не добавлять слово «духов» в основной текст
  alternative: «всех злых духов»
  rationale: В данном отрывке существительное «духи» подразумевается контекстом, но в представленном тексте стиха прямо не выражено; формулировка сохраняет источник без лишнего уточнения.
- issue: Нравственный смысл трудной начальной фразы
  choice: «не идут прямым путём и не стремятся к праведности»
  alternative: «не ходят в твёрдости и не борются в праведности»
  rationale: Выбрана понятная современная формулировка, сохраняющая две параллельные отрицательные характеристики и не устраняющая различие между правильным путём и праведностью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; трудность эфиопского начала и переход фразы в следующий стих отмечены сносками.
