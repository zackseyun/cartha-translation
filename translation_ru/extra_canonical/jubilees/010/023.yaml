  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: ru
  text: 'И Господь сошёл, и мы сошли вместе с Ним, чтобы увидеть город и башню, построенные сынами человеческими. Он смешал их языки, так что они перестали понимать речь друг друга, и они прекратили строить город и башню. Поэтому вся земля Сеннаар была названа Вавилоном: там Господь смешал все языки сынов человеческих, и оттуда они рассеялись по своим землям — каждый по своему языку и своему народу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማኅፈድ
  choice: башня
  rationale: В данном рассказе слово обозначает возводимую вместе с городом башню; такой перевод соответствует контексту повествования о Вавилоне.
- source_word: ሰወጠ
  choice: смешал
  rationale: Передаёт действие Бога над языками без дополнительного истолкования; по-русски естественно сочетается со словом «языки».
- source_word: አህጉሪሆሙ
  choice: по своим землям
  rationale: Форма допускает значения областей, стран или земель; «по своим землям» сохраняет географический смысл и не сужает его до городов.
- source_word: ልሳናቲሆሙ
  choice: их языки
  rationale: Слово может обозначать и физический язык, и речь/наречие; здесь контекст ясно указывает на языки общения.
- source_word: ውሉደ፡ ሰብእ
  choice: сыны человеческие
  rationale: Сохраняет формальный и традиционно библейский характер выражения «сыновья людей/человека», не заменяя его общим «люди».
theological_decisions:
- issue: Кто говорит «мы сошли»
  choice: Сохранено первое лицо множественного числа без пояснения личности спутников Господа
  alternative: Истолковать «мы» как ангелов или как внутрибожественное множественное число
  rationale: Источник не разъясняет референта «мы»; перевод сохраняет эту богословскую неоднозначность.
- issue: Причина прекращения строительства
  choice: 'Связь выражена как следствие смешения языков: «так что они перестали понимать»'
  alternative: 'Передать отдельными буквальными предложениями: «Он смешал... и один не слышал слова другого»'
  rationale: Русская формулировка ясно передаёт причинно-следственную связь контекста, не добавляя новой причины и сохраняя содержание исходного текста.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён для ясности, но сохранены повтор «сошёл — сошли», выражение «сыны человеческие» и неразрешённое местоимение «мы». Названия переданы в привычной русской библейской форме: Сеннаар и Вавилон.'
