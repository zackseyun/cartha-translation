  text: И Господь послал на башню[a] могучий ветер, который поверг её на землю. И вот,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в хранилище, и он бросил их».'
    reason: Сохраняет засвидетельствованный альтернативный разбор слов ውስተ፡ ማኅፈድ፡ ወገፍታአ, не подменяя им более вероятное контекстуальное чтение о башне.
lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: могучий ветер
  rationale: Передаёт сочетание «ветер» и «великий/сильный» естественным и возвышенным современным русским языком.
- source_word: ውስተ፡ ማኅፈድ
  choice: на башню
  rationale: В данном повествовательном контексте ማኅፈድ обозначает башню, а ውስተ при глаголе направления естественно передаётся как движение ветра на неё; вариант прежнего прочтения отмечен в сноске.
- source_word: ወገፍታአ
  choice: и поверг её
  rationale: Глагол выражает низвержение; местоименный объект в женском роде соотнесён с русским словом «башня».
- source_word: ወናሁ
  choice: И вот,
  rationale: Сохранена вводная формула источника и её незавершённость на границе стиха.
