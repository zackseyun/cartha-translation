  text: And he was buried in Lubar, a mountain in the land of Ararat. He completed nine hundred and fifty years in his life.
translation:
  language: ru
  text: И он был погребён на горе Лубар, в земле Араратской. Всего он прожил девятьсот пятьдесят лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀብረ
  choice: был погребён
  rationale: Точно передаёт пассивную форму со значением погребения и соответствует достойному повествовательному регистру.
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: на горе Лубар
  rationale: Передаёт Лубар как название горы; русское «на горе» естественно для указания места погребения.
- source_word: በምድረ፡ አራራት
  choice: в земле Араратской
  rationale: Сохраняет географическое значение «земля Арарат» в естественной для русского библейского повествования форме.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: Всего он прожил девятьсот пятьдесят лет
  rationale: Идиоматично передаёт буквальное «исполнил девятьсот пятьдесят лет в своей жизни», не меняя указанной продолжительности жизни.
