lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: место суда
  rationale: Передаёт именную группу буквально, не добавляя отсутствующего в источнике сказуемого; начальная строчная буква подчёркивает, что это продолжение оборванного контекста.
- source_word: ንምሀር፡ ለኖኅ
  choice: Научим Ноя
  rationale: 'Естественно передаёт увещевательное значение формы первого лица множественного числа: «давайте научим / научим».'
- source_word: ኵሎ፡ ፈውሶሙ
  choice: всем средствам исцеления от них
  rationale: Сохраняет идею полного набора лечебных средств; местоименный элемент допускает связь с существами или причиняемыми ими недугами, поэтому выбран русский оборот, естественный в непосредственном контексте главы.
- source_word: እስመ
  choice: потому что…
  rationale: Союз открывает причинное придаточное, продолжение которого отсутствует в данном фрагменте; многоточие показывает незавершённость.
theological_decisions:
- issue: Кто входит в «нас»
  choice: один из нас
  alternative: один из ангелов
  rationale: Источник использует местоимение и не называет группу прямо; сохранена референциальная неоднозначность без поясняющей вставки.
- issue: Грамматическая завершённость начальных слов
  choice: место суда
  alternative: место суда было учреждено
  rationale: В эфиопском тексте нет глагола «было учреждено»; фрагментарность не устранена конъектурой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая незавершённость исходного фрагмента сохранена и обозначена строчной буквой в начале и многоточием в конце.
