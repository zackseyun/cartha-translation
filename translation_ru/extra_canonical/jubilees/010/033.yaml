lexical_decisions:
- source_word: መኰንን
  choice: правитель
  rationale: Слово обозначает правителя, начальника или князя; «правитель» естественно в современном русском и не привносит специального титула.
- source_word: አቡነ
  choice: отцом нашим
  rationale: Передаёт форму «наш отец» с естественным для данного синтаксиса приложением к имени Ноя.
- source_word: ኢሰምዖሙ
  choice: не послушал их
  rationale: В контексте передаёт не просто отсутствие слышания, а отказ внимать названным лицам.
- source_word: ኀደረ
  choice: поселился
  rationale: Глагол может означать пребывание или обитание; «поселился» естественно передаёт начало проживания, не добавляя отсутствующих в сегменте подробностей.
- source_word: ምድረ
  choice: в той земле
  rationale: Форма означает «земля/страна»; указательное «той» делает русский финал связным, отсылая к контексту, не уточняя местность.
theological_decisions:
- issue: Кого обозначает «святой правитель»
  choice: Сохранить нарицательное обозначение без отождествления
  alternative: Уточнить личность или ангельский чин
  rationale: Источник в данном сегменте не называет лицо и не требует конфессионального толкования.
- issue: Пролептический суффикс в በቅድሜሁ፡ ለመኰንን
  choice: Перевести единым оборотом «пред святым правителем»
  alternative: «пред ним, пред святым правителем»
  rationale: Суффикс -hu предваряет существительное с la- и не требует удвоения дополнения в переводе.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. Форма «пред» выбрана ради достоинства и ритма; текст не восполняет материал, отсутствующий в предоставленном геэзском сегменте.
