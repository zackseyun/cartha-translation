  text: Lebanon, from Hamath as far as the entrance of Egypt, he and his descendants to this day. And because of this,
translation:
  language: ru
  text: Ливан — от Хамата до входа в Египет — ему и его потомкам до сего дня. И потому…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊባኖስ
  choice: Ливан
  rationale: Прямое соответствие географическому названию; фрагмент синтаксически продолжает предшествующий контекст.
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: от Хамата до входа в Египет
  rationale: Сохраняет пространственные пределы исходного текста; «вход в Египет» передаёт буквальный географический оборот без преждевременного отождествления с конкретным местом.
- source_word: ውእቱ፡ ወውሉዱ
  choice: ему и его потомкам
  rationale: Мужское местоимение и притяжательный суффикс указывают на ранее названного Ханаана, а не на землю; дательный оборот естественно продолжает подразумеваемое распределение удела.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: до сего дня
  rationale: Традиционный, ясный и стилистически достойный эквивалент формулы «до этого дня».
- source_word: ወበእንተዝ
  choice: И потому…
  rationale: Передаёт причинную связку, которая остаётся незавершённой в предоставленном фрагменте и ведёт к следующему тексту.
theological_decisions:
- issue: Референт мужского местоимения ውእቱ
  choice: ему и его потомкам
  alternative: ему самому и его сыновьям / он и его потомки
  rationale: Форма мужского рода поддерживает отнесение к патриарху Ханаану. Русский дательный оборот лучше согласуется с фрагментарным синтаксисом перечисления уделов, тогда как именительное «он и его потомки» создавало бы неясное сказуемое.
translation_notes:
  register: Современный литературный русский с умеренно библейской формулой «до сего дня». Тире помогают показать вставное обозначение границ. Многоточие отмечает, что заключительная причинная связка продолжается в следующем стихе или сегменте.
