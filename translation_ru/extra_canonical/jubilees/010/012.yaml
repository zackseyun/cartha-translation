  text: We left them so that they might be subject before Satan on the earth. And the remedy for all their diseases...
translation:
  language: ru
  text: Мы оставили их[a], чтобы на земле они были подчинены Сатане. И исцеление от всех их болезней…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом предыдущего стиха: «Мы оставили десятую часть из них».'
    reason: В представленном геэзском тексте сказано только «мы оставили»; указание на десятую часть не выражено в самом этом фрагменте.
  - marker: b
    text: 'Предоставленный исходный текст здесь обрывается; начало фразы можно передать также: «И средство исцеления от всех их болезней…».'
    reason: Геэзское ፈውሰ выступает здесь как именная форма («исцеление; средство исцеления»), а не как глагол «мы исцелили».
lexical_decisions:
- source_word: አተርፍነ
  choice: Мы оставили
  rationale: Форма означает «мы оставили / сохранили»; дополнение «десятую часть» в данном отрывке прямо не выражено.
- source_word: ይትኰነኑ
  choice: были подвластны
  rationale: Передаёт состояние под властью сатаны в данном контексте, не усиливая выражение до однозначного «были осуждены».
- source_word: ቅድመ፡ ሰይጣን
  choice: сатане
  rationale: Буквальное «перед сатаной» здесь идиоматически обозначает подчинённость ему; русское управление передано естественно.
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: И средство от всех их болезней…
  rationale: ፈውስ здесь понято как существительное «исцеление, лечебное средство», а не как глагол «мы исцелили»; многоточие сохраняет обрыв предоставленного текста.
theological_decisions:
- issue: Характер отношения духов к сатане
  choice: были подвластны сатане
  alternative: были осуждены перед сатаной
  rationale: Контекст допускает оттенки подчинения или нахождения под властью; выбранная формулировка не вводит дополнительной сцены суда.
- issue: Неявное указание на десятую часть
  choice: их
  alternative: десятую часть из них
  rationale: В данном геэзском фрагменте числительное отсутствует; контекстуальное восполнение вынесено в примечание, а не включено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Порядок слов слегка перестроен ради естественности; строчная форма «сатана» употреблена как обозначение противника. Многоточие показывает, что предоставленный геэзский источник заканчивается незавершённой именной фразой.
