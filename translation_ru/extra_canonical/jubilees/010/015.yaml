  text: Ибо он любил его больше всех своих сыновей. И Ной почил с отцами своими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: его
  rationale: Независимое объектное местоимение означает «его»; имя референта в самом стихе не названо, поэтому неоднозначность сохранена.
- source_word: ያፈቅር
  choice: любил
  rationale: Передаёт значение любви или особой привязанности естественным современным русским глаголом.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: больше всех своих сыновей
  rationale: Сравнительная конструкция передана прямо и ясно; притяжательное отношение выражено словом «своих».
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: И почил Ной со своими отцами
  rationale: Традиционная библейская формула естественно передаёт эвфемистическое «уснул с отцами» и сохраняет достоинство регистра.
theological_decisions:
- issue: Референт местоимения ኪያሁ
  choice: Сохранить местоимение «его» без подстановки имени.
  alternative: Указать имя предполагаемого референта, например Сима или Арфаксада.
  rationale: Геэзский текст содержит местоимение, а не имя. Подстановка имени устранила бы контекстуальную неоднозначность и вышла бы за пределы данного стиха.
- issue: Формула смерти Ноя
  choice: «почил ... со своими отцами»
  alternative: 'Буквально: «уснул ... со своими отцами».'
  rationale: «Почил» сохраняет библейский эвфемизм смерти и звучит в современном литературном русском естественнее, не добавляя учения о посмертном состоянии.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Местоименная неопределённость оригинала сохранена; отсутствующий в геэзском тексте материал о погребении не добавлен.
