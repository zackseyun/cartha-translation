  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: ru
  text: 'И мы сообщили Ною и об их обольщениях, и о том, как исцелять с помощью растений земли. Ной записал в книге всё, чему мы его научили: все виды целебных средств; и духи были удержаны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስሕተትሙ
  choice: об их обманах
  rationale: Слово указывает на обман, введение в заблуждение или обольщение. Перевод «обманах» сохраняет широкий смысл и не подменяет его отсутствующим в данной строке словом «лекарства».
- source_word: ዕፀወ ምድር
  choice: земных растений
  rationale: Буквально «растений земли»; естественное русское выражение сохраняет указание на растительное происхождение средств.
- source_word: ትዝምደ ፈውሳት
  choice: виды целебных средств
  rationale: Передаёт сочетание со значением разновидностей или разрядов средств исцеления, не ограничивая его современным понятием лекарственных препаратов.
- source_word: ተዐጸዉ
  choice: были обузданы
  rationale: Пассивная форма выражает удерживание, ограничение или запирание; «были обузданы» естественно передаёт ограничение действия духов.
- source_word: መናፍስት
  choice: духи
  rationale: В исходной строке нет определения «злые», поэтому оно не добавлено.
theological_decisions:
- issue: Характер духов
  choice: духи
  alternative: злые духи
  rationale: Хотя контекст может указывать на вредоносных духов, стих в представленном источнике не содержит прилагательного «злые»; нейтральное обозначение сохраняет формулировку источника.
- issue: Объект исцеления
  choice: как исцеляться
  alternative: чтобы они исцелялись / как исцелять людей
  rationale: Источник не называет объект исцеления однозначно. Безличная русская конструкция сохраняет эту недосказанность и не вводит явно ни людей, ни сыновей Ноя.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Формулировки близки к структуре геэзского текста, но синтаксис сделан естественным для обычного читателя. Английский консультационный слой не воспроизведён там, где его «all their medicines» не соответствует представленному слову አስሕተትሙ.
