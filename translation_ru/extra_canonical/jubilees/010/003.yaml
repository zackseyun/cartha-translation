  text: And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—
translation:
  language: ru
  text: 'И он помолился пред Господом, Богом своим, и сказал: «Боже духов всякой плоти, Ты помиловал меня и спас меня и моих сыновей от вод потопа и не дал мне погибнуть, как Ты погубил сынов погибели, —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: God of the spirits of all flesh
  choice: Боже духов всякой плоти
  rationale: Сохранена традиционная библейская формула, связывающая Бога с духами всех живущих во плоти; звательный падеж естественно передаёт обращение в молитве.
- source_word: shown mercy to me
  choice: Ты помиловал меня
  rationale: Краткий и естественный русский глагол передаёт проявленное Богом милосердие без избыточного пояснения.
- source_word: waters of the flood
  choice: вод потопа
  rationale: Сохранён конкретный образ вод Потопа и библейская связь с рассказом о Ное.
- source_word: sons of perdition
