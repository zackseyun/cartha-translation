  choice: как Ты погубил сынов погибели
  alternative: как Ты дал погибнуть сынам погибели
  rationale: Конструкция консультационного текста прямо приписывает действие Богу; перевод не смягчает эту богословскую напряжённость.
- issue: Незавершённость высказывания в пределах стиха
  choice: тире после запятой передаёт продолжение молитвы
  alternative: завершить стих точкой
  rationale: Стих синтаксически продолжается далее, поэтому сохранена открытая конструкция, а не создано искусственное завершение.
