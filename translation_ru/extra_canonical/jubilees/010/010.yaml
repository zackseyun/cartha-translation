  text: And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”
translation:
  language: ru
  text: 'И Он сказал: «Пусть десятая часть их останется перед ним, а девять частей пусть сойдут в место суда».'
  philosophy: optimal-equivalence
