- from: 'В тридцать третьем юбилее, в первый год второй седмины, Фалек взял себе жену по имени Ломна, дочь Сеннаара. В четвёртый год этой седмины она родила ему сына. Он назвал его Рагавом, потому что сказал: «Вот, сыны человеческие стали злыми по нечестивому замыслу построить себе город и башню в земле Сеннаар».'
