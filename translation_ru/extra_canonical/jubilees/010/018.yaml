  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: ru
  text: 'В тридцать третий юбилей, в первый год второй седмины, Фалек взял себе жену по имени Ломна, дочь Сеннаара. В четвёртый год этой седмины она родила ему сына. Он назвал его Рагавом, потому что сказал: «Вот, сыны человеческие стали злыми, составив нечестивый замысел: построить себе город и башню в земле Сеннаар».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፋሌክ
  choice: Фалек
  rationale: Традиционная русская библейская форма имени Пелега, понятная читателю и соответствующая родословной Бытия.
- source_word: ሎምና
  choice: Ломна
  rationale: Прямая передача эфиопской формы личного имени.
- source_word: ሲናአር
  choice: Сеннаар
  rationale: Устоявшаяся русская библейская форма названия Шинара.
- source_word: ራገው
  choice: Рагав
  rationale: Традиционная русская библейская форма имени Реу.
- source_word: ውሉደ፡ ሰብእ
  choice: сыны человеческие
  rationale: Сохраняет библейскую образность выражения «дети/сыны людей» и достойный регистр.
- source_word: በምክረ፡ ዐግ
  choice: по нечестивому замыслу
  rationale: Передаёт сочетание «по совету/замыслу нечестия» естественным современным русским языком, не ослабляя нравственной оценки.
- source_word: ማኅፈደ
  choice: башню
  rationale: По контексту рассказа о Вавилоне и свидетельству консультационного слоя обозначает башню.
- source_word: ውስተ፡ ምድረ
  choice: в земле Сеннаар
  rationale: Форма «земли» находится в сопряжённом состоянии и требует зависимого названия; оно, вероятно, оказалось за границей сегмента при разбиении стиха.
theological_decisions:
- issue: Связь нечестия людей с намерением построить город и башню
  choice: «стали злыми по нечестивому замыслу построить»
  alternative: «стали злыми по совету нечестия, чтобы построить»
  rationale: Выбранный вариант сохраняет причинно-смысловую связь с замыслом строительства и избегает двусмысленности, будто целью их нравственного падения было строительство.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Хронологический термин ሱባዔ передан как «седмина», чтобы ясно отличить семилетний период от обычной календарной недели. Начальные слова исходного сегмента «поколение… для дня суда» выглядят как остаток предыдущего стиха и не включены в текст 10:18.
