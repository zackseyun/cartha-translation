  rationale: 'Исправлены только русская форма порядкового хронологического обозначения и синтаксис заключительного высказывания. Уточнение «Сеннаар» в финальной фразе сохранено как грамматически требуемое продолжение сопряжённой формы «земле» и как подтверждаемое контекстом. Смысловую неоднозначность о соотношении нечестия и замысла не догматизирует: текст по-прежнему говорит о нечестивом замысле строительства.'
