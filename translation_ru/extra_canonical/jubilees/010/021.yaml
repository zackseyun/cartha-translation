base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: ru
  text: И строили её сорок три года. Ширина её была 204 локтя[a], а высота одного кирпича — треть локтя; высота же её составляла 5 433 локтя, две ладони и двенадцать стадиев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Меры башни в эфиопском тексте крайне трудны для истолкования; некоторые числа или названия единиц, возможно, искажены при передаче. Здесь сохранены дошедшие до нас величины, однако точные размеры остаются неясными.
    reason: textual_variant
