- source_word: ማእስቱ፡ አሐቲ፡ ኑኅ
  choice: высота одного кирпича — треть локтя
  rationale: Фраза понята в соответствии с контекстом описания размеров кирпича; «треть локтя» ясно выражает долю названной меры.
- source_word: ፲ወ፪ ምዕራፍ
  choice: двенадцать стадиев
  rationale: Число ፲ወ፪ означает 12. Не добавлены отсутствующие в эфиопском тексте сведения о протяжённости двух стен.
