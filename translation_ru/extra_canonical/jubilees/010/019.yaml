  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: ru
  text: 'Ибо они переселились из земли Араратской на восток, в Сеннаар, и в его дни построили город и башню, говоря: «Давайте поднимемся по ней на небо».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: переселились
  rationale: Глагол выражает перемещение с прежнего места и поселение в другом; «переселились» естественно передаёт это в данном повествовательном контексте.
- source_word: መንገለ፡ ጽባሕ
  choice: на восток
  rationale: Буквально направление к восходу; современное русское обозначение направления — «на восток».
- source_word: ሰናአር
  choice: Сеннаар
  rationale: Сохранена традиционная русская библейская форма географического названия Шинар.
- source_word: ማኅፈድ
  choice: башню
  rationale: В контексте рассказа о городе и восхождении на небо слово обозначает башню.
- source_word: ንዕርግ፡ ቦቱ
  choice: поднимемся по ней
  rationale: Передаёт приглашение к восхождению посредством башни, не усиливая исходный текст более книжным «взойдём».
theological_decisions:
- issue: Направление и цель восхождения
  choice: «поднимемся по ней на небо»
  alternative: «взойдём по ней в небо»
  rationale: Выбрана естественная современная формулировка, сохраняющая представление участников о башне как средстве восхождения и не комментирующая осуществимость их замысла.
- issue: Референт местоимения в выражении «в его дни»
  choice: Сохранено «в его дни»
  alternative: Назвать предполагаемое лицо прямо
  rationale: Исходный фрагмент содержит мужское местоименное указание, чей референт определяется более широким контекстом; неоднозначность не следует устранять добавлением имени.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохранён близким к исходному, но формулировки сделаны понятными обычному читателю.
