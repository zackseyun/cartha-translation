  yaml_path: translation/extra_canonical/jubilees/010/007.yaml
  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: ru
  text: И пусть они не господствуют над духами живых, ибо Ты один знаешь их суд; и не давай им власти над сынами праведных отныне и вовеки».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spirits of the living
  choice: духами живых
  rationale: Сохранена необычная и потенциально многозначная конструкция исходного свидетельства без сведения её к «живым людям» или к определённому классу духов.
- source_word: rule over
  choice: господствуют над
  rationale: Передаёт не просто воздействие, а власть и господство.
