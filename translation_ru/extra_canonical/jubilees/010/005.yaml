  text: But bless me and my sons, that we may increase and multiply and fill the earth.
translation:
  language: ru
  text: Но благослови меня и моих сыновей, чтобы мы плодились, размножались и наполняли землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: increase and multiply
  choice: плодились и размножались
  rationale: Устойчивая и естественная библейская формула в современном русском языке, сохраняющая два координированных понятия исходного выражения.
- source_word: fill the earth
  choice: наполнили землю
  rationale: Прямая и ясная передача образа заселения земли без добавочного толкования.
