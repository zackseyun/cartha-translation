  text: And the Lord sent a mighty wind against the tower, and it threw it down upon the earth.
translation:
  language: ru
  text: И Господь послал на башню могучий ветер, и тот поверг её на землю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В источнике далее стоит «и вот», грамматически открывающее следующее предложение.
    reason: Сохраняет сведения об исходном тексте, не оставляя в конце стиха оборванного вводного слова, возникшего из-за деления на стихи.
lexical_decisions:
