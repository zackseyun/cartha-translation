  rationale: 'Сохраняет последовательность и прямой смысл геэзского выражения: «и дал всё, что написал»; «отдал» естественно передаёт передачу написанного другому лицу.'
- source_word: ለሴም፡ ወልዱ
  choice: своему сыну Симу
  rationale: Естественный русский порядок слов точно передаёт «Симу, сыну его».
- source_word: ዘይፈህቅ
  choice: которого любил
  rationale: Относительное придаточное сохраняет структуру источника и не превращает её в причинное «потому что».
