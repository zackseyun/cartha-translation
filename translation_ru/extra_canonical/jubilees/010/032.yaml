  yaml_path: translation/extra_canonical/jubilees/010/032.yaml
  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: ru
  text: «Проклят ты, и проклят будешь более всех сыновей Ноя — проклятием, которым мы связали себя клятвой перед святым Судьёй и перед Ноем, отцом нашим».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В отображённом фрагменте геэзского текста слова «перед святым Судьёй и перед Ноем, отцом нашим» не сохранились; они переданы по засвидетельствованному продолжению текста.
    reason: Сноска отмечает, что конец перевода опирается на продолжение, не показанное в приведённом фрагменте источника.
lexical_decisions:
- source_word: ርጉም፡ አንተ፡ ወርጉመ፡ ትከውን
  choice: Проклят ты, и проклят будешь
  rationale: Сохраняет повтор, временное противопоставление настоящего и будущего и торжественную формулу исходного текста.
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: среди всех сыновей Ноя
  rationale: Передаёт сравнительно-выделительное значение конструкции без неестественного русского «более всех сыновей Ноя».
- source_word: በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ
  choice: тем проклятием, которым мы связали себя клятвой
  rationale: Сохраняет инструментальную конструкцию, относительную связь и обязывающий характер совместной клятвы.
- source_word: holy judge
  choice: святым Судьёй
  rationale: Формулировка сохранена по засвидетельствованному продолжению в проверочном английском слое; прописная буква указывает на титульное употребление.
theological_decisions:
- issue: Кого обозначает «святой Судья»
  choice: Не уточнять; передать как титул «святой Судья»
  alternative: Заменить на прямое именование Бога
  rationale: Текст использует титул, а не прямое имя; конкретизация устранила бы сохранённую в источнике меру недосказанности.
- issue: Сила сравнения проклятия с сыновьями Ноя
  choice: «среди всех сыновей Ноя»
  alternative: «более всех сыновей Ноя»
  rationale: Русская формулировка естественно обозначает особое проклятие в пределах названной группы, не усиливая его до явно градуального утверждения.
translation_notes:
  register: Современный литературный русский с торжественным оттенком клятвенной формулы. Повтор «проклят» намеренно сохранён. Порядок слов слегка приподнят, но остаётся ясным для обычного читателя.
