  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: ru
  text: 'И пришёл Мастема[a], глава духов, и сказал: «Господи, Творец, пусть некоторые из них останутся при мне, слушаются моего голоса и исполняют всё, что я им скажу. Ведь если некоторые из них не будут оставлены мне, я не смогу осуществлять над сынами человеческими власть, соответствующую моей воле. Ибо они предназначены для растления и совращения перед моим судом, потому что велико нечестие сынов человеческих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мастема — глава духов в данном повествовании.
    reason: Нейтрально поясняет незнакомое имя и его роль в стихе, не отождествляя персонажа с иными фигурами.
lexical_decisions:
- source_word: Mastema
  choice: Мастема
  rationale: Имя передано традиционной русской транслитерацией, без подмены его именем Сатаны; в данном стихе это глава духов.
- source_word: chief of the spirits
  choice: глава духов
  rationale: Естественная и точная передача титула, сохраняющая иерархический смысл.
- source_word: Lord, Creator
  choice: Господь-Творец
  rationale: Дефис естественно оформляет тесное сочетание обращения и титула в современном русском языке.
- source_word: exercise the authority of my will
  choice: осуществлять власть моей воли
  rationale: Сохранена необычная исходная связь власти и воли, не сведённая к более узкому толкованию «делать что хочу».
- source_word: sons of men
  choice: сыны человеческие
  rationale: Сохранён библейский антропологический оборот и его приподнятый регистр.
- source_word: corruption and leading astray
  choice: растление и совращение
  rationale: Пара отвлечённых существительных сохраняет параллелизм и не решает однозначно, означает ли первое слово нравственную порчу или причинение гибели.
- source_word: before my judgment
  choice: перед моим судом
  rationale: Формальная передача сохраняет неясную смысловую связь с предшествующими словами и не заменяет её толкованием.
theological_decisions:
- issue: Статус Мастемы
  choice: Сохранить собственное имя и титул «глава духов»
  alternative: Отождествить Мастему с Сатаной или дьяволом
  rationale: Сам стих называет персонажа Мастемой и не требует в переводе полного отождествления с иным именованным персонажем.
- issue: Характер власти Мастемы
  choice: Передать просьбу об осуществлении «власти моей воли»
  alternative: Сформулировать как безусловно данную Богом власть или как простое личное желание
  rationale: Так сохраняется напряжение между дозволением Творца и заявленной волей главы духов.
- issue: Смысл выражения о суде
  choice: «перед моим судом»
  alternative: «по моему приговору», «до моего суда» или «под моей властью»
  rationale: Исходное выражение неоднозначно; перевод не должен заранее выбирать конкретную судебную или временную интерпретацию.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Повторы «некоторые из них» и «сыны человеческие» сохранены ради структуры аргумента. Предоставленный геэзский фрагмент родительской записи начинается с последующего контекста и не содержит полного текста 10:9; поэтому формулировки стиха сверены по доступному английскому аудированному слою, а неоднозначные места переданы консервативно.
