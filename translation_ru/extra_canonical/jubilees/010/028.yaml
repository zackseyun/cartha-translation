translation:
  language: ru
  text: из земли Сенаарской.[a] А Хам и его сыновья отправились в землю, которая была отведена ему и которую он получил.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих начинается завершением предложения предыдущего стиха; описание расселения Ханаана в этом месте текста сжато и местами трудно для истолкования.
    reason: segmentation_note
  - marker: b
    text: 'Или: «которой он овладел».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ሲናአር
  choice: Сеннаарской
  rationale: Традиционная русская библейская форма топонима Шинар; падежная форма естественно передаёт እምድረ — «из земли».
- source_word: ወውሉዱ
  choice: и его сыновья
  rationale: Буквально «и его дети/сыновья»; по контексту родоначальников и разделения земель уместно «сыновья».
- source_word: እንተ አሕዝት ሎቱ
  choice: которая была отведена ему
  rationale: Передаёт causative/possessive sense выражения и контекст законного удела, не создавая ложного впечатления самовольного захвата.
- source_word: ዘረከበ
  choice: которую он получил
  rationale: Сохраняет отдельное относительное определение и основное значение «получил/обрёл»; возможный оттенок вступления во владение отмечен в сноске.
theological_decisions:
- issue: Характер владения землёй Хама
  choice: «была отведена ему… получил»
  alternative: «захватил себе»
  rationale: Источник описывает вступление Хама в свой удел; вариант «захватил» неоправданно приписывал бы ему самовольное присвоение, характерное для последующего рассказа о Ханаане.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальная строчная буква сохранена, поскольку фраза продолжает предложение предыдущего стиха; синтаксическая повторность двух определительных конструкций удержана вслед за источником.
