base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: ru
  text: 'И сказали ему отец его Хам и братья его Куш и Мицраим: «Ты поселился в земле, которая не твоя и не выпала тебе по жребию. Не поступай так, иначе ты и твои сыновья падёте в этой земле и будете прокляты за непокорность[a]. Ведь ты поселился здесь вопреки воле других, и так же падут твои сыновья, а ты будешь искоренён навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете прокляты из-за мятежа».'
    reason: Предлог и существительное допускают причинное и обстоятельственное прочтение; «мятеж» является более резким лексическим вариантом.
lexical_decisions:
- source_word: ኀደርከ
  choice: ты поселился
  rationale: Глагол обозначает пребывание или поселение; в контексте раздела земли естественно современное «поселился».
- source_word: በዕፁ
  choice: по жребию
  rationale: Выражение указывает на распределение земли посредством жребия.
- source_word: ትወድቁ
  choice: падёте / падут
  rationale: Сохранён конкретный образ падения, который может подразумевать гибель или утрату владения, без преждевременного устранения этой многозначности.
- source_word: በሀከከ
  choice: за непокорность
  rationale: Передаёт идею мятежного неповиновения; форма выражения допускает оттенки причины, образа действия или обстоятельства.
- source_word: ርጉማን
  choice: будете прокляты
  rationale: Прямое и понятное соответствие причастной форме со значением пребывания под проклятием.
theological_decisions:
- issue: Характер проступка при незаконном заселении земли
  choice: непокорность / вопреки воле других
  alternative: мятеж / по причине мятежа
  rationale: Выбран нейтральный язык неповиновения, не приписывающий тексту позднейшей конфессиональной трактовки; в сноске сохранён более резкий вариант.
- issue: Значение «падения» потомков
  choice: сохранить глагол «пасть»
  alternative: погибнуть или лишиться земли
  rationale: Источник использует образ падения, и его возможные политические, территориальные и смертельные оттенки не следует сводить к одному.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским ритмом. Родственные связи сформулированы без двусмысленности: Хам — отец адресата, Куш и Мицраим — его братья. Представленный фрагмент геэзского текста обрывается после повторного «потому что»; заключительная часть переведена с опорой на засвидетельствованное продолжение в указанном издании, отражённое в аудированном английском консультационном слое.'
