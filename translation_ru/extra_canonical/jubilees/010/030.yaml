review_pass:
  verdict: revise
  source_fidelity: 'Начало стиха передано в целом верно: Хам назван отцом адресата, а Куш и Мицраим — его братьями; также сохранены поселение на не принадлежащей адресату земле и жребий. Однако «вопреки воле других» не имеет опоры ни в представленном геэзском тексте, ни в английском аудиторском слое: повторённое ключевое понятие — «мятеж/бунт» (rebellion). Конец предоставленного геэзского фрагмента обрывается, поэтому его следует передавать согласно отражённому в аудиторском слое продолжению, не подменяя его иной мотивацией.'
  naturalness: Перестройка перечисления («Хам, отец его, и Куш и Мицраим, братья его») делает родственные отношения ясными и сохраняет умеренно библейский, но современный литературный регистр. «Не делай этого» естественно передаёт запрет, обращённый к одному лицу.
  terminology: «Мятеж» точно передаёт более сильный термин английского контрольного слоя rebellion и согласованно воспроизводит его повтор. «Прокляты» и «искоренён» сохраняют традиционную и понятную библейскую лексику. Образ «падут» намеренно не конкретизируется.
  issues:
  - severity: high
    issue: В конце стиха добавлено «вопреки воле других».
    rationale: Это смысловое расширение не засвидетельствовано источником или английским POB audit trail, где стоит повтор «через/по причине мятежа».
  - severity: medium
    issue: 'Ключевой термин передан непоследовательно: «непокорность» в основной строке и «вопреки воле других» при повторе.'
    rationale: В источниковом контрольном переводе один и тот же мотив rebellion повторён трижды; в русском его следует передать единообразно, не ослабляя и не заменяя иной причиной.
  revised_text: 'И Хам, отец его, и Куш и Мицраим, братья его, сказали ему: «Ты поселился в земле, которая не твоя и которая не досталась тебе по жребию. Не делай этого, ибо, если сделаешь, ты и сыновья твои падёте в той земле и будете прокляты за мятеж[a]. Ибо в мятеже ты поселился, и в мятеже падут сыновья твои, а ты будешь искоренён навеки».'
  revised_footnotes:
  - marker: a
    text: 'Или: «будете прокляты из-за мятежа».'
    reason: Конструкция допускает передачу мятежа как обстоятельства или причины; оба варианта сохраняют ключевой термин без богословской конкретизации.
  revision_rationale: Удалено неоснованное добавление о «воле других» и восстановлен повтор мотива мятежа, отражённый в английском POB audit trail. Родственные связи и образный глагол «падут» сохранены. Поскольку предоставленный геэзский фрагмент обрывается перед заключительным продолжением, его перевод следует проверять по полному тексту издания; предложенная редакция следует засвидетельствованному английскому контрольному продолжению и не добавляет нового смысла.
