base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/004.yaml
  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: ru
  text: Ибо велика была ко мне Твоя благодать, и велико Твоё милосердие к жизни моей. Да будет велика Твоя благодать над моими сыновьями[a], и не дай злым духам властвовать над ними, чтобы они не истребили их с земли.
  philosophy: optimal-equivalence
  footnotes:
