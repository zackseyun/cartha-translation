  yaml_path: translation/extra_canonical/jubilees/010/002.yaml
  text: the unclean demons began to lead astray the children of the sons of Noah, and to make them err and destroy them.”
translation:
  language: ru
  text: И нечистые демоны стали сбивать с пути детей сыновей Ноя, вводить их в заблуждение и губить их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: unclean demons (English consultation layer; corresponding Geʽez wording for v. 2 is absent from the supplied excerpt)
  choice: нечистые демоны
  rationale: Сохраняет прямое обозначение духовных существ и нравственно-ритуальную характеристику «нечистые» без ослабления смысла.
- source_word: children of the sons of Noah
  choice: детей сыновей Ноя
  rationale: Передаёт родственную цепочку буквально и не заменяет её более широким словом «потомки».
