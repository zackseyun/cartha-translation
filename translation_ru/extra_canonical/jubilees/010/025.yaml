  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: ru
  text: Она находится между Ассуром и Вавилоном, в земле Сеннаар. Её назвали Разрушением[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название, переведённое как «Разрушение», связано с гибелью башни; точная форма имени в эфиопской традиции неясна.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሱር
  choice: Ассур
  rationale: Передаёт географическое название и отличает область Ассура от города Вавилона.
