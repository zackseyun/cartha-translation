  source_fidelity: 'Начальное исчисление передано точно: девятнадцать юбилеев, две седмины лет и пять лет. Сравнение Ноя с людьми и исключение Еноха сохранены без небезопасного уточнения предмета превосходства. «Поставлен свидетелем» соответствует ስምዕ в значении свидетель/свидетельство и согласуется с последующим поручением. Однако «деяниях каждого последующего поколения» излишне преобразует обобщённое «из поколения в поколение» в последовательность отдельных последующих поколений; это следует исправить.'
