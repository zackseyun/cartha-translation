    issue: «каждого последующего поколения»
    rationale: Оригинал и английская контрольная версия говорят о деяниях «из поколения в поколение» (generation after generation), а не специально о каждом «последующем» поколении. Исправление устраняет ненужную конкретизацию и улучшает русский синтаксис.
