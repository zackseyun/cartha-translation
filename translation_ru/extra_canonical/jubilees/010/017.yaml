base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: ru
  text: Девятнадцать юбилеев, две седмины лет и пять лет. За время своей жизни на земле он превзошёл сынов человеческих[a], кроме Еноха, благодаря праведности, в которой достиг совершенства. Ибо Енох был поставлен свидетелем[b] для поколений мира, чтобы возвещать обо всех деяниях из поколения в поколение вплоть до дня суда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Оборот о Енохе синтаксически неоднозначен. Возможно понимание: Ной превзошёл остальных людей продолжительностью земной жизни, за исключением Еноха; при этом особая роль Еноха состояла в том, чтобы быть свидетелем для будущих поколений до дня суда.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально также возможно: «свидетельством».'
    reason: literal_rendering
lexical_decisions:
- source_word: እዮቤልው
  choice: юбилеев
  rationale: Передаёт техническую единицу летосчисления Книги Юбилеев — период в сорок девять лет.
- source_word: ሱባዔ
  choice: седмины лет
  rationale: Обозначает семилетний период; добавление «лет» устраняет возможное понимание как обычной недели.
- source_word: አፈድፈደ
  choice: превзошёл
  rationale: Сохраняет сравнительный смысл глагола без уточнения, в чём именно состояло превосходство.
- source_word: ስምዕ
  choice: свидетелем
  rationale: Слово относится к свидетельству или свидетелю, а не к знамению; личная форма естественна по-русски при Енохе как действующем лице.
- source_word: ይንገር
  choice: возвещать
  rationale: Передаёт значение рассказывания или провозглашения деяний в возвышенном, но понятном регистре.
theological_decisions:
- issue: В чём Ной превзошёл сынов человеческих
  choice: Не уточнять предмет превосходства в основном тексте
  alternative: Указать, что он превзошёл их продолжительностью жизни
  rationale: Геэзский текст связывает превосходство с жизнью на земле, но синтаксически плотен и не выражает однозначно именно долголетие; уточнение могло бы устранить подлинную неоднозначность.
- issue: Исключительное положение Еноха
  choice: Сохранить оборот «кроме Еноха» при сравнении
  alternative: Связать исключение только с праведностью или свидетельской ролью Еноха
  rationale: Положение оборота допускает несколько смысловых связей; основной текст следует наиболее прямому синтаксическому прочтению, а примечание отмечает неоднозначность.
- issue: Назначение Еноха
  choice: «поставлен свидетелем»
  alternative: «поставлен свидетельством» или «знамением»
  rationale: Лексема означает свидетельство/свидетеля; «свидетелем» естественно согласуется с последующим поручением возвещать, тогда как «знамением» лексически менее точно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Сыны человеческие» и «седмины лет» сохранены как понятные жанровые формулы; архаические грамматические конструкции исключены.
