  terminology: «Юбилеи», «седмины лет», «праведность», «свидетель» и «день суда» употреблены последовательно и уместно. «Свидетелем» предпочтительнее «знамением»; примечание корректно отмечает возможную буквальную абстрактную форму «свидетельством».
  issues:
