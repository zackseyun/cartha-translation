  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: ru
  text: Вы поселились в мятеже[a], и в мятеже падут твои дети, и ты будешь искоренён навеки. Не селись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант при ином понимании повторённого слова: «В своём жилище вы поселились, и в своём жилище падут твои дети, и ты будешь искоренён навеки».'
    reason: Сохранён засвидетельствованный альтернативный разбор трудного эфиопского выражения; также отражено смешение множественного и единственного числа в исходных глагольных формах.
lexical_decisions:
- source_word: በሀከከ
  choice: в мятеже
  rationale: Повторённое выражение передано одинаково; по контексту и принятому разбору ሀከከ обозначает мятеж или непокорность, а не место жительства.
- source_word: ኀደርክሙ
  choice: ты жил
  rationale: Перфективная форма требует прошедшего времени. Несмотря на формально множественное окончание в данной форме, последующие обращения стоят во 2-м лице единственного числа; по-русски сохранено единое обращение к одному адресату.
- source_word: ይወድቁ
  choice: падут
  rationale: Сохранён прямой и допускающий контекстуальную неоднозначность образ падения; значение не сужено до гибели.
- source_word: ወትሴር
  choice: и ты будешь искоренён
  rationale: Глагол передаёт устранение с корнем, искоренение; союз сохранён, а будущее соответствует форме и ходу пророческого высказывания.
- source_word: ለዓለም
  choice: навеки
  rationale: Естественный литературный эквивалент выражения длительности «вовеки».
- source_word: ኢትኅደር
  choice: не оставайся здесь
  rationale: Отрицательное повеление передано естественно по-русски. «Здесь» эксплицирует подразумеваемое место, не вводя отсутствующих в стихе Сима или жребий.
theological_decisions:
- issue: Характер проступка адресата
  choice: мятеж
  alternative: непокорность; смута
  rationale: «Мятеж» сохраняет сильный смысл сознательного противления, не уточняя его богословский объект сверх исходного текста.
- issue: Суд над потомками и адресатом
  choice: «падут твои дети» и «ты будешь искоренён» переданы как отдельные утверждения
  alternative: объединить их как одну угрозу гибели
  rationale: Раздельная передача сохраняет два разных исходных глагола и не устраняет возможное различие между судьбой детей и судьбой самого адресата.
translation_notes:
  register: Современный литературный русский язык с прямым, торжественным тоном пророческого предостережения. Обращение дано в единственном числе по преобладающим формам ближайшего контекста; формальная несогласованность первой глагольной формы не воспроизводится как неестественное переключение числа.
