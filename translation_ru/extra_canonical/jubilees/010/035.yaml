  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: ru
  text: Эта земля была названа Ханааном. И Иафет и его сыновья пошли к морю и поселились в земле, доставшейся им в удел. Мадай увидел приморскую землю, но она ему не понравилась. И он попросил удел у Елама, Ассура и Арфаксада — братьев своей жены[a] — и поселился там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопская конструкция в этом месте несколько неясна. Слово «братьев» стоит во множественном числе; поэтому Елам, Ассур и Арфаксад поняты здесь как братья жены Мадая, у которых он попросил удел.
    reason: segmentation_note
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  choice: Эта земля была названа Ханааном
  rationale: Передаёт пассивную конструкцию и указательное местоимение без добавления не выраженного в источнике деятеля.
- source_word: ወደፌትሰ፡ ወውሉዱ
  choice: И Иафет со своими сыновьями
  rationale: Имя передано в принятой русской библейской форме; сочетание с сыновьями выражено естественно для современного русского языка.
- source_word: መንገለ፡ ባሕር
  choice: к морю
  rationale: Буквально передаёт направление движения.
- source_word: ምድረ፡ መክፈልቶሙ
  choice: в земле, доставшейся им в удел
  rationale: Сохраняет идею назначенной или выделенной им доли земли и ясно передаёт множественное притяжательное окончание.
- source_word: ምድረ፡ ባሕር
  choice: приморскую землю
  rationale: Естественная русская передача буквального выражения «земля моря» без уточнения, какого именно моря или побережья.
- source_word: ወኢአደመት፡ በቅድሜሁ
  choice: но она ему не понравилась
  rationale: Идиоматично передаёт отрицательную оценку земли Мадаем; противительный союз делает связь предложений ясной.
- source_word: ወአስተብቍዓ
  choice: Тогда он попросил удел у
  rationale: Передаёт просьбу о доле земли; слово «удел» восполняется из контекста следующего распределения земель.
- source_word: ወኀደረ
  choice: и поселился там
  rationale: В контексте распределения земель глагол означает проживание или поселение; «там» естественно указывает на полученный удел.
