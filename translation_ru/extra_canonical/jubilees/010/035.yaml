- from: Эта земля была названа Ханааном. И Иафет со своими сыновьями пошёл к морю и поселился в земле, доставшейся им в удел. Мадай увидел приморскую землю, но она ему не понравилась. Тогда он попросил удел у Елама, Ассура и Арфаксада — братьев своей жены[a] — и поселился там.
  to: Эта земля была названа Ханааном. И Иафет и его сыновья пошли к морю и поселились в земле, доставшейся им в удел. Мадай увидел приморскую землю, но она ему не понравилась. И он попросил удел у Елама, Ассура и Арфаксада — братьев своей жены[a] — и поселился там.
  rationale: Исправлены число и синтаксическая роль Иафета и его сыновей, чтобы они, как и в источнике, были совместными субъектами обоих действий. Убрано необязательное «Тогда». Примечание сохранено, поскольку оно корректно отмечает неоднозначность конструкции без навязывания решения сверх текста.
