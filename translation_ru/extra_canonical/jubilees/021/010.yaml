- from: и вместе с возлиянием к ней — хлебное приношение Господу, в благоухание приятное. Мясо её ешь в тот день и на второй день; пусть во второй день солнце не зайдёт над ним, прежде чем оно будет съедено. Не оставляй от него ничего до третьего дня, потому что оно не будет принято, ибо это осквернённая святыня, и есть его нельзя. Все, кто станет есть его, понесут свой грех. Ибо так записано, как я нашёл, в книге моих древних праотцов, в словах Еноха и в словах Ноя.
  to: И вместе с возлиянием — хлебное приношение Господу, в приятное благоухание. Мясо его ешь в тот день и на второй день; не допускай, чтобы на второй день солнце зашло, пока оно не будет съедено. Не оставляй от него ничего до третьего дня, потому что оно не будет принято, ибо это осквернённая вещь, и есть его нельзя. Все, кто будет есть его, понесут свой грех. Ибо я нашёл, что так написано в книге моих предков, живших прежде, и в словах Еноха, и в словах Ноя.
  rationale: Правка сохраняет оба вида приношения, не создавая в русском тексте неясной анафорической связи. Трудное культовое определение передано нейтрально, без добавления категории «святыня». Заключительная ссылка сохранена в единственном числе («в книге») и отдельно упоминает слова Еноха и Ноя.
