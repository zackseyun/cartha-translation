  yaml_path: translation/extra_canonical/jubilees/021/010.yaml
  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: ru
  text: И вместе с возлиянием — хлебное приношение Господу, в приятное благоухание. Мясо его ешь в тот день и на второй день; не допускай, чтобы на второй день солнце зашло, пока оно не будет съедено. Не оставляй от него ничего до третьего дня, потому что оно не будет принято, ибо это осквернённая вещь, и есть его нельзя. Все, кто будет есть его, понесут свой грех. Ибо я нашёл, что так написано в книге моих предков, живших прежде, и в словах Еноха, и в словах Ноя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: возлиянием к ней
  rationale: Слово обозначает сопровождающее жертву возлияние; местоименный элемент сохранён естественной русской конструкцией.
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: хлебное приношение
  rationale: Буквально сочетание связано с хлебом/пищевым приношением; перевод сохраняет его отдельно от возлияния и избегает ошибочного пропуска одного из двух приношений.
- source_word: መዓዛ፡ ሠናይ
  choice: в благоухание приятное
  rationale: Сакральная формула передана в привычном библейском регистре без сведения смысла к обычному запаху.
- source_word: እኩይ፡ ኅሩየ
  choice: осквернённая святыня
  rationale: 'Сочетание буквально напряжённое: нечто дурное/непригодное и выделенное. В культовом контексте речь о посвящённом мясе, ставшем недопустимым; формулировка сохраняет противопоставление святыни и осквернения.'
- source_word: ኃጢአተ፡ ሎሙ፡ ይነሥኡ
  choice: понесут свой грех
  rationale: Сохранена юридико-богословская идиома несения вины/греха без уточнения наказания, которого источник прямо не называет.
- source_word: መጽሐፈ፡ አበዊየ፡ ቀደምት
  choice: в книге моих древних праотцов
  rationale: Единственное число «книга» сохранено; ቀደምት передано определением «древних», относящимся к праотцам.
theological_decisions:
- issue: Статус жертвенного мяса на третий день
  choice: «оно не будет принято, ибо это осквернённая святыня»
  alternative: «оно неприемлемо, ибо это нечистая вещь»
  rationale: Выбранная формулировка удерживает культовый смысл принятия жертвы и напряжение между посвящённым статусом мяса и его последующим осквернением, не привнося деноминационной трактовки.
- issue: Последствие вкушения запрещённого остатка
  choice: «понесут свой грех»
  alternative: «понесут вину за него»
  rationale: Более формальное соответствие сохраняет прямое упоминание греха и не решает, обозначает ли выражение вину, наказание или оба аспекта.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис разбит для ясности, но последовательность предписаний и причинных формул источника сохранена. Оба вида приношения — возлияние и хлебное приношение — представлены явно.
