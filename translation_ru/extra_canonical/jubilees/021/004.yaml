base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: ru
  text: волю Того, Кто сотворил меня. Ведь Он — Бог живой, святой, верный и праведный превыше всех. У Него нет ни лицеприятия, ни принятия даров[a], потому что Он — Бог праведный, совершающий суд над всеми, кто преступает Его заповеди, и над теми, кто выказывает презрение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни принятия взяток».'
    reason: Слово может обозначать дар, принимаемый ради благосклонности, то есть взятку.
  - marker: b
    text: 'В приведённом тексте на геэзе буквально: «и над теми, кто презирает»; объект не выражен. По контексту его иногда понимают как «Его завет».'
    reason: Сохраняет неоднозначность исходного фрагмента, не вводя подразумеваемый объект в основной текст.
lexical_decisions:
- source_word: አምላክ፡ ሕያው
  choice: Бог живой
  rationale: Сохраняет прямое именное определение исходного текста и естественно звучит в русском библейском регистре.
- source_word: ምእመን
  choice: верный
  rationale: Передаёт качество надёжности и верности Бога без добавления конфессиональной интерпретации.
- source_word: እምኵሉ
  choice: превыше всех
  rationale: Сохраняет сравнительно-превосходный смысл и личную форму «всех», возможную в данном контексте.
- source_word: ነሢአ፡ ገጽ
  choice: лицеприятие
  rationale: Устойчиво и точно передаёт буквальное «принятие лица», то есть пристрастное отношение.
- source_word: ነሢአ፡ ሕልያን
  choice: принятие даров
  rationale: Передаёт отдельное от лицеприятия понятие принятия дара; возможный оттенок взятки отмечен в сноске.
- source_word: ገባሬ፡ ኵነኔ
  choice: совершающий суд
  rationale: Формально близко передаёт деятеля, осуществляющего судебное решение, и не сужает смысл до одного лишь наказания.
- source_word: ይትዐደዉ፡ ትእዛዞ
  choice: преступает Его заповеди
  rationale: Глагол выражает нарушение или переступание; русское множественное число естественно передаёт совокупность Божьих предписаний.
- source_word: ይሜንኑ
  choice: презирает
  rationale: Сохраняет самостоятельный второй глагол и не смешивает его с предшествующим «преступает».
theological_decisions:
- issue: Божье нелицеприятие и неподкупность
  choice: «нет ни лицеприятия, ни принятия даров»
  alternative: «не взирает на лица и не принимает взяток»
  rationale: Выбранный вариант сохраняет параллелизм двух исходных именных выражений; сноска удерживает более резкий судебный оттенок «взяток».
- issue: Объект последнего глагола
  choice: «презирает Его завет» с текстовой сноской
  alternative: «презирает» без выраженного объекта
  rationale: По смыслу и консультационному слою подразумевается завет, однако в приведённом фрагменте геэзский объект после глагола явно не выражен; сноска делает эту неоднозначность прозрачной.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Начальная строчная буква сохранена, поскольку стих начинается как продолжение предыдущего предложения. Термины «лицеприятие» и «совершать суд» несколько возвышенны, но понятны и уместны в данном жанре; синтаксис упрощён настолько, чтобы длинное перечисление оставалось ясным.
