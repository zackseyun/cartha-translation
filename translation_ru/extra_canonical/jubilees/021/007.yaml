  text: the blood of wild animals and of cattle and of every bird that flies in the sky. And if you slaughter a sacrifice as an acceptable peace offering, slaughter it and pour out its blood on the altar; and all the fat of your offering you shall offer up on the altar, together with fine flour mixed with oil; and with its drink offering you shall offer it all together on the altar as an offering of a pleasing fragrance before
translation:
  language: ru
  text: кровь диких зверей, скота и всякой птицы, летающей по небу. Если же ты закалываешь угодную мирную жертву, заколи её и вылей её кровь на жертвенник. Весь жир твоей жертвы вознеси на жертвенник вместе с лучшей мукой, смешанной с маслом; вместе с её возлиянием вознеси всё это на жертвенник как приношение с приятным благоуханием пред…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርዌ፡ ወዘእንስሳ
  choice: диких зверей, скота
  rationale: Передаёт различие между дикими животными и домашним скотом, отражённое в исходном тексте.
- source_word: ጽንሓሐ፡ ሰላም
  choice: мирную жертву
  rationale: Устоявшийся и понятный русский библейский термин для жертвы мира/общения.
- source_word: ዘይሰጠው
  choice: угодную
  rationale: Слово выражает приемлемость жертвы, а не благодарение; «угодную» естественно сочетается с сакральным контекстом.
- source_word: ጽንሑክ
  choice: твоей жертвы
  rationale: Сохранён суффикс второго лица единственного числа, указывающий на принадлежность.
- source_word: ስንዳሌ
  choice: лучшей мукой
  rationale: Передаёт тонкую, отборную муку естественным современным русским выражением.
- source_word: መዐዛ፡ ሠናይ
  choice: с приятным благоуханием
  rationale: Сохраняет жертвенную формулу о приятном запахе, не усиливая её богословское содержание.
theological_decisions:
- issue: Характер мирной жертвы
  choice: угодную мирную жертву
  alternative: благодарственную мирную жертву
  rationale: Исходное ዘይሰጠው указывает на принятие или угодность, тогда как значение благодарения лексически не выражено.
- issue: Активность действия с кровью
  choice: вылей её кровь
  alternative: чтобы её кровь была вылита
  rationale: В исходном тексте употреблена активная глагольная форма с подразумеваемым адресатом во втором лице.
- issue: Незавершённость конечной формулы
  choice: пред…
  alternative: пред Господом
  rationale: Предоставленный исходный фрагмент оканчивается словом ቅድመ («пред/перед») без названного дополнения; оно не добавлено предположительно, чтобы сохранить границу и неполноту источника.
translation_notes:
  register: Современный литературный русский с сохранением достоинства жертвенной терминологии. Синтаксис слегка упрощён для ясности, но повтор повеления заколоть жертву и последовательность обрядовых действий сохранены. Начальная строчная буква и многоточие в конце отражают то, что предоставленный текст представляет собой фрагмент, продолжающий предыдущее и переходящий в последующее высказывание.
