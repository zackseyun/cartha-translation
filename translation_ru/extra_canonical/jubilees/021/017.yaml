  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሐፀብ
  choice: омой
  rationale: Форма передаёт повеление совершить омовение; «омой» естественно и достойно звучит в русском ритуальном контексте.
- source_word: እደዊከ፡ ወእገሪከ
  choice: руки свои и ноги свои
  rationale: Сохранены обе части тела и притяжательная рефлексивность исходного текста.
- source_word: ኢያስተርኢ
  choice: пусть не будет видно
  rationale: Передаёт запрет на видимое присутствие крови, не уточняя сверх текста, кто именно её видит.
- source_word: በዲቤክሙ
  choice: на вас
  rationale: Множественное местоименное окончание передано как обращение к группе; пространственное значение — «на».
- source_word: ኵሉ፡ ደም
  choice: никакой крови
  rationale: В отрицательной конструкции естественный русский эквивалент буквально всеохватного выражения — «никакой крови».
- source_word: በውስተ፡ አልባሲክሙ
  choice: на одеждах ваших
  rationale: В данном контексте кровь видна на одежде; множественное число и обращение к группе сохранены.
theological_decisions:
- issue: Ритуальная чистота после жертвоприношения
  choice: Сохранено конкретное требование омовения и удаления видимой крови без богословского пояснения.
  alternative: Истолковать омовение как очищение от греха или осквернения.
  rationale: Исходный текст предписывает действия, но не раскрывает здесь их символическое или догматическое значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Переход от единственного числа в повелении об омовении к множественному в запрете сохранён, поскольку он присутствует в геэзском тексте.
