  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: ru
  text: 'На шестом году седьмой седмины[a] этого юбилея Авраам призвал своего сына Исаака и наставил его, сказав: «Я состарился и не знаю дня своей смерти, и я насытился жизнью[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Седмина — период в семь лет.
    reason: Современному читателю термин может быть неясен, тогда как «неделя» могла бы быть ошибочно понята как семь дней.
  - marker: b
    text: 'Буквально: «я насытился своими днями»; то есть: «я прожил свои дни сполна». Возможен также перевод: «дни мои исполнились».'
    reason: Поясняет образное выражение источника, сохраняет форму первого лица в основном тексте и отмечает возможную переводческую вариативность.
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: Слово обозначает группу из семи, а в хронологии Книги Юбилеев — семилетний период. «Седмина» сохраняет библейский временной термин, не создавая впечатления обычной семидневной недели.
- source_word: አዘዞ
  choice: наставил его
  rationale: Глагол может означать «повелел, поручил, дал наставление». В контексте отцовского обращения «наставил» естественно передаёт смысл, не усиливая его до отдельного приказа.
- source_word: ረሳዕኩ
  choice: я состарился
  rationale: Передаёт первое лицо и наступившее состояние старости естественным современным русским выражением.
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: я насытился своими днями
  rationale: Сохраняет первое лицо единственного числа глагола и библейский образ насыщения долгой жизнью, не превращая его без пояснения в грамматически иную фразу «дни мои исполнились».
theological_decisions:
- issue: Смысл заключительной формулы о полноте дней
  choice: 'Сохранён образ: «я насытился своими днями»'
  alternative: «Дни мои исполнились» или «я прожил свои дни сполна»
  rationale: 'Источник грамматически говорит от первого лица: Авраам «насытился» своими днями. Основной текст сохраняет этот образ и связанную с ним библейскую антропологическую выразительность; более идиоматическое истолкование вынесено в примечание.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сделан ясным для обычного читателя; специальные хронологические и образные выражения кратко пояснены в сносках.
