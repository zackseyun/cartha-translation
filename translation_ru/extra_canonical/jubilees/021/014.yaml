translation:
  language: ru
  text: его благоухание, потому что на нём уже нет благоухания, как прежде. Кроме этих пород древесины, не клади никакой другой, потому что его благоухание особое[a], и запах его благоухания восходит на небо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнаваемое», «отличимое».'
    reason: Эфиопское слово ፍሉጥ допускает значения «известное», «отличимое» и «особое».
lexical_decisions:
- source_word: መዐዛሁ
  choice: его / их благоухание
  rationale: Слово обозначает благоухание, аромат; притяжательный суффикс формально имеет единственное число. В продолжении речь идёт о перечисленных породах дерева как о совокупности, поэтому по-русски естественно перейти к «их».
- source_word: ዕፀው
  choice: породы дерева
  rationale: Множественная форма означает деревья или древесину; в контексте выбора материала для воскурения «породы дерева» ясно передаёт смысл.
- source_word: ፍሉጥ
  choice: особенное
  rationale: Причастие может означать «известное», «отличимое», «особое». Здесь оно характеризует узнаваемое, отличительное благоухание; «особенное» естественно по-русски и не сводит значение к простой известности.
- source_word: የዐርግ
  choice: восходит
  rationale: Сохранён пространственный и культовый образ восхождения запаха к небу.
theological_decisions:
- issue: Культовый образ восходящего к небу благоухания
  choice: 'Сохранить буквально: «запах их благоухания восходит на небо»'
  alternative: Передать истолковательно как благоугодность жертвы Богу
  rationale: Исходный текст говорит о восхождении запаха и не формулирует богословского толкования; буквальный образ сохраняет его напряжение и конкретность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальная синтаксическая незавершённость («его благоухание») сохранена, поскольку стих продолжает предыдущее высказывание; искусственно восполнять отсутствующую часть не следует.
