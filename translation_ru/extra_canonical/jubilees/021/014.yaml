  source_fidelity: Нужно сохранить явно выраженное в эфиопском тексте единственное притяжательное значение при всех трёх упоминаниях благоухания. Переход в черновике к «их благоуханию» не имеет опоры в форме መዐዛሁ и создаёт иной референт. Добавленное «такого» также несколько сужает исходное «нет более благоухания… как прежде».
  naturalness: После исправления текст остаётся естественным современным литературным русским. «Породы древесины» в данном культово-материальном контексте точнее, чем «породы дерева», а «не клади никакой другой» грамматически ясно относится к древесине.
  terminology: «Благоухание» и образ его восхождения на небо сохранены. «Особое» передаёт ፍሉጥ как отличительное, не навязывая более узкого значения «известное»; сноска корректно отмечает допустимую неоднозначность.
