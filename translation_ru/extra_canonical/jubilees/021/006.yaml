translation:
  language: ru
  text: ни к нечистым вещам, ни вслед за резными изображениями, ни вслед за литыми изображениями. И не ешьте никакой крови.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለርኩሳን
  choice: к нечистым вещам
  rationale: Передаёт дательный предлог ለ- и множественное/собирательное значение «нечистое» без необоснованного сведения слова исключительно к идолам.
- source_word: ለገሊፎ
  choice: вслед за резными изображениями
  rationale: ገሊፎ обозначает нечто вырезанное, изваянное; «резные изображения» естественно передаёт религиозный контекст, не уточняя материал.
- source_word: ለስብክ
  choice: вслед за литыми изображениями
  rationale: Слово связано с отливкой; выбранное выражение сохраняет противопоставление резным изображениям.
- source_word: ወኢትብልዑ፡ ወኢምዝተኒ
  choice: И не ешь никакой крови
  rationale: Отрицательная конструкция с заключительным усилителем передана русским «никакой»; объект «крови» восстановлен по засвидетельствованному смыслу данного места и консультационному тексту, поскольку предоставленный геэзский отрывок, вероятно, повреждён или обрывается на границе сегмента.
theological_decisions:
- issue: Характер «нечистых вещей»
  choice: Сохранено широкое «нечистые вещи»
  alternative: «идолы» или «нечистые идолы»
  rationale: Геэзское ርኩሳን само по себе означает «нечистые»; более узкое отождествление с идолами снимало бы лексическую неоднозначность, хотя последующие резные и литые изображения задают идолопоклоннический контекст.
- issue: Связь однородных запретов
  choice: «ни … ни …»
  alternative: буквальное «и … и …» или «или … или …»
  rationale: В русском отрицательная конструкция естественно требует повторного «ни»; это сохраняет совокупность запретов и не превращает их в взаимоисключающие варианты.
translation_notes:
  register: Современный литературный русский с библейски достойным, но понятным строем. Сегмент начинается как продолжение предыдущей фразы, поэтому сохранена начальная строчная буква. Формы обращения переданы в единственном числе согласно ближайшему контексту наставления Исааку; синтаксис сделан естественным для русского.
