  terminology: «Взятка», «дар», «человеческая кровь», «праведность», «Всевышний Бог», «грех, ведущий к смерти» и «остаток потомства» переданы последовательно и без конфессионально обусловленных уточнений. Сноска на слове «защитой» уместна и не нуждается в изменении.
