base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/020.yaml
  text: And do not accept a bribe or a present for human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be a good protection for you, so that you may be kept from every evil and so that he may save you from every death. For I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your enemies and root you out from the earth, and your seed from under heaven, and destroy your name and your seed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he will raise up from
    you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for everlasting generations with every righteous blessing, so that you may become a blessing on all the earth.” And he went out from before him rejoicing.
translation:
  language: ru
  text: 'И не бери ни взятки, ни дара за человеческую кровь: кровь за кровь должна быть воздана пред Господом, Всевышним Богом. Это будет тебе доброй защитой[a], чтобы ты был ограждён от всякого зла и чтобы Он спас тебя от всякой смерти.


    Ибо я вижу, сын мой, все дела сынов человеческих: весь их грех и зло, и все их поступки — нечистота, мерзость и скверна, и нет у них праведности. Берегись: не ходи их путями и не ступай по их стезям; не соверши греха, ведущего к смерти, пред Всевышним Богом, чтобы Он не скрыл от тебя Своего лица, не предал тебя в руки твоих врагов, не искоренил тебя с земли, а твоё потомство — из-под небес, и не уничтожил твоё имя и твоё потомство со всей земли.


    Отвернись от всех их дел и от всей их нечистоты; соблюдай повеление Всевышнего Бога, исполняй Его волю и во всём поступай праведно. И Он благословит тебя во всех твоих делах и взрастит от тебя насаждение праведности по всей земле, во всех поколениях земли. И моё имя и твоё имя не изгладятся под небесами вовеки.


    Иди, сын мой, с миром. Да укрепит тебя Всевышний Бог, мой Бог и твой Бог, чтобы ты исполнял Его волю; и да благословит Он всё твоё потомство и остаток твоего потомства во всех вечных поколениях всяким праведным благословением, чтобы ты стал благословением по всей земле».


    И он вышел от него, радуясь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добрым сохранением». Слово может обозначать защиту, охрану или сохранение.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ሕልያነ፡ ወአምኃ
  choice: ни взятки, ни дара
  rationale: Передаёт два однородных понятия — взятку и дар — без ошибочного внесения смысла «лицеприятия».
- source_word: ዑቃቤሁ፡ ሠናይ
  choice: надёжной защитой
  rationale: ዑቃቤ обозначает охрану, защиту или сохранение; «защита» естественно сочетается с последующим избавлением от зла и смерти.
- source_word: ስሕተተ፡ ለሞት
  choice: греха, ведущего к смерти
  rationale: Сохраняет направленность выражения «к смерти», не определяя заранее, идёт ли речь о конкретном виде греха или о его смертельном исходе.
- source_word: ጸላእከ
  choice: твоих врагов
  rationale: Прямое значение засвидетельствованной формы — «твоих врагов»; оно соответствует контексту предания в чужие руки.
- source_word: ተክለ፡ ጽድቅ
  choice: насаждение праведности
  rationale: 'Сохраняет растительный образ источника: Бог взращивает происходящее от адресата насаждение праведности.'
- source_word: ኢይትረመም
  choice: не изгладятся
  rationale: Передаёт идею неустранения имён из памяти и существования под небесами, сохраняя возвышенный, но понятный русский регистр.
theological_decisions:
- issue: Формула воздаяния «кровь за кровь»
  choice: кровь за кровь должна быть воздана пред Господом
  alternative: за кровь следует отплатить кровью перед Господом
  rationale: Выбранная формулировка сохраняет судебно-сакральную напряжённость текста, не уточняя человеческого исполнителя воздаяния и не превращая наставление в призыв к личной мести.
- issue: «Грех, ведущий к смерти»
  choice: сохранена открытая формула без догматического пояснения
  alternative: смертный грех
  rationale: Термин «смертный грех» мог бы привнести позднейшую конфессиональную классификацию, которой сам текст явно не устанавливает.
- issue: Насаждение праведности
  choice: сохранён образ насаждения
  alternative: праведный род
  rationale: Метафора источника допускает династическое или более широкое историко-богословское прочтение; перевод не сводит её только к одному толкованию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «пред Господом», «стези», «из-под небес» и «вовеки» сохранены ради достоинства и ритма, но синтаксис в целом сделан понятным современному читателю. Прямая речь разбита на смысловые абзацы; гендерно и богословски маркированные выражения источника не расширялись толкованием.
