lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ
  choice: Храни эту заповедь и исполняй её
  rationale: 'Передаёт два последовательных повеления: соблюдать данное предписание и осуществлять его на деле.'
- source_word: ታርትዕ፡ በኵሉ፡ ግብርከ
  choice: поступать правильно во всех своих делах
  rationale: Естественно передаёт идею прямоты и правильности во всём поведении, не сужая её до ритуальной сферы.
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ
  choice: сохраняй чистоту тела
  rationale: Сохраняет телесный и ритуальный смысл чистоты; формулировка звучит естественно по-русски.
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  choice: взойти и принести жертву на жертвеннике
  rationale: Глагол указывает на восхождение/вознесение, а контекст — на принесение жертвы у жертвенника.
- source_word: ግባእ
  choice: возвратись
  rationale: Повелительная форма глагола означает возвращение или движение назад; перевод «войди» здесь лексически менее точен.
