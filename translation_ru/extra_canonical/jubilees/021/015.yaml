- issue: Характер телесной чистоты перед жертвоприношением
  choice: 'Сохранена прямая ритуальная последовательность: чистота тела, омовение, приближение к жертвеннику.'
  alternative: Истолковать чистоту как преимущественно нравственную или духовную.
  rationale: Контекст явно говорит о воде, руках, ногах и жертвеннике; расширительное богословское толкование не внесено в основной текст.
