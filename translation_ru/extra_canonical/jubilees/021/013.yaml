base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: ru
  text: '[называемые] арсатна и бесем[a]. Из этих пород клади под жертву на жертвеннике дрова, признанные годными по виду. Не клади расколотых или тёмных дров, но только крепкие и чистые, без изъяна, целые и свежие. Не клади старых дров, потому что их благоухание уже исчезло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия «арсатна» и «бесем» переданы транслитерацией. Эфиопский текст здесь труден; возможно, это названия деревьев или пород древесины, точное определение которых не установлено.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርሳትነ ወቤስም
  choice: арсатна и бесем
  rationale: Точные ботанические соответствия не установлены; транслитерация сохраняет неопределённость эфиопского текста и не навязывает сомнительных названий пород.
- source_word: ዕፀው / ዕፀ
  choice: породы / дрова
  rationale: В начале выражение относится к названным видам древесины, а далее — к отбираемому для жертвенника древесному материалу; контекстуальное варьирование естественно по-русски.
- source_word: መትሕተ፡ ጽንሓሕ፡ ዲበ፡ ምሥዋዕ
  choice: под жертву на жертвеннике
  rationale: 'Переданы оба пространственно-культовых элемента: древесина помещается под жертву, находящуюся на жертвеннике.'
- source_word: ምኩረ፡ ራእዮሙ
  choice: которые окажутся хорошими на вид
  rationale: Передаёт идею испытанности или одобрения по внешнему виду без неестественной русской кальки.
- source_word: ንቁዐ፡ ወፈዋነ
  choice: расколотых или потемневших
  rationale: Сохранены оба отрицательных признака древесины, включая ранее пропущенное обозначение тёмного или потемневшего состояния.
- source_word: ንደስተ፡ ተከለ
  choice: свежие
  rationale: В контексте противопоставления старой древесине выражение обозначает недавно выросшую или свежую древесину; краткое русское соответствие звучит естественно.
- source_word: ወፅአ
  choice: исчезло
  rationale: Буквально передаёт уход или утрату благоухания старой древесины.
theological_decisions:
- issue: Характер предписания о древесине для жертвенника
  choice: Сохранено как конкретное культовое предписание без дополнительного символического толкования.
  alternative: Истолковать качества древесины как нравственную или богословскую аллегорию.
  rationale: Источник даёт практические требования к жертвенному дереву и сам не раскрывает аллегорического смысла.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим синтаксисом. Сохранён достойный культовый регистр; редкие названия растений не заменены предположительными русскими эквивалентами.
