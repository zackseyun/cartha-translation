review_pass:
  verdict: revise
  source_fidelity: 'Основная последовательность жертвенных действий передана верно в согласии с контекстом и английским контрольным текстом: жир, внутренности, печень и почки отделяются, затем всё приносится Господу. Однако фраза «жир, который на них» неестественна и оставляет неясную анафорическую связь без необходимости. В эфиопском тексте форма ትብልእ лексически трудна в данном контексте; перевод «отдели» поддержан жертвенной последовательностью и английским аудитом, но не следует обосновывать его как бесспорное прямое значение.'
  naturalness: «Жир, который на них» звучит тяжеловесно. Повтор «жир» перед «на внутренностях» можно снять без потери смысла. «Вознеси ... вместе с хлебным приношением» литературно и уместно в ритуальном регистре.
  terminology: '«Внутренности», «почки», «приятное благоухание» и «Господь» удачны. Сноска о «чреслах» ошибочно прикреплена к слову «почками»: вариант относится к предыдущему слову መናቅፅ, а не к ኵልያት, которое означает «почки». Поэтому сноску следует перенести к «внутренностях» и сформулировать как вариант перевода этого слова.'
  issues:
  - severity: medium
    issue: Неверная привязка сноски
    rationale: Сноска [a] стоит после «почками», однако «чресла» — альтернативный вариант для መናቅፅ («внутренности»), а не для ኵልያት («почки»).
  - severity: low
    issue: Неестественная анафора «который на них»
    rationale: Русская формулировка неясна и стилистически тяжела; «жир, покрывающий их» передаёт исходную конструкцию естественнее.
  - severity: medium
    issue: Слишком категоричное лексическое обоснование «отдели»
    rationale: 'Форма ትብልእ требует осторожности: выбранный перевод обоснован контекстом и контрольной традицией, но заявлять, что буквальное значение просто неуместно, недостаточно для исходно-языковой проверки.'
  revised_text: Жир, покрывающий их, и жир на внутренностях[a], а также печень вместе с почками отдели. Всё это вознеси как приятное благоухание, угодное Господу, вместе с хлебным приношением.
  revised_footnotes:
