  yaml_path: translation/extra_canonical/jubilees/021/009.yaml
  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: ru
  text: Жир, который на них, и жир на внутренностях, а также печень вместе с почками[a] отдели. Всё это вознеси как приятное благоухание, угодное Господу, вместе с хлебным приношением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чреслами».'
    reason: Слово ኵልያት обычно означает почки, но может употребляться шире в значении области чресел.
lexical_decisions:
- source_word: መናቅፅ
  choice: внутренности
  rationale: Слово обозначает внутренности, внутренние органы или кишки; в контексте жертвоприношения «внутренности» звучит точно и естественно.
- source_word: ኵልያት
  choice: почки
  rationale: Основное анатомическое значение слова — «почки»; возможное более широкое значение «чресла» отмечено в сноске.
- source_word: ትብልእ
  choice: отдели
  rationale: В данном предписании перед вознесением перечисленных частей требуется их отделение; буквальное значение, связанное с поеданием или поглощением, здесь контекстуально неясно и по-русски создало бы ложное впечатление, будто адресат должен их съесть.
- source_word: ታዐርግ
  choice: вознеси
  rationale: Глагол буквально передаёт движение вверх и в жертвенном контексте означает принесение на огне, когда дым восходит; «вознеси» сохраняет этот образ.
- source_word: መዐዛ ሠናይ
  choice: приятное благоухание
  rationale: Устойчивое и понятное русское выражение для буквального «доброго/приятного запаха» в жертвенном контексте.
- source_word: መሥዋዕቱ
  choice: хлебное приношение
  rationale: Форма означает относящееся к жертве приношение; контекст и проверенный консультационный текст уточняют его как сопровождающее хлебное приношение.
theological_decisions:
- issue: Характер угодности жертвы
  choice: «приятное благоухание, угодное Господу»
  alternative: «приятное благоухание, принимаемое перед Господом»
  rationale: Выбранная формулировка естественна по-русски и передаёт принятие жертвы Богом, не объясняя механизм или богословское основание её принятия.
- issue: Способ принесения перечисленных частей
  choice: «вознеси»
  alternative: «принеси» или «сожги»
  rationale: «Вознеси» сохраняет образ исходного глагола и не добавляет прямо не названного способа сожжения, хотя жертвенный контекст его предполагает.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной ритуальной формулировкой. Сохранено обращение во втором лице единственного числа, соответствующее форме наставления; архаизмы сведены к понятному в данном контексте глаголу «вознеси».
