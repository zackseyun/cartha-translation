  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: ru
  text: 'Господа. Жир жертвы спасения положи на огонь, который на жертвеннике: жир, покрывающий внутренности, весь жир на внутренних органах, обе почки и весь'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: жертвы спасения
  rationale: Буквально сочетание обозначает «жертву спасения/избавления»; этот вариант сохраняет характерный для данного текста термин и не подменяет его более конфессионально закреплённым названием.
- source_word: ታነብር
  choice: положи
  rationale: Передаёт форму предписания во втором лице единственного числа и естественно сочетается с описанием возложения жира на огонь.
- source_word: ከርሥ
  choice: внутренности
  rationale: В жертвенном контексте слово указывает на внутренности, покрытые жиром.
- source_word: ንዋየ፡ ውስት
  choice: внутренних органах
  rationale: Передаёт буквально несколько неясное обозначение внутренних частей тела, не отождествляя его без достаточных оснований с одной конкретной анатомической областью.
- source_word: ወክሊአ፡ ኵልያት
  choice: обе почки
  rationale: Естественный русский эквивалент выражения «две почки».
- source_word: ወኵሎ
  choice: и весь
  rationale: ኵሎ означает «весь/всё», а не «обе»; оборванная форма сохранена, поскольку стиховая граница проходит внутри продолжающейся фразы.
theological_decisions:
- issue: Название жертвы መሥዋዕተ መድኃኒት
  choice: жертва спасения
  alternative: мирная жертва
  rationale: Выбрано лексически прозрачное соответствие исходному выражению; «мирная жертва» могло бы преждевременно отождествить термин с определённой традиционной категорией жертв.
- issue: Незавершённость заключительной фразы
  choice: сохранить окончание «и весь»
  alternative: дописать «жир на них» или истолковать как «обе они»
  rationale: Исходный сегмент заканчивается словом «весь», а продолжение находится в следующем стихе; редакционное завершение изменило бы предоставленный исходный текст.
translation_notes:
  register: Современный литературный русский с достоинством культового предписания. Синтаксис достаточно близок к исходному перечислению; намеренно сохранено незавершённое окончание стиха.
