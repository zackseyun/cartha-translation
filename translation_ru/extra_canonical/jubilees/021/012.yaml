  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: ru
  text: 'твои приношения пред Господом. Будь внимателен также к дровам для жертвоприношения: не приноси для жертвенника никаких иных дров, кроме следующих: кипариса, пихты, миндаля, сосны, смолистой сосны, кедра, можжевельника, ломоноса, маслины, мирта, лавра и кедра[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение ряда названий деревьев в эфиопском тексте не вполне надёжно. Последнее название передаётся близко к «кедру» и в источнике стоит отдельной позицией, хотя «кедр» уже назван ранее; оно может обозначать другое дерево или иной вид.
    reason: botanical_uncertainty
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: твои приношения
  rationale: Форма обозначает жертвенное приношение; множественное число естественно передаёт собирательный смысл данного фрагмента и согласуется с контекстом наставлений.
- source_word: ዕፀወ፡ መሥዋዕት
  choice: дровами для жертвы
  rationale: Буквально речь идёт о древесине жертвоприношения; по-русски «дрова для жертвы» ясно указывает на топливо, используемое при принесении жертвы.
- source_word: ኢታብእ፡ ዕፀወ፡ ምሥዋዕ፡ ዲበ፡ ዝንቱ
  choice: не приноси для жертвенника никаких иных дров, кроме следующих
  rationale: ዲበ ዝንቱ в данном предписании имеет ограничительный смысл «сверх/помимо этих», поэтому список задаёт разрешённые виды древесины, а не запрещает их.
- source_word: ቍጲርሳን ... ቄዳር
  choice: кипариса ... ещё одного вида кедра
  rationale: Названия растений переданы наиболее вероятными современными русскими соответствиями; два близких эфиопских наименования кедра сохранены как отдельные позиции списка.
