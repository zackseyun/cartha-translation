  text: Take care, my son, concerning blood; take great care to cover it in the earth. And do not eat it at all.
translation:
  language: ru
  text: Сын мой, будь осторожен с кровью; особенно тщательно позаботься о том, чтобы покрыть её землёй. И ни в коем случае не ешь её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, без усиления: «И не ешь её».'
    reason: Частица እከ в данном отрицательном повелении допускает усилительное понимание, однако её точная сила неоднозначна.
lexical_decisions:
- source_word: ተዐቀብ
  choice: остерегайся / позаботься
  rationale: 'Повторённый глагол передан с учётом разных связей в предложении: вначале — предостережение относительно крови, затем — требование тщательно исполнить действие. Это сохраняет смысл повтора без неестественной русской конструкции.'
- source_word: ጥቀ
  choice: особенно тщательно
  rationale: Наречие усиливает второе предписание; перевод передаёт значение высокой степени и не опускает усиление.
- source_word: ደፍኖ፡ ውስተ፡ ምድር
  choice: укрыть её в земле
  rationale: Передаёт глагол «покрыть, укрыть» и выражение «в земле», не добавляя отсутствующего в источнике слова «прах» или «пыль».
- source_word: እንከ
  choice: ни в коем случае
  rationale: В отрицательном повелении частица естественно выражает усиленный запрет; возможное менее усиленное прочтение отмечено в сноске.
theological_decisions:
- issue: Запрет употребления крови
  choice: не ешь её
  alternative: не ешь [мяса] с нею
  rationale: Местоименный объект непосредственно относится к крови; расширение до мяса отсутствует в данном тексте и привнесло бы гармонизацию с другими предписаниями.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным тоном. Обращение «сын мой» и последовательные повеления сохраняют достоинство и структуру исходного наставления; синтаксис слегка сглажен ради естественности.
