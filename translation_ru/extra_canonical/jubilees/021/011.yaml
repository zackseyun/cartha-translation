  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: ru
  text: К каждому своему приношению добавляй соль и не допускай, чтобы ни в одном из них недоставало соли завета.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: свои приношения
  rationale: Слово обозначает жертвенные дары или приношения; «приношения» естественно передаёт широкий смысл в данном предписании, а суффикс второго лица — притяжательное «свои».
- source_word: ትደይ፡ ፄወ
  choice: клади соль
  rationale: Прямо и естественно передаёт повеление помещать или добавлять соль к каждому приношению.
- source_word: ፄወ፡ ኪዳን
  choice: соль завета
  rationale: Сохранено буквальное и богословски значимое сочетание без истолкования характера завета.
- source_word: ወኢይደሪዕ
  choice: пусть … не будет недостатка
  rationale: Передаёт отрицательное предписание со значением отсутствия нехватки, сохраняя связь с солью завета.
theological_decisions:
- issue: Значение выражения «соль завета»
  choice: Сохранить формулировку «соль завета» без пояснения
  alternative: «соль как знак завета»
  rationale: Источник не раскрывает здесь точного символического отношения соли к завету; добавление «как знак» сняло бы сохраняемую текстом смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; повелительная форма звучит ясно и достойно. Конструкция «ни в одном из них» эксплицирует заключительное «во всех/из всех» применительно к приношениям и обеспечивает грамматическую завершённость.
