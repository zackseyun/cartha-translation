  source_fidelity: 'Начальная часть точно передаёт призыв «ходить прямо/праведно по всем Его путям», а «Душа моя возненавидела идолов» верно сохраняет субъектную эмфазу и сильный глагол. Однако «старался исполнить» несколько ослабляет значение እትዐቀብ («тщательно соблюдать; остерегаться, чтобы исполнить») и звучит как неоправданно конативное «пытался». Конечный объект не следует добавлять: синтаксическая конструкция продолжается в следующем стихе, согласно исходнику и английскому аудиторскому следу.'
  naturalness: «И прямо ходить» в начале фрагмента оправдано как продолжение предшествующего перечисления. Концовка неизбежно остаётся незавершённой на границе стиха; более точное «тщательно исполнял» сохраняет эту незавершённость и в современном литературном русском читается яснее, чем «старался исполнить».
  terminology: «Его путям», «идолов» и прописная буква в божественном референте уместны для библейского регистра. «Тщательно исполнял» передаёт направленность к исполнению, а не ошибочное удерживание от идолопоклонства. Не следует вводить объект («Его волю») до следующего стиха.
