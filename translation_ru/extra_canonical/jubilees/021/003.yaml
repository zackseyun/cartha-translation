lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: прямо ходить
  rationale: Передаёт образ прямого, праведного хождения, не добавляя отсутствующего в исходном тексте пояснения.
- source_word: ጣዖተ፡ ጸልአት፡ ነፍስየ
  choice: Душа моя возненавидела идолов
  rationale: Сохраняет эмфатическую конструкцию с «душой» и сильное значение глагола «ненавидеть».
- source_word: እትዐቀብ፡ ለገቢረ
  choice: чтобы я старался исполнить
  rationale: Передаёт значение внимательного соблюдения и направленность к совершению действия; объект глагола не добавлен, поскольку он появляется в следующем стихе.
theological_decisions:
- issue: Референт притяжательного элемента в выражении «всеми его путями»
  choice: Его
  alternative: его
  rationale: По контексту речь идёт о путях Бога; прописная буква служит обычным русским средством обозначения божественного референта, не устраняя содержательной неоднозначности самого образа.
- issue: Незавершённость последней фразы на границе стиха
  choice: Сохранить переход фразы в следующий стих
  alternative: Добавить объект, например «Его волю», либо истолковать фразу как «удерживаться от их совершения»
  rationale: Геэзский текст данного стиха не содержит объекта действия; его восполнение здесь либо преждевременно вводит материал следующего стиха, либо меняет направленность выражения на противоположную.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксическая незавершённость конца стиха намеренно сохранена как особенность исходного текста.
