translation:
  language: ru
  text: Его завет.[a] И ты также, сын мой, соблюдай Его заповедь, Его установление и Его суд и не следуй за ними.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Его завет», по-видимому, завершают предыдущий стих, но в используемом исходном тексте помещены в начале этого сегмента.
    reason: verse_segmentation
  - marker: b
    text: 'Буквально: «и не ходи вслед за ними». К кому или к чему относится «ними», из данного сегмента неясно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ኪዳኖ
  choice: Его завет
  rationale: Передаёт существительное «завет» с местоименным суффиксом 3-го лица единственного числа; начальный фрагмент сохранён, хотя синтаксически, вероятно, завершает предыдущий стих.
- source_word: ትእዛዞ
  choice: Его заповедь
  rationale: Сохранено морфологическое единственное число и значение предписания.
- source_word: ሥርዐቶ
  choice: Его установление
  rationale: «Установление» естественно передаёт норму или предписание, сохраняя единственное число и отличая термин от «заповеди».
- source_word: ኵነኔሁ
  choice: Его суд
  rationale: Буквальная передача юридико-богословского термина с сохранением единственного числа; более конкретное «приговор» без контекста было бы чрезмерным уточнением.
- source_word: ወኢትሖር፡ ድኅሬሆሙ
  choice: и не следуй за ними
  rationale: Естественная современная русская передача буквального «не ходи вслед за ними»; множественное местоимение сохранено, несмотря на не вполне ясный антецедент в данном сегменте.
theological_decisions:
- issue: Референт местоимения в выражении «за ними»
  choice: Сохранить множественное «за ними» без поясняющей подстановки
  alternative: Уточнить как «за идолами» или связать с перечисленными предписаниями
  rationale: Предоставленный геэзский сегмент оканчивается местоимением множественного числа и не называет референт; уточнение разрешило бы подлинную текстовую неоднозначность за счёт отсутствующего контекста.
- issue: Тройная формула заповеди, установления и суда
  choice: Сохранить три разных существительных в единственном числе
  alternative: Употребить множественное число или обобщить как «все Его повеления»
  rationale: Исходные формы морфологически стоят в единственном числе, а различение терминов может иметь богословское и юридическое значение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Заглавное «Его» использовано как традиционное уважительное обозначение Бога; синтаксис упрощён лишь там, где это не устраняет неоднозначность источника.
