  source_fidelity: Начало фрагмента, запрет есть кровь, мотивировка «ибо она — жизнь», запрет принимать дар, предупреждение о безнаказанном и внесудебном пролитии крови и заключительное утверждение об осквернении земли переданы в целом верно. Однако «за пролитую человеческую кровь» преждевременно вносит в объект запрета признак уже совершившегося пролития, которого в исходном выражении «о/за всякую кровь человека» нет.
