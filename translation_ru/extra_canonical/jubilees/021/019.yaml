  terminology: '«Жизнь», «дар», «оскверняет», «очиститься» и «кровью того, кто её пролил» соответствуют смыслу исходника и не навязывают конфессионального истолкования. Дополнительная сноска не нужна: отмеченный в английском следе прежний вариант «взыскано с тебя» признан неверным относительно геэзского глагола и не должен предлагаться как равноправное чтение.'
