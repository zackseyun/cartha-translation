  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: ru
  text: …крови, потому что она — жизнь; никакой крови не ешь. Не принимай дара за кровь какого бы то ни было человека, чтобы она не была пролита безнаказанно, без суда; ведь пролитая кровь оскверняет землю, и земля не может очиститься от человеческой крови иначе как кровью того, кто её пролил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍስ
  choice: жизнь
  rationale: В данном запрете слово обозначает жизнь, заключённую в крови; «жизнь» естественно передаёт смысл в современном русском контексте.
- source_word: ሕልያነ
  choice: дар
  rationale: В сочетании с глаголом «принимать» и упоминанием человеческой крови слово понимается как дар или возмещение, принимаемое за пролитую кровь.
- source_word: ይትከዐው
  choice: была пролита
  rationale: Глагол означает пролитие или излияние крови, а не её взыскание.
- source_word: በከ
  choice: безнаказанно
  rationale: Наречие передаёт идею напрасности, бесцельности или безнаказанности; в судебном контексте наиболее ясно значение «безнаказанно».
- source_word: ያንጥኦ
  choice: оскверняет
  rationale: Глагол описывает загрязнение или осквернение земли пролитой кровью.
theological_decisions:
- issue: Связь крови с жизнью
  choice: она — жизнь
  alternative: в ней жизнь
  rationale: Источник прямо отождествляет кровь с жизнью в рамках ритуально-нравственного запрета; формулировка сохраняет силу исходного утверждения.
- issue: Искупление вины за пролитую кровь
  choice: иначе как кровью того, кто её пролил
  alternative: кроме крови пролившего её
  rationale: Сохранено строгое утверждение текста без расширения до какой-либо конфессиональной теории наказания или искупления.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Начальное многоточие отражает фрагментарное продолжение мысли из предшествующего контекста. Формула «безнаказанно, без суда» сохраняет близкие, но не тождественные элементы исходного выражения.
