  yaml_path: translation/extra_canonical/jubilees/021/002.yaml
  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: ru
  text: И вот, мне сто семьдесят пять лет, и во все дни моей жизни я помнил Господа и всем сердцем стремился исполнять Его волю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  choice: И вот
  rationale: Сохраняет вводную указательную формулу оригинала в естественной для русского библейского повествования форме.
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: мне сто семьдесят пять лет
  rationale: Естественная современная русская передача буквального указания возраста.
- source_word: በኵሉ፡ መዋዕለ፡ ሕይወትየ
  choice: во все дни моей жизни
  rationale: Точно сохраняет временной охват исходного выражения и его библейский образ.
- source_word: ሀሎኩ፡ እንዘ፡ እዜከር፡ ለእግዚአብሔር
  choice: я помнил Господа
  rationale: Передаёт продолжительное состояние, выраженное конструкцией с ሀሎኩ и деепричастной формой, без тяжеловесного буквального оборота.
- source_word: እንዘ፡ አኀሥሥ፡ በኵሉ፡ ልብየ
  choice: и всем сердцем стремился
  rationale: Глагол передаёт усердное искание или стремление; по-русски «стремился» естественно сочетается с последующим инфинитивом цели.
- source_word: ከመ፡ እግበር፡ ፈቃደቲሁ
  choice: исполнять Его волю
  rationale: Передаёт цель стремления; «исполнять волю» — ясное и устойчивое русское выражение для совершения желаемого Богом.
theological_decisions:
- issue: Смысл глагола እዜከር по отношению к Господу
  choice: помнил Господа
  alternative: постоянно помнил о Господе
  rationale: Сохранено прямое значение «помнить» и переходная структура оригинала; не добавлено толкование о характере или практических последствиях памятования.
- issue: Оттенок አኀሥሥ
  choice: стремился
  alternative: искал, как
  rationale: Выбор выражает направленное, усердное желание исполнить Божью волю, но не превращает фразу в утверждение о безупречном исполнении.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сделан плавным и доступным; местоимение «Его» написано с прописной буквы по принятой русской религиозно-литературной норме.
