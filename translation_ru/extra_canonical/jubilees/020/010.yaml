lexical_decisions:
- source_word: ገዳም
  choice: пустыню
  rationale: Сохраняет переходящий из предыдущего контекста фрагмент и основное значение «пустыня»; винительный падеж обусловлен синтаксической связью с предшествующим стихом.
- source_word: ወተደመሩ፡ እሉ፡ ምስለ፡ እሉ
  choice: И эти смешались с теми
  rationale: Естественно передаёт взаимное соединение двух ранее названных групп, сохраняя указательные местоимения оригинала.
- source_word: ወተጸምደ፡ ስሞሙ
  choice: и их имя соединилось
  rationale: Следует засвидетельствованному глаголу ተጸምደ «соединилось/объединилось», не принимая прежнюю эмендацию «стало называться».
- source_word: ዓረበ፡ ወእስማዔላዊያን
  choice: арабы и измаильтяне
  rationale: Передаёт оба этнонима обычными русскими формами и не сводит их к одному названию.
