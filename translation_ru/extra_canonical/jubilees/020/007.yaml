lexical_decisions:
- source_word: አባግዒከ
  choice: твоих овец
  rationale: Форма означает «твоих овец»; винительный контекст сохраняет связь с предшествующей, не включённой сюда частью предложения.
- source_word: ወትከውኑ፡ በበረከት
  choice: И вы станете благословением
  rationale: Буквальная конструкция «будете/станете в благословение» естественно передаётся по-русски как «станете благословением», без изменения смысла.
- source_word: አሕዛበ፡ ምድር
  choice: народы земли
  rationale: አሕዛብ здесь обозначает совокупность народов; выбор «народы», а не конфессионально окрашенное «язычники», соответствует универсальному контексту.
- source_word: ይፈትዉክሙ
  choice: будут любить вас
  rationale: Глагол ፈተወ прежде всего означает «любить, быть расположенным к»; перевод «желать вас» возможен лексически, но в современном русском здесь звучит двусмысленно и менее естественно.
theological_decisions:
- issue: Число адресатов в формах ትከውኑ и ይፈትዉክሙ
  choice: вы / вас
  alternative: ты / тебя
  rationale: Глагольная и местоименная формы во второй части множественного числа; русский перевод сохраняет грамматическое число исходного текста.
