    issue: Сужение смысла в выражении «о суде над Стражами».
    rationale: Эфиопское «ኵነኔሆሙ ለረዓይት» соответствует «суду Стражей»; конструкция не требует явно переводить её как суд, совершённый именно над ними. Нейтральный родительный оборот сохраняет исходную неоднозначность.
  - severity: low
    issue: Неестественная формулировка «какая-либо женщина у вас, или даже дочь».
    rationale: «У вас» в этой позиции разговорно и неясно связывает слово «дочь» с предыдущим существительным. «Какая-нибудь женщина среди вас, даже дочь» естественнее, не добавляя значения.
  - severity: low
    issue: Не вполне естественное управление в «не уклоняются ... ни от одного из путей».
    rationale: В русском устойчивее сказать «не сворачивают ... ни с одного из путей»; это точно передаёт образ уклонения вправо или влево.
