  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: ru
  text: И пусть они обрезывают своих сыновей по завету, заключённому с ними[a], и не сворачивают от этого ни вправо, ни влево, ни с одного из путей, которые заповедал Господь. И будем хранить себя от всякого блуда и нечистоты и удалим из нашей среды всякий блуд и всякую нечистоту. Если какая-нибудь женщина среди вас, даже дочь, станет блудодействовать, сожгите её в огне[b]. Пусть они не блудодействуют, следуя своим глазам и своему сердцу, и не берут себе жён из дочерей Ханаана, ибо семя Ханаана будет искоренено с земли. И он рассказал им о суде Стражей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза об обрезании сыновей по завету в этом свидетеле выражена сжато; её смысл определяется формулой Авраамова завета.
    reason: lexical_alternative
  - marker: b
    text: 'Предписание имеет суровую правовую форму: эфиопский текст прямо говорит о сожжении в огне.'
    reason: cultural_note
  - marker: c
    text: Стражи — мятежные небесные существа, известные из енохической традиции. Выражение «суд Стражей» сохраняет краткую и неуточнённую формулировку текста.
    reason: cross_reference
lexical_decisions:
