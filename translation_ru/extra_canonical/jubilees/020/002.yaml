  rationale: Форма ይክስቡ передаёт обрезание, а сочетание с «сыновьями» и «заветом» выражает заветную обязанность; сжатость эфиопского текста сохранена без лишнего пояснения в основном тексте.
- source_word: ኢይትዐደዉ፡ እምሃነ፡ ወኢፀጋመ
  choice: не уклоняются от этого ни вправо, ни влево
  rationale: Сохранена традиционная пространственная идиома, обозначающая точное следование заповеди.
- source_word: ዝሙት / ዘመወት / ይዘምዋ
  choice: блуд / станет блудодействовать / не блудодействуют
  rationale: Повтор одного и того же корня в источнике передан однокоренными русскими словами, чтобы не ослаблять конкретно сексуальный смысл.
- source_word: ወርኵስ
  choice: нечистота
  rationale: «Нечистота» сохраняет широкий нравственно-ритуальный оттенок слова и его связь с предыдущим «блудом».
- source_word: ድኅረ፡ አዕይንቲሆን፡ ወልቦንሂ
  choice: следуя своим глазам и своему сердцу
  rationale: Передана антропологическая образность источника без попытки свести её лишь к внешнему взгляду или внутреннему желанию.
- source_word: ይሤረዉ፡ ዘርአ፡ ከናአን
  choice: семя Ханаана будет искоренено
  rationale: Глагол означает вырывание с корнем; «искоренено» естественно сохраняет земледельческую метафору при существительном «семя».
- source_word: ረዓይት
  choice: Стражи
  rationale: Это закрепившееся обозначение мятежных небесных существ в енохической традиции; прописная буква показывает, что речь идёт об определённой группе.
theological_decisions:
- issue: Смена лица в наставлении
  choice: Сохранить переход от «они» к включающему «мы» в словах «будем хранить себя… удалим из нашей среды»
  alternative: Унифицировать всё как обращение во втором или третьем лице
  rationale: Источник действительно меняет грамматическую перспективу; сглаживание устранило бы особенность текста и могло бы изменить характер увещания.
- issue: Суровое предписание о сожжении
  choice: 'Передать прямо: «сожгите её в огне»'
  alternative: Смягчить до общего указания о наказании
  rationale: Эфиопский текст выражен явно и юридически резко; перевод не должен скрывать этическую и историческую напряжённость места.
- issue: Суд над Стражами
  choice: Сохранить термин «Стражи» и пояснить его в примечании
  alternative: Заменить толкованием «падшие ангелы»
  rationale: Термин источника принадлежит определённой традиции, а более истолковывающая замена сузила бы возможный смысл.
