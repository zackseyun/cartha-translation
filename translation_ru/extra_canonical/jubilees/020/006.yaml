  text: and womb, and may He bless the seed of your body and the seed of your land, and the herds of your cattle and the flocks of
translation:
  language: ru
  text: и твоего чрева; и да благословит Он семя твоего тела[a] и семя твоей земли, стада твоего скота и отары…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «семя твоего чрева».'
    reason: Лексема ከርሥ допускает значения «тело», «внутренность», «чрево».
  - marker: b
    text: Предоставленный текст источника обрывается после слов «и отары».
    reason: Незавершённость фразы вызвана границей исходного фрагмента, а не русским переводом.
lexical_decisions:
- source_word: ወማኅፀነ
  choice: и чрева
  rationale: Существительное относится к предшествующей, не включённой в данный фрагмент фразе; его не следует превращать в дополнение при глаголе «благословит».
- source_word: ወይባርክ
  choice: и да благословит Он
  rationale: Передаёт самостоятельную глагольную форму с пожелательным значением и подразумеваемым субъектом — Богом.
- source_word: ዘርአ፡ ከርሥከ
  choice: семя твоего тела
  rationale: Сохраняет образ «семени» и параллелизм с «семенем твоей земли»; ከርሥ может обозначать тело, внутренность или чрево.
- source_word: ዘርአ፡ ምድርከ
  choice: семя твоей земли
  rationale: Буквально и последовательно передаёт земледельческий член параллелизма.
- source_word: መራዕየ
  choice: стада / отары
  rationale: Слово обозначает пасущиеся стада; в русском контексте чередование «стада» и «отары» естественно различает две параллельные группы животных, не сводя термин к потомству.
theological_decisions:
- issue: Объект благословения в начале фрагмента
  choice: «чрева» оставлено частью предшествующей синтаксической конструкции, а благословение отнесено к «семени твоего тела»
  alternative: «и да благословит Он твоё чрево, семя твоего тела»
  rationale: Геэзский текст разделяет ወማኅፀነ («и чрева») и ወይባርክ («и да благословит Он»); объединение их в выражение «благословит чрево» меняло бы синтаксис источника.
- issue: Подразумеваемый субъект глагола
  choice: местоимение «Он» написано с прописной буквы
  alternative: «он» со строчной буквы либо без выраженного субъекта
  rationale: Контекст благословения указывает на Бога; прописная буква соответствует достоинству русского библейского регистра, не добавляя к тексту отдельного имени.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Начальная зависимая форма «и чрева» и конечное многоточие намеренно сохраняют фрагментарность предоставленного отрывка; точка с запятой показывает границу между предшествующей конструкцией и новым пожеланием.
