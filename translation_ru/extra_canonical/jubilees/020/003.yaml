base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: ru
  text: 'и суд над Содомом: как его жители были осуждены за своё нечестие, за разврат, нечистоту и царившее среди них растление; из-за разврата они погибли. И вы также берегитесь всякого разврата и нечистоты, всякой греховной скверны, чтобы вы не обрекли своё имя на проклятие, всю свою жизнь — на поношение, а всех своих сыновей — на истребление мечом[a], чтобы не стать проклятыми, как Содом, и чтобы весь ваш остаток стал как сыновья Гоморры. Свидетельствую вам, дети мои: любите Его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всех ваших сыновей — на погибель (или разрушение) мечом».'
    reason: Сохраняет именную конструкцию и отмечает широкий смысл слова ሙስና.
  - marker: b
    text: Местоимение «Его» относится к Богу небес, названному в следующем стихе.
    reason: Поясняет предваряющую отсылку, выраженную объектным суффиксом геэзского глагола.
lexical_decisions:
- source_word: ዝሙት
  choice: разврат
  rationale: Передаёт половую распущенность в современном литературном русском и сохраняет повтор исходного слова в обеих частях стиха.
- source_word: ርኵስ
  choice: нечистота
  rationale: Сохраняет нравственно-ритуальную окраску исходного понятия, не сужая его до одного конкретного проступка.
- source_word: ሙስና
  choice: растление / истребление
  rationale: У слова есть смысловое поле порчи, разрушения и гибели. В первом контексте выбрано «растление», во втором, при упоминании меча, — «истребление».
- source_word: ፃማነ፡ ኀጢአት
  choice: греховная скверна
  rationale: Естественное русское сочетание, передающее оскверняющее следствие греха.
- source_word: አሰምዕ
  choice: Свидетельствую
  rationale: Передаёт форму первого лица единственного числа как заявление говорящего, а не как повеление «слушайте».
- source_word: አፍቅርዎ
  choice: любите Его
  rationale: Сохраняет объектный суффикс третьего лица мужского рода; местоимение предвосхищает названного далее Бога.
theological_decisions:
- issue: Объект повеления «любите» в конце стиха
  choice: любите Его
  alternative: любите
  rationale: Объект выражен в геэзском глаголе и не должен быть опущен; его конкретный референт раскрывается в следующем стихе.
- issue: Причина суда над Содомом
  choice: сохранён ряд «нечестие, разврат, нечистота и растление»
  alternative: свести ряд к одному обобщённому греху
  rationale: Исходный текст перечисляет несколько оснований суда; перевод не должен богословски сужать или переопределять этот перечень.
- issue: Параллельные дополнения при запрете
  choice: «обречь имя… жизнь… сыновей…»
  alternative: выделить «сыновья погибнут» в самостоятельное предложение
  rationale: Сохраняется синтаксический параллелизм исходника, где имя, жизнь и сыновья относятся к одному глагольному построению.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Начальное «и» сохранено, поскольку стих синтаксически продолжает предыдущее наставление. Параллелизм проклятия, поношения и истребления передан с помощью тире; повтор слова «разврат» сохранён намеренно.
