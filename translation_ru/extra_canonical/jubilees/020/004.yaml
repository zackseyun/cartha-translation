  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: ru
  text: 'Служите Богу небесному и держитесь всех Его заповедей; не следуйте за их идолами и их нечистотой. Не делайте себе литых богов и резных изображений, потому что они — ничто и нет в них духа: они — дело человеческих рук, и все, кто полагается на них, полагаются на ничто. Не служите им и не поклоняйтесь им, но служите Богу…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትጸመዱ
  choice: держитесь
  rationale: Передаёт призыв крепко прилепляться к заповедям и сохраняет естественность современной русской речи.
- source_word: ርኵሶሙ
  choice: их нечистотой
  rationale: Сохраняет культово-нравственную широту понятия, не сужая его до физической грязи.
- source_word: አማልክተ፡ ሰብክ
  choice: литых богов
  rationale: Передаёт богов, изготовленных литьём; формулировка сохраняет предмет идолопоклонства, а не заменяет его отвлечённым понятием.
- source_word: ግልፈዋተ
  choice: резных изображений
  rationale: Естественный русский эквивалент для вырезанных или изваянных культовых образов.
- source_word: ከንቱ
  choice: ничто
  rationale: В контексте подчёркивает пустоту и бессилие идолов; повтор далее сохранён ради риторической связи.
- source_word: ኢታምልክዎሙ
  choice: не служите им
  rationale: В данном культовом контексте глагол обозначает религиозное служение или почитание.
theological_decisions:
- issue: Онтологический статус идолов
  choice: они — ничто
  alternative: они суетны / пусты
  rationale: Формулировка сохраняет резкую полемику источника, но не добавляет систематического утверждения сверх текста.
- issue: Наличие духа в идолах
  choice: нет в них духа
  alternative: нет в них дыхания
  rationale: Сохраняется лексическая и богословская неоднозначность между духом и жизненным дыханием.
- issue: Незавершённость стиха во входном фрагменте
  choice: но служите Богу…
  alternative: дополнить предполагаемое продолжение
  rationale: Источник и консультационный английский текст обрываются на словах «Богу»; многоточие честно отмечает неполноту без реконструкции отсутствующего текста.
translation_notes:
  register: Современный литературный русский с достоинством заповедного наставления. Синтаксис слегка формальный, но доступный; параллелизм запретов и повтор «полагаются на ничто» сохранены. Начало представляет собой продолжение предложения из предыдущего контекста, поэтому перевод начинается с формы «Богу небесному».
