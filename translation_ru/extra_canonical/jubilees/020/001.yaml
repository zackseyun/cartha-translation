revisions:
- from: И в сорок втором юбилее, в первый год седьмой седмины, Авраам призвал Измаила и двенадцать его сыновей, Исаака и двух его сыновей, а также шестерых сыновей Хеттуры и их детей. Он заповедал им хранить путь Господа, творить праведность, каждому любить своего ближнего и быть таким среди всех людей, чтобы они ходили сообща, творя правосудие и праведность на земле.[a]
  to: В сорок второй юбилей, в первый год седьмой седмины, Авраам призвал Измаила и двенадцать его сыновей, Исаака и двух его сыновей, а также шестерых сыновей Хеттуры и их детей. Он заповедал им соблюдать путь Господа, творить праведность, чтобы каждый любил своего ближнего и был таким среди всех людей, а они ходили сообща, творя правосудие и праведность на земле.[a]
  rationale: Исправлены русский способ обозначения юбилейного периода и синтаксическая связь заключительных предписаний. Сохранены образ «ходить», различение «правосудия» и «праведности», а также исходный переход от индивидуального наставления к множественному числу. Неоднозначное «быть таким среди всех людей» не конкретизируется доктринально или интерпретационно; его вероятный смысл обозначен в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:54:58Z'
review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт перечисление призванных и основные наставления. Однако «в сорок втором юбилее» неестественно для обозначения периода в русском языке; требуется «в сорок второй юбилей». Заключительная синтаксически трудная цепочка в геэзском тексте передана с сохранением перехода от единственного числа («каждый») к множественному («они»), но связь «быть таким ... чтобы они ходили» в русском нуждается в более ясном координировании без устранения исходной неоднозначности.
  naturalness: «В сорок второй юбилей» и «соблюдать путь Господа» звучат естественнее в современном литературном русском при сохранении библейского регистра. Формулировка «чтобы каждый был таким среди всех людей» намеренно несколько буквальна, поскольку предметное содержание «так» в исходной фразе синтаксически не вполне прозрачно; сноска поясняет вероятный общий смысл.
  terminology: «Седмина», «путь Господа», «праведность» и «правосудие» уместны. «Своего ближнего» допустимо для ቢጾ и сохраняет более широкое значение, чем только кровный брат; это не требует изменения. Имя «Хеттура» передано в принятой русской библейской форме.
  issues:
  - severity: medium
    issue: Неестественное обозначение юбилейного периода
    rationale: Оборот «в сорок втором юбилее» грамматически возможен лишь с натяжкой и не соответствует обычному русскому способу обозначать такой период. «В сорок второй юбилей» передаёт тот же смысл естественно.
  - severity: medium
    issue: Неясная синтаксическая связь в заключительном наставлении
    rationale: В варианте «быть таким среди всех людей, чтобы они ходили сообща» придаточное с множественным числом может ошибочно восприниматься как цель индивидуального «быть таким». Координация двух частей точнее отражает смену числа в источнике и делает русский текст читаемым.
  revised_text: В сорок второй юбилей, в первый год седьмой седмины, Авраам призвал Измаила и двенадцать его сыновей, Исаака и двух его сыновей, а также шестерых сыновей Хеттуры и их детей. Он заповедал им соблюдать путь Господа, творить праведность, чтобы каждый любил своего ближнего и был таким среди всех людей, а они ходили сообща, творя правосудие и праведность на земле.[a]
