  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: ru
  text: В сорок второй юбилей, в первый год седьмой седмины, Авраам призвал Измаила и двенадцать его сыновей, Исаака и двух его сыновей, а также шестерых сыновей Хеттуры и их детей. Он заповедал им соблюдать путь Господа, творить праведность, чтобы каждый любил своего ближнего и был таким среди всех людей, а они ходили сообща, творя правосудие и праведность на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть стиха в геэзском тексте синтаксически сложна. Возможный смысл: Авраам призывает каждого любить ближнего и жить среди всех людей так, чтобы вместе творить правосудие и праведность.'
    reason: segmentation_note
lexical_decisions:
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: путь Господа
  rationale: Сохраняет библейский образ пути как образа верности Богу и образа жизни.
- source_word: ቢጾ
  choice: своего ближнего
  rationale: Слово обозначает другого человека, товарища или ближнего; «ближнего» естественно в русском библейском регистре и не сужает значение до родного брата.
- source_word: ይሖሩ
  choice: ходили
  rationale: Передаёт явно выраженный глагол движения и сохраняет библейскую метафору хождения как поведения и образа жизни.
- source_word: ፍትሕ፡ ወጽድቅ
  choice: правосудие и праведность
  rationale: 'Различает два связанных понятия: справедливый суд/правосудие и нравственную праведность.'
theological_decisions:
- issue: Число в заключительном наставлении
  choice: «каждому… быть», затем «чтобы они ходили»
  alternative: Передать всё наставление во множественном числе
  rationale: Сохраняет переход источника от форм единственного числа, относящихся к каждому человеку, к форме множественного числа в заключительной части.
- issue: Образ «хождения»
  choice: Сохранить «ходили сообща»
  alternative: Передать только смысл как «жили» или «поступали»
  rationale: Образ прямо присутствует в источнике и несёт традиционный этический смысл, не требуя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Седмина» сохраняет различие между семилетним периодом и обычной календарной неделей; «творить праведность» и «путь Господа» сохранены как понятные библейские обороты.
