  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: ru
  text: И будут благословлять ваших детей моим именем, чтобы и они были благословенны, как благословен я. И дал он дары Измаилу, его сыновьям и сыновьям Хеттуры и отослал их от своего сына Исаака; а ему отдал всё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «ему» сохраняет форму источника; по контексту оно, вероятно, относится к Исааку.
    reason: Поясняет вероятный антецедент местоимения, не подменяя его именем в основном тексте и не снимая полностью текстовую неоднозначность.
lexical_decisions:
- source_word: ይባርኩ
  choice: будут благословлять
  rationale: Передаёт глагольную форму как будущее действие, сохраняя прямой смысл источника.
- source_word: በስምየ
  choice: моим именем
  rationale: Формально и естественно передаёт предложную конструкцию со значением благословения именем говорящего.
- source_word: ሀብተ
  choice: дары
  rationale: 'Контекстуально точное значение существительного: имущество, данное Измаилу, его сыновьям и сыновьям Хеттуры.'
- source_word: ወፈነዎሙ
  choice: и отослал их
  rationale: Сохраняет множественное местоименное дополнение и последовательность повествования.
- source_word: ወኵሎ፡ ወሀቦ
  choice: а ему отдал всё
  rationale: Передаёт и «всё», и мужской объектный суффикс «ему» при ወሀቦ; порядок слов сделан естественным для русского языка.
theological_decisions:
- issue: К кому относится местоимение «ему» в заключительной фразе
  choice: Сохранено местоимение «ему» без добавления имени в основной текст.
  alternative: «а Исааку отдал всё»
  rationale: Форма ወሀቦ содержит объектный суффикс мужского рода, однако имя адресата в данной фразе прямо не повторено. Контекст указывает на Исаака, но эксплицировать его имя означало бы снять присутствующую в стиховом членении анафорическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но доступным синтаксисом. Начальное «И» и цепочка повествовательных глаголов сохранены. Формулировка не сглаживает резкий конец стиха и сохраняет местоименную отсылку источника.
