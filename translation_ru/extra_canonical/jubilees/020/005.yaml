  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: ru
  text: Всевышнего; поклоняйтесь Ему, непрестанно ищите Его лица во всякое время и поступайте перед Ним праведно и справедливо, чтобы Он направил вас, оказал вам милость, ниспослал вам утренний и вечерний дождь[a], благословил все дела, которые вы совершаете на земле, и благословил ваше зерно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «утренний и вечерний дождь», возможно, соответствует традиционному земледельческому благословению своевременными дождями — ранним и поздним.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  choice: Всевышнего
  rationale: Субстантивированное обозначение Бога сохранено как «Всевышний». Форма в данном разделении текста продолжает синтаксическую конструкцию предыдущего стиха, поэтому передана как фрагмент без добавления отсутствующего в источнике глагола.
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: непрестанно ищите Его лица
  rationale: Сохранена библейская идиома «искать лица» без сведения её к более узкому толкованию вроде молитвы или благоволения.
- source_word: ርትዐ፡ ወጽድቀ
  choice: праведно и справедливо
  rationale: 'Переданы два близких, но различимых понятия: прямота/праведность и справедливость, без слияния в одно.'
- source_word: ያርትዕ፡ ርእስክሙ
  choice: направлял вас
  rationale: Буквально «направил/исправил вас самих»; ርእስክሙ («ваши головы») здесь выполняет возвратную функцию и не означает «ваш путь».
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: утренний и вечерний дождь
  rationale: Сохранены буквальные временные определения источника; возможная связь с устойчивой формулой о раннем и позднем дожде отмечена в сноске.
- source_word: እክልከ
  choice: ваше зерно
  rationale: Передано конкретное собирательное значение «зерно/хлебное зерно», а не более широкое «урожай».
theological_decisions:
- issue: Значение выражения ያርትዕ፡ ርእስክሙ
  choice: чтобы Он направлял вас
  alternative: чтобы Он сделал вас праведными / направил ваш путь
  rationale: Первый вариант сохраняет широту глагола и правильно понимает ርእስክሙ как возвратное обозначение самих адресатов; «путь» в исходном тексте отсутствует, а «сделал праведными» чрезмерно сужает смысл.
- issue: Синтаксическая незавершённость начала стиха
  choice: Всевышнего; поклоняйтесь Ему
  alternative: Бойтесь Всевышнего и поклоняйтесь Ему
  rationale: При данном разделении первый элемент продолжает предшествующую конструкцию. Не добавлен глагол, отсутствующий в представленном тексте, чтобы не скрывать границу и не подменять источник реконструкцией.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимения, относящиеся к Богу, написаны с прописной буквы. Повторы источника («непрестанно… во всякое время») сохранены, а длинная цепочка повелений и благословений слегка упорядочена русским синтаксисом без устранения смысловых параллелей.
