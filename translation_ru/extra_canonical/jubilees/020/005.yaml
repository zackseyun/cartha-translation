  terminology: '«Всевышний», «поклоняйтесь», «праведно и справедливо», «милость», «зерно» выбраны удачно. Не следует заменять «вас» на «ваш путь»: в ርእስክሙ имеется возвратное обозначение самих адресатов. Сноска корректно привязана к «дождю» и осторожно формулирует возможную аграрную ассоциацию, не отождествляя буквальную формулировку с «ранним и поздним дождём».'
