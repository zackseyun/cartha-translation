lexical_decisions:
- source_word: ለይስሐቅ፡ ወልዱ
  choice: Исааку, своему сыну
  rationale: Сохранён фрагментарный синтаксис начала стиха, продолжающий предыдущее предложение; притяжательное отношение передано естественным русским «своему».
- source_word: ኅቡረ
  choice: вместе
  rationale: Наречие передаёт совместность действий всех перечисленных потомков.
- source_word: እምፋርሞን
  choice: от Фарана
  rationale: Топоним передан традиционной русской библейской формой «Фаран»; предлог обозначает исходную границу области расселения.
- source_word: እስከ፡ ምብዋአ፡ ባቢሎን
  choice: до входа в Вавилон
  rationale: Буквально сохранён пространственный предел у входа или подступа к Вавилону без уточнения, которого нет в источнике.
- source_word: ምድር፡ እንተ፡ ገጸ፡ ጽባሕ
  choice: земле, обращённой к востоку
  rationale: Идиома с «лицом» и «восходом/утром» естественно передана как ориентация на восток.
