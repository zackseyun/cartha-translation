  yaml_path: translation/extra_canonical/jubilees/045/013.yaml
  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: ru
  text: Иосиф установил это как закон для земли Египта до нынешнего дня. Израиль прожил в земле Египта семнадцать лет, и всего он прожил три юбилея — сто сорок семь лет. Он умер в четвёртый год пятой седмины сорок пятого юбилея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: закон
  rationale: Слово обозначает установленный порядок или обязательное постановление; «закон» здесь естественно и ясно передаёт юридический смысл в контексте установления Иосифа для Египта.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: до сего дня
  rationale: Устойчивая формула, буквально соответствующая источнику и уместная в dignified modern literary Russian.
- source_word: እዮቤሌውስ
  choice: юбилей
  rationale: Сохранён технический хронологический термин книги, означающий период в сорок девять лет.
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологической системе Юбилеев это семилетняя неделя; «седмина» позволяет отличить её от обычной семидневной недели.
theological_decisions:
- issue: Соотношение «трёх юбилеев» и 147 лет
  choice: Сохранить обе формулировки источника без поясняющего пересчёта
  alternative: Передать только числом лет или добавить разъяснение, что три юбилея равны 147 годам
  rationale: Источник намеренно выражает возраст и в юбилеях, и в годах; перевод сохраняет его хронологическую систему и не устраняет кажущуюся избыточность.
- issue: Референт местоимения при смерти
  choice: «умер он», относя к Израилю (Иакову)
  alternative: Повторить имя «Израиль»
  rationale: Последовательность подлежащих и повествовательный контекст ясно указывают на Израиля; местоимение сохраняет структуру оригинала без двусмысленности в русском тексте.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формула «до сего дня» и термин «седмина» сохранены как уместные для древнего повествования; синтаксис сделан ясным для обычного читателя.
