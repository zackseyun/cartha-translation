  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: ru
  text: И он благословил их и дал Иосифу двойную долю в земле. Затем он почил со своими отцами и был погребён в пещере Махпела[a], в земле Ханаан, близ Авраама, своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в двойной пещере». Это пещера погребения предков, в других местах называемая Махпелой.'
    reason: cross_reference
lexical_decisions:
- source_word: ክልኤተ፡ መክፈሊተ
  choice: двойную долю
  rationale: Буквально «две доли»; русское «двойную долю» естественно передаёт особое наследственное выделение Иосифу, не уточняя сверх источника характер владения.
- source_word: ኖመ፡ ምስለ፡ አበዊሁ
  choice: почил со своими отцами
  rationale: Традиционная библейская формула естественно передаёт эвфемизм «уснул со своими отцами» и сохраняет его достоинство.
- source_word: በዐት፡ ዘካዕበት
  choice: пещере Махпела
  rationale: Геэзское выражение буквально означает «двойная пещера» и соответствует известному месту погребения предков — Махпеле; топонимическая передача яснее в основном тексте, а буквальное значение отмечено в сноске.
- source_word: ቅሩበ፡ አብርሃም፡ አቡሁ
  choice: близ Авраама, своего отца
  rationale: 'Сохраняет синтаксическую неоднозначность источника: речь может идти о близости места погребения либо о погребении рядом с Авраамом; «отца» передаёт родового предка.'
theological_decisions:
- issue: Формула смерти патриарха
  choice: почил со своими отцами
  alternative: уснул со своими отцами
  rationale: «Почил» сохраняет библейский эвфемизм смерти без утверждения частного учения о состоянии умерших.
- issue: Отношение Авраама к умершему
  choice: Авраама, своего отца
  alternative: Авраама, своего предка
  rationale: Источник буквально называет Авраама «его отцом»; сохранена древняя широкая родственная терминология, не заменённая интерпретирующим «предком».
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Союзное построение источника слегка упорядочено: «затем» обозначает последовательность событий. Маркер сноски поставлен непосредственно после названия Махпелы, которое он поясняет.'
