revisions:
- from: И земля Египетская страдала от голода, и Иосиф приобрёл для фараона всю землю Египетскую за зерно, а также людей, их скот и всё остальное.[a]
  to: И земля Египта страдала от голода, и Иосиф приобрёл для фараона всю землю Египта за зерно, а также приобрёл для него людей, их скот и всё.
  rationale: Явно повторён глагол «приобрёл», чтобы сохранить активную роль Иосифа в заключительной части исходного текста. «Всё остальное» заменено на «всё», а ненужная сноска удалена. «Земля Египта» соответствует современному литературному русскому употреблению без изменения смысла.
