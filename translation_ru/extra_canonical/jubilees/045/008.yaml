  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: ru
  text: И земля Египта страдала от голода, и Иосиф приобрёл для фараона всю землю Египта за зерно, а также приобрёл для него людей, их скот и всё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐመተ
  choice: страдала
  rationale: Передаёт бедственное состояние земли из-за голода естественным современным русским языком.
- source_word: አስተጋብአ
  choice: приобрёл
  rationale: Каузативный глагол описывает активное приобретение Иосифом земли для фараона.
- source_word: በእክል
  choice: за зерно
  rationale: Предлог с существительным выражает средство или обмен; в данном контексте естественно передать как приобретение в обмен на зерно.
- source_word: ሰብአኒ
  choice: а также людей
  rationale: Частица -ኒ имеет добавочное значение «также»; существительное обозначает людей, а не «их людей».
- source_word: አጥሪየ
  choice: приобрёл
  rationale: Форма является глаголом со значением приобретения, а не существительным «имущество»; подразумеваемый субъект — Иосиф.
