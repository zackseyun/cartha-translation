    rationale: В исходном тексте አጥሪየ понимается как глагол «приобрёл» с Иосифом как действующим лицом. В русском его лучше повторить, чтобы не ослаблять эту синтаксически и смыслово существенную деталь.
  - severity: low
    issue: «Всё остальное» добавляет значение остатка.
    rationale: Исходное ኵሎ означает «всё»; слово «остальное» может создать впечатление ограниченного остатка после уже названных предметов.
  - severity: low
    issue: Сноска избыточна и неточно описывает альтернативу.
