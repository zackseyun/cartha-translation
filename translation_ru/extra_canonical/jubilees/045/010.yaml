base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/010.yaml
  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: ru
  text: Ведь за семь лет голода река не разливалась[a] и не орошала землю, кроме немногих мест по берегам. Теперь же она разлилась, и египтяне засеяли землю и в тот год собрали очень много зерна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поднималась».'
    reason: Геэзское выражение буквально допускает представление о том, что вода не наполнялась или не поднималась; основной текст передает подразумеваемый разлив реки.
lexical_decisions:
- source_word: ዐባር
  choice: река
  rationale: В контексте Египта подразумевается Нил; нарицательное «река» сохраняет формулировку источника и естественно звучит по-русски.
- source_word: ኢመልአ
  choice: не разливалась
  rationale: Буквально глагол связан с наполнением; применительно к реке речь идет о подъеме воды и разливе. В сноске сохранен более буквальный вариант.
- source_word: ወኢሰቀየ
  choice: и не орошала землю
  rationale: Глагол ሰቀየ означает «поить, орошать»; дополнение «землю» восстанавливается из контекста и передает сельскохозяйственный смысл.
- source_word: መካን፡ ኀበ፡ ድንጋጌ፡ ፈለግ
  choice: мест по берегам
  rationale: Передает немногочисленные участки у кромки/берегов реки без излишне буквальной и неясной конструкции.
- source_word: ግብጽ
  choice: египтяне
  rationale: Название «Египет» метонимически обозначает жителей страны, которые сеяли и собирали урожай; личная форма естественнее в современном русском.
- source_word: አረሩ፡ ብዙኀ፡ ሥርናየ
  choice: собрали очень много зерна
  rationale: Передает уборку обильного урожая зерна; «зерно» уместно как обобщающее обозначение хлебных злаков.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью. Подразумеваемый Нил назван «рекой», как в источнике; причинно-временная связь и контраст между годами голода и нынешним годом сохранены.
