  source_fidelity: 'Перевод верно передаёт противопоставление: в течение семи лет голода река не разливалась и не орошала землю, за исключением немногих мест у её берегов; затем она разлилась, и жители Египта засеяли землю и собрали обильное количество зерна. «Река» обоснованно сохраняет нарицательное обозначение источника, хотя в контексте подразумевается Нил. Сноска корректно отмечает возможный буквальный оттенок «не поднималась», не подменяя значение второго глагола «не орошала».'
