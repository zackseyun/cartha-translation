  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: ru
  text: от раба своего Иакова. «Велико для меня то, что я увидел твоё лицо, пока я ещё жив, ибо воистину исполнилось видение, которое я видел в Вефиле. Благословен Господь, Бог мой, во веки веков, и благословенно имя Его».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምገብሩ፡ ያዕቆብ
  choice: от раба своего Иакова
  rationale: Сохранён переходящий из контекста начальный оборот; ገብር передаёт служение/рабство, а притяжательное отношение отражено словом «своего» согласно источнику и консультационному слою.
- source_word: ዐቢይ፡ ሊተ፡ ዘርኢኩ፡ ገጸከ
  choice: Велико для меня то, что я увидел твоё лицо
  rationale: Близко переданы предикативное «велико для меня» и библейская идиома «увидеть лицо», без замены более свободным «увидеть тебя».
- source_word: እንከ፡ ሕያው፡ አነ
  choice: пока я ещё жив
  rationale: Естественная русская передача временно-состоянийного выражения с сохранением акцента на том, что говорящий всё ещё жив.
- source_word: እስመ፡ አማን፡ ሀለወ፡ ራእይ
  choice: ибо воистину исполнилось видение
  rationale: አማን передано как «воистину»; сочетание с ሀለወ в данном контексте означает, что видение подтвердилось или осуществилось. «Исполнилось» естественно выражает это по-русски.
- source_word: በቤቴል
  choice: в Вефиле
  rationale: Использована устоявшаяся русская библейская форма топонима Бет-Эль.
- source_word: ይትባረክ፡ እግዚአብሔር፡ አምላኪየ
  choice: Благословен Господь, Бог мой
  rationale: Формула благословения передана торжественно и естественно; «Господь» соответствует традиционной русской передаче божественного наименования в данном контексте.
- source_word: ለዓለመ፡ ዓለም
  choice: во веки веков
  rationale: Сохранена традиционная и понятная русская формула вечности.
theological_decisions:
- issue: Степень осуществления видения в Вефиле
  choice: исполнилось видение
  alternative: видение ... истинно подтвердилось / было действительно установлено
  rationale: Русское «исполнилось» ясно передаёт признание того, что увиденное прежде стало действительностью, не уточняя сверх текста способ или полноту исполнения.
- issue: Форма благословения Бога
  choice: Благословен Господь, Бог мой
  alternative: Да будет благословен Господь, Бог мой
  rationale: Именная формула сохраняет утвердительно-хвалебный характер текста и соответствует последней аудированной редакции консультационного слоя, не превращая её явно в пожелание.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены идиома «увидел твоё лицо», традиционные формы «Вефиль» и «во веки веков». Начало стиха намеренно оставлено синтаксически зависимым от предыдущего контекста, как в предоставленном сегменте источника.
