  text: fourth, in the second year of the third week of the forty-second[2] jubilee. And Joseph came to receive him.
translation:
  language: ru
  text: четвёртого [месяца][a], во второй год третьей седмины сорок второго[b] юбилея. И Иосиф пришёл встретить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих начинается продолжением фразы из предыдущего стиха; буквально здесь стоит только «четвёртого».
    reason: verse_segmentation
  - marker: b
    text: 'В геэзском тексте буквально: «сорок второго» (፵ወ፪), хотя внутренняя хронология Книги Юбилеев требует сорок пятого юбилея.'
    reason: textual_variant
lexical_decisions:
- source_word: ራብዕ
  choice: четвёртого [месяца]
  rationale: Порядковое числительное «четвёртого» продолжает оборот о месяце из предыдущего стиха; слово «месяца» восстановлено в квадратных скобках ради ясности при отдельном цитировании стиха.
- source_word: ሣልስ
  choice: третьей седмины
  rationale: «Седмина» точно передаёт семилетний период в календарной системе книги и сохраняет возвышенный библейский регистр.
- source_word: ይትቀበል
  choice: встретить его
  rationale: В данном повествовательном контексте глагол со значением принятия или встречи естественно передаётся как «встретить»; местоименный объект сохранён без уточнения личности, как в источнике.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским календарным термином «седмина». Синтаксический разрыв на границе стихов обозначен явно, а ошибочное с точки зрения внутренней хронологии чтение рукописного текста сохранено в основном тексте и пояснено в примечании.
