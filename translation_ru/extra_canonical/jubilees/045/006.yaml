  to: Иосиф дал своему отцу и братьям владение, чтобы они поселились в земле Гесем, в Раамсесе и во всей его области, которой он управлял перед фараоном.[a] Израиль и его сыновья поселились в земле Гесем, в лучшей части земли Египта. Израилю было сто тридцать лет, когда он вошёл в Египет.
  rationale: Заменены «окрестности» на «область» для более точной передачи территориального значения и более ясной отсылки к Раамсесу. Второе предложение слегка сглажено без изменения смысла. Неоднозначное отношение управления к фараону сохранено в основном тексте и отмечено сноской.
