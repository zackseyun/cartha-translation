  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: ru
  text: Иосиф дал своему отцу и братьям владение, чтобы они поселились в земле Гесем, в Раамсесе и во всей его области, которой он управлял перед фараоном.[a] Израиль и его сыновья поселились в земле Гесем, в лучшей части земли Египта. Израилю было сто тридцать лет, когда он вошёл в Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «которой он управлял от имени фараона».'
    reason: Оборот «перед фараоном» может обозначать управление перед фараоном, в его присутствии либо по его поручению; примечание сохраняет эту смысловую неоднозначность.
lexical_decisions:
- source_word: ሀብተ
  choice: владение
  rationale: Передаёт дарованный семье земельный надел или собственность, не сужая значение до отдельного дома либо участка.
- source_word: ምድረ፡ ጌሤም
  choice: земля Гесем
  rationale: Использована устоявшаяся в русской библейской традиции форма топонима.
- source_word: ራሜሲና
  choice: Раамсес
  rationale: Выбрана привычная русская библейская форма названия местности.
- source_word: ዘይኴንን
  choice: которыми он управлял
  rationale: Глагол означает правление или управление; субъектом по контексту является Иосиф. Форма множественного числа в русском согласована с «окрестностями».
- source_word: ምሥናይሃ
  choice: лучшей части
  rationale: Контекстуально выражает превосходное качество области Гесем внутри Египетской земли.
- source_word: ቦአ
  choice: вошёл
  rationale: Формально сохраняет исходный образ вхождения в Египет, не заменяя его более толковательным «переселился».
theological_decisions:
- issue: Характер управления Иосифа перед фараоном
  choice: «которыми он управлял перед фараоном»
  alternative: «которыми он управлял от имени фараона»
  rationale: Основной текст непосредственно передаёт значение глагола «управлять» и сохраняет буквальную пространственно-реляционную формулу «перед фараоном», не превращая её безоговорочно в юридическое полномочие.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; традиционные формы имён и топонимов сохранены. Маркер [a] помещён непосредственно после неоднозначного оборота.
