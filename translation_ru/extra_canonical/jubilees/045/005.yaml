  to: Иосиф и его братья ели хлеб перед своим отцом и пили вино. Иаков испытал чрезвычайно великую радость, потому что увидел, как Иосиф ест со своими братьями и пьёт перед ним. Иаков благословил Творца всего, Который сохранил его и сохранил для него двенадцать его сыновей.
