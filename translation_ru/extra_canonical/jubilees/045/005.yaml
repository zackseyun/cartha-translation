  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: ru
  text: Иосиф и его братья ели хлеб перед своим отцом и пили вино. Иаков испытал чрезвычайно великую радость, потому что увидел, как Иосиф ест со своими братьями и пьёт перед ним. Иаков благословил Творца всего, Который сохранил его и сохранил для него двенадцать его сыновей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: хлеб
  rationale: Прямое соответствие эфиопскому слову; в контексте совместной трапезы может обозначать хлеб как пищу, но конкретный образ сохранён.
- source_word: ተፈሥሐ፡ ... ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: возрадовался чрезвычайно великой радостью
  rationale: Сохранена эмфатическая конструкция с однокоренными глаголом и существительным и усилением «весьма/чрезвычайно».
- source_word: ፈጣሪ፡ ኵሉ
  choice: Творца всего
  rationale: Формально и естественно передаёт титул «Создатель/Творец всего», не добавляя конфессионального толкования.
- source_word: ዐቀቦ፡ ወዐቀበ፡ ሎቱ
  choice: сохранил его и сохранил для него
  rationale: Сохранён повтор исходного глагола и различие между прямым объектом «его» и конструкцией «для него».
- source_word: ፲ወ፪ ውሉደ
  choice: двенадцать его сыновей
  rationale: Контекстуально уточнена принадлежность сыновей Иакову, выраженная в исходной конструкции через «для него» и местоименный суффикс.
theological_decisions:
- issue: Объект первого «сохранил»
  choice: «сохранил его» — Иакова
  alternative: Понять местоимение как относящееся к Иосифу
  rationale: Ближайшим субъектом благословения является Иаков, а последовательность «сохранил его и сохранил для него двенадцать сыновей» естественно описывает сохранение самого Иакова и всей его семьи. При этом формулировка не расширена толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический повтор и усиление радости намеренно сохранены; устаревшие формы и излишняя церковнославянизация избегаются.
