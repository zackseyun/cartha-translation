  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: ru
  text: в гробнице, которую он выкопал для себя в двойной пещере в земле Хеврона. И он передал все свои книги и книги своих отцов своему сыну Левию, чтобы тот хранил их и обновлял[a] для своих детей до нынешнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Обновлял» может означать, что книги сохраняли, заново переписывая, восстанавливая или вновь передавая их последующим поколениям.
