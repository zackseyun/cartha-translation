  text: And Joseph took for the king a fifth of everything that was produced, and four parts he left to them for food and for seed.
translation:
  language: ru
  text: И Иосиф взял для царя пятую часть всего урожая, а четыре части оставил им на пропитание и на семена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኵሉ፡ ዘፈረየ
  choice: всего урожая
  rationale: Буквально «из всего, что произросло/было произведено»; в земледельческом контексте естественно и точно передано как «всего урожая».
- source_word: ኃምስቶ
  choice: пятую часть
  rationale: Обозначает одну пятую долю; русский оборот передаёт установленную долю урожая.
- source_word: ራብዕተ፡ እደ
  choice: четыре части
  rationale: Буквально «четыре доли/части», то есть оставшиеся четыре пятых; сохранён способ выражения источника.
- source_word: ለሲሲት፡ ወለዘርእ
  choice: на пропитание и на семена
  rationale: 'Передаёт две цели оставленного урожая: пищу и посевной материал.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль краткий и достойный. Порядок слов ясно показывает, что для царя предназначалась пятая часть всего урожая, а не пятая часть урожая, выращенного специально для царя.
