  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: ru
  text: '…отца своего Иакова в земле Гесем. Он обнял отца за шею и заплакал. И сказал Израиль Иосифу: «Теперь я могу умереть, потому что увидел тебя. И да будет ныне благословен Господь, Бог Израиля, Бог Авраама и Бог Исаака, явивший милость и сострадание».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ጌሤም
  choice: земле Гесем
  rationale: Традиционная и узнаваемая русская передача библейского топонима; конструкция соответствует значению «земля Гесем».
- source_word: ሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: обнял отца за шею
  rationale: Естественная современная русская передача буквального образа «обнял шею своего отца» без изменения смысла.
- source_word: እሙት፡ ይእዜሰ
  choice: Теперь я могу умереть
  rationale: Передаёт идиоматический смысл слов Израиля после встречи с Иосифом; форма не выражает просьбы разрешить смерть столь явно, как английское «let me die».
- source_word: ምሕረተ፡ ወሣህሎ
  choice: милость и сострадание
  rationale: Сохраняет парное обозначение Божьего милосердия и сострадательности, не сводя два исходных понятия к одному.
theological_decisions:
- issue: Формула благословения Бога
  choice: да будет ныне благословен Господь, Бог Израиля, Бог Авраама и Бог Исаака
  alternative: благословен ныне Господь, Бог Израиля, Бог Авраама и Бог Исаака
  rationale: Желательная конструкция «да будет» ясно передаёт исходную форму и сохраняет торжественный библейский регистр.
- issue: Описание Божьего действия
  choice: явивший милость и сострадание
  alternative: не лишивший милости и сострадания
  rationale: Положительная формулировка непосредственно соответствует исходному выражению и не вносит отсутствующего отрицания.
