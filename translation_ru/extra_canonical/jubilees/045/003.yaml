  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное многоточие сохранено, поскольку исходный фрагмент начинается внутри предложения: управляющий глагол, относящийся к словам «отца своего Иакова», находится в предыдущем сегменте.'
