revisions:
- from: И окончились годы голода, и Иосиф дал народам, жившим в стране, семена и припасы, чтобы они засеяли землю на восьмой год, потому что река разлилась по всей земле Египетской.
  to: И окончились годы голода, и Иосиф дал людям, находившимся в стране, семена и припасы, чтобы они засеяли землю на восьмой год, потому что река разлилась по всей земле Египта.
  rationale: 'Внесены только стилистически и семантически безопасные уточнения: определительный оборот приведён ближе к значению «которые были в стране», а географическое обозначение сделано современнее. «На восьмой год» сохранено как точная передача геэзского числительного и как согласующееся с контекстом время после семилетнего голода.'
