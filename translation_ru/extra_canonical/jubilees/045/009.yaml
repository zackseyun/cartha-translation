  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: ru
  text: И окончились годы голода, и Иосиф дал людям, находившимся в стране, семена и припасы, чтобы они засеяли землю на восьмой год, потому что река разлилась по всей земле Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአሕዛብ፡ ዘውስተ፡ ምድረ
  choice: народам, жившим в стране
  rationale: Передаёт множественное አሕዛብ («народы, люди») и определяющий оборот «которые в стране», не сводя его без основания к единственному числу.
- source_word: ዘርአ፡ ወሲሳተ
  choice: семена и припасы
  rationale: 'Сохраняет два однородных понятия: посевной материал и предоставленные для жизни средства/припасы.'
- source_word: በሳምን፡ ዓመት
  choice: на восьмой год
  rationale: Геэзское ሳምን означает «восьмой»; это также согласуется с годом, следующим за завершившимися годами голода.
- source_word: መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: река разлилась по всей земле Египетской
  rationale: В контексте Нила сочетание глагола «наполнять» с предлогом направления/поверхности естественно обозначает разлив реки по земле.
