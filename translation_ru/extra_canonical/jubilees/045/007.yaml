  text: And Joseph sustained his father and his brothers, and all their livestock, as was sufficient for them during the seven years of famine.
translation:
  language: ru
  text: Иосиф обеспечивал пропитанием своего отца, братьев и весь их скот в достаточной мере на протяжении семи лет голода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሴሰዮሙ
  choice: содержал… давая им достаточно пищи
  rationale: Глагол выражает кормление и обеспечение пропитанием; сочетание естественно по-русски передаёт единое действие, распространяющееся на отца, братьев и скот.
- source_word: ጥሪቶሙ
  choice: весь их скот
  rationale: В данном контексте слово обозначает домашний скот, который также требовалось кормить во время голода, а не абстрактно всё имущество.
- source_word: በከመ፡ የአክሎሙ
  choice: давая им достаточно пищи
  rationale: Передаёт меру обеспечения — столько, сколько было им достаточно, — не утверждая избыточного снабжения.
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: в течение семи лет голода
  rationale: Прямо и естественно передаёт временной оборот и период голода.
