lexical_decisions:
- source_word: ወቦአ፡ እስራኤል
  choice: И вошёл Израиль
  rationale: Глагол ቦአ передаёт вхождение; единственное число сохранено, поскольку Израиль представлен как собирательное имя народа.
- source_word: ውስተ፡ ብሔረ፡ ግብጽ
  choice: в землю Египетскую
  rationale: ውስተ выражает движение внутрь, а ብሔር в данном географическом контексте естественно передаётся словом «земля».
- source_word: ውስተ፡ ምድረ፡ ጌሤም
  choice: в землю Гесем
  rationale: Сохранено повторное указание места; традиционная русская форма топонима — «Гесем».
- source_word: አመ፡ ሠርቀ፡ ወርኅ
  choice: в новолуние
  rationale: Выражение буквально связано с появлением/восходом луны и в календарном контексте обозначает начало месяца, то есть новолуние.
