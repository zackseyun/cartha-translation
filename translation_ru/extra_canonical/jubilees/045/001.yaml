  verdict: revise
  source_fidelity: 'В представленном геэзском тексте имеется временное выражение «когда взошла луна» (календарно: при новолунии), но отсутствуют слова «четвёртого месяца». Поэтому добавление «четвёртого месяца» не подтверждается указанным оригинальным текстом, хотя оно присутствует в английской аудиторской версии.'
  naturalness: «В землю Египетскую» имеет намеренно архаизующий оттенок и менее соответствует заявленному современному литературному регистру. «В землю Египта» естественно и точно. «При новолунии» кратко и литературно передаёт календарное значение выражения.
  terminology: «Израиль» как собирательное имя и традиционная форма топонима «Гесем» сохранены. Повтор предлога и географического уточнения сохранён в соответствии с оригиналом.
  issues:
