    issue: Добавлено «четвёртого месяца».
    rationale: Ни числительное «четвёртый», ни слово «месяц» в смысле датировки четвёртого месяца не содержатся в приведённом геэзском тексте. Английский audit trail не может перевесить непосредственно представленный исходный текст без документированного текстологического основания.
  - severity: low
    issue: Архаизующая форма «Египетскую».
    rationale: Форма не ошибочна, но для современного литературного русского предпочтительно «землю Египта».
  revised_text: И вошёл Израиль в землю Египта, в землю Гесем, при новолунии.
