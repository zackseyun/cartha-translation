  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: ru
  text: Перед смертью Израиль благословил своих сыновей и рассказал им обо всём, что произойдёт с ними в земле Египетской, а также открыл им, что постигнет их в последние дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘእንበለ፡ ይሙት
  choice: перед смертью
  rationale: 'Естественно передаёт временное значение: прежде чем он умер.'
- source_word: በደኃሪ፡ መዋዕል
  choice: в последние дни
  rationale: Устойчивое и понятное библейское выражение для буквального «в последующие/позднейшие дни», без уточнения их длительности или эсхатологического содержания.
- source_word: ይመጽእ፡ ላዕሌሆሙ
  choice: постигнет их
  rationale: Идиоматично передаёт буквальное «придёт на них» и сохраняет смысл грядущих событий.
- source_word: እይድያሙ
  choice: открыл им
  rationale: Следует принятому исправлению ошибочной транскрипции как формы со значением «дал им знать»; по-русски «открыл им» естественно выражает сообщение о будущем.
theological_decisions:
- issue: Значение выражения «последние дни»
  choice: Сохранено «в последние дни» без толкования.
  alternative: «впоследствии» или «в грядущие времена»
  rationale: Формулировка источника допускает библейско-эсхатологический оттенок, но не требует его догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Имя «Израиль» сохранено как в источнике; «земля Египетская» выбрано как ясная и традиционно звучащая географическая формула. Параллельные глаголы «рассказал» и «открыл» отражают две части исходной фразы.
