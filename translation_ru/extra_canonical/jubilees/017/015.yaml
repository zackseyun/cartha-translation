base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/015.yaml
  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: ru
  text: 'Когда Я позвал его.[a] И было так: в седьмую седмину, в первый год, в первый месяц этого юбилея, в двенадцатый день этого месяца, на небесах прозвучали слова об Аврааме — что он верен во всём, что сказал, любит Господа и остаётся верным во всяком испытании.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда я позвал его».'
    reason: Прописная буква в местоимении отражает контекстуальное понимание говорящего как Бога, но в древнем тексте регистр букв этого не обозначает.
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: Я позвал его
  rationale: Форма глагола имеет первое лицо единственного числа с объектным суффиксом третьего лица; перевод сохраняет лицо и число.
- source_word: ሱባዔ፡ ሳብዕ
  choice: седьмую седмину
  rationale: Сохраняет характерную для книги хронологическую единицу — период из семи лет — и отличает её от юбилея.
- source_word: ኮነ፡ ቃላት፡ በሰማያት
  choice: на небесах прозвучали слова
  rationale: Естественно передаёт буквальное «были/возникли слова на небесах», не уточняя без основания, кто именно говорил.
- source_word: መሃይምን / ምእመነ
  choice: верен / остаётся верным
  rationale: Повтор одного смыслового корня сохранён, поскольку он обрамляет речь Авраама и его поведение в испытаниях.
- source_word: ምንዳቤ
  choice: испытание
  rationale: По контексту обозначает испытание или проверку верности; «испытание» сохраняет эту смысловую связь.
theological_decisions:
- issue: Говорящий в начальной фразе
  choice: «Когда Я позвал его» с прописной буквой в местоимении
  alternative: «Когда я позвал его»
  rationale: Первое лицо грамматически ясно, а ближайший контекст повествования предполагает речь Бога; прописная буква соответствует русской библейской издательской традиции, не добавляя имени говорящего.
- issue: Небесное свидетельство об Аврааме
  choice: «на небесах прозвучали слова об Аврааме»
  alternative: «на небесах было сказано об Аврааме»
  rationale: Выбранная формулировка не вводит не названного источником деятеля и сохраняет необычную конструкцию оригинала.
- issue: Верность «во всём, что говорит»
  choice: сохранить отнесение верности к словам Авраама
  alternative: истолковать как послушание всему сказанному ему
  rationale: Эфиопский текст формально говорит о том, что говорит сам Авраам; богословски более привычное прочтение не следует подставлять без текстового основания.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» сохранён как точное и компактное обозначение семилетнего периода; синтаксис упрощён настолько, чтобы длинная хронологическая фраза оставалась понятной.
