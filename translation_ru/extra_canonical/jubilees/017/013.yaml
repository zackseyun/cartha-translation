translation:
  language: ru
  text: своего ребёнка.[a] Она встала и пошла по направлению к пустыне Фаран. Ребёнок вырос и стал стрелком из лука. Господь был с ним, и мать взяла ему в жёны одну из дочерей Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова «своего ребёнка», вероятно, завершают предложение предыдущего стиха.
    reason: Границы стихов рассекают синтаксическую конструкцию; примечание предупреждает читателя о фрагментарном начале стиха.
lexical_decisions:
- source_word: ሕፃና
  choice: своего ребёнка
  rationale: Форма с местоименным суффиксом означает «её ребёнка» и, вероятно, завершает синтаксическую конструкцию предыдущего стиха; по-русски в данном контексте естественно «своего ребёнка».
- source_word: መንገለ
  choice: по направлению к
  rationale: Передаёт направительное значение «к, по направлению к», не подменяя его значением пребывания «в».
- source_word: በድው፡ ፍራም
  choice: пустыне Фаран
  rationale: Традиционная русская форма географического названия; выражение обозначает пустыню Фаран.
- source_word: ወአሀቀ፡ ሕፃን
  choice: Ребёнок вырос
  rationale: Глагол передаёт рост ребёнка; это отдельная последующая фраза, в отличие от начального ሕፃና.
- source_word: ነዳፌ
  choice: стрелком из лука
  rationale: Обозначает лучника; развёрнутая русская формулировка ясна современному читателю и соответствует контексту.
- source_word: እምአዋልደ፡ ግብጽ
  choice: одну из дочерей Египта
  rationale: Сохраняет буквальный коллективно-родовой оборот источника без замены на более интерпретирующее «египтянку».
theological_decisions:
- issue: Присутствие Господа с Измаилом
  choice: Господь был с ним
  alternative: Бог был с ним
  rationale: Источник употребляет እግዚአብሔር, обычно соответствующее титулу «Господь»; прямое утверждение сохранено без богословского ослабления.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Фрагментарное начало сохранено ради соответствия данной стиховой разбивке и снабжено пояснением; направление движения и последовательность действий переданы без сглаживания.
