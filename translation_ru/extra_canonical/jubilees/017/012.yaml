translation:
  language: ru
  text: И Он открыл ей глаза, и она увидела колодец с водой. Она пошла, наполнила бурдюк водой и дала ему напиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ፡
  choice: И Он открыл ей глаза
  rationale: Глагол ወከሠተ стоит в форме 3-го лица мужского рода единственного числа, поэтому подразумеваемый субъект — Бог; суффикс в አዕይንቲሃ означает «её», а по-русски естественно «открыл ей глаза».
- source_word: ዐዘቅተ፡ ማይ፡
  choice: колодец с водой
  rationale: Сочетание обозначает водный колодец; выбран естественный русский оборот без избыточного уточнения.
- source_word: ዝቃ፡
  choice: бурдюк
  rationale: Речь идёт о переносном кожаном сосуде для воды; «бурдюк» точно и понятно передаёт предмет в данном повествовательном контексте.
- source_word: ወአስተየቶ፡
  choice: и дала ему напиться
  rationale: Каузативная форма выражает действие «напоить / дать пить» с мужским объектным суффиксом; русский оборот сохраняет смысл и звучит естественно.
theological_decisions:
- issue: Подразумеваемый субъект первого глагола
  choice: «Он» с прописной буквы, то есть Бог
  alternative: «она открыла глаза»
  rationale: Мужская форма ወከሠተ отличается от последующих явно женских глагольных форм и указывает на Бога как на подразумеваемого деятеля; это также соответствует контексту эпизода, однако имя Бога не добавлено в основной текст.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным синтаксисом. Цепочка геэзских союзов передана двумя предложениями для естественной русской ритмики; последовательность действий полностью сохранена.
