  text: And the Lord said to him, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your beloved son whom you love, Isaac, and go into the high land, and offer him there on one of the mountains that I will show you.” And he rose early in the morning and saddled his donkey and took two of his young servants with him, and Isaac his son; and he split the wood of the offering and went to the place on the third day, and he saw the place from afar. And he came to a well of water, and he said to his young servants, “Stay here with the donkey, and I and the boy will go on, and when we have worshiped we will return to you.” And he took the wood of the sacrifice and laid it on Isaac his son, and he took in his hand the fire and the knife. And the two of them went together to that place.
translation:
  language: ru
  text: И он вспомнил слово, сказанное ему в тот день, когда Лот отделился от него, и обрадовался, потому что Господь дал ему потомство на земле, чтобы оно унаследовало землю. И он благословил Творца всеми своими устами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленная строка геэзского источника обозначена как позиционно соответствующая стиху 3 и не совпадает по содержанию с приложенным английским текстом, рассказывающим о повелении принести Исаака в жертву. Перевод выполнен по предоставленной строке на геэзе.
    reason: Зафиксировать расхождение нумерации и содержания источников, не подменяя оригинальный текст английским консультационным слоем.
lexical_decisions:
- source_word: ዘርአ
  choice: потомство
  rationale: В данном контексте слово означает не отдельное «семя», а дарованную Богом линию потомков.
- source_word: ይረሳ፡ ለምድር
  choice: чтобы оно унаследовало землю
  rationale: Передаёт целевую конструкцию и различает потомство как наследника и землю как объект наследования.
- source_word: በኵሉ፡ አፉሁ
  choice: от всего сердца
  rationale: Буквально «всеми своими устами»; русская идиома естественно выражает искреннюю и полную хвалу, не сводя выражение к физиологической детали.
- source_word: ለፈጣሪ
  choice: Творца
  rationale: Сохраняет божественный титул исходного текста и его определённое референтное значение.
theological_decisions:
- issue: Кто вспоминает и радуется
  choice: Сохранён подразумеваемый мужской субъект («он»), которым в контексте является Авраам
  alternative: Явно назвать Авраама
  rationale: В исходной строке имя субъекта не повторено; местоименная передача сохраняет связность и не добавляет отсутствующее имя.
- issue: Отношение Божьего дара к наследованию земли
  choice: Потомство дано с целью унаследовать землю
  alternative: Авраам получил потомство и сам должен унаследовать землю
  rationale: Грамматическое продолжение естественнее связывает действие наследования с дарованным потомством; при этом формулировка не уточняет сроки и способ исполнения обещания.
translation_notes:
  register: Современный литературный русский язык; повествование выдержано в ясном и dignified библейском регистре без архаизмов. Структура и богословская напряжённость обещания сохранены, а не согласованы с несовпадающим английским текстом.
