  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: ru
  text: 'Она отошла на расстояние выстрела из лука[a], потому что сказала: «Не хочу видеть смерть моего ребёнка», — и, сев, заплакала. И ангел Божий, один из святых, сказал ей: «О чём ты плачешь, Агарь? Встань, возьми ребёнка и поддержи его своей рукой, потому что Бог услышал твой голос и увидел ребёнка».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на один выстрел из лука».'
    reason: Поясняет конкретную меру расстояния, сохранённую в естественной русской формулировке.
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ
  choice: на расстояние выстрела из лука
  rationale: Буквально обозначает один выстрел из лука как меру расстояния; сохраняет конкретность текста и связь с Быт. 21:16.
- source_word: ሕፃን / ኅፃን
  choice: ребёнок
  rationale: Естественный современный русский эквивалент, уместный в обоих вхождениях.
- source_word: አሐዱ፡ እምቅዱሳን
  choice: один из святых
  rationale: Формально передаёт выражение источника, не отождествляя эту группу с какой-либо более узкой категорией.
- source_word: አንዝዮ፡ በእዴኪ
  choice: держи его на руках
  rationale: Идиоматически передаёт повеление взять и поддерживать ребёнка рукой; буквальное «поддержи его своей рукой» по-русски звучит неестественно.
- source_word: ርእዮ፡ ለሕፃን
  choice: увидел ребёнка
  rationale: Сохраняет прямое значение глагола «видеть», не заменяя его толкованием «позаботился».
theological_decisions:
- issue: Статус небесного вестника
  choice: ангел Божий, один из святых
  alternative: один из святых ангелов Божьих
  rationale: Выбранная формулировка сохраняет синтаксическое приложение и возможную смысловую широту исходного выражения.
- issue: Смысл того, что Бог «увидел» ребёнка
  choice: увидел ребёнка
  alternative: обратил внимание на ребёнка
  rationale: Сохранено конкретное и богословски напряжённое свидетельство источника без разъясняющей подмены.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Устранено заимствованное из параллели Бытия выражение «напротив него», отсутствующее в данном геэзском тексте. Прямая речь оформлена естественно, без архаизации.
