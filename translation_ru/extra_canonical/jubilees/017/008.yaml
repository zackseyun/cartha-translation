  text: I will make him into a great nation, because he is from your seed. And Abraham rose early in the morning,
translation:
  language: ru
  text: Я произведу от него великий народ, потому что он — от твоего семени. И встал Авраам рано утром.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስዮ
  choice: Я произведу от него великий народ
  rationale: Конструкция ውስተ с ረሰየ выражает превращение или произведение во что-либо, а имперфект እሬስዮ передаёт будущее действие. Русское «произведу от него великий народ» естественно передаёт смысл, не создавая неуклюжего впечатления, будто один человек буквально станет народом.
- source_word: እስመ፡ እምዘርእከ፡ ውእቱ
  choice: потому что он — от твоего семени
  rationale: Сохранён образ «семени» (ዘርእ), важный для библейской родословной лексики; оборот означает происхождение от адресата.
- source_word: ወነገሀ፡ አብርሃም፡ በነግህ
  choice: И встал Авраам рано утром
  rationale: Повтор корня, связанного с утром, естественно передан устойчивым русским оборотом «встал рано утром».
theological_decisions:
- issue: Обетование о великом народе
  choice: 'Сохранено как обещание будущего: «произведу от него великий народ»'
  alternative: «Среди великого народа Я возвеличил его»
  rationale: Форма እሬስዮ является имперфектом, а ዐቢይ грамматически относится к ሕዝብ; поэтому речь идёт о будущем произведении великого народа, а не о прошлом возвеличивании человека.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Семя» сохранено как значимый образ, тогда как синтаксис первой фразы сделан естественным для современного читателя.
