revisions:
- from: И он взял хлеб и мех с водой, возложил их на плечо Агари, а также ребёнка[a], и отпустил её. Она пошла и стала блуждать по пустыне Вирсавии. Вода в мехе кончилась; ребёнка мучила жажда, он не мог больше идти и упал.
  to: И он взял хлеб и мех с водой, возложил их на плечо Агари и передал ей ребёнка[a], а затем отпустил её. Она пошла и стала блуждать по пустыне Вирсавии. Вода в мехе кончилась; ребёнок мучился от жажды, не мог идти и упал.
  rationale: Перестроена первая фраза, чтобы сохранить подтверждённое значение глагола «возложить / дать нести» и женское «отпустил её», но устранить неграмматичное присоединение ребёнка к ноше на плече. Формулировка «передал ей ребёнка» — минимальное естественное русское раскрытие координации, а буквальная напряжённость и возможное альтернативное понимание вынесены в сноску. Удалено невыраженное в источнике «больше».
