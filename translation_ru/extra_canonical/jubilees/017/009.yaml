    text: 'Буквально: «возложил на Агарь и на ребёнка»; синтаксическая связь слов не вполне ясна. Возможно: «дал хлеб и воду Агари и ребёнку».'
    reason: Передаёт трудную синтаксическую связь геэзского текста и фиксирует традиционное альтернативное понимание, не устраняя неоднозначность догматическим или излишне конкретным толкованием.
lexical_decisions:
- source_word: ዝቀ፡ ማይ (ziqa māy)
  choice: мех с водой
  rationale: Обозначает кожаный сосуд для воды; «мех» точно и естественно передаёт предмет в библейском повествовании.
- source_word: አስከማ (ʾaskamā)
  choice: возложил … на плечо
  rationale: Каузативный глагол выражает действие «положить на плечо / заставить нести», а не просто «дать».
- source_word: ፈነዋ (fanawā)
  choice: отпустил её
  rationale: Объектный суффикс женского рода единственного числа указывает на Агарь.
- source_word: ተንገገ (tannagaga)
  choice: стала блуждать
  rationale: Передаёт бесцельное странствие или блуждание в пустыне.
- source_word: ተፈጸመ፡ ማይ (tafaṣṣama māy)
  choice: вода … кончилась
  rationale: Буквально вода «завершилась/иссякла»; современное русское «кончилась» естественно в данном контексте.
- source_word: ስእነ፡ ሐዊረ (səʾna ḥawira)
  choice: не мог больше идти
  rationale: Передаёт неспособность ребёнка продолжать путь; «больше» естественно раскрывает контекст наступившего изнеможения.
theological_decisions:
- issue: Кому были переданы хлеб, вода и ребёнок
  choice: 'Сохранить основное чтение: хлеб и мех были возложены на плечо Агари, вместе с упоминанием ребёнка'
  alternative: «дал их Агари и ребёнку»
  rationale: Форма глагола точнее указывает на возложение ноши на плечо, однако синтаксическая связь слов «и ребёнка» остаётся несколько неоднозначной; это отмечено в сноске без искусственного устранения напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены короткие последовательные фразы оригинала; форма «Вирсавия» выбрана как укоренившееся русское библейское название Беэр-Шевы.
