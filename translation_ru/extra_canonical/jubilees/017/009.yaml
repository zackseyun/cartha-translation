  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: ru
  text: И он взял хлеб и мех с водой, возложил их на плечо Агари и передал ей ребёнка[a], а затем отпустил её. Она пошла и стала блуждать по пустыне Вирсавии. Вода в мехе кончилась; ребёнок мучился от жажды, не мог идти и упал.
  philosophy: optimal-equivalence
  footnotes:
