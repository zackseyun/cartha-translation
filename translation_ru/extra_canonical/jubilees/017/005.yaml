  text: …and her son, for the son of this servant woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: ru
  text: «…и её сына,[a] потому что сын этой рабыни не будет наследником вместе с моим сыном Исааком». Это было очень тяжело для Авраама из-за его служанки и из-за его сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха продолжает повеление из предыдущего стиха: изгнать служанку «и её сына».'
    reason: Стих начинается с зависимого фрагмента, который без контекста может показаться грамматически неполным.
lexical_decisions:
- source_word: ወወልዳ፡ እስመ፡
  choice: …и её сына, потому что
  rationale: Сохраняет начальные слова геэзского текста как продолжение повеления из предыдущего стиха; многоточие ясно обозначает синтаксическую зависимость от предшествующего контекста.
- source_word: ኢይወርስ፡
  choice: не будет наследником
  rationale: Передаёт отрицание и значение наследования, не уточняя долю или юридический механизм наследства.
- source_word: ለዛ፡ ወሰት፡
  choice: этой рабыни
  rationale: Сохраняет указательное значение и социальный статус женщины, выраженные в оригинале.
- source_word: ምስለ፡ ወልድየ፡ ይስሐቅ፡
  choice: вместе с моим сыном Исааком
  rationale: Естественно передаёт совместность, выраженную ምስለ, и сохраняет прямую речь Сарры.
- source_word: ወማኅዘነ፡ ውእቱ፡ ቃል፡ በቅድመ፡ አዕይንተ፡ አብርሃም፡
  choice: Эти слова очень огорчили Авраама
  rationale: Идиоматически передаёт буквальную конструкцию «слово было тяжким/горестным перед глазами Авраама», сохраняя силу переживания.
- source_word: በእንተ፡ አመቱ፡ ወበእንተ፡ ወልዱ፡
  choice: из-за его служанки и сына
  rationale: Сохраняет повторную причинную конструкцию и различие между более жёстким обозначением «рабыня» в речи Сарры и обозначением «служанка» в повествовании.
theological_decisions:
- issue: Характер совместного наследования Измаила и Исаака
  choice: «не будет наследником вместе с моим сыном Исааком»
  alternative: «не разделит наследство с моим сыном Исааком»
  rationale: Выбранный вариант ближе к форме оригинала и не вводит отсутствующего уточнения о разделе наследственной доли.
- issue: Причина огорчения Авраама
  choice: «из-за его служанки и сына»
  alternative: «из-за сына своей служанки»
  rationale: Оригинал называет служанку и сына двумя параллельными объектами переживания; их нельзя сводить к одной составной характеристике.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прямая речь сохраняет резкость формулировки Сарры; повествовательная часть звучит естественно и не сглаживает двойную причину огорчения Авраама.
