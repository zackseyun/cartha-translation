  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: ru
  text: 'И увидела Сарра, что Измаил шутит и пляшет, а Авраам радуется великой радостью. Тогда она почувствовала ревность к Измаилу и сказала Аврааму: «Прогони эту рабыню[a] и её сына».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанку».'
    reason: Основной текст передаёт зависимый статус женщины словом «рабыня»; вариант «служанка» возможен как более мягкое, но менее точное по социальному статусу соответствие.
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: шутит и пляшет
  rationale: Передаёт два однородных действия исходного текста, не сводя их к более неоднозначному «играет».
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: радуется великой радостью
  rationale: Сохраняет эмфатическую внутреннюю конструкцию источника и его торжественный библейский ритм.
- source_word: ወቀንአት፡ ለይስማዔል
  choice: стала ревновать к Измаилу
  rationale: Сохраняет направленность чувства на Измаила и не подменяет её более узким толкованием «позавидовала».
- source_word: ዛተ፡ ወሰተ
  choice: эту служанку
  rationale: С учётом критического восстановления и контекста Быт 21:10 обозначение указывает на зависимый социальный статус женщины; «служанка» естественно и точно передаёт это по-русски.
theological_decisions:
- issue: Характер поведения Измаила
  choice: шутит и пляшет
  alternative: насмехается / играет
  rationale: Источник перечисляет действия без явной оценки; перевод не привносит мотив издевательства и сохраняет отличие данного чтения от иных форм повествования.
- issue: Чувство Сарры к Измаилу
  choice: ревновать к Измаилу
  alternative: завидовать Измаилу
  rationale: «Ревновать» оставляет открытым оттенок соперничества или ревности и не сужает смысл до зависти.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; повтор «радуется великой радостью» намеренно сохранён как эмфатическая особенность источника.
