  yaml_path: translation/extra_canonical/jubilees/017/003.yaml
  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: ru
  text: И он вспомнил слово Господа, сказанное ему в тот день, когда Лот отделился от него, и обрадовался, потому что Господь дал ему потомство на земле, чтобы оно унаследовало землю. И он от всего сердца благословил Творца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃሎ፡ ዘተናገሮ፡
  choice: слово Господа, сказанное ему
  rationale: ቃል стоит в единственном числе, а притяжательный и объектный суффиксы передают смысл «Его слово, которое Он сказал ему». Указание на Господа делает отношения участников ясными по контексту, не превращая «слово» во множественное число.
- source_word: ዘርአ፡
  choice: потомство
  rationale: В данном контексте «семя» обозначает дарованных Аврааму потомков; современное русское «потомство» естественно передаёт собирательное значение.
- source_word: ከመ፡ ይረሳ፡ ለምድር፡
  choice: чтобы оно унаследовало землю
  rationale: Глагол от ወረሰ означает «наследовать». Местоимение «оно» согласовано с собирательным существительным «потомство» и сохраняет целевую конструкцию источника.
- source_word: በኵሉ፡ አፉሁ፡
  choice: всеми устами своими
  rationale: Сохранён яркий буквальный семитизм «всеми устами», выражающий полноту хвалы; замена на «от всего сердца» изменила бы образ источника.
- source_word: ለፈጣሪ፡
  choice: Творца
  rationale: Титул передан прямым и традиционно понятным русским соответствием.
theological_decisions:
- issue: Кто произнёс вспоминаемое слово
  choice: Господь
  alternative: «Его слово, которое Он сказал ему»
  rationale: Притяжательная и объектная формы указывают на слово, сказанное Аврааму другим лицом; контекст обещания после отделения Лота отождествляет говорящего с Господом. Эксплицирование имени в русском устраняет неестественную местоименную двусмысленность, не добавляя нового содержания.
- issue: Кто наследует землю
  choice: потомство Авраама
  alternative: сам Авраам
  rationale: Ближайший грамматический предшественник — «потомство»; русский перевод сохраняет эту связь. При этом собирательное единственное число не уточняется как отдельный потомок или множество потомков.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис упрощён до двух предложений ради ясности, тогда как образ «всеми устами своими» намеренно сохранён как торжественная формула источника.
