  text: And his mother took him and cast him under an olive tree, and she went and sat opposite, at a distance.
translation:
  language: ru
  text: И мать взяла его и бросила под масличное дерево[a], затем отошла и села напротив, поодаль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под одним масличным деревом».'
    reason: Сохраняет возможность понимать አሐቲ как собственно числительное «одно», хотя здесь оно, вероятно, служит показателем неопределённости.
lexical_decisions:
- source_word: ወገደፈቶ (wa-gadafato)
  choice: оставила его
  rationale: Глагол может означать «бросить, оставить». В данном контексте естественное русское «оставила» передаёт действие без излишне резкого оттенка, но сохраняет смысл удаления матери от ребёнка.
- source_word: ታኅተ፡ አሐቲ፡ እልያስ (taḥta aḥati ʾəlyās)
  choice: под масличным деревом
  rationale: Числительное «одно» в геэз способно выполнять функцию показателя неопределённости; по-русски это естественно передаётся без числительного.
- source_word: አንጻር፡ መጠነ (ʾanṣāra matana)
  choice: напротив, поодаль
  rationale: Передаёт пространственные значения положения напротив и на некотором расстоянии, не уточняя не названную источником меру.
