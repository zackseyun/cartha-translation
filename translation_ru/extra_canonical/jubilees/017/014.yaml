  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
translation:
  language: ru
  text: 'И она родила ему сына, и он назвал его Наваиофом, потому что она сказала: «Господь близок ко мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: И она родила ему сына
  rationale: Сохранены женский субъект глагола «родила», дательный смысл «ему» и прямое значение «сына».
- source_word: ወጸውዐ፡ ስሞ፡ ናቤዮት
  choice: и он назвал его Навиофом
  rationale: 'Мужская форма глагола указывает на смену субъекта: имя ребёнку дал он. Оборот естественно передан по-русски без буквального «назвал его имя»; имя транслитерировано в принятой русской библейской форме.'
- source_word: እስመ፡ ትቤ
  choice: потому что она сказала
  rationale: Переданы причинный союз и явно выраженный женский субъект речи.
- source_word: ቅሩብ፡ እግዚአብሔር፡ ሊተ
  choice: Господь близок ко мне
  rationale: Сохранены предикативное значение «близок/близ» и личная направленность выражения «ко мне».
theological_decisions:
- issue: Смысл близости Господа
  choice: «Господь близок ко мне»
  alternative: «Господь приблизился ко мне»
  rationale: Источник выражает состояние близости, а не обязательно действие приближения; перевод не уточняет характер этой близости сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Различие субъектов сохранено: она родила и сказала, он дал имя.'
