  text: Ибо в Исааке тебе будет наречено имя и потомство. А что до сына этой рабыни…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በይስሐቅ
  choice: в Исааке
  rationale: Сохраняет исходный предлог и формулировку, перекликающуюся с традицией Быт. 21:12, не заменяя её более толковательным оборотом «через Исаака».
- source_word: ይጼዋዕ
  choice: будут наречены
  rationale: Передаёт значение «называть, нарекать, призывать»; множественное число согласовано с составным подлежащим «имя и потомство».
- source_word: ስም፡ ወዘርእ
  choice: имя и потомство
  rationale: Сохраняет оба существительных источника. «Потомство» естественно передаёт собирательное «семя» применительно к потомкам, тогда как буквальное «имя» оставлено без устранения возможной смысловой напряжённости.
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: сына этой рабыни
  rationale: Передаёт родственную конструкцию как «сын этой рабыни»; «рабыня» соответствует зависимому положению женщины и звучит естественно в данном библейском контексте.
theological_decisions:
- issue: Соотношение имени и потомства с Исааком
  choice: Сохранить формулу «в Исааке» и оба понятия — «имя и потомство»
  alternative: 'Передать толковательно: «через Исаака продолжится твой род»'
  rationale: Источник выражается необычно и допускает смысловую многослойность; перевод не должен сводить её только к биологическому продолжению рода.
- issue: Незавершённость заключительной фразы
  choice: Сохранить обрыв фразы с многоточием
  alternative: Дополнить обещанием о сыне рабыни из последующего контекста
  rationale: Предоставленный текст заканчивается вводным оборотом; добавление отсутствующего материала вышло бы за пределы источника данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Необычная формула «тебе будут наречены имя и потомство» сохранена ради близости к гээзскому тексту; концовка намеренно оставлена незавершённой.
