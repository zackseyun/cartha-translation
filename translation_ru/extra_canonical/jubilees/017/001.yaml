base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: ru
  text: 'И Господь знал, что Авраам верен во всех своих испытаниях, потому что испытывал его в его земле и голодом, испытывал его богатством царей, а затем — через его жену, когда её забрали, и через обрезание; испытывал его через Измаила и через Агарь, его служанку, когда отослал их. Во всём, чем Он испытывал его, Авраам оказался верен: душа его не проявила нетерпения, и он не медлил действовать, потому что был верен и любил Господа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንዳቤሁ
  choice: своих испытаниях
  rationale: Контекст определяется повторяющимся глаголом «испытывать»; «испытания» естественно передаёт пережитые Авраамом проверки, не сужая смысл до страданий.
- source_word: በምድሩ
  choice: в его земле
  rationale: Сохранён конкретный образ земли/страны Авраама без излишнего уточнения.
- source_word: በዐባር
  choice: голодом
  rationale: Инструментальная конструкция по-русски естественно передаёт испытание посредством голода.
- source_word: በብዕለ፡ ነገሥት
  choice: богатством царей
  rationale: Формально сохраняется необычная исходная формулировка, не заменяемая толкованием конкретного эпизода.
- source_word: አመቱ
  choice: его служанку
  rationale: Передаёт статус Агари в отношении Авраама современным нейтральным словом; «рабыня» было бы возможным, но стилистически более жёстким вариантом.
- source_word: ኢተአገተት፡ ነፍሱ
  choice: душа его не проявила нетерпения
  rationale: Сохранены и семитская антропологическая формула «душа его», и смысл отсутствия нетерпения.
- source_word: ኢጐንደየ፡ ገቢሮተ
  choice: не медлил исполнить должное
  rationale: Передаёт отсутствие промедления в действии; «должное» делает непереходное русское выражение естественным, не определяя сверх текста конкретное повеление.
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: любил Господа
  rationale: Естественная русская предикация передаёт характеристику «любящий Господа», избегая тяжеловесного субстантивированного оборота.
theological_decisions:
- issue: Субъект повторных испытаний в заключительном предложении
  choice: «чем Господь испытывал Авраама»
  alternative: «чем он испытывал его»
  rationale: Имена восстанавливают референты местоимений для ясности русского текста, не меняя богословского утверждения о Господе как испытывающем.
- issue: Характер верности Авраама
  choice: «оказался верен»
  alternative: «был найден верным»
  rationale: Русское идиоматическое выражение сохраняет смысл подтверждённой испытаниями верности, не вводя идеи безошибочности или совершенства.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксический параллелизм повторяющегося «испытал» сохранён, но длинная фраза умеренно расчленена для ясности. Имена Агарь и Измаил даны в общепринятой русской библейской форме.
