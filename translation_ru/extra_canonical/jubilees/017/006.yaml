  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the servant woman. Whatever Sarah says to you, listen to her voice and do it.”
translation:
  language: ru
  text: 'чтобы он отослал их от себя.[a] И сказал Господь Аврааму: «Не огорчайся из-за мальчика и из-за рабыни. Во всём, что скажет тебе Сарра, послушайся её и поступи так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он отослал их от себя».'
    reason: Фиксирует прежнее понимание формы как самостоятельного повествовательного высказывания, хотя грамматика и контекст предпочтительно указывают на продолжение мысли предыдущего стиха.
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: чтобы он отослал их от себя
  rationale: Сослагательно-зависимая форма продолжает мысль предыдущего стиха; русский придаточный оборот передаёт эту синтаксическую связь и не превращает действие в уже совершившееся.
- source_word: ሐዘን፡ ቅድመ፡ አዕይንቲከ
  choice: Не огорчайся
  rationale: Естественная современная передача идиомы «пусть не будет печали перед твоими глазами» без утраты её эмоционального смысла.
- source_word: ወለት
  choice: рабыня
  rationale: В данном контексте слово обозначает Агарь как несвободную женщину; «рабыня» точно и ясно передаёт её положение.
- source_word: ስማዕ፡ ቃለ፡ ወግበር
  choice: послушайся её и поступи так
  rationale: Передаёт не просто слышание голоса, а требуемое повиновение словам Сарры и соответствующее действие.
