  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: ru
  text: И дам тебе и твоему потомству после тебя землю, где ты жил как пришелец, — землю Ханаан — во владение навеки; и буду им Богом».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: твоему потомству
  rationale: Собирательное «потомство» естественно передаёт значение «семя, потомки» и согласуется с последующим местоимением во множественном числе.
- source_word: ኀበ፡ ፈለስከ
  choice: где ты жил как пришелец
  rationale: Глагол указывает на проживание в чужой земле; выражение сохраняет смысл временного пребывания без права коренного владения.
- source_word: ዘትኳን
  choice: во владение навеки
  rationale: Передаёт сочетание идеи владения/удела и неограниченной длительности; формулировка естественна для современного литературного русского.
- source_word: አምላከ
  choice: Богом
  rationale: В составе формулы завета «буду им Богом» существительное естественно ставится в творительном падеже.
theological_decisions:
- issue: Согласование собирательного «потомство» с местоименным суффиксом множественного числа в ወእከውኖሙ
  choice: «твоему потомству» ... «буду им Богом»
  alternative: «твоим потомкам» ... «буду их Богом»
  rationale: Сохраняется традиционная и исходно значимая метафора семени/потомства, а множественное «им» отражает понимание потомства как множества лиц.
- issue: Формула Божьего отношения к потомству
  choice: «буду им Богом»
  alternative: «стану их Богом»
  rationale: «Буду им Богом» ближе к формальной структуре источника и не добавляет оттенка изменения статуса, возможного у глагола «стану».
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сделан ясным и плавным; архаизмы вроде «семени твоему» и «пришельствовал» исключены. Кавычка в конце сохранена как указание на завершение прямой речи в более широком контексте.
