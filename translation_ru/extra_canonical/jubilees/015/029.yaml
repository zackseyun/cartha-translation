lexical_decisions:
- source_word: ትእዛዝ
  choice: заповедь
  rationale: Передаёт религиозно-правовой смысл повеления естественным и традиционным для русского библейского текста словом.
- source_word: ተሠርዐ
  choice: была установлена
  rationale: Отражает значение назначения или установления без излишне канцелярского оттенка.
- source_word: ለኪዳን
  choice: как завет
  rationale: Сохраняет прямую связь заповеди с заветом и не уточняет характер этой связи сверх исходного текста.
- source_word: ይዕቀብዎ
  choice: соблюдали её
  rationale: В контексте заповеди глагол охраны или хранения естественно передаётся как «соблюдать».
- source_word: ለዓለም
  choice: вовеки
  rationale: Кратко и достойно передаёт идею вечного, непрестанного соблюдения.
- source_word: ኵሎሙ፡ ደቂቀ፡ እስራኤል
  choice: все сыны Израиля
  rationale: Сохраняет коллективное обозначение народа и библейский регистр исходного выражения.
theological_decisions:
- issue: Соотношение заповеди и завета
  choice: «заповедь была установлена как завет»
  alternative: «заповедь была установлена для завета»
  rationale: Формулировка сохраняет засвидетельствованное английским консультационным слоем понимание геэзского оборота, не развивая его в отдельное догматическое утверждение.
