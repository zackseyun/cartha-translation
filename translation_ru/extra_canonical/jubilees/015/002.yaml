  yaml_path: translation/extra_canonical/jubilees/015/002.yaml
  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: ru
  text: 'И он принёс на жертвеннике новую жертву Господу: начатки урожая, быка, козлёнка и овцу — как благоухание, угодное Господу; и с благовонием принёс на жертвеннике их хлебные приношения и возлияния.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ ሐዲስ
  choice: новую жертву
  rationale: Прямо передаёт сочетание «жертва» и «новая», сохраняя его культовый смысл.
- source_word: ቀዳሜ፡ እክል
  choice: начатки урожая
  rationale: Передаёт идею первых плодов земледельческого урожая естественным современным русским выражением.
- source_word: ላህመ፡ ወበሐኮ፡ ወበግዐ
  choice: быка, козлёнка и овцу
  rationale: Различает три названных животных; በሐኮ обозначает молодую козу/козлёнка, а не барана.
- source_word: ጽንሓሐ፡ ለእግዚአብሔር
  choice: как благоухание, приятное Господу
  rationale: Сохраняет культовый образ приятного запаха, не подменяя его обозначением конкретного вида жертвы.
- source_word: ሞጻሕቶሙ
  choice: возлияние
  rationale: Устоявшийся и понятный русский термин для жидкого культового приношения.
- source_word: ስኂን
  choice: благовонием
  rationale: Слово обозначает ароматическое курение; широкий вариант не уточняет без необходимости конкретное вещество, например ладан.
theological_decisions:
- issue: Характер выражения о приятном запахе жертвы
  choice: как благоухание, приятное Господу
  alternative: как всесожжение Господу
  rationale: Источник говорит об угодном благоухании, а не называет здесь отдельный вид жертвы; образ сохранён без богословского переосмысления.
- issue: Соотношение новой жертвы и начатков урожая
  choice: сохранить их как пояснительно связанные выражения
  alternative: понимать начатки как отдельное второе приношение
  rationale: Пунктуация с тире передаёт наиболее вероятную пояснительную связь, не превращая фразу в жёсткое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, но последовательность приношений и культовая образность источника сохранены.
