translation:
  language: ru
  text: В пятый год четвёртой седмины этого юбилея, в третьем месяце, в середине месяца, Аврам отпраздновал праздник первых плодов пшеничной жатвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመተ፡ ኃምስ፡ ዘሰብዐ፡ ዘራብዑ፡ ለኢዮቤልዉን፡ ዝንቱ
  choice: В пятый год четвёртой седмины этого юбилея
  rationale: 'Сохранена хронологическая система книги: «седмина» обозначает семилетний период и звучит естественнее в библейском контексте, чем описательное «семилетие».'
- source_word: በወርኀ፡ ሣልስ፡ በመንፈቀ፡ ወርኀ
  choice: в третьем месяце, в середине месяца
  rationale: Прямо передаёт последовательность и повтор исходного текста, не вычисляя конкретную календарную дату.
- source_word: ገብረ፡ አብራም፡ በዓለ
  choice: Аврам отпраздновал праздник
  rationale: Идиоматическая русская передача конструкции «совершил/устроил праздник»; имя дано в традиционной русской библейской форме.
- source_word: ቀዳሜ፡ ማእረር፡ ዘዘርአ፡ ስርናይ
  choice: праздник первых плодов жатвы пшеницы
  rationale: ስርናይ означает именно «пшеница», а не зерно вообще; формулировка сохраняет связь с праздником первых плодов пшеничной жатвы.
