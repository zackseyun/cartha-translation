  source_fidelity: 'Смысл передан верно: прежнее имя отменяется, новое устанавливается «отныне и навеки», а основанием названо Божье действие, делающее Авраама отцом многих народов. Однако исходная отрицательная конструкция естественнее передаётся личной формой «тебя больше не будут называть», а ሤምኩከ и английское audit trail «I have made» точнее и нейтральнее отражает «Я сделал тебя», чем несколько канцелярское «Я поставил тебя».'
