  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: ru
  text: Тебя больше не будут называть Аврамом; отныне и навеки твоё имя — Авраам, ибо Я сделал тебя отцом многих народов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: не будет больше имя твоё
  rationale: Отрицательная форма глагола «называться/быть названным» естественно передаётся по-русски конструкцией об имени; «больше» выражает прекращение прежнего именования.
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: отныне и навеки
  rationale: Передаёт временной диапазон «с этого времени и до вечности» кратко, естественно и торжественно.
- source_word: አበ፡ ብዙኃን፡ አሕዛብ
  choice: отцом многих народов
  rationale: Сохраняет прямую генеалогическую и представительскую метафору исходного текста; አሕዛብ здесь по контексту означает народы.
- source_word: ሤምኩከ
  choice: Я поставил тебя
  rationale: Форма от глагола со значением «поставить, назначить, сделать»; «поставил» сохраняет оттенок властного установления и не сводит фразу к физическому порождению.
theological_decisions:
- issue: Характер Божьего установления Авраама отцом народов
  choice: Я поставил тебя
  alternative: Я сделал тебя
  rationale: «Поставил» передаёт назначение и установление, сохраняя смысл уже провозглашённого Божьего решения без дополнительного догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Сохранён порядок переименования и причинное обоснование; архаические обороты сведены к минимуму, но местоимения в обращении к Богу традиционно оформлены с прописной буквы.
