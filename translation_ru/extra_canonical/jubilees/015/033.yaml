base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: ru
  text: 'И теперь Я говорю тебе: сыны Израиля не будут соблюдать это установление и не будут обрезывать своих сыновей в полном соответствии со всем законом; при обрезании своих сыновей они будут оставлять часть плоти необрезанной,[a] а все сыны Велиара будут оставлять своих сыновей необрезанными, такими, какими они родились.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они будут оставлять часть плоти своего обрезания при обрезании своих сыновей».'
    reason: Сохраняет необычную и неоднозначную притяжательную конструкцию геэзского текста; основной текст передаёт её вероятный смысл естественным русским языком.
