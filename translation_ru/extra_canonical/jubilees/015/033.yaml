  to: 'И теперь Я говорю тебе: сыны Израиля не будут соблюдать это установление и не будут обрезывать своих сыновей в полном соответствии со всем законом; при обрезании своих сыновей они будут оставлять часть плоти необрезанной,[a] а все сыны Велиара будут оставлять своих сыновей необрезанными, такими, какими они родились.'
