- source_word: መተርፋነ፡ ውስተ፡ ክስበት፡ ውሉዶሙ
  choice: при обрезании своих сыновей они будут оставлять часть плоти, подлежащей обрезанию
  rationale: Сохраняет прямо выраженную фразу «при/в обрезании их сыновей» и делает смысл естественным по-русски.
- source_word: ውሉደ፡ ቤልአር
  choice: сыны Велиара
  rationale: Традиционная русская библейская передача имени и идиоматического обозначения нечестивцев.
- source_word: ዘእንበለ፡ ክስበት፡ በከመ፡ ተወልዱ
  choice: необрезанными, какими те родились
  rationale: Передаёт состояние без обрезания от рождения, не добавляя толкования.
theological_decisions:
- issue: Смысл частичного обрезания
  choice: «будут оставлять часть плоти, подлежащей обрезанию»
  alternative: «будут оставлять часть плоти своего обрезания»
  rationale: Основной текст ясно передаёт осуждение неполного исполнения обряда, тогда как буквальная притяжательная конструкция по-русски двусмысленна; неоднозначность отмечена в сноске.
- issue: Выражение «сыны Велиара»
  choice: сохранить как собственное имя/устойчивую формулу
  alternative: перевести как «нечестивцы» или «сыны беззакония»
  rationale: 'Транслитерация сохраняет текстовую и богословскую неоднозначность: речь может идти как об устойчивом обозначении нечестивых, так и о персонифицированном зле.'
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены формулы «сыны Израиля» и «сыны Велиара»; синтаксис упрощён лишь настолько, чтобы длинное пророческое высказывание оставалось понятным. Маркер [a] присутствует в основном тексте.
