  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: ru
  text: И Он освятил его и отделил его от всех сынов человеческих, ибо много народов и много народностей, и все они принадлежат Ему, и над всеми ими Он поставил духов, чтобы те сбивали их с пути следования за Ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от того, чтобы идти позади Него».'
    reason: Сохраняет доступ к пространственной форме исходного семитского оборота, который в основном тексте естественно передан как следование за Богом.
lexical_decisions:
- source_word: ወአስተጋብኦ
  choice: и отделил его
  rationale: Глагол может выражать собирание или выделение из общей среды; при дополнении «от всех сынов человеческих» естественное русское «отделил» ясно передаёт избрание из их числа.
- source_word: እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: от всех сынов человеческих
  rationale: Сохранён библейский образ и значение исходного оборота без сведения его к более общему «от всего человечества».
- source_word: ብዙኅ፡ አሕዛብ፡ ወብዙኅ፡ ሕዝብ
  choice: много народов и много племён
  rationale: Переданы два близких собирательных обозначения человеческих общностей с различением по-русски, без тяжеловесного повтора «много народов и много народов».
- source_word: አሰለመ፡ መናፍስተ
  choice: поставил духов
  rationale: В контексте власти над народами выражение означает назначение или поставление духов над ними; выбор сохраняет личностный характер духов.
- source_word: ከመ፡ ያስሕትዎሙ
  choice: чтобы те уводили их
  rationale: Каузативная форма передаёт побуждение к заблуждению или совращение; «уводили» естественно сочетается с последующим образом следования.
- source_word: እምድኅሬሁ
  choice: от следования за Ним
  rationale: Буквально пространственный оборот «из-за/от позади него» здесь является идиомой следования; перевод передаёт смысл современным русским языком, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Все народы принадлежат Богу, однако над ними поставлены вводящие в заблуждение духи
  choice: Сохранить прямое утверждение исходного текста без объяснения причины или нравственного оправдания
  alternative: Смягчить Божье действие как простое попущение либо приписать назначение духов иному субъекту
  rationale: Исходный текст прямо называет Бога действующим субъектом; богословское напряжение нельзя устранять добавлением отсутствующего в тексте толкования.
- issue: Связь между принадлежностью народов Богу и поставлением духов
  choice: Передать противопоставление союзом «но»
  alternative: Соединить простым «и»
  rationale: Исходное повторное «и» допускает последовательное соединение, однако контекст содержит явное смысловое напряжение. Русское «но» делает эту связь понятной, не меняя содержания утверждений.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимения, относящиеся к Богу, написаны с прописной буквы для ясности референции. Точка поставлена после сносочного маркера согласно заданному формату маркеров.
