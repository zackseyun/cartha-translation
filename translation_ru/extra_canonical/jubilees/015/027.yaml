revisions:
- from: Ибо все ангелы присутствия и все ангелы святости — таково их естество со дня их сотворения; и пред ангелами присутствия и ангелами святости Он освятил Израиль, чтобы они были с Ним и с Его святыми ангелами.[a][b]
  to: Ибо все ангелы присутствия и все ангелы святости — таково было их сотворение со дня их сотворения[a]; и пред ангелами присутствия и ангелами святости[b] Он освятил Израиль, чтобы они были с Ним и с Его святыми ангелами.
  rationale: Заменено интерпретирующее «естество» на более исходно-ориентированное «сотворение». Сохранены повтор существительного и отсутствие «всех» при втором упоминании ангелов. Маркеры сносок перенесены к тем выражениям, которые они поясняют; иных смысловых изменений не внесено.
