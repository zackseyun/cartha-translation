  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: ru
  text: Ибо все ангелы присутствия и все ангелы святости — таково было их сотворение со дня их сотворения[a]; и пред ангелами присутствия и ангелами святости[b] Он освятил Израиль, чтобы они были с Ним и с Его святыми ангелами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таковы они от дня своего сотворения»; возможно также: «так Он сотворил их».'
    reason: Геэзская именная конструкция с ፍጥረቶሙ буквально связана с сотворением; возможны как более гладкая предикативная передача, так и глагольное прочтение, хотя последнее менее буквально.
  - marker: b
    text: 'Или: «напротив ангелов присутствия и ангелов святости».'
    reason: Геэзское አንጻር допускает значение «перед; в присутствии», а в более буквальном пространственном смысле — «напротив».
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: ангелы присутствия
  rationale: Буквально сочетание связано с «лицом»; «ангелы присутствия» естественно передаёт устойчивое обозначение ангелов, пребывающих пред Божьим лицом.
- source_word: መላእክተ፡ ቅዳሴ
  choice: ангелы святости
  rationale: Сохраняет именную конструкцию оригинала и отличие от последующего መላእክቲሁ፡ ቅዱሳን — «Его святые ангелы».
- source_word: ፍጥረቶሙ
  choice: их естество
  rationale: Существительное допускает значения «создание», «творение», «природа/естество»; здесь «таково их естество» образует осмысленное утверждение о неизменном состоянии ангелов со дня сотворения, не превращая именную конструкцию в глагольную.
- source_word: እምዕለተ፡ ፍጥረቶሙ
  choice: со дня их сотворения
  rationale: Второе употребление того же корня естественно относится к моменту, когда они были сотворены.
- source_word: ወአንጻሮሙ
  choice: и пред
  rationale: Передаёт пространственно-реляционное значение «напротив / перед / в присутствии» и звучит естественно в данном торжественном контексте.
- source_word: ቀደሶ፡ ለእስራኤል
  choice: Он освятил Израиль
  rationale: Прямо сохраняет действие освящения и подразумеваемого божественного субъекта.
theological_decisions:
- issue: Смысл выражения ከመዝ፡ ፍጥረቶሙ
  choice: «таково их естество»
  alternative: «таково было их сотворение» / «так Он сотворил их»
  rationale: Именная форма не требует вводить явного деятеля. «Естество» сохраняет возможный смысл установленной при сотворении природы ангелов, а примечание сообщает другую допустимую трактовку.
- issue: Отношение освящения Израиля к ангелам
  choice: «пред ангелами»
  alternative: «напротив ангелов» / «в присутствии ангелов»
  rationale: Не уточняет сверх текста, были ли ангелы свидетелями или Израиль поставлен им в соответствие; исходная реляционная неоднозначность отмечена в сноске.
- issue: Число в ይኩኑ
  choice: «чтобы они были»
  alternative: «чтобы он был»
  rationale: Сохраняется формальное множественное число глагола, вероятно соотносимое с Израилем как собирательным народом, без замены его русским единственным числом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским строем. Заглавные местоимения «Он», «Ним» обозначают Бога согласно русской издательской традиции. Точка с запятой сохраняет длинную двухчастную структуру стиха. Все маркеры сносок помещены в основном тексте.
