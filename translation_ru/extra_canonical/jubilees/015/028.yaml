  yaml_path: translation/extra_canonical/jubilees/015/028.yaml
  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: ru
  text: А ты повели сынам Израиля хранить знак завета во всех их поколениях как вечное установление, и они не будут исторгнуты из земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: А ты
  rationale: Передаёт обращение с присоединительным союзом без добавления отсутствующего в источнике значения «теперь».
- source_word: ትእምርተ፡ ኪዳን
  choice: знак завета
  rationale: Прямо сохраняет сочетание «знак» и «завет», не добавляя указательного «этого».
- source_word: ለትውልዶሙ
  choice: во всех их поколениях
  rationale: Естественно по-русски выражает непрерывность соблюдения установления поколениями Израиля.
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: как вечное установление
  rationale: «Установление» передаёт нормативный смысл ሥርዐት, а «вечное» — длительность ዘለዓለም.
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: и они не будут исторгнуты из земли
  rationale: Сохраняет пассивный образ удаления или вырывания из земли и не вводит отсутствующего притяжательного местоимения «своей».
theological_decisions:
- issue: Связь между соблюдением знака завета и пребыванием в земле
  choice: Сохранено простое соединение союзом «и»
  alternative: «и тогда они не будут исторгнуты из земли»
  rationale: В исходном тексте стоит сочинительный союз; добавление «тогда» сделало бы условно-следственную связь более явной, чем она выражена в тексте.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Сынам Израиля» сохраняет традиционное обозначение народа, а синтаксис упрощён для ясности без устранения смысловой напряжённости.
