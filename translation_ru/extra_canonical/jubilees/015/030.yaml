  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: ru
  text: Ибо Господь не приблизил к Себе Измаила, его сыновей, его братьев и Исава и не избрал их, хотя они — потомки Авраама, потому что Он знал их; а Израиля Он избрал Себе в народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином членении фразы: «…потомки Авраама; но Он знал их и избрал Израиля Себе в народ».'
    reason: Отражает засвидетельствованную в английском аудиторском следе альтернативную передачу, не представляя замену союза как чисто пунктуационный вариант; основной текст сохраняет более вероятное причинное значение እስመ.
lexical_decisions:
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: не приблизил к Себе
  rationale: Сохраняет образное выражение оригинала «не привёл/не приблизил к Нему», не сводя его к более толковательному «не принял».
- source_word: ውሉደ፡ አብርሃም
  choice: потомки Авраама
  rationale: В данном контексте обозначает происхождение от Авраама шире, чем буквальное русское «дети».
- source_word: እስመ፡ አእመሮሙ
  choice: потому что Он знал их
  rationale: Передаёт причинное значение እስመ и сохраняет неопределённость того, что именно подразумевает Божье знание о них.
- source_word: ይኩንዎ፡ ሕዝበ
  choice: Себе в народ
  rationale: Естественная русская формула, точно передающая избрание Израиля как принадлежащего Богу народа.
theological_decisions:
- issue: Связь Божьего знания с неизбранием потомков Авраама
  choice: «потому что Он знал их» отнесено к предшествующему неизбранию
  alternative: «но Он знал их и избрал Израиля»
  rationale: Повторное እስመ обычно имеет причинное значение «потому что/ибо»; такая пунктуация следует исходному синтаксису, но не поясняет богословски содержание знания.
- issue: Смысл приближения к Богу
  choice: сохранён образ «не приблизил к Себе»
  alternative: «не принял к Себе»
  rationale: Более буквальная формулировка удерживает возможный культовый или заветный оттенок, не навязывая единственного истолкования.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным строем. Местоимение «Себе» написано с прописной буквы как относящееся к Господу; синтаксис слегка упрощён ради ясности без устранения неоднозначности исходной фразы.
