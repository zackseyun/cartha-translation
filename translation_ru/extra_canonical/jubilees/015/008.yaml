  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: ru
  text: И Я чрезвычайно возвеличу тебя, и произведу от тебя народы, и цари произойдут от тебя. И Я установлю Мой завет между Мною и тобою и между твоим потомством после тебя во всех их поколениях как вечное установление, чтобы быть Богом тебе и твоему потомству после тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐብየከ፡ ጥቀ
  choice: И Я чрезвычайно возвеличу тебя
  rationale: Передаёт каузативный глагол «сделаю великим, возвеличу» и усилитель «весьма» естественным литературным русским языком.
- source_word: ወእሁበከ፡ ውስተ፡ አሕዛብ
  choice: и произведу от тебя народы
  rationale: Буквальная конструкция «дам/положу тебя в народы» в данном контексте означает, что от адресата произойдут народы; формулировка сохраняет множественное число и избегает неясного «сделаю тебя народами».
- source_word: ዘርእከ
  choice: твоё потомство
  rationale: Слово означает «семя» и собирательно — потомков; «потомство» в современном русском сохраняет собирательность и лучше подходит к упоминанию поколений.
- source_word: በትዝምዶሙ
  choice: во всех их поколениях
  rationale: Передаёт продолжение завета по поколениям потомства; «во всех» естественно выражает охват последовательных поколений.
- source_word: ሥርዓት፡ ዘለዓለም
  choice: вечное установление
  rationale: ሥርዓት обозначает установленный порядок, постановление или установление; выбран широкий нейтральный эквивалент без конфессионально окрашенного уточнения.
theological_decisions:
- issue: Формула цели завета ከመ፡ እኩንከ፡ አምላከ
  choice: чтобы быть Богом тебе
  alternative: чтобы Я был твоим Богом
  rationale: Выбранная формулировка ближе сохраняет структуру источника и формульный характер обещания, не добавляя притяжательного элемента, хотя по смыслу обе передачи близки.
- issue: Характер завета как ሥርዓት፡ ዘለዓለም
  choice: как вечное установление
  alternative: как вечный завет
  rationale: Источник отдельно называет «Мой завет», а затем характеризует его словом «установление»; сохранение обоих понятий не сглаживает лексическое различие.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской традиции. Архаизмы и узкоконфессиональная терминология не использованы.
