  yaml_path: translation/extra_canonical/jubilees/015/003.yaml
  text: And the Lord appeared to Abram and said to him, “I am God Shaddai; be pleasing before me, and be blameless.”
translation:
  language: ru
  text: 'И явился Господь Авраму и сказал ему: «Я — Бог Шаддай[a]. Будь угоден Мне и будь непорочен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шаддай — древний титул Бога с не вполне ясным значением; традиционно переводится как «Всемогущий».
    reason: Сохраняет неоднозначность древнего божественного титула и одновременно поясняет читателю традиционную передачу.
lexical_decisions:
- source_word: አሥምር፡ ቅድሜየ
  choice: Поступай угодно Мне
  rationale: Глагол አሥምር передаёт значение «быть угодным / делать угодное», а не «ходить». Такой перевод следует геэзскому тексту и не гармонизирует его с еврейским текстом Быт. 17:1.
- source_word: ፍጹመ
  choice: непорочен
  rationale: В данном нравственно-религиозном контексте слово обозначает цельность и безупречность; «непорочен» естественно передаёт смысл, не утверждая абсолютного совершенства.
- source_word: አምላክ፡ ሰዳይ
  choice: Бог Шаддай
  rationale: Божественный титул сохранён транслитерацией, поскольку его точная этимология и значение остаются предметом споров; традиционный перевод «Бог Всемогущий» был бы более толковательным.
theological_decisions:
- issue: Соотношение с Быт. 17:1
  choice: Сохранено геэзское чтение «Поступай угодно Мне»
  alternative: «Ходи предо Мною»
  rationale: Альтернатива отражает еврейский масоретский текст Бытия, но не значение засвидетельствованного здесь геэзского глагола. Перевод не должен устранять различие между текстовыми традициями.
- issue: Передача титула Шаддай
  choice: Титул оставлен без перевода
  alternative: «Всемогущий»
  rationale: Это сохраняет древнее именование и не выдаёт традиционное, но не вполне бесспорное толкование за единственно возможное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «Аврам» соответствует имени персонажа до его переименования. Оборот «Поступай угодно Мне» выбран ради точности и естественности без архаизма «предо Мною».
