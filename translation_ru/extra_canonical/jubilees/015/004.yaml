lexical_decisions:
- source_word: እሁብ
  choice: установлю
  rationale: Буквально глагол означает «дам», однако в сочетании с «заветом» речь идёт об утверждении завета; «установлю» естественно передаёт смысл формулы, не добавляя идеи, которой нет в тексте.
- source_word: ኪዳንየ
  choice: Мой завет
  rationale: Передаёт существительное «завет» с притяжательным суффиксом первого лица.
- source_word: ማእከሌየ፡ ወማእከሌከ
  choice: между Мною и тобою
  rationale: Сохранена симметричная формула исходного текста, буквально обозначающая отношения между двумя сторонами.
- source_word: ወአአብቀከ፡ ጥቀ
  choice: и весьма умножу тебя
  rationale: Сохранён прямой объект «тебя», а не пояснительное «твоё потомство»; наречие «весьма» передаёт усилительное ጥቀ и соответствует достоинству библейской речи.
theological_decisions:
- issue: Характер действия Бога по отношению к завету
  choice: установлю Мой завет
  alternative: дам Мой завет
  rationale: Буквальное «дам» возможно лексически, но по смыслу заветной формулы здесь обозначено его утверждение между сторонами. Выбор не уточняет содержание завета и не привносит конфессионального толкования.
- issue: Объект обещанного умножения
  choice: умножу тебя
  alternative: умножу твоё потомство
  rationale: Исходный текст обращает действие непосредственно на адресата. Формулировка сохраняет возможную смысловую широту и не сводит обещание исключительно к потомству.
translation_notes:
