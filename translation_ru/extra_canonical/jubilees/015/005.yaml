  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: ru
  text: 'И пал Аврам ниц, и Бог обратился к нему со словами: «Вот, Мой завет с тобой, и ты станешь отцом множества народов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ፡ አብራም፡ በገጹ፡
  choice: И пал Аврам лицом на землю
  rationale: Геэзское выражение буквально описывает падение Аврама «на своё лицо»; естественный русский библейский эквивалент — «лицом на землю».
- source_word: ተናገሮ፡ እግዚአብሔር፡
  choice: Бог говорил с ним
  rationale: Форма с объектным суффиксом передаёт обращённую к Авраму речь; сохранён вид глагола исходного текста без ненужного уточнения содержания.
- source_word: ሥርዓትየ፡ ምስሌከ፡
  choice: Мой завет с тобой
  rationale: Хотя ሥርዓት может обозначать установление или порядок, в контексте обещания Авраму и параллели с Быт 17 речь идёт о завете.
- source_word: ወትከውን፡ አበ፡ ለብዙኃን፡ አሕዛብ፡
  choice: и ты станешь отцом множества народов
  rationale: Передаёт значение становления и конструкцию «отец для множества народов» естественным современным русским языком.
theological_decisions:
- issue: Значение ሥርዓት в речи Бога к Авраму
  choice: завет
  alternative: установление / устав
  rationale: Контекст явно соответствует формуле завета с Аврамом; «завет» точнее выражает отношение между Богом и Аврамом, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Имя передано как «Аврам», поскольку в данном месте переименование ещё не произошло. Архаическое «се» заменено ясным «вот».
