revisions:
- from: 'И Господь сказал Аврааму: «Ты же соблюдай Мой завет — ты и твои потомки после тебя. Пусть у вас будет обрезан каждый мужчина: обрезайте крайнюю плоть, и это будет знаком вечного установления между Мною и вами. На восьмой день обрезайте каждого младенца мужского пола среди вас — и рождённого в доме, и купленного за золото[a] у любого чужеземца, не принадлежащего к твоим потомкам. Непременно должен быть обрезан и рождённый в твоём доме, и купленный за золото; так Мой завет будет на вашей плоти вечным установлением. А необрезанный мужчина, чья крайняя плоть не была обрезана на восьмой день, будет отсечён от своего народа, потому что он нарушил Мой завет».


    И Господь сказал Аврааму: «Сару, жену твою, больше не называй Сарой: отныне имя ей — Сарра. Я благословлю её и дам тебе от неё сына; Я благословлю его, и он станет народом, и от него произойдут цари народов».


    Авраам пал ниц, обрадовался и сказал в своём сердце: «Неужели у столетнего родится сын? Неужели Сарра, которой девяносто лет, родит?» И сказал Авраам Господу: «О, если бы Измаил был жив пред Тобою!»


    Бог сказал: «Да, Сарра родит тебе сына, и ты назовёшь его Исааком. Я заключу с ним Мой завет — вечный завет с ним и с его потомками после него. И об Измаиле Я услышал тебя. Вот, Я благословлю его, сделаю плодовитым и чрезвычайно многочисленным. Он станет отцом двенадцати князей, и Я произведу от него великий народ. Но Мой завет Я заключу с Исааком, которого Сарра родит тебе в это же время в будущем году».


    Закончив говорить с ним, Господь поднялся от Авраама. Авраам сделал так, как сказал ему Господь: взял своего сына Измаила, всех рождённых в своём доме и всех купленных за золото — всех мужчин в своём доме — и обрезал им крайнюю плоть. В тот самый день были обрезаны Авраам и все мужчины в его доме — рождённые в доме и купленные за золото у чужеземцев; все они были обрезаны вместе с ним.


    Таково постановление для всех поколений навеки: нельзя ни откладывать этот срок, ни убавлять хотя бы один день из восьми, ибо это вечное установление, утверждённое и записанное на небесных скрижалях. Всякий рождённый, чья крайняя плоть не была обрезана на восьмой день, не принадлежит к сынам завета, который Господь заключил с Авраамом, но принадлежит к сынам погибели. На нём нет знака того, что он принадлежит Господу; он предназначен для погибели, для истребления с земли и искоренения из земли, потому что нарушил завет Господа, Бога нашего.


