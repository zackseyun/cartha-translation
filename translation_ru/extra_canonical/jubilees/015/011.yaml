  language: ru
  text: 'И Господь сказал Аврааму: «Ты же соблюдай Мой завет — ты и твои потомки после тебя. Пусть у вас будет обрезан каждый мужчина: обрезайте крайнюю плоть, и это будет знаком вечного установления между Мною и вами. На восьмой день обрезайте каждого младенца мужского пола среди вас — и рождённого в доме, и купленного за золото[a] у любого чужеземца, который не из твоего потомства. Непременно должен быть обрезан и рождённый в твоём доме, и купленный за золото; так Мой завет будет на вашей плоти вечным установлением. А необрезанный мужчина, чья крайняя плоть не была обрезана на восьмой день, будет отсечён от своего народа, потому что он нарушил Мой завет».


    И Господь сказал Аврааму: «Сару, жену твою, больше не называй Сарой: отныне имя ей — Сарра. Я благословлю её и дам тебе от неё сына; Я благословлю его, и он станет народом, и от него произойдут цари народов».


    Авраам пал ниц, обрадовался и сказал в своём сердце: «Неужели у столетнего родится сын? Неужели Сарра, которой девяносто лет, родит?» И сказал Авраам Господу: «О, если бы Измаил был жив пред Тобою!»


    Бог сказал: «Да, Сарра родит тебе сына, и ты назовёшь его Исааком. Я заключу с ним Мой завет — вечный завет с ним и с его потомками после него. И об Измаиле Я услышал тебя. Вот, Я благословлю его, сделаю плодовитым и чрезвычайно многочисленным. Он станет отцом двенадцати князей, и Я произведу от него великий народ. Но Мой завет Я заключу с Исааком, которого Сарра родит тебе в это же время в будущем году».


    Закончив говорить с ним, Господь поднялся от Авраама. Авраам сделал так, как сказал ему Господь: взял своего сына Измаила, всех рождённых в своём доме и всех купленных за золото — всех мужчин в своём доме — и обрезал им крайнюю плоть. В тот самый день были обрезаны Авраам и все мужчины в его доме — рождённые в доме и купленные за золото у чужеземцев; все они были обрезаны вместе с ним.


    Таково постановление для всех поколений навеки: нельзя откладывать на несколько дней и нельзя пропустить хотя бы один из восьми дней, ибо это вечное установление, утверждённое и записанное на небесных скрижалях. Всякий рождённый, чья крайняя плоть не была обрезана на восьмой день, не принадлежит к сынам завета, который Господь заключил с Авраамом, но принадлежит к сынам погибели. На нём нет знака того, что он принадлежит Господу; он предназначен для погибели, для истребления с земли и искоренения из земли, потому что нарушил завет Господа, Бога нашего.


    [a] Или: «за деньги»; эфиопское слово буквально означает «золото», но может употребляться и в значении денег.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за деньги»; эфиопское слово буквально означает «золото», но может употребляться и в значении денег.'
    reason: Лексема ወርቅ буквально означает «золото», но допускает расширенное денежное значение; сноска сохраняет эту смысловую возможность, не заменяя конкретное чтение источника словом «серебро».
lexical_decisions:
- source_word: ኪዳን (kidān)
  choice: завет
  rationale: Устойчивый и точный русский эквивалент для договорного союза Бога с Авраамом; одинаково передан во всём отрывке.
- source_word: ወርቅ (warq)
  choice: золото
  rationale: В отличие от текста Бытия с «серебром», геэзский источник прямо употребляет слово «золото»; переносное значение «деньги» отмечено в сноске.
- source_word: ሥርዓት ዘለዓለም
  choice: вечное установление
  rationale: Передаёт нормативный смысл «установления/предписания», не смешивая его с самим «заветом».
- source_word: ትሤረር ... እምዘመዳ
  choice: будет отсечён от своего народа
  rationale: Естественная русская формула, сохраняющая судебно-заветный смысл удаления человека из среды родичей.
- source_word: ጽላት ሰማይ
  choice: небесные скрижали
  rationale: Традиционный и понятный русский эквивалент характерного для Книги Юбилеев образа.
- source_word: ውሉደ ሙስና
  choice: сыны погибели
  rationale: Сохраняет семитскую образность и противопоставление «сынам завета», не сводя выражение просто к описанию нравственной испорченности.
theological_decisions:
- issue: К кому относятся мужские местоимения после обещания сына Сарре
  choice: «Я благословлю его, и он станет народом, и от него произойдут цари народов» — к обещанному сыну
  alternative: 'Женские формы: «благословлю её… от неё произойдут народы и цари»'
  rationale: Геэзский текст последовательно имеет мужские формы ወእባርኮ, ወይከውን и እምኔሁ; перевод не подменяет их чтением масоретского текста Бытия 17:16.
- issue: Санкция за отсутствие обрезания на восьмой день
  choice: Сохранена прямая формулировка о непринадлежности к сынам завета и предназначении для погибели
  alternative: Смягчить как временное исключение из общины
  rationale: Источник выражает жёсткое заветное противопоставление; смягчение внесло бы богословское толкование, которого в тексте нет.
- issue: Тройная формула в заключительной санкции
  choice: «для погибели, для истребления с земли и искоренения из земли»
  alternative: Сократить до двух элементов как стилистический повтор
  rationale: Геэзский текст содержит три самостоятельных звена, включая ወለተሠርዎ እምነ ምድር — «и для искоренения из земли».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис умеренно упрощён ради ясности, но сохранены повторения, параллелизм и заветная терминология источника. Архаизмы ограничены узнаваемыми формулами «пал ниц», «пред Тобою» и «скрижали».
