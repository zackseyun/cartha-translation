revisions:
- from: И будет велик гнев Господа на сынов Израиля, потому что они оставили Его завет, уклонились от Его слова, вызвали Его гнев и хулили, не исполняя установления этого закона. Ибо они уподобили себя народам — на искоренение и уничтожение с земли. И уже не будет им ни прощения, ни отпущения, чтобы им были прощены и отпущены все грехи этого вечного заблуждения.[a]
  to: И будет велик гнев Господа на сынов Израиля, потому что они оставили Его завет, уклонились от Его слова, вызвали Его гнев и хулили, не исполняя предписания этого закона. Ибо они уподобили себя народам, так что будут искоренены и уничтожены с лица земли. И уже не будет им ни прощения, ни отпущения, чтобы им были прощены и отпущены все грехи этого вечного заблуждения.
