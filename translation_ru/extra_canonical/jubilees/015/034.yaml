base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: ru
  text: И будет велик гнев Господа на сынов Израиля, потому что они оставили Его завет, уклонились от Его слова, вызвали Его гнев и хулили, не исполняя предписания этого закона. Ибо они уподобили себя народам, так что будут искоренены и уничтожены с лица земли. И уже не будет им ни прощения, ни отпущения, чтобы им были прощены и отпущены все грехи этого вечного заблуждения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዓት
  choice: гнев
  rationale: Передаёт сильный Божий гнев и естественно сочетается с определением «велик».
- source_word: ውሉደ፡ እስራኤል
  choice: сыны Израиля
  rationale: Сохраняет традиционный библейский оборот, оставаясь понятным современному читателю.
- source_word: ኪዳኖ
  choice: Его завет
  rationale: «Завет» точно передаёт смысл установленного Богом союзного обязательства; притяжательное местоимение соотнесено с Господом.
- source_word: ተገኅሡ
  choice: уклонились
  rationale: Передаёт отход от Божьего слова без излишнего уточнения характера отступления.
- source_word: ወወሐኩ
  choice: вызвали Его гнев
  rationale: Контекстуально передаёт действие провоцирования или раздражения Господа естественным русским выражением.
- source_word: ሥርዐተ፡ ለዝ፡ ሕግ
  choice: установления этого закона
  rationale: Сохраняет различие между конкретным предписанием и законом, к которому оно относится.
- source_word: ለስስሎ፡ ወለተሠርዎ፡ እምድር
  choice: на искоренение и уничтожение с земли
  rationale: 'Передаёт два усилительных образа суда: вырывание с корнем и уничтожение; сохраняется суровая целевая формулировка источника.'
- source_word: ኅድገተ፡ ወስርየተ
  choice: прощения, ни отпущения
  rationale: Два близких существительных сохранены отдельно, чтобы не сглаживать риторическое удвоение источника.
- source_word: ኃጢአት፡ ለስሕተት፡ ዛቲ፡ ዘለዓለም
  choice: все грехи этого вечного заблуждения
  rationale: Явно сохраняет слово «грех» и передаёт синтаксическую связь с «вечным заблуждением», не опуская ни одного смыслового элемента.
theological_decisions:
- issue: Направленность глагола «хулили»
  choice: оставить без явно названного дополнения
  alternative: «хулили Его»
  rationale: Источник допускает понимание хулы против Бога, однако прямое дополнение в данной форме не выражено; русский текст сохраняет эту сдержанность.
- issue: Абсолютность отсутствия прощения
  choice: сохранить категорическую формулировку «уже не будет им»
  alternative: смягчить как временную угрозу суда
  rationale: Текст выражает безусловное и продолжительное лишение прощения; богословски смягчать это утверждение без основания в источнике нельзя.
- issue: «Вечное заблуждение»
  choice: сохранить буквальную напряжённую формулировку
  alternative: «это заблуждение навеки»
  rationale: Определение «вечное» может характеризовать само заблуждение или его непреходящий характер; основной текст следует наиболее прямой связи слов, а сноска отмечает возможную конструкцию.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены параллелизмы, повтор прощения и отпущения и резкость судебной формулы; архаизмы, не необходимые для достоинства текста, избегаются.
