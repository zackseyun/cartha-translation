  source_fidelity: В целом переданы все основные элементы геэзского текста, включая «грех» в заключительной формуле и удвоение «прощения/отпущения». Однако ሥርዐተ стоит в единственном числе и лучше передавать как «предписание», а не «установления». Формула о суде должна быть выражена по-русски как результат/цель искоренения, а не неестественным оборотом «на искоренение».
  naturalness: '«На искоренение и уничтожение с земли» в данном контексте звучит не по-русски и затемняет смысл. «Так что будут искоренены и уничтожены с лица земли» естественно передаёт судебное следствие, не добавляя нового содержания. Остальной регистр выдержан: современный литературный русский с уместной библейской торжественностью.'
