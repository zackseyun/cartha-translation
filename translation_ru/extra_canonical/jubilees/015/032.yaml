base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: ru
  text: Но Израиль Он не передал[a] и не вверил ни ангелу, ни духу, потому что Он один — их Правитель. Он будет хранить их и взыщет их[b] из рук Своих ангелов, из рук Своих духов и из рук всех Своих властей, чтобы хранить и благословлять их, чтобы они принадлежали Ему, а Он — им отныне и навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поставил над ним».'
    reason: Первый глагол может обозначать передачу под чью-либо власть, а в данном контексте также поставление ангела или духа над Израилем; основной текст сохраняет пару исходных глаголов «не передал и не вверил».
  - marker: b
    text: 'Или: «потребует их»; исходный глагол может также означать «искать» или «истребовать».'
    reason: Сохраняется смысловая широта глагола ይትኀሠሦሙ в сочетании с выражением «из рук».
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ
  choice: не поставил… и не вверил их никому
  rationale: 'Передаёт два исходных глагола: первый допускает значение «поставить над кем-либо / передать под власть», второй — «вверить». Добавление «никому» естественно завершает русскую конструкцию при однородных «ни ангела, ни духа».'
- source_word: መኰንኖሙ
  choice: их Правитель
  rationale: Сохраняет идею единоличного правления Бога над Израилем и соответствует возвышенному, но современному регистру.
- source_word: የዐቅቦሙ / ይዕቀቦሙ
  choice: будет хранить их / хранить
  rationale: Одинаковый русский глагол сохраняет повтор исходного корня и выражает охрану и сбережение.
- source_word: ይትኀሠሦሙ፡ እምእዴ
  choice: взыщет их из рук
  rationale: Глагол охватывает значения «искать, требовать, взыскивать»; вместе с оборотом «из рук» речь может идти о востребовании или истребовании Израиля у подчинённых сил.
- source_word: ትእዛዝያኒሁ
  choice: всех Своих властей
  rationale: Передаёт подчинённые Богу власти или силы, не конкретизируя их природу сверх исходного текста.
- source_word: ይኩንዎ፡ ሎቱ፡ ወውእቱ፡ ይኩኖሙ፡ ሎሙ
  choice: чтобы они принадлежали Ему, а Он — им
  rationale: Естественная русская передача взаимной формулы принадлежности с сохранением её богословской напряжённости.
theological_decisions:
- issue: Отношение Бога к Израилю в отличие от ангельского управления другими народами
  choice: Бог не поставил над Израилем и не вверил его ангелу или духу
  alternative: Бог не передал Израиль ангелу или духу
  rationale: Выбранная формулировка сохраняет оба исходных глагола и не сводит их к одному толкованию.
- issue: Значение требования Израиля «из рук» ангелов и духов
  choice: взыщет их из рук
  alternative: потребует их из рук / разыщет их у
  rationale: «Взыщет» сохраняет неоднозначность между поиском, истребованием и требованием ответа, а сноска поясняет её без разрешения в пользу одного смысла.
- issue: Взаимная формула Бога и Израиля
  choice: они принадлежали Ему, а Он — им
  alternative: они были Его, а Он был их Богом
  rationale: Не добавляется слово «Бог», отсутствующее в данном обороте исходного текста; сохраняется взаимность формулы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения относятся к Богу. Повтор «хранить» сохранён намеренно; синтаксис слегка сглажен ради ясности, но параллелизм исходного текста удержан.
