revisions:
- from: А над Израилем Он не поставил[a] ни ангела, ни духа и не вверил их никому, потому что Он один — их Правитель. Он будет хранить их и взыщет их[b] из рук Своих ангелов, из рук Своих духов и из рук всех Своих властей, чтобы хранить и благословлять их, чтобы они принадлежали Ему, а Он — им отныне и навеки.
  to: Но Израиль Он не передал[a] и не вверил ни ангелу, ни духу, потому что Он один — их Правитель. Он будет хранить их и взыщет их[b] из рук Своих ангелов, из рук Своих духов и из рук всех Своих властей, чтобы хранить и благословлять их, чтобы они принадлежали Ему, а Он — им отныне и навеки.
  rationale: Начало переработано так, чтобы оба отрицательных глагола имели один и тот же объект — Израиль — и одно дополнение «ни ангелу, ни духу». Это точнее передаёт исходник и английский аудиторский след («did not hand over or entrust any angel or spirit») без навязывания конкретной интерпретации ангельского управления. Остальная формулировка сохранена, поскольку она передаёт повтор глагола «хранить», неоднозначное «взыщет из рук» и взаимную формулу принадлежности.
