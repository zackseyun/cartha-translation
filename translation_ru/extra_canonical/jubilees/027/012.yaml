  text: Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.
translation:
  language: ru
  text: Встань и иди в Месопотамию, в дом Вафуила, отца твоей матери, и возьми себе жену оттуда, из дочерей Лавана, брата твоей матери.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥእ፡ ወሖር
  choice: Встань и иди
  rationale: Прямо передаёт последовательные повелительные формы, сохраняя естественный и торжественный русский синтаксис.
- source_word: ፄስጶጦሚያ
  choice: Месопотамию
  rationale: Устоявшееся русское географическое название; форма источника соответствует названию Месопотамии.
- source_word: ቤተ፡ ባቱኤል
  choice: в дом Вафуила
  rationale: «Дом» сохранён буквально как обозначение семейного дома или рода; имя передано в традиционной русской библейской форме.
- source_word: አቡሃ፡ ለእምከ
  choice: отца твоей матери
  rationale: Сохранена явная родственная формулировка источника без замены более кратким словом «дед».
- source_word: ወንሣእ፡ ለከ፡ ብእሲተ
  choice: и возьми себе ... жену
  rationale: Передаёт повеление и возвратное значение конструкции естественным современным русским выражением.
- source_word: እምህየ፡ እምአዋልደ፡ ላባ
  choice: оттуда ... из дочерей Лавана
  rationale: Сохранены оба исходных указания — на место и на круг возможных невест.
- source_word: እኁሃ፡ ለእምከ
  choice: брата твоей матери
  rationale: Родство выражено непосредственно, как в источнике, без замены словом «дядя».
