  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: ru
  text: Ибо я знаю, что все его пути будут успешны во всём, куда бы он ни пошёл, пока он не вернётся к нам с миром и мы не увидим его в мире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሤራኅ፡ ፍኖዊሁ
  choice: его путь будет успешен
  rationale: Глагол передаёт идею успеха или благополучного исхода, а ፍኖዊሁ буквально означает «его путь»; формулировка сохраняет образ пути.
- source_word: በኵሉ፡ ውእደ፡ ሖረ
  choice: во всём, куда бы он ни пошёл
  rationale: 'Передаёт сочетание всеобщности и движения: успех будет сопутствовать ему во всех обстоятельствах и местах его пути.'
- source_word: በሰላም
  choice: с миром / в мире
  rationale: 'Двукратное употребление сохранено с естественной для русского языка вариативностью: возвращение «с миром» и встреча/созерцание «в мире», без снятия смыслового акцента на благополучии и мире.'
