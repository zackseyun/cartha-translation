  source_fidelity: 'Смысл передан в целом точно: условие, брак Иакова с местными женщинами, риторический вопрос и отрицательная оценка дочерей Ханаана сохранены. Однако сравнительный оборот в источнике относится к «дочерям земли» во множественном числе, а не к единственной «жене».'
