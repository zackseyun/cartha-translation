lexical_decisions:
- source_word: ነሥአ
  choice: возьмёт жену
  rationale: В брачном контексте глагол «брать» естественно передаётся устойчивым русским выражением «взять жену».
- source_word: እምውስተ፡ አዋልደ፡ ምድር
  choice: из дочерей этой земли
  rationale: Сохраняет буквальный образ «дочерей земли» и ясно указывает на местных женщин.
- source_word: እለ፡ ከመ፡ እሉ
  choice: подобную этим
  rationale: Передаёт указательное сравнение с ранее упомянутыми женщинами, не вводя в стих их имён.
- source_word: ለምንት፡ ሊተ፡ እንከ፡ አሐዩ
  choice: то зачем мне ещё жить?
  rationale: Естественная современная русская формулировка, сохраняющая риторический вопрос и значение продолжения жизни.
- source_word: እኩያት
  choice: злы
  rationale: Прямо передаёт нравственную оценку источника, не смягчая её до «плохи» и не уточняя её характер.
theological_decisions:
- issue: Характер оценки дочерей Ханаана
  choice: «злы»
  alternative: «нечестивы» или «плохи»
  rationale: Источник даёт общую отрицательную нравственную характеристику; «злы» сохраняет её силу, не добавляя специально религиозного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены условная конструкция, эмоциональный риторический вопрос и обобщающая нравственная оценка.
