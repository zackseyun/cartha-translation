  text: And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”
translation:
  language: ru
  text: И если Иаков возьмёт себе жену из дочерей этой земли, подобных этим, то зачем мне ещё жить? Ведь дочери Ханаана злы».
