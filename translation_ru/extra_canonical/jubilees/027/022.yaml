base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: ru
  text: И вышел Иаков из Колодца Клятвы, чтобы идти в Харан, в первый год второй седмины сорок четвёртого юбилея. И пришёл он в Луз, что в горах, то есть в Вефиль, в новолуние первого месяца этой седмины. Под вечер он пришёл к одному месту и в ту ночь свернул со своего пути к западу от дороги[a]. И он спал там, потому что солнце уже зашло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Синтаксис геэзской фразы допускает также перевод: «и в ту ночь он свернул со своего пути». Однако слова могут указывать направление: «к западу от дороги».'
    reason: Уточняет, что примечание отражает переводческую неоднозначность синтаксиса, а не засвидетельствованный текстовый вариант; при этом сохраняет указание направления, присутствующее в основном переводе.
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: Колодец Клятвы
  rationale: Передаёт значение географического названия, соответствующего Вирсавии, и сохраняет его смысловую форму в данном источнике.
- source_word: ሱባዔ
  choice: седмина
  rationale: Обозначает семилетний период в юбилейной хронологии; «седмина» ясно отличает его от обычной календарной недели.
- source_word: በሠርቀ፡ ወርኅ
  choice: в новолуние
  rationale: Буквально связано с появлением новой луны и в контексте обозначает первый день месяца.
- source_word: መካነ፡ መሴየ
  choice: к одному месту под вечер
  rationale: Сохраняет неопределённость слова «место» и передаёт вечернее время естественным русским выражением.
- source_word: እምፍኖቱ
  choice: со своего пути
  rationale: Учитывает местоименный суффикс третьего лица мужского рода.
- source_word: እንተ፡ ዐረበን፡ ለመንገደ
  choice: к западу от дороги
  rationale: Сохраняет присутствующее в геэзском тексте указание направления, не опуская его, как в одном из прежних вариантов.
theological_decisions:
- issue: Юбилейная система летосчисления
  choice: в первый год второй седмины сорок четвёртого юбилея
  alternative: в первый год второй недели сорок четвёртого юбилея
  rationale: «Седмина» предотвращает ошибочное понимание как обычной семидневной недели и сохраняет особую хронологию книги.
- issue: Отождествление Луза и Вефиля
  choice: Луз, что в горах, то есть Вефиль
  alternative: Луз в горной местности, который есть Вефиль
  rationale: Передаёт прямое отождествление двух названий без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «И» сохранён как характерная повествовательная связка, но заключительная часть слегка сглажена ради естественного русского синтаксиса.
