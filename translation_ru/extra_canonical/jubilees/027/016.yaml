  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: ru
  text: И после того как Иаков встал, чтобы отправиться в Месопотамию, дух Ревекки скорбел о её сыне, и она плакала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ፡ ያዕቆብ፡ ሰሐዊረ
  choice: Иаков встал, чтобы отправиться
  rationale: Передаёт последовательность «встал/поднялся, чтобы идти» естественным современным русским языком, не сводя действие лишь к пробуждению.
- source_word: መስጶጦሚያ
  choice: Месопотамию
  rationale: Устоявшееся русское географическое название, соответствующее форме источника.
- source_word: ሐዘነ፡ መንፈሰ፡ ርብቃ
  choice: дух Ревекки скорбел
  rationale: Сохраняет выражение источника с «духом» как субъектом скорби, не заменяя его более свободным «Ревекка опечалилась».
- source_word: ድኅረ፡ ወልዳ
  choice: о её сыне
  rationale: В контексте скорби послеложное выражение естественно обозначает предмет переживания; русский предлог «о» не создаёт ложного временного значения.
- source_word: ወትበኪ
  choice: и она плакала
  rationale: Прямая и естественная передача женской формы глагола.
