  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: ru
  text: 'И пробудился Иаков от сна и сказал: «Воистину, это место — дом Господа, а я не знал». И устрашился он и сказал: «Как страшно это место! Это не что иное, как дом Господа, и это — врата небес».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: «воистину»
  rationale: Передаёт уверенное подтверждение и внезапное осознание Иакова, сохраняя возвышенный, но понятный регистр.
- source_word: ግሩም
  choice: «страшно»
  rationale: Сохраняет сочетание благоговейного трепета и страха в контексте непосредственного ወፈርሀ («и устрашился»), не сводя смысл лишь к восхищению.
- source_word: ቤተ፡ እግዚአብሔር
  choice: «дом Господа»
  rationale: Прямой и традиционно понятный эквивалент исходного выражения.
- source_word: አንቀጸ፡ ሰማይ
  choice: «врата небес»
  rationale: Буквально и естественно передаёт образ небесных врат; множественное число «врата» соответствует русскому литературному и библейскому употреблению.
theological_decisions:
- issue: Характер определения места как ግሩም
  choice: «Как страшно это место!»
  alternative: «Как внушает трепет это место!» / «Как дивно это место!»
  rationale: Выбрано «страшно», поскольку непосредственно перед этим сказано, что Иаков устрашился; формулировка сохраняет богословское напряжение между страхом и благоговением и не ослабляет исходный образ.
- issue: Утверждение о месте как доме Господа
  choice: «это место — дом Господа»
  alternative: «дом Господа — это место»
  rationale: Порядок слов естественен для современного русского языка и сохраняет смысл исходного отождествления, не добавляя идеи, будто Божье присутствие ограничено данным местом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет повтор «и сказал» и параллелизм исходного текста; архаизмы сведены к общепонятным формам «воистину» и «врата».
