  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: ru
  text: И встал Иаков рано утром, взял камень, который положил у изголовья, поставил его столбом в знак и возлил масло на его верхушку. И назвал он то место Вефилем, а прежде та область называлась Лузом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀበ፡ ርእሱ፡
  choice: у изголовья
  rationale: Буквально выражение связано с местом «у его головы»; «у изголовья» естественно по-русски и не утверждает, что камень служил подушкой.
- source_word: ሐውልተ፡ ለትእምርት፡
  choice: как памятный столб
  rationale: Сочетание обозначает воздвигнутый камень как знак или памятник; этот вариант естественно передаёт обе составляющие без лишнего пояснения.
- source_word: ቅብአ፡
  choice: масло
  rationale: В данном повествовательном контексте речь идёт о масле, возливаемом на верх каменного столба.
- source_word: ብሔር፡
  choice: область
  rationale: Слово может обозначать страну, землю или область; здесь «область» сохраняет различие между названным местом и более широкой территорией.
