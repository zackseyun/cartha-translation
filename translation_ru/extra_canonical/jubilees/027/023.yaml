lexical_decisions:
- source_word: የሐውር (yaḥawwer)
  choice: странствуя
  rationale: Глагол от ሐወረ означает «идти, ходить, путешествовать». В контексте пути Иакова передаёт продолжительное путешествие и одновременно сохраняет связь с передвижением пешком.
- source_word: ውእቱ ዕፅ (wəʾətu ʿəṣ)
  choice: тем деревом
  rationale: Указательное местоимение перед существительным требует передачи значения «то/это дерево»; форма творительного падежа обусловлена русским предлогом «под» при обозначении места.
- source_word: ወውእቱ ባሕቲቱ (wə-wəʾətu baḥtitu)
  choice: в одиночестве
  rationale: Естественно передаёт усиленное указание на то, что он был один, без добавления отсутствующих в источнике подробностей.
