  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: ru
  text: 'Иаков сказал своей матери Ревекке: «Ты ведь знаешь, что мой отец состарился и уже не видит, потому что глаза его ослабели. Если я оставлю его, это будет злом в его глазах, ведь я оставил его и ушёл от вас».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ушёл от вас»; в исходном тексте местоимение стоит во множественном числе.'
    reason: Ревекка — единственная названная собеседница, но геэзский текст сохраняет множественное число; примечание не позволяет молча заменить его единственным.
lexical_decisions:
- source_word: ናሁ፡ ታእምሪ
  choice: «Ты ведь знаешь»
  rationale: ናሁ буквально вводит высказывание как «вот», однако в данном обращении естественное русское «ведь» передаёт настойчивое указание на уже известное Ревекке обстоятельство.
- source_word: ረሰአ፡ አቡየ
  choice: «мой отец состарился»
  rationale: Передаёт прямой смысл глагола без стилистически устаревшего «сделался стар».
- source_word: ክቡዳ፡ አዕይንቲሁ
  choice: «глаза его ослабели»
  rationale: Буквально глаза названы «тяжёлыми»; по контексту это идиоматическое описание ослабевшего зрения. Выбор сохраняет телесный образ, но звучит естественно по-русски.
- source_word: እኩይ፡ ውእቱ፡ በቅድመ፡ አዕይንቲሁ
  choice: «это будет злом в его глазах»
  rationale: Формулировка сохраняет буквальный образ и нравственную оценку отца, не сводя её к более слабому «ему это не понравится».
- source_word: ወአሐውር፡ እምኔክሙ
  choice: «и уйду от вас»
  rationale: Сохранено множественное число суффикса ክሙ, хотя непосредственная собеседница — Ревекка; неоднозначность референта не устраняется.
theological_decisions:
- issue: Нравственная оценка ухода Иакова
  choice: «это будет злом в его глазах»
  alternative: «это будет дурно перед ним»
  rationale: 'Сохранено напряжение исходного текста: поступок назван злом с точки зрения Исаака, без утверждения рассказчика о его абсолютной нравственной оценке.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан ясным для обычного читателя; при этом сохранены библейский образ «в его глазах» и неоднозначное множественное число в последней фразе.
