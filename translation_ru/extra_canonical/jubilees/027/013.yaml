  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: ru
  text: И да благословит тебя Бог Всемогущий, и да сделает тебя плодовитым, и да умножит тебя, и да станешь ты собранием народов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: Бог Всемогущий
  rationale: Сочетание передаёт божественное имя/титул «Бог Шаддай»; общеупотребительный и понятный русский эквивалент — «Бог Всемогущий».
- source_word: ያልህቀ
  choice: сделает тебя плодовитым
  rationale: Глагол выражает идею плодородия или произведения многочисленного потомства; такая формулировка естественна по-русски и сохраняет связь с продолжением рода.
- source_word: ያብዝኀከ
  choice: умножит тебя
  rationale: Буквально сохраняет идею численного умножения потомства и торжественный библейский строй.
- source_word: መክብበ፡ አሕዛብ
  choice: собранием народов
  rationale: Передаёт коллективное множество народов, не уточняя сверх исходного текста характер их единства.
theological_decisions:
- issue: Значение титула «Шаддай»
  choice: Бог Всемогущий
  alternative: Бог Шаддай
  rationale: Перевод раскрывает традиционно понимаемое значение титула для современного читателя, не вводя конфессионально специфического толкования.
- issue: Форма благословения и итогового обещания
  choice: «да благословит… да сделает… да умножит… и станешь»
  alternative: «пусть благословит… сделает… умножит… и пусть станешь»
  rationale: Сохранена молитвенно-благословительная модальность первых глаголов и переход к предсказанию/пожеланию в последней части, насколько это допускает русский синтаксис.
translation_notes:
  register: Современный литературный русский с достоинством библейского благословения. Синтаксический параллелизм сохранён; архаизмы сведены к умеренной формуле «да».
