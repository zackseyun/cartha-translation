  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: ru
  text: И будет потомство твоё как прах земной, и распространишься ты к морю[a], к востоку, к северу и к югу. И благословятся в тебе и в потомстве твоём все земли народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть к западу: в библейской географической речи море обозначает западное направление.'
    reason: Сохраняет буквальное «к морю» и одновременно делает понятным его направительное значение.
lexical_decisions:
- source_word: ዘርእከ (zarʾəka)
  choice: потомство твоё
  rationale: Передаёт собирательное значение «семя, потомство» естественным современным русским языком и сохраняет повтор этого слова в заключительной формуле.
- source_word: ባሕር (bāḥr)
  choice: море
  rationale: Источник буквально называет море, а не запад; буквальный образ сохранён, при этом подразумеваемое направление пояснено в сноске.
- source_word: በሐውርተ አሕዛብ (baḥāwerte ʾaḥzāb)
  choice: все земли народов
  rationale: Следует засвидетельствованному в данном эфиопском тексте значению «земли/страны народов», не подменяя его формулировкой «семьи народов» из параллельной традиции.
- source_word: ኖላ ምድር (nolā mədr)
  choice: прах земной
  rationale: Достоинная и узнаваемая русская передача сравнения с земной пылью, сохраняющая библейский образ.
theological_decisions:
- issue: Круг получателей благословения
  choice: «все земли народов»
  alternative: «все семьи народов»
  rationale: Выбрано буквальное чтение данного эфиопского свидетельства; более знакомая формула из Бытия не импортирована в текст Юбилеев.
- issue: Посредство благословения
  choice: «в тебе и в потомстве твоём»
  alternative: перефразировать как «через тебя и твоих потомков»
  rationale: Сохранена конструкция и богословская напряжённость источника без уточнения того, означает ли предлог местонахождение, основание или посредство благословения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксический параллелизм и повтор «в тебе и в потомстве твоём» сохранены; архаизмы сведены к узнаваемому образу «прах земной».
