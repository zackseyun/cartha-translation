  text: And Isaac called Jacob and blessed him and charged him and said to him, “Do not take a wife for yourself from any of the daughters of Canaan.
translation:
  language: ru
  text: 'Исаак позвал Иакова, благословил его, повелел ему и сказал: «Не бери себе жену ни из одной из дочерей Ханаана».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዐ
  choice: позвал
  rationale: Передаёт обычное значение глагола «звать, призывать» естественным современным русским языком.
- source_word: ባረኮ
  choice: благословил его
  rationale: Прямо сохраняет религиозно значимый глагол «благословлять» и объектное местоимение.
- source_word: ነሠጾ
  choice: дал ему повеление
  rationale: В данном контексте глагол обозначает не просто сообщение, а обязательное наставление; эта формулировка сохраняет силу запрета в последующей прямой речи.
- source_word: ኢትነሣእ፡ ለከ፡ ብእሲተ
  choice: не бери себе жену
  rationale: Естественный русский эквивалент конструкции со значением взятия женщины в жёны.
- source_word: እምኵሉ፡ አዋልደ፡ ከናአን
  choice: ни из одной из дочерей Ханаана
  rationale: Отрицательная конструкция передаёт охват «из всех/любой из» без двусмысленного русского «из всех дочерей».
theological_decisions:
- issue: Характер наставления Исаака
  choice: дал ему повеление
  alternative: наставил его
  rationale: Источник и контекст поддерживают обязательный характер речи; при этом перевод не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет последовательность действий оригинала, но избегает избыточно архаичного «призвал» и неестественного «заповедал ему».
