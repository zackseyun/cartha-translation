  source_fidelity: 'Содержание передано точно: Исаак обращается к Иакову, благословляет его, даёт обязательное наставление и запрещает брать жену из дочерей Ханаана. Однако глагол ነሠጾ, соответствующий английскому audit trail «charged him», лучше передать явным повелением, а не несколько тяжеловесным оборотом «дал ему повеление».'
