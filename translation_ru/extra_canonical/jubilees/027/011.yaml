  terminology: Имена «Исаак», «Иаков» и этноним «Ханаан» переданы в принятой русской библейской форме. «Благословил» и «жена» точны по регистру и смыслу. Формула «ни из одной из дочерей Ханаана» верно передаёт запрет в отношении любой дочери Ханаана.
