  to: И если я возвращусь с миром в дом моего отца, то Господь будет моим Богом, а этот камень, который я поставил на этом месте как столб в знак, будет домом Господа. И из всего, что Ты дашь мне, я непременно отдам Тебе десятую часть, Боже мой».
  rationale: 'Добавлен «если» для нормативной русской передачи продолжающейся условной конструкции, сохранено начальное «И» как связь с предыдущим контекстом. Описание камня перестроено без смыслового добавления: камень поставлен на данном месте как столб, служащий знаком. Неоднозначный образ, согласно которому камень будет «домом Господа», сохранён.'
