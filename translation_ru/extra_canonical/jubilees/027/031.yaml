  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: ru
  text: И если я возвращусь с миром в дом моего отца, то Господь будет моим Богом, а этот камень, который я поставил на этом месте как столб в знак, будет домом Господа. И из всего, что Ты дашь мне, я непременно отдам Тебе десятую часть, Боже мой».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአትመየጥ
  choice: и я возвращусь
  rationale: Форма продолжает условную последовательность обета; будущее совершенного вида естественно передаёт предполагаемое возвращение.
- source_word: በሰላም
  choice: с миром
  rationale: Сохраняет буквальный образ и широкий смысл благополучного, невредимого возвращения.
- source_word: ሐውልተ፡ ለትእምርት
  choice: памятный столб в знак
  rationale: Передаёт и предмет — установленный каменный столб, и прямо названную знаковую функцию, не сводя выражение к одному слову.
- source_word: ቤተ፡ እግዚአብሔር
  choice: домом Господа
  rationale: Формально сохраняет сакральное обозначение места без уточнения, которого нет в источнике.
- source_word: አሡር፡ ለከ
  choice: отдам Тебе десятую часть
  rationale: Передаёт действие отделения десятой доли адресату; наречие «непременно» отражает усилительную конструкцию.
theological_decisions:
- issue: Условная формулировка «Господь будет моим Богом»
  choice: то Господь будет моим Богом
  alternative: и Господь будет моим Богом
  rationale: «То» ясно связывает эту фразу с предыдущими условиями обета и сохраняет присущую тексту богословскую напряжённость, не превращая её в безусловное исповедание.
- issue: Камень как «дом Господа»
  choice: этот камень… будет домом Господа
  alternative: на этом месте будет дом Господа
  rationale: Сохранена грамматическая связь камня с «домом Господа», хотя образ допускает понимание камня как обозначения священного места; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Местоимения, обращённые к Богу, написаны с прописной буквы. Начальное «и» сохранено, поскольку стих продолжает условный обет предыдущего контекста.
