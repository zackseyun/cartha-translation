  text: And now, my son, listen to my voice. Rise and flee to Laban my brother, to Haran, and stay with him a few days, until your brother’s anger turns away,
translation:
  language: ru
  text: 'А теперь, сын мой, послушай, что я скажу: встань, беги в Харран к Лавану, моему брату, и поживи у него несколько дней, пока не утихнет гнев твоего брата,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ
  choice: послушайся меня
  rationale: Буквально «услышь мой голос»; в данном контексте это естественный призыв принять совет и поступить согласно ему.
- source_word: ወጐየይ
  choice: беги
  rationale: Передаёт срочное бегство, а не просто быстрое передвижение.
- source_word: ሐራንሃ
  choice: в Харран
  rationale: Форма обозначает место назначения; современное русское написание библейского топонима — «Харран».
- source_word: ንበር፡ ምስሌሁ
  choice: поживи у него
  rationale: Естественно передаёт временное пребывание вместе с Лаваном.
- source_word: ኅዳጠ፡ መዋዕለ
  choice: несколько дней
  rationale: Прямое и идиоматичное соответствие выражению о кратком сроке.
- source_word: እስከ፡ ይትመየጥ፡ መዐተ፡ እኁከ
  choice: пока не утихнет гнев твоего брата
  rationale: Глагол буквально связан с обращением/отступлением; по-русски применительно к гневу естественно «утихнет».
