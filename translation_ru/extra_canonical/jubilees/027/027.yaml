  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: ru
  text: И вот, Я буду с тобой и сохраню тебя, куда бы ты ни пошёл, и возвращу тебя в эту землю с миром. Я не оставлю тебя, пока не исполню всего, что сказал тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነየ
  choice: И вот
  rationale: Передаёт вводную частицу, привлекающую внимание, в возвышенном, но понятном современном русском регистре.
- source_word: እዐቅበከ
  choice: сохраню тебя
  rationale: Глагол имеет значение охраны и сохранения; формулировка естественна в данном обещании о пути.
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: куда бы ты ни пошёл
  rationale: Идиоматично передаёт всеохватность исходного выражения применительно ко всем местам странствия.
- source_word: ወአገብአከ
  choice: и возвращу тебя
  rationale: 'Сохраняет каузативный смысл: говорящий приведёт адресата обратно.'
- source_word: በሰላም
  choice: с миром
  rationale: Сохраняет явное упоминание мира и возможный оттенок благополучного возвращения, не сужая смысл до одного лишь «невредимым».
- source_word: ኢየኀድገከ
  choice: не оставлю тебя
  rationale: Прямо передаёт обещание не покидать адресата.
theological_decisions:
- issue: Объём обещания «пока не исполню»
  choice: пока не исполню всего, что сказал тебе
  alternative: пока не сделаю всё, о чём говорил тебе
  rationale: «Исполню» естественно относится к обещанному Богом и сохраняет завершённость действия, не добавляя идеи, будто присутствие прекратится после исполнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Местоимения, относящиеся к Богу как говорящему, написаны с прописной буквы согласно распространённой русской издательской практике.
