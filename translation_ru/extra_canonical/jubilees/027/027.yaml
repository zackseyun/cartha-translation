  source_fidelity: 'Перевод точно передаёт все основные элементы геэзского текста: вводное «вот», обещание присутствия и охраны, всеохватность пути, возвращение в эту землю «с миром», а также обещание не оставить адресата до исполнения сказанного. «Возвращу» согласуется с контекстуальным значением возвращения в землю и с английской контрольной формулировкой “bring you back”.'
