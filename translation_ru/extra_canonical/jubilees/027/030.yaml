  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: ru
  text: 'И помолился Иаков Господу, говоря: «Если Господь будет со мной и сохранит меня на этом пути, которым я иду, даст мне хлеб для еды и одежду, чтобы одеться,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ፡ ለእግዚአብሔር
  choice: помолился Господу
  rationale: Естественно передаёт эфиопскую конструкцию «помолился молитвой Господу», избегая ненужного для современного русского повтора.
- source_word: ዐቀበኒ
  choice: сохранит меня
  rationale: Передаёт значение охраны и сбережения в пути; «сохранит» уместно в возвышенном, но понятном регистре.
- source_word: በዛቲ፡ ፍኖት፡ እንተ፡ ባቲ፡ እሐውር፡ አነ
  choice: на этом пути, которым я иду
  rationale: Сохраняет указание на конкретный путь и продолжающееся движение Иакова.
- source_word: ኅብስተ፡ እብላዕ
  choice: хлеб для еды
  rationale: Сохраняет простую параллельную формулу источника и буквальный образ хлеба.
- source_word: ልብሰ፡ እልበስ
  choice: одежду, чтобы одеться
  rationale: Воспроизводит смысловую и грамматическую параллель с «хлебом для еды», оставаясь естественным по-русски.
theological_decisions:
- issue: Условная формула об отношении Господа к Иакову
  choice: Если Господь будет со мной
  alternative: Если Бог будет со мной
  rationale: Источник употребляет титул እግዚአብሔር, соответствующий «Господь»; условная форма сохранена без истолкования как сомнения, обета или уверенности.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис условного предложения и незавершённость стиха сохранены, поскольку фраза продолжается в следующем стихе.
