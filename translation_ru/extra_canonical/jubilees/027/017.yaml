  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: ru
  text: 'Исаак сказал Ревекке: «Сестра моя, не плачь о сыне моём Иакове, потому что он уйдёт с миром и с миром возвратится».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅትየ
  choice: сестра моя
  rationale: Прямо сохраняет родственное обращение «моя сестра», не заменяя его более общим или эмоционально окрашенным обращением.
- source_word: ኢትብከዪ
  choice: не плачь
  rationale: Естественная современная передача отрицательного повеления, обращённого к женщине.
- source_word: በእንተ
  choice: о
  rationale: 'В данном контексте обозначает предмет скорби: «о сыне моём Иакове».'
- source_word: በሰላም፡ የሐውር፡ ወበሰላም፡ ይትመየጥ
  choice: он уйдёт с миром и с миром возвратится
  rationale: Сохраняет параллелизм исходного текста и повтор выражения «с миром».
theological_decisions:
- issue: Характер заверения Исаака о пути Иакова
  choice: 'Сохранено простое утверждение будущего: «уйдёт… возвратится»'
  alternative: Передать как пожелание или обещание божественной защиты
  rationale: Исходный текст формулирует уверенное предсказание, но не называет прямо ни его источник, ни действующее божество; добавлять это означало бы разрешить сохранённую текстом неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов слегка адаптирован ради естественности, при этом повтор и симметрия заключительной фразы сохранены.
