  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: ru
  text: Всевышний Бог сохранит его от всякого зла и будет с ним, потому что не оставит его во все дни его жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: Всевышний Бог
  rationale: 'Сохраняет титул и порядок смысловых компонентов: «Бог Всевышний»; выбран естественный для современного русского сочетательный порядок.'
- source_word: የዐቅቦ
  choice: сохранит его
  rationale: Передаёт значение охраны и оберегания; «сохранит» звучит естественно в библейском контексте и сохраняет объект мужского рода.
- source_word: እምኵሉ፡ እኩይ
  choice: от всякого зла
  rationale: Формально и идиоматично передаёт универсальное выражение «от всего/всякого зла».
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: и будет с ним
  rationale: Прямо воспроизводит обещание присутствия без дополнительного истолкования.
- source_word: ኢየኀድጎ
  choice: не оставит его
  rationale: Передаёт отрицательную форму глагола со значением оставления или покидания.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: во все дни его жизни
  rationale: Буквально выражение означает «все его дни»; добавление «жизни» делает русский оборот ясным, не изменяя смысла.
theological_decisions:
- issue: Характер Божьей защиты
  choice: сохранит его от всякого зла
  alternative: оградит его от всякой беды
  rationale: «Зло» сохраняет более широкий и намеренно неуточнённый смысл እኩይ, не сводя обещание только к бедствиям.
- issue: Основание обещания
  choice: потому что не оставит его
  alternative: ибо Он не оставит его
  rationale: Связь причины сохранена; местоимение «Он» не добавлено, поскольку субъект ясен из контекста, а современная фраза остаётся плавной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис ясен для широкого читателя; архаизмы и конфессионально маркированные формулы не используются.
