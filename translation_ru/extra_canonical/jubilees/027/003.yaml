lexical_decisions:
- source_word: ወየኀድግ፡ መዐተ፡ እምኔከ
  choice: пока он не отвратит от тебя свой гнев
  rationale: Глагол передаёт прекращение или отведение гнева; «гнев» понимается как объект действия, а не как подлежащее. Русская формулировка сохраняет образ исходного текста и звучит естественно.
- source_word: ወይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  choice: и не забудет всего, что ты ему сделал
  rationale: Прямо передаёт полноту «всего» и действие адресата по отношению к брату.
- source_word: ወፈነውየ፡ አቄብለከ፡ እምህየ
  choice: Тогда я пошлю за тобой и возвращу тебя оттуда
  rationale: Последовательность двух действий — послать и вернуть — сохранена; «пошлю за тобой» естественно выражает подразумеваемую отправку людей или вести.
