- from: 'И во сне Ревекке было открыто дело Исава, её старшего сына. Тогда Ревекка послала за Иаковом, своим младшим сыном, позвала его и сказала ему: «Вот, Исав, брат твой, затаил на тебя злобу и хочет убить тебя».'
