  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: ru
  text: 'И во сне Ревекке было сообщено о деле Исава, её старшего сына. Ревекка послала за Иаковом, своим младшим сыном, позвала его и сказала ему: «Вот, Исав, брат твой, затаил на тебя злобу, чтобы убить тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተነግረ ... በሕልም
  choice: во сне ... было открыто
  rationale: Безличная конструкция передаёт сообщение, полученное Ревеккой во сне, и естественно звучит по-русски.
- source_word: ነገሩ ለዔሳው
  choice: дело Исава
  rationale: ነገር здесь обозначает дело или замысел, а не обязательно произнесённые слова.
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: старшего / младшим
  rationale: Сохранено прямое возрастное противопоставление двух сыновей.
- source_word: ይትቄየመከ
  choice: затаил на тебя злобу
  rationale: Глагол передаёт неприязнь, злопамятство или враждебный умысел; такой перевод не импортирует еврейскую идиому «утешается мыслью» из параллельного места Бытия.
- source_word: ከመ ይቅትልከ
  choice: и хочет убить тебя
  rationale: Целевая направленность вражды выражена естественным современным русским оборотом.
