lexical_decisions:
- source_word: እበውእ፡ ወእነግር፡
  choice: «Я войду, поговорю с ним»
  rationale: Передаёт последовательность двух действий — войти и сказать/поговорить; объект речи естественно восстанавливается из контекста по-русски.
- source_word: ወይፈንወከ።
  choice: «и он отправит тебя»
  rationale: Глагольная форма с объектным суффиксом второго лица означает, что он пошлёт/отправит Иакова; в контексте речь идёт об отправлении Иакова прочь, а не о вызове его к себе.
