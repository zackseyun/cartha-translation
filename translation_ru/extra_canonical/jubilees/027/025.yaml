  yaml_path: translation/extra_canonical/jubilees/027/025.yaml
  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: ru
  text: 'И Он говорил с Иаковом и сказал: «Я — Господь, Бог Авраама, отца твоего, и Бог Исаака. Землю, на которой ты спишь, Я дам тебе и потомству твоему после тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተናገረ፡ ምስለ፡ ያዕቆብ
  choice: говорил с Иаковом
  rationale: Предлог ምስለ означает «с»; формулировка сохраняет отличие от простого «сказал Иакову», после чего источник отдельно вводит прямую речь глаголом ወይቤ («и сказал»).
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычная русская библейская передача традиционного обозначения Бога в данном самооткровении.
- source_word: ትነውም
  choice: ты лежишь
  rationale: Глагол обозначает лежание/пребывание лёжа; контекст сна подразумевается сценой, но добавление «спишь» не обязательно и сделало бы перевод более определённым, чем форма источника.
- source_word: ዘርእከ
  choice: потомству твоему
  rationale: В контексте обетования собирательное «потомство» естественно передаёт буквальное «семя» и сохраняет коллективный смысл.
- source_word: እምድኅሬከ
  choice: после тебя
  rationale: Передаёт явное временно-преемственное выражение источника без его устранения как якобы избыточного.
theological_decisions:
- issue: Кого называет «отцом» выражение አብርሃም፡ አቡከ
  choice: «Авраама, отца твоего» — относится к Аврааму
  alternative: «Бог Авраама, [Бог] отца твоего и Бог Исаака»
  rationale: Синтаксис непосредственно связывает «отца твоего» с Авраамом; это также сохраняет библейское употребление слова «отец» в значении предка, не исправляя текст по параллельному месту Бытия.
- issue: Передача «семени» в обетовании
  choice: «потомству»
  alternative: «семени»
  rationale: Современное русское «потомство» сохраняет собирательную референцию и не навязывает ни исключительно единственное лицо, ни только множество лиц.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «отца твоего» и «потомству твоему» поддерживает достоинство прямой божественной речи, оставаясь понятной современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской религиозно-издательской традицией.
