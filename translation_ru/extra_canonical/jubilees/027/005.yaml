- source_word: ኢይሥአን
  choice: не лишиться бы мне
  rationale: Отрицательная форма глагола передаёт опасение матери остаться без детей; по-русски конструкция с «не… бы» естественно выражает тревожное пожелание.
- source_word: እምክልኤቱ ውሉድየ
  choice: обоих моих сыновей
  rationale: 'Буквально: «из/от обоих моих детей»; в контексте речь идёт о двух сыновьях, поэтому «обоих моих сыновей» точно и естественно.'
- source_word: በአሐቲ ዕለት
  choice: в один день
  rationale: Прямое соответствие геэзскому выражению, сохраняющее временной акцент исходного текста.
