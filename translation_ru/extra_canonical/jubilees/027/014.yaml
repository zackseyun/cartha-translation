  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: ru
  text: «И да дарует Он тебе благословения[a] отца моего, Авраама, — тебе и твоему потомству после тебя, — чтобы ты унаследовал землю, где ты живёшь как пришелец, и всю землю, которую Бог дал Аврааму. Иди, сын мой, с миром».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых параллельных формулировках: «благословение»; в геэзском тексте здесь стоит множественное число.'
    reason: Фиксирует текстовую и переводческую особенность, не заменяя форму исходного текста чтением из библейской параллели.
lexical_decisions:
- source_word: በረከታቲሁ
  choice: благословения
  rationale: Форма в геэзском тексте является множественным числом; поэтому сохранено «благословения», а не единственное «благословение».
- source_word: ዘርእከ
  choice: твоему потомству
  rationale: «Потомство» естественно передаёт собирательное значение «семени» в генеалогическом контексте.
- source_word: ምድረ፡ ፍልሰትከ
  choice: землю, в которой живёшь как пришелец
  rationale: Передаёт смысл земли временного проживания/странствования ясным современным русским языком, сохраняя положение пришельца.
- source_word: በሰላም
  choice: с миром
  rationale: Сохраняет традиционную и естественную формулу мирного напутствия.
theological_decisions:
- issue: Число слова «благословение»
  choice: 'Множественное число: «благословения»'
  alternative: 'Единственное число: «благословение»'
  rationale: Геэзская форма множественного числа должна определять основной текст, даже если параллельная формулировка Бытия 28:4 известна в единственном числе.
- issue: Объём обещанной земли
  choice: 'Сохранены оба выражения: земля проживания пришельцем и вся земля, данная Аврааму'
  alternative: Объединить их в одно обозначение обетованной земли
  rationale: Источник различает эти выражения; их нельзя безосновательно отождествлять или сливать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «да дарует» сохраняет пожелание, а «живёшь как пришелец» делает древнее выражение понятным без устранения его смысловой особенности.
