  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: ru
  text: 'И в ту ночь ему приснился сон: вот, лестница стоит на земле, а вершина её достигает неба; и вот, ангелы Божьи поднимаются и спускаются по ней; и вот, Бог стоит на ней.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над ней».'
    reason: Смысл пространственного выражения допускает понимание положения Бога как на лестнице либо над ней.
lexical_decisions:
- source_word: መዓርግ
  choice: лестница
  rationale: В контексте сна Иакова обозначает сооружение, соединяющее землю и небо; «лестница» — естественный и традиционно узнаваемый русский эквивалент.
- source_word: ትክልት፡ ውስተ፡ ምድር
  choice: стоит на земле
  rationale: Передаёт образ установленной на земле лестницы естественным современным русским оборотом без лишнего уточнения способа установки.
- source_word: ትበጽፍ፡ ውስተ፡ ሰማይ
  choice: достигает неба
  rationale: Сохраняет пространственный образ вершины лестницы, доходящей до неба.
- source_word: እግዚአብሔር
  choice: Бог
  rationale: В данном издании и контексте слово передано как общее обозначение Бога; это также согласуется с сочетанием «ангелы Божьи» в том же стихе.
- source_word: ውስቴታ
  choice: на ней
  rationale: Форма допускает пространственное значение «в/на ней»; «на ней» ближе к геэзскому выражению, чем однозначное «над ней», и сохраняет исходную напряжённость образа.
theological_decisions:
- issue: Положение Бога относительно лестницы
  choice: стоит на ней
  alternative: стоит над ней
  rationale: Геэзское ውስቴታ скорее выражает «в ней/на ней», тогда как «над ней» потребовало бы более явно обозначающего высоту предлога. Неоднозначность отмечена в сноске, а в основном тексте избран наиболее формально близкий вариант.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Повтор «и вот» сохранён как структурная особенность видения; архаическое «се» не используется. Формулировки ясны обычному читателю и не устраняют пространственную неоднозначность заключительной фразы.
