lexical_decisions:
- source_word: ቦአት
  choice: вошла
  rationale: Прямое соответствие глаголу движения; сохраняет повествовательную последовательность.
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: мне опротивела жизнь
  rationale: Передаёт сильное отвращение к собственной жизни естественным современным русским оборотом, не ослабляя эмоциональной силы.
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: из-за двух дочерей Хета
  rationale: Сохраняет число и этноним исходного текста; «из-за» естественно выражает причину.
- source_word: እለ፡ ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: которых Исав взял себе в жёны
  rationale: Формально и идиоматично передаёт относительное предложение и возвратное значение «себе».
