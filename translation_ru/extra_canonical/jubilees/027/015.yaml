lexical_decisions:
- source_word: ወፈነዎ
  choice: И ... отпустил
  rationale: Глагол передаёт отправление или отпускание человека; «отпустил» естественно соответствует контексту ухода Иакова.
- source_word: መስጶጦሚያ
  choice: Месопотамию
  rationale: Сохранено традиционное географическое название.
- source_word: ሶርያዊ
  choice: Сирийца
  rationale: Этноним передан традиционным русским соответствием; он относится к Вафуилу.
- source_word: እሙ፡ ለያዕቆብ
  choice: матери Иакова
  rationale: Конструкция прямо уточняет, что Ревекка — мать Иакова; явное имя Иакова в конце не опущено.
