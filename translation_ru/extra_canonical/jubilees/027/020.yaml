  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: ru
  text: Не бойся за него, сестра моя, ведь он праведен на своём пути, и он человек непорочный, и он верен, и не будет оставлен. Не плачь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሪትዕ
  choice: праведен
  rationale: Передаёт нравственную прямоту и правильность поведения; в сочетании «праведен на своём пути» сохраняет образ исходного текста.
- source_word: በፍኖቱ
  choice: на своём пути
  rationale: Форма стоит в единственном числе; «на пути» естественнее по-русски и сохраняет метафору жизненного поведения.
- source_word: ፍጹም ውእቱ ብእሲ
  choice: он человек непорочный
  rationale: Здесь «непорочный» естественно выражает цельность и безупречность человека, не сводя выражение к абстрактному совершенству.
- source_word: ምእመን
  choice: верен
  rationale: Сохраняет возможные оттенки надёжности и верности без уточнения объекта веры или верности.
- source_word: ወኢይትገደፍ
  choice: и не будет оставлен
  rationale: Передаёт пассивную форму и сохраняет неуказанным того, кто его не оставит.
theological_decisions:
- issue: Неуказанный субъект в «не будет оставлен»
  choice: Сохранена пассивная конструкция без называния Бога или иного действующего лица.
  alternative: «Бог его не оставит»
  rationale: В исходном тексте действующее лицо прямо не названо; его добавление устранило бы подлинную недосказанность.
- issue: Значение ምእመን
  choice: «верен»
  alternative: «верующий»
  rationale: «Верен» лучше сохраняет контекстуальный оттенок надёжности и не вносит лишнего уточнения о содержании веры.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к форме оригинала. Сохранены последовательные союзы «и», характерные для исходного текста; обращение «сестра моя» передано без архаизации.
