lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: в третью часть дня
  rationale: Сохраняет буквальный временной оборот источника и связь с предшествующим контекстом.
- source_word: ምካይዳ፡ ለምሥዋዕ
  choice: к основанию жертвенника
  rationale: В данном культовом контексте обозначает нижнюю часть, основание жертвенника, куда приносили кровь; «порог» по-русски звучал бы неточно.
- source_word: ሥብሖ
  choice: её жир
  rationale: Передаёт жертвенный жир животного; местоимение согласовано с подразумеваемой жертвой.
- source_word: ጥቡሰ፡ በእሳት
  choice: испечённое на огне
  rationale: Естественная современная передача мяса, приготовленного непосредственным жаром огня; избегает менее уместного «поджаренное».
- source_word: ዐጸደ፡ ቤት
  choice: во дворе дома
  rationale: Формально передаёт «двор дома», не уточняя сверх источника, какой именно дом имеется в виду.
theological_decisions:
- issue: Идентификация «дома» как святилища или дома Господа
  choice: дом
  alternative: дом Господа / святилище
  rationale: Источник говорит просто «дом»; контекст может указывать на сакральное пространство, но добавление уточнения устранило бы сохранённую в тексте неявность.
- issue: Модальность ритуальных предписаний
  choice: пусть они принесут… положат… и съедят
  alternative: они должны принести… положить… и съесть
  rationale: Конструкция с «пусть» естественно передаёт предписывающую силу исходных форм, не усиливая её до явно выраженной обязанности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным ритуальным регистром. Начальная строчная буква сохранена, поскольку стих начинается продолжением предложения из предыдущего стиха.
