lexical_decisions:
- source_word: በጊዜሁ
  choice: в назначенное для неё время
  rationale: Передаёт указание на установленное время совершения обряда; местоимение согласовано с подразумеваемой пасхальной жертвой.
- source_word: በከመ፡ ትእዛዙ
  choice: согласно предписанию о ней
  rationale: Сохраняет нормативный смысл ትእዛዝ и естественно связывает предписание с пасхальной жертвой.
- source_word: ወኢይከውን፡ ለበሊያቶ
  choice: Нельзя есть её
  rationale: Естественная современная передача безличной конструкции о недозволенности.
- source_word: በአንጻረ
  choice: перед
  rationale: В данном культовом контексте означает нахождение перед святилищем; буквальное пространственное значение «напротив» сохранено в примечании.
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበ[ር]
  choice: И весь народ собрания
  rationale: Передаёт и союз ወ-, и существительное ሕዝብ «народ»; фраза оставлена как начало продолжающегося в следующем стихе предложения.
theological_decisions:
- issue: Обозначение места дозволенной пасхальной трапезы
  choice: перед святилищем ГОСПОДА
  alternative: напротив святилища ГОСПОДА
  rationale: Основной текст использует естественное по-русски культовое выражение, не устраняя пространственный оттенок оригинала, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский с достоинством нормативно-обрядового текста. Конец стиха намеренно оставлен синтаксически незавершённым, поскольку последние слова образуют подлежащее следующего стиха.
