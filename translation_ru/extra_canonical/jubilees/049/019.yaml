lexical_decisions:
- source_word: ሔር፡ እምዓመት፡ በዓመት
  choice: из года в год
  rationale: Естественно передаёт ежегодную повторяемость, выраженную оборотом «от года к году».
- source_word: ቤት
  choice: дом
  rationale: Сохранено прямое обозначение святилища как «дома» без добавления отсутствующего в тексте уточнения «храм».
- source_word: በስመ፡ እግዚአብሔር
  choice: во имя Господа
  rationale: Формально и естественно передаёт устойчивое выражение исходного текста.
- source_word: ህየ፡ የሐሩ፡ ወይጥብሑ
  choice: они пойдут туда и заколют
  rationale: Глагол движения የሐሩ передан явно; ህየ в данном сочетании естественно выражено русским «туда».
- source_word: ጳስካ
  choice: пасхальную жертву
  rationale: В контексте глагола «заколоть» речь идёт о пасхальном жертвенном животном/приношении, а не просто о празднике.
- source_word: እንዘ፡ የዐርብ፡ ፀሐይ
  choice: при заходе солнца
  rationale: Передаёт обстоятельственный оборот о заходящем солнце ясным современным русским выражением.
theological_decisions:
- issue: Значение «дома»
  choice: дом
  alternative: храм
  rationale: Исходное слово буквально означает «дом»; перевод не конкретизирует его как храм сверх формулировки источника.
- issue: Объект заклания на Пасху
  choice: пасхальная жертва
  alternative: Пасха
  rationale: Так по-русски ясно выражается жертвенный смысл при сохранении связи с Пасхой; буквальное «заколют Пасху» звучало бы неестественно и могло бы быть понято как название праздника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена синтаксическая связь с предыдущим стихом посредством начальной строчной буквы и конечной запятой; тетраграмматическое именование передано традиционным «Господь» без искусственного набора прописными буквами.
