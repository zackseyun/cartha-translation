revisions:
- from: 'А ты, Моисей, повели сынам Израиля соблюдать установление о Пасхе, как было заповедано тебе. Напоминай им об этом из года в год и изо дня в день, а также о празднике опресноков: пусть они семь дней едят опресноки, совершают этот праздник и каждый день приносят положенное приношение в течение тех семи дней радости.'
  to: 'А ты, Моисей, повели сынам Израиля соблюдать установление о Пасхе, как было заповедано тебе; говори им из года в год и изо дня в день о празднике опресноков: пусть они семь дней едят опресноки, совершают этот праздник и каждый день приносят приношение в течение тех семи дней радости.'
  rationale: Исправлен глагол речи, чтобы передать исходное повеление без дополнительного оттенка «напоминания», и убрано невыраженное в тексте определение «положенное». Сохранены повторительная временная формула, традиционные термины и различие между «праздником» (በዓል) и «радостью» (ፍሥሓ).
