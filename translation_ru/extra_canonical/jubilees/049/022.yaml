  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: ru
  text: 'А ты, Моисей, повели сынам Израиля соблюдать установление о Пасхе, как было заповедано тебе; говори им из года в год и изо дня в день о празднике опресноков: пусть они семь дней едят опресноки, совершают этот праздник и каждый день приносят приношение в течение тех семи дней радости.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: установление о Пасхе
  rationale: Передаёт сочетание «установление/порядок Пасхи» естественно и без сужения смысла до одного обряда.
- source_word: ዓመተ፡ በለዓመት፡ ወዕለተ፡ ለዕለታት
  choice: из года в год и изо дня в день
  rationale: Сохраняет повторительный характер исходных выражений в естественной русской форме.
- source_word: በዓለ፡ ፍአት
  choice: праздник опресноков
  rationale: Традиционное и понятное русское обозначение праздника; «опресноки» восполняет подразумеваемый хлеб.
- source_word: ቍርባኖ
  choice: положенное приношение
  rationale: Источник говорит о приношении в единственном числе; добавление «положенное» естественно связывает его с предписанным ежедневным обрядом, не уточняя вид жертвы.
- source_word: መዋዕለ፡ ፍሥሓ
  choice: дни радости
  rationale: ፍሥሓ означает радость, веселье или ликование, а не «праздник»; перевод сохраняет это лексическое различие.
theological_decisions:
- issue: Пассивная формула በከመ፡ ተአዘዘ፡ ለከ
  choice: как было заповедано тебе
  alternative: как Господь заповедал тебе
  rationale: Безличный пассив сохраняет формулировку источника и не вводит прямо названного деятеля там, где он не выражен.
- issue: Характер приношения
  choice: приношение
  alternative: жертва
  rationale: Нейтральное «приношение» сохраняет широту ቍርባን и не определяет обрядовую категорию точнее, чем источник.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Сыны Израиля», «опресноки» и «приношение» сохраняют традиционный сакральный регистр; синтаксис разделён на два предложения ради ясности. Начальные слова геэзского фрагмента «его имя в нём…» отнесены к предшествующему стиху согласно предоставленному делению и консультационному тексту.
