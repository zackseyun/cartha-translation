translation:
  language: ru
  text: которое освящено во имя Господа. Они не смогут совершать Пасху ни в своих городах, ни в каком месте, кроме как перед шатром Господа или[a] перед Его домом, где Он обитает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и если не — перед Его домом». Этот оборот может передавать альтернативу («или перед Его домом»); возможно также: «и перед Его домом».'
    reason: Примечание сохраняет буквальную форму геэзского оборота ወአመ፡ አኮ и отмечает допустимую альтернативную передачу без устранения неоднозначности.
lexical_decisions:
- source_word: ዘተቀደሰ፡ በስመ፡ እግዚአብሔር
  choice: которое освящено во имя Господа
  rationale: Сохранена относительная конструкция, продолжающая предыдущий контекст; በስመ передано естественным русским выражением «во имя».
- source_word: ገቢረ፡ ጳስካ
  choice: праздновать Пасху
  rationale: Буквально «совершать/делать Пасху»; в современном русском «праздновать Пасху» ясно передаёт соблюдение пасхального установления.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: шатром Господа
  rationale: ደብተራ обозначает священный шатёр, скинию; «шатёр» понятно современному читателю и сохраняет отличие от следующего «дома».
- source_word: ኀበ፡ ኀደረ
  choice: где Он обитает
  rationale: Глагол ኀደረ здесь указывает на пребывание или обитание; местоимение относится к Господу, а не к Его имени.
theological_decisions:
- issue: Соотношение шатра Господа и Его дома
  choice: «или перед Его домом» с примечанием
  alternative: «и перед Его домом» либо более буквально «а если нет — перед Его домом»
  rationale: Оборот ወአመ፡ አኮ буквально означает «и если не» и идиоматически вводит альтернативу. Перевод «или» лучше выражает противопоставление двух возможных мест, не утверждая, что Пасху следует одновременно совершать перед обоими.
- issue: Кто обитает в доме
  choice: «где Он обитает»
  alternative: «где обитает Его имя»
  rationale: В источнике нет слова «имя» в заключительной части; субъект естественно восстанавливается как Господь.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис упрощён без устранения связи с предыдущим стихом; местоимение «Он» написано с прописной буквы по принятому русскому библейскому обычаю.
