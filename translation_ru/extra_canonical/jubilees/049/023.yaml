  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: ru
  text: пред Господом, на жертвеннике вашего Бога. Ведь вы соблюли этот праздник в спешке, когда вышли из Египта, до того как вошли в пустыню Сур, потому что завершили его на берегу моря.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅድመ፡ እግዚአብሔር
  choice: пред Господом
  rationale: Естественная библейская формула, буквально передающая пространственно-религиозное выражение «перед Господом».
- source_word: ዲበ፡ ምሥዋዐ፡ አምላክክሙ
  choice: на жертвеннике вашего Бога
  rationale: Сохраняет предлог «на» и обращение во множественном числе.
- source_word: በዓለ
  choice: праздник
  rationale: Общее обозначение установленного праздничного торжества без внесения в текст уточнения, отсутствующего в данном фрагменте.
- source_word: በውልዋሌ
  choice: в спешке
  rationale: Передаёт обстоятельственное значение поспешности естественным современным русским выражением.
- source_word: ገበርክምዋ
  choice: вы совершали его
  rationale: Глагол допускает широкое значение «делать, совершать»; применительно к празднику по-русски уместно «совершать», а местоимение согласовано с «праздником».
- source_word: ገዳመ፡ ሱር
  choice: пустыню Сур
  rationale: Традиционная русская форма библейского топонима Шур/Сур передана как «Сур», близко к геэзскому написанию.
- source_word: በኀበ፡ ድንጋገ፡ ባሕር
  choice: на берегу моря
  rationale: Передаёт местное выражение идиоматично; речь идёт о крае или береговой границе моря.
- source_word: ሰበጥክምዋ
  choice: завершили его
  rationale: Сохраняет значение окончания или доведения праздника до завершения, не конкретизируя способ.
theological_decisions:
- issue: Наименование Бога в первой части стиха
  choice: Господом
  alternative: Яхве
  rationale: Геэзский титул እግዚአብሔር традиционно и понятно передаётся как «Господь»; собственное имя здесь прямо не представлено.
- issue: Характер совершения праздника у моря
  choice: завершили его
  alternative: прервали его / закончили его соблюдение
  rationale: Выбрана нейтральная формулировка, которая не вводит дополнительного богословского объяснения того, что именно означало завершение праздника.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; временная последовательность сохранена без устранения некоторой необычности сообщения о празднике, начатом при исходе и завершённом у моря.
