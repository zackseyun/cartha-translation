  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: ru
  text: Пусть весь Израиль совершает его в назначенное ему время. И всякий мужчина, который приходит в тот день, пусть ест его в доме святилища Бога вашего перед Господом — от двадцати лет и старше, потому что…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሮሙ፡ ለእስራኤል፡
  choice: Весь Израиль
  rationale: Передаёт совокупность Израиля естественным современным русским выражением; начальная форма в предоставленном тексте допускает редакционную/текстовую неясность, однако контекст и консультационный слой поддерживают значение всеобщности.
- source_word: ይገበርዎ፡
  choice: пусть совершает его
  rationale: Глагол передан как предписание совершать обряд; местоимение «его» сохраняет отсылку к празднованию Пасхи из контекста.
- source_word: በጊዜሁ።
  choice: в назначенное ему время
  rationale: Суффиксальная форма буквально указывает на «его время»; «назначенное» естественно выражает установленный срок обряда.
- source_word: ኵሉ፡ ሰብእ፡
  choice: всякий мужчина
  rationale: Сохраняет индивидуально-обобщающее значение «каждый/всякий человек, мужчина» и согласуется с последующим возрастным ограничением.
- source_word: ዘመጽአ፡ በዕለቱ፡
  choice: пришедший в тот день
  rationale: Причастная конструкция сохраняет смысл того, кто явился в этот день, не уточняя сверх источника цель или место прихода.
- source_word: ይብልዎ፡
  choice: пусть ест его
  rationale: Передаёт предписывающее значение формы и сохраняет подразумеваемый объект — пасхальную жертву/трапезу — местоимением без поясняющего добавления.
- source_word: በቤተ፡ መቅደሱ፡
  choice: в доме святилища
  rationale: Сохраняет составное выражение «дом святилища», не упрощая его до одного слова «святилище».
- source_word: ለአምላክክሙ፡
  choice: вашего Бога
  rationale: Точно передаёт обращение во множественном числе и принадлежность святилища Богу адресатов.
- source_word: በቅድመ፡ እግዚአብሔር፡
  choice: пред Господом
  rationale: Традиционное, но понятное выражение для пространственно-культового «перед Господом»; заглавное написание обозначает божественный титул.
- source_word: ዘእም፳ዓመት፡ ወላዕለ፡
  choice: от двадцати лет и старше
  rationale: Естественно и точно передаёт нижнюю возрастную границу и всё, что выше неё.
- source_word: እስመ፡
  choice: потому что…
  rationale: Сохраняет причинный союз и намеренную незавершённость стиха, продолжающегося далее.
theological_decisions:
- issue: Характер предписания Израилю
  choice: «пусть совершает»
  alternative: «должен соблюдать»
  rationale: Выбрана форма прямого предписания, не усиливающая юридический оттенок сверх грамматики и сохраняющая обрядовый смысл глагола.
- issue: Культовое место
  choice: «в доме святилища вашего Бога»
  alternative: «в святилище вашего Бога»
  rationale: Более формальный вариант сохраняет оба элемента исходного составного выражения и не устраняет возможный акцент на храмовом доме.
- issue: Незавершённая причинная фраза
  choice: сохранить «потому что…»
  alternative: завершить мысль по следующему стиху
  rationale: Стиховой фрагмент источника заканчивается союзом «потому что»; дополнение из последующего текста нарушило бы заданные границы и могло бы преждевременно разрешить связь предложений.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Устаревшие формы сведены к минимуму; «пред Господом» сохранено ради достоинства и культового оттенка. Финальное многоточие отмечает оборванное на границе стиха продолжение, не заполняя его редакционно.
