revisions:
- from: Весь Израиль пусть совершает его в назначенное ему время. И всякий мужчина, пришедший в тот день, пусть ест его в доме святилища вашего Бога пред Господом — от двадцати лет и старше, потому что…
  to: Пусть весь Израиль совершает его в назначенное ему время. И всякий мужчина, который приходит в тот день, пусть ест его в доме святилища Бога вашего перед Господом — от двадцати лет и старше, потому что…
  rationale: 'Внесены только стилистически и грамматически безопасные правки: более естественный порядок слов в предписании, обобщённое настоящее «который приходит» вместо формы, предполагающей завершённое прибытие, и более прозрачное расположение определения в буквальном выражении «дом святилища». Незавершённость причинного придаточного сохранена.'
  reviewer_model: gpt-5.6-terra
