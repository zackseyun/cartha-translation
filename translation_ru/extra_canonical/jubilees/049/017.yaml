review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: все израильтяне должны совершать обряд в установленное время; каждый мужчина, пришедший в этот день, должен есть его в доме святилища Божьего перед Господом, начиная с двадцатилетнего возраста. Однако русское «Весь Израиль пусть совершает» формально согласовано в единственном числе, но при общем значении «все израильтяне» менее ясно и менее естественно, чем множественное «Пусть весь Израиль совершает» либо «Весь Израиль должен совершать». Кроме того, «пришедший» несколько сдвигает родовое настоящее исходника/английской сверки («кто приходит») в завершённое действие. Безопасно сохранить обобщённое настоящее.'
  naturalness: «Пусть весь Израиль совершает» — естественный современный литературный порядок слов. «Дом святилища» намеренно буквально, но в русском без пояснения воспринимается тяжеловесно и двусмысленно; конструкция «в доме святилища Бога вашего» сохраняет оба компонента исходника и точнее связывает определение с «святилищем». «Перед Господом» современнее, чем «пред Господом», при сохранении культового регистра.
  terminology: «Совершать» уместно для предписанного обряда; «Господь» корректно передаёт እግዚአብሔር. Местоимение «его» оправдано контекстом пасхального обряда и не добавляет толкования. Возрастной оборот «от двадцати лет и старше» точен. Конечное «потому что…» необходимо сохранить, поскольку фрагмент источника обрывается на причинном союзе.
  issues:
  - severity: low
    issue: Порядок слов в первом предложении
    rationale: «Весь Израиль пусть совершает» возможно, но «Пусть весь Израиль совершает» звучит более естественно как предписание в современном русском.
  - severity: low
    issue: Вид и временная отнесённость «пришедший»
    rationale: Причастие совершенного вида может означать уже состоявшееся прибытие, тогда как исходная конструкция допускает обобщённое «кто приходит в тот день». Настоящее время лучше сохраняет эту нейтральность.
  - severity: low
    issue: Связь определения «вашего Бога»
    rationale: В варианте «в доме святилища вашего Бога» смысл понятен, но позиция определения может создавать менее прозрачную конструкцию. «В доме святилища Бога вашего» яснее сохраняет исходную генитивную связь.
  revised_text: Пусть весь Израиль совершает его в назначенное ему время. И всякий мужчина, который приходит в тот день, пусть ест его в доме святилища Бога вашего перед Господом — от двадцати лет и старше, потому что…
  revised_footnotes: []
  revision_rationale: 'Внесены только стилистически и грамматически безопасные правки: более естественный порядок слов в предписании, обобщённое настоящее «который приходит» вместо формы, предполагающей завершённое прибытие, и более прозрачное расположение определения в буквальном выражении «дом святилища». Незавершённость причинного придаточного сохранена.'
