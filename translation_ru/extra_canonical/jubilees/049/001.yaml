  yaml_path: translation/extra_canonical/jubilees/049/001.yaml
  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: ru
  text: 'Помни повеление, которое Господь дал тебе о Пасхе: совершай её в назначенное время, в четырнадцатый день первого месяца; заколи её до наступления вечера, и пусть её едят.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: Помни
  rationale: Прямо передаёт повелительный смысл глагола «помнить» и сохраняет обращение во втором лице единственного числа.
- source_word: ትእዛዘ፡ ዘአዘዘከ፡ እግዚአብሔር
  choice: повеление, которое Господь дал тебе
  rationale: Передаёт этимологическую фигуру «повеление, которое повелел тебе Господь» естественным современным русским языком, не меняя смысла.
- source_word: በእንተ፡ ፋሲካ
  choice: о Пасхе
  rationale: Форма ፋሲካ обозначает Пасху; предлог естественно передан как «о» в сочетании с повелением.
- source_word: ከመ፡ ትግበር፡ በጊዜሁ
  choice: совершай её в назначенное время
  rationale: Глагол буквально связан с действием или исполнением; применительно к празднику «совершай» звучит естественно и точно. Притяжательное значение «его время» передано идиоматически как «назначенное время».
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡ ቀዳማዊ
  choice: в четырнадцатый день первого месяца
  rationale: Точно сохраняет календарную дату исходного текста.
- source_word: ከመ፡ ትጥብቍ፡ ዘእንበለ፡ ይምሰይ
  choice: заколи её до наступления вечера
  rationale: Контекст Пасхи требует значения ритуального заклания; оборот о вечере передан ясно и без излишнего толкования.
- source_word: ወከመ፡ ይብልዕዎ
  choice: и пусть её едят
  rationale: Сохраняет переход исходника от второго лица единственного числа к третьему лицу множественного числа, не устраняя возможную смысловую напряжённость.
theological_decisions:
- issue: Передача имени/титула እግዚአብሔር
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В данном геэзском свидетельстве стоит обычное обозначение «Господь/Бог», а не графически различимое тетраграмматическое написание; русское «Господь» не вносит отсутствующего в источнике типографического разграничения.
- issue: Смена грамматического лица в конце стиха
  choice: заколи её… и пусть её едят
  alternative: заколите её… и ешьте её
  rationale: 'Сохранена реальная форма источника: сначала обращение во втором лице единственного числа, затем глагол в третьем лице множественного числа. Гармонизация могла бы скрыть неоднозначность адресатов.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис слегка упрощён ради ясности, но последовательность предписаний и смена грамматического лица сохранены.
