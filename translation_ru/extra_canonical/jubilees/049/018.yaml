base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: ru
  text: Так написано и установлено, чтобы они ели его в святилище Господа. Когда сыны Израиля войдут в землю Ханаанскую, которой им предстоит овладеть, и поставят шатёр Господа посреди земли, в одном из своих племён, — пока на этой земле не будет построено святилище Господа, — они будут приходить, совершать Пасху посреди шатра Господа и закалывать её пред Господом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: написано и установлено
  rationale: 'Передаёт две пассивные формы: письменное закрепление и нормативное установление.'
- source_word: በቤተ፡ መቅደሱ
  choice: в святилище
  rationale: Естественно передаёт обозначение священного места; притяжательное местоимение в геэзской форме не выражено в русском отдельно, поскольку далее прямо назван Господь.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: шатёр Господа
  rationale: Сохраняет отличие временного шатра от позднее построенного святилища и не вводит более специальный термин без необходимости.
- source_word: ጳስካ
  choice: Пасху
  rationale: Традиционное и общепонятное русское название праздника и пасхальной жертвы; контекст допускает оба оттенка.
- source_word: ይጠብኅዎ
  choice: закалывают её
  rationale: Передаёт ритуальное заклание; местоимение соотнесено с Пасхой как пасхальной жертвой.
theological_decisions:
- issue: Соотношение праздника Пасхи и пасхальной жертвы
  choice: «совершают Пасху… и закалывают её»
  alternative: «празднуют Пасху… и закалывают пасхального агнца»
  rationale: Сохраняется переход исходного текста от названия Пасхи к местоименному объекту заклания без внесения отсутствующего здесь слова «агнец».
- issue: Временный шатёр и постоянное святилище
  choice: различены как «шатёр Господа» и «святилище Господа»
  alternative: называть оба места «скинией/святилищем»
  rationale: Исходный текст употребляет разные слова и противопоставляет установленный шатёр будущему построенному святилищу.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формы «сыны Израиля» и «пред Господом» сохранены как узнаваемые элементы высокого библейского регистра; синтаксис упрощён настолько, чтобы длинная временная конструкция оставалась ясной.
