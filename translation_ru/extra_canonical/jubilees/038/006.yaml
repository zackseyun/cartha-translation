  rationale: Передаёт обозначение участников сражения естественным современным русским словом, не сужая его до регулярной армии.
- source_word: ለሞአብ፡ ወለዐሞን
  choice: Моава и Аммона
  rationale: Родительный падеж естественно выражает принадлежность воинов названным народам или землям.
