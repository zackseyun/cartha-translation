  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: ru
  text: И умер Асам, и вместо него[a] воцарился Адат, сын Барада, который поразил Мадиама на поле Моава; имя его города было Авит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после него».'
    reason: Сохранена известная альтернативная передача формулы престолонаследия, хотя буквальное значение эфиопского выражения — «вместо него, на его месте».
lexical_decisions:
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Передаёт пространственно-преемственное значение «на его месте, вместо него», а не просто временную последовательность.
- source_word: ዘቀተለ፡ ምዕድያምሃ
  choice: который поразил Мадиама
  rationale: Глагол буквально может означать «убил», но в формуле о победе над Мадиамом естественное русское «поразил» сохраняет военный смысл и согласуется с параллельной традицией.
- source_word: በሐቅለ፡ ሞአብ
  choice: на поле Моава
  rationale: Формально и естественно передаёт географическое выражение источника.
- source_word: አዳት፡ ወልደ፡ በረድ
  choice: Адат, сын Барада
  rationale: Имена транслитерированы непосредственно по эфиопскому тексту; родственная конструкция передана обычной русской формулой.
