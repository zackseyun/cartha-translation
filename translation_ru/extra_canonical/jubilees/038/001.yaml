  yaml_path: translation/extra_canonical/jubilees/038/001.yaml
  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: ru
  text: 'После этого Иуда заговорил с Иаковом, своим отцом, и сказал ему: «Натяни свой лук, отец, и пусти свои стрелы; повергни врага и убей противника. Да будет у тебя сила, ведь мы не убьём твоего брата, потому что он твой товарищ и подобен тебе; окажем ему честь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስከ፡ አባ፡ ቀስተከ
  choice: Натяни свой лук, отец
  rationale: Глагол ምስከ в сочетании с «луком» передаёт натягивание/сгибание лука; обращение «отец» сохранено в естественном русском порядке.
- source_word: ወፈኑ፡ አሕፃከ
  choice: и пусти свои стрелы
  rationale: ፈነወ означает посылать, выпускать; в контексте лука естественно «пустить стрелы», а не «положить в колчан».
- source_word: ወንደፍ፡ ጸላኢ፡ ወቅትል፡ ፀረዊ
  choice: повергни врага и убей противника
  rationale: Сохранён параллелизм двух повелений и различение близких обозначений неприятеля.
- source_word: ወይኩን፡ ለከ፡ ኀይለ
  choice: Да будет у тебя сила
  rationale: Формульное пожелание передано возвышенно, но понятно современному читателю.
- source_word: እስመ፡ አንቀትል፡ አኅዋከ
  choice: ведь мы не убьём твоего брата
  rationale: 'Следуем источниковедческой поправке повреждённого/ошибочно распознанного текста: отрицание и единственное число согласуются с последующим описанием одного лица.'
- source_word: ውእቱ፡ ወመምስአከ፡ ውእቱ
  choice: потому что он твой товарищ и подобен тебе
  rationale: Передаёт восстановленные чтения «твой товарищ» и «подобен тебе», не вводя неподтверждённых образов руки или помощи.
- source_word: ንህቦ፡ ለክብር
  choice: окажем ему честь
  rationale: Идиоматичный русский эквивалент буквального «дадим ему честь»; местоимение относится к упомянутому брату.
theological_decisions:
- issue: К кому относится повеление не убивать и оказать честь
  choice: К брату Иакова, названному его товарищем и подобным ему
  alternative: «Мы убьём врага твоих братьев; твоя рука и помощь с тобой; дадим это тебе во славу»
  rationale: 'Альтернатива основана на испорченных или ошибочно распознанных формах и создаёт фразы, не поддерживаемые вероятным восстановлением геэзского текста. Выбранное чтение сохраняет нравственное напряжение: призыв победить врага соседствует с запретом убивать брата.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Повелительные формы кратки и энергичны; синтаксис сохраняет последовательность исходного текста без искусственной архаизации.
