  text: But Jacob buried his brother in the mountain that is in Adurim, and he returned to his house.
translation:
  language: ru
  text: Но Иаков похоронил своего брата на горе[a], что в Адуриме, и вернулся домой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на возвышенности».'
    reason: Эфиопское слово допускает значения «гора», «холм» или гористая возвышенность; примечание сохраняет лексическую широту, не превращая топографический термин в общее «местность».
lexical_decisions:
- source_word: ወገር (wagar)
  choice: гора
  rationale: Слово обозначает гору или возвышенность; «гора» сохраняет топографическую конкретность оригинала и естественно звучит по-русски.
- source_word: ቀበሮ (qabarō)
  choice: похоронил
  rationale: Передаёт действие погребения прямо и естественно.
- source_word: ወገብአ፡ ውስተ፡ ቤቱ
  choice: и вернулся домой
  rationale: Естественная русская передача буквального «и возвратился в свой дом» без изменения смысла.
