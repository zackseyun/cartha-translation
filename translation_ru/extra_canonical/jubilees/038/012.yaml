lexical_decisions:
- source_word: ወለአኩ፡ ኀበ፡ አቡሆሙ
  choice: И они послали к своему отцу спросить
  rationale: Глагол «послали» и направление «к своему отцу» переданы прямо; «спросить» естественно выражает подразумеваемую цель посылки перед косвенным вопросом.
- source_word: ይገብሩ፡ ሰላመ፡ ምስሌሆሙ
  choice: заключить ли им с ними мир
  rationale: Буквально «сделать мир с ними»; современное русское «заключить мир» точно и естественно передаёт смысл.
- source_word: ወእመ፡ ይቀትልዎሙ
  choice: или убить их
  rationale: Парная конструкция с እመ выражает альтернативный косвенный вопрос; ይቀትልዎሙ означает «убить их» и принадлежит предоставленному тексту стиха.
