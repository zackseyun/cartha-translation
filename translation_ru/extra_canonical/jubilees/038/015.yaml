    reason: textual
lexical_decisions:
- source_word: ውሉደ፡ ኤዶም
  choice: сыны Эдома
  rationale: Сохраняет библейское обозначение потомков Эдома и торжественный регистр источника.
- source_word: ኢነገኁ
  choice: не сбросили с себя
  rationale: Передаёт действие освобождения от наложенного ига; «с себя» естественно по-русски и не добавляет нового смысла.
- source_word: እምአርዑተ፡ ቅኔ
  choice: ига рабства
  rationale: Буквально и ясно передаёт образ «ярма/ига подневольного служения», сохраняя его силу и традиционную библейскую образность.
- source_word: ዘሠርዑ ... ላዕሌሆሙ
  choice: которое возложили на них
  rationale: Естественная русская сочетаемость с существительным «иго» и точная передача направленности действия.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: до сего дня
  rationale: Устойчивое, понятное и уместно торжественное соответствие выражению «до этого дня».
theological_decisions:
- issue: Число сыновей Иакова в повреждённой строке представленного текста
  choice: двенадцать сыновей Иакова
  alternative: «четырнадцать и пятнадцать сыновей Иакова» при механическом чтении искажённой последовательности знаков
  rationale: Представленная последовательность числительных содержит явный дефект распознавания или передачи текста. Чтение «двенадцать» соответствует критическому тексту указанного издания, контексту повествования и числу сыновей Иакова; текстологическая проблема отмечена в сноске, а не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены традиционные выражения «сыны Эдома», «иго рабства» и «до сего дня», понятные современному читателю; синтаксис упрощён без устранения текстологической неопределённости.
