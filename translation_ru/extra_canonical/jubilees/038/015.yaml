  text: And the sons of Edom have not cast off the yoke of servitude that the twelve sons of Jacob had laid upon them, to this day.
translation:
  language: ru
  text: И сыны Эдома до сего дня не сбросили с себя иго рабства, которое возложили на них двенадцать сыновей Иакова.[a]
  philosophy: optimal-equivalence
  footnotes:
