lexical_decisions:
- source_word: ሞተ
  choice: умер
  rationale: Прямое и естественное соответствие глаголу «умер».
- source_word: ነግሠ
  choice: воцарился
  rationale: Передаёт вступление на царство и сохраняет последовательность повествования.
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Точно выражает замещение предшественника, а не только временную последовательность «после него».
- source_word: ባኤሉናን
  choice: Баэлунан
  rationale: Транслитерация личного имени по форме геэзского текста.
- source_word: ወልደ፡ አክቡር
  choice: сын Ахбора
  rationale: Обычная русская формула родства; имя передано в традиционной библейской форме Ахбор.
