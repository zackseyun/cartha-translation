lexical_decisions:
- source_word: ሀገሩ፡ አውኢት
  choice: Его городом был Ауит
  rationale: Передаёт именную конструкцию «его город — Ауит» естественным современным русским языком, не опуская начальную фразу стиха.
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: 'Точно выражает значение замещения: Салман занял место умершего Адаты.'
- source_word: አማሴቃ
  choice: Амасеки
  rationale: Геэзское географическое имя передано транслитерацией и поставлено в родительный падеж после предлога «из».
