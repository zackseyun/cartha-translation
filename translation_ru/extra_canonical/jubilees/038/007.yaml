  text: And Reuben and Issachar and Zebulun went out toward the north side of the tower, and fifty were with them; and they killed the fighting men of the Philistines.
translation:
  language: ru
  text: И Рувим, Иссахар и Завулон выступили к северной стороне башни, и с ними было пятьдесят человек; и они перебили воинов филистимлян.
