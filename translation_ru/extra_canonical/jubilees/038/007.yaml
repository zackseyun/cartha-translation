lexical_decisions:
- source_word: ወወፅኡ
  choice: выступили
  rationale: Передаёт выход с военной целью естественным современным русским глаголом.
- source_word: እንተ፡ ገጸ፡ ሰሜን፡ ለማኅፈድ
  choice: к северной стороне башни
  rationale: Сохраняет пространственное указание и привязку к башне без излишнего уточнения направления или положения.
- source_word: ወ፶ ምስሌሆሙ
  choice: и с ними было пятьдесят человек
  rationale: Числительное в источнике не называет существительного; «человек» естественно восполняется по-русски из контекста.
- source_word: መስተባእሳኒሆሙ፡ ለፍልስጥኤም
  choice: воинов филистимлян
  rationale: Обозначает сражающихся мужчин, а не весь народ; «воины» звучит естественно и достойно.
