  text: And the sons of Jacob subdued the sons of Esau on Mount Seir, and they bowed their necks so that they might become servants.
translation:
  language: ru
  text: И сыновья Иакова покорили сыновей Исава на горе Сеир, и те склонили свои выи, чтобы стать рабами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መገብዎሙ
  choice: покорили
  rationale: Глагол в данном контексте передаёт подчинение противника власти победителей; «покорили» естественно и точно выражает результат военного столкновения.
- source_word: አትሐቱ፡ ክሳዶሙ
  choice: склонили свои выи
  rationale: Сохранён образ буквального склонения шеи как знака подчинения. «Выи» придаёт фразе уместное библейское достоинство, оставаясь понятным в контексте.
- source_word: አግብርተ
  choice: рабами
  rationale: Слово обозначает людей в зависимом, подневольном положении; «рабами» точнее сохраняет силу исходного выражения, чем более мягкое «слугами».
