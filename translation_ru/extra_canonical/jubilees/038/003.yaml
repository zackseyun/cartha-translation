lexical_decisions:
- source_word: ፈነወ፡ ሐጸ
  choice: выпустил стрелу
  rationale: Передаёт действие естественно по-русски и сохраняет образ пущенной стрелы, не добавляя отсутствующих в тексте подробностей.
- source_word: አዶራንሃ፡ አረማዊ
  choice: арамея Адорана
  rationale: Этноним አረማዊ передан как «арамей»; личное имя сохранено в форме «Адоран».
- source_word: ጥቦ፡ ፀጋማዊ
  choice: в левую грудь
  rationale: Буквально обозначает левую грудь/левую сторону груди; выбран краткий телесный ориентир без уточнения, которого нет в источнике.
- source_word: ወሰደዶ
  choice: отбросил его назад
  rationale: Сохраняет значение удаления или оттеснения назад и последовательность действий перед убийством.
