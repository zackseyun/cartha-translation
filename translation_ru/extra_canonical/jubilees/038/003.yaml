  text: And again he shot an arrow, and it struck Adoran the Aramean in the left breast, and he drove him back and killed him.
translation:
  language: ru
  text: И снова он выпустил стрелу; она поразила арамея Адорана в левую грудь, и он отбросил его назад и убил.
