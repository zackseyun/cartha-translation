  text: And Jobab died, and Asam from the hill country of Teman reigned in his place.
translation:
  language: ru
  text: И умер Иовав, и вместо него воцарился Асам из горной области Фемана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из нагорья Фемана».'
    reason: Сохраняет возможную более компактную передачу ደብረ как «нагорье» при географическом понимании выражения.
lexical_decisions:
- source_word: ዮባብ
  choice: Иовав
  rationale: Традиционная русская передача имени Jobab, соответствующая библейскому именослову.
- source_word: ነግሠ
  choice: воцарился
  rationale: Глагол означает вступление на царство или царствование; в контексте преемства естественно русское «воцарился».
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Точно передаёт значение «на его месте, вместо него», не ослабляя его до простой временной последовательности «после него».
- source_word: አሳም
  choice: Асам
  rationale: Прямая русская транслитерация геэзской формы имени.
- source_word: ደብረ፡ ቴማን
  choice: горной области Фемана
  rationale: ደብር может обозначать гору или гористую местность; здесь естественно понимать его как область, связанную с Феманом, а не обязательно как одну конкретную гору.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис прост и ясен; формула преемства передана естественно, а географическая неоднозначность ደብረ отражена в сноске.
