- source_word: ህየንቴሁ
  choice: вместо него
  rationale: 'Буквально передаёт значение замещения и наследования власти: «на его месте», «вместо него».'
- source_word: ራኦቦት፡ ፈለግ
  choice: Реховота, что у реки
  rationale: Передаёт топоним и его уточнение естественной русской конструкцией; предлог «у» обозначает расположение возле реки, не превращая слово «река» в бесспорную часть собственного имени.
