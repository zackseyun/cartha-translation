lexical_decisions:
- source_word: ወእምዝ
  choice: После этого
  rationale: Передаёт временную последовательность повествования естественным современным русским выражением.
- source_word: ወጽኡ
  choice: выступили
  rationale: В военном контексте глагол движения точнее передаётся как «выступили», а не нейтральное «вышли».
- source_word: እሙንቱ፡ ወአግብርቲሆሙ
  choice: они и их слуги
  rationale: Сохраняет явное указание источника и не добавляет отсутствующего в тексте значения «вместе с ними».
- source_word: ተናፊቆሙ
  choice: разделившись
  rationale: 'Передаёт возвратно-медиальное значение формы: участники распределили себя по отдельным подразделениям.'
- source_word: ውስተ፡ መርብዕተ፡ ማኅፈድ
  choice: на четыре боевых отряда
  rationale: Передаёт число и военную организацию группы ясным русским выражением, не уточняя без достаточных оснований конкретный тип построения.
