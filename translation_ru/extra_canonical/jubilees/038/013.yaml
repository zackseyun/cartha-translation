  terminology: '«Заключили мир» и «платили дань» удачны. «Повинность» точнее, чем «подневольный труд», для образа «ярма служения/подчинения». Отдельная сноска с вариантом «служили Иакову» не нужна: основной смысл данного глагола в этом контексте — платить дань, а не просто служить.'
