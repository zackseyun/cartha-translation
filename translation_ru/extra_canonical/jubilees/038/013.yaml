  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: ru
  text: Иаков послал к своим сыновьям, чтобы они заключили мир. Они заключили с ними мир и возложили на них ярмо повинности, чтобы те платили дань Иакову и его сыновьям во все дни своей жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይግበሩ፡ ሰላመ / ገብሩ፡ ምስሌሆሙ፡ ሰላመ
  choice: заключили мир / заключили с ними мир
  rationale: Геэзская идиома буквально означает «сделать мир»; по-русски естественно и точно передаётся выражением «заключить мир».
- source_word: አርዑተ፡ ቅኔ
  choice: ярмо подневольного труда
  rationale: Сочетание буквально обозначает «ярмо служения/подчинённого труда» и подчёркивает принудительную зависимость, не уточняя её сверх исходного текста.
- source_word: ይጽብሑ
  choice: платили дань
  rationale: Глагол в данном контексте обозначает выплату дани или налога, а не служение вообще.
- source_word: ኵሎ
  choice: во все дни свои
  rationale: По контексту передаёт постоянную, пожизненную обязанность; местоимение «свои» естественно указывает на покорённых.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное ይቀትልዎሙ («они убили их») расценено как окончание предыдущего стиха, попавшее в предоставленный фрагмент вследствие разбивки главы; в текст 38:13 оно не включено.
