review_pass:
  verdict: revise
  source_fidelity: 'Содержание передано верно: Иаков велит сыновьям заключить мир; затем на покорённых возлагается зависимость и обязанность платить дань Иакову и его сыновьям. Начальное «они убили их» относится к окончанию предыдущего стиха при данной разбивке и не должно включаться в 38:13. Глагол ይጽብሑ следует передавать как выплату дани, а не как общее «служение».'
