revisions:
- from: И послал Иаков к своим сыновьям, чтобы они заключили мир. Они заключили с ними мир и возложили на них ярмо подневольного труда, чтобы те платили дань Иакову и его сыновьям во все дни свои.
  to: Иаков послал к своим сыновьям, чтобы они заключили мир. Они заключили с ними мир и возложили на них ярмо повинности, чтобы те платили дань Иакову и его сыновьям во все дни своей жизни.
