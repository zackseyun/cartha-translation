translation:
  language: ru
  text: И вот цари, которые царствовали в Эдоме прежде, чем воцарился царь над сынами Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሉ፡ ነገሥት
  choice: вот цари
  rationale: Указательная формула передана естественным для русского библейского повествования оборотом, без избыточного «эти».
- source_word: እለ፡ ነገሡ
  choice: которые царствовали
  rationale: Сохранены родственный глагол и существительное исходного текста, а также относительная конструкция.
- source_word: በኤዶም
  choice: в Эдоме
  rationale: Прямое обозначение места царствования.
- source_word: ዘእንበለ፡ ይንግሥ፡ ንጉሥ
  choice: прежде, чем воцарился царь
  rationale: Передана временная последовательность и сохранена неопределённость относительно личности царя.
- source_word: ለውሉደ፡ እስራኤል
  choice: над сынами Израиля
  rationale: Предлог по смыслу обозначает власть над народом; традиционное выражение «сыны Израиля» сохраняет коллективное родовое обозначение.
theological_decisions:
- issue: Личность царя над Израилем
  choice: не уточнять, о каком царе идёт речь
  alternative: назвать Саула или истолковать выражение как установление монархии
  rationale: Исходный текст говорит лишь «царь» и не разрешает историко-богословскую отсылку явно.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Лексический повтор «цари — царствовали — воцарился царь» намеренно сохранён как заметная черта оригинала.
