  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: ru
  text: И умер Баэлунан, сын Ахбора, и вместо него[a] воцарился Адат. Жену его звали Майтабиго[b]. Она была дочерью Матарего, дочери Метебедзааба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после него».'
    reason: Сохранён известный альтернативный вариант передачи, хотя «вместо него» точнее отражает геэзское ህየንቴሁ.
  - marker: b
    text: 'Возможный вариант передачи имени: «Метабиго».'
    reason: Указан прежний вариант транслитерации; основной текст следует написанию መይጠቢጎ и сохраняет ይ.
lexical_decisions:
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Передаёт значение «на его месте, вместо него» точнее, чем простая временная последовательность «после него».
- source_word: መይጠቢጎ
  choice: Майтабиго
  rationale: Транслитерация сохраняет согласный ይ (y), отражённый сочетанием «й».
- source_word: ወለተ፡ ማጠረጎ፡ ወለተ፡ ሜተቤድዛአብ
  choice: дочь Матарего, дочери Метебедзааба
  rationale: 'Женский род второго слова «дочь» сохранён: Матарего представлена как дочь Метебедзааба; генеалогическая цепочка не упрощается.'
