  text: His city was Danaba. And Balaq died, and Jobab son of Zarah from Boser reigned in his place.
translation:
  language: ru
  text: Его городом была Данаба. Балак умер, и вместо него[a] воцарился Иовав, сын Зары, из Босера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после него».'
    reason: 'Сохраняет засвидетельствованный вариант передачи ህየንቴሁ, хотя в основном тексте предпочтено более точное значение замещения: «вместо него».'
lexical_decisions:
- source_word: ሀገሩ፡ ደናባ
  choice: Его городом была Данаба
  rationale: 'Именная конструкция буквально сообщает: «его город — Данаба»; в современном русском естественно добавить связку «была».'
- source_word: ወነግሠ
  choice: воцарился
  rationale: Глагол означает вступление на царство или правление; «воцарился» точно и кратко передаёт смысл в данном перечне царей.
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Передаёт значение замещения, то есть вступления на место умершего царя, не сводя его лишь к временной последовательности.
- source_word: ዘእም፡ ቦሴር
  choice: из Босера
  rationale: Предлог እም указывает на происхождение «из/от»; топоним передан транслитерацией, близкой к форме источника.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным глаголом «воцарился». Имена переданы в традиционно узнаваемых русских формах, по возможности близких к геэзскому тексту. Начальная фраза сохранена, несмотря на возможное несовпадение деления стихов.
