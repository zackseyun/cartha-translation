  source_fidelity: 'Текст точно передаёт последовательность и основные элементы геэзского оригинала: Иуда выступает первым; Неффалим, Гад и пятьдесят слуг находятся с ним; движение направлено к южной стороне башни; уничтожены все встреченные ими люди; заключительное отрицание сохранено с усилением «ни один человек». «На своём пути» является несколько более идиоматичным, чем буквальное «перед собой», но в данном военном повествовании не меняет референт и не создаёт смыслового расхождения.'
