  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: ru
  text: Иуда вышел первым, а с ним — Неффалим и Гад и пятьдесят слуг. Они направились к южной стороне башни и убили всех, кого встретили на своём пути; никто от них не спасся — ни один человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: первым
  rationale: В данном повествовательном контексте слово передаёт первенство Иуды при выступлении; такое понимание согласуется с синтаксисом и сохраняет последовательность действий.
- source_word: እንተ፡ ገጸ፡ ደቡብ፡ ለማኅፈድ
  choice: к южной стороне башни
  rationale: Буквально выражение указывает в направлении южной стороны/лица башни; русский вариант естественно передаёт пространственную ориентацию.
- source_word: ዘረከቡ፡ በቅድሜሆሙ
  choice: кого встретили на своём пути
  rationale: 'Буквально: «кого нашли перед собой». Выбранная формулировка естественна по-русски и сохраняет смысл людей, оказавшихся перед наступавшими.'
- source_word: ወአሐዱኒ
  choice: ни один человек
  rationale: 'Финальное выражение усиливает предыдущее отрицание: не спасся даже один. Добавление «человек» делает русскую фразу ясной без изменения смысла.'
