  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: ru
  text: И вышли Симеон, Вениамин и Енох, сын Рувима, к западной стороне башни, а с ними — пятьдесят человек; и они убили четыреста доблестных воинов из эдомитян и хорреев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ ገጸ ዐረቢሁ ለማኅፈድ
  choice: к западной стороне башни
  rationale: Передаёт направление движения и пространственное указание оригинала естественным современным русским языком, не усиливая его до значения «внутрь» или «за башню».
- source_word: ኤዶማ ኤዶም ወኤዶማ ሖሬዎን
  choice: из эдомитян и хорреев
  rationale: Необычная конструкция обозначает принадлежность убитых к двум группам; этнонимы переданы в принятой русской библейской форме.
- source_word: ጽኑዓነ መስተቃትላነ
  choice: доблестных воинов
  rationale: Сочетание характеризует их как сильных, стойких и пригодных к сражению людей; «доблестные воины» кратко и естественно передаёт общий смысл без тяжеловесного повтора.
