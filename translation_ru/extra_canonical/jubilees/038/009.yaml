  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: ru
  text: И бежали шестьсот человек, и вместе с ними бежали четыре сына Исава. Они оставили своего отца убитым там, где он пал, — в нагорье, что в Адуфиме[a]. Сыновья Иакова преследовали их до горы Сеир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте: «Адуфим»; вероятно, это ошибочное переписное чтение названия «Адурим».'
    reason: Сохраняет фактическое геэзское чтение и прозрачно отмечает вероятную научную конъектуру, не подменяя чтение источника в основном тексте.
lexical_decisions:
- source_word: ጕዩ
  choice: бежали
  rationale: Передаёт повторяющийся глагол со значением бегства без стилистического утяжеления.
- source_word: ወገር
  choice: нагорье
  rationale: Контекстуально передаёт гористую местность; более естественно по-русски, чем буквальное «гора» перед названием области.
- source_word: አዱፊም
  choice: Адуфим
  rationale: Основной текст сохраняет засвидетельствованное чтение геэзского источника; вероятная конъектура «Адурим» отмечена в сноске.
- source_word: ደብረ፡ ሴኢር
  choice: гора Сеир
  rationale: Обычная русская передача топонимического сочетания «гора Сеир».
- source_word: ወሰደድዎሙ
  choice: преследовали их
  rationale: Естественно и точно передаёт погоню сыновей Иакова за бегущими.
theological_decisions:
- issue: Неуточнённое обозначение убитого как «их отца»
  choice: своего отца
  alternative: Исава
  rationale: Сохранена референциальная форма источника без внесения имени, хотя контекст позволяет отождествить отца с Исавом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор глагола «бежали» сохранён как элемент структуры исходного текста; синтаксис слегка упорядочен ради ясности.
