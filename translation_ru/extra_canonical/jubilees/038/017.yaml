  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сохранён простым и повествовательным; начальный союз второй фразы отражён. Представленный фрагмент геэзского текста обрывается после слов «и имя», поэтому завершение предложения сверено с аудированным английским консультационным слоем.
