lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: до сего дня
  rationale: Точно передаёт устойчивое временное выражение «до этого дня», сохраняя возвышенный, но понятный современному читателю библейский регистр.
- source_word: በምድረ፡ ኤዶም
  choice: в земле Эдома
  rationale: Формально и естественно передаёт географическое обозначение; родительный падеж соответствует русской библейской традиции.
- source_word: ወነግሠ፡ በአዶም
  choice: И воцарился в Эдоме
  rationale: Начальное «И» сохраняет соединительный союз, а «воцарился» передаёт значение глагола царствования и событийный характер фразы.
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
  choice: Валак, сын Веора
  rationale: Имена переданы в узнаваемой русской библейской форме; конструкция родства переведена прямо.
- source_word: ወስመ፡ … ደናባ
  choice: а имя его города было Денава
  rationale: Фраза восстановлена по продолжению, засвидетельствованному в консультационном слое; «а» естественно связывает сообщение о городе с предшествующим известием о царе. Название передано близко к форме Denaba.
