  choice: И она никому не рассказала
  rationale: 'Глагол передан без добавленного прямого дополнения: из контекста понятно, о чём она не рассказала; отрицательная конструкция означает «никому».'
- source_word: ወኀሠሣ
  choice: и стал искать её
