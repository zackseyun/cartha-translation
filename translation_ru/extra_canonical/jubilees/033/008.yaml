  text: And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.
translation:
  language: ru
  text: И Иаков сильно разгневался на Рувима за то, что тот лёг с Валлой и тем открыл край одежды своего отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл одежду (или покров) своего отца»; это библейское выражение обозначает посягательство на брачные права отца (ср. Втор 22:30; 27:20).'
    reason: Сохраняет буквальный образ источника и разъясняет его идиоматический смысл без замены словом «постель».
lexical_decisions:
- source_word: ተምዐ ፡ ጥቀ
  choice: сильно разгневался
  rationale: Передаёт сочетание глагола гнева с усилителем «весьма, сильно» естественным современным русским языком.
- source_word: ሰከበ ፡ ምስለ ፡ ባላን
  choice: лёг с Валлой
  rationale: Сохраняет прямой эвфемизм источника для половой связи и традиционную русскую форму имени Bilhah — «Валла».
- source_word: ከሠተ ፡ ክዳነ ፡ አቡሁ
  choice: открыл край одежды своего отца
  rationale: ክዳን означает одежду или покров, а не постель. Формулировка сохраняет библейский образ нарушения брачных прав отца и межтекстовую связь с Втор 22:30 и 27:20.
theological_decisions:
- issue: Смысл выражения об одежде отца
  choice: Сохранить образ «открыл край одежды своего отца» и пояснить его в сноске
  alternative: Заменить образом «осквернил постель своего отца»
  rationale: Источник прямо называет одежду или покров. Замена на «постель» истолковала бы метафору вместо её перевода и ослабила бы связь с библейским правовым выражением.
translation_notes:
  register: Современный литературный русский с кратким, торжественным повествовательным ритмом. Повтор причинного союза в геэзском передан более естественной русской связью «и тем», при этом причинно-следственное отношение сохранено.
