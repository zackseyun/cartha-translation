  yaml_path: translation/extra_canonical/jubilees/033/003.yaml
  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
translation:
  language: ru
  text: служанку Рахили, наложницу своего отца, когда она купалась в укромном месте, и полюбил её. Он спрятался, а ночью вошёл в дом Валлы[a] и увидел, что она одна спит в своей постели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В тексте после слов «в дом Валлы» слово «ночью» повторено ещё раз.
    reason: В издании второе ሌሊተ заключено в квадратные скобки как вероятный повтор; основной текст передаёт наречие один раз, а примечание сохраняет сведения о форме источника.
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: служанку Рахили
  rationale: Сочетание обозначает служанку Рахили, то есть Валлу; это сохраняет явное указание источника и не создаёт ошибочного впечатления, будто речь идёт о самой Рахили.
- source_word: ዐቅብተ ፡ አቡሁ
  choice: наложницу своего отца
  rationale: Передаёт родственное отношение и статус женщины прямо и без конфессионально обусловленного истолкования.
- source_word: እንዘ ፡ ትትሐፀብ ፡ በማይ ፡ በኅቡእ
  choice: когда она купалась в укромном месте
  rationale: Естественная русская передача купания в воде скрытно или в уединённом месте; упоминание воды подразумевается глаголом «купалась» и не требует тяжеловесного повтора.
- source_word: ወአፍቀራ
  choice: и полюбил её
  rationale: Сохраняет широкое значение глагола «любить», не сводя его без необходимости только к вожделению.
- source_word: ወተኀቢኦ
  choice: Он спрятался
  rationale: Прямо передаёт возвратное действие, сохраняя последовательность повествования.
- source_word: ወረከባ ፡ እንዘ ፡ ትነውም
  choice: и увидел, что она ... спит
  rationale: В данном повествовательном контексте русское «увидел, что» естественно передаёт буквальное «нашёл её спящей» без изменения смысла.
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: она одна спит в своей постели
  rationale: 'Передаёт все элементы фразы: нахождение в её постели и то, что она была одна; не добавляет отсутствующего в источнике оборота «в её доме».'
- source_word: ባላን
  choice: Валла
  rationale: Использована традиционная русская библейская форма имени Bilhah, узнаваемая читателям и соответствующая литературному регистру.
theological_decisions:
- issue: 'Кого увидел герой: Рахиль или её служанку'
  choice: служанку Рахили, наложницу своего отца
  alternative: Рахиль, наложницу своего отца
  rationale: Чтение со служанкой поддерживается геэзским выражением ለአኪተ ራሔል и дальнейшим упоминанием дома Валлы; альтернативное чтение создаёт сюжетное противоречие.
- issue: Характер чувства, выраженного ወአፍቀራ
  choice: полюбил её
  alternative: возжелал её
  rationale: Источник употребляет глагол со значением любви; более узкая сексуализированная передача могла бы преждевременно снять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими именами «Рахиль» и «Валла». Начальная строчная буква сохранена, поскольку предоставленный стих синтаксически продолжает предыдущее предложение. Формулировки ясные и сдержанные; двусмысленность глагола любви не устранена толкованием.
