  verdict: revise
  source_fidelity: В начале стиха добавлено «после этого», которого нет ни в геэзском тексте, ни в английской контрольной версии. Кроме того, геэзское «открывает покров своего отца» следует сохранить в основном тексте, а не заменять прямо связанной, но иной библейской идиомой «открывает наготу своего отца».
  naturalness: «Иаков больше не приближался к ней» — естественный и сдержанный современный литературный оборот. «Покров своего отца» намеренно необычен, но оправдан буквальностью источника и поясняется примечанием. «Тяжкое зло» естественно передаёт усиленную отрицательную оценку.
  terminology: «Осквернил её» точно сохраняет нравственно-ритуальную окраску. «Покров» соответствует геэзскому образу и английскому audit trail (covering); примечание объясняет его как древний сексуальный эвфемизм, не выдавая контекстуальное толкование за буквальный текст.
