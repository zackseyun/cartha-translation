  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: ru
  text: Иаков больше не приближался к ней, потому что Рувим осквернил её. И всякий мужчина, открывающий покров своего отца, совершает тяжкое зло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открывает покров своего отца — его дело весьма зло». Это древний половой эвфемизм; в данном контексте он относится к связи с женой или наложницей отца.'
    reason: Сохраняет буквальный образ геэзского текста в основном переводе и поясняет его контекстуальный смысл без подмены образа источника.
lexical_decisions:
- source_word: አቀረበ
  choice: приближался к ней
  rationale: В данном контексте глагол приближения служит сдержанным обозначением супружеской близости; буквальный образ сохранён без грубого пояснения.
- source_word: አርኩሳ
  choice: осквернил её
  rationale: Передаёт значение ритуально-нравственного осквернения и сохраняет оценочную силу исходного глагола.
- source_word: ዘይከሥት ፡ ክዳነ
  choice: открывающий наготу своего отца
  rationale: Буквально речь идёт об открытии «покрова», однако это библейский половой эвфемизм; русское «открыть наготу отца» естественно связывает стих с традиционной библейской идиомой, не устраняя её косвенности.
theological_decisions:
- issue: Смысл выражения «нагота/покров отца»
  choice: Сохранить библейский эвфемизм «нагота своего отца»
  alternative: Разъяснить как «вступает в связь с женой своего отца»
  rationale: Разъясняющий вариант точнее обозначил бы действие в контексте, но устранил бы намеренную идиоматичность и возможную интертекстуальную связь с запретами Торы.
- issue: Заключительная нравственная оценка
  choice: «совершает великое зло»
  alternative: «его дело весьма зло»
  rationale: Выбран естественный современный русский оборот, сохраняющий нравственную оценку поступка и не вводящий дополнительной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Повтор союза «И» сохранён как черта повествовательного стиля. Местоимение «ней» оставлено без добавления имени, поскольку стих продолжает ближайший контекст.
