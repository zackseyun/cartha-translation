  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: ru
  text: '«Я нечиста для тебя, потому что была осквернена в разлуке с тобой: Рувим осквернил меня и лёг со мной ночью, когда я спала. Я ничего не знала, пока он не приподнял полу моей одежды[a] и не лёг со мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моё крыло»; в данном контексте — край или пола одежды.'
    reason: Сохраняет доступ к образному значению исходного слова и поясняет контекстуальный перевод.
lexical_decisions:
- source_word: ንጽሕተ
  choice: нечиста
  rationale: Сохраняет смысл ритуальной и нравственной нечистоты в естественной для библейского регистра форме; женский род следует контексту речи.
- source_word: ተገመዝኩ ፡ እምኔከ
  choice: была осквернена вдали от тебя
  rationale: Передаёт страдательный смысл и пространственно-реляционное «от тебя», не превращая его без необходимости в более определённое толкование.
- source_word: አርኩሰኒ
  choice: осквернил меня
  rationale: Точно сохраняет повторяющуюся лексику осквернения и тяжесть совершённого действия.
- source_word: ክነፍየ
  choice: край моей одежды
  rationale: Буквально слово означает «крыло», но здесь обозначает край или полу одежды; основной текст передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Осведомлённость и согласие женщины
  choice: Сохранено прямое указание, что она спала и ничего не знала о происходившем.
  alternative: Смягчить формулировку или представить действие как добровольную связь.
  rationale: Исходный текст подчёркивает её сон и неведение; перевод не должен устранять эту нравственную и повествовательную напряжённость.
- issue: Смысл выражения «вдали от тебя»
  choice: Сохранена пространственно-реляционная неоднозначность.
  alternative: Истолковать как супружескую неверность или как осквернение «без твоего ведома».
  rationale: Источник не выражает эти более узкие толкования прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «лёг со мной» сохранён как в источнике; формулировка не смягчает насильственный характер описанной ситуации.
