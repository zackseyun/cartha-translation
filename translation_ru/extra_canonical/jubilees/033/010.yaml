  language: ru
  text: 'Его поступок — великое зло, ибо он мерзок пред Господом.[a] Поэтому на небесных скрижалях написано и установлено: мужчина не должен ложиться с женой своего отца и не должен открывать покров своего отца,[b] ибо это нечистота. Оба непременно должны умереть — и мужчина, который лёг с женой своего отца, и женщина, — потому что они совершили нечистое дело на земле. И да не будет нечистоты пред нашим Богом среди народа, который Он избрал Себе как царство.


    И ещё раз написано: «Проклят тот, кто ложится с женой своего отца, ибо он открыл наготу своего отца». И пусть все святые Господа скажут: «Да будет так! Да будет так!» А ты, Моисей, повели сынам Израиля соблюдать это слово, ибо за это полагается смерть; это нечистота, и вовеки нет искупления для совершившего такое — только предать его смерти, убить, побить камнями и искоренить из среды народа нашего Бога.


    Ни один мужчина, который сделает такое в Израиле, не должен оставаться в живых на земле даже один день, ибо он мерзок и нечист. И пусть не говорят: «Рувим остался жив и получил прощение после того, как лёг с наложницей своего отца; и она тоже осталась жива, хотя у неё был муж и Иаков, его отец, был ещё жив». Ведь до того времени установление, суд и закон ещё не были во всей полноте открыты всем; но в твои дни это — закон времён и дней и вечный закон для вечных поколений. У этого закона нет срока окончания, и нет прощения за его нарушение: обоих следует искоренить из среды народа; в тот самый день, когда они сделают это, их надлежит умертвить.


    А ты, Моисей, запиши это для Израиля, чтобы они соблюдали это, не поступали так и не совершали греха, ведущего к смерти, ибо Судья — Господь, наш Бог, — не проявляет пристрастия и не принимает подкупа. Возвести им это слово установления, чтобы они услышали, были начеку, остерегались и не погибли, не были искоренены с земли. Ибо все, кто делает такое на земле, нечисты, осквернены, запятнаны и загрязнены пред нашим Богом.


    Нет греха тяжелее разврата, которому предаются на земле, ибо Израиль — святой народ Господа, своего Бога, народ Его наследия, народ священнический, народ царственный и народ, насаждённый Им. Такая нечистота не должна появляться среди святого народа.


    В третий год этой седмины Иаков и все его сыновья пошли и поселились в доме Авраама, близ Исаака, его отца, и Ревекки, его матери. Вот имена сыновей Иакова: первенец Рувим, Симеон, Левий, Иуда, Иссахар и Завулон — сыновья Лии; сыновья Рахили — Иосиф и Вениамин; сыновья Валлы — Дан и Неффалим; сыновья Зелфы — Гад и Асир; и Дина, единственная дочь Лии, дочь Иакова.


    Они пришли и поклонились Исааку и Ревекке. Увидев их, те благословили Иакова и всех его сыновей. Исаак очень обрадовался, увидев сыновей Иакова, своего младшего сына, и благословил их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «ибо его поступок — мерзость пред Господом».'
    reason: Синтаксическая связь оценочных слов в начале отрывка допускает более тесное соединение «мерзости» с поступком, а не с его совершителем.
  - marker: b
    text: 'Буквально: «покров своего отца»; это выражение обозначает жену отца. В следующем предложении оригинал употребляет другое слово — «нагота».'
    reason: Важно сохранить различие между ኪዳነተ («покров, покрытие, одежда») и ኀፍረተ («нагота, срам»), которое утрачивается при одинаковом переводе.
lexical_decisions:
- source_word: እኩይ ፡ ነገሩ ፡ ጥቀ
  choice: Его поступок — великое зло
  rationale: Передаёт усиленную оценку поступка в начале стиха, не опуская ጥቀ («весьма, очень»).
- source_word: ኪዳነተ ፡ አቡሁ
  choice: край одежды своего отца
  rationale: Сохраняет образ «одежды/покрова» и отличает его от последующего ኀፍረተ («нагота, срам»); выражение отсылает к юридической идиоме Втор 22:30.
- source_word: ኀፍረተ ፡ አቡሁ
  choice: наготу своего отца
  rationale: Передаёт отдельную лексику источника и библейскую формулу, не смешивая её с «краем одежды» выше.
- source_word: ሞተ ፡ ለይሙቱ
  choice: Оба непременно должны умереть
  rationale: Русская конструкция передаёт эмфатическую смертную формулу оригинала.
- source_word: ሕልያነ
