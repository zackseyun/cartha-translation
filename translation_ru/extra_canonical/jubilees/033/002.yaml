translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. Синтаксическая незавершённость начала и конца сохранена, поскольку стих представляет собой фрагмент предложения, пересекающего границы стихов; тире помогают передать присоединённую конструкцию «он и его жена Лия», не устраняя неоднозначность исходного членения.
