lexical_decisions:
- source_word: አመ ፡ ሠርቁ ፡ ለወርኀ ፡ ፱
  choice: в новолуние девятого месяца
  rationale: Выражение буквально указывает на восход/появление девятого месяца и в данном календарном контексте естественно передаётся как «новолуние».
- source_word: ባላንን
  choice: Валлу
  rationale: Использована традиционная русская форма имени служанки Рахили, соответствующая библейской Валле (Быт. 30:3–8; 35:22).
- source_word: ወርእየ
  choice: И … увидел
  rationale: Сохранено простое повествовательное значение глагола и последовательная связь с последующим, не приведённым здесь текстом.
