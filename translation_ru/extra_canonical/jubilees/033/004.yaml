translation:
  language: ru
  text: в её доме.[a] Он лёг с ней; она проснулась, увидела его — и вот, Рувим лежит с ней на постели. Она откинула край своего покрывала,[b] схватила его и закричала; тогда она узнала, что это Рувим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова, вероятно, завершают предложение предыдущего стиха.
    reason: Начало стиха в данной разбивке представляет собой синтаксически зависимый фрагмент.
  - marker: b
    text: 'Буквально: «своё крыло»; то есть край или пола покрывала.'
    reason: Сохраняется образность исходного слова и поясняется его значение в данном контексте.
lexical_decisions:
- source_word: ውስተ ፡ ቤታ
  choice: в её дом
  rationale: Сохраняет начальный предложный фрагмент источника; по синтаксису он, вероятно, завершает фразу предыдущего стиха.
- source_word: ወሰከበ ፡ ምስሌሃ
  choice: Он лёг с ней
  rationale: Передаёт буквальный смысл глагола «лечь» с предлогом «с», не устраняя возможный эвфемистический оттенок.
- source_word: ወርእየቶ
  choice: увидела его
  rationale: Объектный суффикс третьего лица мужского рода явно указывает на «его».
- source_word: ውስተ ፡ ምስካብ
  choice: на постели
  rationale: Естественный русский эквивалент пространственного выражения со значением ложа или постели.
- source_word: ወከሠተት ፡ ክንፋ
  choice: Она откинула край своего покрывала
  rationale: Буквально ክንፍ означает «крыло», но в контексте обозначает край или полу покрывающей ткани; выбран ясный современный образ без излишней конкретизации.
- source_word: ወአእመረቶ
  choice: тогда она узнала
  rationale: Глагол может означать «узнала, распознала»; контекст требует узнавания личности.
theological_decisions:
- issue: Характер выражения «лёг с ней»
  choice: Сохранено выражение «лёг с ней»
  alternative: «переспал с ней» или «совершил с ней близость»
  rationale: Источник допускает прямое описание положения и одновременно обычный эвфемистический смысл; перевод не должен преждевременно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Начальный фрагмент оставлен строчными буквами, поскольку он продолжает синтаксис предыдущего стиха. Настоящее время «лежит» сохранено после «и вот» как живой повествовательный переход, соответствующий форме источника.
