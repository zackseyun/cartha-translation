  text: And Jacob went and camped south of Migdal-edar. And he went to his father.
translation:
  language: ru
  text: И пошёл Иаков, и расположился станом к югу от Мигдал-Эдера. Затем он пошёл к своему отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: расположился станом
  rationale: Глагол обозначает остановку на ночлег или стоянку; в данном повествовательном контексте естественно передаётся как устройство стана.
- source_word: መንገለ ደቡብ
  choice: к югу от
  rationale: Передаёт пространственное направление или положение с южной стороны без излишнего уточнения.
- source_word: መግደላደራፋፍ
  choice: Мигдал-Эдера
  rationale: Название места передано в узнаваемой библейской форме, соответствующей значению «башня стада» и английскому консультационному слою.
- source_word: ኀበ አቡሁ
  choice: к своему отцу
  rationale: Возвратное притяжательное местоимение естественно указывает на отца подлежащего, Иакова.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена последовательность двух действий и лёгкая повествовательная торжественность оригинала. Союз во втором предложении передан как «затем», чтобы избежать тяжеловесного повторения «и», не меняя хронологии.
