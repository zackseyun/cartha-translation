  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: ru
  text: И Я отсеку крайнюю плоть с их сердец и с сердец их потомков[a], и сотворю для них святой дух, и очищу их, чтобы с того дня и навеки они не переставали следовать за Мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сниму покров с их сердец и покров с сердец их потомков».'
    reason: Сохраняется ранее предлагавшееся, но менее буквальное понимание существительного как «покрова».
  - marker: b
    text: 'Или: «не отворачивались от Меня». Буквально выражение связано с уходом «из-за Меня», то есть с прекращением следования.'
    reason: Отмечает пространственный образ исходного выражения и альтернативную естественную передачу.
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡ ወቍልፈተ፡ ልበ፡ ዘርኦሙ
  choice: крайнюю плоть их сердец и крайнюю плоть сердец их потомков
  rationale: ቍልፈት означает «крайняя плоть, необрезанность» и сохраняет прямую библейскую метафору обрезания сердца; «покров» неоправданно смягчил бы образ. Формы множественного числа по-русски естественно соотносят сердце с каждым человеком и его потомками.
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ
  choice: сотворю для них святой дух
  rationale: 'Передаёт глагол «сотворю» и сохраняет отсутствие определённого артикля и возможную неоднозначность выражения: текст не уточняет, является ли это собственным именованием.'
- source_word: እነጽሖሙ
  choice: очищу их
  rationale: Прямое и естественное соответствие глаголу очищения, сохраняющее связь с преобразованием сердца.
- source_word: እምድኅሬየ
  choice: не переставали следовать за Мной
  rationale: Буквальный пространственный образ «из-за/позади Меня» в контексте обозначает прекращение следования; русская формулировка ясно передаёт этот смысл.
theological_decisions:
- issue: Метафора изменения сердца
  choice: обрежу крайнюю плоть их сердец
  alternative: сниму покров с их сердец
  rationale: Выбранный вариант сохраняет вес и узнаваемую библейскую метафору, не заменяя её эвфемизмом.
- issue: Значение выражения «святой дух»
  choice: святой дух со строчных букв
  alternative: Святой Дух
  rationale: Исходная конструкция допускает понимание как дарованного святого духа и сама по себе не вынуждает превращать выражение в однозначное собственное имя; строчные буквы сохраняют эту напряжённость.
- issue: Отступление «из-за Меня»
  choice: не переставали следовать за Мной
  alternative: не отворачивались от Меня
  rationale: Основной текст выражает идиоматический смысл следования, а примечание сохраняет более краткую возможную передачу отступления.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Синтаксис сохранён как единое последовательное обещание; архаизмы сведены к минимуму. Заглавная буква в местоимении «Мной» поддерживает принятый в русском религиозном письме уважительный регистр, не меняя смысла.
