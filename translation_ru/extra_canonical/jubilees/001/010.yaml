base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: ru
  text: И многие погибнут, и будут взяты в плен, и попадут в руки врага, потому что оставили Мои установления, Мои заповеди, праздники Моего завета, Мои субботы и Мои святыни, которые Я освятил для Себя среди них, а также Мою скинию и Моё святилище, которое Я освятил для Себя посреди земли, чтобы водворить на нём Моё имя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ
  choice: погибнут
  rationale: Передаёт значение гибели или уничтожения естественным современным русским словом.
- source_word: ይትአኀዙ
  choice: будут взяты в плен
  rationale: Пассивная форма в контексте поражения врагом указывает не просто на схватывание, а на пленение.
- source_word: ውስተ፡ እደ፡ ፀር
  choice: попадут в руки врага
  rationale: Сохраняет библейский образ власти врага, но использует естественную русскую конструкцию.
- source_word: ሥርዐትየ
  choice: Мои установления
  rationale: Различает установленные нормы и следующие далее заповеди, не сужая смысл до обрядов.
- source_word: ቅድሳትየ
  choice: Мои святыни
  rationale: Субстантивированное обозначение святого допускает собирательное понимание священных предметов или реалий; «святыни» сохраняет широту.
- source_word: ደብተራየ
  choice: Мою скинию
  rationale: Традиционный и точно узнаваемый русский библейский термин для священного шатра.
- source_word: አሢም፡ ስምየ፡ ላዕሌሁ
  choice: водворить на нём Моё имя
  rationale: Сохраняет выражение о помещении имени на святилище и его библейско-культовый смысл.
theological_decisions:
- issue: Соотношение «скинии» и «святилища»
  choice: 'Сохранены как два координированных обозначения: «Мою скинию и Моё святилище».'
  alternative: Объединить их в одно понятие или истолковать как храм.
  rationale: Исходный текст называет оба существительных; объединение или замена на «храм» устранили бы возможное смысловое различие.
- issue: Святыни, освящённые Богом среди народа
  choice: «Мои святыни, которые Я освятил для Себя среди них».
  alternative: «Мои святые [дни]» или «священные предметы».
  rationale: Исходная форма допускает более широкое собирательное значение, поэтому конкретизация не внесена.
- issue: Формула пребывания Божьего имени
  choice: «чтобы водворить на нём Моё имя».
  alternative: «чтобы Моё имя обитало там» или истолковательное указание на Божье присутствие.
  rationale: Сохранён исходный образ установления имени на святилище без догматического разъяснения природы присутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксическая протяжённость исходного перечисления сохранена, но связи сделаны ясными; местоимения Бога написаны с прописной буквы согласно распространённой русской библейской издательской практике.
