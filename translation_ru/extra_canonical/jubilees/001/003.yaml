    issue: «Покрывало» менее точно передаёт действие облака.
    rationale: Исходный глагол и английская контрольная передача указывают на ‘осенять/затенять’, а не просто покрывать. «Осеняло» лучше сохраняет образ и смысл, не меняя содержания.
  revised_text: Слава Господа пребывала на горе Синай, и облако осеняло её шесть дней. И Он позвал его.
