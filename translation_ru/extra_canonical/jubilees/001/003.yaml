lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር፡
  choice: Слава Господа
  rationale: Прямое и естественное соответствие геэзскому выражению «слава Господа».
- source_word: ውስተ፡ ደብረ፡ ሲና፡
  choice: пребывала на горе Синай
  rationale: Предлог передаёт местонахождение; добавленный по-русски глагол необходим для полноценного предложения и не устраняет возможной смысловой напряжённости.
- source_word: ወጸለሎ፡ ደመና፡
  choice: и облако покрывало её
  rationale: Глагол передан как длительное «покрывало»; местоимение соотнесено с горой, как в естественном русском прочтении контекста.
- source_word: ስዱሰ፡ ዕለተ።
  choice: шесть дней
  rationale: Буквальная передача указанного срока.
- source_word: ወጸውዖ፡
  choice: И Он позвал его
  rationale: Сохранены субъект и мужской объект, выраженные глагольной формой; референт местоимения намеренно не уточняется сверх источника.
theological_decisions:
- issue: Неявный субъект заключительного глагола
  choice: Он
  alternative: Господь
  rationale: Местоимение сохраняет связность и не повторяет имя там, где источник выражает субъект грамматически.
- issue: Неявный объект «его»
  choice: его
  alternative: Моисея
  rationale: Источник содержит местоименный объект; явное имя преждевременно устранило бы сохранённую в отрывке зависимость от контекста.
- issue: Референт местоимения после «облако покрывало»
  choice: её (гору)
  alternative: её (славу) / без местоимения
  rationale: Ближайший естественный пространственный референт — гора Синай; однако источник допускает зависимость от синтаксического контекста.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но ясный библейский регистр. Синтаксическая незавершённость финала сохранена, поскольку стих заканчивается словами «И Он позвал его» и продолжается в следующем контексте.
