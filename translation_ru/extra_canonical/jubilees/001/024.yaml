  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: ru
  text: И души их прилепятся ко Мне и ко всем Моим заповедям, и они будут исполнять Мои заповеди. Я буду им Отцом, а они будут Моими детьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  choice: души их
  rationale: Сохраняет буквальное значение множественного числа и антропологическую образность источника.
- source_word: ኀቤየ
  choice: ко Мне
  rationale: Передаёт направленность движения или привязанности к говорящему.
- source_word: ትእዛዝየ
  choice: Мои заповеди
  rationale: Естественный и устойчивый русский эквивалент обозначения Божьих повелений.
- source_word: ይገብሩ
  choice: будут исполнять
  rationale: В контексте заповедей русский глагол «исполнять» естественнее буквального «делать», сохраняя смысл деятельного послушания.
- source_word: አበ
  choice: Отцом
  rationale: Прямой эквивалент родственного наименования; прописная буква указывает на Бога как говорящего.
- source_word: ውሉደ
  choice: детьми
  rationale: Контекстуально нейтрально и включает весь народ, не сужая значение до сыновей мужского пола.
theological_decisions:
- issue: Образ отношений Бога и народа
  choice: «Я буду им Отцом, а они будут Мне детьми»
  alternative: «Я стану их Отцом, и они станут Моими сынами»
  rationale: Выбранная формулировка сохраняет взаимную заветную принадлежность и естественно звучит по-русски, не вводя гендерного ограничения, которого контекст не требует.
- issue: Смысл привязанности душ к Богу
  choice: «прилепятся ко Мне»
  alternative: «обратятся ко Мне»
  rationale: «Прилепятся» сохраняет сильный образ устойчивой близости и верности, не сводя его лишь к обращению или покаянию.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис ясен для широкого читателя; повтор «Мои заповеди» сохранён вслед за источником.
