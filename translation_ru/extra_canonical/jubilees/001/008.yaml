  text: and they will turn to foreign gods, to those who cannot deliver them from any of their distress.
translation:
  language: ru
  text: И они обратятся к чужим богам, которые не смогут избавить их ни от одного из их бедствий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትመየጡ፡ ኀበ
  choice: обратятся к
  rationale: Передаёт направленное обращение к иным объектам поклонения естественным современным русским выражением.
- source_word: አምላክ፡ ነኪር
  choice: чужим богам
  rationale: «Чужие боги» точно сохраняет значение иноземных или посторонних божеств и соответствует библейскому регистру.
- source_word: ኢያድኅንዎሙ
  choice: не смогут избавить их
  rationale: Передаёт отрицание способности спасти или избавить; «избавить» естественно сочетается с бедствиями.
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  choice: ни от одного из их бедствий
  rationale: В области действия отрицания «от всех их бедствий» означает полную неспособность избавить; конструкция с «ни» устраняет возможное русское прочтение как неспособности избавить лишь от совокупности бедствий.
theological_decisions:
- issue: Характер чужих богов
  choice: которые не смогут избавить их ни от одного из их бедствий
  alternative: которые не смогут избавить их от всех их бедствий
  rationale: Выбранный вариант сохраняет утверждение о полной неспособности чужих богов избавлять, не допуская смысла частичного избавления.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством; синтаксис простой и ясный, без конфессионально окрашенных добавлений.
