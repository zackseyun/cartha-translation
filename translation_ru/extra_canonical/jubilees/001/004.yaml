  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: ru
  text: И в седьмой день Он воззвал к Моисею из облака. Вид славы Яхве был подобен пылающему огню на вершине горы.[a] И пробыл Моисей на горе сорок дней и сорок ночей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слава Яхве явилась как пылающий огонь».'
    reason: Сохраняет допустимое глагольное понимание неоднозначной формы ወርእዩ наряду с принятым в основном тексте номинальным пониманием «вид».
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: славы Яхве
  rationale: ስብሐት передаёт «слава», а እግዚአብሔር в данном библейском контексте соответствует божественному имени; форма «Яхве» сохраняет имя, а не заменяет его титулом.
- source_word: ወርእዩ
  choice: вид
  rationale: Форма в контексте теофании допускает номинальное понимание «вид, облик, явление»; «вид славы» сохраняет структуру источника и не превращает её без необходимости в простой глагол «явилась».
- source_word: እሳት፡ ዘያነድድ
  choice: пылающему огню
  rationale: Буквально речь об огне, который горит или пожигает; «пылающий огонь» естественно и точно передаёт яркий образ.
- source_word: ውስተ፡ ርእሰ፡ ደብር
  choice: на вершине горы
  rationale: Буквально «на голове/вершине горы»; современное русское «на вершине горы» передаёт пространственный смысл без неестественной кальки.
- source_word: ወሀሎ፡ ሙሴ
  choice: И пробыл Моисей
  rationale: Глагол бытия с указанием продолжительности естественно передаётся по-русски как «пробыл», подчёркивая пребывание в течение сорока дней и ночей.
theological_decisions:
- issue: Передача божественного имени
  choice: Яхве
  alternative: Господь
  rationale: Сохранение личного имени соответствует исходному библейскому контексту и не подменяет имя традиционным титулом.
- issue: Синтаксис описания славы
  choice: «Вид славы Яхве был подобен…»
  alternative: «Слава Яхве явилась как…»
  rationale: Основной текст сохраняет номинальную конструкцию и теофаническую формулу источника, не снимая лексико-синтаксическую неоднозначность; более глагольное понимание отмечено в сноске.
- issue: Подлежащее первого предложения
  choice: «Он воззвал»
  alternative: «Яхве воззвал»
  rationale: Местоименное подлежащее восстанавливается из ближайшего контекста повествования и не добавляет повтор имени, отсутствующий в данном фрагменте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены повтор «сорок дней и сорок ночей», теофанический образ и личное имя Яхве.
