  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: ru
  text: 'В шестнадцатый день того месяца Господь сказал Моисею: «Поднимись ко Мне на гору, и Я дам тебе две каменные скрижали — закон и заповедь, которые Я написал, чтобы ты учил их». И Моисей поднялся на гору Господню, и слава Господня пребывала на горе Синай.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Господь
  rationale: В представленном геэзском тексте употреблён титул «Господь», а не переданное буквами собственное имя Яхве; перевод следует непосредственно засвидетельствованной форме источника.
- source_word: ዕረግ፡ ኀቤየ፡ ውስተ፡ ደብር
  choice: Поднимись ко Мне на гору
  rationale: Естественно и точно передаёт повеление подняться к Богу на гору.
- source_word: ክልኤተ፡ ጽላተ፡ እብን
  choice: две каменные скрижали
  rationale: «Скрижали» — понятный современному читателю и укоренённый библейский эквивалент каменных плит для письма.
- source_word: ዘሕግ፡ ወዘትእዛዝ
  choice: закон и заповедь
  rationale: Сохранены два отдельных существительных источника без сведения их к одному понятию.
- source_word: ታስብዎሙ
  choice: чтобы ты научил им народ
  rationale: Глагол передаёт обучение; объект обучения выражен местоимением «им», а подразумеваемые адресаты раскрыты как народ ради ясности по контексту.
- source_word: ደብረ፡ እግዚአብሔር
  choice: гора Господня
  rationale: Сохраняется конструкция принадлежности источника в естественной русской библейской форме.
- source_word: ወኀደረ
  choice: пребывала
  rationale: Передаёт продолжительное пребывание; формулировка согласована с засвидетельствованным в консультационном слое продолжением о славе Господней.
theological_decisions:
- issue: Передача божественного обозначения
  choice: Господь
  alternative: Яхве
  rationale: Хотя английский консультационный слой использует Yahweh, доступный геэзский источник содержит እግዚአብሔር («Господь»). Выбор не восстанавливает собственное имя без прямого свидетельства данного исходного текста.
- issue: Связь закона и заповеди со скрижалями
  choice: две каменные скрижали — закон и заповедь
  alternative: две каменные скрижали закона и заповеди
  rationale: Тире естественно сохраняет возможность понимать «закон и заповедь» как содержание или пояснение к скрижалям, не навязывая более узкую синтаксическую связь.
- issue: Субъект заключительного пребывания
  choice: слава Господня пребывала
  alternative: Моисей оставался
  rationale: Английский аудированный слой и известная структура фразы поддерживают «славу Господню» как субъект продолжения, хотя предоставленный геэзский фрагмент обрывается сразу после глагола «пребывала» и сам по себе не содержит этого существительного в видимом отрывке.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («скрижали», «гора Господня»). Синтаксис упрощён для устного восприятия, но параллелизм и торжественный тон сохранены.
