- from: 'В шестнадцатый день того месяца Господь сказал Моисею: «Поднимись ко Мне на гору, и Я дам тебе две каменные скрижали — закон и заповедь, которые Я написал, чтобы ты научил им народ». И Моисей поднялся на гору Господню, и слава Господня пребывала на горе Синай.'
  to: 'В шестнадцатый день того месяца Господь сказал Моисею: «Поднимись ко Мне на гору, и Я дам тебе две каменные скрижали — закон и заповедь, которые Я написал, чтобы ты учил их». И Моисей поднялся на гору Господню, и слава Господня пребывала на горе Синай.'
