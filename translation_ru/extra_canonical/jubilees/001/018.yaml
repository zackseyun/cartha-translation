  text: And I will not abandon them, nor will I estrange myself from them, for I am the Lord their God.” And Moses fell on his face,
translation:
  language: ru
  text: И Я не оставлю их и не отдалюсь от них[a], ибо Я — Господь, их Бог». И Моисей пал ниц,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не стану чужим им».'
    reason: Геэзский глагол выражает отказ от отчуждения; примечание сохраняет образный вариант передачи без изменения основного смысла.
lexical_decisions:
- source_word: ጎሙ
  choice: не оставлю их
  rationale: В предоставленном фрагменте начало глагольной формы, по-видимому, утрачено при разделении текста; смысл восстанавливается по контексту и засвидетельствованному переводу как обещание не оставлять народ.
- source_word: ኢይትናከሮሙ
  choice: не стану чужим для них
  rationale: Передаёт значение отчуждения без усилительного толкования и сохраняет отличие от предшествующего «не оставлю».
- source_word: እግዚአብሔር
  choice: Господь
  rationale: Обычный русский эквивалент геэзского обозначения Господа; написание не подменяет его формой личного имени Яхве.
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ
  choice: И Моисей пал лицом на землю
  rationale: Естественный современный русский оборот, точно передающий жест падения ниц.
theological_decisions:
- issue: Характер Божьего отношения к народу
  choice: не оставлю их и не стану чужим для них
  alternative: не покину их и не отвращусь от них
  rationale: Выбранная формулировка сохраняет два параллельных, но не полностью совпадающих обещания исходного текста и не добавляет идеи отвращения, прямо не выраженной в геэзском.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Я» при речи Бога написано с прописной буквы. Конечная запятая сохранена, поскольку стих продолжается в следующем фрагменте.
