  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: ru
  text: И они устроят себе высоты, и священные рощи, и резные изображения; и каждый будет поклоняться своему заблуждению. Они будут приносить своих детей в жертву демонам и всякому делу, порождённому заблуждением их сердец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: высоты
  rationale: В данном перечне предметов ложного культа слово по контексту передаёт культовые возвышения или святилища; традиционное библейское «высоты» сохраняет религиозный смысл.
- source_word: ወአመ
  choice: священные рощи
  rationale: В сочетании с высотами и изваяниями обозначает культовые насаждения либо рощи; уточнение «священные» делает функцию понятной современному читателю, не отождествляя их без достаточных оснований с конкретным культовым предметом.
- source_word: ወግልፎ
  choice: изваяния
  rationale: Передаёт изготовленные или резные культовые изображения без чрезмерного уточнения их формы.
- source_word: ለስሒት
  choice: собственному заблуждению
  rationale: Сохраняет абстрактное значение «ошибка, заблуждение» и распределительное «каждый — своему».
- source_word: ለአጋንንት
  choice: демонам
  rationale: Прямой и понятный эквивалент обозначения злых духов в данном контексте жертвоприношения.
- source_word: ኵሉ፡ ግብረ፡ ስሕተት፡ ልቦሙ
  choice: всякому порождению заблуждения своих сердец
  rationale: Буквально выражение связано со «всяким делом/деянием заблуждения их сердца»; «порождению» естественно передаёт то, что заблуждающееся сердце производит, при этом сохраняет широту исходной формулировки.
theological_decisions:
- issue: Характер ложного поклонения
  choice: каждый станет поклоняться собственному заблуждению
  alternative: каждый станет поклоняться своему идолу
  rationale: Исходный текст говорит о заблуждении, а не однозначно об идоле; выбранный вариант не сужает богословскую мысль.
- issue: Объект последующих жертвоприношений
  choice: демонам и всякому порождению заблуждения своих сердец
  alternative: демонам и всякому делу заблуждения их сердец
  rationale: Сохранена возможность понимать вторую часть как более широкий ряд объектов или проявлений ложного культа, а не как дополнительное наименование демонов.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксис умеренно торжественный, но понятный; устаревшие формы и конфессионально нагруженные уточнения избегаются.
