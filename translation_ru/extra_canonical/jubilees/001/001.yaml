lexical_decisions:
- source_word: ወኮነ
  choice: И было
  rationale: Передаёт традиционную повествовательную формулу и сохраняет связь с последующим контекстом.
- source_word: በቀዳሚ፡ ዓመት
  choice: в первый год
  rationale: Прямое и естественное соответствие исходной временной формуле.
- source_word: በፀአቶሙ
  choice: после выхода
  rationale: Существительное обозначает выход или отправление; «выход» прозрачно передаёт смысл без терминологизации словом «исход».
- source_word: ለደቂቀ፡ እስራኤል
  choice: сынов Израиля
  rationale: Сохраняет библейскую родословно-народную формулу, оставаясь понятным в современном русском языке.
- source_word: እምነ፡ ግብጽ
  choice: из Египта
  rationale: Прямо передаёт исходный пункт движения.
- source_word: በወርኅ፡ ሣልስ
  choice: в третий месяц
  rationale: Сохраняет календарную формулировку и незавершённость предложения.
