  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: ru
  text: 'И Господь научил его тому, что было прежде и что ещё произойдёт: повествованию о разделениях всех дней закона и свидетельства.[a] И Он сказал: «Прими к сердцу всё, что Я говорю тебе на этой горе, и запиши это в книгу, чтобы их поколения увидели, что Я не оставил их из-за всего зла, которое они совершили, преступая установление, которое Я устанавливаю между Мною и тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «разделения всех дней закона и свидетельства» может обозначать устройство или распределение времён, относящихся к закону и свидетельству; его точный синтаксический охват не вполне ясен.
    reason: Сохраняет неоднозначность плотной исходной формулы ኩፋሌ፡ ኵሉ፡ መዋዕላት፡ ሕግ፡ ወለስምዕ и не сводит её без достаточных оснований исключительно к календарным периодам.
lexical_decisions:
- source_word: አመሮ
  choice: открыл ему
  rationale: Каузативная форма со значением «дал узнать, научил». «Открыл ему» естественно по-русски и передаёт сообщение Господом сокрытого знания.
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: что было прежде и что ещё произойдёт
  rationale: Сохранено противопоставление прежнего и грядущего; частица ኒ передана словом «ещё».
- source_word: ነገረ፡ ኩፋሌ
  choice: повествование о разделениях
  rationale: ነገር может обозначать слово, рассказ или изложение, а ኩፋሌ — разделение/деление; сочетание передано без преждевременного сведения только к календарю.
- source_word: አነብር፡ ልበከ
  choice: прими к сердцу
  rationale: Идиома буквально требует «положить/установить сердце» и означает сосредоточенно принять и запомнить сказанное.
- source_word: ሥርዐት
  choice: установление
  rationale: Слово может означать порядок, устав или предписание. «Установление» сохраняет широту значения и сочетается с последующим глаголом «утверждаемое».
- source_word: እሠርዕ
  choice: утверждаемое Мною
  rationale: Передаёт действие установления порядка; причастная конструкция делает русскую фразу плавной, не добавляя отсутствующего в источнике «сегодня».
theological_decisions:
- issue: Обозначение Бога словом እግዚአብሔር
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В данном месте употреблён титул «Господь», а не записанное собственное имя Яхве; поэтому типографическое выделение как замена тетраграмматона неуместно.
- issue: Связь неоставления народа с совершённым злом
  choice: «Я не оставил их из-за всего зла» с поясняющей сноской
  alternative: «Я не оставил их, несмотря на всё зло»
  rationale: Предлог በእንተ допускает причинно-тематический оттенок. Основной текст сохраняет формальную связь, а сноска отмечает вероятное уступительное понимание, не устраняя неоднозначность.
- issue: Отношение установления к Богу и Моисею
  choice: «между Мною и тобой»
  alternative: «между Мною и вами»
  rationale: Источник использует форму единственного числа и обращается к Моисею; расширение адресата до народа не внесено.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы; архаизмы и конфессионально маркированные термины не вводились.
