  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: ru
  text: и субботы, и праздники, и юбилеи, и установления. После этого они обратятся ко Мне из среды народов всем сердцем, всей душой и всеми силами. Я соберу их из среды всех народов, и они будут искать Меня, чтобы найти Меня. И когда они будут искать Меня всем сердцем и всей душой, Я открою им обильный мир в праведности и пересажу их[a] как праведное насаждение,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посажу их».'
    reason: Глагол в данном контексте образно означает пересадить или насадить; вариант «пересажу» точнее подчёркивает перемещение собранного из народов народа.
lexical_decisions:
- source_word: ይትመየጡ
  choice: обратятся
  rationale: Передаёт возвращение и обращение к Богу, не уточняя сверх источника, идёт ли речь прежде всего о перемене места или внутреннего состояния.
- source_word: አስተጋብኦሙ
  choice: соберу их
  rationale: Каузативный глагол означает собирание воедино; контекст уточняет, что собирают из среды всех народов.
- source_word: የኀሡኒ
  choice: будут искать Меня
  rationale: Прямое и естественное соответствие повторяющемуся в стихе глаголу поиска.
- source_word: እከሥት
  choice: открою
  rationale: Сохраняет значение явления или раскрытия им обильного мира, не заменяя его более толковательным «дарую».
- source_word: እፈልሶሙ
  choice: пересажу их
  rationale: Глагол выражает перемещение или пересаживание и отличается от обычного глагола «сажать»; образ согласуется с предшествующим собиранием из народов.
- source_word: ተክለ፡ ርቱዐ
  choice: как насаждение правды
  rationale: Естественный русский библейский образ, передающий растение или насаждение, характеризуемое прямотой, правильностью и праведностью.
theological_decisions:
- issue: Условие поиска Бога и возможность найти Его
  choice: они будут искать Меня, чтобы найти Меня
  alternative: они будут искать Меня, чтобы Я был найден ими
  rationale: Естественная русская конструкция сохраняет целевую связь и не превращает её в безусловное утверждение, устраняя лишь тяжеловесный пассив.
- issue: Связь мира и праведности
  choice: обильный мир в праведности
  alternative: обильный мир с праведностью
  rationale: Предлог источника допускает сферу или состояние; «в праведности» сохраняет эту связь, не определяя праведность ни как отдельный сопутствующий дар, ни как причинное основание мира.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены повтор «всем сердцем и всей душой», цепочка союзов в начальном фрагменте и растительная метафора. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской издательской традиции.
