translation:
  language: ru
  text: всем Моим сердцем и всей Моей душой. И они станут благословением, а не проклятием; станут главой, а не хвостом. Я воздвигну Моё святилище среди них и буду обитать с ними,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ
  choice: всем Моим сердцем и всей Моей душой
  rationale: Сохранён параллелизм и буквальный образ геэзского текста; притяжательная форма первого лица передана явно.
- source_word: ለበረከት፡ ወአኮ፡ ለመርገም
  choice: благословением, а не проклятием
  rationale: Именная конструкция источника естественно и точно передана русским творительным падежом после «станут».
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ
  choice: главой, а не хвостом
  rationale: Сохранена библейская антитеза «голова — хвост» без поясняющего толкования.
- source_word: እሐንጽ፡ መቅደስየ
  choice: Я воздвигну Моё святилище
  rationale: Глагол передан возвышенным, но современно понятным «воздвигну»; «Моё» сохраняет суффикс первого лица.
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Передаёт пространственное значение «посреди/в среде их» естественным современным русским выражением.
- source_word: እኀድር፡ ምስሌሆሙ
  choice: буду обитать с ними
  rationale: «Обитать» соответствует сакральному контексту пребывания Бога и не добавляет толкования.
theological_decisions:
- issue: Субъект притяжательных форм в выражениях о сердце, душе и святилище
  choice: Моим / Моей / Моё с прописной буквы
  alternative: моим / моей / моё со строчной буквы
  rationale: По контексту говорит Бог; прописная буква соответствует принятому русскому библейскому оформлению местоименных обозначений Бога, не меняя смысла источника.
- issue: Характер пребывания Бога среди народа
  choice: «буду обитать с ними» без уточнения способа присутствия
  alternative: «поселюсь среди них» или богословски конкретизированная формулировка
  rationale: Источник утверждает пребывание Бога, но здесь не разъясняет его модальность; неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксический параллелизм и образность источника сохранены; искусственные архаизмы исключены.
