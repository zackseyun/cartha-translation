  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: ru
  text: И все узнают, что Я — Бог Израиля и Отец всех детей Иакова, и Царь на горе Сион во веки веков; и Сион и Иерусалим будут святы».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያእምር
  choice: узнают
  rationale: Форма передаёт будущее знание/признание; «узнают» естественно по-русски и сохраняет смысл исходного текста.
- source_word: አብ
  choice: Отец
  rationale: Прямое соответствие слову «отец»; прописная буква уместна как именование Бога.
- source_word: ደቂቀ፡ ያዕቆብ
  choice: сынов Иакова
  rationale: Буквально «детей/сынов Иакова»; в данном родовом контексте традиционное и ясное «сынов Иакова».
- source_word: ንጉሥ
  choice: Царь
  rationale: Точно передаёт царский титул; прописная буква отражает его употребление по отношению к Богу.
- source_word: ለዓለመ፡ ዓለም
  choice: во веки веков
  rationale: Сохраняет усиленную идиому вечности исходного текста и звучит естественно в библейском русском регистре.
- source_word: ቅድስት
  choice: святы
  rationale: Сказуемое относится к двум названиям — Сиону и Иерусалиму; русское множественное число ясно передаёт это согласование.
theological_decisions:
- issue: Божественное отцовство по отношению к потомкам Иакова
  choice: Отец всех сынов Иакова
  alternative: отец всех детей Иакова
  rationale: Сохранено прямое утверждение источника без расширения его на иные группы и без конфессионального истолкования.
- issue: Место и длительность царствования
  choice: Царь на горе Сионе во веки веков
  alternative: царь на горе Сион навеки
  rationale: Сохранены и локативная формулировка, и усиленное выражение вечности, без попытки уточнить характер царствования.
- issue: Святость Сиона и Иерусалима
  choice: Сион и Иерусалим будут святы
  alternative: Сион и Иерусалим станут святыней
  rationale: Источник предицирует святость обоим местам; перевод не подменяет это более узким понятием святыни.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис близок к оригиналу, но читается естественно. Неподтверждённая исходником фраза о явлении Господа не добавлена.
