  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: ru
  text: И всякий ангел и всякий дух узнает, что они — Мои дети, а Я — их Отец в праведности и справедливости и что Я люблю их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወያአምርዎሙ
  choice: и … узнает
  rationale: Форма передаёт будущее знание/узнавание; русское единственное число согласовано с повторяющимся «всякий».
- source_word: ውሉድየ
  choice: Мои дети
  rationale: Прямо передаёт существительное «дети» с притяжательным суффиксом первого лица.
- source_word: አቡሆሙ
  choice: их Отец
  rationale: Сохраняет родственное наименование Бога и местоименный суффикс «их».
- source_word: በርቶዕ፡ ወበጽድቅ
  choice: в праведности и справедливости
  rationale: 'Сохраняет два координированных понятия и не сводит их к одному: первое связано с прямотой/праведностью, второе — со справедливостью/правосудием.'
- source_word: ወአፈቅርሙ
  choice: и что Я люблю их
  rationale: Передаёт Божью любовь как самостоятельное завершающее утверждение.
theological_decisions:
- issue: Смысл выражения «в праведности и справедливости»
  choice: Оставить его при утверждении «Я — их Отец» без поясняющего дополнения
  alternative: Истолковать как способ Божьего отцовства или как основание признания их детьми
  rationale: Синтаксис допускает смысловую напряжённость; перевод сохраняет связь и не навязывает более узкое богословское толкование.
- issue: Регистр местоимений, относящихся к Богу
  choice: Прописные «Мои», «Я»
  alternative: Строчные «мои», «я»
  rationale: Прописные формы соответствуют принятому русскому библейскому издательскому регистру, не меняя смысла исходного текста.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повтор «всякий ангел и всякий дух» сохранён ради точности и ритма; лишний материал из прежней редакции не восстановлен.
