base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: ru
  text: 'И он помолился и сказал: «Господи, Боже мой, не оставляй Твой народ и Твоё наследие идти путём заблуждения своих сердец и не предавай их в руки их врагов — народов, чтобы те не господствовали над ними и не побуждали их грешить против Тебя. Да возвысится, Господи, Твоя милость над Твоим народом».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትኅድግ
  choice: не оставляй
  rationale: Передаёт запретительную форму и значение «не оставлять, не покидать», сохраняя молитвенную настойчивость.
- source_word: ሕዝበከ፡ ወርስትከ
  choice: Твой народ и Твоё наследие
  rationale: Сохранены оба параллельных обозначения Израиля без сведения их к одному понятию.
- source_word: በሐዊር፡ በስሕተተ፡ ልቦሙ
  choice: ходить в заблуждении своих сердец
  rationale: Формально сохраняет метафору хождения и множественное число «сердец», оставаясь понятным по-русски.
- source_word: ውስተ፡ እዴ፡ ፀሮሙ
  choice: в руки их врагов
  rationale: Естественный русский библейский эквивалент идиомы «в руку врагов»; множественное число согласовано с коллективным обозначением врагов.
- source_word: አሕዛብ
  choice: народы
  rationale: Передаёт обозначение чужих народов без конфессионально нагруженного варианта «язычники».
- source_word: ኢይኰንንዎሙ
  choice: не господствовали над ними
  rationale: По контексту передаёт власть и владычество врагов, не сужая значение до судебного осуждения.
- source_word: ኢይገብርዎሙ፡ ከመ፡ ይኅጥኡ፡ ለከ
  choice: не заставляли их грешить против Тебя
  rationale: 'Сохраняет каузативную конструкцию: враги становятся причиной греха народа против Бога.'
- source_word: ይትለዐል፡ ... ምሕረትከ
  choice: да возвысится ... Твоя милость
  rationale: Сохранён образ возвышения милости над народом, хотя в современном русском он звучит торжественно и несколько необычно.
theological_decisions:
- issue: Соотношение Божьего оставления и человеческого заблуждения
  choice: не оставляй ... ходить в заблуждении своих сердец
  alternative: не допускай, чтобы ... следовали заблуждению своих сердец
  rationale: Выбранная формулировка сохраняет напряжение оригинала между Божьим действием и внутренним заблуждением народа, не объясняя его богословски.
- issue: Значение አሕዛብ
  choice: народы
  alternative: язычники
  rationale: «Народы» нейтральнее и ближе к этнополитическому контексту врагов; «язычники» могло бы внести более позднюю религиозную категоризацию.
- issue: Образ возвышенной милости
  choice: Да возвысится ... Твоя милость над Твоим народом
  alternative: Да пребудет Твоя милость над Твоим народом
  rationale: Сохранено необычное движение образа в источнике, а не заменено более привычной, но менее точной формулой.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как издательская норма почтительного регистра. Синтаксис сохраняет библейский параллелизм, но избегает устаревших славянизмов.
