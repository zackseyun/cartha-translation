  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: ru
  text: 'И Он сказал ангелу присутствия: «Запиши для Моисея всё от начала творения до того времени, когда Моё святилище будет воздвигнуто среди них во веки веков и Господь явится взорам всех».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: ангел присутствия
  rationale: Буквально «ангел лица»; в контексте небесного двора это устойчивое обозначение ангела, пребывающего перед Божьим лицом. «Ангел присутствия» сохраняет традиционный смысл и естественно звучит по-русски.
- source_word: እምቀዳሚ፡ ፍጥረት፡
  choice: от начала творения
  rationale: Прямо передаёт исходную временную формулу без добавочного толкования.
- source_word: ይትሐነጽ፡
  choice: будет воздвигнуто
  rationale: Страдательная форма глагола «строить»; «воздвигнуто» соответствует сакральному объекту и сохраняет пассивную конструкцию.
- source_word: ለዓለመ፡ ዓለማት፡
  choice: во веки веков
  rationale: Традиционная и понятная русская передача усиленной формулы вечности, буквально связанной с «веком веков».
- source_word: ያስተርኢ፡ ... ለዐይን፡ ኵሉ፡
  choice: явится взорам всех
  rationale: Передаёт зримое явление Господа всем без неестественного русского оборота «глазам всех».
theological_decisions:
- issue: Соотношение «Моё святилище» и «Господь»
  choice: Сохранена смена первого лица на именование «Господь»
  alternative: Унифицировать субъект как «Я явлюсь»
  rationale: Исходный текст действительно переходит от притяжательного местоимения первого лица к титулу «Господь»; эту напряжённость нельзя сглаживать.
- issue: Продолжительность пребывания святилища
  choice: «будет воздвигнуто среди них во веки веков»
  alternative: «будет построено среди них — навеки»
  rationale: Выбранная формулировка сохраняет связь формулы вечности со святилищем и торжественную итеративность оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис остаётся ясным для широкого читателя; архаизмы сведены к устойчивой формуле «во веки веков».
