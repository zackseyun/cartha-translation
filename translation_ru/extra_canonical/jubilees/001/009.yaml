  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: ru
  text: И это свидетельство будет услышано как свидетельство против них. Ибо они забудут все Мои заповеди — всё, что Я повелеваю им, — и пойдут вслед за народами, вслед за их нечистотой и постыдными делами; будут служить их богам, и те станут для них камнем преткновения, бедствием, скорбью и западнёй.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: свидетельство
  rationale: 'В стихе слово повторено в конструкции, передающей судебный оттенок: свидетельство будет услышано против них.'
- source_word: አሕዛብ
  choice: народы
  rationale: Обычное библейское обозначение иных народов; выбор не сужает значение до политически окрашенного «язычники».
- source_word: ርኵሶሙ
  choice: их нечистота
  rationale: Сохраняет религиозно-нравственную широту понятия нечистоты.
- source_word: ኀሣሮሙ
  choice: их постыдные дела
  rationale: Естественно по-русски передаёт предметное множественное значение позорного или постыдного поведения.
- source_word: ማዕቅፈ
  choice: камень преткновения
  rationale: Передаёт образ причины падения и соответствует устойчивой библейской речи.
- source_word: መሥገርት
  choice: западня
  rationale: Сохраняет образ ловушки и естественно завершает ряд бедствий.
theological_decisions:
- issue: Отнесение местоимения в выражении «станут для них»
  choice: «те» относится к богам народов
  alternative: Отнести последствия ко всему предшествующему уклонению
  rationale: Ближайший грамматический антецедент — «их боги»; формулировка сохраняет это естественное чтение без дополнительного толкования.
- issue: Судебный характер свидетельства
  choice: «как свидетельство против них»
  alternative: «они услышат это свидетельство»
  rationale: Повтор слова «свидетельство» и контекст поддерживают обвинительный судебный смысл, который важно не ослаблять.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён для ясности, но сохранены повтор, последовательность отступничества и нарастающий ряд его последствий.
