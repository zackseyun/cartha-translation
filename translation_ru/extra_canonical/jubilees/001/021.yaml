translation:
  language: ru
  text: 'чистое сердце и святой дух, и не дай им отныне и навеки оказаться в ловушке своих грехов». И сказал Господь Моисею: «Я знаю их строптивость, их помыслы и их упрямство, и они не послушают'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ንጹሐ፡
  choice: чистое сердце
  rationale: Прямое и естественное соответствие геэзскому выражению «сердце чистое».
- source_word: መንፈሰ፡ ቅዱሰ፡
  choice: святой дух
  rationale: Сохраняет буквальный смысл и неопределённость выражения; строчная буква не навязывает отождествление с именованием Лица Троицы.
- source_word: ኢይትዐቀጹ፡ በኀጢአቶሙ፡
  choice: не дай им … запутаться в сетях своих грехов
  rationale: Передаёт образ попадания в ловушку или силки и одновременно естественно звучит по-русски.
- source_word: ተዋሥኦቶሙ፡
  choice: их строптивость
  rationale: Передаёт противление и непокорность без чрезмерно узкого догматического истолкования.
- source_word: ሕሊናሆሙ፡
  choice: их помыслы
  rationale: Соответствует внутренним мыслям или намерениям и сохраняет возвышенный библейский регистр.
- source_word: ይቡሰ፡
  choice: их упрямство
  rationale: Передаёт идиоматический смысл «жёсткости/жестоковыйности» естественным современным русским словом.
theological_decisions:
- issue: Референт выражения «святой дух»
  choice: святой дух
  alternative: Святой Дух
  rationale: Исходный фрагмент допускает понимание как дарованного святого расположения духа, так и действия Божьего Духа; строчная буква сохраняет эту неоднозначность.
- issue: Образ порабощения грехом
  choice: запутаться в сетях своих грехов
  alternative: быть уловленными своими грехами
  rationale: Сохранён метафорический образ ловушки без добавления учения о внешнем деятеле или предопределённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Перевод начинается и заканчивается внутри предложения, как и предоставленный фрагмент; синтаксическая незавершённость в конце сохранена.
