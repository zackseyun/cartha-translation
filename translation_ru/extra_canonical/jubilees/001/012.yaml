  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: ru
  text: И Я пошлю к ним свидетелей, чтобы свидетельствовать им[a], но они не станут слушать. Они убьют и свидетелей, прогонят тех, кто ищет закона, всё ниспровергнут и начнут творить зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствовать против них».'
    reason: Сохраняет судебный оттенок выражения, возможный в контексте, не подменяя им более прямое адресное значение в основном тексте.
lexical_decisions:
- source_word: ሰማዕተ
  choice: свидетелей
  rationale: Сохраняет повторяющийся образ свидетелей и судебно-пророческий оттенок исходного слова.
- source_word: ሕገ
  choice: закона
  rationale: Передаёт «закон» без конфессионального уточнения; строчная буква сохраняет возможность общего и данного Богом закона.
- source_word: ይሰድድዎሙ
  choice: прогонят
  rationale: Естественно передаёт удаление или изгнание ищущих закона, не усиливая значение до более специального «подвергнут гонениям».
- source_word: ያፀርዑ
  choice: ниспровергнут
  rationale: Передаёт решительное разрушение или переворачивание установленного порядка; «всё перевернут» звучало бы разговорнее и могло бы быть понято нейтрально.
- source_word: ለገቢረ፡ እኩይ
  choice: творить зло
  rationale: Дигнифицированное и при этом понятное современному читателю соответствие выражению «делать зло».
theological_decisions:
- issue: Направленность Божьего свидетельства
  choice: свидетельствовать им
  alternative: свидетельствовать против них
  rationale: Дательный показатель в источнике допускает адресное понимание «им», тогда как контекст свидетелей допускает судебный оттенок «против них»; основной текст не усиливает обвинительный смысл, а примечание сохраняет альтернативу.
- issue: Значение слова «закон»
  choice: закон со строчной буквы
  alternative: Закон с прописной буквы
  rationale: Источник не требует типографического отождествления исключительно с кодифицированной Торой; строчная буква сохраняет смысловую широту и не устраняет вероятную отсылку к Божьему закону.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Местоимение «Я» написано с прописной буквы как речь Бога. Длинная цепочка исходных союзов разделена на два предложения для ясности, при этом последовательность действий сохранена.
