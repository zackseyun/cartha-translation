  text: And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons
translation:
  language: ru
  text: И они забудут весь Мой закон, и все Мои заповеди, и все Мои установления, и будут ошибаться относительно новолуний.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и собьются относительно новолуний».'
    reason: Глагол допускает передачу через «ошибаться», «сбиваться» или «заблуждаться»; исходная формулировка не уточняет характер этой ошибки как календарное исчисление.
lexical_decisions:
- source_word: ይረስዑ
  choice: забудут
  rationale: Прямо передаёт значение глагола «забывать» и сохраняет пророческое будущее время.
- source_word: ሕግየ
  choice: Мой закон
  rationale: Соответствует слову «закон» с притяжательным суффиксом первого лица.
- source_word: ትእዛዝየ
  choice: Мои заповеди
  rationale: Естественный русский эквивалент для предписаний или повелений Бога.
- source_word: ፍትሕየ
  choice: Мои установления
  rationale: Передаёт правовые постановления; позволяет отличить их от более общего «закона» и «заповедей».
- source_word: ይስሕቱ
  choice: собьются
  rationale: Глагол допускает значения «ошибаться», «заблуждаться», «сбиваться»; здесь выбран естественный оборот с последующим предметом ошибки.
- source_word: ሠርቀ
  choice: в исчислении новомесячий
  rationale: В данном календарном контексте речь идёт о новолуниях/новомесячиях; добавление «в исчислении» естественно выражает то, относительно чего они собьются, не превращая это в нравственное отступление вообще.
theological_decisions:
- issue: Значение заключительной фразы о новомесячиях
  choice: собьются в исчислении новомесячий
  alternative: уклонятся к новомесячиям / будут заблуждаться относительно новолуний
  rationale: Контекст книги связан с календарным счётом. Формулировка сохраняет значение ошибки относительно новомесячий и не вводит неподтверждённую мысль о поклонении им.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Местоименные формы, относящиеся к говорящему Богу, написаны с прописной буквы. Конец стиха оформлен без висячей запятой, поскольку данный сегмент обрывается перед продолжением перечня в следующем стихе.
