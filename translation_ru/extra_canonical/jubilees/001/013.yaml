translation:
  language: ru
  text: пред Моими глазами. И Я скрою от них Моё лицо, и предам их в руки народов — в плен, на разграбление и на пожирание; искореню[a] их из земли и рассею среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырву с корнем».'
    reason: Отмечает конкретный образ сильного устранения, заложенный в исходном глаголе, при более естественном основном варианте «искореню».
lexical_decisions:
- source_word: አኀብእ፡ ገጽየ፡ እምኔሆሙ
  choice: Я скрою от них Моё лицо
  rationale: Формально и естественно передаёт геэзское выражение о сокрытии лица, сохраняя библейский образ отнятого благоволения и защиты.
- source_word: እሜጥዎሙ፡ ውስተ፡ እደ፡ አሕዛብ
  choice: предам их в руки народов
  rationale: Сохраняет устойчивую библейскую метафору власти и подчинения; множественное «народов» соответствует አሕዛብ.
- source_word: ለፂዋዌ፡ ወለኀብለ፡ ወለተበልዖ
  choice: в плен, на разграбление и пожирание
  rationale: Передаёт трёхчастное нарастание бедствий и сохраняет резкий образ «пожирания», не ослабляя его до общего «уничтожения».
- source_word: አቤስሎሙ፡ እማእከለ፡ ምድር
  choice: искореню их из этой земли
  rationale: «Искореню» передаёт усиленный смысл устранения с корнем и согласуется с образом удаления из земли; указательное «этой» естественно в данном контексте.
- source_word: እዘርዎሙ፡ ማእከለ፡ [አሕዛብ]
  choice: рассею среди народов
  rationale: Использует обычную русскую библейскую лексику рассеяния и сохраняет пространственное значение «среди».
theological_decisions:
- issue: Смысл сокрытия Божьего лица
  choice: сохранён образ «скрою ... лицо»
  alternative: «отвернусь от них»
  rationale: Буквальный образ богословски насыщен и допускает связанные значения отнятия благоволения, присутствия и защиты без сведения их к одному толкованию.
- issue: Характер удаления из земли
  choice: «искореню»
  alternative: «удалю»
  rationale: Более сильный глагол отражает силу геэзского አቤስሎሙ и не смягчает судебную образность текста.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Сохранены образные формулы «скрою лицо», «в руки народов», «пожирание» и «рассею», без конфессионально обусловленного истолкования. Начальная строчная форма отражает продолжение предложения из предыдущего стиха.
