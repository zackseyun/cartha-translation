base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: ru
  text: И сотвори в них дух правый, и не позволяй духу Велиара властвовать над ними, чтобы обвинять их пред Тобой и уводить их со всякого пути праведности, так что они погибнут пред лицом Твоим. Ведь они — Твой народ и Твоё наследие, которое Ты великой силой Своей избавил от руки Египта. Сотвори в них…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: дух правый
  rationale: Передаёт значение прямоты и нравственной верности, сохраняя библейский, но понятный современному читателю оборот.
- source_word: መንፈሰ፡ ቤልሖር
  choice: дух Велиара
  rationale: Имя передано традиционной русской формой «Велиар»; слово «дух» сохранено как в источнике.
- source_word: ይኰንንዎሙ
  choice: властвовать над ними
  rationale: Форма допускает смысл господства или осуждения; в данном синтаксическом окружении выбрано господство, тогда как последующая конструкция отдельно выражает обвинение.
- source_word: ለአስተዋድዮቶሙ፡ ቅድሜከ
  choice: чтобы обвинять их пред Тобой
  rationale: Сохраняет судебно-обвинительный оттенок и направленность действия перед Богом.
- source_word: ለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: уводить их со всякого пути праведности
  rationale: Естественно по-русски выражает удаление или отвращение от каждого праведного пути, не усиливая образ до «уловлять».
- source_word: እምእዴ፡ ግብጽ
  choice: от руки Египта
  rationale: Сохранена конкретная библейская метафора источника, обозначающая власть Египта.
theological_decisions:
- issue: Характер действия духа Велиара
  choice: «властвовать над ними, чтобы обвинять их… и уводить их»
  alternative: «осудить их…» или «уловлять их…»
  rationale: Перевод не отождествляет властвование, обвинение и отвращение от праведности, а сохраняет их как связанные, но различимые действия.
- issue: Причинно-целевая связь перед гибелью
  choice: «так что они погибнут»
  alternative: «чтобы они погибли»
  rationale: Такой оборот сохраняет возможность понимать гибель как результат предшествующих действий, не приписывая Богу прямой цели погубить народ.
- issue: Незавершённость последней фразы
  choice: «Сотвори в них…»
  alternative: опустить повтор или дополнить его по следующему стиху
  rationale: Источник для данного сегмента обрывается после повторного повеления; многоточие честно обозначает продолжение без внесения текста из следующего сегмента.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Формы «пред Тобой», «пред лицом Твоим» и прописные местоимения поддерживают молитвенный регистр; синтаксис упрощён ровно настолько, чтобы длинное прошение оставалось ясным. Перевод сохраняет обращение на «Ты» и исходную незавершённость конца стиха.
