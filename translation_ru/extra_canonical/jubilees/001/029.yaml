base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: ru
  text: И ангел присутствия, шедший перед станом Израиля, взял скрижали разделения лет от времени сотворения, закона и свидетельства, седмиц их юбилеев — год за годом, во всём их числе, — и юбилеев — год за годом, — от дня сотворения до того дня, когда обновятся небеса, земля и все их создания согласно силам небес и всему творению земли, до того времени, когда будет создано святилище Яхве в Иерусалиме, на горе Сион, и все светила обновятся для исцеления, мира и благословения всех избранных Израиля; и да будет так с того дня и во все дни земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: ангел присутствия
  rationale: Буквально «ангел лица»; «ангел присутствия» естественно передаёт идею ангела, пребывающего перед Божьим лицом, не сводя выражение к обычному «вестнику».
- source_word: ትዕይንቶሙ፡ ለእስራኤል
  choice: станом Израиля
  rationale: В контексте движения ангела впереди Израиля обозначает расположившийся стан или лагерь народа; «стан» сохраняет библейский регистр.
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: скрижали разделения лет
  rationale: Сохраняет предметный образ скрижалей и характерную для книги идею упорядоченного деления времени.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: седмиц их юбилеев
  rationale: «Седмица» ясно обозначает семилетний цикл и сохраняет отличие от обычной календарной недели.
- source_word: እግዚአብሔር
  choice: Яхве
  rationale: Передаёт личное имя Бога в соответствии с контекстом и политикой POB, а не заменяет его титулом «Господь».
- source_word: ብርሃናት
  choice: светила
  rationale: В контексте небес и обновления речь естественно идёт о небесных светилах, а не об абстрактных «светах».
theological_decisions:
- issue: Характер будущего обновления творения
  choice: «когда обновятся небеса и земля и все их творения»
  alternative: «когда будут сотворены новые небеса и новая земля»
  rationale: Источник говорит об обновлении и не требует замены творения новым; перевод сохраняет эту формулировку без догматического уточнения.
- issue: Будущее возникновение святилища
  choice: «когда будет создано святилище Яхве»
  alternative: «когда будет построено святилище Яхве»
  rationale: Сохранён глагол со значением создания/сотворения, поскольку «построено» могло бы сузить эсхатологический смысл до обычного строительства.
- issue: Необычное соответствие небесным силам
  choice: «согласно силам небес и всему творению земли»
  alternative: сгладить как «в соответствии с небесным и земным порядком»
  rationale: Фраза источника остаётся трудной и допускает разные толкования; перевод не устраняет её напряжение поясняющей парафразой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Длинная синтаксическая конструкция оригинала сохранена, но расчленена тире и точкой с запятой для читаемости. Архаизирующая «седмица» употреблена как точный термин семилетнего цикла; прочая лексика остаётся доступной современному читателю.
