  language: ru
  text: И Я буду их Богом, а они будут Моим народом в истине и праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: Богом
  rationale: 'В данном именном сказуемом естественный русский эквивалент требует творительного падежа: «буду их Богом».'
- source_word: ሕዝብየ
  choice: Моим народом
  rationale: Передаёт существительное «народ» с притяжательным суффиксом первого лица; творительный падеж обусловлен русской конструкцией «будут Моим народом».
- source_word: ዘበአማን
  choice: в истине
  rationale: Сохраняет абстрактное значение «истина, верность» и параллелизм с последующим выражением, не сужая смысл до одного оттенка.
- source_word: ዘበጽድቅ
  choice: в праведности
  rationale: Формально и богословски нейтрально передаёт «праведность, справедливость», сохраняя параллельную конструкцию.
theological_decisions:
- issue: 'Значение አማን: «истина» или «верность»'
  choice: в истине
  alternative: в верности
  rationale: Выбрано более широкое и традиционно узнаваемое «истина»; оно сохраняет возможный смысл подлинности и верности, не устраняя лексическую неоднозначность контекста.
- issue: 'Значение ጽድቅ: «праведность» или «справедливость»'
  choice: в праведности
  alternative: в справедливости
  rationale: «Праведность» лучше соответствует заветному и нравственно-религиозному контексту, при этом не вводит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Союз «а» естественно обозначает соотнесённость двух частей взаимной заветной формулы, не создавая резкого противопоставления. Прописные буквы в местоимениях, относящихся к Богу, использованы как издательская норма русского религиозного текста.
