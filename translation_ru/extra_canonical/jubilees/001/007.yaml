  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: ru
  text: 'И они узнают, что Я был с ними. А ты запиши для себя все слова, которые Я открываю тебе сегодня, ибо Я знаю их мятежность и упрямство ещё до того, как введу их в землю, о которой поклялся их отцам — Аврааму, Исааку и Иакову, сказав: «Вашему потомству Я дам землю, текущую молоком и мёдом». И они будут есть и насытятся.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀለው፡ ኮንኩ፡ ምስሌሆሙ
  choice: Я был с ними
  rationale: Передаёт исходную конструкцию без добавления усилителя «воистину».
- source_word: ምረተሙ
  choice: их мятежность
  rationale: Сохраняет смысл сознательного противления, а не просто непослушания.
- source_word: ክሳዶሙ፡ ደቡበ
  choice: непреклонность
  rationale: Естественно передаёт идиому «жёсткость шеи» в современном русском; буквальность здесь была бы менее понятной.
- source_word: ለዘርእክሙ
  choice: вашему потомству
  rationale: Русское «потомство» естественно передаёт собирательное «семя» и сохраняет множественное обращение.
- source_word: ምድረ፡ እንተ፡ ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: землю, текущую молоком и мёдом
  rationale: Сохраняет традиционный библейский образ и определённость земли в данном контексте.
theological_decisions:
- issue: Временное соотношение Божьего знания о мятежности и введения народа в землю
  choice: «ещё до того, как введу их»
  alternative: «прежде чем Я введу их»
  rationale: Оба варианта сохраняют знание Бога до вступления народа в землю; выбранный вариант естественно связывает придаточное с «Я знаю» и не устраняет напряжения между обещанием и будущим отступничеством.
- issue: Обетование потомству патриархов
  choice: «Вашему потомству Я дам землю»
  alternative: «Твоему семени Я дам землю»
  rationale: Форма «вашему» соответствует обращению к отцам во множественном числе в данном тексте, а «потомство» понятно современному читателю и не вносит дополнительной христологической конкретизации.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены последовательность повествования, прямая речь и формула обетованной земли; избегнуты архаизмы и ненужные поясняющие добавления.
