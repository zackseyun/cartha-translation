  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: ru
  text: 'сегодня для их поколений на горе Синай». И будет так: когда всё сказанное о них постигнет их, они узнают, что Я праведнее их во всех их судах и во всех их делах,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዮም
  choice: сегодня
  rationale: Прямо передаёт временное наречие «сегодня; в этот день», присутствующее в начале данного фрагмента.
- source_word: ለትውልዶሙ
  choice: для их поколений
  rationale: Сохраняет значение предлога ለ и множественного существительного с притяжательным суффиксом; фраза продолжает предыдущее предложение.
- source_word: ዝነገር፡ ላዕሌሆሙ
  choice: сказанное о них
  rationale: Естественно передаёт относительную конструкцию с пассивным глаголом и сохраняет возможность понимать речь как направленную против них или относящуюся к ним.
- source_word: ፍትሖሙ
  choice: их судах
  rationale: Передаёт судебно-нравственное значение ፍትሕ и явно выраженный притяжательный суффикс третьего лица множественного числа.
- source_word: ምግባሮሙ
  choice: их делах
  rationale: В данном нравственном контексте ምግባር означает поступки или дела; «делах» соответствует параллелизму с «судах».
theological_decisions:
- issue: Сравнение Божьей праведности с праведностью людей
  choice: «Я праведнее их»
  alternative: «Я прав перед ними»
  rationale: Сравнительная конструкция с እምኔሆሙ поддерживает значение «праведнее их». Перевод сохраняет необычное и богословски напряжённое сравнение, не заменяя его более привычным утверждением о Божьей правоте.
- issue: Неявное подлежащее при ጻድቅ
  choice: «Я праведнее»
  alternative: «Он праведнее»
  rationale: Форма «Я» определяется продолжающейся прямой речью Бога; это также согласуется с ближайшим повествовательным контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены незавершённость начала и запятая в конце, поскольку стих представляет собой фрагмент прямой речи, переходящий через границы стихов. Формула «во всех их судах и во всех их делах» оставлена близкой к оригиналу, несмотря на её необычность.
