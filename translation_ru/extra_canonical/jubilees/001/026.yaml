revisions:
- from: 'И Я запишу для тебя всё это, что открываю тебе на этой горе: и первое, и последнее, и то, что грядёт, — во всех разделениях дней, в Законе и в Свидетельстве, и в седминах их юбилеев, навеки, пока Я не сойду и не стану обитать с ними во все веки вечности».'
  to: '«Я запишу для тебя всё это, что открываю тебе на этой горе, — во всех разделениях дней, в Законе и в Свидетельстве, в седмицах их юбилеев навеки: и первое, и последнее, и то, что грядёт, — пока Я не сойду и не стану обитать с ними во все веки вечности».'
  rationale: Перестроен порядок оборотов, чтобы «во всех разделениях дней, в Законе и в Свидетельстве, в седмицах их юбилеев» явно задавал общий охват записываемого откровения, а не только определял «то, что грядёт». «Седмины» заменены на более современное «седмицы» в значении семилетних циклов. Сохранены аспект настоящего в «открываю», неопределённость терминов «Закон» и «Свидетельство», а также усиленная формула вечности.
