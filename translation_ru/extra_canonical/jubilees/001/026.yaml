base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: ru
  text: '«Я запишу для тебя всё это, что открываю тебе на этой горе, — во всех разделениях дней, в Законе и в Свидетельстве, в седмицах их юбилеев навеки: и первое, и последнее, и то, что грядёт, — пока Я не сойду и не стану обитать с ними во все веки вечности».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እጽሐፍ
  choice: запишу
  rationale: Будущая форма глагола «писать» в данном контексте естественно передаётся как «запишу».
- source_word: ኵሎ፡ ዘንተ፡ ነገረ
  choice: всё это
  rationale: Существительное ነገር может обозначать слово, дело или предмет сообщения; нейтральное «всё это» сохраняет широкий референт и звучит естественно.
- source_word: አየድዐከ
  choice: открываю тебе
  rationale: Имперфективная форма указывает на совершающееся откровение; настоящее время не превращено в завершённое действие.
- source_word: ዘቀዳሚ፡ ወዘደኃሪ፡ ዘይመጽእ
  choice: и первое, и последнее, и то, что грядёт
  rationale: Сохранена трёхчастная последовательность источника; «грядёт» поддерживает возвышенный, но понятный регистр.
- source_word: ዙፋቤ፡ መዋዕል
  choice: разделениях дней
  rationale: Буквальная календарная формулировка важна для композиции Книги Юбилеев и не сведена к более общему «периодам времени».
- source_word: በሕግ፡ ወዘበስምዕ
  choice: в Законе и в Свидетельстве
  rationale: Сохранены два координированных богословско-текстовых понятия; прописные буквы показывают их титульно-концептуальное употребление.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: седминах их юбилеев
  rationale: «Седмины» точно обозначают семичленные периоды и сохраняют связь с юбилейным летосчислением.
- source_word: እኀድር፡ ምስሌሆሙ
  choice: стану обитать с ними
  rationale: Передаёт длительное пребывание, а не краткое проживание.
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: во все веки вечности
  rationale: Русская формула сохраняет усиленную идиому бесконечной длительности источника.
theological_decisions:
- issue: Временной аспект откровения на горе
  choice: «что открываю тебе»
  alternative: «что Я открыл тебе»
  rationale: Имперфективная форма አየድዐከ лучше допускает настоящее, продолжающееся действие; завершённое прошедшее необоснованно снимало бы эту аспектуальную черту.
- issue: Субъект божественной речи
  choice: местоимение «Я» с прописной буквы
  alternative: строчное «я»
  rationale: Прописная буква соответствует современному благоговейному русскому библейскому регистру, не добавляя отдельного догматического утверждения.
- issue: «Закон» и «Свидетельство» как определённые категории
  choice: прописные начальные буквы
  alternative: «закон» и «свидетельство» со строчных
  rationale: Контекст представляет их как устойчивые категории откровения; при этом перевод не уточняет их объём и не отождествляет с позднейшим каноническим делением.
- issue: Будущее божественное обитание
  choice: «пока Я не сойду и не стану обитать с ними»
  alternative: «до того времени, когда Я сойду и буду жить с ними»
  rationale: Сохранена прямая эсхатологическая формулировка без уточнения способа, места или богословской системы её исполнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Архаизмы сведены к функционально оправданному «седмины», необходимому для точного обозначения семилетних циклов; синтаксис прояснён двоеточием и тире без устранения перечислительной структуры оригинала.
