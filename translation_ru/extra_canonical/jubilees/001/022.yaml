  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: ru
  text: и не будут слушать, пока не осознают свой грех и грехи своих отцов. После этого они обратятся ко Мне во всей праведности, всем сердцем и всей душой,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይሰምዑ
  choice: и не будут слушать
  rationale: Передаёт самостоятельную отрицательную клаузу «и они не услышат/не послушают», пропуск которой исказил бы смысл стиха.
- source_word: ያአምሩ
  choice: осознают
  rationale: В контексте греха глагол «знать, признать» естественно передаётся как осознание; это не добавляет явно выраженного исповедания.
- source_word: ይትመየጡ፡ ኀቤየ
  choice: обратятся ко Мне
  rationale: Сохраняет направленность возвращения к Богу и соответствует библейскому русскому употреблению без архаизации.
- source_word: በኵሉ፡ ርቱዕ
  choice: во всей праведности
  rationale: Сохраняет этически насыщенное значение «правота, прямота, праведность», не сводя его только к искренности.
- source_word: በኵሉ፡ ልብ፡ ወበኵሉ፡ ነፍስ
  choice: всем сердцем и всей душой
  rationale: Естественная и узнаваемая русская передача устойчивой семитской формулы целостной преданности.
theological_decisions:
- issue: Характер признания греха
  choice: осознают свой грех
  alternative: признают свой грех
  rationale: Исходный глагол прежде всего означает «узнать/познать»; «осознают» сохраняет когнитивный смысл и не утверждает прямо публичного исповедания.
- issue: Значение ርቱዕ при обращении к Богу
  choice: во всей праведности
  alternative: со всей искренностью
  rationale: «Праведность» лучше сохраняет нравственную категорию исходного слова, тогда как «искренность» неоправданно сужает её до внутренней установки.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Начальное ክሳዶሙ («их шею/выю») не включено: это остаток фразы предыдущего стиха на границе сегмента. Прописное «Мне» следует русской издательской традиции при прямой речи Бога. Конечная запятая сохранена, поскольку стих синтаксически продолжается.'
