  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: ru
  text: В тридцать пятом юбилее[a], в третью седмину, в первый её год, Рагау взял себе жену по имени Ора, дочь Ура, сына Кеседа. Она родила ему сына, и он назвал его Серохом в седьмой год этой седмины, в этом юбилее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте стоит «тридцать пятый» (возможно, в несколько искажённой форме); это чтение согласуется с внутренней хронологией Книги Юбилеев.
    reason: textual_correction
lexical_decisions:
- source_word: ራግው
  choice: Рагу
  rationale: Транслитерация геэзской формы имени; она сохраняет её звучание и соответствует традиционной русской передаче родословного имени.
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологической системе Книги Юбилеев обозначает семилетний период; «седмина» кратко и точно передаёт этот смысл.
- source_word: እዮቤልው
  choice: юбилей
  rationale: Технический термин книги для юбилейного периода; сохранён как узнаваемое название единицы летосчисления.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: взял себе жену
  rationale: Естественно передаёт буквальную брачную формулу источника без добавочного толкования.
- source_word: ጸውዐ፡ ስሞ፡ ሴሮኅ
  choice: назвал его Серохом
  rationale: Современная русская форма конструкции «назвал его имя»; имя передано близко к геэзскому написанию.
