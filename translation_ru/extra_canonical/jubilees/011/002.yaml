  yaml_path: translation/extra_canonical/jubilees/011/002.yaml
  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: ru
  text: Сын вырос[a], и отец научил его халдейским изысканиям — гадать и предсказывать по небесным знамениям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стихи 2–5 отсутствуют в предоставленной сегментации геэзского текста. Нумерация и контекст главы предполагают здесь промежуточный рассказ о Серохе, халдейском гадании и роли Мастемы в идолопоклонстве; перевод передаёт ожидаемый смысл данного стиха, но его формулировка не может быть непосредственно сверена с приведённым геэзским фрагментом.
    reason: segmentation_note
lexical_decisions:
- source_word: investigations of the Chaldeans (reconstructed intervening material)
  choice: халдейские изыскания
  rationale: Сохраняет представление о специальном халдейском знании и не сужает смысл до современной науки или одного конкретного способа гадания.
- source_word: to divine
  choice: гадать
  rationale: Естественный современный русский глагол для попыток узнать сокрытое или будущее посредством мантики.
- source_word: to practice augury according to the signs of heaven
  choice: предсказывать по небесным знамениям
  rationale: Передаёт связь предсказаний с наблюдаемыми небесными знаками, не отождествляя их без необходимости с позднейшей астрологической системой.
theological_decisions:
- issue: Оценка халдейской мантики
  choice: Передать действия без добавленной прямой нравственной оценки
  alternative: Назвать их нечестивым колдовством или ложным учением
  rationale: В данном предложении сообщается об обучении; отрицательная оценка может следовать из более широкого контекста, но её не следует вносить в сам стих сверх имеющихся данных.
- issue: Неясность утраченного или отсутствующего в сегментации текста
  choice: Следовать засвидетельствованному в английском консультационном слое ожидаемому смыслу и явно отметить текстологическую проблему
  alternative: Восстановить подробности из предполагаемой полной формы главы без отметки
  rationale: Предоставленный геэзский фрагмент не содержит стихов 2–5, поэтому уверенное дословное восстановление по нему невозможно.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Термины «гадать» и «предсказывать по небесным знамениям» понятны широкому читателю и сохраняют древний контекст без конфессиональных добавлений.
