base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: ru
  text: И во дни Серуха[a] начались войны, и все сыны человеческие стали делать изваяния, резные изображения и нечистые предметы. Злые духи помогали им и вводили их в заблуждение, чтобы они совершали беззаконие и нечистоту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопской традиции встречается форма «Серох».
    reason: Сохраняет засвидетельствованный вариант имени, тогда как в основном тексте употреблена стандартная русская библейская форма «Серух».
lexical_decisions:
- source_word: Serug / ሴሮኅ
  choice: Серух
  rationale: Употреблена привычная русская библейская форма имени (Быт. 11:20); разночтение эфиопской формы отмечено в сноске.
- source_word: graven images and carved images
  choice: изваяния, резные изображения
  rationale: Сохранены два близких, но раздельных обозначения изготовленных идольских образов без их искусственного сведения к одному термину.
- source_word: unclean things
  choice: нечистые вещи
  rationale: 'Буквальная и намеренно широкая передача сохраняет неопределённость: речь может идти как о культовых предметах, так и о более общем проявлении нечистоты.'
- source_word: commit transgression and uncleanness
  choice: совершали беззаконие и осквернялись
  rationale: Естественная русская формулировка сохраняет различие между нарушением установленного порядка и состоянием нечистоты.
theological_decisions:
- issue: Роль злых духов в человеческом отступлении
  choice: «помогали им и вводили их в заблуждение»
  alternative: «заставляли их грешить»
  rationale: Сохранено напряжение между демоническим содействием и ответственностью людей; не добавлена идея непреодолимого принуждения.
- issue: Целевая конструкция «чтобы они…»
  choice: Сохранена как указание на направленность обольщения
  alternative: 'Передать как простой результат: «так что они…»'
  rationale: Такой вариант следует форме консультационного текста и не устраняет возможную целенаправленность действий злых духов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Выражение «сыны человеческие» сохранено как узнаваемая библейская формула; синтаксис разделён на два предложения ради ясности.
