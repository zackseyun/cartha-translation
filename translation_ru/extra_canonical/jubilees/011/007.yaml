  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: ru
  text: А если я скажу им правду, они убьют меня, потому что их души привязаны к ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: правду
  rationale: В данном контексте слово обозначает истину или правду, которую говорящий мог бы сообщить людям; винительный оборот естественно передаётся как «сказать правду».
- source_word: ተለውት፡ ነፍሶሙ
  choice: их души привязаны
  rationale: Сохранён образ внутренней привязанности без добавления цели или пояснения о поклонении, отсутствующего в представленном тексте.
- source_word: ኀቤሆሙ
  choice: к ним
  rationale: Местоименная отсылка оставлена столь же неуточнённой, как в источнике; референт определяется ближайшим контекстом.
theological_decisions:
- issue: Характер привязанности к подразумеваемым предметам или существам
  choice: Не уточнять привязанность как поклонение
  alternative: «так что они поклоняются им»
  rationale: Исходная формулировка говорит о привязанности душ, но прямо не выражает ни цель, ни следствие в виде поклонения; добавление сняло бы смысловую открытость текста.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и достойный. «Души» сохранено во множественном числе вслед за источником, хотя по-русски возможна более идиоматичная формулировка «они к ним привязаны».
