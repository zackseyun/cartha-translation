  text: And they arose in the night and wanted to save their gods from the midst of the fire. And Haran rushed
translation:
  language: ru
  text: Ночью они встали и захотели спасти своих богов из огня. А Аран бросился[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побежал». В данном делении текста эта незавершённая фраза стоит в конце стиха, но по смыслу начинает следующее предложение.'
    reason: Сохраняет возможный более нейтральный перевод глагола и отмечает засвидетельствованную ошибку разделения стихов.
lexical_decisions:
- source_word: ወተንሥኡ፡ በሌሊት፡
  choice: Ночью они встали
  rationale: Передаёт последовательность действий естественным современным русским языком без изменения смысла.
- source_word: ወፈቀዱ፡ ያድኅኑ፡
  choice: и захотели спасти
  rationale: Сохраняет значение намерения или желания, выраженное глаголом ፈቀደ, не превращая его в уже совершённую попытку.
- source_word: አማልክቲሆሙ፡
  choice: своих богов
  rationale: Множественное число и притяжательное отношение переданы прямо; строчная буква уместна для языческих божеств.
- source_word: እማእከለ፡ እሳት።
  choice: из огня
  rationale: Буквально «из середины огня»; краткое русское выражение естественно передаёт спасение из охваченного огнём места.
- source_word: ወሰረረ፡ አራን፡
  choice: А Аран бросился
  rationale: Глагол ሰረረ здесь обозначает стремительное движение — «ринуться, броситься, побежать». Имя передано в принятой русской библейской форме «Аран».
theological_decisions:
- issue: Обозначение языческих божеств словом «боги»
  choice: своих богов
  alternative: своих идолов
  rationale: Источник употребляет слово «боги», поэтому перевод не заменяет его более истолковывающим словом «идолы» и сохраняет авторскую формулировку.
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. Незавершённость последней фразы сохранена многоточием, поскольку она продолжается в следующем стихе; имя አራን передано как «Аран» согласно принятой русской библейской традиции.
