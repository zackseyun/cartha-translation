  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: ru
  text: В ту четвёртую неделю, в четвёртый её год, Аврам встал ночью и сжёг дом идолов. Он сжёг всё, что было в доме, и никто об этом не узнал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ፡ ሱባዔ፡ ራብዕ
  choice: в ту четвёртую неделю
  rationale: Сочетание передано как обстоятельство времени; указательное ውእቱ естественно выражено русским «ту».
- source_word: በዓመት፡ ራብዕ፡ ሎቱ
  choice: в четвёртый её год
  rationale: Местоименный элемент ሎቱ соотнесён с «неделей», то есть семилетним периодом юбилейной хронологии; сохранена исходная формулировка без поясняющего добавления в тексте.
- source_word: ቤተ፡ ጣዖታት
  choice: дом идолов
  rationale: Буквально и естественно передаёт обозначение строения, где находились идолы.
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: никто об этом не узнал
  rationale: Идиоматическая русская передача буквального смысла «не было человека, который знал»; «об этом» ясно отсылает к поступку Аврама.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Повтор глагола «сжёг» сохранён в соответствии с исходным текстом. Начальное አብራም перед временной формулой принято за артефакт деления стихов и не дублируется.
