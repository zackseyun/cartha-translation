  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: ru
  text: Он рассказал об этом двум своим братьям, и они разгневались на него и промолчали. В сороковой юбилей, во вторую седмину, в седьмой год этой седмины Аврам взял себе жену; её звали Сарай, дочь его отца,[a] и она стала его женой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дочь его отца» передано в том виде, в каком оно сохранилось в данном тексте, без согласования с книгой Бытия. Возможно, здесь отразилась текстовая проблема или иное обозначение родства в этой традиции.
    reason: textual_variant
lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: рассказал об этом
  rationale: Передаёт указательное местоимение и глагол речи естественным современным русским оборотом без добавления содержания.
- source_word: ወአርመሙ
  choice: но промолчали
  rationale: Форма глагола стоит во множественном числе и относится к братьям; противительный союз естественно выражает контраст между гневом и молчанием.
- source_word: አዮቤልዉ / ሱባዔ
  choice: юбилей / седмина
  rationale: 'Сохраняется специальная хронологическая система книги: юбилей и семилетняя седмина.'
- source_word: ሶራ
  choice: Сара
  rationale: Употреблена привычная русская библейская форма имени, соответствующая здесь Сарай в английском консультационном слое.
- source_word: ብእሲተ
  choice: жену
  rationale: 'В контексте формулы ነሥአ ሎቱ передаёт вступление в брак: «взял себе жену».'
theological_decisions:
- issue: Родство Сары с Аврамом
  choice: дочь его отца
  alternative: дочь брата его отца / родственница по отцу
  rationale: Буквальная передача сохранённого чтения не гармонизирует текст с Бытием и не устраняет возможную текстологическую либо традиционную особенность.
- issue: Субъект молчания
  choice: они промолчали
  alternative: он промолчал
  rationale: Множественное число ወአርመሙ указывает на братьев, несмотря на прежнее вариантное толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» сохранён ради точности юбилейной хронологии; синтаксис сделан ясным для обычного читателя.
