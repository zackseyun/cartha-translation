  source_fidelity: 'Смысл передан в целом верно: субъект «промолчали» — два брата, что соответствует форме множественного числа ወአርመሙ; хронологические указания и буквальное проблемное родство сохранены. Однако имя ሶራ в данном контексте соответствует форме «Сарай», а не позднейшей привычной форме «Сара».'
