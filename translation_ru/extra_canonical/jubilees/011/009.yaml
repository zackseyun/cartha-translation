  to: Он рассказал об этом двум своим братьям, и они разгневались на него и промолчали. В сороковой юбилей, во вторую седмину, в седьмой год этой седмины Аврам взял себе жену; её звали Сарай, дочь его отца,[a] и она стала его женой.
  rationale: Исправлена форма имени на «Сарай», чтобы не подменять раннее имя более поздней библейской формой «Сара». Хронологическая формула перестроена для ясного современного русского синтаксиса без изменения юбилейной системы. «Но» заменено на «и», поскольку исходный текст не выражает явного противопоставления. Примечание сохранено и привязано непосредственно к проблемному выражению.
