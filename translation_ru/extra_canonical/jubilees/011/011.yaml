  rationale: Сохраняет буквальный брачный оборот источника и остаётся понятным в современном литературном русском.
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ
  choice: И на шестидесятом году его жизни
  rationale: Местоимение передано без уточнения имени, поскольку источник сам не называет здесь Аврама; незавершённость синтаксиса отражает продолжение фразы в следующем стихе.
