base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: ru
  text: И князь Мастема усердно добивался, чтобы всё это совершалось. Он посылал других духов, подчинённых ему, творить всякого рода заблуждение, грех и преступление, развращать и губить и проливать кровь на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: Мастема
  rationale: Имя передано традиционной русской транслитерацией без истолкования его как имени нарицательного.
- source_word: prince
  choice: князь
  rationale: Сохранён титул духовного правителя; слово «князь» передаёт древний высокий статус и не уточняет природу власти сверх текста.
- source_word: exerted himself
  choice: усердно добивался
  rationale: Передаёт не просто действие, а настойчивое деятельное стремление осуществить названное.
- source_word: spirits, those set under his hand
  choice: духов, подчинённых ему
  rationale: Естественная современная передача идиомы власти и подчинения без буквального, неясного оборота «под его рукой».
- source_word: error and sin and transgression
  choice: заблуждение, грех и преступление
  rationale: 'Сохранена трёхчленная градация: уклонение от истины, грех как нравственная категория и нарушение установленной нормы.'
- source_word: corrupt and destroy
  choice: развращать и губить
  rationale: Различены нравственное растление и доведение до гибели.
- source_word: shed blood upon the earth
  choice: проливать кровь на земле
  rationale: Сохранён библейский образ насильственного кровопролития и его земной масштаб.
theological_decisions:
- issue: Статус Мастемы
  choice: князь Мастема
  alternative: правитель Мастема / князь злобы
  rationale: Титул и имя оставлены без отождествления Мастемы с сатаной или иной фигурой и без превращения имени в богословское толкование.
- issue: Степень власти Мастемы над духами
  choice: подчинённых ему
  alternative: находившихся под его рукой
  rationale: Передано отношение подчинения, но не добавлено утверждение об абсолютной власти или происхождении духов.
- issue: Причинность зла
  choice: добивался, чтобы всё это совершалось; посылал ... творить
  alternative: сам совершил всё это
  rationale: Сохранено различие между организующей ролью Мастемы и непосредственными действиями посланных духов.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; повтор союза «и» в финальной цепочке частично сохранён ради ритма и накопительного эффекта. Предоставленный фрагмент геэзского текста не содержит самого стиха 11:4, поэтому формулировка сверена с доступным английским консультационным слоем и не претендует на восстановление отсутствующей в пакете геэзской строки.
