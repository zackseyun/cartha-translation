  register: Современный литературный русский с умеренно библейским достоинством. Начальный фрагмент намеренно оставлен синтаксическим продолжением предыдущего стиха, как в источнике. Повтор географических названий и родственных связей сохранён; местоименная неоднозначность при глаголе «поселился» раскрыта ближайшим явным субъектом — Фаррой.
