  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: ru
  text: прежде Фарры, своего отца. И похоронили его в Уре Халдейском. И вышел Фарра из Ура Халдейского — он и его сыновья, — чтобы прийти в землю Ливана и в землю Ханаанскую. Он поселился в земле Харранской, а Аврам жил с Фаррой, своим отцом, в Харране.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታራ
  choice: Фарра
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени отца Аврама; она соответствует данному лицу и остаётся узнаваемой современному читателю.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ур Халдейский
  rationale: Естественная и традиционная русская передача географического названия «Ур халдеев».
- source_word: ምድረ፡ ሊባኖስ
  choice: земля Ливанская
  rationale: Сохраняет конструкцию источника «земля Ливана» и возвышенный историко-повествовательный регистр.
- source_word: ምድረ፡ ከናአን
  choice: земля Ханаанская
  rationale: Передаёт географическое обозначение источника привычной русской библейской формой.
- source_word: ኀደረ
  choice: поселился / жил
  rationale: 'Глагол в двух последовательных предикациях передан по контексту: Фарра «поселился» в земле Харранской, Аврам «жил» с отцом в Харране; смысловое повторение сохранено без неестественной тавтологии.'
