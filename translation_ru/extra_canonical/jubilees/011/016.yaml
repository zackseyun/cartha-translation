  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: ru
  text: два семилетия.[a] В шестом семилетии, в пятый его год, Аврам ночью, в начале седьмого месяца, сидел и наблюдал за звёздами с вечера до рассвета, чтобы узнать, каким будет этот год в отношении дождей. Он сидел там один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «две седмицы лет», то есть два семилетних периода. В Книге Юбилеев время регулярно исчисляется такими периодами.'
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  choice: два семилетия
  rationale: Буквально «две седмицы лет»; «два семилетия» естественно передаёт счёт времени семилетними периодами и сохраняет смысл исходной формулы.
- source_word: በሳድስ፡ ሱባዔ
  choice: в шестом семилетии
  rationale: Слово ሱባዔ обозначает семичленный период; в данном хронологическом контексте речь идёт о семилетии.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: в начале седьмого месяца
  rationale: Выражение указывает на наступление или начало седьмого месяца.
- source_word: ያበይነ፡ ከዋክብተ
  choice: наблюдал за звёздами
  rationale: Передаёт целенаправленное рассматривание звёзд без добавления оценки этой практики.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: каким будет этот год по количеству дождей
  rationale: Естественная русская передача вопроса о характере года применительно к дождям; «по количеству» ясно выражает погодный аспект, не вводя лишней конкретики.
theological_decisions:
- issue: Характер наблюдения Аврама за звёздами
  choice: нейтральное «наблюдал за звёздами»
  alternative: «занимался астрологическими наблюдениями»
  rationale: Источник описывает действие и цель, но не даёт здесь прямой богословской или нравственной квалификации; перевод не должен заранее истолковывать его как астрологию.
