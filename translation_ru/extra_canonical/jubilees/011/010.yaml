  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: ru
  text: А Аран, его брат, взял себе жену в третий год третьей седмины. В седьмой год этой седмины она родила ему сына, и Аран назвал его Уром.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный фрагмент геэзского текста заканчивается словами «и он назвал»; имя «Ур» относится к продолжению предложения в соседнем текстовом сегменте и включено здесь согласно принятому делению на стихи.
    reason: Сохраняет прозрачность текстовой границы и объясняет редакционное восстановление оборванного предложения.
lexical_decisions:
- source_word: አሬን
  choice: Аран
  rationale: Передача имени в соответствии с формой геэзского текста; это имя брата Аврама, обычно известного как Аран.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: взял себе жену
  rationale: Естественная русская передача буквального оборота «взял себе женщину/жену» в контексте брака.
- source_word: ሱባዔ
  choice: седмина
  rationale: Сохраняет характерную для книги хронологическую единицу — период из семи лет — и отличает её от обычной календарной недели.
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: она родила ему сына
  rationale: Прямо отражает субъект женского рода, дательный оборот и объект исходного текста.
- source_word: ወጸውዐ
  choice: и он назвал
  rationale: По смыслу это глагол наречения имени; дополнение восстановлено из продолжения соседнего текстового сегмента.
