  text: for those who make them, and a straying of heart for those who worship them. Do not worship them.” And his father said to him[6], “I also know, my son, but what can I do for a people who have made me subject to them?
translation:
  language: ru
  text: 'для тех, кто их делает, и заблуждение сердца — для тех, кто им поклоняется.[a] Не поклоняйся им». Отец ответил ему: «Я и сам знаю, сын мой. Но что мне делать с народом, который заставил меня подчиняться ему?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая фраза продолжает мысль предыдущего стиха. Выражение «заблуждение сердца — для тех, кто им поклоняется» в данном эфиопском тексте грамматически затруднительно; возможно также: «а сердца тех, кто им поклоняется, уклоняются».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ወከሕተት፡ ልብ
  choice: и заблуждение сердца
  rationale: Сохраняет именную конструкцию и смысл уклонения сердца, не превращая трудное место в более однозначное глагольное утверждение.
- source_word: አታምልክዎሙ
  choice: Не поклоняйся им
  rationale: Прямая и естественная передача запрета поклоняться множественным предметам — идолам из контекста.
- source_word: እትአዘዝ
  choice: заставил меня подчиняться ему
  rationale: Глагол означает повиновение или подчинённость; эта передача сохраняет каузативный смысл предшествующего выражения и не смешивает его со значением «заблуждаться».
theological_decisions:
- issue: Степень вины отца перед народом
  choice: который заставил меня подчиняться ему
  alternative: который сделал меня подвластным ему
  rationale: Выбранная формулировка передаёт заявленную вынужденность, не оправдывая поступков отца и не добавляя богословской оценки.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Начальная строчная буква намеренно показывает, что стих начинается продолжением фразы из предыдущего стиха. Необычная именная конструкция сохранена из-за неясности исходного текста и пояснена в сноске.
