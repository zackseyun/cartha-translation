base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: ru
  text: И князь Мастема прилагал все усилия, чтобы совершать всё это. Он посылал других духов, подвластных ему, творить всякое зло, всякий грех и всякое преступление, развращать и губить и проливать кровь на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince Mastema
  choice: князь Мастема
  rationale: Сохраняет титул личного сверхъестественного противника и традиционную передачу имени; форма «Мастема» естественно склоняется в русском языке.
- source_word: those placed under his hand
  choice: подвластных ему
  rationale: Передаёт семитский образ власти ясным современным русским выражением, не превращая его в буквальное и неестественное «под его рукой».
- source_word: all manner of wrong and sin and all manner of transgression
  choice: всякое зло, всякий грех и всякое преступление
  rationale: Сохраняет трёхчленное перечисление и его нарастающую нравственно-правовую силу.
- source_word: to corrupt and destroy
  choice: развращать и губить
  rationale: Различает нравственное разложение и уничтожение, сохраняя параллельность исходных действий.
- source_word: to shed blood on the earth
  choice: проливать кровь на земле
  rationale: Сохраняет библейскую формулу кровопролития и земной масштаб действия.
theological_decisions:
- issue: Личностный характер Мастемы
  choice: Мастема назван князем и обозначен личным местоимением «он»
  alternative: Передать Мастему как безличную силу или отвлечённое зло
  rationale: Контекст представляет Мастему действующим личным существом, которое отдаёт распоряжения подчинённым духам.
- issue: Статус посылаемых духов
  choice: «других духов, подвластных ему»
  alternative: Назвать их бесами или падшими ангелами
  rationale: Перевод сохраняет формулировку источника и не вносит более узкую демонологическую классификацию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повторы «всякое/всякий» сохранены ради риторического ритма; синтаксис разделён на два предложения для ясности. Предоставленный фрагмент геэзского текста не содержит самого стиха 11:5 и начинается соседним материалом, поэтому формулировка восстановлена по проверенному консультационному слою и последней текстологической корректировке без использования устаревших примечаний, относящихся к ошибочной прежней реконструкции.
