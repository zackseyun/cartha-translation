- source_word: አርምም፡ ወልድየ
  choice: Молчи, сын мой
  rationale: Краткое повеление и обращение переданы прямо, в современном литературном регистре.
- source_word: ከመ፡ አይቅትሉከ
  choice: чтобы они не убили тебя
  rationale: Отрицательная целевая/предупредительная конструкция естественно передана по-русски; множественное число субъекта сохранено.
- source_word: ወነገረ
  choice: И он рассказал
  rationale: 'Сохранена незавершённость отрывка: глагол вводит продолжение в следующем сегменте, поэтому дополнение не добавлено.'
