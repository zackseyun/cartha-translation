  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: ru
  text: И тогда Господь исцелит Своих слуг; они поднимутся, увидят великий мир и прогонят своих врагов; праведники увидят, возблагодарят и будут радоваться во веки веков с радостью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'እማን
  choice: И тогда
  rationale: Передаёт вводную временно-связующую формулу естественно по-русски и соответствует развитию контекста.
- source_word: ይፈውሶ
  choice: исцелит
  rationale: Сохраняет прямое значение глагола исцеления без расширительного толкования.
- source_word: ለገብርቲሁ
  choice: Своих слуг
  rationale: Обозначает принадлежащих Господу служителей; «слуг» понятно современному читателю и не вносит специального церковного статуса.
- source_word: ይትነሥኡ
  choice: поднимутся
  rationale: Сохраняет буквальную и потенциально многозначную образность вставания или восстановления, не уточняя её как воскресение.
- source_word: ሰላመ፡ ዐቢየ
  choice: великий мир
  rationale: Формально сохраняет сочетание существительного и прилагательного, включая возможный широкий смысл благополучия.
- source_word: ይሰድዱ
  choice: прогонят
  rationale: Передаёт активное изгнание или обращение врагов в бегство.
- source_word: ያአኵቱ
  choice: возблагодарят
  rationale: Динамически передаёт благодарение или хвалу в возвышенном, но современном регистре.
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: вечно
  rationale: Естественный русский эквивалент устойчивой формулы непрекращающейся длительности.
- source_word: በፍሥሐ
  choice: великой радостью
  rationale: Наречное обстоятельство передано русским творительным оборотом; «великой» помогает естественно выразить усиленный итоговый образ радости.
theological_decisions:
- issue: Значение «поднимутся»
  choice: Сохранить нейтральное «поднимутся»
  alternative: «воскреснут» или «воспрянут»
  rationale: Источник допускает буквальное вставание, восстановление или возможный эсхатологический оттенок; перевод не должен преждевременно сводить смысл исключительно к воскресению.
- issue: Объект глагола «увидят» в последней части
  choice: «увидят это»
  alternative: Оставить «увидят» без дополнения
  rationale: Местоимение делает русский синтаксис естественным, отсылая ко всему описанному избавлению, но не вводит отдельного богословского объекта видения.
- issue: Содержание «мира»
  choice: «мир»
  alternative: «благоденствие»
  rationale: Слово сохраняет богословскую и смысловую широту мира, покоя и благополучия, не сужая её до материального процветания.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис упрощён для ясности, но последовательность действий и эсхатологическая напряжённость источника сохранены. Прописная буква в «Своих» следует принятому благоговейному русскому оформлению местоимения, относящегося к Господу.
