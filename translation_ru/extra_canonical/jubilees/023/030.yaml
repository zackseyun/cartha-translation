revisions:
- from: И тогда Господь исцелит Своих слуг; они поднимутся и увидят великий мир, и прогонят своих врагов. Праведники увидят это, возблагодарят и будут вечно радоваться великой радостью.
  to: И тогда Господь исцелит Своих слуг; они поднимутся, увидят великий мир и прогонят своих врагов; праведники увидят, возблагодарят и будут радоваться во веки веков с радостью.
  rationale: Удалены не имеющие прямой текстовой опоры «это» и «великой». Формула «во веки веков» восстановлена для передачи повторённого выражения исходника. Сохранены нейтральное «поднимутся» и широкий по смыслу «великий мир».
