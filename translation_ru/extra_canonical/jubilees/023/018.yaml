  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: ru
  text: Ибо все они поступили нечестиво, и каждые уста изрекают грех; все дела их — нечистота и мерзость, и все пути их — осквернение, нечистота и погибель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернение, нечистота и порча».'
    reason: Финальное ሙስና допускает значение порчи или разложения наряду с разрушением и погибелью.
lexical_decisions:
- source_word: አእከዩ
  choice: поступали нечестиво
  rationale: Передаёт совершённое злое и нечестивое поведение всех упомянутых лиц, сохраняя аспект исходной формы.
- source_word: ዐበሳ
  choice: грех
  rationale: Прямой и естественный религиозно-нравственный эквивалент; не сужает значение до одной лишь вины.
- source_word: ርኵስ
  choice: нечистота / нечистота
  rationale: Повтор исходного слова сохранён в обеих параллельных частях стиха.
- source_word: ስቈራር
  choice: мерзость
  rationale: Передаёт сильное значение отвращения и отвратительности точнее, чем более слабое «порча».
- source_word: ግማኔ
  choice: осквернение
  rationale: Сохраняет идею нечистоты или загрязнения, при этом позволяет передать следующее ርኵስ отдельным словом «нечистота».
- source_word: ሙስና
  choice: погибель
  rationale: Передаёт разрушение или порчу без чрезмерного уточнения того, идёт ли речь о процессе, состоянии или результате.
theological_decisions:
- issue: Значение ዐበሳ
  choice: грех
  alternative: вина
  rationale: «Грех» ближе к нравственно-религиозному содержанию контекста и не превращает высказывание в утверждение только о виновности.
- issue: Соотношение заключительных понятий нечистоты и разрушения
  choice: осквернение, нечистота и погибель
  alternative: скверна, нечистота и порча
  rationale: Сохранены три самостоятельных элемента и их напряжённое накопление; финальный термин не сводится исключительно к нравственной испорченности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм и повтор «все / всякие / все» сохранены; связка с именным сказуемым передана тире.
