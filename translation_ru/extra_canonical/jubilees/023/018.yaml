  source_fidelity: Начальная форма አእከዩ передаёт совершённое злое действие; «поступали нечестиво» в русском несовершенном виде может неоправданно обозначать длительное или повторяющееся поведение. ዐበሳ — «грех», а заключительное накопление «осквернение, нечистота и погибель» сохраняет три исходных понятия и повтор ርኵስ.
  naturalness: '«Всякие уста говорят о грехе» звучит неестественно: «всякие» здесь слабее и разговорнее, чем требуемое обобщение, а «говорят о грехе» меняет смысл с произнесения греха на разговор о нём. «Каждые уста изрекают грех» естественно для возвышенного литературного регистра и сохраняет смысл. «Все они поступили нечестиво» точнее передаёт завершённость действия.'
  terminology: «Нечистота», «мерзость», «осквернение» и «погибель» уместны и последовательно передают ритуально-нравственную лексику стиха без догматического уточнения. Сноска привязана к заключительному слову и корректно отмечает допустимое значение «порча».
