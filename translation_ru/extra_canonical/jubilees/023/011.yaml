  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: ru
  text: 'Ибо Авраам был совершенен во всех своих делах с Господом[a] и все дни своей жизни был угоден Ему в праведности. И вот, за свою жизнь он не прожил полных четырёх юбилеев: он состарился из-за зла[b] и насытился днями[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный контекстуальный вариант: «пред Господом»; основное значение предлога — «с».'
    reason: Разграничивает традиционное толкование и прямое значение геэзского ምስለ.
  - marker: b
    text: 'Буквально: «перед лицом зла».'
    reason: Сохраняет доступ к образной форме исходного выражения при причинном переводе в основном тексте.
  - marker: c
    text: 'То есть достиг глубокой старости; буквально: «насытился своими днями».'
    reason: Поясняет семитский библейский оборот и отражает притяжательную форму источника.
lexical_decisions:
- source_word: ፍጹም፡ በኵሉ፡ ምግባሪሁ
  choice: был совершенен во всех своих делах
  rationale: Передаёт значение «совершенный/непорочный» и охватывает всё поведение или совокупность дел Авраама.
- source_word: ምስለ፡ እግዚአብሔር
  choice: с Господом
  rationale: Предлог ምስለ обычно означает «с»; перевод сохраняет образ отношений Авраама с Господом, не заменяя его значением «перед».
- source_word: ይሠምር፡ በጽድቅ
  choice: был угоден Ему своей праведностью
  rationale: Естественно передаёт сочетание «быть угодным» и обстоятельство праведности; местоимение «Ему» ясно отсылает к Господу.
- source_word: ኢፈጸመ፡ አርባዕተ፡ ኢዮቤልውሳተ
  choice: не прожил полных четырёх юбилеев
  rationale: Глагол означает «завершить, исполнить»; в связи с продолжительностью жизни по-русски естественно сказать, что он не прожил полных четырёх юбилеев.
- source_word: ቅድመ፡ ገጸ፡ እኩይ
  choice: из-за зла
  rationale: Буквально выражение связано с нахождением «перед лицом зла», но в данном контексте естественно имеет причинный смысл.
- source_word: ጸገበ፡ መዋዕሊሁ
  choice: насытился днями
  rationale: Сохраняет библейский образ насыщения долгой жизнью и не превращает Авраама из субъекта действия в объект безличного «дни исполнились».
theological_decisions:
- issue: Характер совершенства Авраама
  choice: «был совершенен во всех своих делах»
  alternative: «был безгрешен»
  rationale: Текст оценивает целостность его поведения перед Богом, но не требует богословского утверждения об абсолютной безгрешности.
- issue: Причина сокращённой продолжительности жизни
  choice: «из-за зла»
  alternative: «перед лицом зла»
  rationale: Причинное прочтение соответствует контексту главы, где зло связано с сокращением человеческой жизни, при этом буквальная образность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены термины «юбилей» и «насытился днями» как значимые образы текста; синтаксис упрощён для ясности без устранения смысловой напряжённости.
