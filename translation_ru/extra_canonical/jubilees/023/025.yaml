  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: ru
  text: И будут они творить насилие в Израиле и грешить против Иакова, и много крови прольётся на землю, и некому будет собрать[a] и некому похоронить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть собрать тела погибших; исходный текст не называет объект прямо.
    reason: Уточняет вероятный смысл эллиптического глагола, не вставляя толкование в основной текст.
lexical_decisions:
- source_word: ይገብሩ፡ ውስተ፡ እስራኤል፡ ሀከከ
  choice: будут они творить насилие в Израиле
  rationale: Глагол «делать, совершать» с существительным, обозначающим притеснение или насилие, естественно передаётся сочетанием «творить насилие»; ውስተ сохраняет пространственное значение «в».
- source_word: ዲበ፡ ያዕቆብ፡ ዐበሳ
  choice: грешить против Иакова
  rationale: Предлог ዲበ буквально имеет значение «на, над», но при существительном «грех, проступок» выражает направленность действия против Иакова; это также сохраняет отличие от предшествующего ውስተ «в».
- source_word: ይትከዐው፡ ደም፡ ብዙኅ
  choice: много крови прольётся
  rationale: Естественная русская передача пассивного образа излияния большого количества крови.
- source_word: ዘያስተጋብእ
  choice: собрать
  rationale: Глагол означает «собирать, соединять»; по контексту речь, вероятно, о погибших, однако объект в исходном тексте не назван, поэтому он не добавлен в основной текст.
- source_word: ዘይቀብር
  choice: похоронить
  rationale: Передаёт значение погребения; неопределённый подразумеваемый объект сохранён.
theological_decisions:
- issue: Отношение выражения «против Иакова» к народу Израиля
  choice: Сохранено «против Иакова» без поясняющей замены на «против потомков Иакова» или «среди Иакова».
  alternative: «в Иакове» / «среди народа Иакова»
  rationale: Исходный текст меняет предлог с ውስተ при Израиле на ዲበ при Иакове. Перевод сохраняет направленность и не устраняет возможное напряжение между параллельными обозначениями народа.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской интонацией. Синтаксический параллелизм и повтор «и некому» сохранены; архаизмы и избыточно буквальные обороты устранены.
