base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: ru
  text: И в том поколении дети[a] станут укорять своих отцов и старейшин за грех, за неправедность, за слова, исходящие из их уст, и за великие злодеяния, которые те совершают, а также за то, что те оставили завет, который Господь заключил между Собой и ими, чтобы они соблюдали и исполняли все Его заповеди, установления и весь Его закон, не уклоняясь ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновья».'
    reason: Геэзское ደቂቅ может обозначать как детей вообще, так и сыновей.
lexical_decisions:
- source_word: ደቂቅ
  choice: дети
  rationale: Основное значение — «дети, потомки»; в противопоставлении отцам и старейшинам это естественнее и шире, чем «сыновья», при сохранении альтернативы в сноске.
- source_word: ይዘልፉ
  choice: станут укорять
  rationale: Передаёт порицание или упрёк со стороны младшего поколения без неоправданного усиления до «проклинать».
- source_word: ዐመፃ
  choice: неправедность
  rationale: Слово обозначает неправду, беззаконие или мятежность; «неправедность» сохраняет широкий нравственный смысл в данном перечне.
- source_word: ሥርዐተ፡ ዘኮነኖይ፡ እግዚአብሔር
  choice: завет, который Господь заключил
  rationale: Хотя ሥርዐት обычно связано с порядком, установлением или предписанием, конструкция «между Собой и ими» указывает здесь на договорно-заветное установление; перевод следует контексту, не меняя последующие «установления».
- source_word: የማነ፡ ወፀጋመ
  choice: ни вправо, ни влево
  rationale: Идиоматическое обозначение полного отсутствия уклонения от предписанного пути.
theological_decisions:
- issue: Субъект грехов и оставления завета
  choice: Формулировка «которое те совершают» и далее «они оставили» относит проступки к отцам и старейшинам.
  alternative: Можно грамматически оставить местоименные связи менее явными, буквально повторяя «они».
  rationale: Контекст укоризны детей своим отцам и старейшинам требует ясной русской референции, не добавляя нового богословского содержания.
- issue: Характер установления между Господом и народом
  choice: «завет»
  alternative: «установление» или «порядок»
  rationale: Фраза о том, что Господь установил это «между Собой и ими», имеет явный заветный характер; при этом исходная лексическая широта отмечена в решении.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Повторяющаяся структура перечня слегка сглажена ради естественности, но все обвинения и нормативные категории сохранены. Написание «Господь» следует обычной русской библейской традиции.
