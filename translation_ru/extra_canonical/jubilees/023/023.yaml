revisions:
- from: И постигнет дела того поколения великое наказание от Господа, и Он предаст их избиению, суду, пленению, разграблению и уничтожению.
  to: И постигнет дела того поколения великое наказание от Господа, и Он предаст людей того поколения избиению, суду, пленению, разграблению и уничтожению.
  rationale: Исправлена только ложная русская отсылка местоимения во второй части. Необычная формулировка о наказании, постигающем «дела того поколения», сохранена, поскольку она отражает текст источника и не должна заменяться причинным толкованием («за дела»).
