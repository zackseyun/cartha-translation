  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: ru
  text: И постигнет дела того поколения великое наказание от Господа, и Он предаст людей того поколения избиению, суду, пленению, разграблению и уничтожению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: великое наказание
  rationale: Передаёт сочетание со значением тяжёлой кары; «наказание» естественно в современном русском и не сужает смысл до одной разновидности бедствия.
- source_word: ዲበ፡ ግብረ፡ ይእቲ፡ ትውልድ
  choice: постигнет дела того поколения
  rationale: Сохраняет необычную направленность кары на «дела» поколения, не заменяя её более ожидаемым наказанием самих людей.
- source_word: እምኀበ፡ እግዚአብሔር
  choice: от Господа
  rationale: Формально передаёт источник кары и сохраняет традиционное, но современно понятное именование Бога.
- source_word: መጥባሕት
  choice: избиению
  rationale: Передаёт массовое умерщвление точнее, чем «меч», и сохраняет параллельный ряд бедствий.
- source_word: ኵነኔ
  choice: суду
  rationale: Прямой и контекстуально естественный эквивалент, сохраняющий возможность как судебного разбирательства, так и осуждения.
- source_word: ፂዋዌ
  choice: пленению
  rationale: Передаёт попадание в плен или увод в неволю без излишней конкретизации.
- source_word: ሀደድ
  choice: разграблению
  rationale: Естественно обозначает насильственное расхищение имущества в ряду общественных бедствий.
- source_word: ብልዐት
  choice: уничтожению
  rationale: Хотя слово связано с пожиранием, в данном перечне «уничтожение» естественно передаёт итоговый разрушительный смысл, не создавая в русском неясного образа.
theological_decisions:
- issue: На кого или на что направлено великое наказание
  choice: «постигнет дела того поколения»
  alternative: «постигнет то поколение за его дела»
  rationale: Выбранная формулировка сохраняет грамматическую и смысловую напряжённость исходного текста, где наказание приходит «на дела» поколения; причинное истолкование не внесено.
- issue: Агент последующего предания бедствиям
  choice: «Он предаст их»
  alternative: безличное «они будут преданы»
  rationale: Сохранена смена к личному действию Господа, явно выраженная формой глагола и местоименным объектом в исходном тексте.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис слегка приподнят, но понятен обычному читателю; перечисление сохранено без поясняющих добавлений.
