  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: ru
  text: В те дни они будут кричать, взывать и молиться, чтобы спастись от руки грешных народов, но никто не спасётся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «нет того, кто спасётся».'
    reason: 'Отмечает более формальное устройство заключительной отрицательной конструкции и подчёркивает непереходное значение глагола: отсутствует спасённый, а не спаситель.'
lexical_decisions:
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: будут взывать, кричать и молиться
  rationale: Сохранена трёхчленная последовательность действий исходного текста; современные русские глаголы передают нарастающее отчаянное обращение без устранения близости первых двух значений.
- source_word: ከመ፡ ይድኅኑ
  choice: чтобы спастись
  rationale: Форма ይድኅኑ — простой, а не каузативный стем; здесь она означает «быть спасёнными / спастись».
- source_word: እምእደ፡ ኃጥአን፡ አሕዛብ
  choice: от руки грешных народов
  rationale: Сохранена исходная идиома «от руки», обозначающая избавление от власти или насилия; አሕዛብ передано как «народы».
- source_word: ወአልቦ፡ ዘይድኅን
  choice: но никто не спасётся
  rationale: Отрицательная конструкция с простой формой ይድኅን указывает на отсутствие того, кто будет спасён, а не спасителя.
theological_decisions:
- issue: 'Кто отсутствует в заключительной фразе: спаситель или спасённый'
  choice: никто не спасётся
  alternative: не будет никого, кто спасёт
  rationale: Геэзская форма ይድኅን является базовой/intransitive («спастись, быть спасённым»), тогда как каузативное «спасти» ожидало бы иной основы. Поэтому текст утверждает всеобщность гибели в описываемой ситуации, не отсутствие возможного избавителя.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Синтаксис остаётся ясным для обычного читателя; идиома «от руки» сохранена как узнаваемое библейское выражение. Маркер сноски поставлен непосредственно после относящегося к ней предложения.
