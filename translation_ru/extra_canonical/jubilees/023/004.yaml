revisions:
- from: Он поднялся с груди Авраама[a], побежал и рассказал обо всём своей матери Ревекке. Ночью Ревекка пошла к Исааку и рассказала ему. Тогда они пошли вместе; с ними пошёл и Иаков, держа в руке факел[b]. Придя туда, они увидели, что Авраам лежит мёртвый.
  to: Он поднялся с груди Авраама[a], побежал и рассказал Ревекке, своей матери. Ночью Ревекка пошла к Исааку и рассказала ему. Они пошли вместе, и Иаков — с ними; а в его руке был факел[b]. Когда они пришли, они нашли Авраама лежащим мёртвым.
  rationale: 'Убрано не выраженное в источнике «обо всём». Владение факелом оставлено формально неуточнённым в основном тексте, а вероятная связь с Иаковом вынесена в сноску. Исправлена русская форма обозначения состояния: «лежащим мёртвым».'
