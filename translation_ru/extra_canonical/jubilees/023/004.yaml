  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: ru
  text: Он поднялся с груди Авраама[a], побежал и рассказал Ревекке, своей матери. Ночью Ревекка пошла к Исааку и рассказала ему. Они пошли вместе, и Иаков — с ними; а в его руке был факел[b]. Когда они пришли, они нашли Авраама лежащим мёртвым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из его груди (лона)». В предыдущем контексте говорится, что Иаков спал на груди Авраама.'
    reason: Сохраняет конкретный образ исходного текста и поясняет контекстуальное соотнесение местоимения.
  - marker: b
    text: 'Буквально: «и факел — в его руке». Владелец факела по имени не назван; вероятно, имеется в виду Иаков.'
    reason: Передаёт единственное число исходного текста и сохраняет его формальную неопределённость.
lexical_decisions:
- source_word: እምሕፅኑ
  choice: с груди Авраама
  rationale: Буквальное значение связано с грудью или лоном; контекст предыдущего стиха указывает на Авраама. Формулировка сохраняет телесный образ и повествовательную связь, не заменяя его «постелью».
- source_word: ማኅቶት
  choice: факел
  rationale: Существительное стоит в единственном числе и обозначает источник света, уместный для ночного пути.
- source_word: በድኖ
  choice: мёртвый
  rationale: Передаёт состояние Авраама как умершего, а не просто спящего или неподвижного.
theological_decisions:
- issue: К кому относится единственное число в выражении «в его руке»
  choice: 'Синтаксически связать факел с Иаковом: «Иаков, держа в руке факел»'
  alternative: Сохранить неуточнённое «а в руке у него был факел»
  rationale: Ближайший названный участник мужского рода — Иаков; это даёт естественный русский текст. Сноска отмечает, что сам исходный текст не повторяет имени и формально допускает неопределённость.
translation_notes:
  register: Современный литературный русский с ясным повествовательным ритмом и умеренно торжественным библейским звучанием. Сохранены ночное время, совместное движение персонажей, единственное число «факел» и телесный образ груди Авраама.
