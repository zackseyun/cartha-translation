    rationale: Геэзское ወነገራ («и рассказал») не уточняет ни содержание, ни полноту рассказа; добавление «обо всём» лучше убрать.
  - severity: medium
    issue: Неоднозначность местоимения при факеле устранена в основном тексте.
    rationale: Фраза «Иаков, держа в руке факел» прямо приписывает факел Иакову. Геэзское «в его руке» употребляет единственное число, но имя владельца не повторяет; вероятная связь с Иаковом может быть отражена в сноске, а не утверждаться переводом.
  - severity: low
    issue: Неестественная именная часть сказуемого «лежит мёртвый».
    rationale: 'В современном русском при обозначении состояния естественно: «лежит мёртвым».'
