  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: ru
  text: 'Иаков пробудился ото сна и увидел, что Авраам стал холоден, как град. Он сказал: «Отец! Отец!» Но никто не отвечал, и Иаков понял, что Авраам умер.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነቅሀ፡ … እምንዋሙ፡
  choice: пробудился ото сна
  rationale: Прямо передаёт пробуждение Иакова от сна в естественной современной русской форме.
- source_word: ናሁ፡
  choice: увидел, что
  rationale: 'Контекстуально передаёт повествовательное «вот»: пробудившись, Иаков обнаруживает состояние Авраама; буквальное «вот» здесь звучало бы менее естественно.'
- source_word: ቈረ፡
  choice: стал холоден
  rationale: Передаёт наступившее состояние тела Авраама, а не просто постоянное качество.
- source_word: ከመ፡ ባረድ፡
  choice: словно лёд
  rationale: Сохраняет явное сравнение источника. Хотя ባረድ может буквально обозначать град, в данном контексте русское «словно лёд» естественно выражает холод безжизненного тела.
- source_word: ወአልቦ፡ ዘነበበ፡
  choice: Но никто не отвечал
  rationale: Буквально выражение означает отсутствие говорящего; после двойного обращения к отцу русский глагол «отвечал» ясно и естественно передаёт смысл сцены.
- source_word: ወአእመረ፡ ከመ፡ ሞተ።
  choice: и Иаков понял, что Авраам умер
  rationale: Повтор имён устраняет возможную для русского читателя неоднозначность местоимений, не меняя смысла источника.
theological_decisions:
- issue: Описание смерти Авраама
  choice: 'Передать наблюдение Иакова прямо: «понял, что Авраам умер»'
  alternative: «понял, что он умер»
  rationale: Явное имя не добавляет богословского толкования, а лишь устраняет грамматическую двусмысленность русского местоимения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; обращение «Отец! Отец!» сохраняет эмоциональную силу повторения. Маркер [a] помещён непосредственно после соответствующего сравнения.
