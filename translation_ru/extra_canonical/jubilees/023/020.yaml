  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: ru
  text: 'И станут они спорить друг с другом: юноша — со старцем, старец — с юношей, бедный — с богатым, малый — с великим и нуждающийся — с правителем, о Законе и о Завете, потому что они забыли заповедь, Завет, праздник, месяц, субботу, юбилей и всё установленное[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и всё, что было»; в данном контексте — всё предписанное или установленное.'
    reason: Сохраняет семантическую широту геэзского ዘ ኴነ и поясняет контекстуальный перевод.
lexical_decisions:
- source_word: ይትባአሱ
  choice: станут спорить
  rationale: Передаёт взаимное противостояние и пререкание без чрезмерного усиления до физической борьбы.
- source_word: እሉ ምስለ እሉ
  choice: друг с другом
  rationale: Естественный русский эквивалент буквального «эти с теми», сохраняющий взаимность.
- source_word: ወረዘት
  choice: юноша
  rationale: Контекстуальная пара со «старцем»; единственное число сохраняет обобщённую форму исходного ряда.
- source_word: ሊቃናት
  choice: старец
  rationale: В данном противопоставлении обозначает старшего по возрасту, а не должностного начальника.
- source_word: ነዳይ
  choice: бедный
  rationale: Прямой социально-экономический антоним слову «богатый».
- source_word: ትሑት
  choice: малый
  rationale: Сохраняет социальную и статусную широту «низкого/незначительного» в паре с «великим».
- source_word: ምስኪን
  choice: нуждающийся
  rationale: Отличает эту характеристику от уже названного «бедного» и передаёт уязвимое положение.
- source_word: መኰንን
  choice: правитель
  rationale: Передаёт носителя властной или административной должности без уточнения ранга.
- source_word: ሕግ
  choice: Закон
  rationale: Заглавная буква указывает на сакральный Закон в контексте Завета, а не на любой отдельный закон.
- source_word: ኪዳን
  choice: Завет
  rationale: Передаёт религиозно-обязывающий договор; сохраняется богословская терминология контекста.
- source_word: በዓል
  choice: праздник
  rationale: Обозначает установленное праздничное время в календарном перечне.
- source_word: ሰንበት
  choice: суббота
  rationale: Стандартное русское обозначение священного седьмого дня.
- source_word: እዮቤሌወ
  choice: юбилей
  rationale: Передаёт юбилейный год/цикл, характерный для книги Юбилеев.
- source_word: ኵሎ ዘ ኴነ
  choice: всё установленное
  rationale: В календарно-заветном контексте выражение относится ко всему предписанному, хотя буквально допускает более широкое понимание.
theological_decisions:
- issue: Статус Закона и Завета
  choice: «Закон» и «Завет» с заглавной буквы
  alternative: «закон» и «завет» со строчной буквы
  rationale: Контекст перечисляет основополагающие священные установления; заглавные буквы помогают обозначить конкретные заветные реалии, не добавляя конфессионального толкования.
- issue: Финальная формула ዘ ኴነ
  choice: «всё установленное» с примечанием о буквальном варианте
  alternative: «всё, что было»
  rationale: Контекст требует связи с заповеданными календарными установлениями, однако буквальная широта исходной формулы сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Парные противопоставления оформлены тире для ясности ритма; обобщённое единственное число исходного текста сохранено. Избегались архаизмы и конфессионально специфические формулировки.
