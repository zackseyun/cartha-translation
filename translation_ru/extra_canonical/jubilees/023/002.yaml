  language: ru
  text: И всё это время Иаков лежал у него на груди и не знал, что Авраам, отец его отца, умер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዝ፡ ኵሉ
  choice: И всё это время
  rationale: Передаёт временное значение выражения («при всём этом / в течение всего этого») естественным современным русским оборотом.
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  choice: лежал у него на груди
  rationale: Сохраняет телесный и близкий образ исходного выражения; местоимение оставлено без явного называния референта, как в источнике.
- source_word: አቡ፡ አቡሁ
  choice: отец его отца
  rationale: Буквально воспроизводит родственное обозначение источника, не заменяя его истолковывающим словом «дед».
- source_word: ሞተ
  choice: умер
  rationale: Прямой и нейтральный эквивалент глагола смерти.
