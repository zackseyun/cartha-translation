  source_fidelity: 'В целом перевод точно передаёт структуру и смысл геэзского текста: гибель земли вследствие человеческих дел, отсутствие зерна, вина и масла, нравственная характеристика дел, а затем совместная гибель животных и рыб по вине людей. «Из-за сынов человеческих» оправдано контекстом и соответствует английской контрольной версии. Перечень «зерно, вино, масло» следует принятому в POB пониманию трудного сочетания ዘርእ፡ ወይን и не требует примечания.'
