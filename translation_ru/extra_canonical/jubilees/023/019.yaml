  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: ru
  text: Вот, земля погибнет из-за всех их дел; не будет ни зерна, ни вина, ни масла, потому что все их дела вероломны. И все вместе погибнут — дикие звери, домашний скот, птицы и все морские рыбы — из-за сынов человеческих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትሐጐል
  choice: погибнет
  rationale: Глагол передаёт гибель или уничтожение; «погибнет» естественно по-русски и сохраняет связь с тем же корнем далее в стихе.
- source_word: ዘርእ፡ ወይን
  choice: ни зерна, ни вина
  rationale: Сочетание понимается как перечисление основных земледельческих продуктов — зерна и вина; это согласуется с последующим «масла» и избегает неестественного буквального «семени лозы».
- source_word: ቅብዐ
  choice: масла
  rationale: В данном аграрном перечне имеется в виду масло, вероятнее всего оливковое; родовое «масло» не добавляет отсутствующего в тексте уточнения.
- source_word: ካሕደ፡ ምግባሪሆሙ
  choice: все их дела исполнены неверности
  rationale: Передаёт характеристику дел как вероломных или неверных, сохраняя нравственный оттенок без конфессионального уточнения.
- source_word: አራዊት፡ ወእንስሳ
  choice: дикие звери, домашний скот
  rationale: Различие между дикими животными и одомашненным скотом выражено ясными современными русскими наименованиями.
- source_word: እምቅድመ፡ ውሉደ፡ ሰብእ
  choice: из-за сынов человеческих
  rationale: Сохраняет традиционную антропологическую формулу и причинное значение конструкции в контексте.
theological_decisions:
- issue: Характер человеческих дел
  choice: дела исполнены неверности
  alternative: дела беззаконны / дела вероломны
  rationale: «Неверность» сохраняет возможную этическую и заветную глубину исходного слова, не сводя его только к нарушению закона и не конкретизируя объект неверности.
- issue: Причина гибели творения
  choice: из-за сынов человеческих
  alternative: перед сынами человеческими / от сынов человеческих
  rationale: Контекст связывает гибель животных с человеческими поступками; причинная передача наиболее связна, но не вводит дополнительных пояснений о механизме суда.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим зачином «Вот». Синтаксис сделан ясным для широкого читателя; перечисление и повтор «все их дела» сохранены. Тире выделяет охват гибели всего животного мира.
