base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: ru
  text: А уцелевшие не обратятся от своего зла на путь праведности, потому что все они восстанут ради соперничества[a] и богатства, и каждый — чтобы захватить всё, что принадлежит его ближнему. Они создадут себе великое имя, но не в истине и не в праведности, и осквернят Святое святых своей нечистотой и растлением своей скверны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «борьбы», «состязания»; геэзское слово обозначает борьбу или соперничество, тогда как некоторые переводы понимают его как «обман».'
    reason: Лексема ትዕግልት допускает близкие оттенки борьбы, состязания и соперничества; примечание сохраняет неопределённость и фиксирует отличие от консультационного английского текста.
lexical_decisions:
- source_word: ኢይትመየጡ፡ እምነ፡ እከዮሙ፡ እስመ፡ ኵሎሙ፡ ለትዕግልት፡ ወውስተ፡ ብዕል፡ ይትነሥኡ
  choice: не обратятся от своего зла… восстанут ради соперничества и богатства
  rationale: Сохранены образы обращения и восстания; ትዕግልት передано как «соперничество», то есть борьба за превосходство и приобретение, а не как «обман», который менее прямо соответствует геэзскому слову.
- source_word: ከመ፡ ይንሣኡ፡ አሐዱ፡ ኵሎ፡ ዘቢጹ፡
  choice: и каждый — чтобы захватить всё, что принадлежит его ближнему
  rationale: Конструкция цели сохранена; «захватить» естественно передаёт насильственно-корыстный оттенок ይንሣኡ в данном контексте.
- source_word: ወስመ፡ ዐቢየ፡ ይሰምዩ
  choice: создадут себе великое имя
  rationale: Идиоматическая русская передача стремления приобрести громкое, великое имя; возвратность отражает направленность действия на самих субъектов.
- source_word: ቅድስተ፡ ቅዱሳን
  choice: Святое святых
  rationale: Устоявшееся библейское обозначение высшей святыни; прописная буква указывает на сакральный объект, не уточняя его сверх текста.
- source_word: በርኵሶሙ፡ ወበሙስና፡ ግማኔሆሙ
  choice: своей нечистотой и растлением своей скверны
  rationale: Сохранена накопительная параллельная формула нечистоты и порчи/растления, не сглаживающая тяжеловесность исходного обвинения.
theological_decisions:
- issue: Референт выражения «Святое святых»
  choice: Оставлено без поясняющего дополнения
  alternative: «святилище, Святое святых» или явное указание на храм
  rationale: Исходный текст употребляет сакральную формулу, но в самом стихе не называет храм прямо; уточнение преждевременно сняло бы возможную референциальную широту.
- issue: 'Причина нечестия: обман или соперничество'
  choice: «соперничество» с примечанием
  alternative: «обман»
  rationale: Геэзское ትዕግልት прежде всего связано с борьбой, состязанием или соперничеством. Английское consultation-layer чтение «deceit» богословски не навязывается русскому тексту без достаточного основания.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя, но сохранены повтор «не… и не…», образ пути, мотив великого имени и усиленная формула осквернения.
