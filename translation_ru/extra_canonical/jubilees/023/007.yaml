lexical_decisions:
- source_word: ቀበርዎ
  choice: похоронили его
  rationale: Форма передаёт множественное действие с объектным суффиксом «его»; названные далее Исаак и Измаил выступают подлежащими.
- source_word: በዓተ ካዕበት
  choice: двойной пещере
  rationale: Буквально передано сочетание «пещера» и «двойная» без отождествления с названием, которого в данной формулировке нет.
- source_word: ቅሩበ ሳራ ብእሲቱ
  choice: рядом с Саррой, его женой
  rationale: Сохраняется пространственное значение «рядом/близ» и приложение, называющее Сарру его женой.
- source_word: ውሉዱ ይስሐቅ ወእስማዔል
  choice: его сыновья Исаак и Измаил
  rationale: Сохраняется отложенное подлежащее исходного порядка слов и явно выраженное родство.
