  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: ru
  text: Все люди его дома, Исаак и Измаил, все их сыновья и все сыновья Хеттуры — в своих местах — оплакивали его сорок дней; и дни плача по Аврааму завершились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከይዎ
  choice: оплакивали его
  rationale: 'Передаёт глагол плача с объектным суффиксом: речь идёт о трауре по Аврааму.'
- source_word: ሰብአ፡ ቤቱ
  choice: люди его дома
  rationale: Сохраняет широкое значение домашних и домочадцев, не сужая его до кровных родственников.
- source_word: በመካኖሙ
  choice: каждый там, где находился
  rationale: Естественно передаёт буквальное «в своих местах» и поясняет, что сыновья Хеттуры скорбели в местах своего пребывания.
- source_word: መዋዕለ፡ ብካዩ
  choice: дни плача по Аврааму
  rationale: Финальная конструкция обозначает период траура по Аврааму, а не плач самого Авраама.
