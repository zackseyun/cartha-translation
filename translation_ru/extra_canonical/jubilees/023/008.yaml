revisions:
- from: И оплакивали его сорок дней все люди его дома, и Исаак, и Измаил, и все их сыновья, и все сыновья Хеттуры — каждый там, где находился; и завершились дни плача по Аврааму.
  to: Все люди его дома, Исаак и Измаил, все их сыновья и все сыновья Хеттуры — в своих местах — оплакивали его сорок дней; и дни плача по Аврааму завершились.
  rationale: Перестроено предложение, чтобы все названные группы недвусмысленно были субъектами «оплакивали». Выражение «в своих местах» сохранено без интерпретирующего расширения, а финальная формула оставлена в смысле траура по Аврааму, согласно источнику и английскому аудиторскому следу.
