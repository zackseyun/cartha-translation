  text: And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and he completed the days of his life, old and full of days.
translation:
  language: ru
  text: И прожил он три юбилея и четыре седмины лет, то есть сто семьдесят пять лет, и завершил дни своей жизни старым и исполненным дней.
