revisions:
- from: И прожил он три юбилея и четыре седмины лет — сто семьдесят пять лет. Так завершил он дни своей жизни, состарившись и насытившись днями.
  to: И прожил он три юбилея и четыре седмины лет, то есть сто семьдесят пять лет, и завершил дни своей жизни старым и исполненным дней.
  rationale: Убрано не засвидетельствованное «Так», числовое пояснение оформлено естественным для современного русского способом, а финальная формула приближена к исходным определениям «старый» и «полный/исполненный дней». Календарные термины и их намеренная специфика сохранены.
