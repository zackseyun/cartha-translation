lexical_decisions:
- source_word: ኢዮቤልው
  choice: юбилея
  rationale: Сохраняется техническое обозначение пятидесятилетнего календарного периода в Книге Юбилеев.
- source_word: ሱባዔ፡ ዓመተ
  choice: седмины лет
  rationale: Передаёт семилетние периоды и сохраняет отличие от обычных недель дней.
- source_word: አሂቅ
  choice: состарившись
  rationale: Естественно передаёт состояние «стар/состарившийся» в заключительной формуле о жизни.
- source_word: ወፍጹመ፡ መዋዕለ
  choice: и насытившись днями
  rationale: Сохраняет библейскую образность полноты прожитых дней, не сводя выражение к простому указанию на преклонный возраст.
theological_decisions:
- issue: Формула завершения жизни патриарха
  choice: «состарившись и насытившись днями»
  alternative: «старый и исполненный дней»
  rationale: Выбрана естественная современная русская формулировка, сохраняющая традиционный библейский образ без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Календарные термины сохранены, а итоговое число отделено тире для ясности расчёта.
