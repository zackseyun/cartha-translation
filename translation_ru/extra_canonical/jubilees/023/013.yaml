  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: ru
  text: 'И в те дни, если человек проживёт юбилей с половиной[a], о нём скажут: «Он прожил долго»; но бо́льшая часть его дней — боль, труд и скорбь, и нет мира.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть около семидесяти трёх с половиной лет: в книге Юбилеев юбилей составляет сорок девять лет.'
    reason: Поясняет непривычную современному читателю единицу времени, сохраняя её в основном тексте.
lexical_decisions:
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: юбилей с половиной
  rationale: Сохраняет характерную для книги меру времени и буквально передаёт сочетание юбилея с половиной, не подменяя его приблизительным числом лет в основном тексте.
- source_word: ሕማም
  choice: боль
  rationale: Слово допускает значения болезни, страдания и боли; «боль» естественно сочетается с последующим перечнем тягот и сохраняет широту смысла.
- source_word: ስራሕ
  choice: труд
  rationale: Передаёт работу и тяжёлый труд в данном контексте человеческих тягот.
- source_word: ምንዳቤ
  choice: скорбь
  rationale: Передаёт бедствие и душевное страдание в сжатом, достойном русском регистре.
- source_word: ሰላመ
  choice: мир
  rationale: Сохраняет широкое понятие мира, покоя и благополучия, не сужая его до одного лишь внутреннего спокойствия.
theological_decisions:
- issue: Значение заключительного «нет мира»
  choice: Сохранено буквальное и широкое «нет мира».
  alternative: «нет покоя»
  rationale: «Мир» оставляет открытыми взаимосвязанные значения покоя, безопасности и благополучия, не разрешая смысловую многозначность за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет контраст между признанием долгой жизни и преобладанием в ней страданий; терминология книги не сглажена.
