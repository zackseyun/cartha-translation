  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: ru
  text: 'Тогда они скажут: «Дни прежних людей были долгими — до тысячи лет — и благими. А вот дни нашей жизни: если человек проживёт долгую жизнь — семьдесят лет, а если он крепок — восемьдесят. И эти дни злы, и нет мира во дни этого злого поколения».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለቀደምት
  choice: прежних людей
  rationale: Субстантивированное «прежние» обозначает людей прежних поколений; добавление «людей» делает смысл естественным и ясным по-русски.
- source_word: መዋዕሊሆሙ፡ ብዙኅ
  choice: дни ... были долгими
  rationale: Буквально дни названы «многими»; в контексте продолжительности жизни современное русское «долгими» точнее передаёт смысл.
- source_word: እስከ፡ ዐሠርቱ፡ ምእት፡ ዓመት
  choice: до тысячи лет
  rationale: Эфиопское выражение буквально означает «до десяти сотен лет».
- source_word: አመ፡ አብዝኀ፡ ሰብእ፡ ሐይወ
  choice: если человек проживёт долго
  rationale: Оборот описывает достижение предельной или значительной продолжительности жизни; условная конструкция сохраняет его форму и естественно звучит по-русски.
- source_word: እመ፡ ኀየለ
  choice: если он крепок
  rationale: Глагол связан с силой и крепостью; выбор сохраняет телесный смысл без добавления толкования.
- source_word: እሉ፡ እኩይ
  choice: эти дни злы
  rationale: Указательное местоимение отнесено к ближайшему предмету речи — дням жизни; слово «злы» сохраняет резкую нравственно-бедственную характеристику источника.
theological_decisions:
- issue: Оценка прежних долгих лет как благих и нынешних дней как злых
  choice: Сохранено прямое противопоставление «благими» / «злы»
  alternative: Ослабить до «хорошими» / «тяжелы»
  rationale: Источник использует явно оценочные слова; их не следует сводить только к качеству или трудности жизни.
- issue: Отсутствие мира у злого поколения
  choice: «нет мира во дни этого злого поколения»
  alternative: «нет покоя в дни этого несчастного поколения»
  rationale: «Мир» непосредственно передаёт ሰላም и сохраняет более широкий смысл, включающий благополучие, безопасность и согласие; «злого» не заменено причинно-следующим толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён лишь настолько, чтобы длинное перечисление ясно читалось; повтор «дни» сохранён как смысловой стержень стиха.
