lexical_decisions:
- source_word: ደቂቅ
  choice: дети
  rationale: Буквальное и контекстуально уместное обозначение младшего поколения; сохраняет формулировку источника без уточнения возраста.
- source_word: ይትኀሠሡ፡ ሕገገ
  choice: исследовать закон
  rationale: Глагол передаёт усердный поиск и обращение к закону; «исследовать» естественно выражает целенаправленное изучение.
- source_word: ለኀሢሠ፡ ትእዛዝ
  choice: искать заповеди
  rationale: Сохраняется параллелизм двух глаголов поиска и множественное значение «заповедей».
- source_word: ተመይጦ፡ ውስተ፡ ፍኖተ፡ ጽድቅ
  choice: возвращаться на путь праведности
  rationale: Передаёт движение обратно к образу жизни, определяемому праведностью, без богословского сужения смысла.
theological_decisions:
- issue: Значение «праведности» как нравственного и заветного понятия
  choice: путь праведности
  alternative: праведный путь
  rationale: Конструкция с родительным падежом ближе к источнику и сохраняет более широкое содержание понятия «праведность».
