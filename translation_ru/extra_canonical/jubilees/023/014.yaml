base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: ru
  text: 'Ибо удар за ударом, рана за раной, беда за бедой, дурная весть за дурной вестью, болезнь за болезнью — и всякое подобное зло, одно с другим: недуг, изнеможение, мороз, град, снег, жар, озноб, оцепенение, голод, смерть, меч, плен и всякое бедствие и болезнь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: удар; бедствие
  rationale: В начале стихотворного перечня слово передано как «удар», что естественно сочетается с повторительной конструкцией; в итоговой обобщающей формуле — как «бедствие», чтобы выразить более широкий диапазон значения.
- source_word: ቍስላን
  choice: рана
  rationale: Передаёт конкретное телесное повреждение и сохраняет параллелизм с «ударом».
- source_word: ምንዳቤ
  choice: беда
  rationale: Современное и ёмкое обозначение тяготы или бедствия, подходящее для накопительного перечня.
- source_word: ስምዐት እኩይ
  choice: дурная весть
  rationale: Буквально отражает сочетание «злое/дурное известие» без богословского уточнения.
- source_word: ደዌ / ሕማም
  choice: болезнь
  rationale: Оба близких обозначения недуга переданы общепонятным словом; различие контекстуально неустойчиво и не требует искусственной дифференциации.
- source_word: ጕፍጥአት
  choice: изнеможение
  rationale: Передаёт состояние упадка, обессиленности или коллапса естественным русским словом, не создавая чрезмерно медицинского оттенка.
- source_word: አስሕትያ
  choice: мороз
  rationale: Выбрано погодное значение, согласующееся с последующими «градом» и «снегом».
- source_word: በረድ
  choice: град
  rationale: Сохраняет отдельный явно засвидетельствованный элемент перечня.
- source_word: ሐመዳ
  choice: снег
  rationale: Сохраняет отдельный элемент природных бедствий, пропускавшийся в прежней версии.
- source_word: አርዌው
  choice: жар
  rationale: В контексте телесных недугов естественно обозначает лихорадочный жар.
- source_word: ስክሕካሕ
  choice: озноб
  rationale: Передаёт дрожь или приступ холода и составляет естественную пару с «жаром».
- source_word: ሰምዛዝ
  choice: оцепенение
  rationale: Сохраняет значение ступора или помрачённого неподвижного состояния без излишней конкретизации.
- source_word: ዐባር
  choice: голод
  rationale: Контекст перечня общественных бедствий поддерживает значение голода.
- source_word: መጥባሕት
  choice: меч
  rationale: Метонимическое «меч» естественно обозначает насильственную гибель от оружия и соответствует традиционной библейской лексике.
- source_word: ፂዋዌ
  choice: плен
  rationale: Краткое и точное обозначение пленения или неволи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством библейского перечня. Анафорическая конструкция «X за X» сохраняет нарастающий ритм оригинала; формула «одно за другим» естественно передаёт ዝንቱ ምስለ ዝንቱ. Все явно засвидетельствованные бедствия сохранены, без добавления конфессиональных или толковательных уточнений.
