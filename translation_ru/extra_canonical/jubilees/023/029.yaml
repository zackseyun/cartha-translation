base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: ru
  text: И дни начнут умножаться и возрастать у сынов человеческих — из поколения в поколение, день за днём, — пока дни их жизни не приблизятся к тысяче лет и ко многим годам сверх множества дней.[a] И не будет ни старика, ни того, кто не насытился бы своими днями, ибо все они будут детьми и юношами. Все свои дни они проживут до конца в мире и радости; они будут жить, и не будет ни сатаны, ни злого губителя, ибо все их дни станут днями благословения и исцеления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Геэзское выражение, следующее за «тысячей лет», необычно: буквально оно говорит о «многих годах» и «множестве дней». Его точная синтаксическая связь неясна; оно, вероятно, дополнительно усиливает мысль о долголетии.'
    reason: Сохраняет и отмечает текстуальную неясность без навязывания конкретного истолкования.
lexical_decisions:
- source_word: ይብዝኃ፡ ወይሌህቃ
  choice: умножаться и возрастать
  rationale: Сохраняет парность геэзских глаголов со значениями увеличения и возрастания, не сводя их к одному понятию.
- source_word: ውሉደ፡ ሰብእ
  choice: сыны человеческие
  rationale: Формально и стилистически уместно передаёт буквальное выражение «дети/сыны людей» в древнем религиозном тексте.
- source_word: ትውልድ፡ እምትውልድ፡ ወዕለት፡ እምዕለት
  choice: из поколения в поколение, день за днём
  rationale: Естественно по-русски воспроизводит параллельную последовательность исходного текста.
- source_word: ይቀርብ፡ መዋዕሊሆሙ
  choice: срок их жизни не приблизится
  rationale: Контекстуально «их дни» обозначают продолжительность жизни; при этом сохранён образ приближения к пределу.
- source_word: ዘኢይጸግብ፡ መዋዕሊሆሙ
  choice: того, кто не насытился бы своими днями
  rationale: Сохраняет библейскую метафору насыщения жизнью, не заменяя её истолкованием вроде «неудовлетворённого».
- source_word: ይፈጽሙ
  choice: проживут до конца
  rationale: Передаёт завершение всей полноты дней естественным русским оборотом.
- source_word: ሰይጣነ
  choice: сатаны
  rationale: Сохранено прямое именование противника без конфессионального уточнения его роли.
- source_word: እኩየ፡ ዘያማስን
  choice: какого-либо злого губителя
  rationale: Передаёт зло и разрушительное действие обозначенного существа, сохраняя неопределённость его тождества.
- source_word: በረከት፡ ወፈውስ
  choice: благословения и исцеления
  rationale: Прямо сохраняет два положительных понятия и их эсхатологическое звучание.
theological_decisions:
- issue: Тысячелетняя продолжительность человеческой жизни
  choice: пока срок их жизни не приблизится к тысяче лет
  alternative: пока их дни не достигнут тысячи лет
  rationale: Глагол выражает приближение, а не обязательное точное достижение; перевод не превращает образ в жёсткую хронологическую формулу.
- issue: Упоминание сатаны и злого губителя
  choice: не будет ни сатаны, ни какого-либо злого губителя
  alternative: не будет ни Сатаны, ни злого духа-разрушителя
  rationale: Сохранены два отдельных обозначения исходника без отождествления губителя с духом или демоном и без решения вопроса, является ли «сатана» именем собственным.
- issue: Все будут как дети и юноши
  choice: ибо все они будут как дети и юноши
  alternative: ибо все они будут детьми и юношами
  rationale: Добавление «как» отражает смысловое сравнение, засвидетельствованное консультационным английским текстом, и избегает утверждения о буквальном возрасте при почти тысячелетней жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы длинный пророческий период был понятен обычному читателю; повторы «дни» намеренно сохранены как смысловой и риторический стержень исходника.
