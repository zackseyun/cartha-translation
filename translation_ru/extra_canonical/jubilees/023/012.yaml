  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: ru
  text: И все поколения, которые восстанут отныне и до дня великого суда, будут быстро стареть, не прожив и двух юбилеев; их разумение оставит их — и их дух, — и всё их разумение исчезнет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительные слова «и всё их разумение исчезнет» в издании источника заключены в квадратные скобки, что указывает на текстологическую неуверенность.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሉ፡ ትውልድ
  choice: все поколения
  rationale: Передаёт собирательное выражение источника естественным русским оборотом.
- source_word: ዘይትነሣእ
  choice: которые восстанут
  rationale: Сохраняет образное значение глагола «вставать, возникать» применительно к будущим поколениям.
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: дня великого суда
  rationale: Формально и естественно передаёт эсхатологическое выражение без дополнительного истолкования.
- source_word: ይረሰኡ፡ ፍጡነ
  choice: будут быстро стареть
  rationale: Соответствует значению быстрого старения в данном контексте.
- source_word: ዘእንበለ፡ ይፈጽሙ፡ ክልኤ፡ ኢዮቤልወ
  choice: не прожив и двух юбилеев
  rationale: Естественно выражает «не завершив двух юбилеев», то есть не достигнув полного срока двух юбилейных периодов.
- source_word: አእምሮቶሙ፡ እመንፈሶሙ
  choice: знание покинет их дух
  rationale: Сохраняет оба элемента источника — знание и дух — и избегает их пропуска, хотя синтаксис геэзского выражения допускает менее гладкую буквальную передачу.
- source_word: ወትአትት፡ ኵላ፡ አእምሮቶሙ
  choice: и всё их разумение исчезнет
  rationale: Передаёт итоговую утрату всей способности разуметь и позволяет избежать тяжёлого повтора слова «знание» в русском тексте.
theological_decisions:
- issue: Характер великого суда
  choice: день великого суда
  alternative: день Великого суда
  rationale: Строчная буква сохраняет достоинство выражения, не превращая его без необходимости в закреплённое собственное имя.
- issue: Значение «духа» в описании утраты знания
  choice: их дух
  alternative: их ум / их внутренность
  rationale: Сохранён прямой богословски значимый термин источника без сведения его к одной антропологической интерпретации.
- issue: Статус заключительной фразы
  choice: включена в основной текст с примечанием
  alternative: опустить как вторичную
  rationale: Фраза присутствует в предоставленном источнике, но заключена редактором в квадратные скобки, поэтому её следует сохранить, обозначив текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Термин «юбилей» сохранён как название пятидесятилетнего периода; синтаксис упрощён ради ясности, но последовательность мысли и упоминание духа удержаны.
