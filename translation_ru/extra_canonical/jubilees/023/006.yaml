  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: ru
  text: И в доме Авраама послышался голос. Тогда Измаил, сын его, встал и пришёл к Аврааму, отцу своему, и вместе со всем домом Авраама оплакивал Авраама, отца своего; и плакали они великим плачем.
