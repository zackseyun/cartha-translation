lexical_decisions:
- source_word: ቃል
  choice: плач
  rationale: Буквально слово обозначает «голос, звук», но последующее многократное упоминание плача уточняет характер раздавшегося звука; «плач» естественно передаёт смысл в данном контексте.
- source_word: ተስምዐ
  choice: раздался
  rationale: Пассивное «был услышан» передано естественной русской безличной конструкцией без изменения смысла.
- source_word: ተንሥአ
  choice: встал
  rationale: Сохраняет последовательность действий исходного текста и обычное повествовательное значение глагола.
- source_word: በከየ / በከዩ
  choice: оплакивал / плакали
  rationale: Единственное число с Авраамом как объектом естественно передаётся «оплакивал», тогда как множественное итоговое действие — «плакали».
- source_word: ብካየ፡ ዐቢየ
  choice: великим плачем
  rationale: Сохранена семитская усилительная конструкция и её торжественное библейское звучание.
