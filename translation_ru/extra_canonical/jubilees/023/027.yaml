  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: ru
  text: И головы детей убелятся сединой, и ребёнок трёх недель будет выглядеть старым, как столетний, и их стан будет разрушен бедствием и страданием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸዐዱ፡ አርእስተ፡ ደቂቅ፡ በሲበት
  choice: головы детей убелятся сединой
  rationale: Сохраняет образ раннего поседения и причинное/инструментальное значение выражения «сединой», оставаясь естественным и возвышенным по-русски.
- source_word: ሠለስት፡ ሱባዔ
  choice: трёх седмин
  rationale: Буквально «три семёрки/седмины». Выбор сохраняет формальную неоднозначность единицы счёта и не подменяет её конкретным возрастом.
- source_word: ልሂቅ፡ ከመ፡ ዘምእት፡ ዓመት
  choice: будет выглядеть старым, как столетний
  rationale: Передаёт сопоставление с человеком ста лет без неестественной русской конструкции «как один из ста лет».
- source_word: ይትሐጐል፡ ቍመቶሙ
  choice: силы их будут подорваны
  rationale: Буквальное «их рост/телосложение будет погублено» в контексте обозначает телесную крепость; «силы» естественно передаёт физическое истощение, не сводя смысл только к росту.
- source_word: በምንዳቤ፡ ወበፃዕር
  choice: бедствием и страданием
  rationale: Передаёт два связанных источника телесного упадка, сохраняя их разграничение.
