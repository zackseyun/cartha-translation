review_pass:
  verdict: revise
  source_fidelity: 'Первая и третья части в целом переданы верно, но «трёх седмин» не является удачным обозначением возраста: ሱባዔ здесь, согласно контексту и английской контрольной передаче, означает недели. Кроме того, ቍመቶሙ означает «рост, телосложение, стан», а не просто «силы»; этот конкретный телесный образ следует сохранить.'
  naturalness: «Убелятся сединой» уместно в умеренно возвышенном регистре. «Ребёнок трёх седмин» звучит неестественно и создаёт ненужную неясность; «ребёнок трёх недель» ясно и литературно. «Их стан будет разрушен» несколько буквально, но естественен в пророческом контексте; «телосложение их будет подорвано» менее образно.
  terminology: «Седина», «ребёнок», «столетний», «бедствие» и «страдание» не вызывают терминологических проблем. Для ቍመት выбран «стан», поскольку он передаёт рост/телесный облик и не подменяет его общей физической силой.
  issues:
  - severity: medium
    issue: «трёх седмин» вместо возраста в неделях
    rationale: Исходное выражение в данном месте означает «трёх недель», что подтверждается английским POB audit trail. «Седмина» в современном русском также может восприниматься как семидневный период, но форма родительного множественного числа здесь стилистически тяжела и не сохраняет смысл яснее, чем «недель».
  - severity: medium
    issue: «силы их будут подорваны» вместо «их стан/рост будет разрушен»
    rationale: Геэзское ቍመቶሙ относится к телесному росту, стану или сложению. Передача через «силы» сужает и изменяет образ, заменяя телесный облик абстрактной жизненной силой.
  revised_text: И головы детей убелятся сединой, и ребёнок трёх недель будет выглядеть старым, как столетний, и их стан будет разрушен бедствием и страданием.
  revised_footnotes: []
