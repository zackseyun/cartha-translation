  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: ru
  text: 'И всё это постигнет злое поколение, которое грешит на земле: их дела — нечистота, блуд, скверна и мерзость.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመጽእ
  choice: постигнет
  rationale: В сочетании с бедствиями естественное русское соответствие буквальному «придёт на»; передаёт наступление всего перечисленного на поколение.
- source_word: ትኤብስ
  choice: грешит
  rationale: Глагол означает «грешить, преступать», а не «осквернять»; настоящее время уместно в определительной характеристике поколения.
- source_word: በምድር
  choice: на земле
  rationale: Сохраняет предложную конструкцию и не превращает землю в прямой объект осквернения.
- source_word: ወዝሙት
  choice: блуд
  rationale: Традиционное и понятное в библейском регистре обозначение половой распущенности.
- source_word: ወገማኔ
  choice: скверна
  rationale: Сохраняет отдельный элемент ряда и его смысловую близость к нечистоте, не сливая два исходных понятия.
- source_word: ገብርሙ
  choice: их дела
  rationale: Передаёт самостоятельный именной компонент, относящий весь перечень пороков к делам поколения.
