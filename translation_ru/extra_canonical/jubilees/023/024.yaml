  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: ru
  text: И Он поднимет против них грешников из языческих народов, у которых нет к ним ни милости, ни сострадания и которые не окажут благоволения ни старику, ни юноше — вообще никому, ибо они злы и сильны и творят зло больше всех сынов человеческих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያነቅህ
  choice: поднимет против
  rationale: Каузативная форма передаёт побуждение или поднятие враждебной силы против кого-либо; выражение естественно по-русски и сохраняет субъект действия.
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: грешников из языческих народов
  rationale: Сохраняет характеристику людей как грешников и родительный оборот, связывающий их с народами; «языческие народы» ясно передаёт противопоставление народов Израилю.
- source_word: ምሕረተ፡ ወሣህለ
  choice: милости, ни сострадания
  rationale: Передаёт парные понятия милосердия и жалости без их искусственного отождествления.
- source_word: አሰልሂቅ፡ ወኢለወሬዛ
  choice: ни старика, ни юношу
  rationale: Передаёт меризм возрастных противоположностей в естественной русской форме.
- source_word: እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: больше всех сынов человеческих
  rationale: Формально сохраняет сравнительную конструкцию и традиционный антропологический оборот, не сужая его до отдельного народа.
theological_decisions:
- issue: Субъект, поднимающий грешников из народов
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы
  rationale: Контекст пророческого суда предполагает Бога как подразумеваемого субъекта; прописная буква помогает русскому читателю распознать референта, не добавляя в сам текст имени.
- issue: Степень причинности в Божьем действии
  choice: «поднимет против них»
  alternative: «возбудит против них»
  rationale: Формулировка сохраняет прямое Божье действие текста, но не уточняет сверх сказанного, каким именно образом эти люди побуждаются.
translation_notes:
  register: Современный литературный русский с достоинством древнего пророческого повествования. Синтаксис сделан ясным для обычного читателя; сохранены суровый тон суда, возрастной меризм и выражение «сыны человеческие».
