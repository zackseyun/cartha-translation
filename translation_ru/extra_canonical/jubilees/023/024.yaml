  verdict: revise
  source_fidelity: 'В целом смысл передан точно: Бог поднимает против «них» грешников из народов; те лишены милости и сострадания, не делают различия по возрасту и отличаются злобой и силой. Однако «не щадят» несколько сдвигает значение исходного и английского контрольного текста: там речь о том, что они никому не оказывают благоволения/предпочтения, а не прямо о физическом щажении.'
  naturalness: Русский текст литературный и хорошо читается. Замена оборота о старике и юноше делает соответствующий смысловой оттенок точнее, сохраняя естественный современный синтаксис.
  terminology: «Грешники из языческих народов», «милость», «сострадание» и «сыны человеческие» приемлемы. Прописное «Он» не меняет референта, подразумеваемого контекстом, и соответствует русской библейской типографической традиции.
