revisions:
- from: 'Ибо срок жизни древних составлял девятнадцать юбилеев; после же Потопа продолжительность жизни стала уменьшаться с девятнадцати юбилеев: люди начали быстро стареть, и дни их жизни сокращались из-за множества страданий и порочности их путей — кроме Авраама.'
  to: 'Ибо дни жизни прежних поколений составляли девятнадцать юбилеев; но после Потопа они стали уменьшаться, уже не достигая девятнадцати юбилеев: люди стали быстро стареть и сокращать дни своей жизни из-за множества страданий и из-за порочности своих путей — кроме Авраама.'
  rationale: Уточнено, что после Потопа продолжительность жизни стала ниже прежних девятнадцати юбилеев, без неестественного «уменьшаться с». Восстановлен единый ряд действий с подразумеваемым субъектом «люди», включая «сокращать дни своей жизни». Финальное «кроме Авраама» сохранено в той же конечной позиции, не сужающей объём исключения.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:55:36Z'
review_pass:
  verdict: revise
  source_fidelity: В целом переданы число (девятнадцать юбилеев), связь с Потопом, быстрое старение, причины и заключительное исключение Авраама. Однако «дни их жизни сокращались» ослабляет активную инфинитивную конструкцию источника и английской контрольной версии («[they began] ... to shorten the days of their lives»). Оборот «уменьшаться с девятнадцати юбилеев» также неестественен по-русски и не вполне ясно выражает исходную точку сокращения.
  naturalness: Текст литературен, но «продолжительность жизни стала уменьшаться с девятнадцати юбилеев» звучит тяжеловесно и идиоматически неудачно. Двоеточие после этого оборота неоправданно разрывает единый ряд действий. Перестройка делает фразу плавной, сохраняя умеренно библейский регистр.
  terminology: «Юбилеи», «Потоп», «пути» и «Авраам» переданы удачно. «Прежние поколения» естественнее и точнее, чем субстантивированное «древние», для обозначения людей прежних времён.
  issues:
  - severity: medium
    issue: Ослаблена активная конструкция о сокращении дней жизни.
    rationale: В источнике после «они начали» следует ряд инфинитивов, включая «сокращать дни своей жизни»; страдательно-событийное «дни ... сокращались» меняет синтаксический ракурс.
  - severity: medium
    issue: Неудачен оборот «уменьшаться с девятнадцати юбилеев».
    rationale: В современном русском он может быть понят как сокращение, начинающееся в возрасте девятнадцати юбилеев, а не как снижение по сравнению с прежней продолжительностью жизни.
  - severity: low
    issue: «Древних» недостаточно конкретно.
    rationale: «Прежние поколения» яснее обозначает людей былых времён, о чьей продолжительности жизни идёт речь.
  revised_text: 'Ибо дни жизни прежних поколений составляли девятнадцать юбилеев; но после Потопа они стали уменьшаться, уже не достигая девятнадцати юбилеев: люди стали быстро стареть и сокращать дни своей жизни из-за множества страданий и из-за порочности своих путей — кроме Авраама.'
