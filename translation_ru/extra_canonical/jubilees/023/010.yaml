  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: ru
  text: 'Ибо дни жизни прежних поколений составляли девятнадцать юбилеев; но после Потопа они стали уменьшаться, уже не достигая девятнадцати юбилеев: люди стали быстро стареть и сокращать дни своей жизни из-за множества страданий и из-за порочности своих путей — кроме Авраама.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ቀደምት
  choice: срок жизни древних
  rationale: Передаёт сочетание «дни прежних» в контексте общей продолжительности жизни естественным современным русским языком.
- source_word: ዐሠርቱ፡ ወተስዓቱ፡ ኢዮቤልውሳት
  choice: девятнадцать юбилеев
  rationale: Сохраняет конкретную единицу летосчисления и числовое значение оригинала.
- source_word: አይኅ
  choice: Потоп
  rationale: В данном повествовательном контексте это название всемирного Потопа; прописная буква уместна как у названия уникального события.
- source_word: ይኅትጉ
  choice: стала уменьшаться
  rationale: Смысловой субъект по контексту — продолжительность жизни; явное его обозначение устраняет неестественную русскую двусмысленность, не меняя содержания.
- source_word: ወበረሲአ፡ ፍጡነ
  choice: люди начали быстро стареть
  rationale: Передаёт начало быстрого старения после Потопа и восстанавливает подразумеваемый личный субъект.
- source_word: እምገጸ፡ ሕማም፡ ብዙኅ
  choice: из-за множества страданий
  rationale: Сохраняет причинную связь и широкий смысл бедствий или страданий, не сужая его до телесных болезней.
- source_word: በእከየ፡ ፍናዊሆሙ
  choice: из-за порочности их путей
  rationale: Сохраняет библейский образ «путей» и нравственную характеристику их зла.
- source_word: ዘእንበለ፡ አብርሃም
  choice: кроме Авраама
  rationale: Прямо сохраняет исключение, выраженное в оригинале, не уточняя, к какой именно части предыдущего ряда оно относится.
theological_decisions:
- issue: Объём исключения, относящегося к Аврааму
  choice: Сохранено итоговое «кроме Авраама» после всего ряда утверждений.
  alternative: Отнести исключение только к порочности путей или только к сокращению жизни.
  rationale: Позиция оборота в конце допускает широкий объём исключения; перевод не должен догматически сужать синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан яснее исходного перечисления, но сохранены повтор числа, причинные связи и заключительное исключение.
