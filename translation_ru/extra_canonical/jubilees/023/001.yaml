  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: ru
  text: И он положил два пальца Иакова на свои глаза, благословил Бога богов, закрыл своё лицо, вытянул ноги, уснул вечным сном и был собран к своим отцам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆን፡ አጻብዐ፡ ያዕቆብ
  choice: два пальца Иакова
  rationale: Сохранено буквальное и несколько необычное выражение геэзского текста; притяжательная связь относится к пальцам Иакова, а не к двум пальцам самого умирающего.
- source_word: አምላክ፡ አማልክት
  choice: Бога богов
  rationale: Прямо передаёт превосходную формулу исходного текста, не заменяя её толкованием вроде «Всевышнего Бога».
- source_word: ኖመ፡ ንዋመ፡ ዘለዓለም
  choice: уснул вечным сном
  rationale: Сохраняет метафору сна и значение вечности, выражая их естественно по-русски.
- source_word: ወተጋብአ፡ ኀበ፡ አበዊሁ
  choice: и был собран к своим отцам
  rationale: Сохраняет пассивную конструкцию и древнюю родовую формулу, не сводя её однозначно ни к погребению, ни к представлению о посмертном мире.
theological_decisions:
- issue: Образ смерти как вечного сна
  choice: уснул вечным сном
  alternative: умер навеки
  rationale: Исходный текст использует образ сна; перевод сохраняет его и не превращает метафору в прямое догматическое утверждение.
- issue: Формула «собран к отцам»
  choice: был собран к своим отцам
  alternative: присоединился к своим предкам
  rationale: Выбрана более формально близкая формулировка, сохраняющая богословскую и образную неоднозначность древнего выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая цепь исходного текста сохранена, но формы местоимений сделаны естественными для русского языка; «свои глаза» однозначно относится к подлежащему.
