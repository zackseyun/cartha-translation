lexical_decisions:
- source_word: ወወድቀ
  choice: И ... припал
  rationale: Буквально глагол означает «пал»; в данном контексте русское «припал» естественно передаёт движение скорби и близости, не устраняя телесный образ.
- source_word: ውስተ፡ ገጹ፡ አቡሁ
  choice: к лицу своего отца
  rationale: 'Сохраняется необычный, но понятный образ исходного текста: Исаак припадает именно к лицу отца, а не просто «на отца».'
- source_word: ወበከየ
  choice: заплакал
  rationale: Передаёт последовательное действие в повествовании и естественно звучит на современном русском.
- source_word: ወሰዐሞ
  choice: и поцеловал его
  rationale: Местоименное дополнение относится к отцу; прямой глагол «поцеловал» точно передаёт исходное действие.
