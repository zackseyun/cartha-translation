  naturalness: Текст в целом звучит естественно и сохраняет торжественный ритм. «Не повернут назад» является нормальным современным литературным оборотом и точнее сохраняет образ исходника.
  terminology: «Лук и мечи» и «вернуть их на путь» уместны. «Неся смерть» — приемлемая естественная передача трудного инструментального «с ... убийством/резнёй» без неестественного буквального оборота. Заключительное «одни от рук других» обоснованно вынесено с поясняющей сноской.
  issues:
