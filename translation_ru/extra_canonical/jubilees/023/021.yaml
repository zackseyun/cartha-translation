  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: ru
  text: И они восстанут с луком и мечами, неся смерть, чтобы вернуть их на путь; и не повернут назад, пока на земле не прольётся много крови — одни от рук других.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти — посредством этих»; вероятно, имеется в виду взаимное кровопролитие.'
    reason: Необычная и сжатая заключительная формула исходного текста допускает более буквальное воспроизведение.
lexical_decisions:
- source_word: ይቀውሙ
  choice: восстанут
  rationale: Передаёт активное выступление и сопротивление в данном контексте точнее, чем нейтральное «встанут».
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  choice: с луком и мечами, неся смерть
  rationale: Сохраняет перечисление оружия и убийства, избегая неестественного русского оборота «с убийством».
- source_word: ከመ፡ ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: чтобы вернуть их на путь
  rationale: Предлог ውስተ указывает движение «в/на», поэтому речь идёт о возвращении на путь, а не об изгнании с него.
- source_word: ወኢይትመየጡ
  choice: и не отступят
  rationale: В контексте вооружённого выступления естественно передаёт отказ повернуть назад или прекратить действие.
- source_word: እሉ፡ በእሉ
  choice: одни от рук других
  rationale: Передаёт краткую взаимную формулу «эти посредством тех/этих» как взаимное кровопролитие.
theological_decisions:
- issue: Направление принуждения по отношению к «пути»
  choice: вернуть их на путь
  alternative: сбить их с пути / прогнать их с пути
  rationale: Геэзское ውስተ означает движение внутрь или к чему-либо; перевод не должен превращать попытку возвращения на путь в удаление с него.
- issue: Характер заключительного кровопролития
  choice: одни от рук других
  alternative: эти от тех
  rationale: Сохранён взаимный характер насилия без уточнения групп или нравственной оценки, которых исходный текст здесь не называет.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Неестественное буквальное сочетание «с убийством» передано деепричастным оборотом «неся смерть»; синтаксическая напряжённость и суровый образ кровопролития сохранены.
