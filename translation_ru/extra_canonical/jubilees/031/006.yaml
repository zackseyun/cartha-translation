  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: ru
  text: И пришёл он к своему отцу Исааку и к своей матери Ревекке. Ревекка вышла из покоя к двери покоя, чтобы поцеловать Иакова и обнять его, потому что дух её ожил, когда…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза обрывается на слове «когда» и продолжается в следующем стихе.
    reason: Граница стиха проходит внутри зависимого временного предложения; многоточие и примечание предупреждают ошибочное восприятие текста как законченного.
lexical_decisions:
- source_word: ማኅፈድ
  choice: покой
  rationale: Слово дважды передано одинаково, чтобы сохранить заметный повтор оригинала; «покой» естественно обозначает внутреннюю комнату и соответствует контексту.
- source_word: አንቀጸ
  choice: дверь
  rationale: В сочетании с помещением речь естественно идёт о двери, а не о городских воротах.
- source_word: ትስዐሞ … ወትሕቀፎ
  choice: поцеловать … и обнять
  rationale: Прямо и естественно передаёт два последовательных действия.
- source_word: ሐይወ፡ መንፈሳ
  choice: дух её ожил
  rationale: Сохраняет образную формулировку и порядок смысловых компонентов оригинала, не заменяя её толкованием вроде «она воспрянула духом».
- source_word: በጊዜ
  choice: когда…
  rationale: Передаёт союзное значение, связывающее оборванную на границе стиха фразу с продолжением, а не искусственно завершает предложение выражением «в то время».
theological_decisions:
- issue: Значение выражения «дух её ожил»
  choice: Сохранить буквальный образ без догматического уточнения
  alternative: «она воспрянула духом» или «к ней вернулись силы»
  rationale: Исходная формулировка допускает образное понимание; перевод не должен преждевременно сводить её к психологическому или физическому состоянию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «покой» намеренно сохранён вслед за оригиналом; синтаксическая незавершённость последней части также сохранена.
