lexical_decisions:
- source_word: ይኩኑ፡ ርጉማነ
  choice: станут проклятыми
  rationale: Передаёт глагольную связку во множественном числе и предикативное значение «проклятые», сохраняя продолжение фразы из предыдущего контекста.
- source_word: ተመይጠ
  choice: повернулся
  rationale: Прямое и естественное соответствие значению возвращения или поворота; в данном фрагменте «повернулся» не добавляет невыраженного направления.
- source_word: ሰዐሞ፡ ዳግመ
  choice: снова поцеловал его
  rationale: ዳግመ означает повторность действия; местоименное дополнение восстановлено по форме и контексту.
- source_word: ሐቀፎ
  choice: обнял
  rationale: Естественная русская передача действия объятия с тем же объектом.
- source_word: ተፈሥሐ፡ ዐቢየ
  choice: весьма обрадовался
  rationale: Сохраняет усиление радости, выраженное наречным употреблением «великим образом / сильно».
- source_word: እስመ
  choice: потому что
  rationale: Сохраняет причинный союз и намеренно оставляет предложение незавершённым, как в предоставленном фрагменте.
