  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: ru
  text: И Исаак благословил Бога своего отца Авраама, который не лишил сына своего слуги Исаака милости и праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: благословил
  rationale: Прямо передаёт глагол со значением «благословлять, прославлять» и сохраняет библейскую формулу.
- source_word: አኀደገ
  choice: не лишил
  rationale: В отрицательной конструкции выражает смысл «не удержал, не отнял, не лишил»; по-русски здесь естественно «не лишил».
- source_word: ምሕረተ
  choice: милости
  rationale: Передаёт милосердие и благоволение Бога без неоправданного сужения значения.
- source_word: ጽድቀ
  choice: праведности
  rationale: 'Сохраняет основной богословский диапазон слова: праведность, справедливость, верность правому.'
- source_word: ገብሩ
  choice: своего слуги
  rationale: Родительный суффикс относится к Богу; «слуга» — понятный современный эквивалент, сохраняющий отношение служения.
theological_decisions:
- issue: Чья милость и праведность имеются в виду
  choice: Сохранить их как качества или благодеяния Бога
  alternative: Передать «милосердной и праведной помощи»
  rationale: Исходный текст называет «милость и праведность» без пояснения; конкретизация устранила бы присущую ему богословскую ёмкость.
- issue: Связь выражения «сына своего слуги Исаака»
  choice: «своего» отнести к Богу, а Исаака представить его слугой и отцом названного сына
  alternative: Перестроить как «сына Исаака, своего слуги»
  rationale: Выбранный порядок близок к источнику, но в русском допускает кратковременную синтаксическую неоднозначность; альтернатива яснее, однако сильнее перестраивает фразу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохранён компактным; архаизмы и конфессионально нагруженные уточнения не добавлены.
