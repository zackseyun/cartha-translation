  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: ru
  text: 'а левую — на Иуду.[a] Затем он сначала повернулся к Левию, начал благословлять его и сказал ему: «Да благословит тебя Бог всего, Господь всех веков,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и Иуду — своей левой рукой».'
    reason: 'Эфиопский текст эллиптичен: подразумеваемое действие и слово «руку» восстанавливаются из предыдущего стиха. Этот вариант сохраняет более близкий к оригиналу синтаксис и притяжательное значение.'
lexical_decisions:
- source_word: በፀጋማዊ፡ እዴሁ፡
  choice: левую [руку]
  rationale: Буквально «левой рукой/своей левой рукой»; в русском эллипсис естественно продолжает действие предыдущего стиха.
- source_word: ቀዲሙ፡
  choice: сначала
  rationale: Передаёт первенство Левия в последовательности благословения, не дублируя наречие при следующем глаголе.
- source_word: ኵሉ፡ ዓለማት፡
  choice: всех веков
  rationale: ዓለማት — множественное число со значением «века, эпохи»; сохраняется временной, а не пространственный смысл.
theological_decisions:
- issue: Титул አምላከ፡ ኵሉ፡
  choice: Бог всего
  alternative: Бог всех
  rationale: Форма допускает обобщённое «всего/всех»; «Бог всего» сохраняет широту и не вводит подразумеваемую группу лиц.
- issue: Титул እግዚአ፡ ኵሉ፡ ዓለማት፡
  choice: Господь всех веков
  alternative: Господь всех миров
  rationale: В данном титуле «века» естественно передаёт эпохи и сохраняет традиционную временную многозначность, не сводя выражение к космологии.
translation_notes:
  register: Современный литературный русский с достоинством благословительной речи. Начальная фраза намеренно оформлена как продолжение предыдущего стиха; кавычка открывается перед прямой речью и не закрывается, поскольку предложение продолжается далее.
