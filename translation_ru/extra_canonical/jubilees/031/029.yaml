revisions:
- from: Поскольку ты увидел меня живым и я тоже увидел тебя, сын мой, преуспевай и исполни обет, который ты дал. Не откладывай исполнения своего обета, потому что с тебя спросят за него; теперь же поспеши исполнить его.
  to: Поскольку ты увидел меня живым и я тоже увидел тебя, сын мой, преуспевай и исполни обет, который ты дал. Не откладывай исполнения своего обета, потому что с тебя спросят за этот обет; теперь же поспеши исполнить его.
