  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: ru
  text: Поскольку ты увидел меня живым и я тоже увидел тебя, сын мой, преуспевай и исполни обет, который ты дал. Не откладывай исполнения своего обета, потому что с тебя спросят за этот обет; теперь же поспеши исполнить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: поскольку
  rationale: В данном контексте оборот выражает основание («поскольку», «так как»), а не вводит отсутствующий в источнике временной антецедент «день».
- source_word: ተስፋሕ፡
  choice: преуспевай
  rationale: Императив передан естественным русским глаголом с пожелательно-наставительным оттенком; значение не сужено до материального процветания.
- source_word: ጸሎተ፡ / ጸሎተከ፡
  choice: обет / своего обета
  rationale: Хотя слово может обозначать молитву, сочетание с «дал» и требованием исполнить указывает здесь на обет.
- source_word: ወአታጕንዲ፡
  choice: не откладывай исполнения
  rationale: Передаёт запрет медлить; добавление «исполнения» делает русскую формулировку естественной без изменения смысла.
- source_word: ትትኀሠሥ፡
  choice: с тебя спросят
  rationale: Сохраняет пассивно-неопределённую идею востребования и ответственности, не уточняя того, кто потребует отчёта.
- source_word: ጕጕአ፡ ትግበራ፡
  choice: поспеши исполнить его
  rationale: Передаёт настоятельный призыв без промедления совершить обещанное.
theological_decisions:
- issue: Кто потребует отчёта за обет
  choice: с тебя спросят
  alternative: Бог спросит с тебя
  rationale: Источник не называет действующее лицо; неопределённо-личная конструкция сохраняет эту неоднозначность и не вносит явного богословского уточнения.
- issue: Значение ጸሎት в контексте
  choice: обет
  alternative: молитва
  rationale: Глаголы «дать/обещать» и «исполнить» вместе с предостережением не медлить контекстуально требуют значения «обет».
translation_notes:
  register: Современный литературный русский язык с достоинством наставления отца сыну. Синтаксис разгружен делением на два предложения; повтор «обет» частично сохранён ради смысловой ясности, а местоимение в конце устраняет тяжеловесность.
