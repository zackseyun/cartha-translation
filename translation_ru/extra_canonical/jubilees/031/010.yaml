  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: ru
  text: '«Ведь они похожи на тебя». И он сказал ему, что это действительно его сыновья. Тогда тот сказал: «Теперь я вижу, что они и вправду твои сыновья».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: они похожи на тебя
  rationale: Передаёт значение глагола «быть похожим» и местоименный суффикс второго лица единственного числа.
- source_word: በአማን / አማን
  choice: действительно / и вправду
  rationale: Повторяющееся наречие уверенности передано близкими естественными русскими соответствиями без ослабления утверждения.
- source_word: ውሉዱ
  choice: его сыновья
  rationale: Форма в представленном тексте указывает на сыновей/детей с притяжательным суффиксом третьего лица; в контексте речь идёт о сыновьях Иакова.
- source_word: ርእክ
  choice: я вижу
  rationale: 'По контексту реплика выражает наступившее признание: «теперь я вижу»; это также согласуется с консультационным английским текстом.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь выдержана естественно и достойно. «Сыновья» сохранено вместо контекстуально возможного родственного обозначения «внуки», поскольку исходный текст характеризует их по отношению к Иакову.
