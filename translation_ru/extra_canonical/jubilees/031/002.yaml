  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: ru
  text: «…чужих богов, которые находятся среди вас». И они отдали ему чужих богов, а также то, что было у них в ушах и на шеях, и идолов, которых Рахиль украла у своего брата Лавана. Она отдала всё это Иакову, и он сжёг их, раздробил, уничтожил и спрятал под дубом[a], что рос в земле Сихема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «под теревинфом»; точный вид дерева, обозначенного геэзским словом, неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አማልክተ፡ ነኪር
  choice: чужих богов
  rationale: Передаёт значение иноземных, чужих богов без уточнения их природы сверх исходного текста.
- source_word: ወዘውስተ፡ እዘኒሆሙ፡ ወዘውስተ፡ ክሳውዲሆሙ
  choice: а также то, что было у них в ушах и на шеях
  rationale: Сохраняет конкретные образы исходного текста и не заменяет предметы истолковывающим словом «украшения».
- source_word: ድርዋስ
  choice: дубом
  rationale: Традиционное и понятное обозначение дерева; точный ботанический вид неясен, поэтому альтернатива вынесена в сноску.
- source_word: ወአውዕዮ፡ ወፀተሞ፡ ወአማስኖ፡ ወኀብአ
  choice: сжёг их, раздробил, уничтожил и спрятал
  rationale: Переданы все четыре последовательных глагола, включая ранее опускавшееся «уничтожил».
theological_decisions:
- issue: Обозначение языческих культовых объектов
  choice: «чужие боги» и «идолы»
  alternative: унифицировать оба выражения как «идолы»
  rationale: Сохранено лексическое различие исходного текста без богословского сглаживания.
- issue: Родство Рахили и Лавана
  choice: «своего брата Лавана»
  alternative: «своего отца Лавана»
  rationale: Перевод следует представленному геэзскому тексту, даже несмотря на напряжение с известной генеалогией повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное многоточие показывает, что стих начинается продолжением прямой речи из предыдущего стиха. Синтаксический переход от цитаты к повествованию сохранён явно.
