  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: ru
  text: и твоих детей — во все века. И да дарует Господь тебе и твоему потомству великое разумение[a] для славы. И да приблизит Он тебя и твоё потомство к Себе из среды всех людей для служения в Его святилище, подобно ангелам присутствия и святым. Какими являются они, таким будет и потомство твоих детей — во славе и величии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величие сердца».'
    reason: Сохраняет буквальную, этимологически обусловленную возможность передачи выражения ዐባየ ልባዌ.
lexical_decisions:
- source_word: ዐባየ፡ ልባዌ
  choice: великое разумение
  rationale: Производное существительное ልባዌ обозначает разумение, понимание или рассудительность; перевод передаёт его лексическое значение, а не только этимологическую связь с сердцем.
- source_word: እምኵሉ፡ ዘሥጋ
  choice: из среды всех людей
  rationale: Буквально выражение связано со «всякой плотью», но здесь обозначает всё человечество; выбран естественный современный русский оборот, сохраняющий смысл выделения из общей среды.
- source_word: ይትአለክ፡ ውስተ፡ መቅደሱ
  choice: для служения в Его святилище
  rationale: Отглагольная конструкция сохраняет храмовый характер служения и не навязывает русскому тексту более определённый субъект, чем позволяет контекст.
- source_word: መላእክተ፡ ገጽ
  choice: ангелам присутствия
  rationale: Идиоматический перевод выражения «ангелы лица», обозначающего ангелов, пребывающих перед Божьим лицом; он понятнее современному читателю.
theological_decisions:
- issue: Характер обещанного дара
  choice: великое разумение
  alternative: величие сердца
  rationale: Основное значение ልባዌ связано с пониманием и разумом, однако этимологический образ сердца сохранён в сноске как реальная возможность более буквальной передачи.
- issue: Сопоставление потомства с небесными существами
  choice: «Какими являются они, таким будет и потомство…» без дальнейшего пояснения
  alternative: уточнить, что потомство станет ангелоподобным или святым
  rationale: Источник оставляет точный аспект сходства неразъяснённым; перевод сохраняет эту богословскую напряжённость и не развивает её доктринально.
translation_notes:
  register: Современный литературный русский с умеренно торжественным благословительным строем. Сохранены повтор «тебя и твоё потомство» и формула «во славе и величии»; архаизм «всякая плоть» заменён ясным выражением «все люди».
