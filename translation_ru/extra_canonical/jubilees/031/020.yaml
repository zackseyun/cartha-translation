base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: ru
  text: И в тебе обретётся спасение Израиля. И в тот день, когда ты сядешь на престоле славы твоей праведности[a], будет великий мир для всего потомства сынов Возлюбленного. Благословен тот, кто благословляет тебя; а все, кто ненавидит и притесняет тебя, и все, кто проклинает тебя, будут искоренены и погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на славном престоле твоей праведности». Выражение в источнике представляет собой плотную цепочку существительных.'
    reason: segmentation_note
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: спасение Израиля
  rationale: Прямо передаёт значение существительного «спасение, избавление», не уточняя его духовный или политический характер.
- source_word: አመ፡ ዕለት
  choice: в тот день, когда
  rationale: Сохраняет явно названный в источнике «день», опущенный в более свободном переводе «когда».
- source_word: መንበረ፡ ክብር፡ ጽድቅከ
  choice: на престоле славы твоей праведности
  rationale: Сохраняет плотную цепочку существительных источника и значение ክብር как «слава», не сводя выражение к одному прилагательному.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: всему потомству сынов Возлюбленного
  rationale: Передаёт элементы «потомство/семя», «сыновья» и «Возлюбленный» без ошибочного прочтения ለፍቅር как «навеки»; титульное употребление оставлено без отождествления личности.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: будут искоренены и погибнут
  rationale: 'Сохраняет два последовательных образа полного устранения: выкорчёвывание и гибель.'
theological_decisions:
- issue: Кого обозначает «Возлюбленный»
  choice: Сохранить «Возлюбленного» как неопределённое титульное обозначение
  alternative: Отождествить его с конкретным патриархом или заменить местоимением
  rationale: Сам стих не называет носителя титула; конкретизация внесла бы интерпретацию, отсутствующую в данной строке.
- issue: Связь славы и праведности с престолом
  choice: Сохранить генитивную конструкцию «престол славы твоей праведности»
  alternative: «славный престол твоей праведности»
  rationale: Источник допускает более компактное понимание, но его синтаксическая плотность и возможная смысловая связь славы с праведностью заслуживают сохранения в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Архаизмы сведены к минимуму; параллелизм благословения и проклятия, а также повтор местоимения «тебя» сохранены ради риторической структуры.
