revisions:
- from: И в тебе обретётся спасение Израиля. И в тот день, когда ты сядешь на престоле славы твоей праведности[a], великий мир будет дарован всему потомству сынов Возлюбленного. Благословен тот, кто благословляет тебя; а все ненавидящие и притесняющие тебя и проклинающие тебя будут искоренены и погибнут.
  to: И в тебе обретётся спасение Израиля. И в тот день, когда ты сядешь на престоле славы твоей праведности[a], будет великий мир для всего потомства сынов Возлюбленного. Благословен тот, кто благословляет тебя; а все, кто ненавидит и притесняет тебя, и все, кто проклинает тебя, будут искоренены и погибнут.
