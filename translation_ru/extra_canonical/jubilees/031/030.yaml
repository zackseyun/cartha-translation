  text: And may he prosper all that you do, all for which you have prayed in prayer.” And he said to Rebekah, “Go with Jacob your son.” And Rebekah went with Jacob her son, and Deborah with her, and they came to
translation:
  language: ru
  text: 'И да дарует Он успех во всём, что ты делаешь, во всём, о чём ты молился в молитве». И сказал он Ревекке: «Иди с Иаковом, сыном твоим». И Ревекка пошла с Иаковом, сыном своим, и Девора — с нею, и пришли они в…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይሥመር
  choice: И да дарует Он успех
  rationale: Передаёт пожелание с глаголом со значением благоприятствовать, содействовать успеху; прописная буква у местоимения указывает на Бога по контексту, не добавляя имени.
- source_word: ለዘጸለይከ፡ ጸሎተ
  choice: о чём ты молился в молитве
  rationale: Сохраняет источник с корнем «молиться», не заменяя его значением «давать обет»; лёгкая тавтологичность отражает форму оригинала.
- source_word: ሖሪ
  choice: Иди
  rationale: Естественная русская форма повелительного наклонения женского рода в обращении к Ревекке.
- source_word: ወልድኪ
  choice: сыном твоим
  rationale: Следует исправленному чтению, отмеченному в ревизии; сохраняет уточнение родства в прямой речи.
- source_word: ወሖረት፡ ርብቃ
  choice: И Ревекка пошла
  rationale: Сохраняет прямо названное подлежащее и не добавляет отсутствующее в источнике «встала».
- source_word: ወዲቦራ፡ ምስሌሃ
  choice: и Девора — с нею
  rationale: Кратко и естественно передаёт присоединительную конструкцию; тире восполняет подразумеваемое сказуемое без смыслового добавления.
theological_decisions:
- issue: Кто является подразумеваемым субъектом пожелания «да дарует успех»
  choice: Местоимение «Он» с прописной буквы
  alternative: Строчное «он» либо явное «Бог»
  rationale: Контекст указывает на Бога, но источник не повторяет Его имени; местоимение сохраняет эту неявность, а прописная буква соответствует достоинству русского религиозного регистра.
- issue: Смысл молитвенной формулы
  choice: «о чём ты молился в молитве»
  alternative: «о чём ты просил в молитве» или «что ты обещал в молитве»
  rationale: Сохраняется молитвенная лексема оригинала и не вносится отсутствующая идея обета.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повторы родственных обозначений сохранены ради точности. Конечная фраза намеренно оставлена незавершённой, поскольку предоставленный стих и источник обрываются после предлога «в/к».
