lexical_decisions:
- source_word: ለክልኤሆሙ፡ ኀቡረ
  choice: обоих вместе
  rationale: Передаёт сочетание «обоих» и «вместе»; начальная форма фрагмента сохраняет его синтаксическую связь с предыдущим стихом.
- source_word: መንፈሰ፡ ትንቢት
  choice: дух пророчества
  rationale: Прямое и естественное соответствие исходному выражению без уточнения природы духа.
- source_word: ወረደ፡ ውስተ፡ አፉሁ
  choice: сошёл в его уста
  rationale: Сохраняет конкретный образ нисхождения духа в уста, не заменяя его более толковательным «почил на нём» или «заговорил через него».
- source_word: ወአንዘ፡ ለሌዊ፡ በየማናዊ
  choice: И он взял Левия правой рукой
  rationale: Передаёт действие и указание на правую руку в естественной современной русской форме.
theological_decisions:
- issue: Природа «духа пророчества»
  choice: Сохранено нарицательное выражение «дух пророчества».
  alternative: «Дух пророчества» с прописной буквы либо «пророческий дух».
  rationale: Исходный текст сам по себе не требует персонализировать выражение или отождествлять его с конкретным богословским понятием; буквальная конструкция сохраняет неоднозначность.
