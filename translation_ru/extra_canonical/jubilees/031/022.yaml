  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: ru
  text: Он воистину увидел сыновей своего сына Иакова. Иаков вышел из пространства между его ногами[a], пал и поклонился ему. Он благословил их и остался там, рядом с Исааком, своим отцом, в ту ночь; и они ели и пили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел из среды его ног». Выражение в источнике неясно; вероятно, речь идёт о том, что Иаков отошёл от непосредственной близости к Исааку, прежде чем пасть и поклониться.'
    reason: Сохранение неясной исходной идиомы и указание вероятного смысла без внесения его в основной текст.
lexical_decisions:
- source_word: ርእየ
  choice: увидел
  rationale: Передаёт простое значение глагола «видеть»; перфект выражен русским прошедшим видом по контексту.
- source_word: ዘበጽድቅ
  choice: воистину
  rationale: В данном контексте сочетание имеет наречное значение «истинно, действительно»; буквальное «в праведности» по-русски затемнило бы смысл.
- source_word: ወወፅአ፡ እማእከለ፡ እገሪሁ
  choice: И вышел он из места между его ногами
  rationale: Сохранён необычный и не вполне ясный образ источника, без подмены его предположительной интерпретацией.
- source_word: ወሰገደ፡ ሎቱ
  choice: и поклонился ему
  rationale: Естественная русская передача действия почтительного поклонения с сохранением местоименной неоднозначности.
- source_word: ወአዕረፈ፡ ህየ
  choice: остался там
  rationale: По контексту глагол обозначает ночлег или пребывание; «остался» звучит естественно и не добавляет способа отдыха.
theological_decisions:
- issue: Значение ዘበጽድቅ
  choice: воистину
  alternative: в праведности
  rationale: Наречное прочтение лучше соответствует синтаксису и смыслу фразы, однако не вводит богословской оценки потомков Иакова.
- issue: К кому относится «ему» в сцене поклонения
  choice: сохранено местоимение «ему»
  alternative: назвать Исаака или Иакова прямо
  rationale: Источник употребляет местоимение, и его референт не следует молча уточнять в переводе.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного регистра. Синтаксис слегка упорядочен для естественности, но местоименная неоднозначность и необычная исходная идиома сохранены.
