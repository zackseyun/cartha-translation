revisions:
- from: Он воистину увидел сыновей своего сына Иакова. И вышел он из места между его ногами[a], пал и поклонился ему. Затем он благословил их и в ту ночь остался там, рядом со своим отцом Исааком; и они ели и пили.
  to: Он воистину увидел сыновей своего сына Иакова. Иаков вышел из пространства между его ногами[a], пал и поклонился ему. Он благословил их и остался там, рядом с Исааком, своим отцом, в ту ночь; и они ели и пили.
  rationale: Исправлена только русская связность при смене субъекта и несколько уменьшено добавление к буквальному образу. Неопределёнными оставлены референты в «его ногами» и «ему», как в источнике; примечание остаётся привязанным к необычному обороту.
