  language: ru
  text: 'при его жертвоприношении, а также к его матери Ревекке. Исаак сказал: «Пусть придёт мой сын Иаков»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ መሥዋዕቱ
  choice: при его жертвоприношении
  rationale: Предлог ውስተ здесь передаёт нахождение при событии; «при» естественно выражает этот смысл по-русски, а መሥዋዕት означает жертву или жертвоприношение.
- source_word: ወኀበ፡ እሙሂ፡ ርብቃ
  choice: а также к его матери Ревекке
  rationale: ኀበ имеет направительное значение «к», суффикс при እሙ указывает на «его мать», а частица -ሂ означает «также».
- source_word: ይምጻእ
  choice: Пусть придёт
  rationale: Форма выражает побуждение или пожелание в третьем лице; русский оборот «пусть придёт» сохраняет эту модальность.
