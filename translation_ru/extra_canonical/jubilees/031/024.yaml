  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: ru
  text: 'И это было вменено ему в праведность.[a] Иаков ночью рассказал своему отцу обо всём: как Господь явил ему великую милость,[b] как сделал успешными все его пути и уберёг его от всего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном геэзском тексте буквально: «И праведность перешла к нему». Вероятно, здесь ошибка переписчика или издания вместо слова «было вменено (сочтено)».'
    reason: Текстологически значимое расхождение между данным чтением и вероятным исходным текстом.
  - marker: b
    text: 'Или: «обо всём, что Господь сделал с ним, — о великой милости».'
    reason: Сохраняет более буквальную возможность синтаксического членения геэзской фразы и значение «с ним».
lexical_decisions:
- source_word: ወተኀለፈ (вероятная ошибка текста вместо ወተኈለቈ) ሎቱ ጽድቀ
  choice: И это было вменено ему в праведность
  rationale: Учитывается засвидетельствованное исправление ошибочного чтения на глагол «считать, вменять» и сохраняется библейская формула; местоимение «это» передаёт подразумеваемый предмет вменения.
- source_word: እግዚአ ብሔር
  choice: Господь
  rationale: Обычное соответствие данному геэзскому обозначению Господа.
- source_word: ገብረ ... ሣህለ ዐቢየ
  choice: явил ему великую милость
  rationale: Естественно передаёт сочетание «сделал/оказал ... великую милость», не меняя его смысла.
- source_word: ሠርሖ ኵሎ ፍኖቲሁ
  choice: даровал успех на всех его путях
  rationale: 'Передаёт каузативный смысл: Господь сделал успешными все пути Иакова; русская формулировка звучит естественно и достойно.'
- source_word: ተማኅፀኖ እምኵሉ
  choice: оберегал его от всего
  rationale: Сохраняет широкое «от всего», не добавляя отсутствующего в источнике слова «зло».
theological_decisions:
- issue: Смысл начальной фразы о праведности
  choice: «это было вменено ему в праведность»
  alternative: «праведность перешла к нему»
  rationale: Основной текст следует вероятному исправлению геэзского глагола и узнаваемой библейской идиоме, а буквальное чтение представленного текста сохраняется в примечании.
- issue: Субъект дарования успеха и защиты
  choice: Господь остаётся субъектом всех трёх действий
  alternative: Понимать последующие глаголы как действия самого Иакова
  rationale: Синтаксическое продолжение наиболее естественно относит «даровал успех» и «оберегал» к Господу, не вводя дополнительного субъекта.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным регистром. Формула «вменено ему в праведность» намеренно сохраняет межтекстовую библейскую связь; остальные обороты сделаны естественными для современного читателя.
