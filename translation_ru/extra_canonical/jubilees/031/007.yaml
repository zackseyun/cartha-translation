  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: ru
  text: 'Она услышала: «Вот, пришёл Иаков, сын твой», — и поцеловала его. Увидев двух его сыновей, она узнала их и сказала ему: «Это твои сыновья, сын мой?» Она обняла их, поцеловала и благословила, говоря: «В вас прославится потомство Авраама, и вы станете благословением».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽሐ
  choice: пришёл
  rationale: Глагол означает «достиг, прибыл»; в данном повествовательном контексте естественное русское соответствие — «пришёл».
- source_word: አእመረትሙ
  choice: узнала их
  rationale: Форма передаёт узнавание или распознавание двух сыновей; «узнала их» сохраняет прямой смысл и естественно звучит по-русски.
- source_word: ዘርአ፡ አብርሃም
  choice: потомство Авраама
  rationale: ዘርእ буквально «семя», но в родословно-заветном контексте обозначает потомство; современное русское «потомство» ясно и сохраняет коллективный смысл.
- source_word: ይክበር
  choice: прославится
  rationale: Глагол связан с почётом, славой и возвеличиванием; «прославится» хорошо передаёт здесь пожелание чести и славы.
- source_word: ለበረከት
  choice: благословением
  rationale: 'Конструкция с «быть/стать» и существительным «благословение» естественно передаётся творительным падежом: «станете благословением».'
theological_decisions:
- issue: Число адресатов в заключительном благословении
  choice: «в вас… вы станете» — обращение к обоим сыновьям
  alternative: Единственное число с обращением к Иакову
  rationale: Формы ብክሙ и ትከውኑ имеют множественное число и следуют непосредственно за объятиями и благословением двух сыновей; перевод сохраняет эту грамматическую особенность, не перенося благословение исключительно на Иакова.
- issue: Отсутствие указания «на земле»
  choice: Не добавлять эти слова
  alternative: «вы станете благословением на земле»
  rationale: В представленном эфиопском тексте соответствующих слов нет; добавление необоснованно расширило бы содержание стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок некоторых слов естественно перестроен по-русски; повтор местоимений и последовательность действий сохранены. Вопрос оформлен прямо и без внесения пояснений, которых нет в источнике.
