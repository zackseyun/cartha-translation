  yaml_path: translation/extra_canonical/jubilees/031/016.yaml
  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: ru
  text: чтобы они благословляли всё потомство Возлюбленного. Твоя мать назвала тебя Левием, и поистине так она тебя и назвала.[a] Ты будешь присоединён к Господу и будешь спутником всех сыновей Иакова. Его трапеза будет твоей, и ты и твои сыновья будете есть от неё. И твоя трапеза будет изобильна для всех поколений.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «Твоя мать дала тебе имя Левий, и поистине дала тебе имя».'
    reason: Сохраняет формальное повторение слов «имя» и «дала», тогда как основной текст передаёт его более естественно по-русски.
  - marker: b
    text: 'В представленном фрагменте эфиопского текста последние слова обрываются после «для всех»; полный текст стиха продолжает: «поколений».'
    reason: Разъясняет расхождение между усечённым исходным фрагментом и засвидетельствованным полным чтением стиха.
lexical_decisions:
- source_word: ዘርአ፡ ለፍቅር
  choice: потомство Возлюбленного
  rationale: Передаёт «семя/потомство Возлюбленного» естественным современным русским языком, сохраняя титульное употребление определения.
- source_word: እምከ
  choice: твоя мать
  rationale: Явно сохраняет названного в эфиопском тексте субъекта; его нельзя опускать или заменять причинным союзом.
- source_word: በአማን
  choice: поистине
  rationale: Сохраняет значение истинности и усиление повторного глагола называния, не подменяя его значением «правильно».
- source_word: አጸቶ
  choice: присоединён
  rationale: Сохраняет словесную связь имени Левий с присоединением, существенную для контекста благословения.
- source_word: ሱታፌ
  choice: сопричастником
  rationale: Передаёт участие и общность со всеми сыновьями Иакова лучше, чем бытовое «товарищ»; при этом не вводит специального конфессионального смысла.
- source_word: ማእዳ
  choice: трапеза
  rationale: В данном сакрально-семейном контексте «трапеза» естественно обозначает и стол, и пищу/участие в ней.
- source_word: ትውልድ
  choice: поколений
  rationale: Восстанавливает подтверждённое продолжение полного текста стиха, отсутствующее в усечённом фрагменте поля source.
theological_decisions:
- issue: Связь Левия с Господом
  choice: Ты будешь присоединён к Господу
  alternative: Ты прилепишься к Господу
  rationale: Формулировка сохраняет пассивность и этимологический мотив «присоединения», не усиливая его до более личного или конфессионально нагруженного «прилепления».
- issue: Чья трапеза имеется в виду
  choice: Его трапеза будет твоей
  alternative: Трапеза будет твоей
  rationale: Местоимение соотносится с ближайшим референтом — Господом — и соответствует проверенному английскому консультационному слою, хотя эфиопская форма в данном фрагменте не выражает притяжательность явно; неоднозначность отмечена сноской.
- issue: Последняя полнота трапезы
  choice: для всех поколений
  alternative: для всех
  rationale: Следует полному тексту стиха, содержащему «поколения», и не ограничивает выражение только современниками Левия.
translation_notes:
  register: Современный литературный русский с достоинством библейского благословения. Синтаксис сделан ясным для обычного читателя; сохранены повтор называния, этимологический мотив присоединения Левия и образ трапезы. Заглавная буква в «Возлюбленного» отражает титульное употребление, не уточняя сверх источника личность обозначаемого.
