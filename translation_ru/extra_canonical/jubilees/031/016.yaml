  source_fidelity: 'Перевод верно сохраняет мать как субъект называния, усилительное «поистине», связь имени Левий с присоединением к Господу, образ стола/трапезы и полное чтение «для всех поколений». Однако «сопричастником всех сыновей Иакова» неточно передаёт значение «спутник/товарищ, компаньон»: такая конструкция по-русски скорее означает причастность к самим сыновьям или их действиям.'
  naturalness: Текст в целом литературный и ясный. «Спутником всех сыновей Иакова» естественнее и точнее, чем «сопричастником всех сыновей Иакова». В сноске a оборот «нарекла тебе имя» не является нормативным современным русским употреблением; лучше «дала тебе имя» или «нарекла тебя».
  terminology: «Возлюбленный», «Господь», «Левий», «Иаков» и «трапеза» допустимы в возвышенном библейском регистре. «Спутник» передаёт ሱታፌ без привнесения конфессиональной терминологии.
