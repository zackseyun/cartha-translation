- from: чтобы они благословляли всё потомство Возлюбленного. Твоя мать назвала тебя Левием, и поистине так она тебя и назвала.[a] Ты будешь присоединён к Господу и станешь сопричастником всех сыновей Иакова. Его трапеза будет твоей, и ты и твои сыновья будете есть от неё. И твоя трапеза будет изобильна для всех поколений.[b]
  to: чтобы они благословляли всё потомство Возлюбленного. Твоя мать назвала тебя Левием, и поистине так она тебя и назвала.[a] Ты будешь присоединён к Господу и будешь спутником всех сыновей Иакова. Его трапеза будет твоей, и ты и твои сыновья будете есть от неё. И твоя трапеза будет изобильна для всех поколений.[b]
