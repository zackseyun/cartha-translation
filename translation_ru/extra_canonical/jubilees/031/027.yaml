  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: ru
  text: 'Он помолился, чтобы тот, придя, посадил его на осла.[a] Исаак сказал своему сыну Иакову: «Я не могу пойти с тобой, потому что состарился и не в силах перенести тяготы пути. Ступай, сын мой, с миром: сегодня мне сто шестьдесят пять лет. Я уже не могу путешествовать. Посади свою мать на животное и отправляйся».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Он помолился, и, когда тот пришёл, он посадил его на осла». Форма глагола допускает значение ожидаемого или целевого действия, а местоимения проясняются предшествующим контекстом.'
    reason: Сохранить синтаксическую и референциальную неоднозначность эфиопского текста.
  - marker: b
    text: 'Или, при ином понимании последнего глагола: «Посади свою мать на животное и отпусти её».'
    reason: Отразить традиционный вариант перевода, хотя грамматическая форма скорее указывает на обращённое к Иакову «отправляйся».
lexical_decisions:
- source_word: ጸለየ
  choice: помолился
  rationale: Глагол означает молитву; перевод «дал обет» здесь лексически не обоснован.
- source_word: አድግ
  choice: осёл
  rationale: Конкретное значение — «осёл», поэтому в первом предложении сохранено название животного.
- source_word: በፍኖት
  choice: дорогу
  rationale: В сочетании с «вынести» обозначает тяготы пути; «вынести дорогу» звучит естественно и сохраняет образ исходного текста.
- source_word: ጻዐና
  choice: посади … на вьючное животное
  rationale: Буквально связано с погрузкой или помещением ноши на животное; применительно к матери естественный русский эквивалент — «посади».
- source_word: ወትሖር
  choice: и отправляйся
  rationale: 'Форма обращена к Иакову во 2-м лице мужского рода единственного числа: идти должен он; перевод «пусть она отправляется» грамматически менее вероятен.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Устаревшее «иди» заменено контекстно уместным «ступай», возраст передан словами, а не цифрами. Фрагментарное начало стиха не дополнено сведениями, отсутствующими в источнике.
