  text: and all the nations shall be shaken, and all the peoples shall be shaken. In you shall be the help of Jacob,
translation:
  language: ru
  text: И придут в смятение все народы, и всякий народ придёт в смятение. В тебе будет помощь Иакову.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወኩ
  choice: придут в смятение / придёт в смятение
  rationale: Форма передаёт сильное потрясение или смятение; такой перевод сохраняет образ внутреннего и общественного волнения, не уточняя его причину.
- source_word: አሕዛብ / ሕዝብ
  choice: народы / народ
  rationale: Сохранено различие между множественным አሕዛብ и собирательно-единичным ሕዝብ, а также намеренный параллелизм исходного текста.
- source_word: ረድኤተ
  choice: помощь
  rationale: Прямое и естественное соответствие значению «помощь, поддержка».
- source_word: ብከ
  choice: в тебе
  rationale: 'Сохранена форма обращения и буквальная пространственно-инструментальная неоднозначность выражения: помощь связана с адресатом, но способ этой связи не конкретизируется.'
theological_decisions:
- issue: Характер помощи Иакову
  choice: В тебе будет помощь Иакову
  alternative: Через тебя придёт помощь Иакову
  rationale: Исходное ብከ буквально допускает «в тебе» и контекстуально может пониматься как «через тебя»; основной текст сохраняет более формальную и богословски открытую формулировку.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Повтор исходного текста сохранён, а не сглажен, поскольку он служит смысловому усилению.
