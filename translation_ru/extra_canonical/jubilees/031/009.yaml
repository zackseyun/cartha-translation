  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: ru
  text: 'Он обнял Иакова, своего сына, за шею[a] и плакал, припав к его шее. Пелена спала с глаз Исаака, и он увидел двух сыновей Иакова — Левия и Иуду — и спросил: «Это твои сыновья, сын мой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шею Иакова, своего сына»; глагол «обнял» подразумевается из контекста.'
    reason: Начало стиха в геэз содержит существительное «шея» без выраженного глагола; примечание сохраняет формальную особенность источника и объясняет естественную русскую передачу.
lexical_decisions:
- source_word: ክሳደ፡ ያዕቆብ፡ ወልዱ፡
  choice: обнял Иакова, своего сына, за шею
  rationale: Начальный оборот буквально содержит «шею Иакова, его сына», а глагол объятия подразумевается на границе стиха. Русское «обнял … за шею» сохраняет явное упоминание шеи и естественно передаёт действие.
- source_word: ወበከየ፡ ዲበ፡ ክሳዱ፡
  choice: и плакал у него на шее
  rationale: Сохранены повторное упоминание шеи и образ плача при объятии; местоимение устраняет неестественное повторение имени.
- source_word: ወጽላሌ፡ ኀለፈ፡ እምአዕይንተ፡ ይስሐቅ፡
  choice: Пелена сошла с глаз Исаака
  rationale: ጽላሌ обозначает затемнение или помутнение зрения; «пелена» — ясный и образный русский эквивалент, не уточняющий медицинскую причину.
- source_word: ክልኤሆሙ፡ ውሉደ፡ ለያዕቆብ፡ ሌዊሃ፡ ወይሁዳሃ፡
  choice: двух сыновей Иакова — Левия и Иуду
  rationale: Имена оформлены в соответствии с современной русской литературной нормой; тире естественно вводит приложение.
- source_word: ውሉድከሁ፡ እሉ፡ ወልድየ፡
  choice: Это твои сыновья, сын мой?
  rationale: Вопросительная форма следует контексту и консультационному английскому слою; обращение сохранено без добавочного толкования.
