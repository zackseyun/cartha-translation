  text: and let me see him before I die.” And Jacob went to his father Isaac and to his mother Rebekah, to the house of his father Abraham. And he took with him two of his sons, Levi and Judah.
translation:
  language: ru
  text: «…и дай мне увидеть его, прежде чем я умру». И пошёл Иаков к своему отцу Исааку и к своей матери Ревекке, в дом своего отца Авраама. И взял он с собой двух своих сыновей — Левия и Иуду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእርአዮ፡ ዘእንበለ፡ እሙት
  choice: «…и я увижу его прежде, чем умру»
  rationale: Передаёт желание говорящего увидеть его до своей смерти; начальное многоточие показывает, что стих продолжает прямую речь предыдущего контекста.
- source_word: ውስተ፡ ቤቱ፡ ለአቡሁ፡ አብርሃም
  choice: в дом своего отца Авраама
  rationale: Сохраняет буквальную родственную формулировку источника и направление движения; не заменяет «отца» толкованием «деда».
- source_word: ወክልኤተ፡ እምውሉዱ፡ ነሥአ፡ ምስሌሁ
  choice: И взял он с собой двух своих сыновей
  rationale: Естественно и точно передаёт число, родство и совместное следование.
- source_word: ሌዊሃ፡ ወይሁዳሃ
  choice: Левия и Иуду
  rationale: Употреблены традиционные русские библейские формы имён в требуемом винительном падеже.
theological_decisions:
- issue: Обозначение Авраама как отца Иакова
  choice: своего отца Авраама
  alternative: своего деда Авраама / отца его отца, Авраама
  rationale: Источник формально говорит «его отца Авраама». Перевод сохраняет древнее широкое употребление родственного термина и не устраняет потенциальное напряжение поясняющим толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка возвышенный, но понятный; повтор «к своему отцу… к своей матери… в дом своего отца» сохранён как особенность источника.
