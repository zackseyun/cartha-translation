  text: And on the new moon of the month Jacob spoke to all the people of his house, saying, “Purify yourselves and change your garments, and let us rise and go up to Bethel, where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me back into this land in peace. And put away
translation:
  language: ru
  text: 'В новолуние[a] Иаков сказал всем домашним: «Очиститесь и смените одежды; поднимемся и пойдём в Вефиль, где я молился Ему в тот день, когда бежал от лица Исава, брата моего. Он был со мной и возвратил меня в эту землю с миром. И удалите[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при восходе (появлении) месяца»; то есть в новолуние, в первый день месяца. Не «в первом месяце».'
    reason: Поясняет календарный оборот и исключает неверное понимание «в первом месяце».
  - marker: b
    text: Повеление продолжается в следующем стихе, где названо то, что следует удалить.
    reason: Стих в представленном источнике заканчивается переходным глаголом без дополнения; прямая речь продолжается.
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: при появлении нового месяца
  rationale: Оборот обозначает новолуние, то есть наступление нового месяца, а не «первый месяц».
- source_word: ንጽሑ፡
  choice: очиститесь
  rationale: Императив множественного числа передаёт призыв к очищению; религиозный контекст сохранён без добавочного уточнения о ритуале.
- source_word: ወወልጡ፡ አልባሲክሙ፡
  choice: и смените одежды
  rationale: Естественная русская передача буквального «перемените ваши одежды».
- source_word: ንዕርግ፡ ቤቴል፡
  choice: пойдём в Вефиль
  rationale: Глагол буквально означает восхождение, но в данном географическом обороте по-русски естественно «пойдём»; направление выражено предлогом «в».
- source_word: እምገጸ፡ ዔሳው፡
  choice: от лица Исава
  rationale: Сохранён семитский образ исходного текста, понятный в dignified biblical register.
- source_word: ወሜጠኒ፡
  choice: и возвратил меня
  rationale: Глагол выражает возвращение говорящего, а не просто его перемещение или доставление.
- source_word: ወአስስሉ፡
  choice: И удалите
  rationale: Это императив множественного числа, продолжающий прямую речь Иакова; объект находится в следующем стихе, поэтому фраза намеренно оставлена незавершённой.
theological_decisions:
- issue: Референт местоимения «Ему / Он»
  choice: Сохранить местоимения без добавления имени Бога
  alternative: Заменить на «Богу / Бог»
  rationale: Исходный текст использует местоименные формы; явное называние Бога сняло бы формальную особенность и добавило отсутствующее существительное.
- issue: Характер очищения
  choice: «Очиститесь» без определения
  alternative: «Обрядово очиститесь»
  rationale: Текст не уточняет вид очищения, поэтому возможная ритуальная окраска не превращена в явное толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены «от лица» и инверсия «брата моего» как уместные элементы высокого регистра; синтаксис при этом сделан ясным для современного читателя. Закрывающая кавычка поставлена после многоточия лишь как редакционное завершение цитаты в пределах отдельно публикуемого стиха; смысловая прямая речь продолжается в следующем стихе.
