revisions:
- from: 'И при появлении нового месяца[a] Иаков сказал всем людям своего дома: «Очиститесь и смените одежды; встанем и пойдём в Вефиль, где я молился Ему в тот день, когда бежал от лица Исава, брата моего. Он был со мной и возвратил меня в эту землю с миром. И удалите[b]…»'
  to: 'В новолуние[a] Иаков сказал всем домашним: «Очиститесь и смените одежды; поднимемся и пойдём в Вефиль, где я молился Ему в тот день, когда бежал от лица Исава, брата моего. Он был со мной и возвратил меня в эту землю с миром. И удалите[b]'
  rationale: Заменён тяжеловесный календарный оборот на точное «в новолуние», восстановлен компонент «поднимемся» и убраны многоточие с искусственным закрытием цитаты. Сохранены неопределённость местоименного референта, «с миром» и незавершённое повеление, поскольку это следует исходному тексту и его продолжению в следующем стихе.
