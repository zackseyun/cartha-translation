  naturalness: «В новолуние» и «всем домашним» звучат естественно в современном литературном русском. Формула «поднимемся и пойдём» сохраняет библейский регистр, не становясь архаичной.
  terminology: «Вефиль», «Исав», «очиститесь» и местоименная отсылка к Богу переданы приемлемо. «С миром» сохранено как традиционная, но понятная передача обстоятельства благополучного возвращения.
