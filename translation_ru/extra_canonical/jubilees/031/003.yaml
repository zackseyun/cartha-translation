  yaml_path: translation/extra_canonical/jubilees/031/003.yaml
  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: ru
  text: В новолуние седьмого месяца[a] он поднялся в Вефиль. На том месте, где он ночевал, он построил жертвенник, поставил там столб и послал к своему отцу Исааку, чтобы тот пришёл к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в первый день седьмого месяца».'
    reason: Новолуние в древнем календарном употреблении обозначает начало, то есть первый день, месяца.
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: в новолуние седьмого месяца
  rationale: Сочетание обозначает новолуние, то есть начало седьмого месяца; в тексте нет слова «год».
- source_word: ዐርገ
  choice: поднялся
  rationale: Сохранено пространственное значение глагола восхождения; в данном контексте оно естественно сочетается с направлением в Вефиль.
- source_word: ኖመ
  choice: ночевал
  rationale: Глагол означает провести ночь или остановиться на ночлег; «ночевал» точно и естественно передаёт значение в контексте места.
- source_word: ሐውልተ
  choice: столб
  rationale: Слово обозначает стоящий памятный объект — столб или стелу; нейтральное «столб» не добавляет отсутствующего в тексте уточнения о материале или назначении.
- source_word: ፈነወ፡ ኀበ፡ አቡሁ፡ ይስሐቅ
  choice: послал к своему отцу Исааку
  rationale: Передано буквальное направление посланца или вести к отцу; последующая целевая конструкция сообщает, зачем он послал.
