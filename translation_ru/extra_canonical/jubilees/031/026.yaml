  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: ru
  text: А утром Иаков рассказал своему отцу Исааку о молитве, с которой он обратился к Господу[a], о видении, которое он видел, о том, как он построил жертвенник, и о том, что всё было готово для принесения жертвы пред Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте употреблены слова со значением «молитва» и «молиться». Однако ближайший контекст — Вефиль, жертвенник, жертва и предостережение Исаака не медлить — позволяет понимать здесь молитву, связанную с обетом.
    reason: alternative_reading
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: о молитве, с которой он обратился
  rationale: Буквально сочетание означает «молитву, которой он молился». Русская формулировка избегает неестественного повтора, сохраняя молитвенную лексику источника.
- source_word: ወሬአየ፡ ዘርእየ
  choice: о видении, которое он видел
  rationale: Передаёт существительное «видение» и однокоренной глагол источника; допустимый в данном торжественно-повествовательном регистре оборот.
- source_word: ኀነጸ፡ ምሥዋዐ
  choice: построил жертвенник
  rationale: Прямое и естественное соответствие словам «построил» и «жертвенник».
- source_word: ኵሉ፡ ድልው
  choice: всё было готово
  rationale: Сохраняет общее утверждение источника о полной готовности.
- source_word: ለመሥዋዕት፡ ለገቢር፡ ቅድመ፡ እግዚአብሔር
  choice: для принесения жертвы пред Господом
  rationale: Естественно выражает назначение приготовления и сохраняет культовую формулировку «пред Господом».
theological_decisions:
- issue: Молитва или обет
  choice: молитва
  alternative: обет
  rationale: Геэзский текст прямо употребляет молитвенную лексику ጸሎተ/ዘጸለየ. Контекст может указывать на обет, однако перевод не должен подменять явное слово источника контекстуальным истолкованием; возможность такого понимания отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Пред Господом» сохранено как привычная и ясная культовая формула; синтаксис упрощён без устранения смысловой последовательности оригинала.
