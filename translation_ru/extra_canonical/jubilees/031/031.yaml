  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: ru
  text: 'Вефиль. Иаков вспомнил молитву, которой его отец благословил Левия и Иуду, обрадовался и благословил Бога своих отцов — Авраама и Исаака. Он сказал: «Теперь я знаю, что у меня и у моих детей есть вечная надежда пред Богом всего сущего». Так было установлено об этих двоих, и это вознесётся для них[a] как вечное свидетельство на небесных скрижалях — в соответствии с тем, как Исаак благословил их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вознесётся для них». В контексте небесных скрижалей выражение может подразумевать внесение в небесную запись.'
    reason: Сохраняет буквальный образ геэзского глагола ያዐርጉ («взойти, вознестись»), не исключая его вероятного контекстуального смысла.
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም
  choice: вечная надежда
  rationale: Передаёт прямое значение сочетания «надежда навеки / вечная надежда» без богословского уточнения её содержания.
- source_word: በቅድመ፡ አምላከ፡ ኵሉ
  choice: пред Богом всего сущего
  rationale: Естественная русская передача буквального «перед Богом всего»; сохраняет широкий и несколько неоднозначный объём слова «всего».
- source_word: ሥሩዕ፡ በእንተ፡ ክልኤሆሙ
  choice: было установлено об этих двоих
  rationale: Сохраняет безличную формулировку и отнесение установления к Левию и Иуде.
- source_word: በስምዕ፡ ዘለዓለም
  choice: как вечное свидетельство
  rationale: В представленном тексте имеются слова «свидетельство» и «вечное»; слово «праведное» в данной строке геэзского источника отсутствует, поэтому оно не добавлено.
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Традиционное и понятное обозначение небесных табличек; соответствует возвышенному регистру книги.
theological_decisions:
- issue: Субъект вечной надежды
  choice: «у меня и у моих детей есть вечная надежда»
  alternative: «я и мои дети имеем вечную надежду»
  rationale: Сохраняет распространение надежды на Иакова и его потомков, не уточняя природу или условия этой надежды.
- issue: Дополнение «праведное» при свидетельстве
  choice: не добавлять «праведное»
  alternative: «вечное, праведное свидетельство»
  rationale: Хотя консультационный английский слой и история правок содержат это определение, в предоставленной геэзской строке после በስምዕ непосредственно следует ዘለዓለም; чтение «праведное» данным исходным текстом не подтверждается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («пред», «скрижали»). Начальные слова восстановлены по аудированному английскому консультационному слою, поскольку предоставленная позиционно выровненная геэзская строка начинается в середине фразы со слов «и Иуду», а затем продолжается словами «и обрадовался…». Все маркеры примечаний присутствуют в основном тексте.
