  text: '"Truly, they are my children." And they came near to him, and he turned and kissed them and embraced them.'
translation:
  language: ru
  text: «Воистину, они мои дети». И они подошли к нему, а он повернулся к ним, поцеловал и обнял их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: Воистину
  rationale: Передаёт усилительное утверждение «истинно, действительно» в dignified, но понятном современном русском регистре.
- source_word: ውሉድየ
  choice: мои дети
  rationale: Форма обозначает «мои дети»; нейтральное родовое значение сохраняется без необоснованного уточнения пола.
- source_word: ወቀርቡ፡ ኀቤሁ
  choice: И они подошли к нему
  rationale: Естественно передаёт буквальное движение «приблизились к нему».
- source_word: ወተመይጠ
  choice: а он повернулся к ним
  rationale: Глагол передан как «повернулся»; «к ним» делает направление действия ясным по контексту, не меняя его содержания.
- source_word: ወሰዐሞሙ፡ ወሐቀፎሙ
  choice: поцеловал и обнял их
  rationale: Сохраняет последовательность двух проявлений привязанности и общий объект обоих глаголов.
