  to: '«И да будет проклят всякий народ, который проклинает тебя». И Иуде он сказал: «Да даст тебе Господь силу и крепость, чтобы ты попрал всех ненавидящих тебя. Будь правителем над сынами Иакова — ты и один из твоих сыновей. Пусть твоё имя и имя твоих сыновей распространятся и пройдут по всей земле и её областям. Тогда народы устрашатся пред лицом твоим»,'
