  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: ru
  text: '«И да будет проклят всякий народ, который проклинает тебя». И Иуде он сказал: «Да даст тебе Господь силу и крепость, чтобы ты попрал всех ненавидящих тебя. Будь правителем над сынами Иакова — ты и один из твоих сыновей. Пусть твоё имя и имя твоих сыновей распространятся и пройдут по всей земле и её областям. Тогда народы устрашатся пред лицом твоим»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  choice: народ
  rationale: Обозначает народ или группу людей; «народ» здесь точнее и естественнее, чем «племя» или «нация».
- source_word: ኀይለ፡ ወጽንዐ
  choice: силу и крепость
  rationale: Сохраняет парное выражение источника и различие между силой и стойкостью/мощью.
- source_word: ትኪዶሙ
  choice: ты попрал
  rationale: Передаёт образ наступания на врагов и их покорения, не ослабляя военную образность.
- source_word: መኰንነ
  choice: правителем
  rationale: Естественно передаёт значение властителя или начальствующего в контексте господства над сынами Иакова.
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: распространятся и пройдут
  rationale: Сохраняет два координированных глагола движения; «распространятся» естественно выражает хождение имени повсюду, а «пройдут» удерживает пространственный образ.
- source_word: አህጉር
  choice: областям
  rationale: Передаёт земли или регионы как части всей земли без неоправданного уточнения политических границ.
- source_word: እምቅድመ፡ ገጽከ
  choice: пред лицом твоим
  rationale: Сохраняет буквальный семитский образ присутствия перед лицом адресата в достойном библейском регистре.
theological_decisions:
- issue: Кто должен править над сынами Иакова
  choice: «ты и один из твоих сыновей»
  alternative: «ты и один из твоего потомства»
  rationale: Сохранена конкретная формулировка источника без отождествления сына с определённой будущей фигурой.
- issue: Значение распространения имени Иуды и его сыновей
  choice: Оставлено как распространение имени по всей земле
  alternative: Истолковать как славу, власть или мессианское царство
  rationale: Перевод сохраняет метафору и её богословскую открытость, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Архаические формы ограничены устойчивыми оборотами «пред лицом твоим»; синтаксис остаётся понятным современному читателю.
