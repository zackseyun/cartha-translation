base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: ru
  text: и святость. И да возвеличит Он их во все века. Они будут князьями, судьями и вождями для всего потомства сыновей Иакова. Они будут праведно возвещать слово Господа и праведно вершить все Его суды; они возвестят Иакову Его пути, а Израилю — Его стези[a]. Благословение Господа будет в их устах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «Его стези», текстуально и лексически не вполне ясно; возможно также понимание «Его постановления» или «Его наставление» для Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለቅዱስ
  choice: и святость
  rationale: Сохранён фрагментарный переход из предыдущего контекста, отражённый как в эфиопском тексте издания, так и в консультационном английском слое; добавление отсутствующего сказуемого было бы домысливанием.
- source_word: ውስተ፡ ኵሉ፡ ዓለማት
  choice: во все века
  rationale: Естественно передаёт временное значение «на протяжении всех веков/эпох», не сводя выражение к пространственному «во всех мирах».
- source_word: መኳንንተ፡ ወመሳፍንተ፡ ወመላእክተ
  choice: князьями, судьями и вождями
  rationale: Передана трёхчастная последовательность руководящих ролей. В данном человеческом и общественном контексте последнее слово понято как обозначение начальствующих, а не небесных ангелов.
- source_word: ቃሎ፡ ለእግዚአብሔር
  choice: слово Господа
  rationale: Формально и богословски нейтрально передаёт конструкцию принадлежности.
- source_word: በጽድቅ
  choice: праведно
  rationale: Наречная форма естественна по-русски и сохраняет повтор в обеих параллельных частях.
- source_word: ወአስርኖ፡ ለእስራኤል
  choice: а Израилю — Его стези
  rationale: Сохранён параллелизм с «Его путями», при этом текстуальная и лексическая неуверенность отмечена в сноске.
- source_word: በረከተ፡ ለእግዚ
  choice: Благословение Господа будет в их устах
  rationale: Фраза завершена по засвидетельствованному консультационному тексту без добавления идеи «будет дано», которой нет в источнике.
theological_decisions:
- issue: Значение መላእክተ в перечне человеческих руководителей
  choice: вожди
  alternative: ангелы / посланники
  rationale: Контекст говорит о служении потомству сыновей Иакова и ставит слово рядом с князьями и судьями; поэтому должностное значение лучше согласуется с синтаксическим рядом, не вводя небесных существ.
- issue: Трудная пара «пути Иакову / стези Израилю»
  choice: сохранить образ путей и стезей
  alternative: постановления / наставление Израилю
  rationale: Так сохраняются поэтический параллелизм и подлинная неоднозначность; более сильное нормативное значение не внесено в основной текст без достаточной уверенности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены анафорические повторы и параллелизм; устаревшие синтаксические обороты сведены к минимуму. Начальное «и святость» оставлено фрагментарным, поскольку стих начинается продолжением предшествующей фразы.
