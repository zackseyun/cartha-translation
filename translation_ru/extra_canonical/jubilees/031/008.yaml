  text: And Jacob went in to Isaac his father, into the room where he was lying, and his two children were with him. And he took the hand of his father, and he bent down and kissed him. And Isaac clung to
translation:
  language: ru
  text: На земле. И вошёл Иаков к своему отцу Исааку, в комнату, где тот лежал; с Иаковом были двое его сыновей. Он взял отца за руку, наклонился и поцеловал его. Исаак прижался к…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный текст на языке геэз обрывается после предлога «к/в», поэтому окончание предложения не восстановлено.
    reason: source_truncation
lexical_decisions:
- source_word: በዲበ፡ ምድር
  choice: На земле
  rationale: Формально передаёт сохранившуюся начальную фразу «на/над землёй». Она выглядит как окончание предшествующего контекста, но присутствует в предоставленном исходном тексте и потому не опущена.
- source_word: ውስተ፡ ጽርሕ
  choice: в комнату
  rationale: ጽርሕ обозначает внутреннее помещение или покои; современное «комната» здесь ясно и естественно.
- source_word: ኀበ፡ ይስክብ፡ ህየ
  choice: где тот лежал
  rationale: Геэзская конструкция буквально содержит и относительное «где», и указательное «там»; в русском повтор «где… там» был бы неестественным. Местоимение «тот» однозначно указывает на Исаака.
- source_word: ወክልኤቱ፡ ደቂቁ፡ ምስሌሁ
  choice: с Иаковом были двое его сыновей
  rationale: Передаёт число «двое» и принадлежность сыновей Иакову, устраняя возможную русскую двусмысленность местоимения без добавления нового содержания.
- source_word: አንዘ፡ እዴ፡ አቡሁ
  choice: Он взял отца за руку
  rationale: Контекстуально естественная передача оборота с «рукой отца»; избегает неверного смысла «протянул руку отца».
- source_word: ወደነነ፡ ሰዐሞ
  choice: наклонился и поцеловал его
  rationale: 'Последовательно передаёт действия Иакова: он склонился и поцеловал отца.'
- source_word: ወተሰቅለ፡ ይስሐቅ፡ ውስተ
  choice: Исаак прижался к…
  rationale: Передаёт начавшееся действие сближения/объятия, не восполняя отсутствующий после предлога объект.
