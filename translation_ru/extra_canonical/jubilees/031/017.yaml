  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: ru
  text: Да будет твой стол полон, и да не оскудеет твоя пища во все века. И все ненавидящие тебя падут перед тобой, и все твои противники будут искоренены и погибнут. И тот, кто благословляет тебя,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማዕድከ፡ ምልእተ፡
  choice: твой стол полон
  rationale: Сохраняет конкретный образ полной трапезы и форму благословения; по-русски звучит ясно и достойно.
- source_word: ወኢይሕፀፅ፡ እክልከ፡
  choice: и да не оскудеет твоя пища
  rationale: Передаёт отрицательное пожелание о непрекращающемся достатке, не сужая значение до отдельного вида пищи.
- source_word: ለኵሉ፡ ዓለማት።
  choice: во все века
  rationale: Естественная библейская формула для множественного обозначения грядущих веков.
- source_word: ቅድሜከ፡ ይደቁ፡
  choice: падут пред тобой
  rationale: Сохраняет пространственный образ и пророческую форму исходного благословения.
- source_word: ይሠረዉ፡ ወይትሐጐሉ፡
  choice: будут искоренены и погибнут
  rationale: Передаёт оба последовательных глагола, включая метафору удаления с корнем.
- source_word: ወዘይባርከከ፡
  choice: А тот, кто благословляет тебя,
  rationale: Это незавершённая именная группа, чей предикат следует в следующем стихе; перевод не добавляет отсутствующего здесь сказуемого.
theological_decisions:
- issue: Незавершённая формула благословения в конце стиха
  choice: А тот, кто благословляет тебя,
  alternative: И да будет благословен тот, кто благословляет тебя,
  rationale: В данном стихе исходный текст содержит только субъектную конструкцию «тот, кто благословляет тебя»; сказуемое находится в 31:18. Сохранение синтаксического переноса соблюдает границу текста и не дублирует предикат.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены параллелизм, формулы пожелания и незавершённость последней фразы на границе стихов.
