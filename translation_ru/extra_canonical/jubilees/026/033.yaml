  text: 'И Исав возвысил голос и заплакал. И Исаак ответил ему: «Вот, от росы земли…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Текст предоставленного отрывка обрывается на словах «росы земли». Предлог እም может обозначать как источник («от», «из»), так и удаление («вдали от»).
    reason: Сохраняет незавершённость исходного отрывка и его лексико-синтаксическую неоднозначность, не закрепляя одно из спорных толкований в основном тексте.
lexical_decisions:
- source_word: አንሥአ፡ ዔሳው፡ ቃሎ
  choice: Исав возвысил голос
  rationale: Буквально передаёт идиому «поднял свой голос» естественным и dignified русским выражением.
- source_word: ወበከየ
  choice: и заплакал
  rationale: Прямое соответствие глаголу «плакать»; совершенный вид естественно передаёт наступившее действие.
- source_word: ወአውሥአ፡ ይስሐቅ፡ ወይቤሎ
  choice: И Исаак ответил ему
  rationale: В исходном тексте сочетаются формулы «ответил» и «сказал ему»; по-русски их смысл без потери естественно выражается одной формулой.
- source_word: ናሁ
  choice: Вот
  rationale: Сохраняет указательно-вводное значение частицы.
- source_word: እምጠለ፡ ምድር
  choice: вдали от росы земной
  rationale: እም допускает значение удаления/отделения «от, вдали от»; контекст благословения Исава поддерживает такое чтение, при этом необычный образ исходника сохранён.
theological_decisions:
- issue: Значение предлога እም перед «росой земной»
  choice: вдали от росы земной
  alternative: от росы земной / из росы земной
  rationale: Выбрано отделительное значение, соответствующее контексту параллельного места Быт 27:39 и последней текстологической правке; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Незавершённость цитаты сохранена многоточием; синтаксически избыточная для русского языка формула «ответил и сказал ему» сокращена без смысловой потери.
