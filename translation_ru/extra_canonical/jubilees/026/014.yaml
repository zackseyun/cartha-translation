  text: And Jacob said, “Because your God brought it before me.”
translation:
  language: ru
  text: 'Иаков сказал: «Потому что твой Бог послал мне навстречу добычу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ፡ ያዕቆብ
  choice: Иаков ответил
  rationale: Формально выражение означает «И сказал Иаков», но в диалогическом контексте современное «ответил» естественно передаёт функцию реплики.
- source_word: ዘ
  choice: Потому что
  rationale: Сохранено причинное значение, соответствующее ответу Иакова на предшествующий вопрос.
- source_word: አርጐዐኒ
  choice: привёл её ко мне
  rationale: Каузативная форма передаёт действие, благодаря которому подразумеваемая добыча оказалась перед Иаковом; «привёл … ко мне» естественно сохраняет пространственный образ источника.
- source_word: አምላክከ
  choice: твой Бог
  rationale: Сохранено прямое обращение и притяжательная форма оригинала.
- source_word: ቅድሜየ
  choice: ко мне
  rationale: Буквально — «передо мной»; в сочетании с глаголом движения по-русски естественнее «ко мне», без изменения смысла.
theological_decisions:
- issue: Божественное содействие в обретении добычи
  choice: 'Прямо назвать Бога действующим лицом: «твой Бог привёл»'
  alternative: «Мне посчастливилось быстро найти её»
  rationale: Оригинал прямо приписывает произошедшее действию Бога; нейтрализация этого утверждения устранила бы богословское напряжение рассказа.
translation_notes:
  register: Современный литературный русский язык; реплика краткая и разговорно естественная, но сохраняет достоинство повествовательного стиля. Женское местоимение предполагает упомянутую в ближайшем контексте добычу.
