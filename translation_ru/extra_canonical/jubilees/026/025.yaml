  choice: Иаков вышел от своего отца Исаака
  rationale: Сохраняет исходный порядок отношений и явно передаёт, что Исаак — отец Иакова.
- source_word: текст, продолжающийся за границей предоставленного фрагмента
  choice: он скрылся
  rationale: Фраза восстановлена по указанной в метаданных непрерывной текстовой традиции Charles 1895 и параллельной критической публикации; конечная скобка в отрывке обозначает продолжение текста, а не отсутствие фразы.
theological_decisions:
- issue: Формула проклятия и благословения
  choice: 'Сохранён прямой взаимный параллелизм: проклинающий будет проклят, благословляющий — благословен.'
  alternative: Передать как безличное обещание воздаяния без повторения однокоренных слов.
  rationale: Источник намеренно использует симметричные формулы; их нельзя сглаживать или истолковывать конфессионально.
- issue: Субъект фразы «он скрылся»
  choice: Сохранено местоимение «он», грамматически относящееся к Иакову.
  alternative: 'Уточнить именем: «Иаков скрылся».'
  rationale: Местоимение сохраняет форму засвидетельствованного продолжения и не добавляет отсутствующего в формулировке уточнения, хотя ближайший субъект делает референцию достаточно ясной.
