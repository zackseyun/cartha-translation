lexical_decisions:
- source_word: ትሰምዕ
  choice: слушала
  rationale: Передаёт значение несовершенного действия «слышала/слушала»; в данном контексте естественное русское «слушала» показывает, что Ревекка слышала разговор.
- source_word: እንዘ፡ ይነግር
  choice: как … говорил
  rationale: Оборот с እንዘ передаёт одновременность действий; конструкция «слушала, как … говорил» естественна по-русски и сохраняет аспект длительности.
- source_word: ለዔሳው
  choice: с Исавом
  rationale: Глагол речи с дательным показателем буквально допускает «Исаву», однако в русском при обозначении разговора естественно «говорил с Исавом»; контекст не требует уточнять направленность речи.
