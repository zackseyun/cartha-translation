- source_word: ቀርበ
  choice: подошёл
  rationale: Передаёт приближение Иакова к Исааку естественным современным русским глаголом.
- source_word: ገሰሶ
  choice: ощупал его
  rationale: Глагол обозначает проверку посредством прикосновения; «ощупал» точно соответствует контексту узнавания Иакова Исааком.
- source_word: ወይቤ
  choice: и сказал
  rationale: Обычная повествовательная формула введения прямой речи; двоеточие показывает, что речь продолжается в следующем стихе.
