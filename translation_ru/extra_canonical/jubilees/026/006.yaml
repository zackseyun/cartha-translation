  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: ru
  text: '«А теперь, сын мой, послушай, что я тебе приказываю: пойди к своему стаду и принеси мне двух хороших молодых козлят. Я приготовлю из них для твоего отца кушанье, какое он любит. Ты отнесёшь его отцу, он поест и благословит тебя перед Господом, прежде чем умрёт, и ты будешь благословен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ወልድየ፡ ቃልየ፡ ዘአነ፡ እኤዝዘከ
  choice: сын мой, послушайся меня и сделай то, что я велю тебе
  rationale: Буквально речь идёт о слушании голоса/слова в том, что мать повелевает; русское «послушайся меня» естественно передаёт требуемое повиновение, а продолжение сохраняет содержание повеления.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: двух хороших молодых козлят
  rationale: Сочетание обозначает двух хороших детёнышей коз; «козлят» точнее и естественнее русского «молодых коз».
- source_word: መብልዐ
  choice: кушанье
  rationale: Слово означает пищу/еду; в контексте специально приготовленного любимого блюда отца «кушанье» звучит естественно и достойно.
- source_word: ይባርከ፡ ቅድመ፡ እግዚአብሔር
  choice: благословит тебя перед Господом
  rationale: 'Сохранена формулировка источника: благословение совершается «перед Господом», без истолкования этой связи.'
theological_decisions:
- issue: Характер благословения перед Господом
  choice: «благословит тебя перед Господом»
  alternative: «благословит тебя в присутствии Господа»
  rationale: Более буквальное «перед Господом» сохраняет возможную юридическую, культовую или пространственную окраску выражения и не сужает его смысл.
- issue: Итоговое состояние адресата
  choice: «и ты будешь благословен»
  alternative: «чтобы ты был благословен»
  rationale: Сохранена последовательность предсказанных событий и самостоятельная итоговая фраза источника, а не только целевое значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на несколько предложений ради ясности, при этом порядок действий и повторное упоминание отца сохранены. Кавычка в конце отражает завершение прямой речи, начавшейся в более широком контексте.
