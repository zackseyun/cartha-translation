  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: ru
  text: И послушался Иаков Ревекки, своей матери, и пошёл, и взял двух хороших, упитанных козлят, и принёс их своей матери. А мать приготовила из них кушанье, какое он любил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐ፡ ... ቃለ
  choice: послушался
  rationale: Сочетание буквально означает «услышал голос», но в данном контексте выражает принятие и исполнение наставления; «послушался» естественно передаёт этот смысл по-русски.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ
  choice: двух ... козлят
  rationale: Форма обозначает двух молодых животных из коз; «козлят» точно и естественно передаёт возраст и вид.
- source_word: ሠናያነ፡ ወስቡሓነ
  choice: хороших, упитанных
  rationale: 'Сохраняются обе характеристики: добротность выбранных животных и их откормленность.'
- source_word: መብልዐ
  choice: кушанье
  rationale: Существительное означает пищу или блюдо; «кушанье» здесь естественно обозначает приготовленное мясное блюдо и сохраняет достойный повествовательный регистр.
- source_word: ዘከመ፡ ያፈቅር
  choice: какое он любил
  rationale: Буквально и без уточнения передаёт относительную конструкцию; местоимение относится к тому, для кого готовилось кушанье.
