translation:
  language: ru
  text: Будет твоим жилищем; и — от небесной росы свыше. Ты будешь жить своим мечом и служить своему брату. Но когда ты восстанешь[a] и снимешь ярмо со своей шеи, тогда совершишь грех во всей полноте — к смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол допускает также оттенок: «когда ты возвысишься» или «станешь сильным». В данном контексте выбран смысл сопротивления: «восстанешь».'
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально: «совершишь полный (целый) грех к смерти». Этот трудный оборот заметно отличается от параллели в Быт. 27:40 и сохранён без согласования с ней.'
    reason: textual_variant
lexical_decisions:
- source_word: በመጥባኅትከ፡ ትሐዩ
  choice: ты будешь жить своим мечом
  rationale: Сохраняется инструментальное значение предлога и традиционный образ жизни посредством меча без его пояснительного сужения.
- source_word: አበይከ
  choice: ты восстанешь
  rationale: Глагол обращён ко второму лицу единственного числа и здесь передаёт сопротивление или мятеж; перевод не вводит отсутствующее в тексте слово «отец».
- source_word: ወአስሰልከ፡ አርዑተ፡ እምክሳድከ
  choice: и снимешь ярмо со своей шеи
  rationale: Оба действия имеют субъектом адресата; «ярмо» не снабжается отсутствующим притяжательным местоимением.
- source_word: ትኤብስ፡ አበሳ፡ ኵሎ፡ ለሞት
  choice: совершишь грех во всей полноте — к смерти
  rationale: Единственное число «грех» и определение со значением целостности переданы без превращения выражения во «все грехи»; формула «к смерти» сохранена как намеренно жёсткая и богословски напряжённая.
theological_decisions:
- issue: Связь греха со смертью
  choice: «грех во всей полноте — к смерти»
  alternative: «совершишь все грехи, ведущие к смерти»
  rationale: Источник говорит об одном грехе, охарактеризованном как полный или целый, и не уточняет причинную связь; перевод сохраняет эту неоднозначность.
- issue: Толкование освобождения от ярма
  choice: действия приписаны самому адресату
  alternative: «когда отец оставит тебя и снимет своё ярмо»
  rationale: Глагольные формы стоят во втором лице мужского рода единственного числа, а слова «отец» и притяжательного определения при «ярме» в тексте нет.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Начальная синтаксическая незавершённость сохранена, поскольку стих начинается продолжением фразы предыдущего контекста; искусственно восполнять отсутствующие слова не стали.
