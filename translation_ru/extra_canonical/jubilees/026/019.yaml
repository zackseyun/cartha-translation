translation:
  language: ru
  text: 'И он сказал: «Ты ли это, сын мой Исав?» И он сказал: «Я твой сын». И он сказал: «Поднеси мне, и я поем».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንተኑ፡ ወልድየ፡ ዔሳው
  choice: Ты ли это, сын мой Исав?
  rationale: Вопросительная частица -ኑ передана естественной русской конструкцией «ты ли это»; обращение «сын мой Исав» сохраняет порядок и смысл исходного текста.
- source_word: አነ፡ ወልድከ
  choice: Я твой сын
  rationale: Прямо передаёт именную конструкцию «я — твой сын», не добавляя имени Исава, которого в ответе нет.
- source_word: አቅርብ፡ ሊተ
  choice: Поднеси мне
  rationale: Императив አቅርብ означает приближение или поднесение; местоименная форма ሊተ — «мне».
- source_word: ወእብላዕ
  choice: и я поем
  rationale: Сохраняет соединительный союз и форму первого лица; совершенный вид по-русски естественно выражает намерение поесть после того, как пищу поднесут.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, повтор речи и напряжение сцены. Во второй реплике повторяющееся исходное «и он сказал» передано как «тот ответил», чтобы ясно различить собеседников без изменения содержания; третье — как «тогда он сказал».
