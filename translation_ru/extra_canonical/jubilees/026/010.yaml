  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: ru
  text: И Ревекка взяла лучшие одежды своего старшего сына Исава, которые были у неё дома, и одела в них своего младшего сына Иакова; и шкурки козлят положила ему на руки и на обнажённую часть шеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ... ዘይትፈተው
  choice: лучшие одежды
  rationale: Выражение обозначает привлекательную, желанную или ценную одежду. «Лучшие одежды» естественно по-русски передаёт положительную оценку, не перегружая фразу буквальным «желанные».
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: старшего / младшего
  rationale: Парные определения сыновей переданы обычными русскими терминами возрастного старшинства.
- source_word: መሓስአ፡ ጠሊ
  choice: шкурки козлят
  rationale: Сохраняется конкретный образ шкур молодых коз; уменьшительная форма естественно соответствует небольшому размеру шкурок.
- source_word: ዕርቃነ፡ ክሳዱ
  choice: обнажённую часть шеи
  rationale: Передаёт не всю шею вообще, а её непокрытый участок, на который были наложены шкурки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Синтаксис сохраняет последовательность действий исходного текста; ошибочное понимание ወእምእስቲ как «и из шкур» не принято.
