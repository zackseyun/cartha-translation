review_pass:
  verdict: revise
  source_fidelity: Переданы оба обозначения народов (አሕዛብ ... ሕዝብ), пожелательная форма, власть над братьями, сыновья матери и потомство. Однако «да будет дано» добавляет отсутствующее в источнике значение передачи/дарения; в оригинале благословение просто должно быть «тебе и твоему потомству».
  naturalness: Текст в целом литературен и ясен. Оборот «Авраама, отца моего» допустим, но «Авраама, моего отца» естественнее для современного литературного русского при сохранении торжественного регистра.
  terminology: «Нации и народы» обоснованно отражает два исходных термина; «господином» и «потомству» точны и естественны. «Бог» соответствует исходному обозначению без неоправданной конфессиональной конкретизации.
  issues:
  - severity: medium
    issue: Добавлено значение «дано» в заключительной формуле.
    rationale: Геэзский текст говорит, что всё благословение «да будет тебе и твоему потомству», а не что оно должно быть кому-то дано. Добавление пассива слегка меняет смысл и образ формулы благословения.
  - severity: low
    issue: Порядок приложения в выражении об Аврааме менее естественен для современного русского.
    rationale: «Авраама, моего отца» передаёт ለአብርሃም፡ አቡየ столь же точно, но звучит плавнее.
  revised_text: Пусть нации и народы поклонятся тебе. Будь господином над своими братьями, и пусть сыновья твоей матери поклонятся тебе. И всё благословение, которым Бог благословил меня и Авраама, моего отца, да будет тебе и твоему потомству.
