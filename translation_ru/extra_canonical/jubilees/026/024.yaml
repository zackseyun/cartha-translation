  yaml_path: translation/extra_canonical/jubilees/026/024.yaml
  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: ru
  text: Пусть нации и народы поклонятся тебе. Будь господином над своими братьями, и пусть сыновья твоей матери поклонятся тебе. И всё благословение, которым Бог благословил меня и Авраама, моего отца, да будет тебе и твоему потомству.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕዛብ፡ ... ሕዝብ፡
  choice: нации и народы
  rationale: Переданы оба присутствующих в источнике обозначения народов; «нации» здесь употреблено в библейском смысле этнических общностей, а не современных государств.
- source_word: ኩን፡ እግዚአ፡
  choice: будь господином
  rationale: Сохраняет повелительно-пожелательную форму и значение владычества над братьями, не превращая титул в божественное именование.
- source_word: ወለዘርእከ፡
  choice: и твоему потомству
  rationale: Передаёт собирательное значение «семя» естественным современным русским словом без утраты родового смысла.
theological_decisions:
- issue: Обозначение Бога в формуле благословения
  choice: Бог
  alternative: Господь
  rationale: Геэзское እግዚአብሔር в данном контексте передаёт обозначение Бога; выбран нейтральный эквивалент, не вносящий различение божественных имён, которого переводческий контекст не требует.
- issue: Форма благословения
  choice: пожелательные конструкции «пусть…», «да будет дано…»
  alternative: будущее время как утверждение
  rationale: Сохраняется характер произносимого благословения и пожелания, а не безусловного повествовательного предсказания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского благословения. Синтаксический параллелизм оригинала сохранён, а буквальное «семя» естественно передано как «потомство».
