revisions:
- from: Пусть нации и народы поклонятся тебе. Будь господином над своими братьями, и пусть сыновья твоей матери поклонятся тебе. И всё благословение, которым Бог благословил меня и благословил Авраама, отца моего, да будет дано тебе и твоему потомству.
  to: Пусть нации и народы поклонятся тебе. Будь господином над своими братьями, и пусть сыновья твоей матери поклонятся тебе. И всё благословение, которым Бог благословил меня и Авраама, моего отца, да будет тебе и твоему потомству.
  rationale: 'Убрано добавочное «дано», чтобы заключительная пожелательная формула не содержала смысла, отсутствующего в исходнике. Приложение «моего отца» переставлено в более естественный для современного русского порядок. Остальные решения сохранены: они точно передают исходный текст и согласуются с английским контрольным текстом, включая явное упоминание наций и народов.'
