  text: And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance.”
translation:
  language: ru
  text: 'Он сказал: «Неужели ты не оставил благословения и для меня, отец мой?» Исаак ответил Исаву: «Вот, я поставил его господином над тобой и отдал ему всех его братьев в слуги; и в изобилии…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный текст на языке оригинала здесь обрывается на словах «и в изобилии…».
    reason: textual_fragment
lexical_decisions:
- source_word: ኢያትረፍከኒ፡ ሊተ፡ በረከተ
  choice: Неужели ты не оставил благословения и для меня
  rationale: Глагол передаёт смысл оставления или сохранения чего-либо для другого; частица «и» естественно выражает подразумеваемое «для меня тоже», не превращая неопределённое «благословение» в определённое.
- source_word: እግዚአ፡ ሤምክዎ፡ ለከ
  choice: я поставил его господином над тобой
  rationale: Сохраняет властное отношение, выраженное словом «господин», и естественно передаёт направленность по отношению к Исаву.
- source_word: አግብርተ፡ ይኩንዎ
  choice: в слуги
  rationale: Кратко и ясно передаёт конструкцию «чтобы они были ему слугами».
- source_word: ወበብዝኀ
  choice: а изобилием…
  rationale: Исходный фрагмент обрывается на предложной конструкции «и/а изобилием»; многоточие сохраняет незавершённость, не добавляя отсутствующего дополнения.
theological_decisions:
- issue: Характер власти Иакова над Исавом
  choice: господином над тобой
  alternative: владыкой твоим
  rationale: Выбрано общеупотребительное и достоинственное выражение без ослабления иерархического смысла текста.
- issue: Незавершённая заключительная фраза
  choice: не восполнять подразумеваемое сказуемое или объект
  alternative: добавить по контексту формулу вроде «я наделил его изобилием»
  rationale: Предоставленный текст на языке оригинала обрывается; восполнение сняло бы реальную текстовую неопределённость.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Обращение сына к отцу и ответ Исаака переданы естественно; синтаксическая незавершённость конца стиха намеренно сохранена.
