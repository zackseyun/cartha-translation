  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: ru
  text: 'И Ревекка, его мать, сказала ему: «Пусть твоё проклятие будет на мне, сын мой; только послушайся моих слов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላዕሌየ፡ መርገምከ
  choice: Пусть твоё проклятие падёт на меня
  rationale: Передаёт буквальное «на мне/на меня — твоё проклятие» как естественное русское пожелание-принятие последствий, не уточняя сверх текста источник или характер проклятия.
- source_word: ስማዕ፡ ቃልየ
  choice: послушай меня
  rationale: Буквально выражение связано со слушанием «моего слова/голоса», но в данном побудительном контексте означает согласие поступить по сказанному; выбран естественный современный русский оборот без архаизма «послушай голоса моего».
