lexical_decisions:
- source_word: እምዘ፡ አደንከ፡
  choice: из добытой тобой дичи
  rationale: Оборот указывает на результат охоты; по-русски естественно передать его как дичь, добытую адресатом.
- source_word: ከመ፡ ትባርከከ፡ ነፍስየ፡
  choice: чтобы моя душа благословила тебя
  rationale: Сохранён буквальный субъект «моя душа», несущий древнесемитский оттенок личности и внутреннего существа говорящего.
- source_word: ወአቅረበ፡ ሎቱ፡
  choice: И он поднёс ему
  rationale: Глагол передаёт приближение или подачу приготовленной еды; «поднёс» естественно в данном контексте и не добавляет явно не названный объект.
- source_word: ወበልዐ፡
  choice: и тот поел
  rationale: Смена местоименного обозначения устраняет неестественную русскую двусмысленность относительно того, кто ел, не вводя имени, отсутствующего в источнике.
- source_word: ወአብአ፡ ሎቱ፡
  choice: затем он принёс ему
  rationale: Объект глагола — «вино» — находится в начале следующего стиха из-за разделения текста; здесь объект намеренно не добавлен.
theological_decisions:
- issue: Выражение «моя душа благословила тебя»
  choice: Сохранить «моя душа»
  alternative: «чтобы я благословил тебя»
  rationale: Буквальная формулировка источника богословски и антропологически значима; её не следует сглаживать без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное многоточие показывает, что стих начинается с продолжения реплики. Финальная фраза намеренно остаётся синтаксически открытой и соединяется с объектом в следующем стихе.
