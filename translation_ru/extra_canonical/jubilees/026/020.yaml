  source_fidelity: 'Начальная часть точно передаёт продолжение реплики: «из добытой тобой дичи, сын мой, чтобы моя душа благословила тебя». Сохранение «моя душа» оправдано и соответствует геэзскому тексту. Финальный глагол не имеет выраженного дополнения в данном стихе; дополнение («вино») начинается в следующем стихе, поэтому его не следует вставлять в основной текст.'
