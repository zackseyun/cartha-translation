  text: Blessed shall he be, and all his seed forever.” And it happened, when Esau heard the words of his father Isaac,
translation:
  language: ru
  text: «Да будут благословенны он и всё его потомство вовеки». И случилось, когда Исав услышал слова своего отца Исаака,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቡሩከ፡ ይኩን፡
  choice: Благословен будет он
  rationale: Передаёт именную форму «благословен» и пожелательно-пророческий смысл глагола, сохраняя торжественный строй благословения.
- source_word: ወኵሉ፡ ዘርኡ፡
  choice: и всё его потомство
  rationale: «Потомство» естественно передаёт собирательное значение «семени» в современном литературном русском.
- source_word: እስከ፡ ለዓለም።
  choice: вовеки
  rationale: Краткое и возвышенное соответствие значению неограниченной длительности.
- source_word: ወኮነ፡ ሶበ፡
  choice: И случилось, когда
  rationale: Сохранены и повествовательный переход «случилось», и временная связь «когда», хотя предложение продолжается в следующем стихе.
- source_word: ነገረ፡ አቡሁ፡ ይስሐቅ፡
  choice: слова своего отца Исаака
  rationale: Контекстуально естественная передача речи Исаака; родственная связь и имя сохранены без перестройки смысла.
theological_decisions:
- issue: Распространение благословения на потомство
  choice: «Благословен будет он, и всё его потомство — вовеки»
  alternative: «Да будут благословенны он и всё его потомство вовеки»
  rationale: Выбранный вариант сохраняет единственное число исходного определения при ясном смысловом распространении благословения на потомство и не усиливает грамматически то, что в источнике выражено компактно.
translation_notes:
  register: Современный литературный русский с торжественной интонацией благословения. Синтаксическая незавершённость конца стиха сохранена, поскольку придаточное предложение продолжается далее.
