  text: “My son, I have grown old, and now my eyes are too dim to see, and I do not know the day of my death.”
translation:
  language: ru
  text: «Сын мой, я состарился, и вот, глаза мои стали плохо видеть, и я не знаю дня своей смерти».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: Сын мой
  rationale: Прямое обращение с притяжательным суффиксом; естественный и достойный русский порядок слов.
- source_word: ረሳዕኩ
  choice: я состарился
  rationale: Передаёт завершившееся наступление старости без добавления отсутствующего в источнике глагола речи.
- source_word: ወናሁ
  choice: и вот
  rationale: Сохраняет указательно-эмфатическую частицу ናሁ и связь с предыдущей фразой.
- source_word: አዕይንትየ፡ ከፍአ፡ ለርእይ
  choice: глаза мои стали плохо видеть
  rationale: Естественно передаёт ухудшение зрения; не усиливает смысл до полной неспособности видеть.
- source_word: ወኢያአምር፡ ዕለተ፡ ሞትየ
  choice: и я не знаю дня своей смерти
  rationale: Близко следует отрицанию, глаголу знания и конструкции «день моей смерти».
