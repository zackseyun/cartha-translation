  text: And Esau went to the open country to hunt, and to catch, and to bring it to his father.
translation:
  language: ru
  text: И Исав отправился в поле, чтобы охотиться[a], поймать добычу и принести её своему отцу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искать добычу».'
    reason: Сохраняет засвидетельствованный альтернативный способ передачи первого глагола, не подменяя основное, более уместное в данном контексте значение «охотиться».
lexical_decisions:
- source_word: ገዳመ
  choice: в поле
  rationale: Слово обозначает незаселённую открытую местность; в контексте охоты естественное русское соответствие — «в поле».
- source_word: ያሥግር
  choice: охотиться
  rationale: Передаёт первый глагол охотничьей последовательности, не сливая его со следующим глаголом «поймать».
- source_word: የአንዝ
  choice: поймать добычу
  rationale: Глагол имеет значение схватить или поймать; существительное «добычу» добавлено как ясный из контекста объект, необходимый для естественного русского выражения.
- source_word: ያምጽእ፡ ለአቡሁ
  choice: принести её своему отцу
  rationale: Местоимение «её» отсылает к добыче; возвратное «своему» однозначно соотносит отца с Исавом.
