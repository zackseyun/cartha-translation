  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: ru
  text: 'И сказал Иаков Ревекке, матери своей: «Мама, разве мне не хватит чего-нибудь из всего того, что ест и что нравится моему отцу?[a] Но я боюсь, мама, что он узнает мой голос и захочет потрогать меня. Ты ведь знаешь, что я гладкий, а Исав, брат мой, волосатый. Тогда в его глазах я покажусь тем, кто насмехается над ним: я сделаю то, чего он мне не велел, он разгневается на меня, и я навлеку на себя проклятие, а не благословение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая фраза трудна для понимания. Возможен смысл: Иаков спрашивает, неужели нельзя обойтись какой-либо из обычных кушаний, которые его отец ест и любит.'
    reason: segmentation_note
lexical_decisions:
- source_word: ኢይምሕክ
  choice: разве мне будет недоставать чего-нибудь
  rationale: Передаёт засвидетельствованное в данном контексте идиоматическое значение «не будет ли мне недоставать», не подменяя его значением «распознавать».
- source_word: ወያሠምሮ
  choice: и что ему нравится
  rationale: 'Форма от ሠምረ выражает удовольствие или угодность: пища нравится отцу.'
- source_word: ይለቡ፡ ቃልየ
  choice: он узнает мой голос
  rationale: В конструкции после глагола страха отрицательная частица имеет значение опасения («как бы не»), поэтому по-русски естественно выразить положительное событие, которого боится Иаков.
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: захочет ощупать меня
  rationale: ይፍቅድ означает желание, а объектная форма ይገሥሠኒ — «прикоснётся/потрогает меня»; «ощупать» ясно передаёт проверку волосатости.
- source_word: ልሙጽ
  choice: гладкий
  rationale: В противопоставлении волосатому Исаву слово обозначает гладкую, безволосую кожу.
- source_word: ከመ፡ ዘያስተአኪ
  choice: насмешником
  rationale: Сохраняет образ человека, который насмехается или глумится над другим, не усиливая его до однозначного «обманщика».
theological_decisions:
- issue: Характер поступка Иакова перед Исааком
  choice: «в его глазах я окажусь насмешником»
  alternative: «я покажусь ему обманщиком»
  rationale: Источник характеризует то, как Исаак воспримет Иакова, через образ насмешки; перевод не вводит дополнительной морально-богословской квалификации.
- issue: Соотношение проклятия и благословения
  choice: «проклятие вместо благословения»
  alternative: «проклятие, а не благословение»
  rationale: «Вместо» естественно передаёт резкое противопоставление исходов, не изменяя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Обращение «мама» сохранено как естественное повторное обращение сына к матери; инверсия «матери своей» поддерживает повествовательный библейский регистр. Неясность начального вопроса сохранена и пояснена сноской.
