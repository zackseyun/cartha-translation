  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: ru
  text: 'Он издал чрезвычайно громкий и горький вопль и сказал отцу: «Благослови и меня, отец!» Тот ответил ему: «Твой брат пришёл, прибегнув к обману, и отнял твои благословения». Он сказал: «Теперь я понял, почему его назвали Иаковом: он уже дважды обошёл меня[a]. Сначала он отнял моё первородство, а теперь отнял моё благословение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иаков» связано с еврейским словом «пята»; здесь обыгрывается также смысл «обойти» или «вытеснить» другого.
    reason: Передаёт этимологическую игру, присутствующую в реплике, не создавая неверного впечатления о русском созвучии.
lexical_decisions:
- source_word: በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: громко и горько закричал
  rationale: Естественно передаёт сочетание «с очень великим и горьким криком», сохраняя силу и горечь вопля без тяжеловесного буквального оборота.
- source_word: በሕብል
  choice: с обманом
  rationale: Передаёт способ действия как обман или коварство, не добавляя мотивов, отсутствующих в источнике.
- source_word: በረከታቲከ
  choice: твои благословения
  rationale: Сохранено множественное число формы источника, несмотря на последующее единственное число «моё благословение».
- source_word: አዐቀጸኒ
  choice: меня обошёл
  rationale: Современный русский оборот передаёт смысл вытеснения и присвоения того, что предназначалось Исаву; связь с именем Иаков пояснена в сноске.
- source_word: ልደተየ
  choice: моё первородство
  rationale: В данном повествовательном контексте обозначает статус и право первенца, а не просто факт рождения.
theological_decisions:
- issue: Различие числа в упоминаниях благословения
  choice: «твои благословения» в речи Исаака и «моё благословение» в речи Исава
  alternative: В обоих случаях единственное число
  rationale: Источник намеренно или текстуально различает множественную и единственную формы; гармонизировать их не следует.
- issue: Игра слов между именем Иаков и поступком брата
  choice: В основном тексте использован понятный оборот «меня обошёл», а связь с именем вынесена в сноску
  alternative: Архаичное «запнул меня» или буквальное «схватил меня за пяту»
  rationale: Так сохраняются естественность современного русского текста и существенная для реплики этимологическая игра слов без навязывания одной спорной этимологии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики сделаны ясными и эмоционально выразительными; архаизмы и искусственная буквальность устранены, а неодинаковое число слова «благословение» в источнике сохранено.
