  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: ru
  text: 'И вошёл Иаков к своему отцу и сказал: «Я — твой сын. Я сделал, как ты велел мне. Встань, сядь и поешь того, что я добыл на охоте, отец, чтобы душа твоя благословила меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ
  choice: вошёл
  rationale: Прямо передаёт глагол движения внутрь и естественно звучит в русском повествовании.
- source_word: ገበርኩ፡ በከመ፡ ትቤለኒ
  choice: я сделал, как ты велел мне
  rationale: Сохраняет смысл исполнения отцовского повеления; «велел» точнее контекста, чем нейтральное «сказал».
- source_word: አሰገርኩ
  choice: я добыл на охоте
  rationale: Передаёт охотничий смысл формы без неестественного русского оборота «то, на что я охотился».
- source_word: ነፍስከ
  choice: душа твоя
  rationale: Сохраняет буквальный антропологический образ источника, не заменяя его местоимением «ты».
theological_decisions:
- issue: Благословение, исходящее от «души» отца
  choice: чтобы душа твоя благословила меня
  alternative: чтобы ты благословил меня
  rationale: Формулировка источника сохранена, поскольку она может выражать благословение всем внутренним существом и не должна быть молча упрощена.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Порядок повелений и прямое обращение «отец» сохранены; архаизмы не использованы.
