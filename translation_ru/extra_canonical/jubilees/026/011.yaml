lexical_decisions:
- source_word: ትብሲሰ
  choice: приготовленное кушанье
  rationale: Слово обозначает приготовленную пищу или блюдо; нейтральное «кушанье» естественно передаёт смысл без неоправданного уточнения способа приготовления.
- source_word: ኅብስተ፡ ዘገብረት
  choice: хлеб, который испекла
  rationale: Буквально конструкция означает «хлеб, который она сделала»; по-русски применительно к хлебу естественно сказать «испекла».
- source_word: ውስተ፡ እዴ
  choice: в руки
  rationale: Передаёт исходную конструкцию «в руку/руки» и обычный русский образ непосредственной передачи.
- source_word: ያዕቆብ፡ ወልዳ
  choice: своему сыну Иакову
  rationale: Русский порядок слов ясно выражает, что Иаков — её сын, сохраняя все элементы исходного текста.
