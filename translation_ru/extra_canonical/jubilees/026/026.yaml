  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: ru
  text: 'И его брат Исав пришёл с охоты. Он тоже приготовил еду, принёс её отцу и сказал ему: «Пусть отец мой встанет и поест моей дичи, чтобы душа твоя благословила меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽሐ፡ እምነዓዊሁ
  choice: вернулся с охоты
  rationale: Передаёт прибытие Исава после охоты естественным современным русским выражением; контекстуальное значение соответствует английскому консультационному слою.
- source_word: መብልዐ
  choice: кушанье
  rationale: Обозначает приготовленную пищу; «кушанье» сохраняет достоинство повествовательного регистра и связь с библейским контекстом.
- source_word: እመሥገርትየ
  choice: моей дичи
  rationale: Передаёт добытую на охоте пищу без излишнего уточнения способа приготовления.
- source_word: ነፍስከ
  choice: душа твоя
  rationale: Сохраняет буквальный антропологический оборот источника и его возможную богословскую значимость, не заменяя его простым «ты».
theological_decisions:
- issue: Субъект благословения в выражении «душа твоя»
  choice: чтобы душа твоя благословила меня
  alternative: чтобы ты благословил меня
  rationale: Формулировка источника сохранена, поскольку она может быть идиоматической, но не должна молча упрощаться и терять образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Реплика Исава сохраняет уважительное обращение к отцу в третьем лице, а синтаксис остаётся ясным для современного читателя.
