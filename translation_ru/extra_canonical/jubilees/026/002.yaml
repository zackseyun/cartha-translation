  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: ru
  text: А теперь возьми своё охотничье снаряжение — колчан и лук, выйди в поле, поохоться и добудь для меня дичь, сын мой. Приготовь мне блюдо, которое любит моя душа, и принеси его мне, чтобы я поел и моя душа благословила тебя, прежде чем я умру».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ፡ ነፃዊከ
  choice: своё охотничье снаряжение
  rationale: Передаёт общее обозначение принадлежностей для охоты, за которым следуют уточняющие «колчан и лук».
- source_word: ምትኃደከ፡ ወቀስትከ
  choice: колчан и лук
  rationale: Прямое и естественное соответствие названным предметам снаряжения.
- source_word: ወነዐው፡ ሊተ፡ ወአንዝ፡ ሊተ
  choice: поохоться для меня и поймай дичь
  rationale: Сохраняет два самостоятельных глагола исходного текста — охотиться и поймать/добыть, не сводя их к одному действию.
- source_word: መብልዐ
  choice: кушанье
  rationale: Современное литературное слово, уместное для приготовленной пищи в данном торжественном семейном обращении.
- source_word: ነፍስየ
  choice: моя душа
  rationale: Сохраняет повторяющееся в оригинале слово «душа», включая выражение о благословении, не заменяя его местоимением «я».
theological_decisions:
- issue: Субъект благословения
  choice: моя душа благословила тебя
  alternative: я благословил тебя от всей души
  rationale: Буквальная конструкция с «душой» важна для образного и антропологического языка текста; её не следует без необходимости истолковывать или сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разбит на два предложения для ясности, при этом последовательность повелений и повтор слова «душа» сохранены.
