  text: as you commanded me.” And Isaac trembled with a very great trembling, and he said, “Who then is this who hunted and caught game and brought it to me, and I ate of everything before you came, and I blessed him?
translation:
  language: ru
  text: '«как ты велел мне». Исаак задрожал очень сильной дрожью и сказал: «Кто же это, кто охотился, поймал добычу[a] и принёс её мне, так что я отведал всего прежде, чем ты пришёл, и благословил его?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «охотился за добычей и поймал её».'
    reason: Геэзский текст содержит два глагола, относящихся к охоте и поимке; возможна несколько иная русская синтаксическая связь при сохранении обоих действий.
lexical_decisions:
- source_word: ወተደመ፡ ይስሐቅ፡ ድማመ፡ ዐቢየ፡ ጥቀ
  choice: И задрожал Исаак сильнейшей дрожью
  rationale: Сохранена усилительная конструкция с однокоренными глаголом и существительным, но в естественном русском порядке слов.
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: кто охотился, поймал добычу
  rationale: Переданы оба самостоятельных действия исходного текста — охота и поимка; второе не опущено и не сведено к первому.
- source_word: ወአምጽአ፡ ሊተ
  choice: и принёс её мне
  rationale: Местоимение «её» естественно отсылает к добыче, подразумеваемому объекту предшествующих глаголов.
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: Я отведал всего
  rationale: Передаёт буквальное «я ел от всего» современным литературным русским языком без сужения смысла.
- source_word: እንበለ፡ ትምጻእ
  choice: прежде, чем ты пришёл
  rationale: Точно выражает временное предшествование приходу собеседника.
