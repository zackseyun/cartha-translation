  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: ru
  text: 'зерном, вином и маслом я поддержал его. Что же теперь я могу сделать для тебя, сын мой?» Исав сказал своему отцу Исааку: «У тебя только одно благословение, отец мой? Благослови и меня, отец мой!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስርናይ
  choice: хлебом
  rationale: Слово обозначает зерно/пшеницу; в контексте формулы благословения естественное русское «хлеб» сохраняет значение основного урожая и средства пропитания.
- source_word: ወይን
  choice: вином
  rationale: Прямое соответствие исходному слову «вино».
- source_word: ቅብዕ
  choice: маслом
  rationale: Обозначает масло, в данном аграрном сочетании — прежде всего оливковое; родовое «масло» не добавляет отсутствующего в тексте уточнения.
- source_word: አጽናዕክዎ
  choice: я укрепил его
  rationale: Сохраняет основной смысл каузативного глагола «укрепить, сделать сильным» и не сводит его только к обеспечению пропитанием.
- source_word: ምንተ፡ እሬሲ
  choice: что… я могу сделать
  rationale: Естественно передаёт вопрос «что я сделаю/могу сделать», сохраняя риторическую силу реплики.
- source_word: አሐቲኑ፡ ከመ፡ በረከት
  choice: только одно благословение
  rationale: Передаёт вопрос Исава о единственности благословения без богословского уточнения его природы.
- source_word: ባርከኒ፡ ኪያየኒ
  choice: благослови и меня
  rationale: Повтор местоименного элемента передан русской усилительно-присоединительной конструкцией «и меня».
theological_decisions:
- issue: Характер уже данного Иакову благословения
  choice: Сохранить формулировку «я укрепил его» и вопрос о возможности ещё что-либо сделать
  alternative: Передать как «я обеспечил его» или пояснить, что благословение невозможно отменить
  rationale: Исходный текст говорит об укреплении дарами и оставляет напряжение в словах Исаака; он не формулирует здесь отдельного учения о неотменимости благословения.
- issue: Единственность благословения
  choice: «Неужели у тебя только одно благословение?»
  alternative: «Разве у тебя не осталось другого благословения?»
  rationale: Выбранный вариант ближе к форме исходного вопроса и не вводит идею «оставшегося» благословения, которой прямо нет в тексте.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Реплики звучат естественно; обращение «отец мой» передаёт повтор и настойчивость Исава. Начало стиха намеренно продолжает предшествующее предложение.
