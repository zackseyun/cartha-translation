  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: ru
  text: И Исаак не узнал его, потому что руки у него были волосаты, как руки Исава, его брата, и благословил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «...чтобы благословить его».'
    reason: Заключительная конструкция ከመ + сослагательная форма может иметь целевой оттенок, хотя в данном повествовательном контексте основное чтение передаёт результат.
lexical_decisions:
- source_word: ኢያእመረ
  choice: не узнал его
  rationale: Передаёт отрицательную форму глагола «знать/распознать» в данном повествовательном контексте.
- source_word: ጸጓር
  choice: волосатые
  rationale: Естественный современный русский эквивалент, описывающий руки, покрытые волосами, в соответствии с контекстом.
- source_word: ከመ፡ ይባርኮ
  choice: и он благословил его
  rationale: В контексте конструкция передаёт последовавший результат; союз «и» естественно сохраняет ход повествования, не устраняя возможного целевого оттенка конструкции.
theological_decisions:
- issue: Значение заключительной конструкции ከመ + сослагательная форма
  choice: и он благословил его
  alternative: так что он благословил его; чтобы благословить его
  rationale: Контекст Быт 27:23 поддерживает результат — Исаак не распознал Иакова и затем благословил его. Однако форма допускает целевой оттенок, поэтому он отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным строем; начальный союз сохранён для связи с предыдущим стихом. Формулировка избегает архаизма «руки его» там, где естественнее «руки у него», но сохраняет ясность местоименных отсылок.
