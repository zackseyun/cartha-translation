  terminology: «Исав», «Иаков», «благословение», «потомство» и «дни плача» употреблены удачно. Повтор «благословение, которым благословил» правомерно сохраняет формулу исходного текста. Сноска корректно отмечает допустимую передачу глагола как наступления, а не приближения.
