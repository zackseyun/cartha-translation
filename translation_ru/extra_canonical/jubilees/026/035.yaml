  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: ru
  text: 'и твоё потомство будет искоренено из-под небес». И Исав возненавидел Иакова за благословение, которым благословил его отец, и сказал в своём сердце: «Пусть же теперь приблизятся дни плача по моему отцу[a], и я убью Иакова, моего брата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть же теперь наступят дни плача по моему отцу».'
    reason: Глагольная форма допускает передачу как приближения, так и наступления ожидаемых дней плача.
lexical_decisions:
- source_word: ይሢሮ፡ ዘርእከ፡ እመትሕተ፡ ሰማይ
  choice: искоренится твоё потомство из-под небес
  rationale: Передаёт образ полного исторического устранения потомства; «из-под небес» сохраняет пространственную формулу источника.
- source_word: ይትሜአክ፡ ዔሳው፡ ያዕቆብሃ
  choice: Исав возненавидел Иакова
  rationale: Прямо и естественно передаёт сильную враждебность, выраженную исходным глаголом.
- source_word: በእንተ፡ በረከት፡ እንተ፡ ባረኮ፡ አቡሁ
  choice: за благословение, которым благословил его отец
  rationale: Сохраняет характерный для библейского повествования повтор существительного и родственного ему глагола.
- source_word: ይእዜኒ፡ ይብጻሕ፡ መዋዕለ፡ ላሐ፡ አቡየ
  choice: Пусть же теперь приблизятся дни плача по моему отцу
  rationale: «Теперь» отражает ይእዜኒ, а «приблизятся» сохраняет значение наступления или приближения дней плача, не устраняя неоднозначность высказывания.
- source_word: ወእቀትሎ፡ ለያዕቆብ፡ እኁየ
  choice: и я убью Иакова, брата моего
  rationale: Сохраняет прямоту угрозы и слегка торжественный библейский порядок определения.
theological_decisions:
- issue: Смысл приближения дней плача по отцу
  choice: Сохранить формулировку как пожелание о приближении этих дней
  alternative: «Когда наступят дни плача по моему отцу» или «Скоро наступят дни плача по моему отцу»
  rationale: Источник выражает пожелание через форму «пусть приблизятся»; перевод не должен превращать его в нейтральное временное придаточное или явно утверждать желание смерти отца сверх сказанного.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Архаизмы сведены к минимуму; повтор «благословение, которым благословил» сохранён как значимый семитский оборот. Местоимение в первой фразе оставлено в единственном числе согласно источнику.
