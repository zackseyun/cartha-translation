  source_fidelity: 'Смысл в целом передан точно: сохранены уничтожение потомства, ненависть Исава вследствие благословения, внутреннее высказывание с «теперь», приближением дней скорби по отцу и намерением убить Иакова. Однако «искоренится твоё потомство» в русском имеет возвратный оттенок и может означать, что потомство искоренит себя, тогда как исходник выражает его уничтожение/истребление.'
