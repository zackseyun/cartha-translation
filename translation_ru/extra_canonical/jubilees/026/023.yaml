  text: full, which the LORD has blessed. And may the LORD give you—and multiply you—from the dew of heaven and from the dew of the earth[23], and abundance of grain and oil may he multiply for you. Let them serve you,
translation:
  language: ru
  text: полное, которое благословил Господь. И да даст тебе Господь — и да умножит тебя[a] — от росы небесной и от росы земной[b], и да умножит для тебя изобилие пшеницы и масла. Да служат они тебе,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и да умножит для тебя».'
    reason: Геэзская форма допускает иное понимание отношения местоименного суффикса к глаголу; основной текст сохраняет более прямое чтение «умножит тебя».
  - marker: b
    text: Выражение «роса земная» необычно; в Бытии 27:28 ожидается «тучность земли». Здесь перевод следует геэзскому тексту и не приводит его в соответствие с Бытией.
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ
  choice: полное
  rationale: Передаёт простое значение «полное» и согласуется со словом «поле» из предыдущего стиха; дополнение «благословения» не вводится.
- source_word: ጠለ፡ ምድር
  choice: росы земной
  rationale: Перевод следует засвидетельствованному геэзскому чтению и не гармонизирует его с «тучностью земли» в Бытии 27.
- source_word: ስርናይ
  choice: пшеницы
  rationale: Геэзское слово конкретно обозначает пшеницу; это точнее общего «зерна».
- source_word: ይትቀነዩ፡ ለከ
  choice: Да служат они тебе
  rationale: В геэзском тексте субъект прямо не назван, поэтому «народы» или «племена» не добавляются из параллели в Бытии.
theological_decisions:
- issue: Необычное выражение «роса земная»
  choice: Сохранено буквально с примечанием
  alternative: «тучность земли» по Бытии 27:28
  rationale: Геэзский источник дважды использует слово «роса»; гармонизация устранила бы реальное отличие текста Юбилеев.
- issue: Неназванный субъект глагола «служить»
  choice: «они» без уточнения
  alternative: «народы»
  rationale: Сохраняется неопределённость исходного текста и не вносится отсутствующий в нём субъект из библейской параллели.
translation_notes:
  register: Современный литературный русский язык с торжественной формой благословения «да даст / да умножит / да служат». Фрагментарное начало и завершающая запятая сохранены, поскольку стих продолжает синтаксис соседних стихов.
