  rationale: Глагол обозначает проверку прикосновением; «ощупал» точно передаёт действие Исаака и сохраняет связь с повествовательной ситуацией.
- source_word: እመ፡ አንተ፡ ወልድየ፡ ዔሳው፡ ወእመ፡ አኮኑ
  choice: и узнал, мой ли ты сын Исав или нет
  rationale: Естественно воспроизводит косвенный вопрос и явное противопоставление «или нет», не снимая сомнения Исаака.
