  yaml_path: translation/extra_canonical/jubilees/026/005.yaml
  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: ru
  text: 'И Ревекка позвала своего сына Иакова и сказала ему: «Вот, я слышала, как твой отец Исаак говорил с твоим братом Исавом: „Добудь мне дичи[a], приготовь мне еды и принеси её мне, чтобы я поел и благословил тебя перед Господом, прежде чем умру“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойди на охоту и добудь для меня дичь».'
    reason: Уточняет охотничий оттенок исходного глагола, не сужая его до поимки.
lexical_decisions:
- source_word: አሰግር፡ ሊተ
  choice: «добудь для меня дичи»
  rationale: Глагол обозначает охоту или добывание дичи; перевод сохраняет это значение и не смешивает его с последующим ወአብእ — «и принеси».
- source_word: መብልዐ
  choice: «кушанье»
  rationale: Общее существительное со значением приготовленной пищи; «кушанье» естественно в торжественном повествовательном регистре и подходит к контексту.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: «пред Господом»
  rationale: Формально передаёт пространственно-сакральное выражение «перед Господом», сохраняя его богословскую значимость.
theological_decisions:
- issue: Связь благословения с присутствием Господа
  choice: «благословил тебя пред Господом»
  alternative: «благословил тебя Господом»
  rationale: Предлог በቅድመ означает «перед, в присутствии»; формулировка не превращает Господа в средство благословения и сохраняет исходный смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис прямой речи сохранён, но построен естественно для русского читателя; устаревшие формы сведены к уместному «пред Господом».
