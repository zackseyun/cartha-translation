  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: ru
  text: «Голос — голос Иакова, а руки — руки Исава». И он не узнал его, ибо это было небесное отведение, чтобы удалить его дух.[a]
  philosophy: optimal-equivalence
  footnotes:
