lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ፡
  choice: «Голос — голос Иакова»
  rationale: Сохраняет именную конструкцию и узнаваемую библейскую формулу без добавления отсутствующей связки.
- source_word: ወእደው፡ እደወ፡ ዔሳው፡
  choice: «а руки — руки Исава»
  rationale: Передаёт параллелизм исходного текста; противительный союз естественно связывает несоответствие голоса и рук.
- source_word: ወኢያእመረ፡
  choice: «И он не узнал его»
  rationale: Глагол передан в контексте распознавания личности, как в сцене благословения Исава и Иакова.
- source_word: ሚጠት፡
  choice: «помрачение»
  rationale: Существительное указывает на поворот, отклонение или отведение. В данном контексте «помрачение» естественно обозначает наведённую неспособность Исаака правильно распознать человека, не сводя выражение к физическому удалению.
- source_word: እምሰማይ፡
  choice: «посланное с небес»
  rationale: Сохраняет небесный источник события и образно согласуется с русским существительным «помрачение».
- source_word: ለአሕልፎ፡ መንፈሱ፡
  choice: «чтобы лишить его способности различать»
  rationale: Буквально сочетание связано с отведением или устранением его духа. Контекстуальная передача поясняет функцию выражения — временную утрату способности распознать Иакова, — избегая ошибочного впечатления, будто речь идёт о смерти или буквальном удалении духа.
theological_decisions:
- issue: Небесная обусловленность того, что Исаак не распознал Иакова
  choice: «посланное с небес помрачение»
  alternative: «поворот с небес» / «отведение с небес»
  rationale: Формулировка сохраняет прямое указание текста на небесный источник, но не уточняет, кто именно действует и каким образом, тем самым не выходя за пределы источника.
- issue: Значение «духа» Исаака в заключительной фразе
  choice: Функционально передать как «способность различать» с буквальной альтернативой в примечании
  alternative: «чтобы отвести его дух»
  rationale: Буквальная формула по-русски двусмысленна вплоть до представления о смерти. Основной текст передаёт вероятный контекстуальный смысл, а примечание сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского параллелизма. Неясная причинная фраза передана понятным образом, а её более буквальная форма и неоднозначность сохранены в сноске. Маркер [a] присутствует в основном тексте.
