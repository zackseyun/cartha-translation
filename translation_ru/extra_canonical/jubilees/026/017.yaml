    text: 'Или: «отклонение, исходящее с небес, чтобы отвести его дух». Значение слов «отведение» и «удалить его дух» не вполне ясно; в данном контексте они, вероятно, объясняют, почему Исаак не распознал Иакова, но текст не уточняет способ этого воздействия.'
