  text: And during these five days Adam saw them[a], male and female, of every kind that was on the earth, but he was alone, and no helper like him was found for him.
translation:
  language: ru
  text: В течение этих пяти дней Адам видел их[a] — самца и самку в каждом роде, обитавшем на земле, — но сам он был один, и не нашлось для него помощника, подобного ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В нумерации строк геэзского текста после стиха 2 следует стих 4, однако по смыслу здесь явно подразумевается сообщение о том, что в течение пяти дней Адам наблюдал существ — самца и самку каждого рода — и не нашёл среди них помощника, подобного себе.
    reason: segmentation_note
