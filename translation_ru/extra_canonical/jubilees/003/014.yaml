lexical_decisions:
- source_word: ይትፈጸማ እላንቱ መዋዕል
  choice: пока не завершатся эти дни
  rationale: Передаёт идею истечения установленного числа дней без добавления отсутствующих в данном фрагменте уточнений.
- source_word: ለተባዕት ወለአንስት
  choice: для мальчика и для девочки
  rationale: Сохраняет дательную конструкцию и соединительный союз ወ «и»; в контексте закона о роженице речь идёт о ребёнке мужского или женского пола.
- source_word: ዝንቱ ሕግ ወስምዕ ዘተጽሕፈ
  choice: Таковы записанные закон и свидетельство
  rationale: Естественная русская формулировка сохраняет оба юридико-религиозных термина и причастное значение «записанные».
theological_decisions:
- issue: Связь категорий мужского и женского пола
  choice: «для мальчика и для девочки»
  alternative: «для мальчика или для девочки»
  rationale: В геэзском тексте стоит союз ወ «и»; дизъюнкция была бы интерпретационным сглаживанием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром; синтаксис упрощён для ясности без добавления материала, отсутствующего в представленном источнике. Знак ፰ расценён как элемент аппарата/разметки издания, поскольку его включение как числа восемь нарушило бы синтаксис и контекст.
