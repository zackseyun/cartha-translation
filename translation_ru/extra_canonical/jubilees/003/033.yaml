lexical_decisions:
- source_word: አሐዱ
  choice: одни
  rationale: Форма означает «один»; в данном обрывочном контексте естественное русское «одни» передаёт совместное, но обособленное пребывание Адама и его жены, не превращая выражение в богословское утверждение о единстве.
- source_word: ውስተ፡ ምድረ፡ ፍጥረቶሙ
  choice: на земле, где были сотворены
  rationale: Идиоматически передаёт буквальное «в земле их сотворения» и сохраняет отнесение сотворения к ним обоим.
- source_word: ወሰመያ፡ አዳም፡ ስመ፡ ብእሲቱ፡ ሔዋ
  choice: И Адам назвал свою жену Евой
  rationale: Естественная русская передача семитской конструкции «назвал имя своей жены — Ева».
- source_word: ወአኮኑ
  choice: и у них не было…
  rationale: Сохраняет отрицательную конструкцию и её незавершённость в предоставленном фрагменте; многоточие не восполняет отсутствующее дополнение.
theological_decisions:
- issue: Значение አሐዱ в начальном фрагменте
  choice: одни
  alternative: едиными / одно
  rationale: «Одни» лучше соответствует повествовательному контексту и грамматически связывается с подразумеваемыми Адамом и его женой; вариант «едины» мог бы привнести не выраженный явно богословский смысл.
