  text: Therefore it was commanded on the heavenly tablets concerning all those who know the judgment of the law, that they should cover their shame and should not uncover themselves as the nations uncover themselves.
translation:
  language: ru
  text: Поэтому на небесных скрижалях было заповедано всем, кто знает норму Закона, прикрывать свою наготу и не обнажаться, как обнажаются народы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: небесные скрижали
  rationale: Устойчивое и понятное соответствие выражению «скрижали неба» в Книге Юбилеев.
- source_word: ፍትሐ፡ ሕግ
  choice: установление закона
  rationale: Сочетание обозначает законное постановление или норму; «установление закона» сохраняет юридический смысл, не сводя его только к судебному решению.
- source_word: ይክድኑ፡ ኀፍረቶሙ
  choice: прикрывать свою наготу
  rationale: Буквально передаёт действие покрытия и эвфемистическое обозначение наготы.
- source_word: አሕዛብ
  choice: язычники
  rationale: В данном противопоставлении носителям закона слово обозначает народы вне Израиля; традиционное русское «язычники» ясно передаёт этот смысл.
theological_decisions:
- issue: Значение выражения ፍትሐ፡ ሕግ
  choice: установление закона
  alternative: суд закона
  rationale: Источник допускает юридические оттенки «суда», «постановления» и «установления». Выбрана естественная русская формулировка, не предполагающая конкретного судебного разбирательства.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего нормативного высказывания; синтаксис упрощён без утраты причинно-следственной связи и параллелизма.
