  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: ru
  text: И увидела женщина, что дерево было приятным[a] и радовало глаз, а плод его хорош для еды; она взяла от него и съела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское слово ʾaddām здесь является прилагательным со значением «приятный» или «доставляющий удовольствие», а не именем Адам.
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: приятно
  rationale: Передаёт употреблённое здесь как прилагательное эфиопское ʾaddām со значением «приятный, доставляющий удовольствие», а не имя собственное Адам; без добавления отсутствующего в тексте существительного.
- source_word: ያሠምር፡ ለዐይን
  choice: радует глаз
  rationale: Естественно и точно передаёт смысл «приятно/угодно для глаза», сохраняя зрительный образ.
- source_word: ለበሊዕ
  choice: в пищу
  rationale: Краткое современное соответствие целевого выражения «для еды, для вкушения» в данном контексте.
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: и взяла она от него и съела
  rationale: Сохраняет последовательность действий и местоименную отсылку исходного текста; постпозиция «она» поддерживает достоинство библейского повествования без архаизации.
