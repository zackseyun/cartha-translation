  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: ru
  text: 'Он распознал её[a] и сказал ей: «Вот теперь кость от костей моих и плоть от плоти моей. Она будет называться моей женщиной[b], потому что взята от своего мужчины».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнал её». Здесь имеется в виду, что Адам распознаёт в ней ту, кто взята из него; речь не идёт о половой близости.'
    reason: Уточняет контекстуальное значение глагола и предотвращает сексуальную двусмысленность русского «узнал её».
  - marker: b
    text: Исходные слова, переведённые как «женщина» и «мужчина», соотнесены по форме; «моя женщина» также передаёт притяжательный суффикс в исходном тексте.
    reason: Объясняет необычную для русского формулировку и сохранённую соотнесённость терминов.
lexical_decisions:
- source_word: ወአእመራ (wa-ʾaʿmerā)
  choice: Он узнал её
  rationale: Глагол означает узнавание или распознавание. В данном контексте Адам, пробудившись, узнаёт в женщине ту, кто взята из него. Русское «познал её» могло бы ошибочно подразумевать половую близость.
- source_word: ዝንቱ፡ ይእዜ (zəntu yəʾəze)
  choice: Вот теперь
  rationale: Сохраняет указательное и временное усиление исходного выражения, соответствующее торжественному узнаванию женщины Адамом.
- source_word: ብእሲትየ (bəʾəsitye)
  choice: моей женщиной
  rationale: Форма содержит значение «женщина» с притяжательным суффиксом первого лица. Выбор сохраняет и значение, и принадлежность, не подменяя их более узким словом «жена».
- source_word: እምብእሲሃ (ʾəm-bəʾəsiha)
  choice: от своего мужчины
  rationale: Притяжательный элемент при слове «мужчина» передан возвратным местоимением. Это также сохраняет параллельную пару исходных слов «женщина — мужчина».
theological_decisions:
- issue: Значение узнавания женщины Адамом
  choice: «узнал её» как распознание происхождения и тождества женщины
  alternative: «познал её» в смысле супружеской близости
  rationale: Ближайший контекст описывает пробуждение Адама и представление ему созданной женщины; супружеская близость здесь не утверждается и в повествовании относится к более позднему времени.
- issue: Обозначение женщины
  choice: «моей женщиной»
  alternative: «моей женой»
  rationale: Исходная форма допускает значения «женщина» и «жена», но слово «женщина» точнее сохраняет словесную связь с «мужчиной» и не устраняет лексическую напряжённость текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Формула «кость от костей моих и плоть от плоти моей» сохранена ради образности и межтекстовой узнаваемости; архаизмы сведены к минимуму.
