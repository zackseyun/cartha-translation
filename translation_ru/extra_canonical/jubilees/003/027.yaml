  text: And on that day the mouths of all the beasts and cattle and birds and whatever walks and whatever moves were closed from speech, for they all used to speak with one another, with one lip and one tongue.
translation:
  language: ru
  text: И в тот день уста всех зверей, скота, птиц — всего, что ходит и что движется, — были закрыты для речи, потому что прежде все они говорили друг с другом одними устами и одним языком.
  philosophy: optimal-equivalence
