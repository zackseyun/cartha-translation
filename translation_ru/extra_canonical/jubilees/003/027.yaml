- source_word: ተፈጽመ፡ አፈ
  choice: уста… замкнулись и лишились речи
  rationale: Передаёт буквальный образ закрывшихся уст и поясняет его значение в данном контексте — прекращение способности говорить.
- source_word: አራዊት፡ ወዘእንስሳ፡ ወዘአዕዋፍ
  choice: зверей, скота, птиц
  rationale: Сохраняет перечисление диких животных, домашних животных и птиц.
- source_word: ዘያንሶሱ፡ ወዘይትሐወስ
  choice: всего, что ходит и что движется
  rationale: Формально сохраняет два близких по смыслу обозначения движения, не сливая их в одно.
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
  choice: одними устами и на одном языке
  rationale: Сохраняет парный семитский образ; «язык» во второй части естественно передаёт как орган речи, так и общий язык общения.
