  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: ru
  text: пока не завершит эти дни, положенные при рождении мальчика. А после рождения девочки она будет в своей нечистоте две недели, как в первые две недели, и шестьдесят шесть дней будет оставаться в крови своего очищения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: недели
  rationale: В контексте установлений об очищении это периоды по семь дней; современное русское «недели» ясно и точно передаёт смысл.
- source_word: ዘበተባዕት
  choice: после рождения мальчика
  rationale: Буквальное «для мужского пола» по-русски неестественно; контекст родов позволяет естественно выразить подразумеваемое значение, не меняя содержания.
- source_word: ዘበአንስት
  choice: после рождения девочки
  rationale: Эллиптическое противопоставление ребёнку мужского пола раскрыто по-русски как указание на рождение девочки.
- source_word: በርኵሳ
  choice: в своей нечистоте
  rationale: Сохранено культовое значение «нечистота» и притяжательный суффикс женского рода.
- source_word: በደመ፡ ንጽሓ
  choice: в крови своего очищения
  rationale: Формулировка сохраняет конкретный образ крови и притяжательное значение исходного текста, не подменяя его толкованием.
theological_decisions:
- issue: Культовая нечистота после родов
  choice: Сохранить термин «нечистота» без нравственной окраски или поясняющего толкования.
  alternative: Передать как «ритуальная нечистота».
  rationale: В исходном тексте прилагательное «ритуальная» прямо не выражено; контекст сам указывает на обрядово-культовый смысл.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Эллиптические выражения о ребёнке мужского и женского пола раскрыты естественно для русского читателя. Граница стиха соблюдена: итоговая фраза о восьмидесяти днях, относящаяся к следующему стиху, не включена.'
