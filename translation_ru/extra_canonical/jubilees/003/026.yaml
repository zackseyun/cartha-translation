base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/026.yaml
  text: And on that day on which Adam went out from the garden[a], he burned incense as a sweet fragrance—frankincense, galbanum, stacte, and spices—in the morning with the rising of the sun, from the day when he covered his shame.
translation:
  language: ru
  text: В тот день, когда Адам вышел из Эдемского сада, он утром, при восходе солнца, воскурил благовония с приятным ароматом — ладан, гальбан, стакти и пряности[a] — с того дня, когда прикрыл свою наготу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия некоторых ароматических веществ в этом перечне текстуально не вполне ясны; общий смысл — благовонное воскурение, совершённое при восходе солнца после того, как Адам прикрыл свою наготу.
    reason: textual_variant
lexical_decisions:
- source_word: ዐጠነ፡ ለመዐዛ፡ ሠናይ
  choice: воскурил как приятное благоухание
  rationale: Передаёт культовое воскурение и буквально сохраняет указание на приятный запах, не уточняя адресата жертвы, который в тексте не назван.
- source_word: ዕጣነ፡ ስኂነ፡ ወቀንአተ፡ ወማየ፡ ልብን፡ ወሰንበለ
  choice: ладан, гальбан, стакти и другие благовония
  rationale: Традиционные соответствия передают общий смысл перечня ароматических веществ; обобщающее «другие благовония» естественно по-русски, тогда как распознавание отдельных геэзских названий текстуально затруднено.
- source_word: እምዕለተ፡ ከደነ፡ ኀፍረቶ
  choice: начиная с того дня, когда он прикрыл свою наготу
  rationale: Сохраняет исходное «с того дня» и связь обряда с прикрытием наготы, не превращая выражение в простое указание на один и тот же день.
theological_decisions:
- issue: Характер действия Адама
  choice: воскурил как приятное благоухание
  alternative: принёс Богу благовонную жертву
  rationale: Источник описывает воскурение и благоухание, но в этом предложении прямо не называет ни Бога адресатом, ни действие жертвоприношением; поэтому богословское уточнение не добавлено.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Воскурил» сохранено как понятный культовый термин; синтаксическая необычность заключительного «начиная с того дня» удерживает формулировку источника.
