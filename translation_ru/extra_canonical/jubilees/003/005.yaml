translation:
  language: ru
  text: Бог пробудил Адама ото сна; проснувшись, Адам встал в шестой день, и Бог привёл женщину к нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነቅሆ (ʾanaqəho)
  choice: пробудил
  rationale: Каузативная форма передаёт действие того, кто разбудил Адама; «пробудил» сохраняет достоинство повествовательного стиля.
- source_word: እምነዋሙ (ʾəm-nawāmu)
  choice: ото сна
  rationale: Естественный современный русский эквивалент исходной конструкции «из его сна».
- source_word: ተንሥአ (tanśəʾa)
  choice: встал
  rationale: Основное значение — «поднялся, встал»; здесь оно лучше всего соответствует последовательности пробуждения и вставания.
- source_word: በዕለት ሣድስት (ba-ʿəlat śādəs(t))
  choice: в шестой день
  rationale: Формально и ясно передаёт временное указание источника.
- source_word: ወአብጽሓ ኀቤሁ (wa-ʾabṣəḥā ḫabehu)
  choice: и Бог привёл женщину к нему
  rationale: Глагольная форма включает женский объект «её»; существительное «женщину» проясняет референт, а повтор «Бог» устраняет неестественную для русского языка смену референта местоимения «он».
theological_decisions:
- issue: Подразумеваемый субъект пробуждения Адама и приведения женщины
  choice: Бог
  alternative: «Он»
  rationale: Субъект продолжается из непосредственно предшествующего контекста, где действует Господь Бог. Явное «Бог» в русском устраняет двусмысленность между Богом и Адамом, не добавляя нового богословского содержания.
- issue: Референт женского объектного суффикса
  choice: женщина
  alternative: «её»
  rationale: В контексте речь идёт о только что созданной женщине. Называние референта делает отдельный стих понятным и соответствует исходной грамматике.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской повествовательной интонацией. Повтор имени «Адам» и слова «Бог» выбран ради ясности субъектов; точка с запятой сохраняет тесную связь последовательных действий.
