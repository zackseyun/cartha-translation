lexical_decisions:
- source_word: ውስተ፡ ገነት፡ ኤዶም
  choice: в Эдемском саду
  rationale: Естественная русская передача сочетания «в саду Эдема» при сохранении традиционного названия места.
- source_word: ይትቀነይ
  choice: возделывая
  rationale: Передаёт работу Адама в саду; соответствует сельскохозяйственному смыслу глагола в данном контексте.
- source_word: የዐቅብ
  choice: храня
  rationale: Сохраняет широкий смысл «беречь, охранять, хранить», не сводя действие только к физической охране.
- source_word: ሰብዐተ፡ ዓመተ
  choice: семь лет
  rationale: Прямая и естественная передача указанного срока.
theological_decisions:
- issue: Характер поручения Адаму в саду
  choice: «возделывая и храня его»
  alternative: «обрабатывая и охраняя его»
  rationale: Выбрана формулировка, сохраняющая два различных действия и традиционную библейскую многозначность «хранить», без добавления толкования о характере угрозы или охраны.
