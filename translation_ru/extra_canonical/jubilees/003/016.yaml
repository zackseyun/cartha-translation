  text: ወምግባረ፡ ወሀብናሁ፡ ወሀሎነ፡፳፪ እንዘ፡ ንሜህሮ፡ *ገቢሮተ፡ ኵሉ፡፳፫ ዘይስተርኢ፡ ለቅኔ። ወሀሎ፡ እንዘ፡ ይትቀነይ፡ ወውእቱሰ፡ ዕራቁ፡፳፬ ወኢያአምር፡ ወኢየኀፍር፡ ወየዐቅብ፡ ገነት፡'' እምአዕዋፍ፡ ወእምአራዊት፡ ወእምእንስሳ፡ ወያስተጋብእ፡ ፍሬሁ፡ ወይበልዕ፡ ወያነብር፡ ተረፎ፡፳፭ ሎቱ፡
