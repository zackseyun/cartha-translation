base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: ru
  text: И мы дали ему работу и научили его делать всё, что подобает при возделывании[a]. Он возделывал сад, был наг, не знал этого и не стыдился. Он охранял сад от птиц, диких зверей и скота, собирал его плоды и ел, а оставшееся сохранял для себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и наставляли его во всём, что относится к возделыванию».'
    reason: Геэзская конструкция допускает несколько способов связать «наставлять», «делать всё» и «подобающее для труда/служения».
lexical_decisions:
- source_word: ምግባረ
  choice: работу
  rationale: Передаёт данное Адаму занятие или труд без чрезмерного уточнения его характера.
- source_word: ገቢሮተ፡ ኵሉ፡ ዘይስተርኢ፡ ለቅኔ
  choice: делать всё, что подобает при возделывании
  rationale: Сохраняет значение инфинитива «делать», идею подобающего/пригодного и связь с трудом по возделыванию, оставаясь естественным по-русски.
- source_word: ይትቀነይ
  choice: возделывал сад
  rationale: По контексту обозначает исполнение порученного труда в саду; дополнение «сад» делает русскую фразу ясной и поддерживается последующим упоминанием сада.
- source_word: ዕራቁ
  choice: наг
  rationale: Краткое и достоинственное соответствие значению «обнажённый» в библейском регистре.
- source_word: የዐቅብ፡ ገነት
  choice: охранял сад
  rationale: Точно выражает действие сохранения и защиты сада.
- source_word: አራዊት … እንስሳ
  choice: диких зверей и скота
  rationale: Сохраняет проведённое источником различие между дикими животными и домашним скотом.
- source_word: ያነብር፡ ተረፎ፡ ሎቱ
  choice: оставшееся откладывал себе
  rationale: Передаёт как сохранение остатка, так и конечное местоименное значение «для себя».
theological_decisions:
- issue: Неосознание наготы до появления стыда
  choice: был наг, но не знал этого и не стыдился
  alternative: был наг, не сознавал этого и не испытывал стыда
  rationale: Буквальная последовательность источника сохранена без попытки объяснить психологический или богословский смысл незнания.
- issue: Кто говорит от первого лица множественного числа
  choice: сохранено «мы» без пояснения
  alternative: уточнить говорящих как ангелов
  rationale: В самом стихе субъект не назван, поэтому перевод не вводит толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но последовательность действий и повторяющаяся структура источника сохранены; богословская неоднозначность не устранена.
