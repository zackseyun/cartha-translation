  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: ru
  text: 'И проклял Господь змея и разгневался на него навеки. Разгневался Он и на женщину, потому что она послушалась голоса змея и ела. И сказал Он ей: «Я многократно умножу твою скорбь и твои муки; в скорби будешь рождать детей; к мужу твоему будет твоё стремление, и он будет властвовать над тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርዌ፡ ምድር
  choice: змей
  rationale: Буквально выражение означает «змей земли»; в данном повествовательном контексте естественное русское соответствие — «змей».
- source_word: ትምዕዖ
  choice: разгневался
  rationale: Передаёт направленный на змея гнев Господа; последующая форма о женщине повторяет ту же смысловую линию.
- source_word: ኀዘንኪ፡ ወለፃዕርኪ
  choice: твою скорбь и твои муки
  rationale: Сохраняет два близких, но не тождественных обозначения страдания, не сводя их к одному понятию.
- source_word: ኀበ፡ ምትኪ፡ ምግባእኪ
  choice: к мужу твоему будет твоё стремление
  rationale: Контекстуально выражение обозначает направленность или влечение к мужу; формулировка сохраняет некоторую смысловую открытость и звучит естественно по-русски.
- source_word: ይኴነኪ
  choice: будет властвовать над тобой
  rationale: Передаёт управление или господство мужа над женщиной без смягчения напряжённости исходного высказывания.
theological_decisions:
- issue: Характер слов о женщине
  choice: Сохранить как прямую речь Господа после сообщения о Его гневе
  alternative: Представить слова только как безличное описание последствий
  rationale: Эфиопский текст прямо вводит их формулой «и сказал ей», поэтому перевод не должен устранять личный и судебный характер высказывания.
- issue: Отношение женщины к мужу
  choice: «к мужу твоему будет твоё стремление»
  alternative: «к мужу твоему будет твоё возвращение»
  rationale: «Стремление» лучше передаёт вероятную направленность желания и не вводит конкретную идею возвращения, которая в контексте не разъясняется.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис слегка приподнят, но остаётся понятным; повтор глагола «разгневался» сохранён ради ясности и связи двух судебных высказываний.
