  text: Therefore a man and a woman shall be one, and therefore a man shall leave his father and his mother and join to his wife, and they shall become one flesh.
translation:
  language: ru
  text: Поэтому мужчина и женщина будут одним; поэтому мужчина оставит отца и мать, соединится со своей женой, и они станут одной плотью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ ወብእሲት
  choice: мужчина и женщина
  rationale: Сохраняет явное парное обозначение мужчины и женщины в геэзском тексте и звучит естественно по-русски.
- source_word: ይጻመር
  choice: соединится
  rationale: Передаёт присоединение и тесное единение с женой без излишне специальной или конфессиональной окраски.
- source_word: ሥጋ አሐደ
  choice: одной плотью
  rationale: Традиционное и точное библейское соответствие выражению «одна плоть», сохраняющее его телесную и брачную многозначность.
theological_decisions:
- issue: Характер утверждения о единстве мужчины и женщины
  choice: «будут одним»
  alternative: «да будут едины»
  rationale: Форма будущего времени ближе к исходной конструкции и не превращает её без необходимости в прямое повеление.
- issue: Отношение брачного единения к родителям
  choice: «оставит отца и мать»
  alternative: «покинет своего отца и свою мать»
  rationale: Сохраняет сильную формулировку источника, не уточняя сверх текста, означает ли она пространственное отделение или изменение первичной семейной привязанности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «поэтому» сохранён как структурная особенность источника; местоимение «они» добавлено перед «станут» для естественного русского синтаксиса.
