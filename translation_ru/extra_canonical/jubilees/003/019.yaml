base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: ru
  text: 'Бог сказал нам: «Не ешьте от него и не прикасайтесь к нему, иначе вы умрёте». А змей сказал женщине: «Вы вовсе не умрёте, ведь Бог знает: в тот день, когда вы поедите от него, ваши глаза откроются, и вы станете как боги и познаете добро[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнаете, что хорошо».'
    reason: Отмечает возможную предикативную передачу выражения ወታአምሩ፡ ሠናየ, не заменяя основную буквальную формулировку.
lexical_decisions:
- source_word: አርዌ፡ ምድር
  choice: змей
  rationale: Буквально «змей земли»; в данном контексте естественное русское обозначение — «змей», без избыточного и неясного уточнения «земной».
- source_word: አኮ፡ ሞተ፡ ዘትመውቱ
  choice: Нет, вы не умрёте
  rationale: Идиоматически передаёт эмфатическое отрицание смерти, сохраняя прямое противоречие словам Бога.
- source_word: ይትረኀዉ፡ አዕይንቲክሙ
  choice: ваши глаза откроются
  rationale: Сохраняет образ и пассивную форму исходного выражения.
- source_word: ትከውኑ፡ ከመ፡ አማልክት
  choice: вы станете как боги
  rationale: Множественное «боги» непосредственно соответствует форме አማልክት; двусмысленность между божественными существами и Богом не снимается пояснением в тексте.
- source_word: ወታአምሩ፡ ሠናየ
  choice: и познаете добро
  rationale: Передаёт ወታአምሩ как личную глагольную форму «и вы узнаете/познаете», а ሠናየ — как субстантивированное «добро».
theological_decisions:
- issue: Значение выражения «как боги»
  choice: как боги
  alternative: как Бог / как божественные существа
  rationale: Исходная форма имеет множественное число; перевод не отождествляет её безоговорочно ни с единым Богом, ни с ангелами.
- issue: Объём обещанного знания
  choice: познаете добро
  alternative: будете знать, что хорошо
  rationale: Сохранён необычный объект «добро» без добавления отсутствующего в данном стихе «и зло».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы множественного числа сохранены в речах обоих персонажей; кавычки оформлены с учётом того, что первая реплика Бога цитируется внутри речи женщины.
