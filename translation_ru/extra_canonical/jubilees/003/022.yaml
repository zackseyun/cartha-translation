  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: ru
  text: Адам съел, и открылись его глаза, и он увидел, что наг. Тогда он взял листья смоковницы, сшил их, сделал себе покров и прикрыл свою наготу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  choice: И он съел
  rationale: Передаёт явный начальный глагол источника, опущенный в прежней редакции; объект в данном стихе не назван.
- source_word: ቈጽለ፡ በለስ
  choice: листья смоковницы
  rationale: Точное и естественное соответствие сочетанию «листья смоковницы».
- source_word: ምርአ
  choice: покров
  rationale: Контекст обозначает сделанное из листьев прикрытие; нейтральное «покров» не уточняет его форму сверх источника.
- source_word: ኀፍረቶ
  choice: свою наготу
  rationale: В контексте это телесная нагота, вызывающая стыд; русский оборот естественно передаёт смысл без избыточного толкования.
theological_decisions:
- issue: Связь прозрения с вкушением
  choice: 'Сохранена последовательность: «съел — открылись глаза — увидел»'
  alternative: Сгладить причинно-временную последовательность или опустить вкушение
  rationale: Источник прямо перечисляет эти события; перевод не усиливает и не ослабляет их богословскую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союзное начало и последовательность кратких предложений сохраняют ритм оригинала; «нагота» предпочтена более архаичному или эвфемистическому обозначению.
