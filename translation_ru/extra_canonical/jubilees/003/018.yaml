  text: …of the garden God commanded you, saying, ‘Do not eat from it.’ And she said to him, “From all the fruit of the trees of the garden God said to us, ‘Eat’; but from the fruit of the tree that is in the middle of the garden,”
translation:
  language: ru
  text: '…сада Бог заповедал вам, сказав: «Не ешьте от него».[a] И она сказала ему: «Бог сказал нам: „Ешьте плоды всех деревьев в саду“; а о плоде дерева, которое посреди сада…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих начинается внутри фразы, продолжая предшествующий контекст.
    reason: Предоставленный древнеэфиопский текст начинается с зависимого слова «сада».
  - marker: b
    text: Предоставленный текст стиха обрывается внутри речи женщины; её продолжение следует далее.
    reason: Источник заканчивается словами о дереве посреди сада, не завершая высказывание.
lexical_decisions:
- source_word: አዘዘክሙ
  choice: заповедал вам
  rationale: Передаёт значение повеления и сохраняет обращение во множественном числе.
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: не ешьте от него
  rationale: Сохраняет отрицательное повеление во множественном числе и местоименную отсылку к дереву или плоду.
- source_word: ወትቤሎ
  choice: И она сказала ему
  rationale: Глагольная форма указывает на говорящую женского рода и адресата мужского рода.
- source_word: ብልዑ
  choice: позволил нам есть
  rationale: Буквально повелительное «ешьте» встроено в естественную русскую косвенно-прямую конструкцию; смысл разрешения есть плоды всех деревьев сохранён.
- source_word: ዘማእከለ፡ ገነት
  choice: которое посреди сада
  rationale: Естественно передаёт пространственное выражение «которое в середине сада».
theological_decisions:
- issue: Противопоставление общего разрешения и запрета относительно центрального дерева
  choice: а плод дерева
  alternative: и плод дерева
  rationale: Союз «а» естественно выражает подразумеваемое контекстом противопоставление, не добавляя содержания самого запрета, отсутствующего в конце данного фрагмента.
- issue: Императив «ешьте» в речи Бога
  choice: Бог позволил нам есть
  alternative: 'Бог сказал нам: «Ешьте»'
  rationale: Выбрана естественная русская формулировка, передающая разрешительный смысл, без уточнения богословского характера заповеди.
