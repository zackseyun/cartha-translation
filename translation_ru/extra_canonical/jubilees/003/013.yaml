  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: ru
  text: 'Поэтому для женщины, родившей мальчика или девочку, было установлено предписание относительно этих дней: она не должна прикасаться ни к чему святому и не должна входить в святилище, пока…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: было установлено
  rationale: Передаёт значение установления или предписания нормы, сохраняя безлично-пассивную форму источника.
- source_word: ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት
  choice: для женщины, родившей мальчика или девочку
  rationale: Естественная русская передача оборота о роженице мужского или женского пола; контекстуально речь идёт о поле ребёнка.
- source_word: ፍትሖን
  choice: предписание
  rationale: В данном законодательном контексте слово обозначает установленную норму; «предписание» звучит ясно и не привносит конфессиональной терминологии.
- source_word: ቅዱሰ
  choice: ни к чему святому
  rationale: Сохраняет широкую предметную референцию источника и не сужает её до конкретных святынь или приношений.
- source_word: መቅደስ
  choice: святилище
  rationale: Точно передаёт сакральное место, не конкретизируя его как позднейший храм.
- source_word: እስከ፡ አመ
  choice: до того дня, когда…
  rationale: Отражает незавершённость стиха и его синтаксическое продолжение далее; многоточие ясно обозначает обрыв цитируемого фрагмента.
theological_decisions:
- issue: Характер нормы о послеродовой ритуальной нечистоте
  choice: предписание
  alternative: закон / устав
  rationale: Нейтрально передаёт нормативный характер текста, не усиливая ни юридический, ни конфессиональный оттенок.
- issue: Объект запрета на прикосновение
  choice: ни к чему святому
  alternative: никакой святыни
  rationale: Сохранена обобщённость источника, без отождествления со священными дарами, предметами или местами.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного повествования. Незавершённая конструкция в конце сохранена, поскольку исходный стих продолжается в следующем фрагменте.
