  choice: «из всех зверей и животных» относится к исключительности Адама
  alternative: «прикрыть свою наготу от всех зверей и животных»
  rationale: Порядок слов допускает формальное присоединение к глаголу «прикрыть», однако контекст и ограничительное «одному» вероятнее выражают отличие Адама от прочих живых существ. Альтернатива сохранена в примечании.
