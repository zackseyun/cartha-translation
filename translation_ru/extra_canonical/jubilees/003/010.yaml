- source_word: ጽላተ፡ ሰማይ
  choice: небесных скрижалях
  rationale: Точно передаёт устойчивое в Книге Юбилеев обозначение небесной записи и сохраняет возвышенный библейский регистр.
- source_word: ለእሙ፡ ተባዕተ
  choice: 'о роженице: если она родит мальчика'
  rationale: Контекстуально раскрывает краткую конструкцию о женщине, родившей ребёнка мужского пола, естественным современным русским языком.
- source_word: ርኵሳ
  choice: нечистой
  rationale: Передаёт состояние обрядовой нечистоты без добавления нравственной оценки.
- source_word: ደመ፡ ንጽሓ
  choice: крови очищения
  rationale: Сохраняет конкретный образ и юридико-ритуальную терминологию источника.
- source_word: መቅደስ
  choice: святилище
  rationale: Соответствует сакральному месту и не сужает значение до позднейшего храмового здания.
theological_decisions:
- issue: Характер нечистоты после родов
  choice: Оставлено ритуально-правовое «нечистой» без пояснения о нравственной вине.
  alternative: Добавить «ритуально нечистой».
  rationale: Источник говорит о культовом статусе; добавление уточнения в основной текст было бы толкованием, хотя выбранная формулировка в контексте святыни и святилища достаточно ясна.
- issue: Заключительная фраза о сроке для ребёнка мужского пола
  choice: «пока не завершатся эти дни, установленные при рождении мальчика»
  alternative: «пока она не завершит эти дни для мальчика»
  rationale: Выбран естественный русский оборот, сохраняющий присутствующий в источнике заключительный элемент и не создающий впечатления, будто женщина активно совершает сами дни.
