  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: ru
  text: 'И Господь сказал нам: «Нехорошо человеку быть одному. Создадим ему помощника, подобного ему». И Господь, Бог наш, навёл на него глубокий сон, и он уснул. Тогда Он взял для женщины одну кость из его костей, и это ребро из его костей послужило началом создания женщины[a]. На её месте Он нарастил плоть и создал женщину.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и это ребро было созданием женщины из его костей». Геэзская фраза эллиптична; возможно также: «и из этого ребра, из его костей, Он создал женщину».'
    reason: Сохраняет буквальную именную конструкцию источника и отмечает допустимое более связное понимание, не устраняя повторное упоминание ребра и происхождения из костей.
lexical_decisions:
- source_word: ሀናይ
  choice: хорошо
  rationale: В отрицательной конструкции передаёт обычную оценку «нехорошо», естественную для современного русского языка.
- source_word: መርዳእ፡ ዘከማሁ
  choice: помощника, подобного ему
  rationale: Сохраняет одновременно значение помощи и соответствия человеку, не уточняя сверх исходного текста характер этого соответствия.
- source_word: ህድመተ
  choice: глубокий сон
  rationale: Обозначает наведённое Богом состояние глубокого сна; это естественный и традиционно понятный русский эквивалент.
- source_word: ዐጽመ፡ አሐደ
  choice: одну кость
  rationale: Сначала источник употребляет общее слово «кость», поэтому оно не заменено преждевременно более конкретным «ребро».
- source_word: ገቦ
  choice: ребро
  rationale: Во втором упоминании источник использует конкретное слово «ребро»; различие между общей «костью» и «ребром» сохранено.
- source_word: ፍጥረት
  choice: началом создания
  rationale: Передаёт существительное со значением создания/возникновения и делает эллиптическую геэзскую фразу понятной по-русски, не сводя её к простому «сделал из него».
- source_word: ሐነጸ
  choice: нарастил / создал
  rationale: Глагол буквально связан со строительством. С плотью естественно «нарастил», а применительно к женщине — «создал»; повтор исходного глагола отражён параллельными действиями.
theological_decisions:
- issue: Множественное число в словах Бога «создадим»
  choice: Сохранено без пояснения, кто входит в это множественное число
  alternative: Истолковать как обращение к ангелам или как внутрибожественное высказывание
  rationale: Исходный текст оставляет адресата и богословское значение множественного числа неуточнёнными.
- issue: Отношение «кости» и «ребра» к созданию женщины
  choice: 'Сохранена последовательность источника: одна кость, затем уточнение «это ребро» и отдельное утверждение о создании женщины'
  alternative: Сжать до формулы «взял ребро и сделал из него женщину»
  rationale: Сжатый вариант удалил бы явно присутствующую в геэзском тексте повторную фразу о ребре и создании женщины из числа костей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён лишь там, где буквальное воспроизведение геэзской эллиптической конструкции было бы неясным; повторения и смысловые различия источника сохранены.
