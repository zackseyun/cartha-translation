base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: ru
  text: 'И в течение шести дней второй недели мы, по слову Господа, привели к Адаму всех диких зверей, весь домашний скот, всех птиц, всё движущееся по земле и всё движущееся в воде — по их родам и по их облику: диких зверей — в первый день, домашний скот — во второй день, птиц — в третий день, всё движущееся по земле — в четвёртый день, а движущееся в воде — в пятый день.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: в течение шести дней
  rationale: Передаёт буквальное значение геэзского выражения «в шесть дней / в течение шести дней» и согласуется с последующим перечислением нескольких дней.
- source_word: አራዊተ
  choice: дикие звери
  rationale: Отличает эту категорию животных от следующего за ней домашнего скота.
- source_word: እንስሳ
  choice: домашний скот
  rationale: В данном перечне обозначает домашних животных в противопоставлении диким зверям; слово «скот» без уточнения могло бы звучать шире или менее ясно.
- source_word: በበ፡ ዘመዶሙ
  choice: по их родам
  rationale: 'Сохраняет классификационный смысл: каждую группу приводили согласно её роду.'
- source_word: በበ፡ አምሳሎሙ
  choice: по их облику
  rationale: Передаёт значение подобия или внешней формы, не отождествляя его без необходимости с биологическим «видом».
- source_word: በቃለ፡ እግዚአብሔር
  choice: по слову Господа
  rationale: Естественно и достаточно формально передаёт действие, совершённое по Божьему слову или повелению.
theological_decisions:
- issue: Соотношение Божьего повеления и действия говорящих от первого лица множественного числа
  choice: «мы, по слову Господа, приводили»
  alternative: «по повелению Господа мы приводили»
  rationale: Сохранено явное «мы» источника и выражение «по слову Господа» без уточнения личности говорящих и без сведения «слова» исключительно к приказу.
