  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: ru
  text: 'для себя и для своей жены и хранил то, что надлежало хранить. Когда завершились семь лет, которые он провёл там, — ровно семь лет, — во втором месяце, в семнадцатый день[a], пришёл змей и приблизился к женщине. Змей сказал женщине: «Разве Бог повелел вам: „Не ешьте ни от какого дерева в саду“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дата указана точно: во втором месяце, в семнадцатый день, после семи полных лет в Эдеме. Такая подробная хронология характерна для книги Юбилеев и составляет часть её откровенческой структуры.'
    reason: cultural_note
lexical_decisions:
- source_word: ዘይትዐቀብ
  choice: то, что надлежало сохранить
  rationale: Передаёт пассивно-модальное значение причастной формы, не уточняя без достаточных оснований, что именно сохранялось.
- source_word: ሰብዓቱ … ሰብዓተ ዓመተ
  choice: семь лет … ровно семь лет
  rationale: Оба выражения содержат написанное словами числительное «семь»; знаки ፳፮ и ፳፯ относятся к критическому аппарату издания Charles, а не обозначают двадцать шесть и двадцать семь лет.
- source_word: አርዌ ምድር
  choice: земной змей
  rationale: Сохраняет явное определение «земли/земной» в геэзском тексте, хотя по-русски возможно более гладкое простое «змей».
- source_word: እምኵሉ ዕፀ
  choice: ни от какого дерева
  rationale: Естественно передаёт провокационный вопрос змея, сохраняя широкий охват выражения «от всякого/какого-либо дерева».
theological_decisions:
- issue: Формулировка вопроса змея о Божьей заповеди
  choice: '«Разве Бог повелел вам: „Не ешьте ни от какого дерева в саду“?»'
  alternative: '«Правда ли Бог сказал: „Не ешьте со всякого дерева в саду“?»'
  rationale: Выбранный вариант сохраняет вопросительную и искажающую заповедь формулировку источника, не превращая её ни в прямое утверждение, ни в более привычную формулу другого библейского перевода.
- issue: Точная хронология пребывания в Эдеме
  choice: семь завершившихся лет
  alternative: двадцать шесть лет … двадцать семь лет
  rationale: Числа 26 и 27 в представленном наборе — номера примечаний критического аппарата; сам геэзский текст дважды словесно указывает семь лет.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан естественным для русского читателя, но повтор «семь лет … ровно семь лет», выражение «земной змей» и намеренно широкий вопрос змея сохранены. Начало стиха оставлено как продолжение предыдущего предложения, поскольку источник начинается с фрагмента связной фразы.
