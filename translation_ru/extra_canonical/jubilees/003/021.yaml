translation:
  language: ru
  text: в пищу; и она взяла от него и съела. Сначала она прикрыла свою наготу фиговыми листьями, затем дала Адаму, и он съел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  choice: в пищу
  rationale: Передаёт назначение «для еды / в пищу» и сохраняет связь с предшествующим контекстом.
- source_word: እምኔሁ
  choice: от него
  rationale: Местоименная форма буквально означает «от него»; референт определяется предшествующим контекстом.
- source_word: ኀፍረታ
  choice: свою наготу
  rationale: В контексте после вкушения слово обозначает постыдную обнажённость; «наготу» естественно и точно передаёт смысл без излишнего уточнения.
- source_word: በቈጽለ፡ በለስ
  choice: фиговыми листьями
  rationale: Естественное русское соответствие выражению «листьями смоковницы / фиговыми листьями».
- source_word: ዘቀዳሚ
  choice: сначала
  rationale: 'Сохраняет явное временное значение «прежде, сначала» и порядок действий: сперва она прикрылась, после этого дала Адаму.'
theological_decisions:
- issue: Последовательность действий женщины
  choice: Сначала она прикрыла наготу, затем дала Адаму
  alternative: Она прикрыла наготу фиговыми листьями и также дала Адаму
  rationale: Форма ዘቀዳሚ указывает на первенство по времени; перевод «также» устранил бы выраженную исходным текстом последовательность.
translation_notes:
  register: Современный литературный русский с библейски достойным, но понятным строем. Начальная строчная буква и точка с запятой сохранены, поскольку стих начинается продолжением предыдущей фразы.
