  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: ru
  text: В первую седмицу был сотворён Адам[a], а из его ребра была создана его жена; во вторую седмицу Он показал её ему. Поэтому было дано повеление соблюдать при рождении мальчика семь дней, а при рождении девочки — две седмицы в состоянии нечистоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этой главе отсроченное вхождение Адама и женщины в Эдем связывается с последующими сроками послеродовой нечистоты при рождении мальчика и девочки.
    reason: cross_reference
lexical_decisions:
- source_word: ሳብዕት፡ ቀዳሚት / ሳብዕተ፡ ካልእተ
  choice: первая седмица / вторая седмица
  rationale: Сохраняет повторяющуюся семидневную структуру оригинала и отличает её от обычной календарной недели; «седмица» уместна в литературном библейском регистре.
- source_word: ገቦ ብእሲቱ
  choice: его жена — из ребра
  rationale: Передаёт сжатую и несколько эллиптическую конструкцию источника, связывающую жену Адама с ребром, не добавляя отсутствующего глагола «сотворена» повторно.
- source_word: ትእዛዝ
  choice: повеление
  rationale: Естественный и точный эквивалент предписания; не усиливает его до более специального термина «заповедь».
- source_word: ለዐቂብ
  choice: соблюдать
  rationale: Передаёт значение хранения или соблюдения установленного срока в нормативном контексте.
- source_word: ለተባዕት / ለአንስት
  choice: при рождении мальчика / при рождении девочки
  rationale: Контекст последующих стихов и параллель с Лев 12 показывают, что речь идёт о послеродовых сроках в зависимости от пола ребёнка; явное «при рождении» делает эллипсис понятным по-русски.
- source_word: ርኵስን
  choice: в нечистоте
  rationale: Сохраняет ритуально-правовой смысл термина без моральной окраски.
theological_decisions:
- issue: Основание послеродовых сроков нечистоты
  choice: Сохранена причинная связь между сроками сотворения/представления женщины и последующим повелением.
  alternative: Сделать связь менее прямой или представить её лишь как позднейшее толкование.
  rationale: Оригинал прямо вводит предписание формулой «поэтому»; перевод не должен ослаблять эту заявленную самим текстом типологическую связь.
- issue: Субъект фразы «показал её ему»
  choice: «Он» с прописной буквы, то есть Бог.
  alternative: Безличное «она была показана ему».
  rationale: Глагольная форма подразумевает субъект из ближайшего повествовательного контекста — Господа; местоимение сохраняет это чтение, не повторяя имени сверх текста.
- issue: Характер нечистоты
  choice: Передана просто как «нечистота», без пояснения «ритуальная» в основном тексте.
  alternative: «в ритуальной нечистоте».
  rationale: Термин и правовой контекст достаточны; добавление определения могло бы преждевременно снимать смысловую напряжённость древнего текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским регистром. «Седмица» выбрана ради точной семидневной структуры и парности формулировок; остальной синтаксис сделан ясным для современного читателя. Маркер [a] помещён непосредственно после упоминания сотворения Адама.
