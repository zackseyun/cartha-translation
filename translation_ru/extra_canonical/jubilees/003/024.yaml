  yaml_path: translation/extra_canonical/jubilees/003/024.yaml
  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: ru
  text: 'И Адаму Он сказал: «За то, что ты послушал голоса своей жены и ел от того дерева, о котором Я заповедал тебе: „Не ешь от него“, — проклята земля из-за тебя. Терния и колючки будет она произращать тебе, и ты будешь есть полевую траву в поте лица своего, пока не возвратишься в землю, из которой был взят, ибо ты — земля и в землю возвратишься».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ ብእሲትከ
  choice: голоса своей жены
  rationale: Сохраняет буквальный семитский оборот «слушать голос» и естественно передаёт смысл послушания.
- source_word: ርገምት፡ ትኩን፡ ምድር፡ በእንቲአከ
  choice: проклята земля из-за тебя
  rationale: Передаёт причинное значение በእንቲአከ без усиления до идеи личной выгоды или прямой вины земли.
- source_word: እከዋከ፡ ወአሜካሳ
  choice: терния и колючки
  rationale: Естественная русская пара для двух названий колючей растительности; точная ботаническая идентификация неочевидна.
- source_word: ሣዕስቲከ
  choice: полевую траву
  rationale: По контексту означает растительность или траву поля; добавление «полевую» делает связь с проклятой землёй ясной и соответствует параллели Быт 3:18.
- source_word: በሐፈ፡ ገጽከ
  choice: в поте лица своего
  rationale: Сохраняет образ исходного текста и привычное, но по-прежнему понятное русское выражение.
- source_word: ምድር፡ አንተ
  choice: ты — земля
  rationale: Следует именно эфиопскому тексту («земля»), не заменяя его более привычным по Быт 3:19 словом «прах».
theological_decisions:
- issue: Основание проклятия земли
  choice: «из-за тебя»
  alternative: «за тебя» / «по твоей вине»
  rationale: Формулировка сохраняет причинную связь с поступком Адама, не уточняя сверх текста характер вменения.
- issue: Антропологическая формула в конце
  choice: «ибо ты — земля»
  alternative: «ибо ты — прах»
  rationale: Перевод следует засвидетельствованному чтению Геэза, даже хотя каноническая параллель обычно известна в форме «прах».
- issue: Божественная речь и прописные местоимения
  choice: «Я заповедал тебе»
  alternative: «я заповедал тебе»
  rationale: Прописная форма соответствует принятому достоинственному русскому библейскому регистру и не добавляет конфессиональной интерпретации.
