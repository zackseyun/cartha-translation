base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: ru
  text: Когда для Адама завершились сорок дней на земле, где он был сотворён, мы ввели его в Эдемский сад, чтобы он возделывал и хранил его. А его жена была введена[a] по прошествии восьмидесяти дней, и после этого она вошла в Эдемский сад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его жену ввели».'
    reason: Форма третьего лица множественного числа может пониматься как неопределённо-личная либо как безличный пассив.
lexical_decisions:
- source_word: ተፈጸመ፡ ለአዳም፡ አርብዓ፡ መዋዕለ
  choice: для Адама завершились сорок дней
  rationale: Сохраняет временную формулу источника и связь периода именно с Адамом.
- source_word: አበአናሁ
  choice: мы ввели его
  rationale: Передаёт форму первого лица множественного числа; говорящие в контексте книги — ангельские повествователи.
- source_word: ይትቀነይ፡ ወይዕቀባ
  choice: чтобы он возделывал и хранил его
  rationale: Естественная русская передача парных глаголов со значениями обработки/служения и охраны сада.
- source_word: አብአ
  choice: была введена
  rationale: Третье лицо множественного числа в геэз может выполнять функцию безличного пассива; русский пассив не вводит неуказанного деятеля.
theological_decisions:
- issue: Кто ввёл жену Адама в сад
  choice: 'Сохранить деятеля невыраженным посредством пассива: «была введена»'
  alternative: «её ввели» или «мы ввели её»
  rationale: Форма источника отличается от предшествующего первого лица множественного числа. Пассив сохраняет эту разницу и не отождествляет деятелей без достаточного основания.
- issue: Соотношение введения и вхождения жены в сад
  choice: 'Сохранить оба последовательных выражения: «была введена… и после этого она вошла»'
  alternative: Объединить их в одно сообщение о входе
  rationale: Повтор присутствует в источнике и может отражать смысловое или текстуальное напряжение; его не следует молча устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным для широкого читателя, при этом сохранены временная схема, смена грамматического лица и повтор источника.
