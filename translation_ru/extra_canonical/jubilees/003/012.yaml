  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: ru
  text: Всего же будет восемьдесят дней. Когда она завершила эти восемьдесят дней, мы ввели её в Эдемский сад, потому что он святее всей земли и всякое посаженное в нём дерево свято.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውና፡ ኵሎን፡ ሰማንያ፡ መዋዕለ
  choice: Всего же будет восемьдесят дней
  rationale: Передаёт отдельное первое предложение, включая значение совокупности («всего») и перспективную форму «будет».
- source_word: አባእናሃ
  choice: мы ввели её
  rationale: Сохраняет форму первого лица множественного числа и каузативное значение движения внутрь, не уточняя, кто подразумевается под «мы».
- source_word: ገነት፡ ኤዶም
  choice: Эдемский сад
  rationale: Естественная современная русская форма традиционного библейского названия при точной передаче сочетания «сад Эдема».
- source_word: ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር
  choice: он святее всей земли
  rationale: Предлог እም в данном сравнительном обороте передан сравнительной степенью; местоимение согласовано по-русски со словом «сад».
- source_word: ወኵሉ፡ ዕፀ፡ ዘትከል
  choice: и всякое посаженное в нём дерево свято
  rationale: Передаёт обобщающее «всякое дерево» и причастное определение; «в нём» ясно отсылает к саду согласно контексту.
theological_decisions:
- issue: Кто говорит «мы ввели её»
  choice: Сохранено неопределённое «мы»
  alternative: Уточнить субъект как Бога, ангелов или небесных существ
  rationale: Исходный стих не называет участников первого лица множественного числа; их отождествление внесло бы в перевод интерпретацию.
- issue: Степень святости Эдемского сада
  choice: «святее всей земли»
  alternative: «свят среди/отделён от всей земли»
  rationale: Контекст и сравнительное употребление እም поддерживают сравнительную степень, при этом не объясняется богословская природа этой святости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён для ясности, но временная последовательность и повтор «восемьдесят дней» сохранены.
