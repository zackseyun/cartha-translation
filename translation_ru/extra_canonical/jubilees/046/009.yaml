  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: ru
  text: в земле Египта. И после него умерли все его братья. В сорок седьмой юбилей, во вторую седмицу, во второй год царь Египта выступил на войну с царём Ханаана; сыны Израиля вынесли кости всех сыновей Иакова, кроме костей Иосифа, и погребли их на поле, в двойной пещере[a] на горе,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «на поле двойной пещеры».'
    reason: Сохраняется засвидетельствованная синтаксическая неоднозначность связи между «полем» и «двойной пещерой», хотя повторение предлога поддерживает основной перевод.
lexical_decisions:
- source_word: እምድኅሬሁ
  choice: после него
  rationale: Точно передаёт временное значение выражения и сохраняет отсылку к Иосифу из предшествующего контекста.
- source_word: ይትቃተል
  choice: выступил на войну
  rationale: В контексте выхода царя для сражения это естественнее по-русски, чем буквальное «чтобы сражаться», при сохранении военного смысла.
- source_word: ሱባዔ
  choice: седмица
  rationale: Обозначает семилетний период в юбилейной хронологии; «седмица» сохраняет специальный календарный смысл, не сводя его к обычной неделе.
- source_word: ወአውፅኡ
  choice: вынесли
  rationale: Передаёт направленное перемещение останков из Египта, подразумеваемое контекстом.
- source_word: በዐት፡ ዘካዕበት
  choice: двойная пещера
  rationale: Формально отражает определение «двойная» и сохраняет традиционное обозначение пещеры Махпела без подстановки имени, которого в данном фрагменте нет.
theological_decisions:
- issue: Соотношение поля и двойной пещеры
  choice: «на поле, в двойной пещере»
  alternative: «на поле двойной пещеры»
  rationale: Дважды употреблённый предлог ውስተ указывает на два последовательных обстоятельства места. Основной текст не превращает их без достаточного основания в единую конструкцию принадлежности; альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмица» употреблён как специальное обозначение семилетнего цикла. Начальная и конечная фрагментарность, включая завершающую запятую, сохранена, поскольку предоставленный исходный текст начинается и заканчивается внутри более длинного предложения.
