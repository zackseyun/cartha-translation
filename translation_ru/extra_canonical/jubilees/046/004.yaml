lexical_decisions:
- source_word: እምታሕተ፡ ንጉሥ
  choice: при царе
  rationale: Передаёт положение «под властью царя» естественным современным русским оборотом; фрагмент синтаксически продолжает предшествующий контекст.
- source_word: እንዘ፡ ይኴንን
  choice: когда он правил
  rationale: Конструкция с እንዘ обозначает сопутствующее или одновременное действие; личное местоимение сохраняет неоднозначность референта исходного текста.
- source_word: ኵላ፡ ምድረ፡ ግብጽ
  choice: всей землёй Египетской
  rationale: Сохраняет полноту охвата и библейски достойное, но понятное обозначение Египта.
- source_word: ወሞተ
  choice: И умер он
  rationale: Прямо передаёт глагол смерти; порядок слов звучит литературно и связывает фразу с предыдущим предложением.
- source_word: ወኵሎሙ፡ አኅዊሁ
  choice: и все его братья
  rationale: Буквально передаёт сочинённую именную группу; конечная запятая показывает, что стих представляет собой незавершённый фрагмент продолжающегося предложения.
