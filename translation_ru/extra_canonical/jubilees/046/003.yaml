    rationale: Геэзская формула сообщает о периоде служения без уточнения его характера; «на службе» сохраняет эту широту и естественнее в современном русском.
  - severity: low
    issue: Сноска начинается со слова «Или», хотя цитируемая формулировка обозначена как прежняя передача, а не как вариант полного исходного текста.
    rationale: Удаление «Или» предотвращает впечатление, будто «в земле Египетской» — равноправное текстологическое чтение, и сохраняет требуемую информацию аудиторского следа.
