  rationale: Идиоматично передаёт буквальное «дом заключения» в современном литературном русском.
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን፡ ንጉሠ፡ ግብጽ
  choice: под властью фараона, царя Египта
