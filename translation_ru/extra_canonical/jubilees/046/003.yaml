  source_fidelity: 'Основной текст верно передаёт перечисление сроков жизни Иосифа: 17 лет в Ханаане, 10 лет служения, 3 года в темнице и 80 лет под властью фараона, царя Египта. Последняя формула соответствует полному окончанию эфиопского текста, отмеченному в английском аудиторском следе, а не прежнему предположительному дополнению «в земле Египетской».'
  naturalness: '«На службе» — более естественное современное литературное выражение, чем «в услужении», и не вносит бытового оттенка личной прислуги. Начальная строчная буква оправданна: стих продолжает предложение из предыдущего контекста.'
