  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: ru
  text: сынов Израиля во все дни жизни Иосифа. И умер Иосиф в возрасте ста десяти лет. Семнадцать лет он прожил в земле Ханаанской, десять лет провёл на службе, три года — в темнице, а восемьдесят лет находился под властью фараона, царя Египта.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежней передаче: «а восемьдесят лет — в земле Египетской».'
    reason: Сохраняет отмеченную в английском аудиторском следе прежнюю передачу, но не представляет её как альтернативу полному окончанию эфиопского текста.
