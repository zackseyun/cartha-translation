lexical_decisions:
- source_word: ዐጸወ፡ አንቀጸ፡ ግብጽ
  choice: запер врата Египта
  rationale: Глагол передаёт закрытие или запирание; «врата» естественно сочетаются с обозначением страны и сохраняют возвышенный повествовательный регистр.
- source_word: ሐለየ፡ እኩየ፡ ሕሊና
  choice: замыслил злое
  rationale: Буквальная конструкция близка к «помыслил злую мысль»; выбран естественный русский оборот, сохраняющий намеренный и нравственно отрицательный характер замысла.
- source_word: ላዕለ፡ ውሉደ፡ እስራኤል
  choice: против сынов Израиля
  rationale: Предлог выражает направленность враждебного замысла, а традиционное «сыны Израиля» точно передаёт родовое обозначение народа.
- source_word: ከመ
  choice: чтобы…
  rationale: Союз вводит цель или предполагаемый результат; многоточие показывает, что синтаксическая конструкция продолжается в следующем стихе.
