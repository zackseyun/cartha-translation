lexical_decisions:
- source_word: ይቀንይዎሙ
  choice: их принуждали трудиться
  rationale: Каузативная форма передаёт понуждение к службе или труду; в контексте египетского порабощения естественное русское соответствие — «принуждали трудиться».
- source_word: በግፍዕ
  choice: силой
  rationale: Слово обозначает насилие, притеснение или принуждение; «силой» кратко и ясно передаёт способ понуждения.
- source_word: ያሐስሙ፡ ላዕሌሆሙ
  choice: их угнетали
  rationale: Оборот выражает жестокое, тягостное обращение с людьми; «угнетали» сохраняет смысл притеснения и сравнительную конструкцию.
- source_word: መጠነ ... ከማሁ
  choice: чем больше ... тем больше
  rationale: Сохранена соотносительная сравнительная конструкция и её намеренная незавершённость на границе стиха.
