  to: …в Египте и убил его там; затем он преследовал их до Египта, до входа в Эромон. Но войти он не смог, потому что над Египтом воцарился другой, новый царь, который был сильнее его. Тогда он возвратился в землю Ханаанскую, а ворота Египта были заперты, и никто не выходил из Египта и никто не входил в него.
  rationale: Исправлено только оформление начального обрывка, чтобы русский текст не превращал «Египет» в деятеля убийства. Многоточие честно показывает, что стих начинается посреди повествовательной конструкции; предложная форма «в Египте» передаёт локальное значение без реконструкции отсутствующего в данном сегменте глагола. Иные смысловые решения сохранены.
