translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Начальный фрагмент намеренно сохранён как продолжение предыдущего стиха. Неясный топоним «Эромон» транслитерирован. Пассивность закрытия ворот и возвращение в Ханаан переданы согласно геэзскому тексту, без прежнего альтернативного истолкования.
