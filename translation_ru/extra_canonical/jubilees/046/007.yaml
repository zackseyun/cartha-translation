base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/007.yaml
  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
translation:
  language: ru
  text: …в Египте и убил его там; затем он преследовал их до Египта, до входа в Эромон. Но войти он не смог, потому что над Египтом воцарился другой, новый царь, который был сильнее его. Тогда он возвратился в землю Ханаанскую, а ворота Египта были заперты, и никто не выходил из Египта и никто не входил в него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዴገነ፡ ድኅሬሆሙ
  choice: затем он преследовал их
  rationale: Сохраняет выраженный в тексте объект во множественном числе и передаёт действие естественным современным русским языком.
- source_word: እስከ፡ አንቀጸ፡ ኤሮሞን
  choice: до входа в Эромон
  rationale: Буквально передаёт конструкцию с «входом/вратами», не отождествляя неясный топоним Эромон с иным местом.
- source_word: ነግሠ፡ ካልእ፡ ሐዲስ፡ ንጉሥ፡ ለግብጽ
  choice: над Египтом воцарился другой, новый царь
  rationale: Передаёт восшествие нового царя на престол и отношение власти над Египтом; сохраняет оба определения — «другой» и «новый».
- source_word: ወገብአ፡ ምድረ፡ ከናአን
  choice: Тогда он возвратился в землю Ханаанскую
  rationale: Глагол ገብአ здесь означает возвращение; русский союз «тогда» ясно связывает его с невозможностью войти, не меняя смысла.
- source_word: ወተዐጽወ፡ አንቀጸ፡ ግብጽ
  choice: а ворота Египта были заперты
  rationale: Форма глагола пассивна; перевод не приписывает закрытие ворот преследователю.
- source_word: ወአልቦ፡ ዘይወፅእ፡ ወአልቦ፡ ዘይበውእ
  choice: и никто не выходил ... и никто не входил
  rationale: Сохраняет симметричную отрицательную формулу оригинала в естественной русской форме.
