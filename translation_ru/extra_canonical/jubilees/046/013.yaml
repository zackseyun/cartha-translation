  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: ru
  text: 'И он притеснял их и сказал народу Египта: «Вот, народ сынов Израиля многочисленнее и сильнее нас. Давайте поступим с ними хитро, прежде чем они умножатся[a], и будем притеснять их подневольным трудом, как бы не началась война и они не присоединились к нашим врагам и не ушли из нашей земли, ведь их сердца и лица обращены к земле Ханаанской».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как бы они не умножились».'
    reason: Конструкция в данном месте прежде всего имеет временное значение «прежде чем»; английский аудиторский след также отмечает контекстуально возможное значение опасения.
lexical_decisions:
- source_word: ያሕምሞሙ / ናሕምሞሙ
  choice: «притеснял их» / «будем притеснять их»
  rationale: Сохранён повтор одного и того же глагола со значением причинения страдания и угнетения; «притеснять» естественно передаёт систематическое угнетение в данном контексте.
- source_word: ሕዝበ፡ ውሉደ፡ እስራኤል
  choice: «народ сынов Израиля»
  rationale: Передана исходная родительная конструкция; традиционное и понятное русское выражение сохраняет связь с Израилем и коллективный смысл.
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: «поступим с ними хитро»
  rationale: Формально выражение связано с мудростью, но в контексте замысла против Израиля имеет значение расчётливой хитрости; русская формулировка сохраняет эту отрицательную окраску.
- source_word: በቅኔ
  choice: «подневольным трудом»
  rationale: Передаёт повинность и принудительное служение без неоправданного сужения до домашнего рабства.
- source_word: ይወፅኡ፡ እምድርነ
  choice: «не ушли из нашей земли»
  rationale: Глагол означает выход или уход, а не восхождение; перевод следует геэзскому тексту и не гармонизирует его с иным чтением Исх. 1:10.
- source_word: ልቦሙ፡ ወገጾሙ፡ ውስተ፡ ምድረ፡ ከናአን
  choice: «их сердца и лица обращены к земле Ханаанской»
  rationale: Сохранён выразительный парный образ внутреннего желания и внешней направленности; добавленное «обращены» делает фразу естественной по-русски, не устраняя метафору.
theological_decisions:
- issue: Значение ዘእንበለ перед «умножатся»
  choice: «прежде чем они умножатся»
  alternative: «как бы они не умножились» / «чтобы они не умножались»
  rationale: Основное временное значение конструкции — «прежде чем»; альтернативное целевое понимание возможно по контексту замысла фараона и отмечено в сноске, а не внесено молча в основной текст.
- issue: Направление ухода Израиля
  choice: «ушли из нашей земли»
  alternative: «вышли из нашей земли»
  rationale: Оба варианта передают исходный глагол выхода; «ушли» естественнее в русском контексте опасения об оставлении страны и не вводит отсутствующее значение «поднялись».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены повтор глагола притеснения, коллективное обозначение Израиля и образ «сердец и лиц», но синтаксис сделан понятным обычному читателю.
