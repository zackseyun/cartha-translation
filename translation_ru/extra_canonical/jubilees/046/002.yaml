  rationale: 'Убрано невыраженное в исходнике слово «смерти», чтобы не снимать неоднозначность временного оборота. Относительное значение «которые он прожил» сохранено в более естественной русской форме «прожитые им». Примечание b удалено как более не нужное: основной текст теперь прямо воспроизводит исходную формулу без добавочной конкретизации.'
