base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: ru
  text: И не было ни противника[a], ни какого-либо зла во все дни жизни Иосифа, прожитые им после его отца Иакова, потому что весь Египет почитал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сатаны».'
    reason: В исходном слове возможно как нарицательное, так и личное значение.
lexical_decisions:
- source_word: ሰይጣን
  choice: противника
  rationale: Слово может обозначать как противника вообще, так и Сатану; по контексту отсутствия вражды и бедствий нейтральное «противник» сохраняет неоднозначность без неоправданной персонификации.
- source_word: ምንተኒ፡ እኩየ
  choice: какого-либо зла
  rationale: Передаёт сочетание со значением «что-либо злое / никакое зло» естественной русской конструкцией после отрицания.
- source_word: ያከብ
  choice: почитал
  rationale: Передаёт значение оказания чести и уважения; объект «его» восстановлен по смыслу и грамматике контекста.
theological_decisions:
- issue: Является ли ሰይጣን именем Сатаны или нарицательным обозначением противника
  choice: противника с примечанием
  alternative: Сатаны
  rationale: Контекст не требует однозначного отождествления с личным Сатаной; примечание сохраняет доступной вторую возможность.
- issue: Значение выражения «после своего отца Иакова»
  choice: после смерти своего отца Иакова
  alternative: после своего отца Иакова
  rationale: В данном контексте выражение означает период, когда Иосиф пережил отца; добавление «смерти» делает это значение естественным по-русски, а буквальная форма сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с простым, торжественным повествовательным строем. Относительное предложение «которые он прожил» сохранено, поскольку оно прямо представлено в исходном тексте; повтор «во все дни жизни» отражает семитскую манеру повествования.
