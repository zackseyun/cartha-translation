  rationale: Сохраняет указательное значение ይእቲ и собирательный смысл выражения.
- source_word: ወአዘዞሙ፡ ለውሉደ፡ እስራኤል
  choice: И он повелел сынам Израиля
  rationale: Прямо передаёт глагол повеления и традиционное, но понятное современному читателю обозначение потомков Израиля.
- source_word: ዘእንበለ፡ ይሙት
  choice: перед своей смертью
  rationale: Естественно по-русски передаёт временное значение «прежде чем он умер», не меняя субъекта.
- source_word: ከመ፡ ይስዱ
  choice: вынести…
  rationale: 'Форма выражает цель или содержание повеления: «чтобы они понесли/вынесли». Контекстуально «вынести» уместно, а многоточие показывает, что объект и продолжение находятся в следующем фрагменте.'
