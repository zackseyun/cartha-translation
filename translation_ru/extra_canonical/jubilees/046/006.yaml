translation:
  language: ru
  text: 'его кости в день, когда они выйдут из земли Египта. И он взял с них клятву относительно его костей, потому что знал: египтяне уже не вынесут его и не похоронят в земле Ханаана. Ибо Макмарон, царь Ханаана, живя в земле Ассирии, сражался в долине с царём…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеющийся текст стиха обрывается после слов «с царём»; предложение продолжается в следующем фрагменте.
    reason: Обозначает текстуальную незавершённость предоставленного исходного фрагмента, не восполняя отсутствующие слова догадкой.
lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: кости его
  rationale: Буквально передаёт форму «его кости» и сохраняет связь с предшествующим контекстом, хотя стих начинается с продолжения фразы.
- source_word: አምሐሎሙ
  choice: заставил их поклясться
  rationale: Каузативная форма выражает требование или понуждение принести клятву; такая формулировка естественна в современном русском.
- source_word: ምድረ፡ ግብጽ
  choice: земли Египетской
  rationale: Сохраняет библейскую географическую формулу, не делая язык чрезмерно архаичным.
- source_word: ማክማሮን
  choice: Макмарон
  rationale: Транслитерация имени собственно по данной эфиопской форме без отождествления с иным персонажем.
- source_word: በቈላ
  choice: в долине
  rationale: Передаёт топографическое значение слова без добавления отсутствующего в источнике названия местности.
theological_decisions:
- issue: К кому относится единственное число в выражении о вынесении и погребении
  choice: «не вынесут его и не похоронят»
  alternative: «не вынесут его кости и не похоронят их»
  rationale: Источник грамматически говорит о нём в единственном числе, тогда как кости упомянуты ранее; перевод сохраняет это напряжение и не заменяет референт поясняющей формулировкой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальный синтаксический фрагмент сохранён как продолжение предыдущего стиха; конечный обрыв явно отмечен. Географические сочетания «земля Египетская» и «земля Ханаанская» выдержаны в традиционной, но понятной форме.
