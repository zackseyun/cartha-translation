translation:
  language: ru
  text: Они становились многочисленнее и умножались. А египтяне испытывали отвращение к сынам Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считали сынов Израиля отвратительными».'
    reason: Эстимативно-каузативная форма допускает более буквальное понимание «считать отвратительными», хотя в данном контексте глагол, вероятнее всего, выражает отвращение самих египтян.
lexical_decisions:
- source_word: ይበዝኁ፡ ወከማሁ፡ ይፈደፍዱ
  choice: возрастали и так же умножались
  rationale: Сохранены два параллельных глагола со связующим значением ወከማሁ («и так же», «и подобным образом»), без усилительного смысла, которого текст прямо не выражает.
- source_word: ያስተረዙስዎሙ
  choice: испытывали отвращение к
  rationale: Глагол передаёт отношение самих египтян к израильтянам — отвращение, неприязнь, ненависть, — а не действие, делающее израильтян отвратительными для других.
- source_word: ሰብአ፡ ግብጽ
  choice: египтяне
  rationale: Естественный русский эквивалент буквального выражения «люди Египта».
- source_word: ለውሉደ፡ እስራኤል
  choice: к сынам Израиля
  rationale: Сохранено традиционное и понятное библейское обозначение народа Израиля.
theological_decisions: []
translation_notes:
