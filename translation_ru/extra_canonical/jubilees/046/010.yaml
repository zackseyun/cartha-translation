lexical_decisions:
- source_word: ወገብኡ፡ ብዙኃን፡ ውስተ፡ ግብጽ
  choice: И многие возвратились в Египет
  rationale: Передаёт глагол возвращения, количественное определение и направление движения естественным современным русским языком.
- source_word: ወኅዳጣን፡ ተርፉ፡ እምኔሆሙ
  choice: но немногие из них остались
  rationale: Сохраняет противопоставление многих и немногих; «остались» здесь естественно передаёт значение сохранения/пребывания остатка.
- source_word: ውስተ፡ ደብረ፡ [ኬብሮን]
  choice: в горах Хеврона
  rationale: Форма ደብረ является сопряжённой и требует последующего определения; согласно проверке границы стиха, подразумеваемое продолжение — «Хеврона». Русское «в горах Хеврона» естественнее буквального «на горе Хеврона» и сохраняет географический смысл.
