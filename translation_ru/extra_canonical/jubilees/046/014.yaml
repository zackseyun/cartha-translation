  source_fidelity: Последняя часть черновика заменяет прямо выраженное «построили» (ወሐነጹ፡) интерпретацией «восстановили». Хотя такой смысл может казаться контекстуально вероятным, исходный текст и английский контрольный текст сохраняют формулировку о строительстве и определение «которые обрушились». Его следует сохранить без гармонизирующего уточнения.
  naturalness: «Начальники работ», «укреплённые города», «Пифом и Раамсес» звучат естественно в современном литературном русском. Перестройка первого предложения с начальным «Он» немного плавнее. Буквальное заключительное определение несколько необычно логически, но допустимо и необходимо для сохранения текста.
  terminology: «Начальники работ» адекватно передаёт должностную функцию; «принудительным трудом» передаёт угнетающий характер повинности, не сужая его до определённой формы эксплуатации. Топонимы даны в привычных русских библейских формах. «Стены и насыпи» сохраняет два строительных объекта исходника.
