revisions:
- from: И поставил он над ними начальников работ, чтобы изнурять их подневольным трудом. Они построили для фараона укреплённые города — Пифом и Раамсес — и восстановили все обрушившиеся стены и насыпи.[a]
  to: Он поставил над ними начальников работ, чтобы изнурять их принудительным трудом. Они построили для фараона укреплённые города — Пифом и Раамсес. И они построили все стены и все насыпи, которые обрушились.
