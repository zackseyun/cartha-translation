  yaml_path: translation/extra_canonical/jubilees/046/014.yaml
  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: ru
  text: Он поставил над ними начальников работ, чтобы изнурять их принудительным трудом. Они построили для фараона укреплённые города — Пифом и Раамсес. И они построили все стены и все насыпи, которые обрушились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: начальников работ
  rationale: Буквально «главы/начальники работы»; в данном контексте это надсмотрщики, управлявшие принудительными работами. Выбран нейтральный и понятный современный эквивалент.
- source_word: በቅኔ
  choice: подневольным трудом
  rationale: Контекст указывает на тяжёлую принудительную службу и угнетение; перевод передаёт средство изнурения, не вводя более узкого конфессионального толкования.
- source_word: አህጉረ፡ ጽኑዓተ
  choice: укреплённые города
  rationale: Сочетание означает крепкие, укреплённые города; такая формулировка естественна по-русски и соответствует контексту строительства для фараона.
- source_word: ጲቶሃ፡ ወራምሴሃ
  choice: Пифом и Раамсес
  rationale: Использованы узнаваемые русские библейские формы египетских топонимов.
- source_word: ጥቆመ፡ ወኵሎ፡ ዐረፋተ
  choice: стены и насыпи
  rationale: Переданы два вида строительных сооружений в соответствии с контекстом восстановительных работ; точное разграничение второго термина не вполне надёжно.
- source_word: ዘወደቀ
  choice: обрушившиеся
  rationale: Причастная форма буквально связана с падением или обрушением. В русском предложении она естественно определяет оба однородных вида сооружений.
