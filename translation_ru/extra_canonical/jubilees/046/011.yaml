  text: Hebron; and your father Amram remained with them. And the king of Canaan defeated the king of Egypt.
translation:
  language: ru
  text: В Хевроне; твой отец Аврам[a] остался с ними. И царь Ханаана победил царя Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По контексту некоторые издания исправляют: «Амрам». В эфиопском тексте: «Аврам».'
    reason: Сохраняет засвидетельствованное чтение አብራም и одновременно сообщает о вероятной контекстуальной конъектуре, не выдавая её за текст источника.
lexical_decisions:
- source_word: አብራም
  choice: Амрам
  rationale: В эфиопском тексте буквально стоит «Абрам», однако по контексту речь идёт об Амраме, отце Моисея; вероятная писцовая ошибка исправлена в основном тексте и отмечена сноской.
- source_word: ወሞአ
  choice: И … победил
  rationale: Глагол ሞአ означает «победить, одолеть, взять верх», а не «умереть».
- source_word: ንጉሠ፡ ከናአን፡ ለንጉሠ፡ ግብጽ
  choice: царь Ханаана победил царя Египта
  rationale: Естественная русская передача конструкции, в которой царь Ханаана является победителем, а царь Египта — побеждённым.
