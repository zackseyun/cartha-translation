revisions:
- from: 'После смерти Иакова сыны Израиля умножились в земле Египетской и стали многочисленным народом. Все они были единодушны в своих сердцах[a]: каждый любил своего брата и помогал ему. Они чрезвычайно разрослись и весьма умножились — всего за десять седмин лет[b].'
  to: 'После смерти Иакова сыны Израиля умножились в земле Египта и стали многочисленным народом. Все они были единодушны в сердцах своих[a]: каждый любил своего брата и помогал ему. Они чрезвычайно разрослись и весьма умножились на протяжении всех десяти седмин лет[b].'
  rationale: Исправлен заключительный временной оборот, чтобы не добавлять оттенок «всего за» и передать итоговое «все» исходного текста. Лексика слегка модернизирована; повторное обозначение роста сохранено. Иосиф не добавлен, поскольку его имя не засвидетельствовано в предоставленном геэзском тексте.
