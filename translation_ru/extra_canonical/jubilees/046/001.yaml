base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: ru
  text: 'После смерти Иакова сыны Израиля умножились в земле Египта и стали многочисленным народом. Все они были единодушны в сердцах своих[a]: каждый любил своего брата и помогал ему. Они чрезвычайно разрослись и весьма умножились на протяжении всех десяти седмин лет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все были едины в сердцах своих».'
    reason: Передаёт прямо выраженное в исходном тексте указание на внутреннее единство, не навязывая менее определённый вариант значения.
  - marker: b
    text: То есть семидесяти лет.
    reason: Десять седмин лет составляют десять семилетних периодов.
lexical_decisions:
- source_word: በዝኁ
  choice: умножились / разрослись
  rationale: Глагол означает увеличение или умножение и дважды повторяется в заключительной части; перевод сохраняет повтор смысла, не подменяя второй случай значением «окрепли».
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: единодушны в своих сердцах
  rationale: Передаёт согласие и внутреннее единство, включая прямо выраженное уточнение «в их сердцах».
- source_word: ይትራዳእ
  choice: помогал
  rationale: Естественно передаёт взаимную поддержку между братьями без добавления специального богословского оттенка.
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት
  choice: десять седмин лет
  rationale: Сохраняет характерный древний способ счёта семилетними периодами; значение пояснено в сноске.
theological_decisions:
- issue: Упоминание Иосифа в английском консультационном тексте
  choice: Не добавлять «во все дни Иосифа»
  alternative: «во все дни Иосифа, в течение десяти седмин лет»
  rationale: В предоставленном тексте на геэзе имя Иосифа и соответствующая фраза отсутствуют; добавление создало бы содержание, не засвидетельствованное данным оригиналом.
- issue: Связь единодушия с братской любовью и помощью
  choice: Передать последующие действия как проявление единодушия
  alternative: Передать ከመ как строго целевое «для того чтобы»
  rationale: Конструкция допускает оттенок результата или пояснения; русский текст не превращает её в жёсткое утверждение о цели.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены «земля Египетская» и «седмины» как понятные контекстуальные библейские обороты; синтаксис упрощён для ясного чтения. Имя Иосифа не внесено, поскольку его нет в предоставленном тексте на геэзе.
