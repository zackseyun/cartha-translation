base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/023.yaml
  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: ru
  text: 'И она позвала Иакова на глазах у Исава и наставила его согласно тому, что говорила Исаву. Иаков сказал: «Я исполню твою волю. Поверь мне: ни от меня, ни от моих детей не будет зла Исаву, и ни в чём я не буду первым, кроме любви».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለዔሳው
  choice: на глазах у Исава
  rationale: Естественно передаёт буквальное «перед глазами Исава», сохраняя указание на его присутствие и свидетельство.
- source_word: ሥምረተኪ
  choice: твою волю
  rationale: Передаёт значение желания, угодного решения или воли адресата; в данном обещании это естественнее буквального «твоё удовольствие».
- source_word: ተሐበይኒ
  choice: Поверь мне
  rationale: Форма связана со значением веры и доверия; контекст требует просьбы принять последующее заверение, а не значения «скрой меня».
- source_word: ከመ፡ ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ፡ ላዕለ፡ ዔሳው
  choice: ни от меня, ни от моих детей не будет зла Исаву
  rationale: Сохраняет образ исходящего от говорящего и его потомков зла, но выражает его естественным современным русским языком.
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: и ни в чём я не буду первым, кроме любви
  rationale: 'Сохраняет первое лицо глагола и противопоставление: первенство допускается лишь в любви.'
theological_decisions:
- issue: Характер обещания Иакова в отношении Исава
  choice: Сохранено личное обещание не причинять зла и быть первым только в любви
  alternative: 'Обобщённое утверждение: «пусть ничто не предшествует нам, кроме любви»'
  rationale: Грамматика источника указывает на первое лицо единственного числа; поэтому нравственное обязательство относится непосредственно к Иакову, не превращаясь в отвлечённую максиму.
