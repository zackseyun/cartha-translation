  yaml_path: translation/extra_canonical/jubilees/035/025.yaml
  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: ru
  text: 'В шестой год этой седмины[a] Исаак позвал обоих своих сыновей, Исава и Иакова. Они пришли к нему, и он сказал им: «Сыновья мои, я ухожу путём моих отцов — в вечный дом, где пребывают мои отцы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этой семилетней недели».'
    reason: Поясняет, что «седмина» здесь означает семилетний период, а не обычную неделю.
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологической системе Книги Юбилеев слово обозначает семилетний период. «Седмина» сохраняет специальный смысл и связь с принятой библейской терминологией, не смешивая его с обычной календарной неделей.
- source_word: ዛቲ
  choice: этой
  rationale: Указательное местоимение передаёт непосредственное «этой», что соответствует характерной хронологической формуле текста.
- source_word: ቤት፡ ዘለዓለም
  choice: вечный дом
  rationale: Формально и естественно передаёт образное обозначение посмертного пребывания, не устраняя его богословскую неоднозначность.
- source_word: እሐውር፡ ውስተ፡ ፍኖተ፡ አበውየ
  choice: я ухожу путём моих отцов
  rationale: Сохраняет метафору ухода путём предков и её связь с приближающейся смертью, не заменяя образ пояснительным пересказом.
theological_decisions:
- issue: Значение выражения «вечный дом»
  choice: Сохранить образ буквально, без пояснения как могилы или загробного мира
  alternative: Передать как «последнее пристанище» или «могила»
  rationale: Источник оставляет природу этого места образно выраженной; конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Специальный хронологический термин «седмина» сохранён и пояснён в сноске; синтаксис сделан ясным для широкого читателя.
