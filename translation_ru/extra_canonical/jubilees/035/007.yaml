  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: ru
  text: '«И вот, я прожила все дни моей жизни, которые мне предстояло прожить». Иаков засмеялся из-за слов своей матери, потому что его мать сказала ему, что умрёт, а сама оставалась напротив него, была полна сил и не ослабела: она входила и выходила и видела…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: я прожила все дни жизни
  rationale: Буквально выражение означает «я завершила все дни моей жизни»; по-русски естественнее «прожила», при сохранении смысла завершённого срока жизни.
- source_word: ወበሐቀ፡ ያዕቆብ
  choice: Иаков засмеялся
  rationale: Глагол передаёт смех; причинная связь раскрывается следующим оборотом, поэтому не вводится оттенок насмешки.
- source_word: ትነብር፡ አንጻሪሁ
  choice: всё ещё была перед ним
  rationale: Сохраняет пространственный образ «оставалась/пребывала напротив него» в естественном русском изложении.
- source_word: ወኀይላ፡ ላዕሌሃ
  choice: и силы не оставили её
  rationale: Идиоматически передаёт буквальное «её сила была на ней», то есть она сохраняла телесную силу, не добавляя идеи исцеления.
- source_word: ትበውእ፡ ወትወፅእ
  choice: ходила туда и сюда
  rationale: Передаёт парную формулу «входила и выходила» как свидетельство обычной подвижности; в русском контексте это звучит естественно.
theological_decisions:
- issue: Смысл заявления о завершении дней жизни
  choice: которые мне было дано прожить
  alternative: которые мне предстояло прожить
  rationale: Формулировка сохраняет представление об отмеренном сроке жизни, не уточняя, кем именно он определён.
- issue: Причина смеха Иакова
  choice: засмеялся из-за слов своей матери
  alternative: посмеялся над словами своей матери
  rationale: 'Не приписывается насмешка или неверие: исходный причинный оборот допускает просто реакцию на несоответствие слов её видимому состоянию.'
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранена незавершённость фразы в конце стиха многоточием, поскольку синтаксис продолжается далее. Реплика оформлена в женском роде по контексту речи матери.
