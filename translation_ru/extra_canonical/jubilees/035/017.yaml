  text: And he said, “I will do everything that you ask, and I will not refuse your request.” And she said to him, “I ask from you that on the day I die you will carry me and bury me near Sarah, the mother of your father, and that you and Jacob will love one another,
translation:
  language: ru
  text: 'И он сказал: «Я сделаю всё, о чём ты просишь, и не откажу тебе в твоей просьбе». Тогда она сказала ему: «Я прошу тебя: в день моей смерти отнеси меня и похорони рядом с Саррой, матерью твоего отца, и чтобы вы с Иаковом любили друг друга».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢየአቢ፡ ስእለተኪ
  choice: не откажу тебе в твоей просьбе
  rationale: Передаёт отрицание глагола со значением отказа и обращённое к Ревекке существительное «просьба» естественным современным русским выражением.
- source_word: ታብአኒ፡ ወትቅብረኒ
  choice: отнеси меня и похорони
  rationale: Сохраняет последовательность двух действий и прямую форму просьбы; в данном погребальном контексте «отнеси» означает доставить тело к месту погребения.
- source_word: ቅሩበ፡ ሳራ፡ እመ፡ አቡከ
  choice: рядом с Саррой, матерью твоего отца
  rationale: Формально передаёт родственное обозначение источника, не заменяя его более толковательным «бабушкой».
- source_word: ትትፋቀሩ፡ አንተ፡ ወያዕቆብ፡ በበይናቲክሙ
  choice: любите друг друга — ты и Иаков
  rationale: Взаимная форма передана русским «друг друга», а явно названные участники сохранены с помощью пояснительной конструкции.
