base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: ru
  text: 'И я заповедую вам, сыновья мои: творите праведность и поступайте справедливо на земле, чтобы Господь исполнил для вас всё, что Господь сказал, что совершит для Авраама и его потомства.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ (ṣədq)
  choice: праведность
  rationale: Передаёт нравственно-религиозное значение исходного существительного и сохраняет его отличие от следующего понятия.
- source_word: ርትዐ (rətʿ)
  choice: поступайте справедливо
  rationale: В паре с «праведностью» обозначает прямоту и справедливость поведения; глагольная формулировка естественна по-русски и не сливает два исходных понятия.
- source_word: እግዚአብሔር (ʾəgziʾabəḥer)
  choice: Господь
  rationale: Геэзское обозначение является титулом «Господь/Владыка», а не передачей тетраграмматона; поэтому перевод следует непосредственному источнику, не подставляя форму «Яхве».
- source_word: ዘርኡ (zarʾu)
  choice: его потомства
  rationale: Собирательное «потомство» естественно передаёт буквальное «семя его» и сохраняет корпоративное значение.
theological_decisions:
- issue: Связь человеческой праведности с исполнением обетования
  choice: Сохранена целевая конструкция «чтобы Господь исполнил для вас…»
  alternative: Ослабить связь формулировкой «и тогда Господь сможет исполнить…»
  rationale: Исходный текст прямо связывает повеление и последующее действие Господа, не разъясняя богословский характер этой связи; добавлять идею возможности или заслуживания не следует.
- issue: Повтор имени/титула Бога
  choice: Сохранено повторение «Господь… по слову Господа»
  alternative: Во втором случае заменить местоимением
  rationale: Повтор присутствует в геэзском тексте и подчёркивает, что исполнителем и давшим обещание является Господь.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Императив передан прямо; громоздкая исходная конструкция упорядочена без устранения смысловой связи между праведной жизнью и исполнением Божьего слова.
