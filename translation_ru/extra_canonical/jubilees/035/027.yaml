review_pass:
  verdict: revise
  source_fidelity: 'Черновик верно передаёт повеление к праведности и справедливости, а также целевую связь с исполнением Божьего слова. Однако оборот «что, по слову Господа, Он совершит» меняет синтаксис и смысл: в источнике Господь сам «сказал, что совершит» для Авраама и его потомства, а не совершит нечто «по слову Господа».'
  naturalness: Текст в целом литературен и естественен. Исправленная формулировка делает заключительную часть ясной, избегая неудачного вводного оборота «по слову Господа».
  terminology: «Праведность», «справедливо», «Господь» и «потомство» уместны. «Господь» точно передаёт геэзский титул, без подстановки личного имени из английской редакционной традиции.
  issues:
  - severity: medium
    issue: Оборот «по слову Господа» неверно передаёт придаточную конструкцию.
    rationale: 'Геэзский текст говорит: «всё, что Господь сказал, что сделает для Авраама и его семени». В черновике «по слову Господа» превращает содержание сказанного в обстоятельство способа и размывает прямое утверждение о том, что Господь обещал/сказал совершить.'
  - severity: low
    issue: «Для Авраама» в данном контексте менее точно, чем дательный «Аврааму».
    rationale: Исходная конструкция направлена на Авраама и его потомство; «Аврааму и его потомству» яснее выражает адресатов обещанного действия.
  revised_text: 'И я заповедую вам, сыновья мои: творите праведность и поступайте справедливо на земле, чтобы Господь исполнил для вас всё, что Господь сказал, что совершит для Авраама и его потомства.'
