base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: ru
  text: 'И она сказала ему: «Сын мой, за всю свою жизнь я не видела в тебе ни одного неправедного поступка — только праведность. Но я скажу тебе правду, сын мой: в этом году я умру и не проживу дольше этого года, потому что во сне я видела день своей смерти: мне не прожить больше ста пятидесяти пяти лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ጠዋየ
  choice: неправедного поступка
  rationale: Буквально речь идёт о «деле кривизны/уклонения». Выбран естественный русский эквивалент, сохраняющий нравственное противопоставление последующей «праведности».
- source_word: ርቱዐ
  choice: праведность
  rationale: Слово обозначает прямоту, правильность, честность; в данном нравственном контексте «праведность» ясно передаёт противопоставление неправедному поступку.
- source_word: ጽድቀ
  choice: правду
  rationale: В сочетании с глаголом «говорить» слово естественно передаётся по-русски как «сказать правду».
- source_word: ኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ
  choice: не проживу дольше этого года
  rationale: Передаёт смысл того, что жизнь говорящей не продлится за пределы названного года, без буквального и неестественного оборота «не перейду этот год в моей жизни».
- source_word: ኢየሐዩ፡ ፈድፋደ፡ እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: не проживу больше ста пятидесяти пяти лет
  rationale: Сохраняет указанный в источнике предел продолжительности жизни — 155 лет.
