  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: ru
  text: 'Он поступил с нами дурно: собрал твои стада и разграбил всё твоё имущество у тебя на глазах. А когда мы просим и умоляем его вернуть нам наше, он держится так, словно оказывает нам милость.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌነ፡ እኩየ
  choice: поступил с нами дурно
  rationale: Передаёт наречное «зло/дурно» при подразумеваемом или контекстуально выраженном действии естественным современным русским оборотом.
- source_word: መሪዕቶከ፡ አስተጋብአ
  choice: собрал твои стада
  rationale: 'Сохраняет прямое значение: речь о собирании принадлежащих адресату стад.'
- source_word: ወኵሎ፡ ጥሪትከ፡ ሄደ
  choice: и разграбил всё твоё имущество
  rationale: В геэзском ሄደ здесь означает «грабить, отнимать силой», а ኵሎ፡ ጥሪትከ является прямым дополнением; перевод «имущество ушло» был бы основан на смешении с амхарским глаголом.
- source_word: እምቅድመ፡ ገጽከ
  choice: у тебя на глазах
  rationale: Идиоматически передаёт буквальное «перед твоим лицом», сохраняя смысл открытого действия в присутствии адресата.
- source_word: ናስተበቍዕ፡ ወንስእሎ
  choice: просим и умоляем
  rationale: Два координированных глагола переданы двумя русскими глаголами с нарастающей настойчивостью.
- source_word: ዘእምዚአነ፡ ውእቱ
  choice: вернуть нам наше
  rationale: Буквально «то, что наше, у него/от него»; добавление «вернуть» естественно выражает направленную к владельцу просьбу, не меняя предмет требования.
- source_word: ይሬሲ፡ ከመ፡ ዘብእሲ፡ ዘይምሕረነ
  choice: он держится так, словно оказывает нам милость
  rationale: 'Передаёт сравнение с человеком, который милует или проявляет сострадание, и сохраняет иронию: похититель изображает возврат чужого как собственную милость.'
theological_decisions:
- issue: Характер «милости» в заключительной фразе
  choice: 'сохранить ироническое сравнение: «словно оказывает нам милость»'
  alternative: «как человек, который милует нас»
  rationale: Контекст противопоставляет присвоение имущества просьбе вернуть принадлежащее говорящим; перевод не превращает мнимую милость в действительную и не добавляет богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис сохраняет обвинительный и иронический тон реплики; архаизмы и конфессионально окрашенная лексика не используются.
