base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/018.yaml
  text: and neither will seek evil against his brother, but only love, so that you may prosper, my sons, and be honored in the midst of the land, and no enemy may rejoice over you, and you may become a blessing and a mercy before the eyes of all who love you.”
translation:
  language: ru
  text: И пусть никто из вас не ищет зла против своего брата, а ищет лишь любви, чтобы вы, сыновья мои, преуспевали и были в почёте посреди земли, чтобы ни один враг не радовался о вас и чтобы вы стали благословением и милостью в глазах всех, кто любит вас».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይኅሥሥ፡ እኩየ
  choice: не замышляет зла
  rationale: Передаёт направленный против брата злой умысел естественным современным русским выражением, не сводя смысл только к совершённому поступку.
- source_word: ተፋቅሮ
  choice: стремится лишь к любви
  rationale: Сохраняет противопоставление злу и любви; добавленное по-русски «стремится» делает эллиптическую конструкцию ясной без догматического уточнения.
- source_word: ትሣረሑ
  choice: преуспевали
  rationale: Соответствует контексту благополучия и сохранённому в консультационном английском слою значению prosper.
- source_word: ለበረከት፡ ወለምሕረት
  choice: благословением и милостью
  rationale: Формально сохраняет два самостоятельных исходных понятия, не заменяя их одним обобщающим словом.
theological_decisions:
- issue: Выражение «стать благословением и милостью» допускает понимание как их роли для других либо как явленного на них Божьего благоволения.
  choice: Сохранена исходная именная формула «стали благословением и милостью».
  alternative: «Чтобы на вас пребывали благословение и милость».
  rationale: Исходная конструкция и английский консультационный слой представляют самих братьев как благословение и милость; альтернативное чтение неоправданно устраняло бы эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский, с достоинством и ясностью. Обращение «сыновья мои» и параллельная структура пожеланий сохраняют завещательный тон речи Ревекки.
