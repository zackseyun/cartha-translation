  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: ru
  text: Он убьёт его после твоей смерти. Ты знаешь всё, что он совершил с того дня, как его брат Иаков ушёл в Харран, до нынешнего дня, — как он всем сердцем оставил нас и сделал…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза в источнике обрывается на словах «и сделал» и продолжается в следующем стихе.
    reason: Поясняет грамматически необычное, но текстуально обусловленное незавершённое окончание.
lexical_decisions:
- source_word: ይቅትሎ
  choice: Он убьёт его
  rationale: Форма передаёт будущее действие с местоименным объектом; самостоятельная фраза сохранена без перестановки цели к предыдущему контексту.
- source_word: ኵሎ፡ መጠነ፡ ገብረ
  choice: всё, что он делал
  rationale: Естественно передаёт совокупность его поступков; буквальное «всю меру того, что он сделал» в современном русском звучало бы неясно.
- source_word: ያዕቆብ፡ እኁሁ
  choice: его брат Иаков
  rationale: 'Сохраняет синтаксическую связь: Иаков является братом подразумеваемого лица и субъектом ухода в Харран, а не субъектом предыдущего «делал».'
- source_word: ኀደገነ
  choice: оставил нас
  rationale: Передаёт базовое значение «оставил/покинул нас», не усиливая его до более богословски или эмоционально нагруженного «отрёкся от нас».
- source_word: በኵሉ፡ ልቡ
  choice: всем сердцем
  rationale: Сохраняет идиому и эмфатическую полноту исходного выражения.
theological_decisions:
- issue: Степень нравственной оценки в глаголе ኀደገነ
  choice: оставил нас
  alternative: покинул нас / отрёкся от нас
  rationale: Выбрано более прямое лексическое соответствие, сохраняющее упрёк из контекста, но не добавляющее идеи формального отречения.
- issue: Незавершённость заключительной фразы
  choice: 'сохранить обрыв: «и сделал…»'
  alternative: дополнить смысл из следующего стиха
  rationale: Источник данного стиха оканчивается союзом и глаголом без выраженного дополнения; нельзя молча переносить продолжение из соседнего стиха.
translation_notes:
  register: Современный литературный русский, сдержанный и повествовательно-торжественный. «Ты ведь знаешь» естественно выражает присоединительное «и ты знаешь», не превращая его в вопрос. Название города дано в привычной русской библейской форме «Харран».
