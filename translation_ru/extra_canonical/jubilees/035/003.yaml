base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/003.yaml
  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: ru
  text: 'И ты, сын мой, знаешь от дня своего рождения и до сего дня все мои дела и всё, что у меня на сердце: я очень люблю твоего отца.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: И ты
  rationale: Частица -ኒ при местоимении передана естественным русским «и ты»; в контексте она выделяет адресата без избыточного усиления.
- source_word: ምግባርየ
  choice: все мои дела
  rationale: «Дела» охватывает поступки и образ действий говорящей и естественно противопоставляется тому, что находится в сердце.
- source_word: ዘውስተ ልብየ
  choice: всё, что у меня на сердце
  rationale: Идиоматическая русская формулировка сохраняет указание на внутренние мысли и чувства, не сводя выражение только к эмоциям.
- source_word: ጥቀ
  choice: очень
  rationale: Наречие передаёт высокую степень любви ясно и естественно для современного русского языка; более книжное «чрезвычайно» здесь звучало бы неестественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формула «до сего дня» сохраняет достоинство стиля и остаётся понятной; двоеточие естественно раскрывает содержание сердца говорящей, не добавляя богословского толкования.
