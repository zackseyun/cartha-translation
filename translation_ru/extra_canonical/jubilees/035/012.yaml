base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: ru
  text: 'И он озлоблен на тебя за то, что ты благословил Иакова, своего безупречного и праведного сына; ведь в нём нет никакого зла, а только добро. С того дня, как он пришёл из Харрана, и доныне он ни в чём не давал нам терпеть недостатка: всё приходит к нам в своё время, изо дня в день. Всякий раз, когда мы принимаем что-либо из его рук, он радуется всем сердцем и благословляет нас. С того дня, как он пришёл из Харрана, и доныне он не отделялся от нас, но постоянно живёт с нами в доме и почитает нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: озлоблен на тебя
  rationale: Передаёт направленную против адресата горечь или неприязнь естественным современным русским выражением.
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: безупречного и праведного
  rationale: 'Сохраняет две положительные характеристики Иакова: цельность/безупречность и нравственную прямоту.'
- source_word: አልቦ፡ እኩየ፡ ዘአንበበ፡ ኂሩትነ
  choice: в нём нет никакого зла, а только добро
  rationale: 'Следует исправленному пониманию текста: речь о присущем Иакову добре, а не «нашем добре».'
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: он ни в чём не давал нам терпеть недостатка
  rationale: Передаёт каузативный смысл лишения или допущения недостатка без неестественной буквальности.
- source_word: ኵሉ፡ ይመጽእ፡ ለነ፡ በበጊዜሁ፡ ኵሉ፡ ዕለት
  choice: всё приходит к нам в своё время, изо дня в день
  rationale: Сохраняет как своевременность обеспечения, так и его постоянный, ежедневный характер.
- source_word: ሶበ፡ ንነሥእ፡ እምእዴሁ
  choice: Всякий раз, когда мы принимаем что-либо из его рук
  rationale: «Принимаем» естественно выражает получение от Иакова; «что-либо» имплицитно восполняет объект в русском языке.
- source_word: ዘልፈ፡ ውስተ፡ ቤት
  choice: постоянно живёт с нами в доме
  rationale: Передаёт непрерывность совместного проживания и сохраняет упоминание дома.
- source_word: ያከብረነ
  choice: почитает нас
  rationale: Сохраняет значение проявления чести и уважения в достойном библейском регистре.
theological_decisions:
- issue: Характеристика Иакова как безупречного и праведного
  choice: Сохранить положительные определения без оговорок
  alternative: Ослабить до «хорошего и честного»
  rationale: Источник даёт сильные нравственные характеристики; перевод не должен ослаблять их или согласовывать с позднейшими богословскими системами.
- issue: Фраза об отсутствии зла в Иакове
  choice: «в нём нет никакого зла, а только добро»
  alternative: «он не сделал никакого зла, но лишь добро»
  rationale: Формулировка источника допускает характеристику самого человека, а ближайший контекст и исправленная консультационная версия поддерживают именно это чтение; сильное утверждение сохранено без догматического переосмысления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис разбит на удобочитаемые предложения, при этом сохранены повтор «с того дня… и доныне», семейная теплота речи и нравственная напряжённость исходного текста.
