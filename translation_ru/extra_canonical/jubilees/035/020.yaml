  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: ru
  text: 'А Иакова, брата моего, я люблю больше всех людей, и нет у меня брата на всей земле, кроме него одного. И нет ничего удивительного в том, что я люблю его: ведь он мой брат. Вместе мы были посеяны в твоём чреве и вместе вышли из твоей утробы. Если я не буду любить своего брата, кого же мне любить?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኵሉ፡ ዘሥጋ
  choice: больше всех людей
  rationale: Буквально выражение означает «больше всего, что является плотью». В данном контексте речь идёт о людях; выбран естественный русский эквивалент, сохраняющий широту сравнения.
- source_word: ተዘራእነ
  choice: мы были посеяны
  rationale: Сохранён конкретный образ глагола «сеять», относящийся к совместному зачатию братьев в материнском чреве.
- source_word: ከርሥኪ / ኅንብርትኪ
  choice: твоё чрево / твоя утроба
  rationale: Два близких обозначения материнского тела переданы разными, но естественными словами, чтобы сохранить параллелизм источника.
- source_word: መነ፡ አፈቅር
  choice: кого же мне любить?
  rationale: Риторический вопрос передан прямо и естественно, без добавочного богословского толкования.
