base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/014.yaml
  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: ru
  text: И теперь сердце моё тревожится из-за всех его дел. Ни он, ни его потомство не спасутся, ибо они будут истреблены с земли и искоренены из-под небес, потому что он оставил Бога Авраама и пошёл вслед за своими жёнами и вслед за…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся исходный текст данного фрагмента обрывается на словах «и вслед за…».
    reason: Обозначает незавершённость предоставленного геэзского текста и предотвращает ошибочное восприятие оборванной фразы как законченного стиха.
lexical_decisions:
- source_word: ልብየ፡ ይትሀወክ
  choice: сердце моё тревожится
  rationale: Передаёт внутреннее смятение естественным и dignified современным русским языком.
- source_word: ዘርኡ
  choice: его потомство
  rationale: В данном контексте обозначает потомков, а не буквальное семя.
- source_word: ይትሐጐሉ
  choice: будут истреблены
  rationale: Сохраняет значение гибели или уничтожения и не смешивает этот глагол со следующим образом искоренения.
- source_word: ይሤረዉ
  choice: искоренены
  rationale: Передаёт образ удаления с корнем; соответствует последовательности глаголов в геэзском источнике.
- source_word: ሖረ፡ ድኅረ፡ አንስቲያሁ
  choice: пошёл вслед за своими жёнами
  rationale: Естественно передаёт буквальное движение «вслед за» и возможный смысл следования их влиянию.
theological_decisions:
- issue: Объём утверждения о гибели потомства
  choice: Ни он, ни его потомство не спасутся
  alternative: Не будет спасения ни ему, ни его потомству
  rationale: Сохранено прямое и категоричное высказывание источника без смягчения или богословского переосмысления.
- issue: Божественное наименование
  choice: Бога Авраама
  alternative: Авраамова Бога
  rationale: Современная литературная форма точно сохраняет связь Бога с Авраамом, не добавляя конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; последовательность «истреблены с земли» и «искоренены из-под небес» следует геэзскому оригиналу, а не прежней перестановке в английском слое.
