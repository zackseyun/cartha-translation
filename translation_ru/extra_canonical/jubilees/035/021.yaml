base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: ru
  text: 'И я прошу тебя: увещевай Иакова насчёт меня и моих детей,[a] потому что я знаю, что он непременно будет властвовать надо мной и над моими детьми, ведь в тот день, когда отец благословил его, он поставил его выше, а меня — ниже.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в моих интересах и в интересах моих детей».'
    reason: Предложное выражение может обозначать как предмет увещевания («насчёт меня и моих детей»), так и тех, в чьих интересах оно совершается.
lexical_decisions:
- source_word: ትገሥጽዮ
  choice: увещевай
  rationale: Передаёт побуждение наставить или строго вразумить Иакова; современно и достойно по регистру.
- source_word: በእንቲአየ፡ ወበእንተ፡ ውሉድየ
  choice: обо мне и о моих детях
  rationale: Предлог допускает значения «о, относительно» и «ради, от имени»; контекст поведения Иакова по отношению к Исаву и его потомкам поддерживает значение «о/относительно».
- source_word: ነጊሠ፡ ይነግሥ
  choice: непременно будет властвовать
  rationale: Внутренняя конструкция с однокоренными формами усиливает утверждение; русское наречие «непременно» естественно передаёт это усиление.
- source_word: ረሰየ፡ ልዑለ፡ ወኪያየ፡ ትሑተ
  choice: поставил его выше, а меня — ниже
  rationale: Сохраняет пространственно-статусную антитезу исходного текста без добавочного истолкования.
theological_decisions:
- issue: Характер будущего превосходства Иакова
  choice: будет властвовать надо мной и над моими детьми
  alternative: будет царствовать надо мной и над моими детьми
  rationale: Глагол связан с царствованием, но здесь речь может идти шире о господстве или превосходстве. «Властвовать» сохраняет политико-иерархический смысл, не утверждая обязательно формальный царский титул.
- issue: Отношение отцовского благословения к возвышению Иакова
  choice: ведь в тот день, когда отец благословил его, он поставил его выше
  alternative: потому что, благословив его, мой отец возвысил его
  rationale: Сохранена причинная связь текста и его контрастная образность; местоимение «он» воспроизводит грамматическую форму источника, где субъектом естественно понимается отец.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет повтор «надо мной и над моими детьми» и антитезу «выше — ниже».
