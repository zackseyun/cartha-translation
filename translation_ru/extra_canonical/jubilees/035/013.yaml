- from: 'Исаак сказал ей: «Я тоже знаю и вижу, как Иаков, живущий с нами, относится к нам: он чтит нас всем сердцем. Я любил Исава больше Иакова, потому что Исав родился первым; но теперь я люблю Иакова больше Исава, потому что Исав сделал свои дела крайне злыми[a] и нет в нём праведности. Все его пути — беззаконие и насилие, и нет праведности вокруг него[b]».'
  to: 'Исаак сказал ей: «Я тоже знаю и вижу, как Иаков относится к нам: он чтит нас всем сердцем. Я любил Исава больше Иакова с тех пор, как он родился первым; но теперь я люблю Иакова больше Исава, потому что Исав умножил зло в своих делах[a], и нет в нём праведности. Все его пути — беззаконие и насилие, и нигде вокруг него нет праведности[b]».'
