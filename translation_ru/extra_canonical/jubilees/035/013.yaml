  yaml_path: translation/extra_canonical/jubilees/035/013.yaml
  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: ru
  text: 'Исаак сказал ей: «Я тоже знаю и вижу, как Иаков относится к нам: он чтит нас всем сердцем. Я любил Исава больше Иакова с тех пор, как он родился первым; но теперь я люблю Иакова больше Исава, потому что Исав умножил зло в своих делах[a], и нет в нём праведности. Все его пути — беззаконие и насилие, и нигде вокруг него нет праведности[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «сильно умножил зло своих дел».'
    reason: Передаёт необычную активную усилительную конструкцию исходного текста и поясняет перевод «умножил зло в своих делах».
  - marker: b
    text: 'Возможно также: «и вовсе нет в нём праведности».'
    reason: Слово со значением «вокруг» может здесь идиоматически усиливать отрицание.
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ፡ ዘምስሌነ
  choice: как Иаков, живущий с нами, относится к нам
  rationale: Передаёт «поведение/дела Иакова, который с нами» естественным русским оборотом и сохраняет направленность его поведения по отношению к родителям.
- source_word: በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: он чтит нас всем сердцем
  rationale: Прямо и естественно передаёт почтение Иакова и полноту его сердечной преданности.
- source_word: አፍቀርክዎ፡ ለዔሳው፡ ቀደሙ፡ እምነ፡ ያዕቆብ
  choice: Я любил Исава больше Иакова
  rationale: ቀደሙ እምነ выражает предпочтение одного другому; «больше» звучит по-русски естественнее буквального «прежде» и согласуется с последующим противопоставлением.
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: сделал свои дела крайне злыми
  rationale: Сохраняет активную конструкцию и понимает አብዝኀ как усиление степени, а не как сравнительную форму.
- source_word: ዐመፃ፡ ወግፍዕ
  choice: беззаконие и насилие
  rationale: Передаёт сочетание мятежной неправды/несправедливости и угнетения/насилия в ясной библейской лексике.
- source_word: አውዶ
  choice: вокруг него
  rationale: Сохраняет пространственный образ заключительной фразы, не сводя его без пояснения к повторному «в нём».
theological_decisions:
- issue: Оценка дел Исава
  choice: «сделал свои дела крайне злыми»
  alternative: «его дела хуже»
  rationale: Форма допускает трудность толкования, но контекст и словосочетание лучше поддерживают усилительное и активное значение, а не сравнение с делами Иакова.
- issue: Заключительное отсутствие праведности
  choice: «нет праведности вокруг него»
  alternative: «в нём вовсе нет праведности»
  rationale: Основной текст сохраняет явное አውዶ («вокруг»), а сноска отмечает возможное идиоматическое понимание, не устраняя образ исходника.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но повтор «нет праведности» и напряжение между буквальным «вокруг него» и идиоматическим смыслом сохранены.
