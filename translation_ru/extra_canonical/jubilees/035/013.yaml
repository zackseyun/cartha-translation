  source_fidelity: Черновик в целом точно передаёт противопоставление Иакова и Исава, усилительный характер описания злых дел и заключительное አውዶ («вокруг него»). Однако «как Иаков, живущий с нами, относится к нам» добавляет не выраженное источником утверждение, будто Иаков живёт вместе с ними; речь идёт о его поведении по отношению к ним. Формулировку о первородстве лучше сделать ближе к временно-предпочтительному смыслу без причинного оттенка «потому что».
