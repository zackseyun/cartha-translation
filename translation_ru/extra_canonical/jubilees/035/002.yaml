  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: ru
  text: 'Иаков сказал ей: «Я сделаю всё, что ты повелела мне, ибо это дело будет для меня честью и величием и праведностью перед Богом: почитать их».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: «что ты повелела мне»
  rationale: Сохранены значение повеления, обращение к женщине во втором лице единственного числа и объект первого лица единственного числа.
- source_word: ክብረ ፡ ወዕበየ
  choice: «честью и величием»
  rationale: Переданы оба однородных существительных без сведения их к одному понятию; творительный падеж естественно оформляет именную часть сказуемого в русском языке.
- source_word: ዝንቱ ፡ ነገር
  choice: «это дело»
  rationale: Нейтрально передаёт указательное выражение и не уточняет сверх источника содержание поручения, изложенного в предыдущем стихе.
- source_word: ወጽድቀ ፡ ቅድመ ፡ እግዚአብሔር
  choice: «и праведностью пред Богом»
  rationale: Сохранена координация с предшествующими существительными и богословски значимое понятие праведности; «пред Богом» соответствует буквальному пространственно-оценочному обороту источника.
- source_word: ከመ ፡ አክብሮሙ
  choice: «— почитать их»
  rationale: Инфинитивная конструкция сохраняет возможную связь почитания как содержания или пояснения названной праведности, не добавляя в текст явно не названных лиц.
theological_decisions:
- issue: Связь почитания с честью, величием и праведностью
  choice: 'Сохранить пояснительную конструкцию через тире: «— почитать их»'
  alternative: «за то, что я буду почитать их» или «чтобы я почитал их»
  rationale: Геэзское ከመ допускает смысловую связь, которую не следует чрезмерно сужать до причины либо цели; русский инфинитив оставляет исходное напряжение и остаётся понятным.
- issue: Референт местоимения «их»
  choice: Оставить «их» без поясняющей замены
  alternative: Назвать предполагаемых лиц, например «отца и мать»
  rationale: В данном стихе референт не назван; его явное уточнение импортировало бы контекст предыдущего стиха и устранило бы формальную анафорическую структуру источника.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественной библейской интонацией. Форма «пред Богом» выбрана как нормативная и возвышенная, но понятная современному читателю. Граница стиха строго соблюдена: материал из Юбилеев 35:1 не включён.'
