revisions:
- from: 'Зубы её были крепки, и за все дни её жизни её не постигла никакая болезнь. Иаков сказал ей: «Блажен я, мать, если дни моей жизни приблизятся к числу твоих дней и сила моя останется во мне такой же, как твоя. Ты не умрёшь[a], потому что напрасно говоришь мне о своей смерти».'
  to: 'Зубы её были крепки, и во все дни её жизни её не постигла никакая болезнь. Иаков сказал ей: «Блажен я, мать, если дни мои приблизятся к дням твоей жизни и сила моя будет при мне, как теперь, — соразмерно твоей силе. Ты не умрёшь[a], потому что напрасно говоришь мне о своей смерти».'
  rationale: Убрано не засвидетельствованное источником «число» дней. Оборот о силе уточнён так, чтобы сохранить смысл её пребывания при Иакове, указание «как теперь» и сопоставление с силой матери. Основное чтение «Ты не умрёшь» и сноска об альтернативе сохранены.
