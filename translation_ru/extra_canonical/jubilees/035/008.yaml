  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: ru
  text: 'Зубы её были крепки, и во все дни её жизни её не постигла никакая болезнь. Иаков сказал ей: «Блажен я, мать, если дни мои приблизятся к дням твоей жизни и сила моя будет при мне, как теперь, — соразмерно твоей силе. Ты не умрёшь[a], потому что напрасно говоришь мне о своей смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не умирай».'
    reason: 'Форму глагола возможно передать как запрет или просьбу, однако её морфология и контекст — Иаков говорит о крепости и здоровье матери — предпочтительно поддерживают значение будущего времени: «Ты не умрёшь».'
lexical_decisions:
- source_word: አስናኒሃኒ፡ ጽኑዕ
  choice: Зубы её были крепки
  rationale: Сохраняет прямой смысл существительного «зубы» и прилагательного со значением крепости/прочности, естественно звуча по-русски.
- source_word: ኢምንተኒ፡ ሕማም፡ ኢበከፋ
  choice: её не постигла никакая болезнь
  rationale: Передаёт усиленное отрицание и глагол со значением наступления или прихода бедствия; «не постигла» — современная и достойная русская формулировка.
- source_word: ብፁዕ፡ አነ
  choice: Блажен я
  rationale: Сохраняет выраженную оценку благополучия и традиционно возвышенный, но понятный библейский регистр.
- source_word: ቀርበ፡ መዋዕልየ፡ ለመዋዕለ፡ ሕይወትኪ
  choice: если дни моей жизни приблизятся к числу твоих дней
  rationale: Естественно передаёт сравнение продолжительности жизни, избегая неясного буквального оборота «дни приблизятся к дням».
- source_word: ይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: сила моя останется во мне
  rationale: Передаёт продолжение или сохранение силы у говорящего без излишнего уточнения образа.
- source_word: በጸው፡ ትትናገሪ፡ ምስሌየ
  choice: напрасно говоришь мне
  rationale: «Напрасно» точно и естественно выражает смысл тщетности или необоснованности речи в данном контексте.
theological_decisions:
- issue: Форма አትመውቲ допускает различение между сообщением и побуждением в зависимости от морфологического и орфографического анализа.
  choice: Ты не умрёшь
  alternative: Не умирай
  rationale: Имперфектная форма и контекст, в котором Иаков указывает на крепость и здоровье матери, лучше поддерживают утвердительное предсказание или заверение. Альтернатива отмечена в сноске, чтобы не скрывать историю и возможную неоднозначность передачи формы.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формулировки остаются понятными широкому читателю; синтаксис слегка сглажен там, где буквальное воспроизведение геэзского оборота было бы неестественным.
