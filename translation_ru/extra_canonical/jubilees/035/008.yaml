    rationale: Геэзский текст и английский контрольный перевод говорят о приближении дней Иакова к дням жизни матери, а не о достижении определённого числового показателя. Добавление сужает и конкретизирует исходный образ.
  - severity: low
    issue: Сравнение силы передано неполно.
    rationale: «Такой же, как твоя» передаёт общий смысл, но не сохраняет указание «как теперь/так» и образ того, что сила остаётся при Иакове. Небольшая перестройка делает фразу ближе к источнику без неестественной буквальности.
