  source_fidelity: В представленном эфиопском тексте говорится о двойной пещере на поле Ефрона-хетта, приобретённой Авраамом как место погребения, и о гробнице, которую говорящий высек для себя. Слова «в земле Ханаанской» в данном исходном фрагменте не засвидетельствованы; они отражают английскую аудиторскую формулировку, но не должны добавляться в русский перевод при приоритете исходного текста.
  naturalness: Фраза в целом естественна, однако приложение «Ефрона, хетта» читается по-русски яснее, чем слитое «Ефрона-хетта».
  terminology: «Двойная пещера» точно сохраняет буквальную характеристику пещеры. «Высек для себя» уместно передаёт действие устройства гробницы и сохраняет завещательный регистр.
