  yaml_path: translation/extra_canonical/jubilees/035/026.yaml
  text: Bury me near Abraham my father in the double cave in the field of Ephron the Hittite, which Abraham acquired as a burial place there in the land of Canaan. In the tomb which I dug for myself there, bury me.
translation:
  language: ru
  text: Похороните меня рядом с Авраамом, моим отцом, в двойной пещере на поле Ефрона, хетта, которое Авраам приобрёл как место погребения. Похороните меня там, в гробнице, которую я высек для себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባዐት፡ ዘካዕበት
  choice: двойная пещера
  rationale: Формально передаёт эфиопское выражение «пещера, которая двойная» и сохраняет традиционное обозначение места погребения.
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: Ефрона-хетта
  rationale: Передаёт имя и этническое определение в естественной для современного русского библейского повествования форме.
- source_word: ዘአጥረየ፡ አብርሃም፡ ለዝኅረ፡ መቃብር
  choice: которую Авраам приобрёл ... как место для погребения
  rationale: Сохраняет значение приобретения и целевое назначение участка, не утяжеляя русскую фразу.
- source_word: መቃብር፡ ዘከረይኩ፡ ለርእስየ
  choice: гробнице, которую я высек для себя
  rationale: Глагол передаёт устройство гробницы путём высекания; «для себя» точно отражает возвратное значение.
