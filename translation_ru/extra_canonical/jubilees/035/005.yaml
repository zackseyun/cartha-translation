  text: 'which you commanded me: that I should honor my father and my brother. Tell me, then, what crookedness you have seen in me;'
translation:
  language: ru
  text: 'что ты повелела мне: чтить моего отца и моего брата. Скажи же мне, какую неправду ты увидела во мне?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: которое ты дала мне
  rationale: Форма выражает обращённое к говорящему повеление; относительное «которое» сохраняет связь с предшествующим контекстом.
- source_word: አክብር
  choice: почитал
  rationale: Передаёт значение «чтить, оказывать уважение» естественным современным русским глаголом.
- source_word: አበየ፡ ወእኅየየ
  choice: моего отца и моего брата
  rationale: Геэзское እኅየየ означает «мой брат», а не «моя мать»; притяжательное отношение явно передано при обоих существительных.
- source_word: ጥውየተ
  choice: неправду
  rationale: Слово связано с кривизной или отклонением и в данном нравственном контексте естественно означает неправоту, дурной поступок; «неправда» сохраняет образ нравственного уклонения без излишней конкретизации.
theological_decisions:
- issue: Кого говорящий должен почитать наряду с отцом
  choice: брата
  alternative: мать
  rationale: Чтение «брата» непосредственно подтверждается формой ወእኅየየ; знакомая формула «отца и мать» не должна подменять исходный текст.
- issue: Характер замеченного проступка
  choice: неправда
  alternative: кривизна
  rationale: Буквальная метафора «кривизна» возможна, но по-русски здесь звучит неестественно; «неправда» сохраняет нравственный смысл, не уточняя, идёт ли речь о вине, пороке или конкретном поступке.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая незавершённость начального относительного оборота сохранена, поскольку стих продолжает предшествующую реплику; финальный вопрос оформлен естественно для русского языка.
