  yaml_path: translation/extra_canonical/jubilees/035/009.yaml
  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: ru
  text: 'И вошла она к Исааку и сказала ему: «Об одном прошу тебя: возьми с Исава клятву, что он не замыслит зла против Иакова и не станет враждебно преследовать его. Ведь ты знаешь помыслы Исава: он жесток с юности, и нет в нём доброты, ибо он желает…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный текст стиха обрывается на словах «ибо он желает»; многоточие сохраняет эту незавершённость.
    reason: Предупреждает читателя, что обрыв принадлежит исходному фрагменту, а не является стилистическим пропуском переводчика.
lexical_decisions:
- source_word: ስእለተ፡ አስተበቍዕ፡ በኀቤከ
  choice: Об одном прошу тебя
  rationale: Естественно передаёт просьбу об одном деле, не воспроизводя неуклюже исходную конструкцию буквально.
- source_word: እምሕሱ፡ ለዔሳው
  choice: возьми с Исава клятву
  rationale: 'Передаёт каузативный смысл: Исаак должен обязать Исава поклясться.'
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: не замыслит зла против Иакова
  rationale: Сохраняет значение злого умысла против Иакова, не сводя выражение лишь к чувству ненависти.
- source_word: ወኢይስድዶ፡ በጸልኢ
  choice: и не станет враждебно преследовать его
  rationale: Передаёт и действие преследования, и обстоятельство вражды.
- source_word: ሕሊናሁ፡ ለዔሳው
  choice: помыслы Исава
  rationale: Русское «помыслы» охватывает внутренний настрой и намерения в данном контексте.
- source_word: ጸዋን፡ ውእቱ፡ እምንእሱ
  choice: он жесток с юности
  rationale: Смысл характеристики передан прямо и естественно; «с юности» соответствует временному выражению источника.
- source_word: ወአልቦ፡ ላዕሌሁ፡ ኂሩተ
  choice: и нет в нём доброты
  rationale: Сохраняет категорическую нравственную оценку текста без смягчения.
- source_word: እስመ፡ ይፈቅድ
  choice: ибо он желает…
  rationale: Источник данного отрывка обрывается после глагола желания; незавершённость сохранена.
theological_decisions:
- issue: Нравственная характеристика Исава
  choice: «он жесток с юности, и нет в нём доброты»
  alternative: Смягчить до «он суров» или «в нём мало добра»
  rationale: Исходный текст выражается резко и категорично; перевод не должен ослаблять его оценку или согласовывать её с позднейшими богословскими представлениями.
- issue: Незавершённость последней фразы
  choice: 'Сохранить обрыв: «ибо он желает…»'
  alternative: Дополнить фразу по следующему стиху или предполагаемому смыслу
  rationale: Предоставленный исходный фрагмент заканчивается незавершённо; домысливание устранило бы реальную текстовую границу.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан ясным для обычного читателя; сохранены резкость характеристики Исава и незавершённость конца стиха.
