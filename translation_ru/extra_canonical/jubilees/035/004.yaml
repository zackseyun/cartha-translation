lexical_decisions:
- source_word: ዘውስተ፡ ልብየ
  choice: «вот что у меня на сердце»
  rationale: Передаёт буквальное «то, что в моём сердце» естественным современным русским оборотом, сохраняя связь с внутренним намерением говорящего.
- source_word: ኵሎ፡ መዋዕለ
  choice: «во все дни своей жизни»
  rationale: Выражение буквально означает «все [мои] дни»; добавление «жизни» делает смысл ясным по-русски, не меняя содержания.
- source_word: እሐሊ፡ ሠናየ፡ ለኵሉ
  choice: «я помышляю о добре для всех»
  rationale: Сохраняет значение размышления или намерения, направленного к добру для всех, не сужая его до одних чувств или поступков.
- source_word: ወአፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ
  choice: «Так почему же мне не сделать этого?»
  rationale: Естественно передаёт риторический вопрос «и почему/как я не сделаю это дело?»; «этого» избегает тяжеловесного «этого дела».
