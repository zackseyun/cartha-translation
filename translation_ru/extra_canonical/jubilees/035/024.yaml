base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/024.yaml
  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: ru
  text: В ту ночь она и её сыновья ели и пили. Той же ночью она умерла в возрасте трёх юбилеев, одной седмины и одного года[a]. Оба её сына, Исав и Иаков, похоронили её в двойной пещере возле Сарры, матери их отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в возрасте ста пятидесяти пяти лет: юбилей составляет сорок девять лет.'
    reason: Поясняет древний способ указания возраста. Геэзский текст здесь говорит о возрасте Ревекки, тогда как английский консультационный текст понимает фразу как календарную дату.
lexical_decisions:
- source_word: ሠለስተ፡ አዮቤልዉ፡ ወሱባዔ፡ አሐዱ፡ ወዓመት፡ አሐዱ
  choice: прожив три юбилея, одну седмину и один год
  rationale: 'Геэзский текст указывает продолжительность жизни Ревекки: 3×49 + 7 + 1 = 155 лет. Это отличается от хронологической даты в английском консультационном тексте, поэтому перевод следует первичному источнику.'
- source_word: ባዐት፡ እንተ፡ ክልኤ
  choice: двойная пещера
  rationale: Буквально передано обозначение пещеры как «двойной»; имя «Махпела» в данном месте геэзского текста не употреблено.
- source_word: እመ፡ አቡሆሙ
  choice: матерью их отца
  rationale: Сохранена родственная формулировка источника без замены на пояснительное имя Исаака.
theological_decisions: []
