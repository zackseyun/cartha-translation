  text: And he said, “I will do everything that you have told me, and I will bury you on the day of your death near Sarah, my father’s mother, just as you have desired, so that her bones may be near your bones.”
translation:
  language: ru
  text: 'И он сказал: «Я сделаю всё, что ты мне сказала, и в день твоей смерти похороню тебя рядом с Саррой, матерью моего отца, как ты и хотела, чтобы её кости были рядом с твоими костями».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እገብር፡ ኵሎ፡ ዘትቤልኒ
  choice: Я сделаю всё, что ты мне сказала
  rationale: Передаёт обещание исполнить всё сказанное Ревеккой; форма обращения и контекст требуют женского рода.
- source_word: በከመ፡ አፍቀርኪ
  choice: как ты и хотела
  rationale: Буквально выражение связано с желанием или любовью; в контексте просьбы о месте погребения естественное русское соответствие — «как ты и хотела».
- source_word: አዕጽምቲሃ፡ ከመ፡ የሀሉ፡ ቅሩበ፡ አዕጽምትኪ
  choice: чтобы её кости покоились рядом с твоими костями
  rationale: Сохраняет конкретный образ близости останков; «покоились» естественно для русского погребального контекста, хотя исходный глагол имеет общее значение «быть, находиться».
