  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: ru
  text: И в первый год первой седмины сорок пятого юбилея Ревекка позвала своего сына Иакова и дала ему наставления относительно его отца и брата, чтобы он почитал их во все дни своей жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: В хронологической системе Книги Юбилеев обозначает семилетний период; «седмина» сохраняет специальный календарный смысл и отличается от обычной недели.
- source_word: ኢዮቤልው
  choice: юбилей
  rationale: Передаёт техническое обозначение сорокадевятилетнего цикла в системе книги.
- source_word: አዘዘቶ
  choice: наставила его
  rationale: Глагол допускает значения «повелела, наказала, дала наставление»; в контексте материнского обращения естественно «наставила», без чрезмерного усиления приказного оттенка.
- source_word: ያክብሮሙ
  choice: почитал их
  rationale: Сохраняет значение оказания чести и уважения; множественное дополнение относится к отцу и брату.
- source_word: ኵሎ
  choice: во все дни своей жизни
  rationale: Следует засвидетельствованному смыслу фразы в данном месте и ясно выражает постоянный, пожизненный характер наставления.
theological_decisions:
- issue: Объект заповеди о почитании
  choice: «их» — отца и брата
  alternative: Ограничить почитание одним отцом
  rationale: Множественная форма местоименного объекта в геэзском тексте грамматически охватывает обоих названных лиц; перевод не устраняет эту примечательную этическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» употреблён как точное хронологическое обозначение семилетия, а не обычной календарной недели.
