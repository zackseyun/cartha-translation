  yaml_path: translation/extra_canonical/jubilees/035/028.yaml
  text: And love one another, my sons, among yourselves, each loving his brother as a man loves his own life, and let a man seek—”
translation:
  language: ru
  text: И любите друг друга, сыновья мои, пусть каждый любит своего брата, как человек любит собственную жизнь, и пусть человек ищет[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и человек ищет…».'
    reason: В геэзском тексте «человек» — субъект глагола «ищет»; дополнение начинается в следующем стихе. Основной текст передаёт увещательный контекст через «пусть».
lexical_decisions:
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: любите друг друга / пусть каждый из вас любит своего брата
  rationale: Глагол «любить» и существительное «братья» переданы естественно по-русски; повтор сохраняет увещательный строй и уточняет взаимность.
- source_word: ነፍሶ
  choice: собственную жизнь
  rationale: В данном сравнении «душа/жизнь» обозначает самого человека и дорогую ему жизнь; «собственную жизнь» понятно современному читателю и соответствует контексту.
- source_word: ወእንዘ፡ የኀሥሥ፡ ብእሲ
  choice: и пусть человек ищет…
  rationale: ብእሲ («человек») выступает субъектом глагола «ищет», а не его объектом. Незавершённость фразы сохраняется, поскольку дополнение следует в следующем стихе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством наставления отца к сыновьям. Многоточие обозначает, что фраза продолжается в следующем стихе; оно не устраняет синтаксической незавершённости оригинального деления.
