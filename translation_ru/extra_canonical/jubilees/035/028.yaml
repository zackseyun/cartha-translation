  source_fidelity: 'Смысл передан верно: «человек» является субъектом глагола «ищет», а незавершённость фразы корректно сохранена для продолжения в следующем стихе. Однако повторное развёртывание «любите друг друга» через «пусть каждый из вас любит своего брата» несколько утяжеляет и частично дублирует исходный параллелизм.'
