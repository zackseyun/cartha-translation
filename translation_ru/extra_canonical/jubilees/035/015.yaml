- source_word: ርኵሶን፡ ወድኅረ፡ ስሕተቶን
  choice: в их нечистоте и вслед за их заблуждением
  rationale: Сохранён обрывочный характер начала стиха, продолжающего предыдущий контекст; местоименные суффиксы переданы как «их».
- source_word: እምሕሱ
  choice: заставил его поклясться
  rationale: Каузативная форма передаёт побуждение другого лица принести клятву.
- source_word: ኢይገብር፡ ኂሩተ፡ ዘእንበለ፡ እኩይ
  choice: будет делать только зло
  rationale: Конструкция противопоставляет добро злу и означает, что его поступки не будут ничем иным, кроме зла; русский вариант передаёт это естественно и кратко.
- source_word: ውስተ፡ እዴ፡ ያዕቆብ፡ ይትወሀብ
  choice: будет отдан в руку Иакова
  rationale: Сохранён образ единственного числа «рука», выражающий передачу во власть Иакова.
theological_decisions:
- issue: Безусловность предсказания о падении Исава в руку Иакова
  choice: Сохранено прямое утверждение без смягчения
  alternative: Передать как предположение или лишь вероятный исход
  rationale: Исходный текст формулирует следствие уверенно и не вводит модальности сомнения.
