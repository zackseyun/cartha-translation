  yaml_path: translation/extra_canonical/jubilees/035/016.yaml
  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: ru
  text: 'А ты не бойся за Иакова, потому что хранитель Иакова велик, могуч, почитаем и славнее хранителя Исава». Тогда Ревекка послала за Исавом и позвала его. Он пришёл к ней, и она сказала ему: «Сын мой, я хочу попросить тебя об одном. Скажи, что исполнишь мою просьбу, сын мой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቃቢሁ
  choice: хранитель
  rationale: Передаёт значение «страж, хранитель» без уточнения природы этого существа или лица, сохраняя неоднозначность исходного текста.
- source_word: ዐቢይ፡ ወኃያል፡ ወክቡር፡ ወአኩት
  choice: велик, могуч, почитаем и славнее
  rationale: Сохраняет последовательность характеристик хранителя Иакова и сравнительный смысл последней характеристики по отношению к хранителю Исава.
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: Ревекка послала за Исавом и позвала его
  rationale: Отражает оба глагола — «послала» и «позвала», не вводя ошибочного упоминания о прославлении Исаака.
- source_word: ስእለት፡ ብየ
  choice: я хочу попросить тебя об одном
  rationale: Естественная русская передача просьбы об одной вещи; последующая фраза уточняет требование обещать её исполнить.
theological_decisions:
- issue: Кем является «хранитель» Иакова и Исава
  choice: Оставлено общее слово «хранитель»
  alternative: ангел-хранитель
  rationale: Исходный текст не называет хранителя ангелом; конкретизация преждевременно устранила бы содержательную неоднозначность.
- issue: Сравнение хранителей
  choice: 'Последнее определение передано сравнительно: «славнее хранителя Исава»'
  alternative: сильнее хранителя Исава
  rationale: Это следует данной эфиопской форме и проверенному английскому консультационному слою; вариант «сильнее» смешал бы последнюю характеристику с уже употреблённым «могуч».
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Синтаксис слегка упрощён ради ясности, но повторное обращение «сын мой» и оба действия Ревекки сохранены.
