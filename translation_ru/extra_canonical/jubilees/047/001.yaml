  yaml_path: translation/extra_canonical/jubilees/047/001.yaml
  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
translation:
  language: ru
  text: И в седьмое семилетие, в седьмой год[a], в сорок седьмой юбилей твой отец пришёл из земли Ханаанской; а ты родился в четвёртое семилетие, в шестой год, в сорок восьмой юбилей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «в седьмую седмину, в седьмой год»; здесь «седмина» означает семилетний период.
    reason: Поясняет исходный хронологический термин и предотвращает ошибочное понимание его как обычной семидневной недели.
lexical_decisions:
- source_word: ሱባዔ
  choice: семилетие
  rationale: Слово обозначает «седмину», то есть группу из семи единиц; в хронологической системе Книги Юбилеев здесь имеется в виду семилетний период. «Семилетие» ясно передаёт смысл современному русскому читателю.
- source_word: ኢዮቤልዉ
  choice: юбилей
  rationale: Сохранён специальный хронологический термин Книги Юбилеев — период в сорок девять лет.
- source_word: ድረ፡ ከናአን
  choice: земли Ханаанской
  rationale: Традиционное и естественное русское обозначение Ханаана с сохранением исходной конструкции «из земли».
- source_word: መጽአ
  choice: пришёл
  rationale: Прямое соответствие глаголу движения; контекст не требует уточнять цель или конечный пункт прихода.
- source_word: ተወለድከ
  choice: ты родился
  rationale: Сохранено прямое обращение во втором лице мужского рода.
theological_decisions:
- issue: Соотношение семилетия и года в датировке
  choice: «в седьмое семилетие, в седьмой год»
  alternative: «в седьмую неделю седьмого года»
  rationale: В системе летосчисления книги год является частью семилетия, а семилетие — частью юбилея. Раздельные обстоятельства сохраняют иерархию единиц и параллель синтаксису второй датировки.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Архаичное «седмина» вынесено в примечание, а в основном тексте употреблено прозрачное «семилетие». Параллельная структура обеих датировок сохранена.
