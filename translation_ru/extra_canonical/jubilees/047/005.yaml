  source_fidelity: 'В целом стих передан верно: сохранены временная формула, имя Тармут, происхождение как дочери фараона, купание в реке, обращение ко второму лицу и приказ служанкам. Однако «из воды» отсутствует в геэзском тексте и чрезмерно конкретизирует действие: глагол означает «вывести/вынести тебя».'
  naturalness: Текст написан естественным современным литературным русским. Замена «вытащить тебя из воды» на «вынести тебя» одновременно естественна и точнее по отношению к источнику.
  terminology: «Тармут», «дочь фараона» и «служанки» уместны. Историческая сноска корректно соотносит имя с формой у Иосифа Флавия и не навязывает интерпретации.
