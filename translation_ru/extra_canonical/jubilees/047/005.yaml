  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: ru
  text: И в те дни Тармут[a], дочь фараона, вышла купаться в реке. Она услышала твой плач и велела своим служанкам вынести тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Так в Книге Юбилеев названа дочь фараона; у Иосифа Флавия ей соответствует имя Термуфис (Иудейские древности 2.224).
    reason: historical_context
lexical_decisions:
- source_word: ታርሙት
  choice: Тармут
  rationale: Прямая и понятная русская транслитерация геэзского имени дочери фараона.
- source_word: ለአዕጋሪቲሃ
  choice: своим служанкам
  rationale: Обозначает сопровождавших дочь фараона женщин-служительниц; «служанкам» естественно в современном русском и сохраняет социальный оттенок.
- source_word: ያውፅኣከ
  choice: вытащить тебя из воды
  rationale: Глагол означает «вывести, вынести»; контекст реки делает «вытащить из воды» естественным, хотя указание на воду подразумевается контекстом, а не выражено отдельным словом.
- source_word: ቃለከ፡ እንዘ፡ ትበኪ
  choice: твой плач
  rationale: 'Буквально: «твой голос, когда ты плакал»; сжатое русское выражение точно передаёт слышимый плач младенца.'
