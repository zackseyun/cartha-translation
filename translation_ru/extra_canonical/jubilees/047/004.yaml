  text: And in those days Tarmuth[4], the daughter of Pharaoh, came to bathe in the river, and she heard your voice as you were weeping, and she said to her maidservants,
translation:
  language: ru
  text: И в те дни Тармут, дочь фараона, пришла омыться в реке. Она услышала твой голос, когда ты плакал, и сказала своим служанкам:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В исходной публикации нумерация строк сдвинута; повествование продолжается без разрыва, поэтому этот фрагмент дан как стих 4 согласно последовательности главы.
    reason: segmentation_note
lexical_decisions:
- source_word: ታርሙት
  choice: Тарму́т
  rationale: Передача имени непосредственно по геэзской форме Tārmut; ударение указано для удобства чтения.
- source_word: ከመ፡ ትትሐፀብ
  choice: искупаться
  rationale: Естественная современная передача целевого оборота «чтобы омыться/искупаться» в данном повествовательном контексте.
- source_word: ወሰምዐት፡ ቃለከ፡ እንዘ፡ ትበኪ
  choice: Она услышала твой плач
  rationale: 'Буквально: «услышала твой голос, когда ты плакал»; сжатая русская формулировка сохраняет смысл и обращение к Моисею во втором лице.'
- source_word: ለዕብራዊያቲሃ
  choice: своим служанкам
  rationale: В контексте это женщины из свиты дочери фараона; выбор согласуется с продолжением рассказа и не вводит неуместного утверждения об их этнической принадлежности.
