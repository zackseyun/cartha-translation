  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: ru
  text: 'Твой брат. Он разгневался, пришёл в ярость и сказал: «Кто поставил тебя правителем и судьёй над нами? Не хочешь ли ты убить меня, как вчера убил египтянина?» Тогда ты испугался и бежал из-за этого дела.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅዋከ
  choice: Твой брат
  rationale: Сохранено буквальное обращение с притяжательным суффиксом второго лица; фрагментарное начало стиха не сглажено.
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: разгневался, пришёл в ярость
  rationale: Два близких глагола передают нарастание сильного гнева; перевод сохраняет оба, не сводя второй к значению «ссорился».
- source_word: መልአከ፡ ወመኰንነ
  choice: начальником и судьёй
  rationale: 'Переданы две разные властные функции: правитель/начальник и судья. «Начальник» естественно звучит в данном вопросе и не завышает официальный статус.'
- source_word: ወሚመ፡ ትቀትለኒ፡ ትፈቅድ
  choice: Или ты хочешь убить меня
  rationale: Сохранена вопросительная альтернатива и явное значение намерения или желания.
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: из-за этого происшествия
  rationale: Контекстуально передаёт причинную связь с раскрытием убийства; «происшествие» сохраняет широкое значение ነገር без излишнего уточнения.
