  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: ru
  text: '…чтобы привести тебя, и он привёл тебя к ней. Она вынула тебя из корзины и сжалилась над тобой. Тогда твоя сестра сказала ей: «Пойти ли мне и позвать для тебя одну из еврейских женщин, чтобы она растила его и кормила грудью?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአውፅአተከ፡ እምሤፍቅ
  choice: Она вынула тебя из корзины
  rationale: Передаёт действие извлечения и значение ሤፍቅ как корзины; местоимение второго лица сохранено.
- source_word: ወመሐረተከ
  choice: и сжалилась над тобой
  rationale: Естественно и точно передаёт сострадание, не добавляя мотивов или богословского истолкования.
- source_word: እሖርኑ
  choice: Пойти ли мне
  rationale: Вопросительная частица и форма первого лица переданы прямым вопросом-предложением.
- source_word: ታሐፅኖ፡ ወታጠብዎ
  choice: чтобы она растила его и кормила грудью
  rationale: 'Сохранены оба исходных глагола: первый обозначает выращивание/взращивание ребёнка, второй — кормление грудью. Они не сведены к одному действию.'
