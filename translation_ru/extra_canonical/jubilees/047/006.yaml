  register: 'Современный литературный русский язык с повествовательной торжественностью. Начальное многоточие сохранено, поскольку стих начинается продолжением предшествующего высказывания. Гендерные и личные местоимения переданы согласно исходной последовательности: мужчине поручено привести ребёнка, затем женщина вынимает его из корзины, а сестра обращается к ней.'
