  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
translation:
  language: ru
  text: 'И ты убил его и спрятал в песке. На второй день ты застал двух сынов Израиля дерущимися и сказал тому, кто поступал неправильно: «Почему ты бьёшь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант перевода: «Почему ты бьёшь своего товарища?» Объект глагола подразумевается контекстом, но в данном эфиопском тексте прямо не назван.'
    reason: Сохраняет зафиксированный вариант перевода, не вводя отсутствующее в источнике дополнение в основной текст.
lexical_decisions:
- source_word: ወቀተልኮ፡ ወኀባእኮ፡ ውስተ፡ ኆፃ
  choice: И ты убил его и спрятал в песке
  rationale: Передаёт последовательность действий и прямое значение слов; повторное местоимение «его» после «спрятал» по-русски избыточно.
- source_word: ወበሳኒታ፡ ዕለት
  choice: На второй день
  rationale: Естественная и точная передача временного указания.
- source_word: ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል
  choice: как двое из сынов Израиля дерутся
  rationale: Конструкция передаёт двух израильтян в процессе взаимной ссоры или драки, не добавляя отсутствующего в тексте объекта удара.
- source_word: ዘይትአገሎ
  choice: тому, кто был неправ
  rationale: Кратко и естественно обозначает виновную сторону в происходившей драке, сохраняя нравственную оценку исходного текста.
- source_word: ለምንት፡ ትዘብጥ
  choice: Почему ты бьёшь?
  rationale: Исходный фрагмент заканчивается глаголом «бить/ударять» без выраженного объекта, поэтому объект не внесён в основной текст.
