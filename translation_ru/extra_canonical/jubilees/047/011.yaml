translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Выражение «сыны Израиля» сохранено как уместное библейское обозначение народа; синтаксис при этом сделан естественным для современного читателя. Начальное ውሉደ፡ እስራኤል рассматривается как остаток предыдущего стиха и не дублируется.
