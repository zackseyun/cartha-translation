  yaml_path: translation/extra_canonical/jubilees/047/009.yaml
  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: ru
  text: И была выплачена плата, и она вскормила тебя. После этого, когда ты вырос, тебя отвели к дочери фараона, и ты стал ей сыном. Твой отец Амрам научил тебя письму, и, когда тебе исполнилось три седмины лет[a], он привёл тебя ко двору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть двадцать один год.
    reason: Поясняет непривычное исчисление времени «три седмины лет», не заменяя его в основном тексте.
lexical_decisions:
- source_word: ዐስበ
  choice: была выплачена плата
  rationale: Передаёт значение выплаты вознаграждения и сохраняет неопределённость относительно названного исполнителя действия.
- source_word: ሐፀነተከ
  choice: она вскормила тебя
  rationale: Женская форма указывает на женщину; глагол в данном контексте означает вскармливать и растить младенца.
- source_word: ልሂቀከ
  choice: когда ты вырос
  rationale: Передаёт взросление или достижение достаточного возраста без добавления сестры, которой в исходном тексте здесь нет.
- source_word: ወሰዱከ
  choice: тебя отвели
  rationale: Множественный неопределённый субъект сохранён без конкретизации.
- source_word: መጽሐፈ
  choice: письму
  rationale: В сочетании с глаголом обучения обозначает умение писать или письменность; русское «письму» естественно в данном контексте.
- source_word: ሠለስተ፡ ሱባዔ
  choice: три седмины лет
  rationale: Сохраняет характерную для книги меру времени — три периода по семь лет, то есть двадцать один год.
- source_word: ዐጸደ
  choice: ко двору
  rationale: По контексту обозначает двор или придворное пространство; не добавляется отсутствующее в стихе определение «царский».
