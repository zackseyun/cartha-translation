  yaml_path: translation/extra_canonical/jubilees/047/007.yaml
  text: And she said to her, “Go.” And she went and called your mother Jochebed, and she gave her wages, and she nursed you.
translation:
  language: ru
  text: 'Она сказала ей: «Иди». Та пошла и позвала твою мать, Иохаведу. Дочь фараона дала ей плату, а твоя мать вскормила тебя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: «Иди»
  rationale: Женская форма повелительного наклонения передана краткой и естественной русской репликой.
- source_word: እምከ ለአዮካቤድ
  choice: твою мать Иохавед
  rationale: Сохранены обращение к Моисею во втором лице и личное имя матери без пояснительного приложения.
- source_word: ዐስበ
  choice: плату
  rationale: Слово обозначает вознаграждение или плату; в данном контексте естественно «дала ей плату».
- source_word: ወሐፀነተከ
  choice: и та вскормила тебя
  rationale: Глагол в контексте означает кормление и выхаживание младенца; «вскормила» передаёт это ёмко и в dignified narrative register.
