  to: И продолжали они бросать младенцев в реку семь месяцев — до того дня, когда родился ты. Мать скрывала тебя три месяца, но из-за тебя о ней узнали. Тогда она сделала для тебя корзину, обмазала её смолой и асфальтом, поместила её в камышах у берега реки и положила тебя в неё на семь дней. По ночам мать приходила кормить тебя грудью, а днём твоя сестра Мариам стерегла тебя.
