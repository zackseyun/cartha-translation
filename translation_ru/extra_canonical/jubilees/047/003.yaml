  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: ru
  text: И продолжали они бросать младенцев в реку семь месяцев — до того дня, когда родился ты. Мать скрывала тебя три месяца, но из-за тебя о ней узнали. Тогда она сделала для тебя корзину, обмазала её смолой и асфальтом, поместила её в камышах у берега реки и положила тебя в неё на семь дней. По ночам мать приходила кормить тебя грудью, а днём твоя сестра Мариам стерегла тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገድፉ
  choice: бросать младенцев в реку
  rationale: Глагол передаёт продолжающееся бросание; объект и место явно подразумеваются контекстом рассказа, поэтому они выражены по-русски для ясности.
- source_word: ሤፍተ
  choice: корзину
  rationale: В данном контексте обозначает небольшой водонепроницаемый короб или корзину для младенца; «корзина» естественно и точно передаёт предмет.
- source_word: ፒሳ፡ ወአስፋልጠ
  choice: смолой и асфальтом
  rationale: Сохранены два названных материала покрытия без их сведения к одному веществу.
- source_word: ታጠብወከ
  choice: кормить тебя грудью
  rationale: Глагол означает грудное вскармливание; явное выражение устраняет неестественную для современного русского двусмысленность слова «кормить».
- source_word: ትዐቅበከ
  choice: стерегла тебя
  rationale: Передаёт охрану и присмотр, сохраняя активный характер действия.
