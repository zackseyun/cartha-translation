lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ
  choice: время бедствия
  rationale: Передаёт временное выражение и тяжёлое притеснение без излишнего уточнения его характера.
- source_word: ውሉደ፡ እስራኤል
  choice: детей Израиля
  rationale: Сохраняет традиционное библейское обозначение народа Израиля и форму исходного выражения.
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: фараон, царь Египта
  rationale: Естественный русский порядок приложения, сохраняющий оба титульных обозначения.
- source_word: ውሉዶሙ፡ ኵሎ
  choice: всех своих детей
  rationale: Передаёт общее существительное «дети» с притяжательным значением и не сужает его заранее до сыновей.
- source_word: ርሰ፡ ዘተወልደ
  choice: каждого родившегося мальчика
  rationale: Передаёт уточнение о мужском поле новорождённых естественным современным русским языком.
- source_word: ውስተ፡ ፈለግ
  choice: в реку
  rationale: Сохраняет неопределённое обозначение реки в исходном тексте, не добавляя название Нила.
