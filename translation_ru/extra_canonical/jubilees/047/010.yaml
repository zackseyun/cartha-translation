  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: ru
  text: И ты пробыл при царском дворе три седмины лет — до того дня, когда вышел из царского двора и увидел египтянина, избивавшего твоего соотечественника, одного из твоих братьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ዐጸድ፡ … ዐጸደ፡ መንግሥት
  choice: при царском дворе … из царского двора
  rationale: Сочетание обозначает двор или дворцовое окружение царя; по-русски «при царском дворе» естественно передаёт длительное пребывание, а при глаголе выхода сохранено пространственное «из царского двора».
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ
  choice: три седмины лет
  rationale: Буквально «три недели/седмины лет», то есть три семилетия. Формулировка сохраняет характерную для Книги Юбилеев хронологическую единицу, не заменяя её толкованием «двадцать один год».
- source_word: ይዘብጦ
  choice: избивавшего
  rationale: Причастная форма описывает египтянина, наносившего побои. «Избивавшего» в данном контексте естественнее и сильнее нейтрального «ударявшего».
- source_word: ለካልእከ፡ ዘእምነ
  choice: твоего соотечественника, одного из твоих братьев
  rationale: Передана двойная характеристика жертвы как человека из народа Моисея и одного из его братьев; формулировка согласуется с ясным контекстуальным смыслом и не сводит «братьев» к кровному родству.
