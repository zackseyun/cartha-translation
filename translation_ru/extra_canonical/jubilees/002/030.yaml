  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: ru
  text: И пусть они в этот день ничего не вносят и не выносят из дома в дом, ибо он свят и благословен более всякого юбилейного дня юбилеев.[a] В эту субботу мы соблюдали субботу на небесах ещё до того, как всякой плоти было открыто соблюдать её на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «свят и благословен более всякого юбилейного дня юбилеев» в оригинале необычно и не вполне ясно. Возможно, это усиленное сравнение, возвышающее еженедельную субботу даже над величайшими праздничными циклами.
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ
  choice: и пусть они… не вносят и не выносят
  rationale: Сохраняет парную запретительную конструкцию и направление действий исходного текста.
- source_word: እምቤት፡ ቤተ
  choice: из дома в дом
  rationale: Буквально передаёт пространственную формулу; добавленное «ничего» естественно по-русски выражает подразумеваемый объект глаголов.
- source_word: ቅድስት፡ ይእቲ፡ ወቡርክት፡ ይእቲ
  choice: он свят и благословен
  rationale: Местоимение согласовано с русским словом «день»; два предиката сохранены без превращения обоих в сравнительную степень.
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት
  choice: юбилейного дня юбилеев
  rationale: Сохраняет эксплицитное повторение «юбилей» и необычную эмфатическую конструкцию оригинала.
- source_word: አሰንበትነ
  choice: мы соблюдали субботу
  rationale: Передаёт глагольную идею субботнего покоя/соблюдения субботы и сохраняет первое лицо множественного числа.
- source_word: ለኵሉ፡ ዘሥጋ
  choice: всякой плоти
  rationale: Сохраняет традиционный антропологический оборот оригинала, не сужая его до «всех людей».
theological_decisions:
- issue: Небесное соблюдение субботы до её откровения земным существам
  choice: «мы соблюдали субботу на небесах»
  alternative: «на небесах мы покоились»
  rationale: Сохранены небесный субъект во множественном числе и прямая связь с субботой; личность говорящих не уточняется.
- issue: Сравнение субботы с «юбилейным днём юбилеев»
  choice: Сохранить необычную сравнительную формулу в основном тексте
  alternative: Истолковать её как утверждение, что еженедельная суббота выше всех праздничных циклов
  rationale: Источник труден; перевод не должен превращать возможный смысл в однозначное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён лишь там, где это необходимо для ясности; трудная формула о юбилее сохранена, а не сглажена толкованием.
