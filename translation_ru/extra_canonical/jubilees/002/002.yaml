base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: ru
  text: 'Ибо в первый день Он сотворил небеса в вышине, землю, воды и всех духов, служащих пред Ним: ангелов присутствия[a][b], ангелов освящения, ангелов духа огня, ангелов духа облаков, тьмы, снега, града и инея; ангелов голосов, громов и молний; ангелов духов холода и зноя, зимы, весны, жатвы и лета — и всех духов Его творений, которые пребывают на небесах, на земле, в морях, в глубинах под землёй, во мраке, в ночи, при свете, на заре и утром. Всё это Он приготовил в знании Своего сердца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ангелов лица», то есть ангелов, предстоящих перед Божьим лицом.'
    reason: lexical_clarification
  - marker: b
    text: Перечень ангельских и стихийных духов в эфиопском тексте синтаксически очень плотен и, возможно, местами искажён или сокращён при передаче. Перевод сохраняет его последовательность, не пытаясь полностью сгладить трудности.
    reason: segmentation_note
lexical_decisions:
- source_word: መላእክተ ገጽ
  choice: ангелов присутствия
  rationale: Буквально «ангелы лица»; в данном устойчивом выражении имеется в виду пребывание перед Божьим лицом, то есть в Его присутствии.
- source_word: መላእክተ ቅዳሴ
  choice: ангелов освящения
  rationale: Сохраняет отглагольное и культовое значение ቅዳሴ, не уточняя без основания, освящают ли эти ангелы или сами относятся к святости.
- source_word: መናፍስተ ትገብሩ
  choice: духов Его дел
  rationale: Передаёт связь духов с Божьими делами и следует традиционному членению трудного эфиопского перечня, не сводя духов просто к природным явлениям.
- source_word: ወጽባሕ
  choice: и утром
  rationale: Непосредственно передаёт чтение данного текста «утро», а не вариант «вечер».
- source_word: በአእምሮ ልቡ
  choice: в знании Своего сердца
  rationale: Сохраняет основное значение አእምሮ «знание, понимание» и не заменяет его более интерпретирующим «замыслом».
theological_decisions:
- issue: Статус ангельских и природных духов как сотворённых существ
  choice: Все перечисленные духи включены в прямое дополнение к «сотворил».
  alternative: Понять некоторые явления лишь как сферы служения ангелов, а не как сотворённых духов.
  rationale: Синтаксис источника помещает весь перечень после глагола творения; перевод сохраняет эту космологическую концепцию текста, не согласуя её искусственно с позднейшими системами.
- issue: «Ангелы присутствия» и «ангелы освящения»
  choice: Сохранены как две отдельные категории.
  alternative: Отождествить их с конкретными именованными ангельскими чинами.
  rationale: Источник не даёт названий позднейшей ангелологии, поэтому перевод не вводит конфессиональную классификацию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Длинный исходный каталог разделён точками с запятой и тире для ясности; архаичные формы устранены, но формула «пред Ним» сохранена как естественная для сакрального регистра. Местоимения, относящиеся к Богу, даны с прописной буквы.
