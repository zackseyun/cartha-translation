lexical_decisions:
- source_word: ጥዒና
  choice: благополучия
  rationale: Слово обозначает здоровье, благополучие или процветание; «благополучие» естественно по-русски и сохраняет широту значения.
- source_word: ዘይሰርር
  choice: всё, что летает
  rationale: Глагол связан с полётом; перевод не смешивает эту категорию с движущимися по земле существами, названными отдельно.
- source_word: አስለጦ
  choice: дал им власть
  rationale: Передаёт наделение властью или господством без усиления до идеи абсолютного владения.
- source_word: ዘመደ
  choice: виды
  rationale: В перечне творения слово обозначает разряды или виды сотворённого; «виды» понятно современному читателю.
