base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: ru
  text: 'В первый день Он совершил семь великих дел. А во второй день Он создал твердь посреди вод, и в тот день воды разделились: половина их поднялась вверх, а половина опустилась вниз, под твердь, находящуюся посередине, над поверхностью всей земли.[a] И только это Он создал.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «а половина опустилась вниз, под твердь посередине, над поверхностью всей земли».'
    reason: Синтаксическая связь выражения «посередине» допускает отнесение либо к тверди, либо ко всей пространственной конструкции.
  - marker: b
    text: 'Буквально: «И только это».'
    reason: В исходном тексте заключительная фраза не повторяет глагол; в основном тексте он восполнен из контекста.
lexical_decisions:
- source_word: ግብረ፡ ዐበይተ
  choice: великих дел
  rationale: Сочетание означает «великие дела/творения»; «дела» естественно по-русски и не сужает смысл до материальных объектов.
- source_word: ምጽናዓተ
  choice: твердь
  rationale: Традиционный и узнаваемый русский эквивалент небесного свода в контексте рассказа о творении; сохраняет связь с Быт. 1 и древнюю космологическую образность.
- source_word: ማእከለ፡ ማይ
  choice: посреди вод
  rationale: Передаёт пространственное значение исходного выражения без лишнего истолкования.
- source_word: መንፈቆሙ
  choice: половина их
  rationale: Точно воспроизводит двукратное симметричное деление вод.
- source_word: ዲበ፡ ገጸ፡ ለኵሉ፡ ምድር
  choice: над поверхностью всей земли
  rationale: Естественно передаёт буквальный образ «над лицом всей земли» в современном литературном русском.
- source_word: ወዘንተ፡ ባሕቲቶ
  choice: И только это Он создал
  rationale: «Только это» соответствует краткому исходному выражению, а подразумеваемый глагол восполнен из непосредственного контекста ради ясности.
theological_decisions:
- issue: Космологический термин для небесного свода
  choice: твердь
  alternative: свод / пространство
  rationale: «Твердь» сохраняет древний образ и библейскую интертекстуальность, не заменяя его современной научной моделью.
- issue: Подразумеваемый глагол в заключительной фразе
  choice: И только это Он создал
  alternative: И только это
  rationale: Глагол прямо не повторён, но подразумевается контекстом; его восполнение даёт нормальное русское предложение, а сноска сохраняет более буквальную возможность.
translation_notes:
  register: Современный литературный русский с dignified библейским оттенком. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога. Синтаксис сохраняет последовательность и параллелизм исходного рассказа, но расчленён пунктуацией для ясности.
