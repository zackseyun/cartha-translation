  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: ru
  text: …в одно место за пределами этой тверди, и показалась суша. В тот день Он создал все моря, каждое в своём вместилище, все реки и скопления вод в горах и по всей земле, все озёра, всю росу земную, семя, которое сеют, всё, что произрастает, плодовые деревья, леса и Эдемский сад в Эдеме — для наслаждения. Все эти четыре великих рода[a] Он сотворил в третий день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «все эти четыре великих рода» не вполне ясно: в сжатом перечне соединены особенности земной поверхности, воды, растительность и Эдем. Вероятно, число четыре относится к обобщённым группам, а не к каждому названному предмету.'
    reason: segmentation_note
lexical_decisions:
- source_word: አፍአ፡ እምጽናዓትዝ
  choice: за пределами этой тверди
  rationale: Передаёт пространственное значение «вне/за пределами» и традиционное, но понятное русское название небесного свода — «твердь».
- source_word: በበ፡ ምትባኢሆሙ
  choice: каждое в своём вместилище
  rationale: Сохраняет распределительное значение удвоенного በ («каждое согласно…») и идею отдельных мест собирания морей.
- source_word: ምጉባኢሆሙ፡ ለማያት
  choice: скопления вод
  rationale: Буквально и естественно передаёт места/массы собранных вод, не сводя выражение к одному конкретному типу водоёма.
- source_word: ምዕቃባተ
  choice: озёра
  rationale: По контексту перечня водных объектов обозначает водоёмы или вместилища воды; «озёра» даёт ясный современный эквивалент.
- source_word: አማተ
  choice: леса
  rationale: Сохраняет отдельный элемент перечня между плодоносящими деревьями и Эдемским садом, ранее пропущенный в английском слое.
- source_word: ለተድላ
  choice: для наслаждения
  rationale: Передаёт целевое значение и сохраняет связь Эдема с отрадой/наслаждением без дополнительного толкования.
- source_word: ለኵሉ፡…አርባዕተ፡ ዘንተ፡ ዐበይተ፡ ትውልደ፡ ገብረ
  choice: Все эти четыре великих рода Он сотворил
  rationale: Префикс ለ- здесь понят как показатель прямого дополнения, а не «для»; порядок слов слегка нормализован для литературного русского.
theological_decisions:
- issue: Соотношение творения в третий день с перечнем природных объектов и Эдемом
  choice: Сохранён прямой порядок утверждений источника без согласования с иной схемой творения
  alternative: Перестроить или пояснить перечень в соответствии с Быт 1
  rationale: Текст Юбилеев следует передавать в его собственной формулировке, не устраняя возможное напряжение с другими традициями.
- issue: Неясность выражения «четыре великих рода»
  choice: Сохранена обобщающая формула с примечанием
  alternative: Явно разделить перечень на четыре заранее определённые категории
  rationale: Источник не указывает однозначно, какие именно элементы составляют четыре рода; явная классификация была бы толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Начальное многоточие отмечает, что предоставленный стих начинается продолжением фразы из предыдущего контекста. Местоимение «Он» указывает на Бога по контексту и пишется с прописной буквы в соответствии с русской религиозно-литературной нормой; архаизмы сведены к общеупотребительному библейскому слову «твердь».
