base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: ru
  text: 'И ангел присутствия сказал Моисею по слову Господа: «Запиши всё повествование о творении: как за шесть дней Господь Бог завершил все Свои дела и всё, что сотворил; и в седьмой день Он почил, и освятил этот день на все века, и установил его знамением для всех».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: ангел присутствия
  rationale: Буквально сочетание означает «ангел лица/присутствия». В данном контексте «присутствия» естественно по-русски и сохраняет традиционный смысл титула.
- source_word: በቃለ፡ እግዚአብሔር፡
  choice: по слову Господа
  rationale: Формально передаёт способ или основание речи ангела, не подменяя выражение более толковательным «по повелению».
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት፡
  choice: всё повествование о творении
  rationale: Передаёт совокупный рассказ/изложение о сотворении и звучит естественнее буквального «всё дело творения».
- source_word: ወአዕረፈ፡
  choice: почил
  rationale: Сохраняет библейский регистр и значение прекращения труда, не сводя выражение к бытовому «отдохнул».
- source_word: ለኵሉ፡ ዓለማት፡
  choice: на все века
  rationale: Множественное «миры/века» здесь имеет временной смысл продолжительности во все эпохи.
- source_word: ትእምርተ፡ ለኵሉ፡
  choice: знамением для всех
  rationale: Сохраняет заключительное универсальное выражение без добавления отсутствующего в данном тексте существительного.
theological_decisions:
- issue: Соотношение Божьего слова и речи ангела
  choice: «ангел присутствия сказал Моисею по слову Господа»
  alternative: «ангел присутствия по повелению Господа сказал Моисею»
  rationale: Выбрана менее интерпретирующая формулировка, сохраняющая исходное «слово» и посредническую структуру речи.
- issue: К чему относится освящение
  choice: «освятил этот день»
  alternative: «освятил его»
  rationale: В русском языке явное повторение «этот день» устраняет случайную местоименную неясность, тогда как источник однозначно указывает на седьмой день.
- issue: Адресат или сфера знамения
  choice: «знамением для всех»
  alternative: «знамением для всех Своих дел»
  rationale: Источник заканчивается универсальным «для всех» и не содержит здесь явного слова «дел»; поэтому дополнение не внесено.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён ровно настолько, чтобы длинная исходная фраза оставалась ясной; архаизмы сведены к уместному глаголу «почил». Кавычки и прописные местоимения при обращении к Богу соответствуют принятому русскому религиозно-литературному оформлению.
