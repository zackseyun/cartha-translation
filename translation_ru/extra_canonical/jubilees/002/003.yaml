  source_fidelity: 'Текст точно передаёт последовательность геэзского оригинала: «тогда мы увидели Его дела», «благословили Его», «воздали хвалу перед Ним», «за все Его дела», с намеренно незавершённым «потому что». Повтор «Его дела» сохранён. Оборот ሰብሕነ፡ ቅድሜሁ естественно и без смыслового добавления передан как «воздали хвалу пред Ним».'
