  terminology: «Благословили Его» корректно передаёт ባረክናሁ и сохраняет прямой объект. «Воздали хвалу пред Ним» удачно отражает хвалу в Его присутствии, не создавая неестественного повтора «Его … пред Ним». Прописные местоимения — приемлемая русская библейская редакционная конвенция.
