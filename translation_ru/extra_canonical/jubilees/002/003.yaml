  text: And then we saw his works, and we blessed him and offered praise before him on account of all his works, because
translation:
  language: ru
  text: И тогда мы увидели Его дела, и благословили Его, и воздали хвалу пред Ним за все Его дела, потому что
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምግባሮ / ምግባሩ
  choice: Его дела / Его дела
  rationale: Передаёт «деяния, дела» естественным русским выражением и сохраняет повтор исходного текста.
- source_word: ባረክናሁ
  choice: благословили Его
  rationale: Сохраняет прямой объект и обычное библейское значение глагола.
- source_word: ሰብሕነ፡ ቅድሜሁ
  choice: воздали хвалу пред Ним
  rationale: Естественно передаёт действие хвалы в присутствии Бога, не создавая неуклюжего повтора местоимений.
- source_word: በእንተ
  choice: за
  rationale: 'В данном контексте выражает основание хвалы: «за все Его дела».'
- source_word: እስመ
  choice: потому что
  rationale: Сохраняет незавершённую причинную связь с последующим текстом.
theological_decisions:
- issue: Адресат благословения и хвалы
  choice: Местоимение «Его / Ним» с прописной буквы
  alternative: 'Строчная буква: «его / ним»'
  rationale: Контекст указывает на Бога; прописная буква соответствует достоинству русского библейского регистра, не добавляя нового содержания.
- issue: Синтаксис выражения хвалы
  choice: «воздали хвалу пред Ним»
  alternative: «хвалили Его пред Ним» или «восхвалили Его»
  rationale: Выбор сохраняет отдельное обстоятельство «пред Ним» и избегает искусственного «Его пред Ним».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конечное «потому что» намеренно оставлено открытым, поскольку стих представляет собой часть продолжающегося предложения.
