  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: ru
  text: …для лет. Оно отделяет свет от тьмы и способствует благополучию, чтобы всё, что прорастает и растёт на земле, преуспевало.[a] Эти три рода Он сотворил в четвёртый день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова, переведённые как «способствует благополучию» и «преуспевало», могут также означать «способствует исцелению» и «обретало здоровье» либо «способствует процветанию» и «процветало»; речь идёт о благотворном воздействии небесных светил на земной рост.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: отделяет свет от тьмы
  rationale: Конструкция с ማእከለ перед обоими существительными является идиомой разграничения между двумя областями; буквальное «между серединой света и серединой тьмы» по-русски неестественно.
- source_word: ጠዐዮ፡ … ይጥዐይ
  choice: способствует благополучию … преуспевало
  rationale: Сохраняется повтор одного корня и широкий смысл благотворного воздействия; возможны оттенки исцеления и процветания.
- source_word: ይሠርፅ፡ ወይለቍፅ
  choice: прорастает и растёт
  rationale: Передаёт парные действия появления ростка и последующего роста.
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: Эти три рода
  rationale: Формально сохраняет указание на три категории созданного, названные в контексте.
