  terminology: '«Эти три рода» адекватно передаёт указание на три вида/категории. Прописное «Он» для Творца последовательно. Сноску следует немного выровнять грамматически: при альтернативе «исцеление» нужно «способствует исцелению», а не «служит исцелению», чтобы обе альтернативы относились к той же конструкции.'
