  register: Современный литературный русский с достоинством библейского повествования. Начальное «для лет» сохранено как продолжение синтаксиса предыдущего стиха. Местоимение «Оно» соотнесено с ближайшим контекстуальным предметом, а прописное «Он» обозначает Бога как Творца.
