  text: And the waters did so, just as he told them, and they withdrew from the face of the earth.
translation:
  language: ru
  text: И воды сделали так, как Он сказал им, и отступили с лица земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с поверхности земли».'
    reason: Уточняет пространственный смысл выражения «с лица земли» и сохраняет возможный менее образный вариант.
lexical_decisions:
- source_word: ወገብሩ፡ ከማሁ፡ ማያት
  choice: И воды сделали так
  rationale: 'Сохраняет прямую конструкцию источника: воды исполнили сказанное им.'
- source_word: በከመ፡ ይቤሎሙ
  choice: как Он повелел им
  rationale: Буквально глагол связан с речью («как сказал им»), но в контексте творческого распоряжения «повелел» естественно передаёт силу высказывания; местоимение «Он» указывает на Бога и пишется с прописной по принятому русскому библейскому регистру.
- source_word: ወተገብሡ
  choice: и отступили
  rationale: Передаёт удаление вод без добавления не выраженного в сохранившемся отрывке направления или конечного пункта.
- source_word: እምዲበ፡ ገጸ፡ ለምድር
  choice: с лица земли
  rationale: Естественный и узнаваемый русский эквивалент пространственного выражения «с/от поверхности лица земли», сохраняющий образ «лица земли».
