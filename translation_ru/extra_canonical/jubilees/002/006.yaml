  register: Современный литературный русский с достоинством библейского повествования. Синтаксис краткий и близкий к геэзскому источнику; конечное «в/внутрь» не воспроизводится, поскольку в представленном тексте после ውስተ отсутствует выраженный объект и добавление направления породило бы незавершённую либо предположительную фразу.
