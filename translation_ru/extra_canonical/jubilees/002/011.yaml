  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: ru
  text: В пятый день он сотворил огромных морских чудовищ[a] в глубинах вод, ибо они были первыми существами из плоти, созданными его руками, а также всё живое, что движется в водах, и всё, что летает,—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огромных морских животных» (или «великих морских созданий»).'
    reason: Исходное обозначение допускает более нейтральное понимание крупных морских существ; «чудовища» передаёт традиционный образ, но не обязательно подразумевает злобных или мифических существ.
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: огромных морских чудовищ
  rationale: Передаёт великих водных созданий; слово «чудовища» сохраняет необычайность и масштаб образа, не уточняя их биологический вид.
- source_word: ቀላያተ፡ ማያት
  choice: в глубинах вод
  rationale: Естественно передаёт локальное выражение о глубинных пространствах вод.
- source_word: ዘሥጋ
  choice: существами из плоти
  rationale: Избегает нравственно-богословского оттенка русского прилагательного «плотские» и сохраняет указание на телесную природу созданий.
- source_word: ዘይትነወስ፡ ውስተ፡ ማያት
  choice: всё живое, что движется в водах
  rationale: Выражает совокупность движущихся водных существ естественным современным русским языком.
- source_word: ዘይሰርር
  choice: всё, что летает
  rationale: Сохраняет широкое обозначение летающих созданий без преждевременного сужения до одних птиц.
theological_decisions:
- issue: Первые создания из плоти
  choice: «они стали первыми существами из плоти, созданными его руками»
  alternative: «они были первыми плотскими существами, сотворёнными его руками»
  rationale: Выбранная формулировка сохраняет хронологическое утверждение текста, но не вносит возможной ассоциации слова «плотские» с греховностью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Строчная форма местоимения «он» не добавляет отсутствующей в источнике графической почтительности. Конечное тире сохранено, поскольку стих синтаксически продолжается далее.
