translation:
  language: ru
  text: и для славы превыше всех дней. Этот закон и свидетельство даны сынам Израиля как вечный закон для всех их поколений.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: для славы
  rationale: Предлог ለ- передаёт целевое или предназначительное значение; формулировка сохраняет связь с предыдущим контекстом и не устраняет фрагментарность начала стиха.
- source_word: እምኵሉ፡ መዋዕል
  choice: превыше всех дней
  rationale: Сравнительная конструкция с እም естественно выражена словом «превыше»; возвышенный оборот уместен в контексте особого статуса дня.
- source_word: ሕግ፡ ወስምዕ
  choice: закон и свидетельство
  rationale: Оба координированных существительных сохранены без сведения к одному понятию.
- source_word: ለደቂቀ፡ እስራኤል
  choice: сынам Израиля
  rationale: Традиционное и понятное библейское обозначение народа Израиля, соответствующее буквальному «детям/сынам Израиля».
- source_word: ሕገ፡ ዘለዓለም
  choice: вечный закон
  rationale: Передаёт устойчивое значение непреходящего установления без добавочной конфессиональной интерпретации.
- source_word: ለትውልዶሙ
  choice: для всех их поколений
  rationale: Передаёт распространение установления на последовательные поколения; «всех» естественно раскрывает обобщающее значение формы.
theological_decisions:
- issue: Соотношение «закона» и «свидетельства»
  choice: 'Сохранить как два соединённых понятия: «этот закон и это свидетельство»'
  alternative: Понять как единое составное определение или назвать свидетельством сам закон
  rationale: Исходный текст координирует два существительных, поэтому перевод не должен заранее отождествлять их.
- issue: Продолжительность установления
  choice: «вечный закон для всех их поколений»
  alternative: «неизменный закон на протяжении их поколений»
  rationale: Формулировка сохраняет сильное временное значение ዘለዓለም и одновременно отдельное указание на поколения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Начальное «и» и синтаксическая незавершённость первой фразы сохранены, поскольку стих продолжает предшествующее перечисление.
