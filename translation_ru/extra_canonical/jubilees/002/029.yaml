base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: ru
  text: 'Также объяви и скажи сынам Израиля: вот закон об этом дне: пусть они соблюдают в этот день субботу и не отступают от неё по заблуждению своих сердец, чтобы не делать в этот день никакой неподобающей работы, не исполнять в этот день своей воли, не готовить ничего для еды или питья, не черпать воды и не вносить и не выносить через свои ворота никакой ноши, которой они не приготовили себе в шестой день[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которой они не приготовили себе в своих жилищах в шестой день».'
    reason: Вариантное чтение, отражённое в английском аудите. Слова «в своих жилищах» отсутствуют в предоставленном геэзском тексте, поэтому не включены в основной текст.
lexical_decisions:
- source_word: ከማሁ
  choice: Так же
  rationale: Передаёт значение «подобным образом, так же», а не простое соединительное «и».
- source_word: ወንገር
  choice: возвести … и скажи
  rationale: Сохраняет парную формулу провозглашения, но выражает её естественным и достойным современным русским языком.
- source_word: ወያሰንብቱ፡ ባቲ
  choice: пусть они соблюдают в этот день субботу
  rationale: Глагол обозначает соблюдение субботнего покоя; повтор «в этот день» ясно сохраняет отсылку к названному дню.
- source_word: ፈቃዶሙ
  choice: собственных желаний
  rationale: Сохраняет широкий смысл «воля, желание, угодное им», не сужая его до конкретного вида развлечения.
- source_word: ኵሉ፡ ዘይጸውር
  choice: никакой ноши
  rationale: Передаёт предмет, который несут, без добавления отсутствующего в источнике уточнения о жилищах.
- source_word: በሰዱስ
  choice: в шестой день
  rationale: Формально сохраняет обозначение шестого дня недели и связь предварительного приготовления с ним.
theological_decisions:
- issue: Характер запретов субботнего дня
  choice: Передать их как прямые предписания сынам Израиля, не добавляя позднейших конфессиональных толкований.
  alternative: Разъяснить запреты через нормы определённой иудейской или христианской традиции.
  rationale: Источник перечисляет действия непосредственно и не определяет их посредством позднейшей системы толкования.
- issue: Фраза о собственном желании
  choice: «не исполняют … собственных желаний»
  alternative: «не занимаются развлечениями» или «не делают угодного себе»
  rationale: Выбранная формулировка сохраняет богословски значимую широту выражения и не сводит его к отдыху или развлечениям.
translation_notes:
  register: Современный литературный русский с торжественным библейским оттенком. Императивная формула и последовательность запретов сохранены; архаизмы сведены к понятным словам «возвести» и «сыны Израиля». Начальная фраза до ከማሁ в предоставленном фрагменте относится к предшествующему контексту по принятому делению стиха и поэтому не включена. Добавление «в их жилищах» отвергнуто как не засвидетельствованное данным геэзским текстом.
