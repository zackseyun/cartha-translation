  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: ru
  text: 'Вот что он совершил во второй день. А в третий день он[a] сказал водам: «Пусть они отступят с лица всей земли в одно место, и пусть покажется суша».'
  philosophy: optimal-equivalence
  footnotes:
