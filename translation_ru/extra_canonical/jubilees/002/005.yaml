    reason: textual_variant
lexical_decisions:
- source_word: ገብረ፡ ገብረ
  choice: совершил
  rationale: Повтор однокоренных слов буквально означает «сделал дело / совершил работу»; по-русски естественно передать это одним глаголом в обороте «вот что он совершил».
- source_word: ይቤ፡ ለማያት
  choice: сказал водам
  rationale: Передаёт исходный глагол речи ይቤ точнее, чем более истолковывающее «повелел водам».
- source_word: ይኅለፉ
  choice: пусть они отступят
  rationale: Сохраняет форму повеления в прямой речи и передаёт удаление вод с поверхности земли.
- source_word: እምቅድመ፡ ገጸ፡ ለኵላ፡ ምድር
  choice: с лица всей земли
  rationale: Сохраняет образное выражение исходного текста, оставаясь понятным в современном литературном русском.
- source_word: ያስተርኢ፡ የብስ
  choice: пусть покажется суша
  rationale: Передаёт параллельное повеление о явлении сухой земли без добавочного толкования.
theological_decisions:
- issue: Характер Божьей речи водам
  choice: сказал водам с последующей прямой повелительной речью
  alternative: повелел водам отступить
  rationale: Исходный текст использует глагол «сказал» и формы повеления; прямая речь сохраняет его грамматику и не устраняет олицетворённое обращение к водам.
translation_notes:
  register: Современный литературный русский с библейски уместной торжественностью. Прямая речь сохраняет структуру геэзского текста; архаические «да отступят» и «пред лицом» заменены понятными современными формами.
