  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: ru
  text: над днём и ночью и отделять свет от тьмы. И Бог назначил солнце великим знамением на земле — для дней, и суббот, и месяцев, и праздников, и лет, и субботних лет, и юбилеев, и для всякого времени.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፈሊጥ
  choice: чтобы отделять
  rationale: Передаёт целевую/инфинитивную связь и сохраняет координацию с предшествующим контекстом о владычестве над днём и ночью.
- source_word: ለትእምርት፡ ዐቢይ
  choice: великим знамением
  rationale: Формально и естественно передаёт значение «как/для великого знамения», не сводя его лишь к календарному указателю.
- source_word: ለበዓላት
  choice: для праздников
  rationale: Эфиопское слово обычно обозначает праздники/праздничные сроки; этот вариант конкретнее и естественнее русского «назначенные времена».
- source_word: ለሰንበታት፡ ዓመታት
  choice: для субботних лет
  rationale: Сохраняет буквальный образ «суббот лет» и ясно указывает на годы покоя.
- source_word: ለአዮቤልውሳት
  choice: для юбилеев
  rationale: Технический календарный термин книги Юбилеев; передан общепринятым библейским словом.
- source_word: ለኵሉ፡ ጊዜ
  choice: для всех времён
  rationale: Следует представленному геэзскому тексту «для всякого/всего времени»; не добавляет отсутствующее в данной строке уточнение «лет» из английского консультационного слоя.
theological_decisions:
- issue: Функция солнца как знамения
  choice: «Бог поставил солнце великим знамением»
  alternative: «Бог назначил солнце великим указателем»
  rationale: Слово «знамение» сохраняет широкую библейскую и богословскую семантику исходного термина, не ограничивая смысл календарной функцией.
- issue: Передача календарного термина በዓላት
  choice: «праздники»
  alternative: «назначенные времена»
  rationale: Исходное слово непосредственно допускает значение праздников; выбор не навязывает конкретную систему праздников и сохраняет календарный контекст.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Начальный фрагмент намеренно сохранён как продолжение предложения предыдущего стиха. Перечень оформлен повторяющимся союзом «и» для передачи полисиндетона оригинала; заключение следует геэзскому тексту без добавления «лет».
