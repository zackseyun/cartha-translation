  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: ru
  text: И в четвёртый день Он сотворил солнце, луну и звёзды и поместил их на небесной тверди, чтобы они светили над всей землёй и владычествовали над ней,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ
  choice: сотворил
  rationale: Глагол означает «сделал, создал»; в повествовании о творении естественно и содержательно точно «сотворил».
- source_word: ምጽናዓተ፡ ሰማይ
  choice: небесной тверди
  rationale: Сочетание обозначает твердь/свод неба; традиционное «небесная твердь» сохраняет образ исходного текста.
- source_word: ያብርሁ
  choice: светили
  rationale: 'Передаёт целевое значение формы: светила должны давать свет.'
- source_word: ለኰንኖ
  choice: владычествовали над ней
  rationale: Форма выражает правление или господство и содержит местоименный объект, относящийся к земле; «владычествовали» сохраняет возвышенный библейский регистр без ослабления смысла.
theological_decisions:
- issue: Местоименный субъект при сотворении светил
  choice: Он
  alternative: Бог
  rationale: В данном фрагменте имя Бога примыкает к обрывку предшествующего предложения («Бог в третий день»), тогда как предложение о четвёртом дне продолжает речь с подразумеваемым субъектом. «Он» сохраняет синтаксическую связь и не добавляет повтор, отсутствующий в цельной структуре.
- issue: Объект владычества светил
  choice: над ней
  alternative: без выраженного объекта
  rationale: Конечный местоименный элемент источника следует передать явно; ближайший и грамматически подходящий референт — вся земля.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранена незавершённость стиха: заключительная запятая показывает, что предложение продолжается в следующем стихе.'
