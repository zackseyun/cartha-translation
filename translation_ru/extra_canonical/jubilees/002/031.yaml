  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: ru
  text: И Творец всего благословил этот день[a], но не освятил все народы и племена, чтобы они соблюдали в этот день субботу; только Израилю — ему одному — Он даровал есть, пить и соблюдать в этот день субботу на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В тексте утверждается, что Творец благословил день, однако не освятил все народы для соблюдения в него субботы: такое земное соблюдение даровано одному Израилю. Речь идёт об избрании применительно к священному времени, а не просто об этническом уточнении.'
    reason: cross_reference
lexical_decisions:
- source_word: ፈጣሪ፡ ኵሉ
  choice: Творец всего
  rationale: Сохраняет прямое наименование Бога как Создателя всего сущего и соответствует возвышенному, но понятному русскому регистру.
- source_word: አቀደሰ
  choice: освятил
  rationale: Передаёт сакральное отделение, а не просто посвящение или благословение; отличие от предшествующего «благословил» сохранено.
- source_word: ሕዝበ፡ ወአሕዛበ
  choice: все народы и племена
  rationale: Воспроизводит парную формулу источника без сведения двух обозначений человеческих общностей к одному слову.
- source_word: ለአሰንብቶ፡ ባቲ
  choice: чтобы они соблюдали в этот день субботу
  rationale: Глагол передан как соблюдение субботнего покоя; местоименная отсылка «в нём/в ней» естественно раскрыта как «в этот день».
- source_word: ወሀበ፡ ይብላዕ፡ ወይስተይ
  choice: Он даровал есть, пить
  rationale: «Даровал» передаёт предоставленное Израилю преимущество или дозволение и не создаёт столь сильного впечатления, будто Бог лишь снабдил его пищей.
- source_word: ባሕቲቱ፡ ሎቱ፡ ለባሕቲቱ
  choice: только Израилю — ему одному
  rationale: Сохранены настойчивое повторение исключительности и эмфатическая структура источника.
theological_decisions:
- issue: Освящение субботнего дня и освящение народа для его соблюдения
  choice: 'Сохранено различие: день благословлён, но не все народы освящены для соблюдения субботы; эта привилегия дана одному Израилю.'
  alternative: Сказать лишь, что суббота была дана Израилю, опустив отрицание об остальных народах.
  rationale: Источник формулирует избрание через противопоставление благословения дня и ограниченного круга освящённых для его земного соблюдения; сглаживание устранило бы существенное богословское напряжение.
- issue: Значение «дал есть и пить»
  choice: Передано как «даровал есть, пить», без уточнения, что речь непременно идёт о праздничной трапезе или юридическом разрешении.
  alternative: «Позволил вкушать праздничную пищу и пить» или «дал им пищу и питьё».
  rationale: 'Так сохраняется широта исходной формулы: контекст указывает на дарованную привилегию, но сам стих не уточняет ни состав трапезы, ни юридическую форму дозволения.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повтор «в этот день» предпочтён неоднозначным русским местоименным конструкциям; синтаксический акцент «только Израилю — ему одному» сохраняет эмфазу оригинала.
