  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: ru
  text: И в четырнадцатый день, и в пятнадцатый, и в шестнадцатый, и в семнадцатый, и в восемнадцатый князь Мастема был связан и заключён под стражу позади сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова сохранившегося геэзского текста — «стражей, бросивших в реку [детей] из твоего народа» — по смыслу относятся к концу предыдущего стиха и поэтому здесь не включены в основной текст.
    reason: textual_boundary
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ
  choice: князь Мастема
  rationale: መኩነን обозначает правителя или князя; имя ማእቲማ передано в принятой русской форме «Мастема».
- source_word: አቡረ፡ ወዐዐወ
  choice: был связан и заключён под стражу
  rationale: Переданы два последовательных обозначения ограничения свободы без сведения их к одному действию; «под стражу» звучит естественнее буквального «в темницу» при неясном характере заключения.
- source_word: እምድኅሬሆሙ
  choice: позади сынов Израиля
  rationale: Сохранено пространственное значение «позади них», отражённое также в проверенном английском слое, хотя смысл такого расположения остаётся необычным.
- source_word: ወአመ፡ ዐሡር፡ ወረቡዕ … ወሰሙን
  choice: И в четырнадцатый день, и в пятнадцатый, и в шестнадцатый, и в семнадцатый, и в восемнадцатый
  rationale: Полностью сохранён повторяющийся перечень пяти дней и его риторический строй.
theological_decisions:
- issue: Титул Мастемы
  choice: князь
  alternative: правитель
  rationale: «Князь» сохраняет возвышенный повествовательный регистр и не уточняет сверх текста природу или область власти Мастемы.
- issue: Кем был связан Мастема
  choice: Пассивная конструкция без названного деятеля
  alternative: Указать Бога или ангелов как действующих лиц
  rationale: В данном геэзском тексте деятель прямо не назван; его богословская идентификация не должна вноситься переводчиком.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Анафорическое повторение «и в… день» сохранено намеренно; необычное выражение «позади сынов Израиля» не истолковано и не сглажено.
