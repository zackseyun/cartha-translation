  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: ru
  text: Но Я избавил тебя от его руки, и ты совершил знамения и чудеса, которые ты был послан совершить в Египте, — против фараона, и против всего его дома, и против его слуг, и против его народа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባላሕኩከ፡ እምእዴሁ
  choice: избавил тебя от его руки
  rationale: Сохраняет конкретную библейскую идиому «из руки», то есть из-под власти или угрозы данного лица.
- source_word: ገበርከ፡ ተአምረ፡ ወመንክረ
  choice: ты совершил знамения и чудеса
  rationale: Русское «совершил» естественно сочетается со «знамениями и чудесами» и передаёт глагол «делать» без разговорной шероховатости.
- source_word: ለዛ፡ ተፈነውከ፡ ትግበር
  choice: ради которых был послан
  rationale: Передаёт целевую связь, выраженную ለዛ, и избегает неестественной русской конструкции с повтором «послан совершить».
- source_word: ላዕለ
  choice: против
  rationale: Повторяющийся предлог передаёт направленность знамений и судов против фараона, его дома, слуг и народа.
- source_word: ኵሉ፡ ቤቱ
  choice: всего его дома
  rationale: Сохраняет коллективное библейское значение «дома» как домочадцев или двора, не сужая его до здания.
theological_decisions:
- issue: Кто говорит и действует в первой части стиха
  choice: «Я избавил тебя» с прописной буквой в местоимении
  alternative: «я избавил тебя»
  rationale: Контекст речи Бога позволяет русской издательской норме обозначить божественного Говорящего прописной буквой, не изменяя содержания.
- issue: Характер знамений как действий против Египта
  choice: сохранён четырёхкратный охват предлогом «против»
  alternative: объединить дополнения после одного предлога
  rationale: Повтор сохраняет риторическое нарастание источника и не смягчает судебную направленность действий.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксический повтор «и против» сохранён ради риторической структуры оригинала; тире помогает ясно отнести весь последующий ряд к знамениям и чудесам.
