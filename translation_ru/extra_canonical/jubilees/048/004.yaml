  source_fidelity: 'Смысл в целом передан верно: говорящий избавляет адресата от власти прежнего противника, а адресат совершает знамения и чудеса в Египте против фараона, его дома, слуг и народа. Однако «ради которых был послан» неоправданно преобразует относительную конструкцию в целевое «ради» и не выражает явно, что послан был именно адресат; источник связывает послание с совершением самих знамений и чудес.'
