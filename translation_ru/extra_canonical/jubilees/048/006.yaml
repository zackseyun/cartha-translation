  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: ru
  text: И он сжёг их огнём. И всё было вверено в твою руку, чтобы ты совершил это прежде, чем оно было совершено, и ты присутствовал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአውዐዮሙ፡ በእሳት
  choice: И он сжёг их огнём
  rationale: Прямо передаёт каузативный глагол с местоименным дополнением множественного числа и обстоятельством орудия.
- source_word: ተፈነወ፡ በእዴከ
  choice: было вверено в твою руку
  rationale: Пассивная конструкция передаёт поручение или передачу всего в распоряжение адресата; единственное число «руку» сохраняет образ исходного текста.
- source_word: ከመ፡ ትግበር
  choice: чтобы ты совершил это
  rationale: Передаёт целевую конструкцию и сохраняет личное действие адресата.
- source_word: ዘእንበለ፡ ይትገበር
  choice: прежде, чем оно было совершено
  rationale: Учитывает засвидетельствованное временное понимание сочетания ዘእንበለ с последующим глаголом, а не прежнюю интерпретацию «ничто не было сделано без тебя».
- source_word: ወሀለወከ
  choice: и ты был там
  rationale: Естественно по-русски передаёт значение присутствия, выраженное формой ሀለወከ.
theological_decisions:
- issue: Роль адресата в совершении событий
  choice: Сохранено утверждение, что всё было вверено адресату для совершения и что он присутствовал
  alternative: «И ничто не было сделано без тебя»
  rationale: Альтернатива усиливает идею исключительной причинности, но не передаёт прямо заключительное ወሀለወከ и хуже соответствует временному смыслу предшествующей конструкции.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Необычная временная последовательность сохранена, поскольку она отражает смысл и напряжение исходной формулировки.
