base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: ru
  text: И в шестой год третьей седмины сорок девятого юбилея[a] ты ушёл и прожил в земле Мадиамской пять годовых седмин и один год, а затем возвратился в Египет во вторую седмину, во второй год пятидесятого юбилея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хронология в эфиопском тексте изложена сжато и допускает затруднения. Выражение «пять годовых седмин и один год» сохранено буквально, чтобы передать календарную систему книги Юбилеев.
    reason: segmentation_note
lexical_decisions:
- source_word: ሖርከ
  choice: ты ушёл
  rationale: Передаёт обращённую ко второму лицу форму глагола движения естественным современным русским языком.
- source_word: ነበርከ
  choice: прожил
  rationale: В сочетании с указанием длительности означает пребывание или проживание; совершенный вид естественен в русском повествовании.
- source_word: ምድረ፡ ምድያም
  choice: земле Мадиамской
  rationale: Традиционное и понятное русское библейское наименование Мадиама.
- source_word: ፭ሱባዔ፡ ወዓመተ፡ አሐደ
  choice: пять годовых седмин и один год
  rationale: Сохраняет календарную единицу и трудную хронологическую формулу источника, не сводя её молча к вычисленному числу лет.
- source_word: ገባእከ
  choice: возвратился
  rationale: Глагол ገብአ здесь имеет значение возвращения; по контексту Моисей возвращается в Египет.
theological_decisions:
- issue: Хронологическая формула книги Юбилеев
  choice: сохранить «пять годовых седмин и один год» и полную формулу даты возвращения
  alternative: пересчитать срок в годы или сгладить формулу
  rationale: Буквальное сохранение календарных единиц не устраняет реальную сложность эфиопской хронологии и не навязывает её согласование.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Седмина» сохранена как точный и узнаваемый термин для семилетнего периода; синтаксис сделан доступным без устранения хронологической сложности.
