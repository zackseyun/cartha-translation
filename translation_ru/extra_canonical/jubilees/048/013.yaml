- source_word: ወጸጽንዐ፡ አልባቢሆሙ
  choice: Он ожесточил их сердца
  rationale: Буквальный образ укрепления или ожесточения сердец сохранён ввиду его богословской значимости.
- source_word: ወአንየሎሙ
  choice: и сделал их упорными
  rationale: Передаёт усиление упрямства и непреклонности без излишней конкретизации.
- source_word: ወተኀስየ፡ እምኀበ፡ እግዚአብሔር፡ አምላክ
  choice: от Господа Бога исходил замысел
  rationale: Сохранено утверждение об исходящем от Бога замысле, при этом русская фраза остаётся естественной.
- source_word: ከመ፡ ይምሐጾሙ
  choice: поразить их
  rationale: Глагол обозначает нанесение поражения или сокрушение; «поразить» сохраняет лаконичность и допускаемую контекстом широту.
theological_decisions:
- issue: Божественная причастность к ожесточению и поражению
  choice: Сохранена прямая связь ожесточения, замысла и Господа Бога
  alternative: Ослабить причинность формулами «Бог допустил» или «они сами ожесточились»
  rationale: Источник не снимает богословского напряжения, поэтому перевод не вводит отсутствующее в тексте объяснение.
- issue: Неявный субъект последовательных глаголов
  choice: В русском тексте использовано местоимение «Он» без добавления имени
  alternative: Назвать субъект как Мастему, Бога или ангела
  rationale: В предоставленной строке имя субъекта отсутствует; его явное называние означало бы интерпретационное уточнение сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но образ «ожесточил сердца» и неоднозначность неявного субъекта сохранены.
