  revision_rationale: 'Устранена русская двусмысленность относительно детей, чтобы передать контекстуально обусловленную параллель воздаяния: египтяне бросали в реку детей Израиля. «Воины» заменены на «могучих мужей», поскольку источник не требует военной конкретизации. Начальный фрагмент, числовые значения, образ бездны и отмеченная примечанием синтаксическая неоднозначность сохранены.'
