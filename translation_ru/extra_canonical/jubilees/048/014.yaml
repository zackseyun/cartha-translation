revisions:
- from: …которая была сушей. И весь народ, который он вывел, погнался за Израилем, но Господь Бог низверг их в самую середину моря, в глубины бездны, под сынами Израиля[a], — подобно тому как египтяне бросали их детей в реку. Он отомстил миллиону из них; тысяча могучих воинов была истреблена, и те, кто преследовал их, погибли из-за зависти.
  to: …которая была сушей. И все люди, которых он вывел, погнались за Израилем, но Господь Бог низверг их в самую середину моря, в глубины бездны, под сынами Израиля[a], — подобно тому как египтяне бросали в реку детей Израиля. Он отомстил миллиону из них; тысяча могучих мужей была уничтожена, и те, кто преследовал их, погибли из-за зависти.
  rationale: 'Устранена русская двусмысленность относительно детей, чтобы передать контекстуально обусловленную параллель воздаяния: египтяне бросали в реку детей Израиля. «Воины» заменены на «могучих мужей», поскольку источник не требует военной конкретизации. Начальный фрагмент, числовые значения, образ бездны и отмеченная примечанием синтаксическая неоднозначность сохранены.'
