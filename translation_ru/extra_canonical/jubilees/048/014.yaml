base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/014.yaml
  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
translation:
  language: ru
  text: …которая была сушей. И все люди, которых он вывел, погнались за Израилем, но Господь Бог низверг их в самую середину моря, в глубины бездны, под сынами Израиля[a], — подобно тому как египтяне бросали в реку детей Израиля. Он отомстил миллиону из них; тысяча могучих мужей была уничтожена, и те, кто преследовал их, погибли из-за зависти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также синтаксический разбор: «в его глубины, в бездну, под сынами Израиля».'
    reason: Последовательность зависимых выражений в эфиопском тексте допускает несколько способов связать слова «глубины», «бездна» и «под».
lexical_decisions:
- source_word: እንተ፡ የብስ
  choice: …которая была сушей
  rationale: Сохранён начальный фрагмент эфиопского текста, синтаксически продолжающий предшествующий контекст; многоточие показывает, что стих начинается внутри предложения.
- source_word: ይደግኑ፡ ድኅሬሆሙ፡ ለእስራኤል
  choice: погнался за Израилем
  rationale: Естественно передаёт преследование вслед за Израилем без лишнего уточнения объекта.
- source_word: ወረዎሙ
  choice: низверг их
  rationale: Сильный глагол движения передаёт действие Бога, бросившего преследователей в море, и сохраняет параллель с бросанием детей в реку.
- source_word: ውስተ፡ መዓምቅቲሃ፡ ሰቀላይ
  choice: в глубины бездны
  rationale: Переданы оба элемента выражения — глубины и бездна; ни один из них не опущен.
- source_word: በከመ፡ ወረዉ፡ ውሉዶሙ፡ ሰብአ፡ ግብጽ፡ ውስተ፡ ፈለገ
  choice: подобно тому как египтяне бросали их детей в реку
  rationale: Египтяне сохранены как действующий субъект, а дети относятся к преследуемому Израилю; тем самым ясно передана заложенная в тексте параллель воздаяния.
- source_word: ምእተ፡ አልፈ፡ ኀበቀሎሙ
  choice: Он отомстил миллиону из них
  rationale: Числительное понимается как сто по десять тысяч, то есть миллион; повреждённая или вариантная глагольная форма передана согласно контексту как действие возмездия.
- source_word: ዐሠርተ፡ ምእተ፡ ዐይሠ፡ ኀያላን
  choice: тысяча могучих воинов
  rationale: Десять сотен передано как тысяча; обозначение сильных людей естественно выражено словосочетанием «могучие воины».
- source_word: በእንተ፡ ሕሱዳ
  choice: из-за зависти
  rationale: Сохранена причинная формулировка и нравственный мотив исходного текста без богословского расширения.
theological_decisions:
- issue: Воздаяние египтянам за бросание детей в реку
  choice: 'Сохранена явная параллель: Бог низвергает преследователей в море, как египтяне бросали детей Израиля в реку.'
  alternative: Ослабить параллель, представив египетских детей как сошедших в реку.
  rationale: Активная глагольная конструкция исходного текста называет египтян действующими лицами и поддерживает тему соразмерного воздаяния.
- issue: Субъект божественного действия
  choice: «Господь Бог»
  alternative: «Господь, наш Бог»
  rationale: В данном эфиопском тексте после «Господь» стоит «Бог» без явного притяжательного показателя; добавление «наш» не требуется.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным звучанием. Архаизмы сведены к уместным библейским словам «низверг» и «бездна». Начальный обрывок исходного текста сохранён и отмечен многоточием; спорные, но исправленные прежние прочтения чисел и египетского действия в примечания не вынесены, поскольку они не отражают подлинной неоднозначности.
