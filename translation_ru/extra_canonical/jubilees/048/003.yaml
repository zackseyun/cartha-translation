base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: ru
  text: В пути, на месте ночлега, он встретил[a] тебя. Разве не всеми силами он хотел убить тебя и спасти египтян от твоей руки, когда увидел, что ты послан сделать это и совершить возмездие над Египтом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может подразумевать враждебную встречу или столкновение; ср. рассказ в книге Исход о смертельно опасной встрече во время пути.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትትቄበሎ
  choice: он встретил тебя
  rationale: Форма передаёт встречу или столкновение; само слово не означает «обвинять». Нейтральное «встретил» сохраняет лексическое значение, а в сноске отмечен враждебный характер встречи по контексту.
- source_word: አኮሁ
  choice: Разве не…?
  rationale: Передаёт риторический вопрос, который следует сохранить, а не превращать в простое утверждение.
- source_word: በኵሉ ኃይሉ
  choice: всеми силами
  rationale: Естественный современный русский эквивалент буквального выражения «всей своей силой».
- source_word: ወበቀለ ላዕለ
  choice: совершить возмездие над Египтом
  rationale: Глагол выражает воздаяние или отмщение. «Совершить возмездие» сохраняет судебно-карательный оттенок, не сужая его до личной мести.
theological_decisions:
- issue: Характер встречи на месте ночлега
  choice: 'В основном тексте: «встретил»; в сноске указано, что встреча была враждебной и угрожала смертью.'
  alternative: «напал на тебя» или «выступил против тебя, чтобы обвинить»
  rationale: Геэзский глагол обозначает встречу/столкновение, но сам по себе не выражает обвинение. Контекст Исх 4:24 допускает враждебное понимание, которое следует отметить, не внося его безусловно в основной текст.
- issue: Суд или возмездие над Египтом
  choice: «совершить возмездие над Египтом»
  alternative: «совершить суд над Египтом»
  rationale: Источник допускает судебно-карательную семантику; «возмездие» ближе передаёт значение отмщения, сохраняя богословское напряжение между судом и воздаянием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Риторический вопрос сохранён; синтаксис сделан естественным без устранения неоднозначности ключевого глагола.
