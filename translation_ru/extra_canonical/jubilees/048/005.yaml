base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: ru
  text: 'И совершил ГОСПОДЬ над ними великое возмездие за Израиль: поразил их кровью, лягушками, мошками и пёсьими мухами[a], мучительными нарывами, прорывавшимися волдырями; их скот — мором; затем градом — им Он уничтожил всё, что у них росло, — и саранчой, пожравшей то, что осталось у них после града; тьмой и смертью их первенцев — как людей, так и животных. И над всеми их богами ГОСПОДЬ совершил возмездие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пёсьими мухами»; точный вид насекомого неизвестен.'
    reason: Составное геэзское название буквально связано с собакой, но его точная зоологическая идентификация неясна.
lexical_decisions:
- source_word: በቀለ፡ ዐቢየ
  choice: великое возмездие
  rationale: Передаёт судебно-карательный смысл существительного и сохраняет торжественный библейский регистр.
- source_word: በጽንጽያ፡ ክልብ
  choice: пёсьими мухами
  rationale: Буквально сохраняет составное обозначение «собачьи/пёсьи мухи», не отождествляя неопределённое насекомое с конкретным современным видом.
- source_word: በእኩይ፡ ቍስል፡ ዘውእቱ፡ ይፈልሕ፡ ዐንጸዐንጺ
  choice: мучительными нарывами, покрывавшими тело волдырями
  rationale: «Мучительными» естественно передаёт качественную характеристику бедствия, а формулировка о волдырях выражает образ нарывов, прорывающихся или разрастающихся пузырями, без излишне медицинской конкретизации.
- source_word: በሞት
  choice: мором
  rationale: В отношении скота русское «мор» естественно передаёт массовую гибель как язву, тогда как при первенцах сохранено прямое «смертью».
- source_word: ኵሎ፡ ዘይሠርፅ፡ ሎሙ
  choice: всё, что у них росло
  rationale: Отражает значение растущей растительности и местоименный элемент «у них», избегая более узкого «всходило».
- source_word: አማልክቲሆሙ
  choice: их богами
  rationale: Сохраняет множественное число и принадлежность египтянам, не добавляя толкования о природе этих богов.
theological_decisions:
- issue: Смысл возмездия «за Израиль»
  choice: за Израиль
  alternative: ради Израиля
  rationale: Более формально сохраняет возможный оттенок воздаяния за причинённое Израилю зло; вариант «ради» мог бы сузить смысл до одной лишь пользы или защиты.
- issue: Суд над богами египтян
  choice: над всеми их богами ГОСПОДЬ совершил возмездие
  alternative: всех их богов ГОСПОДЬ покарал
  rationale: Сохранён параллелизм с началом стиха и буквальный язык источника без пояснения, означает ли это идолов, духовные силы или египетскую религиозную систему.
- issue: Божественное имя
  choice: ГОСПОДЬ
  alternative: Господь
  rationale: Капителью отмечено традиционное библейское обозначение божественного имени, согласующееся с консультационным текстом и русской издательской практикой.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Длинное перечисление казней сохранено, но пунктуационно расчленено для ясности; тире выделяют пояснение о действии града. Архаизмы ограничены общеупотребительными библейскими словами «возмездие», «мор» и «первенцы».
