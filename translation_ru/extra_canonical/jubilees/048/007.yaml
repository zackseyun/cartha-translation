- from: 'И ты должен был говорить царю Египта перед всеми его слугами и перед его народом. И всё совершилось по твоему слову: десять великих кар и бедствий пришли на землю Египта, чтобы ты совершил их.[a]'
  to: 'И ты должен был говорить царю Египта перед всеми его слугами и перед его народом. И всё совершилось по твоему слову: десять великих и тяжких кар постигли землю Египта, дабы ты осуществил их.[a]'
  rationale: Исправлено ошибочное разделение определений «великие и тяжкие» на два существительных. Заключительный оборот сделан более естественным по-русски, при этом сохранены активная агентность адресата и отмеченная в английском аудиторском следе синтаксическая альтернатива.
