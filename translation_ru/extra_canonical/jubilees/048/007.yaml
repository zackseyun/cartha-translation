base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/007.yaml
  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: ru
  text: 'И ты должен был говорить царю Египта перед всеми его слугами и перед его народом. И всё совершилось по твоему слову: десять великих и тяжких кар постигли землю Египта, дабы ты осуществил их.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дабы они были осуществлены».'
    reason: Заключительную конструкцию можно понимать и как выражение цели с активным действием адресата, и как допускающую пассивное прочтение; основной текст сохраняет активную форму второго лица в оригинале.
lexical_decisions:
- source_word: ትትናገር
  choice: ты должен был говорить
  rationale: Форма передаёт обращение ко второму лицу и предстоящее ему действие; в русском контексте ретроспективного повествования естественно звучит модальная конструкция прошедшего времени.
- source_word: ኵነኔ
  choice: кары
  rationale: Слово означает судебные приговоры или наказания; «кары» сохраняет идею суда и хорошо соответствует контексту египетских казней.
- source_word: ጸዋጋት
  choice: бедствия
  rationale: Множественное число обозначает тяжёлые поражения или бедствия; выбор не сливает этот термин с предшествующими «карами».
- source_word: በቃልከ
  choice: по твоему слову
  rationale: Буквально и естественно передаёт причинно-действенную силу сказанного Моисеем.
- source_word: ትግበር
  choice: ты совершил их
  rationale: Активная форма второго лица мужского рода указывает на действие адресата, то есть Моисея; местоимение «их» соотнесено с карами и бедствиями.
theological_decisions:
- issue: Роль Моисея в совершении египетских кар
  choice: сохранена активная формулировка «чтобы ты совершил их»
  alternative: «чтобы они совершились»
  rationale: Исходная глагольная форма активна и обращена к Моисею. Перевод не заменяет эту заметную агентность пассивной конструкцией, не уточняя при этом метафизическое соотношение действий Бога и Моисея.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Повтор «перед» сохранён ради структуры исходного текста; лексика «кары и бедствия» различает два исходных существительных без конфессиональной конкретизации.
