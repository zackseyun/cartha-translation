  source_fidelity: 'В черновике верно сохранены обращение ко второму лицу, активная форма заключительного глагола и причинно-действенный оттенок «по твоему слову». Однако «десять великих кар и бедствий» неверно членит исходную группу: «великие» и «тяжкие/губительные» характеризуют одни и те же десять судов, а не называют две отдельные группы явлений.'
  naturalness: «Чтобы ты совершил их» грамматически возможно, но сочетаемость с «карами» не вполне естественна. «Дабы ты осуществил их» сохраняет активное действие Моисея и звучит яснее в современном литературном повествовании.
  terminology: «Кары» уместно передаёт судебно-карательный характер ኵነኔ. Эпитет «тяжкие» передаёт ጸዋጋት без добавления отдельного существительного «бедствия».
