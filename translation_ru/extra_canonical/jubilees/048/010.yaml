lexical_decisions:
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: погнался вслед за ними
  rationale: Передаёт преследование вслед за Израилем естественным современным русским оборотом.
- source_word: እግዚአብሔር፡ አምላክ
  choice: Яхве, Бог наш
  rationale: Сохраняет личное Божье имя согласно контексту и местоименную отнесённость английского консультационного слоя.
- source_word: ወረዎሙ
  choice: низверг их
  rationale: Динамичный глагол точно выражает бросание преследователей в морские глубины.
- source_word: ምእተ፡ አልፈ፡ ... ወዐሠርተ፡ ምእተ
  choice: тысяча тысяч и десять тысяч
  rationale: Сохраняет риторическую числовую формулу источника, не сводя её молча к современному арифметическому итогу.
- source_word: ዐይሠ
  choice: грудного младенца
  rationale: Передаёт значение младенца, ещё находящегося на грудном вскармливании, естественно для русского языка.
- source_word: በእንተ
  choice: за
  rationale: В данном контексте выражает воздаяние за убитого младенца; причинное «из-за» остаётся возможным, но звучит менее точно.
theological_decisions:
- issue: Связь гибели египетского войска с убийством младенца
  choice: погибли за одного грудного младенца
  alternative: погибли из-за одного грудного младенца
  rationale: Формулировка «за» сохраняет смысл воздаяния, подразумеваемый сопоставлением египетского детоубийства и гибели преследователей, не добавляя конфессионального толкования.
- issue: Чьи сыновья были брошены египтянами в реку
  choice: как египтяне бросали своих сыновей в реку
  alternative: как египтяне бросали их сыновей в реку
  rationale: Формально следует дошедшему эфиопскому выражению «их сыновья», отнесённому к людям Египта; хотя повествовательный контекст Исхода создаёт смысловое напряжение, оно не исправляется молча.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным ритмом. Сохранены повтор «вслед за ними — за Израилем», образ морских глубин и необычная числовая формула. Маркер сноски помещён непосредственно после соответствующего выражения.
