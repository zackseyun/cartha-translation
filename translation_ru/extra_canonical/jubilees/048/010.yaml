  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: ru
  text: И все люди, которых он вывел, погнались вслед за ними[a] — за Израилем. Но Яхве, Бог наш, вверг их в самую глубину моря, под ногами сыновей Израиля, как египтяне бросили своих сыновей в реку. Тысяча тысяч и десять тысяч могучих воинов погибли за одного грудного младенца из сыновей твоего народа, которого они бросили в реку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сохранившейся строковой нумерации источника после стиха 9 следует стих 14; здесь глава последовательно перенумерована для удобства чтения, при сохранении всего дошедшего текста.
