base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: ru
  text: И князь Мастема восстал против тебя и хотел предать тебя в руки фараона. Он помог египетским волхвам, и они выступили перед тобой и действовали. Мы позволили им творить зло, но не позволили, чтобы их руками совершалось исцеление. Тогда Господь поразил их тяжёлыми язвами, и они уже не могли противостоять, потому что мы лишили их способности совершить хотя бы одно знамение чародейства. Во всех знамениях и чудесах князь Мастема терпел посрамление, пока не укрепился и не крикнул египтянам, чтобы они погнались за вами со всей силой Египта — на колесницах, на конях и со всем множеством египетского народа. Я встал между египтянами и Израилем, и мы избавили Израиль от его руки и от руки его народа. А Господь провёл израильтян посреди моря, словно по суше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: князь Мастема
  rationale: መኰንን обозначает правителя или князя; традиционное имя персонажа передано как «Мастема».
- source_word: ሥረያቲሆሙ፡ ለግብጽ
  choice: египетским волхвам
  rationale: В данном контексте речь идёт о египетских чародеях, противостоящих Моисею; «волхвы» сохраняет библейский регистр и остаётся понятным.
- source_word: ፈውሳ
  choice: исцеление
  rationale: Слово прямо обозначает исцеление или врачевание и образует контраст с позволением творить зло.
- source_word: ቍስል፡ እኩይ
  choice: тяжкими язвами
  rationale: Буквально сочетание означает «злая/бедственная язва»; «тяжкие язвы» естественно передаёт силу выражения без излишнего толкования.
- source_word: ሕሱደ፡ ትእምርተ
  choice: колдовское знамение
  rationale: Сочетание связано с обманным или магическим знамением; выбор передаёт контекст действий египетских волхвов.
- source_word: ኀፈረ
  choice: терпел посрамление
  rationale: Глагол выражает стыд и поражение; эта формулировка сохраняет повторяющийся характер унижения Мастемы при знамениях.
- source_word: በኵሉ፡ ኃይሎሙ፡ ለግብጽ
  choice: со всей мощью Египта
  rationale: Передаёт совокупную военную силу, далее конкретизированную колесницами, конями и множеством народа.
theological_decisions:
- issue: Соотношение Божьего допущения и действий египетских волхвов
  choice: «Мы позволили им творить зло, но не позволили… совершалось исцеление»
  alternative: «Они совершали злое, а мы дали им силу действовать; исцелять же им не позволили»
  rationale: Основной текст сохраняет явный контраст между допущенным злом и запрещённым исцелением, не объясняя сверх того природу или пределы этого допущения.
- issue: Участие Мастемы в преследовании Израиля
  choice: «пока не набрал силу и не призвал египтян»
  alternative: «пока не укрепился и не воззвал к египтянам»
  rationale: 'Сохранена напряжённость текста: Мастема действует активно, однако избавление приписывается небесному посреднику и Господу; причинная схема не уточняется.'
- issue: Число небесных действующих лиц
  choice: Сохранены формы «мы позволили», «мы лишили», «мы избавили» наряду с «Господь поразил» и «Господь провёл»
  alternative: Заменить множественное число единственным или непосредственно приписать все действия Господу
  rationale: Источник различает речь повествователя во множественном числе и действия Господа; это богословски значимое различие не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «волхвы», «язвы», «знамение» сохранены как общеупотребительные библейские термины; синтаксис упрощён там, где длинная геэзская цепочка союзов затруднила бы чтение. Единственное число обращения к Моисею передано как «тебя», а призыв преследовать весь народ — как «за вами» по смысловому переходу контекста.
