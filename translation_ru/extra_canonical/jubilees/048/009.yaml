revisions:
- from: И князь Мастема восстал против тебя и хотел предать тебя в руки фараона. Он помог египетским волхвам, и они противостояли тебе и совершали перед тобой свои деяния. Мы позволили им творить зло[a], но не позволили, чтобы их руками совершалось исцеление. Тогда Господь поразил их тяжкими язвами, и они уже не могли противостоять, потому что мы лишили их способности совершить хотя бы одно колдовское знамение. При всех знамениях и чудесах князь Мастема терпел посрамление, пока не набрал силу и не призвал египтян погнаться за вами со всей мощью Египта — на колесницах, на конях и со всем множеством египетского народа. Я встал между египтянами и Израилем, и мы избавили Израиль от его руки и от руки его народа. А Господь провёл израильтян посреди моря, словно по суше.
