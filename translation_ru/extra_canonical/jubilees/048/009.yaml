  rationale: Исправлена стилистически тяжёлая передача действий волхвов; уточнён охват посрамления Мастемы; удалена сноска, поскольку её альтернативный вариант ослабляет установленный источником контраст между дозволенным злом и недозволенным исцелением. Множественные формы «мы» и различение между их действиями и действиями Господа сохранены. Финальное сравнение «словно по суше» оставлено в соответствии с английским аудиторским текстом и контекстом фразы, продолжающейся на границе приведённого источникового фрагмента.
