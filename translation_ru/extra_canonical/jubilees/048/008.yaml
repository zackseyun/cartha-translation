revisions:
- from: Через него Он отомстил за Израиль.[a] И всё Господь совершил ради Израиля, согласно Своему установлению, которое Он утвердил с Авраамом, чтобы отомстить им так же, как они силой поработили израильтян.[b]
  to: Через него Он отомстил за Израиль.[a] И всё Господь совершил для Израиля, согласно Своему установлению, которое было установлено с Авраамом, чтобы отомстить им так же, как они силой поработили израильтян.[b]
