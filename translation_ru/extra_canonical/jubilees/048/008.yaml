  yaml_path: translation/extra_canonical/jubilees/048/008.yaml
  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: ru
  text: Через него Он отомстил за Израиль.[a] И всё Господь совершил для Израиля, согласно Своему установлению, которое было установлено с Авраамом, чтобы отомстить им так же, как они силой поработили израильтян.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посредством него Он совершил возмездие за Израиль».'
    reason: Сохраняет возможный более формальный оттенок выражений ቦቱ и በቀለ.
  - marker: b
    text: 'Буквально: «как они поработили их насилием»; последнее слово может также указывать на притеснение или несправедливость.'
    reason: Отмечает буквальную местоименную форму и смысловой диапазон ግፍዕ, не выдавая интерпретационный вариант за буквальный перевод.
lexical_decisions:
- source_word: ቦቱ
  choice: Через него
  rationale: Передаёт инструментальное значение формы и сохраняет отсылку к лицу, названному в контексте.
- source_word: በቀለ
  choice: отомстил
  rationale: Глагол обозначает совершение мести или возмездия; «отомстил» естественно звучит по-русски и сохраняет повтор с последующим ይትበቀል.
- source_word: ሥርዐቱ
  choice: Своему установлению
  rationale: Здесь слово означает установленный порядок или предписание; перевод «завету» был бы излишне узким и менее точным лексически.
- source_word: በከመ
  choice: так же, как
  rationale: Сохраняет сравнительно-соразмерное значение оборота, а не заменяет его причинным «потому что».
- source_word: ቀነይዎሙ
  choice: они… поработили израильтян
  rationale: Глагол конкретно выражает подчинение или обращение в рабство; явное «израильтян» устраняет неясность двух русских местоимений «они/их».
- source_word: በግፍዕ
  choice: силой
  rationale: Передаёт насильственный и неправедный характер порабощения естественным современным русским выражением.
theological_decisions:
- issue: Характер установленного Богом в отношении Авраама
  choice: установление
  alternative: завет
  rationale: Слово ሥርዓት само по себе обозначает установление, порядок или предписание. Перевод не отождествляет его без достаточных оснований с техническим термином «завет».
- issue: Связь возмездия с порабощением Израиля
  choice: так же, как
  alternative: потому что
  rationale: Сравнительная конструкция источника подчёркивает соответствие возмездия совершённому насилию; причинное прочтение возможно по смыслу, но грамматически менее непосредственно.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного религиозного текста. Заглавное «Он» обозначает Господа; повтор «отомстил / отомстить» сохранён как смысловой повтор оригинала. В последней части «израильтян» употреблено вместо буквального местоимения ради ясности референта.
