  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: ru
  text: 'И снова: во второй год пятидесятого юбилея ты знаешь[a], что было сказано тебе на горе Синай и что князь Мастема хотел сделать тебе, когда ты возвращался[b] в Египет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты узнаешь»; также возможно: «ты будешь знать».'
    reason: Геэзская глагольная форма допускает настоящее и будущее понимание.
  - marker: b
    text: 'Или: «входил».'
    reason: Глагол может обозначать вхождение, однако в данном контексте речь идёт о возвращении Моисея в Египет.
lexical_decisions:
- source_word: ታአምር
  choice: ты знаешь
  rationale: Геэзская форма допускает настоящее или будущее значение; в контексте это обращение к уже известным Моисею событиям.
- source_word: ፈቀደ፡ ይግበር፡ ምስሌከ
  choice: замышлял сделать с тобой
  rationale: Передаёт желание или намерение Мастемы и сохраняет нейтральное «с тобой», не усиливая его до отсутствующего в источнике «против тебя».
- source_word: ትገብእ፡ ግብጸ
  choice: когда ты возвращался в Египет
  rationale: Глагол ገብአ здесь, в повествовательном контексте возвращения Моисея из Мадиама, означает возвращение в Египет.
- source_word: መኰንን፡ መስተማ
  choice: князь Мастема
  rationale: «Князь» естественно и достаточно буквально передаёт титул መኰንን, а имя сохраняется транслитерацией.
theological_decisions:
- issue: Время глагола «знать»
  choice: ты знаешь
  alternative: ты узнаешь / ты будешь знать
  rationale: Форма грамматически допускает будущее прочтение, но контекст указывает на напоминание Моисею о прошлом; неоднозначность отмечена в сноске.
- issue: Характер намерения Мастемы
  choice: что князь Мастема замышлял сделать с тобой
  alternative: что князь Мастема хотел сделать против тебя
  rationale: Выбранный вариант не вносит более явной враждебной направленности, чем выражено конструкцией источника, хотя контекст подразумевает угрозу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула датировки передана естественно; синтаксис сохраняет две параллельные придаточные части и не устраняет подлинную глагольную неоднозначность.
