  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: ru
  text: И в четырнадцатый день, и в пятнадцатый, и в шестнадцатый, и в семнадцатый, и в восемнадцатый ангел Мастема был связан и удержан от того, чтобы следовать за сынами Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: ангел
  rationale: Геэзское መልአክ означает «ангел» или «вестник»; в данном контексте прямое обозначение сверхъестественного существа естественно передаётся словом «ангел», без замены на традиционное «князь».
- source_word: ተዐግሠ
  choice: был удержан
  rationale: Пассивная форма выражает сдерживание или воспрепятствование; «был удержан» сохраняет пассивность и передаёт невозможность последовать за Израилем.
- source_word: እምድኅረ ፡ ደቂቀ ፡ እስራኤል
  choice: от того, чтобы следовать за сынами Израиля
  rationale: Оборот буквально указывает на следование позади/вслед за сынами Израиля. Русская конструкция сохраняет эту образность и не уточняет без необходимости, было ли это именно преследованием.
- source_word: ደቂቀ ፡ እስራኤል
  choice: сыны Израиля
  rationale: Традиционное и понятное библейское выражение точно передаёт родственно-коллективное обозначение народа Израиля.
