  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: ru
  text: 'И он сказал: «Пусть десятая часть их останется перед ним, а девять частей пусть сойдут в место суда».[a] И одному из нас он сказал, чтобы мы научили Ноя всем их лечебным средствам,[b] ибо…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Указание на десятую часть отражает характерное для этой главы объяснение того, почему после потопа злые духи продолжили действовать.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «всем их средствам исцеления» или «всем их лекарствам». В контексте это может означать средства против вреда, причиняемого этими духами, но сама формулировка допускает более одной связи местоимения «их».'
    reason: translation
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: место суда
  rationale: Буквально и естественно передаёт сочетание «место» + «суд», не уточняя природу или местонахождение этого места.
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: И одному из нас он сказал
  rationale: Предлог ለ делает «одного из нас» косвенным дополнением, а не подлежащим; такая передача следует эфиопскому тексту и исправляет прежнее ошибочное прочтение.
- source_word: ከመ፡ ንምሀር፡ ለኖኅ
  choice: чтобы мы научили Ноя
  rationale: Сохраняет форму первого лица множественного числа в ንምሀር и целевую/изъяснительную функцию ከመ.
- source_word: ኵሎ፡ ፈውሶሙ
  choice: всем средствам исцеления от них
  rationale: В контексте речь идёт о средствах против вреда, причиняемого духами; «средства исцеления» звучит по-русски естественнее буквального «все их исцеления», а дополнение «от них» сохраняет связь местоименного суффикса с духами.
- source_word: እስመ
  choice: ибо…
  rationale: Союз вводит основание сказанного, однако предоставленный исходный фрагмент обрывается; многоточие честно отмечает незавершённость предложения.
theological_decisions:
- issue: Продолжающаяся деятельность злых духов после потопа
  choice: «Пусть десятая часть их останется перед ним»
  alternative: Обобщить как «пусть некоторые из них останутся»
  rationale: Сохранено конкретное соотношение текста, важное для собственного объяснения книги, без догматического толкования.
- issue: К кому относится местоимение «ним»
  choice: Сохранено местоимение без явного называния лица
  alternative: Заменить на конкретное имя по контексту главы
  rationale: Так сохраняется анафорическая неоднозначность стиха и не вносится отсутствующее в данном отрывке уточнение.
- issue: Кто поручает научить Ноя
  choice: Субъект оставлен как «он»
  alternative: Назвать Бога или главного ангела
  rationale: Эфиопский фрагмент содержит лишь глагольный субъект третьего лица; конкретизация зависела бы от более широкого контекста и могла бы преждевременно снять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к исходному, но тяжёлое буквальное выражение о «лечениях» передано понятно для современного читателя. Конечное многоточие обусловлено тем, что предоставленный источник обрывается на причинном союзе.
