  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: ru
  text: Она простирается до всех огненных гор, затем на запад — до моря Атель, и далее на запад, пока не достигает моря Маук — моря, в котором не погибает ничто из того, что в него нисходит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином членении фразы: «в которое нисходит всё, что не погибает».'
    reason: Сохраняет отмеченное в консультационном слое альтернативное понимание синтаксической связи, не подменяя им более вероятный смысл основного текста.
lexical_decisions:
- source_word: ባሕረ አቴል (в засвидетельствованной традиции стиха)
  choice: море Атель
  rationale: Топоним передан транслитерацией, без попытки этимологически истолковать неизвестное название.
- source_word: ባሕረ ማውክ (в засвидетельствованной традиции стиха)
  choice: море Маук
  rationale: Сохранено собственное название моря в русской транслитерации.
- source_word: ይወርድ / za-yəwarrəd
  choice: нисходит
  rationale: Глагол движения вниз передан буквально и в dignified современном регистре; форма не уточняет природу того, что нисходит.
- source_word: ኢይማስን / ʾi-yəmassən
  choice: не погибает
  rationale: Передаёт отсутствие гибели или уничтожения без добавления причины и без богословского истолкования.
theological_decisions:
- issue: Соотношение относительного оборота и отрицательного сказуемого в заключительной фразе
  choice: «в котором не погибает ничто из того, что в него нисходит»
  alternative: «в которое нисходит всё, что не погибает»
  rationale: 'Основное чтение следует геэзской синтаксической последовательности: «всё, что нисходит в него, не погибает». Альтернатива сохранена в примечании как иное членение, но не поставлена в основной текст, поскольку она меняет синтаксические отношения.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Повтор направления сохранён, но оформлен естественно для русского синтаксиса. Названия Атель и Маук транслитерированы; неопределённое «всё, что» естественно передано конструкцией «ничто из того, что… не».
