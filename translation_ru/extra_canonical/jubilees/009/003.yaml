  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: ru
  text: И он простирается к северу до пределов Гадира, затем выходит к побережью вод Великого моря и достигает реки Гихон; далее он проходит к югу от вод Гихона до берега этой реки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В прежнем переводе: «к великим водам, пока не достигнет реки Гихон; а река Гихон проходит посреди этой земли».'
    reason: Фиксирует прежнее чтение, приведённое в консультационном слое, не выдавая его за равнозначный исходному тексту вариант.
lexical_decisions:
- source_word: māya bāḥr ʿabiy
  choice: вод Великого моря
  rationale: Передаёт сочетание «воды великого моря», сохраняя географический титул и не превращая его в неопределённые «великие воды».
- source_word: mangala ʾazēb māya gēyon
  choice: к югу от вод Гихона
  rationale: Сохраняет южный ориентир и связь с водами Гихона; «к югу от» естественно звучит в русском описании границы.
- source_word: westa dengagu la-zentu falag
  choice: до берега этой реки
  rationale: Точно сохраняет конкретный пограничный ориентир — берег названной реки.
- source_word: Gadir / Gēyon
  choice: Гадир / Гихон
  rationale: Употреблены традиционные русские формы географических имён.
