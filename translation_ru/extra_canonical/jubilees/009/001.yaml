  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: ru
  text: И Симу выпал его удел на юге — до того места, где он подходит к середине моря[a]. А Мадаю выпал удел, чтобы он владел тем, что находится к западу от двух его братьев, вплоть до островов и их границ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало повествования о распределении земель в сохранившемся тексте фрагментарно; поэтому некоторые географические ориентиры и границы остаются не вполне ясными.
    reason: segmentation_note
lexical_decisions:
- source_word: መክፈልት
  choice: удел
  rationale: В контексте раздела земель обозначает выделенную долю или территорию; «удел» естественно передаёт смысл распределения по жребию и сохраняет торжественный регистр.
- source_word: የአኅዝ
  choice: владеть
  rationale: Глагол допускает значения «взять», «удерживать», «обладать»; в контексте земельных уделов нейтральное «владеть» предпочтительнее более резкого «захватить».
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: двух своих братьев
  rationale: Форма указывает именно на двух братьев, а не на владение братьев вообще.
- source_word: ደስያት
  choice: островов
  rationale: Прямое географическое значение существительного; подходит контексту описания границ.
- source_word: ጽነፊሆን
  choice: их пределов
  rationale: Сохраняет возможную соотнесённость местоименного суффикса с островами и не конкретизирует неясный характер границ.
