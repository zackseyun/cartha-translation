translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Синтаксис упрощён ради ясности, но повтор «выпал удел» сохранён как структурная черта текста. Формулировка «к западу от уделов двух своих братьев» слегка восполняет подразумеваемый географический объект, не снимая общей текстуальной неопределённости.
