  yaml_path: translation/extra_canonical/jubilees/009/004.yaml
  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: ru
  text: И вот земля, выпавшая Хаму в удел, чтобы он владел ею вечно — он сам и его сыновья во всех своих поколениях, вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: «выпала … в удел» (формула распределения земли)
  choice: «выпавшая Хаму в удел»
  rationale: Передаёт образ доли, доставшейся при распределении, и звучит естественно в современном литературном русском.
- source_word: «владеть / занимать»
  choice: «владел ею»
  rationale: По контексту раздела земель речь идёт не о кратком пребывании, а о постоянном обладании назначенной территорией.
- source_word: повтор формулы вечности
  choice: «вечно … вовеки»
  rationale: Сохранён смысловой повтор источника, подчёркивающий непреходящий характер удела.
- source_word: «по их поколениям»
  choice: «во всех своих поколениях»
  rationale: Естественно выражает непрерывность владения потомками Хама из поколения в поколение.
theological_decisions:
- issue: Характер обещанного Хаму удела
  choice: Сохранена безусловно звучащая формула вечного владения.
  alternative: Ослабить её до значения длительного исторического проживания.
  rationale: Текст сам использует усиленную формулу вечности; перевод не должен заранее ограничивать или догматически истолковывать её.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Конструкция с тире делает ясным, что владеть землёй должны и Хам, и его сыновья. Представленный фрагмент геэзского текста, по-видимому, не содержит непосредственно строки 9:4, поэтому формулировка сверена с предоставленным аудированным английским консультационным слоем и сохранённой в нём структурой стиха.
