  verdict: revise
  source_fidelity: 'Предоставленный геэзский фрагмент помечен как относящийся к родительской записи и не содержит непосредственно текста 9:4; поэтому прямую сверку данной строки с геэзским оригиналом выполнить нельзя. По английскому аудиторскому слою смысл передан верно: Хаму назначен земельный удел для вечного владения им и его потомками.'
  naturalness: Исходный перевод в целом литературен, но конструкция «чтобы он владел ею ... — он сам и его сыновья» грамматически связывает владение прежде всего только с Хамом. Явное обозначение потомков делает сферу владения ясной и естественной.
  terminology: «Удел» удачно передаёт распределённую земельную долю; «вовеки» сохраняет усиленную формулу вечности и уместно в умеренно библейском регистре.
  issues:
  - severity: medium
    issue: Неясная синтаксическая связь сыновей с владением
    rationale: В варианте «чтобы он владел ею ... — он сам и его сыновья» инфинитивное придаточное имеет подлежащим «он», тогда как английский слой распространяет владение также на сыновей Хама во всех поколениях.
  revised_text: И вот земля, доставшаяся Хаму в удел, — доля, которой он и его сыновья должны владеть вовеки, во всех поколениях.
  revised_footnotes: []
  revision_rationale: Уточнена синтаксическая сфера «он и его сыновья», чтобы она прямо соответствовала аудиторскому английскому тексту. Сохранены образ удела и повторно усиленное значение непреходящего владения; смысловых добавлений не внесено.
