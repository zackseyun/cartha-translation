  text: And he was buried on Mount Lubar in the land of Ararat. And he completed 950 years of his life.
translation:
  language: ru
  text: И он был погребён на горе Лубар[a], в земле Араратской. И прожил он девятьсот пятьдесят лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Лубаре, на горе».'
    reason: Эфиопское сочетание допускает более буквальное раздельное прочтение названия Лубар и слова «гора», хотя контекстуально естественнее понимать его как «гора Лубар».
lexical_decisions:
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: на горе Лубар
  rationale: Сочетание с ደብር естественно передаётся как название горы; русский предлог «на» соответствует обычному выражению «быть погребённым на горе».
- source_word: በምድረ፡ አራራት
  choice: в земле Араратской
  rationale: Сохраняет географическое значение «в земле Арарат» и придаёт фразе естественную для литературного русского форму.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: прожил он девятьсот пятьдесят лет
  rationale: Буквальная конструкция «завершил 950 лет в своей жизни» по-русски неестественна; глагол «прожил» точно и ясно выражает завершённую продолжительность жизни.
