  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, а последовательность географических ориентиров сохранена. Поскольку предоставленный фрагмент геэзского родительского текста не содержит отчётливо выделенной строки данного стиха, формулировка сверена с аудированным английским консультационным слоем без внесения дополнительных географических отождествлений.
