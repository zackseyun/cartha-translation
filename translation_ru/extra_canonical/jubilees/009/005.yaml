  yaml_path: translation/extra_canonical/jubilees/009/005.yaml
  text: And for Japheth came out the third portion beyond the river Tina, toward the north of the outflow of its waters, and it extends northeastward to the whole region of Gog and to all the country east of it.
translation:
  language: ru
  text: Иафету достался третий удел — по ту сторону реки Тины, к северу от места, где изливаются её воды; он простирается на северо-восток до всей области Гога и до всей земли к востоку от неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልት
  choice: удел
  rationale: В контексте раздела земли обозначает выделенную долю территории; «удел» естественно передаёт как результат жеребьёвки, так и наследственное владение.
- source_word: Иафет / Japheth
  choice: Иафет
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени.
- source_word: Тина / Tina
  choice: Тина
  rationale: Название реки передано транслитерацией без попытки отождествить её с иной рекой.
- source_word: Гог / Gog
  choice: Гог
  rationale: Сохранена традиционная русская форма географического имени без истолкования его как названия народа или правителя.
- source_word: outflow of its waters
  choice: место, где изливаются её воды
  rationale: Формулировка сохраняет географическую неопределённость выражения и не навязывает более узкое толкование «устье» или «исток».
theological_decisions: []
