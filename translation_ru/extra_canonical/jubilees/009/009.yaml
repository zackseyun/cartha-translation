revisions:
- from: 'И пришёл ангел духов, Мастема,[a] и сказал: «Господь Творец, оставь мне некоторых из них, чтобы они слушались моего голоса и исполняли всё, что я им скажу. Ведь если среди них не останется никого, кто служил бы мне, я не смогу проявлять власть своей воли среди сынов человеческих. Они нужны для того, чтобы развращать и вводить людей в заблуждение до моего суда, ибо велико зло сынов человеческих».'
  to: 'И пришёл ангел духов, Мастема,[a] и сказал: «Господи, Творец, оставь мне некоторых из них, чтобы они слушались моего голоса и исполняли всё, что я им скажу. Ибо если мне не останется никого из них, я не смогу осуществлять власть по своей воле среди сынов человеческих. Ведь они предназначены для развращения и введения в заблуждение до моего суда, ибо велико зло сынов человеческих».'
  rationale: 'Исправлены две смысловые добавки: «служить мне» заменено на нейтральное «мне не останется никого из них», а названный переводчиком объект «людей» убран. Титул передан буквально, с краткой сноской о возможном контекстуальном варианте. Остальная структура, включая временное «до моего суда», сохранена.'
