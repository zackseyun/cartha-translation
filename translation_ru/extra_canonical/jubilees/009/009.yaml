  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: ru
  text: 'И пришёл ангел духов, Мастема,[a] и сказал: «Господи, Творец, оставь мне некоторых из них, чтобы они слушались моего голоса и исполняли всё, что я им скажу. Ибо если мне не останется никого из них, я не смогу осуществлять власть по своей воле среди сынов человеческих. Ведь они предназначены для развращения и введения в заблуждение до моего суда, ибо велико зло сынов человеческих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен толковательный перевод титула: «князь духов, Мастема».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: ангел духов, Мастема
  rationale: መልአክ обычно означает «ангел» или «посланник», መናፍስት — «духов», а መስተማ передаёт имя Мастема. Формулировка сохраняет явный титул исходного текста, не заменяя его толковательным «князь».
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: оставь мне некоторых из них
  rationale: Глагол выражает оставление или сохранение остатка; русская формулировка естественно передаёт просьбу не уничтожать всех злых духов и предоставить часть Мастеме.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: проявлять власть своей воли
  rationale: Сочетание буквально связывает действие/осуществление, власть и волю говорящего. Перевод сохраняет необычное соединение власти и воли, но звучит понятно по-русски.
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: развращать и вводить людей в заблуждение
  rationale: Два инфинитива обозначают порчу/растление и совращение/введение в заблуждение. Добавленное «людей» лишь проясняет подразумеваемый объект из ближайшего выражения «сыны человеческие».
- source_word: ቅድመ፡ ኵነኔየ
  choice: до моего суда
  rationale: ቅድመ допускает временной смысл «до/прежде», а ኵነኔየ — «мой суд/осуждение». Формулировка сохраняет принадлежность суда говорящему и не уточняет его природу сверх текста.
theological_decisions:
- issue: Статус Мастемы
  choice: «ангел духов, Мастема»
  alternative: «князь духов Мастема»
  rationale: Исходное መልአክ непосредственно означает ангела или посланника; перевод «князь» сильнее истолковывает иерархический статус персонажа. Буквальная формулировка также сохраняет напряжение образа ангельского существа, действующего как противник.
- issue: «Мой суд» в речи Мастемы
  choice: сохранено «до моего суда»
  alternative: «до суда над ними» или «до Божьего суда»
  rationale: Местоименный суффикс первого лица относится к Мастеме. Его нельзя без текстового основания переносить на Бога или превращать в безличное указание на последний суд.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «Господь Творец» и выражение «сыны человеческие» сохранены ради жанра и межтекстовых связей; синтаксис разбит на ясные современные фразы.
