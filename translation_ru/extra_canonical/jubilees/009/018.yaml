base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: ru
  text: 'И в тридцать третьем юбилее, в первый год второй седмины, Фалек взял себе жену по имени Ломна, дочь Сенаара. В четвёртый год этой седмины она родила ему сына. Он назвал его Рагавом, потому что сказал: «Вот, сыны человеческие стали злы из-за злого замысла построить себе город и башню в земле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: юбилей
  rationale: Передаёт специальную хронологическую единицу книги — период в сорок девять лет — и сохраняет её традиционное наименование.
- source_word: ሱባዔ
  choice: седмина
  rationale: Обозначает семилетнюю часть юбилейного цикла; «седмина» точно отличает её от обычной календарной недели.
- source_word: ፋሌክ
  choice: Фалек
  rationale: Использована укоренившаяся русская библейская форма имени Пелега.
- source_word: ሎምና
  choice: Ломна
  rationale: Имя транслитерировано непосредственно по эфиопскому чтению.
- source_word: ሲናአር
  choice: Сенаар
  rationale: Использована традиционная русская библейская форма географического имени Шинар.
- source_word: ራገው
  choice: Рагав
  rationale: Сохранена традиционная русская библейская форма имени Реу, соответствующая форме в родословиях.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: город и башню
  rationale: Первое слово прямо означает «город»; второе в контексте рассказа о Вавилоне передано как «башня», согласно смыслу повествования и древней переводческой традиции.
theological_decisions:
- issue: Причина нравственного падения людей
  choice: «стали злы в своём замысле построить»
  alternative: «стали злы из-за нечестивого решения построить»
  rationale: Формулировка сохраняет связь зла с человеческим намерением, не добавляя отдельного богословского объяснения причин и не превращая неоднозначную конструкцию в более категоричное толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «седмина» сохранён ради точности юбилейной хронологии; синтаксис разбит на короткие фразы для ясности. Начальный фрагмент «поколение до дня суда» отнесён к окончанию предшествующего стиха и не включён, что соответствует смысловой границе данного стиха.
