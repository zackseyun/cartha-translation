  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: ru
  text: И мы рассказали Ною об их обманах[a], чтобы они исцелялись растениями земли. Ной записал в книгу всё, чему мы его научили, — обо всех видах исцеления; и духи[b] были сдержаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вместе с их обманами»; возможно также: «об их заблуждениях».'
    reason: Сочетание допускает понимание как обманных действий или как ошибок/заблуждений; буквальная конструкция с «вместе с» по-русски не вполне ясна без предшествующего контекста.
  - marker: b
    text: По контексту — злые духи; в исходном тексте здесь сказано просто «духи».
    reason: Контекстуальная идентификация не внесена в основной текст, чтобы не усиливать формулировку оригинала.
lexical_decisions:
- source_word: ምስለ፡ አስሕተትሙ፡
  choice: также об их обманах
  rationale: Передаёт сочетание «с/вместе с их обманами» естественным русским языком, не добавляя отсутствующего в тексте слова «все»; местоимение «их» сохраняет связь с контекстом.
- source_word: በዕፀወ፡ ምድር።
  choice: растениями земли
  rationale: Буквально и понятно передаёт средство исцеления; более узкое «целебными травами» внесло бы отсутствующее уточнение.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  choice: о всяком виде исцеления
  rationale: Передаёт охват всех разновидностей лечения без излишней технической конкретизации.
- source_word: ወተዐጸዉ፡ መናፍስት፡
  choice: и духи были удержаны
  rationale: Сохраняет пассивную конструкцию и не добавляет определения «злые», которого нет в данной формулировке геэзского текста.
theological_decisions:
- issue: Характер духов
  choice: духи
  alternative: злые духи
  rationale: Контекст может указывать на злых духов, однако исходный текст здесь говорит просто о «духах»; нейтральный вариант сохраняет формальную неоднозначность.
- issue: Неясный референт местоимения в выражении об исцелении
  choice: чтобы они исцелялись
  alternative: чтобы их можно было исцелять
  rationale: Личная форма сохраняет неопределённость исходного множественного субъекта и не подставляет явный референт.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного регистра. Синтаксис сделан естественным, но сохранены местоименная неоднозначность, пассивная конструкция и отсутствие явного определения у слова «духи».
