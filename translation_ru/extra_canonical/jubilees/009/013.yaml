revisions:
- from: И мы рассказали Ною также об их обманах[a], чтобы они исцелялись растениями земли. Ной записал в книгу всё, чему мы его научили, — о всяком виде исцеления; и духи[b] были удержаны.
  to: И мы рассказали Ною об их обманах[a], чтобы они исцелялись растениями земли. Ной записал в книгу всё, чему мы его научили, — обо всех видах исцеления; и духи[b] были сдержаны.
  rationale: Удалено «также», поскольку оно вносило отсутствующее значение добавления и неудачно заменяло геэзское «с/вместе с». Сохранены намеренная неопределенность местоимения «они» и нейтральное обозначение духов. Незначительно уточнена русская формулировка об охвате всех видов исцеления и выбран более естественный пассив «были сдержаны».
