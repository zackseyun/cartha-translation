base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: ru
  text: Девятнадцать юбилеев, две недели и пять лет прожил он на земле — дольше сынов человеческих, кроме Еноха, — благодаря праведности, в которой был совершенен. Ибо Еноха сделали свидетелем для поколений мира, чтобы он возвещал все деяния поколениям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  choice: девятнадцать юбилеев, две недели и пять лет
  rationale: Сохранены календарные единицы оригинала; «неделя» здесь обозначает семилетний период, но буквальная формулировка передаёт систему счёта Книги Юбилеев.
- source_word: አፈድፈደ፡ ሐዩዎ፡ ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ
  choice: прожил он на земле — дольше всех сынов человеческих
  rationale: Глагольная конструкция выражает превосходство его земной продолжительности жизни над прочими людьми; «сыны человеческие» сохраняет библейский регистр.
- source_word: በእንተ፡ ጽድቅ፡ ዘባቲ፡ ፍጹመ፡ ኮነ
  choice: благодаря праведности, в которой достиг совершенства
  rationale: Передана причинная связь и сохранена формулировка о совершенстве в праведности без добавления конфессионального толкования.
- source_word: ተፈጥሮተ፡ ለስምዕ
  choice: было предназначено свидетельствовать
  rationale: Буквальная идея установленной или созданной для Еноха функции передана естественным русским оборотом, без неясного «роль была создана».
- source_word: ለትዝምደ፡ ዓለም
  choice: поколениям мира
  rationale: Сохранён широкий временной охват свидетельства Еноха в близкой к исходному образу форме.
- source_word: ከመ፡ ይንገር፡ ኵሎ፡ ግብረ፡ ለትውልደ
  choice: чтобы он возвещал из поколения в поколение обо всех деяниях
  rationale: Финальная конструкция передана через «чтобы»; «деяния» сохраняет широкий смысл поступков или дел, не уточняя их субъект вопреки оригиналу.
theological_decisions:
- issue: Основание исключительного долголетия героя
  choice: сохранить причинную связь с его праведностью
  alternative: понять выражение лишь как описание праведной жизни, не связанное причинно с долголетием
  rationale: Предлог በእንተ естественно выражает основание или причину; перевод не развивает эту связь в отдельное учение.
- issue: Предназначение Еноха
  choice: передать как установленное предназначение свидетельствовать поколениям
  alternative: 'буквально: «для Еноха была создана функция свидетельства»'
  rationale: Выбран естественный русский синтаксис, сохраняющий мысль об особом назначении Еноха и не уточняющий, кем именно оно было установлено.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («сыны человеческие», «праведность», «деяния»). Счёт времени сохранён в терминах книги. Местоимение «он» оставлено без внесения имени, поскольку в данном фрагменте источник имени не называет; оно восстанавливается из контекста.
