revisions:
- from: Девятнадцать юбилеев, две недели и пять лет прожил он на земле — дольше всех сынов человеческих, кроме Еноха, — благодаря праведности, в которой достиг совершенства. Ибо Еноху было предназначено свидетельствовать поколениям мира, чтобы он возвещал из поколения в поколение обо всех деяниях.
  to: Девятнадцать юбилеев, две недели и пять лет прожил он на земле — дольше сынов человеческих, кроме Еноха, — благодаря праведности, в которой был совершенен. Ибо Еноха сделали свидетелем для поколений мира, чтобы он возвещал все деяния поколениям.
  rationale: 'Исправлены два оттенка смысла: статическое «был совершенен» вместо добавленного значения достижения и прямое обозначение Еноха свидетелем для поколений. Хронологические единицы и неопределённость субъекта «он» сохранены. Сноски не нужны: единственная английская сноска относится к прежней ошибочно подставленной версии другого отрывка.'
