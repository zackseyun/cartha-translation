  yaml_path: translation/extra_canonical/jubilees/009/007.yaml
  text: And it extends until it approaches west of Fara, and it returns toward Aferag, and it extends eastward toward the waters of the Sea of Me'at.
translation:
  language: ru
  text: И она простирается, пока не приблизится к области к западу от Фары, затем снова направляется к Аферагу и простирается на восток, к водам моря Меат.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቀርብ
  choice: доходит / подходит
  rationale: Глагол передаёт приближение к географическому ориентиру; в русском описании границы естественно «простирается до».
- source_word: መንገለ
  choice: к / по направлению к
  rationale: Направительный предлог передан по контексту движения границы, без излишней буквальности.
- source_word: ባሕረ፡ ሜአት
  choice: море Меат
  rationale: Название водоёма транслитерировано, поскольку надёжное отождествление не дано; родовой термин переведён как «море».
- source_word: Fara / Aferag
  choice: Фара / Афераг
  rationale: Географические названия переданы русской транслитерацией, без предположительного отождествления с современными местами.
theological_decisions: []
