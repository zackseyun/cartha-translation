  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: ru
  text: Ибо он любил его больше всех своих сыновей. И почил Ной с отцами своими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уснул Ной со своими отцами».'
    reason: Уточняет буквальный образ геэзского глагола, переведённого традиционной формулой «почил».
lexical_decisions:
- source_word: ኪያሁ፡ ያፈቅር
  choice: он любил его
  rationale: Сохраняет местоименный объект исходного текста, не подставляя имя из контекста и не устраняя возможную неоднозначность.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: больше всех своих сыновей
  rationale: 'Естественно передаёт сравнительное значение: его любовь к названному ранее лицу превосходила любовь ко всем его сыновьям.'
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: И почил Ной с отцами своими
  rationale: Передаёт традиционную формулу смерти достойным современным библейским языком; буквальный образ сна отмечен в сноске.
theological_decisions:
- issue: Объект любви Ноя
  choice: Сохранено местоимение «его»
  alternative: «Арфаксада»
  rationale: В данном геэзском фрагменте стоит местоимение, а имя прямо не названо; его подстановка сняла бы присущую тексту контекстуальную зависимость.
- issue: Формула смерти Ноя
  choice: «почил … с отцами своими»
  alternative: «уснул … со своими отцами»
  rationale: «Почил» сохраняет эвфемистическую формулу смерти без ошибочного впечатления обычного сна, тогда как сноска сообщает буквальный образ.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Порядок слов в заключительной фразе слегка возвышенный, но понятный; архаические формы вне устойчивой библейской формулы не используются.
