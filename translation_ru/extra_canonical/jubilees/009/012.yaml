  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: ru
  text: Третий язык. А Мешеку достался шестой удел — вся область по ту сторону третьего языка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вся область третьего языка».'
    reason: Слово ማዕዶተ обычно означает пространство по ту сторону чего-либо, но допускает и более общее понимание связи между «областью» и «третьим языком».
lexical_decisions:
- source_word: ልሳን፡ ሣልስት
  choice: третий язык
  rationale: Буквально передаёт сочетание «язык третий» и сохраняет необычную географическую формулировку источника.
- source_word: ለሞስክ
  choice: Мешеку
  rationale: Передаёт имя ሞስክ принятой русской библейской формой «Мешек» в дательном падеже.
- source_word: ወፅአ፡ መክፈልት፡ ሳድስ
  choice: выпал шестой удел
  rationale: Естественная русская формулировка для распределения земель по жребию; መክፈልት означает долю или удел, а ወፅአ буквально выражает выход или выпадение.
- source_word: ኵሉ፡ ማዕዶተ፡ ልሳን፡ ዘሣልስት
  choice: вся область по ту сторону третьего языка
  rationale: ማዕዶተ передаёт значение пространства «по ту сторону», «за пределами»; формулировка сохраняет в тексте неясное употребление слова «язык».
theological_decisions:
- issue: Необычное географическое значение слова «язык»
  choice: Сохранить буквальное «третий язык»
  alternative: Истолковать как название местности или как «область третьего языка»
  rationale: Источник дважды употребляет ልሳን («язык»); контекст может подразумевать географический объект, но его точная идентификация неочевидна, поэтому неоднозначность не разрешается переводчиком.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Отрывочность начальной фразы сохранена, поскольку она присутствует в предоставленном источнике и, вероятно, продолжает предыдущее описание границ.
