  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: ru
  text: Злые духи больше не преследовали сыновей Ноя.[a] И Ной передал своему сыну Симу всё, что написал, потому что горячо любил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный эфиопский текст начинается с середины фразы; перевод передаёт её смысл по сохранившимся словам и ближайшему контексту.
    reason: textual_note
lexical_decisions:
- source_word: እኩያን
  choice: злые духи
  rationale: Буквально «злые»; в контексте повествования речь идёт о злых духах, вредивших потомкам Ноя.
- source_word: እምድኅሬሆሙ
  choice: больше не преследовали
  rationale: Оборот буквально связан с движением «за ними, вслед за ними»; по-русски естественно передаёт прекращение преследования, не уточняя сверх источника способ их удержания.
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: всё, что написал
  rationale: Прямо сохраняет объём и содержание эфиопского выражения.
- source_word: ዘይፈህቅ
  choice: потому что горячо любил его
  rationale: Передаёт причинную связь и сильную привязанность естественным современным русским языком.
theological_decisions:
- issue: Кто назван «злыми»
  choice: злые духи
  alternative: злые существа / злые
  rationale: Контекст раздела говорит о духах, преследующих сыновей Ноя; уточнение делает фрагментарную фразу понятной, не вводя конфессионального толкования.
- issue: Субъект передачи написанного
  choice: Ной
  alternative: он
  rationale: Местоименный субъект понятен из контекста, но имя необходимо для ясности самостоятельного русского стиха.
