  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: ru
  text: А Тувалу достался пятый удел посреди языка, простирающийся к уделу Луда вплоть до другого языка — до области по ту сторону этого другого языка.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: А Тувалу
  rationale: Форма прямо называет Тувала; предшествующие слова «…Луда» относятся к окончанию предыдущего отрывка, а не к получателю этого удела.
- source_word: መክፈልት፡ ኃምስ
  choice: пятый удел
  rationale: Передаёт порядковое число и земельную долю естественным библейским русским выражением.
- source_word: ልሳን
  choice: язык земли
  rationale: Буквально «язык»; добавление «земли» делает географический образ понятнее, не устраняя неясности очертаний местности.
- source_word: ትቀርብ፡ መንገለ
  choice: тянется к
  rationale: Естественно передаёт направленность географического выступа к уделу Луда.
- source_word: ማዕዶተ
  choice: за
  rationale: Передаёт значение нахождения по ту сторону, или за обозначенным географическим ориентиром, а не просто внутри его области.
