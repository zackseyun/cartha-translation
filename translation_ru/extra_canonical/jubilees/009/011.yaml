  source_fidelity: Верно переданы получатель удела (Тувал, не Луд), пятый удел, его направленность к уделу Луда и указание на область по ту сторону другого «языка». Однако добавление «земли» несколько конкретизирует образ, отсутствующий в тексте, а заключительное «в область» синтаксически не вполне ясно передаёт предел протяжённости.
  naturalness: Фраза в целом понятна, но сочетание «вплоть до другого языка, в область за тем, другим языком» тяжеловесно и допускает неясное прочтение. Более ясная конструкция с тире сохраняет намеренно тёмную географическую терминологию.
  terminology: «Удел» и «Тувал» уместны. «Язык» следует сохранить буквально как неясный географический ориентир, не уточняя его как «язык земли» или «суши».
