  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: ru
  text: 'И пришёл ангел духов, Мастема, и сказал: «Господь-Творец, оставь некоторых из них при мне; пусть они слушают мой голос и исполняют всё, что я им скажу. Ведь если некоторые из них не будут оставлены мне, я не смогу осуществлять свою власть над сынами человеческими по своей воле, ибо они предназначены для того, чтобы развращать и вводить в заблуждение перед моим судом[a], потому что велико зло сынов человеческих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «до моего суда» или «до моего осуждения».'
    reason: Выражение ቅድመ፡ ኵነኔየ допускает понимание предлога во временном смысле, а существительное может обозначать как суд, так и осуждение.
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: ангел духов, Мастема
  rationale: መስተማ передаётся как явно названное имя Мастема, а не как определение к «духам»; приложение с запятыми естественно по-русски.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: оставь некоторых из них при мне
  rationale: Передаёт просьбу сохранить часть духов в распоряжении говорящего; «при мне» естественно выражает буквальное «передо мной» в данном контексте.
- source_word: ወይስምዑ፡ ቃለየ
  choice: пусть они слушаются моего голоса
  rationale: Глагол в сочетании с последующим исполнением сказанного означает не только физически слышать, но и повиноваться; образ «голоса» сохранён.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: властвовать по своей воле
  rationale: Естественно передаёт осуществление власти, подчинённой воле говорящего, без тяжеловесного буквального выражения «совершать власть моей воли».
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: чтобы развращать и вводить в заблуждение
  rationale: 'Сохраняются два параллельных действия: нравственное разложение и совращение с верного пути.'
- source_word: ውሉደ፡ ሰብእ
  choice: сыны человеческие
  rationale: Традиционное и понятное возвышенное обозначение человечества, соответствующее буквальному образу источника.
theological_decisions:
- issue: Личность ангела духов
  choice: Имя «Мастема» сохранено в основном тексте
  alternative: «ангел оставшихся духов» без имени
  rationale: Эфиопский текст прямо содержит መስተማ как собственное имя; его устранение меняло бы участника повествования.
- issue: Чья власть осуществляется над людьми
  choice: «властвовать по своей воле» — воля Мастемы
  alternative: Приписать эту власть Богу либо смягчить её до простого влияния
  rationale: Форма первого лица ፈቃድየ («моя воля») относится к говорящему; богословское напряжение просьбы сохранено.
- issue: Значение «перед моим судом»
  choice: Сохранить первое лицо и временно-пространственную неоднозначность
  alternative: «до Божьего суда», «на суде надо мной» или «пока я не буду осуждён»
  rationale: Источник буквально говорит о «моём суде/осуждении» после предлога «перед»; контекст не оправдывает молчаливого уточнения субъекта или характера суда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис сделан ясным для обычного читателя; сохранены «голос» и «сыны человеческие», но избегнуты архаизмы и неестественная калька «осуществлять власть моей воли».
