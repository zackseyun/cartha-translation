  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: ru
  text: чтобы лечь с ней. Но он удержал себя, вспомнил Господа и слова, которые его отец Иаков повторял из наставлений Авраама:[a] ни один мужчина не должен вступать в половую связь с замужней женщиной, потому что на небесах, пред Всевышним Богом, ему определён смертный приговор, а этот грех постоянно записывается против него в вечных книгах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Упоминание о том, что Иаков повторял наставления, восходящие к Аврааму, характерно для Книги Юбилеев: отказ Иосифа здесь основан не только на личной нравственной решимости, но и на переданном патриархальном наставлении.'
