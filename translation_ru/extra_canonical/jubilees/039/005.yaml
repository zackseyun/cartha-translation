lexical_decisions:
- source_word: አመጠወ፡ ነፍሶ፡
  choice: удержал себя
  rationale: Идиома буквально говорит об обуздании или удержании своей души; естественное русское выражение передаёт сознательное самообладание Иосифа.
- source_word: ያነብብ፡
  choice: повторял
  rationale: В данном контексте обозначает регулярное чтение вслух или произнесение переданных наставлений; «повторял» сохраняет привычный характер действия.
- source_word: ይዜሙ፡
  choice: вступать в половую связь
  rationale: Глагол обозначает сексуальное прегрешение/блуд; нейтральная конкретная формулировка ясно передаёт смысл применительно к замужней женщине, не вводя узкого конфессионального термина.
- source_word: ብእሲት፡ እንተ፡ ባቲ፡ ምት፡
  choice: замужней женщиной
  rationale: Буквально — женщина, у которой есть муж; современный русский эквивалент краток и точен.
- source_word: ኵነኔ፡ ሞት፡
  choice: смертный приговор
  rationale: Передаёт судебное значение сочетания «осуждение/приговор смерти».
- source_word: መጻሕፍት፡ ዘለዓለም፡
  choice: вечных книгах
  rationale: Формально сохраняет образ небесных вечных книг.
- source_word: በኵሉ፡
  choice: навеки
  rationale: Финальное наречие означает постоянство/непрестанность; «навеки» естественно связывается с записью в вечных книгах и не добавляет отсутствующего упоминания Господа.
theological_decisions:
- issue: Характер слов, переданных от Авраама через Иакова
  choice: «слова… из наставлений Авраама»
  alternative: «слова… из слов Авраама»
  rationale: Избегает тяжёлого повтора по-русски, сохраняя мысль о переданном патриархальном наставлении без утверждения о форме отдельного писаного источника.
- issue: Сила конструкции ከመ፡ አልቦ፡ ... ዘይዜሙ፡
  choice: нормативное «ни один мужчина не должен»
  alternative: описательное «нет ни одного мужчины, который вступает»
  rationale: В контексте наставления конструкция выполняет запретительную функцию; описательное прочтение создало бы странное и явно неверное обобщение.
- issue: Небесный смертный приговор
  choice: «на небесах, пред Всевышним Богом, ему определён смертный приговор»
  alternative: «Всевышний Бог определил ему смертный приговор на небесах»
  rationale: Сохраняет пассивную формулировку источника и не делает Бога явно выраженным действующим лицом там, где текст лишь помещает постановление пред Ним.
- issue: Финальная длительность записи греха
  choice: «навеки записывается за ним»
  alternative: «постоянно записывается против него»
  rationale: Сохраняет идею непреходящей обвинительной записи; не добавляет фразу «пред Господом», которой в конце эфиопского текста нет.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Синтаксис упрощён без утраты последовательности исходного текста; терминология избегает как архаической неясности, так и конфессионально нагруженных уточнений.
