lexical_decisions:
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: начальник тюремных стражей
  rationale: Передаёт составное обозначение начальника тех, кто охраняет заключённых, естественным современным русским выражением.
- source_word: ሠርዖ፡ ለዮሴፍ
  choice: приставил к ним Иосифа
  rationale: Глагол выражает назначение или определение на поручение; в данном контексте «приставил к ним» ясно указывает, что Иосифу поручили заботу о заключённых.
- source_word: ይትአከኮሙ
  choice: заботился о них
  rationale: Контекстуально передаёт личное попечение и присмотр за ними, не сводя действие лишь к физическому присутствию.
- source_word: ይትለአክ፡ ቅድሜሆሙ
  choice: служил им
  rationale: Буквально выражение связано со служением «перед ними»; по-русски объектное «служил им» естественно передаёт эту функцию без неуместного пространственного оттенка.
