  language: ru
  text: И оба они увидели сон[a] — главный виночерпий и главный пекарь — и поведали Иосифу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оба они увидели сон». Единственное число сохранено по эфиопскому тексту; по контексту речь может идти о сне каждого из них.'
    reason: Сохраняет грамматическое число оригинала и не снимает возможную неоднозначность.
lexical_decisions:
- source_word: ሐለሙ፡ … ሕልመ፡
  choice: увидели сон
  rationale: Сохраняет глагольную конструкцию и единственное число слова «сон» в эфиопском тексте, оставаясь естественной для библейского повествования на русском языке.
- source_word: ሊቀ፡ መዛርት፡
  choice: главный виночерпий
  rationale: Передаёт должность начальника царских виночерпиев привычным и понятным русским наименованием.
- source_word: ሊቀ፡ ሐበዝት፡
  choice: главный пекарь
  rationale: Точно и естественно передаёт должность начальника пекарей.
- source_word: ወነገርዎ፡ ለዮሴፍ።
  choice: и поведали Иосифу
  rationale: Глагол «поведали» допускает понятный из контекста предмет сообщения и не требует добавлять в основной текст отсутствующее явное существительное «сны».
