  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: ru
  text: …в доме египтянина благодаря Иосифу.[a] Господь давал успех всему, что он делал. Египтянин отдал всё в руки Иосифа, потому что видел, что Господь с ним и что Господь давал успех всему, что он делал.
  philosophy: optimal-equivalence
  footnotes:
