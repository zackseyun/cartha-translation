lexical_decisions:
- source_word: ሞቅሕ
  choice: темница
  rationale: Существительное обозначает место заключения; повтор сохранён, как в геэзском тексте. «Темница» соответствует достоинству библейского повествования и остаётся понятной современному читателю.
- source_word: ቤቱ፡ ለሊቀ፡ ዐቀብተ
  choice: дом начальника стражей
  rationale: Передаёт конструкцию «дом начальника хранителей/стражей» естественным русским сочетанием без неоправданного уточнения рода стражи.
- source_word: እኁዝ
  choice: был заключён
  rationale: Причастная форма со значением «схваченный, удерживаемый» в тюремном контексте естественно передаётся как состояние заключения.
- source_word: ህየ
  choice: ту
  rationale: Указательное наречие «там» учтено в обороте «в ту темницу»; это позволяет не добавлять тяжеловесное и избыточное по-русски «там» в конце.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Тире показывает, что «дом начальника стражей» поясняет место заключения; повтор слова «темница» сохраняет структуру источника.
