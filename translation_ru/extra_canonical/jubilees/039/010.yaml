  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: ru
  text: Египтянин увидел одежду Иосифа и сломанный дверной засов, выслушал рассказ своей жены и заключил Иосифа в темницу — туда, где содержались узники царя. И он был там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: египтянин
  rationale: Прямое обозначение египтянина; имя или должность в данном стихе не названы.
- source_word: ልብሶ፡ ለዮሴፍ
  choice: одежду Иосифа
  rationale: Передаёт принадлежность одежды Иосифу без уточнения её вида, которого источник здесь не даёт.
- source_word: ማዕጾ፡ ስቡረ
  choice: сломанный дверной засов
  rationale: Сочетание обозначает сломанный элемент запирания двери; «дверной засов» естественно и конкретно передаёт смысл.
- source_word: ሰምዐ፡ ነገረ፡ ብእሲቱ
  choice: выслушал рассказ своей жены
  rationale: По-русски естественно передаёт буквальное «услышал рассказ/слова своей жены», не утверждая истинности её рассказа.
- source_word: ቤተ፡ ሞቅሕ
  choice: темницу
  rationale: Устойчивое и понятное обозначение места заключения; буквальное «дом уз» по-русски неестественно.
- source_word: ሙቁሓን፡ እለ፡ ሞቅሑ፡ ንጉሥ
  choice: узники царя
  rationale: Сохраняет связь заключённых с царём, не уточняя без необходимости, кем именно и по какой причине они были заключены.
- source_word: ወሀሎ
  choice: И он оставался там
  rationale: Передаёт краткое заключительное «и был/находился там» естественным русским выражением, не добавляя повторного указания «в темнице».
