  yaml_path: translation/extra_canonical/jubilees/039/012.yaml
  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: ru
  text: Что бы он ни делал, Господь даровал ему успех. Начальник темницы отдал всё в его руки; он ничего не знал о том, что было у Иосифа, потому что Иосиф делал всё, а Господь доводил всё до конца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘገብረ፡ እግዚአብሔር፡ ይሴርሖ
  choice: Что бы он ни делал, Господь даровал ему успех
  rationale: Передаёт относительную конструкцию и каузативное значение глагола «делать успешным, содействовать успеху» естественным современным русским языком.
- source_word: ወኀደገ፡ ኵሎ፡ በእዴሁ
  choice: Начальник темницы отдал всё в его руки
  rationale: Подлежащее восстанавливается из следующего оборота; идиома «в его руки» сохранена как понятное обозначение полной ответственности.
- source_word: አልቦ፡ ሊቀ፡ ዐቀብተ፡ ሞቅሕ፡ ዘያአምር፡ ምስሌሁ፡ ምንተኒ
  choice: не заботился ни о чём, что было поручено ему
  rationale: Буквальное «не знал ничего при нём» в данном контексте означает отсутствие необходимости следить за делами, находившимися в ведении Иосифа; формулировка согласуется с повествовательным контекстом и звучит естественно.
- source_word: ወእግዚአብሔር፡ ይፈጽም
  choice: а Господь доводил дело до конца
  rationale: Сохраняет различие между деятельностью Иосифа и завершающим действием Господа; несовершенный вид соответствует повторяющемуся характеру описания.
theological_decisions:
- issue: Соотношение труда Иосифа и действия Господа
  choice: «Иосиф делал всё, а Господь доводил дело до конца»
  alternative: «Иосиф всё исполнял, и Господь давал всему совершиться»
  rationale: Сохранено параллельное утверждение человеческой деятельности и Божьего завершения без устранения заложенного в тексте богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Имя Господа передано как «Господь», без типографического выделения прописными буквами; тяжеловесный буквальный оборот о начальнике стражей заключённых естественно передан как «начальник темницы».
