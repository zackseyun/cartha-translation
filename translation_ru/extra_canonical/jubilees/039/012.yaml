revisions:
- from: Что бы он ни делал, Господь даровал ему успех. Начальник темницы отдал всё в его руки и не заботился ни о чём, что было поручено ему, потому что Иосиф делал всё, а Господь доводил дело до конца.
  to: Что бы он ни делал, Господь даровал ему успех. Начальник темницы отдал всё в его руки; он ничего не знал о том, что было у Иосифа, потому что Иосиф делал всё, а Господь доводил всё до конца.
  rationale: Устранено контекстуально мотивированное, но более сильное толкование «не заботился», чтобы сохранить прямое утверждение текста о незнании начальника. В последней фразе восстановлен всеобщий объект «всё», соответствующий исходному параллелизму. Пункт с запятой ясно разграничивает два сообщения во втором предложении.
