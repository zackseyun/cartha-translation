translation:
  language: ru
  text: Я подняла голос, и он побежал, оставив свою одежду в моей руке, когда я схватила его, и сломал дверь».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выломал дверь».'
    reason: Глагол означает «сломал, разбил»; «выломал» — допустимое контекстуальное уточнение, но не должен подменять нейтральное основное значение.
lexical_decisions:
- source_word: አልዐልኩ፡ ቃለየ
  choice: Я возвысила голос
  rationale: Буквально передаёт сочетание «подняла/возвысила мой голос» и сохраняет прямую речь женщины.
- source_word: ጐየ
  choice: он побежал
  rationale: Естественное русское соответствие глаголу со значением «бежать».
- source_word: ወኀደገ፡ ልብሶ፡ ውስተ፡ እዴየ
  choice: оставив свою одежду у меня в руке
  rationale: Передаёт принадлежность одежды мужчине и устойчивое пространственное выражение «в моей руке» естественным русским оборотом.
- source_word: አኀዝክዎ
  choice: я схватила его
  rationale: Сохраняет прямой объект мужского рода и значение физического удержания.
- source_word: ሰበረ፡ ማዕጾ
  choice: выломал дверь
  rationale: ሰበረ означает «сломал/разбил», а ማዕጾ прежде всего «дверь»; «выломал дверь» естественно описывает прорыв через неё, не заменяя предмет засовом.
