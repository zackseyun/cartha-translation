translation:
  language: ru
  text: Фараонову начальнику стражи. И он поставил Иосифа над всем своим домом, и стало благословение Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፈርዖን፡ ሊቀ፡ ዐቀብት
  choice: у фараона, начальника стражи
  rationale: Фрагментарная начальная фраза передана без добавления отсутствующего в данном стихе сказуемого; ሊቀ ዐቀብት буквально обозначает начальника стражей/стражи.
- source_word: ሤሞ፡ ለዮሴፍ፡ ዲበ፡ ኵሉ፡ ቤቱ
  choice: он поставил Иосифа над всем своим домом
  rationale: Сохраняется обычное значение глагола назначения и конструкция власти над всем домом; местоимение «своим» естественно указывает на дом названного хозяина.
- source_word: ኮነት፡ በረከተ፡ እግዚአብሔር
  choice: явилось благословение Господа
  rationale: Буквально конструкция означает, что благословение Господа «стало/возникло»; «явилось» естественно по-русски и не добавляет отсутствующего объекта благословения.
theological_decisions:
- issue: Объект и причина благословения
  choice: Не добавлять дом египтянина и причинную фразу «ради Иосифа»
  alternative: «благословение Господа было на доме египтянина ради Иосифа»
  rationale: Таких слов нет в предоставленном эфиопском тексте данного стиха; дополнение неоправданно разрешило бы лаконичность источника.
- issue: Передача имени Бога እግዚአብሔር
  choice: Господа
  alternative: Яхве
  rationale: Эфиопское обозначение здесь соответствует традиционному титулу «Господь» и само по себе не требует восстановления тетраграмматона в форме «Яхве».
