  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: ru
  text: И пробыл он там два года. В те дни фараон, царь Египта, разгневался на двух своих евнухов — на главного виночерпия и главного пекаря — и заключил их в темницу.[a]
  philosophy: optimal-equivalence
