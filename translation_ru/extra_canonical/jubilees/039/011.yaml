  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: ru
  text: Там, в темнице, Господь даровал Иосифу благоволение и милость в глазах начальника тюремной стражи[a], потому что тот видел, что Господь был с Иосифом, и всё…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В титуле употреблён тот же корень со значением «стеречь, охранять», что и ранее, однако здесь, в тюремном контексте, речь идёт о начальнике тюремной стражи, а не о должности при доме Потифара.
    reason: lexical_alternative
  - marker: b
    text: Предоставленный геэзский текст стиха обрывается на словах «и всё»; многоточие отмечает эту незавершённость, не восполняя продолжение.
    reason: textual_truncation
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ
  choice: Там, в темнице
  rationale: Сохраняет явно выраженное в геэзском тексте указание на место, опущенное в одной из прежних редакций.
- source_word: ሞገሰ … ወምሕረተ
  choice: благоволение и милость
  rationale: Передаёт два самостоятельных понятия исходного текста, не сливая их в одно.
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ
  choice: начальника тюремной стражи
  rationale: Естественно обозначает руководителя охраны темницы и сохраняет значение корня «стеречь, охранять».
- source_word: ርእየ
  choice: тот видел
  rationale: Явное местоимение «тот» по-русски уточняет, что подлежащим является начальник стражи, а не Иосиф или Господь.
- source_word: ወኵሎ
  choice: и всё…
  rationale: Сохраняет незавершённость предоставленного исходного текста и не восполняет отсутствующее продолжение догадкой.
theological_decisions:
- issue: Божественное имя እግዚአብሔር
  choice: Господь
  alternative: Бог
  rationale: В данном повествовательном контексте традиционное «Господь» соответствует консультационному переводу и привычному русскому библейскому регистру, не добавляя конфессиональной интерпретации.
- issue: Отношение благоволения и милости к начальнику стражи
  choice: оба дара выражены как отношение начальника к Иосифу
  alternative: благоволение дано Иосифу, а милость отдельно пребывает перед начальником
  rationale: Параллельная конструкция естественнее понимается как два дара Иосифу, проявившиеся в глазах одного и того же должностного лица; формулировка не разводит их искусственно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; повтор имени Иосиф устраняет двусмысленность местоимения. Финальная незавершённость исходного фрагмента сохранена и пояснена в сноске.
