lexical_decisions:
- source_word: ወአንዘተ
  choice: И она схватила его
  rationale: Передаёт первое, а затем и повторное употребление глагола; объект восстанавливается из контекста.
- source_word: ከመ፡ ትትበአስ፡ ይስክብ፡ ምስሌሃ
  choice: чтобы принудить его лечь с ней
  rationale: Естественно по-русски передаёт цель и принуждение, не смягчая сексуального смысла выражения.
- source_word: ወዐጸወት፡ ኆኅተ፡ ቤት
  choice: Она заперла двери дома
  rationale: Сохраняет множественное число «двери» и прямое значение действия.
- source_word: ወኀደገ፡ ልብሶ፡ ውስተ፡ እዴሃ
  choice: но он оставил свою одежду у неё в руке
  rationale: «Но» ясно выражает повествовательное противопоставление; формулировка близка к структуре источника.
- source_word: ወሰበረ፡ ማዕጾ
  choice: сломал дверной засов
  rationale: Передаёт конкретный запирающий элемент двери, а не саму дверь.
- source_word: ወጐየ፡ አፍአ፡ እምቅድመ፡ ገጻ
  choice: выбежал от неё наружу
  rationale: Естественная русская передача буквального «побежал наружу от её лица» без ненужного семитизма.
- source_word: ወርእየት
  choice: И она увидела…
  rationale: Сохраняет заключительный глагол источника и его незавершённость на границе стиха.
