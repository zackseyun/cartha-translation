  text: And Joseph was handsome in appearance and very good to look at, and his master's wife lifted up her eyes and saw Joseph and loved him, and asked him
translation:
  language: ru
  text: Иосиф был красив лицом и очень хорош собой. Жена его господина подняла глаза, увидела Иосифа, полюбила его и попросила его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠናይ፡ ራእዮ፡
  choice: красив лицом
  rationale: Передаёт описание внешнего вида Иосифа естественным современным русским выражением, сохраняя связь с видимой наружностью.
- source_word: ወላህይ፡ ራእዮ፡ ጥቀ፡
  choice: и очень хорош собой
  rationale: Сохраняет усилитель ጥቀ («очень») и вторую характеристику привлекательной внешности, не сливая её с первой.
- source_word: ወአንሥአት፡ አዕይንቲሃ፡
  choice: подняла глаза
  rationale: Формально близко воспроизводит семитское выражение и остаётся понятным по-русски.
- source_word: ወአፍቀረቶ፡
  choice: полюбила его
  rationale: Прямо передаёт значение глагола любви, не уточняя без необходимости характер влечения.
- source_word: ወአስተብቍዐቶ፡
  choice: и стала просить его
  rationale: Передаёт просьбу или настойчивое обращение; несовершенный оборот естественно вводит содержание просьбы, вероятно следующее далее.
theological_decisions:
- issue: Характер любви жены господина к Иосифу
  choice: полюбила его
  alternative: возжелала его
  rationale: Источник употребляет глагол любви; более узкое «возжелала» истолковало бы мотив вместо сохранения исходной формулировки.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены последовательность действий, повторное описание красоты Иосифа и открытый конец стиха перед содержанием просьбы.
