translation:
  language: ru
  text: дни перед Богом.[a] Иосиф вспомнил об этом и решил не ложиться с ней. Она уговаривала его год, а затем ещё год, но он отказывался её слушать. И было удостоверено…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова, по-видимому, являются окончанием предыдущего стиха.
    reason: Предоставленный текст начинается синтаксически незавершённым фрагментом, вероятно возникшим из-за деления стихов.
  - marker: b
    text: Последний глагол в предоставленном тексте не имеет выраженного субъекта, а предложение обрывается; возможны также значения «выяснили», «подтвердили» или «доказали».
    reason: Необходимо сохранить грамматическую и текстовую неопределённость, не приписывая действие женщине или Иосифу.
lexical_decisions:
- source_word: መዋዕለ፡ ቅድመ፡ እግዚአብሔር
  choice: дни перед Богом
  rationale: Буквально передаёт сохранившийся начальный фрагмент; по смыслу и синтаксису он, вероятно, относится к концу предыдущего стиха.
- source_word: ተዘከረ፡ ዮሴፍ፡ ዘንተ፡ ነገረ
  choice: Иосиф вспомнил об этом
  rationale: Естественная русская передача «Иосиф вспомнил это дело/обстоятельство» без излишне буквального «это слово/дело».
- source_word: ወአፈቀደ፡ ይስክብ፡ ምስሌሃ
  choice: и решил не ложиться с ней
  rationale: В контексте настойчивых домогательств и последующего отказа выражение передано как решение не вступать с ней в связь; «ложиться с ней» сохраняет библейский эвфемизм. Отрицательный смысл следует контексту и засвидетельствованной редакционной традиции, хотя форма አፈቀደ сама по себе обычно выражает волю или согласие.
- source_word: ወአስተብቍዐቶ፡ ዓመተ፡ አሐደ፡ ወካልአ
  choice: Она уговаривала его год, а затем ещё год
  rationale: 'Передаёт длительность и последовательность: буквально «один год и второй».'
- source_word: ወአበየ፡ ሰሚዐ
  choice: но он отказывался её слушать
  rationale: Идиоматически передаёт отказ внимать её просьбам; местоимение добавлено по ближайшему контексту.
- source_word: ወአጠየቀ
  choice: И было удостоверено…
  rationale: Форма допускает значения, связанные с удостоверением, выяснением или доказательством, но в предоставленном отрывке отсутствует продолжение и неясен субъект. Безличная конструкция не приписывает действие ни Иосифу, ни женщине.
theological_decisions:
- issue: Нравственный смысл отказа Иосифа при неоднозначной форме አፈቀደ
  choice: «решил не ложиться с ней»
  alternative: «согласился лечь с ней»
  rationale: Альтернативное буквальное понимание формы противоречит непосредственно следующему сообщению о длительном отказе Иосифа слушать женщину и более широкому повествовательному контексту; перевод сохраняет напряжение в примечании, а не создаёт ложное утверждение о согласии.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Начальный и конечный обрывки сохранены, а не удалены; многоточие отмечает незавершённость исходного фрагмента. Эвфемизм «ложиться с ней» оставлен ради близости к языку источника и ясности для широкого читателя.
