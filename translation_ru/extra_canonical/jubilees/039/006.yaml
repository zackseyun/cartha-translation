    issue: Финальное «И было удостоверено…»
    rationale: Безличная конструкция не следует прямо из ወአጠየቀ и вносит специфическое значение удостоверения. При отсутствии дополнения и ясного субъекта безопаснее оставить непереведённость как текстовую лакуну с примечанием.
  - severity: medium
    issue: Неотмеченное расхождение в «решил не ложиться с ней»
    rationale: Смысл отказа поддержан контекстом и английским контрольным текстом, но в данной геэзской подаче перед «лечь с нею» не видно отрицания. Примечание должно прямо фиксировать это текстовое расхождение.
  revised_text: дни перед Богом.[a] Иосиф вспомнил об этом и не захотел лечь с нею.[b] Она уговаривала его целый год, потом ещё один, но он отказывался её слушать. [Конец предоставленного фрагмента неполон.][c]
