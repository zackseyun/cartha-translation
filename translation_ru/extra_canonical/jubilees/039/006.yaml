  verdict: revise
  source_fidelity: 'Начальный фрагмент መዋዕለ፡ ቅድመ፡ እግዚአብሔር сохранён как синтаксически принадлежащий, вероятно, предыдущему стиху. Основная линия — отказ Иосифа — подтверждается английской контрольной традицией и непосредственно последующим «он отказался слушать», хотя в предоставленной геэзской строке перед инфинитивом «лечь с нею» отсутствует ожидаемое отрицание; это следует отметить, а не молча выдавать за бесспорную форму текста. Конечное ወአጠየቀ в обрывке не даёт основания для безличного «было удостоверено»: его точное значение и субъект без продолжения не устанавливаются надёжно.'
  naturalness: «Дни перед Богом» как намеренно сохранённый обрывок приемлемы. «Она уговаривала его год, а затем ещё год» естественно, но «год и второй год» лучше передать как «целый год, потом ещё один». «И было удостоверено…» неестественно и создаёт неоправданно канцелярский смысл.
  terminology: «Лечь с нею» уместно сохраняет библейский эвфемизм. «Бог» и «Иосиф» нормативны. Для финального повреждённого/оборванного места лучше не навязывать значение «удостоверить» и обозначить неполноту перевода.
  issues:
