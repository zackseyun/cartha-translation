  text: And that woman saw that he would not lie with her, and she accused him before his master, saying, “Your Hebrew servant, whom you love, wanted to force me[a] so as to lie with me; and it happened that when
translation:
  language: ru
  text: 'И эта женщина увидела, что он не ляжет с ней, и обвинила его перед его господином, говоря: «Твой еврейский раб, которого ты любишь, хотел принудить меня[a] лечь с ним; и случилось, когда…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «принудить меня», можно понять и шире — как «напасть на меня» или «надругаться надо мной»; однако последующие слова указывают на обвинение в попытке сексуального насилия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትዐገላኒ
  choice: хотел принудить меня
  rationale: Передаёт намерение и принуждение, не добавляя отсутствующего в источнике движения («пришёл»); дальнейшее «чтобы лечь со мной» уточняет сексуальный характер обвинения.
- source_word: ገብርከ፡ ዕብራዊ
  choice: твой раб-еврей
  rationale: Сохраняет значение зависимого слуги/раба и естественно передаёт этническое определение в русской речи.
- source_word: ዘታፈቅር
  choice: которого ты любишь
  rationale: Прямо сохраняет формулировку источника, не ослабляя её до «которому благоволишь».
- source_word: አይስክብ፡ ምስሌሃ
  choice: он не ляжет с ней
  rationale: Будущая форма после восприятия естественно передана как осознание его отказа/решимости; выражение «лечь с» сохраняет сексуальный эвфемизм источника.
