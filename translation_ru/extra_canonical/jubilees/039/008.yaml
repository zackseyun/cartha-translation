  source_fidelity: 'В целом перевод точно передаёт смысл геэзского текста: женщина видит отказ Иосифа лечь с нею и обвиняет его перед господином. Однако «хотел принудить меня, чтобы лечь со мной» не вполне удачно передаёт конструкцию: инфинитивная цель относится к предполагаемому принуждению, и по-русски её лучше выразить как «принудить меня лечь с ним».'
  naturalness: '«Раб-еврей» звучит в современном литературном русском неестественно и двусмысленно как сложное социально-этническое обозначение. Естественнее: «твой еврейский раб». Также «чтобы лечь со мной» после «принудить меня» синтаксически тяжеловесно; «принудить меня лечь с ним» ясно выражает ложное обвинение женщины.'
