  yaml_path: translation/extra_canonical/jubilees/039/001.yaml
  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: ru
  text: И жил Иаков в земле, где странствовал его отец, в земле Ханаанской. Вот родословие Иакова. Иосифу было семнадцать лет, когда его отвели в Египет, и Потифар, придворный[a] фараона, начальник стражи, купил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «евнух»; это слово могло также служить титулом придворного или царского чиновника.'
    reason: Сохраняет подлинную лексическую неоднозначность титула и не позволяет русскому основному тексту преждевременно разрешить её.
lexical_decisions:
- source_word: ኀደረ
  choice: жил
  rationale: Передаёт постоянное пребывание Иакова естественным современным русским языком без избыточно архаичного «обитал».
- source_word: ምድረ፡ ፍልሰተ፡ አቡሁ
  choice: в земле, где странствовал его отец
  rationale: Сохраняет смысл земли временного проживания отца и звучит естественнее буквального сочетания «земля странствования его отца».
- source_word: ትዝምደ፡ ያዕቆብ
  choice: родословие Иакова
  rationale: Традиционная формула может обозначать как потомство, так и последующее повествование о семье; «родословие» сохраняет формальный библейский характер.
- source_word: ኅፅዉ
  choice: придворный
  rationale: Титул может буквально обозначать евнуха, но также употребляется в более широком значении царского служащего; в данном контексте выбрано функциональное русское обозначение с сохранением буквальной возможности в сноске.
- source_word: ተሣየጦ / ኅፅዉ (контекст фразы)
  choice: купил его
  rationale: Передаёт завершение сделки и согласуется с представленным контекстом о продаже Иосифа Потифару.
theological_decisions:
- issue: Значение формулы «родословие Иакова»
  choice: Сохранить формулу без пояснительного расширения
  alternative: «Вот история потомков Иакова»
  rationale: Формула намеренно связывает происхождение семьи с последующим повествованием; расширение однозначно истолковало бы её.
- issue: Статус Потифара
  choice: «придворный» со сноской о буквальном значении
  alternative: «евнух» или «служащий»
  rationale: Так сохраняются и придворно-служебный смысл титула, и его возможное буквальное значение, не утверждая без необходимости физическое состояние Потифара.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; формула «Вот родословие Иакова» сохранена как значимый переход к истории семьи.
