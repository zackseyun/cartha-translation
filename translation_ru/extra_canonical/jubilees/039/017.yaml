revisions:
- from: 'И как он истолковал им, так с ними и произошло: начальника виночерпиев фараон вернул к его службе, а пекаря казнил — как и истолковал им Иосиф. Но начальник виночерпиев забыл об Иосифе в темнице, хотя Иосиф сообщил ему, что произойдёт[a], и не вспомнил, что нужно известить фараона о сказанном ему Иосифом, потому что забыл.[b]'
  to: 'И как он истолковал им, так с ними и произошло: начальника виночерпиев фараон вернул к его службе, а пекаря казнил — как и истолковал им Иосиф. Но начальник виночерпиев забыл об Иосифе, оставшемся в темнице, хотя Иосиф сообщил ему, что произойдёт[a], и не вспомнил сообщить фараону о том, что сказал ему Иосиф, потому что забыл.[b]'
  rationale: Уточнено, что в темнице находился Иосиф, а не начальник виночерпиев; слегка выправлена русская фраза о несообщении фараону. Сноска a приведена в соответствие с буквальным значением временного союза исходного текста, при этом контекстуальное «хотя» в переводе сохранено. Маркеры сносок a и b присутствуют и корректно привязаны к поясняемым местам.
