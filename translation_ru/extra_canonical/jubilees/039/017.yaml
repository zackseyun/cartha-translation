  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
translation:
  language: ru
  text: 'И как он истолковал им, так с ними и произошло: начальника виночерпиев фараон вернул к его службе, а пекаря казнил — как и истолковал им Иосиф. Но начальник виночерпиев забыл об Иосифе, оставшемся в темнице, хотя Иосиф сообщил ему, что произойдёт[a], и не вспомнил сообщить фараону о том, что сказал ему Иосиф, потому что забыл.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда он дал ему знать, что произойдёт». По смыслу Иосиф сообщил начальнику виночерпиев о предстоящем; уступительный оттенок в основном тексте передаёт ход повествования.'
    reason: source_clarity
  - marker: b
    text: Последняя часть стиха в дошедшем эфиопском тексте построена неловко. По-видимому, смысл в том, что начальник виночерпиев забыл Иосифа и не рассказал фараону о его истолковании, хотя убедился в его истинности.
    reason: textual_variant
lexical_decisions:
- source_word: ፈከረ
  choice: истолковал
  rationale: Глагол в данном повествовательном контексте обозначает истолкование снов; выбор сохраняет связь между предсказанием Иосифа и его исполнением.
- source_word: ሊቀ፡ መዘርት
  choice: начальник виночерпиев
  rationale: Титул передан привычным и понятным русским библейским выражением, обозначающим старшего придворного виночерпия.
- source_word: አግብኦ ... ውስተ፡ ግብሩ
  choice: фараон вернул к его службе
  rationale: Передаёт восстановление придворного в прежнем служении фараону, не добавляя отсутствующей в тексте конкретики о должности.
- source_word: ቤተ፡ ሞቅሕ
  choice: темница
  rationale: Естественный литературный русский эквивалент буквального «дом уз/заключения».
- source_word: አይድዖ
  choice: Иосиф сообщил ему
  rationale: Передаёт каузативное значение «дал знать, сообщил», а явное имя Иосифа устраняет непреднамеренную русскую местоименную двусмысленность.
