lexical_decisions:
- source_word: ሴሎ፡ አማኒስኬር፡ ጋጋአስ
  choice: Село, Аманискер, Гагаас
  rationale: Имена переданы близкой транслитерацией с геэзского; форма «Аманискер» точнее отражает አማኒስኬር.
- source_word: አስተጋብአ፡ መራዕይሁ
  choice: возвратил свои стада
  rationale: መራዕይሁ связано с пасомым скотом/стадами; контекст допускает более широкое «имущество», но конкретное «стада» сохраняет исходный пастушеский образ.
- source_word: ዐብየ፡ ላዕሌሆሙ
  choice: одолел их
  rationale: Буквально выражение передаёт возвышение или усиление над ними; в данном военном контексте естественное русское соответствие — «одолел их».
- source_word: ሠርዐ፡ ፀባሕተ፡ ላዕሌሆሙ
  choice: обложил данью
  rationale: Передаёт установление обязательной дани над покорёнными людьми.
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: пятую часть урожая своей земли
  rationale: Сочетание обозначает одну пятую плодов/произведений земли; «урожай» звучит естественно и сохраняет сельскохозяйственный смысл.
- source_word: ወሐነጸ
  choice: И он построил…
  rationale: Глагол означает «строить»; фраза обрывается на продолжение, поэтому незавершённость явно обозначена многоточием.
