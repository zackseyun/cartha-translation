  text: And he mourned for Joseph one year and did not cease, for he said, “I will go down to the grave mourning for my son.”
translation:
  language: ru
  text: 'И оплакивал он Иосифа целый год и не переставал, потому что говорил: «Скорбя о сыне моём, сойду я в могилу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сойду в могилу, оплакивая моего сына».'
    reason: В исходной конструкции обстоятельство скорби можно связать с самим нисхождением; вариант отражает иной естественный порядок слов без изменения основного смысла.
lexical_decisions:
- source_word: ይላሑ
  choice: оплакивал
  rationale: Передаёт продолжительное скорбное оплакивание Иосифа в контексте утраты.
- source_word: መቃብር
  choice: могила
  rationale: Основное значение — место погребения; это сохраняет образ нисхождения в могилу, не уточняя его как отвлечённое царство мёртвых.
- source_word: ወአነገሐ
  choice: и не переставал
  rationale: В данном контексте форма передаёт непрекращающееся действие; выбран естественный русский оборот, соответствующий засвидетельствованному смыслу.
theological_decisions:
- issue: Смысл нисхождения в መቃብር
  choice: сойду я в могилу
  alternative: сойду я в преисподнюю
  rationale: Перевод сохраняет телесно-погребальный образ и не вводит более конкретного учения о состоянии умерших, которого данная лексема сама по себе здесь не требует.
translation_notes:
  register: Современный литературный русский с библейской торжественностью; синтаксис сделан ясным, а повтор длительности скорби сохранён.
