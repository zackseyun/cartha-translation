lexical_decisions:
- source_word: ወረዱ
  choice: сошли
  rationale: Сохраняет традиционное пространственное выражение о переселении в Египет, естественное и понятное по-русски.
- source_word: ሱባዔ
  choice: седмина
  rationale: Обозначает семилетний цикл, а не обычную календарную неделю; «седмина» кратко передаёт специальный хронологический смысл.
- source_word: ሰላሞሙ
  choice: благополучны ли
  rationale: Буквально речь идёт о «мире/благополучии» братьев; русская косвенная вопросительная конструкция естественно передаёт цель поручения.
- source_word: እምቤቱ
  choice: из своего дома
  rationale: Передаёт исходный пункт отправления без добавления толкования.
- source_word: ውስተ፡ ምድረ
  choice: в землю
  rationale: Форма «земли/землю» в источнике имеет незавершённое определение «землю [кого/чего]»; в основном тексте сохранена лакуна, поясненная сноской.
