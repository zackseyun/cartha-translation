- from: Сихем, и он нашёл их в земле Дофан. Они вероломно поступили с ним[a] и замыслили убить его, но затем передумали и продали его купцам-измаильтянам. Те отвели его в Египет и продали Потифару — придворному фараона, начальнику стражи[b], жрецу города Илиополя.
  to: В Сихеме он нашёл их. Они поступили с ним коварно[a] и замыслили убить его, но затем передумали, продали его купцам-измаильтянам, увели в Египет и продали Потифару — сановнику фараона, начальнику стражи[b], жрецу города Илиополя.
  rationale: 'Исправлена существенная смена субъекта: все последующие действия после продажи купцам вновь отнесены к братьям. «Придворный» заменён нейтральным «сановник», а начальный фрагмент приведён к естественной русской синтаксической форме. Сохранены исходные должности Потифара и сноска, объясняющая отличие от традиционного варианта «начальник поваров».'
