base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: ru
  text: В Сихеме он нашёл их. Они поступили с ним коварно[a] и замыслили убить его, но затем передумали, продали его купцам-измаильтянам, увели в Египет и продали Потифару — сановнику фараона, начальнику стражи[b], жрецу города Илиополя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вероломно поступили с ним».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых переводах: «начальнику поваров»; однако эфиопский текст буквально говорит о начальнике стражи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐብበይዎ
  choice: Они вероломно поступили с ним
  rationale: Глагол передаёт вероломное, коварное обращение или действие против кого-либо; значение «возненавидели» не соответствует данному корню.
- source_word: ለነጋዲተ እስማዒላዊያን
  choice: купцам-измаильтянам
  rationale: Сохраняет прямое обозначение торговцев и их принадлежность к измаильтянам.
- source_word: ሐፀወ ፈርዖን
  choice: придворному фараона
  rationale: Передаёт придворный статус Потифара без излишне буквального и потенциально вводящего в заблуждение «евнух».
- source_word: ሊቀ ዐቀብት
  choice: начальнику стражи
  rationale: Буквальный смысл эфиопского выражения — глава или начальник стражей; это точнее традиционного чтения «начальник поваров».
- source_word: ሣውዕ ዘሀገረ ኤሌው
  choice: жрецу города Илиополя
  rationale: Сохраняет названный в источнике религиозный титул и греческую форму общеупотребительного топонима.
theological_decisions:
- issue: Статус Потифара
  choice: Все три определения — придворный фараона, начальник стражи и жрец Илиополя — отнесены к Потифару.
  alternative: Считать одно из определений отдельным именованием или согласовать текст с более привычной формой Бытия.
  rationale: Грамматика источника представляет определения последовательно и не даёт оснований устранять необычное сочетание должностей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Начальное «Сихем» сохранено как синтаксическое продолжение предыдущего контекста, поскольку представленный исходный текст начинается именно с этого топонима; отсутствующий глагол не добавлен.
