  source_fidelity: 'Смысловой ход в целом передан верно: братья коварно поступают с Иосифом, замышляют убийство, затем продают его измаильским купцам, а Потифар назван сановником фараона, начальником стражи и жрецом Илиополя. Однако «Те отвели его в Египет» необоснованно меняет субъект: в эфиопском тексте действия «увели в Египет» и «продали Потифару» по-прежнему относятся к братьям, а не к купцам. Для ሐፀወ ፈርዖን нейтральное «сановник фараона» точнее английского audit trail и безопаснее, чем несколько сужающее «придворный».'
  naturalness: Текст в целом литературен. «Вероломно поступили с ним» уместно, хотя «поступили с ним коварно» несколько естественнее в современном русском. Начальное «Сихем, и он нашёл их...» является обрывком синтаксиса, унаследованным от деления контекста; «В Сихеме он нашёл их...» даёт естественную русскую фразу без добавления нового события.
  terminology: «Купцы-измаильтяне», «начальник стражи» и «жрец города Илиополя» передают исходные обозначения адекватно. Сноска о «начальнике поваров» правильно фиксирует известное альтернативное, но не принимает его вопреки ሊቀ ዐቀብት («начальник стражи»).
