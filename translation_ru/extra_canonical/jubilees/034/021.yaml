  yaml_path: translation/extra_canonical/jubilees/034/021.yaml
  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: ru
  text: Женой Вениамина была Иясака. А Симеон передумал[a] и взял себе вторую жену из Месопотамии, как и его братья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскаялся», «пожалел об этом»; глагол может также иметь более общее значение «повернулся, изменил решение».'
    reason: alternative_reading
lexical_decisions:
- source_word: ኢያስካ
  choice: Иясака
  rationale: Имя передано транслитерацией с геэзской формы; это позволяет не смешивать его с иными именами и сохраняет форму источника.
- source_word: ወተመይጠ፡ ስምዖን
  choice: А Симеон передумал
  rationale: Глагольная форма выражает поворот или перемену решения; «передумал» естественно передаёт контекст, не навязывая более узкого нравственно-богословского значения «покаялся».
- source_word: ካልእተ፡ ብእሲተ
  choice: вторую жену
  rationale: Прямо передаёт порядковое значение «другую/вторую жену» в данном контексте.
- source_word: ሜስጶ ጦምያ
  choice: Месопотамии
  rationale: Устоявшееся русское географическое название соответствует форме источника.
- source_word: ከመ፡ አኅዊሁ
  choice: как и его братья
  rationale: Естественная русская передача сравнительной конструкции; частица «и» подчёркивает, что Симеон поступил так же, как братья.
theological_decisions:
- issue: Значение глагола ተመይጠ применительно к Симеону
  choice: передумал
  alternative: раскаялся / пожалел об этом / обратился
  rationale: Источник допускает значения поворота и перемены решения. В контексте последующего брака «передумал» сохраняет смысловую связь и не превращает действие в однозначно религиозное покаяние; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис близок к источнику, но естественен по-русски; смысловая неоднозначность глагола не устранена молча, а вынесена в сноску.
