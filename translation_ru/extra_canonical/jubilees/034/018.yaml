base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: ru
  text: Поэтому сынам Израиля было установлено смирять себя в десятый день седьмого месяца[a] — в тот день, когда весть об Иосифе дошла до Иакова, его отца, — и совершать в этот день искупление за себя посредством козлёнка, в десятый день седьмого месяца, один раз в год, за свои грехи; ведь они опечалили любовь своего отца к его сыну Иосифу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глава связывает ежегодное смирение себя в десятый день седьмого месяца с окровавленной одеждой Иосифа и скорбью Иакова, объясняя тем самым происхождение соблюдения Дня искупления (Йом-Киппура).
    reason: cross_reference
lexical_decisions:
- source_word: ተሠርዐ
  choice: было установлено
  rationale: Передаёт безличное установление обычая или предписания, не уточняя действующее лицо.
- source_word: ይሕመሙ
  choice: смирять себя
  rationale: В контексте ежегодного обряда обозначает самоумаление или воздержание; «смирять себя» сохраняет культовый смысл и не сводит его исключительно к физическому страданию.
- source_word: ዜናሁ፡ ለዮሴፍ
  choice: весть об Иосифе
  rationale: Источник говорит о вести об Иосифе, но прямо не добавляет, что это была весть о его смерти.
- source_word: ያስተስርዩ
  choice: совершать искупление за себя
  rationale: Передаёт ритуальное искупительное действие и сохраняет возвратную направленность исходной конструкции.
- source_word: ጠሊ
  choice: козлёнок
  rationale: Лексема означает молодую козу или козлёнка; данный выбор естественен по-русски и соответствует ритуальному контексту.
- source_word: ምሕረቶ፡ ለአቡሆሙ
  choice: своему отцу, любившему
  rationale: В контексте выражение относится к глубокому отцовскому чувству к Иосифу. Такая формулировка естественно передаёт смысл без неясного буквального «опечалили милость отца».
theological_decisions:
- issue: Связь рассказа об Иосифе с ежегодным днём искупления
  choice: Сохранить заявленную текстом этиологическую связь, не отождествляя её в основном тексте с позднейшим названием праздника.
  alternative: Прямо назвать этот день Йом-Киппуром или Днём искупления.
  rationale: Источник описывает дату, самоумаление и искупление, однако прямое позднейшее наименование в стихе отсутствует; оно уместно только в пояснительной сноске.
- issue: Содержание вести об Иосифе
  choice: «весть об Иосифе»
  alternative: «весть о смерти Иосифа»
  rationale: Исходный текст не формулирует смерть Иосифа как содержание вести, поэтому уточнение создало бы отсутствующее в источнике утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис несколько упрощён ради ясности, но повтор даты сохранён как черта источника. Формулировка «причинили скорбь своему отцу, любившему своего сына Иосифа» передаёт трудную заключительную конструкцию естественно, не превращая отцовское чувство в отдельное абстрактное понятие.
