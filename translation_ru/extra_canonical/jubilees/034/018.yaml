  to: Поэтому сынам Израиля было установлено смирять себя в десятый день седьмого месяца[a] — в тот день, когда весть об Иосифе дошла до Иакова, его отца, — и совершать в этот день искупление за себя посредством козлёнка, в десятый день седьмого месяца, один раз в год, за свои грехи; ведь они опечалили любовь своего отца к его сыну Иосифу.
