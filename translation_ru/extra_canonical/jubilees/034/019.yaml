  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: ru
  text: Их грех состоял в том, что из-за Иосифа, сына их отца, они причинили горе состраданию своего отца.[a] И был установлен этот день, чтобы в него они скорбели о своих грехах, обо всех своих преступлениях и обо всех своих заблуждениях и очищали себя в этот день раз в год.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они опечалили сострадание (или милосердие) своего отца из-за Иосифа, его сына». Необычный образ оригинала сохранён в переводе.'
    reason: Поясняет семантику ምሕረት и отмечает намеренно сохранённую необычность образа.
  - marker: b
    text: Предоставленный фрагмент текста на языке геэз обрывается после слов «и обо всех»; окончание стиха передано по засвидетельствованному полному тексту данной редакции, отражённому в проверочном английском слое.
    reason: Прозрачно отмечает техническую неполноту приведённой исходной цитаты и основание для восстановления окончания.
lexical_decisions:
- source_word: ኃጢአቶሙ
  choice: их грехах / их грех
  rationale: Передаёт религиозно-нравственный смысл «грех»; первое употребление дано в единственном числе по форме и синтаксису, последующее — во множественном.
- source_word: አኅዘኑ
  choice: причинили скорбь
  rationale: 'Сохраняет каузативное значение: братья не просто скорбели, а заставили отца скорбеть.'
- source_word: ምሕረተ፡ አቡሆሙ
  choice: своему милосердному отцу
  rationale: Буквальное «милосердие/сострадание их отца» по-русски неестественно; определение «милосердному» сохраняет ключевой образ без утверждения, будто абстрактное милосердие само испытывает скорбь.
- source_word: ተሠርዐት
  choice: был установлен
  rationale: Передаёт идею предписанного, учреждённого дня, не уточняя без основания человеческого или божественного субъекта установления.
- source_word: ይሕዝኑ
  choice: скорбели
  rationale: Повторяет корень и мотив скорби из первой части стиха, сохраняя связь между скорбью отца и ежегодным покаянным соблюдением.
- source_word: አበሳሆሙ
  choice: своих преступлениях
  rationale: Отличает более конкретные проступки или преступления от общего обозначения грехов.
theological_decisions:
- issue: Характер ежегодного дня очищения
  choice: «был установлен этот день… очищали себя… раз в год»
  alternative: Назвать этот день прямо Днём искупления или указать, что очищение совершает Бог
  rationale: В данном тексте название праздника и субъект очищения прямо не выражены; перевод сохраняет формулировку источника и не вносит дополнительного ритуального или конфессионального толкования.
- issue: Соотношение скорби и очищения
  choice: 'Сохранена последовательность: скорбь о грехах и очищение'
  alternative: Истолковать скорбь как достаточное основание прощения или очищения
  rationale: Текст связывает эти действия, но не разъясняет их богословский механизм; перевод не разрешает эту напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной и культовой речи. Синтаксис сделан естественным для широкого читателя; повтор «в этот день» сохранён ради ритуальной выразительности. Архаизмы и конфессионально маркированные термины не вводились.
