  text: And the sons of Jacob slaughtered a kid of the goats and dipped Joseph’s garment in the blood, and sent it to Jacob their father on the tenth of the seventh month.
translation:
  language: ru
  text: И сыновья Иакова закололи козлёнка, окунули одежду Иосифа в кровь и послали её своему отцу Иакову в десятый день седьмого месяца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘብሑ ዳቤላ ጠሊ
  choice: закололи козлёнка
  rationale: Передаёт жертвенно-бытовой глагол «заколоть» и естественно выражает сочетание со значением «козлёнок»; уточнение «из коз» по-русски избыточно.
- source_word: ወጸንቀቀ ልብሱ ለዮሴፍ በደም
  choice: окунули одежду Иосифа в кровь
  rationale: Глагол обозначает погружение/окунание, а не просто окрашивание; формулировка также сохраняет связь с повествованием Быт 37:31.
- source_word: ፈነዉ ኀበ ያዕቆብ አቡሆሙ
  choice: послали её своему отцу Иакову
  rationale: Местоимение «её» естественно восполняет подразумеваемый объект — одежду — и устраняет неясность без добавления нового содержания.
- source_word: አመ ዐሡሩ ለወርኀ ሳብዕ
  choice: в десятый день седьмого месяца
  rationale: Прямая и идиоматичная передача календарной даты.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза ясная и сдержанно-достоинственная. Имена переданы в привычной русской библейской форме. Смысловой вариант «испачкали/окрасили кровью» не вынесен в примечание, поскольку исходный глагол достаточно определённо указывает на окунание.
