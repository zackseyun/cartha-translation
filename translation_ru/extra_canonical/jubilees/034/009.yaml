  text: Robel and Tamnatares. And he returned in peace and made peace with them, and they became his
translation:
  language: ru
  text: Робел и Тамнатарес. Он возвратился с миром, заключил с ними мир, и они стали принадлежать ему[a].
  philosophy: optimal-equivalence
  footnotes:
