lexical_decisions:
- source_word: ወተመይጠ፡ በሰላም
  choice: Он возвратился с миром
  rationale: Передаёт значение возвращения и обстоятельство мира без утяжеления синтаксиса.
- source_word: ወገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: заключил с ними мир
  rationale: Естественный современный русский эквивалент буквального «сделал с ними мир».
- source_word: ወኮንዎ
  choice: и они стали принадлежать ему
  rationale: Форма содержит местоименный объект третьего лица мужского рода единственного числа; перевод сохраняет отношение к нему, не подставляя отсутствующее в стихе существительное вроде «слуги» или «подданные».
theological_decisions:
- issue: Не названо новое положение тех, кто «стал ему/его»
  choice: 'Передать нейтрально: «стали принадлежать ему»'
  alternative: «стали его подданными» или «стали его слугами»
  rationale: Источник выражает отношение к нему, но не называет здесь конкретного статуса; нейтральная формулировка не устраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. Имена переданы по принятой в консультационном слое транслитерации; эллиптичность последней фразы разъяснена в сноске без добавления конкретного социального статуса.
