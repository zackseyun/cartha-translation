- from: 'И он оплакивал его всю ту ночь, потому что вечером ему принесли эту одежду. От скорби о его смерти его охватил жар, и он сказал: «Дикий зверь растерзал Иосифа». И в тот день все домашние плакали вместе с ним; весь тот день они скорбели и плакали вместе с ним.'
