  yaml_path: translation/extra_canonical/jubilees/034/013.yaml
  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: ru
  text: 'И он оплакивал его всю ту ночь, потому что вечером ему принесли эту одежду. От горя о его смерти его охватила горячка, и он сказал: «Дикий зверь пожрал Иосифа». В тот день все его домочадцы плакали вместе с ним; весь тот день они скорбели и плакали вместе с ним.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይላሐዉ / ላሐዉ
  choice: оплакивал / плакали
  rationale: Передаёт скорбный плач по предполагаемому умершему; современное русское выражение сохраняет траурный смысл.
- source_word: አርዌ፡ ጸዋገ
  choice: дикий зверь
  rationale: Сочетание обозначает дикого, хищного зверя; формулировка естественна по-русски и не уточняет вид животного.
- source_word: በልዖ
  choice: растерзал
  rationale: Буквально глагол означает «съел, пожрал», но в контексте гибели от дикого зверя «растерзал» звучит естественно и сохраняет смысл, не вводя лишних подробностей.
- source_word: ሰብአ፡ ቤቱ
  choice: все домашние
  rationale: Идиоматично передаёт людей дома Иакова — его домочадцев, а не здание или только кровных родственников.
- source_word: የሐምሙ
  choice: скорбели
  rationale: В данном контексте глагол выражает страдание и горе; «скорбели» естественно сочетается с последующим «плакали».
theological_decisions:
- issue: Утверждение Иакова о смерти Иосифа
  choice: 'сохранено как уверенное высказывание персонажа: «Дикий зверь растерзал Иосифа»'
  alternative: 'добавить указание на предположение: «Наверное, дикий зверь…»'
  rationale: Источник передаёт прямое заключение Иакова без модального смягчения; перевод не должен исправлять его ошибочное убеждение на основании дальнейшего повествования.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Повтор слов о скорби и плаче сохранён, поскольку он присутствует в источнике и подчёркивает продолжительность общего траура. «Эту одежду» эксплицирует подразумеваемый предмет из ближайшего контекста и устраняет неестественную для отдельного русского стиха неопределённость местоимения.
