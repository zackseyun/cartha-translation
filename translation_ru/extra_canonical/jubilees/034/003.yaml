translation:
  language: ru
  text: под деревьями и захватить их скот. Но Иаков, Левий, Иуда и Иосиф находились в доме у своего отца Исаака, потому что дух его был опечален, и они не могли оставить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይማህርኩ፡ እንስሳሆሙ
  choice: захватить их скот
  rationale: Передаёт действие по отношению к чужому скоту в соответствии с контекстом набега и засвидетельствованным пониманием эфиопского текста; «скот» естественнее общего «животные» в данном контексте.
- source_word: ሀለዉ፡ ውስተ፡ ቤት
  choice: находились в доме
  rationale: Нейтральная современная передача конструкции существования/местонахождения без излишней буквальности.
- source_word: ኖንዝና፡ መንፈሱ
  choice: дух его был опечален
  rationale: Сохраняет прямое упоминание духа и выражает глубокую внутреннюю скорбь достойным литературным языком.
- source_word: ወስእኑ፡ ኀዲጎተ
  choice: и они не могли оставить его
  rationale: Прямо передаёт невозможность оставить Исаака; местоимение сохранено, поскольку его референт ясен из контекста.
theological_decisions:
- issue: Значение слова «дух» в описании состояния Исаака
  choice: Сохранено буквальное «дух его был опечален»
  alternative: «он глубоко скорбел»
  rationale: Более свободный вариант был бы естественнее, но устранил бы антропологическую формулировку источника и тем самым преждевременно истолковал её.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальная строчная буква сохранена, поскольку стих начинается продолжением предложения из предыдущего стиха. Перечень имён оформлен естественно для русского языка без многократного союза «и».
