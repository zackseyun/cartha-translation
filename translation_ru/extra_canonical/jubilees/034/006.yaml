  rationale: Сохраняет последовательность исходного выражения и при этом звучит естественно по-русски.
- source_word: ወኵሎሙ ደቂ አቡሁ ወደቂ ቤቱ
  choice: со всеми слугами своего отца и слугами своего дома
  rationale: Сохраняет две отдельные группы, засвидетельствованные источником, не объединяя их в одну.
- source_word: ወሖረ ላዕሌሆሙ
  choice: выступил против них
  rationale: В военном контексте выражение обозначает движение против противника, а не просто приближение к нему.
- source_word: በስሳ [ምእት]
  choice: с шестью тысячами человек
  rationale: Следует восстановленному чтению «шестьдесят сотен», то есть шесть тысяч; слово «человек» добавлено по-русски для ясности состава войска.
