  language: ru
  text: «Они окружили твоих сыновей и захватили их стада». Тогда он поднялся и вышел из своего дома вместе с тремя своими сыновьями, со всеми слугами своего отца и слугами своего дома и выступил против них с шестью тысячами человек.[a]
