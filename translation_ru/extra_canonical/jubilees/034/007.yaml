lexical_decisions:
- source_word: ምእት፡ ዕደ
  choice: шесть тысяч
  rationale: Передаёт указанное в источнике числительное; начало стиха синтаксически продолжает предшествующий контекст.
- source_word: እለ፡ ይጸውሩ፡ አበይፍተ
  choice: человек, носивших оружие
  rationale: Естественная русская передача причастного оборота о вооружённых людях; «оружие» сохраняет обобщённое значение.
- source_word: በውስተ፡ ጸአተ፡ ዘሴቄም
  choice: на спуске от Сихема
  rationale: ጸአተ означает выход или схождение и в данном топографическом контексте указывает на спуск, а не на равнину; предлог «от» естественно выражает движение вниз от Сихема, но направление допускает иную трактовку.
- source_word: በአፈ፡ ሰይፍ
  choice: остриём меча
  rationale: Формально сохраняет образ «уста/край меча» в понятном современном русском выражении.
- source_word: አሬስ፡ ወለታፉ፡ ወለሴሬጋን
  choice: Ареса, Тафу и Серагана
  rationale: Имена транслитерированы в соответствии с формами геэзского текста и поставлены в винительный падеж.
