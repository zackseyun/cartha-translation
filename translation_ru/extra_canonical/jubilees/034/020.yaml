base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: ru
  text: После того как Иосиф исчез, сыновья Иакова взяли себе жён. Жену Рувима звали Ада, а жену Симеона — Адива, хананеянка; жену Левия звали Мелка, она была из дочерей Арама, из рода сыновей Фарры; жену Иуды звали Бетасуэл, хананеянка; жену Иссахара звали Хезека; жену Завулона — Ниаман; жену Дана — Эгла; жену Неффалима — Расуа, из Месопотамии; жену Гада — Мака; жену Асира — Ийона; жену Иосифа — Асенефа, египтянка; а жену Вениамина звали Иясака.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐጕለ ዮሴፍ
  choice: Иосиф исчез
  rationale: Форма передаёт утрату или исчезновение Иосифа с точки зрения семьи; «исчез» сохраняет эту перспективу и не уточняет способ его удаления вопреки формулировке источника.
- source_word: ነሥኡ ... አንስትያ
  choice: взяли себе жён
  rationale: Естественная русская передача идиомы «взяли женщин/жён» в значении вступления в брак.
- source_word: እምዘርአ
  choice: из рода
  rationale: Буквально «из семени»; в генеалогическом контексте современное русское «из рода» ясно передаёт происхождение.
- source_word: ከናዊት / ከነናዊት
  choice: хананеянка
  rationale: Употреблена общепринятая русская библейская форма этнонима женского рода.
- source_word: ሜስጶጦምያ
  choice: Месопотамия
  rationale: Сохранено прямо названное в эфиопском тексте географическое обозначение.
- source_word: አስኔት
  choice: Асенефа
  rationale: Выбрана укоренившаяся русская библейская форма имени, соответствующая Асенат/Аснет.
theological_decisions:
- issue: Характер исчезновения Иосифа
  choice: «После того как Иосиф исчез»
  alternative: «После того как Иосиф был уведён» или «был продан»
  rationale: Перевод не вводит более конкретного объяснения, чем допускает эфиопская формулировка, и сохраняет повествовательную перспективу его семьи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повторяющуюся формулу «имя жены…» после первого предложения умеренно сокращено до естественного «жену… звали» и тире, без потери сведений. Для общеизвестных библейских лиц использованы традиционные русские формы имён; менее известные имена переданы близко к эфиопскому звучанию.
