  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: ru
  text: И в шестой год этой седмины сорок четвёртого юбилея Иаков послал своих сыновей пасти их овец, а вместе с ними — их слуг, на пастбище Сихема.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: седмина
  rationale: Передаёт семилетнюю календарную единицу книги Юбилеев и отличает её от обычной недели.
- source_word: ይርዐዩ፡ አባግዒሆሙ
  choice: пасти их овец
  rationale: Сохраняет глагольное значение «пасти» и местоименный суффикс 3-го лица множественного числа «их».
- source_word: አግብርቲሆሙኒ
  choice: и их слуг
  rationale: 'Суффикс -ሆሙ указывает на множественное число: слуги принадлежат сыновьям, а не Иакову.'
- source_word: ውስተ፡ ጸአተ፡ ሴቄም
  choice: на пастбище близ Сихема
  rationale: Передаёт единственное число «пастбище»; «близ» естественно выражает связь пастбища с местностью Сихема без чрезмерной конкретизации.
