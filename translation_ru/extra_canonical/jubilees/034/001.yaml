revisions:
- from: И в шестой год этой седмины, в сорок четвёртый юбилей, Иаков послал своих сыновей пасти их овец, и их слуг[a] — вместе с ними, на пастбище близ Сихема.
  to: И в шестой год этой седмины сорок четвёртого юбилея Иаков послал своих сыновей пасти их овец, а вместе с ними — их слуг, на пастбище Сихема.
