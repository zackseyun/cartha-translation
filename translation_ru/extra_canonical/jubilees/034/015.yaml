  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: ru
  text: В тот день Валла услышала, что Иосиф погиб. Оплакивая его, она умерла в Кафратефе[a]. После гибели Иосифа умерла и Дина, дочь Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чтение и огласовка названия «Кафратеф» не вполне надёжны; возможно, в эфиопской рукописной традиции этот топоним был искажён.
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕለ
  choice: погиб
  rationale: Глагол передаёт утрату или гибель; в контексте ложного известия о смерти Иосифа естественно русское «погиб», не уточняющее способ смерти.
- source_word: ትለሐዎ
  choice: оплакивая его
  rationale: Причастная конструкция естественно передаёт продолжавшийся плач по Иосифу, во время которого умерла Валла.
- source_word: ቀፍራቲፍ
  choice: Кафратеф
  rationale: Топоним передан транслитерацией с учётом принятой формы; его точное чтение и отождествление неизвестны.
- source_word: ዳኖኒ
  choice: Дина
  rationale: Использована традиционная русская форма библейского имени.
theological_decisions:
- issue: Чей дочерью названа Дина в выражении ወለቱ («его дочь»)
  choice: Сохранено «его дочь» без явного уточнения референта.
  alternative: «дочь Иакова»
  rationale: Эфиопский текст содержит местоименное указание, но прямо не называет Иакова в данном предложении. Хотя по повествованию речь о дочери Иакова, перевод не должен незаметно устранять формальную неоднозначность.
