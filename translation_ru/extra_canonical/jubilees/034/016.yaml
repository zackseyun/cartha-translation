  text: And these three mournings came upon Israel in one month. And they buried Bilhah opposite Rachel's tomb, and they buried Dinah, his daughter, there.
translation:
  language: ru
  text: И эти три скорби постигли Израиля за один месяц. Валлу похоронили напротив гробницы Рахили, и там же похоронили Дину, его дочь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠለስቱ፡ ላህ
  choice: три горя
  rationale: В данном контексте речь идёт о трёх тяжёлых утратах, постигших Израиля; «горя» естественно передаёт смысл, не сводя выражение лишь к действиям скорби.
- source_word: በወርኀ፡ አሐዱ
  choice: в один месяц
  rationale: Формально и естественно передаёт указание на то, что три события произошли в пределах одного месяца.
- source_word: አንጻረ፡ መቃብረ፡ ራሔል
  choice: напротив гробницы Рахили
  rationale: Сохраняет пространственное отношение исходного текста и традиционную форму имени.
- source_word: ህየ
  choice: там же
  rationale: Ясно связывает место погребения Дины с только что названным местом погребения Валлы.
