    issue: Избыточное «все» в выражении «все эти три горя».
    rationale: В оригинале и английском аудите имеется указание на «эти три» скорби, но добавление «все» по-русски не требуется и ухудшает плавность фразы.
  revised_text: И эти три скорби постигли Израиля за один месяц. Валлу похоронили напротив гробницы Рахили, и там же похоронили Дину, его дочь.
