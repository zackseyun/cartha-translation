    rationale: Сноска о последовательности имён в ст. 4–8 присоединена к «Маанисакира», хотя английский POB audit trail помещает соответствующий маркер после «младший» (youngest[4]). Якорь следует перенести, не создавая впечатления, что примечание относится только к одному имени.
  - severity: low
    issue: «Остался при отце» менее прямое соответствие конструкции «был/оставался с отцом».
    rationale: Замена на «остался с отцом» сохраняет смысл и делает фразу более естественной для современного литературного русского.
