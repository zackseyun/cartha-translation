  to: И о субботах земли Я рассказал тебе на горе Синай, и о годах юбилеев Я рассказал тебе среди суббот лет; но о самом этом годе Я не рассказывал тебе до времени, когда вы войдёте в землю, которой вам предстоит овладеть.
