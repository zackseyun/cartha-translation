base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: ru
  text: И о субботах земли Я рассказал тебе на горе Синай, и о годах юбилеев Я рассказал тебе среди суббот лет; но о самом этом годе Я не рассказывал тебе до времени, когда вы войдёте в землю, которой вам предстоит овладеть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: субботах земли
  rationale: Сохраняет образ и терминологию земельного субботнего покоя, не сводя выражение пояснительно к «субботним годам».
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: годах юбилеев
  rationale: Формально передаёт множественное число исходного выражения и сохраняет связь с юбилейными циклами.
- source_word: ውስተ፡ ሰንበታተ፡ ዓመታት
  choice: в связи с субботами лет
  rationale: Предлог допускает пространственно-системное значение «среди/в рамках»; по-русски «в связи с» естественно выражает включение юбилейного счёта в систему семилетий без чрезмерного толкования.
- source_word: ዓመተሰ
  choice: об их юбилейном годе
  rationale: Местоименная отсылка буквально неоднозначна («об этом/его годе»), но по контексту относится к году юбилеев; слово «юбилейном» делает русскую фразу понятной, сохраняя референт.
- source_word: ትእኅዙ
  choice: должны овладеть
  rationale: Передаёт значение вступления во владение, а не просто проживания или получения.
theological_decisions:
- issue: Референт выражения «его/их год»
  choice: их юбилейном годе
  alternative: его годе / этом годе
  rationale: Контекст связывает год с ранее названными юбилеями. Уточнение необходимо для естественного русского текста, но не добавляет конфессионального толкования.
- issue: Число адресата при входе в землю
  choice: вы войдёте
  alternative: ты войдёшь
  rationale: Геэзская форма ትበውኡ указывает на множественного адресата, то есть Моисея вместе с народом либо народ как коллектив; это отличие сохраняется, несмотря на предшествующее единственное «тебе».
translation_notes:
  register: Современный литературный русский с достоинством древнего наставительного повествования. Заглавная буква в «Я» указывает на божественного говорящего согласно русской издательской традиции. Синтаксический параллелизм исходника сохранён, но тяжеловесные буквальные конструкции слегка сглажены.
