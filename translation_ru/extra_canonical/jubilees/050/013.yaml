- from: И человек, который сделает что-либо из этого в день субботний, да будет предан смерти, чтобы сыны Израиля соблюдали субботы земли согласно заповедям, как написано на скрижалях, которые Он дал мне в руки, чтобы я записал для тебя законы каждого установленного времени по разделениям его дней.
  to: И человек, который сделает что-либо из этого в день субботний, да будет предан смерти, чтобы сыны Израиля соблюдали субботы земли в соответствии с предписаниями о них, как написано на скрижалях, которые Он дал мне в руки, чтобы я записал для тебя законы каждого установленного времени по разделениям его дней.
  rationale: 'Заменено только построение в середине стиха: «в соответствии с предписаниями о них» одновременно передаёт нормативное значение በከመ («согласно, в соответствии с») и связь ትእዛዛተ с «субботами земли», не превращая заповеди в прямой объект глагола «соблюдать». Остальные решения сохранены, включая множественное «законы» и намеренно буквальную, не истолковывающую календарную формулу.'
