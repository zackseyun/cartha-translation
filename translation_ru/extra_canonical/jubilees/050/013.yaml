base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: ru
  text: И человек, который сделает что-либо из этого в день субботний, да будет предан смерти, чтобы сыны Израиля соблюдали субботы земли в соответствии с предписаниями о них, как написано на скрижалях, которые Он дал мне в руки, чтобы я записал для тебя законы каждого установленного времени по разделениям его дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰብእ፡ ዘይገብር፡ ኵሎ፡ ዘእምዝ
  choice: И человек, который сделает что-либо из этого
  rationale: Передаёт начальный союз, обобщённое обозначение человека и отсылку к перечисленным ранее запрещённым действиям.
- source_word: በዕለተ፡ ሰንበት
  choice: в день субботний
  rationale: Естественное для современного литературного русского языка выражение, сохраняющее значение конкретного субботнего дня.
- source_word: ይሙት
  choice: да будет предан смерти
  rationale: В контексте правовой санкции форма выражает предписание смертной казни, а не только прогноз естественной смерти.
- source_word: እንዘ፡ ይዕቀቡ፡ በከመ፡ ትእዛዛተ፡ ሰንበታት፡ ምድር
  choice: чтобы сыны Израиля соблюдали субботы земли согласно заповедям
  rationale: Сохраняет በከመ как указание на норму — «согласно», а «субботы земли» как объект соблюдения; это избегает превращения заповедей в прямое дополнение.
- source_word: ጽላት
  choice: скрижалях
  rationale: Традиционный и понятный русский эквивалент для небесных таблиц в литературе Второго храма.
- source_word: ሕገገ፡ ጊዜ፡ ወጊዜ
  choice: законы каждого установленного времени
  rationale: Множественное «законы» отражает форму ሕገገ; удвоенное выражение времени передано распределительным «каждого установленного времени».
- source_word: በበ፡ ክፍሌ፡ መዋዕሊሁ
  choice: по разделениям его дней
  rationale: Сохраняет распределительное значение и образ деления дней без излишнего истолкования календарной системы.
theological_decisions:
- issue: Кто дал скрижали говорящему
  choice: Он дал мне
  alternative: он дал мне
  rationale: Заглавная буква уместно обозначает Бога как подразумеваемого деятеля в ближайшем контексте, не добавляя имени или титула, отсутствующего в тексте.
- issue: Смысл выражения о соблюдении суббот и заповедей
  choice: соблюдали субботы земли согласно заповедям
  alternative: соблюдали заповеди о субботах земли
  rationale: 'Выбранный вариант сохраняет синтаксическое различие исходного текста: субботы соблюдаются по установленным заповедям; альтернативный вариант делает «заповеди» прямым объектом.'
- issue: Характер санкции ይሙት
  choice: да будет предан смерти
  alternative: умрёт
  rationale: Правовой контекст поддерживает предписанную казнь, но формулировка не уточняет исполнителя и не добавляет способ наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены начальный союз, правовая строгость, выражение «субботы земли» и неоднозначная календарная формула в конце.
