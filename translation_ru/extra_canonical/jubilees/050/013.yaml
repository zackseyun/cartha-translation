  source_fidelity: 'Основной смысл передан верно: начальный союз, обобщённое «человек», правовая санкция, ссылка на скрижали, множественное «законы» и заключительная календарная формула сохранены. Однако связь «согласно заповедям» в исходнике относится к предписаниям о субботах земли, а не просто к неопределённым заповедям; это следует сделать явным по-русски.'
