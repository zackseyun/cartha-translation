  terminology: '«Скрижали», «сыны Израиля», «субботы земли» и «законы» выбраны удачно. Множественное число «законы» необходимо сохранять: ሕገገ — множественная форма. Заглавное «Он» допустимо в данном контексте, где подразумеваемый податель скрижалей — Бог.'
