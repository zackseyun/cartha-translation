lexical_decisions:
- source_word: ትእዛዘ
  choice: заповедь
  rationale: Передаёт религиозно-правовой смысл повеления и соответствует возвышенному, но понятному библейскому регистру.
- source_word: ሰንበታትኒ
  choice: о субботах
  rationale: Сохранено множественное число источника; частица при слове естественно передана связью с существительным «заповедь».
- source_word: ፍትሓተ
  choice: установления
  rationale: В данном правовом контексте слово обозначает нормативные решения или предписания; «установления» звучит естественнее и шире, чем узкое «судебные решения».
- source_word: ሕገጊሁ
  choice: её законов
  rationale: Сохранены множественное число «законов» и местоименная отсылка, вероятнее всего относящаяся к субботе как установлению.
theological_decisions:
- issue: Число существительного в ሕገጊሁ
  choice: 'множественное: «законов»'
  alternative: 'единственное: «закона»'
  rationale: Форма источника поддерживает множественное число; это также сохраняет внутреннюю сложность совокупности субботних предписаний.
- issue: Референт местоименного суффикса в ሕገጊሁ
  choice: 'женский род: «её», с подразумеваемой субботой'
  alternative: 'мужской род: «его», с отсылкой к повелению или закону'
  rationale: По смыслу ближайшей тематической отсылкой служит суббота; русский женский род позволяет выразить это естественно, хотя грамматический референт в геэзском не полностью воспроизводим.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Начальное «И вот» сохраняет дискурсивный сигнал источника; синтаксис сделан ясным без устранения правовой плотности выражения.
