base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: ru
  text: Только это дело пусть совершается в субботние дни в святилище ГОСПОДА, Бога вашего, чтобы совершалось искупление за Израиль постоянным приношением, изо дня в день, для памятования, угодного[a] пред ГОСПОДОМ; и Он примет их навеки, изо дня в день, как тебе было заповедано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приемлемого».'
    reason: Сохраняет допустимый оттенок культовой приемлемости у ዘይሠጠው наряду с основным «угодного».
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: Только это дело
  rationale: Передаёт как ограничительное ባሕቲቱ «только», так и выраженный существительным ግብር смысл «дело, работа», не сводя фразу к одному указательному местоимению.
- source_word: በቤተ፡ መቅደሱ
  choice: в святилище
  rationale: Естественный русский эквивалент буквального «в доме Его святилища»; контекст указывает на храмовое святилище.
- source_word: ያስተስርዩ፡ ዲበ፡ እስራኤል
  choice: пусть там совершают искупление за Израиль
  rationale: Каузативная форма передаёт ритуальное совершение искупления; «за Израиль» естественно выражает направленность обряда.
- source_word: መባአ፡ ወትረ
  choice: постоянным приношением
  rationale: Сохраняет существительное መባአ «приношение, дар», отсутствовавшее в более кратком варианте, и наречное ወትረ «постоянно».
- source_word: ለተዝካር
  choice: как памятное приношение
  rationale: Передаёт культовый смысл «для памятования / как напоминание» в естественной русской форме и связывает его с приношением.
- source_word: ዘይሠጠው፡ ቅድመ፡ እግዚአብሔር
  choice: угодное пред ГОСПОДОМ
  rationale: Глагол ሠጠወ здесь означает «быть угодным, приемлемым», а не «давать»; формула сохраняет сакральный регистр.
- source_word: ወይትወከፎሙ
  choice: и Он будет принимать их
  rationale: Местоименный суффикс множественного числа сохранён без преждевременного устранения неоднозначности его референта.
theological_decisions:
- issue: Характер искупления
  choice: совершают искупление за Израиль постоянным приношением
  alternative: умилостивляют за Израиль
  rationale: «Совершать искупление» сохраняет ритуально-богословскую широту исходного выражения и не навязывает узкую теорию умилостивления.
- issue: Референт местоимения в «Он будет принимать их»
  choice: сохранить множественное «их»
  alternative: Он будет принимать приношения / принимать Израиль
  rationale: Исходный суффикс допускает вопрос о том, относится ли он к людям либо к приношениям; перевод не должен молча разрешать эту неоднозначность.
- issue: Имя Бога
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Передаёт традиционную форму, представленную эфиопским እግዚአብሔር, не реконструируя в основном тексте не выраженное там напрямую тетраграмматическое произношение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формы «пред» и «вовеки» оставлены ради достоинства и ритма, но синтаксис сделан понятным современному читателю. Повтор «изо дня в день» сохранён, поскольку он присутствует в источнике дважды.
