base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: ru
  text: И юбилеи будут проходить, пока Израиль не очистится от всякой вины — блуда, нечистоты, осквернения, греха и заблуждения — и не будет жить в безопасности по всей земле. И не будет больше у него ни сатаны, ни какого-либо злого, а земля с того времени будет чиста навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤሌዎታት
  choice: юбилеи
  rationale: Сохраняет специальное обозначение юбилейных периодов и связь с названием книги.
- source_word: የኃልፉ
  choice: будут проходить
  rationale: Передаёт течение или последовательное минование юбилейных периодов без добавочного толкования.
- source_word: አበሳ
  choice: вина
  rationale: В данном перечислении обозначает нравственную виновность; оборот «от всякой вины» естественен по-русски.
- source_word: ዝሙት
  choice: блуд
  rationale: Традиционный и точный термин для сексуальной распущенности в библейском регистре.
- source_word: ርኵስ
  choice: нечистота
  rationale: Сохраняет широкую нравственно-ритуальную семантику исходного слова.
- source_word: ግማኔ
  choice: осквернение
  rationale: Отличает этот член ряда от «нечистоты» и передаёт идею загрязнения или скверны.
- source_word: ጌጋይ
  choice: заблуждение
  rationale: Сохраняет значение ошибки или уклонения, не сводя его непременно к умышленному греху.
- source_word: ይትአመን
  choice: поселится в безопасности
  rationale: Контекст проживания на земле требует сочетания идеи обитания с состоянием уверенности и защищённости.
- source_word: ሰይጣነ
  choice: сатана
  rationale: Сохраняет исходный термин без преждевременного решения, является ли он именем собственным или обозначением противника.
- source_word: እኩየ
  choice: злодей
  rationale: Передаёт субстантивированное «злой/дурной» применительно к лицу и не отождествляет его автоматически с сатаной.
theological_decisions:
- issue: Статус слова «сатана»
  choice: 'строчная буква: «сатаны»'
  alternative: «Сатаны» как личное имя
  rationale: Исходная форма допускает значение противника или сатаны; строчная буква сохраняет эту неоднозначность и не навязывает исключительно персональное прочтение.
- issue: Объём очищения Израиля
  choice: «от всякой вины — от блуда…»
  alternative: «от всей вины блуда…»
  rationale: Пунктуация показывает перечисление видов виновности или скверны, не утверждая, что все последующие понятия грамматически зависят только от блуда.
- issue: Безопасность Израиля на земле
  choice: «поселится в безопасности по всей земле»
  alternative: «будет уверенно жить на всей земле»
  rationale: Выбранный вариант сохраняет одновременно пространственную идею обитания и состояние защищённости, не уточняя политический или эсхатологический механизм.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Перечень сохранён без упрощения, а синтаксис разбит на два предложения для ясности. Местоимение «у него» согласовано с единственным числом собирательного имени «Израиль».
