base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: ru
  text: И человек, который совершит в этот день какую-либо работу, умрёт. Всякий, кто осквернит этот день, или ляжет с женщиной, или скажет, что совершит в этот день какое-либо дело, чтобы вести торговлю, связанную с какой бы то ни было покупкой или продажей[a], или наберёт в этот день воды, которую он не приготовил для себя в шестой день, или поднимет какую-либо ношу, чтобы вынести её из своего шатра или из своего дома, — умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скажет [слово/о деле], что совершит в этот день дело, чтобы вести торговое дело относительно всякой купли и продажи». Синтаксис геэзской фразы труден: связь между «делом», намерением совершить его и торговой формулой допускает несколько оттенков.'
    reason: Примечание отмечает синтаксическую трудность, не устраняя выраженное в тексте указание на заявление о намерении.
lexical_decisions:
- source_word: ግብረ
  choice: работу
  rationale: В контексте субботних запретов слово обозначает совершаемую работу или дело; «работа» ясно и естественно передаёт основной смысл.
- source_word: ይፄምና
  choice: осквернит
  rationale: Глагол передаёт нарушение святости дня; «осквернит» сохраняет религиозно-нравственный оттенок исходного текста.
- source_word: ይስክብ፡ ምስለ፡ ብእሲት
  choice: ляжет с женщиной
  rationale: Сохранён прямой библейский эвфемизм половой близости без усиления или конфессионального истолкования.
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: покупкой или продажей
  rationale: Парная торговая формула передана конкретно и симметрично, без добавления более широкого понятия торговли.
- source_word: ማየ፡ ይቀድሕ
  choice: наберёт … воды
  rationale: Естественный русский эквивалент действия черпания или набора воды.
- source_word: ዘይጸውር
  choice: ношу
  rationale: В данном запрете слово обозначает переносимый груз; «ноша» сохраняет общий смысл без уточнения размера или вида предмета.
- source_word: ደብተራሁ
  choice: своего шатра
  rationale: Передаёт жилище типа палатки или шатра и сохраняет различие со следующим словом «дом».
theological_decisions:
- issue: Формула смертной кары
  choice: умрёт
  alternative: да будет предан смерти
  rationale: Исходный глагол прямо означает «умрёт»; перевод не уточняет исполнителя или юридический способ смерти, которых текст здесь не называет.
- issue: Осквернение субботнего дня
  choice: сохранено общее «осквернит этот день»
  alternative: нарушит субботу
  rationale: Общая сакральная формулировка источника сохранена без сведения её только к юридическому нарушению конкретного перечня.
- issue: Торговая деятельность
  choice: заняться покупкой или продажей
  alternative: вести всякую торговлю
  rationale: Перевод сохраняет две названные разновидности сделки и не расширяет формулировку до любого мыслимого вида коммерческой деятельности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Длинное перечисление источника сохранено, однако пунктуация и повтор «в этот день» делают границы запретов ясными. Форма «умрёт» употреблена последовательно и без архаизации.
