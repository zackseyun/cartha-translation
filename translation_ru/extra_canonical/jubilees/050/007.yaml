  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: ru
  text: Шесть дней совершайте свои дела, а седьмой день — суббота Господа, вашего Бога. Не совершайте в этот день никакого дела — ни вы, ни ваши дети, ни ваши рабы, ни ваши рабыни, ни весь ваш скот, ни живущий у вас чужеземец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትገብር፡ ግብረ
  choice: совершайте свои дела
  rationale: Передаёт сочетание глагола «делать» с существительным «дело/работа» естественным современным русским языком без сужения смысла до наёмного труда.
- source_word: ውሉድክሙ
  choice: ваши дети
  rationale: Множественное «дети, потомство» здесь шире, чем «сыновья», и соответствует контексту субботней заповеди.
- source_word: አግብርቲክሙ፡ ወአእማቲክሙ
  choice: ваши рабы, ни ваши рабыни
  rationale: Сохраняет социально-правовой смысл исходных обозначений мужчин и женщин в рабском служении, не смягчая историческую реалию словом «слуги».
- source_word: ኵሉ፡ እንስሳክሙ
  choice: весь ваш скот
  rationale: В данном перечне домашних зависимых существ русское «скот» естественно передаёт совокупность принадлежащих адресатам животных.
- source_word: ነኪርኒ፡ ዘኀቤክሙ
  choice: живущий у вас чужеземец
  rationale: Передаёт не просто незнакомца, а иноплеменного пришельца, находящегося среди общины; «живущий у вас» естественно выражает относительную конструкцию.
theological_decisions:
- issue: Принадлежность субботы
  choice: суббота Господа, вашего Бога
  alternative: суббота для Господа, вашего Бога
  rationale: 'Родительная конструкция сохраняет формальную неоднозначность: день принадлежит Господу и посвящён Ему; предлог «для» излишне уточнял бы отношение.'
translation_notes:
  register: Современный литературный русский язык с достоинством формулировки заповеди. Повтор «совершайте / не совершайте» сохраняет лексическую связь положительной и отрицательной частей исходного текста; перечисление оформлено русской конструкцией «ни … ни».
