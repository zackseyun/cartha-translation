base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: ru
  text: И всякий человек, который в этот день работает, или отправляется в путь, или возделывает своё поле у себя дома или в любом другом месте, или разводит огонь, или едет верхом на каком-либо животном, или плывёт на корабле по морю, или бьёт либо убивает что-либо, или закалывает животное или птицу, или ловит дикого зверя, птицу либо рыбу, или постится, или ведёт войну в субботний день —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: работает
  rationale: Передаёт общее значение совершаемой работы в перечне запрещённых в субботу действий, не сужая его до конкретного ремесла.
- source_word: ወፍረ
  choice: своё поле
  rationale: Слово обозначает поле или возделываемый участок; «поле» точнее и естественнее, чем более широкое «хозяйство».
- source_word: ያነድድ፡ እሳተ
  choice: разводит огонь
  rationale: Естественная русская передача действия зажигания огня в бытовом контексте.
- source_word: ይጾውም
  choice: постится
  rationale: Сохраняет прямо выраженное и контекстуально неожиданное упоминание поста, не пытаясь истолковать или устранить его.
- source_word: ይገብር፡ ጸብአ
  choice: ведёт войну
  rationale: Передаёт устойчивое значение сочетания «совершать войну/сражение» современным литературным русским выражением.
theological_decisions:
- issue: Неожиданное включение поста в перечень запрещённых субботних действий
  choice: Сохранено прямое «постится»
  alternative: Истолковать как иной вид воздержания или исправить по контексту
  rationale: Эфиопский текст явно содержит глагол поста; богословское и правовое напряжение следует сохранить, а не сглаживать.
- issue: Незавершённость синтаксиса стиха
  choice: Сохранена завершающая запятая с тире
  alternative: Завершить фразу точкой или самостоятельно добавить наказание
  rationale: Стих представляет условную/подлежащную часть конструкции, продолжение которой находится далее; добавление отсутствующего содержания исказило бы границу стиха.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным ритмом законодательного перечня. Повторяющийся союз «или» сохранён ради структуры и накопительного характера исходного текста; архаизмы и конфессионально окрашенные формулы не использованы.
