  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: ru
  text: 'Не делайте в субботний день никакой работы, кроме того, что вы приготовили для себя в шестой день: для еды, питья и отдыха, чтобы соблюдать в этот день субботний покой, воздерживаясь от всякой работы, и благословлять ГОСПОДА, Бога вашего, который дал вам день праздника, святой день и святой день Царства[a] для всего Израиля, — этот день во все их дни, во все дни.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «день святого Царства».'
    reason: Сжатая конструкция допускает разное синтаксическое отнесение определения «святой».
  - marker: b
    text: 'Буквально: «во все их дни, во все дни». Возможное смысловое понимание: «во все их поколения».'
    reason: Источник дважды употребляет слово «дни»; примечание отмечает возможный формульный смысл, не подменяя буквальное чтение в основном тексте.
lexical_decisions:
- source_word: ሰንበት
  choice: суббота / соблюдать субботу
  rationale: 'Сохраняется повтор исходного текста: сначала название дня, затем глагольное выражение со значением субботнего покоя и соблюдения субботы.'
- source_word: ግብር
  choice: работа
  rationale: В контексте субботней заповеди это естественный современный русский эквивалент со значением совершаемого труда или дела.
- source_word: እግዚአብሔር
  choice: ГОСПОДЬ
  rationale: Традиционное типографическое обозначение божественного имени в библейском регистре; фраза «ГОСПОДА, Бога вашего» сохраняет структуру источника.
- source_word: በመዋዕሊሆሙ
  choice: во все дни их
  rationale: Передаёт именно «их дни», а не подменяет исходное слово термином «поколения»; несколько необычный порядок сохраняет торжественную заключительную формулу и её повтор.
- source_word: በኵሉ፡ መዋዕል
  choice: во все дни
  rationale: Сохраняет буквальное повторение слова «дни» в заключительной формуле, не сводя его без пояснения к наречию «вечно».
theological_decisions:
- issue: Выражение ዕለተ፡ መንግሥት፡ ቅድስት
  choice: день святого Царства
  alternative: святой день Царства
  rationale: Основной текст связывает определение «святого» с «Царством», но грамматическая сжатость выражения допускает и отнесение святости к дню; неоднозначность отмечена в сноске, без догматического уточнения природы Царства.
- issue: Заключительная временная формула
  choice: во все дни их, во все дни
  alternative: во все их поколения, навеки
  rationale: Выбран вариант, непосредственно отражающий лексику источника и её повтор; традиционное смысловое понимание через поколения указано только как возможная интерпретация.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повторы «день», «работа» и «во все дни» сохранены как значимые черты исходного текста; архаизмы и конфессионально специфическая терминология не вводились.
