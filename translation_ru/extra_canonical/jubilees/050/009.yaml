  to: 'Не делайте в субботний день никакой работы, кроме того, что вы приготовили для себя в шестой день: для еды, питья и отдыха, чтобы соблюдать в этот день субботний покой, воздерживаясь от всякой работы, и благословлять ГОСПОДА, Бога вашего, который дал вам день праздника, святой день и святой день Царства[a] для всего Израиля, — этот день во все их дни, во все дни.[b]'
