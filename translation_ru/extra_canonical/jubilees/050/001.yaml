  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: ru
  text: И после этого закона[a] я возвестил тебе дни суббот в пустыне Синай, которая находится между Елимом и Синаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И после этого я возвестил тебе закон дней суббот».'
    reason: Сохраняет альтернативный синтаксический разбор слова «закон», отражённый в английской редакционной традиции.
lexical_decisions:
- source_word: ወእምድኅረዝ፡ ሕገ
  choice: И после этого закона
  rationale: Слово «закона» отнесено к предшествующему установлению; такое синтаксическое понимание естественнее, чем разрыв сочетания «закон дней суббот» глаголом.
- source_word: አደለውኩ
  choice: я открыл
  rationale: Передаёт значение «сделал известным, возвестил» естественным современным русским выражением.
- source_word: መዋዕለ፡ ሰንበታት
  choice: дни суббот
  rationale: Сохраняет множественное число и формальную связь существительных исходного текста.
- source_word: በገዳመ፡ ሲና
  choice: в пустыне Синай
  rationale: ገዳም означает пустыню, а не гору; топоним оставлен несклоняемым.
- source_word: እንተ፡ ይእቲ፡ ምእከለ፡ ኤሎም፡ ወሲና
  choice: которая находится между Елимом и Синаем
  rationale: Относительное предложение относится к пустыне; связка выражена по-русски явно для естественности.
theological_decisions:
- issue: Синтаксическая связь слова ሕገ («закон»)
  choice: «после этого закона»
  alternative: «после этого я открыл тебе закон дней суббот»
  rationale: Позиция слова непосредственно после «после этого» и необычность отделения определяемого существительного от генитива глаголом поддерживают отнесение «закона» к предыдущему установлению.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования; сохранены повтор топонима Синай и несколько непривычное, но смыслово точное выражение «дни суббот».
