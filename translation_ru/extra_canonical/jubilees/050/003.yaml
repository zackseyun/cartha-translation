translation:
  language: ru
  text: И земля будет соблюдать свои субботы, пока они живут на ней, и они будут знать год юбилея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበብት፡ ምድር፡ ሰንበታቲሃ
  choice: земля будет соблюдать свои субботы
  rationale: Передаёт землю как грамматический субъект и сохраняет библейское олицетворение; «свои субботы» соответствует суффиксу принадлежности.
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  choice: пока они живут на ней
  rationale: Естественно передаёт обстоятельственную конструкцию пребывания/жительства на земле, не уточняя референт местоимения сверх источника.
- source_word: ወዓመተ፡ ለኢዮቤል፡ ያእምሩ
  choice: и они будут знать год юбилея
  rationale: Сохраняет прямое значение глагола «знать» и традиционное библейское обозначение юбилейного года без добавочного толкования.
theological_decisions:
- issue: Смысл соблюдения землёй суббот
  choice: 'сохранено буквальное олицетворение: «земля будет соблюдать свои субботы»'
  alternative: «земля будет покоиться в свои субботы»
  rationale: Источник представляет землю действующим субъектом; буквальная формулировка сохраняет связь с библейским языком субботних лет и не сводит образ только к покою.
- issue: Значение знания юбилейного года
  choice: «будут знать год юбилея»
  alternative: «будут отмечать юбилейный год»
  rationale: Перевод не превращает знание в ритуальное соблюдение, поскольку такого уточнения в исходной формулировке нет.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Синтаксис прост и понятен; неоднозначный референт «они» не конкретизирован.
