base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: ru
  text: 'Поэтому Я установил для тебя седмины лет, годы и юбилеи: сорок девять юбилеев от дней Адама до этого дня. И ещё остаются одна седмина, два года и сорок лет, чтобы познать заповеди Господа, пока они не перейдут через Иордан на запад, в землю Ханаанскую.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠራዕኩ
  choice: Я установил
  rationale: Передаёт значение предписания и упорядочения без излишне конфессиональной окраски.
- source_word: ሱባዔ ዓመታት
  choice: седмины лет
  rationale: Сохраняет специальное значение семилетних периодов и отличает их от обычных недель.
- source_word: ኢዮቤሌዎታት
  choice: юбилеи
  rationale: Устоявшееся русское обозначение юбилейных циклов.
- source_word: ርሑቅ ለእእምሮ
  choice: остаются … для изучения
  rationale: Контекстуально передаёт оставшийся срок, предназначенный для познания заповедей; формулировка источника необычна, поэтому сохранена смысловая связь без чрезмерного сглаживания.
- source_word: የዐድዉ … ዐዲዎሙ ዮርዳኖሰ
  choice: не перейдут … перейдя Иордан
  rationale: Сохраняет как основной глагол перехода, так и глагольную силу формы, относящейся к Иордану.
- source_word: ገጸ ዐረቢሁ
  choice: к западу
  rationale: Буквально передаёт западное направление, не устраняя синтаксическую неоднозначность его связи с переходом через Иордан.
theological_decisions:
- issue: Имя Бога እግዚአብሔር
  choice: Господа
  alternative: Владыки / Яхве
  rationale: «Господь» — естественный и традиционный русский эквивалент, не вводящий реконструированное личное имя там, где эфиопский текст употребляет обычный титул.
- issue: Назначение оставшихся сорока лет
  choice: для изучения заповедей Господа
  alternative: чтобы познать заповеди Господа
  rationale: Сохраняет цель периода и не уточняет сверх текста, идёт ли речь только об обучении, опытном познании или усвоении.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Седмина» сохранена как точный термин для семилетнего цикла; порядок чисел и временных отрезков не нормализован, чтобы не скрыть необычную структуру оригинала.
