base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: ru
  text: 'Ибо велика честь, которую Господь даровал Израилю: есть, пить и насыщаться в этот день праздника, отдыхать в этот день от всякой работы, связанной с человеческим трудом, кроме воскурения благовоний и принесения приношения и жертвы пред Господом для дней и для суббот.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дни и субботы». В оригинале точная синтаксическая связь слов «для дней и для суббот» с предшествующей фразой не вполне ясна.'
    reason: Сохраняет буквальное выражение исходного текста и отмечает его реальную синтаксическую неоднозначность, не вводя дополнительного определения.
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: велика честь
  rationale: Передаёт буквальное сочетание «великая честь/слава»; в контексте дарованной Израилю привилегии естественнее современное «честь».
- source_word: በዛቲ፡ ዕለት፡ በዓል
  choice: в этот праздничный день
  rationale: Сохраняет указание на конкретный день праздника без добавления отсутствующего в стихе названия.
- source_word: ወለጸጊብ
  choice: и насыщаться
  rationale: Формально и ясно передаёт идею сытости после еды и питья.
- source_word: እምኵሉ፡ ግብር፡ ዘእምግብረ፡ እጓለ፡ እመሕያው
  choice: от всякой работы, совершаемой людьми
  rationale: Естественно передаёт семитское выражение о человеческом труде, не сужая его до отдельного рода занятий.
- source_word: ዕጣን፡ ዕጣን
  choice: воскурения благовоний
  rationale: Повтор в геэзском тексте, вероятно, выражает действие с благовонием или отражает текстовую особенность; по смыслу передано как культовое воскурение.
- source_word: ቍርባን፡ ወመሥዋዕት
  choice: дара и жертвы
  rationale: 'Сохраняется различие двух культовых терминов: приношение/дар и жертва.'
theological_decisions:
- issue: Исключение из субботнего покоя храмового служения
  choice: кроме воскурения благовоний и принесения дара и жертвы
  alternative: кроме как воскурять благовония и приносить приношение и жертву
  rationale: Сохранено прямое исключение для культовых действий без попытки согласовать его с какой-либо позднейшей системой субботних предписаний.
- issue: Связь заключительной фразы «для дней и суббот»
  choice: — в установленные дни и субботы
  alternative: пред Господом на все дни и субботы
  rationale: Исходная формулировка допускает неясность относительно связи с приношениями и точного значения «дней»; перевод сохраняет культово-календарный смысл, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формы «Ибо», «пред Господом» и культовая лексика поддерживают достоинство текста, тогда как синтаксис остаётся доступным обычному читателю.
