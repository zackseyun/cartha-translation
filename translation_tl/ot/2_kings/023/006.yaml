  terminology: Ang “Ashera,” “Yahweh,” “bahay ni Yahweh,” at “Lambak ng Kidron” ay angkop. Ang talababa ay wastong nag-iingat laban sa labis na pagtitiyak sa pisikal na anyo ng Ashera.
