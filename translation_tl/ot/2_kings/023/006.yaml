reference: 2 Kings 23:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: tl
  text: Inilabas niya ang Ashera[a] mula sa bahay ni Yahweh at dinala niya ito sa labas ng Jerusalem, sa Lambak ng Kidron. Sinunog niya iyon sa Lambak ng Kidron, dinurog hanggang maging alabok, at ikinalat ang alabok nito sa mga libingan ng karaniwang tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “poste ni Ashera” o “imahen ni Ashera.” Ang salitang Hebreo ay maaaring tumukoy sa diyosang Canaanita na si Ashera o sa bagay na ginagamit sa pagsamba sa kaniya; dito, tumutukoy ito sa bagay na inilabas at winasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: ang Ashera
  rationale: Pinanatili ang tiyak na pangalang panrelihiyon dahil maaaring tumukoy ang Hebreo sa diyosang Ashera o sa bagay na ginagamit sa pagsamba sa kaniya; malinaw sa konteksto na isang bagay ang inilabas at winasak, ngunit hindi tiyak ang anyo nito.
- source_word: מִבֵּית יְהוָה
  choice: mula sa bahay ni Yahweh
  rationale: Tuwirang sinasalamin ang Hebreong 'bahay ni Yahweh' habang nananatiling natural sa Tagalog; tumutukoy ito sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מִחוּץ לִירוּשָׁלַם
  choice: sa labas ng Jerusalem
  rationale: Natural na ipinahahayag ang pagdadala sa isang lugar sa labas ng lungsod.
- source_word: נַחַל קִדְרוֹן
  choice: Lambak ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa lambak o bangin na may pana-panahong daluyan ng tubig; malinaw at pamilyar sa heograpikong konteksto ang 'Lambak ng Kidron.'
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: Sinunog niya iyon
  rationale: Ginamit ang 'iyon' para sa bagay na pangkulto at upang hindi ito mapagkamalang mismong diyosa.
- source_word: וַיָּדֶק לְעָפָר
  choice: dinurog hanggang maging alabok
  rationale: Ipinahahayag ang ganap na pagdurog o pagpulbos ng bagay, kasunod ng pagsunog dito.
- source_word: עֲפָרָהּ
  choice: ang alabok nito
  rationale: Ang עפר ay 'alabok,' hindi partikular na 'abo'; pinananatili nito ang resulta ng kapuwa pagsunog at pagdurog.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: sa mga libingan ng karaniwang mamamayan
  rationale: Ipinahahayag ang malamang na panlipunang pagkakaiba ng mga ordinaryong tao sa mga nakatataas, sa natural na modernong Tagalog.
theological_decisions:
- issue: Paglalarawan sa אֲשֵׁרָה
  choice: ang Ashera
  alternative: ang poste ni Ashera; ang imahen ni Ashera
  rationale: Hindi tinutukoy nang tiyak ng Hebreo ang pisikal na anyo ng bagay. Ang transliterasyon ay nagpapanatili sa tunay na kalabuan habang malinaw sa konteksto na winasak ang isang bagay na kaugnay ng pagsamba kay Ashera.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang serye ng mga pandiwa upang maging natural ang daloy nang hindi binabago ang pagkakasunod-sunod ng mga kilos. Ginamit ang 'bahay ni Yahweh' upang mapanatili ang anyo ng Hebreo, at 'karaniwang mamamayan' upang ihayag ang panlipunang diwa ng parirala.
