revisions:
- from: Inalis din ni Josias ang lahat ng gusali ng matataas na sambahan sa mga lungsod ng Samaria, na ginawa ng mga hari ng Israel upang magpagalit.[a] Ginawa niya sa mga iyon ang gaya ng lahat ng ginawa niya sa Bethel.
  to: Inalis din ni Josias ang lahat ng gusali ng mga sambahan sa matataas na lugar na nasa mga lungsod ng Samaria, na itinayo ng mga hari ng Israel upang pukawin ang galit.[a] Ginawa niya sa mga iyon ang ayon sa lahat ng ginawa niya sa Bethel.
  rationale: Inayos ang katawagan para sa בָּתֵּי הַבָּמוֹת upang maging malinaw at natural sa Filipino, habang pinananatili ang parehong kongkretong “mga gusali” at ang pook-sambahang diwa ng “matataas na lugar.” Pinalitan ang “magpagalit” ng mas idiomatikong “pukawin ang galit,” nang hindi tahasang idinaragdag ang PANGINOON sa pangunahing teksto. Inayos din ang huling sugnay upang panatilihin ang paghahambing ng כְּכָל.
