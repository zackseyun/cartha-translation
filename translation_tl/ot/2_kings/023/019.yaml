  terminology: Panatilihin ang “Josias,” “Samaria,” at “Bethel.” Ang “mga gusali ng mga sambahan sa matataas na lugar” ay nagbibigay ng kongkretong “mga bahay/gusali” at malinaw na isinasalin ang terminong “mataas na lugar” nang hindi nagpapataw ng partikular na denominasyonal na katawagan.
