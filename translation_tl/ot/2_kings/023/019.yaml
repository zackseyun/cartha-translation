base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: tl
  text: Inalis din ni Josias ang lahat ng gusali ng mga sambahan sa matataas na lugar na nasa mga lungsod ng Samaria, na itinayo ng mga hari ng Israel upang pukawin ang galit.[a] Ginawa niya sa mga iyon ang ayon sa lahat ng ginawa niya sa Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, kung lilinawin ayon sa mas malawak na konteksto, “upang pukawin ang galit ng PANGINOON.”
    reason: Nililinaw ang di-binanggit na layon ng pandiwang Hebreo nang hindi ito idinaragdag sa pangunahing teksto.
lexical_decisions:
- source_word: וְגַם
  choice: din
  rationale: Ipinahahayag ang pagdaragdag ng kilos na ito sa naunang salaysay sa natural na Tagalog.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: mga gusali ng matataas na sambahan
  rationale: Pinananatili ng “mga gusali” ang konkretong diwa ng בָּתֵּי, samantalang malinaw na ipinahahayag ng “matataas na sambahan” ang mga pook ng pagsambang tinutukoy ng בָּמוֹת.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: sa mga lungsod ng Samaria
  rationale: Tuwirang isinasalin ang parirala; ang Samaria rito ay tumutukoy sa lupain ng dating hilagang kaharian.
- source_word: לְהַכְעִיס
  choice: upang magpagalit
  rationale: Ipinapakita ang layunin o bunga ng pagtatayo ng mga sambahan habang iniiwang di-binanggit ang pinagagalit, gaya ng Hebreo.
- source_word: הֵסִיר
  choice: inalis
  rationale: Malinaw at konkretong katumbas para sa hiphil ng סור sa konteksto ng reporma ni Josias.
- source_word: וַיַּעַשׂ לָהֶם
  choice: ginawa niya sa mga iyon
  rationale: Pinananatili ang tuwirang pahayag ng Hebreo at ang ugnayan nito sa kasunod na paghahambing.
- source_word: כְּכָל הַמַּעֲשִׂים
  choice: ang gaya ng lahat ng ginawa niya
  rationale: Natural sa Tagalog at pinananatili ang paghahambing at kabuuang saklaw ng parirala.
- source_word: בְּבֵית אֵל
  choice: sa Bethel
  rationale: Karaniwang Tagalog na pananda para sa kilos na isinagawa sa isang lugar.
theological_decisions:
- issue: Hindi binanggit na layon ng לְהַכְעִיס
  choice: 'Iniwan sa pangunahing teksto ang layon bilang di-binanggit: “upang magpagalit.”'
  alternative: “upang galitin ang PANGINOON”
  rationale: Malinaw sa mas malawak na konteksto na ang PANGINOON ang pinagagalit, ngunit hindi siya tahasang binanggit sa sugnay na Hebreo. Pinananatili ng pangunahing teksto ang pagkaimplicit nito, at nililinaw ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Josias,” ang nakaugaliang anyong Filipino ng pangalan, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
