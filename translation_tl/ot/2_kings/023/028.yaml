base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga gawain ni Josias at ang lahat ng kanyang ginawa, hindi ba nakasulat[a] ang mga iyon sa Aklat ng mga Salaysay ng mga Hari ng Juda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatala.” Ang salitang Hebreo ay literal na “nakasulat,” ngunit sa kontekstong ito ng mga talaang pang-arkibo, maaari rin itong unawaing “nakatala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Salaysay” ay tumutukoy sa isang talaang maharlika na binabanggit bilang sanggunian sa Mga Hari; hindi ito kinakailangang tumukoy sa mga biblikal na aklat ng 1–2 Cronica sa kanilang pinal na anyo.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ang iba pang mga gawain
  rationale: Sa pormulang pangkasaysayan tungkol sa mga hari, ang parirala ay tumutukoy sa nalalabing mga gawain o pangyayari sa paghahari. Likas sa makabagong Tagalog ang “iba pang mga gawain” at hindi ito nagdaragdag ng temporal na panandang wala sa Hebreo.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino na malinaw at madaling makilala ng karaniwang mambabasa.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili nito ang malawak na kahulugan ng pandiwang עשה nang hindi nililimitahan sa mga tagumpay lamang.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa, pati ang literal na diwa ng passive participle na “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na “sa ibabaw ng balumbon,” ang “nakasulat sa Aklat” ang likas na idyomang Filipino sa kontekstong pang-arkibo.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Aklat ng mga Salaysay ng mga Hari ng Juda
  rationale: Inilalarawan nito ang kronolohikal na talaang maharlika at pinananatili ang anyo ng pamagat nang hindi ipinapantay nang tahasan sa kanonikal na 1–2 Cronica.
