translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang retorikal ng Hebreo at ang bahagyang pag-uulit ng “mga gawain” at “ginawa,” sapagkat bahagi ito ng estilong pangbuod ng talata. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinapaliwanag ng mga ito.
