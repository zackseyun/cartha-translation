revisions:
- from: At nilapastangan ng hari ang matataas na lugar na nasa tapat ng Jerusalem[a], sa kanan ng Bundok ng Pagkawasak[b]. Ang mga iyon ay ipinatayo ni Solomon na hari ng Israel para kay Astoret, ang kasuklam-suklam na diyus-diyosan ng mga Sidonio; para kay Kemos, ang kasuklam-suklam na diyus-diyosan ng Moab; at para kay Milcom[c], ang kasuklam-suklam na diyus-diyosan ng mga Ammonita.
  to: At dinungisan ng hari ang mga matataas na lugar na nasa tapat ng Jerusalem[a], na nasa kanan ng Bundok ng Pagkawasak[b][c], na ipinatayo ni Solomon na hari ng Israel para kay Astoret, ang kasuklam-suklam na diyus-diyosan ng mga Sidonio; para kay Kemos, ang kasuklam-suklam na diyus-diyosan ng Moab; at para kay Milcom[d], ang kasuklam-suklam na diyus-diyosan ng mga Ammonita.
  rationale: Inayos ang sintaks upang ang “na ipinatayo ni Solomon” ay malinaw na tumukoy sa mga matataas na lugar, at pinalitan ang “nilapastangan” ng “dinungisan” bilang mas tuwirang kultikong katumbas ng “defiled.” Idinagdag ang talababa para sa posibleng heograpikong pagbasa ng “sa kanan,” at nilinaw ang tunay na alternatibo para sa “nasa tapat ng Jerusalem.” Hindi binago ang mga pangalan, ang mapanuyang himig laban sa mga kulto, o ang di-tiyak na pagkakaugnay ng Milcom at Molek.
