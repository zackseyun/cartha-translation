  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: tl
  text: At dinungisan ng hari ang mga matataas na lugar na nasa tapat ng Jerusalem[a], na nasa kanan ng Bundok ng Pagkawasak[b][c], na ipinatayo ni Solomon na hari ng Israel para kay Astoret, ang kasuklam-suklam na diyus-diyosan ng mga Sidonio; para kay Kemos, ang kasuklam-suklam na diyus-diyosan ng Moab; at para kay Milcom[d], ang kasuklam-suklam na diyus-diyosan ng mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawaing “silangan ng Jerusalem” sa kontekstong heograpiko; literal, “sa tapat ng Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa timog ng Bundok ng Pagkawasak,” sapagkat ang “sa kanan” ay maaaring magpahiwatig ng direksiyong heograpiko.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “Bundok ng Pagkawasak”; maaaring ito ang burol na nang maglaon ay nakilala bilang Bundok ng mga Olibo.
    reason: cross_reference
  - marker: d
    text: “Milcom” ang mababasa sa Hebreo; iniuugnay ito ng ilang mambabasa sa diyos na si Molek.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ang matataas na lugar
  rationale: Pinananatili nito ang nakaugaliang katawagang biblikal para sa mga pook ng pagsamba, nang hindi labis na tinutukoy ang anyo ng mga gusali.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: nasa tapat ng Jerusalem
  rationale: Ang parirala ay maaaring tumukoy sa lugar na nasa harap o katapat; iniiwasan nitong gawing tiyak na 'silangan' ang hindi tahasang direksiyon sa Hebreo.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: sa kanan ng Bundok ng Pagkawasak
  rationale: Tuwirang pinananatili ang larawang 'kanan' sa Hebreo; ang posibleng heograpikong kahulugang 'timog' ay inilagay sa talababa.
- source_word: הַר הַמַּשְׁחִית
  choice: Bundok ng Pagkawasak
  rationale: Isinasalin ang mapanuyang pangalan sa Hebreo sa halip na palitan ito ng posibleng pagkakakilanlan bilang Bundok ng mga Olibo.
- source_word: לְעַשְׁתֹּרֶת
  choice: para kay Astoret
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan ng diyosang tinutukoy ng Hebreong Ashtoreth.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: ang kasuklam-suklam na diyus-diyosan ng mga Sidonio
  rationale: Pinananatili ang matinding mapanghusgang puwersa ng kultikong katawagan habang nililinaw na isang sinasambang diyus-diyosan ang tinutukoy.
- source_word: לִכְמוֹשׁ
  choice: para kay Kemos
  rationale: Ginamit ang natural na transliterasyong Filipino ng pangalan ng diyos ng Moab.
- source_word: שִׁקֻּץ מוֹאָב
  choice: ang kasuklam-suklam na diyus-diyosan ng Moab
  rationale: Pare-parehong isinalin ang kultikong mapanirang katawagan at pinanatili ang kaugnayan nito sa Moab.
- source_word: לְמִלְכֹּם
  choice: para kay Milcom
  rationale: Pinananatili ang pangalang mababasa sa tekstong Hebreo at hindi ito tahimik na ipinagpapalit sa Molek.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: ang kasuklam-suklam na diyus-diyosan ng mga Ammonita
  rationale: Inihahatid ang matinding pagkasuklam ng salita at natural na isinasalin ang 'mga anak ni Ammon' bilang 'mga Ammonita.'
- source_word: טִמֵּא
  choice: nilapastangan
  rationale: Sa konteksto, sinira ng hari ang kabanalan o kultikong gamit ng mga lugar; ang 'nilapastangan' ay natural at malakas na katumbas sa Filipino.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang titulong ginamit ng Hebreo; nakikilala sa konteksto na si Josias ang tinutukoy.
theological_decisions:
- issue: Mapanuyang katawagan sa mga banyagang diyos
  choice: kasuklam-suklam na diyus-diyosan
  alternative: kasuklam-suklam na bagay
  rationale: Hindi dapat palambutin ang tahasang paghatol ng Hebreo. Idinagdag ang 'diyus-diyosan' upang maging malinaw at natural sa Filipino ang tinutukoy na kultikong diyos.
- issue: Pagkakakilanlan ng הַר הַמַּשְׁחִית
  choice: Bundok ng Pagkawasak
  alternative: Bundok ng Kabulukan; Bundok ng mga Olibo
  rationale: Pinananatili ng salin ang mapanuyang pangalan at teolohikong himig ng mismong teksto, sa halip na palitan ito ng isang ipinapalagay na heograpikong pangalan.
- issue: Milcom at Molek
  choice: Milcom sa pangunahing teksto
  alternative: Molek
  rationale: Milcom ang pangalan sa tekstong Hebreo. Inilalahad lamang sa talababa ang posibleng pag-uugnay kay Molek upang hindi pag-isahin nang walang batayan ang dalawang pangalan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tradisyonal na biblikal na 'matataas na lugar,' ngunit gumamit ng malinaw na sintaks at mga pangalang inangkop sa bigkas ng Filipino. Inilagay kaagad ang marker [b] pagkatapos ng pangalang heograpiko at [c] pagkatapos ng Milcom upang malinaw ang saklaw ng bawat talababa.
