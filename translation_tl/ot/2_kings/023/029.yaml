id: 2KI.23.29
reference: 2 Kings 23:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: tl
  text: Noong panahon niya, nagmartsa si Faraon Neco[a], hari ng Ehipto, laban sa hari ng Asiria, patungo sa Ilog Eufrates. Pumunta naman si Haring Josias upang salubungin siya[b][c], at pinatay niya siya sa Megido nang makita niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Neco; tradisyonal na baybay: Necho.'
    reason: lexical_alternative
  - marker: b
    text: 'O, ayon sa isang pagpapakahulugan: “Pinatay ni Faraon Neco si Josias sa Megido nang pumunta si Josias upang salubungin siya.” Malabo sa Hebreo ang tinutukoy ng mga panghalip na panlalaking isahan.'
    reason: alternative_reading
  - marker: c
    text: Tingnan din ang 2 Cronica 35:20–24 para sa magkatulad na salaysay tungkol sa pagkamatay ni Josias.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Noong panahon niya
  rationale: Likas na salin ng Hebreong idyomang tumutukoy sa panahon ng paghahari ni Josias, nang hindi pinalalawak ang kahulugan.
- source_word: עָלָה
  choice: umahon ... laban sa
  rationale: Pinananatili ang larawang 'umahon' at ang gamit nito sa kontekstong militar bilang pagsalakay o pagmartsa laban sa isang hari.
- source_word: פַרְעֹה נְכֹה
  choice: Faraon Neco
  rationale: Ginagamit ang karaniwang titulong Filipino na 'Faraon' at isang makabagong transliterasyon ng pangalan; inilalagay sa talababa ang tradisyonal na baybay.
- source_word: עַל מֶלֶךְ אַשּׁוּר
  choice: laban sa hari ng Asiria
  rationale: Sa kasunod ng pandiwang militar na עָלָה, ang עַל ay pinakanatural na tumutukoy sa pagharap laban sa isang kalaban; hindi binabago ang payak na diwa dahil lamang sa rekonstruksiyong pangkasaysayan.
- source_word: עַל נְהַר פְּרָת
  choice: patungo sa Ilog Eufrates
  rationale: Ipinahahayag ang patutunguhang heograpiko sa natural na Filipino.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Ang 'salubungin' ay maaaring neutral o mapanlaban ayon sa konteksto, kaya hindi nito tahasang ipinapasok ang motibo ni Josias.
- source_word: וַיְמִיתֵהוּ
  choice: pinatay niya siya
  rationale: Direkta at natural na Filipino para sa causative na anyo ng מות, habang pinananatili ang hindi tiyak na mga tinutukoy ng mga panghalip.
- source_word: בִּמְגִדּוֹ
  choice: sa Megido
  rationale: Natural na panandang panlunan sa Filipino para sa lugar ng pangyayari.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: nang makita niya siya
  rationale: Malapit sa anyong Hebreo at sadyang pinananatili ang kalabuan ng dalawang panghalip na panlalaking isahan.
theological_decisions:
- issue: Kalabuan ng mga panghalip sa huling sugnay at sa 'pinatay niya siya'
  choice: Panatilihin ang paulit-ulit na 'niya/siya' nang hindi tahasang pinapangalanan ang simuno at layon.
  alternative: Pinatay ni Faraon Neco si Josias sa Megido nang salubungin siya ni Josias.
  rationale: Siksik at hindi tahasang tinutukoy ng Hebreo ang mga referent ng mga panghalip. Pinananatili ng pangunahing teksto ang tunay na kalabuan sa halip na lutasin ito sa pamamagitan ng interpretasyon o pag-aangkop sa paralelong salaysay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bahagyang di-pangkaraniwang pag-uulit ng 'niya/siya' sapagkat mahalaga itong sumalamin sa tunay na kalabuan ng Hebreo. Ang 'salubungin' ay pinili sa halip na mas tiyak na 'harapin' upang hindi agad gawing lantad ang motibong mapanlaban.
