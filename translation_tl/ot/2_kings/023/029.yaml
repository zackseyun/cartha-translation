revisions:
- from: Noong panahon niya, umahon si Faraon Neco[a], na hari ng Ehipto, laban sa hari ng Asiria, patungo sa Ilog Eufrates. Pumunta naman si Haring Josias upang salubungin siya[b][c], at pinatay niya siya sa Megido nang makita niya siya.
  to: Noong panahon niya, nagmartsa si Faraon Neco[a], hari ng Ehipto, laban sa hari ng Asiria, patungo sa Ilog Eufrates. Pumunta naman si Haring Josias upang salubungin siya[b][c], at pinatay niya siya sa Megido nang makita niya siya.
