  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: tl
  text: Kundi noong ikalabingwalong taon lamang ng paghahari ni Haring Josias ipinagdiwang ang Paskuwang ito para kay Yahweh sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ginawa”; ibig sabihin, “isinagawa” o “ipinagdiwang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Kundi ... lamang
  rationale: 'Ipinahahayag ng tambalang ito ang pasalungat at mapaghigpit na diwa kaugnay ng naunang talata: hindi nagkaroon ng gayong Paskuwa, kundi sa panahong ito lamang.'
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: noong ikalabingwalong taon ng paghahari ni Haring Josias
  rationale: Ang lamed ay tumutukoy sa taon ng paghahari ng hari. Nilinaw ng “ng paghahari” ang natural na kahulugan sa Filipino nang walang pagbabago sa diwa.
- source_word: נַעֲשָׂה
  choice: ipinagdiwang
  rationale: Literal itong “ginawa,” ngunit kapag Paskuwa ang paksa, ang idyomatikong kahulugan ay isinagawa o ipinagdiwang ang kapistahan.
- source_word: הַפֶּסַח הַזֶּה
  choice: ang Paskuwang ito
  rationale: Tuwirang isinasalin ang pangngalan at panturo; “Paskuwa” ang nakaugaliang terminong Filipino para sa Pesach.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang lamed ay nagpapahayag ng pag-uukol o patutunguhan ng pagdiriwang. Pinananatili ang personal na pangalan ng Diyos bilang Yahweh.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin gamit ang karaniwang anyo ng pangalan ng lugar sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng נַעֲשָׂה kaugnay ng Paskuwa
  choice: ipinagdiwang
  alternative: ginawa; isinagawa
  rationale: Ang pandiwa ay literal na “ginawa,” ngunit sa kontekstong ritwal ang natural na diwa ay ipinagdiwang o isinagawa. Inilalagay sa talababa ang literal na anyo upang hindi maitago ang saklaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Josias,” ang tradisyonal at madaling makilalang anyong Filipino ng Josiah, at “Paskuwa” para sa kapistahan. Ang “Kundi ... lamang” ay sadyang nagpapanatili sa ugnayang pasalungat sa naunang talata.
