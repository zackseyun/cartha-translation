  text: כִּ֗י אִם בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹֽאשִׁיָּ֑הוּ נַעֲשָׂ֞ה הַ/פֶּ֧סַח הַ/זֶּ֛ה לַ/יהוָ֖ה בִּ/ירוּשָׁלִָֽם־׃
base_translation:
