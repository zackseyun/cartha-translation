  terminology: Ang “dambana,” “Betel,” at “Ashera” ay angkop. Ang pagpapanatili sa “Ashera” at paglalagay ng alternatibong “poste ni Ashera” sa talababa ay wastong nagpapanatili ng leksikal na kalabuan ng אֲשֵׁרָה.
