revisions:
- from: Giniba rin niya ang dambana sa Betel—ang sambahan sa mataas na lugar na ginawa ni Jeroboam na anak ni Nebat, na nag-udyok sa Israel na magkasala. Giniba niya ang dambanang iyon at ang sambahan sa mataas na lugar; sinunog niya ang sambahan, dinurog iyon hanggang maging alabok, at sinunog ang Ashera.[a]
  to: Maging ang dambana sa Betel—ang mataas na lugar ng pagsamba na ginawa ni Jeroboam na anak ni Nebat, na naging sanhi upang magkasala ang Israel—ang dambanang iyon at ang mataas na lugar ng pagsamba ay giniba niya. Sinunog niya ang mataas na lugar ng pagsamba, dinurog niya ito hanggang maging alabok, at sinunog niya ang Ashera.[a]
  rationale: Pinalitan ang di-likas na “sambahan sa mataas na lugar” ng “mataas na lugar ng pagsamba” upang malinaw na maipahayag ang בָּמָה bilang isang kultikong high place. Pinalakas ang causative na puwersa ng הֶחֱטִיא sa “naging sanhi upang magkasala ang Israel.” Inayos din ang pangungusap upang maipakita ang pag-uulit at pagbibigay-diin sa “dambanang iyon” at sa mataas na lugar, habang pinananatili ang Ashera nang walang sapilitang pagpapasya kung diyosa o bagay-kulto ang tinutukoy.
