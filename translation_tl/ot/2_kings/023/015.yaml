base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: tl
  text: Maging ang dambana sa Betel—ang mataas na lugar ng pagsamba na ginawa ni Jeroboam na anak ni Nebat, na naging sanhi upang magkasala ang Israel—ang dambanang iyon at ang mataas na lugar ng pagsamba ay giniba niya. Sinunog niya ang mataas na lugar ng pagsamba, dinurog niya ito hanggang maging alabok, at sinunog niya ang Ashera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “poste ni Ashera”; maaaring tumukoy ang terminong Hebreo sa bagay na ginagamit sa pagsamba kay Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: dambana
  rationale: Karaniwan at malinaw na salin ng altar na pinaghahandugan; hindi na kailangang dagdagan ng paliwanag sa pangunahing teksto.
- source_word: בְּבֵית אֵל
  choice: sa Betel
  rationale: Likas na paraan sa Filipino upang tukuyin ang lokasyon, habang ginagamit ang nakasanayang anyo ng pangalang Betel.
- source_word: הַבָּמָה
  choice: sambahan sa mataas na lugar
  rationale: Ipinahahayag nito kapwa ang pisikal na kataasan at ang gamit na panrelihiyon ng teknikal na salitang Hebreo, sa paraang mauunawaan ng karaniwang mambabasa.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Pinananatili ang payak na kahulugan ng pandiwa at iniiwasang ipalagay nang tahasan na 'itinayo' ang buong lugar.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: nag-udyok sa Israel na magkasala
  rationale: Pinananatili ang causative na puwersa ng Hiphil at malinaw na si Jeroboam ang nagtulak sa Israel tungo sa pagkakasala.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: ang dambanang iyon
  rationale: Ang demonstratibo ay nagpapakilala muli at nagbibigay-diin sa mismong dambanang nabanggit.
- source_word: נָתָץ
  choice: giniba
  rationale: Natural at tiyak na Filipino para sa pagbuwag o pagwasak ng isang estruktura.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: sinunog niya ang sambahan
  rationale: Pinananatili ang pagkakapareho ng tinutukoy na mataas na sambahan, ngunit pinaikli ang ikalawang banggit upang maging natural sa Filipino.
- source_word: הֵדַק לְעָפָר
  choice: dinurog iyon hanggang maging alabok
  rationale: Malinaw na ipinahahayag ang lubos na pagdurog at ang resultang tinutukoy ng pariralang Hebreo.
- source_word: אֲשֵׁרָה
  choice: ang Ashera
  rationale: Pinananatili ang terminong Hebreo sa pangunahing teksto upang hindi sapilitang pagpasyahan kung pangalan ng diyosa o tawag sa bagay na kaugnay ng pagsamba sa kaniya ang gamit dito.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרָה
  choice: ang Ashera
  alternative: ang poste ni Ashera; ang sagradong poste
  rationale: Sa konteksto ng pagsunog, malamang na bagay na ginagamit sa kulto ang tinutukoy, ngunit maaari ring gamitin ang terminong Hebreo kaugnay ng diyosa mismo. Pinananatili sa teksto ang leksikal na kalabuan at inilalagay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahan sa mataas na lugar” sa halip na mas lumang “mataas na dako,” at pinanatili ang paulit-ulit na mga terminong mahalaga sa Hebreo. Inilagay ang panandang [a] sa “Ashera,” na siyang terminong ipinaliliwanag ng talababa.
