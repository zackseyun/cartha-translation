revisions:
- from: 'Pagkatapos, tumayo ang hari sa tabi ng haligi[a] at pinagtibay ang tipan sa harap ni Yahweh: lalakad siyang sumusunod kay Yahweh at tutuparin ang kanyang mga utos, mga patotoo, at mga tuntunin nang buong puso at buong kaluluwa, upang isagawa ang mga salita ng tipang ito na nakasulat sa aklat na ito.[b] At ang buong bayan ay nanindigan sa tipan.[c]'
  to: 'Pagkatapos, tumayo ang hari sa tabi ng haligi[a] at gumawa ng tipan sa harap ni Yahweh: lumakad na sumusunod kay Yahweh at tuparin ang kanyang mga utos, mga patotoo, at mga tuntunin nang buong puso at buong kaluluwa, upang isagawa ang mga salita ng tipang ito na nakasulat sa aklat na ito.[b] At sumang-ayon ang buong bayan sa tipan.[c]'
  rationale: Inayos ang ilang salin upang manatiling malapit sa mga pandiwang Hebreo nang hindi nawawala ang likas na modernong Tagalog. Pinalitan ang interpretibong “pinagtibay” ng “gumawa ng tipan,” pinakinis ang pahayag tungkol sa pagsunod kay Yahweh, at ginawang mas malinaw ang tugon ng bayan sa tipan habang iniiwan sa talababa ang literal na larawan ng “pagtayo.” Itinuwid din ang di-ligtas na alternatibong “tuntungan” sa talababa tungkol sa haligi.
