base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: tl
  text: 'Pagkatapos, tumayo ang hari sa tabi ng haligi[a] at gumawa ng tipan sa harap ni Yahweh: lumakad na sumusunod kay Yahweh at tuparin ang kanyang mga utos, mga patotoo, at mga tuntunin nang buong puso at buong kaluluwa, upang isagawa ang mga salita ng tipang ito na nakasulat sa aklat na ito.[b] At sumang-ayon ang buong bayan sa tipan.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa haligi” o “sa ibabaw ng haligi.” Ang pang-ukol sa Hebreo ay maaaring mangahulugang “sa ibabaw,” “sa,” o “sa tabi.” Maaaring tumukoy ang “haligi” sa nakatalagang tayuan ng hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa balumbong ito” o “sa dokumentong ito.” Malawak ang saklaw ng salitang Hebreo para sa isang nakasulat na kasulatan.
    reason: cultural_note
  - marker: c
    text: Sa literal, “tumayo ang buong bayan sa tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: tumayo ... sa tabi ng haligi
  rationale: Ang עמד ay “tumayo,” at ang עַל ay maaaring tumukoy sa posisyong nasa ibabaw, sa, o katabi ng isang bagay. Sa seremonyal na konteksto, natural sa Tagalog ang “sa tabi ng haligi,” habang pinananatili sa talababa ang ibang posibleng pagbasa.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: pinagtibay ang tipan
  rationale: Ang literal na idyomang Hebreo ay “pinutol ang tipan,” ngunit ang kahulugan nito ay pormal na paggawa o pagpapatibay ng tipan. Sa konteksto ng pagpapanibago ng umiiral na tipan, malinaw at natural ang “pinagtibay ang tipan.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinapahayag ang paggawa ng tipan sa presensya ni Yahweh; ang “sa harap” ay likas at marangal na katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: lalakad siyang sumusunod kay Yahweh
  rationale: Pinagsasama nito ang larawang “lumakad kasunod” sa malinaw na kahulugang pagsunod, nang hindi inaalis ang mahalagang metaporang pangtipan.
- source_word: לִשְׁמֹר
  choice: tutuparin
  rationale: Sa kontekstong legal at pangtipan, ang pandiwa ay nangangahulugang ingatan o sundin. Mas natural sa kasalukuyang Tagalog ang “tutuparin” kaugnay ng mga utos at tuntunin.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: kanyang mga utos, mga patotoo, at mga tuntunin
  rationale: Pinananatili ang tatlong magkakaugnay ngunit magkakaibang katawagang legal. Ang “patotoo” ay nagpapanatili sa natatanging diwa ng עֵדוֹת, at ang “tuntunin” ay natural na katumbas ng mga nakatakdang batas.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: nang buong puso at buong kaluluwa
  rationale: Pinananatili ang pamilyar na pormulang pangtipan at ang dalawang larawang antropolohikal ng tekstong Hebreo.
- source_word: לְהָקִים
  choice: upang isagawa
  rationale: Dito, ipinahihiwatig ng pandiwa ang pagsasakatuparan ng mga nakasulat na salita ng tipan, hindi lamang ang pasalitang pagpapatibay sa mga ito.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: mga salita ng tipang ito
  rationale: Ang literal na “mga salita” ay nagpapanatili sa tekstuwal na diin, lalo na dahil agad na binabanggit ang pagkakasulat ng mga ito.
- source_word: הַסֵּפֶר הַזֶּה
  choice: aklat na ito
  rationale: Natural sa modernong Tagalog ang “aklat,” ngunit maaaring tumukoy ang salitang Hebreo sa isang balumbon o nakasulat na dokumento, kaya inilalahad ang saklaw sa talababa.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: ang buong bayan ay nanindigan sa tipan
  rationale: Pinananatili ng “nanindigan” ang larawang pagtayo at ipinahahayag ang sama-samang matatag na pagsang-ayon sa tipan. Ang higit na literal na anyo ay nasa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Direktang ginagamit ng teksto ang pangalan ng Diyos. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang pangtipan nang hindi ito ginagawang titulo.
- issue: Kahulugan ng pormulang וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: ang buong bayan ay nanindigan sa tipan
  alternative: ang buong bayan ay pumasok sa tipan; ang buong bayan ay tumayo sa tipan
  rationale: May tensiyon sa pagitan ng literal na larawang “tumayo sa tipan” at ng idyomatikong kahulugan ng pagtanggap o pagpapatibay nito. Ang “nanindigan” ay nagpapanatili sa larawan at nagpapahiwatig ng matatag na pakikiisa nang hindi lubusang nilulutas ang idyoma.
- issue: Pag-unawa sa paggawa ng tipan
  choice: pinagtibay ang tipan
  alternative: gumawa ng tipan; pinutol ang tipan
  rationale: Tiyak ang Hebreong artikulo sa “ang tipan,” at ipinakikita ng konteksto ang seremonyal na pagpapanibago o pagpapatibay ng tipan. Iniiwasan ang literal ngunit malabong “pinutol.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga pangunahing larawang pangtipan—paglakad, buong puso at kaluluwa, at pagtayo—habang ginawang likas ang sintaks. Ginamit ang “tipan,” “patotoo,” at “tuntunin” upang mapanatili ang pormal na rehistrong legal at panrelihiyon nang hindi kumakapit sa lumang balarila.
