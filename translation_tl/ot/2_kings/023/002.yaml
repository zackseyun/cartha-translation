id: 2KI.23.2
reference: 2 Kings 23:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos, umakyat ang hari sa bahay ni Yahweh[a]. Kasama niya ang lahat ng lalaki ng Juda[b], ang lahat ng naninirahan sa Jerusalem, ang mga pari at mga propeta, at ang buong bayan—mula sa hamak hanggang sa dakila[c]. Binasa niya sa kanilang pandinig ang lahat ng salita ng Aklat ng Tipan na natagpuan sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.” Sa literal, “bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng lalaki ng Juda.” Maaaring gamitin ang pananalitang ito bilang kinatawan ng sambayanan, ngunit pinanatili rito ang panlalaking anyo.
    reason: lexical_ambiguity
  - marker: c
    text: Sa literal, “mula sa maliit hanggang sa malaki”; maaari ring “mula sa pinakamababa hanggang sa pinakadakila.”
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili ang direksiyonal na diwa ng עלה, na angkop sa pagpunta ng hari sa templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Tuwirang inililipat ang Hebreong idyomang “bahay ni YHWH”; nililinaw sa talababa na ang tinutukoy ay ang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang karaniwang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: כָל אִישׁ יְהוּדָה
  choice: lahat ng lalaki ng Juda
  rationale: Pinananatili ang panlalaking kolektibong anyo ng אִישׁ habang ipinahihiwatig sa talababa na maaari itong kumatawan sa sambayanan.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: lahat ng naninirahan sa Jerusalem
  rationale: Likas at malinaw na salin ng participial na pariralang tumutukoy sa mga nakatira sa lungsod.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: ang mga pari at mga propeta
  rationale: Karaniwang katumbas sa Filipino ng dalawang tungkuling binanggit sa teksto.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa hamak hanggang sa dakila
  rationale: Ipinahahayag ang saklaw ng buong sambayanan ayon sa antas o katayuan, habang inilalaan sa talababa ang mas literal na anyo.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Binasa niya sa kanilang pandinig
  rationale: Dahil nakasulat na aklat ang layon, “binasa” ang pinakamalinaw na kahulugan; pinananatili ng “sa kanilang pandinig” ang pampublikong-auditoryong diwa ng Hebreong idyoma.
- source_word: סֵפֶר הַבְּרִית
  choice: Aklat ng Tipan
  rationale: Tuwirang salin na nagpapanatili sa pormal na katawagan sa dokumento ng tipan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na gawing titulong “PANGINOON.”
- issue: Panlalaking kolektibo sa כָל אִישׁ יְהוּדָה
  choice: lahat ng lalaki ng Juda
  alternative: lahat ng mamamayan ng Juda
  rationale: Pinananatili ang tahasang panlalaking anyo ng אִישׁ nang hindi ipinagpapalagay na iyon lamang ang saklaw ng pagtitipon; inilalahad sa talababa ang posibleng kinatawang gamit.
- issue: Saklaw ng לְמִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa hamak hanggang sa dakila
  alternative: mula sa maliit hanggang sa malaki / mula sa pinakabata hanggang sa pinakamatanda
  rationale: Malamang na tumutukoy ang idyoma sa lahat anuman ang antas, ngunit hindi ito nililimitahan sa edad; pinananatili sa talababa ang literal na larawan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal na “bahay ni Yahweh,” “sa kanilang pandinig,” at “Aklat ng Tipan” dahil mahalaga ang mga ito sa anyo at tagpo ng Hebreo; ginamit ang mga talababa upang maipakita ang mga leksikal na alternatibo at tunay na kalabuan.
