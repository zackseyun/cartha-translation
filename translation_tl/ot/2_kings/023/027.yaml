  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: tl
  text: At sinabi ni Yahweh, “Aalisin ko rin ang Juda mula sa harapan ko, kung paanong inalis ko ang Israel. Itatakwil ko[b] ang lungsod na ito na pinili ko—ang Jerusalem—at ang bahay[a] na tungkol dito ay sinabi ko, ‘Ang pangalan ko ay doon magiging.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo.” Sa Hebreo, “bahay”; tumutukoy ito sa templo sa Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: O “At itinakwil ko na ang lungsod na ito na pinili ko—ang Jerusalem.” Maaaring basahin ang pandiwang Hebreo bilang kilos na naganap na, ngunit isinalin dito bilang panghinaharap upang umayon sa nakapaligid na pahayag ng hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos at ang kaugnayan nito sa tipan.
- source_word: אָסִיר / הֲסִרֹתִי
  choice: aalisin / pag-aalis
  rationale: Ipinahahayag ng Hiphil ng סור ang pagpapalayo o pag-aalis; pinananatili rin ng magkaugnay na anyo ang paghahambing sa sasapitin ng Juda at Israel.
- source_word: מֵעַל פָּנַי
  choice: sa harapan ko
  rationale: Malapit ito sa idyomang Hebreo at pinananatili ang relasyonal na diwa nang hindi labis na ipinapakahulugang pisikal na presensiya.
- source_word: וּמָאַסְתִּי
  choice: Itatakwil ko
  rationale: Ang מאס ay nagpapahiwatig dito ng mariing pagtanggi o pagtatakwil. Ang anyong panghinaharap ay umaayon sa pahayag ng nalalapit na hatol.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinanatili ang literal na salita at ang teolohikal na alingawngaw nito; ang tinutukoy ay ang templo sa Jerusalem.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Doon mananatili ang pangalan ko
  rationale: Natural na Filipino itong pagpapahayag ng pagiging naroon ng pangalan ng Diyos sa santuwaryo, nang hindi ginagawang tuwirang pahayag na pisikal na naninirahan doon ang Diyos.
theological_decisions:
- issue: Panahunan ng וּמָאַסְתִּי sa pahayag ng hatol
  choice: Itatakwil ko
  alternative: Itinakwil ko na
  rationale: Bagaman qatal ang anyo at maaaring unawaing ganap na ang kilos, nagpapatuloy ito sa pahayag tungkol sa nalalapit na pag-aalis sa Juda. Pinanatili sa talababa ang posibilidad ng pagbasa bilang naganap na.
- issue: Pagpapakahulugan sa הַבַּיִת
  choice: bahay
  alternative: templo
  rationale: Ang Hebreo ay literal na “bahay,” isang karaniwang tawag sa templo. Pinananatili ito sa pangunahing teksto, habang nililinaw sa talababa ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Yahweh,” “sa harapan ko,” at “bahay” upang mapangalagaan ang mahahalagang katangian ng Hebreo, habang ginawang natural ang daloy ng pangungusap. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
