revisions:
- from: At sinabi ni Yahweh, “Aalisin ko rin ang Juda sa harapan ko, gaya ng pag-aalis ko sa Israel. Itatakwil ko[b] ang lungsod na ito na pinili ko—ang Jerusalem—at ang bahay[a] na tungkol dito ay sinabi ko, ‘Doon mananatili ang pangalan ko.’”
  to: At sinabi ni Yahweh, “Aalisin ko rin ang Juda mula sa harapan ko, kung paanong inalis ko ang Israel. Itatakwil ko[b] ang lungsod na ito na pinili ko—ang Jerusalem—at ang bahay[a] na tungkol dito ay sinabi ko, ‘Ang pangalan ko ay doon magiging.’”
  rationale: Inayos ang pagsasalin ng pang-ukol upang maipakita ang “mula sa harapan ko,” at pinalitan ang “mananatili” ng anyong hindi nagdaragdag ng diwang pagpapatuloy sa simpleng pandiwang “magiging.” Pinanatili ang mga umiiral na talababa at ang wastong pagkakakabit ng kanilang mga pananda.
