  - severity: medium
    issue: Ang “mananatili” ay mas tiyak kaysa sa יִהְיֶה.
    rationale: Ang Hebreo ay nagsasabing “ang pangalan ko ay magiging/doon,” hindi tahasang “mananatili”; ang dating salin ay nagdaragdag ng aspektong duratibo.
