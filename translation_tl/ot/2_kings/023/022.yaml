base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: tl
  text: Sapagkat walang naipagdiwang na Paskuwang tulad nito mula pa noong panahon ng mga hukom na humatol sa Israel, ni sa buong panahon ng mga hari ng Israel at ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pahayag tungkol sa Paskuwa ni Josias.
- source_word: נַעֲשָׂה
  choice: ipinagdiwang
  rationale: Bagaman literal na 'ginawa,' ang pandiwa kapag tumutukoy sa Paskuwa ay likas na nangangahulugang isinagawa o ipinagdiwang ang kapistahan.
- source_word: כַּפֶּסַח הַזֶּה
  choice: isang Paskuwa na tulad nito
  rationale: 'Pinananatili ang paghahambing na ipinahihiwatig ng prefiks na כְּ: hindi sinasabing walang anumang Paskuwang naganap, kundi walang maihahambing sa Paskuwang ito.'
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: mula pa sa panahon ng mga hukom
  rationale: Natural na Filipino para sa panimulang hangganan ng saklaw na pangkasaysayan.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: na humatol sa Israel
  rationale: Pinananatili ang ugnayang leksikal sa 'mga hukom' at ang tuwirang diwa ng Hebreong pandiwa, kahit maaari rin itong magpahiwatig ng pamamahala.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: at sa buong panahon ng mga hari ng Israel at ng mga hari ng Juda
  rationale: Ipinagpapatuloy ang saklaw ng negatibong paghahambing at inuulit ang 'mga hari' upang malinaw ang pagkakaiba ng dalawang kaharian.
theological_decisions:
- issue: Saklaw ng paghahambing na pangkasaysayan
  choice: Walang Paskuwang maihahambing dito mula sa panahon ng mga hukom hanggang sa mga monarkiya ng Israel at Juda.
  alternative: Walang anumang Paskuwang ipinagdiwang sa buong panahong iyon.
  rationale: Ang כַּפֶּסַח הַזֶּה ay tahasang paghahambing, 'tulad ng Paskuwang ito,' kaya hindi dapat ipakahulugang lubusang walang naunang pagdiriwang ng Paskuwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Paskuwa' bilang nakikilalang katawagang biblikal at 'Juda' para sa kaharian. Inayos ang pangungusap upang maging natural sa Filipino habang pinananatili ang buong saklaw ng paghahambing.
