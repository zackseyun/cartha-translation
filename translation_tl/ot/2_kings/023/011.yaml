  verdict: revise
  source_fidelity: Kailangang itama ang hanay ng mga panandang-lugar. Ang מִבּוֹא ... אֶל־לִשְׁכַּת ay mas tuwirang naipapahayag bilang “mula sa pasukan ... hanggang sa silid,” samantalang ang kasalukuyang dalawang pangungusap ay ginagawang hiwalay na pahayag ang lokasyon at bahagyang pinapalabo ang ugnayan nito sa pag-aalis ng mga kabayo. Ang “inalis,” “inialay ... sa araw,” “Yahweh,” at “sinunog ... sa apoy” ay tapat sa Hebreo.
  naturalness: Natural at marangal ang rebisyon sa modernong Filipino. Iniiwasan nito ang medyo putol na “Ang mga ito ay nasa tabi...” at pinananatili ang siksik ngunit malinaw na paglalarawan ng lugar.
  terminology: Ang “opisyal ng palasyo” ay maingat para sa סָרִיס, na may talababa para sa “eunuko.” Ang “mga panlabas na bahagi” ay isang hindi labis na tiyak na salin ng bihirang פַּרְוָרִים; nililinaw ng talababa ang kawalan ng katiyakan. Ang “mga karwahe ng araw” at “Yahweh” ay dapat panatilihin.
  issues:
