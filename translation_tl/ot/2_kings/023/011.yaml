    issue: Nahiwalay ang pariralang panglugar sa pangunahing kilos.
    rationale: Ang “Ang mga ito ay nasa tabi ng silid” ay nagpapalit sa pinagsamang konstruksyong “mula sa pasukan ... hanggang sa silid” ng isang malayang pahayag at hindi gaanong nasasalamin ang daloy ng Hebreo.
  - severity: low
    issue: Masyadong tiyak ang “bakuran” para sa פַּרְוָרִים.
    rationale: Bihira at pinagtatalunang termino ang פַּרְוָרִים; mas ligtas ang “mga panlabas na bahagi,” na hindi nagtatakda ng eksaktong anyong arkitektural.
