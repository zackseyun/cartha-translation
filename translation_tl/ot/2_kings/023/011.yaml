  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: tl
  text: Inalis niya ang mga kabayong inialay ng mga hari ng Juda sa araw mula sa pasukan ng bahay ni Yahweh hanggang sa silid ni Nethan-melec, ang opisyal ng palasyo[a], na nasa mga panlabas na bahagi[b]; at sinunog niya sa apoy ang mga karwahe ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “eunuko.” Ang salitang Hebreo ay maaaring tumukoy sa isang eunuko o sa isang opisyal ng hari o ng palasyo.
    reason: lexical_alternative
  - marker: b
    text: Bihira ang salitang Hebreo rito at hindi tiyak ang eksaktong tinutukoy. Maaaring tumukoy ito sa isang gilid o panlabas na bahagi ng nasasakupan ng templo; isinasalin din itong “mga portiko” o “mga karatig na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: Inalis niya
  rationale: Ang Hiphil ng שׁבת ay nangangahulugang pinatigil o inalis sa gamit. Sa konteksto ng reporma ni Josias, natural at malinaw ang “inalis niya.”
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: inialay ng mga hari ng Juda sa araw
  rationale: Literal na “ibinigay,” ngunit ipinahihiwatig ng kontekstong panrelihiyon na itinalaga ang mga kabayo para sa pagsamba sa araw. Naipapahayag ito nang maikli ng “inialay.”
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: sa pasukan ng bahay ni Yahweh … nasa tabi ng silid
  rationale: Siksik at hindi lubos na tiyak ang pagkakaugnay ng mga panandang-lugar sa Hebreo. Inilalarawan ng salin ang kinaroroonan ng mga kabayo sa pasukan, malapit sa silid, sa halip na ipahiwatig na inilipat sila mula sa isang dulo hanggang sa isa pa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton.
- source_word: נְתַן מֶלֶךְ
  choice: Nethan-melec
  rationale: Isang pangalang pantangi; ang anyo ay malapit sa tunog ng tekstong Masoretiko at madaling basahin sa Filipino.
- source_word: הַסָּרִיס
  choice: opisyal ng palasyo
  rationale: Maaaring tumukoy ang סָרִיס sa isang eunuko o sa isang opisyal ng hari. Hindi tiyak sa konteksto ang pisikal na kalagayan ng tao, kaya ang tungkulin ang inilagay sa pangunahing teksto at ang alternatibo ay nasa talababa.
- source_word: בַּפַּרְוָרִים
  choice: sa panlabas na bahagi ng bakuran
  rationale: Bihira at hindi tiyak ang terminong ito, ngunit malamang na tumutukoy sa isang panlabas o gilid na bahagi ng nasasakupan ng templo. Pinanatili sa talababa ang kawalan ng katiyakan.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: mga karwahe ng araw
  rationale: Tuwirang pinananatili ang larawang panrelihiyon sa Hebreo nang hindi ipinapaliwanag nang lampas sa teksto.
- source_word: שָׂרַף בָּאֵשׁ
  choice: sinunog niya sa apoy
  rationale: Pinananatili ang tahasang pagbanggit ng apoy sa Hebreo, kahit likas na may apoy na ipinahihiwatig ang pandiwang “sinunog.”
theological_decisions:
- issue: Paglalapat ng mga kabayo at karwahe sa araw
  choice: “inialay … sa araw” at “mga karwahe ng araw”
  alternative: “ibinigay … para sa araw”
  rationale: Malinaw ang kaugnayang kultiko sa konteksto, ngunit hindi tinukoy sa salin kung ang “araw” ay pangalan ng isang partikular na diyos. Sa gayon, hindi nilulutas nang higit sa teksto ang anyo ng pagsamba.
- issue: Pagbibigay ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang personal na banal na pangalan, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang karaniwang katawagan sa templo sa Hebreo, “opisyal ng palasyo” upang maiwasang gawing tiyak ang hindi tiyak na kahulugan ng סָרִיס, at dalawang pangungusap upang maging malinaw ang masalimuot na hanay ng mga lokasyon sa orihinal.
