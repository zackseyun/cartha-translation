base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: tl
  text: Bago siya, walang haring tulad niya na nanumbalik[a] kay Yahweh nang buong puso, buong kaluluwa, at buong lakas[b][c], ayon sa buong Kautusan ni Moises. Pagkatapos niya, wala ring bumangong haring tulad niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bumaling.” Maaaring ipahiwatig ng pandiwang Hebreo ang pagbabalik-loob kay Yahweh nang may pagsisisi at panibagong katapatan sa tipan.
    reason: lexical_alternative
  - marker: b
    text: O, “buong kakayahan.” Ang salitang Hebreo ay tumutukoy sa kabuuan ng lakas o kakayahan ng isang tao.
    reason: lexical_alternative
  - marker: c
    text: Ang “buong puso, buong kaluluwa, at buong lakas” ay umaalingawngaw sa Deuteronomio 6:5.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: At walang naging haring tulad niya bago siya
  rationale: Pinananatili nito ang mariing paghahambing sa Hebreo habang gumagamit ng natural na ayos ng pangungusap sa makabagong Tagalog.
- source_word: שָׁב אֶל יְהוָה
  choice: nanumbalik kay Yahweh
  rationale: Ang שׁוּב na may אֶל ay maaaring magpahiwatig ng pagbabalik-loob at muling katapatan sa tipan. Ang “nanumbalik” ay nagpapanatili sa diwa ng pagbabalik nang hindi ito nililimitahan sa isang tiyak na pormulasyong doktrinal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh ang Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: nang buong puso, buong kaluluwa, at buong lakas
  rationale: Natural at pamilyar sa Tagalog ang tatluhang parirala, at pinananatili nito ang malinaw na alingawngaw ng Deuteronomio 6:5.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: ayon sa buong Kautusan ni Moises
  rationale: Bagaman maaari ring mangahulugan ng “tagubilin” ang תּוֹרָה, tumutukoy ito rito sa kabuuan ng Kautusang Mosaiko sa konteksto ng pagsusuri sa isang hari.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: At wala ring bumangong tulad niya pagkatapos niya
  rationale: Ang “bumangon” ay malapit sa קָם at natural na nagpapahayag na walang sumunod na haring maihahambing sa kaniya.
theological_decisions:
- issue: Ang paglalarawan sa lubos na katapatan ni Josias ay umaalingawngaw sa Deuteronomio 6:5.
  choice: Pinanatili ang “buong puso, buong kaluluwa, at buong lakas.”
  alternative: buong puso, buong buhay, at buong kakayahan
  rationale: Pinananatili ng piniling anyo ang intertekstuwal na ugnayan at ang saklaw ng buong pagkatao, nang hindi nagpapataw ng mas makitid na antropolohiyang doktrinal.
- issue: Paglalahad sa שָׁב אֶל יְהוָה
  choice: nanumbalik kay Yahweh
  alternative: bumaling kay Yahweh
  rationale: Maaaring saklawin ng pandiwa ang pagbabalik, pagsisisi, at muling katapatan sa tipan. Ang pangunahing salin at talababa ay magkasamang nagpapanatili sa saklaw na ito.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; kaya pinanatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “haring” at “Kautusan” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang gitling na mahaba ay tumutulong na linawin na ang kasunod na sugnay ay naglalarawan sa natatanging hari.
