revisions:
- from: At walang naging haring tulad niya bago siya—isang haring nanumbalik[a] kay Yahweh nang buong puso, buong kaluluwa, at buong lakas[b], ayon sa buong Kautusan ni Moises.[c] At wala ring bumangong tulad niya pagkatapos niya.
  to: Bago siya, walang haring tulad niya na nanumbalik[a] kay Yahweh nang buong puso, buong kaluluwa, at buong lakas[b][c], ayon sa buong Kautusan ni Moises. Pagkatapos niya, wala ring bumangong haring tulad niya.
  rationale: Inayos ang unang pangungusap upang tuwirang maipahayag ang Hebreong paghahambing at upang ang sugnay na naglalarawan sa hari ay malinaw na maiugnay sa “haring tulad niya.” Inayos din ang mga angkla ng talababa upang tumugma ang bawat isa sa salita o pariralang ipinapaliwanag nito. Napanatili ang saklaw ng שׁוּב sa “nanumbalik,” ang banal na pangalang “Yahweh,” at ang alingawngaw ng Deuteronomio 6:5.
