  terminology: Ang “punong pari,” “templo ni Yahweh,” “hukbo ng langit,” at “kagamitan” ay angkop. Pinanatili ang Yahweh ayon sa ibinigay na patakaran. Ang pangalang “Ashera” at ang talababa ay hindi dapat magpasiya nang walang batayan kung diyosa ba o kultikong bagay ang tinutukoy.
