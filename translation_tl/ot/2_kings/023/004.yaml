id: 2KI.23.4
reference: 2 Kings 23:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: tl
  text: Pagkatapos, inutusan ng hari si Hilkias na punong pari, ang mga pari ng ikalawang antas, at ang mga tagapagbantay ng pintuan na ilabas mula sa templo ni Yahweh ang lahat ng kagamitang ginawa para kay Baal, para kay Ashera[a], at para sa buong hukbo ng langit. Sinunog niya ang mga iyon sa labas ng Jerusalem, sa mga bukirin ng Kidron, at dinala ang alikabok ng mga iyon sa Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “poste ni Ashera.” Ang salitang Hebreo ay maaaring tumukoy sa diyosang si Ashera o sa isang bagay na pangkulto na kaugnay niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: inutusan ng hari
  rationale: Pinananatili ang awtoritatibong diwa ng צוה at ang titulong ginamit sa Hebreo, sa natural na ayos ng modernong Tagalog.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: si Hilkias na punong pari
  rationale: Ang “punong pari” ang malinaw at nakaugaliang tawag sa pinakamataas na katungkulang pansaserdote; isina-Tagalog ang anyo ng pangalan bilang Hilkias.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: mga paring pangalawa sa ranggo
  rationale: Ipinahahayag ang ikalawang antas o ranggo nang hindi ipinapalagay ang mas tiyak na institusyonal na tungkuling hindi malinaw sa parirala.
- source_word: שֹׁמְרֵי הַסַּף
  choice: mga tagapagbantay ng pintuan
  rationale: Natural sa Tagalog at malinaw ang opisyal na tungkulin; ang סף ay literal na bungad o pasukan ngunit tumutukoy rito sa pintuan ng templo.
- source_word: מֵהֵיכַל יְהוָה
  choice: mula sa templo ni Yahweh
  rationale: Sa konteksto ng mga pari at kagamitang pangkulto, היכל ay templo; pinananatili ang personal na pangalang Yahweh.
- source_word: כָּל הַכֵּלִים
  choice: lahat ng kagamitan
  rationale: Ang “kagamitan” ay malawak at natural na katumbas ng mga sisidlan, kasangkapan, at iba pang bagay na ginagamit sa kulto.
- source_word: לַבַּעַל וְלָאֲשֵׁרָה
  choice: para kay Baal, para kay Ashera
  rationale: Ang pagkakahanay sa Baal at hukbo ng langit ay sumusuporta sa personal na pagbasa, habang pinananatili sa talababa ang posibilidad na tumukoy ang Ashera sa bagay na pangkulto.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: buong hukbo ng langit
  rationale: Pinananatili ang tradisyonal at sadyang malawak na larawan ng mga bagay o nilalang sa kalangitan na sinasamba.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: sa mga bukid sa Kidron
  rationale: Isinasalin ang שדמות bilang mga bukid; ang Kidron ay pinananatiling pangalan ng lugar, habang hindi labis na tinutukoy kung lambak o batis ang ugnayan.
- source_word: עֲפָרָם
  choice: alabok ng mga iyon
  rationale: Mas malapit sa עפר kaysa “abo” at maaaring tumukoy sa pinong nalabi matapos sunugin o durugin ang mga kagamitan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng אֲשֵׁרָה
  choice: Ashera sa pangunahing teksto, na may talababa
  alternative: poste ni Ashera; imahen o bagay na pangkulto na kaugnay ni Ashera
  rationale: Maaaring tumukoy ang salita sa diyosa o sa bagay na pangkulto na kaugnay niya. Hindi nilulutas nang tahimik ang tunay na leksikal na kalabuan.
- issue: Kahulugan ng צְבָא הַשָּׁמָיִם
  choice: hukbo ng langit
  alternative: lahat ng bagay sa kalangitan; mga bituin at iba pang bagay sa langit
  rationale: Pinananatili ang lawak at posibleng teolohikal na tensiyon ng idyomang Hebreo sa halip na limitahan ito sa isang tiyak na uri ng makalangit na bagay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari,” “pangalawa sa ranggo,” at “tagapagbantay ng pintuan” upang maging malinaw sa karaniwang mambabasa nang hindi labis na binibigyang-kahulugan ang mga katungkulang Hebreo. Ang marker na [a] ay inilagay kaagad pagkatapos ng “Ashera,” na siyang salitang tinatalabaan.
