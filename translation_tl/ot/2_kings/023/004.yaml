  to: Pagkatapos, inutusan ng hari si Hilkias na punong pari, ang mga pari ng ikalawang antas, at ang mga tagapagbantay ng pintuan na ilabas mula sa templo ni Yahweh ang lahat ng kagamitang ginawa para kay Baal, para kay Ashera[a], at para sa buong hukbo ng langit. Sinunog niya ang mga iyon sa labas ng Jerusalem, sa mga bukirin ng Kidron, at dinala ang alikabok ng mga iyon sa Bethel.
