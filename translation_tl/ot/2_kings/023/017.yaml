  source_fidelity: 'Kailangang itama ang “lingkod ng Diyos.” Ang איש האלהים ay isang nakapirming pamagat na literal na “tao ng Diyos” at hindi dapat palitan ng “lingkod,” na nagdaragdag ng ibang paglalarawan. Ang natitirang salin ay tapat sa Hebreo: ang nakikitang pananda, ang libingan, ang pinanggalingang Juda, ang pagpapahayag, at ang adversatibong “laban sa altar” ay naipapahayag nang maayos.'
  naturalness: Natural at marangal ang daloy sa modernong Filipino. Ang “panandang batong iyon” ay nauunawaan, bagaman ang “panandang bato” ay bahagyang mas tiyak kaysa sa malawak na Hebreong termino; pinananatili itong katanggap-tanggap dahil sinusuportahan ito ng konteksto at ng talababa.
  terminology: Gamitin ang “tao ng Diyos” para sa איש האלהים. Ito ang transparent, kinikilalang terminong biblikal sa Filipino at hindi nito ikinakabit ang pamagat sa mas malawak na “lingkod” o sa mas makitid na “propeta.” Ang “Juda,” “Bethel,” “altar,” at “libingan” ay angkop.
