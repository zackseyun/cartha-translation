base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Ano ang panandang batong[a] iyon na nakikita ko?” Sinabi sa kanya ng mga lalaki sa lungsod, “Iyan ang libingan ng tao ng Diyos na dumating mula sa Juda at nagpahayag[b] ng mga bagay na ito na ginawa mo laban sa altar sa Bethel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palatandaan,” “batong pang-alaala,” o “pananda sa libingan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tumawag” o “sumigaw laban sa”; tumutukoy ang pandiwa sa propetikong pahayag ng tao ng Diyos tungkol sa altar (tingnan ang 1 Hari 13:1–2).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: panandang bato
  rationale: Tumutukoy ang pangngalan sa isang nakikitang tanda o batong palatandaan, at sa konteksto ay kaugnay ito ng isang libingan. Mas tiyak at natural ito kaysa sa malawak na “monumento,” ngunit hindi nito ipinapalagay ang eksaktong anyo ng bagay.
- source_word: הַלָּז
  choice: iyon
  rationale: Ang anyo ay deiktiko at tumutukoy sa bagay na nakikita ni Josias; natural sa Filipino ang “iyon” sa tanong na ito.
- source_word: אֲנִי רֹאֶה
  choice: nakikita ko
  rationale: Likas na ipinahahayag nito sa Filipino ang kasalukuyang pagtanaw na nasa Hebreong participle.
- source_word: הַקֶּבֶר
  choice: libingan
  rationale: Saklaw ng “libingan” ang puntod o pook na pinaglibingan at angkop sa konteksto ng may nakikitang pananda.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Sa modernong Filipino, ang literal na “lalaki ng Diyos” ay madaling maunawaan bilang paglalarawan sa kabanalan sa halip na isang kinikilalang tungkulin. Ipinahahayag ng “lingkod ng Diyos” ang tradisyonal na titulong tumutukoy sa taong inatasan ng Diyos nang hindi ito nililimitahan sa salitang “propeta.”
- source_word: מִיהוּדָה
  choice: mula sa Juda
  rationale: Karaniwan at tuwirang pagtukoy sa pinanggalingang lugar.
- source_word: וַיִּקְרָא
  choice: nagpahayag
  rationale: Sa konteksto ng 1 Hari 13:1–2, ito ay hayagang propetikong pagpapahayag. Pinananatili ng “nagpahayag” ang puwersang iyon nang hindi nagdaragdag ng detalye.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mga bagay na ito
  rationale: Pinananatili nito ang lawak ng Hebreo, na maaaring tumukoy kapwa sa ipinahayag na mga salita at sa mga pangyayaring inihula.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: na ginawa mo
  rationale: Natural na anyong pangnagdaan sa Filipino para sa mga kilos ni Josias na katatapos lamang ilarawan.
- source_word: עַל הַמִּזְבֵּחַ
  choice: laban sa altar
  rationale: Ipinakikita ng konteksto ng paghatol at paggiba ang adversatibong diwa ng pang-ukol, hindi lamang ang neutral na “tungkol sa.”
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Paglalarawan sa propetikong pahayag na tinutukoy sa talata
  choice: nagpahayag
  alternative: tumawag; sumigaw laban sa
  rationale: Nililinaw nito na isang pampublikong propetikong deklarasyon ang ginawa ng lingkod ng Diyos, ngunit hindi nagdaragdag ng nilalaman mula sa 1 Hari 13.
- issue: Pagsasalin sa titulong אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: lalaki ng Diyos; propeta ng Diyos
  rationale: Iniiwasan ng “lingkod ng Diyos” ang di-likas at posibleng mapanlinlang na literalismo ng “lalaki ng Diyos,” habang hindi rin tahasang pinapalitan ang titulo ng mas makitid na “propeta.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “panandang bato” upang maipahiwatig ang nakikitang funerary marker nang hindi labis na tinutukoy ang anyo nito. Ang ayos ng pangungusap ay pinagaan para sa natural na daloy ngunit pinanatili ang pagkakasunod at mga ugnayan ng Hebreo.
