- from: Dalawampu't limang taong gulang si Jehoiakim nang siya ay maging hari, at labing-isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Zebida na anak ni Pedaya, mula sa Ruma.
  to: Dalawampu't limang taong gulang si Jehoiakim nang magsimula siyang maghari, at labing-isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Zebida na anak ni Pedaya, mula sa Ruma.
