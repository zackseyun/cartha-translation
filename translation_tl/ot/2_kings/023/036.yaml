base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: tl
  text: Dalawampu't limang taong gulang si Jehoiakim nang magsimula siyang maghari, at labing-isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Zebida na anak ni Pedaya, mula sa Ruma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Karaniwang idyomang Hebreo ito para sa edad; likas at tumpak sa modernong Tagalog ang napiling anyo.
- source_word: בְּמָלְכוֹ
  choice: nang siya ay maging hari
  rationale: Ipinahihiwatig ng parirala ang panahon ng pagluklok niya bilang hari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ng pandiwa ang pamamahala bilang hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tinutukoy ng pariralang lokatibo ang sentro ng kanyang paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Likas na Tagalog para sa karaniwang pormulang pangangkan.
- source_word: זבידה
  choice: Zebida
  rationale: Transliterasyong Filipino batay sa anyong katinig ng pangalang Hebreo sa WLC.
- source_word: בַת פְּדָיָה
  choice: anak ni Pedaya
  rationale: Sa kontekstong malinaw nang babae si Zebida, natural na Tagalog ang 'anak ni' para sa ugnayang filial.
- source_word: מִן רוּמָה
  choice: mula sa Ruma
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan o bayang pinanggalingan.
