  source_fidelity: Tumpak ang edad, labing-isang taong paghahari sa Jerusalem, pangalan ng ina, ugnayang anak, at pinagmulan sa Ruma. Mas tuwirang naihahayag ng “nang magsimula siyang maghari” ang panahon ng pagluklok/pagsisimula ng paghahari na nasa בְּמָלְכוֹ.
  naturalness: Malinaw at marangal ang salin. Ang “nang siya ay maging hari” ay nauunawaan ngunit bahagyang di-singaw sa modernong Tagalog sa nakaraang pangyayaring ito; mas likas ang “nang magsimula siyang maghari.”
  terminology: Ang “naghari,” “Jerusalem,” at mga anyong pangalang Jehoiakim, Zebida, Pedaya, at Ruma ay katanggap-tanggap at magkakatugma sa karaniwang Filipino/Tagalog na gamit sa Bibliya. Ang “anak ni” ay sapat sapagkat malinaw sa pangalan at panghalip na babae si Zebida.
