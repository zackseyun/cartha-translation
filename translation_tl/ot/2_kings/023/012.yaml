  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: tl
  text: Ang mga altar sa bubong ng silid sa itaas ni Ahaz[a], na ginawa ng mga hari ng Juda, at ang mga altar na ginawa ni Manases sa dalawang patyo ng bahay ni Yahweh ay giniba ng hari. Dinurog niya ang mga iyon doon at itinapon ang alabok ng mga iyon sa Lambak ng Kidron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itaas na silid ni Ahaz” o “itaas na palapag ni Ahaz.” Maaaring tumukoy ang salitang Hebreo sa isang silid sa itaas o sa itaas na palapag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Batis ng Kidron.” Ang salitang Hebreo ay maaaring tumukoy sa isang batis, tuyong daluyan ng tubig, bangin, o lambak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: mga altar
  rationale: Tuwirang kahulugan ng מִזְבֵּחַ ang altar; pinanatili ang anyong maramihan sa dalawang paglitaw.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: sa bubong ng silid sa itaas ni Ahaz
  rationale: Karaniwang tumutukoy ang עֲלִיָּה sa isang silid sa itaas. Malinaw ang salin ngunit hindi nito tiyakang ipinapalagay kung hiwalay na silid o buong palapag ang tinutukoy.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: na ginawa ng mga hari ng Juda
  rationale: Pinananatili ang sugnay na naglalarawan sa mga altar at ang maramihang simuno.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: sa dalawang patyo ng bahay ni Yahweh
  rationale: Ang חָצֵר ay patyo o looban. Pinanatili ang Hebreong idyomang 'bahay ni Yahweh' sa halip na ipalit ang paliwanag na 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: נָתַץ
  choice: giniba
  rationale: Ang pandiwa ay tumutukoy sa paggiba o pagbuwag ng isang estruktura; likas sa Filipino ang 'giniba' para sa mga altar.
- source_word: וַיָּרָץ מִשָּׁם
  choice: Dinurog niya ang mga iyon doon
  rationale: Sa konteksto, nauunawaan ang anyo bilang pagdurog sa mga ginibang altar, gaya ng pinatutunayan ng kasunod na pagtukoy sa alabok ng mga iyon. Hindi ang di-angkop na diwang 'tumakbo mula roon' ang ginamit.
- source_word: עֲפָרָם
  choice: ang alabok ng mga iyon
  rationale: Ang עָפָר ay alabok o pinong lupa; pinananatili nito ang larawan ng mga altar na nadurog nang pino.
- source_word: נַחַל קִדְרוֹן
  choice: Lambak ng Kidron
  rationale: Maaaring tumukoy ang נַחַל sa batis, bangin, o lambak na dinadaluyan ng tubig. Ang 'Lambak ng Kidron' ay malinaw sa modernong Filipino habang inilalahad sa talababa ang alternatibo.
- source_word: וְאֶת ... וְאֶת
  choice: Ang mga altar ... at ang mga altar ... ay giniba ng hari
  rationale: Pinanatili sa abot ng likas na Filipino ang dalawang inuunang tuwirang layon ng Hebreo bago ihayag ang pangunahing kilos ng hari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang 'Yahweh' ay mas malapit na transliterasyon at hindi pinapalitan ang pangalan ng titulong 'Panginoon.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'altar,' 'patyo,' at 'giniba' bilang karaniwan at likas na mga salita. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap upang maging malinaw, habang pinananatili ang pagkakasunod ng mga kilos at ang diin sa dalawang pangkat ng mga altar.
