  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: tl
  text: At sinabi niya, “Hayaan ninyo siya. Huwag galawin ng sinuman ang kanyang mga buto.” Kaya hindi nila ginalaw ang kanyang mga buto, pati ang mga buto ng propetang dumating mula sa Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Hayaan ninyo siya
  rationale: Likas na utos sa modernong Tagalog na tigilan at huwag pakialaman ang mga labi ng taong tinutukoy.
- source_word: אִישׁ אַל יָנַע עַצְמֹתָיו
  choice: Huwag galawin ng sinuman ang kanyang mga buto
  rationale: Ang אִישׁ ay may pangkalahatang diwa rito, kaya malinaw na naipahahayag ng “sinuman”; ang “galawin” ay tuwirang tumutukoy sa pag-alis o paggambala sa mga buto.
- source_word: עַצְמֹתָיו
  choice: kanyang mga buto
  rationale: Pinananatili ang kongkreto at paulit-ulit na salitang “mga buto” sa Hebreo sa halip na gawing mas malawak na “mga labi.”
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: Kaya hindi nila ginalaw ang kanyang mga buto
  rationale: Sa konteksto, ang piel ng מלט ay nangangahulugang iniligtas o hindi pininsala ang mga buto; inuugnay ito ng salin sa naunang pagbabawal nang natural sa Tagalog.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: pati ang mga buto ng propeta
  rationale: Ang “pati” ay malinaw na nagdaragdag sa mga buto ng propeta bilang kasama sa mga hindi nila ginalaw.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: na nagmula sa Samaria
  rationale: Ipinahahayag ang pinanggalingan ng propeta nang natural, nang hindi nagpapasya kung ang diin ay sa pagdating o sa lugar na kanyang pinanggalingan.
