  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: tl
  text: Pagkatapos, nagsugo ang hari[a], at nagtipon sa kaniya ang lahat ng nakatatanda ng Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “Pagkatapos, ipinatawag ng hari ang lahat ng nakatatanda ng Juda at Jerusalem, at nagtipon sila sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Ang שׁלח ay literal na tumutukoy sa pagsusugo, malamang ng mga mensahero o ng isang utos. Pinananatili ng “nagsugo” ang kawalan ng tahasang layon sa Hebreo, sa halip na agad idagdag na ipinatawag niya ang mga pinuno.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalang may artikulo ito. Bagaman si Josias ang hari sa konteksto, pinananatili ang titulong ginamit mismo ng talata.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: nagtipon sa kaniya
  rationale: 'Aktibong pangmaramihan ang anyong Hebreo: “nagtipon sila sa kaniya.” Likas sa Tagalog na ang kasunod na pariralang “ang lahat ng matatandang pinuno” ang maging tahasang simuno, kaya hindi kailangang gawing balintiyak.'
- source_word: כָּל
  choice: lahat
  rationale: Karaniwang katumbas na nagpapanatili sa saklaw at kabuuan ng pagtitipon.
- source_word: זִקְנֵי
  choice: matatandang pinuno
  rationale: Sa kontekstong pampamahalaan, ang זקנים ay mga kinikilalang nakatatanda at pinuno ng pamayanan, hindi lamang matatandang lalaki. Nililinaw ito ng “matatandang pinuno” sa karaniwang modernong Tagalog.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Tagalog ng pangalan ng kaharian o lupain.
- source_word: וִירוּשָׁלִָם
  choice: at Jerusalem
  rationale: Karaniwang anyong Tagalog ng pangalan ng lungsod, na kaugnay ng Juda sa iisang pariralang pinagmulan ng mga pinuno.
