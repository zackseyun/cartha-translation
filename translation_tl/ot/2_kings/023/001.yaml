translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang maipahayag ang institusyonal na kahulugan ng זקנים nang hindi ito mapagkamalang simpleng pagtukoy sa edad. Ang kuwit bago ang [a] ay nag-uugnay sa talababa sa “nagsugo” habang pinananatiling maayos ang daloy ng pangungusap.
