  source_fidelity: Ang pangunahing sugnay ay wastong sumasalamin sa Hebreong וַיִּשְׁלַח, na walang tahasang layon at maaaring mangahulugang nagsugo ng mga mensahero o nagpadala upang ipatawag ang mga tao. Wasto rin ang aktibong diwa ng “nagtipon sa kaniya” para sa וַיַּאַסְפוּ אֵלָיו. Gayunman, ang “matatandang pinuno” ay masyadong nagpapakahulugan sa זִקְנֵי sa pamamagitan ng tahasang pagtukoy kapwa sa edad at sa pagiging pinuno.
  naturalness: Mas natural at mas matipid sa modernong Filipino Tagalog ang “mga nakatatanda” bilang katawagan sa kinikilalang pangkat ng mga elder. Ang “nagsugo ang hari” ay may marangal at biblikal na rehistro at, sa tulong ng talababa, pinananatili ang hindi tahasang layon ng Hebreo.
  terminology: Gamitin ang “mga nakatatanda” para sa זִקְנֵי. Hindi nito ipinipilit na ang tinutukoy ay mga pinunong tinukoy lamang sa edad, ngunit maaari pa ring tumukoy sa institusyonal na mga elder ayon sa konteksto. Ang “Juda” at “Jerusalem” ay angkop na mga anyo ng pangalan.
