  - severity: low
    issue: Medyo hindi likas ang “tributong isang daang talento ng pilak.”
    rationale: 'Bagaman nauunawaan, mas malinaw sa modernong Filipino ang “ng tributo: isang daang talento ng pilak...” para maipakita ang halaga ng ipinataw.'
  - severity: low
