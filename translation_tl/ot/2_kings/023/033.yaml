  naturalness: Malinaw at marangal ang Tagalog. Mas natural at mas madaling basahin ang paglalahad ng halaga ng tributo sa pamamagitan ng tutuldok kaysa sa siksik na “tributong isang daang talento.”
  terminology: Ang “Paraon Neco,” “Ribla,” “Hamat,” at “talento” ay angkop. Ang “tributo” ay isang mabuting kontekstuwal na salin ng עֹנֶשׁ, habang pinananatili ng talababa ang saklaw na “multa” at “bayad bilang parusa.”
