base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: tl
  text: 'Ikinulong[a] siya ni Paraon Neco sa Ribla, sa lupain ng Hamat, upang hindi siya maghari sa Jerusalem.[b] Pinatawan niya ang lupain ng tributo[c]: isang daang talento ng pilak at isang talento ng ginto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iginapos” o “pinigilang makaalis.”
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang Hebreo ay maaari ring isaling “mula sa paghahari sa Jerusalem.”
    reason: alternative_reading
  - marker: c
    text: O “multa” o “bayad bilang parusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: Ikinulong siya
  rationale: Ang אסר ay maaaring mangahulugang gumapos o magbilanggo. Sa konteksto ng sapilitang pagpigil sa isang hari, malinaw at natural sa modernong Tagalog ang “ikinulong,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: פַרְעֹה נְכֹה
  choice: Paraon Neco
  rationale: Pinanatili ang titulong “Paraon” at isinalin sa baybay-Tagalog ang pangalang Neco nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: בְרִבְלָה
  choice: sa Ribla
  rationale: Natural gamitin ang “sa” para sa lugar; ang pangalang Ribla ay inangkop sa karaniwang baybay-Tagalog.
- source_word: בְּאֶרֶץ חֲמָת
  choice: sa lupain ng Hamat
  rationale: Ang אֶרֶץ ay tumutukoy rito sa isang heograpikong nasasakupan; pinananatili ng “lupain ng Hamat” ang anyo at diwa ng Hebreo.
- source_word: במלך בִּירוּשָׁלָם
  choice: upang hindi na siya maghari sa Jerusalem
  rationale: Sa konteksto, ang parirala ay nagpapahayag ng pagpigil sa pagpapatuloy ng paghahari niya sa Jerusalem. Ang “hindi na” ay natural na naghahayag ng pagtigil, ngunit inilalagay sa talababa ang mas malapit-sa-anyo na alternatibong pagbasa.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: Pinatawan niya ... ng tributo
  rationale: Ang עֹנֶשׁ ay isang ipinataw na bayarin, multa, o parusa. Dahil ipinataw ito sa lupain at tinukoy sa pilak at ginto, ipinahahayag ng “tributo” ang pampolitika at pang-ekonomiyang gamit nito, habang pinananatili sa talababa ang ibang posibleng kahulugan.
- source_word: עַל הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang kolektibong pagtukoy sa lupain o bansang pinasan ng ipinataw na bayarin, sa halip na tahasang palitan ito ng “mga mamamayan.”
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: isang daang talento ng pilak
  rationale: Pinanatili ang sinaunang yunit na כִּכָּר bilang “talento” upang hindi magpataw ng di-tiyak na makabagong katumbas sa timbang.
- source_word: וְכִכַּר זָהָב
  choice: at isang talento ng ginto
  rationale: Pinanatili ang isahang bilang at ang sinaunang yunit ng timbang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang mga sinaunang pangalan at yunit sa pamilyar na anyong Tagalog. Ang “tributo” ay mas tiyak kaysa karaniwang “buwis” para sa ipinataw na bayaring pampolitika, ngunit hindi itinago ang saklaw ng kahulugan ng salitang Hebreo.
