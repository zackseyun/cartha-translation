base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: tl
  text: At ibinigay ni Jehoiakim sa Paraon ang pilak at ginto. Ngunit pinatawan niya ng buwis ang lupain[a] upang maibigay ang pilak ayon sa utos ng Paraon.[b] Sapilitan niyang siningil ang mga tao ng lupain ng pilak at ginto—bawat isa ayon sa halagang itinakda para sa kanya[c]—upang ibigay kay Paraon Neco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinasa ang lupain” o “pinatawan ng pagtatasa ang lupain.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtatakda ng halagang dapat bayaran.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ayon sa bibig ng Paraon,” ibig sabihin, ayon sa kanyang utos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “bawat isa ayon sa kanyang pagtatasa,” o, nang mas malaya, “bawat isa ayon sa kanyang kakayahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: pinatawan niya ng buwis
  rationale: Sa kontekstong piskal, ang Hiphil na pandiwa ay tumutukoy sa pagpapataw ng pagtatasa o singilin sa lupain. Likas sa modernong Tagalog ang pariralang ito, habang inilalahad sa talababa ang mas literal na posibilidad.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang teritoryal na diwa ng Hebreo at ang ugnayan nito sa kasunod na pariralang “mga mamamayan ng lupain.”
- source_word: עַל־פִּי פַרְעֹה
  choice: ayon sa utos ng Paraon
  rationale: Idyoma itong literal na “ayon sa bibig ng Paraon” ngunit nangangahulugang alinsunod sa kanyang sinabi o iniutos.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: bawat isa ayon sa halagang itinakda sa kanya
  rationale: Ipinahihiwatig ng parirala ang indibiduwal na pagtatasa. Hindi nito tiyak na sinasabing ang batayan ay kakayahang magbayad, kaya hindi iyon inilagay sa pangunahing teksto.
- source_word: נָגַשׂ
  choice: sapilitan niyang siningil
  rationale: Pinananatili nito ang diwa ng pamimilit o mahigpit na paniningil, na mas malakas kaysa sa payak na “kinolekta.”
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Malapit ito sa Hebreong pananalita at hindi nagpapasya kung isang tiyak na uring panlipunan lamang ang tinutukoy.
- source_word: פַרְעֹה נְכֹה
  choice: Paraon Neco
  rationale: Ginamit ang karaniwang transliterasyon ng pangalan at ang nakasanayang titulong “Paraon” sa Filipino.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: ang pilak at ginto
  rationale: Tuwirang pinananatili ang dalawang mahalagang metal; bagaman maaaring gamiting salapi ang pilak, hindi ito pinalitan ng mas interpretibong “pera.”
- source_word: נָתַן
  choice: ibinigay
  rationale: Ito ang payak at tuwirang kahulugan ng pandiwa, kahit na tributo ang tinutukoy sa konteksto.
