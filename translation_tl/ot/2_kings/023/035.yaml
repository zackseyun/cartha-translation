translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapilitan niyang siningil” upang maipakita ang mapilit na himig ng Hebreo, at pinanatili ang “mga mamamayan ng lupain” upang maiwasang tukuyin nang walang katiyakan ang kanilang uring panlipunan.
