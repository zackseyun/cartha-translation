  to: At ibinigay ni Jehoiakim sa Paraon ang pilak at ginto. Ngunit pinatawan niya ng buwis ang lupain[a] upang maibigay ang pilak ayon sa utos ng Paraon.[b] Sapilitan niyang siningil ang mga tao ng lupain ng pilak at ginto—bawat isa ayon sa halagang itinakda para sa kanya[c]—upang ibigay kay Paraon Neco.
