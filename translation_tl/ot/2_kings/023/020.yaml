  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: tl
  text: Kinatay niya sa ibabaw ng mga altar ang lahat ng paring naroon sa mga sambahan sa matataas na lugar[a], at sinunog niya sa mga altar ang mga buto ng tao. Pagkatapos, bumalik siya sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Inihandog niya ang lahat ng paring naroon sa mga sambahan sa matataas na lugar.” Maaaring may sakripisyal na pahiwatig ang pandiwang Hebreo, ngunit sa kontekstong ito ay malamang na binibigyang-diin nito ang marahas na pagkatay habang nililipol ang mga sambahang iyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Pinatay
  rationale: Maaaring tumukoy ang זבח sa pagkatay o paghahandog. Sa kontekstong ito ng marahas na paglipol sa mga ilegal na sambahan, malinaw at natural ang “pinatay,” habang pinananatili sa talababa ang posibleng pahiwatig na sakripisyal.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: mga pari sa matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na pook-sambahan na karaniwang itinuturing na ilegal sa salaysay ng Mga Hari. Ang “matataas na sambahan” ay mas madaling maunawaan kaysa literal na “matataas na lugar” at nananatiling malapit sa terminong Hebreo.
- source_word: אֲשֶׁר שָׁם
  choice: naroon
  rationale: Maikli at natural na katumbas ng pariralang lokatibo, na tumutukoy sa mga paring nasa mga pook na iyon.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: sa ibabaw ng mga altar
  rationale: Tahasan nitong pinananatili ang lokasyong ipinahihiwatig ng עַל at iniiwasang magmukhang simpleng pagpatay lamang sa tabi ng mga altar.
- source_word: עַצְמוֹת אָדָם
  choice: mga buto ng tao
  rationale: Ang אָדָם ay pangkalahatang tumutukoy sa tao, hindi partikular sa lalaki. Likas at tumpak sa Filipino ang “mga buto ng tao.”
- source_word: עֲלֵיהֶם
  choice: roon
  rationale: Ang tinutukoy ay ang mga altar. Ang “roon” ay natural sa Filipino at sapat na malinaw mula sa naunang parirala.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Pagkatapos, bumalik siya sa Jerusalem
  rationale: Ipinahahayag ng “Pagkatapos” ang sunod-sunod na kilos sa salaysay nang natural sa modernong Filipino.
theological_decisions:
- issue: Posibleng sakripisyal na diwa ng וַיִּזְבַּח sa pagpatay sa mga pari
  choice: Pinatay
  alternative: Inihandog bilang sakripisyo / kinatay
  rationale: May sakripisyal na gamit ang pandiwa, ngunit maaaring ipahiwatig ng “inihandog bilang sakripisyo” na lehitimong handog ito sa PANGINOON, na hindi tahasang sinasabi ng teksto. Pinananatili ng talababa ang tunay na leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “altar” bilang pamilyar na terminong panrelihiyon at “matataas na sambahan” upang maging malinaw ang teknikal na בָּמוֹת nang hindi ito ginagawang simpleng mga lugar na nasa mataas na lupa.
