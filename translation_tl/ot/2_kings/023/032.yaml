  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, ayon sa lahat ng ginawa ng kanyang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang mga ama”; maaari itong tumukoy sa kanyang mga ninuno o sa mga naunang pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Inilalahad ng waw-consecutive ang kasunod na pangyayari sa salaysay. Likas sa Tagalog na simulan ito sa “Ginawa niya” nang hindi kailangang isalin nang mekanikal ang pang-ugnay.
- source_word: הָרַע
  choice: ang masama
  rationale: Ang עשה הרע ay karaniwang idyomang Hebreo para sa paggawa ng masama; natural at tuwiran sa Tagalog ang “ginawa ang masama.”
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang talinghagang Hebreo tungkol sa pagtataya o paghatol ng Diyos at karaniwan din itong nauunawaan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Ipinahahayag nito ang paghahambing sa buong huwaran ng naunang paggawi, habang nananatiling maikli at natural sa Tagalog.
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Sapat ang aspektong natapos ng “ginawa” upang ipakitang nauna ang mga kilos ng mga ninuno; hindi kailangang dagdagan ng tahasang panandang past perfect sa Tagalog.
- source_word: אֲבֹתָיו
  choice: kanyang mga ninuno
  rationale: Literal itong “kanyang mga ama,” ngunit sa pormulang panghari tumutukoy ito sa mga ninuno o naunang mga pinuno. Ang “mga ninuno” ang natural na salin nang hindi nililimitahan sa mismong ama.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang “sa paningin ni Yahweh,” habang ginawang natural ang אֲבֹתָיו bilang “mga ninuno.”
