id: 2KI.23.16
reference: 2 Kings 23:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: tl
  text: Pagkatapos, lumingon si Josias at nakita niya ang mga libingan[a] na naroon sa bundok. Nagpadala siya ng mga tao upang kunin ang mga buto mula sa mga libingan, at sinunog niya ang mga iyon sa altar at dinungisan ito, ayon sa salita ni Yahweh na ipinahayag[b] ng tao ng Diyos, na nagpahayag ng mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga puntod.” Ang salitang Hebreo ay maaaring tumukoy sa mga lugar ng libing sa pangkalahatan, hindi lamang sa mga libingang itinayo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isinigaw” o “malakas na ipinahayag.” Maaaring bigyang-diin ng pandiwang Hebreo ang malakas at pampublikong pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: lumingon
  rationale: Likas na salaysay na katumbas ng pisikal na pagharap o paglingon ni Josias bago niya nakita ang mga libingan.
- source_word: הַקְּבָרִים
  choice: mga libingan
  rationale: Saklaw nito ang mga puntod o libingang maaaring likas o yari, kaya hindi nito labis na tinutukoy ang anyo ng mga ito.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Tuwirang katumbas ng הַר at pinananatili ang topograpikong detalye nang hindi ito ginagawang tiyak na burol lamang.
- source_word: הָעֲצָמוֹת
  choice: mga buto
  rationale: Pinananatili ang konkreto at literal na terminong mahalaga sa pagdungis sa altar.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: sinunog niya ang mga iyon sa altar
  rationale: Malinaw na ang mga buto ang sinunog at ang altar ang lugar ng pagsunog.
- source_word: וַיְטַמְּאֵהוּ
  choice: dinungisan ito
  rationale: Ang rituwal na diwa ng טמא ay angkop na ipinahahayag ng “dinungisan,” at ang “ito” ay natural na tumutukoy sa altar.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang pormulang nagsasaad ng katuparan ng naunang salita ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang literal na “lalaki ng Diyos” ay hindi likas at maaaring malabo sa modernong Filipino; ang “lingkod ng Diyos” ay dignified at malinaw na katawagang tumutukoy sa mensahero ng Diyos nang hindi tahasang dinaragdagan ang “propeta.”
- source_word: קָרָא
  choice: ipinahayag
  rationale: Angkop sa pampubliko at makapangyarihang paghahayag sa kontekstong propetiko, habang ang tala ay nagpapanatili sa posibilidad ng “isinigaw.”
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mga bagay na ito
  rationale: Pinananatili ang lawak ng דְּבָרִים, na maaaring tumukoy sa mga sinabi at sa mga pangyayaring ipinahayag.
theological_decisions:
- issue: Pormula ng katuparan na nag-uugnay sa ginawa ni Josias at sa naunang pahayag
  choice: “ayon sa salita ni Yahweh na ipinahayag ng lingkod ng Diyos”
  alternative: “ayon sa salita ni Yahweh na isinigaw ng lingkod ng Diyos”
  rationale: Ipinakikita ng sintaks na ang ginawa ni Josias ay naaayon sa naunang salita ni Yahweh na ipinamagitan ng lingkod ng Diyos, nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang banal na personal na pangalan sa tekstong salin.
- issue: Pag-uulit ng אֲשֶׁר קָרָא
  choice: Pinanatili ang ikalawang kaugnay na sugnay bilang “ang nagpahayag ng mga bagay na ito”
  alternative: Alisin ang pag-uulit bilang estilistikong kalabisan
  rationale: Ang masalimuot at paulit-ulit na anyo ng Hebreo ay tunay na bahagi ng teksto; ang gitling ay nagpapalinaw ng ugnayan nang hindi inaalis ang pag-uulit o tahimik na nilulutas ang posibleng tensiyon ng sintaks.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nagpadala siya ng mga tao” upang maipahayag ang eliptikong Hebreong “nagpadala siya at kinuha” sa paraang malinaw sa Filipino. Pinanatili ang dalawang paglitaw ng “ipinahayag” at ang katuparang pormula. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
