base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: tl
  text: Iginiba niya ang mga bahay ng mga lalaking patutot sa kulto[a] na nasa bahay ni Yahweh, at doon naghahabi ang mga babae ng mga tabing[b] para sa Ashera.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga patutot sa kulto.” Panlalaking maramihan ang salitang Hebreo; sa kontekstong ito, tumutukoy ito sa mga lalaking kaugnay ng ipinagbabawal na pagsamba.
    reason: lexical_alternative
  - marker: b
    text: O “mga pambalot” o “mga telang dambana”; mas literal, “mga bahay.” Maaaring tumukoy ang parirala sa mga hinabing telang pantakip o tila-toldang ginagamit sa pagsamba kay Ashera.
    reason: alternative_reading
  - marker: c
    text: Ang “Ashera” ay maaaring tumukoy sa diyosang Ashera o sa isang bagay o sagisag na kaugnay ng pagsamba sa kaniya, na madalas tawaging “poste ni Ashera.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Iginiba niya
  rationale: Ang pandiwang נתץ ay tumutukoy sa paggiba o pagwasak ng isang istruktura. Likas at malinaw sa makabagong Tagalog ang “iginiba.”
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: ang mga silid ng mga lalaking patutot sa kulto
  rationale: Bagaman literal na “mga bahay,” malamang na mga silid o tirahan sa loob ng bakuran ng templo ang tinutukoy. Ang קְדֵשִׁים ay panlalaking maramihan at sa kontekstong ito ay tumutukoy sa mga lalaking sangkot sa seksuwal na gawaing panrelihiyon.
- source_word: בְּבֵית יְהוָה
  choice: na nasa bahay ni Yahweh
  rationale: Pinananatili ng “bahay ni Yahweh” ang konkretong larawan ng Hebreo at ang pangalang banal na יהוה.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: kung saan naghahabi ang mga babae
  rationale: Ipinahahayag ng “naghahabi” ang nagpapatuloy o karaniwang gawain ng participle. Naipahihiwatig na ng “kung saan” ang lokasyong tinutukoy ng שָׁם nang hindi nagiging paulit-ulit sa Tagalog.
- source_word: בָּתִּים
  choice: mga tabing
  rationale: Literal itong “mga bahay,” ngunit dahil hinahabi ang mga ito, malamang na tumutukoy sa mga telang pantabing, pambalot, o tila-toldang dambana. Ang “mga tabing” ay likas ngunit hindi labis na tiyak.
- source_word: לָאֲשֵׁרָה
  choice: para sa Ashera
  rationale: Ang אֲשֵׁרָה ay maaaring tumukoy sa diyosang Ashera o sa bagay na ginagamit sa pagsamba sa kaniya. Pinananatili ng pangalan sa pangunahing teksto ang ganitong kalabuan.
theological_decisions:
- issue: Paglilipat ng יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אֲשֵׁרָה
  choice: Ashera
  alternative: ang diyosang Ashera; poste ni Ashera; sagisag ni Ashera
  rationale: Maaaring tumukoy ang salita sa diyosa o sa kultikong bagay na kaugnay niya, kaya hindi nilulutas sa pangunahing teksto ang tunay na kalabuan.
- issue: Pagkakakilanlan ng הַקְּדֵשִׁים
  choice: mga lalaking patutot sa kulto
  alternative: mga patutot sa kulto; mga lalaking itinalaga sa kulto
  rationale: Panlalaking maramihan ang anyong Hebreo at negatibo ang kahulugan nito sa konteksto. Nililinaw ng salin ang kasarian at kaugnayan sa ipinagbabawal na pagsamba nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga silid” para sa mga espasyo sa loob ng bahay ni Yahweh, at pinanatili sa mga talababa ang mga tunay na kalabuan ng בָּתִּים at אֲשֵׁרָה.
