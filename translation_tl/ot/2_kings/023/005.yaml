  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: tl
  text: At pinatigil niya ang mga paring itinalaga ng mga hari ng Juda upang magsunog ng insenso sa matataas na lugar sa mga lungsod ng Juda at sa palibot ng Jerusalem[a], pati ang mga nagsusunog ng insenso kay Baal, sa araw, sa buwan, sa mga konstelasyon[b], at sa buong hukbo ng langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga paganong pari.” Ang salitang Hebreo ay tumutukoy sa mga paring nauugnay sa di-lehitimong pagsamba o sa pagsamba sa diyus-diyosan, hindi sa mga lehitimong pari ng PANGINOON.
    reason: lexical_alternative
  - marker: b
    text: O “mga tanda ng zodiac.” Malamang na tumutukoy ang salitang Hebreo sa mga konstelasyon o pangkat ng mga bagay sa kalangitan.
    reason: lexical_alternative
  - marker: c
    text: Sa kontekstong ito, ang “hukbo ng langit” ay tumutukoy sa mga bagay sa kalangitan na sinasamba sa relihiyong astral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: pinatigil niya
  rationale: Ang Hiphil ng שׁבת ay nagpapahiwatig na pinahinto o pinawalang-bisa niya ang gawain; natural at hindi labis na tiyak ang “pinatigil niya” sa Tagalog.
- source_word: הַכְּמָרִים
  choice: mga pari
  rationale: Tumutukoy ang natatanging terminong Hebreo sa mga paring kaugnay ng di-lehitimo o mapagsambang-idolong kulto. Pinanatili sa teksto ang payak na “mga pari” at ipinaliwanag sa talababa upang hindi palabis na bigyang-kahulugan ang pangunahing teksto.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: itinalaga ng mga hari ng Juda
  rationale: Sa konstruksiyong ito, ang נתן ay nangangahulugang magtalaga o maglagay sa tungkulin.
- source_word: וַיְקַטֵּר / הַמְקַטְּרִים
  choice: magsunog / nagsusunog ng insenso
  rationale: Karaniwang tumutukoy ang קטר sa pagsusunog ng insenso o handog na pinauusukan; malinaw at natural dito ang “magsunog ng insenso.”
- source_word: בַּבָּמוֹת
  choice: sa matataas na lugar
  rationale: Ito ang karaniwang katawagan sa mga lokal na pook-sambahan, na madalas ngunit hindi laging nasa mataas na lugar.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: sa mga lungsod ng Juda at sa palibot ng Jerusalem
  rationale: Ang מְסִבֵּי ay tumutukoy sa mga nakapaligid na lugar.
- source_word: לַבַּעַל
  choice: para kay Baal
  rationale: Pangalan ito ng diyos; ang “para kay” ay natural na Tagalog para sa handog na iniuukol sa isang personal na diyos.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: sa araw, sa buwan
  rationale: Pinananatili ng pag-uulit ng “sa” ang magkakahiwalay na pinag-uukulan sa talaan.
- source_word: וְלַמַּזָּלוֹת
  choice: sa mga konstelasyon
  rationale: Malamang na tumutukoy sa mga konstelasyon o pangkat na astral; mas maingat ito kaysa sa tiyak na “mga tanda ng zodiac.”
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: at sa buong hukbo ng langit
  rationale: Pinananatili nito ang nakaugaliang larawang “hukbo ng langit,” habang ipinapaliwanag sa talababa na sa kontekstong ito ay mga bagay sa kalangitan ang tinutukoy.
theological_decisions:
- issue: Kung dapat bang tahasang tawaging mga paring sumasamba sa diyus-diyosan ang הַכְּמָרִים
  choice: mga pari, na may paliwanag sa talababa
  alternative: mga paring sumasamba sa diyus-diyosan / mga paganong pari
  rationale: Ipinahihiwatig ng natatanging salitang Hebreo at ng konteksto na hindi sila mga lehitimong pari ng PANGINOON. Gayunman, inilalagay sa talababa ang paglilinaw upang mapanatili sa pangunahing teksto ang anyong hindi labis na interpretatibo.
- issue: Kung paano uunawain ang “hukbo ng langit”
  choice: panatilihin ang idyomang “buong hukbo ng langit” at ipaliwanag sa talababa
  alternative: lahat ng bagay sa kalangitan
  rationale: Pinananatili ng idyoma ang metapora at lawak ng Hebreo, samantalang nililinaw ng talababa na mga bagay sa kalangitan na sinasamba sa astral na relihiyon ang tinutukoy rito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matataas na lugar” bilang pamilyar na terminong biblikal at ang “hukbo ng langit” upang mapanatili ang larawang Hebreo; nilinaw sa mga talababa ang mga terminong maaaring mapagkamalan.
