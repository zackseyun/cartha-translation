  text: וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יִּכְרֹ֖ת אֶת הָ/אֲשֵׁרִ֑ים וַ/יְמַלֵּ֥א אֶת מְקוֹמָ֖/ם עַצְמ֥וֹת אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: tl
  text: Winasak niya ang mga nakatayong bato, pinutol ang mga Asherim[a], at pinuno ng mga buto ng tao ang mga kinalalagyan ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga poste ni Ashera.” Ang salitang Hebreo ay maaaring tumukoy sa mga bagay na ginagamit sa pagsamba na kaugnay ni Ashera; hindi tinutukoy ng salita lamang ang eksaktong anyo ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: winasak
  rationale: Ipinahihiwatig ng pandiwa ang marahas na pagbasag o pagdurog; natural at malinaw sa modernong Tagalog ang “winasak.”
- source_word: הַמַּצֵּבוֹת
  choice: mga haliging bato
  rationale: Tumutukoy ang מַצֵּבָה sa mga nakatayong batong ginagamit sa pagsamba. Nililinaw ng “batong” ang materyal nang hindi idinaragdag ang interpretibong “sagrado.”
- source_word: וַיִּכְרֹת
  choice: pinutol
  rationale: Ang כרת ay angkop na isaling “pinutol” kapag ang tinutukoy ay mga bagay na pangkulto na maaaring yari sa kahoy o anyong punongkahoy.
- source_word: הָאֲשֵׁרִים
  choice: mga Asherim
  rationale: Pinananatili ang tiyak na terminong Hebreo upang hindi pagpasyahan kung ang mga ito ay poste, puno, o ibang sagisag na kaugnay ni Ashera; ipinaliliwanag ang alternatibo sa talababa.
- source_word: וַיְמַלֵּא
  choice: pinuno
  rationale: Tuwirang ipinapahayag nito ang pangunahing diwa ng pandiwa, ang pagpuno sa isang lugar.
- source_word: מְקוֹמָם
  choice: mga kinalalagyan ng mga iyon
  rationale: Malinaw nitong ibinabalik ang panghalip na hulapi sa mga winasak na bagay na pangkulto at natural ito sa Tagalog.
- source_word: עַצְמוֹת אָדָם
  choice: mga buto ng tao
  rationale: Ginagamit dito ang אָדָם sa pangkalahatang kahulugan na tao, hindi partikular na lalaking nasa hustong gulang.
theological_decisions:
- issue: Kahulugan ng אָדָם sa pariralang עַצְמוֹת אָדָם
  choice: mga buto ng tao
  alternative: mga buto ng isang lalaki
  rationale: Pangkalahatan ang gamit ng אָדָם sa kontekstong ito; hindi ipinahihiwatig ng Hebreo na lalaki lamang ang tinutukoy.
- issue: Anyo ng הָאֲשֵׁרִים
  choice: mga Asherim
  alternative: mga poste ni Ashera
  rationale: Maaaring tumukoy ang salita sa iba't ibang bagay na pangkulto na kaugnay ni Ashera. Pinananatili ng transliterasyon ang tunay na leksikal na kalabuan, habang inilalahad sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinili ang “haliging bato” para sa konkretong kultikong kahulugan at “mga Asherim” upang mapanatili ang kalabuan sa anyo ng mga bagay na ito.
