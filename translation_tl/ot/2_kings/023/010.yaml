  to: At dinungisan niya ang Tofet, na nasa Lambak ng Ben-Hinom, upang walang sinuman[a] ang magpadaan ng kanyang anak na lalaki o babae sa apoy para kay Molek.[c]
  rationale: Binago ang pandiwang parirala upang tumpak na maipahayag ang causative na kahulugan ng Hebreo at maging malinaw sa Filipino kung sino ang ipinadaraan sa apoy. Iningatan ang idyomang Hebreo sa pangunahing teksto. Nanatili ang mga talababa, ngunit inihanay ang sipi sa talababa b sa binagong, wastong ayos ng pangungusap. Walang kailangang baguhin sa kahulugan ng talata.
