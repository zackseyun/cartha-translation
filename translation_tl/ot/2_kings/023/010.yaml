  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: tl
  text: At dinungisan niya ang Tofet, na nasa Lambak ng Ben-Hinom, upang walang sinuman[a] ang magpadaan ng kanyang anak na lalaki o babae sa apoy para kay Molek.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “walang lalaki”; panlalaking isahan ang anyo ngunit pangkalahatan ang gamit dito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kay Molek.” Di-gaanong malamang, binabasa ng ilan ang mga katinig bilang “sa hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: At dinungisan niya
  rationale: Ang Piel ng טמא ay nangangahulugang gawing marumi o di-dalisay. Sa konteksto ng pagpapawalang-gamit sa isang pook-sambahan, natural at marangal sa Filipino ang “dinungisan” nang hindi lubusang ipinapalit ang mas interpretibong “winasak” o “nilapastangan.”
- source_word: הַתֹּפֶת
  choice: ang Tofet
  rationale: Pangalan ito ng isang pook, kaya tinumbasan sa transliterasyong madaling bigkasin sa Filipino; pinanatili rin ang tiyak na pantukoy ng Hebreo.
- source_word: בְּגֵי בני הִנֹּם
  choice: na nasa Lambak ng Ben-Hinom
  rationale: Isinalin ang גֵי bilang “Lambak” at pinanatili bilang pangalan ng pook ang tradisyonal na Ben-Hinom, sa halip na gawing mas literal ngunit di-gaanong natural na “mga anak ni Hinom.”
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: upang walang sinuman ang magparaan
  rationale: Ipinapahayag ng konstruksyon ang layuning hadlangan ang gawain. Ang “magparaan” ay nagpapanatili sa causative na diwa ng Hiphil ng עבר at sa idyomang ritwal ng pinagmulang teksto.
- source_word: אִישׁ
  choice: sinuman
  rationale: Bagaman literal na panlalaking pangngalang isahan ang אִישׁ, pangkalahatan ang bisa nito rito. Ang “sinuman” ang likas na Filipino sa negatibong sugnay at hindi nagpapahiwatig na mga lalaki lamang ang saklaw.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: sa kanyang anak na lalaki o babae
  rationale: 'Ginawang “o” ang payak na Hebreong pang-ugnay dahil distributibo ang diwa sa negatibong sugnay: alinman sa anak na lalaki o anak na babae ay hindi dapat isailalim sa ritwal.'
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Kasama ng “magparaan,” pinananatili nito ang literal na larawan ng Hebreong idyoma nang hindi pa tahasang ipinapaliwanag sa pangunahing teksto kung paano isinagawa ang ritwal.
- source_word: לַמֹּלֶךְ
  choice: para kay Molek
  rationale: Pinakamalamang sa konteksto na pangalan ng bathala ang מֹלֶךְ. Ang “para kay” ay natural na nagpapahayag ng pinag-uukulan ng ritwal, samantalang inilalagay sa talababa ang di-gaanong malamang na alternatibong pagbasa.
theological_decisions:
- issue: Paglalarawan sa ritwal na kinasasangkutan ng mga bata
  choice: Pinanatili ang idyomang “magparaan sa apoy” sa pangunahing teksto.
  alternative: “Ihandog” o “sunugin bilang handog” ang anak para kay Molek.
  rationale: Malinaw na kultikong gawain ang tinutukoy at malamang na paghahandog ng bata, ngunit hindi iyon tahasang sinasabi ng mismong idyomang Hebreo. Pinananatili ng salin ang pahiwatig at teolohikal na bigat nang hindi ginagawang higit na tiyak ang teksto kaysa sa pinagmulan.
- issue: Pangkalahatang gamit ng panlalaking אִישׁ
  choice: “walang sinuman” sa pangunahing teksto
  alternative: “walang lalaki”
  rationale: Pangkalahatan ang bisa ng panlalaking isahan sa sugnay na ito. Mas natural at eksakto sa saklaw ang “sinuman,” habang inilalahad sa talababa ang literal na anyo.
- issue: Pagkilala sa מֹלֶךְ
  choice: Pangalan ng bathalang “Molek”
  alternative: “ang hari”
  rationale: Ang kontekstong kultiko at karaniwang pagkaunawa sa anyo ay pumapabor sa pangalang Molek, ngunit tunay na posibilidad sa mga katinig ang pagbasa na “hari,” kaya hindi ito ikinubli.
translation_notes:
  register: 'Makabago at dignidadong Filipino ang ginamit, na may payak na balangkas ng pangungusap at mga pangalang binaybay para sa madaling pagbigkas: Tofet, Ben-Hinom, at Molek. Pinanatili ang idyomang Hebreo sa pangunahing teksto at inilagay sa mga talababa ang kinakailangang paliwanag at mga tunay na alternatibong pagbasa.'
