  source_fidelity: 'Ang pangunahing suliranin ay ang ayos at pokus ng pandiwang “magparaan sa apoy sa kanyang anak,” na hindi malinaw na naghahayag ng Hiphil ng עבר: ang magulang ang nagpaparaan sa anak sa apoy. Ang “magpadaan ng kanyang anak ... sa apoy” ay malinaw na causative at pinananatili ang Hebreong idyoma nang hindi ito ginagawang tahasang “isakripisyo.” Wasto ang layuning ipinahahayag ng “upang,” gayundin ang pagkilalang Molek ang pinakamalamang na pagbasa.'
  naturalness: Hindi likas at maaaring maling mabasa ang dating “magparaan sa apoy sa kanyang anak.” Ang binagong “magpadaan ng kanyang anak na lalaki o babae sa apoy” ay malinaw at likas sa makabagong Filipino. Ang natitirang pananalita ay may angkop na marangal na rehistro.
  terminology: Ang Tofet, Ben-Hinom, at Molek ay angkop na mga transliterasyon. Katanggap-tanggap ang “dinungisan” para sa sadyang pagdungis o pagpaparumi ng pook upang hindi na ito magamit sa kulto. Ang “sinuman” ay wastong pangkalahatang salin ng generic na אִישׁ; ipinaliliwanag ng talababa ang panlalaking anyo ng Hebreo.
