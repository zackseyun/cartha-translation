base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: tl
  text: 'Pagkatapos, iniutos ng hari sa buong bayan: “Ipagdiwang ninyo ang Paskuwa para kay Yahweh na inyong Diyos, ayon sa nakasulat sa Aklat ng Tipang ito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: iniutos ng hari
  rationale: Tuwirang ipinahahayag ng צוה ang pagbibigay ng utos; natural sa salaysay ang “iniutos ng hari.”
- source_word: כָּל הָעָם
  choice: sa buong bayan
  rationale: Ang עַם ay tumutukoy sa sambayanan bilang kabuuan; malinaw at likas sa modernong Filipino ang “buong bayan.”
- source_word: עֲשׂוּ פֶסַח
  choice: Ipagdiwang ninyo ang Paskuwa
  rationale: Literal itong “gawin ang Paskuwa,” isang Hebreong idyoma para sa pagsasagawa o pagdiriwang ng Paskuwa. Inihahatid ng “ipagdiwang” ang aktuwal na diwa nang hindi tunog-salita-sa-salita.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: para kay Yahweh na inyong Diyos
  rationale: Ipinahihiwatig ng ל ang pag-aalay o pagtatalaga ng pagdiriwang kay Yahweh; pinananatili rin ang tahasang “inyong Diyos.”
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Natural na pormulang Filipino ito para sa pagsunod sa nakasulat na tagubilin at tapat sa Hebreong anyo.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: sa Aklat ng Tipang ito
  rationale: Sa konteksto ng pagsusulat sa isang dokumento, natural na tumbas ng עַל ang “sa.” Pinananatili ng parirala ang tiyak na aklat at ang demonstratibong “ito.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng Paskuwa kay Yahweh na ipinahihiwatig ng ל
  choice: para kay Yahweh
  alternative: kay Yahweh
  rationale: Ang “para kay” ay malinaw na naghahayag na ang Paskuwa ay isinasagawa bilang pagdiriwang na nakatalaga kay Yahweh, nang hindi dinaragdagan ang teksto ng mas tiyak na sakripisyal na interpretasyon.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Paskuwa” bilang nakaugaliang katawagan sa biblikal na kapistahan at ang “Tipan” para sa בְּרִית. Walang talababa sapagkat malinaw sa pangunahing teksto ang idyomang עֲשׂוּ פֶסַח.
