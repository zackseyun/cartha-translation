base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng lahat ng ginawa ng kanyang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang mga ama”; maaari rin itong mangahulugang “kanyang mga ninuno” o “mga naunang hari sa kanyang angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Isinasalaysay nito ang sumunod na kilos sa salaysay. Hindi kailangang isalin nang hiwalay ang waw bilang “At” dahil likas nang naipahihiwatig ng pagkakasunod ng mga pangyayari sa Filipino.
- source_word: הָרַע
  choice: ang masama
  rationale: Ang pariralang עשה הרע ay karaniwang pormula ng pagsusuri sa mga hari; malinaw at natural sa Filipino ang “ginawa ang masama.”
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong talinghaga ng pagsusuri ayon sa pananaw ng isang tao at karaniwan itong nauunawaan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Ipinahahayag nito ang pagkakatulad ng ginawa niya sa kabuuan ng naunang asal ng kanyang mga ninuno.
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Sapat ang aspektong ganap ng “ginawa” upang ipakita sa Filipino na nauna na ang kanilang mga kilos.
- source_word: אֲבֹתָיו
  choice: kanyang mga ninuno
  rationale: Bagaman literal na “kanyang mga ama,” maaari itong tumukoy sa mga ninuno o naunang salinlahi. Ang “mga ninuno” ang pinakamalinaw at likas sa modernong Filipino; pinananatili sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalarawan sa ginawa ng hari bilang masama ayon sa pagsusuri ni Yahweh
  choice: ang masama sa paningin ni Yahweh
  alternative: ang masama sa harap ni Yahweh
  rationale: Pinananatili ng “sa paningin” ang pormulang Hebreo at nililinaw na ang pamantayan ng pagsusuri ay kay Yahweh, nang hindi dinaragdagan ang kahulugan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ang personal na pangalan bilang “Yahweh” sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang pormulang panghari na “ang masama sa paningin ni Yahweh,” habang ginawang natural ang pagtukoy sa אֲבֹתָיו bilang “mga ninuno.”
