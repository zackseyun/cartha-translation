  naturalness: Natural at marangal ang pangungusap sa modernong Filipino Tagalog. Inalis ang “Ginawa niya ito” upang maging mas tuwiran ang ugnayan ng paglilinis ni Josias at ng layuning ipatupad ang Kautusan.
  terminology: Ang “mga medium” at “mga espiritista” ay malinaw na modernong katawagan para sa magkaparis ngunit hindi magkatulad na Hebreong termino. Pinanatili ang “mga diyos-diyosan sa tahanan,” “mga idolo,” “kasuklam-suklam na bagay,” “Kautusan,” at “Yahweh.”
