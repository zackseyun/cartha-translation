id: 2KI.23.24
reference: 2 Kings 23:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: tl
  text: Bukod dito, inalis din ni Josias ang mga medium, ang mga espiritista, ang mga diyos-diyosan sa tahanan, ang mga idolo, at ang lahat ng kasuklam-suklam na bagay na nakita sa lupain ng Juda at sa Jerusalem, upang ipatupad ang mga salita ng Kautusan na nakasulat sa aklat[a] na natagpuan ng paring si Hilkias sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa balumbon.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakasulat na dokumentong nasa anyong balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bukod dito, ... din
  rationale: Pinananatili ang pandagdag na diwa ng Hebreo at likas ang daloy sa modernong Tagalog.
- source_word: הָאֹבוֹת
  choice: mga espiritista
  rationale: Sa konteksto, tumutukoy ito sa mga taong sumasangguni sa mga espiritu o patay; malinaw at hindi lipas ang “espiritista.”
- source_word: הַיִּדְּעֹנִים
  choice: mga manghuhula
  rationale: Tumutukoy sa kaugnay na uri ng okultong tagapayo. Pinili ang madaling maunawaang pangkalahatang katawagan habang hindi pinalalabis ang tiyak na gawain.
- source_word: הַתְּרָפִים
  choice: mga diyos-diyosan sa tahanan
  rationale: Ipinahahayag ang malamang na gamit ng terafim bilang mga domestikong imahen o diyos, sa halip na gumamit ng di-pamilyar na transliterasyon.
- source_word: הַגִּלֻּלִים
  choice: mga idolo
  rationale: Malinaw na katumbas sa Tagalog; hindi lubos na naililipat ang mapanlait na himig ng salitang Hebreo nang hindi nagiging alanganin.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: lahat ng kasuklam-suklam na bagay
  rationale: Pinananatili ang malawak na saklaw at matinding panrelihiyon at moral na paghatol ng parirala.
- source_word: נִרְאוּ
  choice: nakita
  rationale: Malapit sa pasibong kahulugan ng Hebreo at hindi tahasang pinapalitan ng mas interpretibong “natagpuan” o “naroon.”
- source_word: בִּעֵר
  choice: inalis
  rationale: Saklaw ng pandiwa ang pagpawi o paglipol; dahil kapwa tao at mga bagay ang nasa talaan, hindi nito ipinapalagay na sinunog ang lahat.
- source_word: לְמַעַן הָקִים
  choice: upang maipatupad
  rationale: Ipinapakita ang layuning bigyang-bisa at isagawa ang nakasulat na Kautusan; mas natural ito sa Tagalog kaysa literal na “itatag.”
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: mga salita ng Kautusan
  rationale: Pinananatili ang pormal na “mga salita” at ang kontekstuwal na kahulugan ng Torah bilang tipang Kautusan.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: nakasulat sa aklat[a]
  rationale: Natural sa modernong Tagalog; ipinapaliwanag sa talababa na maaari ring tumukoy sa balumbon.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” ng Hebreo sa halip na tahasang gawing “templo.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang karaniwang rekonstruksiyong “Yahweh,” alinsunod sa patakaran ng proyekto at nang malinaw na maipakita ang pangalang pantangi sa pinagmulan.
- issue: Diwa ng לְמַעַן הָקִים kaugnay ng Kautusan
  choice: upang maipatupad
  alternative: upang mapagtibay; upang matupad
  rationale: Iniiwasang ipakahulugan ang “matupad” na parang hula; ang konteksto ay pagsasagawa at pagbibigay-bisa sa mga utos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josias” at “Hilkias,” mga likas at nakaugaliang anyong Tagalog ng mga pangalan. Iniwasan ang sobrang teknikal o arkaikong katawagan, habang pinanatili ang magkakahiwalay na kategorya ng mga gawaing okulto at mga bagay na panrelihiyon.
