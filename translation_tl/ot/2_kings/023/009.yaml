language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: tl
  text: Gayunman, ang mga pari ng matataas na lugar[a] ay hindi umakyat sa altar ni Yahweh[b] sa Jerusalem, ngunit kumain sila ng tinapay na walang lebadura sa gitna ng kanilang mga kapatid[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “matataas na lugar” ay mga lokal na pook-sambahan o dambana.
    reason: cultural_note
  - marker: b
    text: Ang banal na pangalan sa Hebreo ay YHWH, na tradisyonal ding isinasaling “ang PANGINOON.”
    reason: alternative_reading
  - marker: c
    text: Malamang na ang “kanilang mga kapatid” ay tumutukoy sa kanilang mga kapwa pari o mga kaanak na kabilang sa angkan ng mga pari.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang paglilimita o pagsalungat sa naunang paglalarawan ng reporma, habang nananatiling natural sa makabagong Filipino.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: mga pari ng matataas na lugar
  rationale: Pinananatili ang karaniwang katawagan sa mga lokal na pook-sambahan na tinutukoy ng בָּמוֹת, nang hindi ipinapalagay kung kanino ukol ang pagsamba roon.
- source_word: יַעֲלוּ
  choice: umakyat
  rationale: Pinananatili ang idyomang 'umakyat' patungong Jerusalem at sa altar, na likas sa heograpikal at panrelihiyong konteksto.
- source_word: מִזְבַּח יְהוָה
  choice: altar ni Yahweh
  rationale: 'Natural na ipinahahayag sa Filipino ang ugnayang construct: ang altar na nauukol kay Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang YHWH sa halip na palitan ito ng titulong 'PANGINOON.'
- source_word: כִּי אִם
  choice: Sa halip
  rationale: 'Malinaw na ipinakikita ang kaibahan: hindi sila umakyat sa altar sa Jerusalem, ngunit nakibahagi sila sa pagkain.'
- source_word: אָכְלוּ מַצּוֹת
  choice: kumain sila ng tinapay na walang pampaalsa
  rationale: Malinaw at karaniwang salin ito ng מַצּוֹת; ang kolektibong 'tinapay' ay natural sa Filipino.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid
  rationale: Natural na isinasalin ang literal na 'sa gitna ng kanilang mga kapatid' at hindi idinaragdag sa pangunahing teksto na ang tinutukoy ay kapwa nila mga pari.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pagkakaiba nito sa isang pangkalahatang titulo.
- issue: Pagkakakilanlan ng אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kapwa pari
  rationale: Bagaman malamang na tumutukoy ang konteksto sa mga kapwa pari o kaanak na pari, hindi tahasang kasama sa Hebreo ang salitang 'pari'; pinananatili sa teksto ang mas malawak na katawagan at nililinaw ito sa talababa.
- issue: Katayuan ng mga pari sa altar sa Jerusalem
  choice: hindi umakyat
  alternative: hindi pinahintulutang umakyat
  rationale: Hindi tahasang sinasabi ng pandiwang Hebreo kung sila ay pinagbawalan o kusang hindi umakyat. Iniingatan ng salin ang ganitong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na idyomang 'umakyat' at ang katawagang 'matataas na lugar,' habang ginamit ang mas natural na 'kasama ng' para sa בְּתוֹךְ. Hinati sa dalawang pangungusap upang luminaw ang pagsalungat nang hindi binabago ang diwa.
