base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: tl
  text: Ginawang hari ni Paraon Neco si Eliakim na anak ni Josias upang humalili sa kanyang amang si Josias, at pinalitan niya ang pangalan nito ng Jehoiakim. Ngunit kinuha niya si Jehoahaz, at pumunta si Jehoahaz sa Egipto[a] at namatay doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dumating sa Egipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: ginawang hari
  rationale: 'Ang Hiphil ng מלך ay may diwang sanhi: si Paraon Neco ang nagluklok kay Eliakim bilang hari. Likas sa Filipino ang “ginawang hari” at malinaw nitong naipapakita ang causative force.'
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Sa konteksto ng paghalili sa trono, nangangahulugan itong pumalit sa dating hari, hindi “sa ilalim ng.”
- source_word: אָבִיו
  choice: ama nitong
  rationale: Ang hulaping panghalip ay tumutukoy kay Eliakim. Ginamit ang “nitong” upang malinaw na si Josias ang ama ni Eliakim, hindi ni Paraon Neco.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: pinalitan niya ang pangalan nito
  rationale: Ito ang natural na salin ng Hebreong idyoma na nangangahulugang baguhin ang pangalan ng isang tao.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Ngunit kinuha niya si Jehoahaz
  rationale: Ang לקח ay karaniwang “kunin.” Hindi ito pinalakas bilang “binihag” o “dinala” upang hindi magdagdag ng kahulugang hindi tahasang nasa pandiwa. Ipinakikita ng “ngunit” ang paglipat mula sa pagluklok kay Eliakim tungo sa ginawa kay Jehoahaz.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: pumunta siya sa Egipto
  rationale: Literal na “dumating” ang pandiwa, ngunit mas likas sa pananaw ng nagsasalaysay ang “pumunta.” Pinananatili ang panghalip sa halip na tahasang ulitin ang pangalan, yamang panghalip rin ang ipinahihiwatig ng Hebreong pandiwa.
- source_word: וַיָּמָת שָׁם
  choice: at doon namatay
  rationale: Tuwiran at maikli, gaya ng pangwakas na sugnay sa Hebreo.
