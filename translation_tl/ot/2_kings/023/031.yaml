base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: tl
  text: Dalawampu’t tatlong taong gulang si Jehoahaz nang magsimula siyang maghari, at tatlong buwan siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Hamutal. Siya ay anak ni Jeremias na taga-Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: Dalawampu’t tatlong taong gulang
  rationale: Likas na salin sa Tagalog ng karaniwang idyomang Hebreo para sa edad.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng pariralang may ב ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tumutukoy ang pandiwa sa tagal ng kanyang paghahari.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: tatlong buwan
  rationale: Ang parirala ay panandang tagal at natural na inuugnay sa pandiwang “naghari” sa Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang pariralang panlunan na nagsasaad kung saan siya naghari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormulang pangkasaysayan ng Mga Hari sa malinaw at dignified na modernong Tagalog.
- source_word: חֲמוּטַל
  choice: Hamutal
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: בַּת יִרְמְיָהוּ
  choice: anak ni Jeremias
  rationale: Ang בַּת ay tahasang nagsasaad na siya ay anak na babae; sapat at natural sa Tagalog ang “anak,” yamang babae na si Hamutal. Ginamit ang nakagawiang anyong Tagalog na “Jeremias.”
- source_word: מִלִּבְנָה
  choice: na taga-Libna
  rationale: Ipinahahayag nang natural sa Tagalog ang pinagmulan o kaugnayan ni Jeremias sa Libna.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “maghari” sa halip na mas teknikal na pananalita, at “taga-Libna” upang malinaw na iugnay ang lugar kay Jeremias.
