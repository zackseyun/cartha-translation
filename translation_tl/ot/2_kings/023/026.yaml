base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: tl
  text: Gayunman, hindi tumalikod si Yahweh mula sa matinding alab ng kanyang galit[a], na nag-alab laban sa Juda[b], dahil sa lahat ng pag-uudyok ni Manases na nagpagalit sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kanyang napakatinding galit.” Literal na inilalarawan ng Hebreo ang “alab ng kanyang ilong/galit,” isang idyoma para sa napakatinding galit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa Juda.” Literal na “sa” ang pang-ukol sa Hebreo, bagaman sa Filipino ay likas na sabihing nag-alab ang galit “laban sa” isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahahayag ang matinding pagsalungat sa naunang salaysay tungkol sa mga reporma ni Josias.
- source_word: לֹא שָׁב
  choice: hindi iniurong
  rationale: Pinananatili ang larawan ng pagtalikod o pag-urong mula sa galit, ngunit gumagamit ng likas na pariralang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH ayon sa pamantayan ng proyekto.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: ang kanyang napakatinding galit
  rationale: Likas na ipinahahayag sa Filipino ang matindi at nag-aalab na galit; ipinaliliwanag sa talababa ang kongkretong idyomang Hebreo.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: Nag-alab ang galit niya
  rationale: Pinananatili ang pag-uulit at larawan ng nag-aalab na galit sa Hebreo.
- source_word: בִּיהוּדָה
  choice: laban sa Juda
  rationale: Bagaman literal na 'sa loob ng Juda,' sa konteksto ang Juda ang pinatutungkulan ng galit; ang alternatibo ay pinanatili sa talababa.
- source_word: עַל כָּל הַכְּעָסִים אֲשֶׁר הִכְעִיסוֹ
  choice: dahil sa lahat ng ginawa ni Manases upang galitin siya
  rationale: Malinaw at natural na inilalahad ang mga gawang pumukaw sa galit at ang kaugnay na pandiwang causative.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Karaniwang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
theological_decisions:
- issue: Makamundong paglalarawan sa galit ng Diyos
  choice: Pinanatili ang larawang 'nag-alab ang galit'
  alternative: Hindi humupa ang matinding poot o sama ng loob ni Yahweh
  rationale: Hayagang gumagamit ang Hebreo ng pisikal na idyoma ng nag-aalab na galit; hindi ito pinalalambot o binibigyan ng paliwanag na doktrinal.
- issue: Pagtutumbas sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Inilalahad ang personal na pangalang YHWH nang tuwiran at walang idinadagdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging likas at madaling maunawaan habang pinananatili ang pag-uulit ng “galit” at “nag-alab” sa Hebreo.
