revisions:
- from: Gayunman, hindi iniurong ni Yahweh ang kanyang napakatinding galit[a]. Nag-alab ang galit niya laban sa Juda[b] dahil sa lahat ng ginawa ni Manases upang galitin siya.
  to: Gayunman, hindi tumalikod si Yahweh mula sa matinding alab ng kanyang galit[a], na nag-alab laban sa Juda[b], dahil sa lahat ng pag-uudyok ni Manases na nagpagalit sa kanya.
  rationale: Inayos ang pandiwang pangunahing sugnay upang maipakita ang ‘hindi tumalikod mula sa,’ muling iniugnay ang relatibong sugnay sa galit na nag-alab laban sa Juda, at ginawang mas tiyak ang mga gawa ni Manases bilang mga pag-uudyok na nagpagalit sa Diyos. Pinanatili ang source ambiguity ng pang-ukol sa Juda sa talababa.
