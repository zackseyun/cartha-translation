    issue: Ang “hindi iniurong” ay hindi ang pinakalikas o pinakatumpak na katumbas ng לֹא שָׁב מִן.
    rationale: Ang pandiwang Hebreo ay ‘hindi tumalikod/bumalik mula sa.’ Ang “hindi tumalikod ... mula sa” ay pinananatili ang direksiyon at metapora nang mas malinaw.
  - severity: medium
    issue: Napaluwag ng dalawang pangungusap ang kaugnayan ng nag-aalab na galit sa pangunahing sugnay.
    rationale: Ang אֲשֶׁר חָרָה אַפּוֹ ay relatibong sugnay na naglalarawan sa galit na hindi tinalikuran; dapat itong malinaw na maiugnay sa iisang pangungusap.
  - severity: low
    issue: Ang “lahat ng ginawa ni Manases” ay kulang sa tiyak na diwa ng ‘mga pag-uudyok/probokasyon.’
    rationale: Ang כְּעָסִים ay mga gawang pumupukaw ng galit. Ang rebisyon ay naglalahad ng ‘mga pag-uudyok’ at ng pandiwang ‘nagpagalit’ upang mapanatili ang pag-uulit sa Hebreo.
