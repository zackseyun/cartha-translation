revisions:
- from: Inilulan siya ng kanyang mga lingkod mula sa Megido nang patay na siya, at dinala siya sa Jerusalem. Inilibing nila siya sa kanyang libingan. Pagkatapos, kinuha ng sambayanan ng lupain[a] si Jehoahaz na anak ni Josias, pinahiran siya ng langis, at ginawa siyang hari bilang kahalili ng kanyang ama.
  to: Inilulan ng kanyang mga lingkod ang kanyang bangkay mula sa Megido[a] at dinala siya sa Jerusalem. Inilibing nila siya sa kanyang libingan. Pagkatapos, kinuha ng mamamayan ng lupain[b] si Jehoahaz na anak ni Josias, pinahiran siya ng langis, at ginawa siyang hari bilang kahalili ng kanyang ama.
  rationale: Nilinaw ang kalagayan ni Josias bilang patay nang ilulan siya mula Megido, pinasimple ang pormal ngunit di-karaniwang “sambayanan ng lupain” tungo sa mas natural na “mamamayan ng lupain,” at idinagdag ang kinakailangang talang leksikal para sa “inilulan.” Hindi binago ang kahulugan ng paglibing, pagpili kay Jehoahaz, pagpapahid sa kanya ng langis, o pagluklok sa kanya bilang hari.
