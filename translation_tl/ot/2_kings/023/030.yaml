  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: tl
  text: Inilulan ng kanyang mga lingkod ang kanyang bangkay mula sa Megido[a] at dinala siya sa Jerusalem. Inilibing nila siya sa kanyang libingan. Pagkatapos, kinuha ng mamamayan ng lupain[b] si Jehoahaz na anak ni Josias, pinahiran siya ng langis, at ginawa siyang hari bilang kahalili ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinasakay.” Literal na “ipinasakay” ang pandiwang Hebreo; sa kontekstong ito, tumutukoy ito sa paglilipat ng bangkay ni Josias.
    reason: lexical_alternative
  - marker: b
    text: Ang “mamamayan ng lupain” ay isang pormal na ekspresyong Hebreo para sa lokal na mamamayang kumikilos bilang isang pampolitikang katawan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: Inilulan siya ... mula sa Megido
  rationale: Ang Hiphil ng רכב ay literal na ‘pinasakay’ o ‘inilulan.’ Pinananatili ng ‘inilulan’ ang larawan ng paglalagay sa sasakyan o karwahe, habang natural sa konteksto ng pag-uwi sa bangkay ni Josias.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring tumukoy ang עבד sa mga lingkod, opisyal, o tagapaglingkod ng hari. Ang ‘mga lingkod’ ay tuwiran at hindi labis na nagpapakahulugan.
- source_word: מֵת
  choice: nang patay na siya
  rationale: Malinaw nitong ipinahahayag ang kalagayan ni Josias habang inilululan mula sa Megido.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: dinala siya sa Jerusalem
  rationale: Natural at tuwirang salin ng pagdadala sa isang patutunguhan.
- source_word: בִּקְבֻרָתוֹ
  choice: sa kanyang libingan
  rationale: Ang קְבֻרָה ay tumutukoy sa lugar ng paglilibing. Ang ‘libingan’ ay malinaw at angkop nang hindi ipinapalagay ang tiyak na anyo nito.
- source_word: עַם הָאָרֶץ
  choice: sambayanan ng lupain
  rationale: Pinananatili nito ang pormal na ekspresyong Hebreo para sa lokal na populasyong kumikilos bilang isang pampolitikang katawan, at iniiwasang ipakahulugang mga maralita lamang.
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Tuwirang pinananatili ang לקח, bagaman sa konteksto ay kaugnay ito ng pagpili at pagluklok kay Jehoahaz.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: pinahiran siya ng langis
  rationale: Ginagawang malinaw sa karaniwang mambabasa ang seremonyal at maharlikang kahulugan ng משׁח, sa halip na bawasan ito sa simpleng paghirang.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: ginawa siyang hari bilang kahalili ng kanyang ama
  rationale: Natural na Filipino para sa pagpapaghari sa kanya kapalit ng kanyang ama, habang pinananatili ang ugnayan ng paghalili.
theological_decisions:
- issue: Maharlikang pagpapahid
  choice: pinahiran siya ng langis
  alternative: hinirang siya
  rationale: Tahasang ginagamit ng Hebreo ang pandiwa para sa pagpapahid. Pinananatili ng salin ang seremonyal at pampolitikang kabuluhan nito sa paghahari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘inilulan’ upang manatiling malapit sa kongkretong pandiwang Hebreo, at ‘sambayanan ng lupain’ upang mapanatili ang pormal na katangian ng ekspresyong pampolitika.
