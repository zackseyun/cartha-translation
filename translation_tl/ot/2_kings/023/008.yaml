revisions:
- from: Tinipon niya ang lahat ng mga pari mula sa mga lungsod ng Juda at nilapastangan ang matataas na sambahan kung saan nagsunog ng insenso ang mga pari, mula Geba hanggang Beer-seba. Ipinagiba rin niya ang matataas na sambahan sa mga pintuang-bayan[a] na nasa pasukan ng pintuang-bayan ni Josue, ang pinuno ng lungsod. Ang mga iyon ay nasa gawing kaliwa ng taong pumapasok sa pintuang-bayan.[b]
  to: Dinala niya ang lahat ng pari mula sa mga lungsod ng Juda at dinungisan ang mga mataas na lugar ng pagsamba kung saan nagsunog ng insenso ang mga pari, mula Geba hanggang Beer-seba. Giniba rin niya ang mga mataas na lugar ng pagsamba sa mga pintuang-bayan[a] na nasa pasukan ng pintuang-bayan ni Josue, ang pinuno ng lungsod, na nasa kaliwa ng isang tao sa pintuang-bayan.[b]
  rationale: Inalis ang interpretasyong “pumapasok” mula sa pangunahing teksto upang mapanatili ang elipsis at kawalang-katiyakan ng Hebreo; inilagay ito bilang malamang na paliwanag sa talababa. Ginawang mas tuwiran ang unang pandiwa at mas likas ang katawagan para sa בָּמוֹת, nang hindi binabago ang kahulugan o ang rehistro ng talata.
