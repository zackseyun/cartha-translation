translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘matataas na sambahan’ para sa teknikal na בָּמוֹת, ‘nilapastangan’ para sa kultikong pagdungis, at ‘pinuno ng lungsod’ upang maiwasan ang sobrang tiyak na modernong titulong pampamahalaan. Ang mahirap na huling sugnay ay bahagyang nilinaw sa teksto at ang literal na kawalang-katiyakan ay pinanatili sa talababa.
