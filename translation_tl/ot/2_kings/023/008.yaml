  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: tl
  text: Dinala niya ang lahat ng pari mula sa mga lungsod ng Juda at dinungisan ang mga mataas na lugar ng pagsamba kung saan nagsunog ng insenso ang mga pari, mula Geba hanggang Beer-seba. Giniba rin niya ang mga mataas na lugar ng pagsamba sa mga pintuang-bayan[a] na nasa pasukan ng pintuang-bayan ni Josue, ang pinuno ng lungsod, na nasa kaliwa ng isang tao sa pintuang-bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga mataas na lugar ng pagsamba ng mga pintuang-bayan”; maaari ring unawain na “ang mga dambana sa mga pintuang-bayan.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang pariralang Hebreo. Sa literal, “na nasa kaliwa ng isang tao sa pintuang-bayan.” Malamang na tumutukoy ito sa gawing kaliwa ng taong papasok sa pintuang-bayan, ngunit hindi ito tahasang sinasabi ng Hebreo.
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Tinipon niya
  rationale: Ang Hiphil ng בוא ay literal na ‘dinala niya,’ ngunit sa konteksto ay ipinatawag at pinapunta ni Josias ang mga pari mula sa mga bayan ng Juda; natural na ipinahahayag ito ng ‘tinipon’ sa Filipino.
- source_word: הַכֹּהֲנִים
  choice: ang lahat ng mga pari
  rationale: Karaniwang katumbas ng כֹּהֲנִים ang ‘mga pari’; pinananatili rin ang כָּל bilang ‘lahat.’
- source_word: מֵעָרֵי יְהוּדָה
  choice: mula sa mga lungsod ng Juda
  rationale: Maaaring tumukoy ang עָרִים sa mga lungsod o bayan. Ang ‘mga lungsod’ ay tuwiran at malawak na katumbas.
- source_word: וַיְטַמֵּא
  choice: nilapastangan
  rationale: Ang Piel ng טמא ay ‘ginawang marumi’ o ‘dinungisan.’ Sa konteksto ng sadyang pag-aalis ng kabanalan sa mga lugar ng pagsamba, malinaw at natural ang ‘nilapastangan.’
- source_word: הַבָּמוֹת
  choice: ang matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na lugar ng pagsamba, kadalasang tinatawag na ‘high places.’ Ipinahahayag ng ‘matataas na sambahan’ ang tradisyonal na imahen at tungkuling panrelihiyon nang hindi ipinapalagay na lahat ay templo o dambana lamang.
- source_word: קִטְּרוּ שָׁמָּה
  choice: kung saan nagsunog ng insenso
  rationale: Ang קטר ay tumutukoy sa pagsusunog ng insenso o handog na pinauusok. Ang ‘nagsunog ng insenso’ ang pinakatuwirang pagbasa rito; ang ‘kung saan’ ay likas na nagdadala ng diwa ng שָׁמָּה.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: mula Geba hanggang Beer-seba
  rationale: Pinananatili ang saklaw na heograpiko mula hilaga hanggang timog at ang mga pangalang pantangi sa karaniwang anyong Filipino.
- source_word: וְנָתַץ
  choice: Ipinagiba rin niya
  rationale: Ang נתץ ay ‘giniba’ o ‘winasak.’ Ang ‘ipinagiba’ ay natural sa Filipino at hindi nangangahulugang siya mismo ang pisikal na gumawa nito; ipinahahayag ng ‘rin’ ang pandagdag na waw.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: ang matataas na sambahan sa mga pintuang-bayan
  rationale: Literal na ‘matataas na sambahan ng mga pintuang-bayan’ ang siksik na parirala. Ang ‘sa mga pintuang-bayan’ ay maingat na paglilinaw sa lokasyon nang hindi tiyakang ginagawang ibang uri ng dambana.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: nasa pasukan ng pintuang-bayan ni Josue
  rationale: Tuwirang ipinahahayag ang פֶּתַח bilang ‘pasukan’ at pinananatili ang pagtukoy sa pintuang-bayan na kaugnay ni Josue.
- source_word: שַׂר הָעִיר
  choice: ang pinuno ng lungsod
  rationale: 'Malawak ang saklaw ng שַׂר: pinuno, opisyal, gobernador, o prinsipe. Ang ‘pinuno ng lungsod’ ay hindi labis na tumutukoy sa eksaktong modernong katungkulan.'
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: Ang mga iyon ay nasa gawing kaliwa ng taong pumapasok sa pintuang-bayan.
  rationale: Mahirap at eliptikal ang literal na ‘nasa kaliwa ng isang tao sa pintuang-bayan.’ Ang salin ay nagbibigay ng malamang na oryentasyon habang ipinapaalam sa talababa na hindi tahasang nasa Hebreo ang ‘pumapasok.’
