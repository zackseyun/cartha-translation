  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: tl
  text: At ginawa ng paring si Urias ang lahat ng iniutos ni Haring Ahaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה ay maaaring mangahulugang “gawin” o “likhain.” Dito, inilalarawan nito ang pagsunod sa isang utos, kaya natural at tuwiran ang “ginawa.”
- source_word: אוּרִיָּה
  choice: Urias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal na Uriah.
- source_word: הַכֹּהֵן
  choice: ang paring
  rationale: Tiyak na tumutukoy ito sa katungkulan ni Urias. Ang anyong “paring si Urias” ay likas sa modernong Filipino.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag ng parirala ang ganap na pagtutugma ng ginawa ni Urias sa iniutos sa kaniya; pinananatili ng salin ang saklaw na “lahat.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang צוה ay nangangahulugang mag-utos. Ang aspektong naganap na ng “iniutos” ay sapat upang ipakitang nauna ang utos sa ginawa ni Urias.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Haring Ahaz
  rationale: Ang paglalagay ng titulong “Hari” bago ang pangalan ay natural sa Filipino at tapat sa tiyak na pariralang Hebreo.
theological_decisions:
- issue: Pagsusuring moral sa pagsunod ni Urias
  choice: Isinalin ang talata bilang payak na salaysay nang walang idinagdag na pagsang-ayon o paghatol.
  alternative: Gumamit ng pananalitang nagpapahiwatig na tama o masama ang pagsunod ni Urias.
  rationale: Iniuulat lamang ng Hebreo na ginawa ni Urias ang lahat ayon sa utos ni Ahaz. Bagaman maaaring magbigay ng negatibong pagsusuri ang mas malawak na konteksto, hindi iyon tahasang sinasabi sa talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “Kaya” upang natural na iugnay ang tugon ni Urias sa naunang utos, at pinanatili ang payak na pagpipigil ng salaysay.
