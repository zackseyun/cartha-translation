id: 2KI.16.8
reference: 2 Kings 16:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: tl
  text: Kinuha ni Ahaz ang pilak at ginto na natagpuan sa bahay ni Yahweh at sa mga kabang-yaman ng bahay ng hari, at ipinadala niya ang mga iyon bilang suhol[a] sa hari ng Asiria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tributo” o “handog”; karaniwang may diwang “suhol” ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Tuwirang salin ng karaniwang pandiwang pasalaysay na לקח.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: ang pilak at ginto
  rationale: Pinananatili ang kongkretong pagtukoy sa dalawang mahalagang metal bilang kayamanan.
- source_word: הַנִּמְצָא
  choice: na natagpuan
  rationale: Tuwirang inilalarawan ang passive participle ng מצא at ang kayamanang naroon o makukuha sa mga nabanggit na lugar.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na 'bahay' at ang personal na pangalang Yahweh.
- source_word: וּבְאֹצְרוֹת
  choice: at sa mga kabang-yaman
  rationale: Ipinapakita ang maramihang mga imbakan o lagayan ng kayamanan.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili ang pag-uulit ng salitang 'bahay' sa Hebreo sa halip na tahasang gawing 'palasyo.'
- source_word: וַיִּשְׁלַח
  choice: at ipinadala niya ang mga iyon
  rationale: Likas sa Tagalog ang paglalagay ng panghalip na tumutukoy sa pinagsamang pilak at ginto.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: sa hari ng Asiria
  rationale: Malinaw at karaniwang anyo ng pariralang konstrukto.
- source_word: שֹׁחַד
  choice: bilang suhol
  rationale: Karaniwang may negatibong diwa ang salita at tumutukoy sa suhol, bagaman maaari rin itong unawain bilang tributo o handog sa kontekstong pampolitika.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginagamit sa talata ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Uri ng ibinayad ni Ahaz sa hari ng Asiria
  choice: suhol
  alternative: tributo o handog
  rationale: Mas karaniwang negatibo ang diwa ng שֹׁחַד, kaya hindi ito pinalalambot; gayunman, itinatala sa talababa ang posibleng pampolitikang pagbasa.
translation_notes:
  register: Makabago at marangal na Tagalog na malapit sa anyo ng Hebreo. Ginamit ang “bahay ng hari” upang mapanatili ang pag-uulit ng “bahay,” at inilagay ang pananda ng talababa pagkatapos ng “suhol,” ang salitang tinutukoy nito.
