  source_fidelity: 'Tumpak ang pagsasalin sa lahat ng pangunahing yunit ng Hebreo: kinuha ni Ahaz ang pilak at ginto na naroon/natagpuan sa bahay ni Yahweh at sa mga kabang-yaman ng bahay ng hari, at ipinadala niya ang mga ito bilang suhol sa hari ng Asiria. Ang “bilang suhol” ay wasto para sa שֹׁחַד at hindi pinapalambot ang karaniwang negatibong diwa nito.'
