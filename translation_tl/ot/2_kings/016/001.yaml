base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: tl
  text: Sa ikalabimpitong taon ng paghahari ni Peka na anak ni Remalias, nagsimulang maghari si Ahaz na anak ni Jotam bilang hari ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: Nang ikalabimpitong taon ng paghahari
  rationale: Ang pariralang ito ay isang pormula ng pagtutugma ng mga taon ng paghahari. Likas sa modernong Tagalog ang “Nang ikalabimpitong taon ng paghahari” at malinaw na ordinal na taon, hindi labimpitong taong tagal.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: ni Peka na anak ni Remalias
  rationale: Ang לְ ay tumutukoy sa hari na batayan ng pagbibilang ng taon; pinananatili ng “anak ni” ang patronimikong ugnayan.
- source_word: מָלַךְ
  choice: nagsimulang maghari
  rationale: Sa pormulang panghari, ipinahihiwatig ng qatal ng מלך ang pagluklok o pagsisimula ng paghahari, hindi ang buong haba nito.
- source_word: אָחָז בֶּן יוֹתָם
  choice: si Ahaz na anak ni Jotam
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog at tuwirang isinalin ang patronimiko.
- source_word: מֶלֶךְ יְהוּדָה
  choice: bilang hari ng Juda
  rationale: Ang appositional na titulo ay natural na ipinapahayag sa Tagalog sa pamamagitan ng “bilang,” na nililinaw ang katungkulan ni Ahaz nang hindi nagdaragdag ng kahulugang teolohikal.
