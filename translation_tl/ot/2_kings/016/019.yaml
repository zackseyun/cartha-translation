  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Ahaz, hindi ba nakasulat ang mga ito sa Aklat ng mga Kasaysayan[a] ng mga Hari ng Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Talaan ng mga Hari ng Juda.”
    reason: Ipinapakita ang leksikal na alternatibo para sa דִּבְרֵי הַיָּמִים, na maaari ring tumukoy sa mga annal o opisyal na tala.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אָחָז
  choice: Ang iba pang mga ginawa ni Ahaz
  rationale: Sa pormulang nagbubuod sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o gawain ng hari, hindi lamang sa kaniyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: אֲשֶׁר עָשָׂה
  choice: mga ginawa
  rationale: Isinama ang diwa ng sugnay na “na ginawa niya” sa pariralang “mga ginawa” upang maiwasan ang mabigat at paulit-ulit na “mga ginawa ... na ginawa niya,” nang hindi nawawala ang kahulugan.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa. Ang “mga iyon” ay kumakatawan sa tahasang הֵם at tumutukoy sa mga ginawa ni Ahaz.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng aklat/rolyo,” ang “sa Aklat” ang likas na Filipino para sa pagtukoy sa nilalaman ng isang nakasulat na tala.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: mga Kasaysayan ng mga Hari ng Juda
  rationale: Ang “mga Kasaysayan” ay malinaw at marangal na katumbas ng pamagat na tumutukoy sa kronikal o taunang tala. Ang “ng mga Hari ng Juda” ay natural na paglilipat ng ugnayang ipinahihiwatig ng לְ.
