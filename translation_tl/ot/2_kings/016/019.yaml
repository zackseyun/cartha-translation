translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang pormulang retorikal ng Hebreo, habang pinagsama ang inuulit na “ginawa” upang maging malinaw at madaling basahin. Inilagay ang panandang [a] sa pamagat na tinutukoy ng talababa.
