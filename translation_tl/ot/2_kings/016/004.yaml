base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: tl
  text: Naghandog siya ng mga hain at nagsunog ng insenso sa mga mataas na lugar, sa mga burol, at sa ilalim ng bawat luntiang puno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat madahong puno” o “bawat malagong puno.” Ang salitang Hebreo ay maaaring maglarawan ng isang bagay na luntian, sariwa, o mayabong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Naghandog siya ng mga hain
  rationale: Ang זבח ay tumutukoy sa paghahandog ng hain. Mas natural sa modernong Tagalog ang pariralang ito kaysa sa simpleng “naghain,” at malinaw nitong pinananatili ang gawaing panrelihiyon.
- source_word: וַיְקַטֵּר
  choice: nagsunog ng insenso
  rationale: Sa kontekstong panrelihiyon, ang piel ng קטר ay karaniwang tumutukoy sa pagsusunog ng insenso o pagpapausok ng handog. Ang “nagsunog ng insenso” ay malinaw at angkop sa paulit-ulit na pormula sa Mga Hari.
- source_word: בַּבָּמוֹת
  choice: sa matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na lugar ng pagsamba, madalas ngunit hindi laging nasa mataas na dako. Iniiwasan ng “matataas na sambahan” na ipakahulugan ang mga ito bilang mga burol lamang at ipinakikitang mga pook panrelihiyon ang tinutukoy.
- source_word: וְעַל הַגְּבָעוֹת
  choice: sa mga burol
  rationale: Ang גְּבָעוֹת ay literal na “mga burol.” Pinananatiling hiwalay ang topograpikong katawagan mula sa mga kultikong pook na בָּמוֹת.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: at sa ilalim ng bawat luntiang puno
  rationale: Ang רַעֲנָן ay maaaring mangahulugang luntian, sariwa, mayabong, o malago. Ang “luntiang puno” ay natural at marangal sa Tagalog at pinananatili ang kongkretong larawan at pamilyar na pormulang biblikal.
theological_decisions:
- issue: Paglalarawan sa pormula ng di-wastong pagsamba
  choice: 'Pinanatili ang kongkretong mga kilos at lugar: “Naghandog siya ng mga hain at nagsunog ng insenso sa matataas na sambahan, sa mga burol, at sa ilalim ng bawat luntiang puno.”'
  alternative: Mas interpretibong salin gaya ng “Sumamba siya sa mga diyus-diyosan sa mga dambana sa burol at sa ilalim ng bawat malagong puno.”
  rationale: Hindi tahasang sinasabi ng Hebreo sa talatang ito ang “mga diyus-diyosan” o “paganong pagsamba.” Hinahayaan ng salin na ang mas malawak na konteksto ang magbigay ng negatibong paghatol, nang hindi nagdaragdag ng teolohikal na paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “matataas na sambahan” bilang teknikal ngunit madaling maunawaang katawagan sa mga lokal na pook ng pagsamba; hindi idinagdag ang “pagano” o “diyus-diyosan,” sapagkat wala ang mga iyon sa mismong Hebreo.
