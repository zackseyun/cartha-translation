  naturalness: Malinaw ang kabuuang pangungusap at ang “luntiang puno” ay natural at marangal. Ang “matataas na sambahan” ay hindi gaanong likas sa modernong Filipino at maaaring maunawaan bilang matataas na gusaling sambahan; ang “mga mataas na lugar” ay mas matatag na terminong biblikal at mas malapit sa Hebreo.
  terminology: Ang “mga hain,” “insenso,” “mga burol,” at “luntiang puno” ay angkop. Pinalitan ang “matataas na sambahan” ng “mga mataas na lugar” upang mapanatili ang natatanging kultikong katawagan para sa בָּמוֹת nang hindi ito pinaghahalo sa literal na “mga burol.”
