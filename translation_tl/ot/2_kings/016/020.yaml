base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Ahaz kasama ng kanyang mga ninuno[a]. Inilibing siyang kasama ng kanyang mga ninuno sa Lunsod ni David, at ang anak niyang si Hezekias ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pananalitang Hebreo na “nahimlay kasama ng kanyang mga ninuno” ay nakaugaliang pahayag tungkol sa pagkamatay ng isang hari; ibig sabihin, namatay si Ahaz at napabilang sa kanyang mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Sa pormularyong pahayag tungkol sa pagkamatay ng isang hari, ang pandiwa kasama ng pariralang “kasama ng kanyang mga ninuno” ay tumutukoy sa kamatayan. Pinananatili ng “nahimlay” ang marangal at matalinghagang himig nang hindi nagmumukhang karaniwang pagtulog.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Bagaman literal na “kasama ng kanyang mga ama,” ang “mga ninuno” ang natural na modernong Tagalog para sa mga naunang salinlahi at malinaw na nagpapanatili sa dinastikong diwa ng pormularyo.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Tuwirang ipinapahayag ng anyong Niphal ang pasibong diwang “inilibing,” na natural sa modernong Tagalog.
- source_word: בְּעִיר דָּוִד
  choice: sa Lunsod ni David
  rationale: Ito ang malinaw at nakaugaliang anyo ng pangalang-pook sa Tagalog.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Sa pahayag ng paghalili sa trono, ang pandiwa ay tumutukoy sa paghahari ng sumunod na hari; maikli at natural ang “naghari.”
- source_word: חִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang makikilalang anyong Tagalog ng pangalan habang nananatiling malapit sa Hebreong pangalan.
- source_word: בְנוֹ
  choice: ang anak niyang
  rationale: Malinaw na pinananatili ang ugnayang ama at anak na tahasang nasa Hebreo.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, natural na ipinahihiwatig nito na pumalit ang anak sa posisyon ng kanyang ama.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pormularyong katangian ng ulat sa pagkamatay at paghalili ng hari, habang iniwasan ang sobrang literal na “natulog kasama ng kanyang mga ama,” na maaaring mapagkamalang karaniwang pagtulog.
