translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patungan,” “palanggana,” at “latag na bato” upang maging kongkreto at madaling maunawaan ang mga kagamitan at kilos, habang pinanatili ang “Dagat” bilang natatanging pangalan. Inayos ang pagkakasunod sa dalawang pangungusap para sa likas na daloy sa Filipino nang hindi binabago ang ugnayan ng mga kilos.
