  to: Pagkatapos, pinutol ni Haring Ahaz ang mga balangkas ng mga patungan at inalis mula sa mga iyon ang palanggana.[a] Ibinaba rin niya ang Dagat[b] mula sa ibabaw ng mga tansong baka[c] na nasa ilalim nito at inilagay iyon sa isang batong sahig.
