base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: tl
  text: Pagkatapos, pinutol ni Haring Ahaz ang mga balangkas ng mga patungan at inalis mula sa mga iyon ang palanggana.[a] Ibinaba rin niya ang Dagat[b] mula sa ibabaw ng mga tansong baka[c] na nasa ilalim nito at inilagay iyon sa isang batong sahig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang palanggana,” bagaman maramihan ang “mga patungan.” Ang palanggana ay sisidlang hugasan na ginagamit sa paglilingkod sa templo.
    reason: textual_grammar_and_lexical_clarity
  - marker: b
    text: Ang “Dagat” ang tawag sa malaking palangganang ginawa para sa templo ni Solomon (tingnan ang 1 Hari 7:23–26).
    reason: cross_reference
  - marker: c
    text: Maaari ring “mga tansong toro.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa mga baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: pinutol
  rationale: Tuwirang ipinahahayag ng pandiwang קצץ ang pagputol o pagtatanggal sa pamamagitan ng pagputol; ang “pinutol” ay natural at hindi nagdaragdag ng tiyak na detalye.
- source_word: הַמִּסְגְּרוֹת
  choice: mga balangkas
  rationale: Ang מִסְגְּרוֹת ay tumutukoy sa mga frame o bahaging nakapalibot; ang “mga balangkas” ay neutral at angkop sa kayarian ng mga patungan.
- source_word: הַמְּכֹנוֹת
  choice: mga patungan
  rationale: Sa konteksto ng mga kagamitan sa templo, ang מְכֹנוֹת ay mga suportang patungan ng mga palanggana. Mas malinaw sa karaniwang mambabasa ang “mga patungan” kaysa teknikal na katawagan.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: inalis sa ibabaw ng mga iyon ang mga palanggana
  rationale: Ipinakikita ng מֵעֲלֵיהֶם na inalis ang sisidlan mula sa ibabaw ng mga patungan. Bagaman singular ang anyo sa tekstong Masoretiko, ang maramihang patungan at konteksto ng magkakatambal na kagamitan ay likas na naipahahayag sa Filipino bilang “mga palanggana,” habang itinatala sa talababa ang literal na anyo.
- source_word: הַכִּיּוֹר
  choice: mga palanggana
  rationale: Ang כִּיּוֹר ay palangganang ginagamit sa paglilingkod sa templo. Ang “palanggana” ay mas madaling maunawaan kaysa sa tradisyonal ngunit di-karaniwang “lababo.”
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Ito ang kinikilalang pangalan ng malaking palangganang ginawa para sa templo ni Solomon; pinananatili ng malaking titik ang gamit nito bilang pangalan ng isang partikular na kagamitan.
- source_word: הוֹרִיד
  choice: ibinaba
  rationale: Ang hiphil ng ירד ay nagpapahiwatig ng pagpapababa mula sa kinalalagyan o suportang nasa ilalim.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: mga tansong baka
  rationale: Ang בָּקָר ay pangkalahatang tumutukoy sa mga baka; hindi tiyak sa Hebreo kung toro o kapong baka, kaya pinananatili ng “baka” ang saklaw ng salita.
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: na nasa ilalim nito
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy pabalik sa Dagat; natural itong isalin sa Filipino bilang “nito.”
- source_word: וַיִּתֵּן אֹתוֹ
  choice: inilagay iyon
  rationale: Payak na paglalagay ang ipinahahayag ng נתן; malinaw na tumutukoy ang “iyon” sa Dagat.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: sa isang latag na bato
  rationale: Ang מַרְצֶפֶת ay isang ibabaw na nilatagan o sinapnan; ang “latag na bato” ay nagpapanatili sa diwa ng batong pavement nang hindi nagpapahiwatig ng nakataas na plataporma.
