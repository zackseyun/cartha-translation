  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: tl
  text: Tungkol naman sa altar na tanso na nasa harap ni Yahweh[a], inilipat niya ito mula sa harap ng bahay, mula sa pagitan ng altar at ng bahay ni Yahweh[b], at inilagay niya ito sa hilagang panig ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “altar na bronse.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: clarification
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: altar na tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse. Ang “tanso” ay likas at karaniwang katawagan sa Filipino, habang ang alternatibong materyal na “bronse” ay pinananatili sa talababa.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: na nasa harap ni Yahweh
  rationale: Pinananatili ng “nasa harap” ang pangunahing panlokasyong diwa ng לִפְנֵי at maaari ring magpahiwatig ng presensiyang panritwal nang hindi ito ipinapaliwanag nang labis.
- source_word: וַיַּקְרֵב
  choice: inilipat niya iyon
  rationale: Sa kontekstong ito, inilalarawan ng pandiwa ang pag-aalis at muling paglalagay ng altar. Mas malinaw sa Filipino ang “inilipat” kaysa literal na “inilapit,” na maaaring magbigay ng maling direksiyon.
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  choice: mula sa harap ng bahay
  rationale: Ang פְּנֵי sa panlokasyong parirala ay tumutukoy sa harapang bahagi ng gusali; pinananatili rin ang literal na terminong “bahay.”
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: mula sa pagitan ng altar at ng bahay ni Yahweh
  rationale: Malinaw na ipinahahayag ang dating lokasyon ng altar at pinananatili ang Hebreong katawagang “bahay ni Yahweh” sa halip na agad itong gawing “templo.”
- source_word: וַיִּתֵּן אֹתוֹ
  choice: at inilagay iyon
  rationale: Ang “inilagay” ay natural na katumbas ng נתן sa konteksto ng pisikal na pagpoposisyon.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: sa hilagang panig ng altar
  rationale: Ang יֶרֶךְ ay “tagiliran/panig,” at ang צָפוֹנָה ay nagbibigay ng direksiyong pahilaga; natural at tumpak ang “sa hilagang panig.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “bahay ni Yahweh” upang katawanin ang Hebreong בֵּית יְהוָה, habang nililinaw sa talababa na templo ang tinutukoy. Ginamit ang “altar” bilang karaniwan at malinaw na terminong panrelihiyon.
