base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: tl
  text: Kaya pinakinggan siya ng hari ng Asiria[a]. Sinalakay ng hari ng Asiria ang Damasco at sinakop ito. Ipinatapon niya sa Kir ang mga tagaroon[b], at pinatay niya si Rezin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumalima sa kanya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pakikinig na sinusundan ng pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ipinatapon iyon sa Kir,” na ang lungsod ay kumakatawan sa mga naninirahan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: pinakinggan siya
  rationale: Ang שׁמע na may אֶל ay maaaring mangahulugang makinig o tumalima. Likas sa Filipino ang “pinakinggan siya,” at ipinahihiwatig ng kasunod na mga kilos na tumugon ang hari sa kahilingan ni Ahaz.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang salin ng construct chain; inulit ang buong katawagan gaya sa Hebreo upang mapanatili ang diin ng salaysay.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: sinalakay ... ang Damasco
  rationale: Sa kontekstong militar, ang pag-ahon o pagpunta laban sa isang lungsod ay likas na ipinahahayag sa Filipino bilang pagsalakay. Nililinaw ito ng kasunod na pagsakop, pagpapatapon, at pagpatay.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: sinakop iyon
  rationale: Ang תפשׂ dito ay pagkuha ng kontrol sa lungsod. Ang “sinakop” ay natural na terminong militar at malinaw na tumutukoy sa Damasco.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: dinala niyang bihag sa Kir ang mga tagaroon
  rationale: Sa Hebreo, ang lungsod ang gramatikal na layon ngunit kumakatawan ito sa mga naninirahan. Ang “dinala niyang bihag” ay naghahatid ng sapilitang pagpapatapon nang natural sa Filipino.
- source_word: קִירָה
  choice: Kir
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: וְאֶת רְצִין הֵמִית
  choice: at ipinapatay niya si Rezin
  rationale: Ang causative na הֵמִית ay “pinatay” o “ipinapatay.” Ang “ipinapatay” ay natural at pinananatili ang diwang ang hari ang nag-utos o naging sanhi ng kamatayan ni Rezin, nang hindi iginigiit na siya mismo ang pumatay.
