base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: tl
  text: Pagkatapos, pumunta si Haring Ahaz sa Damasco upang salubungin si Tiglat-pileser, hari ng Asiria. Nang makita niya ang altar na nasa Damasco, ipinadala ni Haring Ahaz kay Urias na pari ang isang larawan ng altar at ang disenyo nito, kasama ang lahat ng detalye ng pagkakayari nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag nito ang pagpunta upang makipagtagpo o sumalubong, nang hindi dinaragdagan ang layunin ng pagpupulong.
- source_word: דְּמוּת
  choice: isang larawan
  rationale: Ang salita ay tumutukoy sa wangis o representasyon ng altar; natural sa Filipino ang “larawan” at hindi nito ipinapalagay na ipinadala ang isang pisikal na maliit na modelo.
- source_word: תַּבְנִיתוֹ
  choice: ang disenyo nito
  rationale: Tumutukoy sa anyo, balangkas, o plano ng altar; “disenyo” ang malinaw at natural na katumbas sa konteksto.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: ayon sa bawat detalye ng pagkakagawa nito
  rationale: Inihahatid ang ideya ng kabuuan ng workmanship o paraan ng pagkakayari, sa natural na modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignidad ang tono. Pinanatili ang pag-uulit ng titulong “Haring Ahaz” upang tumugma sa diin at estruktura ng Hebreo, habang hinati sa dalawang pangungusap para sa malinaw na pagbasa.
