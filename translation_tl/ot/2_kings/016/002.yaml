  source_fidelity: Tumpak ang edad, haba at lugar ng paghahari, at ang pormula ng moral na pagtatasa. Gayunman, ang pangunahing teksto ay nagpapalit ng אָבִיו (“kanyang ama”) bilang “kanyang ninuno,” samantalang ang Hebreo ay tahasang gumagamit ng ‘ama’; ang dinastikong kahulugan ay dapat ipaliwanag sa talababa, hindi ipalit sa teksto.
  naturalness: Likas at malinaw ang karamihan ng salin. Ang “Hindi niya ginawa ang matuwid” ay katanggap-tanggap na marangal at natural sa ganitong pormulang biblikal. Ang “gaya ni David na kanyang ama” ay natural din kapag nilinaw ng talababa ang dinastikong gamit ng ‘ama.’
