id: 2KI.16.2
reference: 2 Kings 16:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: tl
  text: Dalawampung taong gulang si Ahaz nang magsimula siyang maghari, at labing-anim na taon siyang naghari sa Jerusalem. Hindi niya ginawa ang matuwid sa paningin ni Yahweh na kanyang Diyos, gaya ni David na kanyang ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “David na kanyang ama.” Sa kontekstong maharlika, ang “ama” ay maaaring tumukoy sa isang ninuno o dinastikong nauna, hindi sa kanyang agarang ama.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: Dalawampung taong gulang
  rationale: Likas na katumbas sa modernong Tagalog ng Hebreong idyoma para sa edad.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ang panahon ng pagluklok ni Ahaz sa trono.
- source_word: מָלַךְ
  choice: naghari
  rationale: Pinananatili ang pandiwang diwa ng aktuwal na paghahari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong pagtukoy sa luklukan ng kanyang paghahari.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Hindi niya ginawa ang matuwid
  rationale: Natural at marangal na Tagalog para sa karaniwang pormula ng moral na pagtatasa sa Mga Hari.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Malinaw na Tagalog na nagpapanatili sa Hebreong idyoma ng pagtatasa mula sa pananaw ng isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasaad sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang panghalip na tumutukoy kay Ahaz at ang tipanang pananalita ng pormula.
- source_word: כְּדָוִד אָבִיו
  choice: gaya ng ginawa ng kanyang ninunong si David
  rationale: Sa kontekstong maharlika, ang אָבִיו ay tumutukoy sa ninuno sa dinastiya, hindi sa agarang ama; natural ding ipinahahayag sa Tagalog ang ipinahihiwatig na pandiwang 'ginawa'.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tuwirang ginagamit ng tekstong Hebreo; pinananatili ito upang hindi mapalitan ng titulo.
- issue: Kahulugan ng כְּדָוִד אָבִיו
  choice: kanyang ninunong si David
  alternative: kanyang amang si David
  rationale: Bagaman literal na 'ama' ang אָב, karaniwan itong nangangahulugang ninuno o dinastikong pinagmulan sa ganitong pormulang maharlika. Ang 'ninuno' ay umiiwas sa maling pagkaunawang si David ang agarang ama ni Ahaz, habang itinatala sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang pormulang “sa paningin ni Yahweh” upang mapanatili ang larawan ng Hebreo nang hindi nagiging lipas o di-natural.
