  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: tl
  text: Lumakad siya sa landas ng mga hari ng Israel, at maging ang kanyang anak ay pinaraan niya sa apoy[a], gaya ng kasuklam-suklam na mga gawain ng mga bansang itinaboy ni Yahweh mula sa harap ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “inihandog niya sa apoy ang kanyang anak.” Literal sa Hebreo: “pinaraan niya sa apoy ang kanyang anak,” isang idyomang kaugnay ng isang hinatulang paganong ritwal.'
    reason: Pinananatili ang literal na idyoma sa teksto habang inilalahad ang mas tiyak na alternatibong pagbasa nang hindi ito ipinipilit.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Lumakad siya sa landas
  rationale: Pinananatili ang Hebreong talinghaga tungkol sa asal at pamumuhay, habang nananatiling malinaw at natural sa makabagong Tagalog.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: mga hari ng Israel
  rationale: Tuwirang katumbas ng pariralang tumutukoy sa mga pinuno ng hilagang kaharian bilang huwaran ng masamang asal.
- source_word: וְגַם
  choice: Maging
  rationale: 'Ipinahahayag ang pagdidiin at paglala: bukod sa pagtulad niya sa mga hari ng Israel, ginawa rin niya ang mas matinding kasalanang sumunod.'
- source_word: אֶת־בְּנוֹ
  choice: ang sarili niyang anak
  rationale: Pinananatili ang isahan; ang “sarili niyang” ay natural na Tagalog na nagbibigay-diin sa nakagigimbal na ugnayang ipinahihiwatig ng Hebreo.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: pinaraan niya sa apoy
  rationale: Pinananatili ang sanhiing anyo at ang sadyang hindi ganap na tiyak na idyomang Hebreo, nang hindi awtomatikong tinutukoy kung ito ay ganap na pagsunog bilang handog o ibang ritwal sa apoy.
- source_word: כְּתֹעֲבוֹת
  choice: gaya ng kasuklam-suklam na mga gawain
  rationale: Ipinakikita ang pagtulad sa mga gawaing relihiyoso at moral na mariing hinahatulan; idinagdag ang “mga gawain” upang maging natural at malinaw sa Tagalog.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Neutral at angkop sa kasaysayang katawagan para sa mga di-Israelitang bayan sa lupain.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: itinaboy
  rationale: Ipinahahayag ang kahulugan ng pagpapaalis o pagtataboy sa mga dating naninirahan sa lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵי
  choice: mula sa harap
  rationale: Pinananatili ang larawang Hebreo ng pagpapaalis sa harapan o daraanan ng Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong katawagang pangkasunduan sa halip na gawing mas pangkalahatang “mga Israelita.”
theological_decisions:
- issue: Kung tahasang isasalin ang הֶעֱבִיר בָּאֵשׁ bilang paghahandog o pagsunog sa anak
  choice: Panatilihin sa pangunahing teksto ang idyomang “pinaraan niya sa apoy.”
  alternative: “inihandog niya sa apoy ang kanyang anak” o “sinunog niya sa apoy ang kanyang anak”
  rationale: Malinaw na hinahatulan ng talata ang isang paganong ritwal, ngunit hindi tahasang inilalarawan ng pariralang Hebreo ang lahat ng detalye nito. Pinananatili ng salin ang tunay na saklaw ng pananalita, habang inilalahad sa talababa ang mas tiyak na posibleng pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinananatili ang mga larawang “lumakad sa landas,” “pinaraan sa apoy,” at “mula sa harap” dahil mahalaga ang mga ito sa anyo at sadyang saklaw ng Hebreo; nilinaw lamang ang “mga kasuklam-suklam” bilang “kasuklam-suklam na mga gawain.”
