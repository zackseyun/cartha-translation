id: 2KI.16.5
reference: 2 Kings 16:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: tl
  text: Noon, umakyat sa Jerusalem upang makipagdigma si Rezin, hari ng Aram, at si Peka, anak ni Remalias, hari ng Israel. Kinubkob nila si Ahaz, ngunit hindi nila siya nagawang labanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ngunit hindi nila nagawang labanan ito,” kung ang “ito” ay tumutukoy sa Jerusalem. Hindi tahasang binanggit sa Hebreo ang layon pagkatapos ng “labanan.”
    reason: Pinananatili ang kalabuan kung si Ahaz o ang Jerusalem ang di-binanggit na layon ng huling pandiwa.
lexical_decisions:
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Natural na panandang temporal sa salaysay; ipinahihiwatig ang kasunod na pangyayari nang hindi labis na pinatitindi ang agarang pagkakasunod.
- source_word: יַעֲלֶה
  choice: umahon
  rationale: Pinananatili ang karaniwang biblikal at heograpikong diwa ng pag-akyat patungong Jerusalem, kasama ang konteksto ng pagkilos ng hukbo.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: si Rezin na hari ng Aram
  rationale: Direktang transliterasyon ng pangalan at ng Hebreong katawagang heograpiko; mas tapat ang “Aram” kaysa sa tradisyonal na “Siria.”
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: at si Peka na anak ni Remalias, na hari ng Israel
  rationale: Malinaw na inilalahad ang patronimiko at ang titulong maharlika sa natural na ayos ng modernong Tagalog.
- source_word: יְרוּשָׁלַםִ לַמִּלְחָמָה
  choice: sa Jerusalem upang makipagdigma
  rationale: Ipinapahayag ang patutunguhan at layuning militar; natural sa Tagalog at hindi nagdaragdag ng tiyak na paraan ng paglusob.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Kinubkob nila si Ahaz
  rationale: Ang צור על sa kontekstong militar ay tumutukoy sa pagkubkob; pinananatili bilang tuwirang layon si Ahaz gaya ng Hebreo, bagaman maaaring metonimikong tumukoy sa lungsod at pamumuno niya.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: ngunit hindi nila nagawang makipaglaban sa kanya
  rationale: Pinananatili ang tahasang diwa ng kawalan ng kakayahan at ng pandiwang “makipaglaban.” Idinugtong ang “sa kanya” bilang natural na Tagalog na tumutukoy kay Ahaz, habang itinatala sa talababa ang tunay na kalabuan ng di-binanggit na layon sa Hebreo.
theological_decisions:
- issue: Hindi tahasang binanggit ang layon ng לְהִלָּחֵם sa Hebreo
  choice: sa kanya, na tumutukoy kay Ahaz
  alternative: labanan ito, na tumutukoy sa Jerusalem
  rationale: Si Ahaz ang pinakamalapit na tahasang layon sa sugnay, ngunit hindi inuulit ng Hebreo ang layon pagkatapos ng “makipaglaban.” Kaya hindi dapat itago ang posibilidad na Jerusalem ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “umahon,” “makipagdigma,” at “kinubkob” bilang malinaw na mga terminong pangsalaysay at militar; iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
