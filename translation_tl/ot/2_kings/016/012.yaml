  source_fidelity: Tumpak ang pangunahing daloy ng salaysay at ang pagsasalin ng mga pandiwa. Gayunman, ang “umakyat dito” ay maaaring tumukoy lamang sa pag-akyat patungo sa lugar na iyon at hindi malinaw na naipapakita ang עָלָיו, “sa ibabaw nito/dito sa altar.” Ligtas na gawing mas malinaw ang kaugnayan sa altar nang hindi ipinapasok ang kahulugang “naghandog.”
  naturalness: Natural at angkop sa modernong Filipino ang pangungusap. Ang “umakyat sa ibabaw nito” ay bahagyang mas malinaw ngunit nananatiling madaling basahin; malinaw ang panghalip na tumutukoy sa altar.
  terminology: Ang “Damasco” at “altar” ay mga angkop at matatag na katawagan. Wasto ring iwanang alternatibong pagbasa sa talababa ang “naghandog,” sa halip na ilagay ito sa pangunahing teksto.
