  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: tl
  text: Nang dumating ang hari mula sa Damasco, nakita niya ang altar. Lumapit ang hari sa altar at umakyat sa ibabaw nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumapit sa altar at naghandog dito.” Itinuturing ng ilan na ang “umakyat sa ibabaw nito” ay pinaikling pahayag para sa pagsisimula ng paghahandog, bagaman mas literal na inilalarawan ng Hebreo ang pag-akyat sa altar.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא sa salaysay ay tumutukoy sa pagdating ng hari; natural at malinaw sa modernong Filipino ang “dumating.”
- source_word: הַמֶּלֶךְ
  choice: ang hari / niya
  rationale: Tatlong ulit ang tahasang “ang hari” sa Hebreo. Pinanatili ito sa una at ikatlong kilos, ngunit ginamit ang natural na panghalip sa ikalawa upang maiwasan ang mabigat na pag-uulit sa Filipino nang hindi nilalabo ang gumagawa.
- source_word: מִדַּמֶּשֶׂק
  choice: mula sa Damasco
  rationale: Ang מִן ay nagpapahayag ng pinanggalingan; “Damasco” ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: וַיַּרְא
  choice: nakita
  rationale: Tuwirang pandama sa paningin ang kahulugan ng ראה sa kontekstong ito.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ang “altar” ang karaniwan at eksaktong katumbas ng מִזְבֵּחַ sa Filipino.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: lumapit sa altar
  rationale: Ang קרב ay “lumapit,” at ang עַל kasunod nito ay likas na tumutukoy sa bagay na nilalapitan.
- source_word: וַיַּעַל עָלָיו
  choice: umakyat dito
  rationale: Pinananatili nito ang lantad na kahulugan ng עלה na pag-akyat at ng עָלָיו na paggalaw sa ibabaw o onto nito, nang hindi pa ipinapasok ang paghahandog na tahasang inilalarawan sa kasunod na talata.
theological_decisions:
- issue: Kung ang וַיַּעַל עָלָיו ay pisikal na pag-akyat o pinaikling pahayag tungkol sa paghahandog
  choice: 'Pisikal na pag-akyat: “umakyat dito”'
  alternative: “naghandog dito” o “lumapit dito upang maghandog”
  rationale: Sa anyong Hebreo, ang עלה na may עַל at hulaping panghalip ay pinakanatural na naglalarawan ng pag-akyat dito/sa ibabaw nito. Ang pagsasalin bilang paghahandog ay posibleng pagpapakahulugan ayon sa konteksto ngunit nagdaragdag ng kilos na hindi tahasang nasa sugnay.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy. Ang “dito” ay tumutukoy sa altar; inilagay ang talababa upang mapanatili ang tunay na posibilidad ng alternatibong pagbasa.
