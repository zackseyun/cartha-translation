base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: tl
  text: At sinunog niya ang kanyang handog na sinusunog at ang kanyang handog na butil, ibinuhos ang kanyang handog na inumin, at isinaboy niya sa altar ang dugo ng mga handog na pangkapayapaan na kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa mabuting ugnayan” o “mga handog para sa kapakanan.” Ang salitang Hebreo ay tumutukoy sa isang tiyak na uri ng handog (שְׁלָמִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: sinunog niya sa ibabaw ng altar
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng handog upang pumailanlang ang usok nito. Likas sa modernong Tagalog ang “sinunog,” at nililinaw ng “sa ibabaw ng altar” ang rituwal na tagpo.
- source_word: עֹלָתוֹ
  choice: kanyang handog na sinusunog
  rationale: Ang עֹלָה ay tiyak na uri ng hain na sinusunog sa altar. Ang pariralang ito ay malinaw at karaniwang nauunawaan sa Tagalog.
- source_word: מִנְחָתוֹ
  choice: kanyang handog na butil
  rationale: Sa kontekstong pangkulto, ang מִנְחָה ay karaniwang handog na mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: וַיַּסֵּךְ אֶת־נִסְכּוֹ
  choice: ibinuhos ang kanyang handog na inumin
  rationale: Ang נסך ay rituwal na pagbubuhos ng likidong handog. Pinananatili ng salin ang kilos at ang natatanging uri ng handog.
- source_word: וַיִּזְרֹק
  choice: isinaboy
  rationale: Ang זרק ay nagpapahiwatig ng paghagis o pagsaboy ng dugo sa altar, hindi kinakailangang marahang pagwiwisik. Ang “isinaboy” ay natural at hindi labis na nagpapaliit sa lakas ng kilos.
- source_word: דַּם הַשְּׁלָמִים
  choice: dugo ng kanyang mga handog na pangkapayapaan
  rationale: Ang שְׁלָמִים ay isang tiyak na kategorya ng hain. Ang “handog na pangkapayapaan” ay maikli at nakikilala, habang inilalahad sa talababa ang iba pang posibleng pagpapakahulugan.
- source_word: אֲשֶׁר לוֹ
  choice: kanyang
  rationale: Ang Hebreong parirala ay likas na nagpapahayag na ang mga handog ay sa kanya o pag-aari niya. Sapat at natural itong ipinapahayag ng panghalip na paari.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Kasama ng זרק, maaaring tumukoy ang עַל sa pagsaboy laban sa o sa ibabaw ng altar. Pinananatili ng “sa altar” ang saklaw ng orihinal nang hindi ipinipilit ang eksaktong bahaging tinamaan.
theological_decisions:
- issue: Kahulugan ng katawagang pansakripisyo na שְׁלָמִים
  choice: handog na pangkapayapaan
  alternative: handog para sa mabuting ugnayan; handog para sa kapakanan
  rationale: Hindi ganap na matutumbasan ng iisang salitang Tagalog ang saklaw ng terminong Hebreo. Pinili ang nakikilalang katawagan sa teksto at pinanatili sa talababa ang tunay na leksikal na mga alternatibo nang walang pag-aangkat ng sektaryong pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang malinaw na mga katawagang pansakripisyo at iniwasan ang mga salitang sobrang teknikal. Inilagay ang talababa sa “mga handog na pangkapayapaan,” ang terminong talagang tinutukoy nito.
