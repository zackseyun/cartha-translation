  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: tl
  text: 'Pagkatapos, inutusan ni Haring Ahaz si Urias na pari: “Sa malaking altar, sunugin mo bilang handog ang handog na sinusunog sa umaga at ang handog na butil sa gabi, ang handog na sinusunog ng hari at ang kanyang handog na butil, at ang handog na sinusunog ng lahat ng mamamayan ng lupain, kasama ang kanilang mga handog na butil at mga handog na inumin. Isaboy mo rito ang lahat ng dugo ng handog na sinusunog at lahat ng dugo ng hain. Ngunit ang tansong altar ay magiging para sa akin upang sangguniin ko.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang siyasatin,” “upang pag-isipan,” o marahil “upang humingi ng patnubay sa pamamagitan nito.” Mahirap unawain ang pananalitang Hebreo, kaya hindi tiyak kung ano mismo ang paggagamitan ni Ahaz sa tansong altar.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: inutusan ni Haring Ahaz si Urias na pari
  rationale: Ipinahahayag ng “inutusan” ang awtoridad ng צוה, samantalang natural sa modernong Tagalog ang ayos ng titulong “Haring Ahaz.”
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: sa malaking altar
  rationale: Pinananatili ang literal na pagkakaiba ng bagong malaking altar sa tansong altar na binanggit sa hulihan.
- source_word: הַקְטֵר
  choice: sunugin bilang handog
  rationale: Ang Hiphil ng קטר ay tumutukoy sa pagpapausok o pagsunog ng handog sa altar; malinaw sa karaniwang mambabasa ang pariralang ito at hindi nito ikinukubli ang aktuwal na ritwal.
- source_word: עֹלַת הַבֹּקֶר ... מִנְחַת הָעֶרֶב
  choice: handog na sinusunog tuwing umaga ... handog na butil tuwing gabi
  rationale: Nililinaw ang mga uri ng handog at ang regular na panahon ng paghahandog, sa natural na ayos ng Tagalog.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: mga handog na sinusunog ng buong bayan
  rationale: Ang “buong bayan” ay natural na kolektibong salin ng עַם הָאָרֶץ sa kontekstong ito, nang hindi ito nililimitahan sa isang tiyak na uring panlipunan.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: kanilang mga handog na butil at mga handog na inumin
  rationale: Pinananatili ang dalawang magkaibang uri ng handog at ang diwang distributibo ng mga hulaping maramihan.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: lahat ng dugo ng mga handog na sinusunog at ng iba pang mga hain
  rationale: Pinag-iiba ang עֹלָה sa mas pangkalahatang זֶבַח; ang “iba pang” ay nagpapalinaw na hindi inuulit lamang ang unang uri ng handog.
- source_word: עָלָיו תִּזְרֹק
  choice: isaboy mo rin dito
  rationale: Mas tumpak ang “isaboy” kaysa “wisikan” para sa puwersa ng זרק, at malinaw na ang tinutukoy ay ang malaking altar.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: ang tansong altar
  rationale: Direktang kinakatawan ang materyal na נְחֹשֶׁת at pinananatili ang pagkakaiba nito sa malaking altar.
theological_decisions:
- issue: Ang tiyak na kahulugan ng לְבַקֵּר at ang tungkuling inilaan ni Ahaz sa tansong altar
  choice: upang pagsanggunian
  alternative: upang siyasatin; upang pag-isipan; upang humingi ng patnubay sa pamamagitan nito
  rationale: Mahirap tiyakin ang diwa ng pandiwa sa kontekstong ito. Ang “pagsanggunian” ay nagpapanatili ng posibleng kahulugang konsultatibo nang hindi tahasang nagtatakda ng isang partikular na gawaing panghuhula o ritwal na hindi malinaw sa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na “altar” at malinaw na mga katawagang “handog na sinusunog,” “handog na butil,” at “handog na inumin.” Inilagay ang talababa sa malabong huling parirala na siyang tunay na paksa ng tala.
