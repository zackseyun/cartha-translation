  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: tl
  text: Inilihis niya[c] mula sa templo ni Yahweh ang natatakpang daanan para sa Sabbath na itinayo nila sa templo[a], pati ang panlabas na pasukan ng hari[b], dahil sa hari ng Asiria.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang natatakpang estruktura para sa Sabbath,” “ang pavilion para sa Sabbath,” o “ang portiko para sa Sabbath.” Hindi tiyak ang eksaktong anyong pang-arkitektura ng terminong Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang pasukan ng hari sa labas” o “ang panlabas na pasukan para sa hari.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “binago niya,” “inilipat niya,” o “inalis niya mula sa templo ni Yahweh.” Maaaring tumukoy ang pandiwang Hebreo sa paglilihis o pagbabago ng kinalalagyan, hindi lamang sa lubusang pag-aalis.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “dahil sa takot sa hari ng Asiria.”
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: ang natatakpang daanan para sa Sabbath
  rationale: Ang מיסך ay isang bihira at di-tiyak na terminong pang-arkitektura. Ipinahihiwatig ng saling ito ang isang natatakpang bahagi na kaugnay ng Sabbath nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: na itinayo nila sa templo
  rationale: Pinananatili ang di-tiyak na maramihang tagaganap ng בָּנוּ, habang nililinaw sa natural na Tagalog na ang בַּבַּיִת ay tumutukoy rito sa templo.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: ang panlabas na pasukan ng hari
  rationale: Ang מְבוֹא ay pasukan o daanang papasok; pinananatili ng parirala ang ugnayan nito sa hari at ang paglalarawang panlabas.
- source_word: הֵסֵב
  choice: inilihis niya palayo
  rationale: Ang hiphil ng סבב ay maaaring mangahulugang ilihis, baguhin ang direksiyon, o ilipat. Ang 'inilihis ... palayo' ay malapit sa batayang diwa at hindi ipinapalagay na lubusang winasak o inalis ang mga bahagi.
- source_word: בֵּית יְהוָה
  choice: templo ni Yahweh
  rationale: Sa konteksto, ang literal na 'bahay ni Yahweh' ay ang templo. Ang 'templo' ay likas at malinaw sa modernong Tagalog, samantalang pinananatili ang personal na pangalang Yahweh.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: dahil sa hari ng Asiria
  rationale: Ang 'dahil sa' ay nagpapanatili sa malawak na sanhi o pagganyak na ipinahihiwatig ng מִפְּנֵי nang hindi tiyak na sinasabing takot ang dahilan.
theological_decisions:
- issue: Antas ng katiyakan tungkol sa ginawa ni Ahaz at sa dahilan niya
  choice: Gumamit ng 'inilihis ... palayo' at 'dahil sa' upang hindi lumabis sa sinasabi ng Hebreo.
  alternative: Sabihing 'inalis' ang mga bahagi o 'dahil sa takot sa hari ng Asiria.'
  rationale: Hindi tiyak kung ang mga estruktura ay inalis, inilipat, o binago lamang, at hindi rin tahasang binabanggit ng teksto na takot ang motibo. Pinananatili ng salin ang makasaysayan at teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sabbath” bilang pamilyar na katawagang biblikal, “templo” para sa kontekstuwal na diwa ng בַּיִת, at “Yahweh” bilang personal na pangalan. Pinanatili sa mga talababa ang tunay na kawalang-katiyakan sa mga terminong pang-arkitektura, sa kilos ni Ahaz, at sa kaniyang motibo.
