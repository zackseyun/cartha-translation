  rationale: 'Inayos ang ayos ng pangungusap para sa likas na Filipino at inilagay ang marker ng talababa ng pandiwa sa mismong “inilihis niya.” Pinanatili ang lahat ng mahahalagang kawalang-katiyakan ng Hebreo: ang eksaktong anyo ng מיסך, ang lawak ng kilos na הֵסֵב, at ang motibong ipinahihiwatig ng מִפְּנֵי.'
