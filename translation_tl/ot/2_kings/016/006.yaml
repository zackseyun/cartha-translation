  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: tl
  text: Nang panahong iyon, ibinalik ni Rezin na hari ng Aram ang Elat sa Aram[a], at pinalayas niya mula sa Elat[b] ang mga taga-Juda. Dumating sa Elat ang mga Arameo at nanirahan doon hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “mga Arameo.” Pinapaboran ng ilang tagapagpaliwanag at sinaunang saksi ang “mga Edomita,” marahil dahil mas umaangkop ito sa mas malawak na konteksto at sa kaugnay na salaysay sa 2 Cronica 28:17.'
    reason: textual_variant
  - marker: b
    text: 'Sa bahaging ito ng talata, naiiba nang bahagya ang baybay ng pangalan sa Hebreo: “Elot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ibinalik
  rationale: Ang Hiphil ng שוב ay nagpapahiwatig na pinabalik ni Rezin ang Elat sa dating kapangyarihan o pag-aari ng Aram; natural at malinaw sa Filipino ang “ibinalik.”
- source_word: אֵילַת / אֵילוֹת
  choice: Elat
  rationale: Iisang pook ang tinutukoy ng dalawang anyo ng pangalan sa Hebreo. Ginamit sa pangunahing teksto ang pare-parehong anyong “Elat,” at itinala sa talababa ang baryanteng anyo.
- source_word: לַאֲרָם
  choice: sa Aram
  rationale: Ipinahihiwatig ng parirala ang paglilipat ng kontrol o pag-aari sa Aram. Pinanatili ang pangalang Hebreo sa halip na gamitin ang mas huling katawagang Sirya.
- source_word: וַיְנַשֵּׁל
  choice: pinalayas ... mula
  rationale: Ipinahihiwatig ng pandiwa ang sapilitang pagpapaalis at pag-agaw ng paninirahan o pag-aari; malinaw at likas sa Filipino ang “pinalayas mula.”
- source_word: הַיְהוּדִים
  choice: mga taga-Juda
  rationale: Sa konteksto ng panahon ng monarkiya, tumutukoy ito sa mga taong mula sa kaharian ng Juda. Iniiwasan ng “mga taga-Juda” ang posibleng mas huling etnorelihiyosong kahulugan ng “mga Judio.”
- source_word: וארמים
  choice: mga Arameo
  rationale: Ang tekstong Masoretiko ay binabasang “mga Arameo.” Pinanatili ito sa pangunahing teksto, samantalang ang mahalagang alternatibong “mga Edomita” ay inilagay sa talababa.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: nanirahan doon hanggang sa araw na ito
  rationale: Natural na ipinahahayag ng pariralang Filipino ang paninirahang nagpatuloy mula sa pangyayari hanggang sa panahon ng manunulat.
theological_decisions:
- issue: Suliraning tekstuwal sa katawagan sa pangkat na dumating sa Elat
  choice: mga Arameo
  alternative: mga Edomita
  rationale: Binabasa ng WLC/Masoretikong Teksto ang “mga Arameo,” kaya iyon ang sinusunod sa pangunahing teksto. Gayunman, mahalaga ang “mga Edomita” bilang alternatibong pagbasa dahil sa ilang sinaunang saksi at sa kaugnay na salaysay sa 2 Cronica 28:17; pinanatili ito sa talababa sa halip na tahimik na lutasin ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-Juda” para sa kontekstong monarkikal, “mga Arameo” bilang natural na etnonimo, at payak na ayos ng pangungusap upang madaling maunawaan nang hindi pinapawi ang tekstuwal na tensiyon.
