reference: 2 Kings 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: tl
  text: Kaya nagsugo si Ahaz ng mga sugo kay Tiglat-pileser, na hari ng Asiria, at sinabi, “Ako ay iyong lingkod at iyong anak.[a] Umakyat ka at iligtas mo ako mula sa kamay[b] ng hari ng Aram[c] at mula sa kamay ng hari ng Israel, na kapuwa lumalaban sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyong lingkod at iyong anak” ay diplomatikong pananalita ng pagpapasakop; maaari ring ipakahulugang “iyong basalyo at iyong anak.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa kamay” ay idyomang Hebreo na nangangahulugang “mula sa kapangyarihan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Aram” ay tradisyonal ding isinasaling “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas na salaysay na katumbas ng pandiwang שלח; malinaw na ipinadala ni Ahaz ang mga kinatawan.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa mga taong kinatawan, hindi sa mga anghel.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglat-pileser
  rationale: Malinaw at karaniwang anyong transliterado sa Filipino ng pangalan ng haring Asirio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tumpak at natural na salin ng titulong nakakabit sa pangalan ni Tiglat-pileser.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: iyong lingkod at iyong anak
  rationale: Pinananatili ang literal na mga larawang ginamit sa diplomatikong pagpapasakop; ipinapaliwanag sa talababa ang politikal na diwa.
- source_word: עֲלֵה
  choice: Umahon ka
  rationale: Pinananatili ang pangunahing larawan ng עלה na ‘umahon,’ bagaman sa konteksto ay panawagan itong pumunta o sumalakay bilang tulong militar.
- source_word: וְהוֹשִׁיעֵנִי
  choice: iligtas mo ako
  rationale: Tuwirang katumbas ng Hiphil ng ישׁע at angkop sa kontekstong militar at pampolitika.
- source_word: מִכַּף
  choice: mula sa kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo; nililinaw sa talababa na nangangahulugan itong kapangyarihan o paghahari.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang sinaunang pangalan sa pinagmulang teksto sa halip na ang tradisyonal ngunit maaaring anakronistikong ‘Siria.’
- source_word: הַקּוֹמִים עָלָי
  choice: na kumakalaban sa akin
  rationale: Natural na modernong Tagalog para sa patuloy na mapanlabang pagkilos na ipinahihiwatig ng participle, nang hindi sobrang tinutukoy ang eksaktong uri ng paglusob.
theological_decisions:
- issue: Diplomatikong pagpapakumbaba ni Ahaz
  choice: “iyong lingkod at iyong anak”
  alternative: “iyong basalyo at iyong anak”
  rationale: Ang literal na wika ng paglilingkod at ugnayang anak ay nagpapanatili sa retorika ng teksto at sa implikasyon ng pagpapasakop nang hindi nagpapasok ng teknikal na terminong wala mismo sa Hebreo.
- issue: Militar at pampolitikang diwa ng pagliligtas
  choice: “iligtas mo ako”
  alternative: “saklolohan mo ako” o “hanguin mo ako”
  rationale: Pinananatili ng “iligtas” ang malawak na saklaw ng pandiwang ישׁע, samantalang malinaw sa konteksto na militar at pampolitika ang hinihinging pagliligtas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang “lingkod at anak,” “umahon,” at “mula sa kamay” upang manatiling malapit sa Hebreo, habang ginawang natural ang patuloy na pagkapoot sa pariralang “na kumakalaban sa akin.”
