base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: tl
  text: Kaya itinayo ng paring si Urias ang altar ayon sa lahat ng ipinadala ni Haring Ahaz mula sa Damasco. Gayon ang ginawa ng paring si Urias hanggang sa dumating si Haring Ahaz mula sa Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: itinayo
  rationale: Karaniwang katumbas ng בנה sa konteksto ng pagtatayo ng isang altar; tuwiran at natural sa modernong Filipino.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: ang paring si Urias
  rationale: Pinananatili ang pangalan at tungkulin sa parehong paglitaw, ayon sa pag-uulit at diin ng Hebreo.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ang 'altar' ang malinaw at karaniwang salin ng מזבח sa Filipino, kasama ang tiyak na pantukoy.
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Ipinahahayag ang ganap na pagsunod sa lahat ng ipinadala o itinakda ng hari nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: שָׁלַח
  choice: ipinadala
  rationale: Ang aspektong naganap na bago ang pagtatayo ay likas nang malinaw sa daloy ng Filipino; hindi kailangang piliting tumbasan ng hiwalay na anyong past perfect.
- source_word: מִדַּמֶּשֶׂק
  choice: mula sa Damasco
  rationale: Tuwirang ipinahahayag ng מִן ang pinagmulan; ginagamit sa dalawang paglitaw.
- source_word: כֵּן עָשָׂה
  choice: Gayon ang ginawa
  rationale: Pinananatili ang pagbibigay-diin ng Hebreong idyoma sa eksaktong pagtupad ni Urias sa ipinadala ng hari.
- source_word: עַד בּוֹא
  choice: bago dumating
  rationale: Sa konteksto, ipinahihiwatig ng עַד + infinitive na natapos ni Urias ang ipinagagawa pagsapit o bago sa pagdating ng hari; natural ang 'bago dumating' sa Filipino.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Haring Ahaz
  rationale: Likas na ayos sa Filipino para sa titulo at pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng 'paring si Urias' at 'Haring Ahaz' bilang pagsunod sa diin ng tekstong Hebreo. Ginamit ang tradisyonal na anyong Filipino na 'Urias' at 'Damasco'.
