  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: tl
  text: At ginawa niya ang masama sa paningin ni Yahweh, gaya ng lahat ng ginawa ng kanyang ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay nagpapatuloy sa salaysay at likas na isinasalin bilang payak na nagdaang kilos; pinananatili ng “At” ang ugnayan sa naunang salaysay.
- source_word: הָרַע
  choice: ang masama
  rationale: Ang pang-uring may pantukoy ay ginagamit bilang pangngalan sa karaniwang pormula ng Mga Hari; natural at malinaw sa Tagalog ang “ginawa niya ang masama.”
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong idyoma ng pagtataya mula sa pananaw ng isang tao, at karaniwan din itong dignidad na pahayag sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל
  choice: gaya ng lahat ng
  rationale: Ipinahahayag ng “gaya ng” ang paghahambing at pinananatili ng “lahat” ang kabuuang saklaw ng כֹּל.
- source_word: אֲשֶׁר עָשָׂה
  choice: ginawa
  rationale: Natural na inuugnay sa Tagalog ang sugnay sa “lahat ng”; malinaw na nauna ang mga ginawa ng ama dahil sa konteksto at hindi kailangan ng hiwalay na anyong past perfect.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Tuwirang katumbas ng pangngalang may panlaping panghalip na ikatlong panauhang panlalaki; natural ang “kanyang ama” sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay mas malapit na transliterasyon ng YHWH at hindi nito pinapalitan ang pangalan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa estilong pangkasaysayan ng Mga Hari. Pinanatili ang idyomang “sa paningin ni Yahweh” dahil nauunawaan ito at mahalaga sa paulit-ulit na pormula ng aklat.
