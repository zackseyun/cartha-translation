base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: tl
  text: Dalawampu’t isang taong gulang si Zedekias nang maging hari siya, at labing-isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Hamutal[a], anak ni Jeremias na taga-Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hamutal ay isinusulat ding Hamital sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: Dalawampu’t isang taong gulang
  rationale: Isinasalin ang Hebreong idyomang literal na ‘anak ng dalawampu’t isang taon’ sa likas at malinaw na pahayag ng edad sa modernong Tagalog.
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahahayag ng ב na kasunod ng infinitive construct ang panahon ng pagluklok; natural itong sabihin sa Tagalog bilang ‘nang maging hari siya.’
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinahahayag ng pandiwa ang pamumuno bilang hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong gamit ng pang-ukol na ב.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Likas na modernong Tagalog para sa karaniwang pormula sa mga ulat tungkol sa mga hari.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog habang pinananatili itong pangalang pantangi.
- source_word: חמיטל
  choice: Hamutal
  rationale: Transliterasyon ng pangalang pantangi; itinala sa talababa ang alternatibong anyong ‘Hamital.’
- source_word: בַּת יִרְמְיָהוּ
  choice: anak ni Jeremias
  rationale: Karaniwang pahayag sa Tagalog ng ugnayang anak na babae at ama; hindi na kailangang idagdag ang ‘babae’ dahil malinaw na tinutukoy si Hamutal.
- source_word: מִלִּבְנָה
  choice: na mula sa Libna
  rationale: Pinananatili ang diwa ng pinagmulan o bayang pinanggalingan na ipinahahayag ng מִן.
