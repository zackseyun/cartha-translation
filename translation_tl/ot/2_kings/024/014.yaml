  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: tl
  text: Ipinatapon niya ang buong Jerusalem—ang lahat ng pinuno at lahat ng magigiting na mandirigma, sampung libong ipinatapon—pati ang lahat ng bihasang manggagawa at mga panday[a]. Walang naiwan maliban sa pinakamahihirap sa mga mamamayan ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mga manggagawa sa metal. Hindi tiyak ang eksaktong uri ng hanapbuhay na tinutukoy ng salitang Hebreo na tradisyonal na isinasaling “mga panday.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: Ipinatapon niya
  rationale: Ang Hiphil ng גלה ay nagsasaad ng sapilitang pagpapadala sa pagkakatapon. Tuwiran at natural sa modernong Filipino ang “ipinatapon.”
- source_word: כָּל יְרוּשָׁלִַם
  choice: ang buong Jerusalem
  rationale: Pinananatili ang metonimikong pahayag ng Hebreo; sa konteksto, tumutukoy ito sa mga mamamayan at pamunuan ng lungsod, hindi sa pisikal na lungsod mismo.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Maaaring tumukoy ang שׂרים sa mga opisyal, prinsipe, o tagapamahala. Sapat ang lawak ng “mga pinuno” nang hindi nililimitahan ang tinutukoy sa mga anak ng hari.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: magigiting na mandirigma
  rationale: Ipinahahayag nito ang mga mahusay at matapang na lalaking panlaban, habang pinananatili ang marangal na himig ng parirala.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: sampung libong ipinatapon
  rationale: Kolektibo ang גולה para sa mga dinala sa pagkakatapon. Ang anyong “ipinatapon” ay malinaw na nagpapakita ng sapilitang pag-aalis at hindi lamang ng kalagayang nasa ibang lupain.
- source_word: הֶחָרָשׁ
  choice: mga bihasang manggagawa
  rationale: Malawak ang חָרָשׁ at tumutukoy sa mga artisan o manggagawang may natatanging kasanayan.
- source_word: הַמַּסְגֵּר
  choice: mga panday
  rationale: Tradisyonal na salin ang “mga panday,” ngunit hindi tiyak ang espesipikong hanapbuhay; kaya inilalahad sa talababa ang mas malawak na posibilidad na mga manggagawa sa metal.
- source_word: לֹא נִשְׁאַר
  choice: Walang naiwan
  rationale: Natural at tuwirang ipinapahayag nito ang Niphal na walang natira o naiwan sa lugar.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: maliban sa pinakamahihirap sa mga mamamayan ng lupain
  rationale: Ipinakikita ng דלת ang dukha o mahinang bahagi ng populasyon. Pinananatili ng “sa mga mamamayan” ang partitive na diwa ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metonimikong “buong Jerusalem” at ang bahagyang tensiyon sa pagkakaugnay ng bilang na sampung libo sa mga naunang pangkat. Inilagay ang panandang [a] sa “mga panday,” na siyang terminong tinatalakay ng talababa.
