  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: tl
  text: At inilabas niya mula roon ang lahat ng kayamanan ng bahay ni Yahweh at ang mga kayamanan ng bahay ng hari[a]. Pinagputul-putol din niya ang lahat ng kagamitang yari sa ginto na ginawa ni Solomon, hari ng Israel, sa templo ni Yahweh[b], gaya ng sinabi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “inilabas niya mula roon” bilang “dinala niya palabas mula roon” o “kinuha niya mula roon.”
    reason: lexical_alternative
  - marker: b
    text: “Bahay ni Yahweh” ang pariralang ginamit sa unang bahagi ng talata. Dito, ibang salitang Hebreo ang ginamit, na mas tiyak na maaaring tumukoy sa templo o santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: inilabas niya mula roon
  rationale: Tuwirang ipinapahayag ng Hiphil ng יצא ang pagpapalabas o pag-aalis ng mga bagay mula sa isang lugar; natural din ito sa makabagong Tagalog.
- source_word: אוֹצְרוֹת
  choice: mga kayamanan
  rationale: Sa konteksto ng pandarambong, tumutukoy ito sa mahahalagang laman na kinuha, hindi pangunahin sa mga silid-imbakan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong salitang בֵּית at ang pagkakaiba nito sa הֵיכַל na ginamit sa bandang huli ng talata.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang pagkakapantay ng parirala sa 'bahay ni Yahweh.'
- source_word: וַיְקַצֵּץ
  choice: pinagputul-putol niya
  rationale: Ipinahihiwatig ng Piel ng קצץ ang pagputol sa mga piraso; malinaw at idiomatiko ang 'pinagputul-putol' sa Tagalog.
- source_word: כְּלֵי הַזָּהָב
  choice: mga kagamitang ginto
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa iba't ibang bagay na ginagamit sa templo; hindi ito nililimitahan sa mga sisidlan lamang.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Payak na pinananatili ang pandiwa ng Hebreo nang hindi ipinapasok ang interpretasyong si Solomon ay nagpagawa lamang.
- source_word: בְּהֵיכַל יְהוָה
  choice: sa templo ni Yahweh
  rationale: Sa kontekstong ito, ang הֵיכַל ay mas tiyak na tumutukoy sa gusali o santuwaryo ng templo at naiiba sa naunang בֵּית.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Malinaw na ipinahahayag ang katuparan ng naunang salita ni Yahweh nang hindi dinaragdagan ang hindi tahasang binanggit.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang 'Yahweh' ay malinaw na transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng pangyayari sa naunang salita ni Yahweh
  choice: gaya ng sinabi ni Yahweh
  alternative: ayon sa ipinropesiya ni Yahweh
  rationale: Pinananatili ang pormulang tumutukoy sa katuparan ngunit hindi dinaragdagan ng salitang 'ipinropesiya,' na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang leksikal na pagkakaiba ng “bahay ni Yahweh” at “templo ni Yahweh,” gayundin ang konkretong larawan ng paglalabas ng kayamanan at pagputol-putol sa mga kagamitang ginto.
