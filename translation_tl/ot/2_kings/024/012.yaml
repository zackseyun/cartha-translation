base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: tl
  text: Pagkatapos, lumabas si Jehoiakin na hari ng Juda patungo sa hari ng Babilonia—siya, ang kanyang ina, ang kanyang mga lingkod, ang kanyang mga pinuno, at ang kanyang mga opisyal ng palasyo[a]. Kinuha siya ng hari ng Babilonia sa ikawalong taon ng paghahari ng hari ng Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga eunuko”; ang salitang Hebreo ay maaaring tumukoy sa mga lalaking kinapon o, sa mas malawak na diwa, sa mga opisyal ng maharlikang korte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Pinananatili ang payak na kahulugan ng pandiwang יצא. Sa konteksto ng pagkubkob, maaaring ipinahihiwatig nito ang pagsuko, ngunit hindi iyon tahasang idinaragdag sa salin.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: patungo sa hari ng Babilonia
  rationale: Sa pagsama sa יצא, ipinapahayag ng parirala ang paglapit o pagpunta ni Jehoiakin sa hari ng Babilonia; natural itong ipinapahayag sa Filipino bilang “patungo sa.”
- source_word: הוּא וְאִמּוֹ
  choice: siya, ang kanyang ina
  rationale: Pinananatili ang tahasang pagbanggit muli sa simuno at ang pagsisimula ng talaan ng mga kasama niya.
- source_word: עֲבָדָיו
  choice: ang kanyang mga lingkod
  rationale: Malawak at tuwirang katumbas ito ng עבד, nang hindi nililimitahan ang kanilang tungkulin sa korte.
- source_word: שָׂרָיו
  choice: ang kanyang mga pinuno
  rationale: Ang שׂרים ay mga taong may mataas na katungkulan o pamumuno. Malinaw at hindi makaluma ang “mga pinuno.”
- source_word: סָרִיסָיו
  choice: ang kanyang mga opisyal ng palasyo[a]
  rationale: Maaaring tumukoy ang סָרִיס sa mga eunuko o, sa mas malawak na gamit, sa mga opisyal ng korte. Ang salin sa teksto ay natural sa modernong Filipino, habang pinananatili ng talababa ang mas literal na posibilidad.
- source_word: וַיִּקַּח אֹתוֹ
  choice: Kinuha siya
  rationale: Malapit ito sa karaniwang kahulugan ng לקח at hindi tahasang nagpapasiya sa pagitan ng pagdakip at pagtanggap sa kanya sa kustodiya.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: nang ikawalong taon ng paghahari nito
  rationale: Ang “nito” ay natural na tumutukoy sa pinakamalapit na simuno, ang hari ng Babilonia, at tumutugma sa kronolohikal na balangkas ng kabanata.
theological_decisions:
- issue: Tinutukoy ng hulaping “kanyang” sa pangwakas na tala ng taon ng paghahari
  choice: ang paghahari ng hari ng Babilonia
  alternative: ang paghahari ni Jehoiakin
  rationale: Ang pinakamalapit na pangngalang panlalaki at simuno ay ang hari ng Babilonia, at kaayon nito ang makasaysayang paraan ng pagpepetsa sa talata. Ginamit ang “nito” upang maging malinaw ang sanggunian nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Pinanatili ang literal na “lumabas” at “kinuha” upang hindi gawing tahasan ang ipinahihiwatig lamang ng konteksto. Inilagay ang panandang [a] sa terminong aktuwal na tinatalakay ng talababa.
