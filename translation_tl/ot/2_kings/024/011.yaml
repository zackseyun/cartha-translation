base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: tl
  text: At dumating si Nebucadnezar na hari ng Babilonia upang salakayin ang lungsod habang kinukubkob iyon ng kanyang mga tauhan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang nilulusob iyon ng kanyang mga tauhan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tauhan” ay maaaring tumukoy sa mga opisyal, kinatawan, o hukbong naglilingkod sa hari ng Babilonia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang wayyiqtol ng בוא ay payak na pandiwang pasalaysay. Ipinahihiwatig ng kasunod na עַל at ng konteksto ng pagkubkob na ang pagdating ay may layuning sumalakay.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang isinasalin ang construct chain na tumutukoy sa katungkulan at kaharian ni Nebucadnezar.
- source_word: עַל הָעִיר
  choice: upang salakayin ang lungsod
  rationale: Sa konteksto ng digmaan at pagkubkob, ang עַל kasunod ng pandiwa ng paglapit ay nagpapahayag ng galít na pagkilos laban sa lungsod, hindi lamang neutral na pagpunta roon.
- source_word: וַעֲבָדָיו
  choice: kanyang mga tauhan
  rationale: Bagaman literal na 'kanyang mga lingkod,' sa kontekstong maharlika at militar maaari itong tumukoy sa mga opisyal, ahente, o hukbong naglilingkod sa hari. Ang 'mga tauhan' ay natural sa Tagalog at hindi labis na nagtatakda ng tiyak na tungkulin.
- source_word: צָרִים
  choice: kinukubkob
  rationale: Ang participle ng צור ay tumutukoy sa nagpapatuloy na pagkubkob at kasabay ng pagdating ng hari.
- source_word: עָלֶיהָ
  choice: iyon
  rationale: Tumutukoy ang panghalip sa lungsod. Natural sa Tagalog na gawing tuwirang layon ito ng 'kinukubkob,' kahit inuulit sa Hebreo ang pang-ukol.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang 'mga tauhan' kaysa literal na 'mga lingkod' upang maging natural sa kontekstong militar, habang pinananatili sa talababa ang lawak ng kahulugan ng terminong maharlika.
