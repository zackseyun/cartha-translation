  to: At iniluklok ng hari ng Babilonia si Matanias[a], ang tiyuhin ni Jehoiakin, bilang hari kapalit niya, at pinalitan ng hari ng Babilonia ang pangalan ni Matanias at ginawang Zedekias.
  rationale: Pinalitan ang “ginawa ... na hari” ng “iniluklok ... bilang hari,” isang likas na Filipino na malinaw na causative. Inulit ang “hari ng Babilonia” at pinangalanan si Matanias sa huling sugnay upang alisin ang kalabuan ng panghalip, nang hindi binabago ang kahulugan o ang relasyon at paghaliling ipinahahayag ng teksto.
