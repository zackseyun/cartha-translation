base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: tl
  text: At iniluklok ng hari ng Babilonia si Matanias[a], ang tiyuhin ni Jehoiakin, bilang hari kapalit niya, at pinalitan ng hari ng Babilonia ang pangalan ni Matanias at ginawang Zedekias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “itinalaga si Matanias ... bilang hari.” Causative ang pandiwang Hebreo: iniluklok siya ng hari ng Babilonia bilang pinuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: ginawa ... na hari
  rationale: 'Ang Hiphil ng מלך ay causative: iniluklok ng hari ng Babilonia si Matanias bilang hari. Likas sa Filipino ang “ginawa ... na hari” at malinaw nitong pinananatili ang causative na diwa.'
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang construct phrase ito na tumutukoy sa gumagawa ng kilos; ang anyong ito ang karaniwan at malinaw sa Filipino.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: דֹדוֹ
  choice: tiyuhin ni Jehoiakin
  rationale: Maaaring mangahulugan ang דּוֹד ng tiyuhin o kamag-anak; sa kontekstong pangkasaysayan, si Matanias ay tiyuhin ng pinalitang haring si Jehoiakin. Nilinaw ang reperente ng hulaping panghalip upang maiwasan ang maling pagkaunawang tiyuhin siya ng hari ng Babilonia.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Sa konteksto ng pagluklok, ipinahihiwatig ng תַּחַת ang paghalili o pagpapalit sa dating hari.
- source_word: וַיַּסֵּב
  choice: pinalitan
  rationale: Bagaman literal na may diwang “pinihit” ang סבב, kapag pangalan ang layon ay nangangahulugan itong baguhin o palitan ang pangalan.
- source_word: שְׁמוֹ
  choice: ang pangalan niya
  rationale: Pinanatiling tahasan ang layon na nasa Hebreo.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang Filipino na anyo ng pangalang biblikal.
