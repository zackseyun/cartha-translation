translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tiyuhin ni Jehoiakin” sa halip na “tiyuhin niya” upang maging malinaw ang reperente ng panghalip sa Filipino, yamang maaaring mapagkamalang ang hari ng Babilonia ang tinutukoy.
