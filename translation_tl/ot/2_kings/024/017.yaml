  source_fidelity: Tumpak na naipapahayag ng draft ang causative na pagluklok ni Matanias, ang ugnayang tiyuhin ni Jehoiakin, ang paghalili, at ang pagpapalit ng pangalan. Gayunman, ang “nito” sa huling sugnay ay maaaring hindi agad malinaw ang tinutukoy; tahasang ipinapakita ng Hebreo na ang hari ng Babilonia rin ang nagpalit ng pangalan ni Matanias.
  naturalness: Likas ang karamihan ng salin, ngunit mas malinaw at mas maayos sa modernong Filipino ang pag-uulit ng paksa sa huling sugnay kaysa gamitin ang “nito.” Ang “iniluklok ... bilang hari” ay idiomatiko at tuwirang nagpapahayag ng causative na pandiwa.
  terminology: Ang “Babilonia,” “Matanias,” “Jehoiakin,” at “Zedekias” ay magkakatugma at angkop na nakaugaliang anyong Filipino. Ang “tiyuhin” at “iniluklok” ay angkop sa marangal na rehistro at sa konteksto ng paghalili sa trono.
