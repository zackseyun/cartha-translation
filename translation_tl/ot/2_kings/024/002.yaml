  to: Nagpadala si Yahweh laban sa kanya ng mga pangkat ng mananalakay[a] na mga Caldeo, mga pangkat mula sa Aram[b], mga pangkat ng mga Moabita, at mga pangkat ng mga Ammonita. Ipinadala niya ang mga ito laban sa Juda upang lipulin ito.[c] Ayon ito sa salita ni Yahweh na kanyang sinabi sa pamamagitan ng kanyang mga lingkod na propeta.
