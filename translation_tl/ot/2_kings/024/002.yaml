id: 2KI.24.2
reference: 2 Kings 24:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: tl
  text: Nagpadala si Yahweh laban sa kanya ng mga pangkat ng mananalakay[a] na mga Caldeo, mga pangkat mula sa Aram[b], mga pangkat ng mga Moabita, at mga pangkat ng mga Ammonita. Ipinadala niya ang mga ito laban sa Juda upang lipulin ito.[c] Ayon ito sa salita ni Yahweh na kanyang sinabi sa pamamagitan ng kanyang mga lingkod na propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga pangkat” o “mga pangkat ng mandarambong.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Aram”; tradisyonal na tinatawag na “Siria.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “upang lipulin siya,” na tumutukoy kay Jehoiakim sa halip na sa Juda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Nagpadala
  rationale: Karaniwang salin ng שלח sa salaysay; malinaw na si Yahweh ang nagpasimula ng pagkilos nang hindi dinaragdagan ang paraan nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos sa Hebreo.
- source_word: בּוֹ
  choice: laban sa kanya
  rationale: Sa konteksto ng pagpapadala ng mga puwersang pandigma, ipinahihiwatig ng pang-ukol ang pagkapoot at pagkilos laban kay Jehoiakim.
- source_word: גְּדוּדֵי
  choice: mga pangkat ng mananalakay
  rationale: Tumutukoy ang גדוד sa mas maliliit na pangkat na nagsasalakay, hindi kinakailangang sa buong pormal na hukbo. Inulit ang parirala upang mapanatili ang diin at ayos ng Hebreo.
- source_word: כַשְׂדִּים
  choice: mga Caldeo
  rationale: Pinananatili ang tiyak na katawagan ng Hebreo sa halip na palitan ito ng mas malawak na katawagang “mga Babilonio.”
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang nasa Hebreo; ang tradisyonal na katawagang “Siria” ay inilagay bilang alternatibo sa talababa.
- source_word: מוֹאָב
  choice: mga Moabita
  rationale: Likas na katawagan sa Filipino para sa mga taong mula sa Moab.
- source_word: בְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Likas na katawagan sa Filipino para sa pangkat ng mga taong tinutukoy ng literal na “mga anak ni Ammon.”
- source_word: וַיְשַׁלְּחֵם
  choice: Ipinadala niya ang mga ito
  rationale: Pinananatili ang pag-uulit ng pandiwang שלח sa Hebreo at ginagawang malinaw ang pagtukoy sa mga nabanggit na pangkat.
- source_word: בִּיהוּדָה
  choice: laban sa Juda
  rationale: Bagaman maaaring mangahulugang “sa” o “papasok sa” ang pang-ukol, malinaw na mapanlabang pagkilos ang inilalarawan sa konteksto.
- source_word: לְהַאֲבִידוֹ
  choice: upang lipulin ito
  rationale: Binabasa ang hulaping panlalaking isahan bilang tumutukoy sa Juda bilang kaharian o sambayanan. Ang posibleng pagtukoy nito kay Jehoiakim ay pinananatili sa talababa.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Malinaw at marangal na salin na pinananatili ang pormulang propetiko ng pinagmulang teksto.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: sa pamamagitan ng kanyang mga lingkod na propeta
  rationale: Ang idyomang “sa kamay ng” ay natural na ipinahahayag sa Filipino bilang “sa pamamagitan ng,” habang pinananatili ang pagkakakilanlan sa mga propeta bilang mga lingkod niya.
theological_decisions:
- issue: Tinutukoy ng hulapi sa לְהַאֲבִידוֹ
  choice: 'Juda ang tinutukoy: “upang lipulin ito.”'
  alternative: 'Maaaring si Jehoiakim ang tinutukoy: “upang lipulin siya.”'
  rationale: Kaagad na binanggit ang Juda bilang puntirya ng mga ipinadalang pangkat, at nakatuon ang mas malawak na konteksto sa hatol sa Juda. Gayunman, panlalaking isahan ang hulapi at posible ring tumukoy kay Jehoiakim, kaya hindi inalis ang tunay na kalabuan at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “mga pangkat” at ng pandiwang “ipinadala” upang katawanin ang diin ng salaysay sa Hebreo. Ginamit ang “Yahweh” para sa banal na pangalan at mga karaniwang katawagang Filipino na “Caldeo,” “Moabita,” at “Ammonita.”
