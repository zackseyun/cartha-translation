base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: tl
  text: at dahil din sa dugong walang-sala na kanyang ibinuhos[a]—pinuno niya ang Jerusalem ng dugong walang-sala—at hindi ninais ni Yahweh na magpatawad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dugo ng mga walang-sala.”
    reason: lexical_alternative
  - marker: b
    text: O “at hindi magpapatawad si Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: at dahil din sa
  rationale: Pinananatili ang pang-ugnay at pandagdag na diwa, habang natural na ipinahihiwatig sa Filipino na isa pa itong batayan ng hatol mula sa naunang konteksto.
- source_word: דַּם הַנָּקִי
  choice: dugong walang-sala
  rationale: Karaniwang biblikal na idyoma ito para sa dugo ng mga taong pinatay nang walang katarungan; pinananatili rin nito ang maigsi at matinding anyo ng Hebreo.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: na kanyang ibinuhos
  rationale: Ang 'ibuhos ang dugo' ay likas at dignidadong katumbas ng idyomang Hebreo para sa pagpatay at hindi nito pinapahina ang pananagutan ng tinutukoy na lalaki.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: Pinuno niya ang Jerusalem ng dugong walang-sala
  rationale: Malapit sa estruktura ng Hebreo at malinaw sa modernong Filipino; ang diwang 'ng' ay likas na nagpapahayag ng bagay na ipinuno.
- source_word: וְלֹא אָבָה
  choice: at ayaw ... na
  rationale: Tuwirang ipinahahayag ang kawalan ng pagnanais o pagsang-ayon na nasa אָבָה, sa halip na gawing simpleng pahayag lamang tungkol sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לִסְלֹחַ
  choice: magpatawad
  rationale: Ito ang malinaw at karaniwang modernong Filipino para sa banal na pagpapatawad o pagpapawalang-sala sa pagkakasala.
theological_decisions:
- issue: Ang pagtanggi ng Diyos na magpatawad kaugnay ng dugong walang-sala na ibinuhos ni Manases
  choice: Direktang sinasabi na ayaw ni Yahweh na magpatawad sa puntong ito.
  alternative: Hindi magpapatawad si Yahweh; o hindi pinatawad ni Yahweh ang Juda sa pangkalahatan.
  rationale: Tuwirang iniuugnay ng Hebreo ang kawalan ng pagnanais na magpatawad sa naipong pagkakasala at nalalapit na hatol. Hindi nilalambutan ang pahayag at hindi rin pinalalawak lampas sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang pangalang Yahweh at ang pamilyar na biblikal na idyomang “dugong walang-sala.” Ang unang sugnay ay sadyang nagpapatuloy sa naunang talata.
