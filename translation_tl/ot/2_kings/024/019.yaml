id: 2KI.24.19
reference: 2 Kings 24:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng lahat ng ginawa ni Jehoiakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang waw-consecutive na kasama ng עשה ay nagsasalaysay ng kasunod na kilos. Hindi na kailangang isalin nang hiwalay ang waw bilang “At” dahil natural sa Filipino ang tuwirang pagsisimula sa pandiwa.
- source_word: הָרַע
  choice: ang masama
  rationale: Ang pariralang עשה הרע ay isang karaniwang idyoma para sa paggawa ng masama. Ang “ginawa niya ang masama” ay natural, malinaw, at nagpapanatili sa tahasang moral na paghatol ng Hebreo.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang metapora ng Hebreong idyoma at ipinapahayag na ang kilos ay hinatulan mula sa pananaw ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Ipinapakita ng “gaya ng” ang paghahambing, habang pinananatili ng “lahat” ang malawak na saklaw ng כֹּל.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Sapat ang payak na aspektong naganap sa Filipino; malinaw na sa konteksto na ang tinutukoy ay mga ginawa ni Jehoiakim na siyang tinularan ng paksa.
- source_word: יְהוֹיָקִים
  choice: Jehoiakim
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
theological_decisions:
- issue: Paglalarawan sa kilos bilang masama “sa paningin” ni Yahweh
  choice: sa paningin ni Yahweh
  alternative: sa harap ni Yahweh
  rationale: Pinananatili ng napiling salin ang metapora at ang diin na si Yahweh ang nagbibigay ng moral na pagtatasa, nang hindi dinaragdagan o nilulutas ang anumang teolohikal na implikasyon.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong metaporang “sa paningin ni Yahweh,” ngunit ginawang natural ang ayos ng pangungusap. Walang footnote na kailangan dahil walang mahalagang tekstuwal o leksikal na kalabuan na dapat ilahad sa talatang ito.
