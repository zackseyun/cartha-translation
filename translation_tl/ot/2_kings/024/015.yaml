base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: tl
  text: Ipinatapon niya si Jehoiakin sa Babilonia, kasama ang ina ng hari[a], ang mga asawa ng hari, ang kanyang mga opisyal sa palasyo[b], at ang mga makapangyarihang lalaki sa lupain[c]; dinala niya sila sa pagkakatapon mula sa Jerusalem patungong Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo, “ina ng hari.” Maaari rin itong ipahayag na “inang reyna,” ngunit pinananatili rito ang pananalitang pampamilya ng pinagmulang teksto.
    reason: lexical_alternative
  - marker: b
    text: O “kanyang mga eunuko.” Ang salitang Hebreo ay maaaring tumukoy sa mga eunuko mismo o, sa mas pangkalahatan, sa mga opisyal ng hari o ng palasyo.
    reason: lexical_alternative
  - marker: c
    text: O “mga pangunahing lalaki sa lupain” o “mga maharlika sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Ipinatapon niya
  rationale: Ang causative na anyo ng גלה ay tumutukoy sa sapilitang pag-aalis at pagpapatapon. Likas at malinaw sa modernong Tagalog ang “ipinatapon.”
- source_word: בָּבֶלָה
  choice: sa Babilonia
  rationale: Ipinahihiwatig ng directional he ang pagpunta sa Babilonia; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: אֵם הַמֶּלֶךְ
  choice: ang ina ng hari
  rationale: Tuwirang pinananatili ang pananalitang pampamilya ng Hebreo nang hindi ipinapalagay na pormal na titulong panghukuman ang tinutukoy.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: ang mga asawa ng hari
  rationale: Malinaw na maramihan ang Hebreo, at pinananatili ng salin ang pag-uulit ng “hari” sa pinagmulang teksto.
- source_word: סָרִיסָיו
  choice: ang kanyang mga opisyal sa palasyo
  rationale: Maaaring tumukoy ang סָרִיס sa mga eunuko o, sa mas malawak na diwa, sa mga opisyal ng korte. Ipinapakita ng pangunahing salin ang tungkulin habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: אֵילֵי הָאָרֶץ
  choice: ang mga pangunahing lalaki sa lupain
  rationale: Ang parirala ay tumutukoy sa mga lalaking makapangyarihan, prominente, o mararangal sa lupain. Ang “mga pangunahing lalaki” ay nauunawaan sa kasalukuyang Tagalog at pinananatili ang panlalaking sanggunian.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: dinala niya silang bihag
  rationale: Ipinahahayag ng parirala ang pagdadala sa mga tao bilang mga ipinatapon. Pinananatili nito ang larawan ng sapilitang pagdadala at ang pag-uulit sa Hebreo.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: mula sa Jerusalem patungong Babilonia
  rationale: Malinaw na ipinakikita ang pinagmulan at destinasyon ng pagpapatapon.
