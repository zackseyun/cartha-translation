translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang dalawang magkaugnay na pahayag ng pagpapatapon sa Hebreo at ang pag-uulit ng “hari,” habang ginawang natural ang daloy. Inilagay ang bawat talababa sa mismong salitang may kaugnayan dito.
