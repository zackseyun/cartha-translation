  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: tl
  text: Tunay na nangyari ito sa Juda ayon sa utos ni Yahweh, upang alisin sila mula sa kanyang harapan dahil sa mga kasalanan ni Manases, ayon sa lahat ng ginawa niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Tunay na
  rationale: Ginagamit dito bilang mariing pagpapatunay sa paliwanag, hindi bilang pan限定 na “lamang.”
- source_word: עַל־פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang idyomang literal na “sa bibig ni” ay nagpapahayag na ang pangyayari ay alinsunod sa utos o pasiya ni Yahweh.
- source_word: הָיְתָה בִּיהוּדָה
  choice: nangyari ito sa Juda
  rationale: Eliptiko ang Hebreo at tumutukoy sa kapahamakang inilarawan sa konteksto; pinananatili ng “ito” ang bahagyang di-tiyak na paksa.
- source_word: לְהָסִיר מֵעַל פָּנָיו
  choice: upang alisin sila sa harapan niya
  rationale: Ang Hiphil ay nagsasaad ng pagpapalis, at ang “sa harapan niya” ay natural na Tagalog na nagpapanatili sa konkretong larawan ng Hebreo.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: dahil sa mga kasalanan ni Manases
  rationale: Malinaw na ipinahahayag ang sanhi at ang kabuuan ng mga pagkakasalang tinutukoy.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ayon sa lahat ng ginawa niya
  rationale: Pinananatili ang diwa ng pagtutugma o pag-ayon ng hatol sa lahat ng ginawa ni Manases.
theological_decisions:
- issue: Hindi tahasang layon ng pandiwang “alisin”
  choice: Isinupply ang “sila,” na tumutukoy sa mga taga-Juda sa konteksto.
  alternative: 'Iwan itong walang tahasang layon: “upang alisin sa harapan niya.”'
  rationale: Kailangan ng tahasang layon para sa natural na Tagalog, ngunit hindi nito nilulutas nang higit sa konteksto ang referent.
- issue: Wika tungkol sa presensiya ng Diyos
  choice: sa harapan niya
  alternative: mula sa kanyang presensiya
  rationale: Pinananatili nito ang konkretong antropomorpikong larawan ng מֵעַל פָּנָיו habang malinaw at marangal sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” para sa tetragrammaton at “Manases” bilang karaniwang anyong Tagalog. Walang talababa sapagkat ang “sa harapan niya” ay malinaw na sa pangunahing teksto.
