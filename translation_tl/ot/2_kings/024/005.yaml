base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga gawa ni Jehoiakim at ang lahat ng kanyang ginawa, hindi ba nakasulat ang mga iyon sa Aklat ng mga Talaan ng mga Hari ng Juda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Kasaysayan ng mga Hari ng Juda.” Ang pamagat sa Hebreo ay tumutukoy sa isang maharlikang talaang binabanggit sa buong aklat ng Mga Hari, at hindi kinakailangang sa kanonikong aklat ng Mga Cronica.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ang iba pang mga ginawa
  rationale: Sa karaniwang pormula tungkol sa paghahari, tumutukoy ito sa natitirang mga gawa o pangyayari sa buhay ng hari. Likas sa modernong Tagalog ang “iba pang mga ginawa” at hindi ito nagdaragdag ng panandang temporal na wala sa Hebreo.
- source_word: יְהוֹיָקִים
  choice: Jehoiakim
  rationale: Ginamit ang karaniwang transliterasyon ng pangalan sa Filipino.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili ang malawak na saklaw at bahagyang pag-uulit ng Hebreo nang hindi tinutukoy kung anong uri ng mga gawa ang tinutukoy.
- source_word: הֲלֹא
  choice: hindi ba
  rationale: Pinananatili nito ang anyo at diin ng retorikal na tanong sa isang likas na paraang Tagalog.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Tuwirang katumbas ng pasibong anyo sa Hebreo; ang “mga iyon” ay nagpapalinaw sa maramihang tinutukoy.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng aklat/balumbon,” ang “nakasulat sa Aklat” ang likas na Filipino para sa nilalaman ng isang nakasulat na tala.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Aklat ng mga Kasaysayan ng mga Hari ng Juda
  rationale: Ipinahahayag nito ang pamagat ng maharlikang sangguniang tala na binabanggit sa Mga Hari, habang inilalagay sa talababa ang alternatibong “mga talaan” at ang posibleng kalituhan sa kanonikong Mga Cronica.
theological_decisions:
- issue: Pagkakakilanlan ng binanggit na aklat
  choice: Hindi ipinantay sa kanonikong aklat ng Mga Cronica; nilinaw sa talababa na isa itong maharlikang sangguniang tala.
  alternative: Ituring itong tuwirang pagtukoy sa kanonikong Mga Cronica.
  rationale: Ang pamagat sa Hebreo ay tumutukoy sa isang rekord na paulit-ulit na sinisipi sa Mga Hari, ngunit hindi nito tiyak na ipinakikilala ang kanonikong 1–2 Mga Cronica.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang retorikal na tanong at ang pag-uulit ng “mga ginawa,” yamang kapwa naroon sa Hebreo. Inilagay ang pananda ng talababa pagkatapos ng pamagat na siyang aktuwal na tinatalakay nito.
