  text: וַ/יִּשְׁכַּ֥ב יְהוֹיָקִ֖ים עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: tl
  text: At nahimlay si Jehoiakim kasama ng kanyang mga ninuno[a], at ang anak niyang si Jehoiachin ang naging hari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas tuwirang pagpapakahulugan, “namatay.” Literal na sinasabi ng Hebreo na “nahimlay kasama ng kanyang mga ninuno,” isang karaniwang pormula para sa pagkamatay ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Ang pandiwang שׁכב, kasama ng pariralang 'kasama ng kanyang mga ninuno,' ay isang nakaugaliang pormula para sa pagkamatay ng hari. Pinananatili ng 'nahimlay' ang larawang nasa Hebreo habang likas at marangal sa modernong Tagalog.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Bagaman literal na 'kasama ng kanyang mga ama,' ang 'mga ninuno' ang likas na kahulugan ng אָבוֹת sa pormulang ito at mas malinaw sa karaniwang mambabasang Tagalog.
- source_word: וַיִּמְלֹךְ
  choice: ang naging hari
  rationale: Ipinahihiwatig ng pandiwa rito ang pagluklok o pagsisimula ng paghahari, kaya mas tiyak ang 'naging hari' kaysa sa simpleng 'naghari.'
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Tuwirang ipinahahayag ang ugnayang ama at anak sa natural na ayos ng Tagalog.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, malinaw at likas na ipinapahayag ng 'bilang kahalili niya' ang ideya ng pagkuha sa kanyang lugar.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Jehoiakim / Jehoiachin
  rationale: Ginamit ang nakasanayang anyo ng mga pangalang biblikal sa modernong saling Tagalog.
theological_decisions:
- issue: Paglalarawan sa pagkamatay ng hari nang hindi nagdaragdag ng detalye tungkol sa paglilibing
  choice: Pinanatili sa pangunahing teksto ang idyomang 'nahimlay ... kasama ng kanyang mga ninuno.'
  alternative: Isaling tuwiran bilang 'namatay,' o dagdagan bilang 'namatay at inilibing kasama ng kanyang mga ninuno.'
  rationale: Ang Hebreo ay gumagamit ng pormula para sa kamatayan ngunit hindi tahasang nagsasabing inilibing siya. Pinananatili ng salin ang larawan at hindi nagdaragdag ng impormasyong wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'nahimlay' upang mapanatili ang idyomang Hebreo nang hindi tunog-luma, at 'mga ninuno' sa halip na literal na 'mga ama' upang maging malinaw ang kahulugan.
