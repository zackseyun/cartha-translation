translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang ‘mga lingkod’ upang hindi labis na tukuyin ang kanilang tungkulin, samantalang ginawang malinaw ng ‘sumalakay’ ang militar na konteksto. Ang mga talababa ay nakahanay sa pagkakasunod ng mga marker sa pangunahing teksto.
