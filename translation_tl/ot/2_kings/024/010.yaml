base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: tl
  text: Nang panahong iyon, sumulong patungo sa Jerusalem[a] ang mga lingkod ni Nebucadnezar, hari ng Babilonia, at napasailalim sa pagkubkob ang lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “umakyat patungong Jerusalem.” Ang idyomang Hebreo ay maaaring magpahiwatig kapwa ng pag-akyat sa mataas na lugar at ng pagsulong ng hukbo.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “ang lungsod ay dumating sa pagkubkob.” Maaaring bigyang-diin ng Hebreo ang pagsisimula ng pagkubkob.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas at malinaw na panandang pangkasaysayan sa makabagong Filipino, na pinananatili ang pagtukoy ng Hebreo sa panahong iyon.
- source_word: עָלָה
  choice: sumalakay sa
  rationale: Ang literal na diwa ay ‘umakyat/pumaitaas,’ ngunit sa kontekstong militar patungong Jerusalem ay tumutukoy ito sa paglusob. Inihahatid ng ‘sumalakay sa’ ang malinaw na puwersang militar nang hindi ginagawang lantad na ‘hukbo’ ang paksa.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Pinananatili nito ang malawak na kahulugan ng Hebreong עבד bilang mga taong nasa ilalim ng kapangyarihan ng hari, sa halip na tukuyin sila nang mas makitid bilang mga opisyal o hukbo.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang salin ng titulong maharlika at ng pangalan ng lugar sa natural na Filipino.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: at ang lungsod ay kinubkob
  rationale: Natural at malinaw sa Filipino. Ang mas literal na Hebreo ay nagsasabing ang lungsod ay ‘napasailalim sa pagkubkob,’ kaya inilalahad sa talababa ang posibleng diin sa pagsisimula ng kalagayang iyon.
- source_word: מָצוֹר
  choice: pagkubkob
  rationale: Karaniwang terminong militar sa Filipino para sa siege o kalagayan ng isang lugar na pinalilibutan upang mapilitang sumuko.
