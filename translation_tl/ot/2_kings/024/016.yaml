revisions:
- from: At ang lahat ng mandirigmang lalaki—pitong libo—at ang mga bihasang manggagawa at mga panday[a]—isang libo—na pawang malalakas na lalaking kayang makipagdigma[b], ay dinalang bihag ng hari ng Babilonia patungong Babilonia.
  to: At ang lahat ng mga lalaking mandirigma—pitong libo—at ang mga bihasang manggagawa at mga panday[a]—isang libo—na pawang malalakas na lalaking may kakayahang makipagdigma[b], ay ipinatapon ng hari ng Babilonia sa Babilonia.
  rationale: Pinalitan ang pananalitang maaaring magpahiwatig lamang ng pagkabihag ng tahasang “ipinatapon” upang maihatid ang גּוֹלָה. Pinakinis din ang katawagan para sa unang pangkat. Napanatili ang mga bilang, ang saklaw ng mga hanapbuhay, ang pagbubuod na “pawang,” at ang dalawang talababa sa mga wastong angkla.
