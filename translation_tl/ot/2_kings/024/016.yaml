  - severity: low
    issue: Medyo di-likas ang “mandirigmang lalaki.”
    rationale: Mas karaniwan at malinaw sa modernong Filipino ang “mga lalaking mandirigma,” habang pinananatili ang panlalaking sanggunian ng אַנְשֵׁי הַחַיִל.
