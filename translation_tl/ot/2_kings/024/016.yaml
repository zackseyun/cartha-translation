base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: tl
  text: At ang lahat ng mga lalaking mandirigma—pitong libo—at ang mga bihasang manggagawa at mga panday[a]—isang libo—na pawang malalakas na lalaking may kakayahang makipagdigma[b], ay ipinatapon ng hari ng Babilonia sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mga artisano at mga manggagawa sa metal.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “mga gumagawa ng digmaan,” ibig sabihin, mga lalaking may kakayahang maglingkod sa digmaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: mandirigmang lalaki
  rationale: Tumutukoy ang parirala sa malalakas at may kakayahang lalaking kapaki-pakinabang sa hukbo. Likas sa modernong Filipino ang “mandirigmang lalaki” at malinaw ang kontekstong militar.
- source_word: שִׁבְעַת אֲלָפִים
  choice: pitong libo
  rationale: Tuwirang salin ng bilang.
- source_word: הֶחָרָשׁ
  choice: mga bihasang manggagawa
  rationale: Malawak ang saklaw ng חָרָשׁ at maaaring tumukoy sa bihasang manggagawa sa kahoy, bato, o metal; iniiwasan ng salin ang labis na pagtukoy sa iisang hanapbuhay.
- source_word: הַמַּסְגֵּר
  choice: mga panday
  rationale: Malamang na tumutukoy sa mga panday o manggagawa sa metal. Maikli, natural, at pamilyar sa Filipino ang “mga panday.”
- source_word: אֶלֶף
  choice: isang libo
  rationale: Ito ang bilang ng pinagsamang pangkat ng mga bihasang manggagawa at mga panday.
- source_word: הַכֹּל
  choice: pawang
  rationale: Likas na binubuod ng “pawang” ang mga naunang pangkat at ipinakikitang ang sumusunod na paglalarawan ay sumasaklaw sa kanilang lahat.
- source_word: גִּבּוֹרִים
  choice: malalakas na lalaki
  rationale: Pinananatili ang pangunahing diwa ng lakas at kakayahan, samantalang ang kasunod na parirala ang naglilinaw sa gamit na militar.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: kayang makipagdigma
  rationale: Ang literal na “gumagawa ng digmaan” ay idyomang tumutukoy sa mga lalaking may kakayahang maglingkod sa digmaan. Natural sa Filipino ang “kayang makipagdigma” nang hindi nagdaragdag ng ideya ng pormal na pagsasanay.
- source_word: וַיְבִיאֵם
  choice: dinalang bihag
  rationale: Pangunahing kahulugan ng pandiwa ang pagdadala; nililinaw ng “bihag” ang kalagayang ipinahahayag ng kasunod na גּוֹלָה sa konteksto ng sapilitang pagpapatapon.
- source_word: גּוֹלָה
  choice: bihag
  rationale: Gumaganap itong pang-abay na nagsasaad na dinala sila sa kalagayan ng pagkakatapon. Sa kontekstong ito, natural na ipinahahayag iyon ng “dinalang bihag.”
- source_word: בָּבֶלָה
  choice: patungong Babilonia
  rationale: Ipinahahayag ng directional he ang pagkilos tungo sa Babilonia; malinaw itong naihahatid ng “patungong Babilonia.”
