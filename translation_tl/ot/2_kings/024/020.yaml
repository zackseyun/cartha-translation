  naturalness: Ang magkakasunod na “Sapagkat dahil sa” ay nauunawaan ngunit mabigat at hindi gaanong likas sa makabagong Filipino. Ang paglalagay ng kuwit at ng “ito” ay nagbibigay ng mas malinaw at natural na daloy habang pinananatili ang paliwanag at sanhi.
  terminology: Ang “Yahweh,” “galit,” “presensya,” “naghimagsik,” “Zedekias,” at “Babilonia” ay angkop sa marangal at modernong rehistrong Filipino. Ang talababa ay nararapat na nagpapanatili ng mas pormal na alternatibong pagbasa ng masikip na Hebreong sugnay.
