  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: tl
  text: Sapagkat, dahil sa galit ni Yahweh, nangyari ito sa Jerusalem at Juda hanggang sa itaboy niya sila mula sa kanyang presensya.[a] At naghimagsik si Zedekias laban sa hari ng Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat ang galit ni Yahweh ay laban sa Jerusalem at Juda, hanggang sa itaboy niya sila mula sa kanyang harapan.” Siksik ang Hebreo sa unang sugnay at maaari itong isalin nang mas pormal sa ganitong paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang konteksto; ang kasunod na “dahil sa” ang naghahayag ng tiyak na sanhi.
- source_word: עַל אַף יְהוָה
  choice: dahil sa galit ni Yahweh
  rationale: Ang idyoma ay tumutukoy sa banal na galit. Pinanatili ang personal na pangalang Yahweh ayon sa mismong Hebreo.
- source_word: הָיְתָה
  choice: ganito ang nangyari
  rationale: Walang hayag na simuno ang pandiwa sa Hebreo. Ang pariralang ito ay malinaw at natural sa Tagalog habang kinikilala ang siksik na kayarian ng pinagmulan.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: sa Jerusalem at Juda
  rationale: Pinanatili ang pinakapayak na lokatibong diwa ng pang-ukol ב.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: hanggang sa itaboy niya sila
  rationale: Ipinahahayag ng עַד at ng infinitive ang hantungan ng pangyayari; ang “itaboy” ay natural at may sapat na tindi para sa pagpapaalis.
- source_word: מֵעַל פָּנָיו
  choice: mula sa kanyang presensya
  rationale: Natural na salin ng Hebreong idyomang literal na “mula sa harap ng kanyang mukha,” na nangangahulugang alisin mula sa harapan o presensya niya.
- source_word: וַיִּמְרֹד
  choice: At naghimagsik
  rationale: Ang מרד ay paghihimagsik o pagrerebelde laban sa isang pinuno; “naghimagsik” ang dignified at karaniwang salitang Tagalog.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Zedekiah.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: laban sa hari ng Babilonia
  rationale: 'Kasama ng pandiwang מרד, ang ב ay may adversatibong diwa: paghihimagsik laban sa hari.'
theological_decisions:
- issue: Ang sanhi at hantungan sa unang sugnay
  choice: Ang nangyari sa Jerusalem at Juda ay bunga ng galit ni Yahweh at humantong sa pagtataboy niya sa kanila.
  alternative: Ang galit ni Yahweh ay laban sa Jerusalem at Juda hanggang sa pagpapatapon.
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang Hebreong kayarian. Pinili sa pangunahing teksto ang natural na pagbasa sa sanhi at kinalabasan, habang inilagay sa talababa ang mas pormal na alternatibo.
- issue: Paglalarawan sa pagpapaalis
  choice: mula sa kanyang presensya
  alternative: mula sa kanyang harapan
  rationale: Malinaw sa modernong Tagalog ang “presensya” at pinananatili nito ang teolohikal na bigat ng pag-aalis mula sa harapan ng Diyos nang hindi dinaragdagan ang kahulugan.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang pangalan ang nasa tekstong Hebreo, kaya pinanatili ang pangalang Yahweh sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pag-uulit sa “Sapagkat dahil” upang katawanin kapwa ang paliwanag na ugnayan ng כִּי at ang sanhi sa עַל אַף, ngunit ginawang natural ang kasunod na sugnay sa “ganito ang nangyari.”
