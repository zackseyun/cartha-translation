- from: Sapagkat dahil sa galit ni Yahweh, ganito ang nangyari sa Jerusalem at Juda, hanggang sa itaboy niya sila mula sa kanyang presensya.[a] At naghimagsik si Zedekias laban sa hari ng Babilonia.
  to: Sapagkat, dahil sa galit ni Yahweh, nangyari ito sa Jerusalem at Juda hanggang sa itaboy niya sila mula sa kanyang presensya.[a] At naghimagsik si Zedekias laban sa hari ng Babilonia.
  rationale: 'Bahagyang inayos ang unang pangungusap para sa mas likas na Filipino: ginawang “Sapagkat, dahil sa …, nangyari ito” ang dating “Sapagkat dahil sa …, ganito ang nangyari.” Pinananatili nito ang parehong ugnayang paliwanag-singaw at ang sinasadyang di-espesipikong simuno ng Hebreo. Walang binago sa kahulugan, mga pangalan, o talababa.'
