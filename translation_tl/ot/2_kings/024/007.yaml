  to: Hindi na muling lumabas mula sa kanyang lupain ang hari ng Ehipto, sapagkat kinuha na ng hari ng Babilonia ang lahat ng pag-aari ng hari ng Ehipto, mula sa Batis ng Ehipto[a] hanggang sa Ilog Eufrates.
  rationale: Pinalitan ang interpretatibong “sinakop na” ng mas malawak at mas tuwirang “kinuha na.” Pinalitan din ang “lahat ng nasasakupan” ng “lahat ng pag-aari” upang mapanatili ang saklaw at di-pagtitiyak ng Hebreong parirala, habang ang pariralang “mula sa ... hanggang sa ...” ay nagpapanatili ng heograpikal na konteksto. Walang pagbabago sa talababa o ankora nito.
