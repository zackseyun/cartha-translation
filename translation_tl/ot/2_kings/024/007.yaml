base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: tl
  text: Hindi na muling lumabas mula sa kanyang lupain ang hari ng Ehipto, sapagkat kinuha na ng hari ng Babilonia ang lahat ng pag-aari ng hari ng Ehipto, mula sa Batis ng Ehipto[a] hanggang sa Ilog Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wadi ng Ehipto.” Ang salitang Hebreo ay maaaring tumukoy sa isang pana-panahong daluyan ng tubig o batis; hindi gaanong malamang dito ang “ilog,” na maaari ring mapagkamalang tumutukoy sa Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: Hindi na muling lumabas
  rationale: 'Ang הוסיף na may infinitive, kasama ng לא at עוד, ay nagpapahayag ng pagtigil: hindi na siya muling lumabas. Pinananatili ng saling ito ang payak na pandiwang ''lumabas'' nang hindi tahasang idinaragdag ang interpretasyong militar na ''nakipagdigma'' o ''nagmartsa.'''
- source_word: מֵאַרְצוֹ
  choice: mula sa kanyang lupain
  rationale: Natural at tuwirang katumbas ng 'mula sa kanyang bansa/lupain'; ang 'lupain' ay angkop sa konteksto ng mga hari at mga teritoryo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi na lumabas ang hari ng Ehipto. Dignified ngunit malinaw sa modernong Filipino ang 'sapagkat.'
- source_word: לָקַח
  choice: sinakop na
  rationale: Bagaman malawak ang kahulugang 'kinuha,' ang konteksto ay pag-agaw ng mga teritoryong dating kontrolado ng Ehipto. Ipinahihiwatig ng 'na' na nauna na ang pagkakasakop bago ang hindi na paglabas ng hari.
- source_word: מִנַּחַל מִצְרַיִם
  choice: mula sa Batis ng Ehipto
  rationale: Ang נחל ay maaaring tumukoy sa batis, wadi, o pana-panahong daluyan ng tubig, hindi karaniwang sa malaking ilog. Iniiwasan ng 'Batis ng Ehipto' ang pagkalito rito at sa Nilo; inilalahad sa talababa ang alternatibong heograpikal na termino.
- source_word: עַד נְהַר פְּרָת
  choice: hanggang sa Ilog Eufrates
  rationale: Tuwirang katumbas ng נהר פרת at natural na anyo ng pangalan sa Filipino.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: ang lahat ng nasasakupan ng hari ng Ehipto
  rationale: Sa heograpikal at maharing konteksto, ang malawak na konstruksyong pag-aari ay pangunahing tumutukoy sa mga lupaing nasa kapangyarihan o kontrol ng hari. Ang 'nasasakupan' ay natural sa Filipino at hindi nagpapahiwatig na personal niyang ari-arian ang mga ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang payak na 'lumabas' upang hindi gawing tahasang militar ang ipinahihiwatig lamang ng konteksto. Ginamit ang 'nasasakupan' upang natural na ipahayag ang teritoryal na kontrol.
