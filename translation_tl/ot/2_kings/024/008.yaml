  text: בֶּן שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה שָׁנָה֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ נְחֻשְׁתָּ֥א בַת אֶלְנָתָ֖ן מִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: tl
  text: Labingwalong taong gulang si Jehoiakin nang magsimula siyang maghari, at tatlong buwan siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay si Nehusta, anak ni Elnatan, mula sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “taga-Jerusalem.” Sa Hebreo, maaaring ilarawan ng panghuling parirala ang pinakamalapit na pangalang Elnatan o ang naunang pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Labingwalong taong gulang
  rationale: Likas na katumbas sa modernong Tagalog ng karaniwang idyomang Hebreo para sa edad.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng konstruksiyong may ב ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: at tatlong buwan siyang naghari
  rationale: Pinananatili ang pandiwang diwa ng מָלַךְ at malinaw na ipinahahayag ang tagal.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang katumbas ng lokatibong parirala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at marangal na anyo ng pormulang pangangkan sa modernong Tagalog.
- source_word: נְחֻשְׁתָּא
  choice: Nehusta
  rationale: Transliterasyong angkop sa ponolohiya at ortograpiyang Filipino.
- source_word: בַת אֶלְנָתָן
  choice: anak ni Elnatan
  rationale: Sa Tagalog, sapat at natural ang “anak ni”; batid mula sa naunang “ina” na babae si Nehusta.
- source_word: מִירוּשָׁלִָם
  choice: na mula sa Jerusalem
  rationale: Pinananatili ang pangunahing diwa ng pinagmulan na ipinahahayag ng מִן, habang iniiwan ang posibleng kaugnayan nito sa pinakamalapit na pangalang Elnatan.
theological_decisions:
- issue: Kung kanino nakakabit ang pariralang “mula sa Jerusalem”
  choice: Inilagay pagkatapos ng “Elnatan” gaya ng ayos ng Hebreo, nang hindi tahasang nilulutas ang saklaw nito.
  alternative: “Elnatan na taga-Jerusalem” o “Nehusta ... na taga-Jerusalem”
  rationale: Maaaring unawain ang pangwakas na parirala bilang paglalarawan kay Elnatan o bilang mas malawak na pahayag ng pinagmulan; hindi dapat tahasang lutasin ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “maghari” sa halip na mas teknikal o makalumang pananalita. Walang talababa sapagkat walang marker na kailangan sa tekstong Tagalog; ang bahagyang kalabuan ng huling parirala ay napanatili sa mismong ayos ng pangungusap.
