translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nagpasakop’ upang maipahayag ang pampolitikang kahulugan ng literal na ‘naging lingkod,’ habang inilagay sa talababa ang anyong literal. Pinanatiling magkahiwalay ang pagtalikod at paghihimagsik upang katawanin ang dalawang pandiwang Hebreo.
