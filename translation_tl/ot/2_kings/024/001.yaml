  naturalness: Mas natural at malinaw ang “Noong panahon ni Jehoiakim” kaysa “Nang panahon niya.” Ang “umakyat si Nebucadnezar” ay medyo pormal ngunit angkop sa marangal na salin at sinusuportahan ng talababa; hindi nito idinaragdag ang hindi tahasang sinasabi ng teksto.
  terminology: Pinanatili ang karaniwang mga pangalang “Nebucadnezar,” “Jehoiakim,” at “Babilonia.” Ang “sakop” ay angkop na modernong Filipino para sa katayuang pampolitika ng isang haring nasa ilalim ng nakatataas na hari, habang ibinibigay sa talababa ang literal na “lingkod.”
