base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: tl
  text: Noong panahon ni Jehoiakim, umakyat[a] si Nebucadnezar na hari ng Babilonia, at naging sakop niya[b] si Jehoiakim sa loob ng tatlong taon. Ngunit pagkatapos ay tumalikod siya at naghimagsik laban sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umakyat.” Sa kontekstong ito, maaari itong tumukoy sa pagsulong ng isang hari o hukbo laban sa isang lupain.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naging lingkod niya.” Isa itong pampolitikang pananalita para sa pagpapasakop sa isang nakatataas na hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nang panahon niya
  rationale: Natural na modernong Tagalog para sa temporal na idyomang tumutukoy sa panahon ng paghahari ng naunang binanggit na hari.
- source_word: עָלָה
  choice: sumalakay
  rationale: Sa kontekstong militar at pampolitika, ang literal na ‘umakyat’ ay tumutukoy sa pagsulong ng hari ng Babilonia laban sa lupain; malinaw at natural ang ‘sumalakay’ nang hindi dinaragdagan ang layunin o kinalabasan.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Karaniwan at makikilalang anyo ng pangalan sa mga saling Tagalog.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang salin ng pariralang konstruktong Hebreo.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: nagpasakop sa kanya si Jehoiakim
  rationale: Ipinahihiwatig ng konstruksiyon ang pagpasok ni Jehoiakim sa pampolitikang pagpapailalim sa isang nakatataas na hari. Mas malinaw ito sa Tagalog kaysa sa literal na ‘naging lingkod niya.’
- source_word: עֶבֶד
  choice: nagpasakop
  rationale: Sa kontekstong ito, ang עבד ay hindi ordinaryong paglilingkod kundi katayuan ng isang haring nasa ilalim ng kapangyarihan ng ibang hari.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: sa loob ng tatlong taon
  rationale: Likas na pagpapahayag sa Tagalog ng takdang tagal.
- source_word: וַיָּשָׁב
  choice: tinalikuran siya
  rationale: Inilalarawan ng שוב ang pagbaligtad ni Jehoiakim sa dati niyang katapatan o pagpapasakop; pinananatili nito ang hiwalay na hakbang bago ang tahasang paghihimagsik.
- source_word: וַיִּמְרָד בּוֹ
  choice: naghimagsik laban sa kanya
  rationale: Tumpak at natural na salin ng paghihimagsik laban sa nakatataas na pinuno.
