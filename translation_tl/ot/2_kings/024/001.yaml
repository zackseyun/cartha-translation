revisions:
- from: Nang panahon niya, sumalakay[a] si Nebucadnezar na hari ng Babilonia, at nagpasakop sa kanya si Jehoiakim sa loob ng tatlong taon.[b] Pagkatapos, tinalikuran siya ni Jehoiakim at naghimagsik laban sa kanya.
  to: Noong panahon ni Jehoiakim, umakyat[a] si Nebucadnezar na hari ng Babilonia, at naging sakop niya[b] si Jehoiakim sa loob ng tatlong taon. Ngunit pagkatapos ay tumalikod siya at naghimagsik laban sa kanya.
  rationale: Pinalitan ang pandiwang nagdaragdag ng tahasang pagsalakay ng mas malapit na “umakyat,” na may maingat na paliwanag sa talababa. Nilinaw ang temporal na panghalip sa pamamagitan ng pangalan ni Jehoiakim. Ginamit ang “naging sakop niya” upang ipahayag ang katayuang pampolitika nang hindi ipinapasok ang partikular na terminong pyudal na “bansaly[o],” at pinanatili ang literal na “lingkod” sa talababa. Ang “tumalikod ... at naghimagsik” ay hindi pinagsasama ang dalawang pandiwa ng Hebreo.
