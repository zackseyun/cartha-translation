id: 2KI.18.34
reference: 2 Kings 18:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: tl
  text: Nasaan ang mga diyos ng Hamat at Arpad? Nasaan ang mga diyos ng Sefarvaim, Hena, at Iva[a]? Nailigtas ba nila ang Samaria mula sa kamay ko?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Hebreo ay isinasalin din bilang Ava o Ivvah sa ibang tradisyon ng pagbabaybay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Tanong ito tungkol sa kinaroroonan; ang “Nasaan” ay natural sa makabagong Tagalog at nagpapanatili sa mapanuyang retorikal na tanong.
- source_word: אֱלֹהֵי
  choice: ang mga diyos ng
  rationale: Anyo itong construct ng אֱלֹהִים at tumutukoy sa mga diyos na kaugnay ng mga binanggit na lungsod o bayan.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamat at Arpad
  rationale: Mga pangalang-pook ang mga ito, kaya tinumbasan sa karaniwang anyong transliterado sa Filipino.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sefarvaim, Hena, at Iva
  rationale: Pinanatili ang mga pangalang-pook sa transliterasyon; ang “Iva” ay payak at nababasang anyong Filipino para sa עִוָּה, habang inilalahad sa talababa ang ibang baybay.
- source_word: כִּי
  choice: ba
  rationale: Sa konteksto, ipinakikilala nito ang retorikal na tanong. Ang hulaping “ba” ang natural na paraan upang maipahayag iyon sa Tagalog nang hindi pinipilit ang literal na pang-ugnay.
- source_word: הִצִּילוּ
  choice: Nailigtas
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o magpalaya mula sa panganib o kapangyarihan; ang “nailigtas” ay angkop sa kontekstong militar.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang anyong Filipino ng pangalan ng lungsod o kaharian.
- source_word: מִיָּדִי
  choice: mula sa kamay ko
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa kapangyarihan o kontrol; malinaw rin ito sa Tagalog.
theological_decisions:
- issue: Ang hamon ng nagsasalita tungkol sa mga diyos ng ibang mga bayan
  choice: Isinalin ang talata bilang pagyayabang na hindi nailigtas ng mga diyos ng mga nasakop na bayan ang Samaria mula sa kapangyarihan ng nagsasalita.
  alternative: Maaaring unawain ang huling tanong bilang mas pangkalahatang paghamak sa lahat ng pambansang diyos, hindi lamang bilang tiyak na pahayag tungkol sa mga binanggit na diyos.
  rationale: Tuwirang binabanggit ng Hebreo ang mga diyos ng ilang lugar at saka nagtatanong kung nailigtas nila ang Samaria “mula sa kamay ko.” Pinananatili ng salin ang retorika nang hindi nagpapasya kung tunay o makapangyarihan ang mga paganong diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “Nasaan” at ang idyomang “mula sa kamay ko” upang maihatid ang mapanuyang tono at kongkretong larawan ng Hebreo.
