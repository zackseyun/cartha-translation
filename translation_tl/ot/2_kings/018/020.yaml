base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: tl
  text: Sabi mo, ‘Iyan ay salita lamang ng mga labi’—ngunit para sa pakikidigma kailangan ang payo at lakas. Ngayon, kanino ka nagtiwala kaya naghimagsik ka laban sa akin?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: salita lamang ng mga labi
  rationale: Pinananatili ang literal at mapanuyang idyomang Hebreo sa natural na ayos ng Tagalog, nang hindi ito agad ipinapakahulugang ‘walang kabuluhang salita.’
- source_word: עֵצָה
  choice: mahusay na payo
  rationale: Ang עֵצָה ay payo o estratehikong pagpapasya; idinagdag ang ‘mahusay’ upang maging malinaw ang hinihinging kakayahan sa konteksto ng digmaan nang hindi nililimitahan sa isang teknikal na termino.
- source_word: גְבוּרָה
  choice: lakas
  rationale: Saklaw ng גְבוּרָה ang lakas o kapangyarihang militar; ang ‘lakas’ ay payak, dignificado, at hindi labis na nagpapaliit sa kahulugan.
- source_word: בָטַחְתָּ
  choice: nagtiwala
  rationale: Tuwirang ipinapahayag ang pagtitiwala o pag-asa sa isang kakampi.
- source_word: מָרַדְתָּ
  choice: naghimagsik
  rationale: Ipinakikita ang tahasang pag-aalsa laban sa kapangyarihang naghahari, na siyang diwa ng pandiwa sa konteksto.
theological_decisions:
- issue: Ugnayan ng ‘salita ng mga labi’ sa ‘payo at lakas’
  choice: Gumamit ng em dash at ‘ngunit’ upang ipakitang sinasalungat ang hungkag na pag-aangkin sa tunay na kailangan sa digmaan.
  alternative: 'Basahin ang buong parirala bilang isang tuwirang pahayag: ‘Ang payo at lakas para sa digmaan ay salita lamang ng mga labi.’'
  rationale: Mahirap ang sintaks ng Hebreo at posible ang ibang pagbabantas. Ang napiling pagbasa ay kaayon ng ibinigay na konsultasyong POB, ngunit hindi dinaragdagan ng partikular na doktrinal na paliwanag.
- issue: Batayan ng paghihimagsik
  choice: ‘kanino ka nagtiwala kaya naghimagsik ka’
  alternative: ‘kanino ka nagtitiwala, na naghihimagsik ka’
  rationale: Pinananatili ang retorikal na kaugnayan sa Hebreo sa pagitan ng pagtitiwala sa kakampi at ng pag-aalsa laban sa nagsasalita.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang matalas at mapanuyang himig ng tagapagsalita at ang retorikal na tanong. Walang footnote dahil ang alternatibong sintaktikong pagbasa ay hindi kailangang ilagay sa mismong talata para sa maikling publikasyong draft.
