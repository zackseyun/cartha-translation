base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: tl
  text: 'Pagkatapos, sinabi sa kanila ng Rabshake, “Pakisabi kay Ezequias, ‘Ganito ang sabi ng dakilang hari, ang hari ng Asiria: Ano ang tiwalang ito na iyong pinagtiwalaan?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Pinanatili bilang titulong transliterado dahil ito ay opisyal na titulong Asirio; iniiwasang ipakahulugan bilang pangalang pantangi o hulaan ang eksaktong katumbas na tungkulin.
- source_word: אִמְרוּ נָא
  choice: Pakisabi
  rationale: Ang נָא ay magalang na pakiusap; natural itong naihahayag sa modernong Tagalog sa pamamagitan ng “paki-.”
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: ang dakilang hari
  rationale: Tuwirang pinananatili ang mapagmataas na maharlikang titulo ng nagsasalita.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: Ano itong pinagtitiwalaan mo?
  rationale: Natural na Tagalog na nagpapanatili sa inuulit na diwa ng pangngalan at pandiwang mula sa ugat בטח, nang hindi dinaragdagan kung sino o ano ang pinagtitiwalaan.
theological_decisions:
- issue: Hindi tahasang binanggit ang pinagtitiwalaan ni Ezequias
  choice: Pinanatiling bukas sa “Ano itong pinagtitiwalaan mo?”
  alternative: “Saan nanggagaling ang tiwalang ito na taglay mo?”
  rationale: Hindi tinutukoy ng Hebreo sa talatang ito kung ang tiwala ay nasa Diyos, Ehipto, lakas militar, o iba pa; hindi dapat lutasin ng salin ang retorikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ezequias” at “Asiria,” na mga nakaugaliang anyong Filipino ng mga pangalang biblikal; pinanatiling transliterado ang titulong “Rabshake.”
