  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: ang kilos ng pagputol, ang templo ni Yahweh, at ang pagbibigay sa hari ng Asiria. Gayunman, ang “na binalutan niya bilang hari ng Juda” ay hindi tapat sa appositional na “Ezequias, hari ng Juda” sa Hebreo at hindi natural ang pagkakaugnay nito. Ang binagong teksto ay malinaw na pinapanatili ang pagtukoy kay Ezequias bilang hari ng Juda at ang di-tiyak na arkitektural na termino.'
  naturalness: Ang “Nang panahong iyon” ay katanggap-tanggap, ngunit mas karaniwan at mas maayos sa salaysay ang “Noong panahong iyon.” Ang “binalutan niya bilang hari ng Juda” ay hindi likas at maaaring magmukhang ang pagiging hari ang paraan ng pagbabalot. Ginawang tuwiran at marangal ang pangungusap.
  terminology: Pinanatili ang “Yahweh,” “templo,” “Ezequias,” “Juda,” at “Asiria.” Pinalitan ang pangunahing katawagan para sa הָאֹמְנוֹת ng “mga hamba ng pinto,” isang maingat na rendering na may talababa upang mapanatili ang leksikal na kawalang-katiyakan; maaaring tumukoy ang termino sa mga hamba, haligi, o ibang suportang pangkayarian.
