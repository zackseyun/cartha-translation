base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: tl
  text: Noong panahong iyon, pinutol ni Ezequias ang mga pinto ng templo ni Yahweh at ang mga hamba ng pinto[a] na binalutan ni Ezequias, hari ng Juda, at ibinigay niya ang mga iyon sa hari ng Asiria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga haligi” o “mga suporta.” Bihira ang salitang Hebreo at maaaring mas malawak na tumukoy sa mga suportang pangkayarian na kaugnay ng mga pinto ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na makabagong Tagalog para sa karaniwang idyomang temporal na nag-uugnay sa pangyayari sa daloy ng salaysay.
- source_word: קִצַּץ
  choice: pinutol
  rationale: Pinananatili ang kongkretong diwa ng pagputol o pagtibag, sa halip na ipakahulugang basta pagtanggal lamang.
- source_word: דַּלְתוֹת
  choice: ang mga pinto
  rationale: Direkta at malinaw na katumbas ng karaniwang salitang Hebreo para sa mga pinto o mga panel ng pinto.
- source_word: הֵיכַל יְהוָה
  choice: templo ni Yahweh
  rationale: Sa konteksto, ang הֵיכָל ay tumutukoy sa templo sa Jerusalem; ang banal na pangalan ay tinumbasan bilang Yahweh.
- source_word: הָאֹמְנוֹת
  choice: ang mga haligi ng pinto
  rationale: Ang bihirang terminong pang-arkitektura ay malamang na tumutukoy sa mga suportang kaugnay ng mga pinto; inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: צִפָּה
  choice: binalutan
  rationale: Ipinahihiwatig ng pandiwa ang paglalagay ng sapin o balot, karaniwan ay metal, ngunit hindi tinutukoy sa talata ang materyal kaya hindi ito idinagdag.
- source_word: וַיִּתְּנֵם
  choice: at ibinigay ang mga iyon
  rationale: Direktang inilalarawan ang pagbibigay ng mga tinanggal na bahagi bilang tributo nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: sa hari ng Asiria
  rationale: Malinaw at karaniwang Tagalog para sa pariralang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong kilos ng pagputol at ang kawalang-katiyakan sa bihirang terminong pang-arkitektura sa pamamagitan ng talababa.
