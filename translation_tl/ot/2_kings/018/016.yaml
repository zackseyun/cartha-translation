- from: Nang panahong iyon, pinutol ni Ezequias ang mga pinto ng templo ni Yahweh at ang mga haligi ng pinto[a] na binalutan niya bilang hari ng Juda, at ibinigay ang mga iyon sa hari ng Asiria.
  to: Noong panahong iyon, pinutol ni Ezequias ang mga pinto ng templo ni Yahweh at ang mga hamba ng pinto[a] na binalutan ni Ezequias, hari ng Juda, at ibinigay niya ang mga iyon sa hari ng Asiria.
