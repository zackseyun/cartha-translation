- from: Talaga bang nailigtas ng mga diyos ng mga bansa[a]—ng bawat isa sa kanila—ang kani-kaniyang lupain mula sa kamay ng hari ng Asiria?
  to: Talaga bang nailigtas[a] ng mga diyos ng mga bansa ang kani-kaniyang lupain mula sa kamay ng hari ng Asiria?
