  register: Makabago at marangal na Filipino. Pinanatili ang retorikal at mapanuyang hamon, pati ang larawang “mula sa kamay,” habang ginawang natural sa Tagalog ang distributibong diwa ng bawat diyos at kani-kaniyang lupain.
