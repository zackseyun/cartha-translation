base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: tl
  text: Talaga bang nailigtas[a] ng mga diyos ng mga bansa ang kani-kaniyang lupain mula sa kamay ng hari ng Asiria?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gumagamit ang Hebreo ng mariing pagkakabuo; literal, “Sa pagliligtas, nailigtas ba ng mga diyos ng mga bansa ang kani-kaniyang lupain...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: Talaga bang nailigtas
  rationale: Ang infinitive absolute na sinundan ng finite verb ay nagbibigay-diin sa pandiwa. Sa mapanghamong tanong, natural na naihahayag ito ng “Talaga bang nailigtas” nang hindi ginagaya ang di-likas na pag-uulit ng Hebreo.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: mga diyos ng mga bansa
  rationale: Tuwirang pinananatili nito ang plural construct at ang pagkakaiba ng mga diyos na inuugnay sa sari-saring bansa.
- source_word: אִישׁ
  choice: bawat isa sa kanila
  rationale: Distributibo ang gamit ng אִישׁ dito, hindi tumutukoy sa isang lalaking tao. Nililinaw ng parirala na bawat diyos ang tinutukoy.
- source_word: אֶת אַרְצוֹ
  choice: ang kani-kaniyang lupain
  rationale: 'Ipinahahayag ng “kani-kaniyang” ang distributibong singular: ang lupaing kaugnay ng bawat diyos. Iniiwasan din nito ang di-likas o malabong panghalip na panlalaki sa Filipino.'
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang malinaw na larawan ng Hebreong idyoma para sa pagliligtas mula sa kapangyarihan o paghahari ng isang tao.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Ito ang tuwiran at karaniwang salin ng construct expression.
