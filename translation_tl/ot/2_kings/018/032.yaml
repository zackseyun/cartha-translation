source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: tl
  text: hanggang sa dumating ako at dadalhin ko kayo sa isang lupaing tulad ng sarili ninyong lupain—isang lupain ng butil at bagong alak[a], isang lupain ng tinapay at mga ubasan, isang lupain ng langis ng olibo[b] at pulot—upang mabuhay kayo at hindi mamatay. Huwag ninyong pakinggan si Ezequias, sapagkat inililigaw niya kayo sa pagsasabing, “Ililigtas tayo ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alak”; ang “bagong alak” ay nagpapakita ng mas tiyak na kahulugan ng תִּירוֹשׁ.
    reason: lexical_alternative
  - marker: b
    text: Siksik ang pariralang Hebreo tungkol sa olibo at langis; ang “langis ng olibo” ang natural na pagpapahayag ng kahulugan nito sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: hanggang sa dumating ako
  rationale: Ipinahahayag ng parirala ang hinaharap na panahong hinihintay; tuwiran at natural na katumbas ng בוא ang “dumating.”
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: at dalhin kayo
  rationale: Sa konteksto, ang לקח ay tumutukoy sa pagkuha at paglilipat sa mga mamamayan. Ipinahihiwatig ng “dalhin kayo” ang deportasyon nang hindi dinaragdagan ang tindi ng salita.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: sa isang lupaing tulad ng sarili ninyong lupain
  rationale: Pinananatili ng “tulad ng” ang paghahambing na ipinahihiwatig ng כְּ, at ng “sarili ninyong” ang mapang-akit na pangakong magiging kahawig ng Juda ang kanilang patutunguhan.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: isang lupain ng butil at bagong alak
  rationale: Pangkalahatang katawagan sa ani ng cereal ang דָּגָן, kaya “butil”; karaniwang tumutukoy ang תִּירוֹשׁ sa sariwa o bagong alak.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: isang lupain ng tinapay at mga ubasan
  rationale: Pinananatili ang kongkretong larawan ng לֶחֶם bilang “tinapay” at ng כְּרָמִים bilang mga taniman ng ubas.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: isang lupain ng langis ng olibo at pulot
  rationale: Siksik ang pariralang Hebreo tungkol sa olibo at langis; ang “langis ng olibo” ang natural na pagpapahayag ng pangunahing kahulugan ng יִצְהָר sa konteksto.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: upang mabuhay kayo at hindi mamatay
  rationale: Ipinahahayag nito ang layunin o ipinapangakong bunga ng pagsunod sa panawagan, habang pinananatili ang matinding pagsalungat ng buhay at kamatayan.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Huwag ninyong pakinggan si Ezequias
  rationale: Ang שׁמע אל ay nangangahulugang makinig o tumalima; natural dito ang “pakinggan” at hindi nito ipinapasok nang tahasan ang konsepto ng pagsunod.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: sapagkat inililigaw niya kayo
  rationale: Maaaring mangahulugan ang Hiphil ng סות na udyukan, akitin, o iligaw. Ang “inililigaw” ay angkop sa akusasyon ng tagapagsalita nang hindi awtomatikong pinatutunayang nagsisinungaling si Ezequias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יַצִּילֵנוּ
  choice: Ililigtas tayo
  rationale: Sa kontekstong militar, ang Hiphil ng נצל ay tumutukoy sa pagliligtas mula sa panganib; malinaw at likas sa Filipino ang “ililigtas tayo.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng titulong “PANGINOON.”
- issue: Katayuan ng sinabi ni Ezequias
  choice: inililigaw niya kayo
  alternative: dinadaya niya kayo; inuudyukan niya kayo
  rationale: Akusasyon ito ng opisyal ng Asiria, hindi pasya ng tagapagsalaysay. Pinananatili ng salin ang pananaw ng nagsasalita at hindi nito pinatutunayang mali ang pagtitiwala ni Ezequias kay Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa paulit-ulit na אֶרֶץ at pinanatili ang retorikal na pag-uulit. Ang gitling na mahaba ay tumutulong na ipangkat ang talaan ng kasaganaan nang hindi binabago ang sintaks o puwersa ng pahayag.
