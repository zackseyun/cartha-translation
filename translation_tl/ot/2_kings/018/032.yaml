  terminology: Ang “Yahweh,” “Ezequias,” “bagong alak,” “mga ubasan,” at “langis ng olibo” ay angkop. Ang paliwanag sa talababa b ay dapat huwag magbigay ng alternatibong “mga olibo at pulot,” sapagkat hindi nito sapat na nasasalamin ang יִצְהָר (“langis”).
