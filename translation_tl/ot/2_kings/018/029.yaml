  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: tl
  text: 'Ganito ang sabi ng hari: “Huwag kayong padaya kay Hezekias[a], sapagkat hindi niya kayo maililigtas mula sa kanyang kamay.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kayong iligaw ni Hezekias.” Ang pandiwang Hebreo ay maaaring mangahulugang iligaw o dayain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kanyang kamay,” isang idyoma para sa paglaya mula sa kapangyarihan ng isang tao. Sa paralel na Isaias 36:14, “mula sa aking kamay” ang mababasa.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Likas at marangal na pormula sa modernong Tagalog para sa isang opisyal na pahayag ng hari; pinananatili ang pamagat sa halip na idagdag ang pangalan ng hari.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: Huwag kayong padaya
  rationale: Ipinapahayag ng causative na anyo ng נשׁא ang pagpapaligaw o panlilinlang. Ang “padaya” ay natural sa Tagalog at nagpapanatili sa diwang huwag hayaang malinlang.
- source_word: חִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Tagalog.
- source_word: כִּי לֹא יוּכַל
  choice: sapagkat hindi niya ... maililigtas
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang לֹא יוּכַל ay nagsasaad ng kawalan ng kakayahan; likas na naipahahayag ito sa potensyal na pandiwang Tagalog na “maililigtas.”
- source_word: לְהַצִּיל אֶתְכֶם
  choice: kayo maililigtas
  rationale: Ang הציל ay tumutukoy sa pagliligtas mula sa panganib o kapangyarihan ng kaaway, na angkop sa kontekstong militar.
- source_word: מִיָּדוֹ
  choice: mula sa kanyang kamay
  rationale: Tapat na pinanatili ang Hebreong idyoma at ang ikatlong panauhang panlalaking hulapi; nauunawaan ang “kamay” bilang larawan ng kapangyarihan o paghahari.
theological_decisions:
- issue: Tinutukoy ng “kanyang kamay” sa מִיָּדוֹ
  choice: mula sa kanyang kamay
  alternative: mula sa aking kamay; mula sa kanyang kapangyarihan
  rationale: Ang ibinigay na tekstong Hebreo ay may hulaping ikatlong panauhan (“kanyang”), kaya hindi ito itinugma sa paralel na Isaias 36:14 na may “aking kamay.” Pinanatili rin ang idyoma upang hindi labis na ipaliwanag ang teksto sa mismong talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang maramihang “kayo” ayon sa kausap ng Hebreo. Pinanatili ang pormula ng pahayag ng hari at ang konkretong idyomang “kamay.”
