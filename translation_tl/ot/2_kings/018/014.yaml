  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: tl
  text: Pagkatapos, nagpadala si Haring Ezequias ng Juda ng mensahe sa hari ng Asiria na nasa Lakis[a]. Sinabi niya, “Nagkasala ako. Lumayo ka sa akin. Anuman ang ipataw mo sa akin[b] ay papasanin ko.” Kaya pinatawan ng hari ng Asiria si Haring Ezequias ng Juda ng tatlong daang talento ng pilak at tatlumpung talento ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungong Lakis.” Maaaring ipahiwatig ng anyong Hebreo ang pagkilos patungo sa Lakis, bagaman malamang na tinutukoy rito kung saan naroon ang hari ng Asiria.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Anuman ang ilagay o ipataw mo sa akin, dadalhin o babayaran ko.” Inilalarawan ng Hebreo ang pagtanggap sa anumang pasanin o singil na ipataw sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala ... ng mensahe
  rationale: Sa kontekstong sinusundan ng tuwirang pahayag, ang ipinadala ay ipinahihiwatig na mensahe o mga sugo. Likas sa modernong Tagalog ang “nagpadala ng mensahe” at hindi nito tinutukoy nang higit sa teksto kung sino ang mga sugo.
- source_word: לָכִישָׁה
  choice: na nasa Lakis
  rationale: Maaaring magpahiwatig ang hulaping Hebreo ng pagkilos patungong Lakis, ngunit sa salaysay ay malamang na tinutukoy nito ang kinaroroonan ng hari ng Asiria. Inilagay sa talababa ang tunay na alternatibo.
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Karaniwang kahulugan ng חטא ang “magkasala.” Pinananatili nito ang moral na bigat ng pag-amin kahit nasa diplomatikong konteksto ang pahayag.
- source_word: שׁוּב מֵעָלַי
  choice: Lumayo ka sa akin
  rationale: Ipinahahayag nito ang paghiling na ihinto ng hari ng Asiria ang mapanlabang paglapit o panggigipit. Natural ito sa Tagalog nang hindi labis na nililimitahan sa teknikal na pag-urong ng hukbo.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Anuman ang ipataw mo sa akin
  rationale: Ang parirala ay tumutukoy sa paglalagay ng pasanin, buwis, o singil. Malinaw ang “ipataw” ngunit hindi paunang nililimitahan ang bagay sa tributo o multa.
- source_word: אֶשָּׂא
  choice: papasanin ko
  rationale: Pinananatili nito ang larawan ng נשׂא na pagdadala o pagpasan. Sa konteksto, maaari itong mangahulugang pagtanggap o pagbabayad sa ipinataw na singil.
- source_word: וַיָּשֶׂם ... עַל
  choice: pinatawan ... ng
  rationale: Natural na salin ito para sa paglalagay ng obligasyon o tributo kay Ezequias at kaugnay ng naunang pandiwang “ipataw.”
- source_word: כִּכַּר
  choice: talento
  rationale: Ito ang nakaugaliang tawag sa sinaunang yunit ng timbang na tinutukoy ng ככר.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Metal na pilak ang tuwirang tinutukoy at sinusukat ayon sa timbang, hindi lamang salapi sa pangkalahatan.
- source_word: זָהָב
  choice: ginto
  rationale: Ito ang tuwirang kahulugan ng salita at sinusukat dito ayon sa talento.
theological_decisions:
- issue: Bigat ng pag-amin ni Ezequias
  choice: Nagkasala ako
  alternative: Nagkamali ako / Nagkasala ako sa iyo
  rationale: Pinananatili ng “nagkasala” ang karaniwang moral na lakas ng pandiwang Hebreo. Hindi idinagdag ang “sa iyo,” sapagkat hindi tahasang binanggit sa orihinal ang layon.
- issue: Lawak ng wikang tumutukoy sa ipinataw na tributo
  choice: Anuman ang ipataw mo sa akin ay papasanin ko
  alternative: Anumang tributo ang singilin mo sa akin ay babayaran ko
  rationale: Ang napiling salin ay malinaw ngunit pinananatili ang malawak na larawan ng isang pasaning ipinapataw at pinapasan. Nililinaw ng kasunod na pangungusap na salaping tributo ang aktuwal na ipinataw.
translation_notes:
  register: Gumamit ng modernong, marangal, at madaling maunawaang Tagalog. Pinanatili ang mga pangalang Ezequias, Asiria, at Lakis, gayundin ang tradisyonal na yunit na “talento.” Ang maikling mga pangungusap sa pahayag ni Ezequias ay nagpapanatili sa apurahan at mapagpakumbabang tono ng diplomatikong pagsuko.
