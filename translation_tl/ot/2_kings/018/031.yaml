  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: tl
  text: 'Huwag ninyong pakinggan si Ezequias, sapagkat ganito ang sabi ng hari ng Asiria: “Makipagkasundo kayo sa akin[a] at lumabas kayo tungo sa akin, at ang bawat isa sa inyo ay makakakain ng bunga mula sa sarili niyang puno ng ubas at puno ng igos, at makakainom ng tubig mula sa sarili niyang sisterna.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “gumawa kayo ng pagpapala sa akin,” isang idyomang tumutukoy sa pakikipagkasundo o pagpasok sa mga tuntunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: pakinggan
  rationale: Ang pandiwang שׁמע na may אֶל ay nangangahulugang makinig o magbigay-pansin. Pinananatili ng “pakinggan” ang tuwirang diwa nang hindi tahasang pinapalawak ito bilang “sundin.”
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong saling Filipino.
- source_word: כִּי כֹה אָמַר
  choice: sapagkat ganito ang sabi
  rationale: Natural at marangal na Filipino para sa pormulang Hebreo na nagpapakilala ng tuwirang pahayag.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang ipinapahayag ang ugnayang construct ng pariralang Hebreo.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Makipagkasundo kayo sa akin
  rationale: Ang literal na “gumawa kayo ng pagpapala sa akin” ay isang di-karaniwang idyomang pampolitika para sa pagpasok sa mapayapa o kanais-nais na kasunduan. Ang “makipagkasundo” ay malinaw sa konteksto ng pagkubkob, samantalang inilalahad sa talababa ang literal na anyo.
- source_word: וּצְאוּ אֵלַי
  choice: at lumabas kayo papunta sa akin
  rationale: Pinananatili ang kongkretong larawan ng paglabas mula sa lunsod nang hindi tahasang isinasalin bilang “sumuko,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: ang bawat isa sa inyo ay makakakain ng bunga ng sarili niyang puno ng ubas at puno ng igos
  rationale: Ipinahahayag ng “bawat isa” ang distributibong gamit ng אִישׁ. Idinagdag ang “bunga” upang maging natural sa Filipino ang pagkain mula sa puno nang hindi binabago ang diwa.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: at makakainom ng tubig mula sa sarili niyang imbakan ng tubig
  rationale: Sa kontekstong ito, ang בּוֹר ay hukay o sisternang pinag-iimbakan ng tubig, hindi kinakailangang balong may likas na bukal. Mas malinaw sa karaniwang Filipino ang “imbakan ng tubig” kaysa “sisterna.”
theological_decisions:
- issue: Distributibong אִישׁ sa pangako ng hari ng Asiria
  choice: ang bawat isa sa inyo … sarili niyang
  alternative: bawat lalaki … sarili niyang
  rationale: Bagaman panlalaki ang anyong Hebreo, distributibo at kinatawan ang gamit nito sa pagsasalita sa buong populasyon. Ang “bawat isa sa inyo” ay likas sa Filipino at hindi nagpapasok ng di-sinasadyang pagbubukod.
- issue: Idyomang pampolitika na עֲשׂוּ אִתִּי בְרָכָה
  choice: Makipagkasundo kayo sa akin
  alternative: Gumawa kayo ng pagpapala sa akin
  rationale: Ipinakikita ng konteksto na alok ito ng mga tuntunin sa pagsuko o pakikipagkasundo. Hindi ginawang tahasang “sumuko” ang salin upang mapanatili ang mapanghikayat at bahagyang di-tiyak na pananalita; ang literal na “pagpapala” ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makakakain” at “makakainom” upang maipakita ang ipinapangakong pahintulot at katiwasayan, hindi lamang isang utos. Pinanatili ang “lumabas kayo papunta sa akin” sa halip na interpretatibong “sumuko kayo.”
