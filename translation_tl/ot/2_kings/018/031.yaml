  to: 'Huwag ninyong pakinggan si Ezequias, sapagkat ganito ang sabi ng hari ng Asiria: “Makipagkasundo kayo sa akin[a] at lumabas kayo tungo sa akin, at ang bawat isa sa inyo ay makakakain ng bunga mula sa sarili niyang puno ng ubas at puno ng igos, at makakainom ng tubig mula sa sarili niyang sisterna.”'
