source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: tl
  text: Pagkatapos, sinabi nina Eliakim na anak ni Hilkias, Sebna, at Joah sa Rabshake[a], “Pakiusap, magsalita po kayo sa inyong mga lingkod sa wikang Aramaiko, sapagkat nauunawaan namin iyon. Huwag po kayong magsalita sa amin sa wikang Judeano[b] sa pandinig ng mga taong nasa pader.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isang titulong Asirio na hindi tiyak ang eksaktong kahulugan; maaari itong tumukoy sa isang mataas na opisyal.
    reason: Pinananatili ang transliterasyon habang ipinababatid ang kawalang-katiyakan sa tungkulin.
  - marker: b
    text: O “sa wikang Hebreo.” Literal na “Judeano,” na tumutukoy sa wika ng Juda.
    reason: Nagbibigay ng pamilyar na alternatibo ngunit pinananatili sa pangunahing teksto ang mas literal at di-anakronistikong katawagan.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Pinanatili bilang transliteradong titulong Asirio dahil hindi tiyak ang eksaktong tungkulin nito; iniiwasan nitong ipakahulugan nang labis bilang punong tagapagdala ng kopa o kumander.
- source_word: דַּבֶּר נָא
  choice: Pakiusap, magsalita po kayo
  rationale: Ipinahahayag ng pautos na may נָא ang magalang na pakiusap; natural sa makabagong Filipino ang anyong ito.
- source_word: עֲבָדֶיךָ
  choice: inyong mga lingkod
  rationale: Ang salita ay magalang at mapagpakumbabang katawagang diplomatiko rito, hindi pagdidiin sa kalagayan ng isang alipin.
- source_word: אֲרָמִית
  choice: sa wikang Aramaiko
  rationale: Ang anyo ay tumutukoy sa wikang gagamitin sa pagsasalita; malinaw at natural sa Filipino ang pariralang ito.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: sapagkat nauunawaan namin iyon
  rationale: Bagaman maaari ring mangahulugang 'naririnig,' ang שׁמע sa konteksto ng kakayahang pangwika ay nangangahulugang 'nauunawaan.'
- source_word: יְהוּדִית
  choice: wikang Judeano
  rationale: Literal itong tumutukoy sa wika ng Juda. Pinananatili ng 'Judeano' ang heograpiko at pampolitikang katawagan nang hindi ito awtomatikong itinutumbas sa teknikal na katawagang 'Hebreo.'
- source_word: בְּאָזְנֵי
  choice: na naririnig ng
  rationale: Natural na Filipino ito para sa idyomang literal na 'sa mga tainga ng' at pinananatili ang diin sa pandinig ng mga tao.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: mga taong nasa ibabaw ng pader
  rationale: Pinanatili ang pangkalahatang 'mga tao' sa halip na paliitin ang kahulugan bilang mga kawal, at malinaw na nasa ibabaw sila ng pader.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Pagkatapos, sinabi ... sa
  rationale: Ipinahahayag ng 'Pagkatapos' ang pagsulong ng salaysay, samantalang natural sa Filipino ang 'sinabi ... sa.'
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magalang na 'po/kayo' upang katawanin ang diplomatiko at mapagpakumbabang tono. Ang 'Rabshake' at 'wikang Judeano' ay nagpapanatili ng tunay na leksikal at historikal na kawalang-katiyakan.
