revisions:
- from: Pagkatapos, sinabi nina Eliakim na anak ni Hilkias, Sebna, at Joa sa Rabshake[a], “Pakiusap, magsalita po kayo sa inyong mga lingkod sa wikang Aramaiko, sapagkat nauunawaan namin iyon. Huwag po kayong magsalita sa amin sa wikang Judeano[b] na naririnig ng mga taong nasa ibabaw ng pader.”
  to: Pagkatapos, sinabi nina Eliakim na anak ni Hilkias, Sebna, at Joah sa Rabshake[a], “Pakiusap, magsalita po kayo sa inyong mga lingkod sa wikang Aramaiko, sapagkat nauunawaan namin iyon. Huwag po kayong magsalita sa amin sa wikang Judeano[b] sa pandinig ng mga taong nasa pader.”
  rationale: Pinalitan ang relative clause ng “sa pandinig ng” upang tuwirang maipahayag ang idyomang בְּאָזְנֵי at upang malinaw na ang mga tao ang hindi dapat makarinig sa usapan. Itinuwid din ang “Joa” tungo sa “Joah” ayon sa anyong Hebreo. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
