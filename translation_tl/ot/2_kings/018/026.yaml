  terminology: Ang “Rabshake,” “mga lingkod,” “wikang Aramaiko,” at “wikang Judeano” ay angkop. Ang “Judeano” ay maingat na pagpapanatili ng terminong pang-Juda nang hindi sapilitang tinutukoy itong teknikal na “Hebreo.” Dapat ibalik ang huling h sa pangalang “Joah.”
