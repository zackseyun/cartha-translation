revisions:
- from: Pagkatapos, isinugo ng hari ng Asiria mula sa Lakis ang Tartan, ang Rab-saris, at ang Rab-shake[a] kay Haring Ezequias sa Jerusalem, kasama ang isang malaking hukbo. Umahon sila at dumating sa Jerusalem; umahon sila, dumating, at tumayo sa tabi ng daluyan ng tubig mula sa imbakan sa itaas, na nasa lansangang patungo sa Bukid ng Tagapaglaba.[b]
  to: Pagkatapos, isinugo ng hari ng Asiria mula sa Lakis ang Tartan, ang Rab-saris, at ang Rab-shake[a] kay Haring Ezequias sa Jerusalem, kasama ang isang malaking hukbo. Umahon sila at dumating sa Jerusalem; umahon sila, dumating, at tumayo sa tabi ng daluyan ng tubig ng imbakan sa itaas, na nasa lansangan ng bukid ng tagapaglaba.[b]
  rationale: Inayos ang dalawang pariralang panglunan upang masundan ang konstruksiyong Hebreo nang walang idinagdag na direksiyon o ipinahiwatig na daloy. Pinanatili ang paulit-ulit na mga pandiwa, ang di-tiyak na mga titulong Asirio, at ang lahat ng iba pang kahulugan ng talata.
