  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: tl
  text: Pagkatapos, isinugo ng hari ng Asiria mula sa Lakis ang Tartan, ang Rab-saris, at ang Rab-shake[a] kay Haring Ezequias sa Jerusalem, kasama ang isang malaking hukbo. Umahon sila at dumating sa Jerusalem; umahon sila, dumating, at tumayo sa tabi ng daluyan ng tubig ng imbakan sa itaas, na nasa lansangan ng bukid ng tagapaglaba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Tartan,” “Rab-saris,” at “Rab-shake” ay malamang na mga titulong opisyal ng Asiria, hindi mga personal na pangalan. Maaaring tumukoy ang mga ito sa punong kumander, punong opisyal o eunuko, at punong tagapagdala ng kopa o iba pang mataas na opisyal.
    reason: cultural_note
  - marker: b
    text: Ayon sa tradisyon, “bukid ng tagapagpaputi ng tela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: Tartan / Rab-saris / Rab-shake
  rationale: Malamang na mga titulong opisyal ng Asiria ang mga ito, hindi mga personal na pangalan. Pinanatili ang transliterasyon upang hindi magtakda ng tiyak na tungkuling hindi ganap na matiyak.
- source_word: בְּחֵיל כָּבֵד
  choice: kasama ang isang malaking hukbo
  rationale: Ang חַיִל ay tumutukoy rito sa puwersang militar, at ipinahihiwatig ng כָּבֵד ang laki o bigat nito. Natural at malinaw sa modernong Tagalog ang “malaking hukbo.”
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעֲמְדוּ
  choice: Umahon sila ... dumating ... at tumayo
  rationale: Pinanatili ang pag-ahon patungong Jerusalem at ang sadyang pag-uulit ng sunod-sunod na pandiwa sa salaysay na Hebreo.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: daluyan ng tubig mula sa imbakan sa itaas
  rationale: Ang תְעָלָה ay daluyan o kanal ng tubig, at ang בְּרֵכָה ay pool o imbakan ng tubig. Ang “imbakan” ay angkop sa topograpikal na konteksto.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: lansangang patungo sa Bukid ng Tagapaglaba
  rationale: Ang מְסִלָּה ay isang itinayong daan o lansangan; ang כּוֹבֵס ay taong naglalaba o nagpapaputi ng tela. Idinagdag ang “patungo sa” bilang natural na paghayag ng ugnayang panglunan.
