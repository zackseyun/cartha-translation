base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: tl
  text: Sa ikatlong taon ng paghahari ni Hosea na anak ni Ela, hari ng Israel, naging hari[a] ng Juda si Ezequias na anak ni Ahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsimulang maghari.” Sa pormulang Hebreo tungkol sa mga hari, tinutukoy ng pandiwa ang pagluklok ni Ezequias sa trono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ipinakikilala ng anyong ito ang kasunod na salaysay at ang panahong tinutukoy. Hindi na dinagdagan ng hiwalay na “At nangyari” sapagkat magiging mabigat at lipas ang tunog sa modernong Tagalog.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ikatlong taon ng paghahari
  rationale: Karaniwang pormula ito ng pagtukoy sa taon ng pamumuno ng isang hari. Nilinaw ng “ng paghahari” ang batayan ng pagbibilang nang hindi binabago ang diwa.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: ni Hosea na anak ni Ela
  rationale: Ang לְ ay tumutukoy kay Hosea bilang batayan ng taon; likas sa Tagalog ang “ni.” Ginamit ang mga pangalang karaniwan sa tradisyong Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang inilalarawan ang katungkulan at kaharian ni Hosea.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormulang panghari, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimula ng paghahari, hindi lamang ang pangkalahatang katotohanang naghari siya.
- source_word: חִזְקִיָּה
  choice: Ezequias
  rationale: Ito ang kinikilalang anyo ng pangalan sa modernong tradisyong biblikal na Tagalog.
- source_word: בֶן אָחָז
  choice: anak ni Ahaz
  rationale: Likas at tuwirang salin ng pagkakakilanlang ayon sa ama.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Isinama sa pariralang “naging hari ng Juda” upang maging natural sa Tagalog at maiwasan ang paulit-ulit na “hari.”
