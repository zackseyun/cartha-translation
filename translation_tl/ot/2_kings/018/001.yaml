translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikling anyo ng pormulang panghari at iniwasan ang arkaikong “At nangyari.” Inilipat ang pananda ng talababa sa “naging hari,” ang mismong pariralang nililinaw nito.
