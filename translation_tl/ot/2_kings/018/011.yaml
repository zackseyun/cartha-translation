translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dinala ... bilang mga bihag” upang likas na maipahayag ang sapilitang pagpapatapon, at “pinamayan” upang maipakita ang sapilitang pagtatalaga sa mga lugar na tirahan. Isinama ang bawat panandang talababa sa pangunahing teksto.
