  source_fidelity: 'Ang pangunahing diwa ay wasto: sapilitang ipinatapon ng hari ng Asiria ang Israel, at itinira sila sa Halah, Habor/ilog ng Gozan, at mga lungsod ng mga Medo. Gayunman, ang “sa tabi ng Habor” ay bahagyang nagpapaliit sa saklaw ng simpleng lokatibong Hebreo; mas maingat ang “sa Habor, na ilog ng Gozan,” na pinananatili ang appositional/construct na ugnayan nang hindi labis na nililinaw ang heograpiya.'
  naturalness: Ang “pinamayan sila” ay mauunawaan ngunit hindi kasingkaraniwan o kasinglinaw ng “pinatira sila” sa modernong Filipino para sa sapilitang pagtatalaga ng tirahan. Ang “ipinatapon” ay tuwiran at natural na katumbas ng sapilitang pagpapatapon.
  terminology: Ang “Asiria,” “Halah,” “Habor,” “Gozan,” at “mga Medo” ay angkop. Ang “Israel” ay nararapat panatilihin bilang pangalang pampolitika/kolektibo, na may talababa na nakaangkla mismo sa “Israel.”
  issues:
