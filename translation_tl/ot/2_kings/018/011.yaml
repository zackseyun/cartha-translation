base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: tl
  text: Ipinatapon ng hari ng Asiria ang Israel[b] sa Asiria at pinatira sila sa Halah, sa Habor, na ilog ng Gozan,[a] at sa mga lungsod ng mga Medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa Habor, ang ilog sa Gozan.”'
    reason: Pinananatili ng alternatibong ito ang posibleng pagbasa na ang Gozan ay tumutukoy sa lokasyong kaugnay ng ilog, sa halip na gamitin ang ugnayang “ilog ng Gozan.”
  - marker: b
    text: Ang “Israel” dito ay tumutukoy sa hilagang kaharian at sa mga mamamayan nitong dinala sa pagkabihag.
    reason: Nililinaw nito ang kolektibo at pampolitikang gamit ng pangalang Israel sa konteksto.
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Dinala ... bilang mga bihag
  rationale: Ang Hiphil ng גלה ay tumutukoy sa sapilitang pagpapatapon. Likas sa modernong Filipino ang pariralang ito at malinaw nitong ipinahihiwatig ang pagkabihag at sapilitang paglilipat.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang salin ng pariralang construct at karaniwang anyo sa Filipino.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang kolektibo at pampolitikang katawagan ng Hebreo para sa hilagang kaharian at sa mga mamamayan nito.
- source_word: אַשּׁוּרָה
  choice: sa Asiria
  rationale: Ipinapahayag ng hulaping patungo ang pagkilos papunta sa Asiria.
- source_word: וַיַּנְחֵם
  choice: pinamayan sila
  rationale: Sa konteksto ng pagpapatapon, ipinahihiwatig ng causative form na inilagay sila sa mga takdang lugar upang manirahan.
- source_word: בַּחְלַח
  choice: sa Halah
  rationale: Transliterasyon ng pangalan ng lugar sa anyong madaling basahin sa Filipino.
- source_word: וּבְחָבוֹר
  choice: sa tabi ng Habor
  rationale: Dahil ang Habor ay tinutukoy kasunod bilang isang ilog, natural sa Filipino ang lokatibong 'sa tabi ng.'
- source_word: נְהַר גּוֹזָן
  choice: na ilog ng Gozan
  rationale: Pinananatili ang construct relationship at ang posibilidad na ang Habor ang ilog na kaugnay ng Gozan.
- source_word: וְעָרֵי מָדָי
  choice: at sa mga lungsod ng mga Medo
  rationale: Tuwirang inilalarawan ang mga lungsod na nauugnay sa mga Medo, alinsunod sa kolektibong katawagang מָדָי.
