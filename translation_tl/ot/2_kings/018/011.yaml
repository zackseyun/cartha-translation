    issue: Ang “sa tabi ng Habor” ay nagdaragdag ng mas tiyak na relasyong heograpiko kaysa sa ipinahihiwatig ng Hebreong בְּ.
    rationale: Ang teksto ay naglalagay sa mga ipinatapon “sa Habor,” na sinusundan ng pagtukoy rito bilang ilog ng Gozan. Ang “sa Habor” ay mas malapit sa anyo ng pinagmulan at hindi nagpapasya nang higit sa kinakailangan kung “sa tabi,” “sa kahabaan,” o “sa” ilog ang nais idiin.
  - severity: low
    issue: Hindi pinakamalinaw sa modernong Filipino ang “pinamayan sila.”
    rationale: Ang “pinatira sila” ay karaniwang causative na pananalita para sa paglalagay ng mga tao sa takdang lugar upang manirahan.
  - severity: medium
    issue: Ang talababa tungkol sa kahulugang pampolitika ng “Israel” ay nakaangkla sa “mga Medo” sa halip na sa “Israel.”
    rationale: Dapat ilagay ang panandang b pagkatapos ng “Israel” upang tumugma ang talababa sa salitang ipinapaliwanag nito.
