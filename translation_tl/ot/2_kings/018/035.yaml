base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: tl
  text: Sino sa lahat ng mga diyos ng mga lupain ang nakapagligtas ng kani-kanilang lupain mula sa kamay ko? Maililigtas ba ni Yahweh ang Jerusalem mula sa kamay ko?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sino sa lahat ng mga diyos ng mga bansa ang nakapagligtas ng kani-kanilang bansa mula sa kamay ko? Maililigtas ba ni Yahweh ang Jerusalem mula sa kamay ko?”
    reason: Ang אֲרָצוֹת ay maaari ring isaling “mga bansa”; ang paghahati sa dalawang retorikal na tanong ay natural na paraan upang ihayag sa Filipino ang mapanuyang hamon ng hulíng sugnay.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Sino sa lahat ng mga diyos ng mga lupain
  rationale: Ang מִי ay likas na isinasaling “Sino,” at ang בְּכָל ay partitive rito, kaya “sa lahat.” Ang אֱלֹהֵי הָאֲרָצוֹת ay tumutukoy sa mga diyos ng sari-saring lupain o bansa.
- source_word: אֲשֶׁר הִצִּילוּ אֶת אַרְצָם
  choice: ang nakapagligtas ng kani-kanilang lupain
  rationale: Ang נצל sa kontekstong militar ay “magligtas.” Ipinahahayag ng “nakapagligtas” ang mapanuyang hamon tungkol sa kakayahan. Ang “kani-kanilang” ay distributibong kumakatawan sa panlalaking maramihang hulaping -ם nang hindi ipinapalagay na iisang lupain lamang ang tinutukoy.
- source_word: מִיָּדִי
  choice: mula sa kamay ko
  rationale: Pinananatili nito ang malinaw na Hebreong talinghaga ng kamay bilang kapangyarihan o kontrol.
- source_word: כִּי יַצִּיל
  choice: upang mailigtas
  rationale: Sa retorikal na hamon, iniuugnay ng כִּי ang naunang tanong sa inaakalang magiging pagliligtas sa Jerusalem. Ang “upang” ay natural sa Filipino at pinananatili ang mapanuyang diwa, bagaman maaari ring unawain bilang tahasang tanong sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Ito ang nakaugaliang modernong Filipino na anyo ng pangalan ng lungsod.
theological_decisions:
- issue: Paglalarawan sa paghamon ni Rabsake sa kakayahan ni Yahweh
  choice: upang mailigtas ni Yahweh ang Jerusalem
  alternative: maililigtas ba ni Yahweh ang Jerusalem
  rationale: Pinananatili ng pangunahing salin ang ugnayang ipinahihiwatig ng כִּי at ang mapanuyang konklusyon ng tanong, nang hindi sinasang-ayunan ang paglalagay kay Yahweh sa antas ng mga diyos ng mga bansa. Nasa bibig ito ng tagapagsalita at bahagi ng kaniyang paghamon.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit upang mapanatili ang pagkakaiba nito sa isang karaniwang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “nakapagligtas” upang natural na ihayag ang retorikal na hamon sa kakayahan, “kani-kanilang” upang luminaw ang distributibong reperensiya ng hulaping maramihan, at “mula sa kamay ko” upang mapanatili ang Hebreong larawan ng kapangyarihan.
