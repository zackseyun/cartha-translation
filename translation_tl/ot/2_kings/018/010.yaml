translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pag-uulit ng pandiwang לכד at ang pagkakasabay ng mga taon ng paghahari. Ginamit ang tradisyonal at kilalang anyong Filipino na Ezequias at Oseas para sa mga pangalan.
