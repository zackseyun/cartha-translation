  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: tl
  text: Sa pagtatapos ng tatlong taon[a], nasakop nila ito. Noong ikaanim na taon ng paghahari ni Ezequias—na siya ring ikasiyam na taon ng paghahari ni Oseas, ang hari ng Israel—nasakop ang Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Pagkaraan ng tatlong taon, nasakop nila ito.” Mas literal ang idyomang Hebreo: “Sa pagtatapos ng tatlong taon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: nasakop nila ito
  rationale: Pinananatili ang aktibong pandiwang maramihan at ang pambabaeng isahang layon na tumutukoy sa Samaria mula sa naunang konteksto.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Sa katapusan ng tatlong taon
  rationale: Malapit nitong tinutumbasan ang Hebreong idyoma na tumutukoy sa pagwawakas ng tatlong-taóng yugto, sa halip na paluwagin bilang simpleng “pagkaraan.”
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: Nang ikaanim na taon ng paghahari ni Ezequias
  rationale: Likas na salin sa Filipino ng pormula para sa taon ng paghahari; idinagdag ang “paghahari” upang luminaw ang tinutukoy ng taon.
- source_word: הִיא
  choice: na siyang
  rationale: Pinananatili ang appositional na pag-uugnay at pagtutumbas ng dalawang tala ng taon ng paghahari.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: ikasiyam na taon ng paghahari ni Oseas na hari ng Israel
  rationale: Pinananatili ang ikalawang pagtutugma ng taon at ang tahasang titulong “hari ng Israel.”
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: nasakop ang Samaria
  rationale: Ipinahahayag ang Niphal bilang pasibo/resultatibo at inuulit ang parehong salitang-ugat na “sakop” gaya ng unang sugnay.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang modernong Filipino na anyo ng pangalan ng lunsod.
