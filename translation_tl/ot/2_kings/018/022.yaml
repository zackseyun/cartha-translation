  to: Ngunit kung sasabihin ninyo sa akin, ‘Nagtitiwala kami sa PANGINOON na aming Diyos,’ hindi ba siya ang inalisan ni Ezequias ng mga dambana sa matataas na lugar at mga altar, at sinabi niya sa Juda at sa Jerusalem, ‘Sa harap ng altar na ito kayo sasamba sa Jerusalem’?”
  rationale: Pinanatili ng rebisyon ang mapanuyang paratang ng Asiryong tagapagsalita, nang hindi ipinahihiwatig na totoo ang kaniyang pag-unawa sa mga reporma ni Ezequias. Nilinaw lamang nito ang בָּמוֹת at ginawang mas malapit sa Hebreo ang ugnayan ng “inalis” at “sinabi.”
