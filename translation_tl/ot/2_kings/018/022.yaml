  source_fidelity: 'Tumpak ang pangunahing sintaks at retorikal na punto: ang nagsasalita ay tumutukoy sa YHWH bilang siya na diumano’y inalisan ni Ezequias ng mga lugar ng pagsamba at altar. Gayunman, ang “matataas na sambahan” ay hindi gaanong tiyak para sa בָּמוֹת, na mga dambana o pook-sambahan sa matataas na lugar. Ang “at sinabi niya” ay mas tuwirang sumasalamin sa magkakaugnay na pandiwa sa Hebreo kaysa “nang sabihin niya.”'
  naturalness: Natural ang pangmaramihang pananalita at ang retorikal na tanong. Mas malinaw at mas likas sa modernong Filipino ang “mga dambana sa matataas na lugar” kaysa “matataas na sambahan.”
  terminology: Ang PANGINOON, Diyos, altar, Juda, Jerusalem, at Ezequias ay angkop. Ang binagong katawagan sa בָּמוֹת ay nagpapaliwanag ng likas na heograpikal at pangkultong kahulugan nito nang hindi nagdaragdag ng interpretasyong doktrinal.
