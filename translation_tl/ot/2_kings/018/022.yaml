  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: tl
  text: Ngunit kung sasabihin ninyo sa akin, ‘Nagtitiwala kami sa PANGINOON na aming Diyos,’ hindi ba siya ang inalisan ni Ezequias ng mga dambana sa matataas na lugar at mga altar, at sinabi niya sa Juda at sa Jerusalem, ‘Sa harap ng altar na ito kayo sasamba sa Jerusalem’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Isinalin ang banal na pangalan ayon sa karaniwang marangal na kumbensiyon sa Bibliyang Tagalog, habang pinananatili ang pagkakakilanlan nito sa pamamagitan ng malalaking titik.
- source_word: בָּמֹתָיו
  choice: matataas na sambahan
  rationale: Tumutukoy ang בָּמוֹת sa mga mataas na lugar na ginagamit sa pagsamba; mas malinaw sa karaniwang mambabasa ang ‘matataas na sambahan’ kaysa sa literal ngunit malabong ‘matataas na lugar.’
- source_word: מִזְבְּחֹתָיו
  choice: mga altar
  rationale: Ang ‘altar’ ang natural at kinikilalang katawagan sa modernong Filipino para sa mga dakong pinaghahandugan.
- source_word: תִּשְׁתַּחֲווּ
  choice: kayo sasamba
  rationale: Sa kontekstong panrelihiyon, ang pandiwa ay tumutukoy sa pagyukod bilang pagsamba; ang ‘sasamba’ ay natural at sapat na malinaw.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: sa harap ng altar na ito
  rationale: Pinananatili ang spatial at panliturhiyang diwa ng לִפְנֵי nang hindi dinaragdagan ang pahayag.
theological_decisions:
- issue: Ang pag-angkin ng tagapagsalita na ang mga sambahang inalis ni Ezequias ay pag-aari ng PANGINOON
  choice: Pinanatili ang retorikal na tanong at ang pariralang nagpapakitang ang mga ito ay ‘kanyang’ matataas na sambahan at altar.
  alternative: Ipaliwanag sa teksto na maling pagkaunawa ito ng Asiriong tagapagsalita sa reporma ni Ezequias.
  rationale: Ang talata ay nagsasalaysay ng argumento ng tagapagsalita, hindi nagpapatibay sa kawastuhan nito. Hindi dapat lutasin ng salin ang ironiya o teolohikal na tensiyon.
- issue: Sentralisasyon ng pagsamba sa Jerusalem
  choice: 'Isinalin nang tuwiran: ‘Sa harap ng altar na ito kayo sasamba sa Jerusalem.’'
  alternative: Dagdagan ng paliwanag na ito ang altar sa templo ng PANGINOON.
  rationale: Hindi tahasang sinasabi ng Hebreo ang ‘templo’; sapat ang konteksto at dapat iwasan ang dagdag na interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘ninyo/kami/kayo’ para sa natural na pangmaramihang pananalita, at pinanatili ang mapanuyang retorikal na anyo ng pahayag.
