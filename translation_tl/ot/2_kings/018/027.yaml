revisions:
- from: Sinabi sa kanila ng Rabsake, “Sa amo lamang ba ninyo at sa inyo ako isinugo ng aking amo upang sabihin ang mga salitang ito? Hindi ba isinugo rin niya ako sa mga lalaking nakaupo sa pader, na kasama ninyong kakain ng sarili nilang dumi at iinom ng sarili nilang ihi[a]?”
  to: Sinabi sa kanila ng Rabsake, “Sa amo ninyo at sa inyo ba ako isinugo ng aking amo upang sabihin ang mga salitang ito? Hindi ba isinugo rin niya ako sa mga lalaking nakaupo sa pader, na kakain ng sarili nilang dumi at iinom ng sarili nilang ihi kasama ninyo[a]?”
  rationale: Inalis ang dagdag na “lamang” upang hindi lumampas sa tahasang sinasabi ng Hebreo. Inilipat ang “kasama ninyo” sa hulihan para malinaw na ito ay tumutukoy sa sabayang daranasin ng mga nasa pader at ng mga kausap. Muling isinulat ang talababa upang maipakita ang tekstuwal na eupemismo nang walang hindi tumpak na pahayag tungkol sa Masoretikong mga anyo.
