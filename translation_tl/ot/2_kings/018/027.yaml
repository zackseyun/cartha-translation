base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: tl
  text: Sinabi sa kanila ng Rabsake, “Sa amo ninyo at sa inyo ba ako isinugo ng aking amo upang sabihin ang mga salitang ito? Hindi ba isinugo rin niya ako sa mga lalaking nakaupo sa pader, na kakain ng sarili nilang dumi at iinom ng sarili nilang ihi kasama ninyo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tuwirang gumagamit ang Hebreo ng magaspang na larawan ng pagkubkob: “kakain ng sarili nilang dumi at iinom ng sarili nilang ihi.” May mga tradisyong tekstuwal na gumagamit ng eupemistikong pananalita para sa ikalawang pahayag, na kadalasang isinasaling “iininom ang tubig ng kanilang mga paa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabsake
  rationale: Pinanatili bilang titulo/pangalan ng mataas na opisyal na Asirio, ayon sa gamit nito sa salaysay, sa halip na tukuyin nang labis ang tiyak na tungkulin niya.
- source_word: הַעַל ... שְׁלָחַנִי אֲדֹנִי
  choice: Sa ... lamang ba ako isinugo ng aking amo
  rationale: Isinalin bilang retorikal na tanong. Ang “lamang” ay likas na nagpapahayag sa Tagalog ng paghahambing na nililinaw ng kasunod na הֲלֹא, bagaman hindi ito hiwalay na salita sa unang sugnay.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: amo ninyo / aking amo
  rationale: Tumutukoy ang mga ito sa mga pinunong tao sa usapang pampolitika, hindi sa banal na titulo; malinaw at natural dito ang “amo.”
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: upang sabihin ang mga salitang ito
  rationale: Pinananatili ang konkretong diwa ng “mga salitang ito” sa natural na makabagong Tagalog.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Hindi ba isinugo rin niya ako sa mga lalaking nakaupo sa pader
  rationale: Ang הֲלֹא ay retorikal na tanong na umaasang sasang-ayon ang kausap; ipinahahayag ng “rin” ang implisitong paghahambing sa mga opisyal.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: na ... kakain ... at iinom
  rationale: Ipinahahayag ng panghinaharap ang malagim na kahihinatnan ng pagkubkob nang hindi nagdaragdag ng teolohikal na kahulugan.
- source_word: חרי/הם
  choice: sarili nilang dumi
  rationale: Direkta ngunit karaniwang salitang Tagalog na nagpapanatili sa magaspang at mapanlait na larawang ginagamit sa banta.
- source_word: שיני/הם
  choice: sarili nilang ihi
  rationale: Ibinibigay ang tuwirang kahulugan ng magaspang na pananalita upang maging malinaw sa modernong mambabasa.
- source_word: עִמָּכֶם
  choice: kasama ninyo
  rationale: Pinananatili ang diwang sabay na daranasin ng mga nasa pader at ng mga kausap ang paghihirap ng pagkubkob.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal ang pangkalahatang himig, ngunit sadyang pinanatili ang magaspang na pananalita ng opisyal na Asirio dahil mahalaga ito sa tindi ng kanyang panunuya at banta. Ginamit ang “pader” para sa muog ng lungsod ayon sa karaniwang pagkaunawa sa konteksto.
