  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: tl
  text: Nilupig niya ang mga Filisteo hanggang sa Gaza at sa teritoryo nito[b], mula sa tore ng bantay hanggang sa lungsod na may tanggulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa tore ng bantay hanggang sa lungsod na may tanggulan,” isang idyomang nangangahulugang mula sa pinakamaliit na himpilan hanggang sa pinakamalaking pamayanang pinatibay para sa depensa.
    reason: cultural_note
  - marker: b
    text: O “at sa mga hangganan nito.” Ang salitang Hebreo ay maaaring tumukoy sa mga guhit ng hangganan o sa teritoryong sakop ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: niya
  rationale: Nananatili ang tahasang pagtukoy kay Hezekias bilang simuno sa konteksto; natural sa Tagalog ang panghalip na nasa anyong aktor ng pandiwang pokus-sa-layon.
- source_word: הִכָּה
  choice: Nilupig
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa pananakit o paggapi. Ang “nilupig” ay malinaw at likas sa modernong Tagalog nang hindi ipinapalagay na lubusang nalipol ang kaaway.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagan sa pangkat-etnikong Philistine sa Tagalog.
- source_word: עַד עַזָּה
  choice: hanggang sa Gaza
  rationale: Ipinahahayag ng עַד ang hangganan o lawak na naabot.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: at sa nasasakupan nito
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o ng teritoryong sakop. Ang “nasasakupan” ay angkop sa pagbanggit sa Gaza habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: mula sa toreng bantayan
  rationale: Natural na katumbas ng tore ng mga nagbabantay; pinananatili ang isahang anyo ng Hebreo at ang larawan ng isang maliit na himpilan.
- source_word: עַד עִיר מִבְצָר
  choice: hanggang sa napapaderang lungsod
  rationale: Ang עִיר מִבְצָר ay isang lungsod na pinatibay para sa depensa. Ang “napapaderang lungsod” ay kongkreto at madaling maunawaan sa makasaysayang konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nilupig” para sa natural na paglalarawan ng tagumpay sa digmaan, at “napapaderang lungsod” upang ihatid nang kongkreto ang depensibong katangian ng lungsod. Inayos ang mga pananda bilang [b] sa leksikal na parirala at [a] sa buong idyoma.
