base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: tl
  text: Tingnan mo, nagtitiwala ka sa Ehipto, sa wasak na tambong ito na ginagamit na tungkod[a]. Kapag may sumandal dito[b], tatagos ito sa palad niya at babutasan nito ang palad niya. Ganiyan si Faraon, na hari ng Ehipto, sa lahat ng nagtitiwala sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “durog na tambong ginagamit na tungkod.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay na durog, nabugbog, o wasak.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kapag sumandal dito ang isang lalaki.” Ginagamit dito ang panlalaking isahan bilang panlahat na pagtukoy sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: nagtitiwala ka sa Ehipto
  rationale: Ipinahahayag ng בטח ang kasalukuyang pag-asa o pananalig sa Ehipto; natural sa modernong Tagalog ang “nagtitiwala ... sa.”
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: wasak na tambo na ginagamit na tungkod
  rationale: Ang מִשְׁעֶנֶת ay suportang sinasandalan, at ang רָצוּץ ay maaaring mangahulugang wasak, durog, o nabugbog. Nililinaw ng parirala ang larawan ng tambo bilang tungkod nang hindi inaalis ang talinghaga.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Kapag may sumandal dito
  rationale: Ang Niphal ng סמך ay tumutukoy sa pagsandal para sa suporta. Ang “may” ay natural na panlahat sa Tagalog at pinananatili ang di-tiyak na tao sa Hebreo.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: tatagos ito sa palad niya at tutusukin iyon
  rationale: Ang כַּף ay partikular na “palad,” at ang נקב ay tumutukoy sa pagbutas o pagtusok. Pinananatili ng salin ang marahas at kongkretong larawan.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Ganiyan si Faraon na hari ng Ehipto
  rationale: Ang כֵּן ay naghahambing kay Faraon sa mapanganib na tambo; natural na katumbas sa Tagalog ang “Ganiyan.”
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: sa lahat ng nagtitiwala sa kanya
  rationale: Pinananatili nito ang panlahat na saklaw ng participle at ang ugnayang ipinahahayag ng לְ.
