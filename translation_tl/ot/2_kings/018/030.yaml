  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: tl
  text: At huwag ninyong hayaang kumbinsihin kayo ni Ezequias na magtiwala kay Yahweh sa pagsasabing, “Tiyak na ililigtas tayo ni Yahweh[a], at ang lunsod na ito ay hindi ibibigay sa kamay ng hari ng Asiria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang ugat ng pandiwa para sa pagbibigay-diin: “Sa pagliligtas ay ililigtas niya tayo,” ibig sabihin, “Tiyak na ililigtas niya tayo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: huwag ninyong hayaang kumbinsihin kayo ... na magtiwala
  rationale: Ang Hiphil ng בטח na may tuwirang layon ay may sanhi o mapanghikayat na diwa. Likas sa makabagong Tagalog ang “kumbinsihin ... na magtiwala” at mas malinaw ito kaysa sa literal ngunit asiwa na “pagtiwalain kayo.”
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Sa kaugnayan ng pandiwang בטח, ang אֶל ay likas na ipinahahayag sa Tagalog bilang pagtiwala “kay” Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לֵאמֹר
  choice: sa pagsasabing
  rationale: Likas na panandang Filipino para sa siniping pahayag at ipinakikita ang paraan ng panghihikayat.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: Tiyak na ililigtas tayo
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagbibigay-diin; ipinahahayag ito ng “tiyak na” sa natural na Tagalog.
- source_word: וְלֹא תִנָּתֵן
  choice: at ... ay hindi ibibigay
  rationale: Pinananatili ang balintiyak na anyo ng Hebreo at ang diwa ng pagbibigay ng lunsod sa kapangyarihan ng kaaway.
- source_word: הָעִיר הַזֹּאת
  choice: ang lunsod na ito
  rationale: Tuwiran at natural na salin ng pangngalan at pantukoy na demonstratibo.
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Pinanatili ang kongkretong idyomang Hebreo, na malinaw sa konteksto bilang pagsailalim sa kapangyarihan ng hari.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Karaniwang makasaysayang katawagan sa Filipino para sa pinuno ng Assyria.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapanatili sa pag-aangkin ni Ezequias sa loob ng pananalita ng kaaway
  choice: Inilahad bilang tuwirang sipi nang walang paliwanag kung tama o mali ito
  alternative: Lagyan ng paliwanag na ang nagsasalita ay nanunuya o na ang pangako ay tunay
  rationale: Ang talata ay nag-uulat ng argumento ng opisyal ng Asiria. Hindi dapat resolbahin sa mismong salin ang teolohikal at retorikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kumbinsihin” upang natural na maipahayag ang causative force, habang pinanatili ang idyomang “sa kamay ng.” Inilagay ang panandang [a] pagkatapos ng buong sipi upang tumukoy sa binigyang-diin na pariralang “Tiyak na ililigtas tayo.”
