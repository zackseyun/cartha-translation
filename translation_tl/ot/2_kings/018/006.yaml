  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: tl
  text: Kumapit siya nang mahigpit[a] kay Yahweh; hindi siya tumalikod sa pagsunod sa kanya, at sinunod niya ang mga utos na iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mahigpit siyang nanatiling nakaugnay.” Ang pandiwang Hebreo ay nangangahulugang “kumapit” at nagpapahiwatig dito ng matibay na katapatan sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: Kumapit siya nang mahigpit
  rationale: Ang דבק ay nagpapahayag ng matibay na pagkakapit at katapatan; pinananatili ng parirala ang matingkad na larawan at ang puwersang may kaugnayan sa tipan.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ipinakikita ng pang-ukol ang tuwirang pagkakapit kay Yahweh, at pinananatili ang personal na pangalang יְהוָה.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: hindi siya tumalikod sa pagsunod sa kanya
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng hindi paglihis o pagtalikod sa pagsunod.
- source_word: וַיִּשְׁמֹר מִצְוֺתָיו
  choice: Sinunod niya ang mga utos
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay nangangahulugang sundin o tuparin; ang 'sinunod' ay malinaw at natural sa karaniwang mambabasa.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: na ibinigay ni Yahweh kay Moises
  rationale: Ang 'ibinigay ... kay Moises' ay natural na pagpapahayag sa Tagalog ng mga utos na iniatas ni Yahweh kay Moises, nang hindi binabago ang pinagmulan at tagatanggap.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang pangtipan at sinusunod ang ibinigay na patakaran.
- issue: Lakas ng pandiwang דבק
  choice: Kumapit siya nang mahigpit
  alternative: Nanatili siyang tapat
  rationale: Pinananatili ng napiling salin ang kongkretong talinghaga at ipinahihiwatig na matibay na katapatan nang hindi ginagawang tahasang abstraktong paliwanag ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang 'mga utos' sa halip na mas teknikal na 'mga kautusan,' habang pinanatili ang bigat ng kontekstong pangtipan.
