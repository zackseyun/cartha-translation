base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: tl
  text: Nagtiwala siya kay Yahweh,[a] ang Diyos ng Israel. Pagkatapos niya, walang naging katulad niya sa lahat ng hari ng Juda, maging sa mga nauna sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit ng personal na pangalang יהוה (YHWH), na isinalin dito bilang “Yahweh.”
    reason: divine_name
lexical_decisions:
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang בְּ ay tumutukoy sa pinag-uukulan ng pagtitiwala. Sa natural na Tagalog, ang pagtitiwala sa isang persona ay karaniwang ipinapahayag sa pamamagitan ng “kay.” Pinanatili ang pangalang Yahweh para sa יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Ang construct chain ay tuwirang tumutukoy kay Yahweh bilang Diyos ng Israel; ang “ang” ay natural na panandang appositional sa Tagalog.
- source_word: בָּטָח
  choice: Nagtiwala siya
  rationale: Ang Qal perfect ng בטח ay nangangahulugang magtiwala o umasa. Ang “nagtiwala” ay payak, kasalukuyang gamit, at pinananatili ang aktibong pandiwang diwa.
- source_word: וְאַחֲרָיו לֹא הָיָה כָמֹהוּ
  choice: maging sa mga sumunod sa kanya ... walang naging katulad niya
  rationale: Ang temporal na אַחֲרָיו ay tumutukoy sa mga hari pagkaraan niya. Isinama ito sa saklaw ng paghahambing upang maging malinaw at natural sa Tagalog.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: Sa lahat ng mga hari ng Juda
  rationale: Ang בְּ sa pangkat na pinaghahambingan ay natural na isinasalin bilang “sa lahat ng,” na nagsasaad ng saklaw ng paghahambing.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: o sa mga nauna sa kanya
  rationale: Ang relative clause ay nagpapalawak ng paghahambing sa mga haring nauna sa kanya. Ang “mga nauna sa kanya” ay malinaw at idiomatiko.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit mismo ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Saklaw ng pahayag na walang katulad si Hezekias
  choice: Nililimitahan sa mga hari ng Juda, kapuwa sumunod at nauna sa kanya
  alternative: Ganap na pahayag na walang sinumang katulad niya
  rationale: Malinaw na itinatakda ng בְּכֹל מַלְכֵי יְהוּדָה ang pangkat na pinaghahambingan. Hindi pinalawak ang pahayag lampas sa mga hari ng Juda.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kay Yahweh” dahil ito ang likas na anyo sa Tagalog para sa personal na pinag-uukulan ng pagtitiwala. Inayos ang pagkakasunod ng mga parirala upang luminaw na kabilang sa paghahambing ang mga haring sumunod at nauna kay Hezekias, nang hindi binabago ang saklaw ng Hebreo.
