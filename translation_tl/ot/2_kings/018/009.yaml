revisions:
- from: Nang ikaapat na taon ng paghahari ni Haring Ezequias—na siyang ikapitong taon ng paghahari ni Oseas na anak ni Ela, na hari ng Israel—sumalakay si Salmanasar na hari ng Asiria sa Samaria at kinubkob iyon.
  to: Noong ikaapat na taon ng paghahari ni Haring Ezequias—na siyang ikapitong taon ng paghahari ni Oseas na anak ni Ela, na hari ng Israel—lumusob si Salmanasar na hari ng Asiria laban sa Samaria at kinubkob ito.
  rationale: Pinalitan ang panimulang pang-abay upang maging mas natural sa modernong Tagalog at ang pandiwang militar upang maipakita ang kampanyang “laban sa” Samaria nang hindi ipinipilit na agarang pagsalakay ang tinutukoy. Walang talababa ang kailangan, sapagkat walang natitirang mahalagang kalabuan na dapat ilantad sa talata.
