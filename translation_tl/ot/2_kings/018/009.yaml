  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: tl
  text: Noong ikaapat na taon ng paghahari ni Haring Ezequias—na siyang ikapitong taon ng paghahari ni Oseas na anak ni Ela, na hari ng Israel—lumusob si Salmanasar na hari ng Asiria laban sa Samaria at kinubkob ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang karaniwang panimulang pormula sa salaysay ay likas na isinama sa sugnay na panahunan; iniiwasan nito ang matigas na “At nangyari” habang pinananatili ang pagpasok sa isang makasaysayang pangyayari.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ikaapat na taon ng paghahari ni Haring Ezequias
  rationale: Ipinahihiwatig ng Hebreong pormula ang taon ng paghahari. Ang pagdaragdag ng “paghahari” ay malinaw at natural sa modernong Tagalog.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית
  choice: na siyang ikapitong taon
  rationale: Pinananatili ng “na siyang” ang resumptibong pag-uugnay ng dalawang magkatugmang petsa ng paghahari.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: ng paghahari ni Oseas na anak ni Ela, na hari ng Israel
  rationale: Malinaw na ipinapakita ang regnal dating at ang katungkulan ni Oseas nang hindi nagkakaroon ng kalituhan kung sino ang hari ng Israel.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: sumalakay ... sa Samaria
  rationale: Sa kontekstong militar, ang עלה na may עַל ay tumutukoy sa pagpunta o pagmartsa laban sa isang lugar. Ang “sumalakay sa” ay maikli, malinaw, at natural sa Tagalog.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: si Salmanasar na hari ng Asiria
  rationale: Gumagamit ng mga pangalang karaniwang anyo sa tradisyong Tagalog at tuwirang pinananatili ang titulo at kaharian.
- source_word: וַיָּצַר עָלֶיהָ
  choice: at kinubkob iyon
  rationale: Ang pandiwa ay tiyak na nangangahulugang pagkubkob sa isang lungsod. Ang “iyon” ay malinaw na tumutukoy sa Samaria at natural sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad na angkop sa salaysay na pangkasaysayan. Ginamit ang “taon ng paghahari” upang gawing malinaw sa karaniwang mambabasa ang Hebreong pormula ng pagpepetsa. Walang kinakailangang talababa dahil walang mahalagang leksikal o teolohikal na kalabuan na kailangang ilantad sa talatang ito.
