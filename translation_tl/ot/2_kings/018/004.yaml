  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: tl
  text: Inalis niya ang mga lugar ng pagsamba sa matataas na pook, dinurog ang mga sagradong haligi, pinutol ang Ashera,[a] at pinagpira-piraso ang ahas na tanso na ginawa ni Moises, sapagkat hanggang sa mga araw na iyon ay nagsusunog ng insenso para rito ang mga anak ni Israel. Tinawag itong Nehustan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinutol ang poste ni Ashera” o “pinutol ang sagradong poste.”
    reason: lexical_alternative
  - marker: b
    text: Ang Nehustan ay malamang na paglalaro sa salitang Hebreo para sa “tanso” at maaaring mangahulugang gaya ng “isang piraso lamang ng tanso.”
    reason: cultural_note
  - marker: c
    text: O “Tinawag niya itong Nehustan.” Hindi tahasang tinutukoy ng Hebreo kung sino ang simuno.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר
  choice: inalis
  rationale: Likas at tuwirang salin ng pandiwang nangangahulugang alisin o iwaksi, at angkop sa konteksto ng reporma.
- source_word: הַבָּמוֹת
  choice: ang matataas na sambahan
  rationale: Ipinahahayag ang mga lokal na pook ng pagsamba, na madalas nasa mataas na lugar, nang hindi ipinapalagay na mga burol lamang ang mga ito.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: dinurog ang mga sagradong haligi
  rationale: Ipinakikita ng 'dinurog' ang marahas at ganap na pagsira; nililinaw ng 'sagrado' na mga bagay na pangkulto ang mga haligi o batong nakatayo.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: pinutol ang Ashera
  rationale: Pinananatili ang sinaunang katawagang panrelihiyon at ang pisikal na kilos ng pagputol, habang inilalagay sa talababa ang maaaring tumukoy sa poste o sagradong kahoy.
- source_word: כִתַּת
  choice: pinagpira-piraso
  rationale: Ipinahahayag ang masinsin at ganap na pagwasak, higit sa payak na 'binasag.'
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: ang ahas na tanso
  rationale: Natural sa modernong Tagalog at tapat sa pariralang tumutukoy sa ahas na yari sa tanso o bronse.
- source_word: מְקַטְּרִים לוֹ
  choice: nagsusunog ng insenso para rito
  rationale: Malinaw na inilalarawan ang gawaing pangkulto at itinutukoy ng 'rito' ang ahas na tanso.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang anyong pampamilya ng Hebreo sa isang pamilyar at dignified na pariralang Tagalog.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Tinatawag itong Nehustan
  rationale: Ang pasibong anyo ay natural sa Tagalog at hindi nagpapasiya kung si Hezekias o ang mga tao sa pangkalahatan ang nagbigay o gumamit ng pangalan.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרָה
  choice: Ashera
  alternative: poste ni Ashera; sagradong poste
  rationale: Maaaring tumukoy ang salita sa bagay na pangkulto na kaugnay ni Ashera. Dahil pinuputol ito sa talata, malinaw ang pisikal na aspekto, ngunit hindi dapat lubusang paliitin sa 'poste' ang posibleng saklaw ng termino sa pangunahing teksto.
- issue: Simuno ng וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Tinatawag itong Nehustan
  alternative: Tinawag niya itong Nehustan
  rationale: Hindi tahasang tinutukoy ng Hebreo ang simuno sa paraang kailangang gawing hayag sa Tagalog. Pinananatili ng pasibong salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'matataas na sambahan' upang maipahiwatig ang teknikal na kahulugan ng mga lokal na pook ng pagsamba; pinanatili ang 'Ashera' at 'Nehustan' bilang mga sinaunang katawagang pantangi. Inayos ang pagkakasunod ng mga marker bilang [a], [b], [c], at lahat ay lumilitaw sa pangunahing teksto.
