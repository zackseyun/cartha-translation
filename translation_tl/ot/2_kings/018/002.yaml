base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: tl
  text: Dalawampu’t limang taong gulang siya nang magsimula siyang maghari, at dalawampu’t siyam na taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay si Abi, anak ni Zacarias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu’t limang taon siya
  rationale: Karaniwang Hebreong idyoma ito para sa edad. Ang likas na katumbas sa makabagong Tagalog ay “dalawampu’t limang taon siya,” sa halip na ang literal ngunit di-likas na “anak ng dalawampu’t limang taon.”
- source_word: הָיָה בְמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahihiwatig ng konstruksiyon ang edad niya sa pagsisimula ng paghahari; malinaw at likas itong naipapahayag sa Tagalog sa ganitong paraan.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ng pandiwa ang aktuwal na paghahari, hindi lamang ang pagkakaroon ng titulong hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Payak na lokatibong parirala na tumutukoy sa luklukan ng kanyang paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili nito ang pormal na pormulang Hebreo habang natural at malinaw sa modernong Tagalog.
- source_word: אֲבִי
  choice: Abi
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang anyo nito; hindi ito isinasalin bilang kahulugan ng pangalan.
- source_word: בַּת זְכַרְיָה
  choice: na anak ni Zacarias
  rationale: Malinaw na ipinahahayag ng pariralang construct ang kaugnayang magulang-anak. Ginamit ang nakaugaliang Tagalog na anyong “Zacarias.”
