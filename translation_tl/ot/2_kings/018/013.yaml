  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: tl
  text: Noong ikalabing-apat na taon ng paghahari ni Haring Hezekias, lumusob si Senakerib na hari ng Asiria laban sa lahat ng pinatibay na lungsod ng Juda at sinakop ang mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: Nang ikalabing-apat na taon ng paghahari ni Haring Hezekias
  rationale: Ang parirala ay pormula ng taon ng paghahari. Idinagdag ang “ng paghahari” upang maging malinaw at natural sa modernong Tagalog ang ugnayan ng taon kay Hezekias; hindi na hiwalay na isinalin ang panimulang waw dahil sapat na ang temporal na “Nang” sa daloy ng salaysay.
- source_word: עָלָה ... עַל
  choice: sinalakay
  rationale: Sa kontekstong militar, ang literal na “umakyat laban sa” ay tumutukoy sa pagsulong o paglusob laban sa mga lungsod. Ang “sinalakay” ay malinaw at likas sa Tagalog.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: ni Senakerib na hari ng Asiria
  rationale: Pinanatili ang pangalan at ang appositional na pagkakakilanlan ng hari. Ginamit ang mga anyong “Senakerib” at “Asiria,” na madaling basahin sa Tagalog.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: ang lahat ng napapaderang lungsod ng Juda
  rationale: Ang הַבְּצֻרוֹת ay mga lungsod na pinatibay para sa depensa. Ang “napapaderang lungsod” ay natural at konkretong pagpapahayag sa Tagalog.
- source_word: וַיִּתְפְּשֵׂם
  choice: at sinakop ang mga iyon
  rationale: Ang pandiwa ay nagsasaad ng pagkuha ng mga lungsod sa digmaan. Nililinaw ng “ang mga iyon” na ang tinutukoy ay ang mga lungsod.
