  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: tl
  text: Ngayon, umakyat ba ako laban sa lugar na ito upang wasakin ito nang walang kinalaman si Yahweh?[a] Sinabi sa akin ni Yahweh, ‘Umakyat ka laban sa lupaing ito at wasakin mo ito.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nang walang pahintulot ni Yahweh?” o “nang hiwalay kay Yahweh?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: nang hindi mula kay
  rationale: Pinananatili nito ang retorikal na tanong at ang diwang hindi kumikilos ang nagsasalita nang hiwalay o walang pahintulot mula kay Yahweh. Nililinaw ng talababa ang iba pang likas na pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipang pangalan na YHWH sa halip na palitan ito ng isang titulo.
- source_word: עָלִיתִי
  choice: umakyat ako
  rationale: Tapat sa karaniwang kahulugan ng עלה at angkop sa paglusob sa Jerusalem nang hindi labis na tinutukoy ang paraan ng pagkilos ng hukbo.
- source_word: הַמָּקוֹם הַזֶּה
  choice: lugar na ito
  rationale: Pinananatili ang pangkalahatang מָקוֹם at hindi ito tahasang pinapalitan ng Jerusalem o lungsod.
- source_word: לְהַשְׁחִיתוֹ
  choice: upang wasakin ito
  rationale: Tuwirang ipinapahayag ang layunin ng Hiphil ng שׁחת at pinananatili ang panghalip na tumutukoy sa lugar.
- source_word: אָמַר אֵלַי
  choice: Sinabi sa akin
  rationale: Natural at tuwirang salin ng pormula ng pagsasalita.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang pautos na anyo at ang leksikal na ugnayan nito sa naunang עָלִיתִי.
- source_word: הָאָרֶץ הַזֹּאת
  choice: lupaing ito
  rationale: Ipinag-iiba ang אֶרֶץ sa naunang מָקוֹם at hindi ito pinakikitid sa lungsod o tahasang tinutukoy bilang Juda.
- source_word: וְהַשְׁחִיתָהּ
  choice: at wasakin mo ito
  rationale: Pinananatili ang pag-uulit ng ugat na שׁחת at ang pambabaeng hulapi na tumutukoy sa lupain.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang natatanging tipang pangalan sa halip na palitan ito ng titulo.
- issue: Kung tutukuyin bilang Jerusalem o Juda ang “lugar na ito” at “lupaing ito”
  choice: Panatilihin ang “lugar na ito” at “lupaing ito”
  alternative: Jerusalem; lungsod na ito; Juda
  rationale: Magkaibang pangngalan ang מָקוֹם at אֶרֶץ. Ang pagpapanatili sa dalawa ay umiiwas sa pagpapakitid ng kahulugan nang higit sa malinaw na sinasabi ng teksto.
- issue: Lakas ng pahayag na הֲמִבַּלְעֲדֵי יְהוָה
  choice: Retorikal na tanong na “nang hindi mula kay Yahweh?”
  alternative: “nang walang pahintulot ni Yahweh?”; “nang hiwalay kay Yahweh?”
  rationale: Hindi tahasang tinutukoy ng parirala kung pahintulot, utos, o kalayaang kumilos ang pangunahing diin. Pinananatili ng salin at talababa ang saklaw ng pag-aangkin ng nagsasalita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “umakyat” upang mapanatili ang pag-uulit ng Hebreong עלה, at “lupain” upang malinaw na maiba sa “lugar.”
