  naturalness: Natural, malinaw, at angkop ang rehistro sa modernong Filipino Tagalog. Ang “nanatiling tahimik,” “sapagkat,” at “Huwag ninyo siyang sagutin” ay maayos na daloy at marangal nang hindi lipas sa gamit.
  terminology: Ang “mga tao,” “hari,” “iniutos,” at “sagutin” ay wasto at magkakatugma. Ang pag-uulit ng “sumagot/sagutin” ay kapaki-pakinabang dahil sinasalamin nito ang pag-uulit ng parehong ugat ng pandiwa sa Hebreo.
