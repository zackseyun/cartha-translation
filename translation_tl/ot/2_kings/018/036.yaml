base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: tl
  text: Ngunit nanatiling tahimik ang mga tao at hindi man lamang sumagot sa kanya[a], sapagkat iniutos ng hari, “Huwag ninyo siyang sagutin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “hindi sumagot sa kanya ng isang salita,” isang idyomang nangangahulugang wala silang anumang isinagot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: nanatiling tahimik
  rationale: Ang Hiphil ng חרשׁ sa kontekstong ito ay tumutukoy sa pananatiling tahimik o hindi pagsasalita; malinaw at natural ito sa modernong Tagalog.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Karaniwang kahulugan ng עַם ang bayan o mga tao; dito, tinutukoy nito ang mga taong nakikinig sa pader nang hindi dinaragdagan ang detalye ng teksto.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: at hindi man lamang sumagot sa kanya
  rationale: Literal na ‘hindi sumagot sa kanya ng isang salita’; ang ‘hindi man lamang sumagot’ ay natural na Tagalog na nagpapahayag na wala silang anumang tugon, habang ipinaliliwanag sa talababa ang Hebreong idyoma.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan ng pananahimik ng mga tao; ang ‘sapagkat’ ay malinaw at marangal na panandang sanhi.
- source_word: מִצְוַת הַמֶּלֶךְ הִיא לֵאמֹר
  choice: iniutos ng hari
  rationale: Ang literal na estrukturang ‘ang utos ng hari ay, na sinasabi’ ay likas na naipahahayag sa Tagalog bilang ‘iniutos ng hari’ bago ang tuwirang sipi.
- source_word: לֹא תַעֲנֻהוּ
  choice: Huwag ninyo siyang sagutin
  rationale: Ang pandiwa ay ikalawang panauhang panlalaking maramihan na may pagbabawal; ipinakikita ng ‘ninyo’ na ang utos ay para sa buong pangkat at pinananatili ang pag-uulit ng ugat na ענה.
