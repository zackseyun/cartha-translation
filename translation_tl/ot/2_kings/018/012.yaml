  source_fidelity: Tumpak na naihahatid ng draft ang sanhi, ang idyomang Hebreo na “makinig sa tinig,” ang paglabag sa tipan, ang saklaw na “lahat ng iniutos,” at ang inuulit na pagtanggi sa hulihan. Gayunman, ang tuldok matapos ang “Yahweh” ay naghihiwalay sa appositional na “ang lahat ng iniutos...” at nagiging putol na parirala ito.
  naturalness: Marangal at modernong Filipino ang bokabularyo. Mas malinaw at likas ang paglalagay ng “ang lahat ng iniutos...” sa loob ng magkapares na gitling, at ang “ni ginawa man nila iyon” ay natural na katumbas ng huling magkatimbang na pagtanggi.
  terminology: Ang “Yahweh,” “tipan,” at “lingkod” ay angkop at pare-pareho sa mga desisyong pangterminolohiya. Napananatili ng “pinakinggan ang tinig” ang konkretong Hebreong idyoma nang hindi sapilitang ginagawang “sumunod.”
