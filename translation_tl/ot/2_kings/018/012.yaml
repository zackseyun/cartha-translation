base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: tl
  text: sapagkat hindi nila pinakinggan ang tinig ni Yahweh na kanilang Diyos[a], kundi nilabag nila ang kanyang tipan[b]—ang lahat ng iniutos ni Moises, na lingkod ni Yahweh—at hindi sila nakinig ni ginawa man nila iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nila sinunod si Yahweh na kanilang Diyos.” Ang idyomang Hebreo na “pakinggan ang tinig” ay madalas na nagpapahiwatig ng pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinuway nila ang kanyang tipan.”
    reason: lexical_alternative
  - marker: c
    text: Inuulit sa Hebreo ang “hindi nakinig” upang idiin ang patuloy nilang pagtangging makinig at tumupad, hindi lamang ang isang pagkakataon ng pagsuway.
    reason: cultural_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: sapagkat
  rationale: Likas na ipinakikita ang sanhi ng sinapit na pagkatapon na binanggit sa naunang talata.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: pinakinggan ang tinig ni
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang saklaw nitong kapwa pakikinig at pagsunod, nang hindi nilulutas ang dalawang diwa sa iisang tahasang kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַבְרוּ אֶת־בְּרִיתוֹ
  choice: nilabag nila ang kanyang tipan
  rationale: Sa konteksto ng tipan, ang עבר ay tumutukoy sa paglabag dito; malinaw at likas sa Filipino ang “nilabag.”
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: ang lahat ng iniutos
  rationale: Pinananatili ang kabuuang saklaw ng utos at ang ugnayang paliwanag nito sa tipan.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Moises na lingkod ni Yahweh
  rationale: Ang “lingkod” ay angkop sa marangal at opisyal na titulong עֶבֶד dito.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Hindi sila nakinig at hindi nila ito ginawa
  rationale: Pinananatili ang pag-uulit at magkatimbang na mga pagtanggi sa Hebreo; ang “ito” ay tumutukoy nang kolektibo sa lahat ng iniutos.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh sa halip na palitan ng titulo.
- issue: Kung gagawing tahasan ang pagsunod sa שׁמע בקול
  choice: pinakinggan ang tinig ni / nakinig
  alternative: sinunod / sumunod
  rationale: Kalakip ng idyoma ang pagsunod, ngunit pinananatili ng salin ang larawang “pakikinig” at ang retorikal na pag-uulit ng Hebreo, habang ipinapaliwanag sa talababa ang pahiwatig nito.
- issue: Ugnayan ng “ang lahat ng iniutos” sa “tipan”
  choice: panatilihin bilang paliwanag na kasunod ng tipan
  alternative: gawing hiwalay na tuwirang layon ng “nilabag” o ipasok ang “sa pamamagitan ng pagsuway”
  rationale: Malapit sa anyo ng Hebreo ang appositional na pagkakasunod at hindi nito pinipilit ang isang sintaktikong paliwanag na higit sa hayag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang personal na pangalang Yahweh, ang konkretong idyoma ng pakikinig sa tinig, at ang pag-uulit sa hulihan. Ginamit ang gitling na pahaba upang malinaw na ipakilalang ang “lahat ng iniutos” ay nagpapaliwanag sa tipan nang hindi lubusang nilulutas ang posibleng sintaktikong tensiyon.
