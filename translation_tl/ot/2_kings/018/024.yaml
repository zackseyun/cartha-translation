  to: Kaya paano mo maitataboy kahit ang isa sa mga pinunong kabilang sa pinakamababang mga lingkod ng aking panginoon[a], gayong umaasa ka sa Ehipto para sa mga karwahe at mga mangangabayo?
  rationale: Binago lamang ang pagkakaayos ng parirala upang malinaw na ang isang pinuno ay kabilang sa pinakamababang hanay ng mga lingkod ng panginoon ng nagsasalita, hindi pinuno nila. Pinanatili ang diwa, rehistro, terminolohiya, at talababa ng draft.
