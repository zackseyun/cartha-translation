  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: tl
  text: Kaya paano mo maitataboy kahit ang isa sa mga pinunong kabilang sa pinakamababang mga lingkod ng aking panginoon[a], gayong umaasa ka sa Ehipto para sa mga karwahe at mga mangangabayo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinuno” ay maaari ring isaling “gobernador,” “opisyal,” o “kumandante”; maaaring tumukoy ang salitang Hebreo sa isang tagapamahala ng lalawigan o pinunong militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: maitataboy
  rationale: Ang Hiphil ng שוב kasama ng אֵת פְּנֵי ay idyomang nangangahulugang paurungin, labanan, o itaboy ang isang kalaban. Natural sa makabagong Tagalog ang “maitataboy” at malinaw ang diwang militar.
- source_word: פַחַת
  choice: pinuno
  rationale: Maaaring tumukoy ang salita sa gobernador, opisyal, o pinunong militar. Pinananatili ng “pinuno” ang lawak ng katawagan habang ang konteksto ang nagpapahiwatig ng tungkuling militar.
- source_word: אַחַד
  choice: kahit isang
  rationale: Sa mapanuyang tanong, idinidiin nito na hindi nila kayang harapin maging ang isa lamang sa mga nakabababang opisyal.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: sa pinakamababang mga lingkod ng aking panginoon
  rationale: Ang הַקְּטַנִּים ay tumutukoy sa mababang ranggo o kahalagahan, hindi sa pisikal na laki. Ang “aking panginoon” ay tumutukoy sa nakatataas ng nagsasalita, hindi isang titulong para sa Diyos.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: gayong umaasa ka sa Ehipto
  rationale: Ang בטח על ay nangangahulugang magtiwala o umasa sa isang kakampi. Ang “gayong” ay natural na naghahayag ng batayan ng mapanuyang tanong.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: para sa mga karwahe at mga mangangabayo
  rationale: Tumutukoy ito sa mga kagamitang pandigma at hukbong nakakabayo na inaasahang ibibigay ng Ehipto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Isinalin ayon sa diwa ang idyomang Hebreo na literal na “ibalik ang mukha,” sapagkat hindi natural at maaaring malabo ang literal na anyo sa Tagalog; pinanatili sa talababa ang tunay na lawak ng פַחַת.
