base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: tl
  text: 'Kaya ngayon, makipagpustahan ka[a] sa aking panginoon, ang hari ng Asiria: bibigyan kita ng dalawang libong kabayo, kung makapaglalaan ka ng mga mangangabayo para sa mga iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makipagkasundo ka” o “tumaya ka.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpasok sa isang kasunduan o sa pagtataya ng sarili, ngunit dito ay malamang na isang mapanuyang pustahan o hamon ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: makipagpustahan ka
  rationale: 'Sa mapanuyang hamon ng sugo ng Asiria, ang pandiwa ay higit sa isang payak na pakikipagkasundo: ipinahihiwatig nito ang pagtaya o paghamon. Likas sa modernong Tagalog ang “makipagpustahan,” habang inilalagay sa talababa ang ibang tunay na posibilidad.'
- source_word: אֶת אֲדֹנִי
  choice: sa aking panginoon
  rationale: Ang אֶת kasunod ng pandiwa ay may diwang “sa/kasama,” at ang אֲדֹנִי ay tumutukoy sa nakatataas sa nagsasalita, hindi sa Diyos. Ang “aking panginoon” ay angkop sa marangal at makasaysayang rehistro.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Tuwirang salin ng pariralang construct at malinaw sa karaniwang mambabasa.
- source_word: וְאֶתְּנָה לְךָ
  choice: bibigyan kita
  rationale: Ipinapahayag ang alok na kasunod ng hamon. Ang anyong ito ay natural sa Tagalog at pinananatili ang unang panauhang pangako.
- source_word: אַלְפַּיִם סוּסִים
  choice: dalawang libong kabayo
  rationale: Tuwirang katumbas ng bilang at pangngalan.
- source_word: אִם תּוּכַל
  choice: kung makapaglalaan ka
  rationale: Pinananatili ng “kung” ang kondisyong may mapanuyang pagdududa sa kakayahan ng kausap.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: makapaglalaan ka ng mga mangangabayo para sa mga iyon
  rationale: Ang literal na diwa ay magbigay o maglagay para sa sarili ng mga sasakay sa mga kabayo. Ang “maglaan” ay malinaw at natural, at ang “mga mangangabayo” ay angkop sa kontekstong militar.
