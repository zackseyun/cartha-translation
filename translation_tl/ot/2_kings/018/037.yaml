  terminology: Ang “tagapangasiwa ng sambahayan ng hari,” “kalihim,” at “tagapagtala” ay angkop na modernong katumbas ng mga titulong panghukuman. Sa talababa, pinalitan ang di-likas na “punong katiwala ng kopa” ng mas malinaw na “punong tagapagdala ng saro.”
