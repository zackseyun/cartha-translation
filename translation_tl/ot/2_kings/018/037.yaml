base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: tl
  text: Pagkatapos, dumating kay Hezekias sina Eliakim na anak ni Hilkias, na tagapangasiwa ng sambahayan ng hari, Sebna na kalihim, at Joah na anak ni Asaf, na tagapagtala, na punit ang kanilang mga damit. Isinalaysay nila sa kanya ang mga salita ng Rabshakeh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Rabshakeh” ay isang titulong Asiryano para sa isang mataas na opisyal, marahil ay tumutukoy sa isang punong tagapagdala ng saro o tagapagsalita.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumunta ... sina
  rationale: Ipinahihiwatig ng waw-consecutive ang pagpapatuloy ng salaysay. Bagaman isahan ang pandiwang Hebreo bago ang tambalang simuno, likas sa Filipino ang maramihang panandang “sina” para sa buong pangkat.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: na tagapangasiwa ng sambahayan ng hari
  rationale: Isa itong opisyal na titulong tumutukoy sa nangangasiwa sa sambahayan o administrasyon ng palasyo. Nililinaw ng “ng hari” ang konteksto nang hindi ito pinapakahulugan lamang bilang gusali.
- source_word: הַסֹּפֵר
  choice: kalihim
  rationale: Sa konteksto ng korte, ang salita ay tumutukoy sa opisyal na eskriba o sekretaryo. Mas malinaw sa karaniwang modernong Filipino ang “kalihim” kaysa “eskriba.”
- source_word: הַמַּזְכִּיר
  choice: tagapagtala
  rationale: Pinananatili nito ang tungkuling administratibo ng opisyal na nag-iingat o naghahanda ng mga tala, nang hindi ipinapalagay na isa lamang siyang mananalaysay.
- source_word: קְרוּעֵי בְגָדִים
  choice: Punit ang kanilang mga damit
  rationale: Tuwirang inilalarawan ang kanilang kalagayan at pinananatili ang konkretong tanda ng matinding dalamhati o pagkabagabag.
- source_word: וַיַּגִּדוּ לוֹ
  choice: at sinabi nila sa kanya
  rationale: Likas at malinaw na Filipino para sa paghahatid ng iniulat na pananalita; hindi na kailangang dagdagan ng mas teknikal na “iniulat.”
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Malapit ito sa anyo ng Hebreo at angkop dahil mismong pananalita ang inihahatid nila kay Hezekias.
- source_word: רַב שָׁקֵה
  choice: Rabshakeh
  rationale: Pinananatili ang transliterasyon ng titulong Asirio upang hindi labis na paliitin sa isang di-tiyak na katumbas na tungkulin; ipinaliliwanag ito sa talababa.
