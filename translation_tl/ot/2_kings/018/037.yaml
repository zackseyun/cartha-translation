translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga katawagang pang-administrasyon na malinaw sa kasalukuyang mambabasa. Inilipat ang talababa sa “Rabshakeh,” sapagkat iyon ang salitang ipinaliliwanag ng nota; ang pagkakalagay nito matapos ang “Hilkiah” sa consultation layer ay maliwanag na hindi tugma sa nilalaman.
