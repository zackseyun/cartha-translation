  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: tl
  text: Tinawag nila ang hari, at lumabas upang humarap sa kanila si Eliakim na anak ni Hilkias, ang tagapangasiwa ng sambahayan[a], kasama sina Sebna na kalihim[b] at Joa na anak ni Asaf, ang tagapagtala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang namamahala sa bahay”; isa itong titulong administratibo na maaaring tumukoy sa sambahayan o palasyo ng hari.
    reason: cultural_note
  - marker: b
    text: O “eskriba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Tinawag nila ang hari
  rationale: Ang קרא na may אֶל ay maaaring mangahulugang tumawag sa isang tao o ipatawag siya. Ang tuwirang Tagalog na “tinawag nila ang hari” ay natural at hindi labis na nagpapahiwatig ng isang pormal na utos.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: lumabas upang humarap sa kanila
  rationale: Ipinahihiwatig ng יצא אל na lumabas si Eliakim patungo sa delegasyon. Ang “upang humarap sa kanila” ay natural sa kontekstong diplomatiko nang hindi dinaragdagan ang nilalaman ng pakikipag-usap.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eliakim na anak ni Hilkias
  rationale: Isinalin nang tuwiran ang patronimiko at ginamit ang karaniwang anyong Filipino ng mga pangalan.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: ang tagapangasiwa ng palasyo
  rationale: Isa itong mataas na titulong administratibo. Sa kontekstong maharlika, malinaw na ipinahahayag ng “tagapangasiwa ng palasyo” ang tungkuling mamahala sa sambahayan o palasyo ng hari.
- source_word: הַסֹּפֵר
  choice: kalihim
  rationale: Tumutukoy ang סֹפֵר dito sa isang opisyal ng hari na may tungkuling pansulat o administratibo. Mas natural sa modernong Filipino ang “kalihim,” habang itinatala sa talababa ang mas literal na “eskriba.”
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: at Joa na anak ni Asaf
  rationale: Pinanatili ang pangalan at tuwirang isinalin ang patronimiko.
- source_word: הַמַּזְכִּיר
  choice: ang tagapagtala
  rationale: Ang salita ay tumutukoy sa isang opisyal na nangangasiwa sa mga tala o memorandum ng kaharian. Ang “tagapagtala” ay malinaw at hindi arkaiko.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang ayos ng mga opisyal at ang pagkakaiba ng “kalihim” at “tagapagtala,” habang ipinaliwanag sa talababa ang saklaw ng titulong administratibo ni Eliakim.
