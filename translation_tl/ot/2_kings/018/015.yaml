  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: tl
  text: At ibinigay ni Ezequias ang lahat ng pilak[a] na natagpuan sa bahay ni Yahweh[b] at sa mga kabang-yaman ng bahay ng hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salapi”; literal na “pilak.”
    reason: lexical_alternative
  - marker: b
    text: O “templo ni Yahweh”; literal na “bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: O “palasyo ng hari”; literal na “bahay ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang inilalarawan ng נתן ang pagbibigay o pag-aabot; pinananatili ng “ibinigay” ang lawak ng kahulugan nang hindi labis na tinutukoy na pormal na pagbabayad.
- source_word: חִזְקִיָּה
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong saling Tagalog.
- source_word: כָּל הַכֶּסֶף
  choice: lahat ng pilak
  rationale: Pinananatili ang komprehensibong כָּל at ang kongkretong kahulugan ng כֶּסֶף bilang pilak, bagaman maaari rin itong tumukoy sa salapi.
- source_word: הַנִּמְצָא
  choice: na natagpuan
  rationale: Tuwirang pinananatili ang pasibo o resultang diwa ng Niphal participle ng מצא.
- source_word: בֵית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na metaporang “bahay” at ang personal na banal na pangalang Yahweh; sa konteksto, ito ang templo.
- source_word: וּבְאֹצְרוֹת
  choice: at sa mga kabang-yaman
  rationale: Ang אֹצָר ay kabang-yaman o imbakan; “mga kabang-yaman” ang pinakaangkop sa kayamanang pilak na tinutukoy.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili ang literal na parirala at ang pagkakapantay ng anyo nito sa “bahay ni Yahweh,” bagaman tumutukoy ito sa palasyo.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong “pilak” at ang magkatimbang na mga pariralang “bahay ni Yahweh” at “bahay ng hari,” habang inilagay sa talababa ang mas kontekstuwal na mga katumbas.
