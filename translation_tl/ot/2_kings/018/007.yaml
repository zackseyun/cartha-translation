base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: tl
  text: At si Yahweh ay kasama niya. Saanman siya magtungo[a], nagtagumpay siya. Naghimagsik siya laban sa hari ng Asiria at hindi siya naglingkod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng kanyang ginagawa, nagtatagumpay siya” o “kumilos siya nang may karunungan sa lahat ng kanyang ginawa.” Ang pandiwang Hebreo ay maaaring magpahiwatig kapwa ng matalinong pagkilos at ng tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: וְהָיָה ... עִמּוֹ
  choice: kasama niya
  rationale: Likas na katumbas sa Tagalog ng idyomang nagsasaad ng patuloy na presensya at pagsang-ayon ng Diyos.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: saanman siya magtungo
  rationale: Natural na Tagalog para sa literal na larawang ‘sa lahat ng kanyang paglabas,’ na maaaring tumukoy sa mga lakad, gawain, o kampanya ng hari.
- source_word: יַשְׂכִּיל
  choice: nagtatagumpay siya
  rationale: Sa kontekstong maharlika, malinaw na ipinahahayag ang bunga ng matalinong pagkilos, habang inilalagay sa talababa ang saklaw na karunungan at tagumpay.
- source_word: וַיִּמְרֹד
  choice: naghimagsik siya
  rationale: Angkop na salitang pampolitika para sa pag-aaklas laban sa kapangyarihan ng isang imperyo.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: laban sa hari ng Asiria
  rationale: Tuwiran at natural na salin ng layon ng paghihimagsik.
- source_word: וְלֹא עֲבָדוֹ
  choice: hindi na naglingkod dito
  rationale: Pinananatili ang larawan ng paglilingkod, ngunit ipinahihiwatig ng ‘na’ ang pagtigil sa dating pagpapasakop bilang nasasakupang hari; ang ‘dito’ ay malinaw na tumutukoy sa hari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ito sa halip na palitan ng isang titulo.
- issue: Ugnayan ng presensya ni Yahweh at tagumpay ni Hezekias
  choice: Pinananatiling magkasunod ngunit hindi dinaragdagan ng tahasang sanhi
  alternative: Kaya nagtagumpay siya saanman siya magtungo
  rationale: Ipinapahiwatig ng konteksto ang ugnayan, ngunit ang Hebreo ay hindi gumagamit ng tahasang pang-ugnay na ‘kaya’; iniiwasang gawing mas tiyak kaysa sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Asiria,’ ang karaniwang anyong Filipino. Pinili ang ‘dito’ para sa haring nabanggit upang maiwasan ang bahagyang kalabuan ng sunod-sunod na ‘siya,’ habang pinananatili ang politikal na diwa ng paglilingkod bilang pagpapasakop.
