revisions:
- from: Pagkatapos, tumayo ang Rabsake at sumigaw nang malakas sa wikang Judeano[a]. Nagsalita siya at sinabi, “Pakinggan ninyo ang salita ng dakilang hari, ang hari ng Asiria.”
  to: Pagkatapos, tumayo ang Rabsake at tumawag nang malakas sa wika ng Juda[a]. Nagsalita siya at sinabi, “Pakinggan ninyo ang salita ng dakilang hari, ang hari ng Asiria.”
  rationale: Pinalitan ang hindi likas na “wikang Judeano” ng “wika ng Juda,” na tuwirang ipinahahayag ang historikal na espesipikasyon ng orihinal. Ginawang “tumawag nang malakas” ang pandiwang pampublikong pagpapahayag nang hindi nagdaragdag ng emosyonal na puwersa, at nilinaw ang talababa.
