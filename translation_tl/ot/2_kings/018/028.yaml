translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal at pampublikong himig ng proklamasyon, pati ang dobleng panimulang pandiwa sa pagsasalita. Ginamit ang baybay na “Asiria” at ang transliterasyong “Rabsake.”
