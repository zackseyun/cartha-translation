  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: tl
  text: Pagkatapos, tumayo ang Rabsake at tumawag nang malakas sa wika ng Juda[a]. Nagsalita siya at sinabi, “Pakinggan ninyo ang salita ng dakilang hari, ang hari ng Asiria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Hebreo.” Mas tiyak, ang terminong Hebreo sa orihinal na teksto ay tumutukoy sa wika ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Tuwirang inilalarawan ng pandiwa ang pagtayo ng tagapagsalita sa sunod-sunod na salaysay; hindi na dinagdagan ng pahiwatig na wala sa teksto.
- source_word: רַב שָׁקֵה
  choice: ang Rabsake
  rationale: Pinanatili bilang transliteradong titulong Asirio na ginagamit na pantukoy sa tauhan sa salaysay, sa halip na ipako sa isang pinagtatalunang katumbas na katungkulan.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: sumigaw nang malakas
  rationale: Natural na Filipino para sa hayagang pagtawag sa napakalakas na tinig; pinagsama ang pandiwa at pariralang naglalarawan sa lakas ng boses.
- source_word: יְהוּדִית
  choice: sa wikang Judeano
  rationale: Tumutukoy nang higit na tiyak sa wika o diyalekto ng Juda; iniingatan ang historikal na espesipikasyon sa halip na basta tawaging Hebreo.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Nagsalita siya at sinabi
  rationale: Pinanatili ang dobleng pambungad sa pagsasalita sa Hebreo, habang ginagawang malinaw at marangal sa Filipino.
- source_word: שִׁמְעוּ
  choice: Pakinggan ninyo
  rationale: Tuwirang maramihang pautos na natural sa modernong Filipino at angkop sa pormal na pahayag ng isang sugo.
- source_word: דְּבַר
  choice: ang salita
  rationale: Pinananatili ang konkretong at pormal na salitang ginagamit para sa opisyal na pahayag; ang 'mensahe' ay posible ngunit mas interpretatibo.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: ang dakilang hari
  rationale: Tuwirang katumbas at angkop sa maharlikang titulong Asirio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Malinaw at pormal na salin ng pariralang construct sa Hebreo.
