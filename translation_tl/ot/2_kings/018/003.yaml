  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh, ayon sa lahat ng ginawa ng kanyang amang si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ama” rito ay nangangahulugang ninuno niya sa linya ni David, hindi ang kanyang mismong ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay nagsasaad ng kasunod na kilos sa salaysay. Likas sa modernong Tagalog na hindi na isalin nang tahasan ang panimulang וַ bilang “at” dito.
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Ang pang-uring ישר na may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa bagay na matuwid o tama. Ang “ang tama” ay maikli, natural, at malinaw na moral na pagtataya.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang malinaw na idyomang Hebreo para sa pagtataya mula sa pananaw ni Yahweh, at likas din itong pakinggan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Ipinahahayag ng כְּ kasama ng כֹּל at אֲשֶׁר ang pagsunod o pag-ayon sa isang huwaran. Malinaw at natural sa Tagalog ang “ayon sa lahat ng.”
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang perfect ay tumutukoy sa naunang mga ginawa ni David na naging huwaran. Sapat na sa Tagalog ang anyong “ginawa,” sapagkat malinaw na sa konteksto ang naunang panahon.
- source_word: דָּוִד אָבִיו
  choice: kanyang amang si David
  rationale: Pinananatili ng “ama” ang pormulang dinastiko at ang tuwirang ugnayan sa tekstong Hebreo. Ipinaliliwanag sa talababa na ninuno, hindi agarang magulang, ang tinutukoy rito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng “ama” sa pariralang tumutukoy kay David
  choice: Panatilihin sa pangunahing teksto ang “kanyang amang si David” at ipaliwanag sa talababa
  alternative: kanyang ninunong si David
  rationale: Ang “ama” ay nagpapanatili sa pormulang maharlika at sa ugnayang Davidiko ng orihinal, samantalang nililinaw ng talababa ang mas malawak na kahulugang genealogical nito.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang Hebreong idyomang “sa paningin ni Yahweh” dahil malinaw at natural ito sa Tagalog; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
