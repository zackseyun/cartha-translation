id: 2KI.9.14
reference: 2 Kings 9:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: tl
  text: Kaya nakipagsabwatan si Jehu na anak ni Jehosafat na anak ni Nimsi laban kay Joram. Noon ay nagbabantay[a] sa Ramot-Gilead si Joram at ang buong Israel[b] dahil kay Hazael, na hari ng Aram.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtatanggol sa Ramot-Gilead.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbabantay, pag-iingat, o pagtatanggol sa isang kalagayang militar.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang kaharian o mga puwersa ng Israel; literal na sinasabi ng teksto na “buong Israel.”
    reason: cultural_note
  - marker: c
    text: Tradisyonal na “Siria”; sa Hebreo, “Aram.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: nakipagsabwatan ... laban kay
  rationale: Ang hitpael ng קשר sa kontekstong pampolitika ay tumutukoy sa pakikibahagi sa isang sabwatan o paghihimagsik. Likas sa modernong Filipino ang “nakipagsabwatan laban kay” at malinaw nitong ipinakikita na si Joram ang puntirya.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: anak ni Jehosafat na anak ni Nimsi
  rationale: Pinananatili nito ang dalawang ulit na בֶּן at ang tiyak na talaangkanan, sa halip na gawing mas malawak na “inapo.”
- source_word: הָיָה שֹׁמֵר
  choice: Noon ay nagbabantay
  rationale: Ang qatal na הָיָה kasama ng participle ay nagbibigay ng nagpapatuloy na kalagayan sa nakaraang tagpo. Saklaw ng “nagbabantay” ang pagbabantay at pag-iingat sa isang kalagayang militar nang hindi labis na nililimitahan ang kahulugan sa “nagtatanggol.”
- source_word: בְּרָמֹת גִּלְעָד
  choice: sa Ramot-Gilead
  rationale: Ginamit ang kinikilalang anyong Filipino ng pangalan ng lugar at ang “sa” upang ipakitang doon nagaganap ang pagbabantay.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: si Joram at ang buong Israel
  rationale: Pinananatili ang literal na pambansang katawagang “buong Israel,” bagaman sa kontekstong militar malamang na tumutukoy ito sa mga hukbo o puwersa ng kaharian.
- source_word: מִפְּנֵי
  choice: dahil kay
  rationale: Ipinakikilala rito ng מִפְּנֵי si Hazael bilang dahilan o banta na nag-udyok sa pagbabantay. Natural at malinaw sa Filipino ang “dahil kay” nang hindi idinaragdag ang tahasang ideya ng takot.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang Hebreong katawagang etnoheograpiko na אֲרָם sa halip na gamitin sa pangunahing teksto ang tradisyonal ngunit mas huling pangalang “Siria.”
