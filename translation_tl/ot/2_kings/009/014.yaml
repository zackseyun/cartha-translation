translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang payak na ayos ng salaysay at ang Hebreong pambansang katawagang “buong Israel,” habang ipinaliwanag sa talababa ang malamang na kahulugang militar. Inilagay ang bawat pananda sa mismong salita o pariralang tinutukoy nito.
