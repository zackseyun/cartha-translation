translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyo ng mga utos at karaniwang bokabularyo. Pinanatili ang “mga kapatid” upang hindi burahin ang leksikal na anyo ng Hebreo, ngunit nilinaw sa talababa ang posibleng kahulugang “mga kasamahan.”
