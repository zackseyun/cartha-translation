  verdict: revise
  source_fidelity: 'Kailangang panatilihin ang magkakasunod na “anak ni” sa talaangkanan: ang Hebreo ay may “Jehu, anak ni Jehoshafat, anak ni Nimshi.” Bagaman maaaring lumaktaw ng salinlahi ang בן sa ilang talaangkanan, hindi ligtas na gawing “apo” ang ikalawang anyo rito nang walang pahiwatig sa pinagmulan. Ang natitirang pagsasalin ay tapat sa mga utos at sa idyomang tumutukoy sa isang pribadong panloob na silid.'
  naturalness: Natural at marangal ang ayos ng Tagalog. Ang “Lumapit ka” ay isang katanggap-tanggap na kontekstuwal na pagsasalin ng ikalawang utos na בוא, at ang “patayuin mo siya” ay malinaw. Bahagyang pinasimple ang talababa sa “mga kapatid” upang huwag magmungkahi nang labis ng isang tiyak na pangkat.
  terminology: Ang mga pangalan ay wastong naisalin sa anyong Jehu, Jehoshafat, at Nimshi. Pinanatili ang “mga kapatid” sa pangunahing teksto, samantalang ang talababa ay maingat na nagpapakita ng posibleng mas malawak na gamit. Ang “silid sa kaloob-looban” ay angkop para sa חֶדֶר בְּחָדֶר.
  issues:
