base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: tl
  text: Pagdating mo roon, hanapin mo si Jehu na anak ni Jehoshafat, anak ni Nimshi. Lumapit ka, patayuin mo siya mula sa gitna ng kanyang mga kapatid,[a] at dalhin mo siya sa isang silid sa kaloob-looban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaari ring tumukoy rito sa kanyang mga kasamahan.
    reason: Pinananatili ang literal na kahulugan ng אֶחָיו habang ipinakikita ang posibleng mas malawak na gamit nito sa konteksto.
  - marker: b
    text: Sa Hebreo, literal na “isang silid sa loob ng isang silid,” na tumutukoy sa isang pribadong silid sa kaloob-looban.
    reason: Ipinapakita ang literal na anyo ng idyomang חֶדֶר בְּחָדֶר at ang ipinahihiwatig nitong pagiging panloob at pribado.
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Pagdating mo roon
  rationale: Ang בוא ay maaaring mangahulugang pumaroon, pumunta, o dumating ayon sa pananaw. Likas sa Tagalog ang “pagdating mo roon” bilang panimulang tagubilin bago ang kasunod na mga utos.
- source_word: וּרְאֵה שָׁם
  choice: hanapin mo
  rationale: Bagaman literal na “tingnan mo roon,” ang ראה sa kontekstong ito ay utos na hanapin o kilalanin ang taong pinangalanan. Hindi na inulit ang “roon” sapagkat malinaw na ito sa unang sugnay at magiging pilit ang pag-uulit sa Tagalog.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Jehu na anak ni Jehoshafat at apo ni Nimshi
  rationale: Ang sunod-sunod na בן ay tumutukoy sa dalawang salinlahi. Ang “anak… at apo…” ay malinaw at likas sa modernong Tagalog habang pinananatili ang talaangkanan.
- source_word: וּבָאתָ
  choice: Lumapit ka
  rationale: Ang ikalawang בוא ay tumutukoy sa paglapit o pagpasok sa kinaroroonan ni Jehu. Ang “lumapit ka” ay natural at hindi nagdaragdag ng tiyak na pintuan o lugar na hindi tahasang binanggit.
- source_word: וַהֲקֵמֹתוֹ
  choice: patayuin mo siya
  rationale: Ang Hiphil ng קום ay “papangyarihing tumayo.” Tuwirang ipinahahayag ito ng “patayuin mo siya.”
- source_word: מִתּוֹךְ אֶחָיו
  choice: mula sa gitna ng kanyang mga kapatid
  rationale: Literal na “mga kapatid” ang אֶחָיו, ngunit maaari rin itong tumukoy sa mga kasamahan niya sa kontekstong militar. Pinanatili sa teksto ang anyong pinagmulan at inilagay sa talababa ang kontekstuwal na posibilidad.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: at dalhin mo siya
  rationale: Ang Hiphil ng בוא ay karaniwang “dalhin” o “ihantong,” at “dalhin mo siya” ang pinakatuwiran at natural dito.
- source_word: חֶדֶר בְּחָדֶר
  choice: sa isang silid sa kaloob-looban
  rationale: Ang idyomang inuulit ang חֶדֶר ay nagpapahiwatig ng isang pribado at panloob na silid. Ang “silid sa kaloob-looban” ay malinaw sa Tagalog, habang nasa talababa ang literal na anyo.
