  - severity: low
    issue: Ang talababa sa “mga kapatid” ay nagsasabing “malamang sa kapwa niya mga pinuno ng hukbo.”
    rationale: Posible ang mas malawak na kahulugang mga kasamahan sa konteksto, ngunit ang “malamang” at ang tiyak na pagtukoy sa mga pinuno ng hukbo ay higit sa ipinahahayag ng salita mismo sa talatang ito.
