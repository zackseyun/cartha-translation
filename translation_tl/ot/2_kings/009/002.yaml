  to: Pagdating mo roon, hanapin mo si Jehu na anak ni Jehoshafat, anak ni Nimshi. Lumapit ka, patayuin mo siya mula sa gitna ng kanyang mga kapatid,[a] at dalhin mo siya sa isang silid sa kaloob-looban.[b]
