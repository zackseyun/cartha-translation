base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: tl
  text: 'Kaya pumunta ang mangangabayo upang salubungin siya at sinabi, “Ganito ang sabi ng hari: ‘Kapayapaan ba?’[a]” Ngunit sinabi ni Jehu, “Ano ang kinalaman mo sa kapayapaan? Lumiko ka at sumunod sa likuran ko.[b]” Pagkatapos ay iniulat ng bantay, “Nakarating sa kanila ang sugo, pero hindi siya bumalik.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maayos ba ang lahat?” Ang salitang Hebreo ay shalom, na inuulit sa pag-uusap na ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Lumiko ka sa likuran ko”; sa konteksto, maaari itong mangahulugang “Pumuwesto ka sa likuran ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: ang mangangabayo
  rationale: Likas at malinaw na katumbas sa Filipino ng literal na ‘nakasakay sa kabayo,’ at angkop sa konteksto ng isang sugong militar.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Ipinapahayag ng anyo ang paglapit upang makipagtagpo; natural sa Filipino ang ‘salubungin.’
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Pinananatili ang pormal na pormula ng paghahatid ng utos ng hari nang hindi gumagamit ng lipas na pananalita.
- source_word: הֲשָׁלוֹם
  choice: Kapayapaan ba?
  rationale: Pinananatili ang salitang שָׁלוֹם at ang pag-uulit nito sa tugon ni Jehu, na mahalaga sa retorika ng salaysay.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Ano ang kinalaman mo sa kapayapaan?
  rationale: Natural na inilalarawan ang mapangtaboy na idyoma habang pinananatili ang inuulit na salitang ‘kapayapaan.’
- source_word: סֹב אֶל אַחֲרָי
  choice: Lumiko ka at sumunod sa likuran ko
  rationale: Ipinapakita kapwa ang utos na lumiko at ang kontekstuwal na diwang pumuwesto o sumunod sa likuran ni Jehu.
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Karaniwan at malinaw na tawag sa taong nagmamasid mula sa mataas na lugar.
- source_word: הַמַּלְאָךְ
  choice: ang sugo
  rationale: Tumutukoy rito sa taong ipinadala ng hari, hindi sa isang anghel.
- source_word: בָּא ... עַד הֵם
  choice: Nakarating sa kanila
  rationale: Maikli at natural na pahayag na ang sugo ay umabot sa kinaroroonan ng pangkat.
- source_word: וְלֹא שָׁב
  choice: pero hindi siya bumalik
  rationale: Malinaw na inihahayag ang napansin ng bantay na hindi nagbalik ang sugo.
