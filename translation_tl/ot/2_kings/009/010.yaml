  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: tl
  text: At kakainin ng mga aso si Jezebel sa bahagi ng lupain ng Jezreel[a], at walang maglilibing sa kanya.” Pagkatapos, binuksan niya ang pinto at tumakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa parsela ng Jezreel.” Ang salitang Hebreo na חֵלֶק ay tumutukoy sa isang bahagi, sakop, o parsela ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: kakainin
  rationale: Tuwirang ipinapahayag ang hinaharap na pagkilos sa konteksto ng propetikong hatol; hindi dinaragdagan ng tinding ipinahihiwatig ng “lalapain.”
- source_word: הַכְּלָבִים
  choice: mga aso
  rationale: Likas sa Tagalog ang pangkalahatang “mga aso” sa ganitong pahayag; hindi karaniwang kailangang katawanin nang hiwalay ang tiyak na artikulong Hebreo.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: sa lupain ng Jezreel
  rationale: Ang חֵלֶק ay maaaring tumukoy sa bahagi o parsela ng lupa. Malinaw at natural ang “lupain” habang pinananatili sa talababa ang mas tiyak na mga posibilidad.
- source_word: וְאֵין קֹבֵר
  choice: at walang maglilibing sa kanya
  rationale: Ang literal na “walang tagapaglibing” ay likas na ipinahayag sa Tagalog bilang “walang maglilibing”; idinagdag ang bagay na “sa kanya” mula sa malinaw na konteksto.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Pagkatapos, binuksan niya ang pinto
  rationale: Ipinakikita ng sunod-sunod na anyong pasalaysay ang kasunod na pangyayari; natural itong inihahatid ng “Pagkatapos.”
- source_word: וַיָּנֹס
  choice: at tumakas
  rationale: Pinananatili ng “tumakas” ang maikli at apurahang diwa ng Hebreong נוס.
- source_word: אִיזֶבֶל
  choice: Jezebel
  rationale: Pinanatili ang nakaugaliang transliterasyon ng personal na pangalan sa modernong Filipino.
