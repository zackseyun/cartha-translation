base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: tl
  text: 'Bumalik sila at ibinalita iyon sa kanya. Sinabi niya, “Ito ang salita ni Yahweh na sinabi niya sa pamamagitan ng lingkod niyang si Elias na Tisbita: ‘Sa bahagi ng Jezreel[a], kakainin ng mga aso ang laman ni Jezebel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa parsela” o “sa piraso ng lupa ng Jezreel”; ang salitang Hebreo ay maaaring tumukoy sa isang bahagi o takdang sakop ng lupain.
    reason: Pinananatili ang leksikal na kalabuan ng חֵלֶק, na maaaring mangahulugang bahagi, piraso, o parsela ng lupa.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik sila
  rationale: Tuwirang ipinapahayag ang sunod na kilos sa salaysay mula sa שׁוב, nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: וַיַּגִּידוּ לוֹ
  choice: ibinalita iyon sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat; ang “ibinalita” ay natural sa konteksto ng pag-uulat ng kanilang natuklasan.
- source_word: דְּבַר יְהוָה הוּא
  choice: Ito ang salita ni Yahweh
  rationale: Pinananatili ang diin ng sugnay na walang hayag na pandiwa at malinaw na kinikilalang katuparan ito ng pahayag ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: na sinabi niya sa pamamagitan ng lingkod niya
  rationale: Natural na Filipino ang “sa pamamagitan” para sa idyomang Hebreo na בְּיַד na tumutukoy sa ahensiya, habang pinananatili ang papel ng propeta bilang lingkod.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Elias na Tisbita
  rationale: Ginagamit ang nakaugaliang anyong Filipino ng pangalan at tuwirang inilalarawan ang pinagmulan o katawagan niyang Tisbita.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: Sa lupain ng Jezreel
  rationale: Ang חֵלֶק ay maaaring tumukoy sa bahagi, parsela, o sakop na lupain; ang “lupain” ay malinaw at hindi labis na nagpapakitid sa tiyak na sukat nito.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: kakainin ng mga aso
  rationale: Pinananatili ang payak at tahasang pandiwang “kainin” at ang hinaharap na diwa ng propesiya.
- source_word: בְּשַׂר אִיזָבֶל
  choice: ang laman ni Jezebel
  rationale: Ang בָּשָׂר ay “laman,” kaya pinananatili rito ang marahas at kongkretong larawan sa halip na gawing pangkalahatang “katawan.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ahensiya ng propetikong pahayag sa pariralang בְּיַד עַבְדּוֹ
  choice: sa pamamagitan ng lingkod niya
  alternative: sa kamay ng lingkod niya
  rationale: Ipinahihiwatig ng idyoma ang paggamit kay Elias bilang tagapamagitan ng pahayag, hindi isang doktrinal na pag-aangkin tungkol sa mekanismo ng inspirasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibinalita” para sa natural na daloy ng salaysay, “sa pamamagitan” para sa idyomang tumutukoy sa ahensiya, at “laman” upang mapanatili ang tahasang larawan ng tekstong Hebreo. Inilagay ang talababa sa “Jezreel,” kung saan naroon ang tunay na leksikal na kalabuan.
