  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: tl
  text: Nang makita iyon ni Ahazias na hari ng Juda, tumakas siya sa daang patungong Bet-hagan.[a] Hinabol siya ni Jehu at sinabi, “Tirahin din ninyo siya sa karwahe, sa ahunan ng Gur na malapit sa Ibleam!”[b] Ngunit tumakas siya patungong Megido at doon namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-hagan ay maaaring mangahulugang “bahay ng hardin,” ngunit malamang na pangalan ito ng isang lugar dito.
    reason: cultural_note
  - marker: b
    text: Sa literal, “Tirahin din ninyo siya patungo sa karwahe.” Maaaring tumukoy ang pang-ukol na Hebreo sa direksiyon, puntirya, o kinaroroonan ng pagtira.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: makita iyon
  rationale: Walang tahasang layon ang pandiwang Hebreo, ngunit likas sa Tagalog ang paglalagay ng “iyon” bilang pagtukoy sa nasaksihang nangyari kay Joram nang hindi ito labis na tinutukoy.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: sa daang patungong Bet-hagan
  rationale: Ang דֶּרֶךְ ay daan o ruta. Itinuring na pangalan ng lugar ang בֵּית הַגָּן at tinumbasan ng transliterasyong “Bet-hagan.”
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: Hinabol siya
  rationale: Natural at ganap na naipapahayag ng “hinabol siya” ang Hebreong idyoma para sa pagtugis sa isang tao.
- source_word: גַּם אֹתוֹ
  choice: din ... siya
  rationale: 'Pinananatili ng “din” ang diwang pandagdag: si Ahazias ay dapat ding tirahin gaya ni Joram.'
- source_word: הַכֻּהוּ
  choice: Tirahin ... ninyo siya
  rationale: Ang anyo ay utos sa maramihan mula sa נכה, “saktan/strike.” Sa konteksto ng paghabol mula sa mga karwahe, natural ang “tirahin,” ngunit hindi nito tiyak na sinasabing patayin.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: habang nasa karwahe
  rationale: Inihahayag nito ang malamang na lokasyon o kalagayan ni Ahazias nang siya ay tirahin. Dahil maaaring direksiyon din ang אֶל, inilalahad ang literal na alternatibo sa talababa.
- source_word: בְּמַעֲלֵה גוּר
  choice: sa ahunan ng Gur
  rationale: Ang מַעֲלֶה ay isang paahon na daan o lugar; maikli at natural sa Filipino ang “ahunan.”
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: na malapit sa Ibleam
  rationale: Iniuugnay ng parirala ang kinaroroonan ng ahunan ng Gur sa Ibleam; ang “malapit sa” ay malinaw nang hindi nagpapanggap ng higit na heograpikong katiyakan.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: tumakas siya patungong Megido
  rationale: Pinananatili ang kilos ng pagtakas at ang Megido bilang destinasyon.
- source_word: וַיָּמָת שָׁם
  choice: doon namatay
  rationale: Tuwirang ipinapahayag ang pagkamatay ni Ahazias sa Megido.
theological_decisions:
- issue: Kung tahasang sasabihing tinamaan si Ahazias
  choice: Tinamaan siya sa ahunan ng Gur
  alternative: Iugnay ang “sa ahunan ng Gur” sa utos nang walang hiwalay na pahayag na tinamaan siya
  rationale: Bagaman walang bagong tahasang pandiwa para sa pagtama sa tekstong Masoretiko pagkatapos ng utos, ipinahihiwatig ng pagtakas at pagkamatay ni Ahazias na naisagawa ang utos. Ginagawang malinaw ng sugnay ang takbo ng salaysay, gaya ng sinaunang pag-unawa sa talata, nang hindi sinasabing agad siyang napatay.
translation_notes:
  register: 'Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyong Filipino ng mga pangalan: Ahazias, Juda, Jehu, Bet-hagan, Gur, Ibleam, at Megido. Iningatan ang pagiging malawak ng utos na נכה at minarkahan sa talababa ang kalabuan ng אֶל הַמֶּרְכָּבָה.'
