    issue: Idinagdag ng draft ang “Tinamaan siya sa ahunan ng Gur.”
    rationale: Walang tahasang pandiwang katumbas ng “tinamaan sila/siya” sa bahaging ito ng Hebreo pagkatapos ng utos. Bagaman maaaring ipahiwatig ng konteksto na naisagawa ang utos, ang pagdaragdag ng malayang salaysay ng pagkakatama ay lumalampas sa hayag na teksto at nilulutas ang masiksik na sintaks nang labis.
  - severity: medium
    issue: Ang lokasyong “sa ahunan ng Gur” ay inihiwalay mula sa utos at ginawang lugar ng isang idinagdag na pangyayari.
    rationale: Mas tapat na ilagay ang topograpikong parirala sa loob ng iniulat na utos, na pinananatili ang ugnayang sintaktiko at ang antas ng katiyakang nasa pinagmulan.
