revisions:
- from: Nang makita iyon ni Ahazias na hari ng Juda, tumakas siya sa daang patungong Bet-hagan.[a] Hinabol siya ni Jehu at sinabi, “Tirahin din ninyo siya habang nasa karwahe!”[b] Tinamaan siya sa ahunan ng Gur, na malapit sa Ibleam. Ngunit tumakas siya patungong Megido at doon namatay.
  to: Nang makita iyon ni Ahazias na hari ng Juda, tumakas siya sa daang patungong Bet-hagan.[a] Hinabol siya ni Jehu at sinabi, “Tirahin din ninyo siya sa karwahe, sa ahunan ng Gur na malapit sa Ibleam!”[b] Ngunit tumakas siya patungong Megido at doon namatay.
  rationale: Inalis ang tahasang pahayag na aktuwal na tinamaan si Ahazias, sapagkat hindi ito hayagang isinasaad ng tekstong Hebreo. Isinama sa iniulat na utos ang “sa ahunan ng Gur na malapit sa Ibleam,” habang pinanatili ng talababa ang kalabuan ng pang-ukol na kaugnay ng karwahe. Hindi binago ang kahulugan ng pagtakas niya patungong Megido at ng pagkamatay niya roon.
