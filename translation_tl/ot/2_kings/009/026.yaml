id: 2KI.9.26
reference: 2 Kings 9:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: tl
  text: “Tunay ngang nakita ko kahapon ang dugo ni Nabot at ng kanyang mga anak na lalaki,” pahayag ni Yahweh[a], “at pagbabayarin kita sa lupang ito,” pahayag ni Yahweh. “Kaya ngayon, buhatin mo siya at itapon sa lupang ito, ayon sa salita ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Talagang nakita ko kahapon ang dugo ni Nabot at ng kanyang mga anak na lalaki.” Ang panimulang idyomang Hebreo ay isang mariing pahayag na kahawig ng panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Tunay ngang
  rationale: Ang parirala ay isang idyomang panunumpa o mariing pagpapatunay, hindi karaniwang kondisyon. Likas na ipinahahayag ng “Tunay ngang” ang diin nito sa Filipino.
- source_word: דְּמֵי
  choice: dugong dumanak mula kay
  rationale: Ang anyong maramihan na “mga dugo” ay tumutukoy sa dugong ibinubo o marahas na pagkamatay. Iniiwasan ng saling ito ang di-likas na “mga dugo” at malinaw na pinananatili ang diwang hudisyal.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Naboth.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang sinasabi ng Hebreo, kaya hindi ito pinalawak tungo sa pangkalahatang “mga anak.”
- source_word: רָאִיתִי
  choice: nakita ko
  rationale: Ang aspektong ganap at ang אֶמֶשׁ ay likas na naihahayag sa Filipino sa pangnagdaang “nakita ko kahapon.”
- source_word: אֶמֶשׁ
  choice: kahapon
  rationale: Ito ang pinakamalawak at hindi gaanong interpretatibong katumbas; maaari ring tumukoy ang salita sa nagdaang gabi depende sa konteksto.
- source_word: נְאֻם יְהוָה
  choice: pahayag ni Yahweh
  rationale: Pinananatili nito ang bigat ng pormulang propetiko at ang tuwirang pangalan ng Diyos nang natural sa Filipino.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: pagbabayarin kita
  rationale: Sa konteksto, ang piel ng שלם ay paghihiganti o makatarungang pagganti. Ang “pagbabayarin kita” ay natural at nagpapanatili sa diwang hudisyal.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: rito mismo sa lupang ito
  rationale: Ang חֶלְקָה ay isang takdang parsela ng lupa. Ipinahahayag ng “rito mismo” ang deiktikong diin at ng “lupang ito” ang tinutukoy na parsela nang hindi masalimuot.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita nito ang paglipat mula sa pahayag ng Diyos tungo sa utos at ang bunga ng naunang pahayag.
- source_word: שָׂא
  choice: buhatin mo siya
  rationale: Malapit ito sa literal na kahulugang “iangat/dalhin” at angkop sa pagbuhat sa bangkay sa konteksto.
- source_word: הַשְׁלִכֵהוּ
  choice: itapon
  rationale: Tuwiran at likas itong katumbas ng pautos na “ihagis/itapon siya” sa konteksto ng pagtatapon sa bangkay.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang pormal na ugnayan sa דָּבָר at ang pagtalima ng pangyayari sa naunang pahayag ng Diyos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehovah
  rationale: Tuwirang ginamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Pagpapanatili sa espesipikong kasarian ng בָנָיו
  choice: kanyang mga anak na lalaki
  alternative: kanyang mga anak
  rationale: Espesipikong tumutukoy ang Hebreo sa mga anak na lalaki. Mahalaga ang detalye sa kontekstong hudisyal at hindi ito dapat gawing pangkalahatan.
- issue: Kung literal na “dugo” o interpretatibong “pagpaslang” ang gagamitin
  choice: dugong dumanak mula kay Nabot at sa kanyang mga anak na lalaki
  alternative: pagpaslang kay Nabot at sa kanyang mga anak na lalaki
  rationale: Pinananatili ng napiling anyo ang imahen ng dugo sa Hebreo habang ipinauunawa sa natural na Filipino na dugo itong ibinubo. Hindi nito lubusang pinapalitan ang metapora ng isang interpretasyon.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang “Nabot” bilang pamilyar na anyong Tagalog ng pangalan. Ang “lupang ito” ay mas natural kaysa “parsela,” samantalang ipinahihiwatig ng “rito mismo” na iyon ang mismong bahagi ng lupa na tinutukoy. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng unang “Yahweh,” kasunod ng ibinigay na konsultasyong Ingles.
