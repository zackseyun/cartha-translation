  naturalness: Likas at angkop ang kabuuang rehistro. Gayunman, mas malinaw at mas natural sa modernong Filipino ang konstruksiyong ‘ang dugo ni Nabot at ng kanyang mga anak na lalaki’ kaysa ‘ang dugong dumanak mula kay Nabot at sa kanyang mga anak na lalaki.’
  terminology: Ang “Yahweh,” “Nabot,” “mga anak na lalaki,” “pagbabayarin kita,” at “pahayag ni Yahweh” ay angkop. Ang “lupang ito” ay katanggap-tanggap na payak na katumbas ng parsela o bahagi ng lupa sa konteksto.
