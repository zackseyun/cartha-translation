  to: “Tunay ngang nakita ko kahapon ang dugo ni Nabot at ng kanyang mga anak na lalaki,” pahayag ni Yahweh[a], “at pagbabayarin kita sa lupang ito,” pahayag ni Yahweh. “Kaya ngayon, buhatin mo siya at itapon sa lupang ito, ayon sa salita ni Yahweh.”
