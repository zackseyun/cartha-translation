  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod ng salaysay, ang mga pinunong militar na nakaupo, at ang maikling palitan. Ang “Kanino sa amin?” at “Sa iyo, kumander” ay likas na Tagalog at sapat na ipinapahayag ang pagtukoy sa isa sa magkakasama. Gayunman, kailangang itama ang pahayag na “literal” sa talababa: hindi nito naipapakita ang לִי (“para sa akin/sa akin”), kahit eliptiko ang kabuuang idyoma sa Hebreo.'
