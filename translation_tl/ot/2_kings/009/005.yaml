  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: tl
  text: Dumating siya, at naroon ang mga kumander ng hukbo na nakaupo. Sinabi niya, “May sasabihin ako sa iyo, kumander.”[a] Sinabi ni Jehu, “Kanino sa amin?” Sumagot siya, “Sa iyo, kumander.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “May mensahe ako para sa iyo, kumander.” Sa literal na Hebreo, “Isang salita ay para sa akin, para sa iyo, kumander,” isang eliptikong idyoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating siya
  rationale: Ang wayyiqtol ng בוא ay nagsusulong sa salaysay; natural sa Tagalog ang payak na “Dumating siya.”
- source_word: וְהִנֵּה
  choice: at naroon
  rationale: Ipinakikita ng הִנֵּה ang eksenang biglang nahaharap sa tauhan. Ang “naroon” ay likas at marangal sa modernong Tagalog nang hindi gumagamit ng mas lumang “masdan.”
- source_word: שָׂרֵי הַחַיִל
  choice: mga kumander ng hukbo
  rationale: Tumutukoy ang שָׂרִים sa mga pinunong militar; malinaw ang “mga kumander” at hindi ito nagtatakda ng masyadong tiyak na ranggo.
- source_word: יֹשְׁבִים
  choice: na nakaupo
  rationale: Pinananatili ng pariralang ito ang nagpapatuloy na kalagayang ipinahihiwatig ng participle.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: May sasabihin ako sa iyo
  rationale: Ito ang natural na ekspresyon sa Tagalog para sa eliptikong Hebreong idyoma. Nananatili sa talababa ang alternatibong “mensahe” at ang literal na anyo.
- source_word: הַשַּׂר
  choice: kumander
  rationale: Bilang pantawag sa isang pinunong militar, ang “kumander” ay malinaw, kasalukuyan, at hindi nagpapahiwatig ng maharlikang titulong gaya ng “prinsipe.”
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Kanino sa amin?
  rationale: Natural nitong ipinahahayag ang tanong kung sino sa mga naroroon ang kinakausap, habang pinananatili ang partitive na diwa ng מִכֻּלָּנוּ.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Sa iyo, kumander
  rationale: Tuwirang tinutukoy nito si Jehu at inuulit ang magalang na pantawag na militar.
