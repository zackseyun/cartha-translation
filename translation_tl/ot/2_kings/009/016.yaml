base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: tl
  text: Kaya sumakay si Jehu at pumunta sa Jezreel, sapagkat nakahiga roon si Joram, at bumaba si Ahazias na hari ng Juda upang dalawin si Joram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “upang makita si Joram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: sumakay
  rationale: Tuwirang ipinahahayag ng רכב ang pag-akyat o pagsakay ni Jehu sa sasakyan, na hiwalay sa kasunod na kilos na pagpunta; hindi tahasang tinutukoy ng talata kung karo o kabayo.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  choice: pumunta sa Jezreel
  rationale: Karaniwang pandiwa ang הלך para sa pagpunta, at ipinahihiwatig ng directional ה sa יִזְרְעֶאלָה ang patungong direksiyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito rito ng dahilan ng pagpunta ni Jehu; ang “sapagkat” ay malinaw, likas, at marangal sa salaysay.
- source_word: שֹׁכֵב שָׁמָּה
  choice: nakahiga roon
  rationale: Pinananatili ang konkretong kahulugan ng participle na שׁכב at iniiwasang idagdag na bedridden o nagpapagaling, bagaman iyon ang mas malawak na konteksto.
- source_word: יָרַד
  choice: bumaba roon
  rationale: Pinananatili ng “bumaba” ang topograpikal na diwa ng ירד. Idinagdag ang “roon” sa Filipino upang maging malinaw na sa Jezreel ang tunguhin, gaya ng hinihingi ng konteksto.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: upang dalawin si Joram
  rationale: Literal itong “upang makita si Joram,” ngunit sa konteksto ang pagpunta upang makita ang isang maysakit o sugatan ay natural na ipinahahayag sa Filipino bilang “dalawin.” Itinatala sa talababa ang literal na anyo.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Likas at tuwirang salin ng Hebrew construct chain.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Jehu / Joram / Ahazias / Jezreel / Juda
  rationale: Ginamit ang mga anyong pangalang pamilyar sa makabagong saling Filipino habang malinaw na kinakatawan ang mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling magkahiwalay ang “sumakay” at “pumunta,” gaya ng dalawang pandiwang Hebreo. Ang “dalawin” ay mas likas sa konteksto sa Filipino, habang nasa talababa ang literal na “makita.”
