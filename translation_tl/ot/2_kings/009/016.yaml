  - severity: low
    issue: Hindi gaanong likas ang pormulasyong “Sa literal” sa talababa.
    rationale: Mas malinaw at karaniwan sa Filipino ang “Literal na” para ipakilala ang tuwirang katumbas.
  revised_text: Kaya sumakay si Jehu at pumunta sa Jezreel, sapagkat nakahiga roon si Joram, at bumaba si Ahazias na hari ng Juda upang dalawin si Joram.[a]
