base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: tl
  text: Mapupuksa ang buong sambahayan ni Ahab, at lilipulin ko mula sa angkan ni Ahab ang bawat lalaki[a], alipin man o malaya, sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bawat umiihi sa pader,” isang magaspang na idyoma para sa bawat lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: Mapupuksa
  rationale: Ang Qal perfect na may prefixed conjunction sa konteksto ng propetikong pahayag ay may diwang panghinaharap. Ipinahahayag ng “mapupuksa” ang tiyak na kapahamakan nang hindi ginagawang tahasang aktibo ang anyo.
- source_word: כָּל בֵּית אַחְאָב
  choice: ang buong sambahayan ni Ahab
  rationale: Pinananatili ng “sambahayan” ang talinghagang “bahay” bilang pamilya, sambahayan, at maharlikang linya, sa halip na paliitin ito sa mga nakatira lamang sa isang gusali.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: Lilipulin ko sa angkan ni Ahab
  rationale: Ang Hiphil ng כרת ay pormula ng ganap na pag-aalis sa konteksto ng paghatol. Mas natural sa makabagong Tagalog ang “lilipulin” kaysa sa literal ngunit malabong “puputulin,” samantalang ipinakikita ng “sa angkan ni Ahab” ang kaugnayang ipinahahayag ng לְ.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ang bawat lalaki
  rationale: Ito ay magaspang na idyomang Hebreo na tumutukoy sa mga lalaki. Malinaw at natural ang pangunahing salin, at inilalahad sa talababa ang literal na larawan.
- source_word: וְעָצוּר וְעָזוּב
  choice: maging alipin o malaya
  rationale: Ang pares ay isang tradisyonal ngunit hindi ganap na tiyak na pormulang sumasaklaw sa lahat ng kalagayan ng mga tauhan o nasasakupan. Ang “alipin o malaya” ay madaling maunawaan; pinananatili sa talababa ang literal na kahulugan at ang tunay na pag-aalinlangan.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: 'Lokativong binabasa ang pang-ukol: ang paghatol sa linya ni Ahab ay magaganap sa Israel.'
theological_decisions:
- issue: Pormula ng paghatol sa dinastiya ni Ahab
  choice: Panatilihin ang “sambahayan” at ilarawan ang ganap na pagkalipol ng mga lalaking kabilang sa angkan ni Ahab.
  alternative: Buod na parapraseng “Lilipulin ko ang buong pamilya ni Ahab.”
  rationale: Pinananatili ng salin ang teksturang maharlika at pampamilyang linya ng בֵּית at ang tindi ng pormula ng paghatol, nang hindi nagdaragdag ng paliwanag tungkol sa dahilan o saklaw na wala sa talata.
- issue: Saklaw ng וְעָצוּר וְעָזוּב
  choice: “maging alipin o malaya,” na may talababa tungkol sa literal at hindi tiyak na idyoma
  alternative: “maging nakakulong o pinabayaang malaya” / “maging protektado o pinabayaan”
  rationale: Hindi ganap na tiyak ang tiyak na sosyal na kategoryang tinutukoy ng pares. Ang pangunahing salin ay nagpapahayag ng malawak na saklaw, habang ang talababa ay hindi nagkukubli sa leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” at “angkan” upang maipahayag ang dinastikong saklaw nang hindi maging makaluma; inilagay sa mga talababa ang magaspang na idyoma at ang tunay na leksikal na pag-aalinlangan.
