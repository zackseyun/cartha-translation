  text: וַ/יֵּלְכ֖וּ לְ/קָבְרָ֑/הּ וְ/לֹא מָ֣צְאוּ בָ֗/הּ כִּ֧י אִם הַ/גֻּלְגֹּ֛לֶת וְ/הָ/רַגְלַ֖יִם וְ/כַפּ֥וֹת הַ/יָּדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: tl
  text: Kaya pumunta sila upang ilibing siya, ngunit wala silang natagpuang anumang bahagi niya[a] maliban sa bungo, mga paa, at mga palad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “wala silang natagpuan sa kaniya maliban sa bungo, mga paa, at mga palad.” Sa kontekstong ito, ang Hebreong pananalita ay tumutukoy sa mga bahaging natira sa kaniyang katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Kaya pumunta sila
  rationale: Ang wayyiqtol ng הלך ay nagpapatuloy sa salaysay at nagpapahiwatig ng kasunod na kilos; likas sa modernong Tagalog ang “Kaya pumunta sila” sa kontekstong ito.
- source_word: לְקָבְרָהּ
  choice: upang ilibing siya
  rationale: Ang infinitive construct ng קבר na may hulaping 3fs ay tumutukoy kay Jezebel; malinaw at natural ang “upang ilibing siya.”
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: ngunit wala silang natagpuang anumang bahagi niya
  rationale: Ang וְ ay may panalungat na diwa matapos ang layuning ilibing siya. Ang בָהּ, na literal na “sa kaniya,” ay idyomatikong tumutukoy rito sa natira sa kaniyang katawan; pinananatili ng salin ang diwang iyon nang malinaw.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Ang tambalang kataga ay nagpapahayag ng eksepsiyon; “maliban sa” ang natural at tiyak na katumbas.
- source_word: הַגֻּלְגֹּלֶת
  choice: bungo
  rationale: Ang גֻּלְגֹּלֶת ay tumutukoy sa bungo, hindi sa buong ulo, at pinananatili nito ang matinding larawan ng mga labi.
- source_word: וְהָרַגְלַיִם
  choice: mga paa
  rationale: Ang dual na רַגְלַיִם ay tuwirang tumutukoy sa dalawang paa sa kontekstong anatomikal na ito.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: mga palad
  rationale: Ang כַּף ay tumutukoy sa palad o malukong na bahagi ng kamay. Sapat at natural sa Tagalog ang “mga palad,” habang napapanatili ang pagiging tiyak ng Hebreo.
