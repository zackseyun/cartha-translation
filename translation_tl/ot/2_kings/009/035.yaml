translation_notes:
  register: Gumamit ng dignified ngunit pangkaraniwang modernong Tagalog. Pinanatili ang matinding anatomikal na detalye ng Hebreo nang hindi ginagawang mas teknikal o mas malambot ang paglalarawan.
