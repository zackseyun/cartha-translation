id: 2KI.9.9
reference: 2 Kings 9:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: tl
  text: At gagawin kong tulad ng sambahayan ni Jeroboam na anak ni Nebat at ng sambahayan ni Baasa na anak ni Ahias ang sambahayan ni Ahab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinastiya ni Ahab … dinastiya ni Jeroboam … dinastiya ni Baasa.” Ang “sambahayan” sa Hebreo ay tumutukoy rito sa isang maharlikang angkan o linya ng mga hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: At gagawin kong
  rationale: Sa pormulang ito ng paghatol, ang literal na diwang “ibibigay/ilalagay” ay natural na ipinapahayag sa Filipino bilang “gagawin kong … tulad ng,” habang pinananatili ang sanhi at paghahambing.
- source_word: בֵּית אַחְאָב
  choice: ang sambahayan ni Ahab
  rationale: Ang “sambahayan” ay nagpapanatili sa metapora ng Hebreong בַּיִת at maaaring tumukoy rito sa angkan o maharlikang linya ni Ahab.
- source_word: כְּ/בֵית
  choice: tulad ng sambahayan ni
  rationale: Tuwirang ipinapahayag ng “tulad ng” ang paghahambing na minamarkahan ng prefiks na כְּ.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Pinananatili ang mga pangalang pantangi at natural na isinasalin ang ugnayang ama-anak.
- source_word: וּ/כְ/בֵית
  choice: at ng sambahayan ni
  rationale: Sa balangkas na “gagawin kong tulad ng X at ng Y,” natural na hindi na inuulit ang “tulad,” ngunit malinaw na saklaw pa rin nito ang ikalawang paghahambing.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa na anak ni Ahias
  rationale: Ginamit ang mga anyong pangalang karaniwan sa tradisyong Bibliyang Filipino at malinaw na isinalin ang patronymic.
theological_decisions:
- issue: Pormula ng paghatol sa maharlikang angkan
  choice: sambahayan ni Ahab … sambahayan ni Jeroboam … sambahayan ni Baasa
  alternative: dinastiya ni Ahab … dinastiya ni Jeroboam … dinastiya ni Baasa
  rationale: Pinananatili ng “sambahayan” ang biblikal na metapora at ang pagkakaugnay sa mga naunang salaysay ng paghatol, samantalang ipinapaliwanag sa talababa ang dinastikong kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang metaporang “sambahayan” sa halip na ilagay agad sa pangunahing teksto ang mas interpretibong “dinastiya.”
