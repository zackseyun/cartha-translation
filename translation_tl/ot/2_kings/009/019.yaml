  to: 'Kaya nagsugo siya ng pangalawang mangangabayo. Pagdating nito sa kanila, sinabi niya, “Ganito ang sabi ng hari: ‘May kapayapaan[a] ba?’” Ngunit sinabi ni Jehu, “Ano ang pakialam mo sa kapayapaan? Pumuwesto ka sa likuran ko.”'
