base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: tl
  text: 'Kaya nagsugo siya ng pangalawang mangangabayo. Pagdating nito sa kanila, sinabi niya, “Ganito ang sabi ng hari: ‘May kapayapaan[a] ba?’” Ngunit sinabi ni Jehu, “Ano ang pakialam mo sa kapayapaan? Pumuwesto ka sa likuran ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maayos ba ang lahat?” Ang Hebreong שָׁלוֹם ay maaaring mangahulugang “kapayapaan,” “kapakanan,” o “maayos na kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: pangalawang mangangabayo
  rationale: Tumutukoy ang parirala sa ikalawang sugo na nakasakay sa kabayo; natural at maikli sa salaysay ang “pangalawang mangangabayo.”
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Pinananatili nito ang pormal na pormula ng mensahero sa natural na makabagong Tagalog.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Saklaw ng salita ang kapayapaan, kaligtasan, at maayos na kalagayan. Pinananatili ng “kapayapaan” ang pag-uulit ng parehong salitang Hebreo sa tanong ng hari at tugon ni Jehu.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Ano ang pakialam mo sa kapayapaan?
  rationale: Natural na Tagalog ito para sa mapanghamong idyoma at hindi inaalis ang tahasang pagbanggit sa kapayapaan.
- source_word: סֹב אֶל אַחֲרָי
  choice: Lumiko ka sa likuran ko
  rationale: Malapit ito sa literal na direksiyon na “lumiko/pumihit patungo sa likuran ko” at iniiwasang gawing tahasang “sumunod ka sa akin,” bagaman ipinahihiwatig iyon ng konteksto.
