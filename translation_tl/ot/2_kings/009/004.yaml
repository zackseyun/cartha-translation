  register: Gumamit ng maikli, kasalukuyan, at marangal na Filipino. Pinanatili sa pangunahing teksto ang pag-uulit ng Hebreo sa halip na gawing “lingkod ng propeta,” na hindi natural na pagbasa sa anyong may tiyak na pantukoy.
