base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: tl
  text: Kaya pumunta sa Ramot-Gilead ang binata—ang binatang propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inuulit sa Hebreo ang “binata”: “ang binata—ang binatang propeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya pumunta
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay at ipinapakitang isinagawa ng binata ang naunang utos; natural itong naipahahayag sa Filipino sa pamamagitan ng “Kaya pumunta.”
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Karaniwang tumutukoy ang נַעַר sa isang kabataang lalaki. Ang “binata” ay maikli, natural, at hindi nagdaragdag ng tungkuling hindi tahasang nakasaad.
- source_word: הַנַּעַר הַנָּבִיא
  choice: ang binatang propeta
  rationale: Ang mga salitang may tiyak na pantukoy ay pinakamalinaw na basahin bilang paglalarawan sa binata bilang propeta, hindi bilang construct na “lingkod ng propeta.” Pinananatili rin ng salin ang kapansin-pansing pag-uulit ng הַנַּעַר.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Pangalan ito ng lugar; ang transliterasyong “Ramot-Gilead” ay malinaw na kumakatawan sa tambalang pangalan.
