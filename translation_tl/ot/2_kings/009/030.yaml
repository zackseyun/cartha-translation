base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: tl
  text: Nang dumating si Jehu sa Jezreel, nabalitaan iyon ni Jezebel. Nilagyan niya ng kohl ang kanyang mga mata[a], inayos ang kanyang buhok[b], at dumungaw sa bintana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na “puk” ay tumutukoy sa maitim na kosmetiko para sa mata, gaya ng kohl.
    reason: lexical_alternative
  - marker: b
    text: O “pinaganda niya ang kanyang ulo.” Hindi tiyak kung ang tinutukoy ay pag-aayos ng buhok o mas malawak na pagpapaganda sa ulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא יֵהוּא יִזְרְעֶאלָה
  choice: Nang dumating si Jehu sa Jezreel
  rationale: Ang directional he sa יִזְרְעֶאלָה ay nagsasaad ng pagpunta sa Jezreel; natural at tumpak sa Filipino ang “dumating ... sa.”
- source_word: וְאִיזֶבֶל שָׁמְעָה
  choice: nabalitaan iyon ni Jezebel
  rationale: May ipinahihiwatig na layon ang “narinig,” tumutukoy sa pagdating ni Jehu. Ang “nabalitaan iyon” ay likas sa Filipino at hindi nagdaragdag ng bagong impormasyon.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: Nilagyan niya ng itim na pampaganda ang kanyang mga mata
  rationale: Ang פּוּךְ ay madilim na kosmetikong inilalagay sa palibot ng mga mata. Inilalarawan ito sa paraang madaling maunawaan sa modernong Filipino, habang ang mas literal na anyo ay inilagay sa talababa.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: inayos ang kanyang buhok
  rationale: Literal na “pinaganda/inayos ang kanyang ulo.” Sa konteksto ng pag-aayos ng sarili, malamang na buhok ang tinutukoy, ngunit pinananatili sa talababa ang mas malawak na literal na pahayag.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: dumungaw sa bintana
  rationale: Ipinahihiwatig ng pandiwa ang pagtingin palabas o pababa mula sa isang bukasan. Ang “dumungaw sa bintana” ang pinakanatural na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “itim na pampaganda” sa teksto upang maging malinaw ang sinaunang kosmetiko; pinanatili sa talababa ang katawagang pangkultura. Ang “dumungaw” ay mas idiomatiko kaysa sa literal na “tumingin sa pamamagitan ng bintana.”
