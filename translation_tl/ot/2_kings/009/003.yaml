  to: 'Kunin mo ang sisidlan ng langis, ibuhos mo iyon sa ulo niya, at sabihin mo, ‘Ganito ang sabi ni Yahweh: Pinahiran kita bilang hari ng Israel[a].’ Pagkatapos, buksan mo ang pinto at tumakas ka; huwag kang maghintay.'
