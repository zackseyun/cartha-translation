  terminology: Ang “Yahweh,” “langis,” at “pinahiran” ay angkop at pinananatili ang pangalan ng Diyos at ang pisikal na ritwal ng pagpapahid. Ang “sisidlan” ay katanggap-tanggap na pangkalahatang salin ng פַךְ at hindi nagdaragdag ng materyal o uri ng lalagyan.
