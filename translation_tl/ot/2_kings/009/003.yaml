  source_fidelity: 'Tumpak sa kabuuan ang pagkakasunod ng mga utos at ang mahahalagang larawan: maliit na lalagyan ng langis, pagbuhos sa ulo, pagpapahid bilang hari, mabilis na pag-alis, at pagbabawal na maghintay. Gayunman, ang “Ganito ang sinabi ni Yahweh” ay nakaraan ang panahon, samantalang ang pormulang Hebreo na כֹּה אָמַר יְהוָה ay karaniwang pangkasalukuyang pagpapahayag: “Ganito ang sabi ni Yahweh.” Ang “hari sa Israel” ay maaari ring maunawaang hari na nasa Israel lamang; mas malinaw at idiomatiko ang “hari ng Israel,” habang ipinapaliwanag ng talababa ang Hebreong pang-ukol.'
