  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: tl
  text: 'Kunin mo ang sisidlan ng langis, ibuhos mo iyon sa ulo niya, at sabihin mo, ‘Ganito ang sabi ni Yahweh: Pinahiran kita bilang hari ng Israel[a].’ Pagkatapos, buksan mo ang pinto at tumakas ka; huwag kang maghintay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa” o “tungo sa Israel.” Sa pormula ng pagtatalaga ng hari, ang diwa ay “hari ng Israel” o paghahari sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: sisidlan ng langis
  rationale: Ang פַךְ ay isang maliit na lalagyan ng likido. Likas at malinaw sa modernong Filipino ang “sisidlan,” samantalang hindi tahasang tinutukoy ng Hebreo kung anong uri o materyal ng lalagyan. Ang הַשֶּׁמֶן ay “ang langis,” hindi tahasang “langis ng olibo.”
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: ibuhos mo iyon sa ulo niya
  rationale: Tuwirang ipinapahayag nito ang pagbuhos ng langis sa ulo at pinananatili ang pagkakasunod-sunod ng mga tagubilin.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili nito ang pormal na pormula ng mensaherong propetiko at ang personal na pangalang יְהוָה.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: Pinahiran kita bilang hari
  rationale: Ang “pinahiran” ay nagpapanatili sa ritwal at teolohikal na diwa ng משׁח, at ang “bilang hari” ay malinaw na naghahayag ng pagtatalaga sa katungkulan. Ang aspektong ganap ng pandiwang Hebreo ay likas na naihahatid ng “pinahiran kita” sa kontekstong ito.
- source_word: אֶל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Bagaman karaniwang may direksiyonal na diwa ang אֶל, sa pormula ng pagtatalaga ng hari ay tinutukoy nito ang saklaw ng paghahari. Likas sa Filipino ang “hari sa Israel,” habang ipinapaliwanag sa talababa ang di-pangkaraniwang pang-ukol.
- source_word: וְנַסְתָּה וְלֹא תְחַכֶּה
  choice: tumakas ka; huwag kang maghintay
  rationale: Pinananatili ng “tumakas” ang pagmamadali at panganib na ipinahihiwatig ng נוס, at tuwirang isinasalin ng “huwag kang maghintay” ang pagbabawal.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa teksto, kaya ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pagpapahid sa hari
  choice: Pinahiran kita bilang hari
  alternative: Itinalaga kitang hari
  rationale: Hindi pinalitan ng pangkalahatang “itinalaga” ang tiyak na kilos ng pagpapahid, sapagkat kapwa mahalaga sa talata ang pisikal na ritwal at ang pagtatalaga sa paghahari.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang tuwirang pautos upang mapanatili ang mabilis na pagkakasunod-sunod at pagkaapurahan ng mga tagubilin. Iniwasan ang arkaikong bokabularyo at ang pagdaragdag ng “olibo,” na hindi tahasang nasa Hebreo.
