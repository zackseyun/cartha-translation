  terminology: Wastong pinanatili ang “Yahweh” para sa יהוה at “pinahiran” para sa משׁח. Pinalitan ang “sa Israel” ng “ng Israel” upang malinaw na maipahayag ang katungkulan ni Jehu bilang tagapamahala ng Israel, hindi lamang ang kaniyang kinaroroonan.
