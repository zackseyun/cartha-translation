base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: tl
  text: 'Sinabi nila, “Hindi totoo iyan! Sabihin mo nga sa amin.” Sumagot siya, “Ganito at ganoon[a] ang sinabi niya sa akin: ‘Ganito ang sabi ni Yahweh: Pinahiran kita bilang hari ng Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ganito at ganoon,” isang idyomang tumutukoy sa di-tiyak o pinaikling buod; maaari ring isalin na “ganito at ganito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Hindi totoo iyan!
  rationale: Ang pangngalan ay nangangahulugang “kasinungalingan” o “kabulaanan.” Sa biglang tugon ng mga opisyal, likas sa modernong Tagalog ang “Hindi totoo iyan!” at pinananatili nitong hindi tahasang tinutukoy kung si Jehu mismo ang sinasabing nagsisinungaling o kung hindi lamang pinaniniwalaan ang una niyang sinabi.
- source_word: הַגֶּד נָא לָנוּ
  choice: Sabihin mo nga sa amin
  rationale: Ang הַגֶּד ay pautos na “sabihin/ipahayag,” at ang נָא ay nagbibigay ng pakiusap o pagpupumilit. Ang “nga” ay natural na naghahatid ng ganitong puwersa sa Tagalog.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ganito at ganoon
  rationale: Idyoma itong nagbibigay ng di-tiyak o pinaikling buod, hindi kinakailangang eksaktong sipi. Malapit sa anyo ng Hebreo ang “ganito at ganoon,” habang nananatiling mauunawaan sa Tagalog.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili nito ang pormal na pormula ng mensaherong propetiko at ang tahasang banal na pangalang Yahweh.
- source_word: מְשַׁחְתִּיךָ
  choice: Pinahiran kita
  rationale: Ang pandiwang משׁח ay “magpahid ng langis/magpahid,” at dito ay tumutukoy sa natapos na pagtatalaga kay Jehu sa maharlikang tungkulin.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: bilang hari sa Israel
  rationale: Ang לְ ay nagmamarka ng pagtatalaga sa katungkulan. Ang “bilang hari sa Israel” ay natural sa Tagalog at malinaw na tumutukoy sa paghahari, hindi sa pagpunta patungo sa Israel.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang nasa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng pagpapahid kay Jehu
  choice: Pinahiran kita bilang hari
  alternative: Itinalaga kitang hari
  rationale: Pinananatili ang konkretong larawan at teolohikal na bigat ng משׁח, habang nililinaw ng “bilang hari” ang katungkulang itinatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nga” upang natural na maipahayag ang mapilit na pakiusap, at pinanatili ang bahagyang pormal na himig ng pormulang propetiko. Inilagay ang talababa sa mismong idyomang ipinapaliwanag nito.
