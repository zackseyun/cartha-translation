  to: Pagkatapos, lumabas si Jehu patungo sa mga lingkod ng kanyang panginoon. Sinabi ng isa sa kanila sa kanya, “Ayos ba ang lahat?[a] Bakit pumunta sa iyo ang baliw na iyon?[b]” Sumagot siya sa kanila, “Kilala ninyo ang taong iyon at ang pananalita niya.”[c]
