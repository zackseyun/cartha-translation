translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit, habang pinananatili ang mapanlait na tono ng mga opisyal at ang umiiwas na sagot ni Jehu. Ang “panginoon” ay pinanatili sa halip na idagdag ang “hari,” at hindi ginawang mas tiyak na “mensahe” ang malawak na שִׂיחוֹ.
