base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: tl
  text: Pagkatapos, lumabas si Jehu patungo sa mga lingkod ng kanyang panginoon. Sinabi ng isa sa kanila sa kanya, “Ayos ba ang lahat?[a] Bakit pumunta sa iyo ang baliw na iyon?[b]” Sumagot siya sa kanila, “Kilala ninyo ang taong iyon at ang pananalita niya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Kapayapaan ba?” Maaari ring isalin na, “Maayos ba ang lahat?”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang taong hibang na iyon.” Isang mapanlait na bansag ang salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang paraan niya ng pagsasalita” o “ang diskurso niya.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa pananalita o diskurso ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: mga lingkod ng kanyang panginoon
  rationale: Pinananatili nito ang karaniwang kahulugan ng עֶבֶד at ang di-tiyak na pagtukoy ng אֲדֹנָיו; hindi idinaragdag ang “hari,” bagaman siya ang tinutukoy sa konteksto.
- source_word: הֲשָׁלוֹם
  choice: Ayos ba ang lahat?
  rationale: Likas na makabagong Tagalog ito para sa Hebreong idyomang literal na nagtatanong kung may “kapayapaan,” ibig sabihin, kung maayos ang kalagayan.
- source_word: מַדּוּעַ בָּא
  choice: Bakit pumunta
  rationale: Ang payak na aspektong naganap ay angkop sa tanong tungkol sa dahilan ng pagpunta ng bisita.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: ang baliw na iyon
  rationale: Pinananatili ng “baliw” ang mapanlait na bansag sa Hebreo, at natural sa Tagalog ang “iyon” para sa taong pinatutungkulan nang may paghamak.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Kilala ninyo ang taong iyon
  rationale: Ipinahihiwatig ng sagot ni Jehu na alam nila kung anong uri ng tao ang dumating; pinananatili rin nito ang umiiwas at bahagyang mapagwalang-bahalang tono.
- source_word: שִׂיחוֹ
  choice: ang mga sinasabi niya
  rationale: Sapat itong malawak upang tumukoy sa pananalita o diskurso ng lalaki nang hindi ito nililimitahan sa isang pormal na “mensahe” o pinatitindi bilang walang saysay na “daldal.”
- source_word: וַיֹּאמֶר לוֹ
  choice: Sinabi sa kanya ng isa sa kanila
  rationale: Ang pandiwa ay isahan kahit pangmaramihan ang naunang tinukoy; malinaw na ipinakikita ng salin na isa sa pangkat ang nagsalita.
