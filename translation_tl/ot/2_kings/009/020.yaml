translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pero” para sa natural na pasalitang ulat ng bantay, habang pinanatili ang pag-uulit ng “pagpapatakbo” upang masalamin ang diin ng Hebreo.
