  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: tl
  text: Nag-ulat ang bantay, “Nakarating siya sa kanila, pero hindi siya bumalik. Ang pagmamaneho ay gaya ng pagmamaneho ni Jehu na anak ni Nimsi, sapagkat nagmaneho siya na parang baliw[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagmaneho siya nang may kabaliwan.” Idiniriin ng Hebreo ang marahas at walang-ingat na paraan ng pagmamaneho ni Jehu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Nag-ulat
  rationale: Ang pandiwa ay nagpapakilala sa ulat ng bantay; ang “nag-ulat” ay angkop sa kontekstong militar at mas tiyak kaysa sa pangkalahatang “nagsabi.”
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Tumutukoy ito sa taong nakatalaga upang magmasid mula sa tore; natural at malinaw sa modernong Tagalog ang “bantay.”
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Nakarating siya sa kanila
  rationale: Ipinahihiwatig ng parirala na naabot ng sugo ang papalapit na pangkat.
- source_word: וְלֹא שָׁב
  choice: pero hindi siya bumalik
  rationale: Pinananatili ang kaibahan at ang kasalukuyang bunga ng hindi pagbabalik ng sugo.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: Ang pagpapatakbo ay gaya ng pagpapatakbo
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang tiyak na larawan ng pagpapatakbo ng karwahe.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jehu na anak ni Nimsi
  rationale: Natural na anyo ng patronimiko sa Tagalog, na may karaniwang transliterasyon ng mga pangalan.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: sapagkat parang baliw siyang magpatakbo
  rationale: Inilalarawan nito ang mabangis, wala-sa-ayos, at mapanganib na paraan ng pagpapatakbo, nang hindi ito pinahihina tungo sa simpleng bilis lamang.
