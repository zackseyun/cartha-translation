  naturalness: Mas natural sa modernong Filipino ang “nagmaneho siya na parang baliw” kaysa “parang baliw siyang magpatakbo.” Ang “pagmamaneho” ay malinaw na tumutukoy sa paraan ng pagpapatakbo ng karwahe sa kontekstong ito at mas idiomatiko kaysa sa paulit-ulit na “pagpapatakbo.”
  terminology: Ang “bantay,” “Jehu,” at “Nimsi” ay angkop. Walang usaping teolohikal na nangangailangan ng pagbabago. Inilipat ang footnote marker sa sugnay na aktuwal nitong nililinaw.
