  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: tl
  text: Dinala siya ng kanyang mga lingkod sa Jerusalem[a], at inilibing nila siya sa kanyang libingan, kasama ng kanyang mga ninuno[b], sa Lunsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipinasakay siya patungong Jerusalem.” Literal na nangangahulugan ang pandiwang Hebreo na “pinasakay” o “ipinasakay”; sa kontekstong ito, maaari rin itong tumukoy sa pagdadala sa kanya sakay.
    reason: lexical_alternative
  - marker: b
    text: Ang “kasama ng kanyang mga ninuno” ay isang Hebreong idyoma para sa paglilibing sa piling ng mga naunang kasapi ng maharlikang angkan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: Dinala
  rationale: Ang hiphil ng רכב ay literal na ‘pinasakay’ o ‘ipinasakay,’ ngunit sa konteksto ng bangkay ni Ahazias, ang natural na Filipino na ‘dinala’ ang malinaw na naghahayag ng paglilipat nang hindi ipinahihiwatig na buhay siyang sumakay.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Tuwirang katumbas ito ng עבד at maaari ring sumaklaw sa mga tagapaglingkod o opisyal ng hari.
- source_word: יְרוּשָׁלָמָה
  choice: sa Jerusalem
  rationale: Ipinahahayag ng hulaping pandireksiyon ang pagpunta patungong Jerusalem; natural itong sinasabi sa Filipino bilang ‘sa Jerusalem’ kasunod ng ‘dinala.’
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: at inilibing
  rationale: Tuwiran at natural na salin; nananatiling malinaw na ang mga lingkod ang gumagawa ng kilos.
- source_word: בִקְבֻרָתוֹ
  choice: sa kanyang libingan
  rationale: Ang salita ay tumutukoy sa lugar ng paglilibing; ang ‘libingan’ ay natural at angkop sa kontekstong maharlika.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ipinahahayag nito ang Hebreong idyoma ng paglilibing kasama ng mga naunang kasapi ng angkan, habang natural at malinaw sa makabagong Filipino.
- source_word: בְּעִיר דָּוִד
  choice: sa Lunsod ni David
  rationale: Karaniwan at tuwirang anyo ng pangalan ng pook sa Filipino.
