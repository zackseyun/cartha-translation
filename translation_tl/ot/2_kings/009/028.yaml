translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘dinala’ sa pangunahing teksto upang maging natural sa konteksto ng pagdadala sa bangkay, at pinanatili sa talababa ang mas literal na anyo. Ang ‘mga ninuno’ ay malinaw na naghahatid ng idyomang dinastiko nang hindi tunog lipas.
