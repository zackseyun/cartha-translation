  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: tl
  text: Ang bantay ay nakatayo sa tore sa Jezreel. Nang makita niya ang pangkat ni Jehu na paparating, sinabi niya, “May nakikita akong pangkat.” Sinabi ni Jehoram, “Kumuha ka ng isang mangangabayo at papuntahin mo siya upang salubungin sila, at sabihin niya, ‘Kapayapaan ba?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas likas na pananalita, “Maayos ba ang lahat?” Maaari rin itong magtanong kung mapayapa ang kanilang pakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Tumutukoy sa taong nagmamasid upang magbantay; natural at malinaw sa Tagalog ang “bantay” sa tagpong ito.
- source_word: עֹמֵד עַל הַמִּגְדָּל
  choice: nakatayo sa tore
  rationale: Pinananatili ng “nakatayo” ang nagpapatuloy na kalagayang inilalarawan ng participle, at ang “tore” ang payak na kahulugan ng pangngalan.
- source_word: בְּיִזְרְעֶאל
  choice: sa Jezreel
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
- source_word: שִׁפְעַת
  choice: pangkat
  rationale: Sa kontekstong ito, tumutukoy ito sa isang nakikitang kalipunan ng mga taong kasama ni Jehu; hindi nito labis na tinutukoy ang laki o tiyak na uri ng pangkat.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Karaniwang transliterasyon sa Filipino ng personal na pangalan.
- source_word: בְּבֹאוֹ
  choice: na paparating
  rationale: Likas na ipinapahayag sa Tagalog ang paglapit ni Jehu at ng kanyang pangkat habang sila ay nakikita ng bantay.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: May nakikita akong isang pangkat
  rationale: Pinananatili ang pag-uulit ng שִׁפְעַת at natural na inihahayag ang ulat ng bantay.
- source_word: קַח רַכָּב
  choice: Kumuha ka ng isang mangangabayo
  rationale: Ang isahan at ang kasunod na mga pandiwang isahan ay tumutukoy sa isang mensaherong nakasakay.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: papuntahin mo siya upang salubungin sila
  rationale: Pinananatili ang pangmaramihang hulaping “sila,” na tumutukoy sa nakikitang pangkat.
- source_word: וְיֹאמַר
  choice: Sabihin niya
  rationale: Likas na utos sa Tagalog na nagpapahayag ng jussive na kasunod ng imperatibo.
- source_word: הֲשָׁלוֹם
  choice: Kapayapaan ba?
  rationale: Pinananatili ang maikli at sadyang hindi ganap na tiyak na tanong ng Hebreo, pati ang mahalagang pag-uulit ng salitang שָׁלוֹם sa salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hindi nagdagdag ng panimulang “Ngayon” sapagkat walang tahasang katumbas nito sa Hebreo. Inilagay ang talababa sa mismong tanong na tinutukoy nito.
