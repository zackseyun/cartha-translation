  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: tl
  text: 'Pagkatapos ay sinabi niya kay Bidkar na kanyang opisyal[a], “Buhatin mo siya at ihagis sa parsela ng bukid ni Nabot na taga-Jezreel. Sapagkat tandaan mo: ikaw at ako ay magkapares na nakasakay[b] sa likuran ni Ahab, na ama niya, nang ipataw sa kanya ni Yahweh ang pahayag na ito[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang ikatlong tauhan.” Maaaring teknikal na katawagan ito sa ranggo o tungkulin ni Bidkar.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nakasakay na magkapares”; malamang na magkasamang nakasakay sina Jehu at Bidkar sa likuran ni Ahab.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “orakulo” o “pasanin.” Ang salitang Hebreo ay tumutukoy sa isang mabigat na propetikong pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidkar
  rationale: Isinalin sa karaniwang baybay-Filipino ang pangalang pantangi.
- source_word: שלשה
  choice: kanyang opisyal
  rationale: Sa konteksto, ito ay katawagan sa tungkulin o ranggo ni Bidkar, hindi simpleng bilang. Malinaw ang “opisyal” ngunit hindi nito labis na tinutukoy ang tiyak na ranggong militar.
- source_word: שָׂא
  choice: Buhatin mo siya
  rationale: Ipinahihiwatig ng pautos na anyo ang pagbuhat o pag-alis sa bangkay bago ito ihagis.
- source_word: הַשְׁלִכֵהוּ
  choice: ihagis
  rationale: Tuwiran at natural na salin na nagpapanatili sa puwersa ng utos.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: sa bahagi ng bukid
  rationale: Pinananatili ang diwa ng isang takdang parsela o bahagi ng lupang bukid sa natural na Filipino.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot na taga-Jezreel
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at likas na paraan ng pagtukoy sa pinagmulan.
- source_word: זְכֹר
  choice: tandaan mo
  rationale: Natural na pautos sa Filipino na nagpapakilala sa dahilan ng iniutos.
- source_word: רֹכְבִים צְמָדִים
  choice: magkatabing nakasakay
  rationale: Ang literal na diwa ay “nakasakay na magkapares.” Ipinahahayag ng salin ang malamang na ayos nina Jehu at Bidkar nang hindi itinatago ang literal na larawan, na inilagay sa talababa.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: sa likuran ni Ahab na kanyang ama
  rationale: Pinananatili ang relasyong pang-espasyo at ang panghalip ng Hebreo; sa konteksto, si Ahab ang ama ni Joram.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na tuwirang nasa tekstong Hebreo.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: ipataw sa kanya ... ang pahayag na ito
  rationale: Pinananatili ng “ipataw” ang matimbang at mapanghatol na larawan ng idyomang Hebreo, samantalang malinaw sa makabagong mambabasa ang “pahayag.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng מַשָּׂא bilang propetikong salita
  choice: pahayag
  alternative: orakulo; pasanin
  rationale: Ang salita ay maaaring maglarawan ng isang mabigat at madalas na mapanghatol na pahayag. Pinananatiling malinaw sa pangunahing teksto ang “pahayag,” habang inilalahad sa talababa ang iba pang tunay na posibilidad.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang “opisyal” upang maging malinaw nang hindi nagpapasya sa eksaktong ranggo; pinanatili naman sa mga talababa ang teknikal at literal na mga alternatibo. Ang ayos na “Ahab na kanyang ama” ay sadyang malapit sa Hebreo, bagaman ipinakikita ng konteksto na si Ahab ang ama ni Joram.
