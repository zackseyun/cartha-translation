  source_fidelity: 'Tumpak sa kabuuan ang draft: naipapahayag nito ang dalawang utos, ang lupain ni Nabot, ang pag-alaala sa dating pagsunod kay Ahab, at ang mapanghatol na pahayag ni Yahweh. Gayunman, ang “bahagi ng bukid” ay masyadong pangkalahatan para sa חלקת שדה, na tumutukoy sa isang tiyak na parsela o lote ng bukid. Ang “Ahab na kanyang ama” ay maaari ring pansamantalang mabasa na si Ahab ang tinutukoy ng “kanyang”; mas malinaw ang panghalip kapag inilagay bilang paliwanag kay Ahab.'
  naturalness: Makabago at marangal ang rehistro. Ang “parsela ng bukid” ay natural sa kontekstong ari-arian at mas tiyak kaysa “bahagi ng bukid.” Ang “magkapares na nakasakay” ay pinapanatili ang hindi ganap na tiyak na larawan ng Hebreo nang hindi ipinipilit ang “magkatabi.”
  terminology: Ang “Yahweh,” “opisyal,” “Nabot na taga-Jezreel,” at “pahayag” ay angkop. Ang talababa sa “orakulo” o “pasanin” ay sapat upang maipakita ang saklaw ng מַשָּׂא nang hindi ginagawang teknikal ang pangunahing teksto.
