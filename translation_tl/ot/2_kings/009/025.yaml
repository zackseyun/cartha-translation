  to: 'Pagkatapos ay sinabi niya kay Bidkar na kanyang opisyal[a], “Buhatin mo siya at ihagis sa parsela ng bukid ni Nabot na taga-Jezreel. Sapagkat tandaan mo: ikaw at ako ay magkapares na nakasakay[b] sa likuran ni Ahab, na ama niya, nang ipataw sa kanya ni Yahweh ang pahayag na ito[c].”'
