  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: tl
  text: Pagkatapos, tinawag ng propetang si Eliseo ang isa sa mga anak ng mga propeta[b] at sinabi rito, “Bigkisan mo ang iyong baywang[a], kunin mo ang maliit na sisidlang ito ng langis at hawakan mo ito sa iyong kamay, at pumunta ka sa Ramot-gilead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Bigkisan mo ang iyong baywang.” Isa itong idyoma na nangangahulugang maghanda para kumilos o maglakbay sa pamamagitan ng pagtupi at pagtali ng mahabang kasuotan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ng mga propeta” ay tumutukoy sa mga kasapi ng isang pangkat ng mga propeta, hindi kinakailangang sa kanilang mga biyolohikal na anak.
    reason: cultural_note
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Pagkatapos, ... ni Eliseo na propeta
  rationale: Ang וְ ay nagpapasulong sa salaysay; natural na ipinahahayag ito ng “Pagkatapos.” Pinananatili ang pangalan at ang tiyak na titulong tumutukoy kay Eliseo.
- source_word: קָרָא לְאַחַד
  choice: tinawag ... ang isa
  rationale: Tuwirang ipinapahayag ang karaniwang kahulugan ng קרא at ang partitive na diwa ng “isa sa” kasama ng kasunod na parirala.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: isa sa mga anak ng mga propeta
  rationale: Pinananatili sa pangunahing teksto ang kongkretong idyomang Hebreo, habang nililinaw sa talababa na tumutukoy ito sa isang kasapi ng pangkat ng mga propeta at hindi kinakailangang sa literal na anak.
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi rito
  rationale: Natural na panimulang pahayag sa Filipino; malinaw na ang tinutukoy ng “rito” ay ang lalaking tinawag.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Bigkisan mo ang iyong baywang
  rationale: Pinananatili ang pisikal na larawan ng Hebreong idyoma sa isang marangal na anyong Filipino; ipinapaliwanag sa talababa ang praktikal na kahulugan nito.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: ang maliit na sisidlang ito ng langis
  rationale: Ang פַּךְ ay isang maliit na sisidlan o prasko. Ang “maliit na sisidlan” ay malinaw sa karaniwang mambabasa nang hindi nagpapalagay ng tiyak na materyal o hugis.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang kongkretong pananalita ng Hebreo sa halip na gawing pangkalahatang “dalhin mo.”
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: at pumunta ka sa Ramot-gilead
  rationale: Tuwirang ipinapahayag ang pautos at transliterado ang pangalan ng lugar sa paraang madaling kilalanin.
theological_decisions:
- issue: Kahulugan ng “mga anak ng mga propeta”
  choice: Panatilihin ang literal na idyoma sa teksto at ipaliwanag na maaari itong tumukoy sa mga kasapi ng isang pangkat ng mga propeta.
  alternative: Isalin sa pangunahing teksto bilang “mga alagad ng mga propeta” o “pangkat ng mga propeta.”
  rationale: Iniiwasang gawing tiyak na mga alagad o isang pormal na samahan ang ugnayang hindi lubos na tinutukoy ng parirala, habang pinipigilan ng talababa ang maling pagbasa na pawang mga biyolohikal na anak sila.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang kongkretong Hebreong idyoma sa pangunahing teksto at nilinaw ang mga ito sa mga talababa. Ginamit ang “maliit na sisidlan” sa halip na mas teknikal o di-gaanong karaniwang “prasko.”
