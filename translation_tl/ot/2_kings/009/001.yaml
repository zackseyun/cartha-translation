revisions:
- from: Pagkatapos, tinawag ni Eliseo na propeta ang isa sa mga anak ng mga propeta[b] at sinabi rito, “Bigkisan mo ang iyong baywang[a], kunin mo sa iyong kamay ang maliit na sisidlang ito ng langis, at pumunta ka sa Ramot-gilead.”
  to: Pagkatapos, tinawag ng propetang si Eliseo ang isa sa mga anak ng mga propeta[b] at sinabi rito, “Bigkisan mo ang iyong baywang[a], kunin mo ang maliit na sisidlang ito ng langis at hawakan mo ito sa iyong kamay, at pumunta ka sa Ramot-gilead.”
  rationale: Inayos ang ayos ng pamagat ni Eliseo para sa likas na makabagong Filipino. Pinalitan ang sintaktikong malabong “kunin mo sa iyong kamay” ng magkasunod na “kunin mo ... at hawakan mo ito sa iyong kamay,” upang maipreserba ang utos na kumuha ng sisidlan at ang kongkretong detalye na ito ay nasa kamay, nang hindi ipinahihiwatig na kukunin ito mula sa kamay. Hindi binago ang kahulugan, antas ng rehistro, mga pangalan, o mga angkla at nilalaman ng talababa.
