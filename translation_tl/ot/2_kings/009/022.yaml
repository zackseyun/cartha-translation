  source_fidelity: Tumpak na naipapasa ng draft ang dalawang paglitaw ng שָׁלוֹם bilang “kapayapaan,” ang retorikal na pagtanggi ni Jehu, ang duratibong puwersa ng עַד sa “hangga’t,” ang tuwirang pagtukoy kay Jezebel bilang ina ni Jehoram, at ang plural/intensifying na diwa ng kaniyang mga gawaing pangkukulam.
  naturalness: Karaniwang natural ang daloy. Gayunman, ang “ang marami niyang pangkukulam” ay hindi ang pinakanatural na makabagong Tagalog para sa “her many sorceries”; mas malinaw at idiomatiko ang “ang napakarami niyang gawaing pangkukulam.” Ang “maaaring magkaroon” ay mas natural ding retorikal na anyo kaysa sa simpleng panghinaharap na “magkakaroon.”
  terminology: Ang “mga pakikiapid” ay isang katanggap-tanggap na literal na salin na maaaring magpanatili ng seksuwal, moral, at matalinghagang pahiwatig nang hindi tahasang isinasalin bilang “idolatriya.” Ang “gawaing pangkukulam” ay malinaw na katumbas ng כְּשָׁפִים at hindi nagpapataw ng dagdag na interpretasyon.
