revisions:
- from: Nang makita ni Jehoram si Jehu, sinabi niya, “May kapayapaan ba, Jehu?” Sumagot si Jehu, “Anong kapayapaan ang magkakaroon[a] hangga’t nagpapatuloy ang mga pakikiapid[b] ng iyong inang si Jezebel at ang marami niyang pangkukulam?”
  to: Nang makita ni Jehoram si Jehu, sinabi niya, “May kapayapaan ba, Jehu?” Sumagot si Jehu, “Anong kapayapaan ang maaaring magkaroon[a] hangga’t nagpapatuloy ang mga pakikiapid[b] ng iyong inang si Jezebel at ang napakarami niyang gawaing pangkukulam?”
  rationale: Inayos lamang ang mga bahaging maaaring maging hindi natural sa modernong Tagalog. Pinanatili ng rebisyon ang pag-uulit ng “kapayapaan,” ang patuloy na kundisyon sa “hangga’t,” ang matinding ngunit hindi makitid na talinghaga ng “mga pakikiapid,” at ang plural na diin sa mga gawaing pangkukulam.
