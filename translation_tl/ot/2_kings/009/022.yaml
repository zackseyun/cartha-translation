base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: tl
  text: Nang makita ni Jehoram si Jehu, sinabi niya, “May kapayapaan ba, Jehu?” Sumagot si Jehu, “Anong kapayapaan ang maaaring magkaroon[a] hangga’t nagpapatuloy ang mga pakikiapid[b] ng iyong inang si Jezebel at ang napakarami niyang gawaing pangkukulam?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Anong kapayapaan?” Inuulit ng Hebreo ang salitang “kapayapaan” mula sa tanong ni Jehoram upang idiin ang retorikal na pagtanggi ni Jehu.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pagpapatutot.” Ang salitang Hebreo ay maaaring magkaroon ng literal at matalinghagang pahiwatig, kabilang ang moral at panrelihiyong pagtataksil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Ang pormulang Hebreo ay nagsusulong ng salaysay at nagpapakilala sa pangyayari. Ang “Nang makita” ay natural sa makabagong Tagalog at hindi na nangangailangan ng mabigat na literal na “At nangyari na nang makita.”
- source_word: הֲשָׁלוֹם
  choice: May kapayapaan ba
  rationale: Pinananatili ang pangngalang “kapayapaan” upang maingatan ang pag-uulit at retorikal na sagot ni Jehu, habang malinaw na ipinahihiwatig ang tanong tungkol sa mapayapang layunin o kalagayan.
- source_word: מָה הַשָּׁלוֹם
  choice: Anong kapayapaan ang magkakaroon
  rationale: Ipinahahayag nito ang retorikal na pagtanggi na maaaring magkaroon ng kapayapaan sa kasalukuyang kalagayan, ngunit pinananatili ang pag-uulit sa “kapayapaan.”
- source_word: עַד
  choice: hangga’t nagpapatuloy
  rationale: Sa konteksto, inilalarawan nito ang patuloy na kalagayang humahadlang sa kapayapaan, hindi lamang isang payak na hangganan ng panahon.
- source_word: זְנוּנֵי
  choice: mga pakikiapid
  rationale: Pinananatili ang matindi at sadyang nakagigitlang talinghaga ng Hebreo. Maaari itong tumukoy sa seksuwal, moral, at panrelihiyong pagtataksil nang hindi nililimitahan ang kahulugan sa isa lamang.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: iyong inang si Jezebel
  rationale: Natural itong ayos sa Tagalog at pinananatili ang tuwirang paratang kay Jehoram sa pamamagitan ng pagtukoy kay Jezebel bilang kanyang ina.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: at ang marami niyang pangkukulam
  rationale: Ang “pangkukulam” ay malinaw at kasalukuyang salitang Tagalog para sa mga gawaing mahika o sorcery; ipinahahayag ng “marami” ang tahasang pagdami sa Hebreo.
theological_decisions:
- issue: Kung literal na pananatilihin o palalambutin ang זְנוּנֵי
  choice: mga pakikiapid
  alternative: mga idolatriya; seksuwal na imoralidad; pagtataksil
  rationale: Ang literal na talinghaga ay nagpapanatili sa tindi ng paratang at sa posibleng sabayang moral at panrelihiyong pahiwatig. Hindi nito ipinapasok sa pangunahing teksto ang mas makitid na interpretasyong “idolatriya” lamang.
- issue: Kung ang שָׁלוֹם ay isasaling pareho sa dalawang paglitaw
  choice: kapayapaan sa dalawang paglitaw
  alternative: mabuti ba ang lahat; ligtas ba; mapayapa ba ang pakay mo
  rationale: Ang pare-parehong salin ay nagpapanatili sa leksikal na pag-uulit at matalim na retorikal na pagtutol ni Jehu.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang banggaan sa “kapayapaan” at ang matinding talinghaga ng “mga pakikiapid,” ngunit ginawang natural ang pambungad na pormula ng salaysay.
