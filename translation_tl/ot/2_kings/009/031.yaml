base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: tl
  text: Nang pumasok si Jehu sa pintuang-bayan, sinabi ni Jezebel, “May kapayapaan ba[a], Zimri[b], na pumatay sa kanyang panginoon[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maayos ba ang lahat?”
    reason: lexical_alternative
  - marker: b
    text: Mapanuyang tinawag ni Jezebel si Jehu na “Zimri,” na inihahambing siya kay Zimri, na pumatay sa kanyang panginoon at umagaw sa trono. Tingnan ang 1 Hari 16:9–20.
    reason: cross_reference
  - marker: c
    text: 'Mas literal: “tagapatay ng kanyang panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: pumasok sa pintuang-bayan
  rationale: Ang בּוֹא ay maaaring mangahulugang ‘dumating’ o ‘pumasok.’ Sa pariralang may שַׁעַר, malinaw at natural sa Tagalog ang pagpasok sa pintuang-bayan; ipinahihiwatig rin nito na pasukan ng lungsod ang tinutukoy.
- source_word: וַתֹּאמֶר
  choice: sinabi niya
  rationale: Pambabae at pang-isahan ang pandiwa; tumutukoy ito kay Jezebel ayon sa konteksto. Nananatiling natural ang panghalip sa Tagalog nang hindi inuulit ang pangalan.
- source_word: הֲשָׁלוֹם
  choice: May kapayapaan ba
  rationale: Pinananatili nito ang salitang שָׁלוֹם at ang maikli at matalim na tanong, habang natural pa rin sa modernong Tagalog. Posible rin ang idiomatikong diwang ‘Maayos ba ang lahat?’ kaya inilagay iyon sa talababa.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Pinanatili ang pangalang pantangi. Ginagamit ito ni Jezebel bilang mapanuyang paghahambing kay Jehu sa naunang mang-aagaw ng trono.
- source_word: הֹרֵג
  choice: na pumatay
  rationale: Ang participle ay literal na ‘pumapatay’ o ‘tagapatay.’ Ang ‘na pumatay’ ay malinaw at dignidadong Tagalog at hindi labis na nagpapasya kung legal o moral na pagpaslang ang diin.
- source_word: אֲדֹנָיו
  choice: kanyang panginoon
  rationale: Tumutukoy ang אֲדֹן sa taong nakatataas o hari. Ang ‘panginoon’ ay nagpapanatili sa ugnayan ng kapangyarihan, at ang maliit na titik ay umiiwas sa pag-aakalang banal na titulo ito.
theological_decisions:
- issue: Ang pagtawag ni Jezebel kay Jehu na ‘Zimri’
  choice: Pinanatili bilang mapanuyang pagtawag at ipinaliwanag sa talababa ang paghahambing sa naunang Zimri.
  alternative: Ituring ang ‘Zimri’ bilang literal na pagkilala sa pangalan ng kausap, nang walang paliwanag.
  rationale: Hindi Zimri ang literal na pangalan ni Jehu. Ang kasaysayan sa 1 Hari 16:9–20 ay nagpapakitang ang pagtawag ay isang mapanuyang paghahambing sa taong pumatay sa kanyang panginoon at umagaw ng trono. Hindi isinisingit sa pangunahing teksto ang paliwanag upang mapanatili ang talas at pagkalingid ng alusyon.
- issue: Ang diwa ng הֲשָׁלוֹם
  choice: Isinalin bilang ‘May kapayapaan ba?’ at pinanatiling bukas ang posibleng kahulugang pagtatanong kung maayos ang kalagayan.
  alternative: ‘Maayos ba ang lahat?’ o ‘Naparito ka ba nang mapayapa?’
  rationale: Maaaring tumukoy ang שָׁלוֹם sa kapayapaan, kaligtasan, o mabuting kalagayan. Ang pangunahing salin ay malapit sa anyo ng Hebreo, samantalang kinikilala ng talababa ang natural na alternatibo nang hindi nilulutas nang sapilitan ang retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pintuang-bayan’ upang linawin na pasukan ng lungsod ang שַׁעַר. Pinanatili ang matalim at mapanuyang tono ng pananalita ni Jezebel at ang bahagyang pagkaalangan ng tanong tungkol sa שָׁלוֹם.
