base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: tl
  text: Bumalik si Haring Jehoram sa Jezreel upang gumaling mula sa mga sugat na idinulot sa kanya ng mga Arameo nang makipaglaban siya kay Hazael, na hari ng Aram. Sinabi ni Jehu, “Kung ito ang nais ninyo, huwag hayaang may makatakas mula sa lungsod upang pumunta sa Jezreel at ibalita ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Bumalik
  rationale: Karaniwang kahulugan ng שׁוב sa konteksto; ang naunang pangyayari sa salaysay ang nagpapakitang nakabalik na siya bago nagsalita si Jehu, kaya hindi kailangang dagdagan ng salitang walang tahasang katapat sa Hebreo.
- source_word: לְהִתְרַפֵּא
  choice: upang magpagaling
  rationale: Ipinahihiwatig ng hitpael ng רפא ang pagpapagaling o paggaling mula sa mga pinsala; natural ito sa modernong Filipino at hindi nangangahulugang siya mismo ang lunas.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: sa mga sugat na natamo niya sa mga Arameo
  rationale: Sa konteksto ng labanan, ang 'mga hampas' ay mga sugat. Ang 'natamo niya sa mga Arameo' ay malinaw at natural habang pinananatili kung sino ang sanhi ng mga sugat.
- source_word: אֲרַמִּים
  choice: mga Arameo
  rationale: Pinananatili nito ang makasaysayang pangalang kaugnay ng Aram at iniiwasan ang anachronistic na katawagang 'mga Siriano.'
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: nang makipaglaban siya kay Hazael
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng kalagayan o panahon; likas sa Filipino ang 'nang makipaglaban siya kay.'
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Kung ito ang nais ninyo
  rationale: Ang idyoma ay tumutukoy sa hangarin o pagsang-ayon ng pangkat, hindi literal sa kanilang 'kaluluwa.'
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: huwag hayaang may makatakas mula sa lungsod
  rationale: Sa pagbabawal na ito, ang פָלִיט ay sinumang makalulusot o makatakas, hindi isang nakatakdang uri ng taong tinatawag na takas.
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: upang pumunta sa Jezreel at ibalita ito
  rationale: Ang magkasunod na infinitive ay nagsasaad ng pagpunta roon upang maghatid ng balita; malinaw at natural ang ganitong ayos sa Filipino.
