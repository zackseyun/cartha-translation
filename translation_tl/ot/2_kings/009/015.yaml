revisions:
- from: Bumalik si Haring Jehoram sa Jezreel upang magpagaling sa mga sugat na natamo niya sa mga Arameo nang makipaglaban siya kay Hazael na hari ng Aram. Sinabi ni Jehu, “Kung ito ang nais ninyo, huwag hayaang may makatakas mula sa lungsod upang pumunta sa Jezreel at ibalita ito.”
  to: Bumalik si Haring Jehoram sa Jezreel upang gumaling mula sa mga sugat na idinulot sa kanya ng mga Arameo nang makipaglaban siya kay Hazael, na hari ng Aram. Sinabi ni Jehu, “Kung ito ang nais ninyo, huwag hayaang may makatakas mula sa lungsod upang pumunta sa Jezreel at ibalita ito.”
  rationale: Pinalitan ang posibleng malabong “magpagaling” ng “gumaling mula sa mga sugat,” na malinaw na tumutukoy sa paggaling ni Jehoram. Ginawang mas tuwiran ang pagkakasaad na ang mga Arameo ang nagdulot ng mga sugat. Pinanatili ang lahat ng iba pang kahulugan, mga pangalan, antas ng pananalita, at walang idinagdag na interpretasyong doktrinal.
