  text: וּ/בִ/שְׁנַת֙ אַחַ֣ת עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֖ם בֶּן אַחְאָ֑ב מָלַ֥ךְ אֲחַזְיָ֖ה עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: tl
  text: Nang ikalabing-isang taon ng paghahari ni Joram na anak ni Ahab[a], naging hari ng Juda si Ahazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap pagtugmain ang mga pahayag tungkol sa panahon ng paghahari nina Joram at Ahazias sa Mga Hari at Mga Cronica. Isinalin dito ang tekstong Hebreo ayon sa pagkakasulat nito, nang hindi sinusubukang lutasin ang usaping kronolohikal sa pangunahing teksto.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: Nang ... taon ng paghahari
  rationale: Ang וּבִשְׁנַת ay panandang pamanahon sa isang pormulang pangkronolohiya. Natural sa modernong Tagalog ang “Nang ... taon ng paghahari,” at hindi kailangang ilantad ang panimulang pangatnig na וּ.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: ikalabing-isang taon
  rationale: Ito ang karaniwang ordinal na pagbasa sa pormula ng taon ng paghahari, hindi simpleng bilang na “labing-isang taon.”
- source_word: לְיוֹרָם
  choice: ng paghahari ni Joram
  rationale: Sa pormulang panghari, ang לְ ay tumutukoy sa taon sa loob ng paghahari ni Joram. Idinagdag ang “paghahari” upang maging malinaw at likas sa Tagalog ang tinutukoy na batayan ng petsa.
- source_word: בֶּן אַחְאָב
  choice: na anak ni Ahab
  rationale: Tuwirang patronimiko ito na tumutukoy kung aling Joram ang tinutukoy.
- source_word: מָלַךְ
  choice: naging hari
  rationale: 'Sa pahayag ng pag-akyat sa trono, ang anyong ito ay may ingressive na diwa: nagsimula siyang maghari o naging hari, sa halip na ilarawan ang buong panahon ng paghahari.'
- source_word: אֲחַזְיָה
  choice: Ahazias
  rationale: Ginamit ang anyong pangalang karaniwan at madaling kilalanin sa tradisyong Bibliyang Tagalog.
- source_word: עַל יְהוּדָה
  choice: ng Juda
  rationale: Kasama ng מָלַךְ, ipinahihiwatig ng עַל ang nasasakupang kaharian. Sa natural na Tagalog, sapat at malinaw ang “naging hari ng Juda,” sa halip na literal na “sa ibabaw ng Juda.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang maikling anyo ng pahayag pangkronolohiya at ginamit ang “naging hari” upang ipakita ang pag-akyat sa trono. Ang pantanging pangalang “Ahazias” ay umaayon sa nakasanayang anyo sa Tagalog, samantalang pinanatili ang “Joram,” “Ahab,” at “Juda” bilang madaling makilalang mga pangalang biblikal.
