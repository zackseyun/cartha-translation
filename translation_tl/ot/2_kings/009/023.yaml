  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: tl
  text: Pagkatapos, ibinaling ni Jehoram ang kaniyang mga kamay at tumakas,[a] at sinabi niya kay Ahazias, “Pagtataksil,[b] Ahazias!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinihit niya ang kaniyang mga kamay.” Malamang na tumutukoy ang pahayag sa pagpapaikot niya sa karwahe sa pamamagitan ng mga kamay, ngunit hindi tahasang binabanggit sa Hebreo ang mga renda o ang karwahe rito.
    reason: lexical_alternative
  - marker: b
    text: O “Panlilinlang, Ahazias!”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: ipinihit
  rationale: Ang הפך ay nangangahulugang bumaling o pumihit. Ang “ipinihit” ay natural sa konteksto ng pagpapaikot sa sasakyan ngunit hindi tahasang nagdaragdag ng karwahe o renda.
- source_word: יָדָיו
  choice: ang kanyang mga kamay
  rationale: Literal na maramihan ang Hebreo. Pinananatili nito ang kongkretong pahayag at hindi ipinapalit ang ipinahihiwatig na “mga renda,” na wala sa teksto.
- source_word: וַיָּנֹס
  choice: tumakas
  rationale: Karaniwan at malinaw na salin para sa mabilis na paglayo upang makaiwas sa panganib.
- source_word: מִרְמָה
  choice: Pagtataksil
  rationale: Sa konteksto, isa itong biglaang babala tungkol sa mapanlinlang o taksil na pagkilos. Hindi nito nililimitahan ang kahulugan sa teknikal na “pagtataksil sa pamahalaan.”
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Ahazias
  rationale: Ginamit ang karaniwang anyo ng pangalan sa tradisyong Tagalog/Filipino at pinanatili ang pag-uulit bilang tuwirang pagtawag.
