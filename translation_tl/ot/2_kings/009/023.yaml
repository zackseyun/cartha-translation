translation_notes:
  register: Makabagong Filipino na dignificado at madaling maunawaan. Pinanatili ang di-pangkaraniwang larawan ng “mga kamay” upang hindi dagdagan ang tahasang sinasabi ng Hebreo; ipinaliwanag sa talababa ang malamang na kilos sa karwahe.
