    issue: “Hinubad ng bawat isa ang kanyang kasuutan”
    rationale: Ang וַיִּקְחוּ ay “kinuha,” hindi tuwirang “hinubad.” Maaaring ang damit ay kanilang panlabas na kasuotan, ngunit hindi isinasaad ng pandiwa ang pagkilos ng paghuhubad.
  - severity: low
    issue: “Dali-dali silang kumilos”
    rationale: Naipahihiwatig nito ang pagmamadali ngunit malabo ang kilos. Mas malapit at mas matipid ang “Nagmamadali silang kumuha...”.
  - severity: low
    issue: “tambuli” para sa shofar
    rationale: Bagaman nauunawaan bilang instrumentong hinihipan, maaari itong magpahiwatig ng isang tiyak na lokal na instrumentong wala sa Hebreo. Ang “sungay na pantugtog” ay mas neutral at malinaw.
