base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: tl
  text: Nagmamadali silang kumuha, bawat isa, ng kanyang damit at inilagay ito sa ilalim ni Jehu, sa mga lantad na baitang[a]. Pagkatapos, hinipan nila ang sungay na pantugtog[b] at sinabi, “Hari na si Jehu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pinakamataas na baitang” o “sa lapag ng hagdanan.” Bihira ang pariralang Hebreo, kaya hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: shofar, isang sungay na ginagamit sa pagbibigay-hudyat; karaniwan din itong isinasaling “trumpeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Dali-dali silang kumilos
  rationale: Ipinahahayag ng pandiwang מהר ang mabilis at agarang pagkilos bilang tugon sa naunang sinabi.
- source_word: אִישׁ בִּגְדוֹ
  choice: Hinubad ng bawat isa ang kanyang kasuutan
  rationale: Ginagamit nang pamahagi ang אִישׁ, kaya ‘bawat isa’; malawak ang saklaw ng בגד at ang ‘kasuutan’ ay natural nang hindi nililimitahan ito sa isang tiyak na uri ng balabal.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: inilatag iyon sa ilalim ni Jehu
  rationale: Malamang na si Jehu ang tinutukoy ng hulaping ‘sa ilalim niya.’ Ang ‘inilatag’ ay natural sa kilos na ginagawa sa mga kasuutan, ngunit hindi ipinapalagay ang higit pang detalye.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: sa ibabaw ng mga baitang
  rationale: Bihira at di-tiyak ang pariralang Hebreo. Ipinapahiwatig nito ang isang bahagi o ibabaw ng hagdan, ngunit hindi tiyak kung mismong mga baitang, pinakamataas na baitang, o lapag sa hagdanan.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: hinipan nila ang tambuli
  rationale: Ang שׁוֹפָר ay isang sungay na instrumentong ginagamit sa pagbibigay-hudyat. Ang ‘tambuli’ ay malinaw at likas na salitang Filipino para sa ganitong instrumentong hinihipan.
- source_word: מָלַךְ יֵהוּא
  choice: Hari na si Jehu!
  rationale: Maikli at likas itong pahayag ng pagluklok. Naipahihiwatig ng ‘na’ na naganap na ang pagiging hari ni Jehu, habang pinananatili ang lakas ng proklamasyon.
