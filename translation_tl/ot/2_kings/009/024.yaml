base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: tl
  text: At ibinabat ni Jehu nang buong lakas ang kaniyang pana at tinamaan niya si Jehoram sa pagitan ng mga braso[a]. Lumabas ang palaso mula sa kaniyang puso, at bumagsak siya sa kaniyang karwahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa pagitan ng mga balikat” o “sa pagitan ng mga paypay.” Literal sa Hebreo: “sa pagitan ng kaniyang mga braso,” na maaaring tumukoy sa itaas na bahagi ng likod o sa may balikat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: buong lakas na hinila ... ang kaniyang pana
  rationale: Ang literal na idyomang “pinuno ang kaniyang kamay sa pana” ay tumutukoy sa paghila sa pana nang lubos. Ipinahahayag ito nang natural sa Tagalog habang pinananatili ang lakas ng kilos.
- source_word: וַיַּךְ
  choice: tinamaan
  rationale: Malawak ang kahulugan ng נכה na “humampas/tumama.” Sa kontekstong palaso ang ginamit, natural ang “tinamaan” nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: בֵּין זְרֹעָיו
  choice: sa pagitan ng mga braso
  rationale: Karaniwang nangangahulugang “braso” ang זְרוֹעַ. Pinanatili sa teksto ang literal at malabong anatomikong pahayag; inilagay sa talababa ang posibleng idyomatikong kahulugan.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: Lumusot ang palaso sa kaniyang puso
  rationale: Sa konteksto ng nakamamatay na sugat, maaaring tumukoy ang לֵב sa pisikal na puso. Natural na ipinahihiwatig ng “lumusot” na dumaan at lumabas ang palaso.
- source_word: וַיִּכְרַע
  choice: bumagsak siya
  rationale: Ang כרע ay literal na yumuko o lumuhod, ngunit dito ay inilalarawan ang pagbagsak ng katawan matapos ang nakamamatay na tama.
- source_word: בְּרִכְבּוֹ
  choice: sa loob ng kaniyang karwahe
  rationale: Ipinakikita ng hulaping panghalip na kay Jehoram ang karwahe. Nililinaw ng “sa loob” ang lokasyon nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaniyang” para sa dignidad ng salaysay at “karwahe” bilang karaniwang terminong biblikal. Pinanatili sa pangunahing teksto ang tunay na kalabuan ng בֵּין זְרֹעָיו at ipinaliwanag ang mga posibleng anatomikong pakahulugan sa talababa.
