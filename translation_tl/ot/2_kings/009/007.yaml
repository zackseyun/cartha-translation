  to: At lilipulin mo ang sambahayan ni Ahab na iyong panginoon, at ipaghihiganti ko ang dugo ng aking mga lingkod na propeta at ang dugo ng lahat ng lingkod ni Yahweh mula sa kamay ni Jezebel.[a]
  rationale: Pinalitan ang “na nasa kamay ni Jezebel” ng “mula sa kamay ni Jezebel” upang mapanatili ang sintaktikong kaugnayan ng Hebreong idyoma sa banal na paghihiganti, hindi sa pisikal na kinalalagyan ng dugo. Pinananatili ng talababa ang paglilinaw sa idyomatikong kahulugan nang hindi inaalis ang larawan ng orihinal.
