  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang utos kay Jehu laban sa sambahayan ni Ahab at ang paghihiganti ni Yahweh para sa dugong ibinubo ng kanyang mga lingkod. Gayunman, ang “na nasa kamay ni Jezebel” ay nagpapahiwatig na ang dugo ay literal na nasa kamay niya, samantalang ang מִיַּד אִיזָבֶל ay idyoma ng ahensiya/pananagutan (“mula sa kamay ni Jezebel”).'
