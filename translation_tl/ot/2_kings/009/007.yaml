  terminology: Ang “sambahayan,” “panginoon” (maliit ang titik), “mga lingkod na propeta,” at “Yahweh” ay angkop. Ang “lilipulin” ay katanggap-tanggap sa konteksto ng mapagpasyang hatol laban sa sambahayan/angkan.
