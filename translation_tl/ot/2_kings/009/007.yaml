base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: tl
  text: At lilipulin mo ang sambahayan ni Ahab na iyong panginoon, at ipaghihiganti ko ang dugo ng aking mga lingkod na propeta at ang dugo ng lahat ng lingkod ni Yahweh mula sa kamay ni Jezebel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kamay ni Jezebel,” isang idyomang nangangahulugang “sa kagagawan ni Jezebel” o “na pananagutan ni Jezebel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: At lilipulin mo
  rationale: Sa konteksto ng hatol laban sa isang maharlikang angkan, ang נכה ay tumutukoy sa mapagpasiyang pagpabagsak at pagpatay, hindi lamang sa pananakit. Likas sa modernong Filipino ang “lilipulin” para sa ganitong malawak na hatol.
- source_word: בֵּית אַחְאָב
  choice: ang sambahayan ni Ahab
  rationale: Ang בֵּית sa kontekstong maharlika ay sumasaklaw sa pamilya, sambahayan, at nagpapatuloy na angkan ni Ahab. Pinananatili ng “sambahayan” ang biblikal na larawan nang hindi ito nililimitahan sa gusali.
- source_word: אֲדֹנֶיךָ
  choice: na iyong panginoon
  rationale: Tumutukoy ito sa taong nakatataas kay Jehu. Ang maliit na titik sa “panginoon” ay nagpapakitang hindi ito titulo para sa Diyos.
- source_word: וְנִקַּמְתִּי
  choice: at ipaghihiganti ko
  rationale: Ipinahahayag ng נקם ang makatarungang pagganti ng Diyos alang-alang sa mga pinaslang. Pinananatili ng “ipaghihiganti ko” ang lakas at tuwirang pahayag ng Hebreo.
- source_word: דְּמֵי
  choice: ang dugo ng
  rationale: Ang anyong maramihan na “mga dugo” sa Hebreo ay idyoma para sa dugong ibinubo o pagkakasala sa pagpatay. Natural sa Filipino ang “dugo ng” sa konteksto ng paghihiganti.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: aking mga lingkod na propeta
  rationale: Ipinakikilala ng parirala ang mga propeta bilang mga lingkod ng Diyos; malinaw at natural ang ugnayang ito sa Filipino.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: lahat ng lingkod ni Yahweh
  rationale: Pinananatili nito ang ugnayang pag-aari/paglilingkod sa construct phrase at ang tahasang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: מִיַּד אִיזָבֶל
  choice: na nasa kamay ni Jezebel
  rationale: Pinananatili ang Hebreong idyoma ng kamay bilang larawan ng ahensiya at pananagutan. Nililinaw ng talababa na hindi literal na lokasyon ang pangunahing diwa.
theological_decisions:
- issue: Banal na paghihiganti
  choice: ipaghihiganti ko
  alternative: gagantihan ko
  rationale: Tahasang iniuukol ng talata sa Diyos ang makatarungang paghihiganti para sa dugong ibinubo. Hindi ito pinalalambot o pinalalawak lampas sa sinabi ng teksto.
- issue: Saklaw ng “sambahayan ni Ahab”
  choice: sambahayan ni Ahab
  alternative: dinastiya ni Ahab
  rationale: Pinananatili ng “sambahayan” ang talinghaga at lawak ng Hebreo, samantalang maaaring labis na gawing teknikal o pulitikal lamang ng “dinastiya” ang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang biblikal na idyoma ng angkan, at “lilipulin” upang maipahayag ang mapagpasiyang hatol laban sa buong sambahayan. Inilagay ang panandang [a] pagkatapos ng pariralang nililinaw nito.
