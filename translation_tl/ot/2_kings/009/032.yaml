  source_fidelity: 'Tapat ang salin sa Hebreo: ang pagtingala sa bintana, ang inuulit na tanong na “Sino ...? Sino?”, ang pagdungaw ng maliit na bilang ng mga tauhan, at ang “dalawa o tatlo” ay napreserba. Ang “Sino ang kasama ko?” ay tuwirang salin ng מִי אִתִּי at hindi labis na nagpapakahulugan bilang “kakampi.”'
