base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: tl
  text: Tumingala siya sa bintana at sinabi, “Sino ang kasama ko? Sino?” Pagkatapos, dumungaw sa kaniya ang dalawa o tatlong eunuko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal ng palasyo.” Maaaring tumukoy ang salitang Hebreo sa alinman sa dalawa, bagaman sa konteksto ng palasyo ng hari, malamang na “mga eunuko” ang ibig sabihin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Tumingala siya
  rationale: Ang literal na larawan ay ‘itinaas niya ang kaniyang mukha,’ ngunit sa konteksto ay likas na ipinahahayag sa modernong Tagalog bilang pagtingala sa bintanang nasa itaas.
- source_word: הַחַלּוֹן
  choice: sa bintana
  rationale: Karaniwang katawagan sa bukasan ng palasyo kung saan naroon si Jezebel at ang kaniyang mga lingkod.
- source_word: מִי אִתִּי מִי
  choice: Sino ang kasama ko? Sino?
  rationale: Pinananatili ang tuwirang kahulugan ng אִתִּי at ang mariing pag-uulit ng מִי, nang hindi ipinapasok ang mas interpretatibong ‘Sino ang kakampi ko?’
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: dumungaw sa kaniya
  rationale: Ipinahihiwatig ng pandiwa ang pagtanaw mula sa mataas na kinalalagyan. Ang ‘dumungaw’ ay natural sa Tagalog para sa pagtingin mula sa bintana at akma sa tagpo.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: dalawa o tatlo
  rationale: Natural na Tagalog para sa Hebreong tambalan ng bilang na tumutukoy sa maliit at hindi tiyak na dami.
- source_word: סָרִיסִים
  choice: eunuko
  rationale: Sa konteksto ng palasyo, malamang na literal na mga eunuko ang tinutukoy, bagaman maaari ring mangahulugan ang salita ng mga opisyal ng palasyo; pinapanatili sa talababa ang alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘tumingala’ sa halip na literal na ‘itinaas ang kaniyang mukha,’ at pinanatili ang mariing pag-uulit na ‘Sino?’ Ang panandang [a] ay inilagay kaagad pagkatapos ng salitang tinatalababa.
