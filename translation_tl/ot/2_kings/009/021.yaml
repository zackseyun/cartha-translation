revisions:
- from: Sinabi ni Jehoram, “Ihanda ang karwahe!” At inihanda ang karwahe niya.[a] Pagkatapos, lumabas si Jehoram na hari ng Israel at si Ahazias na hari ng Juda, bawat isa ay sakay ng sarili niyang karwahe. Pumunta sila upang salubungin si Jehu, at natagpuan nila siya sa lupang pag-aari ni Nabot na taga-Jezreel.
  to: Sinabi ni Jehoram, “Ikabit ang mga kabayo sa karwahe!” At ikinabit ang mga kabayo sa kaniyang karwahe.[a] Pagkatapos, lumabas si Jehoram, na hari ng Israel, at si Ahazias, na hari ng Juda, bawat isa ay sakay ng sarili niyang karwahe. Lumabas sila upang salubungin si Jehu, at natagpuan nila siya sa parsela ng lupa ni Nabot na taga-Jezreel.
  rationale: Pinalitan ang malawak na “ihanda” ng pananalitang tumutukoy sa pagkakabit ng mga kabayo sa karwahe, ang ipinahihiwatig ng Hebreong pandiwa sa kontekstong ito. Inayos din ang “lupang pag-aari” bilang “parsela ng lupa” upang maipahayag ang tiyak na bahagi ng lupain. Ang talababa ay pinanatili upang ipakita ang pormal na ikatlong panauhang panlalaking anyo ng Hebreo, nang hindi ipinagpapalagay na ang hari mismo ang gumawa ng paghahanda.
