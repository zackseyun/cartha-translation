base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: tl
  text: Sinabi ni Jehoram, “Ikabit ang mga kabayo sa karwahe!” At ikinabit ang mga kabayo sa kaniyang karwahe.[a] Pagkatapos, lumabas si Jehoram, na hari ng Israel, at si Ahazias, na hari ng Juda, bawat isa ay sakay ng sarili niyang karwahe. Lumabas sila upang salubungin si Jehu, at natagpuan nila siya sa parsela ng lupa ni Nabot na taga-Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pormal na “at ikinabit niya ang kaniyang karwahe”; malamang na ang utos ni Jehoram ay isinagawa ng mga tauhan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Ihanda ang karwahe!
  rationale: Sa konteksto ng karwahe, ang pautos na anyo ng אסר ay tumutukoy sa pagkakabit ng mga hayop sa karwahe. Mas natural sa modernong Tagalog ang maikli at apurahang utos na “Ihanda ang karwahe!” kaysa sa teknikal na paglalarawan ng pagkakabit.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: At inihanda ang karwahe niya
  rationale: Bagaman 3ms ang pandiwa at pormal na mababasang “inihanda niya,” ipinahihiwatig ng naunang utos na isang tauhan ang nagsagawa nito. Pinananatili ng balintiyak na Tagalog ang di-tiyak na tagaganap at hindi ipinapalagay na ang hari mismo ang naghanda.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: bawat isa ay sakay ng sarili niyang karwahe
  rationale: 'Distributibo ang אִישׁ dito: magkahiwalay na karwahe ang sinakyan ng dalawang hari. Likas at malinaw sa Tagalog ang “bawat isa ay sakay ng sarili niyang karwahe.”'
- source_word: לִקְרַאת יֵהוּא
  choice: upang salubungin si Jehu
  rationale: Karaniwang ipinahahayag ng לִקְרַאת ang paglabas upang harapin o salubungin ang isang taong dumarating. Ang “salubungin” ay likas sa konteksto at hindi pa nagpapasiya kung mapayapa o palaban ang pagtatagpo.
- source_word: וַיִּמְצָאֻהוּ
  choice: natagpuan nila siya
  rationale: Ang מצא ay maaaring mangahulugang matagpuan o makatagpo. Pinananatili ng “natagpuan” ang payak na kilos ng salaysay nang hindi dinaragdagan ang tono.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: sa lupang pag-aari ni Nabot
  rationale: Ang חֶלְקָה ay isang takdang bahagi o parsela ng lupa. Ipinahahayag ng “lupang pag-aari” ang mahalagang ugnayang legal at pangkasaysayan ng lupang ito kay Nabot nang mas natural kaysa “parsela.”
- source_word: הַיִּזְרְעֵאלִי
  choice: na taga-Jezreel
  rationale: Ang pang-uring gentiliko ay natural na isinasalin sa modernong Tagalog bilang “taga-Jezreel,” na malinaw na tumutukoy sa pinagmulan ni Nabot.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “karwahe,” “salubungin,” at “lupang pag-aari” bilang natural na salaysay; iniwasan ang labis na teknikal o makalumang pananalita. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na tinutukoy nito.
