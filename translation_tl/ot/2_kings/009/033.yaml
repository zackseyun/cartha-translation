base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: tl
  text: Sinabi niya, “Ihulog ninyo siya!” Kaya inihulog nila siya. Tumilamsik ang ilan sa dugo niya sa pader at sa mga kabayo,[a] at niyurakan niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at tumilamsik ang dugo niya sa pader at sa mga kabayo.” Sa literal, “at tumilamsik mula sa dugo niya patungo sa pader at sa mga kabayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: Ihulog ninyo siya!
  rationale: Ang pautos na anyo ng שמט ay tumutukoy sa pagpapahulog kay Jezebel mula sa bintana. Likas at mariin sa modernong Tagalog ang “ihulog,” at ipinahihiwatig ng “ninyo” na higit sa isang tao ang inuutusan.
- source_word: וישמטוה
  choice: Kaya inihulog nila siya
  rationale: Inuulit ng Hebreo ang ugat ng pandiwang ginamit sa utos. Ang muling paggamit ng “ihulog” ay nagpapanatili sa ugnayang leksikal at nagpapakita ng agarang pagsunod.
- source_word: ויז
  choice: Tumilamsik
  rationale: Ang pandiwa ay naglalarawan ng pagtilamsik o pagsaboy ng likido. Ang “tumilamsik” ay natural sa Tagalog para sa dugong tumama sa mga kalapit na bagay.
- source_word: מדמה
  choice: ang ilan sa dugo niya
  rationale: 'Ang pariralang may מן ay may diwang partitive: may bahagi ng dugo niya na tumilamsik. Pinananatili nito ang anyo at diwa ng Hebreo nang hindi nagiging labis na literal.'
- source_word: הקיר
  choice: sa pader
  rationale: Karaniwang salita ang קיר para sa pader; walang kinakailangang pagpapalawak.
- source_word: הסוסים
  choice: sa mga kabayo
  rationale: Tuwirang salin ng pangmaramihang anyo, malamang na tumutukoy sa mga kabayong kasama ng karwahe o pangkat ni Jehu.
- source_word: וירמסנה
  choice: at niyurakan niya siya
  rationale: Ang רמס ay nangangahulugang yurakan. Isahan ang pandiwa, kaya isang lalaking tauhan—sa konteksto, si Jehu—ang simuno sa gramatika, hindi ang mga kabayo. Pinananatili ng panghalip ang pagkakabuo at bahagyang implicit na pagtukoy ng Hebreo.
