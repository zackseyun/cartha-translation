  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: tl
  text: Pagkatapos, pumasok siya, kumain at uminom. Sinabi niya, “Pakiasikaso ninyo ang isinumpang babaeng ito[a] at ilibing siya, sapagkat anak siya ng isang hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang isinumpang ito.”
    reason: Maaaring hindi tahasang isama sa salin ang “babae,” ngunit pambabae ang anyo ng Hebreo at si Jezebel ang malinaw na tinutukoy sa konteksto.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok siya
  rationale: Sa konteksto, pumasok si Jehu sa gusali o palasyo. Likas sa Tagalog ang “pumasok” at sapat nitong naipapahayag ang kilos nang hindi nagdaragdag ng hindi tahasang binanggit.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: kumain at uminom
  rationale: Tuwirang salaysay ang dalawang pandiwa, at walang layon ang mga ito sa Hebreo; kaya hindi dinagdagan ng “alak” o anumang tiyak na inumin.
- source_word: פִּקְדוּ נָא
  choice: Pakiasikaso ninyo
  rationale: Ang פקד dito ay nangangahulugang pagtuunan o pangasiwaan ang bagay na iniutos, samantalang ang נָא ay nagpapalumanay sa utos. Natural na naipapahayag sa modernong Tagalog ang dalawang sangkap sa “Pakiasikaso ninyo.”
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: ang isinumpang babaeng ito
  rationale: Ang anyong pambabae ay tumutukoy kay Jezebel. Nilinaw ng “babae” ang tinutukoy, habang pinananatili ng “isinumpa” ang lakas ng אֲרוּרָה.
- source_word: וְקִבְרֻהָ
  choice: at ilibing siya
  rationale: Tuwirang utos ito na may hulaping pambabaeng isahan; malinaw at natural ang “ilibing siya.”
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: sapagkat anak siya ng isang hari
  rationale: Ibinibigay ng sugnay ang dahilan ng pagpapalibing. Pinananatili ng “isang hari” ang di-tiyak na anyo ng מֶלֶךְ at itinatampok ang maharlikang katayuan niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pakiasikaso” upang likas na maipahayag kapwa ang utos at ang nagpapalumanay na נָא. Inilagay ang talababa sa pariralang may tunay na leksikal na alternatibo.
