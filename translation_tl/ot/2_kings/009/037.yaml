  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: tl
  text: At ang bangkay ni Jezebel ay magiging parang dumi sa ibabaw ng bukid sa bahagi ng Jezreel[a], kaya hindi nila masasabi, “Ito si Jezebel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa parsela ng Jezreel.” Ang salitang Hebreo na חֵלֶק ay maaaring tumukoy sa isang tiyak na bahagi o parsela ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: At ... ay magiging
  rationale: Ang anyong perpekto na may pang-ugnay ay nagpapatuloy sa naunang pahayag na propetiko at tumutukoy sa mangyayari.
- source_word: נִבְלַת אִיזֶבֶל
  choice: ang bangkay ni Jezebel
  rationale: Tuwiran at natural na katumbas ng pangngalang tumutukoy sa patay na katawan, habang pinananatili ang mabagsik na larawan.
- source_word: כְּדֹמֶן
  choice: parang dumi
  rationale: Pinananatili ang tuwirang paghahambing sa dumi o tae nang hindi pinapahina ang matinding larawan ng Hebreo.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: sa ibabaw ng bukid
  rationale: Natural na Filipino para sa literal na larawang “sa ibabaw/mukha ng bukid.”
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: sa bahagi ng Jezreel
  rationale: Ang חֵלֶק ay maaaring tumukoy sa bahagi, takdang lupain, o parsela; pinananatili ng “bahagi” ang lawak ng kahulugan.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: kaya hindi nila masasabi
  rationale: Ipinahahayag ang resultang hindi na makikilala o maituturong si Jezebel ang mga labi.
- source_word: זֹאת אִיזָבֶל
  choice: Ito si Jezebel
  rationale: Payak at likas na pormula ng pagkilala sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang tahasan at mabagsik na larawan ng orihinal. Ginamit ang “bahagi” sa pangunahing teksto upang hindi labis na paliitin ang posibleng saklaw ng חֵלֶק, habang inilagay sa talababa ang mas tiyak na “parsela.”
