  to: 'Kaya tumayo siya at pumasok sa bahay. Ibinuhos niya ang langis sa kanyang ulo at sinabi sa kanya, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: ‘Pinahiran kita[a] bilang hari ng bayan ni Yahweh, ang Israel.’”'
