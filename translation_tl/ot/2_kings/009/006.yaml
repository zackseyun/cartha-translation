base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: tl
  text: 'Kaya tumayo siya at pumasok sa bahay. Ibinuhos niya ang langis sa kanyang ulo at sinabi sa kanya, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: ‘Pinahiran kita[a] bilang hari ng bayan ni Yahweh, ang Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Pinapahiran kita bilang hari ng bayan ni Yahweh, ang Israel.” Maaaring unawain bilang performative ang Hebrew perfect sa pormula ng pagpapahid na ito—ang pahayag mismo ang pormal na nagtatalaga sa kanya.
    reason: Pinananatili ang posibleng performative na diwa ng מְשַׁחְתִּיךָ nang hindi isinasara ang pagbasa rito bilang katatapos na kilos.
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo siya
  rationale: Ang wayyiqtol ng קום ay kasunod na kilos sa salaysay. Ang “tumayo” ay natural sa makabagong Filipino at hindi makaluma.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: pumasok sa bahay
  rationale: Ipinahihiwatig ng directional ה sa הַבַּיְתָה ang paggalaw papasok; tuwirang naipapahayag ito ng “pumasok sa bahay.”
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: ibinuhos niya ang langis sa ulo nito
  rationale: Karaniwang kahulugan ng יצק ang pagbuhos. Pinananatili ng “ang langis” ang tiyak na langis na ginamit sa ritwal, at nililinaw ng “nito” na ulo ng lalaking pinahiran ang tinutukoy.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Ito ang karaniwang pormula ng mensaherong propetiko. Ang aspektong ganap ng אָמַר ay likas na naihahayag sa Filipino sa “sinabi,” habang ang sipi mismo ay nananatiling kasalukuyang pahayag ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct at pinananatili ang pagkakakilanlan ng Diyos kaugnay ng Israel.
- source_word: מְשַׁחְתִּיךָ
  choice: Pinahiran kitang langis
  rationale: Ang משׁח ay tumutukoy sa pagpapahid o pagpapahid ng langis para sa pagtatalaga. Ginagawang malinaw ng “langis” sa Filipino ang ritwal na katatapos lamang isagawa, bagaman nasa konteksto at hindi inuulit sa pandiwang Hebreo ang salita para sa langis.
- source_word: לְמֶלֶךְ
  choice: bilang hari
  rationale: Ang לְ ay nagpapahayag ng tungkulin o resultang katayuan ng pagpapahid; natural itong tumbasan ng “bilang hari.”
- source_word: אֶל עַם יְהוָה
  choice: sa bayan ni Yahweh
  rationale: Bagaman karaniwang “patungo sa” ang אֶל, sa konteksto ng pagtatalaga bilang hari ay tinutukoy nito ang saklaw ng pamamahala. Sapat na ipinahihiwatig ng “bilang hari sa bayan” ang awtoridad nang hindi dinaragdagan ang teksto.
- source_word: אֶל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang inuulit na אֶל at ang appositional na paglilinaw na ang bayan ni Yahweh ay Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba ng banal na pangalan sa titulong “Panginoon” nang walang pag-aangkat ng denominasyonal na katawagan.
- issue: Lakas ng pahayag na מְשַׁחְתִּיךָ
  choice: Pinahiran kitang langis
  alternative: Pinapahiran kitang langis
  rationale: Maaaring basahin ang Hebrew perfect bilang pagtukoy sa katatapos na kilos o bilang performative na pahayag na nagsasagawa ng pagtatalaga. Pinili sa pangunahing teksto ang ganap na anyo dahil katatapos lamang ibuhos ang langis, ngunit itinatala sa talababa ang tunay na performative na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa עַם at ang natural na “pumasok sa bahay.” Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinatalakay nito; ang lokasyon nito sa ibinigay na English consultation text pagkatapos ng “house” ay maliwanag na hindi tugma sa nilalaman ng talababa.
