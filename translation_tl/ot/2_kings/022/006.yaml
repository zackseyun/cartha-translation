  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: tl
  text: para sa mga bihasang manggagawa, mga tagapagtayo, at mga tagagawa ng pader[a], at para sa pagbili ng kahoy at mga batong mula sa tibagan[b] upang patibayin ang bahay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga gumagawa o nagkukumpuni ng mga pader o bakod.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga tinabas na bato” o “mga pinutol na bato.”
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto, ito ang templo, ang bahay ni Yahweh.
    reason: cross_reference
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: para sa mga bihasang manggagawa
  rationale: Malawak ang kahulugan ng חָרָשׁ at maaaring tumukoy sa iba't ibang bihasang manggagawa, hindi lamang sa mga karpintero.
- source_word: וְלַבֹּנִים
  choice: sa mga tagapagtayo
  rationale: Tuwirang inilalarawan ng participle mula sa בנה ang mga taong gumagawa ng pagtatayo.
- source_word: וְלַגֹּדְרִים
  choice: at sa mga tagagawa ng pader
  rationale: Ang ugat na גדר ay tumutukoy sa paggawa o pagkukumpuni ng pader o bakod; pinananatili ng salin ang kongkretong larawan sa halip na gawing mas malawak na 'mga mason.'
- source_word: וְלִקְנוֹת
  choice: at para bumili
  rationale: Ipinagpapatuloy ng infinitive na may ל ang layunin o paggagamitan ng salapi.
- source_word: עֵצִים
  choice: kahoy
  rationale: Sa konteksto ng mga materyales sa pagtatayo, likas at malinaw sa modernong Filipino ang 'kahoy.'
- source_word: וְאַבְנֵי מַחְצֵב
  choice: at mga batong galing sa tibagan
  rationale: Tumutukoy ang parirala sa batong kinuha mula sa quarry; inilalahad ito sa paraang madaling maunawaan nang hindi ipinapalagay kung gaano na ito kahugis o katabas.
- source_word: לְחַזֵּק
  choice: upang patibayin
  rationale: Pinananatili nito ang pangunahing diwa ng חזק na gawing matibay o malakas, habang ang pagkukumpuni ay nananatiling implikasyon ng konteksto.
- source_word: אֶת־הַבָּיִת
  choice: ang templo
  rationale: Bagaman literal na 'ang bahay,' malinaw sa konteksto na ito ang bahay ni Yahweh; ang 'templo' ang natural at hindi malabong tawag sa modernong Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa הַבָּיִת
  choice: ang templo
  alternative: ang bahay
  rationale: Hindi ito pagdaragdag ng sektaryang pakahulugan kundi paglilinaw sa tiyak na tinutukoy ng karaniwang Hebreong katawagang 'bahay' sa konteksto ng salaysay.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang 'bihasang manggagawa' upang mapanatili ang malawak na saklaw ng unang hanapbuhay, at ang 'tagagawa ng pader' upang mailantad ang tiyak na larawan ng salitang Hebreo. Ang mga pang-ukol ay bahagyang pinasimple para sa natural na daloy ng Filipino.
