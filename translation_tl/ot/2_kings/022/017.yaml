base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: tl
  text: sapagkat tinalikuran nila ako at nagsunog sila ng mga handog para sa ibang mga diyos[a], upang galitin ako sa pamamagitan ng lahat ng gawa ng kanilang mga kamay. Kaya nagliyab ang poot ko laban sa lugar na ito, at hindi ito maaapula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “nagsunog sila ng insenso para sa ibang mga diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: sapagkat
  rationale: Likas at marangal na panandang sanhi sa Filipino, na malinaw na naghahayag ng dahilan ng hatol.
- source_word: עֲזָבוּנִי
  choice: tinalikuran nila ako
  rationale: Pinananatili ang relasyonal at tipanang bigat ng עזב; higit itong angkop kaysa sa payak na “iniwan.”
- source_word: וַיְקַטְּרוּ
  choice: nagsunog sila ng mga handog
  rationale: Sinasaklaw nito ang kultikong paghahandog sa pamamagitan ng pagsunog nang hindi nililimitahan agad sa insenso; nasa talababa ang mas tiyak na posibilidad.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: para sa ibang mga diyos
  rationale: Tuwirang katumbas na malinaw na tumutukoy sa mga diyos maliban kay YHWH.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: upang galitin ako
  rationale: Pinananatili ang layunin o resultang ipinahahayag ng לְמַעַן at ang tahasang wika ng pagpukaw sa galit.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: sa pamamagitan ng lahat ng ginawa ng kanilang mga kamay
  rationale: Pinananatili ang idyomang “mga kamay” at ang pahiwatig sa kanilang mga gawang idolatroso, habang natural pa rin sa Filipino.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: nagliyab ang poot ko
  rationale: Inililipat nang malinaw at natural ang larawan ng nagningas na matinding galit at inihahanda ang kasunod na “mapapatay.”
- source_word: בַּמָּקוֹם הַזֶּה
  choice: laban sa lugar na ito
  rationale: Bagaman literal na “sa lugar na ito,” ipinakikita ng “laban sa” ang lugar bilang tudlaan ng banal na hatol.
- source_word: וְלֹא תִכְבֶּה
  choice: at hindi iyon mapapatay
  rationale: Pinananatili ang metapora ng apoy at ang katiyakan ng hatol; ang “iyon” ay tumutukoy sa nagliyab na poot.
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: Panatilihin ang tahasang “upang galitin ako” at “nagliyab ang poot ko.”
  alternative: Palambutin bilang impersonal na kaparusahan o hatol.
  rationale: Tahasang relasyonal at emosyonal ang wikang Hebreo; hindi ito dapat gawing abstrakto.
- issue: Larawan ng apoy sa banal na hatol
  choice: Panatilihin ang magkakaugnay na “nagliyab” at “hindi ... mapapatay.”
  alternative: Ipaliwanag lamang na tiyak o hindi na mababawi ang kaparusahan.
  rationale: Mahalaga sa talata ang metapora ng apoy; pinananatili nito ang lakas ng pahayag nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang solemneng tono, ang relasyonal na bigat ng “tinalikuran,” at ang magkakaugnay na larawan ng nagliyab at di-mapapatay na poot.
