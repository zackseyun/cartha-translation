base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh. Lubos niyang sinunod ang landas ni David na kanyang ninuno[a], at hindi siya lumihis sa kanan o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “David na kanyang ama.” Ginagamit dito ang “ama” sa mas malawak na kahulugan ng ninuno, lalo na ng ninuno sa dinastiya ng mga hari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ginawa niya ang tama
  rationale: Likas sa modernong Tagalog at pinananatili ang moral na pagtatasa ng substantival na הַיָּשָׁר.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma ng pagsusuri at tahasang isinasalin ang pangalang tipan na יְהוָה bilang Yahweh.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Lubos niyang sinunod ang landas
  rationale: Ipinahahayag ng 'lubos' ang saklaw ng כָּל, samantalang pinananatili ng 'landas' ang talinghaga ng דֶּרֶךְ; mas natural ito kaysa literal na 'lumakad sa buong landas' sa Filipino.
- source_word: דָּוִד אָבִיו
  choice: ni David na kanyang ninuno
  rationale: Sa konteksto ng dinastiya, ang אָבִיו ay tumutukoy sa ninuno, hindi sa agarang ama ni Josias. Isinasalin ito nang malinaw habang nilalagyan ng talababa ang mas literal na anyo.
- source_word: וְלֹא סָר
  choice: at hindi siya lumihis
  rationale: Ang 'lumihis' ay natural na katumbas ng pagtalikod sa wastong landas at pinananatili ang talinghaga ng direksiyon.
- source_word: יָמִין וּשְׂמֹאול
  choice: sa kanan o sa kaliwa
  rationale: Karaniwang pariralang Filipino na tapat sa nakapirming Hebreong pahayag ng hindi paglihis sa alinmang direksiyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa Hebreong teksto, kaya pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Kahulugan ng אָבִיו kaugnay ni David
  choice: kanyang ninuno
  alternative: kanyang ama
  rationale: Hindi agarang ama ni Josias si David; ginagamit dito ang 'ama' sa malawak at dinastikong kahulugan. Nililinaw ng teksto ang historikal na ugnayan nang hindi inaalis sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang mga larawang 'paningin,' 'landas,' at paglihis sa kanan o kaliwa, ngunit ginawang likas ang ayos at pandiwa sa Tagalog.
