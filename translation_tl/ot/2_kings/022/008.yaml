source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Hilkias na punong pari kay Safan na eskriba, “Natagpuan ko sa bahay ni Yahweh[b] ang Aklat ng Kautusan[a].” Ibinigay ni Hilkias ang aklat kay Safan, at binasa niya iyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Balumbon ng Kautusan.” Ang Hebreong סֵפֶר ay maaaring tumukoy sa isang balumbon o dokumentong aklat.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: cultural_note
  - marker: c
    text: O, bagaman hindi gaanong malamang, “at bumasa siya mula rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: punong pari
  rationale: Ito ang malinaw at kinikilalang katumbas ng titulong tumutukoy sa pangunahing katungkulang makapari.
- source_word: עַל שָׁפָן
  choice: kay Safan
  rationale: Sa pandiwa ng pagsasalita, idiomatikong ipinakikilala ng עַל ang taong kinakausap; natural itong “kay Safan” sa Tagalog.
- source_word: הַסֹּפֵר
  choice: eskriba
  rationale: Pinananatili nito ang makasaysayang tungkulin ng isang tagasulat o opisyal na tagapagtala nang hindi ito nililimitahan sa makabagong tungkuling “kalihim.”
- source_word: סֵפֶר הַתּוֹרָה
  choice: Aklat ng Kautusan
  rationale: Sa kontekstong ito, ang תּוֹרָה ay tipang kautusan, at ang סֵפֶר ay dokumentong maaaring aklat o balumbon. Ang “Aklat ng Kautusan” ang malinaw at pamilyar na salin, habang inilalahad sa talababa ang anyong “balumbon.”
- source_word: מָצָאתִי
  choice: Natagpuan ko
  rationale: Tuwirang ipinahahayag nito ang natapos na pagkakatuklas na siyang mahalaga sa kasalukuyang tagpo.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na idyomang Hebreo na “bahay ni Yahweh”; nililinaw sa talababa na ang tinutukoy ay ang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang tipan na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: Ibinigay ... ang aklat
  rationale: Payak at tumpak na katumbas ng נתן at ng tahasang layon nito.
- source_word: וַיִּקְרָאֵהוּ
  choice: at binasa niya iyon
  rationale: Pinakanatural na ipinahihiwatig ng hulaping panghalip na binasa ang dokumento mismo. Ang “niya” ay hindi labis na nililinaw kung sino ang simuno, bagaman si Safan ang pinakamalapit at malamang na tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng תּוֹרָה sa pariralang סֵפֶר הַתּוֹרָה
  choice: Kautusan
  alternative: Tagubilin
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng mas malawak na “tagubilin,” ang kontekstong tipan at legal ng natagpuang dokumento ay sumusuporta sa “Kautusan” nang hindi tinutukoy nang higit sa sinasabi ng talata ang eksaktong nilalaman nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari” bilang natural na titulo at “eskriba” upang mapanatili ang makasaysayang tungkulin. Ang ayos na “Natagpuan ko sa bahay ni Yahweh...” ay natural sa Tagalog at nagpapanatili ng diin sa natagpuang Aklat ng Kautusan. Ang panghalip na “niya” ay hindi sapilitang lumulutas sa bahagyang kalabuan ng simuno sa Hebreo.
