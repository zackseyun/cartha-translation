  revision_rationale: Nilinaw ang tungkulin ni Hilkias bilang siyang magtutuos ng pilak at inayos ang sugnay upang ang mga bantay sa pasukan, hindi ang mga tao, ang malinaw na maging mga nangolekta. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
