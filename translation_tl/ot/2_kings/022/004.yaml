revisions:
- from: Umakyat ka kay Hilkias na punong pari, at ipabilang mo sa kanya ang pilak na dinala sa bahay ni Yahweh, na tinipon mula sa mga tao ng mga bantay sa pasukan.[a]
  to: Umakyat ka kay Hilkias na punong pari, at ipabilang mo kay Hilkias ang pilak na dinala sa bahay ni Yahweh, na tinipon ng mga bantay sa pasukan mula sa mga tao.[a]
  rationale: Nilinaw ang tungkulin ni Hilkias bilang siyang magtutuos ng pilak at inayos ang sugnay upang ang mga bantay sa pasukan, hindi ang mga tao, ang malinaw na maging mga nangolekta. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
