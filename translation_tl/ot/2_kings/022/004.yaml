base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: tl
  text: Umakyat ka kay Hilkias na punong pari, at ipabilang mo kay Hilkias ang pilak na dinala sa bahay ni Yahweh, na tinipon ng mga bantay sa pasukan mula sa mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga bantay ng bungad”; maaari ring “mga bantay-pinto.”
    reason: Pinananatili ang literal na larawan at ang posibleng katawagan sa tungkulin sa templo.
lexical_decisions:
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang direksiyonal na diwa ng Qal imperative na 'umakyat/pumaroon paitaas' at natural itong utos sa Tagalog.
- source_word: חִלְקִיָּהוּ
  choice: Hilkias
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang biblikal.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: punong pari
  rationale: Natural at kinikilalang katumbas sa modernong Tagalog ng titulong tumutukoy sa pinakamataas na katungkulang makapari.
- source_word: וְיַתֵּם
  choice: ipabilang mo sa kanya
  rationale: Sa konteksto ng pondong pangtemplo, ang Hiphil ng תמם ay tumutukoy sa pagkumpleto ng pagtutuos o pagbilang; malinaw na ipinapagawa ito kay Hilkias.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Pinananatili ang literal na 'pilak,' na ginamit ding salapi sa kontekstong ito.
- source_word: הַמּוּבָא
  choice: na dinala
  rationale: Isinasalin ang pasibong participle bilang natapos nang pagdadala ng pilak sa bahay ni Yahweh.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong pariralang Hebreo na 'bahay ni Yahweh' sa halip na gawing tahasang 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ng isang titulo.
- source_word: אָסְפוּ
  choice: tinipon
  rationale: Natural na salitang Tagalog para sa paglikom o pagkolekta ng salapi.
- source_word: שֹׁמְרֵי הַסַּף
  choice: mga bantay sa pasukan
  rationale: Ipinahahayag nang natural ang tungkulin ng mga 'tagapag-ingat ng bungad/threshold' habang iniiwasan ang alanganing literalismo.
- source_word: מֵאֵת הָעָם
  choice: mula sa mga tao
  rationale: Tuwirang inililipat ang pinagmulan ng nakolektang pilak nang hindi nililimitahan ang saklaw ng bayan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili itong Yahweh upang hindi mapalitan ng titulong maaaring magkubli sa pagkakaibang leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'punong pari' at 'mga bantay sa pasukan' bilang likas na mga parirala, habang pinanatili ang 'pilak,' 'bahay ni Yahweh,' at 'Umakyat' upang maingatan ang mahahalagang detalye ng Hebreo.
