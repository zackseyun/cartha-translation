translation:
  language: tl
  text: Pagkatapos ay iniulat ni Safan na eskriba sa hari, “Binigyan ako ni Hilkias, ang pari, ng isang aklat[a].” At binasa iyon ni Safan sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang balumbon.” Maaaring tumukoy ang salitang Hebreo sa anumang nakasulat na dokumento at hindi nito tiyak na isinasaad ang pisikal na anyo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Likas at hindi labis na pormal ang “sinabi” sa salaysay na ito.
- source_word: הַסֹּפֵר
  choice: na eskriba
  rationale: Maaaring tumukoy ang סֹפֵר sa isang opisyal o kalihim ng hari, ngunit pinananatili ng “eskriba” ang makasaysayang titulo at karaniwang leksikal na kahulugan.
- source_word: סֵפֶר
  choice: isang aklat
  rationale: Pangkalahatang katawagan ang סֵפֶר para sa isang nakasulat na dokumento o aklat. Pinananatili ng “isang aklat” ang kawalan ng pantukoy sa Hebreo at hindi nito ipinapalagay ang pisikal na anyo ng dokumento.
- source_word: נָתַן לִי
  choice: binigyan ako
  rationale: Nagsasaad ito ng natapos na kilos na iniulat sa tuwirang pananalita. Natural sa modernong Tagalog ang aspektong perpektibo ng “binigyan.”
- source_word: וַיִּקְרָאֵהוּ
  choice: binasa iyon
  rationale: Kapag nakasulat na bagay ang layon, karaniwang nangangahulugan ang קרא na bumasa nang malakas. Sapat na ipinahihiwatig ng konteksto at ng “sa harap ng hari” na narinig ng hari ang pagbasa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Natural na katumbas ito ng idyomang Hebreo para sa paggawa ng isang bagay sa presensya ng hari.
- source_word: שָׁפָן
  choice: Safan
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: חִלְקִיָּה
  choice: Hilkias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
