source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: tl
  text: 'Noong ikalabingwalong taon ng paghahari ni Haring Josias, isinugo ng hari si Safan, na anak ni Azalias, na anak ni Mesulam, ang eskriba, sa bahay ni Yahweh[a], na may ganitong utos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.” Literal na “bahay ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Nang ikalabingwalong taon ng paghahari ni Haring Josias
  rationale: Likas na salin ng pormula ng pagtatala ayon sa taon ng paghahari; ipinahihiwatig ng pariralang Hebreo ang taon ng paghahari, kaya nilinaw ito sa Filipino nang hindi dinaragdagan ang diwa.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: isinugo ng hari
  rationale: Pinananatili ang pag-uulit ng “hari” sa Hebreo at ang ideya ng pagpapadala sa isang tiyak na atas.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: si Safan, na anak ni Azalias at apo ni Mesulam
  rationale: Ginamit ang mga anyong madaling basahin sa Filipino. Ang ikalawang “anak ni” sa talaangkanan ay natural na ipinahayag na “apo ni,” ayon sa ugnayang malinaw sa sunod-sunod na patronimiko.
- source_word: הַסֹּפֵר
  choice: ang eskriba
  rationale: Malawak at malinaw na katumbas ng סֹפֵר; hindi nito labis na tinutukoy kung ang tungkulin ay kalihim, tagasulat, o ibang opisyal na gawain.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” at ang personal na pangalang Yahweh; sa konteksto, tumutukoy ito sa templo.
- source_word: לֵאמֹר
  choice: 'at sinabi rito:'
  rationale: Natural na panimula sa tuwirang utos na sumusunod. Ang “rito” ay tumutukoy kay Safan at nililinaw na ang hari ang nagsasalita sa kaniya.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo; pinananatili ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Pinananatili sa pangunahing teksto ang metaporang nasa Hebreo, habang inilalagay sa talababa ang malinaw na kontekstuwal na kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “eskriba” upang hindi paliitin ang posibleng saklaw ng opisyal na tungkulin, at inayos ang patronimiko bilang “anak… at apo…” para sa likas na daloy sa Filipino.
