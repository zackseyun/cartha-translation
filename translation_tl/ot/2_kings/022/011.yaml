translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Kautusan” upang ipahayag ang תּוֹרָה sa partikular na kontekstong tipan at legal, habang iniwasang dagdagan ang teksto ng interpretasyong hindi tahasang nasa Hebreo.
