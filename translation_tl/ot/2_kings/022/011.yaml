translation:
  language: tl
  text: Nang marinig ng hari ang mga salita ng Aklat ng Kautusan[a], pinunit niya ang kanyang mga damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Balumbon ng Kautusan.” Ang Hebreong סֵפֶר ay maaaring tumukoy sa isang balumbon o aklat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang וַיְהִי ay nag-uugnay sa sumunod na pangyayari sa daloy ng salaysay, at ang כִּשְׁמֹעַ ay nagsasaad ng panahong pangyayari. Likas na naipahahayag sa Tagalog ng “Nang marinig” ang daloy at pagkakasunod nang hindi gumagamit ng mabigat na “At nangyari na.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Pinananatili ng “mga salita” ang pormal na diwa ng דְּבָרִים at tumutukoy sa binasa o nilalaman ng natagpuang kasulatan.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Aklat ng Kautusan
  rationale: Maaaring tumukoy ang סֵפֶר sa aklat, balumbon, o nakasulat na dokumento. Ang “Aklat ng Kautusan” ay malinaw at nakaugaliang tawag sa kontekstong ito, samantalang pinananatili sa talababa ang lehitimong alternatibong “balumbon.”
- source_word: וַיִּקְרַע
  choice: pinunit niya
  rationale: Ang קרע ay nangangahulugang pumunit. Ang “pinunit niya” ay natural at malinaw sa modernong Tagalog para sa kilos na nagpapahayag ng matinding dalamhati at pagkabigla.
- source_word: בְּגָדָיו
  choice: ang kanyang mga damit
  rationale: Tumpak na pinananatili ang maramihang anyo at panghalip na paari; ang “mga damit” ay mas natural sa karaniwang modernong Tagalog kaysa “mga kasuutan.”
