source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: tl
  text: Pagkatapos, pumunta kay hari si Safan, ang eskriba, at nag-ulat siya sa hari. Sinabi niya, “Ibinuhos ng iyong mga lingkod ang pilak na natagpuan sa bahay[a] at ibinigay nila ito sa mga manggagawang inatasang mangasiwa sa templo ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay.” Ang tinutukoy ay ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: eskriba
  rationale: Pinananatili nito ang katawagang tumutukoy sa opisyal na marunong sumulat at humahawak ng mga tala sa korte; mas tiyak ito kaysa sa pangkalahatang “kalihim.”
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: nag-ulat
  rationale: Ang idyoma ay tumutukoy sa pagbabalik ng balita o ulat. Natural sa modernong Tagalog ang “nag-ulat” at malinaw ang tungkuling administratibo.
- source_word: הִתִּיכוּ
  choice: inilabas
  rationale: Sa konteksto ng pondong nakolekta sa templo, nangangahulugan itong ibinuhos o inalis ang laman mula sa sisidlan, hindi tinunaw ang pilak. Ang “inilabas” ay natural at hindi nagmumungkahi ng prosesong metalurhiko.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Pinananatili ang literal na sangkap na tinutukoy ng Hebrew, bagaman ginagamit din ang salita sa diwang “salapi.”
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: na natagpuan sa templo
  rationale: Literal na “sa bahay,” ngunit sa konteksto ang tinutukoy ay ang templo. Nililinaw ito sa teksto at itinatala ang literal na anyo sa talababa.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: ipinagkatiwala nila iyon sa
  rationale: Ipinahihiwatig ng idyomang “ibinigay sa kamay” ang paghahatid ng isang bagay upang pangasiwaan; natural itong ipinapahayag sa Tagalog bilang “ipinagkatiwala.”
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: mga tagapangasiwa ng mga gumagawa
  rationale: Ang pagkakaugnay ng mga salita ay maaaring tumukoy sa mga gumagawa na inilagay sa pamamahala sa gawain. Iniiwasan ng salin ang malamya at malabong literal na pagkakasunod habang pinananatili ang aspektong pangangasiwa.
- source_word: בֵּית יְהוָה
  choice: templo ni Yahweh
  rationale: Ang “bahay ni Yahweh” ay karaniwang katawagan sa templo. Ang “templo” ang natural at malinaw na katumbas sa kasalukuyang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebrew; pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng titulo.
- issue: Pagkilala sa בַּבַּיִת bilang templo
  choice: templo
  alternative: bahay
  rationale: Malinaw sa konteksto na santuwaryo ni Yahweh ang tinutukoy. Hindi ito teolohikal na pagpapakahulugan kundi kontekstuwal na paglilinaw, habang inilalahad sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “eskriba” bilang tiyak na katawagang pangkasaysayan, “pilak” upang mapanatili ang konkretong salita ng Hebrew, at “ipinagkatiwala” upang natural na maipahayag ang idyomang “ibinigay sa kamay.”
