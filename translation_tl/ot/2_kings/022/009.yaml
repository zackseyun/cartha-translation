revisions:
- from: Pagkatapos, pumunta sa hari si Safan na eskriba at nag-ulat sa hari. Sinabi niya, “Inilabas ng inyong mga lingkod ang pilak na natagpuan sa templo[a] at ipinagkatiwala nila iyon sa mga tagapangasiwa ng mga gumagawa sa templo ni Yahweh.”
  to: Pagkatapos, pumunta kay hari si Safan, ang eskriba, at nag-ulat siya sa hari. Sinabi niya, “Ibinuhos ng iyong mga lingkod ang pilak na natagpuan sa bahay[a] at ibinigay nila ito sa mga manggagawang inatasang mangasiwa sa templo ni Yahweh.”
  rationale: Inayos ang sintaksis upang ang “mga manggagawa” ang siyang inatasang mangasiwa sa templo, alinsunod sa Hebrew. Pinalitan ang “inilabas” ng “ibinuhos” upang mapanatili ang lexical na larawan ng pandiwa, at pinanatili ang literal na “bahay” sa unang pagbanggit kasama ng umiiral na paliwanag sa talababa.
