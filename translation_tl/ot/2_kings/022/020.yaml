  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang inferensiyang לָכֵן, ang mariing הִנְנִי, ang sadyang pag-uulit ng אסף sa “titipunin,” ang pangmaramihang “mga libingan,” at ang tahasang “iyong mga mata.” Ang “kapahamakan” ay wastong pagsasalin ng רָעָה bilang darating na sakuna/hatol, at ang pangwakas na pormula ay wasto ang diwa.'
