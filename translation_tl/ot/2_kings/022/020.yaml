  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: tl
  text: Kaya, narito, titipunin kita sa iyong mga ninuno, at titipunin ka sa iyong mga libingan sa kapayapaan[a]. Hindi makikita ng iyong mga mata ang lahat ng kapahamakang ipapasapit ko sa lugar na ito.” At ibinalik nila sa hari ang mensahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang payapa.” Ang literal na sabi sa Hebreo ay “sa kapayapaan.” Maaaring ang ibig sabihin nito ay mamamatay si Josias bago niya makita ang darating na hatol, at hindi nito kinakailangang tukuyin ang eksaktong paraan ng kanyang pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyong bunga ng pagpapakumbaba at tugon ni Josias sa naunang konteksto.
- source_word: הִנְנִי
  choice: narito
  rationale: Pinananatili ang maringal at mariing pagpapakilala sa pahayag ng Diyos nang hindi gumagamit ng lipas o labis na matalinghagang pananalita.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: titipunin kita … titipunin ka
  rationale: Pinananatili ang pag-uulit ng ugat na אסף at ang idyoma ng pagsama sa mga namatay na ninuno; ang anyong panghinaharap ay natural sa pahayag na ito.
- source_word: עַל אֲבֹתֶיךָ
  choice: sa iyong mga ninuno
  rationale: Ang “mga ninuno” ang malinaw at kasalukuyang katumbas ng idyomatikong “mga ama” para sa mga yumaong salinlahi.
- source_word: קִבְרֹתֶיךָ
  choice: iyong mga libingan
  rationale: Pinananatili ang pangmaramihang anyo ng Hebreo at iniiwasang tukuyin nang higit sa sinasabi ng teksto kung kaninong mga puntod ang tinutukoy.
- source_word: בְּשָׁלוֹם
  choice: sa kapayapaan
  rationale: Malapit sa pangngalang Hebreo at hindi ipinipilit na ang eksaktong paraan ng pagkamatay ni Josias ay tahimik o walang karahasan.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Hindi makikita ng iyong mga mata
  rationale: Pinananatili ang tahasang “iyong mga mata” bilang paksa at ang matingkad na diin ng Hebreo.
- source_word: הָרָעָה
  choice: kapahamakan
  rationale: Sa konteksto, tumutukoy ito sa darating na sakuna bilang hatol, hindi sa moral na kasamaan.
- source_word: מֵבִיא עַל
  choice: ipapasapit ko sa
  rationale: Natural na Filipino para sa pagpaparating ng nalalapit na kapahamakan sa isang lugar.
- source_word: הַמָּקוֹם הַזֶּה
  choice: lugar na ito
  rationale: Direkta at sapat na malawak upang panatilihin ang saklaw ng tinutukoy sa konteksto.
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: ibinalik nila sa hari ang mensahe
  rationale: Natural na pormula sa Filipino para sa pagbabalik na may dalang sagot o ulat sa hari.
theological_decisions:
- issue: Kahulugan ng בְּשָׁלוֹם (“sa kapayapaan”) kaugnay ng pagkamatay ni Josias sa labanan sa 2 Hari 23:29
  choice: Panatilihin ang literal na “sa kapayapaan” at ipaliwanag ang posibleng diwa sa talababa.
  alternative: “nang payapa” bilang tiyak na paglalarawan sa paraan ng kanyang pagkamatay
  rationale: Hindi dapat alisin ng salin ang tensiyon sa pagitan ng pangakong ito at ng kalaunang salaysay. Ipinahihiwatig ng kasunod na sugnay na hindi makikita ni Josias ang kapahamakang darating sa lugar, ngunit hindi nito tahasang nililinaw ang eksaktong paraan ng kanyang kamatayan.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang bahagyang pormal na “narito” para sa bigat ng pahayag ng Diyos, gayundin ang sadyang pag-uulit ng “titipunin” at ang pangmaramihang “mga libingan” upang katawanin ang anyo at idyoma ng tekstong Hebreo.
