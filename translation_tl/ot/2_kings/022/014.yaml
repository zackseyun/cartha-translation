revisions:
- from: Kaya pumunta ang paring si Hilkias, kasama sina Ahikam, Akbor, Safan, at Asaya, sa propetang si Hulda. Siya ang asawa ni Salum, na anak ni Tikva na anak ni Harhas, at tagapag-ingat ng mga kasuotan.[a] Nakatira si Hulda sa Ikalawang Distrito[b] ng Jerusalem. Kinausap nila siya roon.
  to: Pagkatapos, pumunta ang paring si Hilkias, kasama sina Ahikam, Akbor, Safan, at Asaya, kay Huldang propetisa. Siya ay asawa ni Salum, anak ni Tikva at apo ni Harhas. Si Salum ang tagapag-ingat ng mga kasuotan.[a] Nakatira si Hulda sa Ikalawang Distrito[b] ng Jerusalem, at kinausap nila siya.
  rationale: Inayos ang sintaks upang malinaw na si Salum—hindi si Hulda—ang tagapag-ingat ng mga kasuotan. Ginawang “propetisa” ang titulo ni Hulda upang maipakita ang pambabaeng anyo ng Hebreo. Inalis ang hindi kinakailangang “roon,” habang pinanatili ang salinlahing talaan sa natural na anyong Filipino (“anak ... at apo ...”).
