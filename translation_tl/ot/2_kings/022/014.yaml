  naturalness: Malinaw at makabago ang kabuuang daloy, ngunit magiging higit na malinaw kung hiwalay na pangungusap ang pagtukoy sa tungkulin ni Salum. Ang “propetisa” ay isang likas at umiiral na pambabaeng anyo sa Filipino at mas tuwirang nagpapakita ng anyong pambabae sa Hebreo.
  terminology: Pinanatili ang “pari,” hindi “punong pari.” Ginamit ang “propetisa” upang maipakita ang pambabaeng titulong הַנְּבִיאָה. Pinanatili ang mga pangalang Hilkias, Ahikam, Akbor, Safan, Asaya, Hulda, Salum, Tikva, at Harhas.
