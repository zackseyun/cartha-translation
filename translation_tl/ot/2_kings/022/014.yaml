  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: tl
  text: Pagkatapos, pumunta ang paring si Hilkias, kasama sina Ahikam, Akbor, Safan, at Asaya, kay Huldang propetisa. Siya ay asawa ni Salum, anak ni Tikva at apo ni Harhas. Si Salum ang tagapag-ingat ng mga kasuotan.[a] Nakatira si Hulda sa Ikalawang Distrito[b] ng Jerusalem, at kinausap nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tagapag-ingat ng mga damit.” Maaaring tumukoy ito sa isang opisyal na nangangasiwa sa mga kasuotan.
    reason: lexical_alternative
  - marker: b
    text: O “Ikalawang Bahagi.” Malamang na tumutukoy ang Hebreo sa isang partikular na bahagi ng Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Filipino ang “Kaya pumunta” bilang kasunod na pangyayari.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: ang paring si Hilkias
  rationale: “Pari” lamang ang tahasang titulo sa Hebreo; hindi idinagdag ang “punong pari.”
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: ang propetang si Hulda
  rationale: Likas sa modernong Filipino ang “propetang si Hulda”; malinaw sa pangalan at kasunod na panghalip na babae siya, habang pinananatili ang tungkuling propetiko.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: asawa ni Salum
  rationale: Tuwirang ipinapahayag ang ugnayang mag-asawa.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: anak ni Tikva na anak ni Harhas
  rationale: Pinananatili ang dalawang salinlahing talaan ayon sa anyo ng Hebreo.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: tagapag-ingat ng mga kasuotan
  rationale: Malapit ito sa literal na kahulugan at hindi ipinapalagay kung panghari o panseremonya ang mga kasuotan.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Nakatira si Hulda
  rationale: Sa kontekstong panlokasyon, ang יֹשֶׁבֶת ay natural na tumutukoy sa paninirahan, hindi sa literal na pag-upo.
- source_word: בַּמִּשְׁנֶה
  choice: sa Ikalawang Distrito
  rationale: Malamang na pangalan ito ng isang partikular na bahagi ng Jerusalem; ang malaking titik ay naghuhudyat ng katawagang panlugar.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: Kinausap nila siya roon
  rationale: Ipinahihiwatig ng parirala ang tuwirang pakikipag-usap kay Hulda. Idinagdag ang “roon” bilang likas na pang-ugnay sa Filipino, hindi bilang bagong lokasyon.
theological_decisions:
- issue: Kung tatawagin si Hilkias na “punong pari”
  choice: paring si Hilkias
  alternative: punong paring si Hilkias
  rationale: הַכֹּהֵן lamang ang nasa talata. Hindi ipinasok ang mas tiyak na titulong nalalaman mula sa ibang konteksto.
- issue: Pagpapahayag sa pambabaeng anyo ng titulong propetiko
  choice: propetang si Hulda
  alternative: babaeng propeta na si Hulda
  rationale: Walang hiwalay at karaniwang pambabaeng anyo ng “propeta” sa modernong Filipino. Malinaw nang babae si Hulda, kaya hindi kailangang idagdag ang salitang “babae,” ngunit hindi rin ikinukubli ang pambabaeng anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong pangalang madaling bigkasin sa Filipino at iniwasan ang lipas na pananalita. Hinati sa tatlong pangungusap ang mahabang Hebreong pangungusap para sa likas na daloy nang hindi binabago ang nilalaman.
