base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: ‘Narito[a], magdadala ako ng kapahamakan sa lugar na ito at sa mga naninirahan dito—ang lahat ng salita sa aklat na binasa ng hari ng Juda.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Narito ako.” Isang taimtim na panandang nagbibigay-diin sa agarang pahayag at pagkilos ng nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sabi ni Yahweh
  rationale: Likas at marangal na pormula sa makabagong Tagalog para sa pormulang mensaherong propetiko; pinananatili ang pangalang tipan na Yahweh.
- source_word: הִנְנִי
  choice: Narito
  rationale: Nagbibigay ng taimtim na diin at agarang pahayag nang hindi nagdaragdag ng kahulugan.
- source_word: מֵבִיא
  choice: magdadala ako
  rationale: Natural sa Tagalog para sa nalalapit at tiyak na kilos na ipinahahayag ng Hebreong participle.
- source_word: רָעָה
  choice: kapahamakan
  rationale: Sa konteksto, tumutukoy ito sa kalamidad bilang hatol, hindi sa moral na kasamaan.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: sa lugar na ito at sa mga naninirahan dito
  rationale: Malinaw at natural na ipinapahayag ang pinatutungkulan ng hatol at ang mga taong nakatira roon.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: ang lahat ng salita sa aklat
  rationale: Pinananatili ang pormal na salitang 'salita' at ang kaugnayan nito sa katuparan ng mga pahayag sa aklat.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: na binasa ng hari ng Juda
  rationale: Direkta at hindi ipinapalagay na binasa ito nang malakas, sapagkat hindi iyon tahasang nakasaad sa pandiwang Hebreo.
theological_decisions:
- issue: Kahulugan ng רָעָה sa pahayag ng banal na hatol
  choice: kapahamakan
  alternative: kasamaan; kalamidad
  rationale: Ipinahahayag ng konteksto ang parusang sakuna laban sa Juda, hindi na gumagawa ang Diyos ng moral na kasamaan; ang 'kapahamakan' ay tumpak at natural.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal at tipanang pangalan na tuwirang nasa tekstong Hebreo nang walang denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng 'lahat ng salita sa aklat' sa kapahamakan
  choice: gitling upang markahan ang paglilinaw o apposisyon
  alternative: kuwit; gawing tahasang 'bilang katuparan ng'
  rationale: Maluwag ang sintaktikong ugnayan sa Hebreo. Ang gitling ay nagpapanatili sa apposisyonal na puwersa nang hindi idinaragdag ang interpretatibong pariralang 'bilang katuparan ng.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Ganito ang sabi' bilang natural na pormulang propetiko, 'mga naninirahan' sa halip na mas teknikal na 'mga nananahan,' at pinanatili ang pormal na 'lahat ng salita sa aklat.'
