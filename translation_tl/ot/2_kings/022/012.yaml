base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: tl
  text: 'Pagkatapos, iniutos ng hari kina Hilkias na pari[a], Ahikam na anak ni Safan, Acbor na anak ni Micaias, Safan na eskriba[b], at Asaias na lingkod ng hari[c] ang sumusunod:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay “Hilkias na pari,” hindi tahasang “Hilkias na punong pari.”
    reason: lexical_alternative
  - marker: b
    text: O “Safan na kalihim.” Ang salitang Hebreo ay maaaring tumukoy sa isang eskriba o kalihim na nangangasiwa sa mga gawaing administratibo ng hari.
    reason: lexical_alternative
  - marker: c
    text: O “Asaias na opisyal ng hari.” Literal na “lingkod” ang Hebreo, ngunit sa korte ng hari maaari itong tumukoy sa isang opisyal na naglilingkod sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Ipinahihiwatig ng pandiwa ang makapangyarihang utos ng hari at isang naganap na kilos sa salaysay.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan at siyang simuno ng pangungusap.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: Hilkias na pari
  rationale: Ang Hebreo ay nagsasabing “ang pari” at hindi tahasang “ang punong pari.”
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam na anak ni Safan
  rationale: Ang “anak ni” ang natural na Filipino para sa genealogical na pagkakakilanlan.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Acbor na anak ni Micaias
  rationale: Ginamit ang mga anyo ng pangalang angkop sa nakaugaliang transliterasyong Filipino.
- source_word: שָׁפָן הַסֹּפֵר
  choice: Safan na eskriba
  rationale: Maaaring tumukoy ang סֹפֵר sa eskriba o kalihim ng pamahalaan; pinananatili ng “eskriba” ang pangunahing leksikal na kahulugan.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaias na lingkod ng hari
  rationale: Literal na “lingkod” ang עֶבֶד, bagaman sa korte ng hari maaari itong tumukoy sa isang opisyal.
- source_word: לֵאמֹר
  choice: 'na sabihin:'
  rationale: Ipinakikilala nito ang nilalaman ng utos sa susunod na talata; natural sa Filipino ang “na sabihin:” bilang tulay papunta sa kasunod na pahayag.
theological_decisions:
- issue: Katungkulan ni Hilkias
  choice: pari
  alternative: punong pari
  rationale: Hindi tahasang ginagamit sa talata ang titulong “punong pari,” kaya hindi ito idinagdag kahit maaaring ipahiwatig iyon ng mas malawak na konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kina” upang natural na pagsama-samahin ang mga taong inutusan. Pinanatili ang pagkakaiba ng “pari” at “punong pari,” pati ang posibleng administratibong kahulugan ng “eskriba” at “lingkod,” sa pamamagitan ng mga talababa.
