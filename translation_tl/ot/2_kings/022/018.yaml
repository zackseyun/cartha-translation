  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: tl
  text: 'Ngunit sa hari ng Juda, na nagsugo sa inyo upang sumangguni kay Yahweh, ganito ang sabihin ninyo sa kanya: “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Tungkol sa mga salitang narinig mo—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Hebreo ay nakabitin dito at binubuo sa kasunod na talata.
    reason: Nililinaw ang sadyang di-natapos na sintaks nang hindi ito pinupunan o binibigyang-kahulugang lampas sa teksto.
lexical_decisions:
- source_word: וְאֶל
  choice: Ngunit sa
  rationale: Ipinahihiwatig ng וְ kasama ng pang-ukol ang paglipat at paghahambing mula sa naunang kausap tungo sa hari; natural itong naipapahayag ng “Ngunit sa.”
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng pariralang construct at karaniwang katawagan sa modernong Tagalog.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: na nagsugo sa inyo
  rationale: Ang participle ay naglalarawan sa hari ayon sa ginawa niya; malinaw at natural ang sugnay na pasaklaw sa Tagalog.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: upang sumangguni kay Yahweh
  rationale: Sa kontekstong ito, ang דרשׁ ay paghingi ng patnubay o pahayag mula sa Diyos, kaya mas tiyak ang “sumangguni” kaysa sa pangkalahatang “hanapin.”
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: ganito ang sabihin ninyo sa kanya
  rationale: Pinananatili nito ang pormula ng paghahatid ng mensahe at ang puwersa ng utos, sa natural na ayos ng Tagalog.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Karaniwan at marangal na katumbas ito ng pormulang ginagamit ng propetang tagapagdala ng mensahe.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang pinananatili ang pagkakakilanlang tipanan na nasa pariralang Hebreo.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Tungkol sa mga salitang narinig mo—
  rationale: Pinananatili ng “Tungkol sa” at ng gitling ang nakabiting sintaks ng Hebreo, na ipinagpapatuloy at binubuo sa kasunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tetragrammaton sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sumangguni” para sa konteksto ng paghingi ng pahayag mula sa Diyos, at pinanatili ang pag-uulit ng pormulang “ganito” at ang nakabiting huling parirala.
