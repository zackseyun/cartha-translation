  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Sabihin ninyo sa lalaking nagsugo sa inyo sa akin:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay at malinaw na ipinahihiwatig ng anyong pambabae ng pandiwa na si Hulda ang nagsasalita.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na katumbas sa Filipino ng pormulang ginagamit ng mensahero ng Diyos; hindi kailangang gawing kasalukuyang panahunan ang perpektong anyong Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct chain at appositive na pagkakakilanlan kay Yahweh.
- source_word: אִמְרוּ
  choice: Sabihin ninyo
  rationale: Ipinapakita ng “ninyo” na maramihan ang pautos at na ang buong delegasyon ang kinakausap.
- source_word: לָאִישׁ
  choice: sa lalaking
  rationale: Pinananatili ang tiyak at panlalaking sanggunian ng אִישׁ, na sa konteksto ay tumutukoy sa lalaking nagsugo sa delegasyon.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: nagsugo sa inyo sa akin
  rationale: Natural na sugnay sa Filipino na pinananatili si Hulda bilang hantungan ng pagsusugo.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa pinagmulang Hebreo, kaya pinananatili ito bilang Yahweh at hindi pinapalitan ng titulo.
- issue: Kasarian ng אִישׁ
  choice: lalaki
  alternative: tao
  rationale: Ang pangngalan ay panlalaking isahan at tumutukoy sa isang tiyak na lalaking nagsugo sa kanila; hindi ito ginagawang neutral.
- issue: Panahunan ng pormulang כֹּה אָמַר
  choice: Ganito ang sinabi
  alternative: Ganito ang sinasabi
  rationale: Ang Hebreo ay may perpektong anyo. Ang “sinabi” ay natural sa Filipino at pinananatili ang anyo nang hindi binabago ang awtoridad ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nagsugo” sa halip na mas kolokyal na “nagpadala” upang umangkop sa pormal na mensaheng propetiko. Nananatiling bukas ang sipi sapagkat nagpapatuloy ang tuwirang pahayag sa kasunod na talata.
