  text: ו/יתנ/ה עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים ב/בית יְהוָ֑ה וְ/יִתְּנ֣וּ אֹת֗/וֹ לְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁר֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/חַזֵּ֖ק בֶּ֥דֶק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: tl
  text: at ipagkatiwala[a] niya ito sa mga manggagawang inatasang mamahala sa bahay ni Yahweh. Ibigay naman nila ito sa mga manggagawang nasa bahay ni Yahweh upang ayusin ang mga nasirang bahagi ng bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibigay niya ito sa mga kamay ng mga manggagawang inatasan.” Literal na “ibigay sa kamay,” isang idyomang tumutukoy sa pagkakatiwala sa pangangalaga o pamamahala ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Literal na “patibayin ang sira ng bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנָה עַל יַד
  choice: at ipagkatiwala niya ito sa
  rationale: Ang נתן ay literal na ‘ibigay,’ ngunit kasama ng עַל יַד ay tumutukoy sa paglalagay ng salapi sa pangangalaga o pamamahala ng iba. Likas na naihahayag ito ng ‘ipagkatiwala’ sa Filipino.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: mga manggagawa
  rationale: Literal na ‘mga gumagawa ng gawain’; malinaw at natural ang ‘mga manggagawa’ sa konteksto ng pagkukumpuni.
- source_word: הַמֻּפְקָדִים
  choice: inatasang mamahala
  rationale: Ang anyong passive ng פקד ay nagsasaad na sila ay itinalaga o inilagay na nangangasiwa. Ipinapakita ng ‘inatasang mamahala’ kapwa ang pagkatalaga at tungkulin nang hindi nagtatakda ng tiyak na ranggo.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na ‘bahay’ at ang personal na pangalang Yahweh; sa konteksto, tumutukoy ito sa templo.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: Ibigay naman nila ito
  rationale: Tuwirang isinasalin ang נתן bilang ‘ibigay,’ habang ang ‘naman’ ay natural na nagpapakita ng kasunod na hakbang sa pagpapasa ng salapi.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: upang ayusin ang mga nasirang bahagi ng bahay
  rationale: Literal itong ‘patibayin ang sira/pinsala ng bahay.’ Sa konteksto ng gusali, malinaw na tumutukoy ito sa pagkukumpuni ng mga bahaging napinsala.
theological_decisions:
- issue: Pagbanggit sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘bahay ni Yahweh’ upang mapanatili ang pag-uulit ng בית (‘bahay’) sa Hebreo, bagaman ang tinutukoy ay ang templo. Inilagay ang mga talababa sa mga pariralang aktuwal nilang ipinapaliwanag.
