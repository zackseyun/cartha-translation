translation_notes:
  register: Modernong Filipino na malinaw, dignificado, at madaling maunawaan. Ginamit ang “salapi” sa halip na literal na “pilak” dahil malinaw na pananalapi ang konteksto. Ang “hingan ng ulat” ay natural na katumbas ng idyomang tumutukoy sa accounting, at pinananatili sa talababa ang mas literal na anyo.
