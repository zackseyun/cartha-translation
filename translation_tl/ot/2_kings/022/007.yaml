translation:
  language: tl
  text: Ngunit hindi kailangang hingan sila ng ulat tungkol sa salaping ipinagkatiwala sa kanila[a], sapagkat tapat silang gumagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “hindi kailangang papanagutin sila para sa salaping ibinigay sa kanilang pangangasiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Naghahayag ito ng pagbubukod o paglilinaw sa naunang tagubilin; likas at marangal ang “Ngunit” sa modernong Filipino.
- source_word: יֵחָשֵׁב אִתָּם
  choice: hindi na kailangang hingan sila ng ulat
  rationale: Sa kontekstong pampananalapi, tumutukoy ang Niphal ng חשׁב kasama ng אִתָּם sa hindi paghingi sa mga tagapangasiwa ng pagtutuos o ulat. Inihahayag ng salin ang diwa nang natural, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: הַכֶּסֶף
  choice: salapi
  rationale: Literal na “pilak” ang כֶּסֶף ngunit karaniwan itong nangangahulugang salapi sa mga transaksiyong pinansiyal. Mas malinaw sa modernong Filipino ang “salapi” sa kontekstong ito.
- source_word: הַנִּתָּן עַל יָדָם
  choice: ipinagkatiwala sa kanila
  rationale: Ang literal na larawan ay salaping ibinigay “sa kanilang kamay.” Ipinapahayag ng “ipinagkatiwala sa kanila” ang aktuwal na tungkulin at pananagutan ng mga tumanggap sa likas na Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi sila hinihingan ng ulat.
- source_word: בֶאֱמוּנָה
  choice: tapat
  rationale: Dito ang אֱמוּנָה ay tumutukoy sa pagiging mapagkakatiwalaan at matapat sa gawain, hindi sa doktrinal na pananampalataya.
- source_word: הֵם עֹשִׂים
  choice: silang gumagawa
  rationale: Ang literal na “sila ay gumagawa” ay tumutukoy sa tapat nilang pagganap sa iniatas na gawain; pinananatili ng salin ang pangkalahatang pahayag nang hindi dinaragdagan ang teksto.
