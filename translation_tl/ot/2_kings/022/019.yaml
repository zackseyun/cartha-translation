revisions:
- from: Dahil naging sensitibo ang puso mo at nagpakumbaba ka sa harap ni Yahweh nang marinig mo ang sinabi ko laban sa lugar na ito at sa mga naninirahan dito—na sila ay magiging isang kapanglawan[a] at isang sumpa—at dahil pinunit mo ang iyong mga damit at umiyak sa harap ko, dininig din kita, pahayag ni Yahweh.
  to: Dahil malambot ang iyong puso at nagpakumbaba ka sa harap ni Yahweh nang marinig mo ang sinabi ko laban sa lugar na ito at sa mga naninirahan dito, upang maging tiwangwang at isang sumpa, at dahil pinunit mo ang iyong mga damit at umiyak sa harap ko, dininig din kita, pahayag ni Yahweh.
  rationale: Pinalitan ang “sensitibo” ng “malambot” upang mapanatili ang metaporang Hebreo para sa pusong tumutugon nang may pagpapakumbaba. Pinalitan ang “kapanglawan” ng “tiwangwang,” na mas akma sa kahulugang hatol ng שַׁמָּה. Idinagdag ang leksikal na talababa upang mapanatili ang iba pang posibleng saklaw ng termino nang hindi pinipilit ang isang kahulugan.
