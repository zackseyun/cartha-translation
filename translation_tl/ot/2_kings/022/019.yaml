  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: tl
  text: Dahil malambot ang iyong puso at nagpakumbaba ka sa harap ni Yahweh nang marinig mo ang sinabi ko laban sa lugar na ito at sa mga naninirahan dito, upang maging tiwangwang at isang sumpa, at dahil pinunit mo ang iyong mga damit at umiyak sa harap ko, dininig din kita, pahayag ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: Dahil
  rationale: Malinaw na ipinakikilala nito ang dahilan ng tugon ng Diyos at likas ito sa makabagong Tagalog.
- source_word: רַךְ לְבָבְךָ
  choice: naging sensitibo ang puso mo
  rationale: Ipinahahayag ng idyoma ang pusong madaling tumugon at nagsisisi, hindi ang kahinaan; pinananatili rin nito ang larawan ng puso.
- source_word: וַתִּכָּנַע
  choice: nagpakumbaba ka
  rationale: Ipinakikita ng anyong pandiwa ang kusang pagpapakumbaba ni Josias sa harap ng Diyos.
- source_word: מִפְּנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na Tagalog para sa idyomang tumutukoy sa presensiya ng Diyos.
- source_word: בְּשָׁמְעֲךָ
  choice: nang marinig mo
  rationale: Pinananatili ang temporal na kaugnayan sa pagitan ng pakikinig at pagpapakumbaba.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: ang sinabi ko
  rationale: Natural at malinaw na tumutukoy sa nilalaman ng ipinahayag na hatol.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: laban sa lugar na ito at sa mga naninirahan dito
  rationale: Ang 'laban sa' ay umaangkop sa mapanghatol na konteksto ng pahayag.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: na sila ay magiging isang kapanglawan at isang sumpa
  rationale: Ang maramihang 'sila' ay kolektibong tumutukoy sa lugar at mga naninirahan; ang 'kapanglawan' ay nagpapahiwatig ng wasak at nakapanghihilakbot na kalagayan nang hindi lubusang nilulutas ang lawak ng שַׁמָּה.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: pinunit mo ang iyong mga damit
  rationale: Direkta at madaling maunawaang paglalarawan sa kinagawiang tanda ng pagdadalamhati at pagsisisi.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: umiyak sa harap ko
  rationale: Likas sa Tagalog at pinananatili ang personal na banal na pakikipag-usap.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: dininig din kita
  rationale: Sa Tagalog, ang 'dininig' ay malinaw na nagpapahiwatig hindi lamang ng pagkarinig kundi ng pagtugon, gaya ng hinihingi ng konteksto; pinananatili ng 'din' ang pagtutumbas sa tugon ni Josias.
- source_word: נְאֻם יְהוָה
  choice: pahayag ni Yahweh
  rationale: Marangal at maikli itong salin ng pormulang propetiko.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pinananatili ang tipanang pangalan sa tekstong Hebreo, alinsunod sa ibinigay na patakaran, sa halip na palitan ito ng titulo.
- issue: Saklaw ng panghalip sa ipinahayag na kahihinatnan
  choice: sila ay magiging
  alternative: ito ay magiging
  rationale: Maaaring kolektibong saklawin ng pahayag ang lugar at ang mga naninirahan dito. Pinananatili ng maramihang panghalip ang dalawang naunang tinutukoy nang hindi nililimitahan ang hatol sa lugar lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sensitibo ang puso” upang ihatid ang mapagpakumbaba at tumutugong kalooban nang hindi ipakahulugang mahina ang loob. Ang mga gitling-panaklong ay tumutulong na malinaw na ihiwalay ang nilalaman ng hatol.
