  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: tl
  text: Walong taong gulang si Josias nang magsimula siyang maghari, at tatlumpu't isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Jedida, na anak ni Adaya na taga-Bozkat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: Walong taong gulang
  rationale: Likas na salin sa modernong Tagalog ng Hebreong idyoma para sa tiyak na edad.
- source_word: בְמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng parirala ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tumutukoy sa aktuwal na paghahari, hindi lamang sa pagkakaroon ng titulong hari.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: tatlumpu't isang taon
  rationale: Karaniwan at malinaw na anyo ng bilang sa Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong parirala na tumutukoy sa sentro ng kanyang paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at marangal na Tagalog na nagpapanatili sa pormulang pangangkanan.
- source_word: יְדִידָה
  choice: Jedida
  rationale: Isina-Tagalog ang baybay ng pangalang pantangi ayon sa bigkas, nang hindi isinasalin ang kahulugan nito.
- source_word: בַת עֲדָיָה
  choice: anak ni Adaya
  rationale: Likas na Tagalog para sa ugnayang anak na babae; hindi na kailangang tukuyin ang kasarian dahil malinaw na ina ni Josias si Jedida.
- source_word: מִבָּצְקַת
  choice: na taga-Bozkat
  rationale: Ipinakikita ng מִן ang pinagmulan; ang 'taga-' ang pinakanatural na katumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa salaysay. Ginamit ang mga anyong pangalang Josias, Jedida, Adaya, at Bozkat na madaling bigkasin sa Tagalog; pinanatili ang eksaktong edad, haba, at lugar ng paghahari.
