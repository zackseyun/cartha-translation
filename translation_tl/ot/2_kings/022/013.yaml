  source_fidelity: Ang salin ay wastong naghahatid ng utos na sumangguni kay Yahweh, ang tatlong saklaw ng pagsangguni, ang natagpuang aklat, at ang poot ni Yahweh na nag-alab laban sa bayan. Gayunman, ang 'gawin ang lahat ng nakasulat' ay hindi ganap na naipapakita ang כְּכָל ('ayon sa lahat ng'); kailangan ang 'ayon sa' upang mapanatili ang paghahambing/pamantayan ng Hebreo.
