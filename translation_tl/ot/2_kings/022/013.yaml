  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: tl
  text: “Humayo kayo[a] at sumangguni kay Yahweh para sa akin, para sa bayan, at para sa buong Juda tungkol sa mga salita ng aklat na ito na natagpuan. Sapagkat matindi ang poot ni Yahweh na nag-alab laban sa atin, dahil hindi pinakinggan ng ating mga ninuno[b] ang mga salita ng aklat na ito upang gawin ayon sa lahat ng nakasulat tungkol sa atin.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanapin si Yahweh” o “magtanong kay Yahweh.” Maaaring tumukoy ang pandiwang Hebreo sa pangkalahatang paghahanap sa Diyos o sa paghingi sa kanya ng patnubay; sa kontekstong ito, malamang na pormal na pagsangguni ang ibig sabihin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ating mga ama”; tumutukoy rito sa mga ninuno o naunang salinlahi ng bansa.
    reason: lexical_alternative
  - marker: c
    text: Ang “tungkol sa atin” ay maaari ring unawaing “para sa atin” o, ayon sa konteksto ng paghatol, “laban sa atin.”
    reason: ambiguity
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: sumangguni kay Yahweh
  rationale: Sa kontekstong ito, ang דרשׁ na ang Diyos ang tuwirang layon ay tumutukoy sa pormal na paghingi ng pahayag o patnubay mula sa kanya. Mas malinaw dito ang “sumangguni” kaysa sa pangkalahatang “hanapin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na kinakatawan ng Tetragrammaton.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: para sa akin, para sa bayan, at para sa buong Juda
  rationale: Ang בְּעַד ay nagpapahayag ng pagkilos alang-alang sa o bilang kinatawan ng iba. Likas at malinaw sa Filipino ang “para sa” habang napananatili ang tatlong magkahanay na parirala.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: tungkol sa mga salita ng aklat na ito na natagpuan
  rationale: Pinananatili ng “mga salita” ang tekstuwal na pokus ng דִּבְרֵי, at natural na isinasalin bilang sugnay na panuring ang participle הַנִּמְצָא.
- source_word: חֲמַת יְהוָה
  choice: ang poot ni Yahweh
  rationale: Ang חֵמָה ay matinding galit o poot, lalo na sa konteksto ng tipanang paghatol. Ang “poot” ay marangal at sapat ang bigat sa Filipino.
- source_word: נִצְּתָה בָנוּ
  choice: na nag-alab laban sa atin
  rationale: Inilalarawan ng pandiwa ang pagsiklab o pag-aalab. Ang “laban sa atin” ay natural na nagpapakita ng masamang direksiyon ng poot sa konteksto.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: hindi pinakinggan ng ating mga ninuno
  rationale: Pinananatili ng “pinakinggan” ang pandinig na diwa ng שׁמע, samantalang ipinakikita ng kasunod na “upang gawin” ang kasamang diwa ng pagsunod. Natural sa modernong Filipino ang “mga ninuno” para sa mga naunang salinlahi.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: upang gawin ang lahat ng nakasulat
  rationale: Ipinahahayag ng “upang gawin” ang layunin o bunga ng pakikinig, at sa Filipino ang “gawin ang lahat ng nakasulat” ay natural na naghahatid ng diwang pagsunod ayon sa buong nakasulat.
- source_word: עָלֵינוּ
  choice: tungkol sa atin
  rationale: Pinananatili nito ang malawak na diwa ng paglalapat sa kasalukuyang pamayanan nang hindi agad nililimitahan ang kahulugan sa “para sa atin” o “laban sa atin.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang tipanang pangalan. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Pagbanggit sa אֲבֹתֵינוּ
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Ang anyong Hebreo ay panlalaking maramihan at literal na “ating mga ama,” ngunit sa kontekstong pambansa ay tinutukoy nito ang mga naunang salinlahi. Ang “mga ninuno” ang natural na katumbas sa Filipino; itinatala sa talababa ang mas literal na anyo.
- issue: Saklaw ng עָלֵינוּ
  choice: tungkol sa atin
  alternative: para sa atin o laban sa atin
  rationale: Maaaring ipahiwatig ng parirala ang nakasulat na nauukol sa pamayanan, at nagmumungkahi ang konteksto ng paghatol. Hindi tahasang nilulutas ng pangunahing teksto kung ang diin ay simpleng paglalapat o pagsalungat.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Humayo” upang panatilihin ang mariing utos at ang mataas ngunit pamilyar na rehistro ng salaysay; ginamit ang “sumangguni” para sa pormal na paghingi ng pahayag kay Yahweh. Iniwasan ang labis na arkaikong ayos, habang pinanatili ang pag-uulit ng “para sa” at ang bigat ng pahayag tungkol sa tipanang poot.
