  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: tl
  text: At dumating si Naaman kasama ang kanyang mga kabayo at mga karwahe[a], at tumayo siya sa pasukan ng bahay ni Eliseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kasama ang kanyang kabayo at ang kanyang karwahe”; malamang na kolektibo ang gamit ng mga anyong isahan, kaya “mga kabayo at mga karwahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Sa daloy ng salaysay, ipinahihiwatig ng בוא ang pagdating ni Naaman sa kinaroroonan ni Eliseo. Mas natural dito ang “dumating” kaysa “pumaroon.”
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Ginamit ang karaniwang anyo ng pangalan sa makabagong saling Tagalog.
- source_word: בְסוּסוֹ
  choice: kasama ang kanyang mga kabayo
  rationale: Bagaman isahan ang anyong Hebreo, maaaring kolektibo ang gamit nito sa konteksto ng marangal na pangkat ni Naaman. Pinananatili sa talababa ang literal na isahan.
- source_word: וּבְרִכְבּוֹ
  choice: at mga karwahe
  rationale: Ang רֶכֶב ay maaaring tumukoy sa isang karwahe o sa mga karwahe bilang pangkat. Ang maramihan ay natural sa konteksto, habang nakatala sa talababa ang literal na anyo.
- source_word: וַיַּעֲמֹד
  choice: tumayo siya
  rationale: Tuwirang pinananatili ang larawan ng עמד na tumayo o pumuwesto, sa halip na pahinain ito bilang “huminto.”
- source_word: פֶּתַח הַבַּיִת
  choice: sa pasukan ng bahay
  rationale: Ang פֶּתַח ay bukana o pasukan. Ang “pasukan” ay natural at sapat na malawak sa makabagong Tagalog.
- source_word: לֶאֱלִישָׁע
  choice: ni Eliseo
  rationale: 'Sa pariralang ito, ipinakikita ng ל ang kaugnayan o pagmamay-ari: ang bahay ni Eliseo.'
