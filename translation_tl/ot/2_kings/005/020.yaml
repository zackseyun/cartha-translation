base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: tl
  text: Ngunit sinabi ni Gehazi, na lingkod ni Eliseo, ang tao ng Diyos, “Tingnan mo, pinalampas ng aking panginoon si Naaman, ang Arameong ito, sa hindi pagkuha mula sa kanyang kamay ng dala niya. Buhay si Yahweh,[a] hahabulin ko siya at kukuha ako ng isang bagay mula sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Karaniwang pormula ito ng panunumpa sa Hebreo: “Buhay si Yahweh.”'
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: lingkod
  rationale: Sa kontekstong ito, tumutukoy ito sa tungkulin ni Gehazi kay Eliseo, hindi pangunahing sa kanyang edad.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Natural na pamagat sa modernong Filipino para sa propetang kinatawan ng Diyos; iniiwasan ang di-likas na literal na “tao ng Diyos.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang mariing panimulang gamit ng salitang Hebreo sa natural na pananalita.
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: hindi tumanggap
  rationale: Ipinahahayag nang natural ang pagpipigil ni Eliseo na kunin ang handog, habang hindi labis na ipinapasok ang ideyang “kinaawaan” o “pinagbigyan.”
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Tumutukoy sa nakatataas na taong si Eliseo; ang “panginoon” ay marangal at angkop sa ugnayang lingkod-panginoon.
- source_word: הָאֲרַמִּי
  choice: Arameo
  rationale: Tuwirang kinakatawan ang etniko-heograpikong katawagan sa Hebreo, sa halip na ang tradisyonal na “Siriano.”
- source_word: מִיָּדוֹ
  choice: mula sa kamay ni Naaman
  rationale: Pinananatili ang konkretong idyomang Hebreo tungkol sa pagtanggap ng iniaalok ng isang tao.
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  rationale: Natural ngunit marangal na pormula ng panunumpa sa Filipino na pinananatili ang pagtukoy sa buhay ni Yahweh.
- source_word: רַצְתִּי אַחֲרָיו
  choice: hahabulin ko siya
  rationale: Ipinahahayag ang agarang pagtakbo o pagtugis kay Naaman nang natural sa Filipino.
- source_word: מְאוּמָה
  choice: kahit ano
  rationale: Pinananatili ang di-tiyak na saklaw ng Hebreo; sa konteksto, balak ni Gehazi na makakuha ng anumang maibibigay ni Naaman.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ng isang titulo.
- issue: Kahulugan ng חָשַׂךְ sa ugnay nito sa pagtanggi ni Eliseo sa handog
  choice: hindi tumanggap
  alternative: pinagbigyan / hindi pinagsamantalahan
  rationale: Pinananatili ang pangunahing kilos na pagpipigil sa pagtanggap nang hindi nagpapasya kung awa, pag-iingat, o ibang motibo ang ibig sabihin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang diin ng pagsasalita ni Gehazi at ang konkretong “mula sa kamay,” ngunit inayos ang sintaks upang maging natural sa Tagalog.
