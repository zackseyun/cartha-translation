revisions:
- from: Ngunit sinabi ni Gehazi, na lingkod ni Eliseo na lingkod ng Diyos, “Tingnan mo, hindi tumanggap ang aking panginoon mula sa kamay ni Naaman na Arameong ito ng anumang dinala niya. Saksi ang buhay ni Yahweh,[a] hahabulin ko siya at kukuha ako ng kahit ano mula sa kanya.”
  to: Ngunit sinabi ni Gehazi, na lingkod ni Eliseo, ang tao ng Diyos, “Tingnan mo, pinalampas ng aking panginoon si Naaman, ang Arameong ito, sa hindi pagkuha mula sa kanyang kamay ng dala niya. Buhay si Yahweh,[a] hahabulin ko siya at kukuha ako ng isang bagay mula sa kanya.”
  rationale: Inayos ang pamagat ni Eliseo sa “tao ng Diyos,” inalis ang hindi likas na pag-uulit ng “lingkod,” at ginawang natural na Filipino ang pormula ng panunumpa. Ang “pinalampas ... sa hindi pagkuha” ay pinananatili ang ugnayan ng Hebreong “has spared/refrained from taking” nang hindi nagtatakda ng motibo ni Eliseo. Pinanatili ang “mula sa kanyang kamay,” “Arameo,” at “Yahweh.”
