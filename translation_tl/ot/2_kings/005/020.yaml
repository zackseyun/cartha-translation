    text: 'Karaniwang pormula ito ng panunumpa sa Hebreo: “Buhay si Yahweh.”'
    reason: cultural_note
  revision_rationale: Inayos ang pamagat ni Eliseo sa “tao ng Diyos,” inalis ang hindi likas na pag-uulit ng “lingkod,” at ginawang natural na Filipino ang pormula ng panunumpa. Ang “pinalampas ... sa hindi pagkuha” ay pinananatili ang ugnayan ng Hebreong “has spared/refrained from taking” nang hindi nagtatakda ng motibo ni Eliseo. Pinanatili ang “mula sa kanyang kamay,” “Arameo,” at “Yahweh.”
