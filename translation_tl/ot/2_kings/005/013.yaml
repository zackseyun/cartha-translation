revisions:
- from: Pagkatapos, lumapit sa kanya ang kanyang mga lingkod at sinabi, “Ama ko, kung isang mabigat na bagay ang ipinagawa sa iyo ng propeta, hindi mo ba iyon gagawin? Gaano pa kaya ngayong sinabi niya sa iyo, ‘Maligo ka at luminis[a]’?”
  to: Pagkatapos, lumapit sa kanya ang kanyang mga lingkod at sinabi, “Ama ko, kung inutusan ka ng propeta na gumawa ng isang mahirap na bagay, hindi mo ba iyon gagawin? Gaano pa kaya ngayong sinabi niya sa iyo, ‘Maligo ka at maging malinis[a]’?”
  rationale: Pinalitan ang “isang mabigat na bagay ang ipinagawa” ng mas natural na Tagalog na malinaw na tumutukoy sa isang mahirap na utos, alinsunod sa lohika ng talata. Pinalitan ang “luminis” ng “maging malinis” bilang pangunahing salin upang mas tuwirang maipahayag ang Hebreong pautos, habang pinanatili ang “luminis” bilang leksikal na alternatibo sa talababa.
