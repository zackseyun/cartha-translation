  source_fidelity: Maayos na naipapasa ang paglapit at magalang na pangangatwiran ng mga lingkod, pati ang retorikal na paghahambing. Gayunman, ang “isang mabigat na bagay” ay mas makitid kaysa דָּבָר גָּדוֹל, na maaaring tumukoy sa isang dakila, kahanga-hanga, o mahirap na bagay. Ang “ipinagawa” ay kontekstuwal na posible, ngunit mas mabuting ipahayag nang malinaw na ito ay isang utos upang maging likas ang kasunod na “gagawin.”
  naturalness: Likas at marangal ang karamihan ng salin. Mas natural sa modernong Tagalog ang “kung inutusan ka ... na gumawa ng isang mahirap na bagay” kaysa “kung isang mabigat na bagay ang ipinagawa sa iyo.” Ang “Maligo ka at luminis” ay malinaw, bagaman ang “maging malinis” ay mas tuwirang katumbas ng resultang utos.
  terminology: Ang “mga lingkod” at “Ama ko” ay angkop at pinananatili ang paggalang at matalinghagang anyo ng Hebreo. Ang “malinis” ay mahusay na pangunahing katumbas ng טהר, na hindi sapilitang nililimitahan sa pisikal o ritwal na aspekto.
