    rationale: Ang parirala ay bahagi ng argumento na kung handa si Naaman sa isang mahirap o kahanga-hangang utos, lalo na siyang dapat sumunod sa payak na utos. Ang “mahirap na bagay” ay malinaw sa konteksto nang hindi ipinapantay ang “dakila” sa “mabigat.”
