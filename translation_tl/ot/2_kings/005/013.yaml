base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: tl
  text: Pagkatapos, lumapit sa kanya ang kanyang mga lingkod at sinabi, “Ama ko, kung inutusan ka ng propeta na gumawa ng isang mahirap na bagay, hindi mo ba iyon gagawin? Gaano pa kaya ngayong sinabi niya sa iyo, ‘Maligo ka at maging malinis[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luminis.” Ang salitang Hebreo ay maaaring tumukoy sa pagiging malinis o dalisay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ng mga lingkod kay Naaman at likas itong pakinggan sa makabagong Tagalog.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Ang עבד ay maaaring mangahulugang lingkod o alipin. Sa kontekstong ito, mga tauhan sila ni Naaman na magalang na nagpapayo; hindi kailangang idiin ang kanilang legal na katayuan.
- source_word: אָבִי
  choice: Ama ko
  rationale: Pinananatili ang magalang at matalinghagang tawag ng mga nakabababa sa kanilang pinuno, nang hindi ito ginagawang literal na ugnayang pampamilya.
- source_word: דָּבָר גָּדוֹל
  choice: isang mabigat na bagay
  rationale: Sa pangangatwiran ng mga lingkod, tumutukoy ito sa isang dakila, mahirap, o mabigat na ipinagagawa. Ang “mabigat na bagay” ay natural sa Tagalog at ipinapakita ang paghahambing sa payak na utos na maligo.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: hindi mo ba iyon gagawin?
  rationale: Pinananatili ang retorikal na tanong na umaasang positibo ang sagot.
- source_word: וְאַף כִּי
  choice: Gaano pa kaya
  rationale: Malinaw na ipinapahayag sa Tagalog ang pangangatwiran mula sa mas mahirap tungo sa mas madaling gawin.
- source_word: רְחַץ
  choice: Maligo ka
  rationale: Sa konteksto ng paglubog o paghuhugas sa Jordan, natural at tiyak ang “maligo ka” bilang utos.
- source_word: וּטְהָר
  choice: at luminis
  rationale: Ang טהר ay maaaring tumukoy sa pagiging malinis o dalisay. Pinananatili ng “luminis” ang pisikal at kaugnay-sa-kalinisan na mga pahiwatig nang hindi labis na nililinaw ang uri ng paglilinis.
theological_decisions:
- issue: Saklaw ng kahulugan ng טהר sa paggaling ni Naaman
  choice: luminis
  alternative: malinis ka / madalisay ka
  rationale: Kasama sa tagpo ang paggaling mula sa sakit sa balat at ang diwa ng pagiging malinis. Hindi nililimitahan ng “luminis” ang salita sa pisikal lamang o sa ritwal lamang, at iniiwasan nitong magpasok ng mas huling teolohikal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang magalang na “Ama ko” at ang retorikal na pangangatwiran ng mga lingkod. Ginamit ang “ipinagawa” upang likas na maipahayag sa Tagalog ang ipinahihiwatig na utos sa pariralang Hebreo.
