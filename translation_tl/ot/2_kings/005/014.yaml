base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: tl
  text: Kaya bumaba siya at lumublob sa Jordan nang pitong ulit,[a] ayon sa salita ng tao ng Diyos. Nanumbalik ang kanyang laman, gaya ng laman ng isang munting batang lalaki, at naging malinis siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inilubog niya ang sarili.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsawsaw o paglubog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nalinis siya.” Maaaring ipahayag ng Hebreo ang pagiging malinis bilang resulta o ang kinalabasang paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Kaya bumaba siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ipinahihiwatig ng “Kaya” na ginawa ni Naaman ang naunang tagubilin. Pinananatili ng “bumaba” ang kongkretong kilos ng ירד.
- source_word: וַיִּטְבֹּל
  choice: lumublob
  rationale: Ang טבל ay tumutukoy sa paglubog o pagsawsaw. Likas sa modernong Filipino ang “lumublob” kapag ang tao mismo ang lumulubog sa tubig, nang hindi labis na tinutukoy ang eksaktong paraan.
- source_word: בַּיַּרְדֵּן
  choice: sa Jordan
  rationale: Pinananatili ang karaniwang anyo ng pangalang pantangi; malinaw sa konteksto na ilog ang Jordan.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Natural na Filipino para sa pitong pag-uulit ng isang kilos.
- source_word: כִּדְבַר
  choice: ayon sa salita ng
  rationale: Pinananatili ng “salita” ang lawak ng דבר habang ipinakikitang umayon ang ginawa ni Naaman sa sinabi ng propeta.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Ito ang tuwirang salin ng karaniwang titulong propetiko sa Hebreo at pinananatili ang teolohikal na bigat nito.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Nanumbalik ang kanyang laman
  rationale: Tuwirang inilalarawan ng שׁוב ang pagbabalik, at pinananatili ng “laman” ang kongkretong larawan ng בשר nang hindi ito nililimitahan sa balat lamang.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: gaya ng laman ng isang batang paslit
  rationale: Magkasamang ipinahihiwatig ng נער at קטן ang isang batang lalaki o musmos. Ang “batang paslit” ay natural at matingkad, habang inuulit ang “laman” gaya ng Hebreo.
- source_word: וַיִּטְהָר
  choice: naging malinis siya
  rationale: Maaaring ipahayag ng טהר ang pagpasok sa kalagayang malinis. Pinananatili ng “naging malinis” ang resultative na diwa at ang posibleng pisikal at ritwal na mga pahiwatig.
theological_decisions:
- issue: Kalikasan ng pagpapanumbalik kay Naaman
  choice: Ilarawan kapuwa ang panunumbalik ng kanyang laman at ang pagiging malinis niya.
  alternative: Gamitin lamang ang medikal na “gumaling” o itampok lamang ang ritwal na “nalinis.”
  rationale: Magkahiwalay na binabanggit ng talata ang pisikal na panunumbalik at ang kalinisan. Pinananatili ng salin ang dalawang dimensiyon nang hindi nagdaragdag ng sakramental, tipolohikal, o makitid na medikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumublob” bilang natural na paglalarawan ng kusang paglubog sa tubig, at pinanatili ang tradisyonal ngunit madaling maunawaang titulong “tao ng Diyos.”
