  terminology: Ang “Aram,” “Yahweh,” at “tagumpay” ay angkop at matapat sa Hebreo. Ang “panginoon” ay wasto para sa hari bilang nakatataas ni Naaman. Panatilihin ang “sakit sa balat” bilang tekstuwal na render, habang ang talababa ang magpapaliwanag sa צָרַעַת nang hindi ito awtomatikong itinutumbas sa Hansen’s disease.
