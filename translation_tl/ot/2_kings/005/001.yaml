  source_fidelity: Tumpak ang pagsasalin ng katungkulan ni Naaman, ng kanyang mataas na katayuan at paggalang, ng instrumental na “sa pamamagitan niya,” at ng tahasang pagkakaloob ni Yahweh ng tagumpay sa Aram. Gayunman, ang “malubhang” sa “malubhang sakit sa balat” ay nagdaragdag ng antas ng tindi na hindi tahasang isinasaad ng מְצֹרָע. Mas ligtas ang mas malawak na “sakit sa balat,” na nililinaw ng talababa ang sinaunang kategoryang צָרַעַת at ang di-tiyak na katumbas na klinikal.
