id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: tl
  text: Si Naaman, na kumander ng hukbo ng hari ng Aram[a], ay isang taong may mataas na katayuan sa paningin ng kanyang panginoon at lubos na iginagalang, sapagkat sa pamamagitan niya ay pinagkalooban ni Yahweh ng tagumpay[b] ang Aram. Siya ay isang magiting na mandirigma, ngunit mayroon siyang sakit sa balat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “Siria”; sa Hebreo ay “Aram,” ang pangalan ng sinaunang kahariang Arameo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “pagliligtas” o “kaligtasan.” Mas malawak ang saklaw ng salitang Hebreo, ngunit sa kontekstong ito ay tumutukoy ito sa tagumpay sa digmaan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, isang taong may צָרַעַת (tsaraat). Tumutukoy ito sa isang kategorya ng sakit sa balat sa sinaunang konteksto at maaaring hindi eksaktong katumbas ng modernong klinikal na ketong o Hansen’s disease.
    reason: cultural_note
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: Si Naaman
  rationale: Ipinakikilala ang pangunahing tauhan sa natural na salaysay sa Tagalog. Hindi na isinalin nang hiwalay ang pang-ugnay na ו dahil hindi kailangan ang artipisyal na panimulang “Ngayon” sa kontekstong ito.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: kumander ng hukbo ng hari ng Aram
  rationale: Malinaw at makabagong katumbas ito ng katungkulan ni Naaman, habang pinananatili ang Aram bilang tiyak na pangalan ng sinaunang kaharian.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: isang taong may mataas na katayuan sa paningin ng kanyang panginoon
  rationale: Ang אִישׁ גָּדוֹל ay tumutukoy rito sa mataas na katayuan at kahalagahan, hindi kinakailangang sa moral na kadakilaan. Pinananatili ng “sa paningin” ang larawang nasa לִפְנֵי.
- source_word: וּנְשֻׂא פָנִים
  choice: at lubos na iginagalang
  rationale: Natural na ipinahahayag ang idyomang Hebreo na literal na may diwang “itinaas ang mukha,” ibig sabihin ay pinararangalan o pinahahalagahan.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: sapagkat sa pamamagitan niya ay pinagkalooban ni Yahweh ng tagumpay ang Aram
  rationale: Instrumental ang בוֹ, kaya “sa pamamagitan niya.” Sa kontekstong militar, “tagumpay” ang pinakamalinaw na kahulugan ng תְּשׁוּעָה, bagaman maaari rin itong mangahulugang pagliligtas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: גִּבּוֹר חַיִל
  choice: magiting na mandirigma
  rationale: Ipinahahayag nito ang lakas, tapang, at napatunayang kakayahang militar ni Naaman sa natural na modernong Tagalog.
- source_word: מְצֹרָע
  choice: mayroon siyang malubhang sakit sa balat
  rationale: Ang sinaunang terminong Hebreo ay tumutukoy sa taong may malubhang karamdamang nasa kategoryang צָרַעַת, na hindi ligtas na itumbas nang eksakto sa modernong klinikal na ketong o Hansen’s disease.
theological_decisions:
- issue: Ang banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Si Yahweh ang nagkaloob ng tagumpay sa Aram, isang bansang hindi Israelita
  choice: pinagkalooban ni Yahweh ng tagumpay ang Aram
  alternative: pinahintulutan ni Yahweh na magtagumpay ang Aram
  rationale: Tahasan ang Hebreo na si Yahweh ang nagbigay ng tagumpay. Hindi ito pinalambot bilang pahintulot lamang, kaya nananatili ang teolohikal na diin sa kanyang kapangyarihan sa lahat ng bansa.
- issue: Ang saklaw ng תְּשׁוּעָה
  choice: tagumpay
  alternative: pagliligtas o kaligtasan
  rationale: Pinapaboran ng kontekstong militar ang “tagumpay,” ngunit kinikilala sa talababa ang mas malawak na semantikong saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumander” bilang karaniwang nauunawaang katawagang militar, “panginoon” para sa maharlikang nakatataas ni Naaman, at “may mataas na katayuan” upang maiwasang ipakahulugan ang אִישׁ גָּדוֹל bilang awtomatikong papuring moral. Pinanatili ang matinding pagsalungat sa hulihan sa pamamagitan ng “ngunit.”
