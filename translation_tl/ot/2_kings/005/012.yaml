  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: tl
  text: “Hindi ba mas mabuti ang Abana[a] at Farpar, ang mga ilog ng Damasco, kaysa sa lahat ng tubig sa Israel? Hindi ba puwede akong maligo sa mga iyon at luminis[b]?” Kaya tumalikod siya at umalis na galit na galit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Abana ay tinatawag na “Amana” sa ilang tradisyon, ayon sa alternatibong anyo ng pangalan ng ilog.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “maging malinis” o “madalisay”; maaaring tumukoy ang Hebreo kapwa sa pisikal na paglilinis at sa mas malawak na diwa ng pagiging malinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Likas na anyo sa modernong Tagalog ng retorikal na tanong na umaasang sasang-ayon ang kausap; angkop sa dalawang tanong.
- source_word: טוֹב ... מִכֹּל
  choice: mas mabuti ... kaysa sa lahat
  rationale: Malinaw na ipinahahayag ang paghahambing na nasa Hebreo habang pinananatili ang kabuuang saklaw ng 'lahat.'
- source_word: אבנה
  choice: Abana
  rationale: Tuwirang transliterasyon ng anyong Masoretiko; inilalagay sa talababa ang alternatibong tradisyonal na anyong Amana.
- source_word: וּפַרְפַּר
  choice: at Farpar
  rationale: Ang Farpar ay natural na transliterasyon sa ortograpiyang Filipino ng pangalang Hebreo.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: ang mga ilog ng Damasco
  rationale: Natural at tapat na paglilipat ng construct chain.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: kaysa sa lahat ng tubig sa Israel
  rationale: Pinananatili ang mas malawak na salitang 'tubig,' sa halip na paliitin ito sa 'mga ilog.'
- source_word: אֶרְחַץ בָּהֶם
  choice: maligo sa mga iyon
  rationale: Sa konteksto ng paglubog o paghuhugas sa ilog, mas natural ang 'maligo'; ang 'mga iyon' ay malinaw na tumutukoy sa dalawang ilog.
- source_word: וְטָהָרְתִּי
  choice: at luminis
  rationale: Pinananatili ang maaaring pisikal at mas malawak na kahulugan ng pagiging malinis nang hindi tahasang nilulutas bilang ritwal na pagdadalisay.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: tumalikod siya at umalis
  rationale: Pinananatili ang dalawang sunod na kilos at natural ang daloy sa Tagalog.
- source_word: בְּחֵמָה
  choice: na galit na galit
  rationale: Ipinahahayag ang tindi ng חֵמָה sa karaniwan ngunit marangal na modernong Tagalog.
theological_decisions:
- issue: Saklaw ng wikang tumutukoy sa paglilinis
  choice: luminis
  alternative: madalisay / maging malinis
  rationale: Ang konteksto ay paggaling sa sakit sa balat, ngunit ang Hebreo ay maaari ring magpahiwatig ng mas malawak o ritwal na kalinisan. Ang 'luminis' ay nagpapanatili sa magkasanib na mga posibilidad nang hindi nagpapasok ng tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang mga retorikal na tanong at matinding pariralang 'galit na galit' upang mapanatili ang tono ng reklamo at poot ni Naaman. Lahat ng marker ng talababa ay nasa pangunahing teksto.
