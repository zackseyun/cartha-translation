revisions:
- from: Ngunit nagalit si Naaman at umalis. Sinabi niya, “Sinabi ko sa sarili ko, ‘Tiyak na lalabas siya para sa akin, tatayo, tatawag sa pangalan ni Yahweh na kanyang Diyos, ikukumpas ang kanyang kamay sa bahaging may sakit, at pagagalingin ang taong may sakit sa balat[a].’”
  to: Ngunit nagalit si Naaman at umalis. Sabi niya, “Sabi ko nga sa sarili ko, ‘Tiyak na lalabas siya patungo sa akin, tatayo, tatawag sa pangalan ni Yahweh na kanyang Diyos, ikukumpas ang kanyang kamay sa may sakit na bahagi, at pagagalingin ang taong may sakit sa balat[a].’”
  rationale: Kinakailangan ang maliit ngunit mahalagang pagwawasto sa “para sa akin,” upang maipakita na inaasahan ni Naaman na lalabas si Eliseo patungo sa kanya. Pinakinis din ang dalawang parirala para sa natural na modernong Filipino, nang hindi binabago ang kahulugan o nilulutas nang dogmatiko ang kalabuan ng pangwakas na Hebreong parirala.
