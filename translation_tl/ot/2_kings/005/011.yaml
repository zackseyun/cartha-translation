base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: tl
  text: Ngunit nagalit si Naaman at umalis. Sabi niya, “Sabi ko nga sa sarili ko, ‘Tiyak na lalabas siya patungo sa akin, tatayo, tatawag sa pangalan ni Yahweh na kanyang Diyos, ikukumpas ang kanyang kamay sa may sakit na bahagi, at pagagalingin ang taong may sakit sa balat[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “aalisin ang sakit sa balat.” Ang pandiwang Hebreo ay literal na may diwang “tipunin” o “alisin,” at ang huling salita ay maaaring tumukoy sa taong may sakit o sa karamdamang nasa balat.
    reason: Pinananatili ang leksikal at gramatikal na kalabuan ng וְאָסַף הַמְּצֹרָע.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: nagalit
  rationale: Tuwirang ipinapahayag ang galit ni Naaman nang hindi dinaragdagan ang tindi nito.
- source_word: וַיֵּלַךְ
  choice: umalis
  rationale: Sa konteksto, ang paglakad ay paglayo o pag-alis mula sa bahay ni Eliseo.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Sinabi ko sa sarili ko
  rationale: Pinananatili ang Hebreong idyoma ng panloob na pagsasalita sa natural na modernong Tagalog.
- source_word: יֵצֵא יָצוֹא
  choice: Tiyak na lalabas siya
  rationale: Ipinahahayag ng “tiyak” ang diin ng infinitive absolute na kasama ng pandiwa.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: tatawag sa pangalan ni Yahweh na kanyang Diyos
  rationale: Pinananatili ang idyomang “tumawag sa pangalan” at ang personal na pangalang Yahweh.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: ikukumpas ang kanyang kamay sa bahaging may sakit
  rationale: Ang הניף ay tumutukoy sa pagkumpas o pagwagayway; ipinakikita ng konteksto na ang הַמָּקוֹם ay ang apektadong bahagi.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: pagagalingin ang taong may sakit sa balat
  rationale: Sa kontekstong ito, ang אסף ay may diwang pag-aalis ng karamdaman, at ang הַמְּצֹרָע ay maaaring unawain bilang taong dinapuan nito. Iniiwasan ng “sakit sa balat” ang maling pagtukoy nito nang tiyak sa modernong Hansen's disease.
theological_decisions:
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng talata ang banal na pangalang YHWH; pinananatili rito ang pangalang Yahweh sa halip na palitan ito ng titulo.
- issue: Paglalarawan sa מְצֹרָע
  choice: taong may sakit sa balat
  alternative: ketongin / ketong
  rationale: Hindi tiyak na katumbas ng sinaunang kategoryang Hebreo ang modernong Hansen's disease, kaya gumamit ng mas maingat na paglalarawan habang pinananatili ang posibilidad na tao ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong “masdan” at ang medikal na masyadong tiyak na “ketong,” habang pinanatili ang Hebreong idyoma at ang diin ng inaasahan ni Naaman.
