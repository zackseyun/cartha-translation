  source_fidelity: 'Tumpak ang pangunahing diwa: sinabi ni Eliseo kay Naaman na humayo nang payapa, at pagkatapos ay umalis si Naaman. Gayunman, ang "Pagkatapos" ay hindi kailangan upang isalin ang simpleng wayyiqtol na pagpapatuloy, at ang "umalis ... at naglakbay" ay bahagyang nagpapalawak ng isang pandiwang Hebreo ("umalis/nagpatuloy").'
  naturalness: Marangal ang "Humayo ka nang payapa," ngunit mas natural sa makabagong Filipino ang "Humayo kang payapa." Ang "nang may kalayuan" ay hindi gaanong likas sa kasalukuyang Tagalog; ang "nang ilang layo" ay mas malinaw at pinananatiling di-tiyak ang sukat.
  terminology: Wasto ang "payapa" para sa pormula ng pagpapala/pamamaalam at hindi nito ipinahihiwatig na sinang-ayunan ni Eliseo ang naunang sinabi ni Naaman. Walang kailangang ipalit na pangalan o terminong teolohikal.
