  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: tl
  text: At sinabi niya sa kanya, “Humayo kang payapa.” Kaya umalis siya mula sa kanya nang ilang layo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, tumutukoy ito sa isang lawak ng paglalakbay na walang tiyak na sukat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: At sinabi niya sa kanya
  rationale: Pinananatili ang karaniwang daloy ng salaysay sa Hebreo at ang mga panghalip nang hindi na inuulit ang mga pangalang malinaw sa konteksto.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Humayo ka nang payapa
  rationale: Natural at marangal na salin ng nakaugaliang pormula ng pagpapala at pagpapaalam; pinananatili nito ang diwa ng שָׁלוֹם nang hindi dinaragdagan ang kahulugan.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Pagkatapos, umalis siya sa piling niya at naglakbay
  rationale: Ipinahahayag ang kasunod na kilos at ang pag-alis mula sa kinaroroonan ng kausap. Ang “sa piling niya” ay malinaw at natural na katumbas ng מֵאִתּוֹ sa kontekstong ito.
- source_word: כִּבְרַת אָרֶץ
  choice: nang may kalayuan
  rationale: Tumutukoy ang idyoma sa isang di-tiyak na lawak ng nilakbay. Hindi nito ipinapalagay na napakalayo o kaunti lamang ang distansiya.
theological_decisions:
- issue: Ang tugon ni Eliseo matapos ang kahilingan ni Naaman tungkol sa pagsamba sa templo ni Rimon
  choice: Isinalin lamang bilang “Humayo ka nang payapa,” nang walang idinagdag na pagsang-ayon o pagtutol.
  alternative: Ipaliwanag ito bilang tahasang pagsang-ayon sa gagawin ni Naaman, o bilang karaniwang pagpapaalam na walang anumang etikal na pahiwatig.
  rationale: Isang maikling pormula ng pagpapala at pagpapaalam lamang ang sinasabi ng Hebreo. Pinananatili ng salin ang teolohikal at etikal na tensiyon sa halip na lutasin ito sa pamamagitan ng dagdag na interpretasyon.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “humayo” dahil angkop ito sa pormula ng pagpapala, samantalang ang natitirang salaysay ay pinanatiling natural at hindi labis na makaluma.
