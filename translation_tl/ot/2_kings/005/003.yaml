translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “amo” para sa babaeng pinaglilingkuran at “panginoon ko” bilang magalang na pagtukoy kay Naaman. Isinalin nang idyomatiko ang Hebreong “tipunin/kunin mula sa” bilang “pagagalingin ... sa” upang maihatid ang kahulugan nang natural.
