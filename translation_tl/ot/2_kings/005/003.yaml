  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: tl
  text: Sinabi niya sa kanyang amo, “Kung makarating lamang ang panginoon ko sa propetang nasa Samaria! Pagagalingin siya nito mula sa kanyang ketong[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na tradisyonal na isinasaling “ketong” ay maaaring tumukoy nang mas malawak sa isang malubhang sakit sa balat, at hindi lamang sa sakit na Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: kanyang amo
  rationale: Tumutukoy ito sa babaeng nakatataas sa sambahayan. Likas sa modernong Filipino ang “amo” at malinaw sa konteksto na babae ang tinutukoy.
- source_word: אַחֲלֵי
  choice: Kung makarating lamang
  rationale: Pinananatili ng “lamang” ang matinding paghahangad ng optatibong kataga, habang natural na iniuugnay sa pagharap sa propeta.
- source_word: אֲדֹנִי
  choice: ang panginoon ko
  rationale: Magalang na tawag ng dalagita kay Naaman; pinananatili nito ang pagkakaiba sa “kanyang amo” na tumutukoy sa asawa ni Naaman.
- source_word: לִפְנֵי
  choice: makarating ... sa
  rationale: Ang literal na “sa harap ng” ay idyoma ng pagharap o pagpunta sa presensiya ng isang tao. Ang “makarating sa” ay natural sa Filipino sa kontekstong ito.
- source_word: הַנָּבִיא
  choice: propeta
  rationale: Tuwirang salin ng tiyak na pangngalan; hindi pinapalitan ng pangalang Eliseo sapagkat titulo ang nasa Hebreo.
- source_word: בְּשֹׁמְרוֹן
  choice: nasa Samaria
  rationale: Natural na pagpapahayag ng lokasyon ng propeta.
- source_word: אָז
  choice: Pagagalingin niya
  rationale: Ang kasunod na pangungusap mismo ang bunga ng hinihiling na kalagayan; hindi na kailangang ilantad ang “kung magkagayon” sa Filipino.
- source_word: יֶאֱסֹף
  choice: pagagalingin
  rationale: Bagaman ang salitang-ugat ay karaniwang “tipunin/kunin,” sa gamit na ito ay nangangahulugang alisin ang sakit o ibalik mula rito. Ang “pagagalingin” ang malinaw at natural na katumbas sa Filipino.
- source_word: מִצָּרַעְתּוֹ
  choice: sa ketong
  rationale: Ang “ketong” ang tradisyonal at madaling makilalang salin, ngunit nililinaw sa talababa na maaaring mas malawak ang saklaw nito kaysa sa modernong Hansen's disease.
