  to: At hinabol ni Gehazi si Naaman. Nang makita ni Naaman si Gehazi na tumatakbong humahabol sa kanya, bumaba siya mula sa karwahe upang salubungin siya at nagtanong, “Maayos[a] ba ang lahat?”
