  naturalness: Natural ang pangkalahatang register, ngunit mas malinaw at higit na idiomatiko ang “si Gehazi na tumatakbong humahabol sa kanya” kaysa sa kasalukuyang ayos. Ang “At” ay mas neutral na pagsulong ng salaysay kaysa “Kaya,” na maaaring magpahiwatig ng sanhi na hindi tahasang isinasaad ng waw-consecutive.
  terminology: Ang “Maayos ba ang lahat?” ay wastong modernong Filipino para sa idiomatikong gamit ng shalom bilang pagtatanong sa kalagayan. Ang talababa ay dapat ikabit sa mismong ekspresyong ito, hindi sa dulo ng buong sipi.
