base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: tl
  text: At hinabol ni Gehazi si Naaman. Nang makita ni Naaman si Gehazi na tumatakbong humahabol sa kanya, bumaba siya mula sa karwahe upang salubungin siya at nagtanong, “Maayos[a] ba ang lahat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kapayapaan?” Ginagamit dito ang shalom bilang pagbati o pagtatanong kung maayos ang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: hinabol
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Ang “hinabol” ay natural sa Filipino at ipinapakita ang sinasadyang pagsunod nang hindi nagpapahiwatig ng marahas na pag-uusig.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: nakita ni Naaman na tumatakbong humahabol sa kanya si Gehazi
  rationale: Pinananatili nito ang aktuwal na pagkakita, ang patuloy na pagtakbo, at ang direksiyon ng paghabol. Inulit ang mga pangalan kung kailangan upang maiwasan ang kalituhan sa mga panghalip.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: bumaba siya mula sa karwahe
  rationale: Bagaman literal na maaaring mangahulugang “nahulog” ang נפל, idiomatiko itong tumutukoy rito sa mabilis na pagbaba mula sa sasakyan, hindi sa di-sinasadyang pagkahulog.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin ito
  rationale: Ang לקראת ay tumutukoy sa paglapit upang katagpuin o salubungin ang isang tao. Natural at tumpak dito ang “salubungin.”
- source_word: הֲשָׁלוֹם
  choice: Maayos ba ang lahat?
  rationale: Ang שָׁלוֹם ay ginagamit dito bilang karaniwang pagtatanong kung mabuti o maayos ang kalagayan, hindi lamang bilang pagtukoy sa kawalan ng alitan.
- source_word: וַ
  choice: Kaya
  rationale: Ang panimulang waw-consecutive ay nagpapatuloy sa sunod-sunod na salaysay; ipinahahayag ng “Kaya” ang lohikal at pasalaysay na pag-usad sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang pangalang Gehazi sa ikalawang pangungusap upang maging malinaw kung sino ang tumatakbo; pinanatili ang natural na panghalip para kay Naaman sa kasunod na kilos.
