base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: tl
  text: Nagsugo si Eliseo ng isang mensahero kay Naaman upang sabihin, “Pumunta ka at maligo nang pitong ulit sa Jordan. Manunumbalik sa dating kalagayan ang iyong laman[a], at magiging malinis ka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “babalik sa iyo ang iyong laman.” Ipinahihiwatig ng idyomang Hebreo ang pagbabalik sa dating malusog na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lilinis ka.” Ang pandiwa ay maaaring mangahulugang maging malinis o dalisay at may kapwa pisikal at ritwal na pahiwatig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Nagsugo
  rationale: Karaniwang salaysay na gamit ng שלח; malinaw at likas sa modernong Tagalog.
- source_word: אֵלָיו
  choice: kay Naaman
  rationale: Ang panghalip ay tumutukoy kay Naaman sa konteksto. Ginawang tahasan ang pangalan upang maging malinaw at natural sa Tagalog.
- source_word: מַלְאָךְ
  choice: isang mensahero
  rationale: Tao ang tinutukoy sa salaysay, hindi makalangit na anghel.
- source_word: לֵאמֹר
  choice: na nagsabi
  rationale: Likas na katumbas ng pormulang Hebreo na nagpapakilala sa tuwirang pananalita.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Humayo ka at maligo
  rationale: Ipinapahayag ang puwersang pautos at ang pagkakasunod ng pagpunta at paliligo.
- source_word: שֶׁבַע פְּעָמִים
  choice: pitong ulit
  rationale: Tuwirang salin ng bilang at dalas sa natural na Tagalog.
- source_word: בַּיַּרְדֵּן
  choice: sa Jordan
  rationale: Sapat ang kilalang pangalang pantangi; hindi kailangang idagdag ang “Ilog.”
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: Manunumbalik sa dati ang iyong laman
  rationale: Pinananatili ang kongkretong “laman” at ang ideya ng pagbabalik, habang ipinahahayag sa natural na Tagalog ang pagpapanumbalik sa dating malusog na kalagayan.
- source_word: וּטְהָר
  choice: at magiging malinis ka
  rationale: Pinananatili ang resulta at ang saklaw ng pandiwa na maaaring tumukoy kapwa sa pisikal na paggaling at sa pagiging malinis o dalisay.
theological_decisions:
- issue: Kung isasalin ang בשר bilang “laman” o papalitan ng mas pangkalahatang “katawan”
  choice: laman
  alternative: katawan
  rationale: Ang “laman” ang kongkretong salita sa Hebreo at malinaw pa rin sa konteksto ng karamdaman at paggaling.
- issue: Kung bibigyang-diin ng טהר ang pisikal na paggaling o ritwal na paglilinis
  choice: magiging malinis ka
  alternative: lilinisin ka
  rationale: Hindi nito nilulutas nang labis ang tunay na saklaw ng pandiwa; maaari nitong taglayin ang pisikal at ritwal na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Humayo” upang mapanatili ang maikli at tuwirang utos, at “laman” upang mapanatili ang matingkad na katawagang pangkatawan ng Hebreo.
