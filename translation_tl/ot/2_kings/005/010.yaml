revisions:
- from: Nagsugo si Eliseo ng isang mensahero kay Naaman na nagsabi, “Humayo ka at maligo nang pitong ulit sa Jordan. Manunumbalik sa dati ang iyong laman[a], at magiging malinis ka[b].”
  to: Nagsugo si Eliseo ng isang mensahero kay Naaman upang sabihin, “Pumunta ka at maligo nang pitong ulit sa Jordan. Manunumbalik sa dating kalagayan ang iyong laman[a], at magiging malinis ka[b].”
  rationale: Inayos ang sintaks upang malinaw na ang mensahero ang naghahatid ng sinabi ni Eliseo, ginawang mas natural ang utos sa modernong Filipino, at nilinaw ang idiomang pagpapanumbalik ng laman. Pinanatili ang kahulugan, bilang, pangalan, at sadyang malawak na saklaw ng ‘magiging malinis.’ Inayos din ang alternatibong salin sa talababa b upang tumugma sa anyong pandiwa ng Hebreo.
