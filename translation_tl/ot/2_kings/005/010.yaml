    issue: Malabong pagkakaugnay ng ‘na nagsabi’
    rationale: Sa ‘Nagsugo si Eliseo ng isang mensahero kay Naaman na nagsabi,’ maaaring iugnay ng mambabasa ang sugnay sa pinakamalapit na pangngalan, si Naaman. Ang ‘upang sabihin’ ay malinaw na ang mensahero ang tagapagdala ng mensahe.
  - severity: low
    issue: Hindi ganap na likas ang ‘Manunumbalik sa dati ang iyong laman’
    rationale: Nauunawaan ito, ngunit ang ‘sa dati’ ay masyadong pinaikli sa modernong Filipino. Ang ‘sa dating kalagayan’ ay mas malinaw na nagpapahayag ng idiomatikong pagpapanumbalik na nasa Hebreo.
  - severity: low
    issue: Ang talababa b ay nagmumungkahi ng passive na ‘malilinis ka’
    rationale: Ang Hebreong וּטְהָר ay mas tuwirang ‘magiging malinis’ o ‘lilinis ka.’ Maaaring panatilihin ang saklaw na pisikal at ritwal nang hindi ginagawang tahasang passive ang pandiwa.
