revisions:
- from: Sinabi ni Naaman, “Kung gayon, ipagkaloob sana sa iyong lingkod ang lupang[a] kayang dalhin ng dalawang mula, sapagkat mula ngayon ay hindi na maghahandog ang iyong lingkod ng handog na sinusunog o ng ibang hain sa ibang mga diyos, kundi kay Yahweh lamang.[b]”
  to: Sinabi ni Naaman, “Kung hindi, ipagkaloob sana sa iyong lingkod ang lupang[a] kasindami ng kayang dalhin ng isang pares ng mga mula, sapagkat hindi na maghahandog ang iyong lingkod ng handog na sinusunog o hain sa ibang mga diyos, kundi kay Yahweh lamang.[b]”
  rationale: Pinalitan ang "Kung gayon" ng "Kung hindi" upang maipahayag ang elliptic na kondisyunal na tugon ni Naaman sa pagtanggi ni Eliseo. Inalis ang dagdag na "ibang" bago ang "hain" upang tanging "ibang mga diyos" ang magsalin sa אֱלֹהִים אֲחֵרִים. Nilinaw rin ang sukat ng lupang hinihingi bilang daming kayang dalhin ng isang pares ng mga mula, nang hindi pinipilit ang paliwanag sa motibo ni Naaman sa pangunahing teksto.
