base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: tl
  text: Sinabi ni Naaman, “Kung hindi, ipagkaloob sana sa iyong lingkod ang lupang[a] kasindami ng kayang dalhin ng isang pares ng mga mula, sapagkat hindi na maghahandog ang iyong lingkod ng handog na sinusunog o hain sa ibang mga diyos, kundi kay Yahweh lamang.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang pasan ng lupa para sa isang pares ng mga mula,” ibig sabihin, lupa na kasindami ng kayang dalhin ng dalawang mula. Maaaring kaugnay ng kahilingan ang sinaunang pag-uugnay ng isang diyos sa isang lupain, o ang hangarin ni Naaman na sumamba kay Yahweh sa ibabaw ng lupang mula sa Israel; hindi tahasang sinasabi ng teksto ang dahilan.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ang “Yahweh” ay salin-titik ng banal na pangalang YHWH, na madalas isinasaling “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָלֹא
  choice: Kung gayon
  rationale: 'Sa konteksto, tugon ito sa pagtanggi ni Eliseo sa regalo. Ang natural na Filipino na “Kung gayon” ay naghahatid sa diwang: kung hindi niya tatanggapin ang regalo, may ibang kahilingan si Naaman.'
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: ipagkaloob sana sa iyong lingkod
  rationale: Pinananatili ng “sana” ang magalang na pakiusap at ng “ipagkaloob” ang di-tuwirang/pasibong himig, nang hindi nagiging pilit sa Tagalog.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: ang lupang kayang dalhin ng dalawang mula
  rationale: Malinaw at likas itong pagpapahayag ng dami ng lupa na mailululan sa isang pares ng mga mula; iniiwasan nito ang malabong literal na “pasan ng pares ng mga mula.”
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: sapagkat mula ngayon ay hindi na maghahandog ang iyong lingkod
  rationale: Ang עשה, kapag may mga handog bilang layon, ay idiomatikong nangangahulugang mag-alay o maghandog. Ang “mula ngayon ay hindi na” ay malinaw na naghahatid sa עוֹד.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tiyak at madaling maunawaang katawagan para sa handog na lubusang sinusunog.
- source_word: זֶבַח
  choice: ibang hain
  rationale: Ipinakikita ng “ibang” na isa pa itong uri ng paghahandog bukod sa handog na sinusunog; ang “hain” ay maikli at natural.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: sa ibang mga diyos
  rationale: Tuwirang ipinahahayag ang mga diyos na tumatanggap ng mga handog.
- source_word: כִּי אִם לַיהוָה
  choice: kundi kay Yahweh lamang
  rationale: Pinananatili ng “kundi ... lamang” ang mariing pagbubukod at eksklusibong pagsamba sa יהוה.
- source_word: יהוה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan upang mapanatili sa teksto ang personal na pangalang nasa Hebreo.
theological_decisions:
- issue: Ang dahilan ng paghingi ni Naaman ng lupa mula sa Israel
  choice: Hindi tahasang ipinaliwanag sa pangunahing teksto
  alternative: Ipaliwanag na kailangan niya ang lupa ng Israel bilang tuntungan ng altar o dahil iniugnay niya ang isang diyos sa lupain nito
  rationale: Iniuugnay ng talata ang lupa sa balak niyang kay Yahweh lamang maghandog, ngunit hindi nito sinasabi ang eksaktong dahilan. Kaya inilalagay lamang sa talababa ang mga posibleng paliwanag.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang Hebreo ay tuwirang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “iyong lingkod” bilang deferential self-reference ni Naaman, at pinanatili ang hindi ipinaliwanag na ugnayan ng lupang mula sa Israel at ng eksklusibong paghahandog kay Yahweh.
