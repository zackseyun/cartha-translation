  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: tl
  text: '“Sa bagay na ito, patawarin nawa ni Yahweh ang iyong lingkod: kapag pumapasok ang aking panginoon sa bahay ni Rimon[b] upang yumukod[a] doon, at sumasandal siya sa aking kamay, at yumuyukod din ako sa bahay ni Rimon—kapag yumuyukod ako sa bahay ni Rimon, patawarin nawa ni Yahweh ang iyong lingkod sa bagay na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba” o “magpatirapa.” Ang pandiwang Hebreo ay maaaring tumukoy kapwa sa pisikal na pagyukod at sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Rimon” ay ang templo o dambana ni Rimon, isang diyos ng mga Arameo.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: patawarin nawa
  rationale: Ipinahahayag nito ang pakiusap na nakapaloob sa anyong jussive, sa natural at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְעַבְדֶּךָ
  choice: ang iyong lingkod
  rationale: Ang 'lingkod' ay angkop sa magalang na pagtukoy ni Naaman sa sarili at hindi labis na itinatampok ang kahulugang pagkaalipin.
- source_word: בְּבוֹא אֲדֹנִי
  choice: kapag pumapasok ang aking panginoon
  rationale: Ang infinitive construct na may ב ay nagpapahayag ng kalagayang temporal; tumutukoy ang 'aking panginoon' sa haring pinaglilingkuran ni Naaman.
- source_word: בֵית רִמּוֹן
  choice: bahay ni Rimon
  rationale: Pinananatili ang literal na larawang Hebreo na 'bahay,' habang nililinaw sa talababa na isang templo o dambana ang tinutukoy.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: upang yumukod
  rationale: Pinananatili nito ang pisikal na kilos nang hindi ipinapasiya kung ang kilos ni Naaman ay panloob na pagsamba o tungkuling kaugnay ng paglilingkod sa hari.
- source_word: שָׁמָּה
  choice: doon
  rationale: Natural na katumbas ng payak na pang-abay na panlunan.
- source_word: נִשְׁעָן עַל יָדִי
  choice: sumasandal siya sa aking kamay
  rationale: Malapit ito sa literal na Hebreo at ipinahihiwatig ang pagsuporta ni Naaman sa kanyang panginoon.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: kaya yumuyukod din ako
  rationale: Ipinakikita ng 'kaya' ang bunga ng pagsandal ng hari, at ng 'din' ang kasabay na pagyukod ni Naaman, nang hindi dinaragdagan ang teksto ng hatol tungkol sa kanyang layunin.
- source_word: בְּהִשְׁתַּחֲוָיָתִי
  choice: kapag yumuyukod ako
  rationale: Natural na temporal na parirala na nagpapanatili sa pag-uulit at pagbibigay-diin ng Hebreo.
- source_word: נָא
  choice: patawarin nawa
  rationale: Naipahahayag ang magalang at mariing pakiusap sa pamamagitan ng 'nawa'; hindi na idinagdag ang hiwalay na 'pakiusap' upang manatiling natural ang pangungusap.
theological_decisions:
- issue: Kung ang הִשְׁתַּחֲוָה ay isasaling 'sumamba' o bilang pisikal na pagyukod sa loob ng bahay ni Rimon
  choice: yumukod
  alternative: sumamba; magpatirapa
  rationale: Maaaring tumukoy ang pandiwang Hebreo kapwa sa pisikal na pagyukod at sa pagsamba. Ang 'yumukod' ay nagpapanatili sa tunay na kalabuan at tensiyong teolohikal tungkol sa panlabas na kilos ni Naaman at sa kanyang panloob na katapatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng 'bahay ni Rimon' at 'yumuyukod' dahil mahalaga ito sa diin ng pakiusap ni Naaman. Ginamit ang 'aking panginoon' para sa haring pinaglilingkuran niya at 'Yahweh' para sa banal na pangalan.
