  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: tl
  text: Nang mabasa ng hari ng Israel ang liham, pinunit niya ang kanyang mga damit at sinabi, “Diyos ba ako upang pumatay at bumuhay, kaya nagpapadala ang taong ito sa akin ng mensahe upang pagalingin ang isang lalaki mula sa kanyang ketong[a]? Unawain nga ninyo at tingnan kung paano siya naghahanap ng dahilan upang makipag-away sa akin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “ketong” ay maaaring tumukoy sa iba’t ibang malubhang sakit sa balat, at hindi lamang sa sakit na Hansen.
    reason: lexical_alternative
  - marker: b
    text: O “naghahanap siya ng maidadahilan laban sa akin” o “naghahanap siya ng pagkakataong kalabanin ako.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: liham
  rationale: Sa konteksto, ito ang nakasulat na mensaheng ipinadala ng hari ng Aram; ang “liham” ang pinakanatural at tiyak na salin sa modernong Tagalog.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Pinananatili nito ang literal na kilos at ang karaniwang idyoma ng matinding pagkabalisa o pangamba.
- source_word: הַאֱלֹהִים אָנִי
  choice: Diyos ba ako
  rationale: Rhetorikal na tanong ito tungkol sa kapangyarihang nauukol sa Diyos, lalo na sa pagpatay at pagbibigay-buhay.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: na may kapangyarihang pumatay at bumuhay
  rationale: Malinaw at natural sa Tagalog, habang pinananatili ang magkatimbang na pares at ang diwang ito ay kapangyarihang banal.
- source_word: שֹׁלֵחַ אֵלַי
  choice: ipinagagawa sa akin ng taong ito
  rationale: Sa konteksto ng liham, hindi lamang pagpapadala ang tinutukoy kundi ang kahilingang ipinadadala sa hari; inilalahad ito nang natural nang hindi binabago ang layon.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: pagalingin ang isang lalaki mula sa kanyang ketong
  rationale: Ang אָסַף na may מִן at isang karamdaman ay idyomatikong tumutukoy sa pag-aalis o pagpapagaling mula sa kondisyon.
- source_word: צָּרַעַת
  choice: ketong
  rationale: Pinananatili ang nakaugaliang terminong pamilyar sa mga mambabasa, ngunit nililinaw sa talababa na mas malawak ang saklaw ng salitang Hebreo kaysa sa sakit na Hansen lamang.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Pansinin ninyo at tingnan
  rationale: Natural na utos sa modernong Tagalog na pinananatili ang dalawang pandiwa at ang panawagang kilalanin ang pinaghihinalaang motibo.
- source_word: מִתְאַנֶּה ... לִי
  choice: naghahanap ng dahilan upang makipag-away sa akin
  rationale: Ipinahahayag nito ang diwa ng paghahanap ng pagkakataon o dahilan laban sa hari, habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa הָאֱלֹהִים sa rhetorikal na tanong ng hari
  choice: Diyos ba ako
  alternative: Isa ba akong diyos
  rationale: Sa salaysay ng Israel, ipinapakita ng kasunod na pariralang “pumatay at bumuhay” ang kapangyarihang natatangi sa Diyos. Hindi kailangang gawing pangkalahatang pagtukoy sa isang diyos.
- issue: Saklaw ng צָּרַעַת
  choice: ketong
  alternative: malubhang sakit sa balat
  rationale: Ang “ketong” ay pamilyar at nagpapanatili ng pagkakaugnay ng salaysay, ngunit hindi dapat ipalagay na tiyak na sakit na Hansen ang tinutukoy; kaya inilalahad ang mas malawak na saklaw sa talababa.
- issue: Diwa ng מִתְאַנֶּה
  choice: naghahanap ng dahilan upang makipag-away sa akin
  alternative: naghahanap ng maidadahilan laban sa akin
  rationale: Pinananatili ng pangunahing salin ang hinalang naghahanap ng alitan ang hari ng Aram, habang ipinapakita ng talababa ang posibleng diin sa isang dahilan o pagkukunwari laban sa hari ng Israel.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “liham,” “damit,” at “pagalingin” bilang karaniwang salita; iniwasan ang labis na teknikal o makalumang pananalita. Ang “Pansinin ninyo at tingnan” ay nagpapanatili sa dobleng utos ng Hebreo.
