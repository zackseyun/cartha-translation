revisions:
- from: Nang mabasa ng hari ng Israel ang liham, pinunit niya ang kanyang mga damit at sinabi, “Diyos ba ako, na may kapangyarihang pumatay at bumuhay, kaya ipinagagawa sa akin ng taong ito na pagalingin ang isang lalaki mula sa kanyang ketong[a]? Pansinin ninyo at tingnan kung paano siya naghahanap ng dahilan upang makipag-away sa akin.”[b]
  to: Nang mabasa ng hari ng Israel ang liham, pinunit niya ang kanyang mga damit at sinabi, “Diyos ba ako upang pumatay at bumuhay, kaya nagpapadala ang taong ito sa akin ng mensahe upang pagalingin ang isang lalaki mula sa kanyang ketong[a]? Unawain nga ninyo at tingnan kung paano siya naghahanap ng dahilan upang makipag-away sa akin.”[b]
  rationale: Inalis ang di-kinakailangang dagdag na “may kapangyarihan” upang masundan ang tuwirang retorikal na tanong ng Hebreo. Pinalitan ang “ipinagagawa” ng “nagpapadala ... ng mensahe,” na kumikilala sa liham na nabanggit at mas tapat sa שֹׁלֵחַ nang hindi inaangking tahasang utos ang mensahe. Pinahusay din ang salin ng dobleng utos at ang pagkakaangkla ng talababa b.
