- from: Ngunit sinabi niya sa kanya, “Hindi ba sumama ang puso ko[a] nang bumaling ang lalaki mula sa kanyang karwahe upang salubungin ka? Ito ba ang panahon para tumanggap ng pilak at mga damit, mga taniman ng olibo at mga ubasan, mga tupa at mga baka, at mga lingkod na lalaki at babae[b]?”
  to: Ngunit sinabi niya sa kanya, “Hindi ba sumama ang puso ko[a] nang bumaling ang lalaki mula sa kanyang karwahe upang salubungin ka? Ito ba ang panahon para kumuha ng pilak at mga damit, mga taniman ng olibo at mga ubasan, mga tupa at mga baka, at mga lalaking lingkod at mga babaeng lingkod[b]?”
  rationale: Pinalitan ang “tumanggap” ng “kumuha” upang masundan ang inuulit na pandiwang Hebreo at ang mapagsaway na diin ng tanong. Nilinaw rin ang pares na panlipunang termino bilang “mga lalaking lingkod at mga babaeng lingkod.” Hindi binago ang pangunahing idyoma ng “puso,” ang hindi pinangalanang “lalaki,” o ang alternatibong talababa, upang mapanatili ang sinadyang ambiguity ng pinagmulan.
