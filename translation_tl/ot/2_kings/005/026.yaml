source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Hindi ba sumama ang puso ko[a] nang bumaling ang lalaki mula sa kanyang karwahe upang salubungin ka? Ito ba ang panahon para kumuha ng pilak at mga damit, mga taniman ng olibo at mga ubasan, mga tupa at mga baka, at mga lalaking lingkod at mga babaeng lingkod[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “Hindi ba naroon ang diwa ko nang bumaling ang lalaki mula sa kanyang karwahe upang salubungin ka?”
    reason: lexical_alternative
  - marker: b
    text: O “mga aliping lalaki at babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: sumama ang puso ko
  rationale: Pinananatili ang matingkad na idyomang Hebreo tungkol sa panloob na pagkaalam o pagkanaroroon ni Eliseo, sa halip na agad itong ipaliwanag bilang literal na espirituwal na pagkanaroroon.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: nang bumaling ang lalaki mula sa kanyang karwahe upang salubungin ka
  rationale: Ang “bumaling” ay malapit sa saligang diwa ng הָפַךְ na “pumihit/bumaling,” habang hindi tahasang dinaragdagan ang teksto ng “bumaba.” Ang “lalaki” ay nagpapanatili sa karaniwang pagtukoy ng אִישׁ nang hindi ipinapasok ang pangalang Naaman.
- source_word: הָעֵת
  choice: Ito ba ang panahon
  rationale: Ipinahihiwatig ng konteksto ang tanong at pagsaway kahit walang tahasang pantanong na kataga sa Hebreo; natural itong naipahahayag sa Tagalog sa ganitong anyo.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: tumanggap ng pilak
  rationale: Sa konteksto, ang pagkuha ay pagtanggap ng handog o kabayaran. Pinananatili ng “pilak” ang kongkretong salita ng Hebreo sa halip na gawing pangkalahatang “salapi.”
- source_word: בְּגָדִים
  choice: mga damit
  rationale: Karaniwan, malinaw, at marangal na modernong Tagalog para sa mga kasuotang kabilang sa mga tinanggap na ari-arian.
- source_word: זֵיתִים
  choice: mga taniman ng olibo
  rationale: Sa talaan ng mga ari-ariang produktibo, mas malamang na mga taniman o punong olibo ang tinutukoy kaysa mga bungang olibo lamang.
- source_word: כְרָמִים
  choice: mga ubasan
  rationale: Likas at tiyak na katumbas sa Tagalog para sa mga taniman ng ubas bilang ari-arian.
- source_word: צֹאן וּבָקָר
  choice: mga tupa at mga baka
  rationale: Pinananatili ang dalawang kongkretong uri ng hayop sa halip na ibuod bilang mga kawan.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: mga lingkod na lalaki at babae
  rationale: Pinananatili ang pagkakaiba ng kasarian sa Hebreo. Ang “lingkod” ay angkop sa malawak na saklaw ng mga salitang ito, habang inilalagay sa talababa ang mas mariing “alipin” dahil maaaring nakapaloob ang sapilitang o pag-aaring paglilingkod.
theological_decisions:
- issue: Idyoma ng panloob na pagkaalam ni Eliseo
  choice: Hindi ba sumama ang puso ko
  alternative: Hindi ba naroon ang diwa ko
  rationale: Hindi nilulutas ng pangunahing salin kung eksaktong paano nalaman ni Eliseo ang nangyari. Ang literal na larawan ng “puso” ay nagpapanatili sa misteryo at puwersa ng Hebreo; ang mas interpretibong pagbasa ay ibinibigay sa talababa.
- issue: Katayuang panlipunan ng עֲבָדִים וּשְׁפָחוֹת
  choice: mga lingkod na lalaki at babae
  alternative: mga aliping lalaki at babae
  rationale: 'Ang mga termino ay maaaring tumukoy sa mga lingkod na nasa kalagayang hindi malaya. Hindi pinalalabo ang posibilidad na ito: pinili sa teksto ang mas malawak na “lingkod,” at malinaw na itinala ang “alipin” bilang alternatibo.'
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang Hebreong idyoma ng “puso” sa pangunahing teksto, ngunit ipinaliwanag ang posibleng diwa nito sa talababa. Ang sunod-sunod na talaan ng yaman ay pinanatiling kongkreto at maindayog.
