  to: Sumagot siya, “Mabuti naman ang lahat.[a] Isinugo ako ng aking panginoon upang sabihin, ‘Tingnan mo, may dalawang kabataang lalaki na kararating lamang sa akin mula sa kaburulan ng Efraim, na kabilang sa mga anak ng mga propeta.[b] Pakibigay sa kanila ang isang talento[c] ng pilak at dalawang pamalit na damit.’”
