  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: tl
  text: Sumagot siya, “Mabuti naman ang lahat.[a] Isinugo ako ng aking panginoon upang sabihin, ‘Tingnan mo, may dalawang kabataang lalaki na kararating lamang sa akin mula sa kaburulan ng Efraim, na kabilang sa mga anak ng mga propeta.[b] Pakibigay sa kanila ang isang talento[c] ng pilak at dalawang pamalit na damit.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapayapaan” o “Mabuti naman.” Ginagamit dito ang Hebreong shalom bilang paniniyak na maayos ang lahat.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ng mga propeta” ay karaniwang katawagan sa mga kasapi ng isang pamayanan o pangkat ng mga propeta.
    reason: cultural_note
  - marker: c
    text: Ang talento ay isang malaking yunit ng timbang para sa mamahaling metal.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Mabuti naman ang lahat
  rationale: Sa kontekstong ito, ang shalom ay paniniyak na walang masamang nangyari, hindi lamang isang pagbati o ang abstraktong konsepto ng kapayapaan.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Tinutukoy ni Gehazi ang kanyang amo na si Eliseo. Ang “panginoon” ay angkop sa marangal na salaysay at hindi nagpapahiwatig na Diyos ang tinutukoy.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Narito, kararating lang
  rationale: Pinagsasama nito ang pantawag-pansin ng הִנֵּה at ang kagyat na panahon ng עַתָּה זֶה sa natural na modernong Tagalog.
- source_word: נְעָרִים
  choice: mga kabataang lalaki
  rationale: Maaaring tumukoy ang salita sa mga kabataan o mga utusan. Dahil inilalarawan silang kabilang sa pamayanang propetiko, ang saling ito ang hindi gaanong mapagpalagay.
- source_word: מֵהַר אֶפְרַיִם
  choice: mula sa kaburulan ng Efraim
  rationale: Karaniwang tumutukoy ang parirala sa mataas na rehiyon ng Efraim, hindi sa iisang bundok.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: kabilang sa mga anak ng mga propeta
  rationale: Pinananatili ang teknikal na idyomang Hebreo habang nililinaw sa pangungusap na tumutukoy ito sa pagiging kabilang sa isang pamayanang propetiko.
- source_word: תְּנָה נָּא
  choice: Pakibigay
  rationale: Ipinahahayag nito nang natural sa Tagalog ang magalang na pakiusap na dala ng pautos at ng katagang נָא.
- source_word: כִּכַּר כֶּסֶף
  choice: isang talento ng pilak
  rationale: Ang כִּכָּר ay malaking yunit ng timbang; pinananatili ng “talento” ang tradisyonal at tiyak na katawagang panukat.
- source_word: חֲלִפוֹת בְּגָדִים
  choice: mga pamalit na damit
  rationale: Tumutukoy ang parirala sa mga kasuotang maipapalit o magkakahiwalay na bihis; natural at malinaw ito sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang idyomang “mga anak ng mga propeta” dahil teknikal itong katawagan sa Mga Hari, at ipinaliwanag ito sa talababa. Ginamit ang “kaburulan” upang maiwasang mapagkamalang isang bundok lamang ang Efraim.
