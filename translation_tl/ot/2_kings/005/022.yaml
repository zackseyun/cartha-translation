  naturalness: May hindi natural at maling ayos na konstruksyon sa “Narito, kararating lang sa akin ng dalawang kabataang lalaki.” Ang pandiwang “dumating” ay nangangailangan dito ng mas malinaw na paksa, gaya ng “may dalawang kabataang lalaki na kararating lamang sa akin.” Ang “Tingnan mo” ay mas likas na pantawag-pansin sa direktang pananalita kaysa “Narito” sa kontekstong ito.
  terminology: Ang “aking panginoon,” “kaburulan ng Efraim,” “mga anak ng mga propeta,” “talento ng pilak,” at “mga pamalit na damit” ay angkop. Nananatiling kapaki-pakinabang ang talababa para sa teknikal na katawagang “mga anak ng mga propeta” at sa sukat na “talento.”
