  to: Pagkatapos, bumalik siya sa tao ng Diyos kasama ang buong pangkat niya. Lumapit siya at tumayo sa harap niya at sinabi, “Ngayon ay alam ko nang walang Diyos saanman sa buong daigdig maliban sa Israel. At ngayon, pakitanggap ang isang kaloob[a] mula sa iyong lingkod.”
