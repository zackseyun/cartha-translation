base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: tl
  text: Pagkatapos, bumalik siya sa tao ng Diyos kasama ang buong pangkat niya. Lumapit siya at tumayo sa harap niya at sinabi, “Ngayon ay alam ko nang walang Diyos saanman sa buong daigdig maliban sa Israel. At ngayon, pakitanggap ang isang kaloob[a] mula sa iyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “pagpapala.” Dito, ang salitang Hebreo ay tumutukoy sa isang handog o regalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili ang karaniwang titulong Hebreo at ang pampanitikang ugnayan nito, sa halip na ipakahulugang agad bilang “propeta ng Diyos.”
- source_word: מַחֲנֵהוּ
  choice: buong pangkat niya
  rationale: Bagaman literal na “kampo niya,” tumutukoy ito rito sa pangkat ng mga taong kasama ni Naaman; malinaw at natural ang “buong pangkat niya.”
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: tumayo siya sa harap nito
  rationale: Malapit ito sa karaniwang pahayag na Hebreo tungkol sa pagharap sa isang tao at nananatiling natural sa Filipino.
- source_word: הִנֵּה נָא יָדַעְתִּי
  choice: Ngayon ay alam ko na
  rationale: Ipinahihiwatig ang mariing pagkilalang natamo ni Naaman matapos ang kanyang karanasan, nang hindi gumagamit ng makalumang “narito” o “masdan.”
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: walang Diyos sa buong daigdig maliban sa Israel
  rationale: Pinananatili ang tuwirang pag-amin sa pagiging natatangi ng Diyos at ang mismong lokatibong “sa Israel,” nang hindi dinaragdagan ng “Diyos ng Israel.”
- source_word: בְרָכָה
  choice: isang kaloob
  rationale: Literal na “pagpapala,” ngunit sa ganitong konteksto ng pagbibigay ay nangangahulugang handog o regalo. Ang “kaloob” ay natural at marangal; inilalagay sa talababa ang literal na kahulugan.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Dito ay magalang na pagtukoy ni Naaman sa sarili, hindi pagbibigay-diin sa kalagayan ng isang alipin.
- source_word: קַח נָא
  choice: pakitanggap
  rationale: Ang literal na “kunin mo, nakikiusap ako” ay isang magalang na paghiling na tanggapin ang iniaalok; maikli at natural ang “pakitanggap.”
theological_decisions:
- issue: Ang pag-amin ni Naaman na walang Diyos maliban sa Israel
  choice: 'Isinalin bilang tuwirang pag-amin sa pagiging natatangi ng Diyos: “walang Diyos sa buong daigdig maliban sa Israel.”'
  alternative: “Walang ibang diyos” o “walang Diyos maliban sa Diyos ng Israel.”
  rationale: Pinananatili nito ang mariing pahayag ng Hebreo at ang tunay na tensiyon ng pariralang “sa Israel,” nang hindi ito pinahihina o pinalalawak sa isang sistematikong paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang idyomang “tao ng Diyos,” samantalang ginawang natural ang daloy sa pamamagitan ng “Pagdating doon” at “pakitanggap.” Ang panghalip na “nito” ay ginamit upang malinaw na tumukoy sa tao ng Diyos at maiwasan ang sunod-sunod na malabong “niya.”
