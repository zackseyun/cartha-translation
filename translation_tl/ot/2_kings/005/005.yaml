base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: tl
  text: Sinabi ng hari ng Aram, “Sige, humayo ka, at magpapadala ako ng liham sa hari ng Israel.” Kaya humayo siya, dala ang sampung talentong pilak, anim na libong pirasong ginto,[a] at sampung pamalit na kasuotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anim na libong ginto”; hindi tahasang tinukoy ang yunit o bagay na binibilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Sige, humayo ka
  rationale: Ang magkasunod na pautos ay isang idyomang nagpapahayag ng agarang pahintulot at paghikayat. Natural itong ipinapahayag sa modernong Tagalog bilang “Sige, humayo ka,” nang hindi pilit na ginagaya ang literal na “Humayo ka, pumarito ka.”
- source_word: סֵפֶר
  choice: liham
  rationale: Sa diplomatikong konteksto, tumutukoy ito sa nakasulat na mensaheng ipinadala ng isang hari sa isa pang hari.
- source_word: בְּיָדוֹ
  choice: dala
  rationale: Literal itong “sa kaniyang kamay,” ngunit karaniwan nitong ipinahihiwatig ang pagdadala o pagkakaroon ng mga bagay. Ang “dala” ang natural at malinaw na katumbas sa Tagalog.
- source_word: כִּכְּרֵי כֶסֶף
  choice: talentong pilak
  rationale: Pinananatili ang sinaunang yunit na talento upang maiwasan ang di-tiyak na modernong conversion ng timbang.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: anim na libong pirasong ginto
  rationale: Walang tahasang binanggit na yunit sa Hebreo. Ang “piraso” ay idinagdag para maging natural sa Tagalog ngunit hindi tinutukoy nang higit sa ebidensiya kung anong uri ng barya o timbang iyon.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: pamalit na kasuotan
  rationale: Tumutukoy ang parirala sa mga set ng damit na maaaring ipalit o isuot bilang buong kasuotan; dignified at madaling maunawaan ang “pamalit na kasuotan.”
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang pangalang Hebreo na Aram sa halip na palitan ito ng mas huling heograpikong tawag na Siria.
