revisions:
- from: Lumabas nang pangkat-pangkat ang mga Arameo upang manalakay, at binihag nila mula sa lupain ng Israel ang isang munting batang babae.[a] Naglingkod siya sa asawa ni Naaman.[b]
  to: Lumabas ang mga pangkat ng mga Arameo, at bumihag sila ng isang munting batang babae mula sa lupain ng Israel.[a] Naglingkod siya sa asawa ni Naaman.[b]
  rationale: Inalis ang idinagdag na tahasang layunin na “upang manalakay” upang huwag lumampas sa isinasaad ng Hebreo. Inayos ang paksa bilang “mga pangkat ng mga Arameo” at ang ayos ng sugnay tungkol sa pagbibihag para sa mas natural at malinaw na Tagalog, habang pinanatili ang kahulugan, rehistro, mga pangalan, at mga angkla ng talababa.
