  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: tl
  text: Lumabas ang mga pangkat ng mga Arameo, at bumihag sila ng isang munting batang babae mula sa lupain ng Israel.[a] Naglingkod siya sa asawa ni Naaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang maliit na batang babae” o “isang batang-bata pang babae.” Idiniriin ng pariralang Hebreo ang kanyang murang edad at kaliitan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “siya ay nasa harap ng asawa ni Naaman,” isang pahayag na nangangahulugang siya ay naglingkod o umalalay rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: ang mga Arameo ... nang pangkat-pangkat upang manalakay
  rationale: Ang pangalang “Aram” ay tumutukoy rito sa mga puwersang Arameo, gaya ng ipinahihiwatig ng pandiwang maramihan. Ang גְדוּדִים ay mga pangkat na militar o mandarambong; nilinaw ng “upang manalakay” ang diwa nito sa likas na Tagalog.
- source_word: יָצְאוּ
  choice: lumabas
  rationale: Payak at tuwirang katumbas ng paglabas ng mga pangkat para sa isang pagsalakay; hindi nagdagdag ng tahasang panandang temporal na wala sa Hebreo.
- source_word: וַיִּשְׁבּוּ
  choice: binihag nila
  rationale: Ipinahahayag ng pandiwa ang pagkuha ng isang tao bilang bihag, hindi lamang ang pagdakip o pagsamsam.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: mula sa lupain ng Israel
  rationale: Pinananatili ang tahasang heograpikong diwa ng אֶרֶץ, “lupain.”
- source_word: נַעֲרָה קְטַנָּה
  choice: isang munting batang babae
  rationale: Pinananatili ang diin ng pariralang Hebreo sa kanyang murang edad at kaliitan nang hindi ipinapasok sa parirala ang katayuan niyang tagapaglingkod.
- source_word: וַתְּהִי לִפְנֵי
  choice: Naglingkod siya sa
  rationale: Ang literal na “siya ay nasa harap ng” ay isang idyoma para sa pagharap at paglilingkod sa isang nakatataas. Natural at malinaw sa modernong Tagalog ang “naglingkod siya sa.”
- source_word: אֵשֶׁת נַעֲמָן
  choice: asawa ni Naaman
  rationale: Likas na anyong Tagalog ng ugnayang konstruktong “asawa ni Naaman.”
