base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: tl
  text: Ngunit pumasok siya at tumayo sa harap ng kanyang amo. Tinanong siya ni Eliseo, “Saan ka nanggaling, Gehazi?”[a] Sumagot siya, “Ang inyong lingkod ay hindi po pumunta saanman.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Mula saan, Gehazi?”'
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “Ang inyong lingkod ay hindi pumunta rito o roon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ngunit siya
  rationale: Ipinahihiwatig ng pang-ugnay at panghalip ang bahagyang pagsalungat sa lihim na ginawa ni Gehazi sa naunang tagpo; natural itong naipapahayag ng “Ngunit.”
- source_word: בָא
  choice: pumasok
  rationale: Ang pandiwa ay karaniwang nangangahulugang “dumating,” ngunit sa konteksto ay pumapasok si Gehazi upang humarap kay Eliseo; malinaw at natural dito ang “pumasok.”
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: tumayo sa harap ng kanyang amo
  rationale: Pinananatili ng “tumayo sa harap” ang larawan ng pagharap at paglilingkod, samantalang ang “amo” ay tumutukoy sa taong pinaglilingkuran at hindi sa Diyos.
- source_word: מֵאָן
  choice: Saan ka nanggaling
  rationale: Literal itong “mula saan,” ngunit ang “Saan ka nanggaling?” ang natural na tanong sa Filipino tungkol sa pinanggalingan o kamakailang kinaroroonan.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Ang inyong lingkod ay hindi po pumunta
  rationale: Pinanatili ang magalang at di-tuwirang pagtukoy ni Gehazi sa sarili bilang “inyong lingkod”; idinagdag ng “po” ang natural na antas ng paggalang sa modernong Filipino.
- source_word: אָנֶה וָאָנָה
  choice: saanman
  rationale: Ang idyoma ay nangangahulugang “dito o roon” o “kahit saan”; maikli at natural na naipapahayag iyon ng “saanman.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” para sa ugnayang panlipunan nina Eliseo at Gehazi, at pinanatili ang magalang na “inyong lingkod” sa halip na gawing payak na “ako.” Inilagay ang mga talababa sa mismong mga pariralang ipinapaliwanag ng mga ito.
