base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: tl
  text: 'Ngunit sinabi ni Eliseo, “Buháy si Yahweh[a], na sa harap niya ay nakatayo ako: hindi ko iyon tatanggapin.” Pilit siyang hinimok ni Naaman na tanggapin iyon, ngunit tumanggi siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, pormula ito ng panunumpa: “Buháy si Yahweh … kung tatanggapin ko.” Sa ganitong panunumpa, ang “kung” ay nagpapahayag ng mariing pagtanggi: “tiyak na hindi ko tatanggapin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  rationale: Isang taimtim na pormula ng panunumpa sa Hebreo. Likas sa modernong Tagalog ang “Saksi ang buhay ni Yahweh” at pinananatili nito ang lakas ng panunumpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi bilang isang titulo.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: na sa harap niya ay nakatayo ako
  rationale: Pinananatili ang literal at makaharing larawan ng propetang nakatayo sa presensya ng Diyos; hindi ito pinasimple bilang “na pinaglilingkuran ko.”
- source_word: אִם אֶקָּח
  choice: hindi ko iyan tatanggapin
  rationale: Sa loob ng pormula ng panunumpa, ang אִם ay nagpapahayag ng mariing pagtanggi. Ang “iyan” ay tumutukoy sa handog ni Naaman mula sa konteksto.
- source_word: וַיִּפְצַר בּוֹ
  choice: Pilit siyang hinimok ni Naaman
  rationale: Ipinahahayag ng פצר ang matindi o paulit-ulit na panghihikayat. Nilinaw ang mga tauhan upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
- source_word: לָקַחַת
  choice: na tanggapin iyon
  rationale: Sa konteksto ng isang handog, mas likas ang “tanggapin” kaysa “kunin,” habang nananatiling malinaw ang kahulugan.
- source_word: וַיְמָאֵן
  choice: ngunit tumanggi siya
  rationale: Direkta at natural na katumbas ng pandiwang nagsasaad ng pagtanggi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagtayo sa harap ni Yahweh
  choice: na sa harap niya ay nakatayo ako
  alternative: na pinaglilingkuran ko
  rationale: Pinananatili ang larawang propetiko at ang posibleng kahulugan ng paglilingkod nang hindi nilulutas ang idyoma sa isang paliwanag lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Saksi ang buhay ni Yahweh” bilang malinaw at taimtim na panunumpa. Nilinaw ang mga pangalang Eliseo at Naaman upang hindi maging malabo ang mga panghalip.
