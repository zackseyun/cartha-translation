language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: tl
  text: Nang marinig ni Eliseo, ang tao ng Diyos, na pinunit ng hari ng Israel ang kanyang mga damit[a], nagpasabi siya sa hari, “Bakit mo pinunit ang iyong mga damit? Pakiusap, papuntahin mo siya sa akin[b], at malalaman niya na may propeta sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagpunit ng damit ay nakaugaliang tanda ng pagdadalamhati o matinding pagkabagabag.
    reason: lexical_alternative
  - marker: b
    text: Ang “siya” ay tumutukoy kay Naaman, hindi sa hari ng Israel.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Likas na panandang pamanahon sa makabagong Tagalog; naipapakita ang paglipat ng salaysay nang hindi isinasalin nang mekanikal ang pormulang Hebreo.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga Bibliyang Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Pinananatili ang kinikilalang titulong propetiko at ang tuwirang anyo ng pariralang Hebreo, sa halip na gawin lamang itong paglalarawan ng kabanalan.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: pinunit ... ang kanyang mga damit
  rationale: Tuwirang inilalarawan ang pagpunit ng kasuotan bilang tanda ng matinding dalamhati o pagkabagabag; karaniwan at malinaw ang “mga damit” sa modernong Tagalog.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: nagpasabi siya sa hari
  rationale: Natural na Tagalog para sa pagpapadala ng isang mensahe. Hindi tinutukoy kung mensahero o ibang paraan dahil hindi iyon tahasang sinabi sa Hebreo.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Bakit mo pinunit ang iyong mga damit?
  rationale: Direkta at malinaw na tanong, na inuulit ang parehong kilos at salita para sa kasuotan.
- source_word: יָבֹא נָא אֵלַי
  choice: Pumarito sana sa akin ang taong iyon
  rationale: Ang “sana” ay nagpapahayag ng magalang na pakiusap ng נָא, at ang “ang taong iyon” ay nililinaw sa natural na Tagalog na ikatlong panauhan ang tinutukoy, nang hindi isiningit ang pangalang Naaman sa pangunahing teksto.
- source_word: וְיֵדַע
  choice: at malalaman niya
  rationale: Pinananatili ang inaasahang bunga ng pagpunta, nang hindi ipinipilit kung layunin o resulta ang ugnayan.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: na may propeta sa Israel
  rationale: Karaniwan at eksaktong paraan sa Tagalog ng pagpapahayag na umiiral o naroroon ang isang propeta sa Israel.
theological_decisions:
- issue: Ang titulong propetiko na אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  alternative: taong maka-Diyos; taong pag-aari ng Diyos
  rationale: Ang parirala ay isang kinikilalang katawagan sa propeta, hindi lamang paglalarawan sa personal na kabanalan ni Eliseo. Pinananatili ng “tao ng Diyos” ang pampanitikan at teolohikal na tungkulin nito.
- issue: Kung sino ang inaasahang makaalam na may propeta sa Israel
  choice: Pinanatiling si Naaman ang tinutukoy ng ikatlong panauhan, na ipinaliliwanag sa talababa.
  alternative: Maaaring ipalagay ng mambabasa na ang hari ang tinutukoy kung hindi isasaalang-alang ang konteksto.
  rationale: Ang pinakamalapit na konteksto ay tungkol sa pagpapapunta kay Naaman kay Eliseo. Gayunman, hindi isinisingit ang pangalan sa pangunahing teksto sapagkat panghalip lamang ang nasa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang labis na arkaikong pananalita, ngunit pinanatili ang titulong “tao ng Diyos” at ang maikli at mariing himig ng mensahe ni Eliseo.
