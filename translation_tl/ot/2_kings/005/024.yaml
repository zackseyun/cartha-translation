translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga dala” upang maging tahasang natural ang layon ng “kinuha,” yamang tumutukoy ang panghalip sa mga bagay na pasan ng mga lalaki sa naunang konteksto. Inayos ang pagkakalagay ng mga talababa upang ang bawat marker ay direktang sumunod sa salitang o pariralang ipinapaliwanag nito.
