base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: tl
  text: Nang makarating siya sa burol[a], kinuha niya mula sa kanilang mga kamay[b] ang mga dala at inilagak[c] ang mga iyon sa bahay. Pagkatapos, pinaalis niya ang mga lalaki, at umalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bunton” o “sa nakukutaang burol”; sa Hebreo, “sa Ophel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mula sa kanilang kamay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itinabi” o “inilagak ang mga iyon sa bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: sa burol
  rationale: Ang עֹפֶל ay maaaring tumukoy sa isang mataas na lugar, bunton, o nakukutaang burol. Ang pangkalahatang topograpikong salin na “burol” ang pinakanatural sa konteksto, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: מִיָּדָם
  choice: sa mga kamay nila
  rationale: Literal na “mula sa kamay nila.” Natural sa Filipino ang maramihang “mga kamay nila,” at pinananatili nito ang konkretong larawan ng tuwirang pagkuha sa mga dala.
- source_word: וַיִּפְקֹד
  choice: itinago
  rationale: Sa konteksto, inilagay ni Gehazi ang mga bagay sa loob ng bahay upang itabi at hindi makita. Ang “itinago” ay malinaw at natural, ngunit hindi tinutukoy kung saan mismo sa bahay.
- source_word: בַּבָּיִת
  choice: sa bahay
  rationale: Pinakasimpleng lokatibong kahulugan ng בַּיִת dito ang pisikal na bahay.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: “Mga lalaki” ang tuwirang salin; bagaman mga tauhan ni Naaman sila ayon sa konteksto, hindi ginamit dito ng Hebreo ang tiyak na salita para sa mga lingkod.
