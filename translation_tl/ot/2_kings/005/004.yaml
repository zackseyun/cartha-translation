translation_notes:
  register: Makabago at marangal na Tagalog. Pinanatili ang di-tiyak na panghalip na “siya” at hindi tahasang pinangalanan ang tauhan. Ginamit ang “panginoon” para sa ugnayang panghukuman, hindi bilang banal na titulo sa kontekstong ito.
