    rationale: Ang וַ ay pangunahing pang-ugnay sa salaysay; bagaman mahihinuha ang resulta mula sa naunang talata, hindi ito kailangang tahasang sabihin sa salin.
  - severity: low
    issue: Hindi likas ang “nang salita por salita” sa talababa.
    rationale: Mas wastong modernong Tagalog ang “nang salita-sa-salita” o “ang bawat salita.”
