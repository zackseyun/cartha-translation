  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: tl
  text: 'Pumasok siya at sinabi sa kanyang panginoon: “Ganito at ganito[a] ang sinabi ng batang babaeng mula sa lupain ng Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idyomang Hebreo: “ganito at ganito” o “iyon at iyon”; ibinubuod nito ang kanyang sinabi nang hindi inuulit nang salita-sa-salita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok siya
  rationale: Ang בוא ay maaaring mangahulugang dumating, pumunta, o pumasok ayon sa pananaw. Dito, ang pagpasok upang mag-ulat sa nakatataas ang likas na diwa.
- source_word: וַיַּגֵּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, mag-ulat, o magpabatid. Ang “sinabi” ay natural sa makabagong Tagalog at malinaw na naghahatid ng pag-uulat sa konteksto.
- source_word: לַאדֹנָיו
  choice: sa kanyang panginoon
  rationale: Ang אָדוֹן ay maaaring tumukoy sa panginoon, amo, o nakatataas. Pinananatili ng “panginoon” ang marangal at panlahatang katawagan sa ugnayang panghukuman nang hindi tahasang idinaragdag ang “hari,” na wala sa parirala.
- source_word: לֵאמֹר
  choice: “
  rationale: Ang pormulang Hebreo ay nagpapakilala ng tuwirang pananalita. Sa natural na Tagalog, sapat na itong katawanin ng kuwit at panipi pagkatapos ng “sinabi.”
- source_word: כָּזֹאת וְכָזֹאת
  choice: Ganito at ganito
  rationale: Isa itong idyomang nagbubuod ng sinabi nang hindi inuulit ang eksaktong mga salita. Malapit sa anyo ng Hebreo ang “Ganito at ganito” at nauunawaan sa Tagalog.
- source_word: דִּבְּרָה
  choice: ang sinabi
  rationale: Karaniwang pandiwa sa pagsasalita ang דבר. Ang nominalisadong ayos na “ang sinabi” ay likas sa pangungusap na Tagalog habang pinananatili ang nilalaman ng pandiwa.
- source_word: הַנַּעֲרָה
  choice: batang babae
  rationale: Ang נַעֲרָה ay batang babae o dalaga. Hindi tahasang nakasaad sa salitang ito mismo ang katayuan niya bilang alipin, kaya hindi iyon idinagdag sa salin.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: mula sa lupain ng Israel
  rationale: Pinananatili ng “lupain” ang tahasang אֶרֶץ, habang likas na isinasama ng hulaping -ng sa “babaeng” ang kaugnay na sugnay.
