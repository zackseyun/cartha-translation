  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: tl
  text: “Kaya kakapit sa iyo at sa iyong mga inapo magpakailanman ang sakit sa balat ni Naaman.” At umalis siya mula sa harapan niya na may sakit sa balat[a], kasimputi ng niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ayon sa tradisyon: “Kakapit sa iyo … ang ketong ni Naaman … at umalis siyang ketongin, kasimputi ng niyebe.” Ang mga salitang Hebreo na צָרַעַת at מְצֹרָע ay mas malawak ang kahulugan at tumutukoy sa isang malubhang sakit o kondisyon sa balat, hindi kinakailangang sa modernong ketong o Hansen’s disease.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Ang salitang Hebreo ay tumutukoy sa malubhang kondisyon sa balat na mas malawak kaysa sa modernong Hansen’s disease. Ang “sakit sa balat” ay malinaw, likas sa makabagong Tagalog, at hindi nagbibigay ng di-tiyak na medikal na diagnosis.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: תִּדְבַּק
  choice: kakapit
  rationale: Pinananatili nito ang matingkad na larawan ng isang karamdamang mahigpit na nakakabit sa hinatulan at sa kaniyang mga inapo.
- source_word: וּבְזַרְעֲךָ
  choice: at sa iyong mga inapo
  rationale: Ang זֶרַע ay tumutukoy rito sa mga susunod na salinlahi; mas natural at tumpak sa konteksto ang “mga inapo” kaysa sa literal na “binhi.”
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Inihahayag nito ang patuloy at walang itinakdang wakas na bisa ng hatol.
- source_word: וַיֵּצֵא
  choice: umalis siya
  rationale: Likas na salaysay ito sa Tagalog para sa paglabas o paglisan ni Gehazi.
- source_word: מִלְּפָנָיו
  choice: mula sa harapan niya
  rationale: Malapit ito sa literal na “mula sa harap/presensiya niya” at pinananatili ang pagtukoy sa pag-alis mula sa harapan ni Eliseo nang hindi labis na nagpapaliwanag sa teksto.
- source_word: מְצֹרָע
  choice: may sakit sa balat
  rationale: Kaugnay ito ng צָרַעַת at hindi kinakailangang tumukoy sa modernong ketong. Ang pag-uulit ng “sakit sa balat” ay nagpapanatili ng malinaw na ugnayan sa unang sugnay.
- source_word: כַּשָּׁלֶג
  choice: kasimputi ng niyebe
  rationale: Literal itong “gaya ng niyebe”; ginagawang hayag ng “kasimputi” ang ipinahihiwatig na punto ng paghahambing sa nakikitang anyo ng kondisyon.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת / מְצֹרָע
  choice: sakit sa balat / may sakit sa balat
  alternative: ketong / ketongin
  rationale: Inilalarawan ng talata ang karamdamang ipinataw bilang hatol at kakapit sa mga inapo, ngunit hindi nito hinihinging kilalanin ang kondisyon bilang modernong Hansen’s disease. Pinili ang mas malawak na pananalita sa pangunahing teksto at inilagay sa talababa ang tradisyonal na katawagan.
- issue: Saklaw ng hatol sa זֶרַע
  choice: mga inapo
  alternative: binhi
  rationale: Ang konteksto ay tungkol sa mga susunod na salinlahi ni Gehazi. Hindi nilulutas o nililimitahan ng salin ang teolohikal na tensiyon ng pahayag na “magpakailanman.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding larawan ng “kakapit” at ang pangmatagalang bigat ng “magpakailanman,” habang iniwasan ang di-makatwirang modernong medikal na katiyakan. Ang “mula sa harapan niya” ay sadyang malapit sa anyong Hebreo at nauunawaan sa konteksto bilang pag-alis mula kay Eliseo.
