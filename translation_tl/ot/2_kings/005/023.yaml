translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sige na” upang ihatid ang magalang ngunit mapilit na tono ni Naaman, at tahasang pinangalanan si Gehazi sa mga lugar na magiging malabo ang mga panghalip sa Tagalog.
