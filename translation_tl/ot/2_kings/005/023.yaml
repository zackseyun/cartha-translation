revisions:
- from: Sinabi ni Naaman, “Sige na, tumanggap ka ng dalawang talento[a].” Pinilit niya si Gehazi, saka inilagay at itinali ang dalawang talento ng pilak sa dalawang supot, kasama ang dalawang pamalit na damit. Ibinigay niya ang mga iyon sa dalawa sa kaniyang mga lingkod[b], at dinala nila ang mga iyon sa unahan ni Gehazi[c].
  to: Sinabi ni Naaman, “Pakiusap, tumanggap ka ng dalawang talento[a].” Pinilit niya si Gehazi, saka itinali ang dalawang talento ng pilak sa dalawang supot, kasama ang dalawang pamalit na damit. Ibinigay niya ang mga iyon sa dalawa sa kaniyang mga lingkod[b], at dinala nila ang mga iyon sa harap ni Gehazi[c].
  rationale: Pinalitan ang impormal na “Sige na” ng magalang na “Pakiusap,” inalis ang di-tahasang idinagdag na kilos na “inilagay,” at ginawang “sa harap ni Gehazi” ang huling parirala upang mas tuwirang maipakita ang Hebreong לְפָנָיו. Iningatan ang kontekstuwal na paglilinaw kay Gehazi at ang lahat ng umiiral na talababa.
