base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: tl
  text: Sinabi ni Naaman, “Pakiusap, tumanggap ka ng dalawang talento[a].” Pinilit niya si Gehazi, saka itinali ang dalawang talento ng pilak sa dalawang supot, kasama ang dalawang pamalit na damit. Ibinigay niya ang mga iyon sa dalawa sa kaniyang mga lingkod[b], at dinala nila ang mga iyon sa harap ni Gehazi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento ay isang sinaunang yunit ng timbang; maaaring mag-iba ang eksaktong katumbas nito.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “mga binata” o “mga alalay.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa harap niya.” Ang tinutukoy ay si Gehazi; dinala ng mga lingkod ang mga kaloob sa harap niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Sige na, tumanggap ka
  rationale: Ang הוֹאֵל ay magalang ngunit mapilit na pakiusap bago ang pautos na קַח. Likas sa modernong Tagalog ang “Sige na,” habang malinaw na ipinahihiwatig ng “tumanggap” ang pagtanggap sa regalong pilak.
- source_word: כִּכָּרָיִם
  choice: dalawang talento
  rationale: Ang כִּכָּר ay sinaunang yunit ng timbang. Pinanatili ang tradisyonal na katawagang “talento” at ipinaliwanag sa talababa upang hindi magbigay ng tiyak na makabagong katumbas na pinagtatalunan.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Pinilit niya si Gehazi
  rationale: Ang idyoma ay nagsasaad na mariing hinimok ni Naaman si Gehazi na tanggapin ang higit sa hiningi niya. Ang “pinilit” ay malinaw na nagpapakita ng pagpupumilit sa konteksto.
- source_word: וַיָּצַר ... בִּשְׁנֵי חֲרִטִים
  choice: inilagay at itinali ... sa dalawang supot
  rationale: Ipinahihiwatig ng pandiwa ang pagbabalot o pagtatali upang maseguro ang pilak, at ang חֲרִטִים ay mga sisidlan o supot para sa mahahalagang bagay.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: dalawang pamalit na damit
  rationale: Natural na katumbas ito ng idyomang tumutukoy sa dalawang set ng kasuotan.
- source_word: שְׁנֵי נְעָרָיו
  choice: dalawa sa kaniyang mga lingkod
  rationale: Maaaring mangahulugan ang נַעַר ng binata, tagapaglingkod, o alalay. Dito, ang tungkulin nilang magdala ng mga kaloob ang nangingibabaw.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: dinala nila ang mga iyon sa unahan ni Gehazi
  rationale: Ang לְפָנָיו ay literal na “sa harap niya.” Nilinaw ang tinutukoy ng panghalip bilang si Gehazi batay sa daloy ng salaysay, habang pinananatili ang ideya na nauna sa kaniya ang mga tagapagdala.
