    rationale: Ang הוֹאֵל ay magalang na pakiusap bago ang pautos; “Pakiusap” ay mas angkop sa rehistro.
  - severity: low
    issue: Maaaring malabo ang “sa unahan ni Gehazi.”
    rationale: Ang לְפָנָיו ay “sa harap niya” at inilalarawan ang paraan o kaayusan ng pagdadala, hindi isang destinasyon.
