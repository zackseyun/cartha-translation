language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: tl
  text: 'At dinala niya ang liham sa hari ng Israel. Ganito ang nakasulat: “Ngayon, pagdating sa iyo ng liham na ito, narito, ipinadala ko sa iyo ang lingkod kong si Naaman upang pagalingin mo siya sa kanyang sakit sa balat.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagalingin mo siya sa kanyang ketong.” Di-pangkaraniwan ang pananalita sa Hebreo; literal itong nagsasabing “tipunin siya mula sa kanyang sakit sa balat.” Mas malawak ang saklaw ng salitang Hebreo kaysa sa makabagong Hansen’s disease.
    reason: Pinananatili ang tradisyonal na saling “ketong” at ipinapaliwanag ang kakaibang idyomang Hebreo nang hindi gumagamit ng malabo at di-likas na pananalita sa pangunahing teksto.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: dinala niya
  rationale: Ang Hiphil ng בוא ay may layon na ‘ang liham’; malinaw at likas sa Filipino ang ‘dinala niya’ nang hindi dinaragdagan ang diwang ‘iniabot.’
- source_word: הַסֵּפֶר
  choice: ang liham
  rationale: Sa konteksto ng pakikipag-ugnayan ng mga hari, tumutukoy ito sa isang nakasulat na mensahe, kaya mas angkop ang ‘liham’ kaysa ‘aklat’ o ‘balumbon.’
- source_word: לֵאמֹר
  choice: Ganito ang nakasulat
  rationale: Bagaman literal na ‘na nagsasabi,’ ang liham mismo ang nagpapakilala sa sipi. Natural sa Filipino ang pormulang ito at hindi nito binabago ang kahulugan.
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Pinananatili ang pormal na panandang naglilipat sa pangunahing pakay ng liham.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: pagdating sa iyo ng liham na ito
  rationale: Ipinahahayag ng כ kasama ng infinitive construct ang panahong ‘kapag/pagdating’; maikli at natural ang napiling ayos sa Filipino.
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili ang pormal na pantawag-pansin ng tekstong Hebreo, bagaman mataas nang bahagya ang rehistro.
- source_word: שָׁלַחְתִּי
  choice: ipinadala ko
  rationale: Ang ganap na kilos ay angkop na isalin bilang pagpapadalang natupad na bago matanggap ang liham.
- source_word: נַעֲמָן עַבְדִּי
  choice: ang lingkod kong si Naaman
  rationale: Ang עבד sa wikang panghukuman ay maaaring tumukoy sa isang opisyal na nasasakupan; hindi labis na tinutukoy ng ‘lingkod’ ang kanyang legal na katayuan.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: upang pagalingin mo siya sa kanyang sakit sa balat
  rationale: Ang אסף ay karaniwang ‘tipunin/kunin,’ ngunit kasama ng מן at ng karamdaman ay isang di-pangkaraniwang idyoma para sa pag-aalis ng sakit. Isinasalin sa malinaw na kahulugan sa pangunahing teksto habang iniingatan sa talababa ang kakaibang anyo ng Hebreo.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa makabagong Hansen’s disease; iniiwasan ng saling ito ang maling tiyak na diagnosis.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת
  choice: sakit sa balat
  alternative: ketong
  rationale: Hindi eksaktong katumbas ng makabagong ketong o Hansen’s disease ang צָרַעַת. Pinananatili ng pangunahing teksto ang mas malawak na kahulugan, samantalang inilalahad sa talababa ang tradisyonal na katawagan.
- issue: Di-pangkaraniwang idyoma na אסף מן־צרעת
  choice: pagalingin siya sa kanyang sakit sa balat
  alternative: tipunin/ibalik siya mula sa kanyang sakit sa balat
  rationale: Ang lubhang literal na anyo ay hindi malinaw sa modernong Filipino at maaaring magpahiwatig ng maling kilos. Isinasalin sa teksto ang kahulugan ng idyoma ngunit itinatala sa talababa ang kongkretong pananalita ng Hebreo upang hindi maitago ang pagiging di-pangkaraniwan nito.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig na angkop sa liham ng isang hari. Ginamit ang ‘narito’ upang mapanatili ang pantawag-pansin na הִנֵּה; ang iba pang pangungusap ay inayos nang natural para sa karaniwang mambabasa.
