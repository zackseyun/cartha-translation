  source_fidelity: Tumpak na naihahatid ng pangunahing teksto ang liham na dinala sa hari ng Israel, ang pagpapadala kay Naaman bilang lingkod ng hari ng Aram, at ang hinihinging pagpapagaling mula sa צָרַעַת. Ang “pagalingin mo siya sa kanyang sakit sa balat” ay isang malinaw at makatuwirang pagsasalin ng di-pangkaraniwang idyomang Hebreo sa kontekstong ito.
  naturalness: Likas at malinaw ang modernong Filipino. Ang “Ganito ang nakasulat” ay angkop na natural na pagpapakilala sa nilalaman ng liham. Ang “narito” ay bahagyang pormal ngunit angkop sa maharlikang liham.
  terminology: Ang “sakit sa balat” ay maingat at angkop para sa צָרַעַת, na hindi dapat ipagkamali nang tuwiran sa modernong Hansen’s disease. Ang “lingkod” para sa עַבְדִּי ay angkop at hindi labis na nagbibigay-kahulugan.
