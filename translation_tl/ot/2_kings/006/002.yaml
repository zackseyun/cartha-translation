  source_fidelity: 'Tumpak na naihahatid ang magkakasunod na cohortative na panukala: pumunta sa Jordan, kumuha ang bawat isa ng isang biga mula roon, at gumawa ng lugar para sa kanilang matitirhan. Ang “Pumaroon kayo” ay angkop na maikli at tuwirang katumbas ng לֵכוּ (“Humayo kayo/Go”).'
