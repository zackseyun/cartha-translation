base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: tl
  text: “Pumaroon po tayo sa Jordan[a]. Kumuha roon ang bawat isa sa atin ng tig-isang biga, at gumawa tayo roon ng isang lugar na matitirhan natin.” Sinabi niya, “Pumaroon kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pumaroon po tayo hanggang sa Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Pumaroon po tayo
  rationale: Ang cohortative na may נָא ay isang magalang na pakiusap. Ipinahahayag ng “po” ang paggalang, habang pinananatili ng “tayo” ang paanyayang sama-samang kumilos.
- source_word: עַד הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Sa konteksto ng paglalakbay, ang עַד ay tumutukoy sa patutunguhan. Karaniwang sapat sa Filipino ang “Jordan” para sa Ilog Jordan.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: Kumuha roon ang bawat isa sa atin ng tig-isang biga
  rationale: 'Ang אִישׁ ... אֶחָת ay distributibo: bawat kasapi ay kukuha ng isa. Ang “tig-isang” ay likas na Filipino para rito, at ang “biga” ay angkop sa קוֹרָה bilang trosong kahoy na gagamiting bahagi ng gusali.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: at gumawa tayo roon ng isang lugar
  rationale: Pinananatili ng “gumawa” ang malawak na diwa ng עשה nang hindi tahasang pinapalitan ng mas tiyak na “magtayo.” Ang “natin” sa kasunod na parirala ay malinaw na naghahayag na para sa kanila ang lugar.
- source_word: לָשֶׁבֶת שָׁם
  choice: na matitirhan natin
  rationale: Sa kontekstong ito, ang ישב ay nangangahulugang manirahan o tumigil sa isang lugar, hindi literal na umupo. Ang “matitirhan natin” ay natural at naiiwasan ang hindi kailangang pag-uulit ng “roon.”
- source_word: וַיֹּאמֶר לֵכוּ
  choice: Sinabi niya, “Pumaroon kayo.”
  rationale: Pinananatili nito ang maikli at tuwirang pahintulot sa Hebreo at ang ugnayang leksikal sa naunang “Pumaroon po tayo.”
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “po” upang ihatid ang magalang na pakiusap ng נָא. Pinili ang “pumaroon” sa halip na mas kolokyal na “pumunta” upang mapanatili ang dignidad ng salaysay nang hindi nagiging lipas ang wika.
