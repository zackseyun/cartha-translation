  source_fidelity: 'Tumpak na naihahatid ang pangunahing Hebreong diwa: matinding taggutom sa Samaria, nagpapatuloy na pagkubkob, at ang sukdulang pagtaas ng presyo ng ulo ng asno at ng sangkapat ng kab ng dumi ng kalapati. Ang “hanggang sa umabot ... ang halaga” ay isang angkop na Filipino na pagpapahayag ng resultang ipinahihiwatig ng עַד הֱיוֹת.'
  naturalness: Natural at malinaw ang modernong Filipino, na may marangal na himig na nababagay sa salaysay. Ang “At narito” ay bahagyang pormal ngunit angkop at epektibong katumbas ng pantawag-pansing וְהִנֵּה. Ang “kinukubkob nila ito” ay nauunawaan sa konteksto at pinananatili ang pandiwang maramihan ng Hebreo.
  terminology: Ang “Samaria,” “asno,” “kab,” at “pilak” ay pare-pareho at angkop. Wastong pinananatili ang “kab” bilang sinaunang sukat. Ang “dumi ng kalapati” ang tuwirang kahulugan ng pinagtatalunang parirala at maayos na nilalagyan ng talababa ang alternatibong pagbasa.
