base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: tl
  text: Nagkaroon ng matinding taggutom sa Samaria. At narito, kinukubkob nila ito, hanggang sa umabot sa walumpung pirasong pilak ang halaga ng isang ulo ng asno, at sa limang pirasong pilak ang sangkapat ng isang kab ng dumi ng kalapati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy nang literal sa dumi ng kalapati ang pariralang Hebreo. Ipinapalagay naman ng ilang tagapagpaliwanag na pangalan ito ng isang murang pagkain o produktong halaman na ipinagbibili noong taggutom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nagkaroon
  rationale: Likas na panimulang salaysay sa Filipino na naghahayag ng bagong kalagayan, nang hindi ginagawang labis na literal ang Hebreong wayyiqtol.
- source_word: רָעָב גָּדוֹל
  choice: matinding taggutom
  rationale: Sa kontekstong ito, ipinahihiwatig ng גָּדוֹל ang tindi ng taggutom; mas natural sa modernong Filipino ang “matinding” kaysa “malaking.”
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing lakas ng הִנֵּה at ang bigat ng kasunod na nakagigimbal na kalagayan.
- source_word: צָרִים עָלֶיהָ
  choice: kinukubkob nila ito
  rationale: Ipinahahayag ng anyong participle ang nagpapatuloy na pagkubkob sa Samaria.
- source_word: עַד הֱיוֹת
  choice: hanggang sa umabot ... ang halaga
  rationale: Ipinakikita ang sukdulang bunga ng pagkubkob sa pamamagitan ng napakataas na halaga, sa malinaw at natural na Filipino.
- source_word: רֹאשׁ חֲמוֹר
  choice: isang ulo ng asno
  rationale: Tuwirang pinananatili ang nakagigimbal na larawan ng isang karaniwang walang-halagang bahagi ng hayop na naging napakamahal dahil sa taggutom.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: walumpung pirasong pilak
  rationale: Hindi tahasang binanggit sa Hebreo ang “shekel,” kaya iniwasang tukuyin nang higit sa pinagmulan ang yunit ng salapi.
- source_word: רֹבַע הַקַּב
  choice: sangkapat ng isang kab
  rationale: Pinananatili ang sinaunang yunit na kab dahil hindi tiyak ang eksaktong katumbas nito sa makabagong sukat.
- source_word: חרי יונים
  choice: dumi ng kalapati
  rationale: Ito ang pinakadirektang kahulugan ng pariralang Hebreo, bagaman pinananatili sa talababa ang tunay na leksikal na pagtatalo kung pangalan ito ng murang pagkain o produktong halaman.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: limang pirasong pilak
  rationale: Kaayon ng naunang presyo at hindi nagdaragdag ng hindi tahasang yunit gaya ng “shekel.”
