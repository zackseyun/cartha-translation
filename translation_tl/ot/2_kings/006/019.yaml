base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: tl
  text: At sinabi sa kanila ni Eliseo, “Hindi ito ang daan, at hindi ito ang lungsod. Sumunod kayo sa akin[a], at aakayin ko kayo sa lalaking hinahanap ninyo.” At inakay niya sila sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Humayo kayo kasunod ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: ang daan
  rationale: Karaniwang tumutukoy ang דֶּרֶךְ sa daan o landas. Likas sa Filipino ang “ang daan” at pinananatili nito ang tiyak at pangkasalukuyang pagtukoy ng pahayag.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Ang עִיר ay karaniwang salita para sa lungsod. Pinananatili ng “ang lungsod” ang tiyak na anyo at ang paghahambing na “hindi ito...”
- source_word: לְכוּ אַחֲרַי
  choice: Sumunod kayo sa akin
  rationale: Literal itong “humayo kayo kasunod ko.” Ang “Sumunod kayo sa akin” ang natural na utos sa modernong Filipino at malinaw na nagpapahiwatig ng paglakad sa likuran ni Eliseo.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: at dadalhin ko kayo
  rationale: Ang Hiphil ng הלך ay causative, “pangungunahan/dadalhin.” Natural at malinaw sa konteksto ang “dadalhin ko kayo,” nang hindi nagdaragdag ng paliwanag.
- source_word: הָאִישׁ
  choice: sa lalaking
  rationale: Ang אִישׁ ay karaniwang “lalaki.” Pinananatili nito ang panlalaking isahan at ang ironiya na si Eliseo mismo ang lalaking hinahanap nila.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: hinahanap ninyo
  rationale: Ang בקשׁ ay “hanapin.” Ang “hinahanap ninyo” ay natural na Filipino para sa nagpapatuloy na paghahanap ng pangkat.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: At dinala niya sila
  rationale: Muli itong causative na anyo ng הלך. Ang “dinala” ay malinaw na nagsasaad na pinangunahan niya sila patungo sa destinasyon at kaayon ng naunang “dadalhin.”
- source_word: שֹׁמְרוֹנָה
  choice: sa Samaria
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa Samaria; karaniwang ipinapahayag ito sa Filipino sa pamamagitan ng “sa Samaria.”
theological_decisions:
- issue: Ang mapanlinlang na pahayag ni Eliseo sa mga Arameo
  choice: 'Tuwirang isinalin: “Hindi ito ang daan, at hindi ito ang lungsod.”'
  alternative: Isang paraprasang tahasang nagsasabing nagsinungaling siya, o nagpapaliwanag kung paanong maaaring bahagyang totoo ang sinabi niya.
  rationale: Inilalahad ng Hebreo ang mismong pahayag nang walang moral na paliwanag. Pinananatili ng salin ang etikal at teolohikal na tensiyon at ipinauubaya ang pagsusuri nito sa mambabasa.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “lungsod” sa halip na mas kolokyal na “siyudad,” at pinanatili ang payak na pagkukuwento at ang di-tuwirang pagtukoy ni Eliseo sa sarili.
