  terminology: Wasto at pare-pareho ang “Yahweh,” “Eliseo,” at “Samaria.” Ang literal na larawang “buksan ang mga mata” ay nararapat panatilihin. Ang “mga ito” ay katanggap-tanggap na salin ng demonstratibong אֵלֶּה, at ang talababa ay wastong naglilinaw na mga sundalong Arameo ang tinutukoy.
