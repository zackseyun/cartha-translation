revisions:
- from: Nang makarating sila sa Samaria, sinabi ni Eliseo, “Yahweh, buksan mo ang mga mata ng mga ito[a] upang makakita sila.” Kaya binuksan ni Yahweh ang kanilang mga mata, at nakakita sila. Naroon pala sila sa gitna ng Samaria!
  to: Nang pumasok sila sa Samaria, sinabi ni Eliseo, “Yahweh, buksan mo ang mga mata ng mga ito[a] upang makakita sila.” Kaya binuksan ni Yahweh ang kanilang mga mata, at nakita nila na nasa gitna sila ng Samaria.
  rationale: Pinalitan ang “makarating” ng “pumasok” upang maipakita ang pagpasok sa Samaria. Inayos ang huling sugnay upang mapanatili ang pagkakasunod na “binuksan ... ang kanilang mga mata, at nakita nila,” habang likas na ipinahahayag sa Tagalog na natuklasan nilang nasa gitna sila ng Samaria. Hindi binabago ng rebisyon ang saklaw ng idyomang “buksan ang mga mata” o ang banal na pangalang Yahweh.
