base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: tl
  text: Nang pumasok sila sa Samaria, sinabi ni Eliseo, “Yahweh, buksan mo ang mga mata ng mga ito[a] upang makakita sila.” Kaya binuksan ni Yahweh ang kanilang mga mata, at nakita nila na nasa gitna sila ng Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ito”; ang tinutukoy ay ang mga sundalong Arameo.
    reason: Nililinaw ang tinutukoy ng demonstratibong walang kasamang pangngalan sa orihinal.
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Nang makarating sila
  rationale: Likas na ipinahahayag sa modernong Tagalog ang temporal na ugnayan at pagpapatuloy ng salaysay nang hindi na isinasalin nang hiwalay ang pormulang ‘at nangyari.’
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang anyo sa Tagalog ng pangalan ng lugar; sa kontekstong ito ay tumutukoy sa lungsod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: buksan mo ang mga mata
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang kaugnayan nito sa pag-aalis ng ipinataw na pagkabulag o kawalan ng pagkilala.
- source_word: אֵלֶּה
  choice: mga ito
  rationale: Malapit ito sa literal na demonstratibo at malinaw sa konteksto; ipinapaliwanag sa talababa na ang tinutukoy ay ang mga sundalong Arameo.
- source_word: וְיִרְאוּ
  choice: upang makakita sila
  rationale: Ipinahahayag ang layunin ng utos-panalan­gin ni Eliseo sa natural na Tagalog.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Kaya binuksan ni Yahweh ang kanilang mga mata
  rationale: Ang ‘Kaya’ ay nagpapakita na ito ang katuparan ng kahilingan ni Eliseo habang pinananatili ang sunod-sunod na kilos.
- source_word: וַיִּרְאוּ
  choice: at nakakita sila
  rationale: Pinananatili ang tuwirang pandiwang ‘makakita’ sa halip na ipakahulugang ‘napagtanto,’ upang hindi mawala ang pag-uulit sa Hebreo.
- source_word: וְהִנֵּה בְּתוֹךְ שֹׁמְרוֹן
  choice: Naroon pala sila sa gitna ng Samaria!
  rationale: Ang ‘pala’ at padamdam ay natural na naghahatid ng biglaang pagkilala at dramatikong diin ng הִנֵּה; ang ‘sa gitna’ ay nagpapanatili sa diwa ng בְּתוֹךְ.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapakilala rito bilang personal na pangalan at hindi bilang titulo.
- issue: Kalikasan ng pagbubukas ng mga mata
  choice: Pinanatili ang literal na larawang ‘buksan ang mga mata’
  alternative: ibalik ang kanilang paningin; ipaunawa sa kanila
  rationale: Hindi tahasang nilulutas ng talata kung pisikal na paningin lamang o kakayahang kumilala sa kinaroroonan ang tinutukoy; pinananatili ng idyoma ang saklaw at tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘Eliseo’ at ‘Samaria’ bilang kinikilalang anyo ng mga pangalang biblikal. Pinanatili ang pag-uulit ng ‘mga mata’ at ‘makakita/nakakita’ upang masalamin ang estruktura at teolohikal na larawan ng Hebreo.
