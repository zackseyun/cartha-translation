  text: וַ/יִּסָּעֵר֙ לֵ֣ב מֶֽלֶךְ אֲרָ֔ם עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יִּקְרָ֤א אֶל עֲבָדָי/ו֙ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם הֲ/לוֹא֙ תַּגִּ֣ידוּ לִ֔/י מִ֥י מִ/שֶּׁ/לָּ֖/נוּ אֶל מֶ֥לֶךְ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: tl
  text: Labis na nabagabag ang kalooban ng hari ng Aram dahil sa bagay na ito. Kaya ipinatawag niya ang kanyang mga lingkod at sinabi sa kanila, “Hindi ba ninyo sasabihin sa akin kung sino sa atin ang nasa panig ng hari ng Israel?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring: “kung sino sa atin ang kakampi ng hari ng Israel.” Maikli ang pananalita sa Hebreo at maaaring magpahiwatig ng pagkampi o pakikipagsabwatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר לֵב
  choice: Labis na nabagabag ang kalooban
  rationale: Ang pandiwa ay tumutukoy sa matinding panloob na pagkabalisa o pagkagitla. Likas sa modernong Filipino ang “nabagabag ang kalooban” at hindi nito nililimitahan ang damdamin sa galit lamang.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: dahil sa bagay na ito
  rationale: Ipinahahayag ng parirala ang sanhi ng matinding pagkabagabag; malinaw at natural sa Filipino ang “dahil sa bagay na ito.”
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng maharlikang hukuman, maaaring tumukoy ito sa mga opisyal o tauhan ng hari. Pinananatili ng “mga lingkod” ang malawak na saklaw ng salitang Hebreo nang hindi ito nililimitahan sa isang tiyak na tungkulin.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Hindi ba ninyo sasabihin sa akin
  rationale: Pinananatili nito ang anyo ng mariing retorikal na tanong at ang himig ng pag-uutos ng hari.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: kung sino sa atin
  rationale: Natural nitong ipinahahayag na naghahanap ang hari ng isang pinaghihinalaang kasamahan mula sa sarili nilang pangkat.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ang nasa panig ng hari ng Israel
  rationale: Napakaikli ng Hebreong parirala at ipinahihiwatig nito ang pagkampi o pakikipagsabwatan. Ang “nasa panig” ay malinaw ngunit hindi gaanong tiyak kaysa “espiya” o “taksil,” na wala sa mismong teksto.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “kalooban” bilang natural na katumbas ng Hebreong idyoma tungkol sa puso bilang sentro ng isip at damdamin. Iniwasan ang mas tiyak na “espiya” o “taksil” upang mapanatili ang kalabuan ng orihinal.
