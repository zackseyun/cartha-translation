source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: tl
  text: Habang nakikipag-usap pa siya sa kanila, narito, bumaba ang mensahero patungo sa kanya at sinabi, “Ang kapahamakang ito ay mula kay Yahweh. Bakit pa ako maghihintay kay Yahweh?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ano pa ang maaasahan ko mula kay Yahweh?” Ang pandiwang Hebreo ay maaaring mangahulugang “maghintay” o “umasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Habang nakikipag-usap pa siya sa kanila
  rationale: Ipinapahayag ng parirala ang nagpapatuloy na pakikipag-usap. Likas sa modernong Tagalog ang “habang ... pa” para sa ganitong kasabay na kilos.
- source_word: הַמַּלְאָךְ
  choice: ang mensahero
  rationale: Sa konteksto, ito ang sugo ng hari, hindi isang makalangit na anghel.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang pantawag-pansing puwersa ng הִנֵּה at ang biglang paglitaw ng mensahero sa salaysay.
- source_word: יֹרֵד אֵלָיו
  choice: bumaba ... patungo sa kanya
  rationale: Pinananatili ang pababang direksiyon ng ירד at malinaw na itinuturo kung kanino lumapit ang mensahero.
- source_word: זֹאת הָרָעָה
  choice: ang kapahamakang ito
  rationale: Sa konteksto, ang רָעָה ay tumutukoy sa matinding kalamidad na dinaranas ng lungsod. Mas natural at hindi nakaliligaw ang “kapahamakan” kaysa “kasamaan,” na karaniwang tumutukoy sa moral na kasamaan.
- source_word: מֵאֵת יְהוָה
  choice: ay mula kay Yahweh
  rationale: Tuwirang pinananatili ang pahayag na si Yahweh ang pinagmulan o ahente ng kapahamakan, nang hindi pinapahina ang tensiyong teolohikal.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Bakit pa ako maghihintay kay Yahweh?
  rationale: Maaaring mangahulugan ang יחל ng paghihintay o pag-asa. Ang “maghihintay” ay malinaw na naghahayag ng pagkainip ng nagsasalita, habang inilalagay sa talababa ang tunay na alternatibong kahulugan.
theological_decisions:
- issue: Paglilipat ng pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan ng Diyos ang tuwirang ginagamit sa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng יחל sa reklamo ng nagsasalita
  choice: maghihintay kay Yahweh
  alternative: umasa kay Yahweh / may aasahan mula kay Yahweh
  rationale: Saklaw ng pandiwa ang paghihintay at pag-asa. Pinili sa teksto ang “maghihintay” ngunit hindi nilutas nang palihim ang leksikal at teolohikal na tensiyon; ang kahulugan ng pag-asa ay nasa talababa.
- issue: Pag-uugnay ng וַיֹּאמֶר sa nagsasalita
  choice: sinabi
  alternative: sinabi ng mensahero
  rationale: Hindi inuulit ang tahasang paksa upang mapanatili ang anyong panghalip ng Hebreo at maiwasang magdagdag ng higit na katiyakan kaysa nasa teksto, bagaman pinakamalapit na antecedent ang mensahero.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “narito” bilang bahagyang mataas na panandang pansin, samantalang nanatiling natural ang kabuuang ayos ng pangungusap. Inilagay ang [a] sa mismong pariralang may leksikal na alternatibo.
