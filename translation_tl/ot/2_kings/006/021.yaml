  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: tl
  text: Nang makita sila ng hari ng Israel, sinabi niya kay Eliseo, “Papatayin ko ba sila? Papatayin ko ba sila[a], ama ko[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Hahampasin ko ba sila? Hahampasin ko ba sila?” Inuulit sa Hebreo ang anyong pandiwa upang magbigay-diin; sa kontekstong militar, ipinahihiwatig nito ang pagpatay sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “ama ko” ay isang magalang na paraan ng pagtawag kay Eliseo, hindi pahayag na siya ang biyolohikal na ama ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang ayos na “sinabi niya” kasunod ng temporal na sugnay.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng construct chain at tiyak ang tinutukoy sa konteksto.
- source_word: אֶל אֱלִישָׁע
  choice: kay Eliseo
  rationale: Minamarkahan ng אֶל ang kinakausap. Hindi idinagdag ang “propeta” sapagkat wala ito sa Hebreo.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: Nang makita sila
  rationale: Ang infinitive construct na may כ at hulaping 3ms ay temporal. Ang hari ang likas na simuno ng “makita” ayon sa konteksto; hindi na kailangang ulitin ang panghalip sa Tagalog.
- source_word: הַאַכֶּה אַכֶּה
  choice: Papatayin ko ba sila? Papatayin ko ba sila?
  rationale: Ang inuulit na anyong pandiwa ay nagbibigay-diin sa tanong. Pinanatili ang buong pag-uulit, at ginamit ang “papatayin” upang maipahayag ang nakamamatay na diwang militar sa konteksto.
- source_word: אָבִי
  choice: ama ko
  rationale: Literal itong “ama ko” at ginagamit bilang magalang na pagtawag kay Eliseo, hindi bilang pahayag ng biyolohikal na relasyon.
theological_decisions:
- issue: Magalang na pagtawag kay Eliseo
  choice: Panatilihin ang literal na “ama ko.”
  alternative: Isalin nang mas interpretibo bilang “panginoon ko,” “guro ko,” o “po.”
  rationale: Familial ang mismong wikang ginamit ng tekstong Hebreo. Pinananatili ng “ama ko” ang talinghaga at paggalang nang hindi ito pinapantay sa isang partikular na titulo.
- issue: Lakas ng pandiwang הַכָּה sa kontekstong militar
  choice: Isalin bilang “papatayin” habang ipinapaliwanag sa talababa ang mas literal na saklaw na “hampasin/pabagsakin.”
  alternative: Isalin nang mas literal bilang “hahampasin” o “pababagsakin.”
  rationale: Sa tagpong ito, nagtatanong ang hari kung papatayin niya ang mga kaaway na nasa kapangyarihan niya. Gayunman, hindi itinatago ang mas malawak na leksikal na saklaw ng pandiwa.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog, ngunit pinanatili ang marangal na himig. Ginamit ang natural na ayos ng temporal na sugnay sa unahan. Pinanatili ang mariing pag-uulit at ang di-karaniwang honoripikong “ama ko,” na nilinaw sa talababa.
