base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: tl
  text: Pagkatapos nito, tinipon ni Ben-hadad, na hari ng Aram[a], ang buong hukbo niya[b]. Umakyat siya at kinubkob ang Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo, “hari ng Aram”; tradisyonal na isinasaling “hari ng Siria.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “lahat ng puwersa niya”; sa Hebreo, “buong kampo/hukbo niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Natural na panandang pasalaysay sa Filipino na nagpapanatili ng pagkakasunod ng mga pangyayari nang hindi gumagamit ng mabigat na literalismong “at nangyari.”
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang tipunin o buuin sa isang lugar; ang konteksto ang nagpapakitang militar ang pagtitipon.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang mismong Hebreong pangalan ng rehiyon sa halip na ang tradisyonal ngunit hindi literal na “Siria.”
- source_word: כָּל מַחֲנֵהוּ
  choice: ang buo niyang hukbo
  rationale: Ang מַחֲנֶה ay maaaring tumukoy sa kampo, hukbo, o mga puwersa. Sa kontekstong ito ng pagkubkob, malinaw at natural ang “buo niyang hukbo.”
- source_word: וַיַּעַל
  choice: Umahon siya
  rationale: Pinananatili ang diwa ng pag-akyat o pagpunta paitaas na nasa Hebreo, habang nananatiling natural sa salaysay militar.
- source_word: וַיָּצַר עַל
  choice: kinubkob
  rationale: Tumpak at maikling salin ng pariralang nangangahulugang palibutan ang isang lungsod upang lusubin o pasukuin ito.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Nakasalig sa karaniwang makabagong anyo ng pangalan ng lugar sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Umahon” upang mapanatili ang topograpikong kilos ng Hebreo, at “kinubkob” bilang natural na terminong militar. Inilagay ang mga talababa kaagad sa mga salitang tinutukoy ng mga ito.
