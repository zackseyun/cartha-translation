base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: tl
  text: Kaya’t pinakuluan namin ang aking anak na lalaki at kinain namin siya.[a] Kinabukasan, sinabi ko sa kanya, ‘Ibigay mo ang anak mong lalaki upang kainin natin siya,’[b] ngunit itinago niya ang anak niyang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “niluto namin ang aking anak na lalaki at kinain namin siya.”
    reason: lexical_alternative
  - marker: b
    text: O “Ibigay mo ang anak mong lalaki, at kakainin natin siya.” Ang anyong Hebreo ay maaari ring unawain bilang payak na panghinaharap, bagaman sinusuportahan ng konteksto ang diwang layunin matapos ang “Ibigay mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: pinakuluan namin
  rationale: Ang piel ng בשׁל ay tumutukoy rito sa pagpapakulo o pagluluto. Pinananatili ng “pinakuluan” ang kongkreto at kakila-kilabot na larawan ng salaysay.
- source_word: בְּנִי / בְּנֵךְ / בְּנָהּ
  choice: anak kong lalaki / anak mong lalaki / kanyang anak
  rationale: Ang בֵּן ay tiyak na “anak na lalaki.” Nililinaw ito sa unang dalawang banggit; sa huling banggit, natural sa Filipino ang “kanyang anak” dahil malinaw na ang kasarian mula sa naunang pahayag.
- source_word: וַנֹּאכְלֵהוּ
  choice: at kinain siya
  rationale: Tuwirang katumbas ng אכל ang “kumain.” Ang “siya” ay nagpapanatili sa tahasang panlalaking layon ng Hebreo.
- source_word: בַּיּוֹם הָאַחֵר
  choice: Kinabukasan
  rationale: Natural at eksaktong modernong Filipino para sa araw na kasunod ng unang pangyayari.
- source_word: תְּנִי
  choice: Ibigay mo
  rationale: Tuwirang pautos ang anyo ng נתן; ang “ibigay mo” ay natural at hindi nagdaragdag ng interpretasyon.
- source_word: וְנֹאכְלֶנּוּ
  choice: upang kainin natin siya
  rationale: Ang imperfect na may waw matapos ang pautos ay maaaring magpahayag ng layunin o kasunod na resulta. Ang “upang” ay angkop sa konteksto, habang itinatala sa talababa ang payak na pagbasa bilang hinaharap.
- source_word: וַתַּחְבִּא
  choice: ngunit itinago niya
  rationale: Bagaman maaaring simpleng “at” ang waw, malinaw na salungat sa hinihinging kilos ang pagtatago; natural na ipinahahayag ito ng “ngunit.”
