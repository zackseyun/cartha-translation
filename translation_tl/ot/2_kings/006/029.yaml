  to: Kaya’t pinakuluan namin ang aking anak na lalaki at kinain namin siya.[a] Kinabukasan, sinabi ko sa kanya, ‘Ibigay mo ang anak mong lalaki upang kainin natin siya,’[b] ngunit itinago niya ang anak niyang lalaki.
  rationale: Isinaayos ang huling parirala upang mapanatili ang tahasang “anak na lalaki” ng Hebreo, at pinalitan ang “sa babae” ng “sa kanya” upang hindi magdagdag ng pangngalan na wala sa talata. Pinanatili ang layuning pagbasa ng pangalawang sugnay at ang talababa para sa posibleng payak na panghinaharap.
