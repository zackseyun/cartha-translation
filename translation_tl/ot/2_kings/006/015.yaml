- from: Maagang bumangon at lumabas ang tagapaglingkod ng tao ng Diyos. At nakita niyang nakapalibot sa lungsod ang isang hukbo na may mga kabayo at mga karwahe. Sinabi ng kanyang lingkod[a] sa kanya, “Naku, amo ko! Ano ang gagawin natin?”
  to: 'Maagang bumangon at lumabas ang tagapaglingkod ng tao ng Diyos. At nakita niya: isang hukbo, na may mga kabayo at karwahe, ang nakapalibot sa lungsod. Sinabi ng lingkod sa tao ng Diyos, “Naku, amo ko! Ano ang gagawin natin?”'
  rationale: Inayos ang huling sugnay upang malinaw na ang lingkod ang nagsasalita sa tao ng Diyos. Ginawang mas matingkad ang biglaang pagkakita sa hukbo sa pamamagitan ng natural na bantas at ayos ng pangungusap. Walang binagong kahulugan o teolohikal na pagpapakahulugan.
