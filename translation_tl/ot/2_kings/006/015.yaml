base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: tl
  text: 'Maagang bumangon at lumabas ang tagapaglingkod ng tao ng Diyos. At nakita niya: isang hukbo, na may mga kabayo at karwahe, ang nakapalibot sa lungsod. Sinabi ng lingkod sa tao ng Diyos, “Naku, amo ko! Ano ang gagawin natin?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: Maagang bumangon
  rationale: Ang Hiphil ng שׁכם kasama ng לָקוּם ay nagsasaad ng maagang pagbangon. Likas at malinaw sa modernong Tagalog ang “maagang bumangon.”
- source_word: מְשָׁרֵת
  choice: tagapaglingkod
  rationale: Tumutukoy ito sa isang taong personal o opisyal na naglilingkod. Ang “tagapaglingkod” ay marangal at angkop sa ugnayan niya sa tao ng Diyos.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang nakaugaliang titulong propetiko at ang kaugnayan nito sa ibang bahagi ng Kasulatang Hebreo.
- source_word: וְהִנֵּה
  choice: At nakita niyang
  rationale: Sa kontekstong ito, ipinakikilala ng וְהִנֵּה ang biglaang tanawing nasaksihan ng lingkod. Inihahatid ng pariralang ito ang perspektiba at pagkakatuklas sa natural na Tagalog nang hindi nagdaragdag ng paliwanag.
- source_word: חַיִל
  choice: isang hukbo
  rationale: Sa kontekstong militar, ang salita ay tumutukoy sa isang organisadong sandatahang puwersa; “hukbo” ang pinakakaraniwan at malinaw na katumbas.
- source_word: סוֹבֵב
  choice: nakapalibot
  rationale: Ang participle ay naglalarawan sa umiiral na kalagayan nang makita ito ng lingkod. Pinananatili ng “nakapalibot” ang aspektong iyon.
- source_word: וְסוּס וָרָכֶב
  choice: na may mga kabayo at mga karwahe
  rationale: Ginagamit dito nang kolektibo ang mga pangngalang isahan. Natural sa Tagalog ang maramihang anyo at malinaw nitong inilalarawan ang kagamitan ng hukbo.
- source_word: נַעֲרוֹ
  choice: kanyang lingkod
  rationale: Maaaring mangahulugan ang נַעַר ng binata, katulong, o lingkod. Dahil ipinakilala na siya bilang מְשָׁרֵת, “lingkod” ang pinakamalinaw sa konteksto, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: אֲהָהּ
  choice: Naku
  rationale: Nagpapahayag ito ng biglang pangamba o pagkabalisa. Ang “Naku” ay natural sa kasalukuyang Tagalog at angkop sa tindi ng tagpo.
- source_word: אֲדֹנִי
  choice: amo ko
  rationale: Magalang itong tawag ng lingkod sa nakatataas sa kanya, hindi isang tiyak na banal na titulo. Iniiwasan ng “amo ko” ang maling pagbasa na ang Diyos ang direktang kinakausap.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: Ano ang gagawin natin?
  rationale: Ito ang natural na Tagalog para sa tanong na nagpapahayag ng pagkabalisa tungkol sa nararapat nilang gawin sa sitwasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapaglingkod” sa unang pagpapakilala at “lingkod” sa kasunod na pagtukoy upang maging natural ngunit malinaw na iisang tao ang tinutukoy. Hindi ginamit ang mas arkaikong “masdan” para sa וְהִנֵּה; sa halip, ipinahayag ang biglaang pagkakita mula sa pananaw ng lingkod.
