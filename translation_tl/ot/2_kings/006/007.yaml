  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: tl
  text: Sinabi niya, “Pulutin mo iyon para sa sarili mo.”[a] At iniunat niya ang kaniyang kamay at kinuha ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Iangat mo iyon para sa sarili mo.” Mas literal na “iangat” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na salaysay sa modernong Tagalog; ipinagpapatuloy nito ang sunod-sunod na kilos nang hindi dinaragdagan ang ugnayang pangdiskurso.
- source_word: הָרֶם
  choice: Pulutin mo iyon
  rationale: Ang pautos mula sa רום/הרים ay literal na tumutukoy sa pag-angat, ngunit sa konteksto ng bagay na kukunin mula sa tubig, natural sa Tagalog ang “pulutin.” Tahasang ibinigay ang layon na “iyon” mula sa konteksto.
- source_word: לָךְ
  choice: para sa sarili mo
  rationale: Pinananatili nito ang personal o benepaktibong diwa ng pang-ukol na may hulaping ikalawang panauhang panlalaki.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: iniunat ng lalaki ang kanyang kamay
  rationale: Ang idyomang Hebreo ay nagsasaad ng pag-abot ng kamay upang hawakan ang isang bagay. Nilinaw ang tagaganap bilang “ang lalaki” upang maiwasan sa Tagalog ang pansamantalang kalituhan kung sino ang tinutukoy ng sunod-sunod na “niya.”
- source_word: וַיִּקָּחֵהוּ
  choice: at kinuha iyon
  rationale: Tapat sa pangunahing kahulugan ng לקח na “kunin,” at iniiwasan ang di-kailangang pag-uulit ng “pulutin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pulutin” bilang natural na ekspresyon sa konteksto, habang pinanatili sa talababa ang mas literal na “iangat.”
