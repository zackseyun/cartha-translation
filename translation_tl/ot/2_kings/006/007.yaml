  verdict: revise
  source_fidelity: Tumpak sa pangkalahatan ang utos na iangat/pulutin ang bagay at ang kasunod na pag-unat ng kamay at pagkuha rito. Gayunman, walang batayan sa Hebreo upang tukuyin ang tagaganap bilang “ang lalaki”; panghalip na panlalaking isahan lamang ang naroon, at malinaw na ang tinutukoy nito mula sa konteksto.
  naturalness: Natural ang “Pulutin mo iyon para sa sarili mo,” bagaman ang “Kaya” ay bahagyang nagpapahiwatig ng ugnayang lohikal na hindi tahasang minamarka ng Hebreo. Mas payak at mas malapit sa daloy ng salaysay ang “At iniunat niya ang kaniyang kamay at kinuha ito.”
  terminology: Ang “pulutin” ay angkop na kontekstuwal na salin ng pautos na “iangat,” at maayos na pinananatili ng talababa ang mas literal na alternatibo. Ang “sarili mo” ay katanggap-tanggap na paraan upang ipahiwatig ang personal/benepaktibong himig ng לָךְ.
