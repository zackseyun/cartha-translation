  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: tl
  text: Nakikipagdigma noon laban sa Israel ang hari ng Aram. Sumangguni siya sa kanyang mga lingkod at sinabi, “Sa ganito’t ganoong lugar[a] ang magiging kampo ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pagkakasabi, “Sa ganito’t ganoong lugar ang aking himpilan.” Gumagamit ang Hebreo ng isang idyoma para sa lugar na hindi tiyak o hindi pinangalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: ang hari ng Aram
  rationale: Pinananatili ang pangalang Aram sa halip na palitan ito ng tradisyonal na “Siria.” Hindi na kailangang isalin nang hiwalay ang pang-ugnay na וּ sa simula ng talata sa natural na salaysay sa Tagalog.
- source_word: הָיָה נִלְחָם
  choice: nakikipagdigma noon
  rationale: Ang היה kasama ng participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos sa nakaraan. Ipinahahayag ng “nakikipagdigma noon” ang aspektong ito nang natural sa Tagalog.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa pandiwang נלחם, tinutukoy ng ב ang kalaban; kaya malinaw at idiomatiko ang “laban sa Israel.”
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: Sumangguni siya sa kanyang mga lingkod
  rationale: Ang pandiwa ay tumutukoy sa paghingi o pakikipagpalitan ng payo. Pinananatili ng “mga lingkod” ang malawak na kahulugan ng עֲבָדָיו sa halip na limitahan ito sa “mga opisyal.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Likas na panandang Tagalog ito sa tuwirang sipi at maayos na naghahatid ng gamit ng quotative infinitive.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: Sa ganito’t ganoong lugar
  rationale: Ang tambalang idyoma ay tumutukoy sa isang lugar na hindi pinangalanan. Pinananatili ng “ganito’t ganoong lugar” ang sadyang di-tiyak na anyo nito.
- source_word: תַּחֲנֹתִי
  choice: ang magiging kampo ko
  rationale: Tumutukoy ang anyo sa kampo o paghihimpil ng hari. Ang “magiging” ay likas na naghahayag ng planadong puwesto sa konteksto nang hindi ginagawang tahasang pandiwang “magtatayo” ang maikling pariralang Hebreo.
