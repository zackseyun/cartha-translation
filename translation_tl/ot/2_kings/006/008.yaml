translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “lingkod” upang mapanatili ang lawak ng katawagang Hebreo, at “kampo” bilang karaniwang salitang nauunawaan sa kontekstong militar.
