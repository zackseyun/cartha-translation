revisions:
- from: Kaya naghanda siya para sa kanila ng isang malaking salu-salo[a], at kumain sila at uminom. Pagkatapos, pinayaon niya sila, at bumalik sila sa kanilang panginoon[b]. Mula noon, hindi na muling pumasok sa lupain ng Israel ang mga pangkat ng mananalakay mula sa Aram[c].
  to: Kaya naghanda siya para sa kanila ng isang malaking salu-salo[a], at kumain sila at uminom. Pagkatapos, ipinayaon niya sila, at nagtungo sila sa kanilang panginoon[b]. Hindi na muling pumasok sa lupain ng Israel ang mga pangkat ng mananalakay mula sa Aram[c].
  rationale: Pinalitan ang “bumalik sila” ng “nagtungo sila” upang hindi idagdag ang di-tahasang ideya ng pagbabalik. Inalis ang “Mula noon” upang mapanatili ang payak na pahayag ng Hebreo na hindi na muling dumating ang mga pangkat ng mananalakay. Napanatili ang iba pang tapat at natural na pagpili ng salita at lahat ng angkla ng talababa.
