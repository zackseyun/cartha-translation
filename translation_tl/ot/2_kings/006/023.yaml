base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: tl
  text: Kaya naghanda siya para sa kanila ng isang malaking salu-salo[a], at kumain sila at uminom. Pagkatapos, ipinayaon niya sila, at nagtungo sila sa kanilang panginoon[b]. Hindi na muling pumasok sa lupain ng Israel ang mga pangkat ng mananalakay mula sa Aram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang malaking handaan.” Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan para sa paghahanda ng masaganang pagkain.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang hari ng Aram ang tinutukoy.
    reason: referent_clarification
  - marker: c
    text: Ang “Aram” ang pangalang Hebreo na madalas isaling “Siria” sa mas matatandang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: naghanda siya ... ng isang malaking salu-salo
  rationale: Ang pandiwa at kaugnay na pangngalan ay bumubuo ng idyomang tumutukoy sa paghahanda ng masaganang handaan. Natural sa modernong Tagalog ang “malaking salu-salo” at napapanatili nito ang diin ng גְדוֹלָה.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Tumutukoy ang panghalip sa mga bihag na Arameo; malinaw at natural ang payak na pagtukoy.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain sila at uminom
  rationale: Tuwirang inililipat ang magkatambal na mga pandiwa sa natural na ayos ng Tagalog.
- source_word: וַיְשַׁלְּחֵם
  choice: pinayaon niya sila
  rationale: Ipinahihiwatig ng konteksto na pinalaya at pinaalis sila. Ang “pinayaon” ay marangal at angkop sa salaysay nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: sa kanilang panginoon
  rationale: Bagaman nasa anyong morpolohikal na maramihan ang Hebreo, malamang na iisang pinunong may ranggo ang tinutukoy—ang hari ng Aram. Pinananatili ng “panginoon” ang saklaw ng kahulugang amo o nakatataas, nang hindi tahasang ipinapalit ang “hari.”
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: Mula noon, hindi na muling
  rationale: Ipinapahayag ng idyoma ang pagtigil ng paulit-ulit na pangyayari. Natural na naihahatid sa Tagalog ng “hindi na muling,” habang nililinaw ng “Mula noon” ang ugnayang pasalaysay.
- source_word: גְּדוּדֵי אֲרָם
  choice: ang mga pangkat ng mananalakay mula sa Aram
  rationale: Ang גְּדוּדֵי ay tumutukoy sa mga pangkat na sumasalakay, hindi kinakailangang sa buong pormal na hukbo. Pinanatili ang pangalang “Aram” ayon sa tekstong Hebreo.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: pumasok sa lupain ng Israel
  rationale: Ang בוא na may ב ay nagpapahiwatig ng pagkilos papasok sa isang teritoryo. Pinananatili ng “lupain ng Israel” ang tahasang heograpikal na pananalita.
theological_decisions:
- issue: Pagkakakilanlan ng אֲדֹנֵיהֶם
  choice: kanilang panginoon
  alternative: kanilang hari
  rationale: Malamang na hari ng Aram ang tinutukoy sa konteksto, ngunit hindi tahasang “hari” ang salitang Hebreo. Pinananatili ng salin ang leksikal na lawak at hindi nilulutas nang tahasan ang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “salu-salo” para sa natural na idyoma, “pinayaon” para sa maikli at dignified na pagsasalaysay, at “mga pangkat ng mananalakay” upang maiba sa isang buong pormal na hukbo. Inayos ang mga pananda sa talababa ayon sa mismong salitang ipinapaliwanag.
