  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “malaking salu-salo,” “ipinayaon,” at “mga pangkat ng mananalakay.” Ang “nagtungo sila” ay natural na pagsasalaysay at mas tumpak kaysa “bumalik sila.”
  terminology: Ang “Aram,” “lupain ng Israel,” at “panginoon” ay angkop. Pinananatili ng “panginoon” ang saklaw ng אֲדֹנֵיהֶם nang hindi ipinagpapalagay na tuwirang ‘hari,’ habang nililinaw ito nang maingat sa talababa.
