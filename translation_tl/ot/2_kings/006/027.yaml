  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: tl
  text: At sinabi niya[a], “Kung hindi ka tutulungan ni Yahweh, saan ako kukuha ng maitutulong sa iyo? Sa giikan ba o sa pisaan ng ubas?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Posible ring unawain ang unang sugnay bilang: “Huwag ka nawang iligtas ni Yahweh.” Hindi ganap na tiyak ang gamit ng Hebreong pantangging אַל sa pangungusap na ito. Ang pandiwang ישׁע sa dalawang sugnay ay maaaring mangahulugang “tumulong,” “magligtas,” o “magligtas mula sa panganib.”'
    reason: Pinananatili ang posibleng di-kondisyunal na pagbasa ng אַל at ang saklaw ng kahulugan ng ישׁע, samantalang ang pangunahing teksto ay sumusunod sa kondisyunal na pagbasa ng English POB audit trail.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Likas sa salaysay na Hebreo ang waw-consecutive; pinananatili ng “At” ang pag-usad at pagkakaugnay ng tagpo.
- source_word: אַל
  choice: Kung hindi
  rationale: Bagaman karaniwang pantanggi ang אַל, dito ay pinakamalinaw itong unawain bilang pasubali o retorikal na saligan ng kasunod na tanong. Inilalagay sa talababa ang mas literal ngunit mahirap na alternatibo.
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: tutulungan ka / tutulungan kita
  rationale: Maaaring mangahulugan ang ישׁע na tumulong, magligtas, o magligtas mula sa panganib. Sa konteksto ng taggutom at kakulangan ng pagkain, natural ang “tulungan,” at napapanatili rin ang pag-uulit ng pandiwa sa dalawang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מֵאַיִן
  choice: saan
  rationale: Tinatanong nito ang pinagmumulan ng anumang maibibigay na tulong. Malinaw ang “saan” sa kasunod na mga tanong tungkol sa giikan at pisaan ng ubas.
- source_word: הֲמִן הַגֹּרֶן
  choice: Sa giikan ba
  rationale: Ang גֹּרֶן ay lugar ng paggiik at, sa kontekstong ito, pinagmumulan ng butil. Ipinahahayag ng “ba” ang Hebreong tandang pananong.
- source_word: מִן הַיָּקֶב
  choice: o sa pisaan ng ubas
  rationale: Ang יֶקֶב ay pisaan o sisidlan para sa katas ng ubas. Ang “pisaan ng ubas” ay kongkreto at madaling maunawaan, at katambal ng giikan bilang pinagmumulan ng pagkain at inumin.
theological_decisions:
- issue: Paglalahad sa pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang nasa tekstong Hebreo ang tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng ישׁע sa konteksto ng taggutom
  choice: tumulong
  alternative: magligtas / magpalaya
  rationale: Praktikal na saklolo mula sa matinding kakulangan ang agarang paksa. Hindi nito itinatanggi ang mas malawak na kahulugan ng pandiwa, kaya binabanggit ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikling retorikal na mga tanong at ang magkatambal na “giikan” at “pisaan ng ubas.” Ang “saan kita matutulungan?” ay sadyang malapit sa anyo ng Hebreo; nililinaw ng kasunod na tanong na pinagmumulan ng panustos ang tinutukoy.
