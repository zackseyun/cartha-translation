- from: Ngunit sinabi niya, “Huwag mo silang patayin. Papatayin mo ba ang mga binihag mo sa pamamagitan ng iyong espada at pana?[a] Maghain ka sa kanila ng tinapay at tubig[b] upang makakain at makainom sila, at pagkatapos ay makabalik sila sa kanilang panginoon.[c]”
  to: Ngunit sinabi niya, “Huwag mo silang patayin. Papatayin mo ba ang mga binihag mo gamit ang iyong espada at pana?[a] Maghain ka sa kanila ng tinapay at tubig[b] upang makakain at makainom sila at pumunta sa kanilang mga panginoon.[c]”
  rationale: Pinalitan ang “makabalik” ng “pumunta” upang huwag idagdag ang diwang pagbabalik na wala sa Hebreo. Ginawang “mga panginoon” ang pangunahing salin upang maipakita ang maramihang anyo ng אֲדֹנֵיהֶם, habang pinananatili sa talababa ang kontekstuwal na posibilidad ng iisang pinuno. Hindi binago ang diwang ‘patayin,’ na angkop sa agarang konteksto ng mga bihag at sa retorikal na pagtanggi sa kanilang pagpatay.
