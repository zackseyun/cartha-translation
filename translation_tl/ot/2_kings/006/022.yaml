base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Huwag mo silang patayin. Papatayin mo ba ang mga binihag mo gamit ang iyong espada at pana?[a] Maghain ka sa kanila ng tinapay at tubig[b] upang makakain at makainom sila at pumunta sa kanilang mga panginoon.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Retorikal ang tanong sa Hebreo at pinatitibay nito ang utos na huwag silang patayin. Maaari ring isalin: “Pinapatay mo ba ang mga binihag mo gamit ang iyong espada at pana?”'
    reason: alternative_reading
  - marker: b
    text: Maaaring gamitin ang “tinapay at tubig” para sa pangunahing pagkain at inumin, ngunit tahasang binabanggit ng Hebreo ang dalawang ito.
    reason: lexical_alternative
  - marker: c
    text: O “sa kanilang panginoon.” Maramihan ang anyong Hebreo, ngunit maaari itong tumukoy sa iisang nakatataas na pinuno.
    reason: source_ambiguity
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: patayin / papatayin
  rationale: Maaaring mangahulugan ang נכה ng paghampas o pagpatay. Sa konteksto, hinihingi ng hari na patayin ang mga bihag, kaya malinaw at likas sa Tagalog ang “patayin,” habang pinananatili ng tanong ang retorikal na diin ng Hebreo.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: ang mga binihag mo
  rationale: 'Tiyak na militar ang diwa ng שבה: kumuha o magdala bilang bihag. Maikli at natural sa Tagalog ang “mga binihag mo.”'
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: sa pamamagitan ng iyong espada at pana
  rationale: Pinananatili ang dalawang sandata at ang instrumental na gamit ng pang-ukol. Mahalaga ang mga ito sa argumento na hindi nakuha ng hari ang mga taong ito sa karaniwang pakikipagdigma.
- source_word: שִׂים לֶחֶם וָמַיִם לִפְנֵיהֶם
  choice: Maghain ka sa kanila ng tinapay at tubig
  rationale: Ang literal na “ilagay sa harap nila” ay tumutukoy sa paghahain. Ang “maghain” ay natural na modernong Tagalog at pinananatili pa rin ang tahasang binanggit na tinapay at tubig.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: upang makakain at makainom sila, at pagkatapos ay makabalik sila
  rationale: Ipinakikita ng “upang” ang layunin o bunga ng utos. Ang “pagkatapos” ay nilinaw lamang ang likas na pagkakasunod-sunod ng pagkain, pag-inom, at pag-alis; ang “makabalik” ay angkop sa pagpunta nila sa pinunong pinanggalingan nila.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: sa kanilang panginoon
  rationale: Bagaman anyong maramihan ang אֲדֹנֵיהֶם, maaari itong tumukoy sa iisang nakatataas na pinuno; sa konteksto, malamang na ang hari ng Aram ang tinutukoy. Isang talababa ang nagpapanatili sa posibilidad na “mga panginoon.”
theological_decisions:
- issue: Lakas at layon ng retorikal na tanong ni Eliseo
  choice: Iniharap bilang retorikal na tanong na nagpapatibay sa utos na huwag patayin ang mga bihag.
  alternative: Basahin bilang tanong na nakatuon lamang sa karaniwang pagtrato sa mga bihag na nakuha mismo ng hari sa labanan.
  rationale: May pantanong na ה sa Hebreo. Pinananatili ng salin ang tanong at hindi ginagawang malawakang tuntunin ang sinabi ni Eliseo nang lampas sa agarang pangyayari.
- issue: Bilang ng tinutukoy ng אֲדֹנֵיהֶם
  choice: “kanilang panginoon,” na malamang ay ang hari o punong pinaglilingkuran nila
  alternative: “kanilang mga panginoon” o “kanilang mga pinuno”
  rationale: Ang anyong Hebreo ay maaaring gramatikal na maramihan, ngunit pinahihintulutan ng gamit at konteksto ang isang nakatataas na panginoon. Inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “espada” at “pana,” na karaniwang nauunawaan, at ang “maghain” bilang natural na paraan ng pagsasabing maglagay ng pagkain sa harap ng mga panauhin. Iniwasan ang arkaikong ayos at pinanatili ang retorikal na tensiyon ng talata.
