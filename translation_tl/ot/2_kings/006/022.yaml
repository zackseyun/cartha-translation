  source_fidelity: 'Tumpak ang pangunahing diwa: ipinagbabawal ni Eliseo ang pagpatay sa mga bihag, saka inuutos na pakainin at painumin sila. Gayunman, ang “makabalik” ay nagdaragdag ng diwang ‘bumalik’ na wala sa וְיֵלְכוּ (‘pumunta/umalis’). Ang אֲדֹנֵיהֶם ay anyong maramihan; mas ligtas na isalin itong “mga panginoon” at ilagay sa talababa ang posibleng pagtukoy sa iisang nakatataas na pinuno.'
  naturalness: Natural at angkop sa makabagong Filipino ang “Huwag mo silang patayin,” “mga binihag mo,” at “Maghain ka sa kanila.” Mas tuwiran at mas malapit sa Hebreo ang “pumunta sila” kaysa “makabalik sila.”
  terminology: Ang “espada,” “pana,” “tinapay at tubig,” at “maghain” ay malinaw at nasa wastong rehistro. Ang “mga panginoon” ang mas tahasang tumutugma sa maramihang anyo ng Hebreo, nang hindi isinasara ang posibilidad na isang hari ang kolektibong tinutukoy.
