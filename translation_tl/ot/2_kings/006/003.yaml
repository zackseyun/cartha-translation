  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: tl
  text: At sinabi ng isa sa kanila[a], “Pumayag po kayong sumama sa inyong mga lingkod.” Sumagot siya, “Sasama ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinabi ng isa.”
    reason: Ang הָאֶחָד ay literal na “ang isa” at maaaring idiomatikong tumukoy sa isa sa pangkat.
lexical_decisions:
- source_word: הָאֶחָד
  choice: isa sa kanila
  rationale: Ang literal na “ang isa” ay idyomatikong tumutukoy sa isang miyembro ng pangkat. Mas malinaw at natural sa Tagalog ang “isa sa kanila.”
- source_word: הוֹאֶל נָא
  choice: pakisama po kayo
  rationale: Ipinahahayag ng הואל נָא ang magalang na pakiusap na pumayag o maging handang gawin ang kasunod na kilos. Pinagsasama ng “paki-” at “po” ang pakiusap at paggalang nang natural sa modernong Tagalog.
- source_word: וְלֵךְ
  choice: sumama
  rationale: Bagaman pangunahing nangangahulugang “pumunta,” sa pakiusap na pumunta kasama ng pangkat, natural na ipinahahayag sa Tagalog ang kilos bilang “sumama.”
- source_word: אֶת עֲבָדֶיךָ
  choice: sa inyong mga lingkod
  rationale: Ang אֶת ay nagsasaad dito ng pagsama, at ang עֲבָדֶיךָ ay magalang na pagtukoy ng mga tagasunod sa kanilang sarili bilang mga lingkod ng propeta. Pinananatili ng “inyong mga lingkod” ang ugnayang ito.
- source_word: אֲנִי אֵלֵךְ
  choice: Sasama ako
  rationale: May bahagyang diin ang tahasang panghalip na אֲנִי. Natural na inilalagay sa hulihan ang “ako” sa Tagalog, at ang “sasama” ay umaayon sa kahulugan ng tugon sa pakiusap.
