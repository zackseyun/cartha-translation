  naturalness: Natural at magalang sa modernong Filipino Tagalog ang “Pumayag po kayong sumama sa inyong mga lingkod.” Ang “At sinabi” ay mas angkop na katumbas ng Hebrew narrative waw kaysa “Pagkatapos,” na maaaring magdagdag ng mas malinaw na sunod-sunod na oras kaysa ipinahihiwatig ng teksto.
