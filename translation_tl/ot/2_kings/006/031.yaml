base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: tl
  text: At sinabi niya, “Gawin nawa ng Diyos sa akin ang gayon, at higit pa, kung mananatili pa sa kanya[a] ngayong araw ang ulo ni Eliseo na anak ni Safat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kung tatayo sa kanya ngayong araw ang ulo ni Eliseo na anak ni Safat”—ibig sabihin, kung mananatili pa ngayong araw ang ulo ni Eliseo sa kanyang katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Gawin nawa ito sa akin ng Diyos, at higit pa rito
  rationale: Isa itong nakapirming Hebreong pormula ng sumpang panunumpa. Pinananatili ng salin ang panawagan sa Diyos at ang di-tiyak ngunit matinding banta nang hindi ito ginagawang karaniwang bulalas lamang.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, ang gamit nito rito at ang pandiwang kaakibat nito ay tumutukoy sa iisang Diyos.
- source_word: אִם
  choice: kung
  rationale: Sa ganitong panunumpa, maaari itong magpahiwatig ng mariing pagtanggi, ngunit pinananatili ng “kung” ang eliptikal na anyo ng Hebreo at malinaw pa rin ang ipinapahiwatig na banta.
- source_word: יַעֲמֹד
  choice: mananatili pa
  rationale: Literal itong “tatayo,” ngunit kapag ulo ang simuno, ang diwa ay ang patuloy na pagkakadugtong nito sa katawan. Ang “mananatili pa” ay malinaw sa makabagong Tagalog habang napapanatili ang matalim na larawan.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: ang ulo ni Eliseo na anak ni Safat
  rationale: Pinananatili nito ang tahasang pagbanggit sa ulo at ang pagkakakilanlan kay Eliseo bilang anak ni Safat.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Ang panghalip ay likas na tumutukoy kay Eliseo. Pinananatili ng “sa kanya” ang maigsi at bahagyang eliptikal na larawan ng Hebreo; ipinapaliwanag sa talababa na katawan niya ang tinutukoy.
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Ipinahahayag nito ang agarang takdang panahon ng banta at ang diin ng panunumpa.
theological_decisions:
- issue: Tinutukoy at lakas ng pormula ng panunumpa
  choice: Isang sumpang panunumpa laban sa sarili na tumatawag sa Diyos bilang tagapagparusa kung hindi mapupugutan ng ulo si Eliseo sa araw na iyon.
  alternative: Isang matinding bulalas lamang na walang ganap na bisa ng panunumpa.
  rationale: Karaniwang pormula ito ng maharlikang panunumpa sa Hebreong Kasulatan. Kaya hindi ito pinalalambot bilang pagpapahayag lamang ng galit.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal at nakapanghihilakbot na himig ng sumpang panunumpa, pati ang bahagyang eliptikal na larawan ng ulo na nananatili “sa kanya,” sa halip na ganap na ipaliwanag ito sa mismong talata.
