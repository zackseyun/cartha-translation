base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: tl
  text: Sinabi ng tao ng Diyos, “Saan iyon nahulog?” Itinuro sa kanya ng lalaki ang lugar. Pagkatapos, pumutol ang tao ng Diyos ng isang piraso ng kahoy at inihagis iyon doon, at lumutang ang bakal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang bakal.” Sa konteksto, ito ang bakal na ulo ng palakol na binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Tuwirang pinananatili ang karaniwang Hebreong titulo para sa propeta nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: אָנָה נָפָל
  choice: Saan iyon nahulog?
  rationale: Likas na tanong sa makabagong Tagalog para sa lugar kung saan nahulog ang bagay; ang “iyon” ay ipinahiwatig ng konteksto.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: Itinuro sa kanya ng lalaki ang lugar
  rationale: Ang Hiphil ng ראה ay “ipakita.” Ginamit ang “itinuro” bilang natural na paraan ng pagpapakita ng tiyak na lugar, at nilinaw ng “lalaki” ang nagpakita upang maiwasan ang kalituhan sa mga panghalip.
- source_word: וַיִּקְצָב עֵץ
  choice: pumutol siya ng isang piraso ng kahoy
  rationale: Saklaw ng עֵץ ang puno o kahoy; ang “piraso ng kahoy” ay konkretong bagay na maaaring ihagis ngunit hindi nagpapalagay ng tiyak na hugis o laki.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: inihagis iyon doon
  rationale: Tuwirang inililipat ang kilos at ang pang-abay na tumutukoy sa lugar.
- source_word: וַיָּצֶף
  choice: lumutang
  rationale: Pinananatili ang payak at intransitibong paglalarawan ng Hebreo, nang hindi ipinapaliwanag o ginagawang natural ang himala.
- source_word: הַבַּרְזֶל
  choice: ang bakal
  rationale: Tuwirang salin ng Hebreo. Ang tinutukoy nitong ulo ng palakol ay ipinaliliwanag sa talababa sa halip na idagdag sa pangunahing teksto.
theological_decisions:
- issue: Ang mahimalang pangyayari sa salaysay
  choice: “lumutang ang bakal”
  alternative: “umahon sa ibabaw ang bakal” o isang paliwanag kung paano ito nakuha
  rationale: Inilalahad ng Hebreo ang pangyayari nang tuwiran bilang paglutang ng bakal. Hindi ito dapat gawing pangkaraniwan, ipaliwanag, o dagdagan ng mekanismo na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sunod-sunod na kilos ng salaysay, habang nilinaw lamang ang tagaganap kung kinakailangan upang maiwasan ang kalituhan sa mga panghalip.
