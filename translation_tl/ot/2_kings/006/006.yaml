  to: Sinabi ng tao ng Diyos, “Saan iyon nahulog?” Itinuro sa kanya ng lalaki ang lugar. Pagkatapos, pumutol ang tao ng Diyos ng isang piraso ng kahoy at inihagis iyon doon, at lumutang ang bakal.[a]
