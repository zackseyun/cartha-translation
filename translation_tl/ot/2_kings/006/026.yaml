  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: tl
  text: Habang naglalakad sa ibabaw ng pader ang hari ng Israel, isang babae ang sumigaw sa kanya, “Tulungan ninyo ako, panginoon kong hari!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Iligtas ninyo ako, panginoon kong hari!” Literal na “iligtas” ang pandiwang Hebreo, ngunit dito ay isang agarang pakiusap sa hari na tumulong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: Habang naglalakad
  rationale: Ang וַיְהִי na sinusundan ng participle ay naglalahad ng nagpapatuloy na pangyayari sa salaysay. Likas sa modernong Tagalog ang temporal na “Habang naglalakad.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang katumbas ng construct chain at malinaw sa konteksto ang tiyak na hari.
- source_word: עַל הַחֹמָה
  choice: sa ibabaw ng pader
  rationale: Pinananatili ang pangunahing kahulugan ng עַל na ang hari ay nasa ibabaw ng pader ng lungsod, nang hindi ipinapalagay ang tiyak na direksiyon ng kanyang paglakad.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: isang babae ang sumigaw sa kanya
  rationale: Ipinakikilala ang babae bilang di-tiyak na tauhan, at ipinahahayag ng “sumigaw” ang lakas at kagipitan ng צעק.
- source_word: הוֹשִׁיעָה
  choice: Tulungan po ninyo ako
  rationale: Bagaman literal na “iligtas,” gumaganap dito ang pautos bilang agarang pakiusap sa hari na mamagitan. Ang “tulungan” ay natural sa Tagalog; isinama ang “ako” na ipinahihiwatig ng pakiusap at ang “po” bilang paggalang.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mahal na hari
  rationale: Natural at marangal na pantawag sa hari sa modernong Tagalog. Inihahatid nito ang magalang na אֲדֹנִי at ang appositional na הַמֶּלֶךְ nang hindi gumagamit ng lipas o sobrang literal na pananalita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at magalang, ngunit nananatiling marangal ang tono ng salaysay at ang pakikipag-usap sa hari. Ginamit ang “po ninyo” upang katawanin ang paggalang na taglay ng אֲדֹנִי; ang maliit na titik sa “hari” ay karaniwang ortograpiyang Filipino para sa titulo.
