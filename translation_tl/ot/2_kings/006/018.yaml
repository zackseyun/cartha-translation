language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: tl
  text: Nang bumaba sila laban sa kanya, nanalangin si Eliseo kay Yahweh at sinabi, “Pakiusap, bulagin mo ang bayang ito.” Kaya binulag niya sila[a], ayon sa salita ni Eliseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa nakalilitong pagkabulag.” Ang salitang Hebreo ay maaaring tumukoy sa kapansanan sa paningin na dulot ng Diyos, kaya hindi nakakakita nang wasto ang mga tao; hindi ito kinakailangang mangahulugan ng ganap o permanenteng pagkabulag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Nang bumaba sila laban sa kanya
  rationale: Pinananatili ng “bumaba” ang kilos na ירד, samantalang ipinahihiwatig ng “laban sa kanya” ang mapanlabang paglapit ng hukbong Arameo sa konteksto.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: nanalangin si Eliseo kay Yahweh
  rationale: Ang התפלל ay karaniwang pandiwa para sa pananalangin, at tuwirang isinasalin ang pangalang יְהוָה bilang “Yahweh.”
- source_word: הַךְ נָא
  choice: Pakiusap, bulagin mo
  rationale: Ipinahahayag ng “Pakiusap” ang magalang na pakiusap ng נָא. Sa Filipino, ang “bulagin mo” ay natural na naghahatid ng idyomang “hampasin ng pagkabulag” nang hindi nagmumukhang pisikal na pananakit ang hiwalay na pandiwang נכה.
- source_word: הַגּוֹי הַזֶּה
  choice: ang bayang ito
  rationale: Ang גוי ay maaaring tumukoy sa isang bayan o bansa. Ang “bayan” ay angkop dito bilang kolektibong tawag sa pangkat ng mga Arameo, nang hindi ipinapalagay na buong populasyon ng estado ang naroon.
- source_word: בַּסַּנְוֵרִים
  choice: bulagin / binulag
  rationale: Ang סַנְוֵרִים ay isang pambihira at maramihang anyong tumutukoy sa pagkasira ng paningin na dulot ng Diyos. “Bulagin” ang malinaw at tradisyonal na katumbas, habang inilalahad sa talababa ang posibleng diwa ng nakalilitong pagkabulag.
- source_word: וַיַּכֵּם
  choice: Kaya binulag niya sila
  rationale: Ang paksa ng isahang pandiwa ay si Yahweh ayon sa konteksto. Ang “Kaya” ay natural na nagpapakita na tugon ito sa panalangin ni Eliseo.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: ayon sa salita ni Eliseo
  rationale: Pinananatili nito ang דבר bilang “salita” at ang ugnayan ng sinabi ni Eliseo sa isinagawang pagkilos ng Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Hayagang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Likas ng pagkabulag na ipinataw
  choice: Pagkabulag, na may talababa tungkol sa posibleng nakalilitong kapansanan sa paningin
  alternative: Ganap at permanenteng pagkawala ng paningin / nakalilitong pagkasilaw
  rationale: Hindi tiyak sa pambihirang salitang סַנְוֵרִים kung ganap o permanenteng pagkabulag ang ibig sabihin. Pinananatili sa pangunahing teksto ang malinaw na “pagkabulag” ngunit hindi ipinipinid ang mas malawak na kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Pakiusap” upang maging natural ang magalang na panalangin, at “bayan” bilang kolektibong tawag sa mga Arameo. Ang bahagyang pormal na pariralang “ayon sa salita ni Eliseo” ay sadyang pinanatili upang maipakita ang Hebreong idyoma at ang bisa ng pahayag ng propeta.
