  text: וַ/יְהִ֤י הָֽ/אֶחָד֙ מַפִּ֣יל הַ/קּוֹרָ֔ה וְ/אֶת הַ/בַּרְזֶ֖ל נָפַ֣ל אֶל הַ/מָּ֑יִם וַ/יִּצְעַ֥ק וַ/יֹּ֛אמֶר אֲהָ֥הּ אֲדֹנִ֖/י וְ/ה֥וּא שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: tl
  text: Ngunit habang pinuputol ng isa sa kanila ang isang troso, nahulog sa tubig ang bakal[a]. Sumigaw siya, “Naku, panginoon ko! Hiram lang iyon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang bakal,” na tumutukoy rito sa bakal na ulo ng palakol.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: pinuputol
  rationale: Ang Hiphil participle ng נפל ay literal na ‘nagpapabagsak,’ ngunit sa konteksto ng pagkuha ng kahoy ay tumutukoy sa pagputol upang maibagsak ang troso. Ang ‘pinuputol’ ay likas at malinaw sa modernong Tagalog.
- source_word: הַקּוֹרָה
  choice: isang troso
  rationale: Ang קוֹרָה ay maaaring tumukoy sa biga, troso, o kahoy na pambuo. Sa mismong gawain ng pagputol, mas natural ang ‘troso’ at hindi nito ipinapalagay na nahugis na itong biga.
- source_word: הַבַּרְזֶל
  choice: ang bakal[a]
  rationale: Pinananatili ang metonimikong pananalita ng Hebreo, ‘ang bakal,’ sa halip na tahimik na gawing ‘ulo ng palakol.’ Nililinaw ng talababa ang tinutukoy nito.
- source_word: וַיִּצְעַק
  choice: Sumigaw siya
  rationale: Ipinahahayag nito ang biglaan at matinding pagkabalisa nang mahulog ang hiniram na kagamitan.
- source_word: אֲהָהּ
  choice: Naku
  rationale: Karaniwan at angkop na bulalas ng pagkabigla o panghihinayang sa modernong Tagalog, nang hindi nagiging labis na kolokyal.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Pinananatili ang magalang na pagtawag sa isang nakatataas. Sa maliit na titik, hindi nito ipinahihiwatig na Diyos ang kausap.
- source_word: שָׁאוּל
  choice: Hiram lang iyon
  rationale: Ang anyo ay nagsasaad na ang bagay ay hiniram. Ang ‘Hiram lang iyon’ ay maikli, natural, at pinananatiling hindi tahasang binabanggit kung kanino ito hiniram.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Pinanatili sa pangunahing teksto ang literal na ‘bakal’ upang mapangalagaan ang metonimiya ng Hebreo, habang ipinaliwanag sa talababa ang kahulugan nito sa konteksto.
