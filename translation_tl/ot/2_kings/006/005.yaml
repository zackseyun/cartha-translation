  source_fidelity: 'Tapat ang salin sa Hebreo: ang pandiwang tumutukoy sa pagpapabagsak/pagpuputol ng kahoy ay natural na naipahayag bilang “pinuputol,” ang קוֹרָה ay angkop na “isang troso,” at ang metonimikong “ang bakal” ay pinanatili. Ang “Hiram lang iyon!” ay wastong naghahayag na ang nawawalang bagay ay hiniram.'
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “Naku, panginoon ko!” ay angkop na panaghoy at magalang na pagtawag sa nakatataas sa kontekstong ito. Maayos ring dumadaloy ang pangungusap nang hindi kailangang ulitin ang “at sinabi niya” bago ang tuwirang sipi.
