    issue: Maling pagkakabuo ng sugnay tungkol sa ipinadala ng hari
    rationale: Ang “isinugo ng anak na ito ng isang mamamatay-tao ang taong puputol sa aking ulo” ay ginagawang malinaw na object ng pagsugo ang “taong puputol,” ngunit ang Hebreo ay may implicit na ipinadalang sugo at infinitive na “upang alisin ang aking ulo.” Dapat ihayag na isinugo ang isang tao upang pugutan si Eliseo.
  - severity: medium
    issue: “Matatandang pinuno” ay dagdag na pagpapakahulugan
    rationale: Ang הַזְּקֵנִים ay tumutukoy sa “mga nakatatanda/elder.” Maaaring may tungkuling pampamayanan ang mga ito sa konteksto, ngunit hindi ito kailangang idagdag sa mismong salin.
  - severity: medium
    issue: Hindi sapat na tiyak ang “pigilan ninyo siya roon”
    rationale: Tinutukoy ng בַּדֶּלֶת ang pagpigil o pagdiin sa sugo sa may pintuan. Ang “pigilan ninyo siya sa may pintuan” ay mas tapat at natural.
