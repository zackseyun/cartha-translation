revisions:
- from: Nakaupo si Eliseo sa kanyang bahay, at nakaupong kasama niya ang matatandang pinuno. Nagpadala ang hari ng isang lalaki na mauuna sa kanya. Ngunit bago makarating kay Eliseo ang mensahero, sinabi niya sa matatandang pinuno, “Nakikita ba ninyo kung paanong isinugo ng anak na ito ng isang mamamatay-tao ang taong puputol sa aking ulo?[a] Tingnan ninyo, pagdating ng mensahero, isara ninyo ang pinto at pigilan ninyo siya roon.[b] Hindi ba’t kasunod niya ang yabag ng kanyang panginoon?”
  to: Nakaupo si Eliseo sa kanyang bahay, at nakaupo ring kasama niya ang mga nakatatanda. Nagpadala ang hari ng isang lalaki upang mauna sa kanya. Ngunit bago makarating ang mensahero kay Eliseo, sinabi ni Eliseo sa mga nakatatanda, “Nakikita ba ninyo kung paanong isinugo ng anak na ito ng mamamatay-tao ang isang tao upang pugutan ako?[a] Tingnan ninyo, pagdating ng mensahero, isara ninyo ang pinto at pigilan ninyo siya sa may pintuan.[b] Hindi ba’t kasunod niya ang yabag ng kanyang panginoon?”
  rationale: Itinama ang sintaks at referent ng utos ng hari, pinanatili ang mapanlait na “anak na ito ng mamamatay-tao,” at isinalin nang natural ang idyomang Hebreo bilang “pugutan ako,” na nililinaw sa talababa. Inalis ang dagdag na “pinuno” sa mga nakatatanda at ginawang tiyak ang pagpigil sa sugo sa may pintuan. Pinalitan din ang talababa b upang maipaliwanag ang posibleng kalabuan ng “mensahero,” alinsunod sa konteksto at audit trail.
