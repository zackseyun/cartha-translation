  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: tl
  text: Nakaupo si Eliseo sa kanyang bahay, at nakaupo ring kasama niya ang mga nakatatanda. Nagpadala ang hari ng isang lalaki upang mauna sa kanya. Ngunit bago makarating ang mensahero kay Eliseo, sinabi ni Eliseo sa mga nakatatanda, “Nakikita ba ninyo kung paanong isinugo ng anak na ito ng mamamatay-tao ang isang tao upang pugutan ako?[a] Tingnan ninyo, pagdating ng mensahero, isara ninyo ang pinto at pigilan ninyo siya sa may pintuan.[b] Hindi ba’t kasunod niya ang yabag ng kanyang panginoon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “upang alisin ang aking ulo,” isang idyomang tumutukoy sa pagpatay sa pamamagitan ng pagpugot ng ulo.
    reason: lexical_alternative
  - marker: b
    text: Ang “mensahero” rito ay isang taong sugo ng hari, hindi isang anghel.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: nakaupo / nakaupong kasama
  rationale: Ipinakikita ng mga participle ang nagpapatuloy na tagpo; natural itong naihahayag sa modernong Tagalog sa “nakaupo.”
- source_word: הַזְּקֵנִים
  choice: matatandang pinuno
  rationale: Hindi lamang edad ang tinutukoy kundi mga nakatatandang may tungkuling mamuno sa pamayanan; nililinaw ito nang hindi gumagamit ng teknikal na katawagan.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Nagpadala ang hari ng isang lalaki na mauuna sa kanya
  rationale: Ang hari ang paksa ayon sa naunang konteksto, at ang מִלְּפָנָיו ay natural na tumutukoy sa pagpapauuna sa ipinadalang lalaki.
- source_word: הַמַּלְאָךְ
  choice: mensahero
  rationale: Sa kontekstong ito, isang taong isinugo ng hari ang tinutukoy, hindi isang anghel.
- source_word: הֲרְאִיתֶם
  choice: Nakikita ba ninyo
  rationale: Pinananatili ang retorikal na panawagan ni Eliseo na kilalanin ng mga pinuno ang kasalukuyang ginagawa ng hari.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: anak na ito ng isang mamamatay-tao
  rationale: Pinananatili ang mapanlait at matinding paratang ng parirala nang hindi tinutukoy sa salin kung sinong mamamatay-tao ang nasa isip.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: puputol sa aking ulo
  rationale: Ang literal na “aalis ng aking ulo” ay idyoma para sa pagpugot; ang “puputol sa aking ulo” ay malinaw at likas sa Tagalog habang pinananatili ang larawan ng Hebreo.
- source_word: סִגְרוּ הַדֶּלֶת וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: isara ninyo ang pinto at pigilan ninyo siya roon
  rationale: Ipinahahayag ang agarang layunin ng pagkandado o pagdiin sa mensahero sa may pintuan upang hindi siya makapasok; inilalagay sa talababa ang mas literal na larawan.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Hindi ba’t kasunod niya ang yabag ng kanyang panginoon?
  rationale: Pinananatili ang retorikal na tanong, ang tunog ng mga paa bilang “yabag,” at ang pahiwatig na malapit nang sumunod ang hari.
theological_decisions:
- issue: Di-tahasang paksa ng וַיִּשְׁלַח
  choice: ang hari
  alternative: siya
  rationale: Malinaw sa agarang konteksto na ang hari ng Israel ang nagpadala; ang tahasang pagbanggit sa kanya ay umiiwas sa nakalilitong panghalip.
- issue: Pagkakakilanlan ng הַמַּלְאָךְ
  choice: taong mensahero ng hari
  alternative: anghel
  rationale: Ang pagpapadala ng hari, ang utos na pigilan siya sa pintuan, at ang pagtukoy sa kanyang panginoon ay nagpapakitang isang taong mensahero ang tinutukoy.
- issue: Tinutukoy ng “kanyang panginoon”
  choice: ang hari na sumusunod sa mensahero
  alternative: hindi tinukoy na nakatataas
  rationale: Ang hari ang nagpadala sa lalaki at siya ang likas na panginoon ng mensahero sa salaysay; hindi na idinagdag ang “hari” sa mismong tanong upang mapanatili ang anyo ng Hebreo.
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Tagalog. Pinili ang “matatandang pinuno” upang maging malinaw ang pampamayanang tungkulin ng mga elder, at “mensahero” upang hindi mapagkamalang anghel ang isinugo. Pinanatili ang tindi ng pananalita ni Eliseo at ang retorikal na tanong sa hulihan.
