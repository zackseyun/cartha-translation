  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: tl
  text: Sinabi ng hari sa kanya, “Ano ang problema mo?” Sumagot ang babae, “Sinabi sa akin ng babaeng ito, ‘Ibigay mo ang iyong anak upang kainin natin siya ngayon, at bukas naman ay kakainin natin ang aking anak.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: Ano ang problema mo?
  rationale: Likas na modernong Tagalog para sa idyomang nagtatanong kung ano ang suliranin o hinaing ng babae.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Ibigay mo ang iyong anak
  rationale: Tuwirang pinananatili ang pautos na anyo at ang panghalip na tumutukoy sa anak ng kausap.
- source_word: וְנֹאכְלֶנּוּ
  choice: para makain natin siya
  rationale: Ipinahahayag ang layunin ng Hebreong waw at pinananatiling tao ang tinutukoy sa pamamagitan ng “siya.”
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: at bukas naman ay kakainin natin ang aking anak
  rationale: Pinananatili ang pagkakasalungat ng ‘iyong anak’ ngayon at ‘aking anak’ bukas; ang “naman” ay natural na naghahayag ng pagtutumbas.
