    issue: Hindi malinaw ang tagatugon sa ‘Sumagot siya.’
    rationale: Bagaman ang Hebreo ay may pambabaeng pandiwa at malinaw ang tinutukoy sa pinagmulan, ang Tagalog na ‘siya’ ay walang kasarian at ang pinakamalapit na naunang paksa ay ‘hari.’ Dapat banggitin ang ‘babae’ upang mapanatili ang malinaw na daloy.
