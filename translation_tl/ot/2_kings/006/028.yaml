revisions:
- from: Sinabi ng hari sa kanya, “Ano ang problema mo?” Sumagot siya, “Sinabi sa akin ng babaeng ito, ‘Ibigay mo ang iyong anak para makain natin siya ngayon, at bukas naman ay kakainin natin ang aking anak.’”
  to: Sinabi ng hari sa kanya, “Ano ang problema mo?” Sumagot ang babae, “Sinabi sa akin ng babaeng ito, ‘Ibigay mo ang iyong anak upang kainin natin siya ngayon, at bukas naman ay kakainin natin ang aking anak.’”
  rationale: Pinalitan ang di-tiyak na panghalip na ‘siya’ ng ‘ang babae’ upang malinaw na ang babae, hindi ang hari, ang sumagot. Ginawang ‘upang kainin’ ang ‘para makain’ para sa mas tuwiran at pormal-na-singaw na pag-uugnay ng layunin, nang hindi binabago ang marahas ngunit tahasang diwa ng pinagmulan.
