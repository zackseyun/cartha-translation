  source_fidelity: 'Tumpak ang pangunahing nilalaman: tinanong ng hari ang babae, at isinalaysay niya ang kasunduan na kainin muna ang anak ng kausap at kinabukasan ang sarili niyang anak. Ang ‘para makain natin siya’ ay wastong naghahatid ng layuning nasa pananalita, bagaman mas tuwiran at mas natural ang ‘upang kainin natin siya.’'
  naturalness: 'Malinaw at modernong Tagalog ang draft, ngunit ang ‘Sumagot siya’ ay may pansamantalang kalabuan: ang naunang paksa ay ang hari, kaya maaaring unang mabasa na ang hari ang sumagot. Ang tahasang ‘Sumagot ang babae’ ay mas natural at hindi nagdaragdag ng kahulugan.'
  terminology: Wasto ang ‘problema’ para sa idyomang מַה־לָּךְ sa kontekstong ito. Ang ‘anak’ ay angkop para sa בֵּן; hindi kailangang ipilit ang ‘lalaking anak’ dahil malinaw ang sanggunian at natural ang kasalukuyang gamit.
  issues:
