  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: tl
  text: Nanalangin si Eliseo at sinabi niya, “Yahweh[a], buksan mo sana ang kanyang mga mata upang makakita siya.” Kaya binuksan ni Yahweh ang mga mata ng binata[b], at nakakita siya. At narito, ang bundok ay punô ng mga kabayo at mga karwahe ng apoy sa buong palibot ni Eliseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay ang personal na pangalan ng Diyos na kinakatawan ng Hebreong YHWH; madalas itong isinasaling “PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “lingkod.” Ang Hebreong naʿar ay maaaring tumukoy sa isang kabataan o sa isang utusan o tagapaglingkod, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: nanalangin
  rationale: Ang hitpael ng פלל ay tumutukoy rito sa panalanging inihaharap sa Diyos; natural at tiyak sa salaysay ang “nanalangin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa baybay na “Yahweh” ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: פְּקַח נָא
  choice: buksan mo sana
  rationale: Ang פקח ay “buksan,” lalo na ang mga mata, at ang נָא ay nagpapahayag ng magalang at taimtim na pakiusap, hindi kinakailangang temporal na “ngayon.”
- source_word: וְיִרְאֶה
  choice: upang makakita siya
  rationale: 'Ipinahihiwatig ng anyong pandiwa pagkatapos ng pakiusap ang layunin o bunga: mabuksan ang kanyang mga mata upang makakita siya.'
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring mangahulugan ang נַעַר ng kabataan, binata, o utusan. Pinananatili ng “binata” ang pangunahing leksikal na diwa, habang inilalagay sa talababa ang posibleng papel niyang lingkod.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili nito ang pantawag-pansing marker na nagpapatingkad sa bigla at kamangha-manghang nakita, nang hindi ipinapaliwanag ang uri ng pangitain.
- source_word: הָהָר
  choice: ang bundok
  rationale: Karaniwang katumbas ng הַר ang “bundok”; tinutukoy ng tiyak na anyo ang mataas na lupa sa tagpo.
- source_word: מָלֵא
  choice: punô ng
  rationale: Tuwirang ipinapahayag ng pang-uring panaguri ang kalagayang punô ang bundok.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: mga kabayo at mga karwahe ng apoy
  rationale: Pinananatili ang dalawang magkaugnay na larawan at ang construct na “ng apoy” nang hindi dinaragdagan kung literal, makalangit, o simboliko ang anyo ng mga ito.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: sa buong palibot ni Eliseo
  rationale: Ipinahahayag ng סְבִיבֹת ang pagkapalibot; malinaw sa “buong palibot” ang ganap na pag-encircle kay Eliseo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalang YHWH ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kalikasan ng nakita ng binata
  choice: Ihayag lamang na binuksan ng Diyos ang kanyang mga mata at nakita niya ang mga kabayo at mga karwahe ng apoy
  alternative: Tukuyin itong literal na hukbong anghel o purong simbolikong pangitain
  rationale: Hindi nililinaw ng Hebreo ang ontolohikal na kalikasan ng tanawin. Pinananatili ng salin ang pahayag at tensiyon ng teksto nang walang dagdag na interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “buksan mo sana” ay taimtim at natural na pakiusap; ang “At narito” ay sadyang nagpapanatili sa dramatikong pantawag-pansin ng Hebreo. Iniwasan ang pagpapaliwanag kung literal, pangitain, o angelikong hukbo ang nakita.
