  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: tl
  text: Kaya nagpadala siya roon ng mga kabayo, mga karwahe, at isang malaking hukbo.[a] Dumating sila nang gabi at pinalibutan ang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaking puwersa.” Literal na “isang mabigat na puwersa” ang Hebreong pananalita, isang idyoma para sa malaking pangkat ng mga kawal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala siya
  rationale: Karaniwang salaysay na anyo ng שׁלח; malinaw at natural sa modernong Filipino.
- source_word: שָׁמָּה
  choice: roon
  rationale: Pang-abay na tumutukoy sa patutunguhang binanggit sa naunang konteksto.
- source_word: סוּסִים
  choice: mga kabayo
  rationale: Tuwirang kahulugan ng pangngalan; hindi ito pinalawak tungo sa 'mga mangangabayo.'
- source_word: וְרֶכֶב
  choice: mga karwahe
  rationale: Pinananatili ang kongkretong larawang militar ng mga karwaheng pandigma sa halip na teknikal na 'hukbong-karwahe.'
- source_word: וְחַיִל כָּבֵד
  choice: at isang malaking hukbo
  rationale: Sa kontekstong militar, ang חַיִל ay hukbo o puwersa, at ang כָּבֵד na literal na 'mabigat' ay idyomatikong tumutukoy sa malaki o makapangyarihang pangkat.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Dumating sila nang gabi
  rationale: Likas na Filipino para sa pagdating sa gabi at tapat sa pagkakasunod ng salaysay.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: at pinalibutan ang lungsod
  rationale: Malinaw na katumbas ng kilos na pagkubkob o pagpaligid sa lungsod nang hindi nagdaragdag ng detalyeng wala sa teksto.
