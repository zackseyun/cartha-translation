base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: tl
  text: At sinabi niya[a], “Pumunta kayo at tingnan kung nasaan siya, upang magsugo ako at dakpin siya.” At iniulat sa kanya, “Naroon[b] siya sa Dotan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at magsusugo ako at kukunin ko siya.” Maaaring isalin nang mas pormal ang pagkakasunod ng mga pandiwa sa Hebreo, ngunit malamang na layunin ang ipinahahayag dito: “upang magsugo ako at dakpin siya.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Dotan ay isang bayan sa hilaga ng Samaria. Kaugnay rin ito ng salaysay tungkol kay Jose (Gen. 37:17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang pasulong na anyo ng salaysay na nagpapakilala ng tuwirang pananalita; pinananatili ng “At sinabi niya” ang daloy nang hindi dinaragdagan ang temporal na diwa.
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Maramihang pautos ng הלך. Ang “Humayo kayo” ay malinaw, marangal, at nagpapakita na higit sa isa ang inuutusan.
- source_word: וּרְאוּ
  choice: at tingnan
  rationale: Maramihang pautos ng ראה. Pinananatili ng “tingnan” ang tuwirang diwa habang likas ding nagpapahiwatig ng pagsisiyasat sa konteksto.
- source_word: אֵיכֹה הוּא
  choice: kung nasaan siya
  rationale: Likas na Tagalog para sa tanong tungkol sa kinaroroonan at tapat sa locative na diwa ng Hebreo.
- source_word: וְאֶשְׁלַח
  choice: upang makapagsugo ako
  rationale: Bagaman maaaring pormal na isaling “at magsusugo ako,” ang pagkakasunod pagkatapos ng mga pautos ay malamang na nagpapahayag ng layunin.
- source_word: וְאֶקָּחֵהוּ
  choice: at madakip siya
  rationale: Ang לקח ay literal na “kunin,” ngunit sa mapanupil na konteksto ng hari ay tumutukoy sa pagdakip. Ang “madakip” ay natural at hindi labis na nagpapaliwanag.
- source_word: וַיֻּגַּד לוֹ
  choice: At iniulat sa kanya
  rationale: Sinasalamin nito ang pasibong diwa ng Hophal ng נגד at ang pormal na himig ng isang ulat sa hari.
- source_word: לֵאמֹר
  choice: '[hindi hiwalay na isinalin]'
  rationale: Ang quotative infinitive ay likas na naipahahayag sa Tagalog sa pamamagitan ng tuwirang sipi; ang pagdaragdag ng “na sinasabi” ay magiging mabigat at di-likas.
- source_word: הִנֵּה
  choice: Naroon
  rationale: Sa ulat tungkol sa lokasyon, likas na pinagsasama ng “Naroon siya” ang pantawag-pansing tungkulin ng הִנֵּה at ang pahayag ng kinaroroonan, nang hindi gumagamit ng arkaikong pananalita.
- source_word: בְדֹתָן
  choice: sa Dotan
  rationale: Locative ang ב; ang “sa” ang likas na panandang Tagalog. Isinalin ang pangalang pantangi bilang “Dotan.”
