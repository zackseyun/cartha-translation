  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag ang maramihang utos na alamin ang kinaroroonan niya, ang layuning magsugo upang siya ay madakip, at ang pasibong ulat na siya ay nasa Dotan. Gayunman, ang “makapagsugo ako at madakip siya” ay bahagyang lumilihis sa magkatuwang na unang-panauhang kilos na nasa Hebreo (“ako ay magsusugo at kukunin/dadakpin ko siya”).'
  naturalness: Likas ang karamihan ng pangungusap, lalo na ang “Naroon siya sa Dotan.” Ngunit mas makabago at karaniwan ang “Pumunta kayo” kaysa “Humayo kayo,” at mas tuwiran ang “magsugo ako at dakpin siya” para sa layuning ipinahahayag ng hari.
  terminology: Ang “dakpin” ay angkop sa mapanganib na konteksto ng pagkuha sa propeta, bagaman literal na “kunin” ang לקח. Ang “Dotan” at “Samaria” ay wasto at pare-pareho ang anyo. Napananatili ng “Naroon” ang pantawag-pansing tungkulin ng הִנֵּה nang hindi nagiging lipas ang rehistro.
