revisions:
- from: At sinabi niya[a], “Humayo kayo at tingnan kung nasaan siya, upang makapagsugo ako at madakip siya.” At iniulat sa kanya, “Naroon[b] siya sa Dotan.”
  to: At sinabi niya[a], “Pumunta kayo at tingnan kung nasaan siya, upang magsugo ako at dakpin siya.” At iniulat sa kanya, “Naroon[b] siya sa Dotan.”
  rationale: Pinalitan ang “Humayo kayo” ng mas modernong “Pumunta kayo.” Inayos ang sugnay ng layunin upang mas malinaw na mapanatili ang magkatuwang na unang-panauhang kilos ng hari sa Hebreo, nang hindi dinaragdagan ang hindi tahasang layon ng “magsugo.” Hindi binago ang likas na “Naroon siya sa Dotan” o ang mga salin-tala.
