translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maramihang “kayo” sa mga pautos, pinanatili ang pormal na himig ng ulat, at iniwasan ang salitang arkaiko kung may mas likas na katumbas sa kasalukuyang Tagalog.
