  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: tl
  text: Sinabi niya, “Huwag kang matakot, sapagkat mas marami ang mga kasama natin kaysa sa mga kasama nila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; likas sa modernong Tagalog ang “Sinabi niya” kahit hindi isalin nang hiwalay ang pang-ugnay.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Ang אַל na sinusundan ng anyong pandiwa rito ay nagpapahayag ng pagbabawal; ang ikalawang panauhang panlalaki na isahan ay natural na ipinahahayag ng “kang.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi dapat matakot ang kausap.
- source_word: רַבִּים אֲשֶׁר אִתָּנוּ
  choice: mas marami ang mga kasama natin
  rationale: Ang רַבִּים ay may paghahambing dahil sa kasunod na מִן; malinaw at natural sa Tagalog ang “mas marami,” habang ang אֲשֶׁר אִתָּנוּ ay substantibong tumutukoy sa mga kasama natin.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: kaysa sa mga kasama nila
  rationale: Ipinakikilala ng מִן ang pamantayan ng paghahambing. Bagaman eliptiko ang Hebreo, ipinahihiwatig ng magkatulad na kayarian ang “mga kasama nila,” kaya ito ang natural na katumbas sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng mas maraming “kasama natin”
  choice: Hindi tinukoy sa talata kung sino sila.
  alternative: Tukuyin sila bilang hukbo ng langit o mga anghel batay sa kasunod na talata.
  rationale: Hindi sila pinangalanan sa Hebreo ng talatang ito. Pinananatili ng salin ang pagpipigil at pahiwatig ng orihinal, kahit nililinaw ng konteksto ang kanilang pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa tuwirang pananalita. Ginamit ang “sapagkat” para sa dignidad nang hindi nagiging lipas, at ang magkatimbang na “mga kasama natin / mga kasama nila” upang mapanatili ang paghahambing.
