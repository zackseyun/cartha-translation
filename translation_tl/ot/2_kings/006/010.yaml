base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: tl
  text: Kaya nagpadala[a] ang hari ng Israel sa lugar na binanggit sa kanya ng tao ng Diyos, at binalaan siya tungkol dito. Nag-ingat siya roon[b]—hindi lamang minsan o makalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Hebreo kung ano o sino ang ipinadala; maaari itong tumukoy sa pagpapadala ng mga tao o ng isang mensahe.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagbantay siya roon” o “gumawa siya ng pag-iingat tungkol sa lugar na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala
  rationale: Ang pandiwa ay literal na “nagpadala,” ngunit hindi tahasang binabanggit sa Hebreo kung ano o sino ang ipinadala. Pinananatili ng salin ang implicit na layon sa halip na idagdag sa pangunahing teksto ang “mga tao” o “mensahe.”
- source_word: הַמָּקוֹם
  choice: ang lugar
  rationale: Tuwirang katumbas ito ng tiyak na pangngalang Hebreo at malinaw na tumutukoy sa lugar na binanggit sa naunang babala.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang karaniwang titulong Hebreo nang hindi ito pinapakahulugan nang mas makitid bilang “propeta.”
- source_word: וְהִזְהִירֹה
  choice: at ipinagbigay-babala sa kanya
  rationale: Ipinahahayag nito ang causative na diwa ng pandiwa at ang babalang ibinigay sa hari. Ang pag-uulit ng “sa kanya” ay nililinaw ang ugnayan ng mga sugnay sa natural na Filipino.
- source_word: וְנִשְׁמַר
  choice: Nag-ingat siya
  rationale: 'Sinasalamin nito ang reflexive na diwa ng Niphal: naging maingat ang hari o gumawa siya ng pag-iingat, nang hindi ipinapalagay ang tiyak na paraang ginamit niya.'
- source_word: שָׁם
  choice: roon
  rationale: Natural na pang-abay na tumutukoy pabalik sa nabanggit na lugar.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: hindi lamang minsan o makalawa
  rationale: Pinananatili ang anyo at idiomatikong diwa ng Hebreo na nangyari ito nang paulit-ulit, higit sa isa o dalawang pagkakataon.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino, na may payak na estruktura at karaniwang bokabularyo. Ginamit ang “tao ng Diyos” bilang literal ngunit likas na pamagat. Ang dash ay nagbibigay-diin sa Hebreong idiom sa hulihan nang hindi ginagawang labis na kolokyal.
