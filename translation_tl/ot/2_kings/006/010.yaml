revisions:
- from: Kaya nagpadala[a] ang hari ng Israel sa lugar na sinabi sa kanya ng tao ng Diyos at ipinagbigay-babala sa kanya. Nag-ingat siya roon[b]—hindi lamang minsan o makalawa.
  to: Kaya nagpadala[a] ang hari ng Israel sa lugar na binanggit sa kanya ng tao ng Diyos, at binalaan siya tungkol dito. Nag-ingat siya roon[b]—hindi lamang minsan o makalawa.
  rationale: Pinalitan ang “sinabi” ng “binanggit” upang maging likas ang kaugnayan nito sa “lugar,” at inayos ang ikalawang sugnay bilang “binalaan siya tungkol dito” upang malinaw na ang tao ng Diyos ang nagbigay ng babala sa hari tungkol sa nasabing lugar. Hindi binago ang sinasadyang pagiging di-tiyak ng layon ng “nagpadala,” ni ang paulit-ulit na diwa ng pangwakas na idyoma.
