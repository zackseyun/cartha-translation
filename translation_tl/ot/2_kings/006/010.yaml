  source_fidelity: Tumpak ang pangunahing pag-unawa sa וַיִּשְׁלַח bilang “nagpadala,” habang hindi idinaragdag sa teksto ang di-tahasang layon. Naipapahayag din ng “nag-ingat siya roon” ang reflexive na diwa ng וְנִשְׁמַר, at ang “hindi lamang minsan o makalawa” ang paulit-ulit na diwa ng pangwakas na idyoma.
  naturalness: 'Kailangan ang maliit ngunit mahalagang pagsasaayos. Sa draft, ang “lugar na sinabi sa kanya ng tao ng Diyos at ipinagbigay-babala sa kanya” ay hindi malinaw ang pagkakaugnay: maaaring magmukhang ang “lugar” ang ipinagbigay-babala. Ang paghihiwalay at malinaw na pagtukoy na ang babala ay tungkol sa lugar ay mas natural at mas madaling sundan sa modernong Filipino.'
  terminology: Ang “tao ng Diyos” ay angkop na malapit na salin ng אִישׁ הָאֱלֹהִים at pinananatili ang titulong Hebreo nang hindi ito binibigyang-kahulugang “propeta.” Ang “binalaan” ay likas at tumpak para sa Hiphil ng זהר sa kontekstong ito.
