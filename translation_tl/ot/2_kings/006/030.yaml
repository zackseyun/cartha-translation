revisions:
- from: Nang marinig ng hari ang sinabi ng babae, pinunit niya ang kanyang mga damit habang naglalakad siya sa ibabaw ng pader. Nakita ng mga tao na nakasuot pala siya ng damit-panluksa sa ilalim ng kanyang mga damit.[a]
  to: Nang marinig ng hari ang sinabi ng babae, pinunit niya ang kanyang mga damit habang dumaraan siya sa ibabaw ng pader. Nakita ng mga tao, at narito, may suot siyang magaspang na telang panluksa sa kanyang katawan, sa ilalim ng kanyang panlabas na damit.[a]
  rationale: Inayos ang estruktura upang maipakita ang magkahiwalay na “nakita” at “narito” sa Hebreo. Pinalitan ang mas interpretatibong “damit-panluksa” ng “magaspang na telang panluksa,” at itinama ang talababa upang buong maipakita ang literal at kontekstuwal na saklaw ng parirala.
