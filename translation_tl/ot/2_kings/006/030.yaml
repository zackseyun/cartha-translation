base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: tl
  text: Nang marinig ng hari ang sinabi ng babae, pinunit niya ang kanyang mga damit habang dumaraan siya sa ibabaw ng pader. Nakita ng mga tao, at narito, may suot siyang magaspang na telang panluksa sa kanyang katawan, sa ilalim ng kanyang panlabas na damit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kanyang katawan/laman, mula sa loob.” Ipinahihiwatig ng parirala na ang magaspang na telang panluksa ay suot sa ilalim ng kanyang panlabas na damit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang כ na sinusundan ng infinitive construct ay nagpapakilala ng sugnay na temporal; natural at tumpak sa Tagalog ang “Nang marinig.”
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: ang sinabi ng babae
  rationale: Tumutukoy ang דִּבְרֵי sa mga salitang sinabi ng babae; mas natural sa kasalukuyang Tagalog ang “ang sinabi” kaysa “ang mga salita” sa kontekstong ito.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Tuwirang pinananatili ang kilos na tanda ng matinding dalamhati o pagkagimbal nang hindi ipinapaliwanag iyon sa mismong teksto.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: habang naglalakad siya sa ibabaw ng pader
  rationale: Circumstantial ang sugnay at inilalarawan ang pagkilos ng hari sa kahabaan o ibabaw ng pader ng lungsod. Ang “naglalakad” ay likas sa Tagalog sa tagpong ito.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: Nakita ng mga tao na ... pala
  rationale: Ang “pala” ay natural na naghahatid sa Tagalog ng biglaang pagkatuklas o kapansin-pansing detalye na ipinahihiwatig ng וְהִנֵּה.
- source_word: הַשַּׂק
  choice: damit-panluksa
  rationale: Ang שַׂק ay magaspang na telang isinusuot sa pagluluksa. Mas malinaw sa karaniwang mambabasa ang “damit-panluksa” kaysa hiram o teknikal na katawagan.
- source_word: עַל־בְּשָׂרוֹ מִבָּיִת
  choice: nakasuot ... sa ilalim ng kanyang mga damit
  rationale: Ipinahihiwatig ng parirala na ang telang panluksa ay nasa katawan at nakatago sa ilalim ng panlabas na kasuotan. Ginawang malinaw sa teksto ang kontekstuwal na kahulugan, habang inilalagay sa talababa ang literal na anyo ng מִבָּיִת.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “damit-panluksa” upang maging malinaw ang gamit ng sackcloth, at ang “pala” upang maipahayag nang likas ang puwersa ng Hebreong וְהִנֵּה.
