translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal at tekstuwal na titulong “tao ng Diyos,” habang ginamit ang likas na “nagpasabi” para sa ipinahihiwatig na pagpapadala ng mensahe.
