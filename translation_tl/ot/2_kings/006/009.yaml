  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: tl
  text: Kaya nagpasabi ang tao ng Diyos sa hari ng Israel, “Mag-ingat kang huwag dumaan sa lugar na ito, sapagkat bumababa roon ang mga Arameo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bababa roon ang mga Arameo.”
    reason: Maaaring ilarawan ng participle ang kasalukuyang pagbaba o ang napipintong pagkilos ng hukbo.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpasabi
  rationale: Bagaman literal na “nagpadala,” walang tahasang layon ang pandiwa; ipinahihiwatig ng konteksto na mensahe ang ipinadala. Likas sa modernong Tagalog ang “nagpasabi.”
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Pinananatili ang karaniwang titulong Hebreo sa halip na ipakahulugang “propeta”; si Eliseo ang tinutukoy sa konteksto.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng titulo at pangalan ng bayan.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: Mag-ingat kang huwag dumaan
  rationale: Ipinahahayag ng Niphal imperative kasama ng מִן ang babalang umiwas sa pagdaan sa nasabing lugar; malinaw at likas ito sa modernong Tagalog.
- source_word: הַמָּקוֹם הַזֶּה
  choice: lugar na iyon
  rationale: Sa iniulat na mensahe sa hari, natural sa Tagalog ang distal na “iyon” para sa lugar na itinuturo o tinutukoy, bagaman literal na demonstrative ang “ito.”
- source_word: אֲרָם
  choice: ang mga Arameo
  rationale: Sa kontekstong militar, tumutukoy ang pangalang Aram sa mga tao o hukbo nito. Mas tumpak sa kasaysayan ang “mga Arameo” kaysa “mga Siriano.”
- source_word: נְחִתִּים
  choice: bumababa
  rationale: Ang participle mula sa נחת ay naglalarawan ng pagbaba o paglusong; pinananatili ng salin ang kilos at hindi ito ginagawang mas tiyak na pagkakampo o pagpoposisyon.
