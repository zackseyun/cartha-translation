base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: tl
  text: Ngunit sinabi ng isa sa kanyang mga lingkod, “Hindi po, aking panginoong hari. Ang propetang si Eliseo, na nasa Israel, ang nagsasabi sa hari ng Israel ng mga salitang sinasabi ninyo sa inyong silid-tulugan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא אֲדֹנִי הַמֶּלֶךְ
  choice: Hindi po, mahal na hari
  rationale: Pinananatili ang pagtanggi at magalang na tuwirang pakikipag-usap sa hari sa natural na makabagong Tagalog.
- source_word: כִּי
  choice: Si Eliseo ... ang
  rationale: 'Ginawang emphatic ang kasunod na sugnay upang maipakita ang kaibahan: hindi isang taksil na lingkod, kundi si Eliseo ang pinagmumulan ng impormasyon.'
- source_word: יַגִּיד
  choice: nagsasabi
  rationale: Ipinahahayag ang paulit-ulit o nakagawiang pagbubunyag sa konteksto.
- source_word: אֶת הַדְּבָרִים
  choice: mismong mga salitang
  rationale: Ang דְּבָרִים ay maaaring ‘mga salita’ o ‘mga bagay’; dito, dahil sa kasunod na ‘sinasabi,’ ang ‘mga salitang’ ang pinakamalinaw, at idinagdag ang ‘mismong’ upang maipakita ang diin ng lihim na usapan.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: sa inyong silid-tulugan
  rationale: Tuwirang katumbas ng pribadong silid na tinutulugan; ang ‘inyong’ ay angkop na magalang na pagtukoy sa hari.
theological_decisions:
- issue: Kung paano nalalaman ni Eliseo ang lihim na pananalita ng hari
  choice: Hindi tinukoy ang paraan; sinabing si Eliseo ang nagsasabi nito sa hari ng Israel.
  alternative: Tahasan itong tawaging kapahayagan ng Diyos o mahimalang kaalaman.
  rationale: Hindi tahasang binabanggit ng talata ang mekanismo, kaya hindi ito nilinaw nang lampas sa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” at maramihang panggalang na “ninyo/inyong” sa pakikipag-usap sa hari, habang pinananatiling malinaw at madaling maunawaan ang pangungusap.
