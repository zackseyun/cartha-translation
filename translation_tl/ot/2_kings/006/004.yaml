base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/004.yaml
  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: tl
  text: Kaya sumama siya sa kanila. Dumating sila sa Jordan at pumutol ng mga puno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahoy.” Maaaring tumukoy ang salitang Hebreo sa mga puno o sa kahoy; sa kontekstong ito ng pagputol ng troso, mas tiyak ang “mga puno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  choice: Kaya sumama siya sa kanila
  rationale: Ang pandiwang הלך kasama ng אִתָּם ay literal na ‘pumunta siya kasama nila.’ Natural na ipinahahayag sa modernong Tagalog ng ‘sumama siya sa kanila,’ habang ang ‘Kaya’ ay nag-uugnay sa tugon niya sa naunang pakiusap at nagpapatuloy sa salaysay.
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Ang בוא ay maaaring mangahulugang ‘dumating’ o ‘pumunta.’ Dito, ang ‘dumating’ ay malinaw at natural dahil sinusundan ito ng pinuntahang lugar.
- source_word: הַיַּרְדֵּנָה
  choice: sa Jordan
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa Jordan. Sapat at natural ang ‘sa Jordan’; hindi kailangang idagdag ang ‘Ilog’ na wala mismo sa Hebreo.
- source_word: וַיִּגְזְרוּ
  choice: pumutol
  rationale: Sa konteksto ng pagkuha ng troso, tumutukoy ang גזר sa pagputol o pagpabagsak ng mga puno. Ang karaniwang pandiwang ‘pumutol’ ay malinaw sa kasunod na layon.
- source_word: הָעֵצִים
  choice: ng mga puno
  rationale: Maaaring tumukoy ang עֵץ sa puno o kahoy. Sa kontekstong ito ng pagputol sa pinanggagalingan ng troso, mas tiyak ang ‘mga puno,’ bagaman pinananatili sa talababa ang leksikal na alternatibong ‘kahoy.’
