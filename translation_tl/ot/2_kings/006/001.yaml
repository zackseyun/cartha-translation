reference: 2 Kings 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: tl
  text: Sinabi ng mga anak ng mga propeta[a] kay Eliseo, “Pakitingnan mo, masyadong masikip para sa amin ang lugar na tinitirhan namin sa harap mo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alagad ng mga propeta” o “pangkat ng mga propeta.” Malamang na tumutukoy ang Hebreong idyomang “mga anak ng mga propeta” sa isang pamayanan ng mga propetang tinuturuan o pinangangasiwaan.
    reason: lexical_alternative
  - marker: b
    text: O “sa iyong presensya” o “sa ilalim ng iyong pangangasiwa.” Maaaring mangahulugan ang “sa harap mo” na namumuhay sila sa ilalim ng pangangasiwa ni Eliseo, hindi lamang na nasa pisikal silang harapan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  rationale: Pinananatili ang Hebreong idyoma upang hindi tiyaking mga alagad lamang sila o isang pormal na samahan; nililinaw sa talababa ang malamang na kahulugan nito bilang pangkat ng mga propeta.
- source_word: הִנֵּה נָא
  choice: Pakitingnan mo
  rationale: Likas na ipinahahayag sa modernong Tagalog ang pagtawag ng pansin ng הִנֵּה at ang magalang na pakiusap na ipinahihiwatig ng נָא.
- source_word: הַמָּקוֹם
  choice: ang lugar
  rationale: Pinananatili ang malawak na kahulugan ng pangngalan at hindi ipinapalagay kung bahay, tirahan, o pook-tipunan ang tinutukoy.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: ang lugar na tinitirhan namin sa harap mo
  rationale: Ang יָשַׁב ay may diwang manirahan sa kontekstong ito. Ang שָׁם ay likas nang nakapaloob sa sugnay na tumutukoy sa lugar, kaya hindi na inuulit bilang “doon.” Pinananatili ng “sa harap mo” ang posibleng literal o pangasiwaang diwa ng לְפָנֶיךָ.
- source_word: צַר מִמֶּנּוּ
  choice: masyadong masikip para sa amin
  rationale: Tumpak at natural na inilalarawan ang lugar na kulang sa luwang para sa pangkat.
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Isinasalaysay nang natural sa Tagalog ang kilos nang hindi nagdaragdag ng tahasang “ngayon” na wala sa Hebreo.
theological_decisions:
- issue: Ugnayan ng “mga anak ng mga propeta” sa mga propeta at kay Eliseo
  choice: Pinanatili sa teksto ang literal na idyomang “mga anak ng mga propeta.”
  alternative: “mga alagad ng mga propeta” o “pangkat ng mga propeta”
  rationale: Hindi tiyak sa parirala lamang kung pangunahing binibigyang-diin ang pagiging alagad, pagiging kasapi ng isang pangkat, o iba pang ugnayan; iniiwasang lutasin sa salin ang tunay na kalabuan.
- issue: Kahulugan ng לְפָנֶיךָ
  choice: sa harap mo
  alternative: sa ilalim ng iyong pangangasiwa
  rationale: Maaaring tumukoy ang parirala sa pisikal na presensya ni Eliseo o sa pamumuhay sa ilalim ng kanyang pangangasiwa. Pinananatili ng teksto ang kalabuan at ipinaliliwanag ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Pakitingnan mo” bilang magalang at malinaw na panawag-pansin, at pinanatili ang dalawang Hebreong idyoma sa pangunahing teksto upang hindi mawala ang kanilang kalabuan.
