base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: tl
  text: 'Sinabi ni Isaias, “Ito ang tanda para sa iyo mula kay Yahweh na gagawin ni Yahweh ang sinabi niya: uusad ba nang sampung baitang[a] ang anino, o babalik ito nang sampung baitang?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sampung antas.” Literal na nangangahulugang “mga baitang” o “mga hakbang” ang salitang Hebreo. Tradisyonal din itong isinasaling “mga antas” dahil sa paggalaw ng anino sa kagamitang kaugnay ni Ahaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: Karaniwang tumutukoy ang אוֹת sa isang tanda o nagpapatunay na himala; natural at malinaw sa Filipino ang “tanda.”
- source_word: מֵאֵת יְהוָה
  choice: mula kay Yahweh
  rationale: Ipinahihiwatig ng מֵאֵת ang pinagmulan, at pinananatili ang personal na pangalang יְהוָה bilang “Yahweh.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman o layunin ng tanda, kaya ang “na” ang natural na pang-ugnay sa Filipino.
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: gagawin ni Yahweh ang sinabi niya
  rationale: Inihahatid nito nang natural ang diwang isasakatuparan ni Yahweh ang bagay na dati niyang sinabi, nang hindi mabigat ang literal na “gagawin ang bagay na sinalita.”
- source_word: הָלַךְ הַצֵּל
  choice: uusad ... ang anino
  rationale: Sa tanong na naghaharap ng dalawang pagpipilian, ang anyo ay tumutukoy sa posibleng pag-usad ng anino; malinaw ang “uusad” at katapat ito ng “babalik.”
- source_word: מַעֲלוֹת
  choice: baitang
  rationale: Literal na tumutukoy ang מַעֲלוֹת sa mga hakbang o baitang. Ang “baitang” ay angkop sa posibleng hagdanang aparatong kaugnay ni Ahaz at hindi ipinapalagay na modernong antas ng anggulo.
- source_word: אִם
  choice: o
  rationale: Ipinakikilala ng אִם ang ikalawang opsiyon sa isang tanong na may dalawang pagpipilian; natural itong ipahayag sa Filipino sa pamamagitan ng “o.”
- source_word: יָשׁוּב
  choice: babalik ito
  rationale: Ang שׁוּב ay nangangahulugang bumalik o umurong; malinaw na ipinapakita ng “babalik” ang pagbaligtad ng direksiyon ng anino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “baitang” upang manatiling malapit sa larawang Hebreo, habang inilagay sa talababa ang tradisyonal na “antas.”
