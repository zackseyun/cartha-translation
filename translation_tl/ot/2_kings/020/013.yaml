translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Ezequias’ bilang nakaugaliang anyong Tagalog ng pangalan. Pinanatili sa pangunahing teksto ang malalawak na kahulugan ng mga salitang Hebreo, at inilagay sa mga talababa ang mahahalagang alternatibo, lalo na sa pagtanggap sa mga sugo, sa imbakan ng kagamitan, sa bahay o palasyo, at sa nasasakupan.
