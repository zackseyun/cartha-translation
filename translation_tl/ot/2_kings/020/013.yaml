  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: tl
  text: At pinakinggan sila ni Ezequias[a] at ipinakita niya sa kanila ang buong kabang-yaman niya[b]—ang pilak, ang ginto, ang mga sangkap na mabango, ang pinong langis, ang imbakan ng kanyang mga kagamitan[c], at ang lahat ng nasa kanyang mga imbakan. Walang anumang bagay sa kanyang bahay[d] o sa buong nasasakupan niya[e] ang hindi ipinakita ni Ezequias sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dininig sila” o “malugod silang tinanggap.” Ang idyomang Hebreo ay maaaring mangahulugang binigyan niya sila ng pakikinig o paborableng pagtanggap.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bahay ng kanyang mahahalagang bagay”; maaari ring “silid-imbakan ng kanyang kayamanan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kanyang taguan ng mga sandata” o “kanyang arsenal”; sa literal, “bahay ng kanyang mga kagamitan.”
    reason: lexical_alternative
  - marker: d
    text: Dahil tahanan ito ng hari, maaari ring “kanyang palasyo.”
    reason: lexical_alternative
  - marker: e
    text: Maaari ring “sa buong sakop ng kanyang kapangyarihan” o “sa buong kanyang kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: pinakinggan sila
  rationale: Pinananatili nito ang pangunahing diwa ng pagbibigay-pansin o pakikinig sa mga sugo, habang hindi lubusang nilulutas ang posibilidad na malugod niya silang tinanggap.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: ipinakita niya sa kanila / ipinakita ... sa kanila
  rationale: Ang Hiphil ng ראה ay karaniwang nangangahulugang ‘ipakita’; iisang salin ang ginamit sa dalawang paglitaw nito.
- source_word: בֵּית נְכֹתֹה
  choice: silid-imbakan ng kanyang kayamanan
  rationale: Ipinahihiwatig ng parirala ang lugar na pinaglalagyan ng mahahalagang pag-aari; malinaw at likas ito sa modernong Tagalog.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: ang pilak, ang ginto
  rationale: Mga mahalagang metal na nakaimbak ang tinutukoy, hindi ‘pera’ sa makabagong makitid na kahulugan.
- source_word: הַבְּשָׂמִים
  choice: mga sangkap na mabango
  rationale: Malawak na salin ito para sa mahahalagang aromatikong sangkap at hindi ito nililimitahan sa pampalasa o pabango lamang.
- source_word: שֶׁמֶן הַטּוֹב
  choice: mahalagang langis
  rationale: Ang literal na ‘mabuting langis’ ay tumutukoy sa de-kalidad o mamahaling langis; ang ‘mahalagang’ ay natural sa konteksto ng kayamanan.
- source_word: בֵּית כֵּלָיו
  choice: imbakan ng kanyang mga kagamitan
  rationale: Pinananatili nito ang mas malawak na kahulugan ng כֵּלִים bilang mga kagamitan, samantalang inilalagay sa talababa ang posibleng tiyak na diwang militar.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: ang lahat ng nasa kanyang mga imbakan
  rationale: Likas na Tagalog ito para sa lahat ng matatagpuan sa kaniyang mga kamalig o kabang-yaman, nang hindi paulit-ulit na ginagamit ang ‘kayamanan.’
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Walang anumang bagay ... ang hindi ipinakita ... sa kanila
  rationale: Pinananatili ng dobleng negatibong ayos ang mariing kabuuang pahayag ng Hebreo at natural pa rin sa Tagalog.
- source_word: בְּבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Direktang pinananatili ang Hebreong ‘bahay,’ bagaman maaaring tumukoy ito sa palasyo ng hari.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: sa buong nasasakupan niya
  rationale: Saklaw nito ang lahat ng nasa ilalim ng pamamahala o kapangyarihan ni Ezequias nang hindi kinakailangang limitahan sa politikal na kahulugan ng ‘kaharian.’
