  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: tl
  text: At sinabi ni Ezequias, “Madali lamang para sa anino na umusad nang sampung baitang.[a] Hindi; sa halip, bumalik ang anino nang sampung baitang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sampung antas.” Ang salitang Hebreo ay nangangahulugang “mga baitang” o “mga pag-akyat” at maaaring tumukoy sa mga baitang o markang hati ng aparatong gumagamit ng anino ni Ahaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: Madali lamang
  rationale: Likas at malinaw na Filipino para sa ideya ng pagiging madali o magaan gawin, habang pinananatili ang pagtataya ni Ezequias.
- source_word: הַצֵּל / לַצֵּל
  choice: ang anino
  rationale: Tuwirang katumbas ng salitang Hebreo at hindi ipinapasok sa pangunahing teksto ang tiyak na interpretasyon tungkol sa aparatong pinagmamasdan.
- source_word: לִנְטוֹת
  choice: umusad
  rationale: Sa konteksto, inilalarawan nito ang karaniwang pasulong na paggalaw o pag-abot ng anino. Natural ito sa Filipino at malinaw na kaibahan ng pagbabalik.
- source_word: מַעֲלוֹת
  choice: mga baitang
  rationale: Ang pangngalan ay tumutukoy sa mga hakbang, baitang, o pag-akyat. Ang “baitang” ay nagpapanatili sa konkretong larawan ng Hebreo nang hindi ipinapalagay na mga digri ng isang orasan ang tinutukoy.
- source_word: לֹא כִּי
  choice: Hindi; sa halip
  rationale: Ipinapahayag ang pagtanggi sa unang posibilidad at ang pagpili sa kasalungat nito sa natural at marangal na Filipino.
- source_word: יָשׁוּב
  choice: pabalikin mo
  rationale: Ipinahahayag ang hinihinging pagbabalik ng anino. Ang anyong pautos ay natural na naghahatid ng jussive o kahilingang puwersa sa konteksto.
- source_word: אֲחֹרַנִּית
  choice: pabalik
  rationale: Ang kahulugan nitong paurong ay likas nang kasama sa “pabalikin,” kaya hindi na inuulit nang mabigat sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “Ezequias” ayon sa nakaugaliang anyong Filipino ng pangalan. Pinanatili ang konkretong “mga baitang” sa teksto at inilagay sa talababa ang alternatibong “mga antas” at ang posibleng kaugnayan sa aparatong panukat ng anino.
