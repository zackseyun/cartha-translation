base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: tl
  text: At daragdagan ko ng labinlimang taon ang buhay mo.[a] Ililigtas kita at ang lungsod na ito mula sa kamay ng hari ng Asiria.[b] Ipagtatanggol ko ang lungsod na ito[c] alang-alang sa aking sarili at alang-alang kay David na aking lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “daragdagan ko ng labinlimang taon ang iyong mga araw.”
    reason: literal_idiom
  - marker: b
    text: O “mula sa kapangyarihan ng hari ng Asiria”; sa literal, “mula sa kamay ng hari ng Asiria.”
    reason: lexical_alternative
  - marker: c
    text: O “Poprotektahan ko ang lungsod na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ
  choice: daragdagan ko ... ang buhay mo
  rationale: Ang literal na larawan ay pagdaragdag “sa iyong mga araw,” ngunit ang “daragdagan ... ang buhay mo” ang natural at malinaw na katumbas sa modernong Tagalog; pinananatili sa talababa ang literal na idyoma.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: ng labinlimang taon
  rationale: Tuwirang katumbas ng bilang at yunit ng panahon sa Hebreo.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: mula sa kamay ng hari ng Asiria
  rationale: Pinananatili ang Hebreong idyoma na “kamay,” na tumutukoy sa kapangyarihan o kontrol at nauunawaan din sa marangal na Tagalog.
- source_word: אַצִּילְךָ
  choice: Ililigtas kita
  rationale: Ang Hiphil ng נצל ay nangangahulugang sagipin o iligtas mula sa panganib o kapangyarihan ng kaaway; ang “ililigtas” ay angkop sa kontekstong militar at pampolitika.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: at ang lungsod na ito
  rationale: Tuwirang pinananatili ang ikalawang layon ng pagliligtas kasama ng hari.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: Ipagtatanggol ko ang lungsod na ito
  rationale: Ang גנן ay maaaring mangahulugang ipagsanggalang, protektahan, o ipagtanggol; ang “ipagtatanggol” ay natural sa konteksto ng banta ng Asiria.
- source_word: לְמַעֲנִי
  choice: alang-alang sa aking sarili
  rationale: Malinaw na ipinahahayag ang motibong nakabatay sa Diyos mismo, nang hindi dinaragdagan ang teolohikong paliwanag.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: at alang-alang kay David na aking lingkod
  rationale: Pinananatili ang tahasang pagtukoy sa lingkod na si David at ang dahilan ng pagkilos ng Diyos.
theological_decisions:
- issue: Dahilan ng Diyos sa pagtatanggol sa Jerusalem
  choice: alang-alang sa aking sarili at alang-alang kay David na aking lingkod
  alternative: alang-alang sa akin at sa aking lingkod na si David
  rationale: Tahasang binabanggit ng Hebreo ang dalawang batayan—ang Diyos mismo at si David na kanyang lingkod. Pinananatili ito nang walang idinaragdag na partikular na paliwanag tungkol sa tipan o doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “Asiria,” at “alang-alang” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Hinati sa tatlong pangungusap para sa natural na daloy habang pinananatili ang lahat ng ugnayang semantiko ng Hebreo.
