base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Hezekias, ang lahat ng kanyang makapangyarihang gawa, at kung paano niya ginawa ang tipunan ng tubig[a] at ang daluyan[b] at ipinasok niya ang tubig sa lungsod[c]—hindi ba nakasulat ang mga ito sa Aklat ng mga Talaan ng mga Hari ng Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “imbakan ng tubig”; ang salitang Hebreo ay maaaring tumukoy sa isang ginawang tipunan o lalagyan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanal”; tumutukoy ang salitang Hebreo sa isang daluyan ng tubig, lalo na sa daluyang ginawa o inayos ng tao.
    reason: lexical_alternative
  - marker: c
    text: Malamang na tumutukoy ito sa kilalang sistema ng patubig na ipinagawa ni Hezekias sa Jerusalem. Ihambing sa 2 Cronica 32:30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ang iba pang mga ginawa
  rationale: Karaniwang pormula ito sa salaysay ng Mga Hari. Ang “mga ginawa” ay likas sa modernong Tagalog at angkop sa mga gawa at nagawa ng isang hari.
- source_word: גְּבוּרָתוֹ
  choice: ang lahat ng kanyang makapangyarihang gawa
  rationale: Maaaring tumukoy ang pangngalan sa lakas, kapangyarihan, o makapangyarihang mga nagawa. Ginagawang malinaw ng salin ang diwa sa konteksto nang hindi nililimitahan ito sa lakas ng katawan o militar.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: at kung paano niya ginawa
  rationale: Ipinakikilala nito ang isang tiyak na halimbawa ng mga nagawa ni Hezekias at pinananatili ang ugnayang ipinahihiwatig ng pariralang Hebreo.
- source_word: הַבְּרֵכָה
  choice: ang tipunan ng tubig
  rationale: Ang salita ay tumutukoy sa isang ginawang pool o reservoir. Ang “tipunan ng tubig” ay malinaw at natural sa Tagalog nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: הַתְּעָלָה
  choice: ang daluyan
  rationale: Tumutukoy ito sa daluyan o kanal ng tubig. Ang “daluyan” ay natural, malawak ang saklaw, at angkop sa gawaing pang-inhinyeriya.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: at pinapasok ang tubig sa lungsod
  rationale: Ipinahihiwatig ng hulaping paturol sa עִירָה ang paggalaw papasok sa lungsod. Ang “pinapasok” ay natural na nagpapahayag na dinala o itinuro ni Hezekias ang tubig paloob.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga ito
  rationale: Pinananatili nito ang retorikal na tanong at ang nakaugaliang pangwakas na pormula sa Mga Hari.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Aklat ng mga Talaan
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa mga opisyal na tala o annals ng hari. Iniiwasan ng “mga Talaan” ang pag-aakalang ito ang kanonikal na aklat na Mga Cronica.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: ng mga Hari ng Juda
  rationale: Likas sa Tagalog ang gamit ng “ng” upang ipakitang ang mga tala ay tungkol sa mga hari ng Juda.
