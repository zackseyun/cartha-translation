translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang retorikal na tanong ng tekstong Hebreo at iniwasan ang panimulang “Ngayon,” sapagkat walang katumbas na salitang temporal sa pinagmulan. Inilagay ang mga talababa sa mismong mga pariralang tinutukoy ng mga ito.
