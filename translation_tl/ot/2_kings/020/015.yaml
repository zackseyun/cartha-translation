  to: At sinabi niya, “Ano ang nakita nila sa bahay mo[a]?” Sumagot si Ezekias, “Nakita nila ang lahat ng nasa bahay ko. Wala ni isang bagay sa mga imbakan ng kayamanan ko[b] ang hindi ko ipinakita sa kanila.”
