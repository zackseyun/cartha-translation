base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: tl
  text: At sinabi niya, “Ano ang nakita nila sa bahay mo[a]?” Sumagot si Ezekias, “Nakita nila ang lahat ng nasa bahay ko. Wala ni isang bagay sa mga imbakan ng kayamanan ko[b] ang hindi ko ipinakita sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palasyo mo.” Ang salitang Hebreo ay literal na “bahay,” ngunit maaari itong tumukoy sa palasyo sa kontekstong maharlika.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kamalig ko” o “mga kabang-yaman ko.” Ang salitang Hebreo ay tumutukoy sa mga lugar na pinaglalagyan ng mahahalagang bagay o mga panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Ano
  rationale: Likas at tuwirang panghalip na pananong sa Filipino.
- source_word: רָאוּ
  choice: nakita nila
  rationale: Ipinahahayag ang karaniwang kahulugan ng ראה at pinananatili ang tahasang pangmaramihang simuno.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: sa bahay mo / nasa bahay ko
  rationale: Pinananatili ang pangunahing kahulugan ng בַּיִת; ipinapaliwanag sa talababa ang posibleng kahulugang palasyo sa kontekstong maharlika.
- source_word: חִזְקִיָּהוּ
  choice: Ezekias
  rationale: Pamilyar at malinaw na anyo ng pangalan sa makabagong Filipino.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: ang lahat ng nasa bahay ko
  rationale: Pinananatili ang saklaw ng כָּל at ang ugnayang ipinahahayag ng אֲשֶׁר sa natural na Filipino.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הִרְאִיתִם
  choice: Wala akong hindi ipinakita sa kanila
  rationale: Natural na Filipino para sa Hebreong negatibong konstruksiyon, habang pinananatili ang Hiphil na diwang ‘ipakita’ at ang layong ‘sa kanila.’
- source_word: בְּאֹצְרֹתָי
  choice: sa mga imbakan ng kayamanan ko
  rationale: Sinasaklaw ang kahulugan ng אֹצָר bilang imbakan o kabang-yaman at ang pangmaramihang anyo nito, nang hindi nililimitahan sa iisang uri ng silid.
