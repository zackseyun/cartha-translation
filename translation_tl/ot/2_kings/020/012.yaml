base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: tl
  text: Nang panahong iyon, nagpadala si Berodac-baladan[a], na anak ni Baladan, ang hari ng Babilonia, ng mga liham at isang regalo kay Ezequias, sapagkat nabalitaan niyang nagkasakit si Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Isaias 39:1, ang pangalan ay Merodac-baladan; gayundin ang anyong sinusundan ng ilang sinaunang salin at makabagong salin ng Bibliya rito.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa modernong Tagalog na pinananatili ang ugnayan nito sa naunang salaysay.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodac-baladan
  rationale: Tuwirang inililipat ang pangalang nasa tekstong Hebreo ng 2 Hari 20:12; ang ibang anyo sa Isaias 39:1 ay inilalagay sa talababa.
- source_word: בֶּן בַּלְאֲדָן
  choice: anak ni Baladan
  rationale: Karaniwang salin ng patronymic construction sa Tagalog.
- source_word: מֶלֶךְ בָּבֶל
  choice: ang hari ng Babilonia
  rationale: Malinaw at natural na pagkakakilanlan sa katungkulan at kaharian.
- source_word: סְפָרִים
  choice: mga liham
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa nakasulat na pakikipag-ugnayan, hindi sa mga aklat sa pangkalahatan.
- source_word: וּמִנְחָה
  choice: at isang regalo
  rationale: Ang מִנְחָה ay maaaring handog, kaloob, o tributo; dito, ang neutral na 'regalo' ang pinakaangkop sa diplomatikong pagpapadala.
- source_word: כִּי שָׁמַע
  choice: sapagkat nabalitaan niya
  rationale: Ipinahahayag ng unang כִּי ang dahilan; natural na inilalarawan ng 'nabalitaan' ang pagtanggap ng balita.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: na nagkasakit si Ezequias
  rationale: Ipinahahayag ng ikalawang כִּי ang nilalaman ng balita. Pinananatili ng 'nagkasakit' ang aspektong ganap nang pangyayari nang hindi labis na tinutukoy kung gumaling na siya sa mismong sugnay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'Berodac-baladan' ayon sa WLC sa talatang ito at pinanatili sa talababa ang mahalagang kaibang anyo. Ang marker na [a] ay inilagay pagkatapos ng pangalang Ezequias sa hulihan upang hindi maputol ang mahabang pangalan, ngunit ang talababa ay tumutukoy sa pangalan ni Berodac-baladan.
