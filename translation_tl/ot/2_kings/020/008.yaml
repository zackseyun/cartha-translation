base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: tl
  text: Sinabi ni Ezequias kay Isaias, “Ano ang magiging tanda na pagagalingin ako ni Yahweh at aakyat ako sa bahay ni Yahweh[a] sa ikatlong araw?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “templo ni Yahweh.” Literal, “bahay ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salaysay sa modernong Tagalog; ipinahihiwatig na ng pagkakasunod ng mga pangyayari ang waw-consecutive nang hindi kailangang laging idagdag ang “At.”
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: יְשַׁעְיָהוּ
  choice: Isaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: מָה אוֹת
  choice: Ano ang magiging tanda
  rationale: Ang אוֹת ay isang tandang nagpapatibay sa pangako. Ang “magiging” ay natural sa tanong tungkol sa tanda na ibibigay, nang hindi tinutukoy nang maaga kung ano ang anyo nito.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman o pinatutunayan ng hinihinging tanda.
- source_word: יִרְפָּא יְהוָה לִי
  choice: pagagalingin ako ni Yahweh
  rationale: Ang imperfect ay tumutukoy sa inaasahang pagpapagaling; natural sa Tagalog ang pokus-sa-layon na “pagagalingin ako.”
- source_word: וְעָלִיתִי
  choice: at aakyat ako
  rationale: Pinananatili ang karaniwang diwa ng עלה na “umakyat,” na angkop sa pagpunta sa santuwaryo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pormal na pinananatili ang metaporang “bahay,” habang nililinaw sa talababa ang kontekstuwal na kahulugang templo.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: sa ikatlong araw
  rationale: Karaniwan at malinaw na katumbas ng Hebreong panandang pamanahon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng tanda sa dalawang sugnay
  choice: Iisang tanda ang nagpapatunay kapuwa sa pagpapagaling at sa pag-akyat sa bahay ni Yahweh
  alternative: Tanda lamang ng pagpapagaling, na sinusundan ng hiwalay na pahayag tungkol sa pag-akyat
  rationale: Ang pagkakaugnay ng יִרְפָּא at וְעָלִיתִי sa ilalim ng כִּי ay pinakamalinaw na naipapahayag bilang magkaugnay na nilalaman ng hinihinging tanda, ngunit hindi dinaragdagan ang teksto ng paliwanag tungkol sa eksaktong lohikal na relasyon ng dalawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga nakaugaliang Filipino na anyo ng mga pangalan at pinanatili ang “umakyat” at “bahay ni Yahweh” upang manatiling malapit sa larawan at pananalita ng Hebreo.
