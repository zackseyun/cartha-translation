base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: tl
  text: Tingnan mo, darating ang mga araw na dadalhin sa Babilonia ang lahat ng nasa bahay mo at ang lahat ng inipon ng mga ninuno mo hanggang sa araw na ito. Walang anumang matitira, sabi ng PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang pantawag-pansin ng Hebreo sa isang natural at tuwirang anyo sa modernong Tagalog.
- source_word: בְּבֵיתֶךָ
  choice: nasa palasyo mo
  rationale: Bagaman literal na 'nasa bahay mo,' sa konteksto ng hari ang tinutukoy ay ang maharlikang sambahayan o palasyo at mga kayamanan nito; 'palasyo' ang mas malinaw sa karaniwang mambabasa.
- source_word: אָצְרוּ
  choice: inipon
  rationale: Ipinahahayag ang pag-iimbak o pagtipon ng mahahalagang bagay nang hindi nililimitahan ang mga ito sa isang partikular na uri ng kayamanan.
- source_word: אָבוֹתֶיךָ
  choice: mga ninuno mo
  rationale: Sa konteksto, mas malawak ito kaysa sa sariling ama lamang at tumutukoy sa mga naunang salinlahi.
- source_word: בָּבֶלָה
  choice: sa Babilonia
  rationale: Ang panlaping patungo sa Hebreo ay natural na isinasalin bilang 'sa'; ginagamit ang nakaugaliang Tagalog na pangalang 'Babilonia.'
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Walang anumang matitira
  rationale: Natural na Tagalog na nagpapanatili sa ganap at mariing saklaw ng pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong Hebreo ay may tetragrammaton na YHWH, isang personal na pangalan; pinananatili ito bilang pangalan nang walang pagdaragdag ng denominasyonal na paliwanag.
- issue: Saklaw ng ganap na pagkawala
  choice: Walang anumang matitira
  alternative: Walang matitirang bagay
  rationale: Pinananatili ang mariing hula ng teksto at hindi binabawasan o pinalalawak ang saklaw nito sa pamamagitan ng interpretatibong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang 'palasyo' ayon sa maharlikang konteksto, samantalang pinanatili ang maikli at mariing himig ng propesiya.
