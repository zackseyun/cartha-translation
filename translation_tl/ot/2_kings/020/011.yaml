  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: tl
  text: At tumawag kay Yahweh ang propetang si Isaias, at pinabalik niya ang anino nang sampung baitang sa mga baitang ni Ahaz na dinaanan nito pababa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sampung antas” o “sampung digri.” Ang salitang Hebreo ay literal na “mga baitang/mga ahon” (ma‘alot). Ayon sa isang tradisyonal na pagkaunawa, maaaring bahagi ang mga ito ng aparatong sumusukat sa anino, kaya isinasalin din itong “orasan ng araw ni Ahaz.”
    reason: Ipinapakita ang leksikal at makasaysayang kalabuan nang hindi ipinapasok sa pangunahing teksto ang isang tiyak na rekonstruksiyon.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tumawag
  rationale: Ang קרא na may אֶל־יְהוָה ay tumutukoy sa pagtawag sa Diyos, karaniwan sa konteksto ng panalangin. Pinananatili ng “tumawag” ang mismong larawan ng pandiwa nang hindi tahasang dinaragdagan ito bilang “nanalangin.”
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: ang propetang si Isaias
  rationale: Likas na ayos sa modernong Tagalog para sa pangalan at titulo; ginagamit ang nakaugaliang anyo ng pangalang “Isaias.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיָּשֶׁב
  choice: pinabalik niya
  rationale: 'Ang Hiphil ng שוב ay may diwang sanhi: pinangyari niyang bumalik ang anino. Likas sa Tagalog ang “pinabalik” at napapanatili nito ang causative sense.'
- source_word: אֶת הַצֵּל
  choice: ang anino
  rationale: Ito ang tuwirang layon ng causative na pandiwa at ang bagay na umurong sa tanda.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  choice: nang sampung baitang ... sa mga baitang
  rationale: Ang מַעֲלוֹת ay literal na mga baitang o ahon. Ang “baitang” ay mas malapit sa tekstong Hebreo kaysa sa mas mapagpasyang “digri,” at pinananatili rin ang pag-uulit sa orihinal.
- source_word: אֲשֶׁר יָרְדָה
  choice: na dinaanan nito pababa
  rationale: Ipinapahayag nito ang naunang pagbaba ng anino sa mga baitang sa paraang malinaw at likas sa Tagalog.
- source_word: בְּמַעֲלוֹת אָחָז
  choice: sa mga baitang ni Ahaz
  rationale: Pinananatili ang payak na paglalarawan at kaugnayan kay Ahaz nang hindi ipinapalagay na tiyak na orasan ng araw ang istruktura.
- source_word: אֲחֹרַנִּית
  choice: pinabalik
  rationale: Ang diwa ng pabalik o paurong na kilos ay likas nang taglay ng pandiwang “pinabalik,” kaya hindi na kailangang ulitin bilang “paurong.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa Hebreo, hindi ang karaniwang salitang pamagat na “Panginoon.” Pinananatili ng “Yahweh” ang pagkakaibang iyon.
- issue: Uri ng mga מַעֲלוֹת na kaugnay ni Ahaz
  choice: mga baitang ni Ahaz
  alternative: hagdanan ni Ahaz, mga digri, o orasan ng araw ni Ahaz
  rationale: Hindi tahasang tinutukoy ng Hebreo kung karaniwang hagdanan ito o bahagi ng aparatong sumusukat sa anino. Pinananatili sa pangunahing teksto ang tunay na kalabuan.
- issue: Gumaganap sa pagpapabalik ng anino
  choice: “niya,” na likas na tumutukoy kay Yahweh
  alternative: uliting “Yahweh”
  rationale: May panlalaking isahang simuno ang pandiwang Hebreo, at si Yahweh ang pinakamalapit na tinutukoy. Ang panghalip ay nagpapanatili sa anyo ng teksto nang hindi nagdaragdag ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinili ang tuwirang “tumawag kay Yahweh” at “pinabalik ang anino,” habang iniwasan ang teknikal o lipas na pananalita. Inilagay ang talababa pagkatapos ng pariralang tungkol sa mga baitang, na siyang tunay na paksa ng paliwanag.
