base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: tl
  text: Pagkatapos nito, dumating ang propetang si Isaias kay Haring Ezequias at sinabi sa kanya, “Ano ang sinabi ng mga lalaking ito, at saan sila nagmula nang pumunta sila sa iyo?[a]” Sumagot si Ezequias, “Nanggaling sila sa isang malayong lupain—mula sa Babilonia.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at mula saan sila pumaparito sa iyo?” Gumagamit ang Hebreo ng anyong di-ganap, ngunit ang nakaraang diwa ang mas angkop sa konteksto ng salaysay.'
    reason: lexical_alternative
  - marker: b
    text: Ang “isang malayong lupain” ay saka tinutukoy bilang “Babilonia.” Pinananatili nito ang pagbibigay-diin ni Ezequias sa malayong pinagmulan ng mga panauhin bago niya pangalanan ang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” para ipakita ang kasunod na pangyayari.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: ang propetang si Isaias
  rationale: Natural na ayos sa Filipino para sa tiyak na titulo at pangalan.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: kay Haring Ezequias
  rationale: Karaniwang anyo sa Filipino para sa titulo at pangalan ng hari.
- source_word: מָה אָמְרוּ
  choice: Ano ang sinabi
  rationale: Ang ganap na anyong Hebreo ay tumutukoy sa natapos na pagsasalita sa konteksto ng salaysay.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: mga lalaking ito
  rationale: Pinananatili ang panlalaking pangmaramihang kahulugan ng אֲנָשִׁים.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: at saan sila nanggaling papunta sa iyo
  rationale: Natural na nakaraang aspekto sa konteksto, habang pinananatili ang tahasang אֵלֶיךָ, “papunta sa iyo.”
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: mula sa isang malayong lupain
  rationale: Tuwirang inilalahad ang heograpikong kalayuan sa natural at marangal na Filipino.
- source_word: בָּאוּ מִבָּבֶל
  choice: Nanggaling sila ... mula sa Babilonia
  rationale: Pinananatili ang pagkakasunod ng pangkalahatang pinagmulan at saka ang tiyak na pangalan ng lugar.
- source_word: בָּבֶל
  choice: Babilonia
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
