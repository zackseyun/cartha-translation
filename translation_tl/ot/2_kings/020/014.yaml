revisions:
- from: Pagkatapos, pumunta ang propetang si Isaias kay Haring Ezequias at sinabi sa kanya, “Ano ang sinabi ng mga lalaking ito, at saan sila nanggaling papunta sa iyo?[a]” Sumagot si Ezequias, “Nanggaling sila sa isang malayong lupain—mula sa Babilonia.”[b]
  to: Pagkatapos nito, dumating ang propetang si Isaias kay Haring Ezequias at sinabi sa kanya, “Ano ang sinabi ng mga lalaking ito, at saan sila nagmula nang pumunta sila sa iyo?[a]” Sumagot si Ezequias, “Nanggaling sila sa isang malayong lupain—mula sa Babilonia.”[b]
