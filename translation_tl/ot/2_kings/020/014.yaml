  naturalness: Ang “Pagkatapos nito, dumating” at “saan sila nagmula nang pumunta sila sa iyo?” ay mas natural na makabagong Filipino habang pinananatili ang kilos at ang tahasang “sa iyo” ng Hebreo.
  terminology: Ang “propetang si Isaias,” “Haring Ezequias,” at “Babilonia” ay angkop, malinaw, at marangal na mga anyo. Ang “mga lalaking ito” ay wastong nagpapanatili sa panlalaking pangmaramihan ng אֲנָשִׁים.
  issues:
