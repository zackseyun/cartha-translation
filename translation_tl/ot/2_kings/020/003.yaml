id: 2KI.20.3
reference: 2 Kings 20:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: tl
  text: “Nakikiusap ako, Yahweh, alalahanin mo sana kung paanong lumakad ako sa harap mo nang may katapatan[a] at buong puso[b], at ginawa ko ang mabuti sa iyong paningin.” At umiyak nang labis si Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa katotohanan.” Maaaring tumukoy ang salitang Hebreo sa katotohanan o katapatan; dito ay inilalarawan nito ang matapat na pamumuhay ni Ezequias sa harap ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “pusong hindi nahahati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: Nakikiusap ako ... sana
  rationale: Pinananatili ng dalawang parirala ang taimtim na pakiusap na ipinahihiwatig ng dalawang Hebreong kataga, ngunit natural pa rin ang daloy sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: זְכָר
  choice: alalahanin mo
  rationale: Tuwirang ipinapahayag ang pautos na anyo bilang isang taimtim na kahilingan sa panalangin.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: lumakad ako sa harap mo
  rationale: Pinananatili ang Hebreong talinghaga tungkol sa paraan ng pamumuhay sa presensiya ng Diyos; malinaw rin ito sa karaniwang Tagalog.
- source_word: בֶּאֱמֶת
  choice: nang may katapatan
  rationale: Sa konteksto, inilalarawan nito ang matapat at mapagkakatiwalaang pamumuhay, bagaman maaari rin itong unawain bilang ‘sa katotohanan.’
- source_word: וּבְלֵבָב שָׁלֵם
  choice: at buong puso
  rationale: Ipinahihiwatig ng שָׁלֵם ang buo at hindi nahahating katapatan, hindi ang ganap na kawalan ng kasalanan.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: at ginawa ko ang mabuti sa iyong paningin
  rationale: Pinananatili ang karaniwang Hebreong paglalarawan na ang Diyos ang pamantayan ng kung ano ang mabuti.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: At umiyak nang labis
  rationale: Likas na ipinahahayag sa Tagalog ang pagpapatindi ng Hebreong parirala nang hindi idinaragdag ang tiyak na diwa ng kapaitan.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo at tuwirang tinatawag sa panalangin, kaya pinanatili ito bilang pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng pahayag na לֵבָב שָׁלֵם
  choice: buong puso
  alternative: pusong ganap
  rationale: Pinananatili nito ang pahayag ni Ezequias tungkol sa buo at hindi nahahating debosyon nang hindi ipinapakahulugang inaangkin niya ang kawalang-kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong talinghagang “lumakad ... sa harap mo” at ang pariralang “sa iyong paningin,” habang ginawang likas ang taimtim na pakiusap at matinding pag-iyak.
