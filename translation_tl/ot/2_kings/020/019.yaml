base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ezequias kay Isaias, “Mabuti ang salita ni Yahweh na sinabi mo.” Sinabi pa niya, “Hindi ba magkakaroon ng kapayapaan at katatagan habang nabubuhay ako?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “Hindi ba, kung magkakaroon ng kapayapaan at katotohanan sa aking mga araw?” Ang salitang Hebreo para sa “katatagan” ay maaari ring mangahulugang “katotohanan” o “katapatan.”'
    reason: Pinananatili ang eliptikong anyo at mahahalagang alternatibong kahulugan ng אֱמֶת.
lexical_decisions:
- source_word: טוֹב
  choice: mabuti
  rationale: Tuwirang katumbas ito ng pagsusuri sa ipinahayag na salita at pinananatili ang kaiklian at moral na tensiyon ng tugon ni Ezequias.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pormal na ugnayan sa propetikong pagsasalita, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: דִּבַּרְתָּ
  choice: na sinabi mo
  rationale: Natural sa Tagalog ang pariralang ito para sa tuwirang pagtukoy sa ipinahayag ni Isaias bilang propeta.
- source_word: הֲלוֹא אִם
  choice: Hindi ba magkakaroon
  rationale: Ipinahahayag nito sa natural na Tagalog ang retorikal at eliptikong pangangatwiran ng Hebreo nang hindi ginagawang lihim na kaisipan ang tahasang וַיֹּאמֶר, “sinabi niya.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Malawak at karaniwang katumbas ito na maaaring tumukoy sa katahimikan, kaligtasan, at mabuting kalagayan.
- source_word: אֱמֶת
  choice: katatagan
  rationale: Sa kontekstong maharlika at pambansa, ipinahihiwatig nito ang maaasahan at matatag na kalagayan; inilalagay sa talababa ang mas literal at tradisyonal na “katotohanan.”
- source_word: בְיָמָי
  choice: habang nabubuhay ako
  rationale: Natural na modernong Tagalog para sa idyomang “sa aking mga araw,” na malinaw na tumutukoy sa panahon ng kanyang buhay.
theological_decisions:
- issue: Eliptiko ang huling pahayag ni Ezequias at maaaring unawain bilang tuwirang sinabi o bilang paliwanag ng kanyang dahilan.
  choice: 'Panatilihin itong tuwirang pananalita: “Sinabi pa niya, ‘Hindi ba magkakaroon ng kapayapaan at katatagan habang nabubuhay ako?’”'
  alternative: “Sapagkat naisip niya, ‘Hindi ba magkakaroon ng kapayapaan at katatagan habang nabubuhay ako?’”
  rationale: Tahasang sinasabi ng Hebreo na “sinabi niya,” kaya pinananatili iyon, habang ang retorikal na tanong ay natural na ipinahahayag sa Tagalog. Hindi nito inaalis ang moral na tensiyon sa pansariling pagtingin ni Ezequias sa ipinagpalibang kapahamakan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang mga pangalang Ezequias at Isaias na pamilyar sa tradisyong Tagalog, ngunit iniwasan ang lipas na balangkas ng pangungusap. Ang banal na pangalan ay Yahweh.
