base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: tl
  text: At ilan sa mga anak mong magmumula sa iyo, na ikaw ang magiging ama nila, ay kukunin at magiging mga eunuko[a] sa palasyo ng hari ng Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal ng palasyo” o “mga opisyal ng korte.” Ang salitang Hebreo ay maaaring tumukoy sa literal na mga eunuko o, sa ilang konteksto, sa mga opisyal ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: At ang ilan sa mga anak mo
  rationale: Ang partitive na מִן kasama ng בָּנִים ay likas na tumutukoy sa ilan mula sa pangkat. Pinanatili ang “mga anak” sa halip na gawing “mga inapo,” sapagkat iyon ang tuwirang salita sa Hebreo.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: na magmumula sa iyo
  rationale: Pinananatili nito ang idyomang tumutukoy sa pisikal na pagkamag-anak o paglapit mula kay Ezequias nang hindi gumagamit ng di-likas na literalismo.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: na ikaw mismo ang magiging ama
  rationale: 'Ipinahahayag nito sa natural na modernong Tagalog ang pananaw ng pandiwang Hiphil ng ילד: si Ezequias ang lalaking magkakaanak o magiging ama nila. Ang “mismo” ay tumutulong ding mapanatili ang diin ng inuulit na paglalarawan.'
- source_word: יִקַּח
  choice: ay kukunin
  rationale: Bagaman pormal na isahan at aktibo ang anyong Hebreo, di-tiyak ang gumagawa sa konteksto. Ang pasibong Tagalog ay natural at hindi nagdaragdag ng tahasang simuno.
- source_word: וְהָיוּ
  choice: at magiging
  rationale: Sa kontekstong ito, ipinahihiwatig ng היה kasama ng panaguring pangngalan ang pagpasok nila sa isang bagong kalagayan o tungkulin.
- source_word: סָרִיסִים
  choice: mga eunuko
  rationale: Ito ang pangunahing literal na kahulugan ng salita at angkop sa matinding hatol na inilalarawan. Dahil maaari rin itong tumukoy sa mga opisyal ng maharlikang palasyo, inilagay ang alternatibo sa talababa.
- source_word: בְּהֵיכַל
  choice: sa palasyo
  rationale: Dahil sinusundan ito ng “hari ng Babilonia,” malinaw na ang הֵיכָל ay maharlikang palasyo, hindi templo.
- source_word: מֶלֶךְ בָּבֶל
  choice: ng hari ng Babilonia
  rationale: Tuwiran at malinaw na salin ng construct chain sa Hebreo.
theological_decisions:
- issue: Kahulugan ng סָרִיסִים sa konteksto ng maharlikang palasyo
  choice: mga eunuko sa pangunahing teksto
  alternative: mga opisyal ng palasyo o mga opisyal ng hari
  rationale: Maaaring tumukoy ang salitang Hebreo sa mga lalaking kinapon o, sa ilang konteksto, sa matataas na opisyal ng korte. Ang literal na kahulugan ay leksikal na pangunahin at kapani-paniwala rito, ngunit pinananatili sa talababa ang tunay na posibilidad ng di-literal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang bahagyang pag-uulit ng dalawang pariralang tumutukoy sa pagiging supling ni Ezequias dahil naroon ito sa Hebreo at nagbibigay-diin sa personal at dinastikong bigat ng hula.
