base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: tl
  text: Sinabi ni Isaias, “Kumuha kayo ng isang tipak ng pinisáng igos[a].” Kinuha nila ito at ipinatong sa pigsa[b], at gumaling siya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang pinisáng masa ng igos” o “isang tipak ng igos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “namamagang sugat” o “ulser.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “at nabuhay siya”; sa konteksto, nangangahulugan itong gumaling siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Sinabi” nang hindi dinaragdagan ang tiyak na temporal na diwa.
- source_word: יְשַׁעְיָהוּ
  choice: Isaias
  rationale: Karaniwang anyo ng pangalan ng propeta sa Tagalog.
- source_word: קְחוּ
  choice: Kumuha kayo
  rationale: Pautos na maramihan ang pandiwang Hebreo; malinaw na ipinakikita ng “kayo” na higit sa isa ang inuutusan.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: isang kimpal ng pinisang igos
  rationale: Ang דְּבֶלֶת ay isang pinagdikit o pinisang masa, karaniwang mula sa pinatuyong igos. Iniiwasan ng “kimpal” ang posibleng maling pahiwatig ng “keyk” na ito ay inihurnong pagkain.
- source_word: וַיִּקְחוּ
  choice: Kaya kumuha sila nito
  rationale: Ipinahihiwatig ng maramihang pandiwa ang mga tumugon sa utos, at natural na inilalagay sa Tagalog ang panghalip na “nito” para sa bagay na nabanggit na.
- source_word: וַיָּשִׂימוּ עַל
  choice: at ipinatong sa
  rationale: Ang שׂים ay pangkalahatang pandiwa ng paglalagay; ang “ipinatong sa” ay angkop sa paglalapat ng pinisang igos sa apektadong bahagi.
- source_word: הַשְּׁחִין
  choice: pigsa
  rationale: Ang שְׁחִין ay tumutukoy sa pigsa o namamagang sugat sa balat; “pigsa” ang pinakamaikli at karaniwang katumbas sa Tagalog.
- source_word: וַיֶּחִי
  choice: at gumaling siya
  rationale: Literal na may diwang “nabuhay,” ngunit sa konteksto ng karamdaman ay nangangahulugan itong nanumbalik ang kalusugan. Natural na ipinahahayag iyon ng “gumaling siya.”
theological_decisions:
- issue: Kahulugan ng kinalabasan sa וַיֶּחִי
  choice: gumaling siya mula sa karamdaman
  alternative: nabuhay siya / nanumbalik ang kanyang lakas
  rationale: Maaaring literal na isaling “nabuhay,” ngunit sa kontekstong medikal ang pandiwa ay tumutukoy sa paggaling. Pinananatili sa talababa ang literal na anyo upang hindi maitago ang lawak ng kahulugan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kimpal ng pinisang igos” upang maging kongkreto at madaling maunawaan, at iniwasan ang “keyk” dahil maaari itong magpahiwatig ng inihurnong pagkain. Ang maramihang utos ay malinaw na ipinahayag sa “kayo.”
