id: 2KI.20.4
reference: 2 Kings 20:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: tl
  text: Hindi pa nakalalabas si Isaias sa gitnang looban[a] nang dumating sa kanya ang salita ni Yahweh na nagsasabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “gitnang lungsod.” Karaniwang inuunawa rito ang parirala bilang isang bahagi o looban ng palasyo; kaya “gitnang looban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: nang
  rationale: Isinama ang panimulang pormulang pasalaysay sa natural na kayariang temporal sa Filipino; ipinahahayag ng buong pangungusap ang bagong pangyayaring ipinakikilala ng וַיְהִי nang hindi gumagamit ng lipas o mabigat na parirala.
- source_word: יְשַׁעְיָהוּ
  choice: Isaias
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino, na malinaw at madaling makilala ng karaniwang mambabasa.
- source_word: לֹא יָצָא
  choice: Hindi pa nakalalabas
  rationale: 'Ipinahahayag ng “hindi pa” ang temporal na diwa: hindi pa natatapos ni Isaias ang paglabas nang dumating ang salita ni Yahweh.'
- source_word: הָעִיר הַתִּיכֹנָה
  choice: gitnang looban
  rationale: Bagaman literal na “gitnang lungsod,” malamang na tumutukoy sa isang bahagi o looban ng palasyo ayon sa konteksto. Pinananatili ng “gitnang” ang kahulugan ng תִּיכֹנָה, habang ang talababa ay nagtatala ng tunay na leksikal na kalabuan.
- source_word: וּדְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Natural na Filipino para sa karaniwang pormulang propetiko, at pinananatili ang tiyak na pariralang “ang salita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הָיָה אֵלָיו
  choice: dumating sa kanya
  rationale: Idyomatikong salin ng pormulang Hebreo para sa pagtanggap ng propeta ng mensahe ng Diyos.
- source_word: לֵאמֹר
  choice: na nagsasabi,
  rationale: Pinananatili ang pormal na ugnayan sa tuwirang pananalitang kasunod sa susunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang יהוה sa teksto. Ang “Yahweh” ay nagpapanatili sa ipinahayag na pangalang tipan nang hindi ito ginagawang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na kayariang “Hindi pa… nang…” upang maipakita ang pagkakasunod ng mga pangyayari. Inilagay ang pananda ng talababa pagkatapos mismo ng pinagtatalunang pariralang “gitnang looban.”
