source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: tl
  text: '“Bumalik ka at sabihin mo kay Ezequias, ang pinuno ng aking bayan, ‘Ganito ang sabi ni Yahweh, ang Diyos ni David, na iyong ninuno: Narinig ko ang panalangin mo at nakita ko ang mga luha mo. Narito, pinagagaling kita.[a] Sa ikatlong araw, aakyat ka sa bahay ni Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagagalingin kita.” Ang Hebreong pandiwang isinaling “pinagagaling” ay participle at maaari ring magpahiwatig ng nalalapit na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב
  choice: Bumalik ka
  rationale: Tuwirang pautos kay Isaias na bumalik kay Ezequias; natural ito sa makabagong Tagalog at pinananatili ang diwang direksiyonal.
- source_word: וְאָמַרְתָּ
  choice: at sabihin mo
  rationale: Natural na kasunod na utos at malapit sa payak na pandiwang Hebreo na ‘sabihin.’
- source_word: נְגִיד עַמִּי
  choice: ang pinuno ng aking bayan
  rationale: Ang נָגִיד ay pinuno o tagapamahala; malinaw ang ‘pinuno’ at hindi ito nagdaragdag ng aristokratikong kahulugan ng ‘prinsipe.’
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sabi ni Yahweh
  rationale: Pinananatili ang pormal na pormula ng mensaherong propetiko sa natural na Tagalog.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: ang Diyos ni David na iyong ninuno
  rationale: Bagaman literal na ‘ama,’ maaaring tumukoy ang אָב sa ninuno; mas malinaw sa Tagalog na si David ang ninuno ni Ezequias.
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: Narinig ko ang panalangin mo
  rationale: Payak at natural na katumbas na nagpapahayag ng natapos na pagdinig na may agarang tugon.
- source_word: רָאִיתִי אֶת־דִּמְעָתֶךָ
  choice: nakita ko ang mga luha mo
  rationale: Pinananatili ang paralelismo sa naunang sugnay; natural sa Tagalog ang maramihang ‘mga luha.’
- source_word: הִנְנִי
  choice: Tingnan mo
  rationale: Nagbibigay-diin at tumatawag ng pansin sa ipinahahayag na pagkilos ng Diyos nang hindi gumagamit ng makalumang pananalita.
- source_word: רֹפֶא לָךְ
  choice: pinagagaling kita
  rationale: Sinasalamin ang participle na maaaring magpahiwatig ng kasalukuyan o nalalapit na pagkilos; hindi tahasang nilulutas ang aspektuwal na tensiyon.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Sa ikatlong araw
  rationale: Tuwirang katumbas ng pariralang temporal nang walang idinagdag na paliwanag.
- source_word: תַּעֲלֶה
  choice: aakyat ka
  rationale: Karaniwang ginagamit ang עלה sa pag-akyat patungo sa templo; natural sa Tagalog ang hinaharap na ‘aakyat ka.’
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang ‘bahay ni Yahweh’ sa halip na ipakahulugang ‘templo.’
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Aspekto ng רֹפֶא sa pangako ng Diyos
  choice: pinagagaling kita
  alternative: pagagalingin kita
  rationale: Ang participle kasunod ng הִנְנִי ay maaaring magpahayag ng kasalukuyan o nalalapit na pagkilos. Pinananatili ng pangunahing salin ang anyong progresibo, habang inilalagay sa talababa ang natural na pagbasa bilang pangako sa hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang anyong ‘mo/ka’ dahil iisang tao ang kinakausap, at iniwasan ang makaluma o labis na pormal na mga anyo. Inilagay ang talababa pagkatapos ng sugnay na tinutukoy nito.
