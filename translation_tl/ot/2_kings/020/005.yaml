- from: '“Bumalik ka at sabihin mo kay Ezequias, ang pinuno ng aking bayan, ‘Ganito ang sabi ni Yahweh, ang Diyos ni David na iyong ninuno: Narinig ko ang panalangin mo at nakita ko ang mga luha mo. Tingnan mo, pinagagaling kita.[a] Sa ikatlong araw, aakyat ka sa bahay ni Yahweh.’”'
  to: '“Bumalik ka at sabihin mo kay Ezequias, ang pinuno ng aking bayan, ‘Ganito ang sabi ni Yahweh, ang Diyos ni David, na iyong ninuno: Narinig ko ang panalangin mo at nakita ko ang mga luha mo. Narito, pinagagaling kita.[a] Sa ikatlong araw, aakyat ka sa bahay ni Yahweh.’”'
  rationale: Pinalitan ang “Tingnan mo” ng “Narito” upang mas maipakita ang הִנְנִי sa natural ngunit marangal na Tagalog. Nilagyan ng kuwit ang appositive na tumutukoy kay David bilang ninuno ni Ezequias. Inayos ang talababa upang hindi nito tawaging literal ang isang hindi literal na katumbas, at upang malinaw na maipaliwanag ang aspektuwal na alternatibo nang hindi nilulutas ang ambigwidad ng Hebreo.
