  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: tl
  text: At nahimlay si Hezekias kasama ng kanyang mga ninuno[a], at si Manases na kanyang anak ay naging hari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “humiga kasama ng kanyang mga ninuno.” Karaniwang pormula ito sa Hebreo sa mga ulat tungkol sa pagkamatay ng mga hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: namatay at nalagak
  rationale: Ang שׁכב ay literal na “humiga,” ngunit sa pormulang עִם אֲבֹתָיו isa itong karaniwang pahayag tungkol sa pagkamatay at pagkalagak. Inihahatid ng “namatay at nalagak” ang kahulugan nang natural sa modernong Tagalog habang pinananatili sa talababa ang larawan ng Hebreo.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa kontekstong ito, ang אָבוֹת ay tumutukoy sa mga naunang salinlahi. Mas natural at malinaw sa modernong Tagalog ang “mga ninuno” kaysa sa literal na “mga ama,” na maaaring mapagkamalang tumutukoy lamang sa agarang ama.
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Sa pormula ng paghalili, ipinahihiwatig ng מלך ang pag-upo sa trono, kaya ang “naging hari” ay mas tiyak kaysa “naghari,” na maaari ring tumukoy sa buong panahon ng pamamahala.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Tagalog ng pangalan.
- source_word: בְנוֹ
  choice: ang anak niyang
  rationale: Tuwirang ipinapahayag ang ugnayang ama at anak at maayos itong dumadaloy sa pangungusap.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghahari, ang תַּחְתָּיו ay nangangahulugang pumalit sa posisyon ng naunang hari. Natural na ipinapahayag ito ng “bilang kahalili niya.”
