  naturalness: Marangal at malinaw ang daloy. Ang “si Manases na kanyang anak” ay bahagyang mas tuwiran at natural sa isang pormal na salaysay kaysa “ang anak niyang si Manases,” bagaman kapwa katanggap-tanggap.
