  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, ibinaling niya ang mukha niya sa pader at nanalangin siya kay Yahweh,[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; karaniwan din itong isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Pagkatapos, ibinaling niya
  rationale: 'Ang Hiphil wayyiqtol ng סבב ay nagsasaad ng kasunod na kilos sa salaysay: ibinaling niya. Ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod na dala ng waw-consecutive.'
- source_word: פָּנָיו
  choice: ang kanyang mukha
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreong פָּנִים at natural itong kasama ng pandiwang “ibinaling.”
- source_word: אֶל הַקִּיר
  choice: sa pader
  rationale: Ang אֶל ay tumutukoy sa direksiyon patungo sa קִיר, “pader”; sa Filipino, likas ang “ibinaling ... sa pader.”
- source_word: וַיִּתְפַּלֵּל
  choice: at nanalangin
  rationale: Ang Hitpael ng פלל ay nangangahulugang manalangin; ang aspektong naganap ay angkop sa daloy ng salaysay.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל ay “kay/sa,” at ang personal na pangalang יְהוָה ay tinumbasan ng “Yahweh,” na pinananatili ang pangalan sa tekstong Hebreo.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Ang infinitive construct ng אמר ay pormulang nagpapakilala sa mismong nilalaman ng panalangin na sumusunod sa susunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreong teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan nang hindi ito ginagawang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibinaling” upang maging natural ang kongkretong kilos, at pinanatili ang pormulang “na sinasabi” dahil nagpapatuloy sa susunod na talata ang panalangin.
