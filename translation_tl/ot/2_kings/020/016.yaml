  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Isaias kay Ezequias, “Pakinggan mo ang salita ni Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: Ipinababatid ang anyo ng banal na pangalan sa Hebreo at ang nakaugaliang alternatibong salin nito.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive kasama ng pandiwang אמר ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sinabi” at napapanatili nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יְשַׁעְיָהוּ
  choice: Isaias
  rationale: Ito ang nakaugaliang anyo ng pangalang Isaiah sa mga saling Tagalog at madaling makilala ng mga mambabasa.
- source_word: אֶל
  choice: kay
  rationale: Ipinakikita ng pang-ukol ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na katumbas nito bago ang pangalan ng tao.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ito ang nakaugaliang anyo ng pangalang Hezekiah sa mga saling Tagalog.
- source_word: שְׁמַע
  choice: Pakinggan mo
  rationale: Isahan ang pautos na anyo ng שמע. Ang “Pakinggan mo” ay malinaw at natural sa Tagalog, at pinananatili ang tuwirang panawagan ng propeta.
- source_word: דְּבַר
  choice: ang salita
  rationale: Sa pormulang pampropeta, ang דְּבַר ay tumutukoy sa ipinahayag na mensahe ng Diyos. Pinananatili ng “ang salita” ang kinikilalang idyomang biblikal nang hindi inaalis ang diwa ng mensahe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ang tetragrammaton ay tuwirang pangalang pantangi sa tekstong Hebreo. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang tetragrammaton יְהוָה. Ang “Yahweh” ay kumakatawan sa pangalang nasa tekstong pinagmulan, samantalang ang “ang PANGINOON” ay tradisyonal na pamalit na titulo at ang “Jehovah” ay ibang anyo ng transliterasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga nakaugaliang anyong Tagalog na “Isaias” at “Ezequias,” at ang natural na pautos na “Pakinggan mo.”
