revisions:
- from: 'Nang mga araw na iyon, nagkasakit si Hezekias at malapit nang mamatay. Pinuntahan siya ng propetang si Isaias na anak ni Amoz at sinabi sa kanya, “Ganito ang sinabi ni Yahweh: ‘Ayusin mo ang mga bagay sa iyong sambahayan, sapagkat mamamatay ka; hindi ka na mabubuhay.’”[a]'
  to: 'Noong mga araw na iyon, nagkasakit si Hezekias at malapit nang mamatay. Dumating sa kaniya ang propetang si Isaias, anak ni Amoz, at sinabi sa kaniya, “Ganito ang sabi ni Yahweh: ‘Ayusin mo ang mga bagay sa iyong sambahayan, sapagkat mamamatay ka[a]; hindi ka na mabubuhay.’”'
  rationale: Inayos ang pambungad para sa natural na modernong Filipino, ginawang mas tuwiran ang pagdating ni Isaias kay Hezekias, at inilagay ang talababa sa mismong pariralang tinutukoy nito. Pinananatili ng saling “mamamatay ka” ang katiyakan at pagkalapit ng kamatayan nang hindi ipinapakahulugang patay na si Hezekias.
