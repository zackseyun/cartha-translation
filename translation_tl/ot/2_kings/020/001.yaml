base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: tl
  text: 'Noong mga araw na iyon, nagkasakit si Hezekias at malapit nang mamatay. Dumating sa kaniya ang propetang si Isaias, anak ni Amoz, at sinabi sa kaniya, “Ganito ang sabi ni Yahweh: ‘Ayusin mo ang mga bagay sa iyong sambahayan, sapagkat mamamatay ka[a]; hindi ka na mabubuhay.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sapagkat ikaw ay namamatay” o “sapagkat ikaw ay patay.” Ipinahahayag ng Hebreong pananalita ang tiyak at nalalapit na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Likas na salin ng Hebreong panandang pamanahon at angkop bilang pambungad sa salaysay.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: nagkasakit si Hezekias at malapit nang mamatay
  rationale: Ipinahahayag ang paglala ng karamdaman hanggang sa bingit ng kamatayan nang hindi sinasabing nagsimula na siyang mamatay.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ang propetang si Isaias na anak ni Amoz
  rationale: Pinananatili ang pangalan, ugnayang anak-ama, at katungkulan sa natural na ayos ng modernong Tagalog.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Natural at marangal na anyo ng pormulang ginagamit ng mensahero ng Diyos; pinananatili ang pangalang Yahweh.
- source_word: צַו לְבֵיתֶךָ
  choice: Ayusin mo ang mga bagay sa iyong sambahayan
  rationale: Inilalahad ang idyomatikong diwa ng pagbibigay ng mga huling tagubilin at pagsasaayos ng mga usapin ng sambahayan bago mamatay.
- source_word: כִּי מֵת אַתָּה
  choice: sapagkat mamamatay ka
  rationale: Direkta at natural na ipinahahayag ang tiyak at nalalapit na kamatayang ipinahahayag ng predikatibong anyo.
- source_word: וְלֹא תִחְיֶה
  choice: hindi ka na mabubuhay
  rationale: Pinananatili ang tahasang pagtanggi sa patuloy na buhay, sa halip na ipakahulugang 'hindi ka gagaling.'
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Lakas ng pahayag na מֵת אַתָּה
  choice: mamamatay ka
  alternative: mamamatay ka na; para ka nang patay
  rationale: Pinananatili ang katiyakan at pagkalapit ng kamatayan nang hindi maling ipinahahayag na patay na si Hezekias.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga nakaugaliang anyong Tagalog na Hezekias at Isaias; iniwasan ang labis na literal na 'utusan mo ang iyong bahay' dahil hindi nito malinaw na naihahatid ang Hebreong idyoma.
