revisions:
- from: 'At sinabi niya sa kanya, “Ganito ang sinabi ni Yahweh: ‘Dahil nagsugo ka ng mga mensahero upang sumangguni kay Baal-zebub[a], ang diyos ng Ekron—dahil ba walang Diyos sa Israel upang sumangguni sa kanyang salita[b]? Kaya, ang higaang inakyatan mo[c]—hindi ka na bababa mula roon, sapagkat tiyak na mamamatay ka.’”'
  to: 'At sinabi niya sa kanya, “Ganito ang sabi ni Yahweh: ‘Sapagkat nagsugo ka ng mga mensahero upang sumangguni kay Baal-zebub[a], ang diyos ng Ekron—dahil ba walang Diyos sa Israel upang sumangguni sa kanyang salita[b]? Kaya, ang higaan na inakyatan mo[c]—hindi ka bababa mula sa higaan, sapagkat tiyak na mamamatay ka.’”'
  rationale: Ginawa lamang ang mga ligtas na pagbabago para sa mas natural na modernong Filipino at mas angkop na pormulang propetiko. Pinanatili ang lahat ng semantikong sangkap ng Hebreo, kabilang ang retorikal na tanong, ang “kanyang salita,” ang pangalan na Baal-zebub, ang nakaunang parirala tungkol sa higaan, at ang mariing hatol na kamatayan. Napanatili rin ang lahat ng talababa at ang wastong pagkakaangkla ng mga pananda.
