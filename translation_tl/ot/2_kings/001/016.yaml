source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Ganito ang sabi ni Yahweh: ‘Sapagkat nagsugo ka ng mga mensahero upang sumangguni kay Baal-zebub[a], ang diyos ng Ekron—dahil ba walang Diyos sa Israel upang sumangguni sa kanyang salita[b]? Kaya, ang higaan na inakyatan mo[c]—hindi ka bababa mula sa higaan, sapagkat tiyak na mamamatay ka.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalan sa tekstong Hebreo ay “Baal-zebub.” Ang kaugnay na anyong “Baal-zebul” ay makikita sa mas huling tradisyon.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “sumangguni sa kanyang salita”; malamang na ang ibig sabihin ay humingi ng banal na mensahe o pahayag mula sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “ang higaan na inakyatan mo roon.” Ang “roon” sa Hebreo ay resumptibo at hindi kailangang ulitin sa natural na Tagalog.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: At sinabi niya sa kanya
  rationale: Sa kontekstong pasalaysay, natural sa modernong Tagalog ang “sinabi,” habang malinaw pa ring ipinakikilalang tuwirang pahayag ang kasunod.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormula ng mensaherong propetiko at ang pangalang tipan na Yahweh.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: nagsugo ka ng mga mensahero
  rationale: Mga taong sugo ang tinutukoy rito, hindi mga anghel; ang “nagsugo” ay angkop sa atas ng hari.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: upang sumangguni kay Baal-zebub
  rationale: Sa kontekstong panrelihiyon, ipinahihiwatig ng דרש ang paghingi ng sagot o pahayag mula sa isang diyos; natural itong naipapahayag ng “sumangguni.”
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ang diyos ng Ekron
  rationale: Tuwirang ipinakikilala si Baal-zebub bilang diyos na kaugnay ng Ekron.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: dahil ba walang Diyos sa Israel
  rationale: Pinananatili ang retorikal na tanong at ang pagsaway na ipinahihiwatig nito.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: upang sumangguni sa kanyang salita
  rationale: Pinananatili ang tahasang דְּבָרוֹ, “kanyang salita,” sa halip na palitan ito sa pangunahing teksto ng isang mas tiyak na pagpapakahulugang “orakulo” o “pahayag.”
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: ang higaang inakyatan mo
  rationale: Pinananatili ang kongkretong larawan ng pag-akyat sa higaan, habang hindi na inuulit ang resumptibong “doon” sa loob ng sugnay sapagkat hindi ito natural sa Tagalog.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: hindi ka na bababa mula roon
  rationale: Tinutumbasan ang ירד na “bumaba” at ang pambabaeng panghalip na tumutukoy sa higaan; ang “roon” ay natural na pantukoy sa Tagalog.
- source_word: כִּי מוֹת תָּמוּת
  choice: sapagkat tiyak na mamamatay ka
  rationale: Ipinahahayag ang mariing infinitive absolute construction bilang katiyakan ng kamatayan.
theological_decisions:
- issue: Paglalarawan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng לִדְרֹשׁ בִּדְבָרוֹ
  choice: sumangguni sa kanyang salita
  alternative: humingi ng pahayag mula sa kanya; sumangguni sa kanya
  rationale: Hindi inaalis ang salitang דָּבָר at hindi rin ipinipirmi kung ito ay isang orakulo, mensahe, o kapahayagan; inililinaw sa talababa ang malamang na diwa.
- issue: Retorikal na tanong tungkol sa Diyos sa Israel
  choice: dahil ba walang Diyos sa Israel
  alternative: dahil ba kulang ng Diyos sa Israel
  rationale: Pinananatili itong retorikal na pagsaway, hindi literal na pag-aalinlangan sa pag-iral ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang propetiko, ang retorikal na tanong, ang tahasang “kanyang salita,” at ang nakaunang pariralang “ang higaang inakyatan mo” upang hindi mawala ang diin at pagkakaayos ng Hebreo. Ang mga panandang [a], [b], at [c] ay inilagay mismo sa mga salitang tinatalakay ng kani-kanilang talababa.
