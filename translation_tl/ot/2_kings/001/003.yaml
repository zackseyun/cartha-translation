  source_fidelity: Tumpak ang pangunahing diwa at ang retorikal na tanong. Gayunman, ang “umaahon” ay hindi likas sa ganitong utos ng paglalakbay at maaaring magpahiwatig ng paglitaw o pag-ahon mula sa tubig; mas tumpak at natural ang “umakyat” para sa עֲלֵה. Ang “nagsalita ... kay” ay mas malapit din sa דִּבֶּר אֶל kaysa “sinabi ... kay.”
  naturalness: Marangal at malinaw sa pangkalahatan, ngunit mas natural sa modernong Filipino ang “Tumayo ka, umakyat ka” kaysa “Tumayo ka at umahon.” Inilagay rin ang panandang talababa mismo sa pariralang saklaw nito upang malinaw ang kaugnayan ng alternatibong pagbasa.
  terminology: Ang “anghel ni Yahweh,” “Elias na Tisbita,” “mga sugo,” “Samaria,” “Baal-zebub,” at “diyos ng Ekron” ay angkop. Napananatili ang pagkakaiba ng anghel at mga sugo, at hindi nagdaragdag ng anumang doktrinal na pagpapakahulugan.
  issues:
