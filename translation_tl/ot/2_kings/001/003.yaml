    issue: “Umahon” para sa עֲלֵה
    rationale: Bagaman may diwang pataas ang salita, hindi ito ang karaniwang pandiwang Filipino para sa utos na magtungo paakyat sa landas o lugar. Ang “umakyat” ay likas at pinananatili ang direksiyonal na puwersa ng Hebreo.
  - severity: low
    issue: “Sinabi ng anghel ... kay Elias” para sa דִּבֶּר אֶל
    rationale: Nauunawaan ito dahil sinusundan ng tuwirang sipi, ngunit ang “nagsalita ... kay” ay mas tuwirang katumbas ng pandiwang Hebreo at natural pa rin sa Filipino.
  - severity: low
    issue: Nasa dulo ng buong sipi ang panandang talababa
    rationale: Ang talababa ay tumutukoy lamang sa idiomang “Dahil ba walang Diyos sa Israel”; ang paglalagay ng [a] agad pagkatapos ng pariralang iyon ay mas malinaw ang saklaw.
