revisions:
- from: Ngunit sinabi ng anghel ni Yahweh kay Elias na Tisbita, “Tumayo ka at umahon upang salubungin ang mga sugo ng hari ng Samaria. Sabihin mo sa kanila, ‘Dahil ba walang Diyos sa Israel kaya pupunta kayo upang sumangguni kay Baal-zebub, ang diyos ng Ekron?’”[a]
  to: Ngunit nagsalita ang anghel ni Yahweh kay Elias na Tisbita, “Tumayo ka, umakyat ka upang salubungin ang mga sugo ng hari ng Samaria, at sabihin mo sa kanila, ‘Dahil ba walang Diyos sa Israel[a] kaya pupunta kayo upang sumangguni kay Baal-zebub, ang diyos ng Ekron?’”
  rationale: Inayos ang pandiwa para sa dalawang utos upang maging likas ang Filipino at mapanatili ang pataas na direksiyon ng עֲלֵה. Pinalitan ang “sinabi” ng “nagsalita” upang masundan ang דִּבֶּר אֶל, at inilipat ang panandang talababa sa eksaktong pariralang may alternatibong pagsasalin. Hindi binago ang kahulugan, mga pangalan, o ang retorikal na puwersa ng teksto.
