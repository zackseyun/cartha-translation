id: 2KI.1.3
reference: 2 Kings 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: tl
  text: Ngunit nagsalita ang anghel ni Yahweh kay Elias na Tisbita, “Tumayo ka, umakyat ka upang salubungin ang mga sugo ng hari ng Samaria, at sabihin mo sa kanila, ‘Dahil ba walang Diyos sa Israel[a] kaya pupunta kayo upang sumangguni kay Baal-zebub, ang diyos ng Ekron?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Dahil ba sa kawalan ng Diyos sa Israel kaya pupunta kayo upang sumangguni kay Baal-zebub, ang diyos ng Ekron?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Ngunit ang anghel ni Yahweh
  rationale: Ipinahihiwatig ng וּ ang pagsalungat sa ginawa ng hari sa naunang talata, kaya “Ngunit.” Maaaring “sugo” o “anghel” ang מַלְאָךְ, ngunit sa pariralang ito at kontekstong ito, natural ang “anghel”; pinananatili ang pangalang Yahweh.
- source_word: דִּבֶּר אֶל
  choice: sinabi ... kay
  rationale: Ang דִּבֶּר אֶל ay “nagsalita kay,” ngunit mas natural sa Filipino ang “sinabi ... kay” bago ang tuwirang sipi.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elias na Tisbita
  rationale: Ginagamit ang nakaugaliang Filipino na anyo ng pangalan at ang katawagang tumutukoy sa pinagmulan niyang Tisbe.
- source_word: קוּם עֲלֵה
  choice: Tumayo ka at umahon
  rationale: Pinananatiling magkahiwalay ang dalawang pautos at ang pataas na direksiyon ng עֲלֵה.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ng infinitibong may לִ ang layunin; ang “salubungin” ay hindi nagdaragdag ng di-tiyak na diwang pakikipagsagupaan.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: mga sugo ng hari ng Samaria
  rationale: Dito, mga taong ipinadala ng hari ang מַלְאָךְ, kaya “mga sugo” upang malinaw na maiba sa makalangit na “anghel.”
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Dahil ba walang Diyos sa Israel
  rationale: Natural na naipahahayag ang retorikal at nanunumbat na tanong habang pinananatili ang literal na ideya ng kawalan ng Diyos sa Israel.
- source_word: אַתֶּם הֹלְכִים
  choice: pupunta kayo
  rationale: Ang participle ay tumutukoy sa kasalukuyang nakaplanong kilos; sa Filipino, malinaw itong naipahahayag ng aspektong kontemplatibo.
- source_word: לִדְרֹשׁ
  choice: upang sumangguni kay
  rationale: Sa konteksto ng paghingi ng sagot sa isang diyos, mas tiyak ang “sumangguni kay” kaysa pangkalahatang “hanapin.”
- source_word: בַּעַל זְבוּב
  choice: Baal-zebub
  rationale: Tinutumbasan sa transliterasyon at pinananatili ang gitling upang makilala bilang tambalang pangalang pantangi.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ang diyos ng Ekron
  rationale: Tiyak ang kahulugan ng construct phrase at tinutukoy ang kinikilalang diyos ng Ekron.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinipili ang pinakanatural na kahulugan sa salaysay ngunit hindi nilulutas ang higit pang teolohikal na tanong tungkol sa eksaktong pagkakakilanlan ng anghel.
- issue: Puwersa ng retorikal na tanong
  choice: Dahil ba walang Diyos sa Israel
  alternative: Dahil ba sa kakulangan ng Diyos sa Israel
  rationale: Pinananatili ang pagsaway at ang tensiyon ng tanong nang hindi ito ginagawang tuwirang pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang dalawang pautos, ang retorikal na pagsaway, at ang pagkakaiba ng makalangit na “anghel” at mga taong “sugo.”
