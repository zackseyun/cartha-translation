  source_fidelity: 'Tapat ang salin sa pangwakas na pormulang Hebreo: ang “iba pang mga ginawa” ay wastong tumutukoy sa וְיֶתֶר דִּבְרֵי ... אֲשֶׁר עָשָׂה, at napananatili ang retorikal na tanong na “hindi ba,” ang pasibong “nakasulat,” at ang sangguniang talaan. Ang pagsasama ng “mga ginawa” at “na kaniyang ginawa” sa isang likas na parirala ay hindi nagbabago ng kahulugan.'
