  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Ahazias—hindi ba nakasulat[a] ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatala.” Literal na “nakasulat” ang Hebreo, ayon sa karaniwang pormula ng mga talaang panghari.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Kasaysayan ng mga Hari ng Israel” ay isang talaang panghari na binabanggit bilang sanggunian sa Mga Hari; hindi ito kinakailangang tumukoy sa biblikal na aklat ng Mga Cronica.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pangwakas na pormula tungkol sa paghahari, ang יֶתֶר דִּבְרֵי ay tumutukoy sa natitirang mga gawa o pangyayari tungkol sa hari, hindi lamang sa kaniyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: אֲחַזְיָהוּ
  choice: Ahazias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: אֲשֶׁר עָשָׂה
  choice: mga ginawa
  rationale: Isinama sa naunang parirala upang maiwasan ang mabigat at paulit-ulit na “ang iba pang mga ginawa ... na kaniyang ginawa,” habang napapanatili ang diwa ng sugnay.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng sang-ayon na sagot at ang literal na diwa ng כְתוּבִים na “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na “sa ibabaw ng balumbon,” ang “sa Aklat” ang likas na katumbas sa pormulang tumutukoy sa isang nakasulat na sanggunian.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: mga Kasaysayan ng mga Hari ng Israel
  rationale: Ipinahahayag nito ang talaang panghari o mga annal na binabanggit sa Mga Hari. Ang “mga Kasaysayan” ay malinaw at hindi agad ipinapantay ang sanggunian sa kanonikal na aklat ng Mga Cronica.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormulang retorikal ng Hebreo, ngunit pinagsama ang דִּבְרֵי at אֲשֶׁר עָשָׂה upang maging natural at hindi paulit-ulit sa Tagalog. Inilagay ang bawat talababa sa mismong bahaging nililinaw nito.
