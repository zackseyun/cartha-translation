  text: After the death of Ahab[a], Moab rebelled against Israel.
translation:
  language: tl
  text: Pagkamatay ni Ahab, naghimagsik[a] ang Moab laban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nag-alsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, ang פשע ay tumutukoy sa pagrerebelde sa kapangyarihang nakasasakop, hindi lamang sa pangkalahatang paggawa ng kasalanan. Likas at malinaw sa modernong Filipino ang “naghimagsik.”
- source_word: מוֹאָב
  choice: Moab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng bansa o bayang Moab.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Kapag kasama ng פשע, ang pang-ukol na בְּ ay nagpapahayag kung kanino nakatuon ang paghihimagsik; kaya “laban sa Israel” ang malinaw na katumbas.
- source_word: אַחֲרֵי מוֹת
  choice: Pagkamatay ni
  rationale: Natural at maikli itong pagpapahayag sa Filipino ng temporal na pariralang “pagkatapos ng kamatayan ni.”
- source_word: אַחְאָב
  choice: Ahab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
