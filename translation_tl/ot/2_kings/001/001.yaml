  register: Gumamit ng natural, makabago, at marangal na Filipino. Inilagay ang panandang [a] pagkatapos ng “naghimagsik,” sapagkat ang talababa ay tumutukoy sa alternatibong salin ng pandiwa, hindi sa pangalang Ahab.
