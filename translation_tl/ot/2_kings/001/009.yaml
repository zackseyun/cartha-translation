  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: tl
  text: Pagkatapos, nagsugo ang hari sa kanya ng isang pinuno ng limampu, kasama ang kanyang limampung kawal. Umahon ang pinuno papunta sa kanya, at naroon siya, nakaupo sa tuktok ng burol.[a] Sinabi ng pinuno sa kanya, “Tao ng Diyos, ganito ang sabi ng hari:[b] ‘Bumaba ka.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tuktok ng bundok.” Ang salitang Hebreo na הַר ay maaaring tumukoy sa burol o bundok depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “Nagsalita ang hari: ‘Bumaba ka.’” Ang Hebreo ay gumagamit ng pormula ng mensahero na natural na isinalin dito bilang “ganito ang sabi ng hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo ang hari
  rationale: Ang wayyiqtol ay nagpapatuloy sa pagkakasunod-sunod ng salaysay. Nilinaw ang ipinahihiwatig na simuno mula sa konteksto upang maging natural sa Tagalog.
- source_word: שַׂר חֲמִשִּׁים
  choice: isang pinuno ng limampung kawal
  rationale: Tumutukoy ito sa opisyal ng hukbo na namumuno sa pangkat na limampu; pinananatili ng salin ang bilang at tungkuling militar.
- source_word: וַחֲמִשָּׁיו
  choice: kasama ang limampung tauhan nito
  rationale: Ang hulaping panghalip ay tumutukoy sa pangkat na nasa ilalim ng pinuno. Likas sa Tagalog na idagdag ang “tauhan” kaysa sabihing “ang kanyang limampu.”
- source_word: וַיַּעַל אֵלָיו
  choice: Umahon ang pinuno papunta sa kanya
  rationale: Pinananatili ng “umahon” ang pataas na kilos patungo sa kinaroroonan ni Elias; inulit ang “pinuno” upang maiwasan ang malabong reperensiya ng panghalip.
- source_word: וְהִנֵּה
  choice: at naroon siya
  rationale: Ipinahahayag nito ang biglang malinaw na pagkakita sa tagpo sa natural na modernong Tagalog, nang hindi gumagamit ng makalumang “narito.”
- source_word: יֹשֵׁב
  choice: nakaupo
  rationale: Inilalarawan ng participle ang nagpapatuloy na kalagayan o postura ni Elias sa sandaling iyon.
- source_word: עַל רֹאשׁ הָהָר
  choice: sa tuktok ng burol
  rationale: Ang רֹאשׁ ay “tuktok,” samantalang ang הַר ay maaaring “burol” o “bundok.” Pinili ang “burol” sa teksto at itinabi sa talababa ang lehitimong alternatibo.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Sinabi ng pinuno sa kanya
  rationale: Bagaman literal na “nagsalita,” ang “sinabi ... sa kanya” ang likas na panimula sa tuwirang pananalita sa Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay hindi likas bilang titulong propetiko sa modernong Tagalog. Ang “Lingkod ng Diyos” ay malinaw at marangal, bagaman bahagyang nagpapakahulugan sa idiomatikong titulo.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: ganito ang sabi ng hari
  rationale: Natural na pormula ito sa Tagalog para sa mensahe ng hari. Ang perpektong “nagsalita” ay hindi kailangang ilipat nang mekanikal dahil pormula ito ng mensahero.
- source_word: רֵדָה
  choice: Bumaba ka
  rationale: Tuwirang inililipat ang pautos na anyo ng ירד at ang pababang kilos mula sa tuktok.
theological_decisions:
- issue: Pagtukoy sa אִישׁ הָאֱלֹהִים bilang titulong propetiko
  choice: Lingkod ng Diyos
  alternative: Tao ng Diyos
  rationale: Pinili ang mas natural at nauunawaang titulong Filipino nang hindi tinutukoy ang anumang denominasyonal na katungkulan. Kinikilala na mas literal ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kawal” upang ipakita ang kontekstong militar at “tauhan” para sa pangkat sa ilalim ng pinuno. Iniwasan ang sobrang makalumang pananalita habang pinananatili ang masiglang paglalahad ng tagpo.
