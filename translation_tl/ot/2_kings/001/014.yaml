  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: tl
  text: Narito,[a] bumaba ang apoy mula sa langit at tinupok ang unang dalawang pinuno ng tiglilimampu at ang kani-kanilang limampung tauhan. Ngunit ngayon, nawa’y maging mahalaga sa iyong paningin ang buhay ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan mo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “maging mahalaga sana ang buhay ko sa iyong paningin.” Ang salitang isinaling “buhay” ay maaari ring isaling “kaluluwa,” ngunit dito ay tumutukoy ito sa buhay ng nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Nagbibigay-diin ito at itinutuon ang pansin sa pangyayaring binanggit. Ang “Narito” ay marangal at malinaw sa modernong Tagalog.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: bumaba ang apoy mula sa langit
  rationale: Likas na ayos sa Tagalog at tuwirang pinananatili ang kilos, simuno, at pinagmulan sa Hebreo.
- source_word: וַתֹּאכַל
  choice: tinupok
  rationale: Bagaman literal na “kinain,” ang karaniwang salitang Tagalog para sa mapangwasak na pagkilos ng apoy ay “tinupok.”
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: ang unang dalawang pinuno ng tiglilimampu
  rationale: Ang שַׂר ay pinunong militar dito, at ang pariralang “ng tiglilimampu” ay nagpapahiwatig na bawat isa ay namumuno sa pangkat na limampu.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: at ang kani-kanilang limampung tauhan
  rationale: Literal na tumutukoy sa “kanilang mga limampu.” Nililinaw ng “kani-kanilang limampung tauhan” ang mga yunit nang hindi ginagawang iisang pangkat lamang ang dalawa.
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahahayag ang paghahambing ng sinapit ng mga naunang pangkat sa kasalukuyang pagsusumamo.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: ituring mo sanang mahalaga ang buhay ko
  rationale: Pinananatili ang diwa ng pagiging mahalaga o mahal sa paningin ng kausap, habang natural na ipinahahayag sa Tagalog ang magalang at apurahang pakiusap.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa pagsusumamo upang mabuhay
  choice: buhay
  alternative: kaluluwa
  rationale: Sa konteksto, nakikiusap ang nagsasalita na huwag siyang mamatay tulad ng mga nauna. Ang “buhay” ang kongkretong kahulugan dito at hindi nagpapasok ng di-kinakailangang paghihiwalay ng katawan at kaluluwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinuno ng tiglilimampu” upang mapanatili ang katawagang militar at ang laki ng bawat yunit; iniwasan ang mas teknikal o makalumang “kapitan ng limampu.”
