base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: tl
  text: 'Muli siyang nagsugo kay Elias ng isa pang pinuno ng limampung kawal, kasama ang kanyang limampung tauhan. Sumagot siya at sinabi kay Elias, “Tao ng Diyos, ganito ang sabi ng hari: ‘Bumaba ka agad.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח אֵלָיו
  choice: Muli siyang nagsugo kay Elias
  rationale: Ang וַיָּשָׁב na sinusundan ng pandiwa ay nagpapahiwatig ng pag-uulit, hindi ng literal na pagbabalik. Nilinaw ang tinutukoy ng panghalip bilang si Elias upang maging natural sa Tagalog.
- source_word: שַׂר חֲמִשִּׁים
  choice: pinuno ng limampu
  rationale: Tumutukoy ito sa opisyal na namumuno sa pangkat na limampung kawal. Ang 'pinuno ng limampu' ay malinaw at malapit sa anyo ng Hebreo.
- source_word: אַחֵר וַחֲמִשָּׁיו
  choice: isa pang pinuno ng limampu, kasama ang limampung tauhan nito
  rationale: Ang אַחֵר ay kapalit o karagdagang pinuno, at ang וַחֲמִשָּׁיו ay ang limampung lalaking nasa ilalim ng kanyang pamumuno. Ginamit ang 'kasama' para sa likas na Tagalog na pagpapahayag ng accompaniment.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: Sinabi ng pinuno sa kanya
  rationale: Ang pares na Hebreong 'sumagot at nagsalita' ay isang pormulang pambungad sa pagsasalita. Sa Tagalog, ang 'sinabi ... sa kanya' ay natural at hindi nagpapahiwatig na may naunang tanong.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Lingkod ng Diyos
  rationale: Bagaman literal na 'tao ng Diyos,' ang parirala ay isang kinikilalang titulo para sa propeta. Ang 'Lingkod ng Diyos' ay natural at marangal sa modernong Tagalog, at naiiwasan ang posibleng maling pagkaunawa na tumutukoy lamang ito sa kasarian.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: ganito ang sinabi ng hari
  rationale: Pinananatili nito ang pormal at makapangyarihang pormula ng mensahero sa natural na Tagalog.
- source_word: מְהֵרָה רֵדָה
  choice: Bumaba ka agad
  rationale: Ang רֵדָה ay payak na utos na bumaba, at ang מְהֵרָה ay nagpapahayag ng pagmamadali. Ang 'agad' ay likas na katumbas sa kontekstong ito.
theological_decisions:
- issue: Pagtutumbas sa titulong אִישׁ הָאֱלֹהִים
  choice: Lingkod ng Diyos
  alternative: Tao ng Diyos
  rationale: Ang parirala ay titulo ng propeta, hindi isang pahayag tungkol sa kanyang likas o pagka-Diyos. Ang napiling salin ay naghahatid ng tungkuling kinakatawan ng titulo nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tono ng utos ng hari at ang estrukturang pasalaysay, habang iniwasan ang lipas o labis na teknikal na wikang militar.
