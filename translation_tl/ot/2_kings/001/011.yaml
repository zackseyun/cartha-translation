- from: 'Muli siyang nagsugo kay Elias ng isa pang pinuno ng limampu, kasama ang limampung tauhan nito. Sinabi ng pinuno sa kanya, “Lingkod ng Diyos, ganito ang sinabi ng hari: ‘Bumaba ka agad.[a]’”'
  to: 'Muli siyang nagsugo kay Elias ng isa pang pinuno ng limampung kawal, kasama ang kanyang limampung tauhan. Sumagot siya at sinabi kay Elias, “Tao ng Diyos, ganito ang sabi ng hari: ‘Bumaba ka agad.’”'
  rationale: Itinuwid ang pangunahing titulo ayon sa Hebreo at sa matatag na gamit sa Filipino, pinanatili ang pormal na mensahe ng hari, at inalis ang talababa na hindi kailangan dahil ang “Bumaba” ay tapat na nitong iniiwanang bukas ang direksiyong ‘paparito’ o ‘paparoon.’
