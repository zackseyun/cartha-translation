id: 2KI.1.4
reference: 2 Kings 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: tl
  text: 'Kaya[a] ganito ang sabi ni Yahweh: “Hindi ka bababa mula sa higaang inakyatan mo,[b] sapagkat tiyak na mamamatay ka.” At umalis si Elias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Dahil dito.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, pinagtatapat ang “inakyatan” at “bababa”; literal ang larawang pataas at pababa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Kaya
  rationale: Malinaw at likas na ipinahihiwatig ang bunga ng naunang pagsaway at hatol.
- source_word: כֹּה אָמַר יְהוָה
  choice: ganito ang sabi ni Yahweh
  rationale: Pinananatili ang nakaugaliang pormula ng mensaherong propetiko sa maikli at marangal na modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַמִּטָּה
  choice: higaan
  rationale: Karaniwan at sapat na malawak na katumbas ng salitang maaaring tumukoy sa higaan o kama; iniiwasan ang mas mapagpahiwatig na “higaan ng maysakit.”
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: na inakyatan mo
  rationale: Pinananatili ang pandiwang pataas upang manatili ang sinadyang pagtutol nito sa kasunod na “bababa,” habang hindi isinasama ang resumptibong “doon” na magiging alanganin sa Tagalog.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: Hindi ka bababa mula sa
  rationale: Pinananatili ang literal na kilos na pababa at ang ugnayan nito sa “inakyatan,” sa halip na ipakahulugang “hindi ka makakabangon.”
- source_word: כִּי מוֹת תָּמוּת
  choice: sapagkat tiyak na mamamatay ka
  rationale: Ipinahahayag ng “tiyak” ang pagpapatibay na dulot ng infinitive absolute kasama ng pandiwang may takdang anyo.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: At umalis si Elias
  rationale: Likas na isinusulong ng “At” ang salaysay, at ang “umalis” ang angkop na diwa ng pagpunta ni Elias mula sa tagpong ito.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginagamit ng tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Tiyak na hatol sa pariralang מוֹת תָּמוּת
  choice: tiyak na mamamatay ka
  alternative: mamamatay ka nga
  rationale: Kapuwa posible ang mga ito, ngunit mas tuwirang ipinakikita ng “tiyak” ang diin sa katiyakan nang hindi nagdaragdag ng paliwanag sa sanhi o panahon ng kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at pormal na pahayag ng propeta, ang pangalang Yahweh, at ang kapansin-pansing pagtutol ng “umakyat” at “bumaba” sa Hebreo.
