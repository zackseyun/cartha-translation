base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: tl
  text: Bumalik sa kanya ang mga mensahero, at sinabi niya sa kanila, “Bakit[a] kayo bumalik?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Ano ito—bumalik kayo?” Isa itong idyoma na ang ibig sabihin ay “Bakit kayo bumalik?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: Bumalik
  rationale: Ang pandiwang mula sa שוב ay nagsasaad dito ng pagbabalik ng mga mensahero sa nagsugo sa kanila. Natural at tuwiran sa modernong Tagalog ang “bumalik.”
- source_word: הַמַּלְאָכִים
  choice: ang mga mensahero
  rationale: Mga taong isinugo ng hari ang tinutukoy sa konteksto, hindi mga makalangit na nilalang. Malinaw at pangkaraniwan sa modernong Filipino ang “mga mensahero.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ipinahahayag ng parirala ang direksiyon patungo sa lalaking pinagbabalikan nila. Sapat ang “sa kanya” sapagkat taglay na ng “bumalik” ang diwa ng pagbabalik.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: at sinabi niya sa kanila
  rationale: Pinananatili nito ang karaniwang pandiwang Hebreo na “sinabi,” sa halip na palitan agad ng mas interpretatibong “tinanong,” kahit tanong ang kasunod na pangungusap.
- source_word: מַה זֶּה
  choice: Bakit
  rationale: Literal itong “Ano ito...?” ngunit gumaganap bilang idyomatikong pagtatanong sa dahilan ng kanilang maagang pagbabalik. “Bakit” ang pinakamalinaw at natural na katumbas sa Tagalog; inilalahad sa talababa ang literal na anyo.
- source_word: שַׁבְתֶּם
  choice: kayo bumalik
  rationale: Ikalawang panauhang panlalaking maramihan ang anyo ng pandiwa. Hindi minamarkahan ng Tagalog ang kasarian dito, at natural sa tuwirang tanong ang “kayo bumalik.”
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Pinili ang “mga mensahero” upang malinaw na mga taong isinugo ang tinutukoy, at inilagay ang talababa sa “Bakit,” ang salitang kinauukulan ng literal na alternatibo.
