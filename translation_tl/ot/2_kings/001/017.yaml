  source_fidelity: Tapat ang salin sa Hebreo. Ang “Kaya namatay siya” ay angkop na pagsulong ng salaysay at tumutugma sa puwersa ng wayyiqtol sa konteksto. Wasto ang “ayon sa salita ni Yahweh na sinabi ni Elias,” ang paghalili ni Jehoram, ang petsang panghari, at ang dahilang wala siyang anak na lalaki.
