source:
  edition: WLC
  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: tl
  text: Kaya namatay siya[a], ayon sa salita ni Yahweh na sinabi ni Elias. At si Jehoram ang naging hari bilang kahalili niya nang ikalawang taon ng paghahari ni Jehoram na anak ni Jehoshafat, na hari ng Juda, sapagkat wala siyang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At namatay siya … At naghari si Jehoram bilang kahalili niya.” Payak na anyong pasalaysay ang mga pandiwang Hebreo; itinatampok ng “naging hari” ang pagluklok, samantalang mas pormal na alternatibo ang “naghari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kaya namatay siya
  rationale: Isinusulong ng wayyiqtol ang salaysay. Likas sa Filipino ang “Kaya” upang iugnay ang kamatayan sa naunang pahayag, habang pinananatili ang payak na diwang “namatay.”
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Ipinahihiwatig ng כִּדְבַר na naganap ang kamatayan alinsunod sa naipahayag na salita; pinananatili ang pangalang Yahweh para sa יְהוָה.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: na sinabi ni Elias
  rationale: Tuwirang iniuugnay ng sugnay ang naunang salita sa sinabi ni Elias, nang hindi ipinapasok ang mas mapagpaliwanag na “sa pamamagitan ni Elias.”
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: At si Jehoram ang naging hari bilang kahalili niya
  rationale: Sa kontekstong ito, ang מלך ay tumutukoy sa pagluklok. Malinaw na ipinapahayag ng “naging hari bilang kahalili niya” ang paghalili na nasa תַּחְתָּיו.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: nang ikalawang taon ng paghahari ni Jehoram
  rationale: Ang parirala ay pormula ng pagpepetsa ayon sa taon ng paghahari; idinagdag ang “ng paghahari” para sa likas at malinaw na Filipino.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: na anak ni Jehoshafat, na hari ng Juda
  rationale: 'Nililinaw ng dalawang “na” ang kaugnayan: si Jehoram ang anak ni Jehoshafat, at si Jehoshafat ang hari ng Juda.'
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: sapagkat wala siyang anak na lalaki
  rationale: Causal ang כִּי at ipinaliliwanag kung bakit hindi anak ng namatay ang humalili; tahasang tinutukoy ng בֵּן ang anak na lalaki.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Tagapagsalita ng salita ni Yahweh
  choice: salita ni Yahweh na sinabi ni Elias
  alternative: salita ni Yahweh na sinabi niya sa pamamagitan ni Elias
  rationale: Ang Hebreo ay tuwirang nagsasabing ang salitang iyon ay sinabi ni Elias. Hindi nilulutas o pinalalawak ng salin ang ugnayan ng banal at propetikong pananalita nang higit sa sintaks.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” upang panatilihin ang tiyak na kahulugan ng בֵּן, at “nang ikalawang taon ng paghahari” bilang likas na pormula ng pagpepetsa sa Filipino.
