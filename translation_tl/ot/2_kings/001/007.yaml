  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa kanila[a], “Ano ang hitsura ng lalaking lumapit upang salubungin kayo at sinabi sa inyo ang mga salitang ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Anong uri ng lalaki siya?” Sa literal: “Ano ang kaanyuan ng lalaki...?” Ang salitang Hebreo ay maaaring tumukoy sa asal, paglalarawan, o anyo; dito, malamang na hinihingi ang paglalarawang makatutukoy kung sino ang lalaki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: Ano ang hitsura
  rationale: Ang tanong ay humihingi ng pagkakakilanlang paglalarawan sa lalaki, gaya ng ipinakikita ng sagot sa kasunod na talata. Natural sa modernong Filipino ang “Ano ang hitsura,” habang ang talababa ay nagpapanatili sa mas malawak na diwa ng מִשְׁפַּט.
- source_word: הָאִישׁ
  choice: ang lalaking
  rationale: Tumutukoy ito sa tiyak na lalaking nakatagpo ng mga sugo; ang anyong “lalaking” ay likas sa sugnay na Filipino.
- source_word: עָלָה לִקְרַאתְכֶם
  choice: sumalubong sa inyo
  rationale: Inihahatid ng “sumalubong” ang idiomatikong diwa ng paglapit upang makipagtagpo. Hindi na tahasang isinalin ang direksiyonal na “umakyat” dahil magiging alanganin at hindi mahalaga sa puntong ito sa Filipino.
- source_word: וַיְדַבֵּר אֲלֵיכֶם
  choice: at nagsabi sa inyo
  rationale: Natural na Filipino ito para sa pagsasalita ng isang tiyak na mensahe at maayos na inuugnay sa “mga salitang ito.”
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ng mga salitang ito
  rationale: Malapit sa kongkretong Hebreong parirala at hindi pinapalitan ng mas interpretatibong “mensaheng ito.”
