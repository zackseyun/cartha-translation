  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: tl
  text: 'Muli siyang nagpadala ng ikatlong pinuno ng limampu kasama ang limampu niyang tauhan. Umakyat ito at lumapit, at ang ikatlong pinuno ng limampu ay lumuhod sa harap ni Elias. Nakiusap siya kay Elias at sinabi, “Tao ng Diyos, nakikiusap ako: maging mahalaga sana sa iyong paningin ang buhay ko at ang buhay ng limampung lingkod mong ito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang kaluluwa ko at ang kaluluwa ng limampung lingkod mong ito.” Ang Hebreong nefesh ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa,” depende sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Muli
  rationale: Sa daloy ng salaysay, ipinahihiwatig ng pandiwa ang pag-ulit ng ginawa ng hari; mas natural ito kaysa literal na “bumalik siya.”
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: ikatlong pinuno ng limampu kasama ang limampu niyang tauhan
  rationale: Pinananatili ang pagkakasunod-sunod at yunit na limampu. Idinagdag ang “tauhan” bilang likas na ipinahihiwatig sa kontekstong militar.
- source_word: וַיַּעַל וַיָּבֹא
  choice: Umakyat ito at lumapit
  rationale: Pinananatili ang dalawang kilos sa Hebreo habang ginagawang malinaw at natural ang ikalawang pandiwa sa Tagalog.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: lumuhod
  rationale: Ang “lumuhod” ay likas na Tagalog para sa kilos na pagbaluktot ng mga tuhod; hindi na kailangang ulitin ang “sa kaniyang mga tuhod.”
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: Nakiusap siya kay Elias
  rationale: Ipinapahayag ang taimtim na pagsusumamo nang hindi pinalalabis ang lakas ng pandiwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Tao ng Diyos
  rationale: Malapit sa anyo at kinikilalang titulong propetiko sa Hebreo; hindi ito pinalitan ng mas interpretatibong “propeta” o “lingkod.”
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: maging mahalaga sana sa iyong paningin
  rationale: Pinananatili ang metapora ng pagiging mahalaga at ang magalang na pakiusap na ipinahihiwatig ng נָא.
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: ang buhay ko at ang buhay
  rationale: Sa agarang panganib ng kamatayan, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao, hindi kinakailangang sa isang hiwalay na di-materyal na kaluluwa.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: limampung lingkod mong ito
  rationale: Natural na ayos sa Tagalog na pinananatili ang bilang, demonstratibo, at ugnayan ng mga tauhan sa kinakausap.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa salaysay na may banta ng kamatayan
  choice: buhay
  alternative: kaluluwa / sarili
  rationale: Ang hinihiling ng pinuno ay huwag silang mamatay. Ang “buhay” ang pinakamalinaw na kahulugan sa konteksto at umiiwas sa pagpasok ng mas huling sistematikong palagay tungkol sa kaluluwa.
- issue: Titulong אִישׁ הָאֱלֹהִים
  choice: Tao ng Diyos
  alternative: lingkod ng Diyos / propeta ng Diyos
  rationale: Pinananatili ang mismong titulo at hindi tahimik na tinutukoy ang tungkulin nito bilang “propeta” o “lingkod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Elias,” ang karaniwang anyong Tagalog ng pangalan. Pinanatili ang bahagyang pormal na “Tao ng Diyos” at “sa iyong paningin” dahil mahalaga ang mga ito sa titulo at metapora ng pinagmulang Hebreo.
