  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: tl
  text: 'Sinabi nila sa kanya, “May isang lalaking dumating upang salubungin kami. Sinabi niya sa amin, ‘Humayo kayo at bumalik sa haring nagsugo sa inyo. Sabihin ninyo sa kanya: Ganito ang sabi ni Yahweh: “Dahil ba walang Diyos sa Israel[a] kaya nagpapadala ka upang sumangguni kay Baal-Zebub, ang diyos ng Ekron? Kaya hindi ka na bababa mula sa kama na hinigaan mo[b], sapagkat tiyak na mamamatay ka.”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dahil ba sa kakulangan ng isang Diyos sa Israel…?”'
    reason: Ipinakikita ang mas pormal na pagbasa sa idyomatikong Hebreo.
  - marker: b
    text: 'Sa mas literal na anyo: “mula sa kama na iyong inakyatan doon.”'
    reason: Pinananatili sa talababa ang pandiwang “umakyat” at ang adberbyong “doon/roon” sa Hebreo; mas idiomatiko sa Tagalog ang “kama na hinigaan mo.”
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking pangngalan at ang pananaw ng mga sugo, na hindi pa kumikilala kay Elias sa pangalan.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: umahon upang salubungin kami
  rationale: Ang עָלָה ay may diwang paakyat; pinananatili ng “umahon” ang galaw, samantalang likas sa Tagalog ang “upang salubungin kami.”
- source_word: לְכוּ שׁוּבוּ
  choice: Humayo kayo at bumalik
  rationale: Pinananatili ang dalawang pautos sa Hebreo nang hindi nagiging labis na putol o alanganin sa Tagalog.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: Sabihin ninyo sa kanya
  rationale: Sa kontekstong may kasunod na tuwirang mensahe, ito ang natural na Tagalog para sa utos na magsalita sa hari.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Ginagamit ang likas ngunit marangal na anyo ng pormulang propetiko at tuwirang isinasalin ang banal na pangalan.
- source_word: הַמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Dahil ba walang Diyos sa Israel
  rationale: Pinananatili ang retorikal at mapanuyang pagsaway; ang alternatibong pag-unawa bilang “dahil ba sa kakulangan ng Diyos” ay inilagay sa talababa.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: nagpapadala ka upang sumangguni
  rationale: Ang דָּרַשׁ dito ay paghingi ng sagot o orakulo sa isang diyos; malinaw itong ipinahahayag ng “sumangguni.”
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Isinatinig ang pangalan ng diyos sa halip na isalin ang mga bahagi nito.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ang diyos ng Ekron
  rationale: Natural na ipinakikilala ang kaugnayan ng diyos sa lungsod ng Ekron.
- source_word: הַמִּטָּה
  choice: higaan
  rationale: Ang “higaan” ay kasalukuyan, malinaw, at angkop sa kalagayan ng maysakit.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: inakyat mo
  rationale: Pinananatili ang larawang paakyat ng Hebreo, bagaman ang literal na resumptive adverb na “roon” ay hindi na inuulit sa pangunahing teksto upang maging natural sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ang personal na banal na pangalan sa anyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Retorikal na tanong tungkol sa Diyos sa Israel
  choice: Dahil ba walang Diyos sa Israel
  alternative: Dahil ba sa kakulangan ng isang Diyos sa Israel
  rationale: Ang pangunahing salin ay natural at pinananatili ang bigat ng pagsaway, habang ang talababa ay nagpapakita ng mas pormal na alternatibo nang hindi binabago ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormulang propetiko, ang retorikal na pagsaway, at ang dobleng pautos, habang iniwasan ang makaluma o denominasyonal na pananalita.
