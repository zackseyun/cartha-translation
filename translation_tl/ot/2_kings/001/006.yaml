- from: 'Sinabi nila sa kanya, “May isang lalaking umahon upang salubungin kami. Sinabi niya sa amin, ‘Humayo kayo at bumalik sa haring nagsugo sa inyo. Sabihin ninyo sa kanya: Ganito ang sinabi ni Yahweh: “Dahil ba walang Diyos sa Israel[a] kaya nagpapadala ka upang sumangguni kay Baal-Zebub, ang diyos ng Ekron? Kaya hindi ka na bababa mula sa higaang inakyat mo[b], sapagkat tiyak na mamamatay ka.”’”'
  to: 'Sinabi nila sa kanya, “May isang lalaking dumating upang salubungin kami. Sinabi niya sa amin, ‘Humayo kayo at bumalik sa haring nagsugo sa inyo. Sabihin ninyo sa kanya: Ganito ang sabi ni Yahweh: “Dahil ba walang Diyos sa Israel[a] kaya nagpapadala ka upang sumangguni kay Baal-Zebub, ang diyos ng Ekron? Kaya hindi ka na bababa mula sa kama na hinigaan mo[b], sapagkat tiyak na mamamatay ka.”’”'
