id: 2KI.1.2
reference: 2 Kings 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: tl
  text: Nahulog si Ahazias sa pamamagitan ng sala-salang harang ng silid niya sa itaas, na nasa Samaria, at nagkasakit siya. Kaya nagsugo siya ng mga mensahero at sinabi sa kanila, “Pumunta kayo at sumangguni kay Baal-Zebub[a], ang diyos ng Ekron, kung gagaling pa ako sa sakit na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Zebub ang anyong Hebreo ng pangalan; ang mas huling anyong Beelzebub ay matatagpuan sa Griyego at sa ilang tradisyon ng pagsasalin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: Nahulog
  rationale: Tuwirang isinasalin ang payak na pandiwang nagsasalaysay ng pagkahulog.
- source_word: בְּעַד הַשְּׂבָכָה
  choice: sa sala-salang harang
  rationale: Ipinahihiwatig ng parirala ang pagdaan sa isang harang na yari sa magkakrus o sala-salang materyal. Pinananatili ng salin ang kongkretong larawan nang hindi ipinapalagay na tiyak na bintana iyon.
- source_word: עֲלִיָּתוֹ
  choice: silid niya sa itaas
  rationale: Ang עֲלִיָּה ay silid o kuwartong nasa mataas na bahagi ng gusali; malinaw at likas sa modernong Filipino ang pariralang ito.
- source_word: וַיָּחַל
  choice: nagkasakit siya
  rationale: Karaniwang nangangahulugan ang pandiwa na nagkasakit o nanghina. Bagaman bunga ito ng pagkahulog, hindi tuwirang nililimitahan ng Hebreo ang kalagayan sa pisikal na pinsala lamang, at tinatawag din itong חֳלִי, 'sakit,' sa hulihan ng talata.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo ng hari ang tinutukoy sa kontekstong ito, hindi mga anghel.
- source_word: דִרְשׁוּ
  choice: sumangguni
  rationale: Dito, ang דרשׁ ay paghingi ng sagot o pahayag mula sa isang diyos; natural na naihahayag ng 'sumangguni' ang relihiyosong konsultasyon.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Tinatapatan sa transliterasyon ang anyong Hebreo ng pangalan sa halip na gamitin ang mas huling anyong mula sa Griyego.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ang diyos ng Ekron
  rationale: Tuwirang ipinakikilala ng pariralang construct si Baal-Zebub bilang diyos na sinasamba sa Ekron.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: kung gagaling pa ako sa sakit na ito
  rationale: Literal na tumutukoy ang Hebreo sa kung mabubuhay siya mula sa sakit; sa Filipino, likas na ipinahahayag ang di-tiyak na paggaling bilang 'kung gagaling pa ako,' habang nananatili ang posibilidad na hindi siya mabuhay.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang modernong anyo sa Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Anyo ng pangalan ng paganong diyos
  choice: Baal-Zebub
  alternative: Beelzebub
  rationale: Baal-Zebub ang direktang anyo ng בַּעַל זְבוּב sa tekstong Hebreo. Ang Beelzebub ay mas huling anyong kilala mula sa Griyego at tradisyon, kaya inilalagay lamang ito sa talababa.
- issue: Kalagayan ni Ahazias matapos mahulog
  choice: nagkasakit siya
  alternative: nasaktan siya
  rationale: Maaaring kaugnay ng pinsalang dulot ng pagkahulog ang kalagayan, ngunit ang וַיָּחַל at ang kasunod na חֳלִי ay tahasang gumagamit ng pananalita tungkol sa pagkakasakit. Iniiwasan ng salin na paliitin ito sa pinsala lamang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang gamit. Pinili ang payak na ayos ng pangungusap at mga salitang madaling maunawaan, habang pinananatili ang sinaunang larawang 'sala-salang harang' at ang anyong Hebreo ng pangalan. Inilagay ang tandang [a] kaagad pagkatapos ng pangalang Baal-Zebub, sapagkat iyon ang tinatalakay ng talababa.
