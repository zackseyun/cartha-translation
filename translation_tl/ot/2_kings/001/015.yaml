base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: tl
  text: Sinabi ng anghel ni Yahweh kay Elias, “Bumaba kang kasama niya. Huwag kang matakot sa kanya.[a]” Kaya tumindig si Elias at bumaba kasama niya patungo sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “Huwag kang matakot mula sa harap niya,” ibig sabihin, huwag matakot dahil sa presensiya niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng sugo o anghel, ngunit ang “anghel” ang pinakanatural sa pormulang ito ng salaysay. Pinananatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino, na malinaw at pamilyar sa mga mambabasa.
- source_word: רֵד אוֹתוֹ
  choice: Bumaba kang kasama niya
  rationale: Ang pautos na רֵד ay “bumaba,” at ang אוֹתוֹ sa konstruksiyong ito ay nagpapahayag ng pagsama, hindi tuwirang layon.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: Huwag kang matakot sa kanya
  rationale: Natural nitong ipinahahayag sa Filipino ang utos na huwag matakot dahil sa presensiya o banta ng taong tinutukoy, habang inilalagay sa talababa ang mas literal na idyoma.
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Pinananatili ang kilos ng pagbangon bilang tugon bago bumaba si Elias, sa dignified ngunit nauunawaang salaysay.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: bumabang kasama niya patungo sa hari
  rationale: Pinananatili ang direksiyon ng pagbaba, ang pagsama sa lalaki, at ang hantungan na hari.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Hindi dinaragdagan ng salin ang ontolohikal na paliwanag tungkol sa tauhan; ginagamit lamang ang karaniwang salin ng terminong angkop sa kontekstong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bumaba kang kasama niya” at “matakot sa kanya” bilang likas na pananalita, habang pinanatili sa talababa ang konkretong Hebreong idyoma.
