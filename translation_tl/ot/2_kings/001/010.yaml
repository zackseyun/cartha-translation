    issue: Ang אִישׁ אֱלֹהִים ay isinaling “lingkod ng Diyos.”
    rationale: Ang literal na anyo at karaniwang biblikal na titulo ay “tao ng Diyos.” Ang “lingkod” ay ibang katawagan at nagdaragdag ng interpretatibong paglalapat na wala sa mismong Hebreong parirala.
