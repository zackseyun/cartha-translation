  to: Sumagot si Elias sa pinuno ng limampu, “Ngunit kung ako nga ay tao ng Diyos, nawa’y bumaba ang apoy mula sa langit at tupukin ka at ang limampung tauhan mo.” At bumaba ang apoy mula sa langit at tinupok siya at ang limampung tauhan niya.
  rationale: Pinalitan ang “lingkod ng Diyos” ng “tao ng Diyos” upang tapat na katawanin ang אִישׁ אֱלֹהִים nang hindi ipinapataw ang isang partikular na interpretasyon. Inayos din ang puwesto ng “nawa’y” para sa mas natural na Filipino, habang pinanatili ang retorikal na kondisyon, ang hindi-tahasang pagpapangalan ng tagaganap ng pagbaba ng apoy, at ang pag-uulit na nasa Hebreo.
