base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: tl
  text: Sumagot si Elias sa pinuno ng limampu, “Ngunit kung ako nga ay tao ng Diyos, nawa’y bumaba ang apoy mula sa langit at tupukin ka at ang limampung tauhan mo.” At bumaba ang apoy mula sa langit at tinupok siya at ang limampung tauhan niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: pinuno ng limampu
  rationale: Tuwirang inilalarawan ang opisyal na namumuno sa pangkat na limampung tauhan, nang hindi nag-aangkat ng di-tiyak na makabagong ranggong militar.
- source_word: אִישׁ אֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Sa kontekstong biblikal, ito ay titulo para sa propeta o taong itinalaga ng Diyos; mas natural sa modernong Tagalog kaysa literal na “tao ng Diyos,” habang pinananatili ang diwa ng katungkulan.
- source_word: תֵּרֶד
  choice: bumaba nawa
  rationale: 'Ipinahahayag ang jussive na pakiusap o hamon: “nawa’y bumaba,” hindi simpleng hula sa hinaharap.'
- source_word: וְתֹאכַל / וַתֹּאכַל
  choice: tupukin / tinupok
  rationale: Ang “tupukin” ang natural na gamit sa apoy na lumalamon o lubusang sumisira.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: limampung tauhan mo / niya
  rationale: Ang literal na “iyong/kanyang limampu” ay tumutukoy sa pangkat ng limampung kawal; idinagdag ang “tauhan” para sa malinaw at natural na Filipino.
theological_decisions:
- issue: Kondisyon sa pahayag ni Elias
  choice: “Ngunit kung ako nga ay lingkod ng Diyos”
  alternative: “Kung ako ay lingkod ng Diyos”
  rationale: Pinananatili ng “ngunit” ang waw na nag-uugnay at sumasalungat sa utos ng kapitan sa naunang talata; ang “nga” ay likas na Filipino na nagbibigay-diin sa kondisyong sinusubok nang hindi ito ginagawang pag-aalinlangan ni Elias.
- issue: Pagkilos ng apoy mula sa langit
  choice: Inilahad bilang aktuwal na pangyayari nang walang idinagdag na tahasang tagaganap
  alternative: “Nagpadala ang Diyos ng apoy”
  rationale: Sinasabi ng Hebreo na bumaba ang apoy mula sa langit ngunit hindi tahasang pinapangalanan sa sugnay ang Diyos bilang paksa; hindi idinagdag ang interpretasyong iyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling kondisyong retorikal at ang pag-uulit ng “mula sa langit.” Ginamit ang pangalang “Elias,” na karaniwang anyong Filipino ng Elijah.
