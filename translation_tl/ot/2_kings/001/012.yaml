base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: tl
  text: Sumagot si Elias at sinabi sa kanila, “Kung ako ay tao ng Diyos,[a] bumaba nawa ang apoy mula sa langit at tupukin ka at ang limampung tauhan mo.”[b] At bumaba mula sa langit ang apoy ng Diyos[c] at tinupok siya at ang limampung tauhan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung ako nga ang tao ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ikaw at ang iyong limampu,” na tumutukoy sa pangkat ng limampung lalaking pinamumunuan ng kapitan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “apoy mula sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Sumagot si Elias at sinabi sa kanila
  rationale: Pinananatili ang magkatambal na panimulang pandiwa ng salaysay at ang maramihang layon na “sa kanila,” habang gumagamit ng likas na modernong Tagalog.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Kung ako ay tao ng Diyos
  rationale: Pinananatili ang kinikilalang katawagan sa propeta nang hindi dinaragdagan ng paliwanag o doktrinal na kahulugan; ang talab ng kondisyong אִם ay malinaw sa “kung.”
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: bumaba nawa ang apoy mula sa langit
  rationale: Ang “nawa” ay naghahatid ng jussive o panawagang diwa, hindi lamang ng payak na hula.
- source_word: וְתֹאכַל
  choice: at tupukin
  rationale: Ang “tupukin” ang likas na salitang Tagalog para sa mapanirang pagkonsumo ng apoy at inuulit sa katuparan ang parehong pandiwang Hebreo.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: ka at ang limampung tauhan mo
  rationale: Pinananatili ang isahang tuwirang pakikipag-usap sa kapitan at nililinaw na ang “limampu” ay ang pangkat ng mga tauhang pinamumunuan niya.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: At bumaba mula sa langit ang apoy ng Diyos
  rationale: Isinasalin ang tahasang pag-uugnay ng אֵשׁ אֱלֹהִים sa Diyos at pinananatili ang pinagmulan nitong “mula sa langit.”
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: at tinupok siya at ang limampung tauhan niya
  rationale: Pinananatili ang pagkakatulad sa naunang panawagan at ang pagkakaiba ng kapitan sa pangkat niyang limampu.
theological_decisions:
- issue: Paglalahad sa titulong אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  alternative: ang tao ng Diyos
  rationale: Ang “tao ng Diyos” ay tuwirang nagpapanatili sa katawagang propetiko at sa predikatibong anyo ng Hebreo; inilalagay sa talababa ang maaaring tiyak na pagbasa upang hindi sapilitang lutasin ang himig ng pahayag.
- issue: Paglalahad sa אֵשׁ אֱלֹהִים
  choice: apoy ng Diyos
  alternative: apoy mula sa Diyos
  rationale: Tahasan nitong pinananatili ang pag-uugnay ng apoy sa Diyos nang hindi ipinapaliwanag ang paraan ng pangyayari; ang alternatibo ay maaaring magbigay-diin sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bumaba nawa” upang mapanatili ang panawagang diwa, “tupukin” para sa apoy, at “tauhan” upang maging malinaw ang pinaikling Hebreong “limampu.”
