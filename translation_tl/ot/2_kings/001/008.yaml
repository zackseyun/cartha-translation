base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Isang lalaking balbon[a], na may sinturong katad na nakabigkis sa kanyang baywang.” Sinabi niya, “Si Elias na Tisbita iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “isang lalaking nakasuot ng damit na yari sa balahibo.” Literal sa Hebreo: “isang lalaking may-ari ng buhok/balahibo,” kaya maaari itong tumukoy sa isang lalaking balbon o sa kanyang kasuotang yari sa balahibo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: lalaki
  rationale: Tumutukoy ito rito sa isang lalaking nasa hustong gulang at likas ang salin sa makabagong Tagalog.
- source_word: בַּעַל שֵׂעָר
  choice: lalaking balbon
  rationale: Literal itong ‘may-ari/panginoon ng buhok’ at maaaring maglarawan sa isang lalaking mabuhok. Posible ring tumukoy sa kasuotang yari sa balahibo, kaya pinanatili sa talababa ang tunay na kalabuan.
- source_word: וְאֵזוֹר עוֹר
  choice: na may sinturong katad
  rationale: Ang אֵזוֹר ay sinturon o bigkis, at ang עוֹר ay katad o balat; malinaw at natural ang ‘sinturong katad.’
- source_word: אָזוּר
  choice: nakabigkis
  rationale: Ang passive participle ay naglalarawan sa sinturong nakatali o nakasuot sa katawan; ang ‘nakabigkis’ ay marangal at malinaw sa konteksto.
- source_word: בְּמָתְנָיו
  choice: sa kanyang baywang
  rationale: Ang מָתְנַיִם ay tumutukoy sa bahagi ng baywang/balakang; ang ‘sa kanyang baywang’ ang natural na modernong salin.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elias na Tisbita
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalan at ang katawagang tumutukoy sa kanyang pinagmulan.
- source_word: הוּא
  choice: iyon
  rationale: Sa pagkilala sa taong inilalarawan, natural sa Tagalog ang hulma na ‘Si Elias na Tisbita iyon.’
