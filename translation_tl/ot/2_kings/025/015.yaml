  verdict: revise
  source_fidelity: Tumpak ang pangunahing mga sisidlan at ang pandiwang 'kinuha.' Gayunman, ang 'ayon sa ginto/pilak' ay hindi likas na paraan upang isalin ang Hebreong pag-uulit at maaaring magmukhang pamantayan o sukatan sa halip na pag-uuri ayon sa materyal. Mas tumpak at malinaw ang 'mga yari sa ginto' at 'mga yari sa pilak,' habang ipinapaliwanag ng talababa ang inuulit na mga salitang Hebreo.
  naturalness: Ang binagong ayos ay mas likas sa makabagong Filipino. Ang 'mga tanod' ay isang mas tuwirang natural na katumbas ng 'guard' kaysa 'mga bantay' sa opisyal na titulo.
  terminology: 'Pinanatili ang ''mga kawali para sa baga'' at ''mga mangkok,'' na angkop sa mga sisidlang pang-templo. Inayos ang alternatibong tala para sa רַב־טַבָּחִים: ang ''mga tagapuksa'' ay masyadong malayo sa literal na saklaw; ang ''mga tagapagpatay'' ay mas malapit sa ''executioners.'''
