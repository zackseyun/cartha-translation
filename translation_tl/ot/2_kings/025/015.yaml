    rationale: Ang רַב טַבָּחִים ay literal na may kaugnayan sa mga tagapagpatay/slaughterers at, bilang titulo, sa pinuno ng bantay o bodyguard. Ang 'tagapuksa' ay nagpapahiwatig ng maninira at hindi ang leksikal na kahulugan.
