- from: At ang mga kawali para sa baga[a] at ang mga mangkok[b]—ang yari sa ginto, ayon sa ginto, at ang yari sa pilak, ayon sa pilak[c]—ay kinuha ng pinuno ng mga bantay.[d]
  to: Kinuha ng pinuno ng mga tanod[d] ang mga kawali para sa baga[a] at mga mangkok[b]—ang mga yari sa ginto at ang mga yari sa pilak[c].
  rationale: Inalis ang idyomang 'ayon sa,' na hindi likas at maaaring magbago ng diin, at pinalitan ng malinaw na pag-uuri sa mga bagay na yari sa ginto at pilak. Pinanatili ng talababa ang mahalagang Hebreong pag-uulit. Inayos din ang opisyal na titulo at ang alternatibong tala nito upang maging mas tumpak sa saklaw ng Hebreo nang hindi nagpapataw ng partikular na pagbasa.
