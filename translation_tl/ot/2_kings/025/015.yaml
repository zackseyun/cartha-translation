base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: tl
  text: Kinuha ng pinuno ng mga tanod[d] ang mga kawali para sa baga[a] at mga mangkok[b]—ang mga yari sa ginto at ang mga yari sa pilak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga insensaryo.”
    reason: lexical_alternative
  - marker: b
    text: O “mga palanggana.”
    reason: lexical_alternative
  - marker: c
    text: 'Inuulit sa Hebreo ang mga salitang tumutukoy sa materyal: “ang yari sa ginto, ginto, at ang yari sa pilak, pilak.” Idinidiin nito ang pag-uuri ayon sa materyal.'
    reason: lexical_alternative
  - marker: d
    text: O “pinuno ng mga tagapagpatay” o “kumandante ng mga tanod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: mga kawali para sa baga
  rationale: Tumutukoy ang מַחְתָּה sa sisidlang ginagamit sa pagdadala ng baga sa paglilingkod sa templo. Malinaw ito sa makabagong Filipino at hindi nito ipinapalagay na insenso lamang ang gamit.
- source_word: הַמִּזְרָקוֹת
  choice: mga mangkok
  rationale: Ang מִזְרָק ay sisidlang ginagamit para sa likido o sa ritwal na pagwiwisik. Likas at malawak ang 'mangkok'; maaari rin ang 'mga palanggana.'
- source_word: אֲשֶׁר זָהָב זָהָב
  choice: ang yari sa ginto, ayon sa ginto
  rationale: Pinananatili ng pariralang ito ang di-karaniwang pag-uulit at pag-uuri ayon sa materyal, ngunit ginagawa itong mauunawaan sa Filipino.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: at ang yari sa pilak, ayon sa pilak
  rationale: Kaagapay ng parirala tungkol sa ginto, pinananatili nito ang pag-uulit na nagdidiin sa pag-uuri ayon sa materyal.
- source_word: לָקַח
  choice: kinuha
  rationale: Ito ang tuwirang kahulugan ng pandiwa; ipinahihiwatig na ng konteksto ang pagkuha bilang samsam nang hindi iyon idinaragdag sa teksto.
- source_word: רַב טַבָּחִים
  choice: pinuno ng mga bantay
  rationale: Gumaganap ito bilang opisyal na titulong Babilonio. Ang saling ito ay natural at hindi labis na literal, habang ang ibang posibleng kahulugan ay inilalagay sa talababa.
