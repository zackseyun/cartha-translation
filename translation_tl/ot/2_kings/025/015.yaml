    rationale: Ang Hebreo ay inuulit ang mga katawagan para sa ginto at pilak upang ipakita ang pagkakategorya ayon sa materyal, hindi upang ipahayag ang isang pamantayan na 'ayon sa' materyal.
  - severity: medium
