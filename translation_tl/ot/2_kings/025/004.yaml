    issue: Maluwag ang pagkakaugnay ng “sa tabi ng hardin ng hari.”
    rationale: Sa Hebreo, ang pariralang ito ay tumutukoy sa pintuan. Ang paggamit ng kamag-anak na “na nasa tabi” ay nag-aalis ng posibleng kalabuan sa Tagalog.
