base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: tl
  text: Nabutas ang pader ng lungsod, at tumakas sa gabi ang lahat ng mandirigma sa pamamagitan ng pintuang nasa pagitan ng dalawang pader, na nasa tabi ng hardin ng hari, habang nakapalibot sa lungsod ang mga Caldeo[a]. Dumaan ang hari[b] sa daang patungo sa Araba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mga Babilonio.” “Mga Caldeo” ang tiyak na katawagan sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “dumaan siya.” Hindi tahasang binanggit sa Hebreo ang simuno; ipinahihiwatig ng konteksto na ito ang hari.
    reason: lexical_alternative
  - marker: c
    text: Ang Araba ay ang rehiyon ng lambak sa kahabaan ng Jordan at patimog nito; ayon sa tradisyon, isinasalin din itong “kapatagan.”
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: Nang mabutas ang pader ng lungsod
  rationale: Literal na ang lungsod ang ‘nabiyak’ o ‘nabutas,’ ngunit sa konteksto ng pagkubkob, metonimiya ito para sa pagkakaroon ng butas o lagusan sa depensa ng lungsod. Ang pagbanggit sa pader ay likas at malinaw sa modernong Tagalog.
- source_word: וְכָל אַנְשֵׁי הַמִּלְחָמָה
  choice: tumakas ... ang lahat ng mandirigma
  rationale: Ang parirala ay literal na ‘lahat ng mga lalaki ng digmaan.’ Walang tahasang pandiwa rito sa Hebreo, ngunit hinihingi ng pangungusap at konteksto ang kilos ng pagtakas. Ang ‘mandirigma’ ay natural at marangal na katumbas.
- source_word: הַלַּיְלָה
  choice: sa gabi
  rationale: Ginagamit itong pang-abay na tumutukoy sa oras ng pagtakas.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: sa daan ng pintuang nasa pagitan ng dalawang pader
  rationale: Pinananatili ang diin sa ruta at ang dual na anyo ng ‘mga pader,’ na tahasang tumutukoy sa dalawa.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: sa tabi ng hardin ng hari
  rationale: Ang עַל ay nagpapahiwatig dito ng kalapitan; natural sa Tagalog ang ‘sa tabi ng.’
- source_word: וְכַשְׂדִּים
  choice: ang mga Caldeo
  rationale: Pinananatili ang tiyak na katawagang etniko ng tekstong Hebreo sa halip na palitan ito agad ng ‘mga Babilonio.’
- source_word: עַל הָעִיר סָבִיב
  choice: nakapalibot sa lungsod
  rationale: Malinaw nitong ipinahahayag ang ganap na pagkubkob na nasa סביב nang hindi nagiging paulit-ulit sa Tagalog.
- source_word: וַיֵּלֶךְ
  choice: nagpunta ang hari
  rationale: Hindi tahasang binanggit sa Hebreo ang simuno ng pandiwang isahan. Ipinahihiwatig ng konteksto na ang hari ang tinutukoy, kaya isinasaad siya sa salin habang itinatala sa talababa ang pagiging implicit nito.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: sa daang patungo sa Araba
  rationale: Ang Araba ay pangalang heograpiko, hindi lamang karaniwang ‘kapatagan.’ Ang ‘patungo’ ay natural na nagpapahayag ng rutang tinahak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa salaysay. Ginamit ang ‘Caldeo’ at ‘Araba’ upang mapanatili ang mga tiyak na katawagang nasa pinagmulan, kalakip ang maiikling paliwanag sa talababa. Ang pandiwang ‘tumakas’ ay ipinahiwatig ng putol na konstruksiyon at ng konteksto, samantalang ang implicit na simunong ‘hari’ ay ginawang tahasan para sa linaw.
