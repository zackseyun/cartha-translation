  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: tl
  text: Ngunit nag-iwan ang pinuno ng mga bantay[a] ng ilan sa pinakamahihirap na mamamayan ng lupain upang mag-alaga ng mga ubasan at magtrabaho sa bukid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “pinuno ng mga tagapatay.” Sa kontekstong ito, tumutukoy ang titulo sa Babiloniang pinuno ng mga bantay.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “magsaka” o “mag-araro.” Malamang na malawak ang tinutukoy ng salitang Hebreo: mga manggagawang nagbubungkal ng lupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  choice: Ngunit ... ng ilan sa pinakamahihirap na mamamayan ng lupain
  rationale: Ang וּ ay nagpapakita rito ng pagsalungat sa naunang pagpapatapon kaya natural ang “Ngunit.” Ang מִן ay partitive, at ang דַּלַּת הָאָרֶץ ay tumutukoy sa pinakamahihirap o pinakamababang uri ng mga naninirahan sa Juda. Idinagdag ang “ilan” sapagkat ipinahihiwatig ng Hebreo na bahagi lamang sa kanila ang iniwan.
- source_word: הִשְׁאִיר
  choice: nag-iwan
  rationale: Ang Hiphil ng שׁאר ay nangangahulugang mag-iwan o hayaang manatili. Ang “nag-iwan” ay tuwiran at natural sa salaysay.
- source_word: רַב טַבָּחִים
  choice: pinuno ng mga bantay
  rationale: Bagaman literal na kaugnay ng “pinuno ng mga tagapatay,” isa itong opisyal na titulong militar sa kontekstong Babilonia. Ang “pinuno ng mga bantay” ay malinaw at hindi mapanlinlang na literal.
- source_word: לְ/כֹרְמִים
  choice: upang mag-alaga ng mga ubasan
  rationale: Ang כֹּרְמִים ay mga manggagawa o tagapag-alaga ng ubasan. Ang pandiwang parirala ay mas natural sa modernong Tagalog kaysa sa isang bihirang katawagang panghanapbuhay.
- source_word: וּ/לְ/יֹגְבִים
  choice: at magtrabaho sa bukid
  rationale: Ang יֹגְבִים ay malamang na tumutukoy sa mga manggagawang nagsasaka o gumagawa sa lupa. Pinananatili ng “magtrabaho sa bukid” ang malawak na diwa nang hindi ito nililimitahan sa pag-aararo lamang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mamamayan ng lupain” upang linawin na mga tao, hindi abstraktong kahirapan, ang iniwan; nananatili ang partitive na diwa sa “ilan sa.”
