base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: tl
  text: Noong ikatatlumpu’t pitong taon ng pagkakatapon ni Jehoiakin na hari ng Juda, sa ikalabindalawang buwan, sa ikadalawampu’t pitong araw ng buwan, itinaas ni Evil-merodac[b] na hari ng Babilonia, sa taon ng kanyang paghahari[c], ang ulo ni Jehoiakin na hari ng Juda[a] mula sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idyomang Hebreo ang “itinaas ang ulo,” na nangangahulugang itinaas ang katayuan ni Jehoiakin o pinakitaan siya ng pabor, na nagsimula sa pagpapalaya sa kanya mula sa bilangguan.
    reason: lexical_alternative
  - marker: b
    text: Si Evil-merodac ay kilala rin sa kasaysayan bilang Amel-Marduk.
    reason: cultural_note
  - marker: c
    text: Ang “sa taon ng kanyang paghahari” ay maaari ring mangahulugang “sa unang taon ng kanyang paghahari.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari ito
  rationale: Ipinahahayag ang Hebreong panimulang pormula sa salaysay sa natural na modernong Tagalog. Inilipat sa hulihan ang sugnay upang hindi maging labis na mabigat ang mahabang pormula ng petsa sa simula.
- source_word: לְגָלוּת
  choice: ng pagkakatapon kay
  rationale: Ang גָּלוּת ay tumutukoy sa pagpapatapon o kalagayan ng pagiging ipinatapon; malinaw sa Tagalog na ang pagbibilang ng mga taon ay mula sa pagkakatapon kay Jehoiakin.
- source_word: יְהוֹיָכִין
  choice: Jehoiakin
  rationale: Karaniwang anyong ginagamit sa mga saling Bibliya sa Filipino para sa pangalang Hebreo.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: sa ikalabindalawang buwan
  rationale: Natural na katumbas sa Tagalog ng pormula ng petsa.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: sa ikadalawampu’t pitong araw ng buwan
  rationale: Malinaw at likas na pagpapahayag ng tiyak na araw sa buwan.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Evil-merodac
  rationale: Pinananatili ang nakaugaliang biblikal na anyo ng pangalan; ibinibigay sa talababa ang makasaysayang anyong Akkadiano.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: sa taon ng paghahari ni Evil-merodac
  rationale: Pinananatili ang di-tiyak na literal na diwa ng parirala at hindi ipinapalagay sa pangunahing teksto na ito ang unang taon.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: itinaas ... ang ulo ni
  rationale: Pinananatili ang matingkad na idyomang Hebreo at ipinaliliwanag sa talababa ang kahulugan nitong pagpaparangal o pagpapakita ng pabor na kaugnay ng paglaya.
- source_word: מִבֵּית כֶּלֶא
  choice: mula sa bilangguan
  rationale: Direkta, malinaw, at natural na katumbas ng lugar ng pagkakakulong.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang idyomang Hebreo sa pangunahing teksto upang huwag mawala ang larawan at posibleng lawak ng kahulugan nito; nilinaw ito sa talababa. Ang mahabang petsa ay nananatiling nasa unahan, samantalang ang panimulang pormulang וַיְהִי ay likas na inihayag bilang pangwakas na “Nangyari ito.”
