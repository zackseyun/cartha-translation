  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: tl
  text: Tinupok niya sa apoy ang bahay ni Yahweh[a], ang bahay ng hari, ang lahat ng bahay sa Jerusalem, at ang bawat malaking bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “templo ni Yahweh.” Sa Hebreo: “bahay ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: O “bawat mahalagang bahay.” Ang salitang Hebreo ay maaaring tumukoy sa mga bahay na kapansin-pansin dahil sa laki o kahalagahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף ... שָׂרַף בָּאֵשׁ
  choice: Tinupok niya sa apoy
  rationale: Pinagsama sa likas na ayos ng Tagalog ang pambungad na pandiwang ‘sinunog’ at ang pangwakas na pagbanggit sa pagsunog sa apoy. Ang ‘tinupok sa apoy’ ay malinaw, marangal, at nagpapanatili sa diin ng Hebreo sa ganap na pagsunog.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang ‘bahay ni Yahweh’ sa halip na agad itong ipakahulugang ‘templo.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: ang bahay ng hari
  rationale: Pinananatili ang pagkakapantay ng parirala sa ‘bahay ni Yahweh’; ang ‘palasyo’ ay tamang paliwanag sa konteksto ngunit mas interpretibo.
- source_word: כָּל בָּתֵּי יְרוּשָׁלַםִ
  choice: ang lahat ng bahay sa Jerusalem
  rationale: Natural sa modernong Tagalog ang ‘sa Jerusalem’ at malinaw na tumutukoy sa mga bahay na nasa lungsod.
- source_word: כָּל בֵּית גָּדוֹל
  choice: ang bawat malaking bahay
  rationale: Ang ‘malaki’ ang pinakasimple at kongkretong katumbas ng גָּדוֹל, habang inilalahad sa talababa ang posibilidad na katanyagan o kahalagahan ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa titulong ‘Panginoon’ nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Pagkilala sa בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang ‘bahay’ ang pormal na katumbas ng Hebreo at nagpapanatili sa metapora; ang ‘templo’ ay kontekstuwal na paglilinaw lamang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang pag-uulit ng ‘bahay’ upang maipakita ang paralelismo ng Hebreo, at ginamit ang ‘tinupok sa apoy’ upang natural na maisama ang tahasang pagbanggit sa apoy.
