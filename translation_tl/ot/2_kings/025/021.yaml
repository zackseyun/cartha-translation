base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: tl
  text: Sinaktan sila ng hari ng Babilonia at pinatay niya sila sa Ribla, sa lupain ng Hamat.[a] Kaya dinala sa pagkabihag ang Juda mula sa lupain nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Pinabagsak sila at pinatay.” Magkasunod na ginagamit ng Hebreo ang dalawang pandiwa: “sinaktan/pinabagsak” at “pinatay.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, mas malapit sa aktibong anyo ng Hebreo, “Lumisan ang Juda mula sa lupain nito tungo sa pagkabihag.” Itinatampok ng “dinala sa pagkabihag” ang sapilitang pagpapatapon na ipinahihiwatig ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ אֹתָם
  choice: Pinabagsak sila
  rationale: Pinananatili nito ang hiwalay na marahas na kilos ng נכה bago ang kasunod na tahasang pagpapapatay, sa halip na pagsamahin ang dalawang pandiwa bilang iisang “pinatay.”
- source_word: וַיְמִיתֵם
  choice: at ipinapatay
  rationale: Ang Hiphil ng מות ay may diwang sanhi, “pinangyaring mamatay” o “ipinapatay.” Ang anyong ito ay malinaw at angkop sa utos ng isang hari nang hindi ipinapalagay ang tiyak na paraan ng pagpatay.
- source_word: מֶלֶךְ בָּבֶל
  choice: ang hari ng Babilonia
  rationale: Likas at tuwirang salin ng pariralang construct sa modernong Tagalog.
- source_word: בְּרִבְלָה
  choice: sa Ribla
  rationale: Karaniwang gamit ng “sa” para sa lugar na pinangyarihan ng kilos.
- source_word: בְּאֶרֶץ חֲמָת
  choice: sa lupain ng Hamat
  rationale: Pinananatili ang heograpikong parirala at ang pangalang pantangi nang malinaw at marangal.
- source_word: וַיִּגֶל
  choice: ipinatapon
  rationale: Ipinahahayag nito ang sapilitang pagdadala sa pagkabihag na ipinahihiwatig ng konteksto, habang inilalahad sa talababa ang posibleng mas aktibong anyo ng pandiwang Hebreo.
- source_word: יְהוּדָה
  choice: ang Juda
  rationale: Pinananatili ang maikli at metonimikong pagtukoy ng Hebreo, na maaaring tumukoy sa bayan o sa mga mamamayan nito.
- source_word: מֵעַל אַדְמָתוֹ
  choice: mula sa lupain nito
  rationale: Sa konteksto ng pagpapatapon, ang “lupain” ang likas na katumbas ng אֲדָמָה; ang “nito” ay tumutukoy sa Juda nang hindi nililinaw nang higit sa teksto kung bayan o mamamayan ang nasa isip.
theological_decisions:
- issue: Kung aktibo o pasibo ang paglalarawan sa pagpapatapon ng Juda
  choice: ipinatapon ang Juda
  alternative: napatapon ang Juda / lumisan sa pagkabihag ang Juda
  rationale: Pinili ang pasibong anyo upang idiin ang sapilitang deportasyon sa konteksto, ngunit hindi itinatago ang posibilidad na isalin ang pandiwang Hebreo sa mas aktibo o intransitibong paraan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang dalawang magkasunod na pandiwa para sa marahas na pagpatay at ang maikling metonimikong “Juda,” habang inilagay sa talababa ang tunay na kalabuan sa anyo ng pandiwa para sa pagpapatapon.
