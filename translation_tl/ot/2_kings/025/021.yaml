  source_fidelity: 'Kailangang panatilihin nang malinaw ang dalawang magkasunod na pandiwang Hebreo: sinaktan/struck (וַיַּךְ) at pinatay/put to death (וַיְמִיתֵם). Ang “ipinapatay” ay maaaring mangahulugang nag-utos na ipapatay at may di-angkop na aspektong di-ganap sa pangungusap; mas tumpak at natural dito ang “pinatay niya sila.” Para sa וַיִּגֶל, ang “dinala sa pagkabihag” ay wastong nagpapahiwatig ng sapilitang deportasyon sa konteksto nang hindi ginagawang mas tiyak ang Hebreo kaysa kailangan.'
