  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: tl
  text: Ipinatapon ni Nebuzaradan, na kapitan ng mga bantay,[a] ang nalabi sa mga taong natira sa lungsod, ang mga tumalikod at pumanig sa hari ng Babilonia,[b] at ang nalabi sa karamihan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinuno ng mga tagapatay”; malamang na opisyal na titulo ito para sa kumander ng bantay ng hari.
    reason: cultural_note
  - marker: b
    text: Sa literal, “ang mga bumagsak sa hari ng Babilonia”; sa kontekstong ito, tumutukoy ito sa mga tumalikod o lumipat ng panig sa kaniya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang nalabi sa maraming tao” o “ang nalabi sa populasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: ang nalabi sa mga taong naiwan
  rationale: Pinananatili ang diwa ng mga natira matapos ang pagkubkob at mga naunang pagpatay o pagpapatapon, habang natural ang pagkakabuo sa modernong Tagalog.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang lokatibong salin; ang tinutukoy sa konteksto ay Jerusalem.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל
  choice: ang mga tumakas at pumanig sa
  rationale: Sa kontekstong militar at pampolitika, ang idyoma ay tumutukoy sa pagtalilis o pagpanig sa kabilang hari, hindi sa literal na pagkahulog.
- source_word: הַמֶּלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang salin ng pariralang tumutukoy sa hari ng Babilonia.
- source_word: יֶתֶר הֶהָמוֹן
  choice: ang nalabi sa karamihan
  rationale: Pinananatili ang malawak at hindi tiyak na kolektibong kahulugan ng הָמוֹן nang hindi nililimitahan ito sa isang tiyak na uri ng tao.
- source_word: הֶגְלָה
  choice: ipinatapon
  rationale: Malinaw at natural na ipinahahayag ang sapilitang pagdadala sa ibang lupain na nasa Hiphil ng גלה.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog na salin ng Bibliya.
- source_word: רַב טַבָּחִים
  choice: kapitan ng mga bantay
  rationale: Isinasalin ayon sa tungkulin ng opisyal na titulong Babilonio; ang lubhang literal na salin ay maaaring magbigay ng maling pagkaunawa sa modernong mambabasa.
