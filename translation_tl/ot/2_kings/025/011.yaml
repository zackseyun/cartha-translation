  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Inilagay ang pandiwang “Ipinatapon” sa unahan para sa malinaw na daloy, at pinanatili ang malawak na kahulugan ng “karamihan” sa huling parirala. Ang mga panandang talababa ay nakalagay agad sa mga salitang kanilang ipinapaliwanag.
