revisions:
- from: Ipinatapon ni Nebuzaradan, na kapitan ng mga bantay,[a] ang nalabi sa mga taong naiwan sa lungsod, ang mga tumakas at pumanig sa hari ng Babilonia,[b] at ang nalabi sa karamihan.[c]
  to: Ipinatapon ni Nebuzaradan, na kapitan ng mga bantay,[a] ang nalabi sa mga taong natira sa lungsod, ang mga tumalikod at pumanig sa hari ng Babilonia,[b] at ang nalabi sa karamihan.[c]
  rationale: Pinalitan ang “mga tumakas” ng “mga tumalikod” upang maipahayag ang militar-politikal na idyoma ng Hebreo bilang pagtalikod at pagpanig sa hari ng Babilonia, nang hindi nagdaragdag ng isang hiwalay na kilos na wala sa teksto. Ginawang “mga taong natira” ang unang parirala para sa bahagyang mas tuwiran at natural na Tagalog. Napanatili ang lahat ng talababa at ang kanilang mga pananda sa mga kaugnay na parirala.
