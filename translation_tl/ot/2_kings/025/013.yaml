base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: tl
  text: At pinagpira-piraso ng mga Caldeo[b] ang mga haliging bronse na nasa bahay ni Yahweh, ang mga patungan[a], at ang dagat na bronse na nasa bahay ni Yahweh, at dinala nila sa Babilonia ang bronse ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tuntungan.” Ang mga ito ang mga estrukturang sumusuporta sa mga hugasan sa templo.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga Caldeo” ay tumutukoy rito sa mga puwersang Babilonio.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: mga haliging bronse
  rationale: Ang עַמּוּדִים ay mga haligi, at ang נְחֹשֶׁת sa konteksto ng mga kagamitang metal sa templo ay angkop na isaling “bronse.”
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: na nasa bahay ni Yahweh
  rationale: Walang tahasang pandiwa ang pariralang Hebreo; ipinahihiwatig ng konteksto ang kinaroroonan. Pinananatili ng “bahay” ang karaniwang larawan ng בֵּית habang natural sa Filipino.
- source_word: הַמְּכֹנוֹת
  choice: mga patungan
  rationale: Tumutukoy ang מְכֹנוֹת sa mga estrukturang sumusuporta sa mga hugasan sa templo. Malinaw at likas sa Filipino ang “mga patungan”; inilalagay sa talababa ang “mga tuntungan” bilang posibleng salin.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Dagat na bronse
  rationale: Literal na “dagat” ang יָם at ito ang natatanging tawag sa malaking sisidlan sa templo. Ang malaking titik ay nagpapakitang pangalan ito ng isang partikular na kagamitan.
- source_word: שִׁבְּרוּ
  choice: pinagpira-piraso
  rationale: Ipinahihiwatig ng שׁבר dito ang pagdurog o paghahati sa malalaking kagamitang bronse upang madala ang metal.
- source_word: כַשְׂדִּים
  choice: mga Caldeo
  rationale: Direktang pinananatili ang katawagang etniko sa Hebreo; nililinaw sa talababa na tumutukoy ito rito sa mga puwersang Babilonio.
- source_word: וַיִּשְׂאוּ אֶת נְחֻשְׁתָּם בָּבֶלָה
  choice: dinala nila sa Babilonia ang bronse ng mga iyon
  rationale: Likas na ipinapahayag sa Filipino ang pagdadala patungo sa Babilonia. Ang “ng mga iyon” ay malinaw na tumutukoy sa mga kagamitang pinagpira-piraso at iniiwasang ipakahulugang bronse ng mga Caldeo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang larawan ng tekstong Hebreo, samantalang ang ayos ng mga sugnay ay bahagyang inayos para sa likas na daloy sa Filipino. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinutukoy ng bawat tala.
