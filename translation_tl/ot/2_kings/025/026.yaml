base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: tl
  text: Pagkatapos, tumindig ang buong bayan—mula sa pinakamababa hanggang sa pinakadakila[a]—pati ang mga pinuno ng mga hukbo[b], at pumunta sila sa Ehipto dahil natakot sila sa mga Caldeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa maliit hanggang sa malaki”; maaaring tumukoy sa lahat anuman ang katayuan, kahalagahan, o edad.
    reason: lexical_ambiguity
  - marker: b
    text: Maaari ring “mga opisyal ng hukbo” o “mga pinuno ng mga pangkat ng kawal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Ipinahahayag ng Qal wayyiqtol ng קום ang tiyak na pagkilos ng bayan sa daloy ng salaysay. Pinananatili ng “tumindig” ang larawan ng pagbangon upang kumilos nang hindi ito nililimitahan sa literal na pagtayo o agad na pinapakahulugang pag-alis.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Likas sa modernong Filipino ang “buong bayan” bilang kolektibong pagtukoy sa lahat ng taong naroon, at pinananatili nito ang saklaw ng pariralang Hebreo.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa pinakamababa hanggang sa pinakadakila
  rationale: Isa itong idyoma ng kabuuan na maaaring tumukoy sa katayuan o kahalagahan, hindi lamang sa edad o pisikal na laki. Ang salin ay natural at malawak ang saklaw, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: pati ang mga pinuno ng mga hukbo
  rationale: Ang שָׂרִים ay mga pinuno o opisyal, at ang חֲיָלִים sa kontekstong ito ay mga puwersang militar. Nililinaw ng “pati” na kasama silang binanggit bukod sa buong bayan.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: at pumunta sila sa Ehipto
  rationale: Bagaman madalas na “dumating” ang literal na diwa ng בוא, mas angkop sa pananaw ng tagapagsalaysay ang “pumunta” sa Filipino.
- source_word: כִּי
  choice: dahil
  rationale: Nagpapakilala ito ng dahilan ng kanilang pagpunta sa Ehipto; malinaw at pangkaraniwan sa kasalukuyang Filipino ang “dahil.”
- source_word: יָרְאוּ מִפְּנֵי כַשְׂדִּים
  choice: natakot sila sa mga Caldeo
  rationale: Sa pagsama ng ירא at מִפְּנֵי, ang likas na Filipino ay “matakot sa.” Pinanatili ang “mga Caldeo” bilang kinikilalang makasaysayang tawag sa pangkat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Iniwasan ang mga makalumang anyo gaya ng “nagsitindig,” ngunit pinanatili ang maikli at sunod-sunod na kilos ng salaysay. Inilipat ang talababa tungkol sa mga pinunong militar sa mismong pariralang tinutukoy nito.
