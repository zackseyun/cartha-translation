  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: tl
  text: At nagpalit siya ng damit na pambilanggo, at palagi siyang kumakain sa harap ng hari[a] sa lahat ng araw ng kanyang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa presensya ng hari”; maaari ring ipahiwatig ng parirala na kumakain siya sa hapag ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: at nagpalit siya
  rationale: Ang piel ng שׁנה ay nangangahulugang ‘magpalit’ o ‘magbago.’ Sa kaugnayan nito sa kasuotang pambilanggo, likas sa Tagalog ang ‘nagpalit siya’ at ipinahihiwatig na hindi na niya isinuot ang dating kasuotan.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: kanyang damit-pambilanggo
  rationale: Tumutukoy ang parirala sa kasuotang kaugnay ng kanyang pagkabilanggo. Ang ‘damit-pambilanggo’ ay maikli, malinaw, at natural sa makabagong Tagalog.
- source_word: וְאָכַל לֶחֶם
  choice: at ... siyang kumakain
  rationale: Ang literal na ‘kumain ng tinapay’ ay isang Hebreong idyoma para sa regular na pagkain. Hindi na isinama ang ‘tinapay’ upang hindi magbigay ng maling impresyong tinapay lamang ang kinakain; naipapahayag ng ‘kumakain’ ang kahulugan ng idyoma.
- source_word: תָּמִיד
  choice: palagi
  rationale: Ipinapahayag ng תמיד ang nagpapatuloy o regular na gawain. Ang ‘palagi’ ay malinaw at natural sa Tagalog.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Ito ang malapit na katumbas ng literal na ‘sa harap niya’ at pinananatili ang mas malawak na pahayag ng Hebreo sa halip na tahasang gawing ‘sa hapag ng hari.’
- source_word: כָּל יְמֵי חַיָּיו
  choice: habang siya'y nabubuhay
  rationale: Natural na Tagalog ito para sa Hebreong idyomang ‘sa lahat ng araw ng kanyang buhay’ at pinananatili ang diwa ng patuloy na kalagayan hanggang kamatayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga panghalip ng Hebreo upang hindi tahasang tukuyin ang mga antecedent na hindi inuulit sa talata. Inilipat ang panandang talababa sa ‘sa harap niya,’ na siyang pariralang tinatalakay ng talababa.
