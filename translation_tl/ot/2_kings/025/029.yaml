- from: At nagpalit siya ng kanyang damit-pambilanggo, at palagi siyang kumakain sa harap niya[a] habang siya'y nabubuhay.
  to: At nagpalit siya ng damit na pambilanggo, at palagi siyang kumakain sa harap ng hari[a] sa lahat ng araw ng kanyang buhay.
  rationale: 'Nilinaw ang tinutukoy ng panghalip sa pariralang לְפָנָיו sa pamamagitan ng “ng hari,” sapagkat malinaw ang antecedent nito sa konteksto at kailangan ito para sa natural na Tagalog. Pinalitan ang tambalang “damit-pambilanggo” ng mas karaniwang “damit na pambilanggo,” at isinalin nang mas malapit ang pangwakas na idyoma bilang “sa lahat ng araw ng kanyang buhay.” Nananatiling maingat ang talababa: ibinibigay nito ang alternatibong “sa presensya” at ang posibleng implikasyon ng hapag ng hari nang hindi ito ipinipilit sa pangunahing teksto.'
