  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: tl
  text: Mabuti ang pakikitungo niya kay Jehoiachin[a] at inilagay niya ang trono ni Jehoiachin nang mas mataas kaysa sa mga trono ng mga haring kasama niya sa Babilonia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nagsalita siya ng mabubuting bagay sa kanya,” isang idyomang nangangahulugang kinausap niya siya nang may kabaitan o pabor.'
    reason: lexical_alternative
  - marker: b
    text: Ang “trono” ay maaari ring unawain bilang konkretong “upuan.” Ang diwa ay binigyan si Jehoiachin ng ranggong mas mataas kaysa sa ibang mga haring nasa Babilonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Magiliw siyang kinausap nito
  rationale: Ang literal na “nagsalita ng mabubuting bagay sa kanya” ay isang idyomang tumutukoy sa mabait o kanais-nais na pakikipag-usap. Ang “magiliw siyang kinausap” ay likas sa modernong Filipino; nililinaw ng “nito” na ang hari ng Babilonia ang gumagawa ng kilos.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: inilagay ang kanyang trono
  rationale: Sa konteksto, ang נתן ay tumutukoy sa pagtatalaga o paglalagay ng upuan at katayuang maharlika, hindi sa pagreregalo ng isang trono.
- source_word: כִּסְאוֹ
  choice: ang kanyang trono
  rationale: Maaaring tumukoy ang כִּסֵּא sa konkretong upuan, ngunit pinananatili ng “trono” ang maharlikang larawan at ang pahiwatig ng ranggo.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: sa mataas na kalagayan kaysa sa mga trono ng mga hari
  rationale: Ang מֵעַל ay nagpapahiwatig ng pagiging mas mataas sa puwesto o ranggo. Ang “sa mataas na kalagayan kaysa” ay natural sa Filipino at ipinakikitang ang paghahambing ay tungkol sa karangalang ipinagkaloob; ginawang maramihan ang “mga trono” ayon sa dami ng mga hari sa konteksto.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: mga haring kasama nito
  rationale: Tuwirang isinasalin ang pariralang tumutukoy sa ibang mga haring nasa piling ng hari ng Babilonia.
- source_word: בְּבָבֶל
  choice: sa Babilonia
  rationale: Karaniwang salin sa Filipino ng lokatibong pangalan ng lugar.
