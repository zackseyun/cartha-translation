revisions:
- from: Magiliw siyang kinausap nito[a] at inilagay ang kanyang trono sa mataas na kalagayan kaysa sa mga trono ng mga haring kasama nito sa Babilonia.[b]
  to: Mabuti ang pakikitungo niya kay Jehoiachin[a] at inilagay niya ang trono ni Jehoiachin nang mas mataas kaysa sa mga trono ng mga haring kasama niya sa Babilonia.[b]
  rationale: Ginawang malinaw ang mga referent sa pamamagitan ng pagbanggit kay Jehoiachin, na siyang tinutukoy ng mga panghalip sa agarang konteksto. Pinalitan ang hindi likas na “sa mataas na kalagayan kaysa” ng “nang mas mataas kaysa sa,” na mas natural sa Filipino at mas malapit sa larawan at paghahambing ng Hebreo. Napanatili ang “trono” at ang ambiguity nito bilang upuan o sagisag ng ranggo sa talababa.
