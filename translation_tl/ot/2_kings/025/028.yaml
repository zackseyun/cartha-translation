  naturalness: Ang “Magiliw siyang kinausap nito” ay posible ngunit mabigat at hindi agad malinaw sa modernong Filipino. Mas malinaw at natural ang aktibong ayos na may mga pangalang Jehoiachin at hari sa konteksto. Ang “nang mas mataas kaysa sa” ang karaniwang paghahambing para sa posisyon o ranggo.
  terminology: Ang “trono,” “mga hari,” at “Babilonia” ay angkop. Pinananatili ng “inilagay ... nang mas mataas” ang sabay na literal na larawan ng upuan/trono at ang ipinahihiwatig na higit na ranggo, nang hindi nagpapataw ng pagpapakahulugang doktrinal.
