translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Babilonia” at “Ribla” bilang karaniwang anyong Filipino ng mga pangalan. Ang “Doon” ay nagpapalinaw na sa Ribla naganap ang paghatol nang hindi binabago ang diwa ng Hebreo.
