  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: tl
  text: Pagkatapos, dinakip nila ang hari at iniakyat nila siya sa hari ng Babilonia sa Ribla, at nagpahayag sila ng hatol laban sa kaniya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “nagsalita sila ng hatol sa kaniya,” isang idyomang nangangahulugang nagpahayag sila ng hatol laban sa kaniya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: binihag nila
  rationale: Sa konteksto, tumutukoy ang תפשׂ sa matagumpay na pagdakip sa tumatakas na hari. Likas sa Filipino ang “binihag” at malinaw na higit ito sa simpleng paghawak.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak ngunit hindi pinapangalanang pagtukoy ng Hebreo sa haring nauna nang tinutukoy, si Zedekias.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: dinala siya
  rationale: Ang עלה ay literal na may diwang “pinaakyat,” ngunit sa modernong Filipino ay magiging labis na literal at posibleng malabo ang “iniakyat siya.” Ang “dinala siya” ay natural at tumpak sa kilos sa konteksto.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: sa hari ng Babilonia
  rationale: Direktang isinasalin ang אֶל bilang patungo “sa” hari ng Babilonia, nang hindi ipinapasok ang interpretatibong “sa harap ng.”
- source_word: רִבְלָתָה
  choice: sa Ribla
  rationale: Maaaring magpahiwatig ng patutunguhan ang hulaping direksiyonal sa pangalan, ngunit ang parirala ay natural na tumutukoy rin sa lugar ng pagharap sa hari ng Babilonia. Ang “sa Ribla” ay sadyang maaaring tumukoy sa patutunguhan o lokasyon.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: hinatulan nila siya
  rationale: Ang literal na “nagsalita sila ng hatol sa kaniya/kasama niya” ay isang idyomang legal. Malinaw at natural na ipinahahayag ng “hinatulan nila siya” ang paggawad o pagpapahayag ng hatol.
