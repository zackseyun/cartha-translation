  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: tl
  text: Ngunit hinabol ng hukbo ng mga Caldeo[a] ang hari at inabutan siya sa kapatagan ng Jerico[b], at nagkawatak-watak palayo sa kanya ang buong hukbo niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “hukbo ng mga Babilonio.” “Mga Caldeo” ang katawagang ginagamit sa tekstong Hebreo para sa mga puwersa ng Babilonia sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: O kaya, “sa mga tigang na kapatagan ng Jerico.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: hinabol
  rationale: Sa salaysay ng digmaan, malinaw at natural na ipinapahayag ng “hinabol” ang aktibong pagtugis.
- source_word: חֵיל כַּשְׂדִּים
  choice: hukbo ng mga Caldeo
  rationale: Ang חֵיל ay hukbo o puwersang militar, at ang כַּשְׂדִּים ay tuwirang tumutukoy sa mga Caldeo; pinananatili nito ang katawagang etniko-politikal ng tekstong Hebreo.
- source_word: אַחַר הַמֶּלֶךְ
  choice: ang hari
  rationale: Nakapaloob na sa pandiwang “hinabol” ang diwa ng אַחַר, kaya hindi kailangang isalin nang hiwalay bilang “sa likuran ng hari.”
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: inabutan siya
  rationale: Ang נשׂג dito ay nangangahulugang makahabol o makaabot matapos ang pagtugis; “inabutan siya” ang likas na katumbas sa Filipino.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: sa kapatagan ng Jerico
  rationale: Ang עֲרָבוֹת ay tumutukoy sa patag at tigang na rehiyong gaya ng steppe; “kapatagan” ang malinaw at karaniwang salin, habang inilalagay sa talababa ang mas tiyak na alternatibo.
- source_word: וְכָל חֵילוֹ
  choice: ang buo niyang hukbo
  rationale: Pinananatili ng “buo niyang hukbo” ang saklaw ng כָל at ang kolektibong kahulugan ng חֵיל.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: nagkawatak-watak at lumayo sa kanya
  rationale: Ipinahihiwatig ng plural na נָפֹצוּ ang pagkakahiwa-hiwalay ng mga kawal, at ng מֵעָלָיו ang paglayo o pagkahiwalay nila sa hari.
