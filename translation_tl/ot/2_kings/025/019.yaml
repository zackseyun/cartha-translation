  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: tl
  text: At mula sa lunsod ay kinuha niya ang isang opisyal[a] na itinalagang mamahala sa mga mandirigma, limang lalaking kabilang sa mga nakakakita sa mukha ng hari[b] na natagpuan sa lunsod, ang kalihim ng pinuno ng hukbo na nagtatala[c] ng mga mamamayan ng lupain para sa paglilingkod militar, at animnapung lalaki mula sa mga mamamayan ng lupain na natagpuan sa lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bating”; ang salitang Hebreo ay maaaring tumukoy sa isang literal na bating o sa isang opisyal ng hari.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga nakakakita sa mukha ng hari” ay isang Hebreong idyoma para sa mga taong may tuwirang paglapit sa hari, malamang na mga tagapaglingkod o opisyal sa palasyo.
    reason: cultural_note
  - marker: c
    text: O “nagtitipon” o “nagtatawag” ng mga mamamayan ng lupain para sa paglilingkod militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: opisyal
  rationale: Maaaring tumukoy ang salita sa isang literal na bating o sa isang opisyal ng hari. Pinananatili ng “opisyal” ang hindi tiyak na pisikal na katayuan at ang tungkuling administratibo sa konteksto.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: namamahala sa mga mandirigma
  rationale: Ipinahihiwatig ng פָקִיד ang isang itinalaga o inilagay na tagapangasiwa; natural at malinaw sa Filipino ang pariralang ito.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: mula sa mga nakakakita sa mukha ng hari
  rationale: Pinananatili ang Hebreong idyoma at ang kahulugan nitong mga taong may tuwirang paglapit sa hari, nang hindi ito nililimitahan sa isang tiyak na titulo sa korte.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: ang kalihim na pinuno ng hukbo
  rationale: Pinananatili ang masinsing ugnayan ng dalawang katawagan sa Hebreo. Ang “kalihim” ay angkop sa administratibong gawain ng סֹפֵר, habang ang “pinuno ng hukbo” ay nagpapanatili sa militar na titulo.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: na nagtitipon sa mga mamamayan ng lupain para sa paglilingkod
  rationale: Ang Hiphil participle ng צבא ay tumutukoy sa pagtawag, pagtatala, o pag-oorganisa para sa paglilingkod militar. Iniiwasan ng salin na tiyaking sapilitan ito, habang nililinaw ang kontekstong militar.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili ang posibleng panlipunang pahiwatig ng Hebreong parirala nang hindi agad tinutukoy ang mga ito bilang karaniwang tao lamang.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: natagpuan
  rationale: Tuwirang pinananatili ang pasibong anyo at ang diwang natagpuan ang mga taong ito sa lunsod.
- source_word: לָקַח
  choice: kinuha niya
  rationale: Karaniwang kahulugan ng pandiwa ang “kumuha.” Bagaman nagpapahiwatig ang konteksto ng pagdakip, hindi idinaragdag ang lakas na wala sa mismong pandiwa.
