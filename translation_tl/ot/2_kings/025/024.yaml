  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang panunumpa ni Gedalias sa mga pinuno at sa kanilang mga kasamahan, ang utos na huwag matakot, ang paninirahan sa lupain, paglilingkod sa hari ng Babilonia, at ang pangakong magiging mabuti ang kalagayan nila. Hindi nito labis na binibigyang-kahulugan ang mga terminong may saklaw na kahulugan.'
