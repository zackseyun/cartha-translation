translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Gedalias” at “Babilonia,” habang pinanatili ang “mga Caldeo” upang sundan ang katawagang Hebreo. Hindi nilutas nang palihim ang lawak ng kahulugan ng “mga tauhan” at “mga lingkod”; ipinaliwanag ang mga posibilidad sa talababa.
