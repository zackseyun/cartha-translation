base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: tl
  text: Nanumpa si Gedalias sa kanila at sa kanilang mga tauhan[a] at sinabi, “Huwag kayong matakot sa mga lingkod ng mga Caldeo.[b] Manirahan kayo sa lupain at paglingkuran ninyo ang hari ng Babilonia, at magiging maayos ang kalagayan ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga lalaki”; maaaring tumukoy sa kanilang mga tagasunod, tauhan, o kawal.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga lingkod ng mga Caldeo” ay maaaring tumukoy sa mga opisyal o kinatawan ng Babilonia. Ang “mga Caldeo” ay maaari ring isaling “mga Babilonio” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: Nanumpa
  rationale: Ang Niphal ng שׁבע ay karaniwang nangangahulugang manumpa o magbigay ng sumpa; malinaw at natural sa modernong Tagalog ang “nanumpa.”
- source_word: וּלְאַנְשֵׁיהֶם
  choice: at sa kanilang mga tauhan
  rationale: Literal itong “at sa kanilang mga lalaki,” ngunit sa konteksto ay tumutukoy sa mga taong kasama o nasa ilalim ng mga pinuno. Hindi nito labis na tinutukoy kung sila ay mga kawal, tagasunod, o lingkod.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: sa mga lingkod ng mga Caldeo
  rationale: Pinananatili ng “mga lingkod” ang leksikal na diwa ng עבדים, bagaman maaaring mga opisyal o kinatawan ng kapangyarihang Babilonio ang tinutukoy. Ang מִן kasunod ng pandiwa ng pagkatakot ay likas na isinaling “sa.”
- source_word: הַכַּשְׂדִּים
  choice: mga Caldeo
  rationale: Ito ang tuwirang katawagang etniko sa Hebreo. Sa kontekstong ito maaari rin itong tumukoy sa mga Babilonio, kaya inilagay ang paliwanag sa talababa.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Manirahan kayo sa lupain
  rationale: Ang ישב ay maaaring mangahulugang umupo, manirahan, o manatili. Ang “manirahan” ay natural at angkop sa panawagang mamuhay sa lupaing nasa ilalim ng bagong pamamahala.
- source_word: וְעִבְדוּ אֶת־מֶלֶךְ בָּבֶל
  choice: at paglingkuran ninyo ang hari ng Babilonia
  rationale: Ang עבד na may taong layon ay nangangahulugang maglingkod. Pinananatili nito ang pampolitikang pahiwatig ng pagpapasakop nang hindi iyon ginagawang tahasang paraphrase.
- source_word: וְיִטַב לָכֶם
  choice: at magiging maayos ang kalagayan ninyo
  rationale: Ipinahahayag ng idyomang Hebreo na magiging mabuti o kanais-nais ang kahihinatnan para sa kanila. Natural ito sa Tagalog at iniiwasan ang posibleng moral na kahulugan ng “mapapabuti kayo.”
