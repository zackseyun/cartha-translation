  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: tl
  text: Noong ikasiyam na taon ng kanyang paghahari, sa ikasampung buwan, sa ikasampung araw ng buwan, dumating laban sa Jerusalem si Nebucadnezar[a], hari ng Babilonia, kasama ang kanyang buong hukbo. Nagkampo sila laban dito at nagtayo ng pader na pangkubkob[b] sa palibot nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalan na “Nebucadrezar,” ayon sa ibang tradisyon ng paglilipat-titik.
    reason: lexical_alternative
  - marker: b
    text: O “mga tanggulang pangkubkob” o “rampang pangkubkob.” Ang Hebreong דָּיֵק ay tumutukoy sa mga estrukturang militar na itinatayo laban sa isang lungsod habang kinukubkob ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang Hebreong panandang pasalaysay nang hindi gumagamit ng makalumang parirala.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: nang ikasiyam na taon ng kanyang paghahari
  rationale: Likas na salin ng pormula para sa taon ng paghahari ng hari; nananatiling hindi tahasang pinapangalanan sa talata kung kaninong paghahari ito.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: sa ikasampung buwan, sa ikasampung araw ng buwan
  rationale: Tuwirang pinananatili ang sinaunang petsa at hindi ito ipinapalit sa pangalan ng isang modernong buwan.
- source_word: בָּא ... עַל יְרוּשָׁלַםִ
  choice: dumating laban sa Jerusalem
  rationale: Sa konteksto ng digmaan at pagkubkob, adversatibo ang עַל; hindi lamang sila naglakbay patungo sa lungsod.
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: si Nebucadnezar, hari ng Babilonia
  rationale: Ginagamit ang pamilyar at nababasang anyong Filipino ng pangalan at tuwirang isinasalin ang titulong maharlika.
- source_word: הוּא וְכָל חֵילוֹ
  choice: kasama ang kanyang buong hukbo
  rationale: 'Ipinahahayag ang inklusibong diin ng Hebreo: personal na dumating ang hari kasama ang lahat ng kanyang puwersa.'
- source_word: וַיִּחַן עָלֶיהָ
  choice: Nagkampo sila laban dito
  rationale: Ang kampo ay itinayo bilang bahagi ng pagsalakay sa lungsod; ang maramihang 'sila' ay natural na tumutukoy sa hari at hukbo.
- source_word: דָּיֵק
  choice: pader na pangkubkob
  rationale: Konkretong inilalarawan ang kagamitang militar na itinayo laban sa isang napaliligirang lungsod, habang itinatala sa talababa ang mas malawak na saklaw ng termino.
