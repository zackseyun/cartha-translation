translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod na pormula ng petsa at ang pormal na himig ng salaysay, ngunit hinati sa dalawang pangungusap upang maging malinaw at natural. Inilagay ang mga pananda ng talababa sa mismong salitang tinatalakay.
