  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: tl
  text: Kinuha sila ni Nebuzaradan, ang pinuno ng mga bantay,[a] at dinala sila sa hari ng Babilonia sa Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinuno ng mga tagapatay.” Malamang na isa itong titulong militar o panseguridad ng isang opisyal ng hari.
    reason: cultural_note
  - marker: b
    text: O, “iniharap sila sa hari ng Babilonia sa Ribla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang kahulugan ng לקח sa kontekstong ito ang “kinuha.” Hindi idinagdag ang diwang marahas ng “dinakip,” yamang mga bihag na sila ayon sa konteksto.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa Filipino.
- source_word: רַב טַבָּחִים
  choice: ang pinuno ng mga bantay
  rationale: Bagaman literal na tumutukoy ang titulo sa “pinuno ng mga tagapatay,” isa itong opisyal na titulong militar o panseguridad sa korte ng Babilonia. Ang “pinuno ng mga bantay” ay malinaw at likas sa modernong Filipino, habang inilalahad sa talababa ang literal na anyo.
- source_word: וַיֹּלֶךְ
  choice: dinala
  rationale: Ang causative na anyo ng הלך, na may tuwirang layon at patutunguhan, ay likas na nangangahulugang “dinala” sa salaysay na ito.
- source_word: עַל
  choice: sa
  rationale: Kasunod ng pandiwa ng paggalaw at ng pariralang “hari ng Babilonia,” ipinahihiwatig nito ang pagdadala sa kinaroroonan o presensiya ng hari. Pinananatili sa talababa ang mas tiyak na alternatibong “iniharap sa.”
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang salin ng construct chain sa natural na Filipino.
- source_word: רִבְלָתָה
  choice: sa Ribla
  rationale: Sa buong pangungusap, inilalarawan nito ang lugar na kinaroroonan ng hari. Ang “sa Ribla” ay maaaring magpahayag ng lokasyon nang hindi pilit na nililinaw kung “papunta sa” o “nasa” ang diin.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng salaysay at ang bahagyang kalabuan ng עַל sa pamamagitan ng pangunahing saling “sa,” habang ibinigay sa talababa ang posibleng diwang pagharap sa hari.
