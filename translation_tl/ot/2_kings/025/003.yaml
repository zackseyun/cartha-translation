  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: tl
  text: Nang ikasiyam na araw ng buwan, tumindi ang taggutom sa lungsod, at walang tinapay[a] para sa mga tao ng lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkain,” sapagkat ang “tinapay” ay maaari ring gamitin bilang pangkalahatang tawag sa pagkain.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, ang “mga tao ng lupain” ay maaaring tumukoy nang mas tiyak sa karaniwang mga tao o sa lokal na mamamayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: Nang ikasiyam na araw ng buwan
  rationale: Likas sa modernong Tagalog ang pagdaragdag ng “araw,” na ipinahihiwatig ngunit hindi tahasang nakasulat sa Hebreo.
- source_word: וַיֶּחֱזַק
  choice: tumindi
  rationale: Ang חזק ay may diwang lumakas; kapag taggutom ang paksa, malinaw at natural ang “tumindi.”
- source_word: הָרָעָב
  choice: ang taggutom
  rationale: Sa konteksto ng pagkubkob, tumutukoy ito sa malawakang kakulangan ng pagkain, hindi lamang sa pagkagutom ng isang tao.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwiran at natural na salin ng pariralang tumutukoy sa kinaroroonan.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: at walang tinapay
  rationale: Pinananatili ang kongkretong salitang “tinapay,” bagaman maaari itong tumukoy nang mas malawak sa pagkain.
- source_word: לְעַם הָאָרֶץ
  choice: para sa mga mamamayan ng lupain
  rationale: Pinananatili ang lawak at bahagyang kalabuan ng literal na parirala nang hindi ito nililimitahan agad sa karaniwang mamamayan o sa isang tiyak na uring panlipunan.
