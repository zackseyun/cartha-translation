  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: tl
  text: Kinuha ng pinuno ng mga bantay si Seraias na punong pari[a], si Zefanias na pangalawang pari, at ang tatlong bantay ng bungad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mataas na pari.” Sa Hebreo, literal itong “ang pari, ang pinuno.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bantay sa pintuan” o “mga bantay sa pasukan ng templo.” Sa Hebreo, literal itong “mga bantay ng bungad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: pinuno ng mga bantay
  rationale: Sa kontekstong militar at maharlika, titulo ito ng kumander ng bantay ng hari. Iniiwasan ng salin ang labis na literal na “pinuno ng mga tagapatay” habang pinananatili ang tungkulin ng opisyal.
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang kahulugan ng לָקַח ang “kumuha.” Hinahayaan nitong ipahiwatig ng konteksto ang sapilitang pagdakip nang hindi pinatitindi ang pandiwa.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: punong pari
  rationale: Malapit ito sa literal na “paring pinuno” at malinaw na tumutukoy sa nangungunang paring opisyal, nang hindi kinakailangang gawing teknikal ang titulo.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: pangalawang pari
  rationale: Pinananatili nito ang ideya ng ikalawang ranggo o pagiging pangalawang opisyal nang hindi tiyak na nilulutas kung ang tungkulin ay isang kinatawan.
- source_word: שֹׁמְרֵי הַסַּף
  choice: mga bantay sa pasukan ng templo
  rationale: Ang literal na larawan ay “mga bantay ng bungad/pasukan.” Nililinaw ng “ng templo” ang ipinahihiwatig na lugar sa konteksto; nasa talababa ang mas literal na anyo.
- source_word: שְׁלֹשֶׁת
  choice: ang tatlong
  rationale: Likas sa Tagalog ang tiyak na pariralang “ang tatlong” para sa tinutukoy na pangkat ng mga opisyal.
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: צְפַנְיָהוּ
  choice: Zefanias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
theological_decisions:
- issue: Tiyak na titulo ng כֹּהֵן הָרֹאשׁ
  choice: punong pari
  alternative: pinakapunong pari
  rationale: Pinananatili ng “punong pari” ang kahulugang ulo o pinuno ng mga pari nang hindi nagdaragdag ng denominasyonal o mas huling teknikal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at mga katawagang madaling maunawaan, habang pinanatili sa mga talababa ang literal na larawan at leksikal na mga alternatibo.
