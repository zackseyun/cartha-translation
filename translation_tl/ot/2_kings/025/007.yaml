base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: tl
  text: Pinatay nila ang mga anak ni Zedekias sa harap mismo ng kanyang mga mata. Pagkatapos, dinukit niya ang mga mata ni Zedekias[a], ginapos siya gamit ang mga tanikalang tanso, at dinala siya sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binulag niya si Zedekias.” Ang pandiwang Hebreo ay nangangahulugang “ginawang bulag,” ngunit sa kontekstong ito, malamang na tumutukoy ito sa pisikal na pagdukit sa kanyang mga mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: pinatay
  rationale: Ang pandiwa ay tumutukoy sa marahas na pagkatay o pagpatay. Mas natural sa makabagong Tagalog ang “pinatay” sa salaysay na ito; malinaw na ipinakikita ng konteksto ang kalupitan ng ginawa.
- source_word: לְעֵינָיו
  choice: sa harap mismo ng kanyang mga mata
  rationale: Pinananatili nito ang matingkad na idyoma at ang diwa na nasaksihan mismo ni Zedekias ang pagpatay.
- source_word: עִוֵּר
  choice: dinukit niya ang mga mata
  rationale: Literal na nangangahulugang “ginawang bulag,” ngunit dahil tuwirang binabanggit ang mga mata sa marahas na konteksto, ipinahahayag ng salin ang pisikal na paraang ipinahihiwatig ng teksto. Isinama sa talababa ang mas literal na alternatibo.
- source_word: וַיַּאַסְרֵהוּ
  choice: iginapos siya
  rationale: Tuwirang ipinapahayag ang pagbibigkis sa bilanggo at ang kasunod na parirala ang nagsasaad ng ginamit na panggapos.
- source_word: בַנְחֻשְׁתַּיִם
  choice: mga tanikalang tanso
  rationale: Ang anyong Hebreo ay tumutukoy sa mga metal na panggapos. Ang “mga tanikalang tanso” ay malinaw at likas sa modernong Tagalog nang hindi nagtatakda kung kamay o paa ang iginapos.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: dinala siya sa Babilonia
  rationale: Likas at tuwirang katumbas ng karaniwang pandiwang Hebreo para sa pagdadala sa isang lugar.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: ang mga anak ni Zedekias
  rationale: Natural na anyo ng pariralang pag-aari sa Tagalog at hindi tinutukoy ng Hebreo kung ilan sa mga anak ang saklaw bukod sa pagiging maramihan.
theological_decisions:
- issue: Paglipat mula sa maramihang gumagawa tungo sa isahang gumagawa
  choice: “Pinatay nila … Pagkatapos, dinukit niya …”
  alternative: Gawing iisa ang simuno sa buong pangungusap o tukuyin bilang “hari ng Babilonia” ang isahang simuno.
  rationale: Pinananatili ang malinaw na paglipat ng mga pandiwang Hebreo mula ikatlong panauhang maramihan tungo sa ikatlong panauhang isahan. Hindi pinangalanan sa talata ang isahang simuno, kaya hindi ito tahasang idinagdag mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mabigat at marahas na tono ng salaysay, gayundin ang pagbabago ng simuno mula “nila” tungo sa “niya,” nang hindi tahasang pinapangalanan ang simunong hindi pinangalanan sa Hebreo.
