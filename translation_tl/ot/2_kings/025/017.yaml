base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: tl
  text: Labingwalong siko[a] ang taas ng isang haligi, at sa ibabaw nito ay may kapitel na tanso. Tatlong siko ang taas ng kapitel. May palamuting sala-sala at mga palamuting hugis-granada sa palibot ng kapitel; tanso ang lahat ng ito. Gayon din ang mga palamuti sa ikalawang haligi, kasama ang palamuting sala-sala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang siko ay humigit-kumulang 45 sentimetro; kaya ang labingwalong siko ay mga 8.1 metro.
    reason: measurement
  - marker: b
    text: Elliptical ang huling sugnay sa Hebreo; literal, “at mga tulad nito para sa ikalawang haligi sa ibabaw ng sala-sala.” Ang diwa ay magkatulad ang palamuti ng dalawang haligi.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: ang taas
  rationale: Ang anyong construct ng קוֹמָה ay tumutukoy sa taas o sukat; natural at tumpak sa paglalarawang pang-arkitektura ang “ang taas.”
- source_word: עַמּוּד
  choice: haligi
  rationale: Karaniwang salitang Filipino para sa pillar o column at angkop sa monumental na arkitektura ng templo.
- source_word: כֹתֶרֶת
  choice: kapitel
  rationale: Tiyak na terminong pang-arkitektura para sa pinalamutian na pinakatuktok ng haligi; iniiwasan nitong mapagkamalan ang bagay na isang koronang maharlika.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Karaniwang salin sa Filipino para sa metal na tinutukoy sa mga kagamitang biblikal; maaari itong tumukoy sa copper o bronze, kaya pinananatili ng “tanso” ang saklaw nang hindi gumagamit ng anakronistikong brass.
- source_word: שְׂבָכָה
  choice: palamuting sala-sala
  rationale: Tumutukoy sa net-like o lattice na palamuti ng kapitel. Nililinaw ng “palamuting” na ornamental ito, hindi karaniwang harang o rehas.
- source_word: רִמֹּנִים
  choice: mga granada
  rationale: Literal na tumutukoy sa mga pomegranate, dito ay mga palamuting hugis-granada; pinananatili ang kongkretong larawan.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Natural na Filipino para sa pagkakalagay na nakapaligid sa kapitel.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: tanso ang lahat ng iyon
  rationale: Malinaw na ibinubuod ang materyal ng mga palamuting kababanggit lamang.
- source_word: וְכָאֵלֶּה
  choice: Gayundin ang nasa ikalawang haligi
  rationale: Ipinahihiwatig ng Hebreo na kapareho ang mga katangian ng ikalawang haligi; natural itong pahayag sa Filipino nang hindi nagdaragdag ng bagong detalye.
- source_word: עַל הַשְּׂבָכָה
  choice: pati ang palamuting sala-sala
  rationale: Ang pangwakas na sugnay ay elliptical. Inilalahad nito nang mabasa sa Filipino na kasama sa pagkakatulad ang sala-salang palamuti, habang minamarkahan sa talababa ang literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang teknikal ngunit kinikilalang terminong “kapitel,” at ang mas malinaw na “palamuting sala-sala” para sa net-like na dekorasyon. Pinanatili ang sinaunang yunit na siko sa teksto at ipinaliwanag sa talababa.
