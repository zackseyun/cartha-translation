- from: Labingwalong siko[a] ang taas ng unang haligi, at sa ibabaw nito ay may tansong kapitel. Tatlong siko ang taas ng kapitel. May palamuting sala-sala at mga granada sa palibot nito; tanso ang lahat ng iyon. Gayundin ang nasa ikalawang haligi, pati ang palamuting sala-sala.[b]
  to: Labingwalong siko[a] ang taas ng isang haligi, at sa ibabaw nito ay may kapitel na tanso. Tatlong siko ang taas ng kapitel. May palamuting sala-sala at mga palamuting hugis-granada sa palibot ng kapitel; tanso ang lahat ng ito. Gayon din ang mga palamuti sa ikalawang haligi, kasama ang palamuting sala-sala.[b]
