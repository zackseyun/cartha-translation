  source_fidelity: 'Ang “hindi na matimbang” ay lumilihis nang bahagya sa Hebreong לֹא הָיָה מִשְׁקָל: ipinahihiwatig nito na imposibleng timbangin ang tanso at ang “na” ay nagdaragdag ng aspektong wala sa pinagmulan. Mas tapat at natural ang “hindi tinimbang,” na naghahatid ng kontekstuwal na diwa ng idyoma nang hindi nagsasabing hindi ito matitimbang.'
  naturalness: Natural ang karamihan ng mga termino. Ang “hindi tinimbang ang tanso” ay mas malinaw sa makabagong Filipino kaysa “hindi na matimbang ang tanso.” Ang dating talababa na “walang sukat na timbang” ay hindi natural at maaaring magmungkahi ng kawalan ng isang yunit ng timbang, sa halip na ang Hebreong pahayag tungkol sa timbang/pagtitimbang.
  terminology: Ang “haligi,” “Dagat,” “mga patungan,” “tanso,” “mga kagamitan,” at “bahay ni Yahweh” ay angkop. Ang malaking titik sa “Dagat” ay kapaki-pakinabang upang ipakitang teknikal na pangalan ito ng sisidlan.
  issues:
