base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: tl
  text: Ang dalawang haligi, ang nag-iisang Dagat, at ang mga patungan na ginawa ni Solomon para sa bahay ni Yahweh—hindi tinimbang[a] ang tanso ng lahat ng kagamitang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang timbang para sa tanso ng lahat ng kagamitang ito”; malamang na hindi ito tinimbang dahil sa napakarami nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: ang dalawang haligi
  rationale: Ang עַמּוּדִים ay tumutukoy sa dalawang haliging bahagi ng mga kagamitan ng templo; natural at pamilyar sa Filipino ang “haligi.”
- source_word: הַיָּם הָאֶחָד
  choice: ang nag-iisang Dagat
  rationale: Teknikal na pangalan dito ang יָם para sa malaking tansong sisidlan sa templo. Pinanatili ang literal na pangalang “Dagat” at ginamitan ng malaking titik.
- source_word: וְהַמְּכֹנוֹת
  choice: ang mga patungan
  rationale: Ang מְכֹנוֹת ay mga base o stand na kaugnay ng mga palanggana; malinaw at kongkreto sa modernong Filipino ang “mga patungan.”
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: na ginawa ni Solomon
  rationale: Tuwirang inilalarawan ng sugnay ang mga kagamitang ginawa ni Solomon; sapat at natural ang payak na aspektong naganap sa Filipino.
- source_word: לְבֵית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang Hebreong talinghaga at inililipat ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: לֹא הָיָה מִשְׁקָל
  choice: hindi na matimbang
  rationale: Ipinahihiwatig ng idyoma na hindi na isinagawa ang pagtimbang dahil sa napakaraming tanso. Natural ito sa Filipino ngunit pinananatili sa talababa ang mas literal na posibilidad.
- source_word: לִנְחֹשֶׁת
  choice: ang tanso
  rationale: Sa konteksto ng mga kagamitan ng templo, ang נְחֹשֶׁת ay tansong haluang metal; “tanso” ang karaniwang salin sa Filipino.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ng lahat ng kagamitang ito
  rationale: Malawak ang kahulugan ng כֵּלִים; ang “mga kagamitan” ay angkop sa sari-saring bagay sa templo at natural sa kasalukuyang Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng לֹא הָיָה מִשְׁקָל
  choice: hindi na matimbang
  alternative: walang timbang; hindi tinimbang
  rationale: Malamang na tumutukoy ang pahayag sa di-pagtimbang dahil sa labis na dami, hindi sa kawalan ng aktuwal na timbang. Gayunman, hindi ganap na nilulutas ang leksikal na ambiguwidad at itinatala ang mas literal na anyo sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang “Dagat” bilang teknikal na pangalan ng malaking sisidlan sa templo, at “bahay ni Yahweh” upang maging malinaw ang ugnayan sa anyong Hebreo.
