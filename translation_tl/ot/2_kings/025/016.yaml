    issue: Ang “hindi na matimbang” ay may modal at aspektuwal na dagdag.
    rationale: Ang Hebreo ay nagsasabing “walang timbang/pagtitimbang,” isang idyomang sa kontekstong ito ay tumutukoy sa hindi pagtimbang dahil sa dami. Hindi nito tuwirang sinasabing hindi kayang timbangin ang tanso, ni may “hindi na” na temporal na kahulugan.
  - severity: medium
    issue: Hindi natural at hindi tiyak ang talababang “walang sukat na timbang.”
    rationale: Hindi nito malinaw na naipapakita ang leksikal na alternatibong “walang timbang” at maaaring maunawaan bilang kawalan ng panukat o yunit ng timbang.
