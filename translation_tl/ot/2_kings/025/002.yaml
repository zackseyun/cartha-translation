  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: tl
  text: Kaya nanatiling nakubkob ang lungsod hanggang sa ikalabing-isang taon ng paghahari ni Haring Zedekias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang lungsod ay dumating sa pagkubkob,” isang idyomang Hebreo na nangangahulugang ang lungsod ay nasa kalagayang kinukubkob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: nanatiling
  rationale: Bagaman literal na “dumating” o “pumasok” ang pandiwa, bahagi ito ng idyomang nagsasaad na ang lungsod ay nasa patuloy na kalagayan ng pagkubkob. Likas na ipinahahayag ito sa Filipino sa pamamagitan ng “nanatiling.”
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang salin ng pangngalang עִיר na may tiyak na pantukoy.
- source_word: בַּמָּצוֹר
  choice: nakubkob
  rationale: Ang מָצוֹר ay tumutukoy sa pagkubkob o kalagayan ng isang lugar na pinalilibutan ng kaaway. Ang “nakubkob” ay maikli, natural, at naglalarawan ng kalagayang bunga ng pagkubkob.
- source_word: עַד
  choice: hanggang sa
  rationale: Ipinakikilala nito ang panahong hangganan ng pagkubkob.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: ikalabing-isang taon
  rationale: Sa pormula ng pagtatala ng paghahari, ang kardinal na anyo sa Hebreo ay natural na isinasalin bilang ordinal sa Filipino.
- source_word: לַמֶּלֶךְ
  choice: ng paghahari ni Haring
  rationale: Ang ל sa pormula ng mga taon ng hari ay tumutukoy sa taon ng kanyang paghahari. Nililinaw ng “ng paghahari ni Haring” ang kronolohikal na diwa nang hindi binabago ang kahulugan.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Filipino ng Bibliya.
