  terminology: Ang 'mga kumander ng mga hukbo' at 'mga tauhan' ay angkop sa kontekstong militar. Maayos ang mga anyo ng mga pangalan at ang pagpapanatili sa mga gentilicio na Netofatita at Maacatita. Hindi ipinapasok ng teksto ang mas tiyak na 'gobernador.'
