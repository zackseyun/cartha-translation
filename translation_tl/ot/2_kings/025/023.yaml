  source_fidelity: Tumpak na naihahatid ng salin ang mga kumander at kanilang mga tauhan, ang paghirang kay Gedalias ng hari ng Babilonia, ang pagpunta sa Mizpa, at ang talaan ng mga pinunong kasama ng kani-kanilang tauhan. Ang 'itinalaga' ay angkop na katumbas ng הִפְקִיד at hindi nagdaragdag ng titulong wala sa pandiwa.
