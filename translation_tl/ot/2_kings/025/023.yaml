source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: tl
  text: 'Nang mabalitaan ng lahat ng kumander ng mga hukbo, kasama ang kanilang mga tauhan, na itinalaga ng hari ng Babilonia si Gedalias[a], pumunta sila kay Gedalias sa Mizpa: sina Ismael na anak ni Netanias, Johanan na anak ni Karea, Seraias na anak ni Tanhumet na Netofatita, at Jaazanias na anak ng Maacatita, kasama ang kanilang mga tauhan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay si Gedalias bilang tagapamahala.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghirang o paglalagay sa isang tao upang mangasiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: mga kumander ng mga hukbo
  rationale: Ang שָׂרִים ay mga pinuno o opisyal, at militar ang diwa ng חַיִל sa kontekstong ito. Malinaw ang “mga kumander ng mga hukbo” nang hindi nagtatakda ng tiyak na ranggo.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: kasama ang kanilang mga tauhan
  rationale: Ipinakikita ng parirala na ang mga tauhang kaugnay ng mga kumander ay kasama rin sa nakarinig. Mas natural ito sa modernong Tagalog kaysa sa literal na “sila at ang mga lalaki.”
- source_word: הִפְקִיד
  choice: itinalaga
  rationale: Saklaw nito ang paghirang o paglalagay sa tungkuling mamahala nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na titulong “gobernador.”
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: kay Gedalias sa Mizpa
  rationale: Ang Mizpa ang lugar na kinaroroonan ni Gedalias; natural sa Tagalog ang ganitong ayos.
- source_word: הַנְּטֹפָתִי
  choice: na Netofatita
  rationale: Pinananatili bilang katawagang heograpiko o pangkat na kaugnay ng Netofa, sa anyong natural na ginagamit sa mga pangalan sa Tagalog na Bibliya.
- source_word: הַמַּעֲכָתִי
  choice: ng Maacatita
  rationale: Pinananatili ang gentilic bilang katawagang heograpiko o pangkat. Ang “anak ng Maacatita” ay sumusunod sa sintaks ng Hebreo, na hindi nagbibigay rito ng personal na pangalan.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 'pumunta sila ...: sina Ismael ... Johanan ... Seraias ... at Jaazanias'
  rationale: Ang mga pangalan ay paliwanag kung sinu-sino ang mga kumander. Pinananatili ng tutuldok ang appositional na ugnayan sa malinaw na modernong Tagalog.
- source_word: וְאַנְשֵׁיהֶם
  choice: kasama ang kanilang mga tauhan
  rationale: Ipinahihiwatig ng pangwakas na parirala na dumating ang mga pinunong pinangalanan kasama ng kani-kanilang mga tauhan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumander” at “mga tauhan” bilang natural na katawagang militar; iniwasan ang “gobernador” dahil mas tiyak iyon kaysa sa mismong pandiwang Hebreo. Pinanatili ang pag-uulit ng pagbanggit sa mga tauhan dahil naroon ito sa pinagmulan.
