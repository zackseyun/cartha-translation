  naturalness: Mas natural at marangal sa modernong Filipino ang "isang palagiang panustos" at "ang nakatakda para sa bawat araw, sa araw na iyon." Ang "sa buong buhay niya" ay likas na katumbas ng Hebreong "lahat ng araw ng kanyang buhay."
  terminology: Ang "panustos" ay angkop para sa אֲרֻחָה sapagkat maaari itong tumukoy sa nakalaang probisyon at hindi lamang sa pagkain. Ang "palagiang" ay mas idiomatiko kaysa "tuluy-tuloy" sa paglalarawan ng isang regular na royal provision.
