base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: tl
  text: At ang kanyang panustos[a]—isang palagiang panustos—ay ibinigay sa kanya mula sa hari, ang nakatakda para sa bawat araw, sa araw na iyon[b], sa buong buhay niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takdang bahagi,” “rasyon,” o “probisyon.” Ang salitang Hebreo ay tumutukoy sa panustos na inilaan at ibinigay sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang bagay ng isang araw sa araw nito,” isang idyomang nangangahulugang ang nakatakdang panustos para sa bawat araw ay ibinibigay sa araw na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: panustos
  rationale: Tumutukoy ito sa nakalaang probisyong ibinibigay kay Jehoiachin. Ang “panustos” ay likas sa makabagong Tagalog at hindi nililimitahan ang diwa sa pagkaing rasyon lamang.
- source_word: תָּמִיד
  choice: tuluy-tuloy
  rationale: Ipinahahayag nito na nagpapatuloy at hindi napuputol ang panustos; malapit ito sa patuloy na diwa ng salitang Hebreo.
- source_word: נִתְּנָה
  choice: ay ibinigay
  rationale: Tuwirang pinananatili ang balintiyak na anyo ng pandiwang Hebreo.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: mula sa hari
  rationale: Pinananatili ang diwa ng pinagmulan sa pariralang Hebreo, sa halip na gawing tahasang tagaganap lamang ang hari.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ang takdang bahagi para sa bawat araw sa araw nito
  rationale: Pinananatili ang distributibong puwersa ng idyomang Hebreo—ang ukol sa bawat araw ay ibinibigay sa mismong araw na iyon—habang ginagawa itong mauunawaan sa Tagalog.
- source_word: כֹּל יְמֵי חַיָּו
  choice: sa lahat ng araw ng kanyang buhay
  rationale: Malapit sa anyo ng Hebreo at malinaw na nagpapahayag na panghabambuhay ang tagal.
