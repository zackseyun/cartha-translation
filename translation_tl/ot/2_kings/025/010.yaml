  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: tl
  text: At giniba ng buong hukbo ng mga Caldeo na kasama ng pinuno ng mga bantay[a] ang mga pader ng Jerusalem sa buong palibot nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno ng mga tagapagpatay” o “pinuno ng personal na bantay” para sa titulong Hebreo na rab-tabbaḥim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: mga pader
  rationale: Ang pangmaramihang anyo ng חוֹמָה ay tumutukoy sa mga pader o tanggulan ng lunsod; natural at malinaw sa Filipino ang “mga pader.”
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Ito ang nakaugaliang anyo ng pangalan ng lunsod sa modernong Filipino.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahihiwatig nito na ang mga pader na nakapaligid sa lunsod ang giniba, nang hindi dinaragdagan ang saklaw ng pahayag.
- source_word: נָתְצוּ
  choice: giniba
  rationale: Ang נתץ ay nangangahulugang pabagsakin o wasakin ang isang istruktura; ang “giniba” ay tuwiran at likas sa kontekstong ito.
- source_word: כָּל חֵיל
  choice: buong hukbo
  rationale: Ang כָּל ay sumasaklaw sa kolektibong חֵיל; malinaw na ipinahahayag ng “buong hukbo” ang kabuuan ng puwersang militar.
- source_word: כַּשְׂדִּים
  choice: mga Caldeo
  rationale: Pinananatili nito ang tiyak na katawagang etniko sa tekstong Hebreo sa halip na palitan ito ng mas malawak na “mga Babilonio.”
- source_word: אֲשֶׁר
  choice: na kasama ng
  rationale: Elliptical ang ugnayan sa Hebreo. Ang “na kasama ng” ay likas sa Filipino at iniuugnay ang hukbo sa opisyal na binanggit nang hindi tiyak na ipinapakahulugan ang estruktura ng pamumuno.
- source_word: רַב טַבָּחִים
  choice: pinuno ng mga bantay
  rationale: Isa itong opisyal na titulong mahirap tumbasan nang literal. Ang “pinuno ng mga bantay” ay malinaw sa konteksto, samantalang inilalahad sa talababa ang iba pang posibleng kahulugan.
theological_decisions: []
translation_notes:
  register: Gumamit ng kasalukuyan, marangal, at madaling maunawaang Filipino. Pinanatili ang “mga Caldeo” bilang tiyak na katawagang nasa Hebreo at inilagay agad ang panandang [a] pagkatapos ng titulong tinatalakay nito.
