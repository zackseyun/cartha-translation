base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: tl
  text: Kinuha rin nila ang mga palayok, mga pala, mga panggupit ng mitsa[a], mga mangkok, at lahat ng kagamitang bronse na ginagamit sa paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kutsilyo” o “mga pangtabas.” Maaaring tumukoy ang salitang Hebreo sa isang kasangkapang pamputol, ngunit sa kontekstong ito ng mga kagamitan sa templo, karaniwan itong inuunawang kasangkapan sa paggupit o pag-aayos ng mitsa ng mga ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: mga palayok
  rationale: Karaniwang tumutukoy ang סִירוֹת sa mga palayok o sisidlan; ang “mga palayok” ay natural at hindi labis na nililimitahan ang gamit nito sa talaan ng mga kagamitan sa templo.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Tumutukoy ang יָעִים sa mga kasangkapang ginagamit sa pag-aalis ng abo o paghawak ng baga; malinaw at karaniwan sa Filipino ang “mga pala.”
- source_word: הַמְזַמְּרוֹת
  choice: mga panggupit ng mitsa
  rationale: Bagaman maaaring tumukoy ang salita sa mga kasangkapang pamputol, sa konteksto ng mga kagamitan sa templo ay malamang na mga kasangkapang ginagamit sa paggupit o pag-ayos ng mitsa ng ilawan.
- source_word: הַכַּפּוֹת
  choice: mga mangkok
  rationale: Maaaring tumukoy ang כַּפּוֹת sa maliliit na sisidlan, mangkok, o kagamitang tulad ng sandok. Ang “mga mangkok” ay madaling maunawaan at angkop sa talaan ng mga gamit sa templo nang hindi labis na espesipiko.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: lahat ng kagamitang tanso
  rationale: Malawak ang kahulugan ng כְּלִים at maaaring tumukoy sa mga kagamitan o sisidlan. Sa kontekstong ito, natural ang “mga kagamitan,” at ang נְחֹשֶׁת ay tumutukoy sa tanso o bronse; pinili ang karaniwang salitang Filipino na “tanso.”
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: na ginagamit sa paglilingkod sa templo
  rationale: May natatanging diwa ng paglilingkod sa santuwaryo ang שרת. Ginawang tahasan ang “sa templo” mula sa konteksto upang maging natural at malinaw sa Filipino, habang hindi tinutukoy kung sino mismo ang mga naglilingkod.
- source_word: לָקָחוּ
  choice: Kinuha rin nila
  rationale: Ang pandiwa ay nangangahulugang “kinuha.” Ang “rin” ay natural na nag-uugnay sa nagpapatuloy na talaan ng mga bagay na tinangay, samantalang ipinahihiwatig na ng konteksto ang pag-aalis sa mga ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paglilingkod sa templo” upang maipahayag ang kontekstong panritwal ng שרת nang hindi gumagamit ng mas teknikal o denominasyonal na pananalita. Napanatili sa talababa ang leksikal na pag-aalinlangan sa הַמְזַמְּרוֹת.
