reference: 2 Kings 25:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: tl
  text: At sa ikapitong buwan, dumating si Ismael na anak ni Netanias, anak ni Elisama, na mula sa maharlikang angkan,[a] kasama ang sampung lalaki. Pinabagsak nila si Gedalias, at namatay siya, pati ang mga taga-Juda at ang mga Caldeo[b] na kasama niya sa Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa binhi ng paghahari,” ibig sabihin, mula sa maharlikang angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga Caldeo” ay maaari ring isaling “mga Babilonio” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Likas na panimulang salaysay sa Tagalog na naghuhudyat ng sumunod na pangyayari nang hindi gumagamit ng makalumang parirala.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: nang ikapitong buwan
  rationale: Tuwirang temporal na pahayag; hindi tinutukoy ng Hebreo ang taon, kaya hindi ito dinagdagan.
- source_word: בָּא
  choice: dumating
  rationale: Natural na katumbas ng payak na pandiwa ng pagdating sa kontekstong pasalaysay.
- source_word: בֶּן נְתַנְיָה בֶּן אֱלִישָׁמָע
  choice: anak ni Netanias at apo ni Elisama
  rationale: 'Nililinaw sa natural na Tagalog ang sunod-sunod na Hebreong ben: si Ismael ay anak ni Netanias, na anak naman ni Elisama.'
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: mula sa angkan ng hari
  rationale: Ipinahahayag ang maharlikang linya ng lahi nang malinaw at marangal; iniiwasan ang di-likas na literal na 'binhi ng paghahari.'
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: kasama ang sampung lalaki
  rationale: Natural na pagkakabit sa pandiwang 'dumating' habang pinananatili ang tiyak na bilang.
- source_word: וַיַּכּוּ
  choice: Pinabagsak nila
  rationale: Pinananatili ang marahas na kilos ng נכה nang hindi pinagsasama agad sa kasunod na hiwalay na pahayag na namatay siya.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang hiwalay na singular na sugnay at ang payak na pagkakasunod ng Hebreo; ang tinutukoy ay natural na si Gedalias.
- source_word: הַיְּהוּדִים
  choice: mga taga-Juda
  rationale: Mas angkop sa monarkiko at panahong pagkatapon na etnoheograpikong konteksto kaysa sa posibleng mas huling pakahulugan ng 'mga Judio.'
- source_word: הַכַּשְׂדִּים
  choice: mga Caldeo
  rationale: Malapit sa mismong etnonimong Hebreo; ipinaliliwanag sa talababa ang kontekstuwal na alternatibong 'mga Babilonio.'
- source_word: בַּמִּצְפָּה
  choice: sa Mizpa
  rationale: Karaniwang lokatibong anyo sa Tagalog para sa isang pinangalanang pamayanan.
theological_decisions:
- issue: Ugnayan ng 'pinabagsak' at 'namatay'
  choice: 'Pinanatili bilang magkasunod ngunit magkahiwalay na sugnay: ''Pinabagsak nila si Gedalias, at namatay siya.'''
  alternative: Pinatay nila si Gedalias; o pinabagsak nila siya kaya namatay siya.
  rationale: Hindi pinagsasama ang וַיַּכּוּ at וַיָּמֹת sa iisang pandiwa at hindi ginagawang tahasang sanhi-bunga ang payak na koordinasyon ng Hebreo.
- issue: Saklaw ng pagpatay sa mga taga-Juda at mga Caldeo
  choice: Ginamit ang 'pati' upang ipakita na sila rin ang mga bagay ng pandiwang 'pinabagsak.'
  alternative: Kasama ng namatay si Gedalias ang mga taga-Juda at mga Caldeo.
  rationale: Ang Hebreo ay nagdaragdag ng dalawang tuwirang layon sa pamamagitan ng אֶת; iniiwasang ipahiwatig na ang singular na וַיָּמֹת ay gramatikal na tumutukoy rin sa lahat, bagaman malinaw sa konteksto na pinatay sila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit malinaw na mga anyong pangalan na Ismael, Netanias, Elisama, Gedalias, Caldeo, at Mizpa. Iniwasan ang makalumang 'at nangyari' bilang buong panimulang pormula at ang masyadong literal na 'binhi ng paghahari.'
