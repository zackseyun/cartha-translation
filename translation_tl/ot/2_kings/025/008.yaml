base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: tl
  text: At sa ikalimang buwan, sa ikapitong araw ng buwan—iyon ang ikalabinsiyam na taon ng paghahari ni Haring Nebucadnezar, na hari ng Babilonia—dumating sa Jerusalem si Nebuzaradan, ang pinuno ng mga tanod[a] at lingkod ng hari ng Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinuno ng mga tagapagkatay”; malamang na titulo ito ng pinuno ng mga tanod ng hari o ng mga tagapagpatupad ng hatol na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: At nang ikalimang buwan
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, at natural sa Filipino ang “nang ikalimang buwan” bilang panandang panahon.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: sa ikapitong araw ng buwan
  rationale: Tahasang isinama ang “araw,” na likas na ipinahihiwatig ng pormulang Hebreo sa petsa.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה
  choice: iyon ang ikalabinsiyam na taon ng paghahari
  rationale: Ang “iyon” ay tumutukoy sa panahong binanggit; idinagdag ang “ng paghahari” upang malinaw na maipahayag sa Filipino ang pagtatala ayon sa taon ng hari.
- source_word: לַמֶּלֶךְ נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: ni Haring Nebucadnezar, na hari ng Babilonia
  rationale: Ipinahahayag ang regnal reckoning sa natural na Filipino habang pinananatili ang pagkakakilanlan niya bilang hari ng Babilonia.
- source_word: בָּא
  choice: dumating
  rationale: Sa kontekstong patungo sa Jerusalem, ang “dumating” ang malinaw at natural na katumbas ng karaniwang pandiwang בוא.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Transliterasyon ng pangalang pantangi ayon sa anyong malapit sa pinagmulang Hebreo.
- source_word: רַב טַבָּחִים
  choice: ang pinuno ng mga tanod
  rationale: Sa kontekstong maharlikang Babilonio, tumutukoy ang titulo sa pinuno ng pangkat na nagbabantay at maaari ring magsagawa ng pagbitay; inilalahad sa talababa ang literal na saklaw.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: lingkod ng hari ng Babilonia
  rationale: Pinananatili ng “lingkod” ang malawak na diwa ng עֶבֶד bilang taong nasa paglilingkod o opisyal na nasasakupan ng hari, nang hindi tiyak na tinatawag siyang alipin.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
theological_decisions: []
