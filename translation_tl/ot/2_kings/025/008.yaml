  to: At sa ikalimang buwan, sa ikapitong araw ng buwan—iyon ang ikalabinsiyam na taon ng paghahari ni Haring Nebucadnezar, na hari ng Babilonia—dumating sa Jerusalem si Nebuzaradan, ang pinuno ng mga tanod[a] at lingkod ng hari ng Babilonia.
