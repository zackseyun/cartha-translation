base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: tl
  text: Tungkol naman sa mga taong nanatili sa lupain ng Juda[a], na iniwan doon ni Nebucadnezar na hari ng Babilonia, itinalaga niya si Gedalias, anak ni Ahicam na anak ni Safan, na mamahala sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong naiwan sa lupain ng Juda”; maaaring isalin sa dalawang paraang ito ang pandiwaring Hebreo, na tumutukoy sa mga naroon pa matapos ang mga pagpapatapon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: mga tao
  rationale: Likas na kolektibong pagtukoy sa populasyon sa makabagong Filipino.
- source_word: הַנִּשְׁאָר
  choice: mga taong nanatili
  rationale: Inilalarawan ang mga naiwan matapos ang pagpapatapon nang hindi ginagamit ang teolohikal na kargadong katawagang “nalabi.”
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Pinananatili ang heograpikal at teritoryal na diwa ng אֶרֶץ.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: na iniwan doon
  rationale: 'Ipinapahayag ang causative na diwa ng Hiphil: si Nebucadnezar ang nag-iwan sa kanila sa Juda; nilinaw ng “doon” ang lokasyon sa natural na Filipino.'
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebucadnezar na hari ng Babilonia
  rationale: Karaniwang anyong Filipino ng mga pangalan at tuwirang pinananatili ang titulong maharlika.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: itinalaga niyang mamahala sa kanila
  rationale: Natural na Filipino para sa opisyal na paghirang at pangangasiwang ipinahihiwatig ng פקד na may עַל.
- source_word: גְּדַלְיָהוּ
  choice: Gedalias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: anak ni Ahicam at apo ni Safan
  rationale: Malinaw na ipinahahayag sa Filipino ang magkakasunod na salinlahi nang hindi napagkakamalang kapwa ama ang dalawang pangalan.
- source_word: וְ
  choice: Tungkol naman sa
  rationale: Natural na panandang Filipino sa pagbabago ng paksa sa salaysay.
