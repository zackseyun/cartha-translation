translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang “nalabi” upang huwag lagyan ng di-tiyak na teolohikal na diin ang payak na paglalarawan sa populasyong nanatili o naiwan.
