    issue: Ang "apo ni Safan" ay ipinalit sa "anak ni Ahicam, anak ni Safan."
    rationale: Inuulit ng Hebreo ang בֶּן upang ibigay ang patronimikong kadena. Dapat itong panatilihin sa salin sa halip na i-compress bilang relasyong "apo," kahit tama ang hinuha sa ugnayan.
