  source_fidelity: Tumpak na naipapahayag ng draft ang tatlong hari, ang paglibot, ang kawalan ng tubig, at ang mga hayop na kasama ng pangkat. Gayunman, ang “sa rutang pitong araw ang lakbay” ay hindi natural na pagbubuo sa modernong Tagalog at maaaring hindi agad maunawaan bilang rutang inaabot ng pitong araw. Ang talababa ay dapat ding magbigay ng mas tumpak na literal na larawan na “sa paanan nila,” sa halip na “nasa kanilang mga paa.”
  naturalness: Maayos ang register na salaysay at ang “humayo” ay katanggap-tanggap. Ang rebisyon sa parirala ng ruta ang kinakailangan upang maging malinaw at idiomatiko ang pangungusap nang hindi nagpapasya kung eksaktong detour, circuit, o haba lamang ng paglalakbay ang diin.
  terminology: Ang “hari,” “kampo,” at “mga alagang hayop” ay angkop. Pinanatili ang mga pangalang Israel, Juda, at Edom. Ang “mga alagang hayop” ay wastong kolektibong paglalapat ng בְּהֵמָה sa kontekstong ito.
