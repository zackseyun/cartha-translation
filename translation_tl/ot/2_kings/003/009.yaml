base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: tl
  text: Kaya humayo ang hari ng Israel, kasama ang hari ng Juda at ang hari ng Edom. Lumibot sila sa rutang inaabot ng pitong araw, ngunit walang tubig para sa kampo o para sa mga alagang hayop na kasama nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang hayop na nasa paanan nila,” isang idyoma para sa mga hayop na kasama o sumusunod sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: humayo
  rationale: Payak na pandiwang nagsisimula sa salaysay ng paglalakbay; ipinahihiwatig ng konteksto ang aspektong militar nang hindi iyon idinaragdag sa pandiwa.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: ang hari ng Israel ... ang hari ng Juda at ang hari ng Edom
  rationale: Inuulit ang titulong “hari” upang mapanatili ang koordinasyon ng tatlong pinuno sa Hebreo.
- source_word: וַיָּסֹבּוּ
  choice: lumibot sila
  rationale: Ang סבב ay nagpapahiwatig ng pag-ikot o pagdaan sa hindi tuwirang ruta; pinananatili ng “lumibot” ang diwang ito sa natural na Tagalog.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: sa rutang pitong araw ang lakbay
  rationale: Maaaring tumukoy ang דֶּרֶךְ sa daan, ruta, o paglalakbay. Pinananatili ng salin ang paglalarawan sa ruta ayon sa tagal ng paglalakbay nang hindi nilulutas nang higit sa teksto ang eksaktong ugnayan nito sa paglibot.
- source_word: וְלֹא הָיָה מַיִם
  choice: ngunit walang tubig
  rationale: Direkta at natural na salin ng sugnay na nagsasaad na walang tubig na makukuha.
- source_word: לַמַּחֲנֶה
  choice: para sa kampo
  rationale: Ang מַחֲנֶה ay maaaring kampo o hukbong nakahimpil; sapat ang “kampo” at hindi nagdaragdag ng detalyeng hindi tahasang binanggit.
- source_word: וְלַבְּהֵמָה
  choice: o sa mga alagang hayop
  rationale: Kolektibong tumutukoy ang בְּהֵמָה sa mga domestikadong hayop na kasama ng pangkat; natural sa Tagalog ang maramihang anyo.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: na kasama nila
  rationale: Literal na “nasa kanilang mga paa,” isang idyomang tumutukoy sa mga hayop na kasabay o sumusunod sa kanila. Isinasalin ang kahulugan sa teksto at inilalagay ang literal na larawan sa talababa.
