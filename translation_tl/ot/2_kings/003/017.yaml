  to: 'Sapagkat ganito ang sabi ni Yahweh: “Hindi kayo makakakita ng hangin o ulan, ngunit ang daluyan ng tubig na iyon[a] ay mapupuno ng tubig, at iinom kayo, pati ang inyong mga alagang hayop at iba pa ninyong hayop.”'
