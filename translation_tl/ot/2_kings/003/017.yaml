  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: tl
  text: 'Sapagkat ganito ang sabi ni Yahweh: “Hindi kayo makakakita ng hangin o ulan, ngunit ang daluyan ng tubig na iyon[a] ay mapupuno ng tubig, at iinom kayo, pati ang inyong mga alagang hayop at iba pa ninyong hayop.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lambak na iyon” o “wadi na iyon.” Ang salitang Hebreo na נחל ay madalas tumukoy sa isang wadi, isang pana-panahong daluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: כִּי כֹה אָמַר
  choice: Sapagkat ganito ang sinabi
  rationale: Pinananatili nito ang paliwanag na gamit ng כִּי at ang pormula ng pagpapahayag, sa natural at marangal na Tagalog.
- source_word: תִרְאוּ
  choice: Hindi kayo makakakita
  rationale: Ang imperfect ay tumutukoy rito sa hindi nila masasaksihan habang nagaganap ang ipinangakong pagtustos.
- source_word: רוּחַ
  choice: hangin
  rationale: Sa pagkakaparis nito sa ulan at sa kontekstong pangpanahon, hangin ang malinaw na kahulugan.
- source_word: גֶשֶׁם
  choice: ulan
  rationale: Ito ang karaniwang salin sa kontekstong pangpanahon.
- source_word: הַנַּחַל הַהוּא
  choice: ang tuyong batis na iyon
  rationale: Ang נחל ay karaniwang pana-panahong daluyan ng tubig sa tuyong lupain. Mas madaling maunawaan sa modernong Tagalog ang 'tuyong batis' kaysa sa hiram na salitang 'wadi,' habang pinananatili ng talababa ang mga posibleng diwa.
- source_word: יִמָּלֵא מָיִם
  choice: ay mapupuno ng tubig
  rationale: 'Ipinahahayag ng Niphal ang resultang kalagayan: mapupuno ng tubig ang daluyan.'
- source_word: וּשְׁתִיתֶם
  choice: iinom kayo
  rationale: Natural na panghinaharap sa Tagalog at naaayon sa pagkakasunod-sunod ng pangako.
- source_word: מִקְנֵיכֶם
  choice: inyong mga alagang hayop
  rationale: Tumutukoy ito sa mga hayop o kawan na pag-aari nila, hindi sa mga ari-arian sa pangkalahatan.
- source_word: בְהֶמְתְּכֶם
  choice: iba pang mga hayop
  rationale: Pinananatili ang pagkakaiba nito sa מִקְנֵיכֶם at ipinahihiwatig na mas malawak ang ikalawang kategorya nang hindi eksaktong itinatakda ang saklaw.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton יְהוָה; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tuyong batis' bilang malinaw na katumbas ng heograpikong terminong wadi; iniwasan ang teknikal na hiram na salita sa pangunahing teksto. Ang 'pati ... at iba pang ...' ay nagpapanatili sa dalawang magkaugnay na katawagang Hebreo para sa mga hayop nang hindi nagmumukhang tautolohiya.
