base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: tl
  text: Ngunit ngayon, magdala kayo sa akin ng isang manunugtog.[a] At habang tumutugtog ang manunugtog, dumating sa kanya ang kamay ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang musikero” o “isang tumutugtog ng instrumento.” Sa Hebreo, pangkalahatan itong tumutukoy sa isang taong tumutugtog at hindi tinutukoy kung anong instrumento.
    reason: lexical_alternative
  - marker: b
    text: Ang “kamay ni Yahweh” ay isang idyomang Hebreo na maaaring tumukoy sa kapangyarihan ng Diyos o sa impluwensiyang propetiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahihiwatig nito ang agarang paglipat mula sa naunang pananalita tungo sa bagong utos; natural na naipapahayag ng “Ngunit ngayon” ang pagbabagong iyon.
- source_word: קְחוּ לִי
  choice: magdala kayo sa akin
  rationale: Ang pangmaramihang pautos na may panghalip na datibo ay nangangahulugang kumuha o magdala para sa nagsasalita. Nililinaw ng “kayo” ang bilang ng pandiwa sa Hebreo.
- source_word: מְנַגֵּן
  choice: isang manunugtog
  rationale: Tumutukoy ang participle ng נגן sa taong tumutugtog ng instrumentong pangmusika, ngunit walang tinukoy na instrumento. Mas tiyak kaysa sa malawak na “musikero” at hindi nagdaragdag ng partikular na instrumento ang “manunugtog.”
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: At habang tumutugtog ang manunugtog
  rationale: Natural nitong ipinapahayag ang kasabay na pangyayaring nagsilbing kalagayan para sa sumunod na kilos, nang hindi mekanikal na inuulit ang pormulang pasalaysay sa Hebreo.
- source_word: יַד יְהוָה
  choice: ang kamay ni Yahweh
  rationale: Pinananatili ang konkretong larawang Hebreo at hindi agad ipinapakahulugan bilang kapangyarihan o inspirasyong propetiko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וַתְּהִי עָלָיו
  choice: sumakanya
  rationale: Ipinakikita ng anyong pangyayari na ang kamay ni Yahweh ay dumating o nalagay sa kanya. Ang “sumakanya” ay maikli, marangal, at akma sa idyomang biblikal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapanatili sa idyomang יַד יְהוָה
  choice: sumakanya ang kamay ni Yahweh
  alternative: sumakanya ang kapangyarihan ni Yahweh; pinuspos siya ng inspirasyong propetiko ni Yahweh
  rationale: Maaaring tumukoy ang parirala sa kapangyarihan o impluwensiyang propetiko, ngunit hindi ito tahasang nililinaw ng Hebreo. Pinananatili ng salin ang larawan at ang saklaw ng kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “manunugtog” upang mapanatili ang di-tiyak na instrumento, at ang “sumakanya ang kamay ni Yahweh” upang mapanatili ang idyomang Hebreo. Inilagay ang mga panandang talababa sa mga pariralang aktuwal na ipinaliliwanag ng mga ito.
