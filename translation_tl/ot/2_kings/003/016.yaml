translation:
  language: tl
  text: At sinabi niya, “Ganito ang sabi ni Yahweh:[c] ‘Gawin mong puno ng mga hukay ang daluyang ito.[a][b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang pana-panahong daluyan ng tubig; maaari rin itong isaling “wadi,” “lambak,” “sahig ng ilog,” o “batis.”
    reason: lexical_alternative
  - marker: b
    text: 'Inuulit sa Hebreo ang “mga hukay” bilang pagdidiin: literal, “Gawin ang daluyang ito na mga hukay, mga hukay,” ibig sabihin, lagyan ito ng maraming hukay o ng mga hukay sa buong lugar.'
    reason: lexical_alternative
  - marker: c
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang YHWH; tradisyonal din itong isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili nito ang karaniwang pagkakasunod-sunod ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng tiyak na temporal na kahulugang wala sa Hebreo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Likas at marangal itong anyo sa modernong Tagalog para sa pormal na pahayag ng isang propeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat nito ang personal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: עָשֹׂה
  choice: Punuin ninyo
  rationale: Sa kontekstong ito, ipinahahayag ng malawak na pandiwang עשה ang resultang dapat gawin sa agusan. Ang “punuin” ay natural sa Tagalog at hindi kasingtiyak ng “hukayin,” bagaman ipinahihiwatig ng mga hukay ang paghuhukay.
- source_word: הַנַּחַל הַזֶּה
  choice: ang tuyong agusang ito
  rationale: Ang נחל ay maaaring tumukoy sa isang pana-panahong daluyan ng tubig o tuyong ilog. Mas madaling maunawaan ng karaniwang mambabasa ang “tuyong agusan” kaysa sa hiram na “wadi,” habang pinananatili ang heograpikong diwa.
- source_word: גֵּבִים גֵּבִים
  choice: ng mga hukay
  rationale: Ang pag-uulit sa Hebreo ay nagpapahiwatig ng marami o kalat-kalat na mga hukay. Naipapahayag ito nang natural sa Tagalog sa “punuin … ng mga hukay,” habang inilalahad sa talababa ang literal na pag-uulit.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon; kinikilala sa talababa ang tradisyonal na saling gumagamit ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tuyong agusan” sa halip na ang teknikal na hiram na “wadi,” at pinanatili sa talababa ang saklaw ng kahulugan. Ang maramihang “ninyo” ay angkop sa utos na nakatuon sa pangkat na kailangang gumawa ng maraming hukay.
