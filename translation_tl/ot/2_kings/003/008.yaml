  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: tl
  text: At sinabi niya, “Sa aling daan tayo aahon?” At sinabi niya, “Sa daan sa ilang ng Edom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya / Sumagot siya
  rationale: Ang wayyiqtol ng אמר ay karaniwang pagsulong ng salaysay. Sa ikalawang paglitaw, natural sa Filipino ang “Sumagot siya” dahil tugon ito sa tanong, nang hindi nagdaragdag ng nilalaman.
- source_word: אֵי זֶה
  choice: Sa aling
  rationale: Kasama ng הַדֶּרֶךְ, ang parirala ay idyomatikong nagtatanong kung alin sa mga posibleng ruta ang tatahakin.
- source_word: הַדֶּרֶךְ
  choice: daan
  rationale: Saklaw ng דֶּרֶךְ ang daan o ruta. Ang “daan” ay natural at dignidad na katawagan sa modernong Tagalog.
- source_word: נַעֲלֶה
  choice: tayo aahon
  rationale: Pinananatili ng “aahon” ang pangunahing diwa ng עלה na ‘umakyat/umaahon,’ habang hindi ipinapasok ang mas tiyak na militar na kahulugang ‘sumalakay.’
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Sa daang dumaraan sa ilang ng Edom
  rationale: Ang walang-pandiwang sagot ay tumutukoy sa ruta. Nililinaw ng “dumaraan sa” ang relasyong pangruta sa natural na Filipino; ang “ilang” ay angkop sa מִדְבָּר at hindi kailangang mangahulugang mabuhanging disyerto.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pinananatili ang karaniwang transliterasyon ng pangalang pantangi.
