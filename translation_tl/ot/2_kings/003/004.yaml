  to: Si Mesha na hari ng Moab ay isang tagapag-alaga ng tupa, at nakagawian niyang magbigay sa hari ng Israel, bilang tributo, ng isang daang libong batang tupa at ng lana mula sa isang daang libong lalaking tupa.[a]
