  naturalness: 'May maliit ngunit kapansin-pansing suliranin sa “nakaugaliang magbigay”: impersonal ito at walang malinaw na ugnayan sa paksang si Mesha. Mas natural at malinaw ang “nakagawian niyang magbigay.” Ang “Mesha” ay mas malapit din sa anyong Hebreo at sa English audit trail kaysa “Mesa.”'
  terminology: Ang “tagapag-alaga ng tupa,” “tributo,” “batang tupa,” at “lalaking tupa” ay angkop sa modernong Filipino at sa marangal na rehistro. Pinananatili ang “lana” para sa צָמֶר at ang tala upang ipakita ang sintaktikong ambiguwidad.
