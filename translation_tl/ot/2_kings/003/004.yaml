base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: tl
  text: Si Mesha na hari ng Moab ay isang tagapag-alaga ng tupa, at nakagawian niyang magbigay sa hari ng Israel, bilang tributo, ng isang daang libong batang tupa at ng lana mula sa isang daang libong lalaking tupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “isang daang libong lalaking tupa, lana.” Pinaikli ang pagkakasabi, kaya maaari itong mangahulugang “isang daang libong lalaking tupang may lana,” o, na mas malamang sa konteksto, “ang lana mula sa isang daang libong lalaking tupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: tagapag-alaga ng mga tupa
  rationale: Tumutukoy ito sa isang taong nagpapastol o nagpaparami ng mga tupa bilang hanapbuhay. Likas at malinaw sa makabagong Filipino ang “tagapag-alaga ng mga tupa.”
- source_word: וְהֵשִׁיב
  choice: nakaugaliang magbigay ... bilang tributo
  rationale: Ang Hiphil ng שוב sa kontekstong ito ay tumutukoy sa palagian o nakaugaliang pagbabayad sa hari. Ipinahahayag ng salin ang aspektong nakagawian nang hindi nagtatakda ng dalas na hindi tahasang binanggit.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: isang daang libong batang tupa
  rationale: Ang כָּרִים ay tumutukoy sa mga batang tupa, malamang mga batang tupang lalaki. Pinananatili ng “batang tupa” ang natural na anyo ng talaan ng tributo nang hindi labis na nagpapakipot sa kahulugan.
- source_word: אֵילִים צָמֶר
  choice: ang lana mula sa isang daang libong lalaking tupa
  rationale: Elliptical ang Hebreo, na literal na naglalagay ng “lana” pagkatapos ng “mga lalaking tupa.” Pinakamalamang na lana mula sa gayong karaming tupa ang tributo, ngunit inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Moab / hari ng Israel
  rationale: Karaniwang salin ng mga pariralang construct, gamit ang kinikilalang mga pangalan ng lugar sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakaugaliang” upang ipakita ang paulit-ulit na pagbabayad nang hindi idinaragdag ang hindi tahasang salitang “taun-taon.” Inilagay ang talababa sa pariralang talagang may leksikal at sintaktikong ambiguwidad.
