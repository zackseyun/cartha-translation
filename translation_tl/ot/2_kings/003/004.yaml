    rationale: Ang “Mesha” ay mas malinaw na kumakatawan sa pangalang מֵישַׁע at umaayon sa audit trail; iniiwasan din nito ang di-sinasadyang kaugnayan ng “mesa” sa karaniwang pangngalan.
