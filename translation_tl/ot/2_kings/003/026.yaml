  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: tl
  text: Nang makita ng hari ng Moab na masyado nang mabigat para sa kanya ang labanan, nagsama siya ng pitong daang lalaking nakabunot ng tabak upang makalusot patungo sa hari ng Edom[a], ngunit hindi nila iyon nagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa hari ng Edom.” Sa kontekstong militar, ang pang-ukol sa Hebreo ay maaaring mangahulugang “patungo sa” o “laban sa.”
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: hindi niya kayang madaig ang labanan
  rationale: Ipinahahayag ng idyomang may חזק at מן na naging higit na makapangyarihan kaysa sa hari ang labanan. Natural ito sa makabagong Tagalog at malinaw na ipinakikitang hindi na niya kayang manaig, nang hindi dinaragdagan ang kahulugan.
- source_word: אֹתוֹ
  choice: nagsama siya
  rationale: Kasunod ng pandiwang 'kumuha,' ang anyong ito ay tumutukoy sa pagdadala ng hukbo kasama ng hari. Ang 'nagsama siya' ay likas sa Tagalog at iniiwasan ang malabong literal na 'kinuha niya siya.'
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: pitong daang lalaki
  rationale: Ang אִישׁ ay pantukoy sa bilang ng mga lalaking mandirigma. Pinananatili ng 'lalaki' ang tuwirang kahulugan; hindi na kailangang idagdag ang interpretatibong 'kawal.'
- source_word: שֹׁלֵף חֶרֶב
  choice: mga lalaking humahawak ng tabak
  rationale: Ang parirala ay literal na may larawan ng pagbunot o paghawak ng tabak at karaniwang tumutukoy sa mga mandirigmang handang lumaban. Ang 'humahawak ng tabak' ay dignified at natural habang pinananatili ang larawan.
- source_word: לְהַבְקִיעַ
  choice: upang makalusot
  rationale: Ang Hiphil ng בקע ay tumutukoy sa pagwasak o pagbubukas ng daan sa hanay ng kaaway. Sa kontekstong militar, natural na ipinahahayag ito ng 'makalusot.'
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: patungo sa hari ng Edom
  rationale: Maaaring direksiyon o pagalit ang אֶל. Pinananatili ng 'patungo sa' ang pangunahing direksiyonal na diwa at ang tunay na kalabuan; inilalagay sa talababa ang posibleng pagalit na pagbasa.
- source_word: וְלֹא יָכֹלוּ
  choice: ngunit hindi nila nagawa iyon
  rationale: Ang pangmaramihang pandiwa ay tumutukoy sa hari at sa kanyang mga tauhan bilang pangkat. Nililinaw ng 'iyon' na ang hindi nila nagawa ay ang pagtatangkang makalusot, nang hindi ipinapalagay ang higit pa sa teksto.
theological_decisions:
- issue: Kung ang hari ng Edom ang layunin ng pagtakas o ang puntirya ng pagsalakay
  choice: patungo sa hari ng Edom
  alternative: laban sa hari ng Edom
  rationale: Ang pang-ukol na אֶל ay maaaring mangahulugang 'patungo sa' o, sa kontekstong militar, 'laban sa.' Hindi tiyak na nilulutas ng talata ang layunin, kaya pinanatili sa pangunahing teksto ang direksiyonal na pagbasa at itinala ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tabak' bilang tradisyonal ngunit madaling maunawaang salita, at pinanatili sa talababa ang kalabuan ng direksiyon o pagkapoot sa אֶל.
