revisions:
- from: Giniba nila ang mga lunsod. Sa bawat matabang bahagi ng lupain[a], naghagis ang bawat lalaki ng kaniyang bato hanggang sa mapuno nila iyon. Binara nila ang bawat bukal at pinabagsak ang bawat mainam na puno[b], hanggang sa mga bato na lamang nito ang naiwan sa Kir-hareset[c]. Pagkatapos, pinalibutan iyon ng mga tagapaghilagpos at sinalakay[d].
  to: Giniba nila ang mga lunsod. Sa bawat mainam na bahagi ng lupain[a], naghagis ang bawat lalaki ng kaniyang bato at pinuno nila iyon. Binara nila ang bawat bukal at pinabagsak ang bawat mainam na puno[b], hanggang sa mga bato na lamang nito ang naiwan sa Kir-hareset[c]. Pagkatapos, pinalibutan iyon ng mga tagapaghilagpos at sinalakay[d].
  rationale: Inayos ang pangunahing teksto upang sundin nang mas malapit ang pagkakasunod ng mga pandiwang Hebreo (“naghagis ... at pinuno”), at pinalitan ang masyadong espesipikong “matabang” ng “mainam.” Inayos din ang dalawang talababa upang maging tumpak ang lexical na paliwanag at upang mapanatili, sa halip na lutasin, ang sintaktikong kawalang-katiyakan sa Kir-hareset.
