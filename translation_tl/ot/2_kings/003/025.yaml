  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: tl
  text: Giniba nila ang mga lunsod. Sa bawat mainam na bahagi ng lupain[a], naghagis ang bawat lalaki ng kaniyang bato at pinuno nila iyon. Binara nila ang bawat bukal at pinabagsak ang bawat mainam na puno[b], hanggang sa mga bato na lamang nito ang naiwan sa Kir-hareset[c]. Pagkatapos, pinalibutan iyon ng mga tagapaghilagpos at sinalakay[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat mabuting bukid” o “bawat mainam na parsela.” Ang salitang Hebreo ay tumutukoy sa isang takdang bahagi ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bawat mabuting puno”; maaaring tumukoy ito sa mahahalaga o kapaki-pakinabang na mga puno.
    reason: lexical_alternative
  - marker: c
    text: Ang Kir-hareset ay pangalan ng isang lugar, malamang na pangunahing napapaderang lunsod ng Moab sa kontekstong ito. Hindi ganap na tiyak ang sintaktikong pagkakaugnay ng pariralang Hebreo sa “Kir-hareset”; pinananatili ng salin ang karaniwang pagbasa na ang mga bato lamang nito ang naiwan doon.
    reason: cultural_and_syntactic_note
  - marker: d
    text: O “pinukol.” Literal na “sinaktan” o “pinukol” ang pandiwang Hebreo; dito ay ginagamit ito para sa pagsalakay sa lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Giniba nila ang mga lunsod
  rationale: Ang הרס ay konkretong tumutukoy sa paggiba o pagpapabagsak ng mga estruktura; natural sa Filipino ang “giniba” sa kontekstong militar.
- source_word: חֶלְקָה טוֹבָה
  choice: matabang bahagi ng lupain
  rationale: Ang חֶלְקָה ay isang takdang bahagi o parsela ng lupa. Ipinahihiwatig ng טוֹבָה sa kontekstong agrikultural na ito ay mabuti o produktibong lupain; pinananatili sa talababa ang mas literal na alternatibo.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: naghagis ang bawat lalaki ng kaniyang bato hanggang sa mapuno nila iyon
  rationale: Pinananatili ang distributibong anyo na “bawat lalaki ... kaniyang bato.” Ang “hanggang sa mapuno” ay malinaw na naghahayag ng bunga ng paulit-ulit na paghahagis nang hindi binabago ang tinutukoy na parsela.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: Binara nila ang bawat bukal
  rationale: Ang סתם ay pagharang o pagbabara, at sapat nang malinaw sa Filipino na ang bukal ay pinagmumulan ng tubig.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: pinabagsak ang bawat mainam na puno
  rationale: Ang Hiphil ng נפל ay “pinabagsak.” Ang “mainam” ay hindi naglilimita sa mga punong namumunga lamang at napapanatili ang malawak na diwa ng טוֹב.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: hanggang sa mga bato na lamang nito ang naiwan sa Kir-hareset
  rationale: Pinananatili ang di-karaniwang paglipat sa isahan at ang resultang larawan ng mga batong naiwan, nang hindi tahasang nilulutas kung paano eksaktong inuugnay ang parirala sa Kir-hareset.
- source_word: הַקַּלָּעִים
  choice: mga tagapaghilagpos
  rationale: Tumutukoy ang pangngalan sa mga mandirigmang gumagamit ng panghilagpos; mas malinaw ito kaysa sa hiram na katawagang militar.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: pinalibutan iyon ... at sinalakay
  rationale: Ang סבב ay pagpalibot. Literal na “hinampas/sinaktan” ang נכה, ngunit sa pagkubkob ng isang lunsod ang natural na Filipino na “sinalakay” ang naghahatid ng gamit nitong militar; nasa talababa ang literal na alternatibo.
