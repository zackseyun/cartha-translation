revisions:
- from: Sinabi ni Eliseo sa hari ng Israel, “Ano ang kinalaman ko sa iyo?[a] Pumunta ka sa mga propeta ng iyong ama at sa mga propeta ng iyong ina.” Ngunit sinabi sa kanya ng hari ng Israel, “Hindi,[b] sapagkat tinawag ni Yahweh ang tatlong haring ito upang ibigay sila sa kamay ng Moab.”
  to: Sinabi ni Eliseo sa hari ng Israel, “Ano ang kinalaman ko sa iyo?[a] Pumunta ka sa mga propeta ng iyong ama at sa mga propeta ng iyong ina.” Ngunit sinabi ng hari ng Israel sa kanya, “Hindi,[b] sapagkat tinawag ni Yahweh ang tatlong hari na ito upang ibigay sila sa kamay ng Moab.”
  rationale: Inayos lamang ang ayos ng salita upang maging mas natural sa modernong Filipino. Hindi binago ang kahulugan, ang antas ng katiyakan sa mahirap na אַל כִּי, ang pangalang Yahweh, o ang mga angkla at nilalaman ng mga talababa.
