    issue: Medyo di-natural na ayos ng mga sangkap sa ikalawang sugnay na pasalaysay.
    rationale: Bagaman naiintindihan ang “Ngunit sinabi sa kanya ng hari ng Israel,” mas likas at malinaw ang “Ngunit sinabi ng hari ng Israel sa kanya,” habang ganap na pinananatili ang וַיֹּאמֶר לוֹ מֶלֶךְ יִשְׂרָאֵל.
  - severity: low
