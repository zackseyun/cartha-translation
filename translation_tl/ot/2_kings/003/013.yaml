  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: tl
  text: Sinabi ni Eliseo sa hari ng Israel, “Ano ang kinalaman ko sa iyo?[a] Pumunta ka sa mga propeta ng iyong ama at sa mga propeta ng iyong ina.” Ngunit sinabi ng hari ng Israel sa kanya, “Hindi,[b] sapagkat tinawag ni Yahweh ang tatlong hari na ito upang ibigay sila sa kamay ng Moab.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “Ano ang mayroon sa akin at sa iyo?” Isa itong idyoma na nagpapahayag ng paglayo o pagtanggi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Huwag naman, sapagkat tinawag ni Yahweh ang tatlong hari na ito upang ibigay sila sa kamay ng Moab.” Mahirap unawain ang pariralang Hebreo at maaaring pakiusap ito sa halip na tahasang pagtutol.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Ano ang kinalaman ko sa iyo?
  rationale: Natural na katumbas sa modernong Tagalog ng idyomang Hebreo na nagpapahayag ng paglayo o pagtanggi, hindi literal na tanong tungkol sa pag-aari.
- source_word: לֵךְ
  choice: Pumunta ka
  rationale: Tuwirang pautos na malinaw at natural sa Tagalog.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: mga propeta ng iyong ama ... mga propeta ng iyong ina
  rationale: Pinananatili ang madiing pagtukoy sa magkabilang magulang at sa mga propetang kaugnay ng sambahayan ng hari.
- source_word: אַל כִּי
  choice: Hindi, sapagkat
  rationale: Maikli at mahirap ang pariralang Hebreo. Ipinapahayag dito ang pagtutol ng hari, habang ang talababa ay nagpapanatili sa posibleng pagbasa bilang pakiusap.
- source_word: קָרָא
  choice: tinawag
  rationale: Malapit sa malawak na kahulugan ng pandiwang Hebreo at hindi ipinapasok sa teksto ang mas tiyak na ideya ng pagtitipon.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ang tatlong haring ito
  rationale: Natural na ayos sa Tagalog at pinananatili ang bilang, demonstratibo, at titulong hari.
- source_word: לָתֵת אוֹתָם
  choice: upang ibigay sila
  rationale: Tuwirang sinasalamin ang infinitibong maaaring magpahayag ng layunin o kinalabasan nang hindi ito higit na nililinaw kaysa sa Hebreo.
- source_word: בְּיַד מוֹאָב
  choice: sa kamay ng Moab
  rationale: Pinananatili ang larawang Hebreo ng kamay bilang kapangyarihan o kontrol, na nauunawaan din sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na Yahweh ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa salin.
- issue: Diin ng tugon na אַל כִּי
  choice: 'Pagtutol: “Hindi, sapagkat…”'
  alternative: 'Pakiusap: “Huwag naman, sapagkat…” o panaghoy: “Kahabag-habag, sapagkat…”'
  rationale: Pinapaboran ng konteksto ang pagtutol ng hari sa pagpapaalis sa kanya ni Eliseo, ngunit hindi ganap na tiyak ang maikling pariralang Hebreo kaya nakatala ang ibang posibilidad.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “kinalaman” para sa natural na idyoma, habang pinanatili ang “sa kamay ng Moab” upang maingatan ang larawan ng orihinal na Hebreo.
