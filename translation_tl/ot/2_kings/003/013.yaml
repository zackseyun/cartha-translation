    rationale: Ang “tatlong hari na ito” ay mas karaniwang modernong Filipino kaysa “tatlong haring ito”; kapwa tumpak, ngunit ang rebisyon ay nagpapakinis ng gamit nang walang pagbabagong kahulugan.
