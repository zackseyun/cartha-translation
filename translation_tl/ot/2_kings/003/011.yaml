id: 2KI.3.11
reference: 2 Kings 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: tl
  text: Sinabi ni Jehoshafat[a], “Wala bang propeta ni Yahweh rito upang sa pamamagitan niya ay sumangguni tayo kay Yahweh?” Sumagot ang isa sa mga lingkod ng hari ng Israel, “Narito si Eliseo na anak ni Safat[b], na nagbubuhos noon ng tubig sa mga kamay ni Elias.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “upang hanapin natin si Yahweh mula sa kanya.” Ang diwa ay sumangguni kay Yahweh sa pamamagitan ng propeta.'
    reason: lexical_alternative
  - marker: b
    text: Ang pagbubuhos ng tubig sa mga kamay ni Elias ay malamang na tumutukoy sa personal na paglilingkod ni Eliseo sa kanya, gaya ng pagbibigay ng tubig para sa paghuhugas ng kamay.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Wala bang
  rationale: Likas na anyong Tagalog para sa tanong na may pagtanggi, habang pinananatili ang diin ng Hebreo.
- source_word: נָבִיא לַיהוָה
  choice: propeta ni Yahweh
  rationale: Ipinahahayag ang kaugnayan ng propeta kay Yahweh sa payak at natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang nasa tekstong Hebreo.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: upang sa pamamagitan niya ay sumangguni tayo kay Yahweh
  rationale: Ang דרשׁ ay tumutukoy sa pagsangguni o paghingi ng patnubay kay Yahweh, at ang מֵאֹתוֹ ay nagpapakitang ang propeta ang tagapamagitan.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: isa sa mga lingkod ng hari ng Israel
  rationale: Ang 'lingkod' ay angkop sa konteksto ng maharlikang sambahayan nang hindi ipinapalagay ang tiyak na katungkulan.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: na nagbubuhos noon ng tubig sa mga kamay ni Elias
  rationale: Pinananatili ang kongkretong larawang Hebreo at ipinahihiwatig ng 'noon' ang dating paglilingkod nang hindi ito ginagawang simpleng paliwanag lamang.
- source_word: אֱלִישָׁע / שָׁפָט / אֵלִיָּהוּ
  choice: Eliseo / Safat / Elias
  rationale: Ginagamit ang mga pangalang matagal nang natural at madaling makilala sa tradisyong Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulo.
- issue: Paraan ng pagsangguni kay Yahweh sa pamamagitan ng propeta
  choice: sa pamamagitan niya ay sumangguni tayo kay Yahweh
  alternative: hanapin natin si Yahweh mula sa kanya
  rationale: Nililinaw ang papel ng propeta bilang tagapamagitan ng pagsangguni, ayon sa gamit ng דרשׁ at מֵאֹתוֹ, nang hindi ipinapalagay kung ano ang magiging sagot.
- issue: Pagbubuhos ng tubig sa mga kamay ni Elias
  choice: pinanatili ang literal na larawan
  alternative: na naging tagapaglingkod ni Elias
  rationale: Ang literal na larawan ay nagpapahiwatig ng personal na paglilingkod ngunit hindi tahasang pinapantayan ang parirala sa isang pormal na katungkulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “rito” at “narito” bilang natural na katumbas ng פֹּה. Pinanatili ang Hebreong larawan sa huling sugnay, samantalang ang talababa ang nagbibigay ng posibleng kahulugang pangkultura.
