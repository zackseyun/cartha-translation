  to: Gumawa siya ng masama sa paningin ni Yahweh, ngunit hindi tulad ng kanyang ama at ina,[a] sapagkat inalis niya ang haligi ni Baal[b] na ginawa ng kanyang ama.
  rationale: Pinalitan ang kalkadong "Ginawa niya ang masama" ng likas na Filipino na "Gumawa siya ng masama," at ang "gaya" ng mas karaniwang "tulad." Hindi binago ang saklaw ng paghahambing, ang kaugnayang paliwanag ng "sapagkat," o ang terminolohiyang Yahweh, Baal, at haligi. Inayos din ang pananalita ng talababa upang tumugma sa binagong pangunahing teksto at upang mapanatili ang kwalipikasyong ipinahihiwatig ng רַק nang hindi ipinipilit ang isang natatanging pagpapakahulugan.
