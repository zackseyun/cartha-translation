base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: tl
  text: Gumawa siya ng masama sa paningin ni Yahweh, ngunit hindi tulad ng kanyang ama at ina,[a] sapagkat inalis niya ang haligi ni Baal[b] na ginawa ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain na “hindi kasinsama ng kanyang ama at ina.” Nililimitahan ng salitang Hebreo ang naunang hatol: gumawa siya ng masama, ngunit hindi tulad—o hindi sa antas—ng kanyang mga magulang.'
    reason: lexical_alternative
  - marker: b
    text: O “sagradong haligi ni Baal” o “nakatayong bato ni Baal.” Tumutukoy ang salitang Hebreo sa isang haligi o batong itinatayo kaugnay ng pagsamba kay Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo na עשה + הרע at natural itong paghahayag ng masamang asal sa modernong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang larawang Hebreo ng pagsusuri o paghatol ayon kay Yahweh, habang malinaw at likas sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רַק
  choice: ngunit
  rationale: 'Dito, nililimitahan o kinukuwalipika ng particle ang naunang hatol: masama ang ginawa niya, ngunit hindi gaya ng kanyang mga magulang.'
- source_word: לֹא כְאָבִיו וּכְאִמּוֹ
  choice: hindi gaya ng kanyang ama at ina
  rationale: Tuwirang pinananatili ang paghahambing sa parehong magulang nang hindi ipinapasok sa pangunahing teksto ang interpretasyong tiyak na antas ng kasamaan ang tinutukoy.
- source_word: וַיָּסַר
  choice: sapagkat inalis niya
  rationale: Ang pandiwa ay nangangahulugang alisin. Ang “sapagkat” ay natural na nagpapahayag ng paliwanag na ipinahihiwatig ng pagkakasunod ng mga sugnay sa konteksto.
- source_word: מַצְּבַת הַבַּעַל
  choice: ang haligi ni Baal
  rationale: Ang מַצֵּבָה ay isang nakatayong bato o kultikong haligi. Maikli at hindi labis na interpretatibo ang “haligi,” samantalang nililinaw ng talababa ang gamit nito sa pagsamba.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: na ginawa ng kanyang ama
  rationale: Tumpak nitong tinutukoy ang ama bilang gumawa ng haligi; hindi kailangan sa Tagalog ang tahasang anyong pluperfect upang maipakita ang naunang kilos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Lakas ng paghahambing sa kasamaan ng kanyang mga magulang
  choice: hindi gaya ng kanyang ama at ina
  alternative: hindi kasinsama ng kanyang ama at ina
  rationale: Maaaring ipinahihiwatig ng konteksto na hindi siya umabot sa antas ng kanilang kasamaan, ngunit hindi tahasang sinasabi ng Hebreo ang “kasinsama.” Kaya pinananatili sa teksto ang mas malawak na paghahambing at inilalagay sa talababa ang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang “sa paningin ni Yahweh” at ang payak na “haligi ni Baal,” habang ginagamit ang mga talababa upang ipaliwanag ang tunay na mga alternatibong leksikal nang hindi nilulutas nang sapilitan ang ambiguwidad.
