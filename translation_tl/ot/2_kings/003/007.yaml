base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: tl
  text: Nagpunta siya at nagpadala ng mensahe kay Jehoshafat na hari ng Juda, na nagsasabi, “Naghimagsik laban sa akin ang hari ng Moab.[a] Sasama ka ba sa akin upang makipagdigma laban sa Moab?” Sumagot si Jehoshafat, “Sasama ako.[b] Ako’y gaya mo; ang bayan ko ay gaya ng bayan mo, at ang mga kabayo ko ay gaya ng mga kabayo mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kumalas sa akin.” Ang pandiwang Hebreo ay maaaring tumukoy sa politikal na paghihimagsik o sa paglabag sa katapatan; dito, tumutukoy ito sa pag-aalsa ng Moab laban sa pamamahala ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Aakyat ako.” Ang pandiwa ay madalas gamitin sa pagpunta sa labanan o sa paglalakbay patungo sa mas mataas na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya umalis siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at pinananatili ng “umalis” ang hiwalay na kilos ng pagpunta bago ang pagpapadala ng mensahe.
- source_word: וַיִּשְׁלַח אֶל
  choice: at nagpasabi kay
  rationale: Sa kasunod na tuwirang pahayag, ang parirala ay tumutukoy sa pagpapadala ng mensahe. Likas at maikli sa makabagong Tagalog ang “nagpasabi.”
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang inilalarawan ang katungkulan ni Jehoshafat bilang hari ng Juda.
- source_word: פָּשַׁע בִּי
  choice: Naghimagsik laban sa akin
  rationale: Sa kontekstong pampolitika, ang pandiwa ay tumutukoy sa pag-aalsa o pagtalikod ng isang nasasakupang hari sa kapangyarihan ng Israel.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Sasama ka ba sa akin
  rationale: Likas na Tagalog ito para sa paanyayang literal na “pupunta ka ba kasama ko,” habang pinananatili ang diwa ng magkasamang pagkilos.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: upang makipagdigma sa Moab
  rationale: Malinaw at natural na ipinahahayag ang patungong Moab na may layuning makidigma, nang hindi nagdaragdag ng detalye.
- source_word: אֶעֱלֶה
  choice: Sasama ako
  rationale: Ang literal na “aakyat ako” ay idiomatikong tumutukoy sa pagpunta o pagsama sa isang laban. Sa tugon sa tanong, natural sa Tagalog ang “Sasama ako,” habang inilalagay sa talababa ang literal na larawan.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Kung ano ka, gayon din ako
  rationale: Pinananatili nito ang mariing pormula ng pakikiisa at ang eliptikong pagtutumbas sa Hebreo sa dignidad na likas sa Tagalog.
- source_word: כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: ang bayan ko ay gaya ng bayan mo, at ang mga kabayo ko ay gaya ng mga kabayo mo
  rationale: Tapat na pinananatili ang magkatugmang estruktura at ang pangako ng ganap na suporta ng bayan at hukbong nakakabayo.
