    issue: Ang “umalis” ay mas makitid kaysa sa Hebreong וַיֵּלֶךְ.
    rationale: Ang pandiwa ay nagsasaad lamang na siya ay nagpunta; hindi nito tiyak na binibigyang-diin ang pag-alis mula sa isang partikular na lugar.
  - severity: medium
    issue: Ang “Kung ano ka, gayon din ako” ay hindi ang pinakatumpak na paghatid ng כָּמוֹנִי כָמוֹךָ.
    rationale: Ang Hebreo ay isang eliptikong pormula ng pagkakapantay at pagkakaisa. Ang “Ako’y gaya mo” ay mas malinaw na pinananatili ang pormulang ito nang hindi inililihis tungo sa paghahambing ng mga katangian.
