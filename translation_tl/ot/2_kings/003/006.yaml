translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tinipon para sa digmaan” sa halip na mas teknikal na “tinipon ang hukbo,” upang hindi tahasang palitan ang kolektibong “buong Israel” ng “hukbo.”
