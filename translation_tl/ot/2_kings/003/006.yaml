  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: tl
  text: Noong araw na iyon, umalis si Haring Jehoram mula sa Samaria at tinipon niya ang buong Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binilang ang buong Israel” o “siniyasat ang buong Israel.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbibilang o pagsisiyasat; sa kontekstong ito, malamang na tumutukoy ito sa pagtitipon o pagpapakilos ng mga puwersang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Karaniwang nagsasaad ang יצא ng paglabas o pag-alis. Natural sa Filipino ang “umalis” at hindi nito inuunahan ang pahiwatig na militar ng kasunod na pandiwa.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: si Haring Jehoram
  rationale: Natural na anyo sa modernong Filipino ang pamagat na sinusundan ng pangalan, at hinihingi ng personal na pangalan ang panandang “si.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Tumpak at natural na katumbas ng temporal na pariralang “sa araw na iyon” sa daloy ng salaysay.
- source_word: מִשֹּׁמְרוֹן
  choice: mula sa Samaria
  rationale: Ang מן ay nagmamarka ng pinagmulan; malinaw itong naihahayag ng “mula sa.”
- source_word: וַיִּפְקֹד
  choice: tinipon para sa digmaan
  rationale: Malawak ang saklaw ng פקד at maaari itong tumukoy sa pagbibilang, pagrerepaso, o pagtitipon ng hukbo. Sa konteksto ng kampanyang militar, malinaw at likas sa ordinaryong mambabasa ang “tinipon para sa digmaan,” habang pinananatili sa talababa ang ibang posibilidad.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili nito ang kolektibo at pampolitikang diwa ng Hebreong parirala, na maaaring tumukoy sa bayan o sa mga puwersa ng hilagang kaharian.
