  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: tl
  text: Maaga silang bumangon kinaumagahan, at sumikat ang araw sa tubig. Nakita ng mga Moabita ang tubig sa tapat nila, na mapula na parang dugo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Maagang bumangon ang mga Moabita kinaumagahan
  rationale: Ang Hiphil ng שׁכם ay nagsasaad ng maagang pagbangon. Ipinapahiwatig ng kasunod na sugnay na ang kolektibong Moab ang paksa; nilinaw ito bilang “mga Moabita” para sa natural na Tagalog.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: Sumikat ang araw sa ibabaw ng tubig
  rationale: Maaaring mangahulugan ang זרח ng pagsikat o pagliwanag. Ang “sumikat” ay likas sa Tagalog at akma sa liwanag ng araw na tumatama sa tubig.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: nakita nilang
  rationale: Ginagamit ang “Moab” bilang kolektibong tawag sa mga Moabita. Iniiwasan ng panghalip ang di-likas na pag-uulit matapos tukuyin ang mga Moabita sa unang pangungusap.
- source_word: מִנֶּגֶד
  choice: mula sa kinaroroonan nila
  rationale: Ipinahihiwatig ng parirala ang pagtingin mula sa tapat o kabilang panig. Ang saling ito ay natural habang pinananatili ang pananaw na ang tubig ay nakita mula sa kanilang posisyon.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: mapula na parang dugo ang tubig
  rationale: Pinananatili ang payak at matingkad na paghahambing ng Hebreo. Ang “mapula” ay angkop na panaguri sa nakikitang anyo ng tubig.
