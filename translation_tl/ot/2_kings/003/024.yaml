base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: tl
  text: Nang makarating ang mga Moabita sa kampo ng Israel, tumindig ang Israel at sinalakay ang Moab, at tumakas sila mula sa mga Israelita. Pagkatapos, pumasok ang mga Israelita roon[a] at patuloy na sinalakay ang Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumasok sa lupain” o “sumulong sa Moab.” Sa Hebreo, literal itong “pumasok sila roon”; malamang na ang hulaping pambabae ay tumutukoy sa lupain o nasasakupan, hindi tuwiran sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Sa kontekstong militar, ang salita ay tumutukoy sa kampo ng hukbo; natural at malinaw ang “kampo” sa makabagong Filipino.
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Ipinakikita ng קום ang biglaan at tiyak na pagkilos sa labanan nang hindi pa ipinapalit dito ang mismong ideya ng pagsalakay.
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: sinalakay / patuloy na sinalakay
  rationale: Sa kontekstong pandigma, natural na katumbas ang “sinalakay” para sa paghampas o pag-atake. Ang “patuloy na” ay naghahayag ng nagpapatuloy na kilos ng anyong infinitive sa huling sugnay.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: tumakas ... mula sa kanila
  rationale: Inihahatid nito sa likas na Filipino ang Hebreong idyoma ng pagtakas mula sa harapan o presensiya ng kalaban.
- source_word: וַיָּבֹאוּ בָהּ
  choice: pumasok ... roon
  rationale: Pinananatili ng “roon” ang maikli at bahagyang malabong pagtukoy ng pambabaeng hulaping בָּהּ, na malamang na tumutukoy sa lupain o nasasakupan.
- source_word: מוֹאָב
  choice: Moab / mga Moabita
  rationale: Pinanatili ang pangalang “Moab” bilang kolektibong katawagan sa bansang nilusob; ginamit ang “mga Moabita” sa panghalip na tumutukoy sa tumatakas upang maging malinaw at natural sa Filipino.
