  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: tl
  text: 'Sinabi ni Eliseo, “Buhay si Yahweh ng mga hukbo, na sa harapan niya ako nakatayo[a]: kung hindi lamang dahil iginagalang ko si Jehoshafat na hari ng Juda[b], hindi sana kita titingnan o papansinin man lang.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “na sa harap ng kanyang mukha ako nakatayo.” Maaari ring ipahiwatig ng idyomang ito ang paglilingkod bilang propeta: “na aking pinaglilingkuran.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, gumagamit ang Hebreo ng idyomang may diwang “iangat ang mukha” ni Jehoshafat, na nangangahulugang magpakita sa kanya ng paggalang o pabor. Maaari ring isalin, “kung hindi lamang dahil isinasaalang-alang ko ang presensya ni Jehoshafat na hari ng Juda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Buhay si Yahweh ng mga hukbo
  rationale: Pinananatili nito ang anyo at bigat ng karaniwang Hebreong panunumpa. Ang “mga hukbo” ay hindi labis na nagtatakda kung makalangit na hukbo, mga anghel, o lahat ng puwersang nasa ilalim ng kapangyarihan ng Diyos ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: na sa harapan niya ako nakatayo
  rationale: Pinananatili ang literal na larawan ng pagtayo sa harapan ng Diyos, habang hinahayaang marinig din ang pahiwatig ng paglilingkod bilang propeta.
- source_word: לוּלֵי
  choice: kung hindi lamang dahil
  rationale: Natural nitong ipinahahayag sa Tagalog ang pasubaling eksepsiyon na dahilan kung bakit pumayag si Eliseong tumugon.
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: iginagalang ko si Jehoshafat
  rationale: Ang literal na larawang “iangat ang mukha” ay isang idyoma para sa pagpapakita ng paggalang o pabor. Isinalin ang kahulugan nang natural at inilagay sa talababa ang literal na larawan.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: hindi sana kita titingnan o papansinin man lang
  rationale: Ginawang hayag ang negatibong diwa ng pormulang panunumpa. Ang “titingnan” at “papansinin” ay nagpapanatili sa dalawang magkaugnay na pandiwa at sa mariing pagtanggi ni Eliseo nang hindi lumilikha ng alanganing Tagalog.
- source_word: יְהוֹשָׁפָט ... יְהוּדָה
  choice: Jehoshafat ... Juda
  rationale: Ginamit ang mga pangalang karaniwang nakikilala sa tradisyong Tagalog sa Bibliya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ang katayuan ng propeta sa harapan ng Diyos
  choice: sa harapan niya ako nakatayo
  alternative: na aking pinaglilingkuran
  rationale: Pinananatili ang kongkretong larawan at ang tunay na lawak ng idyoma; ipinapaliwanag sa talababa na maaari rin itong magpahiwatig ng paglilingkod bilang propeta.
- issue: Paggalang kay Jehoshafat bilang dahilan ng pagtugon
  choice: iginagalang ko si Jehoshafat
  alternative: isinasaalang-alang ko ang presensya ni Jehoshafat
  rationale: Ang parirala ay idyomatikong tumutukoy sa pagpapakita ng paggalang o pabor. Ang napiling anyo ay malinaw at natural sa Tagalog, samantalang pinananatili sa talababa ang literal na imahen at posibleng alternatibong pagkakabuo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang Hebreong anyo ng panunumpa na “Buhay si Yahweh,” ang literal na larawan ng pagtayo sa harapan ng Diyos, at ang mariing pares na “titingnan o papansinin,” habang ipinaliwanag sa mga talababa ang mga idyomang hindi likas isalin nang salita-sa-salita.
