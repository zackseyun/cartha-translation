base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: tl
  text: Kinaumagahan, sa oras ng paghahandog ng handog na butil[a], narito, may tubig na dumarating mula sa gawing Edom[b], at napuno ng tubig ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nang ihandog ang handog na butil.” Literal sa Hebreo, “sa pag-akyat ng handog na butil,” na gumagamit ng pananalitang pansakripisyo para sa paghahain nito sa altar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “mula sa daan ng Edom” o “sa pamamagitan ng Edom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas na panandang pasalaysay at pamanahon sa modernong Filipino; ipinagpapatuloy nito ang sunod-sunod na pangyayari nang hindi gumagamit ng makalumang pormula.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: sa oras ng paghahandog ng handog na butil
  rationale: Ipinahahayag ang χρονological na diwa ng כ prefixed infinitive at ang kontekstong pansakripisyo ng עלה; ang מִנְחָה ay partikular na handog na butil sa kontekstong ito.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang pantawag-pansing at masiglang puwersa ng Hebreong deiktikong kataga.
- source_word: מַיִם בָּאִים
  choice: may tubig na dumarating
  rationale: Ang participle ay naglalarawan ng tubig na nakikitang dumarating; ang 'tubig' ay likas na pangngalang di-mabilang sa Filipino.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: mula sa gawing Edom
  rationale: Natural na Filipino para sa pinanggagalingang direksiyon o ruta, habang pinananatili ang heograpikong sanggunian sa Edom.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: napuno ng tubig ang lupain
  rationale: Natural na resultative/passive na ayos sa Filipino. Ang הָאָרֶץ ay tumutukoy sa lupain o lugar, hindi sa buong daigdig; hindi kailangan sa Filipino ang tiyak na pantukoy sa muling pagbanggit sa tubig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pampanitikang “narito” upang madama ang bigla at kapansin-pansing paglitaw ng tubig. Ginamit ang “lupain” sa halip na “lupa” upang malinaw na tumukoy sa lugar o rehiyon.
