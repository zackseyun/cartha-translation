  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: tl
  text: Si Jehoram na anak ni Ahab ay naging hari ng Israel sa Samaria noong ikalabingwalong taon ni Jehoshafat na hari ng Juda[a], at naghari siya nang labindalawang taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring mas pormal: “At si Jehoram na anak ni Ahab ay naging hari…” Maaaring isalin ang pambungad na pang-ugnay sa Hebreo bilang “at.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: Si Jehoram
  rationale: Isinalin ang pangalan ayon sa anyong Hebreo at ginamit ang natural na panandang pantangi sa Filipino. Hindi inilagay sa pangunahing teksto ang pambungad na ו bilang “At” dahil maaari lamang itong magpatuloy ng salaysay; itinabi ang mas pormal na anyo sa talababa.
- source_word: בֶּן אַחְאָב
  choice: na anak ni Ahab
  rationale: Natural at tuwirang pagpapahayag ng ugnayang mag-ama sa modernong Filipino.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa unang sugnay, tumutukoy ang pandiwa sa pagluklok ni Jehoram, kaya ipinagkaiba ito sa hulíng sugnay na nagsasaad ng haba ng paghahari.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang “naging hari sa Israel” ay natural na idyomang Filipino para sa pamamahala sa bayan, nang hindi ipinahihiwatig na ang Israel ang pag-aari ng hari.
- source_word: בְּ/שֹׁמְרוֹן
  choice: mula sa Samaria
  rationale: Ipinakikita nitong ang Samaria ang luklukan o kabiserang pinagmumulan ng kanyang pamamahala, sa halip na ipakahulugang Israel at Samaria ang iisang lokasyon.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: noong ikalabingwalong taon ng paghahari ni Jehoshafat na hari ng Juda
  rationale: Nilinaw sa natural na Filipino ang karaniwang pormula ng pagtutugma ng mga taon ng paghahari; ang “paghahari” ay ipinahihiwatig ng Hebreong pormula.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Naghari siya nang labindalawang taon
  rationale: Dito ang מלך ay tumutukoy sa tagal ng pamumuno. Ginawang hiwalay na pangungusap para sa malinaw at natural na daloy sa Filipino.
