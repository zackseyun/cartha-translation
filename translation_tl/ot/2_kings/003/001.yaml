    issue: Ang “mula sa Samaria” ay hindi tumpak na salin ng בְּשֹׁמְרוֹן.
    rationale: 'Ang pang-ukol na בְּ ay nagsasaad ng kinaroroonan: “sa/in Samaria.” Ang “mula sa” ay nagdaragdag ng direksiyong o pinagmumulang hindi nasa Hebreo.'
  revised_text: Si Jehoram na anak ni Ahab ay naging hari ng Israel sa Samaria noong ikalabingwalong taon ni Jehoshafat na hari ng Juda[a], at naghari siya nang labindalawang taon.
