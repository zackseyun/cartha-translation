    reason: lexical_alternative
  revision_rationale: Pinalitan ang “mula sa Samaria” ng “sa Samaria” upang tapat na maipahayag ang lokatibong Hebreo. Ginamit ang “hari ng Israel,” isang natural na Filipino para sa hari na namamahala sa Israel, at pinanatili ang footnote anchor at nilalaman nito.
