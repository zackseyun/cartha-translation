  source_fidelity: Tumpak sa kabuuan ang paghahatid ng balita, paglusob ng mga hari, pagpapatawag para sa mobilisasyon, saklaw ng idyomang “nagsusuot ng sinturon,” at pagkuha ng posisyon sa hangganan. Gayunman, ang “Kaya” ay nagdaragdag ng tahasang ugnayang sanhi kung saan sunod-sunod na salaysay lamang ang ipinahahayag ng waw. Mas mainam ang “At.”
  naturalness: Natural ang karamihan ng salin. Ang “hangganan” ay mas karaniwan at mas pamantayang modernong Filipino kaysa “hanggahan.” Ang pagbubuo ng pagpapatawag at ng pangkat na saklaw nito sa isang tuwirang parirala ay nagpapalinaw rin ng tinutukoy ng “sila.”
