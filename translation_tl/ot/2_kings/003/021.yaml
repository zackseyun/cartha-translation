base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: tl
  text: Nabalitaan ng buong Moab na sumulong ang mga hari upang makipaglaban sa kanila. At ipinatawag ang lahat ng lalaking sapat na ang gulang upang magsuot ng sinturon at ang mga mas matanda pa[a], at pumuwesto sila sa hangganan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa bawat nagsusuot ng sinturon pataas,” isang idyoma para sa mga lalaking nasa gulang na maaaring lumahok sa labanan at sa mga mas matanda pa.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: buong Moab
  rationale: Ginagamit ang pangalang “Moab” bilang kolektibong tawag sa buong bayan; pinananatili ito sa halip na gawing tahasang “lahat ng Moabita.”
- source_word: שָׁמְעוּ
  choice: nabalitaan
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagkatanggap ng balita, hindi lamang sa pisikal na pandinig.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: na sumulong ang mga hari
  rationale: Ang עָלוּ ay literal na “umahon” o “pumaitaas,” ngunit sa kontekstong militar ay likas na ipinahahayag sa Filipino bilang “sumulong,” nang hindi pa ipinapalagay na nagsimula na ang pagsalakay.
- source_word: לְהִלָּחֶם בָּם
  choice: upang makipaglaban sa kanila
  rationale: Tuwirang ipinahahayag ang layuning makidigma laban sa Moab habang pinananatili ang malinaw na panghalip na maramihan.
- source_word: וַיִּצָּעֲקוּ
  choice: ipinatawag sila
  rationale: Dito ang pandiwa ay tumutukoy sa pagpapatawag o mobilisasyon ng mga tao, hindi lamang sa pagsigaw. Pinananatili ng anyong balintiyak ang di-tinukoy na nagpatawag.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: ang lahat ng lalaking sapat na ang gulang upang magsuot ng sinturon, pati ang mga mas matanda pa
  rationale: Pinananatili ang kongkretong larawan ng pagsusuot ng sinturon at nililinaw ang saklaw na mula sa itinakdang gulang pataas, sa halip na palitan ito agad ng interpretasyong “kayang humawak ng sandata.”
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: at pumuwesto sila sa hanggahan
  rationale: Ang “pumuwesto” ay likas na Filipino para sa pagtayo o pagkuha ng posisyon sa hanggahan at angkop sa kontekstong militar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nabalitaan,” “sumulong,” at “pumuwesto” para sa natural na daloy; pinanatili sa pangunahing teksto ang larawang Hebreo ng pagsusuot ng sinturon, habang ipinaliwanag sa talababa ang kahulugang pangkultura nito.
