  to: Nabalitaan ng buong Moab na sumulong ang mga hari upang makipaglaban sa kanila. At ipinatawag ang lahat ng lalaking sapat na ang gulang upang magsuot ng sinturon at ang mga mas matanda pa[a], at pumuwesto sila sa hangganan.
