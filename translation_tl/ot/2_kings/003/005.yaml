  text: וַ/יְהִ֖י כְּ/מ֣וֹת אַחְאָ֑ב וַ/יִּפְשַׁ֥ע מֶֽלֶךְ מוֹאָ֖ב בְּ/מֶ֥לֶךְ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: tl
  text: Nang mamatay si Ahab,[a] naghimagsik ang hari ng Moab laban sa hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkamatay ni Ahab.” Maaaring isalin sa alinman sa dalawang paraan ang temporal na pananalita sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: Nang mamatay
  rationale: Ang וַיְהִי ay karaniwang panandang pasalaysay, at ang כְּמוֹת ay temporal na pariralang maaaring mangahulugang “nang mamatay” o “pagkamatay.” Sa natural na modernong Tagalog, sapat nang ihayag ang paglipat ng pangyayari sa pamamagitan ng “Nang mamatay” nang hindi pilit na isinasalin nang hiwalay ang וַיְהִי.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Pinanatili ang nakasanayang transliterasyon ng pangalang pantangi.
- source_word: וַיִּפְשַׁע
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, ang פשע ay tumutukoy sa pag-aalsa o pagtanggi sa kapangyarihan ng isang nakatataas na hari. Ang “naghimagsik” ay malinaw, dignificado, at natural sa Tagalog.
- source_word: מֶלֶךְ מוֹאָב
  choice: ang hari ng Moab
  rationale: Tuwirang salin ng construct chain na natural sa Tagalog.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: laban sa hari ng Israel
  rationale: Kasama ng פשע, tinutukoy ng בְּ ang pinaghimagsikan. Ang “laban sa” ang likas na katumbas nito sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at dignificado. Hindi na isinalin nang hiwalay ang Hebreong panandang pasalaysay na וַיְהִי dahil magiging mabigat at hindi likas ang “At nangyari” bago ang temporal na sugnay. Inilagay ang talababa pagkatapos ng “Ahab” upang malinaw na tumukoy sa buong temporal na parirala.
