  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: tl
  text: Ngunit[a] kumapit siya sa mga kasalanan ni Jeroboam na anak ni Nebat, na nag-akay sa Israel na magkasala; hindi siya humiwalay sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Gayunman” o “Maliban nga lamang.” Ipinakikita ng salitang Hebreo ang isang pagbubukod o limitasyon sa naunang positibong pagtatasa sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Minamarkahan nito ang pagbubukod o limitasyon sa naunang positibong pagtatasa sa hari; natural ang “Ngunit” bilang panimula ng salungat na pagsusuri.
- source_word: בְּחַטֹּאות
  choice: sa mga kasalanan
  rationale: Kasama ng דבק, ipinahihiwatig ng parirala ang matibay na pananatili o pagkapit sa isang makasalanang landasin.
- source_word: חַטֹּאות
  choice: mga kasalanan
  rationale: Pinananatili nito ang hayagang moral at teolohikal na paghatol ng Hebreo nang hindi nililimitahan sa aspektong pampolitika o panritwal lamang.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwan at malinaw na anyo sa modernong Filipino para sa pangalan at patronimiko.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na naging dahilan upang magkasala ang Israel
  rationale: Ipinahahayag ang sanhiang diwa ng Hiphil ng חטא habang nananatiling natural sa Filipino. Pinananatili ng “na” ang maaaring kaugnayan ng sugnay sa mga kasalanan o sa huwarang iniugnay kay Jeroboam.
- source_word: דָּבֵק
  choice: patuloy siyang nanghawakan
  rationale: Ipinapakita ang matibay at nagpapatuloy na pagsunod o pagkapit, na angkop sa konteksto ng hindi pagtalikod.
- source_word: לֹא סָר
  choice: hindi niya tinalikuran
  rationale: Natural na Filipino para sa hindi paglayo o hindi pagtigil sa isang landasin.
- source_word: מִמֶּנָּה
  choice: ang mga iyon
  rationale: Bagaman pambabaeng isahan ang anyong Hebreo, tumutukoy ito sa kolektibong “mga kasalanan”; natural sa Filipino ang pangmaramihang reperensiya.
theological_decisions:
- issue: Pormula ng pagsusuri sa pagtalikod ng hari
  choice: Panatilihin ang tahasang “mga kasalanan” at “magkasala.”
  alternative: Palambutin bilang “mga gawain,” “mga patakaran,” o “mga pagkakamali.”
  rationale: Ang חטא ay naghahayag ng moral at teolohikal na paghatol. Ang tahasang wika ng kasalanan ay tapat sa teksto at hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
- issue: Pananagutan ni Jeroboam sa pagkakasala ng Israel
  choice: “naging dahilan upang magkasala ang Israel”
  alternative: “pinagkasala niya ang Israel” o “inakay niya ang Israel sa kasalanan”
  rationale: Pinananatili nito ang sanhiang lakas ng pandiwang Hebreo nang hindi ipinapalagay ang eksaktong paraan ng impluwensiya o inaalis ang pananagutan ng Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy siyang nanghawakan” upang ihatid ang matibay at nagpapatuloy na pagkapit, at pinanatili ang tahasang wikang moral ng pinagmulang Hebreo.
