  naturalness: Karaniwang nauunawaan ang karamihan ng pangungusap. Mas natural at mas tumpak ang “pinatibay na lungsod” kaysa “napapaderang lungsod,” at ang “lupang sakahan” ay mas tuwirang katumbas ng isang pitak o bukiring lupain sa huling parirala.
  terminology: Pinananatili ang “piling lungsod” para sa מִבְחוֹר nang hindi ipinipilit ang “pinakamahusay.” Ang “bukal ng tubig,” “babarahan,” at “sisirain ... sa pamamagitan ng mga bato” ay angkop. Ang literal na idyoma sa talababa ay malinaw na ipinaliliwanag nang hindi itinatanghal na ang literal na kahulugan ang normal na modernong Filipino.
