base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: tl
  text: Sasalakayin ninyo ang bawat pinatibay na lungsod at bawat piling lungsod,[a] ibubuwal ninyo ang bawat mabuting puno, babarahan ninyo ang lahat ng bukal ng tubig, at sisirain ninyo sa pamamagitan ng mga bato ang bawat mabuting lupang sakahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat pinakapiling lungsod” o “bawat pinakamahusay na lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pasasakitin ninyo sa pamamagitan ng mga bato.” Tumutukoy ito sa pagsira sa lupang sakahan sa pamamagitan ng pagkakalat o pagtatambak ng mga bato rito.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: Sasalakayin ninyo
  rationale: Ang Hiphil ng נכה ay nangangahulugang hampasin o salakayin. Sa tuwirang layon na mga lungsod at sa kontekstong militar, mas natural sa modernong Filipino ang “sasalakayin” kaysa “hahampasin,” nang hindi ipinapalagay na tiyak na masasakop ang mga ito.
- source_word: עִיר מִבְצָר
  choice: napapaderang lungsod
  rationale: Ang מִבְצָר ay tumutukoy sa lugar na pinatibay para sa depensa. Ang “napapaderang lungsod” ay malinaw at natural, at inilalarawan ang karaniwang anyo ng isang fortified city sa sinaunang konteksto.
- source_word: עִיר מִבְחוֹר
  choice: piling lungsod
  rationale: Ang מִבְחוֹר ay yaong pinili, pili, o pinakamahusay. Pinananatili ng “piling lungsod” ang malawak na diwa at ang tunay na kalabuan kung ang tinutukoy ay pinakapili, pinakamahusay, o natatanging lungsod.
- source_word: תַּפִּילוּ
  choice: ibubuwal ninyo
  rationale: Ang Hiphil ng נפל ay literal na pagpapabagsak. Ang “ibubuwal” ay angkop sa puno at hindi nagdaragdag ng tiyak na paraang “puputulin,” bagaman malamang na pagputol ang praktikal na paraan.
- source_word: כָּל עֵץ טוֹב
  choice: bawat mabuting puno
  rationale: Ang טוֹב ay malawak na “mabuti.” Hindi ito isinalin agad na “namumungang puno” o “mahalagang puno” upang hindi paliitin ang posibleng kahulugan.
- source_word: מַעְיְנֵי מַיִם
  choice: lahat ng bukal ng tubig
  rationale: Ang מַעְיָן ay likas na bukal o pinagmumulan ng tubig. Ang “bukal ng tubig” ay malinaw at karaniwang Filipino.
- source_word: תִּסְתֹּמוּ
  choice: babarahan ninyo
  rationale: Ang סתם ay pagsasara o pagbara sa isang bukal o balon. Natural na ipinahahayag ng “babarahan” ang ginagawang hindi mapakikinabangan ang mga bukal.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: bawat mabuting bukirin
  rationale: Ang חֶלְקָה ay isang bahagi o pitak ng lupa, at sa kontekstong ito ay lupang pansaka. Ang “bukirin” ay natural at hindi labis na nagpapakahulugan na mataba ang lupa.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: sisirain ninyo sa pamamagitan ng mga bato
  rationale: Ang anyo mula sa כאב ay literal na kaugnay ng pagpapasakit, ngunit sa konteksto ay tumutukoy sa pagsira sa lupang pansaka sa pamamagitan ng mga bato. Isinasalin sa malinaw na epekto habang inilalagay sa talababa ang kakaibang literal na pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang panghinaharap na anyo upang katawanin ang magkakasunod na pandiwang Hebrew na nasa diskursong propetiko. Iniwasan ang arkaikong “lunsod” at ang teknikal na “kutang lungsod”; pinili ang “napapaderang lungsod” para sa agarang linaw.
