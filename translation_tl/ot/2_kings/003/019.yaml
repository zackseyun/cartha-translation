- from: Sasalakayin ninyo ang bawat napapaderang lungsod at bawat piling lungsod,[a] ibubuwal ninyo ang bawat mabuting puno, babarahan ninyo ang lahat ng bukal ng tubig, at sisirain ninyo sa pamamagitan ng mga bato ang bawat mabuting bukirin.[b]
  to: Sasalakayin ninyo ang bawat pinatibay na lungsod at bawat piling lungsod,[a] ibubuwal ninyo ang bawat mabuting puno, babarahan ninyo ang lahat ng bukal ng tubig, at sisirain ninyo sa pamamagitan ng mga bato ang bawat mabuting lupang sakahan.[b]
  rationale: Pinalitan ang terminong para sa fortified city upang maipahayag ang depensibong pagpapalakas na nasa Hebreo, hindi lamang ang pagkakaroon ng pader. Pinahusay din ang huling layon para maging mas natural sa Filipino habang pinananatili ang saklaw na “bawat mabuting” bahagi ng lupang sakahan. Hindi binago ang kahulugang militar o ang idyomatikong paglalarawan ng pagsira sa lupain gamit ang mga bato.
