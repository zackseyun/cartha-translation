    rationale: Nauunawaan ito, ngunit medyo hindi likas ang “mabuting” bilang paglalarawan sa “bukirin.” Ang “mabuting lupang sakahan” ay nananatiling malapit sa Hebreong “mabuting pitak ng lupa” at mas malinaw sa modernong Filipino.
