  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang kanyang panganay na anak, na maghahari bilang kahalili niya, at inihandog niya ito bilang handog na sinusunog sa ibabaw ng pader. At nagkaroon ng matinding poot laban sa Israel[a], kaya umurong sila mula sa kanya at bumalik sa kanilang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tinutukoy ng Hebreo kung kanino nagmula ang “matinding poot.” Maaaring tumukoy ito sa poot ng Diyos, sa matinding galit ng Moab laban sa Israel, o sa pagkasindak at panghihina ng Israel matapos ang paghahandog.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: kanyang panganay na anak
  rationale: Ang בְּכוֹר ay tumutukoy sa panganay, hindi lamang sa anak na mas matanda; pinananatili rin nito ang kaugnayan sa paghalili sa trono.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: na maghahari bilang kahalili niya
  rationale: Ipinakikilala ng sugnay ang anak bilang nakatalagang hahalili sa hari; natural na ipinapahayag ng “bilang kahalili niya” ang diwa ng תַּחְתָּיו.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: inihandog niya ito bilang handog na sinusunog
  rationale: Tuwirang pinananatili ang wikang pansakripisyo ng Hiphil na עלה kasama ng עֹלָה at hindi pinapalabnaw ang kakila-kilabot na ginawa.
- source_word: עַל הַחֹמָה
  choice: sa ibabaw ng pader
  rationale: Tumutukoy ito sa pader ng lungsod ayon sa konteksto, ngunit hindi na idinaragdag sa pangunahing teksto ang salitang “lungsod,” na hindi tahasang nasa Hebreo.
- source_word: קֶצֶף גָּדוֹל
  choice: matinding poot
  rationale: Ang קֶצֶף ay matinding galit o poot; ipinahahayag ng “matinding poot” ang lakas ng parirala nang hindi tinutukoy kung kanino ito nagmula.
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Kasama ng קֶצֶף, natural na ipinahahayag ng “laban sa” ang puwersang nakatuon sa Israel.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: umurong sila mula sa kanya
  rationale: Sa kontekstong militar, ipinahihiwatig ng נסע na tumigil ang mga hukbo sa pagsalakay at lumayo sa hari ng Moab.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: bumalik sa kanilang lupain
  rationale: Ang paksa ay ang magkakaalyadong hukbo; natural na nililinaw ng “kanilang” ang ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Kahulugan at pinagmulan ng “matinding poot laban sa Israel”
  choice: Pinanatili ang malabong pananalitang “matinding poot” nang hindi tinutukoy ang pinagmulan nito.
  alternative: Maaaring unawain ito bilang poot ng Diyos, matinding galit ng Moab, o pagkasindak at panghihina ng Israel matapos ang paghahandog.
  rationale: Hindi tinutukoy ng tekstong Hebreo kung kanino nagmula ang poot. Pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon sa halip na pumili ng isang pinagtatalunang paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tahasang wikang pansakripisyo at ang kalabuan ng קֶצֶף גָּדוֹל. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
