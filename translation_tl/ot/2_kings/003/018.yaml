  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: tl
  text: At maliit na bagay lamang ito sa paningin ni Yahweh[a]; ipapasakamay niya rin sa inyo ang Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At madali lamang ito sa paningin ni Yahweh.”
    reason: Pinananatili ang alternatibong kahulugan ng וְנָקַל bilang “madali” sa halip na “maliit na bagay.”
lexical_decisions:
- source_word: וְנָקַל
  choice: At maliit na bagay lamang
  rationale: Ipinahahayag ng anyong stative ang pagiging magaan, madali, o hindi malaking bagay. Likas sa modernong Tagalog ang “maliit na bagay lamang” at pinananatili nito ang evaluative na diwa.
- source_word: זֹאת
  choice: ito
  rationale: Tumutukoy ang demonstrative sa ipinangakong paglalaan ng tubig sa naunang konteksto.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili ang Hebreong talinghaga ng pagsusuri o pagtaya, sa isang natural na pariralang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְנָתַן
  choice: ibibigay din niya
  rationale: Sa konteksto ng propetikong pananalita, ang perfect na may pang-ugnay ay may hinaharap na diwa. Ipinakikita ng “din” na karagdagang gawa ito bukod sa paglalaan ng tubig.
- source_word: אֶת מוֹאָב
  choice: ang Moab
  rationale: Pinananatili ang pangalan ng bansa o kaharian bilang kolektibong tuwirang layon, sa halip na tahasang gawing “mga Moabita.”
- source_word: בְּיֶדְכֶם
  choice: sa inyong kamay
  rationale: Pinananatili ang biblikal na idyomang tumutukoy sa pagpapasailalim sa kapangyarihan o kontrol ng kausap.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Antas ng hirap o kabuluhan ng ipinangakong gawa
  choice: maliit na bagay lamang
  alternative: madali lamang
  rationale: Maaaring mangahulugan ang וְנָקַל na “magaan/madali” o “maliit na bagay.” Pinili sa teksto ang evaluative na diwa ngunit itinabi sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga biblikal na idyomang “sa paningin” at “sa inyong kamay,” sapagkat malinaw pa rin ang mga ito sa kasalukuyang gamit. Inilagay ang marker [a] pagkatapos ng buong pangungusap dahil ang talababa ay nagpapaliwanag sa unang sugnay.
