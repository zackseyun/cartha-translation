translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginawang masigla at natural ang sigaw sa pandarambong, habang pinanatili sa talababa ang leksikal na ambiguwidad ng הָחֳרֵב נֶחֶרְבוּ at ang gamit ng מוֹאָב bilang katawagan sa mga Moabita.
