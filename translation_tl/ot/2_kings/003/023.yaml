base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: tl
  text: At sinabi nila, “Dugo ito! Tiyak na naglaban-laban ang mga hari at pinatay nila ang isa’t isa.[a] Ngayon, Moab,[b] sa samsam!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lubusan nang nagkawasak ang mga hari at pinatay nila ang isa’t isa.” Mariing anyo ng pandiwang “mawasak/mapuksa” ang ginamit sa Hebreo; sa konteksto, inakala nilang nagpatayan ang mga hari.
    reason: lexical_alternative
  - marker: b
    text: O “mga Moabita.” Ginamit ang pangalan ng bansa bilang pantawag sa mga tao nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: Dugo ito!
  rationale: Pinananatili ang mariing, walang-pandiwang pahayag at ang demonstratibong זֶה sa natural na ayos ng modernong Tagalog.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: Tiyak na naglaban-laban
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapahiwatig ng pagdidiin. Sa konteksto, inakala ng mga Moabita na naglaban ang magkakamping hari; ipinahahayag ito nang malinaw ngunit hindi isinasara ang mas literal na posibilidad na lubusan silang napuksa.
- source_word: הַמְּלָכִים
  choice: ang mga hari
  rationale: Tiyak na tumutukoy sa mga pinuno ng koalisyong nabanggit na sa salaysay.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: at pinatay nila ang isa't isa
  rationale: Ang idyomang אִישׁ אֶת־רֵעֵהוּ ay nagpapahayag ng tugunang kilos. Sa tanawin ng labanan at sa nakitang tila dugo, ang 'pinatay' ay natural na katumbas ng paghampas o pagpaslang sa kapwa.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita ang biglang paglipat mula sa kanilang palagay tungo sa masiglang panawagan.
- source_word: לַשָּׁלָל
  choice: samsamin natin ang kanilang mga ari-arian
  rationale: Isinasalin bilang panawagang pandigma ang direksiyonal na parirala. Ang 'samsamin' ay malinaw at natural para sa pagkuha ng samsam.
- source_word: מוֹאָב
  choice: Moab
  rationale: Pinananatili ang pangalan ng bansa bilang tawag sa mga tauhan nito, gaya ng Hebreo; nililinaw sa talababa ang metonimikong gamit.
