  to: At sinabi nila, “Dugo ito! Tiyak na naglaban-laban ang mga hari at pinatay nila ang isa’t isa.[a] Ngayon, Moab,[b] sa samsam!”
  rationale: Pinalitan ang malawak na 'kanilang mga ari-arian' ng 'samsam,' ang tuwirang terminong pandigma para sa שָׁלָל, at ginawang mas malapit sa Hebreo ang retorikal na transisyon. Inayos din ang talababa a upang ang leksikal na alternatibo ay tumukoy sa unang mariing pandiwa nang hindi binabago ang natitirang sugnay.
