  naturalness: Natural at malinaw ang modernong Tagalog. Mas maikli at higit na parang sigaw-pandigma ang 'sa samsam' kaysa sa 'samsamin natin ang kanilang mga ari-arian.' Ang 'Ngayon' ay sapat at hindi nagdaragdag ng sanhi na wala sa וְעַתָּה.
  terminology: Ang 'samsam' ang pinakatumpak na katumbas ng שָׁלָל sa kontekstong militar. Nananatiling wasto ang 'Moab' bilang metonimikong pantawag; ipinapaliwanag ito ng talababa.
