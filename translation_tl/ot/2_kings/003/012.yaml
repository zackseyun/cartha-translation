base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: tl
  text: Sinabi ni Jehoshafat[a], “Nasa kanya ang salita ni Yahweh.” Kaya bumaba patungo sa kanya ang hari ng Israel, si Jehoshafat, at ang hari ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May salita siyang mula kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pandiwang pasalaysay na nagpapakilala sa tuwirang sinabi; likas at malinaw sa modernong Tagalog.
- source_word: יֵשׁ אֹתוֹ
  choice: Nasa kanya
  rationale: Pinananatili ang idyomang nagsasaad na ang salita ay taglay niya o naroroon sa kanya, nang hindi labis na nililinaw kung ito ay kasalukuyang mensahe o kakayahang tumanggap ng pahayag.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang kilalang pormulang propetiko at ang posibilidad na tumukoy sa salita o pahayag na nagmumula kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH ayon sa pinagkunang Hebreo.
- source_word: וַיֵּרְדוּ
  choice: bumaba at pinuntahan
  rationale: Ang “bumaba” ay nagpapanatili sa direksiyong ipinahihiwatig ng ירד, habang ang “pinuntahan” ay natural na naghahatid ng אֵלָיו sa Tagalog.
- source_word: אֵלָיו
  choice: pinuntahan siya
  rationale: Likas na katumbas ng pagpunta patungo sa kanya; isinama sa pandiwang parirala upang maging malinaw sa Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang pinananatili ang pormal na titulo.
- source_word: וִיהוֹשָׁפָט
  choice: ni Jehoshafat
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan at ang panandang “ni” dahil kabilang siya sa tambalang simuno pagkatapos ng pandiwa.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: at ng hari ng Edom
  rationale: Pinananatili ang magkakaugnay na ayos ng tatlong hari at ang pormal na titulo.
theological_decisions:
- issue: Ang pormulang propetiko na דְּבַר יְהוָה kaugnay ni Eliseo
  choice: “Nasa kanya ang salita ni Yahweh”
  alternative: “May salita siya mula kay Yahweh”
  rationale: Pinananatili ng pangunahing salin ang eksistensiyal at relasyonal na anyo ng Hebreo, samantalang inilalagay sa talababa ang posibleng diwang mayroon siyang mensaheng mula kay Yahweh. Hindi nito ipinapasya nang higit sa teksto kung ang tinutukoy ay isang tiyak na mensahe o ang pagiging tunay niyang propeta.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “salita ni Yahweh” bilang pormulang biblikal, at ginawang natural ang galaw sa hulí sa pamamagitan ng “bumaba at pinuntahan siya.”
