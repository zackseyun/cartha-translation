  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: tl
  text: At sinabi ng hari ng Israel, “Kay-saklap! Tinawag[a] ni Yahweh ang tatlong haring ito upang ibigay sila sa kamay ng Moab.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tinawag” ay maaari ring isaling “ipinatawag”; literal na “tinawag” ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ng Moab” ay isang Hebreong idyoma na nangangahulugang “sa kapangyarihan ng Moab.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “At sinabi” at pinananatili nito ang pagkakasunod-sunod.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng construct phrase; hindi pinangalanan sa talata ang hari kaya pinanatili ang titulo.
- source_word: אֲהָהּ
  choice: Kahabag-habag!
  rationale: Nagpapahayag ito ng matinding pangamba o panaghoy. Ang “Kahabag-habag!” ay marangal at hindi gaanong kolokyal.
- source_word: קָרָא
  choice: Tinawag
  rationale: Pinananatili ang pangunahing kahulugan ng pandiwa at hindi ipinapalagay kung ang diin ay pagtawag, pagpapatawag, o pagtitipon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ang tatlong haring ito
  rationale: Natural at tiyak na Tagalog para sa numeral na may demonstrative, na tumutukoy sa tatlong haring kasalukuyang tinatalakay.
- source_word: לָתֵת אֹתָם
  choice: upang ibigay sila
  rationale: Pinananatili ang infinitive of purpose at ang pormal na diwa ng “ibigay”; nililinaw ng kasunod na idyoma ang masamang kahihinatnan.
- source_word: בְּיַד מוֹאָב
  choice: sa kamay ng Moab
  rationale: Pinananatili ang Hebreong idyoma at biblikal na larawan; nangangahulugan itong mapasailalim sa kapangyarihan ng Moab.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinanatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kung ang קָרָא ay nangangahulugang pagtawag lamang o aktuwal na pagpapatawag/pagtitipon
  choice: Tinawag
  alternative: Ipinatawag; tinipon
  rationale: Ang “Tinawag” ang pinakamalapit sa leksikal na anyo at pinananatili ang tunay na lawak ng kahulugan nang hindi pinalalawak ang pahayag ng hari.
- issue: Ang layunin o bunga ng pagkatawag sa tatlong hari
  choice: upang ibigay sila sa kamay ng Moab
  alternative: para ipaubaya sila sa kapangyarihan ng Moab
  rationale: Pinananatili ang pahayag ng hari tungkol sa layunin ni Yahweh nang hindi sinasang-ayunan o itinatama ng tagapagsalin ang kanyang teolohikal na pagbasa sa pangyayari.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang personal na pangalang Yahweh at ang idyomang “sa kamay ng Moab.” Ang mga talababa ay inilagay kaagad pagkatapos ng pangungusap at kapwa may katumbas na marker sa pangunahing teksto.
