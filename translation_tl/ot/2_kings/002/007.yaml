base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: tl
  text: Limampung lalaki mula sa mga anak ng mga propeta[c] ang pumunta at tumayo sa tapat nila[a], sa malayo[b], samantalang nakatayo ang dalawa sa tabi ng Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap nila” o “kaharap nila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa malayo.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ng mga propeta,” isang kinikilalang pangkat o samahang kaugnay ng ministeryo ng mga propeta.
    reason: cultural_note
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: ang limampung lalaki
  rationale: Tuwirang ipinahahayag ng parirala ang bilang at ang panlalaking anyo ng אִישׁ; natural sa modernong Tagalog ang “limampung lalaki.”
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: mula sa mga anak ng mga propeta
  rationale: Pinananatili ang literal at kinikilalang katawagang Hebreo na “mga anak ng mga propeta,” sa halip na ipakahulugan agad bilang mga alagad o samahan.
- source_word: הָלְכוּ
  choice: pumunta
  rationale: Karaniwang pandiwang pasalaysay ito na tumutukoy sa pagpunta; mas natural dito ang “pumunta” kaysa “naglakad.”
- source_word: וַיַּעַמְדוּ
  choice: tumayo
  rationale: Payak na inilalarawan ng עמד ang pagtayo nila; hindi kailangan ang dagdag na diin ng “pumuwesto.”
- source_word: מִנֶּגֶד
  choice: sa tapat nila
  rationale: Ipinahahayag nito ang posisyong kaharap o katapat ng dalawang lalaki, habang hiwalay na sinasabi ng kasunod na parirala ang layo.
- source_word: מֵרָחוֹק
  choice: sa malayo
  rationale: Natural at malinaw na Tagalog para sa pagkakahiwalay sa espasyo, nang hindi nagdaragdag ng tiyak na sukat.
- source_word: וּשְׁנֵיהֶם
  choice: samantalang silang dalawa
  rationale: Pinananatili ang tahasang pagtukoy sa dalawang tao at ipinakikita ng “samantalang” ang sabayang tagpo at banayad na paghahambing sa limampung lalaki.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: nakatayo sa tabi ng Jordan
  rationale: Sa konteksto ng isang ilog, ang עַל ay natural na tumutukoy sa pagiging nasa tabi o pampang nito, hindi literal na nasa ibabaw ng tubig.
