revisions:
- from: At pumunta ang limampung lalaki mula sa mga anak ng mga propeta[c] at tumayo sa tapat nila[a], sa malayo[b], samantalang silang dalawa ay nakatayo sa tabi ng Jordan.
  to: Limampung lalaki mula sa mga anak ng mga propeta[c] ang pumunta at tumayo sa tapat nila[a], sa malayo[b], samantalang nakatayo ang dalawa sa tabi ng Jordan.
  rationale: Inayos ang ayos ng pangungusap upang maging mas natural sa modernong Filipino Tagalog. Hindi binago ang kahulugan, ang tahasang bilang na limampu, ang literal na katawagang “mga anak ng mga propeta,” ang layo at pagkakatapat ng mga tagamasid, o ang pagtukoy sa dalawang lalaki sa tabi ng Jordan. Napanatili ang lahat ng talababa at ang kanilang mga angkla.
