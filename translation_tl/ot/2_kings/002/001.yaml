base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: tl
  text: Nang malapit nang iakyat ni Yahweh si Elias sa langit sa pamamagitan ng isang ipoipo[a], umalis sina Elias at Eliseo mula sa Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang ipoipo” o “sa gitna ng unos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַעֲלוֹת
  choice: Nang malapit nang iakyat
  rationale: Ang infinitive construct na may בְּ ay nagtatakda ng temporal na kalagayan. Sa konteksto, ang pag-akyat ay nalalapit pa lamang sa puntong ito ng salaysay, kaya natural sa Tagalog ang “nang malapit nang iakyat.” Hindi na hiwalay na isinalin ang וַיְהִי dahil likas na naihahatid ng sugnay na “Nang…” ang pambungad na tungkuling pasalaysay nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֶת אֵלִיָּהוּ
  choice: si Elias
  rationale: Tuwirang layon at pangalang pantangi; ginamit ang nakaugaliang anyong Filipino na “Elias.”
- source_word: בַּסְּעָרָה
  choice: sa pamamagitan ng isang ipuipo
  rationale: Ang סְעָרָה ay maaaring tumukoy sa bagyo, unos, o ipuipo. Ang “ipuipo” ay angkop sa konteksto, at ang בְּ ay inuunawang instrumental o kaugnay ng paraang ginamit.
- source_word: הַשָּׁמָיִם
  choice: sa langit
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang natural sa Tagalog ang isahang “langit” para sa patutunguhan ng pag-akyat sa kontekstong ito.
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Isinasalaysay ng pandiwa ang paglalakbay mula sa isang lugar. Ang “umalis … mula sa” ay natural sa Tagalog at malinaw na ipinahahayag ang paggalaw mula sa Gilgal.
- source_word: וֶאֱלִישָׁע
  choice: at Eliseo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang pantangi.
- source_word: מִן הַגִּלְגָּל
  choice: mula sa Gilgal
  rationale: Ang מִן ay nagmamarka ng pinagmulan; tuwirang katumbas nito ang “mula sa.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasan sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kung ang הַשָּׁמַיִם ay “langit” o “mga langit”
  choice: sa langit
  alternative: sa mga langit
  rationale: Maaaring literal na “mga langit” ang anyong Hebreo, ngunit mas natural sa kasalukuyang Tagalog ang “sa langit” sa salaysay ng pag-akyat. Hindi nito nilulutas ang anumang usaping kosmolohikal.
- issue: Kung ang בַּסְּעָרָה ay instrumental o lokatibo
  choice: sa pamamagitan ng isang ipuipo
  alternative: sa isang ipuipo; sa gitna ng unos
  rationale: Pinahihintulutan ng pang-ukol na בְּ ang instrumental o lokatibong pagbasa. Pinili ang instrumental bilang malinaw at natural sa konteksto, habang inilalagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang likas na pagsamahin ang dalawang pangalan bilang simuno, at iniwasan ang makalumang pormulang “At nangyari.”
