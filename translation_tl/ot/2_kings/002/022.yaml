  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: tl
  text: Kaya gumaling[a] ang tubig hanggang sa araw na ito, ayon sa salitang binigkas ni Eliseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naibalik sa ayos” o “naging maayos.” Ang pandiwang Hebreo ay ang karaniwang salita para sa “gumaling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: gumaling
  rationale: Karaniwang nangangahulugang “magpagaling/gumaling” ang רפא. Sa talatang ito, ang dating masamang tubig ang naging maayos; pinananatili ng “gumaling” ang matalinghagang paglalarawan ng Hebreo.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang מַיִם sa Hebreo, likas na pangngalang di-mabilang ang “tubig” sa modernong Tagalog at hindi kailangang gawing “mga tubig.”
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang ipinahihiwatig ng idyoma na nagpatuloy ang kalagayan hanggang sa panahon ng tagapagsalaysay.
- source_word: כִּדְבַר
  choice: ayon sa salitang
  rationale: Pinananatili ang kongkretong “salita” (דבר) at ang kaugnayan nito sa ipinahayag ni Eliseo sa naunang talata.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ito ang pangalang karaniwang ginagamit sa mga saling Bibliya sa Tagalog para kay Elisha.
- source_word: אֲשֶׁר דִּבֵּר
  choice: na sinabi ni Eliseo
  rationale: Malinaw at natural na tinutukoy nito ang tiyak na pahayag ng propeta nang hindi nagdaragdag ng interpretasyon.
theological_decisions:
- issue: Matalinghagang paggamit ng wikang “pagpapagaling” para sa tubig
  choice: Pinanatili sa pangunahing teksto ang “gumaling ang tubig.”
  alternative: Naisaayos ang tubig / naging mabuti o ligtas ang tubig
  rationale: Ang Hebreo ay gumagamit ng רפא, ang karaniwang pandiwa para sa pagpapagaling. Pinananatili ng “gumaling” ang larawan at teolohikal na diin ng orihinal nang hindi ipinapaliwanag nang higit sa sinasabi nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na “ang tubig” bilang likas na katumbas ng Hebreong מַיִם, at pinanatili ang metapora ng paggaling. Inilagay ang [a] pagkaraan ng pariralang “hanggang sa araw na ito” upang tumugma sa ibinigay na marker, bagaman ang tala ay nagpapaliwanag sa “gumaling.”
