base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: tl
  text: 'Pagkatapos, lumabas siya patungo sa bukal ng tubig[a] at naghagis doon ng asin. Sinabi niya, “Ganito ang sabi ni Yahweh: ‘Pinagaling ko na ang tubig na ito. Hindi na magmumula rito ang kamatayan o pagkalaglag ng ipinagbubuntis[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagmumulan ng tubig.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkabaog” o “pagiging sanhi ng pagkalaglag.” Ang salitang Hebreo ay tumutukoy sa pagkawala ng supling o sa hindi pamumunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: bukal ng tubig
  rationale: Tumutukoy ang parirala sa lugar na pinagmumulan o nilalabasan ng suplay ng tubig. Natural sa Filipino ang “bukal ng tubig,” habang itinatala sa talababa ang mas malawak na alternatibo.
- source_word: מֶלַח
  choice: asin
  rationale: Tuwirang katumbas sa Filipino at hindi nangangailangan ng pagpapalawak.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormula ng mensahero ng propeta at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: Pinagaling ko na ang tubig na ito
  rationale: Pinananatili ang matingkad at metaporikal na gamit ng pandiwang רפא, sa halip na paliitin ito sa “nilinis” o “ginawang maiinom.”
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Hindi na magmumula rito
  rationale: Natural na Filipino na nagpapanatili sa diwa na ang masasamang bunga ay hindi na manggagaling sa tubig o bukal na iyon.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Tuwirang katumbas; hindi nililimitahan ang kahulugan sa isang partikular na sanhi ng pagkamatay.
- source_word: מְשַׁכָּלֶת
  choice: pagkalaglag ng dinadala
  rationale: Ipinapahayag ang pagkawala ng supling na maaaring idulot ng tubig, ngunit inilalagay sa talababa ang tunay na saklaw ng salitang Hebreo, na maaari ring tumukoy sa pagkabaog o kawalan ng bunga.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Metaporikal na “pagpapagaling” sa tubig
  choice: Pinagaling ko na ang tubig na ito
  alternative: Ginawa ko nang mabuti / malinis ang tubig na ito
  rationale: Pinananatili ng saling ito ang metapora at ang tuwirang pahayag ng Diyos nang hindi tahimik na ipinapaliwanag ang eksaktong pisikal na pagbabago.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bukal” bilang natural na tawag sa pinagmumulan ng tubig, at pinanatili ang propetikong pormula at metapora ng pagpapagaling.
