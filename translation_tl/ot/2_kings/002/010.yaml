  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: tl
  text: Sinabi niya, “Mahirap ang hinihingi mo. Kung makita mo akong inaalis mula sa piling mo[a], magiging gayon para sa iyo; ngunit kung hindi, hindi ito mangyayari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung makita mo ako kapag inalis na ako mula sa piling mo.”
    reason: Pinananatili ang posibleng temporal na pagbasa ng pasibong participle na לֻקָּח bilang “kapag inalis na,” sa halip na ang prosesong “inaalis.”
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Mahirap ang hinihingi mo
  rationale: Ang Hiphil ng קשׁה kasama ng infinitibong לִשְׁאוֹל ay isang idyomang nagsasaad na mahirap o mabigat ang kahilingan. Natural ito sa modernong Tagalog at hindi ipinahihiwatig na mahirap lamang itong bigkasin.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Kung makita mo akong kinukuha mula sa piling mo
  rationale: Pinananatili ng “kinukuha” ang pasibong diwa ng participle na לֻקָּח nang hindi tinutukoy kung sino ang kumukuha. Ang “mula sa piling mo” ay natural na paglalahad ng paghihiwalay na ipinapahayag ng מֵאִתָּךְ.
- source_word: יְהִי לְךָ כֵן
  choice: mangyayari iyon para sa iyo
  rationale: Ipinahahayag ng idyoma na matutupad para kay Eliseo ang hiniling niya. Malinaw ang “mangyayari” sa Tagalog, samantalang pinananatili ng “para sa iyo” ang לְךָ.
- source_word: וְאִם אַיִן
  choice: ngunit kung hindi
  rationale: Eliptiko ang אַיִן at tumutukoy sa hindi pagkakita ni Eliseo sa pagkuha kay Elias. Ang “ngunit” ay malinaw na naghuhudyat ng pagsalungat sa unang kondisyon.
- source_word: לֹא יִהְיֶה
  choice: hindi iyon mangyayari
  rationale: Ang ipinahihiwatig na simuno ay ang katuparan ng kahilingan. Nililinaw ito ng “iyon” nang hindi nagdaragdag ng bagong kahulugan.
