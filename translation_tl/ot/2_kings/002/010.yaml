  naturalness: Mas natural at malinaw sa modernong Tagalog ang “magiging gayon para sa iyo.” Ang “inaalis mula sa piling mo” ay mas karaniwang pasibong paglalarawan kaysa “kinukuha mula sa piling mo,” habang pinananatili ang hindi pagtukoy kung sino ang kumukuha o nag-aalis.
  terminology: Ang mga pangalang ipinahihiwatig ng konteksto at ang mga pangunahing salita ay walang suliranin. Ang “piling mo” ay angkop na pagsasalin ng personal na paghihiwalay na nasa מֵאִתָּךְ. Nananatiling walang tinukoy na ahente ang pasibong anyo.
