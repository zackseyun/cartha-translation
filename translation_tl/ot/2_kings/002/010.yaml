translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hinihingi” para sa kahilingan at “mula sa piling mo” upang natural na maipahayag ang personal na paghihiwalay. Inilagay ang talababa sa mismong pariralang may leksikal at aspektuwal na alternatibo.
