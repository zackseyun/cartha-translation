  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: tl
  text: Nang makita siya mula sa malayo[a] ng mga anak ng mga propeta na nasa Jerico, sinabi nila, “Ang espiritu ni Elias ay nananatili kay Eliseo.” Pagkatapos, sinalubong nila siya at nagpatirapa sa lupa sa harap niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa tapat nila” o “mula sa kabilang panig.” Ang pariralang Hebreo ay tumutukoy sa isang puwestong nasa tapat o nakikita mula sa kabilang panig.
    reason: lexical_alternative
  - marker: b
    text: Ang pagpapatirapa ay nagpapahayag dito ng matinding paggalang at pagpapasakop; hindi nito kailangang ipahiwatig ang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: makita siya
  rationale: Tuwirang ipinapahayag ang payak na pagkakita kay Eliseo.
- source_word: בְנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  rationale: Pinananatili ang Hebreong katawagan sa pangkat ng mga alagad o kasamahan ng mga propeta nang hindi pinapaliit ang posibleng saklaw nito.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: na nasa Jerico
  rationale: Likas na pagtukoy sa pangkat na naroon sa Jerico.
- source_word: מִנֶּגֶד
  choice: mula sa tapat
  rationale: Pinananatili ang diwang sila ay nasa kabilang panig o nakaharap sa kaniya; nililinaw ng talababa ang maaari ring diin sa layo.
- source_word: נָחָה
  choice: nananahan
  rationale: Ipinahihiwatig ang isang kalagayang lumapag at nananatili, hindi lamang isang panandaliang pagdating.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: ang espiritu ni Elias
  rationale: Tuwirang pinananatili ang konstruksiyong Hebreo at ang teolohikal na tensiyon ng parirala.
- source_word: עַל אֱלִישָׁע
  choice: kay Eliseo
  rationale: Likas sa modernong Tagalog para sa espiritung nananahan o sumasakaniya, bagaman literal na ‘sa ibabaw ni Eliseo.’
- source_word: לִקְרָאתוֹ
  choice: sinalubong nila siya
  rationale: Maikli at likas na pagsasalin ng pagpunta upang salubungin ang isang tao.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: nagpatirapa sa lupa sa harap niya
  rationale: Inilalarawan ang buong pisikal na kilos ng matinding pagyukod nang hindi awtomatikong tinatawag itong pagsamba.
theological_decisions:
- issue: Kahulugan ng “espiritu ni Elias”
  choice: Pinanatili ang literal na parirala, na sa konteksto ay nagpapahiwatig ng pagkilala sa propetikong espiritu o kapangyarihang ngayo’y nasa kay Eliseo.
  alternative: Isalin bilang “kapangyarihang propetiko ni Elias” o unawain bilang paglipat ng personal na kaluluwa ni Elias.
  rationale: Ang literal na anyo ay tapat sa Hebreo at nagpapanatili ng tunay na lawak ng kahulugan, samantalang iniiwasang igiit ang transmigrasyon ng personal na espiritu.
- issue: Kahulugan ng pagpapatirapa kay Eliseo
  choice: Isang kilos ng paggalang at pagkilala sa awtoridad ni Eliseo bilang kahalili ni Elias.
  alternative: Ituring itong pagsambang ukol sa Diyos.
  rationale: Maaaring tumukoy ang pandiwang Hebreo sa pagpapatirapa sa tao o sa Diyos. Dito, ang konteksto ay pagkilala sa propetikong katungkulan ni Eliseo, kaya hindi dapat tahasang tawaging pagsamba.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang tradisyonal at madaling makilalang mga pangalang Elias at Eliseo, gayundin ang idyomang “mga anak ng mga propeta,” habang ginawang likas ang daloy ng salaysay.
