revisions:
- from: Nang makita siya mula sa tapat[a] ng mga anak ng mga propeta na nasa Jerico, sinabi nila, “Nananahan kay Eliseo ang espiritu ni Elias.” Pagkatapos, sinalubong nila siya at nagpatirapa sa lupa sa harap niya.[b]
  to: Nang makita siya mula sa malayo[a] ng mga anak ng mga propeta na nasa Jerico, sinabi nila, “Ang espiritu ni Elias ay nananatili kay Eliseo.” Pagkatapos, sinalubong nila siya at nagpatirapa sa lupa sa harap niya.[b]
  rationale: Inayos ang pambungad upang malinaw na ang mga anak ng mga propeta ang nakakita kay Eliseo, hindi ang kabaligtaran. Pinili ang “mula sa malayo” bilang likas na pangunahing salin ng spatial na pariralang Hebreo at itinala ang mas literal na alternatibo sa talababa. Pinalitan ang ayos ng sugnay tungkol sa espiritu upang maging mas natural sa modernong Tagalog, nang hindi ipinipilit ang isang doktrinal na paliwanag.
