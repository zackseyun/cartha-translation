  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: tl
  text: Sinabi ni Elias kay Eliseo, “Pakiusap, manatili ka rito, sapagkat isinugo ako ni Yahweh hanggang sa Bethel.” Ngunit sinabi ni Eliseo, “Kung paanong buhay si Yahweh at ikaw ay buhay, hindi kita iiwan.[a]” Kaya bumaba sila patungong Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na, “Buhay si Yahweh, at buhay ang iyong buhay, kung iiwan kita”—isang pinaikling pormula ng panunumpa na nangangahulugang, “Tiyak na hindi kita iiwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Manatili ka muna rito
  rationale: Sa konteksto, ang שֵׁב ay nangangahulugang manatili sa lugar, hindi lamang umupo. Likas na ipinahihiwatig ng “muna” ang magalang na pakiusap ng נָא sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng titulong “Panginoon.”
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: isinugo ako ni Yahweh hanggang sa Bethel
  rationale: Ang “hanggang sa” ay nagpapanatili sa karaniwang terminus na diwa ng עַד at angkop sa sunod-sunod na mga yugto ng paglalakbay.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Buhay si Yahweh, at buhay ka rin
  rationale: Pinananatili nito ang anyo at taimtim na lakas ng Hebreong panunumpa nang hindi isinasalin ang נֶפֶשׁ bilang teknikal na “kaluluwa,” sapagkat dito ay tumutukoy ito sa mismong buhay ng kausap.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  rationale: Pagkatapos ng panunumpa, ang אִם ay nagpapasimula ng pinaikling negatibong sumpa. Kailangang gawing tahasan sa natural na Tagalog ang ipinahihiwatig na pagtanggi.
- source_word: וַיֵּרְדוּ
  choice: bumaba sila
  rationale: Pinananatili ang direksiyonal na kahulugan ng ירד sa halip na gawing pangkalahatang “pumunta.”
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan ng lugar.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pinaikling panunumpa sa אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  alternative: kung iiwan kita
  rationale: Ang literal na kondisyon ay isang hindi kompletong pormula ng sumpa na sa konteksto ay mariing nangangahulugang hindi niya iiwan si Elias. Inililinaw ito sa teksto habang itinatala sa talababa ang anyong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tradisyonal at malawak na kilalang mga pangalang Elias at Eliseo, ang natural na pakiusap na “Manatili ka muna rito,” at isang tuwirang anyo ng panunumpa. Pinanatili ang “hanggang sa Bethel” at “bumaba” upang huwag mawala ang mga detalyeng direksiyonal ng Hebreo.
