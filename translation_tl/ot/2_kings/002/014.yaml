  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang balabal ni Elias na nahulog mula kay Elias. Ipinampalo niya iyon sa tubig at sinabi, “Nasaan si Yahweh, ang Diyos ni Elias?”[a] Muli niyang hinampas ang tubig, at nahati iyon sa magkabilang panig. At tumawid si Eliseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pagkatapos ng “Diyos ni Elias,” may napakaikling pariralang Hebreo na maaaring literal na isaling “maging siya” o “siya rin.” Maaaring idiin nito na ang Diyos na kasama ni Elias ay naroroon at kumikilos pa rin, o maaari itong iugnay sa kasunod na paghampas ni Eliseo sa tubig. Hindi tiyak ang kahulugan at pagkakaugnay nito.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: balabal
  rationale: Tumutukoy sa natatanging panlabas na kasuotan ni Elias. Ang “balabal” ay likas at malinaw sa makabagong Filipino at pinananatili ang kongkretong larawan.
- source_word: נָפְלָה מֵעָלָיו
  choice: nahulog mula rito
  rationale: Ang ganap na pandiwa sa sugnay na panuring ay tumutukoy sa naunang pagkahulog ng balabal mula kay Elias. Ginamit ang “rito” upang malinaw na si Elias, hindi si Eliseo, ang tinutukoy.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: hinampas niya nito ang tubig
  rationale: Ang “hinampas” ay angkop sa נכה, at ipinahihiwatig ng “nito” na balabal ang ginamit. Ang “tubig” ay likas na anyong pangmaramihan o di-mabilang sa Filipino.
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Tuwirang tanong ito tungkol sa kinaroroonan o presensiya; hindi dinagdagan ng paliwanag tungkol sa hinihinging pagkilos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: ang Diyos ni Elias
  rationale: Malinaw at likas na ipinapahayag sa Filipino ang ugnayang construct ng Hebreo.
- source_word: אַף הוּא
  choice: '[hindi pinalawak sa pangunahing teksto; ipinaliwanag sa talababa]'
  rationale: Napakaikli at malabo ng pariralang Hebreo. Ang literal na “maging siya” ay hindi likas at hindi malinaw sa Filipino, kaya iniingatan sa talababa ang tunay na kalabuan sa halip na tiyakang ipakahulugan.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: nahati iyon sa magkabilang panig
  rationale: Likas na inilalarawan nito ang paghahati ng tubig sa dalawang direksiyon nang hindi gumagamit ng malabong “dito at doon.”
- source_word: וַיַּעֲבֹר
  choice: tumawid si Eliseo
  rationale: Ang “tumawid” ang pinakatuwiran at likas na pandiwa sa konteksto ng pagtawid sa ilog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pagpapakahulugan sa maikling pariralang אַף הוּא
  choice: Hindi pinalawak sa pangunahing teksto at pinanatili ang kalabuan sa talababa
  alternative: “maging siya”; “siya rin”; “narito rin ba siya?”; iugnay sa kasunod bilang “maging siya man ay humampas”
  rationale: Hindi tiyak ang pagkakaugnay at diin ng parirala. Ang paglalagay ng isang tiyak na pagpapakahulugan sa bibig ni Eliseo ay maaaring lumabis sa ebidensiya ng Hebreo; inilalahad ng talababa ang problema nang hindi nilulutas ang tensiyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na mga pangalang Elias at Eliseo, at iniwasan ang sobrang makaluma o denominasyonal na pananalita.
