  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga lalaki ng lungsod kay Eliseo, “Pakitingnan po ninyo, maganda ang kinalalagyan ng lungsod, gaya ng nakikita ninyo, panginoon ko. Ngunit masama ang tubig, at ang lupain ay nagiging sanhi ng pagkalaglag ng dinadala.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ang lupain ay hindi namumunga.” Ang salitang Hebreo ay tumutukoy sa pagkawala ng supling, ngunit sa kontekstong ito maaari rin itong sumaklaw sa pagiging tigang o di-mabunga ng lupain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki sa lungsod
  rationale: Tahasang panlalaking pangmaramihan ang Hebreo, kaya pinanatili ang “mga lalaki” sa halip na gawing “mga tao” o “mga mamamayan.”
- source_word: הִנֵּה נָא
  choice: Pakitingnan po ninyo
  rationale: Pinagsasama nito ang pagtawag ng pansin at magalang na pakiusap; natural ang “pakitingnan po ninyo” sa kasalukuyang Tagalog.
- source_word: מוֹשַׁב הָעִיר
  choice: kinalalagyan ng lungsod
  rationale: Tumutukoy rito ang מוֹשַׁב sa lokasyon o pagkakatayo ng lungsod, hindi lamang sa tirahan.
- source_word: טוֹב
  choice: maganda
  rationale: Sa paglalarawan ng lokasyon, mas likas sa Tagalog ang “maganda” kaysa literal ngunit di-gaanong natural na “mabuti.”
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: gaya ng nakikita ninyo, panginoon ko
  rationale: Pinananatili ang pandiwang “nakikita” at ang magalang na pantawag; ang “panginoon ko” ay panlipunang paggalang kay Eliseo, hindi banal na titulo.
- source_word: וְהַמַּיִם רָעִים
  choice: Ngunit masama ang tubig
  rationale: Ang pangatnig ay adversatibo rito dahil ikinokontra ang tubig sa magandang lokasyon; pinananatili ng “masama” ang payak at malawak na diwa ng רָעִים.
- source_word: וְהָאָרֶץ
  choice: at ang lupain
  rationale: Sapat ang lawak ng “lupain” upang tumukoy sa lokal na lupa o nasasakupan nang hindi nilulutas ang saklaw.
- source_word: מְשַׁכָּלֶת
  choice: nagiging sanhi ng pagkalaglag ng dinadala
  rationale: Ang causative na anyo mula sa שׁכל ay tumutukoy sa pagkawala ng supling. Pinananatili ng salin ang kongkretong diwa ngunit nilalagyan ng talababa dahil maaari rin itong lumawak sa pagiging di-mabunga ng lupain.
theological_decisions:
- issue: Pag-render sa אֲדֹנִי bilang pantawag kay Eliseo
  choice: panginoon ko
  alternative: amo ko
  rationale: Magalang na pantawag ito sa isang tao at hindi titulo ng Diyos. Pinananatili ng “panginoon ko” ang pormal na paggalang ng Hebreo, habang nililinaw ng konteksto na si Eliseo ang kinakausap.
- issue: Saklaw ng מְשַׁכָּלֶת
  choice: nagiging sanhi ng pagkalaglag ng dinadala
  alternative: hindi namumunga
  rationale: Pinanatili sa pangunahing teksto ang kongkretong causative na diwa ng pagkawala ng supling, habang kinikilala sa talababa ang posibleng agrikultural na saklaw. Hindi tahimik na nilulutas ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “po” at pangmaramihang “ninyo” upang likas na maipahayag ang magalang na pakikipag-usap kay Eliseo. Pinanatili ang panlalaking “mga lalaki” at ang leksikal na tensiyon sa huling sugnay sa pamamagitan ng pangunahing salin at talababa.
