  to: Pagkatapos, sinabi ng mga lalaki ng lungsod kay Eliseo, “Pakitingnan po ninyo, maganda ang kinalalagyan ng lungsod, gaya ng nakikita ninyo, panginoon ko. Ngunit masama ang tubig, at ang lupain ay nagiging sanhi ng pagkalaglag ng dinadala.[a]”
