  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Narito po, may limampung may-kakayahang lalaki sa mga lingkod ninyo. Pahintulutan po ninyo silang umalis at hanapin ang inyong panginoon. Baka tinangay siya ng Espiritu ni Yahweh[a] at inihagis siya sa isa sa mga bundok o sa isa sa mga lambak.” Ngunit sinabi niya, “Huwag ninyo silang ipadala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangin ni Yahweh ang tumangay sa kanya.” Ang salitang Hebreo na isinaling “Espiritu” ay maaari ring mangahulugang “hangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Mayroon po
  rationale: Sa kontekstong ito, ang parirala ay magalang na pantawag-pansin bago iharap ang mungkahi. Likas sa makabagong Tagalog na dalhin ang paggalang sa “po” at ilahad agad ang pagkakaroon ng mga lalaking maaaring ipadala.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: sa inyong mga lingkod
  rationale: Pinananatili nito na ang limampung lalaki ay kabilang sa mga lingkod ni Eliseo, habang gumagamit ng magalang na panghalip na angkop sa kanilang pakikipag-usap sa kanya.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: limampung lalaking may kakayahan
  rationale: Ang idyoma ay tumutukoy sa mga lalaking may lakas at kakayahang isagawa ang paghahanap, hindi kinakailangang sa mga mandirigma.
- source_word: יֵלְכוּ נָא
  choice: Pahintulutan po ninyo silang pumunta
  rationale: Ipinahahayag ng jussive na may נָא ang isang magalang na kahilingan kay Eliseo na payagang umalis ang mga lalaki.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: at hanapin ang inyong panginoon
  rationale: Ang בקשׁ dito ay paghahanap sa nawawalang tao; ang אֲדֹנֶיךָ ay tumutukoy kay Elias bilang panginoon o nakatataas kay Eliseo.
- source_word: פֶּן
  choice: Baka
  rationale: Ipinakikilala rito ng particle ang isang maaaring paliwanag sa pagkawala ni Elias, hindi isang kinalabasang pinipigilan.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: tinangay siya ng Espiritu ni Yahweh
  rationale: Ang “tinangay” ay natural na naglalarawan sa pagdadala sa kanya, at pinananatili ng “Espiritu” ang malamang na banal na tagaganap habang inilalagay sa talababa ang lehitimong kahulugang “hangin.”
- source_word: וַיַּשְׁלִכֵהוּ
  choice: at inihagis
  rationale: Tuwirang ipinahahayag nito ang malakas na kilos ng paghahagis nang hindi pinapahina ang kakaibang palagay ng mga nagsasalita.
- source_word: בְּאַחַד הֶהָרִים אוֹ בְּאַחַת הַגֵּאָיוֹת
  choice: sa isa sa mga bundok o sa isa sa mga lambak
  rationale: Ang “bundok” at “lambak” ay malinaw at karaniwang mga katumbas; sa Tagalog, sapat ang “sa” upang tukuyin ang kinalalagyan o hantungan pagkatapos ng paghahagis.
theological_decisions:
- issue: Kahulugan ng רוּחַ יְהוָה
  choice: Espiritu ni Yahweh
  alternative: hangin ni Yahweh
  rationale: Sa salaysay ng pambihirang pagkawala ni Elias, mas malamang na banal na Espiritu ang itinuturing nilang kumilos. Gayunman, maaari ring mangahulugang “hangin” ang רוּחַ, kaya hindi inaalis ang kalabuan at itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, magalang, at marangal na Tagalog. Ginamit ang “po” at “ninyo/inyong” upang likas na ipakita ang paggalang kay Eliseo, nang hindi ginagawang labis na pormal o makaluma ang usapan.
