revisions:
- from: Sinabi nila sa kanya, “Mayroon po sa inyong mga lingkod na limampung lalaking may kakayahan. Pahintulutan po ninyo silang pumunta at hanapin ang inyong panginoon. Baka tinangay siya ng Espiritu ni Yahweh[a] at inihagis sa isa sa mga bundok o sa isa sa mga lambak.” Ngunit sinabi niya, “Huwag ninyo silang ipadala.”
  to: Sinabi nila sa kanya, “Narito po, may limampung may-kakayahang lalaki sa mga lingkod ninyo. Pahintulutan po ninyo silang umalis at hanapin ang inyong panginoon. Baka tinangay siya ng Espiritu ni Yahweh[a] at inihagis siya sa isa sa mga bundok o sa isa sa mga lambak.” Ngunit sinabi niya, “Huwag ninyo silang ipadala.”
  rationale: Inayos ang pambungad upang maging likas na Tagalog habang pinananatili ang magalang na pantawag-pansin at ang diwang may limampung lalaki sa mga lingkod ni Eliseo. Pinalitan ang “pumunta” ng “umalis,” na mas angkop sa paghingi ng pahintulot na magtungo sa paghahanap, at ginawang hayag ang “siya” sa ikalawang kilos. Walang binagong kahulugan o inalis na kalabuan tungkol sa Espiritu/hangin.
