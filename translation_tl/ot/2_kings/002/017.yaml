  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: tl
  text: Ngunit patuloy nilang ipinilit sa kanya hanggang sa mapahiya siya[a], at sinabi niya, “Isugo ninyo sila.” Kaya nagsugo sila ng limampung lalaki. Tatlong araw silang naghanap, ngunit hindi nila siya natagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa makaramdam siya ng pagkailang.” Literal na sinasabi ng Hebreo, “hanggang sa mapahiya siya,” na naglalarawan sa panlipunang presyur na dulot ng paulit-ulit nilang pamimilit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: patuloy nila siyang pinilit
  rationale: Ipinahahayag ng פצר ang paulit-ulit at matinding pangungulit o pamimilit. Ang “patuloy nila siyang pinilit” ay natural sa modernong Tagalog at malinaw na naghahatid ng nagpapatuloy na paggigiit.
- source_word: עַד בֹּשׁ
  choice: hanggang sa mapahiya siya
  rationale: Ang בוש ay tumutukoy sa kahihiyan o pagkapahiya. Pinananatili ng salin ang literal na diwa habang ang talababa ay nagpapaliwanag na maaaring panlipunang pagkailang o pagkapahiya ang tinutukoy.
- source_word: שְׁלָחוּ
  choice: Isugo ninyo sila
  rationale: Ito ay pautos na pangmaramihan mula sa שלח. Ipinahihiwatig ng konteksto ang mga lalaking ipadadala, kaya ginawang tahas ang “sila” para sa likas na Tagalog.
- source_word: חֲמִשִּׁים אִישׁ
  choice: limampung lalaki
  rationale: Ito mismo ang sinasabi ng Hebreo; hindi idinagdag sa talata ang pagkakakilanlan nilang makikita sa mas malawak na konteksto.
- source_word: וַיְבַקְשׁוּ שְׁלֹשָׁה יָמִים
  choice: Tatlong araw silang naghanap
  rationale: Ang בקש ay nangangahulugang humanap o maghanap. Ang ayos na ito ay likas sa Tagalog at tumpak na naghahatid ng tagal ng paghahanap.
- source_word: וְלֹא מְצָאֻהוּ
  choice: ngunit hindi nila siya natagpuan
  rationale: Ang מצא ay “makatagpo” o “makakita.” Ang “ngunit” ay likas na nagpapakita ng salungat na kinalabasan matapos ang tatlong araw na paghahanap.
