id: 2KI.2.23
reference: 2 Kings 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַל מִ/שָּׁ֖ם בֵּֽית אֵ֑ל וְ/ה֣וּא עֹלֶ֣ה בַ/דֶּ֗רֶךְ וּ/נְעָרִ֤ים קְטַנִּים֙ יָצְא֣וּ מִן הָ/עִ֔יר וַ/יִּתְקַלְּסוּ ב/וֹ֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ עֲלֵ֥ה קֵרֵ֖חַ עֲלֵ֥ה קֵרֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: tl
  text: Pagkatapos, umakyat siya mula roon patungong Betel. Habang umaakyat siya sa daan, may mga batang lalaki[a] na lumabas mula sa lungsod. Tinuya nila siya at sinabi sa kanya, “Umakyat ka, kalbo! Umakyat ka[b], kalbo!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kabataang lalaki” o “mga binatilyo.” Maaaring tumukoy ang pariralang Hebreo sa mga nakababatang lalaki sa mas malawak na diwa, hindi lamang sa napakaliit na mga bata.
    reason: lexical_alternative
  - marker: b
    text: Maaaring karaniwang pangungutya lamang ang inuulit na “Umakyat ka,” ngunit maaari rin itong magpahiwatig sa pag-akyat ni Elias.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Pagkatapos, umakyat siya
  rationale: Ang Qal wayyiqtol ng עלה ay nagpapatuloy sa salaysay at nangangahulugang ‘umakyat.’ Ginamit ang ‘Pagkatapos’ para sa likas na daloy ng salaysay.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na Bethel/Beth-el.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Habang umaakyat siya sa daan
  rationale: Ipinahahayag ng panghalip at participle ang nagpapatuloy na kilos. Pinananatili ng ‘umaakyat’ ang pag-uulit ng עלה na lumilitaw din sa panunuya.
- source_word: נְעָרִים קְטַנִּים
  choice: mga batang lalaki
  rationale: Tumutukoy ang parirala sa mga batang o nakababatang lalaki, ngunit maaaring mas malawak ang saklaw ng נער kaysa sa napakaliit na bata; inilagay ang alternatibo sa talababa.
- source_word: יָצְאוּ מִן הָעִיר
  choice: lumabas mula sa lungsod
  rationale: Tuwirang ipinapahayag ang paglabas nila mula sa lungsod, nang hindi nagdaragdag ng hindi nasa Hebreo.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: Tinuya nila siya
  rationale: Ang Hitpael ng קלס ay nagpapahiwatig ng mapanlait na panunuya; natural at marangal sa modernong Filipino ang ‘tinuya.’
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang literal na utos at ang leksikal na pag-uulit ng עלה. Hindi nilulutas sa pangunahing teksto kung karaniwang pangungutya lamang ito o pahiwatig sa pag-akyat ni Elias.
- source_word: קֵרֵחַ
  choice: kalbo
  rationale: Ang salita ay nangangahulugang taong walang buhok at ginagamit dito bilang tuwirang mapanuyang tawag; natural sa Filipino ang ‘kalbo.’
theological_decisions:
- issue: Posibleng pahiwatig ng inuulit na ‘umakyat ka’
  choice: Pinanatili ang literal na ‘Umakyat ka’ nang hindi ginagawang tahasan ang anumang pahiwatig sa pangunahing teksto.
  alternative: Isaling ‘Lumayas ka’ bilang pangungutya, o ipaliwanag sa teksto na ‘Umakyat kang gaya ni Elias.’
  rationale: Malinaw na ‘umakyat’ ang pandiwang Hebreo, ngunit pinagtatalunan ang tiyak na puwersa ng pangungutya. Pinananatili ng salin ang tunay na kalabuan.
- issue: Edad na ipinahihiwatig ng נְעָרִים קְטַנִּים
  choice: ‘mga batang lalaki’ sa pangunahing teksto, na may mas malawak na posibilidad sa talababa
  alternative: mga kabataang lalaki; mga binatilyo; mga kabataan
  rationale: Ipinahihiwatig ng parirala ang mga nakababatang lalaki, ngunit hindi nito tiyak na nililimitahan ang tinutukoy sa napakaliit na mga bata. Pinananatili sa talababa ang mas malawak na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng pandiwang ‘umakyat’ upang maipakita ang ugnayang leksikal sa salaysay at sa pangungutya. Inilagay ang marker [a] pagkatapos ng pariralang tinutukoy nito, hindi pagkatapos ng pangalan ng lugar.
