  source_fidelity: 'Tapat ang salin sa Hebreo: naipapakita ang sunod na kilos ng pag-akyat patungong Betel, ang kasabay na paglalakbay sa daan, ang paglabas ng mga batang lalaki mula sa lungsod, ang kanilang panunuya, at ang inuulit na utos na “Umakyat ka.” Hindi nito ipinapasok sa pangunahing teksto ang pinagtatalunang pahiwatig ng panunuya.'
