base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: tl
  text: At habang patuloy silang naglalakad at nag-uusap, narito, isang karwaheng apoy at mga kabayong apoy ang pumagitna sa kanilang dalawa[b], at si Elias ay umakyat sa langit sa pamamagitan ng ipuipo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng ipuipo” o “sa ipuipo.” Ang Hebreong pang-ukol ay maaaring magpahiwatig ng paraan, pagsama, o kinalalagyan.
    reason: lexical_alternative
  - marker: b
    text: Sinasabi ng teksto na pinaghiwalay ng karwaheng apoy at mga kabayong apoy sina Elias at Eliseo, at na umakyat si Elias sa pamamagitan ng ipuipo; hindi nito tahasang sinasabing sumakay si Elias sa karwahe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: At habang patuloy silang naglalakad at nag-uusap
  rationale: Ipinapahayag ng participle at infinitive absolute ang nagpapatuloy na pagkilos; natural sa modernong Tagalog ang “habang patuloy” para sa magkasabay at tuloy-tuloy na paglakad at pag-uusap.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili nito ang dramatikong panawag-pansin ng Hebreo nang hindi ipinapalagay na ang diin ay tanging biglaan.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: isang karwaheng apoy at mga kabayong apoy
  rationale: Pinananatili ang tahasang larawang construct na “apoy,” sa halip na gawing pang-uri lamang na maaaring magpaliit sa ambiguwidad ng larawan.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: ang pumagitna sa kanilang dalawa
  rationale: Malinaw na ipinakikita ang pagkakahiwalay ng dalawang lalaki habang natural na iniuugnay ang pandiwang maramihan sa karwahe at mga kabayo bilang magkakasamang paksa.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: si Elias ay umakyat
  rationale: Ang “umakyat” ay tuwiran, malinaw, at hindi nagdaragdag ng teknikal o denominasyonal na kahulugan.
- source_word: בַּסְעָרָה
  choice: sa pamamagitan ng ipuipo
  rationale: Ipinahihiwatig nito ang posibleng instrumental na gamit ng ב, habang inilalahad sa talababa ang tunay na saklaw ng kahulugan nito.
- source_word: הַשָּׁמָיִם
  choice: sa langit
  rationale: Sa kontekstong ito, ang “langit” ang pinakanatural at marangal na katumbas sa Tagalog, nang hindi nililimitahan ang salita sa pisikal na himpapawid lamang.
theological_decisions:
- issue: Kung ang karwaheng apoy mismo ang sinakyan ni Elias o ang ipuipo ang kaugnay na paraan o kalagayan ng kanyang pag-akyat
  choice: Sinasabi lamang ng pangunahing teksto na pumagitna ang karwahe at mga kabayong apoy sa dalawang lalaki at umakyat si Elias sa pamamagitan ng ipuipo.
  alternative: Maaaring ipalagay na sumakay si Elias sa karwaheng apoy.
  rationale: Pinaghihiwalay ng Hebreong teksto ang paglitaw at pagkilos ng karwahe at mga kabayo mula sa pag-akyat ni Elias, na tahasang iniuugnay sa ipuipo. Hindi dapat idagdag ang karaniwang larawan na sumakay siya sa karwahe.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang tradisyonal at madaling makilalang mga pangalang Elias at Eliseo. Iniwasan ang arkaikong “at nangyari” at ang di-tahasang pagdaragdag na sumakay si Elias sa karwahe.
