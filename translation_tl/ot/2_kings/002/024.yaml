  - severity: low
    issue: Saklaw ng bilang sa huling parirala
    rationale: Mas tuwirang ipinahahayag ng „apatnapu't dalawang bata mula sa kanila” na ang bilang ay mga batang kabilang sa grupong nakita niya.
  revised_text: Lumingon siya at nakita sila, at isinumpa niya sila sa pangalan ni Yahweh. Pagkatapos, dalawang babaeng oso ang lumabas mula sa kagubatan at niluray ang apatnapu't dalawang bata mula sa kanila.
