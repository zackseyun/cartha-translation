base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: tl
  text: Lumingon siya at nakita sila, at isinumpa niya sila sa pangalan ni Yahweh. Pagkatapos, dalawang babaeng oso ang lumabas mula sa kagubatan at niluray ang apatnapu't dalawang bata mula sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: isinumpa niya sila
  rationale: Tuwirang ipinahahayag ang pagbigkas ng sumpa laban sa kanila; mas tiyak ito kaysa sa karaniwang 'minura.'
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo at ang diwang isinagawa ang sumpa sa kanyang pangalan o awtoridad.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: dalawang babaeng oso
  rationale: Ang bilang at pangngalan ay kapwa nasa anyong pambabae, kaya hayagang tinutukoy ang dalawang she-bear.
- source_word: וַתְּבַקַּעְנָה
  choice: nilapa
  rationale: Inilalarawan ng pandiwa ang marahas na pagpunit o paglaslas; natural sa Filipino ang 'nilapa' para sa pananakit ng mababangis na hayop nang hindi ipinapalagay na napatay silang lahat.
- source_word: יְלָדִים
  choice: mga bata
  rationale: Ang salita ay tumutukoy sa mga bata o kabataan; hindi tiyak sa talata ang eksaktong edad o kasarian, kaya hindi ito nilimitahan sa 'mga batang lalaki.'
theological_decisions:
- issue: Kalikasang may awtoridad ng sumpa
  choice: isinumpa niya sila sa pangalan ni Yahweh
  alternative: sinumpa niya sila sa pamamagitan ng pangalan ni Yahweh
  rationale: Pinananatili ang payak na ugnayan ng sumpa at ng banal na pangalan nang hindi dinaragdagan ang teksto ng paliwanag kung paano o bakit sumunod ang paghatol.
- issue: Kinalabasan ng pag-atake
  choice: nilapa
  alternative: pinunit / niluray at pinatay
  rationale: Malubha ang Hebreong pandiwa ngunit hindi tahasang sinasabi sa talata na namatay ang apatnapu't dalawa; iniiwasang gawing tiyak ang hindi tiyak.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang 'Yahweh' bilang transliterasyon ng tetragrammaton; pinanatili ang bigat ng marahas na tagpo nang hindi nagdagdag ng paliwanag o paghatol na wala sa teksto.
