  source_fidelity: 'Tumpak ang pangunahing diwa: bumalik ang mga lalaki kay Eliseo, nanatili siya sa Jerico, at pinaalalahanan niya silang sinabi niyang huwag pumunta. Ang "nananatili" ay isang kontekstuwal na katumbas ng יֹשֵׁב, na maaari ring mangahulugang nakaupo o naninirahan/nananatili.'
