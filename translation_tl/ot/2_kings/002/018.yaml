translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nananatili” sa halip na literal na “nakaupo” upang maipahayag ang malawak na diwa ng יֹשֵׁב sa konteksto, habang inilagay sa talababa ang mas pormal na ayos ng mga sugnay.
