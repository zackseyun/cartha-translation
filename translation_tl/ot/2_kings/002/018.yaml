  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: tl
  text: Nang bumalik sila sa kanya[a], nananatili pa siya sa Jerico, at sinabi niya sa kanila, “Hindi ba sinabi ko sa inyo, ‘Huwag kayong pumunta’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na ayos: “At bumalik sila sa kanya habang nananatili pa siya sa Jerico.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Nang bumalik sila sa kanya
  rationale: Ang וַיָּשֻׁבוּ ay nagsusulong ng salaysay, ngunit kasama ng kasunod na pangyayari ay natural na maipahayag sa Tagalog bilang temporal na sugnay. Tuwirang tinutumbasan ng “sa kanya” ang אֵלָיו; si Eliseo ang tinutukoy ayon sa konteksto.
- source_word: וְהוּא יֹשֵׁב
  choice: nananatili siya
  rationale: Maaaring mangahulugan ang יֹשֵׁב ng nakaupo, naninirahan, o nananatili. Dito, binibigyang-diin na nasa Jerico pa rin si Eliseo habang naghahanap ang mga lalaki, kaya natural at kontekstuwal ang “nananatili.”
- source_word: בִּירִיחוֹ
  choice: sa Jerico
  rationale: Karaniwang anyo sa modernong Filipino ng pangalan ng lugar, kasama ang angkop na pang-ukol.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Sinabi niya sa kanila
  rationale: Tuwiran at natural na katumbas ng karaniwang pandiwa ng pagsasalita na אָמַר at ng layong אֲלֵהֶם.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Hindi ba sinabi ko sa inyo
  rationale: Pinananatili ng “Hindi ba” ang retorikal na tanong na umaasang sasang-ayon ang kausap at ang bahagyang pagsaway sa pananalita ni Eliseo.
- source_word: אַל תֵּלֵכוּ
  choice: Huwag kayong pumunta
  rationale: Ang אַל kasama ng di-ganap na pandiwa ay nagpapahayag ng pagbabawal. Malinaw na ipinakikita ng “kayong” na maramihan ang kausap.
