  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ni Elias, “Pakiusap, manatili ka rito, sapagkat isinugo ako ni Yahweh sa Jordan[a].” Ngunit sumagot siya, “Buhay si Yahweh, at buhay ka rin[b]—hindi kita iiwan.” Kaya nagpatuloy silang dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Ilog Jordan.”
    reason: lexical_alternative
  - marker: b
    text: 'Pormula ito ng panunumpa sa Hebreo. Mas literal: “Buhay si Yahweh, at buhay ang iyong buhay—kung iiwan kita …,” na ang ibig sabihin ay, “Tiyak na hindi kita iiwan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Pakiusap, manatili ka
  rationale: Ang שֵׁב ay maaaring mangahulugang umupo, manatili, o tumigil sa isang lugar. Sa konteksto, hinihiling ni Elias na huwag nang sumama si Eliseo; ipinahahayag ng “Pakiusap” ang magalang na pakiusap na dala ng נָא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: שְׁלָחַנִי
  choice: isinugo ako
  rationale: Ipinahahayag nito ang natapos nang atas na siyang dahilan ng kasalukuyang paglalakbay ni Elias.
- source_word: הַיַּרְדֵּנָה
  choice: sa Jordan
  rationale: Ipinakikita ng hulaping direksiyonal na patungo siya sa Jordan; maaaring tukuyin ang ilog mismo o ang pook na kaugnay nito.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Buhay si Yahweh, at buhay ka rin
  rationale: Pinananatili ang anyo at taimtim na puwersa ng Hebreong panunumpa. Ang נֶפֶשׁ dito ay tumutukoy sa buhay o sa mismong tao, hindi kinakailangang sa isang hiwalay na “kaluluwa.”
- source_word: אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  rationale: Sa eliptikong pormula ng panunumpa, ang אִם ay nagpapahiwatig ng sumpang mangyayari kung gagawin niya iyon; ang tuwirang matibay na pagtanggi ang likas na katumbas sa Tagalog.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: Kaya nagpatuloy silang dalawa
  rationale: Binibigyang-diin ng שְׁנֵיהֶם na magkasamang naglakbay ang dalawang lalaki, at ang “nagpatuloy” ay angkop sa nagpapatuloy na paglalakbay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Eliptikong panunumpa sa אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  alternative: kung iiwan kita
  rationale: Hindi kinukumpleto ng teksto ang ipinahihiwatig na kaparusahan sa nanunumpa. Isinasalin ang malinaw na diwa ng mariing pagtanggi nang hindi nagdaragdag ng isang tiyak na sumpa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pakiusap” upang ihayag ang magalang na נָא, at pinanatili ang bahagyang di-pangkaraniwang anyo ng panunumpa upang hindi mawala ang kulay at taimtim na puwersa ng Hebreo. Ang panghalip sa “sumagot siya” ay pinanatili upang sundan ang anyo ng tekstong Hebreo, bagaman malinaw sa konteksto na si Eliseo ang sumagot.
