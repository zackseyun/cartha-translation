  yaml_path: translation/ot/2_kings/002/025.yaml
  text: And he went from there to Mount Carmel, and from there he returned to Samaria.
translation:
  language: tl
  text: Mula roon ay pumunta siya sa Bundok Carmel, at mula roon ay bumalik siya sa Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ay pumunta siya
  rationale: Isinusulong ng wayyiqtol ang salaysay bilang payak na nagdaang kilos. Natural sa modernong Filipino ang ayos na ito kasunod ng pariralang “Mula roon.”
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tumutukoy ang pang-abay sa pag-alis mula sa naunang lugar; malinaw at likas itong katumbas sa Filipino.
- source_word: אֶל
  choice: sa
  rationale: Ipinapakita ng pang-ukol ang patutunguhan. Sa pandiwang “pumunta,” ang “sa” ang natural na katumbas sa Filipino.
- source_word: הַר הַכַּרְמֶל
  choice: Bundok Carmel
  rationale: Pangalan ito ng heograpikong lugar; pinanatili ang kinikilalang anyong “Carmel” at isinalin ang הַר bilang “Bundok.”
- source_word: וּמִשָּׁם
  choice: at mula roon
  rationale: Pinananatili nito ang pag-uugnay at sinadyang pag-uulit sa Hebreo habang nananatiling natural sa Filipino.
- source_word: שָׁב
  choice: bumalik siya
  rationale: Sa konteksto ng paglalakbay, ang שׁוּב ay nangangahulugang bumalik sa isang lugar.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Ito ang nakasanayang anyo ng pangalan ng lugar sa Filipino at sa mga salin ng Bibliya.
