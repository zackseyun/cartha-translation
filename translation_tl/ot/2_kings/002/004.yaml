  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: tl
  text: Sinabi ni Elias sa kanya, “Eliseo, manatili ka rito, pakiusap, sapagkat isinugo ako ni Yahweh sa Jerico.” Ngunit sinabi ni Eliseo, “Isinusumpa ko sa buhay ni Yahweh at sa buhay mo na hindi kita iiwan.” Kaya pumunta silang dalawa sa Jerico.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: manatili ka muna
  rationale: Sa konteksto, ang utos na שֵׁב ay humihiling kay Eliseo na huwag nang sumama, kaya mas angkop ang “manatili” kaysa literal na “umupo.” Ipinahihiwatig ng “muna” ang magalang na pakiusap ng נָא sa natural na Filipino.
- source_word: פֹה
  choice: rito
  rationale: Karaniwang katumbas ng simpleng pang-abay na tumutukoy sa lugar; natural itong kasama ng “manatili.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שְׁלָחַנִי
  choice: isinugo ako
  rationale: Ang pandiwa ay tumutukoy sa misyong ibinigay kay Elias; ang “isinugo” ay malinaw at marangal sa Filipino.
- source_word: יְרִיחוֹ
  choice: Jerico
  rationale: Ginamit ang nakaugaliang modernong anyong Filipino ng pangalan ng lugar.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili ang anyo at taimtim na puwersa ng Hebreong pormula ng panunumpa nang hindi ito ginagawang karaniwang pahayag lamang.
- source_word: וְחֵי נַפְשְׁךָ
  choice: at buhay ka rin
  rationale: Sa pormula ng panunumpa, ang נֶפֶשׁ ay tumutukoy sa buhay ng kausap, hindi lamang sa isang hiwalay na di-materyal na “kaluluwa.” Pinananatili rin nito ang paralelismo sa “Buhay si Yahweh.”
- source_word: אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  rationale: 'Sa eliptikong pormula ng panunumpa, ang אִם ay may ipinahihiwatig na negatibong diwa: “kung iiwan kita” bilang taimtim na “hindi kita iiwan.” Kailangang sabihin nang tahasan ang pagtanggi sa natural na Filipino.'
- source_word: וַיָּבֹאוּ
  choice: Kaya pumunta silang dalawa
  rationale: Isinusulong ng wayyiqtol ang salaysay. Ang “kaya” ay nagpapakita ng bunga ng pagtanggi ni Eliseo, at ang “silang dalawa” ay likas na nagpapahayag ng pangmaramihang paksa sa konteksto.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng נֶפֶשׁ sa pormula ng panunumpa
  choice: buhay ka rin
  alternative: buhay ang iyong kaluluwa
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong pagkatao ni Elias. Iniiwasan ng salin ang pagpasok ng isang tiyak na pananaw tungkol sa pagkakahiwalay ng kaluluwa at katawan.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Elias,” “Eliseo,” at “Jerico” bilang mga nakaugaliang anyong Filipino. Pinanatili ang maikli at taimtim na anyo ng panunumpa, habang ginawang tahasan ang negatibong diwa na ipinahihiwatig lamang ng Hebreo.
