  naturalness: Natural ang kabuuang Filipino, kabilang ang “isinugo ako” at “pumunta silang dalawa.” Mas malinaw at likas sa modernong Filipino ang hayagang pormula ng panunumpa sa direktang pananalita.
  terminology: Ang “Yahweh,” “Elias,” “Eliseo,” at “Jerico” ay angkop at pare-pareho. Ang “buhay” para sa נֶפֶשׁ sa kontekstong ito ay hindi nagpapasok ng di-kinakailangang doktrinal na kahulugan.
