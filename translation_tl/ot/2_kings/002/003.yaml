base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: tl
  text: Pagkatapos, lumabas ang mga alagad ng mga propeta na nasa Bethel at lumapit kay Eliseo. Sinabi nila sa kanya, “Alam mo ba na sa araw na ito ay kukunin ni Yahweh ang iyong panginoon mula sa ibabaw ng iyong ulo?” Sumagot siya, “Alam ko rin. Tumahimik kayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: mga alagad ng mga propeta
  rationale: Ang Hebreong idyomang literal na ‘mga anak ng mga propeta’ ay tumutukoy sa mga kasapi o disipulo ng pangkat ng mga propeta. Mas malinaw sa modernong Tagalog ang ‘mga alagad’ nang hindi ipinapalagay na literal silang mga anak.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: na nasa Bethel
  rationale: Tinutukoy ng parirala ang lokasyon ng pangkat; natural at tumpak sa Tagalog ang ‘na nasa Bethel.’
- source_word: הֲיָדַעְתָּ
  choice: Alam mo ba
  rationale: Ito ang natural na tanong sa Tagalog para sa Hebreong anyong nagtatanong tungkol sa kasalukuyang kaalaman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֹקֵחַ
  choice: kukunin
  rationale: Ang participle ay nagpapahiwatig ng tiyak at nalalapit na kilos na mangyayari ‘sa araw na ito’; ang ‘kukunin’ ay natural sa Tagalog at pinananatili ang aspektong iyon.
- source_word: אֲדֹנֶיךָ
  choice: iyong panginoon
  rationale: Tumutukoy ito kay Elias bilang nakatataas at guro ni Eliseo, hindi sa Diyos. Ang ‘panginoon’ ay marangal at naipapakita ang relasyong may awtoridad.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: mula sa pagiging pinuno mo
  rationale: Literal itong ‘mula sa ibabaw ng iyong ulo,’ isang larawang tumutukoy sa pag-aalis sa taong may awtoridad sa kanya. Isinalin ang kahulugan ng idyoma upang maging malinaw at natural sa Tagalog.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Alam ko rin
  rationale: Malinaw na pinananatili ng ‘rin’ ang גַּם, na nagsasaad na taglay rin ni Eliseo ang kaalamang binanggit ng pangkat.
- source_word: הֶחֱשׁוּ
  choice: Tumahimik kayo
  rationale: Maramihan ang pautos sa Hebreo. Ang ‘Tumahimik kayo’ ay natural, tuwiran, at may sapat na bigat sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa pag-aalis kay Elias mula kay Eliseo
  choice: mula sa pagiging pinuno mo
  alternative: mula sa ibabaw ng iyong ulo
  rationale: Ang Hebreong larawan ay nagpapahiwatig ng awtoridad ni Elias kay Eliseo. Inilalahad ng pangunahing teksto ang idyomatikong kahulugan nang hindi dinaragdagan ang paraan o layunin ng pagkuha sa kanya.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil tahasang nasa Hebreo ang Tetragrammaton, pinananatili ang pangalan sa transliterasyong ‘Yahweh’ at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘mga alagad ng mga propeta’ upang maiwasan ang maling pagkaunawang biyolohikal sa Hebreong idyoma, at pinanatiling maigsi at mariin ang sagot ni Eliseo.
