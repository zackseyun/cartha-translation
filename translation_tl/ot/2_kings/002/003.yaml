  to: Pagkatapos, lumabas ang mga alagad ng mga propeta na nasa Bethel at lumapit kay Eliseo. Sinabi nila sa kanya, “Alam mo ba na sa araw na ito ay kukunin ni Yahweh ang iyong panginoon mula sa ibabaw ng iyong ulo?” Sumagot siya, “Alam ko rin. Tumahimik kayo.”
