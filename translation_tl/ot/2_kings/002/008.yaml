base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: tl
  text: Pagkatapos ay kinuha ni Elias ang kanyang balabal[a], binilot ito, at hinampas ang tubig. Nahati ang tubig sa magkabilang panig[b], at silang dalawa ay tumawid sa tuyong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mantel.” Tumutukoy ang Hebreo sa panlabas na kasuotan ni Elias.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nahati rito at roon,” ibig sabihin, sa magkasalungat na mga panig.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: kanyang balabal
  rationale: Ang אַדֶּרֶת ay tumutukoy rito sa panlabas na kasuotan ni Elias. Ang “balabal” ay natural at malinaw sa makabagong Filipino at angkop sa kasuotang maaaring irolyo at ipanghampas.
- source_word: וַיִּגְלֹם
  choice: inirolyo iyon
  rationale: Ipinahihiwatig ng pandiwa ang pagbibilot o pagrolyo sa kasuotan. Tuwiran at madaling mailarawan ang “inirolyo.”
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: hinampas ang tubig
  rationale: Karaniwang nangangahulugang humampas ang נכה. Pinananatili ng salin ang lakas at tuwirang kilos nang walang dagdag na pagpapakahulugan.
- source_word: וַיֵּחָצוּ
  choice: nahati ang tubig
  rationale: Maramihan ang pandiwang Hebreo sapagkat ang ipinahihiwatig na simuno ay “mga tubig,” ngunit mas natural sa Filipino ang kolektibong “ang tubig.” Napananatili ng “nahati” ang resultang kilos.
- source_word: הֵנָּה וָהֵנָּה
  choice: sa magkabilang panig
  rationale: Ang idyomang Hebreo ay nagpapahiwatig na ang tubig ay nahati patungo sa dalawang magkasalungat na panig. Natural at tiyak sa Filipino ang “sa magkabilang panig.”
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: silang dalawa ay tumawid
  rationale: Pinananatili nito ang tahasang diin ng שְׁנֵיהֶם na kapwa tumawid ang dalawang tauhan.
- source_word: בֶּחָרָבָה
  choice: sa tuyong lupa
  rationale: Ang חָרָבָה sa ganitong salaysay ng pagtawid ay lupang natuyo o nalantad sa gitna ng tubig. Ang “sa tuyong lupa” ay malinaw at hindi nagdaragdag ng paliwanag.
- source_word: וַיִּקַּח
  choice: Pagkatapos, kinuha
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Natural na ipinahahayag ito ng “Pagkatapos” sa modernong Filipino.
theological_decisions:
- issue: Mahimalang pagkahati ng tubig
  choice: Ilarawan nang tuwiran na nahati ang tubig at tumawid sila sa tuyong lupa.
  alternative: Gumamit ng mas malayang pananalitang “bumuka ang tubig” o magdagdag ng paliwanag tungkol sa himala.
  rationale: Tuwirang inilalahad ng Hebreo ang paghampas ni Elias, pagkahati ng tubig, at pagtawid sa tuyong lupa. Pinananatili ng salin ang mahimalang pangyayari nang hindi ito ginagawang natural na penomenon o dinaragdagan ng komentaryong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Elias,” ang karaniwang anyong Filipino ng pangalan. Pinanatili ang mabilis na takbo ng salaysay at ang tuwirang paglalarawan sa himala.
