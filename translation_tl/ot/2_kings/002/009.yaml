  text: וַ/יְהִ֣י כְ/עָבְרָ֗/ם וְ/אֵ֨לִיָּ֜הוּ אָמַ֤ר אֶל אֱלִישָׁע֙ שְׁאַל֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ בְּ/טֶ֖רֶם אֶלָּקַ֣ח מֵ/עִמָּ֑/ךְ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע וִֽ/יהִי נָ֛א פִּֽי שְׁנַ֥יִם בְּ/רוּחֲ/ךָ֖ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: tl
  text: 'Nang makatawid na sila, sinabi ni Elias kay Eliseo, “Humiling ka kung ano ang maaari kong gawin para sa iyo bago ako kunin mula sa piling mo.” Sinabi ni Eliseo, “Nakikiusap ako: mapasaakin nawa ang dobleng bahagi[a] ng iyong espiritu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “dalawang bahagi ng iyong espiritu ang mapasaakin.” Ang idyomang Hebreo ay tumutukoy sa dobleng bahagi at malamang na umaalingawngaw sa bahaging mana ng panganay.
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong espiritu” ay tumutukoy sa espiritu o kaloob na kaugnay ng propetikong ministeryo ni Elias. Nauunawaan ito ng ilan bilang kahilingan para sa kapangyarihang propetiko na dalawang beses na higit kaysa kay Elias.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Nang makatawid na sila
  rationale: Ang anyong may hulaping pangmaramihan ay tumutukoy kina Elias at Eliseo. Ipinahihiwatig ng sugnay na natapos muna ang pagtawid bago nagsalita si Elias.
- source_word: שְׁאַל
  choice: Hilingin mo
  rationale: Tuwirang pautos ito na nag-aanyaya kay Eliseo na magsabi ng kahilingan; mas angkop dito ang “hilingin” kaysa sa karaniwang “itanong.”
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: kung ano ang gagawin ko para sa iyo
  rationale: Pinananatili nito ang bukas na alok ni Elias nang hindi nagpapasok ng katiyakang higit sa ipinahihiwatig ng Hebreo.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: bago ako kunin mula sa piling mo
  rationale: 'Ang pandiwa ay balintiyak: si Elias ang kukunin. Ang “mula sa piling mo” ay nagpapanatili sa diwa ng paghihiwalay sa isang likas at marangal na paraang Tagalog.'
- source_word: וִיהִי נָא
  choice: 'Nakikiusap ako: mapasaakin nawa'
  rationale: Ipinahahayag ng “nakikiusap ako” ang magalang na pakiusap ng נָא, samantalang ang “nawa” ay nagpapakita ng himig ng kahilingan ng pandiwa.
- source_word: פִּי שְׁנַיִם
  choice: dobleng bahagi
  rationale: Idyoma itong tumutukoy sa dalawang takdang bahagi o dobleng mana, at malamang na umaalingawngaw sa bahagi ng panganay. Hindi ito isinaling “dobleng kapangyarihan” upang hindi paunang ipasiya ang kahulugan.
- source_word: בְּרוּחֲךָ
  choice: ng iyong espiritu
  rationale: Pinananatili ang tahasang panghalip na “iyong” at ang di-tiyak na “espiritu,” nang hindi tahasang ginagawang teknikal na katawagan para sa Espiritu Santo.
- source_word: אֵלָי
  choice: mapasaakin
  rationale: Bagaman literal na “sa akin,” likas sa Tagalog ang “mapasaakin” para sa hinihiling na pagtanggap o pagkakaloob ng espiritung kaugnay ng ministeryo ni Elias.
theological_decisions:
- issue: Kahulugan ng dobleng bahagi ng espiritu ni Elias
  choice: Kahilingan para sa dobleng bahagi o takdang mana ng espiritung taglay ni Elias, na malamang ay may alusyon sa mana ng panganay
  alternative: Kahilingan para sa kapangyarihang espirituwal na makalawang ulit kaysa kay Elias
  rationale: Pinananatili ng “dobleng bahagi” ang idyoma at alusyong pampamana nang hindi nilulutas ang pahayag bilang tiyak na paghahambing ng antas ng kapangyarihan.
- issue: Tinutukoy ng “iyong espiritu”
  choice: Ang espiritu o kaloob na kaugnay ng propetikong ministeryo ni Elias
  alternative: Isang tuwirang teknikal na pagtukoy sa Espiritu Santo bilang persona
  rationale: Ang hulaping paari ay tumutukoy sa espiritung nauugnay o katangian ni Elias. Ang maliit na titik at literal na “iyong espiritu” ay umiiwas sa pagpasok ng doktrinang hindi tahasang itinatakda ng Hebreo.
- issue: Hindi binanggit na kumikilos sa pagkuha kay Elias
  choice: Panatilihin ang balintiyak na “ako kunin”
  alternative: Tukuyin ang Diyos bilang tahasang tagaganap
  rationale: Hindi pinangalanan ng sugnay na Hebreo ang tagaganap. Pinananatili ng balintiyak ang pahiwatig at hindi dinaragdagan ang teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang mga pangalang “Elias” at “Eliseo,” na pamilyar sa tradisyong Tagalog. Ang “mula sa piling mo” at “mapasaakin nawa” ay bahagyang mataas ang rehistro ngunit malinaw at angkop sa salaysay at pakiusap.
