    issue: Hindi gaanong likas at bahagyang malabo ang “Hilingin mo kung ano ang gagawin ko para sa iyo.”
    rationale: Ang utos na שאל ay paanyayang maghain ng kahilingan, samantalang ang “kung ano ang gagawin ko” ay maaaring marinig na parang si Eliseo ang inuutusang humiling ng isang aksiyon na nakatakda na. Ang “Humiling ka kung ano ang maaari kong gawin para sa iyo” ay malinaw na alok at nananatiling di-singaw ang modal na puwersa.
  - severity: low
    issue: Hindi eksakto ang paglalarawan sa talababa a na “Sa literal na anyo, ‘dalawang bahagi.’”
