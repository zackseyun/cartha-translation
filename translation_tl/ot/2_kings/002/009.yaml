revisions:
- from: 'Nang makatawid na sila, sinabi ni Elias kay Eliseo, “Hilingin mo kung ano ang gagawin ko para sa iyo bago ako kunin mula sa piling mo.” Sinabi ni Eliseo, “Nakikiusap ako: mapasaakin nawa ang dobleng bahagi[a] ng iyong espiritu[b].”'
  to: 'Nang makatawid na sila, sinabi ni Elias kay Eliseo, “Humiling ka kung ano ang maaari kong gawin para sa iyo bago ako kunin mula sa piling mo.” Sinabi ni Eliseo, “Nakikiusap ako: mapasaakin nawa ang dobleng bahagi[a] ng iyong espiritu[b].”'
  rationale: Inayos ang pangunahing alok ni Elias para sa likas at malinaw na Filipino, nang pinananatili ang di-tiyak na modal na puwersa ng Hebreo. Inayos din ang dalawang talababa upang maging tumpak ang paglalarawan sa idyoma at malinaw ang alternatibong interpretasyon, nang hindi ito itinatanghal bilang piniling kahulugan.
