  naturalness: 'Natural at angkop sa modernong Filipino Tagalog ang pangunahing teksto. May maliit ngunit malinaw na suliranin sa anyo ng talababa: ang “pagiging nakakataas sa iyo” ay hindi likas na Tagalog; mas maayos ang “pagiging nakatataas sa iyo.”'
  terminology: Ang “Yahweh” ay wastong katumbas ng Tetragrammaton ayon sa itinakdang patakaran. Ang “panginoon mo,” na maliit ang titik, ay maaaring tumukoy sa taong may awtoridad at hindi kinakailangang ipakahulugang banal na titulo. Ang “mga anak ng mga propeta” ay sadyang malapit sa idyomang Hebreo at hindi nito ipinagpapalagay ang isang tiyak na institusyonal na kahulugan.
