    rationale: Ang “nakakataas” ay karaniwang nangangahulugang nakapagpapataas o nakaaangat, samantalang ang tinutukoy dito ay katayuang mas mataas o may awtoridad. Ang “pagiging nakatataas sa iyo” ang natural na anyo at mas tumpak na nagpapahayag ng ipinaliliwanag na alternatibo.
