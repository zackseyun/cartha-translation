  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: tl
  text: Pagkatapos, lumapit kay Eliseo ang mga anak ng mga propeta na nasa Jerico at sinabi sa kanya, “Alam mo ba na ngayong araw ay kukunin na ni Yahweh ang panginoon mo mula sa ibabaw ng ulo mo[a]?” Sumagot siya, “Alam ko rin. Manahimik kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa pagiging nakatataas sa iyo.” Sa Hebreo, literal na “mula sa ibabaw ng ulo mo,” isang idyomang maaaring tumukoy sa pag-aalis sa isang taong may awtoridad sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit
  rationale: Likas at tuwirang ipinapahayag nito ang paglapit ng pangkat kay Eliseo.
- source_word: בְנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  rationale: Pinananatili ang konkretong idyomang Hebreo sa halip na agad itong ipakahulugang “mga alagad ng mga propeta” o “pangkat ng mga propeta.”
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: na nasa Jerico
  rationale: Tinutukoy nito ang pangkat na naroon sa Jerico nang hindi ipinahihiwatig na nagmula lamang sila roon.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: הֲיָדַעְתָּ
  choice: Alam mo ba
  rationale: Natural na tanong sa modernong Tagalog para sa kasalukuyang pagkaalam na ipinahihiwatig ng konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֹקֵחַ
  choice: kukunin na
  rationale: Ipinapahayag ng anyong participle ang nalalapit na pagkilos; ang “na” ay nagbibigay ng diwa ng pagiging malapit nang mangyari nang natural sa Tagalog.
- source_word: אֲדֹנֶיךָ
  choice: panginoon mo
  rationale: Pinananatili ang diwa ng isang taong may awtoridad kay Eliseo; maliit ang titik upang malinaw na si Elias, hindi ang Diyos, ang tinutukoy.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: mula sa ibabaw ng ulo mo
  rationale: Pinananatili ang kakaibang konkretong larawan ng Hebreo sa pangunahing teksto; ipinapaliwanag sa talababa ang malamang na idyomatikong diwa.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Alam ko rin
  rationale: Natural na naipapahayag ang idinagdag at madiing tugon ni Eliseo.
- source_word: הֶחֱשׁוּ
  choice: Manahimik kayo
  rationale: Tumpak na ipinapakita ang mariin at maramihang pautos sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasan ang Tetragrammaton sa pinagmulan, kaya pinananatili ang banal na pangalan sa halip na palitan ng titulo.
- issue: Kung ipaliliwanag sa pangunahing teksto ang מֵעַל רֹאשֶׁךָ
  choice: Panatilihin ang “mula sa ibabaw ng ulo mo”
  alternative: “mula sa pamumuno sa iyo” o “mula sa pagiging nakakataas sa iyo”
  rationale: Malamang na tumutukoy ito sa pag-aalis kay Elias bilang nakatataas kay Eliseo, ngunit pinananatili ng pangunahing teksto ang larawan at posibleng lawak ng kahulugan ng Hebreo; nasa talababa ang paliwanag.
- issue: Paglalarawan sa ugnayan ni Elias kay Eliseo sa אֲדֹנֶיךָ
  choice: panginoon mo
  alternative: amo mo, guro mo, o pinuno mo
  rationale: Hindi nililimitahan ng salin ang ugnayan sa pagiging guro lamang o sa isang modernong relasyong amo-manggagawa; pinananatili nito ang pangkalahatang diwa ng personal na awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang mga susing idyomang Hebreo kapag ang mas malayang salin ay maaaring magsara ng tunay na kalabuan; gumamit ng maikling talababa para sa paliwanag.
