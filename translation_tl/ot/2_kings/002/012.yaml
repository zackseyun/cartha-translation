base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: tl
  text: At nakatingin si Eliseo at sumisigaw, “Ama ko, ama ko! Ang karwahe ng Israel at ang mga mangangabayo nito!”[a] Pagkatapos, hindi na niya nakita si Elias. Hinawakan niya ang sarili niyang mga damit at pinunit ang mga ito sa dalawang piraso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang karwahe at mga mangangabayo ng Israel.” Maaaring kinikilala ng sigaw ni Eliseo si Elias bilang tunay na lakas at tanggulan ng Israel, o maaaring tumutukoy ito sa makalangit na karwahe at mga kabayong nasasaksihan niya.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: nakatingin
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy na pagkilos habang dinadala si Elias; natural na ipinahahayag ito ng “nakatingin” sa Tagalog.
- source_word: מְצַעֵק
  choice: habang sumisigaw
  rationale: Pinananatili nito ang sabayang at duratibong kilos ng participle, pati ang matinding damdamin ng sigaw.
- source_word: אָבִי אָבִי
  choice: Ama ko, ama ko!
  rationale: Pinananatili ang unang panauhang hulapi at ang pag-uulit na nagpapahayag ng matinding damdamin; tumutukoy ito sa ugnayan ng propeta at alagad, hindi kinakailangang sa likas na ama.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Ang karwahe ng Israel at ang mga mangangabayo nito
  rationale: Direktang pinananatili ang isahang “karwahe,” maramihang “mga mangangabayo,” at panlalaking isahang hulapi sa “nito,” nang hindi ipinapaliwanag ang talinghaga sa pangunahing teksto.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Pagkatapos, hindi na niya nakita si Elias
  rationale: Ang “hindi na” ay likas na Tagalog para sa pagtigil na ipinahahayag ng עוֹד; nililinaw ng pangalang “Elias” ang referent ng hulapi nang walang pagbabago sa kahulugan.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: Hinawakan niya ang sarili niyang mga damit
  rationale: Natural na inilalarawan ang mahigpit na paghawak sa mga damit niya mismo bilang paghahanda sa pagpunit.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: pinunit ang mga iyon sa dalawa
  rationale: Malinaw at natural na Tagalog para sa resultang paghahati ng mga damit sa dalawang piraso bilang tanda ng pagdadalamhati.
theological_decisions:
- issue: Kahulugan ng sigaw na “Ama ko, ama ko! Ang karwahe ng Israel at ang mga mangangabayo nito!”
  choice: Pinanatili bilang tuwirang sigaw at hindi ipinaliwanag sa pangunahing teksto.
  alternative: Maaaring kinikilala si Elias bilang tunay na lakas at tanggulan ng Israel, o maaaring tumutukoy si Eliseo sa makalangit na karwahe at mga kabayong nasasaksihan niya.
  rationale: Pinahihintulutan ng Hebreo ang dalawang kaugnay na pagbasa; ang literal na talinghaga sa teksto at paliwanag sa talababa ay nagpapanatili sa tunay na interpretatibong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; ginamit ang “karwahe” at “mangangabayo” bilang madaling maunawaang mga salitang angkop sa salaysay. Pinanatili ang duratibong kilos at ang kalabuan ng matalinghagang sigaw.
