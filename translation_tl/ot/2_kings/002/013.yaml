  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: tl
  text: Pinulot niya ang balabal[a] ni Elias na nalaglag mula kay Elias. Pagkatapos, bumalik siya at tumayo sa pampang ng Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mantel.” Ang salitang Hebreo ay tumutukoy sa isang natatanging panlabas na kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: Pinulot
  rationale: Ang רום ay literal na may diwang pag-angat, ngunit dahil kasuotang nalaglag ang tinutukoy, likas at tiyak sa Filipino ang “pinulot.”
- source_word: אַדֶּרֶת
  choice: balabal
  rationale: Tumutukoy ito sa isang natatanging panlabas na kasuotan. Ang “balabal” ay malinaw at marangal sa modernong Filipino, habang ang “mantel” ay maaaring hindi gaanong karaniwan.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Filipino.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: na nalaglag mula sa kanya
  rationale: Tuwirang pinananatili ang kamag-anak na sugnay at ang diwang nahulog ang balabal mula kay Elias.
- source_word: וַיָּשָׁב
  choice: bumalik siya
  rationale: Karaniwang kahulugan ng שׁוב ang bumalik o magbalik; natural dito ang “bumalik siya.”
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Tuwirang katumbas ng pandiwang nagsasaad ng pagtayo.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: sa pampang ng Jordan
  rationale: Sa konteksto ng ilog, natural na katumbas ng שׂפה ang “pampang.” Hindi na idinagdag ang “Ilog” dahil pangalan lamang na Jordan ang nasa Hebreo.
