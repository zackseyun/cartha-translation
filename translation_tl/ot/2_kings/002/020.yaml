  source_fidelity: Tumpak na naipapahayag ng draft ang utos na magdala ng bagong maliit na sisidlan, lagyan ito ng asin, at ang kasunod na pagdadala nito kay Eliseo. Gayunman, ang huling pangungusap na “dinalhan nila siya nito” ay hindi malinaw at maaaring mabasa na ang tao ang dinalhan gamit ang isang bagay, sa halip na ang sisidlan ang dinala sa kanya.
  naturalness: Likas at angkop ang register ng pangunahing utos. Mas idiomatiko at malinaw sa modernong Filipino ang “dinala nila ito sa kanya” para sa pangwakas na kilos. Inayos din ang balarila ng talababa.
  terminology: Ang “sisidlan” ay maingat at angkop na pangkalahatang salin ng צְלֹחִית; hindi nito ipinipilit ang tiyak na hugis. Ang “asin” at “bagong” ay tuwiran at wasto. Walang suliraning teolohikal o pangngalan.
