translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sisidlan” upang huwag tukuyin nang higit sa Hebreo ang hugis ng lalagyan; pinanatili ang magalang na pangmaramihang pautos na “ninyo.”
