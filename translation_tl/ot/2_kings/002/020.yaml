  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: tl
  text: Sinabi niya, “Dalhan ninyo ako ng isang bagong sisidlan[a] at lagyan ninyo iyon ng asin.” Kaya dinala nila ito sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin itong isalin na “mangkok,” “banga,” o “prasko”; pangkalahatang tumutukoy ang Hebreo sa isang maliit na lalagyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng אמר; malinaw ang pagpapatuloy ng pangyayari kahit walang tahasang “at.”
- source_word: קְחוּ לִי
  choice: Dalhan ninyo ako
  rationale: Bagaman literal na “kunin para sa akin,” ipinahihiwatig ng konteksto ang pagkuha at pagdadala ng hinihinging bagay kay Eliseo.
- source_word: צְלֹחִית
  choice: sisidlan
  rationale: Ang salitang Hebreo ay tumutukoy sa isang maliit na lalagyan ngunit hindi tiyak ang hugis; pinananatili ng “sisidlan” ang lawak na ito at iniiwasang ipalagay na mangkok, banga, o prasko iyon.
- source_word: חֲדָשָׁה
  choice: bagong
  rationale: Tuwirang katumbas ng pang-uri at malinaw na tumutukoy sa sisidlan.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: at lagyan ninyo iyon ng asin
  rationale: Natural na Filipino para sa literal na “maglagay kayo roon ng asin”; ang “iyon” ay malinaw na tumutukoy sa bagong sisidlan.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: Kaya dinalhan nila siya nito
  rationale: Sa konteksto, ang לקח ay pagkuha at paghahatid ng hiniling na sisidlan kay Eliseo; ang “nito” ay likas na nagpapahayag ng implicit na layon.
