revisions:
- from: Ngunit kinuha ni Jehosheba, na anak na babae ni Haring Joram at kapatid ni Ahazias, si Joas na anak ni Ahazias. Palihim niya itong inilayo mula sa mga anak ng hari na pinapatay, at isinama ang tagapagpasuso nito[a] sa silid-tulugan[b]. Itinago nila[c] siya mula kay Atalia, kaya hindi siya napatay.
  to: Ngunit kinuha ni Jehosheba, na anak na babae ni Haring Joram at kapatid ni Ahazias, si Joas na anak ni Ahazias. Palihim niya siyang inilayo mula sa mga anak na lalaki ng hari na pinapatay at dinala siya, kasama ang tagapagpasuso niya[a], sa silid-tulugan[b]. Itinago nila[c] siya mula kay Atalia, kaya hindi siya napatay.
