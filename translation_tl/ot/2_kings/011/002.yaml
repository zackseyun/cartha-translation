id: 2KI.11.2
reference: 2 Kings 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: tl
  text: Ngunit kinuha ni Jehosheba, na anak na babae ni Haring Joram at kapatid ni Ahazias, si Joas na anak ni Ahazias. Palihim niya siyang inilayo mula sa mga anak na lalaki ng hari na pinapatay at dinala siya, kasama ang tagapagpasuso niya[a], sa silid-tulugan[b]. Itinago nila[c] siya mula kay Atalia, kaya hindi siya napatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng nagpapasuso sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “silid ng mga higaan.”
    reason: lexical_alternative
  - marker: c
    text: 'Pangmaramihan ang pandiwang Hebreo: “itinago nila siya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: kinuha
  rationale: Karaniwang pandiwang pasalaysay ang לקח; ang “kinuha” ay natural at hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: יְהוֹשֶׁבַע
  choice: Jehosheba
  rationale: Isinalin sa baybay na malapit sa Hebreong anyo sa Mga Hari, nang hindi ipinapantay sa ibang anyo ng pangalan sa Mga Cronica.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: anak na babae ni Haring Joram
  rationale: Malinaw na ipinakikilala ng pariralang konstruktibo si Jehosheba bilang anak na babae ng haring si Joram.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: kapatid ni Ahazias
  rationale: Ang אחות ay karaniwang nangangahulugang kapatid na babae; hindi ito pinalabnaw bilang “kamag-anak” upang lutasin ang usaping panggenealohiya.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: palihim niya itong inilayo
  rationale: Pinananatili nito ang lihim na pagkilos at ang puwersa ng גנב sa konteksto ng pagliligtas, habang iniiwasan ang di-likas o maling pahiwatig ng literal na “ninakaw niya siya” sa modernong Tagalog.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: mula sa mga anak ng hari
  rationale: Tuwirang inililipat ang בני המלך nang hindi ito binibigyang-kahulugang “mga prinsipe.” Sa kontekstong Hebreo, tumutukoy ito sa mga lalaking anak.
- source_word: הַמּוּמָתִים
  choice: na pinapatay
  rationale: Ipinapahayag ng Hophal participle ang nagpapatuloy na pagpatay sa mga anak ng hari.
- source_word: מֵינִקְתּוֹ
  choice: tagapagpasuso nito
  rationale: Tiyak na tinutukoy ng salita ang babaeng nagpapasuso sa bata, hindi lamang isang pangkalahatang tagapag-alaga.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: sa silid-tulugan
  rationale: Natural na katumbas sa modernong Tagalog ng literal na “silid ng mga higaan,” na tumutukoy sa isang silid na tulugan.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: itinago nila siya
  rationale: Pinananatili ang pangmaramihang pandiwa ng tekstong Masoretiko sa halip na pakinisin ito bilang pang-isahan.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: mula kay Atalia
  rationale: Natural na ipinahahayag ang pagtatago sa bata upang hindi siya makita o maabot ni Atalia.
- source_word: וְלֹא הוּמָת
  choice: kaya hindi siya napatay
  rationale: Ang “kaya” ay malinaw na naghahayag ng bunga ng pagtatago, at ang “napatay” ay natural na pasibong katumbas ng Hebreo.
theological_decisions:
- issue: Posibleng pagharmonisa sa ugnayang pampamilya
  choice: Pinanatili ang “kapatid ni Ahazias.”
  alternative: “Kamag-anak ni Ahazias” upang mapadali ang pagharmonisa sa ibang datos na panggenealohiya.
  rationale: Karaniwang salita para sa kapatid na babae ang ginamit ng Hebreo. Hindi dapat ipasok ng salin ang isang solusyong pangharmonisa na hindi hinihingi ng talata.
- issue: Simuno ng “itinago”
  choice: 'Isinalin bilang pangmaramihan: “itinago nila.”'
  alternative: 'Pang-isahan: “itinago niya.”'
  rationale: Pangmaramihan ang anyo ng pandiwa sa tekstong Masoretiko, kaya pinanatili ang tunay na tensiyon sa pagitan nito at ng nag-iisang babaeng tahasang pinangalanan sa naunang sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagpasuso” upang maipakita ang tiyak na tungkulin ng babae. Hinati sa tatlong pangungusap ang mahabang Hebreong pangungusap para sa likas na daloy, ngunit pinanatili ang ayos ng mga pangyayari at ang pangmaramihang “itinago nila.”
