base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: tl
  text: Pagkatapos, gumawa si Jehoiada ng tipan[a] sa pagitan ni Yahweh at ng hari at ng bayan, upang ang bayan ay maging bayan ni Yahweh[b], at sa pagitan din ng hari at ng bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan,” isang karaniwang idyoma na nangangahulugang gumawa ng tipan.
    reason: lexical_alternative
  - marker: b
    text: O, “maging isang bayan para kay Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: itinatag
  rationale: Ang כרת ברית ay karaniwang idyomang Hebreo na literal na “pumutol ng tipan” ngunit nangangahulugang gumawa o magtatag ng tipan. Ang “itinatag” ay likas sa Filipino at hindi ipinahihiwatig na si Jehoiada mismo ang kabilang panig sa tipan.
- source_word: הַבְּרִית
  choice: ang tipan
  rationale: May tiyak na pantukoy sa Hebreo, at pinananatili ng “tipan” ang pormal at panrelihiyong bigat ng בְּרִית.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: sa pagitan ni Yahweh at ng hari at ng bayan
  rationale: Pinananatili nito ang magkakaugnay na mga panig na tahasang inuulit ng Hebreo sa pamamagitan ng בֵּין, nang hindi ginagawang labis na mabigat ang pangungusap sa Filipino.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: upang sila ay maging isang bayan para kay Yahweh
  rationale: Ipinahahayag ng sugnay ang layunin o bunga ng tipan. Pinananatili ng “para kay Yahweh” ang relasyonal na anyo at hindi agad pinapalitan ng tahasang paari.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: at gayundin ang tipan sa pagitan ng hari at ng bayan
  rationale: Nililinaw ng “gayundin” na may hiwalay ding ugnayang tipan sa pagitan ng hari at ng bayan, habang ang salitang “tipan” ay inuulit para sa natural at malinaw na Filipino.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עָם ay tumutukoy rito sa sambayanan bilang isang kolektibong katawan; ang “bayan” ay maikli, dignipikado, at angkop sa kontekstong tipan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan at ang kabuluhan nito sa konteksto ng tipan.
- issue: Kung tahasang gagawing paari ang pormulang לִהְיוֹת לְעָם לַיהוָה
  choice: maging isang bayan para kay Yahweh
  alternative: maging bayan ni Yahweh
  rationale: Ang paari ay lehitimong kahulugan, ngunit pinananatili ng napiling anyo ang mas literal na relasyonal na pahayag at ang bahagyang luwag ng Hebreo.
- issue: Ugnayan ng mga panig sa unang tipan
  choice: sa pagitan ni Yahweh at ng hari at ng bayan
  alternative: sa pagitan nina Yahweh, ng hari, at ng bayan
  rationale: Ang Hebreo ay maaaring basahin bilang tipan ni Yahweh sa hari at sa bayan, kasunod ng hiwalay na tipan ng hari at bayan. Hindi ginagawang tahasang tatlong magkakapantay na panig ang konstruksyon upang mapanatili ang estruktura at tensiyon ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “itinatag ang tipan” sa halip na ang literal at di-likas na “pumutol ng tipan.” Pinanatili ang pangalang Yahweh at ang dalawang magkaugnay ngunit magkahiwalay na ugnayang tipan.
