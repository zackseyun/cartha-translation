  naturalness: Mas natural sa makabagong Filipino ang “gumawa ... ng tipan” kaysa “itinatag ... ang tipan” sa kontekstong ito. Ang “isang bayan para kay Yahweh” ay medyo di-likas at maaaring magmukhang lokatibo o layuning gamit ang “para kay”; mas idiomatiko ang “maging bayan ni Yahweh.”
  terminology: Ang “tipan,” “Yahweh,” “hari,” at “bayan” ay angkop at pare-pareho sa marangal ngunit modernong rehistro. Pinanatili ang “Yahweh” para sa Tetragrammaton.
