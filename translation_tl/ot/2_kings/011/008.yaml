  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: tl
  text: Palibutan ninyo ang hari sa lahat ng panig; bawat isa ay may sandata sa kamay. Ang sinumang pumasok sa mga hanay ay papatayin. Manatili kayong kasama ng hari sa kanyang paglabas at pagpasok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: Palibutan ninyo ang hari sa lahat ng panig
  rationale: Ipinahahayag ng anyong Hiphil at ng סָבִיב ang utos na bumuo ng buong proteksiyon sa palibot ng hari. Likas sa modernong Tagalog ang “palibutan ... sa lahat ng panig” at pinananatili nito ang diin ng Hebreo.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: na hawak ng bawat isa ang kanyang mga sandata
  rationale: 'Distributibo ang אִישׁ: bawat bantay ay kailangang nakahanda. Sa kontekstong militar, “mga sandata” ang angkop na kahulugan ng כְּלִי; natural ding Tagalog ang “hawak ... ang kanyang mga sandata.”'
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Ang sinumang pumasok sa hanay ng mga bantay
  rationale: Ang participle na may pantukoy ay pangkalahatan, kaya “ang sinuman.” Ang שְּׂדֵרוֹת ay tumutukoy sa mga nakaayos na hanay; idinagdag ang “mga bantay” upang maging malinaw ang militar na konteksto nang hindi binabago ang diwa.
- source_word: יוּמָת
  choice: ay papatayin
  rationale: Ang Hophal ay nagpapahayag ng pasibong utos na ipapatay ang lumabag. Ang “papatayin” ay tuwiran, marangal, at malinaw sa Tagalog.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Manatili kayo sa tabi ng hari
  rationale: Ipinagpapatuloy ng sugnay ang serye ng mga utos at nagpapahiwatig ng pagsama at pagbabantay. Ang “sa tabi” ay natural na nagpapakita ng malapit na proteksiyon.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: kapag siya ay lumalabas at kapag siya ay pumapasok
  rationale: Pinananatili ang magkatambal na larawang Hebreo ng paglabas at pagpasok habang gumagamit ng natural na modernong Tagalog. Sa konteksto, saklaw nito ang lahat ng pagkilos ng hari.
