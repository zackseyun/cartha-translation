translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa isang utos-militar. Ginamit ang pangmaramihang “ninyo/kayo” dahil maraming bantay ang kinakausap. Walang talababa sapagkat malinaw na nailalahad sa teksto ang kahulugan ng שְּׂדֵרוֹת; ang mga marker at paliwanag sa ibinigay na English consultation layer ay tila hindi nagtutugma sa kani-kanilang lokasyon.
