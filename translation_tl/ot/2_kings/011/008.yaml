  to: Palibutan ninyo ang hari sa lahat ng panig; bawat isa ay may sandata sa kamay. Ang sinumang pumasok sa mga hanay ay papatayin. Manatili kayong kasama ng hari sa kanyang paglabas at pagpasok.
