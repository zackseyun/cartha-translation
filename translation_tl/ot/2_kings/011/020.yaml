base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: tl
  text: Nagalak ang lahat ng mamamayan ng lupain, at tumahimik ang lungsod. Si Atalia naman ay pinatay nila sa pamamagitan ng tabak sa bahay ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa palasyo ng hari.” Maikli at siksik ang pariralang Hebreo, kaya maaaring unawain nang may bahagyang pagkakaiba ang tiyak na lokasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: nagalak
  rationale: Tumpak na ipinahahayag ang kagalakan ng sama-samang paksa at pinananatili ang masiglang diwa ng pandiwa.
- source_word: כָּל עַם הָאָרֶץ
  choice: ang lahat ng mamamayan ng lupain
  rationale: Pinananatili ang sangkap na ‘lupain’ at ang posibleng panlipunan at pampolitikang diwa ng parirala, habang malinaw sa makabagong Tagalog.
- source_word: הָעִיר שָׁקָטָה
  choice: tumahimik ang lungsod
  rationale: Likas na salin sa Tagalog na nagsasaad na natigil ang kaguluhan, nang hindi labis na binibigyang-kahulugan bilang ganap na kapayapaan.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Si Atalia naman
  rationale: Ang ‘naman’ ay nagpapakita ng paglipat ng paksa at bahagyang diin na dulot ng inuuna at minarkahang tuwirang layon sa Hebreo.
- source_word: הֵמִיתוּ
  choice: pinatay nila
  rationale: Direkta at natural na ipinahahayag ang causative na ‘pinangyaring mamatay’; hindi nito ipinagpapalagay ang mas tiyak na pormal na legal na pagbitay.
- source_word: בַחֶרֶב
  choice: sa pamamagitan ng tabak
  rationale: Malinaw na ipinakikita ang gamit na instrumento at pinananatili ang tahasang ‘tabak.’
- source_word: בֵּית מלך
  choice: sa bahay ng hari
  rationale: Malapit sa literal na ‘bahay ng hari’ at hindi agad pinapalitan ng mas interpretatibong ‘palasyo’; inilalahad sa talababa ang posibleng katumbas na iyon.
