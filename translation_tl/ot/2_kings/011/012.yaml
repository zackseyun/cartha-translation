  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: tl
  text: Pagkatapos, inilabas niya ang anak ng hari, ipinutong sa kanya ang korona, at ibinigay sa kanya ang patotoo.[a] Ginawa nila siyang hari at pinahiran siya ng langis. Pumalakpak sila at sumigaw, “Mabuhay ang hari!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kasulatan ng tipan” o “ang atas.” Sa Hebreo, “ang patotoo,” na malamang ay tumutukoy sa isang nakasulat na saksi na may kaugnayan sa pamumuno ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: inilabas niya
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng יצא at natural sa modernong Tagalog.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: ang anak ng hari
  rationale: Tuwiran at natural na salin ng construct chain nang hindi ipinapalagay na kailangan ang mas tiyak na 'prinsipe.'
- source_word: הַנֵּזֶר
  choice: ang korona
  rationale: Sa kontekstong maharlika, tumutukoy ito sa sagisag ng paghahari; mas malinaw sa karaniwang mambabasa ang 'korona' kaysa 'diyadema.'
- source_word: הָעֵדוּת
  choice: ang patotoo
  rationale: Pinananatili ang malawak at literal na kahulugan ng Hebreo nang hindi tiyakang ipinapakahulugan bilang isang dokumento ng tipan o kautusan.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: itinalaga nila siyang hari
  rationale: Ipinahahayag ang causative na 'ginawang hari' sa natural at dignified na Tagalog, at iniiwasang ulitin ang ideya ng pagpuputong ng korona.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: pinahiran ng langis
  rationale: Ang 'pinahiran' ay pamantayang salin ng משׁח; idinagdag ang 'ng langis' upang malinaw sa ordinaryong mambabasa ang seremonyal na gawain.
- source_word: וַיַּכּוּ כָף
  choice: pumalakpak sila
  rationale: Natural na katumbas sa Tagalog ng idyomang literal na 'hinampas ang palad/kamay' bilang pampublikong pagpupugay.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mabuhay ang hari!
  rationale: Karaniwan at natural na pormula ng pagpupugay na nagpapanatili sa jussive na lakas ng Hebreo.
theological_decisions:
- issue: Kahulugan ng הָעֵדוּת sa seremonya ng pagluklok
  choice: patotoo
  alternative: kasulatan ng tipan; kautusan
  rationale: Maaaring tumukoy ang salita sa isang nakasulat na saksi o sa mga pananagutang kaugnay ng tipan para sa hari, ngunit hindi iyon tahasang tinutukoy ng Hebreo. Pinananatili ng pangunahing teksto ang tunay na lawak ng salita, habang inilalahad sa talababa ang mga posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Gumamit ng maiikling sugnay upang madaling sundan ang magkakasunod na kilos sa seremonya, habang pinananatili ang pormal na himig ng pagluklok sa hari.
