  to: Pagkatapos, inilabas niya ang anak ng hari, ipinutong sa kanya ang korona, at ibinigay sa kanya ang patotoo.[a] Ginawa nila siyang hari at pinahiran siya ng langis. Pumalakpak sila at sumigaw, “Mabuhay ang hari!”
  rationale: Ginawang mas tuwiran ang pandiwang pagluklok (“ginawa nilang hari”), pinalitan ang hindi gaanong likas na panghalip na “dito” ng “sa kanya,” at nilinaw ang layon ng pagpapahid. Pinanatili ang maingat na “patotoo” at ang talababa upang huwag magpasiya nang lampas sa hindi tiyak na kahulugan ng העדות.
