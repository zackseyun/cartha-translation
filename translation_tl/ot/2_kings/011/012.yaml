    rationale: Bagaman nauunawaan, ang “dito” ay mas karaniwang panturo ng lugar/bagay at hindi ang pinakanatural na panghalip para sa batang lalaki sa modernong Tagalog. “Sa kanya” ang mas malinaw.
  - severity: low
