base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: tl
  text: Pagkatapos, inutusan ng paring si Jehoiada ang mga pinuno ng tig-iisang daan na inatasang mamahala sa hukbo. Sinabi niya sa kanila, “Ilabas ninyo siya sa pagitan ng mga hanay,[a] at patayin sa tabak ang sinumang susunod sa kanya.” Sapagkat sinabi ng pari, “Huwag siyang patayin sa bahay ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa labas ng mga hanay” o “sa lugar sa pagitan ng mga hanay.” Mahirap unawain ang pariralang Hebreo; malamang na tumutukoy ito sa paglalabas sa kanya sa pamamagitan ng nakaayos na mga hanay ng mga bantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng tig-iisang daan
  rationale: Pinananatili ang sinaunang titulong militar at iniiwasang magpasok ng terminong Romano gaya ng “senturyon.”
- source_word: פְּקֻדֵי הַחַיִל
  choice: na itinalaga sa hukbo
  rationale: Ipinahahayag ang pasibong diwa ng פקד at ang tungkuling administratibo ng mga pinuno kaugnay ng hukbo.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Ilabas ninyo siya
  rationale: Natural na salin ng causative imperative ng יצא sa konteksto ng isang tuwirang utos.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: sa pagitan ng mga hanay
  rationale: Mahirap ang pariralang Hebreo, ngunit malamang na tumutukoy ito sa paglalabas sa kanya sa gitna o daraanan ng maayos na mga hanay ng mga bantay; pinananatili ang kawalang-katiyakan sa talababa.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: ang sinumang susunod sa kanya
  rationale: Ang isahang participle na may article ay ginagamit sa pangkalahatang diwa, kaya ang “sinuman” ang natural na katumbas.
- source_word: הָמֵת בֶּחָרֶב
  choice: patayin sa tabak
  rationale: Tuwiran at malinaw na ipinahahayag ang mariing utos na pagpatay gamit ang tabak.
- source_word: אַל תּוּמַת
  choice: Huwag siyang patayin
  rationale: Natural na Filipino para sa pasibong pagbabawal; hindi binabago ang nilalaman ng utos.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong idyomang Hebreo na “bahay,” na sa konteksto ay tumutukoy sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng utos laban sa sumusunod kay Atalia
  choice: ang sinumang susunod sa kanya
  alternative: ang taong lalabas kasunod niya
  rationale: Maaaring tumukoy ang parirala sa isang tagasuporta o sa sinumang pisikal na susunod sa kanya. Hindi nililinaw ng salin ang layunin nang higit sa ipinahihiwatig ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga pinuno ng tig-iisang daan” upang mapanatili ang sinaunang titulong militar, at ang “bahay ni Yahweh” upang mapanatili ang idyomang Hebreo nang nauunawaan sa konteksto bilang templo.
