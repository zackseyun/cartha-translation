id: 2KI.11.1
reference: 2 Kings 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: tl
  text: Nakita ni Atalia, na ina ni Ahazias, na patay na ang kanyang anak. Kaya bumangon siya at nilipol ang lahat ng supling ng maharlikang angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng binhi ng kaharian,” na nangangahulugang ang maharlikang linya o mga inapo ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: Atalia
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan. Hindi isinalin nang hiwalay ang panimulang waw bilang “ngayon” sapagkat pang-ugnay ito sa daloy ng salaysay, hindi tahasang panandang temporal.
- source_word: אֵם אֲחַזְיָהוּ
  choice: na ina ni Ahazias
  rationale: Malinaw at natural na pinananatili ang pariralang nagpapakilala kay Atalia ayon sa kaugnayan niya kay Ahazias.
- source_word: וַתָּרְאֶה כִּי מֵת בְּנָהּ
  choice: Nakita ... na patay na ang kanyang anak
  rationale: Ang ראה + כי ay tumutukoy sa pagkakita o pagkaalam sa isang katotohanan, at ang “patay na” ay nagpapanatili sa resultang kalagayang ipinahihiwatig ng מֵת.
- source_word: וַתָּקָם
  choice: Kaya bumangon siya
  rationale: Pinananatili ng “bumangon” ang larawan ng קום bilang pagsisimula ng isang tiyak at mapagpasiyang pagkilos; ipinakikita ng “kaya” ang kasunod na bunga sa salaysay.
- source_word: וַתְּאַבֵּד
  choice: nilipol
  rationale: Ang piel ng אבד ay nagpapahayag ng pagpapahamak o pagwasak. Sa kontekstong ito, natural na ipinahahayag ng “nilipol” ang pagpatay sa buong pangkat nang hindi dinaragdagan ang paraan ng pagpatay.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: ang lahat ng supling ng maharlikang angkan
  rationale: Ang זֶרַע ay literal na “binhi” ngunit tumutukoy rito sa mga inapo o supling, samantalang ang הַמַּמְלָכָה ay may dinastikong diwa. Malinaw sa modernong Filipino ang “maharlikang angkan” bilang ang linya ng naghaharing pamilya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Hinati sa dalawang pangungusap upang maging natural ang takbo nang hindi nawawala ang sanhi at bunga. Inilagay ang talababa sa pariralang ipinaliliwanag nito.
