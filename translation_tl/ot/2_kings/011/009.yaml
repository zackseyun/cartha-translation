translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Sabbath” upang panatilihin ang tiyak na tawag sa araw, at ipinaliwanag sa talababa ang literal na wika tungkol sa pagpasok at paglabas upang mapanatili ang tunay na saklaw ng Hebreo.
