  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang mga pinuno ng daan-daang tauhan, ang ganap na pagsunod sa utos ni Joiada, ang pagkuha ng kani-kanilang tauhan, at ang pagpunta nila sa pari. Gayunman, ang “matatapos sa tungkulin” ay hindi gaanong tuwirang katapat ng יֹצְאֵי (‘mga lumalabas/umaalis’) at maaaring tumukoy sa mga matatapos pa lamang, sa halip na sa pangkat na paalis na. Mas tapat at natural ang “mga aalis sa tungkulin.”'
