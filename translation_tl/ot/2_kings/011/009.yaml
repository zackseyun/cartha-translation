  terminology: Ang “Joiada na pari” ay wastong anyo para sa Jehoiada at ang “Sabbath” ay katanggap-tanggap na tiyak na katawagan. Ang “tauhan” ay angkop sa kontekstong militar. Walang problemang teolohikal o pangalang dapat baguhin.
