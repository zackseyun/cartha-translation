revisions:
- from: Kaya ginawa ng mga pinuno ng tig-iisang daang tauhan ang lahat ng iniutos ni Joiada na pari. Kinuha ng bawat isa ang kanyang mga tauhan[a]—ang mga papasok sa tungkulin sa araw ng Sabbath kasama ng mga matatapos sa tungkulin sa araw ng Sabbath—at pumunta sila kay Joiada na pari.
  to: Kaya ginawa ng mga pinuno ng mga pangkat na tig-iisang daang tauhan ang lahat ng iniutos ni Joiada na pari. Kinuha ng bawat isa ang kanyang mga tauhan[a]—ang mga papasok sa tungkulin sa araw ng Sabbath kasama ng mga aalis sa tungkulin sa araw ng Sabbath—at pumunta sila kay Joiada na pari.
  rationale: Pinalitan ang “mga matatapos sa tungkulin” ng “mga aalis sa tungkulin” upang mas tumpak na maipahayag ang ‘mga lumalabas’ at ang katapat nitong pangkat na papasok sa tungkulin. Bahagyang inayos din ang parirala para sa mga pinuno upang maging mas madaling basahin nang hindi binabago ang estrukturang militar ng Hebreo. Nananatili ang talababa upang maipakita ang mas literal na pagbasa at ang kontekstuwal na pagkaunawa sa mga pangkat ng bantay.
