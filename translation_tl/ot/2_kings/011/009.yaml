base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: tl
  text: Kaya ginawa ng mga pinuno ng mga pangkat na tig-iisang daang tauhan ang lahat ng iniutos ni Joiada na pari. Kinuha ng bawat isa ang kanyang mga tauhan[a]—ang mga papasok sa tungkulin sa araw ng Sabbath kasama ng mga aalis sa tungkulin sa araw ng Sabbath—at pumunta sila kay Joiada na pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga pumapasok sa araw ng Sabbath kasama ng mga lumalabas sa araw ng Sabbath.” Mas literal ang ganitong salin sa Hebreo, ngunit ipinahihiwatig ng konteksto na ang tinutukoy ay ang mga pangkat na nagsisimula at nagtatapos ng kanilang takdang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng tig-iisang daang tauhan
  rationale: Ipinapakita nito ang mga pinunong namamahala sa mga pangkat na tig-iisang daan, habang nananatiling malinaw at natural sa modernong Tagalog.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ang lahat ng iniutos
  rationale: Pinananatili nito ang diwa ng lubos na pagsunod sa makapangyarihang utos ni Joiada.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: Kinuha ng bawat isa ang kanyang mga tauhan
  rationale: Ang distributibong אִישׁ ay tumutukoy sa bawat pinuno, at ang אֲנָשָׁיו ay sa mga tauhang nasa ilalim ng kanyang pamamahala.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: mga papasok sa tungkulin sa araw ng Sabbath
  rationale: Sa konteksto ng mga bantay, malamang na tumutukoy ito sa pangkat na nagsisimula ng kanilang takdang tungkulin sa Sabbath; nililinaw ito nang hindi inilalayo sa larawan ng pagpasok.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: mga matatapos sa tungkulin sa araw ng Sabbath
  rationale: Kaagapay ng papasok na pangkat, tumutukoy ito sa pangkat na nagtatapos ng kanilang takdang pagbabantay. Ang salin ay natural sa Tagalog at pinananatili sa talababa ang mas literal na pagbasa.
- source_word: וַיָּבֹאוּ אֶל יְהוֹיָדָע הַכֹּהֵן
  choice: at pumunta sila kay Joiada na pari
  rationale: Payak at natural nitong isinasalin ang kilos ng paglapit nila kay Joiada at pinananatili ang kanyang katungkulan bilang pari.
