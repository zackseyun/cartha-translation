base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: tl
  text: at isang ikatlo ay sa Pintuan ng Sur, at isang ikatlo ay sa pintuan sa likod ng mga mananakbo[a]. Magbabantay kayo sa bahay upang hindi makapasok ang sinuman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bantay” o “mga bantay ng hari”; literal sa Hebreo, “mga mananakbo.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang kahulugan ng salitang Hebreo rito. Maaari rin itong mangahulugang “bilang pananggalang” o “para sa pagtatanggol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: at ang isa pang ikatlong bahagi
  rationale: Ang ordinal na pambabae ay tumutukoy sa bawat isa sa tatlong pangkat. Likas sa Filipino ang “isa pang ikatlong bahagi” sa pagpapatuloy ng paghahati-hati sa konteksto.
- source_word: בְּשַׁעַר סוּר
  choice: sa Pintuan ng Sur
  rationale: Ang שַׁעַר ay “pintuan,” at pinananatiling transliterasyon ang malamang na pangalang pantangi na סוּר.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: sa pintuan sa likod ng mga mananakbo
  rationale: Pinananatili ang karaniwang kahulugan ng אַחַר na “sa likod” at ang literal na tawag na “mga mananakbo,” nang hindi tiyakang ipinapakahulugan ang ugnayang pang-arkitektura.
- source_word: הָרָצִים
  choice: mga mananakbo
  rationale: Literal itong participial noun mula sa רוץ, “tumakbo.” Maaaring tumukoy sa mga bantay o tauhan ng hari, kaya inilagay ang functional na kahulugan sa talababa.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: Magbabantay kayo
  rationale: Natural na Filipino ito para sa cognate construction ng pandiwa at pangngalang parehong mula sa שמר, habang napapanatili ang diin sa tungkuling pagbabantay.
- source_word: הַבַּיִת
  choice: bahay
  rationale: Pinananatili ang literal at hindi tiyak na “bahay”; hindi tahasang nilulutas kung palasyo o ibang gusali ang tinutukoy.
- source_word: מַסָּח
  choice: upang hindi makapasok ang sinuman
  rationale: Ang bihira at di-tiyak na salita ay waring nagsasaad ng paghadlang o pag-iwas sa pagpasok. Isinalin ito ayon sa malamang na layunin ng pagbabantay, habang inilalahad sa talababa ang kawalang-katiyakan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “bahay” at “mga mananakbo” upang hindi labis na tukuyin ang mga salitang may posibleng mas espesipikong kahulugan sa konteksto; ang mga alternatibo at ang kawalang-katiyakan ng מַסָּח ay nasa mga talababa.
