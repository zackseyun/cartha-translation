base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: tl
  text: At ang dalawang pangkat na kabilang sa inyo[a]—lahat ng magtatapos sa tungkulin sa araw ng Sabbath[b]—ay magbabantay sa bahay ni Yahweh alang-alang sa hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebrew, “ang dalawang kamay sa inyo”; dito, malamang na nangangahulugang “ang dalawang pangkat” o “ang dalawang bahagi.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng lalabas sa araw ng Sabbath.” Sa konteksto, malamang na tumutukoy ito sa mga magtatapos sa tungkulin sa pagpapalit ng mga bantay sa araw ng Sabbath.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin, “ay magbabantay sa bahay ni Yahweh patungo sa hari/para sa hari.” Mahirap tiyakin ang kahulugan ng pang-ukol sa Hebrew; malamang na ang diwa ay pagbabantay sa bahay ni Yahweh upang maprotektahan ang hari.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: ang dalawang pangkat
  rationale: Literal itong “ang dalawang kamay,” ngunit sa kontekstong pang-organisasyon at pangbantay, ang יָד ay maaaring tumukoy sa isang bahagi o pangkat. Malinaw at likas sa Tagalog ang “dalawang pangkat.”
- source_word: בָּכֶם
  choice: sa inyo
  rationale: Ipinahihiwatig ng parirala na ang dalawang pangkat ay kabilang sa mga bantay na kinakausap.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: lahat ng matatapos sa tungkulin sa Sabbath
  rationale: Literal na tumutukoy sa “lahat ng lumalabas sa Sabbath.” Batay sa pagpapalit ng mga pangkat sa mga karatig na talata, malamang na ang tinutukoy ay ang mga nagtatapos sa kanilang pagbabantay sa Sabbath.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: ay magbabantay
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa pagtupad ng tungkuling pagbabantay. Isinalin itong payak at natural nang hindi inuulit nang alanganin ang parehong diwa.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang larawan ng Hebrew na בֵּית, habang malinaw pa rin sa konteksto na banal na gusali ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל הַמֶּלֶךְ
  choice: alang-alang sa hari
  rationale: Mahirap tiyakin ang eksaktong ugnayan ng אֶל dito. Ipinahihiwatig ng konteksto na ang pagbabantay sa bahay ni Yahweh ay ginagawa para sa kapakanan at proteksiyon ng hari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebrew; pinananatili ito bilang “Yahweh” upang hindi ito mapalitan ng isang titulo.
- issue: Ugnayan ng pagbabantay sa bahay ni Yahweh at sa hari
  choice: alang-alang sa hari
  alternative: patungo sa hari / sa tabi ng hari
  rationale: Hindi ganap na tiyak ang gamit ng pang-ukol na אֶל. Ang salin ay nagpapahayag ng malamang na layunin—ang proteksiyon ng hari—habang inilalahad sa talababa ang kahirapan ng Hebrew.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pangkat,” “matatapos sa tungkulin,” at “magbabantay” para maging natural ang salin habang pinananatili sa mga talababa ang literal na larawan at mga tunay na kalabuan ng Hebrew.
