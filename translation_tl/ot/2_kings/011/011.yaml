  terminology: Ang “mga bantay,” “mga sandata,” at “altar” ay angkop. Ang “bahay” ang dapat gamitin sa pangunahing teksto para sa הַבַּיִת; maaaring ipaliwanag sa talababa na ito ay tumutukoy sa gusali o nasasakupan ng templo.
