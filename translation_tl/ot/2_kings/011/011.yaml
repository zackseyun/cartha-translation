  to: Pumuwesto ang mga bantay[a], bawat isa na may mga sandata sa kamay, mula sa kanang bahagi ng bahay hanggang sa kaliwang bahagi ng bahay[b], sa tabi ng altar at ng bahay[c], na nakapalibot sa hari.
