base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: tl
  text: Pumuwesto ang mga bantay[a], bawat isa na may mga sandata sa kamay, mula sa kanang bahagi ng bahay hanggang sa kaliwang bahagi ng bahay[b], sa tabi ng altar at ng bahay[c], na nakapalibot sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagatakbo,” na tumutukoy rito sa mga bantay ng hari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kanang bahagi ng bahay hanggang sa kaliwang bahagi ng bahay.” Batay sa oryentasyon ng templo, maaari rin itong unawain na “mula sa bahaging timog hanggang sa bahaging hilaga.”
    reason: alternative_reading
  - marker: c
    text: Ang “bahay” rito ay tumutukoy sa gusali o nasasakupan ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: mga bantay
  rationale: Bagaman literal na kaugnay ng pagtakbo ang salita, tumutukoy ito rito sa armadong bantay ng hari; malinaw at likas sa makabagong Tagalog ang “mga bantay.”
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: bawat isa'y may hawak na mga sandata
  rationale: Distributibo ang אִישׁ, at sa kontekstong militar ang כְּלִי ay mga sandata. Inihahatid ng “may hawak” ang kahandaang ipinahihiwatig ng Hebreong “nasa kamay niya.”
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: mula sa kanang bahagi ... hanggang sa kaliwang bahagi
  rationale: Ang כֶּתֶף ay literal na “balikat” ngunit idiomatikong nangangahulugang gilid o bahagi ng gusali.
- source_word: הַבַּיִת
  choice: templo
  rationale: Bagaman “bahay” ang literal na salita, malinaw na ang templo ang tinutukoy sa konteksto; iniiwasan ng “templo” ang kalituhan sa karaniwang tahanan.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: kanang ... kaliwang
  rationale: Pinananatili ang tuwirang kahulugang kanan at kaliwa; ang posibleng templong oryentasyong timog/hilaga ay inilagay sa talababa.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: sa tabi ng altar at ng templo
  rationale: Maaaring tumukoy ang ל sa posisyon o direksiyon. Ang “sa tabi” ay natural at hindi labis na nagtatakda ng eksaktong ugnayang heograpiko.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: paikot sa hari
  rationale: Maikli at likas itong nagpapahayag ng mapangalagang pagpalibot sa hari.
