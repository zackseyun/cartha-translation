language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos, pumasok ang buong sambayanan ng lupain sa templo ni Baal[a] at giniba iyon. Lubusan nilang dinurog ang mga altar at mga imahen ni Baal[b], at pinatay nila si Matan, na pari ni Baal, sa harap ng mga altar. Pagkatapos, nagtalaga ang pari ng mga tagapangasiwa sa templo ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ni Baal.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga rebulto” o “mga larawang kumakatawan kay Baal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: ang buong sambayanan ng lupain
  rationale: Pinananatili ang panlipunan at pampolitikang katawagan sa Mga Hari nang hindi ito nililimitahan sa 'karaniwang tao' lamang; natural din ito sa makabagong Tagalog.
- source_word: בֵּית הַבַּעַל
  choice: templo ni Baal
  rationale: Bagaman literal na 'bahay ni Baal,' malinaw sa konteksto na gusaling sambahan ang tinutukoy; mas likas at madaling maunawaan sa Tagalog ang 'templo.' Inilalagay sa talababa ang literal na anyo.
- source_word: וַיִּתְּצֻהוּ
  choice: giniba iyon
  rationale: Tumpak na naghahayag ng pagbuwag o pagpapabagsak sa gusali.
- source_word: מזבחתו
  choice: mga altar ... ni Baal
  rationale: Ang anyong nasa teksto ay binabasa ayon sa konteksto bilang maramihang 'mga altar niya'; tahasang pinangalanan si Baal sa Tagalog upang maging malinaw ang reperensiya ng hulaping panlalaki.
- source_word: צְלָמָיו
  choice: mga imahen ni Baal
  rationale: Malawak ang saklaw ng צֶלֶם—imahen, rebulto, o representasyong kultiko. Hindi agad ipinapasok ang mas mapanghusgang salitang 'diyus-diyosan,' kaya napapanatili ang leksikal na lawak.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: lubusan nilang dinurog
  rationale: Naipapahayag ang masidhing pagkawasak at ang pagpapalakas na hatid ng הֵיטֵב.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: si Matan, na pari ni Baal
  rationale: Tuwirang pagkakakilanlan sa taong pinangalanan at sa kaniyang tungkulin.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: sa harap ng mga altar
  rationale: Pinananatili ang malinaw na kahulugang panlunan ng לִפְנֵי.
- source_word: וַיָּשֶׂם הַכֹּהֵן
  choice: nagtalaga ang pari
  rationale: Sa administratibong konteksto, ang 'naglagay' ay tumutukoy sa pagtatalaga ng mga tao o kaayusan sa pangangasiwa.
- source_word: פְּקֻדּוֹת
  choice: mga tagapangasiwa
  rationale: Maaaring tumukoy ang salita sa mga katungkulan, atas, o mga nangangasiwa. Ang personal na diwang 'mga tagapangasiwa' ang pinakamalinaw sa konteksto, habang kinikilalang may leksikal na kalabuan.
- source_word: בֵּית יְהוָה
  choice: templo ni Yahweh
  rationale: Ang 'templo' ay likas sa Tagalog para sa gusaling sambahan at pinananatili ang pagtutulad sa naunang templo ni Baal.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pangalan ang YHWH sa tekstong Hebreo. Ang 'Yahweh' ay malawak na rekonstruksiyon ng pagbigkas at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Referensiya ng mga altar at imahen
  choice: mga altar at mga imahen ni Baal
  alternative: mga altar at mga imahen ng templo
  rationale: Panlalaking isahan ang hulaping Hebreo at natural na tumutukoy kay Baal, ngunit kaugnay rin ang mga bagay na ito sa kaniyang templo. Tahasang 'ni Baal' ang pinili para sa malinaw na Tagalog nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambayanan” para sa kolektibong bayan, “templo” para sa likas na pagtukoy sa gusaling sambahan, at “imahen” upang mapanatili ang lawak ng salitang Hebreo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
