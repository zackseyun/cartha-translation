translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal; iniwasan ang mabigat na literal na “na sinasabi” at pinanatili sa talababa ang posibleng kontekstuwal na kahulugang “palasyo ng hari.”
