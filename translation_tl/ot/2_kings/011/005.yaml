  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: tl
  text: 'At iniutos niya sa kanila, “Ito ang dapat ninyong gawin: isang-katlo sa inyo na pumapasok tuwing Sabbath ay magbabantay sa bahay ng hari[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palasyo ng hari.” Sa Hebreo, literal na “bahay ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: At iniutos niya sa kanila
  rationale: Pinananatili ng “iniutos” ang awtoritatibong puwersa ng Piel na anyo ng צוה at natural ito sa salaysay sa Tagalog.
- source_word: לֵאמֹר
  choice: Hindi isinalin nang hiwalay; tuwirang sinundan ng sipi
  rationale: Sa modernong Tagalog, sapat at natural ang tuwirang pagsipi pagkatapos ng “iniutos niya sa kanila”; ang pagdaragdag ng “na sinasabi” ay magiging mabigat at di-idiomatiko.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Ito ang dapat ninyong gawin
  rationale: Natural na Tagalog ito na pinananatili ang demonstratibong pahayag at ang puwersa ng tagubilin.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: ang ikatlong bahagi sa inyo
  rationale: Malinaw na ipinahahayag ang bahaging isang-katlo ng pangkat nang hindi nagdaragdag ng paliwanag.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: na pumapasok tuwing Sabbath
  rationale: Ang “pumapasok” ay tumutugma sa literal na diwa ng pagdating o pagpasok, samantalang ang “tuwing Sabbath” ay natural na nagsasaad ng takdang pagpapalit ng bantay nang hindi tahasang idinaragdag ang “sa tungkulin.”
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: ay magbabantay
  rationale: Maikli at idiomatikong paglalarawan ng pagganap sa tungkuling pagbabantay; ipinakikita ng “magbabantay” ang puwersa ng utos sa konteksto.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili ang literal na Hebreong parirala at hindi agad nililimitahan ang kahulugan sa “palasyo,” bagaman malamang na iyon ang tinutukoy sa konteksto.
