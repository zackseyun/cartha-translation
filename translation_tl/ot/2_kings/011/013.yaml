  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: tl
  text: Nang marinig ni Atalia ang ingay[b] ng mga bantay[a] at ng mga tao, lumapit siya sa mga tao sa bahay ni Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga mananakbo”; malamang na tumutukoy ito sa pangkat ng mga bantay ng hari o sa kaniyang personal na bantay.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “ingay” ay maaari ring isaling “tunog” o “tinig.”
    reason: lexical_alternative
  - marker: c
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo at maaaring saklawin ang mga bakuran nito.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: nang marinig
  rationale: Ang שׁמע sa pasalaysay na anyong ito ay tumutukoy sa karaniwang pagkarinig, hindi sa sinasadyang pakikinig.
- source_word: עֲתַלְיָה
  choice: Atalia
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong Tagalog.
- source_word: קוֹל
  choice: ingay
  rationale: Maaaring mangahulugan ang קוֹל na tinig, tunog, o ingay. Sa tagpong may mga bantay at nagkakatipong mga tao, likas na ipinahihiwatig ng “ingay” ang sama-samang alingawngaw nang hindi itinatakda ang eksaktong uri nito.
- source_word: הָרָצִין
  choice: mga bantay
  rationale: Literal itong kaugnay ng “mga mananakbo,” ngunit sa konteksto ng hari ay tumutukoy sa pangkat ng mga tanod o personal na bantay. Mas malinaw sa kasalukuyang Tagalog ang “mga bantay”; inilagay sa talababa ang literal na katawagan.
- source_word: הָעָם
  choice: mga tao
  rationale: Ito ang tuwirang katumbas ng עָם at hindi labis na tinutukoy kung sila ay buong bayan o ang nagkakatipong madla lamang.
- source_word: וַתָּבֹא אֶל
  choice: pumunta siya sa
  rationale: Ang בוא na may אֶל ay nagsasaad ng paglapit o pagpunta sa isang tao o lugar; natural sa pananaw ng salaysay ang “pumunta.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong larawan ng בֵּית bilang “bahay” at tahasang isinasalin ang banal na pangalang יהוה bilang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata. Ang “Yahweh” ay nagpapanatili sa hayag na tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng “bahay ni Yahweh”
  choice: Pinanatili ang “bahay ni Yahweh” sa pangunahing teksto
  alternative: templo ni Yahweh
  rationale: Ang literal na parirala ay “bahay ni Yahweh,” samantalang malinaw sa konteksto na templo at mga bakuran nito ang tinutukoy. Inilagay ang paglilinaw sa talababa upang hindi mawala ang larawan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “bahay ni Yahweh” para sa pormal na ugnayan sa Hebreo, ngunit nilinaw sa talababa na templo ang tinutukoy. Ang “mga bantay” ay mas madaling maunawaan kaysa sa literal na “mga mananakbo,” na iniingatan bilang alternatibo sa talababa.
