  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: tl
  text: At dinakip nila siya[a]. Dumaan siya sa daang pinapasukan ng mga kabayo patungo sa palasyo ng hari[b], at doon siya pinatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ipinatong nila sa kaniya ang mga kamay,” ibig sabihin, dinakip nila siya. Ipinapalagay naman ng ilang salin na ang kahulugan ay “binigyan nila siya ng daan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bahay ng hari.” Ang “daan na pinapasukan ng mga kabayo” ay malamang na ruta o lagusan na ginagamit ng mga kabayo upang makapasok sa lugar ng palasyo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: dinakip nila siya
  rationale: Ang idyoma ay literal na ‘ipinatong/inilagay nila sa kaniya ang mga kamay,’ ngunit sa konteksto ay tumutukoy sa pagdakip kay Atalia. Ang ‘dinakip’ ay likas at malinaw sa modernong Tagalog; inilalahad sa talababa ang mas literal na anyo at ang ibang posibleng pagbasa.
- source_word: וַתָּבֹא
  choice: dumaan siya
  rationale: Ang pandiwang בוא ay maaaring ‘pumunta’ o ‘dumating’ ayon sa pananaw. Kasama ng דֶּרֶךְ, likas sa Tagalog ang ‘dumaan siya’ upang ipahayag ang kilos sa tinukoy na ruta, nang hindi ginagawang pasibo ang pandiwa.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: sa pasukan ng mga kabayo
  rationale: Ipinahahayag ng דֶּרֶךְ ang rutang dinaanan at ng מְבוֹא ang pasukan. Iniiwasan ng ‘pasukan’ ang mas tiyak na ‘pintuan’ o ‘tarangkahan,’ na hindi tahasang sinasabi ng Hebreo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Literal itong ‘bahay ng hari,’ ngunit sa konteksto ay ang maharlikang palasyo o kompleks nito. Ang ‘palasyo ng hari’ ay malinaw at natural sa karaniwang mambabasa.
- source_word: וַתּוּמַת
  choice: siya pinatay
  rationale: 'Ang Hophal ng מות ay causative-passive: pinapangyaring mamatay, kaya higit na tumpak ang ‘pinatay’ kaysa simpleng ‘namatay.’ Hindi na idinagdag ang isang di-tahasang tagaganap.'
- source_word: שָׁם
  choice: doon
  rationale: Karaniwang pang-abay na panlunan na tumutukoy sa lugar ng pagpatay.
