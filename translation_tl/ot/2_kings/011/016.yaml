translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘dinakip’ at ‘palasyo’ para sa likas na daloy, habang pinanatili sa mga talababa ang literal na anyo at tunay na alternatibong pagbasa. Ang sunod-sunod na kilos sa Hebreo ay inihayag sa maiikling pangungusap para sa kalinawan.
