id: 2KI.11.19
reference: 2 Kings 11:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: tl
  text: Pagkatapos, isinama ni Jehoiada ang mga pinuno ng tig-iisang daan, ang mga Carita[a], ang mga mananakbo[b], at ang buong sambayanan ng lupain. Dinala nila ang hari pababa mula sa bahay ni Yahweh, at dumaan sila sa pintuan ng mga mananakbo patungo sa palasyo ng hari. At umupo ang hari sa trono ng mga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang salitang Hebreo; maaari ring isalin na “mga Kereteo” o “mga tanod.”
    reason: alternative_reading
  - marker: b
    text: Ang “mga mananakbo” ay malamang na mga maharlikang tanod o mensahero. Gayundin sa “pintuan ng mga mananakbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama ni Jehoiada
  rationale: Bagaman panghalip lamang ang paksa sa Hebreo, si Jehoiada ang malinaw na tinutukoy sa konteksto. Ipinahahayag ng “isinama” ang pagkuha o pagsama niya sa mga grupong nakalista.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng tig-iisang daan
  rationale: Pinananatili nito ang estrukturang militar ng Hebreo nang hindi gumagamit ng terminong Romano gaya ng “senturyon.”
- source_word: הַכָּרִי
  choice: mga Carita
  rationale: Hindi tiyak ang katawagan. Ang transliterasyon ay umiiwas sa di-makatwirang pagtukoy kung ito ay pangalan ng pangkat-etniko o tungkulin ng mga bantay.
- source_word: הָרָצִים
  choice: mga mananakbo
  rationale: Ito ang literal na larawan sa Hebreo. Sa kontekstong maharlika, maaaring tumukoy ito sa mga tanod o mensahero, kaya nililinaw iyon sa talababa.
- source_word: כָּל עַם הָאָרֶץ
  choice: ang buong sambayanan ng lupain
  rationale: Pinananatili ang pagtukoy sa mamamayan ng Juda nang hindi ipinapalagay na mga karaniwang tao lamang o bawat indibidwal sa bansa ang saklaw.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Inihatid nila ang hari pababa
  rationale: Ipinakikita ng pangmaramihang pandiwa na ang nagkakatipong pangkat ang kumilos, at pinananatili ng “pababa” ang direksiyong ipinahihiwatig ng ירד.
- source_word: מִבֵּית יְהוָה
  choice: mula sa bahay ni Yahweh
  rationale: Pinananatili ang literal na “bahay” at ang banal na pangalang Yahweh, pati ang pagkakatulad nito sa kasunod na bahay ng hari.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: dumaan sila sa Pintuan ng mga Mananakbo
  rationale: Likas sa modernong Tagalog ngunit malapit sa anyo ng Hebreo; pinananatili rin nito ang opisyal na katawagan sa pintuan.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Mas natural at agad na malinaw sa Tagalog kaysa “bahay ng hari,” samantalang tumpak pa ring tumutukoy sa maharlikang tirahan.
- source_word: וַיֵּשֶׁב
  choice: umupo ang hari
  rationale: Nililinaw ang paksang hari sa Tagalog; ang kahulugang pagluklok ay lumilitaw mula sa banggit sa trono.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: sa trono ng mga hari
  rationale: Pinananatili ang di-karaniwang pangmaramihang anyo ng Hebreo at ang pahiwatig ng dinastikong paghalili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa paraang malinaw sa modernong mambabasa.
- issue: Ang “trono ng mga hari” bilang dinastikong pahayag
  choice: pinanatili ang pangmaramihang “mga hari”
  alternative: trono ng kaharian; maharlikang trono
  rationale: Hindi pinapantay sa mas pangkalahatang katawagan ang anyong Hebreo, kaya nananatili ang posibleng diin sa trono ng sunud-sunod na mga hari ng Juda.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sambayanan” para sa kolektibong mamamayan at “palasyo” para sa likas na pagtukoy sa bahay ng hari. Pinanatili ang “bahay ni Yahweh,” “mga mananakbo,” at “trono ng mga hari” upang mapangalagaan ang mahahalagang larawan at tensiyong leksikal ng Hebreo.
