  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: tl
  text: At nanatili siyang kasama niya sa bahay ng PANGINOON, na nagtatago sa loob ng anim na taon, habang naghahari si Atalia sa lupain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אִתָּהּ
  choice: At nanatili siyang kasama nito
  rationale: Ipinahahayag ang patuloy na pananatili ni Joas kasama ng babaeng tinutukoy sa naunang talata; ang “nito” ay natural na paraan upang mapanatili ang pambabaeng reperensiya sa konteksto.
- source_word: בֵּית יְהוָה
  choice: sa bahay ng PANGINOON
  rationale: Ang “bahay” ay malinaw at karaniwang katawagan para sa templo sa kontekstong ito; isinasalin ang banal na pangalan ayon sa tradisyunal na anyong PANGINOON.
- source_word: מִתְחַבֵּא
  choice: na nagtatago
  rationale: Ang hitpael participle ay naglalarawan ng nagpapatuloy na kalagayan o gawain ng pagtatago, hindi lamang ng pagiging itinago.
- source_word: שֵׁשׁ שָׁנִים
  choice: sa loob ng anim na taon
  rationale: Natural na Filipino para sa tagal ng pananatili at pagtatago.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: naghahari ... sa lupain
  rationale: Pinananatili ang progresibong diwa ng participle at ang malawak na katawagang “lupain,” sa halip na paliitin agad ito sa isang mas tiyak na pangalang pampolitika.
theological_decisions:
- issue: Paglalarawan sa pagtatago ni Joas
  choice: na nagtatago
  alternative: na nakatago
  rationale: Ang anyong Hebreo na מִתְחַבֵּא ay mas tuwirang nagpapahiwatig na siya ay nasa kalagayan o gawain ng pagtatago. Hindi nito itinatanggi na itinago rin siya ng iba ayon sa konteksto.
- issue: Paglalarawan sa pamumuno ni Atalia
  choice: habang naghahari si Atalia
  alternative: samantalang si Atalia ang reyna
  rationale: Mas malapit ang pandiwang “naghahari” sa participle na מֹלֶכֶת at hindi nagdaragdag ng titulo na hindi tahasang ginamit sa sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang bahagyang pormal na “lupain” at ang tradisyunal na PANGINOON para sa tetragrammaton. Walang footnote dahil hindi kailangan para sa malinaw na pagbasa ng talata.
