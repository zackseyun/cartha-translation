  source_fidelity: 'Tumpak ang pangunahing diwa: si Joas ay kasama ng babaeng binanggit sa naunang talata sa bahay ni Yahweh, nagtatago nang anim na taon, habang naghahari si Atalia sa lupain. Ang "nanatili" ay katanggap-tanggap para sa וַיְהִי sa kontekstong ito, at ang "naghahari" ay angkop para sa participle na מֹלֶכֶת.'
  naturalness: Hindi natural at maaaring maling maunawaan ang "kasama nito." Sa modernong Tagalog, ang "nito" ay karaniwang pang-angking anyo o pantukoy sa bagay/di-malapit na tinutukoy, hindi ang likas na panghalip para sa taong kasamang tinutukoy rito. Ang "kasama niya" ang natural na katumbas, bagaman hindi naipapakita ng Tagalog ang kasariang pambabae na nasa Hebreo; malinaw naman ito sa naunang konteksto.
  terminology: Ang "bahay ng PANGINOON" ay angkop para sa בֵּית יְהוָה at kaayon ng audit trail na "house of the LORD." Ang "Atalia," "nagtatago," at "lupain" ay wasto at nasa angkop na rehistro.
