base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos, ibinigay ng pari sa mga pinuno ng tig-iisang daang kawal ang mga sibat[a] at kalasag ni Haring David na nasa bahay ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang sibat.” Maaaring kolektibo ang gamit ng anyong isahan, kaya isinaling “mga sibat.”
    reason: lexical_alternative
  - marker: b
    text: O “templo ni Yahweh.” Literal na “bahay ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Pagkatapos, ibinigay
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng mga pangyayari.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang salin ng pangngalang isahan na may pantukoy.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: sa mga pinuno ng tig-iisang daang kawal
  rationale: Tumutukoy ito sa mga pinunong militar na namamahala sa mga pangkat na tig-iisang daan; nilinaw ang ipinahihiwatig na mga kawal para sa likas na Tagalog.
- source_word: הַחֲנִית
  choice: ang mga sibat
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong gamiting kolektibo; sinusuportahan ito ng pamamahagi sa maraming pinuno at ng kasunod na maramihang “mga kalasag.”
- source_word: הַשְּׁלָטִים
  choice: mga kalasag
  rationale: Ang “mga kalasag” ang pinakakaraniwan at pinakanaaangkop na kahulugan sa konteksto ng mga sandatang maharlika na iniingatan sa templo.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: na pag-aari ni Haring David
  rationale: Pinananatili nito ang relasyong pagmamay-ari sa Hebreo nang hindi ipinapalagay nang higit sa teksto kung kailan o paano napunta roon ang mga sandata.
- source_word: בְּבֵית יְהוָה
  choice: nasa bahay ni Yahweh
  rationale: Malapit ito sa literal na “bahay ni Yahweh” at nauunawaan sa konteksto bilang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang nasa tekstong Hebreo, kaya pinananatili ang anyong “Yahweh” nang hindi ito ginagawang titulong “PANGINOON.”
- issue: Isahan o kolektibong kahulugan ng הַחֲנִית
  choice: mga sibat
  alternative: ang sibat
  rationale: Tunay na isahan ang anyong Hebreo, ngunit maaaring kolektibo ang gamit nito sa konteksto ng mga sandatang ibinibigay sa maraming pinuno. Inilalahad sa talababa ang literal na anyo upang mapanatili ang ambiguidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tig-iisang daang kawal” upang maipaliwanag nang likas ang Hebreong katawagang militar, at “bahay ni Yahweh” upang mapanatili ang larawan ng orihinal habang nagbibigay ng “templo” bilang alternatibo sa talababa.
