  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: tl
  text: Noong ikapitong taon, nagpadala si Jehoiada at ipinatawag ang mga pinuno ng tig-iisang daan na kabilang sa mga Carita[a] at mga mananakbo[b]. Dinala niya sila sa kanyang harapan, sa bahay ni Yahweh. Nakipagtipan siya sa kanila at pinanumpa sila sa bahay ni Yahweh. Pagkatapos, ipinakita niya sa kanila ang anak ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Kereteo.” Malamang na pangalan ito ng isang pangkat ng mga bantay ng hari, ngunit hindi tiyak ang eksaktong pagkakakilanlan nito.
    reason: alternative_reading
  - marker: b
    text: Ang “mga mananakbo” ay malamang na mga bantay ng hari o mga tagapagdala ng mensahe.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: Nang ikapitong taon
  rationale: Likas na panandang temporal sa Filipino; naipapahayag ang daloy ng salaysay kahit hindi hiwalay na isalin ang panimulang pang-ugnay.
- source_word: שָׁלַח וַיִּקַּח
  choice: ipinatawag
  rationale: Sa konteksto, ang pagpapadala at pagkuha sa mga opisyal ay tumutukoy sa pagpapatawag sa kanila. Iniiwasan nito ang alanganing literal na 'nagpadala at kumuha' habang pinananatili ang kilos ng teksto.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng tig-iisang daan
  rationale: Tuwirang inilalarawan ang mga opisyal na namumuno sa pangkat na tig-iisang daan at iniiwasan ang terminong may tiyak na Romanong kaugnayan.
- source_word: לַכָּרִי
  choice: mga Carita
  rationale: Pinananatili bilang katawagan sa isang pangkat ng bantay dahil hindi tiyak ang eksaktong pagkakakilanlan nito.
- source_word: וְלָרָצִים
  choice: mga mananakbo
  rationale: Pinananatili ang literal na katawagan ng pangkat; maaaring tumukoy ito sa mga bantay ng hari o mga tagapagdala ng mensahe.
- source_word: וַיָּבֵא אֹתָם אֵלָיו בֵּית יְהוָה
  choice: Dinala niya sila sa kanya sa bahay ni Yahweh
  rationale: Malinaw na ipinahahayag na dinala sila ni Jehoiada sa kanyang kinaroroonan sa banal na gusali.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: Nakipagtipan siya sa kanila
  rationale: Natural na Filipino para sa pormal na idyomang Hebreo ng paggawa ng tipan, habang pinananatili ang bigat na pampolitika at panrelihiyon nito.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: pinanumpa sila
  rationale: 'Ipinahahayag ang causative na diwa: pinagawa sila ni Jehoiada ng panunumpa.'
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: ipinakita niya sa kanila ang anak ng hari
  rationale: Tuwiran at likas na salin ng paghaharap o paghahayag sa anak ng hari.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang Yahweh upang katawanin nang tuwiran ang Tetragrammaton at mapanatili ang katangiang pangalan nito sa tipan.
- issue: Kahulugan ng בְּרִית
  choice: tipan
  alternative: kasunduan
  rationale: Ang 'tipan' ay nagpapanatili sa pormal at taimtim na bigat ng salita nang hindi ito pinapaliit sa isang karaniwang kasunduan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Isinalin ang ugnayan ng שָׂרֵי הַמֵּאוֹת sa mga Carita at mga mananakbo bilang mga pinunong nagmula sa o kabilang sa mga pangkat na iyon, sa halip na gawing tatlong magkakahiwalay na pangkat. Inilagay ang bawat talababa sa mismong terminong nililinaw nito.
