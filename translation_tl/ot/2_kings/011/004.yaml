revisions:
- from: Nang ikapitong taon, ipinatawag ni Jehoiada ang mga pinuno ng tig-iisang daan mula sa mga Carita[a] at sa mga mananakbo[b]. Dinala niya sila sa kanya sa bahay ni Yahweh. Nakipagtipan siya sa kanila at pinanumpa sila sa bahay ni Yahweh. Pagkatapos, ipinakita niya sa kanila ang anak ng hari.
  to: Noong ikapitong taon, nagpadala si Jehoiada at ipinatawag ang mga pinuno ng tig-iisang daan na kabilang sa mga Carita[a] at mga mananakbo[b]. Dinala niya sila sa kanyang harapan, sa bahay ni Yahweh. Nakipagtipan siya sa kanila at pinanumpa sila sa bahay ni Yahweh. Pagkatapos, ipinakita niya sa kanila ang anak ng hari.
  rationale: Inayos ang panimulang panahunan at ang pagdadala sa harapan ni Jehoiada para sa likas na Filipino. Ginawang mas malinaw ang sintaktikong kaugnayan ng mga pinuno ng tig-iisang daan sa mga Carita at mga mananakbo, habang pinanatili ang pag-iingat sa hindi ganap na tiyak na pagkakakilanlan ng mga Carita. Tahasang isinalin ang magkahiwalay na kilos na “nagpadala” at “ipinatawag,” nang hindi nagdaragdag ng hindi nakasaad na paraan ng pagpapadala.
