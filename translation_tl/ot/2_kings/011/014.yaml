base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: tl
  text: Nang tumingin siya, naroon ang hari, nakatayo sa tabi ng haligi[a], ayon sa kaugalian. Nasa tabi ng hari ang mga pinuno at ang mga trumpeta, at nagsasaya ang buong bayan at nagpapatunog ng mga trumpeta. Pinunit ni Atalia ang kanyang mga damit at sumigaw, “Sabwatan! Sabwatan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa haligi.” Maaaring maunawaan sa higit sa isang paraang lokatibo ang pang-ukol sa Hebreo rito.
    reason: lexical_alternative
  - marker: b
    text: O “Pagtataksil! Pagtataksil!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Pagtingin niya, naroon
  rationale: Ipinahahayag nito sa natural na Tagalog ang biglaang pagkakita at dramatikong puwersa ng הִנֵּה nang hindi gumagamit ng lipas na ekspresyon.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: ang hari, nakatayo
  rationale: Pinananatili ng anyong ito ang nagpapatuloy na kalagayang ipinakikita ng participle.
- source_word: עַל הָעַמּוּד
  choice: sa tabi ng haligi
  rationale: Sa kontekstong seremonyal, maaaring tumukoy ang עַל sa kinalalagyan na malapit sa kilalang haligi; inilalahad sa talababa ang tunay na alternatibong lokatibo.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa kaugalian
  rationale: Ang מִשְׁפָּט dito ay tumutukoy sa itinakdang kaugaliang pangseremonya, hindi sa hatol na panghukuman.
- source_word: וְהַשָּׂרִים
  choice: ang mga pinuno
  rationale: Malawak ang saklaw ng שׂרים para sa mga opisyal o lider; hindi nito labis na tinutukoy ang kanilang ranggo.
- source_word: וְהַחֲצֹצְרוֹת
  choice: ang mga trumpeta
  rationale: Mga instrumento mismo ang tahasang pinangalanan ng tekstong Hebreo, kaya hindi ito ginawang 'mga manun trumpeta.'
- source_word: אֶל הַמֶּלֶךְ
  choice: Nasa tabi ng hari
  rationale: Ang אֶל ay maaaring magpahayag ng pagiging malapit sa kontekstong ito.
- source_word: כָל עַם הָאָרֶץ
  choice: ang buong bayan
  rationale: Natural na modernong Tagalog ito para sa buong mamamayang naroon, nang hindi ipinapalagay na bawat naninirahan sa bansa ay literal na dumalo.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: nagsasaya ... at hinihipan ang mga trumpeta
  rationale: Inilalarawan nito ang aktibong pampublikong pagdiriwang at ang pagpapatunog sa mga trumpeta.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: Pinunit ni Atalia ang kanyang mga damit
  rationale: Malinaw at kasalukuyang wika ito para sa kilos ng matinding pagkabigla o dalamhati.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Sabwatan! Sabwatan!
  rationale: Ang קֶשֶׁר ay sabwatan laban sa namumuno; pinananatili ang mariing pag-uulit.
