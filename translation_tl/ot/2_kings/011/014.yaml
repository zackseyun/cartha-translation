translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mabilis at dramatikong daloy ng salaysay, ang pag-uulit sa sigaw ni Atalia, at ang mga tunay na leksikal na alternatibo sa mga talababa.
