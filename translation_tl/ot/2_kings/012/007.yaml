  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: tl
  text: Nang sumapit ang ikadalawampu't tatlong taon ng paghahari ni Haring Jehoas, hindi pa naayos ng mga pari ang mga sira sa bahay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bitak sa bahay.” Ang “bahay” dito ay tumutukoy sa templo.
    reason: Pinananatili ang posibleng mas literal na kahulugan ng בֶּדֶק at nililinaw ang kontekstuwal na tinutukoy ng הַבָּיִת.
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang sumapit
  rationale: Ipinakikilala ng anyong pasalaysay ang isang bagong yugto at ang takdang panahon nito; natural sa Filipino ang pagsasanib nito sa pormulang pantukoy sa taon.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: ang ikadalawampu't tatlong taon ng paghahari ni Haring Jehoas
  rationale: Ipinahahayag nito ang karaniwang pormula ng taon ng paghahari sa malinaw at natural na Filipino.
- source_word: לֹא חִזְּקוּ הַכֹּהֲנִים
  choice: hindi pa rin naipakumpuni ng mga pari
  rationale: Sa tambalan nito sa בֶּדֶק הַבָּיִת, ang חזק ay tumutukoy sa pagsasaayos ng pinsalang istruktural. Ipinahihiwatig ng konteksto at ng natapos nang dalawampu't tatlong taon ang patuloy na hindi pagkakagawa; ang causative na 'naipakumpuni' ay angkop dahil pinangangasiwaan ng mga pari ang gawain.
- source_word: בֶּדֶק הַבָּיִת
  choice: ang mga sira sa bahay
  rationale: Ang בֶּדֶק ay mga bitak, puwang, o pinsalang kailangang kumpunihin. Pinananatili ang literal na 'bahay' sa teksto habang nililinaw sa talababa na templo ang tinutukoy.
