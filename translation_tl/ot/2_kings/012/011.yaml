revisions:
- from: At tuwing nakikita nilang marami nang pilak sa kaban, umaakyat ang kalihim ng hari at ang punong pari, at binabalot nila at binibilang ang pilak na natipon sa bahay ng PANGINOON.
  to: At tuwing nakikita nilang maraming pilak sa kaban, umaakyat ang kalihim ng hari at ang punong pari, at itinatali nila at binibilang ang pilak na natagpuan sa bahay ng PANGINOON.
  rationale: Inalis ang dagdag na aspektong “na,” pinalitan ang “natipon” ng “natagpuan” upang tumpak na maisalin ang הַנִּמְצָא, at pinalitan ang “binabalot” ng “itinatali” upang mas malapit na maipahayag ang וַיָּצֻרוּ nang hindi nagdaragdag ng bagay o paraan ng pagbubungkos na wala sa teksto.
