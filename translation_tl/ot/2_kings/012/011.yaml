translation:
  language: tl
  text: At tuwing nakikita nilang maraming pilak sa kaban, umaakyat ang kalihim ng hari at ang punong pari, at itinatali nila at binibilang ang pilak na natagpuan sa bahay ng PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִרְאוֹתָם
  choice: tuwing nakikita nila
  rationale: Ipinahahayag ang paulit-ulit na pangyayari na ipinahihiwatig ng konteksto at ng pagkakabuo ng sugnay.
- source_word: הַכֶּסֶף
  choice: pilak
  rationale: Ang כֶּסֶף ay literal na pilak at ginagamit dito bilang salaping nakolekta.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: kalihim ng hari
  rationale: Natural na katumbas sa modernong Filipino para sa opisyal na tagapagtala o eskriba ng hari.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: punong pari
  rationale: Karaniwan at malinaw na salin ng titulong tumutukoy sa pinunong pari.
- source_word: וַיָּצֻרוּ
  choice: binabalot nila
  rationale: Ang pandiwa ay maaaring tumukoy sa pagtatali o pagbabalot ng pilak, malamang bilang mga bungkos o supot; pinananatili ng 'binabalot' ang kilos nang hindi nagdaragdag ng bagay na wala sa teksto.
- source_word: בֵית יְהוָה
  choice: bahay ng PANGINOON
  rationale: Isinasalin ang בֵית bilang 'bahay' at kinakatawan ang banal na pangalan sa nakaugaliang anyong PANGINOON.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang tradisyonal at malawak na nauunawaang anyo sa Filipino, habang hindi binabago ang tinutukoy na personal na pangalan ng Diyos.
- issue: Pagkilala sa gusali bilang templo
  choice: bahay ng PANGINOON
  alternative: templo ng PANGINOON
  rationale: Pinanatili ang pormal na larawan ng Hebrew na 'bahay' sa halip na tahasang gawing 'templo,' bagaman iyon ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na mga kilos at ang administratibong tono ng talata nang hindi nagdaragdag ng mga supot o lalagyan na hindi tahasang binanggit sa Hebrew.
