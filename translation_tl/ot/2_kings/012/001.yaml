lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: Pitong taong gulang
  rationale: Ang pariralang בֶּן + bilang + שָׁנִים ay karaniwang Hebreong pormula para sa edad. Likas at tumpak itong ipinapahayag sa Tagalog bilang “pitong taong gulang.”
- source_word: יְהוֹאָשׁ
  choice: Jehoash
  rationale: Pinananatili ang anyong mas tuwirang kumakatawan sa Hebreong pangalang יְהוֹאָשׁ; inilalagay sa talababa ang tradisyonal na alternatibong “Joash.”
- source_word: בְּמָלְכוֹ
  choice: nang siya ay magsimulang maghari
  rationale: 'Ang בְּ na may infinitive construct ng מלך at hulaping panghalip ay temporal: “nang siya ay maging hari” o “nang magsimula siyang maghari.” Ang napiling anyo ay natural sa pormula ng paghahari at hindi ipinapalagay na tumutukoy lamang ito sa katayuan.'
