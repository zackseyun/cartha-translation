revisions:
- from: Kaya ipinatawag ni Haring Jehoash si Jehoiada na pari at ang mga pari. Sinabi niya sa kanila, “Bakit hindi ninyo kinukumpuni ang mga sira sa templo[a]? Ngayon, huwag na kayong tumanggap ng salapi mula sa mga nagbibigay sa inyo[b]. Sa halip, ibigay ninyo iyon para sa pagkukumpuni ng templo.”
  to: Kaya ipinatawag ni Haring Jehoash ang paring si Jehoiada at ang mga pari. Sinabi niya sa kanila, “Bakit hindi ninyo kinukumpuni ang mga sira sa templo[a]? Ngayon, huwag na ninyong kunin ang salapi mula sa mga kakilala ninyo[b]; sa halip, ibigay ninyo ito para sa pagkukumpuni ng templo.”
  rationale: Inayos ang salitang para sa hindi tiyak na מַכָּרֵיכֶם upang hindi ipagpalagay sa pangunahing teksto na mga donor ang tinutukoy. Binago rin ang pandiwa sa “kunin,” na mas malapit sa Hebreo, at nilinaw ang pagkakaugnay ng pagbabawal at ng paglalaan ng salapi. Hindi binago ang kahulugan ng talata o ang mga anchor ng talababa.
