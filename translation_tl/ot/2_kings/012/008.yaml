  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: tl
  text: Kaya ipinatawag ni Haring Jehoash ang paring si Jehoiada at ang mga pari. Sinabi niya sa kanila, “Bakit hindi ninyo kinukumpuni ang mga sira sa templo[a]? Ngayon, huwag na ninyong kunin ang salapi mula sa mga kakilala ninyo[b]; sa halip, ibigay ninyo ito para sa pagkukumpuni ng templo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay.” Ang tinutukoy ay ang templo.
    reason: cultural_note
  - marker: b
    text: Mahirap tiyakin ang Hebreong salitang isinaling “mga kakilala ninyo.” Maaari rin itong mangahulugang “mga nag-aambag” o “mga nagbibigay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay tumutukoy sa pagpapatawag o pagtawag upang humarap; natural sa Filipino ang “ipinatawag” para sa utos ng hari.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: Haring Jehoash
  rationale: Karaniwang ayos sa Filipino ang titulo bago ang pangalan.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: si Jehoiada na pari at ang mga pari
  rationale: Pinananatili ang dalawang tahasang bahagi ng Hebreo nang hindi idinaragdag ang “iba pang,” na hindi nakasaad sa teksto.
- source_word: אֵינְכֶם מְחַזְּקִים
  choice: hindi ninyo kinukumpuni
  rationale: Bagaman literal na “pinalalakas” ang חזק, sa pagsama nito sa בֶּדֶק הַבָּיִת ay tumutukoy ito sa pagkukumpuni ng gusali.
- source_word: בֶּדֶק הַבָּיִת
  choice: ang mga sira sa templo
  rationale: Ang בֶּדֶק ay pinsala, bitak, o bahaging kailangang kumpunihin. Ginamit ang “templo” para malinaw sa karaniwang mambabasa ang tinutukoy ng Hebreong “bahay,” habang ipinaliliwanag sa talababa ang literal na larawan.
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Natural na naghuhudyat ito ng paglipat mula sa pagsaway tungo sa bagong tagubilin.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: huwag na kayong tumanggap ng salapi
  rationale: Sa kontekstong pinansiyal, ang כֶּסֶף ay salapi, at ang “tumanggap” ay akma sa pondong dating napupunta sa mga pari.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: mula sa mga nagbibigay sa inyo
  rationale: Mahirap tiyakin ang kahulugan ng מַכָּרִים dito. Ang konteksto ay nagpapahiwatig ng mga taong pinagmumulan ng salapi, ngunit pinananatili sa talababa ang mas literal na alternatibong “mga kakilala.”
- source_word: כִּי
  choice: Sa halip
  rationale: Dito ay ipinakikilala ng כִּי ang dapat gawin kapalit ng ipinagbabawal; malinaw na naihahayag ng “Sa halip” ang lohikal na ugnayan.
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: ibigay ninyo iyon para sa pagkukumpuni ng templo
  rationale: Ang hulaping panghalip sa pandiwa ay tumutukoy sa salapi, at ang לְ ay nagpapahayag ng layunin o paglalaanan.
