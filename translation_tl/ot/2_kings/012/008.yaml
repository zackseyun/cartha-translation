translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “templo” sa pangunahing teksto upang maiwasan ang kalituhan sa karaniwang “bahay,” ngunit pinanatili sa talababa ang literal na Hebreong katawagan. Hinati sa maiikling pangungusap ang salaysay at utos para sa natural na daloy sa Filipino.
