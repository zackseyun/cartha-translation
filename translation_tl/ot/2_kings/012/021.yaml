  naturalness: Natural at marangal ang karamihan ng salin. Ang “Sinaktan nila si Joas” ay karaniwang modernong Filipino at angkop sa marahas ngunit di-lubos-na-tinukoy na kilos ng pinagmulan. Inilipat ang talababa upang malinaw na nakatali ito sa pariralang pangheograpiya na tinutukoy nito.
  terminology: Ang “mga lingkod,” “nagsabwatan,” “Bet-Milo,” at “Sila” ay angkop. Pinanatili ang mga pangalan ng lugar bilang transliterasyon at ang topograpikong “daang pababa patungong Sila.”
