  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lingkod” para sa mga tauhan ng hari, “nagsabwatan” bilang natural na katumbas ng Hebreong idyoma, at mga transliterasyong Bet-Milo at Sila para sa mga pangalan ng lugar.
