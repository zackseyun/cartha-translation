  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: tl
  text: Nagbangon ang kanyang mga lingkod at nagsabwatan. Sinaktan nila si Joas sa Bet-Milo, sa daang pababa patungong Sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa dalisdis patungong Sila” o “sa pagbaba patungong Sila.” Literal na inilalarawan ng Hebreo ang pababang daan o lapit na patungo sa Sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Karaniwang kahulugan ng עֶבֶד ang lingkod. Sa konteksto ng hari, tumutukoy ito sa mga tauhang nasa paglilingkod niya nang hindi nililimitahan sa mga opisyal o tagapaglingkod sa bahay.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: nagsabwatan
  rationale: Ang pandiwa at kaugnay na pangngalan ay isang Hebreong idyoma para sa pagbuo ng sabwatan. Natural na naihahatid ng “nagsabwatan” ang diwa, bagaman hindi nito ginagaya ang pag-uulit ng salitang-ugat.
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: 'Malawak ang saklaw ng נכה: hampasin o pabagsakin. Ipinahihiwatig ng konteksto ang nakamamatay na bunga, ngunit pinananatili ng “pinabagsak” ang marahas na kilos nang hindi tahasang pinapalitan ng “pinatay.”'
- source_word: בֵּית מִלֹּא
  choice: Bet-Milo
  rationale: Itinuturing itong pangalan ng lugar at isinasalin sa baybay na angkop sa Filipino sa halip na gawing “bahay ng Milo.”
- source_word: הַיּוֹרֵד סִלָּא
  choice: sa daang pababa patungong Sila
  rationale: Ang may-artikulong participle יֹרֵד ay naglalarawan sa pababang daan o lapit na kaugnay ng Sila. Likas sa Filipino ang pariralang ito at pinananatili ang topograpikong diwa.
- source_word: סִלָּא
  choice: Sila
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang anyong transliterado sa Filipino.
theological_decisions: []
