  source_fidelity: Tumpak na naipapahayag ng salin ang pormulang moral na “ginawa ang tama sa paningin ni Yahweh” at ang temporal na pag-uugnay ng כָּל־יָמָיו sa pagtuturo ni Jehoiada. Hindi nito ipinipilit na ang pagiging matuwid ni Jehoas ay saklaw ng buong buhay niya nang walang kwalipikasyon, ni tahasang ginagawang sanhi ang pagtuturo ni Jehoiada.
  naturalness: Natural at marangal ang pangunahing teksto sa makabagong Filipino. Ang “sa lahat ng araw na tinuruan siya” ay bahagyang mas malapit sa estruktura ng Hebreo kaysa sa mas maluwag na “habang,” ngunit nananatiling malinaw at katanggap-tanggap.
  terminology: Ang “Yahweh,” “Jehoas,” at “paring si Jehoiada” ay magkakatugma at angkop. Ang “ang tama” at “sa paningin ni Yahweh” ay wasto para sa Hebreong idiom at rehistro ng Mga Hari.
