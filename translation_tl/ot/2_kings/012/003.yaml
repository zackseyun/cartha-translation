id: 2KI.12.3
reference: 2 Kings 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: tl
  text: Ginawa ni Jehoas ang tama sa paningin ni Yahweh sa lahat ng araw na tinuruan siya ng paring si Jehoiada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ginawa ni Jehoas ang tama sa paningin ni Yahweh habang tinuturuan siya ng paring si Jehoiada.” O, kung sanhi ang diwa ng sugnay: “...sa buong buhay niya, sapagkat tinuruan siya ng paring si Jehoiada.”'
    reason: Ipinapakita ang posibleng temporal at sanhi na ugnayan ng Hebreong אֲשֶׁר nang hindi pumipili nang labis sa pangunahing teksto.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Likas na katumbas ng pandiwang עשה sa pormulang moral na “ginawa ang tama.”
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Ginagamit ang pang-uri bilang pangngalan at malinaw na ipinahahayag ang wastong asal.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng pagsusuri at ang personal na pangalang Yahweh.
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: sa lahat ng araw na
  rationale: Malapit sa sintaks ng Hebreo at sadyang hindi nilulutas kung ang sugnay ay nagtatakda ng panahon o nagpapahiwatig ng dahilan.
- source_word: הוֹרָהוּ
  choice: tinuruan siya
  rationale: Ang Hiphil ng ירה ay nangangahulugang magturo o magbigay ng tagubilin; natural sa Filipino ang “tinuruan siya.”
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: ng paring si Jehoiada
  rationale: Natural na ayos sa Filipino para sa pangalan na may kasamang titulo.
theological_decisions:
- issue: Saklaw sa panahon ng matuwid na asal ni Jehoas
  choice: Pinanatili sa pangunahing teksto ang literal at maaaring may dalawang pakahulugang “sa lahat ng araw na tinuruan siya.”
  alternative: “habang tinuturuan siya” o “sapagkat tinuruan siya”
  rationale: Maaaring iugnay ng אֲשֶׁר ang mga araw sa panahon ng pagtuturo ni Jehoiada, ngunit hindi nito tahasang ipinapahayag ang “habang” o “sapagkat.” Pinananatili ng salin ang tunay na kalabuan at ang tensiyon sa salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paring si Jehoiada” bilang likas na ayos sa Tagalog at pinanatili ang pangalang Yahweh.
