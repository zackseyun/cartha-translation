source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: tl
  text: Sinabi ni Jehoas sa mga pari, “Ang lahat ng salaping mula sa mga bagay na itinalaga na dinadala sa bahay ni Yahweh—ang salaping mula sa bawat lalaking ibinilang[a], ang salaping para sa itinakdang halaga ng mga tao[b], at ang anumang salaping kusang loobin ng isang tao[c] na dalhin sa bahay ni Yahweh—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang salapi ng bawat lalaking dumaraan.” Malamang na tumutukoy ito sa bayad na hinihingi sa mga lalaking ibinilang sa sensus (ihambing sa Exodo 30:13–16).
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ito sa mga bayad na kaugnay ng itinakdang halaga ng mga taong inihandog sa isang panata (ihambing sa Levitico 27:2–8).
    reason: cross_reference
  - marker: c
    text: Sa literal, “umakyat sa puso ng isang tao,” isang idyomang tumutukoy sa kusang ipinasiya o nilayong ibigay.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: ang lahat ng salaping mula sa mga bagay na itinalaga
  rationale: Ipinahahayag nito na ang salapi ay kaugnay ng mga bagay o handog na ibinukod bilang banal, habang pinananatiling bukas ang eksaktong uri ng mga iyon.
- source_word: יוּבָא בֵית יְהוָה
  choice: na dinadala sa bahay ni Yahweh
  rationale: Ang “dinadala” ay sumasalamin sa anyong pasibo ng pandiwa; ang “bahay ni Yahweh” ay tumutukoy sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: ang salaping mula sa bawat lalaking ibinilang
  rationale: Malamang na tumutukoy ang maikling idyomang ito sa bayad ng mga lalaking kabilang sa sensus; nililinaw ng salin ang konteksto ngunit itinatala sa talababa ang literal na larawan.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: ang salapi ayon sa itinakdang halaga ng bawat tao
  rationale: Pinananatili nito ang legal at panrelihiyong diwa ng pagtatakda ng halaga sa mga tao nang hindi tahasang idinaragdag sa pangunahing teksto na kaugnay iyon ng isang panata.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: ang anumang salaping maisapuso ng isang tao
  rationale: Natural sa modernong Tagalog ang “maisapuso” at pinananatili nito ang metapora ng pusong pinagmumulan ng kusang layunin.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: na dalhin sa bahay ni Yahweh
  rationale: Ipinakikita ng parirala ang layuning kusang dalhin ang salapi sa templo.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nakasulat sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kalikasan ng salaping kaugnay ng itinakdang halaga ng mga tao
  choice: ayon sa itinakdang halaga ng bawat tao
  alternative: bayad para sa mga taong ipinangako sa panata
  rationale: Malamang na kaugnay ito ng mga pagtatakda ng halaga sa Levitico 27, ngunit hindi tahasang binabanggit sa talata ang panata; kaya hindi iyon isinama sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “salapi” para sa כֶּסֶף dahil usaping bayad at handog ang konteksto. Pinanatili ang pahilis na pagtatapos ng pangungusap sapagkat nagpapatuloy sa kasunod na talata ang sinabi ni Jehoas.
