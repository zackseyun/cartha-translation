  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang adversatibong רַק sa “Gayunman,” ang pananatili ng mga mataas na pook na hindi inalis, at ang patuloy na paghahain at pagsusunog ng insenso ng bayan. Ang “doon” ay malinaw na tumutukoy pabalik sa “matataas na lugar,” kaya napapanatili ang kahulugan ng inuulit na בַּבָּמוֹת nang natural sa Tagalog.'
