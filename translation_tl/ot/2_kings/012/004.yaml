source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: tl
  text: Gayunman, hindi inalis ang matataas na lugar[a]; nag-aalay pa rin doon ng mga hain at nagsusunog ng insenso ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga dambana.” Ang Hebreong “matataas na lugar” ay tumutukoy sa mga lokal na pook-sambahan, na madalas ay nasa mataas na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Ipinakikita nito ang pagbubukod o limitasyon sa naunang positibong pagtataya, sa natural at marangal na modernong Tagalog.
- source_word: הַבָּמוֹת
  choice: ang matataas na lugar
  rationale: Tumutukoy ang בָּמוֹת sa mga lokal na pook-sambahan, na madalas ay nasa mataas na lugar. Pinananatili ng saling ito ang heograpiko at panrelihiyong kulay ng termino.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Bagaman literal na maaaring mangahulugang 'hindi lumisan,' ang mga matataas na lugar ang simuno rito; kaya malinaw at natural ang 'hindi inalis' para sa nanatili nilang kalagayan.
- source_word: עוֹד
  choice: pa rin
  rationale: Ipinahahayag nito ang nagpapatuloy na gawain sa kabila ng naunang konteksto.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Natural na kolektibong katawagan sa bayan o populasyon.
- source_word: מְזַבְּחִים
  choice: nag-aalay ng mga hain
  rationale: Malinaw nitong ipinahahayag ang patuloy o nakaugaliang paghahain, hindi lamang ang pangkalahatang pagbibigay ng handog.
- source_word: וּמְקַטְּרִים
  choice: at nagsusunog ng insenso
  rationale: Sa kontekstong panrelihiyon, karaniwang tumutukoy ang קטר sa pagsusunog ng insenso o pagpapausok ng handog; ang 'nagsusunog ng insenso' ang pinakanatural at malamang na diwa rito.
- source_word: בַּבָּמוֹת
  choice: doon
  rationale: Natural na panghalip-pook sa Tagalog na malinaw na bumabalik sa 'matataas na lugar' at umiiwas sa mabigat na pag-uulit.
theological_decisions:
- issue: Pagtataya sa pagsamba sa matataas na lugar
  choice: Panatilihin sa pangunahing teksto ang historikal at deskriptibong terminong 'matataas na lugar' nang walang idinagdag na tahasang paghatol.
  alternative: Isalin bilang 'mga dambana' o tahasang tawaging mga ipinagbabawal na pook-sambahan.
  rationale: Ipinapalagay ng konteksto ang pagpuna sa mga pook na ito, ngunit sa mismong talata ay iniulat lamang ang patuloy na pag-iral at paggamit sa mga ito. Hindi dapat dagdagan ng salin ang teolohikal na paliwanag na hindi tahasang nakasaad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Gayunman' para sa pormal ngunit likas na pagsalungat, at 'nag-aalay ng mga hain' upang malinaw na maipahayag ang gawaing pansamba.
