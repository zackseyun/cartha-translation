id: 2KI.12.10
reference: 2 Kings 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos, kumuha ang paring si Jehoiada ng isang kaban, binutasan ang takip[a] nito, at inilagay iyon sa tabi ng altar, sa gawing kanan kapag pumapasok ang isang tao sa bahay ni Yahweh. Doon inilalagay ng mga paring nagbabantay sa pintuan ang lahat ng pilak[b] na dinadala sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinto nito.” Sa kontekstong ito, malamang na ang takip ng kaban ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lahat ng salapi.” Ang salitang Hebreo para sa “pilak” ay maaari ring tumukoy sa pera.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: kaban
  rationale: Sa konteksto ng mga handog na salapi sa templo, tumutukoy ito sa isang lalagyan. Ang “kaban” ay natural at marangal, at hindi nag-uugnay rito sa Kaban ng Tipan.
- source_word: וַיִּקֹּב חֹר
  choice: binutasan
  rationale: Tuwirang ipinahahayag nito ang paggawa ng butas sa kaban nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa Hebreo.
- source_word: בְּדַלְתּוֹ
  choice: sa takip nito
  rationale: Bagaman karaniwang nangangahulugang “pinto” ang דלת, sa isang kaban ay malamang na tumutukoy ito sa naigagalaw na takip. Nililinaw sa talababa ang literal na anyo.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Malinaw at natural na katumbas ng pariralang nagsasaad ng kalapitan.
- source_word: בימין
  choice: sa gawing kanan
  rationale: Ipinakikita nito ang lokasyon mula sa pananaw ng taong pumapasok.
- source_word: בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: kapag pumapasok ang isang tao sa bahay ni Yahweh
  rationale: Ginagawang natural sa Tagalog ang pangkalahatang isahang אִישׁ at pinananatili ang oryentasyon mula sa pananaw ng pumapasok.
- source_word: שֹׁמְרֵי הַסַּף
  choice: mga paring nagbabantay sa pintuan
  rationale: Ipinahahayag ang tungkulin nilang bantayan ang pasukan ng templo; ang literal na “bungad” o “pasukan” ay magiging hindi gaanong natural sa pariralang ito.
- source_word: כָּל הַכֶּסֶף
  choice: lahat ng pilak
  rationale: Pinananatili ang kongkretong kahulugan ng כֶּסֶף, habang kinikilala sa talababa na maaari rin itong tumukoy sa salapi.
- source_word: הַמּוּבָא
  choice: na dinadala
  rationale: Ang Hophal participle ay nagsasaad ng bagay na dinadala papasok; ang kasalukuyang aspektong Filipino ay angkop sa paulit-ulit na gawain.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa Hebreo at malinaw pa rin sa konteksto na templo ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Banal na pangalan mismo ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Pangkalahatang isahang אִישׁ sa paglalarawan ng direksiyon
  choice: isang tao
  alternative: isang lalaki
  rationale: Sa pariralang ito, ang אִישׁ ay nagsisilbing pangkalahatang taong pumapasok at ginagamit upang tukuyin ang kanan mula sa kaniyang pananaw. Ang “isang tao” ay natural sa Tagalog at hindi nagpapahiwatig na lalaki lamang ang maaaring pumasok.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na ayos ng pangungusap. Ginamit ang “kaban,” “altar,” at “bahay ni Yahweh” upang mapanatili ang konkretong bokabularyo ng Hebreo. Inilagay ang mga talababa sa mismong salitang may leksikal na alternatibo.
