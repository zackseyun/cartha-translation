  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: tl
  text: Sapagkat ibinibigay nila iyon sa mga gumagawa ng gawain, at sa pamamagitan niyon ay kinukumpuni nila ang bahay ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.”
    reason: Nililinaw ang kontekstuwal na kahulugan ng literal na pariralang Hebreo na ‘bahay ni Yahweh.’
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit hindi na sila hinihingan ng pagsusulit sa naunang talata.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: sa mga gumagawa ng gawain
  rationale: Pinananatili ang participial na diwa ng Hebreo nang hindi nililimitahan sa isang kasarian o espesipikong uri ng manggagawa.
- source_word: יִתְּנֻהוּ
  choice: ibinibigay nila iyon
  rationale: Ang imperfect na pandiwa ay tumutukoy rito sa nakagawian o paulit-ulit na kilos sa nakaraan; natural itong ipinahahayag sa Filipino sa aspektong imperpektibo.
- source_word: וְחִזְּקוּ
  choice: at ... kinukumpuni nila
  rationale: Bagaman pangunahing nangangahulugang ‘pinatatatag,’ sa konteksto ng gusali ay tumutukoy ito sa pagkukumpuni o pagpapanumbalik ng katatagan.
- source_word: בּוֹ
  choice: sa pamamagitan niyon
  rationale: Tumutukoy ang panghalip sa salaping binanggit sa konteksto at ipinakikita ang gamit nito nang hindi tahasang idinaragdag ang salitang ‘salapi.’
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang literal na idyomang Hebreo na ‘bahay ni Yahweh’; nililinaw ng talababa na ang tinutukoy sa konteksto ay ang templo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit sa talata ang Tetragrammaton mismo; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Posibleng paksa ng וְחִזְּקוּ
  choice: kinukumpuni nila
  alternative: kinukumpuni iyon ng mga gumagawa ng gawain
  rationale: Hindi tahasang inuulit ng Hebreo ang paksa, kaya pinananatili ng panghalip na ‘nila’ ang posibilidad na tumukoy ito sa mga tagapangasiwa o sa mga manggagawa sa halip na tahimik na tukuyin ang isang pangkat.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pag-uulit ng ‘gawain’ upang manatiling malapit sa Hebreo, at iniwasan ang mas makitid o gender-specific na katawagan.
