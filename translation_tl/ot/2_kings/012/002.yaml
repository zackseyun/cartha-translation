base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: tl
  text: Noong ikapitong taon ng paghahari ni Jehu, naging hari si Jehoash. Naghari siya sa Jerusalem sa loob ng apatnapung taon. Ang pangalan ng kanyang ina ay Zibia na taga-Beersheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: Nang ikapitong taon ni Jehu
  rationale: Likas na salin sa Filipino ng karaniwang pormula ng pagtakda ng panahon ng paghahari, habang pinananatili ang tiyak na kronolohikal na kaugnayan kay Jehu.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: naging hari si Jehoash
  rationale: Sa pormulang ito, ang pandiwa ay may diwang ingresibo—ang pagsisimula ng paghahari—kaya malinaw na ipinahahayag ng “naging hari” ang pagluklok.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: Naghari siya ... sa loob ng apatnapung taon
  rationale: Dito, tumutukoy ang pandiwa sa tagal ng pamamahala; natural at tiyak sa Filipino ang “naghari ... sa loob ng.”
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong gamit ng pang-ukol sa pangalan ng lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pahayag ng Hebreo tungkol sa pagkakakilanlan ng ina sa natural at marangal na ayos ng Filipino.
- source_word: צִבְיָה
  choice: Zibia
  rationale: Isinalin sa baybay na madaling basahin sa modernong Filipino habang malapit sa anyong Hebreo na Tsivyah.
- source_word: מִבְּאֵר שָׁבַע
  choice: na taga-Beersheba
  rationale: Malinaw at likas sa Filipino ang “taga-” para sa pinagmulan o kaugnayan sa isang lugar, na siyang diwa ng מִן dito.
