translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Isinalin ang idyomang “sa kanilang kamay” ayon sa kahulugan nito upang maiwasan ang malabo o di-likas na pananalita, at pinanatili sa talababa ang literal na larawan. Ang “humihingi ng kuwenta” ay malinaw sa konteksto ng pananagutang pinansyal.
