    issue: Hindi tugma ang aspektong “humihingi” sa pangnagdaang salaysay.
    rationale: Ang וְלֹא יְחַשְּׁבוּ ay tumutukoy sa ginawa ng mga tagapangasiwa sa salaysay; mas angkop ang perpektibong “hindi nila hiningan.”
