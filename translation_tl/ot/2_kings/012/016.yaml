  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: tl
  text: Ngunit hindi nila hiningan ng kuwenta[a] ang mga lalaking pinagkatiwalaan nila ng salapi upang ibigay sa mga gumagawa ng gawain, sapagkat tapat[c] silang kumilos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi nila sinuri ang mga kuwenta ng mga lalaki.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang “tapat” na “mapagkakatiwalaan” o “may integridad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: humihingi ng kuwenta
  rationale: Sa piel, tumutukoy ito rito sa pagsusuri o paghingi ng ulat tungkol sa salaping ipinamahala. Likas sa modernong Tagalog ang pariralang ito at malinaw ang diwa ng pananalapi.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tahasang tumutukoy ang pangmaramihang anyo ng אִישׁ sa mga lalaking tagapangasiwa o katiwala sa kontekstong ito.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: pinagkatiwalaan nila
  rationale: Ang literal na pagbibigay ng salapi 'sa kanilang kamay' ay isang idyoma para sa paglalagay nito sa kanilang pangangalaga o pamamahala.
- source_word: הַכֶּסֶף
  choice: salapi
  rationale: Bagaman maaari itong mangahulugang 'pilak,' tumutukoy ito rito sa pondong ginagamit sa gawain. Ang 'salapi' ay angkop sa marangal na rehistro at malinaw sa modernong mambabasa.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: sa mga gumagawa ng gawain
  rationale: Pinananatili nito ang participial na diwa ng Hebreo at hindi nililimitahan ang tinutukoy sa isang partikular na uri ng manggagawa.
- source_word: בֶאֱמֻנָה
  choice: tapat
  rationale: Ipinapahayag nito ang pagiging mapagkakatiwalaan at matuwid sa pangangasiwa ng salapi, habang pinananatili ang mas malawak na etikal na diwa kaysa sa 'matapat lamang sa pananalapi.'
- source_word: הֵם עֹשִׂים
  choice: silang kumilos
  rationale: Ang 'tapat silang kumilos' ay natural na buod sa Tagalog ng paraan ng kanilang paggawa o pagtupad sa tungkulin.
