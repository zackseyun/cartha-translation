  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: tl
  text: at sa mga tagapagtayo ng pader[a] at sa mga tagatabas ng bato, at sa pagbili ng kahoy at batong galing sa tibagan[b], upang kumpunihin ang mga sirang bahagi ng bahay ni Yahweh[c], at sa lahat ng ginugol para sa bahay upang kumpunihin iyon.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tagapagtayo.” Maaaring tumukoy ang salitang Hebreo sa mas malawak na gawaing pagmamason o pagkukumpuni ng pader.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinabas na bato” o “batong pinutol.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “upang patibayin ang sira o puwang sa bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: d
    text: Sa literal, “sa lahat ng lumalabas para sa bahay,” na tumutukoy sa lahat ng gastusin sa pagkukumpuni nito.
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: mga tagapagtayo ng pader
  rationale: Ang pandiwaring mula sa גדר ay tumutukoy sa mga manggagawang nagtatayo o nagkukumpuni ng mga pader. Mas tiyak ito kaysa sa pangkalahatang “mga tagapagtayo” at natural sa konteksto ng pagkukumpuni.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: mga tagatabas ng bato
  rationale: Tumutukoy ito sa mga manggagawang tumatabas o humuhugis ng bato; malinaw at karaniwang maunawaan ang “tagatabas ng bato.”
- source_word: לִקְנוֹת עֵצִים
  choice: sa pagbili ng kahoy
  rationale: Sa konteksto, ang עֵצִים ay kahoy na materyales sa pagtatayo. Sapat na malinaw sa Filipino ang “kahoy” nang hindi nagdaragdag ng espesipikong uri nito.
- source_word: אַבְנֵי מַחְצֵב
  choice: batong galing sa tibagan
  rationale: Pinananatili nito ang diwa ng batong kinuha mula sa quarry o tibagan, sa natural na modernong Tagalog.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: upang kumpunihin ang mga sirang bahagi
  rationale: Bagaman literal na may diwang “patibayin ang sira/puwang,” ang parirala sa konteksto ay tumutukoy sa pagsasaayos ng pinsala sa gusali. Natural ang “kumpunihin,” habang ang “mga sirang bahagi” ay pinananatili ang bagay na inaayos.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang Hebreong metapora, at ang “ni Yahweh” ay natural na pagpapahayag ng pag-aari sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ayon sa anyo ng Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: at sa lahat ng ginugol para sa bahay
  rationale: Ang literal na “lahat ng lumalabas para sa bahay” ay isang idyoma tungkol sa mga gastusin; malinaw itong naipahahayag ng “lahat ng ginugol.”
- source_word: לְחָזְקָה
  choice: upang kumpunihin iyon
  rationale: Ipinahahayag nito ang layunin ng mga gastusin—ang pagsasaayos ng bahay—sa malinaw at natural na Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa personal na pangalang nasa tekstong Hebreo at hindi pinapalitan iyon ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinili ang “kumpunihin” bilang natural na katumbas sa konteksto ng pagkukumpuni ng gusali, habang inilagay sa talababa ang mas literal na diwa ng pagpapatibay.
