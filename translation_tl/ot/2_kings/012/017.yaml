  source_fidelity: Tumpak na naipapahayag ng salin ang dalawang uri ng salapi, ang negatibong pasibong paglalahad na hindi ito dinadala sa bahay ni Yahweh, at ang paglalaan nito sa mga pari. Ang “salapi” ay angkop na kontekstuwal na salin ng כֶּסֶף, samantalang malinaw na pinananatiling mga handog ang אָשָׁם at חַטָּאוֹת.
