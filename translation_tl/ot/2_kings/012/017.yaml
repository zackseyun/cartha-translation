id: 2KI.12.17
reference: 2 Kings 12:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: tl
  text: Ang salaping mula sa handog para sa pagkakasala at ang salaping mula sa mga handog para sa kasalanan[a] ay hindi dinadala sa bahay ni Yahweh[b]; para iyon sa mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog para sa pagkakasala” ay maaari ring isaling “handog na kabayaran”; ang “mga handog para sa kasalanan” ay maaari ring unawaing “mga handog na panlinis.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay ang templo.
    reason: clarification
lexical_decisions:
- source_word: כֶּסֶף
  choice: salapi
  rationale: Bagaman maaari itong literal na mangahulugang “pilak,” tumutukoy ito rito sa perang ibinabayad o pondong kaugnay ng mga handog; natural sa makabagong Tagalog ang “salapi.”
- source_word: אָשָׁם
  choice: handog para sa pagkakasala
  rationale: Tumutukoy ito sa natatanging handog na kaugnay ng pagkakasala at pananagutang magbayad-pinsala. Pinananatili ng parirala ang sakripisyal na kategorya nang hindi ipinagpapalagay na katumbas lamang ito ng damdaming pagkakasala.
- source_word: חַטָּאוֹת
  choice: mga handog para sa kasalanan
  rationale: Sa kontekstong ito, ang maramihang anyo ay tumutukoy sa mga sakripisyal na handog, hindi sa mga kasalanan bilang abstraktong gawain.
- source_word: לֹא יוּבָא
  choice: ay hindi dinadala
  rationale: Ang pasibong anyo na may pagtanggi ay nagsasaad ng itinakdang paraan ng pangangasiwa sa salapi. Ang pangkasalukuyang “hindi dinadala” ay natural na nagpapahayag ng umiiral na tuntunin sa kontekstong pasalaysay.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na larawang “bahay” at ang pangalang tipan na Yahweh; sa konteksto, ang tinutukoy ay ang templo.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: para iyon sa mga pari
  rationale: Ipinahahayag ng sugnay ang paglalaan o pag-aari ng naturang salapi. Ang “iyon” ay natural na tumutukoy sa pinagsamang salaping nabanggit.
theological_decisions:
- issue: Pagpapakahulugan sa אָשָׁם bilang uri ng handog
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-sala / handog na kabayaran
  rationale: May diwa ang אָשָׁם ng pagkakasala at, sa ilang konteksto, ng pananagutan o kabayaran. Ang piniling salin ay malinaw at hindi labis na nagtatakda ng isang teolohikal na paliwanag; binabanggit sa talababa ang posibleng mas espesipikong diwa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salapi” sa halip na “pilak” dahil usaping pananalapi ng templo ang konteksto, habang pinanatili sa talababa ang mahahalagang alternatibong diwa ng mga terminong pansakripisyo.
