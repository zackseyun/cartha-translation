  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Pinanatili ang “bahay” sa pangunahing teksto upang katawanin ang ekspresyong Hebreo, at ipinaliwanag sa talababa na templo ang tinutukoy.
