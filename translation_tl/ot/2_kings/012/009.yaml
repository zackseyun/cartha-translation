  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: tl
  text: Ngunit pumayag ang mga pari na huwag tumanggap ng salapi mula sa mga tao at huwag kumpunihin ang mga sira ng bahay[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “huwag palakasin ang mga sira ng bahay,” isang idyomang nangangahulugang kumpunihin ang mga nasirang bahagi ng templo.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” dito ay ang bahay ng PANGINOON, samakatuwid, ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: pumayag
  rationale: Ang pandiwang אבה ay nagpapahayag dito ng pagsang-ayon o pagpayag; natural at tuwiran ang “pumayag” sa modernong Tagalog.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katumbas ng כֹּהֲנִים sa konteksto ng paglilingkod at pangangasiwa sa templo.
- source_word: לְבִלְתִּי קְחַת
  choice: na huwag nang tumanggap
  rationale: Ipinahihiwatig ng לְבִלְתִּי kasunod ng pawatas ang napagkasunduang hindi na paggawa; ang “tumanggap” ay angkop sa salaping ibinibigay ng mga tao at ang “nang” ay malinaw sa konteksto ng pagbabago sa dating gawain.
- source_word: כֶּסֶף
  choice: salapi
  rationale: Bagaman maaari itong literal na mangahulugang pilak, tumutukoy ito rito sa perang ginagamit sa pangangasiwa; dignified at malinaw ang “salapi.”
- source_word: מֵאֵת הָעָם
  choice: mula sa mga tao
  rationale: Tuwirang salin ng pariralang nagpapahayag kung kanino nagmumula ang salapi.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: at huwag nang kumpunihin
  rationale: Literal na “palakasin” ang חזק, ngunit kasama ng בֶּדֶק הַבַּיִת isa itong idyoma para sa pagkukumpuni ng nasira.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: ang mga sira ng bahay
  rationale: Ang בֶּדֶק ay tumutukoy sa bitak, sira, o bahaging kailangang ayusin. Pinananatili ng “bahay” ang larawang Hebreo, habang nililinaw ng talababa na templo ang tinutukoy.
