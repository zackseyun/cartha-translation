base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: tl
  text: At sina Jozabad na anak ni Shimeat at Jehozabad na anak ni Shomer—na mga lingkod[a] ng hari—ang sumalakay at nanakit sa kanya, at namatay siya. Inilibing nila siya kasama ng kanyang mga ninuno sa Lunsod ni David, at ang anak niyang si Amazias ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga opisyal ng hari.” Ang Hebreong עֲבָדָיו ay maaaring tumukoy sa mga lingkod o mga tauhan ng palasyo, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: At sina Jozabad na anak ni Shimeat
  rationale: Pinanatili ang pang-ugnay at isinalin nang natural sa Tagalog ang Hebreong patronimiko; tinumbasan ang mga pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: at Jehozabad na anak ni Shomer
  rationale: Tapat na pinananatili ang ikalawang pangalan at patronimiko, kasama ang pang-ugnay.
- source_word: עֲבָדָיו
  choice: mga lingkod ng hari
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod, alipin, o opisyal. Sa konteksto ng sabwatan sa palasyo, malinaw at hindi labis na tiyak ang 'mga lingkod ng hari'; tahasang tinukoy ang hari upang maiwasan ang malabong panghalip sa Tagalog.
- source_word: הִכֻּהוּ
  choice: humampas sa kanya
  rationale: Pinananatili ang pangunahing diwa ng נכה na pananakit o paghampas at hindi inuuna ang resulta, sapagkat hiwalay na sinasabi ng kasunod na sugnay na namatay siya.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang payak na pagkakasunod-sunod ng salaysay at ang hiwalay na pahayag ng kamatayan.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Inilibing nila siya
  rationale: Natural na salaysay sa modernong Tagalog para sa pandiwang maramihan at layong panghalip.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang 'mga ninuno' ay natural at malinaw na katumbas ng Hebreong idyoma tungkol sa pagkalibing kapiling ng mga naunang salinlahi ng angkan.
- source_word: בְּעִיר דָּוִד
  choice: sa Lunsod ni David
  rationale: Ginamit bilang kinikilalang pangalang-pook at nilagyan ng malaking titik ang 'Lunsod.'
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: at ang anak niyang si Amazias ang naghari bilang kahalili niya
  rationale: Natural na ipinapahayag sa Tagalog ang paghalili sa trono habang pinananatili ang diwa ng מלך at תחתיו.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikling sunod-sunod na takbo ng Hebreong salaysay, ginawang malinaw ang reperente ng 'kanyang mga lingkod,' at iniwasang isalin ang הִכֻּהוּ bilang 'pinatay' upang hindi mawala ang hiwalay na pahayag na namatay ang hari.
