revisions:
- from: Ngunit ang salaping dinala sa bahay ni Yahweh ay hindi ginamit upang gumawa para sa bahay ni Yahweh ng mga palangganang pilak[a], mga panggupit ng mitsa[b], mga mangkok na pangwisik[c], mga trumpeta, o anumang kagamitang ginto o pilak.
  to: Ngunit mula sa salaping dinala sa bahay ni Yahweh ay walang ginawang para sa bahay ni Yahweh na mga palangganang pilak[a], mga panggupit ng mitsa[b], mga mangkok na pangwisik[c], mga trumpeta, o anumang kagamitang ginto o pilak.
