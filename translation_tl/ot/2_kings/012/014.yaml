id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: tl
  text: Ngunit mula sa salaping dinala sa bahay ni Yahweh ay walang ginawang para sa bahay ni Yahweh na mga palangganang pilak[a], mga panggupit ng mitsa[b], mga mangkok na pangwisik[c], mga trumpeta, o anumang kagamitang ginto o pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mangkok na pilak.”
    reason: lexical_alternative
  - marker: b
    text: O “mga pang-ayos ng mitsa.” Malamang na tumutukoy ang salitang Hebreo sa kasangkapang ginagamit sa pag-aalaga ng mga ilawan.
    reason: lexical_alternative
  - marker: c
    text: O “mga mangkok.” Ipinahahayag ng mas buong salin ang malamang na gamit ng mga ito sa ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahahayag nito ang pagsalungat sa naunang talata at natural ang gamit sa makabagong Filipino.
- source_word: יֵעָשֶׂה
  choice: ay hindi ginamit upang gumawa
  rationale: 'Isinasalin sa natural na Filipino ang pasibong konstruksyon: walang nakalistang kagamitan ang ginawa mula sa salaping dinala.'
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang pormal na katawagan sa templo at ang pag-uulit nito sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: סִפּוֹת כֶּסֶף
  choice: mga palangganang pilak
  rationale: Ang סִפּוֹת ay tumutukoy sa malalapad na sisidlan; inililinaw ng 'palanggana' ang kaibhan nito sa kasunod na uri ng mangkok.
- source_word: מְזַמְּרוֹת
  choice: mga panggupit ng mitsa
  rationale: Sa konteksto ng mga kagamitan sa templo, malamang na mga kasangkapang ginagamit sa pag-aayos o paggupit ng mitsa ng ilawan ang tinutukoy.
- source_word: מִזְרָקוֹת
  choice: mga mangkok na pangwisik
  rationale: Ipinahihiwatig ng katawagan at kontekstong ritwal ang mga mangkok na ginagamit sa pagwisik o paghagis ng dugo o ibang likido.
- source_word: חֲצֹצְרוֹת
  choice: mga trumpeta
  rationale: Ito ang karaniwang malinaw na tawag sa mga metal na trumpetang ginagamit sa pagsamba.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: anumang kagamitang ginto o pilak
  rationale: Saklaw ng כְּלִי ang sisidlan, kasangkapan, o iba pang bagay; ang 'kagamitan' ay angkop at hindi labis na makitid.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: ang salaping dinala
  rationale: Sa administratibong konteksto, ang כֶּסֶף ay pondong salapi, bagaman literal din itong nangangahulugang pilak.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa titulong 'Panginoon' nang hindi nagdaragdag ng interpretasyong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'bahay ni Yahweh' sa halip na 'templo' upang mapanatili ang pormal na katawagang Hebreo at ang pag-uulit nito. Isinaayos ang pasibong pangungusap bilang 'hindi ginamit upang gumawa' upang maging likas sa Filipino nang hindi binabago ang diwa.
