  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: tl
  text: At ibinigay nila ang tinimbang na pilak[a] sa mga manggagawang itinalagang mamahala sa bahay ni Yahweh, at ipinamahagi nila ito sa mga karpintero at mga tagapagtayo na nagtatrabaho sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sinukat na pilak” o “binilang na salapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: ang tinimbang na pilak
  rationale: Ang מְתֻכָּן ay tumutukoy sa pilak na sinukat o tinimbang bago ipamahagi. Ang “tinimbang na pilak” ay kongkreto at angkop sa sinaunang paraang ginagamit sa salapi.
- source_word: עַל יַד
  choice: sa
  rationale: Literal itong “sa kamay ng,” ngunit sa konteksto ay nangangahulugang ipinagkatiwala o ibinigay sa pangangasiwa ng isang tao. Mas natural sa modernong Tagalog ang “sa” dahil malinaw na sa mga tagapangasiwa ibinigay ang pilak.
- source_word: עֹשֵׂי הַמְּלָאכָה הַפְּקֻדִים
  choice: mga manggagawang itinalagang mamahala
  rationale: Pinagsasama nito ang mga gumagawa ng gawain at ang kanilang pagkakahirang sa pananagutan o pangangasiwa, nang hindi ipinapalagay na hiwalay silang uri ng opisyal.
- source_word: וַיּוֹצִיאֻהוּ
  choice: ibinayad naman nila ito
  rationale: Bagaman literal na “inilabas nila ito,” tumutukoy ang pandiwa rito sa pagpapalabas o pagbabayad ng pondong ginagamit sa gawain.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: sa mga karpintero
  rationale: Ang parirala ay literal na tumutukoy sa mga dalubhasang gumagawa sa kahoy; “mga karpintero” ang natural at tiyak na katumbas.
- source_word: וְלַבֹּנִים
  choice: at mga tagapagtayo
  rationale: Malawak ang kahulugan ng בֹּנִים bilang mga nagtatayo. Hindi ito nilimitahan sa mga kantero dahil hindi tinukoy ng talata ang materyales na kanilang ginagamit.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang konkretong larawan ng Hebrew para sa templo, at ginagamit ang “Yahweh” bilang transliterasyon ng pangalang יהוה.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang יהוה sa tekstong Hebrew. Ang “Yahweh” ay tuwirang transliterasyon at hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Kahulugan ng בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang “bahay ni Yahweh” ay nagpapanatili sa anyo at larawan ng orihinal, samantalang malinaw sa konteksto na templo ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pilak” sa halip na pangkalahatang “salapi” upang mapanatili ang materyal na tinutukoy ng כֶּסֶף, at “bahay ni Yahweh” upang mapanatili ang Hebreong larawan nang hindi nagiging di-natural.
