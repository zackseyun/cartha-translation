revisions:
- from: At ibinigay nila ang tinimbang na pilak[a] sa mga manggagawang itinalagang mamahala sa bahay ni Yahweh. Ibinayad naman nila ito sa mga karpintero at mga tagapagtayo na gumagawa sa bahay ni Yahweh.
  to: At ibinigay nila ang tinimbang na pilak[a] sa mga manggagawang itinalagang mamahala sa bahay ni Yahweh, at ipinamahagi nila ito sa mga karpintero at mga tagapagtayo na nagtatrabaho sa bahay ni Yahweh.
