  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Joas at ang lahat ng kanyang ginawa—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan[a] ng mga Hari ng Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Aklat ng mga Taunang Talaan ng mga Hari ng Juda.” Ang pananalitang Hebreo ay maaaring tumukoy sa opisyal na talaan o kronika ng kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Ang iba pang mga ginawa ni Joas
  rationale: Sa pormulang nagbubuod sa paghahari, ang יֶתֶר ay tumutukoy sa nalalabi o iba pang bagay, at ang דִּבְרֵי ay likas na tumutukoy rito sa mga gawa o pangyayari tungkol sa hari. Ang saling ito ay malinaw at natural sa modernong Tagalog.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Pinananatili nito ang saklaw ng כָּל at ang payak na estruktura ng sugnay sa Hebreo.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Ang הֲלוֹא ay nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang mambabasa. Ang “mga iyon” ay tumutukoy sa naunang mga ginawa.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na “sa ibabaw ng aklat/balumbon,” ang “nakasulat sa Aklat” ang likas na idyomang Filipino para sa isang nakatalang sanggunian.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: mga Kasaysayan ng mga Hari ng Juda
  rationale: Ang דִּבְרֵי הַיָּמִים ay tumutukoy sa mga kronika o taunang tala, at ang לְ ay nagpapahayag dito ng kaugnayan sa mga hari ng Juda. Ginamit ang “mga Kasaysayan” sa pangunahing teksto at inilagay sa talababa ang mas teknikal na alternatibo.
