translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong ng Hebreo at iniwasan ang pagdaragdag ng panandang panahong katumbas ng “ngayon,” sapagkat walang tahasang salitang ganoon sa pinagmulan.
