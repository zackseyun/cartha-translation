base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: tl
  text: Noon, umahon si Hazael, hari ng Aram[a], at nakipagdigma laban sa Gat at sinakop ito. Nagpasiya si Hazael na umahon laban sa Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Aram” ay pangalang Hebreo na tradisyonal na isinasaling “Siria.”
    reason: cultural_note
  - marker: b
    text: Sa literal, “itinuon niya ang kanyang mukha upang umahon laban sa Jerusalem.” Maaari rin itong mangahulugang itinuon niya ang kanyang isip o matatag siyang nagpasiyang umahon laban dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa kasunod na pangyayari sa daloy ng salaysay.
- source_word: יַעֲלֶה
  choice: umahon
  rationale: Pinananatili ang karaniwang kahulugan ng עלה at ang pahiwatig ng pagsulong ng hukbo patungo sa isang lugar.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael, na hari ng Aram
  rationale: Ginamit ang karaniwang transliterasyon ng pangalan at pinanatili ang Aram bilang tuwirang katawagan sa Hebreo.
- source_word: וַיִּלָּחֶם עַל
  choice: nakipagdigma laban sa
  rationale: Malinaw na ipinahahayag ang pakikidigma laban sa isang lungsod nang hindi nililimitahan ang pandiwa sa isang biglaang pagsalakay lamang.
- source_word: גַּת
  choice: Gat
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar na Gath.
- source_word: וַיִּלְכְּדָהּ
  choice: sinakop ito
  rationale: Sa konteksto ng digmaan, ang לכד ay tumutukoy sa pagbihag o pagsakop sa isang lungsod.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: nagpasiya si Hazael
  rationale: Likas na Tagalog para sa idyomang Hebreo na nagsasaad ng matatag na pagtutuon o pagpapasyang gawin ang isang bagay.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: na umahon laban sa Jerusalem
  rationale: Pinananatili kapwa ang ideya ng pag-ahon at ang mapanlabang direksiyon, nang hindi agad isinasalin bilang tiyak na pagsalakay o pagkubkob.
