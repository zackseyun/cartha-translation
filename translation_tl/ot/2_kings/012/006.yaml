base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: tl
  text: Kumuha ang mga pari para sa kanilang sarili, bawat isa mula sa kanyang kakilala[a], at sila ang magkukumpuni sa mga sira ng bahay[b], saanman may matagpuang sira roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa taong may pakikipag-ugnayan sa kanya.” Maaaring tumukoy ang salitang Hebreo sa isang kakilala; sa kontekstong ito, maaari rin itong tumukoy sa taong pinagmulan ng tinanggap ng bawat pari.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” dito ay tumutukoy sa templo.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ
  choice: Kunin
  rationale: Ang imperfect ay may puwersang nag-uutos sa kontekstong ito; natural itong ipinahahayag sa Filipino sa anyong pautos.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: Pinananatili nito ang diwa ng pagtanggap o paghawak ng mga pari mismo.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang katawagan sa mga paring naglilingkod sa templo.
- source_word: אִישׁ
  choice: bawat isa
  rationale: 'Ipinahahayag ang distributibong diwa: bawat pari nang isa-isa, nang hindi kailangang ulitin ang panlalaking anyo sa Filipino.'
- source_word: מֵאֵת מַכָּרוֹ
  choice: mula sa kanyang kakilala
  rationale: Pinananatili ang mas literal at tunay na malawak na kahulugan ng מַכָּר bilang taong kilala o may pakikipag-ugnayan sa pari; hindi tahasang tinutukoy ng Hebreo na donor siya.
- source_word: וְהֵם
  choice: at sila ang
  rationale: Ang tahasang panghalip ay may pagbibigay-diin na ang mga pari mismo ang may pananagutan sa pagkukumpuni.
- source_word: יְחַזְּקוּ
  choice: magkumpuni
  rationale: Bagaman literal na 'palakasin,' tumutukoy ito sa pagkukumpuni sa konteksto ng pagpapanatili ng gusali.
- source_word: בֶּדֶק הַבַּיִת
  choice: mga sira ng bahay
  rationale: Ang בֶּדֶק ay depekto, bitak, o sirang bahaging nangangailangan ng pagkukumpuni; pinananatili ng 'bahay' ang katawagan sa pinagmulang teksto.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: saanman may makitang sira roon
  rationale: 'Malinaw na ipinapakita ang saklaw ng gawain: lahat ng lugar sa gusali na matutuklasang may pinsala.'
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na estruktura at bokabularyong madaling maunawaan. Pinanatili ang 'bahay' sa pangunahing teksto at ipinaliwanag ang kahulugang templo sa talababa. Pinili ang 'kakilala' upang huwag gawing tiyak na donor ang malawak na salitang Hebreo; idinagdag ang 'salapi' bilang malinaw na ipinahihiwatig ng konteksto ng koleksiyon sa nakapaligid na talata.
