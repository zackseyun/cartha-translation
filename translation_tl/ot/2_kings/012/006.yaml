    rationale: Walang tahasang layon na “salapi” sa 2 Hari 12:6. Maaaring ipinahihiwatig ito ng konteksto, ngunit ang optimal-equivalence na salin ay dapat magpanatili ng pagkakaltas ng Hebreo sa pangunahing teksto.
  - severity: medium
    issue: Hindi tumutugma ang talababa a sa salitang may ambigwidad na tinutukoy nito.
    rationale: Ang marker a ay nakalagay pagkatapos ng “kanilang sarili,” ngunit ang mahalagang leksikal na alternatibo sa audit trail ay para sa מַכָּרוֹ (“kakilala”), hindi para sa לָהֶם. Dapat ilagay ang marker sa “kakilala” at ipaliwanag ang alternatibong kahulugan nito.
