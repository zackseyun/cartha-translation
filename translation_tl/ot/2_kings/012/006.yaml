- from: Kunin ng mga pari para sa kanilang sarili[a] ang salapi, bawat isa mula sa kanyang kakilala, at sila ang magkumpuni sa mga sira ng bahay[b], saanman may makitang sira roon.
  to: Kumuha ang mga pari para sa kanilang sarili, bawat isa mula sa kanyang kakilala[a], at sila ang magkukumpuni sa mga sira ng bahay[b], saanman may matagpuang sira roon.
  rationale: Inalis ang “ang salapi” upang hindi magdagdag ng layong wala sa Hebreong talata. Pinanatili ang hindi tiyak na “kakilala” para sa מַכָּרוֹ at itinama ang angkla at nilalaman ng talababa upang maitala ang ambigwidad nito. Pinanatili ang “bahay” at ang paulit na “sira,” ayon sa tekstong Hebreo.
