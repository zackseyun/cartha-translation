  verdict: revise
  source_fidelity: 'Ang idinagdag na “ang salapi” ay wala sa Hebreong teksto ng talata. Bagaman nauunawaan ito mula sa mas malawak na konteksto ng koleksiyon, hindi ito dapat ipasok sa pangunahing teksto. Ang מַכָּרוֹ ay nananatiling hindi tiyak: maaari itong mangahulugang kakilala o taong may pakikipag-ugnayan sa bawat pari, hindi tahasang donor.'
  naturalness: Natural at malinaw ang binagong Filipino. Ang “mga sira ng bahay” at “saanman may matagpuang sira roon” ay nagpapanatili ng pag-uulit at malawak na saklaw ng Hebreo nang hindi mabigat pakinggan.
  terminology: Ang “mga pari,” “bahay,” at “magkumpuni” ay angkop. Pinanatili ang “bahay” sa teksto, at ang pagtukoy nito sa templo ay nasa talababa. Inilipat ang talababa a sa “kakilala,” kung saan ito nararapat, upang itala ang leksikal na alternatibo para sa מַכָּרוֹ.
