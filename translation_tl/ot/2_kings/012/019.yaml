id: 2KI.12.19
reference: 2 Kings 12:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Jehoash na hari ng Juda ang lahat ng banal na bagay na inialay nina Jehoshafat, Jehoram, at Ahazias—na mga ninuno niyang[a] hari ng Juda—pati ang sarili niyang mga banal na bagay at ang lahat ng gintong natagpuan sa mga kabang-yaman ng bahay ni Yahweh at ng bahay ng hari. Ipinadala niya ang mga ito kay Hazael na hari ng Aram, at umurong si Hazael mula sa Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “mga ninuno niya” ay tumutukoy sa mga naunang hari sa kaniyang angkan. Literal: “mga ama niya.”'
    reason: cultural_note
  - marker: b
    text: 'O, “at lumayo siya mula sa Jerusalem.” Literal na mababasa: “at umahon siya mula sa ibabaw ng Jerusalem.” Ipinahihiwatig ng idyoma sa kontekstong ito na itinigil ni Hazael ang kaniyang pagsalakay sa lunsod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Tuwirang katumbas ito ng לקח sa salaysay; hindi nito ipinahihiwatig ang dahas na maaaring idulot ng “sinamsam.”
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Pinananatili nito ang diwa ng mga bagay na ibinukod para sa banal na gamit nang hindi tinutukoy nang higit sa sinasabi ng teksto kung anong mga bagay ang mga iyon.
- source_word: הִקְדִּישׁוּ
  choice: inialay
  rationale: Sa konteksto ng mga kayamanan ng templo, natural na ipinapahayag ng “inialay” ang Hiphil ng קדש, ang pagtatalaga ng isang bagay para sa banal na gamit.
- source_word: אֲבֹתָיו
  choice: mga ninuno niya
  rationale: Bagaman literal na “mga ama niya,” tumutukoy ito rito sa naunang mga hari sa angkan ni Jehoash; mas malinaw at natural sa modernong Tagalog ang “mga ninuno.”
- source_word: קֳדָשָׁיו
  choice: sarili niyang mga banal na bagay
  rationale: Ipinakikita ng hulaping panghalip na ang mga ito ang mga bagay na inialay mismo ni Jehoash, habang pinananatili ang ugnayang leksikal sa naunang הַקֳּדָשִׁים.
- source_word: בְּאֹצְרוֹת
  choice: sa mga kabang-yaman
  rationale: Ang אוצרות ay mga imbakan o silid ng mahahalagang ari-arian; ang “kabang-yaman” ay malinaw at angkop sa templo at palasyo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na larawang “bahay” sa Hebreo at ang tahasang personal na pangalan na יהוה, bagaman ang tinutukoy ay ang templo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili nito ang pagkakapantay ng parirala sa “bahay ni Yahweh”; sa konteksto, tumutukoy ito sa palasyo.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Ipinadala niya ang mga ito kay Hazael
  rationale: Ang maramihang “mga ito” ay natural na tumutukoy sa lahat ng naunang binanggit na banal na bagay at ginto.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: at umurong si Hazael mula sa Jerusalem
  rationale: Ang idyoma ay nagpapahiwatig na itinigil ni Hazael ang pagsalakay o paglusob sa Jerusalem. Ang “at” ay nagpapanatili sa payak na pagkakasunod ng waw nang hindi tahasang ginagawang sanhi ang padala.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasang ginagamit ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Katangian ng mga bagay na inilaan
  choice: mga banal na bagay
  alternative: mga handog
  rationale: Hindi tiyak na sinasabi ng teksto kung anong uri ng mga bagay ang mga ito. Ang mas malawak na “mga banal na bagay” ay hindi naglilimita sa mga ito sa isang partikular na uri ng handog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay ni Yahweh” at “bahay ng hari” upang maipakita ang paralelismo ng Hebreo, habang nilinaw sa pangalawang sugnay na si Hazael ang umurong upang maiwasan ang malabong reperensiya ng panghalip.
