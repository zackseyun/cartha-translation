revisions:
- from: Pagkatapos, kinuha ni Jehoash na hari ng Juda ang lahat ng banal na bagay na inialay nina Jehoshafat, Jehoram, at Ahazias—ang mga ninuno niyang[a] hari ng Juda—pati ang sarili niyang mga banal na bagay at ang lahat ng gintong natagpuan sa mga kabang-yaman ng bahay ni Yahweh at ng bahay ng hari. Ipinadala niya ang mga ito kay Hazael na hari ng Aram, at umurong si Hazael mula sa Jerusalem.[b]
  to: Pagkatapos, kinuha ni Jehoash na hari ng Juda ang lahat ng banal na bagay na inialay nina Jehoshafat, Jehoram, at Ahazias—na mga ninuno niyang[a] hari ng Juda—pati ang sarili niyang mga banal na bagay at ang lahat ng gintong natagpuan sa mga kabang-yaman ng bahay ni Yahweh at ng bahay ng hari. Ipinadala niya ang mga ito kay Hazael na hari ng Aram, at umurong si Hazael mula sa Jerusalem.[b]
  rationale: Inayos ang apposition para sa mas natural at malinaw na modernong Filipino, nang hindi binabago ang saklaw ng “mga ama niya” sa Hebreo. Bahagyang pinino rin ang talababa tungkol sa idyoma upang makilala ang literal na anyo mula sa kontekstuwal na kahulugan nito. Walang binagong kahulugan ng talata.
