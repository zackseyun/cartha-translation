  - severity: low
    issue: Maaaring linawin ang literal na pagpapaliwanag sa talababa b.
    rationale: Ang “umaahon siya mula sa ibabaw ng Jerusalem” ay sobrang mekanikal at hindi natural sa Tagalog. Maaaring ilahad ang literal na anyo bilang “umahon siya mula sa ibabaw ng Jerusalem,” ngunit kailangang markahang literal na pormulasyon at ipaliwanag ang idyomatikong saysay nang hindi ito itinuturing na karaniwang Tagalog.
