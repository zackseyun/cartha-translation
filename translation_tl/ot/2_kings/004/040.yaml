base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: tl
  text: Ibinuhos nila ito para kainin ng mga lalaki. Habang kumakain sila ng nilaga[a], sumigaw sila at sinabi, “May kamatayan sa palayok, tao ng Diyos!” Hindi sila makakain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kamatayan sa palayok.” Malamang na ibig sabihin nito ay nakamamatay o may lason ang nilaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: ibinuhos nila iyon
  rationale: Pinananatili ang kongkretong diwa ng יצק na pagbuhos ng pagkaing may sabaw, sa halip na ang mas malawak na “inihain.”
- source_word: לַאֲנָשִׁים
  choice: para kainin ng mga lalaki
  rationale: Tinutukoy ng אֲנָשִׁים ang mga lalaking naroon; pinananatili ang kasariang hayagang nasa Hebreo.
- source_word: מֵהַנָּזִיד
  choice: ng nilaga
  rationale: Ang נָזִיד ay pagkaing pinakuluan o stew; ang “nilaga” ay malinaw at likas sa modernong Filipino sa kontekstong ito.
- source_word: צָעָקוּ
  choice: napasigaw sila
  rationale: Ipinahahayag nito ang malakas at biglaang sigaw dahil sa panganib.
- source_word: מָוֶת בַּסִּיר
  choice: May kamatayan sa palayok
  rationale: Pinananatili ang matindi at matalinghagang pananalita ng Hebreo sa halip na tahasang palitan ng “May lason.”
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Ito ang natural at marangal na katawagan sa Filipino para sa pamagat na “man of God,” nang hindi ito ginagawang interpretibong “lingkod” o “propeta.”
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: At hindi sila makakain
  rationale: Malapit ito sa Hebreo, na walang tahasang layon, at natural na nagsasaad na hindi nila maipagpatuloy ang pagkain.
