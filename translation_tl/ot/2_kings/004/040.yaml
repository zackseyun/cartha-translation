translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang matingkad na idyomang “kamatayan sa palayok” at ipinaliwanag sa talababa, sa halip na lutasin agad ito bilang “lason” sa pangunahing teksto.
