revisions:
- from: Kaya ibinuhos nila iyon para kainin ng mga lalaki. Ngunit habang kumakain sila ng nilaga, napasigaw sila at sinabi, “May kamatayan sa palayok[a], tao ng Diyos!” At hindi sila makakain.
  to: Ibinuhos nila ito para kainin ng mga lalaki. Habang kumakain sila ng nilaga[a], sumigaw sila at sinabi, “May kamatayan sa palayok, tao ng Diyos!” Hindi sila makakain.
  rationale: Inalis ang panandang sanhi-bunga na “Kaya” upang mapanatili ang payak na pagkakasunod ng Hebreo. Pinalitan ang “napasigaw” ng “sumigaw” para sa mas tuwiran at neutral na paglalarawan ng kanilang alarmadong sigaw. Iningatan ang pangunahing idyoma, ang pamagat na “tao ng Diyos,” ang kasariang “mga lalaki,” at ang hindi tahasang layon sa pangwakas na pangungusap.
