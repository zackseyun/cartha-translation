  - severity: low
    issue: Mas tuwiran ang “sumigaw sila” kaysa “napasigaw sila.”
    rationale: Ang צָעָקוּ ay isang malakas at agarang sigaw; ang “sumigaw” ay mas neutral at malapit sa leksikal na saklaw nito.
