  text: וֶ/אֱלִישָׁ֞ע שָׁ֤ב הַ/גִּלְגָּ֨לָ/ה֙ וְ/הָ/רָעָ֣ב בָּ/אָ֔רֶץ וּ/בְנֵי֙ הַ/נְּבִיאִ֔ים יֹשְׁבִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמֶר לְ/נַעֲר֗/וֹ שְׁפֹת֙ הַ/סִּ֣יר הַ/גְּדוֹלָ֔ה וּ/בַשֵּׁ֥ל נָזִ֖יד לִ/בְנֵ֥י הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: tl
  text: Bumalik si Eliseo sa Gilgal. Noon ay may taggutom sa lupain. Nakaupo sa harap niya ang mga anak ng mga propeta[a], at sinabi niya sa kanyang lingkod, “Isalang mo ang malaking palayok at magluto ka ng nilaga para sa mga anak ng mga propeta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alagad ng mga propeta,” na tumutukoy sa isang pamayanan o pangkat ng mga propeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: Bumalik
  rationale: Ang Qal perfect ng שׁוב ay nagsasaad ng pagbabalik sa isang lugar; malinaw at likas sa modernong Tagalog ang “bumalik.”
- source_word: הַגִּלְגָּלָה
  choice: sa Gilgal
  rationale: Ipinahihiwatig ng directional he ang paggalaw patungo sa Gilgal; sapat at natural itong ipinapahayag ng “sa Gilgal” kasunod ng “bumalik.”
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: Noon ay may taggutom sa lupain
  rationale: Ang sugnay na walang tahasang pandiwa ay nagbibigay ng kalagayang pinangyayarihan. Ginagawang natural ng “Noon ay may” ang salaysay nang hindi binabago ang kahulugan.
- source_word: בְנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  rationale: Pinananatili nito ang literal na idyomang Hebreo at ang ugnayang pampamayanan na taglay nito; ipinaliliwanag sa talababa na maaari itong tumukoy sa mga alagad ng mga propeta.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: Nakaupo sa harap niya
  rationale: Pinananatili ng “nakaupo” ang nagpapatuloy na paglalarawan sa tagpo, at ng “sa harap niya” ang pisikal at relasyonal na diwa ng pag-upo sa kanyang presensya.
- source_word: לְנַעֲרוֹ
  choice: sa kanyang lingkod
  rationale: Bagaman maaari ring mangahulugang binata o tagapaglingkod ang נַעַר, ipinakikita ng utos na ginagampanan niya rito ang tungkulin ng isang lingkod.
- source_word: שְׁפֹת
  choice: Isalang mo
  rationale: Sa kontekstong pagluluto, ang pandiwa ay nangangahulugang ilagay ang palayok sa apoy. Tumpak at likas sa Tagalog ang “isalang.”
- source_word: הַסִּיר הַגְּדוֹלָה
  choice: ang malaking palayok
  rationale: Tuwirang ipinapahayag nito ang sisidlang panluto at ang laki nito sa malinaw na modernong Tagalog.
- source_word: וּבַשֵּׁל נָזִיד
  choice: at magluto ka ng nilaga
  rationale: Ang בּשׁל ay pagluluto o pagpapakulo, at ang נָזִיד ay pagkaing niluto sa pagpapakulo, gaya ng stew. Ang “magluto ng nilaga” ay natural at sapat na tiyak sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa idyomang בְנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  alternative: mga alagad ng mga propeta
  rationale: Hindi kinakailangang tumukoy ang parirala sa literal na mga anak; maaaring pangalan ito ng isang pamayanan o pangkat ng mga propeta. Pinananatili sa teksto ang tunay na idyomang Hebreo, habang inilalahad sa talababa ang mas interpretatibong kahulugan upang hindi palihim na lutasin ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinili ang “isalang” bilang likas na salitang panluto at iniwasan ang sobrang teknikal o makalumang pananalita. Inilagay ang talababa sa mismong pariralang “mga anak ng mga propeta,” na siyang ipinaliliwanag nito.
