base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: tl
  text: Sinabi niya kay Gehazi, “Ibigkis mo ang iyong damit sa baywang[a], hawakan mo ang aking tungkod, at humayo ka. Kung may makasalubong kang sinuman[c], huwag mo siyang batiin; at kung may bumati sa iyo, huwag mo siyang sagutin[b]. Ilagay mo ang aking tungkod sa mukha ng bata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bigkisan mo ang iyong mga balakang,” isang idyoma para sa mabilis na paghahanda sa pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “huwag mo siyang pagpalain” at “kung may magpala sa iyo”; dito, malamang na tumutukoy ang pandiwa sa pagbabatian sa daan.
    reason: lexical_alternative
  - marker: c
    text: Ang “sinuman” ay salin ng salitang Hebreo para sa “lalaki,” na ginagamit dito sa pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Isukbit mo ang laylayan ng iyong damit sa iyong baywang
  rationale: Ang literal na Hebreo ay ‘bigkisan mo ang iyong mga balakang,’ isang idyoma ng paghahanda sa mabilis na pagkilos sa pamamagitan ng pagsukbit o pagtali ng mahabang damit. Ginawang malinaw ang aktuwal na kilos sa natural na Tagalog.
- source_word: מִשְׁעַנְתִּי
  choice: aking tungkod
  rationale: Ang pangngalan ay tumutukoy sa tungkod na ginagamit na panukod; ‘tungkod’ ang pinakanatural sa salaysay at angkop sa bagay na ipapatong sa bata.
- source_word: וָלֵךְ
  choice: humayo ka
  rationale: Tuwirang pautos ng pagpunta; pinananatili ng ‘humayo ka’ ang marangal na estilong salaysay at ang agarang pagkakasunod ng mga utos.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Kung may makasalubong kang sinuman
  rationale: Bagaman literal na ‘lalaki’ ang אִישׁ, pangkalahatan ang gamit nito rito para sa sinumang taong makakasalubong sa daan.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: huwag mo siyang batiin / kung may bumati sa iyo
  rationale: Sa konteksto ng pagkikita sa daan, ang ברך ay malamang na tumutukoy sa pagbati, hindi sa pormal na pagpapala. Parehong isinalin ang magkatugmang gamit para luminaw ang tagubilin.
- source_word: לֹא תַעֲנֶנּוּ
  choice: huwag mo siyang sagutin
  rationale: Tuwiran at natural na katumbas ng pandiwang ‘sumagot’ o ‘tumugon,’ na nagpapanatili sa maikli at apurahang utos.
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: Ilagay mo ang aking tungkod sa mukha ng bata
  rationale: Pinananatili ang literal na ‘mukha’ at ang payak na pautos na ‘ilagay.’ Ang הַנָּעַר ay ang anak na lalaki ng Sunamita, kaya natural dito ang ‘bata.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ipinaliwanag sa pangunahing teksto ang sinaunang kilos ng pagbibigkis upang madaling maunawaan, habang pinanatili sa talababa ang literal na idyoma. Iniwasan ang sobrang pormal na ‘batiin ninyo’ dahil isahan at tuwiran ang utos kay Gehazi.
