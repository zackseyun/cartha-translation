  to: Sinabi niya kay Gehazi, “Ibigkis mo ang iyong damit sa baywang[a], hawakan mo ang aking tungkod, at humayo ka. Kung may makasalubong kang sinuman[c], huwag mo siyang batiin; at kung may bumati sa iyo, huwag mo siyang sagutin[b]. Ilagay mo ang aking tungkod sa mukha ng bata.”
