base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: tl
  text: Kaya sinabi niya[a], “Ano ngayon ang dapat gawin para sa kanya?” Sumagot si Gehazi, “Ang totoo, wala siyang anak na lalaki[b], at matanda na ang asawa niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ano ang dapat gawin para sa kanya?”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “walang anak na lalaki para sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas na ipinapakita ng “Kaya” ang pagkakasunod at kaugnayan sa naunang usapan.
- source_word: וּמֶה
  choice: Ano ngayon
  rationale: Pinananatili ng “ano” ang tanong, habang ipinahihiwatig ng “ngayon” ang daloy ng pag-uusap na dala ng prefixed conjunction.
- source_word: לַעֲשׂוֹת לָהּ
  choice: ang dapat gawin para sa kanya
  rationale: Ipinapahayag ng infinitive construct na may ל ang nararapat o nilalayong gawin alang-alang sa babae; natural sa Filipino ang ganitong di-tiyak na balangkas.
- source_word: גֵּיחֲזִי
  choice: Gehazi
  rationale: Itinumbas ang pangalang pantangi ayon sa karaniwang anyo nito sa Filipino.
- source_word: אֲבָל
  choice: Ang totoo
  rationale: Dito ay nagpapakilala ang particle ng mahalagang obserbasyon ni Gehazi, hindi ng matinding pagsalungat; natural na naihahatid ito ng “Ang totoo.”
- source_word: בֵּן אֵין לָהּ
  choice: wala siyang anak na lalaki
  rationale: Tiyak na “anak na lalaki” ang בֵּן, at idiomatiko sa Filipino ang konstruksiyong “wala siyang” para sa Hebreong existential possession.
- source_word: וְאִישָׁהּ
  choice: at ... ang asawa niya
  rationale: Sa konteksto, ang אִישׁ na may hulaping panghalip ay tumutukoy sa asawa niyang lalaki; sapat at natural ang “asawa niya.”
- source_word: זָקֵן
  choice: matanda na
  rationale: Tuwirang ipinapahayag ang katandaan ng asawa, at ang “na” ay natural na nagpapahiwatig ng kalagayang umabot na sa katandaan.
