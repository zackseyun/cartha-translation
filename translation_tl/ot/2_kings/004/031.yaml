base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: tl
  text: Nauna sa kanila si Gehazi at ipinatong niya ang tungkod sa mukha ng bata, ngunit walang tinig at walang tugon.[a] Kaya bumalik siya upang salubungin si Eliseo at iniulat niya kay Eliseo, “Hindi nagising ang bata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “walang tinig at walang pakikinig/pagbibigay-pansin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: Nauna sa kanila
  rationale: Natural na Filipino para sa pag-una ni Gehazi sa landas nina Eliseo at ng babae; pinananatili ang diwa ng paglakad sa unahan.
- source_word: הַמִּשְׁעֶנֶת
  choice: ang tungkod
  rationale: Karaniwan at malinaw na tawag sa gamit ng propeta; hindi ipinapalagay na isa lamang itong baston sa paglalakad.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: sa mukha ng bata
  rationale: Tuwirang pinananatili ang kongkretong kahulugan ng פָּנִים at ang angkop-sa-kontekstong kahulugan ng נַעַר.
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: ngunit walang tinig at walang tugon
  rationale: Ang “tinig” ay malapit sa literal na קוֹל, samantalang ang “tugon” ay natural na naghahatid ng kontekstuwal na diwa ng kawalan ng pakikinig o pagtugon nang hindi ginagawang “walang palatandaan ng buhay.”
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: bumalik siya upang salubungin si Eliseo
  rationale: Malinaw na tinutukoy ang antecedent sa Filipino at pinananatili ang layuning makipagtagpo sa kanya.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: iniulat dito
  rationale: Natural na salaysay sa modernong Filipino; hindi kailangang tularan nang mekanikal ang Hebreong pormulang “sinabi ... na sinasabi.”
- source_word: לֹא הֵקִיץ הַנַּעַר
  choice: Hindi nagising ang bata
  rationale: Tuwiran at natural na salin ng causative/intransitive waking expression sa konteksto ng nabigong pagtatangkang buhayin ang bata.
