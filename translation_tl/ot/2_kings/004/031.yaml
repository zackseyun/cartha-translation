  to: Nauna sa kanila si Gehazi at ipinatong niya ang tungkod sa mukha ng bata, ngunit walang tinig at walang tugon.[a] Kaya bumalik siya upang salubungin si Eliseo at iniulat niya kay Eliseo, “Hindi nagising ang bata.”
