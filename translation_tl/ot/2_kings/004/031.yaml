translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangalang “Eliseo” upang alisin ang posibleng kalabuan ng panghalip sa Filipino. Pinanatili sa pangunahing teksto ang tambalang “walang tinig at walang tugon,” at inilagay sa talababa ang mas literal ngunit hindi gaanong natural na ikalawang parirala.
