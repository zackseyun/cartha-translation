revisions:
- from: At sinabi niya sa kanya[a], “Pakisabi sa babae, ‘Tingnan mo, labis-labis ang pag-aasikaso mo sa amin. Ano ang maaari naming gawin para sa iyo? May maipapakiusap ba kami para sa iyo sa hari o sa pinuno ng hukbo?’” Sumagot ang babae, “Namumuhay ako kasama ng sarili kong bayan.”[b]
  to: At sinabi niya sa kanya[a], “Pakisabi sa babae, ‘Tingnan mo, napakalaki ng pag-aasikasong ginawa mo para sa amin. Ano ang magagawa para sa iyo? May maipapakiusap ba para sa iyo sa hari o sa pinuno ng hukbo?’” Sumagot ang babae, “Namumuhay ako sa gitna ng aking bayan.”[b]
  rationale: Inalis ang hindi ipinahihiwatig na kolektibong tagaganap upang mapanatili ang di-tiyak na anyo ng Hebreo. Inayos din ang huling pahayag upang maipakita nang mas natural at mas malapit ang 'sa gitna ng aking bayan.' Ang natitirang mga pagpili ay nagpapanatili ng magalang at makabagong register.
