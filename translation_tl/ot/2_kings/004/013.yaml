base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: tl
  text: At sinabi niya sa kanya[a], “Pakisabi sa babae, ‘Tingnan mo, napakalaki ng pag-aasikasong ginawa mo para sa amin. Ano ang magagawa para sa iyo? May maipapakiusap ba para sa iyo sa hari o sa pinuno ng hukbo?’” Sumagot ang babae, “Namumuhay ako sa gitna ng aking bayan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanya” ay tumutukoy kay Gehazi; siya ang inutusang magsalita sa babae.
    reason: referent_clarification
  - marker: b
    text: Ang sagot na “Namumuhay ako sa gitna ng aking bayan” ay malamang na nangangahulugang ligtas at maayos ang kalagayan niya sa sarili niyang pamayanan, kaya hindi niya kailangan ng natatanging pabor mula sa hari o sa pinuno ng hukbo.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: labis-labis ang pag-aasikaso mo sa amin
  rationale: Ang magkaugnay na pandiwa at pangngalan ay literal na tumutukoy sa panginginig, pagkabalisa, o matinding pagmamalasakit. Sa konteksto ng pagpapatuloy, ang idyoma ay tumutukoy sa masikap at maingat na pag-aasikaso ng babae, hindi sa takot.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ito sa susunod na pahayag; natural at makabagong katumbas ang “Tingnan mo.”
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Ano ang maaari naming gawin para sa iyo?
  rationale: Itinatanong ng konstruksiyon kung anong pagkilos ang maaaring gawin para sa babae. Ginawang tahasan ang likas na ipinahihiwatig na tagaganap upang maging natural sa Tagalog, habang pinananatili ang diwa ng alok.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: May maipapakiusap ba kami para sa iyo
  rationale: Ang literal na pagsasalita “para sa iyo” ay tumutukoy sa pamamagitan o paghaharap ng kahilingan alang-alang sa babae. Malinaw at natural sa Tagalog ang “maipapakiusap.”
- source_word: שַׂר הַצָּבָא
  choice: pinuno ng hukbo
  rationale: Ang שַׂר ay pinuno o kumander; ang “pinuno ng hukbo” ay malinaw, dignified, at hindi teknikal.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Namumuhay ako kasama ng sarili kong bayan
  rationale: Pinananatili nito ang literal na larawan ng paninirahan sa gitna ng sariling bayan, nang hindi isinasama sa pangunahing teksto ang ipinahihiwatig na seguridad o kasiyahan.
- source_word: נָא
  choice: Paki-
  rationale: Ang magalang na kataga ay likas na naipapahayag sa Tagalog sa unlaping “paki-” sa “Pakisabi.”
