  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: tl
  text: Sinabi niya, “Lumabas ka at humiram[a] ng mga sisidlan mula sa lahat ng kapitbahay mo—mga sisidlang walang laman. Huwag kakaunti ang hihiramin mo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humingi ng mga sisidlan.” Ang pandiwang Hebreo ay maaari ring mangahulugang “humingi,” ngunit sa kontekstong ito ay malamang na tumutukoy sa panghihiram sa mga kapitbahay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Huwag mong gawing kakaunti” o “Huwag mong bawasan.” Sa konteksto, huwag lamang kakaunting sisidlan ang hihiramin.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: Humayo ka
  rationale: Pautos na pambabaeng isahan na nagsusugo sa babae upang kumilos; dignified at natural sa salaysay.
- source_word: שַׁאֲלִי
  choice: humiram ka
  rationale: Bagaman maaari itong mangahulugang ‘humingi,’ ipinahihiwatig ng konteksto ang pansamantalang pagkuha ng mga sisidlan mula sa mga kapitbahay.
- source_word: כֵּלִים
  choice: mga sisidlan
  rationale: Malawak ang saklaw ng salitang Hebreo para sa mga gamit o lalagyan; ang ‘sisidlan’ ay angkop sa paglalagyan ng langis nang hindi tinutukoy ang isang partikular na uri.
- source_word: לָךְ
  choice: para sa iyong sarili
  rationale: Pinananatili ang diwang benefactive at personal na pakikilahok na nasa panghalip na Hebreo.
- source_word: מִן הַחוּץ
  choice: mula sa labas
  rationale: Tuwirang pinananatili ang ekspresyong Hebreo at ang kaibahan sa mga nasa loob ng bahay.
- source_word: מֵאֵת כָּל שכנכי
  choice: mula sa lahat ng iyong mga kapitbahay
  rationale: Likas at tuwirang salin ng pariralang tumutukoy sa mga taong nakatira sa paligid niya.
- source_word: כֵּלִים רֵקִים
  choice: mga sisidlang walang laman
  rationale: Pinananatili ang pag-uulit ng ‘mga sisidlan’ at malinaw na ipinahahayag na dapat walang laman ang mga ito.
- source_word: אַל תַּמְעִיטִי
  choice: Huwag kang kumuha ng kakaunti lamang
  rationale: Inihahatid ang puwersa ng Hiphil na huwag paliitin o limitahan ang bilang, sa natural na modernong Tagalog.
