revisions:
- from: Sinabi niya, “Humayo ka at humiram ka para sa iyong sarili ng mga sisidlan mula sa labas, mula sa lahat ng iyong mga kapitbahay—mga sisidlang walang laman. Huwag kang kumuha ng kakaunti lamang.”
  to: Sinabi niya, “Lumabas ka at humiram[a] ng mga sisidlan mula sa lahat ng kapitbahay mo—mga sisidlang walang laman. Huwag kakaunti ang hihiramin mo.[b]”
  rationale: Inayos ang salin upang maging natural na modernong Tagalog habang pinananatili ang lawak ng “mga sisidlan,” ang pag-uulit ng “mga sisidlang walang laman,” at ang utos na huwag kakaunti ang kunin. Nagdagdag ng mga talababa para sa leksikal na alternatibo ng “humiram” at sa idiomatikong huling utos.
