translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'kilalang babae' upang mapanatili ang lawak ng אִשָּׁה גְדוֹלָה, at 'kumain' para sa idyomang Hebreo na literal na 'kumain ng tinapay.'
