base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: tl
  text: Isang araw, dumaan si Eliseo sa Shunem. May isang babaeng may mataas na katayuan roon[a], at mahigpit niyang hinimok si Eliseo na kumain. Kaya tuwing napapadaan si Eliseo, tumitigil siya roon upang kumain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang dakilang babae”; malamang na tumutukoy ito sa kaniyang mataas na katayuan, impluwensiya, o kayamanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Isang araw
  rationale: Likas na pambungad sa salaysay sa modernong Tagalog at tapat sa panandang temporal ng Hebreo.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: dumaan si Eliseo sa Shunem
  rationale: Ipinahahayag ang paglalakbay ni Eliseo sa lugar nang hindi labis na tinutukoy kung tumawid siya rito o nagpunta lamang dito.
- source_word: אִשָּׁה גְדוֹלָה
  choice: isang kilalang babae
  rationale: Ang גְדוֹלָה ay malamang na tumutukoy sa mataas na katayuan, impluwensiya, o kayamanan; ang 'kilalang' ay natural at hindi nililimitahan ang diwa sa yaman lamang.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: mahigpit niya itong hinimok
  rationale: Ipinapanatili ang lakas ng pandiwang Hebreo, na nagpapahiwatig ng mapilit ngunit mapagpatuloy na paghimok.
- source_word: לֶאֱכָל לָחֶם
  choice: upang kumain
  rationale: Ang literal na 'kumain ng tinapay' ay isang idyoma para sa pagkain o pagsasalo; sapat at natural sa Tagalog ang 'kumain' nang hindi ipinahihiwatig na tinapay lamang ang inihain.
- source_word: מִדֵּי עָבְרוֹ
  choice: tuwing napapadaan si Eliseo
  rationale: Malinaw na ipinakikita ang paulit-ulit na pangyayari sa konstruksyong Hebreo.
- source_word: יָסֻר שָׁמָּה
  choice: tumitigil siya roon
  rationale: Natural na Tagalog para sa paglihis o pagtuloy sa bahay na iyon habang dumaraan.
