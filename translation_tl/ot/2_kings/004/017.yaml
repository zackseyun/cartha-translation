translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pag-uulit ng dalawang magkaugnay na pahayag tungkol sa takdang panahon, ngunit isinalin ang Hebreong idyoma ayon sa kahulugan nito at ibinigay sa talababa ang mas literal na anyo.
