base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: tl
  text: Nagdalang-tao ang babae at nagsilang ng isang anak na lalaki sa takdang panahong iyon, sa ganitong panahon sa susunod na taon[a], gaya ng sinabi ni Eliseo sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa takdang panahong ito, sa panahon ng buhay”; isang idyomang tumutukoy sa halos gayunding panahon sa susunod na taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: nagdalang-tao
  rationale: Ang qal na pandiwang הרה ay tumutukoy sa paglilihi o pagiging buntis. Ang “nagdalang-tao” ay natural, malinaw, at marangal sa makabagong Filipino.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה, ngunit dito ay tumutukoy ito sa babaeng Sunamita na nauna nang ipinakilala.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Karaniwang pahayag ito sa Hebreo para sa panganganak ng anak na lalaki. Malinaw at angkop sa salaysay ang salin.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: sa takdang panahong iyon
  rationale: Ang מוֹעֵד ay isang itinakda o tiyak na panahon. Ginamit ang “iyon” sapagkat binabalikan ng salaysay ang panahong naunang ipinangako.
- source_word: כָּעֵת חַיָּה
  choice: sa ganitong panahon nang sumunod na taon
  rationale: Ang idyoma ay tumutukoy sa halos gayunding panahon o kapanahunan sa susunod na taon. Inihahatid ng salin ang temporal na diwa habang inilalagay sa talababa ang mas literal na anyo.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: gaya ng sinabi ni Eliseo sa kanya
  rationale: Ipinapakita ng sugnay na natupad ang naunang sinabi ni Eliseo. Natural sa Filipino ang “gaya ng sinabi” at hindi nito dinaragdagan ang diin ng Hebreo.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Elisha sa mga saling Filipino ng Biblia.
