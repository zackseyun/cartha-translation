  terminology: Ang “Eliseo” ay ang nakaugaliang Filipino na anyo ng pangalan. Ang “takdang panahon” ay sapat na katumbas ng מוֹעֵד. Pinananatili ng talababa ang literal na anyo at ipinapaliwanag ang idyoma nang walang doktrinal na pagpapakahulugan.
