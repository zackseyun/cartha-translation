  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: tl
  text: Pagkatapos ay umakyat siya at inihiga ang bata sa higaan ng tao ng Diyos, isinara ang pinto sa likuran ng bata[a], at lumabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isinara ang pinto na naiwan ang bata sa loob ng silid.” Ipinahihiwatig ng Hebreong pananalita na nasa loob ang bata nang isara niya ang pinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: Pagkatapos ay umakyat siya
  rationale: Pinananatili ng “umakyat” ang tiyak na kilos na ipinahihiwatig ng עלה, samantalang ang “Pagkatapos ay” ay natural na naghahayag ng sunod-sunod na pangyayari sa salaysay.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: inihiga ang bata
  rationale: Ang anyong causative ng שׁכב ay tumutukoy sa pagpapahiga sa kaniya. Ginamit ang “ang bata” sa halip na isang malabong panghalip upang maging malinaw sa natural na Tagalog nang walang idinaragdag na impormasyon mula sa labas ng konteksto.
- source_word: מִטַּת
  choice: higaan
  rationale: Ang מִטָּה ay karaniwang tumutukoy sa kama o lugar na hinihigaan; ang “higaan” ay natural at angkop sa kasalukuyang Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Tuwirang pinananatili nito ang Hebreong titulo at hindi ito nililimitahan sa interpretatibong saling “propeta ng Diyos.”
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: isinara ang pinto habang nasa loob ang bata
  rationale: Sa pariralang ito, ipinahihiwatig ng בְּעַד na isinara niya ang pinto upang maiwang nasa loob ng silid ang bata. Iniiwasan ng salin ang malabong literal na pariralang “sa likuran niya,” yamang nakahiga ang bata sa higaan.
- source_word: וַתֵּצֵא
  choice: at lumabas
  rationale: Tuwirang ipinapahayag ng “lumabas” ang konkretong kilos ng יצא nang hindi nagdaragdag kung saan siya nagtungo.
