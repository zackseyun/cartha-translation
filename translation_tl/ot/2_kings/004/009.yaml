  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: tl
  text: At sinabi niya sa kanyang asawa, “Tingnan mo, alam kong ang lalaking ito na regular na dumaraan sa atin[a] ay isang banal na tao ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “palaging dumaraan sa atin.”
    reason: Maaaring ipahayag ng תָּמִיד ang nakaugaliang regular na pagdaan o, sa mas tuwirang pagbasa, ang palaging pagdaan.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi niya
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa Filipino ang “At sinabi niya” bilang payak na pagpapatuloy ng pangyayari.
- source_word: אֶל אִישָׁהּ
  choice: sa kanyang asawa
  rationale: Sa kontekstong pantahanan, ang אִישׁ na may hulaping 3fs ay tumutukoy sa asawa niyang lalaki; sapat at likas sa Filipino ang “asawa.”
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Ginagamit ang parirala upang tawagin ang pansin ng kausap. Pinananatili ng “Tingnan mo” ang puwersa nito sa natural at makabagong Filipino.
- source_word: יָדַעְתִּי
  choice: alam kong
  rationale: Ipinapahayag ng anyong ganap ang matatag nang pagkilala bunga ng paulit-ulit na pagmamasid; natural itong sabihin bilang “alam kong.”
- source_word: אִישׁ אֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang kinikilalang titulong Hebreo para sa isang propeta o sugo ng Diyos nang hindi ito pinapakahulugang basta “maka-Diyos na tao.”
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ang “banal” ang tuwiran at karaniwang katumbas ng ideya ng pagiging nakatalaga o ibinukod para sa Diyos.
- source_word: הוּא
  choice: ang lalaking ito ... ay
  rationale: Sa sugnay na nominal, natural sa Filipino na ipahayag ang pagtukoy sa taong pinag-uusapan sa pamamagitan ng “ang lalaking ito” at ng panandang “ay.”
- source_word: עֹבֵר עָלֵינוּ
  choice: dumaraan sa atin
  rationale: Sa konteksto ng paglalakbay, tumutukoy ito sa pagdaan malapit sa kanilang tahanan o lugar; natural sa Filipino ang “dumaraan sa atin.”
- source_word: תָּמִיד
  choice: palaging
  rationale: Ipinahihiwatig sa konteksto ang nakaugaliang paulit-ulit na pagdaan, hindi kinakailangang walang patid na kilos. Pinananatili ng talababa ang mas tuwirang alternatibo.
theological_decisions:
- issue: Pagsasalin sa titulong אִישׁ אֱלֹהִים
  choice: tao ng Diyos
  alternative: taong maka-Diyos; taong pag-aari ng Diyos
  rationale: Ang parirala ay kinikilalang titulo sa mga salaysay tungkol sa mga propeta. Pinananatili ng “tao ng Diyos” ang pampanitikan at teolohikal na puwersa nito nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tao ng Diyos” bilang pamilyar na titulong biblikal, at inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinutukoy nito.
