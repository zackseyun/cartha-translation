  to: Sinabi niya sa kanyang ama, “Ulo ko, ulo ko!” Pagkatapos, sinabi ng kanyang ama sa binata[a], “Kargahin mo siya patungo sa kanyang ina.”
  rationale: Inalis ang artikulong “Ang” sa inuulit na daing upang maging likas at matindi ang Tagalog habang pinananatili ang terseness ng Hebreo. Pinalitan ang tambalang “Buhatin mo siya at dalhin” ng “Kargahin mo siya patungo” upang tuwirang maihatid ang iisang utos na dalhin o pasanin ang bata tungo sa kanyang ina. Pinagaan din ang talababa nang hindi inaalis ang leksikal na ambigwidad ng נַעַר.
