  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: tl
  text: Sinabi niya sa kanyang ama, “Ulo ko, ulo ko!” Pagkatapos, sinabi ng kanyang ama sa binata[a], “Kargahin mo siya patungo sa kanyang ina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batang lalaki” o “tagapaglingkod.” Ang salitang Hebreo na נַעַר ay maaaring tumukoy sa isang batang lalaki, binata, o tagapaglingkod, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אָבִיו
  choice: Sinabi niya sa kanyang ama
  rationale: Pinananatili ang karaniwang diwa ng אמר na ‘sabihin’ at ang tuwirang ugnayang pampamilya ng אָבִיו, nang hindi idinaragdag na sumigaw ang bata.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Ang ulo ko, ang ulo ko!
  rationale: Pinananatili ang maikli at paulit-ulit na sigaw ng Hebreo. Hindi idinagdag ang ‘masakit’ bagaman malinaw sa konteksto na nagpapahayag ito ng matinding paghihirap.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi ng kanyang ama
  rationale: Ipinahihiwatig ng sunod na pandiwa ang pag-usad ng salaysay. Nilinaw ang ama bilang nagsasalita ayon sa agarang konteksto upang maging natural at malinaw sa Tagalog.
- source_word: אֶל־הַנַּעַר
  choice: sa binata[a]
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, binata, tagapaglingkod, o katulong. Ang ‘binata’ ay hindi labis na nagpapasya sa tungkulin niya, samantalang ipinapaliwanag sa talababa ang posibleng kahulugang ‘katulong’ o ‘lingkod.’
- source_word: שָׂאֵהוּ
  choice: Buhatin mo siya at dalhin
  rationale: Sa kontekstong ito, hinihiling ng utos na pisikal na buhatin ang bata patungo sa kanyang ina. Likas sa Tagalog ang tambalang pariralang ito at malinaw nitong naihahatid ang kilos.
- source_word: אֶל־אִמּוֹ
  choice: sa kanyang ina
  rationale: Tuwirang salin ng pariralang pampamilya, sa dignidad na angkop sa salaysay at katapat ng ‘ama.’
