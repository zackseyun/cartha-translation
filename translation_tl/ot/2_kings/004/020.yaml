  source_fidelity: 'Tumpak ang pangunahing daloy ng salaysay: binuhat at dinala ng lingkod ang bata sa ina nito, naupo ito roon hanggang tanghali, at namatay. Gayunman, ang “sa mga tuhod nito” ay labis na literal at ang “nito” ay karaniwang ginagamit sa bagay o hayop, kaya hindi angkop sa pagtukoy sa ina. Ang “kandungan ng kanyang ina” ay isang ligtas at natural na katumbas ng Hebreong “sa mga tuhod niya,” habang pinananatili ng talababa ang literal na anyo.'
  naturalness: Mas natural sa modernong Filipino ang “Naupo ang bata sa kandungan ng kanyang ina hanggang tanghali.” Iniiwasan nito ang di-natural at posibleng walang-galang na “mga tuhod nito,” at malinaw pa rin ang ugnayan ng bata at ng ina.
