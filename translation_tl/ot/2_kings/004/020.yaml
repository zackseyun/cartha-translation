translation_notes:
  register: Modernong Filipino na simple, marangal, at angkop sa salaysay. Ginamit ang “nito” para malinaw na ang mga tuhod ay sa ina, habang ang talababa ay nagbibigay ng mas karaniwang idyomang Filipino.
