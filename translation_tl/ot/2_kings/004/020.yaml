  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: tl
  text: Binuhat siya ng lingkod at dinala sa kanyang ina. Naupo ang bata sa kandungan ng kanyang ina[a] hanggang tanghali, at pagkatapos ay namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tuhod ng kanyang ina”; ganito ang literal na Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: Binuhat siya ng lingkod
  rationale: Ang נשׂא ay maaaring mangahulugang buhatin o dalhin. Ang “binuhat” ay likas sa kontekstong dinadala ng lingkod ang maysakit na bata; nilinaw ang di-lantad na simuno mula sa naunang konteksto.
- source_word: וַיְבִיאֵהוּ אֶל אִמּוֹ
  choice: at dinala sa kanyang ina
  rationale: Ang Hiphil ng בוא ay karaniwang “dalhin,” at pinananatili ng parirala ang direksiyon patungo sa ina.
- source_word: וַיֵּשֶׁב
  choice: Umupo ang bata
  rationale: Ang ישׁב ay may pangunahing diwang “umupo/manatili.” Ang tahasang “ang bata” ay natural na paglilinaw sa Filipino upang maiwasang mapagkamalang lingkod ang umupo.
- source_word: עַל בִּרְכֶּיהָ
  choice: sa mga tuhod nito
  rationale: Tahasang maramihan ang בִּרְכֶּיהָ, “mga tuhod niya.” Pinanatili sa pangunahing teksto ang anyong pinakamalapit sa Hebreo; ang mas idiomatikong “sa kandungan niya” ay inilagay sa talababa.
- source_word: עַד הַצָּהֳרַיִם
  choice: hanggang katanghaliang-tapat
  rationale: Ang צָהֳרַיִם ay tumutukoy sa tanghali; ang “katanghaliang-tapat” ay malinaw at natural sa modernong Filipino.
- source_word: וַיָּמֹת
  choice: at pagkatapos ay namatay siya
  rationale: Ipinahahayag nito ang kasunod na pangyayari sa salaysay nang hindi binabago ang tuwirang pahayag na namatay ang bata.
