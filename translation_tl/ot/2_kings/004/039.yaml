base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: tl
  text: Lumabas ang isa sa kanila patungo sa bukid upang mamitas ng mga halamang makakain.[a] Nakakita siya ng isang ligaw na baging at namitas mula rito ng mga ligaw na bungang tulad ng kalabasa.[b] Pinuno niya ng mga iyon ang kanyang damit. Pagbalik niya, hiniwa niya ang mga iyon sa palayok ng nilagang pagkain, sapagkat hindi nila alam kung ano ang mga iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga gulay.” Malawak ang kahulugan ng salitang Hebreo at tumutukoy sa mga halamang makakain na tinitipon sa bukid.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “baging sa bukid” at “mga bunga sa bukid”; ibig sabihin, ligaw na baging na may mga ligaw na bungang tulad ng kalabasa. Hindi tiyak ang espesye ng mga bungang ito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bagaman hindi nila alam” o “dahil hindi nila alam.” Maaaring basahin bilang paliwanag ang pang-ugnay na Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: ang isa sa kanila
  rationale: Ginagamit ang bilang bilang pangngalan para sa isang miyembro ng pangkat. Likas sa Tagalog ang “isa sa kanila” at hindi na kailangang ulitin ang salitang “lalaki,” na malinaw na sa konteksto.
- source_word: לְלַקֵּט אֹרֹת
  choice: upang mamitas ng mga halamang makakain
  rationale: Malawak ang saklaw ng אֹרֹת at tumutukoy sa mga halamang o luntiang dahong tinitipon bilang pagkain. Malinaw at hindi labis na tiyak ang saling ito.
- source_word: גֶּפֶן שָׂדֶה
  choice: isang ligaw na baging
  rationale: Ang literal na “baging sa bukid” ay tumutukoy sa halamang baging na tumutubong ligaw. Mas natural sa modernong Tagalog ang “ligaw na baging.”
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: mga ligaw na kalabasa
  rationale: Tumutukoy ito sa bungang tulad ng kalabasa mula sa ligaw na baging, marahil colocynth. Iniiwasan ng saling ito ang teknikal at di-tiyak na pagkilala sa espesye.
- source_word: מְלֹא בִגְדוֹ
  choice: Pinuno niya ng mga iyon ang kanyang damit
  rationale: Pinananatili nito ang kongkretong larawan ng damit na ginamit bilang sisidlan at ang dami ng napitas, nang hindi ipinapalagay na balabal ang tiyak na uri ng kasuotan.
- source_word: וַיְפַלַּח
  choice: hiniwa niya ang mga iyon
  rationale: Ang pandiwa ay nangangahulugang hatiin o hiwain. Ginawang tahasan ang ipinahihiwatig na layon upang maging natural sa Tagalog.
- source_word: סִיר הַנָּזִיד
  choice: palayok ng nilaga
  rationale: Ang נָזִיד ay pagkaing niluluto o stew. Ang “palayok ng nilaga” ay karaniwan, malinaw, at hindi arkaiko.
- source_word: כִּי לֹא יָדָעוּ
  choice: sapagkat hindi nila alam kung ano ang mga iyon
  rationale: Maaaring magpaliwanag ng dahilan ang כִּי. Nilinaw sa Tagalog ang ipinahihiwatig na layon ng kanilang hindi pagkaalam, habang itinatala sa talababa ang posibilidad ng ibang ugnayan sa salaysay.
