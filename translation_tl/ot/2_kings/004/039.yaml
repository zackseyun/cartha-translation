  naturalness: Natural at malinaw ang pangungusap. Ang “palayok ng nilaga” ay naiintindihan ngunit medyo may tiyak na asosasyong pangkulturang Filipino; ang “palayok ng nilagang pagkain” ay mas malinaw sa tungkuling paglalarawan nito bilang stew.
  terminology: Wasto ang “ligaw na baging,” “mga halamang makakain,” at ang paglalarawan sa damit bilang pansamantalang sisidlan. Iningatan ng rebisyon ang di-tiyak na botanikal na pagkakakilanlan ng mga bunga.
