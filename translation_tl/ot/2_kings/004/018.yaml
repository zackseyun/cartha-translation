  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: tl
  text: Lumaki ang bata[a]. Isang araw, lumabas siya upang puntahan ang kaniyang ama, na kasama ng mga manggagapas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: Lumaki
  rationale: Ang גדל ay tumutukoy rito sa paglaki ng bata. Ang “lumaki” ay natural at hindi nagpapahiwatig nang higit sa sinasabi ng Hebreo.
- source_word: הַיָּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay maaaring tumukoy sa isang bata o batang lalaki. Natural sa modernong Tagalog ang “bata,” at hindi nito nililimitahan nang hindi kailangan ang ipinahihiwatig na edad.
- source_word: וַיְהִי הַיּוֹם
  choice: Isang araw
  rationale: Idyomang Hebreo itong nagpapakilala ng isang partikular na pangyayari; malinaw at likas sa Tagalog ang “Isang araw.”
- source_word: וַיֵּצֵא
  choice: pumunta siya
  rationale: Literal na may diwang “lumabas” ang יצא, ngunit sa kontekstong pagpunta sa bukid, mas natural ang “pumunta.” Naipahihiwatig ng kasunod na parirala ang pagkilos patungo sa ibang lugar.
- source_word: אֶל אָבִיו
  choice: sa kaniyang ama
  rationale: Ipinahihiwatig ng אֶל ang pagkilos patungo sa ama; tuwiran at natural ang “sa kaniyang ama.”
- source_word: אֶל הַקֹּצְרִים
  choice: sa kinaroroonan ng mga manggagapas
  rationale: Ang קֹצְרִים ay mga taong gumagapas ng butil. Nililinaw ng “sa kinaroroonan” na ang ama ay kasama o nasa lugar ng mga manggagapas, habang pinananatili ang ikalawang אֶל.
