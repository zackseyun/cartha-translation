  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: tl
  text: Pagpasok ni Eliseo sa bahay, naroon ang bata—patay at nakahiga sa higaan ni Eliseo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inihiga sa higaan ni Eliseo.” Maaaring idiin ng anyong Hebreo na inihiga o inilagay roon ang bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Ang wayyiqtol ng בוא ay nagsusulong ng salaysay bilang payak na nagdaang kilos. Kasama ng directional he sa הַבָּיְתָה, malinaw na tumutukoy ito sa pagpasok sa bahay.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: הַבָּיְתָה
  choice: sa bahay
  rationale: Ang directional he ay nagpapahiwatig ng pagkilos papasok sa bahay; natural itong naipapahayag sa pariralang “pumasok ... sa bahay.”
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinakikita ng הִנֵּה ang bigla at matingkad na pagharap sa nakita ni Eliseo. Ang “naroon” ay natural sa Tagalog at pinananatili ang presentational force nang hindi gumagamit ng lipas na “narito.”
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Sa konteksto, ang נַעַר ay anak ng Sunamita. Ang “bata” ay natural at hindi nagpapalagay ng mas tiyak na edad kaysa sa Hebreo.
- source_word: מֵת
  choice: patay
  rationale: Inilalarawan nito ang kalagayan ng bata nang dumating si Eliseo, hindi lamang ang naunang pangyayari ng pagkamatay.
- source_word: מֻשְׁכָּב
  choice: nakahiga
  rationale: Ang passive participle ay naglalarawan sa batang nasa kalagayang nakahimlay o nakahiga. Natural ang “nakahiga” sa Tagalog, habang ipinapaliwanag sa talababa ang posibleng diin na siya ay inihiga roon.
- source_word: עַל מִטָּתוֹ
  choice: sa kanyang higaan
  rationale: Tuwirang ipinapahayag ang lokasyon. Ang “higaan” ay dignified at natural, at ang panghalip ay tumutukoy kay Eliseo ayon sa konteksto ng naunang talata.
theological_decisions:
- issue: Ang tinutukoy ng hulaping panghalip sa מִטָּתוֹ
  choice: kanyang higaan
  alternative: higaan ni Eliseo
  rationale: Panlalaki at isahan lamang ang tahasang ipinakikita ng anyo. Bagaman malinaw sa konteksto na higaan ni Eliseo ito, pinananatili ng panghalip ang anyo at bahagyang implicit na katangian ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “naroon” upang ihatid nang natural ang biglang presentasyon ng וְהִנֵּה. Inilagay ang talababa pagkatapos ng buong pahayag na tinutukoy nito, at pinanatili ang posibleng passive-resultative na kahulugan ng מֻשְׁכָּב bilang alternatibo.
